logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\wab.exe'
    - '\wabmig.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\WinSxS\'
    - 'C:\Program Files\Windows Mail\'
    - 'C:\Program Files (x86)\Windows Mail\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection identifies the execution of `wab.exe` (Windows Contacts) and `wabmig.exe` (Microsoft Address Book Import Tool) originating from non-default file locations, indicating potential execution patterns associated with the Bumblebee loader malware. The attackers using this method may aim to establish persistence or further exploit the compromised system by leveraging these tools, which are not typically invoked outside their default locations.

  The relevant MITRE ATT&CK tactics and techniques are Execution (T1203) and Defense Evasion (T1070). The primary telemetry sources are process creation logs from Windows, particularly Event ID 4688. If confirmed, this behavior can lead to unauthorized data access or lateral movement within the network. However, this detection does NOT confirm malicious intent on its own, as it may include legitimate system activity under specific circumstances.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 for process creation events featuring `wab.exe` or `wabmig.exe` and verify their execution paths.

  - **Evaluate execution paths**: If the execution path is within non-default directories (i.e., not `C:\Windows\WinSxS\` or `C:\Program Files\Windows Mail\`), this indicates a higher likelihood of malicious intent.

  - **Cross-reference user accounts**: Analyze associated user accounts in the logs and verify if the user has a legitimate reason for executing these applications from unusual locations, considering typical user roles and expected behaviors.

  - **Inspect for follow-on activity**: Check for any subsequent process executions or network connections initiated by `wab.exe` or `wabmig.exe` using Sysmon Event ID 1 and Event ID 3 to trace any external command and control communications.

  - **Review file system changes**: Monitor for file creation and modification events in conjunction with the execution of these tools, looking for unusual file artifacts that might suggest data exfiltration, recorded in Sysmon Event ID 11.

  - **Identify benign comparisons**: Recognize that legitimate usage of `wab.exe` or `wabmig.exe` might occur during system migrations or updates, specifically during software installs or upgrades conducted by IT personnel.

  ### Prioritization

  This alert warrants high priority as it involves a critical system component, and its occurrence outside normal operational behavior is often associated with malware tactics. Given the emerging use of such techniques for delivery and persistence by adversaries, timely investigation is crucial for preventing lateral movement or data breaches.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for attackers to obfuscate their methods through legitimate use of the tools or alternate methods of execution. For effective detection, comprehensive logging of process execution, including high-volume event retention, is essential. Legitimate user activity, such as app installations or migrations, could trigger this alert. A companion detection to consider includes monitoring any abnormal PowerShell execution patterns (T1086) that might be employed to bypass this detection.

