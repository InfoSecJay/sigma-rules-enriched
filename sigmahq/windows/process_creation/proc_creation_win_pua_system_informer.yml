note: |
  ### Technical Context

  This Sigma rule detects the execution of System Informer, a tool used to manage processes and perform low-level operations on Windows systems. The likely objective for an adversary using System Informer would be to conduct reconnaissance, maintain persistence, or escalate privileges by manipulating processes and system components. Relevant MITRE ATT&CK techniques include Discovery (T1082), Privilege Escalation (T1543), and other stealth tactics (T1564). The primary telemetry source is the process creation logs from Windows, specifically focusing on Event ID 4688 and Sysmon Event ID 1. A malicious execution of System Informer could lead to unauthorized access to system resources and potential data exfiltration. Note that this detection alone does NOT confirm malicious intent, as System Informer may also be used by system administrators for legitimate purposes.

  ### Investigation Steps

  - **Review the execution context:** Check the process creation logs for Event ID 4688 and Sysmon Event ID 1. Look for the command line arguments and the parent process; legitimate executions often originate from management consoles or known administrative tools, while suspicious cases may have unusual parent processes.

  - **Analyze the hashes of the executable:** Verify the hashes of 'SystemInformer.exe' against known malicious indicators. Use the SHA256 hash `8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287` as a high-confidence malicious indicator. If these hashes are matched in logs, consider the execution as potentially malicious.

  - **Inspect related user activity:** Check the user history for the account that executed System Informer. Use Windows Security logs (Event ID 4624 for successful logins) and correlate against recent administrative or privilege-escalation activities. Be alert for accounts that commonly don’t run process management tools.

  - **Identify legitimate usage patterns:** Document typical processes for your environment that would involve legitimate use of System Informer, such as routine scripting or system health checks performed by DevOps teams. Compare this baseline to current detections to discern between benign and malicious actions.

  - **Correlate with network activity:** Review network logs for connections initiated by the host running System Informer (e.g., outbound connections to unusual addresses or domains). This can help identify data exfiltration or command and control communications tied to the execution of the tool.

  - **Check for presence of similar tools:** Look for additional instances of system tools commonly abused by adversaries. Use similar detections related to process management software (related rule ID: 811e0002-b13b-4a15-9d00-a613fce66e42). Identifying a pattern may indicate a broader incident.

  ### Prioritization

  This alert should be prioritized as medium severity within an enterprise context. The presence of System Informer execution indicates potential reconnaissance or privilege escalation activity. The likelihood of malevolent use is heightened as this behavior aligns with common exploitation patterns in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of System Informer by administrators. If auditing is not configured correctly, certain logs may be missed. Additionally, users with administrative privileges may have a higher chance of legitimate usage, which can trigger false positives. Related detections covering other process management tools can enhance coverage and reduce blind spots, suggesting a need for comprehensive monitoring of all utilities that manipulate processes.

