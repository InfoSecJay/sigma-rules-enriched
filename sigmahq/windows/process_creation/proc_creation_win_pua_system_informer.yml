  ---

  ### Technical Context

  This Sigma rule detects the execution of System Informer, a knowledge tool that allows users to view and manipulate processes and system information at a low level. The likely attacker objective behind this behavior is to gain persistence, escalate privileges, or perform reconnaissance on the system. This activity correlates with MITRE ATT&CK techniques such as **Discovery** (T1082) and **Privilege Escalation** (T1543).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, it can indicate unauthorized access or attempts to evade security controls. However, this detection does NOT confirm malicious intent on its own, as System Informer can be used legitimately by system administrators.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the presence of `SystemInformer.exe`, looking for details in the CommandLine and ParentImage fields to assess if it was launched by a known process.

  - **Analyze the file hash:** Verify the executable's hash against known good values. The detected `SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287` should match legitimate distributions. Any deviation may indicate tampering or a malicious variant.

  - **Review recent user activity:** Check the account making the request in Active Directory logs. Determine if the user has a legitimate reason to execute System Informer. Legitimate users such as IT staff may invoke it for troubleshooting, whereas unexpected user activity may raise suspicion.

  - **Identify Parent Processes:** Look at the ParentImage of the detected System Informer process. Legitimate launches generally originate from tools like PowerShell or administrative tools, while anomalous sources may indicate malicious workflows.

  - **Investigate for alternate indicators:** Look for other execution artifacts like modified time stamps or suspicious file creations in directories related to recent user activity, which could indicate additional malicious behavior.

  ---

  ### Prioritization

  The alert severity is medium due to the potential for misuse of the System Informer tool in environments where sensitive data or critical systems reside. The likelihood of malicious abuse is moderate as this tool can enable reconnaissance and privilege escalation. However, its legitimate use in trusted contexts must also be considered.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion via process renaming or using similar tools to avoid detection. Reliable detection requires proper configuration of Sysmon for process logging and ensuring the system is monitored consistently. Legitimate activities, such as automated system maintenance scripts, may trigger the alert. A related detection to strengthen coverage involves monitoring for executing tasks from unauthorized administrative scripts.

