note: |
  ### Technical Context

  This rule detects the unloading of Sysmon filter drivers through the `fltmc.exe` utility. Such behavior indicates potential attempts by an attacker to evade detection mechanisms, as disabling Sysmon can hinder visibility into malicious activities on the system. The likely attacker objective is to manipulate or disable logging components to facilitate further malicious actions without detection. The relevant MITRE ATT&CK tactics and techniques involved are **Defense Evasion (T1562)** and **Indicator Removal on Host (T1070)**.

  The primary telemetry source is Windows event logs related to process creation, specifically focusing on Sysmon logs. If malicious, the security impact includes a significant degradation in logging coverage, which could allow persistent threats to operate undetected. However, this detection does NOT confirm malicious intent on its own, as legitimate scenarios may also trigger this behavior.

  ### Investigation Steps

  - **Investigate process creation logs:** Check Sysmon Event ID 1 and Security Event ID 4688 for instances where `fltmc.exe` is invoked. Look for unusual command line parameters involving 'unload sysmon' which should raise suspicion.

  - **Validate legitimate behavior:** Confirm expected Sysmon operations where `fltmc.exe` may unload drivers for legitimate reasons, such as during system updates or administrative maintenance tasks. Note the lack of unload processes in normal operations.

  - **Identify high-confidence malicious indicators:** Cross-reference timestamps of the unloading event with known malicious indicators, such as the presence of related artifacts or behaviors, including unusual network activity or persistence mechanisms.

  - **Review system state pre- and post-unloading:** Check for changes in Sysmon configurations by reviewing changes in Sysmon Event ID 10 ('RegistryEvent') and its correlation with the time of the `fltmc.exe` command execution.

  - **Examine other system activity:** Perform a comprehensive review of subsequent process creations following the unload event. Look for processes typically associated with malicious activity that may indicate exploitation opportunities.

  ### Prioritization

  This alert is classified as high severity due to its potential impact on system integrity and visibility, as disabling Sysmon severely decreases the organization’s ability to detect advanced threats. The likelihood of malicious abuse is significant since this technique is commonly utilized to evade detection by malware operators.

  ### Blind Spots and Assumptions

  Detection can be bypassed if an adversary uses alternative methods to unload Sysmon without invoking `fltmc.exe`, or if logging capabilities are not configured to capture these unload events. Legitimate administrative actions, such as maintenance or troubleshooting by IT personnel, could inadvertently trigger this alert. A companion detection rule involving changes to Sysmon configuration (e.g., registry modifications via Event ID 10) would enhance coverage against stealth-related activities.

