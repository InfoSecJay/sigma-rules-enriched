detection:
  selection_img:
    Image|endswith:
    - 'python.exe'         # no \ bc of e.g. ipython.exe
    - 'python3.exe'
    - 'python2.exe'
  selection_cli_1:
    CommandLine|contains|all:
    - 'import pty'
    - '.spawn('
  selection_cli_2:
    CommandLine|contains: 'from pty import spawn'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Unknown
