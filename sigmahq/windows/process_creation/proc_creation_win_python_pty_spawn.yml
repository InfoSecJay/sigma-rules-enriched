note: |
  ### Technical Context

  This Sigma rule detects instances of Python spawning a pseudo-terminal (TTY) using code that indicates an attempt to create an interactive shell via the `pty` library. This behavior often suggests an attacker is executing commands in a controlled command-line environment on a compromised host, which may facilitate further exploitation or data exfiltration. The MITRE ATT&CK frameworks relevant here are Execution (T1203) and Scripting (T1059), specifically targeting the command line execution of a malicious payload.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing the creation of processes by user or system accounts. If malicious, this behavior can indicate an elevated risk of further compromise, insider threat activity, or unauthorized access to sensitive data. However, this detection alone does not confirm that the behavior is malicious; it could arise from legitimate administrative or development activities involving Python scripts.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for instances where the `Image` field indicates `python.exe`, `python3.exe`, or `python2.exe` and make note of the user and parent process initiating it.

  - **Examine command line arguments:** Utilize the CommandLine field of Event ID 4688 to look for patterns indicating interactive shell creation such as "import pty" and variations including ".spawn(". Identify any commands that deviate from normal scripting tasks.

  - **Identify benign Python usage:** Find examples of legitimate Python script execution within your environment. Typical usage may involve standard modules without the pty library, often during scheduled tasks or batch processing.

  - **Analyze recent changes or behaviors:** Investigate recent changes in typical scheduled tasks or service configurations that might explain unusual script execution. Look for any evidence of unauthorized access or recent exploits tied to the machine where the alert was triggered.

  - **Validate system impact:** Confirm the role of the affected system (e.g., production server, development workstation) to assess the potential impact of the detected behavior. Ensure alignment with expected operational use cases.

  - **Search for indicators of compromise:** Review the system for additional artifacts suggesting compromise, such as unusual network connections (via Event ID 5156) or unexpected access to sensitive files.

  ### Prioritization

  This alert is of high severity due to its potential impact on sensitive systems and the likelihood of malicious exploitation pathways. The ability for an adversary to gain an interactive shell drastically increases their capability to traverse the network and access confidential data. Furthermore, this behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for misconfigured logging settings that could fail to capture necessary process creation events. Legitimate activities such as software development, automated testing, or system administration involving Python scripts may also trigger the rule, contributing to false positives. To enhance coverage, correlate alerts with companion detections focusing on unusual network activity or file operations that might signify lateral movement or data exfiltration.

