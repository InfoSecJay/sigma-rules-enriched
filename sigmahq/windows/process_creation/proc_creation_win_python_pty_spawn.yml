note: |
  ### Technical Context
  This rule detects the execution of Python processes that leverage the `pty` library to spawn a pseudo-terminal (TTY) on a Windows system. Such behavior is characteristic of behavior commonly associated with **post-exploitation activities** where attackers aim to establish an interactive shell or maintain persistence on compromised systems. By utilizing Python, an attacker can obfuscate their actions, making it harder for traditional detection tools to recognize malicious activities as they leverage a commonly used programming language.

  The suspected threat family is linked to various adversaries utilizing Python for post-exploitation purposes, including but not limited to attackers who exploit vulnerabilities in software like Atlassian Confluence, as detailed in related references. The relevant MITRE ATT&CK tactics include **Execution** (TA0002), with techniques like **Command and Scripting Interpreter** (T1059) specifically concerning scripting capabilities that attackers can exploit for malicious intent. The primary data sources for this detection rule will be Windows process creation logs, which can provide insight into the command lines and images being executed on the system.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for the execution of `python.exe`, `python3.exe`, or `python2.exe` along with their command line arguments to identify any suspicious usage or patterns of behavior associated with TTY generation.

  - **Analyze Command Line Arguments:** Focus on command lines that include `import pty` and `.spawn(` or `from pty import spawn` to confirm attempts to create an interactive shell environment, which is often linked to malicious actor activity.

  - **Correlate with User Behavior:** Investigate the account under which the Python process was executed to determine if it matches expected usage patterns, especially if the account typically does not run such scripts or execute Python.

  - **Check for Unusual Network Activity:** Monitor any subsequent network activity from the machine where the Python script was executed with an emphasis on connections to external IPs or unusual ports, which could indicate potential command and control activity.

  ### Prioritization
  The severity of this alert is high in an enterprise environment, as the ability to spawn a TTY can provide attackers with significant control over compromised systems, facilitating further exploits or data exfiltration.

  ### Blind Spots and Assumptions
  This detection logic may not capture instances where attackers employ different scripts or methods to achieve similar outcomes using other tools or techniques outside of Python. Additionally, there is an assumption that legitimate Python tasks within the environment will not invoke the `pty` library, which may not hold in all cases. Notably, the alert relies on the availability of comprehensive process creation logging to accurately detect this behavior, necessitating correct configuration and retention policies in the logging systems.

