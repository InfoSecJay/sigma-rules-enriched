note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that utilize Base64 encoded .NET reflective loading of assemblies, a common method used by adversaries to execute malicious code while evading detection. The likely attacker objective is to deploy malicious payloads within a compromised environment, leveraging reflection to load and execute .NET assemblies. This activity aligns with the MITRE ATT&CK technique T1059.001 (Command and Scripting Interpreter: Windows PowerShell) and T1027 (Obfuscated Files or Information). Primary telemetry sources include Windows process creation events, such as Security Event ID 4688 and Sysmon Event ID 1, specifically monitoring the CommandLine field. If malicious, this behavior can facilitate command execution, lateral movement, or data exfiltration. It is critical to note that this detection alone does not confirm malicious intent without additional context or corroborating evidence.

  ### Investigation Steps

  - **Review command line arguments:** Check Security Event ID 4688 or Sysmon Event ID 1 for processes with CommandLine containing strings indicative of Base64 encoded assembly loading (e.g., "Reflection.Assembly::Load").

  - **Validate user context:** Identify the user account associated with the process execution to determine if it is a service account or a user account with legitimate administrative roles. This context can be gathered from the Event ID 4688's "New Process Creator" field.

  - **Check for known malicious hashes:** Investigate the hashes of binaries associated with the identified process. Compare these hashes against threat intelligence sources to identify known malware families. Utilize Sysmon Event ID  hash values.

  - **Analyze recent activity:** Review recent PowerShell execution logs (Event ID 4104) and scripting activity to see if there are any patterns or anomalies that correspond with the time of the alert to assess for other malicious indicators.

  - **Identify legitimate use cases:** Determine if the PowerShell command aligns with known organizational tasks by cross-referencing with documented use cases for the environment. Legitimate PowerShell usage may include system updates or routine maintenance scripts.

  - **Monitor for evasion techniques:** Be aware of techniques such as encoding or obfuscation; review potential obfuscated payloads with past occurrences or similar techniques documented in the organization's incident history.

  ### Prioritization

  This alert should be considered high priority due to its potential to indicate malicious activity impacting critical systems. The exploitation of PowerShell for obfuscated assembly loading is a recognized and commonly weaponized tactic among sophisticated adversaries. The overall impact could lead to significant data breaches or system compromises if unchecked.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not enabled or retained for all relevant events, particularly Sysmon logging which is crucial for this detection. Legitimate administrative tasks or automated scripts may inadvertently trigger the alert, necessitating thorough validation. Companion detections, such as monitoring for abnormal PowerShell module imports (T1059.001), can enhance coverage and efficacy in containing risks associated with such activities.

