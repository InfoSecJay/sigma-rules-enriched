note: |
  ### Technical Context

  This detection rule identifies the execution of PowerShell commands that utilize Base64 encoded arguments to load .NET assemblies reflectively. This technique is frequently employed by attackers to obfuscate their payloads, making them more difficult to detect. The likely objective of an attacker utilizing this method is to execute malicious code while evading typical security mechanisms and scrutiny.

  This behavior falls under the MITRE ATT&CK framework as Execution (T1059.001) and Defense Evasion (T1027). It primarily leverages Windows process creation logs, specifically tracking command line arguments (e.g., Security Event ID 4688 and/or Sysmon Event ID 1), to detect the presence of encoded commands attempting to load assemblies. If successfully executed, this technique could lead to unauthorized access, data exfiltration, or system compromise. However, this alert does NOT confirm that a malicious action has occurred, as not all PowerShell usage is indicative of malicious intent.

  ### Investigation Steps

  - **Examine the command line arguments**: Look for Security Event ID 4688 or Sysmon Event ID 1, specifically for process creation events containing encoded text, particularly in properties like `CommandLine`. Validate if the Base64 string resolves to known or malicious PowerShell commands.

  - **Identify the parent process**: Investigate the parent process of the detected PowerShell execution (Event ID 4688, `NewProcessId`, `ParentProcessId`). Look for processes such as cmd.exe or mshta.exe that could indicate scripting attacks, versus benign applications like PowerShell ISE.

  - **Check for known malicious assemblies**: Validate the command against threat intelligence or known bad signatures related to .NET assemblies that use reflective loading. Look for assembly names or GUIDs associated with public exploits or malware.

  - **Review recent PowerShell activity**: Examine PowerShell logs (e.g., Module Logs or Script Block Logging) for unusual execution history leading up to the event. Confirm legitimate administrative tasks that may involve encoded commands or reflective assembly loading (e.g., authorized system management scripts).

  - **Correlate with other alerts**: If present, cross-reference with other alerts indicating abnormal PowerShell activity or direct threats (e.g., related rule ID 9c0295ce-d60d-40bd-bd74-84673b7592b1), which may indicate a broader attack pattern.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on enterprise systems. The likelihood of malicious exploitation is significant, especially given the common use of obfuscated PowerShell scripts in attacks. This behavior is often weaponized in various attack scenarios, making timely investigation critical.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques employed by sophisticated adversaries, including custom Base64 encoding or variations in execution methods. Ensure that PowerShell logging and Sysmon are properly configured to capture detailed command-line arguments. Legitimate PowerShell use cases, such as automated scripts or management tasks, may trigger this alert. To enhance detection, companion rules involving process anomalies or system call logs could provide greater insight into potentially malicious activities.

