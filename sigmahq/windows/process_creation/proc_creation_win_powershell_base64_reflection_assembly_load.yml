note: |
  ### Technical Context
  This rule detects the use of PowerShell for loading .NET assemblies through Base64-encoded commands. Attackers often use this technique as part of a broader strategy to execute malicious code while circumventing security measures. By encoding payloads, they can obfuscate their activities, making detection more challenging. This method is often associated with various malware families, including those targeting Windows environments. Attackers' objectives may include executing payloads that can establish persistence, exfiltrate data, or facilitate other malicious actions.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), as the primary action being observed is the execution of code. Additionally, it falls under **Defense Evasion** (TA0005), given that the encoding is used to obscure the true intent of the command being executed. The specific techniques involved are **PowerShell (T1059.001)** due to the usage of PowerShell for command execution, and **Obfuscated Files or Information (T1027)**, which is relevant due to the obfuscation of commands through Base64 encoding.

  Primary data sources that provide critical evidence for this detection include **process creation events** from Windows, which capture how applications are initiated, including the command-line arguments passed, and any related logs from endpoint detection and response (EDR) systems that might provide behavioral insights into the execution of such scripts.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the command-line arguments in the process creation logs for instances of PowerShell executing Base64 encoded commands, particularly those using `Reflection.Assembly::Load`.

  - **Check EDR Alerts**: Query your EDR system for alerts that correlate with suspicious PowerShell usage or known indicators related to malicious assembly loading.

  - **Examine PowerShell Audit Logs**: If PowerShell logging is enabled, search for logs that detail script executions and commands issued to identify the context in which the Base64 encoded commands are used.

  - **Assess Network Connections**: Investigate any outbound or unusual network connections initiated by processes suspected to have executed encoded PowerShell commands, as they may indicate further malicious activity.

  ### Prioritization
  This alert is of high severity due to the significant risk posed by unauthorized use of PowerShell for executing malicious code, which can lead to data breaches, unauthorized access to sensitive systems, or the installation of persistent malware.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if PowerShell logging is not enabled on all endpoints, which could prevent the capture of relevant command details. This detection logic assumes that attackers will utilize PowerShell for execution, and may miss behaviors using other scripting or programming tools. Furthermore, if Base64 encoding mechanisms are altered or evaded, this rule may not trigger. Ensuring appropriate logging configurations and maintaining up-to-date behavioral analysis tools are critical for the alert to function effectively.

