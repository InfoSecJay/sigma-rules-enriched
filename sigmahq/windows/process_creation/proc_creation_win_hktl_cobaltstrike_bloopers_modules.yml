note: |
  ### Technical Context

  This rule detects the accidental execution of Cobalt Strike modules or commands in the Windows command shell (CMD). It identifies instances where a user or operator may inadvertently run known Cobalt Strike commands, indicative of potential malicious or unauthorized testing in a live environment. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), and the techniques involved include **Command-Line Interface** (T1059.003).

  The primary telemetry source is process creation logs, specifically Windows Security Events (Event ID 4688) and Sysmon Event ID 1. If malicious, this activity could lead to unauthorized access or exploitation of network resources. However, this detection does NOT confirm whether the execution is an actual threat, as it may also occur during legitimate testing or miscommunication.

  ### Investigation Steps

  - **Review command execution details:**
    Examine the `CommandLine` field from Sysmon Event ID 1 to check for specific Cobalt Strike commands such as `Invoke-UserHunter` or `zerologon`. Malicious indicators include these exact commands executed from `cmd.exe`.

  - **Check process creation logs:**
    Analyze Windows Security Event ID 4688 for the creation of `cmd.exe` instances. Look for unusual parent processes that may indicate an attack context beyond normal operations.

  - **Identify legitimate usage:**
    Note that system administrators or blue team members may use these commands in controlled environments for security assessments. Check if the source IP or user account matches known internal entities.

  - **Correlate with user activity:**
    Verify user accounts involved with these commands against recent changes or access patterns. Malicious activities could indicate escalated privileges or compromised accounts.

  - **Search for additional malicious indicators:**
    Inspect logs for other tools or suspicious process behaviors around the same time as the alert. Look for abnormal network connections or file creations that could suggest further exploitation attempts.

  - **Validate asset criticality:**
    Determine if affected systems are critical infrastructure, as this increases the risk associated with any detected malicious command execution.

  ### Prioritization

  The alert is high severity due to the potential impact on sensitive systems if malicious commands are executed in a live environment. The likelihood of misuse is elevated as Cobalt Strike is frequently weaponized in various attack scenarios, making timely investigation essential.

  ### Blind Spots and Assumptions

  This detection may miss malicious activities if operators use alternative tools to run commands stealthily. It assumes the presence of complete Sysmon and Windows event logging for effective coverage. Legitimate administrative tasks could trigger the alert if security assessments use similar commands. A related detection to consider is monitoring for PowerShell execution (T1059.001) to strengthen overall detection capabilities against execution threats.

