logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_search_subfolder:
    CommandLine|contains|windash: ' -s '
  selection_cli_search_insensitive:
    CommandLine|contains|windash: ' -i '
  condition: selection_findstr and all of selection_cli_search_*
falsepositives:
- Administrative or software activity
level: low
note: |
  ### Technical Context

  This rule detects the execution of the `findstr.exe` utility with both the "s" (subfolder) and "i" (insensitive) flags. These flags enable attackers to search directories recursively and conduct case-insensitive searches, often targeting sensitive or interesting files across the file system. The likely objective of an attacker utilizing this command is to gather information about the system or locate specific files that could aid in further malicious actions.

  The relevant MITRE ATT&CK tactic is **Credential Access** (TA0006) with techniques including **Credential Dumping** (T1003) and **Data from Information Repositories** (T1218). The primary telemetry source for this detection is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If the detected behavior is malicious, an attacker could use this information to escalate privileges or exfiltrate sensitive data. However, the detection does NOT confirm that the activity was definitely malicious, as legitimate administrative or operational usage may trigger the alert.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for entries related to `findstr.exe`. Look for CommandLine arguments including `-s` and `-i`. Confirm user context and execution time to see if it correlates with suspicious activity.

  - **Validate command context**: Determine if the execution of `findstr.exe` occurred during legitimate administrative tasks or within a software installation process. Typical benign usage may include searching for configuration files or logs without the specified flags.

  - **Cross-reference with other activity logs**: Analyze Sysmon Event ID 1 for any parent processes associated with the `findstr.exe` execution. Common benign parent processes could include `cmd.exe` or `powershell.exe`.

  - **Examine recent file activity**: Investigate the timestamps on files accessed or modified in directories that `findstr.exe` searched. Use FileSystem logs to find any unusual file modifications or unauthorized access patterns.

  - **Identify high-confidence malicious indicators**: Check for the presence of outputs that indicate suspicious searches, such as references to sensitive files (e.g., password files, config files, etc.) in the result of the `findstr` command.

  - **Monitor for incorrect usage patterns**: Look for repeated or automated execution of `findstr.exe` that may indicate a script being used by an attacker. Rapid or unexpected invocations from non-administrative accounts should be flagged.

  ### Prioritization

  This alert has a low severity due to its relatively less critical nature in the overall attack lifecycle. However, there is potential for malicious abuse as it could indicate reconnaissance efforts within an environment. The likelihood of this specific behavior being weaponized is moderate, especially in combination with other suspicious activity.

  ### Blind Spots and Assumptions

  Evasion techniques may include using different command-line arguments or obfuscating execution using scripts. Reliably detecting this activity requires maintaining comprehensive process creation logs, including both successful and unsuccessful attempts. Legitimate administrative tasks, particularly in scripting or IT support scenarios, may trigger this alert. Related detections might include monitoring for unusual usage patterns of other command-line utilities that could indicate a staged attack process or data exfiltration attempts.

