logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_search_subfolder:
    CommandLine|contains|windash: ' -s '
  selection_cli_search_insensitive:
    CommandLine|contains|windash: ' -i '
  condition: selection_findstr and all of selection_cli_search_*
falsepositives:
- Administrative or software activity
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of `findstr.exe` with both the `/s` and `/i` flags, which indicates a case-insensitive search throughout subfolders. This behavior is often leveraged by attackers to scan for sensitive or interesting files within the file system without generating excessive output. The primary attacker objective is to locate files or data of interest, potentially prepping for further actions like data exfiltration, credential access, or command and control.

  This detection aligns with several MITRE ATT&CK techniques: **T1218 - Signed Binary Proxy Execution**, **T1564.004 - Hide Artifacts: Alternate Data Streams**, and **T1552.001 - Unsecured Credentials: Credentials from Password Managers**. The telemetry source for this detection is based on process creation events within Windows, specifically the command line usage of the `findstr` utility. If malicious, it could indicate an unauthorized data reconnaissance effort. Notably, this detection does NOT confirm malicious intent, as legitimate administrative functions may use `findstr` for valid purposes.

  ### Investigation Steps

  - **Review the command line arguments:** Investigate the command line for `findstr` in Security Event ID 4688 logs. Look for the presence of `-s` and `-i` flags. Malicious: Commands that target sensitive directories. Benign: Commands executed by known administrative scripts.

  - **Check process parent-child relationships:** Use Sysmon Event ID 1 to trace parent-child process relationships involving `findstr.exe`. Malicious: Launched by suspicious or unusual parent processes (e.g., PowerShell or cmd). Benign: Executed by well-known management tools or scripts.

  - **Verify execution context:** Confirm the user context from which `findstr.exe` was executed via Security Event ID 4624 for logon events. Malicious: Execution by non-admin users or during unusual hours. Benign: Execution by administrators during regular maintenance windows.

  - **Analyze file system access:** Inspect any files accessed during this execution using Sysmon Event ID 11. Look for sensitive files or directories typically of interest to attackers (e.g., *.dat, *.xml, *.config). Malicious: Access to files not typically modified during regular operations. Benign: Legitimate access to routine files.

  - **Check for evidence of data manipulation:** Investigate Alternate Data Streams using PowerShell or Sysinternals tools to identify any newly created or modified ADS during the execution of `findstr`. Malicious: Creation or modification of ADS potentially to hide artifacts. Benign: Normal administrative file activities.

  ### Prioritization

  This alert carries low severity in an enterprise context, primarily due to the low likelihood of malicious abuse compared to the volume of legitimate administrative use of `findstr.exe`. However, it is important to monitor such activity as it can be indicative of reconnaissance behaviors that attackers frequently employ when preparing for deeper intrusions.

  ### Blind Spots and Assumptions

  This detection can be evaded by using non-standard encoding or obfuscating command-line arguments. To ensure reliable detection, configuration must encompass comprehensive process creation logging and potentially elevated logging scope for PowerShell. Legitimate scenarios that may trigger this alert include system administrators conducting troubleshooting or script executions across multiple directories. A related detection is using **T1059.001 - Command and Scripting Interpreter: PowerShell** which can provide additional context in conjunction with suspicious `findstr` executions.

