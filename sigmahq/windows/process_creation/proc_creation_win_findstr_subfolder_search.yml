logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_search_subfolder:
    CommandLine|contains|windash: ' -s '
  selection_cli_search_insensitive:
    CommandLine|contains|windash: ' -i '
  condition: selection_findstr and all of selection_cli_search_*
falsepositives:
- Administrative or software activity
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of the Windows utility `findstr.exe` with specific flags that may indicate suspicious behavior. By searching for the "insensitive" (`-i`) and "subfolder" (`-s`) options, the rule highlights potential attempts by attackers to enumerate or filter through files for sensitive or strategic information on a compromised system. Attackers often leverage built-in utilities like `findstr` to avoid detection while performing reconnaissance or lateral movement within an environment.

  The likely attacker objectives include gathering or exfiltrating sensitive files and conducting effective post-exploitation behavior while trying to blend with regular administrative tasks. This activity could fall under several relevant MITRE ATT&CK tactics and techniques, specifically:
  - **T1071 - Application Layer Protocol** (for command and control),
  - **T1218 - Signed Binary Proxy Execution**, and
  - **T1564.004 - Hide Artifacts** (e.g., using `findstr` to sift through hidden data).

  The primary data sources for detecting this behavior are **process creation events** within the Windows environment, where such commands would be logged along with their arguments, providing insight into potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for events related to `findstr.exe` in process creation logs. Look specifically for instances where the command line contains both `-s` and `-i` flags.

  - **Analyze Command Context:** Examine surrounding events before and after the `findstr` execution to identify any preceding commands or patterns that may indicate devious intentions, such as file manipulations or other reconnaissance activities.

  - **Correlate with User Behavior:** Investigate the user account that initiated the `findstr` command, focusing on any anomalies in their typical behavior or access patterns. Identify if the account has elevated privileges that may elevate the concern level.

  - **Search for Related Artifacts:** Review file access logs or output from the `findstr` command to find targeted files or paths being searched. This can help determine the focus of the attack and the types of data the threat actor is interested in.

  ### Prioritization
  This alert is flagged as low severity primarily because the use of legitimate system utilities like `findstr` can often be benign, especially in administrative contexts. However, given the potential for this command to be utilized in a reconnaissance phase, it warrants investigation to ascertain whether the use was legitimate or malicious.

  ### Blind Spots and Assumptions
  The detection logic may miss cases where attackers use other similar command-line utilities or differentiate their execution by employing different parameters. The primary assumption is that the execution of `findstr` with both the `-s` and `-i` flags signifies a reconnaissance intent. For this detection to function effectively, appropriate process creation logging must be enabled, ensuring all command-line activities are correctly captured in the log source.

