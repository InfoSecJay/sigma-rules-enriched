title: Suspicious CertReq Command to Download
id: 4480827a-9799-4232-b2c4-ccc6c4e9e12b
status: experimental
description: |
  Detects a suspicious CertReq execution downloading a file.
  This behavior is often used by attackers to download additional payloads or configuration files.
  Certreq is a built-in Windows utility used to request and retrieve certificates from a certification authority (CA). However, it can be abused by threat actors for malicious purposes.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Certreq/
author: Christian Burkard (Nextron Systems)
date: 2021-11-24
modified: 2025-10-29
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certreq.exe'
  - OriginalFileName: 'CertReq.exe'
  selection_cli_flag_post:
    CommandLine|contains|windash: '-Post'
  selection_cli_flag_config:
    CommandLine|contains|windash: '-config'
  selection_cli_http:
    CommandLine|contains: 'http'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows utility CertReq with certain command-line arguments indicative of suspicious behavior, particularly if it involves downloading resources from an HTTP source. Attackers may use CertReq to retrieve additional payloads or configuration files as part of post-exploitation activity, thereby bypassing regular detection mechanisms. The relevant MITRE ATT&CK technique is Command and Control (T1105), as this behavior can facilitate the remote delivery of malware or configuration settings required for further exploitation. The primary telemetry sources include process creation logs (e.g., Security Event ID 4688 or Sysmon Event ID 1) capturing the command-line activity. If malicious, this activity can lead to the compromise of the system by introducing unauthorized or malicious code. This detection, however, does not confirm whether the downloaded content is malware, as it may also indicate legitimate certificate requests under certain contexts.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 to identify the instance of CertReq execution. Look for patterns indicating suspicious command-line arguments, such as `-Post` and downloads from HTTP.

  - **Analyze command-line arguments**: Examine the CommandLine field to confirm the presence of `-config` and entries that contain URLs. Assess whether these URLs are known malicious indicators or belong to a legitimate certificate authority.

  - **Identify the source of HTTP requests**: Use network logs (e.g., proxy, firewall) to track outbound requests that coincide with CertReq executions. Look for unusual IP addresses or domains that resolve outside of known enterprise resources.

  - **Correlate with user context**: Determine who executed the CertReq command and the host's role. If executed by a non-administrative user on a critical server, this raises the risk of malicious intent.

  - **Validate legitimate usage patterns**: Reference previous legitimate uses of CertReq in your organization's history. CertReq may be used by IT for valid certificate requests; ensure this execution aligns with known workflow and scheduled maintenance activities.

  - **Cross-check against threat intelligence**: Use threat intelligence feeds to match the URLs against lists of known malicious domains. Confirm if any downloaded artifacts have a known malicious signature or behavior.

  ### Prioritization

  This alert is of high severity, particularly if triggered on critical infrastructure or servers within the environment. The likelihood of malicious abuse is significant due to the utility's ability to facilitate downloads of malicious payloads. Additionally, this behavior aligns with well-documented attack methodologies.

  ### Blind Spots and Assumptions

  There is a potential for evasion if the attacker uses obfuscated command-line arguments or alternative utilities to download files. Reliable detection necessitates that process creation logs are adequately monitored, and full command-line data is captured. Legitimate operations by IT teams to obtain certificates could trigger this alert, necessitating contextual validation. A related detection of interest is the identification of anomalous HTTP traffic patterns or file downloads that could complement this alert's findings.

