title: Suspicious CertReq Command to Download
id: 4480827a-9799-4232-b2c4-ccc6c4e9e12b
status: experimental
description: |
  Detects a suspicious CertReq execution downloading a file.
  This behavior is often used by attackers to download additional payloads or configuration files.
  Certreq is a built-in Windows utility used to request and retrieve certificates from a certification authority (CA). However, it can be abused by threat actors for malicious purposes.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Certreq/
author: Christian Burkard (Nextron Systems)
date: 2021-11-24
modified: 2025-10-29
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\certreq.exe'
  - OriginalFileName: 'CertReq.exe'
  selection_cli_flag_post:
    CommandLine|contains|windash: '-Post'
  selection_cli_flag_config:
    CommandLine|contains|windash: '-config'
  selection_cli_http:
    CommandLine|contains: 'http'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the `certreq` command is executed with suspicious parameters, specifically when attempting to download a file via HTTP. The `certreq` tool is legitimate, primarily used for requesting certificates from a certificate authority (CA), but malicious actors can exploit it to retrieve additional payloads, configuration files, or other unauthorized content that can facilitate further attacks.

  The potential threat actor objectives include establishing command and control (C2) communication, exfiltrating sensitive data, or deploying additional malicious agents onto a target machine. Such activities align with the MITRE ATT&CK techniques for Command and Control, specifically Technique T1105 (Ingress Tool Transfer), which involves transferring tools or files from external locations into a compromised environment.

  Primary data sources that will yield relevant evidence for this detection include process creation events in Windows, specifically focusing on the invocation of `certreq.exe`, along with the command line arguments used during execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify instances of `certreq.exe` execution, paying special attention to those with unusual command-line arguments.
  - **Examine Command Line Arguments:** Focus on command lines containing flags like `-Post` or `-config`, as well as URLs (http/https), which are indicative of attempts to download files.
  - **Correlate with Network Traffic:** Investigate outbound network traffic for any connections initiated by the host where `certreq.exe` was executed, particularly for unknown or suspicious domains.
  - **Check for Associated Processes:** Look for other processes initiated around the same time that may indicate a broader attack context, such as unusual PowerShell scripts or other command-line tools.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant impact on the organization, as the execution of HTTP-based downloads through a trusted utility like `certreq` could signify an active compromise or preparation for a larger attack.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the logging level in the environment does not capture all process creation events or command-line parameters sufficiently. The logic assumes that the command invocation is malicious if it contains specific flags and HTTP commands, which may not always be the case; legitimate uses of `certreq` can exist. Additionally, the effectiveness of this alert requires that system processes are monitored for command-line arguments, and proper configurations must be in place to gather and retain process creation logs.

