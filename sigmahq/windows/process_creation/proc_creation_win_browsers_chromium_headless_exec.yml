note: |
  ### Technical Context
  This detection rule identifies the execution of mainstream Chromium-based web browsers (such as Chrome, Edge, Opera, and others) in headless mode. Headless mode allows these browsers to run without a graphical user interface (GUI), which is often exploited by attackers for various purposes, including automated scripting, scraping of web data, or evading traditional security measures. This behavior may be associated with malware activities, where attackers leverage headless browsers to carry out command-and-control (C2) communications or as part of a larger attack framework.

  The rule is relevant to the MITRE ATT&CK framework, particularly under the tactics of **Defense Evasion** (ID: T1564.003) and **Command and Control** (ID: T1105). Attackers using headless browsers can effectively evade detection, as the lack of a UI reduces visibility into the executed commands. The primary data sources for this detection are the **process creation events** from Windows systems, which provide insights into the execution parameters and environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Start by examining the process creation logs for any instances of Chromium-based browsers (e.g., `chrome.exe`, `msedge.exe`) being launched with the `--headless` flag. Identify the parent process to understand how such execution was triggered.

  - **Analyze Command-Line Parameters**: Investigate the command-line arguments used during the execution of the browser. Look for unusual parameters or combinations of flags that may point to potentially malicious activity.

  - **Check for Network Connections**: Look at the network traffic generated by these browsers to determine if any suspicious connections were made during their execution, particularly to known bad domains or IP addresses.

  - **Monitor User Behavior**: If possible, correlate the headless browser execution with user activities. Determine if this execution aligns with standard user behavior or if it appears anomalous for a given account or machine.

  ### Prioritization
  This alert is categorized as low severity; however, it should not be dismissed. While headless browser usage can be benign, its execution could indicate potentially malicious activities, making it essential for an enterprise to investigate it promptly.

  ### Blind Spots and Assumptions
  The detection rule assumes that all instances of the browsers listed are potentially benign unless proven otherwise. There may be gaps in identifying legitimate usage of browsers in headless mode if contextual information surrounding user behavior and environment is not adequately captured. Additionally, the rule requires that logging for process creation events is enabled and properly configured to capture detailed command-line parameters. If logging is insufficient or misconfigured, legitimate or critical alerts may be missed.

