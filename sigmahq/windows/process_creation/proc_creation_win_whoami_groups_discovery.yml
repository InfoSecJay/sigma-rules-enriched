title: Group Membership Reconnaissance Via Whoami.EXE
id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
status: test
description: Detects the execution of whoami.exe with the /group command line flag
  to show group membership for the current user, account type, security identifiers
  (SID), and attributes.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-28
tags:
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  selection_cli:
    CommandLine|contains:
    - ' /groups'
    - ' -groups'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the **whoami.exe** command with the `/groups` flag, which is commonly used to retrieve detailed information about user group memberships in a Windows environment. The primary objective of an attacker leveraging this command is to perform reconnaissance, obtaining insights into the permissions and roles assigned to various accounts. Armed with this knowledge, an attacker can identify potential targets for privilege escalation or lateral movement.

  Relevant MITRE ATT&CK techniques include **Account Discovery (T1087)** and **User Account Discovery (T1033)**, both of which focus on gathering information about user accounts and their respective privileges. By understanding the group memberships of users, an adversary can strategize subsequent attack steps, making this activity noteworthy in an enterprise detection strategy.

  The recommended telemetry sources for this detection include **process creation events**, as these logs provide the necessary details about command-line arguments, executing processes, and the context in which they are launched. Additionally, monitoring user activity through other logging mechanisms like security events may provide supplementary context for investigations.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs related to process creation for entries where `whoami.exe` is executed with `/groups` or `-groups` flags. Look for unusual user accounts that should not normally perform such queries.

  - **Correlate with User Behavior:** Investigate the context of the user executing the command. Look for anomalies in actions or patterns compared to typical user behavior, especially if the command was run outside of regular hours or from unusual locations.

  - **Check for Other Reconnaissance Activities:** Assess the environment for other commands or tools commonly associated with reconnaissance, such as `net user`, `net group`, or PowerShell commands that query user accounts. This can help determine if the observed activity is part of a broader reconnaissance effort.

  - **Analyze Access Control Settings:** Review access control and group policy settings to understand the implications of any identified group memberships. Investigate whether any administrative or highly privileged groups are being targeted.

  ### Prioritization
  This alert is deemed to have medium severity due to the associated risk of targeted reconnaissance by an adversary aiming to exploit user privileges. Given that it could precede more damaging actions such as privilege escalation or lateral movement, it requires timely investigation and contextual understanding.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are not retained or if access to these logs is restricted. The detection logic assumes that users attempting to gather group membership information are doing so through the `whoami.exe` command; however, attackers may use alternative methods or tools to achieve similar objectives. For this alert to function effectively, it is necessary to ensure that **process creation logging** is enabled and appropriately configured across the Windows environment.

