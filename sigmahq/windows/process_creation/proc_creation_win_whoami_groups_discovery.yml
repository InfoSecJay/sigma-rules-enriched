title: Group Membership Reconnaissance Via Whoami.EXE
id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
status: test
description: Detects the execution of whoami.exe with the /group command line 
  flag to show group membership for the current user, account type, security 
  identifiers (SID), and attributes.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-28
tags:
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  selection_cli:
    CommandLine|contains:
    - ' /groups'
    - ' -groups'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies the execution of `whoami.exe` with the `/group` command line argument, which reveals the group membership, account type, security identifiers (SIDs), and attributes of the current user. The likely attacker objective is to gather information about user privileges and group memberships within the environment, which can help them identify potential targets for privilege escalation or lateral movement. This behavior aligns with the MITRE ATT&CK technique "Account Discovery" (T1033).

  Primary telemetry sources include Windows process creation logs, specifically those capturing events related to `whoami.exe`. If executed maliciously, the security impact can be considerable, as attackers leverage this information to enhance their access capabilities. However, this detection does NOT confirm malicious intent on its own; legitimate administrative users may also execute this command for valid purposes.

  ### Investigation Steps

  - **Verify process execution:** Check for process creation events (Security Event ID 4688 or Sysmon Event ID 1) where the `Image` path ends with `whoami.exe`, focusing on the command line arguments. Legitimate uses may include educational or training purposes with expected output showing valid user groups.

  - **Inspect command line arguments:** Confirm that the `CommandLine` field contains `/groups` or `-groups`. Malicious indicators will show unusual execution contexts, such as execution by non-administrative users in sensitive environments.

  - **Correlate user account roles:** Review the user's role and typical behavior. Legitimate users often execute `whoami.exe` during troubleshooting. Identify accounts with high administrative privileges or sensitive roles executing this command as a potential red flag.

  - **Evaluate the execution context:** Cross-reference timestamps with other suspicious activities in process logs, including Event ID 4688 or Sysmon logs, to identify concurrent alerts or activities that suggest malicious reconnaissance.

  - **Check for unusual patterns:** Investigate the frequency of `whoami.exe` execution from the same user or system. A sudden spike may indicate malicious activity, particularly in sensitive systems (e.g., domain controllers or critical servers).

  ### Prioritization

  This alert should be treated with medium severity. The impacted system's criticality, such as a domain controller or administrator workstation, could indicate higher risk if exploited. While the behavior can be used maliciously, it is not inherently harmful and is sometimes executed for legitimate admin tasks—hence further investigation is necessary.

  ### Blind Spots and Assumptions

  Detection may be limited by user training and awareness, as users may legitimately run this command without malicious intent. Additionally, processes may be executed from scripts or automated tools that are not logged as suspicious. Logs must be securely collected from Windows systems to ensure reliable detection; if `whoami.exe` is restricted by policy, it could evade detection. Companion detections include monitoring Windows Event ID 4688 for abnormal PowerShell executions that may signify an actor attempting to evade traditional monitoring techniques.

