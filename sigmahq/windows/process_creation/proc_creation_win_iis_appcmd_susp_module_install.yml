title: IIS Native-Code Module Command Line Installation
id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
status: test
description: Detects suspicious IIS native-code module installations via command
  line
references:
- https://researchcenter.paloaltonetworks.com/2018/01/unit42-oilrig-uses-rgdoor-iis-backdoor-targets-middle-east/
- https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
author: Florian Roth (Nextron Systems)
date: 2019-12-11
modified: 2024-03-13
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\appcmd.exe'
  - OriginalFileName: 'appcmd.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'install'
    - 'module'
    CommandLine|contains|windash: '-name:'
  filter_iis_setup:
    ParentImage: 'C:\Windows\System32\inetsrv\iissetup.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown as it may vary from organisation to organisation how admins use to 
  install IIS modules
level: medium
note: |
  ### Technical Context

  This rule detects the installation of suspicious native-code modules for Internet Information Services (IIS) through the command line using `appcmd.exe`. The likely objective of an attacker employing this technique is to create backdoors or persistently compromise the server, facilitating future access or control. This behavior fits into the MITRE ATT&CK framework under the tactic of Persistence and technique T1505.003 (Server Message Block).

  The primary telemetry source for this detection is Windows process creation logs, specifically targeting event types indicating command execution with `appcmd.exe`. If malicious, the security impact could be significant, as these installations may lead to unauthorized server access. This detection does not confirm that the activity is necessarily malicious; it could also represent legitimate administrative actions taken by system administrators.

  ### Investigation Steps

  - **Assess the command line execution:** Review process creation logs (Security Event ID 4688 or Sysmon Event ID 1) for occurrences of `appcmd.exe` with parameters indicating module installation (e.g., `install`, `module`, `-name:`). Confirm whether the command line arguments relate to known administrative tasks.

  - **Identify parent processes:** Check for the parent image linked to `appcmd.exe`. Filter for instances initiated by `C:\Windows\System32\inetsrv\iissetup.exe` to confirm if it’s a known legitimate setup process. Legitimate commands usually appear with standard install modules, not unusual parameters.

  - **Verify module integrity:** Search for changes to the IIS application pool or web applications that could indicate malicious module installation. Review the IIS logs for abnormal traffic patterns or application behavior following the installation attempt.

  - **Check for known malicious signatures:** Cross-reference the installed modules with threat intelligence databases to identify if the module name matches techniques associated with known backdoors or exploits identified in reports such as those from Palo Alto Networks.

  - **Evaluate host inventory:** Determine if the affected system is critical, such as a production web server hosting sensitive data. Prioritize remedial actions based on asset importance and potential impacts on business operations.

  ### Prioritization

  This alert has a medium severity due to the potential impact on critical servers running IIS. Native module installations are uncommon and frequently exploited by adversaries for persistence, raising the likelihood of malicious use, particularly in environments where the server has been previously flagged for unusual behavior.

  ### Blind Spots and Assumptions

  Detection limitations include scenarios where legitimate administrative activities might trigger alerts, leading to false positives based on organizational practices. Required log sources need proper configuration of Sysmon or Windows audit logs to capture relevant process creation events. Administrators may also utilize legitimate modules that could trigger these alerts. Related detections include monitoring changes in IIS server configurations or web application firewall logs to enhance coverage of suspicious behaviors and correlations.

