title: IIS Native-Code Module Command Line Installation
id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
status: test
description: Detects suspicious IIS native-code module installations via command line
references:
- https://researchcenter.paloaltonetworks.com/2018/01/unit42-oilrig-uses-rgdoor-iis-backdoor-targets-middle-east/
- https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
author: Florian Roth (Nextron Systems)
date: 2019-12-11
modified: 2024-03-13
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\appcmd.exe'
  - OriginalFileName: 'appcmd.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'install'
    - 'module'
    CommandLine|contains|windash: '-name:'
  filter_iis_setup:
    ParentImage: 'C:\Windows\System32\inetsrv\iissetup.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown as it may vary from organisation to organisation how admins use to install
  IIS modules
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious installations of native-code modules for Internet Information Services (IIS) through command-line activity. Such installations could indicate the presence of unauthorized or malicious components being added to the web server, which can serve as attack vectors for further exploitation or data breaches. Attackers may leverage this methodology to deploy backdoors, exfiltrate data, or disrupt services while masquerading as legitimate administrative actions. The rule specifically targets command lines invoking the `appcmd.exe` tool with parameters that suggest an attempt to install a module.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0002), as attackers seek to establish lasting footholds within the environment. Techniques applicable to this detection are **"Malicious IIS Extensions"** (T1505.003), which indicates the modification of IIS configurations to allow for the execution of unauthorized code.

  Primary data sources for effective detection include **process creation events** that capture command-line activity around familiar IIS utilities, specifically `appcmd.exe`. Monitoring these logs can provide insights into potentially unauthorized modifications made to web server behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate process creation events specifically for `appcmd.exe` and `iissetup.exe` to identify any unusual installation patterns or timings that deviate from standard operational procedures.

  - **Analyze Command-Line Parameters**: Focus on the command-line arguments used during the execution of `appcmd.exe`. Look for instances containing both 'install' and 'module', as these combinations may indicate the installation of unauthorized modules.

  - **Correlate with IIS Configuration Changes**: Examine the IIS configuration logs for modifications accompanied by the process creation events to understand the scope and context of the module installations.

  - **Check for Anomalous Parent Processes**: Ascertain the parent process of the detected commands to identify if they stemmed from an authorized administrative tool or a potentially malevolent application that initiated the action.

  ### Prioritization
  The alert is ranked as medium severity due to the potential for unauthorized modifications to critical web infrastructure, which may lead to persistent backdoors if exploited. While the threat impact is high, the likelihood is context-dependent on organizational policies and usage patterns.

  ### Blind Spots and Assumptions
  One limitation of this detection rule is that it may not capture all types of malicious IIS module installations, especially if attackers utilize alternate methods or tools outside of `appcmd.exe`. The assumption here is that any legitimate administrative actions would be monitored and logged consistently, which may not reflect all operational environments. Additionally, appropriate logging configurations must be enabled within the Windows environment to fully capture the necessary process creation events for this alert to function correctly.

