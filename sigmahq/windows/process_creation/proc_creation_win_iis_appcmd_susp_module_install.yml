note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious installations of native-code modules in Internet Information Services (IIS) through command-line usage of `appcmd.exe`. The likely objective of an attacker using this technique is to deploy malicious modules that create backdoors, enabling persistent access to compromised servers. This behavior fits under the MITRE ATT&CK tactic of Persistence, specifically technique T1505.003 (Web Shell).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, capturing details of the command-line arguments used during the installation. If exploited, the impact could be significant, leading to unauthorized access and potential data exfiltration. Importantly, this detection alone does not confirm malicious intent, as system administrators may also utilize the `appcmd.exe` tool for legitimate IIS module management.

  ---

  ### Investigation Steps

  - **Check process creation logs:**
    Review Security Event ID 4688 or Sysmon Event ID 1 for entries where the process `C:\Windows\System32\inetsrv\appcmd.exe` was executed. Look for command lines containing `install` and `module`. Legitimate entries may appear alongside administrative tasks correlated with IIS management.

  - **Correlate with parent process activity:**
    Verify that the parent image is indeed `C:\Windows\System32\inetsrv\iissetup.exe`. Malicious execution often does not tie to this executable, and discrepancies could indicate potential misuse.

  - **Analyze specific command-line arguments:**
    Identify command lines using the flag `-name:` within the installation command. Command lines that specify unusual or unexpected module names could indicate malicious intent. For example, any module name resembling known malware could be a high-confidence indicator of a compromise.

  - **Inspect server roles and criticality:**
    Determine the role of the impacted server and its criticality to the organization. Servers running IIS that host sensitive applications warrant immediate prioritization for deeper investigation.

  - **Validate system configurations:**
    Confirm if any recent IIS module installations align with expected maintenance schedules. Significant deviations may necessitate a more detailed review of the involved system changes.

  ---

  ### Prioritization

  The alert carries medium severity due to potential compromise of critical web servers. Suspicious installations via this method can lead to persistent unauthorized access and data breaches. While this behavior can be observed in legitimate administrator actions, it is common among advanced threat actors exploiting IIS environments.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative activities conducted by system administrators, leading to false positives. Comprehensive logging for IIS installations must be configured to include `appcmd.exe` command-line usage. This alert can be complemented by monitoring for anomalies in user access patterns, such as unexpected administrative account usage or access to sensitive IIS modules.

