title: VMToolsd Suspicious Child Process
id: 5687f942-867b-4578-ade7-1e341c46e99a
status: test
description: Detects suspicious child process creations of VMware Tools process 
  which may indicate persistence setup
references:
- https://bohops.com/2021/10/08/analyzing-and-detecting-a-vmtools-persistence-technique/
- https://user-images.githubusercontent.com/61026070/136518004-b68cce7d-f9b8-4e9a-9b7b-53b1568a9a94.png
- https://github.com/vmware/open-vm-tools/blob/master/open-vm-tools/tools.conf
author: bohops, Bhabesh Raj
date: 2021-10-08
modified: 2023-07-25
tags:
- attack.execution
- attack.persistence
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\vmtoolsd.exe'
  selection_img:
  - Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'cscript.exe'
    - 'MSHTA.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
    - 'wscript.exe'
  filter_main_vmwaretools_script:
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
    - '\VMware\VMware Tools\poweron-vm-default.bat'
    - '\VMware\VMware Tools\poweroff-vm-default.bat'
    - '\VMware\VMware Tools\resume-vm-default.bat'
    - '\VMware\VMware Tools\suspend-vm-default.bat'
  filter_main_empty:
    Image|endswith: '\cmd.exe'
    CommandLine: ''
  filter_main_null:
    Image|endswith: '\cmd.exe'
    CommandLine:
  condition: all of selection* and not 1 of filter_main_*
falsepositives:
- Legitimate use by VM administrator
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious child processes initiated by the VMware Tools daemon (`vmtoolsd.exe`), specifically when those processes involve commands that can alter the state of virtual machines. The behavior is indicative of a potential adversary objective to establish persistence mechanisms within a virtualized environment. This aligns with the MITRE ATT&CK tactic of "Execution" (TA0002) and technique "Command and Scripting Interpreter" (T1059).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 from the Security log and Sysmon Event ID 1. If malicious, this behavior can lead to adversaries maintaining access to a compromised system, potentially exerting control over virtual machines. It's important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions by VM administrators may trigger the rule.

  ### Investigation Steps

  - **Review process creation details**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 logs for the suspect `cmd.exe` process initiated by `vmtoolsd.exe`. Check for ParentProcessId and Timestamp to establish a timeline.

  - **Analyze command line arguments**: Evaluate the CommandLine field of the identified process for the presence of any paths that reference the VMware Tools scripts (e.g., `poweron-vm-default.bat`). Legitimate instances would typically not invoke these scripts unexpectedly.

  - **Cross-verify image paths**: Check the Image field for the process creation logs. Any execution involving cmdlets like `powershell.exe`, `cscript.exe`, or `wscript.exe` originating from `vmtoolsd.exe` should be flagged for further scrutiny, especially if they lead to VM state changes.

  - **Determine user context**: Identify the user account associated with the process creation. Elevated privileges or unexpected user accounts running `vmtoolsd.exe` processes may indicate potential malicious exploitation.

  - **Look for additional indicators**: Inspect the system for any related persistence artifacts, such as unusual registry keys or scheduled tasks linked to the VMware Tools command line executions. These can indicate further malicious activity.

  - **Identify benign behavior**: Establish a baseline of normal process behavior for legitimate VM administrators performing typical tasks around VM management, confirming usage patterns that are indicative of authorized configuration changes.

  ### Prioritization

  This alert is of high severity due to its potential impact on virtualized environments, where an adversary could manipulate VM states. The likelihood of malicious use is significant, as this method has been linked to persistence strategies within compromised systems. This behavior is notably weaponized in advanced persistent threats targeting cloud or virtual infrastructures.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of process hollowing or renaming malicious binaries to mimic legitimate processes. Additionally, if Sysmon is not deployed or configured incorrectly, related Event IDs may not be captured adequately. Legitimate VM administration actions can trigger this alert, especially if administrators misuse VMware Tools for unauthorized activities. A related detection could be processes that attempt to modify VM configuration files or scripts under `C:\Program Files\VMware\VMware Tools`, which would strengthen monitoring capabilities.

