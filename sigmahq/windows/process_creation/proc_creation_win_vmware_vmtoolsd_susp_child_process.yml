title: VMToolsd Suspicious Child Process
id: 5687f942-867b-4578-ade7-1e341c46e99a
status: test
description: Detects suspicious child process creations of VMware Tools process which
  may indicate persistence setup
references:
- https://bohops.com/2021/10/08/analyzing-and-detecting-a-vmtools-persistence-technique/
- https://user-images.githubusercontent.com/61026070/136518004-b68cce7d-f9b8-4e9a-9b7b-53b1568a9a94.png
- https://github.com/vmware/open-vm-tools/blob/master/open-vm-tools/tools.conf
author: bohops, Bhabesh Raj
date: 2021-10-08
modified: 2023-07-25
tags:
- attack.execution
- attack.persistence
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\vmtoolsd.exe'
  selection_img:
  - Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'cscript.exe'
    - 'MSHTA.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
    - 'wscript.exe'
  filter_main_vmwaretools_script:
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
    - '\VMware\VMware Tools\poweron-vm-default.bat'
    - '\VMware\VMware Tools\poweroff-vm-default.bat'
    - '\VMware\VMware Tools\resume-vm-default.bat'
    - '\VMware\VMware Tools\suspend-vm-default.bat'
  filter_main_empty:
    Image|endswith: '\cmd.exe'
    CommandLine: ''
  filter_main_null:
    Image|endswith: '\cmd.exe'
    CommandLine:
  condition: all of selection* and not 1 of filter_main_*
falsepositives:
- Legitimate use by VM administrator
level: high
note: |
  ### Technical Context
  This rule detects suspicious child process creations initiated by the VMware Tools daemon (`vmtoolsd.exe`). Malicious actors may exploit the capabilities of VMware Tools to establish persistence in a virtualized environment. By launching uncommon child processes such as `cmd.exe`, `powershell.exe`, or others directly from VMware Tools, an attacker can execute arbitrary commands or scripts that maintain their foothold on the system while evading detection. This behavior is particularly relevant in scenarios where attackers aim to create a long-term presence within a virtual machine, potentially facilitating further exploitation or data exfiltration.

  The relevant MITRE ATT&CK tactics include **Execution** (T1059) and **Persistence** (T1059), highlighting how attackers leverage legitimate software to execute code in a way that is masked as normal operations. The primary data sources for this detection include process creation logs, specifically monitoring the parent-child relationships and command lines associated with the processes spawned by the VMware Tools daemon.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for instances where `vmtoolsd.exe` is the parent process. Look for child processes like `cmd.exe`, `powershell.exe`, and others listed in the alert.
  - **Analyze Command Lines**: Check the command lines of detected child processes for unusual patterns or scripts, focusing particularly on any references to VMware Tools batch scripts or empty command lines which could indicate manipulation.
  - **Correlate User Activity**: Investigate the user accounts associated with the detected processes. Check for any unauthorized access or unusual activity that may suggest a compromise.
  - **Identify Other VMware Tools Activity**: Look for other VMware Tools activity logs or events surrounding the times when the suspicious child processes were executed, as these can provide additional context about the actions taken on the VM.

  ### Prioritization
  The severity of this alert is high due to the potential for an attacker to establish a persistent presence within a critical virtualized environment. The exploitation of VMware Tools for malicious purposes poses a significant risk to enterprise security and could lead to more extensive impacts, including data breaches.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logging is not enabled for all devices or if the logs are retained only briefly, causing loss of visibility into suspicious activities. This detection assumes that `vmtoolsd.exe` is the legitimate VMware Tools process and does not account for potential renaming or masquerading of malicious executables. Proper configuration and retention of process creation logs are essential for effective detection, and logs from other related virtualization components may also enhance visibility into potential threats.

