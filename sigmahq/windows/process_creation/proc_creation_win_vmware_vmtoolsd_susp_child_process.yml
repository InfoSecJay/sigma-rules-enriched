title: VMToolsd Suspicious Child Process
id: 5687f942-867b-4578-ade7-1e341c46e99a
status: test
description: Detects suspicious child process creations of VMware Tools process which
  may indicate persistence setup
references:
- https://bohops.com/2021/10/08/analyzing-and-detecting-a-vmtools-persistence-technique/
- https://user-images.githubusercontent.com/61026070/136518004-b68cce7d-f9b8-4e9a-9b7b-53b1568a9a94.png
- https://github.com/vmware/open-vm-tools/blob/master/open-vm-tools/tools.conf
author: bohops, Bhabesh Raj
date: 2021-10-08
modified: 2023-07-25
tags:
- attack.execution
- attack.persistence
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\vmtoolsd.exe'
  selection_img:
  - Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'cscript.exe'
    - 'MSHTA.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
    - 'wscript.exe'
  filter_main_vmwaretools_script:
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
    - '\VMware\VMware Tools\poweron-vm-default.bat'
    - '\VMware\VMware Tools\poweroff-vm-default.bat'
    - '\VMware\VMware Tools\resume-vm-default.bat'
    - '\VMware\VMware Tools\suspend-vm-default.bat'
  filter_main_empty:
    Image|endswith: '\cmd.exe'
    CommandLine: ''
  filter_main_null:
    Image|endswith: '\cmd.exe'
    CommandLine:
  condition: all of selection* and not 1 of filter_main_*
falsepositives:
- Legitimate use by VM administrator
level: high
note: |
  ---

  ### Technical Context

  This rule detects the creation of suspicious child processes initiated by `vmtoolsd.exe`, particularly via command line utilities like `cmd.exe`, `PowerShell`, or others commonly used for scripting and automation. The likely attacker objective is to exploit VMware Tools as a vector for persistence mechanisms on compromised VMs. Relevant MITRE ATT&CK tactics include Execution (T1203) and Persistence (T1059). Primary telemetry sources necessary for this detection include Windows event logs (specifically Security Event ID 4688 for process creation) and Sysmon logs (Event ID 1). If malicious, this behavior can lead to unauthorized remote command execution or installation of malware, thereby compromising the VM’s integrity. However, this detection does NOT confirm that the activity is solely malicious; legitimate administrator actions may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review process creation events:** Examine Security Event ID 4688 and Sysmon Event ID 1 for child processes spawned by `vmtoolsd.exe`. Look for processes such as `cmd.exe`, `powershell.exe`, or others specified in the rule.

  - **Analyze command-line arguments:** Focus on the `CommandLine` field in relevant logs, looking for suspicious patterns. For example, command lines containing `poweron-vm-default.bat` or similar scripts indicate potential malware persistence setup.

  - **Check for expected behavior:** Legitimate VMware administrative tasks often involve invoking scripts without sensitive commands in the command line. Observe logs for executions that originate from `C:\Program Files\VMware\VMware Tools\` and analyze their context against the environment.

  - **Identify high-confidence malicious activity:** Look for child processes executing from `cmd.exe` with an empty or null `CommandLine`. This is often an indication of an attacker leveraging a misconfiguration or attempting stealthy execution.

  - **Validate asset criticality and role:** Confirm the impacted VM's role; for instance, whether it is a production server or a test environment. High-impact VMs (e.g., those handling sensitive data) warrant more immediate investigation.

  - **Investigate for anomalies in log retention:** Check log retention policies and configurations to ensure all necessary logs are being captured for accurate detection and retrospection. Ensure `Path` and `FileName` are not being dynamically constructed in a way that evades detection.

  ---

  ### Prioritization

  This alert is high priority due to the potential for significant impact on virtualized environments. The likelihood of malicious abuse is elevated given the misuse of VMware Tools for persistence, which is commonly weaponized in targeted attacks against enterprise infrastructures.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the evasion techniques such as attackers using encryption or obfuscation in the command line arguments. Reliable detection requires comprehensive logging of command-line executions from `vmtoolsd.exe`. Legitimate VMware administrative tasks can generate similar alerts, particularly in environments undergoing maintenance. A related detection to strengthen coverage would track unusual parent-child process relationships, particularly involving `vmtoolsd.exe` spawning commands indicative of automation without users' usual operational patterns.

