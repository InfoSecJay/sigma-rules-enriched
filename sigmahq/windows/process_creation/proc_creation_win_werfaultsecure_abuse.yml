note: |
  ### Technical Context

  This Sigma rule detects the misuse of `WerFaultSecure.exe` to manipulate Protected Process Light (PPL) processes, such as LSASS, or to hinder security tools like EDRs and antivirus solutions. The likely objective of this behavior is to compromise security layers for credential harvesting or to prevent detection of malicious activities. This aligns with the MITRE ATT&CK tactics of Defense Evasion (T1562.001) and Credential Access (T1003.001). The primary telemetry sources for this detection are Windows Process Creation logs, with key fields including `CommandLine`, `Image`, and `OriginalFileName`. A successful execution of this technique can lead to significant security incidents, including credential theft and potential full system compromise. Importantly, this detection does not confirm actual compromise; it only flags potential misuse of a legitimate file.

  ### Investigation Steps

  - **Check Process Creation Logs:**
    Review Windows Event ID 4688, filtering for `Image` equal to `\WerFaultSecure.exe`. Confirm details such as `ParentCommandLine` for known patterns like "WSASS.exe WerFaultSecure.exe [PID]" or "EDR-Freeze_[version].exe [PID] [timeout]".

  - **Identify Malicious Patterns:**
    Look for specific `CommandLine` arguments present in the logs, especially: `"/h"`, `"/pid"`, and `"/encfile"`. If these arguments are found associated with `WerFaultSecure.exe`, treat it as a high-confidence malicious indicator.

  - **Examine File Access Behavior:**
    Check for unusual access patterns to protected files like `LSASS`. Look at logs for file read/write operations in Event ID 4663 to see if there was an attempt to access sensitive memory.

  - **Assess Legitimate Usage:**
    Investigate whether there have been any legitimate debugging sessions using `WerFaultSecure.exe`. Typically, these should be rare in production environments, particularly in relation to third-party software components.

  - **Analyze Endpoint Security Logs:**
    Review EDR or antivirus logs to determine if they were stopped or disabled concurrently with the detection. Verify alert timestamps against the identified command executions to cross-reference security events.

  - **Check Host Roles:**
    Analyze the host role and criticality of the affected system. EDR or antivirus tools should be operational on sensitive systems (e.g., domain controllers), and any detection of this activity should be classified as a high priority for response.

  ### Prioritization

  This alert is considered high severity due to the impact on critical systems that this behavior typically targets, such as LSASS, and the likelihood of malicious abuse in evading detection mechanisms. The malicious use of `WerFaultSecure.exe` is not only threatening but is associated with known attack tools and techniques.

  ### Blind Spots and Assumptions

  There are limitations in detection as legitimate debugging processes may also trigger this alert. Ensure that proper logging for process creation, such as via Sysmon, is enabled to enhance detection capabilities. Activities involving legitimate uses of `WerFaultSecure.exe`, although rare, could still generate alerts. A companion detection to strengthen coverage would be monitoring for direct memory access attempts to LSASS, specifically looking for Event ID 4663 related to sensitive file access.

