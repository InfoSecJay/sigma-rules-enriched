note: |
  ### Technical Context

  This rule detects potential misuse of the `WerFaultSecure.exe` process to manipulate Protected Process Light (PPL) processes, such as LSASS, or to disrupt security solutions like EDRs and antivirus software. Attackers may use tools like EDR-Freeze and WSASS, which exploit `WerFaultSecure.exe` to gain access to sensitive process memory or disable protective measures. This activity is related to the MITRE ATT&CK tactic of defense evasion (T1562.001) and credential access (T1003.001). The primary telemetry sources include Windows process creation logs and relevant fields detailing command line arguments.

  If this detection is confirmed as malicious, the impact could be significant, providing an attacker unfettered access to sensitive information and compromising the security posture of the affected system. However, it's important to note that this detection does NOT confirm malicious activity on its own, as legitimate debugging operations may also generate similar command lines.

  ### Investigation Steps

  - **Identify command line patterns:** Check for command lines associated with `WerFaultSecure.exe` that include flags such as `/h`, `/pid`, `/tid`, `/encfile`, `/cancel`, `/type`, and the specific identifier `268310`. Malicious events often stem from suspicious parental processes like `WSASS.exe` or `EDR-Freeze_[version].exe`.

  - **Check Event ID 4688:** Review Windows Security Event ID 4688 for new process creation details and look for any processes that utilize `WerFaultSecure.exe`. Focus particularly on the `ParentCommandLine` field to distinguish benign from malicious parent processes.

  - **Validate host context:** Determine the role and criticality of the host running `WerFaultSecure.exe`. Legitimate usage is rare in most environments, and any instance should prompt a deeper investigation, particularly if it concerns critical assets.

  - **Examine EDR/AV logs:** If applicable, analyze logs from security solutions to identify abnormal behavior or alerts that indicate interactions with `WerFaultSecure.exe`. Look for any alarms raised around the same time as the detected command line activity.

  - **Review for file artifacts:** Investigate any artifact creation, such as dumps or log files created during this process manipulation. Look for evidence of file creations or modifications in locations commonly monitored for dumps, such as the Temp directory.

  - **Analyze process memory activity:** Conduct memory analysis of the affected process to determine whether a dump was performed and if any sensitive information (like credentials) was accessed. This provides insight into the impact of the activity.

  ### Prioritization

  This alert is categorized with high severity due to the potential significant impact of exploiting PPL processes and the likely intent to disable critical security solutions. The likelihood of this technique being weaponized is increasing, especially given its use in contemporary attack tools.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of `WerFaultSecure.exe` for debugging, which may trigger false positives. Ensure logging is fully enabled for process creation, as incomplete configurations might miss relevant events. Additionally, benign debugging tools may run under similar patterns in rare cases, further complicating detection. Companion detections, such as monitoring for abnormal processes interacting with the LSASS, can reinforce coverage and improve the fidelity of alerts.

