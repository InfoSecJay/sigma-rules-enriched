note: |
  ### Technical Context
  This detection rule identifies potential misuse of `WerFaultSecure.exe`, a Windows utility that can be exploited by adversaries to manipulate Protected Process Light (PPL) processes, such as LSASS. Attackers may employ techniques such as EDR-Freeze or WSASS to dump or interact with sensitive processes by bypassing PPL protections, thus gaining unauthorized access to security-sensitive information or compromising endpoint security solutions. As legitimate use cases for `WerFaultSecure.exe` are rare, any alerts generated by this rule should be examined closely.

  The relevant MITRE ATT&CK techniques associated with this behavior include **Defense Evasion (T1562.001)**, as the attackers attempt to disable security mechanisms, and **Credential Access (T1003.001)**, since gaining access to LSASS allows for credential dumping. The primary data source that will provide necessary insight into these activities is process creation logs from Windows systems, specifically analyzing the parent command line arguments associated with `WerFaultSecure.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of `WerFaultSecure.exe` with suspicious command line arguments that suggest the use of EDR-Freeze or WSASS, particularly those that include the PID of EDR/antivirus processes.

  - **Analyze Parent Command Lines:** Focus on command line patterns that are explicitly associated with potential misuse, such as "WSASS.exe WerFaultSecure.exe [PID]" and "EDR-Freeze_[version].exe [PID] [timeout]".

  - **Correlate with Endpoint Behavior:** Investigate other endpoint activities around the time of the `WerFaultSecure.exe` execution to identify anomalies, such as attempts to dump memory from LSASS or unusual interactions with security software.

  - **Assess Security Tool Logs:** Examine logs from EDRs, antivirus, and other security tools to identify any alerts or anomalies that coincide with the execution of `WerFaultSecure.exe`, particularly any signs of attempts to pause or disable these security solutions.

  ### Prioritization
  This alert has high severity due to its association with potential credential dumping and bypassing of critical security measures. The ability to manipulate security processes poses a serious threat to the integrity of an enterprise environment, warranting immediate investigation.

  ### Blind Spots and Assumptions
  Detection logic primarily assumes that adversaries will use clearly identifiable command line patterns when invoking `WerFaultSecure.exe`. Any deviations from these patterns may result in undetected misuse. Additionally, a reliance on accurate process creation logs means that environments lacking sufficient logging configuration may not fully capture all relevant events. This rule might miss sophisticated techniques where attackers disguise their activities or use legitimate debugging features appropriately. As such, maintaining comprehensive logging across endpoints is essential for this detection to function effectively.

