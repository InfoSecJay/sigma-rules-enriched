note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell command execution patterns, specifically those leveraging `Invoke-Expression` and `WebClient` to potentially download and execute malicious scripts or payloads. The primary attacker objective is likely to execute obfuscated commands on target systems with the goal of evading detection while executing malicious code. This behavior is relevant to the MITRE ATT&CK framework under the tactics of Defense Evasion (T1027) and Execution (T1059.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on command-line arguments associated with process initiation (Event ID 4688). If the detected behavior is malicious, it can lead to the execution of remote scripts, potential data exfiltration, and further compromise of the affected system. However, this detection does not confirm that malicious activity has occurred on its own, as obfuscation techniques can also be used for legitimate purposes.

  ### Investigation Steps

  - **Review process creation logs for Event ID 4688**: Identify any PowerShell processes initiated with obfuscated command lines. Look specifically for processes originating from `C:\Windows\System32\cmd.exe` with parameters containing `&&set`, `cmd`, `/c`, and `-f`.

  - **Examine the command-line arguments**: Focus on the presence of obfuscation patterns like `{0}`, `{1}`, `{2}`, etc. These typically indicate a deliberate attempt to evade detection and are common in malicious activity.

  - **Check for subsequent process creation events**: After identifying a suspicious PowerShell parent process, look for child processes spawned by it (Event ID 4688) to see if they involve other known malicious activities or command executions.

  - **Identify legitimate use cases**: In many environments, system administrators may use PowerShell to run scripts and automation. Commands with clear and understandable arguments (e.g., `PowerShell -ExecutionPolicy Bypass -File script.ps1`) are likely benign. Compare these to the obfuscated commands found.

  - **Validate with threat intelligence**: Cross-reference detected command patterns with known indicators of compromise (IOCs) or tactics shared in threat intelligence reports to see if similar obfuscation patterns have been associated with any recent threats or campaigns.

  - **Check for file creation or network activity**: Validate potentially malicious execution by looking for file creation (e.g., Event ID 4663) related to downloaded scripts, or any suspicious outbound network connections that may correlate with the execution of the detected commands.

  ### Prioritization

  This alert is rated high severity due to the potential impact of remote script execution on sensitive systems. The likelihood of malicious abuse is significant, as attackers frequently use obfuscated PowerShell commands for exploitation and persistence. Additionally, obfuscation techniques like those captured in this rule are commonly weaponized in attacks, necessitating swift investigation.

  ### Blind Spots and Assumptions

  The detection can be evaded by using alternative obfuscation methods that do not trigger the specific command patterns this rule looks for. It is crucial to have comprehensive logging enabled for Windows process creation to ensure all relevant activities can be detected. Legitimate administration scripts may unintentionally trigger this alert if they employ similar obfuscation. A related detection such as monitoring for PowerShell command execution with `-EncodedCommand` (MITRE ATT&CK ID T1059.001) would enhance coverage against these attacks.

