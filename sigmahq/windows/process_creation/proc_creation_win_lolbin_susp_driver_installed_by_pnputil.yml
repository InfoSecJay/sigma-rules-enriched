title: Suspicious Driver Install by pnputil.exe
id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
status: test
description: Detects when a possible suspicious driver is being installed via 
  pnputil.exe lolbin
references:
- https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/pnputil-command-syntax
- https://strontic.github.io/xcyclopedia/library/pnputil.exe-60EDC5E6BDBAEE441F2E3AEACD0340D2.html
author: Hai Vaknin @LuxNoBulIshit, Avihay eldad  @aloneliassaf, Austin Songer 
  @austinsonger
date: 2021-09-30
modified: 2022-10-09
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '-i'
    - '/install'
    - '-a'
    - '/add-driver'
    - '.inf'
    Image|endswith: '\pnputil.exe'
  condition: selection
falsepositives:
- Pnputil.exe being used may be performed by a system administrator.
- Verify whether the user identity, user agent, and/or hostname should be making
  changes in your environment.
- Pnputil.exe being executed from unfamiliar users should be investigated. If 
  known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of `pnputil.exe`, a Windows utility for managing device drivers, especially when it is used with common command-line arguments associated with driver installation. This behavior may indicate an attempt by an attacker to install a malicious or unapproved driver in order to maintain persistence or escalate privileges on the system. The relevant MITRE ATT&CK techniques are Persistence (T1547) and Privilege Escalation (T1068).

  The primary telemetry sources are Process Creation logs (Windows Security Event ID 4688) and also could involve Sysmon logs (Event ID 1) capturing command-line activities. If malicious, the installed driver could allow the attacker ongoing access or control over the system. However, this detection does NOT confirm an actionable compromise on its own, as `pnputil.exe` can also be utilized legitimately by system administrators for driver management.

  ### Investigation Steps

  - **Review process creation logs**: Check for Windows Security Event ID 4688 and Sysmon Event ID 1 related to `pnputil.exe` invocation, focusing on parameters that suggest driver installation such as `-i`, `-a`, `.inf`.

  - **Audit user activity**: Validate the user identity associated with the invocation against known administrative roles; ensure that the action aligns with the user's responsibilities. If the user is a known administrator, the action may be benign.

  - **Analyze command-line parameters**: Look for specific command-line parameters such as `/install`, `/add-driver`, or `-a`. Legitimate usage typically involves administrative users conducting driver updates under controlled circumstances.

  - **Identify system impact**: Check if the driver being installed corresponds to known malicious families or if the driver’s publisher is unrecognized or suspicious. This might involve additional lookup against threat intelligence feeds.

  - **Correlate with other logs**: Look for related logs in Device Setup logs (Event ID 150) which detail driver additions or changes. Correlate with other security events that may indicate similar activities on nearby systems or accounts.

  - **Evaluate asset criticality**: Consider the role of the host where the alert was triggered. If it hosts sensitive functions or data, escalated scrutiny may be warranted.

  ### Prioritization

  The alert should be prioritized as medium severity due to the potential impact on the system if a malicious driver is installed, as well as the likelihood of exploitation given the common use of `pnputil.exe` in various exploitation scenarios. While not overtly malicious by itself, the actions captured by this detection can lead to weaponized behavior.

  ### Blind Spots and Assumptions

  Detection may miss cases where malicious actors employ alternate methods of driver installation or masking the use of `pnputil.exe`. Complete logging of process and command-line activity must be enabled for effective detection. Legitimate administrative tasks can trigger this alert, necessitating contextual knowledge of user behavior. Companion detections to consider include monitoring for anomalous use of other driver-related processes or system modifications, such as Windows Event ID 4100 (Driver package installation).

