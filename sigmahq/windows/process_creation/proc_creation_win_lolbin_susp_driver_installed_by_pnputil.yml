logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '-i'
    - '/install'
    - '-a'
    - '/add-driver'
    - '.inf'
    Image|endswith: '\pnputil.exe'
  condition: selection
falsepositives:
- Pnputil.exe being used may be performed by a system administrator.
- Verify whether the user identity, user agent, and/or hostname should be making changes
  in your environment.
- Pnputil.exe being executed from unfamiliar users should be investigated. If known
  behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This detection rule identifies when `pnputil.exe`, a Windows tool used for managing driver packages, is invoked with specific command-line arguments that suggest the installation of potentially malicious drivers. Such activities are often associated with advanced persistence threats (APTs) and can allow attackers to maintain control over compromised systems and evade security tools. By evading detection through the use of living-off-the-land (LotL) binaries, attackers can install drivers that may provide backdoor access or escalate privileges.

  The likely attacker objective includes maintaining persistence within the environment, leveraging malicious drivers to establish footholds that remain undetected by traditional security controls. This behavior is closely aligned with the MITRE ATT&CK framework, particularly the "Privilege Escalation" tactic (T1068: Exploitation of Vulnerability in Windows Drivers) and the "Persistence" tactic (T1547: Boot or Logon Autostart Execution).

  To effectively correlate potential threats, primary data sources for this detection include process creation logs, which will reveal command line arguments and the users associated with their execution, offering insights into anomalous usage patterns.

  ### Investigation Steps
  - **Review Command Line Arguments:** Examine the command-line arguments used with `pnputil.exe`. Look specifically for flags like `-i`, `/install`, `-a`, `/add-driver`, or any use of `.inf` files, as these can indicate an attempt to install a driver without proper authorization.

  - **Analyze Process Creation Logs:** Investigate process creation logs to identify the user account that executed `pnputil.exe`. Focus on unfamiliar accounts or any administrative actions taken during odd hours.

  - **Correlate with User Activities:** Check user activities and the context surrounding the execution of `pnputil.exe`. Assess whether the user is part of the IT team and whether they have a legitimate reason to install drivers, noting any discrepancies or unusual behavior.

  - **Investigate Driver Signatures:** If suspicious drivers were indeed installed, analyze the driver signatures and metadata for known malicious indicators. Use threat intelligence sources to determine if the signed driver has been associated with any known threats.

  ### Prioritization
  This alert is of medium severity due to the potential impact of unauthorized driver installations on the security posture of the organization. While it may indicate legitimate administrative activity, the likelihood of misuse for malicious purposes necessitates timely investigation to prevent potential breaches.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where process creation logging is not enabled or configured to retain sufficient data history. The effectiveness of this rule assumes that all instances of `pnputil.exe` should be scrutinized, however, legitimate administrative processes may generate false positives. It is critical to have comprehensive logging of process creation events, and administrators should engage in regular reviews to refine the detection logic and mitigate false positives effectively.

