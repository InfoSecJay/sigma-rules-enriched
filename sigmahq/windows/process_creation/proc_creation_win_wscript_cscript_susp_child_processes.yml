title: Cscript/Wscript Potentially Suspicious Child Process
id: b6676963-0353-4f88-90f5-36c20d443c6a
status: test
description: |
  Detects potentially suspicious child processes of Wscript/Cscript. These include processes such as rundll32 with uncommon exports or PowerShell spawning rundll32 or regsvr32.
  Malware such as Pikabot and Qakbot were seen using similar techniques as well as many others.
references:
- Internal Research
- https://github.com/pr0xylife/Pikabot/blob/fc58126127adf0f65e78f4eec59675523f48f086/Pikabot_30.10.2023.txt
- https://github.com/pr0xylife/Pikabot/blob/fc58126127adf0f65e78f4eec59675523f48f086/Pikabot_22.12.2023.txt
author: Nasreddine Bencherchali (Nextron Systems), Alejandro Houspanossian 
  ('@lekz86')
date: 2023-05-15
modified: 2024-01-02
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
  selection_cli_script_main:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    # Note: Add other combinations that are suspicious
  selection_cli_script_option_mshta:
    CommandLine|contains|all:
    - 'mshta'
    - 'http'
  selection_cli_script_option_other:
    CommandLine|contains:
    - 'rundll32'
    - 'regsvr32'
    - 'msiexec'
  selection_cli_standalone:
    Image|endswith: '\rundll32.exe'
  filter_main_rundll32_known_exports:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
    - 'UpdatePerUserSystemParameters'
    - 'PrintUIEntry'
    - 'ClearMyTracksByProcess'
  condition: selection_parent and ( selection_cli_standalone or 
    (selection_cli_script_main and 1 of selection_cli_script_option_*) ) and not
    1 of filter_main_*
falsepositives:
- Some false positives might occur with admin or third party software scripts. 
  Investigate and apply additional filters accordingly.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially malicious child processes spawned by Windows Script Host (either `wscript.exe` or `cscript.exe`). The most common attacker objective is to execute payloads or scripts that utilize common Windows executable files like `rundll32.exe` or `regsvr32.exe` to perform malicious activities without raising alarms. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1203) and technique of Execution through String Manipulation (T1203). The primary telemetry sources are Windows Security logs (Event ID 4688) capturing process creation and Sysmon logs that provide detailed insights into process behavior and command line arguments passed.

  If malicious, the impact could be severe, potentially leading to system compromise or lateral movement. However, this detection does NOT confirm malicious intent on its own, as it may also arise from legitimate administrative scripts or third-party software actions.

  ### Investigation Steps

  - **Review Process Tree:**
    Examine the parent-child process relationships in the telemetry provided, focusing on Event ID 4688 for process creation. Look for `wscript.exe` or `cscript.exe` as the parent processes and identify if subsequent commands executed are part of known malicious patterns.

  - **Analyze Command Line Arguments:**
    Inspect the command line arguments associated with suspicious child processes using Sysmon Event ID 1 logs. Specific attention should be paid to commands involving `rundll32`, `mshta`, or `regsvr32`. Compare against a list of benign options to distinguish between legitimate and potentially malicious behavior.

  - **Validate Process Execution Origin:**
    Identify the execution path of the suspicious process through Event ID 4688. If the image path of `rundll32.exe` or `regsvr32.exe` is atypical (e.g., located in a user profile or temp folders), it is a strong indicator of compromise.

  - **Check for Known Export Usage:**
    Reference the specific exports being invoked by `rundll32.exe` in the context of the command line. Exports like `UpdatePerUserSystemParameters`, `PrintUIEntry`, or `ClearMyTracksByProcess` should not be present; their usage may indicate misuse for malicious payload delivery.

  - **Identify Benign Activity:**
    Acknowledge that the execution of scripts via `wscript.exe` or `cscript.exe` can be legitimate in administrative contexts, especially by IT staff for task automation. Cross-reference the users and processes involved with a known inventory of administrative tasks and authorized scripts.

  - **Cross-Reference with Threat Intelligence:**
    If identified behaviors match documented malware indicators, such as those linked to Pikabot or Qakbot, escalate accordingly. Utilize threat intelligence feeds to validate if the detected patterns align with known malicious behaviors.

  ### Prioritization

  The medium severity of this alert indicates that while the execution of suspicious processes could lead to severe security incidents, not all triggers are malicious. The likelihood of exploitation is moderate due to the nature of the involved applications, which are commonly found in both benign and malicious contexts.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative scripts that spawn these child processes, leading to false positives. It is essential to have full auditing enabled on process creation (Event ID 4688) and appropriate Sysmon configurations to capture critical command line data. Legitimate system maintenance activities could generate similar alerts. A related detection to consider is the monitoring of unusual outbound connections initiated by `rundll32.exe`, which can strengthen context around the executed script and its intent.

