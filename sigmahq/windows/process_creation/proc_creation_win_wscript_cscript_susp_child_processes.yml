title: Cscript/Wscript Potentially Suspicious Child Process
id: b6676963-0353-4f88-90f5-36c20d443c6a
status: test
description: |
  Detects potentially suspicious child processes of Wscript/Cscript. These include processes such as rundll32 with uncommon exports or PowerShell spawning rundll32 or regsvr32.
  Malware such as Pikabot and Qakbot were seen using similar techniques as well as many others.
references:
- Internal Research
- https://github.com/pr0xylife/Pikabot/blob/fc58126127adf0f65e78f4eec59675523f48f086/Pikabot_30.10.2023.txt
- https://github.com/pr0xylife/Pikabot/blob/fc58126127adf0f65e78f4eec59675523f48f086/Pikabot_22.12.2023.txt
author: Nasreddine Bencherchali (Nextron Systems), Alejandro Houspanossian ('@lekz86')
date: 2023-05-15
modified: 2024-01-02
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
  selection_cli_script_main:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    # Note: Add other combinations that are suspicious
  selection_cli_script_option_mshta:
    CommandLine|contains|all:
    - 'mshta'
    - 'http'
  selection_cli_script_option_other:
    CommandLine|contains:
    - 'rundll32'
    - 'regsvr32'
    - 'msiexec'
  selection_cli_standalone:
    Image|endswith: '\rundll32.exe'
  filter_main_rundll32_known_exports:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
    - 'UpdatePerUserSystemParameters'
    - 'PrintUIEntry'
    - 'ClearMyTracksByProcess'
  condition: selection_parent and ( selection_cli_standalone or (selection_cli_script_main
    and 1 of selection_cli_script_option_*) ) and not 1 of filter_main_*
falsepositives:
- Some false positives might occur with admin or third party software scripts. Investigate
  and apply additional filters accordingly.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects potentially malicious child processes spawned by Wscript or Cscript, particularly looking for unusual behavior such as spawning `rundll32`, `regsvr32`, or invoking `mshta` with suspicious command-line arguments. Attackers may utilize these techniques to execute payloads or scripts in a manner that evades common security controls. The relevant MITRE ATT&CK tactics for this detection include Execution (TA0002) and the techniques for Command-Line Interface (T1059) as well as Scripting (T1064).

  Primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1. If this activity is malicious, it may lead to unauthorized remote access, data exfiltration, or lateral movement within the network. Importantly, this alert does not confirm that the observed behavior is definitively malicious; legitimate administrative scripts may produce similar artifacts.

  ---

  ### Investigation Steps

  - **Check process creation logs for suspicious parent-child relationships**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances where `wscript.exe` or `cscript.exe` are spawning processes such as `rundll32.exe`, `regsvr32.exe`, or `mshta.exe` with uncommon command-line arguments.

  - **Inspect command-line arguments for potential indicators of compromise**: Focus on command-line strings in processes spawned by Wscript/Cscript. Look for unusual terms like 'mshta' paired with URLs or suspicious commands in `cmd.exe` or `powershell.exe` processes.

  - **Identify known benign executions**: Verify if the observed behavior correlates with known administrative tasks or third-party scripts. Document any legitimate `rundll32` or `regsvr32` operations, noting typical arguments associated with them.

  - **Correlate against threat intelligence**: Cross-reference the identified process and command-line activities with known threat actors or techniques, particularly those attributed to malware such as Pikabot or Qakbot.

  - **Monitor for additional signs of lateral movement**: Search for any follow-up processes initiated from these suspicious executions that connect to remote servers or interact with sensitive resources (e.g., files on share drives).

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact when malicious software exploits legitimate Windows scripting hosts to execute payloads. The likelihood of malicious activity utilizing these techniques is moderate, as adversaries frequently abuse script execution for persistence and attack vectors.

  ---

  ### Blind Spots and Assumptions

  This detection is limited by the possibility of effective obfuscation or non-standard command-line patterns; attackers may employ more legitimate-looking arguments to evade detection. Dependency on accurate process creation logging is crucial for reliable alerts, so ensure logging is configured correctly across all relevant hosts. Legitimate administrative scripts could trigger this alert, warranting a careful review of script usage in the environment. A companion detection rule for monitoring PowerShell commands and script executions (T1059.001) can enhance coverage of suspicious activity.

