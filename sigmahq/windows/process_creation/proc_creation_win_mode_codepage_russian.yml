logsource:
  category: process_creation
  product: windows
detection:
    # VT Query: behavior:"mode con cp select=1251"
    # VT Query: behavior:"mode con cp select=866"
  selection_img:
  - Image|endswith: '\mode.com'
  - OriginalFileName: 'MODE.COM'
  selection_cli:
    CommandLine|contains|all:
    - ' con '
    - ' cp '
    - ' select='
    CommandLine|endswith:
    - '=1251'         # ANSI Cyrillic; Cyrillic (Windows) - Observed ITW by Dharma ransomware
    - '=866'         # OEM Russian; Cyrillic (DOS) - Observed ITW by other malware
  condition: all of selection_*
falsepositives:
- Russian speaking people changing the CodePage
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential malicious activity where the `MODE.COM` utility is utilized to modify the code page settings of a Windows environment to support the Russian language. This behavior has been notably associated with cyber threats like the Dharma ransomware, which leverages such modifications to facilitate its execution and command-and-control operations. Attackers typically aim to obfuscate their activities by changing language settings or potentially preparing systems for further exploitation, including data exfiltration or encryption.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1560) and **System Information Discovery** (T1082), particularly through techniques that obscure system configurations or exploit local system settings to make detection more difficult. The primary data source for this detection is **process creation events**, which provide insights into command-line arguments and the execution of system utilities like `MODE.COM`.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for entries involving `MODE.COM`. Look for anomalies in the command line, especially the presence of 'con', 'cp', and 'select=' parameters.
  - **Analyze Command-Line Arguments:** Focus on command lines that end with '=1251' or '=866', indicative of a switch to a Cyrillic code page. Confirm if such changes align with known baselining for your environment.
  - **Correlate with User Behavior:** Cross-reference the identified process with user activity logs to determine if the user is a known Russian speaker or has a justified reason for changing system settings.
  - **Assess System Changes and Impact:** Investigate if the code page change correlates with other malicious activities in your environment, such as ransomware-related file modifications or unauthorized access attempts.

  ### Prioritization
  This alert warrants medium severity due to the direct association with known ransomware behavior. While the code page modification alone might not indicate a compromise, its occurrence in conjunction with other suspicious actions could signify impending threats, making it essential for rapid investigation.

  ### Blind Spots and Assumptions
  The detection logic assumes that the `MODE.COM` utility will only be invoked in a malicious context when the command line includes specific parameters related to code page changes. However, legitimate use by Russian-speaking users may lead to false positives, thus necessitating context-aware triage. Additionally, for this alert to function properly, the logging configuration must capture detailed process creation events, which includes command-line arguments and process images. Without these logs, detection may be hindered, resulting in gaps in coverage for this behavior.

