note: |
  ### Technical Context

  This Sigma rule detects the execution of the `mode.com` utility to change the system's code page to Russian (Cyrillic). The intent behind this behavior can often be linked to evasion tactics employed by adversaries, such as the operators behind Dharma ransomware, who alter code pages to obfuscate their activities from security monitoring and potentially leverage the modified environment for malicious operations.

  The relevant MITRE ATT&CK technique is "Change System Location" (T1036), where attackers alter system configurations to evade detection or manipulate system behavior. Primary telemetry sources include Windows Process Creation events, specifically Event ID 4688 and Sysmon Event ID 1, which capture process invocations and command-line arguments. The security impact of this behavior is significant; if malicious, it could enable further exploitation of the system or evade detection mechanisms.

  This detection does NOT confirm malicious activity on its own, as legitimate users (e.g., Russian speakers) may also modify the code page for valid purposes.

  ### Investigation Steps

  - **Review process creation logs**: Check for Event ID 4688 and Sysmon Event ID 1 in security logs, looking for any executed command lines containing `mode.com`. Note that legitimate usage typically has command lines like `mode con cp select=1251` or `mode con cp select=866` but should be evaluated within the context of user activity.

  - **Assess the account context**: Analyze the user account initiating the process to determine if it has a legitimate business case for modifying the code page, e.g., users from Russian-speaking regions or relevant departments.

  - **Identify high-confidence malicious indicators**: Look for command lines that strictly include `mode con cp select=` followed by `1251` or `866` with no accompanying legitimate context. Correlate with timestamps of known ransomware behavior or user reports of malware activity.

  - **Check system behavior**: Validate whether there are subsequent unusual events on the same endpoint, such as unexpected file modifications or network connections, which may indicate ongoing malicious activity following the code page change.

  - **Review potential false positives**: Investigate if there are historical logs (such as Windows Event Logs) indicating regular use of `mode.com` by known users or processes in your environment, to rule out normal operational use.

  ### Prioritization

  This alert will generally have medium severity. The impact could be high if it involves critical systems or data, particularly if ransomware or other malware is involved, and the likelihood of malicious abuse is moderate given that ransomware groups have historically used this tactic. However, it is vital to consider normal usage patterns within the enterprise.

  ### Blind Spots and Assumptions

  Detection limitations include the risk of false negatives if `mode.com` is obfuscated or renamed by sophisticated adversaries. Accuracy relies on comprehensive logging, and any gaps in process creation logs could lead to missed detections. There could also be legitimate scenarios, such as cultural language adjustments by personnel, which may inaccurately trigger this alert. A related detection to consider would be monitoring for changes in file extensions or encryption events following code page modifications, which could strengthen overall coverage against ransomware detection.

