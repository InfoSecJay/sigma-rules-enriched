note: |
  ### Technical Context

  This rule detects attempts to modify the code page on a Windows system using the `mode.com` utility, specifically to set the language to Russian. Such activity is commonly associated with attackers seeking to obfuscate their operations or facilitate communication with malicious tools that may exploit vulnerabilities in a localized environment. The relevant MITRE ATT&CK technique is **T1036: Masquerading**.

  Primary telemetry sources include **Windows Process Creation** logs, specifically Security Event ID **4688** and Sysmon Event ID **1**, capturing process creation events that include command-line parameters. If this detection is confirmed to be malicious, it could indicate preparations for ransomware deployment, such as the known tactics employed by the Dharma ransomware variants. Importantly, this detection does not confirm that malicious activity has occurred without further corroborating evidence.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Event ID 4688 logs for instances of `mode.com` being executed. Look for a command line that includes `con cp select=1251` or `con cp select=866` to confirm possible malicious intent.

  - **Verify context of the execution**: Determine if the command was run on a system typically used for legitimate purposes (e.g., user workstations) versus critical infrastructure, assessing the risk based on asset criticality.

  - **Identify high-confidence malicious indicators**: Look for command-line strings containing `con cp select=` followed by either `1251` or `866`, as this is a strong indicator of potential compromise rather than benign usage.

  - **Check for user account activity**: Analyze user account logs to see if the change in code page corresponds with any suspicious login activity or occurrences of previous security incidents.

  - **Understand legitimate behavior**: If the user is a native Russian speaker, carefully document their justification for executing a code page change and correlate with user account activity and prior logs to establish legitimacy.

  - **Cross-reference related detections**: Look for companion alerts that might suggest coordinated activity, such as abnormal file modifications or suspicious network connections around the time of the `mode.com` execution.

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact of code page modifications on the system's security posture. The likelihood of malicious abuse is moderately high, particularly given the association with known ransomware. This behavior is less common in benign contexts, thus warranting further investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as legitimate users changing code pages for local software needs, which can create false positives. Reliable detection requires that exercise of logging from both Security Event IDs and Sysmon settings are correctly configured. Legitimate activities may include software localization by Russian-speaking personnel. A related detection to consider is any alert related to file system modifications executed around the same time as the suspicious code page alteration, which may indicate malicious file system tampering.

