note: |
  ### Technical Context

  This Sigma rule detects the creation of Windows Shadow Copies using system utilities like vssadmin, PowerShell, and WMIC. The likely objective is to extract sensitive data, such as credentials, by creating shadow copies that may reveal previous versions of files or databases. This behavior fits within the MITRE ATT&CK tactic of Credential Access (T1003), particularly techniques T1003.002 (Credential Dumping: Security Account Manager) and T1003.003 (Credential Dumping: Windows Credentials).

  The primary telemetry sources are Windows process creation logs, specifically Event ID 4688, which captures details about processes initiated on the system, and Sysmon Event ID 1, which provides more granular insights into process behavior. If malicious, this activity could lead to significant security implications, including unauthorized access to sensitive information. Notably, this detection alone does not confirm that a successful credential theft occurred; it merely indicates that a shadow copy creation attempt was made.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of vssadmin, PowerShell, or WMIC executing shadow copy creation commands. Focus on timestamps and command-line arguments.

  - **Check command-line arguments:** Specifically look for command line segments containing 'shadow' and 'create' in the Event ID logs to identify if the execution was intended for malicious shadow copy creation.

  - **Analyze user context:** Determine the user account that triggered the process. Check if the user is an administrator performing legitimate backup operations, or if it’s an unauthorized account.

  - **Identify shadow copy creation artifacts:** Validate the existence of new shadow copies using commands like `vssadmin list shadows`. If multiple copies appear without legitimate context, this may be indicative of malicious behavior.

  - **Inspect related alerts:** Note any previous alerts related to account compromise, lateral movement, or unusual user activity from the same host within the last 24-48 hours. Look for correlations that could elevate the severity of the event.

  ### Prioritization

  This alert warrants medium severity as it indicates potential malicious activity that could lead to credential theft. The impact is heightened if the affected system holds sensitive information or is a domain controller. While shadow copy creation is a legitimate administrative function, it can also be weaponized by adversaries to facilitate credential harvesting, making the likelihood of abuse significant.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use cases for shadow copies, especially in backup operations, which could lead to false positives. Ensure that the relevant log sources (event logs for process creation) are configured to collect comprehensive data for reliable detection. Additionally, similar behaviors might be observed during legitimate maintenance; companion detections include monitoring for abnormal access patterns to sensitive files or locations where shadow copies reside.

