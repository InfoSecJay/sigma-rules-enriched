note: |
  ### Technical Context
  This detection rule identifies the creation of Shadow Copies using operating system utilities such as PowerShell and VSSADMIN. Shadow Copies are a feature in Windows that allows for the backup of files or entire volumes by creating snapshots at a specific point in time. While this feature can be used legitimately for system backups and recovery, attackers may exploit it to create copies of sensitive data, including credentials and other sensitive information, which can lead to data exfiltration.

  The likelihood of an attacker using Shadow Copies for credential access falls under the broader credential access tactics and techniques (MITRE ATT&CK techniques T1003, T1003.002, T1003.003). The primary goal for an attacker engaging in such behavior is to gather sensitive information without raising alarms, leveraging utilities that might be considered legitimate for administrative tasks.

  Key data sources for detecting this behavior include process creation logs, specifically focusing on command line arguments for the execution of tools like `vssadmin.exe`, `wmic.exe`, and PowerShell. Monitoring these sources provides insight into potentially malicious use of system functions intended for legitimate purposes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events to identify any instances of `vssadmin.exe`, `wmic.exe`, or PowerShell being executed with command line arguments that include 'shadow' and 'create'.

  - **Examine Command-Line Arguments:** Look for suspicious command-line patterns or parameters in the execution logs that involve Shadow Copies, particularly any unusual timestamps or user accounts involved.

  - **Cross-Reference User Activity:** Check the user accounts that initiated these processes against known legitimate administrative roles. Investigate any anomalies, such as non-administrative users executing these commands.

  - **Assess Backup and Recovery Configurations:** Review system and backup configurations to distinguish between legitimate backup activities and potential misuse of Shadow Copies for data theft.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of credential theft and data exfiltration efforts by malicious users. The likelihood of false positives exists but should be weighed against the criticality of the data that could be obtained through such actions.

  ### Blind Spots and Assumptions
  The detection coverage may be limited by the configuration of process creation logs and the potential for attackers to utilize legitimate administrative roles to conduct their activities. It assumes that the necessary logging of process creation, including command-line arguments, is enabled and appropriately capturing data. If an attacker employs alternative tools or methods not accounted for in this rule, the detection may be ineffective.

