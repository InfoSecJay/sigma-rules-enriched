note: |
  ### Technical Context

  This Sigma rule detects the use of Windows utilities such as PowerShell, WMIC, and VSSAdmin for the creation of shadow copies, which attackers may exploit to capture credential data from the system. The likely objective of an attacker utilizing this technique is to gain access to sensitive information, notably credentials stored in the Security Account Manager (SAM) or NTDS.dit files. This behavior maps to the MITRE ATT&CK Technique T1003.002 (Credential Dumping: Credential Dumping from Shadow Copies) and T1003.003 (Credential Dumping: NTDS and SAM). The primary telemetry sources include process creation logs from Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, unauthorized shadow copies may expose sensitive information leading to further compromise. It's essential to note that this detection does NOT confirm credential access on its own.

  ### Investigation Steps

  - **Check process creation logs: ** Review Security Event ID 4688 or Sysmon Event ID 1 for any instances of `vssadmin.exe`, `powershell.exe`, or `wmic.exe` creating shadow copies. Focus on command lines containing "shadow" and "create."

  - **Validate shadow copy creation commands: ** Investigate the command line parameters of the detected process. Malicious activity typically includes commands like `vssadmin create shadow /for=C:` which are suspicious unless part of a documented backup procedure.

  - **Identify legitimate administrative activity: ** Confirm if the user who executed the command is a legitimate administrator performing expected activities, such as backups or system maintenance that may invoke shadow copy functionality.

  - **Analyze file system changes: ** Look for newly created shadow copies using Volume Shadow Copy Service (VSS) logs or commands like `vssadmin list shadows` to identify any unexpected shadow copies that coincide with the timing of the alert.

  - **Cross-reference user activity: ** Check user authentication logs (Event ID 4624) and activity (Event ID 4625) to determine if the user has a history of administrative actions. Legitimate users may access shadow copies with proper authorization, indicating benign behavior.

  - **Examine for high-confidence malicious indicators: ** Look for any subsequent access to `\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy*` in the logs, which would imply attempts to enumerate or copy data from the shadow copies, reinforcing the likelihood of malicious behavior.

  ### Prioritization

  This alert is medium severity due to its potential impact on sensitive credential exposure. The likelihood of malicious abuse is moderate since shadow copies are often weaponized by adversaries for credential dumping. Timely investigations are crucial to mitigative risks promptly.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of legitimate user accounts or automated backup processes that can trigger this detection, thus potentially masking malicious intent. Reliable detection requires continuous logging of process creation events and may depend on proper Sysmon deployment. Legitimate administrative tasks, such as backups or system snapshots, can also trigger this alert. A companion detection worth monitoring is for unauthorized access attempts to shadow copies logged in the Windows Security Event logs, which may provide additional context regarding the user's activities.

