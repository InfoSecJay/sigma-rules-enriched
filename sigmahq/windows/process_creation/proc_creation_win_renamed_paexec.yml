detection:
  selection:
  - Description: 'PAExec Application'
  - OriginalFileName: 'PAExec.exe'
  - Product|contains: 'PAExec'
  - Hashes|contains:
    - IMPHASH=11D40A7B7876288F919AB819CC2D9802
    - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
    - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
    - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
  filter_main_known_location:
  - Image|endswith: '\paexec.exe'
  - Image|startswith: 'C:\Windows\PAExec-'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Weird admins that rename their tools
- Software companies that bundle PAExec with their software and rename it, so that
  it is less embarrassing
- When executed with the "-s" flag. PAExec will copy itself to the "C:\Windows\" directory
  with a different name. Usually like this "PAExec-[XXXXX]-[ComputerName]"
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of renamed versions of PAExec, a tool commonly used to execute commands on remote Windows systems. Attackers frequently utilize PAExec for post-exploitation activities due to its ability to bypass certain security mechanisms while remaining undetected. By renaming the executable, adversaries aim to obscure its presence and functionality, aligning with their objectives of maintaining access and executing further commands without raising alerts.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Defense Evasion** (TA0005) because attackers are attempting to obfuscate their actions, and the technique **T1202 - Command and Scripting Interpreter** since PAExec functions through command execution. By monitoring for these renamed binaries, defenders can potentially identify misuses of legitimate tools within their environment, which could signal an ongoing compromise by threat actors.

  Key telemetry for this detection primarily stems from **process creation events** on Windows systems, as these logs will contain necessary details regarding executable names, paths, and related hashes that indicate the use of PAExec or its variants.

  ### Investigation Steps
  - **Review Process Creation Logs:** Ensure that you have collected and examined process creation events from Windows Security logs; focus on entries that reference PAExec or its known renamed variants.
  - **Analyze File Hashes:** Cross-reference executed process hashes against known legitimate PAExec hashes to determine any renaming activities. Look for the specific IMPHASH values listed in the detection logic to identify unauthorized executions.
  - **Investigate Execution Context:** Determine the user accounts executing the renamed PAExec versions. Investigate if these accounts had an elevated privilege level or were historically less active, which might indicate suspicious activity.
  - **Correlate with Other Alerts:** Check for any accompanying alerts from your SIEM, EDR, or other security solutions that may indicate lateral movement or other signs of compromise coinciding with the SAExec execution.

  ### Prioritization
  This alert has a **high severity** due to the potential for significant impact in an enterprise environment, as PAExec is often leveraged for lateral movement and remote code execution by threat actors. The likelihood of encountering such malicious executions, particularly in environments where remote administration tools are used, further heightens the urgency for quick investigation and response.

  ### Blind Spots and Assumptions
  One limitation of this detection rule is the potential for false positives associated with legitimate administrative use, particularly when tools like PAExec are renamed for internal purposes. The detection logic assumes that renamed PAExec applications will consistently exhibit similar behaviors and hash patterns. Additionally, the alert will only function effectively if process creation logs are enabled and appropriately configured on target systems. The reliance on specific hashes means that variations or updates to PAExec that change its signature may evade detection.

