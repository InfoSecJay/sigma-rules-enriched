logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Description: 'PAExec Application'
  - OriginalFileName: 'PAExec.exe'
  - Product|contains: 'PAExec'
  - Hashes|contains:
    - IMPHASH=11D40A7B7876288F919AB819CC2D9802
    - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
    - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
    - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
  filter_main_known_location:
  - Image|endswith: '\paexec.exe'
  - Image|startswith: 'C:\Windows\PAExec-'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Weird admins that rename their tools
- Software companies that bundle PAExec with their software and rename it, so 
  that it is less embarrassing
- When executed with the "-s" flag. PAExec will copy itself to the "C:\Windows\"
  directory with a different name. Usually like this 
  "PAExec-[XXXXX]-[ComputerName]"
level: high
note: |
  ### Technical Context

  This rule detects the execution of a renamed version of PAExec, a tool commonly used for remote execution. Attackers may rename PAExec to evade detection while conducting lateral movement, executing commands on target systems, or deploying malware. The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1202) as it focuses on hiding legitimate tool usage. Primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which provide insights into process execution, parent-child relationships, and command-line arguments. If the activity is malicious, it may indicate an attacker's efforts to compromise multiple systems within the network, potentially escalating privileges or executing additional payloads. This detection does not confirm that the execution is malicious; legitimate software usage can trigger this alert.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Event ID 4688 or Sysmon Event ID 1 to identify the execution of `paexec.exe`. Note the command-line arguments and parent process ID to understand the context of execution.

  - **Identify the legitimacy of the execution context:** Compare the noted command-line arguments to established usage patterns of PAExec. Legitimate use may include admin tasks with direct user responsibility or specific software deployments that utilize the tool.

  - **Examine for known indicators:** Look for hashes related to PAExec (IMPHASH values: `11D40A7B7876288F919AB819CC2D9802`, `6444f8a34e99b8f7d9647de66aabe516`, `dfd6aa3f7b2b1035b76b718f1ddc689f`, and `1a6cca4d5460b1710a12dea39e4a592c`) within the logs tied to process creation. High confidence indicators include abnormal file paths or altered naming conventions in conjunction with these hashes.

  - **Check for potential lateral movement:** Investigate if there are execution events from known lateral movement tools or if the executed process attempts to connect to other devices on the network. Look for connections to unusual or unauthorized hostnames or IP addresses.

  - **Correlate with other detection alerts:** Examine for related alerts or suspicious activity patterns, such as unusual use of scheduling tasks or file system changes around the same timeline. Check for companion detections related to command execution and file transfers.

  ### Prioritization

  This alert is of **high severity** due to the potential for an attacker using a trusted tool to maintain persistence and move laterally within the network. Given the common use of PAExec for malicious purposes, this behavior is likely weaponized by threat actors.

  ### Blind Spots and Assumptions

  Evasion techniques may include further renaming of the tool after execution or employing anti-forensics techniques to alter logs. Reliable detection requires continuous monitoring of process creation logs, ensuring that all endpoint logging is configured correctly. Legitimate activities, such as system administrators renaming PAExec for internal use or software bundled with renamed versions, may trigger this alert. Companion detections might include monitoring for unusual command-line arguments associated with typical administrative tools.

