  - Image|startswith: 'C:\Windows\PAExec-'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Weird admins that rename their tools
- Software companies that bundle PAExec with their software and rename it, so 
  that it is less embarrassing
- When executed with the "-s" flag. PAExec will copy itself to the "C:\Windows\"
  directory with a different name. Usually like this 
  "PAExec-[XXXXX]-[ComputerName]"
level: high
note: |
  ### Technical Context

  This detection identifies the execution of renamed versions of PAExec, a tool commonly used for remote process execution, which can be exploited by threat actors for lateral movement within a network. The likely objective is to execute commands or scripts remotely on compromised systems to facilitate further intrusion or data exfiltration. The relevant MITRE ATT&CK tactics and techniques include Execution (TA0002) and Remote Services (T1202).

  The primary telemetry source for this detection is Windows process creation logs, specifically the Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to unauthorized access to critical systems and data. Importantly, this detection alone does not confirm malicious intentions; context about the use of the tool and additional indicators of compromise are required for a definitive assessment.

  ### Investigation Steps

  - **Validate process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances where 'Image' ends with '\paexec.exe' or starts with 'C:\Windows\PAExec-'. Cross-reference these entries with the process creation timestamps and known good baselines for legitimacy.

  - **Identify execution context:** Check the user account associated with the execution. If the process is initiated by a non-admin user or unexpected service account, it may indicate potential malicious activity.

  - **Review rename patterns:** Investigate the file names generated by PAExec, especially those altering the original naming format (e.g., 'PAExec-[XXXXX]-[ComputerName]'). Compare against expected naming conventions for legitimate software usage to identify anomalies.

  - **Search for command-line arguments:** Analyze the command-line parameters used in conjunction with the PAExec execution capturing Event ID 4688. Look for unexpected flags (like '-s') that trigger self-replication or other unusual behaviors.

  - **Cross-examine with related telemetry:** Gather additional context from endpoint detection systems or network logs that show outgoing connections or file transfers related to the executed PAExec process for unwanted lateral movement.

  - **Identify legitimate use cases:** Consider scenarios where PAExec may be legitimately used within the IT operations team, such as remote software deployment, to establish a baseline understanding of expected behaviors.

  ### Prioritization

  This alert is of high severity due to the impact on potentially sensitive systems and the likelihood of being exploited for lateral movement, which is regularly weaponized in advanced persistent threats. The combination of remote execution abilities and the stealthy nature of renamed tools makes this behavior of significant concern for enterprise environments.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate users to rename PAExec for non-malicious purposes, which could generate false positives. Ensuring comprehensive logging from all endpoints is crucial for reliable detection, including proper Sysmon and Windows Event Log configurations. Additionally, alerts may be triggered by benign activities such as remote management by system administrators. A related detection for standard PAExec executions could enhance coverage and reduce false positives associated with benign tool usage.

