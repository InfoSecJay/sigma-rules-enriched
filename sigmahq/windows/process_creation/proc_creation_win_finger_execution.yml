note: |
  ### Technical Context

  This Sigma rule detects the execution of "finger.exe," a legacy utility that queries user information from remote systems, primarily designed for UNIX systems. The likely attacker objective is to use this command as a reconnaissance tool to gather user details and potentially identify weak points for further exploitation. The relevant MITRE ATT&CK tactic is "Command and Control" (T1071) with technique "Application Layer Protocol" (T1105). The primary telemetry source for this detection is Windows process creation logs, specifically tracking the execution paths of commands. If malicious, this utility could be employed in a broader reconnaissance or data exfiltration strategy. Importantly, while detection indicates suspicious activity, it does not confirm that the intent is malicious or that the activity successfully exfiltrated sensitive information.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 for "finger.exe" execution details, including the parent process ID and command-line arguments. Look for unusual parent processes that may indicate malicious intent (e.g., command shells or scripts).

  - **Analyze network activity**: Examine Windows Firewall logs or Network Security Group logs for outbound connections initiated by the machine running "finger.exe." Focus on any unusual remote IP addresses, especially if they align with known command and control (C2) infrastructure.

  - **Cross-reference processes with user activity**: Investigate the user account that executed "finger.exe." Use Event ID 4624 (logon event) to verify if the account is associated with administrative tasks or non-standard behavior. Legitimate use might be uncommon or linked to specific administrative functions.

  - **Identify related processes**: Determine if "finger.exe" was executed alongside other suspicious processes (using Sysmon Event ID 1). Look for signs of lateral movement or privilege escalation, such as subsequent calls to network tools like "net.exe" or "wmic.exe."

  ### Prioritization

  This alert should be considered high priority due to the potential for significant security impact. If executed by a malicious actor, the use of "finger.exe" may indicate active reconnaissance within the network. The utility's rarity makes its presence particularly suspect, elevating the importance of a thorough review.

  ### Blind Spots and Assumptions

  Detection is limited by the infrequent use of "finger.exe," which might lead to both false positives from legitimate administrative tasks and false negatives if attackers use alternative methods for information gathering. Logs should include detailed process creation telemetry, which is critical for reliable detection. Additionally, legitimate use cases may arise during network assessments; thus, context is vital. A related detection to consider includes monitoring for other reconnaissance tools or commands such as "netstat" or "nslookup," which may indicate a coordinated information-gathering effort.

