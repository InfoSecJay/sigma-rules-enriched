note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the "finger.exe" utility on Windows systems. The main behavior observed is an attempt to retrieve user information from remote systems that may run the finger service, which is notably uncommon and suspicious in most enterprise environments. An attacker may utilize this utility as a command-and-control (C2) channel or for reconnaissance purposes against exposed systems.

  The relevant MITRE ATT&CK technique is **Command and Control - T1105**. Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) or Sysmon Event ID 1. If executed maliciously, this behavior may indicate attempts to enumerate users or establish unauthorized communication with external infrastructures. Importantly, detection of "finger.exe" execution does NOT confirm malicious intent; it may also arise from legitimate or benign administrative activities.

  ---

  ### Investigation Steps

  - **Verify execution context:** Check Security Event ID 4688 and Sysmon Event ID 1 for details on the process creation, including the user account and parent process. Ensure that the command line attributes do not show unusual arguments (e.g., connections to external IPs).

  - **Inspect host role:** Verify whether the system executing "finger.exe" is a legitimate administrative machine. Check asset inventory to confirm if the system should be executing administrative tools, as unnecessary tool usage may indicate a compromise.

  - **Review recent network connections:** Query for recent outbound connections from the host using Network logs (e.g., Firewall logs, IDS alerts). Look for connections to suspicious or unexpected external IP addresses that correlate with the timeframe of the "finger.exe" execution.

  - **Identify benign uses:** Understand typical legitimate uses for "finger.exe" within your organization; communicate with IT staff or established protocols that may involve its use in certain system audits or testing scenarios.

  - **Gather additional log context:** Review relevant telemetry from application logs (if available) to assess if any unusual application behavior correlates with the execution of "finger.exe".

  - **High-confidence malicious indicators:** Look for signs of abnormal command line usage or processes spawned from "finger.exe" indicating possible escalation of privilege or lateral movement, especially if combined with known malicious IP addresses or domains.

  ---

  ### Prioritization

  Given that "finger.exe" execution is rarely expected in modern environments, an alert is of **high severity**. The likelihood of malicious exploitation is significant, as the tool can serve as a means to enumerate users on remote systems. Therefore, this behavior should be treated with urgency, particularly in contexts where no legitimate use case is established.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques where an attacker may modify the execution signature of similar tools or scripts to bypass detection. Reliable detection requires that process creation logging is enabled, especially for administrative and security logs. Legitimate administrative tasks may trigger this alert, particularly from legacy systems or during testing processes. Related detections, such as alerts for **Remote Services Enumeration (T1016)**, can provide supplementary context and enhance coverage of potential reconnaissance activities.

