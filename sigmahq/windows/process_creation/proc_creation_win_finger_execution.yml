note: |
  ### Technical Context
  This Sigma rule detects the execution of the "finger.exe" utility on Windows systems. Finger.exe is a legacy tool that communicates with remote computers to display user information and status. While the utility holds legitimate uses, its presence in modern environments is rare. Its execution often indicates suspicious activity, possibly related to command-and-control operations, as threat actors may exploit such obsolete tools to avoid detection.

  An attacker may leverage finger.exe to gather information about users on remote machines, potentially as part of reconnaissance in preparation for further intrusions or privilege escalation activities. The relevant MITRE ATT&CK tactics include **Command and Control** (T1071.001) and **Data Obfuscation** (T1001), as this utility can be misused to exfiltrate or gather information covertly. Primary data sources for detection include process creation events logged by the operating system, which record when and how processes are spawned.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs to identify instances of finger.exe execution, including timestamps and associated user accounts.
  - **Analyze Network Traffic:** Check network logs for any unusual outbound connections from the host running finger.exe, especially to known external IPs or uncommon ports.
  - **Check Related User Activity:** Investigate the user account that executed finger.exe for any abnormal behavior, such as accessing sensitive data or using other obscure utilities.
  - **Evaluate Environment for Finger Service:** Determine if any remote machines have the finger service enabled, validating the necessity and legitimacy of the utility's use in your environment.

  ### Prioritization
  This alert should be treated with high severity due to the potential for misuse of finger.exe in a command-and-control context. Its execution is out of the ordinary in most enterprise environments, raising suspicion of potential reconnaissance or data gathering by threat actors.

  ### Blind Spots and Assumptions
  Detection coverage could be limited if process creation logging is not enabled on all endpoints, or if the logging level does not capture information about legacy utilities. This detection assumes that finger.exe would not be used for legitimate administrative tasks, which may not be the case in every environment. Additionally, without external visibility into network communications, the context of the utilization may remain unclear. Required logs for this rule include detailed process creation logs on Windows systems.

