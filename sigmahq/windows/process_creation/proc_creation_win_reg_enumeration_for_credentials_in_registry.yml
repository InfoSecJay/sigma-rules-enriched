title: Enumeration for Credentials in Registry
id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
status: test
description: |
  Adversaries may search the Registry on compromised systems for insecurely stored credentials.
  The Windows Registry stores configuration information that can be used by the system or other programs.
  Adversaries may query the Registry looking for credentials and passwords that have been stored for use by other programs or services
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.002/T1552.002.md
author: frack113
date: 2021-12-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1552.002
logsource:
  category: process_creation
  product: windows
detection:
  reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
    - ' query '
    - '/t '
    - 'REG_SZ'
    - '/s'
  hive:
  - CommandLine|contains|all:
    - '/f '
    - 'HKLM'
  - CommandLine|contains|all:
    - '/f '
    - 'HKCU'
  - CommandLine|contains: 'HKCU\Software\SimonTatham\PuTTY\Sessions'
  condition: reg and hive
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential credential enumeration activities conducted by adversaries on Windows systems. Specifically, it focuses on instances where the `reg.exe` command-line utility is used to query the Windows Registry for insecurely stored credentials or passwords. Attackers may exploit this method to extract sensitive information from the Registry and then leverage these credentials to escalate privileges, move laterally, or maintain persistence within the environment.

  The primary objectives of such an attack include gaining unauthorized access to user accounts and services by extracting stored credentials from the Registry, subsequently facilitating further malicious actions such as data exfiltration or deployment of additional malware. Relevant MITRE ATT&CK tactics and techniques that apply to this detection include:

  - **Credential Access** (T1552)
    - **Unsecured Credentials** (T1552.002)

  The best evidence for detecting this behavior will come from process creation events that record command-line arguments and the execution of processes, particularly the invocation of `reg.exe` with specific parameters indicative of registry querying.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the logs for instances of `reg.exe` being executed. Focus on the command lines that include terms such as `query`, `/t`, `REG_SZ`, and `/s` which suggest credential enumeration activities.

  - **Inspect Registry Access Patterns**: Look for patterns of access to specific registry hives, such as `HKLM` and `HKCU`, especially for commands including `/f`. Particular attention should be paid to the accessing of sessions stored under `HKCU\Software\SimonTatham\PuTTY\Sessions`.

  - **Correlate with User Activity**: Correlate the findings with user activity to determine if the commands were invoked by legitimate users or if they potentially indicate malicious intent, especially during off-hours or unusual times.

  - **Check for Lateral Movement Indicators**: Investigate for any subsequent activities or processes that may hint at lateral movement or privilege escalation after the credential enumeration attempt, such as unusual logins or access to sensitive resources.

  ### Prioritization
  This alert should be prioritized as a medium-severity incident due to the critical nature of credential access outcomes in an enterprise environment. The likelihood of an adversary exploiting insecurely stored credentials to gain further access makes it essential for quick investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging of command-line arguments for process creation is not enabled, leading to incomplete visibility into potential credential access attempts. Additionally, this rule assumes that credential enumeration will only be performed using `reg.exe`, which may not always be the case as attackers might use other tools or methods. Required logs for this detection to function effectively include comprehensive process creation logs that capture command-line details for all user actions.

