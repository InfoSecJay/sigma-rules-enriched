title: Enumeration for Credentials in Registry
id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
status: test
description: |
  Adversaries may search the Registry on compromised systems for insecurely stored credentials.
  The Windows Registry stores configuration information that can be used by the system or other programs.
  Adversaries may query the Registry looking for credentials and passwords that have been stored for use by other programs or services
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.002/T1552.002.md
author: frack113
date: 2021-12-20
modified: 2022-12-25
tags:
- attack.credential-access
- attack.t1552.002
logsource:
  category: process_creation
  product: windows
detection:
  reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
    - ' query '
    - '/t '
    - 'REG_SZ'
    - '/s'
  hive:
  - CommandLine|contains|all:
    - '/f '
    - 'HKLM'
  - CommandLine|contains|all:
    - '/f '
    - 'HKCU'
  - CommandLine|contains: 'HKCU\Software\SimonTatham\PuTTY\Sessions'
  condition: reg and hive
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts by adversaries to enumerate credentials stored in the Windows Registry, particularly using the `reg.exe` command-line tool. The likely attacker objective is to discover insecurely stored sensitive information, such as passwords associated with applications or services, which can then be leveraged for further exploitation or lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique "Credentials from Password Stores" (T1552.002).

  The primary telemetry sources for this detection are process creation events from Windows, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, successful enumeration can lead to unauthorized access to services, credentials compromise, and subsequent privilege escalation. Importantly, this detection does not confirm that credentials have been successfully exfiltrated or utilized; it only identifies attempts to access potentially sensitive information.

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `reg.exe` execution. Look for log entries with CommandLine containing parameters like `query`, `/t`, `/f`, and specifically targeting `HKCU` or `HKLM`.

  - **Identify malicious indicators**: Check for command lines that include `HKCU\Software\SimonTatham\PuTTY\Sessions`. This suggests potential intent to extract SSH session credentials, which are often stored insecurely.

  - **Assess legitimate use cases**: Determine if similar `reg.exe` commands are being executed by known administrative accounts performing routine maintenance or audits. Look for process creation logs that show legitimate administrative process chains, indicating regular management tasks.

  - **Analyze user context**: Investigate the user context under which the command was executed. If the originating user is not part of the administrative team or lacks legitimate reasons for querying the registry, classify the event as suspicious.

  - **Check for processing anomalies**: Validate if there are unusual failures or repeated attempts from the same user to access different registry hives. This could indicate an active enumeration attempt by an attacker.

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on sensitive credential exposure. The likelihood of malicious intent is emphasized as the specific command structure is often associated with adversarial behavior targeting credential stores. Although not the most common attack vector, successful enumeration can lead to significant security breaches if exploitable credentials are obtained.

  ### Blind Spots and Assumptions

  Detection may be limited by the inability to distinguish between benign administrative actions and malicious activities, particularly if appropriate logging is not in place. Legitimate activities, such as software updates or system auditing by administrators, may trigger the alert frequently. Ensuring full coverage of process creation logs is essential for reliable detection. This rule can be strengthened by companion detections, such as monitoring for abnormal network connections following credential enumeration, potentially indicative of exfiltration attempts or further exploitation efforts.

