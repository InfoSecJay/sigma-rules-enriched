logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'create'
    - 'binPath'
  filter_optional_dropbox:
    ParentImage|startswith:
    - 'C:\Program Files (x86)\Dropbox\Client\'
    - 'C:\Program Files\Dropbox\Client\'
    ParentImage|endswith: '\Dropbox.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate administrator or user creates a service for legitimate reasons.
- Software installation
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of a new Windows service using the `sc.exe` command-line utility, a behavior often associated with establishing persistence or privilege escalation by adversaries. The likely attacker objective is to maintain control over the compromised system by creating a service that could run malicious payloads or maintain unauthorized access. This behavior is linked to the MITRE ATT&CK framework under the tactic of Persistence, specifically technique T1543.003: Create or Modify System Service.

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Event ID 4688, which details the creation of new processes. If malicious, this action can lead to unauthorized persistence, allowing adversaries to regain access after system reboots. It is important to note that this detection alone does not confirm malicious intent, as legitimate system administrators may create services for valid operational purposes.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 4688 specifically for `sc.exe` as the process name. Validate that the CommandLine contains both "create" and "binPath".

  - **Assess parent process context:** Determine if `sc.exe` is being executed from a standard location or a suspicious one. If the ParentImage field contains paths like `C:\Program Files (x86)\Dropbox\Client\Dropbox.exe`, it could indicate benign activity related to legitimate updates.

  - **Investigate created services:** Use PowerShell to query the Services using `Get-Service` to verify the new service created aligns with expected service names. Look for services with unusual names or execution paths.

  - **Determine expected behavior:** Consider the environment role; legitimate administrators may create services during software installations or maintenance. Update logs and user actions during such instances can provide context.

  - **Identify malicious indicators:** Look for discrepancies in the service configuration, such as unexpected executable paths or commands in the binPath. Misconfigured or irrelevant paths could indicate caller backdoors.

  ---

  ### Prioritization

  Alert severity is considered low because while the behavior is associated with persistence techniques, the likelihood of malicious abuse is contingent on context. The impact would largely depend on the criticality of the system involved and the discernment of legitimate versus suspicious service creation practices.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers who utilize legitimate administrative tasks or scripts that also invoke `sc.exe`. Reliable detection relies on comprehensive logging configurations that capture all necessary process creation data. Legitimate software installations could trigger similar alerts. A related detection to consider is monitoring for changes to existing services or configurations, which can complement the coverage provided by this rule.

