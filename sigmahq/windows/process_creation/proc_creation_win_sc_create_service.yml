logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'create'
    - 'binPath'
  filter_optional_dropbox:
    ParentImage|startswith:
    - 'C:\Program Files (x86)\Dropbox\Client\'
    - 'C:\Program Files\Dropbox\Client\'
    ParentImage|endswith: '\Dropbox.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate administrator or user creates a service for legitimate reasons.
- Software installation
level: low
note: |
  ### Technical Context

  This rule detects the creation of a new Windows service using the `sc.exe` command-line utility, which is often used for persistence and privilege escalation by adversaries. The objective of an attacker triggering this behavior is typically to establish a backdoor for maintaining access or running malicious processes under the guise of legitimate services. This aligns with the MITRE ATT&CK tactic of Persistence (T1543.003). Primary telemetry sources include Windows process creation logs (Security Event ID 4688 and/or Sysmon Event ID 1), which capture the execution of processes, including their command-line arguments. Malicious activity can compromise system integrity by allowing unauthorized applications to run with elevated privileges. This detection does NOT confirm the intent behind the service creation; legitimate administrators may also create or modify services for valid operational reasons.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for events where the `Image` field ends with `\sc.exe`. Look closely at the `CommandLine` field for the presence of both `create` and `binPath` parameters.

  - **Assess parent process details:** Evaluate the `ParentImage` field for any service creation commands. If the parent process starts with `C:\Program Files (x86)\Dropbox\Client\` or similar, this may indicate a benign condition associated with legitimate Dropbox operations, but further validation is necessary.

  - **Validate command execution context:** Confirm whether the command was executed under an account with sufficient privileges. Investigate the `UserName` field in the logs to see if it corresponds to an administrative account, which could suggest malicious intent if anomalous.

  - **Identify high-confidence malicious indicators:** Look for unusual or suspicious entries in the `binPath` (e.g., paths to non-standard executables or scripts) that deviate from typical service behavior. An example might include paths that reference executable files from temporary folders or user directories.

  - **Correlate with known service behavior:** Cross-reference any newly created services against a list of standard services running on the system. Legitimate entries typically follow established naming conventions and executable paths, while unknown or arbitrarily named services may indicate malicious activity.

  - **Investigate potential service functionality:** Check for any service functionality associated with newly created services. Legitimate applications do not typically create services that execute scripts or batch files. Validate against expected application behavior.

  ### Prioritization

  This detection has a low alert severity due to its potential benign nature, but the impact can be significant if the affected system is critical, especially since persistence mechanisms are often targeted by adversaries. Compromised services can frequently be weaponized and signal a deeper compromise, warranting timely investigation.

  ### Blind Spots and Assumptions

  Evasion techniques include the use of names that mimic legitimate services or service creation through alternative methods. Reliable detection requires appropriate logging configurations to capture command-line usage and process creation events. Legitimate activities, such as software installations or administrative configurations, might also trigger the alert. A related detection to consider is monitoring for command-line arguments from PowerShell (T1059.001) as they may also be used to create or modify services, enhancing coverage on this persistence technique.

