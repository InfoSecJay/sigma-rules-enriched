logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
    - 'create'
    - 'binPath'
  filter_optional_dropbox:
    ParentImage|startswith:
    - 'C:\Program Files (x86)\Dropbox\Client\'
    - 'C:\Program Files\Dropbox\Client\'
    ParentImage|endswith: '\Dropbox.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate administrator or user creates a service for legitimate reasons.
- Software installation
level: low
note: |
  ### Technical Context
  This detection rule identifies the creation of new services using the "sc.exe" utility on Windows systems. Service creation through "sc.exe" can be an indicator of malicious activity, as adversaries may exploit this method to establish persistence or escalate privileges by installing malicious services. In particular, attackers may create services to ensure that their payloads run at startup or to disguise malfeasance as legitimate system activities.

  The likely objectives of an attacker using this technique include establishing persistence (making sure malware runs after a reboot) and potentially escalating privileges through a service that runs with elevated permissions. The relevant MITRE ATT&CK techniques include **T1543.003: Create or Modify System Service**, which pertains directly to the manipulation of Windows services for these purposes. Additionally, deception tactics related to **T1071: Application Layer Protocol** may be employed if the created service communicates externally, while **T1033: System Owner/User Discovery** can be leveraged when the attacker aims to learn more about the victim's environment.

  Primary data sources that are critical for capturing relevant activity include Windows process creation events, which log the invocation of commands and associated command-line parameters. Monitoring for specific actions taken by "sc.exe" and correlating them with other security logs could reveal abnormal behaviors indicative of compromise.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for process creation events that involve "sc.exe," focusing on the command line for keywords like "create" and "binPath." Look for unusual execution patterns correlated with user behavior.
  - **Check Service Configuration:** Use tools like `Get-Service` in PowerShell to list services recently created or modified. Cross-reference this list with known good services to identify potential rogue services.
  - **Investigate Parent Processes:** Examine the parent process of the "sc.exe" invocation. Pay special attention to unusual parent processes, particularly those related to user applications, to discern patterns indicative of misuse.
  - **Correlate with Other Activity Logs:** Look for any related artifacts such as network connections, file modifications, or user account activities that coincide with the creation of the service to build a comprehensive view of the event.

  ### Prioritization
  The low severity of this alert stems from its potential for false positives, often occurring during legitimate software installations or administrative maintenance. However, organizations should remain vigilant as even benign service creations can be leveraged by attackers for nefarious purposes.

  ### Blind Spots and Assumptions
  This detection logic assumes that all relevant instances of "sc.exe" execution are logged adequately; however, certain configurations or environmental factors may inhibit visibility. Additionally, it does not account for service creation through other means, such as PowerShell or direct registry modifications. Logs from process creation must be properly configured and not filtered out to ensure comprehensive monitoring of these activities.

