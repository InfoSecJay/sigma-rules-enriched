note: |
  ### Technical Context

  This rule detects the creation of a WMI backdoor in Microsoft Exchange Transport Agents, specifically monitoring for processes spawned by EdgeTransport.exe that may indicate the presence of malicious activity through unauthorized WMI event filters. The likely attacker objective is to maintain persistence and establish a means of remote command and control within the Exchange infrastructure, often leveraging this for privilege escalation or lateral movement within the network. This detection aligns with the MITRE ATT&CK tactic of Persistence and its technique T1546.003 (WMI Event Subscription).

  The primary telemetry source is Windows Process Creation logs, specifically Security Event ID 4688. Additionally, Sysmon Event ID 1 may provide insights into the process creation context. If malicious, this behavior could lead to significant impacts, such as unauthorized access to sensitive email data or disruption of email services. Importantly, this detection does NOT confirm that all detected instances are malicious on their own; further investigation is necessary to understand the context and intent behind the process instantiation.

  ### Investigation Steps

  - **Examine process creation details**: Review Security Event ID 4688 for processes spawned by EdgeTransport.exe. Take note of parent process IDs (PPIDs) and command-line arguments to assess context.

  - **Identify associated child processes**: Check for additional processes initiated subsequently by conhost.exe (e.g., Event ID 4688 or Sysmon Event ID 1) that may indicate malicious activities leveraging the WMI backdoor.

  - **Validate expected behavior of OleConverter.exe**: Confirm if OleConverter.exe is being executed from its legitimate path, typically `C:\Program Files\Microsoft\Exchange Server\<Version>\Bin\OleConverter.exe`, and assess process arguments for any anomalies indicative of misuse.

  - **Look for remote or unusual WMI calls**: Investigate if there were any unexpected WMI calls (via WMI logs) made from the Exchange environment, especially targeting modifications of event filters, which can indicate abuse of WMI persistence mechanisms.

  - **Correlate with DNS and network activity**: Verify any outbound connections initiated by the EdgeTransport.exe or its child processes in firewall or proxy logs. Look for anomalous or unexpected connections, which may signal external command and control communication.

  - **Identify legitimate operational activities**: Consider reviewing the organization's scheduled tasks or maintenance activities that typically involve EdgeTransport.exe, ensuring there are no legitimate operational tasks misconstrued as malicious activity.

  ### Prioritization

  The severity of this alert is critical due to the potential impact on the email infrastructure and the likelihood that the behavior is indicative of a sophisticated adversary attempting to gain persistence in a critical system. This technique is particularly concerning as it is a common method leveraged in attacks against Exchange servers.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete WMI activity logs, which are essential for accurately understanding the breadth of WMI-related actions. Legitimate administrative tasks or maintenance scripts may trigger this detection, potentially leading to false positives. The presence of companion detections focusing on unusual WMI calls or abnormal process interactions would strengthen coverage and reduce the risk of missing malicious activities.

