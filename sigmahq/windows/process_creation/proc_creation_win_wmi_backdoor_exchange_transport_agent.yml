logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\EdgeTransport.exe'
  filter_conhost:
    Image: 'C:\Windows\System32\conhost.exe'
  filter_oleconverter:    # FP also documented in https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=18
    Image|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
    Image|endswith: '\Bin\OleConverter.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies the presence of a WMI (Windows Management Instrumentation) backdoor implemented through an Exchange Transport Agent. Threat actors may leverage this technique to gain persistent access to compromised systems, allowing them to execute malicious commands or exfiltrate data without detection. The targeted environment typically involves Microsoft Exchange Servers, where attackers can manipulate email processing to achieve their objectives.

  The main MITRE ATT&CK tactics applicable to this detection are **Persistence (T1546.003)** and **Privilege Escalation (T1045)**. By exploiting the capabilities of WMI, attackers can create malicious event filters that execute payloads when specific criteria are met, thus maintaining long-term access to the environment. Primary data sources that are most useful for this detection include **process creation events** from Windows systems, particularly focusing on the parent-child relationship of processes to identify any unusual spawning of legitimate executables like `OleConverter.exe` from the Exchange Server directory.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate logs for `EdgeTransport.exe` parent processes to identify any child processes connected to WMI event filters, specifically looking for unusual `conhost.exe` or `OleConverter.exe` executions.
  - **Analyze WMI Event Filters**: Use WMI querying tools or scripts to list all WMI event filters on the Exchange server, looking for any anomalies or filters that have been added recently by unauthorized users or processes.
  - **Check for Unusual Registry Keys**: Perform a review of the Windows Registry for persistence mechanisms commonly associated with WMI backdoors. Pay close attention to keys related to WMI and Exchange configurations.
  - **Correlate with Indicator of Compromise (IOC) Data**: Cross-reference any findings with known IOCs or TTPs associated with WMI-based attacks to further validate the threat's presence.

  ### Prioritization
  The alert is classified as **critical** due to the severe implications of an attacker obtaining persistence through WMI backdoors, which could lead to extensive unauthorized access and significant data breaches in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the organization's processes are not properly logging event creation or if WMI query logs are not being collected at all. The detection logic assumes the standard configurations of Exchange servers and that the necessary logging for process creation and WMI events is enabled. Environment-specific configurations could potentially obscure malicious activities, leading to false negatives if logs are incomplete or misconfigured.

