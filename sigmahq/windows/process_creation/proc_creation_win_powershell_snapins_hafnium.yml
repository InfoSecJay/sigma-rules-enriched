title: Exchange PowerShell Snap-Ins Usage
id: 25676e10-2121-446e-80a4-71ff8506af47
status: test
description: Detects adding and using Exchange PowerShell snap-ins to export 
  mailbox data. As seen used by HAFNIUM and APT27
references:
- https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://www.intrinsec.com/apt27-analysis/
author: FPT.EagleEye, Nasreddine Bencherchali (Nextron Systems)
date: 2021-03-03
modified: 2023-03-24
tags:
- attack.execution
- attack.t1059.001
- attack.collection
- attack.t1114
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains: 'Add-PSSnapin'
  selection_module:
    CommandLine|contains:
    - 'Microsoft.Exchange.Powershell.Snapin'
    - 'Microsoft.Exchange.Management.PowerShell.SnapIn'
  filter_msiexec:
        # ParentCommandLine: C:\Windows\System32\MsiExec.exe -Embedding C9138ECE2536CB4821EB5F55D300D88E E Global\MSI0000
    ParentImage: 'C:\Windows\System32\msiexec.exe'
    CommandLine|contains: '$exserver=Get-ExchangeServer ([Environment]::MachineName)
      -ErrorVariable exerr 2> $null'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that add Exchange PowerShell snap-ins, typically used for exporting mailbox data. Such behavior may indicate an attacker attempting to manipulate Exchange environments to exfiltrate sensitive information, aligning with the objectives of advanced persistent threats (APTs) like HAFNIUM and APT27. The detection corresponds to MITRE ATT&CK techniques: Execution (T1059.001) and Collection (T1114).

  The primary telemetry source for this detection involves Windows process creation logs that record command line executions, specifically for PowerShell. If the behavior is malicious, an attacker could gain unauthorized access to mailbox data, leading to data breaches or credential theft. Notably, this detection alone does not confirm compromise; it merely signals potentially suspicious activity that warrants further investigation.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `powershell.exe` or `pwsh.exe`, focusing on those with a CommandLine containing `Add-PSSnapin`. Examine the timestamps to correlate with the alert trigger.

  - **Identify legitimate PowerShell usage:** Look for instances of PowerShell being run with expected administrative tasks, such as script execution for account management or system updates. Legitimate command lines are often more verbose and context-specific, avoiding the use of `Add-PSSnapin`.

  - **Examine add-in lists:** Validate the presence of authorized Exchange PowerShell snap-ins. Use the Command `Get-PSSnapin` to list currently loaded snap-ins and compare the output against documented operational requirements to spot unauthorized additions.

  - **Correlate with user activity:** Investigate user accounts that triggered the alert by cross-referencing Active Directory logs and ensuring they align with administrative roles. Abnormal access patterns, such as non-administrative accounts executing these commands, should raise suspicion.

  - **Review parent processes:** Analyze logs for event chains, especially those involving `msiexec.exe`, using additional Windows Event ID 4688 to determine if the snap-in was executed in an unusual context suggesting potential exploitation.

  - **Assess mailbox access logs:** Query Exchange mailbox audit logs (if enabled) for suspicious access patterns, looking for unexplained access to sensitive mailboxes in conjunction with the PowerShell activity.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact of unauthorized data access in Exchange environments. The likelihood of malicious abuse is elevated given that APT groups are known to exploit such functionalities, and PowerShell snap-in manipulation is a common tactic among sophisticated adversaries.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of certain logging configurations, such as PowerShell transcription or module logging, which provide more context. It is essential to ensure that logging is correctly configured to capture these activities comprehensively. Legitimate administration activity, particularly during maintenance windows or scheduled tasks, may inadvertently trigger the alert. A related detection, such as monitoring for unusual access patterns in Exchange logs, can strengthen incident response capabilities on this front.

