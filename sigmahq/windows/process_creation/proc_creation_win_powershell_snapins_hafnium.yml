title: Exchange PowerShell Snap-Ins Usage
id: 25676e10-2121-446e-80a4-71ff8506af47
status: test
description: Detects adding and using Exchange PowerShell snap-ins to export mailbox
  data. As seen used by HAFNIUM and APT27
references:
- https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://www.intrinsec.com/apt27-analysis/
author: FPT.EagleEye, Nasreddine Bencherchali (Nextron Systems)
date: 2021-03-03
modified: 2023-03-24
tags:
- attack.execution
- attack.t1059.001
- attack.collection
- attack.t1114
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains: 'Add-PSSnapin'
  selection_module:
    CommandLine|contains:
    - 'Microsoft.Exchange.Powershell.Snapin'
    - 'Microsoft.Exchange.Management.PowerShell.SnapIn'
  filter_msiexec:
        # ParentCommandLine: C:\Windows\System32\MsiExec.exe -Embedding C9138ECE2536CB4821EB5F55D300D88E E Global\MSI0000
    ParentImage: 'C:\Windows\System32\msiexec.exe'
    CommandLine|contains: '$exserver=Get-ExchangeServer ([Environment]::MachineName)
      -ErrorVariable exerr 2> $null'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of PowerShell scripts that use Exchange PowerShell snap-ins, specifically when adversaries add and utilize these snap-ins for mailbox data export. This behavior is often associated with advanced persistent threats (APTs) such as HAFNIUM or APT27, which aim to extract sensitive information from compromised Exchange servers. It aligns with the MITRE ATT&CK tactics of Execution (T1059.001) and Collection (T1114).

  Primary telemetry sources include process creation logs from Windows, specifically monitoring for PowerShell and associated command lines. If this activity is malicious, it could lead to significant data exfiltration, impacting confidentiality and availability of sensitive email data. However, this detection does NOT confirm that malicious activity occurred in isolation, as legitimate use of Exchange PowerShell may also invoke similar behaviors.

  ---

  ### Investigation Steps

  - **Examine recent PowerShell executions:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for process creation events involving `powershell.exe` or `pwsh.exe`. Look for the presence of 'Add-PSSnapin' in the command line.

  - **Identify the specific snap-ins utilized:** Check the command line for `Microsoft.Exchange.Powershell.Snapin` or `Microsoft.Exchange.Management.PowerShell.SnapIn` to confirm malicious indicators of Exchange data manipulation.

  - **Investigate parent process associations:** Analyze parent process information for any instances linked to `msiexec.exe` to determine if the command was spawned from a legitimate installer or as part of an exploitation pattern.

  - **Validate legitimate usage cases:** Cross-reference the command lines against internal documentation to differentiate known administrators or scripts that might legitimately invoke these snap-ins, noting common contexts such as scheduled backups or migrations.

  - **Correlate with user behavior:** Review user access logs and roles associated with the initiating account. Look for unusual access to high-risk systems or unauthorized accounts that would indicate potential abuse.

  - **Check for file artifacts:** Investigate for evidence of mailbox data exports (e.g., file creation events or size), especially those using typical names or timestamps that do not match expected operational patterns within Exchange environments.

  ---

  ### Prioritization

  This alert should be considered high priority due to the potential impact on the integrity and confidentiality of the organization's email data. The nature of the detected behavior is commonly weaponized by advanced adversaries aiming to exploit Exchange vulnerabilities, enhancing the likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of PowerShell and Exchange which could trigger false positives. It's critical to ensure all relevant logging is enabled on Exchange servers to support comprehensive monitoring. Techniques like process obfuscation or alternate PowerShell instances could evade detection. Companion signatures for abnormal login behaviors or backup scripts can complement this detection for improved security posture.

