title: Exchange PowerShell Snap-Ins Usage
id: 25676e10-2121-446e-80a4-71ff8506af47
status: test
description: Detects adding and using Exchange PowerShell snap-ins to export mailbox
  data. As seen used by HAFNIUM and APT27
references:
- https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://www.intrinsec.com/apt27-analysis/
author: FPT.EagleEye, Nasreddine Bencherchali (Nextron Systems)
date: 2021-03-03
modified: 2023-03-24
tags:
- attack.execution
- attack.t1059.001
- attack.collection
- attack.t1114
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains: 'Add-PSSnapin'
  selection_module:
    CommandLine|contains:
    - 'Microsoft.Exchange.Powershell.Snapin'
    - 'Microsoft.Exchange.Management.PowerShell.SnapIn'
  filter_msiexec:
        # ParentCommandLine: C:\Windows\System32\MsiExec.exe -Embedding C9138ECE2536CB4821EB5F55D300D88E E Global\MSI0000
    ParentImage: 'C:\Windows\System32\msiexec.exe'
    CommandLine|contains: '$exserver=Get-ExchangeServer ([Environment]::MachineName)
      -ErrorVariable exerr 2> $null'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the usage of Exchange PowerShell snap-ins that can be indicative of malicious activity, specifically related to attempts to export mailbox data. This behavior has been associated with threat actors such as HAFNIUM and APT27, who exploit vulnerabilities in Microsoft Exchange servers to conduct unauthorized access to data and perform reconnaissance. The rule is crafted to discern legitimate PowerShell activities from potentially malicious endeavors that could compromise sensitive information stored in Exchange mailboxes.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Execution** (T1059.001): PowerShell is often utilized by attackers to execute commands directly on compromised systems.
  - **Collection** (T1114): The establishment of PowerShell snap-ins for data collection purposes aligns with the tactic of gathering information from targeted environments.

  To effectively detect these actions, telemetry from Windows process creation events is paramount, specifically focusing on PowerShell execution logs that detail command lines, images, and parent processes invoked during the execution of these commands.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell execution logs to identify instances of the `Add-PSSnapin` command which can indicate attempts to load Exchange-specific modules.
  - **Correlate with Process Creation Events**: Examine the corresponding process creation logs, confirming that instances of `powershell.exe` or `pwsh.exe` show unusual command line arguments suggesting export of mailbox data.
  - **Investigate Parent Processes**: Check for any suspicious parent processes, particularly `msiexec.exe`, that may indicate more complex installation activities being exploited to facilitate unauthorized actions in Exchange.
  - **Assess Exchange Usage**: Look into any recent changes or anomalous behavior in the Exchange servers themselves, such as unexpected administrative access or modifications affecting mailbox configurations.

  ### Prioritization
  Given the potential impact of unauthorized mailbox data export and the specificity of the detected behavior linked to known APT groups, this alert is prioritized as high severity. It indicates a significant risk to organizational data, warranting immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage concerning legitimate administrative activities that utilize similar PowerShell commands in routine operations, which can generate false positives. The detection logic assumes that PowerShell usage for adding snap-ins is primarily malicious when observed in conjunction with exporting mailbox data. Successful alerting depends on proper logging configurations for PowerShell activities being enabled on Exchange servers, which are critical for effective detection.

