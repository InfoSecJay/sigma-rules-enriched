title: Potential Crypto Mining Activity
id: 66c3b204-9f88-4d0a-a7f7-8a57d521ca55
status: stable
description: Detects command line parameters or strings often used by crypto 
  miners
references:
- https://www.poolwatch.io/coin/monero
author: Florian Roth (Nextron Systems)
date: 2021-10-26
modified: 2023-02-13
tags:
- attack.impact
- attack.t1496
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - ' --cpu-priority='
    - '--donate-level=0'
    - ' -o pool.'
    - ' --nicehash'
    - ' --algo=rx/0 '
    - 'stratum+tcp://'
    - 'stratum+udp://'
            # base64 encoded: --donate-level=
    - 'LS1kb25hdGUtbGV2ZWw9'
    - '0tZG9uYXRlLWxldmVsP'
    - 'tLWRvbmF0ZS1sZXZlbD'
            # base64 encoded: stratum+tcp:// and stratum+udp://
    - 'c3RyYXR1bSt0Y3A6Ly'
    - 'N0cmF0dW0rdGNwOi8v'
    - 'zdHJhdHVtK3RjcDovL'
    - 'c3RyYXR1bSt1ZHA6Ly'
    - 'N0cmF0dW0rdWRwOi8v'
    - 'zdHJhdHVtK3VkcDovL'
  filter:
    CommandLine|contains:
    - ' pool.c '
    - ' pool.o '
    - 'gcc -'
  condition: selection and not filter
falsepositives:
- Legitimate use of crypto miners
- Some build frameworks
level: high
note: |
  ### Technical Context

  This Sigma rule detects command line parameters and strings commonly associated with cryptominers, indicating potential crypto mining activity on a Windows system. The primary attacker objective is to utilize victim resources for cryptocurrency generation, potentially leading to system performance degradation and increased operational costs.

  This behavior aligns with the MITRE ATT&CK technique "Cryptomining" (T1496). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which captures the command line used to spawn processes. If malicious, the impact may involve resource hijacking and reduced system performance. Importantly, the detection does NOT confirm that malicious activity is occurring by itself—further investigation into context and environment is necessary.

  ### Investigation Steps

  - **Review Initial Process Creation:** Query Windows Security Event ID 4688 for processes spawned by users in unusual contexts (e.g., SYSTEM account). Look for command line parameters containing `--cpu-priority=` or `--donate-level=0`.

  - **Evaluate Command Line Arguments:** Analyze processes with command lines including `stratum+tcp://` or `pool.` reference strings. These may indicate connections to external mining pools which are typically associated with malicious activity.

  - **Check for Baseline Legitimate Usage:** Identify and document expected command line usage for approved applications. Legitimate scenarios may include specific software for continuous heavy computations, which might use similar command line configurations.

  - **Cross-Reference with System Performance Logs:** Inspect performance counters (e.g., CPU load, memory usage) in Windows Event Log (Event ID 3005) for any spikes correlating with identified command line usage. High resource utilization without a business justification can indicate illicit mining.

  - **Identify High-Confidence Malicious Indicators:** Look for any processes containing the full command line patterns indicative of mining (e.g., `--nicehash` or base64 encoded strings that map to common mining parameters). Validate against known malicious miners.

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on system performance, resource misuse, and the likelihood of exploitation for unauthorized cryptocurrency mining. Cryptomining is becoming increasingly weaponized and can indicate other malicious activities within the environment.

  ### Blind Spots and Assumptions

  Limitations of detection include potential evasion techniques such as obfuscation of command line strings used by miners. Reliable detection requires comprehensive process creation logs from all endpoints as well as validation of user behavior and system context. Legitimate scenarios, such as development with build frameworks, may trigger the alert. Companion detections, such as monitoring network traffic for outgoing connections to known mining pools, can bolster coverage against such threats.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
