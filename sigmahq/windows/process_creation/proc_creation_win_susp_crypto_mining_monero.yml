title: Potential Crypto Mining Activity
id: 66c3b204-9f88-4d0a-a7f7-8a57d521ca55
status: stable
description: Detects command line parameters or strings often used by crypto miners
references:
- https://www.poolwatch.io/coin/monero
author: Florian Roth (Nextron Systems)
date: 2021-10-26
modified: 2023-02-13
tags:
- attack.impact
- attack.t1496
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - ' --cpu-priority='
    - '--donate-level=0'
    - ' -o pool.'
    - ' --nicehash'
    - ' --algo=rx/0 '
    - 'stratum+tcp://'
    - 'stratum+udp://'
            # base64 encoded: --donate-level=
    - 'LS1kb25hdGUtbGV2ZWw9'
    - '0tZG9uYXRlLWxldmVsP'
    - 'tLWRvbmF0ZS1sZXZlbD'
            # base64 encoded: stratum+tcp:// and stratum+udp://
    - 'c3RyYXR1bSt0Y3A6Ly'
    - 'N0cmF0dW0rdGNwOi8v'
    - 'zdHJhdHVtK3RjcDovL'
    - 'c3RyYXR1bSt1ZHA6Ly'
    - 'N0cmF0dW0rdWRwOi8v'
    - 'zdHJhdHVtK3VkcDovL'
  filter:
    CommandLine|contains:
    - ' pool.c '
    - ' pool.o '
    - 'gcc -'
  condition: selection and not filter
falsepositives:
- Legitimate use of crypto miners
- Some build frameworks
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the presence of command line parameters associated with crypto mining activities, specifically for cryptocurrencies such as Monero. The likely attacker objective is to hijack system resources to mine cryptocurrency without user consent, potentially leading to degraded system performance or increased energy costs. The relevant MITRE ATT&CK tactic is Impact, specifically technique T1496 (Resource Hijacking).

  The primary telemetry source for this detection is the Windows Process Creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which log process creation events and their associated command-line arguments. If malicious, the security impact includes significant resource drain, system instability, and potential subsequent exploitation of the compromised system. However, this detection does NOT confirm malicious activity on its own, as it could include legitimate use of mining software within the organization.

  ---

  ### Investigation Steps

  - **Check process creation logs for suspicious commands:** Review Security Event ID 4688 (or Sysmon Event ID 1) for command-line arguments containing ' --cpu-priority=', '--donate-level=0', and related patterns. Look for process creation times, associated user accounts, and parent processes.

  - **Identify legitimate crypto mining activity:** Validate any business justification for crypto mining by checking asset inventory and user access controls. Understand roles that might intentionally use miners and their typical command-line arguments.

  - **Correlate with other logs for behavior analysis:** Examine Window Event logs around the same timeframe for other anomalous behaviors (Event IDs related to network access, file modifications) that may indicate broader malicious activity.

  - **Search for high-confidence malicious indicators:** Investigate for process hashes, file creation events, and network connections to known mining pools (e.g., stratum+tcp://). Specifically check Sysmon Event ID 3 for file creation events linked to detected processes.

  - **Evaluate recent changes to system configuration:** Review system logs for unauthorized changes or new installations of software that correlate with the detection of mining-related commands. Look for anomalous software installed via Event ID 11707 (MSI Installer) or unusual scheduling tasks.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems, especially if they are involved in transaction processing or data management. The likelihood of malicious abuse is significant since crypto mining is often exploited by adversaries to leverage resources for their gain. Additionally, the specific patterns identified are known to be weaponized in real-world attacks.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by users running legitimate crypto mining software or related tools that use similar command-line parameters. Reliable detection requires Sysmon and appropriate Windows Event log configurations to ensure comprehensive process visibility. Legitimate activities might include developers using mining-related tools for testing or as part of specific projects. A related detection could include monitoring for network anomalies connected to known mining pool addresses which would strengthen coverage against resource hijacking.

