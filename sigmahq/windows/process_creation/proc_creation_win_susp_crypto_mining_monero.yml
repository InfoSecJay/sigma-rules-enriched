title: Potential Crypto Mining Activity
id: 66c3b204-9f88-4d0a-a7f7-8a57d521ca55
status: stable
description: Detects command line parameters or strings often used by crypto miners
references:
- https://www.poolwatch.io/coin/monero
author: Florian Roth (Nextron Systems)
date: 2021-10-26
modified: 2023-02-13
tags:
- attack.impact
- attack.t1496
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - ' --cpu-priority='
    - '--donate-level=0'
    - ' -o pool.'
    - ' --nicehash'
    - ' --algo=rx/0 '
    - 'stratum+tcp://'
    - 'stratum+udp://'
            # base64 encoded: --donate-level=
    - 'LS1kb25hdGUtbGV2ZWw9'
    - '0tZG9uYXRlLWxldmVsP'
    - 'tLWRvbmF0ZS1sZXZlbD'
            # base64 encoded: stratum+tcp:// and stratum+udp://
    - 'c3RyYXR1bSt0Y3A6Ly'
    - 'N0cmF0dW0rdGNwOi8v'
    - 'zdHJhdHVtK3RjcDovL'
    - 'c3RyYXR1bSt1ZHA6Ly'
    - 'N0cmF0dW0rdWRwOi8v'
    - 'zdHJhdHVtK3VkcDovL'
  filter:
    CommandLine|contains:
    - ' pool.c '
    - ' pool.o '
    - 'gcc -'
  condition: selection and not filter
falsepositives:
- Legitimate use of crypto miners
- Some build frameworks
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially unauthorized cryptocurrency mining activities based on the command line parameters commonly associated with crypto mining software. Attackers may deploy such software on compromised systems to leverage the victims' computing resources for profit, often referred to as cryptojacking. Such activities can lead to degraded system performance, increased electricity costs, and potential secondary attacks deriving from the initial compromise.

  The rule targets various command-line strings and parameters typically used by crypto miners, such as the specification of mining pools and algorithms. It correlates with the MITRE ATT&CK technique for **Resource Hijacking (T1496)**, where adversaries exploit system resources without consent. The key data sources for this detection will be process creation events, specifically those associated with command-line arguments indicative of mining activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for unusual command-line arguments associated with crypto mining tools, focusing on the presence of known mining commands and parameters.

  - **Inspect Network Connections:** Check for outbound connections to known mining pools or suspicious domains that are typically associated with cryptocurrency mining activity.

  - **Examine Resource Usage:** Monitor CPU, memory, and network activity on the affected system for spikes that correspond with mining behavior, indicating unauthorized resource consumption.

  - **Analyze Installed Software:** Investigate the software installed on the endpoints to identify any unauthorized mining applications or scripts that may facilitate cryptocurrency mining.

  ### Prioritization
  Given the potential for significant resource drain and unauthorized personal profit from compromised systems, alerts for potential crypto mining are classified as high severity. The likelihood of impact is considerable in enterprise environments where resource allocation and system performance are critical.

  ### Blind Spots and Assumptions
  This detection logic may have gaps when legitimate applications using similar command-line parameters exist, leading to potential false positives. The effectiveness of this rule assumes that process creation logs are captured and that the command-line activities of processes are logged thoroughly. It also depends on the comprehensive logging of the environment to catch all potential indicators of coin mining attempts. If logs for process creation are not enabled, this detection will not function as intended.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
