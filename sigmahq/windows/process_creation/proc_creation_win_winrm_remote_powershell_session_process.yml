note: |
  ### Technical Context

  The rule detects the invocation of the Windows Remote Management (WinRM) process, specifically `wsmprovhost.exe`, either as a parent or child process of a PowerShell execution. This behavior indicates a remote PowerShell session, which an attacker could leverage to execute commands on a compromised host. The likely objective of an adversary is to maintain control over the environment or conduct lateral movement within the network. This activity correlates with the MITRE ATT&CK tactic of Execution (TA0001) and the technique of Remote PowerShell (T1059.001) as well as Lateral Movement (TA0008) via Remote Services (T1021.006).

  Primary telemetry sources include Windows process creation logs (Event ID 4688 or Sysmon Event ID 1) that capture details about the execution of processes. If this activity is malicious, it may lead to unauthorized command execution, data exfiltration, or further network compromise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks also utilize remote PowerShell sessions.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 to identify `wsmprovhost.exe` as the parent process. Look for PowerShell child processes and validate their command line arguments for suspicious activity. Legitimate commands will typically show structured administrative tasks rather than obfuscated or encoded commands.

  - **Analyze the user context:** Verify the user account that initiated the remote PowerShell session via the logs (`NewProcessName`, `CommandLine`, etc.). Administrative accounts conducting legitimate remote management may appear, but unusual accounts engaging with sensitive systems should raise flags.

  - **Identify command line activity:** Examine the specific command line parameters passed to PowerShell. Commands associated with lateral movement or unauthorized system manipulation, such as those attempting to access sensitive directories or data, signal potential malicious activity.

  - **Review the scheduling and frequency of execution:** Utilize logging fields such as `CreationTime` to analyze if the remote PowerShell usage aligns with standard operational hours. Consistent or frequent usages outside of maintenance windows may indicate suspicious behavior.

  - **Correlate with other telemetry sources:** Investigate associated logs from network monitoring tools or EDR solutions to see if there are outbound connections initiated following the PowerShell invocation. High-risk endpoints communicating externally after this detection should be prioritized for further review.

  ### Prioritization

  This alert is of medium severity due to the potential impact of remote PowerShell sessions on sensitive systems. The likelihood of malicious abuse is moderate, considering that attackers often weaponize these techniques in exploitation scenarios. This behavior is not unusual in enterprise environments; however, its execution context is crucial for determining risk level.

  ### Blind Spots and Assumptions

  Detection may be limited by situations where logging is misconfigured or where the PowerShell logging feature is disabled, which can hinder visibility into legitimate use cases versus potential abuse. Legitimate remote management activities, such as regular IT maintenance, may inadvertently trigger this alert, emphasizing the need for context in investigations. A related detection to consider is monitoring for `Invoke-Command` usage within PowerShell logs to catch potential misuse indicative of lateral movement scenarios.

