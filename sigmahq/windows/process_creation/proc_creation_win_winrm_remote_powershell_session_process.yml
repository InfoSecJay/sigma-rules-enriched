note: |
  ### Technical Context
  This detection rule is designed to identify remote PowerShell sessions initiated via Windows Remote Management (WinRM), specifically by monitoring the `wsmprovhost.exe` process. This process can serve as a parent or child process for PowerShell, indicating an active remote session. Detection of such sessions can be vital since remote PowerShell is commonly utilized in post-exploitation scenarios, enabling attackers to execute commands on compromised systems, laterally move within the network, and gather sensitive information.

  The primary threat scenario involves malicious actors leveraging remote PowerShell to gain unauthorized access to systems, potentially to exfiltrate data or further compromise network resources. This technique is often employed in both targeted and opportunistic attacks. Relevant MITRE ATT&CK tactics include `Execution`, which entails executing commands on a machine, and `Lateral Movement`, reflecting the movement across the network. The corresponding techniques are `T1059.001` (Command and Scripting Interpreter: PowerShell) and `T1021.006` (Remote Services: WinRM).

  The best evidence for this detection comes from process creation events on Windows systems, particularly logs detailing the initiation of `wsmprovhost.exe` instances, along with parent-child process relationships that connect them to PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for any instances of `wsmprovhost.exe` being executed or serving as a parent process for PowerShell. Look for unusual activity patterns or timestamps that align with known user behavior.
  - **Analyze Network Traffic**: Inspect network logs for any WinRM traffic, particularly on port 5985 or 5986, which may indicate external attempts to initiate remote PowerShell sessions. Look for connections from unexpected sources.
  - **Examine User Activity**: Correlate the identified remote sessions with user activity logs. Ensure that the user accounts involved in these sessions are legitimate and have the appropriate permissions to use WinRM.
  - **Cross-verify with Security Tools**: Use EDR solutions to hunt for additional indicators of compromise (IOCs) related to remote PowerShell execution, such as unusual PowerShell scripts or commands executed during these sessions.

  ### Prioritization
  This alert should be treated with medium severity as it indicates a potential avenue for lateral movement or unauthorized access within the network. If confirmed, remote PowerShell sessions can represent a serious compliance or security risk that warrants immediate investigation.

  ### Blind Spots and Assumptions
  There may be detection gaps associated with legitimate usage of remote PowerShell, as administrative activities often rely on WinRM for remote management, potentially resulting in false positives. Additionally, the detection logic assumes that all instances of `wsmprovhost.exe` represent suspicious activity; however, legitimate system administration and monitoring tasks could trigger the same alerts. For effective detection to function, it is crucial that process creation logging is enabled and adequately configured on Windows systems.

