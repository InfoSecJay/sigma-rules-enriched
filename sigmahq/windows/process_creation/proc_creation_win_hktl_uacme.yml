note: |
  ### Technical Context

  This rule detects the execution of UACMe, a tool commonly used to bypass User Account Control (UAC) protections on Windows systems. Attackers often utilize this tool to escalate privileges after gaining initial access to a target environment. The relevant MITRE ATT&CK technique is "Bypass User Account Control" (T1548.002). Primary telemetry sources include process creation logs, particularly from Windows Security Event ID 4688 and Sysmon Event ID 1, which capture command line activity and executable details. If the activity is determined to be malicious, it may allow an adversary to gain higher-level permissions and increase their foothold within the environment. Importantly, while detection indicates potential misuse of UACMe, it does NOT confirm malicious intent on its own without additional context.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 and Sysmon Event ID 1 for any instances of `Akagi.exe` or `Akagi64.exe`. Look for unusual command lines or parent process relationships that may indicate exploitation attempts.

  - **Verify file hashes**: Cross-reference the process execution against known IMPHASH values specified in the detection rule. Malicious indicators may include hashes such as `IMPHASH=767637C23BB42CD5D7397CF58B0BE688` or `IMPHASH=89159BA4DD04E4CE5559F132A9964EB3`, which are associated specifically with UACMe.

  - **Assess execution context**: Identify the user account under which UACMe was executed. Legitimate administrative users may run such tools for valid reasons during pentests, while execution from standard user accounts may indicate unauthorized activity.

  - **Investigate parents of the process**: Determine the parent process of `Akagi.exe` or `Akagi64.exe`. If initiated from a known administrative tool with legitimate use (e.g., during system maintenance), it could be benign; however, execution from non-administrative contexts must be further scrutinized.

  - **Evaluate system roles**: Consider the role of the affected host system (e.g., domain controller, file server) and its criticality to assess impact potential if the activity is proven malicious. Higher criticality systems warrant immediate escalated investigation.

  - **Search for related artifacts**: Look for other indicators of compromise (IOCs) such as unusual registry modifications or suspicious network connections occurring around the same time as the UACMe execution, which may indicate further malicious activity in the environment.

  ### Prioritization

  Given the high potential impact of privilege escalation on exposed systems, the likelihood of exploitative use of UACMe is significant, particularly in environments with elevated administrative privileges. The behavior is recognized as a common technique leveraged by adversaries, warranting immediate review and action.

  ### Blind Spots and Assumptions

  This detection is limited by the possibility of legitimate UACMe usage, such as in penetration testing scenarios, which could trigger false positives. The requirement for thorough logging, including specific process creation events, is essential for accurate detection. Additionally, similar privilege escalation tools, like Mimikatz, may generate related alerts that should be monitored to strengthen overall coverage against adversarial tactics.

