note: |
  ### Technical Context

  This detection identifies the execution of UACMe, a tool frequently employed to bypass User Account Control (UAC) in Windows environments. Attackers using this tool typically aim to escalate privileges on a compromised system, allowing them increased access and control over target resources. The relevant MITRE ATT&CK tactic is "Privilege Escalation," with the technique being "Bypass User Account Control" (T1548.002).

  The primary telemetry sources for this rule are Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1. If detected maliciously, this behavior poses a serious security risk as it indicates an attacker may be attempting to gain unauthorized elevated privileges. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative tools may use similar methods.

  ### Investigation Steps

  - **Review Process Creation Events:** Check Windows Event ID 4688 or Sysmon Event ID 1 for instances where the Image Path reflects `\Akagi.exe` or `\Akagi64.exe`. Note any associated parent processes to identify suspicious chains of execution.

  - **Analyze Artifact Metadata:** Inspect the file metadata for execution artifacts related to UACMe, focusing on fields such as `Product`, `Company`, and `Description`. Compare against expected values; legitimate instances may not match known malware publisher signatures.

  - **Identify High-Confidence Malicious Indicators:** Check for occurrences of specific import hashes (IMPHASH) such as `IMPHASH=767637C23BB42CD5D7397CF58B0BE688`. This hash is directly associated with the UACMe tool, indicating a probable malicious execution if present.

  - **Look for Anomalous Administrative Actions:** Have there been recent changes in user permissions or administrative access logs following the use of this tool? Review security logs for Event ID 4670 (Permissions on an object were changed) or similar.

  - **Correlate with EDR Solutions:** If applicable, use endpoint detection and response (EDR) tools to investigate related artifacts or behavioral anomalies, validating against known attack profiles associated with privilege escalation.

  - **Assess Expected Legitimate Behavior:** Determine if UACMe was run as part of authorized security testing or administrative actions. Review recent change management requests or documented testing agreements that would justify its use.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant security impact if exploitative actions are confirmed on critical systems. The use of tools like UACMe is frequently weaponized in real-world attacks, heightening the risk of malign behavior.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate utility usage that mimics UAC bypass behavior, potentially leading to false positives. Ensure logging is configured to capture process creation events effectively. Other administrative tools or penetration testing frameworks may inadvertently trigger this detection, requiring careful context. Related detections, such as monitoring for abnormal process creation patterns (e.g., T1055 - Process Injection), may enhance coverage and confirm potential nefarious activity.

