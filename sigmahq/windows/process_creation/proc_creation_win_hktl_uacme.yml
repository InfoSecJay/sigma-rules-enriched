  ---

  ### Technical Context

  This rule detects the execution of UACMe, a tool commonly used for bypassing User Account Control (UAC) on Windows systems. The primary objective of an attacker using UACMe is to gain elevated privileges, allowing them to execute malicious actions that require administrative rights. This behavior aligns with the MITRE ATT&CK framework under the tactics of **Defense Evasion** (TA0005) and **Privilege Escalation** (TA0004), specifically the technique **User Account Control (UAC) Bypass** (T1548.002).

  The primary telemetry source for this detection is Windows process creation logs capturing executable file execution details, particularly focusing on properties like Product, Company, Description, and OriginalFileName. If UACMe is used maliciously, it can lead to unauthorized elevation of privileges and facilitate further compromise of the system. However, this detection does NOT independently confirm malicious intent; legitimate administrative activities may also result in similar process executions.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Security Event ID 4688 for process creation logs. Look for entries where the process 'Akagi.exe' or 'Akagi64.exe' is invoked. Confirm if the process initiation includes unusual parent-child relationships, particularly from benign processes like 'explorer.exe'.

  - **Validate Product Metadata:** Examine the file properties of the detected executable using Windows Explorer or `Get-Item` in PowerShell. Ensure that the Product and Company fields match known SIGMA values (e.g., 'UACMe', 'REvol Corp'). Legitimate UACMe execution should align with expected pentesting activities.

  - **Identify Malicious Hash Indicators:** Cross-reference the detected file hashes against the known malicious hashes list provided (e.g., 'IMPHASH=767637C23BB42CD5D7397CF58B0BE688'). Mark these as indicators of compromise, especially if they appear in unexpected contexts or on production servers.

  - **Review User Account Control Logs:** Analyze Event ID 4608 (Windows logon events) to check if the execution of UACMe was preceded by legitimate administrator logins, which may indicate authorized usage. Anomalies here could suggest misuse.

  - **Investigate Network Activity:** Utilize network monitoring tools to identify any anomalous outbound connections made shortly after the UACMe execution, which may indicate data exfiltration attempts or command and control communication.

  - **Assess Host Role and Asset Criticality:** Determine the role of the host where UACMe was detected. If it's a critical server (e.g., domain controller), prioritize immediate remediation steps, as the impact of privilege escalation would be substantial.

  ---

  ### Prioritization

  This alert is high severity due to the potential for privilege escalation on critical systems, which can severely impact security. The likelihood of malicious abuse is significant, given the tool’s association with bypassing security controls. UACMe is commonly weaponized in post-exploitation scenarios, making timely investigation essential.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by non-standard logging configurations or the absence of specific file property tracking. Legitimate administrative tools or scripts may trigger this alert, complicating the analysis. Ensure that detailed process logging and monitoring are enabled for comprehensive visibility. A related detection that strengthens coverage is the monitoring of changes to UAC settings or unexpected privilege assignments in the system logs.

