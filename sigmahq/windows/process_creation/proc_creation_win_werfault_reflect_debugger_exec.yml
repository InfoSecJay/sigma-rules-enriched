note: |
  ### Technical Context
  This detection rule identifies the execution of the Windows Error Reporting tool, `WerFault.exe`, with the command-line argument `-pr`. This usage pattern is suspicious as it can allow an attacker to exploit the ReflectDebugger key, potentially launching malicious code while masquerading as a legitimate process. The threat scenario often involves attackers attempting to execute malware under the guise of system applications, which can bypass certain security measures and avoid immediate detection.

  Relevant MITRE ATT&CK tactics include "Execution" (TA0002) as the primary purpose is to execute code, and "Defense Evasion" (TA0005), as this technique could be used to disguise the execution of malicious activities within legitimate processes. Key techniques include T1036 ("Masquerading"), which specifically addresses the use of legitimate processes to run malicious code.

  The primary data sources for investigating this behavior are Windows process creation logs that track when processes are started and what command-line parameters were used. Such logs can provide crucial insights into any unusual or unauthorized execution attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the Windows process creation logs for instances of `WerFault.exe` launching with the `-pr` flag. Note the parent process and timestamp to determine context.

  - **Analyze Command-Line Arguments**: Look for additional command-line arguments that may accompany the `-pr` option, as they may provide clues about the nature of the content being executed.

  - **Check System Integrity**: Verify the integrity of the `WerFault.exe` binary to ensure it hasn't been tampered with or replaced by malicious software.

  - **Investigate ReflectDebugger Registry Key**: Query the ReflectDebugger key in the registry to see if any suspicious paths have been added, suggesting potential malware storage or execution points.

  ### Prioritization
  Given the potential for this detection to highlight either active exploitation of the ReflectDebugger key or attempts to remain undetected via legitimate processes, this alert should be considered medium severity. The likelihood of such an attack occurring, coupled with its impact on the integrity of the system, warrants timely investigation.

  ### Blind Spots and Assumptions
  Current detection logic may not capture all instances of malicious activity if variations in the command-line arguments or execution paths are used. Assumptions made in the detection rule include that attackers will use the exact `-pr` command-line flag and that logging of process creation events is fully enabled and unaltered. For optimal functionality, robust logging settings must be configured for Windows, including process creation logs that capture command-line data.

