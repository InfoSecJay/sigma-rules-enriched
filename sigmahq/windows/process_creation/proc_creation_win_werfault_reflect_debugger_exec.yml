  ### Technical Context

  This Sigma rule detects the execution of **WerFault.exe** with the **-pr** command-line flag, which indicates the use of the ReflectDebugger to potentially execute files from the registry. This behavior is commonly associated with malware attempting to conceal its execution flow by utilizing the Windows Error Reporting tool, an anomaly that could indicate an attacker deploying persistence mechanisms.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002), with the technique being **Masquerading** (T1036). The primary telemetry source is Windows process creation logs, specifically targeting the **Event ID 4688** for process creation details and the information found in the command line fields. If malicious, this activity constitutes a high potential risk since it may enable an adversary to run malicious code disguised as legitimate system processes, complicating detection efforts. Importantly, this detection does not confirm actual malicious intent or compromise by itself; further investigation is needed to establish context.

  ### Investigation Steps

  - **Review process creation logs:** Check for **Event ID 4688** related to **WerFault.exe**. Confirm command line includes **"-pr"**, focusing on the **CommandLine** field for presence.

  - **Identify registry keys:** Investigate the **ReflectDebugger** registry key (HKEY_CURRENT_USER\Software\Microsoft\Windows NT\CurrentVersion\AeDebug\) for any unusual or unexpected values. Legitimate entries typically do not contain references to uncommon executables.

  - **Correlate with other logs:** Cross-reference any findings from **Process Monitor** or **Sysinternals** with **WerFault.exe** actions for further context. Determine if they align with known legitimate behaviors (e.g., application crashes).

  - **Determine persistence mechanisms:** Look for other executions of WerFault in conjunction with periodic scheduled tasks or startup entries. This includes inspecting **Task Scheduler** for legitimate or unusual entries that may invoke **WerFault.exe**.

  - **Check for high-confidence malicious indicators:** Analyze for common malware indicators like unusual base64 encoding in command lines or connections to known malicious URLs following the execution of **WerFault.exe**.

  - **Review affected system criticality:** Assess the asset’s role within the network. If it hosts sensitive data or services, escalate your investigation immediately, as compromise can indicate significant danger.

  ### Prioritization

  The alert level is medium due to the potential for malicious use of the process if linked to an exploit. The risk increases significantly if it targets a critical asset within the network, as weaponized execution methods are often disguised through legitimate processes.

  ### Blind Spots and Assumptions

  This detection may be limited by the use of legitimate software behavior potentially triggering the alert, like third-party applications utilizing WerFault.exe correctly. Required log sources must include detailed process creation telemetry to ensure comprehensive coverage. Furthermore, companion detections, such as monitoring for known encoded command executions or suspicious registry modifications, can bolster overall coverage against misuse of Windows error reporting mechanisms.

