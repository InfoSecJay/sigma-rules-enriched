note: |
  ### Technical Context

  This rule detects the execution of "WerFault.exe" with the "-pr" command-line flag, which indicates potential malicious activity utilizing the ReflectDebugger key. Attackers may adopt this technique to covertly execute malware disguised under the normal operation of the Windows Error Reporting tool. This behavior aligns with the MITRE ATT&CK technique T1036 (Masquerading) and can be part of a broader attack lifecycle aiming to execute code and maintain persistence.

  The primary telemetry sources for this detection come from Windows process creation logs, specifically Security Event ID 4688 and potentially Sysmon Event ID 1, which capture process start events and their command-line arguments. If this execution is malicious, it could lead to unauthorized access or control over the affected system. Importantly, this detection does NOT confirm that an exploitation attempt is underway, as legitimate applications may also use similar command-line flags.

  ### Investigation Steps

  - **Review Process Creation Events:** Search for Security Event ID 4688 logs for "WerFault.exe" with command line containing " -pr ". Investigate any unusual parent-child process relationships or native executable paths, which may indicate malicious usage rather than typical system operations.

  - **Verify Original Filename:** Confirm that the OriginalFileName for the process creation matches "WerFault.exe". Any deviations or execution from unexpected directories may signal compromise.

  - **Assess Parent Process:** Check the parent process for the creation of WerFault.exe. Legitimate instances typically originate from legitimate applications (e.g., "explorer.exe"). Any launches from atypical context (e.g., command line utilities or scripts) should raise suspicion.

  - **Monitor for ReflectDebugger Registry Keys:** Investigate registry keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows NT\CurrentVersion\AeDebug` for any anomalous entries or modifications that could indicate adjustments for launching malicious payloads.

  - **Identify Privilege Escalation Indicators:** If the detected process or its parent is running under elevated privileges (Event ID 4672), this increases the severity of the threat, as it could be indicative of an attempt to elevate unauthorized access.

  - **Validate Output of WerFault.exe:** Check any output files created by “WerFault.exe” during execution, as they might lead to the detection of the presence of potential malware artifacts or related activities.

  ### Prioritization

  This alert is of medium severity due to the nature of the executing system and the potential impacts if malicious. The likelihood of abuse is moderate, as the ReflectDebugger technique is less common but can be effective in evading traditional detection methods. Misuse of legitimate system utilities for harmful purposes is a known exploitation technique.

  ### Blind Spots and Assumptions

  The detection may miss cases if logs are not collected appropriately, such as lacking Sysmon or detailed Windows Event Logging configurations. Attackers may evade detection by altering command-line arguments or exploiting legitimate system processes not captured by this rule. Legitimate activities may also invoke WerFault with the " -pr " flag during standard operations. A related detection to consider is monitoring for changes to the ReflectDebugger registry keys, which can provide insights into unauthorized modifications or executions.

