detection:
  selection_img:
  - Image|endswith: '\odbcconf.exe'
  - OriginalFileName: 'odbcconf.exe'
  selection_cli:
    CommandLine|contains|windash: ' -f '
  filter_main_rsp_ext:
    CommandLine|contains: '.rsp'
  filter_main_runonce_odbc:
        # When odbcconf is run with the "/R" flag, it creates a "runonce" key to run at the next reboot
    ParentImage: 'C:\Windows\System32\runonce.exe'
    Image: 'C:\Windows\System32\odbcconf.exe'
    CommandLine|contains: '.exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of `odbcconf.exe` with the `-f` flag to load a response file that does not have a `.rsp` extension, indicating potential misuse. The likely attacker objective is to manipulate ODBC settings, possibly for establishing persistence or leveraging misconfigured data sources as part of a lateral movement strategy. This behavior aligns with the MITRE ATT&CK technique for application layer protocols (T1218.008).

  The primary telemetry sources necessary for this detection are Windows Process Creation events, specifically Security Event ID 4688, indicating new process creation, and Sysmon Event ID 1 if Sysmon is deployed. If this behavior is malicious, it could lead to unauthorized data access or system compromise. Importantly, this detection does NOT confirm malicious activity on its own; benign uses of `odbcconf.exe` and legitimate configuration changes can also trigger this alert.

  ### Investigation Steps

  - **Review the command line arguments**: Examine Security Event ID 4688 or Sysmon Event ID 1 for processes that executed `odbcconf.exe` with the command line containing `-f` but **not** including files with a `.rsp` extension. For example, a command line like `odbcconf -f config.txt` indicates suspicious usage.

  - **Check for signs of malicious persistence**: Look for any associated Registry keys that may indicate persistence, especially entries under `HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce` that list `odbcconf.exe`. Confirm that the associated command was not a legitimate administrative task.

  - **Verify the parent process**: Cross-reference the detected process with its parent process found in the same log entries. If `odbcconf.exe` was spawned by a legitimate process (e.g. `explorer.exe`), it could indicate benign activity, whereas execution by `runonce.exe` may indicate a more nefarious intent.

  - **Assess typical legitimate usage**: Understand the usual operations involving `odbcconf.exe` in the environment. If there are known change windows or documented maintenance activities that necessitate `odbcconf.exe` usage with response files, this can help in distinguishing benign from malicious actions.

  - **Identify isolated contexts of execution**: Investigate further if `odbcconf.exe` was executed multiple times within a short window or in conjunction with other suspicious behaviors like unexpected creations of files in `C:\WINDOWS\system32\`.

  ### Prioritization

  Given the critical systems typically associated with ODBC configurations, any alert stemming from this detection should be considered high severity. The likelihood of misuse is moderate to high, as this application is often utilized in exploitation scenarios. While the usage of `odbcconf.exe` is not commonly weaponized on its own, the context of its execution is crucial in determining whether the action is part of a larger attack vector.

  ### Blind Spots and Assumptions

  The detection may miss obfuscation techniques where the command line is altered to avoid detection, or where a different method of execution is employed (e.g., through PowerShell). Continuous logging from both Windows process creation and Registry changes is necessary for reliable detection and response. Legitimate administrative tasks, such as ODBC reconfigurations by IT staff, may also trigger this alert. Monitoring for related behaviors, such as changes made by other ODBC-related commands or applications, can provide enhanced context and strengthen detection coverage.

