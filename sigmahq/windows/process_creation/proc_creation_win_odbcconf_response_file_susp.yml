detection:
  selection_img:
  - Image|endswith: '\odbcconf.exe'
  - OriginalFileName: 'odbcconf.exe'
  selection_cli:
    CommandLine|contains|windash: ' -f '
  filter_main_rsp_ext:
    CommandLine|contains: '.rsp'
  filter_main_runonce_odbc:
        # When odbcconf is run with the "/R" flag, it creates a "runonce" key to run at the next reboot
    ParentImage: 'C:\Windows\System32\runonce.exe'
    Image: 'C:\Windows\System32\odbcconf.exe'
    CommandLine|contains: '.exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `odbcconf.exe`, particularly with the `-f` flag, which is frequently used to load configuration files that deviate from standard `.rsp` file extensions. Attackers may use this behavior to execute malicious scripts or configuration changes that are disguised as valid processes, potentially aimed at maintaining persistence or evading detection. This behavior is associated with the MITRE ATT&CK technique T1218.008 (Signed Binary Proxy Execution).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1, which provide detailed information on command line arguments used during process launches. If this behavior is malicious, it could lead to unauthorized changes in system configurations or the execution of payloads. This detection alone does NOT confirm that the action is malicious without context, as legitimate administrative tasks can also invoke similar command structures.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where `odbcconf.exe` was executed with a command line containing the `-f` flag. Compare the command line arguments to identify any unusual parameters.

  - **Identify benign administrative actions:** Look for legitimate use of `odbcconf.exe` by querying the process creation logs for known administrative processes, such as ODBC driver configuration updates, that typically utilize `.rsp` files.

  - **Analyze parent process relationships:** Check the parent process of `odbcconf.exe` executions to identify suspicious parent processes (e.g., `runonce.exe`). This can indicate an automated task or malicious script chaining.

  - **Look for anomalous file extensions:** Search logs for command lines containing non-standard file extensions used with the `-f` argument. Focus on `.tmp` or other extensions not typically associated with ODBC configuration files.

  - **Correlate with other indicators:** If present, analyze additional artifacts such as registry keys or scheduled tasks that may have been created by the `odbcconf.exe` execution, especially keys related to persistence mechanisms like `runonce`.

  - **Review alert patterns:** Cross-reference any identified `odbcconf.exe` executions with known attack patterns, such as incidents involving targeted threat actors who employ similar techniques to leverage Windows utilities for executing payloads.

  ### Prioritization

  This alert is of high severity due to the sensitive nature of the affected system and the chance of exploitation. The use of `odbcconf.exe` with non-standard parameters is not common and can indicate an attempt by adversaries to execute payloads or modify system configurations stealthily, making it a likely vector for rapid escalation of privileges or initial access.

  ### Blind Spots and Assumptions

  Detection accuracy may be limited by misconfigurations in process logging, particularly if relevant telemetry is not enabled (e.g., Sysmon not deployed). Additionally, legitimate administrative tasks may trigger this alert, such as system updates or driver installations by IT administrators. A related detection would be monitoring for persistence mechanisms established via registry modifications or task scheduler entries, as they can further confirm potential malicious activity surrounding the execution of `odbcconf.exe`.

