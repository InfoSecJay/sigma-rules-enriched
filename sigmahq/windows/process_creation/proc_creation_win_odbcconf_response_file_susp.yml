logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\odbcconf.exe'
  - OriginalFileName: 'odbcconf.exe'
  selection_cli:
    CommandLine|contains|windash: ' -f '
  filter_main_rsp_ext:
    CommandLine|contains: '.rsp'
  filter_main_runonce_odbc:
        # When odbcconf is run with the "/R" flag, it creates a "runonce" key to run at the next reboot
    ParentImage: 'C:\Windows\System32\runonce.exe'
    Image: 'C:\Windows\System32\odbcconf.exe'
    CommandLine|contains: '.exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of "odbcconf.exe" with the "-f" flag to load a response file that does not utilize the standard ".rsp" extension. This behavior is suspicious and may indicate the use of legitimate tools for malicious purposes, particularly in scenarios where attackers attempt to bypass detection mechanisms by utilizing built-in Windows applications. The potential objective for an attacker could involve the execution of malware or unauthorized scripts under the guise of a standard Windows tool, leveraging the flexibility of ODBC configuration to evade detection by security solutions.

  Relevant MITRE ATT&CK tactics include Defense Evasion (ID: T1203) and the technique of "Signed Binary Proxy Execution" (ID: T1218.008). The anomalous use of "odbcconf.exe" in this manner could signify an attempt to gain unauthorized access or execute commands that could lead to further compromise within the environment.

  Primary telemetry sources that provide evidence for this detection include Windows process creation logs, which capture details about executed commands, and the command line arguments used during execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze logs from the endpoint's process creation history to identify instances of "odbcconf.exe" being executed with the "-f" flag. Pay close attention to the command line arguments utilized.

  - **Analyze Command Line Arguments**: Assess the command line for usage of non-standard response file extensions. Look for instances where the response file name does not end with ".rsp" as this could indicate attempted circumvention of security measures.

  - **Investigate Parent Process Relationships**: Examine the parent process of any identified odbcconf executions. If the parent is "runonce.exe", investigate further to determine if this behavior aligns with normal operational patterns or if it indicates suspicious activity.

  - **Correlate with Historical Threat Intelligence**: Reference threat intelligence related to using ODBC applications for malicious purposes, particularly in the context of the targeted environment, to assess the legitimacy of the detected behavior.

  ### Prioritization
  The alert generated by this detection should be considered high priority due to the potential for misuse of legitimate tools to execute malicious payloads. The risk of unauthorized access and data compromise associated with such actions warrants immediate investigation.

  ### Blind Spots and Assumptions
  While this detection provides coverage for specific misuse of "odbcconf.exe", there may be gaps in visibility concerning other legitimate applications being utilized similarly for malicious purposes. The detection assumes that the logs for process creation contain complete and accurate data, and that the command line attributes are being captured without alteration. This rule requires comprehensive logging capabilities enabled for Windows process execution to function effectively.

