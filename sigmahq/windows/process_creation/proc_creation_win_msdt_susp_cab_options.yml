note: |
  ### Technical Context

  This rule detects the execution of `msdt.exe` with the `-cab` flag, often indicative of attempts to exploit CVE-2022-30190 using dangerous Diagnostic Cabinet (diagcab) files. The likely attacker objective in this case is to execute unauthorized code remotely via malicious Microsoft Help troubleshooting tools. This behavior corresponds with MITRE ATT&CK technique **T1202** (Indirect Command Execution). The primary telemetry sources required for effective detection include process creation logs, specifically Windows Security Event ID **4688** or Sysmon Event ID **1**.

  If confirmed as malicious, this activity poses a significant risk as it could allow attackers to run arbitrary code, potentially leading to system compromise. However, it should be noted that this detection does NOT confirm that the command execution was malicious on its own, as legitimate uses for `.diagcab` files exist.

  ### Investigation Steps

  - **Verify command line arguments:** Review process creation logs for `msdt.exe` (Event ID 4688/Sysmon ID 1). Look specifically for the presence of the `-cab` flag in the CommandLine field. Legitimate uses typically do not include this flag.

  - **Review related process activity:** Analyze parent processes of the detected `msdt.exe` execution to identify the originating application. Look for common benign executables (such as `explorer.exe`) versus suspicious ones (like `powershell.exe` or `cmd.exe`).

  - **Check file integrity:** Validate the integrity of the `diagcab` file associated with the execution by checking its source path. Suspicious files may be downloaded from untrusted sources or be unusually named.

  - **Inspect network activity:** Examine any outbound network connections initiated by `msdt.exe` using network logs (e.g., firewall logs or network IDS). Look for unexpected domains or high-risk IP addresses associated with known malware.

  - **Identify common evasion techniques:** Be aware that attackers might attempt to obfuscate their actions by using legitimate Windows toolsets, making it important to correlate findings with other potential indicators of compromise.

  ### Prioritization

  This alert should be considered medium priority given that the activity could indicate an advanced attack vector that is relatively uncommon. Although the impact depends on the context of the affected system, exploitation of `msdt.exe` has been weaponized and poses a unique threat to enterprise environments.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate use of `.diagcab` files, which can result in false positives. Reliable detection also depends on having comprehensive logging configurations in place for process creation events. Evasion could occur via modified command-line arguments or through benign usage patterns. A companion detection that strengthens coverage could involve monitoring for indications of CVE-2022-30190 exploitation specifically, using sources such as Microsoft Defender ATP telemetry for behavior linked to exploitation attempts.

