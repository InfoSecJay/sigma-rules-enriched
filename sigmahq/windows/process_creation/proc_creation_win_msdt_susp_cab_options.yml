  ---

  ### Technical Context

  This rule detects the execution of `msdt.exe` with the `-cab` flag, indicating potential exploitation of diagnostic cab files that could leverage CVE-2022-30190. An attacker may employ this technique to execute malicious payloads or facilitate unauthorized system changes via crafted diagnostic cabinet files. The relevant MITRE ATT&CK technique here is **Execution: Command-Line Interface (T1059)** and **Exploitation of Remote Services (T1202)**.

  The primary telemetry sources required for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture process execution details. If this activity is malicious, it can lead to privilege escalation or remote code execution on affected systems. However, note that this detection does NOT confirm that the activity is malicious on its own; legitimate use of MS diagnostic tools may also trigger it.

  ---

  ### Investigation Steps

  - **Confirm the Alerting Process:** Review Security Event ID 4688 or Sysmon Event ID 1. Check if the `NewProcessName` contains `msdt.exe` and if `CommandLine` includes the `-cab` flag. Legitimate instances will generally not include this flag.

  - **Inspect the Command Line Arguments:** Validate the entire command line for other arguments that might indicate malicious activity (e.g., `-cab path_to_suspicious_file`). Compare with expected behaviors, which typically do not use these flags.

  - **Check Parent Process Relationships:** Identify the parent process of `msdt.exe` in the logs. Malicious executions often have unusual parent processes like PowerShell or suspicious scripts, while legitimate executions may originate from common trusted applications or services.

  - **Correlate with Known Malicious Indicators:** Look for previously reported indicators related to CVE-2022-30190 in threat intelligence feeds. Compare file hashes or network traffic generated at the time of execution against these indicators.

  - **Validate File Creation or Changes:** Review the presence of `.diagcab` files in temporary directories (e.g., `%TEMP%`) around the time of the alert. Check for unexpected file modifications or creations and validate their contents if suspicion arises.

  - **Assess Host Role and Environment:** Determine the role and importance of the affected host within the enterprise environment. Systems with high criticality (e.g., domain controllers, servers handling sensitive data) warrant expedited review due to the heightened impact of potential malicious activity.

  ---

  ### Prioritization

  The alert is of medium severity as it represents potentially malicious behavior in executing diagnostic utilities, which can be exploited to execute arbitrary commands. The likelihood of abuse is moderate, given that this technique has been weaponized but requires comprehensive contextual analysis to confirm malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of process obfuscation techniques or the suppression of application privileges that prevent logging. Reliable detection relies on having comprehensive logging enabled for process creations and command-line arguments. Legitimate use of `msdt.exe` for troubleshooting activities can also trigger this alert, possibly leading to false positives. Companion detections like monitoring for unusual file modifications in the user’s temp directories or correlating suspicious command-line arguments with historical benign usage can strengthen overall detection capabilities.

