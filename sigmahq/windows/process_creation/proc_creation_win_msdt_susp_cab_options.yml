note: |
  ### Technical Context
  This detection rule identifies instances of the execution of `msdt.exe` with the `-cab` command line argument, which is associated with the abuse of diagnostic cabinet files (.diagcab). Attackers may exploit this functionality, leveraging vulnerabilities such as CVE-2022-30190, to execute malicious payloads contained within these files, potentially leading to unauthorized access or system compromise. The use of `msdt.exe` in this manner typically aligns with techniques used in recent attacks that aim to bypass security controls through legitimate Windows utilities.

  The rule relates to the following MITRE ATT&CK tactics and techniques:
  - **Defense Evasion (T1202)**: The use of legitimate tools to evade detection.
  - **Execution (T1203)**: Execution of malicious code through software vulnerabilities or trusted applications.

  Primary data sources for this detection includes:
  - **Process creation events**: Logs capturing command line arguments for process initiation, specifically for `msdt.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any instances of `msdt.exe` being executed with the `-cab` flag. Look for suspicious command line arguments and verify the context of the execution.
  - **Analyze Related File Activity**: Identify and assess the associated .diagcab files and their contents, ensuring they are not being used to deliver unauthorized payloads.
  - **Inspect User Activities**: Investigate the user account that initiated the process. Check for anomalous account activity or permissions related to the execution of diagnostic tools.
  - **Cross-reference with Threat Intelligence**: Utilize threat intelligence feeds to correlate the identified behavior with known malicious tactics or campaigns that exploit similar vulnerabilities.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of enabling remote code execution via trusted processes combined with the likelihood of exposure from misconfigured systems or lack of user awareness. Attackers frequently abuse legitimate tools for nefarious purposes, making this an important indicator to monitor closely.

  ### Blind Spots and Assumptions
  There may be gaps in detection related to legitimate uses of .diagcab files, as the rule does not differentiate between authorized and suspicious usages. It assumes that all executions of `msdt.exe` with the `-cab` parameter are malicious, which may not always be the case. Additionally, proper logging and configuration must be enabled to ensure that all relevant process creation events are captured.

