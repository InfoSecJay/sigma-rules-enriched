note: |
  ### Technical Context

  This Sigma rule detects the execution of processes with suspicious names typically associated with malicious scripts or tools. Attackers may utilize these executable names to obfuscate their activities, aiming to exploit vulnerabilities or establish persistent access. The relevant MITRE ATT&CK tactics and techniques are Execution (TA0002) and Command and Scripting Interpreter (T1059). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide detailed information about executed scripts and processes. If the detected behavior is malicious, it could lead to system compromise, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent; it merely highlights potentially suspicious activity that requires further investigation to assess context and intent.

  ### Investigation Steps

  - **Identify process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 logs for processes matching suspicious names such as 'meterpreter', 'obfuscated.exe', or 'pupy.ps1'. Check for potentially malicious indicators such as those explicitly listed in the Sigma rule.

  - **Analyze command-line arguments:** Examine the CommandLine field in the appropriate logs for the presence of known malicious patterns, such as 'Invoke-CVE', 'mimikatz.ps1', or 'revshell.ps1'. If found, this may indicate an attack in progress.

  - **Assess parent-child process relationships:** Look for the parents of detected suspicious processes using Sysmon Event ID 1, noting any unusual parent processes such as PowerShell (Event ID 4104) or cmd.exe. Unusual parent-child relationships may indicate exploitation techniques like process injection.

  - **Establish baseline for legitimate processes:** Validate expected behavior by reviewing the execution logs (Event ID 4688) for known legitimate processes or common scripts used within your environment. Compare the context and timing of suspicious activity against regular operational patterns.

  - **Check for indicators of compromise on affected systems:** Validate the presence of related artifacts that may suggest attempted exfiltration or persistence, focusing on file creation or modification logs. Investigate for files in known paths like %TEMP%, which may be used for malicious script storage.

  - **Conduct threat intelligence correlation:** Utilize threat intelligence feeds to correlate suspicious process names or command-line arguments with known malicious activities. This could provide deeper insight into the context and potential risk associated with the alert.

  ### Prioritization

  This alert has a high severity rating, given that it may indicate the use of known malicious tools or scripts within the environment. The presence of these names or command-line patterns is often indicative of active exploitation and can have severe implications, especially on critical systems.

  ### Blind Spots and Assumptions

  This detection may have limitations due to potential evasion techniques, such as attackers using less suspicious names or masking their activities with legitimate apps. Additionally, configurations and logging settings may need to ensure comprehensive telemetry capture, especially for command-line execution. Legitimate tools and processes (e.g., security testing tools) may trigger this alert, necessitating a contextual understanding. Related detections, such as those monitoring for abnormal process parent-child relationships or unusual network activity from unusual scripts, can strengthen coverage against these threats.

