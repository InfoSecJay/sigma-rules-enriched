note: |
  ### Technical Context

  This Sigma rule detects the execution of programs or scripts with suspicious file names and command line patterns that are commonly associated with malicious activity, including malware and hacking tools. The primary objective of an attacker may include exploiting vulnerabilities, gaining unauthorized access, or maintaining persistence within a compromised environment. This behavior aligns with the MITRE ATT&CK technique for Command and Scripting Interpreter (T1059).

  The primary telemetry sources for detection are process creation logs, particularly from Windows systems (Windows Event ID 4688 or Sysmon Event ID 1). If malicious, the security impact includes potential system compromise, data exfiltration, and lateral movement within the network. However, this detection does NOT confirm the execution of malicious code without further contextual analysis of the environment and the user behavior associated with the detected activity.

  ### Investigation Steps

  - **Review process creation logs**: Check for Windows Event ID 4688 or Sysmon Event ID 1 where the Image field contains suspicious names such as '\poc.exe' or ends with '\meterpreter'. Malicious processes typically have highly indicative names linked to exploit development.

  - **Analyze command line parameters**: Inspect the CommandLine field for any occurrences of patterns such as 'Invoke-CVE' or 'mimikatz.ps1'. A command line including both a suspicious executable and known exploitation or reconnaissance terms may indicate malicious activity.

  - **Validate legitimate usage**: Identify whether the executed tools are installed software within your environment. Common legitimate activities may involve the use of scripts like 'powerup.ps1' or 'PowerView.ps1' in the context of system administration or security assessments by IT staff.

  - **Identify high-confidence malicious behavior**: Look for notable behavior matches such as processes executed from temporary directories (e.g., '\Temp\') or with unusual command line arguments indicative of obfuscation techniques (e.g., 'obfuscated.ps1').

  - **Correlate with additional telemetry sources**: If available, cross-reference the execution time and user context with network logs or endpoint detections to see if there was suspicious outbound traffic following the execution of the detected process.

  - **Assess the host’s role**: Determine the criticality of the host machine where the suspicious process was observed. Systems with high privilege or sensitive data should be prioritized for immediate investigation.

  ### Prioritization

  This alert is of high severity given that it involves potentially harmful process executions. The impact can range from unauthorized access to sensitive data to outright control of critical systems. The behavior detected is often weaponized, commonly seen in malicious campaigns targeting enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate administrative tools can inadvertently trigger alerts due to common naming conventions used in PowerShell scripts. Reliable detection requires configurations to capture all relevant process creation logs. Regular administrative actions or security assessments that utilize similar script names could result in false positives. Implementing companion detections monitoring for abnormal network activity following these alerts would enhance threat detection capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
