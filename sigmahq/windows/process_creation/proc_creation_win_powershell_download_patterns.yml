note: |
  ### Technical Context

  This Sigma rule detects PowerShell processes invoking download commands in their command line arguments, indicating a potential attempt to download malicious payloads remotely. The likely objective of an attacker triggering this behavior is to execute payloads or scripts after downloading them to execute commands, leading to further compromise or data exfiltration. This activity aligns with the MITRE ATT&CK technique “Command and Scripting Interpreter: Windows PowerShell” (ID: T1059.001).

  The primary telemetry sources for this detection include Windows Process Creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, that log details of process creation and associated command line arguments. If malicious, this behavior poses a significant security risk, potentially enabling malicious actors to install malware, deploy ransomware, or execute commands on compromised hosts. Notably, this detection does NOT confirm that malicious activity is occurring without additional context or corroborative evidence.

  ### Investigation Steps

  - **Review the Process Creation Events:** Check for Security Event ID 4688 and Sysmon Event ID 1 logs for the detected PowerShell process. Focus on command line arguments that contain ‘new-object’, ‘net.webclient).’, or ‘download’, as these indicate potential malicious intent.

  - **Analyze Process Parentage:** Investigate the parent process of the identified PowerShell instance using Event ID 4688. A legitimate PowerShell execution will often be initiated by known system processes (e.g., cmd.exe) or legitimate admin tools, whereas suspicious executions may originate from unusual sources.

  - **Correlate with Network Activity:** Review network logs (Firewall, Proxy) to identify any outbound connections made by the identified PowerShell process. Look for suspicious URLs or Downloads that correlate with the timing of the detected command, indicating potential data exfiltration or command and control communications.

  - **Establish Behavioral Baselines:** Assess historical behavior for the account or system executing the command. Regular administrative tasks using PowerShell may involve similar download patterns, which can help differentiate between legitimate administrative activity and potentially malicious behavior.

  - **Identify High-confidence Malicious Plays:** If the detected PowerShell command also includes references to known malicious domains or file hashes, this is a high-confidence indicator of malicious activity and should prompt immediate escalation.

  ### Prioritization

  Alerts triggered by this detection are medium severity. The impacted systems could hold sensitive data or essential services, which makes them prime targets for exploitation. Moreover, PowerShell is commonly weaponized for lateral movement and payload delivery, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques such as obfuscation of PowerShell commands or the use of scripts that run from trusted locations. It assumes that proper logging configurations (including Sysmon) are in place for comprehensive visibility. Additionally, legitimate activities, such as administrative script execution or system updates, could trigger this alert. A related detection, such as monitoring for unusual command execution behavior (e.g., unusual API calls), can enhance coverage and mitigate blind spots.

