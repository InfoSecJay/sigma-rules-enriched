note: |
  ### Technical Context

  The rule detects the execution of PowerShell processes containing specific download commands in their command line arguments, indicating potential unauthorized remote file retrieval. This behavior is often leveraged by attackers aiming to download malicious payloads or tools onto compromised systems, facilitating further stages of an attack. It aligns with the MITRE ATT&CK tactic of Execution and the technique T1059.001 (PowerShell).

  Primary telemetry sources include Windows Process Creation logs, specifically events related to PowerShell execution (Event ID 4688 and Sysmon Event ID 1). If successful, malicious downloads can lead to a security compromise, including malware installation or data exfiltration. This detection does NOT confirm that an actual malicious file was downloaded on its own; it only indicates that suspicious PowerShell commands were executed.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for any PowerShell execution. Look specifically for processes with the names `powershell.exe`, `powershell_ise.exe`, or `pwsh.exe`.

  - **Examine Command Line Arguments:** Analyze the command line field for indications of download activity, focusing on commands containing `new-object`, `net.webclient)`, or `download`. Malicious usage typically includes obfuscated or encoded commands.

  - **Validate File Retrieval:** If the command includes `file(` or mentions remote URLs, investigate the destination to confirm if files were downloaded. Check for new files created in the directory, especially those not aligned with typical user workflows.

  - **Identify Legitimate Usage Patterns:** Consider expected PowerShell usage within your environment, such as automation scripts or administrative tasks. Validate against baseline behaviors to distinguish between benign and suspicious activities.

  - **Correlate with Network Activity:** Review firewall or proxy logs for outbound traffic from the affected host to known malicious sites or unusual domains that might indicate data exfiltration or command and control communication.

  ### Prioritization

  This alert is categorized as medium severity due to the potential impact on the affected system. The likelihood of malicious behavior is moderate, as many attackers routinely use PowerShell for downloads. Moreover, the presence of download commands is often a tactic employed by various threat actors, particularly in initial access scenarios.

  ### Blind Spots and Assumptions

  Detection can be potentially evaded by using encoded PowerShell commands, script blocks, or alternative scripting environments (e.g., Perl, Python) for downloading files. Reliable detection requires proper logging configurations, specifically ensuring that process creation events are captured. Legitimate internal PowerShell scripts may inadvertently trigger this alert, necessitating contextual analysis. Related detection rules, such as monitoring for file creation events on target directories, can enhance coverage and improve context around potential malicious downloads.

