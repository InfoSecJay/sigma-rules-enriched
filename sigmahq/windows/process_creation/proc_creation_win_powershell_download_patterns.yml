note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell activity associated with downloading payloads from external sources. By analyzing the command line of PowerShell processes, the rule targets specific patterns indicative of an attacker using PowerShell to retrieve files, which can often include malicious scripts or executables. Attackers leveraging these techniques typically aim to establish a foothold in a network, deploy malware, or execute other forms of exploitation.

  The relevant MITRE ATT&CK tactics include:
  - **Execution**: The initial execution of a command through a scripting environment.
  - **Command and Scripting Interpreter** (T1059.001): Specifically focuses on PowerShell, a commonly abused scripting language in attacks for its ability to interact with system components and perform actions discreetly.

  Primary data sources for detecting this behavior will include Windows process creation logs which capture the command lines associated with PowerShell executions, providing crucial insight into potentially harmful commands executed on the system.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for any instances of PowerShell execution that match the command line patterns outlined in the detection logic, focusing particularly on `powershell.exe`, `powershell_ise.exe`, and `pwsh.exe`.
  - **Analyze Command Arguments**: Investigate the full command line arguments used with PowerShell, specifically looking for any usage of `new-object`, `net.webclient`, and `download` to identify potential download commands.
  - **Check for Subsequent Network Activity**: After identifying suspicious PowerShell commands, observe outbound network connections from the affected host for any unusual patterns or connections to known malicious IPs, particularly following the execution of the downloading command.
  - **Evaluate Related System Changes**: Look for modifications to system files or processes that might have occurred after the execution of the identified PowerShell commands, as this could indicate further malicious activity such as malware execution or persistence mechanisms.

  ### Prioritization
  The alert is classified as medium severity due to the potential for unauthorized file downloads, which can lead to further exploitation or data compromise. However, the likelihood of false positives exists given the legitimate uses of PowerShell in administration.

  ### Blind Spots and Assumptions
  This rule may miss downloads executed without PowerShell or those conducted via alternative methods (like direct file transfer protocols). It assumes that the logging for process creation is adequately configured to capture all relevant events. Additionally, the detection logic presumes that attackers will use recognizable download patterns and won't obfuscate their command lines, which they may sometimes do to evade detection.

