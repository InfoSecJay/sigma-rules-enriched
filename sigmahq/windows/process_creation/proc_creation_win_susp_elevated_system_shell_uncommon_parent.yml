title: Elevated System Shell Spawned From Uncommon Parent Location
id: 178e615d-e666-498b-9630-9ed363038101
related:
- id: 61065c72-5d7d-44ef-bf41-6a36684b545f
  type: similar
status: test
description: Detects when a shell program such as the Windows command prompt or 
  PowerShell is launched with system privileges from a uncommon parent location.
references:
- https://github.com/Wh04m1001/SysmonEoP
author: frack113, Tim Shelton (update fp)
date: 2022-12-05
modified: 2025-03-06
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_shell:
  - Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'powershell_ise.EXE'
    - 'pwsh.dll'
    - 'Cmd.Exe'
  selection_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
    LogonId: '0x3e7'
  filter_main_generic:
        # Example 1:
        #   C:\Program Files\erl-23.2\erts-11.1.4\bin\erl.exe" -service_event ErlSrv_RabbitMQ -nohup -sname rabbit@localhost -s rabbit boot -boot start_sasl +W w +MBas ageffcbf +MHas ageffcbf +MBlmbcs 512 +MHlmbcs 512 +MMmcs 30 +P 1048576 +t 5000000 +stbt db +zdbbl 128000 +sbwt none +sbwtdcpu none +sbwtdio none -kernel inet_dist_listen_min 25672 -kernel inet_dist_listen_max 25672 -lager crash_log false -lager handlers []
        # Example 2:
        #   ParentImage: C:\Program Files (x86)\Varonis\DatAdvantage\GridCollector\VrnsRealTimeAlertsSvc.exe" /appid 000000ad-cb03-500b-9459-c46d000000ad
        #   CommandLine: C:\Windows\system32\cmd.exe /c C:\Program Files "(x86)\Varonis\DatAdvantage\GridCollector\handle_scopes.cmd C:\Collector" Working Share\VaronisWorkDirectoryCollector
    ParentImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\ProgramData\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\Temp\'         # Installers
    - ':\Windows\WinSxS\'
  filter_optional_manageengine:
        # Example:
        #   ParentImage: C:/ManageEngine/ADManager Plus/pgsql/bin/postgres.exe" --forkarch 5380
        #   CommandLine: C:\Windows\system32\cmd.exe /c "IF EXIST archive.bat (archive.bat pg_wal\000000010000008E000000EA 000000010000008E000000EA)
    ParentImage|endswith: ':\ManageEngine\ADManager Plus\pgsql\bin\postgres.exe'
    Image|endswith: '\cmd.exe'
  filter_optional_asgard:
    CommandLine|contains: ':\WINDOWS\system32\cmd.exe /c "'
    CurrentDirectory|contains: ':\WINDOWS\Temp\asgard2-agent\'
  filter_optional_ibm_spectrumprotect:
    ParentImage|contains: ':\IBM\SpectrumProtect\webserver\scripts\'
    CommandLine|contains: ':\IBM\SpectrumProtect\webserver\scripts\'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - ''
    - '-'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Some legitimate applications may spawn shells from uncommon parent locations. 
  Apply additional filters and perform an initial baseline before deploying.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the spawning of elevated shell processes (such as PowerShell or cmd.exe) originating from uncommon parent locations on Windows systems. Attackers may exploit this behavior to execute commands or scripts with elevated privileges, potentially compromising system integrity or exfiltrating data. The relevant MITRE ATT&CK tactics and techniques include Privilege Escalation (T1068) and Command and Control (T1071).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1. The potential security impact is significant, as this behavior could lead to unauthorized system changes or data breaches. However, it is important to clarify that this detection does not, on its own, confirm malicious intent; legitimate applications may perform similar activities.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for the process details, looking for any processes that spawned shell instances (e.g., cmd.exe, powershell.exe) with an unusual parent image.

  - **Identify common parent processes:** Evaluate the ParentImage field to establish whether the spawning shell process originated from known legitimate applications or locations. Common benign use cases include system maintenance processes or scripts executed by authorized IT personnel.

  - **Review command line parameters:** Analyze the CommandLine field in the logs to identify any unusual or suspicious parameters being passed to the shell process. Legitimate command usage will typically have clear, contextual commands without obfuscation.

  - **Assess user session context:** Verify the User field, particularly looking for instances where the user is the SYSTEM account (User contains "AUTHORI" or "AUTORI"). Malicious shell execution often uses high-privilege accounts in abnormal contexts.

  - **Correlate with other alerts:** Check related detections or companion alerts within the SOC for additional support or related suspicious activity. Position this alert alongside other analytics that monitor user behavior or permission changes.

  - **Document historical activity:** Compile a baseline of normal behavior based on prior logs and reports from similar systems/roles to assist in differentiating between legitimate actions and potential threats.

  ### Prioritization

  This alert is of medium severity, as it involves the potential elevation of privileges and execution of commands from uncommon parent locations, which is frequently exploited by threat actors. The likelihood of abuse is notable, especially in environments where privilege escalation tactics are commonly weaponized.

  ### Blind Spots and Assumptions

  Detection limitations exist due to potential evasion techniques. Threat actors might disguise their activities using legitimate applications or scheduled tasks. Reliable detection requires comprehensive logging configurations, specifically around process creation and command execution. Lastly, benign scenarios that may trigger this alert include automated system updates or legitimate scripts run by system administrators. It may be beneficial to monitor for related detections, such as unusual logon behavior or other suspicious command executions, to strengthen overall incident coverage.

