title: Elevated System Shell Spawned From Uncommon Parent Location
id: 178e615d-e666-498b-9630-9ed363038101
related:
- id: 61065c72-5d7d-44ef-bf41-6a36684b545f
  type: similar
status: test
description: Detects when a shell program such as the Windows command prompt or 
  PowerShell is launched with system privileges from a uncommon parent location.
references:
- https://github.com/Wh04m1001/SysmonEoP
author: frack113, Tim Shelton (update fp)
date: 2022-12-05
modified: 2025-03-06
tags:
- attack.privilege-escalation
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_shell:
  - Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'powershell_ise.EXE'
    - 'pwsh.dll'
    - 'Cmd.Exe'
  selection_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
    LogonId: '0x3e7'
  filter_main_generic:
        # Example 1:
        #   C:\Program Files\erl-23.2\erts-11.1.4\bin\erl.exe" -service_event ErlSrv_RabbitMQ -nohup -sname rabbit@localhost -s rabbit boot -boot start_sasl +W w +MBas ageffcbf +MHas ageffcbf +MBlmbcs 512 +MHlmbcs 512 +MMmcs 30 +P 1048576 +t 5000000 +stbt db +zdbbl 128000 +sbwt none +sbwtdcpu none +sbwtdio none -kernel inet_dist_listen_min 25672 -kernel inet_dist_listen_max 25672 -lager crash_log false -lager handlers []
        # Example 2:
        #   ParentImage: C:\Program Files (x86)\Varonis\DatAdvantage\GridCollector\VrnsRealTimeAlertsSvc.exe" /appid 000000ad-cb03-500b-9459-c46d000000ad
        #   CommandLine: C:\Windows\system32\cmd.exe /c C:\Program Files "(x86)\Varonis\DatAdvantage\GridCollector\handle_scopes.cmd C:\Collector" Working Share\VaronisWorkDirectoryCollector
    ParentImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\ProgramData\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\Temp\'         # Installers
    - ':\Windows\WinSxS\'
  filter_optional_manageengine:
        # Example:
        #   ParentImage: C:/ManageEngine/ADManager Plus/pgsql/bin/postgres.exe" --forkarch 5380
        #   CommandLine: C:\Windows\system32\cmd.exe /c "IF EXIST archive.bat (archive.bat pg_wal\000000010000008E000000EA 000000010000008E000000EA)
    ParentImage|endswith: ':\ManageEngine\ADManager Plus\pgsql\bin\postgres.exe'
    Image|endswith: '\cmd.exe'
  filter_optional_asgard:
    CommandLine|contains: ':\WINDOWS\system32\cmd.exe /c "'
    CurrentDirectory|contains: ':\WINDOWS\Temp\asgard2-agent\'
  filter_optional_ibm_spectrumprotect:
    ParentImage|contains: ':\IBM\SpectrumProtect\webserver\scripts\'
    CommandLine|contains: ':\IBM\SpectrumProtect\webserver\scripts\'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - ''
    - '-'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Some legitimate applications may spawn shells from uncommon parent locations. 
  Apply additional filters and perform an initial baseline before deploying.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the spawning of elevated shell processes, such as PowerShell or cmd.exe, from uncommon parent locations. This behavior is often indicative of privilege escalation attempts or malicious execution of commands intended to manipulate the system or extract information. The likely attacker objective is to gain unauthorized access to system functionality that could facilitate further exploitation or lateral movement within the network.

  Relevant tactics and techniques include:
  - Execution (T1203)
  - Privilege Escalation (T1068).

  Primary telemetry sources include Windows Process Creation events (Security Event ID 4688) and Sysmon logs (Event ID 1). The security impact, if malicious, could be significant, potentially leading to system compromise or data exfiltration. Importantly, this detection does NOT confirm malicious behavior on its own; legitimate applications may also spawn shells under similar circumstances.

  ### Investigation Steps

  - **Review process creation log entries:** Search for Security Event ID 4688 or Sysmon Event ID 1 and examine entries related to `cmd.exe`, `powershell.exe`, or `pwsh.exe`. Focus specifically on the `ParentImage` field for uncommon sources like `C:\Program Files (x86)\` or `C:\ProgramData`.

  - **Identify the parent process type:** Determine if the parent process comes from trusted software (e.g., enterprise applications) or from suspicious origins such as temporary directories or unusual installations. Use the `Image` and `ParentImage` fields in the logs.

  - **Check user context and logon ID:** Verify the `User` field in your logged events to determine if the user is `SYSTEM` (LogonId: '0x3e7'). Legitimate elevated processes may also be launched by standard user accounts with provable business functions.

  - **Analyze the command line arguments:** Review the `CommandLine` field for indicators of malicious behavior, such as obfuscation, execution of unusual scripts, or known malicious patterns. Look for extra flags or parameters that do not correspond with normal use cases.

  - **Assess the legitimacy of spawned processes:** Review the baseline behaviors of applications known to spawn shells from uncommon parent locations. Validate this against historical logs to determine if this is an expected pattern for known software deployments.

  - **Correlate with associated detections:** Identify any linked alerts or related detections (e.g., lateral movements or failed privilege escalations) that provide context on whether this behavior is part of a broader attack campaign.

  ### Prioritization

  This alert should be considered medium priority. Elevated shell execution poses a significant risk, especially if originating from critical systems or infrastructure components. The behavior detected is often leveraged in real-world attacks, making further investigation essential.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, where attackers may spoof legitimate process parents or use known applications for malicious purposes. Ensure Sysmon logging is configured to capture comprehensive process creation details, especially for cloud or third-party services that may not follow standard logging practices. Additionally, legitimate administrative tools and configurations may trigger this alert, necessitating a thorough understanding of appropriate usage patterns within the environment. A related detection might encompass monitoring for unusual file creations or script executions in conjunction with this alert.

