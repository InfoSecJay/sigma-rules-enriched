title: Elevated System Shell Spawned From Uncommon Parent Location
id: 178e615d-e666-498b-9630-9ed363038101
related:
- id: 61065c72-5d7d-44ef-bf41-6a36684b545f
  type: similar
status: test
description: Detects when a shell program such as the Windows command prompt or PowerShell
  is launched with system privileges from a uncommon parent location.
references:
- https://github.com/Wh04m1001/SysmonEoP
author: frack113, Tim Shelton (update fp)
date: 2022-12-05
modified: 2025-03-06
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_shell:
  - Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'powershell_ise.EXE'
    - 'pwsh.dll'
    - 'Cmd.Exe'
  selection_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
    LogonId: '0x3e7'
  filter_main_generic:
        # Example 1:
        #   C:\Program Files\erl-23.2\erts-11.1.4\bin\erl.exe" -service_event ErlSrv_RabbitMQ -nohup -sname rabbit@localhost -s rabbit boot -boot start_sasl +W w +MBas ageffcbf +MHas ageffcbf +MBlmbcs 512 +MHlmbcs 512 +MMmcs 30 +P 1048576 +t 5000000 +stbt db +zdbbl 128000 +sbwt none +sbwtdcpu none +sbwtdio none -kernel inet_dist_listen_min 25672 -kernel inet_dist_listen_max 25672 -lager crash_log false -lager handlers []
        # Example 2:
        #   ParentImage: C:\Program Files (x86)\Varonis\DatAdvantage\GridCollector\VrnsRealTimeAlertsSvc.exe" /appid 000000ad-cb03-500b-9459-c46d000000ad
        #   CommandLine: C:\Windows\system32\cmd.exe /c C:\Program Files "(x86)\Varonis\DatAdvantage\GridCollector\handle_scopes.cmd C:\Collector" Working Share\VaronisWorkDirectoryCollector
    ParentImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\ProgramData\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\Temp\'         # Installers
    - ':\Windows\WinSxS\'
  filter_optional_manageengine:
        # Example:
        #   ParentImage: C:/ManageEngine/ADManager Plus/pgsql/bin/postgres.exe" --forkarch 5380
        #   CommandLine: C:\Windows\system32\cmd.exe /c "IF EXIST archive.bat (archive.bat pg_wal\000000010000008E000000EA 000000010000008E000000EA)
    ParentImage|endswith: ':\ManageEngine\ADManager Plus\pgsql\bin\postgres.exe'
    Image|endswith: '\cmd.exe'
  filter_optional_asgard:
    CommandLine|contains: ':\WINDOWS\system32\cmd.exe /c "'
    CurrentDirectory|contains: ':\WINDOWS\Temp\asgard2-agent\'
  filter_optional_ibm_spectrumprotect:
    ParentImage|contains: ':\IBM\SpectrumProtect\webserver\scripts\'
    CommandLine|contains: ':\IBM\SpectrumProtect\webserver\scripts\'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - ''
    - '-'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some legitimate applications may spawn shells from uncommon parent locations. Apply
  additional filters and perform an initial baseline before deploying.
level: medium
note: |
  ### Technical Context
  This rule detects instances where command-line interfaces, such as Windows Command Prompt (`cmd.exe`) or PowerShell, are launched with system-level privileges from unusual parent locations. The detection focuses on processes initiated from directories outside the typical application directories, which may indicate malicious activity, such as privilege escalation or lateral movement by an attacker.

  The threat scenario typically involves an adversary attempting to execute arbitrary commands or scripts that could lead to further exploitation or persistence on the system. This can manifest as an attempt to bypass security controls or a strategy to execute malicious scripts from unexpected locations unseen during normal monitoring activities. Attackers might use techniques to conceal their activities (defense evasion) or execute code in a privileged context (execution).

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Privilege Escalation (TA0004)**: Gaining higher-level permissions on a system.
  - **Defense Evasion (TA0005)**: Techniques that allow an attacker to avoid detection.
  - **Execution (TA0002)**: Running malicious code on a system.
  - **Command and Scripting Interpreter (T1059)**: Utilizing command-line interfaces for execution.

  Primary data sources for investigation include process creation events (which log details on executed commands and the context of those executions) and telemetry from Windows Event Logs.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for entries where `cmd.exe` or PowerShell was executed, specifically looking for the parent process path and any command-line arguments that could indicate suspicious behavior.

  - **Analyze Parent Process Context**: Identify the parent process that spawned the shell. Specifically, look for unusual or unexpected applications originating from common directories, as these could indicate an attacker’s use of legitimate tools to perform malicious actions.

  - **Correlate with User Behavior**: Assess the user account associated with the execution (LogonId `0x3e7` indicates a system or service account). Investigate the user’s activity history to identify any anomalies or inconsistencies.

  - **Gather Contextual Logs**: Collect additional logs from security tools (like EDR) that provide context to the executed commands. This includes historical data on previous executions by the user and mappings to known indicators of compromise (IoCs).

  ### Prioritization
  This alert should be considered medium priority due to the potential risk of an attacker gaining unauthorized access or control over critical systems. The unusual spawning of privileged shells indicates possible exploitation attempts, which can lead to subsequent attacks if left unchecked.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage against legitimate applications that could spawn shells from uncommon parent locations. The detection rule assumes that common benign applications are not strategically used to escalate privileges, which could result in false positives. Proper logging configurations are required, primarily ensuring that process creation events are enabled and monitored for effective detection. Additionally, implementing baseline monitoring of normal user behavior could improve the clarity of investigations.

