level: high
note: |
  ### Technical Context
  This rule detects potential process injection activities that leverage Microsoft Remote Assistance (Msra.exe). Attackers typically use Msra.exe as a means to control compromised systems, enable further reconnaissance, or establish persistence. By monitoring child processes spawned by Msra.exe, this rule identifies attempts to inject malicious code or commands, which could indicate nefarious activities such as lateral movement or unauthorized access to system resources.

  The likely attacker objectives include maintaining control over the victim system, executing commands stealthily, and utilizing various system utilities for data exfiltration or further malicious actions. Recognizing this behavior is critical, as such processes often act as a backdoor for threat actors. The relevant MITRE ATT&CK tactics include **Execution** (T1055 - Process Injection) and **Defense Evasion** (which might support maintaining persistence or bypassing security controls).

  For effective detection of this behavior, the primary data sources include **process creation events**, which can provide insights into parent-child relationships between processes, as well as command line usage that may reveal suspicious intentions behind the process launches.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for instances where `msra.exe` is the parent process, noting any suspicious child processes that could indicate process injection.

  - **Analyze Command Line Arguments**: Investigate the command line arguments used by the child processes for unusual flags or commands that don't align with legitimate use cases of those utilities.

  - **Correlate with Historical Data**: Look for any previous occurrences of `msra.exe` or its associated child processes in the environment to establish a pattern of potential misuse or identify if it follows known threat actor behaviors.

  - **Cross-Reference with Threat Intelligence**: Utilize threat intelligence feeds to check for indicators associated with similar process injection tactics or known threat actors who exploit Msra.exe, particularly focusing on the Qakbot malware family.

  ### Prioritization
  This alert is high severity due to the potential impact of process injection activities, which can lead to unauthorized access, system compromise, or data exfiltration. Such actions are indicative of sophisticated attacks that denote a significant risk to enterprise environments.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of malicious behavior, especially if attackers utilize legitimate processes in non-standard ways or if they use alternate methods to achieve their objectives. It assumes that `msra.exe` is not being used for legitimate purposes in the monitored environment. Additionally, sufficient process creation logging must be configured to enable effective tracking of these events, as absence of such data could lead to missed detections.

