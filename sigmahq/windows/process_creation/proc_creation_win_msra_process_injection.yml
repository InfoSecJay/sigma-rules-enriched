detection:
  selection:
    ParentImage|endswith: '\msra.exe'
    ParentCommandLine|endswith: 'msra.exe'
    Image|endswith:
    - '\arp.exe'
    - '\cmd.exe'
    - '\net.exe'
    - '\netstat.exe'
    - '\nslookup.exe'
    - '\route.exe'
    - '\schtasks.exe'
    - '\whoami.exe'
  condition: selection
falsepositives:
- Legitimate use of Msra.exe
level: high
note: |
  ### Technical Context

  This rule detects processes that are spawned as child processes of the Microsoft Remote Assistance application (Msra.exe), specifically focusing on known exploitation techniques associated with process injection. Adversaries may leverage Msra.exe to facilitate remote control, persistence, or discovery in a compromised environment. The relevant MITRE ATT&CK tactic is **Execution** and technique **Process Injection (T1055)**.

  Primary telemetry sources for this detection include Windows Security Event ID 4688 (process creation) and Sysmon Event ID 1 (process creation), which log information about newly created processes and their parent-child relationships. If malicious, this behavior can lead to unauthorized access and command execution within the environment. This detection alone does NOT confirm active exploitation or malicious intent but rather indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Identify the parent process details:** Review Event ID 4688 to identify parent process ID and account name associated with Msra.exe creation. Look for unusual user accounts or system accounts executing these processes.

  - **Examine child processes:** Correlate the identified parent process with its child processes, particularly any processes ending with '\arp.exe', '\cmd.exe', '\net.exe', etc. Validate that these processes are not part of expected administrative activities.

  - **Review command line arguments:** For the identified Event ID 4688 entries, examine the ParentCommandLine field. Legitimate cases often have no atypical command line arguments, while malicious ones may show unusual flags or obfuscation indicative of attack tactics.

  - **Check for known indicators of compromise:** Use threat intelligence feeds to cross-reference any child processes against known malware signatures, particularly those associated with Qakbot or other malware using Msra.exe for persistence.

  - **Assess system context:** Investigate the asset role and criticality to prioritize alerts. Msra.exe may be logged legitimately during remote support sessions; confirm the session's timing and context against recent helpdesk or support tickets.

  - **Monitor for file system changes:** Check for unusual file creations or modifications near the time of the process creation in the directories associated with the child processes. Look for newly created files or changes to legitimate files (e.g., scripts or executables) that could indicate pre- or post-injection weaponization.

  ### Prioritization

  This alert should be treated as high priority due to the potential for system compromise and lateral movement associated with the exploitation of Msra.exe. The likelihood of malicious abuse is considerable, particularly concerning actors known to exploit this tool for remote access. Furthermore, the nature of the behavior aligns with tactics commonly leveraged in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of Msra.exe, which can generate similar alerts. Proper configuration and retention of process creation logs, including Sysmon, are critical to maintaining reliable detection. Additionally, users performing legitimate remote assistance tasks might trigger this alert, necessitating contextual analysis. A related detection could be monitoring for unusual network activity, especially inbound remote assistance connections that are not correlated with administrative tickets or documented helpdesk requests.

