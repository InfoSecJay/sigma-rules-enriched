title: Potential Process Injection Via Msra.EXE
id: 744a188b-0415-4792-896f-11ddb0588dbc
status: test
description: Detects potential process injection via Microsoft Remote 
  Asssistance (Msra.exe) by looking at suspicious child processes spawned from 
  the aforementioned process. It has been a target used by many threat actors 
  and used for discovery and persistence tactics
