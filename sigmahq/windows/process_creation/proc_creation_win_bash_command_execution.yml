note: |
  ### Technical Context

  This rule detects the execution of Microsoft Bash Launcher with the `-c` flag, which can indicate attempts to bypass security measures by executing commands in a potentially malicious manner. The objective of such an action is typically to directly execute Linux or Windows programs from the Bash shell, which may be utilized in a post-exploitation scenario or as part of lateral movement by an adversary. This behavior aligns with the MITRE ATT&CK tactic for Defense Evasion (TA0005), specifically the technique for Execute Command (T1202).

  The primary telemetry source for this detection is process creation logs on Windows systems, specifically focusing on Event ID 4688, which captures detailed information regarding the creation of processes. If this behavior is malicious, it poses a significant risk as it can allow attackers to execute arbitrary code bypassing typical mitigations. The detection does NOT confirm the intent behind the command execution or guarantee that the actions taken resulted in successful exploitation or compromise.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Event ID 4688 or Sysmon Event ID 1 to confirm the process creation of `bash.exe`. Filter for command lines that include `-c`, noting anything suspicious or unexpected in the command being executed.

  - **Identify Malicious Command Patterns:** Look for known malicious command patterns that leverage Bash to execute harmful scripts. Check the command line for unusual arguments or known indicators of compromise (IOCs) related to the environment.

  - **Verify Host Environment:** Assess the role of the affected host (e.g., development, testing, production) and ensure that the execution of Bash for the specified command is within acceptable usage. Legitimate use cases typically involve system administrators or developers running scripted tasks.

  - **Correlate with User Activity:** Check user account activity around the time of the alert by reviewing authentication logs and other user-specific telemetry. Look for any anomalous behavior, such as failed logins or unexpected access patterns before the process creation event.

  - **Audit Bash.exe Configuration:** Review file integrity and last modified timestamps on `bash.exe` located at `C:\Windows\System32\bash.exe` or `C:\Windows\SysWOW64\bash.exe` to ensure it has not been tampered with or replaced with a malicious version.

  ### Prioritization

  The severity of this alert is medium because it indicates a capability for potential exploitation. While the attack vector itself may not be entirely common, the use of Bash to indirectly execute commands could lead to significant impacts, especially if the affected system hosts sensitive data or controls critical infrastructure.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete process monitoring or logs from `bash.exe` if security configurations are misaligned. Legitimate command executions by users familiar with Bash scripting could generate false positives. A related detection to consider is monitoring for PowerShell execution patterns (T1086), as both may be used in similar malicious workflows to circumvent traditional defenses.

