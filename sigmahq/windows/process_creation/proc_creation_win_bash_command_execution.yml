detection:
  selection_img:
  - Image|endswith:
    - ':\Windows\System32\bash.exe'
    - ':\Windows\SysWOW64\bash.exe'
  - OriginalFileName: 'Bash.exe'
  selection_cli:
    CommandLine|contains: ' -c '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies the use of `bash.exe` on Windows systems with the `-c` command-line flag, which allows the execution of commands directly in a bash environment. Attackers may leverage this to execute arbitrary code or bypass security controls, potentially leading to lateral movement or system compromise. The relevant MITRE ATT&CK technique is **"Command and Control" (T1202)**.

  Primary telemetry sources include Windows process creation events, specifically **Security Event ID 4688** and **Sysmon Event ID 1**. If malicious, the execution of arbitrary commands could lead to significant security incidents, including data exfiltration or ransomware deployment. However, this detection alone does NOT confirm malicious intent, as legitimate use of bash for automation or administrative tasks may also trigger this rule.

  ### Investigation Steps

  - **Verify process details and parent process**: Check for **Event ID 4688** in Windows Security logs to identify the process tree. A malicious execution will often have suspicious parent processes, such as `powershell.exe`, or `cmd.exe`. Legitimate usage typically involves known administration or automation tools.

  - **Inspect command-line arguments**: Review the command-line arguments in the **Sysmon Event ID 1** logs. Look for unexpected or unusual commands following the `-c` flag, as these may indicate malicious behavior. Legitimate activity often consists of simpler commands or known script calls.

  - **Analyze system file modifications**: Monitor for any file creations or modifications around the time of `bash.exe` execution. Use Windows Security Event ID 4663 or Sysmon Event ID 10 to identify file creation events, indicating possible persistence mechanisms.

  - **Correlate with other security alerts**: Cross-reference this alert with logs from intrusion detection systems (IDS), endpoint protection solutions, or threat intelligence feeds. Identify if there's a known malicious indicator or a similar alert triggered during the same time frame.

  - **Contextualize based on asset criticality**: Understand the importance of the system where the command was executed. Servers hosting critical applications or services warrant a more thorough investigation compared to standard employee workstations.

  ### Prioritization

  This alert is of **medium severity** given the potential impact on critical systems through command execution. The likelihood of abuse is moderate, as attackers often exploit similar means to bypass security. While the behavior can indicate a security event, it is not highly common in typical user workflows.

  ### Blind Spots and Assumptions

  This rule may miss scenarios where attackers use alternative command execution methods or employ obfuscation techniques. Reliable detection requires Windows process creation logs and Sysmon be correctly configured and actively collecting telemetry. Legitimate administrative activities, such as using bash for deployment scripts, can also trigger this alert. Related detections, like PowerShell execution anomalies, can provide additional context to assess the risk effectively.

