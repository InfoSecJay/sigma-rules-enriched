title: Suspicious Autorun Registry Modified via WMI
id: c80e66d8-1780-48a9-b412-46663fd21ac0
status: experimental
description: |
  Detects suspicious activity where the WMIC process is used to create an autorun registry entry via reg.exe, which is often indicative of persistence mechanisms employed by malware.
references:
- Internal Research
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-17
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1547.001
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_execution_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'       # wmic process call create 'reg.exe add HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run /v Desktops /t REG_SZ /d "\"C:\Users\user\AppData\Roaming\Microsoft\tre\Desktops.exe\" random" /f'
  - ParentImage|endswith: '\wmiprvse.exe'
  selection_execution_cmd:
    CommandLine|contains|all:
    - 'reg'
    - ' add '
    CommandLine|contains:
    - '\Software\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
  selection_suspicious_paths_1:
    CommandLine|contains:
    - ':\Perflogs'
    - :\ProgramData'
    - ':\Windows\Temp'
    - ':\Temp'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming'
    - ':\$Recycle.bin'
    - ':\Users\Default'
    - ':\Users\public'
    - '%temp%'
    - '%tmp%'
    - '%Public%'
    - '%AppData%'
  selection_suspicious_paths_user_1:
    CommandLine|contains: ':\Users\'
  selection_suspicious_paths_user_2:
    CommandLine|contains:
    - '\Favorites'
    - '\Favourites'
    - '\Contacts'
    - '\Music'
    - '\Pictures'
    - '\Documents'
    - '\Photos'
  condition: all of selection_execution_* and (selection_suspicious_paths_1 or 
    (all of selection_suspicious_paths_user_*))
falsepositives:
- Legitimate administrative activity or software installations
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious modifications to autorun registry entries using the Windows Management Instrumentation Command-line (WMIC) tool, specifically when `reg.exe` is employed to create such entries. Attackers often attempt to establish persistence mechanisms through these registry modifications to ensure their malware executes automatically upon user login. This behavior aligns with the MITRE ATT&CK techniques T1547.001 (Startup Items) and T1047 (Windows Management Instrumentation), indicating an adversary's intent to maintain control over the infected system.

  The primary telemetry sources include Windows process creation logs collected from Event ID 4688 and Sysmon Event ID 1, capturing detailed command-line arguments and parent-child relationships between processes. If this behavior is confirmed as malicious, it may lead to unauthorized access, data theft, or further system compromise. However, this detection does NOT definitively confirm that the registry modification is malicious without additional context or correlation to other indicators.

  ### Investigation Steps

  - **Check for WMIC process execution:** Examine Security Event ID 4688 and Sysmon Event ID 1 logs for instances where `wmic.exe` is executed. Look for command lines that include "reg add" targeting autorun locations, which is unusual for most legitimate processes.

  - **Identify the parent process:** Validate that the `wmic.exe` process is spawned from `wmiprvse.exe`. The relationship between these processes might indicate legitimate administrative activities, but unusual contexts could suggest malicious intent.

  - **Verify the registry modification command:** Analyze the specific command line used in the process to confirm that it attempts to create a key under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. Legitimate commands typically do not modify autorun settings in this manner without clear administrative intent.

  - **Look for abnormal registry paths:** Investigate command lines with suspicious paths such as `C:\Users\user\AppData\Roaming\Microsoft\tre\Desktops.exe` or `%temp%`, which may indicate malware persistence. Compare them against known legitimate applications for anomalies.

  - **Assess the asset's role:** Determine the role of the affected host (e.g., server, workstation) and criticality. If it's a highly critical server with no expected user-level changes, the detection should be prioritized.

  - **Review for legitimate administrative actions:** Understand and document any potential legitimate scenarios where admins might use WMIC for registry changes, such as software installation or system configuration, to rule out false positives.

  ### Prioritization

  The alert is of high severity given its potential impact on user systems and the likelihood that such behavior is exploited for persistence by malware. The misuse of WMIC for these modifications is relatively uncommon outside of administrative functions, which increases the risk of it being weaponized in a compromised environment.

  ### Blind Spots and Assumptions

  The detection may be limited by environments where WMIC is commonly used for legitimate administrative tasks, increasing potential false positives. Reliable detection requires proper logging configurations for both process creation and registry modifications, particularly in environments with diverse operational practices. Additionally, legitimate software installations may also trigger this alert. A related detection rule monitoring unusual registry changes without WMIC involvement could provide supplemental coverage against evasion techniques.

