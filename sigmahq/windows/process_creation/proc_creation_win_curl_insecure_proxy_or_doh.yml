  ---

  ### Technical Context

  This rule detects the use of `curl.exe` executed with parameters indicating insecure connections, specifically through a proxy or DNS over HTTPS (DoH). The behavior suggests an attempt to circumvent security protocols typically implemented to safeguard network traffic, potentially allowing the attacker to exfiltrate data or communicate with command and control servers in a concealed manner.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **Command and Control** (TA0011) with techniques such as **Command-Line Interface** (T1059) and **Application Layer Protocol** (T1071). Primary telemetry sources include Windows process creation logs, specifically looking for Event ID 4688 from Security or Sysmon Event ID 1. If executed maliciously, this activity poses a severe risk of data compromise and external communication with malicious endpoints.

  However, this detection alone does not confirm whether the execution of `curl.exe` was malicious, as legitimate activities on internal systems could trigger this rule.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 for instances of `curl.exe` execution. Check the CommandLine field for `--proxy-insecure` or `--doh-insecure` flags.

  - **Identify user and system context:** Determine which user executed the command and on what system (asset criticality). Legitimate users could be developers or IT staff on less critical systems, but elevated privileges may be suspicious.

  - **Check for unusual network patterns:** Analyze network traffic logs (e.g., via a proxy or firewall) for connections initiated from the affected host to known malicious domains or IPs. Anomalies, such as connections to unexpected external servers over port 443, may indicate malicious intent.

  - **Correlate with prior alerts:** Cross-reference the detected `curl.exe` execution with existing alerts within the SIEM. Look for prior suspicious behavior or known indicators of compromise that may correlate with the execution of the command.

  - **Explore legitimate use cases:** Investigate the possibility of benign use of `curl.exe`. Check for historical usage patterns on the host, confirming if users or processes repeatedly run `curl.exe` for legitimate purposes like API access or testing.

  - **Search for additional indicators:** Look for signs of file creation or data exfiltration through logs indicating unusual outbound traffic patterns or the transfer of sensitive files immediately following the `curl` command execution.

  ---

  ### Prioritization

  The alert is categorized with medium severity, given that execution of unsecured connections using `curl.exe` can expose sensitive data and facilitate unauthorized actions if misused. The likelihood of malicious abuse is moderate due to the prevalence of this behavior among attackers, making it a potential vector for exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate traffic, such as testing APIs or configuration management, can trigger this alert. Organizations must ensure comprehensive logging and monitoring, especially with user permissions and application usage, to detect this behavior reliably. Regular access to poorly maintained internal systems or development environments may lead to false positives. Companion detections focusing on unusual outbound traffic or DNS queries would enhance overall defense against such behaviors.

