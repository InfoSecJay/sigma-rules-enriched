title: Insecure Proxy/DOH Transfer Via Curl.EXE
id: 2c1486f5-02e8-4f86-9099-b97f2da4ed77
status: test
description: Detects execution of "curl.exe" with the "insecure" flag over proxy or
  DOH.
references:
- https://curl.se/docs/manpage.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_cli:
    CommandLine|contains:
    - '--doh-insecure'
    - '--proxy-insecure'
  condition: all of selection_*
falsepositives:
- Access to badly maintained internal or development systems
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_insecure_proxy_or_doh/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of `curl.exe` with insecure transfer options related to proxy or DNS over HTTPS (DOH). The use of `curl.exe` with flags like `--doh-insecure` or `--proxy-insecure` can indicate malicious activity where an attacker aims to exfiltrate data through unsecured channels, bypassing network security measures. Attackers may use this technique to avoid detection by traditional security systems that do not inspect encrypted traffic.

  The relevant MITRE ATT&CK tactics include **Execution (T1203)**, as the rule detects the execution of a specific tool, and potentially **Exfiltration (T1041)**, as the insecure transfer options could facilitate the transmission of sensitive data to an external entity. The primary data sources for this detection include process creation events, which capture executable launches, along with command-line parameters that provide context about how the tool is being executed.

  ### Investigation Steps
  - **Review Process Creation Events**: Gather detailed process creation logs to identify occurrences of `curl.exe` along with the specific command-line arguments. Focus on instances where `--doh-insecure` or `--proxy-insecure` are present.
  - **Analyze Network Traffic**: Investigate outbound network traffic during the time `curl.exe` was executed. Look for connections to unfamiliar external IP addresses or unexpected domains.
  - **Examine User Context**: Determine what user account executed the command. Cross-reference this with user behavior profiles to assess if the action aligns with the user’s normal activities.
  - **Check for Anomalous Scheduling**: Investigate scheduled tasks or automated processes that might trigger the use of `curl.exe` inappropriately, especially during odd hours or under unusual conditions.

  ### Prioritization
  The medium severity of this alert is justified given that the use of `curl.exe` with insecure flags poses a potential risk of data exfiltration or malicious communication. Such behaviors are often signifiers of a larger compromise, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  This detection may not cover legitimate uses of `curl.exe` for internal development tasks, especially in poorly maintained environments. The detection logic assumes that the evaluated process is not part of routine administrative tasks or scripted efforts that are authorized within the enterprise. Additionally, for accurate detection, it is essential that logging for process creation and command-line arguments is enabled and properly configured on endpoints.

