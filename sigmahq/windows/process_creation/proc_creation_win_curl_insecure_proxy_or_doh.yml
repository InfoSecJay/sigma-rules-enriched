title: Insecure Proxy/DOH Transfer Via Curl.EXE
id: 2c1486f5-02e8-4f86-9099-b97f2da4ed77
status: test
description: Detects execution of "curl.exe" with the "insecure" flag over proxy
  or DOH.
references:
- https://curl.se/docs/manpage.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_cli:
    CommandLine|contains:
    - '--doh-insecure'
    - '--proxy-insecure'
  condition: all of selection_*
falsepositives:
- Access to badly maintained internal or development systems
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_insecure_proxy_or_doh/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `curl.exe` with the flags `--proxy-insecure` or `--doh-insecure`. Such behavior usually indicates an attempt to make insecure network requests, potentially bypassing standard security controls, which can enable adversaries to exfiltrate data or communicate with command-and-control servers in an undetected manner. The likely attacker objective is to establish a covert channel for data transmission or to send commands to compromised systems with reduced scrutiny.

  This behavior maps to the MITRE ATT&CK tactic of **Execution** (TA0002), specifically the technique **Command-Line Interface** (T1059). The primary telemetry source for detection is the Windows process creation logs, specifically focusing on log types such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity could indicate an active compromise, leading to data leakage or system takeover. However, it is important to clarify that this detection does NOT confirm the presence of malicious activity on its own; legitimate administrative tasks or development activities might also invoke `curl.exe` with similar flags.

  ### Investigation Steps

  - **Review the Command Line Arguments:** Check the full command line arguments for instances of `curl.exe` (Security Event ID 4688). Look specifically for the presence of `--proxy-insecure` or `--doh-insecure` flags. A legitimate use of `curl` might typically include secure flags or valid target URLs instead.

  - **Correlate with Historical Baselines:** Compare the detected command against baseline usage patterns for `curl.exe` on the impacted host. Utilize Sysmon Event ID 1 data to determine if this execution frequency is abnormal based on previous activity.

  - **Examine Parent Process Information:** Investigate the parent process of the detected `curl.exe` execution to identify the context of the command (Sysmon Event ID 1, `ParentImage` field). A legitimate execution will often be initiated by known administrative tools or commonly used scripts.

  - **Look for Sudden Network Traffic Changes:** Monitor network logs (firewall, proxy, IDS) for unusual outbound connections from the affected host following the `curl.exe` execution. Specifically, check for connections to unfamiliar IP addresses or domains, particularly over HTTP/HTTPS.

  - **Identify File Transfers or Downloads:** If `curl` is used to transfer data, validate log artifacts for file creation events on the host (Windows Event ID 4663). Check for any unexpected file creations or modifications that align with the timing of the detected command.

  - **Assess Asset Criticality:** Note the role of the host where `curl.exe` executed. If it is a high-value target or server, prioritize further investigation. Conversely, if it is a non-critical development machine, consider the context of the usage before escalating.

  ### Prioritization

  The alert has medium severity due to the potential impact on sensitive systems and data depending on the execution context of `curl.exe`. The likelihood of malicious abuse exists, especially within environments that value strict security postures. While this behavior may not be widely weaponized, it does represent a deviation from normal operational practices that warrants immediate scrutiny.

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of specific logging configurations for command line arguments or process creation events. Adversaries may employ obfuscation techniques to mask `curl` usage, such as renaming the executable or using alternative tools. Legitimate activities may trigger the alert, particularly in development environments where insecure configurations are common. A related detection that enhances coverage is monitoring for unusual outbound HTTP/S connections that don't align with organizational policy, providing additional context to the `curl.exe` execution.

