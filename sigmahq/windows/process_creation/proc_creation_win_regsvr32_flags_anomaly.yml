title: Potential Regsvr32 Commandline Flag Anomaly
id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
status: test
description: Detects a potential command line flag anomaly related to "regsvr32"
  in which the "/i" flag is used without the "/n" which should be uncommon.
references:
- https://twitter.com/sbousseaden/status/1282441816986484737?s=12
author: Florian Roth (Nextron Systems)
date: 2019-07-13
modified: 2024-03-13
tags:
- attack.stealth
- attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains|windash: ' -i:'
  filter_main_flag:
    CommandLine|contains|windash: ' -n '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrator typo might cause some false positives
level: medium
note: |
  ### Technical Context

  This rule detects the use of `regsvr32.exe` with the `/i` command-line flag when the `/n` flag is not included. This behavior is atypical in legitimate contexts, potentially indicating an attempt to register a DLL without the normal procedural protections in place, which can be exploited by attackers for malicious payload execution. The likely attacker objective is to execute or load a deceptive or malicious DLL, often as part of a larger attack strategy focused on maintaining persistence or evading detection.

  This corresponds to the MITRE ATT&CK technique `T1218.010: Signed Binary Proxy Execution: mshta.exe`, and falls under the tactic of Defense Evasion. Primary telemetry sources include Windows process creation logs (Event ID 4688) from the Security log and Sysmon logs (Event ID 1). If malicious, this could lead to unauthorized code execution and compromise of the system. However, this detection alone does not confirm that the command execution is malicious; legitimate administrative actions may also produce similar command lines.

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Security Event ID 4688 logs for process creation related to `regsvr32.exe`, focusing on the CommandLine field. Look for instances where the `/i` flag is present without `/n`. Legitimate usage typically includes both flags, with administrative users executing the full command.

  - **Analyze Sysmon Logs**: Inspect Sysmon Event ID 1 for the same process and command line. Validate additional field data such as `User`, `ParentProcessId`, and `CommandLine` for context around execution.

  - **Cross-reference User Activity**: Investigate the user account that executed the command. Check for normal user behavior patterns in your logs, focusing on anomalous accounts or accounts that rarely run `regsvr32.exe`.

  - **Identify Known Malicious Signals**: Look for known malicious indicators associated with this command—any command line including a suspicious DLL path or arguments that deviate from expected behaviors (e.g., unusual locations in the file system).

  - **Examine Execution Context**: Assess the environment for the execution of `regsvr32.exe`. Check if it was run in a context consistent with benign administrative tasks—such as during scheduled maintenance or updates by system administrators—versus in a potentially exploitative context, like during off-hours.

  ### Prioritization

  This alert should be prioritized as medium severity. While exploitation via `regsvr32.exe` is not the most common attack vector, the impact of a successful misconfiguration or exploitation could lead to significant system compromise. The likelihood of malicious abuse is moderate, especially in environments where attacker tactics are increasingly sophisticated and stealthy.

  ### Blind Spots and Assumptions

  This detection is limited if the logs are not correctly configured to capture all command line arguments or if `regsvr32.exe` is frequently used in legitimate administrative contexts. Legitimate activities, such as specific scripts or software installations by administrators, may trigger this alert. Additionally, the absence of `/n` is not foolproof; other variations may still evade detection. Companion detections to consider include monitoring for unusual execution of `mshta.exe` or `powershell.exe`, as they could indicate broader malicious activity.

