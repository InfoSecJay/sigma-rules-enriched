title: Potential Regsvr32 Commandline Flag Anomaly
id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
status: test
description: Detects a potential command line flag anomaly related to "regsvr32"
  in which the "/i" flag is used without the "/n" which should be uncommon.
references:
- https://twitter.com/sbousseaden/status/1282441816986484737?s=12
author: Florian Roth (Nextron Systems)
date: 2019-07-13
modified: 2024-03-13
tags:
- attack.defense-evasion
- attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains|windash: ' -i:'
  filter_main_flag:
    CommandLine|contains|windash: ' -n '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrator typo might cause some false positives
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `regsvr32.exe` with the `/i` command line flag used without the `/n` flag, which is uncommon in standard usage. An attacker may use this command to register COM objects or DLLs as a part of a persistence or lateral movement strategy. The relevant MITRE ATT&CK technique is **Masquerading (T1036)**, specifically the sub-technique **Regsvr32 (T1218.010)**. The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it could result in the execution of unauthorized or malicious code on the system. However, this detection does not confirm the intent of the command; legitimate administrators may also use this command in specific cases.

  ### Investigation Steps

  - **Check the command line used:** Review the command line for `regsvr32.exe` captured in Security Event ID 4688. Look for the presence of the `/i` flag without `/n`. Legitimate commands typically include `/n` if `/i` is present, such as `regsvr32.exe /i /n [path_to_dll]`.

  - **Review process parentage:** Analyze the parent process of `regsvr32.exe` using Sysmon Event ID 1. Legitimate instances (like from `powershell.exe` or `cmd.exe` executed by system administrators) may indicate benign activity, while suspicious parent processes (e.g., `wscript.exe` or unknown executables) could signal malicious intent.

  - **Correlate with the file creation logs:** For any associated DLL files being registered, check filesystem activity using Sysmon Event IDs 11 (FileCreate) and 10 (FileCreateStreamHash). Confirm the file integrity (signature verification) and legitimacy. Suspicious DLL names or paths (e.g., those in temp folders) are strong indicators of compromise.

  - **Evaluate system role and recent changes:** Consider the asset's role, especially if it's a critical system. Verify recent administrative changes using event logs (Windows Event ID 4672 for privileges) to see if an administrator intentionally executed the command due to recent maintenance or vulnerability remediation.

  - **Look for lateral movement attempts:** Use Event ID 4672 or Windows Event Forwarding to track for remote access attempts leading to the execution of `regsvr32.exe`. Anomalous or repeated registrations from a remote session not correlating with known IT activity should be flagged as potentially malicious.

  ### Prioritization

  This alert is of medium severity in an enterprise context. The execution of `regsvr32.exe` with atypical flags can indicate attempts to perform unauthorized file registrations, especially if executed on critical systems. While this behavior can be weaponized, it may also occur during legitimate administrative tasks.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers disguise malicious payloads through legitimate command usage, as the `/i` flag alone does not guarantee malicious intent, nor does it highlight what the targets of registration are. Reliable detection requires comprehensive process creation logs with complete command line arguments. Additionally, administrators' legitimate usages may also trigger this alert, especially during software updates or system maintenance. A related detection is monitoring for abnormal command line parameters associated with other common Windows binaries (like `powershell.exe` or `cmd.exe`) to strengthen coverage against similar abuse techniques.

