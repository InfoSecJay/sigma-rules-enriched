title: Potential Regsvr32 Commandline Flag Anomaly
id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
status: test
description: Detects a potential command line flag anomaly related to "regsvr32" in
  which the "/i" flag is used without the "/n" which should be uncommon.
references:
- https://twitter.com/sbousseaden/status/1282441816986484737?s=12
author: Florian Roth (Nextron Systems)
date: 2019-07-13
modified: 2024-03-13
tags:
- attack.defense-evasion
- attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains|windash: ' -i:'
  filter_main_flag:
    CommandLine|contains|windash: ' -n '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrator typo might cause some false positives
level: medium
note: |
  ### Technical Context
  This rule detects anomalous usage of the `regsvr32.exe` utility, particularly when the `/i` command-line flag is employed without the accompanying `/n` flag. The typical usage of `regsvr32` involves registering DLLs, and malicious actors might abuse this application to bypass security mechanisms, execute unapproved code, or establish persistence. By analyzing its command line arguments, security teams can identify irregular patterns that could signify an attempt to evade defenses through code execution tactics.

  The likely attacker objectives in this scenario are centered around achieving persistence or executing malicious payloads within a targeted environment, often leveraging native tools to blend in and avoid detection. This behavior aligns with the Defense Evasion tactic (MITRE ATT&CK ID: T1218.010) where attackers might employ system utilities to run malicious code or scripts in a stealthy manner.

  The primary data source for this detection includes process creation logs, which record the execution of applications and their command-line arguments. By monitoring these logs, SOC analysts can identify suspicious command-line flags and investigate further into unusual process behaviors that may indicate compromise.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for instances of `regsvr32.exe` with command-line parameters that include `/i` and do not mention `/n`. Pay attention to the executed parent processes and the timestamps for synchronization with suspicious activities.

  - **Analyze Associated Network Connections:** Investigate any outbound network connections initiated by the parent process of `regsvr32.exe`. Confirm whether any unusual external interactions occurred coinciding with the execution of these command-line flags.

  - **Check for Related Event Logs:** Collect and review Windows Event Logs, particularly focusing on security logs and application logs that could provide insights into recent administrative actions or attempts to register DLL resources unexpectedly.

  - **Identify System Changes:** Evaluate changes in registered COM objects or system libraries shortly after the execution of `regsvr32.exe`. Cross-reference these with known good configurations to identify anomalies that could suggest exploitation attempts.

  ### Prioritization
  This alert is considered medium severity, as the use of `regsvr32` with this command-line anomaly could indicate an attempt to execute potentially malicious code. The likelihood of this being a legitimate administrative action is low, especially if it deviates from established usage patterns within the enterprise.

  ### Blind Spots and Assumptions
  One primary blind spot in this detection is the potential for legitimate administrative actions that may cause false positives, particularly typos in command-line execution. Additionally, the detection logic assumes that the standard conventions for using `regsvr32` are followed by administrators, which may not always hold true in practice. For this alert to function effectively, comprehensive process creation logs must be enabled and monitored accurately to capture the requisite command-line details.

