note: |
  ### Technical Context
  This detection rule identifies the execution of PCHunter, a tool often used by attackers to manipulate processes and perform kernel operations on Windows systems. PCHunter serves as an advanced process viewer and manipulator, similar to Process Hacker, and can be used to evade detection by modifying or terminating security processes. Attackers utilizing PCHunter may aim to gain persistence, elevate privileges, or exfiltrate sensitive data by manipulating system processes and resources.

  In terms of MITRE ATT&CK, this detection is particularly relevant to the following tactics and techniques: **Execution (T1203)**, as it detects the running of a potentially suspicious program; **Discovery (T1082)**, which includes information gathering on system processes; and **Privilege Escalation (T1068)**, since manipulating processes may lead to unauthorized system access. The primary data source for this detection is process creation logs, which capture details about executables launched on Windows environments, indicating potentially malicious behavior tied to the execution of PCHunter.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `PCHunter64.exe` and `PCHunter32.exe` being executed to confirm suspicious activity and correlate timestamps with user actions.
  - **Correlate with User Activity**: Examine user behavior around the time of execution to determine if the user context suggests legitimate usage or potential compromise (e.g., unusual login times or access patterns).
  - **Analyze System Configurations**: Investigate system configurations for signs of process manipulation or changes in kernel settings that may suggest misuse of tools like PCHunter.
  - **Check for C2 Communication**: Utilize network telemetry to determine if there’s any outbound connection from the machine running PCHunter that may indicate command and control (C2) activity related to the tool's use.

  ### Prioritization
  Alerts regarding the execution of PCHunter should be regarded with high priority in an enterprise environment due to the tool's capabilities to manipulate core system processes, which can facilitate further malicious actions including data exfiltration and persistence.

  ### Blind Spots and Assumptions
  Detection may be limited if the logs for process creation are not enabled or are improperly configured. The detection logic assumes that PCHunter will be executed in a recognizable manner; however, sophisticated attackers may obfuscate the tool's execution or use alternate naming conventions. Furthermore, if endpoint security solutions are configured to block or remove such tools preemptively, this rule may not detect all instances of its usage.

