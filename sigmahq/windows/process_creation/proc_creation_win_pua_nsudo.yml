detection:
  selection_img:
  - Image|endswith:
    - '\NSudo.exe'
    - '\NSudoLC.exe'
    - '\NSudoLG.exe'
  - OriginalFileName:
    - 'NSudo.exe'
    - 'NSudoLC.exe'
    - 'NSudoLG.exe'
  selection_cli:
    CommandLine|contains:
            # Covers Single/Double dash "-"/"--" + ":"
    - '-U:S '         # System
    - '-U:T '         # Trusted Installer
    - '-U:E '         # Elevated
    - '-P:E '         # Enable All Privileges
    - '-M:S '         # System Integrity
    - '-M:H '         # High Integrity
            # Covers Single/Double dash "-"/"--" + "="
    - '-U=S '
    - '-U=T '
    - '-U=E '
    - '-P=E '
    - '-M=S '
    - '-M=H '
    - '-ShowWindowMode:Hide'
  condition: all of selection_*
falsepositives:
- Legitimate use by administrators
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the NSudo tool, which is often used to escalate privileges in Windows environments. Attackers may utilize NSudo to execute commands with elevated permissions, achieving control over the system or executing malicious code under the Local System or Trusted Installer accounts, bypassing standard security controls. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Privileged Service Provider (T1569.002).

  The primary telemetry sources are Windows process creation logs, specifically monitoring Event ID 4688. Malicious use of NSudo can allow adversaries to alter system configurations, tamper with sensitive data, or deploy additional malware. It is essential to note that this detection does NOT confirm malicious intent on its own; legitimate administrative use of NSudo is common in enterprise environments.

  ### Investigation Steps

  - **Validate the command-line arguments used:** Check the CommandLine field in Event ID 4688 for the presence of `-U:S`, `-U:T`, `-P:E`, or similar flags indicative of privilege escalation. Legitimate uses typically involve administrative tasks without the specific parameters targeted by this detection.

  - **Correlate the timing of the execution:** Compare the timestamps of NSudo execution against other logged activities. Look for unusual execution patterns that may suggest malicious behavior, such as engagement with sensitive files or processes in rapid succession.

  - **Monitor parent-child process relationships:** Analyze Event ID 4688 for parent process IDs. If NSudo was spawned from a suspicious or unexpected parent process (e.g., uncommon scripts or non-admin applications), it could indicate malicious intent.

  - **Identify system impact and asset criticality:** Determine the importance of the affected system within the enterprise. Compromise of a critical server could escalate the risk significantly, warranting urgent response measures.

  - **Check for file modification or creation activity:** If NSudo execution is detected, confirm any associated file creation, modification, or deletion events (e.g., through Event ID 4663) that may suggest post-exploitation activity, such as deploying payloads or altering configurations.

  ### Prioritization

  This alert is high priority due to the potential impact of the system being targeted and the likelihood of malicious exploitation of privilege escalation tools like NSudo, which are often weaponized in attacks. Given that this tool can operate unnoticed by average users, timely investigation is crucial to preventing further actions taken by a possible adversary.

  ### Blind Spots and Assumptions

  There are possible evasion techniques, including using process hollowing or DLL injection methods post-NSudo execution to remain undetected. Reliable detection requires properly configured Windows event logging to capture all relevant process creation events. Legitimate administrative use may occasionally trigger this alert, such as routine system maintenance. Companion detections could include monitoring for unusual access patterns to sensitive system files or registry keys that NSudo is likely to manipulate.

