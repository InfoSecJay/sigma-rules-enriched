logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\NSudo.exe'
    - '\NSudoLC.exe'
    - '\NSudoLG.exe'
  - OriginalFileName:
    - 'NSudo.exe'
    - 'NSudoLC.exe'
    - 'NSudoLG.exe'
  selection_cli:
    CommandLine|contains:
            # Covers Single/Double dash "-"/"--" + ":"
    - '-U:S '         # System
    - '-U:T '         # Trusted Installer
    - '-U:E '         # Elevated
    - '-P:E '         # Enable All Privileges
    - '-M:S '         # System Integrity
    - '-M:H '         # High Integrity
            # Covers Single/Double dash "-"/"--" + "="
    - '-U=S '
    - '-U=T '
    - '-U=E '
    - '-P=E '
    - '-M=S '
    - '-M=H '
    - '-ShowWindowMode:Hide'
  condition: all of selection_*
falsepositives:
- Legitimate use by administrators
level: high
note: |
  ### Technical Context
  The detection rule identifies the use of NSudo, a tool designed to run applications with the highest privileges on Windows systems, including local system accounts. This behavior can be indicative of malicious activity where attackers attempt to execute commands or applications with elevated privileges to bypass security controls or perform unauthorized actions. The primary threat actors leveraging such tools may aim to escalate privileges, install malware, or maintain persistence within the environment.

  NSudo's capabilities align with the MITRE ATT&CK tactics of **Execution** (TA0002) and specifically relates to the technique **Command and Scripting Interpreter: Windows Command Shell (T1059.003)**, as well as **User Execution (T1204.002)**, which involves running code through legitimate user action. Data sources relevant to monitoring NSudo activity include Windows process creation logs, command line arguments, and application execution logs that capture detailed information about processes invoked with high integrity levels.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine Windows process creation logs for instances of `NSudo.exe`, `NSudoLC.exe`, or `NSudoLG.exe`. Look for unusual execution patterns indicative of unauthorized privilege escalation attempts.
  - **Analyze Command Line Parameters:** Check the command line arguments associated with the execution of NSudo. Specifically, focus on parameters such as `-U:S`, `-P:E`, or `-M:H` to determine if malicious intent is present in the way NSudo is utilized.
  - **Monitor System Integrity Checks:** Investigate any high integrity operations initiated by NSudo. This includes validating continual attempts to escalate privileges or launch applications that normally require elevated permissions.
  - **Correlate with User Activity:** Cross-reference the detected NSudo executions with user activity logs to determine whether the users involved possess legitimate administrative privileges and whether such elevated access is within standard operating procedures.

  ### Prioritization
  This alert is categorized as high severity due to the significant impact potential of privilege escalation via NSudo, which can lead to unauthorized access and control over critical systems. Given that this tool can be used for both legitimate administrative purposes and in malicious contexts, further investigation is essential to determine the intent behind its utilization.

  ### Blind Spots and Assumptions
  The detection may not capture instances where NSudo is deployed via alternative methods, such as scripted automation or part of a more complex attack chain that obscures its usage. Assumptions made include that no legitimate administrative tasks warrant the use of NSudo without additional verification. For this alert to function correctly, it is crucial to ensure logging for process creation events and command line arguments is active across the monitored windows environment.

