logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  filter_health_service:
    CurrentDirectory|contains: '\Health Service State\'
  condition: selection and not 1 of filter_*
falsepositives:
- Microsoft Operations Manager (MOM)
- Other scripts
level: medium
note: |
  ### Technical Context

  This rule detects suspicious PowerShell invocations triggered by script engines, specifically from `wscript.exe` or `cscript.exe`. Attackers may leverage this technique to execute malicious PowerShell commands, often as part of credential theft, lateral movement, or reconnaissance activities. This behavior aligns with the MITRE ATT&CK technique **T1059.001** (Command and Scripting Interpreter: PowerShell).

  The primary telemetry sources for this detection include Windows process creation logs, specifically **Security Event ID 4688** (Process Creation) and **Sysmon Event ID 1** (Process Creation). If the behavior is malicious, it may lead to unauthorized access or system compromise. However, this detection does NOT confirm that the PowerShell invocation is malicious on its own; further context is required.

  ### Investigation Steps

  - **Check the process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for the `wscript.exe` and `cscript.exe` events. Look for the `Image` field to confirm the invocation of `powershell.exe` or `pwsh.exe`.

  - **Analyze the command-line arguments**: Verify the command-line arguments captured in the logs. Malicious invocations may involve encoded commands or unusual flags (e.g., `-ExecutionPolicy Bypass`). Legitimate instances may contain standard script references.

  - **Identify the parent process**: Investigate the parent process of the suspicious invocation. Legitimate uses of PowerShell often originate from trusted applications or administrative tools. Suspicious invocations appearing from untrusted applications may indicate a breach.

  - **Monitor the current directory**: Check the `CurrentDirectory` field in the logs. Legitimate PowerShell scripts typically execute from known scripting directories. An unusual path, especially within user profile directories or temporary folders, could signify malicious activity.

  - **Correlate with other alerts**: Look for correlations with other security alerts, especially those related to lateral movement or credential dumping. Other detections, like abnormal network activity following this PowerShell execution, may indicate a complete attack lifecycle.

  - **Review potential false positives**: Consider benign cases, particularly from Microsoft Operations Manager (MOM) or routine administrative tasks involving scripting. Contextualize each alert in relation to known good behavior for the environment.

  ### Prioritization

  This alert has medium severity due to the potential impact on affected systems and the likelihood of exploitation by attackers leveraging PowerShell for various malicious activities. While PowerShell is a common tool for legitimate administrative tasks, its misuse is frequently observed in actual security incidents.

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of legitimate PowerShell usage, which can lead to false positives. It assumes comprehensive logging is enabled for process creation events, including Sysmon configuration. Additionally, legitimate automation scripts often trigger this alert, requiring further investigation to discern malicious intent. A companion detection could include monitoring for unusual outbound network connections following a PowerShell invocation to strengthen incident response capabilities.

