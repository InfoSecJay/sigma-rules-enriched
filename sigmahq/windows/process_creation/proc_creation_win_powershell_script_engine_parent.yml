  ---

  ### Technical Context

  This Sigma rule detects suspicious PowerShell invocations originating from script engines such as `wscript.exe` and `cscript.exe`. Attackers often leverage such techniques to execute PowerShell commands or scripts indirectly, which can obfuscate their activities and bypass standard security measures. The likely attacker objective is to run malicious scripts or commands to gain unauthorized access, execute code, or exfiltrate data.

  This detection is associated with the MITRE ATT&CK tactic **Execution** and technique **PowerShell (T1059.001)**. The primary telemetry source is Windows process creation logs, specifically monitoring Event ID 4688 and potentially Sysmon Event ID 1, which captures detailed process creation activities. If malicious, such behavior can lead to system compromise or data loss. It is important to note that this detection does NOT confirm malicious intent by itself; it only indicates unusual PowerShell execution patterns requiring further investigation.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs:** Check Windows Security Event ID 4688 for any PowerShell commands executed with parent processes like `wscript.exe` or `cscript.exe`. Investigate the `CommandLine` parameter for potentially malicious arguments.

  - **Examine File Paths:** Look for the `Image` field to ensure the PowerShell executable is being invoked from standard locations, such as `C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe`. Execution from unrecognized directories may indicate malicious behavior.

  - **Analyze CurrentDirectoris:** Assess the `CurrentDirectory` field in the logs. Legitimate activities may involve standard operational directories, while an unusual path (e.g., `Health Service State`) could signal an attempt to mask malicious intent.

  - **Identify PowerShell Commands:** Scrutinize the commands executed by PowerShell. Commands attempting to download additional payloads or communicate with suspicious external servers should be flagged as malicious indicators.

  - **Cross-Reference with Other Logs:** Correlate findings with Sysmon Event ID 1 for more granular process creation details. This will give context to the PowerShell invocation and help confirm if it's part of a larger, coordinated attack.

  - **Evaluate Environment Context:** Determine the host role and its criticality in the infrastructure. If the system runs security operations or stores sensitive data, escalated measures should be taken immediately.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized script execution that may lead to a system compromise. The likelihood of malicious abuse is elevated because attackers commonly use PowerShell for post-exploitation activities. Given its frequent use in sophisticated attacks, it is essential to address this incident promptly.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include scripting obfuscation and the use of legitimate tools for malicious purposes, which could suppress detection. Reliable detection also relies on proper configurations to log all necessary process creation events, notably ensuring that Sysmon is deployed in the environment. Legitimate activities, such as IT automation scripts or operational monitoring, may trigger alerts if they use PowerShell inappropriately. A related detection of interest is monitoring for unusual outbound network traffic from PowerShell commands, as it can provide further context on data exfiltration attempts.

