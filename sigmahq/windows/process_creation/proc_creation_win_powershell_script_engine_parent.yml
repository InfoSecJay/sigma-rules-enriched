title: Suspicious PowerShell Invocation From Script Engines
id: 95eadcb2-92e4-4ed1-9031-92547773a6db
status: test
description: Detects suspicious powershell invocations from interpreters or unusual
  programs
references:
- https://www.securitynewspaper.com/2017/03/20/attackers-leverage-excel-powershell-dns-latest-non-malware-attack/
author: Florian Roth (Nextron Systems)
date: 2019-01-16
modified: 2023-01-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  filter_health_service:
    CurrentDirectory|contains: '\Health Service State\'
  condition: selection and not 1 of filter_*
falsepositives:
- Microsoft Operations Manager (MOM)
- Other scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell invocations initiated from script engines, specifically `wscript.exe` and `cscript.exe`. Such activity often indicates that an attacker is leveraging these scripts to execute PowerShell commands, which can be used for various malicious purposes, including data exfiltration, lateral movement, or even executing non-malware attacks leveraging legitimate tools. The PowerShell scripting environment is popular among attackers due to its versatility and capability to interact with almost all aspects of the Windows operating system.

  The threat scenario typically involves an attacker aiming to execute scripts for executing commands, conducting reconnaissance, or moving laterally within a network. The goal could include establishing persistence, gathering sensitive information, or executing further stages of an attack. The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and the technique **Command and Scripting Interpreter: PowerShell** (T1059.001). These tactics illustrate how attackers exploit legitimate functionalities in operating systems to achieve their objectives.

  To identify and investigate such occurrences, primary data sources include process creation events from Windows logs, which will reveal the execution of processes and their parent-child relationships. This data is critical for understanding the context around how PowerShell is being invoked and by which parent process.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify instances of `powershell.exe` or `pwsh.exe` launched by `wscript.exe` or `cscript.exe`. Pay special attention to timestamps of the invocation for any correlation with other suspicious activity.

  - **Check the Current Directory:** Examine the `CurrentDirectory` field in the process creation logs. Look for unusual paths that may indicate malicious intentions, particularly if they involve directories such as `\Health Service State\` or any other non-standard locations.

  - **Assess PowerShell Script Content:** If the suspicious invocation involves script files, retrieve and inspect the contents of these scripts. Look for known malicious patterns, obfuscated commands, or execution of other processes that may indicate a broader attack vector being employed.

  - **Correlate with Network Activity:** Verify if there are any network connections made by the PowerShell process at the time of invocation, particularly any calls to external IPs or domains. Cross-reference these with threat intelligence to identify if they are associated with known threat actors.

  ### Prioritization
  The severity of this alert is medium due to its association with the potential misuse of powerful scripting tools, which could lead to significant security incidents if left unchecked. The likelihood of exploitation through this vector is moderately high given the prevalence of PowerShell in enterprise environments, warranting timely investigation.

  ### Blind Spots and Assumptions
  This detection rule assumes that logging for process creation is enabled and correctly configured in the Windows environment. A gap in coverage exists if attackers leverage other less common script engines or invoke PowerShell through methods not captured by this rule. Additionally, the detection logic may produce false positives from legitimate operational scripts or Microsoft Operations Manager (MOM) activities, which should also be considered during investigations.

