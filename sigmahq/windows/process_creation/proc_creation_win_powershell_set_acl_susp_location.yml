detection:
  selection_img:
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_cmdlet:
    CommandLine|contains|all:
    - 'Set-Acl '
    - '-AclObject '
  selection_paths:
        # Note: Add more suspicious paths
    CommandLine|contains:
    - '-Path "C:\Windows'
    - "-Path 'C:\\Windows"
    - '-Path %windir%'
    - '-Path $env:windir'
  selection_permissions:
        # Note: Add more suspicious permissions
    CommandLine|contains:
    - 'FullControl'
    - 'Allow'
  condition: all of selection_*
