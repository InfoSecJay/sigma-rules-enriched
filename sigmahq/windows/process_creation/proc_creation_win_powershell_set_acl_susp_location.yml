note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell commands to modify Access Control Lists (ACLs) on Windows system files, particularly within the `C:\Windows` directory. The behavior typically signifies an attacker’s attempt to manipulate permissions on critical system files to facilitate persistence, conceal malicious activities, or prevent legitimate access. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) and the technique is T1505.005 (Web Shell).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide insights into command lines and file paths used in the PowerShell executions. If executed maliciously, this action could compromise system integrity and enable further exploitation. It is important to note that this rule does NOT confirm malicious intent on its own, as legitimate administrative activities might execute similar commands.

  ### Investigation Steps

  - **Review command line arguments: ** Examine Event ID 4688 for the PowerShell command line where `Set-Acl` is used, especially for flags like `-Path "C:\Windows"` and `-AclObject`. Check if the ACL changes are legitimate modifications made by administrators.

  - **Correlate against known processes: ** Validate if the instance of PowerShell associated with the alert (Event ID 4688) was initiated by a legitimate process (e.g., local admin tools or automation scripts) or if it’s unusual for the host's role.

  - **Identify high-confidence malicious indicators: ** Look for the strings `FullControl` and `Allow` in command lines (Event ID 4688) indicating attempts to grant excessive permissions. Match with any unauthorized user accounts or anomalous behavior in user logs.

  - **Analyze account usage: ** Check user account activity in concurrent events or Active Directory logs for suspicious logins or actions from non-admin users. A legitimate administrator making this change should have appropriate context in logs.

  - **Examine elective timestamp: ** Look for timestamps of the detected events (Event ID 4688) to correlate with any other alerts or unusual activities occurring on the same host or across the network around that time.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on critical system file permissions, which could allow attackers to operate undetected. Since such permission changes are often leveraged in attacks to conceal activities, the likelihood of malicious intent is significant.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for certain PowerShell executions or the potential use of encoded commands to evade detection. Adequate logging configurations, including FIPS compliance settings in PowerShell, are necessary for reliable detection. Legitimate activities by trusted admin accounts might also invoke similar commands, particularly during maintenance tasks. A complementary detection to consider is monitoring for unusual user account behavior associated with automation that frequently involves ACL modifications.

