logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_cmdlet:
    CommandLine|contains|all:
    - 'Set-Acl '
    - '-AclObject '
  selection_paths:
        # Note: Add more suspicious paths
    CommandLine|contains:
    - '-Path "C:\Windows'
    - "-Path 'C:\\Windows"
    - '-Path %windir%'
    - '-Path $env:windir'
  selection_permissions:
        # Note: Add more suspicious permissions
    CommandLine|contains:
    - 'FullControl'
    - 'Allow'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets the use of PowerShell to modify file Access Control Lists (ACLs) in the Windows folder using the `Set-Acl` cmdlet. Attackers may utilize this method to manipulate permissions on system files or critical folders in an effort to conceal their tracks, escalate privileges, or establish persistence within the environment. By altering ACLs, an adversary can grant themselves or others unauthorized access or control over sensitive files or services.

  The relevant MITRE ATT&CK tactics for this activity include **Defense Evasion** (TA0005) and techniques such as **Modify Permissions** (T1505.005). These techniques are often employed by threat actors to maintain access and evade detection by altering the normal behavior of the file system, making it challenging for defenders to spot malicious activities. Primary data sources for detecting these actions include process creation events, which log the command-line arguments of executables like PowerShell, providing critical context for the analysis.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for entries that indicate the execution of `powershell.exe` or `pwsh.exe` with strange command line arguments, specifically those involving the `Set-Acl` cmdlet targeting the Windows directory.
  - **Inspect Command Line Arguments:** Focus on command-line inputs containing `-Path` and `-AclObject`, especially those with keywords like ‘FullControl’ or ‘Allow’, to identify unauthorized permission modifications.
  - **Analyze File Permission Changes:** If possible, cross-reference file permission changes in the Windows folder with the timestamps of the detected PowerShell execution to assess whether suspicious modifications occurred.
  - **Check Access Control Lists:** Validate the current ACLs of critical Windows files and directories against known good baselines to identify any unauthorized permissions that may have been set recently.

  ### Prioritization
  Given the critical nature of the Windows folder and the potential impact of an unauthorized privilege escalation, this alert is considered high severity. Such activities often precede further malicious actions, and timely response is essential to mitigate any ongoing threats.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of unauthorized ACL modifications, especially those executed via other tools or scripting languages beyond PowerShell. The logic assumes that the `Set-Acl` cmdlet will be used with recognizable patterns and commands, and relies on proper logging configurations for both PowerShell execution and file auditing. Ensuring that detailed process creation logging and file system auditing are enabled is crucial for the effective operation of this detection rule.

