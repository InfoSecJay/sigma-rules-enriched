detection:
  selection_img:
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_cmdlet:
    CommandLine|contains|all:
    - 'Set-Acl '
    - '-AclObject '
  selection_paths:
        # Note: Add more suspicious paths
    CommandLine|contains:
    - '-Path "C:\Windows'
    - "-Path 'C:\\Windows"
    - '-Path %windir%'
    - '-Path $env:windir'
  selection_permissions:
        # Note: Add more suspicious permissions
    CommandLine|contains:
    - 'FullControl'
    - 'Allow'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that modify access control lists (ACLs) on directories within the Windows folder, indicative of potential privilege escalation or unauthorized access configuration adjustments. An attacker could aim to gain persistent access or to obfuscate malicious activity by adjusting permissions on critical system folders. This behavior corresponds with the MITRE ATT&CK technique "Abuse Elevation Control Mechanism" (T1548.001) under the "Privilege Escalation" tactic.

  Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which records new process instances, as well as Sysmon Event ID 1 for detailed command-line execution. If malicious, this activity can lead to unauthorized data access, persistence mechanisms, or evasion of security controls. It’s important to note that the detection of this behavior does not confirm malicious intent on its own; legitimate administrative operations can trigger similar alerts.

  ### Investigation Steps

  - **Review process creation events:** Examine Windows Security Event ID 4688 and Sysmon Event ID 1 for any PowerShell process entries. Look for specific command lines containing 'Set-Acl', '-Path "C:\Windows"', and '-AclObject'.
  - **Check for unusual paths:** Validate that the command line references suspicious paths like 'C:\Windows' indicating potential malicious behavior, as legitimate administration rarely requires altering ACLs in this directory.
  - **Analyze permissions assigned:** Determine if the command includes permissions such as 'FullControl' or 'Allow', which may signify an attempt to grant elevated access that is atypical for standard users.
  - **Identify legitimate administrative activity:** Cross-reference command line timestamps with known scheduled maintenance tasks or IT change control records to gauge routine administrative actions that may resemble this behavior.
  - **Confirm command source:** Investigate the origin of the PowerShell execution, including any parent processes noted in Event ID 4688, to ascertain if it originates from a legitimate user context or potentially a compromised system.
  - **Check for related malicious indicators:** Look for other indicators of compromise (IoCs) nearby in the logs, such as outbound connections or file manipulations occurring around the same time frame, which may point to coordinated malicious activity.

  ### Prioritization

  This alert has high severity due to the potential impact on sensitive system files and folders. The risk of malicious abuse is elevated, particularly in environments with valuable data or where administrative privileges are abused. This technique is commonly weaponized for privilege escalation by adversaries seeking to maintain access levels beyond what they have authorized.

  ### Blind Spots and Assumptions

  Detection may be limited by administrative actions that perform similar ACL modifications legitimately. Settings for log collection must ensure that both Event ID 4688 and Sysmon data are enabled and properly configured to capture relevant activities. Additionally, common scheduled tasks or legitimate scripts may trigger this rule, and related detections such as process injection into system processes or suspicious script execution can improve overall security monitoring efficacy.

