level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of commands via the MeshAgent process, which may indicate misuse by threat actors who leverage this remote access tool to execute unauthorized commands on compromised systems. The primary objective of the attacker is often to maintain control over a target host, exfiltrate data, or perform lateral movement within the environment. The relevant MITRE ATT&CK tactic is Command and Control, specifically technique T1219.002 (Remote Access Software).

  The primary telemetry source for this detection is Windows process creation logs, particularly Event ID 4688, which captures process creation activity. If malicious, this behavior could allow an attacker to execute harmful commands unnoticed, potentially compromising the integrity of the host and any associated data. It is important to note that detection of this activity alone does not confirm malicious intent; legitimate use of MeshAgent may trigger similar alerts.

  ### Investigation Steps

  - **Review parent process evidence: ** Investigate Event ID 4688 for process creation logs where the Image field equals `meshagent.exe`. Confirm that commands executed by child processes originate from this legitimate remote access tool.

  - **Check command execution details: ** Examine the command line parameters of child processes (e.g., Command Prompt or PowerShell) for known adversarial command patterns or suspicious script execution. Focus on the fields `CommandLine` and `ParentImage`.

  - **Identify benign usage patterns: ** Assess if MeshAgent is being used legitimately in the environment, including active management sessions. Check for regular administrative activity linked to authorized personnel to distinguish expected behavior from illicit actions.

  - **Correlate with additional logs: ** Review Security Event ID 4672 (Special Privileges Assigned to New Logon) to identify any elevated privileges associated with the command executions. This may indicate an attacker using administrative rights to perform further malicious actions.

  - **Examine process relationships: ** Utilize Sysmon Event ID 1 for detailed parent-child process relationships. Pay attention to unusual chains of execution particularly from `meshagent.exe` to potentially harmful child processes that do not align with legitimate use cases.

  - **Assess the impact on critical assets: ** Determine if the affected host has a high confidence level in critical asset categorization, which could escalate the need for immediate remediation based on the actions being taken on that system.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems controlled by a remote access tool. Although MeshAgent may be used legitimately, the likelihood of adversaries abusing such tools for malicious purposes is notable, making it essential to prioritize further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging for process creation is not enabled or misconfigured. Adversaries might obscure their actions by using legitimate remote management software like MeshAgent. Moreover, benign activities might include regular administrative use of MeshAgent features, which could trigger the alert. A related detection to strengthen coverage would involve alerts for unusual outbound traffic behavior linked to the execution of commands via MeshAgent, indicating potential data exfiltration.

