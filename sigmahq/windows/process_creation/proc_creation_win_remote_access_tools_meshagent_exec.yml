level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying command execution on a target host via the MeshAgent, a remote access tool often misused by threat actors. The detection looks for scenarios where commands are executed using standard shell processes like `cmd.exe`, `powershell.exe`, or `pwsh.exe`, with `meshagent.exe` as the parent process. The potential objectives of attackers include maintaining control over compromised systems, executing commands to further their campaign, or deploying additional malicious payloads without detection.

  Relevant MITRE ATT&CK tactics for this detection include **Command and Control** (TA0011) and **Remote Services** (T1219). The specific technique being detected is **Remote System Access** (T1219.002), which details how adversaries may utilize remote tools to execute commands. The primary data source for this detection is **process creation events** from Windows systems, which provide insights into which processes are initiated and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs for instances where `cmd.exe`, `powershell.exe`, or `pwsh.exe` are launched as child processes of `meshagent.exe`. Look for unusual or unauthorized command execution patterns.
  - **Analyze Parent-Child Relationships**: Examine the relationships between `meshagent.exe` and any spawned processes. Pay attention to any interactive commands run within normal operational contexts that could indicate misuse.
  - **Correlate with Remote Access Documentation**: Check for any legitimate use cases of MeshAgent within your organization. Validate whether the detected execution aligns with authorized remote management activities.
  - **Inspect Network Traffic**: If possible, look for network communication patterns associated with MeshAgent to identify any anomalous outbound connections or command and control traffic related to the suspect activity.

  ### Prioritization
  This alert should be considered of medium priority, as detecting potential abuse of remote access tools like MeshAgent can indicate active compromise attempts. The severity stems from the likelihood of attackers leveraging these tools for lateral movement or persistence within the network.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on process creation logs, which may not capture all command executions if logging is insufficiently configured. Assumptions made include the uniform use of MeshAgent in operational contexts—false positives could occur in environments where MeshAgent is used legitimately. Comprehensive logging of process creation and parent-child relationships is required for this rule to function effectively.

