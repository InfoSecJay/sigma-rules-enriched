detection:
  selection:
    ParentImage|endswith: '\WmiPrvSe.exe'
  filter_logonid:
    LogonId:
    - '0x3e7'          # LUID 999 for SYSTEM
    - 'null'           # too many false positives
  filter_system_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_wmiprvse:
    Image|endswith: '\WmiPrvSE.exe'
  filter_werfault:
    Image|endswith: '\WerFault.exe'
  filter_null:    # some backends need the null value in a separate expression
    LogonId:
  condition: selection and not 1 of filter_*
falsepositives:
- False positives are expected (e.g. in environments where WinRM is used 
  legitimately)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where the WmiPrvSE.exe process creates another process, which is often indicative of potentially malicious activity. Attackers may abuse WMI (Windows Management Instrumentation) to execute commands remotely, modify system configurations, or deploy malware. The relevant MITRE ATT&CK technique is T1047: Windows Management Instrumentation Triage, distinguishing exploitation of WMI as a method for remote access and command execution.

  The primary telemetry source is process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If the alert is legitimate, it may indicate operational administrative tasks; however, if malicious, it could facilitate unauthorized access or malware execution. This detection does NOT confirm the presence of a compromise on its own; further investigation is necessary to ascertain intent.

  ### Investigation Steps

  - **Identify the creating process:** Review Security Event ID 4688 or Sysmon Event ID 1 logs to confirm the parent process is WmiPrvSE.exe. Validate the created process details, including its command line, for any signs of unusual arguments or suspicious file paths.

  - **Check the Logon ID:** Ensure the Logon ID is '0x3e7' (SYSTEM) or 'null'; this combination can indicate expected legitimate usage. Any process creation originating from a different Logon ID may suggest suspicious activity.

  - **Correlate with Recent System Changes:** Examine any system or application updates performed around the alert timestamp. Look for legitimate administrative actions via WMI that align with the process creation activity.

  - **Inspect User Activity:** Analyze recent actions attributed to the user account corresponding to WmiPrvSE.exe execution to determine if they exhibit benign behaviors or if they are performing unusual activities indicative of compromise.

  - **Check for Known Malicious Indicators:** Investigate created processes for signatures of known malware or tools, such as unusual file hashes or references to common exploit frameworks. A process creation that frequently leverages non-standard applications is a strong indicator of malicious behavior.

  ### Prioritization

  This alert should be treated with medium severity due to the role of WMI in Windows management. While legitimate administrative tasks may trigger similar behavior, the likelihood of malicious exploitation is significant, making it a common attack vector used by adversaries for lateral movement and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where WMI is used legitimately, potentially resulting in false positives. Proper log collection configurations for process creation logs must be in place for effective monitoring. Legitimate software installations or administrative tools can occasionally trigger this alert. A related detection could involve monitoring for suspicious network connections initiated by newly created processes for stronger correlation with malicious activity.

