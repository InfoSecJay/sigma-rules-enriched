detection:
  selection:
    ParentImage|endswith: '\WmiPrvSe.exe'
  filter_logonid:
    LogonId:
    - '0x3e7'          # LUID 999 for SYSTEM
    - 'null'           # too many false positives
  filter_system_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_wmiprvse:
    Image|endswith: '\WmiPrvSE.exe'
  filter_werfault:
    Image|endswith: '\WerFault.exe'
  filter_null:    # some backends need the null value in a separate expression
    LogonId:
  condition: selection and not 1 of filter_*
falsepositives:
- False positives are expected (e.g. in environments where WinRM is used legitimately)
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the `WmiPrvSE.exe` process spawns another process, which can indicate suspicious activities, particularly related to remote service installation or execution of malicious code. Attackers often leverage Windows Management Instrumentation (WMI) to execute commands and scripts, sometimes to maintain persistence or to facilitate lateral movement within a network. The spawning of processes from `WmiPrvSE.exe` may also occur in conjunction with legitimate administrative tasks; however, a closer inspection of the context is essential.

  The likely objective of an attacker utilizing this technique is to exploit the WMI service to run malware or execute unauthorized commands. This is classified under the MITRE ATT&CK framework as `Remote Services` (T1047), where misuse of WMI can facilitate remote execution or manipulation of system resources without user knowledge. A key data source for detecting this activity involves process creation logs, which provide insights into parent-child process relationships on Windows systems.

  The primary evidence will come from process creation events logged by Windows, capturing details such as process IDs, command lines, and parent processes that can signal abnormal usage patterns of `WmiPrvSE.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for any instances where `WmiPrvSE.exe` is the parent process. Look for unexpected child processes spawned, as these might indicate potentially malicious actions.

  - **Analyze Command Line Arguments:** Focus on the command line arguments used with spawned processes. Malicious scripts often use specific or obfuscated arguments that differ from typical administrative tasks.

  - **Correlate with User Behavior:** Investigate the user context associated with the processes to determine if they belong to authorized administrators or general users. Unusual activity by SYSTEM accounts or automated scripts may warrant further scrutiny.

  - **Investigate WMI Event Logs:** Look into WMI event logs to identify patterns or scripts executed via WMI. Check for events related to process creations that are not aligned with standard administrative practices.

  ### Prioritization
  The alert is considered medium severity due to the dual nature of WMI usage—both legitimate administrative tasks and potential attacker exploitation. Its context-dependent nature means that while there is a risk, not every instance warrants immediate response.

  ### Blind Spots and Assumptions
  This detection logic may have gaps in environments where WMI is used legitimately, especially in automated administrative processes like system monitoring and maintenance. The assumption that all process generations from `WmiPrvSE.exe` are potentially malicious may lead to false positives, particularly in organizations utilizing extensive remote management tools. Required logs include comprehensive process creation events and WMI-specific events for accurate detection of suspicious activities related to `WmiPrvSE.exe`.

