    - 'RUNDLL32.exe'
    - 'schtasks.exe'
    - 'ScriptRunner.exe'
    - 'wmic.exe'
    - 'WorkFolders.exe'
    - 'wscript.exe'
  - Image|endswith:
    - '\AppVLP.exe'
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\certoc.exe'
    - '\certutil.exe'
    - '\cmd.exe'
    - '\cmstp.exe'
    - '\control.exe'
    - '\cscript.exe'
    - '\curl.exe'
    - '\forfiles.exe'
