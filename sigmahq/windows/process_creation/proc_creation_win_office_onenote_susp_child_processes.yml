  condition: selection_parent and 1 of selection_opt_* and not 1 of filter_*
falsepositives:
- File located in the AppData folder with trusted signature
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious child processes spawned by Microsoft OneNote, specifically when OneNote is the parent process. The presence of suspicious child processes can indicate an attempt to execute harmful embedded objects, such as scripts or executables bundled within a .one file. Attackers may use OneNote as a delivery mechanism for malicious content to evade traditional security defenses, leveraging the application's trusted status to execute payloads stealthily.

  The primary MITRE ATT&CK techniques relevant to this rule include:
  - **Phishing** (Initial Access, ID: T1566): This technique involves delivering malware via means such as email attachments or links, including those embedded in documents.
  - **Phishing: Malicious Links/Attachments** (ID: T1566.001): Specifically targets the delivery of malicious files, including OneNote files, that contain embedded exploits or scripts.

  The primary data sources for this detection rule are Windows process creation logs, which can include information about parent-child relationships among processes, command lines, and the execution paths of the processes involved. Other relevant telemetry includes detailed logging from the operating system and potentially EDR solutions that monitor for process anomalies.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the process creation logs for instances where OneNote (`onenote.exe`) is the parent process. Identify any suspicious child processes spawned from it, particularly those matching common scripting or executable patterns.

  - **Examine Command Line Arguments**: For any identified suspicious child processes, scrutinize the command line arguments for potentially malicious keywords or file extensions, such as `.hta`, `.js`, or `.bat`, which are commonly associated with embedded malicious content.

  - **Correlate with User Activity**: Check the user activity logs to determine if the execution aligns with normal user behavior. Look for unusual activity patterns, such as executing OneNote files outside typical use cases, like unexpected times or on non-compliant systems.

  - **Investigate File Locations**: Analyze the paths from which these suspicious files are executing. Investigate if they are originating from typical locations such as `AppData\`, `Public`, or `Temp`, as these may indicate usage of legitimate paths for malicious purposes.

  ### Prioritization
  This alert should be treated with high priority due to the potential impact of malware execution on the enterprise environment. Given OneNote's established legitimacy and the stealthy nature of its usage in phishing attacks, the likelihood of this occurrence may be elevated, particularly if it involves sensitive target users or unusual behavior.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where adversaries use less common tools or methods to execute malicious content within OneNote. Additionally, the effectiveness of the rule assumes that all relevant process creation logs are captured and that logging settings are appropriately configured to provide necessary details. False positives might arise from legitimate file executions and trusted signatures found in benign applications located in user directories, which necessitates careful consideration during investigation.

