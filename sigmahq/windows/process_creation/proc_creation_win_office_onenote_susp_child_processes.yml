note: |
  ### Technical Context

  This Sigma rule detects the execution of suspicious child processes spawned by the Microsoft OneNote application. Specifically, it identifies potentially malicious activities where OneNote may be used to execute embedded objects (such as scripts or executables) that are typically delivered via .one files. The likely attacker objective is initial access, where adversaries leverage OneNote due to its ability to run arbitrary code without alerting the user, thereby bypassing traditional security measures.

  This behavior relates to the MITRE ATT&CK framework under the tactic of Initial Access (TA0001) with technique T1566 (Phishing) and T1566.001 (Malicious File). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide insights on process creation events. If malicious, this activity can lead to unauthorized system access or the execution of further malicious payloads. However, this detection does NOT confirm malware presence on its own, as it could also indicate benign software behaviors.

  ### Investigation Steps

  - **Review the parent process:** Check the parent process (OneNote, ParentImage ends with '\onenote.exe') using Security Event ID 4688. Validate if the process hierarchy matches expected benign patterns, such as legitimate OneNote usage without unusual child processes.

  - **Analyze created child processes:** Identify specific child processes invoked by OneNote, focusing on known potentially malicious executables such as 'powershell.exe' or 'mshta.exe'. Use Sysmon Event ID 1 to confirm their invocation date, time, and command line arguments for suspicious patterns.

  - **Examine command line arguments:** For processes created by OneNote, pay close attention to command line arguments related to file types typically associated with scripts (e.g., '.ps', '.js', '.scr'). Malicious command lines may reveal attempts to execute scripts or download additional payloads.

  - **Identify host role and data handling:** Determine if the affected host is a high-value asset, such as an endpoint used by executives or developers. Assess the potential impact if a malicious process were successful, particularly with sensitive data.

  - **Investigate file persistence locations:** Check whether the child processes attempt to access or modify files in the AppData, ProgramData, or Temp directories. Legitimate processes may interact with these areas but should not generate suspicious scripts or executables frequently found in malicious scenarios.

  - **Cross-check against file signatures:** Validate any executables or scripts against known malicious signatures or behaviors. Trusted files signed by reputable vendors can be considered benign, particularly if located in appropriate directories like AppData with no unusual activity.

  ### Prioritization

  This alert is classified as high severity due to the potential for severe impact on compromised systems, particularly if an attacker gains access to sensitive data. The likelihood of exploitation through phishing techniques leveraging OneNote is high, as it is a common method used in targeted attacks.

  ### Blind Spots and Assumptions

  There are several limitations to this detection. First, sophisticated adversaries might employ obfuscation techniques or legitimate tools to evade detection, such as manipulating legitimate command line arguments. Furthermore, environments lacking comprehensive logging (e.g., Sysmon or Windows Event Logs not fully configured) may miss critical events. Legitimate activities, such as automated scripting operations or software development, might trigger these alerts mistakenly. A related detection to strengthen coverage is monitoring for suspicious activity from Office applications, especially for child processes spawned by Excel (using the derived rule for suspicious Office application child processes).

