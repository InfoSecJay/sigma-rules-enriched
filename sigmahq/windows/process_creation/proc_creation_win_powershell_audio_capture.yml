logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'WindowsAudioDevice-Powershell-Cmdlet'
    - 'Toggle-AudioDevice'
    - 'Get-AudioDevice '
    - 'Set-AudioDevice '
    - 'Write-AudioDevice '
  condition: selection
falsepositives:
- Legitimate audio capture by legitimate user.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential audio capture activities leveraging PowerShell Cmdlets associated with Windows audio devices. Attackers may use these Cmdlets to capture sensitive information through audio, especially in environments where sensitive discussions occur. Such behavior suggests an intent to collect intelligence, possibly for espionage or data exfiltration.

  The relevant MITRE ATT&CK tactics for this scenario include:
  - **Collection** (TA0009), which involves gathering data from the environment.
  - Specifically, it maps to technique **T1123: Audio Capture**, where an attacker can use audio recording tools to harvest sensitive auditory information.

  The primary data sources that provide the necessary telemetry for this detection include process creation logs from Windows environments, which record the initiation of commands and associated arguments executed by PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of PowerShell command executions that include the specific Cmdlets such as `Toggle-AudioDevice`, `Get-AudioDevice`, or `Set-AudioDevice`. Look for unusual or unauthorized use by accounts that do not typically perform audio-related tasks.

  - **Analyze User Behavior**: Assess the user activity around the times of the detected commands. Determine if the behavior correlates with legitimate business needs or if there are discrepancies that indicate potential malicious intent.

  - **Cross-reference with Audio Device Activity**: If possible, cross-reference the PowerShell command executions with logs related to audio device activity to confirm if any recordings were initiated or captured as a result.

  - **Investigate User Permissions**: Check if the user account executing the audio capture commands has the required permissions to access or manipulate audio devices. Anomalous privilege escalations or unauthorized account activities could provide further context.

  ### Prioritization
  This alert is rated medium severity due to the potential impact of audio capture on sensitive communications, which may lead to exposure of proprietary or confidential information. The likelihood of occurrence increases in environments where users have access to sensitive discussions, making it crucial to investigate promptly.

  ### Blind Spots and Assumptions
  One gap in detection coverage could be the failure to capture legitimate audio recording activity by authorized personnel, which may result in false positives. Additionally, the detection assumes that all instances of the identified Cmdlets are malicious, which may not always be the case. Proper configuration of logging for process creation events within PowerShell is necessary for this alert to function effectively, ensuring detailed command-line input is logged for analysis.

