note: |
  ### Technical Context

  This Sigma rule detects the removal of Windows Defender definition files through the process of executing `MpCmdRun.exe` with specific command line arguments indicating the complete removal of definitions. The likely attacker objective is to disable security tools that could otherwise detect malicious activities, aligning with the MITRE ATT&CK tactic for Defense Evasion (T1562.001).

  Relevant telemetry sources include Windows Security logs, specifically focusing on process creation events. The security impact is significant; if malicious, it demonstrates an adversary's attempt to impair system defenses, leading to increased risk of undetected compromise. This detection does NOT confirm that malicious activity has occurred on its own; it merely indicates a potential avenue for an attacker to bypass security mechanisms.

  ### Investigation Steps

  - **Identify process creation event:** Review Process Creation events (Security Event ID 4688 and Sysmon Event ID 1) for entries related to `MpCmdRun.exe`. Note the process creation time, user context, and parent process to establish legitimacy.

  - **Examine command line arguments:** Check the CommandLine field in Event ID 4688 for ` -RemoveDefinitions -All` to confirm malicious intent. Legitimate updates or changes typically do not include these arguments.

  - **Correlate with Windows Defender logs:** Look for recent Windows Defender logs that may indicate attempted updates or other legitimate activities. Compare timestamps with the detection event to validate expected behavior.

  - **Assess user account history:** Investigate the user account that executed the command. Determine if it has a history of running security-related tasks or if this activity appears anomalous, which could suggest malicious intent.

  - **Evaluate system role and criticality:** Assess whether the affected host is running critical services or applications. Increased scrutiny is required for servers or endpoints responsible for handling sensitive data.

  - **Look for additional artifacts:** Validate the existence or absence of Windows Defender definition files (antimalware client files). If removed, verify additional signs of compromise, such as unusual network connections or other abnormal system behaviors.

  ### Prioritization

  The alert has high severity due to the potential impact on system defenses and the criticality of Windows Defender in maintaining endpoint security. The likelihood of malicious abuse is elevated; disabling security tools is a common tactic among adversaries to facilitate undetected access or control over systems.

  ### Blind Spots and Assumptions

  Detection may be evaded by legitimate administrative actions or system misconfigurations that could also involve removing definitions. Reliable detection relies on having detailed process creation logs, which may require configuration changes if not already in place. Activities such as Windows updates or legitimate troubleshooting may inadvertently trigger this alert, necessitating careful contextual analysis. A companion detection to consider is monitoring for unauthorized access attempts to the Windows Security settings leveraging privileged accounts.

