note: |
  ### Technical Context

  This Sigma rule detects the removal of Windows Defender definition files via the execution of the `MpCmdRun.exe` utility with specific command-line arguments. Such behavior indicates an adversary's attempt to disable security mechanisms to evade detection of their malicious activities. The attacker aims to exploit vulnerabilities without being identified by endpoint protection systems. This activity is related to the MITRE ATT&CK technique T1562.001 (Disable or Tamper with Security Tools).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on security event ID 4688 and Sysmon event ID 1 that capture process creation events. If malicious, this behavior can significantly impact the organization by allowing malware or unauthorized actions to go undetected. It is essential to note that this detection alone does not confirm malicious intent; legitimate administrators may also remove definitions for various reasons, such as troubleshooting.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for any instances of `MpCmdRun.exe` executing with `CommandLine` containing `-RemoveDefinitions -All`. A significant indicator is the absence of a valid administrative need for this command.

  - **Assess execution context:** Identify the user account and host from which `MpCmdRun.exe` was executed. If the account lacks administrative privileges or is unusual for a security context, it raises suspicions. Use log fields like `User`, `Image`, and `ProcessID`.

  - **Check for previous legitimate updates:** Investigate the system’s update history in Windows Update logs to confirm if there are scheduled or manual updates that coincide with the time of definition file removal. Legitimate behavior should show regular updates followed by a removal only if troubleshooting is required.

  - **Validate endpoint protection status:** Confirm the operational status of Windows Defender on the affected system. If Windows Defender is disabled without proper justification or communication from the security team, tag this as potentially malicious behavior.

  - **Search for related artifacts:** Look for other recent command-line executions involving `MpCmdRun.exe` or other endpoint protection processes. Consistent patterns or multiple instances of these commands being issued within a short time might indicate active tampering or evasion efforts.

  ### Prioritization

  This alert should be considered high priority in an enterprise context due to the potential compromise of endpoint defenses. Disabling security features directly increases the likelihood of successful attacks and is a behavior frequently weaponized in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using legitimate administrative actions to mask malicious intent. The detection depends on the accurate logging of process creation, which must be consistently configured and monitored. Legitimate actions, such as system maintenance or manual updates by IT staff, may trigger this alert. A complementary detection to monitor could include tracking failed attempts to access consumer endpoint security features, as that could provide additional context to the removal of definitions.

