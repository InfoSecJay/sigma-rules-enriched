  ---

  ### Technical Context

  This rule detects the execution of the Windows Defender command-line tool (`MpCmdRun.exe`) with parameters indicating an attempt to remove all definition files. The likely objective of this behavior is to disable the security measures provided by Windows Defender, allowing an adversary to operate without detection. This action correlates to the MITRE ATT&CK technique T1562.001 (Impair Defenses: Disable or Modify Tools).

  The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, which capture the command-line execution details. If malicious, the impact includes increased risk of compromise, as the system loses critical protection against other malicious activities. Notably, this detection does NOT confirm successful malware installation or ongoing malicious activity on its own.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1. Look for `MpCmdRun.exe` being executed with the parameters `-RemoveDefinitions -All`. Indicate high confidence in a malicious indicator if this command appears without known legitimate use in your environment.

  - **Correlate with recent software changes:** Investigate recent software installations or updates in the environment. Legitimate IT maintenance may involve Windows Defender updates, which would not include removal commands for definitions. Look for other process creation events or configurations done around the same timeframe.

  - **Check for defensive software policies:** Validate organizational policies regarding endpoint protection tools. If removal commands align with authorized procedures (like an IT maintenance window), classify as benign and log findings.

  - **Monitor affected system behavior:** Examine logs from the affected system for unusual activities or failed processes following the command execution. High-risk activities post-execution could include attempts at lateral movement or unauthorized data access.

  - **Analyze administrator activity:** Review access rights of user accounts engaged at the time of execution. Malicious users or unexpected administrative actions can signal a breach.  Also, check for any unauthorized access to administrative tools in Windows logs.

  ---

  ### Prioritization

  This alert is high-severity, as it involves critical endpoint protection being disabled, leaving the system vulnerable to exploitation. The likelihood of misuse is considerable since many adversaries employ such tactics to execute stealthy operations.

  ---

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative actions under certain conditions, such as scheduled removal or modification of definitions due to system clean-up policies. Sufficient logging configurations must be enforced, and system auditing enabled to capture complete context. A related detection to strengthen coverage would be monitoring for the addition of new service accounts or changes in user privileges, which might indicate attempts to exploit the newly vulnerable systems.

