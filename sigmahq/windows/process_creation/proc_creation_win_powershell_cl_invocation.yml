title: Potential Process Execution Proxy Via CL_Invocation.ps1
id: a0459f02-ac51-4c09-b511-b8c9203fc429
status: test
description: Detects calls to "SyncInvoke" that is part of the "CL_Invocation.ps1"
  script to proxy execution using "System.Diagnostics.Process"
references:
- https://lolbas-project.github.io/lolbas/Scripts/Cl_invocation/
- https://twitter.com/bohops/status/948061991012327424
author: Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia Shornikova
date: 2020-10-14
modified: 2023-08-17
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: As this function is usually called from within powershell, classical process creation even would not catch it. This will only catch inline calls via "-Command" or "-ScriptBlock" flags for example.
    CommandLine|contains: 'SyncInvoke '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the `SyncInvoke` method from the `CL_Invocation.ps1` PowerShell script, which can be utilized to execute commands or scripts indirectly, thereby acting as a proxy for execution. Attackers may employ this technique to obscure their activities, enabling them to invoke processes without directly exposing themselves. The typical objective of such an attacker could involve executing malicious commands or scripts on compromised systems to maintain persistence, exfiltrate data, or further escalate privileges.

  The relevant MITRE ATT&CK tactics and techniques encompassed by this detection rule include **Defense Evasion** (TA0005) and **PowerShell** (T1216). These techniques highlight threats that seek to manipulate legitimate system functions to bypass security mechanisms. The primary data source for this detection is **process creation logs**, which capture command-line activity associated with process invocation, allowing for the identification of potentially suspicious usage of PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation logs for any instances of PowerShell executing `CL_Invocation.ps1` with the `-Command` or `-ScriptBlock` flags. Look for unusual command-line arguments or patterns that deviate from normal operations.

  - **Correlate with Additional Context**: Examine user activity and context around the invocation of this script. Check if the user has recently accessed sensitive data or if there were any anomalous privileges granted prior to the execution.

  - **Inspect System Activity**: Investigate the impact of the `SyncInvoke` calls by tracing associated processes and any other commands that may have been executed in conjunction with the PowerShell script. Checking for unexpected network connections or file access patterns can provide insights into potential lateral movement.

  - **Conduct Threat Hunting**: Proactively search for similar patterns in the environment that could indicate misuse of the `SyncInvoke` method. Review logs from systems where PowerShell usage is frequent, and identify any outliers or deviations from typical operational behavior.

  ### Prioritization
  This alert is rated as medium severity due to the potential for bypassing traditional security measures, which could facilitate extensive lateral movement or data exfiltration if exploited by an advanced threat actor.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, particularly if the script is executed in a way that does not leave clear indicators in process creation logs, such as through scheduled jobs or legitimate administrative routines. The rule assumes that all executions of `SyncInvoke` are malicious, which may not always be the case. For optimal performance of the alert, it is vital to ensure process creation logging is enabled and that command-line arguments are being captured comprehensively across all endpoints.

