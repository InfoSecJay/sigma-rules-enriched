logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: As this function is usually called from within powershell, classical process creation even would not catch it. This will only catch inline calls via "-Command" or "-ScriptBlock" flags for example.
    CommandLine|contains: 'SyncInvoke '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the `SyncInvoke` function from the `CL_Invocation.ps1` PowerShell script, which is a method used to proxy process execution through the .NET `System.Diagnostics.Process` class. The likely objective of an attacker leveraging this technique is to execute malicious commands or scripts under the guise of legitimate PowerShell operations, thereby evading detection mechanisms. The relevant MITRE ATT&CK tactic is "Defense Evasion" (ID: T1216).

  The primary telemetry source for this detection is Windows process creation logs, specifically targeting command line arguments used in PowerShell. If malicious, this behavior can lead to unauthorized process execution, data exfiltration, or deployment of additional malware. However, this detection does NOT confirm that malicious activity has occurred on its own, as legitimate PowerShell usage may include this method in normal operations.

  ### Investigation Steps

  - **Identify command line details**: Review the process creation logs, specifically focusing on Event ID 4688. Check whether the command line includes `SyncInvoke` and analyze parameters passed to it for suspicious activity.

  - **Determine parent-child relationships**: Utilize Sysmon Event ID 10 to inspect any parent process associated with the detected execution. Legitimate use will often have benign parent processes, whereas malicious activity may have unusual parent-child hierarchies.

  - **Monitor for known malicious indicators**: Cross-reference the detected command line with established malware indicators within your threat intelligence platform, focusing on previously associated behavior with `CL_Invocation.ps1`.

  - **Assess user context**: Investigate the user account that executed the command. Check for any prior behavioral anomalies, particularly if a non-administrative user account executed this command, which may be indicative of suspicious activity.

  - **Evaluate legitimate usage patterns**: Confirm legitimate execution of PowerShell scripts that might utilize `SyncInvoke`. Typically, authorized software deployments or maintenance tasks will log actions that include `SyncInvoke` with clear business justifications.

  - **Check for artifacts of persistence**: Review locations such as `C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\` for any scripts or executables that could indicate a persistence mechanism related to this PowerShell activity.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems if exploited. The likelihood of malicious abuse is concerning, given that power users and attackers often rely on such methods to evade defenses. This behavior is not widely weaponized, but its use may indicate sophisticated attempts at process execution evasion.

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker modifies command line arguments to avoid detection signatures or uses obfuscated scripts. Reliable detection requires monitoring of suitable log sources, ensuring PowerShell logging is enabled, including script block logging. Legitimate activities may include automated scripts or administrative tasks. A related detection to consider is monitoring for unusual PowerShell module loading or execution via Event ID 4104 (PowerShell script block logging), which would strengthen overall visibility of potentially malicious behavior.

