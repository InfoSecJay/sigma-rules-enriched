detection:
  selection:
        # Note: As this function is usually called from within powershell, classical process creation even would not catch it. This will only catch inline calls via "-Command" or "-ScriptBlock" flags for example.
    CommandLine|contains: 'SyncInvoke '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the `SyncInvoke` method from the `CL_Invocation.ps1` PowerShell script to proxy process execution through `System.Diagnostics.Process`. The primary attacker objective in this scenario is to execute arbitrary code, potentially allowing malware delivery or lateral movement within a network. This behavior falls under the MITRE ATT&CK technique "PowerShell" (T1086) and "Application Layer Protocol" (T1216), as it exploits legitimate scripting tools to bypass security controls.

  The primary telemetry source for this detection is Windows process creation events, especially those logged under PowerShell command executions (Event ID 4688). If detected as malicious, the impact could be significant, enabling unauthorized actions on a server or endpoint. However, it is crucial to note that this detection does NOT confirm malicious intent on its own; further analysis is needed to assess the context and legitimacy of the process execution.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for details on the process creation. Look for the parent process and command line that includes "SyncInvoke" as this indicates potential malicious activity.

  - **Analyze PowerShell execution context:** Investigate related PowerShell logs (Event ID 4104), focusing on any script blocks or command lines executed around the same time. Expected behavior would include legitimate administrative scripts or scheduled tasks.

  - **Verify command line parameters:** Examine `CommandLine` fields for unusual parameters or encoding methods that might indicate an obfuscation attempt. Malicious indicators often include unexpected switches or invocation of scripts not normally associated with the host's role.

  - **Correlate with network activity:** Identify any network connections made by the affected process using Windows Event ID 5156 or firewall logs. Look for unusual outbound connections, especially to known command-and-control IPs or domains.

  - **Assess script source and integrity:** Investigate the source and integrity of the `CL_Invocation.ps1` script. Verify its location and modify timestamps to assess for unauthorized changes. Valid instances would come from trusted paths and show no recent alterations.

  ### Prioritization

  This alert should be considered medium severity. The impact largely depends on the affected system’s role (e.g., if it's a server versus a workstation) and the likelihood of misuse is elevated due to the common use of PowerShell in exploitation scenarios. This method leverages a legitimate script to conduct potentially stealthy operations, making it a frequently weaponized tactic.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for legitimate use of `SyncInvoke`, such as in automated scripts or scheduled tasks. Depending on the organization's logging policies, Event ID 4688 may not capture all PowerShell executions if filtered incorrectly. Additionally, benign scripts may trigger this alert if they use the same process invocation methods, making context vital for accurate assessment. For additional coverage, monitoring for unusual PowerShell activity (T1064) can help identify broader exploitation attempts.

