note: |
  ### Technical Context

  This Sigma rule detects the execution of `TpmVscMgr.exe` to create a new virtual smart card—an unusual behavior that could signify attempts by attackers to establish persistent access or manipulate encryption keys. The attacker objective may involve leveraging virtual smart cards for privilege escalation or data exfiltration. This aligns with the MITRE ATT&CK tactic of **Execution** (TA0002), specifically the technique **User Execution** (T1203).

  The primary telemetry source is Windows process creation logs, specifically monitored via Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior may lead to unauthorized access and data compromise. Importantly, this detection does NOT confirm malicious intent or compromise on its own; legitimate administrator actions may also trigger this alert.

  ### Investigation Steps

  - **Check the CommandLine Arguments:** Review Security Event ID 4688/Sysmon Event ID 1 for any command lines containing "create" in conjunction with `TpmVscMgr.exe`. A legitimate command may be executed by an admin, such as "TpmVscMgr.exe create MySmartCard".

  - **Verify Process Creation Context:** Analyze the parent process of `TpmVscMgr.exe` using Sysmon Process ID (ParentProcessId) to determine if the invocation stems from a common management tool or script. Legitimate usage may show parent processes such as `powershell.exe` or `cmd.exe`.

  - **Assess User Account Details:** Identify the user account executing `TpmVscMgr.exe`. Cross-reference with administrative accounts—unusual activity from non-admin accounts raises suspicion.

  - **Check System Impact and Asset Criticality:** Note the asset's role and criticality. If the process runs on a sensitive server (e.g., Domain Controller or financial database server), prioritize further scrutiny.

  - **Look for File Creation Events:** Monitor the creation of new smart card files, checking for related registry changes or file artifacts in the `%ProgramData%\Microsoft\Windows\SmartCards` directory for unexpected files or timestamps.

  - **Identify References to Threat Intelligence:** Check threat intelligence sources or any indications that `TpmVscMgr.exe` may have been misused in reported incidents to establish a baseline for suspicious versus legitimate activity.

  ### Prioritization

  Given that the execution of `TpmVscMgr.exe` on a potentially critical asset such as a Domain Controller can indicate possible malicious intent, alerts should be treated with medium severity. The likelihood of abuse exists, particularly in environments where attackers seek to leverage smart card-based authentication mechanisms.

  ### Blind Spots and Assumptions

  This detection may miss valid administrative actions, particularly in environments where virtual smart cards are commonly deployed. Evasion could occur through modifications to process parameters or masked command line arguments. It's essential to ensure logging configurations like Sysmon are properly set for comprehensive coverage. Companions like remote access tool detections could enhance context around potentially malicious usages of `TpmVscMgr.exe`.

