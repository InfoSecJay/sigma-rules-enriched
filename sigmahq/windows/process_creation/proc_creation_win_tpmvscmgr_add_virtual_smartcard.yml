  ---

  ### Technical Context

  This Sigma rule detects the execution of the "TpmVscMgr.exe" process, specifically when it involves the creation of a new virtual smart card. This may indicate an attempt to facilitate unauthorized access or credential storage by leveraging the Trusted Platform Module (TPM) in a way that compromises system security. The relevant MITRE ATT&CK technique here is Credential Access via Credential Dumping (T1003).

  Primary telemetry sources for this activity include Windows process creation logs, specifically Security Event ID 4688, which records process creation events, and Sysmon Event ID 1, which provides additional details about the process and command line used. If the activity is malicious, it could lead to unauthorized access to sensitive information or systems. Importantly, this detection does NOT confirm that a successful compromise has occurred on its own; further investigation is required to determine malicious intent.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 to identify "TpmVscMgr.exe" execution details and command line arguments. Look for command line containing "create"; this is a higher confidence indicator of potential malicious intent.

  - **Analyze originating user and host context:** Verify the user account initiating the process. Look for suspicious accounts (e.g., accounts not typically associated with administrative tasks) that may point to a malicious actor.

  - **Assess the legitimacy of the action:** Determine if the execution of "TpmVscMgr.exe" is consistent with expected administrative behavior, such as scheduled maintenance or auditing tasks. Normal usage might include "create" operations by known administrators on configuration changes.

  - **Correlate with other security events:** Investigate if any other events correlate with this execution, such as unusual logon attempts, especially from remote sources. This can indicate a possible lateral movement or compromise.

  - **Review system changes related to TPM:** Examine system configuration logs or any Group Policy changes concerning TPM and smart card management that provide context on device modifications which may indicate organizational policy violation.

  - **Check for further credential theft tools:** Look for execution of other smart card-related tools or any command suggesting the extraction of credentials (e.g., the use of "vscmgr" commands) that suggest an escalation of this activity.

  ---

  ### Prioritization

  The alert has medium severity due to the potential for significant impact on system security when unauthorized access via smart cards occurs. The likelihood of adversaries abusing this behavior is moderate, as it is specifically associated with manipulating hardware-backed authentication mechanisms, which are common targets in sophisticated attacks.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if an adversary alters the command line parameters or uses a different method to create virtual smart cards. Reliable detection requires proper logging configurations, especially for Sysmon and Windows Security Event logs. Legitimate administrative actions may trigger this alert during updates or system configurations, particularly in environments implementing smart card authentication. A related detection to consider is monitoring for persistence mechanisms through "schtasks" or registry modifications regarding TPM settings.

