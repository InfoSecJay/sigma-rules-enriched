title: PUA - Seatbelt Execution
id: 38646daa-e78f-4ace-9de0-55547b2d30da
status: test
description: Detects the execution of the PUA/Recon tool Seatbelt via PE information
  of command line parameters
references:
- https://github.com/GhostPack/Seatbelt
- https://www.bluetangle.dev/2022/08/fastening-seatbelt-on-threat-hunting.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-18
modified: 2023-02-04
tags:
- attack.discovery
- attack.t1526
- attack.t1087
- attack.t1083
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\Seatbelt.exe'
  - OriginalFileName: 'Seatbelt.exe'
  - Description: 'Seatbelt'
  - CommandLine|contains:
              # This just a list of the commands that will produce the least amount of FP in "theory"
              # Comment out/in as needed in your environment
              # To get the full list of commands see reference section
    - ' DpapiMasterKeys'
    - ' InterestingProcesses'
    - ' InterestingFiles'
    - ' CertificateThumbprints'
    - ' ChromiumBookmarks'
    - ' ChromiumHistory'
    - ' ChromiumPresence'
    - ' CloudCredentials'
    - ' CredEnum'
    - ' CredGuard'
    - ' FirefoxHistory'
    - ' ProcessCreationEvents'
              # - ' RDPSessions'
              # - ' PowerShellHistory'
  selection_group_list:
    CommandLine|contains:
    - ' -group=misc'
    - ' -group=remote'
    - ' -group=chromium'
    - ' -group=slack'
    - ' -group=system'
    - ' -group=user'
    - ' -group=all'
  selection_group_output:
    CommandLine|contains: ' -outputfile='
  condition: selection_img or all of selection_group_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of Seatbelt, a Post-Exploitation User Agent (PUA) and reconnaissance tool often used by attackers to gather information about a target system. Seatbelt can execute various commands that yield information on processes, files, and credentials, making it a valuable tool for threat actors seeking to enumerate sensitive information. The presence of Seatbelt in an environment may indicate an attacker has already compromised a system and is performing reconnaissance to escalate their privileges or exfiltrate data.

  Relevant MITRE ATT&CK tactics include **Discovery (TA0007)**, as attackers may utilize Seatbelt to gather valuable insights about browser histories and user credentials. Specific techniques include **T1087 (Account Discovery)**, **T1083 (File and Directory Discovery)**, and **T1526 (Vendor/Developer Specific Tool)** which is specific to the execution of tools like Seatbelt. The primary data sources for this detection are process creation logs from Windows, which document the executable launches along with their command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Events:** Check process creation logs for instances where `Seatbelt.exe` is executed, noting command-line parameters that indicate potential misuse.
  - **Analyze Command-Line Arguments:** Focus on specific arguments used with Seatbelt that relate to information gathering, especially those that involve credential enumeration or file checks.
  - **Correlate User Activity:** Investigate the user accounts associated with the execution of Seatbelt to determine if the activity aligns with legitimate administrative tasks or indicates a compromise.
  - **Identify Related Tools:** Search for other known tools typically used in conjunction with Seatbelt, like PowerShell or other Post-Exploitation frameworks, to contextualize the findings.

  ### Prioritization
  The alert has high severity in an enterprise environment due to the potential for significant information leakage and the heightened risk of further compromise after an initial breach. The likelihood of Seatbelt being deployed by malicious actors in a post-exploitation scenario elevates the urgency for investigation.

  ### Blind Spots and Assumptions
  This detection logic may not account for all instances of legitimate Seatbelt use by administrators for security assessments or system audits, leading to potential false positives. The coverage relies on the alert being properly configured to log process creation events for all systems where Seatbelt might run. If logs are missing or process creation is disabled, the detection will not trigger, leaving a gap in visibility. Additionally, the rule assumes that adversaries will not obfuscate their command executions or use different methods to invoke Seatbelt.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
