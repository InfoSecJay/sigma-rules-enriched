title: PUA - Seatbelt Execution
id: 38646daa-e78f-4ace-9de0-55547b2d30da
status: test
description: Detects the execution of the PUA/Recon tool Seatbelt via PE 
  information of command line parameters
references:
- https://github.com/GhostPack/Seatbelt
- https://www.bluetangle.dev/2022/08/fastening-seatbelt-on-threat-hunting.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-18
modified: 2023-02-04
tags:
- attack.discovery
- attack.t1526
- attack.t1087
- attack.t1083
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\Seatbelt.exe'
  - OriginalFileName: 'Seatbelt.exe'
  - Description: 'Seatbelt'
  - CommandLine|contains:
              # This just a list of the commands that will produce the least amount of FP in "theory"
              # Comment out/in as needed in your environment
              # To get the full list of commands see reference section
    - ' DpapiMasterKeys'
    - ' InterestingProcesses'
    - ' InterestingFiles'
    - ' CertificateThumbprints'
    - ' ChromiumBookmarks'
    - ' ChromiumHistory'
    - ' ChromiumPresence'
    - ' CloudCredentials'
    - ' CredEnum'
    - ' CredGuard'
    - ' FirefoxHistory'
    - ' ProcessCreationEvents'
              # - ' RDPSessions'
              # - ' PowerShellHistory'
  selection_group_list:
    CommandLine|contains:
    - ' -group=misc'
    - ' -group=remote'
    - ' -group=chromium'
    - ' -group=slack'
    - ' -group=system'
    - ' -group=user'
    - ' -group=all'
  selection_group_output:
    CommandLine|contains: ' -outputfile='
  condition: selection_img or all of selection_group_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Seatbelt tool, a Potentially Unwanted Application (PUA) often used for reconnaissance or information gathering on Windows systems. The likely attacker objective is to identify sensitive information, system configurations, or credentials from the compromised environment. This behavior maps to the MITRE ATT&CK techniques T1087 (Account Discovery) and T1526 (Application Layer Protocol).

  The primary telemetry source is process creation logs, primarily Security Event ID 4688 and Sysmon Event ID 1, detailing command line arguments and image execution. If utilized maliciously, Seatbelt can allow adversaries to gather important intelligence before launching further attacks. However, the detection of Seatbelt's execution does NOT confirm that an attacker is present, as it can also be executed legitimately by system administrators for inventory purposes.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for `Seatbelt.exe`. Note the command line arguments for any specific command indicating the purpose of the execution.

  - **Identify suspicious command-line parameters:** Look for parameters that could indicate information gathering, such as `-group=user` or `-outputfile=`. Presence of these keywords suggests potential malicious intent.

  - **Investigate running instances and parent processes:** Cross-reference the creating process (parent) of `Seatbelt.exe` to determine if it was spawned by a legitimate application (e.g., PowerShell or command prompt) or a suspicious process (e.g., known malware).

  - **Check for legitimate use cases:** Determine whether recent security audits or maintenance activities were documented that could justify the execution of Seatbelt by known administrators. Investigate the timing and source of execution.

  - **Correlate multiple alerts:** If Seatbelt execution is noted, look for other indicators such as unusual network activity or additional reconnaissance tools running. Identify if there are overlapping timestamps that show a coordinated effort.

  - **Assess asset criticality:** Identify if Seatbelt ran on high-value assets (servers, databases, etc.) which may heighten the risk and impact if misused.

  ### Prioritization

  This alert should be prioritized as high severity, given that Seatbelt's execution often precedes more significant malicious actions and is aligned with known adversarial behaviors. The targeted systems' importance and the likelihood of using this tool for reconnaissance further elevate its risk.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where attackers delete or obfuscate logs post-execution, made more challenging by legitimate usage patterns seen by administrators on occasion. Ensure that the relevant logs (process creation and any command line inputs) are appropriately configured and retained for reliable detection. Additionally, PowerShell commands could be a related detection that provides coverage for attacks utilizing script-based information gathering.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
