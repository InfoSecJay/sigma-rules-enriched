title: Potential Data Exfiltration Activity Via CommandLine Tools
id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
status: test
description: Detects the use of various CLI utilities exfiltrating data via web requests
references:
- https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-02
modified: 2025-10-19
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_iwr:
    Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    CommandLine|contains:
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - 'irm '
    - 'iwr '
    - 'wget '
    CommandLine|contains|all:
    - ' -ur'         # Shortest possible version of the -uri flag
    - ' -me'         # Shortest possible version of the -method flag
    - ' -b'
    - ' POST '
  selection_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: '--ur'     # Shortest possible version of the --uri flag
  selection_curl_data:
    CommandLine|contains:
    - ' -d '         # Shortest possible version of the --data flag
    - ' --data '
  selection_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains:
    - '--post-data'
    - '--post-file'
  payloads:
  - CommandLine|re:
    - 'net\s+view'
    - 'sc\s+query'
  - CommandLine|contains:
    - 'Get-Content'
    - 'GetBytes'
    - 'hostname'
    - 'ifconfig'
    - 'ipconfig'
    - 'netstat'
    - 'nltest'
    - 'qprocess'
    - 'systeminfo'
    - 'tasklist'
    - 'ToBase64String'
    - 'whoami'
  - CommandLine|contains|all:
    - 'type '
    - ' > '
    - ' C:\'
  condition: (selection_iwr or all of selection_curl* or selection_wget) and payloads
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential data exfiltration activities through command-line utilities. Specifically, it flags the use of tools like PowerShell, Curl, and Wget to send data over web requests using suspicious command-line parameters. Attackers may utilize these methods to discreetly transfer sensitive data away from the network, often as part of a broader strategy to exploit compromised systems or networks. The primary objective of such activities is to extract valuable information, which could include credentials, proprietary data, or intellectual property.

  The relevant MITRE ATT&CK tactics and techniques related to this rule include:
  - **Execution (TA0002)**: The use of command-line interfaces to execute commands.
  - **Command and Control (TA0011)**: Tools such as Curl and Wget can be used to establish outbound connections to command and control servers or directly exfiltrate data.
  - **Exfiltration Over Command and Control Channel (T1041)**: This technique specifically pertains to transferring data via command-line tools and web requests.

  Primary data sources for this detection include:
  - Process creation logs from the Windows operating system that capture the execution of command-line utilities.
  - Network traffic logs that might reveal web requests aligned with the detected command-line activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs focusing on instances of PowerShell, Curl, Wget, and Command Prompt commands, particularly those that exhibit exfiltrative behavior.
  - **Analyze Command-Line Arguments**: Look for command-line parameters in the logs that contain signs of potential data exfiltration, such as flags that indicate data transfer or network-based operations.
  - **Inspect Network Traffic**: Analyze the network connections initiated by the flagged command-line tools to determine if there are any requests to potentially malicious or anomalous domains.
  - **Correlate with User Activity**: Cross-reference the detected command-line activities with user accounts and their privileges to understand the context and potential malicious intent behind the executions.

  ### Prioritization
  This alert carries a high severity due to the potential impact of data exfiltration on enterprise confidentiality, integrity, and reputation. The likelihood of such activities occurring in modern environments, especially with the increasing sophistication of attackers, further amplifies the urgency of investigating such alerts.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the reliance on the proper logging of process creation events; if these logs are not collected or retained appropriately, the detection may fail. Additionally, the rule assumes that attackers will utilize these specific command-line tools and arguments for data exfiltration, which may not encompass all possible exfiltration methods. Ensuring comprehensive logging configurations on endpoints and monitoring outbound network traffic is essential for effective detection.

