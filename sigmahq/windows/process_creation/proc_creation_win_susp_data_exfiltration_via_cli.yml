title: Potential Data Exfiltration Activity Via CommandLine Tools
id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
status: test
description: Detects the use of various CLI utilities exfiltrating data via web 
  requests
references:
- https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-02
modified: 2025-10-19
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_iwr:
    Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    CommandLine|contains:
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - 'irm '
    - 'iwr '
    - 'wget '
    CommandLine|contains|all:
    - ' -ur'         # Shortest possible version of the -uri flag
    - ' -me'         # Shortest possible version of the -method flag
    - ' -b'
    - ' POST '
  selection_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: '--ur'     # Shortest possible version of the --uri flag
  selection_curl_data:
    CommandLine|contains:
    - ' -d '         # Shortest possible version of the --data flag
    - ' --data '
  selection_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains:
    - '--post-data'
    - '--post-file'
  payloads:
  - CommandLine|re:
    - 'net\s+view'
    - 'sc\s+query'
  - CommandLine|contains:
    - 'Get-Content'
    - 'GetBytes'
    - 'hostname'
    - 'ifconfig'
    - 'ipconfig'
    - 'netstat'
    - 'nltest'
    - 'qprocess'
    - 'systeminfo'
    - 'tasklist'
    - 'ToBase64String'
    - 'whoami'
  - CommandLine|contains|all:
    - 'type '
    - ' > '
    - ' C:\'
  condition: (selection_iwr or all of selection_curl* or selection_wget) and 
    payloads
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_data_exfiltration_via_cli/info.yml
note: |
  ### Technical Context

  This Sigma rule detects potential data exfiltration activities conducted via command-line tools, specifically PowerShell and utilities like Curl and Wget that are used to transfer data over the web. The likely attacker objective is to exfiltrate sensitive or confidential data from a compromised system out to an external server, often as a preliminary step before further exploitation. This behavior aligns with the MITRE ATT&CK tactic: Execution (TA0040), Techniques: Command-Line Interface (T1059.001).

  The primary telemetry sources for this detection include process creation logs, particularly focusing on Windows Event ID 4688 or Sysmon Event ID 1, which detail command-line activities. If malicious, this activity could result in unauthorized data disclosure or compromise of sensitive information. Notably, the detection alone does not confirm actual exfiltration; it indicates attempts to use command-line tools for data transfer, but further investigation is required to assess the validity of the behavior.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Event ID 4688 logs for instances of `powershell.exe`, `curl.exe`, or `wget.exe` along with command-line arguments indicating data transfer, such as `-Uri` or `--post-data`.

  - **Examine Command-Line Arguments:** Look for command lines containing suspicious flags like `-method POST`, `-d`, or any command invoking potential info-gathering utilities (`whoami`, `ipconfig`, etc.) to understand what data is being targeted for exfiltration.

  - **Identify Known Malicious Indicators:** Confirm the presence of command lines that include `curl` or `Invoke-WebRequest` alongside a public IP address or a known malicious domain as it indicates high confidence of malicious intent.

  - **Evaluate Legitimate Usage Patterns:** Consider benign usage such as system administrators running scripts that retrieve configurations or use Curl to communicate with local APIs. Legitimate command lines will often not involve excessive data transfer or POST requests for sensitive data.

  - **Cross-reference with Security Policies:** Ensure that any observed behavior aligns with corporate security policies regarding data transfer and usage of scripting tools, especially in critical assets such as servers or databases.

  - **Inspect Network Traffic:** Analyze network logs or firewall logs to verify whether outbound connections were established to unusual or unauthorized IP addresses and if any substantial amounts of data were sent post-command execution.

  ### Prioritization

  This alert carries a high severity due to the potential impact of data exfiltration from sensitive systems, notably those containing proprietary or personally identifiable information. The likelihood of malicious abuse is elevated, particularly in environments where attackers are known to leverage built-in tools for covert operations. This behavior is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative activities may trigger this alert, leading to false positives. The effectiveness of this detection depends on comprehensive coverage of process creation logs and network traffic monitoring, which may require specific log configurations. Additionally, users leveraging these command-line tools for legitimate data uploads may inadvertently trigger alerts, necessitating context for each instance. A related detection that complements this coverage would be monitoring for unusual outbound network connections post-command execution indicating potential exfiltration.

