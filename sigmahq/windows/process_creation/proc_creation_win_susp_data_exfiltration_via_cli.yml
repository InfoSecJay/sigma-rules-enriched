title: Potential Data Exfiltration Activity Via CommandLine Tools
id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
status: test
description: Detects the use of various CLI utilities exfiltrating data via web 
  requests
references:
- https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-02
modified: 2025-10-19
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_iwr:
    Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    CommandLine|contains:
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - 'irm '
    - 'iwr '
    - 'wget '
    CommandLine|contains|all:
    - ' -ur'         # Shortest possible version of the -uri flag
    - ' -me'         # Shortest possible version of the -method flag
    - ' -b'
    - ' POST '
  selection_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: '--ur'     # Shortest possible version of the --uri flag
  selection_curl_data:
    CommandLine|contains:
    - ' -d '         # Shortest possible version of the --data flag
    - ' --data '
  selection_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains:
    - '--post-data'
    - '--post-file'
  payloads:
  - CommandLine|re:
    - 'net\s+view'
    - 'sc\s+query'
  - CommandLine|contains:
    - 'Get-Content'
    - 'GetBytes'
    - 'hostname'
    - 'ifconfig'
    - 'ipconfig'
    - 'netstat'
    - 'nltest'
    - 'qprocess'
    - 'systeminfo'
    - 'tasklist'
    - 'ToBase64String'
    - 'whoami'
  - CommandLine|contains|all:
    - 'type '
    - ' > '
    - ' C:\'
  condition: (selection_iwr or all of selection_curl* or selection_wget) and 
    payloads
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential data exfiltration activity performed via command-line interface (CLI) utilities on Windows systems, specifically focusing on PowerShell, Curl, and Wget commands. Attackers often employ these tools to send sensitive data to external servers, aiming for information theft or lateral movement within the network. This behavior fits into the MITRE ATT&CK framework under the Execution tactic (T1059.001 - Command and Scripting Interpreter: Windows Command Shell).

  The primary telemetry sources include process creation logs indicating the execution of specific command-line utilities or scripts. Relevant log types include Windows Security Event ID 4688 (process creation) and Sysmon Event ID 1. If malicious, this activity may lead to unauthorized data exposure or compromise of sensitive information. Importantly, this detection does not confirm successful data exfiltration or the nature of the accessed information on its own.

  ### Investigation Steps

  - **Review process creation logs for suspicious commands:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of 'powershell.exe', 'cmd.exe', 'curl.exe', or 'wget.exe' running with unusual command-line arguments. Look for the presence of 'Invoke-WebRequest', 'curl', or similar terms indicative of potential data exfiltration.

  - **Identify command-line arguments used:** Examine the CommandLine field for parameters like '-uri', '-method', or '--post-data'. Legitimate usage might include trusted scripts or automated tools, while suspicious patterns include unexpected URLs or sensitive commands like 'Get-Content' being sent over the network.

  - **Correlate with network traffic data:** Cross-reference process creation events with network logs (e.g., firewall logs) to check if outbound connections are made to unknown or suspicious IP addresses or domains shortly after the execution of the identified processes.

  - **Establish baseline legitimate activity:** Determine what regular command-line operations look like for affected systems. E.g., administrative scripts or maintenance commands that utilize similar CLI tools without suspect parameters or destinations.

  - **Investigate associated artifacts:** Look for temporary files or files in use created by the command line execution that may indicate data being read or written. Specific attention should be on file paths such as 'C:\temp\' and whether any large or sensitive files are present.

  - **Identify high-confidence malicious indicators:** If detected command executions include the payload commands that reference system configuration or data identification (like 'whoami', 'ipconfig', etc.) in conjunction with outbound data transmissions, classify these as high-confidence malicious activities.

  ### Prioritization

  Given the potential impact on sensitive data exposure and the likelihood of malicious actors exploiting these command-line tools for data exfiltration, this alert is rated as high priority. The behaviors observed are common in targeted attacks, elevating the risk of exploitation in sensitive environments.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of logging for certain command-line activities or the potential misuse of legitimate scripts for malicious purposes. It's crucial to ensure comprehensive logging configurations are in place to capture all relevant command execution events. False positives could arise from legitimate administrative tools or scripts utilizing similar command structures. A related detection rule focusing on anomalous network traffic (e.g., suspicious outbound connections) would enhance the ability to corroborate these findings.

