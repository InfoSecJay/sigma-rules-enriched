title: Use Short Name Path in Image
id: a96970af-f126-420d-90e1-d37bf25e50e1
related:
- id: 349d891d-fef0-4fe4-bc53-eee623a15969
  type: similar
status: test
description: Detect use of the Windows 8.3 short name. Which could be used as a 
  method to avoid Image detection
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/frack113/status/1555830623633375232
author: frack113, Nasreddine Bencherchali
date: 2022-08-07
modified: 2025-10-20
tags:
- attack.stealth
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '~1\'
    - '~2\'
  filter_main_system_process:
    ParentImage:
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\cleanmgr.exe'          # Spawns DismHost.exe with a shortened username (if too long)
  filter_main_installers:
  - Image|contains|all:
    - '\AppData\'
    - '\Temp\'
  - Image|endswith:
    - '~1\unzip.exe'
    - '~1\7zG.exe'
  filter_optional_webex:
    ParentImage|endswith: '\WebEx\WebexHost.exe'     # Spawns a shortened version of the CLI and Image processes
  filter_optional_thor:
    ParentImage|endswith: '\thor\thor64.exe'
  filter_optional_installshield:
  - Product: 'InstallShield (R)'
  - Description: 'InstallShield (R) Setup Engine'
  - Company: 'InstallShield Software Corporation'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Applications could use this notation occasionally which might generate some 
  false positives. In that case Investigate the parent and child process.
level: medium
note: |
  ### Technical Context

  This rule detects the use of Windows 8.3 short file names during process creation, a technique that adversaries may employ to evade detection mechanisms that analyze long file paths. The likely attacker objective is to hide malicious activities by invoking executables or scripts with abbreviated names, thereby bypassing security controls that rely on standard naming conventions. This behavior is aligned with the MITRE ATT&CK tactic of Defense Evasion (T1564.004).

  The primary telemetry source for this detection is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If malicious, the use of short file names can significantly increase the risk of compromise and unauthorized access to sensitive systems or data. Importantly, this detection does NOT confirm that the behavior is malicious on its own; further investigation is necessary to assess intent and context.

  ### Investigation Steps

  - **Check the parent process:** Review the Process Creation logs (Security Event ID 4688 or Sysmon Event ID 1) for the parent process of the detected short name usage. Look for suspicious parent images that are not typical for legitimate actions, such as a process invoking unexpected executables like `unzip.exe` or `7zG.exe`.

  - **Identify legitimate behavior:** Compare the detected short name invocation against known benign processes common in your environment. For instance, legitimate applications may invoke short names, particularly when file paths are long. Cross-reference with application documentation or administrative practices.

  - **Examine activity timelines:** Filter through logs within the same time window (Event IDs 4688 and 4689) for any additional process creation events or network activity that might coincide with the short name usage. Look for patterns that indicate rapid succession of processes tied to potentially malicious actions.

  - **Validate execution context:** For logged short names, inspect associated file paths (for example, look for images containing `~1\` or `~2\`) to determine if they are being executed from known safe directories like `C:\Windows\Temp\` or user profile paths. Check for unusual file locations that could signal an attack.

  - **Verify parent-child relationships:** Investigate the parent-child process relationships for any of the detected short names. Use Sysinternals tools like Process Explorer to visualize these hierarchies and identify any anomalies in process execution, especially if linked to non-standard software installations.

  - **Assess user account UX:** Look for the user account context under which the short names were executed. If they were run under privileged accounts or from non-standard locations, that's a strong indicator for further investigation into potentially malicious activity.

  ### Prioritization

  This alert is deemed medium severity due to the potential impact on critical infrastructure and the likelihood that short name usage is a precursor to further malicious behavior. Although uncommon, this method of evading detection is known among adversaries, making it a reasonable concern that requires prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to use short names, leading to false positives, particularly from common utilities like file extractors and installers. Reliable detection relies on comprehensive logging configurations for process creation and may necessitate additional security tools to monitor file integrity. False positives may occur in standard software installations, so contextual awareness is crucial. Related alerts for file integrity violations can further strengthen monitoring efforts and help correlate findings.

