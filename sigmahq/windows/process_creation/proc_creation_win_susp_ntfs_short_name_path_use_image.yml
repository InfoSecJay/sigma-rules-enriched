title: Use Short Name Path in Image
id: a96970af-f126-420d-90e1-d37bf25e50e1
related:
- id: 349d891d-fef0-4fe4-bc53-eee623a15969
  type: similar
status: test
description: Detect use of the Windows 8.3 short name. Which could be used as a 
  method to avoid Image detection
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/frack113/status/1555830623633375232
author: frack113, Nasreddine Bencherchali
date: 2022-08-07
modified: 2025-10-20
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '~1\'
    - '~2\'
  filter_main_system_process:
    ParentImage:
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\cleanmgr.exe'          # Spawns DismHost.exe with a shortened username (if too long)
  filter_main_installers:
  - Image|contains|all:
    - '\AppData\'
    - '\Temp\'
  - Image|endswith:
    - '~1\unzip.exe'
    - '~1\7zG.exe'
  filter_optional_webex:
    ParentImage|endswith: '\WebEx\WebexHost.exe'     # Spawns a shortened version of the CLI and Image processes
  filter_optional_thor:
    ParentImage|endswith: '\thor\thor64.exe'
  filter_optional_installshield:
  - Product: 'InstallShield (R)'
  - Description: 'InstallShield (R) Setup Engine'
  - Company: 'InstallShield Software Corporation'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Applications could use this notation occasionally which might generate some 
  false positives. In that case Investigate the parent and child process.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the usage of Windows 8.3 short filenames in process creation events, which may indicate an attempt to evade detection mechanisms targeting longer, more recognizable filenames. The likely attacker objective is to conceal malicious activities, such as executing tools or scripts that would normally be flagged due to their recognizable names or paths. This behavior corresponds to the MITRE ATT&CK technique: Defense Evasion - T1564.004.

  The primary telemetry source for this detection is Windows Process Creation logs, specifically Event ID 4688 and Sysmon Event ID 1, showcasing details of newly created processes. If malicious, this behavior may allow an adversary to execute payloads undetected, leading to unauthorized access or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate applications may also utilize short names.

  ### Investigation Steps

  - **Check parent process ID (PID):** Investigate the parent process of the triggered event using Event ID 4688. Look for known benign processes like `C:\Windows\System32\Dism.exe` or `C:\Windows\System32\cleanmgr.exe`. Legitimate usage typically shows these PIDs spawning child processes with short names.

  - **Review process command line arguments:** For suspicious short-form file paths, examine the command line arguments in the Event ID 4688 logs. Malicious indicators may include unusual flags or parameters that are not typical for standard applications or utilities.

  - **Analyze the full path of the executable:** Determine whether the suspicious executable is located in a known safe location (e.g., typical installation directories for utilities) or unusual locations (e.g., `%AppData%`, `%Temp%`). Executables in unauthorized locations are more likely to be malicious.

  - **Cross-verify with VirusTotal:** For any detected short filenames, upload the full paths to VirusTotal to check for known malware signatures. Malicious indicators may have a high rate of detections across various antivirus engines.

  - **Examine historical logs for related instances:** Review historical process creation logs for recurring use of the same short name across different time periods. Consistent usage of a short filename in conjunction with other suspicious activity can indicate a malicious workflow.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact, especially if it involves sensitive systems or known administrative tools. The likelihood of malicious abuse is moderate, as using short filenames is a common technique among adversaries to avoid detection. While this technique is not universally weaponized, its indication of evasion tactics warrants closer scrutiny.

  ### Blind Spots and Assumptions

  This detection may be circumvented by adversaries using alternative naming schemes or utilizing different evasion techniques that do not trigger short filename usage. The required log sources need to be configured correctly to capture all relevant process creation events; missing telemetry could lead to gaps in detection capabilities. Additionally, legitimate applications occasionally use short names, which may trigger false positives. A related detection for complete coverage would be monitoring for command-line patterns associated with common malicious tools or scripts.

