title: Use Short Name Path in Image
id: a96970af-f126-420d-90e1-d37bf25e50e1
related:
- id: 349d891d-fef0-4fe4-bc53-eee623a15969
  type: similar
status: test
description: Detect use of the Windows 8.3 short name. Which could be used as a method
  to avoid Image detection
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/frack113/status/1555830623633375232
author: frack113, Nasreddine Bencherchali
date: 2022-08-07
modified: 2025-10-20
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '~1\'
    - '~2\'
  filter_main_system_process:
    ParentImage:
    - 'C:\Windows\System32\Dism.exe'
    - 'C:\Windows\System32\cleanmgr.exe'          # Spawns DismHost.exe with a shortened username (if too long)
  filter_main_installers:
  - Image|contains|all:
    - '\AppData\'
    - '\Temp\'
  - Image|endswith:
    - '~1\unzip.exe'
    - '~1\7zG.exe'
  filter_optional_webex:
    ParentImage|endswith: '\WebEx\WebexHost.exe'     # Spawns a shortened version of the CLI and Image processes
  filter_optional_thor:
    ParentImage|endswith: '\thor\thor64.exe'
  filter_optional_installshield:
  - Product: 'InstallShield (R)'
  - Description: 'InstallShield (R) Setup Engine'
  - Company: 'InstallShield Software Corporation'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Applications could use this notation occasionally which might generate some false
  positives. In that case Investigate the parent and child process.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of Windows 8.3 short file names in process creation events on Windows systems. Short file names, often utilized for compatibility purposes, can also be exploited by malicious actors to obfuscate command-line activities and bypass security detections. Attackers leveraging this technique may aim to disguise potentially malicious tools or scripts, thus evading traditional security controls by using abbreviated paths that mask their true intent or origin.

  The relevant MITRE ATT&CK tactics associated with this detection include **Defense Evasion** (TA0005), specifically technique **T1564.004** (Hide Artifacts). This technique reflects how adversaries may attempt to manipulate file paths to avoid detection mechanisms. Primary data sources useful for investigation include **process creation event logs**, which provide visibility into command executions and associated file paths, as well as **Event Viewer logs on Windows systems** that detail process lifecycles and parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect logs from the process creation events to identify instances where a process was initiated with a short name format (~1, ~2). Pay special attention to the parent processes to ascertain context.

  - **Analyze Parent Process Context**: Investigate the parent process of the detected occurrences, focusing on well-known system processes such as `Dism.exe` and `cleanmgr.exe`, as these processes may legitimate short name usage.

  - **Correlate with Known Applications**: Examine the environment for legitimate applications that might use short names, such as installers and archivers. Identify any potential false positives stemming from this application behavior by verifying their typical usage within the network.

  - **Evaluate External Communication**: Check for any unusual outbound connections initiated by processes utilizing short names to identify possible data exfiltration or command and control communications, providing insights into potential malicious activity.

  ### Prioritization
  This alert is given medium severity due to the mixed potential for legitimate use cases against the high risk posed by its association with evasive malware behaviors. In a corporate environment, the use of short file names can indicate an attempt to circumvent detection mechanisms, necessitating thorough investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited for environments where process logging is not granular or where short names are used frequently as part of legitimate business applications. The detection logic assumes that the presence of short names indicates potentially malicious activity unless validated by the context of the parent and child processes. Required logs include detailed process creation events and associated metadata, which must be captured and configured appropriately for effective monitoring.

