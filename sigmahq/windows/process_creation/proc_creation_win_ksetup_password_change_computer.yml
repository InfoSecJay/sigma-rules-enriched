  ---

  ### Technical Context

  This Sigma rule detects the use of `ksetup.exe` to change the password of a computer's domain account or host principal. This behavior is indicative of an attacker attempting to gain control over or maintain persistence on a compromised system by altering the password, potentially to evade detection or access alteration.

  The relevant MITRE ATT&CK tactic is "Credential Access" (TA0006) with the technique "Account Manipulation" (T1098). The primary telemetry sources for this detection include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, which provide visibility on process executions and command line arguments. If this activity is malicious, it could result in unauthorized access to the domain and can compromise domain-wide controls.

  This detection does NOT confirm malicious intent on its own; legitimate administrative tasks or misconfigurations may result in similar behavior.

  ---

  ### Investigation Steps

  - **Review command line arguments:**
    Check the `CommandLine` field in Event ID 4688 for any instances of `ksetup.exe` with the argument `/setcomputerpassword`. Confirm whether it originates from expected administrative processes or user accounts.

  - **Correlate with user accounts:**
    Identify the user account associated with the execution in `Event ID 4688`. Verify if this account has administrative privileges. Legitimate users should typically be domain administrators or automated service accounts.

  - **Check process parentage:**
    Investigate the parent process (using Sysmon Event ID 1) to determine the context of how `ksetup.exe` was executed. Known administrative tools or scripts should be documented; any unknown or unexpected processes require further scrutiny.

  - **Inspect recent changes to domain accounts:**
    Cross-reference with Security Event IDs 4720 (user account creation) or 4740 (user account locked out) to identify recent changes to the target account associated with the password change.

  - **Evaluate the criticality of the host:**
    Assess the affected system's role within the environment (e.g., Domain Controller versus endpoint). Unauthorized changes on critical systems could indicate a higher severity incident.

  - **Monitor for account lockout or abnormal login attempts:**
    Review Security Event ID 4625 to track any failed login attempts that follow the password change. Multiple failures might indicate unauthorized access attempts to the system or account.

  ---

  ### Prioritization

  This alert is moderately severe. While changing computer passwords can be a legitimate administrative action, it frequently indicates a potential compromise attempt, especially when originating from unexpected sources or contexts. The likelihood of this behavior being weaponized by attackers makes it a significant indicator to investigate promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations are incomplete, particularly if Event ID 4688 is not collected consistently across all endpoints. Evasion techniques include using alternative tools for password manipulation that do not trigger this rule. Legitimate administrative actions, such as routine password updates by IT staff, may also trigger the alert. A companion detection to consider is monitoring for other credential manipulation events, such as changes captured in Security Event ID 4722 (user account enabled) or 4723 (attempted password change) which can provide broader context around the activity.

