detection:
  selection_img:
  - Image|endswith: '\ksetup.exe'
  - OriginalFileName: 'ksetup.exe'
  selection_cli:
    CommandLine|contains: ' /setcomputerpassword '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized or suspicious password changes for a computer's domain account using the `ksetup.exe` utility, often leveraged by attackers for persistent access or lateral movement within a network. The likely attacker objective is to gain control over domain-joined systems by altering their computer account passwords, potentially leading to unauthorized remote access or further exploitation.

  This behavior is relevant to the MITRE ATT&CK framework under the tactic of **Execution** (TA0002) and the technique of **Command-Line Interface** (T1059). Primary telemetry sources include process creation logs from Windows, specifically looking for `ksetup.exe` invocations. If the detection indicates malicious activity, it could compromise the security of the entire domain where the affected system resides. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative actions may trigger similar alerts.

  ### Investigation Steps

  - **Identify process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for processes involving `ksetup.exe`. Analyze the command line arguments for the presence of `/setcomputerpassword`. Legitimate use may include scripted updates from trusted domain administrators.

  - **Correlate system account activity**: Inspect Active Directory logs for recent changes to the computer account corresponding to the affected system's SID. Look for unexpected changes outside of normal administrative hours—this can indicate malicious activity.

  - **Examine the context of the execution**: Verify the parent process of `ksetup.exe` execution. Look for evidence that it was initiated from a legitimate administrative environment like a remote management tool. If it was triggered from suspicious locations (e.g., user profiles), this may indicate compromise.

  - **Monitor associated network traffic**: Capture and analyze any outbound traffic following the password change event. Look for unusual connections to external or internal systems that could indicate attempts to use the new credentials for lateral movement or data exfiltration.

  - **Review credential management activities**: Check telemetry for any recent requests or changes regarding computer account credentials or Group Policy modifications. Use Windows Event ID 4742 to identify domain account changes.

  ### Prioritization

  This alert has medium severity, as the affected system may have critical roles within the network. The likelihood of malicious exploitation through this behavior is moderate, particularly if combined with other suspicious indicators. Such methods are not uncommon for skilled adversaries aiming for persistence or domain privilege escalation.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate administrative processes that utilize `ksetup.exe` for valid purposes, leading to potential false positives. Ensuring comprehensive logging around process creation and Active Directory changes is necessary for reliable detection. Legitimate activities, such as routine password resets or automated scripts run by system administrators, may trigger alerts. Companion detections, such as monitoring for unexpected usage of tools like `netdom.exe` or `net.exe`, can enhance overall detection capabilities and provide context for security events.

