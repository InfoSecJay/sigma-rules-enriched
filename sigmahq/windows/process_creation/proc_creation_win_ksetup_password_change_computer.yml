title: Computer Password Change Via Ksetup.EXE
id: de16d92c-c446-4d53-8938-10aeef41c8b6
status: test
description: Detects password change for the computer's domain account or host principal
  via "ksetup.exe"
references:
- https://twitter.com/Oddvarmoe/status/1641712700605513729
- https://learn.microsoft.com/en-gb/windows-server/administration/windows-commands/ksetup
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-06
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ksetup.exe'
  - OriginalFileName: 'ksetup.exe'
  selection_cli:
    CommandLine|contains: ' /setcomputerpassword '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the `ksetup.exe` utility is used to change the password of a computer's domain account or host principal. This behavior is significant as it may indicate unauthorized attempts to manipulate computer credentials within an Active Directory environment. Attackers may leverage this technique to maintain access to compromised machines or escalate their privileges within a domain, facilitating lateral movement or data exfiltration.

  The relevant MITRE ATT&CK tactics and techniques related to this detection include **Execution (TA0002)** and **Credential Access (TA0006)**, specifically the technique **Credential Dumping (T1003)** and **Windows Credentials (T1555)**. The use of `ksetup.exe` for changing passwords can help attackers establish persistence on compromised systems, and as such, monitoring for this command execution is critical for identifying malicious activity.

  Primary data sources for enabling detection include process creation logs that capture details of executed processes, command line arguments, and associated user accounts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `ksetup.exe` being executed. Focus on the `CommandLine` argument, specifically looking for instances containing `/setcomputerpassword`.

  - **Correlate with User Activities**: Cross-reference the user account executing the process with other logs such as authentication attempts and system events to identify any suspicious behavior or anomalies.

  - **Inspect Domain Account Changes**: Analyze Active Directory logs and other relevant sources to evaluate recent changes to computer accounts, particularly focusing on unusual account modifications or password changes.

  - **Assess System Integrity**: Conduct a thorough review of the affected system for unauthorized changes or software installations that could indicate a broader compromise beyond the password change event.

  ### Prioritization
  This alert is assigned a medium severity level due to the potential impact of an unauthorized computer password change, which may enable an adversary to gain further access to domain resources. Given the likelihood of attackers exploiting credential manipulation, timely investigation is crucial.

  ### Blind Spots and Assumptions
  Detection logic may not capture instances where `ksetup.exe` is used legitimately for administrative purposes, which may lead to false positives. Assumptions include that all command-line executions and process creations are logged appropriately. Coverage may be limited by the configurations of the logging infrastructure, so ensuring comprehensive logging of process creations and command line arguments is essential for the efficacy of this alert.

