  ---

  ### Technical Context

  This detection rule identifies attempts to delete Windows Volume Shadow Copies using PowerShell commands, specifically via the use of WMI (Windows Management Instrumentation). Adversaries often utilize this tactic to eliminate recovery points, making it harder for victims to restore compromised systems, commonly seen in the behavior of ransomware families like Sodinokibi/REvil.

  The relevant MITRE ATT&CK tactic is **Impact** with the technique **Data Destruction (T1490)**. Primary telemetry sources include Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1 for CommandLine activity. If successful, malicious deletions can severely hinder data recovery capabilities, leading to a significant security impact. However, this detection does not confirm that a system has been successfully compromised or that the deletion was performed with malicious intent without further investigation.

  ---

  ### Investigation Steps

  - **Review command line activity:** Check Windows Security Event ID 4688 (Process Creation) for command lines containing `Get-WmiObject`, `Win32_ShadowCopy`, or `Remove-WmiObject` to identify suspicious PowerShell execution patterns.

  - **Validate the executing context:** Correlate identified events with the specific user account and process context to determine if the execution is legitimate or malicious, looking for unusual user accounts or abnormal parent processes.

  - **Assess volume shadow copy status:** Use the `vssadmin list shadows` command or check System Event Logs for Volume Shadow Copy events (Event IDs 13 and 27) before and after the suspicious commands to observe the state of volume shadow copies.

  - **Identify benign actions:** Consider common administrative tasks that may involve legitimate deletion of shadow copies, such as system maintenance scripts run by trusted administrative users, ensuring they are logged and correlated against expected schedules.

  - **Look for accompanying alerts:** Check for alerts related to PowerShell usage throughout the environment (e.g., Event ID 4104 for PowerShell scripts) to find any additional context or sequence of events leading to the shadow copy deletion.

  - **Investigate endpoint behavior:** Gather potential file creation artifacts by checking for temporary files or artifacts in the PowerShell Execution Policy settings that may indicate script execution and data exfiltration attempts post-deletion.

  ---

  ### Prioritization

  The alert is high severity due to the impact of the affected system — the deletion of volume shadow copies could indicate a significant data erasure event, likely tied to ransomware operations. The behavior is often weaponized in modern attacks, particularly regarding adversaries trying to hinder recovery efforts.

  ---

  ### Blind Spots and Assumptions

  Detection limitations arise from potential evasion techniques, such as disabling shadow copies through other mechanisms or using alternative methods outside of PowerShell. Reliable detection requires proper logging configurations for process creation and sufficient permissions to access Volume Shadow Copy settings. Additionally, legitimate IT operations such as routine server maintenance might unintentionally trigger the alert. A related or companion detection is monitoring for abnormal increases in volume shadow copy deletion or modification attempts, which can enhance overall detection coverage.

