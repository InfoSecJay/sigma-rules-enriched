note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell commands to delete Windows Volume Shadow Copies via WMI (Windows Management Instrumentation). Volume Shadow Copies are essential for creating system restore points and backups; thus, their deletion is a significant indicator of malicious activity, commonly associated with various ransomware families, notably Sodinokibi and REvil. Attackers aim to eliminate these backups to inhibit recovery efforts post-infection, thereby increasing the success of their ransomware campaigns.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Impact (TA0040)**: The overarching goal of interfering with system integrity or availability.
  - **Data Destruction (T1490)**: Specifically, deletion of volume shadow copies to prevent restoration of data.

  Primary data sources for evidence include **process creation events** from the Windows operating system. These logs can capture the command line arguments of processes spawned by PowerShell, which will reveal attempts to remove shadow copies.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for instances where PowerShell is invoked with command lines containing `Get-WmiObject`, `Get-CimInstance`, or specific WMI deletion methods. Look for patterns indicating malicious use of these commands.

  - **Correlate with System Changes**: Investigate any recent changes to shadow copies by checking the system's shadow copy storage. If a deletion was recorded in logs, cross-reference with user and process activity at that time.

  - **Analyze Related Activity**: Identify any other PowerShell activity around the same timeframe that might indicate broader malicious behavior, such as suspicious script executions or other WMI invocations that could correlate with potential exploitation.

  - **Check for Ransomware Indicators**: If the shadow copy deletion aligns with known ransomware behaviors, look for other indicators of compromise (IoCs) such as unusual file encryption, known ransomware binaries, or network connections to suspicious domains.

  ### Prioritization
  The severity of this alert is classified as high due to the critical role that volume shadow copies play in data recovery. The likelihood of ransomware attacks leveraging these deletions makes it imperative to respond quickly to mitigate potential data loss.

  ### Blind Spots and Assumptions
  There may be gaps in coverage if the organization's logging policies do not capture all necessary process creation events or if PowerShell command logging is not enabled. The detection logic assumes that attackers will use recognizable command sequences associated with WMI deletion, meaning highly skilled adversaries could potentially evade detection by using less common methods. Adequate configuration and retrieval of process creation logs are crucial for this alert to function effectively.

