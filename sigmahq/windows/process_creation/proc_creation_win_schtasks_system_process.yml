logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli:
    CommandLine|contains|windash: ' /create '
    CommandLine|contains:
    - ' audiodg'
    - ' conhost'
    - ' dwm.exe'
    - ' explorer'
    - ' lsass'
    - ' lsm'
    - ' mmc'
    - ' msiexec'
    - ' regsvr32'
    - ' rundll32'
    - ' services'
    - ' spoolsv'
    - ' svchost'
    - ' taskeng'
    - ' taskhost'
    - ' wininit'
    - ' winlogon'
  condition: all of selection_*
falsepositives:
- Legitimate system administration tasks scheduling trusted system processes.
level: high
note: |
  ### Technical Context

  This rule detects the creation of scheduled tasks using the legitimate Windows utility `schtasks.exe`, particularly when these tasks are associated with system processes like `lsass.exe` or `svchost.exe`. The likely attacker objective is to execute payloads or establish persistence by masquerading as these trusted processes. This behavior relates to the MITRE ATT&CK tactics of Execution (T1203.005), Persistence (T1053.005), and Defense Evasion (T1036.005).

  The primary telemetry sources are Windows process creation logs from Sysmon (Event ID 1) or Security Event ID 4688. If malicious, this behavior could allow an adversary to maintain control over the system, execute unauthorized commands, or avoid detection. However, it's important to note that the alert does NOT confirm malicious intent by itself; legitimate administrative tasks may trigger the same detection.

  ### Investigation Steps

  - **Inspect scheduled task creation events:** Review Windows Sysmon Event ID 1 or Security Event ID 4688 specifically for scheduled tasks created with `schtasks.exe`. Look for tasks whose command line includes system process names (e.g., 'lsass', 'svchost').

  - **Identify abnormal command line usage:** Search for command lines containing system process names along with the `/create` flag in Task Scheduler logs. Legitimate use will typically not invoke sensitive system processes for scheduling tasks.

  - **Correlate with system process logins:** Examine Event ID 4624 for successful logins that correspond to the time when the scheduled task was created. Legitimate activity will likely be initiated by a known administrator account, whereas malicious activity may show unusual or unexpected user accounts.

  - **Check task details for persistence goals:** Review the `schtasks` output for any unusual or recurrent scheduling frequencies (e.g., every minute) or task actions that point to executing less common or untrusted executables, which are indicators of malicious persistence.

  - **Analyze the host for other suspicious behavior:** Use endpoint detection tools or review recent logs for additional indicators of compromise (IoCs), such as file creations or modifications tied to the newly-scheduled tasks.

  - **Validate legitimate administrative tasks:** Confirm scheduled tasks related to normal operational procedures involving trusted system processes. Document expected use cases to differentiate between benign and malicious action.

  ### Prioritization

  This alert should be considered high-severity due to the potential security impact of unauthorized process execution on critical systems. The likelihood of exploitation increases, particularly in environments where adversaries commonly use scheduled tasks to maintain persistence and evade defenses.

  ### Blind Spots and Assumptions

  Evasion techniques may include modifying the command line to mask the process names or utilizing non-standard executable names. Reliable detection requires comprehensive logging of both Sysmon and Windows Security events. Legitimate administrative actions, such as software updates or scheduled maintenance tasks, may inadvertently trigger this alert. A complementary detection would include monitoring for unusual account privilege escalations (T1068) associated with system processes to enhance contextual understanding.

