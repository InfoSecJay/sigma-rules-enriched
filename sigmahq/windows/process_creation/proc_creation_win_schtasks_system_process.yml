logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli:
    CommandLine|contains|windash: ' /create '
    CommandLine|contains:
    - ' audiodg'
    - ' conhost'
    - ' dwm.exe'
    - ' explorer'
    - ' lsass'
    - ' lsm'
    - ' mmc'
    - ' msiexec'
    - ' regsvr32'
    - ' rundll32'
    - ' services'
    - ' spoolsv'
    - ' svchost'
    - ' taskeng'
    - ' taskhost'
    - ' wininit'
    - ' winlogon'
  condition: all of selection_*
falsepositives:
- Legitimate system administration tasks scheduling trusted system processes.
level: high
note: |
  ### Technical Context
  This rule detects the creation of scheduled tasks that masquerade as legitimate system processes. Threat actors may exploit the functionality of `schtasks.exe` to execute malicious payloads covertly or maintain persistence on compromised systems. The technique typically involves creating tasks that mimic well-known system processes to evade detection by security tools. Attackers often aim to establish a foothold within a network, further escalate privileges, or perform stealthy lateral movements, all while maintaining a low profile.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence (T1053.005)**: This involves creating scheduled tasks to ensure malicious software remains on a system even after reboots.
  - **Execution (T1059)**: Using scripts or command-line interfaces to execute created tasks.
  - **Privilege Escalation (T1068)**: Manipulating scheduled tasks to execute with elevated privileges if the task runs under a system account.

  The primary data sources for detecting this behavior are process creation logs, specifically focusing on entries related to `schtasks.exe`, as well as Windows event logs that capture command-line arguments utilized during the scheduled task creation process.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine recent Windows process creation logs to identify instances of `schtasks.exe` being invoked, focusing on command line arguments indicative of task creation.
  - **Analyze Command-Line Activity**: Investigate the command-line parameters used in the scheduled task creation. Look for suspicious arguments that reference legitimate system processes, as this may indicate an attempt to hijack or impersonate those processes.
  - **Correlate with User Activity**: Check for correlations with user activity logs to determine whether the task creation aligns with regular administrative actions. Look for unusual times or accounts that do not typically perform such tasks.
  - **Inspect Task Scheduler Entries**: Directly review the Task Scheduler to identify any newly created tasks that may not conform to standard organizational practices, especially those running under high-privilege accounts.

  ### Prioritization
  This alert is considered high severity due to the potential for attackers to leverage scheduled tasks for persistence and execution within an environment. Given that such activities may bypass traditional endpoint defenses and could lead to further exploitation, prompt investigation is critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if legitimate administrative tasks are frequently performed using `schtasks.exe`, leading to potential false positives. This detection logic assumes that organization practices are consistent and that deviations can be attributed to malicious activity. Required logs include those capturing command-line executions and detailed process creation events. Proper configuration of logging policy on Windows systems is necessary for effective monitoring and detection.

