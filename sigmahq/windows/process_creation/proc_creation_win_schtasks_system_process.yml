title: Scheduled Task Creation Masquerading as System Processes
id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
status: experimental
description: Detects the creation of scheduled tasks that involve system 
  processes, which may indicate malicious actors masquerading as or abusing 
  these processes to execute payloads or maintain persistence.
references:
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.stealth
- attack.t1053.005
- attack.t1036.004
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli:
    CommandLine|contains|windash: ' /create '
    CommandLine|contains:
    - ' audiodg'
    - ' conhost'
    - ' dwm.exe'
    - ' explorer'
    - ' lsass'
    - ' lsm'
    - ' mmc'
    - ' msiexec'
    - ' regsvr32'
    - ' rundll32'
    - ' services'
    - ' spoolsv'
    - ' svchost'
    - ' taskeng'
    - ' taskhost'
    - ' wininit'
    - ' winlogon'
  condition: all of selection_*
falsepositives:
- Legitimate system administration tasks scheduling trusted system processes.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks that improperly leverage system processes such as `winlogon` and `explorer`. Attackers often employ these tactics to execute malicious payloads or maintain persistence while masquerading as trusted system components. The relevant MITRE ATT&CK techniques are T1053.005 (Scheduled Task/Job: Scheduled Tasks) and T1036.004 (Masquerading: Rename System Utilities), as well as T1036.005 (Masquerading: Match Legitimate Name or Location). The primary telemetry sources are Windows process creation events (Security Event ID 4688 and Sysmon Event ID 1) focusing on command-line parameters. If malicious, this behavior can lead to unapproved persistence mechanisms and further compromise of the affected system. This detection alone does not confirm malicious intent without additional context.

  ### Investigation Steps

  - **Review scheduled task creation logs:** Check for Security Event ID 4698 or Sysmon Event ID 1 to find entries for newly created tasks. Look for unusual or unexpected scheduled tasks, especially those containing system process names.

  - **Analyze command line arguments:** Cross-reference the affected task’s CommandLine (Event ID 4688) against known legitimate system processes. Look for parameters indicating potential misuse, particularly any task creation commands that include `schtasks.exe` with suspicious arguments.

  - **Identify host role or asset criticality:** Determine the role of the host where the scheduled task was created. If it's a critical server or endpoint, prioritize the investigation, especially if the task is running under SYSTEM or NETWORK SERVICE accounts.

  - **Verify legitimate scheduled tasks:** Examine existing scheduled tasks via PowerShell commands like `Get-ScheduledTask` to compare against the detected task. Legitimate administrative activities should not entail creating tasks with system executable names.

  - **Look for high-confidence malicious indicators:** Validate if the scheduled task was created in a typical user profile or if it points to an unusual execution context. Creation of tasks that execute with `cmd.exe` or use flags that redirect to public URLs can be highly suspicious.

  ### Prioritization

  This alert is of high severity due to its potential impact on system integrity and persistence capabilities. The likelihood of exploitation is high, given that scheduled tasks are commonly used by adversaries to execute malicious actions stealthily. The behavior aligns closely with known tactics employed in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative actions could trigger this alert, especially with benign task creations involving system processes. Reliable detection requires comprehensive log collection from both Security Event IDs and Sysmon logs to cover diverse attack vectors. Regular system maintenance and configuration changes may also create noise. Related detection rules involving unusual parent-child process relationships (e.g., suspicious processes spawning `schtasks.exe`) can strengthen overall coverage against this attack pattern.

