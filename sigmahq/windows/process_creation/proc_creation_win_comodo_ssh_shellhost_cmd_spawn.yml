title: OpenEDR Spawning Command Shell
id: 7f3a9c2d-4e8b-4a7f-9d3e-5c6f8a9b2e1d
status: experimental
description: |
  Detects the OpenEDR ssh-shellhost.exe spawning a command shell (cmd.exe) or PowerShell with PTY (pseudo-terminal) capabilities.
  This may indicate remote command execution through OpenEDR's remote management features, which could be legitimate administrative activity or potential abuse of the remote access tool.
  Threat actors may leverage OpenEDR's remote shell capabilities to execute commands on compromised systems, facilitating lateral movement or other command-and-control operations.
author: '@kostastsale'
date: 2026-02-19
references:
- https://kostas-ts.medium.com/detecting-abuse-of-openedrs-permissive-edr-trial-a-security-researcher-s-perspective-fc55bf53972c
tags:
- attack.execution
- attack.t1059.003
- attack.lateral-movement
- attack.t1021.004
- attack.command-and-control
- attack.t1219
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    ParentImage|endswith: '\ITSMService.exe'
    Image|endswith: '\ssh-shellhost.exe'
    CommandLine|contains: '--pty'
  selection_cli_shell:
    CommandLine|contains:
    - 'bash'
    - 'cmd'
    - 'powershell'
    - 'pwsh'
  condition: all of selection_*
falsepositives:
- Legitimate use of OpenEDR for remote command execution
level: medium
note: |
  ### Technical Context

  This rule detects the execution of command shells (cmd.exe or PowerShell) triggered by the OpenEDR process, specifically `ssh-shellhost.exe`, utilizing pseudo-terminal (PTY) capabilities. This behavior is indicative of remote command execution, which can serve both legitimate administrative purposes or malicious intent by adversaries attempting lateral movement or command-and-control operations.

  Relevant MITRE ATT&CK techniques include Command and Scripting Interpreter (T1059.003) and Lateral Movement via Remote Services (T1021.004). The primary telemetry sources required are Windows Process Creation logs, specifically focusing on Event ID 4688. Malicious activity in this context can allow unauthorized users to execute arbitrary commands on compromised systems. This detection does NOT confirm that the activity is malicious without further context, as it can also result from legitimate administrative actions.

  ### Investigation Steps

  - **Check process creation details:** Review Windows Security Event ID 4688 logs for `ssh-shellhost.exe` with a ParentImage of `ITSMService.exe`. Look for attributes such as a CommandLine containing `--pty`; benign usage may include standard administrative commands.

  - **Identify command shell execution:** Find instances where the CommandLine contains `cmd.exe`, `powershell.exe`, `pwsh.exe`, or `bash`. Validate if these command executions align with typical administrative tasks, such as scripted maintenance or updates.

  - **Assess contextual user activity:** Monitor the user account associated with the `ssh-shellhost.exe` execution. Any remote administrative tasks should involve known administrative accounts with recent activity history and appropriate organizational oversight.

  - **Review session history:** Inspect OpenEDR logs for historical session connections and activity tied to the machine executing the command shell. This may clarify whether operations align with expected times and activities, helping to distinguish benign from potentially malicious behavior.

  ### Prioritization

  The alert severity is medium due to the potential for significant impact if the affected system contains sensitive data or critical operations. This behavior could be a red flag for advanced adversaries exploiting legitimate tools for malicious purposes, especially in enterprises where remote access is common.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as alteration of command patterns or the use of alternative remote management tools. Reliable detection necessitates proper logging configurations to capture event IDs from both process creation and the OpenEDR tool itself. Legitimate administrative tasks leveraging OpenEDR may trigger this alert, thus the need for cautious triage. A related detection to consider is monitoring for unauthorized remote sessions or unusual command executions within the same context to strengthen coverage against false negatives.

