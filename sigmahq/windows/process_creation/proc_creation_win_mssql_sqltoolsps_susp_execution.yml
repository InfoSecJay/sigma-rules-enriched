title: SQL Client Tools PowerShell Session Detection
id: a746c9b8-a2fb-4ee5-a428-92bee9e99060
status: test
description: |
  This rule detects execution of a PowerShell code through the sqltoolsps.exe utility, which is included in the standard set of utilities supplied with the Microsoft SQL Server Management studio.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/8283d8d91552213ded165fd36deb6cb9534cb443/yml/OtherMSBinaries/Sqltoolsps.yml
- https://twitter.com/pabraeken/status/993298228840992768
author: 'Agro (@agro_sev) oscd.communitly'
date: 2020-10-13
modified: 2026-10-31
tags:
- attack.execution
- attack.stealth
- attack.t1059.001
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\sqltoolsps.exe'
  - ParentImage|endswith: '\sqltoolsps.exe'
  - OriginalFileName: 'sqltoolsps.exe'
  filter:
    ParentImage|endswith: '\smss.exe'
  condition: selection and not filter
falsepositives:
- Direct PS command execution through SQLToolsPS.exe is uncommon, childprocess 
  sqltoolsps.exe spawned by smss.exe is a legitimate action.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where the `sqltoolsps.exe` utility is executed, particularly when spawned by the `smss.exe` process, which is indicative of potential evasion techniques being employed by an attacker. The likely attacker objective is to run PowerShell commands in a stealthy manner, bypassing typical logging mechanisms, particularly in environments using Microsoft SQL Server. This behavior fits within the MITRE ATT&CK framework under the tactics of Execution (T1203) and Stealth (T1059.001).

  The primary telemetry sources for this detection are Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior may indicate unauthorized command execution aimed at reconnaissance, lateral movement, or data exfiltration. It is important to note that this detection does NOT confirm malicious intent or actions on its own; further investigation is necessary contextualize the behavior.

  ### Investigation Steps

  - **Identify the process hierarchy**: Check for the parent-child relationship of `sqltoolsps.exe`. Use Event ID 4688 or Sysmon Event ID 1 to confirm that `sqltoolsps.exe` is spawned by `smss.exe`. Legitimate executions typically do not have `smss.exe` as a parent.

  - **Review command line arguments**: Examine the command line arguments associated with `sqltoolsps.exe` (Event ID 4688, `Process.CommandLine` field). Malicious parameters may indicate an intent to execute harmful scripts, while legitimate use often includes standard SQL operations.

  - **Cross-reference with legitimate applications**: Compare detected instances against known good software activities. Legitimate traffic will often involve standard SQL database management tasks and rarely involve direct execution of PowerShell commands.

  - **Monitor for additional behaviors**: Look for suspicious activity correlating with the usage of `sqltoolsps.exe`, such as unusual outbound connections or access attempts (Sysmon Event ID 3 for network connections). Malicious indicators may include unexpected remote IP addresses.

  - **Assess asset criticality and role**: Consider the role of systems running SQL Server. Higher-risk systems warrant closer scrutiny. Document any anomalies against the expected behavior of database management operations.

  ### Prioritization

  This alert has a medium severity due to the potential impact on sensitive database systems. While execution of `sqltoolsps.exe` is uncommon for regular operations, malicious abuse for command execution is plausible, and users often leverage this method to execute hidden PowerShell scripts.

  ### Blind Spots and Assumptions

  This detection may be bypassed through custom evasion techniques that do not utilize `sqltoolsps.exe`. It requires comprehensive logging configurations, as standard Windows logging may not capture all PowerShell activity. Legitimate administrative tasks might trigger the alert; thus, further context is needed. Companion detections should include PowerShell execution alerts (ATT&CK T1059) for enhanced coverage against stealthy execution techniques.

