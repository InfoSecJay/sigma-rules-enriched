title: SQL Client Tools PowerShell Session Detection
id: a746c9b8-a2fb-4ee5-a428-92bee9e99060
status: test
description: |
  This rule detects execution of a PowerShell code through the sqltoolsps.exe utility, which is included in the standard set of utilities supplied with the Microsoft SQL Server Management studio.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/8283d8d91552213ded165fd36deb6cb9534cb443/yml/OtherMSBinaries/Sqltoolsps.yml
- https://twitter.com/pabraeken/status/993298228840992768
author: 'Agro (@agro_sev) oscd.communitly'
date: 2020-10-13
modified: 2022-02-25
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\sqltoolsps.exe'
  - ParentImage|endswith: '\sqltoolsps.exe'
  - OriginalFileName: '\sqltoolsps.exe'
  filter:
    ParentImage|endswith: '\smss.exe'
  condition: selection and not filter
falsepositives:
- Direct PS command execution through SQLToolsPS.exe is uncommon, childprocess 
  sqltoolsps.exe spawned by smss.exe is a legitimate action.
level: medium
note: |
  ### Technical Context

  This rule detects executions of PowerShell code initiated through the `sqltoolsps.exe` utility, which is part of Microsoft SQL Server Management Studio. This tool can be misused by attackers to execute arbitrary PowerShell scripts while circumventing typical logging mechanisms that monitor script block logging. The likely objective for an attacker is to perform unauthorized operations against SQL databases or exfiltrate information while remaining under the radar of security monitoring solutions.

  The rule corresponds primarily to the MITRE ATT&CK technique for PowerShell execution (T1059.001) and involves evasion tactics (T1127). The primary telemetry sources required for effective detection include Windows process creation logs (Event ID 4688) and potential Sysmon logs. Malicious behavior could lead to unauthorized data access or manipulation within databases, while this detection alone does not confirm malicious intent, as the execution may be part of legitimate SQL management activities.

  ### Investigation Steps

  - **Check the process execution source**: Review Event ID 4688 for `sqltoolsps.exe` and determine the ParentImage. Confirm that it does not originate from unusual or high-risk processes (e.g., `smss.exe` is legitimate under specific scenarios).

  - **Examine command line parameters**: Review command line fields associated with the execution to identify any anomalous or unexpected operations indicative of malware or data exfiltration attempts, such as data export commands.

  - **Validate the context of the execution**: For expected behavior, verify that `sqltoolsps.exe` is executed during scheduled maintenance windows or by known administrative accounts, as opposed to anomalous times or from non-administrative roles.

  - **Identify linked processes**: Investigate any child processes spawned by `sqltoolsps.exe` that may indicate further malicious activities, focusing on Event ID 4688 for unexpected children processes or lateral movement indicators.

  - **Check for frequency of execution**: Review the number of times `sqltoolsps.exe` has executed recently. A spike in these events could signal either an attack in progress or a misconfigured automation task needing further investigation.

  ### Prioritization

  This alert is considered medium severity. The impact could be significant if an attacker is using `sqltoolsps.exe` to perform unauthorized database activities. However, the likelihood of malicious abuse depends on the context of use, including whether the execution aligns with normal administrative operations. While the tool can be weaponized, its legitimate uses in database management reduce the urgency of every alert.

  ### Blind Spots and Assumptions

  Detection may be limited as experienced adversaries could employ other legitimate tools or scripts to execute malicious code, bypassing this detection. Ensuring proper logging levels and settings for PowerShell script execution is critical for reliable coverage. Legitimate activities that may trigger this alert include automated SQL management scripts or valid administrative actions using SQL tools. A related detection rule monitoring direct PowerShell execution could enhance the overall visibility of potential misuse.

