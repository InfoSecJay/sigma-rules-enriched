title: SQL Client Tools PowerShell Session Detection
id: a746c9b8-a2fb-4ee5-a428-92bee9e99060
status: test
description: |
  This rule detects execution of a PowerShell code through the sqltoolsps.exe utility, which is included in the standard set of utilities supplied with the Microsoft SQL Server Management studio.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/8283d8d91552213ded165fd36deb6cb9534cb443/yml/OtherMSBinaries/Sqltoolsps.yml
- https://twitter.com/pabraeken/status/993298228840992768
author: 'Agro (@agro_sev) oscd.communitly'
date: 2020-10-13
modified: 2022-02-25
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\sqltoolsps.exe'
  - ParentImage|endswith: '\sqltoolsps.exe'
  - OriginalFileName: '\sqltoolsps.exe'
  filter:
    ParentImage|endswith: '\smss.exe'
  condition: selection and not filter
falsepositives:
- Direct PS command execution through SQLToolsPS.exe is uncommon, childprocess sqltoolsps.exe
  spawned by smss.exe is a legitimate action.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of PowerShell code via the `sqltoolsps.exe` utility, part of Microsoft SQL Server Management Studio. Malicious actors may use this utility to execute scripts while evading traditional logging mechanisms, as script blocks executed in this manner may not be captured. The relevant MITRE ATT&CK techniques include Execution (T1059.001, PowerShell) and Defense Evasion (T1127, Deobfuscate/Decode Files or Information). The primary telemetry source includes Windows process creation logs (Security Event ID 4688, Sysmon Event ID 1) which detail command-line usage and parent-child process relationships.

  If this behavior is malicious, it could indicate an attempt to exploit SQL Server environments or manipulate databases through unauthorized scripts. However, this alert does NOT confirm malicious intent by itself, as the execution of `sqltoolsps.exe` may be legitimate in certain contexts.

  ---

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `sqltoolsps.exe`. Pay particular attention to command-line arguments and parent process relationships.

  - **Identify parent process**: Validate that `sqltoolsps.exe` is not initiated directly by `smss.exe`, which should only be spawning legitimate child processes. Look for abnormal parent processes, or any unusual command-line arguments.

  - **Analyze command-line arguments**: Investigate any command-line parameters used with `sqltoolsps.exe`. Legitimate usage usually involves standard database management tasks, while suspicious ones may include obfuscated or nonsensical strings.

  - **Check for known benign uses**: Determine if the `sqltoolsps.exe` process correlates with authorized SQL Server administrative activities, such as automated database maintenance scripts executed through trusted management tools.

  - **Review system behavior and logs for File Exfiltration attempts**: If `sqltoolsps.exe` is executing scripts that result in file creation or data transfers, validate these logs against expected behavior patterns within your SQL Server environment.

  - **Cross-reference with threat intelligence**: Use threat intelligence feeds to assess if recent attacks have leveraged SQL tooling for malicious purposes, validating that the current activity aligns with such trends.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on SQL Server environments and the likelihood that adversaries may exploit tools like `sqltoolsps.exe` for unauthorized access or data manipulation. This behavior is not commonly weaponized, but its occurrence warrants close scrutiny.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques where duplicate file names or renamed utilities could bypass detection. Required log sources must ensure full process creation logging is enabled. Legitimate administrative operations using `sqltoolsps.exe` could trigger this alert, which necessitates contextual awareness and correlation with other logs. A companion detection for script-block execution via `powershell.exe` could enhance coverage against alternative abuse scenarios.

