title: SQL Client Tools PowerShell Session Detection
id: a746c9b8-a2fb-4ee5-a428-92bee9e99060
status: test
description: |
  This rule detects execution of a PowerShell code through the sqltoolsps.exe utility, which is included in the standard set of utilities supplied with the Microsoft SQL Server Management studio.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/8283d8d91552213ded165fd36deb6cb9534cb443/yml/OtherMSBinaries/Sqltoolsps.yml
- https://twitter.com/pabraeken/status/993298228840992768
author: 'Agro (@agro_sev) oscd.communitly'
date: 2020-10-13
modified: 2022-02-25
tags:
- attack.execution
- attack.stealth
- attack.t1059.001
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\sqltoolsps.exe'
  - ParentImage|endswith: '\sqltoolsps.exe'
  - OriginalFileName: '\sqltoolsps.exe'
  filter:
    ParentImage|endswith: '\smss.exe'
  condition: selection and not filter
falsepositives:
- Direct PS command execution through SQLToolsPS.exe is uncommon, childprocess 
  sqltoolsps.exe spawned by smss.exe is a legitimate action.
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of PowerShell code through the `sqltoolsps.exe` utility associated with Microsoft SQL Server Management Studio (SSMS). Attackers may utilize this utility to execute malicious PowerShell scripts due to its stealthy nature, circumventing traditional logging mechanisms that might not capture the content of script blocks. The likely objective of an attacker employing this technique is to exfiltrate data, pivot within the environment, or perform lateral movement.

  This behavior aligns with the MITRE ATT&CK technique for Execution (T1059.001 - PowerShell) and Persistence (T1127 - Trusted Developer Utilities). The primary telemetry sources for this detection are Windows event logs, specifically focusing on process creation events (Event ID 4688 for process creation and Sysmon Event ID 1 for detailed analysis). Malicious exploitation of this behavior can lead to unauthorized data access or system compromise. Importantly, this detection does not confirm malicious intent on its own, as legitimate uses of `sqltoolsps.exe` can occur in normal operational contexts.

  ### Investigation Steps

  - **Check for process creation events:** Review Windows Security Event ID 4688 logs for processes initiated with `sqltoolsps.exe`, paying attention to suspicious parent processes.

  - **Analyze parent process relationships:** Validate that the parent process is not `smss.exe` unless justified by expected behavior; legitimate execution typically involves a more common parent process like `powershell.exe` or SQL Server-related utilities.

  - **Identify command-line arguments:** Look at the command-line arguments in Event ID 4688 or Sysmon Event ID 1 associated with the `sqltoolsps.exe` process. Malicious indicators can include unusual PowerShell commands or encoded scripts.

  - **Evaluate execution frequency:** Determine if `sqltoolsps.exe` has been executed multiple times recently on critical assets, which may suggest an ongoing malicious campaign as opposed to isolated legitimate activity.

  - **Correlate with known benign usage:** Cross-check with system documentation or previous investigations to identify expected workflows that involve `sqltoolsps.exe`, infer context, and validate legitimacy.

  - **Review for file creation or exfiltration:** Look for related file operations in Windows XML Application Event logs or Sysmon Event ID 11 (file creation), as attackers may attempt to stage data for exfiltration post-execution.

  ### Prioritization

  This alert holds a medium severity due to the potential impact on critical systems using SQL Server. The likelihood of abuse is moderate, as this attack vector is relatively rare but can be weaponized by threat actors aiming for stealthy execution. Close monitoring of systems handling sensitive data is recommended due to the sensitive nature of potential operations originating from this utility.

  ### Blind Spots and Assumptions

  Legitimate usage of SQL tools or PowerShell scripts may inadvertently trigger this alert, particularly during administrative tasks or scheduled jobs. Detection may be limited if specific logging configurations are not enabled, such as ensuring detailed process creation logs are captured. Also, attackers may employ various evasion techniques, such as altering command-line arguments to make the activity appear benign. A companion detection of PowerShell activity via `Get-Command` or `Invoke-Expression` (T1059.001) would bolster the overall visibility into script execution in the enterprise environment.

