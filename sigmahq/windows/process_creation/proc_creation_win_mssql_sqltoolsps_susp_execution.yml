title: SQL Client Tools PowerShell Session Detection
id: a746c9b8-a2fb-4ee5-a428-92bee9e99060
status: test
description: |
  This rule detects execution of a PowerShell code through the sqltoolsps.exe utility, which is included in the standard set of utilities supplied with the Microsoft SQL Server Management studio.
  Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs.
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/8283d8d91552213ded165fd36deb6cb9534cb443/yml/OtherMSBinaries/Sqltoolsps.yml
- https://twitter.com/pabraeken/status/993298228840992768
author: 'Agro (@agro_sev) oscd.communitly'
date: 2020-10-13
modified: 2022-02-25
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\sqltoolsps.exe'
  - ParentImage|endswith: '\sqltoolsps.exe'
  - OriginalFileName: '\sqltoolsps.exe'
  filter:
    ParentImage|endswith: '\smss.exe'
  condition: selection and not filter
falsepositives:
- Direct PS command execution through SQLToolsPS.exe is uncommon, childprocess sqltoolsps.exe
  spawned by smss.exe is a legitimate action.
level: medium
note: |
  ### Technical Context
  This rule detects the execution of PowerShell code through the `sqltoolsps.exe` utility, a component of the Microsoft SQL Server Management Studio. The typical threat scenario involves an attacker using this utility to execute malicious PowerShell code while evading detection. Since script blocks executed by PowerShell are not logged when using this utility, it serves as an effective means to bypass security measures that rely on log analysis. The objective of an attacker using `sqltoolsps.exe` could be to access sensitive database information, manipulate data, or establish a foothold within the organization’s network.

  Relevant MITRE ATT&CK tactics and techniques for this rule include:
  - **Execution** (TA0002) – the attacker is executing commands.
    - **PowerShell** (T1059.001) – executing PowerShell commands through a legitimate tool.
  - **Defense Evasion** (TA0005) – the attacker aims to evade detection.
    - **Indicator Removal on Host** (T1127) – utilizing a trusted application to execute code in a hidden manner.

  The primary data sources for this detection are process creation events, which will show unusual invocations of the `sqltoolsps.exe`, specifically its parent process, indicating potentially unauthorized or malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for instances of `sqltoolsps.exe` being executed. Pay close attention to the parent process of the execution to identify any suspicious activity stemming from non-typical parent processes.

  - **Analyze Parent Process Information:** Identify if `sqltoolsps.exe` was parented by `smss.exe`. If found, investigate the legitimacy of this execution path, as direct PowerShell execution from classified processes can indicate a severe security compromise.

  - **Correlate with Other Activity:** Look for patterns or anomalies in complementary logs, such as network traffic or file access logs, during the time of the `sqltoolsps.exe` execution. Evidence of concurrent suspicious activity can provide context to the potential risk involved.

  - **Examine Application Whitelisting Logs:** If application whitelisting is in place, review the allowed and blocked instances of `sqltoolsps.exe`. Ensure compliance with organizational policy regarding its usage.

  ### Prioritization
  This alert has medium severity due to the potential for significant impact resulting from unauthorized database access or data exfiltration, coupled with the likelihood of misuse of legitimate tools for malicious purposes.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding the usage of `sqltoolsps.exe` in legitimate scenarios where it is used correctly, increasing the potential for false positives. The detection logic assumes that legitimate usage will not occur under suspicious parent processes, which might not always be true. Required logs for this alert include comprehensive process creation logs and configurations that retain detailed information on parent-child process relationships.

