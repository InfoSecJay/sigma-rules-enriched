detection:
  selection_nltest:
  - Image|endswith: '\nltest.exe'
  - OriginalFileName: 'nltestrk.exe'
  selection_recon:
  - CommandLine|contains|all:
    - 'server'
    - 'query'
  - CommandLine|contains:
    - '/user'
    - 'all_trusts'           # Flag for /domain_trusts
    - 'dclist:'
    - 'dnsgetdc:'
    - 'domain_trusts'
    - 'dsgetdc:'
    - 'parentdomain'
    - 'trusted_domains'
  condition: all of selection_*
falsepositives:
- Legitimate administration use but user and host must be investigated
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `nltest.exe`, a command-line utility used for querying domain-related information on Windows networks. The likely attacker objective is to gather reconnaissance data about the domain structure, including domain trusts and Active Directory components, which could facilitate further exploitation or lateral movement. This activity aligns with the MITRE ATT&CK tactics of Discovery (TA0007), and specifically techniques such as Domain Trust Discovery (T1482) and System Information Discovery (T1016).

  The primary telemetry sources include Windows process creation logs, specifically looking for Security Event ID 4688 and Sysmon Event ID 1. If malicious, the use of `nltest.exe` can lead to unauthorized data exfiltration or mapping of the network, potentially paving the way for follow-up attacks. It’s important to note that this detection alone does not prove malicious intent or successful compromise, as legitimate administrative tasks may trigger the same activity.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 and Sysmon Event ID 1 for processes running `nltest.exe`. Investigate user names and associated process trees for unusual activity.

  - **Analyze command line arguments**: Inspect the CommandLine field for common flags such as `/user` or keywords like `dclist:` and `domain_trusts`. Malicious indicators include the use of queries that return extensive domain trust information.

  - **Identify the executing user**: Cross-reference the executing user against legitimate administrative roles. Investigate any non-administrative users running `nltest.exe`, as this could be indicative of escalated privilege misuse.

  - **Evaluate legitimate administrative use**: Determine the context of the `nltest.exe` execution, checking for known scheduled tasks or recent IT operations involving domain queries. Legitimate use is typically planned and documented.

  - **Cross-check against network logs**: Validate the presence of unusual outbound network activity corresponding to this process. Look for DNS queries or LDAP communications that accompany the `nltest.exe` execution, particularly towards unknown or suspicious hosts.

  - **Identify associated scripts or programs**: Investigate if `nltest.exe` was called by other scripts or processes. High-confidence malicious indicators would include automated scripts that execute commands without user interactivity or that access sensitive areas of the network.

  ### Prioritization

  This alert has a medium severity level due to the potential for data gathering that could lead to a larger compromise. The affected system could hold significant value in a domain environment, making it a target for attackers. While reconnaissance itself may not indicate an immediate threat, such behavior is often a precursor to more aggressive attack actions.

  ### Blind Spots and Assumptions

  Detection may be limited by settings not logging command-line parameters or by administrative usage patterns that mask malicious activities. Additionally, legitimate use of `nltest.exe` by authorized personnel for domain management can trigger false positives. Companion detections that could enhance detection efficacy include monitoring for unusual user behavior through User Behavior Analytics (UBA) and tracking known malicious IP addresses or domains in network logs.

