detection:
  selection_nltest:
  - Image|endswith: '\nltest.exe'
  - OriginalFileName: 'nltestrk.exe'
  selection_recon:
  - CommandLine|contains|all:
    - 'server'
    - 'query'
  - CommandLine|contains:
    - '/user'
    - 'all_trusts'           # Flag for /domain_trusts
    - 'dclist:'
    - 'dnsgetdc:'
    - 'domain_trusts'
    - 'dsgetdc:'
    - 'parentdomain'
    - 'trusted_domains'
  condition: all of selection_*
falsepositives:
- Legitimate administration use but user and host must be investigated
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of `nltest.exe` with command-line parameters indicative of reconnaissance activities on Windows networks, particularly aimed at querying domain trusts and server information. An attacker may leverage this tool to gather information about the network structure and domain relationships, which can facilitate later stages of an attack, such as lateral movement or privilege escalation. The relevant MITRE ATT&CK techniques are **Discovery** (T1016) and **Network Service Scanning** (T1482).

  Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which track the execution of `nltest.exe`. If malicious, this behavior can expose critical information about trust relationships between domains and potential targets for further exploitation. Importantly, this detection does NOT confirm malicious intent on its own, as `nltest.exe` may be used for legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Review process creation events**: Check Security Event ID 4688 or Sysmon Event ID 1 for `nltest.exe` execution, focusing on the parent process. Note benign administrative use with expected command-line parameters like `/server` or `/domain_trusts`.

  - **Analyze command-line arguments**: Identify suspicious command-line arguments such as `query`, `all_trusts`, or `dnsgetdc:` that indicate potential reconnaissance. Malicious indicators include combinations that reveal trust relationships or retrieve sensitive domain information.

  - **Correlate user activity**: Investigate the user account associated with the `nltest.exe` execution. Determine if the user has previous legitimate administrative activity within the context of their role.

  - **Check for unusual behavior**: Review for multiple rapid executions of `nltest.exe` across different systems. This pattern may indicate automated reconnaissance tools or scripts.

  - **Cross-reference with system logs**: Examine Windows Event Logs for suspicious logins or account anomalies around the same timeframe. This may provide context for potentially adversarial actions.

  - **Validate access to sensitive systems**: Monitor for changes or access attempts to critical infrastructure following the execution of `nltest.exe`, checking for unusual traffic or failed authentications in logs (Event ID 4625).

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical infrastructure if reconnaissance leads to successful subsequent attacks. The likelihood of malicious abuse is moderate, as the tool is commonly used for legitimate administrative tasks, yet it is also favored by attackers for its stealth and effectiveness in discovering network configurations.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by scenarios where log collection is misconfigured or if the command executes in a non-standard manner, leading to insufficient logging. Legitimate administrative activities may trigger this alert, particularly in environments with frequent domain restructuring or evaluations. A related detection to consider could be monitoring for unexpected access attempts using DCOM or RPC services that indicate lateral movement (e.g., detecting `wmic.exe` commands or suspicious remote management activities), which would help strengthen overall visibility.

