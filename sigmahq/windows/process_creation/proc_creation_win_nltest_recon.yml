detection:
  selection_nltest:
  - Image|endswith: '\nltest.exe'
  - OriginalFileName: 'nltestrk.exe'
  selection_recon:
  - CommandLine|contains|all:
    - 'server'
    - 'query'
  - CommandLine|contains:
    - '/user'
    - 'all_trusts'           # Flag for /domain_trusts
    - 'dclist:'
    - 'dnsgetdc:'
    - 'domain_trusts'
    - 'dsgetdc:'
    - 'parentdomain'
    - 'trusted_domains'
  condition: all of selection_*
falsepositives:
- Legitimate administration use but user and host must be investigated
level: medium
note: |
  ### Technical Context
  This rule detects potential reconnaissance activity conducted through the use of `nltest.exe`, a built-in Windows command-line utility. Attackers can leverage `nltest` for information gathering, including querying domain trusts, listing domain controllers, and identifying users. Such activities often serve as a precursor to more invasive attack vectors, allowing attackers to map out the environment's structure and relationships, particularly within Active Directory.

  The primary goal of an attacker executing `nltest` is typically to gather intelligence that can be used in future exploitation scenarios, including privilege escalation or lateral movement (MITRE ATT&CK techniques T1016: System Network Configuration Discovery and T1482: Domain Trust Discovery). The relevant inputs for this detection primarily stem from process creation data, where command-line arguments can indicate potentially malicious activity.

  Primary sources to monitor include:
  - **Windows Process Creation Logs:** These logs will show the execution of `nltest.exe` along with its command-line parameters.
  - **Event Logs for User Activity:** Tracking user actions and command executions can pinpoint when potentially unauthorized `nltest` queries are made.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for instances of `nltest.exe` being invoked with suspicious command-line arguments that suggest reconnaissance, such as `/user`, `all_trusts`, or `dc:list`.
  - **Analyze User Context:** Investigate the user account associated with the `nltest` execution. Validate whether this user has legitimate administrative tasks or if they are using elevated privileges inappropriately.
  - **Cross-reference with Active Directory Logs:** Use logs to identify if the queried domain trusts or domain controller information correspond with authorized access patterns for the user in question.
  - **Monitor Network Traffic:** Analyze any potentially associated network communications for other indicators of lateral movement or reconnaissance related to domain trusts or DC enumeration.

  ### Prioritization
  The severity of this alert is considered medium because while reconnaissance activity can precede more severe attacks, alone it may not necessarily indicate an immediate threat. However, in the context of recent compromises, particularly with sophisticated adversaries, it warrants close investigation.

  ### Blind Spots and Assumptions
  There may be blind spots in detection if logging for process creation or command-line arguments is not adequately enabled on all Windows endpoints. The detection logic assumes that all potentially malicious uses of `nltest.exe` can be discerned solely from its command-line arguments. Additionally, if an attacker uses alternative tools or methods for the same reconnaissance goals, those actions would not be captured by this detection rule. Proper logging configurations and comprehensive monitoring of user activities are essential for the effective operation of this alert.

