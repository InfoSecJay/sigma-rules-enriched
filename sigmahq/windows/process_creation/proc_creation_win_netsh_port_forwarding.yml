title: New Port Forwarding Rule Added Via Netsh.EXE
id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
status: test
description: Detects the execution of netsh commands that configure a new port forwarding
  (PortProxy) rule
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
- https://adepts.of0x.cc/netsh-portproxy-code/
- https://www.dfirnotes.net/portproxy_detection/
author: Florian Roth (Nextron Systems), omkar72, oscd.community, Swachchhanda Shrawan
  Poudel
date: 2019-01-29
modified: 2023-09-01
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli_1:
    CommandLine|contains|all:
    - 'interface'
    - 'portproxy'
    - 'add'
    - 'v4tov4'
  selection_cli_2:
    CommandLine|contains|all:
            # Example: netsh I p a v l=8001 listena=127.0.0.1 connectp=80 c=192.168.1.1
    - 'i '         # interface
    - 'p '         # portproxy
    - 'a '         # add
    - 'v '         # v4tov4
  selection_cli_3:
    CommandLine|contains|all:
    - 'connectp'
    - 'listena'
    - 'c='
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate administration activity
- WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723)
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `netsh.exe` commands that create new port forwarding rules (specifically using `PortProxy`) on Windows systems. Attackers may employ this technique to redirect network traffic as a method to bypass network restrictions or to establish covert communication channels as part of lateral movement or command-and-control (C2) operations. The presence of port forwarding may indicate that an adversary is attempting to manipulate network routes to facilitate unauthorized access or data exfiltration.

  Relevant MITRE ATT&CK techniques include:
  - **T1090**: Proxy (specifically, the use of network proxies for covert communication).
  - **T1075**: Pass the Hash (which may be used in conjunction with lateral movement tactics).
  - **T1219**: Remote Access Tools (particularly when establishing connectivity over altered network paths).

  Primary data sources that provide valuable insights include process creation events (to catch the invocation of `netsh.exe`), network logs (to monitor unusual connections), and security event logs related to port configuration changes.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the process creation logs to identify instances of `netsh.exe` running with command line arguments indicative of port forwarding setup. Pay special attention to the time of execution and user context.

  - **Inspect Network Traffic Logs**: Examine network traffic logs for unusual port access patterns or new communication endpoints that correspond with the newly created port forwarding rules. Look for traffic anomalies typically associated with port redirection.

  - **Correlate with User Behavior**: Identify the user account that executed the command. Determine if this action aligns with typical administrative activities or if it appears anomalous, potentially indicating malicious intent.

  - **Assess System Configuration Changes**: Review related log files that record changes to network configuration settings, particularly any modifications made to existing network rules that coincide with suspicious activities.

  ### Prioritization
  The severity of this alert is medium due to the potential for significant impact on the network if attackers successfully manipulate traffic routes for unauthorized access. However, occurrences may also stem from legitimate administrative functions, hence the need for contextual investigation.

  ### Blind Spots and Assumptions
  This detection logic may miss occurrences of port forwarding created through other means, such as PowerShell scripts or third-party tools. It assumes that `netsh.exe` is used in its standard form without modification. Additionally, the detection effectiveness relies heavily on capturing all relevant process creation logs and command line arguments, which may require specific configurations and settings to be adequately monitored.

