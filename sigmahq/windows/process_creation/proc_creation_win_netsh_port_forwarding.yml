title: New Port Forwarding Rule Added Via Netsh.EXE
id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
status: test
description: Detects the execution of netsh commands that configure a new port forwarding
  (PortProxy) rule
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
- https://adepts.of0x.cc/netsh-portproxy-code/
- https://www.dfirnotes.net/portproxy_detection/
author: Florian Roth (Nextron Systems), omkar72, oscd.community, Swachchhanda Shrawan
  Poudel
date: 2019-01-29
modified: 2023-09-01
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli_1:
    CommandLine|contains|all:
    - 'interface'
    - 'portproxy'
    - 'add'
    - 'v4tov4'
  selection_cli_2:
    CommandLine|contains|all:
            # Example: netsh I p a v l=8001 listena=127.0.0.1 connectp=80 c=192.168.1.1
    - 'i '         # interface
    - 'p '         # portproxy
    - 'a '         # add
    - 'v '         # v4tov4
  selection_cli_3:
    CommandLine|contains|all:
    - 'connectp'
    - 'listena'
    - 'c='
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate administration activity
- WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723)
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of `netsh.exe` commands that create new port forwarding (PortProxy) rules on Windows systems. Attackers may use these commands to bypass network restrictions or facilitate lateral movement by forwarding local ports to external addresses, thereby facilitating command and control communications (C2) or unauthorized access to internal resources. This activity falls under the MITRE ATT&CK framework, specifically in the Lateral Movement (T1075) and Command and Control (T1090) techniques.

  Primary telemetry sources include process creation events, specifically capturing Execution via Windows Security Event ID 4688 or Sysmon Event ID 1, capturing the command-line arguments used. If executed maliciously, port forwarding could allow attackers to exfiltrate or manipulate data undetected. However, this detection does NOT confirm malicious intent without additional contextual evidence or corroborating indicators.

  ---

  ### Investigation Steps

  - **Review command history:** Check Security Event ID 4688 and Sysmon Event ID 1 for `netsh.exe` execution, focusing on CommandLine which includes `interface`, `portproxy`, and `add` parameters. Look for unusual source processes or scripts invoking `netsh`.

  - **Identify network configurations:** Validate existing port forwarding rules through `netsh interface portproxy show all`, to distinguish between legitimate configurations and suspicious changes.

  - **Assess system role and impact:** Determine the criticality of the affected host. Servers, especially those hosting sensitive applications or user data, warrant higher scrutiny compared to non-critical systems.

  - **Cross-reference with known baselines:** Compare discovered command-line entries with documented changes in your organization. Legitimate admins may use similar commands, particularly for WSL or Docker configurations, but these should be traceable/logged.

  - **Analyze network traffic:** Monitor outbound connections on newly created port forwards using tools or logs from firewalls or SIEMs. Look for connections targeting known malicious IPs or unusual data exfiltration patterns.

  ---

  ### Prioritization

  The alert severity is medium due to potential impact on critical infrastructure and the likelihood of this technique being weaponized by attackers for C2 purposes. While legitimate uses exist, the presence of a new port forwarding rule warrants investigation to rule out malicious activity.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by using alternative tools or commands to achieve similar port forwarding capabilities, such as using PowerShell or other network utilities not covered by this rule. Required logs include those for process creation and network configuration changes. Legitimate administration tasks may trigger this alert, especially in environments utilizing WSL or Docker. Companion detections that provide insight into network traffic behavior may enhance overall visibility, such as monitoring for unexpected outbound connections post-rule creation.

  ---

