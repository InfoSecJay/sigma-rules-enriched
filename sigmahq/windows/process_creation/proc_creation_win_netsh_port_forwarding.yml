title: New Port Forwarding Rule Added Via Netsh.EXE
id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
status: test
description: Detects the execution of netsh commands that configure a new port 
  forwarding (PortProxy) rule
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
- https://adepts.of0x.cc/netsh-portproxy-code/
- https://www.dfirnotes.net/portproxy_detection/
author: Florian Roth (Nextron Systems), omkar72, oscd.community, Swachchhanda 
  Shrawan Poudel
date: 2019-01-29
modified: 2023-09-01
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli_1:
    CommandLine|contains|all:
    - 'interface'
    - 'portproxy'
    - 'add'
    - 'v4tov4'
  selection_cli_2:
    CommandLine|contains|all:
            # Example: netsh I p a v l=8001 listena=127.0.0.1 connectp=80 c=192.168.1.1
    - 'i '         # interface
    - 'p '         # portproxy
    - 'a '         # add
    - 'v '         # v4tov4
  selection_cli_3:
    CommandLine|contains|all:
    - 'connectp'
    - 'listena'
    - 'c='
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate administration activity
- WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. 
  https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723)
level: medium
note: |
  ### Technical Context

  This rule detects the execution of **netsh.exe** commands that configure new port forwarding (PortProxy) rules, commonly used for bypassing network restrictions or facilitating command-and-control (C2) communications. The likely attacker objective would be to establish persistence or lateral movement through a network by redirecting traffic from one IP address and port to another. This falls under MITRE ATT&CK tactic **Lateral Movement** (TA_LATERAL_MV) and technique **Port Forwarding** (T1090).

  Primary telemetry sources include **Windows Process Creation** logs, specifically focusing on **Security Event ID 4688** and potentially **Sysmon Event ID 1**. If malicious, this behavior can allow adversaries to bypass firewall restrictions and facilitate unauthorized access or data exfiltration. Importantly, this detection alone does NOT confirm malicious intent; legitimate administrative tasks could also trigger this rule.

  ### Investigation Steps

  - **Review command details: ** Check the CommandLine field of Security Event ID 4688 for patterns matching **'netsh.exe interface portproxy add v4tov4'.** This indicates a potential port forwarding setup. Compare with documented benign usage.

  - **Identify source IP address: ** Analyze the originating process's network activity through Sysmon Network Connection events (Event ID 3) to determine if any suspicious external IP addresses are being contacted through the configured port proxy.

  - **Cross-check scheduled tasks or startup entries: ** Investigate the system for **Task Scheduler** entries (Event ID 4800) or startup programs that may indicate the establishment of persistence mechanisms following the creation of a port forwarding rule.

  - **Assess the system role: ** Confirm if the affected host is a server or critical asset, as port forwarding on such systems can pose a higher risk compared to workstations, especially if the configurations are non-routine.

  - **Validate network traffic: ** Examine firewall or network logs to identify potential traffic being forwarded by the new port rule—specifically, connections via the ports defined in the portproxy setup and correlate them with any unusual outbound connections.

  - **Identify benign activity: ** Verify common legitimate uses of port proxying in your environment, such as WSL2 configurations or legitimate admin tasks, to distinguish between normal and questionable behavior.

  ### Prioritization

  The alert should be treated as medium severity. While port forwarding functionality may be a common administrative task, its misuse can lead to significant security risks, especially if it is employed to bypass network defenses for lateral movement or covert C2 communication. Attackers may frequently weaponize this technique when gaining access to compromised networks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like using alternative tools (e.g., PowerShell) for port forwarding, which may not trigger this rule. Ensure that logging is enabled for process creation, including Sysmon logs, to capture detailed command execution. Legitimate activities, such as administrative scripts or services that require port forwarding for operational purposes, may inadvertently trigger this alert. A related detection rule for unusual **PowerShell commands** (T1059.001) can provide stronger coverage against command-line-based threats exploiting similar functionalities.

