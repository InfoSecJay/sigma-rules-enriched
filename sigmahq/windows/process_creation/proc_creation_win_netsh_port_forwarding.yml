title: New Port Forwarding Rule Added Via Netsh.EXE
id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
status: test
description: Detects the execution of netsh commands that configure a new port 
  forwarding (PortProxy) rule
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
- https://adepts.of0x.cc/netsh-portproxy-code/
- https://www.dfirnotes.net/portproxy_detection/
author: Florian Roth (Nextron Systems), omkar72, oscd.community, Swachchhanda 
  Shrawan Poudel
date: 2019-01-29
modified: 2023-09-01
tags:
- attack.lateral-movement
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli_1:
    CommandLine|contains|all:
    - 'interface'
    - 'portproxy'
    - 'add'
    - 'v4tov4'
  selection_cli_2:
    CommandLine|contains|all:
            # Example: netsh I p a v l=8001 listena=127.0.0.1 connectp=80 c=192.168.1.1
    - 'i '         # interface
    - 'p '         # portproxy
    - 'a '         # add
    - 'v '         # v4tov4
  selection_cli_3:
    CommandLine|contains|all:
    - 'connectp'
    - 'listena'
    - 'c='
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate administration activity
- WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. 
  https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723)
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `netsh.exe` commands that configure new port forwarding rules using the PortProxy feature, which can be indicative of lateral movement or command-and-control activities by an adversary. The primary objective of utilizing port forwarding is often to bypass network restrictions, allowing unauthorized access to internal systems or services and facilitating malicious communications that evade defensive controls.

  This behavior aligns with the MITRE ATT&CK Tactic of **Lateral Movement** (TA0008) and **Command and Control** (TA0011), specifically the technique of **Application Layer Protocol** (T1090). The primary telemetry sources involved are Windows process creation logs, specifically looking for Security Event ID 4688 or Sysmon Event ID 1. If malicious, this activity could allow attackers to exfiltrate data or maintain persistence within the network. However, this detection alone does NOT confirm malicious intent; it could also reflect legitimate administrative actions.

  ### Investigation Steps

  - **Review command line usage:** Inspect the command line from Security Event ID 4688 to identify the exact parameters used with `netsh.exe`. Look for suspicious flags involving `portproxy`, `add`, `connectp`, and `listena`.

  - **Validate process legitimacy:** Confirm the parent process of `netsh.exe` is related to a legitimate administrative task or if it originates from an unrelated or unexpected process, indicating potential compromise.

  - **Analyze network configurations:** Check for any recent changes to network configurations or firewall settings, especially new port forwarding rules. This can be done via Windows Server logs or PowerShell cmdlets that validate existing portproxy mappings.

  - **Identify unexpected network behavior:** Examine firewall logs (Windows Event ID 5156 or network monitoring tools) for outbound connections to non-standard ports or IP addresses initiated shortly after `netsh.exe` was executed. This may confirm malicious intent.

  - **Confirm known legitimate uses:** Investigate if there’s a history of `netsh` being used legitimately in your environment, such as script executions for WSL or container management. Cross-reference with system modification dates and authorized change logs.

  - **Look for related artifacts:** Validate the presence of any file creation or modification artifacts related to remote management tools post-execution of the `netsh` command. Check for logs indicating data exfiltration or unusual data transfers.

  ### Prioritization

  The severity of this alert is considered medium due to the potentially significant impact of affecting internal systems, alongside a moderate likelihood of malicious abuse. The specific behavior of using port forwarding is a technique commonly weaponized in lateral movement and establishing command-and-control channels.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate tools for administration that trigger this rule, leading to potential false positives. It is critical to ensure that Windows Event Logging is enabled for process creation and that PowerShell logs are monitored. Legitimate administrative activities, such as using `netsh.exe` for infrastructure management, may trigger this alert. A related detection, such as monitoring the use of Windows Management Instrumentation (WMI) for unauthorized access, can strengthen overall visibility into potential security incidents.

