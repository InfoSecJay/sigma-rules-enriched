title: Uncommon Child Process Of Appvlp.EXE
id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
status: test
description: |
  Detects uncommon child processes of Appvlp.EXE
  Appvlp or the Application Virtualization Utility is included with Microsoft Office. Attackers are able to abuse "AppVLP" to execute shell commands.
  Normally, this binary is used for Application Virtualization, but it can also be abused to circumvent the ASR file path rule folder
  or to mark a file as a system file.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Appvlp/
author: Sreeman
date: 2020-03-13
modified: 2023-11-09
tags:
- attack.t1218
- attack.defense-evasion
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\appvlp.exe'
    # Note: Filters based on data from EchoTrail: https://www.echotrail.io/insights/search/appvlp.exe/
  filter_main_generic:
    Image|endswith:
    - ':\Windows\SysWOW64\rundll32.exe'
    - ':\Windows\System32\rundll32.exe'
  filter_optional_office_msoasb:
    Image|contains: ':\Program Files\Microsoft Office'
    Image|endswith: '\msoasb.exe'
  filter_optional_office_skype:
    Image|contains|all:
    - ':\Program Files\Microsoft Office'
    - '\SkypeSrv\'
    Image|endswith: '\SKYPESERVER.EXE'
  filter_optional_office_msouc:
    Image|contains: ':\Program Files\Microsoft Office'
    Image|endswith: '\MSOUC.EXE'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies unusual child processes spawned from the legitimate `appvlp.exe` executable, which is part of Microsoft Office's Application Virtualization Utility. While `AppVLP` primarily serves functional roles in virtualizing applications, attackers may exploit this utility to execute malicious commands without being easily detected. By monitoring its child processes, security teams can identify potential misuse, especially if the child processes diverge from typical behavior patterns associated with legitimate operations.

  The likely threat scenario involves adversaries leveraging `AppVLP` to bypass security restrictions, executing payloads or scripts that could steal data, manipulate files, or establish a foothold within the environment. This behavior falls under the **Execution** tactic (TA0002), specifically using **Command and Scripting Interpreter** (T1059) and **Malicious Software** (T1218) techniques, where attackers manipulate common system binaries to execute their commands covertly.

  To effectively collect evidence of such activities, process creation logs from Windows systems are essential, as they provide insights into parent and child process relationships, parameters used, and execution paths.

  ### Investigation Steps
  - **Verify the Process Chain:** Review the Windows process creation logs to confirm that the anomalous child process is indeed spawned from `appvlp.exe`. Check for unusual command-line arguments or execution paths that deviate from expected behavior.

  - **Assess Parent-Child Relationships:** Look for additional processes that may also be spawned from `appvlp.exe`. Investigate their legitimacy by reviewing execution timestamps and comparing them against typical usage patterns of legitimate applications.

  - **Collect and Analyze Artifacts:** Gather related artifacts such as the system event logs, any network activity generated by the processes, and data from memory analysis if the instance is suspicious enough to warrant further investigation.

  - **Correlate with Threat Intelligence:** Confirm whether the identified behavior aligns with known threat actor techniques or recent incidents. Use threat intelligence sources to contextualize the findings and determine if the identified activity is part of a broader attack pattern.

  ### Prioritization
  The medium severity of this alert stems from the potential for attackers to gain significant control over the environment by executing arbitrary commands using the `appvlp.exe` process. Given that this abuse may bypass common security measures, it warrants immediate investigation to mitigate any potential threats.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes false negatives stemming from benign applications using `appvlp.exe` in legitimate ways, which may cause overlaps with expected behaviors. The detection logic assumes that all common child processes of `appvlp.exe` are benign unless they align with the specified filters. Additionally, comprehensive monitoring of process creation events is required for this detection rule to function effectively. If monitoring on Windows systems is incomplete, there is a risk of undetected malicious use.

