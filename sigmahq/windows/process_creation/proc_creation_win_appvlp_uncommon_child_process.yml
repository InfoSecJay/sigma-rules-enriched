title: Uncommon Child Process Of Appvlp.EXE
id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
status: test
description: |
  Detects uncommon child processes of Appvlp.EXE
  Appvlp or the Application Virtualization Utility is included with Microsoft Office. Attackers are able to abuse "AppVLP" to execute shell commands.
  Normally, this binary is used for Application Virtualization, but it can also be abused to circumvent the ASR file path rule folder
  or to mark a file as a system file.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Appvlp/
author: Sreeman
date: 2020-03-13
modified: 2023-11-09
tags:
- attack.t1218
- attack.defense-evasion
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\appvlp.exe'
    # Note: Filters based on data from EchoTrail: https://www.echotrail.io/insights/search/appvlp.exe/
  filter_main_generic:
    Image|endswith:
    - ':\Windows\SysWOW64\rundll32.exe'
    - ':\Windows\System32\rundll32.exe'
  filter_optional_office_msoasb:
    Image|contains: ':\Program Files\Microsoft Office'
    Image|endswith: '\msoasb.exe'
  filter_optional_office_skype:
    Image|contains|all:
    - ':\Program Files\Microsoft Office'
    - '\SkypeSrv\'
    Image|endswith: '\SKYPESERVER.EXE'
  filter_optional_office_msouc:
    Image|contains: ':\Program Files\Microsoft Office'
    Image|endswith: '\MSOUC.EXE'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of uncommon child processes spawned by `Appvlp.EXE`, which is tied to Microsoft Office's Application Virtualization Utility. Attackers may exploit this executable to circumvent security measures, including executing unauthorized commands or invoking malicious payloads. The relevant MITRE ATT&CK technique is `Execution: Command and Scripting Interpreter (T1059)`, with a focus on `Defense Evasion: Masquerading (T1036)` as legitimate applications are leveraged for nefarious purposes. Primary telemetry sources include process creation logs from Windows (e.g., Event ID 4688 and/or Sysmon Event ID 1) that detail process relationships and command lines. If malicious activity is confirmed, it could result in unauthorized access or data compromise. Importantly, this detection does not confirm malicious intent without further investigative context; benign use of `Appvlp.EXE` is common in legitimate environments.

  ### Investigation Steps

  - **Identify Process Creation Events**: Review Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of `Appvlp.EXE`. Note the command line used for process creation; legitimate uses will typically show its standard parameters associated with virtual applications.

  - **Assess Child Process Relationships**: Examine the parent-child process relationships for `Appvlp.EXE`. Look for unusual child processes that do not commonly arise from standard Office behavior, as these might indicate potential exploitation.

  - **Check for Known Legitimate Usage**: Validate if `Appvlp.EXE` is functioning in standard operations (e.g., launching an app from Microsoft Office) by referencing normal execution patterns on unaffected host systems, ensuring the context matches anticipated behavior.

  - **Review Command Line Parameters**: Inspect the command line arguments of the child processes generated by `Appvlp.EXE`. Malicious indicators may include suspicious flags or paths, especially if they invoke system utility commands without legitimate justification (e.g., `rundll32.exe` calls with unusual parameters).

  - **Correlate with Other Security Events**: Cross-reference logs from other security tools (e.g., EDR alerts, antivirus logs) to identify if similar indicators were flagged. Investigate any corresponding anomalies in user behavior or network traffic around the same timeframe.

  - **Look for Evasion Tactics**: Be aware that attackers might try to disguise or uncover their activities using processes like `Appvlp.EXE`. Validate logging configurations to ensure comprehensive coverage of all relevant process creation sources is enabled.

  ### Prioritization

  This alert should be deemed medium severity due to the potential impact on systems that utilize Microsoft Office, which are typically enterprise-critical. The likelihood of adversary misuse is moderate; while not universally weaponized, the behavior detected suggests a higher-than-usual risk of exploitation, warranting immediate investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate use of `Appvlp.EXE` by trusted applications can trigger false positives. Not all environments log every instance of process creation settings; ensure that Sysmon or equivalent configurations are correctly set for reliable telemetry capture. Users performing routine virtualization operations in Office might generate similar alerts, which necessitates careful contextual assessment. Companion detections involving `rundll32.exe` execution from unusual parent processes should be monitored concurrently for enhanced coverage against abuse of application virtualization tools.

