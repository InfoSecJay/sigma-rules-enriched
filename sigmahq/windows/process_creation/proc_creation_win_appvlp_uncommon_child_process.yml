title: Uncommon Child Process Of Appvlp.EXE
id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
status: test
description: |
  Detects uncommon child processes of Appvlp.EXE
  Appvlp or the Application Virtualization Utility is included with Microsoft Office. Attackers are able to abuse "AppVLP" to execute shell commands.
  Normally, this binary is used for Application Virtualization, but it can also be abused to circumvent the ASR file path rule folder
  or to mark a file as a system file.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Appvlp/
author: Sreeman
date: 2020-03-13
modified: 2023-11-09
tags:
- attack.stealth
- attack.t1218
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\appvlp.exe'
    # Note: Filters based on data from EchoTrail: https://www.echotrail.io/insights/search/appvlp.exe/
  filter_main_generic:
    Image|endswith:
    - ':\Windows\SysWOW64\rundll32.exe'
    - ':\Windows\System32\rundll32.exe'
  filter_optional_office_msoasb:
    Image|contains: ':\Program Files\Microsoft Office'
    Image|endswith: '\msoasb.exe'
  filter_optional_office_skype:
    Image|contains|all:
    - ':\Program Files\Microsoft Office'
    - '\SkypeSrv\'
    Image|endswith: '\SKYPESERVER.EXE'
  filter_optional_office_msouc:
    Image|contains: ':\Program Files\Microsoft Office'
    Image|endswith: '\MSOUC.EXE'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects uncommon child processes initiated by Appvlp.EXE, the Application Virtualization Utility from Microsoft Office. Attackers may exploit Appvlp.EXE to execute arbitrary commands and thus achieve code execution in a way that could bypass security controls. This behavior aligns with the MITRE ATT&CK technique for Process Injection (T1218).

  The primary telemetry sources include Windows process creation logs (Event ID 4688) and potentially Sysmon logs (Event ID 1). If malicious, the exploitation of this utility could lead to unauthorized command execution and persistence on the host system. However, this detection does NOT confirm malicious activity on its own; further investigation is required to correlate other indicators of compromise.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for processes whose ParentImage is `appvlp.exe`. Investigate child processes specifically if they are unusual or do not fit typical user activity.

  - **Identify known benign children**: Validate child processes against known legitimate outcomes of `appvlp.exe`, such as expected process behavior linked to Office applications (e.g., specific Office executables). Identify if any deviations exist from these patterns.

  - **Cross-reference with Sysmon logs**: Look for Sysmon Event ID 1 capturing details of the process creation to gather additional context such as command-line parameters and hashes of created processes. File paths of the child processes should be scrutinized for any that are out of place.

  - **Check for associated network activity**: Verify if there are corresponding outbound connections in network logs (e.g., firewall logs) initiated by the detected child processes, indicating possible data exfiltration or command and control (C2) communication.

  - **Confirm system context**: Assess the host role and its significance; for instance, if the affected system is an endpoint with high privileges or critical services, the alert should be prioritized for urgent investigation.

  - **Analyze for signs of persistence**: Look for unusual file creation or modification timestamps in system directories, especially in relation to the child processes after their execution, indicating attempts to establish a foothold.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact if Appvlp.EXE is abused for malicious purposes. Given its association with commonly weaponized techniques for process abuse, such as process injection, active investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as renaming malicious binaries to resemble legitimate paths. Complete monitoring requires availability of process creation logs from all relevant endpoints; missing telemetry may impair the investigation's effectiveness. Additionally, legitimate usage of Appvlp.EXE by enterprise applications may occasionally trigger this alert, thus demanding careful validation. Enhancing coverage with companion detections that monitor suspicious command-line parameters and legitimate software behavior can provide better context and elevate confidence in assessments.

