note: |
  ### Technical Context

  This rule detects the execution of CertUtil.exe using command-line parameters that indicate the tool is downloading files from direct IP addresses. The likely attacker objective is to leverage CertUtil—a built-in legitimate tool for certificate management—for malicious file retrieval, which can be a step in a command and control (C2) operation or initial access. The relevant MITRE ATT&CK techniques include Command-Line Interface (T1059) and Exfiltration Over Command and Control Channel (T1041). The primary telemetry source is Windows process creation logs, specifically looking for Event ID 4688 to capture details about the command executed.

  If malicious, this activity could lead to the establishment of persistent access, data exfiltration, or deployment of further payloads. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate use of CertUtil for file downloads can occur in administrative contexts.

  ### Investigation Steps

  - **Check process details:** Examine Security Event ID 4688 for the parent process that invoked CertUtil.exe. A suspicious parent process (e.g., powershell.exe or cmd.exe) may indicate malicious activity, whereas the presence of a known system tool (like a remote management tool) as the parent may indicate benign behavior.

  - **Review command line arguments:** Analyze the CommandLine field for the presence of flags such as 'urlcache' or 'verifyctl'. Legitimate use typically involves standard paths and valid URLs rather than direct IPs. Malicious commands will often have various obfuscations or parameters serving malicious intent.

  - **Correlate network activity:** If the execution of CertUtil coincides with outbound traffic to uncommon IP addresses, check network logs or firewall logs for suspicious connections, specifically looking for unusual protocols or HTTP status codes (e.g., 200 OK).

  - **Verify timestamp alignment:** Cross-reference the timestamp of execution from the process creation logs against other telemetry sources (like DNS queries or firewall logs) to identify any attempts to resolve compatibility with newly established connections to IP addresses.

  - **Identify common paths:** Document whether the downloaded files are located in typical directories for user downloads (e.g., Downloads, Temp). Malicious downloads are likely to be found in less common locations or temporary folders.

  - **Assess asset criticality:** If this alert triggers on critical infrastructure assets (e.g., domain controllers or database servers), prioritize the investigation. Malicious activity here may indicate potential compromises impacting broader network security.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical systems. The likelihood of abuse is significant, as attackers often use tools like CertUtil to download and execute payloads undetected. This method is a common tactic in various attack frameworks, making prompt investigation crucial.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not properly configured, particularly if process creation logs are not enabled. Evasion techniques may include renaming or obfuscating the CertUtil executable. Legitimate administrative activities that could trigger this alert include using CertUtil for downloading certificates or scripts for system updates. A related detection, such as monitoring for unusual PowerShell activity (MITRE ATT&CK T1059.001), can complement this alert by providing insights into potential concurrent malicious actions.

