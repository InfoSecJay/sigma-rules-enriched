note: |
  ### Technical Context

  This rule detects the execution of the LocalPotato proof-of-concept (PoC) tool, which is commonly used for privilege escalation on Windows systems. LocalPotato capitalizes on a vulnerability to manipulate Windows' Local Security Authority (LSA) and obtain elevated privileges, aiming for unauthorized system access. This behavior aligns with the MITRE ATT&CK technique: Privilege Escalation [T1068] and the tactic of Privilege Escalation.

  The primary telemetry source is Windows process creation logs, particularly focusing on event types such as Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, it could lead to significant security breaches, granting attackers elevated permissions to sensitive systems or resources. Importantly, this detection solely identifies the execution of the tool and does not confirm whether the executed process was used in a malicious context.

  ### Investigation Steps

  - **Verify process creation details:** Investigate Security Event ID 4688 (or Sysmon Event ID 1) logs for the creation of `LocalPotato.exe` with the specific command line options indicating its use. Legitimate executions will not typically have this type of CLI syntax.

  - **Check file hashes:** Validate the process hashes from logs against known IMPHASH values of LocalPotato (`E1742EE971D6549E8D4D81115F88F1FC` or `DD82066EFBA94D7556EF582F247C8BB5`). Matches to these hashes are strong indicators of the tool being used maliciously.

  - **Assess system roles:** Identify the role of the affected system (e.g., Domain Controller, file server). Successful execution on critical infrastructure increases the incident's severity.

  - **Review user context:** Analyze the user context under which LocalPotato was executed. Malicious executions may occur under accounts with unexpected levels of access or on systems that typically do not execute such tools.

  - **Correlate with other alerts:** Review for correlating alerts or indicators, such as concurrent alerts indicating lateral movement or suspicious modifications to permissions around the same time LocalPotato was executed.

  ### Prioritization

  The alert is of high severity, particularly if it occurs on critical infrastructure such as domain controllers, as it suggests a significant risk of privilege escalation that could be exploited by adversaries to gain broader access across the network. This type of activity is frequently weaponized in attacks targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection is limited by the availability of process creation logs; if they are not being collected or monitored effectively, detection may fail. Legitimate administrative tools or scripts that use similar command-line patterns could also generate false positives. A related detection to strengthen coverage would be monitoring for abnormal privilege escalations (e.g., Event ID 4672, which indicates special privileges assigned to accounts), as they may coincide with LocalPotato’s execution.

