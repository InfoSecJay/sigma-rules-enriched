note: |
  ### Technical Context
  This detection rule identifies the execution of **LocalPotato**, a well-known proof-of-concept (PoC) tool that exploits specific vulnerabilities to escalate privileges on Windows systems. LocalPotato leverages the Windows User Account Control (UAC) mechanism, allowing attackers to gain elevated privileges without adequate user permissions. The primary objective of utilizing LocalPotato is to facilitate lateral movement within a network and perform unauthorized actions under higher privilege contexts, thereby compromising sensitive systems.

  LocalPotato's activity falls under the **MITRE ATT&CK** tactics of **Defense Evasion** (T1211) and **Privilege Escalation** (T1068). Attackers might deploy this tool to exploit vulnerabilities—such as those associated with **CVE-2023-21746**—in a bid to bypass security controls and gain administrative access. The best evidence for detecting this behavior can be found in **process creation** events, which provide details about executed applications and their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for instances where `LocalPotato.exe` has been executed, paying particular attention to the command-line arguments used during the execution.
  - **Analyze Command-Line Arguments:** Specifically look for command lines that contain `-i C:\` and `-o Windows\`, which are indicative of LocalPotato usage.
  - **Investigate Binary Metadata:** Examine the binary's PE metadata for known import hash values (`IMPHASH`) that correlate with LocalPotato to confirm the legitimacy of the execution context.
  - **Monitor User Permissions and Group Memberships:** Check if there are any unusual elevation requests or changes in privileged group memberships that coincide with the execution of LocalPotato.

  ### Prioritization
  This alert is classified as high severity due to the significant risk posed by privilege escalation tactics in an enterprise environment, which can potentially lead to unauthorized access to sensitive data and systems. Given the likelihood of this tool being misused in real-world attacks, it warrants immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for environmental variances, such as custom deployments of LocalPotato or modified attributes that deviate from the expected patterns. The detection logic assumes that process creation events are adequately logged and that the necessary metadata such as command-line parameters and image hashes are being monitored. Additionally, environments without stringent process logging configurations may not capture the execution details necessary for the alert to function effectively.

