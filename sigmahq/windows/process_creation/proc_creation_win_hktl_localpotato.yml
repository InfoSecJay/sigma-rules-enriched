note: |
  ### Technical Context

  This Sigma rule detects the execution of the LocalPotato tool, commonly used for privilege escalation on Windows systems. The primary objective for an adversary utilizing LocalPotato is to escalate privileges by exploiting known vulnerabilities in the Windows access control mechanisms. This behavior aligns with the MITRE ATT&CK tactic "Privilege Escalation" (TA0004) and the technique "Exploitation of Vulnerability" (T1210). The primary telemetry sources required for this detection are Windows Process Creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture details about process launches and command-line arguments. If malicious, this behavior could lead to an attacker gaining higher privileges, posing significant security risks to the enterprise environment. However, this detection alone does not confirm that the execution was successful in escalating privileges, nor does it account for legitimate uses of executable tools in the environment.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for processes with the Image path ending in `\LocalPotato.exe`. Look for additional notable command line parameters like `-i C:\` and `-o Windows\`.

  - **Assess command-line options**: Validate whether the command line in the logs contains typical LocalPotato parameters, specifically looking for `-i C:\` and `-o Windows\`. Benign use may not include these specific arguments together.

  - **Identify the parent process**: Cross-reference the process with its parent process ID. Investigate whether it was spawned by a legitimate administrative tool or activity (e.g., PowerShell scripts for maintenance tasks).

  - **Review system user context**: Identify the user account executing LocalPotato. A non-admin user running LocalPotato is indicative of a potential malicious escalation attempt, whereas expected activity might involve an admin executing it for legitimate maintenance.

  - **Locate alternative indicators**: Check for the presence of unusual file creations indicative of exploitation attempts (e.g., `*.tmp` files in the `C:\Windows\` directory or elsewhere created immediately before `LocalPotato.exe` execution) to confirm malicious intent.

  - **Correlate with existing alerts**: Look for other associated detection alerts within your SIEM that may indicate misuse of LocalPotato, particularly any patterns of privilege escalation attempts or other exploitation tools within proximity in the logs.

  ### Prioritization

  This alert is of **high severity** due to the potential for an attacker to leverage LocalPotato to escalate privileges, which can lead to broader compromises within an enterprise network. The likelihood of abuse is also notable, as privilege escalation techniques are commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of process obfuscation techniques or if the attacker employs local modifications to the binary. It is essential to have comprehensive logging enabled via Sysmon or adequate Windows security auditing to capture these events reliably. Legitimate activities, such as administrators using similar tools for auditing, may trigger the alert. A related detection that could strengthen coverage is monitoring for abnormal user activity patterns post-execution of LocalPotato, potentially indicating successful privilege escalation.

