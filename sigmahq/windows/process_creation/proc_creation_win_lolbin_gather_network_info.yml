note: |
  ### Technical Context
  This rule detects the execution of the built-in Windows script `gatherNetworkInfo.vbs`, which is located in `C:\Windows\System32`. The script can be leveraged by an attacker to collect sensitive information about the target environment, including network configurations and system details. Such reconnaissance activities help attackers understand the network layout and identify potential vulnerabilities or targets for further exploitation.

  The likely attacker objectives may include gathering intelligence for lateral movement, preparing for exfiltration, or identifying misconfigured systems. The use of `gatherNetworkInfo.vbs` aligns with MITRE ATT&CK techniques such as `T1615 - Collect Network Share Information` and `T1059.005 - Command and Scripting Interpreter: Windows Command Shell`, which describe methods of information collection and the execution of scripts via command-line interfaces.

  The primary data sources for detecting this behavior are process creation events, particularly logs capturing commands related to the execution of scripts like `cscript.exe` and `wscript.exe`. Such logs provide insight into potentially malicious actions taken by both insider threats and external attackers.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect logs for instances of `cscript.exe` or `wscript.exe` initiating the execution of `gatherNetworkInfo.vbs`. Look for unusual parent processes or execution by non-administrative accounts.
  - **Analyze Command-Line Arguments**: Check the command line used during the execution; see if it includes `gatherNetworkInfo.vbs` and investigate the context around why this script was run.
  - **Assess Network Activity**: Monitor for any unusual network traffic that may coincide with the script execution, looking for outbound connections that could indicate data exfiltration efforts.
  - **Investigate User Context**: Identify which user account executed the script. Determine if it aligns with legitimate administrative tasks or if it appears suspicious based on user behavioral patterns.

  ### Prioritization
  This alert carries medium severity due to its potential to indicate reconnaissance activities that precede larger-scale attacks. Although the detection can show signs of potentially benign administrative tasks, misuse of system scripts for gathering sensitive data raises significant concerns in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection if an attacker uses alternative scripting methods or tools to gather network information, or if the execution of the script occurs with different command-line parameters that are not captured by the current detection logic. This rule assumes that process creation logs are enabled and properly configured to capture all necessary events for analysis. Additionally, it operates under the assumption that legitimate administrative usage of the script is well understood and documented within the organization to help distinguish false positives.

