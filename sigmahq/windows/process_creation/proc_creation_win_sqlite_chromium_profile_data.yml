title: SQLite Chromium Profile Data DB Access
id: 24c77512-782b-448a-8950-eddb0785fc71
status: test
description: Detect usage of the "sqlite" binary to query databases in Chromium-based
  browsers for potential data stealing.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/84d9edaaaa2c5511144521b0e4af726d1c7276ce/atomics/T1539/T1539.md#atomic-test-2---steal-chrome-cookies-windows
- https://blog.cyble.com/2022/04/21/prynt-stealer-a-new-info-stealer-performing-clipper-and-keylogger-activities/
author: TropChaud
date: 2022-12-19
modified: 2023-01-19
tags:
- attack.credential-access
- attack.t1539
- attack.t1555.003
- attack.collection
- attack.t1005
logsource:
  category: process_creation
  product: windows
detection:
  selection_sql:
  - Product: SQLite
  - Image|endswith:
    - '\sqlite.exe'
    - '\sqlite3.exe'
  selection_chromium:
    CommandLine|contains:
    - '\User Data\'         # Most common folder for user profile data among Chromium browsers
    - '\Opera Software\'         # Opera
    - '\ChromiumViewer\'         # Sleipnir (Fenrir)
  selection_data:
    CommandLine|contains:
    - 'Login Data'         # Passwords
    - 'Cookies'
    - 'Web Data'         # Credit cards, autofill data
    - 'History'
    - 'Bookmarks'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the SQLite binary in conjunction with specific Chromium-based browser user profile databases. The behavior observed may indicate an attempt by an attacker to extract sensitive user information, such as passwords, cookies, credit card details, or browsing history. Attackers may target these databases to steal credentials or other valuable data for malicious purposes, including account takeover, identity theft, or further reconnaissance within the victim's environment.

  This behavior is relevant to several MITRE ATT&CK techniques, particularly:
  - **Credential Access** (T1555) – Exploiting stored credentials from browser databases.
  - **Data from Information Repositories** (T1005) – Accessing data stored in user profiles, including browsers.
  - **Data Theft** (T1539) – General theft of user data.
  - **Collection** (T1560) – Collecting sensitive data by querying local databases.

  The primary data sources for this detection include process creation events that log command line arguments and the details of executed binaries, which can reveal the context in which SQLite was invoked alongside the specific database files accessed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation logs for entries involving `sqlite.exe` or `sqlite3.exe` that contain command line arguments pointing to common Chromium user profile data locations.
  - **Examine User Activity Patterns:** Check for unusual access patterns related to sensitive databases like `Login Data`, `Cookies`, or `Web Data`, especially in accounts that have not previously exhibited such behaviors.
  - **Correlate with User Behavior:** Investigate the context of the user account running the processes. Determine if it aligns with expected usage patterns, and check for any deviations that could indicate malicious intent.
  - **Analyze Network Traffic:** If applicable, examine outbound network connections made during or after suspicious SQLite executions to identify any data exfiltration attempts or connections to known malicious infrastructure.

  ### Prioritization
  Given the high sensitivity of data contained in browser user profiles, alerts generated by this detection are considered high-severity due to the significant impact of potential data theft and the prevalent nature of information-stealing malware.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if SQLite binaries are executed in a non-standard manner or if custom browsers that do not follow the typical folder structure are used. The effectiveness of this detection assumes that process creation logs are adequately captured and retained in the logging infrastructure. Additionally, the rule presumes that standard Chromium user profile paths and database names remain consistent, which may not be the case with all browser configurations or user customizations.

