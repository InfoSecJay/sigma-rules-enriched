title: SQLite Chromium Profile Data DB Access
id: 24c77512-782b-448a-8950-eddb0785fc71
status: test
description: Detect usage of the "sqlite" binary to query databases in 
  Chromium-based browsers for potential data stealing.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/84d9edaaaa2c5511144521b0e4af726d1c7276ce/atomics/T1539/T1539.md#atomic-test-2---steal-chrome-cookies-windows
- https://blog.cyble.com/2022/04/21/prynt-stealer-a-new-info-stealer-performing-clipper-and-keylogger-activities/
author: TropChaud
date: 2022-12-19
modified: 2023-01-19
tags:
- attack.credential-access
- attack.t1539
- attack.t1555.003
- attack.collection
- attack.t1005
logsource:
  category: process_creation
  product: windows
detection:
  selection_sql:
  - Product: SQLite
  - Image|endswith:
    - '\sqlite.exe'
    - '\sqlite3.exe'
  selection_chromium:
    CommandLine|contains:
    - '\User Data\'         # Most common folder for user profile data among Chromium browsers
    - '\Opera Software\'         # Opera
    - '\ChromiumViewer\'         # Sleipnir (Fenrir)
  selection_data:
    CommandLine|contains:
    - 'Login Data'         # Passwords
    - 'Cookies'
    - 'Web Data'         # Credit cards, autofill data
    - 'History'
    - 'Bookmarks'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection identifies the usage of the "sqlite" binary to access databases related to Chromium-based browsers. The behavior typically indicates an attempt to extract sensitive user data, such as passwords, cookies, or autofill information, potentially for malicious purposes. The likely attacker objective is to steal sensitive personal information for credential harvesting or to facilitate further exploits. This activity aligns with the MITRE ATT&CK techniques such as Credential Access (T1539) and Collection (T1005).

  The primary telemetry sources for this detection are **Windows process creation logs** (Event ID 4688 and/or Sysmon Event ID 1). If this behavior is malicious, it can lead to significant data breaches, impacting user privacy and organizational security. Importantly, this detection does NOT confirm that data extraction was successfully completed or exfiltrated on its own, only that a potentially malicious process has accessed sensitive files.

  ### Investigation Steps

  - **Identify the process creation event:** Review Windows Security Event ID 4688 for instances where `sqlite.exe` or `sqlite3.exe` has been executed. Focus on the `NewProcessName` field containing these binaries.

  - **Examine command-line arguments:** Review the `CommandLine` field of the process creation logs for parameters that include paths such as `\User Data\`, `\Opera Software\`, and database file names like 'Login Data' or 'Cookies'. Malicious indicators may show database access with no legitimate users accessing this data.

  - **Correlate with recent user activity:** Check user activity timelines in the browser to validate whether the profile directory associated with this access has been genuinely accessed by the user. Legitimate activity may show a history of browsing or session re-establishments.

  - **Detect anomalous access patterns:** Look for unusual execution of commands from non-standard locations. For instance, access to sqlite in uncommon folders (e.g., temporary directories) can indicate suspicious behavior.

  - **Validate with additional logs:** Cross-reference with firewall logs for any unusual outbound network connections from the affected host post-execution. Pay attention to the `NetworkDirection`, `DestinationIP`, and `DestinationPort` fields.

  - **Assess host criticality:** Understand the role of the affected host in your environment. A device with high privilege or containing sensitive data increases the severity of the findings, with clear action required.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant data breaches involving sensitive personal and financial information. Given that unauthorized access to these databases is commonly associated with credential theft and is weaponized by various malicious actors, a rapid response is essential.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of process execution logging on some hosts or if the logs do not cover all relevant execution scenarios. Legitimate activities, such as database usage by user-installed extensions, could trigger this alert without being malicious. Additionally, companion detections related to browser-specific extensions or credential dumping activities would enhance coverage and context for this detection.

