note: |
  ### Technical Context

  This Sigma rule detects the launching of known credential scanning tools (such as trufflehog or gitleaks) by script interpreters like node.js or bun. This behavior typically indicates an attempt by an adversary to find and exfiltrate sensitive credentials and secrets from source code or configuration files, aligning with tactics observed in credential theft campaigns. The relevant MITRE ATT&CK tactics are Credential Access (T1552) and Collection (T1005), with techniques such as Automated Collection (T1059.007) and Scripting (T1059).

  The primary telemetry source is process creation events within Windows, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide detailed information about newly created processes and their parent-child relationships. If malicious, this behavior could lead to unauthorized access to sensitive data, impacting data integrity and confidentiality. However, this detection alone does not confirm malicious intent without additional context, as legitimate tools may also trigger similar alerts.

  ### Investigation Steps

  - **Check process details:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for the parent process (node.exe or bun.exe) and child processes (trufflehog.exe or gitleaks.exe). Note any anomalous processes that do not have a legitimate business need.

  - **Analyze command line arguments:** Look at CommandLine fields in the event logs for specific keywords such as "trufflehog" or "gitleaks". Malicious command lines typically show attempts to scan repositories or secrets, while benign usage may include explicit security checks not targeting sensitive directories.

  - **Identify legitimate use cases:** Verify if the process spawning occurred within a CI/CD pipeline or pre-commit hook context, which may indicate legitimate activities associated with security checks. Check repository commit logs and activity for related tooling to confirm benign intent.

  - **Correlate with other security logs:** Cross-reference findings with firewall logs (Event ID 5140 for file share access) or DLP logs that may capture unusual data access patterns from the same systems. Look for unauthorized outbound connections that coincide with the timing of the credential scanning.

  - **Look for high-confidence malicious indicators:** Focus on instances where the credential scanning tool executes outside expected system locations (e.g., not in default installation paths). Unusual execution paths could indicate adversarial manipulation.

  ### Prioritization

  This alert is of high severity due to the potential impact of credential theft on key organizational assets, including source code and production environments. The likelihood of malicious activity is significant as tools like trufflehog and gitleaks are explicitly designed for sensitive data extraction and are often weaponized during attacks on software supply chains.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques, such as renaming credential scanners or running them in a non-standard manner. Reliable detection depends on proper logging configurations for process creation; any deficiencies may limit visibility. Legitimate activities that could trigger similar alerts include automated scans for security compliance in CI/CD environments. Complementary detections like unauthorized access attempts or abnormal data exfiltration patterns can enhance threat coverage.

