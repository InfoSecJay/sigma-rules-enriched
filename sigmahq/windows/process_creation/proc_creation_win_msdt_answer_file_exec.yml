title: MSDT Execution Via Answer File
id: 9c8c7000-3065-44a8-a555-79bcba5d9955
status: test
description: |
  Detects execution of "msdt.exe" using an answer file which is simulating the legitimate way of calling msdt via "pcwrun.exe" (For example from the compatibility tab).
references:
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-13
modified: 2025-10-29
tags:
- attack.defense-evasion
- attack.t1218
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msdt.exe'
    CommandLine|contains: '\WINDOWS\diagnostics\index\PCWDiagnostic.xml'
    CommandLine|contains|windash: ' -af '
  filter_main_pcwrun:
    ParentImage|endswith: '\pcwrun.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Possible undocumented parents of "msdt" other than "pcwrun".
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msdt.exe` (Microsoft Support Diagnostic Tool) using an answer file, which can be indicative of an attacker leveraging this legitimate tool for malicious purposes. The primary objective of an attacker in this scenario may be to exploit system vulnerabilities or exfiltrate sensitive information through perceived benign actions, utilizing features of `msdt.exe` that are typically used for troubleshooting. This detection maps to the MITRE ATT&CK technique ID T1218 (Signed Binary Proxy Execution) under the tactic of Execution.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688 from the Windows Security log. If this activity is indeed malicious, it can carry significant security implications, as it may be used for lateral movement or payload delivery. However, it's important to note that this detection does NOT confirm malicious activity on its own; further verification is required to correlate context and intent.

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Security Event ID 4688 for instances of `msdt.exe` execution where `ParentImage` is `pcwrun.exe`. Validate if the execution aligns with legitimate use patterns, such as troubleshooting initiated by helpdesk staff.

  - **Analyze Command Line Arguments:** Check the `CommandLine` field for the presence of `\WINDOWS\diagnostics\index\PCWDiagnostic.xml` and ` -af `. If found, assess whether this aligns with known benign diagnostics operations or if it appears suspicious based on context.

  - **Cross-reference Alert with User Behavior:** Investigate user activity during the time of the alert. Legitimate calls to `msdt.exe` typically come from known personnel engaged in support roles; verify whether the user executing this command fits expected behavior.

  - **Check for Execution Context:** Look at associated Event IDs for parent process creation. If multiple instances of `msdt.exe` are executed with different parent processes, it may indicate an attempt to obfuscate the execution path, demonstrating potential malicious activity.

  - **Examine System Impact:** Assess the asset role of the system where this alert was triggered. Critical systems (e.g., those handling sensitive information) should be prioritized in review, as exploitation here can lead to broader security compromises.

  - **Identify Additional Artifacts:** Confirm associated file creations or modifications linked to `msdt.exe` execution. Look for any temporary files or logs created in directory paths commonly associated with `msdt` operations.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and the likelihood of malicious abuse. The technique is commonly weaponized in targeted attacks, leveraging trusted tools to evade detection, thereby increasing the urgency for thorough investigation and response.

  ### Blind Spots and Assumptions

  Key detection limitations include the potential for evasion through legitimate process usage, as benign applications may also call `msdt.exe`. Accurate detection requires comprehensive logging of process creation events and correlation with historical user activity to differentiate legitimate from malicious activities. Additionally, related detections targeting other execution techniques (such as T1203 - Exploitation for Client Execution) can provide a broader context for understanding potential threats.

