title: MSDT Execution Via Answer File
id: 9c8c7000-3065-44a8-a555-79bcba5d9955
status: test
description: |
  Detects execution of "msdt.exe" using an answer file which is simulating the legitimate way of calling msdt via "pcwrun.exe" (For example from the compatibility tab).
references:
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-13
modified: 2025-10-29
tags:
- attack.stealth
- attack.t1218
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msdt.exe'
    CommandLine|contains: '\WINDOWS\diagnostics\index\PCWDiagnostic.xml'
    CommandLine|contains|windash: ' -af '
  filter_main_pcwrun:
    ParentImage|endswith: '\pcwrun.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Possible undocumented parents of "msdt" other than "pcwrun".
level: high
note: |
  ### Technical Context

  The Sigma rule detects the execution of `msdt.exe` (Microsoft Support Diagnostic Tool) using an answer file, indicative of a potential exploitation technique that an adversary might employ to bypass security mechanisms under the guise of a legitimate function. The likely attacker objective is to execute a malicious payload or perform reconnaissance on the system while evading detection through a common Windows utility. This behavior corresponds to the MITRE ATT&CK technique: **Application Layer Protocol (T1071.001)** (Command and Control via `msdt.exe`).

  The primary telemetry source for this detection is process creation logs, specifically those that capture executable invocation (`Event ID 4688` in Windows Security logs or `Sysmon Event ID 1`). If exploited by a malicious actor, this behavior could allow for unauthorized code execution with potential data exfiltration or system compromise. Importantly, this detection alone does NOT confirm malicious activity; it requires additional context to determine intent.

  ### Investigation Steps

  - **Check process creation details**: Examine Event ID 4688 for the `msdt.exe` process. Look for the `CommandLine` field containing `\WINDOWS\diagnostics\index\PCWDiagnostic.xml` and `-af`. If legitimate, it may show benign parameters resembling `msdt` diagnostics run.

  - **Verify parent process**: Identify the parent process by checking the `ParentImage` field in the process creation logs. An entry with `\pcwrun.exe` indicates legitimate execution; anything unexpected may require deeper investigation.

  - **Inspect historical activity**: Review historical process creation logs for past executions of `msdt.exe` in conjunction with `pcwrun.exe`. A pattern suggesting frequent execution without user interaction could indicate underlying malicious intent.

  - **Analyze command line arguments**: Focus on the command line for any unusual flags or parameters that deviate from standard usage patterns of `msdt.exe`. For example, look for unexpected file paths or scripting syntax, which could indicate abandonment of benign use.

  - **Assess file creation events**: Examine for file creation logs that may relate to associated artifacts or outputs generated by the execution of `msdt.exe`, verifying if any suspicious files were created during the time frame of the alert.

  - **Check for false positives**: Be aware that non-standard executables might trigger alerts due to parent processes not recognized as `pcwrun.exe`. Investigate the `ParentImage` field for known alternatives and determine if they are commonly found in your environment.

  ### Prioritization

  The alert has high severity due to the potential impact of malware execution through a trusted system process, which could facilitate advanced persistence and data exfiltration. The likelihood of this behavior being malicious is significant, as it leverages a well-known method of exploiting legitimate tools. Such tactics are increasingly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations for process creation and command line arguments. Evasive techniques may include modifying the parent executable names or parameters to disguise malicious intentions. Legitimate repairs or system diagnostics could trigger this alert. A related detection to strengthen coverage is monitoring for unusual executions of other benign system utilities invoked with uncommon command line parameters, such as `powershell.exe` or `wscript.exe`.

