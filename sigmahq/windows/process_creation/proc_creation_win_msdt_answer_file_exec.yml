title: MSDT Execution Via Answer File
id: 9c8c7000-3065-44a8-a555-79bcba5d9955
status: test
description: |
  Detects execution of "msdt.exe" using an answer file which is simulating the legitimate way of calling msdt via "pcwrun.exe" (For example from the compatibility tab).
references:
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-13
modified: 2025-10-29
tags:
- attack.defense-evasion
- attack.t1218
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msdt.exe'
    CommandLine|contains: '\WINDOWS\diagnostics\index\PCWDiagnostic.xml'
    CommandLine|contains|windash: ' -af '
  filter_main_pcwrun:
    ParentImage|endswith: '\pcwrun.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Possible undocumented parents of "msdt" other than "pcwrun".
level: high
note: |
  ### Technical Context
  This detection rule focuses on identifying the execution of `msdt.exe` (Microsoft Support Diagnostic Tool) using an answer file in a manner that mimics legitimate operations, specifically the method through `pcwrun.exe`. Attackers often leverage such tools to execute commands and scripts that could lead to further compromise without raising immediate suspicion. Utilizing `msdt.exe` with an answer file can evade detection mechanisms as it simulates benign behavior yet enables malicious objectives, such as executing payloads or stealing credentials.

  Relevant MITRE ATT&CK tactics and techniques related to this detection include:
  - **Tactic:** Execution
  - **Technique:** [T1218 - Signed Binary Proxy Execution](https://attack.mitre.org/techniques/T1218/)

  The primary data source for this detection is process creation logs on Windows systems, which record information about executed processes, their command line parameters, and parent-child relationships among processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Identify instances of `msdt.exe` being executed and check the `CommandLine` arguments for references to `PCWDiagnostic.xml` and the `-af` flag.
  - **Analyze Parent Process Relationships:** Confirm the parent process of `msdt.exe` is `pcwrun.exe` and look for any inconsistencies or unexpected parent processes that could indicate malicious activity.
  - **Correlate with User Activity:** Assess the timing of the `msdt.exe` execution relative to user activities, alerts, or known incidents to establish context about whether the execution was authorized or legitimate.
  - **Check for Known Signatures:** Compare the findings against threat intelligence databases and known signatures for malicious use of the `msdt.exe` process to see if the execution fits common attack patterns.

  ### Prioritization
  The severity of this alert is considered high due to the potential for abuse of a legitimate Windows utility, which could lead to system compromise or further malicious activities. The likelihood of an attacker leveraging this technique is notable, especially in environments where users may be unaware of its misuse.

  ### Blind Spots and Assumptions
  There may be detection gaps concerning undocumented or legitimate parent processes of `msdt.exe`, which could lead to false positives if such processes are not commonly detected or recorded. The detection logic assumes that `pcwrun.exe` is the primary parent process, potentially overlooking other legitimate executions. For proper functionality, Windows process creation logs must be enabled and properly configured to capture detailed command line information.

