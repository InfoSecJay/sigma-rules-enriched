title: Php Inline Command Execution
id: d81871ef-5738-47ab-9797-7a9c90cd4bfb
status: test
description: Detects execution of php using the "-r" flag. This is could be used
  as a way to launch a reverse shell or execute live php code.
references:
- https://www.php.net/manual/en/features.commandline.php
- https://www.revshells.com/
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\php.exe'
  - OriginalFileName: 'php.exe'
  selection_cli:
    CommandLine|contains: ' -r'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies instances where PHP is executed with the `-r` flag, commonly associated with live code execution or remote shell functionality. An attacker may employ this technique to execute arbitrary PHP code directly on a server, which could facilitate the establishment of a reverse shell for remote control or system compromise.

  This rule aligns with the MITRE ATT&CK framework under the tactic of Execution (TA0002) and specifically the technique of Command-Line Interface (T1059). The primary telemetry source involves process creation logs from Windows, specifically looking for mentions of `php.exe` as well as associated command line arguments. If the detection confirms malicious activity, it could lead to unauthorized access or remote management of affected systems. However, this rule does NOT confirm outright malicious intent, as legitimate administrative tasks could theoretically utilize similar commands.

  ### Investigation Steps

  - **Review command line arguments:** Check for process creation logs (Event ID 4688) where `CommandLine` contains `-r`. Look for usage patterns and context in the surrounding execution to identify potentially malicious intent.

  - **Identify context and usage:** Investigate the asset executing this command. If it's a web server or application server, weigh the likelihood of legitimate PHP usage against known good practices for that environment.

  - **Correlate with security logs:** Cross-reference with other security logs (e.g., Sysmon Event ID 1) to see if there are indicators of suspicious behavior preceding or following the process execution, such as unusual inbound traffic to the server.

  - **Check for reverse shell indicators:** Look for known patterns of reverse shell connections, such as established outbound connections to suspicious IPs or unusual URL requests in web server logs, confirming an active communication channel.

  - **Assess file system changes:** Search for new file creations or modifications around the time of execution (e.g., using Sysmon Event ID 11) which may indicate scripts or payloads being dropped as part of the execution process.

  - **Monitor for additional executions:** Determine if this command was executed in a pattern (repeated attempts within a time period) that may indicate automation or a script, which is less common in benign use cases.

  ### Prioritization

  This alert is medium severity due to the potential impact on critical systems if exploited, especially for web servers that often serve as gateways to internal networks. The likelihood of malicious abuse is significant, as executing PHP code in this manner is a prevalent technique among attackers for maintaining persistence. While not universally weaponized, its use should be correlated with other suspicious behaviors.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by systems not logging relevant process creation events adequately. Additionally, legitimate scripting and management tasks may trigger the alert, complicating the analysis. It’s essential to ensure comprehensive logging of process creation and command-line execution to capture the necessary telemetry. A related detection for monitoring unusual outbound traffic (e.g., unexpected external connections) could further enhance correlation and context for the investigation.

