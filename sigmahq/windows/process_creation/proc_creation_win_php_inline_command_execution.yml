  ---

  ### Technical Context

  This rule detects the execution of PHP using the `-r` flag, which allows the execution of PHP code directly from the command line. Attackers may use this technique to execute arbitrary PHP code, potentially deploying reverse shells or other malicious payloads. This behavior fits within the MITRE ATT&CK framework under the tactic **Execution** (TA0002) and technique **Command-Line Interface** (T1059).

  The primary telemetry source is Windows process creation logs, specifically looking at processes spawned by `php.exe`. If this command execution is malicious, it could facilitate unauthorized access or data exfiltration. It is important to note that detection of this command alone does not confirm that malicious activity has occurred; it merely indicates that a specific command was executed, which could also be legitimate.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Check for Windows Security Event ID 4688 for instances where `php.exe` has been executed with the `-r` parameter. Look for the presence of unexpected commands in the CommandLine field.

  - **Identify benign use cases**: Assess if the detected command execution corresponds to expected behavior from authorized IT or development personnel. Legitimate users may execute PHP scripts for application development tasks, which typically would not be accompanied by the `-r` flag.

  - **Inspect for malicious command patterns**: Look for suspicious commands following the `-r` flag in the CommandLine field, such as code snippets that establish outbound network connections or spawn additional processes, e.g., `shell_exec`, `exec`, or connecting to external IP addresses.

  - **Gather additional telemetry**: Review Sysmon Event ID 1 logs to track any child process creation that stems from `php.exe`, and monitor network traffic (such as HTTP requests) initiated by these processes to detect potential C2 communications.

  - **Confirm file changes**: If applicable, check for files created or modified in the temporary directories (e.g., %TEMP%) after executing the command, which may indicate a reverse shell payload that was instantiated by the PHP execution.

  - **Assess asset criticality**: If this alert is triggered on a critical server (e.g., web applications, database servers), prioritize the investigation, as it represents a higher risk than similar actions on lower-tier assets.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on systems where PHP is used for web applications. The likelihood of malicious use is realistic, as command-line execution with the `-r` flag is a common vector for attackers to exploit server vulnerabilities. This behavior can be weaponized, especially in the context of compromised servers or web applications.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive process logging and could be circumvented by attackers renaming legitimate `php.exe` files or using scheduled tasks to execute PHP commands. It is vital to ensure that logs from process creation are consistently collected for reliable detection. Legitimate maintenance scripts may also trigger this alert. Related detections should include command line executions of other scripting languages (e.g., PowerShell scripts) to enhance overall coverage against similar execution techniques.

