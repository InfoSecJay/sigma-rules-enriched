title: Php Inline Command Execution
id: d81871ef-5738-47ab-9797-7a9c90cd4bfb
status: test
description: Detects execution of php using the "-r" flag. This is could be used as
  a way to launch a reverse shell or execute live php code.
references:
- https://www.php.net/manual/en/features.commandline.php
- https://www.revshells.com/
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\php.exe'
  - OriginalFileName: 'php.exe'
  selection_cli:
    CommandLine|contains: ' -r'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of PHP scripts using the command line with the `-r` flag on Windows systems. The `-r` flag allows executing PHP code directly from the command line, which can be abused by attackers to execute arbitrary commands or launch a reverse shell. This behavior often indicates unauthorized access or exploitation attempts, especially in scenarios where a compromised host may want to establish a covert communications channel back to an attacker's server.

  The primary objective of such behavior is to execute malicious code or achieve persistence within the target environment, aligning with various tactics outlined by MITRE ATT&CK. Notably, this behavior maps to the tactic of Execution (TA0002) and Technique T1059 (Command and Scripting Interpreter), which emphasizes utilizing command-line tools for scripting and execution of arbitrary commands.

  The key data source for this detection is process creation events, specifically targeting command line usage of PHP (`php.exe`). Analysts can leverage Windows Event Logs to gain insights into when and how these commands were executed.

  ### Investigation Steps
  - **Review Process Creation Events:** Check the logs for the execution of `php.exe`. Look specifically for events that capture the command line arguments used during execution.
  - **Analyze Command Line Syntax:** Focus on instances where the command line contains the `-r` flag. Investigate the surrounding syntaxes and executed PHP code for any indicators of malicious behavior.
  - **Assess User Context:** Determine which user account executed the PHP command. Look for any anomalies such as unexpected administrative privileges or accounts that usually do not interact with PHP scripts.
  - **Identify Anomalous Network Activity:** Cross-reference the timing of the detected PHP executions with any unusual outbound network connections or reverse shell attempts, particularly connections to known malicious IP addresses.

  ### Prioritization
  This alert is categorized as medium severity due to the potential for significant impact if an attacker successfully uses command execution to establish a reverse shell. The likelihood of exploitation attempts increases in environments where PHP is present but unauthorized script execution is uncommon.

  ### Blind Spots and Assumptions
  A major blind spot in this detection is the potential for alternative scripting methods or tools that could achieve similar malicious outcomes without utilizing PHP. The detection logic assumes that the use of the `-r` flag is indicative of nefarious activity; however, legitimate administrative tasks may inadvertently trigger this rule. Additionally, for this alert to function properly, process creation event logging must be enabled and adequately configured on the monitored systems, ensuring the collection of command line arguments.

