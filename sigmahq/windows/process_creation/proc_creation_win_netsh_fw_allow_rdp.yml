title: RDP Connection Allowed Via Netsh.EXE
id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
status: test
description: Detects usage of the netsh command to open and allow connections to port
  3389 (RDP). As seen used by Sarwent Malware
references:
- https://labs.sentinelone.com/sarwent-malware-updates-command-detonation/
author: Sander Wiebing
date: 2020-05-23
modified: 2023-12-11
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
        # Example:
        #   Old: netsh firewall add portopening TCP 3389 "Open Port 3389"
        #   New: netsh advfirewall firewall add rule name= "Open Port 3389" dir=in action=allow protocol=TCP localport=3389
    CommandLine|contains|all:
    - 'firewall '
    - 'add '
    - 'tcp '
    - '3389'
    CommandLine|contains:
    - 'portopening'
    - 'allow'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: high
note: |
  ### Technical Context
  This rule detects the unauthorized use of the `netsh.exe` command-line utility to modify firewall settings in a Windows environment, specifically allowing connections on port 3389, which is used for Remote Desktop Protocol (RDP). Attackers may leverage this technique to create backdoors or facilitate unauthorized remote access to compromised systems. The rule was inspired by the Sarwent malware, a known threat that exhibits behavior consistent with this detection logic.

  The primary objective of an attacker using this technique is likely to bypass defensive mechanisms and establish a persistent method of access to the target environment. By allowing RDP connections, attackers can gain control over systems remotely, potentially leading to further exploitation, data exfiltration, or lateral movement within the network. This behavior falls under the MITRE ATT&CK framework's tactics of **Defense Evasion** (T1562.004) as it seeks to modify security settings to avoid detection.

  Primary data sources for this detection include **process creation events** that log command execution details within the Windows environment. These logs will reveal instances of `netsh.exe` execution along with the associated command-line parameters that can indicate potential malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for instances of `netsh.exe` execution, focusing on entries that involve modifying firewall rules or allowing connections on port 3389.
  - **Analyze Command-Line Arguments:** Specifically identify the command-line strings associated with `netsh.exe` executions and look for keywords such as "firewall", "allow", and "tcp 3389" to confirm if the command aligns with known attack patterns.
  - **Correlate with User Accounts:** Determine if the user account executing the command has legitimate administrative rights or is associated with known malicious actors. Validate whether the command was executed during a standard administrative activity.
  - **Check Network Connections:** Investigate network connection logs to identify any recent RDP connections, especially those initiated following the execution of the malicious command. Look for connections from unusual sources or outside typical operational hours.

  ### Prioritization
  Given the high potential for unauthorized access and the associated risks to sensitive data and system integrity, this alert holds a high severity level in an enterprise environment. The likelihood of exploitation through an opened RDP port presents significant threats, including lateral movement and data compromise.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include legitimate administrative activities that may trigger similar command executions without malicious intent, leading to false positives. The detection logic assumes that `netsh.exe` is being used inappropriately, without accounting for legitimate administrative procedures. Additionally, the rule relies on accurate logging configurations for process creation events to be effective; therefore, if these logs are not captured due to misconfiguration or disabled auditing features, the alert may fail to trigger, leading to undetected malicious activity.

