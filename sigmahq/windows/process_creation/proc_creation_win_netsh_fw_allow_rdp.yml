title: RDP Connection Allowed Via Netsh.EXE
id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
status: test
description: Detects usage of the netsh command to open and allow connections to
  port 3389 (RDP). As seen used by Sarwent Malware
references:
- https://labs.sentinelone.com/sarwent-malware-updates-command-detonation/
author: Sander Wiebing
date: 2020-05-23
modified: 2023-12-11
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
        # Example:
        #   Old: netsh firewall add portopening TCP 3389 "Open Port 3389"
        #   New: netsh advfirewall firewall add rule name= "Open Port 3389" dir=in action=allow protocol=TCP localport=3389
    CommandLine|contains|all:
    - 'firewall '
    - 'add '
    - 'tcp '
    - '3389'
    CommandLine|contains:
    - 'portopening'
    - 'allow'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the usage of the `netsh.exe` command to open and allow connections to port 3389 (RDP), which is a technique commonly utilized by attackers to enable remote access on compromised systems. The likely objective is to reverse the security posture of the system, making it accessible to an attacker post-initial compromise. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the specific technique of Application Layer Protocol (T1686.003).

  The primary telemetry sources include Windows process creation events, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, this could lead to unauthorized remote access, potentially allowing attackers to control the system and escalate privileges. However, it is crucial to note that this detection does NOT confirm that the session established is malicious or indicative of an ongoing attack without further corroborative evidence.

  ### Investigation Steps

  - **Review recent command line activity:** Examine process creation logs for `netsh.exe` execution (Security Event ID 4688 or Sysmon Event ID 1) and the specific command line arguments used. Look for signs of modification such as `add rule name="Open Port 3389"`.

  - **Validate the command's context:** Cross-reference user activity to check if legitimate administrative users initiated `netsh.exe`. Analyze the account context, focusing on privileged accounts, to determine if their actions are within normal operational behavior.

  - **Correlate firewall changes:** Check the Windows Firewall or Advanced Firewall logs for any newly added incoming rules to port 3389. Verify timestamps and users to see if they match the netsh command execution. Look for any anomalies that could suggest unauthorized changes.

  - **Identify high-confidence malicious usage:** Look for instances where `netsh.exe` was invoked with arguments related to the RDP port configuration, such as: `add rule name="Open Port 3389" dir=in action=allow protocol=TCP localport=3389`. This combination of parameters is typically malicious in intent.

  - **Review legitimate use cases:** Understand legitimate administrative workflows involving `netsh` leading to an RDP configuration. This may include IT maintenance activities that usually take place during defined business hours to differentiate between benign and suspicious cases.

  ### Prioritization

  This alert is of high severity since it involves an attacker's potential manipulation to enable RDP access, providing possible entry points for lateral movement in the network. The likelihood of being malicious is significant given that the process is being executed with parameters typically associated with backdoor creation. Further, RDP is a commonly weaponized service in various attacks.

  ### Blind Spots and Assumptions

  While the detection identifies the command usage, it does not guarantee that the resulting state poses a risk; it could be benign administrative activity. There may be evasion techniques, such as using alternative commands or scripting to achieve similar outcomes without triggering this alert. Additionally, legitimate administration tasks may trigger the rule. A companion detection to consider is monitoring for successful RDP connection logs (Security Event ID 4624) that follow the execution of `netsh.exe`, enhancing coverage for potential unwanted remote access attempts.

