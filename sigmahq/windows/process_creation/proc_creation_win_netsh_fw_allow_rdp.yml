title: RDP Connection Allowed Via Netsh.EXE
id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
status: test
description: Detects usage of the netsh command to open and allow connections to
  port 3389 (RDP). As seen used by Sarwent Malware
references:
- https://labs.sentinelone.com/sarwent-malware-updates-command-detonation/
author: Sander Wiebing
date: 2020-05-23
modified: 2023-12-11
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
        # Example:
        #   Old: netsh firewall add portopening TCP 3389 "Open Port 3389"
        #   New: netsh advfirewall firewall add rule name= "Open Port 3389" dir=in action=allow protocol=TCP localport=3389
    CommandLine|contains|all:
    - 'firewall '
    - 'add '
    - 'tcp '
    - '3389'
    CommandLine|contains:
    - 'portopening'
    - 'allow'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: high
note: |
  ### Technical Context

  This rule detects the execution of `netsh.exe` commands that modify firewall settings to allow incoming connections on TCP port 3389, which is used for Remote Desktop Protocol (RDP). The likely attacker objective is to establish remote control of the compromised system, often seen in post-exploitation scenarios where an adversary seeks to enable persistent access for further operations. This detection aligns with the MITRE ATT&CK technique "Application Layer Protocol" (T1562.004).

  The primary telemetry sources include Windows process creation events and command line activity logged by Sysmon (Event ID 1) and Security Event ID 4688. If malicious, the use of this rule indicates unauthorized exposure of RDP, significantly increasing the risk of lateral movement or full system compromise. This detection does NOT confirm an active compromise; it merely indicates potentially dangerous configuration changes.

  ---

  ### Investigation Steps

  - **Check process creation logs**: Look for Sysmon Event ID 1 or Security Event ID 4688 where the Image field contains `netsh.exe`. Compare timestamps with any known scheduled tasks or administrative maintenance windows.

  - **Review command line arguments**: Analyze the CommandLine field for the presence of keywords like 'firewall', 'add', 'tcp', and '3389' in the relevant events. Malicious entries will typically attempt to configure the firewall to allow RDP without justification.

  - **Validate legitimate behavior**: Confirm if similar command attempts correspond with documented IT maintenance activities or routine administrative functions, such as patching or resizing services.

  - **Inspect firewall rules**: Using PowerShell (`Get-NetFirewallRule`), check for any firewall rules that allow inbound connections on TCP port 3389. Ensure they align with your organization's policy and do not have unapproved origins.

  - **Identify high-confidence malicious indicators**: If the event logs show `netsh.exe` running with no legitimate prior RDP needs, this may indicate malicious activity, especially if correlated with other indicators of compromise, such as browser history showing suspicious web pages.

  - **Cross-reference network logs**: Assess network telemetry for incoming RDP connection attempts (e.g., Windows Event ID 5156 - Windows Filtering Platform) following the execution of the detected command. Look for unusual IP addresses attempting to connect to this system.

  ---

  ### Prioritization

  This alert should be considered high priority, as it reveals a potential change to a critical service (RDP) on potentially valuable systems. The likelihood of malicious abuse is significant, especially given the known usage by malware in prior attacks. The configuration of RDP access is a common tactic employed by attackers post-exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may be circumvented by legitimate administrative actions, where an approved administrator may use `netsh.exe` for firewall configuration. The presence of alternative tools or scripts that achieve similar results (e.g., PowerShell commands) may evade detection as well. It is essential to ensure that logging for both Sysmon and Windows Security is correctly configured. A related detection to enhance coverage could be monitoring for unauthorized access attempts on RDP using Windows Event ID 4625 (failed logon events).

