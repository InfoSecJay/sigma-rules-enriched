  ### Technical Context

  This rule detects the execution of ADCSPwn, a tool used for privilege escalation in Active Directory environments by exploiting vulnerabilities in certificate services through machine account coercion. The likely attacker objective is to gain elevated access to network systems, facilitating further lateral movement or data exfiltration. This behavior relates to the MITRE ATT&CK tactic of Credential Access (TA0006) and specifically technique T1557.001, which encapsulates credential dumping through various means.

  The primary telemetry source is Windows process creation logs, specifically focusing on command line arguments found in Security Event ID 4688 or Sysmon Event ID 1. If this behavior is confirmed malicious, it enables adversaries to leverage compromised accounts to gain unauthorized access, potentially compromising the integrity of network security. However, this detection does NOT confirm that an attack is solely in progress; it merely indicates the use of a known tool that requires further investigation into context and actions performed.

  ### Investigation Steps

  - **Review command line arguments:** Check for `CommandLine` (Event ID 4688 or Sysmon ID 1) that includes `--adcs` and `--port`. Malicious indicators include the exact phrasing and parameters typically associated with ADCSPwn execution.

  - **Validate execution context:** Identify the user account associated with the process. If the command is executed by a high-privilege account (e.g., Domain Admin), this may indicate a higher likelihood of malicious intent.

  - **Correlate with network traffic:** Analyze network logs for unusual connections to certificate services (e.g., ports 80/443) originating from the system's IP after the detected process creation event. Legitimate administrative tasks will generally not target these endpoints in this manner.

  - **Identify previous process chains:** Examine process trees linked to this execution to spot any prior suspicious behavior, such as processes that attempted to gather credentials or actively exploit the Active Directory environment.

  - **Monitor for related activities:** Investigate other Security Event IDs around the same time (like Event ID 4768 and 4771 for Kerberos ticket requests) that may indicate malicious user account activities related to the execution context of ADCSPwn.

  ### Prioritization

  This alert carries high severity due to the potential impact on critical systems if exploited by an adversary to escalate privileges. The likelihood of malicious abuse is significant, as ADCSPwn is deliberately designed for this purpose and represents an advanced threat. Its behavior is not commonly seen in legitimate administrative workflows, marking it as a distinctive red flag.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques that may obscure the use of tools like ADCSPwn, such as obfuscating command-line parameters or running the tool under different executables. This detection requires correct configurations and monitoring of process creation logs to be effective. Legitimate administrative functions might inadvertently trigger these alerts when using tools for similar purposes, such as managing cert services. A related detection that enhances coverage would involve monitoring for other known tools or scripts used for privilege escalation, like Mimikatz, to ensure comprehensive oversight of credential access techniques.

