note: |
  ### Technical Context
  This detection rule identifies the execution of ADCSPwn, a tool specifically designed to exploit vulnerabilities within Active Directory Certificate Services (ADCS). ADCSPwn allows attackers to escalate privileges on Active Directory environments by coercing machine accounts to authenticate and then relaying those credentials to the certificate service. The objective of utilizing such a tool typically stems from an attacker's goal to gain higher-level access or maintain persistence within a compromised network.

  The relevant MITRE ATT&CK tactics/techniques included here are "Collection" (T1400), indicating that the tool collects sensitive data, and "Credential Access" (T1557.001), which highlights the specific method of acquiring account credentials. As such, it serves as a crucial detection point to understand malicious behavior targeting the ADCS, a critical aspect of many enterprise networks.

  Primary data sources for effective detection include process creation logs, which will capture command-line executions of suspicious processes, particularly parameters associated with ADCSPwn. Monitoring these logs can provide valuable insights into potential exploitation attempts in a Windows environment.

  ### Investigation Steps
  - **Review Process Creation Logs:** Identify events that include command lines with the parameters `--adcs` and `--port`. These logs will provide the foundation for analyzing potential ADCSPwn executions.
  - **Correlate with Network Traffic:** Analyze outbound traffic for any unusual connections to ADCS endpoints, focusing on anomalies in communication patterns that could suggest exploitation attempts.
  - **Inspect Active Directory Audit Logs:** Check for unusual authentication events or failed logon attempts, especially from machine accounts, which could indicate the preliminary steps of an attack involving privilege escalation.
  - **Examine Security Event Logs:** Look for events related to certificate services or any suspicious process creations that coincide with the execution of ADCSPwn, as this may indicate a more significant ongoing attack.

  ### Prioritization
  The alert is classified as high severity due to the potential impact that successful exploitation of ADCS could have on the enterprise, including unauthorized access and the risk of compromise at a domain-privileged level. The likelihood of this occurrence, particularly in environments using Active Directory, necessitates immediate investigation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if process creation logging is not fully enabled or if ADCSPwn execution differs significantly from standard use cases. The detection logic assumes that the command-line parameters are consistently used in an observable manner and that adequate process creation logs are being captured. It requires proper configuration of logging policies to ensure complete fidelity in evidence collection for effective response and investigation.

