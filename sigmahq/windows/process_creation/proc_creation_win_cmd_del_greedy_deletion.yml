title: Greedy File Deletion Using Del
id: 204b17ae-4007-471b-917b-b917b315c5db
status: test
description: Detects execution of the "del" builtin command to remove files using
  greedy/wildcard expression. This is often used by malware to delete content of folders
  that perhaps contains the initial malware infection or to delete evidence.
references:
- https://www.joesandbox.com/analysis/509330/0/html#1044F3BDBE3BB6F734E357235F4D5898582D
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113 , X__Junior (Nextron Systems)
date: 2021-12-02
modified: 2023-09-11
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Example:
    #   del C:\ProgramData\*.dll & exit
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_extensions:
    CommandLine|contains:
    - '\\\*.au3'
    - '\\\*.dll'
    - '\\\*.exe'
    - '\\\*.js'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This detection identifies the execution of the "del" or "erase" commands in Windows command line interfaces, particularly when using greedy or wildcard expressions. Attackers may utilize this behavior to remove potentially incriminating files, such as malware payloads or logs, in an effort to eliminate evidence of their presence. This activity is relevant to the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Indicator Removal on Host" (T1070.004).

  The primary telemetry sources include process creation logs, specifically looking for CommandLine arguments within Windows Security Event ID 4688 or Sysmon Event ID 1 logs. If malicious, this behavior can lead to the loss of critical evidence necessary for incident response efforts. However, this detection does not confirm that the executed command was used for malicious intent without further investigation.

  ---

  ### Investigation Steps

  - **Check CommandLine for patterns:** Review process creation logs (Event ID 4688/Sysmon Event ID 1) for any instances of `del` or `erase` commands used with wildcard patterns (e.g., `del C:\ProgramData\*.dll`). Analyze the legitimacy of the file extensions and target paths involved.

  - **Identify legitimate behavior:** Validate the command's context by checking if similar commands have been executed under legitimate administrative scripts or automated tasks. Ensure the command's execution aligns with known and expected business processes.

  - **Inspect user context:** Determine the user or service account that executed the `del` command. Cross-reference this against privileges normally associated with that account; high-risk accounts executing deletion commands warrant further scrutiny.

  - **Analyze system impact:** Review affected file locations for critical data losses. Determine the potential impact on system integrity and operational continuity if important files are deleted.

  - **Correlate with historical data:** Search for previous command executions by the same user or on the same system to identify patterns of suspicious activity or escalation attempts. Check for abnormal spikes in file deletions.

  - **Look for companion alerts:** Check for related alerts regarding anomalous process creation or network activity. The presence of additional alerts, such as abnormal outbound connections or suspicious file transfers, may indicate a broader compromise.

  ---

  ### Prioritization

  This alert should be treated with medium priority due to its potential to indicate evidence removal and cover-up efforts by an adversary. Systems involved in critical operations or sensitive data handling are particularly at risk, as malicious deletion can undermine security and data integrity.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by logged command line visibility or process creation configurations. Attackers may employ evasion techniques such as altering execution contexts or using alternative scripting methods that do not trigger this rule. Additionally, legitimate administrative activities, such as scheduled tasks performing routine clean-ups, could inadvertently trigger this alert. Companion detections such as file integrity monitoring can provide additional coverage and context for understanding potentially malicious deletions.

