title: Greedy File Deletion Using Del
id: 204b17ae-4007-471b-917b-b917b315c5db
status: test
description: Detects execution of the "del" builtin command to remove files 
  using greedy/wildcard expression. This is often used by malware to delete 
  content of folders that perhaps contains the initial malware infection or to 
  delete evidence.
references:
- https://www.joesandbox.com/analysis/509330/0/html#1044F3BDBE3BB6F734E357235F4D5898582D
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113 , X__Junior (Nextron Systems)
date: 2021-12-02
modified: 2023-09-11
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Example:
    #   del C:\ProgramData\*.dll & exit
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_extensions:
    CommandLine|contains:
    - '\\\*.au3'
    - '\\\*.dll'
    - '\\\*.exe'
    - '\\\*.js'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "del" or "erase" commands with wildcard file deletion patterns in Windows environments. Such behavior can signify an attacker’s objective to erase files that may contain malware artifacts or delete evidence of an intrusion. This activity is relevant to the MITRE ATT&CK technique T1070.004, which is about file and directory deletion for concealment purposes.

  The primary telemetry sources are process creation logs (Event ID 4688) that capture command line arguments for executed processes, specifically filtering for instances where `cmd.exe` is used with deletion commands. If malicious, this behavior could indicate an attempt to obfuscate the presence of malware. However, this detection does NOT confirm malicious intent solely based on command execution, as legitimate scripts may use similar commands for maintenance purposes.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Security Event ID 4688 to identify instances of `cmd.exe` executed with `del` or `erase` commands. Look for command line arguments involving wildcards such as `*.*`. Malicious examples might include `del C:\path\to\folder\*.*`, while benign examples may target specific files.

  - **Validate File Impact:** Investigate file deletions by cross-referencing with File Audit logs (Event ID 4663) for the given file paths to see if critical files were affected. If the deletion affects system-critical files or detected malware, it indicates a higher likelihood of malicious activity.

  - **Scrutinize Command Origin:** Determine the parent process of the command execution through Event ID 4688 to find if it was triggered by a suspicious process (such as an uncommon application or service). Legitimate instances would typically originate from known system processes or administrative scripts.

  - **Monitor for Further Evidence Deletion:** Check for additional deletion commands or malicious script execution that may follow this action in the timeline, using Sysmon Event ID 1 for process creation tracking. Look for similar patterns, which may indicate an ongoing malware operation.

  - **Identify Scheduled Tasks or Scripts:** Investigate if the deletion command was part of a scheduled task or a script. Inspect Task Scheduler logs (Event ID 106) for abnormal tasks that may execute deletion commands at irregular intervals.

  - **Review Related Alerting and Anomaly Detection:** Ensure related detections, such as process injections or unusual file modifications (using Analytics Log for user behavior anomalies), are monitored. These companion detections may provide insight into broader malicious efforts if present.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of the deletion on the affected systems, especially if crucial files or malware remnants are targeted. The likelihood of malicious abuse is moderately high, particularly as the behavior ties to common post-exploitation cleaning methods used by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of benign administrative activities that may inadvertently trigger the alert if they involve legitimate file maintenance. For effective detection, ensure that logging for command line execution and process creation is correctly configured to capture all relevant events. Additionally, common legitimate activities such as system cleanup scripts can inadvertently generate this alert. A related detection to consider is monitoring for anomalous file access patterns (e.g., numerous read/delete operations in a short time span), which could complement the investigation.

