title: Greedy File Deletion Using Del
id: 204b17ae-4007-471b-917b-b917b315c5db
status: test
description: Detects execution of the "del" builtin command to remove files 
  using greedy/wildcard expression. This is often used by malware to delete 
  content of folders that perhaps contains the initial malware infection or to 
  delete evidence.
references:
- https://www.joesandbox.com/analysis/509330/0/html#1044F3BDBE3BB6F734E357235F4D5898582D
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113 , X__Junior (Nextron Systems)
date: 2021-12-02
modified: 2023-09-11
tags:
- attack.stealth
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Example:
    #   del C:\ProgramData\*.dll & exit
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_extensions:
    CommandLine|contains:
    - '\\\*.au3'
    - '\\\*.dll'
    - '\\\*.exe'
    - '\\\*.js'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the `del` command in Windows, specifically when used with wildcard expressions to remove multiple files indiscriminately. This behavior is often employed by malicious actors to eliminate evidence or erase files related to initial malware infections. The relevant MITRE ATT&CK tactic is **Obfuscation** (TA0001) and the technique is **Indicator Removal on Host** (T1070.004).

  The primary telemetry sources include Windows process creation logs, specifically Event ID 4688, detailing command-line arguments of executed processes. If this behavior is malicious, it can lead to data loss, disruption of services, or compromise of forensic investigations. It is important to note that detection of this activity does not independently confirm malicious intent; legitimate users may also execute these commands in practice.

  ### Investigation Steps

  - **Review the process creation event:** Check Windows Security Event ID 4688 for the command line associated with `cmd.exe`. Look for "del" or "erase" commands followed by wildcard specifications. Assess if the context is consistent with normal user activities.

  - **Analyze command line arguments:** Validate specific command line patterns, particularly those with wildcard characters (e.g., `del C:\*.*`). Legitimate usage may involve targeted deletions rather than indiscriminate ones.

  - **Check for file deletion artifacts:** If files are deleted, validate creation or modification timestamps for files located in directories that were targets of the `del` command. This can confirm malicious file removal activities.

  - **Identify high-confidence malicious indicators:** Note if the command deletes sensitive file types (e.g., **.dll** or **.exe**) in critical system or application directories, which would indicate an elevated threat.

  - **Compare against expected legitimate behavior:** Record typical commands logged by users in your environment. Legitimate users might execute `del` with explicit file names rather than wildcards.

  - **Investigate source of execution:** Identify the user and system context from which the `cmd.exe` was invoked. Check if the session contains administrative privileges or originated from an unauthorized machine.

  ### Prioritization

  This alert should be considered medium severity due to the potential for system-wide impact if critical files are deleted. The likelihood of this technique being exploited by attackers is significant, especially in environments where data sanitization is crucial. It is a behavior often leveraged during the latter stages of an attack to hinder detection and response efforts.

  ### Blind Spots and Assumptions

  Detection may be limited by users executing legitimate maintenance scripts that also use `del` with similar patterns. It is essential to ensure that monitoring configurations for logging process creation events (Event ID 4688) are in place across all endpoints. Additionally, legitimate administrative actions such as batch file clean-up scripts may trigger false positives. Implementing companion detections for unusual network activity post-deletion can enhance overall coverage and context for possible malicious activities.

