title: Greedy File Deletion Using Del
id: 204b17ae-4007-471b-917b-b917b315c5db
status: test
description: Detects execution of the "del" builtin command to remove files using
  greedy/wildcard expression. This is often used by malware to delete content of folders
  that perhaps contains the initial malware infection or to delete evidence.
references:
- https://www.joesandbox.com/analysis/509330/0/html#1044F3BDBE3BB6F734E357235F4D5898582D
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113 , X__Junior (Nextron Systems)
date: 2021-12-02
modified: 2023-09-11
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Example:
    #   del C:\ProgramData\*.dll & exit
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_extensions:
    CommandLine|contains:
    - '\\\*.au3'
    - '\\\*.dll'
    - '\\\*.exe'
    - '\\\*.js'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of the `del` command, which is executed through the Windows Command Prompt (cmd.exe) to delete files using wildcard expressions. Such behavior is often associated with malicious activities, where an attacker attempts to erase evidence of their presence or remove a specific file set that may contain indicators of compromise (IoC). Attackers may utilize this command to eliminate remnants of malware from compromised systems or to hinder forensic analysis after a breach.

  The primary MITRE ATT&CK technique associated with this behavior is **T1070.004: File Deletion**, which falls under the tactic of Defense Evasion. Here, the attacker seeks to cover their tracks, making it challenging for incident responders to ascertain what files were present and what actions were taken on the system.

  In finding evidence of this behavior, the most relevant data sources include process creation events, which capture command execution in Windows. Monitoring these logs allows for the identification of potentially harmful command line activities, particularly those that involve the `del` or `erase` commands.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs that capture process creation events to identify instances where `cmd.exe` was executed with the `del` or `erase` command. Check for unusual command line parameters related to file deletion.
  - **Examine Command Line Arguments**: Focus specifically on command line arguments involving wildcard expressions (e.g., `\\*.dll`, `\\*.exe`). This could indicate attempts to delete multiple files at once, which is suspicious behavior.
  - **Investigate Related File Changes**: Identify and investigate changes in file metadata, specifically looking for files or folders that may have been deleted around the same time. This may require correlating the time of the `cmd.exe` execution with the timestamps of file changes.
  - **Gather Contextual Data**: Collect surrounding logs, such as Windows Event logs, to contextualize the use of the `del` command. Pay attention to user account activity during the time frame of execution to determine whether there are any anomalous user behaviors.

  ### Prioritization
  The severity of this alert is medium due to its potential impact on the integrity of forensic analysis within an enterprise environment. While not all uses of the `del` command are malicious, the specific context of wildcard usage may suggest an effort to cover malicious tracks, which necessitates further investigation.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage may be the reliance on process creation logs, which may not capture instances where command redirection is used or other means of executing deletion commands without invoking `cmd.exe`. Additionally, the detection logic assumes that the logs for command execution are retained and accessible for analysis. For accurate detection, it's essential that auditing for process creation is correctly configured and enabled across all Windows endpoints where sensitive operations may occur.

