note: |
  ### Technical Context

  This rule detects the execution of `jsc.exe`, the JScript compiler found in Windows environments. Attackers may leverage `jsc.exe` to compile JScript files dynamically, evading application whitelisting controls typically designed to block suspicious scripts. This behavior corresponds to the MITRE ATT&CK framework under the tactic of Defense Evasion, specifically technique T1127 (Trusted Developer Utilities). The primary telemetry source includes Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, which capture detailed process execution data.

  If malicious, the execution of `jsc.exe` could indicate an attempt to run obfuscated scripts or payloads that circumvent security measures. However, this detection does not confirm malicious intent on its own, as legitimate developers may also use `jsc.exe` to compile authorized scripts.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and/or Sysmon Event ID 1 for `jsc.exe` execution. Look for command line arguments that hint at suspicious activity, such as non-standard paths or obfuscated scripts.

  - **Validate parent process relationships:** Check for unusual parent processes (e.g., cmd.exe, PowerShell) that can indicate malware execution. Correlate logs from Event ID 4688 to identify unexpected chains of process creation.

  - **Identify script files being compiled:** Inspect the command line arguments for `jsc.exe` to identify the specific JScript files being compiled. Examples of bad indicators include file paths leading to temporary directories or user profile directories that are typically not used for legitimate development work.

  - **Establish baseline legitimate usage:** Identify known cases of legitimate `jsc.exe` use by authorized development teams. Document legitimate paths and arguments when `jsc.exe` is executed to differentiate between benign and suspicious behavior.

  - **Correlate with threat intelligence feeds:** Check if `jsc.exe` executions correlate with known threat indicators, such as TTPs from recent incidents or adversary groups known to utilize JScript in their operations.

  ### Prioritization

  This alert is of low severity, as it may often indicate benign usage, such as compiling scripts for legitimate development purposes. However, the likelihood of malicious abuse increases if combined with other indicators of compromise, particularly in environments that follow strict application whitelisting policies.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers renaming malicious scripts or using alternative compilation methods. Reliable detection requires comprehensive logging of process creation activities and may require additional configuration to capture Event ID 4688 effectively. Legitimate activities might include authorized developers compiling scripts, requiring contextual understanding of normal development workflows. A companion detection to consider is tracking executions of PowerShell scripts, which may align with similar exploitation tactics when used alongside `jsc.exe`.

