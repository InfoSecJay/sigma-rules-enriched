note: |
  ### Technical Context

  This Sigma rule detects the execution of the JScript Compiler (`jsc.exe`), often used by attackers to compile malicious JScript files dynamically, facilitating the execution of scripts without relying on traditional execution methods that might be blocked by application whitelisting. The objective of the attacker could involve evading detection mechanisms and performing actions that could lead to further exploitation or compromise of the target system.

  The relevant MITRE ATT&CK tactic is **Execution (TA0002)** with the technique identified as **JScript (T1127)**. The primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1), which capture process execution details. If malicious, the activity could enable a range of attacks, including script-based exploits or lateral movement. However, it is important to note that the detection of `jsc.exe` execution does not confirm malicious intent on its own, as legitimate developers may also use this utility.

  ### Investigation Steps

  - **Review executed processes:** Check for `jsc.exe` execution: Look for Security Event ID 4688. Note the parent process ID and the command line arguments. A well-known benign parent process is `powershell.exe`, while execution from unexpected contexts (e.g., startup scripts) can indicate malicious intent.

  - **Analyze user context:** Identify the user account executing `jsc.exe`: Cross-reference the Event ID with user activity logs (e.g., login times, typical usage patterns). Legitimate use may appear during coordinated developer activities, while anomalous execution outside of these windows could suggest compromise.

  - **Check for script files:** Investigate recent script files compiled: Locate JScript files and timestamps in the same execution context using file system logs (e.g., `FileSystem Auditing - Events 4663`). If `jsc.exe` is detected compiling unusual script files (e.g., web exploits), it strengthens the case for malicious activity.

  - **Examine network activity:** Monitor for outbound connections post-execution: Investigate associated network logs (e.g., Windows Filtering Platform logs) for unusual connections or data exfiltration attempts that follow the process execution. Legitimate development activity should not invoke unexpected network communications.

  - **Assess system integrity:** Review indicators of compromise: Use host-based detection tools to examine logs for any additional signs of compromise or lateral movement patterns that followed the execution of `jsc.exe`.

  ### Prioritization

  The alert's severity is low, reflecting that while the affected system may be critical depending on its role, `jsc.exe` executions can originate from both legitimate and malicious actions. The likelihood of malicious abuse is moderate, particularly in environments lacking sufficient application whitelisting. This method is commonly weaponized in targeted attacks, including malware delivery.

  ### Blind Spots and Assumptions

  Detection may miss executions if `jsc.exe` is run from a location not monitored or if event logging is inadequate. Attackers may also rename or obfuscate the executable. Legitimate developer activities, such as routine compilations under known developer accounts, may trigger the alert. Companion detections, such as monitoring for unusual PowerShell commands or scripts, can enhance overall coverage and context for potential exploits.

