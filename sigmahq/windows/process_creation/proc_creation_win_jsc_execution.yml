note: |
  ---

  ### Technical Context

  This detection identifies the execution of `jsc.exe` (JScript Compiler), commonly exploited by attackers to compile malicious JScript files, facilitating code execution while bypassing application whitelisting mechanisms. The likely objective of the adversary is to run scripts stealthily, leveraging system tools to evade detection. This behavior is categorized under the MITRE ATT&CK framework as Defense Evasion (T1127).

  The primary telemetry source for detection is Windows process creation logs, particularly Security Event ID 4688 or Sysmon Event ID 1. If `jsc.exe` is executed with malicious intent, the security impact can be significant, potentially leading to further exploitation of system vulnerabilities or data compromise. It is crucial to note that detection of `jsc.exe` execution alone does not confirm malicious activity, as legitimate developers may use this utility for benign purposes.

  ---

  ### Investigation Steps

  - **Check process execution details:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for process creation logs of `jsc.exe`. Look for command-line arguments that indicate potentially malicious activities, such as obfuscated script paths or unusual flags.

  - **Identify parent process:** Analyze the parent process of `jsc.exe` to determine the context of execution. A suspicious parent process (e.g., a known malicious script runner or unexpected execution by a system service) increases the likelihood of malicious intent.

  - **Evaluate command-line usage:** Inspect the command-line parameters associated with `jsc.exe`. Legitimate use often includes paths to files developers control, while malicious usage may involve obfuscated or randomly named scripts that lack context.

  - **Monitor for known artifacts:** Check for the creation or modification of associated JScript files during the same time frame. Files created before the `jsc.exe` execution, especially with names that resemble system processes or tools, are high-confidence indicators of malicious intent.

  - **Assess asset criticality:** Determine the role of the host (e.g., server, user workstation). Execution on critical assets (like domain controllers) raises the severity of the incident and warrants immediate escalation.

  ---

  ### Prioritization

  The alert severity is low due to the legitimate use of `jsc.exe` by developers. However, the alert should not be dismissed, as malicious actors commonly weaponize JScript for defense evasion, increasing the likelihood of abuse in enterprise environments, particularly when executed in unusual contexts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions, as less privileged accounts may prevent visibility into all process invocations. Legitimate activities, such as script compilation by developers, might trigger this alert. An effective complementary detection would involve monitoring for abnormal PowerShell usage, as it is often used in conjunction with JScript compilation for advanced threats.

