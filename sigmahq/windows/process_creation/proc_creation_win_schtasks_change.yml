logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - ' /Change '
    - ' /TN '
  selection_susp_locations:
    CommandLine|contains:
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Temporary Internet'
    - 'C:\ProgramData\'
    - 'C:\Perflogs\'
    - '%ProgramData%'
    - '%appdata%'
    - '%comspec%'
    - '%localappdata%'
  selection_susp_images:
    CommandLine|contains:
    - 'regsvr32'
    - 'rundll32'
    - 'cmd /c '
    - 'cmd /k '
    - 'cmd /r '
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
    - 'powershell'
    - 'mshta'
    - 'wscript'
    - 'cscript'
    - 'certutil'
    - 'bitsadmin'
    - 'bash.exe'
    - 'bash '
    - 'scrcons'
    - 'wmic '
    - 'wmic.exe'
    - 'forfiles'
    - 'scriptrunner'
    - 'hh.exe'
    - 'hh '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious modifications made to existing Windows scheduled tasks, which may indicate malicious activity such as persistence or privilege escalation by an attacker. By altering a scheduled task after its initial creation, attackers can stealthily introduce malicious payloads without triggering alerts typically associated with the creation of new tasks. The objective behind this technique is often to maintain a foothold within the environment and execute malicious code at predefined intervals or under specific conditions.

  The relevant MITRE ATT&CK tactics associated with this activity include **Persistence** (TA0003), where attackers establish methods to maintain presence on a system; **Privilege Escalation** (TA0004), where attackers gain higher-level permissions; and **Execution** (TA0002), used to run malicious code. Specifically, this rule relates to the technique **Scheduled Task/Job (T1053.005)**, which covers the manipulation of scheduled tasks as a means of executing code in an adversarial manner.

  Key telemetry sources that provide the best evidence for detecting this behavior include **process creation events** that capture commands run alongside scheduled tasks, as well as Windows Event Logs that record task modifications and other administrative activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `schtasks.exe` being executed, specifically focusing on command lines containing `/Change` and `/TN`.
  - **Analyze Command Line Arguments**: Identify all command lines that disclose execution paths leading to temporary or common user directories (e.g., `%TEMP%`, `C:\ProgramData\`), which are suspect locations for malicious payloads.
  - **Correlate with Scheduled Task Logs**: Utilize Windows Security Event Logs related to task modifications to determine if changes align with observed process creation events, noting the original and new configurations of the affected tasks.
  - **Investigate Executor Tools**: Examine possible tools used in the command line (e.g., `powershell`, `cmd`, `regsvr32`, etc.) for abnormal usage patterns that might indicate the use of legitimate utilities for malicious execution.

  ### Prioritization
  The alert is classified as high severity because modifications to scheduled tasks can facilitate persistent unauthorized access to systems. Given that attackers often leverage such capabilities to maintain control and execute malicious operations, timely detection is critical in mitigating potential risks.

  ### Blind Spots and Assumptions
  This detection rule may not cover all potential methods of persistence and execution, especially if attackers use non-default or less common tools for modifying tasks. The detection logic assumes that scheduled tasks exist in the monitored environment and any changes will be reflected in the available logs. Additionally, comprehensive logging of process creation events must be enabled for effective detection, and certain configurations on endpoints could lead to missed alerts if improperly configured or disabled.

