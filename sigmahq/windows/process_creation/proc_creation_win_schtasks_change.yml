note: |
  ### Technical Context

  This rule detects modifications to existing Windows Scheduled Tasks using the `schtasks.exe` utility, particularly when these tasks are altered to execute commands from suspicious directories, such as temporary or public user folders. Attackers may aim to execute malicious payloads secretly by changing pre-existing tasks instead of creating new ones, which can draw more scrutiny. The relevant MITRE ATT&CK tactic is "Persistence" (TA0003) and the technique is "Scheduled Task/Job" (T1053.005). The primary telemetry sources include Windows Security Event IDs related to process creation (ID 4688) and the command-line arguments executed.

  If malicious, this behavior can indicate an attempt to establish persistence on a compromised system, enabling attackers to maintain control. However, this detection does NOT confirm that the activity is malicious; legitimate administrative actions can also modify scheduled tasks under normal operations.

  ### Investigation Steps

  - **Examine process creation logs for schtasks.exe usage**: Review Security Event ID 4688 logs for instances of `schtasks.exe` being executed. Pay attention to the command line for the usage of ` /Change ` followed by ` /TN ` which indicates task modification.

  - **Analyze command line for malicious indicators**: Check the CommandLine field in process creation logs for references to suspicious directories such as `\AppData\Local\Temp` or `\Downloads\`. If found, correlate these with the task name being changed.

  - **Identify typical benign behavior**: Look for the creation or modification of scheduled tasks by administrative users or system accounts, which may occur during system updates or legitimate maintenance tasks. These typically point to standard directories like `C:\Windows\System32` and use clearly defined script names.

  - **Correlate with Execution of known malicious commands**: Check for execution of potentially harmful command line applications such as `powershell.exe`, `cmd.exe`, or `mshta.exe`. If they appear with the schtasks modification, it increases the confidence that the activity is malicious.

  - **Validate task status and scheduled times**: Use `Get-ScheduledTask` PowerShell command to check if the modified task is currently running or scheduled at unusual times, such as after hours, which may indicate malicious intent.

  - **Assess asset criticality**: Determine the nature of the asset affected by viewing its role in the organization (critical server, user workstation, etc.). Higher severity should be assigned if critical business assets are involved.

  ### Prioritization

  This alert should be treated with high severity due to the potential for attackers to leverage scheduled tasks for persistence on critical systems. The likelihood of abuse is high, as such modifications can enable silent execution of malicious code. Additionally, the behavior detected here is commonly weaponized in malware campaigns seeking long-term access.

  ### Blind Spots and Assumptions

  This detection may be limited by users legitimately modifying scheduled tasks, resulting in false positives. The effectiveness of this rule depends on having comprehensive logging enabled, specifically around process creation events. Additionally, legitimate administrative tools may inadvertently trigger this alert. Companion detections, such as monitoring for unauthorized access attempts to `schtasks` and `taskschd.msc`, can enhance overall coverage and reduce blind spots.

