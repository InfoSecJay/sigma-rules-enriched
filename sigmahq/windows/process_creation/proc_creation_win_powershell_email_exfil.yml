detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Add-PSSnapin'
    - 'Get-Recipient'
    - '-ExpandProperty'
    - 'EmailAddresses'
    - 'SmtpAddress'
    - '-hidetableheaders'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of PowerShell for exfiltrating email addresses from a Microsoft Exchange server. It identifies scripts that utilize cmdlets such as `Get-Recipient` combined with parameters designed to extract email information. The likely attacker objective is to gather credentials or lists of targets for further exploitation, often indicating preparatory steps for phishing attacks or credential harvesters.

  This behavior aligns with MITRE ATT&CK tactic "Exfiltration" (TA0010) and technique "Exfiltration Over Command and Control Channel" (T1041). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture executed processes and their command-line arguments. If this activity is confirmed as malicious, it poses a significant risk, enabling an adversary to harvest sensitive information. However, detection of this activity does NOT confirm that exfiltration was successful or that the identified target accounts have been compromised.

  ### Investigation Steps

  - **Identify the process creation event:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances where `Image` ends with `powershell.exe` or `pwsh.exe`. Confirm if the `CommandLine` contains all specified keywords.

  - **Analyze command-line parameters:** Check the `CommandLine` for occurrences of `Add-PSSnapin`, `Get-Recipient`, and `-ExpandProperty`. The presence of these parameters increases suspicion of email exfiltration and should be treated as high-confidence malicious indicators.

  - **Correlate with user activity:** Investigate the user associated with the PowerShell command. If the command was executed by a user with no legitimate reason to access email addresses (e.g., a service account), flag this for further analysis.

  - **Review legitimate use cases:** Determine if the PowerShell command usage aligns with known benign activities, such as administration tasks by IT personnel managing recipient information. Compare user roles and service needs with expected usage patterns.

  - **Check for anomalous remote connections:** Look for outputs in the command regarding remote connections (e.g., outbound connection attempts to external SMTP servers). High volumes of outbound traffic directed towards external email servers during the same timeframe as the PowerShell execution can indicate exfiltration attempts.

  - **Validate related log events:** Identify any associated logs that indicate file creation or outbound email activity that align with the identified command, such as SMTP logs showing email being sent after PowerShell execution.

  ### Prioritization

  This alert is high-severity due to the potential impact of email exfiltration. The likelihood of malicious abuse is significant, particularly given that adversaries frequently use these tactics in successful phishing and credential harvesting operations. This technique is commonly weaponized in targeted attacks against enterprises, making prompt investigation crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging or if PowerShell is run in a non-traditional manner (e.g., encrypted scripts). Ensure appropriate logging configurations are enabled for PowerShell command-line activities. Legitimate administrative scripts for user management might trigger this alert, necessitating careful review of context. Related detections, such as monitoring for large quantities of suspicious SMTP traffic or script execution from non-administrator accounts, can help strengthen coverage and validation of threat activity.

