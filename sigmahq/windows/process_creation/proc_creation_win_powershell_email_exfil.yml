logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Add-PSSnapin'
    - 'Get-Recipient'
    - '-ExpandProperty'
    - 'EmailAddresses'
    - 'SmtpAddress'
    - '-hidetableheaders'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential email exfiltration attempts using PowerShell cmdlets, specifically those associated with manipulating and querying email addresses within a Microsoft Exchange environment. By leveraging the `Add-PSSnapin` and `Get-Recipient` cmdlets, an attacker could aim to gather sensitive email information and exfiltrate it outside the organization, potentially for malicious purposes such as spear-phishing or credential harvesting.

  The likely attacker objective is to collect and send sensitive email data without detection, targeting the organization's email communication and sensitive information flows. This kind of behavior aligns with the **Exfiltration** tactic (TA0010) in the MITRE ATT&CK framework, specifically leveraging **Data Exfiltration Over Command and Control Channel** (T1041) and possibly **Data from Information Repositories** (T1213) for extracting sensitive information.

  Primary data sources for this detection include **process creation logs**, specifically for PowerShell executables, which capture command-line arguments to infer any suspicious activities or patterns indicative of exfiltration attempts.

  ### Investigation Steps
  - **Analyze Process Creation Logs**: Review process creation events for instances of `powershell.exe` or `pwsh.exe` with associated command-line arguments, particularly those containing `Get-Recipient` and `EmailAddresses`.

  - **Correlate with Email Logs**: Examine email server logs (e.g., Exchange logs) for unusual access patterns or bulk requests around the same time as the identified PowerShell execution events that may signify unauthorized data access.

  - **Inspect Outbound Connections**: Look for any suspicious outbound connections or HTTP requests following the execution of the detected PowerShell commands, ideally checking for unusual IP addresses or email domains.

  - **Review User Access Levels**: Verify the privileges of the user or service account running the PowerShell commands to confirm legitimate usage rights and detect any misconfigurations or potential compromises.

  ### Prioritization
  The alert is classified as high severity due to the critical nature of email systems in enterprises, where compromised email accounts can lead to extensive data breaches, revealing sensitive information and facilitating further attacks.

  ### Blind Spots and Assumptions
  This detection rule may not capture all exfiltration attempts, particularly if attackers use non-PowerShell methods or alter command-line patterns to evade detection. It assumes that logging for PowerShell activities and process creation is properly configured and enabled across all relevant systems. Additionally, use of legitimate administrative PowerShell commands by trusted users can lead to false positives but may still pose risks if abused. Ensuring logging of all PowerShell activities and proper monitoring for anomalies is essential for effective detection.

