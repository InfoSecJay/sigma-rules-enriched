title: PUA - Advanced Port Scanner Execution
id: 54773c5f-f1cc-4703-9126-2f797d96a69d
status: test
description: Detects the use of Advanced Port Scanner.
references:
- https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Other/Advanced%20Port%20Scanner
author: Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-18
modified: 2023-02-07
tags:
- attack.discovery
- attack.t1046
- attack.t1135
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|contains: '\advanced_port_scanner'
  - OriginalFileName|contains: 'advanced_port_scanner'       # Covers also advanced_port_scanner_console.exe
  - Description|contains: 'Advanced Port Scanner'
  selection_cli:
    CommandLine|contains|all:
    - '/portable'
    - '/lng'
  condition: 1 of selection_*
falsepositives:
- Legitimate administrative use
- Tools with similar commandline (very rare)
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_pua_advanced_port_scanner/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of Advanced Port Scanner, a tool commonly used for network discovery and vulnerability assessment. An attacker may utilize this software to map out a target network, identifying live hosts, open ports, and services running on those ports, potentially leading to further exploitation. The primary objective may involve reconnaissance to discover weaknesses in the infrastructure, allowing for later stages such as privilege escalation or lateral movement.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Discovery (T1083): Information about networks, systems, and users.
  - Port Scanning (T1046): The external probing of host services to collect information.
  - Network Service Scanning (T1135): Scanning a network to identify services available on the hosts.

  The primary log sources that would provide valuable evidence for this rule include process creation events, which log details about executable files running on the system, and associated command-line arguments that can provide additional context to the tool's usage.

  ### Investigation Steps
  - **Collect Process Creation Logs:** Gather logs related to process creation on endpoints to identify any instances of Advanced Port Scanner. Pay close attention to execution paths and command-line arguments that may indicate suspicious behavior.

  - **Analyze Command-Line Arguments:** Review the command-line arguments associated with the detected process. Look for flags such as `/portable` and `/lng`, which are indicative of the Advanced Port Scanner tool, and may signify potentially unauthorized usage.

  - **Correlate with Network Activity:** Investigate network activity from the detected workstation during the time of execution. Check for unusual scanning patterns, such as a high volume of SYN packets or connections to multiple external IP addresses that may suggest scanning behavior.

  - **Review User Context:** Assess the user account that executed the process. Determine if the action aligns with normal operational behavior or if it appears to be anomalous, indicating the possibility of an insider threat or compromised account.

  ### Prioritization
  This alert maintains a medium severity due to its potential impact on the network's security posture. While the tool can have legitimate administrative uses, its identification often correlates with reconnaissance activities that may precede malicious actions.

  ### Blind Spots and Assumptions
  This detection rule may miss cases where the tool is executed via obfuscation or renamed files, which would not match the specified execution characteristics. The logic assumes that relevant process creation logs are enabled and captured effectively. If system logging settings are insufficient or if the tool is executed in an unexpected manner (e.g., through scripts or encoded commands), these instances may not be detected, leading to gaps in visibility.

