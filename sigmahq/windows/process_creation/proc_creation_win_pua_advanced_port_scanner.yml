note: |
  ### Technical Context

  This rule detects the execution of Advanced Port Scanner (APS), a tool often used for network discovery and scanning. The likely attacker objective includes mapping network services, identifying vulnerabilities, or preparing for further attacks. This detection corresponds to the MITRE ATT&CK tactic of Discovery (TA0007) and the technique Port Scanning (T1046). The primary telemetry sources are process creation logs for Windows environments, specifically monitoring fields that capture command-line arguments and image details. If malicious, unauthorized port scanning can lead to information disclosure and potential exploitation of identified vulnerabilities. Importantly, this detection does NOT confirm an ongoing attack; it simply indicates the potential use of a reconnaissance tool, which may have legitimate purposes.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for process creation details, focusing on `Image`, `OriginalFileName`, and `CommandLine` fields for instances containing "advanced_port_scanner".

  - **Identify command-line arguments:** Specifically look for process creation events where `CommandLine` contains '/portable' and '/lng'. This combination typically indicates potential malicious activity, especially if occurring on systems not typically used for network scanning.

  - **Analyze the host's network activity:** Validate any associated network scans through firewall or IDS/IPS logs, looking for unusual or extensive scanning patterns (e.g., multiple SYN packets targeted at numerous ports within a short timeframe).

  - **Assess historical usage of APS:** Review if Advanced Port Scanner is regularly used in your environment for legitimate network audits by checking recent activity and confirming user identity alongside tool usage patterns.

  - **Check for process parent-child relationships:** Review if the APS execution was spawned by a legitimate administrative process or if it appears suspiciously initiated by unexpected parent processes. Confirm with parent process logs.

  ### Prioritization

  This alert holds medium severity due to its potential impact on network confidentiality and the likelihood of misuse for reconnaissance as part of an intrusion attempt. While not all instances are malicious, the use of such scanning tools is commonly associated with pre-attack preparations, warranting investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where APS is commonly used for legitimate purposes, leading to potential false positives. Coverage relies on the proper logging of process creation events and the monitoring of command-line arguments. Legitimate administrative users may execute APS during network assessments, potentially triggering the alert. Companion detections, such as those for known vulnerability scanning tools or unusual network traffic patterns, can enhance detection capabilities and reduce false positives.

