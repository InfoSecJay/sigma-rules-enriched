note: |
  ### Technical Context

  This detection identifies the execution of `csvde.exe`, a tool used for exporting Active Directory (AD) structure information. The likely attacker objective is to gather sensitive data about the organization's AD, which can assist in further reconnaissance or planning of privilege escalation attacks. The relevant MITRE ATT&CK tactic is **Discovery** (TA0007), with the technique identified as **Active Directory Discovery** (T1087.002).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture information about process executions. If malicious, the security impact could range from unauthorized data access to lateral movement within the network. It’s crucial to note that the detection of `csvde.exe` execution alone does not confirm malicious intent; legitimate administrative tasks may also utilize this tool.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for entries related to `csvde.exe`. Look for an uncommon user account executing this command, which may indicate potential malicious use.

  - **Examine command-line arguments:** Analyze the execution of `csvde.exe` for CommandLine fields containing `-f`, as this indicates that the tool is being used to export data rather than import it. Legitimate exports usually come from IT or system administrator accounts.

  - **Cross-reference with AD logs:** Validate if any recent AD queries or modifications were made around the same time. Unexpected AD access patterns could suggest malicious reconnaissance.

  - **Identify high-risk systems:** Determine the asset classification of the host executing `csvde.exe`. If it's a sensitive server or admin workstation, the alert’s severity increases.

  - **Look for unusual file output:** If `csvde.exe` is exporting AD data, check for the creation of external files or network transmissions. This could indicate data exfiltration, especially if files have been sent to unrecognized or suspicious external IP addresses.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive AD information exposure and the likelihood of misuse by an adversary. While `csvde.exe` can be used for benign administrative tasks, it is commonly weaponized in reconnaissance phases of attacks, making it important to examine context closely.

  ### Blind Spots and Assumptions

  This detection could be evaded by attackers who rename or obfuscate the execution of native tools like `csvde.exe`, or by utilizing PowerShell commands to fetch AD data in a more covert manner. It’s essential to ensure that process creation logs are enabled and comprehensive enough to capture all necessary events. Legitimate administrative activities, such as routine AD audits, may also trigger this alert. Companion detections such as monitoring PowerShell commands (e.g., `Get-ADUser`) can enhance coverage against potential malicious behavior.

