title: Process Access via TrolleyExpress Exclusion
id: 4c0aaedc-154c-4427-ada0-d80ef9c9deb6
status: test
description: Detects a possible process memory dump that uses the white-listed 
  Citrix TrolleyExpress.exe filename as a way to dump the lsass process memory
references:
- https://twitter.com/_xpn_/status/1491557187168178176
- https://www.youtube.com/watch?v=Ie831jF0bb0
author: Florian Roth (Nextron Systems)
date: 2022-02-10
modified: 2022-05-13
tags:
- attack.defense-evasion
- attack.t1218.011
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      # We assume that the lsass.exe process has a process ID that's between 700 and 999 and the dumper uses just the PID as parameter
    - '\TrolleyExpress 7'
    - '\TrolleyExpress 8'
    - '\TrolleyExpress 9'
    - '\TrolleyExpress.exe 7'
    - '\TrolleyExpress.exe 8'
    - '\TrolleyExpress.exe 9'
      # Common dumpers
    - '\TrolleyExpress.exe -ma '
  renamed:
    Image|endswith: '\TrolleyExpress.exe'
  filter_renamed:
    OriginalFileName|contains: 'CtxInstall'
  filter_empty:
    OriginalFileName:
  condition: selection or ( renamed and not 1 of filter* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to access the memory of the Windows Local Security Authority Subsystem Service (LSASS) process using the legitimate filename "TrolleyExpress.exe". This method is often leveraged by attackers to extract credentials, thereby compromising user accounts and systems. The behavior aligns with the MITRE ATT&CK technique for process memory manipulation (Credential Dumping) under T1218.011.

  The primary telemetry sources are Windows Process Creation logs (Event ID 4688) and potentially Sysmon logs if Sysmon is deployed. If this activity is confirmed malicious, it poses a significant risk as it suggests unauthorized access to sensitive credentials which can facilitate further compromise within the organization. However, this detection does NOT confirm malicious intent on its own, as legitimate and authorized uses of similar techniques could account for these events.

  ### Investigation Steps

  - **Review recent process creation events:** Analyze Windows Security Event ID 4688 for instances where "TrolleyExpress.exe" was launched. Check the command line arguments for suspicious parameters such as "7", "8", or "9" which suggest an attempt to dump lsass memory.

  - **Query for Sysmon event logs:** If Sysmon is implemented, review Event ID 1 (Process Creation) for similar process creation entries. Look specifically for "TrolleyExpress.exe" with any argument containing "-ma" indicative of memory dumping.

  - **Validate parent process relationships:** Check parent process IDs (PPID) associated with the TrolleyExpress execution to identify if the launch originated from a suspicious process (e.g., powershell.exe, cmd.exe) which could indicate malicious activity.

  - **Correlate with known benign behavior:** Identify any known legitimate corporate usage of "TrolleyExpress.exe". If found, corroborate against change management documentation to ensure it is authorized and not misused.

  - **Assess system impact and criticality:** Determine the role of affected systems. Systems hosting sensitive applications or critical infrastructure should be prioritized for deeper investigation.

  - **Identify high-confidence malicious indicators:** Note any unusual behaviors associated with the TrolleyExpress execution such as unusual IP connections, or subsequent processes created that indicate lateral movement or further exploitation.

  ### Prioritization

  This alert is high severity due to the potential impact of credential theft from the LSASS process on critical systems. The likelihood of malicious abuse is high, as attackers commonly leverage process memory manipulation techniques to escalate privileges and compromise additional accounts. Moreover, this technique is frequently weaponized in attack scenarios, warranting swift investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by the use of process name obfuscation or renaming by the adversary to evade detection. It relies heavily on the accurate logging and configuration of both Windows Security and Sysmon logs, which must be properly implemented for reliable detection. Additionally, legitimate remote access or debugging actions may inadvertently trigger this alert. Companion detections that reinforce this coverage include monitoring for known credential dumping tools and processes, such as Mimikatz or Procdump usage aimed at LSASS.

