title: Process Access via TrolleyExpress Exclusion
id: 4c0aaedc-154c-4427-ada0-d80ef9c9deb6
status: test
description: Detects a possible process memory dump that uses the white-listed 
  Citrix TrolleyExpress.exe filename as a way to dump the lsass process memory
references:
- https://twitter.com/_xpn_/status/1491557187168178176
- https://www.youtube.com/watch?v=Ie831jF0bb0
author: Florian Roth (Nextron Systems)
date: 2022-02-10
modified: 2022-05-13
tags:
- attack.stealth
- attack.t1218.011
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      # We assume that the lsass.exe process has a process ID that's between 700 and 999 and the dumper uses just the PID as parameter
    - '\TrolleyExpress 7'
    - '\TrolleyExpress 8'
    - '\TrolleyExpress 9'
    - '\TrolleyExpress.exe 7'
    - '\TrolleyExpress.exe 8'
    - '\TrolleyExpress.exe 9'
      # Common dumpers
    - '\TrolleyExpress.exe -ma '
  renamed:
    Image|endswith: '\TrolleyExpress.exe'
  filter_renamed:
    OriginalFileName|contains: 'CtxInstall'
  filter_empty:
    OriginalFileName:
  condition: selection or ( renamed and not 1 of filter* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of TrolleyExpress.exe with command-line arguments indicative of process memory dumping, specifically targeting the LSASS process. The likely attacker objective is to extract sensitive credentials stored in memory, which aligns with the Credential Access tactic, particularly the technique T1003.001 (Credential Dumping: LSASS Memory). Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) and Sysmon logs (Event ID 1), capturing the command-line activity associated with the execution. If malicious, this behavior poses a significant security threat, potentially leading to credential theft and subsequent unauthorized access. It is essential to note that this detection does NOT prove malicious intent or confirm actual credential theft by itself; further investigation is required.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID 4688 for instances where `TrolleyExpress.exe` is executed, paying close attention to the command-line arguments for any that include `7`, `8`, `9`, or `-ma`.

  - **Inspect original file information:** Validate the `OriginalFileName` field in the Sysmon logs to ensure it contains 'CtxInstall'. If not, this may indicate a maliciously renamed executable masquerading as a legitimate process.

  - **Correlate with LSASS process activity:** Investigate the LSASS process (Event ID 10 under Sysmon) for any recent memory access attempts around the same timestamp as the TrolleyExpress execution. Look for abrupt spikes in memory read requests that align with typical credential dumping behaviors.

  - **Identify benign use cases:** Find authorized usages of `TrolleyExpress.exe` within the environment, documenting any such instances. Legitimate executions often align with application updates or administrative tasks where PID numbers do not fall within the `7-9` range.

  - **Check for high-confidence malicious indicators:** Look for any logged attempts to access LSASS directly with unexpected PIDs, especially using the TrolleyExpress.exe methodology.

  - **Monitor for lateral movement indicators:** Review audit logs and alerts for any related suspicious activities that might suggest post-exploitation movement following TrolleyExpress.exe executions, such as unusual authentication attempts or access to sensitive accounts.

  ### Prioritization

  Given the potential impact on credential security and the likelihood of malicious intent in executing a tool designed to dump memory, this alert should be considered high severity. The use of TrolleyExpress.exe to target LSASS processes is a known tactic among proficient adversaries and appears frequently in real-world attacks.

  ### Blind Spots and Assumptions

  One limitation is that whitelisted applications like TrolleyExpress.exe may be used legitimately, creating false positives. Ensuring detailed logging from all endpoints executing this process is crucial for effective detection. Additionally, legitimate instances such as scheduled maintenance or software updates may inadvertently trigger this alert. Companion detections to consider include monitoring for abnormal network traffic patterns or failed login attempts that may correlate with suspicious `TrolleyExpress.exe` activity.

