title: Process Access via TrolleyExpress Exclusion
id: 4c0aaedc-154c-4427-ada0-d80ef9c9deb6
status: test
description: Detects a possible process memory dump that uses the white-listed Citrix
  TrolleyExpress.exe filename as a way to dump the lsass process memory
references:
- https://twitter.com/_xpn_/status/1491557187168178176
- https://www.youtube.com/watch?v=Ie831jF0bb0
author: Florian Roth (Nextron Systems)
date: 2022-02-10
modified: 2022-05-13
tags:
- attack.defense-evasion
- attack.t1218.011
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      # We assume that the lsass.exe process has a process ID that's between 700 and 999 and the dumper uses just the PID as parameter
    - '\TrolleyExpress 7'
    - '\TrolleyExpress 8'
    - '\TrolleyExpress 9'
    - '\TrolleyExpress.exe 7'
    - '\TrolleyExpress.exe 8'
    - '\TrolleyExpress.exe 9'
      # Common dumpers
    - '\TrolleyExpress.exe -ma '
  renamed:
    Image|endswith: '\TrolleyExpress.exe'
  filter_renamed:
    OriginalFileName|contains: 'CtxInstall'
  filter_empty:
    OriginalFileName:
  condition: selection or ( renamed and not 1 of filter* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential instances of process memory dumping targeting the Local Security Authority Subsystem Service (LSASS) process using a whitelisted executable, `TrolleyExpress.exe`. Attackers may employ this technique to extract sensitive information, such as credentials from memory, particularly focusing on LSASS, which handles authentication credentials for users and services. By leveraging a legitimate, whitelisted filename, attackers evade traditional security measures, allowing them to perform credential theft stealthily.

  The rule is rooted in two primary MITRE ATT&CK techniques: **T1218.011 - Signed Binary Proxy Execution** and **T1003.001 - Credential Dumping: LSASS Memory**. The attacker’s objective is typically to gain elevated privileges by harvesting credentials that may then be used for further lateral movement or to escalate access within the network. The detection relies on process creation logs, which provide insights into the command-line arguments that triggered the execution of `TrolleyExpress.exe`.

  Primary data sources for investigation include process creation event logs from Windows systems, which will reveal command line arguments and the originating processes, providing evidence of potentially malicious behavior attempting to blend in with legitimate activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances where `TrolleyExpress.exe` is executed, focusing on the command-line arguments used. Look specifically for patterns associated with LSASS memory dumping.
  - **Analyze Command-Line Arguments:** Identify any command-line arguments that contain indications of targeting the LSASS process (e.g., PID values between 700 and 999). Cross-reference these PIDs with known LSASS process instances.
  - **Monitor Related Process Activity:** Check for any child processes spawned by `TrolleyExpress.exe` to assess if they reflect typical behavior or if they are indicative of suspicious activity.
  - **Correlate with User Behavior:** Determine if the execution of `TrolleyExpress.exe` aligns with user actions. Investigate whether the user had legitimate reasons to invoke this process or if it seems anomalous.

  ### Prioritization
  The alert's severity is high due to the implications of successful credential dumping from LSASS, which can lead to unauthorized access to critical systems and sensitive data. Given the escalating sophistication of attackers leveraging trusted processes, timely investigation is crucial.

  ### Blind Spots and Assumptions
  This detection rule may not cover all methods of credential dumping or process manipulation, particularly if attackers employ other non-whitelisted methods or tools. The detection logic assumes that `TrolleyExpress.exe` is only being used for legitimate purposes or that its appearance in process creation logs could indicate malicious intention, which may not always be the case. Logs must be configured to capture detailed process creation events, and without the necessary logging level, the detection may miss critical evidence.

