title: Rundll32 Execution With Uncommon DLL Extension
id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
status: test
description: Detects the execution of rundll32 with a command line that doesn't 
  contain a common extension
references:
- https://twitter.com/mrd0x/status/1481630810495139841?s=12
author: Tim Shelton, Florian Roth (Nextron Systems), Yassine Oukessou
date: 2022-01-13
modified: 2024-04-04
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_known_extension:
  - CommandLine|contains:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl '
    - '.cpl,'
    - '.cpl"'
    - ".cpl'"
    - '.dll '
    - '.dll,'
    - '.dll"'
    - ".dll'"
    - '.inf '
    - '.inf,'
    - '.inf"'
    - ".inf'"
  - CommandLine|endswith:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl'
    - '.dll'
    - '.inf'
  filter_main_localserver:
    CommandLine|contains: ' -localserver '
  filter_main_zzzzInvokeManagedCustomActionOutOfProc:
    ParentImage|endswith: '\msiexec.exe'
    CommandLine|contains|all:
    - ':\Windows\Installer\'
    - '.tmp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_EdgeUpdate:
    ParentCommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    - '\EDGEMITMP_'
    - '.tmp\setup.exe'
    - '--install-archive='
    - '--previous-version='
    - '--msedgewebview --verbose-logging --do-not-launch-msedge --user-level'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects executions of `rundll32.exe` with command line arguments that do not contain common dynamic-link library (DLL) extensions. This behavior is usually indicative of potentially malicious activities since attackers may use atypical extensions or formats to load and execute malicious code. The likely attacker objective is to execute arbitrary code or evade detection by exploiting Windows' legitimate mechanisms for loading DLLs.

  The relevant MITRE ATT&CK technique is "Signed Binary Proxy Execution" (T1218.011). Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation), which should show process creation events and detailed command line variations. If malicious, this behavior can lead to system compromise or unauthorized data access. Importantly, this detection does NOT confirm malicious intent solely based on the invocation of `rundll32.exe`; further investigation is needed to determine the legitimacy of the action.

  ---

  ### Investigation Steps

  - **Review the command line arguments:**
    Examine the command line used with `rundll32.exe` in Event ID 4688. Look for uncommon or suspicious string patterns lacking standard extensions (e.g., `.dll`, `.cpl`, `.inf`). Legitimate usage typically involves standard extensions.

  - **Check parent process details:**
    For the detected `rundll32.exe` process, analyze the ParentProcessID and ParentImage from Sysmon Event ID 1. Legitimate processes will generally be parented by trusted system processes like `explorer.exe` or `svchost.exe`. An anomalous parent, especially one related to installation or malicious software, is a key indicator of potential compromise.

  - **Verify user context:**
    Identify the user account associated with the process creation via Event ID 4688. If the account is a system account or related to administrative activities, this may indicate normal functionality. Unprivileged or unexpected user accounts executing `rundll32.exe` raise suspicion.

  - **Monitor for unexpected file creations:**
    Check for file creation in `%TEMP%` or other locations by reviewing Sysmon Event ID 11 and Event ID 10 (File Creation and File Creation Time) around the same timestamp as the process creation. Malicious executions may involve temporary or nonsensical file names with uncommon extensions during this process.

  - **Assess execution frequency:**
    Analyze the historical execution of `rundll32.exe` on the affected host using event trend data. Frequent executions with non-standard arguments within a short timeframe, particularly in a non-administrative context, are a strong indicator of malicious behavior.

  - **Consult threat intelligence databases:**
    Look up any unusual arguments observed in conjunction with `rundll32.exe` against threat intelligence feeds and resources like VirusTotal. Known malicious command line patterns may correlate directly with observed behavior.

  ---

  ### Prioritization

  This alert has a medium severity level due to the potential for significant security impact, especially if `rundll32.exe` is used to execute malicious payloads. The likelihood of malicious abuse is considerable, given that attackers frequently leverage common Windows utilities. This tactic is known to be weaponized in various malware campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by improperly configured logging that does not capture all events (e.g., Sysmon not fully implemented). Attackers may employ obfuscation techniques to use legitimate DLLs or disguise command lines. Legitimate activities triggering this alert may include software installations or application updates that call legitimate or benign DLLs incorrectly. A related detection, such as monitoring for anomalous usage of `msiexec.exe`, can enhance coverage by identifying potential abuse of Windows Installer mechanisms.

