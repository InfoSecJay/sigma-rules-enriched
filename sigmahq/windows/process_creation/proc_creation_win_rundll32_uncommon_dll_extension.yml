title: Rundll32 Execution With Uncommon DLL Extension
id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
status: test
description: Detects the execution of rundll32 with a command line that doesn't contain
  a common extension
references:
- https://twitter.com/mrd0x/status/1481630810495139841?s=12
author: Tim Shelton, Florian Roth (Nextron Systems), Yassine Oukessou
date: 2022-01-13
modified: 2024-04-04
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_known_extension:
  - CommandLine|contains:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl '
    - '.cpl,'
    - '.cpl"'
    - ".cpl'"
    - '.dll '
    - '.dll,'
    - '.dll"'
    - ".dll'"
    - '.inf '
    - '.inf,'
    - '.inf"'
    - ".inf'"
  - CommandLine|endswith:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl'
    - '.dll'
    - '.inf'
  filter_main_localserver:
    CommandLine|contains: ' -localserver '
  filter_main_zzzzInvokeManagedCustomActionOutOfProc:
    ParentImage|endswith: '\msiexec.exe'
    CommandLine|contains|all:
    - ':\Windows\Installer\'
    - '.tmp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_EdgeUpdate:
    ParentCommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    - '\EDGEMITMP_'
    - '.tmp\setup.exe'
    - '--install-archive='
    - '--previous-version='
    - '--msedgewebview --verbose-logging --do-not-launch-msedge --user-level'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `rundll32.exe` with command line parameters that contain uncommon or suspicious file extensions. Typically, `rundll32.exe` is used to run functions stored in DLLs; however, attackers often exploit this utility to execute malicious code by passing in maliciously crafted DLLs or extensions. The use of uncommon extensions can indicate an attempt to obfuscate malicious behavior, potentially leading to unauthorized access or privilege escalation within an environment.

  The threat scenario revolves around an adversary trying to execute non-standard code in a manner that evades traditional protections. By leveraging legitimate Windows tools like `rundll32.exe`, attackers aim to blend in with normal operations while conducting reconnaissance, executing payloads, or establishing persistence through `Defense Evasion` techniques—a primary concern for security operations. This alert correlates with MITRE ATT&CK Technique T1218.011, which refers specifically to the use of `rundll32.exe` for execution purposes.

  The primary data sources for this detection rule are process creation events logged on Windows systems, which provide insights into command line arguments and parent-child process relationships that are integral to identifying potentially malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine Windows process creation logs specifically for instances of `rundll32.exe`. Pay attention to command line arguments to identify any uncommon or suspicious extensions being used.

  - **Analyze Parent Process Relationships:** Look at the parent process for `rundll32.exe` executions. Analyze whether a legitimate parent process initiated the call, as anomalous parent-child relationships can indicate malicious intent.

  - **Check for Known Malicious Extensions:** Compile a list of uncommon file extensions that are typically associated with malicious payloads. Cross-reference the detected command lines against this list to assess potential threats.

  - **Investigate System Changes:** Analyze recent changes to the system’s configuration and downloads, particularly around the time of the detected executions. This includes checking for unauthorized DLLs in common directories such as `C:\Windows\System32`.

  ### Prioritization
  The alert carries a medium severity due to the potential impact of successful execution of malicious code via `rundll32.exe`. Given the commonality of legitimate uses for the tool, the likelihood of true positives versus false positives requires careful consideration, as malicious activity could easily blend in with normal operations.

  ### Blind Spots and Assumptions
  This detection logic may have gaps in coverage, particularly if an attacker uses more conventional extensions or entirely different execution methods beyond `rundll32.exe`. The assumption is that process creation events are logged accurately and consistently; however, if logging is misconfigured or disabled, detections could be missed. Additionally, the rule relies on a comprehensive understanding of typical command line usages for `rundll32.exe`—any significant deviation from the norm may not be captured without prior contextual data.

