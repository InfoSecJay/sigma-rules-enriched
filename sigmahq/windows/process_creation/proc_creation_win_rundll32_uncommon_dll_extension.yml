title: Rundll32 Execution With Uncommon DLL Extension
id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
status: test
description: Detects the execution of rundll32 with a command line that doesn't 
  contain a common extension
references:
- https://twitter.com/mrd0x/status/1481630810495139841?s=12
author: Tim Shelton, Florian Roth (Nextron Systems), Yassine Oukessou
date: 2022-01-13
modified: 2024-04-04
tags:
- attack.stealth
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_known_extension:
  - CommandLine|contains:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl '
    - '.cpl,'
    - '.cpl"'
    - ".cpl'"
    - '.dll '
    - '.dll,'
    - '.dll"'
    - ".dll'"
    - '.inf '
    - '.inf,'
    - '.inf"'
    - ".inf'"
  - CommandLine|endswith:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl'
    - '.dll'
    - '.inf'
  filter_main_localserver:
    CommandLine|contains: ' -localserver '
  filter_main_zzzzInvokeManagedCustomActionOutOfProc:
    ParentImage|endswith: '\msiexec.exe'
    CommandLine|contains|all:
    - ':\Windows\Installer\'
    - '.tmp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_EdgeUpdate:
    ParentCommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    - '\EDGEMITMP_'
    - '.tmp\setup.exe'
    - '--install-archive='
    - '--previous-version='
    - '--msedgewebview --verbose-logging --do-not-launch-msedge --user-level'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `rundll32.exe` process with command lines that do not include common file extensions like `.dll`, `.cpl`, or `.inf`, which are typically associated with legitimate use cases. The likely objective of an attacker using this technique is to run malicious code that is disguised as legitimate DLL invocations. This behavior fits into the MITRE ATT&CK framework under the tactic of Execution (T1203) and technique of DLL Search Order Hijacking (T1218.011).

  Primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688, which provides information about processes launched on the system. If the detected behavior is malicious, it could indicate an attempt to execute payloads stealthily. Importantly, this detection alone does not confirm that the execution is malicious; it merely highlights unusual command line usage with `rundll32.exe`.

  ### Investigation Steps

  - **Check event logs for the process creation:** Review Security Event ID 4688 for `rundll32.exe` execution details, including the command line supplied during execution. Look for non-standard extensions or obfuscation in command lines.

  - **Verify parent process relationships:** Identify the parent process using the `ParentProcessId` field in the Security Event logs. Legitimate use is often initiated from system processes, such as software installers or trusted applications like `msiexec.exe`.

  - **Cross-validate file legitimacy:** Confirm if the executed command elicits any legitimate behavior. For example, `rundll32.exe` called by legitimate installers typically use common extensions and predefined arguments.

  - **Identify high-confidence malicious indicators:** Look for command lines that utilize unusual arguments or non-standard file paths, particularly those including unusual extensions or temporary file paths (e.g., paths containing `.tmp`).

  - **Correlate with threat intelligence:** Check for known malicious `rundll32.exe` behaviors in threat intelligence feeds or internal logs that could correlate with the command line patterns observed.

  - **Evaluate host behavior:** Analyze additional artifacts from the host, such as creating or modifying files associated with the execution. Investigate for newly created files in the `%TEMP%` directory or other suspicious locations that may not match standard application behavior.

  ### Prioritization

  The severity of this alert is medium as it indicates potential misuse of a common Windows utility, which could be misused for executing malicious payloads. The effect on an enterprise system can vary significantly based on the criticality of the host system and its role within the environment. This behavior can be weaponized in various attack scenarios, warranting further investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist as sophisticated attackers may rename executables or use other evasion techniques to bypass detection. The rule relies on proper logging configurations; without adequate event logging for process creations, missed detections may occur. Additionally, legitimate administrative tasks or installer processes may trigger this alert if they utilize unexpected command structures or extensions. Companion detections related to Windows Script Host execution or PowerShell activity may strengthen detection reliability against broader attack vectors.

