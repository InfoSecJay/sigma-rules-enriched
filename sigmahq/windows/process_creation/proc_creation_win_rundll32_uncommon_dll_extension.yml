title: Rundll32 Execution With Uncommon DLL Extension
id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
status: test
description: Detects the execution of rundll32 with a command line that doesn't 
  contain a common extension
references:
- https://twitter.com/mrd0x/status/1481630810495139841?s=12
author: Tim Shelton, Florian Roth (Nextron Systems), Yassine Oukessou
date: 2022-01-13
modified: 2024-04-04
tags:
- attack.stealth
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_known_extension:
  - CommandLine|contains:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl '
    - '.cpl,'
    - '.cpl"'
    - ".cpl'"
    - '.dll '
    - '.dll,'
    - '.dll"'
    - ".dll'"
    - '.inf '
    - '.inf,'
    - '.inf"'
    - ".inf'"
  - CommandLine|endswith:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl'
    - '.dll'
    - '.inf'
  filter_main_localserver:
    CommandLine|contains: ' -localserver '
  filter_main_zzzzInvokeManagedCustomActionOutOfProc:
    ParentImage|endswith: '\msiexec.exe'
    CommandLine|contains|all:
    - ':\Windows\Installer\'
    - '.tmp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_EdgeUpdate:
    ParentCommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    - '\EDGEMITMP_'
    - '.tmp\setup.exe'
    - '--install-archive='
    - '--previous-version='
    - '--msedgewebview --verbose-logging --do-not-launch-msedge --user-level'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_rundll32_uncommon_dll_extension/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` with uncommon or unexpected command-line arguments, specifically those that do not contain typical DLL, CPL, or INF extensions. This behavior may indicate an attempt by an attacker to exploit the Rundll32 utility for malicious purposes, potentially loading a DLL that is not commonly associated with legitimate software operations. The likely attacker objective could include execution of arbitrary code or persistence mechanisms, aligning with the MITRE ATT&CK tactic of Execution (TA0002) and specifically technique T1218.011, which involves the use of `rundll32`.

  The primary telemetry source is Windows Process Creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which include details on process creation events. If malicious, this behavior could lead to significant security impacts such as system compromise or data exfiltration. However, it is important to note that this detection does NOT confirm malicious intent on its own, as `rundll32.exe` can also be used legitimately in various administrative contexts.

  ### Investigation Steps

  - **Review the command line arguments:**
    Look for the command line of the detected `rundll32.exe` process (Event ID 4688 or Sysmon Event ID 1). Malicious executions often feature non-standard parameters or paths, especially those not ending in `.dll`, `.inf`, or `.cpl`.

  - **Check the Parent Process:**
    Investigate the parent process of `rundll32.exe`. If it is initiated by `msiexec.exe` with `zzzzInvokeManagedCustomActionOutOfProc`, this may indicate a legitimate MSI installer operation rather than malicious behavior.

  - **Examine Process Creation Timing:**
    Correlate the timing of the process creation (Field: `Creation Time`). Legitimate administrative tasks might occur at regular intervals and during business hours, whereas unusual executions outside of these times could be red flags.

  - **Identify Uncommon DLL Paths:**
    Review the command line for references to DLL files stored in uncommon locations (e.g., temporary directories). Look for filenames or paths that do not adhere to typical application paths, which could indicate malicious activity.

  - **Document legitimate use cases:**
    Confirm known legitimate uses of `rundll32.exe` within your environment, such as specific applications or scripts that utilize it, and ensure any detected execution aligns with documented behavior.

  - **Look for competing processes:**
    Check for simultaneous suspicious processes that may indicate a coordinated attack (e.g., trojan activity). Contextualizing this alert alongside other processes might surface a more extensive attack signature.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized execution of code. The likelihood of malicious abuse is moderate as `rundll32.exe` is frequently weaponized by attackers for executing payloads. Furthermore, such Behavior is known within enterprise environments, requiring prompt review to mitigate potential risks.

  ### Blind Spots and Assumptions

  There are detection limitations such as attackers using common arguments successfully to bypass the rule. The effectiveness of this detection relies heavily on having comprehensive logging enabled for process creation. Legitimate scheduled tasks or software updates may trigger this alert when using `rundll32.exe` for valid operations. A related detection that could enhance coverage is monitoring for unusual process termination patterns, which can serve as indicators of post-exploitation activity.

