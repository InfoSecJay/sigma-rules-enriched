title: Rundll32 Execution With Uncommon DLL Extension
id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
status: test
description: Detects the execution of rundll32 with a command line that doesn't 
  contain a common extension
references:
- https://twitter.com/mrd0x/status/1481630810495139841?s=12
author: Tim Shelton, Florian Roth (Nextron Systems), Yassine Oukessou
date: 2022-01-13
modified: 2026-10-13
tags:
- attack.stealth
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_known_extension:
  - CommandLine|contains:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl '
    - '.cpl,'
    - '.cpl"'
    - ".cpl'"
    - '.dll '
    - '.dll,'
    - '.dll"'
    - ".dll'"
    - '.inf '
    - '.inf,'
    - '.inf"'
    - ".inf'"
  - CommandLine|endswith:
              # Note: This aims to cover: single and double quotes in addition to spaces and comma "," usage.
    - '.cpl'
    - '.dll'
    - '.inf'
  filter_main_localserver:
    CommandLine|contains: ' -localserver '
  filter_main_zzzzInvokeManagedCustomActionOutOfProc:
    ParentImage|endswith: '\msiexec.exe'
    CommandLine|contains|all:
    - ':\Windows\Installer\'
    - '.tmp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  filter_main_streamci:
        # Windows streaming-device class installer, run by svchost (DeviceInstall) during driver setup
        # e.g. rundll32.exe streamci,StreamingDeviceSetup {eeab7790-c514-11d1-b42b-00805fc1270e},asyncmac,{...}
    Image: 'C:\Windows\System32\rundll32.exe'
    ParentImage: 'C:\Windows\System32\svchost.exe'
    CommandLine|contains: ' streamci,StreamingDeviceSetup {'
  filter_optional_EdgeUpdate:
    ParentCommandLine|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    - '\EDGEMITMP_'
    - '.tmp\setup.exe'
    - '--install-archive='
    - '--previous-version='
    - '--msedgewebview --verbose-logging --do-not-launch-msedge --user-level'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_rundll32_uncommon_dll_extension/info.yml
note: |
  ### Technical Context

  This detection rule identifies instances where `rundll32.exe` is executed with a command line that invokes an uncommon Dynamic Link Library (DLL) extension. Attackers may aim to exploit `rundll32.exe` to load malicious DLLs that are not typical in enterprise environments, thereby facilitating evasion or execution of unwanted payloads. The relevant MITRE ATT&CK tactic is "Execution" (TA0040), with technique T1218.011 (Signed Binary Proxy Execution).

  The primary telemetry source is Windows Process Creation Logs, including Event ID 4688 for process creation and Sysmon Event ID 1. If these executions are malicious, they may indicate an attempt to execute potentially harmful code or exfiltrate data. However, this detection alone does not confirm malicious intent; a full investigation is required to ascertain the context and nature of the executed DLL.

  ### Investigation Steps

  - **Review Command Line Arguments**: Analyze the command line of the `rundll32.exe` execution (Event ID 4688 or Sysmon Event ID 1). Look for uncommon DLL extensions that deviate from `.dll`, `.cpl`, or `.inf`. Malicious examples may include extensions like `.tmp` or others not typically associated with standard DLL operations.

  - **Examine Parent Process**: Identify the parent process of `rundll32.exe` by checking the ParentImage field. A common benign parent is `explorer.exe`, while execution under processes like `msiexec.exe` or `svchost.exe` could indicate an attempted exploit or suspicious behavior.

  - **Check Execution Context**: Validate the user context under which `rundll32.exe` is running. If executed by an unexpected administrative account or a service account, this raises potential red flags. Use Event ID 4624 (Logon) to verify this.

  - **Identify Benign Examples**: Familiarize with legitimate uses of `rundll32.exe`, such as Windows updates or system configuration tasks that invoke known DLLs. If the command line matches expected patterns or known good DLLs, it is less likely to be malicious.

  - **Investigate Related Activities**: Review associated logs within a 1-hour timeframe around the detected execution for any prior suspicious activities, like unusual login attempts (Event ID 4625) or file modifications in paths like `C:\Windows\Temp`.

  - **Look for File Creation Indicators**: If the command line references temporary file locations (e.g., `C:\Users\<username>\AppData\Local\Temp`), check for file creations (Event ID 4608) post-execution to see if suspicious or unexpected files are created, which may indicate a data exfiltration or subsequent malicious behavior.

  ### Prioritization

  This alert should be treated with medium priority. The impact of a compromised system running `rundll32.exe` can be high, especially if it leads to additional malicious activities or lateral movement. The likelihood of malicious abuse is moderate due to the commonality of this executable being exploited in various forms of attacks. However, such behaviors are not highly weaponized in all contexts and may show legitimate uses as well.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where legitimate applications install or execute unconventional DLLs, which can generate false positives. It is critical to ensure the collection of relevant process creation logs, including Sysmon configuration for complete monitoring. Additionally, common administrative tasks or software updates may trigger similar alerts without indicating malicious behavior. A companion detection to consider is monitoring for suspicious Windows Service creations (MITRE ATT&CK T1543) that coincide with `rundll32.exe` executions, offering further context for the alert.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
