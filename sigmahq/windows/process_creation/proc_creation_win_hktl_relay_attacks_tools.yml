title: Potential SMB Relay Attack Tool Execution
id: 5589ab4f-a767-433c-961d-c91f3f704db1
status: test
description: Detects different hacktools used for relay attacks on Windows for 
  privilege escalation
references:
- https://foxglovesecurity.com/2016/09/26/rotten-potato-privilege-escalation-from-service-accounts-to-system/
- https://pentestlab.blog/2017/04/13/hot-potato/
- https://github.com/ohpe/juicy-potato
- https://hunter2.gitbook.io/darthsidious/other/war-stories/domain-admin-in-30-minutes
- https://hunter2.gitbook.io/darthsidious/execution/responder-with-ntlm-relay-and-empire
- https://www.localpotato.com/
author: Florian Roth (Nextron Systems)
date: 2021-07-24
modified: 2023-02-14
tags:
- attack.collection
- attack.execution
- attack.credential-access
- attack.t1557.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_pe:
    Image|contains:
    - 'PetitPotam'
    - 'RottenPotato'
    - 'HotPotato'
    - 'JuicyPotato'
    - '\just_dce_'
    - 'Juicy Potato'
    - '\temp\rot.exe'
    - '\Potato.exe'
    - '\SpoolSample.exe'
    - '\Responder.exe'
    - '\smbrelayx'
    - '\ntlmrelayx'
    - '\LocalPotato'
  selection_script:
    CommandLine|contains:
    - 'Invoke-Tater'
    - ' smbrelay'
    - ' ntlmrelay'
    - 'cme smb '
    - ' /ntlm:NTLMhash '
    - 'Invoke-PetitPotam'
    - '.exe -t * -p '          # JuicyPotatoNG pattern https://github.com/antonioCoco/JuicyPotatoNG
  selection_juicypotato_enum:    # appears when JuicyPotatoNG is used with -b
    CommandLine|contains: '.exe -c "{'
    CommandLine|endswith: '}" -z'
  filter_hotpotatoes:    # known goodware https://hotpot.uvic.ca/
    Image|contains:
    - 'HotPotatoes6'
    - 'HotPotatoes7'
    - 'HotPotatoes '         # Covers the following: 'HotPotatoes 6', 'HotPotatoes 7', 'HotPotatoes Help', 'HotPotatoes Tutorial'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Legitimate files with these rare hacktool names
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the execution of various hacktools associated with SMB relay attacks on Windows systems. The primary attacker objective is to escalate privileges by exploiting vulnerable services and improperly configured SMB protocols, allowing malicious actors to hijack authenticated sessions. This behavior fits within the MITRE ATT&CK framework, specifically under the tactic of Credential Access (TA0006) and the technique NTLM Relay (T1557.001). The main telemetry source is Windows Process Creation logs, specifically targeting Event ID 4688 and Sysmon Event ID 1 to capture all process creation events.

  If the detected behavior is confirmed malicious, it can lead to critical system compromise, unauthorized data access, and lateral movement within the network. It is important to note that triggering this detection does NOT automatically confirm an active attack; it indicates suspicious activity that warrants further investigation.

  ### Investigation Steps

  - **Review alert details for process creation events**: Check Windows Security Event ID 4688 or Sysmon Event ID 1 for new processes. Focus on the `Image` and `CommandLine` fields for any terms listed in the detection (e.g., "PetitPotam," "RottenPotato"). Look for known malicious indicators from the rule.

  - **Correlate with network logs**: Analyze network traffic for unusual SMB behavior by checking for spikes in SMB connections or unusual query patterns in Windows Event Logs related to Network Shares. This may indicate attempts to exploit SMB relay vulnerabilities.

  - **Identify benign usage**: Research legitimate applications or processes that may generate similar names (e.g., "HotPotatoes" from the legit software). Use the `filter_hotpotatoes` check from the rule to differentiate between benign and potentially malicious context.

  - **Check for failed login attempts**: Investigate any anomalous failed logins preceding the alert, specifically for accounts used in relay attempts. Look for Event ID 4625 in Windows Security logs and correlate the timestamps with the process creation event.

  - **Validate file operations**: Search for any file creations or modifications in the temp folders (e.g., sources indicated in the rule like `\temp\rot.exe`). Use the filename and path from the rule to validate malicious artifact stages, looking for suspicious executable creations.

  - **Assess affected host criticality**: Determine the role of the host involved in the alert. Identify if it is a high-privilege server (i.e., domain controllers) where such relay attacks would have elevated impacts, thus requiring urgent response.

  ### Prioritization

  This alert is classified as critical due to its potential for severe impact if exploited on high-value assets, such as domain controllers or servers with elevated privileges. The likelihood of misuse is high, given that SMB relay techniques are well-documented and frequently weaponized in actual attacks. Immediate attention is warranted due to the risk of significant security breaches.

  ### Blind Spots and Assumptions

  This detection may have limitations if the targeted system lacks appropriate logging configurations, particularly if process creation logging is disabled. Legitimate services may trigger alerts due to the tools having similar names, which could lead to false positives. Moreover, attack methods could evolve to utilize less recognizable tools that might evade detection. Related detections include monitoring for lateral movement and abnormal authentication patterns within SMB sessions to enhance overall detection coverage.

