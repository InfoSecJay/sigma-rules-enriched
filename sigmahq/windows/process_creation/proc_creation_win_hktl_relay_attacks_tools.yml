logsource:
  category: process_creation
  product: windows
detection:
  selection_pe:
    Image|contains:
    - 'PetitPotam'
    - 'RottenPotato'
    - 'HotPotato'
    - 'JuicyPotato'
    - '\just_dce_'
    - 'Juicy Potato'
    - '\temp\rot.exe'
    - '\Potato.exe'
    - '\SpoolSample.exe'
    - '\Responder.exe'
    - '\smbrelayx'
    - '\ntlmrelayx'
    - '\LocalPotato'
  selection_script:
    CommandLine|contains:
    - 'Invoke-Tater'
    - ' smbrelay'
    - ' ntlmrelay'
    - 'cme smb '
    - ' /ntlm:NTLMhash '
    - 'Invoke-PetitPotam'
    - '.exe -t * -p '          # JuicyPotatoNG pattern https://github.com/antonioCoco/JuicyPotatoNG
  selection_juicypotato_enum:    # appears when JuicyPotatoNG is used with -b
    CommandLine|contains: '.exe -c "{'
    CommandLine|endswith: '}" -z'
  filter_hotpotatoes:    # known goodware https://hotpot.uvic.ca/
    Image|contains:
    - 'HotPotatoes6'
    - 'HotPotatoes7'
    - 'HotPotatoes '         # Covers the following: 'HotPotatoes 6', 'HotPotatoes 7', 'HotPotatoes Help', 'HotPotatoes Tutorial'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Legitimate files with these rare hacktool names
level: critical
note: |
  ### Technical Context
  This detection rule identifies the execution of various hacktools associated with SMB relay attacks on Windows systems, which can be leveraged by attackers for privilege escalation. The attack often targets service accounts, allowing malicious actors to bypass security controls and gain elevated privileges within an environment. Attackers aim to exploit vulnerabilities in Windows SMB protocol handling, utilizing tools that manipulate NTLM authentication mechanisms to impersonate legitimate users and escalate their privileges.

  Relevant MITRE ATT&CK techniques include:
  - **T1557.001**: Man-in-the-middle (MITM) - NTLM Relay: This technique is employed during the execution of the attack to intercept and relay authentication requests.
  - **T1075**: Pass the Hash: Attackers may also utilize captured hashes to authenticate as a user without needing plaintext credentials.

  Primary data sources for effective detection include:
  - **Process creation events**: These logs provide visibility into applications being executed and can indicate the presence of known SMB relay tooling.
  - **Command Line arguments**: Monitoring command line inputs helps in recognizing specific patterns or terms associated with these tools.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of known SMB relay tools such as 'PetitPotam', 'RottenPotato', or 'JuicyPotato' in the process creation records of Windows systems. Pay special attention to the execution paths and parent-child relationships.

  - **Analyze Command-Line Arguments**: Inspect command-line arguments for suspicious usage patterns, particularly those containing 'Invoke-Tater', 'smbrelay', or 'ntlmrelay'. These can reveal attempts to perform NTLM relay attacks.

  - **Check for Anomalous SMB Traffic**: Investigate network traffic logs, especially SMB-related communication to identify if there were any unusual relay attempts or communication with external systems.

  - **Investigate System Authentication Logs**: Review authentication logs for any unusual access attempts by service accounts or authentication requests coming from unexpected systems or users.

  ### Prioritization
  The severity of this alert is critical due to the potential impact of successful SMB relay attacks, which can lead to extensive privilege escalation and unauthorized access within an enterprise environment. The likelihood of such attacks occurring is significant, especially in organizations that utilize SMB for file sharing and have inadequate security controls in place.

  ### Blind Spots and Assumptions
  One critical gap in the detection coverage is the potential for new or undiscovered tools used for SMB relay attacks that are not included in the detection logic, which may lead to false negatives. Additionally, the detection predicates assume that the tools are executed without obfuscation or alteration. For this alert to function properly, it requires adequately configured process creation and command line logging on Windows hosts to ensure that all relevant execution data is captured.

