note: |
  ### Technical Context

  This Sigma rule detects instances where potentially malicious child processes are spawned from `KeyScrambler.exe`, a legitimate application designed to protect keystrokes from keyloggers. Attackers may exploit this application to execute malicious scripts or commands stealthily. The likely attacker objective includes maintaining persistence or executing payloads while evading traditional detection methods. This alert aligns with the MITRE ATT&CK techniques of **Persistence (T1547)** and **Execution (T1203)**.

  The primary telemetry sources include process creation logs from the Windows Event Log (Security Event ID 4688) or Sysmon Event ID 1. If processed maliciously, the impact could allow unauthorized access to sensitive data or increased privilege escalation via script execution. Importantly, this detection does NOT confirm malicious intent on its own, as benign applications can also create child processes.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for events where `KeyScrambler.exe` was the parent process and note the child processes created. Compare process names to the known list (e.g., `powershell.exe`, `cmd.exe`), focusing on those ending with common scripting executables.

  - **Analyze command line arguments:** For any identified children like `powershell.exe`, evaluate the CommandLine field to determine if any unusual scripting parameters are included, such as base64 encoded strings or downloads from untrusted sources.

  - **Identify legitimate behavior:** Confirm expected application use or installation context for `KeyScrambler.exe`. If the software is actively used by employees for password protection or similar purposes, usage patterns will typically show limited child process creation.

  - **Correlate with artifact creation:** If a potentially malicious child process is identified, check for evidence of file creation or modification on the system, such as unusual executables or scripts in commonly targeted directories (e.g., %TEMP%, user home directories).

  - **Cross-reference with threat intelligence:** Verify whether the detected behavior corresponds with documented malicious tactics or tools known to exploit `KeyScrambler.exe`, enhancing confidence in the alert's severity.

  - **Assess the host role:** Consider the sensitivity of the asset involved in the alert (e.g., whether it is a workstation or a server) and its exposure to the network, noting potential impact if compromised.

  ### Prioritization

  This alert is of medium severity due to the potential risk it poses to sensitive information if exploited and the likelihood of the behavior being weaponized in targeted attacks. The affected system's role and context can influence prioritization; for instance, alerts from sensitive roles should be escalated.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for certain child processes or the use of alternative parent processes that aren’t currently included in the rule. It is essential to have comprehensive logging enabled for process creation on all endpoints to ensure reliability. Legitimate software installation or updates may lead to similar process patterns. Related detections focusing on unusual PowerShell execution behaviors (e.g., execution without a script file) can enhance coverage and context.

