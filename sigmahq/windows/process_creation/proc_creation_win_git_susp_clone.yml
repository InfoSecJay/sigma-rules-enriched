title: Suspicious Git Clone
id: aef9d1f1-7396-4e92-a927-4567c7a495c1
status: test
description: Detects execution of "git" in order to clone a remote repository 
  that contain suspicious keywords which might be suspicious
references:
- https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-03
modified: 2023-01-10
tags:
- attack.reconnaissance
- attack.t1593.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\git.exe'
    - '\git-remote-https.exe'
  - OriginalFileName: 'git.exe'
  selection_cli:
    CommandLine|contains:
    - ' clone '
    - 'git-remote-https '
  selection_keyword:
    CommandLine|contains:
            # Add more suspicious keywords
    - 'exploit'
    - 'Vulns'
    - 'vulnerability'
    - 'RemoteCodeExecution'
    - 'Invoke-'
    - 'CVE-'
    - 'poc-'
    - 'ProofOfConcept'
            # Add more vuln names
    - 'proxyshell'
    - 'log4shell'
    - 'eternalblue'
    - 'eternal-blue'
    - 'MS17-'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Git command-line tool to clone remote repositories that contain suspicious keywords. The behavior is indicative of reconnaissance activities where an attacker aims to gather information or exploit vulnerabilities embedded within Git repositories. The relevant MITRE ATT&CK tactic is Reconnaissance (TA0043) and the technique is Data from External Information Sources (T1593.003). The primary telemetry sources for this detection include Windows process creation logs, specifically looking for Event ID 4688 or Sysmon Event ID 1. If successful, a malicious actor could leverage this activity to gain insights into system vulnerabilities or exploit them directly.

  This detection does NOT confirm that malicious activity has occurred; it simply flags suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Check process initiation:** Review Windows Security Event ID 4688 for `git.exe` and `git-remote-https.exe` process creation. Ensure that the command line contains keywords like "clone" and suspicious terms (e.g., "exploit", "CVE-"). Look for any direct execution by unauthorized users.

  - **Evaluate command line arguments:** Focus on CommandLine field from the process creation logs for the presence of suspicious keywords (e.g., "RemoteCodeExecution", "log4shell"). Legitimate Git usage typically does not contain these terms.

  - **Identify repository sources:** Validate the repository URLs linked in the command. Utilize network traffic logs (e.g., Firewall logs, Proxy logs) to see if the connected host matches known risky domains or repositories.

  - **Assess account behavior:** Look into the user or service account that triggered this event from User Account Management logs. Determine if this account has a legitimate reason to execute Git commands and if its activity aligns with normal operational behavior.

  - **Monitor subsequent network activity:** Check for outbound connections made after the suspicious Git clone operation. Use logs from firewalls or web proxies to capture attempts to access remote hosts, indicating potential data exfiltration.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive systems if exploited, and the likelihood of malicious abuse is moderate as Git-based reconnaissance is a known tactic. While it is not common for benign users to clone repositories with such keywords, it is advisable to treat the event carefully, especially if it involves sensitive environments.

  ### Blind Spots and Assumptions

  The detection may miss instances where attackers disguise their command-line arguments with legitimate-sounding keywords or use alternate means of repository access. Reliable detection requires comprehensive logging of process creation and potentially network activity, ensuring no gaps in visibility for git operations. Legitimate activities that may trigger this alert include developers cloning repositories for troubleshooting without malicious intent. A related detection rule to consider would be monitoring for unusual outbound connections stemming from processes that executed Git commands, which further contextualizes any accidental benign activity.

