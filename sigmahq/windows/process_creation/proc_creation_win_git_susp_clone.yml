title: Suspicious Git Clone
id: aef9d1f1-7396-4e92-a927-4567c7a495c1
status: test
description: Detects execution of "git" in order to clone a remote repository that
  contain suspicious keywords which might be suspicious
references:
- https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-03
modified: 2023-01-10
tags:
- attack.reconnaissance
- attack.t1593.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\git.exe'
    - '\git-remote-https.exe'
  - OriginalFileName: 'git.exe'
  selection_cli:
    CommandLine|contains:
    - ' clone '
    - 'git-remote-https '
  selection_keyword:
    CommandLine|contains:
            # Add more suspicious keywords
    - 'exploit'
    - 'Vulns'
    - 'vulnerability'
    - 'RemoteCodeExecution'
    - 'Invoke-'
    - 'CVE-'
    - 'poc-'
    - 'ProofOfConcept'
            # Add more vuln names
    - 'proxyshell'
    - 'log4shell'
    - 'eternalblue'
    - 'eternal-blue'
    - 'MS17-'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the `git` command to clone remote repositories that contain potentially malicious keywords. Attackers may leverage Git to pull malicious code, scripts, or exploits from remote repositories, which they can then utilize in their operations. The presence of keywords commonly associated with vulnerabilities and exploits, such as “RemoteCodeExecution” or specific CVE identifiers, raises the alarm about possible reconnaissance or exploitation activities.

  The key MITRE ATT&CK tactics being targeted in this rule include **Reconnaissance (TA0043)** and the technique **Data from Information Repositories (T1593.003)**. The likely attacker objective is to gather, distribute, or deploy malicious exploits through Git repositories, which can lead to further exploitation within the environment or serve as the first stage of a broader attack campaign.

  Primary telemetry sources that should provide the best evidence for this detection include **process creation logs** from endpoint monitoring tools, capturing details such as command-line arguments and the images being executed. By reviewing these logs, analysts can determine whether the `git` command is being utilized suspiciously and examine the context within which it is executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for instances of `git.exe` or `git-remote-https.exe` to identify execution context, including the user account and command-line parameters used during the clone operation.
  - **Analyze Command-Line Arguments**: Pay close attention to command-line arguments for any keywords associated with threats, such as “exploit” or CVE identifiers. Investigate unusual or unexpected repository URLs being cloned.
  - **Correlate with Threat Intelligence**: Use threat intelligence feeds to correlate any tracking of cloned repositories with known malicious actors or campaigns, focusing on repositories known for distributing exploits.
  - **Check for Post-Execution Artifacts**: If suspicious cloning is identified, check for the presence of scripts or binaries that may have come from these repositories, to assess if further malicious activities are underway.

  ### Prioritization
  This alert is assigned a medium priority due to the potential impact of exploiting the cloned repositories. Although not all cloned data will be harmful, the presence of known vulnerability keywords significantly increases the likelihood that malicious code may be involved, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate uses of Git that may involve similar command-line patterns or keywords without malicious intent, which could lead to false positives. The detection logic assumes logs for process creations and command lines are enabled and comprehensively monitored. If system processes do not record command-line arguments, the effectiveness of this rule may be diminished. Additionally, reliance on specific keywords assumes the attackers will use familiar terms associated with known exploits, potentially missing novel techniques or methods they may employ.

