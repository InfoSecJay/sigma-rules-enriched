title: Suspicious ScreenSave Change by Reg.exe
id: 0fc35fc3-efe6-4898-8a37-0b233339524f
status: test
description: |
  Adversaries may establish persistence by executing malicious content triggered by user inactivity.
  Screensavers are programs that execute after a configurable time of user inactivity and consist of Portable Executable (PE) files with a .scr file extension
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.002/T1546.002.md
- https://www.welivesecurity.com/wp-content/uploads/2017/08/eset-gazer.pdf
author: frack113
date: 2021-08-19
modified: 2022-06-02
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
    - 'HKEY_CURRENT_USER\Control Panel\Desktop'
    - 'HKCU\Control Panel\Desktop'
  selection_option_1:   # /force Active ScreenSaveActive
    CommandLine|contains|all:
    - '/v ScreenSaveActive'
    - '/t REG_SZ'
    - '/d 1'
    - '/f'
  selection_option_2:   # /force  set ScreenSaveTimeout
    CommandLine|contains|all:
    - '/v ScreenSaveTimeout'
    - '/t REG_SZ'
    - '/d '
    - '/f'
  selection_option_3:   # /force set ScreenSaverIsSecure
    CommandLine|contains|all:
    - '/v ScreenSaverIsSecure'
    - '/t REG_SZ'
    - '/d 0'
    - '/f'
  selection_option_4:   # /force set a .scr
    CommandLine|contains|all:
    - '/v SCRNSAVE.EXE'
    - '/t REG_SZ'
    - '/d '
    - '.scr'
    - '/f'
  condition: selection_reg and 1 of selection_option_*
falsepositives:
- GPO
level: medium
note: |
  ### Technical Context
  This rule detects potential persistence mechanisms employed by adversaries who modify screensaver settings using the `reg.exe` process. Attackers may exploit the inactivity screensaver feature to execute malicious payloads when a user is away from their workstation, thereby facilitating unauthorized access or maintaining presence within the environment. By changing keys such as `ScreenSaveActive`, `ScreenSaveTimeout`, `ScreenSaverIsSecure`, and `SCRNSAVE.EXE`, an attacker can ensure that a malicious screensaver is executed under specific conditions.

  The likely attacker objectives include maintaining persistence within the environment, executing code remotely, or performing further privilege escalation. The relevant MITRE ATT&CK tactics/techniques related to this detection include **Persistence (T1546.002)** and **Privilege Escalation (T1068)**. Here, the focus is on how an attacker can modify system settings to carry out their malicious activities undetected.

  Primary data sources for detecting this suspicious behavior include **process creation events** that log the execution of `reg.exe`, along with details captured in command lines associated with registry modifications. These logs provide crucial insights into any unauthorized attempts to alter critical settings tied to screensaver functionality.

  ### Investigation Steps
  - **Review Process Creation Logs:** Inspect process creation events to identify instances where `reg.exe` has been called, focusing on any corresponding command lines that alter screensaver configurations.
  - **Analyze Registry Changes:** Investigate the Windows registry for recent modifications to the `HKEY_CURRENT_USER\Control Panel\Desktop` path, specifically looking for changes related to `ScreenSaveActive`, `ScreenSaveTimeout`, `ScreenSaverIsSecure`, and `SCRNSAVE.EXE`.
  - **Correlate User Activity:** Determine if the changes to screensaver settings coincide with user inactivity or suspicious user behavior, checking for logins, logouts, and other user activity within the relevant time frame.
  - **Examine Malware Indicators:** If a suspicious screensaver file is identified, investigate its reputation using threat intelligence tools and analyze any associated processes for further indicators of compromise.

  ### Prioritization
  Alerts generated by this detection rule should be prioritized as **medium severity**, given that the modification of screensaver configurations can indicate attempts by adversaries to establish persistence and the potential for further malicious actions. Effective detection of this behavior can significantly reduce the window of opportunity for an attacker to execute their payload.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage if the organization employs Group Policy Objects (GPOs) that modify screensaver settings across hosts, which could lead to false positives. The detection logic assumes that `reg.exe` activity is not typical for normal system operations, particularly for non-administrative users. Proper logging and monitoring of process creation events must be enabled for the rule to function effectively, which includes ensuring that command line logging is properly configured in the environment.

