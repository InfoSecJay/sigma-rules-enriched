title: Suspicious ScreenSave Change by Reg.exe
id: 0fc35fc3-efe6-4898-8a37-0b233339524f
status: test
description: |
  Adversaries may establish persistence by executing malicious content triggered by user inactivity.
  Screensavers are programs that execute after a configurable time of user inactivity and consist of Portable Executable (PE) files with a .scr file extension
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.002/T1546.002.md
- https://www.welivesecurity.com/wp-content/uploads/2017/08/eset-gazer.pdf
author: frack113
date: 2021-08-19
modified: 2022-06-02
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
    - 'HKEY_CURRENT_USER\Control Panel\Desktop'
    - 'HKCU\Control Panel\Desktop'
  selection_option_1:   # /force Active ScreenSaveActive
    CommandLine|contains|all:
    - '/v ScreenSaveActive'
    - '/t REG_SZ'
    - '/d 1'
    - '/f'
  selection_option_2:   # /force  set ScreenSaveTimeout
    CommandLine|contains|all:
    - '/v ScreenSaveTimeout'
    - '/t REG_SZ'
    - '/d '
    - '/f'
  selection_option_3:   # /force set ScreenSaverIsSecure
    CommandLine|contains|all:
    - '/v ScreenSaverIsSecure'
    - '/t REG_SZ'
    - '/d 0'
    - '/f'
  selection_option_4:   # /force set a .scr
    CommandLine|contains|all:
    - '/v SCRNSAVE.EXE'
    - '/t REG_SZ'
    - '/d '
    - '.scr'
    - '/f'
  condition: selection_reg and 1 of selection_option_*
falsepositives:
- GPO
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows screensaver settings via the `reg.exe` command, which is often used by attackers to establish persistence on a compromised system. The primary objective of an adversary in this context is to ensure that a malicious screensaver executable is triggered after a specified period of user inactivity, potentially executing additional payloads or facilitating unauthorized access. This behavior fits within the MITRE ATT&CK tactic of Persistence, particularly technique T1546.002 (Screensaver).

  The required telemetry sources for this detection include process creation events, specifically looking for command-line executions related to registry modifications on Windows systems. The security impact could be significant if the screensaver is set to run malicious content, allowing continued access or the execution of exploits without user interaction. This detection does NOT confirm actual malicious execution; it only indicates a configuration change that may enable such behavior.

  ### Investigation Steps

  - **Verify the process origin: **Check for process creation events with Security Event ID 4688 or Sysmon Event ID 1 for `reg.exe` to determine if it is a legitimate system process or potentially a malicious binary masquerading as `reg.exe`.

  - **Analyze command-line arguments: **Focus on the specific command-line arguments associated with the process creation event. Look for the presence of '/v SCRNSAVE.EXE' and '.scr' to confirm that a screensaver executable may be inappropriately configured, indicating potential malicious activity.

  - **Assess user context: **Identify the user account associated with the registry modification by check Event ID 4624 (Logon) or correlate it with user activities around the same time. Determine if the user has appropriate administrative privileges or if it’s anunexpected account related to a targeted attack.

  - **Check for historical changes: **Review the Windows registry (Registry Event ID might be utilized if logging is configured) to identify if there have been any legitimate administrative changes to the screensaver settings in the past weeks or months, providing a baseline of expected behavior.

  - **Monitor screensaver executable integrity: **Examine existing .scr files located in the screensaver directory (C:\Windows\System32) for unknown or unapproved files. Use file hash comparisons with a known good list to identify potential malicious scripts.

  - **Look for additional persistence mechanisms: **Investigate other registry paths associated with persistence (like HKCU\Software\Microsoft\Windows\CurrentVersion\Run) for configurations that might indicate a multi-faceted persistence strategy to reinforce the potential severity of the alert.

  ### Prioritization

  This alert is of medium severity due to the potential impact of the affected system, depending on its role within the enterprise environment (e.g., critical system vs. user workstation). The likelihood of malicious abuse is notable as the configuration of screensaver settings can be weaponized for persistence strategies, which attackers commonly employ to maintain access post-compromise.

  ### Blind Spots and Assumptions

  Limitations include the possibility that legitimate administrative actions (such as Group Policy Object changes) may trigger this alert, resulting in false positives. Reliable detection requires appropriate registry auditing and monitoring capabilities to be configured across the environment. Organizations should be aware that user inactivity leading to screensaver invocation under normal operations may trigger this detection. A related detection for registry changes or the execution of scripts could provide additional context and strengthen overall threat detection capabilities.

