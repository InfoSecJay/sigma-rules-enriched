detection:
  selection:
    CommandLine|contains:
    - '[System.Net.WebRequest]::create'
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
            # - 'Net.WebClient' # There are various other rules that cover this, so it is commented out
    - 'Resume-BitsTransfer'
    - 'Start-BitsTransfer'
    - 'wget '
    - 'WinHttp.WinHttpRequest'
  condition: selection
falsepositives:
- Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and 
  Start-BitsTransfer.
level: medium
