note: |
  ### Technical Context

  This Sigma rule detects the use of various web request commands and cmdlets through command-line tools and PowerShell on Windows systems, specifically commands that initiate HTTP/HTTPS requests. The likely attacker objective is to download files or payloads, potentially leading to further exploitation or data exfiltration. The relevant MITRE ATT&CK technique is "Command and Control: Application Layer Protocol" (T1059.001). The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, which log command-line activities. If malicious, this behavior can result in unauthorized access to sensitive data or the introduction of malware into the environment. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate administrative actions or scripted tasks can also trigger this alert.

  ### Investigation Steps

  - **Check command-line details:** Review the command-line arguments in Windows Security Event ID 4688 or Sysmon Event ID 1 for the presence of the following keywords: `curl`, `Invoke-RestMethod`, or `Invoke-WebRequest`. Note if commands appear in non-administrative user contexts, as this could indicate potential abuse.

  - **Evaluate process lineage:** Investigate the parent process ID related to the detected command in Sysmon Event ID 1. Malicious invocations often originate from unusual parent processes like `cmd.exe`, whereas benign activity may come from other trusted applications or scripts.

  - **Identify actual download content:** For logs that indicate downloads, check the target path and file names associated with the commands using Security Event IDs 4663 (Access to an object). Assess any downloaded files for signatures of malware or known malicious content.

  - **Review expected behavior:** Compare the identified command usage against established organizational practices. Many organizations utilize PowerShell web requests for legitimate system administration tasks (e.g., updating systems or pulling configuration data). Commands that align with approved scripts should be categorized as benign.

  - **Document high-confidence threat indicators:** Focus on command invocations that include suspicious or unknown URLs, or file paths leading to unexpected directories. Command lines that initiate downloads to `C:\Windows\Temp\` or other non-standard applications can be significant indicators of malicious activity.

  ### Prioritization

  This alert has medium severity due to the potential risk of malicious downloads, which can lead to data breaches or system compromises. Although the likelihood of abuse is moderate, the ability to execute web requests is commonly exploited by adversaries to retrieve payloads, thus warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing legitimate administrative tools or cmdlets that fall within expected operational patterns, potentially resulting in false positives. Required log sources must include detailed command-line activity, which must be configured properly to capture all process creations. This alert may also be triggered by legitimate administrative tasks involving system updates or configuration changes. Additionally, monitoring for related indicators such as outbound network connections initiated by the processes may strengthen detection coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
