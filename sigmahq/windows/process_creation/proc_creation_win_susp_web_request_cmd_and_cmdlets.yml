logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '[System.Net.WebRequest]::create'
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
            # - 'Net.WebClient' # There are various other rules that cover this, so it is commented out
    - 'Resume-BitsTransfer'
    - 'Start-BitsTransfer'
    - 'wget '
    - 'WinHttp.WinHttpRequest'
  condition: selection
falsepositives:
- Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and 
  Start-BitsTransfer.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of web request commands and cmdlets, specifically in PowerShell and command-line contexts. Attackers may use these commands to download malware or communicate with command-and-control servers, indicating potential data exfiltration or system compromise. The relevant MITRE ATT&CK technique is `T1059.001 - Command and Scripting Interpreter: PowerShell`. Primary telemetry sources include Windows Process Creation logs, especially Security Event ID 4688 and Sysmon Event ID 1, capturing command-line activities.

  The security impact of these activities can be significant, as they may facilitate remote code execution or data leaks. However, the detection of these commands does NOT confirm malicious intent or activity on its own, as they can also be utilized by legitimate administrative tasks.

  ### Investigation Steps

  - **Review command-line arguments:**
    Check for indicators of malicious use in the CommandLine field (e.g., presence of ‘curl’, ‘wget’, or PowerShell commands like ‘Invoke-WebRequest’). Look for typical arguments used for data exfiltration or file downloads.

  - **Verify process execution context:**
    Examine the parent process ID (PPID) to determine if the command was executed from a legitimate process (like a scheduled task or system process) versus potentially suspicious processes (like cmd.exe or PowerShell initiated from a user profile).

  - **Analyze process creation logs for high-confidence indicators:**
    Identify uncommon parent processes associated with the detected commands, especially those originating from user directories or unknown software. Use Security Event ID 4688 to track this data.

  - **Correlate with previous execution patterns:**
    Look for historical occurrences of benign commands such as system updates or legitimate downloads in the same time frame. Compare CommandLine details with known safe operations to differentiate between benign and malicious activities.

  - **Evaluate the environment for expected behavior:**
    Understand the roles of affected hosts. For example, a system administrator running web requests to update software is generally legitimate, whereas end-user machines executing similar commands should raise alarms.

  ### Prioritization

  The severity of this alert is medium due to the potential risk of malicious use to download and execute harmful payloads, specifically on critical infrastructure or sensitive data systems. Given the commonality of weaponization of these command patterns in various attack vectors, incidents should be investigated promptly.

  ### Blind Spots and Assumptions

  There are limitations in detecting evasion techniques, such as obfuscation of command-line parameters or the use of alternate encoding. Comprehensive logging, including detailed PowerShell transcripts and Module logging settings, is essential for reliable detection. Moreover, legitimate activities like automated script-based software updates may trigger these alerts, warranting careful contextual evaluation. A related detection rule focusing on unauthorized PowerShell script execution would complement coverage and help identify malicious patterns more broadly.

