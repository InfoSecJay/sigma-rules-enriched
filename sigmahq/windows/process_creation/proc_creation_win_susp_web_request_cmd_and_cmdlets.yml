logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '[System.Net.WebRequest]::create'
    - 'curl '
    - 'Invoke-RestMethod'
    - 'Invoke-WebRequest'
    - ' irm '         # Space before and after to avoid false positives with 'irm' as a substring
    - 'iwr '
            # - 'Net.WebClient' # There are various other rules that cover this, so it is commented out
    - 'Resume-BitsTransfer'
    - 'Start-BitsTransfer'
    - 'wget '
    - 'WinHttp.WinHttpRequest'
  condition: selection
falsepositives:
- Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and Start-BitsTransfer.
level: medium
note: |
  ### Technical Context
  This rule detects the usage of web request commands and PowerShell cmdlets, specifically those that can be leveraged to make HTTP or HTTPS requests from a Windows environment. This behavior is often indicative of attempts by attackers to download files or exfiltrate data, utilizing command-line tools like `curl`, `wget`, and PowerShell cmdlets such as `Invoke-WebRequest` and `Start-BitsTransfer`. The monitoring of these activities is critical, as they can serve as a precursor to further malicious actions, such as establishing persistence or data exfiltration.

  The likely attacker objective is to communicate with external servers, either to retrieve malicious payloads or to send sensitive data from the target environment. Such behaviors align primarily with the "Execution" tactic in the MITRE ATT&CK framework, specifically technique **T1059.001** (Command and Scripting Interpreter: PowerShell), which relates to the execution of commands and scripts within PowerShell that can be exploited for malicious purposes.

  Primary data sources for this detection include process creation events that capture command-line arguments, which can provide vital insights into potentially malicious activities initiated within the operating system.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for any recent instances of the detected commands. Pay particular attention to the context of their execution, including the user and the environment from which they were invoked.
  - **Analyze Command-Line Arguments**: For each occurrence of the detected command strings, analyze the full command-line input to identify potential indicators of compromise or unusual parameters that may suggest malicious intent.
  - **Correlate with Network Traffic**: Inspect network traffic logs to determine if there are outbound connections associated with these commands. This can help identify potential command and control traffic or data exfiltration attempts.
  - **Assess User Behavior**: Investigate the user or process initiating these web requests. Look for anomalies in user behavior or account compromise, especially if activity is observed outside of normal working hours or from unfamiliar locations.

  ### Prioritization
  This alert should be considered as medium severity due to the potential impact of unauthorized data downloads or command execution in an enterprise environment. Given that attackers often use such methods to initiate more significant attacks or to exfiltrate data, timely investigation is crucial.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logging is not enabled or properly configured across all endpoints. The detection logic assumes that the commands captured are indicative of typical exploitation techniques; however, legitimate administrative tasks may also trigger these alerts. It is essential that all relevant logs are enabled, particularly PowerShell logging, to ensure effective detection capabilities for this alert.

