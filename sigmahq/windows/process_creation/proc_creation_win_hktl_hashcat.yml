note: |
  ### Technical Context
  This detection rule identifies the execution of Hashcat, a popular password cracking tool, on Windows systems. Specifically, it looks for instances where Hashcat is launched with a command line that includes options for attack modes, hash types, and rules for cracking, indicative of an attempt to crack passwords from a specified SAM file and password list. Attackers may use this tool to gain unauthorized access to accounts by exploiting weak or compromised passwords, often aiming to elevate privileges or access sensitive data.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Credential Access** (TA0006) and more specifically **Password Cracking** (T1110.002). Attackers leveraging tools like Hashcat typically operate to enumerate and crack passwords systematically, which is a critical vector for unauthorized access inside enterprise environments. The primary data sources for this detection include process creation events that log the execution of applications, including their command line arguments.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for events related to Hashcat.exe execution. Look for the command line arguments that include parameters such as `-a`, `-m 1000`, or `-r`, which are specific to its operation modes and indicate potential malicious usage.
  - **Inspect User and Group Changes**: After detecting Hashcat activity, investigate recent changes to user accounts, group memberships, and any attempts to create new accounts that may be connected to the cracking attempt.
  - **Analyze Windows Event Logs**: Check for related Windows Event IDs (such as 4688 for process creation) around the time Hashcat was executed to identify any anomalies or related suspicious activity.
  - **Gather Relevant Alerts**: Correlate this detection with alerts from other security tools (e.g., EDR or SIEM) that may indicate credential misuse or lateral movement following the Password Cracking activity.

  ### Prioritization
  The alert is classified as high severity due to the potential impact of successful password cracking, which can lead to unauthorized access to sensitive systems and data. Given the prevalence of password attacks in the threat landscape, the likelihood of occurrence warrants immediate investigation.

  ### Blind Spots and Assumptions
  This detection should be cautious of false positives since legitimate software or scripts might generate similar command line flags. It assumes that the command line usage of Hashcat will be logged adequately. A potential gap in detection coverage may arise if process creation logging is disabled or if the attacker uses variations of Hashcat that aren't captured by this specific selection logic. Ensuring comprehensive logging configurations for process creation is essential for this alert to function effectively.

