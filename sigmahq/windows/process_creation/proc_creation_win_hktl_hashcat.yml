note: |
  ### Technical Context

  This Sigma rule detects the execution of Hashcat, a password-cracking tool, specifically when it is executed with parameters indicative of cracking password hashes from the Windows Security Account Manager (SAM) file. The likely attacker objective is to recover user passwords to gain unauthorized access to systems or sensitive data. This behavior correlates with the MITRE ATT&CK tactic for Credential Access, specifically technique T1110.002 (Password Cracking).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688, which records the creation of new processes. If this behavior is malicious, it poses a significant security risk as it can facilitate unauthorized access to user accounts and escalate privileges within the target environment. It is important to note that this detection alone does NOT confirm that the activity is malicious without further context or corroborating evidence.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for processes with the image path ending in `\hashcat.exe`. This specifically indicates the execution of Hashcat.

  - **Analyze command line arguments:** Examine the CommandLine field in the process creation logs. Look for the presence of flags like `-a`, `-m 1000`, and `-r`, which should be present if the execution is related to hashing attacks. Compare against expected legitimate use cases.

  - **Validate log sources:** Ensure that Windows process creation logging is enabled and that necessary configurations for Security Event IDs 4688 are in place. This is vital for accurate detection and should include Event Log accessibility.

  - **Identify known legitimate operations:** Assess whether Hashcat is part of authorized security testing or training activities within the organization. Check for accompanying documentation that allows such use, as approved activities may appear in logs.

  - **Look for additional high-confidence indicators:** Correlate with other related logs such as suspicious PowerShell commands (Event ID 4688 or Sysmon Event ID 1) indicating unusual behavior preceding or following Hashcat execution.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and user data. The likelihood of malicious abuse is significant, as password cracking tools like Hashcat are commonly weaponized by attackers for credential theft. Additionally, this behavior is often a preliminary step before accessing or compromising additional assets.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of attackers using legitimate-looking command-line arguments or disguising their operations. To ensure reliable detection, it is crucial to have detailed logging enabled for process creation events and command-line arguments. Legitimate activities that may trigger this alert include security testing or ethical hacking training that uses Hashcat in a controlled environment. A related detection that enhances coverage includes monitoring for the use of other well-known password-cracking tools or atypical command-line activity associated with privileged accounts.

