  ### Technical Context

  This Sigma rule detects the execution of the Hashcat password-cracking tool on Windows systems, particularly focusing on its invocation with specific command line arguments that denote activities related to password cracking. The likely objective of an attacker utilizing Hashcat would be to compromise user accounts by attempting to derive passwords from hashed credentials found on the system. This behavior aligns with the MITRE ATT&CK framework under the tactic of Credential Access, specifically technique T1110.002 - Password Cracking.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide details about the execution of processes, including the command line used. If successful, this detection indicates a significant security impact as it may lead to unauthorized access to user accounts and further compromise of sensitive information. However, it is crucial to note that this detection does NOT confirm that the activity is malicious without additional context, as legitimate applications may also utilize Hashcat or similar commands.

  ---

  ### Investigation Steps

  - **Verify process execution details**: Check Windows Security Event ID 4688 for the creation of the Hashcat.exe process. Note the user context and parent process; execution by a known administrative account may indicate potential misuse.

  - **Analyze command line parameters**: Inspect the CommandLine field in Sysmon Event ID 1; look for parameters like '-a', '-m 1000', and '-r'. A command line containing these arguments is indicative of malicious intent, especially if executed outside of legitimate administrative tasks.

  - **Identify legitimate use cases**: Review the asset role and recent activities on the impacted host. If the host is an administration or security team workstation, verify whether there have been legitimate reasons for using Hashcat (e.g., security assessments).

  - **Correlate with recent credential exposures**: Cross-reference any recent incidents of credential leaks that could have prompted an attacker to run Hashcat against the target system, focusing on any known attack patterns in the environment.

  - **Look for additional artifacts**: Check for the creation or modification of files related to the hashes or password lists, especially in locations where unauthorized activity would not typically occur (e.g., user temp directories).

  ---

  ### Prioritization

  This alert carries a high severity due to its potential impact on credential compromise and unauthorized access to sensitive systems. The likelihood of adversaries employing password cracking techniques like those enabled by Hashcat is high, particularly in environments where user account credentials are already at risk.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging levels for process creation events are not adequately configured, or if similar command-line arguments are used for other legitimate applications, potentially leading to false positives. Legitimate security assessment tools that use Hashcat may also trigger this alert, necessitating a case-by-case review. A related detection to improve coverage would involve monitoring for the use of other credential dumping tools or successful authentication following the execution of cracking tools, as these may indicate a compromised credential scenario.

