note: |
  ### Technical Context

  This Sigma rule detects the execution of Hashcat, a popular password-cracking tool, specifically identifying instances where it is invoked with specified command-line arguments indicating an attack on password hashes derived from Windows SAM files. The likely attacker objective is to crack passwords of user accounts to gain unauthorized access to systems or sensitive data. This behavior maps to the MITRE ATT&CK framework under the “Credential Access” tactic (TA-0006) and the technique “Brute Force: Password Cracking” (T1110.002).

  The primary telemetry sources for this detection are Windows Process Creation logs, specifically focusing on Event ID 4688, which records new process creations, and associated command-line arguments. If malicious, this activity could lead to unauthorized system access, data breaches, or lateral movement within the network. However, this detection does NOT confirm that the passwords were successfully cracked or that any subsequent malicious actions were taken based solely on this execution.

  ### Investigation Steps

  - **Check the Command Line Arguments:** Review the command line for the process using Event ID 4688. Look for the presence of '-m 1000' (indicating NTLM hash) and '-a', which are indicative of Hashcat's execution aimed at password cracking.

  - **Validate the Process Path:** Confirm the process path for Hashcat using Sysmon Event ID 1. Ensure that it ends with `\hashcat.exe`. This rule can trigger on other tools with similar arguments, so uniqueness in the path is essential for a malicious indicator.

  - **Identify the User Context:** Analyze the user account that executed Hashcat. Legitimate administrative actions within a secure environment might log similar processes; look for the execution by known administrative users during expected operational hours versus anomalous user accounts or unusual hours.

  - **Examine Associated File Activity:** Investigate file creation and access around the time of execution by reviewing Windows Security logs (Event ID 4663) for any read operations on SAM files or any suspicious file creation in directories where Hashcat files may reside, such as temporary folders.

  - **Assess Event Relationships:** Correlate this process creation event with any preceding authentication failures or abnormal login attempts within the environment, using Event ID 4625, which could highlight a larger brute force attack scenario.

  - **Monitor Historical Uses of Hashcat:** Review historical activity logs for earlier executions of Hashcat or other penetration testing frameworks. Consistent usage might indicate legitimate testing activities rather than malicious intent.

  ### Prioritization

  The alert severity is high, as the execution of a password-cracking tool like Hashcat can lead to significant security risks, including potential unauthorized access if successful. The likelihood of malicious use is elevated, given that Hashcat is commonly utilized for nefarious purposes by attackers seeking to gain credentials and infiltrate networks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications or administrative tools that use similar command-line arguments to Hashcat, leading to false positives. Proper log source configurations must be ensured to capture all relevant process creation events. Additionally, expected behavior may occur during security assessments, where penetration testers execute tools like Hashcat legitimately. Integrating companion detection methods for failed login attempts (Event ID 4625) can enhance coverage against credential abuse scenarios linked to this alert.

