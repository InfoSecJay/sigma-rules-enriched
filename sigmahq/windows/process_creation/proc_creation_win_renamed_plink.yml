detection:
  selection:
  - OriginalFileName: 'Plink'
  - CommandLine|contains|all:
    - ' -l forward'
    - ' -P '
    - ' -R '
  filter:
    Image|endswith: '\plink.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of a renamed variant of the Plink binary, commonly used for SSH tunneling and remote command execution. Attackers may rename Plink to evade detection while establishing forward or reverse shell connections, facilitating persistent access or data exfiltration. The primary MITRE ATT&CK tactics relevant here are *Defense Evasion* (TA0005) and the technique *Masquerading* (T1036).

  The primary telemetry sources for this detection are Windows process creation logs, notably Event ID 4688. If malicious, this behavior can lead to unauthorized access and data compromise within the enterprise network. However, this detection alone does NOT confirm malicious intent, as legitimate uses of Plink in system administration contexts can exist.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for instances where `OriginalFileName` is 'Plink' and the `CommandLine` contains flags such as ' -l forward', ' -P', or ' -R'. Look for multiple instances indicating attempted command execution.

  - **Assess the command line arguments:** Identify whether the arguments present in the `CommandLine` include behaviors typical of tunneling, such as listening on unusual ports or establishing outgoing connections to unfamiliar IP addresses.

  - **Correlate with network logs:** Check firewall and proxy logs for unusual outbound connections initiated by the process. Look for connections originating from the host running Plink to external IPs, especially on non-standard ports.

  - **Identify legitimate usage patterns:** Review historical data for known system administration tasks that utilize Plink within your environment. Confirm which users and hosts regularly run it to establish a benchmark for normal activity.

  - **Cross-reference with user behavior:** Investigate the user account executing the process. Determine if the user has a legitimate business need for these operations. Examine for any anomalies in user behavior that may indicate compromise.

  - **Examine for file artifacts or persistence mechanisms:** Check for any newly created files that may be associated with the renamed Plink activity, such as script files or unusual executables in temporary directories, which might indicate further malicious intent or persistence strategies.

  ### Prioritization

  This alert should be considered high severity due to the significant impact that successful use of Plink can have on an enterprise system. The likelihood of malicious abuse is elevated, given that Plink is often exploited by adversaries to maintain access. Executions of Plink with suspicious arguments and lacking legitimate context are typically weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of file-system evasion techniques that obscure executable names. Required log sources include comprehensive process creation logs and, preferably, EDR data for complete visibility. Legitimate activities, such as network administration tasks, may trigger this alert, so understanding context is crucial. A related detection to bolster coverage could include monitoring for unusual parent-child process relationships involving high-risk process executions.

