logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName: 'Plink'
  - CommandLine|contains|all:
    - ' -l forward'
    - ' -P '
    - ' -R '
  filter:
    Image|endswith: '\plink.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the execution of a renamed Plink binary, a tool often associated with establishing remote connections using SSH. The attacker may aim to maintain stealthy access to a compromised system or facilitate lateral movement within the network. The relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Using a Credential Dumping Tool" (T1036).

  The primary telemetry sources are Windows process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, which capture process execution details including command line arguments. If this behavior is malicious, it could indicate an ongoing compromise aiming to exfiltrate sensitive data or establish persistent access. However, the detection alone does not confirm malicious intent, as legitimate uses of Plink can occur in administrative tasks.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Security Event ID 4688 or Sysmon Event ID 1 for instance creation events where the Image name ends with `\plink.exe`, focusing on the OriginalFileName field indicating 'Plink' and command line flags which include `-l forward`, `-P`, or `-R`.

  - **Identify command line arguments:** Evaluate the command line for the presence of specific flags; legitimate administrative use of Plink typically includes secure remote connections without suspicious flags. Queries involving IP tunneling or reverse shells increase suspicion.

  - **Check for unusual parent processes:** Look for parent process IDs in Event ID 4688 logs that indicate suspicious launching processes (e.g., cmd.exe or PowerShell) initiating plink.exe. Malicious execution often stems from unexpected parent processes.

  - **Correlate with network activity:** Use network monitoring tools to check for outgoing connections on non-standard ports or unauthorized hosts. Expected behavior includes connections to known administrative servers.

  - **Validate against asset criticality:** Confirm that the process execution is on critical assets where Plink is not typically used, increasing the likelihood of malicious intent.

  - **Collect associated file artifacts:** Determine if there are related files or scripts created at the time of execution. Check for unusual file creations or modifications in the user’s AppData or Temp directories that could indicate further malicious exploits.

  ### Prioritization

  This alert is deemed high severity due to its association with potential unauthorized access and command and control activities. Given the nature of the Plink binary's functionalities, any unusual execution invites immediate attention, particularly on sensitive or critical systems where such tools are rarely employed for legitimate purposes.

  ### Blind Spots and Assumptions

  Detection relies heavily on accurate process creation logs, which may not capture all execution events if logging is improperly configured. Adversaries may use techniques to obfuscate malicious operations by renaming executables or using legitimate command line options. Common legitimate triggers for this alert include administrative use in remote support scenarios. Additionally, companion detections focusing on unusual outbound network traffic can complement this rule to strengthen monitoring capabilities.

