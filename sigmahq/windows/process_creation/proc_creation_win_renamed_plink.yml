logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName: 'Plink'
  - CommandLine|contains|all:
    - ' -l forward'
    - ' -P '
    - ' -R '
  filter:
    Image|endswith: '\plink.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of a renamed version of the Plink binary, which is often used in remote access scenarios. Plink, a component of the PuTTY suite, enables SSH connections and may be leveraged by attackers to establish covert command-and-control communications or data exfiltration. The threat scenario typically involves an attacker replacing or renaming Plink to avoid detection mechanisms while maintaining its functionality to create tunnels or forward ports.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Defense Evasion** (TA0005), specifically technique **T1036 - Masquerading**, as the renamed binary can be mistaken for a legitimate process. Attackers may aim to deliver payloads, exfiltrate data, or maintain persistence using modified versions of commonly accepted tools, thus enhancing the stealthiness of their operations. The primary data source for this detection is Windows process creation logs, which provide insights into command-line execution and the specific binaries being utilized.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs to identify instances of renamed Plink executions. Pay attention to the CommandLine arguments indicating potential tunneling or port forwarding capabilities.
  - **Correlate with Network Traffic**: Investigate any unusual outbound network connections that correspond with the timestamps of detected Plink executions. Look for anomalous traffic patterns that may signify remote access or data exfiltration efforts.
  - **Examine User Behavior**: Check for abnormal user behavior or accounts associated with the execution of Plink. Investigate their recent activities for possible indicators of compromise, such as unauthorized access or commands.
  - **Assess Command-Line Usage**: Specifically filter for command-line arguments related to tunneling (`-l forward`, `-P`, `-R`) as they provide context to the nature of the connection being established, aiding in understanding the attacker's intentions.

  ### Prioritization
  This alert is of high priority due to the potential impact it poses within an enterprise environment. The use of renamed legitimate binaries can indicate malicious intent, especially when associated with unauthorized remote access or data exfiltration activities.

  ### Blind Spots and Assumptions
  The primary blind spot in this detection logic is the reliance on the presence of logs for renamed binary executions, which may not always be generated if logging configurations are not properly set up. The detection assumes that the command-line arguments will be consistently used in a manner resembling typical Plink usage, which may vary in legitimate scenarios. To ensure the alert functions effectively, it is essential to have detailed accounting of process creation events and adequate configuration of logging mechanisms to capture process command-line arguments.

