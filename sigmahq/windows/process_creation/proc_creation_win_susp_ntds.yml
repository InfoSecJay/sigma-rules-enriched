logsource:
  product: windows
  category: process_creation
detection:
  selection_tool:
        # https://github.com/zcgonvh/NTDSDumpEx
  - Image|endswith:
    - '\NTDSDump.exe'
    - '\NTDSDumpEx.exe'
  - CommandLine|contains|all:
              # ntdsdumpex.exe -d ntds.dit -o hash.txt -s system.hiv
    - 'ntds.dit'
    - 'system.hiv'
  - CommandLine|contains: 'NTDSgrab.ps1'
  selection_oneliner_1:
        # powershell "ntdsutil.exe 'ac i ntds' 'ifm' 'create full c:\temp' q q"
    CommandLine|contains|all:
    - 'ac i ntds'
    - 'create full'
  selection_onliner_2:
        # cmd.exe /c copy z:\windows\ntds\ntds.dit c:\exfil\ntds.dit
    CommandLine|contains|all:
    - '/c copy '
    - '\windows\ntds\ntds.dit'
  selection_onliner_3:
        # ntdsutil "activate instance ntds" "ifm" "create full c:\windows\temp\data\" "quit" "quit"
    CommandLine|contains|all:
    - 'activate instance ntds'
    - 'create full'
  selection_powershell:
    CommandLine|contains|all:
    - 'powershell'
    - 'ntds.dit'
  set1_selection_ntds_dit:
    CommandLine|contains: 'ntds.dit'
  set1_selection_image_folder:
  - ParentImage|contains:
    - '\apache'
    - '\tomcat'
    - '\AppData\'
    - '\Temp\'
    - '\Public\'
    - '\PerfLogs\'
  - Image|contains:
    - '\apache'
    - '\tomcat'
    - '\AppData\'
    - '\Temp\'
    - '\Public\'
    - '\PerfLogs\'
  condition: 1 of selection* or all of set1*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of specific process patterns and command line arguments associated with the exfiltration of the NTDS.DIT file, which contains sensitive information about Active Directory. The likely attacker objective is to extract user credentials and sensitive data for credential access and elevation of privilege. This behavior aligns with the MITRE ATT&CK technique "Credential Dumping: NTDS.DIT" (T1003.003).

  The primary telemetry sources involved are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If successful, an attack could lead to unauthorized account access or lateral movement within the network. However, this detection alone does NOT confirm that an exfiltration occurred, as the activity may be part of legitimate administrative operations.

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 with Image names ending in `NTDSDump.exe` or `NTDSDumpEx.exe`. Look for command lines containing `ntds.dit` or `system.hiv`. Legitimate usage typically shows a different image path and absence of sensitive file references.

  - **Analyze command line arguments:** For any identified suspicious processes, examine the accompanying command line parameters. Specifically, look for full command lines that contain phrases like `'ac i ntds'` and `'create full'`, which may indicate an unauthorized attempt to create an offline backup of NTDS.

  - **Investigate file access patterns:** Validate any copying actions to or from `\windows\ntds\ntds.dit` through Event ID 4663 (File Access). Examine operations like `copy` commands in PowerShell or CMD for signs of malicious intent.

  - **Identify unusual parent processes:** Review for processes spawned from common applications like `apache` or `tomcat`. If these processes are executing commands related to NTDS extraction, this could indicate a malicious activity that deviates from standard operational behavior.

  - **Correlate with known reconnaissance tools:** Cross-reference findings with known tools such as NTDSDumpEx or scripts like `NTDSgrab.ps1`. If present, investigate the context of their execution and determine if their usage aligns with legitimate administrative tasks or indicates a breach.

  - **Collect and analyze file artifacts:** If file artifacts related to `ntds.dit` are created, such as hash files exported to atypical directories, validate if there were any unauthorized file transfers. This includes verifying logs for any exfiltration activities or synchronization actions.

  ### Prioritization

  This alert carries a high severity level as it indicates potential credential dumping targeting sensitive Active Directory data. The impact on enterprise security is significant due to the potential for malicious credential access and lateral movement. The behavior is notably weaponized by threat actors, making prompt investigation essential.

  ### Blind Spots and Assumptions

  Detection may have limitations if logs are misconfigured, particularly for File Object Access events (Event ID 4663), which could mask file manipulations. Legitimate administrative actions such as backup procedures or domain maintenance might trigger this alert. A related detection rule for unauthorized access to sensitive directory files can enhance coverage and detection efficacy.

