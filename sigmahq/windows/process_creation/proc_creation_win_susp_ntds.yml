note: |
  ### Technical Context

  This Sigma rule detects suspicious process patterns associated with the exfiltration of the NTDS.DIT file, which contains Active Directory data, potentially including user credentials. The likely attacker objective is to gain unauthorized access to sensitive account information, facilitating further malicious actions such as privilege escalation or lateral movement within the network. Relevant MITRE ATT&CK tactics include Credential Access (T1003) and specifically Credential Dumping (T1003.003).

  Primary telemetry sources include Windows Security Event ID 4688 (process creation logs) and Sysmon Event ID 1 (detailed process creation events). If malicious, successful exfiltration of NTDS.DIT presents a high security risk, as it could lead to complete compromise of Active Directory. This detection does NOT confirm that NTDS.DIT has been successfully exfiltrated or that credential theft occurred; it only indicates potential attempts to access or copy the file.

  ### Investigation Steps

  - **Investigate Event 4688 for Process Creation**: Review Windows Security Event ID 4688 logs for process creation involving 'NTDSDump.exe', 'NTDSDumpEx.exe', or related PowerShell commands that include 'ntds.dit'. Look for suspicious parent processes like 'powershell.exe' or 'cmd.exe'.

  - **Analyze Command Line Arguments**: Check for specific command line arguments in logs that might indicate credential access attempts, such as those containing 'create full' with paths referencing 'ntds.dit' or 'system.hiv'. A command like `ntdsutil.exe 'ac i ntds' 'ifm' 'create full'` would be suspicious.

  - **Identify the Source of the Process**: Determine the parent process and its location (e.g., Apache or Tomcat directories) for any instances where 'ntds.dit' or related files are referenced. High-risk locations such as '\Temp\' or '\AppData\' could indicate malicious behavior.

  - **Review High-Confidence Indicators**: Look for instances where the command line contains 'copy' with paths referencing 'ntds.dit', especially commands that execute `cmd.exe /c copy`. This is a strong indicator of potential data exfiltration actions.

  - **Validate Against Expected Behavior**: Confirm if processes are related to legitimate administrative activities. For instance, ensure that actions involving 'ntdsutil.exe' are part of authorized maintenance or backup procedures, particularly devoid of unusual command line parameters or unauthorized directories.

  - **Monitor for Related Activities**: Check for other accompanying suspicious actions, such as elevated privileges or attempts to list Active Directory users from unapproved scripts or tools, which may indicate coordinated credential access efforts.

  ### Prioritization

  The alert is high severity due to the critical nature of the NTDS.DIT file and its association with sensitive credential information. The likelihood of conduct leading to account compromise is significant, especially given that tools for NTDS extraction are commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  There are potential evasion techniques, such as attackers using legitimate administrative tools or running malicious scripts from common management directories that may generate noise in detection rules. Reliable detection requires comprehensive logging configurations, including Sysmon and Windows Security logs. Legitimate backup or administrative actions may trigger this alert, especially if performed from unusual contexts or command lines. Companion detections that monitor file access events or network traffic for large data transfers should be utilized to enhance detection coverage.

