note: |
  ### Technical Context

  This rule detects the creation of uncommon child processes under the `conhost.exe` parent process, which may indicate potential misuse of the Windows Console Host as a living-off-the-land binary (LOLBIN) or possible process injection. Attackers may leverage `conhost.exe` to execute malicious commands or spawn unwanted processes while evading conventional security measures. The relevant MITRE ATT&CK technique is "Process Injection" (T1202), which focuses on the injection of code into legitimate processes.

  The primary telemetry source for this detection is the process creation log, specifically Windows events linked to process execution (e.g., Event ID 4688). If malicious, this could lead to unauthorized access, data exfiltration, or lateral movement within the network. This detection does NOT confirm that an attack is occurring solely based on the act of spawning a child process from `conhost.exe`, as benign applications could also exhibit similar behavior.

  ### Investigation Steps

  - **Identify the parent process:** Check for `conhost.exe` as the parent process using Security Event ID 4688 logs. This will include fields such as `ParentProcessId`, `Image`, and `CommandLine`. Malicious indicators may involve unusual child process names or unexpected command line arguments.

  - **Analyze child processes:** Look for uncommon child processes of `conhost.exe` such as `powershell.exe`, `cmd.exe`, or other scripting engines. The absence of normal processes indicates potential malicious activity.

  - **Verify timing and execution context:** Cross-reference the creation time of the child process with other activities on the host, including Event ID 60000 for Process Startup and other relevant logs, to confirm any correlation with known legitimate activities.

  - **Check for legitimate applications:** Establish a baseline for expected child processes spawned from `conhost.exe` in your environment. Common examples would be administrative utilities or scripts executed by system administrators.

  - **Correlate with additional telemetry:** Investigate relevant Sysmon logs, particularly Sysmon Event ID 1, to gain insight into the command line parameters and user context of the processes. High-confidence malicious indicators may include suspicious command line arguments involving file deletions or network calls from the child processes.

  - **Review the user account context:** Determine the user account associated with the process creation. Malicious activities often occur under unexpected user accounts or SYSTEM context, especially if the activity appears to escalate privileges.

  ### Prioritization

  This alert should be considered medium severity due to the misusage of a legitimate Windows process that could facilitate evasive malicious activity. The likelihood of abuse exists, as the tactic of process injection is commonly weaponized by adversaries, particularly in post-exploitation phases.

  ### Blind Spots and Assumptions

  This detection has limitations in identifying false positives stemming from legitimate administrative tasks that may create child processes under `conhost.exe`. Reliable detection requires comprehensive logging configurations to ensure complete visibility into process creation events. Legitimate tools often utilize `conhost.exe`, including various terminal emulators or scripts executed in a standard operational environment. Related detections include monitoring for parent-child process relationships indicative of process injection, which would enhance coverage and detection confidence.

