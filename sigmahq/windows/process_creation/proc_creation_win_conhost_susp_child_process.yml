note: |
  ### Technical Context

  This Sigma rule detects the creation of uncommon child processes from `conhost.exe`, which could indicate use of `conhost.exe` as a Living-Off-The-Land Binary (LOLBIN) or potential process injection attempts. The likely attacker objective is to execute malicious code while hiding execution details within a legitimate Windows process. This behavior maps to the MITRE ATT&CK technique for Process Injection (T1202) under the Execution tactic.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide details about process execution. If malicious, the impact could be significant, leading to further compromise of the system or lateral movement within the network. However, this detection alone does not confirm malicious intent or activity without additional context and corroborating evidence.

  ### Investigation Steps

  - **Check parent-child process relationship:** Review the parent process of the detected child process using Security Event ID 4688 logs (specifically the `NewProcessName` and `ProcessId` fields). Legitimate child processes of `conhost.exe` are usually `cmd.exe` or `powershell.exe`. Consider deviations as potential indicators of compromise.

  - **Validate process creation details:** Inspect Sysmon Event ID 1 logs for the suspicious child process. Focus on fields such as `Image` and `CommandLine` for anomalies. Look for unusual command-line arguments that may indicate non-standard usage, such as obfuscated scripts or unusual flags typically not used in benign scenarios.

  - **Analyze SystemTraceProvider events for anomalies:** Check for entries where `Provider_Name` is `SystemTraceProvider-Process` in event logs or related telemetry. Look for missing fields that could indicate a race condition around process creation, leading to incomplete data. Discrepancies may suggest malicious activity.

  - **Correlate with existing threat intelligence:** Use threat intelligence platforms to investigate the identified child process. Compare the `Image` paths and command lines against known malicious hashes or behaviors associated with `conhost.exe` exploitation.

  - **Identify legitimate usage patterns:** For baseline comparison, review normal operational logs of `conhost.exe` from systems in the same environment. Confirm legitimate processes and their flags, noting how often they invoke child processes and under which circumstances (e.g., user actions, system updates).

  ### Prioritization

  This alert carries a medium severity in an enterprise context. The impact is dependent on the affected system's role, such as if it's a user machine versus a server. While the likelihood of malicious abuse exists, this behavior is not commonly weaponized without additional context, making further investigation essential.

  ### Blind Spots and Assumptions

  Detection limitations may include legitimate scenarios where `conhost.exe` is used for standard operations, potentially generating false positives. Ensure that logging for process creation is enabled and correctly configured on all endpoints for effective detection. Additionally, consider companion detections such as monitoring unusual command-line execution (linked to MITRE ATT&CK T1059) to strengthen coverage against related attack vectors.

