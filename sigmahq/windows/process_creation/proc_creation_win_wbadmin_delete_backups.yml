note: |
  ### Technical Context
  This rule detects the deletion of backups or system state backups using the `wbadmin.exe` command. This type of behavior is commonly associated with various ransomware families that aim to eliminate recovery options for victims, making their data irrecoverable. By removing backups, attackers can exert greater pressure on victims to pay ransoms, as they know there are fewer options for data recovery. The primary objective of employing this technique is to hinder recovery efforts and maximize extortion.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **T1490 - Inhibit System Recovery**: This technique encompasses the deletion or manipulation of backup and recovery mechanisms.

  The primary data sources for this detection are process creation events from Windows systems, particularly logs that capture command execution details (such as `CommandLine` arguments). Additional monitoring of backup configurations and Windows Backup settings may also provide context for potential unauthorized backup manipulation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances where `wbadmin.exe` was executed, especially focusing on the `CommandLine` arguments for keywords like "delete" and "backup".
  - **Check Backup Configuration Settings**: Investigate the Windows Backup configuration to determine if the deletion was authorized by legitimate administrative processes or if it appears anomalous.
  - **Assess Other Related Logs**: Look through associated logs such as Windows Event Logs for any events related to backup deletions or modifications that may not be captured by process creation logs.
  - **Identify User Context**: Determine which user account executed the `wbadmin.exe` command, and assess whether this aligns with typical administrative activity or indicates a potential compromise.

  ### Prioritization
  The severity of this alert is medium because the deletion of backups can significantly impact the organization's ability to recover from an incident. If linked to ransomware activities, the likelihood of more severe consequences is heightened, warranting prompt investigation and response.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the potential for legitimate administrative tasks involving backup deletions that may go undetected due to the use of expected command-line parameters. The detection logic assumes all `wbadmin.exe` commands containing "delete" relate to malicious activity, which may not always be the case. Furthermore, the effectiveness of this rule is contingent on the availability of process creation logs, specifically under configurations that adequately capture command-line arguments and not merely the command invocation.

