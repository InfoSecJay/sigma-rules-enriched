detection:
  selection_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'delete '
    - 'backup'         # Also covers "SYSTEMSTATEBACKUP"
  filter_main_keep_versions:
        # Note: We exclude this to avoid duplicate alerts with 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    CommandLine|contains: 'keepVersions:0'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate backup activity from administration scripts and software.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `wbadmin.exe` for deleting system backups or volume shadow copies, a behavior commonly leveraged by ransomware to thwart recovery efforts. The likely attacker objective is to eliminate backups that could be used for data restoration, thereby increasing the pressure on the victim to pay the ransom. This behavior aligns with MITRE ATT&CK technique T1490: "Inhibit System Recovery."

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1 showing process executions. If malicious, the deletion of backups can significantly impact data availability and recovery post-incident. This detection does NOT confirm that a backup has been successfully deleted, as the command could be part of a legitimate administrative task.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 for entries where the `Image` ends with `wbadmin.exe`. Focus on timestamps close to the alert for context.

  - **Analyze command line arguments:** Examine the `CommandLine` field for any occurrences of 'delete ' and 'backup'. Pay special attention to commands containing `keepVersions:0`, as this indicates an intention to delete all backup versions.

  - **Evaluate system state backup history:** Compare against normal operating procedures; legitimate usage of `wbadmin` typically involves the command 'wbadmin start backup'. Ensure no unexpected `delete` commands were executed by administrative users.

  - **Identify high-confidence malicious indicators:** Look for a pattern where multiple `wbadmin.exe` delete commands occur within a short timeframe, particularly preceding known ransomware activity within the environment or correlating to existing threats.

  - **Check for related alerts:** Correlate findings with related detections, such as the derived alert ID `639c9081-f482-47d3-a0bd-ddee3d4ecd76`, to assess if there are concurrent suspicious system changes or potential ransomware activity.

  ### Prioritization

  The alert is assessed as medium severity due to the potential loss of critical backup data that could severely impact recovery efforts. Given the weaponization of backup deletion by ransomware groups, the likelihood of malicious abuse is significant, especially in environments with engaged threat actors.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of legitimate administrative tools to obfuscate malicious intent, as well as the disabling of backup systems before executing deletions. Reliable detection requires full logging of process creations and adequate monitoring of administrative privileges. Legitimate backup maintenance activities might trigger this alert, necessitating contextual analysis. A related detection to complement coverage could involve monitoring for unusual file deletion activities or heavy file operations on backup storage locations.

