title: Sensitive File Access Via Volume Shadow Copy Backup
id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
status: test
description: |
  Detects a command that accesses the VolumeShadowCopy in order to extract sensitive files such as the Security or SAM registry hives or the AD database (ntds.dit)
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
date: 2021-08-09
modified: 2024-01-18
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
        # copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\NTDS\NTDS.dit C:\temp\ntds.dit 2>&1
        # There is an additional "\" to escape the special "?"
    CommandLine|contains: '\\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy'
  selection_2:
    CommandLine|contains:
    - '\\NTDS.dit'
    - '\\SYSTEM'
    - '\\SECURITY'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_sensitive_file_access_shadowcopy/info.yml
note: |
  ### Technical Context

  This Sigma rule detects unauthorized attempts to access sensitive files (such as NTDS.dit, SYSTEM, and SECURITY) via Windows Volume Shadow Copy, a backup feature that can be exploited by attackers. The primary objective of such activity is often to extract sensitive information, including domain password hashes or registry hives, that can facilitate further compromise. This behavior aligns with the MITRE ATT&CK technique T1490 (Infectious Media Propagation).

  The main telemetry sources for this detection include process creation events on Windows systems, specifically Event ID 4688 which logs process creations and command-line arguments. If successful, this could lead to significant security ramifications, including unauthorized access to account credentials. Importantly, this alert does not confirm malicious intent on its own; legitimate administrative access or backup activities may trigger similar commands.

  ### Investigation Steps

  - **Check process creation events:**
    Review Security Event ID 4688 logs to identify the command lines associated with any process creation. Look for entries similar to `\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy` indicating unauthorized access.

  - **Analyze user account behavior:**
    Validate the user account involved in the activity. Confirm whether it has legitimate administrative privileges and if its behavior aligns with common administrative tasks.

  - **Inspect artifact creation:**
    Check for the presence of files created in unexpected locations, specifically in temp directories (e.g., C:\temp), as a result of accessing shadow copies. Files like `ntds.dit` should raise suspicion.

  - **Correlate with other alerts:**
    Cross-reference any anomalous process creation with failed login attempts or other suspicious account activity (e.g., unusual times or locations) that could indicate a broader compromise.

  - **Review legitimate use cases:**
    Identify recent legitimate maintenance or backup activities. Documentations (like scheduled tasks or IT maintenance logs) should confirm authorized access to shadow copies.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on sensitive data exposure. If malicious, accessing files like NTDS.dit can lead to full domain compromise. The technique is a known method used by various ransomware and credential-theft attackers, which increases the likelihood of weaponization.

  ### Blind Spots and Assumptions

  Detection may be evaded using alternative techniques for accessing sensitive files without triggering traditional logging. Thus, confirm logging configurations for the relevant data sources are enabled. Additionally, legitimate backup processes or security audits may inadvertently trigger these alerts. A related detection to strengthen coverage would involve monitoring for suspicious file access patterns, including anomalies in file read operations on shadow copies.

