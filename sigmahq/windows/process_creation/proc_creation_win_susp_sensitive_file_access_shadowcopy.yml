title: Sensitive File Access Via Volume Shadow Copy Backup
id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
status: test
description: |
  Detects a command that accesses the VolumeShadowCopy in order to extract sensitive files such as the Security or SAM registry hives or the AD database (ntds.dit)
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
date: 2021-08-09
modified: 2024-01-18
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
        # copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\NTDS\NTDS.dit C:\temp\ntds.dit 2>&1
        # There is an additional "\" to escape the special "?"
    CommandLine|contains: '\\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy'
  selection_2:
    CommandLine|contains:
    - '\\NTDS.dit'
    - '\\SYSTEM'
    - '\\SECURITY'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects commands that access Volume Shadow Copies, specifically targeting sensitive files such as the NTDS.dit file (Active Directory database), SYSTEM, and SECURITY registry hives. The likely objective of an attacker is to extract sensitive information, such as password hashes or other security-critical data, enabling further attacks or lateral movement. This behavior aligns with the MITRE ATT&CK technique for data from local system (T1490).

  The primary telemetry source for this detection is Windows process creation logs, specifically related to command line activities that interact with Volume Shadow Copies. The security impact of a successful extraction of these files can be severe, resulting in unauthorized access to sensitive credentials and the potential compromise of the entire Active Directory ecosystem. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks may also access these files under certain controlled circumstances.

  ---

  ### Investigation Steps

  - **Identify the command used**: Review the process creation logs for Event ID 4688 to find instances where the CommandLine contains `\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy`. Look for potential command execution patterns that align with the rule's signature.

  - **Analyze for high-confidence malicious indicators**: Validate instances where the CommandLine contains references to `NTDS.dit`, `SYSTEM`, or `SECURITY`. Confirm that such commands are executed by non-admin users or processes not typically associated with legitimate administrative tasks. Prioritize processes initiated by unusual user accounts.

  - **Check for legitimate access patterns**: Investigate if the command was executed by known administrative accounts or during designated maintenance windows. Note instances where system administrators use these commands for backup or recovery purposes. Regular authorized access should show specific usernames tied to legitimate operational activities.

  - **Correlate with additional telemetry**: Utilize Windows Event ID 4104 and logs from PowerShell to assess for scripts or commands that reference the Volume Shadow Copy. Look for unusual PowerShell executions that may be related to the command line in question.

  - **Assess system role and asset criticality**: Determine the role of the affected system (e.g., Domain Controller vs. standard workstation). Higher criticality systems, especially those managing Active Directory, warrant immediate escalations if this behavior is detected.

  - **Monitor for file creation or exfiltration evidence**: Check if files like `ntds.dit` or equivalent were copied to unexpected locations during the time of the alert. Use file system auditing logs (Security Event ID 4663) to identify any unauthorized file accesses or writes to directories like `C:\temp`.

  ---

  ### Prioritization

  The severity of this alert is high due to the critical nature of the systems involved (e.g., Domain Controllers) and the likelihood of malicious actors using such techniques for credential harvesting. This behavior is a known tactic leveraged in numerous threat incidents, elevating its risk level.

  ---

  ### Blind Spots and Assumptions

  Detection might miss instances of authorized administrative accesses, as legitimate users with high privileges may trigger this alert while performing routine tasks. There must be comprehensive logging enabled for both process creation and file activities related to Volume Shadow Copies for reliable detection. Additionally, activities such as backups or disaster recovery operations may also produce alerts, necessitating context for proper triage. Complementary detections along the lines of suspicious PowerShell activity (T1059.001) could strengthen the overall coverage against this tactic.

