title: Sensitive File Access Via Volume Shadow Copy Backup
id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
status: test
description: |
  Detects a command that accesses the VolumeShadowCopy in order to extract sensitive files such as the Security or SAM registry hives or the AD database (ntds.dit)
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
date: 2021-08-09
modified: 2024-01-18
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
        # copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\NTDS\NTDS.dit C:\temp\ntds.dit 2>&1
        # There is an additional "\" to escape the special "?"
    CommandLine|contains: '\\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy'
  selection_2:
    CommandLine|contains:
    - '\\NTDS.dit'
    - '\\SYSTEM'
    - '\\SECURITY'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to access Volume Shadow Copies (VSS) to extract sensitive files, such as the NTDS.dit (Active Directory database), SYSTEM, and SECURITY registry hives. The likely attacker objective is to obtain credential data or other sensitive information that can be exploited for privilege escalation or lateral movement. This behavior aligns with the MITRE ATT&CK tactic for Credential Access (TA0006) and technique Credential Dumping (T1003).

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events detailed in command lines. If malicious, the security impact could lead to a full domain compromise, given that sensitive Active Directory data was accessed. However, this detection does NOT confirm that a successful exfiltration occurred or that the extracted data was utilized maliciously.

  ### Investigation Steps

  - **Review the command line used**: Look for command lines containing `\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy` or any of the specified sensitive files, especially `NTDS.dit` (Event ID 4688/Sysmon ID 1). Malicious indicators would involve commands accessing VSS, while benign commands would typically not reference these directory structures.

  - **Correlate with user activity logs**: Check the account executing the command against user activity logs within Windows Event ID 4624 (Logon) to determine if it was a legitimate administrative user performing standard maintenance tasks.

  - **Check for abnormal file creation**: Survey temporary directories (like `C:\temp`) for recent file creation using File Creation Logs. Look for unusual timestamps or files following the alert, especially if created by the same user/process associated with the command line execution.

  - **Evaluate host role**: Assess the role of the affected host. If it is a Domain Controller or has elevated privileges, the potential impact from this alert is much higher compared to a standard user workstation.

  - **Document any legitimate shadow copy use**: Identify and record if any scheduled backup or maintenance tasks that may legitimately use shadow copies have occurred around the same timestamp, aiding in differentiating benign from malicious activity.

  - **Cross-reference related logs**: Examine PowerShell execution logs (Event ID 4103) for any usage of cmdlets related to VSS or file manipulation to establish if there was a prior indication of suspicious behavior going to this alert.

  ### Prioritization

  This alert is high-priority due to the potential compromise of critical domain credentials and sensitive information stored in the Active Directory. The likelihood of malicious abuse is significant, given that accessing VSS is a known technique for credential dumping. Such behaviors are commonly weaponized, making this a routine attack vector against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of shadow copies in environments with strict backup policies or due to misconfigurations in auditing settings that fail to log process executions adequately. Legitimate administrative actions, such as backup processes or maintenance scripts, may trigger the alert. A related detection to bolster coverage would be monitoring for large file copies or unusual network activity after shadow copy access to observe potential data exfiltration attempts.

