title: Sensitive File Access Via Volume Shadow Copy Backup
id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
status: test
description: |
  Detects a command that accesses the VolumeShadowCopy in order to extract sensitive files such as the Security or SAM registry hives or the AD database (ntds.dit)
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
date: 2021-08-09
modified: 2024-01-18
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
        # copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\NTDS\NTDS.dit C:\temp\ntds.dit 2>&1
        # There is an additional "\" to escape the special "?"
    CommandLine|contains: '\\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy'
  selection_2:
    CommandLine|contains:
    - '\\NTDS.dit'
    - '\\SYSTEM'
    - '\\SECURITY'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the unauthorized access to Volume Shadow Copy data on Windows systems, specifically targeting sensitive files such as the NTDS.dit, SYSTEM, and SECURITY registry hives. Attackers may utilize Volume Shadow Copies to silently retrieve sensitive data for credential dumping or lateral movement within an environment. The ability to extract this information often signifies an attacker with elevated privileges, generally aligned with post-exploitation activity.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **T1490: Ingress Tool Transfer** - This technique relates to data exfiltration and unauthorized data access through tools or methods that leverage native OS features.
  - **T1003.001: Credential Dumping: LSASS Memory** - Although this rule is primarily about accessing Volume Shadow Copies, it connects to the broader technique of credential dumping which is crucial in post-exploitation scenarios.

  Primary data sources for this incident include:
  - Process creation events that capture command line arguments and execution context.
  - Security logs that may document access attempts to shadow copies.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate recent command-line activities for any instances where paths contain `\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy`. Focus on the concerned timestamps to identify the process owner and the lifecycle of the related tasks.
  - **Analyze Access Logs**: If available, retrieve security or auditing logs for access events related to Volume Shadow Copies, particularly looking for patterns of unauthorized access or unusual user accounts accessing sensitive files.
  - **Correlate with User Activity**: Cross-reference any detected suspicious commands with user actions in your environment. Determine if the command was run by a legitimate user, a compromised account, or a known service process.
  - **Investigate Network Behavior**: Check out outbound connections from the host in question to detect potential data exfiltration. Look for unusual connections to external entities shortly after the command execution.

  ### Prioritization
  The alert is classified as high severity due to the potential impact of credential theft and unauthorized access to sensitive data within an enterprise. The likelihood of this detection leading to a significant breach or further compromise is substantial, thus warranting immediate investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, especially if the organization does not have comprehensive logging enabled for process creation or if Volume Shadow Copy access is ignored in security policies. The detection logic assumes that these commands are executed in a typical user context; however, automated scripts or services might also execute similar commands without malicious intent. Additional logging and configurations may be required to ensure complete visibility around Volume Shadow Copy interactions and to confirm user intent when accessing these sensitive files.

