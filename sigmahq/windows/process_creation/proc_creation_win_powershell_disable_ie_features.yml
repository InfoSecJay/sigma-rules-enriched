note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows registry keys that disable critical Internet Explorer (IE) security features. The behavior indicates an attacker is attempting to disable security mechanisms to facilitate further exploitation or malware deployment within the environment. The relevant MITRE ATT&CK techniques are **Defense Evasion (T1089)** as it pertains to the manipulation of registry settings to weaken security configurations.

  The primary telemetry sources for this detection are process creation logs from Windows, particularly Security Event ID 4688 and Sysmon Event ID 1, which capture command line arguments as processes are created. If successful, this behavior could lead to compromised systems, as disabled IE security features make the environment more susceptible to threats. Importantly, this detection does not confirm malicious intent on its own; legitimate administrative activities could also generate similar command line patterns.

  ### Investigation Steps

  - **Review process creation events: ** Examine Security Event ID 4688 and Sysmon Event ID 1 for command lines containing `-name IEHarden -value 0`, `-name DEPOff -value 1`, or `-name DisableFirstRunCustomize -value 2`. Document the process initiator and context.

  - **Correlate with user activity: ** Look up the user account that executed the command to determine if their activity aligns with known administrative functions or if it appears anomalous for their role.

  - **Confirm legitimate processes: ** Identify expected registry modifications for Internet Explorer in regular operations. Legitimate processes may include updates or configuration changes initiated by IT staff during maintenance.

  - **Identify contentious parent processes: ** Check the parent process IDs in event logs to ascertain if the commands originated from known management tools (e.g., Group Policy updates) or potentially suspicious executables.

  - **Look for related modifications: ** Identify any concurrent or prior changes to the registry keys associated with IE security settings in the "HKLM\Software\Microsoft\Internet Explorer" path, focusing on timestamps and user accounts involved.

  - **Gather context about affected asset: ** Assess the criticality of the affected host. Especially in environments where users rely on IE for business functions, such modifications may pose a higher risk if deemed unauthorized.

  ### Prioritization

  This alert holds high severity due to its potential to expose critical systems to threats by directly compromising security configurations. The likelihood of malicious abuse is significant since disabling security features is a common tactic among threat actors to facilitate further malicious actions.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for privileged users to conduct legitimate activities that result in similar command structures. Potential evasion techniques include utilizing tools like scripts that may not trigger process creation logs if executed in specific contexts. Reliable detection requires ensuring that both Security Event and Sysmon logs are captured without filtering. Companion detections, such as monitoring changes to other sensitive registry keys or alerting on unexpected processes calling registry modification commands, can enhance overall visibility into this threat landscape.

