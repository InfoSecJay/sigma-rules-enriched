title: Disabled IE Security Features
id: fb50eb7a-5ab1-43ae-bcc9-091818cb8424
status: test
description: Detects command lines that indicate unwanted modifications to registry
  keys that disable important Internet Explorer security features
references:
- https://unit42.paloaltonetworks.com/operation-ke3chang-resurfaces-with-new-tidepool-malware/
author: Florian Roth (Nextron Systems)
date: 2020-06-19
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains|all:
    - ' -name IEHarden '
    - ' -value 0 '
  selection2:
    CommandLine|contains|all:
    - ' -name DEPOff '
    - ' -value 1 '
  selection3:
    CommandLine|contains|all:
    - ' -name DisableFirstRunCustomize '
    - ' -value 2 '
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule is designed to detect attempts to disable important security features in Internet Explorer (IE) through unauthorized modifications to registry keys. Such modifications may indicate malicious intent, typically associated with actors attempting to evade detection, execute further exploits, or gain a foothold in the environment. Specifically, the rule focuses on command line inputs that alter settings like IE's hardening features, effectively lowering the browser's security posture.

  The threat scenario revolves around adversaries performing actions to circumvent builtin security measures in web browsers, which can lead to greater exploitability of the system and exposure to web-based threats. This behavior aligns with known techniques used by threat actors, including those associated with the Defense Evasion tactic in the MITRE ATT&CK framework, specifically the technique T1562.001, which focuses on "Impair Defenses" through manipulation of security settings.

  Primary data sources for this detection include process creation logs from Windows systems, which capture command-line arguments being executed and thus provide evidence of potentially unauthorized changes being made to the registry.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine event logs related to process creation on the systems in question to identify any instances where the command lines match the specified patterns for disabling IE security features.

  - **Analyze Registry Changes**: Investigate the specific registry locations associated with the IE security settings to check if unauthorized modifications have been made. This includes verifying the values of IEHarden, DEPOff, and DisableFirstRunCustomize.

  - **Correlate with User Activity**: Cross-reference the findings with user activity logs to detect any abnormal or unauthorized user behavior that may indicate malicious intent or exploitation attempts.

  - **Inspect for Related Artifacts**: Look for other indicators of compromise that may correlate with registry alterations, such as evidence of malware execution, abnormal network traffic patterns, or suspicious file changes on affected systems.

  ### Prioritization
  This alert is considered high severity due to its implications for potential exploitation or compromise of the environment. Disabling security features can significantly increase the risk of successful attacks involving web browsers, making it crucial to promptly address any instances of this behavior.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly in environments where process creation logs may not be thoroughly monitored or where logging is inadequately configured. The detection logic assumes command-line parameters are being logged accurately and comprehensively; if these logs are not retained or are improperly parsed, alerts may be missed. Additionally, this rule does not account for legitimate administrative changes to the registry that may also use similar command-line patterns, which could lead to false positives if such contexts are not clearly understood or documented.

