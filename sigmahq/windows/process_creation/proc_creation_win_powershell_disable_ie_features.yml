detection:
  selection1:
    CommandLine|contains|all:
    - ' -name IEHarden '
    - ' -value 0 '
  selection2:
    CommandLine|contains|all:
    - ' -name DEPOff '
    - ' -value 1 '
  selection3:
    CommandLine|contains|all:
    - ' -name DisableFirstRunCustomize '
    - ' -value 2 '
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects command line arguments indicating modifications to Windows registry keys associated with Internet Explorer (IE) security features being disabled. The likely attacker objective is to lower browser protections, facilitating exploitation methods such as phishing or aggressive malware delivery. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion and specifically the technique T1562.001 (Disable or Modify Security Tools).

  The primary telemetry source is process creation logs from Windows, specifically focusing on command line parameters used when creating processes. If these modifications are malicious, they may weaken the security posture of the affected system, making it more vulnerable to attacks. However, this detection does NOT confirm malicious intent on its own; further context is required to verify the legitimacy of the command execution.

  ### Investigation Steps

  - **Check process creation logs**: Review related Windows Security Event ID 4688 for processes executing the command containing registry modifications. Look for parent process relationships to identify whether the command was executed from a legitimate application.

  - **Correlate user activity**: Examine user activity and login patterns around the time of the alert. Ensure the logged user typically executes such commands or that they are responsible for maintaining system settings.

  - **Identify registry changes**: Utilize tools such as `Regedit` or `Sysinternals' Process Monitor` to query the specific registry paths (e.g., `HKEY_CURRENT_USER\Software\Microsoft\Internet Explorer\Main`) for entries related to `IEHarden`, `DEPOff`, and `DisableFirstRunCustomize`. Check for unusual recent changes.

  - **Differentiate between legitimate and suspicious changes**: Understand that legitimate IT operations may include adjustments to browser settings. If the command line includes context-specific parameters or is associated with known administrative actions by trusted IT personnel, this may indicate benign activity.

  - **Look for high-confidence indicators**: If the command line shows additional malicious parameters (such as known malware signatures or scripts), this increases the likelihood of a malicious purpose. Capture additional context around any unusual processes spawning from this command.

  - **Monitor network activity**: Review network traffic logs for unusual outbound connections from the affected host, particularly to known malicious IPs or domains following the detected command execution.

  ### Prioritization

  This alert has high severity due to its potential impact on the affected system's security posture, especially if intentional disabling of security measures aligns with advanced persistent threat (APT) tactics. Given the manipulation of security settings for Internet Explorer, there is a significant likelihood of malicious abuse leading to further infiltration methods. This behavior is actively exploited in the wild and can signify reconnaissance or exploitation attempts.

  ### Blind Spots and Assumptions

  There may be evasion techniques used by legitimate applications or administrative scripts that mimic these command lines, leading to false positives. Adequate log source configurations, such as enabling detailed command line logging, are crucial for reliable detection. Activities like software updates by legitimate applications could inadvertently trigger this alert. A companion detection to enhance coverage could be monitoring connections from any maliciously modified registry entries to external destinations or executing applications that have been flagged for abnormal behavior.

