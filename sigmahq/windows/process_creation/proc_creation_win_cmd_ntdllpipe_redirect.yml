title: NtdllPipe Like Activity Execution
id: bbc865e4-7fcd-45a6-8ff1-95ced28ec5b2
status: test
description: Detects command that type the content of ntdll.dll to a different 
  file or a pipe in order to evade AV / EDR detection. As seen being used in the
  POC NtdllPipe
references:
- https://web.archive.org/web/20220306121156/https://www.x86matthew.com/view_post?id=ntdll_pipe
author: Florian Roth (Nextron Systems)
date: 2022-03-05
modified: 2023-03-07
tags:
- attack.defense-impairment
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'type %windir%\system32\ntdll.dll'
    - 'type %systemroot%\system32\ntdll.dll'
    - 'type c:\windows\system32\ntdll.dll'
    - '\\ntdll.dll > \\\\.\\pipe\\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious activity where an attacker uses command-line instructions to write the content of `ntdll.dll` to a file or a pipe. This technique can be employed to evade traditional antivirus (AV) and endpoint detection and response (EDR) solutions by obfuscating the command's intent while executing payloads. The likely objective is to manipulate or exfiltrate sensitive system libraries for further exploitation.

  This behavior maps to the MITRE ATT&CK tactic of "Defense Evasion" (T1560) with the technique of "Obfuscated Files or Information" (T1027). The primary telemetry sources required for this detection are Windows security logs, specifically process creation events (Event ID 4688) and Sysmon logs (Event ID 1). If these actions are malicious, they may allow attackers to gain deeper control over compromised systems or extract valuable data. Importantly, this detection does not confirm the actual execution of a payload or the success of the attack, as other benign processes could trigger similar command sequences.

  ### Investigation Steps

  - **Check command execution context:** Review Event ID 4688 for the execution of the relevant command lines. Look for parent process IDs linking back to user context (e.g., command prompt or PowerShell) that can indicate scripted or interactive sessions versus malicious automated tools.

  - **Identify pipe activity in logs:** Analyze logs for Event ID 4616 (Audit Object Access) to identify if there are any associated Named Pipes (e.g., `\\.\pipe\`), confirming that the detected command was indeed targeting `ntdll.dll` for output beyond normal behavior.

  - **Assess surrounding process activity:** Investigate the process tree for the parent and child processes related to the alert. Verify if activities prior to the command execution (e.g., a process creating an administrative shell or accessing critical files) are consistent with legitimate software.

  - **Review history of `ntdll.dll`:** Confirm appropriate permissions and access patterns for `ntdll.dll`. Check for suspicious file modifications or execution attempts that do not match expected software behavior.

  - **Establish baseline behavior:** Document and understand normal command line usages involving `ntdll.dll` in your environment, as legitimate applications may erroneously invoke this process – for instance, during updates or software installations.

  ### Prioritization

  This alert should be treated with high severity due to the impact of potential unauthorized access to system libraries and the likelihood that such techniques are used in malicious attacks. The behavior is not widely prevalent and is considered a red flag, as it involves obscure methods to evade detection, making it a common tactic among sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques used by attackers, such as altered command syntax or different file paths. Ensure that comprehensive audit logging is enabled to capture all related process creation events. Legitimate administrative scripts or software installations could trigger similar alerts. A related detection would be monitoring for unusual access to executable files associated with high-risk processes, enhancing visibility into potential exploitation attempts.

