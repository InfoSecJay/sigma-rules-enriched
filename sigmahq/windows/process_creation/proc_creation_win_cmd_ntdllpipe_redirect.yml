note: |
  ### Technical Context

  This Sigma rule detects the execution of commands that involve typing the contents of `ntdll.dll` to a different file or a pipe. This behavior is commonly leveraged by adversaries to bypass detection mechanisms in antivirus (AV) or endpoint detection and response (EDR) solutions by obscuring their actions. The primary objective is to disguise malicious code execution and maintain persistence while evading security controls.

  The relevant MITRE ATT&CK tactic is **Defense Evasion (T1203)**, particularly using the sub-technique that relates to the use of legitimate applications to execute malicious payloads. The primary telemetry source is process creation logs from Windows, such as Security Event ID 4688 or Sysmon Event ID 1, which contain the command line input. If executed maliciously, this could allow an attacker to hide their activities, leading to undetected breaches or malware deployment. Importantly, this detection does NOT confirm that an actual deployment of malicious code occurs—it only highlights suspicious activity.

  ### Investigation Steps

  - **Review the command line input:** Check Security Event ID 4688 (process creation) for command lines containing: `type %windir%\system32\ntdll.dll`, `\\ntdll.dll > \\\\.\\pipe\\`. Flag these logs for further analysis as they indicate potentially malicious activity.

  - **Validate the process context:** Identify the parent process of the suspicious command. Normal system processes (e.g., `cmd.exe`, `powershell.exe`) may indicate benign usage, while unexpected parent processes (e.g., malicious or uncommon executables) could suggest malicious intent.

  - **Check for malicious indicators:** Look for Sysmon Event ID 1, correlating multiple instances of the command execution within a short time frame. A typical frequency of legitimate use is low, so multiple occurrences may indicate an automated process or attack.

  - **Identify expected legitimate usage:** Confirm whether legitimate administrative scripts or utilities utilize the `ntdll.dll` in the organization. Document the expected command patterns for reconciliation against alerts to filter out false positives.

  - **Correlate with additional IOCs:** Use endpoint detection tools to cross-reference with known indicators of compromise (IOCs) linked to `ntdll.dll` misuse, such as hashes or known malicious file paths utilized in prior incidents.

  ### Prioritization

  The alert is considered high severity due to its impact on systems running critical processes or services, such as domain controllers or file servers. The likelihood of malicious abuse is significant, given that this technique has been weaponized by threat actors in past campaigns. The ability to execute commands that engage core libraries points to a high probability of an advanced and stealthy attack.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into custom command executions or obfuscation techniques that adversaries may employ. Necessary logs should include comprehensive process creation telemetry across all relevant endpoints. Legitimate activities, such as maintenance scripts or troubleshooting commands performed by administrators, may trigger these alerts. A companion detection mechanism could include monitoring for attempts to access or modify `ntdll.dll` directly or use of techniques linked to Windows API calls, enhancing overall visibility regarding potential defense evasion strategies.

