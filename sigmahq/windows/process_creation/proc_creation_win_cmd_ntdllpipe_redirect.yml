title: NtdllPipe Like Activity Execution
id: bbc865e4-7fcd-45a6-8ff1-95ced28ec5b2
status: test
description: Detects command that type the content of ntdll.dll to a different file
  or a pipe in order to evade AV / EDR detection. As seen being used in the POC NtdllPipe
references:
- https://web.archive.org/web/20220306121156/https://www.x86matthew.com/view_post?id=ntdll_pipe
author: Florian Roth (Nextron Systems)
date: 2022-03-05
modified: 2023-03-07
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'type %windir%\system32\ntdll.dll'
    - 'type %systemroot%\system32\ntdll.dll'
    - 'type c:\windows\system32\ntdll.dll'
    - '\\ntdll.dll > \\\\.\\pipe\\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects activity where an attacker may execute commands to read the contents of the `ntdll.dll` file and redirect this output to a file or named pipe. This technique is often leveraged to evade detection by traditional anti-virus (AV) or endpoint detection and response (EDR) solutions, as it may be designed to mimic legitimate commands while extracting sensitive information or enabling further illicit actions.

  The likely scenario involves an attacker attempting to manipulate or extract data from system files to understand the operating environment better or to aid in later attacks. This could include privilege escalation or gathering necessary configurations to execute further malicious commands without triggering security alarms.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (T1083 - File and Directory Discovery) due to the use of legitimate toolsets and commands to bypass security. Another relevant technique is **Process Injection** (T1055), as the behavior may facilitate the injection of malicious payloads based on the retrieved data. The primary data source for this detection will be **process creation logs**, which capture command-line arguments that can indicate malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze logs for commands involving `type %windir%\system32\ntdll.dll`, `type %systemroot%\system32\ntdll.dll`, or similar variations, particularly focusing on anomalies in command usage.

  - **Analyze Named Pipe Activity**: Investigate any creation or access to named pipes associated with processes running the aforementioned command, as this may indicate communication with malicious payloads or data exfiltration attempts.

  - **Check for Unusual Parent-Child Relationships**: Look for unexpected parent-child relationships in the process tree where the `ntdll.dll` execution occurs, which could reveal malicious parent processes being used to spawn these commands.

  - **Correlate with Other Security Events**: Cross-reference findings with alerts from EDR, AV, or other security controls to identify any associated suspicious activity that could correlate with this command execution.

  ### Prioritization
  This alert is rated high severity due to the significant risk associated with potential abuse of system file access. The capability to read critical system files and pipe their contents into another context poses an immediate threat to the integrity and security of an organization's environment.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise from legitimate uses of the `type` command leading to false positives. Additionally, this detection assumes that process creation logs are enabled and appropriately configured to capture relevant command-line arguments. If processes are obfuscated or other evasion techniques are employed, detection may be compromised. Furthermore, the visibility of named pipe activity may vary based on specific configurations, potentially affecting the ability to fully trace and respond to these activities.

