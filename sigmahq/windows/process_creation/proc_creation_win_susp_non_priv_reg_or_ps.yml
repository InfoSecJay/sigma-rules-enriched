detection:
  selection_cli:
  - CommandLine|contains|all:
    - 'reg '
    - 'add'
  - CommandLine|contains:
    - 'powershell'
    - 'set-itemproperty'
    - ' sp '
    - 'new-itemproperty'
  selection_data:
    IntegrityLevel:
    - 'Medium'
    - 'S-1-16-8192'
    CommandLine|contains|all:
    - 'ControlSet'
    - 'Services'
    CommandLine|contains:
    - 'ImagePath'
    - 'FailureCommand'
    - 'ServiceDLL'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the usage of `reg` commands or PowerShell by non-privileged users specifically attempting to modify Windows service configurations within the registry. The likely attacker objective is to maintain persistence in a compromised environment by altering service properties in a way that could hinder detection or facilitate re-exploitation. This behavior maps to the MITRE ATT&CK techniques for persistence (T1112) and defense evasion.

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on `Security Event ID 4688` for command line executions and `Sysmon Event ID 1` for detailed process creation visibility. If detected activity is malicious, it could lead to unauthorized service modification, which could degrade system integrity or facilitate further attacks. Importantly, this alert does NOT inherently confirm malicious activity; legitimate scripting by system administrators could generate similar event patterns.

  ### Investigation Steps

  - **Review process creation logs:** Check `Security Event ID 4688` for any command lines containing `reg add` or PowerShell calls like `set-itemproperty` executed by non-privileged users. Look at the `User` field to identify if the user has standard user permissions.

  - **Verify command line parameters:** Confirm the presence of `ControlSet`, `Services`, and any alterations targeting `ImagePath`, `FailureCommand`, or `ServiceDLL`. Legitimate changes to service configuration would usually come from system admins with elevated privileges.

  - **Identify non-privileged user actions:** Specifically focus on command lines executed within the context of users and validate user permissions using the `IntegrityLevel` field from `Sysmon Event ID 1`. Non-privileged operations should not be modifying critical services.

  - **Cross-reference recent changes in the registry:** Utilize `Sysinternals RegJump` or other registry monitoring tools to track changes in the services branch of the registry to see if the detected command lines correlate with unauthorized activity.

  - **Examine creation or modification timestamps:** Investigate timestamps of created registry modifications against user activity logins from `Security Event ID 4624`, looking for any unusual activity periods that align with the command execution times.

  ### Prioritization

  This alert is considered high severity as it indicates potentially unauthorized attempts to alter critical service configurations by non-privileged users. Given the potential for this activity to lead to persistence and further exploitation, combined with the fact that such methods are commonly exploited by adversaries, the response should be swift and thorough.

  ### Blind Spots and Assumptions

  The detection may miss obfuscation techniques or legitimate system scripts that utilize similar command structures for benign purposes. Reliable detection requires the logging and monitoring of both process creation and command-line arguments from all user accounts. Common legitimate tasks, such as service updates or configuration changes by IT staff, could inadvertently trigger this alert. A related detection to consider is unauthorized access to registry hives, which can similarly signal attempts at persistence or exploitation.

