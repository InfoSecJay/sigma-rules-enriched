title: Non-privileged Usage of Reg or Powershell
id: 8f02c935-effe-45b3-8fc9-ef8696a9e41d
status: test
description: Search for usage of reg or Powershell by non-privileged users to modify
  service configuration in registry
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-20-638.jpg
author: Teymur Kheirkhabarov (idea), Ryan Plas (rule), oscd.community
date: 2020-10-05
modified: 2024-12-01
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection_cli:
  - CommandLine|contains|all:
    - 'reg '
    - 'add'
  - CommandLine|contains:
    - 'powershell'
    - 'set-itemproperty'
    - ' sp '
    - 'new-itemproperty'
  selection_data:
    IntegrityLevel:
    - 'Medium'
    - 'S-1-16-8192'
    CommandLine|contains|all:
    - 'ControlSet'
    - 'Services'
    CommandLine|contains:
    - 'ImagePath'
    - 'FailureCommand'
    - 'ServiceDLL'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious actions where non-privileged users utilize Windows Registry commands or PowerShell scripts to modify service configurations. The presence of such actions may indicate an attempt to alter service behaviors, which attackers often exploit as a method of persistence or to bypass security mechanisms. This behavior may suggest adversarial tactics that align with privilege escalation attempts in a Windows environment.

  Attacker objectives may include creating or modifying services to execute malicious payloads or establishing persistence mechanisms that are difficult to identify or remove later. These actions often coincide with techniques aimed at evading detection or maintaining control over compromised systems.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Defense Evasion** (TA0005). Techniques such as **Windows Registry Run Keys / Startup Folder** (T1112) are particularly applicable, as they highlight the method of controlling system startups and services through registry alterations.

  Primary data sources for evidence collection should include **process creation events**, specifically analyzing command lines from PowerShell and registry modification attempts, as well as **Windows Event Logs** that detail command execution and integrity levels.

  ### Investigation Steps
  - **Review Process Creation Events:** Look at recent process creation logs for any command-line activities involving `reg add` or PowerShell commands that include `set-itemproperty`, `sp`, or `new-itemproperty` executed by non-privileged accounts.

  - **Check Integrity Levels:** Identify processes executed under medium integrity levels that are attempting to modify the registry, especially conditions where services are being altered (`ControlSet`, `Services`, `ImagePath`, etc.).

  - **Correlate User Activity:** Assess user behavior surrounding the timestamp of the alert, checking for any user accounts that have no documented need for such registry modifications or PowerShell script execution.

  - **Inspect Related Logs:** If alterations to service configurations are identified, review the Windows Event Logs for any error messages or suspicious behaviors related to the services in question (e.g., unexpected service failures or restarts).

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact on system integrity and security, as unauthorized changes to service configurations can lead to system compromise or persistent access by malicious actors. The likelihood of an organization facing such an attack is notable, especially in environments where non-privileged users might have elevated access.

  ### Blind Spots and Assumptions
  This detection may not capture all relevant activities due to potential gaps in logging or cases where users legitimately need to modify service configurations without sufficient logging. The rule assumes registry modifications by non-privileged users are indicative of malicious intent without fully considering benign administrative activities. It is essential to have enhanced logging enabled for PowerShell and detailed process execution logging to ensure coverage of all relevant scenarios.

