title: Non-privileged Usage of Reg or Powershell
id: 8f02c935-effe-45b3-8fc9-ef8696a9e41d
status: test
description: Search for usage of reg or Powershell by non-privileged users to 
  modify service configuration in registry
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-20-638.jpg
author: Teymur Kheirkhabarov (idea), Ryan Plas (rule), oscd.community
date: 2020-10-05
modified: 2024-12-01
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  selection_cli:
  - CommandLine|contains|all:
    - 'reg '
    - 'add'
  - CommandLine|contains:
    - 'powershell'
    - 'set-itemproperty'
    - ' sp '
    - 'new-itemproperty'
  selection_data:
    IntegrityLevel:
    - 'Medium'
    - 'S-1-16-8192'
    CommandLine|contains|all:
    - 'ControlSet'
    - 'Services'
    CommandLine|contains:
    - 'ImagePath'
    - 'FailureCommand'
    - 'ServiceDLL'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects non-privileged users utilizing PowerShell or the registry (reg) command line interface to modify service configurations in the Windows Registry, particularly targeting service-related keys. The likely objective is to either establish persistence or impair defense mechanisms by changing critical service parameters. This activity is aligned with the MITRE ATT&CK technique T1112 (Modify Registry), which directly relates to the tactics of persistence and defense evasion.

  The primary telemetry sources include Windows process creation logs, specifically focusing on Security Event ID 4688, which will capture command execution details, and Sysmon Event ID 1, which provides in-depth process creation logs. If malicious, this can lead to unauthorized modifications of system services, potentially allowing malware to establish persistence or evade detection. Importantly, this detection does not confirm the intent behind the modification; legitimate administrative tasks by authorized users might also generate similar logs.

  ### Investigation Steps

  - **Review the command line used**: Analyze process creation events (Security Event ID 4688 and Sysmon Event ID 1) for the presence of command line arguments containing 'reg add' or PowerShell commands involving 'set-itemproperty' targeting registry paths associated with 'ControlSet\Services'. Look for specific terms like 'ImagePath', 'FailureCommand', or 'ServiceDLL' that indicate service manipulations.

  - **Check for user privileges**: Validate the integrity level of the user performing these actions by examining the `IntegrityLevel` field in the event logs. Ensure that the user is indeed non-privileged (IntegrityLevel: Medium or S-1-16-8192), as legitimate administrative changes would typically be performed under a higher privilege level.

  - **Identify recent changes to services**: Query the Windows Registry for recent changes to service configurations by checking the `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services` keys and timestamps of modifications. Look for discrepancies between expected service configurations and those modified by the detected command.

  - **Compare against known legitimate activity**: Establish baseline behavior by reviewing recent legitimate registry modifications performed by administrators. Create alerts for deviations from this baseline, focusing on who made the changes and the nature of the commands involved.

  - **Detect high-confidence malicious indicators**: Look for additional indicators such as abnormal process chains originating from unusual locations, or executables with mismatched hashes associated with the commands. Check for indicators of persistence that were not previously documented.

  - **Assess the criticality of affected systems**: Evaluate the criticality of systems where these actions occurred. Non-privileged modifications on high-value assets should raise the alert level due to the potential impact on overall security posture.

  ### Prioritization

  Given the potential for significant impact on service integrity and system availability, this alert should be prioritized as high severity. The likelihood of misuse by adversaries is notable, as techniques to manipulate registry settings for persistence are well-documented. Furthermore, these actions are frequently weaponized in the context of broader attack campaigns.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of more sophisticated or less common tools that do not invoke standard PowerShell or reg commands, and if specific logs are not enabled in the environment. Also, legitimate administrative actions, configuration management changes, or automated scripts may generate similar alerts. For enhanced coverage, companion detections for unauthorized access to administrative shares or abnormal PowerShell activity (e.g., invoking cmdlets like Get-Service or Set-Service) can strengthen monitoring efforts.

