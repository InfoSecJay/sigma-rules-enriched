title: Phishing Pattern ISO in Archive
id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
status: test
description: Detects cases in which an ISO files is opend within an archiver 
  like 7Zip or Winrar, which is a sign of phishing as threat actors put small 
  ISO files in archives as email attachments to bypass certain filters and 
  protective measures (mark of web)
references:
- https://twitter.com/1ZRR4H/status/1534259727059787783
- https://app.any.run/tasks/e1fe6a62-bce8-4323-a49a-63795d9afd5d/
author: Florian Roth (Nextron Systems)
date: 2022-06-07
tags:
- attack.initial-access
- attack.t1566
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\Winrar.exe'
    - '\7zFM.exe'
    - '\peazip.exe'
    Image|endswith:
    - '\isoburn.exe'
    - '\PowerISO.exe'
    - '\ImgBurn.exe'
  condition: selection
falsepositives:
- Legitimate cases in which archives contain ISO or IMG files and the user opens
  the archive and the image via clicking and not extraction
level: high
note: |
  ### Technical Context

  This rule detects the behavior of opening ISO files using archiving tools such as WinRAR or 7-Zip. Attackers often employ small ISO files embedded within archives to bypass email filters and other security measures, representing an initial access tactic. The relevant MITRE ATT&CK tactic is **Initial Access** (T1566: Phishing).

  The primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it may lead to the execution of compromised software or the obfuscation of payloads designed to exploit the target system. However, this detection does NOT confirm that an attack has occurred, as other benign context or user actions may lead to similar process behaviors.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 logs for instances where `WinRAR.exe`, `7zFM.exe`, or `peazip.exe` were the parent processes. Look for child processes spawning `isoburn.exe`, `PowerISO.exe`, or `ImgBurn.exe`. Document the timestamps and user accounts associated with these actions.

  - **Identify legitimate extraction behavior:** In many cases, legitimate users may open archives containing ISO files. Confirm this by reviewing user activity or verifying if expected users commonly work with such file types, especially within the context of software development or IT operations.

  - **Correlate network activity:** Investigate any related network traffic, especially if the associated files were downloaded recently. Look for indications of connections to known malicious domains (using DNS logs or proxy logs) that match the time frame of the alert.

  - **Analyze file metadata:** Review file properties for the ISO files, including creation date, size, and digital signatures. Legitimate ISO files typically have valid signatures from known publishers, while malicious ones may have no signature or questionable origins.

  - **Review contextual logs from EDR tools:** If available, cross-reference EDR telemetry for malicious behavior patterns associated with the identified processes. Check for anomalies in process execution or abnormal file creation.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on the organization. The successful execution of an ISO exploitation could lead to significant data breaches or system compromise. The use of ISO files in phishing attacks is a known tactic, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers utilizing other file types or leveraging different archiving software not covered by the rule. Reliable detection relies on having complete logging configurations for process creation events. Legitimate activities include users encountering ISO files in archives for non-malicious purposes. A related detection could involve monitoring for unauthorized use of imaging software or execution of file archives from email attachments to enhance coverage.

