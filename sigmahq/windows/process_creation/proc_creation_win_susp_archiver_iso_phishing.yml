title: Phishing Pattern ISO in Archive
id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
status: test
description: Detects cases in which an ISO files is opend within an archiver like
  7Zip or Winrar, which is a sign of phishing as threat actors put small ISO files
  in archives as email attachments to bypass certain filters and protective measures
  (mark of web)
references:
- https://twitter.com/1ZRR4H/status/1534259727059787783
- https://app.any.run/tasks/e1fe6a62-bce8-4323-a49a-63795d9afd5d/
author: Florian Roth (Nextron Systems)
date: 2022-06-07
tags:
- attack.initial-access
- attack.t1566
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\Winrar.exe'
    - '\7zFM.exe'
    - '\peazip.exe'
    Image|endswith:
    - '\isoburn.exe'
    - '\PowerISO.exe'
    - '\ImgBurn.exe'
  condition: selection
falsepositives:
- Legitimate cases in which archives contain ISO or IMG files and the user opens the
  archive and the image via clicking and not extraction
level: high
note: |
  ### Technical Context
  This detection rule identifies when ISO files are opened within archive tools such as 7-Zip or WinRAR. This behavior raises a red flag, as attackers often utilize small, seemingly benign ISO files compressed within archives as email attachments to evade standard security filters. The primary objective of such attacks is to deliver malicious payloads while bypassing detection mechanisms set up for conventional file types.

  This activity aligns with the MITRE ATT&CK tactics of *Initial Access* (TA0001), specifically the technique of *Phishing* (T1566). Attackers may leverage phishing to trick users into executing malicious files, ultimately compromising the system and gaining unauthorized access. Important telemetry to monitor includes process creation events, particularly those related to archive tools that spawn ISO-related processes.

  ### Investigation Steps
  - **Collect Process Creation Logs:** Gather logs related to process creation from your EDR/endpoint solution to identify instances where archive applications (like WinRAR or 7-Zip) launched ISO handling tools (such as ImgBurn).
  - **Review Archive File Contents:** Analyze the contents of archives that contained ISO files. Check for patterns or anomalies in file types, sizes, and creation dates that could indicate a phishing attempt.
  - **Investigate Email Sources:** Track down the emails associated with the user who executed the suspicious file. Look for common indicators in email headers or attachments that suggest a phishing attempt, such as unusual senders or unexpected file types.
  - **Assess User Behavior:** Review user activity and the context in which the ISO files were opened. Investigate if the user was targeted through social engineering tactics or received unsolicited attachments.

  ### Prioritization
  The alert's severity is high due to the potential for significant harm from successful phishing attacks, which can lead to data breaches, unauthorized access, or lateral movement within the enterprise environment.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage where legitimate use of ISO files within archives may occur without raising alerts, leading to potential false positives. The detection logic assumes that any usage of ISO files in the context detailed indicates malicious intent, which may not always be the case. Additionally, the alert will only function correctly if process creation logs are enabled and adequately configured to capture the necessary details of the applications involved.

