  ---

  ### Technical Context

  This Sigma rule detects the behavior of exporting a Registry key to a file, typically executed through the Windows `regedit.exe` application or command line. An adversary may use this technique to exfiltrate sensitive configuration or credential information from the Registry, aiming to gather information about the environment or facilitate further attacks. This activity aligns with the MITRE ATT&CK tactic of **Exfiltration** and technique **T1012: Query Registry**.

  The primary telemetry source for this detection relies on Windows process creation logs, specifically looking for `Security Event ID 4688` or Sysmon `Event ID 1` (Process Creation). If the alert is maliciously intent, it could lead to significant security impacts, exposing sensitive information. This detection does NOT confirm malicious intent on its own; it merely indicates that a Registry export command was executed.

  ---

  ### Investigation Steps

  - **Inspect process creation logs**: Review logs for `Security Event ID 4688`(Windows Security) or `Sysmon Event ID 1` to identify `regedit.exe` process start events, focusing on the command line for segments that include `-E`.

  - **Analyze the command line arguments**: Look for command line parameters indicating registry exports. Legitimate exports might include more benign path structures or not involve sensitive hive keys (e.g., user settings).

  - **Identify the exported Registry paths**: Cross-reference the exported Registry key specified in the command line. Check if it is related to sensitive keys or configurations, such as `HKEY_LOCAL_MACHINE\SOFTWARE`.

  - **Look for evidence of exfiltration**: Assess file creation events (e.g., `File Created` events in Sysmon `Event ID 11`) for the same time frame as the `regedit.exe` execution to confirm if files were written to disk.

  - **Review surrounding activity**: Correlate with other logs (e.g., Network logs or EDR data) to identify potential follow-up actions or lateral movement attempts post-export.

  - **Consider asset criticality**: Determine whether the affected system is a critical server or user workstation. Focus on the implications of sensitive data export in the context of its role within the organization.

  ---

  ### Prioritization

  This alert has a **low priority** severity due to the potential benign nature of Registry exports; however, if associated with high-value systems or sensitive configurations, the severity may increase. The likelihood of malicious abuse exists, especially in environments where sensitive data resides in the Registry.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detection as legitimate applications may also trigger this alert, particularly for administrative tasks. Comprehensive logging configurations are necessary for reliable detection, specifically ensuring process creation logging is enabled. Also, legitimate automated processes, like backup scripts or configuration management tools, may involve exporting registry keys. Related detections include patterns of unauthorized access to sensitive information within the Registry to bolster alerting capabilities.

