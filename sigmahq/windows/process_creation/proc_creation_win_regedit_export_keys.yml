detection:
  selection_img:
  - Image|endswith: '\regedit.exe'
  - OriginalFileName: 'REGEDIT.EXE'
  selection_cli:
    CommandLine|contains|windash: ' -E '
  filter_1:     # filters to avoid intersection with critical keys rule
    CommandLine|contains:
    - 'hklm'
    - 'hkey_local_machine'
  filter_2:
    CommandLine|endswith:
    - '\system'
    - '\sam'
    - '\security'
  condition: all of selection_* and not all of filter_*
falsepositives:
- Legitimate export of keys
level: low
note: |
  ### Technical Context
  This detection rule identifies the export of a Registry key to a file using the Regedit tool, which can be a precursor to malicious activities such as data exfiltration or reconnaissance. Attackers may leverage this technique to collect sensitive configuration or credential information from a target system's Registry, potentially exfiltrating it for further exploitation or lateral movement within the network. Exporting Registry keys can reveal critical information about system configurations, installed software, and security settings.

  The relevant MITRE ATT&CK tactics include **Exfiltration** (TA0010) for the act of transferring data out of the environment and **Discovery** (TA0007) for understanding system configurations and credentials through Registry exploration. Techniques associated with this detection are **Registry Shares** (T1012), which describes the unauthorized access or exfiltration of information from system Registry entries.

  Primary data sources that provide evidence of this activity include **process creation events** that capture command line inputs and image paths of executed processes, specifically those involving `regedit.exe` where the presence of suspicious command line arguments indicates registry exports.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for `regedit.exe` to identify any command lines containing the `-E` parameter, which denotes an export operation. Note the timestamp and user context for forensic analysis.
  - **Analyze Command Line Arguments**: Focus on the full command line executed with `regedit.exe`, specifically looking for any references to critical Registry hives like `HKLM` or specific keywords that suggest sensitive information is being targeted for export.
  - **Correlate with User Activity**: Investigate the user account associated with the registry export to check for prior suspicious activity or unusual access patterns. Assess whether this activity aligns with legitimate administrative tasks or is indicative of malicious intent.
  - **Check for Exfiltration Patterns**: If the Registry file is exported, review file access logs or network traffic flows to identify whether the exported file is subsequently transferred outside the network, suggesting an exfiltration attempt.

  ### Prioritization
  This alert carries a **low** severity level due to the potential for legitimate administrative activities to mimic the detected behavior. However, given the context of the environment and the sensitivity of data that may reside in the Registry, it is still essential to investigate any instances of this rule triggering to rule out malicious intent.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, particularly if legitimate processes for exporting Registry keys are commonplace in the environment. The detection logic assumes that all Registry exports through `regedit.exe` are inherently suspicious, which may not always be the case. For this alert to function correctly, it requires comprehensive logging of process creation events, including complete command line details and user contexts. If such logging is not enabled, this rule may fail to detect potential threat activity effectively.

