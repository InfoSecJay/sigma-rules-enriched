detection:
  selection:
    CommandLine|contains:     # make sure that your backend applies the strings case-insensitive
    - 'IEX ((New-Object Net.WebClient).DownloadString'
    - 'IEX (New-Object Net.WebClient).DownloadString'
    - 'IEX((New-Object Net.WebClient).DownloadString'
    - 'IEX(New-Object Net.WebClient).DownloadString'
    - ' -command (New-Object System.Net.WebClient).DownloadFile('
    - ' -c (New-Object System.Net.WebClient).DownloadFile('
  condition: selection
falsepositives:
- Software installers that pull packages from remote systems and execute them
level: high
note: |
  ### Technical Context

  This rule detects PowerShell command patterns commonly associated with malicious download and execution techniques. Specifically, it identifies instances where PowerShell is used to download scripts or files from the internet and execute them directly in memory. The likely attacker objective is to use embedded scripts for further exploitation, such as deploying malware or gaining unauthorized access. This behavior maps to the MITRE ATT&CK technique "PowerShell" (T1059.001).

  The primary telemetry sources for this detection are process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which log command line activity and process information. If successful, an adversary could execute arbitrary commands leading to data exfiltration or system compromise. Importantly, this detection does not confirm successful execution or the exploit's intent on its own.

  ---

  ### Investigation Steps

  - **Review command line parameters:** Check processes with Event ID 4688 or Sysmon Event ID 1, focusing on commands containing "IEX (" or "DownloadString". Malicious samples will typically have these patterns, while legitimate commands may pull trusted scripts.

  - **Investigate parent process:** Identify the parent process of the PowerShell execution by correlating with Event ID 4688. Anomalous parent processes, such as those not typically associated with legitimate script execution (e.g., a non-administrative task scheduler), may indicate malicious activity.

  - **Examine process execution context:** Validate the context of execution by reviewing the user account associated with the PowerShell command. Actions performed by privileged or unexpected user accounts can indicate potential malicious activity.

  - **Check for known malicious hashes:** Review any downloaded files in the context of upload logs for known malware hashes using threat intelligence feeds. Malicious downloads may include payloads or stagers identified in industry reports.

  - **Identify software installers:** Look for legitimate software installation processes (e.g., software update processes) that might also use similar command structures. They often pull from trusted repositories and should not display suspicious command patterns.

  ---

  ### Prioritization

  This alert is categorized as high priority due to the potential impact on critical systems if malicious activity is confirmed. The behavior has a high likelihood of being exploited by adversaries as part of their execution strategy. Such techniques are frequently weaponized in various attacks, including ransomware and remote access malware.

  ---

  ### Blind Spots and Assumptions

  This detection may not identify obfuscated scripts or other evasion techniques that modify the command pattern, such as using different obfuscation methods or alternative APIs. The reliability of detection depends on appropriate logging configurations for both process creation and PowerShell command execution. Additionally, benign scenarios include software installers that pull legitimate packages remotely, which can trigger false positives. A related detection rule focused on "PowerShell EncodedCommand" would enhance coverage against obfuscation tactics.

