detection:
  selection:
    CommandLine|contains:     # make sure that your backend applies the strings case-insensitive
    - 'IEX ((New-Object Net.WebClient).DownloadString'
    - 'IEX (New-Object Net.WebClient).DownloadString'
    - 'IEX((New-Object Net.WebClient).DownloadString'
    - 'IEX(New-Object Net.WebClient).DownloadString'
    - ' -command (New-Object System.Net.WebClient).DownloadFile('
    - ' -c (New-Object System.Net.WebClient).DownloadFile('
  condition: selection
falsepositives:
- Software installers that pull packages from remote systems and execute them
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious PowerShell command patterns frequently used by attackers. The rule specifically identifies command lines that involve downloading and executing scripts from the internet, a tactic commonly employed in initial access and execution phases of an attack. The associated MITRE ATT&CK techniques are Execution (T1059.001) and Initial Access.

  The primary telemetry source for this detection is process creation logs on Windows systems, specifically looking for command-line arguments that suggest the use of PowerShell to download content from remote locations. If confirmed malicious, this behavior could lead to unauthorized access, data exfiltration, or lateral movement within the network. Notably, this detection does NOT definitively prove malicious intent; benign processes like software installation might trigger it.

  ---

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 for processes with PowerShell (powershell.exe) and analyze the CommandLine field for matches to the strings defined in the detection rule.

  - **Identify command execution context**: Investigate the parent process of the PowerShell execution. A legitimate process (e.g., software installation) would typically have a corresponding installer as the parent, while suspicious activity may have been initiated by a less common process.

  - **Assess downloaded scripts**: If a download was executed, follow up with checks on recent file creation in the temporary folder (C:\Users\<user>\AppData\Local\Temp) to confirm any script or binary files were downloaded and executed.

  - **Review system logs for anomalies**: Analyze Sysmon Event ID 1 to determine whether there are additional execution patterns or network connections related to the PowerShell command, and cross-reference with the network logs.

  - **Look for benign use cases**: Consider the context—did the user recently install applications or perform updates? Software installers may legitimately use similar patterns when downloading dependencies.

  - **Verify network activity**: Check network logs for external connections (e.g., DNS queries or HTTP requests) during the time of the PowerShell execution to identify any communication with known malicious domains or IP addresses.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on critical systems. Given that downloading and executing scripts is a commonly weaponized tactic, the likelihood of malicious intent is significant, especially in environments where such behavior isn't typical for users or services.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate software installations can also trigger it, leading to false positives. Ensuring that process creation logs from Sysmon or Windows Event Logs are uniformly collected is essential for consistent detection. Additionally, the alert could be activated by benign scripts or update mechanisms that simulate the same behavior. For enhanced coverage, consider implementing companion detections for unusual network activity associated with downloaded scripts to capture more context around the alert.

