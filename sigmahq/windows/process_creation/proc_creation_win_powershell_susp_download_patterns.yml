detection:
  selection:
    CommandLine|contains:     # make sure that your backend applies the strings case-insensitive
    - 'IEX ((New-Object Net.WebClient).DownloadString'
    - 'IEX (New-Object Net.WebClient).DownloadString'
    - 'IEX((New-Object Net.WebClient).DownloadString'
    - 'IEX(New-Object Net.WebClient).DownloadString'
    - ' -command (New-Object System.Net.WebClient).DownloadFile('
    - ' -c (New-Object System.Net.WebClient).DownloadFile('
  condition: selection
falsepositives:
- Software installers that pull packages from remote systems and execute them
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious PowerShell commands that leverage the `New-Object Net.WebClient` class to download and execute potentially malicious scripts or binaries. These PowerShell commands are often indicative of stagers or downloaders used in various attack scenarios, including malware deployment or exploitation efforts. Attackers may use such techniques to execute arbitrary code within the context of an authenticated user, potentially leading to unauthorized access or lateral movement within the environment.

  The relevant MITRE ATT&CK tactics and techniques related to this detection include **Execution** (TA0002) and specifically **Command-Line Interface** (T1059.001), which encompasses PowerShell command execution. Attackers using these methods often aim to bypass traditional security measures and execute malicious payloads directly on compromised systems, emphasizing the need for timely detection and response.

  To effectively monitor for this activity, the primary data sources will include process creation events from Windows operating systems, as they will capture the execution of PowerShell commands and their associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for alerts that indicate PowerShell commands matching the suspicious patterns outlined in the detection rule. Look specifically for commands that utilize `New-Object Net.WebClient`.

  - **Analyze Network Activity:** Investigate outbound network connections initiated by PowerShell to identify any attempts to download files from suspicious or untrusted URLs. Look for behaviors such as access to uncommon domains or IPs associated with known malicious activity.

  - **Inspect User Context:** Check the user context under which the PowerShell commands were executed. Evaluate whether the user has a legitimate business reason for conducting such operations or if it appears anomalous.

  - **Correlate with Threat Intelligence:** Utilize threat intelligence feeds to correlate the detected activity with reported malicious campaigns or known threat actors that may employ similar PowerShell download techniques.

  ### Prioritization
  This alert should be considered high severity due to its potential impact on enterprise security. The use of PowerShell for downloading and executing unknown scripts poses a significant risk, as it may indicate an active exploitation attempt that can lead to data compromise or system integrity issues.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate software installations that utilize similar PowerShell commands to download updates or other necessary files from trusted sources. Additionally, the effectiveness of this detection relies on proper logging configurations for the Windows process creation events; if these logs are not enabled or retained, the alert may fail to trigger. The detection logic assumes that any instance of these commands is suspicious, thus necessitating further context to avoid false positives from benign administrative activities.

