note: |
  ### Technical Context

  This rule detects suspicious PowerShell command patterns typically used to download and execute payloads directly from the internet, specifically utilizing the `Net.WebClient` class. Adversaries often leverage this technique as part of their initial access or execution phases with the objective to run malicious scripts or payloads on compromised systems. This behavior maps to the MITRE ATT&CK technique "Command and Scripting Interpreter - PowerShell" (T1059.001).

  The primary telemetry sources for this detection are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. The security impact of such behavior could be significant, as it may indicate an active malware infection or initial compromise. However, this detection does NOT confirm malicious activity on its own; it only highlights potentially suspicious command patterns that may also arise from legitimate administrative activities or benign software installers.

  ### Investigation Steps

  - **Verify process creation details:**
    Check Security Event ID 4688 for the related process ID. Look for the user context under which PowerShell was executed. Initially, expect to see administrative accounts or service accounts engaged in legitimate software updates or automation scripts.

  - **Analyze command line arguments:**
    Review the command line arguments in Sysmon Event ID 1 for common benign patterns. Legitimate commands often do not look like `IEX (New-Object Net.WebClient).DownloadString`. Search for any download commands that particularly include URLs or executables being executed directly.

  - **Examine network activity:**
    Use network logs from your firewall or proxy to investigate outbound connections within the timeframe of the PowerShell execution. Look specifically for connections to suspicious domains or IPs that match known bad indicators. Compare with benign domains accessed by legitimate applications.

  - **Inspect run/malware artifacts:**
    Check for the creation of unusual or malicious files in temporary directories or locations commonly used for downloaded files (e.g., `%Temp%`). Look for executable or script files created around the same time as the detected PowerShell command.

  - **Correlate with user behavior:**
    Review the user's historical behavior and activity logs leading up to the PowerShell execution. Establish whether this user has previously conducted similar actions, which could indicate either benign use or a high-risk anomaly.

  ### Prioritization

  This alert should be treated with high severity due to the risk of it indicating an attempt to execute malicious payloads directly on critical systems. Given the nature of PowerShell as a common tool for attackers, successful malicious exploitation is likely if this behavior is confirmed in high-value contexts, such as on domain controllers or servers.

  ### Blind Spots and Assumptions

  This detection may overlook legitimate administrative tasks performed via PowerShell designed to manage systems or perform updates. It assumes that logs are correctly configured to capture process creation events and command-line parameters, which may not always be the case in all environments. Additionally, well-crafted adversarial scripts may evade detection by using obfuscation or less common command patterns. A companion detection rule for monitoring direct downloads from PowerShell execution could reinforce coverage and help detect if scripts are misused in this context.

