  ### Technical Context

  This rule detects the execution of "SysmonEOP.exe," a proof-of-concept (PoC) tool that exploits CVE-2022-41120, enabling privilege escalation in environments using the Sysmon tool. The likely attacker objective is to gain elevated privileges for further exploitation within the target system. This activity aligns with the MITRE ATT&CK tactics of Privilege Escalation (T1068).

  The primary telemetry sources include Windows process creation logs, specifically focusing on the image name of executed processes and their associated hashes. If successful, this exploitation could allow an adversary to gain unauthorized access or execute commands with elevated permissions. It is important to note that triggering this detection does not, on its own, confirm malicious intent, as it may also correspond to benign testing or research activities.

  ---

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Windows Security Event ID 4688 for process creation details. Look for entries where the image path ends with `\SysmonEOP.exe` and timestamp correlates with the alert.

  - **Validate the Image Hash:** Cross-reference the process creation logs with provided hashes (`22F4089EB8ABA31E1BB162C6D9BF72E5` and `5123FA4C4384D431CD0D893EEB49BBEC`) in the Security Event logs to confirm it matches malicious signatures.

  - **Identify Legitimate Usage:** Determine if `SysmonEOP.exe` was executed as part of authorized testing by checking with relevant IT or development teams, particularly around the noted timeline and affected systems.

  - **Look for Suspicious Parent Processes:** Investigate parent process IDs linked to the process creation. Legitimate processes usually initiate from trusted applications or user actions; suspicious parent processes may indicate malicious activity.

  - **Check for Unusual Network Activity:** Query Windows Firewall logs (Event ID 5156) for outbound traffic initiated by the process. Malicious use may show connections to suspicious external IPs or uncommon ports.

  - **Assess System Impact:** Identify whether the affected hosts are critical assets (e.g., domain controllers, servers) since a privilege escalation on these can significantly increase overall risk.

  ---

  ### Prioritization

  The alert signifies a critical risk due to its association with a known vulnerability that can lead to privilege escalation. Given the potential for malicious abuse by iterating exploitation or lateral movement, immediate response is required. This behavior is not only specific but is also commonly weaponized in adversary playbooks.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by altering the executable name or hashing method, which could prevent it from triggering as intended. Reliable detection requires that Sysmon is properly configured to log detailed process creation events, including command line arguments. Legitimate software testing or research practices may inadvertently trigger the alert. A related detection could include monitoring for abnormal privileges assigned to user accounts following the execution of this tool, which can provide additional insights into unauthorized activities.

