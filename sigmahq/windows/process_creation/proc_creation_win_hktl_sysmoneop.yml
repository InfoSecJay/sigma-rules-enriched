  ### Technical Context

  This Sigma rule detects the execution of SysmonEOP.exe, a known proof of concept for exploiting Sysmon CVE-2022-41120, allowing privilege escalation in Windows environments. The likely attacker objective is to gain elevated permissions on compromised systems, facilitating further lateral movement or data access. This behavior maps to the MITRE ATT&CK technique "Exploitation for Client Execution" (T1068) and relates specifically to privilege escalation.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, this could lead to significant security impacts, allowing attackers to execute commands with higher privileges. However, this detection does NOT confirm that the execution was successful in achieving the attacker’s objective.

  ### Investigation Steps

  - **Review process execution logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 where the Image ends with 'SysmonEOP.exe' and inspect the Process Command Line for additional arguments that may indicate malicious usage.

  - **Analyze the hash of the executable**: Verify the process’s hashes against the known IMPHASH values (`22F4089EB8ABA31E1BB162C6D9BF72E5` and `5123FA4C4384D431CD0D893EEB49BBEC`). If the hash matches, it is a strong indicator of potential exploit use.

  - **Examine related parent processes**: Identify the parent process of SysmonEOP.exe to understand the context of execution. Common benign parent processes include `cmd.exe` or `powershell.exe`, but if originated from a suspicious or unexpected parent, it raises red flags.

  - **Correlate with User Behavior**: Review the user accounts associated with the execution. A legitimate account executing this tool during maintenance windows may be benign, whereas accounts with a recent history of high-risk actions (like failed logins) could suggest misuse.

  - **Check for unusual outbound connections**: Investigate if there are any subsequent network connections or data flows after the execution of SysmonEOP.exe involving unusual IPs or domains, indicating potential data exfiltration attempts.

  - **Conduct a historical analysis**: Determine if prior executions of SysmonEOP.exe or similar tools are reported, which may illuminate patterns of behavior aligning with known threat actor tactics.

  ### Prioritization

  Given the critical nature of this detection, the alert should be treated with high priority. The execution of this exploit could lead to significant security breaches, especially if it occurs on a system with sensitive data or elevated privileges. This behavior is not only indicative of active exploitation attempts but is also commonly used in various attack strategies.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate applications or scripts may utilize similar naming conventions, potentially leading to false positives. It requires proper Sysmon logging configuration to capture necessary events, specifically for process creation. Activities such as software installation by admins, benign software debugging, or testing could trigger the alert. Companion detections for privilege escalation attempts, such as monitoring for abnormal service creation (T1543) or subsequent command line activity (T1059), can bolster coverage against these threats.

