note: |
  ### Technical Context
  This detection rule identifies attempts to execute a renamed version of the Windows command-line utility `whoami.exe`, which is primarily used to display the current user's identity in a Windows environment. Attackers may rename legitimate tools to evade detection mechanisms and achieve stealth while conducting reconnaissance. The scenario could involve an attacker utilizing a renamed `whoami` to confirm their access and privileges or to enumerate user information without raising suspicion.

  The relevant MITRE ATT&CK tactics for this activity include **Discovery** (TA0007), specifically the technique **System Information Discovery** (T1082). Attackers leveraging renamed executables to conduct reconnaissance activities can gain insights into the environment, user permissions, and potential further attack vectors. Primary data sources for detecting this behavior include **process creation events** on Windows systems, which provide logs of executable files run by users.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation logs for instances where `whoami.exe` has been executed, focusing on any irregularities in the file path or unusual parent process relationships that may indicate malicious intent.
  - **Examine Recent Executable Renaming:** Inspect the filesystem for recent changes to executable files, specifically focusing on naming patterns and timestamps for any instances of `whoami.exe` being renamed.
  - **Verify User Permissions:** Conduct a review of permissions for the user account executing the renamed binary to understand if there are escalated privileges being exploited by the attacker.
  - **Conduct Threat Intelligence Searches:** Investigate known malicious tools and software suites that might have similar behaviors to the renamed `whoami`, using threat intelligence platforms to correlate findings with known attacker techniques.

  ### Prioritization
  This alert is deemed critical, as the execution of a renamed `whoami` can indicate an active reconnaissance phase of a more significant attack or compromise. Such activities are often associated with both insider threats and external actors attempting to validate their access or escalate privileges within the environment.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if logging for process creation events is not enabled across all systems or if renaming techniques become more sophisticated, evading static detection methods. The detection logic assumes that any execution of the original `whoami.exe` name will not be logged; thus, it may miss instances where the executable is legitimately called by system processes. To ensure effective function of this alert, it is essential that comprehensive process creation logging is enabled across all endpoints in the environment.

