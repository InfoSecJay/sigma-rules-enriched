  ---

  ### Technical Context

  This rule detects the execution of the Windows command-line utility **whoami** that has been renamed to bypass security detection mechanisms. The likely attacker objective is to gather user and environment information stealthily, which can aid in lateral movement or further reconnaissance within a target environment. The relevant MITRE ATT&CK tactic is **Discovery** (TA0007) and the technique is **System Information Discovery** (T1033).

  The primary telemetry source is process creation logs from Windows, specifically Security Event ID **4688** and Sysmon Event ID **1**, which capture details of new process creations. If malicious, this behavior can lead to unauthorized access and data exfiltration. However, this detection does NOT confirm malicious intent on its own, as legitimate use cases for *whoami* exist.

  ---

  ### Investigation Steps

  - **Check process details:** Review Security Event ID **4688** logs to find the execution event for any process with the original file name `whoami.exe`. Look for unusual parent processes or command-line arguments that deviate from standard use cases.

  - **Validate legitimate usage:** Identify approved IT or DevOps scripts that use *whoami* under its standard name. Typical command usage in a corporate context might involve administrative scripts for environment checks, whereas any use of a renamed version may be suspicious.

  - **Examine process lineage:** Analyze Sysmon Event ID **1** to determine the parent-child process relationships. Malicious executions often have unusual parent processes that could indicate exploitation attempts, such as processes spawned from known exploit tools or administrative utilities.

  - **Investigate file metadata:** If the renamed executable was created on the system, gather details about its creation time, user, and hash. Legitimate versions of *whoami* should exist in the `C:\Windows\System32` directory with standard hash values. Any deviation raises suspicion.

  - **Correlate network activity:** Look into outbound connections logged via Windows Firewall or EDR solutions that correlate with the execution of the renamed process. If connections are made to unfamiliar IP addresses or domains, this indicates potential exfiltration.

  - **Conduct memory analysis:** If possible, analyze the memory of the host at the time of the alert for active instances of the renamed *whoami* process to capture any indicators of post-exploitation activity (such as command and control communication).

  ---

  ### Prioritization

  The alert is critical due to the execution of a system utility that has been tampered with for evasion, suggesting a high likelihood of malicious activity. This behavior is aligned with common attacker tactics for discovery and can lead to further malicious exploitation if not addressed.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of attackers to rename processes creatively; therefore, naming conventions can lead to false negatives. Reliable detection requires proper configuration for process creation logging, particularly the activation of Sysmon on endpoints. Administrative scripting that legitimately invokes *whoami* could trigger this alert, requiring analysts to understand normal operational practices. A related detection to strengthen coverage is tracking modifications to processes with techniques like **Masquerading** (T1036), which can further indicate attempts to evade detection.

