note: |
  ### Technical Context

  This rule detects the execution of the `whoami.exe` command that has been renamed to an alternate filename, a technique often used by adversaries to evade detection while performing reconnaissance. The likely objective of this behavior is to gather information about user privileges and system properties without raising alerts, enabling further exploitation or lateral movement. This aligns with the ATT&CK framework under the tactic of "Discovery" (T1083) and the technique of "File and Directory Discovery" (T1033).

  The primary telemetry sources include Windows event logs, specifically focusing on process creation events such as Security Event ID 4688, Sysmon Event ID 1, or other process logging frameworks. If executed by an unauthorized actor, this could facilitate unauthorized access or escalation of privileges within the environment. It is critical to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also utilize `whoami`.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the identified alternate name of `whoami.exe`. Look for parent process information and command line arguments to ensure clarity on how this process was initiated.

  - **Identify legitimate uses:** Validate typical user behavior by checking normal usage patterns for `whoami.exe` in your environment. This usually involves checking common scripts or administrative tasks where `whoami` is executed without replacement.

  - **Examine parent processes:** Investigate the parent process of the identified `whoami.exe` instance. High-confidence malicious indicators would include unusual parent processes like `powershell.exe` or `cmd.exe`, especially if executed from suspicious directories.

  - **Review account activity:** Cross-reference the account executing this process with user account activity. Confirm if it's a privileged account and investigate any resulting actions taken by this account, particularly around sensitive resources.

  - **Check for modifications:** Look for any recent renaming or modification events on `whoami.exe`. You can utilize File System Auditing (Event ID 4663) to find any indicators of tampering or unauthorized file changes that hint at malicious intent.

  ### Prioritization

  This alert is classified as critical due to the potential risk of unauthorized reconnaissance activities conducted on sensitive systems. The likelihood of malicious abuse is high because renamed binaries are a common evasion tactic. Execution of `whoami.exe` in this manner is a precursor to further exploitative activities and is often weaponized in penetration testing and real-world attacks.

  ### Blind Spots and Assumptions

  This rule may be limited by evasion techniques such as file obfuscation or legitimate renaming of tools for non-malicious purposes. Additionally, assumptions include that all relevant processes are logged appropriately in the system. Legitimate activities, such as administrative scripts or development environments, may trigger this alert. A companion detection that bolsters coverage includes monitoring for known suspicious process patterns related to lateral movement, such as `psexec` or remote PowerShell.

