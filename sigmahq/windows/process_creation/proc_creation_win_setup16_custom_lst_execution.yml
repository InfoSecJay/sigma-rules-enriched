title: Setup16.EXE Execution With Custom .Lst File
id: 99c8be4f-3087-4f9f-9c24-8c7e257b442e
status: test
description: |
  Detects the execution of "Setup16.EXE" and old installation utility with a custom ".lst" file.
  These ".lst" file can contain references to external program that "Setup16.EXE" will execute.
  Attackers and adversaries might leverage this as a living of the land utility.
references:
- https://www.hexacorn.com/blog/2024/10/12/the-sweet16-the-oldbin-lolbin-called-setup16-exe/
author: frack113
date: 2024-12-01
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage: 'C:\Windows\SysWOW64\setup16.exe'
    ParentCommandLine|contains: ' -m '
  filter_optional_valid_path:
    Image|startswith: 'C:\~MSSETUP.T\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- On modern Windows system, the "Setup16" utility is practically never used, hence
  false positive should be very rare.
level: medium
note: |
  ### Technical Context
  This rule is designed to detect the execution of the "Setup16.EXE" installation utility, particularly when accompanied by a custom ".lst" file. The utility is often an overlooked legacy component of Windows systems, and when used in conjunction with an ".lst" file, it may indicate that an attacker is executing arbitrary or malicious code in the guise of a legitimate installation process. This behavior often aligns with a tactic known as "Living off the Land," where attackers employ existing tools in their environment to evade detection, thereby often maintaining persistence or escalating privileges within compromised systems.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection are “Privilege Escalation” (TA0004), “Persistence” (TA0003), and “Defense Evasion” (TA0005), particularly technique T1574.005 which refers to the abuse of existing utilities for malicious purposes. The primary data source for this detection is the process creation logs from Windows systems, as they provide insight into executed commands and their parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for the execution of "Setup16.EXE" and investigate the associated command line arguments, focusing on any instances where “ -m” is present.
  - **Examine Parent Process Details:** Identify the parent process of the execution to assess whether execution originated from a legitimate context or if it was launched from an anomalous source.
  - **Assess .LST File Contents:** Investigate the specified ".lst" file for references to external programs or scripts that may be executed, which could indicate malicious intent.
  - **Cross-reference with Recent Changes:** Look for any recent changes in system configuration, new installations, or unexpected file modifications that could correlate with the detected execution.

  ### Prioritization
  This alert is prioritized as medium severity due to the potential for the execution of malicious payloads via a legitimate utility, which could lead to privilege escalation or persistent access to the environment. The likelihood of exploitation arises from the utility's historical use in administration and its availability on most Windows systems.

  ### Blind Spots and Assumptions
  The detection logic assumes that the execution of "Setup16.EXE" with a custom ".lst" file indicates malicious activity; however, legitimate use cases may exist in legacy systems. As such, there may be gaps in detection if newer systems or environments frequently leverage "Setup16.EXE" for valid purposes. Additionally, the detection relies on available process creation logs, so any environments with incomplete logging, lack of configuration for process creation event captures, or reliance on newer installation practices may reduce visibility regarding this behavior.

