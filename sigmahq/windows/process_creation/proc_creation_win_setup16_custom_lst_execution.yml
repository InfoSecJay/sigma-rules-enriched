title: Setup16.EXE Execution With Custom .Lst File
id: 99c8be4f-3087-4f9f-9c24-8c7e257b442e
status: test
description: |
  Detects the execution of "Setup16.EXE" and old installation utility with a custom ".lst" file.
  These ".lst" file can contain references to external program that "Setup16.EXE" will execute.
  Attackers and adversaries might leverage this as a living of the land utility.
references:
- https://www.hexacorn.com/blog/2024/10/12/the-sweet16-the-oldbin-lolbin-called-setup16-exe/
author: frack113
date: 2024-12-01
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage: 'C:\Windows\SysWOW64\setup16.exe'
    ParentCommandLine|contains: ' -m '
  filter_optional_valid_path:
    Image|startswith: 'C:\~MSSETUP.T\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- On modern Windows system, the "Setup16" utility is practically never used, hence
  false positive should be very rare.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of "Setup16.EXE," a legacy 16-bit Windows installer that is often used by attackers to execute additional payloads via custom ".lst" files. The likely attacker objective is to leverage this utility as a living-off-the-land (LoL) tactic to bypass conventional security measures, persist on the system, or escalate privileges. This behavior fits under the MITRE ATT&CK framework, particularly in the tactics of **Privilege Escalation** (TA0004), **Persistence** (TA0003), and **Defense Evasion** (TA0005) with technique ID **T1574.005**.

  The primary telemetry source is Windows process creation logs, specifically Security Event ID **4688** or Sysmon Event ID **1**, capturing the process creation details. If malicious, the security impact includes unauthorized execution of code that could compromise system integrity or access sensitive data. This detection does NOT confirm malicious intent solely based on "Setup16.EXE" execution, as there may be legitimate use cases in a very limited context.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Security Event ID **4688** or Sysmon Event ID **1** for "Setup16.EXE" execution. Look for the ParentCommandLine containing " -m" which indicates the potential use of a custom ".lst" file.

  - **Examine Command Line Arguments**: Analyze the command line for "Setup16.EXE" to identify any suspicious parameters. Legitimate usage typically does not include custom ".lst" files or unusual arguments.

  - **Identify Custom .lst File Contents**: Investigate any associated ".lst" files for external program paths or potentially malicious commands. Look for references to programs that are not part of standard system operations.

  - **Correlate with User Activity**: Validate the context of the user account executing "Setup16.EXE." Confirm whether the user had a legitimate reason (e.g., software installation) or if this behavior indicates potential compromise.

  - **Check Directory Path and Parent Process**: Confirm the execution path of "Setup16.EXE." It should start with 'C:\~MSSETUP.T\'. Investigate the parent process for further context, as this may reveal additional malicious activity or lead to the original compromise.

  - **Assess for Unusual File Creation**: Monitor for any unusual file creation in the directory during or after the execution of "Setup16.EXE." Look for signs of persistence, such as new executables or script files.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for exploitation in an enterprise environment. The presence of "Setup16.EXE" is highly uncommon and could signify an attempt to blend in with legitimate activity. Attackers often employ such techniques, indicating a reasonable likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion techniques. If attackers rename or modify binaries, detection may fail. The requirement for Windows process creation logs is critical; without it, detection can be unreliable. Legitimate installers for legacy software could trigger this alert. A companion detection to consider is monitoring for unusual process spawning or command line arguments linked to other LoLbins, enhancing overall detection capabilities.

