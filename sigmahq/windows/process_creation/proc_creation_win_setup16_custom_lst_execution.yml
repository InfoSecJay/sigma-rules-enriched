title: Setup16.EXE Execution With Custom .Lst File
id: 99c8be4f-3087-4f9f-9c24-8c7e257b442e
status: test
description: |
  Detects the execution of "Setup16.EXE" and old installation utility with a custom ".lst" file.
  These ".lst" file can contain references to external program that "Setup16.EXE" will execute.
  Attackers and adversaries might leverage this as a living of the land utility.
references:
- https://www.hexacorn.com/blog/2024/10/12/the-sweet16-the-oldbin-lolbin-called-setup16-exe/
author: frack113
date: 2024-12-01
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage: 'C:\Windows\SysWOW64\setup16.exe'
    ParentCommandLine|contains: ' -m '
  filter_optional_valid_path:
    Image|startswith: 'C:\~MSSETUP.T\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- On modern Windows system, the "Setup16" utility is practically never used, 
  hence false positive should be very rare.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of "Setup16.EXE," an outdated installation utility, accompanied by a custom ".lst" file. Attackers might use this combination as a living-off-the-land technique to execute potentially malicious commands or scripts while bypassing detection mechanisms. The relevant MITRE ATT&CK tactics for this behavior are Privilege Escalation (TA-0004) and Defense Evasion (TA-0005), specifically technique T1574.005 (Hijack Execution Flow).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1) that provide insights into process execution details. If malicious, this behavior could be part of an attempt to escalate privileges or maintain persistence within the environment. Importantly, this detection does NOT confirm malicious intent on its own, as the usage of Setup16.EXE could, in rare contexts, be legitimate.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances of "setup16.exe" being spawned with a ParentImage pointing to "C:\Windows\SysWOW64\setup16.exe" and flags in ParentCommandLine indicating a custom ".lst" file.

  - **Analyze the .lst file content**: Examine the contents of the .lst file being utilized. Malicious indicators include unusual executable paths or commands that may execute payloads. Compare with known legitimate .lst file structures, which should reference typical installation parameters without external scripts.

  - **Review recent installations or updates**: Investigate if there were any legitimate installations or software updates performed recently that may explain the use of Setup16.EXE. Look for entries in the system event logs corresponding to software installations around the same time.

  - **Correlate with network activity**: Assess network logs for any outbound connections initiated by processes linked to Setup16.EXE. Unusual IP addresses or endpoints that include execution of additional payloads could indicate malicious behavior.

  - **Consider asset classification**: Identify whether the host running Setup16.EXE is part of a critical environment, such as a domain controller or server hosting sensitive data, which would amplify the risk associated with this detection.

  - **Record expected benchmarks**: Understand that legitimate usage of Setup16.EXE is exceedingly rare in modern environments. A lack of other legitimate software relying on this utility in your infrastructure can strengthen context regarding the potential for malicious activity.

  ### Prioritization

  This alert exhibits medium severity due to the low likelihood of benign usage of Setup16.EXE in modern Windows environments and its association with privilege escalation and defense evasion tactics. If detected on reinforced systems, it poses a significant risk as this technique can be exploited to execute arbitrary code.

  ### Blind Spots and Assumptions

  Detection may have limitations as legitimate administrative tools or system recovery processes could potentially trigger the alert, especially in legacy environments that still use older applications. Ensure logging is enabled for process creation events and consider complementary detections such as monitoring for unusual parent-child process relationships. Additionally, environments with infrequent or no usage of Setup16.EXE should raise heightened scrutiny if this behavior occurs.

