title: Setup16.EXE Execution With Custom .Lst File
id: 99c8be4f-3087-4f9f-9c24-8c7e257b442e
status: test
description: |
  Detects the execution of "Setup16.EXE" and old installation utility with a custom ".lst" file.
  These ".lst" file can contain references to external program that "Setup16.EXE" will execute.
  Attackers and adversaries might leverage this as a living of the land utility.
references:
- https://www.hexacorn.com/blog/2024/10/12/the-sweet16-the-oldbin-lolbin-called-setup16-exe/
author: frack113
date: 2024-12-01
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage: 'C:\Windows\SysWOW64\setup16.exe'
    ParentCommandLine|contains: ' -m '
  filter_optional_valid_path:
    Image|startswith: 'C:\~MSSETUP.T\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- On modern Windows system, the "Setup16" utility is practically never used, 
  hence false positive should be very rare.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the "Setup16.EXE" utility when accompanied by a custom ".lst" file, which can contain references to other executables that the utility may launch. Attackers may utilize this tool as a Living Off the Land Binary (LoLBIN) to evade detection while executing their malicious payloads. The relevant MITRE ATT&CK techniques include Privilege Escalation (T1574.005) and Persistence tactics, which indicate the potential for unauthorized system access and long-term foothold.

  The primary telemetry source comes from Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture the execution of processes and their command-line arguments. If malicious, this activity may allow the adversary to execute additional payloads or escalate privileges. However, this detection does NOT confirm that malicious actions occurred without additional contextual analysis.

  ### Investigation Steps

  - **Inspect the process creation logs:** Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for the creation of "C:\Windows\SysWOW64\setup16.exe" with command line containing " -m". Confirm the command line structure includes references to a custom ".lst" file.

  - **Verify parent process legitimacy:** Identify the parent process of "Setup16.EXE" by analyzing Event ID 4688. A legitimate, expected parent might be known system utilities (e.g., "powershell.exe" or "cmd.exe"). Uncommon parent processes may indicate a malicious indicator.

  - **Check the path of the custom .lst file:** Review logs for the process creation that starts with "C:\~MSSETUP.T\". If this is present, classify it as suspicious, particularly when combined with activities from unwanted or untrusted applications.

  - **Correlate with system integrity checks:** Validate if the system has any expected software installations or updates that would warrant legitimate use of "Setup16.EXE". This may include reviewing Windows Installer logs for recent installations or tool usage that align with the normal administrative workflow.

  - **Search for linked executable launches:** Investigate whether "Setup16.EXE" is followed by the execution of other suspicious executables as flagged by the ".lst" file. Also check for their legitimacy against whitelisting statuses or known approved applications in your environment.

  ### Prioritization

  This alert should be treated with medium severity as its detection points to potential unauthorized execution of utilities linked to privilege escalation and persistence mechanisms. The likelihood of exploitation exists, given that the "Setup16.EXE" is rarely used in modern environments and may indicate adversarial presence when detected.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of obfuscation techniques or alterations in the command line that evade profiling. It assumes that Windows logging is correctly configured for process creation and that the logs are capturing sufficient contextual information. Legitimate administrative actions, such as software installations or system maintenance, may trigger this alert. Complementing this detection with additional monitoring rules on unusual parent-child process relationships can enhance overall coverage.

