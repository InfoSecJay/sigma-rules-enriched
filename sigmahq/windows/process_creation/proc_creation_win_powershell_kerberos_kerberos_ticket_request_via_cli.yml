logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell.exe'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains: 'System.IdentityModel.Tokens.KerberosRequestorSecurityToken'
  condition: all of selection_*
falsepositives:
- Legitimate command line usage by administrators or security tools
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious Kerberos ticket requests initiated from command-line interfaces, specifically those attempting to invoke the `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` class. The likely attacker objective is to exploit service account credentials to obtain Kerberos tickets, potentially facilitating credential theft through techniques such as Kerberoasting or silver ticket attacks. This behavior aligns with the MITRE ATT&CK technique T1558.003 (Steal or Forge Kerberos Tickets).

  The primary telemetry sources include process creation logs from Windows (Event ID 4688 or Sysmon Event ID 1). If this behavior is malicious, it could lead to unauthorized access to sensitive resources and privilege escalation within the environment. It is crucial to note that the detection does NOT confirm that the tickets have been successfully obtained or misused; it only indicates an attempt to utilize a known attack vector.

  ### Investigation Steps

  - **Correlate event IDs**: Review Security Event ID 4688 or Sysmon Event ID 1 for the command execution log containing `System.IdentityModel.Tokens.KerberosRequestorSecurityToken`. Determine if the execution context aligns with suspicious or unauthorized user accounts.

  - **Analyze command line arguments**: Inspect the full command line used. Look for obfuscation or unusual patterns, and validate if the arguments map to legitimate administrative functions or known automation tasks.

  - **Identify normal user activities**: Verify legitimate administrative usage patterns of PowerShell or pwsh.exe. Check if authorized personnel regularly interact with Kerberos ticket requests for routine operations.

  - **Check associated user account activity**: Investigate the user account that executed the command. Review logon patterns and recent activities (Event ID 4624) to ensure they align with expected behavior and do not raise red flags.

  - **Capture the output of the Kerberos request**: If the telemetry allows, gather any outputs or logs from that command execution—this may help identify unauthorized attempts to extract Kerberos tickets.

  - **Assess impact on sensitive systems**: Determine if the affected assets are critical (e.g., domain controllers, servers hosting sensitive applications). Increased scrutiny is warranted on systems that manage authentication.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems and the likelihood of exploitation by adversaries. The behavior of issuing Kerberos ticket requests is a well-known technique used in attacks, making it a common vector for credential theft.

  ### Blind Spots and Assumptions

  Detection relies on the available logging of process creation; if logs are not correctly configured or preserved, malicious activity may go undetected. Legitimate administrative actions and certain automated security tools could trigger similar alerts, leading to possible false positives. Companion detections related to Kerberos ticket validation failures or unauthorized access attempts (e.g., Event ID 4776 or TGS requests) can strengthen overall monitoring for related credential abuse.

