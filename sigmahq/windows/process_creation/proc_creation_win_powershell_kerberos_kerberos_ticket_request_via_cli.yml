note: |
  ### Technical Context

  This rule detects the suspicious use of the `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` class via command line to request Kerberos tickets, an activity often indicative of Kerberoasting or silver ticket attacks. Attackers may exploit this technique to gain access to service accounts, allowing them to attempt offline password cracking.

  The relevant MITRE ATT&CK technique is **T1558.003: Credentials from Kerberos Ticket Granting Ticket**. The primary telemetry source for this detection is Windows process creation logs, specifically focusing on PowerShell executions. If malicious, this behavior poses a significant security impact, potentially compromising sensitive accounts and enabling further lateral movement within the network.

  This detection does NOT confirm a breach on its own; legitimate administrative tasks may also trigger this rule, necessitating further investigation.

  ### Investigation Steps

  - **Check Process Creation Events:**
    Review Security Event ID 4688 for process creation logs where the image path is either `powershell.exe` or `pwsh.exe`, filtering for `CommandLine` containing `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` and `.GetRequest()`.

  - **Analyze Command Line Parameters:**
    Inspect the full command line provided in the logs to validate intended use cases; look for indication of known tools or strings that align with administrative functions versus potential misuse.

  - **Identify User Context:**
    Correlate the user ID associated with the ticket request to ascertain legitimacy; check if the user belongs to an administrative group or if the action is consistent with their role.

  - **Validate Event Frequency:**
    Assess if multiple similar requests occur in a short timeframe. A high volume of Kerberos ticket requests from a single user could indicate automated attack behavior.

  - **Examine Related Logs for Anomalies:**
    Look into authentication logs (e.g., Security Event ID 4624) that correspond with the process creation timestamps to verify if the requests resulted in successful authentications to sensitive systems.

  - **Identify Expected Behavior:**
    Understand legitimate use cases of PowerShell for service account management within your environment; document typical commands for reference to differentiate between benign and malicious activities.

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on critical systems and the likelihood of being weaponized for credential theft. The ability to request tickets for privileged accounts can provide attackers enhanced access to system resources, amplifying their foothold.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate administrative command line usage is common, possibly leading to false positives. Ensure that logging is configured correctly for process creation, particularly for PowerShell commands. It's also important to take into account that legitimate administrator uses may trigger this alert. Companion detections that can provide additional context include monitoring for unusual Kerberos ticket granting or TGT requests in Security Event ID 4769, which track when service tickets are requested.

