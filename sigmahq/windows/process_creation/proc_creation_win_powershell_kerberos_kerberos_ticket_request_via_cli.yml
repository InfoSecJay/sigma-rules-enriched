note: |
  ### Technical Context
  This rule is designed to detect potentially malicious requests for Kerberos tickets made via the command line using the `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` class. Threat actors may exploit legitimate administrative tools and commands to initiate these requests, targeting service accounts for offline password cracking (known as Kerberoasting) or executing silver ticket attacks. Such actions are typically aimed at gaining unauthorized access to sensitive resources or maintaining persistence within the network.

  Relevant MITRE ATT&CK techniques include **T1558.003 - Use of alternative authentication material** related to Kerberos ticket manipulation. This technique covers the abuse of service account credentials to access or escalate privileges. The primary data source for this detection relies on Windows process creation logs, which will provide details about the execution of command line statements that make suspicious Kerberos ticket requests.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation events for any instances of `powershell.exe` or `pwsh.exe`, particularly those that include the command line parameters related to `System.IdentityModel.Tokens.KerberosRequestorSecurityToken`.

  - **Examine Command Line Arguments:** Focus on command lines that contain `System.IdentityModel.Tokens.KerberosRequestorSecurityToken` and `.GetRequest()`. Pay attention to the context in which these commands were executed, particularly their execution time and user account.

  - **Correlate with User Activities:** Investigate the user accounts associated with these command line actions. Check if they are administrative accounts or service accounts and whether their behavior is consistent with normal operational patterns.

  - **Look for Unusual Timing:** Pay special attention to the timing of the commands. Requests made during off-hours or from unexpected systems may indicate malicious activity.

  ### Prioritization
  This alert should be treated with high priority, as the ability to request Kerberos tickets via command line indicates a potential compromise of service account credentials, which can lead to extensive unauthorized access and privilege escalation within the environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate administrative activities that may also trigger this rule, such as normal usage by security tools or authorized personnel. The detection logic assumes that all malicious Kerberos requests will utilize the specified command line constructs, which may not always be the case. Additionally, the effectiveness of this rule relies on comprehensive logging of process creation events; if these logs are not enabled or retained, detection will be compromised.

