note: |
  ### Technical Context

  This Sigma rule detects the potentially suspicious execution of the `PDQDeployRunner` process. Malicious actors may leverage this process to remotely execute commands or payloads on compromised systems, aiming to deploy malware or conduct further exploitation. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), with techniques such as **Command and Scripting Interpreter** (T1059) and **Remote Services** (T1021). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1.

  If the behavior is malicious, it could lead to unauthorized access and remote code execution on critical systems. However, this detection alone does not confirm malicious intent; legitimate administrative use of PDQDeploy for software deployment tasks can trigger the same alerts.

  ### Investigation Steps

  - **Assess the parent process: ** Check the parent process of `PDQDeployRunner` using Event ID 4688. If the parent is a legitimate admin tool or service related to PDQDeploy, it may indicate benign activity. Otherwise, it could signify malicious behavior.

  - **Review command line arguments: ** Analyze the command line of the detected `PDQDeployRunner` invocation for presence of suspicious keywords such as `-decode`, `http`, or `iex`. These are high-confidence indicators of potential misuse.

  - **Inspect execution path: ** Verify the file execution path and look for processes executing from uncommon directories like `C:\ProgramData\`, `C:\Users\Public\`, or `C:\Windows\TEMP\`. Executions from these locations often indicate potential misuse.

  - **Examine related event logs: ** Cross-reference Windows Security Event ID 4624 (logon events) for any unusual logon patterns around the time of the alert to identify potentially compromised accounts initiating unauthorized commands through PDQDeploy.

  - **Document legitimate usage patterns: ** Identify specific authorized user accounts and legitimate scheduled tasks that may use `PDQDeployRunner`. Confirm these against your findings to distinguish benign use from actual threats.

  - **Monitor for accomplice actions: ** Investigate any additional logs, such as Windows Firewall logs or Sysmon Event ID 3 (network connections), for suspicious outbound traffic post-execution. This could indicate subsequent malicious activity.

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized remote code execution on critical systems. While the use of PDQDeploy is common among administrators for deploying updates, the likelihood of malicious misuse through this vector warrants closer inspection due to its alignment with known attacker tactics.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of advanced evasion techniques such as the use of legitimate credentials for access or executing from trusted paths. Dependencies on clear visibility into process creation logs are essential for reliable detection of suspicious activity. Legitimate activities, such as scheduled updates or administrative scripting, may inadvertently trigger the detection. A related detection to enhance coverage would be monitoring for unusual lateral movement patterns, specifically looking at the execution of other commonly abused Windows processes that could be invoked by `PDQDeployRunner`.

