title: Potentially Suspicious Execution Of PDQDeployRunner
id: 12b8e9f5-96b2-41e1-9a42-8c6779a5c184
related:
- id: d679950c-abb7-43a6-80fb-2a480c4fc450
  type: similar
status: test
description: Detects suspicious execution of "PDQDeployRunner" which is part of the
  PDQDeploy service stack that is responsible for executing commands and packages
  on a remote machines
references:
- https://twitter.com/malmoeb/status/1550483085472432128
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-22
modified: 2024-05-02
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains: '\PDQDeployRunner-'
  selection_child:
        # Improve this section by adding other suspicious processes, commandlines or paths
  - Image|endswith:
              # If you use any of the following processes legitimately comment them out
    - '\bash.exe'
    - '\certutil.exe'
    - '\cmd.exe'
    - '\csc.exe'
    - '\cscript.exe'
    - '\dllhost.exe'
    - '\mshta.exe'
    - '\msiexec.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\scriptrunner.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    - '\wsl.exe'
  - Image|contains:
    - ':\ProgramData\'
    - ':\Users\Public\'
    - ':\Windows\TEMP\'
    - '\AppData\Local\Temp'
  - CommandLine|contains:
    - ' -decode '
    - ' -enc '
    - ' -encodedcommand '
    - ' -w hidden'
    - 'DownloadString'
    - 'FromBase64String'
    - 'http'
    - 'iex '
    - 'Invoke-'
  condition: all of selection_*
falsepositives:
- Legitimate use of the PDQDeploy tool to execute these commands
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious execution activities involving the `PDQDeployRunner`, a component of the PDQDeploy service used for executing commands and deploying software on remote machines. Attackers may exploit PDQDeploy's legitimate functionalities to execute malicious payloads or scripts, leveraging the tool's trusted status to bypass security measures and establish unauthorized persistence within an enterprise environment. Common objectives include lateral movement, system compromise, and the deployment of additional malware.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (TA0002)**: This tactic involves the execution of any process or code, including potential malicious scripts.
  - **Command and Control (TA0011)**: Suspicious command lines containing networking components may indicate attempts to reach a command and control server.

  Primary data sources for this detection rule include:
  - **Process Creation Events**: Logs capturing the execution of processes on endpoints, detailing their origins and command lines.
  - **Windows Security Logs**: These may provide insights into user activity and any anomalies related to usage patterns.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs to identify instances of `PDQDeployRunner` launching suspicious child processes. Look for any non-standard execution paths or command line arguments associated with known system administration tools.
  - **Correlate with Network Activity**: Investigate network logs for any external connections initiated by processes spawned from `PDQDeployRunner`, especially those involving encoded commands or obfuscated scripts.
  - **Examine Parent Processes**: Trace back to the parent processes that launched `PDQDeployRunner`. Identify the user context and verify if the execution aligns with legitimate administrative activities.
  - **Conduct Threat Hunting**: Utilize threat intelligence sources to investigate any known misuse cases related to `PDQDeployRunner`. Cross-reference with existing alerts for proactive identification of similar techniques in the environment.

  ### Prioritization
  The alert is rated as medium severity due to the potential for significant impact if attackers leverage legitimate tools like PDQDeploy for malicious purposes, which could lead to unauthorized access and system compromise. The likelihood is increased in environments with frequent use of the tool for software deployment and automation.

  ### Blind Spots and Assumptions
  Potential blind spots include environments that may not fully log all process creation events or where PDQDeploy is extensively used for legitimate purposes, making it challenging to distinguish between benign and malicious activity. The detection assumes that logs for parent-child process relationships are enabled and comprehensive, along with command line arguments being captured accurately. Required configurations for this alert to function effectively include proper logging settings within Windows Security Policy and any oversight mechanisms for legitimate tool usage.

