title: Forfiles.EXE Child Process Masquerading
id: f53714ec-5077-420e-ad20-907ff9bb2958
status: test
description: |
  Detects the execution of "forfiles" from a non-default location, in order to potentially spawn a custom "cmd.exe" from the current working directory.
references:
- https://www.hexacorn.com/blog/2023/12/31/1-little-known-secret-of-forfiles-exe/
author: Nasreddine Bencherchali (Nextron Systems), Anish Bogati
date: 2024-01-05
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Notes:
        #   - The parent must not have CLI options
        #   - The Child Image must be named "cmd" as its hardcoded in the "forfiles" binary
        #   - The Child CLI will always contains "/c echo" as its hardcoded in the original "forfiles" binary
    ParentCommandLine|endswith:
    - '.exe'
    - '.exe"'
    Image|endswith: '\cmd.exe'
    CommandLine|startswith: '/c echo "'
  filter_main_parent_not_sys:
    ParentImage|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    ParentImage|endswith: '\forfiles.exe'
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    Image|endswith: '\cmd.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `forfiles.exe` from a non-standard location, spawning a child process named `cmd.exe` intended to execute commands, typically with a `/c echo` parameter. This behavior suggests a potential attempt at command execution or evasion, as attackers may leverage unusual command paths to avoid detection. The relevant MITRE ATT&CK technique is T1036: Masquerading, specifically targeting defenses that filter against known executables.

  The primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it could indicate an adversary attempting to execute arbitrary commands or scripts without triggering standard security mechanisms. Importantly, this detection on its own does not confirm malicious intent; legitimate uses of `forfiles` with expected command parameters could also trigger the rule.

  ### Investigation Steps

  - **Review process creation events**: Check Security Event ID 4688 for the suspicious instance of `forfiles.exe` alongside its parent process. Look for unusual parent command lines absent of CLI options to identify potential evasion techniques.

  - **Verify command-line arguments**: Examine the command-line for `cmd.exe`, specifically looking for instances that start with `/c echo`. If the echoed output appears consistent with legitimate administrative activity (e.g., standard output messages), it may indicate benign usage.

  - **Inspect file paths**: Validate the file paths against known default locations for `forfiles.exe`. Any execution from non-standard directories, such as user directories or temporary folders (such as `C:\Users\[User]\Temp`), should be flagged as a high-confidence indicator of malicious activity.

  - **Cross-reference with known benign activities**: Identify typical legitimate use cases of `forfiles.exe` in your environment. If a user account matches those patterns while executing `forfiles.exe`, it may reduce the threat level.

  - **Examine associated GUI activity**: Look for corresponding user interface interactions or file manipulations concurrent with the execution of `forfiles.exe`. Authentic processes may include specific file creation or moves, altering typical workflow patterns.

  ### Prioritization

  This alert is considered high severity due to the potential for malicious command execution. Systems affected may include critical endpoints, increasing the likelihood of significant adverse impact. Furthermore, the use of `forfiles.exe` in an atypical manner reflects behavior that could be leveraged for evasion in various attack vectors.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases that execute `forfiles.exe` from unexpected locations. Adequate logging configurations must be in place, such as enabling detailed process creation logging via Sysmon, to ensure comprehensive visibility. Legitimate administrative scripts may occasionally generate similar alert patterns. A related detection to strengthen coverage would involve monitoring for unusual command execution patterns associated with `powershell.exe`, which is commonly used alongside evasion tactics.

