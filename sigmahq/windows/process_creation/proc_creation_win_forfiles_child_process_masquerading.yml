title: Forfiles.EXE Child Process Masquerading
id: f53714ec-5077-420e-ad20-907ff9bb2958
status: test
description: |
  Detects the execution of "forfiles" from a non-default location, in order to potentially spawn a custom "cmd.exe" from the current working directory.
references:
- https://www.hexacorn.com/blog/2023/12/31/1-little-known-secret-of-forfiles-exe/
author: Nasreddine Bencherchali (Nextron Systems), Anish Bogati
date: 2024-01-05
tags:
- attack.stealth
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Notes:
        #   - The parent must not have CLI options
        #   - The Child Image must be named "cmd" as its hardcoded in the "forfiles" binary
        #   - The Child CLI will always contains "/c echo" as its hardcoded in the original "forfiles" binary
    ParentCommandLine|endswith:
    - '.exe'
    - '.exe"'
    Image|endswith: '\cmd.exe'
    CommandLine|startswith: '/c echo "'
  filter_main_parent_not_sys:
    ParentImage|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    ParentImage|endswith: '\forfiles.exe'
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    Image|endswith: '\cmd.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of "forfiles.exe" from a non-default location, which may be leveraged by an attacker to spawn a malicious instance of "cmd.exe" from the current working directory. The likely objective of this behavior is to perform stealthy command execution while evading detection mechanisms. This activity aligns with the MITRE ATT&CK tactic of "Defense Evasion" (T1036), specifically focusing on the technique of "Masquerading".

  The primary telemetry sources for this detection are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which capture details about processes being created. If malicious, this could lead to further exploitation or data exfiltration. It's crucial to note that this detection alone does not confirm malicious intent; legitimate uses of "forfiles.exe" may occur in the environment under specific administrative tasks.

  ### Investigation Steps

  - **Check creation of cmd.exe:** Review Security Event ID 4688 for the creation of "cmd.exe" from any non-standard path. Look for event log entries where the Image field does not contain "C:\Windows\System32\cmd.exe" or "C:\Windows\SysWOW64\cmd.exe".

  - **Verify parent process:** Identify and analyze the parent process for the cmd.exe instance by examining Event ID 4688. The ParentCommandLine field should end with ".exe" and should not contain configuration options, indicating a potential exploitation attempt.

  - **Correlate with forfiles.exe execution:** Confirm whether "forfiles.exe" was executed by collecting logs from Sysmon Event ID 1. The ParentImage field must contain "forfiles.exe" and should be initiated from a path outside the standard system directories.

  - **Review legitimate use cases:** Investigate historical usage patterns of "forfiles.exe" in the environment to understand normal operational behavior. Typical command lines will contain legitimate arguments for file manipulation tasks, differing significantly from the suspicious "/c echo" pattern observed in alerts.

  - **Look for signs of lateral movement:** Search for additional execution events following the detection. Use Sysmon Event ID 1 to correlate "cmd.exe" spawn or script execution from the same working directory, which may represent a follow-up action consistent with compromise.

  - **Assess system criticality:** If the detected behavior is occurring on critical systems (e.g., domain controllers), prioritize the investigation higher due to the potential for serious impact on overall enterprise security.

  ### Prioritization

  The alert has a high severity due to its potential impact on critical infrastructure if exploited. The likelihood of misuse is elevated as attackers often utilize legitimate tools like "forfiles.exe" to facilitate stealthy command execution. The behavior is correlated with known techniques that are increasingly weaponized in targeted attack scenarios.

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker executes "forfiles.exe" from a whitelisted or commonly used path, which could be interpreted as benign activity. It requires proper configuration of process creation logging to capture necessary information; without monitoring, events may be missed. Additionally, scheduled tasks, administrative scripts, or user-initiated processes could generate similar alert conditions, complicating triage. Companion detections focusing on unusual process hierarchies or rapid cmd.exe execution may strengthen overall coverage and context understanding.

