  ---

  ### Technical Context

  This Sigma rule detects instances where `rundll32.exe` is spawning `explorer.exe` as a child process. This behavior is atypical and often indicates malicious activity, such as the execution of malware like Gamarue, which abuses the `rundll32` process to launch Explorer in a way that aligns with evasion tactics. The relevant MITRE ATT&CK technique is **"Malicious Payload Execution via DLL Side-Loading" (T1218.011)**. The primary telemetry sources for detection include process creation logs, specifically monitoring Windows Event ID **4688** (Process Creation) or Sysmon Event ID **1** (Process Creation).

  If the detected behavior is indeed malicious, it could result in unauthorized access and control over the affected system. However, this detection does NOT confirm that the activity observed is definitively malicious without further context; benign applications or scripts could utilize similar methods.

  ---

  ### Investigation Steps

  - **Review process creation events**: Look at Windows Event ID **4688** or Sysmon Event ID **1** for the specific instance of `explorer.exe` being spawned by `rundll32.exe`. Examine fields such as `ParentImage`, `Image`, and `CommandLine` to confirm this unusual parent-child relationship.

  - **Check the Parent Command Line**: Ensure the `ParentCommandLine` includes `\shell32.dll,Control_RunDLL`. If this specific string is present, it suggests a higher potential for malicious intent, especially if seen in an unexpected context.

  - **Identify other child processes spawned**: Cross-reference any additional processes that are subsequently spawned by `explorer.exe` after this invocation. Malicious executions often follow the initial spawn with other malicious indicators.

  - **Examine system context**: Determine the role and criticality of the host system where this behavior occurred. For instance, if this process behavior is observed on a domain controller or production server, it could signify a higher risk of impactful compromise.

  - **Evaluate historical logs for patterns**: Investigate previous occurrences of similar process creation activity on the host and network to establish a baseline of expected behavior versus anomalous spikes that could highlight malicious patterns.

  - **Consider user activity context**: Determine whether the user account associated with this activity has recently executed remote scripts or administrative tasks that could logically account for the execution of `rundll32.exe` invoking `explorer.exe`. Legitimate use might show frequent administrative tool usage.

  ---

  ### Prioritization

  This alert should be considered high-severity given the potential impact on the system, particularly if it occurs on critical infrastructure. The likelihood of malicious abuse is notable due to the uncommon nature of `rundll32` spawning `explorer.exe`. Such behavior is frequently weaponized by various malware families.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited in environments where logging for process creation is not fully configured, as passive defenses might not capture all malicious executions. Legitimate software that employs `rundll32.exe` for valid purposes may inadvertently trigger this alert, necessitating context checks. Companion detections, such as monitoring for known Gamarue signatures, could strengthen overall coverage against similar types of behavior.

