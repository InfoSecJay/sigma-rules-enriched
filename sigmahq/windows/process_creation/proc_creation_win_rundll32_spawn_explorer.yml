title: RunDLL32 Spawning Explorer
id: caa06de8-fdef-4c91-826a-7f9e163eef4b
status: test
description: Detects RunDLL32.exe spawning explorer.exe as child, which is very uncommon,
  often observes Gamarue spawning the explorer.exe process in an unusual way
references:
- https://redcanary.com/blog/intelligence-insights-november-2021/
author: elhoim, CD_ROM_
date: 2022-04-27
modified: 2022-05-25
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\rundll32.exe'
    Image|endswith: '\explorer.exe'
  filter:
    ParentCommandLine|contains: '\shell32.dll,Control_RunDLL'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the legitimate Windows process `explorer.exe` is spawned by `RunDLL32.exe`. This behavior is unusual and suggests malicious activity, often associated with the Gamarue malware family, which utilizes `RunDLL32.exe` to execute payloads and evade detection mechanisms. The primary objective of this technique is to execute malicious code in a context that is likely to bypass security measures by masquerading as a legitimate Windows process, thus allowing attackers to maintain persistence or execute additional payloads.

  Relevant MITRE ATT&CK tactics for this rule include:
  - **Defense Evasion** (ID: TA0005)
  - **MASQUERADE** (ID: T1218.011): Using legitimate processes to execute malicious actions in an attempt to circumvent security controls.

  The primary data sources that will yield the best evidence for this detection are Windows process creation logs. These logs detail command-line arguments used at the time of process creation and can provide insights into any unusual parent-child relationships among processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine detailed process creation events focusing on instances where `RunDLL32.exe` is the parent process and `explorer.exe` is the child. Look for abnormal command lines and execution contexts.
  - **Analyze Parent Command Line Arguments**: Investigate the command line used for `RunDLL32.exe`. In particular, check for any instances of `\shell32.dll,Control_RunDLL`, which is often an indicator of exploitation.
  - **Correlate with Known Threat Indicators**: Cross-reference detected events with known indicators of compromise (IoCs) related to Gamarue or similar malware to establish if this behavior aligns with previous malicious activity patterns.
  - **Investigate for Additional Malicious Artifacts**: Look for other potential compromise indicators such as unusual registry modifications, unexpected scheduled tasks, or network connections initiated by the spawned `explorer.exe` process.

  ### Prioritization
  Due to the high severity of the alert, any detection of `RunDLL32.exe` spawning `explorer.exe` should be treated as a significant threat. The unusual process parent-child relationship combined with the historical association to Gamarue warrants immediate investigation to mitigate potential data compromise or further intrusion.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility that the malicious behavior could be disguised as other benign applications using similar techniques or other process names. The detection logic assumes that the presence of `RunDLL32.exe` initiating `explorer.exe` under the specified command line indicates malicious intent. The functionality of the alert relies heavily on accurate process creation logs and their configuration; without these logs, the detection may fail to trigger. It is crucial to ensure that Windows auditing is enabled and properly configured to capture comprehensive process creation events.

