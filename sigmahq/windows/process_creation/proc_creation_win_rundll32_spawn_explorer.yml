detection:
  selection:
    ParentImage|endswith: '\rundll32.exe'
    Image|endswith: '\explorer.exe'
  filter:
    ParentCommandLine|contains: '\shell32.dll,Control_RunDLL'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where `RunDLL32.exe` spawns `explorer.exe` as a child process. This behavior is atypical and often indicates malicious activity, such as the execution of malware like Gamarue, which may use this method to run arbitrary code or drop payloads. The likely attacker objective is to leverage familiar processes to masquerade malicious activities, evading security scrutiny.

  This detection aligns with the MITRE ATT&CK technique T1218.011 (Signed Binary Proxy Execution: RunDLL32). The primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1). If this behavior is malicious, it may lead to unauthorized access or control over the system, data exfiltration, or installation of additional malware. Importantly, this detection alone does not confirm malicious intent; it must be corroborated with additional evidence.

  ### Investigation Steps

  - **Verify process creation events:** Check for Security Event ID 4688 and Sysmon Event ID 1 on the affected host for `explorer.exe` and `RunDLL32.exe`. Confirm the process hierarchy and commands used during execution.

  - **Examine parent command line:** Analyze the `ParentCommandLine` for the presence of `\shell32.dll,Control_RunDLL`. Malicious instances will show this command, whereas benign behavior would likely not invoke `RunDLL32` with this parameter.

  - **Review recent system changes:** Review system logs for any recent installations or update events. Legitimate administrative tasks, such as system configuration changes via the Control Panel, may invoke `explorer.exe` in normal contexts.

  - **Check for known malware indicators:** Investigate if the process path of `RunDLL32.exe` deviates from typical Windows directories (e.g., `C:\Windows\System32`). Look for malicious indicators by cross-referencing the file hash against threat intelligence databases.

  - **Assess the execution context:** Determine if the alert occurred on high-value assets, such as domain controllers or endpoints handling sensitive information. Malicious activities on these systems would carry greater risk.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical systems and the likelihood of malicious intent associated with unusual `RunDLL32.exe` behavior. Malicious actors often exploit such techniques, making it a commonly weaponized tactic.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain logs or configurations, such as not having Sysmon installed for detailed process creation logs. Legitimate administrative tools or scripts may spawn `explorer.exe` using `RunDLL32`, leading to false positives. A related detection rule for monitoring `RunDLL32.exe` calls to other processes (e.g., `cmd.exe`, `powershell.exe`) expands coverage for this type of stealth behavior.

