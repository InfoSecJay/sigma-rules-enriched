  ---

  ### Technical Context

  This Sigma rule detects instances where `RunDLL32.exe` is spawning the `explorer.exe` process, which is atypical and often indicates malicious behavior, such as malware like Gamarue attempting to create a persistence mechanism or execute commands using the Explorer shell. The likely attacker objective is to leverage the trusted `explorer.exe` process to execute further malicious actions without raising suspicion. This behavior aligns with the MITRE ATT&CK technique T1218.011 (System Binary Proxy Execution: RunDLL32). The primary telemetry source for this detection is Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing both the parent and child process relationships.

  If confirmed malicious, the security impact could include system compromise, data exfiltration, or lateral movement. However, it is important to emphasize that this detection does NOT confirm that the activity is inherently malicious on its own; further investigation is required to understand the context.

  ---

  ### Investigation Steps

  - **Check parent process details: ** Investigate `Security Event ID 4688` or `Sysmon Event ID 1` for the creation of `explorer.exe`. Verify the `ParentProcessId`, `ParentImage`, `CommandLine`, and `User` fields to identify if the activity stems from a legitimate source.

  - **Examine command line arguments:** Review the `CommandLine` field of the `explorer.exe` event for indications that it was spawned with arguments involving `shell32.dll,Control_RunDLL`. Legitimate usages would typically not include these specific parameters.

  - **Identify malicious indicators:** Look for parent processes that are known to be associated with malware (e.g., suspicious `RunDLL32.exe` paths or unusual command-line arguments). Investigate if the parent command line shows signs of obfuscation or common malware patterns.

  - **Review recent system changes:** Correlate with `Windows Event ID 4616` to assess any changes in system time or `Event ID 4608` for system startup events that occurred around the same time, which may indicate abnormal or malicious activity.

  - **Analyze asset criticality:** For affected endpoints, determine whether they are handling sensitive data or possess elevated privileges. High-risk systems require immediate escalation to Tier 2 or Tier 3 for deeper analysis.

  - **Investigate legitimate usage:** Recognize that `RunDLL32.exe` may be utilized by system administrators for legitimate tasks. Validate if other non-malicious `RunDLL32.exe` activity correlates with operational tasks conducted by authorized users.

  ---

  ### Prioritization

  This alert should be considered high severity given the potential for widespread malicious activities, especially if the affected system has administrative privileges or contains sensitive data. The uncommon behavior of `RunDLL32.exe` spawning `explorer.exe` raises the likelihood of malicious abuse, and such exploitation techniques are frequently weaponized in various attack vectors.

  ---

  ### Blind Spots and Assumptions

  Detecting this behavior can be limited by the potential for evasion tactics, such as the process being modified to hide or obfuscate the true command line. Required log sources include an appropriate configuration for process creation logging, specifically enabling Sysmon or monitoring Windows Event logs. Legitimate administrative tasks may also trigger this alert, such as remote desktop sessions or software installations. A related detection to consider would be tracking unusual `RunDLL32.exe` executions in isolation, as this would provide additional context for potential malicious behavior.

