title: Potential Remote Desktop Tunneling
id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
status: test
description: Detects potential use of an SSH utility to establish RDP over a reverse
  SSH Tunnel. This can be used by attackers to enable routing of network packets that
  would otherwise not reach their intended destination.
references:
- https://www.elastic.co/guide/en/security/current/potential-remote-desktop-tunneling-detected.html
author: Tim Rauch, Elastic (idea)
date: 2022-09-27
tags:
- attack.lateral-movement
- attack.t1021
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: ':3389'     # RDP port and usual SSH tunneling related switches in command line
  selection_opt:
    CommandLine|contains:
    - ' -L '
    - ' -P '
    - ' -R '
    - ' -pw '
    - ' -ssh '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to establish Remote Desktop Protocol (RDP) communications over reverse SSH tunnels, which can indicate malicious activity aimed at circumventing traditional network defenses. Attackers may use SSH utilities to create reverse tunnels that allow them to control compromised systems or access sensitive environments remotely. By leveraging this technique, attackers can facilitate lateral movement within a network, potentially gaining access to high-value targets or sensitive data without triggering typical alert mechanisms.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Lateral Movement** (TA0008) and **Remote Services** (T1021). The specific focus on SSH tunneling over RDP aligns with the need for a stealthy approach to network communication, minimizing the chances of detection by security monitoring tools. The primary data sources for this detection include **process creation events** from Windows endpoints, which will log the execution of commands indicating potential tunneling activity.

  ### Investigation Steps
  - **Review Processes:** Examine recent process creation logs for entries that include SSH commands or references to RDP, particularly those containing parameters related to port 3389 or SSH tunneling flags (e.g., `-L`, `-R`, `-P`).
  - **Analyze Network Traffic:** Inspect network logs for unusual outbound connections to external IPs on port 3389, especially focusing on traffic patterns that suggest tunneling or unexpected communication with external services.
  - **Check for Compromised Accounts:** Investigate the user accounts associated with the detected processes to determine if they exhibit signs of compromise or misuse, paying special attention to accounts with elevated privileges.
  - **Correlate with Other Alerts:** Look for other related security alerts indicating lateral movement or unauthorized access attempts within the environment to build a broader context of the incident.

  ### Prioritization
  This alert should be treated as medium severity due to its potential implications for network security. The effectiveness of an SSH tunnel can enable persistent access and command-control activities, heightening the overall risk of data breaches or system compromise.

  ### Blind Spots and Assumptions
  The detection logic relies on the presence of adequate process creation logging and assumes that the environment does not have legitimate uses for SSH tunneling or RDP over SSH configured. There may be gaps in detection if the logs are not being collected consistently or if command-line arguments vary significantly in benign contexts. Additionally, reliance on command-line patterns assumes that attackers will use predictable flags, which can lead to undetected misuse if they employ obfuscation techniques. Ensuring complete logging of process creation events is crucial for effective detection and response.

