title: Potential Remote Desktop Tunneling
id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
status: test
description: Detects potential use of an SSH utility to establish RDP over a 
  reverse SSH Tunnel. This can be used by attackers to enable routing of network
  packets that would otherwise not reach their intended destination.
references:
- https://www.elastic.co/guide/en/security/current/potential-remote-desktop-tunneling-detected.html
author: Tim Rauch, Elastic (idea)
date: 2022-09-27
tags:
- attack.lateral-movement
- attack.t1021
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: ':3389'     # RDP port and usual SSH tunneling related switches in command line
  selection_opt:
    CommandLine|contains:
    - ' -L '
    - ' -P '
    - ' -R '
    - ' -pw '
    - ' -ssh '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the invocation of SSH utilities that establish a remote desktop protocol (RDP) connection via a reverse SSH tunnel. This tunneling mechanism may enable attackers to bypass network restrictions or firewall rules, facilitating lateral movement within the network. The likely objective is to maintain persistent access to a compromised environment or to access sensitive systems that are not directly exposed to the internet.

  The relevant MITRE ATT&CK techniques include Lateral Movement (T1021), specifically targeting the use of Remote Desktop Protocol (T1021.001). The primary telemetry sources are Windows process creation logs. Key log types to monitor are Security Event ID 4688, which shows command execution, and the Sysmon Event ID 1. If left unchecked, this behavior can enable unauthorized access to critical systems, leading to data exfiltration or network compromise. It is important to note that this detection alone does not confirm malicious intent; it merely indicates that an SSH utility command related to RDP was executed.

  ### Investigation Steps

  - **Identify the command line execution:** Look for Security Event ID 4688 or Sysmon Event ID 1. Check the **CommandLine** field for strings including ':3389', '-L', '-R', or '-ssh'.

  - **Validate the process and user context:** Check the **Process Name** field for known SSH utilities (e.g., `ssh.exe`, `putty.exe`). Validate whether the user account running the command has permission to access RDP services on the target machine.

  - **Review the connection attempt:** Investigate networking logs (e.g., firewall logs) for outbound connections to determine if the targets specified in the command line are reachable. Alert for connections made to atypical internal hosts or ports.

  - **Determine legitimate usage:** Check for active remote desktop connections on affected systems. Analyze if any known business processes are using SSH for legitimate purposes or if the method of access is documented and authorized.

  - **Identify suspicious patterns:** Look for additional command line parameters that are unusual (e.g., usage of '-pw' with a hardcoded password). Any command execution that combines multiple tunneling flags should be flagged as a strong indicator of malicious intent.

  ### Prioritization

  This alert should be treated with medium priority. While the impact can scale based on the access level of the affected system, the likelihood of malicious exploitation is significant due to the common use of SSH tunneling in lateral movement attacks. The behavior detected is frequently weaponized by adversaries during network intrusion phases.

  ### Blind Spots and Assumptions

  Detection may be limited if SSH utilities are obfuscated or executed in a different context, thereby evading logging mechanisms. Reliable detection requires configured access to detailed process creation logs (both Event ID 4688 and Sysmon). Legitimate activities, such as remote server maintenance or support tasks, may trigger the alert. A companion detection that strengthens coverage would involve monitoring for unusual or unauthorized RDP sessions themselves, particularly in conjunction with SSH tunnel usage.

