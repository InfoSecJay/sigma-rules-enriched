note: |
  ### Technical Context

  This Sigma rule detects instances of User Account Control (UAC) bypass via the execution of `wsreset.exe` at high or system integrity levels. An attacker may employ this technique to elevate privileges without triggering user account control prompts, potentially gaining broader access to system resources. This behavior relates to the MITRE ATT&CK technique for UAC Bypass (ID: T1548.002) under the Defense Evasion tactic.

  The primary telemetry sources include Windows process creation logs, particularly Windows Security Event ID 4688 and Sysmon Event ID 1. Malicious execution of this behavior can lead to unauthorized privilege escalation, allowing attackers to execute further malicious actions or access sensitive data. Importantly, this detection does NOT confirm an active compromise on its own; it may simply indicate a legitimate application performing expected actions under high integrity levels.

  ### Investigation Steps

  - **Check process details for wsreset.exe:** Review Event ID 4688 (Process Creation) and Sysmon Event ID 1 logs for the command line used to initiate `wsreset.exe`. Legitimate usage typically involves low integrity and may not invoke a high integrity level.

  - **Analyze user context of process execution:** Verify the account that executed `wsreset.exe` using fields like `NewProcessUser` in the logs. Be suspicious if it was initiated by a non-administrative or unexpected user account, especially on a system-wide scale.

  - **Examine integrity levels:** Assess the `IntegrityLevel` field in the logs. If `wsreset.exe` runs at System (S-1-16-16384) or High (S-1-16-12288) levels, this may indicate malicious intent, as typical usage does not require such permissions.

  - **Identify associated parent processes:** Investigate parent-child relationships in the process execution tree using the `ParentProcessId` field in the logs. Unusual parent processes, especially those originating from user tools or scripts, warrant further scrutiny.

  - **Check for repeated executions:** Look for multiple executions of `wsreset.exe` in a short timespan (consider monitoring over the last 24 hours). Repeated high integrity executions can be indicative of an automated attack or a script used by an adversary to maintain or establish persistence.

  ### Prioritization

  This alert is of high severity due to the potential for privilege escalation on sensitive systems. The likelihood of malicious abuse is significant given the common use of UAC bypass techniques in recent exploits. Such behavior is often leveraged in targeted attacks, raising the urgency for thorough investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for attackers to mask their activities by employing legitimate software in a way that does not trigger alerts. The effective monitoring of this behavior relies on consistent logging of process creation events via Security Event IDs 4688 and Sysmon configurations. Legitimate administrative tasks, like system updates or troubleshooting, may unknowingly trigger this alert. A companion detection to consider is monitoring for abnormal command-line arguments associated with common binaries, enhancing detection capabilities for potential misuse patterns.

