note: |
  ### Technical Context
  This detection rule identifies instances of User Account Control (UAC) bypass through the usage of `WSReset.exe`, a legitimate Windows executable often exploited to gain elevated privileges without user consent. UAC is a security feature in Windows designed to prevent unauthorized changes to the operating system, and bypassing it is a common tactic for attackers aiming to execute malicious payloads with escalated privileges. The suspected threat family likely includes sophisticated adversaries employing UAC bypass techniques to install malware or establish persistence within the affected system.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **T1068**: Exploitation of Elevation Control Mechanism (UAC Bypass)
  - **T1548.002**: Abusing Elevation Control via Exploitation of UAC

  Primary data sources for effective detection encompass process creation events logged by Sysmon, which can capture comprehensive details about executed processes, their integrity levels, and associated parent processes. Analysis of these logs is critical in contextually differentiating legitimate system activities from potentially malicious ones.

  ### Investigation Steps
  - **Examine Process Creation Logs**: Review Sysmon logs or Windows Event Logs for creation events of `wsreset.exe`, particularly filtering for instances where the integrity level is marked as 'High' or 'System'.

  - **Analyze Parent Process Relationships**: Investigate the parent process of flagged `wsreset.exe` executions to establish if they originated from suspicious or unexpected sources, such as malware or other scripts.

  - **Correlate with UAC Events**: Look for related User Account Control events to determine if there were any prior legitimate prompts that would normally require user interaction. A lack of such events in conjunction with the detection could indicate malicious activity.

  - **Review User Actions**: Assess user activity leading up to the detection, particularly if they coincide with sessions that have installation or modification of software. This can help identify lifestyle patterns that may suggest misuse or even compromised accounts.

  ### Prioritization
  Given that UAC bypass exploits are often used to facilitate further malicious activity, including privilege escalation or malware delivery, this alert bears a **high severity** level in an enterprise environment. Timely response is critical to mitigate potential impacts on system integrity and data confidentiality.

  ### Blind Spots and Assumptions
  This detection logic may not capture all potential UAC bypass events, particularly if attackers utilize variations of `wsreset.exe` or other legitimate binaries for their exploits. It assumes that Sysmon is properly configured to log process creation events with sufficient detail. Additionally, any environments not employing Sysmon or those not logging the relevant event IDs may miss these critical indicators of compromise. Regular reviews of logging configurations are necessary to ensure the efficacy of this detection.

