note: |
  ### Technical Context

  This Sigma rule detects potential User Account Control (UAC) bypasses via the execution of `wsreset.exe` with elevated integrity levels. Attackers may leverage this behavior to execute malicious payloads while bypassing UAC restrictions, aiming to gain higher privileges or execute code in the context of a trusted process. The relevant MITRE ATT&CK tactic is **Privilege Escalation**, specifically the technique **T1548.002: Bypass User Account Control**.

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events along with their integrity levels. If malicious, this activity could lead to a compromised system with the ability to perform unauthorized actions or access sensitive data. However, this detection does NOT confirm that any malicious activity occurred on its own, as legitimate applications may also exhibit similar behavior.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for any occurrences of `wsreset.exe` being executed with High or System integrity levels. Look for the command line arguments to identify any unusual activity.

  - **Identify Legitimate Usage**: Cross-reference the execution of `wsreset.exe` with business processes. Determine if the execution aligns with expected user behaviors, such as a user resetting the Windows Store cache, which does not typically require elevated privileges.

  - **Analyze Parent Process Relationships**: Investigate the parent process of `wsreset.exe` to identify how it was initiated (e.g., via `explorer.exe` vs. from a command line or script). A suspicious parent process might indicate potential malicious activity.

  - **Monitor Execution Frequency**: Determine how often `wsreset.exe` is invoked on the system and whether it's consistent with user or administrative operations. Frequent or automated, unauthorized use might indicate a malicious attempt to exploit the process.

  - **Investigate User Context**: Identify the user account running `wsreset.exe`. Check if this account has administrative privileges and if the execution occurred outside of normal working hours, which could point to unauthorized activity.

  - **Validate Integrity Levels**: Confirm the integrity level reported during the execution of `wsreset.exe`. Instances running with System (S-1-16-16384) or High (S-1-16-12288) levels but lacking normal justification should be treated with heightened scrutiny.

  ### Prioritization

  This alert is high-severity due to the impact on the system if UAC is bypassed, resulting in potential unauthorized access to sensitive resources. The likelihood of malicious abuse is significant, given the common exploitation of UAC bypass techniques in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques where attackers utilize different methods to invoke `wsreset.exe` without drawing attention. Reliable detection requires proper logging configurations for event IDs mentioned. Legitimate administrative tasks, such as initial setup or batch scripts, may trigger this alert, complicating false positive rates. A companion detection focusing on unusual parent-child process relationships can enhance coverage effectiveness.

