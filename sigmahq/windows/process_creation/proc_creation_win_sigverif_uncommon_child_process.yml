detection:
  selection:
    ParentImage|endswith: '\sigverif.exe'
  filter_main_werfault:
    Image:
    - 'C:\Windows\System32\WerFault.exe'
    - 'C:\Windows\SysWOW64\WerFault.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of uncommon child processes initiated by the Windows utility **sigverif.exe** (File Signature Verification), which may indicate adversaries are abusing it as a living-off-the-land (LOL) binary to spawn other potentially malicious processes. The typical attacker objective could involve evading detection by leveraging legitimate system tools to execute malware or further compromise the system. This behavior maps to the MITRE ATT&CK technique **T1216: Remote System Discovery**.

  Primary telemetry sources include Windows process creation logs, notably **Security Event ID 4688** and **Sysmon Event ID 1**, which detail process creation events. If the detected behavior is malicious, it could lead to unauthorized access, data exfiltration, or persistence in the environment. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate processes may also invoke child processes from **sigverif.exe** under normal operation.

  ### Investigation Steps

  - **Analyze child processes:**
    Check the list of child processes spawned by **sigverif.exe** using Security Event ID 4688 or Sysmon Event ID 1. Legitimate processes typically do not spawn unusual applications or scripts; look for unusual command lines or execution paths.

  - **Review execution context:**
    Correlate the timestamp of the alert with user activity. Identify the user account executing the command through Event ID 4688. Legitimate administrative tasks often involve specific applications like Powershell or CMD; any unexpected execution context should raise suspicion.

  - **Inspect process lineage:**
    Trace the process tree using Sysmon Event ID 1 to determine the lifecycle of **sigverif.exe** and its child processes. Malicious actors may invoke processes associated with malware, even disguising them as benign applications. Reference parent and child process hashes to check against known malware signatures.

  - **Check for known exploits:**
    Validate whether the detected child process matches known exploit patterns or behavior commonly associated with LOTL techniques, potentially leveraging **sigverif.exe**. Utilize threat intelligence sources for any associated indicators of compromise (IoCs) from incident reports.

  - **Determine system impact:**
    Evaluate if the affected system is critical (e.g., domain controllers, critical infrastructure).

  ### Prioritization

  This alert is of medium severity given that it indicates a potential misuse of a legitimate Windows utility to execute malicious actions. If confirmed, the ramifications could be severe, especially if the affected system holds sensitive data or critical infrastructure roles. Such behavior has been noted in prior incidents, making it a relevant consideration for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of **sigverif.exe** to validate signatures, which could generate false positives. Ensure that event logging for process creation is enabled at an appropriate level (e.g., Sysmon configuration) to provide reliable telemetry. Administrative scripts or maintenance tasks could trigger similar alerts if they invoke **sigverif.exe**. A related detection to strengthen coverage includes monitoring for common child processes typically spawned by **sigverif.exe**, such as **powershell.exe** or **cmd.exe**, alongside unusual command usages.

