note: |
  ---

  ### Technical Context

  This rule detects instances where unusual child processes are being spawned by `sigverif.exe`, a binary associated with signature verification of drivers and files on Windows systems. The potential attacker objective is to exploit this legitimate tool as a living-off-the-land (LOL) binary, allowing them to execute malicious actions covertly while appearing legitimate. This detection relates to the MITRE ATT&CK technique: Defense Evasion (T1216). The primary telemetry source for this rule is process creation logs from Windows, specifically focusing on Event ID 4688 or Sysmon Event ID 1.

  If this detection is confirmed to be malicious, it can lead to unauthorized access or execution of malicious payloads on the system, thereby potentially compromising the environment. However, this detection does not confirm intent or identity of the user; legitimate processes could be involved but exhibit similar characteristics under certain conditions.

  ---

  ### Investigation Steps

  - **Check for uncommon child processes:** Review Event ID 4688 logs for any child process spawned by `sigverif.exe`. Look for known malicious binaries or unusual executables that should not typically be executed as children of this process (e.g., `cmd.exe`, `powershell.exe`, etc.).

  - **Identify expected behavior:** Validate that legitimate activity of `sigverif.exe` typically results in spawning processes related to `WMI`, `cmd.exe` with standard scripts, or other benign diagnostic tools. Any discrepancies from this should raise further investigation.

  - **Correlate user and execution context:** Analyze the user context for the execution of `sigverif.exe` by retrieving fields like `NewProcessName` and `UserName`. If any processes are spawned while running under suspicious user accounts (e.g., service accounts executing interactive logons), this warrants deeper investigation.

  - **Review logs for WerFault events:** Check for the presence of `WerFault.exe` in the child process chain. This binary is legitimate and integral for error reporting, so its presence along with other benign child processes may suggest typical behavior rather than malicious intent.

  - **Assess host system criticality:** Identify the affected host's role (e.g., domain controller, file server, end-user workstation) to prioritize the investigation and response. Compromise on a critical server poses higher risk.

  - **Validate endpoints for other detected behavior:** Conduct a search across Sysmon logs to identify a broader context of past process creations leading to the current alert, focusing on suspicious parent-child relationships that may indicate a pattern of exploitation.

  ---

  ### Prioritization

  The severity of this alert is medium due to its potential impact on Windows environments where `sigverif.exe` is exploited. Given that this behavior is less common and could be related to evasive tactics used by adversaries, it necessitates a careful review to determine if malicious intent is present. While not commonly weaponized, legitimate uses could be misinterpreted, further complicating the assessment.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate usage patterns that could trigger the alert, such as automated resolver tools or error reporting processes that utilize `sigverif.exe`. Reliable detection requires comprehensive logging for process creation events, including Sysmon configurations to cover more executable behaviors. Additionally, common evasion tactics may include renaming or altering legitimate tools to bypass detection. Companion detections, such as monitoring for unusual PowerShell invocations or credential dumping techniques, can help validate if broader malicious activity is occurring.

