note: |
  ### Technical Context

  This rule detects the spawning of uncommon child processes from `sigverif.exe`, which typically operates as a utility for verifying the digital signatures of system drivers. An attacker may misuse `sigverif.exe` as a "living off the land" binary, using it to execute malicious code under the guise of a legitimate Windows process to evade detection. This behavior aligns with the MITRE ATT&CK technique for Uncommonly Used Command-Line Interface (CLI) and Execution Chain Tactics (T1216).

  The primary telemetry sources for this detection are the Windows process creation events, specifically capturing details from Security Event ID 4688 or Sysmon Event ID 1. If exploited maliciously, this could lead to unauthorized code execution, potentially allowing the attacker to evade security mechanisms. Importantly, this detection does NOT confirm malicious intent or compromise on its own, as there could be legitimate reasons for `sigverif.exe` to spawn child processes.

  ### Investigation Steps

  - **Check recent process activity from sigverif.exe:** Review Security Event ID 4688 logs to identify instances where `sigverif.exe` is the parent process for spawned child processes, looking specifically for unusual executables (e.g., those not typically associated with legitimate `sigverif.exe` usage).

  - **Validate compromised hosts:** Review Sysmon Event IDs 1 and 10 to investigate the characteristics of spawned child processes (e.g., command line arguments, current working directory) for suspicious or unexpected behaviors.

  - **Identify expected behavior:** Confirm typical child processes of `sigverif.exe` by cross-referencing with known benign applications, which may include standard Windows utilities. Legitimate activity typically does not invoke processes outside of a narrow set of expected binaries.

  - **Look for indicators of compromise:** Use process creation logs to validate if abnormal child processes are coupled with known malicious indicators such as `C:\Windows\System32\WerFault.exe` in suspicious contexts, often serving as a proxy for malicious activities.

  - **Assess impact of the host:** Determine the role of the affected asset within the environment (e.g., server, workstation) to gauge potential security implications for assets with elevated privileges if malicious activity is confirmed.

  ### Prioritization

  This alert should be treated as medium severity since it can indicate potential misuse of a legitimate binary to execute payloads, especially on critical systems. The impact of a successful exploitation may lead to ingress for further attacks, and the behavior detected is uncommon but could be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may be bypassed by advanced adversaries capable of masking their use of legitimate binaries. The reliability of this alert hinges on complete event logging from both the system and application-level, which must be correctly configured to capture all relevant process creation events. Legitimate software updates or maintenance routines may trigger this alert, necessitating careful review. A companion detection could include monitoring for unusual command line arguments or behaviors associated with `werfault.exe`, strengthening overall incident awareness.

