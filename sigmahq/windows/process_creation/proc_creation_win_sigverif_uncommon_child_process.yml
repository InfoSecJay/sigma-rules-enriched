detection:
  selection:
    ParentImage|endswith: '\sigverif.exe'
  filter_main_werfault:
    Image:
    - 'C:\Windows\System32\WerFault.exe'
    - 'C:\Windows\SysWOW64\WerFault.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the spawning of uncommon child processes from `sigverif.exe`, which is a utility typically associated with Microsoft’s signature verification tool. The detection focuses on identifying potentially malicious behavior where attackers may leverage `sigverif.exe` as a "living off the land" binary to execute commands or processes that are typically benign, thereby evading detection. By using legitimate system binaries for malicious purposes, attackers can manipulate the system while minimizing the risk of alerting security measures.

  The primary threat scenario involves an attacker executing malicious payloads or commands through `sigverif.exe`, possibly to validate the authenticity of files or to tamper with the system’s behavior while concealing their tracks. This activity falls squarely within the MITRE ATT&CK framework, specifically linked to the techniques of [**Defense Evasion (TA1203)**] and [**Living Off the Land Binaries (T1216)**]. Detection of such manipulation is paramount, as it directly relates to a potential compromise of system integrity.

  The most relevant telemetry sources for this detection are process creation events from Windows, which log details of newly spawned processes and their parents. These logs provide the necessary context to identify unusual parent-child relationships that could indicate malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:**: Analyze Windows process creation logs to identify other child processes spawned by `sigverif.exe`. Look for known malicious executables or unexpected scripts being executed.

  - **Examine Associated Artifacts:**: Gather and inspect any artifacts associated with the detected child processes, such as command-line arguments, file paths, and hashes of executables to determine their legitimacy.

  - **Cross-reference with Asset Inventory:**: Check the originating systems against your asset inventory to determine if `sigverif.exe` is being used legitimately. This may include validating any recent changes or IT requests that coincide with the detection time.

  - **Monitor for Further Lateral Movement:**: Look for any subsequent processes after the initial detection that may indicate lateral movement or other malicious intentions, which could include user account creation or exploitation of other system tools.

  ### Prioritization
  The alert is marked as medium severity because it implicates potential malicious activity leveraging a legitimate system utility, which can indicate advanced fraud attempts. If unchecked, such behavior may lead to further system compromise or data exfiltration.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage due to potential benign uses of `sigverif.exe` that lead to false positives. The detection logic assumes that `sigverif.exe` will not normally spawn unusual child processes in a properly configured environment. To ensure functionality, the system must be set to capture and log detailed process creation events, including parent-child relationships. Without comprehensive process logging, the detection may fail to capture all relevant events, leading to missed indicators of compromise.

