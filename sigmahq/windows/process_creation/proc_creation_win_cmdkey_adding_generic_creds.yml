note: |
  ### Technical Context

  This Sigma rule detects the execution of `cmdkey.exe` to add generic credentials on a Windows system. Typically, attackers employ this technique to store credentials for accessing remote systems, such as transitioning into Remote Desktop Protocol (RDP) sessions. The relevant MITRE ATT&CK technique is **T1021.001: Remote Services: RDP**, associated with the tactic of **Credential Access**.

  Key telemetry sources include process creation logs, specifically Windows Security Event ID 4688, alongside Sysmon Event ID 1 for comprehensive tracking of command line executions. If executed maliciously, this behavior can facilitate unauthorized access to critical systems, enabling lateral movement within an organization’s network. Notably, this detection does NOT confirm unauthorized access or malicious intent on its own, as it might also be used legitimately for administrative purposes.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Check for Windows Security Event ID 4688 or Sysmon Event ID 1. Look for `cmdkey.exe` usage with command line arguments, specifically `-g` (generic credentials), `-u` (username), and `-p` (password).

  - **Identify high-confidence malicious activity**: Search for instances where `cmdkey.exe` was run with command line parameters containing sensitive information (e.g., passwords or credentials). This can indicate credential harvesting intended for unauthorized access.

  - **Correlate with RDP connection attempts**: Look for associated RDP session creation logs (Event ID 4624) from the same source IP immediately following the cmdkey execution. This can indicate an attempt to connect using newly added credentials.

  - **Assess legitimate uses**: Investigate any documented administrative or operational processes that involve `cmdkey.exe` within your organization. Legitimate processes typically involve fixed, known user accounts rather than generic credentials.

  - **Analyze if other credential management tools are used**: Check for concurrent usage of applications such as `pass.exe` or `keystore.exe`, which could point towards legitimate credential usage or other malicious intent.

  - **Inspect for file creation or modification artifacts**: Validate any recent changes in credential storage locations, specifically in the Windows Credential Manager (`C:\Users\<username>\AppData\Local\Microsoft\Credentials`). Unexpected changes could indicate malicious credential acquisition.

  ---

  ### Prioritization

  This alert has a medium severity owing to the potential impact on systems managing sensitive information, with a moderate likelihood of being abused, especially in environments where remote access is prevalent. The technique is known to be weaponized in various attacks, making it crucial for SOC teams to assess and respond promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may be circumvented by attackers using alternate methods to store credentials or conducting operations from non-Windows environments. Ensure that proper logging is enabled for cmdkey and other credential-related processes for robust detection. Legitimate activities that may trigger this alert include system administration tasks that legitimately require credential modification. A companion detection that could enhance coverage includes monitoring for Event ID 4624, which tracks logon events, helping to correlate with credential additions made by cmdkey.

