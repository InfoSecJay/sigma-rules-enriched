note: |
  ### Technical Context
  This detection rule identifies the use of `cmdkey.exe` for adding generic credentials on Windows systems. The command-line utility can be employed by an attacker to maliciously store credentials for later use, particularly in remote access scenarios such as Remote Desktop Protocol (RDP) connections. An attacker may leverage this capability to facilitate unauthorized access to systems, maintain persistence, or move laterally within the network.

  The associated MITRE ATT&CK techniques relevant to this detection include **Credential Access (T1003.005)**, specifically under the category of repeated use of generic credentials to exploit services, such as RDP. The behavior typically indicates a premeditated plan to either escalate privileges or access sensitive systems remotely without immediate detection.

  Key data sources for this detection include **Process Creation logs**, which will capture events related to the execution of `cmdkey.exe` along with commands passed through the command line. Analyzing these logs will provide visibility into potentially suspicious credential management activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation entries in your logging system to identify instances where `cmdkey.exe` was executed, particularly looking for command-line arguments that include `-g`, `-u`, or `-p`.

  - **Check for Unusual Credential Patterns**: Investigate the credentials associated with the command to determine if they exhibit any signs of being malicious, such as previously unused or external accounts.

  - **Analyze User Activity**: Correlate the usage of `cmdkey.exe` with the user’s activity patterns. Look for unusual timeframes or connections to sensitive systems that the user normally does not access.

  - **Cross-reference with RDP Logs**: Validate if there were any RDP connections made from the system shortly after credentials were added. Investigate if those sessions were unusual compared to business norms.

  ### Prioritization
  This alert should be considered medium severity due to the potential for an attacker to gain unauthorized access to systems using stored credentials. The likelihood of exploitation can be deemed moderate, particularly in environments where users may have legitimate reasons to use `cmdkey.exe` for administrative tasks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging for process creation events is not enabled or if `cmdkey.exe` can be executed from non-monitored environments. The detection logic assumes that the use of `cmdkey.exe` is a significant indicator of malicious intent, overlooking cases where legitimate administrators utilize the tool for valid operations. Ensuring comprehensive logging across workstations and servers, particularly those that facilitate RDP access, is essential for the detection to function effectively.

