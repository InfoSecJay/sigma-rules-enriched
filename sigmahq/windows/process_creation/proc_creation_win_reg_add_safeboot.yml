  ---

  ### Technical Context

  This rule detects the execution of the `reg.exe` command containing `add` or `copy` flags specifically targeting registry keys associated with Safe Boot. This behavior is often abused by adversaries to ensure that malicious software, particularly ransomware, can operate in Safe Mode, evading detection by security solutions that may not function optimally in this environment.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), focusing on the technique of **Indicator Removal on Host** (T1562.001). Key telemetry sources include Windows process creation logs, particularly Tracking Event ID 4688, which captures command-line executions. The potential impact of malicious use involves enabling ransomware persistence and evasion during critical recovery phases. Importantly, this detection does NOT confirm malicious intent or a successful compromise on its own.

  ---

  ### Investigation Steps

  - **Review process execution details**: Check Windows Security Event ID 4688 for `reg.exe` processes. Look for command-line arguments containing `\SYSTEM\CurrentControlSet\Control\SafeBoot`, `add`, or `copy`. Any instance without legitimate context is suspicious.

  - **Validate legitimate use cases**: Identify if any expected administrative tasks involve reg.exe modifying Safe Boot keys. Such activities typically should be performed during maintenance windows and have documented justification.

  - **Correlate with other security events**: Cross-reference alerts for concurrent anomalous activities across the environment, such as unusual process executions or user behavior. This can help establish a timeline and context for the reg.exe activity.

  - **Identify malicious indicators**: Look for reg.exe command-line executions with additional suspicious flags or mechanisms that indicate ransomware behavior, such as usage alongside known malware hashes or parent processes related to exploitation.

  - **Assess system criticality**: Determine the role of the affected host within the network. Any critical systems should be prioritized for deep investigation, as compromise here could lead to widespread disruption.

  - **Check for similar detection triggers**: Review related detection rules, such as those for unauthorized changes to startup items or system configurations. Companion detections can enhance overall visibility.

  ---

  ### Prioritization

  Given the potential impact on critical systems and the high likelihood of abuse for ransomware deployment, this alert should be prioritized as high. Actions taken by `reg.exe` in this context are often part of a broader attack surface manipulation strategy.

  ---

  ### Blind Spots and Assumptions

  This detection can be evaded if an adversary uses methods to conceal command-line activities or utilizes an alternate registry manipulation tool that does not trigger standard logging mechanisms. It is crucial to ensure that process creation events are fully captured in Windows Event Logging and that relevant auditing settings are enabled for comprehensive visibility. Legitimate activities that might trigger this alert include authorized system configuration changes during maintenance. A companion detection to consider would be monitoring for abnormal command-line parameters or the use of remote access tools that manipulate registry entries similarly.

