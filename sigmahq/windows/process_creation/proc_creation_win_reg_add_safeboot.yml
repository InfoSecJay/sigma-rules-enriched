note: |
  ### Technical Context

  This Sigma rule detects the use of the Windows `reg.exe` command to add or copy registry keys specifically targeting the Safe Boot configuration. By manipulating Safe Boot, attackers can ensure that ransomware and malware can operate in a mode where typical security measures may be bypassed or disabled. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1562.001). The primary telemetry source is Windows process creation logs, specifically Event ID 4688, which captures details of executed processes, including the command line used. If detected, this behavior potentially indicates active attempts to disable or circumvent security controls, which could lead to a successful ransom or system compromise. However, this detection does NOT confirm that malicious activity has occurred on its own, as benign administrative activity can also involve similar commands.

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 4688 that references `reg.exe`, specifically focusing on command lines containing `\SYSTEM\CurrentControlSet\Control\SafeBoot` with the flags `add` or `copy`. Filter logs by the user context to identify if it's a legitimate administrative user or a suspicious account.

  - **Identify user context:** Verify the user account executing `reg.exe`. High-risk accounts (like those with administrative privileges) performing this action might indicate a malicious intent, whereas expected behavior may show service accounts or well-documented admin users engaging in legitimate configuration changes.

  - **Analyze related registry modifications:** Cross-reference this activity with the Windows Registry for any changes under `HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot`. Document any newly added keys, especially those not aligned with known organizational practices.

  - **Check for execution environment:** Assess if this command was executed during off-hours or from unusual geographic locations. Legitimate administrative tasks typically occur during business hours, and deviations may suggest potential compromise.

  - **Verify device role and criticality:** Identify if the affected host is critical (e.g., a domain controller or file server) and if it's part of a sensitive operational environment (like finance or HR), as these systems would attract higher scrutiny for such activities.

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on critical systems; if malicious, it can enable ransomware to operate undetected. The likelihood of abuse is high, as actors frequently employ such tactics to evade security controls during attacks, particularly in ransomware scenarios that exploit Safe Boot.

  ### Blind Spots and Assumptions

  The detection may be ineffective if logging for process creation is not appropriately configured across all endpoints. Legitimate administrative actions, such as system maintenance and software installs, might inadvertently trigger this alert. A related detection for routine registry access or modification (e.g., abnormal patterns in Event ID 4663) could enhance monitoring around sensitive registry operations and improve overall coverage.

