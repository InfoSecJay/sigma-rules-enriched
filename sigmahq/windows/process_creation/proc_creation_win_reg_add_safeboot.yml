note: |
  ### Technical Context
  This detection rule identifies the execution of the Windows Registry Utility (`reg.exe`) with commands that add or copy values specifically targeting safe boot registry keys. Attackers often employ this technique to manipulate safe boot configurations, potentially enabling malicious processes, such as ransomware, to execute without detection during safe mode. The primary objective of this behavior is likely to undermine security controls, allowing harmful software to operate when certain security measures are bypassed during the safe boot state.

  The rule maps to the MITRE ATT&CK framework's **Defense Evasion** tactic, specifically technique **T1562.001** (Disable or Modify Tools). This technique highlights a common method used by adversaries to evade defenses by altering system settings. The primary sources for telemetry include process creation logs that capture the execution of commands and associated parameters utilized by the `reg.exe` utility.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `reg.exe` execution, filtering for commands that include the terms 'copy' or 'add' and are aimed at the safe boot registry path.
  - **Examine Command-Line Parameters:** Inspect the command-line arguments associated with the `reg.exe` instances to confirm modifications being applied to the safe boot keys.
  - **Assess User Context:** Identify the user context under which the `reg.exe` command was executed. Look for abnormal accounts or permissions that may indicate malicious activity.
  - **Correlate with Security Events:** Cross-reference findings with additional security event logs (e.g., EDR alerts, AV detections) that may indicate other malicious activities or confirmed incidents around the same timeframe.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of ransomware operations facilitated through safe boot modifications. The likelihood of encountering such activities in an enterprise environment, particularly with the prevalence of ransomware threats, further elevates the urgency for investigation.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage may arise if the attacker uses alternative tools or methods to modify safe boot registry keys outside the direct usage of `reg.exe`. Additionally, the detection logic assumes that `reg.exe` usage tends to be limited to legitimate administrative contexts, which may not always hold true. For the alert to function properly, it requires comprehensive process creation logging to be enabled and actively monitored in the endpoint security infrastructure.

