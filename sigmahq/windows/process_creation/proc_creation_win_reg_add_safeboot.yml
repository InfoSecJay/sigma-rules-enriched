note: |
  ### Technical Context

  This rule detects the execution of the `reg.exe` utility with commands that manipulate Safe Boot registry keys, specifically using the "add" or "copy" flags. This behavior is often leveraged by attackers, particularly ransomware groups, to configure the system to boot into Safe Mode, circumventing security products that may not run in this mode. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) and the technique is T1685, which pertains to the modification of boot settings.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creation events. If the execution of these commands is malicious, it may indicate an attempt to disable or bypass security controls, thereby elevating risk to the organization's systems and data. It is important to note that this detection alone does not confirm malicious intent without context; legitimate administrative activities can also result in similar log entries.

  ### Investigation Steps

  - **Review Process Creation Events:** Check for the execution of `reg.exe` with CommandLine containing `\SYSTEM\CurrentControlSet\Control\SafeBoot` in Windows Security Event ID 4688 or Sysmon Event ID 1. Look for parent process information which may indicate legitimate administrative tasks.

  - **Assess Command Arguments:** Analyze the CommandLine for keywords "copy" or "add" to identify potential malicious activity. If found in conjunction with Safe Boot keys, it significantly increases suspicion.

  - **Inspect Event Logs for Context:** Cross-reference the detected command with Windows Event Logs for preceding events (e.g., Event ID 4624 for logons, Event ID 4740 for account lockouts) to contextualize the behavior. Look for unusual login sources or times.

  - **Validate Host Role and Criticality:** Determine the role of the affected host (e.g., server vs. workstation). Increased scrutiny is warranted if the device has high criticality (such as a domain controller or data server) since the impact of malicious changes would be more severe.

  - **Identify Legitimate Use Cases:** Note that legitimate system administrators may use `reg.exe` for routine maintenance or troubleshooting. If recent changes to system configurations align with normal administrative tasks, it may indicate benign activity.

  - **Flag for Exfiltration Artifacts:** Investigate any creation of or changes to critical registry keys or documents, which may suggest data preparation for exfiltration. Look for file creation events or network logs indicating data being sent out post-registry modification.

  ### Prioritization

  The alert is high-severity, especially on critical systems where ransomware may seek to disable security measures. The risk of malicious exploitation is significant given the known methods used by adversaries to commandeer systems via Safe Mode. This detection behavior is known to be weaponized in recent ransomware attacks, warranting prompt analysis.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques where attackers may obfuscate or rename tools to blend in with legitimate processes. Comprehensive logging must be enabled for process creation and command execution to ensure reliable detection. Legitimate administrative tasks, such as system configuration changes during maintenance windows, may frequently trigger this alert. Companion detections to strengthen coverage include monitoring for unusual file creations in system directories or anomalous script executions immediately following registry changes.

