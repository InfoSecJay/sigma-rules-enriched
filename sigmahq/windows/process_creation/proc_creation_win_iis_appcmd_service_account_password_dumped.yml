title: Microsoft IIS Service Account Password Dumped
id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
status: test
description: Detects the Internet Information Services (IIS) command-line tool, 
  AppCmd, being used to list passwords
references:
- https://www.elastic.co/guide/en/security/current/microsoft-iis-service-account-password-dumped.html
- https://twitter.com/0gtweet/status/1588815661085917186?cxt=HHwWhIDUyaDbzYwsAAAA
- https://www.netspi.com/blog/technical/network-penetration-testing/decrypting-iis-passwords-to-break-out-of-the-dmz-part-2/
author: Tim Rauch, Janantha Marasinghe, Elastic (original idea)
date: 2022-11-08
modified: 2023-01-22
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_base_name:
  - Image|endswith: '\appcmd.exe'
  - OriginalFileName: 'appcmd.exe'
  selection_base_list:
    CommandLine|contains: 'list '
  selection_standalone:
    CommandLine|contains:
    - ' /config'         # https://pbs.twimg.com/media/FgydDAJWIAEio34?format=png&name=900x900
    - ' /xml'
            # We cover the "-" version just in case :)
    - ' -config'
    - ' -xml'
  selection_cmd_flags:
    CommandLine|contains:
    - ' /@t'         # Covers both "/@text:*" and "/@t:*"
    - ' /text'
    - ' /show'
            # We cover the "-" version just in case :)
    - ' -@t'
    - ' -text'
    - ' -show'
  selection_cmd_grep:
    CommandLine|contains:
    - ':\*'
    - 'password'
  condition: all of selection_base_* and (selection_standalone or all of 
    selection_cmd_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the invocation of the IIS command-line tool, AppCmd, specifically when it is used to list sensitive information, including passwords of service accounts. The likely attacker objective is to gain unauthorized access to service account credentials, which could lead to lateral movement within the network or privilege escalation. This activity relates to the MITRE ATT&CK framework under the Credential Access tactic (TA-0006) and the technique T1003, which focuses on credential dumping.

  The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688, capturing command-line arguments for executed processes. If malicious, this behavior can significantly impact security by exposing sensitive credentials that facilitate further attacks. Importantly, this detection does NOT confirm that credentials have been successfully stolen or misused on its own; it merely indicates an attempt to gather such information.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 logs for entries with Image path including `\appcmd.exe` and CommandLine containing the designated keywords (`list `, `/config`, etc.). Look for anomalous usage of AppCmd indicating a potential attack.

  - **Verify the user context:** Identify the user account that executed the AppCmd command. Ensure that it is not an unusual or unauthorized account, especially if the command was run by a standard user or user without IIS administration rights.

  - **Examine command context:** Confirm legitimate usage of AppCmd. Typically, IIS administrators use this tool for configuration management and not for listing passwords. Legitimate uses often do not involve command-line parameters indicating explicit access to sensitive information.

  - **Identify elevated privileges:** Check for any entries indicating the execution of AppCmd from high-privilege accounts such as service accounts or domain admin accounts, which would suggest potential misuse.

  - **Look for additional malicious indicators:** Cross-reference with other telemetry such as Sysmon logs (Event ID 1 for process creation) and see if malicious indicators, like unusual outbound connections or lateral movement activities, correlate with the timing of this AppCmd invocation.

  - **Assess the impact of surrounding processes:** Investigate any processes executed before or after AppCmd that may indicate an escalation or attempt to exfiltrate data, particularly if they involve network activity or accessing sensitive directories.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive credentials associated with service accounts. The likelihood of malicious abuse is significant, as credential dumping is commonly leveraged by adversaries to gain elevated access within a network. This behavior has been weaponized in various attack scenarios targeting IIS environments.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where AppCmd is legitimately used for maintenance; thus, it may result in false positives. The execution of AppCmd with elevated privileges by legitimate admins could cause legitimate alerts to trigger. Ensure that logging for process creation is enabled and reviewed consistently for reliable detection. Related detections such as abnormal remote access (e.g., RDP connections or PowerShell commands) would strengthen coverage of potential exploitation scenarios surrounding this behavior.

