title: Microsoft IIS Service Account Password Dumped
id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
status: test
description: Detects the Internet Information Services (IIS) command-line tool, AppCmd,
  being used to list passwords
references:
- https://www.elastic.co/guide/en/security/current/microsoft-iis-service-account-password-dumped.html
- https://twitter.com/0gtweet/status/1588815661085917186?cxt=HHwWhIDUyaDbzYwsAAAA
- https://www.netspi.com/blog/technical/network-penetration-testing/decrypting-iis-passwords-to-break-out-of-the-dmz-part-2/
author: Tim Rauch, Janantha Marasinghe, Elastic (original idea)
date: 2022-11-08
modified: 2023-01-22
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_base_name:
  - Image|endswith: '\appcmd.exe'
  - OriginalFileName: 'appcmd.exe'
  selection_base_list:
    CommandLine|contains: 'list '
  selection_standalone:
    CommandLine|contains:
    - ' /config'         # https://pbs.twimg.com/media/FgydDAJWIAEio34?format=png&name=900x900
    - ' /xml'
            # We cover the "-" version just in case :)
    - ' -config'
    - ' -xml'
  selection_cmd_flags:
    CommandLine|contains:
    - ' /@t'         # Covers both "/@text:*" and "/@t:*"
    - ' /text'
    - ' /show'
            # We cover the "-" version just in case :)
    - ' -@t'
    - ' -text'
    - ' -show'
  selection_cmd_grep:
    CommandLine|contains:
    - ':\*'
    - 'password'
  condition: all of selection_base_* and (selection_standalone or all of selection_cmd_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule targets the potential misuse of the Microsoft IIS command-line tool, AppCmd, specifically when it is used to extract sensitive information such as passwords. Attackers may gain access to an environment through various means and then leverage AppCmd to enumerate service account credentials, leading to further lateral movement or privilege escalation within the network. This behavior indicates a potential credential theft scenario, as compromised service account passwords can allow attackers to maintain access to critical systems and data.

  The suspected threat behavior aligns with the MITRE ATT&CK framework, specifically focusing on the **Credential Access** tactic (ID: TA-0006) and its **Credential Dumping** technique (ID: T1003). The primary sources of telemetry for this detection will include process creation events, which capture the execution of commands and their arguments, providing insights into potentially malicious activity involving AppCmd.

  Key data sources that will yield critical evidence include Windows process creation logs, which detail command execution, along with any logs related to IIS if available. Analysts should focus on the logs capturing the command-line arguments used during execution to identify malicious patterns.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigate the process creation logs for AppCmd.exe execution, specifically looking for patterns in command-line arguments that include 'list', '/config', or '/xml' as these indicate queries for sensitive information.
  - **Correlate with User Activity:** Examine the user accounts associated with the execution of AppCmd to determine if they are legitimate service accounts or if the activity appears anomalous compared to normal usage patterns.
  - **Analyze User Permissions:** Verify the permissions associated with the account running the command; if the account has excessive permissions relative to its intended use, it could signify compromised credentials or social engineering tactics.
  - **Cross-check IIS Logs:** Check the IIS logs for any irregular access patterns, especially related to the timing of the AppCmd execution, and look for failed logins or other potentially malicious activity in the same timeframe.

  ### Prioritization
  The severity of this alert is high due to the potential impact of compromised service account credentials in an enterprise environment. The likelihood of exploitation increases, especially in cases where service accounts possess significant privileges, facilitating further attacks on the network.

  ### Blind Spots and Assumptions
  This detection rule may not cover all potential methods of credential gathering, particularly if attackers utilize other command-line tools or scripts instead of AppCmd. The detection also assumes that AppCmd is being executed with recognizable and typical command-line arguments as specified in the rule. Furthermore, the effective implementation of this alert requires that process creation logging is enabled and properly configured within your Windows environment for complete visibility.

