note: |
  ### Technical Context

  This rule detects the execution of Chromium-based browsers (e.g., Chrome, Edge, Opera) in headless mode utilizing the "dump-dom" command line to download web content. The behavior is indicative of automated processes that an attacker may leverage to scrape data or retrieve assets without establishing visible web sessions. The primary objective for an adversary could be to exfiltrate sensitive information or data compromise via cleaning search results from web pages in an unobtrusive manner.

  The relevant MITRE ATT&CK tactic is **Command and Control (T1071)**, and the technique is **Application Layer Protocol (T1105)**, which represents exfiltration. Primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon Event ID 1, capturing details around process executions and command-line arguments. A malicious execution of this nature could lead to unauthorized access to sensitive data or command and control activity. It should be noted that the detection alone does NOT confirm malicious activity, as legitimate headless browser usage exists in automated processes.

  ### Investigation Steps

  - **Check for headless browser execution details:** Review the process creation logs for Event ID 4688 and Sysmon Event ID 1 to identify any instances of `chrome.exe`, `msedge.exe`, etc., with the `--headless` and `dump-dom` command-line parameters.

  - **Validate command line arguments:** From the reviewed logs, ensure the command line includes indicators such as `--headless - dump-dom` and does NOT contain any benign or commonly-used parameters that would indicate legitimate traffic, as in automation tools or testing environments.

  - **Identify typical locations for legitimate usage:** Confirm if the identified headless browser executable path is indicative of standard installation directories (e.g., `C:\Program Files\`). Headless instances from non-standard directories or temporary folders are more suspicious.

  - **Correlate network activity from the same host:** Investigate network logs around the time of process execution to see if there were any external HTTP connections made, especially if accessing unfamiliar domains which may indicate data extraction or command and control communication.

  - **Search for related artifacts:** Look for related file creation or file downloads on the same host that coincide with the process execution time, checking for unusual file types or unexpected data.

  - **Review historical data for similar behavior:** Scan for past occurrences of headless browser activity in the environment and examine user roles, assessing whether the detected behavior aligns with known legitimate tasks or unusual patterns.

  ### Prioritization

  This alert is high priority due to the potential impact of data exfiltration and the high likelihood of malicious exploitation in enterprise environments. The use of headless browsers for stealthy data access and commands makes it a common tactic employed by adversaries, thus warranting immediate review and investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations due to the potential for false positives in legitimate automated workflows using headless browsers. Proper logging configurations for process creation and network activities are essential to avoid missing similar threats. Activities like automated tests in CI/CD pipelines could trigger similar alerts. A companion detection to strengthen coverage could involve monitoring for specific network patterns indicative of command and control when suspicious browser activities occur.

