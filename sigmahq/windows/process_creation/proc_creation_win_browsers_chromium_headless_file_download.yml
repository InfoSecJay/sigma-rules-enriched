note: |
  ### Technical Context

  This Sigma rule detects the execution of Chromium-based web browsers (Chrome, Edge, Brave, Opera, Vivaldi) in headless mode, specifically using the "dump-dom" command line argument which can download files from the internet. The attacker’s objective is likely to automate data exfiltration or reconnaissance by silently downloading content without a user interface.

  This behavior fits within the MITRE ATT&CK framework under **Exfiltration (TA0010)** and **Command and Control (T1105)** tactics, particularly the technique **Command-Line Interface (T1059.003)**. The primary telemetry source is Windows process creation logs, particularly **Security Event ID 4688** and **Sysmon Event ID 1**. A successful execution could lead to data breaches or unauthorized information access. It must be noted that this detection does NOT confirm malicious intent, as legitimate automation tasks may also employ headless browser operations.

  ### Investigation Steps

  - **Review process creation events**: Check for **Event ID 4688** and **Sysmon Event ID 1** in the Windows Security and Sysmon logs. Look for processes named `brave.exe`, `chrome.exe`, `msedge.exe`, `opera.exe`, or `vivaldi.exe` with command lines containing `--headless` and `dump-dom`.

  - **Identify command line parameters**: Determine whether the command line used contains known benign flags or arguments. Legitimate usage may include flags that are not related to file downloads or scraping.

  - **Correlate with network activity**: Investigate any corresponding **network logs** capturing outgoing connections or DNS queries from these browser processes to see if there's unusual activity going to potentially malicious URLs. Use **Windows Firewall logs** for outbound traffic analysis, focusing on HTTP(S) requests.

  - **Check for file downloads**: Validate whether the execution resulted in the creation of suspicious files in temporary directories or the Downloads folder. Use **File Creation Events (Security Event ID 4663)** to confirm file creation, especially in user profile paths or application-specific directories.

  - **Look for abnormal parent processes**: Assess the parent process of the identified browser execution. Malicious instances might have unusual or unexpected parent processes, such as `powershell.exe`, `cmd.exe`, or third-party automation scripts.

  - **Evaluate alerts for related detections**: Check if there are any companion detections or earlier alerts related to suspicious activity from same asset. Investigate **Event ID 5140 (File share access)** for any anomalous file access patterns that might suggest further malicious activity.

  ### Prioritization

  This alert is assigned high severity due to the potential impact on compromised systems and the likelihood of its abuse for extracting sensitive information. The use of headless browsers is increasingly common among attackers to execute automated tasks while remaining undetected.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming legitimate browser executables, bundling the command with benign operations, or using proxy tools to obscure actual destinations. Reliable detection requires integration with Sysmon for comprehensive process monitoring. Legitimate use cases, such as automated monitoring scripts or internal tools, may produce similar alerts. A related detection to consider is **script execution (T1064)** which may offer additional contextual data surrounding the alert, enhancing overall detection coverage on potential scripting attacks.

