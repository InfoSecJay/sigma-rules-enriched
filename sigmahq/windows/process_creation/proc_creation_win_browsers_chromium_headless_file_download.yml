note: |
  ### Technical Context
  This detection rule is designed to identify potentially malicious activity involving the execution of Chromium-based browsers in headless mode, particularly when the command line parameters include "dump-dom" to download files from the internet. The use of headless browsers, such as Chrome, Brave, or Edge, may indicate attempts to automate tasks like data exfiltration, web scraping, or malicious payload delivery without a graphical interface, which can help attackers evade detection.

  Attackers leveraging this technique may aim to download and execute files stealthily or gather information from web pages without alerting the user or security monitoring systems. This behavior relates to the MITRE ATT&CK techniques T1105 (Ingress Tool Transfer) and T1564.003 (Hide Artifacts: Hidden Files and Directories). By executing a headless browser to manipulate content and collect data, an attacker’s objectives may include reconnaissance, data theft, or installing a backdoor.

  Primary data sources for this detection include process creation logs, which provide insights into running processes and their command-line arguments, enabling the identification of unusual browser usage patterns that suggest malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances where Chromium-based browsers (Chrome, Brave, Edge, etc.) are executed with headless mode enabled and the "dump-dom" command. Assess the context and timing of each execution.

  - **Analyze Command Line Arguments:** Focus on command line parameters used in the process creation events. Look for suspicious flags such as '--headless', '--disable-gpu', '--dump-dom', which may indicate malicious activity aimed at stealthily downloading files or manipulating web content.

  - **Correlate with Network Traffic:** Check for corresponding outbound HTTP traffic or downloads initiated shortly after the detected browser execution. This could reveal potential data exfiltration attempts or connections to known malicious domains.

  - **Investigate User Activities:** Validate whether the user account associated with the detected activity had legitimate reasons to initiate headless browser sessions. Check for any historical patterns of usage or anomalous behavior.

  ### Prioritization
  This alert is of high severity due to the potential for data exfiltration or automated malicious downloads that may bypass traditional defenses. The ability of headless browsers to conduct tasks silently enhances the likelihood of successful attacker objectives within enterprise environments.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where custom or alternative browsers are used that do not fall under Chromium-based categories. The detection logic assumes that the command-line arguments used in the rule are indicative of malicious behavior; however, benign use cases may exist, thus resulting in false positives. Properly configured logging for process creation is crucial for this alert to function effectively; without it, tracking the execution of potentially harmful processes could be compromised.

