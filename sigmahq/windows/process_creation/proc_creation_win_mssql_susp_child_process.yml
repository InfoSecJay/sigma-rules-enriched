    ParentImage|startswith: 'C:\Program Files\Microsoft SQL Server\'
    ParentImage|endswith: 'DATEV_DBENGINE\MSSQL\Binn\sqlservr.exe'
    Image: 'C:\Windows\System32\cmd.exe'
    CommandLine|startswith: '"C:\Windows\system32\cmd.exe" '
  condition: selection and not 1 of filter_optional_*
level: high
note: |
  ### Technical Context
  This rule detects the creation of suspicious child processes from the SQL Server executable (`sqlservr.exe`). The presence of unexpected child processes, such as command shells or commonly abused tools, could indicate an attacker attempting to exploit vulnerabilities through methods such as Remote Code Execution (RCE) or SQL Injection. Attackers may leverage SQL Server, a critical database service, to execute malicious commands, escalate privileges, or create persistence mechanisms.

  Relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Initial Access (TA0001)**: via SQL Injection (T1190)
  - **Execution (TA0002)**: through process command execution (T1505.003)
  - **Persistence (TA0003)**: by creating malicious processes (T1543)
  - **Privilege Escalation (TA0004)**: exploiting elevated privileges via database servers (T1068)

  The primary data sources for this detection are process creation logs, particularly in Windows environments, where details regarding parent and child process relationships are recorded.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for processes that were spawned by `sqlservr.exe`, noting the command lines and associated user accounts that initiated these actions.
  - **Analyze Command Line Arguments:** Investigate the command line arguments of the detected child processes, specifically looking for unusual parameters that could indicate malicious intent or abuse of functionality.
  - **Correlate with SQL Server Activity:** Look for any interactions with SQL Server that could give context to the detected child processes, such as recent SQL queries, connections, or failover events.
  - **Check for Privilege Escalation Opportunities:** Assess potential privilege escalation paths within SQL Server and analyze user permissions and roles to determine any anomalies tied to the detected activity.

  ### Prioritization
  This alert carries a high severity due to the critical role of SQL Server in enterprise environments, where a successful compromise could result in significant data breaches or system integrity loss. The likelihood of exploitation in environments with poorly managed SQL setups further elevates the urgency of this detection.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly in the case of masked or obfuscated command lines, which could evade detection. This rule assumes that all relevant process creation logs are being collected and that the SQL Server environment adheres to standard configurations. Additionally, if the observed processes do not follow typical patterns of usage in the environment, legitimate administrative actions could be mistakenly identified as suspicious.

