detection:
  selection:
    ParentImage|endswith: '\sqlservr.exe'
    Image|endswith:
            # You can add other uncommon or suspicious processes
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\cmd.exe'
    - '\netstat.exe'
    - '\nltest.exe'
    - '\ping.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\sh.exe'
    - '\systeminfo.exe'
    - '\tasklist.exe'
    - '\wsl.exe'
  filter_optional_datev:
    ParentImage|startswith: 'C:\Program Files\Microsoft SQL Server\'
    ParentImage|endswith: 'DATEV_DBENGINE\MSSQL\Binn\sqlservr.exe'
    Image: 'C:\Windows\System32\cmd.exe'
    CommandLine|startswith: '"C:\Windows\system32\cmd.exe" '
  condition: selection and not 1 of filter_optional_*
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious child processes from the SQL Server (`sqlservr.exe`). The recognized behavior may imply an attacker attempting to exploit a vulnerability in SQL Server, possibly leading to remote code execution (RCE) or SQL injection attacks. The likely objective of such actions would be to gain unauthorized access, execute arbitrary code, or escalate privileges. This rule corresponds to the following MITRE ATT&CK tactics and techniques: **Initial Access (T1190)** and **Execution (T1505.003)**.

  The primary telemetry source is Windows process creation logs. Relevant log types include Security Event ID **4688** for process creation and Sysmon Event ID **1**. If malicious, this activity could lead to significant security incidents, compromising sensitive data and system integrity. However, this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks or updates may also trigger similar behavior.

  ### Investigation Steps

  - **Review Recent Process Creation Events:** Examine Security Event ID **4688** or Sysmon Event ID **1** for the `sqlservr.exe` parent process, focusing on the child process names and command lines associated with them.

  - **Identify Malicious Command Lines:** Look for suspicious command lines associated with child processes like `cmd.exe` or `powershell.exe`, especially if they execute uncommon commands or interact with sensitive data.

  - **Assess Legitimate Processes:** Verify if any legitimate applications or services that require SQL server interaction have triggered the alert. Document the context of any expected child processes (e.g., admin maintenance tasks).

  - **Check for Anomalous Parent-Child Relationships:** Correlate the child processes to known administrative activities. Malicious processes originating from `sqlservr.exe` should lack legitimate justification and exhibit signs of obfuscation or unusual patterns.

  - **Review System Criticality and Roles:** Validate whether the affected system hosts critical data or services (e.g., finance-related databases) and prioritize alert investigation accordingly.

  - **Examine for Artifact Creation:** If a malicious child process is confirmed, check for any file creations or modifications in temporary directories (like `C:\Temp\`) for artifacts indicative of exfiltration or persistence mechanisms.

  ### Prioritization

  This alert is of high severity due to the potential impact on core business operations and sensitive data stored in SQL databases. SQL Server is commonly targeted by cybercriminals, making this behavior a likely precursor to malicious exploits. The use of unusual child processes can indicate active attempts to manipulate or compromise the database environment.

  ### Blind Spots and Assumptions

  Detection may miss obfuscated or rogue processes if they mimic legitimate activity closely. Non-standard logging configurations on SQL Servers can limit visibility; ensure detailed process creation logging is enabled. Additionally, automated database management tasks may trigger the alert during legitimate operations. Companion detections, such as monitoring for unusual SQL queries (related detection ID: `344482e4-a477-436c-aa70-7536d18a48c7`), can enhance threat coverage and context.

