title: Potential Privilege Escalation To LOCAL SYSTEM
id: 207b0396-3689-42d9-8399-4222658efc99
related:
- id: 8834e2f7-6b4b-4f09-8906-d2276470ee23     # PsExec specific rule
  type: similar
status: test
description: Detects unknown program using commandline flags usually used by 
  tools such as PsExec and PAExec to start programs with SYSTEM Privileges
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2021-05-22
modified: 2024-03-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Escalation to LOCAL_SYSTEM
    CommandLine|contains|windash:
            # Note that you don't need to add the ".exe" part when using psexec/paexec
            # The "-" can also be replaced with "/"
            # The order of args isn't important
            # "cmd" can be replaced by "powershell", "pwsh" or any other console like software
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
            # Pwsh (For PowerShell 7)
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
            # PowerShell (For PowerShell 5)
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  filter_main_exclude_coverage:
        # This filter exclude strings covered by 8834e2f7-6b4b-4f09-8906-d2276470ee23
    CommandLine|contains:
    - 'paexec'
    - 'PsExec'
    - 'accepteula'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Weird admins that rename their tools
- Software companies that bundle PsExec/PAExec with their software and rename 
  it, so that it is less embarrassing
level: high
note: |
  ### Technical Context

  This detection identifies the execution of commands using flags characteristic of tools like PsExec and PAExec, which allow users to execute processes with LOCAL SYSTEM privileges. The likely attacker objective is privilege escalation, enabling them to escalate their access level, manipulate core system functions, or deploy malicious software with elevated rights. This behavior aligns with the MITRE ATT&CK tactic for Privilege Escalation (TA0004), specifically the technique for Exploiting Application Vulnerabilities (T1587.001).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command-line arguments for executed processes. If malicious, this activity can lead to significant security impacts, including unauthorized access and control over sensitive system resources. However, this detection does NOT confirm malicious intent solely based on the presence of these command-line flags; further context is necessary to determine genuine threat activity.

  ### Investigation Steps

  - **Review process creation logs**: Analyze Security Event ID 4688 or Sysmon Event ID 1 for command-line executions containing ' -s cmd', ' -s powershell', or similar variations. Note the process’ parent process for unusual behavior, such as unexpected services or processes initiating these commands.

  - **Identify malicious indicators**: Look for command executions that involve suspicious arguments, especially those not associated with known administrative tasks. For example, legitimate administrative operations will typically involve tools like PowerShell without -s or -i flags and will execute from recognized system paths.

  - **Evaluate asset criticality**: Confirm the role of the host where the alert triggered. If it is a critical system, the investigation escalates in urgency due to potential severe impact from privilege escalation.

  - **Correlate user accounts**: Identify the account executing the command. Check if it is a service account or an administrative user known to perform maintenance or scheduled tasks. Unusual account patterns, such as a non-admin user executing commands with SYSTEM privileges, indicate potential compromise.

  - **Examine recent changes**: Investigate any recent software installations or changes in the environment that may involve legitimate uses of PsExec or similar tools, taking note of known vendors that may bundle such functionalities to avoid false positives.

  ### Prioritization

  This alert is high priority due to its potential impact on system integrity and the likelihood of malicious exploitation. Unauthorized privilege escalation can compromise sensitive systems, while tools like PsExec are often used by attackers to facilitate lateral movement within a network.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of tools disguised with benign names or command-line variations that evade standard monitoring. Additionally, false positives can occur from legitimate administrative actions by IT staff. Reliable detection requires consistent logging configurations for Windows process creation and Sysmon operational mode. Companion detections that look for anomalous PowerShell or command shell activities can enhance contextual understanding and bolster confidence in assessments.

