title: Potential Privilege Escalation To LOCAL SYSTEM
id: 207b0396-3689-42d9-8399-4222658efc99
related:
- id: 8834e2f7-6b4b-4f09-8906-d2276470ee23     # PsExec specific rule
  type: similar
status: test
description: Detects unknown program using commandline flags usually used by tools
  such as PsExec and PAExec to start programs with SYSTEM Privileges
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2021-05-22
modified: 2024-03-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Escalation to LOCAL_SYSTEM
    CommandLine|contains|windash:
            # Note that you don't need to add the ".exe" part when using psexec/paexec
            # The "-" can also be replaced with "/"
            # The order of args isn't important
            # "cmd" can be replaced by "powershell", "pwsh" or any other console like software
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
            # Pwsh (For PowerShell 7)
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
            # PowerShell (For PowerShell 5)
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  filter_main_exclude_coverage:
        # This filter exclude strings covered by 8834e2f7-6b4b-4f09-8906-d2276470ee23
    CommandLine|contains:
    - 'paexec'
    - 'PsExec'
    - 'accepteula'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Weird admins that rename their tools
- Software companies that bundle PsExec/PAExec with their software and rename it,
  so that it is less embarrassing
level: high
note: |
  ### Technical Context
  This rule detects potential privilege escalation attempts to the LOCAL SYSTEM account. Attackers may utilize tools like PsExec or PAExec to execute malicious commands with elevated privileges on a compromised system. By leveraging these command-line tools, malicious actors can gain significant control over target machines, possibly leading to lateral movement, data exfiltration, or further network compromise.

  In the context of this detection, the main tactic involved is **Privilege Escalation** (MITRE ATT&CK Tactic ID: TA0004). Specific techniques include **Exploitation for Privilege Escalation** (T1068) and **System Information Discovery** (T1082). This behavior can signal attempts to circumvent security controls and escalate an attacker's access level significantly.

  Primary data sources for this detection rule include **process creation logs** from Windows systems, which capture command-line arguments used to initiate processes. Analyzing these logs allows security teams to identify potentially unauthorized or suspicious executions that deviate from standard operational behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze Windows process creation logs to identify instances of command-line arguments that invoke processes with `-s` or `-i` flags, indicating an escalation to LOCAL SYSTEM.

  - **Correlate with User Behavior**: Cross-reference the identified process creations with user activity logs. Look for unusual patterns or a lack of permissions justifying the use of privilege escalation tools.

  - **Inspect Related Network Activity**: Examine network logs for any subsequent connections made by processes launched with elevated privileges. This may include unusual outbound connections that could indicate data exfiltration or lateral movement.

  - **Assess Environment Configuration**: Check the configuration of the monitored environment to ensure that known tools like PsExec and PAExec are accounted for, limiting the potential for false positives from legitimate administrative activity.

  ### Prioritization
  The alert is assigned a high severity due to the significant impact that successful privilege escalation can have on an organization's security posture, including potential data breaches and ransomware deployment. The likelihood of exploitation is considerable, as tools like PsExec are commonly used by both administrators and threat actors alike.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage regarding modified or renamed versions of PsExec and PAExec, which may not be captured by the current rule. Additionally, the detection logic assumes that command-line patterns remain consistent and are not obfuscated or altered by attackers. It also relies on the availability of accurate and comprehensive process creation logs; thus, any environment lacking proper Windows event logging configurations may be unable to capture these events effectively.

