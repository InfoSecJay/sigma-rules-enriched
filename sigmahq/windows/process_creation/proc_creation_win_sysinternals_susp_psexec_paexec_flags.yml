title: Potential Privilege Escalation To LOCAL SYSTEM
id: 207b0396-3689-42d9-8399-4222658efc99
related:
- id: 8834e2f7-6b4b-4f09-8906-d2276470ee23     # PsExec specific rule
  type: similar
status: test
description: Detects unknown program using commandline flags usually used by tools
  such as PsExec and PAExec to start programs with SYSTEM Privileges
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2021-05-22
modified: 2024-03-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Escalation to LOCAL_SYSTEM
    CommandLine|contains|windash:
            # Note that you don't need to add the ".exe" part when using psexec/paexec
            # The "-" can also be replaced with "/"
            # The order of args isn't important
            # "cmd" can be replaced by "powershell", "pwsh" or any other console like software
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
            # Pwsh (For PowerShell 7)
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
            # PowerShell (For PowerShell 5)
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  filter_main_exclude_coverage:
        # This filter exclude strings covered by 8834e2f7-6b4b-4f09-8906-d2276470ee23
    CommandLine|contains:
    - 'paexec'
    - 'PsExec'
    - 'accepteula'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Weird admins that rename their tools
- Software companies that bundle PsExec/PAExec with their software and rename it,
  so that it is less embarrassing
level: high
note: |
  ---

  ### Technical Context

  This rule detects command-line invocations that attempt to escalate privileges to the LOCAL SYSTEM account using potentially malicious techniques similar to well-known tools like PsExec and PAExec. These behaviors may indicate an attacker attempting to gain a high level of access on a target machine, which can facilitate further compromise or lateral movement within a network. The relevant MITRE ATT&CK tactic here is "Privilege Escalation" (TA0004), specifically technique T1587.001 (Development of Custom Tools).

  The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command-line arguments and their context. The security impact of successfully executing such commands could lead to significant unauthorized access, control over sensitive processes, and potential data exfiltration. It is crucial to note that this detection does not confirm malicious intent on its own; legitimate administrative activities may trigger similar command patterns.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Check for command-line usage containing ' -s cmd', ' -s pwsh', or similar flags in Security Event ID 4688 or Sysmon Event ID 1. Malicious indicators often use these flags to invoke a command shell with elevated privileges.

  - **Verify process origin:** Confirm the file path of the executed process against known legitimate applications. Authentic processes should originate from system directories (e.g., C:\Windows\System32) rather than uncommon or user-generated paths.

  - **Identify legitimate usage:** Cross-reference the timestamps and affected hosts with administrative activity logs to identify authorized use of tools such as PsExec or PAExec. Legitimate activity typically shows regular usage patterns tied to maintenance tasks.

  - **Examine exclusion filter activity:** Investigate any command lines containing 'paexec' or 'PsExec', checking for falsely included benign usage, to ensure compliance with the exclusion filter within this detection rule.

  - **Correlate with additional logs:** Look for correlated security events like failed login attempts or unusual user activity that could indicate an escalation attempt. Checking the Windows Event logs can reveal anomalous login behavior that coincides with this activity.

  - **Assess asset criticality:** Determine if the affected system hosts sensitive applications or data; systems serving as domain controllers or database servers should be prioritized for investigation due to their critical roles in the enterprise.

  ---

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on sensitive systems and the likelihood of exploitation by threat actors employing privilege escalation techniques. The behaviors detected are often utilized in real-world attacks, making prompt investigation essential to mitigate risk.

  ---

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques where attackers rename or mask their tools to avoid detection. Reliability depends on comprehensive logging configurations, and lacking proper telemetry may lead to false negatives. Legitimate administrative actions, such as routine maintenance involving elevated privileges, might inadvertently trigger these alerts. Companion detections, such as those for T1587.002 (Development of Public Exploits), could enhance overall monitoring and incident response efficacy.

