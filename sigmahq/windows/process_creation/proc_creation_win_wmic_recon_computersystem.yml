note: |
  ### Technical Context
  This detection rule identifies when the Windows Management Instrumentation Command-line (WMIC) utility executes with the "computersystem" flag. By leveraging this command, attackers can gather critical information about the system, such as the domain name, username, model number, and more. This kind of reconnaissance is often a precursor to further exploitation, as attackers aim to understand the target environment better and identify potential vulnerabilities or valuable data to access.

  The primary motivation behind this behavior may stem from activities associated with threat actors who are performing initial reconnaissance as part of a broader attack strategy. Such actions are typically aligned with the MITRE ATT&CK framework's Tactic for **Discovery** (Tactic ID: TA0007) specifically tied to the technique **System Information Discovery** (Technique ID: T1047). The rule is instrumental in detecting early phases of attacks that could escalate into more damaging activities, such as credential theft or lateral movement.

  Key data sources for enabling effective detection include process creation events, which log command executions, along with system event logs that track WMIC usage. These sources provide the necessary context to identify potential misuse of the WMIC utility.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine the logs for any instances of `wmic.exe` execution. Look for the command line arguments to confirm if "computersystem" is being used as a parameter, indicating potential reconnaissance activity.

  - **Analyze User Context**: Determine the user account that executed the WMIC command. Check if this account has elevated privileges or is part of any known administrator groups, as this may indicate a higher risk of nefarious activity.

  - **Correlate With Other Logs**: Cross-reference the time of the WMIC execution with logs from other sources, such as network traffic monitoring (NDR) or firewall logs, to assess if there are any outbound connections to suspicious IPs or domains made shortly after the reconnaissance.

  - **Investigate Historical Execution**: Conduct a search through historical process creation logs for previous WMIC runs. Look for patterns or recurring usage by the same user or from the same machine, which could suggest ongoing reconnaissance efforts or compromised accounts.

  ### Prioritization
  This alert is assigned a medium severity level due to the potential for attackers to gather sensitive system information that can facilitate more severe attacks. While not inherently destructive, the reconnaissance phase is a critical precursor to actionable attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection if logging levels are not adequately configured to capture all WMIC command executions or if systems are not generating detailed process creation events. The detection logic assumes that the environment is at least somewhat monitored and that WMIC is not being used for legitimate administrative purposes; hence, context around user behavior is crucial for accurate assessment. Additionally, without monitoring tailored to the company's architecture (e.g., leveraging SIEM with correlation capabilities), the insights may remain limited.

