  ---

  ### Technical Context

  This rule detects the execution of the Windows Management Instrumentation Command-line (WMIC) utility with the "computersystem" flag, indicating an attempt to gather system information such as domain, username, and hardware model. The likely attacker objective is reconnaissance to enumerate system details that may aid in a later attack, such as gaining unauthorized access or lateral movement within a network. This behavior falls under the MITRE ATT&CK tactic of Discovery (TA0007) and the technique of System Information Discovery (T1047).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Process Creation events (Security Event ID 4688) where 'Image' ends with 'wmic.exe' and the CommandLine field contains 'computersystem'. If malicious, this behavior could enable attackers to gather necessary insights for executing further attacks. However, this detection alone does not confirm malicious intent, as legitimate system administrators may use WMIC for valid management tasks.

  ---

  ### Investigation Steps

  - **Verify event details and process creation logs**: Review Security Event ID 4688 for the specific process execution of 'wmic.exe'. Check the timestamp and user context. Legitimate administrative activities should correlate with familiar users or scheduled tasks.

  - **Analyze the CommandLine arguments**: Look specifically for instances of 'computersystem' in the CommandLine field. Any suspicious or unusual user accounts executing this command should be flagged as potential indicators of compromise.

  - **Cross-reference account activity**: Review the user account's login history (Event ID 4624) to assess its legitimacy. If the command was executed by a local account outside of normal operational hours, consider this a high-confidence malicious indicator.

  - **Check for related unusual system interactions**: Monitor for any subsequent command executions or lateral movement attempts within a window after the WMIC execution. Event IDs 4688 linked to abnormal commands might indicate further malicious activity.

  - **Identify competing artifacts**: Investigate any recent changes in system configuration or additional scripts executed following the WMIC command. For instance, if WMIC is followed by PowerShell scripts (Event ID 4104) that yield exfiltration attempts, flag this as malicious.

  - **Document legitimate use cases**: Note that administrators may use WMIC for system checks during maintenance. Compare against deployment schedules or known maintenance windows where use of such utilities would be expected.

  ---

  ### Prioritization

  This alert carries a medium severity rating given the context of the affected system and its potential exposure during reconnaissance activities. The likelihood of malicious use is noted, as WMIC is commonly exploited by attackers for gathering information before executing further attacks. The behavior, while not definitively malicious on its own, is a precursor to more significant threats.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers using alternative command-line tools or obfuscating parameter names to avoid telemetry capture. The required log sources include crucial Windows process creation logs, which must be enabled for effective detection. Legitimate activities such as routine administrative tasks may trigger the alert, necessitating careful contextual review. A related detection strategy could involve monitoring for unauthorized use of PowerShell (T1086), as it often accompanies WMIC usage for malicious purposes.

