  ---

  ### Technical Context

  This Sigma rule detects the execution of the Windows Management Instrumentation Command-line (WMIC) utility with the "computersystem" parameter. This behavior corresponds to reconnaissance activity where an adversary attempts to gather system information such as domain, username, and system model. The likely attacker objective is to obtain information for further exploitation or lateral movement.

  Relevant MITRE ATT&CK tactic: Discovery; Technique: System Information Discovery (T1047). The primary telemetry sources are Windows process creation logs and security logs specifically monitoring executions of WMIC. If malicious, this behavior can facilitate reconnaissance leading to targeted attacks or lateral movement within the environment. However, it does NOT confirm malicious intent on its own; legitimate administrative tasks may trigger this alert.

  ---

  ### Investigation Steps

  - **Review process execution logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 to confirm that WMIC.exe was executed, and verify the user context under which it ran.

  - **Inspect CommandLine parameters:** Analyze the CommandLine field for entries containing "computersystem." A legitimate execution may be accompanied by tasks like system updates or audits, while unfamiliar user contexts should raise suspicion.

  - **Check for unusual user activity:** Identify the user account triggering this alert. If the account is not typically associated with administrative tasks or if it is a standard user account running WMIC, this is a potential indicator of malicious behavior.

  - **Correlate with recent changes:** Look for any recent changes in the environment (e.g., new user accounts, privilege escalations, or unusual logins) in logs (such as Event ID 4624 - successful logon) that could contextualize the use of WMIC.

  - **Validate network connections:** Review network logs (e.g., firewall or proxy logs) for outbound connections initiated around the same time as the WMIC execution, particularly towards unusual external IPs.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity in an enterprise context because it indicates a potential reconnaissance attempt that could lead to larger attacks. The impact of the affected system is significant, especially if an administrative or sensitive account is exploited, and this behavior is commonly used by adversaries during initial phases of an attack.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of users legitimately running WMIC for system management, which could result in false positives. It’s crucial to ensure that Windows process creation logging is configured correctly. Legitimate administrative tasks, system inventory collections, or troubleshooting may trigger this alert. A companion detection involving the monitoring of lateral movement through other WMIC commands or PowerShell may provide additional context to strengthen coverage.

