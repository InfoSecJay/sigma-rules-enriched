note: |
  ### Technical Context

  The rule detects the execution of the WMIC (Windows Management Instrumentation Command-line) utility with the "computersystem" flag, indicating an attempt to gather system information such as domain, username, and machine model. This behavior often signifies reconnaissance by an adversary to understand the target environment, which may precede further malicious actions such as lateral movement or data exfiltration. This activity is associated with the MITRE ATT&CK tactic of Discovery (TA0007) and the technique T1047 (Windows Management Instrumentation).

  The primary telemetry source for this detection is Windows process creation events. The required log type for analysis includes Security Event ID 4688, which provides information about process creation, particularly the command line arguments used. If malicious, this activity can facilitate targeted attacks or operational planning. However, this detection does NOT confirm malicious intent on its own; WMIC can also be used for legitimate administrative tasks.

  ### Investigation Steps

  - **Identify execution context:** Check Security Event ID 4688 for `wmic.exe` process creation events. Look for the `CommandLine` field containing `computersystem` to confirm the specific WMIC usage.
  - **Review command history:** Inspect Windows PowerShell or command prompt logs for prior commands related to WMIC to establish context. Determine if the use of WMIC aligns with expected administrative practices for the affected asset.
  - **Correlate with user accounts:** Analyze user accounts associated with the `wmic.exe` execution. Legitimate user behavior typically involves only a handful of administrative accounts, while unexpected accounts may indicate potential credential compromise.
  - **Monitor system role:** If the asset is classified as critical (e.g., domain controllers or servers), prioritize this alert for further investigation due to potential impacts on the broader environment.
  - **Identify malicious indicators:** Look for suspicious process parents (e.g., cmd.exe or PowerShell) or validate if `wmic.exe` execution is preceded by known malicious tools or techniques, indicating a broader attack vector.
  - **Analyze logins:** Review Windows Security Event IDs related to logon sessions (ID 4624). Determine if the timing of the WMIC execution coincides with unusual login patterns or logins from atypical locations.

  ### Prioritization

  This alert has medium severity due to the potential impact of reconnaissance on critical systems. The usage of WMIC in this context is commonly leveraged by attackers, particularly if tied to subsequent malicious actions or unexpected account behavior.

  ### Blind Spots and Assumptions

  This rule may have limitations if WMIC execution is being done through legitimate administrative scripts or tools. Ensure log collection is comprehensive for proper detection, as the failure to capture Security Event IDs may lead to missed alerts. Legitimate user activities that might generate similar logs could include system audits. A related detection could include monitoring for the use of PowerShell commands associated with system querying to strengthen overall coverage against reconnaissance activities.

