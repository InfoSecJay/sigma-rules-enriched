note: |
  ### Technical Context
  This detection rule monitors for the execution of SharpView, a reconnaissance tool that enables attackers to gather information about Active Directory (AD) environments. By executing SharpView, an attacker may seek to identify network configurations, user access rights, and other sensitive information that could facilitate lateral movement or privilege escalation within the targeted organization. SharpView can be utilized by both legitimate system administrators for auditing and by adversaries for malicious intent, making its detection critical in a security context.

  Relevant MITRE ATT&CK tactics/techniques associated with this detection include:
  - **Discovery, T1049**: Adversaries may use tools like SharpView to perform network and service discovery.
  - **Account Discovery, T1087**: Gathering information on user accounts within the system.
  - **Domain Trust Discovery, T1482**: Understanding trust relationships can facilitate attacks between domains.
  - **Permission Groups Discovery, T1069.002**: Analyzing membership of groups can reveal escalation paths within AD.

  Primary data sources for this detection include process creation events, which log the execution of binaries like SharpView, and command line arguments that can reveal specific reconnaissance activities being performed.

  ### Investigation Steps
  - **Review Process Creation Log:** Analyze process creation events for instances of `SharpView.exe` being executed. Collect details on the process ID, parent process, and user context.
  - **Examine Command Line Arguments:** Inspect the command line used when executing SharpView for notable parameters that indicate information discovery activities. Focus on commands such as `Get-DomainUser`, `Find-DomainShare`, or any that include `Find-Interesting`.
  - **Analyze Network Connections:** Investigate any outbound or local network connections made by the process. Note connections to suspicious targets that might indicate exfiltration or further reconnaissance.
  - **Cross-reference User Accounts:** Determine the user account context under which SharpView was executed. Assess if the account has elevated privileges or if the execution originated from a suspicious machine or location.

  ### Prioritization
  This alert has a high severity due to its association with reconnaissance activities that could indicate preparation for further exploitation in the environment. The ability to gather intelligence on the network makes it crucial to address promptly, as it may lead to more severe threats such as lateral movement or privilege escalation.

  ### Blind Spots and Assumptions
  This detection rule may not cover cases where SharpView is executed from non-standard file paths or when the executable is renamed or obfuscated to evade detection. Additionally, it assumes that appropriate logging configurations are enabled for process creation events, as well as capturing detailed command line arguments. Without these logs, detection will be incomplete, potentially leaving gaps in the coverage of reconnaissance activities involving SharpView.

