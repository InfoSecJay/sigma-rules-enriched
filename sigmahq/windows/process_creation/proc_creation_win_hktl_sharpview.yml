note: |
  ### Technical Context

  This Sigma rule detects the execution of SharpView.exe, a tool often used by adversaries for information gathering and reconnaissance within Active Directory (AD) environments. The typical attacker objective includes mapping user accounts, groups, permissions, and various AD objects to identify potential targets for further attack. This activity supports tactics such as Discovery (MITRE ATT&CK Tactic ID: TA0007) and specifically relates to techniques like Network Service Scanning (T1049) and Account Discovery (T1087).

  The primary telemetry sources required for this detection include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, the execution of SharpView.exe can lead to unauthorized data exposure or targeted further attacks against critical infrastructure. It is essential to note that this detection does not confirm an attack on its own; further investigation is required to ascertain intent and effect.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 to confirm the execution of SharpView.exe. Look for log entries with "New Process Name" containing "\SharpView.exe" and capture the user context under which it was executed.

  - **Analyze command line arguments:** Examine the command line used during the execution of SharpView.exe from logs. Specific flags like 'Get-DomainUser' or 'Find-DomainUserLocation' indicate active reconnaissance efforts typically associated with malicious intent.

  - **Identify the executing user:** Determine whether the user account running SharpView.exe has legitimate administrative privileges. Regular users should not run this tool, so suspicious patterns may indicate a potential compromise.

  - **Review network activity:** Look for unusual inbound or outbound connections established by the host during the time frame of SharpView.exe execution. Use Windows Firewall logs (Event ID 5156) to track any unexpected external communication.

  - **Investigate previous legitimate use:** Assess logs for prior legitimate usage of SharpView.exe in the environment. Track common user behavior for authorized administrative tasks that may necessitate AD queries, establishing a baseline for comparison.

  - **Correlate with lateral movement indicators:** Cross-reference detected execution of SharpView.exe with other logs for lateral movement activities, especially those related to account enumeration or privilege escalation (e.g., tickets or sessions established with 'Get-SPNTicket').

  ### Prioritization

  This alert is of high severity as it indicates potential active reconnaissance on critical parts of the infrastructure by malicious actors. The likelihood of exploitation is moderate to high, especially if used in tandem with other attack techniques targeting user credentials or access escalation. Since reconnaissance tools are frequently weaponized, rapid investigation is warranted.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate instances of SharpView.exe being executed by authorized personnel, resulting in potential false positives. It's crucial to ensure Windows process logging is enabled for reliable detection. Additionally, similar tools or scripts that provide similar functionalities may trigger the alert. A companion detection, such as monitoring for unusual PowerShell activities linked to AD enumeration (e.g., unauthorized use of PowerView), would enhance overall protection.

