  ---

  ### Technical Context

  This Sigma rule detects the deletion of all backups or system state backups using the "wbadmin.exe" command-line utility on Windows systems. This behavior is indicative of attacker activities aiming to disable recovery mechanisms, a common tactic utilized in ransomware attacks to hinder data recovery efforts. The relevant MITRE ATT&CK tactic is "Impact" and the technique is T1490 (Inhibit System Recovery).

  The primary telemetry source is process creation logs, specifically looking for executions of wbadmin.exe. The potential security impact of this activity is significant, as it could lead to permanent data loss and operational disruptions. It is crucial to note that this detection does NOT confirm malicious intent on its own; it merely indicates a potentially harmful action was taken which requires further investigation.

  ---

  ### Investigation Steps

  - **Verify command execution details:** Check for Security Event ID 4688 logs to capture the execution of wbadmin.exe. Look for CommandLine fields that include "delete backup" or "keepVersions:0," indicating an attempt to delete backups.

  - **Inspect system logs for legitimate usage:** Review logs to identify any documented and legitimate usage of wbadmin.exe for backup management by IT personnel. Look for command syntax including version management or specific backup targets, which could indicate approved behavior.

  - **Identify potential malicious indicators:** Look for abnormal patterns in the event logs, such as repeated executions of wbadmin.exe in a short period, especially outside of business hours, which may indicate malicious activity. Cross-reference with User IDs to assess if it was executed by an authorized administrator or a non-standard account.

  - **Assess impacted systems and roles:** Verify the criticality of the affected systems utilizing the Windows Backup feature. Investigate the network segment and role of the host where the alert was triggered (e.g., file server, application server).

  - **Correlate with ransomware threats:** Cross-reference the use of wbadmin.exe command with known ransomware IOCs, particularly focusing on the related detection rule ID (89f75308-5b1b-4390-b2d8-d6b2340efaf8), which relates to similar backup deletion tactics used by ransomware families.

  ---

  ### Prioritization

  This alert is high-severity due to the critical nature of data backups in enterprise environments. The deletion of backups greatly increases the likelihood of successful adversary actions leading to data loss, as this behavior is a well-documented tactic of ransomware attacks.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detecting covert or misused administrative actions if not all relevant logs are collected, such as service logs that could provide context on wbadmin executions. Legitimate administrative activities like scheduled backup deletions may trigger this alert unintentionally. A related detection that enhances coverage would be monitoring for unusual user account behavior, especially around administrative commands or elevated privileges.

