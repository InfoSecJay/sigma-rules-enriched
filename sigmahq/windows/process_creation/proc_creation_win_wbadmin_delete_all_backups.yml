detection:
  selection_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'delete'
    - 'backup'         # Also covers "SYSTEMSTATEBACKUP"
    CommandLine|contains: 'keepVersions:0'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `wbadmin.exe` utility with commands that delete all backups or system state backups, targeting the option `keepVersions:0`. The likely attacker objective is to eliminate recovery options on compromised systems, commonly used in ransomware attacks to prevent victims from restoring data. This behavior aligns with the MITRE ATT&CK tactic of Impact (T1490: Inhibit System Recovery). Primary telemetry sources include Windows Process Creation events (Security Event ID 4688) and Sysmon Event ID 1 for detailed command line activity. The security impact of this action is significant, as it can lead to total data loss if backups are rendered inaccessible. Importantly, this detection does NOT confirm that a malicious actor executed the command; it merely identifies the behavior indicative of potential sabotage.

  ### Investigation Steps

  - **Verify event data from wbadmin.exe execution:** Check Security Event ID 4688 for process creation events where Image ends with `\wbadmin.exe` to confirm the execution of the deletion command.

  - **Analyze command line arguments:** Review the CommandLine field in Event ID 4688 or Sysmon Event ID 1 for the presence of the terms 'delete', 'backup', and 'keepVersions:0'. The presence of this specific combination is indicative of potential malicious behavior.

  - **Check for legitimate execution of wbadmin:** Look for expected legitimate usage patterns of wbadmin, such as backup creation commands that include 'start backup' rather than 'delete'.

  - **Assess user account activity:** Investigate the user account that initiated the command for unusual activity or behavior preceding the alert, focusing on any account anomalies (Event ID 4624).

  - **Correlate with system state and backup log artifacts:** If applicable, review backup server logs or Windows Event Log entries (Event ID 4 from Windows Backup) to evaluate whether any scheduled backup operations were running prior to command execution.

  ### Prioritization

  Alerts generated from this rule should be considered high priority due to the critical nature of the affected systems and the high likelihood of malicious intent, particularly in environments with important data retention policies. The behavior described is often weaponized by various ransomware strains, amplifying its severity.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use alternative methods or tools to delete backups, such as direct file manipulation or WMI commands. It requires that the Windows Backup service is enabled and logged; otherwise, relevant events may not be available for analysis. Legitimate administrative tasks, particularly clean-up or proactive maintenance, may trigger this alert if not contextualized properly. A related detection to consider is one monitoring WMI commands (e.g., T1490) that could complement this detection for earlier stage activities.

