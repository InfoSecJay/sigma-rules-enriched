detection:
  selection_img:
  - Image|endswith: '\wbadmin.exe'
  - OriginalFileName: 'WBADMIN.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'delete'
    - 'backup'         # Also covers "SYSTEMSTATEBACKUP"
    CommandLine|contains: 'keepVersions:0'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the use of "wbadmin.exe" to delete all backups, including system state backups on Windows Server platforms. This is a recognized tactic employed by various ransomware families to eliminate recovery options and increase the chances of successful data encryption. Attackers often aim to disrupt organizational operations and extort victims by rendering their data unrecoverable unless a ransom is paid.

  The relevant MITRE ATT&CK tactics and techniques associated with this activity include "Impact" (TA0040) and "Data Destruction" (T1490). Anomalies related to "wbadmin.exe" can provide insight into ongoing malicious actions, highlighting potential ransomware infections or insider threats.

  The primary data sources for detecting this behavior are Windows process creation events that log executions of "wbadmin.exe." Additionally, monitoring command line parameters associated with these executions can yield critical contextual information about delete operations undertaken against backups.

  ### Investigation Steps
  - **Validate Process Creation Events**: Review Windows process creation logs for instances of "wbadmin.exe" being executed, specifically targeting those events where the command line arguments include "delete" or "keepVersions:0".

  - **Analyze Command Line Parameters**: Pay close attention to the complete command line of the "wbadmin.exe" executions and look for malicious intent indicated by the presence of backup deletion commands.

  - **Investigate Unauthorized Access**: Check for abnormal user account activity related to the execution of "wbadmin.exe". This may include elevated privileges or actions taken by service accounts that typically do not engage in system backup operations.

  - **Correlate with Other Logs**: Supplement process creation data with logs from endpoint detection and response (EDR) tools, focusing on any alerts or behaviors that may indicate concurrent ransomware activity or unauthorized backup management.

  ### Prioritization
  Due to the significant impact of losing backup data and the high likelihood that this activity is associated with a ransomware attack, this alert should be treated with high severity in an enterprise environment. Failure to respond could result in irreversible data loss and significant operational disruptions.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if "wbadmin.exe" is executed with alternate obfuscations or if backups are deleted through other means not involving this specific utility. The detection logic assumes that proper logging is enabled for process creation events. Additionally, this alert relies on the presence of Windows Backup being configured on servers within the monitored environment, which may not always be the case. It is critical that comprehensive logging practices are in place to ensure this detection can be effectively utilized.

