note: |
  ### Technical Context

  This rule detects the deletion of all backups using the `wbadmin.exe` command-line utility, specifically targeting the `keepVersions:0` parameter that signifies the complete removal of backup data. The likely objective of an attacker leveraging this technique is to hinder recovery operations, which is common in ransomware attacks. This behavior aligns with the MITRE ATT&CK technique T1490: "Inhibit System Recovery."

  The primary telemetry source is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which record process invocations. If the activity is malicious, it could severely impact data availability and recovery capabilities within the affected environment. Importantly, while this detection can indicate a potential ransomware activity, it does not confirm successful execution of ransomware or that the backups were genuinely deleted, as legitimate administrative actions might trigger the same alert.

  ### Investigation Steps

  - **Verify the process creation event:** Review Security Event ID 4688 or Sysmon Event ID 1 for the creation of `wbadmin.exe`. Check the `CommandLine` field for the presence of `delete` and `backup`.
  - **Assess command-line parameters:** Look for `keepVersions:0` in the command line. If present, further investigate the context surrounding this command, as it indicates an intent to delete all backups.
  - **Identify the user context:** Correlate the process creation with the user account executing it. Evaluate whether the user possesses backup administration privileges or if this account is unusual in the context of backup operations.
  - **Check for legitimate administrative activity:** Confirm if typical administrative maintenance tasks are being conducted around the same time as the alert (for instance, creation or configuration of backups). This could indicate benign behavior if substantiated.
  - **Monitor for preceding ransomware indicators:** Look for other suspicious activities leading to this action, such as unauthorized file encryption attempts or suspicious process escalations (e.g., processes with unusual parent-child relationships).
  - **Analyze system backup logs:** Check Windows Server backup logs or event logs related to backup operations (Event ID 4 from the Windows Backup service) to confirm the existence of backups before the deletion event took place.

  ### Prioritization

  This alert is high-priority due to the critical impact on data recovery processes if successful. The likelihood of this behavior being exploited by adversaries is significant, especially as it is commonly employed in ransomware operations. The deletion of all backups could severely undermine organizational response efforts.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations; auditing of command-line arguments must be enabled to capture `wbadmin.exe` actions effectively. Legitimate use cases, such as administrative personnel performing scheduled maintenance or cleanup of older backups, can trigger this alert. Companion detections involving the monitoring of unauthorized encryption activities could enhance coverage and detection accuracy.

