logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: add more lolbins for additional coverage
  - Image|endswith:
    - '\calc.exe'
    - '\certutil.exe'
    - '\cmstp.exe'
    - '\cscript.exe'
    - '\installutil.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'CALC.EXE'
    - 'CertUtil.exe'
    - 'CMSTP.EXE'
    - 'cscript.exe'
    - 'installutil.exe'
    - 'MSHTA.EXE'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
    - 'wscript.exe'
  filter_main_currentdirectory:
    CurrentDirectory|contains: 'C:\'
  filter_main_empty:
    CurrentDirectory: ''
  filter_main_null:
    CurrentDirectory:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rare false positives could occur on servers with multiple drives.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of Living Off the Land Binaries (LOLBINs) from uncommon drives, such as mounted ISO images. The behavior indicates potential misuse of legitimate binaries to evade defenses, often aiming for lateral movement or establishing persistence during a compromised session. The relevant MITRE ATT&CK tactics include **Defense Evasion (T1218)** and **Lateral Movement (T1075)**.

  The primary telemetry sources are Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity could indicate an adversary utilizing LOLBINs to execute unauthorized tasks or install malware. Importantly, the detection does not confirm an active compromise on its own; further investigation is required to establish intent and context.

  ### Investigation Steps

  - **Examine process creation logs:** Look for Security Event ID 4688 and Sysmon Event ID 1 for the execution of LOLBINs (e.g., calc.exe, certutil.exe) and confirm the command line arguments for anomalies or known malicious patterns.

  - **Review current working directory:** Check the `CurrentDirectory` field in the logs. Legitimate applications typically execute from `C:\` or standard application paths. Any execution from mounted drives or unusual directories is suspicious.

  - **Identify parent process:** Identify the parent process and its execution context (via Event ID 4688's `ProcessId` and `ParentProcessId`). If the parent process is itself abnormal or indicative of abuse (e.g., PowerShell, cmd.exe), it could be a high-confidence malicious indicator.

  - **Correlate with other telemetry:** Cross-reference with file access logs (e.g., Sysmon Event ID 11) to verify if any files were created, modified, or accessed on the suspicious drive following the execution of these binaries.

  - **Assess asset criticality:** If this behavior is observed on critical infrastructure or sensitive servers, prioritize the investigation due to the heightened risk of severe impact.

  ### Prioritization

  This alert should be regarded as medium severity due to the potential impact of LOLBIN misuse on critical systems. The likelihood of malicious usage is significant, given the commonality of such methods in adversarial tactics. The behavior indicates a possible breach or lateral movement, necessitating quick follow-up.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of relevant logs from systems where processes are executed, or if auditing is not properly enabled. Legitimate software installations or maintenance activities could inadvertently trigger this alert, especially in environments with multiple drives. Companion detections to consider include alerts for abnormal PowerShell script execution or suspicious file access patterns that can further validate potential malicious behavior.

