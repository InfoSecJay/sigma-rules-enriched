detection:
  selection:
        # Note: add more lolbins for additional coverage
  - Image|endswith:
    - '\calc.exe'
    - '\certutil.exe'
    - '\cmstp.exe'
    - '\cscript.exe'
    - '\installutil.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'CALC.EXE'
    - 'CertUtil.exe'
    - 'CMSTP.EXE'
    - 'cscript.exe'
    - 'installutil.exe'
    - 'MSHTA.EXE'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
    - 'wscript.exe'
  filter_main_currentdirectory:
    CurrentDirectory|contains: 'C:\'
  filter_main_empty:
    CurrentDirectory: ''
  filter_main_null:
    CurrentDirectory:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rare false positives could occur on servers with multiple drives.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of Living Off The Land Binaries (LOLBINs) from atypical or uncommon drives, such as mounted disk images or USB drives. LOLBINs are legitimate Windows binaries that attackers utilize to evade detection while executing malicious activities. By launching these binaries from unexpected locations, attackers may aim to bypass security measures, establish persistence, or facilitate lateral movement within the environment. The use of uncommon drives can indicate nefarious intent, especially if they are employed to hide malware execution or to manipulate the Windows environment without being detected.

  The relevant MITRE ATT&CK techniques for this detection include **T1203 - Exploitation for Client Execution**, where attackers exploit vulnerabilities to execute code, and **T1218 - Signed Binary Proxy Execution**, given that LOLBINs are often valid Windows binaries being misused. This rule is primarily supported by telemetry from process creation events, which provide insights into executable activities and the directories from which they are launched.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events for instances where the detected LOLBINs were executed from drives other than the default system drive (C:\). Pay particular attention to the command-line arguments used during execution.

  - **Examine Current Directory Context:** Check the `CurrentDirectory` values associated with the executed processes. Unusual values indicating mounted drives or adjacent paths can help confirm suspicious behavior.

  - **Correlate with File System Changes:** Investigate any recent changes or access patterns on the drive where the LOLBIN was executed. Look for anomalies that may suggest the drive was compromised or used for malicious purposes.

  - **Identify Related Activities:** Cross-reference logs against other security tools (e.g., EDR or NDR solutions) to identify potentially malicious behavior, such as lateral movement or privilege escalation tactics linked to the execution of the LOLBINs.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of the identified behavior. Executions of LOLBINs from non-standard locations typically signify malicious activity aimed at obfuscation, placing this behavior in the realm of serious security threats that require prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where the use of multiple external drives or mounted volumes is routine, leading to potential false positives. The detection logic assumes that the environment's benign processes are well-understood and that unusual execution paths typically correlate with malicious intent. Additionally, relevant logging configurations must be enabled on endpoint devices to ensure that process creation data is available for review, which could include monitoring of non-standard drive executions across various user accounts.

