logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: add more lolbins for additional coverage
  - Image|endswith:
    - '\calc.exe'
    - '\certutil.exe'
    - '\cmstp.exe'
    - '\cscript.exe'
    - '\installutil.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'CALC.EXE'
    - 'CertUtil.exe'
    - 'CMSTP.EXE'
    - 'cscript.exe'
    - 'installutil.exe'
    - 'MSHTA.EXE'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
    - 'wscript.exe'
  filter_main_currentdirectory:
    CurrentDirectory|contains: 'C:\'
  filter_main_empty:
    CurrentDirectory: ''
  filter_main_null:
    CurrentDirectory:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rare false positives could occur on servers with multiple drives.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of Living-off-the-Land Binaries (LOLBINs) from an unusual drive, such as mounted ISO images, which is often indicative of an adversary attempting to execute malicious scripts or code while evading traditional security measures. The likely objective of the attacker is to leverage common tools already present in the system to achieve persistence or conduct further malicious activities while minimizing detection.

  This behavior maps to the MITRE ATT&CK technique **"External Remote Services" (T1133)**, as execution might occur from a remote location via mounted drives. The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688, along with Sysmon Event ID 1 for detailed process execution details. If malicious, this activity could lead to system compromise or lateral movement within the network. It is important to note that this detection alone does not confirm malicious intent, as benign administrative tasks or legitimate use of LOLBINs under unusual circumstances can also trigger the alert.

  ### Investigation Steps

  - **Assess process details:** Review Security Event ID 4688 and Sysmon Event ID 1 for the process creation record. Confirm the `Image` fields that match LOLBINs (e.g., `calc.exe`, `certutil.exe`) and the `CommandLine` field to understand execution context.

  - **Review execution path:** Check the `CurrentDirectory` field in Sysmon logs. If it points to a non-standard location (i.e., not `C:\`), flag it as suspicious. Legitimate applications typically execute from standard or expected directories.

  - **Track parent processes:** Investigate the parent processes for the detected LOLBINs using Event ID 4688. If the parent is a known, benign application, the activity may be justified, whereas unexpected parent processes could indicate malicious intent.

  - **Check for unusual drive mounts:** Cross-reference the execution against Windows Event ID 1006 (removable storage device insertion) or device management logs to find out how and when the unusual drive was mounted, indicating potential malicious manipulation.

  - **Identify known malicious use cases:** Validate against threat intelligence sources or internal logs to see if similar behavior has been executed, particularly associated with known threats like Diavol ransomware or Qakbot, which may employ such tactics.

  - **Monitor for file creation or modifications:** Inspect paths for any changes in files or unusual creation patterns related to the detected process, including Event ID 4663 (attempted access) to identify potential data exfiltration or manipulation attempts.

  ### Prioritization

  The severity of this alert is medium because it may indicate an initial foothold or lateral movement by an attacker using common tools, which can lead to a variety of malicious outcomes. Given that the execution of LOLBINs from abnormal locations is not a common practice, the likelihood of malicious abuse is significant but does require further investigation to confirm intent.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for false positives from legitimate users intentionally executing LOLBINs for valid reasons, particularly in environments with multiple drives. It is crucial to ensure relevant logs, such as Sysmon and Security Event logs, are properly configured for reliable detection. Additionally, benign activities like software installations or administrative scripts may trigger the alert. Related detections, such as monitoring for unusual command-line arguments or parent-child process relationships, strengthen coverage against this type of behavior.

