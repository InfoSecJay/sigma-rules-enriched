title: Msiexec Quiet Installation
id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
status: test
description: |
  Adversaries may abuse msiexec.exe to proxy execution of malicious payloads.
  Msiexec.exe is the command-line utility for the Windows Installer and is thus commonly associated with executing installation packages (.msi)
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
- https://twitter.com/_st0pp3r_/status/1583914244344799235
author: frack113
date: 2022-01-16
modified: 2024-12-01
tags:
- attack.stealth
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  filter_user_temp:
        # The %temp% is a very common location for installers
    ParentImage|startswith: 'C:\Users\'
    ParentImage|contains: '\AppData\Local\Temp\'
  filter_system_temp:
    ParentImage|startswith: 'C:\Windows\Temp\'
  filter_ccm:
    ParentImage: 'C:\Windows\CCM\Ccm32BitLauncher.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- WindowsApps installing updates via the quiet flag
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msiexec.exe` with various command-line parameters indicative of a quiet installation of potentially malicious software. Attackers often use `msiexec.exe` to run installation packages stealthily, masking their activity from casual users and security tools, which aligns with the technique of "Obfuscated Files or Information" (T1027) in the MITRE ATT&CK framework. The primary telemetry sources for detection are process creation logs, particularly focusing on command lines that include quiet installation flags (e.g., `-q`) and the contexts in which they occur.

  If such an installation is malicious, it can facilitate the deployment of threat actors' payloads without user approval or awareness, increasing the likelihood of successful compromise. However, it should also be noted that the existence of this alert does not confirm malicious activity on its own, as legitimate software installations often use similar command line parameters.

  ### Investigation Steps

  - **Review the command line arguments of the detected processes:** Check for the presence of `-q` among other silent installation flags in process creation logs (Event ID 4688) to confirm quiet installation behavior. Compare with benign patterns typical for enterprise software installations.

  - **Check the parent process context:** Look at the `ParentImage` field for the detected `msiexec.exe` process. Investigate if it originates from common trusted paths like `C:\Windows\Installer` or the specific software distribution tools (e.g., `Ccm32BitLauncher.exe`), as these may indicate legitimate installations.

  - **Correlate with user activity:** Review usage patterns in the user’s context to determine if they have legitimate software installation needs. Check for recent user-initiated actions in C:\Users\{username}\AppData\Local\Temp that correspond with the time of detection.

  - **Evaluate file drop locations:** Analyze the content and behavior of any new files created in `%temp%` or destination paths linked to the `msiexec.exe` execution. Be wary of MSI files or newly installed applications that appear unfamiliar.

  - **Look for reports of user complaints or issues:** Conduct user interviews or IT helpdesk ticket checks to gauge if there have been complaints surrounding installations that may have coincided with the detection timestamp.

  - **Identify additional suspicious activity:** Look for lateral movement or credential theft indicators around the same time, as adversaries often chain multiple techniques to maintain persistence (consider cross-reference with successful commands in security logs).

  ### Prioritization

  The alert has medium severity due to the potential impact of compromised systems resulting from unauthorized installations. The likelihood of abuse is moderate, as attackers often leverage common tools like `msiexec.exe` for stealthy operations. While this behavior represents a red flag, it also occurs in benign contexts, necessitating careful analysis before concluding malicious intent.

  ### Blind Spots and Assumptions

  There are limitations in detecting all evasion techniques as attackers may obfuscate or modify command line parameters to bypass detection. Logs must accurately capture process creation events and include complete command line data to ensure reliable detection, highlighting the importance of Sysmon configurations in this respect. Legitimate software update processes may trigger the alert, which can complicate investigations. Companion detections for suspicious activities involving `msiexec` should include alerts on MSI file creations or modifications (T1125), as this would enhance coverage and context.

