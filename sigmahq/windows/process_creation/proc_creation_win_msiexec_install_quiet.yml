title: Msiexec Quiet Installation
id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
status: test
description: |
  Adversaries may abuse msiexec.exe to proxy execution of malicious payloads.
  Msiexec.exe is the command-line utility for the Windows Installer and is thus commonly associated with executing installation packages (.msi)
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
- https://twitter.com/_st0pp3r_/status/1583914244344799235
author: frack113
date: 2022-01-16
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  filter_user_temp:
        # The %temp% is a very common location for installers
    ParentImage|startswith: 'C:\Users\'
    ParentImage|contains: '\AppData\Local\Temp\'
  filter_system_temp:
    ParentImage|startswith: 'C:\Windows\Temp\'
  filter_ccm:
    ParentImage: 'C:\Windows\CCM\Ccm32BitLauncher.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- WindowsApps installing updates via the quiet flag
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msiexec.exe` with quiet installation parameters, indicating potential malicious use to install software without user interaction. Attackers may exploit this behavior to deploy unwanted software or malware surreptitiously, aiming to maintain persistence or escalate privileges. This activity aligns with the MITRE ATT&CK technique T1218.007 (Signed Binary Proxy Execution: Msiexec).

  Primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which detail command-line executions and the parent-child relationships of processes. If malicious, the security impact could range from unauthorized software installation to a complete compromise of system integrity. Importantly, this detection does not confirm malicious intent on its own; additional contextual analysis is required.

  ### Investigation Steps

  - **Check the process command line:** Review the command line for `msiexec.exe` (Event ID 4688 or Sysmon Event ID 1) for the presence of quiet installation flags such as `-q`, alongside installation parameters like `-i` or `-package`. Malicious installations often combine both flags, whereas legitimate use generally lacks quiet flags in user-initiated operations.

  - **Identify parent process:** Examine the `ParentImage` field for the process that invoked `msiexec.exe`. A parent process like `C:\Windows\System32\mspmsnsv.exe` may suggest standard operation, whereas unusual parent processes (e.g., browsers or third-party app installers) warrant deeper scrutiny.

  - **Analyze the integrity level:** Review the `IntegrityLevel` field in the logs. Specific entries such as `S-1-16-16384` (high integrity) in conjunction with the observed command pattern can indicate malicious use, as legitimate installers usually operate at lower integrity levels unless they are escalating privileges.

  - **Validate temporary file usage:** Confirm the presence of `msi` or installer packages in typical temporary directories (e.g., `%temp%`, `C:\Windows\Temp`) during the execution timeframe. Unexpected files created or modified alongside `msiexec.exe` are red flags.

  - **Assess user context:** Identify the user account under which `msiexec.exe` was executed. If a standard user initiated a quiet installation without appropriate administrative authorization, this could indicate a potential abuse scenario.

  - **Observe for repeat patterns:** Review historical data for the flagged host to identify if there are recurring instances of `msiexec.exe` executions with similar flags, especially within a short timeframe, suggesting a pattern of potential abuse or automated scripts.

  ### Prioritization

  The severity of this alert is medium due to the potential for high-impact malicious activity on key enterprise systems. The likelihood of adversarial exploitation is moderate, as quiet installations are a commonly weaponized method for executing payloads without drawing user attention. Further contextual data is imperative for effective risk assessment.

  ### Blind Spots and Assumptions

  Detection may fail if the logging configuration does not capture process creation logs comprehensively. Adversaries might circumvent detection through obfuscation techniques, such as renaming `msiexec.exe` or using different arguments. Additionally, legitimate software updates, particularly for Windows applications, may trigger this alert when installed quietly. Companion detections involving unusual process behavior or network connections can enhance visibility and context around potential malicious activities.

