title: Msiexec Quiet Installation
id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
status: test
description: |
  Adversaries may abuse msiexec.exe to proxy execution of malicious payloads.
  Msiexec.exe is the command-line utility for the Windows Installer and is thus commonly associated with executing installation packages (.msi)
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
- https://twitter.com/_st0pp3r_/status/1583914244344799235
author: frack113
date: 2022-01-16
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  filter_user_temp:
        # The %temp% is a very common location for installers
    ParentImage|startswith: 'C:\Users\'
    ParentImage|contains: '\AppData\Local\Temp\'
  filter_system_temp:
    ParentImage|startswith: 'C:\Windows\Temp\'
  filter_ccm:
    ParentImage: 'C:\Windows\CCM\Ccm32BitLauncher.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- WindowsApps installing updates via the quiet flag
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious use of `msiexec.exe`, the Windows command-line utility for handling Windows Installer packages. Attackers may abuse this tool to silently execute malicious software using the quiet installation flag (`-q`). By executing payloads in this manner, adversaries can avoid alerting users and may maintain persistence or exfiltrate sensitive data without raising suspicion.

  The most relevant MITRE ATT&CK tactics and techniques applicable to this rule include **Defense Evasion (TA0005)** and **Execution (TA0002)**, specifically focusing on the technique of **Application Layer Protocol Abuse (T1218.007)**. This technique reflects how adversaries might leverage legitimate applications to execute their malicious code, complicating detection efforts.

  Primary data sources for effective detection include **process creation events** that log command-line arguments used during execution, as well as **parent process information** to understand the context from which `msiexec.exe` was invoked. This information can help identify whether the execution was legitimate or indicative of an intrusion attempt.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for instances of `msiexec.exe` being executed with potential malicious command-line arguments, especially those containing `-q` and other silent installation flags.
  - **Analyze Parent Process Information**: Investigate the parent processes of `msiexec.exe` executions, focusing on the context under which they were launched. Pay particular attention to processes originating from unusual directories like `%temp%` or system-based applications.
  - **Cross-Reference with Known Applications**: Validate any detected `msiexec.exe` executions against a whitelist of legitimate software installers and applications that may use the installer in quiet mode, ensuring that true positives are accurately identified.
  - **Monitor for Anomalous Execution Patterns**: Look for unusual patterns, such as the execution of `msiexec.exe` from non-standard directories or after hours, which may suggest unauthorized activity.

  ### Prioritization
  The alert's severity is considered medium due to the potential for dangerous payload execution without user interaction, but it typically requires additional context or confirmation of malicious intent to warrant an immediate response.

  ### Blind Spots and Assumptions
  This detection relies on the correct logging of process creation events and their associated command-line details, which may not always be enabled in all environments. A gap may exist if there are applications legitimately using quiet installations that resemble malicious behavior, leading to false positives. Additionally, detection may be hindered if attackers employ obfuscation techniques or utilize alternative methods of execution not captured by this rule. It is assumed that logs from standard logging configurations are available and that security monitoring tools are correctly set up to process these events for effective detection.

