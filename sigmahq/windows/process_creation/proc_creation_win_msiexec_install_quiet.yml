title: Msiexec Quiet Installation
id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
status: test
description: |
  Adversaries may abuse msiexec.exe to proxy execution of malicious payloads.
  Msiexec.exe is the command-line utility for the Windows Installer and is thus commonly associated with executing installation packages (.msi)
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
- https://twitter.com/_st0pp3r_/status/1583914244344799235
author: frack113
date: 2022-01-16
modified: 2026-07-28
tags:
- attack.stealth
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  filter_main_system_temp:
    ParentImage|startswith: 'C:\Windows\Temp\'
  filter_main_ccm:
    ParentImage: 'C:\Windows\CCM\Ccm32BitLauncher.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_optional_user_temp:
        # The %temp% is a very common location for installers
    ParentImage|startswith: 'C:\Users\'
    ParentImage|contains: '\AppData\Local\Temp\'
  filter_optional_wsl:
        # C:\WINDOWS\system32\msiexec.exe /quiet /i "C:\Users\xodih\AppData\Local\Temp\wsl.2.6.3.0.arm64 (2).msi" SKIPVALIDATION=1 /L*V C:\Users\xodih\AppData\Local\Temp\wsl-install-logs.txt
    ParentImage|endswith: 'C:\Windows\System32\wsl.exe'
    Image|endswith: 'C:\Windows\System32\msiexec.exe'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- WindowsApps installing updates via the quiet flag
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of `msiexec.exe`, a command-line utility for Windows Installer, to silently install software packages with the `-q` (quiet) option alongside other installation flags. Attackers may exploit this behavior to execute malicious payloads without user interaction, typically aiming to install malware or persistence mechanisms undetected. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **T1218.007** (Packaged Application Execution).

  The primary telemetry source is Windows process creation logs, specifically focusing on command-line arguments used with `msiexec.exe`. If the detected behavior is indeed malicious, it could lead to unauthorized software installation and potentially a compromised system. Importantly, this detection does NOT confirm malicious activity on its own; the context and command-line parameters used must be analyzed in conjunction with other investigative steps.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 for instances of `msiexec.exe`. Look for CommandLine arguments containing `-q` and any installation flags. Ensure that the installation package paths do not originate from `C:\Windows\Temp\` or standard application update locations.

  - **Identify high-risk execution patterns:** Focus on command-line arguments, especially combinations of `-q`, `-i`, or `-package`. The presence of `C:\Windows\System32\wsl.exe` as the parent process immediately raises suspicion for potential misuse of Windows Subsystem for Linux to facilitate the installation.

  - **Validate legitimate software installations:** Check for known scheduled tasks or automated update processes that might utilize `msiexec.exe` to quietly install updates under expected conditions, particularly from trusted sources. Any deviations or unrecognized installers should be flagged.

  - **Cross-reference file creation activity:** Inspect specified temporary directories (e.g., `C:\Users\<username>\AppData\Local\Temp\`) for recent `.msi` files or log outputs indicating malicious installations. Use Sysmon Event ID 10 to check for file creation and manipulation activities in those locations.

  - **Investigate associated user accounts:** Look for unusual account activity or newly created user accounts coinciding with the execution of `msiexec.exe` with the quiet flag. Responses from managed endpoints should be traced to ensure no sensitive data was exposed during the installation process.

  ### Prioritization

  This alert is medium severity due to its potential impact on compromised systems, especially if the target is a critical asset within the enterprise. The likelihood of an attacker utilizing this method for achieving execution is high, as the quiet installation of malicious payloads is a common tactic in exploitation workflows.

  ### Blind Spots and Assumptions

  Detection may be limited by the capability of log sources; organizations must ensure that detailed command-line logging is enabled for process creation events. Legitimate application installations (e.g., Windows App updates) could trigger the alert if they use similar silent command-line options. A companion detection strategy utilizing Sysmon for monitoring directory enumeration or file creation can enhance the coverage against these tactics.

