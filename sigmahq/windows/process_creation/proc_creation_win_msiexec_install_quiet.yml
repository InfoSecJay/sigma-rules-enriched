title: Msiexec Quiet Installation
id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
status: test
description: |
  Adversaries may abuse msiexec.exe to proxy execution of malicious payloads.
  Msiexec.exe is the command-line utility for the Windows Installer and is thus commonly associated with executing installation packages (.msi)
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
- https://twitter.com/_st0pp3r_/status/1583914244344799235
author: frack113
date: 2022-01-16
modified: 2026-07-28
tags:
- attack.stealth
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  filter_main_system_temp:
    ParentImage|startswith: 'C:\Windows\Temp\'
  filter_main_ccm:
    ParentImage: 'C:\Windows\CCM\Ccm32BitLauncher.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_optional_user_temp:
        # The %temp% is a very common location for installers
    ParentImage|startswith: 'C:\Users\'
    ParentImage|contains: '\AppData\Local\Temp\'
  filter_optional_wsl:
        # C:\WINDOWS\system32\msiexec.exe /quiet /i "C:\Users\xodih\AppData\Local\Temp\wsl.2.6.3.0.arm64 (2).msi" SKIPVALIDATION=1 /L*V C:\Users\xodih\AppData\Local\Temp\wsl-install-logs.txt
    ParentImage|endswith: 'C:\Windows\System32\wsl.exe'
    Image|endswith: 'C:\Windows\System32\msiexec.exe'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- WindowsApps installing updates via the quiet flag
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_msiexec_install_quiet/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of `msiexec.exe` with the quiet installation flag (`-q`) in situations where such usage is atypical, unsafe, or conducted from suspicious parent processes. Attackers commonly exploit `msiexec.exe` to execute malicious software packages stealthily, often as part of an initial access or execution tactic within the attack lifecycle (ATT&CK tactic: Execution, technique: T1218.007). The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creation details. If this behavior is malicious, an unauthorized installation may lead to significant security risks, including the compromise of sensitive data or further lateral movement. However, this detection does NOT confirm that the execution is malicious without additional context and corroborating evidence.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for instances of `msiexec.exe` executed with the `-q` flag. Look for CommandLine fields that include `-q` along with `-i`, `-package`, `-a`, or `-j`. Ensure that the ParentImage field does not include known benign sources.

  - **Identify parent process:** Determine the parent process through the ParentImage field. If the parent is `C:\Windows\Temp\` or `C:\Windows\System32\wsl.exe`, this behavior might be more suspicious than if it originates from normal application paths.

  - **Corroborate installation authenticity:** Validate the package being installed by inspecting the CommandLine for any references to known malicious .msi filenames or hashes. An example of a common legitimate process would be an MSI installation initiated by a recognized system task or application.

  - **Examine system integrity level:** Check the IntegrityLevel field of the logged process creation event. The presence of an IntegrityLevel of 'System' or 'S-1-16-16384' coupled with unexpected command-line arguments is a strong indicator of potential misuse.

  - **Analyze log details and timestamps:** Validate timestamps associated with the `msiexec.exe` executions against known Windows updates or application installs logged in `WindowsEvent` records. Legitimate installation activities should coincide clearly with scheduled updates.

  - **Check for additional indicators of compromise (IoC):** Investigate whether any other logs, such as Windows Defender logs or any endpoint detection and response logs, show signs of file creation or modification corresponding to the times `msiexec.exe` was executed, focusing on outputs indicating deviations from expected behavior.

  ### Prioritization

  This alert has medium severity due to the potential impact on system integrity and the likelihood of malicious abuse, especially if the affected system is a critical server or endpoint. The exploitation of `msiexec.exe` is a known tactic, and its misuse can lead to significant consequences if left unchecked.

  ### Blind Spots and Assumptions

  This detection may be evaded by using legitimate applications to initiate `msiexec.exe`, such as standard update processes, which may also trigger the alert. It mandates the presence of comprehensive logging across endpoint systems to catch all relevant process creation events. Additionally, legitimate installers using quiet flags may inadvertently trigger this rule, so context is critical. A related detection to strengthen coverage would be monitoring for anomalous executable invocations using techniques like PowerShell (e.g., T1059.001 - PowerShell) that may further suggest malicious attempts to install software without user interaction.

