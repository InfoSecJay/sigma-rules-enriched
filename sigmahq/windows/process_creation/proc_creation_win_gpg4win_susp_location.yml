logsource:
  category: process_creation
  product: windows
detection:
  selection_metadata:
  - Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  - Product: 'GNU Privacy Guard (GnuPG)'
  - Description: 'GnuPG’s OpenPGP tool'
  selection_cli:
    CommandLine|contains: '-passphrase'
  selection_paths:
    CommandLine|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
  condition: all of selection_*
falsepositives:
- Unknown
