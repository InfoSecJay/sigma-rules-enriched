  ---

  ### Technical Context

  This rule detects the use of Gpg4win's GnuPG tool (gpg.exe or gpg2.exe) for file encryption or decryption when executed from potential malicious or unusual directories, including system temporary folders and public user directories. An attacker might leverage this tool to secure stolen files or sensitive information before exfiltration, thereby attempting to obfuscate the data from detection.

  The relevant MITRE ATT&CK tactic is *Execution* (T1203) with the technique *Command and Scripting Interpreter* (T1059). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. The security impact of this behavior includes potential data exfiltration or obfuscation of malicious payloads. However, detection of this activity does NOT confirm malicious intent; legitimate users may also utilize Gpg4win for legitimate purposes.

  ---

  ### Investigation Steps

  - **Examine the process creation log**: Review Security Event ID 4688 and Sysmon Event ID 1 for processes involving gpg.exe or gpg2.exe. Look for ParentProcessId and ProcessId to analyze the chain of execution.

  - **Analyze the command line arguments**: Check CommandLine fields for the presence of the argument '-passphrase,' which indicates a potentially suspicious encryption action. Compare command syntax to known botanical cases versus benign, legitimate usage patterns.

  - **Assess execution context**: Identify the user account that initiated the process. Legitimate Gpg4win use typically comes from known and trusted accounts; unauthorized or unusual accounts executing this tool could be an indicator of compromise.

  - **Validate suspicious directories**: Confirm the directory paths from which the processes are initiated, such as '\PerfLogs\', '\Temp\', '\Users\Public\', or '\AppData\Local\Temp\'. Legitimate file operations generally occur within user-specific directories rather than public/system locations.

  - **Cross-reference with file activity**: Investigate any file creation or modification events in conjunction with the process logs. Check for unusual file extensions or modifications in the previous hour, indicating encrypted file artifacts.

  ---

  ### Prioritization

  This alert is high severity due to the potential for data compromise and the likelihood of malicious exploitation in an enterprise environment. Gpg4win is often weaponized by threat actors for encrypting sensitive files during exfiltration phases, making this a critical indicator to assess thoroughly.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of proper logging on endpoints or evasion techniques such as process renaming or using other encryption tools to achieve similar objectives without triggering the alert. The detection requires proper implementation of Sysmon for granular logging. Legitimate use cases for Gpg4win exist, such as data protection by authorized users. A companion detection to consider is monitoring unauthorized access to sensitive directories or unusual account behavior to enhance overall security visibility.

