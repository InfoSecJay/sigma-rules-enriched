note: |
  ### Technical Context

  This rule detects attempts to sideload a Dynamic Link Library (DLL) using the `DeviceEnroller.exe` process with the `/PhoneDeepLink` parameter. Malicious actors leverage this technique to execute their custom DLLs, specifically renaming them to evade traditional detection mechanisms. The likely objective is privilege escalation or persistence, allowing them to maintain access on the compromised system. This behavior is categorized under the MITRE ATT&CK Tactic: **Privilege Escalation (T1068)** and Technique: **DLL Side-Loading (T1574.001)**.

  The primary telemetry sources for detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1 for process creation events. If the DLL is malicious, this could lead to unauthorized system access and control. It is important to note that this detection does NOT confirm that the DLL is indeed malicious or that an exploit has successfully occurred; it merely indicates a suspicious command with potential malicious intent.

  ### Investigation Steps

  - **Review process creation details:** Examine Security Event ID 4688 or Sysmon Event ID 1 for `deviceenroller.exe`. Confirm the execution path and original file name to ensure it is the legitimate application and not a renamed malicious variant.

  - **Check for the presence of unusual command line parameters:** Look for the command line arguments of `deviceenroller.exe` for `'/PhoneDeepLink'`. This is abnormal behavior and indicates a possible attempt to sideload a malicious DLL.

  - **Identify the attempted DLL file:** Investigate if there is an attempt to access or load `ShellChromeAPI.dll`. Track any file creation events using Sysmon Event ID 11 to highlight any unexpected new DLLs in directories commonly associated with application behavior.

  - **Verify legitimate usage cases:** Confirm if any known applications or legitimate updates in your environment utilize `DeviceEnroller.exe` with the `/PhoneDeepLink` parameter as part of their normal operations to rule out false positives.

  - **Analyze process parent-child relationships:** Look for unusual parent-child process relationships that could indicate laterally moving within the system or initial exploitation. Use Sysmon Event ID 1 to track if other suspicious processes spawned from `deviceenroller.exe`.

  ### Prioritization

  This alert is medium severity due to the potential impact on the affected system. The likelihood of exploitation through DLL sideloading techniques is plausible in targeted environments, given that these methods are common in toolkits used by adversaries. However, the actual occurrence of successful exploitation requires further investigation.

  ### Blind Spots and Assumptions

  Detection may miss obfuscation attempts where renamed or customized tools are used that do not align with known names or patterns. Reliable detection requires logging to be fully enabled for both Process Creation and File Creation events. Legitimate device management tools might trigger this alert if they utilize `DeviceEnroller.exe` incorrectly. A related detection to monitor is unusual file system changes or the presence of unexpected DLLs in sensitive application directories, enhancing coverage for covert intrusions.

