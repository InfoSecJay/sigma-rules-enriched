note: |
  ### Technical Context

  This rule detects potential DLL sideloading attempts via the Windows DeviceEnroller.exe process utilizing the PhoneDeepLink parameter to load a non-existent DLL file, specifically "ShellChromeAPI.dll." The likely attacker objective is to execute malicious code under the guise of a trusted process, enabling persistence and privilege escalation. This behavior falls under the MITRE ATT&CK tactics of Execution (TA0002) and Persistence (TA0003), specifically technique T1574.001 - Dynamic Link Library Injection.

  The primary telemetry source includes process creation logs from Windows, specifically focusing on Event ID 4688 for process creation and associated Command Line parameters. If successful, this behavior allows an adversary to maintain access to exploited systems, compromising confidentiality and integrity. It is important to note that this detection does NOT confirm that a malicious payload was actually executed; it merely indicates a potential attempt.

  ### Investigation Steps

  - **Review process creation events:**
    Inspect Security Event ID 4688 for Event data regarding DeviceEnroller.exe. Look for occurrences with the CommandLine containing '/PhoneDeepLink'.

  - **Check for unauthorized DLL files:**
    Search Windows file systems for the presence of "ShellChromeAPI.dll" or other similarly named files. Use PowerShell commands like `Get-ChildItem` to identify any file that might have been created in conjunction with the process.

  - **Correlate with user and system context:**
    Evaluate the user account context from Event ID 4688 logs for any anomalies or deviations from normal usage patterns (e.g., administrative accounts executing this process unexpectedly).

  - **Validate expected behavior:**
    Confirm legitimate usage of DeviceEnroller.exe in the environment. This executable is typically invoked by systems during enrollment in MDM programs. Ensure that the associated Command Line parameters are standard for these operations.

  - **Identify malicious indicators:**
    Focus on high-confidence indicators such as execution of DeviceEnroller.exe with unexpected CommandLine parameters. Anomalies, such as frequent invocations of this process by typical end-user accounts, may indicate misuse.

  ### Prioritization

  This alert should be classified as medium severity. The impacted systems, particularly those involved in device enrollment and management, can be critical in an enterprise setting. There is a reasonable likelihood of malicious abuse, as sophisticated attackers commonly exploit DLL sideloading techniques. This behavior has been weaponized in past campaigns observed in the wild.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where monitoring is not enabled for process creation logs or when the DeviceEnroller.exe process is whitelisted for legitimate administrative tasks. False positives may arise from legitimate device enrollment activities in environments with regular use of this tool. Related detections that enhance overall visibility could include monitoring for unusual process injection activities (e.g., abnormal command line arguments in other executables).

