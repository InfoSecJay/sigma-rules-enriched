level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the Windows Management Instrumentation Command-line (WMIC) tool combined with the "group" flag, indicating that an adversary is attempting to enumerate local groups and their permissions on a system. Understanding local user and group configurations can aid attackers in identifying potential targets for privilege escalation, especially by exposing users with elevated permissions like those in the local administrators group.

  The primary MITRE ATT&CK tactics involved in this detection are "Discovery" (TA0007) and more specifically the technique "Local Group Enumeration" (T1069.001). Attackers may employ this technique to gather valuable information about user roles and privileges, crucial for strategizing further attacks or lateral movement within a network.

  The most relevant telemetry for detecting WMIC usage are process creation events that capture both the execution of the wmic.exe command and the accompanying command-line arguments, such as the presence of "group." This data can provide insights into potentially malicious reconnaissance activities carried out by threat actors.

  ### Investigation Steps
  - **Analyze Process Creation Logs:** Review the process creation events around the time of the alert to confirm the execution of `wmic.exe`. Pay special attention to the associated command line to understand the context of local group enumeration.

  - **Review User Accounts and Permissions:** Investigate the local groups listed in the command output to identify any unauthorized or suspicious user accounts that may have elevated permissions. This will help in assessing whether there has been a compromise of user roles.

  - **Check for Lateral Movement Indicators:** Look for concurrent or subsequent activities on the same or other systems, such as suspicious authentication attempts or other reconnaissance commands. This may indicate a broader attack strategy or discovery phase by the adversary.

  - **Correlate with EDR Alerts:** If available, leverage EDR (Endpoint Detection and Response) tools to gather more contextual information about the endpoint where the WMIC command was executed. This can include executable behavior, network communication attempts, or related artifacts.

  ### Prioritization
  The severity of this alert is considered low; however, it should not be ignored as it may indicate reconnaissance activities that precede more significant malicious actions. The likelihood of an attacker using such techniques to learn about a target's environment increases if successful privilege escalation attempts follow.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is that it relies solely on process creation logs, which may not capture all instances of WMIC usage (such as if the command is executed with different flags or through scripts). Additionally, the detection logic assumes that no legitimate administrative tasks are being performed on the system at the time, which could generate false positives. Ensuring that process creation logging is configured correctly and that appropriate levels of auditing are enforced on Windows systems are critical for this alert's effectiveness.

