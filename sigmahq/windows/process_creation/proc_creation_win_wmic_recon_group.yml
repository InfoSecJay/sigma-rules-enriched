logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: ' group'
  condition: all of selection*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the execution of the Windows Management Instrumentation Command-line (WMIC) tool with the "group" flag. The detected behavior indicates that an adversary is attempting to enumerate local group memberships and permissions on a Windows system, which can help them identify privileged users, particularly those in the local administrators group. This action aligns with the MITRE ATT&CK tactic "Discovery" (T1057) and technique "Local Group Enumeration" (T1069.001).

  Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1, capturing command line arguments used. If this behavior is malicious, it could indicate an attempt by an attacker to escalate privileges or gain insight into the security posture of the environment. However, this detection does NOT confirm unauthorized access or system compromise on its own, as WMIC can be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Verify the WMIC execution: ** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 to see if "wmic.exe" was executed. Focus on the command line string to confirm it contains "group". Look for timestamps correlating with the alert.

  - **Identify the user context: ** Determine the user that executed the WMIC command from the Event ID data. Investigate if this user typically performs administrative tasks or has a history of legitimate use of WMIC.

  - **Search for related lateral movement indicators: ** Look for subsequent events (e.g., Event ID 4624 for logon) occurring shortly after the WMIC execution that may indicate lateral movement or additional enumeration activities.

  - **Review legitimate admin actions: ** Understand the standard operating procedures for your organization regarding use of WMIC. If legitimate administrative tasks were conducted around the time of the alert, document them as benign.

  - **Check for high-confidence malicious indicators: ** Cross-reference the WMIC execution with known malicious IPs or domains if external command execution followed. Collect evidence from recent logs for any unusual outbound connections to determine if the environment was compromised.

  ### Prioritization

  The alert is considered low severity due to the limited impact on system security, as local group enumeration is a common task for administrative users. However, it should be prioritized based on the user's role; unusual behavior from non-admin users would raise suspicion. This behavior can be weaponized by attackers to gather information for further exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of event logging. If process creation logs are not enabled, the WMIC execution will go undetected. Legitimate system administrators often use WMIC for troubleshooting or maintenance tasks, potentially generating false positives. Monitoring for companion detections, such as the use of PowerShell for further enumeration (e.g., related to T1087 - Account Discovery), can strengthen coverage and context for investigations.

