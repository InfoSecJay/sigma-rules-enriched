title: Suspicious Spool Service Child Process
id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
status: test
description: Detects suspicious print spool service (spoolsv.exe) child processes.
references:
- https://github.com/microsoft/Microsoft-365-Defender-Hunting-Queries/blob/efa17a600b43c897b4b7463cc8541daa1987eeb4/Exploits/Print%20Spooler%20RCE/Suspicious%20Spoolsv%20Child%20Process.md
author: Justin C. (@endisphotic), @dreadphones (detection), Thomas Patzke (Sigma rule)
date: 2021-07-11
modified: 2024-12-01
tags:
- attack.execution
- attack.t1203
- attack.privilege-escalation
- attack.t1068
logsource:
  category: process_creation
  product: windows
detection:
  spoolsv:
    ParentImage|endswith: '\spoolsv.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  suspicious_unrestricted:
    Image|endswith:
    - '\gpupdate.exe'
    - '\whoami.exe'
    - '\nltest.exe'
    - '\taskkill.exe'
    - '\wmic.exe'
    - '\taskmgr.exe'
    - '\sc.exe'
    - '\findstr.exe'
    - '\curl.exe'
    - '\wget.exe'
    - '\certutil.exe'
    - '\bitsadmin.exe'
    - '\accesschk.exe'
    - '\wevtutil.exe'
    - '\bcdedit.exe'
    - '\fsutil.exe'
    - '\cipher.exe'
    - '\schtasks.exe'
    - '\write.exe'
    - '\wuauclt.exe'
    - '\systeminfo.exe'
    - '\reg.exe'
    - '\query.exe'
  suspicious_net:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  suspicious_net_filter:
    CommandLine|contains: 'start'
  suspicious_cmd:
    Image|endswith: '\cmd.exe'
  suspicious_cmd_filter:
    CommandLine|contains:
    - '.spl'
    - 'route add'
    - 'program files'
  suspicious_netsh:
    Image|endswith: '\netsh.exe'
  suspicious_netsh_filter:
    CommandLine|contains:
    - 'add portopening'
    - 'rule name'
  suspicious_powershell:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  suspicious_powershell_filter:
    CommandLine|contains: '.spl'
  suspicious_rundll32_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  suspicious_rundll32_cli:
    CommandLine|endswith: 'rundll32.exe'
  condition: spoolsv and ( suspicious_unrestricted or (suspicious_net and not suspicious_net_filter)
    or (suspicious_cmd and not suspicious_cmd_filter) or (suspicious_netsh and not
    suspicious_netsh_filter) or (suspicious_powershell and not suspicious_powershell_filter)
    or all of suspicious_rundll32_* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This Sigma rule detects potentially malicious child processes being spawned by the Windows Print Spooler service (spoolsv.exe). The Print Spooler service has been exploited in various attacks, including remote code execution and privilege escalation, which can compromise an entire system by enabling an attacker to execute arbitrary commands. This detection is particularly sensitive to processes that are unusual for the spooler to invoke, suggesting that an attacker may be taking advantage of the Print Spooler's inherent privileges.

  The rule targets activities that fall under the MITRE ATT&CK techniques, notably "Exploitation of Remote Services" (T1203) and "Privilege Escalation" (T1068). Attackers may leverage compromised child processes to escalate privileges, deploy malware, or maintain persistence within the system. Primary data sources for detection include process creation logs from Windows, which track command-line arguments and the associated parent processes to identify suspicious activity originating from the spooler.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect logs related to process creation events to identify any instances of spoolsv.exe spawning child processes, especially those listed in the detection logic. Pay close attention to the command-line arguments and image names.

  - **Correlate Parent-Child Relationships:** Analyze the hierarchical relationship of processes stemming from spoolsv.exe. Investigate any identified child processes that exhibit unusual behavior or are commonly utilized in exploitation scenarios.

  - **Examine Network Traffic:** Investigate any network connections established by the identified child processes. Look for anomalous outbound connections that could indicate command and control activity or data exfiltration.

  - **Cross-Reference with Security Tools:** Utilize threat intelligence platforms and endpoint detection and response (EDR) tools to enrich findings and correlate with known malicious behaviors or indicators of compromise (IoCs).

  ### Prioritization
  This alert is categorized as high severity due to the potential impact of successful exploitation of the Print Spooler service, which could lead to unauthorized access, privilege escalation, and significant damage to the network infrastructure.

  ### Blind Spots and Assumptions
  There may be gaps in detection for the following scenarios: custom scripts or binaries that imitate legitimate spooler processes, as well as activities taking place outside of Windows process creation logs. The effectiveness of this detection relies on the proper configuration of Windows logging settings to capture all relevant process creation events. Further, the logic assumes an established understanding of normal behaviors for the Print Spooler service to distinguish between benign and malicious activity.

