title: Suspicious Spool Service Child Process
id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
status: test
description: Detects suspicious print spool service (spoolsv.exe) child 
  processes.
references:
- https://github.com/microsoft/Microsoft-365-Defender-Hunting-Queries/blob/efa17a600b43c897b4b7463cc8541daa1987eeb4/Exploits/Print%20Spooler%20RCE/Suspicious%20Spoolsv%20Child%20Process.md
author: Justin C. (@endisphotic), @dreadphones (detection), Thomas Patzke (Sigma
  rule)
date: 2021-07-11
modified: 2024-12-01
tags:
- attack.execution
- attack.t1203
- attack.privilege-escalation
- attack.t1068
logsource:
  category: process_creation
  product: windows
detection:
  spoolsv:
    ParentImage|endswith: '\spoolsv.exe'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  suspicious_unrestricted:
    Image|endswith:
    - '\gpupdate.exe'
    - '\whoami.exe'
    - '\nltest.exe'
    - '\taskkill.exe'
    - '\wmic.exe'
    - '\taskmgr.exe'
    - '\sc.exe'
    - '\findstr.exe'
    - '\curl.exe'
    - '\wget.exe'
    - '\certutil.exe'
    - '\bitsadmin.exe'
    - '\accesschk.exe'
    - '\wevtutil.exe'
    - '\bcdedit.exe'
    - '\fsutil.exe'
    - '\cipher.exe'
    - '\schtasks.exe'
    - '\write.exe'
    - '\wuauclt.exe'
    - '\systeminfo.exe'
    - '\reg.exe'
    - '\query.exe'
  suspicious_net:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  suspicious_net_filter:
    CommandLine|contains: 'start'
  suspicious_cmd:
    Image|endswith: '\cmd.exe'
  suspicious_cmd_filter:
    CommandLine|contains:
    - '.spl'
    - 'route add'
    - 'program files'
  suspicious_netsh:
    Image|endswith: '\netsh.exe'
  suspicious_netsh_filter:
    CommandLine|contains:
    - 'add portopening'
    - 'rule name'
  suspicious_powershell:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  suspicious_powershell_filter:
    CommandLine|contains: '.spl'
  suspicious_rundll32_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  suspicious_rundll32_cli:
    CommandLine|endswith: 'rundll32.exe'
  condition: spoolsv and ( suspicious_unrestricted or (suspicious_net and not 
    suspicious_net_filter) or (suspicious_cmd and not suspicious_cmd_filter) or 
    (suspicious_netsh and not suspicious_netsh_filter) or (suspicious_powershell
    and not suspicious_powershell_filter) or all of suspicious_rundll32_* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious child processes spawned from the Windows print spool service (spoolsv.exe). These processes may indicate an adversary leveraging the print spooler service to execute arbitrary code, potentially resulting in privilege escalation or remote code execution. The likely attacker objective is to exploit vulnerabilities in the print spooler service to gain unauthorized access or control over systems. The relevant MITRE ATT&CK techniques include **Execution (T1203)** and **Privilege Escalation (T1068)**.

  Primary telemetry sources include Windows process creation logs, particularly **Security Event ID 4688** and **Sysmon Event ID 1**, which capture process execution details. If malicious, this behavior can signify an active compromise leading to unauthorized access or data exfiltration. However, the detection does NOT confirm malicious behavior on its own, as legitimate applications may also create child processes under spoolsv.exe.

  ### Investigation Steps

  - **Confirm process creation details**: Review **Security Event ID 4688** and **Sysmon Event ID 1** for spoolsv.exe or check for process execution logs showing the child processes created. Look for child processes ending with `.exe` that may include `powershell.exe`, `cmd.exe`, or `curl.exe`, which are commonly misused.

  - **Analyze command line parameters**: For any detected child processes, examine the `CommandLine` field for malicious constructions, particularly those containing `.spl`, 'route add', or 'add portopening'. These attributes often indicate exploit attempts leveraging the print spooler.

  - **Validate child process integrity**: Check the **Security** or **IntegrityLevel** field in event logs to ensure any child process spawned has an expected integrity level. High integrity (especially **System** level) for unusual child processes is a red flag.

  - **Identify legitimate print activity**: Confirm if typical behavior is occurring in relation to spoolsv.exe, such as normal printing tasks, or user-initiated processes relevant to organizational operations. Comparison against baseline logs can clarify if the process activity is standard.

  - **Check for known malicious artifacts**: Search for artifacts such as unusual binaries (`rundll32.exe`, `net.exe`, etc.) or legitimate executables from paths less typical for user executions. Examine file creation events indicating the presence of potentially malicious files in directories generally associated with prints or documents.

  - **Correlate with threat intelligence**: Cross-reference detected behaviors with threat intelligence sources to assess if similar patterns have been associated with known threats or attacks, particularly those targeting the print spooler service.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on critical infrastructure components associated with printing and repository management. Given the likelihood of exploit attempts against the print spooler being common among threat actors, swift investigation is crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of evasion techniques where actors modify the command line or spawn processes in ways that obscure their intention. Ensure that all necessary log sources, such as Sysmon or Windows Security logs, are adequately configured to capture process creation events comprehensively. Be aware that legitimate system maintenance tasks by administrators may trigger this alert, particularly those involving system updates or configuration changes. Companion detections such as monitoring for direct exploit attempts against the print spooler service (e.g., identifying CVE-based attacks) can enhance detection and coverage.

