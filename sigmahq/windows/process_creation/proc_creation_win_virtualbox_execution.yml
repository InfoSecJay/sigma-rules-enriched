title: Virtualbox Driver Installation or Starting of VMs
id: bab049ca-7471-4828-9024-38279a4c04da
status: test
description: Adversaries can carry out malicious operations using a virtual 
  instance to avoid detection. This rule is built to detect the registration of 
  the Virtualbox driver or start of a Virtualbox VM.
references:
