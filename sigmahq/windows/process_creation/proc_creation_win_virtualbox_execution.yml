detection:
  selection_1:
    CommandLine|contains:
    - 'VBoxRT.dll,RTR3Init'
    - 'VBoxC.dll'
    - 'VBoxDrv.sys'
  selection_2:
    CommandLine|contains:
    - 'startvm'
    - 'controlvm'
  condition: 1 of selection_*
