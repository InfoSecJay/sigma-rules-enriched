title: Virtualbox Driver Installation or Starting of VMs
id: bab049ca-7471-4828-9024-38279a4c04da
status: test
description: Adversaries can carry out malicious operations using a virtual instance
  to avoid detection. This rule is built to detect the registration of the Virtualbox
  driver or start of a Virtualbox VM.
references:
- https://news.sophos.com/en-us/2020/05/21/ragnar-locker-ransomware-deploys-virtual-machine-to-dodge-security/
- https://threatpost.com/maze-ransomware-ragnar-locker-virtual-machine/159350/
author: Janantha Marasinghe
date: 2020-09-26
modified: 2025-07-29
tags:
- attack.defense-evasion
- attack.t1564.006
- attack.t1564
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - 'VBoxRT.dll,RTR3Init'
    - 'VBoxC.dll'
    - 'VBoxDrv.sys'
  selection_2:
    CommandLine|contains:
    - 'startvm'
    - 'controlvm'
  condition: 1 of selection_*
falsepositives:
- This may have false positives on hosts where Virtualbox is legitimately being used
  for operations
level: low
note: |
  ### Technical Context
  This detection rule identifies the installation or initiation of VirtualBox drivers and virtual machines, which may indicate the use of virtual environments by adversaries to perform malicious actions discreetly. Attackers might leverage VirtualBox to evade standard detection mechanisms, allowing them to operate in a controlled environment that isolates their actions from the host system. Common objectives include data exfiltration, malware deployment, and testing of new attack methodologies without triggering traditional security defenses.

  The rule aligns with the MITRE ATT&CK framework under the tactics of **Defense Evasion** and can be associated with the techniques **T1564.006** (System Location Discovery: Virtual Machine) and **T1564** (Hide Artifacts). The primary data sources that will provide the best evidence for this detection include process creation events and command line logs from Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for any instances where VirtualBox components (e.g., `VBoxRT.dll`, `VBoxC.dll`, `VBoxDrv.sys`) appear to be registered or initiated, indicating potential malicious activity.
  - **Analyze Command Line Arguments**: Investigate command line parameters related to VirtualBox commands (e.g., `startvm`, `controlvm`). Look for unusual patterns or unexpected executions that may signify unauthorized use.
  - **Inspect Host Behavior**: Assess the behavior of the host system for signs of unauthorized virtual machines running. Correlate any anomalous network traffic or system resource usage with VirtualBox activity.
  - **Evaluate Endpoint Protection Alerts**: Cross-reference any alerts from endpoint protection tools associated with the execution of VirtualBox processes to gather additional context and corroborate potential threats.

  ### Prioritization
  The alert is categorized with a low severity due to the potential for legitimate use of VirtualBox in certain operational contexts. However, the possibility of misuse for evasion and malicious operations warrants attention, especially in environments where virtualization is not commonly employed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage on systems where VirtualBox is actively used for legitimate purposes, leading to false positives. The detection logic assumes that any command line interactions with VirtualBox components that appear abnormal in the context of the environment indicate potential malicious intent. Proper logging configurations for process creation events must be enabled in order to facilitate the effective functionality of this alert.

