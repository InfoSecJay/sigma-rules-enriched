    - 'pwsh.dll'
  selection_cli_enc:
    CommandLine|contains: ' -e'
  selection_cli_invoke:
    CommandLine|contains:
            # Invoke-
            # UTF-16LE
    - 'SQBuAHYAbwBrAGUALQ'
    - 'kAbgB2AG8AawBlAC0A'
    - 'JAG4AdgBvAGsAZQAtA'
            # UTF-8
    - 'SW52b2tlL'
    - 'ludm9rZS'
    - 'JbnZva2Ut'
  condition: all of selection_*
