note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that use Base64 encoding to obfuscate the `Invoke-` keyword, which often indicates an attempt to execute malicious scripts or payloads. The likely attacker objective is to execute arbitrarily defined PowerShell commands while evading detection and analysis. This behavior falls under the MITRE ATT&CK technique "Command and Scripting Interpreter: Windows PowerShell (T1059.001)" and is also related to "Obfuscated Files or Information (T1027)."

  The primary telemetry source for this detection is Windows process creation logs. Relevant log types include Security Event ID 4688 for process creation events, capturing command-line arguments where obfuscation may occur. If malicious, this behavior could signify a system compromise, leading to data exfiltration or lateral movement. This detection does NOT confirm that an attack has occurred; it may also flag benign encoded scripts that are used in legitimate administrative tasks.

  ### Investigation Steps

  - **Review the original process and command line evidence:** Check Security Event ID 4688 for any PowerShell processes (`powershell.exe` or `pwsh.exe`). Look for `CommandLine` entries containing ` -e`, `Invoke-`, or specific Base64 encoded strings noted in the detection logic (e.g., `SQBuAHYAbwBrAGUALQ`).

  - **Analyze historical behavior:** Validate past command-line usage on the affected asset by checking previous Event IDs from the Windows Event Log. Legitimate usage often involves expected commands from system administrators, scripts signed by trusted sources, or known maintenance scripts.

  - **Identify potential malicious indicators:** Look for unusual parent processes of the PowerShell command (e.g., spawned from a suspicious executable like `cmd.exe` or a non-administrative user context). High-confidence indicators include the execution of encoded scripts and frequent use of `Invoke-` commands with Base64 strings.

  - **Collect file artifacts:** Verify if any obfuscated scripts or files were created or downloaded during the observed behavior. This could involve checking the file system for new files created in temporary directories (`%TEMP%`, etc.) or using Event ID 4663 to detect access to sensitive files.

  - **Cross-reference user activity:** Look up the user account executing the PowerShell command against established user baselines. Determine if the user's recent activities correlate with standard operations for their role, assessing any deviations.

  ### Prioritization

  This alert should be considered high severity due to the potential for malicious activity leading to significant impacts such as data breaches or system exploitation. The likelihood of abuse is high, as attackers commonly use obfuscation techniques to embed malicious commands in a stealthier manner, making it a key tactic in modern attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper logging configurations, such as insufficient command-line parameter logging for PowerShell. It's possible that legitimate administrative scripts or automation tools may trigger this alert if they use Base64 encoding. A related detection could involve monitoring for suspicious file creations (e.g., unusual scripts or executables) in conjunction with PowerShell usage, which would provide a deeper context to this behavior.

