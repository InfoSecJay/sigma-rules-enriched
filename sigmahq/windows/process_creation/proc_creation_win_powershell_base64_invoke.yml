detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_enc:
    CommandLine|contains: ' -e'
  selection_cli_invoke:
    CommandLine|contains:
            # Invoke-
            # UTF-16LE
    - 'SQBuAHYAbwBrAGUALQ'
    - 'kAbgB2AG8AawBlAC0A'
    - 'JAG4AdgBvAGsAZQAtA'
            # UTF-8
    - 'SW52b2tlL'
    - 'ludm9rZS'
    - 'JbnZva2Ut'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that use Base64 encoding when calling invoke methods. The likely objective for an attacker is to obfuscate malicious activities, leveraging PowerShell's capabilities to execute hidden commands without revealing the actual content directly in command line outputs. This behavior aligns with the MITRE ATT&CK tactics of Execution (T1059.001 - PowerShell) and Defense Evasion (T1027 - Obfuscated Files or Information).

  The primary telemetry source required for this detection is process creation logs from Windows, specifically Security Event ID 4688 or Sysmon Event ID 1 to capture detailed command line arguments. If malicious, this behavior can lead to system compromise or unauthorized data access. It is essential to note that the detection of this behavior does not confirm malicious intent on its own, as legitimate administrative tasks may also utilize Base64 encoding.

  ### Investigation Steps

  - **Review command line arguments:** Check Security Event ID 4688 or Sysmon Event ID 1 for command lines containing " -e" or "Invoke-". Look for additional details like OriginalFileName being 'PowerShell.EXE' or 'pwsh.dll'.

  - **Identify high-confidence malicious indicators:** Assess if the Base64 string in the command line decoded matches known malware signatures. Use tools to decode Base64 (such as PowerShell’s `[System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('YourBase64String'))`).

  - **Correlate with event details:** Determine if the execution context contains elevated privileges or if it was run from a known user account with administrative access, as typical benign uses may come from system accounts or standard operational tasks.

  - **Validate legitimate behavior:** Look for other instances of PowerShell execution in the same environment that do not use Base64 or 'Invoke-' calls. Standard administrative scripts might show typical patterns without obfuscation.

  - **Check for indicators of persistence:** Investigate if any scripts or scheduled tasks have been created that could maintain the PowerShell execution capability, looking for related events in Task Scheduler logs.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on sensitive systems and data. The likelihood of abuse is significant, as obfuscated PowerShell commands are frequently utilized in real-world attacks to execute malicious payloads while evading detection. This behavior is commonly weaponized by attackers leveraging PowerShell's powerful scripting capabilities.

  ### Blind Spots and Assumptions

  Detection may be limited by benign PowerShell usage, as administrators can also employ Base64 encoding for legitimate purposes. It is crucial to ensure that logging for process creation and command line arguments is properly configured to capture necessary data. Additionally, legitimate applications might trigger this alert if they execute PowerShell commands leveraging Base64, such as software installation processes. A related detection rule that could improve coverage is focused on monitoring Powershell's execution policies or changes to group policy that affect script execution in the environment.

