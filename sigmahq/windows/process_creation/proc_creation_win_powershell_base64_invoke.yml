note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of Base64-encoded commands in PowerShell, specifically targeting the 'Invoke-' keywords. Attackers may use this technique to execute malicious scripts or commands in a covert manner, aiming to evade detection while carrying out their objectives, such as data exfiltration or lateral movement. This behavior fits into the MITRE ATT&CK framework under the Execution tactic (TA0002) and the PowerShell technique (T1059.001).

  Primary telemetry sources include Windows Process Creation logs. Specifically, the relevant log types are Security Event ID 4688 (for command-line execution details) and Sysmon Event ID 1 (for process creation). If malicious, the security impact can be severe, leading to unauthorized access and potential data breaches. However, this detection does NOT confirm malicious intent on its own, as Base64 encoding can be used for legitimate PowerShell operations.

  ---

  ### Investigation Steps

  - **Analyze command-line arguments:** Review Security Event ID 4688 on affected systems for the CommandLine field. Look for the presence of ' -e', indicating Base64 encoding. A high confidence malicious indicator is the combination of 'Invoke-' commands with these flags in PowerShell.

  - **Identify encoded strings:** In the CommandLine field, decode any Base64 strings (like 'SQBuAHYAbwBrAGUALQ') found in conjunction with 'Invoke-'. If the decoded content performs actions like downloading additional payloads, this indicates malicious behavior.

  - **Correlate with Sysmon data:** Check Sysmon Event ID 1 for the same process invocation. This helps differentiate between malicious activity and normal administrative tasks performed via PowerShell—such as IT automation scripts that might legitimately use encoded commands.

  - **Check for known scripts:** Validate against organizational baselines or script repositories. Legitimate internal scripts may use 'Invoke-' with encoded arguments, appearing in a controlled environment with consistent execution patterns.

  - **Review execution context:** Investigate the user or service account tied to the execution of PowerShell. If the account has a history of benign usage, this could indicate false positives, while execution from unexpected accounts could imply malicious activities.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact on sensitive systems if malicious actions are confirmed. The presence of encoded commands in PowerShell is a common technique for post-exploitation activity, increasing the likelihood of malicious abuse.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques such as encoding using different schemes outside of Base64. Reliable detection requires Sysmon configuration for detailed logging; otherwise, critical context may be missed. Legitimate administrative tasks or automated scripts may trigger this alert, necessitating careful contextual analysis. Companion detections such as those for unusual outbound network connections can help corroborate potentially malicious behavior.

