logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_enc:
    CommandLine|contains: ' -e'
  selection_cli_invoke:
    CommandLine|contains:
            # Invoke-
            # UTF-16LE
    - 'SQBuAHYAbwBrAGUALQ'
    - 'kAbgB2AG8AawBlAC0A'
    - 'JAG4AdgBvAGsAZQAtA'
            # UTF-8
    - 'SW52b2tlL'
    - 'ludm9rZS'
    - 'JbnZva2Ut'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands utilizing Base64 encoding, specifically targeting `Invoke-` commands. Attackers often use this technique to obfuscate commands and avoid detection while executing potentially malicious scripts, such as those used in cyber attacks to establish persistence or exfiltrate data. This behavior aligns with the MITRE ATT&CK technique for Scripting (T1059.001) and Obfuscated Files or Information (T1027).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1 for process creation events. If this behavior is determined to be malicious, the impact could include unauthorized access, data exfiltration, or system compromise. It’s crucial to note that this detection does NOT definitively confirm that the activity is malicious; further investigation is required to ascertain intent and context.

  ### Investigation Steps

  - **Review the process command line:** Check the `CommandLine` field within Security Event ID 4688 and Sysmon Event ID 1 logs for suspicious entries containing `-e` or for any Base64 encoded strings indicative of `Invoke-` commands. Malicious indicators include combinations of encoded strings, while benign indicators might involve standard administrative scripts or known internal processes.

  - **Correlate system role:** Identify the role of the affected system (e.g., server, workstation). Investigate whether PowerShell usage is typical for this system. This helps to contextualize the command; benign use may include authorized administrative tasks, while suspicious use could indicate exploitation.

  - **Analyze related PowerShell logs:** Look in the PowerShell operational logs (Event ID 4103) for executed script block logs that could provide additional context around the command, such as execution times and user details. This may reveal whether the activity is a common task or an anomaly.

  - **Identify user context:** Check the `AccountName` associated with the PowerShell execution in the logs to determine if it was initiated by a privileged account. An unusual account executing obfuscated commands should raise flags, particularly if the account is not known for using PowerShell heavily.

  - **Check for reportable attributes:** Validate if any log entries correlate with known indicators of compromise (IOCs) such as file hashes or specific Base64 patterns associated with past incidents. Cross-reference these with threat intelligence feeds.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on security, especially if executed on critical systems. The use of obfuscated PowerShell commands indicates a likelihood of malicious activity, as this technique is commonly weaponized by adversaries to conceal their actions.

  ### Blind Spots and Assumptions

  There are limitations to detection, including the possibility of API-based invocation that may bypass traditional logging. Additionally, PowerShell execution could be legitimate, especially in administrative operations or automated tasks. Ensure that logging for PowerShell and process creation is correctly configured to avoid gaps in visibility. Related detections such as monitoring unusual outbound connections after such commands are executed can enhance coverage against potential data exfiltration.

