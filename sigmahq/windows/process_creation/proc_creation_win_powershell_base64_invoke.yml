description: Detects UTF-8 and UTF-16 Base64 encoded powershell 'Invoke-' calls
references:
- https://thedfirreport.com/2022/05/09/seo-poisoning-a-gootloader-story/
author: pH-T (Nextron Systems), Harjot Singh, @cyb3rjy0t
date: 2022-05-20
modified: 2023-04-06
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli_enc:
    CommandLine|contains: ' -e'
  selection_cli_invoke:
    CommandLine|contains:
            # Invoke-
            # UTF-16LE
    - 'SQBuAHYAbwBrAGUALQ'
    - 'kAbgB2AG8AawBlAC0A'
    - 'JAG4AdgBvAGsAZQAtA'
            # UTF-8
    - 'SW52b2tlL'
    - 'ludm9rZS'
    - 'JbnZva2Ut'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving PowerShell, specifically focusing on the use of Base64 encoded strings within PowerShell commands that utilize the 'Invoke-' keyword. The presence of such encoded commands often indicates an attempt to obfuscate and execute potentially harmful operations without raising immediate alarms. Attackers may employ this technique to bypass security controls, execute payloads, or access sensitive data as part of their operation.

  The likely threat scenario revolves around malware deployment or exploitation techniques that leverage PowerShell's capabilities for execution, which may involve download and execution of malicious scripts or payloads. Attackers utilizing techniques such as these are typically motivated to achieve unauthorized access to systems, conduct data exfiltration, or maintain persistence within the environment.

  This detection correlates with the following MITRE ATT&CK tactics and techniques:
  - **Execution**: Based on technique T1059.001 (PowerShell) and T1027 (Obfuscated Files or Information).
  - **Defense Evasion**: As encoded commands conceal actual intent, they can help evade detection mechanisms.

  Primary data sources for this detection include:
  - Process creation events, which capture command-line arguments executed by PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for entries associated with PowerShell (`powershell.exe` or `pwsh.exe`) and the command line parameters included, especially those containing Base64-encoded strings or the `Invoke-` keyword.

  - **Inspect Command-Line Arguments**: Focus specifically on the command-line used during the process creation. Pay attention to any signs of obfuscation, such as Base64 encoded commands, and look for common 'Invoke-' methods that may indicate malicious intent.

  - **Analyze Parent Process Relationships**: Investigate parent-child process hierarchies. Suspicious executions often originate from processes such as `cmd.exe` or other potentially compromised applications.

  - **Conduct an Environment Audit**: Check for unusual PowerShell execution patterns or configurations that allow execution without proper defenses. Look for similar suspicious activity across other systems to identify possible lateral movement or persistence efforts.

  ### Prioritization
  Alerts generated by this rule should be considered high severity due to the prevalence of PowerShell in both legitimate administrative functions and in malicious activities. The likelihood of an attack utilizing encoded commands in enterprise environments is high, given the flexibility and accessibility of PowerShell.

  ### Blind Spots and Assumptions
  A potential gap in coverage may arise from environments that have disabled logging for PowerShell execution or where command line arguments are not fully captured. The detection rule assumes that all relevant logs are available and that PowerShell's execution is not unduly restricted. Additionally, systems with policies blocking the execution of PowerShell scripts may reduce the effectiveness of this detection. For the alert to function effectively, process creation logs must be enabled and correctly configured to provide comprehensive visibility into PowerShell activity.

