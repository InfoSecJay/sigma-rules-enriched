logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'AddSecurityPackage'
    - 'AdjustTokenPrivileges'
    - 'Advapi32'
    - 'CloseHandle'
    - 'CreateProcessWithToken'
    - 'CreatePseudoConsole'
    - 'CreateRemoteThread'
    - 'CreateThread'
    - 'CreateUserThread'
    - 'DangerousGetHandle'
    - 'DuplicateTokenEx'
    - 'EnumerateSecurityPackages'
    - 'FreeHGlobal'
    - 'FreeLibrary'
    - 'GetDelegateForFunctionPointer'
    - 'GetLogonSessionData'
    - 'GetModuleHandle'
    - 'GetProcAddress'
    - 'GetProcessHandle'
    - 'GetTokenInformation'
    - 'ImpersonateLoggedOnUser'
    - 'kernel32'
    - 'LoadLibrary'
    - 'memcpy'
    - 'MiniDumpWriteDump'
            # - 'msvcrt'
    - 'ntdll'
    - 'OpenDesktop'
    - 'OpenProcess'
    - 'OpenProcessToken'
    - 'OpenThreadToken'
    - 'OpenWindowStation'
    - 'PtrToString'
    - 'QueueUserApc'
    - 'ReadProcessMemory'
    - 'RevertToSelf'
    - 'RtlCreateUserThread'
    - 'secur32'
    - 'SetThreadToken'
            # - 'user32'
    - 'VirtualAlloc'
    - 'VirtualFree'
    - 'VirtualProtect'
    - 'WaitForSingleObject'
    - 'WriteInt32'
    - 'WriteProcessMemory'
    - 'ZeroFreeGlobalAllocUnicode'
  filter_optional_mpcmdrun:
    Image|endswith: '\MpCmdRun.exe'
    CommandLine|contains: 'GetLoadLibraryWAddress32'
  filter_optional_compatTelRunner:
    ParentImage|endswith: '\CompatTelRunner.exe'
    CommandLine|contains:
    - 'FreeHGlobal'
    - 'PtrToString'
    - 'kernel32'
    - 'CloseHandle'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some legitimate action or applications may use these functions. Investigate 
  further to determine the legitimacy of the activity.
level: high
regression_tests_path: 
