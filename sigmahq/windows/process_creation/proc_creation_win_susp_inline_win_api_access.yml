title: Potential WinAPI Calls Via CommandLine
id: ba3f5c1b-6272-4119-9dbd-0bc8d21c2702
related:
- id: 03d83090-8cba-44a0-b02f-0b756a050306
  type: derived
status: test
description: Detects the use of WinAPI Functions via the commandline. As seen used
  by threat actors via the tool winapiexec
references:
- https://twitter.com/m417z/status/1566674631788007425
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-06
modified: 2025-03-06
tags:
- attack.execution
- attack.t1106
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'AddSecurityPackage'
    - 'AdjustTokenPrivileges'
    - 'Advapi32'
    - 'CloseHandle'
    - 'CreateProcessWithToken'
    - 'CreatePseudoConsole'
    - 'CreateRemoteThread'
    - 'CreateThread'
    - 'CreateUserThread'
    - 'DangerousGetHandle'
    - 'DuplicateTokenEx'
    - 'EnumerateSecurityPackages'
    - 'FreeHGlobal'
    - 'FreeLibrary'
    - 'GetDelegateForFunctionPointer'
    - 'GetLogonSessionData'
    - 'GetModuleHandle'
    - 'GetProcAddress'
    - 'GetProcessHandle'
    - 'GetTokenInformation'
    - 'ImpersonateLoggedOnUser'
    - 'kernel32'
    - 'LoadLibrary'
    - 'memcpy'
    - 'MiniDumpWriteDump'
            # - 'msvcrt'
    - 'ntdll'
    - 'OpenDesktop'
    - 'OpenProcess'
    - 'OpenProcessToken'
    - 'OpenThreadToken'
    - 'OpenWindowStation'
    - 'PtrToString'
    - 'QueueUserApc'
    - 'ReadProcessMemory'
    - 'RevertToSelf'
    - 'RtlCreateUserThread'
    - 'secur32'
    - 'SetThreadToken'
            # - 'user32'
    - 'VirtualAlloc'
    - 'VirtualFree'
    - 'VirtualProtect'
    - 'WaitForSingleObject'
    - 'WriteInt32'
    - 'WriteProcessMemory'
    - 'ZeroFreeGlobalAllocUnicode'
  filter_optional_mpcmdrun:
    Image|endswith: '\MpCmdRun.exe'
    CommandLine|contains: 'GetLoadLibraryWAddress32'
  filter_optional_compatTelRunner:
    ParentImage|endswith: '\CompatTelRunner.exe'
    CommandLine|contains:
    - 'FreeHGlobal'
    - 'PtrToString'
    - 'kernel32'
    - 'CloseHandle'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some legitimate action or applications may use these functions. Investigate further
  to determine the legitimacy of the activity.
level: high
note: |
  ### Technical Context
  This rule is designed to detect suspicious command-line invocations of WinAPI functions commonly leveraged by threat actors using tools like `winapiexec`. These functions can facilitate various malicious activities such as process injection, privilege escalation, and unmanaged code execution. The suspected behavior usually indicates an attacker seeking unauthorized access or control over system processes, often in the context of lateral movement or persistence.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Execution** (TA0002) and **Command and Scripting Interpreter** (T1059), specifically the use of native API calls to manipulate system processes (T1106). Attackers may utilize these WinAPI calls to stealthily execute payloads or perform privileged actions without raising immediate flags in traditional security controls.

  Primary data sources for this detection include process creation logs from Windows Event Logs, which capture command-line arguments and the associated process information. This telemetry is critical for identifying potentially malicious command invocations.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the Windows process creation logs to identify any instances of command-line calls containing the specified WinAPI functions. Pay close attention to the context in which these calls were made.

  - **Correlate Parent Process Relationships:** Investigate the parent-child process relationships to determine how the WinAPI function calls were initiated. Look for unusual parent processes or command sequences that may indicate non-standard behavior.

  - **Analyze Network Connections:** Inspect related network activity to identify any communications that coincide with the suspicious API calls. Look for connections to known command and control (C2) servers or any outbound connections that may suggest data exfiltration.

  - **Assess Permission Levels:** Determine the user account executing the potentially malicious commands. Validate whether the level of access aligns with expected user capabilities to discern unauthorized privilege escalation attempts.

  ### Prioritization
  This alert is marked as high severity due to the potential impact of successful exploitation via WinAPI calls. Given that these functions are often exploited for advanced persistence and lateral movement techniques, any detections warrant immediate investigation to mitigate potential breaches.

  ### Blind Spots and Assumptions
  There may be detection gaps for legitimate applications or administrative tasks that also utilize WinAPI calls, leading to potential false positives. The detection logic assumes that command-line invocations leading to these APIs are indeed anomalous; therefore, context and behavior around these calls must be analyzed to confirm malicious intent. Additionally, adequate logging settings must be configured to capture all relevant process creation events for this alert to function effectively.

