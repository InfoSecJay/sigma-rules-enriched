title: Suspicious Service DACL Modification Via Set-Service Cmdlet
id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
related:
- id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
  type: derived
status: test
description: Detects suspicious DACL modifications via the "Set-Service" cmdlet using
  the "SecurityDescriptorSddl" flag (Only available with PowerShell 7) that can be
  used to hide services or make them unstopable
references:
- https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
- https://learn.microsoft.com/pt-br/windows/win32/secauthz/sid-strings
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\pwsh.exe'
  - OriginalFileName: 'pwsh.dll'
  selection_sddl_flag:
    CommandLine|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  selection_set_service:
    CommandLine|contains|all:
    - 'Set-Service '
    - 'D;;'
    CommandLine|contains:
    - ';;;IU'
    - ';;;SU'
    - ';;;BA'
    - ';;;SY'
    - ';;;WD'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious modifications to the Discretionary Access Control List (DACL) of Windows services using the `Set-Service` cmdlet in PowerShell 7. Attackers may use this technique to manipulate service permissions, effectively hiding services or making them unresponsive to standard administrative controls, which can support stealthy persistence on compromised systems.

  In common threat scenarios, an attacker with elevated privileges may employ this technique to prevent detection or intervention by security personnel by restricting access to service control functionalities. The likely objective is to maintain control over malicious services, enabling further exploitation or data exfiltration. The detection is particularly relevant to the MITRE ATT&CK techniques of Persistence (T1543.003) and Privilege Escalation (T1543), as it allows for the modification of object permissions that can shield malicious services from administrative oversight.

  Primary data sources for this detection include process creation events that capture command-line arguments used during execution, specifically those involving PowerShell. Analyzing these logs can provide insight into potentially harmful modifications made to service configurations and permissions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for PowerShell process invocations, especially those containing `Set-Service` and `SecurityDescriptorSddl` within the command line to identify potential misuse.

  - **Analyze DACL Changes:** Investigate the DACL settings for any recently modified services. Check for unusual permissions or the presence of any suspicious security identifiers (SIDs) that could indicate unauthorized access is set.

  - **Verify Service Status:** Conduct a review of service statuses and configurations to determine if any services are inactive or set to a state that could suggest tampering or adverse configurations.

  - **Correlate with User Activity:** Cross-reference the time of the command execution with user activity logs to identify any administrative actions undertaken around the same timeframe that might point to comorbid malicious activity.

  ### Prioritization
  This alert is classified as high severity due to the potential impact on system integrity and security. Successful execution of DACL modifications can allow attackers to hide their activities, maintain persistence, and evade detection, significantly increasing the risk to the enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where modifications occur through other means (e.g., scripts or unauthorized tools) that do not invoke `Set-Service`. Additionally, logs related to PowerShell might not be enabled or adequately retained, leading to gaps in visibility. The rule assumes the use of PowerShell 7, as earlier versions do not support the `SecurityDescriptorSddl` flag. Continuous monitoring and configuration of logging for PowerShell activities are crucial for the effective functioning of this detection.

