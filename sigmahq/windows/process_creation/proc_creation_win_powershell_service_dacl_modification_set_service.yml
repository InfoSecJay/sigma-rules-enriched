logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\pwsh.exe'
  - OriginalFileName: 'pwsh.dll'
  selection_sddl_flag:
    CommandLine|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  selection_set_service:
    CommandLine|contains|all:
    - 'Set-Service '
    - 'D;;'
    CommandLine|contains:
    - ';;;IU'
    - ';;;SU'
    - ';;;BA'
    - ';;;SY'
    - ';;;WD'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects modifications to Service Discretionary Access Control Lists (DACLs) using PowerShell's `Set-Service` cmdlet with the `-SecurityDescriptorSddl` flag. This behavior is often associated with attempts to hide services or manipulate their stopping capabilities, potentially allowing an adversary to persist undetected on a compromised system. Relevant MITRE ATT&CK techniques include Persistence (T1543.003) and Privilege Escalation (T1543).

  Primary telemetry sources include Windows process creation logs, specifically using Event ID 4688. If malicious, these behaviors can facilitate unauthorized service modifications, enabling an attacker to evade detection or persistence. Importantly, the detection does not confirm that a malicious activity occurred because legitimate administrative actions may invoke similar commands.

  ### Investigation Steps

  - **Review command execution context:** Check Event ID 4688 logs for the creation of the `pwsh.exe` process. Look for user account information and parent process IDs to determine if the command was run by a legitimate administrator or an unauthorized account.

  - **Analyze CommandLine arguments:** Specifically check the CommandLine field in Event ID 4688 logs for the presence of the `Set-Service` cmdlet combined with `-SecurityDescriptorSddl`. Focus on outputs containing `D;;` accompanied by `;;;IU`, `;;;SU`, `;;;BA`, or `;;;SY`. Benign use cases should not include modifications that excessively restrict access.

  - **Validate normal service configurations:** Cross-reference the list of running services with the expected configurations. Identify any changes in DACL settings that deviate from known baselines. Normal configurations should not have extensive permissions assigned or be set to 'unstopable.'

  - **Correlate with other monitoring tools:** If available, check SIEM or EDR alerts for additional context around this event, such as any unusual network traffic to or from the device following the service modifications. A lack of related alerts may indicate benign activity.

  ### Prioritization

  This alert is high severity due to the potential impact on system integrity, as malicious DACL modifications can allow an attacker to execute persistence mechanisms undetected. The likelihood of abuse is significant, as hiding services and preventing their stop commands are commonly weaponized tactics employed by advanced threat actors.

  ### Blind Spots and Assumptions

  Detection may be circumvented by using alternate tools or scripting languages to modify services without traditional logging. Complete PowerShell command logging must be enabled to reliably capture all service modifications. Legitimate service management activities, such as administrative changes to service permissions, might trigger this alert. Complementary detections such as monitoring for abnormal modifications in service configurations or event log access (Event ID 5145) will enhance detection capabilities.

