  ---

  ### Technical Context

  This detection rule identifies suspicious modifications to the Discretionary Access Control List (DACL) of Windows services via the PowerShell `Set-Service` cmdlet, specifically when the `-SecurityDescriptorSddl` flag is used. The likely attacker objective is to manipulate service permissions to either hide the service from discovery or make it unmanageable (e.g., impossible to stop) by legitimate users. This behavior aligns with the MITRE ATT&CK techniques for Privilege Escalation (T1543.003) and Persistence.

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on command line arguments for the creation of PowerShell processes (Event ID 4688 and Sysmon Event ID 1). If malicious, such modifications can provide an adversary with a foothold in the environment, leading to longer-term persistence. Importantly, this detection does not independently confirm that a service has been hidden or is being misused; it simply indicates that a potentially risky command was executed.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Check for the presence of `-SecurityDescriptorSddl` or `-sd` in the CommandLine field of the identified process (Event ID 4688 / Sysmon ID 1). Malicious indicators include usage of DACL patterns `D;;` and `;;;IU`, suggesting potentially improper permissions are being set.

  - **Correlate with service logs:** Investigate the specific service being modified by checking the `ServiceName` and `DisplayName` fields in Event ID 7045 (Service Control Manager logs). Look for any services that have recently had their DACL modified; especially any not typically altered during normal operations.

  - **Identify legitimate PowerShell usage:** Confirm whether this PowerShell command is part of expected administrative actions. Typical usage may include legitimate service management, such as setting service parameters or configurations without the `-SecurityDescriptorSddl` switch.

  - **Analyze elevated privileges:** Review account permissions of the user executing this command. If the account does not have sufficient privileges (like SYSTEM or elevated administrator roles) for modifying service DACLs, consider this a high-confidence malicious indicator.

  - **Check for related alerts:** Look for any companion detections that may indicate a broader attack pattern. Related activities might include unusual PowerShell activity, flagging for known attack tools or execution patterns (e.g., attack methods observed in related detection ID 99cf1e02-00fb-4c0d-8375-563f978dfd37).

  - **Validate system impact:** If the modification was executed on critical services, assess the security impact on affected systems. Services like Windows Update or Anti-virus should not typically have their DACLs modified; any changes here could indicate a serious compromise.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact on critical services, which could lead to complete loss of management control over compromised environments. The likelihood of such modifications being abused by an adversary to escalate privileges or create persistence mechanisms is significant, especially given the technical knowledge required to use the `Set-Service` cmdlet in this manner.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate administrative accounts which could also trigger this alert when performing necessary changes; therefore, context is critical. Ensure that logging is properly configured to capture all relevant PowerShell activity, as minimal logging could lead to missed detections. Additionally, related detections that monitor for abnormal PowerShell execution patterns can enhance coverage against potential evasion techniques like script obfuscation.

