logsource:
  product: windows
  category: process_creation
detection:
  lolbin:
  - Image|endswith: '\ie4uinit.exe'
  - OriginalFileName: 'IE4UINIT.EXE'
  filter_correct:
    CurrentDirectory:
    - 'c:\windows\system32\'
    - 'c:\windows\sysWOW64\'
  filter_missing:
    CurrentDirectory:
  condition: lolbin and not 1 of filter_*
falsepositives:
- ViberPC updater calls this binary with the following commandline "ie4uinit.exe -ClearIconCache"
level: medium
note: |
  ### Technical Context
  This rule detects the use of the Windows utility `ie4uinit.exe` being executed from an unusual directory, particularly when invoked through a maliciously crafted `ie4uinit.inf` file. Attackers may leverage this technique to bypass security mechanisms and execute commands from non-standard paths that are not typically monitored, potentially leading to unauthorized actions on a compromised system.

  The primary threat objectives of this behavior often include evasion of detection, persistence through system manipulation, or dropping payloads that can further compromise the environment. Attackers employing such methods aim to obfuscate their actions from security analysts and defenders, thus establishing footholds within an organization while decreasing the likelihood of being detected.

  This activity correlates with the MITRE ATT&CK framework, specifically relating to the **Defense Evasion** tactic (ID: T1218), which encompasses the use of executable binaries in a manner that circumvents standard detection. The relevant telemetry for this detection includes process creation events, particularly those capturing the execution paths, command-line parameters, and other contextual information surrounding the parent-child process relationships.

  ### Investigation Steps
  - **Review Process Creation Events:** Collect logs of process creation events where `ie4uinit.exe` is invoked. Pay attention to the execution path, command-line arguments, and the parent processes to identify any anomalous activity.
  - **Analyze Current Directory Logs:** Investigate cases where `ie4uinit.exe` is executed from directories other than `C:\Windows\System32` or `C:\Windows\SysWOW64`. Correlate this data with the execution time and user accounts involved to detect suspicious patterns.
  - **Examine Related Registry Changes:** Check Windows registry modifications linked to `ie4uinit.inf` or related components. Any unusual entries or unfamiliar software installations can indicate potential compromise or persistence mechanisms.
  - **Cross-reference with Known Bad Indicators:** Utilize threat intelligence feeds to correlate the observed command-line syntax and paths with known malicious activity or threat actor techniques outlined in public reports.

  ### Prioritization
  The alert has a medium severity due to the potential for unauthorized command execution and persistence mechanisms that malicious actors may employ via this method. Given the inherent risks associated with unauthorized access to administrative tools, prompt investigation is warranted.

  ### Blind Spots and Assumptions
  There may be gaps in detecting legitimate uses of `ie4uinit.exe` when invoked correctly from its intended directories, potentially resulting in false positives. Additionally, the detection logic assumes that execution from an incorrect directory indicates malicious intent, which may not always hold true due to various legitimate software operations. Required log sources include detailed process creation logs and any associated artifacts that document command-line execution, which must be enabled for effective detection of this behavior.

