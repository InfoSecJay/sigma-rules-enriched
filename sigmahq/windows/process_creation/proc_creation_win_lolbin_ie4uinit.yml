title: Ie4uinit Lolbin Use From Invalid Path
id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
status: test
description: Detect use of ie4uinit.exe to execute commands from a specially 
  prepared ie4uinit.inf file from a directory other than the usual directories
references:
- https://lolbas-project.github.io/lolbas/Binaries/Ie4uinit/
- https://bohops.com/2018/03/10/leveraging-inf-sct-fetch-execute-techniques-for-bypass-evasion-persistence-part-2/
author: frack113
date: 2022-05-07
modified: 2022-05-16
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: process_creation
detection:
  lolbin:
  - Image|endswith: '\ie4uinit.exe'
  - OriginalFileName: 'IE4UINIT.EXE'
  filter_correct:
    CurrentDirectory:
    - 'c:\windows\system32\'
    - 'c:\windows\sysWOW64\'
  filter_missing:
    CurrentDirectory:
  condition: lolbin and not 1 of filter_*
falsepositives:
- ViberPC updater calls this binary with the following commandline "ie4uinit.exe
  -ClearIconCache"
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `ie4uinit.exe`, a legitimate Windows binary, from an invalid directory, triggering potentially malicious behavior. Attackers may exploit this binary to execute commands from a specially crafted `ie4uinit.inf` file, often aiming to evade detection and persist on a system. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) and the technique is "Execution through a Windows Utility" (T1218).

  Primary telemetry sources include process creation logs that capture events related to executable files, specifically Security Event ID 4688 and Sysmon Event ID 1. If this detection indicates a malicious use, the security impact could be significant, potentially allowing for command execution and system compromise. However, this detection does NOT confirm malicious activity on its own, as benign applications may also use `ie4uinit.exe`.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 for instances of `ie4uinit.exe`. Check the `CurrentDirectory` field to confirm it does not match typical directories (e.g., `C:\Windows\System32` or `C:\Windows\SysWOW64`).

  - **Analyze command-line arguments:** Look for any suspicious command-line arguments accompanying `ie4uinit.exe`, such as runs with an `.inf` file that may contain harmful operations. Compare against known benign uses, like "C:\Program Files\ViberPC\ie4uinit.exe -ClearIconCache".

  - **Identify unexpected parent processes:** Check the parent process ID (PPID) and associated parent processes from the event logs. Look for common benign parents like `explorer.exe` or `cmd.exe`; anything else may indicate an anomaly.

  - **Cross-reference with known Indicators of Compromise (IoCs):** Utilize threat intelligence platforms to verify if the use of `ie4uinit.exe` in this context has been reported as malicious.

  - **Confirm file creation rates:** Investigate creation logs for `ie4uinit.inf` files in directories that are not standard, such as user directories or temporary folders, which may suggest illicit usage.

  - **Assess host role and criticality:** If `ie4uinit.exe` is executed on a critical server or endpoint, prioritize this alert for prompt investigation compared to less critical systems.

  ### Prioritization

  This alert carries a medium severity due to the potential for exploitation and command execution from a common Windows utility in non-standard paths. The likelihood of abuse is moderate as this behavior is not typical for `ie4uinit.exe`, but the binary itself is commonly used, making it a potential target for adversaries.

  ### Blind Spots and Assumptions

  Detection limitations exist as attackers may employ evasion techniques by renaming or modifying the `ie4uinit.exe` executable. Accurate detection requires logging from process creation events; ensure Sysmon is configured to log such telemetry. Legitimate applications, such as Viber, may trigger this alert under specific conditions, adding noise to the detection. A companion detection such as logs for unusual script execution via PowerShell (T1059.001) can help validate potential malicious behavior.

