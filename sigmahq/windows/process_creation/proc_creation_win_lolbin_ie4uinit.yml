title: Ie4uinit Lolbin Use From Invalid Path
id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
status: test
description: Detect use of ie4uinit.exe to execute commands from a specially 
  prepared ie4uinit.inf file from a directory other than the usual directories
references:
- https://lolbas-project.github.io/lolbas/Binaries/Ie4uinit/
- https://bohops.com/2018/03/10/leveraging-inf-sct-fetch-execute-techniques-for-bypass-evasion-persistence-part-2/
author: frack113
date: 2022-05-07
modified: 2022-05-16
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: process_creation
detection:
  lolbin:
  - Image|endswith: '\ie4uinit.exe'
  - OriginalFileName: 'IE4UINIT.EXE'
  filter_correct:
    CurrentDirectory:
    - 'c:\windows\system32\'
    - 'c:\windows\sysWOW64\'
  filter_missing:
    CurrentDirectory:
  condition: lolbin and not 1 of filter_*
falsepositives:
- ViberPC updater calls this binary with the following commandline "ie4uinit.exe
  -ClearIconCache"
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_lolbin_ie4uinit/info.yml
note: |
  ### Technical Context

  This rule detects the execution of the `ie4uinit.exe` binary from a non-standard directory, specifically when it runs with a specially crafted `ie4uinit.inf` file. This behavior is often indicative of an attacker attempting to execute commands stealthily using a legitimate binary, which can aid in evasion of defenses. The likely objective of the attacker is to gain unauthorized access or perform malicious actions without raising suspicion.

  This detection is relevant to the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution). The primary telemetry source for this rule is Windows process creation logs, specifically focusing on the `Security Event ID 4688` and Sysmon Event ID 1. If this behavior is malicious, it could lead to a compromise of system integrity, allowing an adversary to execute arbitrary commands with user privileges. Importantly, this detection does NOT confirm that the activity is malicious on its own; further analysis is needed to establish intent.

  ### Investigation Steps

  - **Review process creation logs for relevant events**: Check Security Event ID 4688 or Sysmon Event ID 1 around the time of the alert. Verify that `ie4uinit.exe` was executed from a non-standard directory, looking at the `CurrentDirectory` field.

  - **Validate command-line arguments**: Look for any unusual command-line arguments passed to `ie4uinit.exe`. Malicious usage often includes arguments that differ from standard operations, which can provide context for intent.

  - **Identify high-confidence malicious indicators**: Investigate for occurrences of `ie4uinit.exe` executed with a custom `ie4uinit.inf` file from a directory that is not typically associated with this binary, indicating potential misuse of the process.

  - **Cross-reference with known benign activity**: Determine if any known applications (e.g., ViberPC updater) utilize `ie4uinit.exe` legitimately and verify its command-line usage. For example, a benign process would include the command `ie4uinit.exe -ClearIconCache`.

  - **Analyze process parentage**: Investigate the parent process ID (PID) associated with the execution of `ie4uinit.exe`. Common benign parents include system processes; if the parent is an unknown or uncommon process, this may signal malicious activity.

  - **Check for file creation or exfiltration artifacts**: Look for any file creations or unusual network activities (e.g., connections to uncommon external endpoints) from the machine that executed `ie4uinit.exe`. This can help indicate whether the rule is part of a larger attack.

  ### Prioritization

  The alert has medium severity due to the potential impact of the affected system. The likelihood of malicious abuse exists since many attackers leverage well-known binaries for obfuscation. This behavior is not widely weaponized but has been documented in attack scenarios, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations as attackers could use other legitimate binaries, and evasion techniques could include renaming or relocating suspicious files. It requires proper logging configurations to ensure comprehensive coverage, such as having Sysmon and Windows Event Forwarding enabled. Legitimate applications might trigger this alert by employing `ie4uinit.exe` without malicious intent. A related detection to consider is monitoring for unusual parent-child process relationships, which can provide context to the execution of `ie4uinit.exe` and improve overall coverage.

