title: Ie4uinit Lolbin Use From Invalid Path
id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
status: test
description: Detect use of ie4uinit.exe to execute commands from a specially 
  prepared ie4uinit.inf file from a directory other than the usual directories
references:
- https://lolbas-project.github.io/lolbas/Binaries/Ie4uinit/
- https://bohops.com/2018/03/10/leveraging-inf-sct-fetch-execute-techniques-for-bypass-evasion-persistence-part-2/
author: frack113
date: 2022-05-07
modified: 2022-05-16
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: process_creation
detection:
  lolbin:
  - Image|endswith: '\ie4uinit.exe'
  - OriginalFileName: 'IE4UINIT.EXE'
  filter_correct:
    CurrentDirectory:
    - 'c:\windows\system32\'
    - 'c:\windows\sysWOW64\'
  filter_missing:
    CurrentDirectory:
  condition: lolbin and not 1 of filter_*
falsepositives:
- ViberPC updater calls this binary with the following commandline "ie4uinit.exe
  -ClearIconCache"
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of `ie4uinit.exe` from anomalous paths, particularly when invoked using a modified `ie4uinit.inf` file. This behavior is typically associated with an attacker aiming to leverage a living-off-the-land binary (LOLBIN) to execute commands covertly, facilitating persistence or evasion within a compromised environment. The relevant MITRE ATT&CK technique here is "Software Deployment Tools" (T1218).

  The primary telemetry source is Windows process creation logs, specifically targeting security event IDs (4688) and Sysmon event ID (1). If malicious, this behavior may lead to unauthorized execution of code, data exfiltration, or further compromise of the system. This detection does NOT confirm any successful data theft or malicious intent on its own, as `ie4uinit.exe` can be legitimately executed by system processes.

  ### Investigation Steps

  - **Review the process creation logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for instances of `ie4uinit.exe` execution. Ensure the `CurrentDirectory` is not from `C:\Windows\System32\` or `C:\Windows\SysWOW64\`, which are legitimate paths for this binary.

  - **Examine the command line arguments**: Analyze the command line used during the invocation of `ie4uinit.exe` for suspicious strings. Malicious use may include execution of additional commands through the `-inf` parameter tied to an unexpected path.

  - **Investigate file presence in unusual directories**: Confirm whether `ie4uinit.inf` is located in non-standard directories such as the user's local directory or temp locations. The absence from standard installation paths could indicate potential malicious behavior.

  - **Identify legitimate usage patterns**: A legitimate usage example of `ie4uinit.exe` is the update mechanism of ViberPC, which uses the command line "ie4uinit.exe -ClearIconCache". Look for similar benign patterns to distinguish between legitimate activity and potential threats.

  - **Correlate with other system events**: Review any preceding or subsequent log entries that might indicate related malicious activities. Check for unusual user logins or lateral movement (Event ID 4624) to provide context for the alert.

  - **Assess impact of the affected system**: Identify whether the impacted host is a critical asset, such as a domain controller, as malicious execution from such systems can have widespread effects and indicate a higher priority incident.

  ### Prioritization

  This alert should be considered medium priority. The impact is heightened if the affected system is critical to operations, and the likelihood of malicious abuse is moderate due to the potential misuse of LOLBINs. This technique is increasingly weaponized in targeted attacks, making prompt investigation essential.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by system configurations that do not log necessary process creation events. Attackers may also attempt to rename or copy `ie4uinit.exe` to evade detection. Legitimate activities that could trigger this alert include updates or installations requiring the use of `ie4uinit.exe` under non-standard circumstances. Related detections that support comprehensive coverage could include monitoring for anomalous PowerShell or command-line activity (T1059.001).

