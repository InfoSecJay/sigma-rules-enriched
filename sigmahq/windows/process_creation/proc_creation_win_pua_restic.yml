logsource:
  product: windows
  category: process_creation
detection:
  selection_specific:
  - CommandLine|contains|all:
    - '--password-file'
    - 'init'
    - ' -r '
  - CommandLine|contains|all:
    - '--use-fs-snapshot'
    - 'backup'
    - ' -r '
  selection_restic:
    CommandLine|contains:
    - 'sftp:'
    - 'rest:http'
    - 's3:s3.'
    - 's3.http'
    - 'azure:'
    - ' gs:'
    - 'rclone:'
    - 'swift:'
    - ' b2:'
    CommandLine|contains|all:
    - ' init '
    - ' -r '
  condition: 1 of selection_*
falsepositives:
- Legitimate use of Restic for backup purposes within the organization.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Restic backup tool, which can be abused for data exfiltration through various cloud storage services. An attacker may utilize Restic to back up sensitive files to remote repositories, potentially undermining data confidentiality. This behavior correlates with the MITRE ATT&CK tactics such as Exfiltration (TA0010) and specifically the technique for Data Exfiltration to Cloud Storage (T1567.002). The primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688, which provides details about command-line arguments used during execution. If the detected execution is malicious, it could lead to significant data loss or compromise. This detection does NOT confirm the intent of exfiltration; legitimate backup activities may trigger the alert.

  ### Investigation Steps

  - **Verify command line arguments:** Check for Event ID 4688 in Windows Security logs. Focus on command lines including `--password-file`, `init`, and `-r`, indicating potential misuse.

  - **Assess file paths:** Identify the file paths used in the backup command via Event ID 4688. Legitimate Restic backups will usually reference internal asset directories, unlike suspicious paths that may indicate external cloud locations (e.g., `s3:` or `azure:`).

  - **Evaluate scheduled tasks:** Review Task Scheduler for any authorized tasks associated with Restic execution. Confirm if existing processes align with internal backup policies, which typically occur during designated maintenance windows.

  - **Cross-check with user roles:** Determine whether the executing user has permission to run backup tools and access the specified files. Check user activity logs for unusual access patterns or administrative tasks that could indicate misusing privileges.

  - **Examine network connections:** Look for suspicious outbound connections in firewall or proxy logs tied to known cloud storage services (e.g., S3, Azure). Malicious indicators may include unexpected or unauthorized data transmissions coinciding with Restic execution.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive data stored on the affected system. The likelihood of malicious use is significant, as tools like Restic are commonly weaponized for data exfiltration. Unmonitored backup tools can lead to severe data breaches if exploited.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases for Restic within the organization, potentially leading to false positives. Adequate logging for command line executions and process creations must be ensured for effective detection. User-initiated backups often trigger this alert, indicative of routine IT operations rather than malicious behavior. Companion detection rules for network exfiltration or unusual process creation may enhance coverage and improve detection efficacy.

