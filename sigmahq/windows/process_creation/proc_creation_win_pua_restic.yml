title: PUA - Restic Backup Tool Execution
id: 6ddff2e8-ea1a-45d0-8938-93dfc1d67ae7
status: experimental
description: |
  Detects the execution of the Restic backup tool, which can be used for data exfiltration.
  Threat actors may leverage Restic to back up and exfiltrate sensitive data to remote storage locations, including cloud services.
  If not legitimately used in the enterprise environment, its presence may indicate malicious activity.
references:
- https://thedfirreport.com/2024/09/30/nitrogen-campaign-drops-sliver-and-ends-with-blackcat-ransomware/#exfiltration
- https://restic.net/
- https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html
author: Nounou Mbeiri, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-17
tags:
- attack.exfiltration
- attack.t1048
- attack.t1567.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_specific:
  - CommandLine|contains|all:
    - '--password-file'
    - 'init'
    - ' -r '
  - CommandLine|contains|all:
    - '--use-fs-snapshot'
    - 'backup'
    - ' -r '
  selection_restic:
    CommandLine|contains:
    - 'sftp:'
    - 'rest:http'
    - 's3:s3.'
    - 's3.http'
    - 'azure:'
    - ' gs:'
    - 'rclone:'
    - 'swift:'
    - ' b2:'
    CommandLine|contains|all:
    - ' init '
    - ' -r '
  condition: 1 of selection_*
falsepositives:
- Legitimate use of Restic for backup purposes within the organization.
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the Restic backup tool, commonly used for data exfiltration by threat actors. In scenarios where Restic is not a recognized or legitimate application within an organization, its execution may indicate malicious behavior, such as an attempt to backup and exfiltrate sensitive data to remote storage solutions, including cloud services like AWS S3, Google Cloud Storage, or Azure Blob Storage. An attacker could leverage Restic to facilitate covert data transfers while using its legitimate appearance for evasion.

  The relevant MITRE ATT&CK techniques associated with this behavior include **Exfiltration Over Command and Control Channel (T1041)**, as well as **Exfiltration to Cloud Storage (T1567.002)**, allowing attackers to move data using established cloud services. The primary data sources for effective detection will be Windows process creation logs, which will capture the command-line arguments used to execute Restic and may reveal the intent behind its use.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze Windows process creation logs to identify any executions of the Restic tool. Pay special attention to command-line arguments that indicate data backup or initialization to remote repositories.
  - **Analyze Command-Line Arguments:** Focus on the presence of specific command-line flags commonly associated with exfiltration (e.g., `--password-file`, `-r`, `s3:`, `rclone:`). This could indicate that the tool is used to initiate unauthorized backups.
  - **Monitor Network Connections:** Investigate any network connections that correlate with the timing of Restic execution, particularly those involving cloud storage services that may be used for data exfiltration.
  - **Cross-Reference with Asset Inventory:** Check if the execution of Restic aligns with legitimate business operations or if it stands out as suspicious. Any unusual instances should be evaluated further for context.

  ### Prioritization
  This alert is classified as high severity due to the significant risk posed by unauthorized data exfiltration, which can lead to data breaches and compliance violations. The likelihood of threat actors employing tools like Restic for malicious purposes further emphasizes the need for immediate investigation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments where Restic is legitimately used for backups, which could generate false positives in this detection rule. The detection logic assumes that all instances of Restic execution without legitimate context are suspicious; thus, context verification is critical for accurate assessment. Adequate logging of command-line executions and clear visibility into authorized uses of backup tools are required for the effectiveness of this rule.

