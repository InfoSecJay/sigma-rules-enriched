logsource:
  category: process_creation
  product: windows
detection:
  selection_main:
  - CommandLine|contains|all:
              # net.exe
    - 'localgroup '
    - ' /add'
  - CommandLine|contains|all:
              # powershell.exe
    - 'Add-LocalGroupMember '
    - ' -Group '
  selection_group:
    CommandLine|contains:
    - 'Group Policy Creator Owners'
    - 'Schema Admins'
  condition: all of selection_*
falsepositives:
- Administrative activity that must be investigated
level: high
note: |
  ---

  ### Technical Context

  This rule detects when users are added to highly privileged groups, such as "Group Policy Creator Owners" or "Schema Admins," using commands like "net localgroup" or "Add-LocalGroupMember." The likely attacker objective is to gain elevated privileges within the environment, enabling further exploitation and control over systems. This behavior corresponds with the MITRE ATT&CK tactic of **Privilege Escalation** (TA0004) and the technique **Additive Privilege** (T1098).

  Primary telemetry sources for this detection include process creation events from Windows Security Event ID 4688 and Sysmon Event ID 1, which log command-line activity. The security impact of successful exploitation includes unauthorized access to sensitive configurations and resources. However, this detection alone does not confirm malicious intent, as legitimate administrative actions may also trigger the alert.

  ---

  ### Investigation Steps

  - **Verify command execution source:** Review Security Event ID 4688 and Sysmon Event ID 1 for command-line details. Look for execution from untrusted or unexpected hosts, which may indicate malicious intent.

  - **Check user account and role:** Inspect Active Directory logs for the added user's account status and role. Legitimate administrative tasks show activity from accounts in administrative roles with a clear business justification.

  - **Assess timing and frequency of activity:** Look for unusual times or patterns in the log entries when users are added to privileged groups. Anomalous timing could indicate a security incident.

  - **Identify other related group modifications:** Review logs for modifications of other sensitive groups (e.g., "Domain Admins") around the same timeframe. Multiple privileged modifications can indicate escalation efforts.

  - **Correlate with other alerting detections:** Cross-reference with alerts for suspicious PowerShell activity or unusual logon behavior that may indicate a broader attack vector being exploited.

  - **Review admin activity logs:** Check for other administrative actions taken by the user or system before and after the command execution to ensure there is a legitimate business context for the privilege change.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential impact of unauthorized privilege escalation in the enterprise. The likelihood of malicious abuse is significant, as adding users to critical groups is a common tactic used by adversaries to maintain access and control. Such behaviors have been consistently weaponized in real-world attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient log source configurations, especially if process creations are not being logged via Sysmon or if event retention policies are inadequate. Legitimate activities, such as routine administrative tasks or automated scripts, may also trigger this alert. A related detection that strengthens coverage is monitoring for changes in group membership combined with access attempts to sensitive resources, which can indicate potential exploitation or lateral movement within the environment.

