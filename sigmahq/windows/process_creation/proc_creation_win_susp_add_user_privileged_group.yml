logsource:
  category: process_creation
  product: windows
detection:
  selection_main:
  - CommandLine|contains|all:
              # net.exe
    - 'localgroup '
    - ' /add'
  - CommandLine|contains|all:
              # powershell.exe
    - 'Add-LocalGroupMember '
    - ' -Group '
  selection_group:
    CommandLine|contains:
    - 'Group Policy Creator Owners'
    - 'Schema Admins'
  condition: all of selection_*
falsepositives:
- Administrative activity that must be investigated
level: high
note: |
  ---

  ### Technical Context

  This rule detects instances where a user is added to highly privileged groups (e.g., "Administrators", "Domain Admins", "Schema Admins") through command-line tools such as `net.exe` or `PowerShell`. The likely attacker objective is to elevate privileges and gain unauthorized access to critical system resources or sensitive information. This behavior maps to the MITRE ATT&CK tactic of **Privilege Escalation (TA0004)** and techniques such as **T1098: Account Manipulation**. The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4672 (Special Privileges Assigned to New Logon) and Sysmon Event ID 1 (Process Creation). If malicious, this activity could lead to severe security incidents, undermining system integrity and confidentiality. However, this detection does NOT confirm that the action was malicious on its own, as it could also result from legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Check recent active directory changes:** Review Windows Security logs (Event ID 4728) for any recent additions to privileged groups. Look specifically for timestamps correlating with the alert and inspect the source account involved.

  - **Correlate with user roles:** Identify whether the user being added to the group has a legitimate need for this access based on their job function. Typical roles authorized to manage such groups include system administrators; unexpected changes may indicate malicious intent.

  - **Analyze command execution context:** Inspect command-line parameters in Sysmon Event ID 1 logs for `net.exe` or `powershell.exe` executions. Particularly note any occurrences with abnormal paths or unusual accounts executing these commands.

  - **Verify alerts triggered by script execution:** Look for instances where scripts or automation (e.g., PowerShell scripts) are being executed that log modifications or user additions to sensitive groups. Examine the command for patterns suggesting generic or automated malicious behavior.

  - **Examine lateral movement indicators:** If the alert was triggered by remote access methods (e.g., RDP), check for Windows Security Event IDs 4624 (Successful Logon) to verify the connection source and ensure it's originating from a known and trusted asset.

  ---

  ### Prioritization

  This alert is of **high severity** as it involves the manipulation of user privileges, which could enable an attacker to execute further malicious activity and potentially compromise critical systems. The likelihood of malicious abuse is high, especially given that privilege escalation tactics are frequently weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the reliance on process creation logs, which can be manipulated or suppressed by sophisticated adversaries. Ensure that Sysmon and Security Event logging is properly configured and enabled for comprehensive visibility. Legitimate administrative activities, such as a scheduled role change during maintenance windows, could trigger this alert. A complementary detection, such as monitoring for unusual RDP activity alongside this rule, could enhance coverage against potential exploit scenarios.

