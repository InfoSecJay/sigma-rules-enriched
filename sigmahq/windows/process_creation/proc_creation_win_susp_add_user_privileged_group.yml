note: |
  ### Technical Context
  This detection rule focuses on identifying unauthorized or unexpected addition of users to highly privileged groups within a Windows environment. Attackers often seek to escalate their privileges or maintain persistence after gaining initial access, and one effective method is to add themselves or malicious users to groups with extensive permissions, such as "Administrators," "Domain Admins," or "Schema Admins." By leveraging commands like `net.exe` and `Add-LocalGroupMember`, an intruder can surreptitiously elevate their access, making this a critical scenario for detection.

  The relevant MITRE ATT&CK tactics include **Privilege Escalation (TA0004)**, as the actions usually aim to increase the attacker's level of access, and **Persistence (TA0003)**, where the attacker ensures they can maintain access to the compromised system. The techniques specifically indicated are **T1098 - Account Manipulation**. Monitoring is essential for any enterprise, as unauthorized privilege escalations can lead to data theft, further compromises, or data destruction.

  Primary data sources for this detection include **process creation events** from Windows systems, as they provide visibility into command-line activities that involve the execution of tools used for adding users to privileged groups.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for any `net.exe` or `powershell.exe` commands executed that contain the keywords "localgroup" or "Add-LocalGroupMember." Note the user context in which these commands were executed to identify potential unauthorized actions.

  - **Analyze Group Membership Changes:** Correlate group membership changes with the timings of the process creation events. Identify the user or group being added and assess their prior activity for any suspicious patterns.

  - **Evaluate LDAP and Active Directory Logs:** Investigate LDAP query logs related to Active Directory to track the querying of group memberships. Pay special attention to any unusual queries or alterations to user privileges immediately preceding or following the command execution.

  - **Identify Other Security Alerts:** Check for any additional security alerts that may have been triggered around the same time as the privileged group modification, which could indicate broader attacks or a consistent threat actor behavior pattern.

  ### Prioritization
  This alert has a high severity rating due to the significant risk associated with unauthorized access to highly privileged accounts, which can lead to extensive data breaches or system compromise in an enterprise environment.

  ### Blind Spots and Assumptions
  One gap in detection coverage lies in the inability to capture legitimate administrative activities that may involve similar command usage without thorough contextual analysis. The detection logic assumes that alteration to group memberships should always be scrutinized, which may not account for genuine administrative tasks. Additionally, the detection requires properly configured logging to capture process creation events, and environments lacking this may miss critical indicators of compromise.

