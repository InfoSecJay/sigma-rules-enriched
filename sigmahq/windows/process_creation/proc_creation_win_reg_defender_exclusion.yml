title: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
id: 48917adc-a28e-4f5d-b729-11e75da8941f
status: test
description: Detects the usage of "reg.exe" to add Defender folder exclusions. 
  Qbot has been seen using this technique to add exclusions for folders within 
  AppData and ProgramData.
references:
- https://thedfirreport.com/2022/02/07/qbot-likes-to-move-it-move-it/
- https://redcanary.com/threat-detection-report/threats/qbot/
author: frack113
date: 2022-02-13
modified: 2023-02-04
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
    - 'SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths'
    - 'SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths'
    CommandLine|contains|all:
    - 'ADD '
    - '/t '
    - 'REG_DWORD '
    - '/v '
    - '/d '
    - '0'
  condition: selection
falsepositives:
- Legitimate use
level: medium
note: |
  ### Technical Context

  This rule detects the creation of folder exclusions in Windows Defender using `reg.exe`, specifically targeting paths within `AppData` and `ProgramData`. The likely attacker objective is to bypass security controls and avoid detection by adding malicious folders to the exclusion list, thereby allowing malware, such as Qbot, to operate undetected. This behavior maps to the MITRE ATT&CK technique "Exclusions" (T1562.001), under the tactic of Defense Evasion.

  The primary telemetry sources for this rule are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command line execution. If malicious, the security impact includes the potential for undetected malware execution and persistence on the system. It’s important to note that the detection of this behavior does NOT confirm that the system is compromised, as legitimate administrative tasks may also trigger this alert.

  ### Investigation Steps

  - **Review command line arguments:** Check for events with `Event ID 4688` where `Image` ends with `\reg.exe` and `CommandLine` contains `SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths`. Determine if valid operational reasons exist for the addition of the exclusion.

  - **Identify excluded paths:** Look for typical exclusion patterns targeting `C:\Users\<username>\AppData` or `C:\ProgramData`. Validate whether the paths are associated with known valid applications or processes. Legitimate folders typically follow expected naming conventions and are part of standard applications.

  - **Assess process lineage:** Analyze the parent process of the `reg.exe` execution in Sysmon logs (`Event ID 1`). Check if the parent process is a legitimate management or administrative tool indicating authorized access versus potentially malicious activity indicating lateral movement.

  - **Check recent security events:** Monitor for other related Security Event IDs, such as 5156 and 4689, to identify if there were other unusual modifications or anomalies coinciding with the time of the exclusion. Multiple changes in a short time span raise suspicion.

  - **Consult system role and criticality:** For hosts designated as critical infrastructure, consider the severity of any detected exclusion additions. Pay close attention to system administrators' actions to differentiate between legitimate and potentially suspicious behavior.

  - **Correlate with threat intelligence:** Research any related detections of Qbot or similar ransomware that leverage exclusion techniques. Insights from threat intelligence reports can provide context to the significance of this alert.

  ### Prioritization

  This alert is of **medium severity** in an enterprise context, as it involves behavior that is beneficial for adversaries when executing malware while posing a threat primarily to sensitive systems. Given that malware like Qbot frequently leverages exclusion tactics, the likelihood of malicious abuse is notable.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using other scripting methods or utilities to modify exclusions, which would not trigger this rule. It’s crucial to ensure that Windows Defender logging is enabled and configured correctly to capture this activity reliably. Legitimate administrative tasks, particularly during maintenance or security updates, may inadvertently trigger this alert. A companion detection to consider is monitoring for unusual command line parameters with `cmd.exe` or PowerShell, which can also indicate malicious intent.

