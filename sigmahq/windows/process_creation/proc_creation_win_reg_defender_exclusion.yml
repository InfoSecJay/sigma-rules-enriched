title: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
id: 48917adc-a28e-4f5d-b729-11e75da8941f
status: test
description: Detects the usage of "reg.exe" to add Defender folder exclusions. 
  Qbot has been seen using this technique to add exclusions for folders within 
  AppData and ProgramData.
references:
- https://thedfirreport.com/2022/02/07/qbot-likes-to-move-it-move-it/
- https://redcanary.com/threat-detection-report/threats/qbot/
author: frack113
date: 2022-02-13
modified: 2023-02-04
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
    - 'SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths'
    - 'SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths'
    CommandLine|contains|all:
    - 'ADD '
    - '/t '
    - 'REG_DWORD '
    - '/v '
    - '/d '
    - '0'
  condition: selection
falsepositives:
- Legitimate use
level: medium
note: |
  ### Technical Context

  This rule detects the use of `reg.exe` to add exclusions to Windows Defender, specifically targeting folder paths that may be exploited by an attacker to evade detection. The likely objective is to allow malicious files or processes within specific folders to be ignored by antivirus scans, thereby maintaining persistence and mitigating detection. Related to the MITRE ATT&CK framework, this activity aligns with the tactic of "Defense Evasion" under technique T1685 (Baiting).

  The primary telemetry source for this detection is process creation logs, specifically from Windows environments, including Event ID 4688 for process creation activities. If malicious, this behavior poses a significant risk as it could allow the execution of malware that otherwise would be detected by Windows Defender. Importantly, this detection does NOT confirm that an actual incident occurred; it only indicates that a potentially suspicious action was attempted.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 to identify the exact command that invoked `reg.exe`. Look for a command line containing `reg.exe ADD` along with the specified paths, focusing on the presence of `/d 0`.

  - **Analyze related processes:** Identify parent processes of the `reg.exe` execution by correlating with Sysmon Event ID 1. Malicious usage might be initiated by known malware processes or through exploitative script execution.

  - **Identify legitimate usage patterns:** Consider the normal operational use of folder exclusions in your environment. If `reg.exe` is executed regularly by system administrators in conjunction with legitimate system maintenance activities, this may be benign.

  - **Cross-reference with known artifacts:** Validate against known Qbot indicators. Look for other malicious behaviors or persistence mechanisms tied to the user account or machine executing the command. Indicators could include unusual file modifications or additional registry keys being created.

  - **Assess asset criticality:** Evaluate the sensitivity and role of the affected system. Exclusions added for critical infrastructure components or systems handling sensitive data should escalate the investigation priority.

  ### Prioritization

  This alert should be treated as medium severity. While the behavior detected can indicate nefarious intent, the context (e.g., user roles, environment norms) is crucial for assessing risk. The method used by Qbot to exploit folder exclusions is known, indicating a likelihood of malicious use in environments lacking appropriate defenses.

  ### Blind Spots and Assumptions

  The detection may miss legitimate uses of `reg.exe` for adding exclusions by authorized personnel or software, leading to potential false positives. Adequate logging for process execution (like Event ID 4688) must be enabled for reliable detection. Additionally, attackers might employ other tools or methods (e.g., PowerShell scripts) to achieve similar results, which may go undetected. Companion detections worth considering include monitoring for unusual process creation patterns and reviewing Windows Defender logs for unauthorized changes.

