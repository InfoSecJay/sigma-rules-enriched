title: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
id: 48917adc-a28e-4f5d-b729-11e75da8941f
status: test
description: Detects the usage of "reg.exe" to add Defender folder exclusions. Qbot
  has been seen using this technique to add exclusions for folders within AppData
  and ProgramData.
references:
- https://thedfirreport.com/2022/02/07/qbot-likes-to-move-it-move-it/
- https://redcanary.com/threat-detection-report/threats/qbot/
author: frack113
date: 2022-02-13
modified: 2023-02-04
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
    - 'SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths'
    - 'SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths'
    CommandLine|contains|all:
    - 'ADD '
    - '/t '
    - 'REG_DWORD '
    - '/v '
    - '/d '
    - '0'
  condition: selection
falsepositives:
- Legitimate use
level: medium
note: |
  ### Technical Context
  This rule detects the usage of `reg.exe` to add folder exclusions in Windows Defender. Such exclusions can be exploited by threat actors looking to evade detection by antivirus software, ultimately allowing them to execute malicious actions more freely. The Qbot malware, which is known for its focus on financial gain through data theft and propagation, has been observed utilizing this technique to manipulate Defender settings and ensure its malicious payloads are not flagged.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (TA0060)**, specifically the technique **Indicator Removal on Host (T1562.001)**, where attackers try to reduce the visibility of their activities. Primary data sources for detecting this behavior include process creation events, which log the execution of applications like `reg.exe` along with their command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigate any `reg.exe` process creation events around the time of detection. Pay special attention to the command-line arguments used to ensure they match with the suspicious pattern of adding exclusions.

  - **Analyze Command-Line Parameters:** Look for the specific command-line components such as `SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths`, `ADD`, and `REG_DWORD`. Confirm if these exclusions were added to directories associated with high-value targets like `AppData` or `ProgramData`.

  - **Check for Compromised Accounts:** Evaluate user account activity in conjunction with the timing of the suspicious exclusion creation. Confirm whether the command was executed by a legitimate user or if there are signs of account compromise.

  - **Inspect Defender Logs:** If available, review Windows Defender logs to trace any subsequent actions taken against the folders that were excluded. This can reveal any subsequent malware activities that may have occurred without detection.

  ### Prioritization
  The severity of this alert is medium due to the potential risk of enabling undetected malicious activity through evasion of security controls. While folder exclusions can stem from legitimate user actions, their use by malware like Qbot poses a high likelihood of impact in an enterprise environment.

  ### Blind Spots and Assumptions
  One blind spot of this detection could be legitimate administrative actions that might not be captured by the monitoring of `reg.exe` modifications. Additionally, this rule assumes that Windows Defender's exclusion path is not being monitored with tighter security controls, which may restrict visibility of malicious modifications. Ensuring adequate logging and security configurations, particularly for process creation events and Windows Defender actions, is essential for this alert to function effectively.

