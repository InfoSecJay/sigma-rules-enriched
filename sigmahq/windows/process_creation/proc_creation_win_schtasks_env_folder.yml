title: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via
  Schtasks.EXE
id: 81325ce1-be01-4250-944f-b4789644556f
related:
- id: 43f487f0-755f-4c2a-bce7-d6d2eec2fcf8     # TODO: Recreate after baseline
  type: derived
status: test
description: Detects Schtask creations that point to a suspicious folder or an environment
  variable often used by malware
references:
- https://www.welivesecurity.com/2022/01/18/donot-go-do-not-respawn/
- https://www.joesandbox.com/analysis/514608/0/html#324415FF7D8324231381BAD48A052F85DF04
- https://blog.talosintelligence.com/gophish-powerrat-dcrat/
author: Florian Roth (Nextron Systems)
date: 2022-02-21
modified: 2025-10-07
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_1_create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|windash: ' /create '
  selection_1_all_folders:
    CommandLine|contains:
    - ':\Perflogs'
    - ':\Users\All Users\'
    - ':\Users\Default\'
    - ':\Users\Public'
    - ':\Windows\Temp'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '%AppData%'
    - '%Public%'
  selection_2_parent:
    ParentCommandLine|endswith: '\svchost.exe -k netsvcs -p -s Schedule'
  selection_2_some_folders:
    CommandLine|contains:
    - ':\Perflogs'
    - ':\Windows\Temp'
    - '\Users\Public'
    - '%Public%'
  filter_optional_other:
  - ParentCommandLine|contains: 'unattended.ini'
  - CommandLine|contains: 'update_task.xml'
  filter_optional_team_viewer:
    CommandLine|contains: '/Create /TN TVInstallRestore /TR'
  filter_optional_avira_install:
        # Comment out this filter if you dont use AVIRA
    CommandLine|contains|all:
    - '/Create /Xml '
    - '\Temp\.CR.'
    - '\Avira_Security_Installation.xml'
  filter_optional_avira_other:
        # Comment out this filter if you dont use AVIRA
    CommandLine|contains|all:
    - '/Create /F /TN'
    - '/Xml '
    - '\Temp\'
    - 'Avira_'
    CommandLine|contains:
    - '.tmp\UpdateFallbackTask.xml'
    - '.tmp\WatchdogServiceControlManagerTimeout.xml'
    - '.tmp\SystrayAutostart.xml'
    - '.tmp\MaintenanceTask.xml'
  filter_optional_klite_codec:
    CommandLine|contains|all:
    - '\Temp\'
    - '/Create /TN "klcp_update" /XML '
    - '\klcp_update_task.xml'
  condition: ( all of selection_1_* or all of selection_2_* ) and not 1 of filter_optional_*
falsepositives:
- Benign scheduled tasks creations or executions that happen often during software
  installations
- Software that uses the AppData folder and scheduled tasks to update the software
  in the AppData folders
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving the Windows `schtasks.exe` command-line tool, specifically when it is used to create scheduled tasks that point to suspicious directories or utilize environment variables commonly abused by malware. Attackers often use scheduled tasks to maintain persistence on compromised systems, execute malicious scripts at specific intervals, or automate the execution of malware. This rule is particularly pertinent in scenarios where an attacker attempts to establish footholds or execute payloads stealthily within a target environment.

  The relevant MITRE ATT&CK techniques involved include:
  - **T1053.005**: Scheduled Task/Job: Windows Task Scheduler
  - **T1543.002**: Create or Modify System Process: Windows Service
  - **T1218.011**: Signed Binary Proxy Execution: Windows (via `schtasks.exe`)

  Primary data sources for this detection include process creation events which will display command-line arguments used with `schtasks.exe`, allowing for insights into potentially malicious scheduled tasks based on their characteristics.

  ### Investigation Steps
  - **Review Command-Line Arguments**: Analyze the command-line arguments captured in process creation logs to identify any suspicious paths or the use of environment variables that could indicate malicious intent.
  - **Correlate Parent Process**: Investigate the parent process of `schtasks.exe`, particularly if it is invoked by `svchost.exe`, as legitimate use may be less common. This could reveal possible chain actions initiated by malware.
  - **Examine Scheduled Tasks**: Utilize Windows Task Scheduler to review the tasks that were created, focusing on those pointing to folders like `%AppData%`, `Temp`, or other unusual paths. Look for tasks not matching expected naming conventions or execution times.
  - **Verify Artifact Validity**: Confirm whether the detected scheduled tasks correlate to known valid software or system updates. Report benign entries appropriately, but flag any that appear irregular for deeper investigation.

  ### Prioritization
  This alert warrants medium severity due to the potential for persistent malicious activity enabled by the creation of scheduled tasks, which can significantly impact system integrity and confidentiality if exploited by an attacker.

  ### Blind Spots and Assumptions
  There may be instances where benign applications legitimately create scheduled tasks in suspicious directories, leading to false positives. Additionally, the detection logic assumes that `schtasks.exe` is operational and that command-line logging is enabled on endpoint devices. If the appropriate logging-level configurations are not in place or if alternate methods of task creation (such as WMI or PowerShell) are employed, this alert may not capture all malicious activities effectively.

