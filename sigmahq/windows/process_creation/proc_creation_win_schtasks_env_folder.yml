title: Schedule Task Creation From Env Variable Or Potentially Suspicious Path 
  Via Schtasks.EXE
id: 81325ce1-be01-4250-944f-b4789644556f
related:
- id: 43f487f0-755f-4c2a-bce7-d6d2eec2fcf8     # TODO: Recreate after baseline
  type: derived
status: test
description: Detects Schtask creations that point to a suspicious folder or an 
  environment variable often used by malware
references:
- https://www.welivesecurity.com/2022/01/18/donot-go-do-not-respawn/
- https://www.joesandbox.com/analysis/514608/0/html#324415FF7D8324231381BAD48A052F85DF04
- https://blog.talosintelligence.com/gophish-powerrat-dcrat/
author: Florian Roth (Nextron Systems)
date: 2022-02-21
modified: 2025-10-07
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_1_create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|windash: ' /create '
  selection_1_all_folders:
    CommandLine|contains:
    - ':\Perflogs'
    - ':\Users\All Users\'
    - ':\Users\Default\'
    - ':\Users\Public'
    - ':\Windows\Temp'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '%AppData%'
    - '%Public%'
  selection_2_parent:
    ParentCommandLine|endswith: '\svchost.exe -k netsvcs -p -s Schedule'
  selection_2_some_folders:
    CommandLine|contains:
    - ':\Perflogs'
    - ':\Windows\Temp'
    - '\Users\Public'
    - '%Public%'
  filter_optional_other:
  - ParentCommandLine|contains: 'unattended.ini'
  - CommandLine|contains: 'update_task.xml'
  filter_optional_team_viewer:
    CommandLine|contains: '/Create /TN TVInstallRestore /TR'
  filter_optional_avira_install:
        # Comment out this filter if you dont use AVIRA
    CommandLine|contains|all:
    - '/Create /Xml '
    - '\Temp\.CR.'
    - '\Avira_Security_Installation.xml'
  filter_optional_avira_other:
        # Comment out this filter if you dont use AVIRA
    CommandLine|contains|all:
    - '/Create /F /TN'
    - '/Xml '
    - '\Temp\'
    - 'Avira_'
    CommandLine|contains:
    - '.tmp\UpdateFallbackTask.xml'
    - '.tmp\WatchdogServiceControlManagerTimeout.xml'
    - '.tmp\SystrayAutostart.xml'
    - '.tmp\MaintenanceTask.xml'
  filter_optional_klite_codec:
    CommandLine|contains|all:
    - '\Temp\'
    - '/Create /TN "klcp_update" /XML '
    - '\klcp_update_task.xml'
  condition: ( all of selection_1_* or all of selection_2_* ) and not 1 of 
    filter_optional_*
falsepositives:
- Benign scheduled tasks creations or executions that happen often during 
  software installations
- Software that uses the AppData folder and scheduled tasks to update the 
  software in the AppData folders
level: medium
note: |
  ### Technical Context

  This rule detects the creation of scheduled tasks through `schtasks.exe` in suspicious directories or by using environment variables commonly exploited by malware. The likely attacker objective is to establish persistent access or execute malicious payloads at scheduled intervals, which could enable further exploitation of the system. This behavior aligns with the MITRE ATT&CK tactic: Persistence (T1543.003) and Execution (T1053.005).

  The primary telemetry source is Windows process creation logs, particularly focusing on Security Event ID 4688, and Sysmon Event ID 1 for detailed command line arguments. If successful, this behavior could lead to unauthorized system changes, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm the presence of malware on its own; it highlights potential misuse that requires further investigation.

  ---

  ### Investigation Steps

  - **Review process creation events:** Look for Security Event ID 4688 or Sysmon Event ID 1 logs concerning `schtasks.exe`. Validate if the CommandLine attributes reference suspicious directories such as `\Temp`, `\AppData`, or environment variables like `%AppData%`. Filter out benign activities typical of legitimate software installations.

  - **Analyze parent process context:** Investigate the ParentCommandLine to identify if the task was initiated by a trusted process. For example, `(ParentCommandLine|endswith: '\svchost.exe -k netsvcs -p -s Schedule')` could indicate a legitimate system context versus a potential adversary tactic.

  - **Identify high-confidence malicious indicators:** Check for known malicious commands in the CommandLine such as '/Create /TN TVInstallRestore /TR' which are flags often used in the context of malware or unauthorized software deployments.

  - **Correlate with additional telemetry:** Alongside the process creation logs, review any recent changes in system behavior or installed applications, focusing on the application installation logs or configuration files that may correlate with the timing of the detected task creation.

  - **Review system role and asset criticality:** For critical servers or endpoints, consider the implications of the detected activity. For instance, task creation in an administrative server environment should be scrutinized more closely compared to user workstations.

  - **Document expected legitimate activities:** Take note of legitimate software that regularly creates scheduled tasks, such as system updates. Confirm scheduled tasks matching expected operational patterns to distinguish benign tasks from potentially malicious ones.

  ---

  ### Prioritization

  This alert carries a medium severity due to the potential impact on critical systems. While not every instance of this behavior indicates malicious intent, the likelihood of abuse is significant given that the observed activity aligns with common tactics used by adversaries for persistence. The behavior is also commonly weaponized in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate software creating scheduled tasks, potentially generating false positives. It assumes log sources such as Process Creation logs are configured correctly and that monitoring is comprehensive. Activities such as software updates or system maintenance that use common directories might trigger the alert. Companion detections focusing on unusual task execution patterns could enhance coverage, such as monitoring execution timelines or cross-referencing against known software inventories.

