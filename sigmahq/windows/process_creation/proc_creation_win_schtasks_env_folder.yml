title: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via
  Schtasks.EXE
id: 81325ce1-be01-4250-944f-b4789644556f
related:
- id: 43f487f0-755f-4c2a-bce7-d6d2eec2fcf8     # TODO: Recreate after baseline
  type: derived
status: test
description: Detects Schtask creations that point to a suspicious folder or an environment
  variable often used by malware
references:
- https://www.welivesecurity.com/2022/01/18/donot-go-do-not-respawn/
- https://www.joesandbox.com/analysis/514608/0/html#324415FF7D8324231381BAD48A052F85DF04
- https://blog.talosintelligence.com/gophish-powerrat-dcrat/
author: Florian Roth (Nextron Systems)
date: 2022-02-21
modified: 2025-10-07
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_1_create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|windash: ' /create '
  selection_1_all_folders:
    CommandLine|contains:
    - ':\Perflogs'
    - ':\Users\All Users\'
    - ':\Users\Default\'
    - ':\Users\Public'
    - ':\Windows\Temp'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '%AppData%'
    - '%Public%'
  selection_2_parent:
    ParentCommandLine|endswith: '\svchost.exe -k netsvcs -p -s Schedule'
  selection_2_some_folders:
    CommandLine|contains:
    - ':\Perflogs'
    - ':\Windows\Temp'
    - '\Users\Public'
    - '%Public%'
  filter_optional_other:
  - ParentCommandLine|contains: 'unattended.ini'
  - CommandLine|contains: 'update_task.xml'
  filter_optional_team_viewer:
    CommandLine|contains: '/Create /TN TVInstallRestore /TR'
  filter_optional_avira_install:
        # Comment out this filter if you dont use AVIRA
    CommandLine|contains|all:
    - '/Create /Xml '
    - '\Temp\.CR.'
    - '\Avira_Security_Installation.xml'
  filter_optional_avira_other:
        # Comment out this filter if you dont use AVIRA
    CommandLine|contains|all:
    - '/Create /F /TN'
    - '/Xml '
    - '\Temp\'
    - 'Avira_'
    CommandLine|contains:
    - '.tmp\UpdateFallbackTask.xml'
    - '.tmp\WatchdogServiceControlManagerTimeout.xml'
    - '.tmp\SystrayAutostart.xml'
    - '.tmp\MaintenanceTask.xml'
  filter_optional_klite_codec:
    CommandLine|contains|all:
    - '\Temp\'
    - '/Create /TN "klcp_update" /XML '
    - '\klcp_update_task.xml'
  condition: ( all of selection_1_* or all of selection_2_* ) and not 1 of filter_optional_*
falsepositives:
- Benign scheduled tasks creations or executions that happen often during software
  installations
- Software that uses the AppData folder and scheduled tasks to update the software
  in the AppData folders
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks using `schtasks.exe` that reference potentially suspicious directories or environment variables often abused by malware. The likely attacker objective is to establish persistence on a compromised system by creating these tasks in locations that may not be monitored closely. Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Execution** (TA0002), particularly technique **Scheduled Task/Job** (T1053.005). The primary telemetry sources are Windows process creation logs, specifically focusing on `Event ID 4688` for new process creation and `Sysmon Event ID 1` for detailed command line data. If malicious, this behavior can indicate an attempt to maintain control over a system. However, this detection does NOT confirm that the actions are malicious on their own, as legitimate application updates or software installations may trigger similar behaviors.

  ---

  ### Investigation Steps

  - **Review process creation details**: Check `Event ID 4688` for the process `schtasks.exe`. Look at the `CommandLine` field for specific arguments that create the scheduled task, focusing on paths that are listed in the rule (`:\Users\Public`, `:\Windows\Temp`, etc.).

  - **Check parent process context**: Inspect `ParentCommandLine` for `svchost.exe -k netsvcs -p -s Schedule`. Evidence of this parent process can indicate a potentially malicious attempt to obfuscate the real task creator.

  - **Identify benign scheduled tasks**: Cross-reference any discovered scheduled tasks with documentation for your organization. Legitimate scheduled tasks are often created by known software installers like antivirus programs or update services that typically use paths like `C:\Program Files`, rather than `C:\Users\Public`.

  - **Look for high-confidence indicators**: Seek command lines that include suspicious environment variables (e.g., `%AppData%`) alongside keywords like `/Create` or `/TN`. These indicate that the task is being set up in an unexpected or unsafe manner.

  - **Examine log artifact creation**: Confirm that the files created for the scheduled task, such as XML configurations, are present in typically unauthorized locations (e.g., `C:\Users\Public\Temp\`). Validate unusual file creation patterns around the time of the alert.

  - **Assess process behavior post-alert**: Monitor the behavior of the created task over time to check if it attempts to execute malicious payloads or perform unauthorized actions, especially if it relates to known malware families or indicators of compromise.

  ---

  ### Prioritization

  This alert should be considered medium severity primarily due to the potential impact of a compromised system capable of executing arbitrary code through scheduled tasks. The likelihood of malicious abuse is moderate, as adversaries often leverage similar methods to ensure persistence or to orchestrate further attacks. Nevertheless, this behavior can also originate from legitimate software processes, necessitating a careful review of the context.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for legitimate scheduled task creation by benign software, leading to false positives. Additionally, if the necessary logging is not configured to capture detailed command lines or parent processes, critical context may be absent. Legitimate software behaviors, such as automatic updates running from the `AppData` path, can trigger these alerts. A companion detection to consider is monitoring for unusual task execution patterns or failures in tasks, which could provide insight into follow-up actions taken by the detected tasks.

