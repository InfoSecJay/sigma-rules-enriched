note: |
  ### Technical Context

  This Sigma rule detects the use of `dsacls.exe` with command line arguments indicating a possible password spraying attack. The behavior typically involves an unauthorized user trying to verify permissions for multiple accounts by repeatedly attempting to use the `/user:` and `/passwd:` parameters. The likely objective of an attacker employing this technique is to gain access to multiple accounts by systematically testing common passwords against various accounts within an Active Directory environment.

  This detection is associated with the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution) and primarily utilizes Windows process creation logs—specifically looking for Event ID 4688 (Process Creation) to capture instances where `dsacls.exe` is executed with suspicious command line parameters. If malicious, this activity can lead to unauthorized access and lateral movement within the network. Importantly, this detection does NOT confirm that a password spraying attack is occurring on its own; legitimate administrative tasks may trigger similar alerts.

  ### Investigation Steps

  - **Check process execution logs for dsacls.exe**: Review Windows Security Event ID 4688 for instances of `dsacls.exe` being executed. Confirm if the command line parameters include `/user:` and `/passwd:` indicating use for password spraying.

  - **Validate command line context**: Examine the `CommandLine` field in logs to ensure it contains both `/user:` and `/passwd:`. A malicious execution will typically show multiple iterations with different usernames and passwords.

  - **Look for patterns in account usage**: Analyze log sources to identify if the same user credentials or a small set of passwords are being tested across multiple accounts. This indicates potential malicious behavior.

  - **Correlate with legitimate activity**: Review the user context for `dsacls.exe`. Legitimate administrative actions typically include a single execution focused on a specific user or team rather than multiple rapid executions with varied credentials.

  - **Identify high-confidence malicious indicators**: If detected in conjunction with other known malicious behaviors (e.g., unusual login attempts or failed access logs), classify this as a higher threat.

  - **Evaluate asset importance and roles**: Assess the systems where `dsacls.exe` was executed. Critical domain controllers or systems with high privileges should be prioritized for further investigation.

  ### Prioritization

  This alert is of medium severity because it involves a potentially critical action that could lead to unauthorized access within Active Directory. The likelihood of malicious abuse is moderate, particularly among adversaries trying to exploit weak or reused passwords. However, legitimate administrative tasks may also trigger this alert, necessitating careful contextual analysis.

  ### Blind Spots and Assumptions

  Detection may be evaded if attackers use renamed or non-standard tools to achieve similar results. The logs must be configured to capture all process creation events, as incomplete logging could lead to missed detections. Legitimate uses of `dsacls.exe` for proper permission auditing or management may trigger alerts, potentially leading to false positives. Companion detections might include monitoring failed authentication logs (Event ID 4625) around the time of `dsacls.exe` execution to strengthen visibility into possible credential abuse.

