  ---

  ### Technical Context

  The Sigma rule detects potential password spraying attempts via the execution of `dsacls.exe` with specified command-line arguments. An attacker may aim to exploit administrative credentials or check permissions across multiple accounts to gain unauthorized access to sensitive resources. This behavior aligns with the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution) under the Defense Evasion tactic.

  Key telemetry sources include Windows process creation logs, particularly Security Event ID 4688 for process execution and details within Sysmon Event ID 1. A successful password spraying attack could lead to credential compromise, elevating an attacker's access level within the network. However, this detection does NOT confirm an active compromise; it only indicates suspicious command usage.

  ---

  ### Investigation Steps

  - **Identify the process execution event:** Check Security Event ID 4688 for instances where `dsacls.exe` was run. Look for the `NewProcessName` field containing `\dsacls.exe`.

  - **Review command-line arguments:** For identified executions, confirm the `CommandLine` field includes both `/user:` and `/passwd:` parameters. This combination is highly indicative of password spraying attempts.

  - **Cross-reference with legitimate use:** Assess past legitimate usage patterns of `dsacls.exe` on the host (e.g., `dsacls` invoked for administrative purposes without the `/passwd:` flag). Compare against logs to identify anomalies.

  - **Examine associated user accounts:** For the identified process, check which user accounts were targeted by reviewing the `/user:` values in the command line. Look for unusual accounts that deviate from expected usage patterns.

  - **Analyze context and frequency:** Investigate other concurrent logged events from the same host, focusing on the rate of dsacls executions and any unusual patterns suggesting an active attack campaign.

  - **Review remediation actions:** If an attack is confirmed, initiate account lockout procedures and reset passwords for affected user accounts while considering asset criticality and system role.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on user credentials and system access. While the behavior is not the most common attack vector, it is indicative of pre-attack reconnaissance that could lead to successful exploitation if not addressed. Malicious actors actively use these techniques, raising the urgency of investigation.

  ---

  ### Blind Spots and Assumptions

  The primary limitation of this detection is that legitimate uses of `dsacls.exe` may trigger alerts, particularly in environments with frequent administrative tasks. Additionally, logging configurations for process creation events (Event ID 4688) must be enabled for this detection to function effectively. An associated detection like monitoring for failed authentication attempts following this alert can enhance coverage and support refinement of user account security.

