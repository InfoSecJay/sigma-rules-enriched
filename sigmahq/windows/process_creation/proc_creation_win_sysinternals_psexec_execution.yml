note: |
  ### Technical Context

  This Sigma rule detects the execution of the PsExec utility, specifically targeting instances where the executable ends with '\psexec.exe' and has the original file name of 'psexec.c'. The likely attacker objective is to achieve lateral movement within a network or to execute commands remotely on a compromised host. This activity fits under the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Remote Services (T1021).

  The primary telemetry sources include Windows process creation logs, specifically leveraging Security Event ID 4688 for process creation events. The malicious security impact includes unauthorized remote access or command execution, which could facilitate further compromise of systems and data. This detection does NOT confirm the intent behind the PsExec execution; legitimate administrative use can also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs:**
    Check Security Event ID 4688 to identify the PsExec process creation. Look for “Image” field containing '\psexec.exe' and “OriginalFileName” field as 'psexec.c'.

  - **Identify execution context:**
    Analyze the parent process ID associated with the PsExec execution. Legitimate PsExec executions often originate from trusted administrative tools or scripts. Malicious activity may have unusual or unexpected parent processes.

  - **Examine command-line arguments:**
    Gather detailed command-line argument data from Event ID 4688. Look for unusual or obfuscated command parameters commonly used in attacks, like “-t” or custom scripts often indicating exploitation attempts.

  - **Check for unauthorized network connections:**
    Review network logs (e.g., Windows Firewall logs, or connection attempt records) that show outbound activity initiated by the PsExec process. Look for connections to known malicious IP addresses or unusual internal devices.

  - **Correlate with known post-exploitation tools:**
    Cross-reference log data with known tactics from adversary frameworks. If both PsExec and other post-exploitation tools (e.g., PowerShell scripts) appear in close succession, this could indicate a coordinated attack.

  - **Investigate high-confidence malicious indicators:**
    Look for repeated executions or executions at unusual times. Frequent calls to PsExec with suspicious arguments across multiple hosts may indicate a larger compromise.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for lateral movement through a network and the ease with which attackers can leverage PsExec for malicious activities. Its prevalence among adversaries in executing commands remotely signifies an opportunity for significant harm if left unchecked.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through legitimate administrative scripts that may also use PsExec, leading to false positives. Sufficient logging configuration is essential for effective detection, particularly ensuring that process creation logs are available and monitored. Legitimate activities, like IT administrative tasks using PsExec, can trigger this alert, which may complicate investigations. A related detection focused on PowerShell usage (T1059.001 - PowerShell) can strengthen overall coverage against lateral movement tactics.

