detection:
  selection:
  - Image|endswith:
    - '\livekd.exe'
    - '\livekd64.exe'
  - OriginalFileName: 'livekd.exe'
  condition: selection
falsepositives:
- Administration and debugging activity (must be investigated)
level: medium
note: |
  ### Technical Context

  This rule detects the execution of LiveKD, a tool used for capturing memory dumps of live operating system processes. The likely attacker objective is to extract sensitive information from a running system, which may include passwords, secrets, or other critical artifacts. This activity correlates with the MITRE ATT&CK technique "Process Injection" (T1055) and "Credential Dumping" (T1003). The primary telemetry source includes Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which track process execution details.

  If malicious, this behavior indicates an attempt to gather sensitive data, potentially aiding lateral movement or data exfiltration. It is crucial to note that while the detection captures the invocation of LiveKD, it does NOT confirm whether the action resulted in an actual memory dump or if the activity was part of legitimate administrative tasks.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 logs for entries with the image path containing `\livekd.exe` or `\livekd64.exe`. Pay attention to the parent process ID for abnormal relationships indicating potential misuse.

  - **Examine the OriginalFileName field:** In the same event logs, validate the OriginalFileName field for entries that exactly match `livekd.exe`. Legitimate usage often includes administrative or debugging tasks with appropriate context.

  - **Identify associated process activity:** Investigate any child processes spawned from LiveKD. Malicious operations may follow it, such as a file creation event or unusual network activity that could indicate data exfiltration.

  - **Cross-reference user account context:** Check the account executing LiveKD. Privileged accounts performing this action outside of standard maintenance windows or environments may indicate malicious behavior.

  - **Look for additional artifacts:** If LiveKD was executed, inspect for file creation or access modifications in directories typically containing sensitive information, such as `C:\Windows\Temp` or user profile directories.

  - **Check for recent credential access attempts:** Query the Security Event logs (Event ID 4624) for any failed or successful logons prior to the execution of LiveKD, which could suggest a preparatory step for extracting credentials.

  ### Prioritization

  This alert is medium severity due to the potential impact of uncovering credentials or sensitive data from a live system. The execution of tools like LiveKD in the wrong context often signifies an advanced adversary's operational stage. Given the increasing incidence of similar tools in breaches, the likelihood of malicious use is notable.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the executable or using modified versions of memory dump tools, which this detection may not identify. It is essential to have logging configurations activated for both process creation and Sysmon events to ensure effective detection. Legitimate administrative tasks may trigger this alert; thus, context is necessary for proper assessment. A companion detection rule for monitoring unusual credential access (e.g., Event ID 4625 for failed logon attempts) could enhance situational awareness regarding the context of LiveKD execution.

