- System configuration scripts during deployment
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying the enabling or disabling of Remote Desktop Protocol (RDP) through alternate methods, such as using Windows Management Instrumentation (WMI) or PowerShell. Attackers may utilize these methods to gain unauthorized remote access to target systems, potentially bypassing conventional monitoring if RDP permissions are altered without appropriate logging or alerting mechanisms.

  The primary objectives of an attacker utilizing this technique include establishing persistent remote access for lateral movement within the enterprise network and facilitating further exploitation. By enabling RDP, they can remotely control systems, escalate privileges, and potentially exfiltrate sensitive data if they gain the appropriate permissions on the compromised machine.

  This detection aligns with the MITRE ATT&CK framework, specifically under the tactics of **Lateral Movement** (ID: T1021) using techniques such as **RDP (T1021.001)** for remote access and **Command and Scripting Interpreter** for execution techniques (T1047). The best evidence for detecting such activities primarily comes from process creation logs, particularly for tools like WMIC and PowerShell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze logs from the process creation events to identify any instances of `wmic.exe`, `powershell.exe`, or `pwsh.exe` being executed, particularly with command lines containing `rdtoggle` or `Win32_TerminalServiceSetting`.

  - **Examine Command Line Arguments**: Focus specifically on the recorded command line arguments in the logs to ascertain whether `SetAllowTSConnections` has been invoked, indicating that RDP settings are being manipulated.

  - **Correlate with User Context**: Determine the context of the account performing these actions. Check for unusual user accounts or any non-administrative accounts executing RDP-related commands, which may indicate compromise or misconfiguration.

  - **Analyze Network Configurations**: Investigate any firewall logs or network configuration changes that correspond with the timing of the detected actions. Look for newly established RDP sessions and any unusual connection patterns that facilitate lateral movement.

  ### Prioritization
  This alert should be considered of medium severity due to the potential impact of unauthorized remote access being granted within an enterprise environment. The likelihood is elevated in the context of targeted attacks, where attackers may exploit administrative privileges to alter system configurations.

  ### Blind Spots and Assumptions
  One primary gap in detection coverage is the potential for legitimate administrative activities resulting in false positives, such as system administrators enabling RDP for remote support or during system configurations. The detection logic assumes that altered configurations are unauthorized, which may not capture cases where valid admin actions occur. Additionally, the alert relies on having robust process creation logging enabled and may not function accurately if certain logs are not retained or if logging is disabled altogether for performance reasons.

