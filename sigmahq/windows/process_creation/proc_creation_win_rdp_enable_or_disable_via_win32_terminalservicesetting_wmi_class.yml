note: |
  ### Technical Context

  This Sigma rule detects modifications of the Remote Desktop Protocol (RDP) settings using Windows Management Instrumentation (WMI) via PowerShell or WMIC. An attacker may enable RDP to facilitate remote access post-compromise, enabling lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Lateral Movement (T1021) and the technique of Remote Services: Remote Desktop Protocol (T1021.001). The primary telemetry sources include process creation logs (Event ID 4688) that capture command-line arguments, with critical log types being Security Event Logs and Sysmon logs.

  If this detection is confirmed as malicious, the security impact could be significant, including unauthorized access to sensitive systems and data. However, triggering this alert does NOT confirm malicious intent on its own, as legitimate administrative actions can also lead to these log entries.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 related to `wmic.exe` or `powershell.exe` executed by user accounts with administrative privileges. Pay attention to CommandLine fields for terms like `rdtoggle`, `SetAllowTSConnections`, or `Win32_TerminalServiceSetting`.

  - **Correlate timestamps:** Cross-reference the activity logs with other security events occurring at the same time to assess if there are indicators of suspicious behavior, such as unusual logins or access to critical systems around the time of the RDP setting modification.

  - **Examine user context:** Identify the user account that triggered the alert. If this account is not typically associated with RDP configuration in your organization, it may indicate potential misuse.

  - **Identify expected administrative behavior:** Document legitimate RDP enablement procedures for your environment. If an alert originated from standard maintenance scripts or known admin activities, it may be a false positive.

  - **Look for abnormal remote access patterns:** Use network logs to check for unusual RDP connection attempts from the configured host, which would suggest that the RDP setting changes are potentially malicious.

  - **Check for related detections:** Review logs for companion detections such as `Event ID 4624` (successful logon) from unusual geographic locations or `Event ID 4648` (login with explicit credentials) that could suggest privilege escalation activities following the RDP enablement.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity based on its potential for exploitation, particularly if it affects a critical server or an endpoint containing sensitive information. The likelihood of malicious abuse is moderate, considering RDP is often targeted in lateral movement scenarios by adversaries. While RDP modifications are relatively common in administrative tasks, they can also signal a rising risk for your organization.

  ---

  ### Blind Spots and Assumptions

  There are inherent limitations in detecting RDP enablement, as legitimate administrative actions can trigger this alert, leading to potential false positives. Additionally, reliable detection requires that all relevant Windows logs are properly configured and collected, particularly for process creation events. Legitimate activities that may trigger the alert include routine updates or maintenance performed by system administrators. A related detection to consider is monitoring failed login attempts (Event ID 4625) post-RDP enablement, which could indicate attempts to abuse the newly enabled access.

