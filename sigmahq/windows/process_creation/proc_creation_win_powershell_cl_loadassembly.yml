title: Assembly Loading Via CL_LoadAssembly.ps1
id: c57872c7-614f-4d7f-a40d-b78c8df2d30d
status: test
description: Detects calls to "LoadAssemblyFromPath" or "LoadAssemblyFromNS" 
  that are part of the "CL_LoadAssembly.ps1" script. This can be abused to load 
  different assemblies and bypass App locker controls.
references:
- https://bohops.com/2018/01/07/executing-commands-and-bypassing-applocker-with-powershell-diagnostic-scripts/
- https://lolbas-project.github.io/lolbas/Scripts/CL_LoadAssembly/
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-21
modified: 2023-08-17
tags:
- attack.stealth
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: As this function is usually called from within powershell, classical process creation even would not catch it. This will only catch inline calls via "-Command" or "-ScriptBlock" flags for example.
    CommandLine|contains:
    - 'LoadAssemblyFromPath '
    - 'LoadAssemblyFromNS '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that utilize the `LoadAssemblyFromPath` or `LoadAssemblyFromNS` functions, typically invoked within the context of a script like `CL_LoadAssembly.ps1`. The likely objective is to load arbitrary assemblies into a PowerShell session, potentially bypassing application control mechanisms like AppLocker. This activity is associated with the MITRE ATT&CK technique T1216 (Leveraging Application Layer Protocol).

  The primary telemetry sources include process creation logs with a focus on the CommandLine argument of PowerShell executions, indicating the usage of PowerShell commands and scripts. If malicious, the security impact is significant as it may allow an adversary to run unauthorized code. Notably, this detection does NOT confirm that the loaded assembly is malicious; further investigation is needed to validate the intent and content of the loaded assembly.

  ### Investigation Steps

  - **Review process creation logs:** Look for PowerShell commands in Event ID 4688 that contain `LoadAssemblyFromPath` or `LoadAssemblyFromNS`. Focus on the exact command line used, noting any suspicious parameters or inline scripts.

  - **Analyze execution context:** Check for legitimate usage patterns of the PowerShell script `CL_LoadAssembly.ps1` and review common organizational practices for assembly loading to determine if the command aligns with acceptable administrative activities.

  - **Identify high-confidence malicious indicators:** Verify if the command is initiated from an unusual context, such as a script located in a non-standard directory or an execution by a user with atypical access levels, like a standard user account executing administrative scripts.

  - **Inspect for assembly details:** If possible, analyze the loaded assembly's digital signature or hash to verify authenticity. Look for details in logs that may indicate assembly download or execution, such as file creation events (Sysmon Event ID 11) related to the time of the PowerShell execution.

  - **Cross-reference with known tools:** Research against the LOLBins (Living Off the Land Binaries and Scripts) project to identify if the usage of `CL_LoadAssembly.ps1` is associated with known malicious activities or adversary techniques in your environment.

  ### Prioritization

  This alert should be treated with medium severity. The impact potential hinges on the affected host's criticality; if it’s a server or domain controller, the risk escalates. The likelihood of malicious abuse is significant, given the common exploitation of assembly loading techniques in attacks, such as malware execution.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into all PowerShell-related events, requiring comprehensive logging configurations (e.g., Module Logging and Script Block Logging) to capture all relevant activities. Legitimate administrative activities, such as authorized troubleshooting, may also trigger this alert. A companion detection that enhances coverage could involve monitoring for PowerShell script execution logs, particularly focusing on `Invoke-Expression` or `Invoke-Command` actions.

