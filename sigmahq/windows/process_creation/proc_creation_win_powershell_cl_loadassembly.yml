title: Assembly Loading Via CL_LoadAssembly.ps1
id: c57872c7-614f-4d7f-a40d-b78c8df2d30d
status: test
description: Detects calls to "LoadAssemblyFromPath" or "LoadAssemblyFromNS" 
  that are part of the "CL_LoadAssembly.ps1" script. This can be abused to load 
  different assemblies and bypass App locker controls.
references:
- https://bohops.com/2018/01/07/executing-commands-and-bypassing-applocker-with-powershell-diagnostic-scripts/
- https://lolbas-project.github.io/lolbas/Scripts/CL_LoadAssembly/
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-21
modified: 2023-08-17
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: As this function is usually called from within powershell, classical process creation even would not catch it. This will only catch inline calls via "-Command" or "-ScriptBlock" flags for example.
    CommandLine|contains:
    - 'LoadAssemblyFromPath '
    - 'LoadAssemblyFromNS '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects PowerShell commands that invoke "LoadAssemblyFromPath" or "LoadAssemblyFromNS," indicating an attempt to load assemblies dynamically. The likely adversary objective is to execute malicious code that could bypass application whitelisting controls like AppLocker, enabling persistent malware execution or loading unauthorized modules. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1216).

  The primary telemetry source consists of process creation events from Windows, specifically focusing on command-line arguments that show these function calls. If malicious, this activity could lead to the execution of unauthorized code within the environment. Importantly, the detection of these commands alone does not confirm malicious intent, as legitimate scripts may also call these commands under certain contexts.

  ### Investigation Steps

  - **Review command-line arguments:** Check for Security Event ID 4688 logs. Look for command lines containing "LoadAssemblyFromPath" or "LoadAssemblyFromNS." Any occurrence outside of known legitimate automation or management scripts is suspicious.

  - **Identify related process execution:** Analyze Sysmon Event ID 1 for parent-child process relationships. A PowerShell process (e.g., Event ID 4104) spawning with these arguments should trigger deeper investigation into the parent process for contextual understanding.

  - **Assess script origin and signing:** Validate the script's source by checking if it was downloaded from a reputable source or if it has a valid digital signature. Legitimate scripts are often signed, whereas malicious scripts may be unsigned or originate from untrusted locations.

  - **Correlate with previous alerts:** Check for prior alerts involving abnormal PowerShell behavior. High confidence indicators include recurrent use of these specific functions alongside known malicious hash values for associated files.

  - **Investigate process and DLL activity:** For any identified malicious processes, use Sysmon Event ID 7 to review loaded DLLs. Look for unusual or unexpected assemblies that do not typically load on the affected system or do not match the installed software.

  ### Prioritization

  This alert should be treated with medium severity due to the potential of malicious use of PowerShell for code execution and the significant risk of bypassing security controls. While there are legitimate uses for these commands, the rarity of their occurrence combined with the context of their invocation can strongly indicate misuse.

  ### Blind Spots and Assumptions

  Detection may miss PowerShell executions that do not use the specified command-line arguments or that occur outside typical telemetry collection. Additionally, scripts from trusted sources might trigger the alert if they legitimately utilize these commands. Monitoring for companion detections, such as suspicious network traffic (via proxy logs) or unusual file writes (Process Monitor logs), can provide stronger validation of threats.

