title: Assembly Loading Via CL_LoadAssembly.ps1
id: c57872c7-614f-4d7f-a40d-b78c8df2d30d
status: test
description: Detects calls to "LoadAssemblyFromPath" or "LoadAssemblyFromNS" that
  are part of the "CL_LoadAssembly.ps1" script. This can be abused to load different
  assemblies and bypass App locker controls.
references:
- https://bohops.com/2018/01/07/executing-commands-and-bypassing-applocker-with-powershell-diagnostic-scripts/
- https://lolbas-project.github.io/lolbas/Scripts/CL_LoadAssembly/
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-21
modified: 2023-08-17
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: As this function is usually called from within powershell, classical process creation even would not catch it. This will only catch inline calls via "-Command" or "-ScriptBlock" flags for example.
    CommandLine|contains:
    - 'LoadAssemblyFromPath '
    - 'LoadAssemblyFromNS '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of specific PowerShell commands associated with the `CL_LoadAssembly.ps1` script, namely `LoadAssemblyFromPath` and `LoadAssemblyFromNS`. Such commands can be leveraged by attackers to load arbitrary assemblies in a manner that bypasses application whitelisting controls, such as AppLocker. The ability to circumvent standard security measures can enable various malicious actions, including executing payloads or establishing unauthorized persistence mechanisms.

  Attackers utilizing this technique are often motivated by the need to execute malicious code while evading detection mechanisms. Loading assemblies in a non-standard way can further their objectives of data exfiltration, lateral movement within a network, or gaining elevated privileges. This technique aligns with the MITRE ATT&CK framework under the tactics of Defense Evasion (TA0005) and the technique of "Execute Command" (T1216).

  The primary data sources for detecting this behavior include process creation logs that capture command-line arguments. This kind of telemetry is critical because traditional monitoring may not trigger alerts on PowerShell activities when scripts are executed inline or bypass standard logging methods.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for any instances of PowerShell commands that include `LoadAssemblyFromPath` or `LoadAssemblyFromNS`. Specifically, look at command-line arguments within process creation events.

  - **Analyze PowerShell Script Execution**: Check for instances where `CL_LoadAssembly.ps1` was executed. Look for abnormal or unauthorized script executions that deviate from established baselines.

  - **Correlate with AppLocker Logs**: Scrutinize AppLocker logs to confirm the context of the execution and see if any assembly loading was flagged or bypassed, indicating potential evasion attempts.

  - **Investigate Network Behavior**: Assess any network connections or behaviors that coincide with the execution of these commands. This includes examining outbound traffic patterns or other indicators of lateral movement or data exfiltration.

  ### Prioritization
  This alert is considered medium severity due to the potential for significant impact through bypassing security controls and executing malicious actions. The likelihood of such attacks is moderate, particularly in environments where attackers may leverage PowerShell for malicious purposes.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise from scenarios where the PowerShell commands are invoked from other processes or contexts which are not captured by standard process creation logs. The detection logic assumes that PowerShell is being utilized in an environment where command-line logging is enabled and adequately captures inline script executions. Additionally, a lack of comprehensive logging or misconfiguration of AppLocker can impede effective monitoring, resulting in potential false negatives.

