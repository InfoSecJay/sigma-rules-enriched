title: Execution of Powershell Script in Public Folder
id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
status: test
description: This rule detects execution of PowerShell scripts located in the "C:\Users\Public"
  folder
references:
- https://www.mandiant.com/resources/evolution-of-fin7
author: Max Altgelt (Nextron Systems)
date: 2022-04-06
modified: 2022-07-14
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - '-f C:\Users\Public'
    - '-f "C:\Users\Public'
    - '-f %Public%'
    - '-fi C:\Users\Public'
    - '-fi "C:\Users\Public'
    - '-fi %Public%'
    - '-fil C:\Users\Public'
    - '-fil "C:\Users\Public'
    - '-fil %Public%'
    - '-file C:\Users\Public'
    - '-file "C:\Users\Public'
    - '-file %Public%'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of PowerShell scripts specifically located in the "C:\Users\Public" folder on Windows systems. This type of detection is vital as attackers often utilize public folders to execute malignant scripts without raising suspicion. By utilizing public directories, an attacker can obscure their activity, making it seem legitimate while attempting to gain unauthorized access or propagate malware.

  The primary threat scenario involves adversaries leveraging PowerShell to execute scripts that can facilitate further compromises, such as downloading additional payloads, initiating lateral movement, or executing malicious commands on the victim machine. The usage of well-known scripts stored in public areas can very well indicate activity linked to threat actors, including groups like FIN7, who are known for such techniques.

  The relevant MITRE ATT&CK tactics include:
  - Execution (TA0002)
    - PowerShell (T1059.001)

  Primary data sources for this detection rule include:
  - Process creation logs, which capture the execution of applications such as PowerShell and provide information on command line parameters.

  ### Investigation Steps
  - **Review Process Creation Events**: Check recent process creation logs for instances of PowerShell (powershell.exe or pwsh.exe) executed with command line parameters targeting "C:\Users\Public". Look for unusual timestamps or patterns that may indicate scripted activity.

  - **Correlate with User Activity**: Investigate the user accounts executing the PowerShell scripts. Determine if these accounts typically engage with scripts in public folders or if their activity is out of the ordinary.

  - **Analyze PowerShell Command History**: Collect and analyze the history of executed PowerShell commands on the system to identify potential malicious activities or previously executed scripts that may have not been captured in real-time logs.

  - **Check for Unexpected Network Activity**: Look for any outbound connections initiated during the execution of the PowerShell scripts. Malicious scripts may contact external command and control (C2) servers, indicating potential exfiltration or further downloads.

  ### Prioritization
  This alert should be considered high severity due to the potential impact of unauthorized PowerShell script execution from a public folder, which may lead to severe breaches or malware deployment. The likelihood of legitimate PowerShell scripts being executed from this location is low, making any detection significant.

  ### Blind Spots and Assumptions
  One potential gap in this detection is the execution of scripts from other atypical locations that may also be used by attackers but are not captured by this rule. An assumption made by the detection logic is that malicious PowerShell executions will always be run from the specified public path, which may not always be true. Additionally, sufficient logging configurations must be enabled to capture detailed process creation events, which is critical for this alert to function effectively.

