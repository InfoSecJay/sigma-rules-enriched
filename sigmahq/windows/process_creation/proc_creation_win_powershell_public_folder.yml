title: Execution of Powershell Script in Public Folder
id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
status: test
description: This rule detects execution of PowerShell scripts located in the 
  "C:\Users\Public" folder
references:
- https://www.mandiant.com/resources/evolution-of-fin7
author: Max Altgelt (Nextron Systems)
date: 2022-04-06
modified: 2022-07-14
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - '-f C:\Users\Public'
    - '-f "C:\Users\Public'
    - '-f %Public%'
    - '-fi C:\Users\Public'
    - '-fi "C:\Users\Public'
    - '-fi %Public%'
    - '-fil C:\Users\Public'
    - '-fil "C:\Users\Public'
    - '-fil %Public%'
    - '-file C:\Users\Public'
    - '-file "C:\Users\Public'
    - '-file %Public%'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts located in the "C:\Users\Public" folder, which is often leveraged by adversaries to execute malicious payloads without raising red flags traditionally associated with user-specific directories. The primary objective of an attacker may be to run scripts that perform actions such as data exfiltration or lateral movement while using a shared location to avoid detection. This behavior aligns with the MITRE ATT&CK technique: Command and Scripting Interpreter: PowerShell (T1059.001).

  The primary telemetry sources for this rule include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, executing scripts from a commonly accessible folder can lead to data breaches or compromised systems. Notably, this detection does not confirm malicious intent by itself; it simply indicates that a PowerShell script execution occurred from a public location, which can also be legitimate in some contexts.

  ### Investigation Steps

  - **Verify process execution history:** Check Windows Security Event ID 4688 for the execution of PowerShell (powershell.exe or pwsh.exe). Investigate the CommandLine field for indicators that confirm the execution path includes "C:\Users\Public".

  - **Analyze CommandLine arguments:** Focus on extracting the exact arguments passed to the PowerShell script. If the CommandLine includes flags like `-f` or `-file` pointing to "C:\Users\Public", this strengthens the malicious indicator.

  - **Investigate user account activity:** Correlate the alert with the user account that executed the script. If it’s a service account or an account not typically used for script execution, this raises suspicion.

  - **Review execution context:** Determine if the execution occurs in a context where such script execution is abnormal (e.g., during odd hours). Expected behavior would include a user executing scripts from their own profiles, not from shared folders.

  - **Check for known malicious scripts:** Validate if the script being executed matches known malicious hashes or names previously flagged as threats using threat intelligence platforms or internal data.

  - **Validate environmental context:** Understand the asset's criticality within the network. Execution of PowerShell scripts on critical assets (like domain controllers) should be prioritized over non-critical asset executions.

  ### Prioritization

  The alert should be considered high severity due to the potential exploitation of shared resources, making it a prime target for adversaries seeking to blend in with normal operations. The use of public folders for script execution is often weaponized by malicious actors to increase their chances of success while evading detection.

  ### Blind Spots and Assumptions

  This detection may overlook legitimate administrative tasks or automated processes that utilize PowerShell for maintenance. Evasion techniques may include renaming PowerShell or using obfuscated script parameters. The detection also relies on comprehensive logging of process creation; if these logs are misconfigured or incomplete, key indicators may be missed. Related detections could include monitoring for unusual PowerShell commands within the command history that might indicate proactive engagement by an adversary.

