note: |
  ### Technical Context
  This detection rule identifies instances of Chromium-based browsers being launched with a specific command-line flag, `--load-extension=`, which indicates that a custom extension is being loaded. The use of such extensions can be indicative of a potential intrusion, as attackers may leverage malicious extensions to obtain sensitive information, manipulate browser behavior, or deliver additional payloads. For example, an attacker could use a custom extension to capture credentials or exfiltrate data from the browser session.

  The primary MITRE ATT&CK tactics associated with this detection are **Persistence** (TA0003) and the sub-technique **Browser Extensions** (T1176.001). The attacker’s objective in this scenario is typically to establish long-term access to a victim’s system, maintain control over the browser, and gather confidential information.

  Key telemetry for detecting this behavior would typically come from **process creation events**, which log details about executables running on the system. This includes command-line arguments, which can help analysts understand how a browser instance was initiated and whether it used any unusual parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for any Chromium-based browser instances where the `CommandLine` arguments contain the `--load-extension=` flag. Pay special attention to the context surrounding these instances to determine if they align with legitimate usage patterns.

  - **Correlate with User Activity**: Investigate the user account associated with the process execution. Look for unusual access patterns or any prior indicators of compromise that might suggest malicious intent.

  - **Analyze Loaded Extensions**: For any identified browser instances utilizing the `--load-extension=` flag, gather data on the specific extensions being loaded. Validate whether these extensions are known to be safe and review their permissions.

  - **Perform Network Traffic Analysis**: Monitor any outgoing network connections initiated by these browser processes, particularly focusing on unusual endpoints or excessive data transfers which may indicate exfiltration or command and control communications.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential risk it poses. While it may indicate benign use cases such as debugging or testing, the possibility of an attacker establishing persistence or gathering sensitive data justifies a closer investigation into such events.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage related to legitimate use cases where developers or testers might use custom extensions. The rule assumes that all instances of Chromium-based browsers with the `--load-extension=` flag are indicative of malicious behavior, which may not always be true. Additionally, this detection relies on comprehensive process creation logs being enabled and adequately configured; any gaps in logging could result in missed detections.

