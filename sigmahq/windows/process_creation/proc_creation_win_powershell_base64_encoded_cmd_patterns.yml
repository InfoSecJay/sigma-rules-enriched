title: Suspicious PowerShell Encoded Command Patterns
id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
status: test
description: Detects PowerShell command line patterns in combincation with 
  encoded commands that often appear in malware infection chains
references:
- https://app.any.run/tasks/b9040c63-c140-479b-ad59-f1bb56ce7a97/
author: Florian Roth (Nextron Systems)
date: 2022-05-24
modified: 2023-01-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.Exe'
    - 'pwsh.dll'
  selection_flags:
    CommandLine|contains:
    - ' -e '
    - ' -en '
    - ' -enc '
    - ' -enco'
  selection_encoded:
    CommandLine|contains:
    - ' JAB'
    - ' SUVYI'
    - ' SQBFAFgA'
    - ' aWV4I'
    - ' IAB'
    - ' PAA'
    - ' aQBlAHgA'
  filter_gcworker:
    ParentImage|contains:
    - 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
    - '\gc_worker.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Other tools that work with encoded scripts in the command line instead of 
  script files
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd_patterns/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands with patterns indicative of encoded commands, which are often utilized in malware infection chains to obfuscate malicious intent. Attackers typically aim to execute harmful payloads or scripts while evading detection, utilizing Base64-encoded strings to obscure command visibility and analysis. The relevant MITRE ATT&CK techniques include "Command and Scripting Interpreter: PowerShell" (T1059.001).

  Primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1 for detailed command line activity. If malicious, the presence of these encoded PowerShell commands can indicate an ongoing compromise or active attack. However, this detection does NOT confirm that the command executed is malicious on its own—it requires additional context to assess intent.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 focusing on CommandLine for any instances of PowerShell (`powershell.exe` or `pwsh.exe`) with flags like `-e`, `-en`, `-enc`, or `-enco`. Look for patterns indicative of obfuscation.

  - **Identify encoded command patterns:** Examine the CommandLine for substrings such as 'JAB', 'SUVYI', or 'SQBFAFgA'. Their presence is a high-confidence indicator of potential malicious activity that may require escalation.

  - **Correlate with parent processes:** Investigate the ParentImage field in the logs to confirm if the command was initiated by a legitimate process (e.g., Windows management tools) or by suspicious executables such as `gc_worker.exe`, which should not be invoking PowerShell in this manner.

  - **Assess for legitimate use cases:** Identify environments where encoded PowerShell commands might be part of legitimate activity (e.g., DevOps, automation scripts). Document normal usages or exclusions based on organizational context to differentiate between malicious and benign usage.

  - **Check for file creation or exfiltration:** Validate if the dynamic creation of script files or other artifacts occurs alongside the execution of these commands. Use monitoring tools to check for specific file systems or network activity related to the encoded commands.

  ### Prioritization

  Given the nature of PowerShell and its extensive use in enterprise environments, the high severity of this alert is justified by the potential impact of an infection (especially on critical systems) and the fact that encoded commands are commonly used in sophisticated attacks. This behavior is frequently weaponized, heightening the need for prompt investigation.

  ### Blind Spots and Assumptions

  Limitations include the possibility that legitimate tools may also use encoded commands, potentially leading to false positives. Reliability largely depends on the collection of Event IDs 4688 and 1, necessitating correct logging configurations. Additionally, benign administrative tasks or automated scripts may trigger this alert, making contextual understanding essential. Companion detections such as monitoring for unusual outbound network traffic following this alert can help confirm malicious activity.

