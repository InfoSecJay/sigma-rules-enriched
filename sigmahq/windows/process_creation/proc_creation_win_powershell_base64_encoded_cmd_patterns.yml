title: Suspicious PowerShell Encoded Command Patterns
id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
status: test
description: Detects PowerShell command line patterns in combincation with encoded
  commands that often appear in malware infection chains
references:
- https://app.any.run/tasks/b9040c63-c140-479b-ad59-f1bb56ce7a97/
author: Florian Roth (Nextron Systems)
date: 2022-05-24
modified: 2023-01-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.Exe'
    - 'pwsh.dll'
  selection_flags:
    CommandLine|contains:
    - ' -e '
    - ' -en '
    - ' -enc '
    - ' -enco'
  selection_encoded:
    CommandLine|contains:
    - ' JAB'
    - ' SUVYI'
    - ' SQBFAFgA'
    - ' aWV4I'
    - ' IAB'
    - ' PAA'
    - ' aQBlAHgA'
  filter_gcworker:
    ParentImage|contains:
    - 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
    - '\gc_worker.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Other tools that work with encoded scripts in the command line instead of script
  files
level: high
note: |
  ### Technical Context
  This rule is designed to detect the use of encoded PowerShell commands, which are commonly employed by attackers to obfuscate malicious activities such as command execution and for executing malware. Attackers may use these encoded commands to bypass security measures and execute hidden scripts on compromised systems. The attacker’s objective in utilizing this technique is often to maintain persistence, execute payloads, or perform various post-exploitation activities while evading detection.

  The rule aligns with the MITRE ATT&CK technique for PowerShell (T1059.001), which encompasses executing commands through PowerShell scripting, especially using encoded command patterns. This detection is particularly critical as the use of encoded PowerShell commands can signal initial compromise, lateral movement, or even privilege escalation attempts within a network.

  Key telemetry sources that should provide relevant insights include process creation logs that capture command line arguments, allowing for the identification of potentially malicious PowerShell executions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for process creation events involving `powershell.exe` or `pwsh.exe`. Pay special attention to the command line arguments for any encoded patterns or usage of the `-e`, `-en`, or `-enc` flags.

  - **Analyze Command Variants:** Investigate any instances where the command line contains suspicious encoded strings such as `JAB`, `SUVYI`, `SQBFAFgA`, or similar variants. Compare against known malicious payloads if possible.

  - **Check Parent Process Relationships:** Identify and analyze parent processes of any detected PowerShell executions, ensuring they are not spawned from legitimate processes like `gc_worker.exe`, which could indicate normal operation instead of malicious intent.

  - **Validate Against Threat Intelligence:** Cross-reference any detected patterns with threat intelligence repositories to confirm known malicious campaigns using encoded PowerShell commands, and assess the urgency of the response based on this intelligence.

  ### Prioritization
  The alert is classified as high severity due to the potential risks associated with detected encoded PowerShell commands, indicating an elevated likelihood of active exploitation or malware execution which could lead to significant data loss or system compromise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if encoded command patterns are configured in non-standard ways or if alternative scripting languages are used for similar attacks. The detection logic assumes that encoded commands will invoke PowerShell or its variants without being disguised or modified in unexpected ways. Additionally, the effectiveness of this alert is contingent upon comprehensive logging configurations for process creation events, ensuring that command line details are captured accurately.

