title: Suspicious PowerShell Encoded Command Patterns
id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
status: test
description: Detects PowerShell command line patterns in combincation with 
  encoded commands that often appear in malware infection chains
references:
- https://app.any.run/tasks/b9040c63-c140-479b-ad59-f1bb56ce7a97/
author: Florian Roth (Nextron Systems)
date: 2022-05-24
modified: 2023-01-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.Exe'
    - 'pwsh.dll'
  selection_flags:
    CommandLine|contains:
    - ' -e '
    - ' -en '
    - ' -enc '
    - ' -enco'
  selection_encoded:
    CommandLine|contains:
    - ' JAB'
    - ' SUVYI'
    - ' SQBFAFgA'
    - ' aWV4I'
    - ' IAB'
    - ' PAA'
    - ' aQBlAHgA'
  filter_gcworker:
    ParentImage|contains:
    - 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
    - '\gc_worker.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Other tools that work with encoded scripts in the command line instead of 
  script files
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that utilize encoded command patterns. Such behavior is often indicative of malware execution or automation by adversaries attempting to obfuscate their intentions during an attack. The likely attacker objective is to execute malicious commands without revealing their true purpose, which aligns with the MITRE ATT&CK framework under the tactic of Execution, specifically technique T1059.001 (PowerShell).

  The primary telemetry sources for this detection include Windows process creation logs, specifically tracking the execution of `powershell.exe` and `pwsh.exe`, while focusing on command line arguments that include encoded commands or specific patterns. If successful, this activity could lead to system compromise or data exfiltration. Importantly, this detection does NOT confirm that an attack has occurred on its own—it merely highlights potentially suspicious usage of PowerShell.

  ### Investigation Steps

  - **Check the Process Creation Log**: Query Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `powershell.exe` or `pwsh.exe`. Look for command lines containing flags with `-e`, `-en`, or `-enc`, indicative of encoding, to establish the execution context.

  - **Review Command Line Patterns**: Analyze the specific encoded commands in the command line input for known malicious patterns such as `JAB`, `SUVYI`, or `SQBFAFgA`. Any occurrence of these patterns alongside PowerShell invocations likely indicates malicious intent.

  - **Identify Legitimate Uses**: Validate if the executing user is associated with system or administrative tasks that typically require encoded command execution. For example, internal scripts or applications that use PowerShell for automation may generate similar command lines.

  - **Evaluate Parent Process Context**: Investigate if the PowerShell execution was initiated by a legitimate parent process using log sources for ParentImage fields. Presence of `gc_worker.exe` may imply a benign scenario, thus requiring closer examination to rule out false positives.

  - **Analyze for Malicious Indicators**: Look for high-confidence indicators such as the presence of unusual file paths or HTTP requests that correlate with the execution of the encoded commands. This could lead to uncovering subsequent malicious behavior, such as command and control activity.

  ### Prioritization

  This alert should be treated with high urgency due to the potential for significant impact on enterprise security. PowerShell is frequently weaponized by attackers to execute payloads and scripts, making this behavior a common precursor to deeper compromise. The likelihood of abuse is heightened by the situational use of encoded commands to bypass defenses.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate automation tools that also utilize encoded PowerShell commands, leading to potential false positives. Reliable detection requires full monitoring of Windows security logs and potentially Sysmon configuration for detailed process tracking. Additionally, the detection may flag benign encoded use cases, such as DevOps scripts, highlighting a need for contextual investigation. Companion detections, such as monitoring for unusual outbound network connections following this activity, can enhance visibility into potential compromise.

