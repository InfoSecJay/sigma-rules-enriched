  ---

  ### Technical Context

  This rule detects the execution of Crassus, a known Windows privilege escalation discovery tool, by identifying specific file metadata associated with it. The likely attacker objective is to gather information on system configurations, users, and permissions to facilitate privilege escalation activities. This detection aligns with the MITRE ATT&CK framework under the Discovery tactic (ID: T1087) and the sub-technique for system information discovery (ID: T1590.001). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this could lead to unauthorized access and elevated privileges on critical systems. Importantly, this detection does NOT confirm malicious intent as Crassus may also be used in a legitimate administrative context.

  ---

  ### Investigation Steps

  - **Review process creation logs for Crassus execution:** Check Security Event ID 4688 and Sysmon Event ID 1 for instances where the Image path ends with `\Crassus.exe` and `OriginalFileName` is `Crassus.exe.`
  - **Validate process origins:** Determine if the executable was run from a legitimate administrative context versus a suspicious directory. Legitimate administrative tools should typically be found in `C:\Windows\System32` or a controlled software deployment location.
  - **Correlate user activity:** Examine the user account that executed Crassus. Check for legitimate administrative roles in Active Directory or unusual login patterns, especially from non-administrator accounts (Event ID 4624 for logon attempts).
  - **Inspect command-line arguments:** If available, review the command-line details in Sysmon Event ID 1 to identify if any additional flags or parameters were used that indicate exploitation intentions, such as scanning high-privileged directories.
  - **Identify any follow-up actions:** Look for subsequent suspicious process executions or unusual authorization requests that may indicate continued exploration or exploitation following Crassus discovery (use Event ID 4688 for follow-up process checks).

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on system security, particularly if it is executed on critical assets by an unprivileged user. The likelihood of malicious abuse is moderate to high since tools like Crassus are commonly used in exploitation attempts during reconnaissance phases by attackers. Such activities are often prelude to privilege escalation or lateral movement.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging is improperly configured or if PowerShell is used as an alternative to execute Crassus without direct invocation. Continuous activity from legitimate administrative tools or scripts may trigger this alert, necessitating thorough context review. A companion detection for monitoring PowerShell execution (e.g., checking for suspicious commands relating to privilege escalation) would complement this alert and provide broader visibility into potential malicious activities.

