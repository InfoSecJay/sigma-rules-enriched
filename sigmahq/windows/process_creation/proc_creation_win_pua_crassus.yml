  ### Technical Context
  This detection rule identifies the execution of Crassus, a Windows-based privilege escalation discovery tool, by analyzing process creation events for specific file metadata characteristics. Crassus is often utilized by threat actors or malicious insiders to enumerate user privileges and identify potential escalation paths within a Windows environment. By detecting its execution, the rule assists in uncovering potential reconnaissance activities and privilege escalation attempts, either of which indicate a heightened risk to the enterprise's security posture.

  The relevant MITRE ATT&CK tactics associated with this rule include "Discovery" (TA0007) and "Reconnaissance" (TA0043), particularly focusing on techniques such as "Access Token Manipulation" (T1134) and "System Information Discovery" (T1082). Evaluation of these tactics reveals an attempt to probe for vulnerabilities and misconfigurations in an organization’s user and permission structure, which can lead to more sophisticated attacks if not mitigated promptly.

  The primary data sources for evidence include Windows process creation logs, which provide detailed information about the execution of applications, including Crassus. These logs contain crucial attributes such as the image name, file path, and metadata useful for identifying suspicious behavior.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine Windows process creation logs for instances of `Crassus.exe`, focusing on the launch context to determine if the execution was initiated by a legitimate user or an anomalous account.

  - **Analyze User Permissions:** Query Active Directory to investigate the privileges assigned to the executing user, looking for suspiciously high permissions that could indicate a compromised or malicious account.

  - **Investigate System Changes:** Check for other potentially malicious tools or scripts executed around the same time using the same user account, as attackers often use multiple methods to persist and escalate privileges.

  - **Correlate Network Traffic:** If possible, analyze network logs to identify any outbound communications initiated by the Crassus process to see if it attempted to exfiltrate data or communicate with known malicious IPs.

  ### Prioritization
  The alert is categorized as high severity due to the potential for Crassus to facilitate privilege escalation and reconnaissance activities within the environment. Such actions pose a significant risk to sensitive data and overall system integrity if left unchecked, particularly in enterprise environments with critical infrastructure.

  ### Blind Spots and Assumptions
  This detection rule relies on the availability of accurate and complete process creation logs on Windows systems; any gaps in logging or misconfigurations may result in undetected usage of Crassus. Additionally, the logic assumes that no legitimate use case exists for Crassus within the organization, which could lead to false positives in controlled environments where security tools are used for training. Adequate policies must be in place to ensure proper logging configurations and monitoring for all Windows machines to maximize detection efficacy.

