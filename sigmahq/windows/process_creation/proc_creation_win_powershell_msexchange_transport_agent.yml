note: |
  ### Technical Context

  This rule detects the installation of an Exchange Transport Agent via the command `Install-TransportAgent`. This behavior is commonly associated with adversaries attempting to establish persistence within an Exchange server environment. The likely attacker objective includes creating an unauthorized pathway for data exfiltration or command-and-control (C2) communication. This detection is aligned with the MITRE ATT&CK technique for persistence: "Install New Transport Agent" (T1505.002).

  The primary telemetry source is Windows process creation logs, specifically looking for event data related to this command execution. If malicious, the security impact could include the establishment of unauthorized persistent access to the Exchange environment. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger this alert.

  ### Investigation Steps

  - **Review command execution details**: Check for Event ID 4688 in Security logs for the creation of the `Install-TransportAgent` process. Inspect the `CommandLine` field to confirm context and parameters used during execution.

  - **Evaluate AssemblyPath**: Analyze additional logs or details from Event ID 4688 or Sysmon Event ID 1 to verify the `AssemblyPath` being used. Legitimate installations typically leverage system assembly paths, while suspicious installations may originate from non-standard locations.

  - **Correlate with user activity**: Investigate user account activity around the time of the alert. Look for any account anomalies or privileged actions (e.g., high-risk admin accounts performing the action) that may suggest malicious intent.

  - **Check for other related changes**: Look for related configuration changes in Exchange logs that correspond to Transport Agent installation. Confirm if any other Transport Agents have been installed prior or after this event, which might indicate a pattern of compromise.

  - **Cross-reference historical data**: Validate if this command has been executed previously in your environment without known legitimate use cases, which may indicate malicious persistence attempts.

  ### Prioritization

  The severity of this alert is medium due to the potential risk associated with the targeted system (Exchange server), which is critical for organizational communications. While this behavior can be utilized by attackers, it may also occur during legitimate administrative functions, thus requiring careful validation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate installation activities triggering the alert, leading to false positives. The reliance on Windows process creation logs can miss scenarios where an agent is installed through non-standard means. Legitimate scenarios that may set off this alert involve authorized Exchange administrators performing system updates or configurations. A related detection for improved monitoring could include tracking changes in Exchange configuration files, which may further inform the context of any startling Transport Agent installations.

