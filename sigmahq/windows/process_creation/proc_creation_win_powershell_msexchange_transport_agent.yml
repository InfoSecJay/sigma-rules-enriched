note: |
  ### Technical Context
  This detection rule identifies the installation of a Microsoft Exchange Transport Agent through the specific command used in the process creation context. Attackers may exploit or install unauthorized agents to manipulate email flow, potentially facilitating data exfiltration, phishing, or lateral movement within an organization's network. Given its nature, this activity often signifies persistence mechanisms that threat actors establish to maintain access to compromised systems.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and the technique **Install Root Certificate** (T1505.002). Attackers commonly target Exchange servers due to their critical role in email communications and overall enterprise messaging infrastructure. Whether for malicious purposes, surveillance, or email interception, the successful implementation of a Transport Agent can provide attackers with substantial control over an organization's communications.

  The primary data sources for effective detection include **process creation events** in Windows logs, where command-line arguments are captured. Monitoring for specific command keywords such as 'Install-TransportAgent' will yield strong indications of potential misuse.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of the command 'Install-TransportAgent' and correlate with user and system accounts executing these commands.
  - **Assess Assembly Paths:** Check the AssemblyPath and other metadata of the processes to identify whether the installation event pertains to legitimate activities or corresponds with known malicious entities.
  - **Investigate Related Network Activity:** Look for unusual network connections or email flows originating from the Exchange server that may indicate post-installation exploitation attempts or data exfiltration.
  - **Cross-Reference with Change Management Logs:** Ensure that the installation is documented within organizational change management systems to confirm legitimacy and intent, highlighting any deviations in the standard process.

  ### Prioritization
  This alert carries medium severity due to the critical nature of Microsoft Exchange within enterprise infrastructures. While legitimate installations do occur, the potential for abuse by threat actors makes detecting this activity essential for safeguarding against unauthorized access and persistent threats.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the potential for legitimate administrative activities, leading to false positives during real-time monitoring. This rule assumes that command execution is monitored sufficiently and that the command-line interface is enabled for logging. Without thorough logging configurations, such as ensuring that the 'Process Creation' events are collected and visible, there may be missed detection opportunities for unauthorized installations.

