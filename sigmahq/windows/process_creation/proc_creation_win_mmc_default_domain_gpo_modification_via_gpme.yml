logsource:
  product: windows
  category: process_creation
detection:
    # "C:\Windows\System32\gpme.msc" /s /gpobject:"LDAP://<REDACTED>/cn<REDACTED>,cnpolicies,cnsystem,DC<REDACTED>,DClocal"
  selection_mmc:
  - Image|endswith: '\mmc.exe'
  - OriginalFileName: 'MMC.exe'
  selection_gpme:
    CommandLine|contains|all:
    - 'gpme.msc'
    - 'gpobject:'
  selection_default_gpos:
    CommandLine|contains:
    - '31B2F340-016D-11D2-945F-00C04FB984F9'         # Default Domain Policy GUID
    - '6AC1786C-016F-11D2-945F-00C04FB984F9'         # Default Domain Controllers Policy GUID
  condition: all of selection_*
falsepositives:
- Legitimate use of GPME to modify GPOs
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the Group Policy Management Editor (GPME) to modify the Default Domain and Default Domain Controllers Group Policy Objects (GPOs) in a Windows environment. Adversaries may abuse GPME for stealthy modifications to these critical GPOs, potentially allowing them to deploy malicious configurations across the domain without triggering immediate alerts or suspicions. By altering these foundational security settings, attackers can facilitate later stages of their operations, such as maintaining persistence, executing remote commands, or pushing out malware.

  The relevant MITRE ATT&CK tactics for this rule include **Defense Evasion** (T1560), where attackers evade detection through modifications of security policies, and **Privilege Escalation** (T1484.001), where they gain higher access privileges by leveraging GPOs in a way that could manipulate system behavior. The primary data sources for this detection include process creation logs, which provide insights into command-line arguments for processes initiated within the Windows environment, particularly focusing on instances of `mmc.exe` launching with GPME-related commands.

  ### Investigation Steps
  - **Check Process Creation Logs:** Analyze recent process creation events to identify instances of `mmc.exe` being executed with GPME commands. Pay close attention to the command-line parameters to validate the context of usage.
  - **Review GPO Change History:** Investigate changes made to the Default Domain and Default Domain Controllers GPOs. This includes examining the timestamps and user accounts associated with any modifications, particularly if registered during odd hours or under unusual user circumstances.
  - **Correlate with User Activity:** Assess user account activity related to GPME usage. Look for any unfamiliar or elevated accounts that may have executed the GPME alongside possible indications of unauthorized access or account compromise.
  - **Identify Network Traffic Patterns:** Monitor network traffic for unusual patterns that could indicate misuse of policies altered via GPO, especially communications to endpoints or servers that seem out of context with normal operations.

  ### Prioritization
  The severity of this alert is considered **medium** due to the potential impact of unauthorized GPO modifications, which could lead to a widespread compromise of security configurations across an enterprise environment. The likelihood of exploitation is heightened by the fact that tools like GPME can be misused by insiders or compromised accounts.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if there are legitimate administrative operations that utilize GPME frequently, which could result in false positives. This rule assumes logging of command line arguments is enabled and that process creation events are adequately collected. Without proper logging configurations, including the depth of command-line monitoring, the detection will not function effectively, potentially allowing real threats to go unnoticed.

