note: |
  ### Technical Context

  This Sigma rule detects the modification of Default Domain and Default Domain Controllers Group Policy Objects (GPOs) using the Group Policy Management Editor (GPME). Attackers may alter these GPOs to implement unauthorized policies for malicious purposes, such as deploying backdoors or disabling security measures across the network, thereby gaining persistence. The detection aligns with the MITRE ATT&CK tactic "Privilege Escalation" (TA0004) and technique "Group Policy Modification" (T1484.001).

  The primary telemetry sources for this alert are Windows process creation logs, specifically focusing on `Event ID 4688` for newly created processes and `Sysmon Event ID 1`. The impact of malicious modifications to GPOs can be severe, leading to widespread compromise of network infrastructure. This detection does NOT confirm malicious intent by itself; legitimate administrator actions may also trigger the alert.

  ### Investigation Steps

  - **Identify process creation events**: Check for `Event ID 4688` and `Sysmon Event ID 1` for `mmc.exe` being executed. Look for command lines containing `gpme.msc` and connections to the GPO GUIDs linked to default policies.

  - **Verify command-line arguments**: Analyze the `CommandLine` field to confirm the presence of `gpobject:` along with the associated Default Domain Policy (GUID: `31B2F340-016D-11D2-945F-00C04FB984F9`) or Default Domain Controllers Policy (GUID: `6AC1786C-016F-11D2-945F-00C04FB984F9`). This can serve as a high-confidence indicator of potential malicious activity.

  - **Assess administrative usage**: Review logs to determine if the user account executing the GPME command aligns with typical administrative patterns in your environment. Legitimate usage may include regular domain administrative accounts performing scheduled GPO modifications during maintenance windows.

  - **Cross-reference recent changes**: Examine the Group Policy Operational logs (Event ID 5136) for any recorded modifications related to the Default Domain or Domain Controllers GPOs around the same time as the detected execution. This helps establish a timeline for potential unauthorized changes.

  - **Monitor for unrecognized users**: Look for any unfamiliar user accounts associated with the execution of the `mmc.exe` command linked to GPME. New or unusual accounts may indicate unauthorized access attempts.

  ### Prioritization

  The severity of this alert is considered medium due to the potential impact on critical domain configuration. Although attacks leveraging GPO modifications are less frequent, the implications can be severe if exploited. Therefore, this behavior warrants prompt attention, especially in environments with sensitive data and critical infrastructure.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions that also invoke GPME for valid purposes. Required log sources include both process creation logs and Group Policy Operational logs to ensure comprehensive coverage. Additionally, automated infrastructure provisioning scripts or legitimate administrative duties may occasionally trigger the alert, necessitating context-based investigation. A companion detection to consider is monitoring for unauthorized changes in Active Directory objects linked to GPOs, enhancing overall coverage against privilege escalation attempts.

