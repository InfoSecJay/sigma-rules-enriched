detection:
    # "C:\Windows\System32\gpme.msc" /s /gpobject:"LDAP://<REDACTED>/cn<REDACTED>,cnpolicies,cnsystem,DC<REDACTED>,DClocal"
  selection_mmc:
  - Image|endswith: '\mmc.exe'
  - OriginalFileName: 'MMC.exe'
  selection_gpme:
    CommandLine|contains|all:
    - 'gpme.msc'
    - 'gpobject:'
  selection_default_gpos:
    CommandLine|contains:
    - '31B2F340-016D-11D2-945F-00C04FB984F9'         # Default Domain Policy GUID
    - '6AC1786C-016F-11D2-945F-00C04FB984F9'         # Default Domain Controllers Policy GUID
  condition: all of selection_*
falsepositives:
- Legitimate use of GPME to modify GPOs
level: medium
note: |
  ### Technical Context

  This rule detects modifications made to Default Domain and Default Domain Controllers Group Policy Objects (GPOs) through the Group Policy Management Editor (GPME). Attackers may leverage such modifications to apply malicious GPO configurations covertly, enabling persistent access or network management changes favorable to their objectives. This behavior is primarily associated with the MITRE ATT&CK technique "Modify Existing Group Policy" (T1484.001).

  The primary telemetry sources for this detection are Windows process creation events, specifically those logged in the Security and Sysmon logs, indicating the execution of `mmc.exe` with GPME parameters. If malicious, such changes can lead to unauthorized user access or disruption of security policies. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative changes to GPOs could also trigger this alert.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances of `mmc.exe` being executed with arguments containing `gpme.msc`. Confirm the username and source IP to identify administrative versus anomalous access.

  - **Verify command line details:** Inspect the `CommandLine` field for events showing `gpme.msc` and GPO identifiers (GUIDs: 31B2F340-016D-11D2-945F-00C04FB984F9 or 6AC1786C-016F-11D2-945F-00C04FB984F9). Malicious usage will likely show up on uncommon user accounts or administrators outside their normal hours of operation.

  - **Check for unexpected GPO changes:** Query Active Directory or Group Policy logs to assess recent modifications made to the Default Domain and Default Domain Controllers GPOs. Look for unusual settings or configurations that are not typical for the organization’s established policies.

  - **Analyze user role and administrative behavior:** Determine if the account executing the GPME command has legitimate administrative privileges. Verify typical administrative access patterns to distinguish potential insider threat activity from benign administration.

  - **Look for related manipulation tactics:** Investigate unauthorized changes to other critical security settings alongside GPO modifications, such as local security policies or user rights assignment, using Event ID 4697 (Service installation) or 4902 (Modification of an audit policy).

  ### Prioritization

  This alert has a medium severity level due to the potential impact on the entire Active Directory environment if malicious changes are made to GPOs. Given the likelihood that GPO modifications can be abused for privilege escalation or lateral movement, quick action is warranted, especially since such techniques are commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  The detection may have limitations if GPO changes are made through other legitimate interfaces or PowerShell commands not captured here. Ensure the Group Policy logs are properly configured to maintain records of GPO edits. Legitimate changes by IT personnel can frequently trigger this rule, thus necessitating context around user roles. A companion detection to consider is the monitoring of user account creation or modification, which could pair with unauthorized GPO changes affecting user account behavior.

