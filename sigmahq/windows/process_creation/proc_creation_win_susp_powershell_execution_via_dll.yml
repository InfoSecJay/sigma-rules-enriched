title: Potential PowerShell Execution Via DLL
id: 6812a10b-60ea-420c-832f-dfcc33b646ba
status: test
description: |
  Detects potential PowerShell execution from a DLL instead of the usual PowerShell process as seen used in PowerShdll.
  This detection assumes that PowerShell commands are passed via the CommandLine.
references:
- https://github.com/p3nt4/PowerShdll/blob/62cfa172fb4e1f7f4ac00ca942685baeb88ff356/README.md
author: Markus Neis, Nasreddine Bencherchali (Nextron Systems)
date: 2018-08-25
modified: 2024-03-07
tags:
- attack.stealth
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\InstallUtil.exe'
    - '\RegAsm.exe'
    - '\RegSvcs.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
  - OriginalFileName:
    - 'InstallUtil.exe'
    - 'RegAsm.exe'
    - 'RegSvcs.exe'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains:
    - 'Default.GetString'
    - 'DownloadString'
    - 'FromBase64String'
    - 'ICM '
    - 'IEX '
    - 'Invoke-Command'
    - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects unauthorized execution of PowerShell commands that may be initiated from specific DLL host processes, such as `rundll32.exe`, `InstallUtil.exe`, `RegAsm.exe`, and others. The likely attacker objective is to leverage these processes to run PowerShell commands stealthily, a technique often used to evade detection while executing malicious payloads. This behavior aligns with the MITRE ATT&CK technique T1218.011 (PowerShell).

  The primary telemetry sources are Windows process creation events, particularly those capturing the Command Line parameters (Event ID 4688) and Sysmon Event ID 1. If this detection indicates malicious activity, it could potentially lead to remote code execution and further compromise of the affected system. Importantly, this detection does NOT confirm that a malicious action was successfully executed—it only highlights the use of PowerShell in an unusual context.

  ### Investigation Steps

  - **Review process creation logs**: Check for Event ID 4688 and Sysmon Event ID 1 around the time of the alert. Look for processes like `rundll32.exe`, `InstallUtil.exe`, or `RegSvcs.exe` with suspicious CommandLine arguments that include terms such as `Invoke-Expression` or `IEX`.

  - **Identify high-confidence malicious indicators**: If the log indicates a DLL-executing process with a CommandLine containing both a known PowerShell invocation and a suspicious URL (e.g., a direct download link), this should be flagged as a high-confidence indicator of compromise.

  - **Analyze legitimate usage**: Determine if there are legitimate business applications running these processes with valid parameters. Common benign processes may invoke `Invoke-Command` for internal scripting purposes without external URLs or suspicious content.

  - **Validate file creation or modification**: Check for any associated file creations or modifications within temporary directories (e.g., `C:\Users\<User>\AppData\Local\Temp`) that may indicate downloaded payloads. Verify creation timestamps and file names against known indicators of compromise.

  - **Cross-examine user behavior**: Review user activity and application usage logs for the account executing the process to assess if the activity aligns with normal operational behavior or if it deviates significantly.

  - **Check endpoint security logs**: Analyze any alerts or logs from endpoint protection products to verify if any associated detections have occurred, such as indications of suspicious downloads or unauthorized script executions.

  ### Prioritization

  This alert should be treated as high severity due to the significant security impact of potential PowerShell execution from DLLs, which is a common tactic among adversaries to execute payloads stealthily. The likelihood of malicious abuse is high since such techniques are frequently weaponized during attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative tools may also invoke PowerShell commands through DLLs without malicious intent. Proper logging, such as enabling Sysmon with defined configurations, is crucial for reliable detection. Additionally, sophisticated threats may employ polymorphism or other evasion tactics that modify the payload to circumvent detection. A companion detection rule targeting unusual network activity generated by the same processes can enhance coverage and confirm possible malicious intent.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
