title: Potential PowerShell Execution Via DLL
id: 6812a10b-60ea-420c-832f-dfcc33b646ba
status: test
description: |
  Detects potential PowerShell execution from a DLL instead of the usual PowerShell process as seen used in PowerShdll.
  This detection assumes that PowerShell commands are passed via the CommandLine.
references:
- https://github.com/p3nt4/PowerShdll/blob/62cfa172fb4e1f7f4ac00ca942685baeb88ff356/README.md
author: Markus Neis, Nasreddine Bencherchali (Nextron Systems)
date: 2018-08-25
modified: 2024-03-07
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\InstallUtil.exe'
    - '\RegAsm.exe'
    - '\RegSvcs.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
  - OriginalFileName:
    - 'InstallUtil.exe'
    - 'RegAsm.exe'
    - 'RegSvcs.exe'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains:
    - 'Default.GetString'
    - 'DownloadString'
    - 'FromBase64String'
    - 'ICM '
    - 'IEX '
    - 'Invoke-Command'
    - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential instances of PowerShell execution originating from DLLs instead of the standard PowerShell process. This behavior is characteristic of tools such as PowerShdll, which leverage legitimate Windows utilities to execute PowerShell commands covertly. The likely objective of an attacker employing this technique is to execute malicious PowerShell scripts while evading detection by utilizing trusted system processes and reducing their footprint.

  The relevant MITRE ATT&CK tactics and techniques involved here include "Defense Evasion" (T1089) and "Command and Control" through PowerShell (T1218.011). Attackers may seek to manipulate the PowerShell environment to execute commands that facilitate further exploitation, lateral movement, or data exfiltration while maintaining a low profile on the system.

  The primary data sources for this detection include process creation logs, which provide insight into command line executions, and the creation of potentially malicious processes that deviate from normal behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for any instances where processes such as `rundll32.exe`, `regsvr32.exe`, and others listed in the detection logic are invoked in conjunction with unusual command-line arguments indicative of PowerShell execution.

  - **Analyze Command-Line Arguments:** Focus on any command lines that contain keywords such as `Invoke-Expression`, `DownloadString`, or `IEX`, as the presence of these terms can signify nefarious attempts to execute scripts or commands remotely.

  - **Correlate with Security Alerts:** Check if the identified instances correlate with any existing security alerts or events across your security tools (such as EDR or SIEM) that indicate suspicious activity or prior alerts from known bad actors.

  - **Investigate Parent-Child Process Relationships:** Assess the execution flow to determine if there are any parent processes that are normally benign but could be misused to execute DLL-based PowerShell commands, noting any irregular parent-child process hierarchies.

  ### Prioritization
  This alert should be treated as high severity due to its potential impact; successful exploitation can lead to significant data compromise or disruption of services. Furthermore, the use of DLLs for PowerShell execution often indicates a sophisticated attacker leveraging evasion techniques, elevating the likelihood of successful malicious actions.

  ### Blind Spots and Assumptions
  Detection coverage could be limited based on configurations that do not log all necessary process creation events or obscured command lines. Additionally, there may be assumptions that legitimate usage of the specified processes does not coincide with anomalous command-line arguments, leading to false negatives. To effectively utilize this alert, proper logging configurations should be in place, ensuring all process creation activities are captured, particularly for command-line events associated with PowerShell execution.

