logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\InstallUtil.exe'
    - '\RegAsm.exe'
    - '\RegSvcs.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
  - OriginalFileName:
    - 'InstallUtil.exe'
    - 'RegAsm.exe'
    - 'RegSvcs.exe'
    - 'REGSVR32.EXE'
    - 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains:
    - 'Default.GetString'
    - 'DownloadString'
    - 'FromBase64String'
    - 'ICM '
    - 'IEX '
    - 'Invoke-Command'
    - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects abnormal PowerShell execution triggered via DLLs, specifically through processes like `rundll32.exe`, `InstallUtil.exe`, or `regsvr32.exe`. Attackers often employ this technique to obscure the execution of malicious PowerShell commands, primarily to execute scripts or commands without strictly invoking PowerShell itself. The goal is typically to gain unauthorized access, deploy malware, or execute payloads silently on the target system.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1070), with the technique **Malicious PowerShell Command Execution** (T1218.011). This detection leverages Windows process creation logs, particularly monitoring for specific executables and command-line arguments that suggest malicious PowerShell operations. If confirmed malicious, this indicates potential system compromise and an ongoing security incident. However, this detection does NOT confirm that the execution leads to successful exploitation or persistent access; further investigation is required.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs:** Check for **Process Creation** logs (Windows Event ID 4688) that indicate the execution of `rundll32.exe`, `InstallUtil.exe`, or similar. Specifically, look for entries with command lines containing strings such as 'IEX', 'Invoke-Expression', or 'DownloadString'.

  - **Validate Command-Line Arguments:** Examine the **CommandLine** field in the logs. Malicious indicators would involve PowerShell commands prefixed with `ICM`, `IEX`, or decoding commands using `.FromBase64String`. Compare these with known legitimate usage scenarios.

  - **Check for Unusual Parent Process:** Identify the parent process that initiated the suspicious DLL execution. A legitimate execution typically stems from programs like installers or system maintenance tools, while unexpected origins (e.g., unknown executables) could indicate malicious activity.

  - **Assess File Origin and Behavior:** Locate the original files associated with the suspicious execution (Image paths). Validate whether these files reside in trusted directories or were recently modified or created. Malicious alterations or unfamiliar sources can be significant indicators.

  - **Cross-Reference with Indicators of Compromise (IOCs):** Check if the activity coincides with any identified IOCs, like known bad hashes or behavioral patterns associated with recent threats, specifically around the techniques used for lateral movement or privilege escalation.

  - **Log Analysis for PowerShell Scripts:** Ensure monitoring of PowerShell logs (Event IDs 4103, 4104) to identify if any unusual scripts or command execution is being triggered post DLL execution, indicating potential payload delivery.

  ---

  ### Prioritization

  This alert should be considered high-severity due to the implications of malicious PowerShell execution via DLLs. Given the potential for system compromise and the frequent targeting by attackers using similar methodologies, prompt investigation is essential. This behavior is not commonly benign, making it a significant security concern.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may alter the command strings or use alternative scripting languages to avoid detection. The alert relies heavily on appropriate logging configurations; missing logs could lead to undetected malicious activity. Legitimate activities, such as application installations or updates using system utilities, may trigger similar alerts. A related detection to strengthen coverage would be monitoring for typical `PowerShell` process creation events alongside these suspicious DLL executions.

