logsource:
  category: process_creation
  product: windows
detection:
  selection_loader_img:
    Image|endswith: '\loader.exe'
    CommandLine|contains: '--pid:'
  selection_loader_imphash:
    Hashes|contains:
    - 'IMPHASH=38D9E015591BBFD4929E0D0F47FA0055'
    - 'IMPHASH=0E2216679CA6E1094D63322E3412D650'
  selection_flags:
    CommandLine|contains|all:
    - '--pid:'
    - '--outfile:'
    CommandLine|contains:
    - '.dmp'
    - 'lsass'
    - '.obf'
    - 'dump'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of HandleKatz, a tool used for dumping the Local Security Authority Subsystem Service (LSASS) memory in a way that obfuscates the data. The primary objective of an attacker using HandleKatz would be to extract sensitive credentials from LSASS, which might allow further access to network resources and sensitive data. This behavior aligns with the MITRE ATT&CK framework under the credential access tactic (TA0006) and specifically technique T1003.001: Credential Dumping: LSASS Memory.

  The primary telemetry source is process creation events from Windows systems, specifically via Security Event ID 4688 and Sysmon Event ID 1 logs, which must capture detailed command line arguments. Malicious execution of this technique can significantly impact the security posture of an organization by leaking sensitive credential data. It is essential to note that this detection does NOT confirm that credentials have been successfully dumped or used maliciously without further corroborating evidence.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 and Sysmon Event ID 1 for instances of `loader.exe` with an obfuscated command line containing `--pid:`. Valid entries should not show suspicious behavior or unusual timestamps.

  - **Analyze command line arguments:** Inspect command lines for occurrences of `--outfile:` with file extensions like `.dmp`, `.obf`, and keywords such as `lsass` or `dump`. Legitimate tools generally do not generate these outputs on systems unless configured for such testing.

  - **Correlate with known hashes:** Verify if the process creation logs show hashes matching HandleKatz’s known IMPHASH values (`38D9E015591BBFD4929E0D0F47FA0055` or `0E2216679CA6E1094D63322E3412D650`). Matches with these hashes strongly indicate the use of HandleKatz.

  - **Identify user and session context:** Determine the user context and associated session ID from the process logs. Look for unusual users executing the process or usage patterns atypical for the asset's role (e.g., non-admin accounts running LSASS dumps).

  - **Examine file output locations:** If a `.dmp` file is generated, check the system for file creation events (for example, using Sysmon Event ID 11) and verify the file’s location, size, and content integrity. An output in non-standard directories can be an indicator of malicious behavior.

  ### Prioritization

  The severity of this alert is high due to the potential impact of credential theft from sensitive systems, such as domain controllers. The likelihood of malicious abuse is significant as tools like HandleKatz are designed for exploitation, and such methods are often weaponized in real-world attacks. Continuous monitoring and elevated response are warranted.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as modifying command line arguments or running from a different process that may not capture this activity. Administrators must ensure proper logging configurations are enabled to capture the necessary process creation logs comprehensively. Legitimate administrative tasks or security testing may occasionally trigger similar alerts. It is advisable to implement complementary detections such as monitoring for unusual or unauthorized access to LSASS memory (e.g., abnormal access patterns or memory dumps) to strengthen overall detection capability.

