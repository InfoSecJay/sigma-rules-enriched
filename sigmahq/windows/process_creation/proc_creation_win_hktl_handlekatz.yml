note: |
  ### Technical Context
  This rule is designed to detect the execution of HandleKatz, a tool that exploits cloned handles to the Local Security Authority Subsystem Service (LSASS) process in order to create an obfuscated memory dump. Attackers typically employ such tools to extract sensitive credentials from the LSASS memory, facilitating unauthorized access to systems and potentially allowing lateral movement within an environment. This can compromise sensitive accounts, escalate privileges, and access resources typically secured against unauthorized individuals.

  The main objectives of using HandleKatz are credential extraction and maintaining stealth while dumping sensitive information. The relevant MITRE ATT&CK tactics associated with this behavior include **Credential Access** (TA0006) and the specific technique **Credential Dumping: LSASS Memory** (T1003.001). Organizations must be vigilant against such activities, as they represent a critical step in an attack chain often leading to broader systemic compromises.

  The primary data sources to monitor for potential HandleKatz activity include **process creation events**, which provide insight into suspicious command-line arguments and processes initiated in the environment. Other valuable data sources may include security logs that detail anomalies related to the LSASS process.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect recent process creation logs for instances where `loader.exe` has been executed with command-line arguments containing `--pid:`, which indicate a potential HandleKatz operation targeting LSASS.
  - **Analyze Command-Line Arguments**: Focus specifically on command lines that include `--outfile:`, `.dmp`, and variations with `lsass` or `.obf`, as these reflect the usage patterns of HandleKatz while dumping memory.
  - **Check for Suspicious Parent Processes**: Identify the parent processes of any instances of `loader.exe` to determine if they originated from known benign applications or if they exhibit unusual behavior indicative of an attack.
  - **Correlate with User Behavior**: Look for any anomalous user behavior or access patterns in conjunction with the detected process creation events, as this may provide context for the execution of HandleKatz and indicate a potential compromise.

  ### Prioritization
  The severity of this alert is high due to the critical nature of credentials stored in the LSASS process, as their exposure can lead to significant security breaches. Given the increasing frequency of credential dumping in targeted attacks, detection of HandleKatz activity requires prompt investigation and response.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where process creation logs are not adequately monitored or where elevated privileges may mask malicious activities. The detection logic assumes that the indicators of HandleKatz execution are consistent and that the relevant logs are properly configured to capture all instances of command execution. Without these logs, the detection may fail, underscoring the importance of maintaining comprehensive logging across all endpoint activities.

