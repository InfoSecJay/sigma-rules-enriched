title: HackTool - HandleKatz LSASS Dumper Execution
id: ca621ba5-54ab-4035-9942-d378e6fcde3c
status: test
description: Detects the use of HandleKatz, a tool that demonstrates the usage 
  of cloned handles to Lsass in order to create an obfuscated memory dump of the
  same
references:
- https://github.com/codewhitesec/HandleKatz
