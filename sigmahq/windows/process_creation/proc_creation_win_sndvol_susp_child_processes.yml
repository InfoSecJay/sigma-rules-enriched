title: Uncommon Child Processes Of SndVol.exe
id: ba42babc-0666-4393-a4f7-ceaf5a69191e
status: test
description: Detects potentially uncommon child processes of SndVol.exe (the Windows
  volume mixer)
references:
- https://twitter.com/Max_Mal_/status/1661322732456353792
author: X__Junior (Nextron Systems)
date: 2023-06-09
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\SndVol.exe'
  filter_main_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains: ' shell32.dll,Control_RunDLL '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the creation of uncommon child processes spawned by `SndVol.exe`, which is the Windows volume control application. While the legitimate usage of `SndVol.exe` is generally benign, an attacker might exploit processes related to legitimate system utilities to execute malicious code stealthily. By co-opting `SndVol.exe`, malicious actors could be aiming to use common system processes to evade detection, facilitate lateral movement, or execute unwanted activities while remaining under the radar of security monitoring tools.

  The relevant MITRE ATT&CK techniques include **Execution (T1203)**, specifically focusing on the execution of potentially malicious code via legitimate Windows processes. This behavior can be indicative of a broader exploitation campaign, such as using tools for payload delivery or command execution disguised as legitimate Windows activity.

  Primary data sources that will provide insight into this suspicious activity include Windows process creation logs, which capture detailed information about when processes were initiated, their parents, and command line arguments passed during execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs from the endpoint to identify instances of `SndVol.exe` spawning child processes, particularly those that are not normal for this executable.
  - **Analyze Command-line Arguments:** For any flagged instances, investigate the command-line arguments associated with the spawned processes to detect patterns indicative of malicious commands or payloads.
  - **Correlate with User Activity:** Look for user actions leading up to the process creation to determine whether there were legitimate reasons for these executions or if they seem anomalous.
  - **Investigate Parent-Child Relationships:** Utilize a process tree visualization tool to analyze the parent-child relationships of processes involving `SndVol.exe` to identify potential malicious intents.

  ### Prioritization
  The severity of this alert is considered medium due to the potential for exploitation of a legitimate process, reflecting a moderate threat level to system integrity and user data. While uncommon, the ability of a threat actor to execute malicious commands from a seemingly benign process raises concerns about possible system compromise.

  ### Blind Spots and Assumptions
  Detection coverage may be lacking for certain legitimate applications or updated versions of OS processes that could appear benign. The detection logic assumes that no benign applications concatentating with workspace or customizable settings have unusual command lines. It's also essential that appropriate logging and telemetry from process tracking mechanisms are enabled to ensure this alert functions reliably, particularly the generation of detailed process creation logs from all endpoints.

