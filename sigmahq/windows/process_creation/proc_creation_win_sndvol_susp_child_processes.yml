title: Uncommon Child Processes Of SndVol.exe
id: ba42babc-0666-4393-a4f7-ceaf5a69191e
status: test
description: Detects potentially uncommon child processes of SndVol.exe (the 
  Windows volume mixer)
references:
- https://twitter.com/Max_Mal_/status/1661322732456353792
author: X__Junior (Nextron Systems)
date: 2023-06-09
tags:
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\SndVol.exe'
  filter_main_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains: ' shell32.dll,Control_RunDLL '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of uncommon child processes spawned by SndVol.exe, specifically looking for instances where RUNDLL32.EXE is called with the shell32.dll library as an argument. Malicious attackers may leverage this technique to execute their payloads under the guise of legitimate system operations, obscuring their actions while manipulating system settings or delivering covert malware.

  This behavior maps to the MITRE ATT&CK technique T1203 (Exploitation for Client Execution), wherein attackers exploit user applications to run malicious code. The primary telemetry source is Windows process creation logs, such as Security Event ID 4688 or Sysmon Event ID 1, which should provide visibility into both the spawning of SndVol.exe and its child processes. If malicious, this technique could lead to further compromise of the affected system or lateral movement within the network. It is crucial to note that this detection alone does not confirm malicious activity; further investigation is needed to ascertain intent and context.

  ### Investigation Steps

  - **Check process creation logs**: Query Security Event ID 4688 or Sysmon Event ID 1 for instances where SndVol.exe is the parent process and identify the child process created. Focus on entries showing RUNDLL32.EXE with parameters indicating shell32.dll.

  - **Review command line arguments**: Validate the CommandLine field from logs to confirm unusual parameters. Look for indications of script execution or other uncommon commands following `Control_RunDLL`, as they may indicate malicious intent.

  - **Establish baseline behavior**: Determine normal usage patterns for SndVol.exe within the environment. For example, identifying that legitimate usage typically involves user interaction for sound settings adjustments, without additional RUNDLL32.EXE invocation.

  - **Identify processes spawned by RUNDLL32**: Search for any child processes spawned by RUNDLL32.EXE that can trace back to SndVol.exe. Common benign instances may involve legitimate system components like Control Panel applets, while unusual children may indicate exploitation.

  - **Correlate with user activity**: Cross-reference the observed events with user activity logs, including logons or application launches to identify any patterns inconsistent with simple volume control tasks.

  - **Examine host roles and criticality**: If the host is a critical server or endpoint, escalate the investigation due to the potential impact. Analyze for additional signs of compromise in adjacent systems.

  ### Prioritization

  Alerts generated by this detection rule should be considered medium severity. Since SndVol.exe is commonly used in everyday operations, while uncommon use of its child processes may indicate an elevated risk, the limited scope of this behavior suggests a moderate likelihood of being weaponized by threat actors.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of necessary process creation logs if the logging level is not configured properly. Legitimate software installations or updates could inadvertently trigger false positives. Additionally, adversaries could evade detection by altering their invocation patterns or employing direct kernel object manipulation. Companion detections, such as monitoring for unusual DLL loading or arbitrary process creation by RUNDLL32.EXE, can enhance coverage and provide further context.

