note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed "Msdt.exe" executable, which is commonly used by attackers to disguise malicious payloads, making it a stealthy tactic in their toolkit. The likely objective of an attacker invoking this binary is to exploit the Microsoft Support Diagnostic Tool to execute arbitrary code or conduct malicious activities while circumventing security measures. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion (TA0005)** and the technique **Masquerading (T1036.003)**.

  The primary telemetry sources include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it could facilitate unauthorized access or remote code execution. It is critical to note that this detection does NOT confirm malicious activity on its own; further analysis is required to establish intent and impact.

  ### Investigation Steps

  - **Check process creation details:** Review Security Event ID 4688 or Sysmon Event ID 1 for the `CommandLine` field of the detected process. Look for unusual parameters or arguments that deviate from the expected use of `msdt.exe`, such as suspicious paths or included executables.

  - **Validate source file path:** Investigate the `Image` field to confirm it is executing from a location outside of the native `C:\Windows\System32` directory. Legitimate instances of `msdt.exe` should originate from this path; sightings in user directories or unconventional locations warrant further scrutiny.

  - **Review parent process relationships:** Identify the parent process using the `ParentImage` field in Sysmon logs. Legitimate launches of `msdt.exe` often originate from Windows system components. Any suspicious parent processes, particularly those associated with known exploitation frameworks (like PowerShell or cmd.exe), increase the likelihood of malicious behavior.

  - **Assess system impact:** Determine the affected asset's criticality, especially if it hosts sensitive data or important applications. Correlate findings with asset management databases to prioritize the investigation and remediation efforts accordingly.

  - **Check for related auxiliary indicators:** Examine network logs for communications that may indicate exfiltration attempts or remote command and control activity following the execution of the renamed executable.

  ### Prioritization

  This alert should be classified as high severity due to the potential impact on sensitive systems and the likelihood of exploitation through evasion techniques. The use of renamed system binaries like Msdt.exe is a common tactic in attacks, indicating an increased level of concern.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who may rename files or use varied techniques to mimic benign processes. Accurate log source configurations for process creation are required to ensure reliable detection. Legitimate activities, such as support personnel running diagnostic tools, may trigger this alert. An effective companion detection would be monitoring for PowerShell execution logs that could indicate script-driven exploitation attempts.

