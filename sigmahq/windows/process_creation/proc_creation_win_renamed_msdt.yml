note: |
  ### Technical Context
  This rule detects the execution of a renamed `Msdt.exe` binary, which is often associated with malicious activities, such as leveraging legitimate system tools to avoid detection. Attackers may rename built-in executables like `Msdt.exe` (Microsoft Support Diagnostic Tool) to evade security measures and facilitate lateral movement or data exfiltration. The presence of this execution can indicate attempts to execute potentially harmful commands under the guise of legitimate software.

  The rule aligns with the MITRE ATT&CK framework, specifically focusing on **Tactics** and **Techniques** associated with Defense Evasion (TA0005) and specifically the technique of T1036.003: "Masquerading - Rename System Utilities". By renaming commonly used binaries, threat actors can often bypass security tools that look for known malicious files.

  The primary data sources for effective detection include **process creation events**, which provide detailed information about executed commands, process paths, and the parent-child relationship of processes. Monitoring these events enables security teams to identify unauthorized or suspicious executions of system binaries.

  ### Investigation Steps
  - **Review Process Creation Events**: Check for the execution of processes with the `OriginalFileName` of 'msdt.exe' and examine the file paths to confirm if the binary was renamed. Investigate the parent process to identify how this execution was initiated.

  - **Analyze Command-Line Arguments**: Collect command-line arguments associated with the renamed `Msdt.exe` process execution. Look for unusual or suspicious flags common in exploitation scenarios or unexpected interactions with the system.

  - **Correlate with Security Alerts**: Cross-reference the findings with other security alerts from EDR and SIEM systems to identify any related suspicious activities, such as unusual network communications or changes to system configurations.

  - **Monitor User Activity and Context**: Investigate the user account that executed the process; review their recent activities to determine if there is any context suggesting credential theft or unauthorized access.

  ### Prioritization
  Given the high severity level of this alert, it indicates a significant risk in the enterprise context. Detection of a renamed `Msdt.exe` suggests potential evasion tactics leveraged by an attacker, warranting immediate investigation due to implications of system compromise or unauthorized access.

  ### Blind Spots and Assumptions
  This detection rule relies on the assumption that all relevant process creation events are being accurately logged and that no extensive process obfuscation is happening prior to execution. Potential gaps may include environments where logging of process details is not fully enabled or where endpoint detection and response capabilities are limited. For the alert to function effectively, comprehensive logging from all endpoints and systems running Windows should be deployed, allowing for the continuous monitoring of process creation details.

