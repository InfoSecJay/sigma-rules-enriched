note: |
  ### Technical Context

  This detection identifies the execution of the Windows binary "msdt.exe" that has been renamed, which may indicate an attempt at evading detection mechanisms. Attackers may use renamed legitimate binaries like msdt.exe as part of their intrusion techniques to execute payloads or perform reconnaissance while avoiding detection. This behavior is aligned with the MITRE ATT&CK technique for Masquerading (T1036.003).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which record the launching of processes. If the behavior is malicious, it could compromise system integrity, allow unauthorized access, or facilitate further attacks. However, detection of a renamed msdt.exe does not alone confirm malicious intent, as it may also indicate legitimate activities under certain contexts.

  ### Investigation Steps

  - **Check process creation logs for execution details**: Examine Security Event ID 4688 and Sysmon Event ID 1 for the execution of a binary with the original filename "msdt.exe" but a different image name. Look for processes without a signed certificate which may indicate malicious tampering.

  - **Verify command line arguments**: Look at the command line parameters used during the execution (Event ID 4688, `Process.CommandLine` field) for any unusual or suspicious arguments that do not align with normal msdt.exe usage (e.g., typical invocation for troubleshooting).

  - **Identify related parent processes**: Analyze the `ParentImage` field in Security Event ID 4688 to determine the originating process. A legitimate parent process (e.g., `explorer.exe` or another trusted application) may indicate benign activity, while unusual parents (like scripts or other executables that are not commonly associated with msdt.exe) might warrant further investigation.

  - **Cross-reference system integrity**: Check for indications of system manipulation such as log integrity issues or report any discrepancies found with `Get-FileHash` or similar utilities against the original msdt.exe file. Legitimacy can be affirmed if the file matches the known hash of the original binary.

  - **Evaluate the systems affected**: Understand which systems executed the renamed msdt.exe. Determine the asset criticality (e.g., domain controllers vs. user workstations) as high-value targets will require a more stringent examination of context and potential impacts.

  ### Prioritization

  This alert is of high priority due to the nature of the affected system, as renamed system binaries are often indicative of a tactic used by attackers to bypass security controls. The likelihood of malicious abuse is significant, as this behavior is commonly exploited for executing payloads or performing system reconnaissance.

  ### Blind Spots and Assumptions

  Detection may be limited by suppression settings for known benign msdt.exe usage in legitimate contexts, allowing potential evasion by attackers. Reliable detection requires complete process creation logging capabilities, with Sysmon configured to capture all relevant events. Additionally, legitimate IT support operations may temporarily rename msdt.exe for troubleshooting, which could trigger false positives. Companion detections such as monitoring for known malicious command line patterns or unusual parent processes can enhance coverage against evasion tactics.

