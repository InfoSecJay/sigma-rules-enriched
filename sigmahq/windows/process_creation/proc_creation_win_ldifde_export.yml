note: |
  ### Technical Context

  This rule detects the execution of `ldifde.exe`, a tool commonly used to export Active Directory (AD) objects and structure. The typical attacker objective is to gather sensitive information from the directory, such as user accounts and their attributes, which can assist in further network breaches or lateral movements. Relevant MITRE ATT&CK tactics and techniques include *Credential Access* (TA0010) and *Exploitation of Remote Services* (T1210).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to the exposure of critical organizational data and facilitate unauthorized access. However, this detection alone does not confirm malicious intent or that the data was exfiltrated; legitimate administrative activities may also invoke this behavior.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1. Look for commands invoking `ldifde.exe`. Focus on the `CommandLine` field to assess context and any output file location.

  - **Analyze command-line arguments:** Identify the presence of the argument `-f` in the command line, which specifies an output file. Confirm if the output points to a remote or non-standard location, indicating potential exfiltration.

  - **Validate legitimate usage patterns:** Check if `ldifde.exe` execution matches scheduled administrative tasks typically performed by IT staff. Documenting normal usage helps to distinguish benign behavior from suspicious activity.

  - **Correlate user activity:** Examine the user context (e.g., account used) that executed `ldifde.exe`. If a non-privileged account is used or if it occurs outside regular business hours, it raises suspicion.

  - **Search for exported files:** Check file creation events on the system (e.g., Security Event ID 4663 or Sysmon Event ID 11) for the presence of the output file specified in the command. Investigate its contents for sensitive AD information.

  - **Assess system roles and criticality:** Consider if the host running `ldifde.exe` is a domain controller or another critical server, as the impact of information accessed or exfiltrated is higher from these assets.

  ### Prioritization

  This alert carries a medium severity due to the potential impact of exposing sensitive AD information and the high likelihood of malicious exploitation. The use of `ldifde.exe` is often weaponized in attacks focused on information gathering, making it essential to respond promptly to such alerts.

  ### Blind Spots and Assumptions

  Detection can be limited by the legitimate use of `ldifde.exe` for administrative purposes, which may result in false positives. Accurate logging of all PowerShell and command line operations is essential for reliable detection. Legitimate user behavior, such as regular AD audits, could also trigger this alert. Strengthening coverage could involve monitoring accounts with elevated privileges, especially if followed by lateral movement attempts or other suspicious behaviors.

