logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\GoldenDMSA.exe'
  selection_cli:
    CommandLine|contains:
    - 'wordlist'
    - 'bruteforce'
    CommandLine|contains|all:
    - ' -s '
    - 'S-1-5-21-'
    - ' -d '
    - ' -k '
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the GoldenDMSA hacktool, which is utilized for manipulations of Directory Service accounts, specifically targeting Group Managed Service Accounts (gMSAs). Adversaries employing this tool often aim to escalate privileges in Active Directory environments and exploit authentication mechanisms. Relevant MITRE ATT&CK techniques include "Account Manipulation" (T1098) and "Credential Dumping: Service Account Token" (T1110.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically evaluating process creation events indicating the execution of the GoldenDMSA.exe binary or associated command-line patterns. If this behavior is confirmed as malicious, it poses a significant threat to the security posture of an organization, potentially allowing an attacker to gain unauthorized access to critical resources. Importantly, this detection does not confirm whether the execution was indeed malicious, as it could be run for legitimate purposes.

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 to identify instances of `GoldenDMSA.exe` execution. Verify timestamps, user context, and parent process for anomaly detection.

  - **Analyze command-line arguments:** Filter logs for command-line parameter patterns containing 'wordlist', 'bruteforce', ' -s ', 'S-1-5-21-', ' -d ', ' -k '. Successful matches increase the likelihood of malicious intent.

  - **Evaluate user accounts involved:** Investigate the account running the process. Accounts with high privileges that initiated `GoldenDMSA.exe` should be flagged due to increased risk.

  - **Identify legitimate operational use cases:** Check for known maintenance or administration activities that could explain the legitimate use of GoldenDMSA, such as scheduled tasks or authorized personnel action.

  - **Look for lateral movement indicators:** Assess for signs of further exploitation or account enumeration occurring post-execution. Key artifacts include unusual authentication events or new service accounts created after the incident.

  ### Prioritization

  The alert is classified as high severity due to the critical impact on Active Directory environments. Execution of this tool typically indicates an elevated risk of successful privilege escalation, as attackers commonly weaponize such tactics to undermine security measures.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as renaming the executable or utilizing an alternate execution vector that does not generate traditional logs. Comprehensive logging must be ensured to capture process creation events accurately. Legitimate account maintenance activities, particularly by system administrators, may trigger similar alerts. Companion detections for "Scheduled Task Creation" or "Unauthorized Account Creation" will strengthen overall monitoring of potential compromise vectors.

