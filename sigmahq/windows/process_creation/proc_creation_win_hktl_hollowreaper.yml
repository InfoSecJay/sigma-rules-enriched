  ### Technical Context

  This rule detects the execution of HollowReaper, a tool used for process hollowing, allowing attackers to inject malicious code into the memory of a legitimate process. The likely attacker objective is to execute stealthy payloads while evading detection, leveraging trusted processes to carry out operations. This behavior fits within the MITRE ATT&CK framework under the tactic of **Privilege Escalation** (T1068) and **Defense Evasion** (T1055.012).

  The primary telemetry source for this detection is process creation logs from Windows operating systems, specifically monitoring for the execution of HollowReaper.exe. If malicious, the security impact includes unauthorized control over system processes and potentially a foothold within the compromised environment. This detection does NOT confirm that the activity is malicious by itself; it merely identifies the presence of HollowReaper, which can have legitimate uses.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Query for Process Creation events (Windows Security Event ID 4688) that show the execution of HollowReaper.exe. Look for the image path to identify where HollowReaper was executed from and the parent process involved.

  - **Examine parent process:** Identify the parent process that spawned HollowReaper.exe. Legitimate executions typically originate from known scripting engines or administrative tools; any unusual parent processes (e.g., unexpected PowerShell scripts) may indicate malicious activity.

  - **Check for concurrent suspicious behavior:** Investigate any simultaneous events that indicate exploitation, such as outbound network connections (Windows Security Event ID 5156) from the HollowReaper process to unknown external IPs or domains.

  - **Monitor memory alterations:** Use Sysmon (Event ID 10) to observe any abnormal memory modifications of legitimate processes associated with the execution of HollowReaper. Indicators of concern include unauthorized writes to areas of memory belonging to trusted processes.

  - **Assess command-line arguments:** Inspect command-line arguments of HollowReaper.exe in the process creation logs to identify any unusual flags or scripting commands that may indicate exploitation attempts.

  - **Identify connected infrastructure:** Analyze DNS and firewall logs for connections to known malicious IP addresses or domains related to HollowReaper usage, which may point to active command and control communication.

  ---

  ### Prioritization

  This alert is high priority due to the potential impact of malicious payload execution in trusted processes, which can compromise critical systems' integrity. The likelihood of abuse is significant, as process hollowing is a common evasion technique employed by threat actors to avoid detection.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via altered filenames or custom variants of HollowReaper. Required log sources include both process creation logs and Sysmon logs for comprehensive visibility. Legitimate activities such as authorized penetration testing may trigger this alert. A companion detection to strengthen coverage could be monitoring for unusual PowerShell activity (T1086) that might support process hollowing efforts.

