note: |
  ### Technical Context

  This rule detects the execution of HollowReaper, a tool used for process hollowing to stealthily execute malicious payloads within the memory space of trusted processes. The likely attacker objective is to evade detection and maintain persistence by leveraging legitimate system processes to run potentially harmful code. This behavior aligns with the MITRE ATT&CK technique for process injection, specifically T1055.012 (Process Hollowing).

  The primary telemetry source is Windows process creation logs, specifically focusing on the execution of `HollowReaper.exe`. If executed maliciously, this can lead to unauthorized actions or data exfiltration while disguising malicious activity under a trusted process's identity. It is important to note that while this detection indicates the presence of HollowReaper, it does NOT, on its own, confirm that a malicious payload has been successfully executed or that additional malicious activity is occurring.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 and/or Sysmon Event ID 1 for the creation of `HollowReaper.exe`. Evaluate the user context under which it was executed to confirm legitimacy.

  - **Inspect parent process relationships**: Use Sysmon Event ID 10 to identify the parent process of the `HollowReaper.exe` execution. A legitimate parent process (like `cmd.exe` or `powershell.exe`) may indicate benign usage, while unexpected or suspicious parent processes (e.g., `svchost.exe`) may suggest malicious activity.

  - **Verify process memory modifications**: Look for related events indicating changes in memory allocation or permissions for processes affected by `HollowReaper`, using Sysmon Event ID 5 to identify if memory has been manipulated.

  - **Monitor for outgoing network connections**: Investigate if `HollowReaper.exe` is attempting to establish any network connections using Windows Firewall logs or Sysmon Event ID 3 for outbound connections. This is a high-confidence indicator of potential exfiltration or further malicious intents.

  - **Identify previously known legitimate usage**: Confirm if `HollowReaper.exe` is a tool used during authorized penetration tests or red team exercises. Correlate the timing and context of its execution with known testing windows.

  - **Check antivirus and endpoint detection responses**: Validate whether any endpoint protection solutions flagged `HollowReaper.exe` or associated actions. Cross-reference with threat intelligence sources for known signatures relevant to this tool.

  ### Prioritization

  This alert is of high severity due to the potential impact on the integrity of affected systems. The likelihood of malicious abuse of process hollowing techniques is significant, as this behavior is commonly weaponized by threat actors to avoid detection while executing payloads under the guise of trusted processes.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logging or improper configuration of Sysmon on endpoints. Legitimate activities such as authorized red teaming or research may also trigger this alert. A companion detection to strengthen coverage would include monitoring for siblings of HollowReaper or related injection techniques such as Event ID 4688 for other suspicious executable files associated with process injection.

