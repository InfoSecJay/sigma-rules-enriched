note: |
  ### Technical Context
  This rule detects the execution of HollowReaper, a tool employed by attackers to execute shellcode stealthily via process hollowing. It works by replacing the memory space of a legitimate process with malicious payloads, enabling attackers to run their code under the guise of a trusted application. The use of such tactics may suggest attempts at evading detection by security products and maintaining persistence on compromised systems.

  The threat scenario typically involves an adversary aiming to execute malicious code undetected on a target machine, potentially compromising sensitive data or establishing footholds for further operations, such as lateral movement or data exfiltration. Given its capacity for stealthy payload execution, HollowReaper is often associated with advanced persistent threats (APTs) and sophisticated cybercriminal activity.

  Relevant MITRE ATT&CK tactics include:
  - **Execution** (T1203): The technique involves running malicious code.
  - **Defense Evasion** (T1055.012): Process hollowing allows attackers to evade defenses by using legitimate processes.
  - **Privilege Escalation** (T1068): Abusing process hollowing mechanisms can lead to running with elevated privileges if a high-privilege process is targeted.

  Primary data sources for investigation will include **process creation logs**, specifically those that capture details about executable file launch events.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for any instances where `HollowReaper.exe` has been executed, looking for anomalies in the originating user or the process tree.
  - **Check for Suspicious Process Activity**: Investigate related parent processes that may have spawned `HollowReaper.exe`, especially those not aligned with normal operational patterns.
  - **Analyze Memory Dumps**: If possible, obtain memory dumps around the time of detection to identify any injected shellcode or unexpected modifications in the memory space of legitimate processes.
  - **Correlate with Threat Intelligence**: Use threat intelligence feeds to compare the observed activity with known indicators of compromise associated with HollowReaper or similar tools, noting any IP addresses or hash values related to the payload.

  ### Prioritization
  The severity of this alert is high due to the significant risk posed by process hollowing techniques, which can facilitate undetected execution of malicious payloads, leading to potential data breaches or complete system compromise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of comprehensive process creation logging or potential bypass techniques utilized by advanced malware. It is assumed that detection relies on the security posture of the environment, including appropriately configured logging for process creation events. If process hollowing is executed with a whitelisted or trusted application, these activities might fly under the radar of conventional detection mechanisms, making additional layers of security and monitoring essential.

