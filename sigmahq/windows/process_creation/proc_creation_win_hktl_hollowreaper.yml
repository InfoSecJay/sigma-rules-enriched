note: |
  ### Technical Context

  This rule detects the execution of HollowReaper, a malicious tool used for process hollowing, which allows an attacker to execute shellcode within the memory space of a legitimate process. The likely attacker objective is stealthy execution of malicious payloads while avoiding detection by antivirus and other security mechanisms. Relevant MITRE ATT&CK tactics include “Privilege Escalation” (TA0004) and the technique “Process Injection” (T1055.012).

  The primary telemetry sources needed for this detection are Windows process creation logs (Security Event ID 4688) which can indicate the spawning of processes, specifically monitoring for instances of 'HollowReaper.exe'. If malicious, this behavior can lead to further unauthorized actions such as privilege escalation and data exfiltration. Importantly, this detection does NOT confirm that malicious activity is occurring solely based on the execution of HollowReaper, as benign instances may exist in some environments.

  ### Investigation Steps

  - **Verify process creation logs:** Check Security Event ID 4688 to confirm the execution of 'HollowReaper.exe'. Look for the process creation source, command line arguments, and parent process to establish context.

  - **Analyze command line arguments:** For instances where 'HollowReaper.exe' executed, verify the command line (Field: Process.CommandLine). Malicious use may include suspicious or obfuscated parameters that are not typical in regular operation.

  - **Identify parent process:** Determine the parent process of 'HollowReaper.exe' (Field: Process.ParentImage). Legitimate execution is typically spawned from trusted processes like 'powershell.exe' or 'cmd.exe'. High-confidence malicious indicators include lateral movement or uncommon parent processes.

  - **Review related process activity:** Assess subsequent process creation events around the timing of 'HollowReaper.exe' execution (Security Event ID 4688). Look for other processes that may have been created with suspicious behavior indicative of further exploitation attempts.

  - **Check for known file artifacts:** Validate if any suspicious files or executables were created in conjunction with 'HollowReaper.exe' (Field: FileName, ProcessID). Artifact creation, especially in sensitive directories, may signify malicious behavior.

  - **Monitor asset criticality:** Identify if the affected host is a high-value target or carries sensitive data. Higher risk necessitates immediate response and potentially forensic investigation.

  ### Prioritization

  The alert severity is high, as the execution of 'HollowReaper.exe' on critical systems could signify a serious compromise, enabling further privilege escalation or data exfiltration. This behavior is commonly weaponized in attacks targeting escalation and persistence.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as renaming the executable or using legitimate-looking processes to mask the execution. It is critical to ensure Logs are correctly configured to capture Security Event ID 4688 for effective detection. Legitimate activities that could trigger the alert may include internal software development or testing of debugging tools, particularly within development environments. A beneficial companion detection would include monitoring for process hollowing behaviors across different parent processes or examining suspicious DLL injections (T1055.001) as a related technique.

