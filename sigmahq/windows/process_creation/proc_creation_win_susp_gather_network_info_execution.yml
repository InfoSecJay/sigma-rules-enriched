note: |
  ### Technical Context
  This detection rule identifies the execution of the built-in Windows script `gatherNetworkInfo.vbs`, which is typically located at `C:\Windows\System32`. This script can be utilized by attackers to collect information about the target machine, such as networking configuration and user account details, facilitating further exploitation or lateral movement within a compromised environment. Attackers may leverage this script discreetly to perform reconnaissance, building a clearer picture of the target’s network topology and potential vulnerabilities.

  This behavior aligns with the MITRE ATT&CK tactics of **Discovery** (TA0007) and **Execution** (TA0002), specifically under the techniques **Gather Information from Local System (T1615)** and **Scripting (T1059.005)**. Detection of such scripts is critical, as they can often be employed in conjunction with other malicious activities to chain together successful breaches or escalate privileges.

  The primary data source for this detection is **process creation events** within Windows. Monitoring these events can provide the necessary context and detail around suspicious command-line activities, particularly those involving built-in scripts that could indicate reconnaissance or pre-exploitation behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `cscript.exe` or `wscript.exe` being invoked with the command line containing `gatherNetworkInfo.vbs`. Look for unusual execution times or context that deviates from normal user behavior.

  - **Correlate with Network Activity:** Investigate any subsequent network activity from the affected systems. Check for unauthorized connections or data exfiltration attempts that may follow the reconnaissance phase.

  - **Inspect User Context:** Determine the user context under which the script executed. Review the account's privilege levels and whether it aligns with typical user behavior or if it shows anomalies suggesting potential compromise.

  - **Check for Other Recon Tools:** Look for additional signs of reconnaissance activity, such as the presence of other known living-off-the-land binaries (LOLBins) or custom scripts that may have been executed on the same system, indicating a broader strategy for information gathering.

  ### Prioritization
  This alert is of **high severity** due to the potential implications of successful reconnaissance activities in an enterprise environment. It poses both a significant risk to the integrity of the network and the likelihood of future malicious actions by providing attackers with crucial information.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding variations of the `gatherNetworkInfo.vbs` script (such as modified copies or similar scripts) that could evade this detection rule. Additionally, the detection logic assumes that **process creation logs** are captured consistently across all endpoints, which may not be the case in environments with strict logging policies. For this alert to function effectively, ensure that logging for process creation events is enabled and correctly configured to capture the full command line for executed scripts.

