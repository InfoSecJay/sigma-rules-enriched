note: |
  ### Technical Context

  This Sigma rule detects the execution of the built-in script `gatherNetworkInfo.vbs`, commonly found at `C:\Windows\System32\gatherNetworkInfo.vbs`. The behavior associated with this rule indicates reconnaissance activity, potentially employed by attackers for information gathering on the target environment. The likely objective of the adversary is to collect details such as network configuration, user accounts, and connected devices to aid in further exploitation or lateral movement within the network.

  This activity is aligned with the MITRE ATT&CK tactics of Discovery (TA0007) and the techniques of System Information Discovery (T1615) and Scripting (T1059.005). The primary telemetry sources for this detection are Windows process creation logs, specifically Event ID 4688 or Sysmon Event ID 1, which capture process execution details. If malicious, this behavior can assist attackers in mapping out the network and identifying weaknesses for future attacks. However, this detection does NOT confirm that an attack has occurred; further investigation is needed to ascertain intent and context.

  ### Investigation Steps

  - **Verify command execution context:** Check for Event ID 4688 or Sysmon Event ID 1 to identify the exact time and user context in which `gatherNetworkInfo.vbs` was executed. Malicious indicators may include execution under high-privilege accounts (e.g., SYSTEM or Administrator) without legitimate business justification.

  - **Assess process parentage:** Correlate the process creation log with the parent process ID to determine the originating source of the execution (e.g., `cscript.exe` or `wscript.exe`). Legitimate usage may occur from known administrative tools or scripts, while suspicious parent processes (e.g., unusual executables) may indicate compromise.

  - **Review command line arguments:** Analyze the CommandLine field for `cscript.exe` or `wscript.exe` to evaluate how `gatherNetworkInfo.vbs` was invoked. Malicious activity may be indicated by unusual arguments or concatenation with other commands aimed at data exfiltration.

  - **Monitor network connections:** Investigate network activity using Windows Firewall logs (Event ID 5156) or network traffic capture if the script attempted to transmit gathered data. Look for connections to external IPs not previously associated with typical enterprise behavior.

  - **Evaluate recent logon activity:** Check for any unusual or suspicious logon events (Event ID 4624) before the execution time of the script, especially from accounts that typically do not perform administrative tasks. This step may reveal potential credential compromise.

  ### Prioritization

  This alert should be classified as high severity due to the potential discovery and enumeration phases of an attack lifecycle. The presence of reconnaissance activity on critical assets can indicate a preparatory stage prior to a more aggressive attack, necessitating prompt investigation. This technique is commonly weaponized by adversaries in initial access scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the execution of `gatherNetworkInfo.vbs` through non-standard methods or within obfuscated scripts. Additionally, if logging levels on target hosts are insufficient, Event ID 4688 may not capture relevant executions, leading to missed detections. Legitimate administrative tasks and network diagnostics might also trigger this alert, complicating triage efforts. A related detection for process creation with abnormal parent processes (e.g., Process Creation for LOLBIN techniques) may enhance overall coverage and context awareness.

