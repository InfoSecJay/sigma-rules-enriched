note: |
  ### Technical Context

  This rule detects attempts to create a process using `wmic.exe` with the `process call create` command, which is commonly used by adversaries to execute commands remotely or run malicious processes. The likely objective is to gain control over the affected host and facilitate further exploitation or lateral movement within the environment. This behavior maps to the MITRE ATT&CK technique T1047: Windows Management Instrumentation (WMI) Execution.

  The primary telemetry sources are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing details of process creation along with command-line arguments. If successful, this action can lead to significant security impacts, providing an adversary with a foothold on the system. However, this detection does NOT confirm whether the execution was a legitimate administrative task or a malicious action without additional context or corroborating evidence.

  ### Investigation Steps

  - **Review the process creation event:** Check Security Event ID 4688 or Sysmon Event ID 1 for `wmic.exe` execution details. Look for the command line containing `process call create` and evaluate the user context executing the command. Legitimate usage typically involves an authorized admin account, while unexpected usage by non-admin users or in unusual hours indicates potential malicious activity.

  - **Examine parent process relationships:** Investigate the parent process of `wmic.exe` in the process creation logs. Malicious behavior often initiates from suspicious or uncommon parent processes. A legitimate parent might be a known administrative tool, while a benign parent process might include `powershell.exe` or other management tools.

  - **Analyze command line arguments:** Extract and analyze the command line arguments used with `wmic.exe`. Look for unusual flags or known malicious payload patterns. For example, a command line indicating remote execution or invoking unwanted scripts would be a strong indicator of malicious intent.

  - **Correlate with other logs:** Cross-reference with other log sources such as Windows Event Logs and firewall logs to check for subsequent outbound connections, especially to unusual IP addresses or domains. Indicators include attempts to access command and control (C2) servers or suspicious file downloads immediately following the detected event.

  - **Validate host activity context:** Determine the criticality of the affected host. If it is a high-value asset (e.g., domain controller or critical server), escalate investigation efforts immediately. Review system integrity and configuration logs to assess whether unauthorized changes were made.

  ### Prioritization

  This alert is rated medium severity due to the potential impact on affected systems, especially if they are critical infrastructure components. The likelihood of malicious abuse is moderate, given that `wmic.exe` is frequently used for legitimate administrative tasks but also exploits by sophisticated attackers. This technique is known to be weaponized in various attacks, warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if `wmic.exe` logs are not adequately captured or if log retention policies are ineffective. Adversaries might evade detection by clearing command history or using legitimate administrative accounts for execution, making context essential. Legitimate activities such as system patching or administrative scripts might trigger this alert. Companion detections that enhance coverage include monitoring for unusual parent processes or correlating with remote access software usage that may indicate preparatory phases for lateral movement.

