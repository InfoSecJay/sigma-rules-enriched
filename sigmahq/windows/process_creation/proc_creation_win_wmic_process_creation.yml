note: |
  ### Technical Context
  This rule detects the creation of new processes via the Windows Management Instrumentation Command-line (WMIC) tool. The WMIC tool allows for the execution of various commands for management and querying of operating system settings, making it a powerful utility for system administrators. However, attackers can also leverage WMIC to execute malicious payloads remotely or locally as a part of their tactics, often aiming to obfuscate their true intentions and establish persistence on compromised systems.

  The threat scenario associated with this detection often involves adversaries utilizing WMIC to execute commands that may lead to code execution, lateral movement, or data exfiltration. An attacker may use WMIC to spawn processes that can download and execute further malicious tools or establish backdoor access, making this behavior critical for detection. Relevant MITRE ATT&CK tactics include **Execution** (Tactic: Execution) and specifically the **Windows Management Instrumentation (WMI)** technique (T1047).

  Primary data sources for this rule include Windows process creation logs that capture information about processes initiated on the system, specifically focusing on instances where WMIC is invoked to create new processes.

  ### Investigation Steps
  - **Review WMIC Command Invocation:** Check process creation logs for instances of `wmic.exe` being executed, particularly looking for command lines that include "process", "call", and "create".

  - **Analyze Process Relationships:** Utilize your EDR tool to investigate parent and child process relationships around the WMIC execution to determine if it spawned other suspicious processes.

  - **Correlate with Other Logs:** Verify logs from endpoint detection systems for any other related activities occurring around the same time as the WMIC event, including network connections or file system changes tied to subsequent process executions.

  - **Evaluate User Context:** Assess the user context under which WMIC was executed, looking for unusual accounts or times that could indicate a malicious actor performing actions that deviate from typical operational behavior.

  ### Prioritization
  Given the potential for WMIC to be exploited for malicious purposes, the alert is considered medium severity in an enterprise environment. Successful abuse of this command can allow attackers to execute arbitrary code and pivot within a network, thereby increasing the potential impact on sensitive systems and data.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the logging configuration of endpoint systems; if process creation logging is not fully enabled or detailed enough, critical information could be lost. This detection rule assumes that WMIC is not being used legitimately at the time of this alert. Additionally, the absence of certain logs, such as those from endpoints where process creation has been disabled or due to misconfigured logging settings, may hinder the detection effectiveness. Ensuring comprehensive logging of process creation events is essential for the alert to function optimally.

