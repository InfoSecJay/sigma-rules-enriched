note: |
  ### Technical Context

  This rule detects the creation of a new process via the Windows Management Instrumentation Command-line (WMIC), specifically looking for the "process call create" command. This behavior is typically associated with attackers aiming to execute arbitrary commands or scripts on a compromised system, facilitating lateral movement or persistence within the environment. The relevant MITRE ATT&CK technique is **T1047: Windows Management Instrumentation**.

  Primary telemetry comes from process creation logs, notably **Windows Security Event ID 4688** and **Sysmon Event ID 1**, which provide details about new process generation. If this action is malicious, it can lead to unauthorized access and control of the target system. It’s important to note that this detection alone does not confirm malicious activity; WMIC can also be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Check process creation logs: ** Review **Security Event ID 4688** and **Sysmon Event ID 1** for WMIC process creation. Look for command lines containing `"process call create"` to confirm the suspicious activity.

  - **Analyze command context:** Investigate the full command line of the WMIC process creation. Validate if it is associated with expected administrative tasks or scripts by checking against known good processes in the environment.

  - **Review parent process relationships:** Identify the parent process of the WMIC invocation. Investigate its legitimacy by cross-referencing with historical data. Legitimate administrative activity might originate from known remote management tools or admin accounts.

  - **Correlate with user and system behavior:** Check the user account that executed the WMIC command. Look for deviations from normal behavior patterns, such as using administrative tools outside of standard operating hours or from non-admin user sessions.

  - **Assess asset criticality:** Determine the role and criticality of the affected host. If it is a server hosting sensitive applications or data, prioritize investigation and response actions.

  - **Identify high-confidence malicious indicators:** Cross-reference the detected WMIC activity against threat intelligence sources. If the command line contains additional flags indicative of known malicious activity or tools, raise alert priority.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on system integrity and the likelihood of abuse by attackers leveraging WMIC for remote code execution. While not all instances indicate malicious intent, the technique is commonly weaponized in advanced attacks, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded by cyber actors using non-WMIC methods for process creation or exploiting scripting languages capable of similar outcomes. Reliable detection requires Sysmon and Windows logging configured correctly to capture process creation events. Legitimate IT management practices could trigger this alert, such as system administrators executing server maintenance or software deployment tasks. A companion detection, such as monitoring PowerShell activity for unwanted script execution (related to T1059.001), could enhance coverage and threat visibility.

