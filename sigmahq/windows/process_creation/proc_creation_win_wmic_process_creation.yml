note: |
  ### Technical Context

  This Sigma rule detects attempts to create a new process using `wmic.exe` with the "process call create" command, typically used by attackers to run malicious executables on compromised hosts. The primary objective of the attacker may involve executing payloads that facilitate further exploitation, lateral movement, or data exfiltration. This behavior aligns with the MITRE ATT&CK technique **T1047 - Windows Management Instrumentation (WMI)**.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID **4688** and Sysmon Event ID **1**, which capture process creation events and command line arguments. If this behavior is malicious, it can lead to unauthorized access, system compromise, or data breaches. Importantly, this detection alone does not confirm that the activity was malicious, as legitimate administrative tasks may also use `wmic.exe`.

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID **4688** and Sysmon Event ID **1** to see if `wmic.exe` was used. Note the **CommandLine** field for any unusual arguments or paths in conjunction with `process call create`.

  - **Analyze command line arguments:** Specifically look for the presence of `process`, `call`, and `create` in the **CommandLine** field. Legitimate uses may include administrative and automation tasks and might not exhibit suspicious behavior.

  - **Check parent processes:** Investigate the **ParentProcessId** of the detected `wmic.exe` instance. A benign instance often has a parent process like **powershell.exe** or **cmd.exe** initiated by an administrative user, while unexpected parents (e.g., **explorer.exe**) may indicate malicious intent.

  - **Identify network activity:** Correlate with network logs to identify if any outbound connections were established just after the process was created, which could indicate malicious behavior. Refer to Windows Firewall logs or other network traffic analysis tools.

  - **Assess user context:** Determine which user account initiated the `wmic.exe` command. Alert on any anomalous account behavior, such as processes initiated by low-privilege users or system accounts outside expected patterns.

  - **Search for known bad indicators:** Compare the created processes and their command lines to threat intelligence feeds for known malicious binaries or hashes that may have been executed via `wmic.exe`.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact on affected systems. The likelihood of abuse is credible, as `wmic.exe` is frequently leveraged by adversaries for execution tasks during post-exploitation phases. While not all `wmic` executions are malicious, the specific parameters used in this context warrant careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques or adversaries using alternate methods (e.g., PowerShell) for process creation, bypassing `wmic`. Reliable detection requires ensuring that logging is enabled for all relevant events (including Sysmon and 4688). Legitimate administrative scripts or remote management activities by IT personnel may also trigger this alert. Companion detection such as **T1059 - Command-Line Interface (CLI)** based execution can enhance overall visibility and context in investigations.

