title: Reg Add Suspicious Paths
id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
status: test
description: Detects when an adversary uses the reg.exe utility to add or modify
  new keys or subkeys
references:
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1112/T1112.md
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1562.001/T1562.001.md
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2022-10-10
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_path:
    CommandLine|contains:
            # Add more suspicious registry locations below
    - '\AppDataLow\Software\Microsoft\'
    - '\Policies\Microsoft\Windows\OOBE'
    - '\Policies\Microsoft\Windows NT\CurrentVersion\Winlogon'
    - '\SOFTWARE\Microsoft\Windows NT\Currentversion\Winlogon'
    - '\CurrentControlSet\Control\SecurityProviders\WDigest'
    - '\Microsoft\Windows Defender\'
  condition: all of selection_*
falsepositives:
- Rare legitimate add to registry via cli (to these locations)
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_reg_susp_paths/info.yml
note: |
  ### Technical Context

  This rule detects the use of the `reg.exe` utility to create or modify registry keys in suspicious locations that are often targeted by attackers for persistence or privilege escalation. The likely objective of an attacker is to manipulate system configurations or introduce malicious behavior without detection. This behavior is associated with the MITRE ATT&CK tactics of Persistence (T1547), particularly technique T1112 (Modifying Registry). Primary telemetry sources include Windows Process Creation logs (Event ID 4688) and Sysmon logs (Event ID 1), specifically looking for command line entries that include `reg.exe` with specific paths indicating potential misuse. If malicious, this activity could compromise system integrity and facilitate further exploitation. Importantly, this detection does NOT confirm whether the changes were effective or harmful on its own; further investigation is required to understand the context and impact.

  ### Investigation Steps

  - **Identify the process and command line arguments**: Review Windows Security Event ID 4688 logs, focusing on entries where the `Image` is `reg.exe`. Pay close attention to the `CommandLine` field for any occurrences of suspicious paths (e.g., `\Policies\Microsoft\Windows NT\CurrentVersion\Winlogon`).

  - **Verify registry modifications**: Conduct a review of the registry using tools like `regedit` or `PowerShell`. Look for newly added or modified keys in the suspicious paths. For example, check if keys exist under `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon` and assess their values for legitimacy.

  - **Assess legitimate user behavior**: Determine if there is a known legitimate use case for the registry addition by reviewing recent change requests or system admin activities. Logged actions should correlate with appropriate business functions.

  - **Correlate with user behavior**: Look into the `Security` logs (Event ID 4624) for user logins around the same time as the registry change, especially if the logged-on user is not known to perform system configuration tasks.

  - **Establish the asset role and incident impact**: Analyze the affected system's role in the network (e.g., domain controller vs. user workstation). Higher criticality systems can present greater risk if compromised.

  - **Check for high-confidence malicious indicators**: Look for known signatures or behavior patterns consistent with malware installation, focusing on recent suspicious entries in the `Application Event Log` for errors that could indicate failed registry edits or attempts to load malicious code.

  ### Prioritization

  Alert severity is high due to the potential impact of modifications in critical registry paths, which are often exploited for establishing persistence. The likelihood of malicious abuse is elevated, given that these actions align with common adversary tactics for evasion and control. Since such behavior is often weaponized, immediate triage and response are essential.

  ### Blind Spots and Assumptions

  Detection may be limited due to the use of legitimate administrative tools that could invoke similar registry changes. Lack of adequate logging configurations might also hinder visibility into certain registry activity. Additionally, tool configurations like Group Policy updates can lead to unexpected triggers of the alert. Complementary detections include monitoring for administrative privileges changes (Event ID 4672) to enhance overall detection coverage against misuse of credentials.

