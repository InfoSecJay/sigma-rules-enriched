title: Reg Add Suspicious Paths
id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
status: test
description: Detects when an adversary uses the reg.exe utility to add or modify
  new keys or subkeys
references:
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1112/T1112.md
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1562.001/T1562.001.md
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2022-10-10
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_path:
    CommandLine|contains:
            # Add more suspicious registry locations below
    - '\AppDataLow\Software\Microsoft\'
    - '\Policies\Microsoft\Windows\OOBE'
    - '\Policies\Microsoft\Windows NT\CurrentVersion\Winlogon'
    - '\SOFTWARE\Microsoft\Windows NT\Currentversion\Winlogon'
    - '\CurrentControlSet\Control\SecurityProviders\WDigest'
    - '\Microsoft\Windows Defender\'
  condition: all of selection_*
falsepositives:
- Rare legitimate add to registry via cli (to these locations)
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `reg.exe` utility used to add or modify registry keys in suspicious locations, which could be indicative of an attacker attempting persistence or stealthy control over the system. The likely objective of the attacker includes maintaining access through registry modifications that alter system behavior or evade security measures. This relates to the MITRE ATT&CK tactics of Persistence (T1547.001) and Defense Evasion (T1562.001).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688, which captures process creation events. If this behavior is malicious, it could allow an attacker to establish persistence or evade security mechanisms effectively. However, it's essential to note that this detection does NOT confirm malicious activity on its own; legitimate administrative tasks may trigger similar modifications.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 for instances where `reg.exe` is executed. Focus on unusual parent processes that may indicate abuse, such as Command Prompt or PowerShell.

  - **Analyze command line arguments**: Inspect the command line parameters of detected `reg.exe` executions for modifications targeting known suspicious paths, such as `\Policies\Microsoft\Windows NT\CurrentVersion\Winlogon`, which may suggest illicit activity.

  - **Validate the integrity of suspicious registry keys**: Navigate to the identified registry paths using the Registry Editor (`regedit`), checking for newly added or recently modified keys that deviate from the organization's standard configuration.

  - **Assess legitimate usage**: Legitimate administrative actions may involve registry modifications, so compare entries against a known baseline of acceptable registry configurations for authorized software installations or updates.

  - **Identify high-confidence indicators**: Look for patterns of modification in critical security paths such as `\Microsoft\Windows NT\CurrentVersion\Winlogon`, especially if they include setting `AutoAdminLogon` or other automatic login configurations, which are red flags.

  - **Correlate with other telemetry**: Check for any related alerts in security logs or SIEM platforms that may indicate broader potential compromise activities, such as unusual network connections linked to the asset.

  ### Prioritization

  The severity of this alert is high in an enterprise context due to the potential impact on critical assets and infrastructure. The likelihood of malicious abuse is significant, as registry modifications are a common tactic used by threat actors for persistence. The specified paths are relatively uncommon for legitimate software activities, making their manipulation particularly concerning.

  ### Blind Spots and Assumptions

  This detection may miss certain evasion techniques, such as the use of alternative registry manipulation tools or those that obscure actions from standard logging. Reliable detection requires the proper configuration of process creation logging and may be diminished in environments where system integrity assurances are absent. Legitimate activities such as administrative scripting or application updates may generate similar alerts. Related detections, such as monitoring for unauthorized access to system configurations or suspicious PowerShell commands (T1086), would strengthen overall coverage against these behaviors.

