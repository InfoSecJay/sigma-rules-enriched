title: Reg Add Suspicious Paths
id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
status: test
description: Detects when an adversary uses the reg.exe utility to add or modify new
  keys or subkeys
references:
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1112/T1112.md
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1562.001/T1562.001.md
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2022-10-10
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_path:
    CommandLine|contains:
            # Add more suspicious registry locations below
    - '\AppDataLow\Software\Microsoft\'
    - '\Policies\Microsoft\Windows\OOBE'
    - '\Policies\Microsoft\Windows NT\CurrentVersion\Winlogon'
    - '\SOFTWARE\Microsoft\Windows NT\Currentversion\Winlogon'
    - '\CurrentControlSet\Control\SecurityProviders\WDigest'
    - '\Microsoft\Windows Defender\'
  condition: all of selection_*
falsepositives:
- Rare legitimate add to registry via cli (to these locations)
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity where an attacker uses the `reg.exe` utility to add or modify registry keys or subkeys in suspicious locations. By manipulating the Windows registry, adversaries may achieve persistence, modify system behavior, or disable security features to facilitate their objectives. Common motivations for this behavior include maintaining access, evading detection, or altering system configurations to align with their tactics, techniques, and procedures.

  The relevant MITRE ATT&CK tactics for this rule include **Persistence** (TA0003) through the use of registry manipulation (T1112) and **Defense Evasion** (TA0005) via the changes made in the registry (T1562.001). Attackers can exploit vulnerabilities in the Windows environment to modify critical registry settings, making it essential for security teams to monitor this activity closely.

  The primary data sources for this detection include process creation events, specifically monitoring the command line usage and the image associated with the `reg.exe` execution. This allows analysts to capture suspicious registry modifications that bypass standard auditing mechanisms.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for instances of `reg.exe` being executed. Note the command line arguments used to help identify any suspicious registry paths being modified.

  - **Analyze Suspicious Registry Keys:** Investigate the specific registry keys or subkeys targeted in the detection. Focus on the known malicious paths and correlate them with user accounts and their activity to assess any potential threats.

  - **Evaluate User Context:** Check the user context in which `reg.exe` was run. Legitimate administrative actions should be validated against user permissions and typical operational procedures to identify anomalies.

  - **Conduct a Threat Intelligence Review:** Cross-reference the identified registry modifications with threat intelligence feeds to determine if they match known adversarial behaviors or IOCs associated with previous incidents.

  ### Prioritization
  The alert is classified as high severity due to the critical nature of registry modifications in the Windows operating system. Unauthorized changes can allow an attacker to establish persistence and evade detection efforts, posing a significant risk to the security posture of the enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may not capture all malicious registry modifications, especially if attackers use different tools or methods to achieve similar objectives. The current logic assumes that `reg.exe` will be used in typical paths indicative of malevolent behavior, but there may be gaps in detection for legitimate administrative actions that utilize these paths infrequently. Additionally, logs must be configured to capture comprehensive command line arguments and process creation events for effective functioning of this detection.

