title: Reg Add Suspicious Paths
id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
status: test
description: Detects when an adversary uses the reg.exe utility to add or modify
  new keys or subkeys
references:
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1112/T1112.md
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1562.001/T1562.001.md
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2022-10-10
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_path:
    CommandLine|contains:
            # Add more suspicious registry locations below
    - '\AppDataLow\Software\Microsoft\'
    - '\Policies\Microsoft\Windows\OOBE'
    - '\Policies\Microsoft\Windows NT\CurrentVersion\Winlogon'
    - '\SOFTWARE\Microsoft\Windows NT\Currentversion\Winlogon'
    - '\CurrentControlSet\Control\SecurityProviders\WDigest'
    - '\Microsoft\Windows Defender\'
  condition: all of selection_*
falsepositives:
- Rare legitimate add to registry via cli (to these locations)
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of `reg.exe` to add or modify registry keys, particularly in potentially evasive and suspicious locations often targeted by adversaries for persistence or defense evasion. The likely attacker objective includes maintaining persistence on compromised systems or altering security configurations to avoid detection. This behavior can be classified under the MITRE ATT&CK tactics of Persistence (T1112) and Defense Evasion (T1562.001).

  Primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688, which captures command-line activities of processes. If the detected action is malicious, it may allow an attacker to regain access to a compromised system or undermine security controls. However, this detection does NOT definitively confirm malicious intent on its own since legitimate administrative tasks may occur under similar circumstances.

  ### Investigation Steps

  - **Identify the process initiation: ** Check Windows Event ID 4688 for new process creation involving `reg.exe`. Review the `CommandLine` field for additional context, especially focusing on whether the command includes suspicious paths indicative of potential exploitation.

  - **Evaluate registry changes: ** Investigate recent registry modifications by reviewing logs using Event ID 4663, focusing specifically on changes made in the identified suspicious registry paths (e.g., `\Policies\Microsoft\Windows NT\CurrentVersion\Winlogon`). Note the `ObjectType` and `AccessMask` fields to determine if the access was legitimate.

  - **Check user context: ** Confirm the user account executing the command with the `Security ID` field from Event ID 4688. Look for anomalous accounts (non-privileged or unfamiliar accounts) executing commands in critical registry areas, which would be a high-confidence malicious indicator.

  - **Assess for legitimate behavior: ** Identify expected administrative tasks that could trigger this alert by reviewing past documented activities related to legitimate software deployments or configurations that may involve registry modifications.

  - **Correlate with other security alerts: ** Cross-reference this activity with other alerts such as changes in local security policies (Event ID 4719) or similar registry modifications by other processes to identify correlated activity that may indicate ongoing malicious behavior.

  ### Prioritization

  The alert severity is high due to the potential for critical exploitation of system integrity if malicious actions are confirmed, particularly on sensitive assets such as domain controllers or endpoint management servers. Activities detected via this rule reflect common adversary tactics observed in the wild, indicating a significant threat level that warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of adequate logging configurations or oversight of legitimate administrative actions, which may trigger the alert. False positives are possible if authorized users modify the registry as part of legitimate configurations. Companion detections could include monitoring changes to Local Security Policies (Event ID 4719) or suspicious file creations around the time of registry modifications, enhancing the overall threat visibility.

