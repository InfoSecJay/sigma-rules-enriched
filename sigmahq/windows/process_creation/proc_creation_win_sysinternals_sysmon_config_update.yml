logsource:
  category: process_creation
  product: windows
detection:
  selection_pe:
  - Image|endswith:
    - \Sysmon64.exe
    - \Sysmon.exe
  - Description: 'System activity monitor'
  selection_cli:
    CommandLine|contains|windash: '-c'
  condition: all of selection_*
falsepositives:
- Legitimate administrators might use this command to update Sysmon 
  configuration.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects updates to Sysmon's configuration file, which can indicate attempts by an attacker to alter the monitoring settings. An adversary may modify Sysmon's configuration to evade detection or reduce visibility into their malicious activities while maintaining the operation of the logging service. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (TA0005), specifically under technique **Configuration modification** (T1685).

  The primary telemetry sources include process creation events from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If the behavior is malicious, it can significantly undermine the organization’s ability to monitor and respond to threats effectively. It is essential to note that this detection does NOT confirm malicious intent on its own, as legitimate administrators may also perform this action as part of their duties.

  ### Investigation Steps

  - **Check recent Sysmon configuration changes:** Review the command line arguments in Security Event ID 4688 or Sysmon Event ID 1 for any updates including “-c” parameter, indicating a configuration modification.
  - **Identify the user account responsible:** Verify the account that executed the Sysmon update. Review Event ID 4624 (successful logon), correlating with the time of the configuration change to ensure it is a legitimate administrator.
  - **Analyze configuration file changes:** Retrieve Sysmon configuration files and analyze recent changes. Legitimate configurations typically include a comprehensive set of monitored processes and events; missing entries may indicate tampering.
  - **Review other related events:** Look for abnormal process activities following the configuration update within the same timeframe, particularly any execution of commands that are indicative of malicious activity (e.g., unusual PowerShell scripts or process executions).
  - **Document host role and asset criticality:** Ensure to identify the role of the affected host (e.g., server, workstation) and consider the criticality of this asset to the organization’s operations, which would elevate the urgency of the investigation.
  - **Check log integrity:** Validate the integrity and completeness of Sysmon logs during the time of the configuration update. Any gaps might suggest log deletion or tampering to hide malicious activities.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on the organization's ability to monitor and respond to threats effectively. The likelihood of malicious abuse is significant, as attackers often target logging systems to reduce detection chances. Modifications to such configurations can indicate an adversary preparing for further exploitation or data exfiltration attempts.

  ### Blind Spots and Assumptions

  This detection may be limited by system misconfigurations or missing Sysmon logs if not all necessary logging is enabled. Legitimate activities, such as routine updates by administrators, can trigger the alert and may complicate investigations. A related detection that enhances coverage would be monitoring for unusual command execution patterns or modifications to log retention policies, indicating an attempt to destroy or alter evidence.

