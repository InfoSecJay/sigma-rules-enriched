title: Sysmon Configuration Update
id: 87911521-7098-470b-a459-9a57fc80bdfd
status: test
description: Detects updates to Sysmon's configuration. Attackers might update 
  or replace the Sysmon configuration with a bare bone one to avoid monitoring 
  without shutting down the service completely
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-09
modified: 2024-03-13
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_pe:
  - Image|endswith:
    - \Sysmon64.exe
    - \Sysmon.exe
  - Description: 'System activity monitor'
  selection_cli:
    CommandLine|contains|windash: '-c'
  condition: all of selection_*
falsepositives:
- Legitimate administrators might use this command to update Sysmon 
  configuration.
level: medium
note: |
  ### Technical Context

  This detection rule identifies changes made to Sysmon’s configuration. Adversaries may attempt to alter or replace the Sysmon configuration with a minimal setup to evade monitoring while keeping the Sysmon service running. The likely objective is to conceal malicious activities or avoid detection by monitoring systems. This behavior corresponds to the MITRE ATT&CK technique "Modify System Encryption" (T1562.001). The primary telemetry source is the process creation logs from Windows, particularly events related to the execution of Sysmon (Image paths: `\Sysmon64.exe` or `\Sysmon.exe`). If malicious, this can lead to undetected adversarial actions while maintaining access to the target system. Importantly, this alert alone does not confirm malicious activity; legitimate system administrators can also modify Sysmon’s configuration for valid operational purposes.

  ### Investigation Steps

  - **Check Sysmon process creation events:** Review Security Event ID 4688 for Sysmon process creation to confirm if it's being executed with the command-line argument '-c', indicating a configuration update.

  - **Identify legitimate configurations:** Compare the current Sysmon configuration against baseline standard configurations to establish what expected configurations should include, highlighting any major deviations that raise suspicion.

  - **Analyze command-line arguments:** Look for instances where `CommandLine` contains '-c' in Sysmon logs. Malicious entries may deviate from standard parameters used by administrators.

  - **Review Sysmon version:** Verify the version of Sysmon being used through Windows Event ID 4688 logs; ensure that it's a supported version, as older versions with lower monitoring capabilities may pose a risk.

  - **Examine changes in log verbosity:** If changes were made, evaluate whether the new configuration results in reduced logging levels or omissions of critical monitoring data, indicating a substantial security risk.

  - **Cross-reference admin access:** Check for valid administrative accounts that executed the relevant command. Investigate any anomalous access patterns or if the user typically operates in a low-privilege context.

  ### Prioritization

  This alert is medium severity in an enterprise context; it highlights potential evasion tactics by adversaries. The impact is significant if the affected system has high value or critical data. The likelihood of malicious activity is moderate, as attackers often employ such techniques to undermine security measures while operationally it’s seen as a common action by legitimate administrators.

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion techniques, such as attackers using alternative methods or tools to modify Sysmon configurations without triggering this alert. Reliable detection requires comprehensive logging configurations for Sysmon and other process monitoring tools. Legitimate activities, such as system maintenance and updates by administrators, may trigger the alert. A companion detection is monitoring for changes to Windows Event Viewer settings, which could indicate a broader attempt to reduce visibility into system activities.

