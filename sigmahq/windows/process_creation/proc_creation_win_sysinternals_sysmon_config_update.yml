title: Sysmon Configuration Update
id: 87911521-7098-470b-a459-9a57fc80bdfd
status: test
description: Detects updates to Sysmon's configuration. Attackers might update or
  replace the Sysmon configuration with a bare bone one to avoid monitoring without
  shutting down the service completely
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-09
modified: 2024-03-13
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_pe:
  - Image|endswith:
    - \Sysmon64.exe
    - \Sysmon.exe
  - Description: 'System activity monitor'
  selection_cli:
    CommandLine|contains|windash: '-c'
  condition: all of selection_*
falsepositives:
- Legitimate administrators might use this command to update Sysmon configuration.
level: medium
note: |
  ### Technical Context
  This detection rule identifies updates made to Sysmon's configuration, which is a central component for monitoring and logging system and process activities on Windows environments. Attackers may exploit this functionality by altering or replacing the Sysmon configuration file with a minimal or ineffective version. By doing this, they aim to evade detection while keeping the Sysmon service running, thus continuing their illicit activity without raising immediate alarms.

  The relevant MITRE ATT&CK tactic is **Defense Evasion**, specifically technique **T1562.001: Disable or Modify Tools**. The primary data sources for this detection will include process creation events that indicate unauthorized commands executed to modify or update Sysmon’s configuration.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for `Sysmon.exe` or `Sysmon64.exe` being executed with command-line arguments indicative of configuration updates (-c flag). Focus on the timestamps and associated user accounts.
  - **Analyze Command Line Arguments:** Look for suspicious parameters in the command line of the Sysmon processes and identify any typical patterns that deviate from standard administrative usage.
  - **Correlate with User Behavior:** Compare the detected command with the user's historical behavior and permissions to identify any anomalous activity that could suggest unauthorized access.
  - **Check Sysmon Configuration Files:** Inspect the configuration files themselves for their content and evaluate whether they have been replaced or modified in a way that reduces logging efficacy.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact on visibility within the environment; if attackers successfully alter Sysmon configurations, they can hide their activities, increasing the likelihood of sustained breaches.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Sysmon is not installed uniformly across all endpoints, leading to incomplete visibility. The detection logic assumes that malicious actors will use command line arguments typically associated with legitimate operations, which may not be the case with all attacks. The rule requires comprehensive process creation logs to function effectively, necessitating proper configuration and deployment of Sysmon on all endpoints.

