title: Suspicious Scheduled Task Creation via Masqueraded XML File
id: dd2a821e-3b07-4d3b-a9ac-929fe4c6ca0c
status: test
description: Detects the creation of a scheduled task using the "-XML" flag with
  a file without the '.xml' extension. This behavior could be indicative of 
  potential defense evasion attempt during persistence
references:
- https://learn.microsoft.com/en-us/windows/win32/taskschd/daily-trigger-example--xml-
- https://github.com/elastic/protections-artifacts/blob/084067123d3328a823b1c3fdde305b694275c794/behavior/rules/persistence_suspicious_scheduled_task_creation_via_masqueraded_xml_file.toml
author: Swachchhanda Shrawan Poudel, Elastic (idea)
date: 2023-04-20
modified: 2024-12-01
tags:
- attack.privilege-escalation
- attack.execution
- attack.defense-evasion
- attack.persistence
- attack.t1036.005
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains:
    - '/create'
    - '-create'
  selection_cli_xml:
    CommandLine|contains:
    - '/xml'
    - '-xml'
  filter_main_extension_xml:
    CommandLine|contains: '.xml'
  filter_main_system_process:
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_main_rundll32:
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - ':\WINDOWS\Installer\MSI'
    - '.tmp,zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_third_party:
    ParentImage|endswith:
            # Consider removing any tools that you don't use to avoid blind spots
    - ':\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe'
    - ':\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe'
    - ':\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe'
    - ':\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe'
    - ':\Program Files\Dell\SupportAssist\pcdrcui.exe'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a scheduled task using the `schtasks.exe` command with the `-XML` flag applied to files that do not have the `.xml` file extension. The behavior suggests a possible defense evasion technique, where an adversary attempts to mask malicious activities by misusing legitimate Windows tools to establish persistence. This activity is categorized under the MITRE ATT&CK tactics of **Persistence (T1053.005)** and **Defense Evasion (T1036.005)**.

  The primary telemetry sources are Windows Process Creation logs, specifically targeting Event ID 4688, which captures details related to newly created processes, and the command line used. If malicious, this behavior may indicate a persistent threat actor trying to maintain access to a system by setting up scheduled tasks in a covert manner. This detection does NOT confirm malicious intent or compromise on its own; further contextual analysis of the task and surrounding activities is essential.

  ### Investigation Steps

  - **Examine process creation details:** Review Event ID 4688 logs for **schtasks.exe** executions. Look for command lines using `/create` and `-xml` flags. Malicious indicators include the use of a file path without a `.xml` extension.

  - **Identify legitimate task creation patterns:** Compare with known good task creation within your environment. Legitimate scheduled tasks generally involve `.xml` files that conform to expected naming conventions and locations, e.g., `C:\Windows\Temp\task.xml`.

  - **Analyze parent process relationships:** Check for parent processes of **schtasks.exe** in Event ID 4688 logs. Investigate if the parent process is **rundll32.exe**, as this may indicate a suspicious context, especially if the command line references unusual or temporary file paths.

  - **Validate running scheduled tasks:** Use `Get-ScheduledTask` in PowerShell to list tasks present. Cross-reference with documented implementations to ensure all scheduled tasks are expected and appropriate for your environment.

  - **Investigate task integrity:** Examine any new or modified tasks for their integrity level. Tasks created with **System** level privileges could indicate elevated permissions being misused.

  - **Review third-party software behavior:** Consider additional scrutiny for specific third-party applications identified by the rule's filters. Ensure they are legitimate tools used within your organization and have not been compromised.

  ### Prioritization

  The severity of this alert is moderate given that the affected systems can hold critical enterprise functions. The likelihood of malicious use is significant as this technique is commonly weaponized by threat actors for persistence mechanisms. Affected systems should be prioritized for review to prevent prolonged unauthorized access.

  ### Blind Spots and Assumptions

  This detection may not capture all evasion techniques, particularly if adversaries use custom or less-detected processes. Ensure the execution logs from **schtasks.exe** are reliably collected and configured in your SIEM. Legitimate activities, such as automated enterprise updates, may produce similar artifacts. Consider correlating with detection for abnormal PowerShell activity to enhance threat coverage.

