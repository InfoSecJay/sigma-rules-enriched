- attack.defense-evasion
- attack.persistence
- attack.t1036.005
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains:
    - '/create'
    - '-create'
  selection_cli_xml:
    CommandLine|contains:
    - '/xml'
    - '-xml'
  filter_main_extension_xml:
    CommandLine|contains: '.xml'
  filter_main_system_process:
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_main_rundll32:
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - ':\WINDOWS\Installer\MSI'
    - '.tmp,zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_third_party:
    ParentImage|endswith:
            # Consider removing any tools that you don't use to avoid blind spots
    - ':\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe'
    - ':\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe'
    - ':\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe'
    - ':\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe'
    - ':\Program Files\Dell\SupportAssist\pcdrcui.exe'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of a scheduled task using the `schtasks.exe` utility, specifically through the `-XML` flag with a file that does not have an `.xml` extension. This behavior may indicate an attempt by an adversary to evade detection while establishing persistence on the system. Adversaries may use scheduled tasks to automate malicious payload execution or maintain access post-compromise.

  The relevant MITRE ATT&CK tactics and techniques for this detection are Persistence (T1053.005) and Defense Evasion (T1036.005). The primary telemetry source is Windows process creation events, especially focusing on security Event IDs 4688 and Sysmon Event ID 1, which provide insights into command line arguments used during task creation. If malicious, this could lead to unauthorized control over system operations. However, this detection alone does not confirm malicious intent; legitimate applications may use similar functionality under specific conditions.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 (or Sysmon Event ID 1) to identify instances of `schtasks.exe` execution. Focus on the `CommandLine` field for the presence of `-XML` and the absence of a valid `.xml` extension.

  - **Analyze command line details:** Look for specific command line arguments such as `/create` and any indication of a non-standard filename (e.g., `task.xml` instead of `task.xml`), which may suggest evasion.

  - **Identify parent process context:** Check the `ParentImage` field in the logs for unusual parent processes such as `rundll32.exe` or specific third-party installer applications. Malicious activity often masquerades under benign-looking processes.

  - **Correlate with legitimate usage patterns:** Determine if there are legitimate scheduled tasks or processes on the system known for similar command line patterns. Record any benign tasks created under typical operational conditions.

  - **Verify integrity levels:** Investigate the integrity level specified in the logs. Instances with a `System` integrity level (S-1-16-16384) are often indicative of privileged escalation attempts by adversaries and warrant further scrutiny.

  - **Check for artifacts of persistence:** Look for persistence artifacts in the `C:\Windows\System32\Tasks` directory or corresponding registry keys for scheduled tasks. Confirm if those items match the suspicious behavior observed in the logs and validate their creation timestamps.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact of malicious scheduled tasks on enterprise systems. Scheduled tasks are commonly weaponized by attackers for maintaining persistence or executing payloads in a stealthy manner. Malicious use of this functionality has been observed in the wild, increasing the need for thorough investigation.

  ---

  ### Blind Spots and Assumptions

  Detection of this behavior can be evaded by legitimate scheduled task management tools or if logs are not properly configured to capture execution details. Ensure that Windows Security Auditing is enabled to capture all relevant Event IDs. Legitimate administrative activities, such as automated scripts or scheduled maintenance tasks, may also trigger this alert. A related detection to consider is monitoring modifications to the Task Scheduler itself, which can provide additional context for any suspicious changes.

