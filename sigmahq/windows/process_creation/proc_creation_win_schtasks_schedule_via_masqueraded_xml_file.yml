title: Suspicious Scheduled Task Creation via Masqueraded XML File
id: dd2a821e-3b07-4d3b-a9ac-929fe4c6ca0c
status: test
description: Detects the creation of a scheduled task using the "-XML" flag with a
  file without the '.xml' extension. This behavior could be indicative of potential
  defense evasion attempt during persistence
references:
- https://learn.microsoft.com/en-us/windows/win32/taskschd/daily-trigger-example--xml-
- https://github.com/elastic/protections-artifacts/blob/084067123d3328a823b1c3fdde305b694275c794/behavior/rules/persistence_suspicious_scheduled_task_creation_via_masqueraded_xml_file.toml
author: Swachchhanda Shrawan Poudel, Elastic (idea)
date: 2023-04-20
modified: 2024-12-01
tags:
- attack.privilege-escalation
- attack.execution
- attack.defense-evasion
- attack.persistence
- attack.t1036.005
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains:
    - '/create'
    - '-create'
  selection_cli_xml:
    CommandLine|contains:
    - '/xml'
    - '-xml'
  filter_main_extension_xml:
    CommandLine|contains: '.xml'
  filter_main_system_process:
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_main_rundll32:
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - ':\WINDOWS\Installer\MSI'
    - '.tmp,zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_third_party:
    ParentImage|endswith:
            # Consider removing any tools that you don't use to avoid blind spots
    - ':\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe'
    - ':\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe'
    - ':\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe'
    - ':\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe'
    - ':\Program Files\Dell\SupportAssist\pcdrcui.exe'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule is designed to detect the suspicious creation of a scheduled task using the `schtasks.exe` utility with a `-XML` flag along with a file that lacks a `.xml` extension. This behavior may indicate an attacker’s attempt to evade detection mechanisms while establishing persistence within a Windows environment. By masquerading the XML input, the threat actor might aim to execute malicious tasks without raising immediate suspicion, making it difficult for security software to analyze the inputs and the associated task behavior.

  In this context, typical attacker objectives include maintaining long-term access to compromised systems, executing code at specific intervals, and attempting a stealthy approach to evade security measures. The relevant MITRE ATT&CK tactics associated with this detection include **Persistence (T1053.005)**, as the action relates to establishing a method for the attacker to regain access to the system. Additionally, the technique of **Defense Evasion (T1036.005)** is pertinent, given the masquerading strategy employed by the attacker.

  Primary data sources for detecting this behavior will include **process creation logs** which detail command line arguments used when new processes are initiated, as well as insights from **event logs** that may record the specific actions taken by `schtasks.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events from the endpoint to identify instances of `schtasks.exe` being executed with suspicious command line arguments, especially focusing on the `-XML` flag without the `.xml` extension.

  - **Analyze Task Scheduler Logs**: Investigate Windows Task Scheduler logs to determine if any tasks were created, modified, or executed that might correlate with the potentially malicious usage of `schtasks.exe`.

  - **Validate Parent Process Context**: Ensure you examine the parent processes of the detected `schtasks.exe` instances, specifically looking for unusual parent processes or suspicious command line arguments indicative of evasion techniques.

  - **Correlate with Incident Response Data**: If suspicious scheduled tasks are found, correlate findings with other incident response artifacts, such as recent network connections or file modifications, to contextualize the actions of the potential threat actor.

  ### Prioritization
  This alert carries a medium severity level due to the implications of a possible persistence mechanism leveraging legitimate Windows functionality. Given that scheduled tasks can maintain long-term footholds, timely investigation is crucial to prevent further exploitation.

  ### Blind Spots and Assumptions
  There may be detection coverage gaps for specific legitimate use cases where administrators create scheduled tasks in ways that could mirror attacker tactics. The detection logic assumes that the usage of `schtasks.exe` with the specified parameters represents an abnormality. Further, appropriate logging must be enabled on Windows systems, particularly for detailed process creation events and Task Scheduler logs, to ensure the efficacy of this detection rule. Without these logs, the alert may fail to trigger or yield incomplete context for responding analysts.

