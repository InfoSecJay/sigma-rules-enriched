title: Suspicious Scheduled Task Creation via Masqueraded XML File
id: dd2a821e-3b07-4d3b-a9ac-929fe4c6ca0c
status: test
description: Detects the creation of a scheduled task using the "-XML" flag with
  a file without the '.xml' extension. This behavior could be indicative of 
  potential defense evasion attempt during persistence
references:
- https://learn.microsoft.com/en-us/windows/win32/taskschd/daily-trigger-example--xml-
- https://github.com/elastic/protections-artifacts/blob/084067123d3328a823b1c3fdde305b694275c794/behavior/rules/persistence_suspicious_scheduled_task_creation_via_masqueraded_xml_file.toml
author: Swachchhanda Shrawan Poudel, Elastic (idea)
date: 2023-04-20
modified: 2024-12-01
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.stealth
- attack.t1036.005
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains:
    - '/create'
    - '-create'
  selection_cli_xml:
    CommandLine|contains:
    - '/xml'
    - '-xml'
  filter_main_extension_xml:
    CommandLine|contains: '.xml'
  filter_main_system_process:
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_main_rundll32:
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - ':\WINDOWS\Installer\MSI'
    - '.tmp,zzzzInvokeManagedCustomActionOutOfProc'
  filter_optional_third_party:
    ParentImage|endswith:
            # Consider removing any tools that you don't use to avoid blind spots
    - ':\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe'
    - ':\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe'
    - ':\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe'
    - ':\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe'
    - ':\Program Files\Dell\SupportAssist\pcdrcui.exe'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potentially suspicious creation of a scheduled task using the `schtasks.exe` utility with the `-XML` option, specifically when the referenced XML file lacks a `.xml` extension. This behavior often indicates an adversary's attempt to mask malicious activities, potentially aimed at establishing persistence or evading detection mechanisms. The relevant MITRE ATT&CK tactics include "Persistence" (TA0003) and "Execution" (TA0002), with a focus on the technique ID T1053.005, which pertains to Scheduled Task/Job creation.

  The primary telemetry sources required for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If confirmed as malicious, this activity could allow an attacker to maintain foothold within the organization or carry out other nefarious activities without detection. However, this detection alone does not provide conclusive evidence of malicious intent; it simply indicates suspicious usage of legitimate Windows functionality.

  ### Investigation Steps

  - **Verify command line arguments:** Review the command line associated with the `schtasks.exe` process (Event ID 4688 or Sysmon Event ID 1). Look for instances where the command includes `-XML` with a file that does not end in `.xml`, which could indicate evasion tactics.

  - **Assess scheduled task specifics:** Check the Event Viewer under Task Scheduler for new scheduled tasks (Event ID 4698). Record the task name and check its configuration to see if it points to unknown or untrusted executables.

  - **Identify high-confidence indicators:** Focus on the integrity level of the process. If the task creation is performed at the `System` integrity level (indicated by the `IntegrityLevel` field), this could suggest malicious intent as standard applications typically operate at a lower level.

  - **Validate expected behavior:** Confirm if the `schtasks.exe` execution aligns with known maintenance activities or software installations in the environment. Legitimate uses often have identifiable task names and descriptions.

  - **Investigate parent process context:** Look at the ParentImage and ParentCommandLine fields. Anomalous commands from processes like `rundll32.exe` or known installers should be flagged for further investigation as they often relate to attempts to execute scripts or payloads.

  - **Correlate with other detections:** Cross-reference with related alerts such as those detecting excessive command line usage or abnormal process start sequences to validate the context of this alert.

  ### Prioritization

  This alert is of medium severity as it indicates potentially malicious activity based on suspicious usage patterns of scheduled task creation. The impact can be considerable, especially on critical systems where a persistent threat could compromise data integrity and confidentiality. While the behavior can indicate an organization's defense evasion technique, it may not represent a common attack vector.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to utilize `schtasks.exe` with unusual command line flags that may trigger the alert. Continuous monitoring of telemetry sources is essential for reliable detection; missing or misconfigured Windows event logs can hinder accurate detection. Additionally, legitimate automation tasks could activate this alert and thus need to be evaluated for intent. Related detections for monitoring unusual process creation or script executions are recommended to strengthen security coverage.

