status: experimental
description: |
  Detects suspicious FileFix execution patterns where users are tricked into running malicious commands through browser file upload dialog manipulation.
  This attack typically begins when users visit malicious websites impersonating legitimate services or news platforms,
  which may display fake CAPTCHA challenges or direct instructions to open file explorer and paste clipboard content.
  The clipboard content usually contains commands that download and execute malware, such as information stealing tools.
references:
- https://mrd0x.com/filefix-clickfix-alternative/
- https://expel.com/blog/cache-smuggling-when-a-picture-isnt-a-thousand-words/     # phishing lure directly asking users to open file explorer and paste command
- https://blog.checkpoint.com/research/filefix-the-new-social-engineering-attack-building-on-clickfix-tested-in-the-wild/
author: 0xFustang, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-24
tags:
- attack.execution
- attack.t1204.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_exec_parent:
        # This is case where phishing pages trick users to paste commands in browser file upload dialog
    ParentImage|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\msedge.exe'
    CommandLine|contains: '#'
  selection_cli_lolbin:
    CommandLine|contains:
    - '%comspec%'
    - 'bitsadmin'
    - 'certutil'
    - 'cmd'
    - 'cscript'
    - 'curl'
    - 'finger'
    - 'mshta'
    - 'powershell'
    - 'pwsh'
    - 'regsvr32'
    - 'rundll32'
    - 'schtasks'
    - 'wget'
    - 'wscript'
  selection_cli_captcha:
    CommandLine|contains:
    - 'account'
    - 'anti-bot'
    - 'botcheck'
    - 'captcha'
    - 'challenge'
    - 'confirmation'
    - 'fraud'
    - 'human'
    - 'identification'
    - 'identificator'
    - 'identity'
    - 'robot'
    - 'validation'
    - 'verification'
    - 'verify'
  condition: selection_exec_parent and 1 of selection_cli_*
falsepositives:
- Legitimate use of PowerShell or other utilities launched from browser 
  extensions or automation tools
level: high
note: |
  ### Technical Context

  This rule detects the execution of commands that are manipulated through browser file upload dialogs. Attackers often trick users into running malicious scripts through deceptive prompts, particularly by mimicking CAPTCHA challenges or fake instructions on compromised websites. The likely attacker objective is to execute malware or remote command execution tools on the victim's machine, typically for information theft. This behavior corresponds to the MITRE ATT&CK technique: Social Engineering (T1204.004).

  The primary telemetry sources include process creation logs from Windows systems, specifically focusing on Event ID 4688 (process creation) and potentially Sysmon Event ID 1 (process creation details). If successful, this attack could lead to serious security compromise, as malicious code could extract sensitive data or establish persistence. Importantly, this detection alone does not confirm that an infection has occurred; it only indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check Windows Security Event ID 4688 for any process creation events initiated by browsers (e.g., Chrome, Firefox, Brave, Edge) where the `ParentImage` ends with the browser process name and `CommandLine` contains '#'. Malicious indicators may include command line arguments that suggest clipboard commands being pasted.

  - **Identify PowerShell or Command-Line Execution:** Look for entries in Event ID 4688 or Sysmon Event ID 1 with `CommandLine` fields containing keywords such as 'powershell', 'cmd', or 'curl'. High confidence indicators of malicious activity might include unusual parent processes or command lines that execute remote download commands.

  - **Verify Communication Patterns:** Examine logs for outbound connections initiated by the detected processes. Look for connections to suspicious IP addresses or domains using tools like PowerShell (Event ID 4688) or other command-line utilities.

  - **Correlate with User Context:** Investigate the user account associated with the suspicious activity. Assess the legitimacy of their browsing behavior by checking browser history or recent sites accessed. Look for common legitimate URLs related to their usual web activity to establish context.

  - **Examine File Creation Events:** Track any file creation events linked to the suspicious command execution. Validate that no unauthorized scripts or binaries were created in the user's profile directory, particularly in the Downloads or ApplicationData folders.

  - **Consider Expected User Actions:** Document what legitimate use cases exist for legitimate commands in the browser, such as legitimate interactions with file upload dialogs for common file-sharing services (e.g., Google Drive). Anomalous or unexpected patterns linked to these services could suggest malicious activity.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive data and user systems, particularly if it involves high-privilege accounts or critical assets. The likelihood of malicious abuse is significant, especially given the rising trend of social engineering tactics targeting end users for control over their systems. This behavior is commonly weaponized in phishing campaigns.

  ### Blind Spots and Assumptions

  Detection limitations may exist if attackers use encrypted communications or legitimate processes to obfuscate their actions. The required log sources include both Security Event logs (ID 4688) and Sysmon logs (ID 1) for a comprehensive view. Legitimate user actions, such as running backup scripts or legitimate download and execution of updates, may inadvertently trigger the alert. Companion detections, such as monitoring for unusual outbound network traffic patterns after the execution alert, would strengthen overall threat coverage.

