description: |
  Detects suspicious FileFix execution patterns where users are tricked into running malicious commands through browser file upload dialog manipulation.
  This attack typically begins when users visit malicious websites impersonating legitimate services or news platforms,
  which may display fake CAPTCHA challenges or direct instructions to open file explorer and paste clipboard content.
  The clipboard content usually contains commands that download and execute malware, such as information stealing tools.
references:
- https://mrd0x.com/filefix-clickfix-alternative/
- https://expel.com/blog/cache-smuggling-when-a-picture-isnt-a-thousand-words/     # phishing lure directly asking users to open file explorer and paste command
- https://blog.checkpoint.com/research/filefix-the-new-social-engineering-attack-building-on-clickfix-tested-in-the-wild/
author: 0xFustang, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-24
tags:
- attack.execution
- attack.t1204.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_exec_parent:
        # This is case where phishing pages trick users to paste commands in browser file upload dialog
    ParentImage|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\msedge.exe'
    CommandLine|contains: '#'
  selection_cli_lolbin:
    CommandLine|contains:
    - '%comspec%'
    - 'bitsadmin'
    - 'certutil'
    - 'cmd'
    - 'cscript'
    - 'curl'
    - 'finger'
    - 'mshta'
    - 'powershell'
    - 'pwsh'
    - 'regsvr32'
    - 'rundll32'
    - 'schtasks'
    - 'wget'
    - 'wscript'
  selection_cli_captcha:
    CommandLine|contains:
    - 'account'
    - 'anti-bot'
    - 'botcheck'
    - 'captcha'
    - 'challenge'
    - 'confirmation'
    - 'fraud'
    - 'human'
    - 'identification'
    - 'identificator'
    - 'identity'
    - 'robot'
    - 'validation'
    - 'verification'
    - 'verify'
  condition: selection_exec_parent and 1 of selection_cli_*
falsepositives:
- Legitimate use of PowerShell or other utilities launched from browser extensions
  or automation tools
level: high
note: |
  ### Technical Context
  This rule detects suspicious execution patterns associated with a method known as FileFix, where users may be manipulated into executing harmful commands through browser file upload dialogs. Attackers often use social engineering tactics, enticing users to visit malicious websites that masquerade as benign services. These sites may present fake CAPTCHA challenges or deceptive instructions instructing users to open their file explorer and paste commands copied from the clipboard. The clipboard commands frequently contain instructions that download and execute malicious software, such as keyloggers or other information-stealing tools.

  The MITRE ATT&CK framework outlines relevant tactics, particularly under Execution (T1204.004). This technique highlights how attacker objectives include running malicious code after tricking the user into executing it, showcasing the danger of social engineering in modern cyber threats. It poses a significant risk as user oversight can lead to the unintended execution of compromised commands.

  The primary data sources for effective detection of this behavior are process creation logs, specifically looking at CommandLine and ParentImage fields. These logs can unveil suspicious browser-based command executions initiated by users, especially when combined with strings typical of social engineering attacks.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for process creation events linked to web browsers (Brave, Chrome, Firefox, Edge) executing commands that contain '#', indicating potential manipulation through a file upload dialog.
  - **Investigate Command Lines**: Look for command lines that utilize tools like PowerShell, curl, or bitsadmin in combination with terms typical of CAPTCHA or validation challenges to identify user-triggered execution of potentially malicious commands.
  - **Analyze Related User Behavior**: Collect evidence of user activity immediately prior to suspicious behavior, examining browser histories, clipboard content, or site visit patterns to correlate with detected filing or execution.
  - **Correlate with Threat Intelligence**: Reference known malicious domains and associated indicators from reputable threat intelligence sources to determine if the detected behavior corresponds to ongoing campaigns or known threat actors.

  ### Prioritization
  The alert holds high severity in an enterprise environment due to the immediate risk it poses of users inadvertently executing harmful commands, potentially leading to large-scale data compromises or malware infections. The social engineering aspect amplifies the likelihood of successful exploitation.

  ### Blind Spots and Assumptions
  This detection rule assumes that sufficient logging of process creation is enabled across browsers used within the organization. However, users may execute commands via legitimate utilities (like PowerShell) or browser extensions, which can lead to false positives. If logging or monitoring of user actions in web browsers is inadequate, detection coverage may be limited. The detection logic also assumes that clipboard manipulation will be evident prior to execution events, which may not always be the case.

