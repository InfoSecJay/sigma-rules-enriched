title: Suspicious Velociraptor Child Process
id: 4bc90587-e6ca-4b41-be0b-ed4d04e4ed0c
status: experimental
description: Detects the suspicious use of the Velociraptor DFIR tool to execute
  other tools or download additional payloads, as seen in a campaign where it 
  was abused for remote access and to stage further attacks.
references:
- https://news.sophos.com/en-us/2025/08/26/velociraptor-incident-response-tool-abused-for-remote-access/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-08-29
tags:
- attack.command-and-control
- attack.persistence
- attack.defense-evasion
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\Velociraptor.exe'
  selection_child_vscode_tunnel:
    CommandLine|contains|all:
    - 'code.exe'
    - 'tunnel'
    - '--accept-server-license-terms'
  selection_child_msiexec:
    CommandLine|contains|all:
    - 'msiexec'
    - '/i'
    - 'http'
  selection_child_powershell:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'Invoke-WebRequest '
    - 'IWR '
    - '.DownloadFile'
    - '.DownloadString'
    # Add more child process patterns as needed
  condition: selection_parent and 1 of selection_child_*
falsepositives:
- Legitimate administrators or incident responders might use Velociraptor to 
  execute scripts or tools. However, the combination of Velociraptor spawning 
  these specific processes with these command lines is suspicious. Tuning may be
  required to exclude known administrative actions or specific scripts.
level: high
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious child processes spawned by the Velociraptor digital forensics tool. Attackers may exploit Velociraptor to gain unauthorized remote access, execute further payloads, or perform lateral movements within an enterprise environment. The relevant MITRE ATT&CK techniques are Command and Control (T1071) and Defense Evasion (T1219). Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, to capture process initiation details and command lines used. If confirmed malicious, the security impact could involve increased risk of data exfiltration, lateral movement, and unauthorized execution of scripts or applications. This detection does NOT confirm the intent of the activity without additional context, such as user behavior or established baselines.

  ### Investigation Steps

  - **Validate process execution context:** Review the parent process details in Security Event ID 4688 or Sysmon Event ID 1. Verify that 'Velociraptor.exe' is indeed the parent and note the timestamp and initiating user account for context.

  - **Examine command line arguments:** For any detected child processes, assess the command line in Event ID 4688. Malicious indicators include command lines containing 'code.exe' with 'tunnel' or any PowerShell commands invoking 'Invoke-WebRequest' for downloading resources, especially from untrusted URLs.

  - **Correlate with user behavior:** Check user activity logs for the account that initiated Velociraptor. Legitimate administrative tasks involving Velociraptor typically include investigating known endpoints or scheduled tasks, not initiating perspective child processes with suspicious command lines.

  - **Confirm network activity:** Investigate related network logs (e.g., proxy logs or firewall logs) for any suspicious outbound connections made by the parent Velociraptor process. Look for evidence of connections to known bad IPs or domains.

  - **Analyze related processes:** Identify and investigate other recent child processes created under Velociraptor, particularly those that are not typically associated with administrative actions, such as invoking 'msiexec' from a remote resource.

  - **Review asset criticality:** Determine if the target system is a high-value asset (e.g., server or domain controller) to prioritize response efforts and containment strategies, given the higher impact potential of a successful attack in these environments.

  ### Prioritization

  This alert carries a high severity due to the potential for malicious behavior. The likelihood of abuse is significant, particularly as Velociraptor is known to be weaponized for remote access and execution of further attacks. Since exploitation of this tool often signifies an active compromise, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by incidents where legitimate administrators utilize Velociraptor for maintenance or investigative tasks, potentially inflating false positives. Required log sources must be properly configured to include detailed command line logging for complete context. Additionally, legitimate uses may include contextually-related scripting or administrative actions that do not typically invoke the suspicious child processes detected. A related detection could be monitoring for unauthorized use of PowerShell with specific flags (e.g., PowerShell command execution logs).

