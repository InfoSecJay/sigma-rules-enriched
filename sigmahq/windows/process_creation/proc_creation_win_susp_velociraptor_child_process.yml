title: Suspicious Velociraptor Child Process
id: 4bc90587-e6ca-4b41-be0b-ed4d04e4ed0c
status: experimental
description: Detects the suspicious use of the Velociraptor DFIR tool to execute other
  tools or download additional payloads, as seen in a campaign where it was abused
  for remote access and to stage further attacks.
references:
- https://news.sophos.com/en-us/2025/08/26/velociraptor-incident-response-tool-abused-for-remote-access/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-08-29
tags:
- attack.command-and-control
- attack.persistence
- attack.defense-evasion
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\Velociraptor.exe'
  selection_child_vscode_tunnel:
    CommandLine|contains|all:
    - 'code.exe'
    - 'tunnel'
    - '--accept-server-license-terms'
  selection_child_msiexec:
    CommandLine|contains|all:
    - 'msiexec'
    - '/i'
    - 'http'
  selection_child_powershell:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'Invoke-WebRequest '
    - 'IWR '
    - '.DownloadFile'
    - '.DownloadString'
    # Add more child process patterns as needed
  condition: selection_parent and 1 of selection_child_*
falsepositives:
- Legitimate administrators or incident responders might use Velociraptor to execute
  scripts or tools. However, the combination of Velociraptor spawning these specific
  processes with these command lines is suspicious. Tuning may be required to exclude
  known administrative actions or specific scripts.
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify potential misuse of the Velociraptor tool—a digital forensics and incident response (DFIR) software commonly leveraged by administrators for system analysis. In this context, it can also be exploited by threat actors to execute secondary payloads or additional tools after gaining initial access, effectively serving as a means of lateral movement or further attack staging. The primary objective of an attacker using Velociraptor is likely to maintain persistence, exfiltrate data, or deploy further malicious payloads during an active compromise.

  Relevant MITRE ATT&CK tactics include **Command and Control (TA0011)**, where attackers may use the tool to initiate outbound connections for command execution, and **Persistence (TA0003)**, as they may establish a foothold through the execution of new tools or scripts under the guise of legitimate administrative operations. The specific techniques associated with this rule include **T1219: Remote Access Software**, which highlights how legitimate tools can be weaponized for malicious purposes.

  The best sources of telemetry for evidencing this behavior are **process creation logs** that capture command-line arguments and parent-child process relationships. These logs provide critical context for understanding how Velociraptor is being utilized within the environment.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances where `Velociraptor.exe` is the parent process. Pay close attention to the command-line parameters used by any child processes spawned, particularly those that include indicators of potentially malicious activity (e.g., downloading software).

  - **Analyze Command-Line Arguments:** Focus on child processes that contain command lines with `code.exe`, `msiexec`, or `powershell.exe`. Verify if the techniques used for downloading or executing these processes appear unusual or unauthorized.

  - **Correlate with User Activity:** Investigate the user accounts that triggered the detection. Ensure that there are no legitimate IT operations or maintenance activities that legitimately include Velociraptor's usage to execute tools or scripts.

  - **Look for Indicators of Compromise:** Investigate any additional logs or alerts that indicate further malicious behavior, such as unusual outbound traffic patterns or other behaviors associated with compromise or data exfiltration.

  ### Prioritization
  This alert should be treated with high severity due to the significant potential impact of unauthorized use of the Velociraptor tool. Its capabilities for remote access and execution of other malicious payloads make it a serious concern, especially in environments holding sensitive data.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly in distinguishing between legitimate administrative activity and malicious usage of Velociraptor, which may lead to false positives. The detection logic assumes that Velociraptor will not be used in highly controlled and monitored environments. Required logs include detailed process creation logs that capture command lines and parent-child relationships; without these, the detection may not function effectively.

