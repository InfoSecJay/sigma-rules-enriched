title: Suspicious Velociraptor Child Process
id: 4bc90587-e6ca-4b41-be0b-ed4d04e4ed0c
status: experimental
description: Detects the suspicious use of the Velociraptor DFIR tool to execute
  other tools or download additional payloads, as seen in a campaign where it 
  was abused for remote access and to stage further attacks.
references:
- https://news.sophos.com/en-us/2025/08/26/velociraptor-incident-response-tool-abused-for-remote-access/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-08-29
tags:
- attack.command-and-control
- attack.persistence
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\Velociraptor.exe'
  selection_child_vscode_tunnel:
    CommandLine|contains|all:
    - 'code.exe'
    - 'tunnel'
    - '--accept-server-license-terms'
  selection_child_msiexec:
    CommandLine|contains|all:
    - 'msiexec'
    - '/i'
    - 'http'
  selection_child_powershell:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - 'Invoke-WebRequest '
    - 'IWR '
    - '.DownloadFile'
    - '.DownloadString'
    # Add more child process patterns as needed
  condition: selection_parent and 1 of selection_child_*
falsepositives:
- Legitimate administrators or incident responders might use Velociraptor to 
  execute scripts or tools. However, the combination of Velociraptor spawning 
  these specific processes with these command lines is suspicious. Tuning may be
  required to exclude known administrative actions or specific scripts.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially malicious child processes spawned by Velociraptor, a DFIR tool. The behavior indicates that an attacker may be using Velociraptor to maintain persistence or execute additional payloads, including common attack tools such as Visual Studio Code, MSI installers, or PowerShell scripts aimed at data exfiltration. The relevant MITRE ATT&CK tactics include Command and Control (T1071) and Persistence (T1219). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which record parent-child process relationships. If malicious, this behavior could indicate a compromised host being leveraged for further intrusions or data theft. The detection does NOT confirm user intent or the legitimacy of activity without additional context.

  ### Investigation Steps

  - **Check parent process details:** Review Security Event ID 4688 for instances where `Velociraptor.exe` is the parent process. Compare logs against known legitimate uses within the organization to identify any anomalies.

  - **Examine child process command lines:** Analyze child processes spawned from `Velociraptor.exe` that have command lines containing 'code.exe' with 'tunnel' and '--accept-server-license-terms' (event indicates tunneling capabilities). If found, proceed with further investigation.

  - **Identify malicious PowerShell usage:** Filter for instances where Velociraptor triggers PowerShell (Event ID 4688 or Sysmon) with capturing command lines using `Invoke-WebRequest`, `IWR`, `.DownloadFile`, or `.DownloadString`. Instances that match these criteria may indicate an attempt to deliver additional payloads.

  - **Review legitimate administrator usage:** Investigate any occurrences of Velociraptor executing common administrative tasks, such as running official scripts or tools. This should include context on whether the execution aligns with scheduled maintenance or incident response activities.

  - **Assess for exfiltration artifacts:** Look for file creation events or network connections initiated by child processes to external IPs or Cloud storage, which may indicate unauthorized data exfiltration.

  ### Prioritization

  The alert severity is high due to the potential for an attacker leveraging Velociraptor to achieve persistence and execute further attacks. If a critical asset is involved, the impact could be significant. Additionally, the behavior described is increasingly weaponized by adversaries looking to evade detection during phases of malicious reconnaissance and exfiltration.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of Velociraptor, which could lead to false positives. It's essential to have comprehensive logging from Security and Sysmon on the hosts to ensure reliable detection. Activities such as legitimate system updates or authorized administrative scripts could trigger the alert. A related detection may include monitoring for anomalous outbound connections from those child processes to strengthen coverage against potential exfiltration attempts.

