logsource:
  category: process_creation
  product: windows
detection:
    # VT Query: behavior_processes:"iexpress.exe" and behavior_processes:"/n /q /m" and behavior_processes:"*.sed*" and p:5+
  selection_img:
  - Image|endswith: '\iexpress.exe'
  - OriginalFileName: 'IEXPRESS.exe'
  selection_cli:
    CommandLine|contains|windash: ' /n '
  selection_paths:
    CommandLine|contains:
            # Note: Add more uncommon paths that fit your organizational needs.
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: all of selection_*
falsepositives:
- Administrators building packages using iexpress.exe
level: high
note: |
  ### Technical Context

  This Sigma rule detects the usage of `iexpress.exe` to create self-extracting packages from Self Extraction Directive (SED) files located in potentially suspicious directories such as `C:\ProgramData`, `C:\Temp`, and various Windows system folders. Attackers may utilize this technique as part of a malware delivery mechanism, often aiming to obfuscate their payloads or bypass security controls during the lateral movement phase. This behavior aligns with the MITRE ATT&CK technique "Packaged Application Deployment" (T1218), which includes the use of application installers to deliver malicious payloads.

  The primary telemetry source includes Window process creation logs, specifically focusing on events from `Event ID 4688` and `Sysmon Event ID 1`, which capture command-line arguments and process creation details. If malicious, this behavior can lead to unauthorized code execution, data exfiltration, or system compromise. However, this detection does NOT confirm that the activity is inherently malicious, as legitimate use cases exist for creating self-extracting archives for benign administrative purposes.

  ### Investigation Steps

  - **Identify the process origin:** Review process creation logs for `Event ID 4688` related to `iexpress.exe`. Check the `NewProcessName` field for any entries that indicate non-standard use, particularly from paths like `C:\ProgramData\` or `C:\Temp\`. Legitimate administrative use might occur from managed installation scenarios.

  - **Examine command-line arguments:** Investigate the `CommandLine` field in the logs for any occurrence of `'/n /q /m'` along with references to `.sed` files. The presence of these arguments indicates an automated package installation which is typically used in malicious scenarios.

  - **Check for common SED locations:** Determine if the SED files are being utilized from suspicious or uncommon paths. Common directories such as `C:\Users\<username>\AppData\Local\Temp\` or system directories increase the likelihood of malicious intent.

  - **Correlate with threat intelligence:** Validate the file hashes against known malware databases such as VirusTotal. Use the `behavior_processes` entries and cross-reference with the file hash in your investigation to identify if this specific execution is associated with known threat actors.

  - **Assess system roles and criticality:** For hosts identified in the alert, determine the role and criticality of the asset within the environment. An alert on a domain controller, for instance, requires a more urgent response compared to a developer's workstation.

  - **Map indicators for malicious intent:** Looking at logs, if the usage of `iexpress.exe` correlates with other malicious behaviors like communication with known C2 servers or creating service binaries, it increases the confidence of malicious intent.

  ### Prioritization

  Given that this detection is placed at a high severity level, it indicates a significant concern for potential breaches. The alarming aspect is the use of a tool that can package and deploy malicious payloads. Particularly when the execution originates from sensitive or critical systems, the likelihood of malicious abuse is heightened, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection may have limitations if `iexpress.exe` is used from legitimate paths or by authorized users, leading to potential false positives. Reliable detection requires continuous monitoring of the specified folders, and if logging is not adequately configured, detection might fail. Legitimate activities, such as authorized package creation for internal apps, may also trigger this alert. A complementary detection to consider would be monitoring for unusual network traffic or file creations that coincide with garage patterns of executed files resulting from SED processing.

