logsource:
  category: process_creation
  product: windows
detection:
    # VT Query: behavior_processes:"iexpress.exe" and behavior_processes:"/n /q /m" and behavior_processes:"*.sed*" and p:5+
  selection_img:
  - Image|endswith: '\iexpress.exe'
  - OriginalFileName: 'IEXPRESS.exe'
  selection_cli:
    CommandLine|contains|windash: ' /n '
  selection_paths:
    CommandLine|contains:
            # Note: Add more uncommon paths that fit your organizational needs.
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: all of selection_*
falsepositives:
- Administrators building packages using iexpress.exe
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of `iexpress.exe` to create self-extracting executable files from Self Extraction Directive (SED) files, particularly when initiated from suspicious locations, such as temporary directories or non-standard paths. Attackers may employ this tool to deliver payloads that can lead to malicious activities, including malware distribution or unauthorized system modifications. The detection primarily targets scenarios where attackers seek to evade defenses by packaging malicious code in seemingly legitimate installers.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Defense Evasion** (TA0005), as the use of `iexpress.exe` can help attackers blend their activities with benign system operations. Specifically, the technique **Trusted Developer Utilities** (T1218) applies here, as `iexpress.exe` is a trusted utility in Windows that can be misused for harmful purposes.

  The primary data sources that will provide the best evidence of this behavior include **process creation logs** which capture the invocation of `iexpress.exe`, along with command-line arguments detailing the execution context. Additionally, monitoring for unusual or unauthorized paths in command-line arguments can aid in identifying potential malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for entries related to `iexpress.exe`, especially those involving command-line parameters such as `/n /q /m`. Pay attention to the timestamp and user accounts that executed the command.

  - **Analyze Command-Line Arguments**: Look for unusual directory paths in the command-line of `iexpress.exe`. Focus specifically on execution from locations like `C:\ProgramData\`, `C:\Temp\`, and `C:\Windows\Temp\`, which could indicate suspicious activity.

  - **Correlate with File Creation Events**: Investigate any file creations associated with the identified processes. Look for newly created executables or scripts in directories where `iexpress.exe` was run, as these may be indicative of malware being deployed.

  - **Identify Potential False Positives**: Be aware of legitimate use cases, such as system administrators creating packages with `iexpress.exe`. Verify the context of the execution and the user involved to distinguish between normal and malicious activity.

  ### Prioritization
  This alert is considered high severity due to the potential impact of successful use of `iexpress.exe` by threat actors. The likelihood of exploitation is increased given that many malicious actors leverage trusted utilities to obfuscate their activities, making it crucial to investigate these incidents promptly.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if the telemetry for process creation logs is not comprehensively captured across all systems, particularly if policies allow for the execution of local scripts. The detection assumes that necessary logging of process creation events is enabled and verbose enough to capture relevant command-line arguments. If logging levels are insufficient or trimmed, crucial details for accurate detection might be lost, limiting the effectiveness of this rule.

