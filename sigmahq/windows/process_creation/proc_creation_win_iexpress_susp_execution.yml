logsource:
  category: process_creation
  product: windows
detection:
    # VT Query: behavior_processes:"iexpress.exe" and behavior_processes:"/n /q /m" and behavior_processes:"*.sed*" and p:5+
  selection_img:
  - Image|endswith: '\iexpress.exe'
  - OriginalFileName: 'IEXPRESS.exe'
  selection_cli:
    CommandLine|contains|windash: ' /n '
  selection_paths:
    CommandLine|contains:
            # Note: Add more uncommon paths that fit your organizational needs.
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: all of selection_*
falsepositives:
- Administrators building packages using iexpress.exe
level: high
note: |
  ### Technical Context

  This rule detects the execution of `iexpress.exe` to create self-extracting packages using Self Extraction Directive (SED) files from potentially suspicious locations, such as `C:\ProgramData\` or `C:\Temp\`. These behaviors are commonly associated with adversaries aiming to deliver malware or create persistence mechanisms. This detection corresponds to the MITRE ATT&CK technique for "Packaging" (T1218) under the "Defense Evasion" tactic.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing process execution details and command-line arguments. The security impact could be significant if an attacker leverages these packages to deploy malicious payloads. However, this detection does NOT independently confirm malicious activity, as legitimate administrative tasks may trigger similar behavior.

  ### Investigation Steps

  - **Review process execution logs:** Check Security Event ID 4688 for `iexpress.exe`. Look for command lines containing `/n /q /m` and paths indicating execution from `C:\ProgramData\`, `C:\Temp\`, or other suspicious directories.

  - **Analyze command line arguments:** Identify if the arguments ` /n` are used in the creation of the package. Legitimate usage typically does not involve suspicious paths or extensions like `.sed`.

  - **Examine the SED file sources:** If available, gather details on the SED files being referenced, including their original paths. Cross-reference these with known good files or typical usage patterns systematically documented in your organization.

  - **Check for high-confidence malicious indicators:** Look for notable patterns in command line arguments combined with execution paths. Anomalies like `C:\Windows\Temp\some_random_path` or mimicry of common administrative paths may indicate malicious intent.

  - **Identify legitimate administrative usage:** Verify if any recent changes or tool usage align with internal IT or development processes where package creation is required; check logs for user IDs that typically interact with `iexpress.exe` for valid justification.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and the likelihood of malicious abuse associated with self-extracting packages. Given that this technique can effectively mask malicious deliveries, it's crucial to treat alerts as potential threats until verified otherwise.

  ### Blind Spots and Assumptions

  Detection may be limited by various evasion techniques, such as renaming `iexpress.exe` or executing from uncommon paths that may not be explicitly listed. Reliable detection requires complete logging of process creation events. Additionally, legitimate administrative activities, such as packaging software for deployment, may trigger this alert. A related detection to consider for strengthening coverage is monitoring for unusual PowerShell operations that might be coupled with package creations.

