note: |
  ### Technical Context

  This rule detects the misuse of the Windows command-line utility `sc.exe` to modify service permissions in a way that may conceal services from standard views, potentially facilitating persistent malicious activity on a system. Attackers aim to hide their malicious services to maintain a foothold and evade detection by security tools and personnel. The relevant MITRE ATT&CK technique is T1574.011: **Service DACL Abuse**.

  The primary telemetry source for this detection is Windows process creation logs, specifically capturing Event ID 4688 (process creation) along with relevant command line arguments used in the `sc.exe` command. If executed with elevated privileges, the modification of service permissions can lead to unmonitored runtime behavior on the system, significantly increasing the security impact if performed maliciously. Importantly, this detection does NOT confirm malicious intent on its own; it requires contextual analysis to determine if the activity is an authorized administrative action.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for instances of `sc.exe`. Focus on the `CommandLine` to identify usage of `sdset` with permissions string `DCLCWPDTSD`, indicating potential service abuse.

  - **Verify service status:** Use `Get-Service` PowerShell command or query system services in Event Viewer to identify newly added or modified services. Legitimate services typically have known names and descriptions, while hidden or modified services may not appear in standard service queries.

  - **Check for elevated privileges:** Look at Security Event ID 4672 (Special privileges assigned) to confirm if the command was executed by an account with administrative privileges. Confirm unauthorized accounts have not been used.

  - **Identify unusual service characteristics:** Examine the registry for the service under `HKLM\SYSTEM\CurrentControlSet\Services`. Note any created services that lack an associated executable path or are set to start automatically but are hidden.

  - **Cross-reference with threat intelligence:** Consult threat intelligence sources for known behavior or signatures associated with service abuse, especially in the context of recent incidents or malware campaigns.

  - **Assess host criticality:** Consider the role and criticality of the host device involved. If it manages sensitive data or critical infrastructure, immediate escalation may be warranted.

  ### Prioritization

  This alert is prioritized as high severity due to the potential for high-impact malicious behavior, particularly if it is targeting critical systems. The likelihood of adversaries weaponizing service DACL abuse is significant, especially in mature threat environments where evasion tactics are prevalent.

  ### Blind Spots and Assumptions

  Detection may be limited as some legitimate administrative tasks might trigger this alert, especially if conducted by system administrators. Ensure adequate logging policies are in place for both process creation and service modifications to facilitate detection. Common evasion techniques might include using alternate utilities or manipulating permissions in ways that do not trigger standard logging. A related detection to consider is the identification of unauthorized service creation or modification via generic service tampering rules.

