note: |
  ### Technical Context
  This detection rule identifies the use of the `sc.exe` utility to create a Windows service with specialized permissions that renders the service hidden and potentially unremovable. This behavior is indicative of attacker activity aimed at maintaining persistence and evading detection by making malicious services less visible to system administrators and security tools. Threat actors may exploit this technique to further their objectives, such as establishing a backdoor or ensuring that their malware remains operational even after system reboots or administrative cleanup efforts.

  Relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Persistence**: The technique of creating services that allow malware to execute upon system startup (T1543.003).
  - **Defense Evasion**: Techniques that involve obfuscating malicious activities to avoid detection (T1564).
  - **Privilege Escalation**: Activities that aim to gain elevated permissions (T1574.011), which is specifically highlighted in this rule due to the manipulation of service permissions.

  Primary data sources for detecting this activity include:
  - **Process Creation Logs**: These logs capture command-line arguments and executable processes on Windows systems, providing insight into the use of `sc.exe` and its command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Events**: Check for any instances of `sc.exe` with command-line arguments indicating modifications to service permissions, specifically looking for the use of `sdset` and unusual SDDL strings like 'DCLCWPDTSD'.

  - **Analyze Service Configuration**: Investigate the list of services on the affected system and examine their properties for discrepancies, particularly any services created or altered shortly before the detection.

  - **Correlate with User Activity**: Identify the user account that executed the `sc.exe` command. Look for any unusual login activity or administrative actions around the time of the service creation to establish context.

  - **Examine Related Artifacts**: Check system logs for other signs of compromise that may correlate with the service creation, such as unexpected process executions, active network connections, and other suspicious system modifications.

  ### Prioritization
  The alert should be treated with high urgency in an enterprise environment due to the potential impact of an attacker leveraging this technique to maintain undetected access and control over compromised systems, which can lead to further breaches or data exfiltration.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by systems not generating comprehensive process creation logs or configurations not being set up to capture command-line arguments. It is assumed that the presence of process creation logs is a consistent aspect of the environment; if these logs are unavailable or disabled, the detection will fail. Additionally, the logic assumes that the `sdset` command usage is unique or uncommon within the environment, which may lead to false positives if legitimate administration and service modifications are prevalent.

