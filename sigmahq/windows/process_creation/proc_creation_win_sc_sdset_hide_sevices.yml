note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows `sc.exe` utility, specifically when it is used to set a service's DACL (Discretionary Access Control List) in a way that hides the service from typical user access. The behavior observed typically indicates an attacker is attempting to establish persistence while making the service difficult to identify or remove, contributing to their operational security.

  The relevant MITRE ATT&CK techniques involved are **Persistence (T1547)** and **Privilege Escalation (T1548.002)**. The primary telemetry sources for this detection include Windows process creation logs (e.g., Security Event ID 4688 and Sysmon Event ID 1) that capture detailed command line argument information. If malicious, the security impact includes unauthorized access to critical services and the potential for prolonged undetected presence in the environment. However, this detection alone does not confirm malicious intent, as legitimate administrative actions may also utilize `sc.exe`.

  ### Investigation Steps

  - **Review the command line arguments:** Examine the command line details of the process creation logs for Event ID 4688 or Sysmon Event ID 1. Look for combinations of `sdset` with the DACL flags `DCLCWPDTSD`. Presence of these flags often indicates potentially malicious modifications.

  - **Identify the process creator:** Cross-reference the user account associated with the execution of `sc.exe`. Check for any accounts that lack administrative privileges or are associated with unusual behavior patterns in previous logs.

  - **Assess service visibility:** Use the `sc query` command to list services and observe if any newly created services are not visible. If a service does not appear where it should, combined with the command line findings, this could indicate malicious tampering.

  - **Analyze related audit logs:** Check for Security Event ID 5145 or 4656 logs related to DACL modifications on the service object. Successful modifications to sensitive service permissions are red flags.

  - **Investigate the host role and asset criticality:** Identify the machine's role (e.g., domain controller vs. workstation) to assess potential impact. Change in service states or configurations on critical infrastructure can have severe implications.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical service availability and the likelihood of abuse by adversaries to maintain persistence within the environment. The use of DACL manipulation and service hiding techniques is a known tactic among advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Detection may be limited by the absence or misconfiguration of audit logging for process creation and security changes. Legitimate administrative actions by helpdesk personnel or system administrators could trigger this alert if they use the `sc.exe` to change service settings. Companion detections that strengthen coverage include monitoring for **service creation and deletion events** (Event ID 7045) to capture changes in service status and configuration alterations.

