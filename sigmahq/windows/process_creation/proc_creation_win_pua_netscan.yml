note: |
  ### Technical Context

  This Sigma rule detects the execution of SoftPerfect's "netscan.exe", which is commonly used for network scanning. Attackers typically aim to enumerate network devices, assess service configurations, or identify potential attack vectors within a victim's environment. This behavior aligns with the MITRE ATT&CK tactic "Discovery" (ID: TA0007), specifically technique "Network Service Scanning" (ID: T1046).

  Primary telemetry sources include Windows process creation logs, such as Security Event ID 4688 and Sysmon Event ID 1, necessary for observing the execution of processes. If malicious, this behavior indicates an attacker’s reconnaissance phase to facilitate later stages of exploitation. However, this detection does not confirm intent or any subsequent malicious actions on its own.

  ---

  ### Investigation Steps

  - **Verify process execution details:** Review Security Event ID 4688 or Sysmon Event ID 1 for details on netscan.exe execution, focusing on fields like `NewProcessName`, `CommandLine`, and `ParentProcessId`. Look for suspicious ParentProcessId indicative of unusual execution patterns.

  - **Check for network activity:** Analyze related network logs (e.g., firewall logs, NetFlow data) for unusual outbound traffic, especially following the execution of netscan.exe. Check for IPs scanned or ports probed that may indicate interest in sensitive resources.

  - **Identify legitimate use cases:** Confirm whether netscan.exe execution correlates with known administrative activities. For example, check internal documentation or ticketing systems (e.g., ServiceNow) to verify if there’s an approved network scanning incident from IT or cybersecurity staff.

  - **Cross-reference installed applications:** Validate on the executing system whether SoftPerfect Network Scanner is installed and intended for use. This can be done via Windows Management Instrumentation (WMI) queries like `Get-WmiObject -Query "SELECT * FROM Win32_Product"` and checking in `Programs and Features`.

  - **Monitor subsequent commands:** Look for executed commands with Sysmon Event ID 1 following the execution of netscan.exe. Malicious activity may often follow a pattern of discovery followed by exploitation attempts.

  ---

  ### Prioritization

  The alert is of medium severity due to the potential for critical impact on network security if the activity is malicious. SoftPerfect's netscan.exe is often weaponized by threat actors during the reconnaissance phase, making its detection crucial to preemptively identifying malicious activities.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the fact that legitimate administrative tasks may trigger this alert, leading to potential false positives. Accurate detection relies on comprehensive logging configurations, particularly ensuring Sysmon and Windows security logs are enabled and correctly collect process creation events. Companions to this detection would include rules for lateral movement and exploitation attempts, providing better context around the activity observed.

