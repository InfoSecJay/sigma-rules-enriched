title: Suspicious Kernel Dump Using Dtrace
id: 7124aebe-4cd7-4ccb-8df0-6d6b93c96795
status: test
description: Detects suspicious way to dump the kernel on Windows systems using 
  dtrace.exe, which is available on Windows systems since Windows 10 19H1
references:
- https://twitter.com/0gtweet/status/1474899714290208777?s=12
- https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/dtrace
author: Florian Roth (Nextron Systems)
date: 2021-12-28
tags:
- attack.discovery
- attack.t1082
logsource:
  product: windows
  category: process_creation
detection:
  selection_plain:
    Image|endswith: '\dtrace.exe'
    CommandLine|contains: 'lkd(0)'
  selection_obfuscated:
    CommandLine|contains|all:
    - 'syscall:::return'
    - 'lkd('
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_dtrace_kernel_dump/info.yml
note: |
  ### Technical Context

  This rule detects the execution of `dtrace.exe`, specifically when used to dump the kernel memory on Windows systems, leveraging suspicious command line arguments indicative of potential reconnaissance or exploitation activities. Attackers may utilize kernel dumps to analyze the memory content, potentially extracting sensitive information such as credentials or security tokens.

  Relevant MITRE ATT&CK tactics include **Discovery** (T1082 - System Information Discovery), as the behavior entails probing the system for critical insights that can be exploited in further attacks. The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which log detailed information about created process instances. If malicious, such activities can lead to significant data exfiltration and unauthorized access.

  This detection does NOT establish malicious intent on its own, as legitimate debugging or system analysis processes may involve the use of `dtrace.exe` under certain conditions.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `dtrace.exe` running. Look specifically for command line parameters that include `lkd(0)` or `syscall:::return` which are indicative of potential misuse.

  - **Analyze the command line arguments**: Determine if the command line executed matches known patterns for malicious usage. Legitimate use cases may not include references to kernel manipulation or direct memory access.

  - **Cross-reference user account**: Identify the user account that executed `dtrace.exe`. Assess the context of this activity — a known administrator conducting a routine task may indicate benign intent, whereas execution by a low-privileged user could signal an attempt at evasion or exploitation.

  - **Review system context**: Assess the host’s role and criticality. If the process originated on a domain controller or high-value server, elevate the response protocol due to increased risk.

  - **Identify additional suspicious activities**: Check for related activities around the same time that could indicate an ongoing attack, such as abnormal network connections or unusual changes to system files and configurations that could indicate a larger compromise.

  ### Prioritization

  This alert is high severity due to the potential impact on system integrity and security. The use of `dtrace.exe` in this manner suggests advanced reconnaissance capabilities, often associated with targeted attacks, particularly against critical systems. This behavior is not widely weaponized but can be indicative of sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if `dtrace.exe` is not properly logged or if logs have been tampered with. Legitimate kernel debugging activities can trigger this alert, so context is critical in investigation. Ensure that the Windows Security logs and Sysmon configurations are optimized to capture process creation events to improve detection reliability. Related detections include anomalous accesses to key Windows system files or services that may further indicate potential kernel exploitation attempts.

