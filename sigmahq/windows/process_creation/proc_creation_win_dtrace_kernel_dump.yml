title: Suspicious Kernel Dump Using Dtrace
id: 7124aebe-4cd7-4ccb-8df0-6d6b93c96795
status: test
description: Detects suspicious way to dump the kernel on Windows systems using dtrace.exe,
  which is available on Windows systems since Windows 10 19H1
references:
- https://twitter.com/0gtweet/status/1474899714290208777?s=12
- https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/dtrace
author: Florian Roth (Nextron Systems)
date: 2021-12-28
tags:
- attack.discovery
- attack.t1082
logsource:
  product: windows
  category: process_creation
detection:
  selection_plain:
    Image|endswith: '\dtrace.exe'
    CommandLine|contains: 'lkd(0)'
  selection_obfuscated:
    CommandLine|contains|all:
    - 'syscall:::return'
    - 'lkd('
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_dtrace_kernel_dump/info.yml
note: |
  ### Technical Context
  This detection rule identifies suspicious instances of kernel dumping on Windows systems via the use of `dtrace.exe`, a tool introduced in Windows 10 starting with the 19H1 release. Kernel dumping can be a technique used by attackers to gather sensitive information from the operating system, including kernel-level information that may facilitate further exploitation. The primary objective of such actions typically revolves around extracting sensitive data, obtaining elevated privileges, or conducting research for subsequent actions within the environment.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007), as the primary goal is to ascertain system-level information. The specific techniques highlighted by this rule are **System Information Discovery** (T1082) and potentially **Kernel Debugging** which can be leveraged for malicious purposes. The main data source for this detection is Windows process creation events, which provide insight into commands executed on the system, along with the associated image and command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs from the process creation events to identify instances of `dtrace.exe` being invoked, specifically focusing on the command line arguments for suspicious patterns like `lkd(0)` and obfuscated calls.
  - **Check for Unsanctioned Tools:** Look for unauthorized versions of `dtrace.exe` or other debugging-related tools that may not align with your organization’s approved software list, which can indicate unauthorized usage.
  - **Correlate with User Activity:** Analyze user accounts and activity surrounding the execution of `dtrace.exe` to determine if the action aligns with standard operations, rule out legitimate use, and identify potential insider threats.
  - **Monitor System and Network Activity:** Investigate the broader system behavior following the detected kernel dump to observe any network traffic or processes that might correlate with data exfiltration or further exploitation attempts.

  ### Prioritization
  The severity of this alert is classified as high given that kernel dumping can expose critical system information and serve as a foothold for attackers aiming to escalate privileges or compromise the integrity of systems within an enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic assumes that the use of `dtrace.exe` is unnecessary for standard operations within the environment, which may lead to gaps in detecting other kernel dumping techniques not explicitly using this tool. Additionally, the effectiveness of this alert depends on the availability and integrity of process creation logs, which must be configured correctly to capture all relevant data. If process creation logging is insufficiently configured or disabled, this rule may fail to trigger.

