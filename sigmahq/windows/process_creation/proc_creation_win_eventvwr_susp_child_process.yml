detection:
  selection:
    ParentImage|endswith: '\eventvwr.exe'
  filter_main_generic:
    Image|endswith:
    - ':\Windows\System32\mmc.exe'
    - ':\Windows\System32\WerFault.exe'
    - ':\Windows\SysWOW64\WerFault.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies potentially suspicious child processes spawned by "eventvwr.exe," which is commonly exploited in attacks to bypass User Account Control (UAC). The likely attacker objective is to execute unauthorized commands with elevated privileges through a method known as registry hijacking, which could lead to privilege escalation. This action maps to the MITRE ATT&CK technique "T1548.002: Abuse Elevation Control Mechanism - Bypass User Account Control."

  The primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688, Sysmon Event ID 1, or Windows Event Collector logs that detail process hierarchies. If malicious, this behavior can lead to unauthorized access and control over system resources, compromising the integrity of sensitive data. Importantly, while this detection signals potentially suspicious activity, it does NOT confirm that an actual attack has occurred without further context and evidence.

  ### Investigation Steps

  - **Review parent and child processes:** Examine logs for Event ID 4688 where ParentImage is indicative of "eventvwr.exe." Note the ChildImage field; unexpected child processes such as malicious executables or scripts indicate potential exploitation.

  - **Check for legitimate use of `eventvwr.exe`:** Investigate whether normal administrative processes were active around the event time, such as system troubleshooting or updates, which can justify the presence of typical child processes like "mmc.exe" or "WerFault.exe."

  - **Compare against known good baselines:** Validate the observed process lineage against baseline logs from similar systems or normal operational profiles to identify deviations indicating unusual activity.

  - **Identify high-confidence malicious indicators:** Look specifically for any child process that ends with unexpected filenames or located in non-standard directories (e.g., temporary folders) spawned from "eventvwr.exe." Such cases may indicate malicious intent.

  - **Cross-reference with user actions:** Investigate user activities leading up to the alert. Legitimate users may perform system checks, while abnormal access or execution times (e.g., after hours) could suggest unauthorized use.

  - **Search for signs of registry tampering:** If applicable, check for modifications in the registry paths associated with UAC settings (e.g., `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System`) that could indicate prior preparatory steps for the detected behavior.

  ### Prioritization

  This alert is considered high-severity due to its potential to indicate privilege escalation attempts, which can compromise highly critical systems and sensitive data. The likelihood of malicious abuse is heightened, as bypassing UAC is a known technique employed by various adversaries. Such behavior is often weaponized in targeted attacks, requiring immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if process creation logging is not enabled or if Windows Event Logs are improperly configured. Legitimate activities, such as administrative tasks that involve troubleshooting or system monitoring using "eventvwr.exe," may inadvertently trigger this alert. A related detection that strengthens overall coverage includes monitoring for other process creation anomalies, such as unexpected parent-child relationships, for instance, parent processes like "powershell.exe" or "cmd.exe" invoking suspicious child processes.

