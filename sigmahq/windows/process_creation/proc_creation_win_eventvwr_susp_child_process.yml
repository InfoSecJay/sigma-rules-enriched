note: |
  ### Technical Context
  This detection rule identifies potentially malicious child processes spawned from "eventvwr.exe", the Windows Event Viewer application. Attackers may exploit Windows Event Viewer as a means to bypass User Account Control (UAC) and escalate privileges through techniques that allow for injection into the Event Viewer process. By manipulating legitimate system processes, attackers hope to run their payloads with elevated privileges, making it critical for defenders to recognize these attempts early.

  The relevant MITRE ATT&CK tactics for this behavior include:
  - **Defense Evasion (T1562)**: This technique includes bypassing security controls, such as UAC.
  - **Privilege Escalation (T1548.002)**: The detection also relates to UAC bypass methods, especially through unprivileged processes launching privileged commands.

  Primary data sources for this detection include:
  - **Process creation events**: These logs will contain details of the parent-child relationships between processes and are essential for identifying suspicious activity linked to "eventvwr.exe".

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for process creation events where "eventvwr.exe" is the parent process. This will help in identifying all child processes initiated from it.
  - **Identify Suspicious Child Processes**: Focus on child processes that do not belong to the expected list (e.g., 'mmc.exe', 'WerFault.exe'). Look for any unusual executable names or paths.
  - **Cross-Reference with Known Threats**: Use threat intelligence to match identified child processes against known malicious activity, especially those related to UAC bypass methods.
  - **Analyze Account Activity**: Check the user account that initiated the event. If it’s an unusual or low-privilege account, correlate this with the identified child processes for further investigation.

  ### Prioritization
  The alert is considered high severity due to the potential for privilege escalation through UAC bypass methods. If successful, such attacks may lead to full compromise of user accounts and sensitive system functions, posing a serious risk to enterprise security.

  ### Blind Spots and Assumptions
  There may be gaps in detection if logging for process creation events is not enabled or is configured incorrectly. The detection is predicated on the assumption that "eventvwr.exe" will spawn child processes, which may not always be the case in legitimate usage. Additionally, the effectiveness relies on having visibility into all spawn processes and their typical behaviors. Required configurations include ensuring comprehensive Windows process monitoring and an appropriate retention policy for logs.

