note: |
  ### Technical Context

  This detection identifies uncommon or suspicious child processes spawned by "eventvwr.exe", typically associated with attempts to bypass User Account Control (UAC). The likely attacker objective is to execute malicious code with elevated privileges while avoiding detection. This behavior is mapped to the MITRE ATT&CK technique "Bypass User Account Control" (T1548.002). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1.

  If malicious, this activity may indicate exploitation of system vulnerabilities or unauthorized privilege escalation. It is important to note that this detection alone does not confirm malicious intent; further context and investigation are required to determine if the behavior is legitimate or a potential UAC bypass attempt.

  ### Investigation Steps

  - **Verify child processes of eventvwr.exe:** Review Security Event ID 4688 logs for process creation records where the ParentImage ends with `eventvwr.exe`. Look specifically for child processes that are not in the exclusion list (e.g., mmc.exe, WerFault.exe).

  - **Identify expected behavior:** Confirm that legitimate uses of "eventvwr.exe" occur when opening the Event Viewer under normal user activities, checking against other process creation logs to validate common parent-child relationships.

  - **Check for high-confidence malicious indicators:** Look for any suspicious child process names or paths that may indicate exploitation attempts (e.g., powershell.exe, command.exe). Focus on instances where these processes appear without legitimate context following an eventvwr.exe invocation.

  - **Investigate system privacy and review:** Scrutinize the Windows registry for recent changes related to UAC. Look for suspicious modifications or newly created keys in relevant areas, specifically around the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System` path.

  - **Analyze the timestamp and user context:** Cross-reference the timestamps in Event IDs with user login logs from the Windows Security Logs (Event ID 4624) to assess if the process was initiated by an authorized user during a legitimate session.

  - **Review asset criticality:** Assess the role of the affected host. Servers running critical applications may indicate higher risk if exploited through UAC bypass techniques, amplifying the severity of the alert.

  ### Prioritization

  This alert is high severity due to the potential impact of UAC bypass attempts, which can lead to privilege escalation. Malicious actors often deploy this technique to gain elevated access without detection, making it a common vector for exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate processes disguising themselves as benign child processes or unmonitored registry changes. Reliable detection hinges on capturing the necessary logs, particularly ensuring Sysmon is properly configured. Legitimate operations like administrative tasks performed by IT staff may trigger this alert, particularly if they involve the use of eventvwr.exe. A related detection to strengthen coverage could involve monitoring process modifications around User Account Control settings in the registry.

