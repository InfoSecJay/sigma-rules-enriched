note: |
  ### Technical Context

  This detection rule identifies the use of the Right-to-Left Override (RTLO) character (Unicode U+202E) within command-line inputs. Attackers leverage this character to manipulate the display of file names, tricking users into executing harmful files that may appear benign. This behavior fits into the MITRE ATT&CK framework under the tactic of **Defense Evasion** and the technique **Obfuscated Files or Information (T1027.002)**.

  The primary telemetry source is process creation logs from Windows (Event ID 4688 or Sysmon Event ID 1), which will indicate the command lines used to spawn processes. If this activity is confirmed malicious, it could lead to unauthorized access or execution of malware. Importantly, the detection does not confirm an active compromise by itself; further analysis is necessary to confirm intent and impact.

  ### Investigation Steps

  - **Check command line details:**
    Review command line arguments for instances of `\u202e` or related representations in Event ID 4688 logs (Windows Security logs) or Sysmon Event ID 1. Malicious indicators often include unusual file types (e.g., `.exe`, `.scr`) disguised by obfuscation.

  - **Analyze process parent/child relationships:**
    Seek out the process tree stemming from suspicious parent processes. Use Sysmon Event ID 10 (Process Access) to trace execution paths and establish context on how the suspicious command was initiated, identifying potential prior infection vectors.

  - **Validate against legitimate use cases:**
    Identify any occurrences where the RTLO character is used legitimately. For example, certain scripts, especially those dealing with non-Latin scripts or documentation, may use this character legitimately without malicious intent.

  - **Investigate network activity:**
    Examine network logs for outgoing connections (e.g., DNS queries) initiated by processes with the RTLO character in their command line. Use logs from solutions like Windows Firewall or proxy logs to pinpoint if any connections correspond to known malicious domains or IPs.

  - **Review user behavior:**
    Gather contextual information from logs to assess the user’s activity around the alert. Investigate if users have been executing known benign scripts that utilize right-to-left characters, as false positives can occur.

  - **Correlate with file system changes:**
    Check for file creations or modifications around the time the alert was triggered using Sysmon Event ID 11 (FileCreate) to see if any obfuscated filenames were created or accessed, which could indicate malware execution.

  ### Prioritization

  This alert is considered high severity due to the potential for immediate and significant impact from successfully executed malicious files. The likelihood of exploitation is notable, as RTLO is a recognized tactic for obfuscating malicious activity in enterprise environments. Given historical usage in phishing and file deception, this behavior is often weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of benign uses of the RTLO character, particularly in legitimate communications or documentation in non-Latin scripts, which could lead to false positives. This detection relies heavily on adequately configured logging from Windows and Sysmon; incomplete log data may hinder detection. A companion detection that strengthens coverage could involve monitoring for abnormal parent-child process relationships that lead to unusual outbound network connections.

