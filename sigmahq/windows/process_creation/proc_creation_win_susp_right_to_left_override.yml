note: |
  ### Technical Context

  This rule detects the use of the Right-to-Left Override (RTLO) character (Unicode U+202E) within command lines associated with process creation. The use of RTLO can help adversaries obfuscate file names or commands, tricking users into executing harmful actions. The likely attacker objective is to bypass user scrutiny, making malicious files or commands appear innocuous.

  Relevant MITRE ATT&CK tactics include Defense Evasion (T1203) and Obfuscated Files or Information (T1036.002). Primary telemetry sources include Windows security logs, specifically focused on process creation events (Event ID 4688) that capture command-line arguments. If malicious, this behavior could lead to executable files being run that result in data theft, system compromise, or further malicious activity. This detection does NOT confirm malicious intent or execution on its own; benign uses of the RTLO character do exist.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 logs for process creation. Look for command lines containing the U+202E character or its representations ('\u202e', '[U+202E]', '‮').
  - **Identify malicious executions**: Correlate flagged command lines with known malicious software or ISO files for a high-confidence indicator of compromise. Check against threat intelligence sources for known RTLO attacks.
  - **Evaluate legitimate usage**: Understand context around similar command lines from internal processes. If command lines are part of legitimate operations (e.g., software related to Arabic or Hebrew text processing), document them as benign.
  - **Review asset criticality**: Investigate the affected system’s role within the organization (e.g., domain controller, file server) to assess the impact of potential compromise. Higher criticality systems should be prioritized for deeper inspection.
  - **Validate user access and permissions**: Check the user account associated with the process creation. Unusual accounts or lack of proper permissions when executing such commands could indicate malicious activity.
  - **Examine file creation or download artifacts**: If applicable, validate if a file associated with the RTLO has been created or downloaded suspiciously. Look for unexpected file types or suspicious locations (e.g., temp folders).

  ### Prioritization

  This alert is considered high severity due to the potential for significant impact if an attacker successfully executes obfuscated commands on critical systems. The likelihood of malicious use is notable, as RTLO techniques are increasingly weaponized in phishing and malware distribution campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that do not log all process creation events or where logging is not configured properly. Legitimate applications, particularly those used in multilingual contexts, may trigger these alerts inadvertently. Related detections, such as those identifying unusual process execution patterns or file creation in sensitive directories, can enhance coverage and understanding of potential threats.

