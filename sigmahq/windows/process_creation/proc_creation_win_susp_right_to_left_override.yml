note: |
  ### Technical Context

  This Sigma rule detects the presence of the Right-to-Left Override (RTLO) character (U+202E) in command-line inputs, which is often used by adversaries to obfuscate commands or filenames. The likely attacker objective is to bypass security controls and mislead users or security systems by displaying malicious commands as benign. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1036.002).

  The primary telemetry source is process creation logs (Event ID 4688) on Windows systems, capturing command-line arguments. If malicious, this behavior may indicate attempts to execute hidden or misleading commands to facilitate further compromise or exploitation. Importantly, the detection of this character does not confirm malicious activity on its own, as legitimate scripts or commands in specific contexts may also use this character.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for command-line arguments containing '\u202e' or '[U+202E]'. Identify processes that use this character, as these may indicate attempted obfuscation by an attacker.

  - **Investigate parent processes:** Identify the parent process of any detected command using the RTLO character. Malicious usage often stems from suspicious or known malicious processes. Check Event ID 4688 for the parent process ID (PID) and details.

  - **Analyze command legitimacy:** Determine if the command containing the RTLO character correlates with typical behavior for applications on the affected system. Legitimate applications like text editors may use right-to-left text, arguably justifying such strings in benign environments.

  - **Identify known malicious indicators:** Cross-reference detected command-line entries with threat intelligence to identify if the command has previously been associated with known attack campaigns or methodologies that use RTLO for obfuscation.

  - **Assess affected host roles:** Review the criticality and role of the host where the rule was triggered. Workstations may have different acceptable behaviors compared to servers, and administrative or sensitive systems warrant higher scrutiny.

  - **Validate for lateral movement indicators:** Assess for any file artifacts related to the detected commands, such as temporary files created or modified, which may indicate further attempts at lateral movement or data exfiltration.

  ### Prioritization

  The alert severity is high due to the potential for significant security impact stemming from the ability of attackers to disguise malicious activity. The likelihood of this behavior being abused in a real attack scenario is considerable, as the RTLO character is a known evasion technique. Given the maturity of such tactics, organizations should proactively investigate these alerts.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate applications frequently utilize the RTLO character, leading to potential false positives. Reliable detection hinges on correctly monitoring process creation logs with full command-line details enabled. Notably, benign use cases might include localized applications for right-to-left languages, thus necessitating context consideration. Related detections such as direct command obfuscation techniques (e.g., cmdlet obfuscation) should enhance overall coverage against similar evasion strategies.

