logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|re:
    - 'ipconfig\s+/all'
    - 'netsh\s+interface show interface'
    - 'arp\s+-a'
    - 'nbtstat\s+-n'
    - 'net\s+config'
    - 'route\s+print'
  condition: selection
falsepositives:
- Administrator, hotline ask to user
level: low
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious commands related to network configuration discovery on Windows systems. Adversaries often automate the gathering of system and network details such as IP addresses, interfaces, and routing tables as part of their reconnaissance phase. The execution of commands like `ipconfig /all`, `netsh interface show interface`, and others might indicate that an attacker is probing for information that can aid in crafting further attacks or in lateral movement within a network.

  The threat scenario suggests that an attacker may be exploiting access to a valid user account or system. Their objective could range from gathering information to identifying potential targets for post-exploitation actions. This behavior falls under the MITRE ATT&CK technique for **Network Service Discovery (T1016)**, which encompasses various methods adversaries use to discover information about network configurations.

  The primary data sources relevant for this detection include **process creation events** on Windows systems, which log command line inputs and can reveal what commands are being executed. Monitoring these logs effectively provides insight into potentially unauthorized querying of network configurations.

  ### Investigation Steps
  - **Review Process Creation Events**: Collect data from process creation logs that capture command activity on Windows. Look specifically for the commands listed in the detection logic to understand the context in which they were executed.

  - **Check User Context**: Identify the user account associated with the command execution. Determine if this account is legitimate and has appropriate permissions for executing network configuration commands.

  - **Investigate Network Traffic**: Analyze network traffic logs for unusual connections or patterns coinciding with the execution of the suspicious commands. This might provide context on the attacker's intentions or subsequent actions.

  - **Assess System Compromise**: Verify the integrity of the affected system. Check for indicators of compromise (IoCs) and evaluate if there are other signs of unauthorized access or lateral movement in the environment.

  ### Prioritization
  The alert is categorized as low severity because while it indicates possible reconnaissance activity, it may also be generated by legitimate administrative tasks. However, frequent occurrences or patterns linked to privileged accounts should be prioritized for further investigation due to their potential implications.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the execution of these commands via scripts or tools that may not record them in process creation logs, leading to missed detection of automated behavior. The detection logic assumes that the process creation events are adequately logged and that the command lines adhere strictly to the specified patterns. Ensuring that appropriate logging configurations are in place for Windows systems is essential for the effective functioning of this alert.

