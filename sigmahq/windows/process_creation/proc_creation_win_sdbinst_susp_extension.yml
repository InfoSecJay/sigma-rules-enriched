detection:
  selection:
  - Image|endswith: '\sdbinst.exe'
  - OriginalFileName: 'sdbinst.exe'
  filter_main_legit_ext:
    CommandLine|contains: '.sdb'
  filter_main_legit_extensions:
        # ParentImage|endswith: ':\Windows\System32\svchost.exe'
  - CommandLine|endswith:
    - ' -c'
    - ' -f'
    - ' -mm'
    - ' -t'
  - CommandLine|contains: ' -m -bg'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of shim databases using the `sdbinst.exe` utility, specifically when the command line arguments suggest the use of uncommon extensions. This behavior is indicative of an adversary attempting to establish persistence or escalate privileges by leveraging application shims, enabling execution of malicious payloads under the guise of legitimate application operations.

  This activity is aligned with the MITRE ATT&CK tactic of **Persistence** and the technique of **Application Layer Persistence (T1546.011)**. The primary telemetry source is Windows process creation logs, particularly focusing on the details captured during the execution of `sdbinst.exe`. If malicious, such actions can allow attackers to maintain a foothold in the environment, potentially leading to further compromise of the system. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of shims can also occur.

  ### Investigation Steps

  - **Review the command line used for execution:** Check for events with **Security Event ID 4688** for processes related to `sdbinst.exe`. Look for command lines that contain ".sdb" but do not match any of the legitimate command patterns (e.g., `-c`, `-f`, `-mm`, `-t`, `-m -bg`). Benign examples should follow typical application deployment patterns without unusual flags.

  - **Analyze the parent process:** Identify the parent process of the detected `sdbinst.exe` execution. Use **Sysmon Event ID 1** to understand the context. If the parent is an unexpected or suspicious process that deviates from normal application behaviors, it raises concerns of potential malicious activity.

  - **Check the file creation logs:** Examine **Windows Event ID 4663** logs for any creation events of new shim database files (with the .sdb extension) in directories like `C:\Windows\Installer`. Validate whether these new files were authored by trusted processes or if they have a suspicious origin.

  - **Correlate user account activity:** Assess the user context under which `sdbinst.exe` was executed. Users involved in the activity should match legitimate deployment scenarios. Unexpected users or service accounts executing this process might indicate a breach or misuse.

  - **Validate against known good processes:** Compare the identified command line against established baselines for software installations. Normal installations do not typically interact with `sdbinst.exe` under unusual command flags related to uncommon `.sdb` extensions.

  - **Investigate related detections:** Monitor for associated activities leveraging shims post-installation indicated by persistence techniques. For instance, check for any anomalous behavior in logs pertaining to the execution of processes indicating exploitation via shims.

  ### Prioritization

  The alert should be considered medium severity. The use of `sdbinst.exe` for shim installation, especially with uncommon extensions, poses a risk of both privilege escalation and persistence if exploited. While this behavior is not as common as typical process executions, it is weaponized and can be used by sophisticated actors to maintain a presence within enterprise systems.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the presence of benign shim database installations that are standard practice in some software deployments. Ensure event logging is configured correctly, particularly for process creation and object access (4688 and 4663 events). Legitimate software installations or updates could also trigger this alert, highlighting the need for contextual analysis. A related detection could involve monitoring for unusual file activity or execution of scripts that trigger shims, enhancing alert validation and coverage against persistence mechanisms.

