detection:
  selection:
  - Image|endswith: '\sdbinst.exe'
  - OriginalFileName: 'sdbinst.exe'
  filter_main_legit_ext:
    CommandLine|contains: '.sdb'
  filter_main_legit_extensions:
        # ParentImage|endswith: ':\Windows\System32\svchost.exe'
  - CommandLine|endswith:
    - ' -c'
    - ' -f'
    - ' -mm'
    - ' -t'
  - CommandLine|contains: ' -m -bg'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the installation of potentially suspicious shim databases via the execution of `sdbinst.exe` with uncommon extensions, particularly `.sdb`. Attackers may use this method to establish persistence or escalate privileges through the execution of malicious content associated with application shims. The relevant MITRE ATT&CK tactics are "Persistence" and "Privilege Escalation," specifically the technique T1546.011. The primary telemetry sources include Windows process creation logs (Event ID 4688) that capture command-line parameters and the original file name of executed processes. If the activity is malicious, it could lead to unauthorized persistence, privilege escalation, or execution of additional malware. This detection does NOT confirm that the behavior is malicious by itself; further investigation is required.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `sdbinst.exe`. Check the `CommandLine` field for `.sdb` extensions, indicating potential use for shim installation.

  - **Identify legitimate usage patterns**: Investigate the context of `sdbinst.exe` usage documented in your environment. Common legitimate command lines include `sdbinst.exe -c` or `sdbinst.exe -f`. Compare these against identified alerts to validate benign versus suspicious activities.

  - **Analyze parent process relationships**: Check the `ParentImage` field to determine if `sdbinst.exe` was spawned from a known legitimate process, such as `C:\Windows\System32\svchost.exe`. Any unusual parent processes may indicate malicious behavior.

  - **Look for unusual extensions**: Search for newly created shim database files with uncommon extensions outside expected behavior (e.g., `.sdb`). Validate their `CreationTime` and `LastModifiedTime` against other activity to identify anomalies.

  - **Correlate with known vulnerabilities**: Review any systems affected by this alert against active vulnerability databases for misconfigured or unpatched status. An elevated privileges exploit may often involve shim installations to persist across reboots.

  - **Check for exfiltration or file staging**: Look for file creation events in local or network shares related to newly created shim databases. Investigate whether these files are being copied to unauthorized locations or associated with unusual network traffic.

  ---

  ### Prioritization

  This alert has a medium severity level. If confirmed as malicious, it may impact high-value assets by establishing persistence or facilitating privilege escalation. The likelihood of abuse is significant, especially in environments where adversaries frequently target user privilege elevation.

  ---

  ### Blind Spots and Assumptions

  This detection may miss legitimate applications that use `sdbinst.exe` for valid purposes or those that employ alternative persistence mechanisms. Proper log configuration for capturing detailed process command lines is essential for reliable detection. Additionally, common benign software installations could inadvertently trigger this alert. A related detection to consider is monitoring for abnormal registry modifications that indicate persistence methods outside of shim installations.

