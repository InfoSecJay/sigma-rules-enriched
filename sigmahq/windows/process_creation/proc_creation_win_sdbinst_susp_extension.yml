title: Uncommon Extension Shim Database Installation Via Sdbinst.EXE
id: 18ee686c-38a3-4f65-9f44-48a077141f42
related:
- id: 517490a7-115a-48c6-8862-1a481504d5a8
  type: derived
status: test
description: |
  Detects installation of a potentially suspicious new shim with an uncommon extension using sdbinst.exe.
  Adversaries may establish persistence and/or elevate privileges by executing malicious content triggered by application shims
references:
- https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
- https://github.com/nasbench/Misc-Research/blob/8ee690e43a379cbce8c9d61107442c36bd9be3d3/Other/Undocumented-Flags-Sdbinst.md
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-01
modified: 2024-01-10
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\sdbinst.exe'
  - OriginalFileName: 'sdbinst.exe'
  filter_main_legit_ext:
    CommandLine|contains: '.sdb'
  filter_main_legit_extensions:
        # ParentImage|endswith: ':\Windows\System32\svchost.exe'
  - CommandLine|endswith:
    - ' -c'
    - ' -f'
    - ' -mm'
    - ' -t'
  - CommandLine|contains: ' -m -bg'
  filter_main_null:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the Windows system tool `sdbinst.exe` is used to install an uncommon extension shim, which could be indicative of potential malicious activity. The specific focus on uncommon extensions suggests that an adversary could be attempting to leverage application shims to establish persistence, execute hidden or malicious code, or escalate privileges. Attackers often exploit shim databases as a method to bypass security controls and run malicious payloads under the guise of legitimate applications.

  The relevant MITRE ATT&CK tactics for this behavior include **Persistence** (TA0003) and **Privilege Escalation** (TA0004). The specific technique often associated with this behavior is **Application Layer Protocol** (T1546.011), where adversaries manipulate application behaviors to maintain their foothold within an environment. Data sources suitable for supporting evidence collection include process creation logs that capture command line arguments and the images being executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation logs to identify instances of `sdbinst.exe` being invoked, focusing on command line parameters that may indicate suspicious activity.

  - **Analyze Command Line Arguments**: Look for command line arguments passed to `sdbinst.exe`. Pay particular attention to flags and extensions that are uncommon or absent in standard operational usage, especially `.sdb` extensions that do not have legitimate justification.

  - **Correlate with Application Behavior**: Check if any applications or processes that are invoked post-`sdbinst.exe` execution exhibit unusual or malicious behavior. Monitor for unexpected behaviors that could indicate exploitation.

  - **Inspect for Additional Artifacts**: Collect and analyze shim databases that were recently created or modified. Check for any outbound or suspicious connections made by newly shimmed applications that could indicate further compromise.

  ### Prioritization
  Alerts related to uncommon shim database installations should be prioritized as **medium severity** due to their potential implications for persistence and privilege escalation. This type of behavior signifies a calculated evasion and exploitation effort by adversaries, requiring immediate attention to assess the scope and potential impact on the environment.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate usage of `sdbinst.exe` by authorized applications, which could lead to false positives. The detection logic assumes that the command line arguments will deviate from typical patterns when malicious activity is occurring. Furthermore, this rule relies on the capability of the logging configuration to capture detailed process creation events; if this logging is not enabled or properly configured, the detection may miss critical instances of abuse.

