level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to bypass User Account Control (UAC) via the `ICMLuaUtil` elevated COM interface. The behavior likely indicates an attacker aiming to escalate privileges and execute malicious code with increased permissions on a compromised system. This aligns with the MITRE ATT&CK technique for bypassing UAC, specifically T1548.002 (Exploitation for Client Execution – UAC Bypass).

  The primary telemetry source for this rule is process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If successful, this type of behavior could allow an adversary full access to system resources, enabling further exploitation or lateral movement. Importantly, while this rule identifies suspicious activity, it does not confirm that a malicious action has successfully occurred on its own.

  ### Investigation Steps

  - **Review process creation logs**: Look for Security Event ID 4688 and Sysmon Event ID 1 related to the command line involving `dllhost.exe` and the specified process IDs. Evaluate the command line parameters for anomalies.

  - **Identify legitimate UAC bypass scenarios**: Determine if expected applications or system updates utilize `WerFault.exe`. Common legitimate uses include error reporting mechanisms that trigger under user action.

  - **Check for unusual parent-child relationships**: Examine process trees and ensure that parent processes align with known system applications. Investigate any instances where `dllhost.exe` may spawn `WerFault.exe` unexpectedly.

  - **Evaluate the command line for red flags**: A command line containing `/Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}` or `/Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}` is highly indicative of malicious activity. Correlate this with other system activities around the same timestamp.

  - **Correlate with user activities**: Validate whether the process execution coincides with user actions or scheduled tasks. Legitimate activity should align with known workflows and user behavior patterns.

  ### Prioritization

  Given the potential impact of privilege escalation on critical systems, this alert should be prioritized as high. The likelihood of malicious abuse is significant since UAC bypass techniques are frequently weaponized in advanced attacks, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection is limited as attackers may employ techniques to obfuscate their activities, such as manipulating command line parameters or using code injection instead of direct process creation observed here. Reliable detection requires comprehensive logging from all relevant telemetry sources, ensuring that no logs are disabled. Common legitimate applications that routinely bypass UAC may trigger this alert, highlighting the need for context. Additional detection strategies for lateral movement (e.g., T1075 - Pass the Hash) can provide complementary coverage for related activities.

