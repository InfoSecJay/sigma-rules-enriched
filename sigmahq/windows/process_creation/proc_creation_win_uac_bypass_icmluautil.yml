logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\dllhost.exe'
    ParentCommandLine|contains:
    - '/Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}'
    - '/Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}'
  filter:
  - Image|endswith: '\WerFault.exe'
  - OriginalFileName: 'WerFault.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to bypass User Account Control (UAC) using the `ICMLuaUtil` Elevated Component Object Model (COM) interface. The behavior is typically leveraged by an attacker to gain higher privileges on a system without user consent. This activity aligns with the MITRE ATT&CK tactic of **Privilege Escalation (TA0004)** and the specific technique of **UAC Bypass via COM (T1548.002)**.

  The primary telemetry comes from Windows process creation logs, specifically focusing on the `dllhost.exe` parent image and associated command-line parameters. If malicious, this action allows unauthorized elevation of privileges, potentially leading to full system compromise. It's important to note that this detection does not confirm an actual successful privilege escalation, only the attempt to bypass UAC.

  ### Investigation Steps

  - **Identify the parent process details:** Review process creation logs for Event ID 4688 or Sysmon Event ID 1 where the `ParentImage` ends with `dllhost.exe`. Confirm that the command line contains either `/Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}` or `/Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}` to validate the behavior aligned with the rule.

  - **Check for legitimacy of `WerFault.exe`:** Review occurrences of `WerFault.exe` within Event ID 4688, focusing on the specific `OriginalFileName`. Confirm that this instance is not used frequently in normal operations on the affected machine, as legitimate usage is typically less frequent.

  - **Validate process relationships:** Use Sysinternals tools (e.g., Process Explorer) to audit parent-child relationships surrounding the detected process, ensuring that no other malicious processes are spawned by `dllhost.exe`.

  - **Examine user context for execution:** Look for the user account associated with the process creation logs to determine if the execution context aligns with legitimate administrative use or is suspiciously elevated.

  - **Monitor for additional indicators of compromise:** Search for additional logs that indicate privilege escalation techniques (e.g., Event ID 4672 - Special privileges assigned to new logon) that may corroborate this detection.

  ### Prioritization

  This alert is of **high severity** due to the significant risk of privilege escalation on a system, which could lead to a broader compromise within the enterprise. Given the method's common usage in attacks, immediate investigation is necessary to mitigate potential threats.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of benign `dllhost.exe` activity to mask malicious attempts to bypass UAC, as well as potential logging misconfigurations leading to missed detections. Ensure that Windows Process Creation and Sysmon logs are enabled and capturing detailed command-line arguments. The `werfault.exe` process may also appear during legitimate error reporting, necessitating further context to differentiate between benign and malicious instances. A related detection for monitoring privileged command executions can reinforce coverage against complete privilege escalation attempts.

