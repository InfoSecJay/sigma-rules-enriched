logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\dllhost.exe'
    ParentCommandLine|contains:
    - '/Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}'
    - '/Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}'
  filter:
  - Image|endswith: '\WerFault.exe'
  - OriginalFileName: 'WerFault.exe'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects attempts to bypass User Account Control (UAC) through a specific COM interface associated with the **ICMLuaUtil**. The technique typically involves exploiting the **dllhost.exe** process to elevate privileges without triggering UAC prompts, allowing an attacker to run malicious code with higher permissions. The likely objective for attackers using this method is to gain unauthorized access to system resources or execute malicious payloads stealthily.

  The relevant MITRE ATT&CK techniques associated with this detection include **T1548.002 - UsofElevatedPrivileges** under the tactics of **Defense Evasion** and **Privilege Escalation**. This underscores the potential severity of the detected behavior as it indicates an attempt to gain elevated privileges, which can lead to broader system compromise if successful.

  Primary data sources for this detection include:
  - **Process creation events** that record when and how new processes are initiated in the Windows environment.
  - **Windows Security logs** that might help in understanding the context of the process execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances where `dllhost.exe` is the parent process of `WerFault.exe`, particularly with command lines containing specific process IDs indicative of UAC bypass attempts.

  - **Analyze Parent Process Context**: Investigate the context in which the parent process was invoked. Look for unusual or suspicious command-line arguments that could indicate an unauthorized privilege escalation.

  - **Correlate with Security Events**: Cross-reference with security events from Windows logs to identify any prior security events that may suggest reconnaissance or exploitation activity before the UAC bypass.

  - **Utilize EDR Tools**: If available, leverage Endpoint Detection and Response (EDR) tools to analyze process trees and historical activity surrounding the identified instances. This can help uncover further malicious behavior linked to the suspected UAC bypass.

  ### Prioritization
  This alert warrants a high priority in an enterprise environment due to its potential impact on system integrity and the likelihood of exploitation. Successful UAC bypass can lead to significant privilege escalation, enabling attackers to execute further malicious activities with elevated permissions.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for variations of UAC bypass techniques that do not utilize the specific COM interface or process chain defined in this rule. The detection logic assumes that `dllhost.exe` will consistently be the parent process for such bypass attempts. It also relies on the availability of detailed process creation logs; if logging levels are insufficient, the rule may not trigger. Organizations must ensure that logging for process creation is enabled at the requisite level to capture these events effectively.

