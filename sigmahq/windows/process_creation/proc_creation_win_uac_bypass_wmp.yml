note: |
  ### Technical Context

  This Sigma rule detects the execution of a UAC (User Account Control) bypass through Windows Media Player's `osk.exe`, leveraging the `osksupport.dll` to escalate privileges without user consent. The likely attacker objective is to gain elevated privileges on a Windows system, enabling further exploitation or lateral movement within a network. This behavior maps to the MITRE ATT&CK technique "Bypass User Account Control" (T1548.002).

  The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, focusing on process creation details and parent-child relationships. If malicious, this can lead to unauthorized actions being conducted at a high privilege level, compromising the integrity and confidentiality of the system. Note that this detection does NOT confirm that the abnormal behavior originated from malicious intent, as it may be triggered by legitimate applications or administrative actions.

  ### Investigation Steps

  - **Analyze process creation events: **Review Security Event ID 4688 and Sysmon Event ID 1 for process creation of `C:\Program Files\Windows Media Player\osk.exe` or `C:\Windows\System32\cmd.exe` with a parent process involving `C:\Windows\system32\mmc.exe` and verify user permissions. A legitimate execution will typically come from known administrative tools with non-elevated commands.

  - **Check integrity levels: **Examine process integrity levels for any instances where `osk.exe` or `cmd.exe` run with `High` or `System` integrity. High-integrity processes are often expected for system-level applications but not typically for media players unless specific administrative tasks are executed.

  - **Identify command-line arguments: **Investigate the command line used for `cmd.exe` by checking the ParentCommandLine field. A command line resembling `'"C:\Windows\system32\mmc.exe" "C:\Windows\system32\eventvwr.msc" /s'` may indicate legitimate use, while unfamiliar syntax may suggest malicious intent.

  - **Check for known malware signatures: **Utilize endpoint security solutions to cross-reference the hashes of the involved executables with known malware databases. If hashes of `osk.exe` or `osksupport.dll` match known threats, it strengthens the maliciousness of the activity.

  - **Monitor for lateral movement attempts: **Assess any subsequent outbound network connections initiated by the elevated command shell. A spike in network activity or connections to unusual external IPs or domains following the alert can indicate further malicious actions.

  - **Correlate with user behavior: **Review user access logs and recent activity for the triggering account. Unexpected access patterns outside of regular hours or irregular system usage can hint at compromised credentials.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact of elevated privileges on the affected system. The risk of malicious abuse is significant, as UAC bypass techniques are commonly exploited by adversaries to gain unauthorized access. This behavior is prevalent in various attack scenarios, particularly ransomware and data exfiltration efforts.

  ### Blind Spots and Assumptions

  Detection of this UAC bypass may be limited by systems or configurations that do not generate the necessary event logs or by legitimate application behaviors that resemble the bypass pattern. Missing or improperly configured logging for process creation could hinder detection effectiveness. Commonly observed legitimate activities, such as administrative tasks performed by trusted IT staff, might trigger this alert. Companion detections, such as monitoring for parent-child process relationships or unauthorized command line executions, can enhance coverage on this potential threat.

