note: |
  ### Technical Context
  This rule is designed to detect the evasion technique known as UAC Bypass using Windows Media Player, particularly by monitoring the use of specific process creation patterns associated with the execution of a malicious or compromised instance of `osk.exe` (On-Screen Keyboard) that leverages the `osksupport.dll` for privilege escalation. The attacker’s objective is likely to execute code with elevated privileges without triggering User Account Control (UAC), which can be vital for executing malicious operations undetected.

  In the context of the MITRE ATT&CK framework, this detection relates to the tactics of **Defense Evasion** and **Privilege Escalation**. The specific techniques it captures include **Bypass User Account Control** (T1548.002). These techniques typically involve exploiting trusted applications to execute arbitrary code with higher privileges.

  The relevant telemetry for this detection primarily includes Windows process creation events, which track the execution of processes like `osk.exe` and `cmd.exe`. Monitoring for changes in the integrity level of processes can also provide vital clues about potential privilege escalation attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances of `osk.exe` being spawned alongside `cmd.exe` invoked with a parent process such as `mmc.exe`. Look for any anomalies, especially in unusual parents combining a legitimate tool with `osk.exe`.

  - **Inspect Integrity Levels**: Check the integrity levels of running processes at the time of the alert. Look specifically for instances where processes are running with **High** or **System** integrity levels, as these can indicate privilege escalation.

  - **Examine Command Line Arguments**: Pay close attention to the command line arguments utilized by the parent process, specifically `C:\Windows\system32\mmc.exe` launching `eventvwr.msc`. Unusual or unexpected arguments may signal malicious behavior.

  - **Correlate with User Behavior**: Cross-reference the time of the detection with user activity logs to identify whether the behavior correlates with legitimate user actions, focusing on any accounts that have previously been flagged for suspicious behavior.

  ### Prioritization
  The severity of this alert is high due to the potential for malicious actors to bypass user account control mechanisms, allowing for unauthorized access to sensitive systems and data. This could lead to significant data breaches or internal compromise if successful.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if certain process creation logs are not being captured or if integrity level checks are insufficiently configured. This detection relies on the assumption that the Windows Media Player and associated components remain installed and utilized in the environment. If these components are removed or strictly controlled, detection efficacy may diminish. Additionally, effective monitoring requires that process creation logging and necessary configurations for tracking integrity levels are properly set on target systems.

