detection:
  selection_img:
  - Image|endswith: '\mshta.exe'
  - OriginalFileName: 'MSHTA.EXE'
  selection_cli:
    CommandLine|contains:
    - 'http://'
    - 'https://'
    - 'ftp://'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the `mshta.exe` utility with command-line arguments that include URLs (http, https, or ftp). This behavior is commonly observed when attackers attempt to execute remote HTML Application (HTA) files, potentially leading to the download and execution of malicious payloads. Attackers may deploy such tactics to bypass security controls, as `mshta.exe` is a legitimate Windows utility that can be used to run applications hosted remotely without raising immediate suspicion.

  The likely objectives of this threat scenario include achieving initial access to the target system, facilitating the execution of further malicious actions, or deploying malware. The execution of remote HTA files can be associated with tactics such as evading defenses by masquerading as legitimate processes, as well as post-exploitation activities aimed at establishing persistence or lateral movement.

  This detection is linked to the MITRE ATT&CK framework, specifically:
  - **Tactics**: Execution (TA0002), Defense Evasion (TA0005)
  - **Techniques**: `T1218.005` - Signed Binary Proxy Execution: mshta.exe

  The primary sources of data to investigate this activity include process creation logs that capture arguments passed to executables like `mshta.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the logs for instances of `mshta.exe` execution. Focus on entries that contain command-line arguments with `http`, `https`, or `ftp` to identify potential malicious activity.
  - **Correlate with Network Traffic**: Examine network logs to identify any outbound connections initiated by the process. Look for connections to known malicious domains or abnormal traffic patterns that correlate with the execution logs.
  - **Inspect File System Changes**: Check for any associated file downloads or modifications in areas where temporary files are stored (e.g., Temp folder) that correspond with the execution of the HTA file.
  - **Monitor for Subsequent Procedures**: Investigate for any follow-up actions taken by the system after mshta.exe was executed, such as additional processes spawned, unusual command executions, or changes in user privileges.

  ### Prioritization
  Given the severity of potential outcomes, including data exfiltration, unauthorized access, or ransomware deployment, this alert is classified as high priority. The likelihood of an attacker successfully executing remote scripts using `mshta.exe` poses a significant risk to enterprise environments.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage is the reliance on process creation events, which may not capture all instances of `mshta.exe` execution, particularly in cases where malware attempts to evade detection further. The detection logic assumes that all command line arguments containing URLs are suspicious, which may lead to false positives in benign scenarios, such as legitimate administrative tasks. To ensure effective monitoring, it is essential to have comprehensive logging enabled for process creation events, as well as adequate logging for network activity to correlate with suspicious behaviors effectively.

