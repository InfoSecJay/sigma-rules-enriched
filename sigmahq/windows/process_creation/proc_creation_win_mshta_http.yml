  ---

  ### Technical Context

  This Sigma rule detects instances where the Windows utility `mshta.exe` is executed with command-line arguments containing URLs (http, https, or ftp). The likely objective of an attacker is to execute a remotely hosted malicious HTA (HTML Application) file, which could be a vector for running scripts or malware on the victim's system. This behavior aligns with the MITRE ATT&CK technique for Execution (T1218.005), which encompasses the use of HTA files as a method for executing malicious code.

  The primary telemetry sources for this detection include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized control over an affected system, data exfiltration, or further compromise through the execution of payloads. However, this detection does NOT independently confirm that the HTA file is malicious, as it may also capture legitimate usage in some contexts.

  ---

  ### Investigation Steps

  - **Check the Command Line Arguments: ** Examine the command line for `mshta.exe` processes for URLs. Look specifically for the presence of `http://`, `https://`, or `ftp://` in Security Event ID 4688 or Sysmon Event ID 1 logs. If found, this is a potential indicator of malicious activity.

  - **Assess the Parent Process: ** Identify the parent process of the `mshta.exe` execution. Use Event ID 4688 logs where `NewProcessName` indicates `mshta.exe`. Legitimate activity typically involves user-initiated applications, whereas anomalous parent processes (e.g., rundll32.exe, powershell.exe) are red flags.

  - **Review the Source of the HTA File: ** Cross-reference the URLs from command lines against threat intelligence sources to evaluate the reputation of the domain serving the HTA file. Questionable or blacklisted domains significantly increase the likelihood of malicious intent.

  - **Monitor Network Traffic: ** Check for connections initiated by the executed `mshta.exe` process. Analyze logs during the event timestamp from your network monitoring solution (e.g., firewall logs) for unusual outbound requests that match or resemble the HTA file's operation.

  - **Validate the File Path: ** Inspect the file path used for `mshta.exe` execution within Event ID 4688 logs. Legitimate processes should originate from system directories (e.g., `C:\Windows\System32\mshta.exe`). Executions from user directories or non-standard locations can indicate compromise.

  - **Cross-reference Similar Alerts: ** Compare with historical alert data for similar `mshta.exe` command line patterns. If you've received multiple alerts based on similar command line signatures, this adds to the confidence of a potential attack in progress.

  ---

  ### Prioritization

  This alert should be classified as high severity, given the potential impact of the affected system, coupled with the likelihood of malicious abuse associated with HTA files. This behavior is frequently weaponized in phishing campaigns and other forms of initial access.

  ---

  ### Blind Spots and Assumptions

  The detection may be circumvented by sophisticated attackers using obfuscated command lines or altering the execution context of `mshta.exe`. Reliable detection requires proper configuration of logging settings, specifically ensuring that process creation events are captured accurately. Legitimate applications or maintenance scripts could potentially trigger this alert if they execute HTA files from URLs ("trusted" internal domains). Companion detections that strengthen coverage include monitoring PowerShell execution with similar URL patterns (MITRE T1059.001).

