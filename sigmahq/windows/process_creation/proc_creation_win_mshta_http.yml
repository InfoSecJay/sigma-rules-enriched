note: |
  ### Technical Context

  This rule detects the execution of the Microsoft HTML Application Host (`mshta.exe`) with command line arguments that include HTTP/HTTPS/FTP URLs, indicating potential execution of remote malicious HTA files. The likely objective of an attacker is to execute code that may lead to payload delivery or further exploitation. This behavior maps to MITRE ATT&CK tactic "Execution" and technique "User Execution" (T1218.005). The primary telemetry sources are process creation logs, specifically Windows Security Event ID 4688 where command line arguments can be extracted. If the activity is malicious, it may lead to unauthorized access, data exfiltration, or system compromise. However, detection of `mshta.exe` execution alone does not confirm malicious intent without further context regarding the source of the HTA file and the nature of its content.

  ### Investigation Steps

  - **Check Event ID 4688 for `mshta.exe`:** Filter Windows Security logs for Event ID 4688. Identify and document the parent process that initiated `mshta.exe`. A legitimate `mshta.exe` process may be launched by a known and trusted application.

  - **Analyze Command Line Arguments:** Validate the command line arguments for `mshta.exe`. Look for URLs containing "http://", "https://", or "ftp://". Malicious indicators include unexpected or suspicious domains, particularly domains known for hosting malware.

  - **Cross-reference with Known Threat Intelligence:** If suspicious URLs are detected, check them against threat intelligence databases to ascertain if they are associated with known malware campaigns or distribute malicious payloads. Legitimate business operations would typically not involve unrecognized URLs.

  - **Investigate Parent Process Relationships:** Review the parent process of `mshta.exe`. Legitimate processes might include known office applications or system tools, while unusual parent processes could point to potential malicious behavior.

  - **Check File System Artifacts:** Retrieve and analyze any downloaded HTA files from typical locations (e.g., `%TEMP%`). Check file creation timestamps against the execution time of `mshta.exe`.

  - **Monitor Network Activity:** Utilize network telemetry to see if the executed HTA file attempts to establish outbound connections to external IPs or domains. Documenting any atypical outgoing connections can be a strong indicator of a malicious operation.

  ### Prioritization

  Given the high severity designation for this alert, there is a significant risk of system compromise if `mshta.exe` is executed with suspicious arguments. The potential impact on the enterprise system is critical, as this technique is often leveraged by adversaries for payload delivery and remote control.

  ### Blind Spots and Assumptions

  Detection may be limited by the inability to inspect the content of the HTA files directly without proper access controls. Evasion techniques include encoding or encrypting payloads within HTA files to avoid detection. Legitimate activities, such as internal development or automated scripts that use `mshta.exe`, could trigger the rule. Companion detections, such as monitoring for abnormal outbound network traffic or specific web requests that follow `mshta.exe` executions, would strengthen overall detection effectiveness.

