note: |
  ### Technical Context

  This rule detects the execution of the `mshta.exe` utility with command-line arguments that include HTTP, HTTPS, or FTP URLs, which may indicate an attacker using a remotely hosted malicious HTML Application (HTA) file. The likely objective of the attacker is to execute code or deliver a payload while bypassing traditional security measures. This activity relates to the MITRE ATT&CK technique for executing HTA files (T1218.005) and falls within the tactics of Defense Evasion and Execution.

  The primary telemetry source for this detection is process creation logs, specifically Windows Security Event ID 4688 (for process creation) and potentially Sysmon Event ID 1 (if Sysmon is deployed). If the activity is malicious, it could lead to unauthorized execution of code and data compromise. However, this detection does NOT confirm that malicious activity is occurring by itself; further investigation is required to ascertain intent and context.

  ### Investigation Steps

  - **Review process execution details:** Check Security Event ID 4688 or Sysmon Event ID 1 for `mshta.exe`. Look at the CommandLine field for indicators matching 'http://', 'https://', or 'ftp://'. Malicious indicators typically include unexpected URLs or domains not associated with enterprise applications.

  - **Validate file origin:** Determine the source of the HTA file by inspecting network logs (e.g., Proxy logs or DNS logs). Look for outgoing connections corresponding to the same URLs used in the command line. Legitimate HTA executions typically originate from trusted internal applications or resources.

  - **Analyze system context:** Identify the user account and system context (e.g., administrative privileges) under which `mshta.exe` was executed. Limited user contexts executing `mshta.exe` with external arguments are typically more suspicious than common enterprise operations conducted by administrative accounts.

  - **Check for related file artifacts:** Inspect for any HTA files and their download locations on the local system. Look at paths in directory inflection points (e.g., Downloads or Temp folders). Unexpected files created around the same timestamp as this execution can indicate malicious activity.

  - **Correlate with detection systems:** Review any other security alerts triggered around the same time as this detection, especially those related to endpoint protection or intrusion detection systems. Multiple correlated alerts can indicate coordinated malicious activity.

  ### Prioritization

  This alert should be considered high severity in an enterprise context due to the potential impact on data integrity and system security when `mshta.exe` is used to execute remote content. The likelihood of abuse is significant, as this behavior is commonly leveraged in phishing attacks and malware distribution campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited if logs from the telemetry sources are not enabled or adequately retained. Adversaries may use obfuscation techniques in the command line or leverage legitimate applications, causing false positives. Additionally, legitimate updates or internal tools might utilize `mshta.exe` without malicious intent. A companion detection to improve coverage could involve monitoring for suspicious outbound network connections around the same time as the alert, such as unknown C2 communications.

