note: |
  ### Technical Context

  This rule detects the execution of the "mshta.exe" utility with command-line arguments that include "http", "https", or "ftp". Such behavior is indicative of attempting to execute a remotely hosted HTML Application (HTA) file, which is commonly used by adversaries to deliver malware payloads or exploit vulnerabilities. The likely attacker objective is to execute code on a target system without triggering conventional security controls.

  The relevant MITRE ATT&CK tactics and techniques are **Execution (TA0002)** and **User Execution (T1203)**. The primary telemetry source is the process creation logs on Windows systems, specifically monitoring Event ID 4688 from the Security log or Sysmon Event ID 1 for detailed process creation events. If malicious, this can lead to unauthorized access, data compromise, or complete system takeover. However, this detection does not confirm malicious intent on its own, as legitimate applications can also trigger "mshta.exe" with similar arguments.

  ### Investigation Steps

  - **Check process creation events**: Review Security Event ID 4688 or Sysmon Event ID 1 for the creation of "mshta.exe". Focus on the `CommandLine` field for URLs; look for any suspicious or unusual domains.

  - **Investigate originating processes**: Verify the parent process of "mshta.exe" by checking the `ParentProcessId` field. If the parent process is a commonly abused application (e.g., Outlook, Word), it may indicate misuse for code execution.

  - **Correlate with network activity**: Inspect outbound traffic logs for any connections to the URL used in the command line. Look for unusual HTTP/HTTPS requests in the firewall logs or proxy logs, such as new domains or suspicious user agents.

  - **Identify legitimate use cases**: Understand typical "mshta.exe" usage in your environment. Check if authorized applications rely on "mshta.exe" for valid functionality (e.g., internal tools using HTA files).

  - **Assess file creation activity**: If "mshta.exe" executed successfully, verify if any new files were created in temporary directories (e.g., C:\Users\<Username>\AppData\Local\Temp) by correlating with file creation timestamps. Look for HTA files or other executable content.

  - **Cross-reference threat intelligence**: Use threat intelligence feeds to check the domains or URLs associated with the "mshta.exe" execution against known malicious domains or indicators of compromise (IoCs).

  ### Prioritization

  This alert is considered high severity as it targets the execution of a known utility often exploited by attackers to run malicious scripts. The potential impact on the affected system can be significant, leading to unauthorized access or data breaches. The behavior is commonly weaponized in various phishing and ransomware attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on the configured logging level and the possibility that some environments may not log "mshta.exe" executions under certain conditions. Legitimate software deployments can trigger these alerts if they use "mshta.exe" for valid purposes. A related detection to strengthen coverage would be monitoring for unusual network connections from "mshta.exe" or other executable processes that interact with remote servers, enhancing the context of the alert.

