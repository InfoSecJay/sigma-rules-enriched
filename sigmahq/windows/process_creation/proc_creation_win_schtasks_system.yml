title: Schtasks Creation Or Modification With SYSTEM Privileges
id: 89ca78fd-b37c-4310-b3d3-81a023f83936
status: test
description: Detects the creation or update of a scheduled task to run with "NT 
  AUTHORITY\SYSTEM" privileges
references:
- https://www.elastic.co/security-labs/exploring-the-qbot-attack-pattern
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-28
modified: 2025-02-15
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_root:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
    - ' /change '
    - ' /create '
  selection_run:
    CommandLine|contains: '/ru '
  selection_user:
    CommandLine|contains:
    - 'NT AUT'         # This covers the usual NT AUTHORITY\SYSTEM
    - ' SYSTEM '         # SYSTEM is a valid value for schtasks hence it gets it's own value with space
  filter_optional_teamviewer:
        # FP from test set in SIGMA
        # Cannot use ParentImage on all OSes for 4688 events
        # ParentImage|contains|all:
        #     - '\AppData\Local\Temp\'
        #     - 'TeamViewer_.exe'
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - '/TN TVInstallRestore'
    - '\TeamViewer_.exe'
  filter_optional_office:
    CommandLine|contains|all:
            # https://answers.microsoft.com/en-us/msoffice/forum/all/office-15-subscription-heartbeat-task-created-on/43ab5e53-a9fb-47c6-8c14-44889974b9ff
    - 'Subscription Heartbeat'
    - '\HeartbeatConfig.xml'
    - '\Microsoft Shared\OFFICE'
  filter_optional_avira:
    CommandLine|contains:
    - '/Create /F /RU System /SC WEEKLY /TN AviraSystemSpeedupVerify /TR '
    - ':\Program Files (x86)\Avira\System Speedup\setup\avira_speedup_setup.exe'
    - '/VERIFY /VERYSILENT /NOSTART /NODOTNET /NORESTART" /RL HIGHEST'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation or modification of Windows Scheduled Tasks using the `schtasks.exe` utility under the "NT AUTHORITY\SYSTEM" privileges. Attackers often leverage this capability to establish persistence and execute malicious payloads with elevated permissions, aiming to maintain control over a compromised system. The relevant MITRE ATT&CK tactic is **Persistence (TA0003)** and the technique is **Scheduled Task/Job (T1053.005)**.

  Primary telemetry sources include Windows Security Event ID 4688, which records process creation events, specifically focusing on instances where `schtasks.exe` is invoked. If malicious, this behavior may lead to unauthorized actions on sensitive systems, potentially allowing attackers to perform lateral movement or data exfiltration. It is crucial to note that this detection does not confirm malicious intent on its own; benign administrative activities can also trigger this rule.

  ### Investigation Steps

  - **Check Event ID 4688:** Review Security Event ID 4688 for `schtasks.exe` executions. Confirm the process command line includes `/create` or `/change` along with `/ru NT AUTHORITY\SYSTEM`.

  - **Analyze Command Line Parameters:** Examine the complete command line for patterns that suggest malicious intentions, such as unusual task names or paths that do not align with legitimate application use.

  - **Evaluate Legitimate Usage:** Identify any authorized scheduled tasks that use `SYSTEM` privileges, cross-referencing with known business operations or maintenance schedules (e.g., updates for enterprise software).

  - **Correlate with Event ID 4697:** Check for Event ID 4697 to see if the scheduled task appears in the service installation logs. Malicious tasks may not show corresponding legitimate service entries.

  - **Investigate Parent Processes:** Analyze parent process information to identify the context from which `schtasks.exe` was launched. Suspicious parent processes (e.g., installers or script runners) warrant further scrutiny.

  - **Ensure Collection of Relevant Logs:** Validate that Sysmon or Windows Logging is configured to capture Event ID 4688 and other necessary logs like the Task Scheduler operational logs for establishing a detailed picture of task creation/modification.

  ### Prioritization

  Alerts based on this rule should be considered high priority due to the elevated privileges being leveraged, potentially allowing attackers to gain significant control over critical systems. The likelihood of malicious abuse is significant, as scheduled tasks are commonly weaponized for persistent access and automated execution of payloads.

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of adversaries to mask their actions, including using legitimate administrative tools. Logs must be configured correctly to ensure coverage; for instance, Windows Auditing must be enabled for the tracking of process creation. Certain benign activities, such as legitimate software updates, could trigger this alert. Companion detections include monitoring for abnormal behavior of scheduled tasks executed by `schtasks.exe`, such as actions that are anomalous based on historical baselines.

