title: Schtasks Creation Or Modification With SYSTEM Privileges
id: 89ca78fd-b37c-4310-b3d3-81a023f83936
status: test
description: Detects the creation or update of a scheduled task to run with "NT 
  AUTHORITY\SYSTEM" privileges
references:
- https://www.elastic.co/security-labs/exploring-the-qbot-attack-pattern
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-28
modified: 2025-02-15
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_root:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
    - ' /change '
    - ' /create '
  selection_run:
    CommandLine|contains: '/ru '
  selection_user:
    CommandLine|contains:
    - 'NT AUT'         # This covers the usual NT AUTHORITY\SYSTEM
    - ' SYSTEM '         # SYSTEM is a valid value for schtasks hence it gets it's own value with space
  filter_optional_teamviewer:
        # FP from test set in SIGMA
        # Cannot use ParentImage on all OSes for 4688 events
        # ParentImage|contains|all:
        #     - '\AppData\Local\Temp\'
        #     - 'TeamViewer_.exe'
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - '/TN TVInstallRestore'
    - '\TeamViewer_.exe'
  filter_optional_office:
    CommandLine|contains|all:
            # https://answers.microsoft.com/en-us/msoffice/forum/all/office-15-subscription-heartbeat-task-created-on/43ab5e53-a9fb-47c6-8c14-44889974b9ff
    - 'Subscription Heartbeat'
    - '\HeartbeatConfig.xml'
    - '\Microsoft Shared\OFFICE'
  filter_optional_avira:
    CommandLine|contains:
    - '/Create /F /RU System /SC WEEKLY /TN AviraSystemSpeedupVerify /TR '
    - ':\Program Files (x86)\Avira\System Speedup\setup\avira_speedup_setup.exe'
    - '/VERIFY /VERYSILENT /NOSTART /NODOTNET /NORESTART" /RL HIGHEST'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_schtasks_system/info.yml
note: |
  ### Technical Context

  This rule detects the creation or modification of a scheduled task that is set to execute under "NT AUTHORITY\SYSTEM" privileges, indicating possible privilege escalation and persistence tactics. The typical attacker objective could be to maintain access on a system while executing commands or scripts with elevated privileges, potentially leading to unauthorized activities such as data exfiltration or lateral movement. This detection maps to the MITRE ATT&CK technique T1053.005 (Scheduled Task/Job: Scheduled Task) under the Persistence and Execution tactics.

  The primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, focusing on the details of commands that include "schtasks.exe" and the associated command line arguments. If malicious, this behavior can severely impact the security posture of the organization by allowing attackers extended capabilities on a target system. Note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also create or modify scheduled tasks with SYSTEM privileges.

  ### Investigation Steps

  - **Review scheduled task creation events**: Check for Event ID 4688 and Sysmon Event ID 1 for any instances of `schtasks.exe` being executed, especially look for execution with command lines containing `/create` or `/change`.

  - **Analyze command structure for suspicious patterns**: Inspect command lines for tasks running as `NT AUTHORITY\SYSTEM`. Legitimate processes may include well-known applications; however, verify unknown or custom task names that might indicate abuse.

  - **Identify high-confidence malicious indicators**: Look for unusual scheduled task names or command line arguments associated with known malware behaviors. Check for specific configurations that differ from standard enterprise practices.

  - **Validate expected legitimate activity**: Compare against known legitimate task creation patterns, such as IT management tools or software updates that may legitimately create tasks running as SYSTEM.

  - **Cross-reference with user activity logs**: Use authentication logs (Event ID 4624) to confirm that an account with necessary privileges executed the task creation, ensuring that it wasn't an automated or rogue process.

  - **Investigate task execution history**: Check the Task Scheduler’s history to assess how often and when the task is executed, including any failure or success codes, which may indicate malicious activity if outside normal operational patterns.

  ### Prioritization

  This alert is considered high severity due to the critical nature of systems potentially affected, especially if execution permissions are misused. The likelihood of this behavior being exploited is high, as attackers often employ similar techniques for persistence and privilege escalation. Additionally, this behavior is frequently weaponized in various threat scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations for Task Scheduler events, particularly if not consistently enabled across all systems. Legitimate applications (e.g., software updates) may generate similar tasks, leading to potential false positives. Related detections, such as monitoring for unusual process executions or privilege escalations (e.g., using Event ID 4672), can enhance coverage and provide additional context to this behavior.

