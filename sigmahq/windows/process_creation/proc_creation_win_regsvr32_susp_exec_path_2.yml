title: Regsvr32 Execution From Highly Suspicious Location
id: 327ff235-94eb-4f06-b9de-aaee571324be
status: test
description: Detects execution of regsvr32 where the DLL is located in a highly 
  suspicious locations
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-26
tags:
- attack.stealth
- attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\regsvr32.exe'
  - OriginalFileName: 'REGSVR32.EXE'
  selection_path_1:
    CommandLine|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - '\Windows\Registration\CRMLog'
    - '\Windows\System32\com\dmp\'
    - '\Windows\System32\FxsTmp\'
    - '\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\'
    - '\Windows\System32\spool\drivers\color\'
    - '\Windows\System32\spool\PRINTERS\'
    - '\Windows\System32\spool\SERVERS\'
    - '\Windows\System32\Tasks_Migrated\'
    - '\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\'
    - '\Windows\SysWOW64\com\dmp\'
    - '\Windows\SysWOW64\FxsTmp\'
    - '\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\'
    - '\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\'
    - '\Windows\Tasks\'
    - '\Windows\Tracing\'
  selection_path_2:
    CommandLine|contains:
            # This is to avoid collisions with CLI starting with "C:\"
    - ' "C:\'
    - ' C:\'
    - " 'C:\\"
    - 'D:\'
  selection_exclude_known_dirs:
    CommandLine|contains:
            # Note: add additional locations that are related to third party applications
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\ProgramData\'
    - 'C:\Users\'
            # Note: The space added here are to avoid collisions with the "regsvr32" binary full path
    - ' C:\Windows\'
    - ' "C:\Windows\'
    - " 'C:\\Windows\\"
  filter_main_empty:
    CommandLine: ''
  filter_main_null:
    CommandLine:
  condition: selection_img and (selection_path_1 or (selection_path_2 and not 
    selection_exclude_known_dirs)) and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `regsvr32.exe` from unusual or suspicious directories often considered indicators of malicious behavior. An attacker may leverage `regsvr32` to load malicious DLLs, especially from temporary or system directories, aiming to evade traditional defenses or carry out post-exploitation activities.

  This detection aligns with the MITRE ATT&CK tactic of Execution and the technique `T1218.010 - Signed Binary Proxy Execution`. The primary telemetry source for this detection is Windows process creation logs, specifically looking for Event ID 4688 or Sysmon Event ID 1, which provide detailed information on process executions. If this behavior is confirmed to be malicious, it could lead to unauthorized code execution, system compromise, or further lateral movement within the network. Notably, this detection does NOT confirm that `regsvr32` execution is inherently malicious, as it can also be legitimate when executed from standard locations.

  ### Investigation Steps

  - **Review the process creation logs**: Check for Event ID 4688 or Sysmon Event ID 1 for `regsvr32.exe` execution, focusing on the CommandLine parameter to identify suspicious directory paths.

  - **Analyze the directory paths for execution**: Validate if the execution path includes known suspicious directories (e.g., Temp, PerfLogs). Legitimate use typically occurs from `C:\Windows\System32\` or during specific, documented tasks.

  - **Correlate with known malicious indicators**: Look for the execution of `regsvr32.exe` from paths like `C:\Temp\` or `C:\Windows\Tasks\`, as these are strong signs of potential malicious activity.

  - **Identify the parent process**: Check the ParentProcessId for any unusual hierarchies or if the parent process is a legitimate administrative process (e.g., `explorer.exe`), which may indicate benign operation.

  - **Validate the CommandLine arguments**: Look for additional parameters that may indicate a malicious payload, such as a URL or a reference to a non-standard DLL file that could trigger concern.

  - **Check for anomalies in User and System Roles**: Assess the account used for execution. If the account is a standard user running from a high privilege directory, this could indicate unauthorized behavior.

  ### Prioritization

  Given the system impact of executing a system-level tool like `regsvr32.exe` from anomalous directories, this alert has a high severity in an enterprise context. The likelihood of malicious abuse is elevated, as the observed techniques are commonly associated with evasion strategies employed by adversaries. If confirmed as malicious, this behavior could lead to initial footholds or broader compromise within the network.

  ### Blind Spots and Assumptions

  This detection may be limited by various evasion techniques, such as the legitimate use of `regsvr32` from allowed directories or processes being renamed to mimic standard executable names. Reliable detection requires logging configurations for process creation (Sysmon or Windows Event logs). Legitimate activities, such as software installations or updates, may trigger this alert if properly documented. A related detection, like monitoring for unusual DLL file access (e.g., from temp directories), can provide additional context and improve coverage.

