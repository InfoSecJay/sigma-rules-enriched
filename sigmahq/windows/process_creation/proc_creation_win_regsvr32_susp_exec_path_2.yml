title: Regsvr32 Execution From Highly Suspicious Location
id: 327ff235-94eb-4f06-b9de-aaee571324be
status: test
description: Detects execution of regsvr32 where the DLL is located in a highly 
  suspicious locations
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-26
tags:
- attack.defense-evasion
- attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\regsvr32.exe'
  - OriginalFileName: 'REGSVR32.EXE'
  selection_path_1:
    CommandLine|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - '\Windows\Registration\CRMLog'
    - '\Windows\System32\com\dmp\'
    - '\Windows\System32\FxsTmp\'
    - '\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\'
    - '\Windows\System32\spool\drivers\color\'
    - '\Windows\System32\spool\PRINTERS\'
    - '\Windows\System32\spool\SERVERS\'
    - '\Windows\System32\Tasks_Migrated\'
    - '\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\'
    - '\Windows\SysWOW64\com\dmp\'
    - '\Windows\SysWOW64\FxsTmp\'
    - '\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\'
    - '\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\'
    - '\Windows\Tasks\'
    - '\Windows\Tracing\'
  selection_path_2:
    CommandLine|contains:
            # This is to avoid collisions with CLI starting with "C:\"
    - ' "C:\'
    - ' C:\'
    - " 'C:\\"
    - 'D:\'
  selection_exclude_known_dirs:
    CommandLine|contains:
            # Note: add additional locations that are related to third party applications
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\ProgramData\'
    - 'C:\Users\'
            # Note: The space added here are to avoid collisions with the "regsvr32" binary full path
    - ' C:\Windows\'
    - ' "C:\Windows\'
    - " 'C:\\Windows\\"
  filter_main_empty:
    CommandLine: ''
  filter_main_null:
    CommandLine:
  condition: selection_img and (selection_path_1 or (selection_path_2 and not 
    selection_exclude_known_dirs)) and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `regsvr32.exe` from suspicious directories known for being misused by attackers, such as `PerfLogs`, `Temp`, and various `System32` subdirectories. This behavior often indicates an attacker attempting to register a malicious DLL file without raising alarms from conventional security measures. The likely adversary objective is to execute payloads in a stealthy manner while leveraging built-in Windows functionality, taking advantage of the system's inherent trust.

  The detection is associated with the MITRE ATT&CK technique T1218.010: Signed Binary Proxy Execution – Regsvr32. The primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. A successful execution of this rule could lead to system compromise, remote access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent on its own; benign usage may occur under specific conditions, requiring further context.

  ### Investigation Steps

  - **Review Process Creation Events:** Analyze Security Event ID 4688 and Sysmon Event ID 1 for any `regsvr32.exe` executions originating from the specified suspicious paths. Look for deviations from normal operational behavior.

  - **Check Command Line Arguments:** Focus on the CommandLine field in both Event ID 4688 and Sysmon Event ID 1 for suspicious parameters. Legitimate usage often doesn’t include paths to `\Temp\` or `\PerfLogs\`. Any such instances should warrant further scrutiny.

  - **Identify Malicious DLL Registration:** If available, cross-reference registered DLLs with known malicious hashes using Threat Intelligence feeds. Registration of unexpected or suspicious DLLs—particularly in the directories specified—indicates a higher confidence of malicious activity.

  - **Evaluate Host Activity Context:** Determine the role of the host where the detection occurred. For example, if the system is a server handling sensitive data, further investigation is critical. Compare behaviors against typical workload patterns for that asset type to identify anomalies.

  - **Assess User Behavior:** Review logs surrounding the alert, such as Windows Security logs for user logon events during the time of the regsvr32 execution. Malicious behavior may often coincide with unusual user actions or timings.

  - **Check for Related Activity:** Look for additional alerts related to unusual PowerShell scripts or Command Prompt executions in proximity to the detected event, which may indicate coordinated malicious activity.

  ### Prioritization

  This alert is of high severity due to the potential impact of malware concealed within legitimate Windows binaries. Given that `regsvr32` can facilitate the execution of arbitrary code, the likelihood of malicious abuse is significant, especially in instances of detected behavior from uncommon directories, which are frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  The main detection limitations stem from the potential for adversaries to bypass this rule by executing `regsvr32` from legitimate directories or by using different methods to register malicious DLLs. Reliable detection requires ensuring adequate logging is enabled for process creation events across all endpoints. Furthermore, legitimate administrative activities may occasionally trigger this alert when registering software components. Other detections to enhance coverage include PowerShell executions involving `Invoke-WebRequest` or `Invoke-Expression`, which could signal attempts to download and execute malware.

