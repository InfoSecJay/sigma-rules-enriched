detection:
  selection:
    OriginalFileName:
    - 'Cmd.Exe'
    - 'CONHOST.EXE'
    - '7z.exe'
    - '7za.exe'
    - 'WinRAR.exe'
    - 'wevtutil.exe'
    - 'net.exe'
    - 'net1.exe'
    - 'netsh.exe'
    - 'InstallUtil.exe'
  filter:
    Image|endswith:
    - '\cmd.exe'
    - '\conhost.exe'
    - '\7z.exe'
    - '\7za.exe'
    - '\WinRAR.exe'
    - '\wevtutil.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\netsh.exe'
    - '\InstallUtil.exe'
  condition: selection and not filter
falsepositives:
