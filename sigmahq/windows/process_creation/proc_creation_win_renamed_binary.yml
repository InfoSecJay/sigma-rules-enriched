logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName:
    - 'Cmd.Exe'
    - 'CONHOST.EXE'
    - '7z.exe'
    - '7za.exe'
    - 'WinRAR.exe'
    - 'wevtutil.exe'
    - 'net.exe'
    - 'net1.exe'
    - 'netsh.exe'
    - 'InstallUtil.exe'
  filter:
    Image|endswith:
    - '\cmd.exe'
    - '\conhost.exe'
    - '\7z.exe'
    - '\7za.exe'
    - '\WinRAR.exe'
    - '\wevtutil.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\netsh.exe'
    - '\InstallUtil.exe'
  condition: selection and not filter
falsepositives:
- Custom applications use renamed binaries adding slight change to binary name. Typically
  this is easy to spot and add to whitelist
level: medium
