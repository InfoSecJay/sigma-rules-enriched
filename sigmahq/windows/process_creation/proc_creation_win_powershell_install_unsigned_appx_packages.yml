note: |
  ### Technical Context

  This rule detects the installation of unsigned AppX packages using PowerShell commands, specifically `Add-AppxPackage` or its alias `Add-AppPackage`, coupled with the flag `-AllowUnsigned`. The likely objective of an attacker using this method would be to evade application whitelisting and execute malicious code, thereby achieving a foothold within an environment and maintaining persistence. This behavior falls under the MITRE ATT&CK tactics of **Persistence** (TA0003) and **Defense Evasion** (TA0005), particularly techniques such as **Application Layer Protocol** (T1203) and **Software Deployment Tools** (T1071).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focused on PowerShell execution. Required log types include Security Event ID 4688, which captures process creation, and Sysmon Event ID 1 for detailed process monitoring. The security impact can be severe; installing unsigned packages may lead to data exfiltration or system compromise. It is essential to note that this detection does NOT confirm that a malicious event occurred without additional context; legitimate administrative actions or testing may also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for PowerShell execution details. Look specifically for the command line containing `Add-AppxPackage` or `Add-AppPackage` along with the `-AllowUnsigned` flag.

  - **Identify host activity context**: Verify the role of the host initiating the request. If the host is not a designated developer or a system administrator, the alert is more likely to be suspicious.

  - **Check for benign use cases**: Document any recent legitimate installations of unsigned packages in the organization, noting the user events related to testing or development. This will aid in distinguishing between benign and malicious behaviors.

  - **Correlate with file system changes**: Review file creation artifacts in locations where unsigned AppX packages might be installed (e.g., `C:\Program Files\WindowsApps\`). Check for any unexpected binaries or application files created around the same time as the alert.

  - **Investigate associated PowerShell logs**: Look into Windows PowerShell logs for any unusual invocation patterns or scripts running inline with the command to install the package. This can reveal additional context regarding the execution environment.

  - **Identify high-confidence malicious indicators**: Check if the invoked command was executed in conjunction with known malicious IP addresses or domains (using an external threat intelligence feed) that might indicate a compromise attempt.

  ### Prioritization

  This alert holds medium severity based on the potential for significant impact from unauthorized installation of unsigned applications. Given that attackers commonly use such methods to deploy malware or unauthorized software, swift investigation is warranted. The likelihood of this activity being malicious is heightened if identified on critical infrastructure or sensitive endpoints.

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that some legitimate activities, such as approved software testing or development, can trigger this alert. Additionally, environments lacking detailed PowerShell logging may miss critical execution details necessary for comprehensive analysis. It's also important to consider that some users may install unsigned packages for valid reasons, so prior approval workflows should be in place. A related detection to complement this rule would be monitoring for unauthorized script execution that can also exploit the PowerShell environment (see detection ID 975b2262-9a49-439d-92a6-0709cccdf0b2 for relevant oversight).

