note: |
  ### Technical Context

  This Sigma rule detects attempts to install unsigned AppX packages using the PowerShell commands `Add-AppxPackage` or its alias `Add-AppPackage`. Attackers may leverage this behavior to persist malicious software or introduce compromised applications into an environment, thereby gaining unauthorized access or control. This detection aligns with the MITRE ATT&CK tactic of Persistence (TA0003), specifically technique T1547.001, which involves the installation of applications that are not signed, indicating a potential compromise or risky configuration.

  Primary telemetry sources involve process creation logs from Windows (Event ID 4688) or Sysmon (Event ID 1), capturing command line arguments utilized during the installation process. If malicious, the security impact can be severe, leading to the compromise of host integrity and potential lateral movement within the network. It's essential to note that this detection alone does not confirm malicious intent, as legitimate unsigned package installations may occur in legitimate scenarios such as development or testing.

  ### Investigation Steps

  - **Review Event IDs for suspicious commands**: Check Windows Security Event ID 4688 or Sysmon Event ID 1 logs for any instances of `Add-AppxPackage` or `Add-AppPackage` commands. Focus on command lines containing `-AllowUnsigned`.

  - **Correlate usage context**: Investigate the user account associated with the event. Determine if the user has legitimate reasons to run unsigned applications, such as being part of a development or testing team.

  - **Analyze CommandLine for flags**: Inspect the parameters used with the command. Any command line with `-AllowUnsigned` is suspicious and deviates from standard application installation practices.

  - **Identify legitimate installations**: Compare the command execution against known authorized installations. If the behavior is part of any official deployment or testing procedure documented in internal change management records, classify it as benign.

  - **Look for malicious indicators**: If the command was executed from unusual paths for `powershell.exe` or `pwsh.exe` (e.g., non-default directories), it may indicate malicious intent. Investigate the file path thoroughly.

  - **Check for related artifacts**: Validate the presence of unusual files in `C:\Program Files\`, or user app directories following the installation. Look for execution and write logs indicating new or modified AppX packages.

  ### Prioritization

  This alert should be treated with medium severity. The affected system's role and access can dictate the risk level; if it is an endpoint in a highly regulated environment, the impact may be higher. Attempts to execute unsigned package installations are increasingly common in exploitation scenarios, warranting attention and further investigation.

  ### Blind Spots and Assumptions

  Detection might be limited by user permissions; users with administrative privileges may bypass certain restrictions leading to legitimate actions being mistaken for malicious ones. Ensure that PowerShell logging is properly configured for more thorough visibility. This alert may also trigger during legitimate application testing or installations, such as internal development work. A related detection for added coverage could involve monitoring for other potentially harmful PowerShell command usages, such as those related to installing software packages or scripts from unverified sources.

