note: |
  ### Technical Context
  This rule detects attempts to install unsigned AppX packages using PowerShell's `Add-AppxPackage` or its alias `Add-AppPackage`. Such installations can pose a significant risk, as unsigned packages may include malicious software that could compromise system integrity and user data. Attackers may leverage these tactics to deploy unauthorized applications or modify existing software to jeopardize the security posture of the environment.

  The primary objective of this behavior is typically to bypass security controls that restrict the installation of unverified applications, which aligns with the MITRE ATT&CK tactics of **Persistence** (TA0003) and **Defense Evasion** (TA0005). Relevant techniques include **Application Layer Protocol** (T1071.001) for evading detection mechanisms, as well as **Signed Binary Proxy Execution** (T1218) in instances where unsigned applications masquerade as legitimate software.

  The most relevant data sources for detection include **process creation events** generated by Windows, which will provide insight into the execution of PowerShell commands, as well as the command line arguments utilized during the execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs for instances of `powershell.exe` or `pwsh.exe` that include the `Add-AppxPackage` or `Add-AppPackage` command. Pay special attention to the `-AllowUnsigned` flag for possible unauthorized installations.

  - **Investigate Command Line Execution**: Check the command line details for suspicious activity. Look for unusual parameters or attributes that indicate an attempt to install unsigned applications, particularly if executed by non-administrative accounts.

  - **Assess Installed AppX Packages**: Conduct an assessment of the currently installed AppX packages on systems where the alert was triggered. Validate the legitimacy of the packages against a known good list to identify any unauthorized installations.

  - **Correlate with Security Events**: If possible, correlate the findings with other security events, such as user account activity and group policy modifications, to understand the broader context of the installation attempt.

  ### Prioritization
  The alert is considered medium severity due to the potential for unauthorized software installations that can lead to system compromise. The likelihood of encountering this behavior in an enterprise environment is moderately high, particularly in large organizations with numerous endpoints.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include instances where PowerShell logging is disabled or incongruent configurations prevent accurate capture of command line activities. This detection assumes that unauthorized installations will utilize PowerShell, potentially missing installations initiated through other methods or tools. Adequate logging configurations must be in place to ensure command-line arguments and process creation events are fully logged and monitored for this alert to function effectively.

