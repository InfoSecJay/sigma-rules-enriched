  ### Technical Context

  This Sigma rule detects the execution of `extrac32.exe`, a tool used to extract files from cabinet (.cab) files and store them in an Alternate Data Stream (ADS). The likely objective of using this tool is for stealthy data extraction, potentially leading to data exfiltration or evasion of security controls. The relevant MITRE ATT&CK tactic is **Defense Evasion**, with technique **T1564.004** specifically focusing on Alternate Data Streams.

  The primary telemetry sources for this detection are Windows process creation logs, particularly focusing on Event ID 4688, which captures process initiation details. If malicious, successful execution could result in undetected data exfiltration or unauthorized access to sensitive files. This detection does NOT confirm that malicious actions are occurring; it only indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Verify process execution details:** Review Windows Security Event ID 4688 logs to confirm that `extrac32.exe` was used. Check the `NewProcessName` field for the presence of this executable and look for related parent processes that may indicate a legitimate context, such as known applications.

  - **Analyze command line parameters:** Examine the command line in the process creation log entry to identify file paths and ADS usage. The command line should include `.cab` as well as an ADS path indicated by `:`, which is a red flag. Verify if the `.cab` file is from a legitimate source.

  - **Identify related process activity:** Investigate further Process IDs (PIDs) tied to the `extrac32.exe` execution. Track any subsequent processes created in the same session that could indicate malicious behavior, like `cmd.exe` or `powershell.exe` execution related to the extraction.

  - **Check for legitimate ADS usage:** Determine if the logged activity corresponds with known system operations or application behaviors (e.g., software updates). This might include reviewing other processes related to the application that could have triggered the `extrac32.exe` execution.

  - **Investigate file activity:** Look into any file operations associated with the alternate data stream, specifically focusing on file creation events (Event ID 4663). Check the `ObjectType` and `ObjectName` to confirm that files or folders are being accessed or modified.

  - **Correlate with network activity:** If applicable, inspect network traffic that may correlate with this behavior using NetFlow and proxy logs. Unusual outbound connections after `extrac32.exe` execution may indicate data exfiltration attempts.

  ### Prioritization

  This alert carries medium severity due to its potential impact on the security of the environment. Execution of tools like `extrac32.exe` could indicate an advanced adversary’s technique to evade detection. While not definitive proof of a compromise, the behavior is often weaponized in targeted attacks for data exfiltration via any means necessary.

  ### Blind Spots and Assumptions

  Detection may be circumvented if the adversary uses a different tool or a legitimate tool with similar capabilities. This detection relies heavily on enabled process creation logging which may not be enabled across all systems, leading to gaps in visibility. Legitimate applications that use tools for compressed file extraction could inadvertently trigger this alert. A related detection to consider is monitoring for Windows Command Line proliferation, which can help capture malicious script execution post-extraction.

