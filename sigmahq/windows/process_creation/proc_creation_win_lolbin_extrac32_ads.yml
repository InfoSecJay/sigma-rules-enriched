  ### Technical Context

  This Sigma rule detects the execution of `extrac32.exe`, specifically targeting scenarios where data is extracted from a CAB file and hidden within an alternate data stream (ADS). The likely attacker objective is to evade detection and persistence through the use of ADS to conceal malicious files. This behavior aligns with MITRE ATT&CK technique **T1564.004: Alternate Data Streams** under the **Defense Evasion** tactic.

  The primary telemetry sources for this detection are Windows process creation logs, particularly Event ID 4688, which captures command-line arguments of executed processes. If malicious, the impact could be severe as it indicates a technique that adversaries may leverage to hide malware or other artifacts from standard file listings and antivirus monitoring. This detection alone does NOT confirm malicious intent; benign use of extrac32 for legitimate data handling can also trigger alerts.

  ### Investigation Steps

  - **Verify process invocation:** Check for Event ID 4688 to find instances of `extrac32.exe`, noting the command-line arguments for the presence of `.cab` files and alternate data stream syntax. Look for non-standard usage patterns that imply potential abuse.

  - **Inspect alternate data streams:** Use the command `ads /s C:\path\to\extracted\files` or similar tools to list alternate data streams associated with the directory where the `.cab` file was extracted. Legitimate activities would typically not include hidden data streams.

  - **Correlate user activity:** Review the account activity surrounding the time of `extrac32.exe` execution (Event ID 4624 for logons) to determine if the user is authorized and has a business need to handle CAB files. Benign users would typically not engage in frequent manipulation of such files.

  - **Identify suspicious output:** Investigate created files using Sysmon Event ID 11 and correlate with identified ADS for any unusual file sizes or types that are not common for normal user activities, indicating possible exfiltration or persistence mechanisms.

  - **Examine related activities:** Cross-reference your findings with other tools such as Windows Event Logs for file creation events under Security Event ID 4663 to track outputs from `extrac32.exe` that could indicate data extraction or egress.

  ### Prioritization

  This alert warrants medium severity due to the potential for substantial impact if an affected system is exposed to malicious activities. The likelihood of malicious abuse is moderate since while `extrac32.exe` has legitimate uses, its application for creating hidden data streams is not common, indicating potential weaponization by adversaries.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of enhanced logging configurations; if alternate data stream events are not logged or if auditing is not configured correctly, it could result in missed detection opportunities. Legitimate applications of CAB files and data manipulation that adhere to standard operating procedures might falsely trigger the rule. A companion detection to consider includes monitoring for unusual file access patterns using Sysmon's File Create events (Event ID 11) to increase visibility on anomalous behavior.

