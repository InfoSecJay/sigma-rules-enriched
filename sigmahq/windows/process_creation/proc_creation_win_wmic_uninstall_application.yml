note: |
  ### Technical Context

  This Sigma rule detects the uninstallation of applications using the Windows Management Instrumentation Command-line (WMIC) tool, specifically through command lines that include 'call' and 'uninstall.' The detection suggests an attacker may be attempting to remove security tools or critical applications as a part of a broader goal to maintain persistence or obscure malicious activities. This aligns with the MITRE ATT&CK technique for application layer (T1047).

  Primary telemetry comes from process creation events (Windows Event ID 4688), specifically looking for command lines invoking WMIC.exe with uninstall commands. If executed maliciously, this activity could compromise the integrity of essential applications or security measures within the environment, particularly on sensitive systems. It is essential to note that this detection, while indicative of potential malicious behavior, does not confirm that the uninstallation was executed with malicious intent without further contextual investigation.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for processes involving 'WMIC.exe' and specific command lines using 'call' and 'uninstall' keywords. Evaluate the user context and timestamp against known scheduled maintenance activities.

  - **Correlate with application inventory:** Compare the applications being uninstalled against a known inventory of installed software, using tools such as SCCM or your asset management database, to identify if the uninstallation aligns with expected behavior.

  - **Check for unauthorized user activity:** Query the logs for user activity around the time of the event. Look for any unusual user accounts or previously unknown users executing the command, which could indicate malicious intent.

  - **Investigate related alerting tools:** Validate whether any security products or monitoring solutions were removed, correlating the uninstall events with your organization's deployed security suite to identify possible gaps left by an unauthorized removal.

  - **Examine for high-confidence indicators:** Identify if the uninstalled application is a known security product (e.g., antivirus software) that should not have been removed under normal operating procedures, indicating potential malicious action.

  - **Document legitimate activities:** Ensure to establish a baseline of expected uninstallations initiated by IT personnel or scheduled maintenance, including their common procedures and approval processes to differentiate from unauthorized activities.

  ### Prioritization

  This alert carries medium severity due to its potential impact on system integrity and security. The likelihood of malicious abuse is significant, especially if critical security measures are uninstalled, and the use of WMIC for such actions is a common adversary technique. This behavior is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of full logging from WMIC or system privilege escalation that allows benign actors to execute similar commands legitimately. An organization must ensure that proper logging settings are enabled for process creation events on all critical systems. Legitimate system maintenance activities might trigger this alert if applications are routinely uninstalled for upgrades or replacements. Related detections, such as uninstallations tied to specific security products (ID: 847d5ff3-8a31-4737-a970-aeae8fe21765), can provide additional context and coverage against common evasion tactics.

