note: |
  ### Technical Context

  This Sigma rule detects the uninstallation of an application using the Windows Management Instrumentation Command-line (WMIC) tool. Attackers may utilize WMIC to remove security products or applications that could hinder their activities, potentially leading to an escalation in privileges or persistence on the target system. The behavior is linked to the MITRE ATT&CK technique T1047: Windows Management Instrumentation (WMI) and is categorized under the Execution tactic.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. Malicious activities centered around this behavior may lead to unauthorized changes in system configuration and reduced visibility for monitoring tools. Importantly, this detection does NOT confirm that the uninstallation was malicious; it only indicates an application was removed via WMIC.

  ### Investigation Steps

  - **Review Windows Process Creation Events**: Check for Security Event ID 4688 or Sysmon Event ID 1 on the affected host. Look for instances where `WMIC.exe` is called, particularly with a command line containing `call` and `uninstall`.

  - **Analyze the Command Line Arguments**: Verify the exact command line used in these process creation events. Legitimate uninstallations should ideally not appear suspicious and typically won't use WMIC in a non-standard manner.

  - **Identify Application Context**: Determine the application being uninstalled. Cross-reference the uninstallation with known security applications (e.g., antivirus or endpoint detection software) that should remain installed for security posture.

  - **Check for Anomalous Patterns**: Examine trends in uninstallation events across the environment. Frequent uninstalls, especially of security software, may indicate malicious activity aimed at evading detection.

  - **Validate Effective Log Collection**: Ensure that logs from Sysmon and Windows Security Events are being captured effectively for the host in question and that retention policies are appropriate for forensic analysis.

  ### Prioritization

  This alert is of medium severity due to the potential impact of uninstalled security applications on systems deemed sensitive or critical for enterprise operations. Additionally, the likelihood of abuse by adversaries leveraging WMIC for privilege escalation or evasion makes this detection particularly relevant. Such behavior aligns with known tactics used in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the ability to appropriately log WMIC events, which may not be configured consistently across all systems. Legitimate administrative activities, such as routine application updates or maintenance, might trigger this alert, potentially leading to false positives. A related detection to strengthen coverage is one that monitors for alterations in software inventory or application whitelisting processes, providing insights into unauthorized changes in application states.

