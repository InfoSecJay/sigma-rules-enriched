note: |
  ### Technical Context
  This rule detects the uninstallation of applications using the Windows Management Instrumentation Command-line (WMIC) tool. Attackers often leverage WMIC to uninstall security products or other key applications to facilitate further malicious activities, such as establishing persistence or evading detection. By removing security applications, adversaries aim to weaken the overall security posture of an environment and create openings for additional exploitation.

  Relevant to the MITRE ATT&CK framework, this detection aligns with the Execution tactic (T1203) and Technique T1047, which specifically addresses the use of WMIC for application management. This technique signifies that an adversary is actively interacting with system management capabilities that may not be monitored closely in a standard security setup.

  The primary data sources for this detection include process creation events on Windows systems, where logs will capture invocations of the `WMIC.exe` tool along with the command line arguments used in the process execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation events around the time of the alert to identify instances of `WMIC.exe` being invoked, including the command line arguments used. Pay close attention to any unusual uninstall commands that may target critical or security-related applications.

  - **Correlate with Application Performance:** Check application logs, system performance, or change logs to identify whether the uninstallation was part of a legitimate administrative process or if it exhibits suspicious behavior indicative of malicious intent.

  - **Examine User Activity:** Investigate the user account that initiated the WMIC command. Determine if there was unusual activity from this user account prior to the event, such as privilege escalation or accessing sensitive resources.

  - **Check for Persistence Mechanisms:** Look for other signs of malicious activity associated with the uninstallation, such as new services created, unexpected scheduled tasks, or changes in system configurations that could indicate a compromise.

  ### Prioritization
  The severity of this alert is considered medium due to its potential impact on the security infrastructure. The uninstallation of critical applications can lead to enhanced vulnerabilities, especially if carried out alongside other exploitation or lateral movement techniques.

  ### Blind Spots and Assumptions
  This detection may not capture all uninstallation activities, particularly if attackers utilize different methods beyond WMIC, such as direct PowerShell commands or other software removal tools. There is an assumption that the `WMIC.exe` tool usage and its command line will be logged appropriately; thus, environments lacking detailed process creation logging may miss such activities. Proper logging configurations must be verified to ensure adequate coverage for these types of events.

