logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\dnscmd.exe'
  selection_cli:
    CommandLine|contains:
    - '/enumrecords'
    - '/enumzones'
    - '/ZonePrint'
    - '/info'
  condition: all of selection_*
falsepositives:
- Legitimate administration use
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify potential discovery activities by monitoring the execution of the `dnscmd.exe` tool with specific command-line arguments. The command `dnscmd.exe` is a Windows tool used for managing DNS servers. Competent threat actors may leverage this tool to enumerate DNS zones and records, which can reveal valuable information about a target's internal infrastructure, such as hostnames, IP addresses, and potential attack vectors.

  The likely scenario for this detection includes an attacker conducting reconnaissance on a network after gaining initial access. By enumerating DNS zones, the attacker aims to gather information for lateral movement, privilege escalation, or planning further attacks against specific resources within the organization. This behavior affiliates with the MITRE ATT&CK framework under the Discovery tactic, specifically with the techniques T1087.001 (Account Discovery: Local Account) and T1087.002 (Account Discovery: Domain Account).

  The primary data source for this detection rule is process creation events on Windows systems, which reveal details about what applications are executing and the command-line arguments being used.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for any instances of `dnscmd.exe` execution with arguments like `/enumrecords`, `/enumzones`, `/ZonePrint`, or `/info` to confirm the execution of potentially malicious commands.
  - **Correlate with User Activity:** Investigate the context of the process creation by examining the user accounts under which these commands were executed. Pay special attention to any accounts that should not have administrative access.
  - **Check for Lateral Movement Patterns:** Look for signs of lateral movement following the execution of `dnscmd.exe`. This might include unauthorized access attempts to other systems or network resources using the information gathered.
  - **Validate Administrative Use Cases:** Determine if the usage of `dnscmd.exe` corresponds to legitimate administrative tasks by cross-referencing with scheduled tasks or known administrator activities.

  ### Prioritization
  This alert has a medium severity level because while the execution of `dnscmd.exe` can signify legitimate administrative behavior, it can also indicate an active reconnaissance effort by a malicious actor. The potential impact of exposing sensitive DNS records could lead to further attacks against the infrastructure.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection if the log collection for process creation events is not comprehensive or if logging levels are incorrectly set. The detection logic assumes that any execution of `dnscmd.exe` with specific arguments is suspicious unless otherwise indicated by context. Successful detection requires active monitoring of Windows process creation logs, along with the necessary permissions to gather and analyze them.

