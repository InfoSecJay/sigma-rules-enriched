detection:
  selection_img:
    Image|endswith: '\dnscmd.exe'
  selection_cli:
    CommandLine|contains:
    - '/enumrecords'
    - '/enumzones'
    - '/ZonePrint'
    - '/info'
  condition: all of selection_*
falsepositives:
- Legitimate administration use
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of `dnscmd.exe` with specific arguments commonly used for DNS zone enumeration, such as `/enumrecords`, `/enumzones`, `/ZonePrint`, and `/info`. Attackers typically seek to gather information about the DNS configuration of a target domain, which can assist in identifying potential targets for further exploitation, including lateral movement and phishing campaigns. This behavior falls under the MITRE ATT&CK framework as **Discovery** (TA0007), specifically the technique **Domain Services Inventory** (T1590).

  The primary telemetry source for this detection is Windows Process Creation events, specifically Security Event ID 4688, which captures process creates, including command line arguments associated with the `dnscmd.exe` process. If malicious, this activity can lead to significant exposure of a network's infrastructure and personnel. Notably, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also invoke `dnscmd.exe` for DNS management purposes.

  ### Investigation Steps

  - **Identify the source process:** Examine Security Event ID 4688 for the process creation of `dnscmd.exe`. Review the `CommandLine` field for suspicious arguments, especially `/enumrecords`, `/enumzones`, `/ZonePrint`, or `/info`.

  - **Verify if the action aligns with expected behavior:** Check whether the action was initiated from a known administrative user account or script versus an unfamiliar or unauthorized user. Legitimate usage typically involves administrative users managing DNS resources directly rather than anomalous accounts.

  - **Cross-reference event timestamps:** Compare the timestamps of Security Event ID 4688 with other relevant logs (e.g., DNS logs) for unusual patterns or spikes indicating bulk enumeration activities. Confirm that the enumeration attempts do not correlate with scheduled administrative actions.

  - **Check the context of the command:** Validate what actions were taken before and after the invocation of `dnscmd.exe`. Look for any related suspicious activities, such as lateral movement attempts (Event ID 4624 for logins) or privilege escalation.

  - **Monitor for evidence of information retrieval:** Query DNS logs for abnormal queries that could suggest reconnaissance beyond typical administrative practices. Look for access to multiple DNS zones in a short time frame, which may indicate automated or scripted enumeration.

  ### Prioritization

  This alert is of medium severity given the potential impact of disclosing sensitive DNS infrastructure information. The risk of malicious use is moderate, as DNS zone enumeration can facilitate further attacks. Although this behavior is not as commonly weaponized as other tactics, it serves as a precursor to more severe attacks when combined with additional reconnaissance.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate administrative activities that involve `dnscmd.exe`, as well as potential evasion techniques, such as attackers using native tools or modifying command-line arguments to bypass detection. Required log sources include event logging configurations that capture process creation, specifically for the Command Line field. Additionally, legitimate scripted maintenance tasks may trigger this alert inadvertently. Companion detections around abnormal authentication logs (e.g., Event ID 4625 for failed logins) could strengthen coverage and contextual analysis of potential breaches.

