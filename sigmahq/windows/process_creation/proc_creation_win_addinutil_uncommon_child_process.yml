  ---

  ### Technical Context

  This Sigma rule detects the execution of uncommon child processes spawned by `AddInUtil.exe`, a utility involved in updating add-ins for Microsoft applications. This behavior may signal an attacker’s attempt to exploit this legitimate tool to execute malicious payloads, effectively masquerading as a benign operation. The primary MITRE ATT&CK tactic associated with this behavior is Defense Evasion (T1218), as the malicious activity hides behind a legitimate process.

  The detection relies on system process creation telemetry from Windows, specifically monitoring for unexpected child processes under `AddInUtil.exe`. If malicious, this could enable the execution of harmful code or the delivery of malware through a proxy execution technique. However, this detection does not confirm malicious intent or confirm that the execution was harmful without further context and investigation.

  ---

  ### Investigation Steps

  - **Review the child processes spawned by AddInUtil.exe:** Use Process Explorer or PowerShell to list child processes (Process command: `Get-WmiObject Win32_Process -Filter "ParentProcessID='<ParentID>'"`). Look for unusual or unknown executables, particularly those not typically associated with legitimate use cases.

  - **Check the execution paths of detected child processes:** Examine the path of the child process against known benign applications and the typical execution paths of legitimate applications. Focus on Event ID 4688 (process creation) logs in the Security event log for path information.

  - **Validate the execution context of AddInUtil.exe:** Investigate the process creation triggers to determine if it aligns with standard operational times (e.g., during scheduled updates). Look for expected Event ID 4688 logs where AddInUtil.exe is legitimately executed.

  - **Identify any recent changes to add-in configurations:** Review add-in logs or modification timestamps related to the application utilizing AddInUtil.exe. Event ID 1001 from Application logs may give insights into legitimate configuration updates.

  - **Correlate with known threats or recent incidents:** Conduct a cross-check with threat intelligence feeds to see if the process behaves similarly to reported malicious use of `AddInUtil.exe`, enhancing the context for potential activity.

  - **Assess system roles and criticality:** If the affected system is a critical infrastructure component, escalate the investigation to include a deeper dive into logs and system behaviors, considering the potential impact of an undetected compromise.

  ---

  ### Prioritization

  The alert severity is medium due to the potential misuse of a common utility in enterprise environments. While not a guarantee of malicious activity, the behavior is often weaponized by adversaries looking to exploit misconfigurations or legitimate processes, especially in environments where add-in management is prevalent.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by process visibility restrictions, as valid applications could also spawn unusual child processes. Ensure comprehensive logging configurations for process creation are enabled. Legitimate software updates, especially involving Office applications, may trigger this alert. A companion detection could include monitoring for unusual network activity or outbound invitations from systems with AddInUtil.exe executions, helping to confirm or refute the legitimacy of the behavior.

