title: Uncommon Child Process Of AddinUtil.EXE
id: b5746143-59d6-4603-8d06-acbd60e166ee
status: test
description: |
  Detects uncommon child processes of the Add-In deployment cache updating utility (AddInutil.exe) which could be a sign of potential abuse of the binary to proxy execution via a custom Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\addinutil.exe'
  filter_main_werfault:
    Image|endswith:
    - ':\Windows\System32\conhost.exe'
    - ':\Windows\System32\werfault.exe'
    - ':\Windows\SysWOW64\werfault.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of uncommon child processes from the `AddInUtil.exe` executable, particularly when the child processes do not match expected legitimate behavior. Attackers may leverage `AddInUtil.exe` to execute malicious payloads, thus proxying their actions under the guise of a benign process. This behavior is often associated with tactics that involve process exploitation and code injection, specifically within the MITRE ATT&CK framework under the Tactic: Execution and Technique: Trusted Developer Utilities (T1218).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the presence of unexpected child processes could indicate that an attacker is executing code for malicious purposes or conducting lateral movement. However, the detection on its own does NOT confirm malicious intent without further context or corroborating evidence, such as runtime behavior analysis or network activity.

  ### Investigation Steps

  - **Review child process creation:** Examine Process Creation logs (Security Event ID 4688, Sysmon Event ID 1) for child processes spawned from `AddInUtil.exe`. Look for processes that are not typical in this context, such as `cmd.exe`, `powershell.exe`, or unusual executables, which may indicate potential exploitation.

  - **Identify typical usage patterns:** Reference the organization's legitimate usage of `AddInUtil.exe` to determine expected child processes. Legitimate activity might involve known add-in installations or updates, potentially generating expected children like `msiexec.exe`.

  - **Check process command line arguments:** For the detected processes, investigate command line arguments via Sysmon Event ID 1. Malicious payloads may include unusual or obfuscated arguments, which differ from normal execution patterns observed in your environment.

  - **Cross-reference timestamps with user activity logs:** Correlate the process creation events with user activity logs. Look for unusual login times or escalations in user privileges around the same timestamp that might indicate suspicious user behavior.

  - **Analyze parent-child relationship:** Validate the parent-child hierarchy in the process tree. If processes are spawned from `AddInUtil.exe` but do not have a direct correlation with legitimate add-in deployment activities, flag this as suspicious.

  - **Monitor network connections tied to child processes:** Check for network activity associated with the child processes via network logs (e.g., Windows Firewall logs). Malicious activity might involve outbound connections to unknown IP addresses or domains initiated from the suspicious child process.

  ### Prioritization

  This alert has medium severity due to the possibility of malicious abuse through a potentially benign execution context. The impact depends on the role of the affected system; for example, enterprise systems managing sensitive data may have higher criticality. The behavior is less common but could be indicative of an attacker leveraging generally trusted utilities for nefarious purposes.

  ### Blind Spots and Assumptions

  Detection may be limited by the unavailability of comprehensive process creation logs or misconfigured log retention policies. Evasion techniques may include the use of known benign parameters or processes to obfuscate malicious activity. Legitimate activities, such as managed application updates or maintenance, can trigger this alert. A companion detection that strengthens coverage could involve monitoring for unusual PowerShell usage, as this technique (T1218) is often associated with similar malicious behavior.

