logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\addinutil.exe'
  filter_main_werfault:
    Image|endswith:
    - ':\Windows\System32\conhost.exe'
    - ':\Windows\System32\werfault.exe'
    - ':\Windows\SysWOW64\werfault.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify unusual child processes spawned by the Add-In deployment cache updating utility (AddInUtil.exe) on Windows systems. The presence of uncommon child processes may indicate that an attacker is attempting to exploit this legitimate process to execute malicious payloads. Attackers can employ this technique to evade detection by leveraging trusted binaries as a means to launch their activities, thereby obfuscating their actions under the guise of normal application behavior.

  The threat scenario generally involves an attacker utilizing the AddInUtil.exe binary to act as a conduit for executing their custom payloads. This could be part of a broader attack aimed at persistence, lateral movement, or privilege escalation within the environment. This behavior aligns with the MITRE ATT&CK tactics of **Defense Evasion** (TA0005) and the technique **Trusted Developer Utilities** (T1218), which encompasses the abuse of legitimate software for malicious intents.

  The primary data sources that would contain relevant evidence for this detection include Windows process creation events, often gathered from security tools like EDR solutions or native Windows event logs.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check process creation logs to identify any child processes launched by AddInUtil.exe, particularly focusing on their names and execution contexts for anomalous behavior.
  - **Analyze Parent-Child Relationships:** Investigate the hierarchical relationships between processes, paying attention to any unusual patterns or processes that do not commonly arise from AddInUtil.exe.
  - **Identify Execution Context:** Evaluate the execution context of identified child processes to determine if they originate from unexpected directories or are associated with uncommon users or privileges.
  - **Correlate with Known Malicious Activity:** Utilize threat intelligence sources to correlate detected activities with existing indicators of compromise (IoCs) related to the abuse of AddInUtil.exe or similar tools.

  ### Prioritization
  This alert should be treated with medium severity, as while it may indicate suspicious behavior, further context is often required to confirm malicious intent. In an enterprise environment, identifying potential abuse of trusted binaries is critical, as it can signal attempts at evasion or lateral movement by threat actors.

  ### Blind Spots and Assumptions
  The detection logic may have gaps in coverage concerning legitimate applications that may also spawn unusual child processes under certain conditions, which could lead to false positives. The assumption is made that AddInUtil.exe is functioning normally within the environment; thus, processes spawned by it are considered potentially malicious only when they deviate from typical behavior. Required logging includes comprehensive process creation events, which must be enabled on endpoints to ensure full visibility.

