title: Use of Scriptrunner.exe
id: 64760eef-87f7-4ed3-93fd-655668ea9420
status: test
description: The "ScriptRunner.exe" binary can be abused to proxy execution 
  through it and bypass possible whitelisting
references:
- https://lolbas-project.github.io/lolbas/Binaries/Scriptrunner/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-01
tags:
- attack.execution
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ScriptRunner.exe'
  - OriginalFileName: 'ScriptRunner.exe'
  selection_cli:
    CommandLine|contains: ' -appvscript '
  condition: all of selection*
falsepositives:
- Legitimate use when App-v is deployed
level: medium
note: |
  ### Technical Context

  This rule detects usage of "ScriptRunner.exe," which is an executable that can be manipulated to run scripts and bypass security mechanisms by filtering legitimate whitelisting based on file path. Attackers may leverage it to execute malicious scripts indirectly, thereby evading detection mechanisms designed to analyze direct script execution. The relevant MITRE ATT&CK technique is "Scripting" (T1218).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Event ID 4688 for new process creations and the Windows command line execution context. If malicious, adversaries can use this method for lateral movement or executing malware in a stealthy manner due to its proxy nature. However, this detection does NOT confirm malicious intent on its own, as "ScriptRunner.exe" may legitimately be used in environments with Application Virtualization (App-V) deployed.

  ### Investigation Steps

  - **Review process creation logs:** Examine Event ID 4688 to confirm occurrences of "ScriptRunner.exe" being started. Check the `CommandLine` field for patterns resembling `-appvscript`, which pertains to legitimate usage.

  - **Validate command line arguments:** Look for instances of `CommandLine` containing suspicious parameters. Malicious arguments will often not conform to typical App-V deployment patterns designed for legitimate application execution.

  - **Assess parent process relationships:** Investigate the parent process of "ScriptRunner.exe" by analyzing the `ParentProcessId` field in Event ID 4688 logs. A process creation from known trusted applications indicates benign usage, while unexpected parent processes (e.g., cmd.exe or powershell.exe) may signal malicious activity.

  - **Correlate with other logs:** Cross-reference findings with Sysmon logs (Event ID 1) to verify any network connections or signals associated with the execution of "ScriptRunner.exe." Establish whether unusual connections or file creation events occurred during the same timeline.

  - **Understand legitimate use cases:** Identify situations in which "ScriptRunner.exe" might run legitimately, such as during scheduled tasks or application launches associated with App-V, in order to distinguish benign operations from potential threats.

  ### Prioritization

  This alert should be treated with medium severity due to the potential risks associated with script execution through a trusted binary. While not all instances indicate malicious intent, the risk of abuse for lateral movement or payload delivery exists, warranting prompt attention.

  ### Blind Spots and Assumptions

  Detection may be limited by environments not utilizing Windows process creation event logging effectively. Adversaries might employ alternative scripts or executables to bypass this detection method. Additionally, legitimate App-V operations often trigger this alert, complicating investigations. A related detection for improved coverage would be monitoring for unauthorized PowerShell executions, which commonly accompany such tactics.

