logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ScriptRunner.exe'
  - OriginalFileName: 'ScriptRunner.exe'
  selection_cli:
    CommandLine|contains: ' -appvscript '
  condition: all of selection*
falsepositives:
- Legitimate use when App-v is deployed
level: medium
note: |
  ### Technical Context

  This rule detects the execution of "ScriptRunner.exe" with specific command-line arguments that indicate potential abuse for obfuscating the execution of scripts. Attackers may use this approach to bypass application whitelisting mechanisms, concealing malicious activity. The relevant MITRE ATT&CK tactic involved is **Execution (T1203)**, with the technique identified as **Application Layer Protocol (T1218)**.

  The primary telemetry sources include Windows process creation logs, specifically looking for Event ID 4688. If exploited, an adversary could leverage this for executing unauthorized scripts in the environment, leading to data exfiltration, lateral movement, or further exploitation. It is essential to note that this detection does NOT confirm malicious intent on its own, as legitimate usage is possible in environments utilizing App-V for application virtualization.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID 4688 for instances of "ScriptRunner.exe" with the exact command line containing " -appvscript". Malicious usage often derives from unusual paths or untrusted sources.

  - **Identify the running user:** Correlate the Event ID 4688 data with user account activity. Investigate any high-risk or likely compromised user accounts executing "ScriptRunner.exe".

  - **Analyze command line context:** Assess the full command line. Legitimate use will typically include expected paths and configurations for App-V; deviations may indicate misuse.

  - **Inspect for related file activity:** Check file creation events (Event ID 4663) for scripts or files created shortly before or after the "ScriptRunner.exe" execution. Malicious execution often leads to nearby file artifacts being created.

  - **Review App-V configuration:** Validate whether legitimate App-V deployments are in place. Misconfiguration could lead to unauthorized uses of "ScriptRunner.exe" if not aligned with organizational policies.

  - **Threat intelligence check:** Look for any known indicators of compromise (IOCs) associated with "ScriptRunner.exe" from threat intelligence feeds, focusing on connections or payloads that are recognized as malicious.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on managed endpoints that could facilitate broader network compromise. While the likelihood of abuse is moderate, given the legitimate use cases in App-V environments, this behavior has been weaponized by advanced adversaries for stealthy script execution.

  ### Blind Spots and Assumptions

  Detection limitations exist related to potential misuse of legitimate toolsets, as "ScriptRunner.exe" may trigger this alert during acceptable uses in App-V contexts. Reliable detection requires that Windows Security Event Logs are configured correctly. Legitimate application packages may occasionally invoke "ScriptRunner.exe", which could lead to false positives. Monitoring process invocation patterns and correlating with network activity can strengthen overall detection capabilities. Companion detections that monitor failed or unusual file access attempts could provide additional context for suspicious activities linked to this execution.

