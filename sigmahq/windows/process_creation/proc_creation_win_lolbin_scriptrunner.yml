title: Use of Scriptrunner.exe
id: 64760eef-87f7-4ed3-93fd-655668ea9420
status: test
description: The "ScriptRunner.exe" binary can be abused to proxy execution through
  it and bypass possible whitelisting
references:
- https://lolbas-project.github.io/lolbas/Binaries/Scriptrunner/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-01
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ScriptRunner.exe'
  - OriginalFileName: 'ScriptRunner.exe'
  selection_cli:
    CommandLine|contains: ' -appvscript '
  condition: all of selection*
falsepositives:
- Legitimate use when App-v is deployed
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of `Scriptrunner.exe`, a legitimate Windows binary that can be abused for malicious purposes. Attackers may employ this tool to execute scripts with escalated privileges, bypass whitelisting mechanisms, or hide malicious activities that would otherwise be flagged by security tools. The usage of this binary can signify an attempt to run unauthorized scripts or manipulate application virtualization workflows for nefarious objectives.

  The primary tactics identified within the MITRE ATT&CK framework that apply to this detection include **Defense Evasion (TA0005)**, primarily through **T1218: Signed Binary Proxy Execution** due to the use of a legitimate executable for executing malicious scripts. The detection logic focuses on identifying the command-line parameters that indicate potentially unauthorized or suspicious executions of `Scriptrunner.exe`, particularly monitoring for indicators like the inclusion of `-appvscript`.

  The best sources of telemetry for detecting this behavior are process creation event logs from Windows systems. These logs will reveal the execution of processes and the corresponding command lines, which are critical for understanding the context in which `Scriptrunner.exe` is being utilized.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the Windows process creation logs to identify instances of `Scriptrunner.exe`. Pay close attention to the command line used during execution to detect unusual parameters.
  - **Correlate with User Activity**: Investigate the accounts that initiated the execution of `Scriptrunner.exe`. Determine if the user behavior aligns with legitimate usage, especially in environments where App-v is employed.
  - **Analyze Related Scripts**: If `Scriptrunner.exe` was used to execute a script, locate and review the script files and their command lines. Assess whether the scripts perform any anomalous or potentially harmful actions.
  - **Check for Whitelisting Bypasses**: Evaluate existing security controls and whitelisting policies that may be in place. Analyze any reports of legitimate application virtualization utilization to ascertain if the alerts are indeed indicative of malicious behavior.

  ### Prioritization
  This alert has a medium severity because while `Scriptrunner.exe` can indicate a benign action in environments where Application Virtualization is deployed, its misuse for executing unauthorized scripts poses a significant threat to the integrity and security of enterprise systems.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments lacking comprehensive logging for process creation events or where `Scriptrunner.exe` is frequently used legitimately. The detection logic assumes that any command line including `-appvscript` is suspicious, which might not always be accurate in a properly managed App-v context. Proper configuration of logging and monitoring for process creation is essential for this alert to function correctly, as well as maintaining an awareness of legitimate usage patterns that may trigger false positives.

