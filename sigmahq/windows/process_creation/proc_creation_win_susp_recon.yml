  ---

  ### Technical Context

  This Sigma rule detects the usage of command-line utilities such as `tree`, `WMIC`, `doskey`, and `sc` for automated information collection, which is a common behavior associated with reconnaissance actions within a compromised environment. Attackers may aim to gather system or network data to identify assets and vulnerabilities. This behavior aligns with the MITRE ATT&CK tactic of **Collection (TA0009)** and technique **System Information Discovery (T1119)**.

  The primary telemetry sources are Windows process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, focusing on the command-line arguments that indicate a redirection of output to temporary directories. If malicious, the activity could reveal sensitive system information and aid in further exploitation. However, this detection alone does not confirm malicious intent, as these command-line tools can be legitimately used by system administrators for maintenance tasks.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 that capture the command-line execution of `tree`, `WMIC.exe`, `doskey.exe`, or `sc.exe`. Confirm the event contains output redirection to `%TEMP%` or `%TMP%`.

  - **Assess parent process relationships:** Investigate the parent process of the detected commands. If the parent command line indicates legitimate administrative actions, it may suggest benign behavior rather than malicious intent.

  - **Verify user and role participation:** Confirm the user account executing the commands. Administrative users may have legitimate reasons for running these commands, while unexpected executions by non-privileged accounts could be suspicious.

  - **Identify high-confidence indicators:** Look for account activity involving non-standard or external accounts executing the aforementioned processes. Alerts generated by unfamiliar user accounts can indicate potential compromise.

  - **Check for additional artifacts:** Validate the contents of the `%TEMP%` and `%TMP%` directories for newly created files or scripts, especially those containing information dumps or logs, which could signify malicious reconnaissance efforts.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the possibility of system information gathering that could facilitate further attacks. However, the likelihood of malicious abuse may vary based on the user context, as legitimate tools may be utilized by authorized personnel, making context around execution critical.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the utilities or using scripting languages to execute similar reconnaissance tasks without triggering the alert. This detection relies heavily on process creation logs; if these logs are incomplete, effective monitoring may be compromised. Legitimate administrative tasks such as routine system checks could inadvertently trigger this alert. Companion detections around service enumeration or file system access trends would enhance overall coverage and reduce false positives.

