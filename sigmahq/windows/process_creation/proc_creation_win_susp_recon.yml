  ---

  ### Technical Context

  This Sigma rule detects the use of specific command-line tools such as WMIC, tree, and sc.exe that are commonly employed by attackers to gather system information or perform reconnaissance within a network. The likely attacker objective is to enumerate system details, identify users and groups, or check service statuses to plan further malicious activities. This behavior is aligned with the MITRE ATT&CK techniques for collection, specifically T1119: `Automated Collection`.

  The primary telemetry sources include process creation logs from Windows Event ID 4688 and Sysmon Event ID 1, which indicate when these tools are executed. The security impact could be significant if malicious, as it may indicate an adversary's attempt to gather sensitive data for further attacks. However, it's crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative or operational tasks may also invoke these utilities.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 4688 or Sysmon Event ID 1 for the execution of `wmic.exe`, `tree.com`, and `sc.exe`. Validate the command-line arguments to determine intent.

  - **Analyze parent command lines:** Look for instances where the `ParentCommandLine` contains redirection signs like `> %TEMP%\` or `> %TMP%\`. This could indicate an attempt to covertly output data to a temporary location.

  - **Identify legitimate usage patterns:** Determine if the identified processes were initiated by known administrative scripts or tools. Consult documentation to verify expected behavior within your environment for legitimate system administration.

  - **Correlate with user activity:** Investigate the user context under which these processes ran. Suspicious activity by non-administrative users may indicate a potential security compromise.

  - **High-confidence indicators:** Pay attention to executions of `sc.exe` or `wmic.exe` that run with unusual command-line options not typically seen in normal operations, such as querying all users or services.

  - **Assess for data extraction:** Check for file creation or modification within the `%TEMP%` directory linked to the detected processes, as it may suggest an attempt to collect or exfiltrate data.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on critical systems. The likelihood of malicious abuse is present as tools for collecting information are commonly weaponized in the reconnaissance phase of an attack. Prompt analysis is crucial, especially in environments with sensitive data.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by the suppression of command-line logging or environments where command-line redirection is prevalent for legitimate tasks. Ensure Windows process creation logging is enabled for comprehensive coverage. Legitimate administrative tasks involving these commands may trigger alerts, so contextual analysis is vital. A related detection involving unauthorized access to sensitive user data can enrich analysis and provide a broader detection strategy.

