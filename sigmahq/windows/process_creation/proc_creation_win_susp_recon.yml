note: |
  ### Technical Context
  This detection rule identifies potential reconnaissance activities using the Windows Command Prompt. Specifically, it looks for the execution of commands that export information to temporary files, which could indicate an adversary probing for sensitive internal data. In the context of a cyber intrusion, an attacker may leverage tools like `WMIC`, `tree`, or `sc` to extract valuable information about system configurations or user accounts after gaining initial access. The objective is typically to gather intelligence that aids in further exploitation or lateral movement within the network.

  Related to this activity are the MITRE ATT&CK techniques under the **Collection** tactic, particularly **T1119: Automated Collection**. In this scenario, the threat actor may utilize automated command-line tools to harvest data undetected by traditional security measures. This behavior raises concerns about data exfiltration and unauthorized information access.

  The primary data sources for this detection rule are process creation events from Windows, specifically monitoring for the invocation of these commands and analyzing the command line parameters used during execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate logs for instances where `tree.exe`, `WMIC.exe`, `doskey.exe`, or `sc.exe` were executed, focusing on the command line arguments that suggest data exports to temporary files.

  - **Analyze Parent Command Lines**: Look for command lines that reference redirection operators, particularly those containing `> %TEMP%\` or `> %TMP%\`, which could indicate an attempt to capture and store command output.

  - **Correlate with User Activity**: Determine whether the executing user has legitimate reasons for conducting such data exports, checking for any unusual patterns or behaviors that deviate from their normal activity.

  - **Search for Anomalous Activity**: Use threat hunting techniques to find patterns or anomalies linked to the detected activity, considering cross-references with other telemetry sources like authentication logs or endpoint protection alerts.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of improper data access and the likelihood that such activities could indicate a larger compromise or lateral movement within the enterprise environment. Quick response is crucial to mitigate risks associated with the discovery of sensitive data by adversaries.

  ### Blind Spots and Assumptions
  While this detection focuses on specific command-line tools and output redirection patterns, it may not cover all methods adversaries might use for data collection, such as PowerShell or third-party utilities. The logic assumes that these commands are abnormal for the context of normal user behavior. Additionally, appropriate logging configurations must be enabled to capture comprehensive process creation events for this rule to be effective. Gaps may exist if certain filesystems or environments are improperly monitored, leading to missed detections.

