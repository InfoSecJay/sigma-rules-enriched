note: |
  ### Technical Context

  This Sigma rule detects the execution of specific Windows command-line tools (tree.com, WMIC.exe, doskey.exe, sc.exe) that are commonly used for gathering system information and data collection by adversaries. The likely objective of the attacker is to enumerate system configurations, gather installed software, or discover user accounts, thereby facilitating further exploitation. This behavior aligns with the MITRE ATT&CK technique T1119 (Automated Collection). The primary telemetry sources include Windows process creation logs (Event ID 4688) that capture details of executed processes, including their command-line arguments and parent process information. If confirmed malicious, this behavior could lead to unauthorized data exposure or compromise of sensitive system information. It is important to note that this detection does NOT confirm the intent behind the command execution; legitimate system administration tasks may trigger the same behavior.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for instances of tree.com, WMIC.exe, doskey.exe, or sc.exe. Look for command-line arguments containing output redirection to the TEMP folder (e.g., `> %TEMP%\`). Legitimate usage may involve administrative tasks but with different command structures.

  - **Track parent process investigation:** Identify the parent process of the detected command using the `ParentProcessId` field in Event ID 4688. Malicious parent processes may indicate exploitation techniques, while benign parents usually involve known administrative tools like PowerShell or cmd.exe.

  - **Inspect for output redirection:** Look specifically for command-line patterns containing `> %TEMP%\` or `> %TMP%\`. Presence of these patterns raises suspicion; legitimate outputs might not redirect to temporary files.

  - **Correlate with other suspicious activities:** Check for concurrent suspicious activities in the same time frame using artifacts like PowerShell logs (Event ID 4103) or network logs indicating unusual outbound connections. This may reveal broader malicious objectives.

  - **Validate file presence in temporary directory:** Search the %TEMP% directory for new or suspicious files generated during the timeframe of suspicious process execution. Malicious files may include unexpected scripts or executable files created by the command output.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on the affected system if the process is used maliciously. While the behavior can signal reconnaissance activities commonly employed by attackers, it could also arise from legitimate administrative functions. Consequently, analysts should assess contextual details before escalating.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via renaming tools or using other similar utilities not captured by this rule. A thorough logging configuration is required, including process creation auditing, to ensure reliable detection. Legitimate activities may involve system audits or troubleshooting operations leading to similar command usage. A related detection could be monitoring for unexpected PowerShell usage (T1059.001) to strengthen coverage of automated data collection behaviors.

