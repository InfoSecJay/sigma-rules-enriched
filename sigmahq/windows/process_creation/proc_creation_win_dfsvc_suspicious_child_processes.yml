title: Potentially Suspicious Child Process Of ClickOnce Application
id: 67bc0e75-c0a9-4cfc-8754-84a505b63c04
status: test
description: Detects potentially suspicious child processes of a ClickOnce 
  deployment application
references:
- https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-12
tags:
- attack.execution
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|contains: '\AppData\Local\Apps\2.0\'
    Image|endswith:
            # Add more suspicious processes
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\explorer.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\nltest.exe'
    - '\notepad.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\schtasks.exe'
    - '\werfault.exe'
    - '\wscript.exe'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious child processes initiated by ClickOnce deployed applications, specifically targeting known Windows utilities often misused for malicious purposes. The likely attacker objective is exploiting the ClickOnce framework to execute untrusted code, potentially bypassing security mechanisms like Windows SmartScreen. This detection aligns with the MITRE ATT&CK technique of "Execution via Application Layer Protocol" (T1203) and "Process Injection" (T1055).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 (for process creation), detailing the parent and child process relationships. If malicious, the security impact includes unauthorized execution of harmful code or payloads that could lead to data compromise or system takeover. It is crucial to note that this detection does NOT confirm malicious activity on its own; further investigation is required to establish intent.

  ### Investigation Steps

  - **Review parent process context:** Verify the **ParentImage**: Check if it indeed comes from **C:\Users\[USERNAME]\AppData\Local\Apps\2.0\**. A legitimate ClickOnce application will have valid paths related to its deployments.

  - **Identify the child processes:** Analyze the **Image** paths against configured objects in the Sigma rule: Look for processes such as `calc.exe`, `cmd.exe`, or `powershell.exe`. Malicious behavior would exhibit these processes being spawned unexpectedly from the ClickOnce deployment path.

  - **Check execution timing and frequency:** Examine **Event ID 4688** timestamps. High-frequency execution within a short time frame could indicate automation scripts or malicious activity; legitimate apps may not exhibit this pattern.

  - **Investigate correlating logs for signs of abuse:** Cross-reference with application logs to see if these processes were used to launch network connections (e.g., **Event ID 5156** for Windows Filtering Platform logs). Unexpected outbound connections may signal command and control (C2) communication.

  - **Review user activity history:** Validate if the user commonly runs ClickOnce applications or related processes. Check **Event ID 4672** for special privileges that may accompany unusual behavior to distinguish between benign and potential malicious actions.

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on sensitive systems, especially if the processes detected are common targets for exploitation. The likelihood of misuse exists, given the known abuse of ClickOnce mechanisms by attackers to execute payloads. This behavior is increasingly weaponized in phishing campaigns, making timely investigation critical.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as process renaming or legitimate application misuse. It is essential to ensure complete log coverage from process creation events to accurately capture this behavior. Legitimate administrative activities, including system maintenance tasks leveraging these utilities, may trigger the rule. A complementary detection to consider is monitoring for `PowerShell` command execution and unusual script activities to bolster coverage around potentially malicious automation.

