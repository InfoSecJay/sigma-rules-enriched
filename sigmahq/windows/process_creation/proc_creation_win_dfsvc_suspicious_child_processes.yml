logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|contains: '\AppData\Local\Apps\2.0\'
    Image|endswith:
            # Add more suspicious processes
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\explorer.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\nltest.exe'
    - '\notepad.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\schtasks.exe'
    - '\werfault.exe'
    - '\wscript.exe'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of potentially malicious child processes that originate from a ClickOnce application, specifically those found in the user profile paths. The likely attacker objective is to leverage trusted ClickOnce deployments to execute unauthorized or harmful commands, disguising their malicious activities as legitimate application behavior. This behavior fits into the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Process Injection (T1055).

  The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which log details about process creation events. If malicious, these activities indicate an attempt to execute unauthorized commands or code, which may lead to further system compromise or data exfiltration. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate applications might perform similar actions under certain circumstances.

  ### Investigation Steps

  - **Check process command lines:** Review the CommandLine field in Security Event ID 4688 for suspicious parameters that may indicate unauthorized usage. For example, an unusual invocation of `powershell.exe` with obfuscated scripts would be suspicious.

  - **Identify parent-child process relationships:** Validate the ParentImage for processes created under user profile paths like `\AppData\Local\Apps\2.0\`, particularly for those that spawn commonly abused programs like `powershell.exe` or `cmd.exe`. Legitimate child processes may typically follow standard application workflows that do not involve unusual argument lists.

  - **Analyze timing and frequency of alerts:** Review the timestamps of the detected process creations for patterns or recurrent triggering events. Frequent executions might indicate an automated malicious script, while isolated occurrences might warrant further investigation into the user’s activities.

  - **Investigate system integrity:** Use Sysinternals tools (e.g., Process Explorer) to verify the originality and integrity of the identified processes. Check for any signs of tampering or modification of `cmd.exe` or `powershell.exe`, as these are commonly exploited.

  - **Correlate with other logs:** Look into Windows Event Logs for related system events around the time of process creation, such as Security Event ID 4624 (logon) or any authentication-related events. This helps establish if a genuine user initiated the process.

  ### Prioritization

  The alert has medium severity as it involves potentially malicious execution patterns from a trusted application context. The affected systems may have critical roles within the organization, increasing the potential impact if exploited. This behavior has been weaponized in advanced attacks, making prompt examination essential.

  ### Blind Spots and Assumptions

  Detection may be limited by user account control settings or filtering of logs that could obscure evidence of malicious activities. Additionally, legitimate activities such as automated application updates or installation could trigger the same alerts. It is advisable to complement this detection with monitoring for suspicious PowerShell activity (e.g., T1059.001) to strengthen coverage against misuse of the environment.

