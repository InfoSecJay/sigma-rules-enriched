title: Potentially Suspicious Child Process Of ClickOnce Application
id: 67bc0e75-c0a9-4cfc-8754-84a505b63c04
status: test
description: Detects potentially suspicious child processes of a ClickOnce deployment
  application
references:
- https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-12
tags:
- attack.execution
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|contains: '\AppData\Local\Apps\2.0\'
    Image|endswith:
            # Add more suspicious processes
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\explorer.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\nltest.exe'
    - '\notepad.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\schtasks.exe'
    - '\werfault.exe'
    - '\wscript.exe'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potentially suspicious child processes spawned by a ClickOnce deployment application. ClickOnce is a Microsoft technology that allows for the deployment of Windows applications through a web browser. However, attackers can leverage ClickOnce to execute malicious scripts or binaries under the guise of legitimate applications. This detection aims to identify instances where common administrative or scripting tools are invoked as child processes of a ClickOnce application, which could indicate malicious activity or code execution beyond the intended application scope.

  The likely attacker objective is to execute potentially harmful commands or deploy additional payloads while bypassing security measures through the ClickOnce framework. Such activity could be linked to various threat actors employing tactics for execution and evasion, thereby enhancing their operational stealth. Relevant MITRE ATT&CK techniques include **T1064: Scripting** and **T1203: Exploitation for Client Execution**, with tactics in both **Execution** and **Defense Evasion** categories.

  Primary data sources for this detection include process creation events from Windows systems, which log details about when and how processes are created, including the parent-child relationship that reveals potential misuse of ClickOnce.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events associated with ClickOnce applications to identify suspicious child process relationships and verify their legitimacy.
  - **Analyze Parent-Child Relationships:** Investigate the hierarchy of processes, specifically observing the parent process (the ClickOnce application) and any associated child processes to determine abnormal execution patterns.
  - **Investigate Suspicious Executions:** Focus on commonly exploited executables such as `cmd.exe`, `powershell.exe`, and others listed in this rule to check for unusual command-line parameters or contexts that may indicate malicious intent.
  - **Correlate with User Actions:** Assess user activity logs and behaviors around the time the suspicious child processes were launched to establish context and whether there were any unusual interactions with the ClickOnce application.

  ### Prioritization
  The alert's severity is classified as medium because while child processes of ClickOnce applications may indicate legitimate usage, their exploitation for potentially malicious activities presents a concerning risk to enterprise environments. Immediate investigation is warranted to differentiate between legitimate and suspicious activity.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if ClickOnce application usage is rare in the environment or if user actions surrounding the launches are not logged adequately. An assumption made by the detection logic is that legitimate usage patterns of ClickOnce are known and thus can be differentiated from malicious ones. Properly configured process creation event logging is essential for this alert to function effectively, and missing or inadequate logs from Windows devices can reduce detection capabilities.

