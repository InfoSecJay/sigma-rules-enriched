title: Arbitrary File Download Via ConfigSecurityPolicy.EXE
id: 1f0f6176-6482-4027-b151-00071af39d7e
status: test
description: |
  Detects the execution of "ConfigSecurityPolicy.EXE", a binary part of Windows Defender used to manage settings in Windows Defender.
  Users can configure different pilot collections for each of the co-management workloads.
  It can be abused by attackers in order to upload or download files.
references:
- https://lolbas-project.github.io/lolbas/Binaries/ConfigSecurityPolicy/
author: frack113
date: 2021-11-26
modified: 2022-05-16
tags:
- attack.exfiltration
- attack.t1567
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - CommandLine|contains: ConfigSecurityPolicy.exe
  - Image|endswith: '\ConfigSecurityPolicy.exe'
  - OriginalFileName: 'ConfigSecurityPolicy.exe'
  selection_url:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of "ConfigSecurityPolicy.EXE" with the inclusion of HTTP/FTP links in the command-line arguments. The behavior suggests that this binary, normally used for managing Windows Defender settings, is being exploited to download files from the internet, which could be a precursor to data exfiltration. The likely attacker objective is to transfer files from a compromised system outside the organization. The relevant MITRE ATT&CK tactics and techniques include Exfiltration (T1567) and the use of User Execution (T1203).

  Primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688 and Sysmon Event ID 1, which record process initiation. The security impact is significant if malicious, as it indicates potential data compromise. It's important to note that this detection does NOT confirm malicious intent by itself; it may be used for legitimate administrative actions as well.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for instances of "ConfigSecurityPolicy.EXE" to identify when and how it was executed, focusing on the `CommandLine` and `ParentProcessId` fields for possible correlation with known malicious processes.

  - **Analyze command-line arguments:** Specifically look for the presence of URLs (ftp, http, https) in the command-line arguments associated with the execution to identify unauthorized file transfer attempts.

  - **Review network traffic:** Cross-reference any detected command line with network logs for outbound connections to the URLs listed. Use firewall or NetFlow logs to look for unusual data transfers matching the detected execution time.

  - **Establish expected behavior:** Identify legitimate uses of "ConfigSecurityPolicy.EXE" in your environment, typically used by IT for policy management. Highlight how administrative tasks may not typically include direct commands to download files from external sources.

  - **Identify high-confidence malicious indicators:** Correlate execution with previous alerts or known malicious IPs associated with the URLs used in the command line to enhance the likelihood of identifying malicious exploitation.

  - **Validate file creation or manipulation:** Check for modifications in directories commonly used for data storage (e.g., Downloads, Desktop) following the execution. Look for unusual file downloads or files suspiciously altered just after the process execution in Event ID 4663.

  ### Prioritization

  This alert carries medium severity due to the potential for file exfiltration from critical systems. High-value targets or sensitive assets being involved increases the urgency of response. Malicious use of this executable is increasingly common in supply chain attacks and could lead to significant data breaches if left unchecked.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative uses of "ConfigSecurityPolicy.EXE," leading to false positives. Ensure logging is correctly configured to capture command-line arguments and process details for reliable detection. Legitimate IT administrative actions may similarly trigger the alert, particularly those involving policy adjustments. A related detection to strengthen coverage includes monitoring for suspicious outbound connections to unusual domains or IPs after execution of other system management tools.

