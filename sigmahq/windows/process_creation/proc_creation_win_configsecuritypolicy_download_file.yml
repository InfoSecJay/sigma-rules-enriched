title: Arbitrary File Download Via ConfigSecurityPolicy.EXE
id: 1f0f6176-6482-4027-b151-00071af39d7e
status: test
description: |
  Detects the execution of "ConfigSecurityPolicy.EXE", a binary part of Windows Defender used to manage settings in Windows Defender.
  Users can configure different pilot collections for each of the co-management workloads.
  It can be abused by attackers in order to upload or download files.
references:
- https://lolbas-project.github.io/lolbas/Binaries/ConfigSecurityPolicy/
author: frack113
date: 2021-11-26
modified: 2022-05-16
tags:
- attack.exfiltration
- attack.t1567
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - CommandLine|contains: ConfigSecurityPolicy.exe
  - Image|endswith: '\ConfigSecurityPolicy.exe'
  - OriginalFileName: 'ConfigSecurityPolicy.exe'
  selection_url:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of "ConfigSecurityPolicy.EXE", a legitimate binary associated with Windows Defender, which attackers might exploit to upload or download arbitrary files. The detection logic is based on identifying command line arguments and the image path associated with this binary, particularly looking for indications of undesirable network activity (e.g., connections initiating to external URLs).

  Attackers may leverage this binary to exfiltrate sensitive organizational data or import malicious payloads without raising immediate alarms, as the tool is a native Windows application. The threat scenarios include data theft and lateral movement within the network, indicative of advanced persistent threat (APT) operations. The relevant MITRE ATT&CK tactics/techniques include **Exfiltration** (TA0010) and **Exfiltration Over Application Layer Protocol** (T1567).

  The primary data sources that will yield the most compelling evidence for this detection are **process creation logs** that record command line execution parameters, and **network logs** that capture any outbound traffic to associated URLs (HTTP/HTTPS).

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of ConfigSecurityPolicy.EXE execution. Pay attention to the command line used for execution to identify any anomalous parameters that could indicate misuse.
  - **Analyze Network Traffic:** Inspect network logs for any suspicious outbound connections made by ConfigSecurityPolicy.EXE, especially those targeting FTP or HTTP/HTTPS endpoints that are not recognized as part of normal operations.
  - **Check System Events:** Investigate system event logs for any associated events that may relate to file uploads or downloads at the time of the process execution, particularly looking for large or unexpected data transfers.
  - **Correlate with User Behavior:** Assess the context of the user account executing the command. Investigate whether the action fits within the user's normal activities or if it appears to be associated with unauthorized data access or transfer.

  ### Prioritization
  The alert has a medium severity level due to the potential for significant data loss through exfiltration or the introduction of malicious code. Given the nature of the ConfigSecurityPolicy.EXE binary, the likelihood of misuse is moderate but significant enough to warrant immediate investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if the ConfigSecurityPolicy.EXE binary is executed in scenarios that do not generate process creation logs or if network logs do not capture all outbound connections. The detection logic assumes that any use of this binary outside its standard operational context is malicious; however, legitimate administrative actions might lead to false positives. Required logs for this rule to function effectively include comprehensive process creation logs and accurate network traffic logs capturing all outbound connections.

