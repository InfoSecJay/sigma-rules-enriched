detection:
  selection_cmd:
  - CommandLine|contains:
    - 'copy-item'
    - 'copy '
    - 'cpi '
    - ' cp '
    - 'move '
    - 'move-item'
    - ' mi '
    - ' mv '
  - Image|endswith:
    - '\esentutl.exe'           # akira ransomware
    - '\xcopy.exe'
    - '\robocopy.exe'
  - OriginalFileName:
    - 'esentutl.exe'
    - 'XCOPY.EXE'
    - 'robocopy.exe'
  selection_path:
