note: |
  ### Technical Context

  This rule detects the potential exfiltration of web browser-stored credentials by looking for specific file manipulation commands targeting common browser user data directories. Attackers might seek to harvest usernames and passwords saved in browsers to facilitate unauthorized access to accounts and sensitive information. The relevant MITRE ATT&CK tactics and techniques include Credential Access (T1555.003) for acquiring user credentials from browsers.

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688, which captures when new processes are created, along with the command line and image path details. If this behavior is indeed malicious, it could indicate an attempt to compromise user accounts or escalate privileges within the network. Importantly, this detection does NOT confirm user credential theft; it only signals suspicious activity involving browser data files.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 to identify the creation of processes with suspicious command lines that include 'copy-item', 'move', and related verbs, especially those involving `esentutl.exe`, `xcopy.exe`, or `robocopy.exe`.

  - **Examine command lines**: Look for instances where the command line includes paths to browser user data directories, such as `\Google\Chrome\User Data\` or `\Mozilla\Firefox\Profiles`. Legitimate process creations usually contain common user activities and paths not involving browser data dumps.

  - **Identify file access times**: Review file access and modification times for sensitive data in the browser profiles (such as login data files), checking against the timestamps of the detected process creation. Legitimate access should align with known user activity periods.

  - **Correlate with user activity**: Validate the user associated with the alert against recent logged-in sessions or other legitimate actions to rule out benign scenarios where data manipulation was performed by authorized users or during expected maintenance.

  - **Look for simultaneous malicious activity**: Check for other alerts or logs indicating unusual behavior correlating with the process creation, such as attempts to disable security software or unusual outbound communication that could suggest data exfiltration.

  ### Prioritization

  This alert should be classified as medium severity due to the critical nature of credential data, especially if targeting high-privilege accounts. The likelihood of malicious abuse remains moderate, as the technique is known but may also arise from benign administrative practices or software updates. The behavior is somewhat weaponized, given the commonality of credential harvesting methods employed by attackers.

  ### Blind Spots and Assumptions

  This detection may be circumvented by tools that utilize obfuscation or are designed to bypass conventional logging (e.g., anti-virus evasion techniques). Required logs must be configured to capture detailed process creation data and command line arguments consistently. Legitimate activities that could trigger the alert include software updates or IT administrator tasks that require file manipulation within user data folders. Related detections, such as monitoring for anomalies in user login patterns or network traffic anomalies, could reinforce the coverage against credential theft attempts.

