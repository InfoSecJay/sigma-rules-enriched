level: high
note: |
  ### Technical Context

  This rule detects the execution of the "msxsl.exe" binary with an HTTP keyword in the command line, which can indicate an attempt to execute XSL files remotely. The likely attacker objective is to leverage the processing capabilities of XSL transformations potentially to obfuscate malicious payloads or exfiltrate sensitive data. This behavior maps to the MITRE ATT&CK technique T1220 - "XSL Script Processing," which falls under the "Defense Evasion" tactic.

  The primary telemetry source is Windows process creation logs, predominantly captured through Security Event ID 4688, which records process creation details, and Sysmon Event ID 1. If malicious, this activity could lead to unauthorized access, data exfiltration, or lateral movement within the environment. This detection does NOT confirm that an actual intrusion has occurred, only the possibility of a potentially malicious behavior requiring further investigation.

  ### Investigation Steps

  - **Check process creation logs: Identify the event details:** Review Security Event ID 4688 and Sysmon Event ID 1 for the execution parameters of msxsl.exe, specifically focusing on the command line arguments for the presence of 'http'.

  - **Correlate with known benign applications:** Verify if msxsl.exe execution is expected on the asset. Most enterprise systems will not have msxsl.exe installed, making its presence a red flag.

  - **Assess network connections:** Utilize network logs to check for any outbound connections initiated by msxsl.exe. Look for unusual patterns or connections to known malicious IP addresses or domains.

  - **Identify high-confidence malicious indicators:** Confirm if cmd.exe or powershell.exe were used to invoke msxsl.exe, as these processes often indicate attempts to execute potentially harmful scripts.

  - **Examine file activity related to XSL files:** Investigate for file creation events involving XSL files using Windows Event ID 4663 or Sysmon Event ID 11 to detect interactions with files that could be used maliciously.

  - **Evaluate user context:** Determine the account that executed msxsl.exe and whether it has the necessary privileges. Investigate if this user has a history of legitimate tasks involving XSL file processing.

  ### Prioritization

  Given the potential impact of the affected systems—especially if they handle sensitive data—the detection is of high severity. The behavior observed is not commonly legitimate and can be directly associated with advanced adversarial tactics seeking to exploit XSL processing for malicious purposes.

  ### Blind Spots and Assumptions

  This rule may miss legitimate executions of msxsl.exe that occur for valid administrative tasks. The absence of msxsl.exe from commonplace installations increases the likelihood of false positives. For reliable detection, ensure that both Security and Sysmon logging are enabled on endpoints. Additionally, monitoring command line activities in conjunction with process execution logs can yield stronger coverage against similar threats, including potential misuse of PowerShell for remote script execution.

