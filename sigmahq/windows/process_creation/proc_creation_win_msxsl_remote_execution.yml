level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the `msxsl.exe` binary with an "http" keyword present in the command line arguments. The usage of `msxsl.exe` in such a context suggests that the executable is being leveraged for potentially malicious purposes, specifically remote execution of Extensible Stylesheet Language (XSL) files. This behavior may indicate an adversary attempting to exploit the deprecated tool for remote code execution or data exfiltration. The primary objective of such an attack is likely to manipulate XML data in a way that undermines system integrity or accesses sensitive data.

  Relevant MITRE ATT&CK tactics for this detection include **Execution (TA0002)**, as the execution of a malicious command is indicative of active exploitation, and **Defense Evasion (TA0005)**, given that attackers may use tools like `msxsl.exe` to blend in with legitimate processes, hoping to evade detection mechanisms. The specific technique associated with this detection is **T1220: XSL Script Processing**.

  The primary data source for this detection will be **process creation logs** from Windows systems, which capture details about executable files running on the host, including their command-line arguments.

  ### Investigation Steps
  - **Verify Process Creation Logs:** Check the process creation logs for instances of `msxsl.exe` running with "http" in the command line. Record the user context and timestamp for further analysis.
  - **Examine Associated Network Traffic:** Analyze network traffic corresponding to the time of `msxsl.exe` execution. Look for outgoing connections to suspicious or unexpected remote addresses that may have been contacted during execution.
  - **Identify Other Binary Usage:** Investigate other processes running on the same machine to identify potential lateral movement or additional compromises. Correlate any unusual processes that executed around the same time as `msxsl.exe`.
  - **Review User Account Activities:** Audit user activity logs to determine if the user invoking `msxsl.exe` has a legitimate need for this tool, and assess whether the account may have been compromised.

  ### Prioritization
  This alert is considered high severity in an enterprise environment due to the potential for significant impact from remote code execution, which could lead to data breaches, system compromise, or lateral movement within the network.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if `msxsl.exe` has been whitelisted or is present in legitimate workflows within specific environments. The detection logic assumes that any usage of `msxsl.exe` with the "http" keyword indicates malicious intent; however, legitimate use cases may exist. The alert requires proper logging configurations for process creation and might miss instances executed under different tools if there is a reliance on similar techniques but varying command line inputs.

