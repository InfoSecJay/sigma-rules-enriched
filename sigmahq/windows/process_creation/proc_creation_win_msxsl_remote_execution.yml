note: |
  ### Technical Context

  This Sigma rule detects the execution of the "msxsl.exe" binary with an "http" keyword present in the command line arguments. This behavior is characteristic of remote execution attempts where an attacker may leverage an XSLT transformation to fetch and process XML data from a remote source, which could be indicative of exfiltrating sensitive information or executing commands from an external location.

  The likely objective of an attacker using this method would be to manipulate XML data processing for malicious purposes, with possible goals including data exfiltration or lateral movement. This behavior falls under the MITRE ATT&CK tactic of "Execution" and technique T1220: "XSL Transformation". The primary telemetry source for this detection involves process creation logs, specifically focusing on Windows Event ID 4688 or Sysmon Event ID 1.

  If the detected behavior is malicious, the security impact could be significant, leading to data breaches or system compromises. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate processes may occasionally use msxsl.exe for benign purposes, such as system administration tasks.

  ### Investigation Steps

  - **Review process creation events**: Check Windows Event ID 4688 for occurrences of "msxsl.exe" being executed with an "http" argument. The presence of these events, especially from an unexpected user or source path, indicates potential malicious intent.

  - **Correlate with prior activity**: Look for relevant artifacts in Sysmon Event ID 1 that show the command line context and user details. Normal executions may originate from administrative scripts, while anomalies could involve automated or remote sources.

  - **Analyze network connections**: Use logs from network monitoring tools or Windows firewall logs (Event ID 5156) to identify any outbound connections from the host that executed msxsl.exe. Malicious use may reveal connections to unfamiliar external IPs initiating requests.

  - **Inspect system logs for msxsl.exe**: Confirm if msxsl.exe exists on the system and track its installation source. It is deprecated and not commonly present in modern environments, making its appearance suspicious unless part of a legitimate application stack.

  - **Identify benign usage scenarios**: Determine if the process was executed from a typical administrative context. Legitimate uses usually do not traverse the web for XSLT processing; usage would commonly be local or as part of an internal application.

  - **Check for evasion patterns**: Monitor if any unusual command line arguments or suspicious parent processes (as indicated by Sysmon Event ID 1) accompanied the execution. Legitimate command invocations lack complex chaining or obfuscation typically seen in malicious activity.

  ### Prioritization

  This alert should be considered high priority due to the potential for significant impact on confidentiality and integrity when msxsl.exe is used for remote execution. The behavior is not commonly seen in typical enterprise operations, posing a high likelihood of malicious abuse, especially given msxsl.exe's deprecation and limited legitimate use cases in modern environments.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited if logging for process creation events is not configured correctly across all endpoints, particularly at the network boundary. Legitimate administrative tasks or applications that may invoke msxsl.exe for XML processing could trigger false positives without proper context consideration. A companion detection for XSLT payload deliveries via PowerShell (e.g., T1059.001 - Command and Scripting Interpreter: PowerShell) may enhance contextual coverage for identifying potential threats.

