  ---

  ### Technical Context

  The rule detects the silent installation of AnyDesk, a remote access tool that may be leveraged by adversaries to gain unauthorized control over a system. This type of installation typically aims to establish remote persistence and command and control capabilities, allowing attackers to manipulate the system discreetly after exploiting it. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), with the technique identified as "Application Layer Protocol: Remote Access Tools" (T1219.002).

  Primary telemetry sources include Windows process creation logs, specifically focusing on process command line parameters. The security impact of a successful silent installation of AnyDesk is severe, potentially enabling full remote control by an attacker, which could lead to further compromise of sensitive data or lateral movement within the network. It is important to note that this detection alone does not confirm that the installed tool is malicious; it may also be part of legitimate business operations.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID **4688** and Sysmon Event ID **1** for processes associated with AnyDesk. Look specifically at the CommandLine field for `--install --start-with-win --silent`. Legitimate deployments would typically utilize deployment tools or scripts with explicit logging recorded.

  - **Identify unusual command line patterns:** Look for command line arguments in the logs matching the detected pattern. Malicious indicators include the presence of `--install`, `--start-with-win`, and `--silent` together; legitimate activity might involve additional verification, such as `--user-name`, `--password`, indicating a controlled deployment by IT staff.

  - **Cross-check against deployment policies:** Verify if there are documented policies or operational procedures permitting AnyDesk's use within your organization. If there’s no approved deployment column for the device, this could indicate anomalous or malicious intent.

  - **Analyze network traffic:** Use tools like Wireshark to capture traffic associated with AnyDesk. Monitor for outbound connections to known malicious IP addresses or unusual external traffic patterns linked with unattended installations, which could signal command and control activity.

  - **Check recent user activity:** Review logs for user accounts on the affected host that executed the AnyDesk installation. IIS logs or Sysmon Event ID 20 can help identify if the actions were taken by an authenticated user, which can distinguish between benign administrative activity and potential exploitation.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential for significant impact if AnyDesk is installed and misused on critical systems. The likelihood of malicious abuse is high, particularly in environments where remote access is not typically sanctioned. Furthermore, this behavior is commonly weaponized by threat actors for lateral movement and data exfiltration.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if the installations do not include all the specified command line arguments or if remote access tools are included in allowed software lists without proper scrutiny. An adequate configuration of logging for Windows process creation is essential to capture this event effectively. Legitimate activities that may trigger the alert include automated deployments for support use cases. A related detection could involve monitoring for other remote access tools like TeamViewer or Chrome Remote Desktop installations to strengthen coverage of unauthorized access attempts.

