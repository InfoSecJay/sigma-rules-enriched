logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\vivaldi.exe'
  selection_http:
    CommandLine|contains: 'http'
  selection_extensions:
  - CommandLine|endswith:
    - '.7z'
    - '.dat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.ps1'
    - '.psm1'
    - '.txt'
    - '.vbe'
    - '.vbs'
    - '.zip'
  - CommandLine|contains:
    - '.7z"'
    - '.dat"'
    - '.dll"'
    - '.hta"'
    - '.ps1"'
    - '.psm1"'
    - '.txt"'
    - '.vbe"'
    - '.vbs"'
    - '.zip"'
  condition: all of selection_*
