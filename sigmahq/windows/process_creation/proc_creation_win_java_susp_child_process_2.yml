detection:
  selection:
    ParentImage|endswith: '\java.exe'
    Image|endswith:
    - '\bash.exe'
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  filter_main_build:
    ParentImage|contains: 'build'      # excluding CI build agents
    CommandLine|contains: 'build'      # excluding CI build agents
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate calls to system binaries
- Company specific internal usage
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects instances where shell processes (like `cmd.exe`, `PowerShell`, or `bash.exe`) are spawned by the Java executable (`java.exe`). This behavior is often indicative of exploitation attempts, particularly in the context of vulnerabilities within Java applications, such as Log4j. The attacker objective may involve executing arbitrary commands on the system to gain access or achieve persistence.

  The relevant MITRE ATT&CK framework tactics associated with this detection include Initial Access (TA0001) and Execution (TA0002), specifically under techniques such as Exploit Public-Facing Application (T1190) and Command and Scripting Interpreter (T1059). Primary telemetry sources include Windows Process Creation events (Security Event ID 4688) and Sysmon Event ID 1 for detailed process creation tracking. If malicious, this behavior could lead to unauthorized access or greater exploitation of the system. It is important to note that this detection does NOT confirm malicious activity on its own as legitimate applications may invoke shell processes as part of their normal functions.

  ---

  ### Investigation Steps

  - **Correlate process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances where `ParentImage` contains `java.exe` and identify the `Image` path that is being spawned. Compare against known legitimate Java application behaviors.

  - **Analyze command line arguments:** Investigate the CommandLine field in the process creation logs to identify the context of the shell invocation. Legitimate commands may include those with specific parameters for system administration rather than unexpected or encoded payloads.

  - **Assess the context of execution:** Determine if the process was created on a critical asset (e.g., servers handling sensitive data). Identify if the spawning of shell commands correlates with any recent application updates or vulnerability disclosures related to Java.

  - **Identify high-confidence indicators:** Look for known malicious command line patterns or obfuscation techniques in the CommandLine field. For example, encoded strings, or unusual PowerShell commands that appear to perform network operations (e.g., `Invoke-WebRequest`).

  - **Verify against known benign configurations:** Check if this behavior is listed in internal documentation as legitimate, particularly for CI/CD systems. Operations where `java.exe` is invoked in a controlled environment for development purposes should not trigger alerts.

  ---

  ### Prioritization

  This alert has medium severity due to its potential impact on critical servers and its association with previously weaponized exploits like Log4j. While the likelihood of malicious abuse exists, careful attention should be given to the context of the event to discern between legitimate operations and potential threats.

  ---

  ### Blind Spots and Assumptions

  Valid detections can be impacted by evasion techniques such as process hollowing or using different invocation methods that do not trigger standard process creation logs. Required log sources like Sysmon must be adequately configured to ensure comprehensive monitoring, as default Windows telemetry may be insufficient in capturing all necessary details. Legitimate administrative tasks or automation processes may produce similar alerts. Companion detections to strengthen coverage include monitoring for unusual PowerShell activity under T1059.001 to identify potentially scripted commands run post-exploitation.

