logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\java.exe'
    Image|endswith:
    - '\bash.exe'
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  filter_main_build:
    ParentImage|contains: 'build'      # excluding CI build agents
    CommandLine|contains: 'build'      # excluding CI build agents
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate calls to system binaries
- Company specific internal usage
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where a shell process, such as cmd.exe or PowerShell, is spawned by a Java process (java.exe) on a Windows system. This behavior may indicate an exploitation attempt, particularly leveraging vulnerabilities in Java applications—foremost among them being the notorious Log4j vulnerability. Attackers might seek to execute arbitrary commands within a compromised environment, potentially leading to persistent threats, data exfiltration, or lateral movement within the network.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include Initial Access (T1190), Persistence (T1071), and Privilege Escalation (T1068). These tactics highlight the likely objectives behind the detected behavior as attackers may leverage the exploitation of Java applications to gain footholds, maintain persistence, or escalate their privileges within the target environment.

  Primary sources of evidence for this detection include process creation logs that capture command-line arguments and parent-child relationships of executed processes. Analyzing these logs can provide insights into potentially malicious activities initiated through applications vulnerable to exploitation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation events, particularly focusing on instances where java.exe is the parent process, and determine if shell processes are being initiated under suspicious circumstances.

  - **Examine Command-Line Arguments**: For each identified suspicious process, review the associated command-line arguments to identify unusual or unexpected commands that could indicate unauthorized activity.

  - **Correlate with Threat Intelligence**: Assess whether the environments running the detected Java instances are known to have vulnerabilities (such as Log4j) and check for any indications of exploitation activity reported in recent threat intelligence.

  - **Validate Legitimate Uses**: Investigate the context of the discovered activity by validating whether the detected shell executions are part of legitimate system administration or application behavior, thereby minimizing false positives.

  ### Prioritization
  The alert is deemed moderate priority due to its potential implications. Shell processes spawned from Java installations may indicate exploitation attempts, with the capacity for significant damage, including data breaches or system compromise, which necessitates prompt investigation in an enterprise setting.

  ### Blind Spots and Assumptions
  This detection logic may overlook legitimate uses of Java applications that commonly spawn shell processes in controlled environments, leading to potential false positives. Additionally, the current configuration requires comprehensive process creation logging within the Windows environment; any gaps in logging (e.g., lack of command-line details or parent/child relationships) could inhibit the effectiveness of this detection. There is also an assumption that all instances of java.exe are monitored; therefore, any whitelisting of internal applications should be conducted with caution to avoid missing potential threats.

