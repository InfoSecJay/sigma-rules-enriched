detection:
  selection:
    ParentImage|endswith: '\java.exe'
    Image|endswith:
    - '\bash.exe'
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  filter_main_build:
    ParentImage|contains: 'build'      # excluding CI build agents
    CommandLine|contains: 'build'      # excluding CI build agents
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate calls to system binaries
- Company specific internal usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where a shell process (like `cmd.exe` or `powershell.exe`) is spawned from a legitimate Java host process (`java.exe`). Such behavior is typically associated with exploitation attempts, such as those targeting vulnerable Java libraries (e.g., Log4j exploitation) to gain a foothold on a system. The detected behavior corresponds to potential initial access (TA0001) and privilege escalation (TA0004) tactics within the MITRE ATT&CK framework, specifically the techniques of exploiting execution flow (T1203) and process injection (T1055).

  The primary telemetry sources for this detection include Windows process creation logs (Event ID 4688) and potentially Sysmon logs (Event ID 1). If malicious, the alert indicates a high likelihood of unauthorized access or further exploitation of the system. However, this detection alone does not confirm that malicious activity has occurred, as legitimate scripts or automation tasks could also result in similar process creation patterns.

  ### Investigation Steps

  - **Check the parent process: ** Verify that the alert originated from `java.exe` (Event ID 4688 - Process Creation). Confirm the Java process path; legitimate Java applications may spawn shell processes for valid purposes (e.g., script invocation).

  - **Analyze command line arguments: ** Identify the command line used to start the shell process. Look for unusual flags or payloads that may indicate misuse or exploitation techniques (Event ID 4688 - CommandLine field). Legitimate commands usually have predictable parameters, while malicious variations may include obfuscation or uncommon script usages.

  - **Review relevant logs for unusual activity: ** Correlate this activity with network logs (e.g., firewall logs) and any file creation logs. Check for outbound connections or unexpected file access that could indicate attempts to exfiltrate data or connect to command and control servers.

  - **Check for legitimate usage patterns: ** Compare against expected behavior on the system. For example, investigate recent processes spawned by legitimate Java applications – if their usage aligns with software development or operational tasks, it may indicate benign activity.

  - **Assess impact through asset classification: ** Note the criticality of the affected host. If the Java process is running on a server with sensitive data or critical infrastructure, priority should escalate for further investigation compared to less critical assets.

  - **Identify high-confidence indicators: ** Look for additional associated events (e.g., Event ID 4104 - PowerShell script block logs) that may enhance the confidence of the activity being malicious, recognizing known indicators of compromise (IOCs) relevant to Java the environment.

  ### Prioritization

  This alert should be considered medium severity within an enterprise context. The impact is significant if it affects critical systems running vulnerable Java applications. As exploitation techniques of this nature are increasingly weaponized, there exists a high likelihood of malicious intent that warrants prompt investigation.

  ### Blind Spots and Assumptions

  The detection may be evaded by obfuscating the spawning process or through the use of trusted applications in unexpected ways, so regular review of trusted binary execution is critical. Reliable detection requires that all relevant Windows logging features (especially process creation) are enabled. Legitimate automation or configuration management tasks could also trigger this alert, especially in CI/CD environments. A companion detection to enhance coverage could be monitoring for commands executed as a result of process injection, such as alerting on suspicious PowerShell activity.

