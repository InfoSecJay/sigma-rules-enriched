note: |
  ### Technical Context

  This rule detects the execution of Sysinternals SDelete with specific command-line arguments that indicate an attempt to overwrite files on disk, rather than just erasing free space. The likely attacker objective is to securely delete files to avoid detection or forensic analysis, often related to data compromise or exfiltration cleanup. Relevant MITRE ATT&CK technique is T1485: Data Destruction. Primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688, which captures process initiation details including command-line arguments. If malicious, this activity could help an adversary cover their tracks by deleting evidence of their presence or activity on the system. However, this detection does NOT confirm that actual malicious behavior occurred, as legitimate administrative tasks may also trigger the same command.

  ### Investigation Steps

  - **Check the process creation event: **Review Security Event ID 4688 for the creation of `sdelete.exe` and note the command-line arguments. Look for arguments like `-h`, `-c`, or `-z`, which are typical for file overwriting.

  - **Examine parent processes: **Identify the parent process by checking the `Process ID` (PID) of the `sdelete.exe` event. Legitimate processes (e.g., system management tools) or known admin task automation may indicate benign activity while suspicious execution from user context indicates potential misuse.

  - **Correlate with event logs: **Cross-reference with Windows Event Log File Access (Event ID 4663) to see if any unusual file operations (create, delete, modify) occurred around the same time as the SDelete execution, which may indicate an attempt to cleanup evidence.

  - **Analyze user context: **Check the user account that executed SDelete. Activity from known system accounts or automated management accounts may be benign, while execution from unusual user accounts or service accounts is suspicious.

  - **Evaluate impacted system importance: **Assess the criticality of the affected asset, especially if it is a server hosting sensitive data or performing critical operations. Prioritize investigation based on this context.

  ### Prioritization

  This alert is of high severity because it involves potential data destruction on important systems, which could have significant operational repercussions. The likelihood of malicious abuse is elevated if detected in non-administrative user contexts, especially if performed on sensitive files or databases. This behavior is commonly weaponized by threat actors to erase traces of their actions.

  ### Blind Spots and Assumptions

  Detection may be limited by users who could employ alternative methods to delete files, circumventing this specific rule. Additionally, if logging for process creation is not adequately configured, detections may be missed. Legitimate activities, such as system administrators cleaning up old files, may also trigger this alert. Related detections, such as monitoring for unusual file access patterns or unexpected deletions (Event ID 4660), could provide more comprehensive coverage of potential malicious behavior.

