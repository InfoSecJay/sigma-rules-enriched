detection:
  selection:
    OriginalFileName: sdelete.exe
  filter:
    CommandLine|contains:
    - ' -h'
    - ' -c'
    - ' -z'
    - ' /\?'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of Sysinternals SDelete with specific command-line parameters that indicate potential file overwriting. SDelete is a tool used to securely delete files by overwriting their contents, which poses a significant risk when misused by attackers to erase evidence of their activity. The presence of specific flags such as ‘-h’, ‘-c’, or ‘-z’ may suggest that an attacker is attempting to conceal their tracks after a compromise by deleting sensitive files or logs.

  The threat scenario may involve an attacker who has gained access to a system and wants to execute a methodical cleanup of trace identifiers, such as logs that could otherwise reveal their presence or activity. This behavior is commonly associated with post-exploitation activities, where the goal is to maintain persistence or evade detection. The relevant MITRE ATT&CK tactics include:
  - **Impact** (TA0011)
  - **Data Destruction** (T1485)

  Primary data sources for detecting this activity include process creation logs, which provide insights into the execution of SDelete, including command-line arguments that were used and the username under which the command was executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of `sdelete.exe` being executed, particularly focusing on the command line parameters that may indicate an overwrite attempt.
  - **Analyze User Context**: Determine whether the execution of SDelete occurred under a legitimate user account or a potentially compromised account, which may help assess the risk level of the activity.
  - **Cross-reference with File System Changes**: Check for any corresponding changes in the filesystem to verify if files were removed following the execution of SDelete. This may include reviewing the security event logs or file access records.
  - **Inspect Related Network and Authentication Logs**: Examine logs from other sources like NGFW, EDR, or Active Directory logs to detect unusual authentication patterns that could indicate a compromised account used for the SDelete execution.

  ### Prioritization
  Given the potential for significant impact—such as the permanent loss of critical data and the obfuscation of malicious activities—this alert should be prioritized as high severity. The likelihood of occurrence is amplified in environments where sensitive data is stored and may attract malicious actors.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage could occur if SDelete is executed in a manner that avoids the typical process creation logging mechanisms, such as being run from a remote execution tool or in-memory execution. The detection logic assumes that the presence of SDelete with specific flags indicates malicious behavior; however, legitimate use cases also exist. Therefore, accurate context about normal usage patterns within the environment is crucial. Required logs include Windows process creation logs, which must be enabled to capture the necessary execution details for this rule to function effectively.

