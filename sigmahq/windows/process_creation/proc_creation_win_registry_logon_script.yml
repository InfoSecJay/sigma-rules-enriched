  ### Technical Context
  This detection rule identifies instances where the registry value "UserInitMprLogonScript" is modified to include a new logon script, which can be indicative of potential persistence mechanisms employed by attackers. The addition of such scripts typically aims to ensure that malicious code executes whenever a user logs into the system, thereby facilitating long-term control over the compromised environment. Attackers leveraging this technique may aim to maintain access or establish footholds in critical systems, ultimately leading to broader network compromises.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), with the specific technique being **Create or Modify System Process: Userinit** (T1037.001). Detection of this behavior is crucial for identifying unauthorized attempts to manipulate user environments.

  Primary data sources for identifying this behavior include process creation logs generated by the Windows operating system, which capture command-line arguments used during registry modifications. Additionally, reviewing registry change logs may provide further evidence of unauthorized alterations.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events that contain the command line with 'UserInitMprLogonScript' to identify the originating user, time of execution, and the parent process.
  - **Analyze Registry Changes:** Obtain registry logs specifically for the "UserInitMprLogonScript" value to determine when and by whom the modification was made, verifying whether it is a known administrator or a suspicious user.
  - **Investigate User Activity:** Correlate the identified logon script modifications with user activity for unusual patterns, including failed authentication attempts or logins from atypical locations or devices.
  - **Verify Legitimate Use Cases:** Determine if the logon script modification was executed by authorized personnel, assessing the context in which the script was added or modified to rule out false positives.

  ### Prioritization
  This alert is classified as high severity due to the potential for attackers to establish persistence mechanisms that can lead to extended unauthorized access and deeper network infiltration, which could compromise sensitive data and resources within the enterprise.

  ### Blind Spots and Assumptions
  The detection logic may have gaps in environments where registry auditing is not enabled or where legitimate IT administrative activities could obscure malicious behavior. Assumptions include the presumption that the modification of the `UserInitMprLogonScript` value is inherently suspicious and not tied to routine administrative tasks. Required configurations include enabling process creation logging and, preferably, registry change logging to capture the critical activities associated with this alert.

