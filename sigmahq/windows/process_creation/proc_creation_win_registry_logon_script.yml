note: |
  ### Technical Context

  This rule detects modifications to the registry value "UserInitMprLogonScript," which is used for specifying logon scripts that run during user logon sessions. By adding or altering this entry, an attacker can establish persistence on a compromised system, enabling automatic execution of malicious scripts upon user logon. The likely objective of this behavior is to maintain access to the system (persistence) regardless of user activity or system reboots.

  This detection aligns with the MITRE ATT&CK tactic of Persistence (T1037.001) as it specifically targets the configuration of logon scripts for continuous access. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 related to process creation, where the command line would reference "UserInitMprLogonScript." If the change is indeed malicious, it could allow an adversary to execute arbitrary commands or scripts under the context of a user during login. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrators may also make similar changes.

  ### Investigation Steps

  - **Examine Process Creation Events:** Review Security Event ID 4688 logs for process creation entries with command lines containing "UserInitMprLogonScript." This specifically highlights any recent additions or changes made to the registry value.

  - **Identify the User Context:** Check the associated user account for the process creation event. If the account has administrative privileges, this could indicate potentially legitimate activity; however, anomalous use by standard users should be flagged.

  - **Correlate with Registry Changes:** Utilize Windows Registry logs to confirm that the change to "UserInitMprLogonScript" occurred at the same time as the process creation event. Look for the date and time of the modification to establish a timeline.

  - **Investigate for Known Malicious Scripts:** Analyze the contents of the script specified in "UserInitMprLogonScript" to determine if it is a known malicious payload or exhibits suspicious behavior. Use tools to extract and analyze the script for further investigation.

  - **Review Legitimate Use Cases:** Confirm if there is documentation or approved workflows indicating that administrators regularly add logon scripts. If legitimate entries matching common administrative actions are found, assess the risk to differentiate malicious intent.

  - **Monitor for Anomalous Logins:** Review login patterns and correlate them with recent changes to logon scripts. Abnormal login times or access from unexpected locations/devices could signal deeper compromise even if the log script change appears innocuous.

  ### Prioritization

  This alert should be treated as high severity. The affected system could have elevated access or sensitive information, making it a prime target for persistent malicious activity. The likelihood of abuse is significant, as adversaries commonly leverage logon scripts for persistence, making this behavior a red flag for potential compromise in an enterprise environment.

  ### Blind Spots and Assumptions

  The primary detection limitation is that an attacker may use legitimate user accounts for malicious modifications, potentially evading simple audits. Reliable detection requires comprehensive monitoring of both process creation and registrar interactions, necessitating all relevant logs to be collected and indexed. Legitimate actions may trigger the alert, especially during administrative bulk updates of logon scripts. A companion detection that enhances coverage would be to monitor for unusual script executions at user logon times, providing a more holistic view of user activity concerning persistence mechanisms.

