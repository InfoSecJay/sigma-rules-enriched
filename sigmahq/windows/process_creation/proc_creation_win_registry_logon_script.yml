note: |
  ### Technical Context

  This rule detects changes to the registry value "UserInitMprLogonScript," which is used to specify scripts that run at user logon, typically found in Windows environments. The primary behavior being detected is the addition or modification of these logon scripts, a potential technique used by attackers to achieve persistence on compromised systems. The likely attacker objective is to maintain access for future use or to execute malware whenever a user logs in.

  The relevant MITRE ATT&CK technique associated with this behavior is **Persistence via Logon Scripts** (T1037.001). The primary telemetry source for this detection is Windows process creation logs, specifically focusing on command-line arguments that contain the "UserInitMprLogonScript" string. If this behavior is malicious, it can lead to unauthorized execution of scripts, potentially allowing further exploitation or data exfiltration. However, this detection does NOT confirm malicious intent on its own; it requires contextual analysis.

  ---

  ### Investigation Steps

  - **Identify the execution context:** Review Security Event ID 4688 (Process Creation) for processes that include the command line containing "UserInitMprLogonScript". Check the User and Hostname fields for suspicious accounts or unexpected systems.

  - **Search for recent changes to Logon Scripts:** Review System Event ID 4657 (Registry Value Set) to find modifications to the registry key `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon` for the value of "UserInitMprLogonScript". Note timestamps to correlate with user logon activity.

  - **Compare against legitimate behavior:** Determine if there was any legitimate administrative activity such as software installations or updates. Identify any changes made by known IT tools or remediation scripts, specifically checking for entries in logs from installation tools.

  - **Assess user account behavior:** Investigate the user account associated with this change. Verify the purpose and role of the account, and check for any anomalous behavior or rare login times using Event ID 4624 (Logon).

  - **Look for additional persistence techniques:** Check for companion alerts related to persistence, such as unusual modifications in `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`. This can indicate a broader persistence strategy being employed.

  - **Determine system criticality:** Assess the impacted asset's role within the enterprise (e.g., domain controller vs. user workstation) to gauge potential impact and prioritize further investigation.

  ---

  ### Prioritization

  This alert has high severity due to its potential to enable an attacker to maintain long-term access to compromised systems. Given that logon script persistence is a common tactic for attackers, the likelihood of malicious abuse is significant, warranting immediate investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may be bypassed if an attacker utilizes tools that do not modify the registry in detectable ways or if they disguise their activities through legitimate means. It requires that appropriate logging levels for registry modifications and process creation are enabled to be effective. Legitimate activities that may trigger this alert include routine changes by system administrators or maintenance tools. A companion detection related to unusual scheduled tasks or startup entries would enhance overall security posture against persistence techniques.

