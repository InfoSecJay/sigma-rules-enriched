  ### Technical Context

  This rule detects instances where a new logon script is being added to the Windows registry value `UserInitMprLogonScript`, a common mechanism for maintaining persistence by malicious actors. The likely attacker objective relates to privilege escalation and maintaining access to compromised environments (MITRE ATT&CK Tactic: Persistence, Technique ID: T1037.001). The primary telemetry source for this detection comes from process creation logs, particularly correlating CommandLine arguments that reference the registry modification.

  If executed maliciously, this behavior could lead to unauthorized code execution and ongoing access to the system, significantly compromising its security. It is essential to note that this detection does not confirm malicious intent on its own, as legitimate administrative activities may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review the command line argument:** Check for `CommandLine` containing `UserInitMprLogonScript`. Investigate the context and user account making the change (Security Event ID 4688, Sysmon Event ID 1). Malicious changes will typically coincide with non-standard user accounts or times.

  - **Correlate with process parent information:** Determine the parent process for the modification. If the parent process is the Windows command shell (cmd.exe) or PowerShell running under an anomalous user, this may indicate malicious activity (Sysmon Event ID 1, Field: ParentImage).

  - **Assess user account activity:** Examine the account that executed the changes for suspicious behavior or prior alerts. Look for accounts with administrative privileges making unusual changes that deviate from their standard operational patterns.

  - **Identify legitimate user actions:** Confirm if similar logon script modifications have been made previously by legitimate processes or users, such as system administrators performing standard maintenance tasks. Check for a consistent pattern of behavior in process creation logs.

  - **Analyze system-level impacts:** Review system criticality and asset classification to ascertain the potential impact of a successful persistence mechanism. Systems with low criticality may warrant less immediate investigation versus highly sensitive assets.

  - **Validate registry modification:** Confirm that the registry modification has occurred by checking registry logs (Event ID 4657 - Registry Value Modified) for the `UserInitMprLogonScript` key, noting the previous value and correlating timestamps.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on the system's integrity and its association with persistence techniques often leveraged by attackers. Given that modifications to logon scripts are frequently weaponized, prompt investigation is warranted to mitigate potential exploitations.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of sysmon or process creation logging which could hinder visibility into shell sessions initiating these commands. Legitimate activities such as updates to GPO scripts or third-party tool configurations may trigger similar alerts. A related detection that strengthens coverage is monitoring for unusual command line arguments in process creation (like direct registry modifications), which can complement this alert's effectiveness.

