title: Tap Installer Execution
id: 99793437-3e16-439b-be0f-078782cf953d
status: test
description: Well-known TAP software installation. Possible preparation for data exfiltration
  using tunneling techniques
references:
- https://community.openvpn.net/openvpn/wiki/ManagingWindowsTAPDrivers
author: Daniil Yugoslavskiy, Ian Davis, oscd.community
date: 2019-10-24
modified: 2023-12-11
tags:
- attack.exfiltration
- attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\tapinstall.exe'
  filter_optional_avast:
    Image|contains:
    - ':\Program Files\Avast Software\SecureLine VPN\'
    - ':\Program Files (x86)\Avast Software\SecureLine VPN\'
  filter_optional_openvpn:
    Image|contains: ':\Program Files\OpenVPN Connect\drivers\tap\'
  filter_optional_protonvpn:
    Image|contains: ':\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate OpenVPN TAP installation
level: medium
note: |
  ### Technical Context
  This Sigma rule detects the execution of the TAP installer, a component commonly used by applications like OpenVPN and various VPN services. The detection focuses on a potential threat scenario where attackers might use TAP installations as a prelude to data exfiltration. By establishing a tunneling mechanism, malicious actors could facilitate the unauthorized transfer of sensitive information outside the enterprise network.

  The rule aligns with the MITRE ATT&CK framework's **Exfiltration** tactics, specifically the technique T1048 (Exfiltration over Alternative Protocol). The primary data sources leveraged for this detection are process creation logs on Windows systems, which capture details about executed processes, along with their paths. Monitoring these logs is crucial for identifying unusual or unauthorized installations that could indicate an exploitation attempt.

  ### Investigation Steps
  - **Review Process Creation Events**: Check the process creation logs for instances of `tapinstall.exe` and monitor for any associated executable paths, particularly those that fall outside of expected application directories.
  - **Analyze Network Traffic**: Investigate outbound network connections initiated by systems where the TAP installer was executed. Look for anomalous traffic patterns or connections to unrecognized IPs that might indicate tunneling or exfiltration activities.
  - **Correlate with User Activity**: Cross-reference the timestamps of the TAP installation with user activity logs. Determine if the installation occurred during unusual hours or by users not typically involved with VPN or networking tasks.
  - **Investigate Related Applications**: Since legitimate VPNs utilize TAP installations, check for the presence and usage of known VPN applications (e.g., OpenVPN, Avast SecureLine, ProtonVPN) on the affected systems, ensuring they are being used in normal operational context.

  ### Prioritization
  This alert has medium severity due to the potential impact of data exfiltration that could lead to significant breaches of confidential information. Given the growing sophistication of threat actors and the prevalence of tunneling techniques for data theft, timely investigation is critical.

  ### Blind Spots and Assumptions
  There are notable gaps in detection coverage regarding legitimate TAP installations, as many organizations use VPNs for secure connections. This detection logic assumes the presence of specific legitimate applications that may not be present in all enterprises, which can lead to false positives. Additionally, a reliable configuration of Windows process creation event logging is required for this alert to function effectively, along with appropriate correlation capabilities to analyze network behavior following installation events.

