detection:
  selection:
    Image|endswith: '\tapinstall.exe'
  filter_optional_avast:
    Image|contains:
    - ':\Program Files\Avast Software\SecureLine VPN\'
    - ':\Program Files (x86)\Avast Software\SecureLine VPN\'
  filter_optional_openvpn:
    Image|contains: ':\Program Files\OpenVPN Connect\drivers\tap\'
  filter_optional_protonvpn:
    Image|contains: ':\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate OpenVPN TAP installation
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the TAP installer, commonly associated with tunneling software like OpenVPN and ProtonVPN. The behavior indicates potential preparation for data exfiltration, as tunneling applications can facilitate encrypted communication channels that may bypass traditional security measures. The relevant MITRE ATT&CK framework tactic is **Exfiltration** (TA0010), specifically technique **Tunneling** (T1048).

  Primary telemetry sources include Windows process creation logs, specifically Process Creation Event ID 4688. If malicious, this behavior could indicate an attacker preparing to exfiltrate sensitive data stealthily. However, the detection does NOT confirm that data exfiltration is occurring; it only highlights that the TAP installer was executed.

  ---

  ### Investigation Steps

  - **Check process creation details:** Investigate Windows Security Event ID 4688 logs for the execution of `tapinstall.exe`. Note the parent process ID to trace the execution chain. Legitimate executions will typically follow installation patterns rather than sudden appearances.

  - **Verify installation paths:** Ensure the path of `tapinstall.exe` matches expected locations such as `C:\Program Files\Avast Software\SecureLine VPN\` and `C:\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\`. Inconsistent paths may indicate malicious activity.

  - **Review recent network activity:** Analyze Windows Firewall logs (Event ID 5156) for outbound connections initiated by the TAP driver to unknown external IPs or unusual port usage. Suspicious connections could signify an attempted exfiltration.

  - **Assess host role and criticality:** Identify if the affected system is a server, workstation, or sensitive asset. Execution on critical servers increases potential impact and risk. Determine the necessity of TAP installations for business operations on such machines.

  - **Check for alternative tunneling applications:** Search for other tunneling software installations or related executables (e.g., `openvpn.exe`). If such applications exist, correlate their execution time with that of the TAP installer for context.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential risk of data exfiltration, especially if the installation occurs on a critical or sensitive asset. The likelihood that this behavior is malicious increases if there is a lack of legitimate business justification or if there are accompanying suspicious network activities.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate TAP installations might occur unknowingly, particularly in environments relying on VPN solutions. Required log sources include detailed process creation logging and firewall monitoring for effective detection capabilities. Legitimate activities, such as installing VPN clients for secure work-from-home contexts, may also trigger this rule. A related detection to strengthen coverage could involve monitoring for unusual outbound traffic patterns after installations to capture potential exfiltration activities.

