title: Tap Installer Execution
id: 99793437-3e16-439b-be0f-078782cf953d
status: test
description: Well-known TAP software installation. Possible preparation for data
  exfiltration using tunneling techniques
references:
- https://community.openvpn.net/openvpn/wiki/ManagingWindowsTAPDrivers
author: Daniil Yugoslavskiy, Ian Davis, oscd.community
date: 2019-10-24
modified: 2023-12-11
tags:
- attack.exfiltration
- attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\tapinstall.exe'
  filter_optional_avast:
    Image|contains:
    - ':\Program Files\Avast Software\SecureLine VPN\'
    - ':\Program Files (x86)\Avast Software\SecureLine VPN\'
  filter_optional_openvpn:
    Image|contains: ':\Program Files\OpenVPN Connect\drivers\tap\'
  filter_optional_protonvpn:
    Image|contains: ':\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate OpenVPN TAP installation
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `tapinstall.exe`, a Windows installer associated with TAP (Terminal Access Point) drivers, commonly used for creating virtual network interfaces by various VPN solutions. The likely attacker objective is to facilitate data exfiltration through tunneling techniques, which would allow an adversary to bypass network security measures and obscure malicious traffic. This behavior aligns with the MITRE ATT&CK tactic of Exfiltration (TA0010) and the technique of Exfiltration Over Alternative Protocol (T1048).

  The primary telemetry source for this detection is process creation logs on Windows systems, specifically Security Event ID 4688 and Sysmon Event ID 1. If the detected instance of `tapinstall.exe` is malicious, it could lead to unauthorized data access or exfiltration. However, it's critical to understand that this detection does NOT, on its own, confirm malicious intent or activity; it simply indicates that the installation process for TAP drivers was initiated.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for `tapinstall.exe` execution. Look for parent process ID, which may indicate context; e.g., legitimate processes such as `setup.exe` or `msiexec.exe` indicate benign behavior.

  - **Verify installation directory:** Confirm that the execution path for `tapinstall.exe` corresponds to known legitimate software, such as `Avast SecureLine VPN` or `OpenVPN Connect`. Any executions from unexpected paths may signal malicious activity.

  - **Analyze network activity:** Inspect network logs to identify any unusual outbound connections made shortly after `tapinstall.exe` execution, particularly connections to known suspicious or external IP addresses. Utilize firewall logs to check for unusual port usage.

  - **Identify user context:** Review the user context under which `tapinstall.exe` was executed by capturing the associated user account from the logs. Execution by a standard user during unexpected hours can indicate potential compromise.

  - **Correlate with known indicators:** Cross-reference the machine and any associated user accounts with threat intelligence sources to investigate if they have been linked to prior incidents or known bad actors.

  - **Document expected behavior:** Confirm instances where users are likely installing legitimate VPN software for business purposes, ensuring they followed company protocol on software installation and that these installations are documented.

  ### Prioritization

  The alert severity is medium as the affected systems may be used for sensitive data access or management. The likelihood of malicious abuse is significant, particularly in environments that handle sensitive data. This behavior is often weaponized by threat actors seeking to exfiltrate data while maintaining a low profile.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate software installations, especially in corporate environments, may frequently trigger this alert. Successful detection relies on comprehensive logging configurations for process creation, and any absence of relevant logs may hinder investigations. Additionally, the alert could be triggered by benign activities, such as standard VPN app installations. Implementing companion detections for unusual outgoing traffic patterns can enhance coverage and context for malicious activity.

