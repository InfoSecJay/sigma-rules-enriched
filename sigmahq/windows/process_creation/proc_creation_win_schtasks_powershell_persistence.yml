detection:
  selection:
    ParentImage: 'C:\WINDOWS\System32\svchost.exe'
    ParentCommandLine|contains|all:
    - '-k netsvcs'
    - '-s Schedule'
    CommandLine|endswith:
    - ' -windowstyle hidden'
    - ' -w hidden'
    - ' -ep bypass'
    - ' -noni'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of PowerShell processes that are initiated by `svchost.exe` and include suspicious command-line flags that may indicate an attempt to hide the PowerShell instance. Such behavior is indicative of potential persistence tactics used by adversaries, aiming to blend in with legitimate processes while maintaining control over the system. The relevant MITRE ATT&CK techniques for this behavior include Persistence through Scheduled Tasks (T1053.005) and Windows Command Shell command execution (T1059.001). The primary telemetry source is Windows Process Creation events, specifically Event ID 4688.

  Malicious execution via this method could allow attackers to establish a foothold in a victim environment while evading detection tools. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also utilize similar command-line parameters.

  ### Investigation Steps

  - **Investigate the Parent Process:** Review Process Creation logs (Event ID 4688) to confirm that the parent process is `svchost.exe`. Legitimate instances of this process should not be making calls to PowerShell with hiding flags.

  - **Analyze Command-Line Flags:** Look for specific command-line arguments in the logs, such as `-windowstyle hidden`, `-w hidden`, or `-ep bypass`. The presence of these flags without legitimate context should raise suspicion.

  - **Check Task Scheduler Configuration:** Query Windows Task Scheduler (using `schtasks /query /fo LIST`) to identify any newly created or modified tasks that point to PowerShell commands. Compare the modified tasks against typical operational usage.

  - **Verify Parent Command Line:** Confirm the complete command line of the parent process, ensuring it includes `-k netsvcs` and `-s Schedule`. Any deviations should be flagged for deeper investigation.

  - **Assess Host Role:** Consider the role of the affected host. If it’s a critical server or part of an application ecosystem, the alert should be prioritized higher due to potential security risks associated with persistence efforts.

  - **Identify Indicators of Compromise:** Look for known indicators related to the Colibri Loader or advanced persistent threats (APTs) associated with similar behaviors. Cross-reference IOCs to ensure higher confidence in finding malicious activity.

  ### Prioritization

  This alert is considered high severity due to the potential for significant impact on critical systems if malicious persistence is confirmed. The likelihood of abuse is high, as these tactics are commonly used by sophisticated threat actors to maintain access. This behavior generally indicates a risk situation requiring immediate attention.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate PowerShell usage with similar flags, which may cause false positives. Ensuring proper logging configurations for Process Creation and Task Scheduler events is crucial for reliable detection. Administrators performing maintenance tasks may trigger these alerts unintentionally. Complementary detections, such as monitoring for unusual Task Scheduler modifications, strengthen coverage against sophisticated threats.

