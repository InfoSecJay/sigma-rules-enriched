detection:
  selection:
    ParentImage: 'C:\WINDOWS\System32\svchost.exe'
    ParentCommandLine|contains|all:
    - '-k netsvcs'
    - '-s Schedule'
    CommandLine|endswith:
    - ' -windowstyle hidden'
    - ' -w hidden'
    - ' -ep bypass'
    - ' -noni'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell executions initiated through a Windows Task Scheduler, specifically monitoring for command lines that utilize suspicious flags to obscure the PowerShell instance. The focus of this behavior is typically on evading detection and establishing persistence on compromised systems, potentially indicative of a threat actor leveraging techniques related to the Colibri Loader. Attackers employing the "Get-Variable" method via PowerShell can craft intricate persistence mechanisms that allow them to maintain access to compromised systems while remaining stealthy.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002) via **Command-Line Interface** (T1059.001)
  - **Persistence** (TA0003) via **Scheduled Task/Job** (T1053.005)
  - **Privilege Escalation** (TA0004), as the execution context may elevate privileges inadvertently or intentionally.

  Primary data sources to investigate for further insights include process creation events and Task Scheduler logs, as these will reveal the context in which the PowerShell command was executed and any anomalous behavior surrounding that execution.

  ### Investigation Steps
  - **Review Task Scheduler Logs**: Examine scheduled tasks on the system for recently created or modified entries that invoke PowerShell with unusual parameters, especially surrounding the execution context.
  - **Analyze Process Creation Events**: Look for process creation logs that show instances of PowerShell (`powershell.exe`) being executed with the captured command line parameters tied to the detection logic. Correlate these with parent processes.
  - **Check PowerShell Event Logs**: Investigate PowerShell Operational event logs for potentially relevant activity, focusing on script blocks and command invocations that align with the command-line parameters collected.
  - **Monitor for Additional Signs of Compromise**: Cross-reference findings with known indicators of compromise (IOCs) associated with the Colibri Loader or similar persistence techniques to look for broader threat patterns within the environment.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to gain persistent access to systems through stealthy PowerShell techniques. Given that PowerShell is a common tool in both legitimate administrative tasks and malicious activity, timely identification and response to such behavior are crucial to mitigating risks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging levels for PowerShell execution events and Task Scheduler activities are not configured correctly. Additionally, this rule assumes that the PowerShell processes in question are not benign administrative tasks; therefore, analysts should validate flagged events against operational baselines. Dependency on process creation logs means that environments with insufficient logging retention may lose visibility on potential threats.

