title: Suspicious Rundll32 Setupapi.dll Activity
id: 285b85b1-a555-4095-8652-a8a4106af63f
status: test
description: setupapi.dll library provide InstallHinfSection function for 
  processing INF files. INF file may contain instructions allowing to create 
  values in the registry, modify files and install drivers. This technique could
  be used to obtain persistence via modifying one of Run or RunOnce registry 
  keys, run process or use other DLLs chain calls (see references) 
  InstallHinfSection function in setupapi.dll calls runonce.exe executable 
  regardless of actual content of INF file.
references:
- https://lolbas-project.github.io/lolbas/Libraries/Setupapi/
- https://gist.githubusercontent.com/bohops/0cc6586f205f3691e04a1ebf1806aabd/raw/baf7b29891bb91e76198e30889fbf7d6642e8974/calc_exe.inf
- https://raw.githubusercontent.com/huntresslabs/evading-autoruns/master/shady.inf
- https://twitter.com/Z3Jpa29z/status/1313742350292746241?s=20
author: Konstantin Grishchenko, oscd.community
date: 2020-10-07
modified: 2021-11-27
tags:
- attack.stealth
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\runonce.exe'
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - 'setupapi.dll'
    - 'InstallHinfSection'
  condition: selection
falsepositives:
- Scripts and administrative tools that use INF files for driver installation 
  with setupapi.dll
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `runonce.exe` as a child process of `rundll32.exe` with the `setupapi.dll` library's `InstallHinfSection` function. This behavior can be indicative of an attacker attempting to utilize the INF file processing capabilities to modify system settings, create persistence mechanisms through registry modifications, or execute malicious payloads indirectly. The related MITRE ATT&CK tactic is Execution, specifically technique T1218.011 (Rundll32).

  The primary telemetry source is Windows Process Creation events (Security Event ID 4688 and Sysmon Event ID 1), which capture process execution details and parent-child relationships. If the detected behavior is malicious, it could lead to substantial security impacts, including unauthorized system changes, persistence of malware, and elevated privilege exploitation. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also trigger such activity when utilizing INF files for software or driver installations.

  ### Investigation Steps

  - **Check process execution details:** Review the Security Event ID 4688 logs for the `runonce.exe` process. Validate that its parent process is `rundll32.exe`, specifically invoked with `setupapi.dll` and `InstallHinfSection`. Identify any anomalous command line arguments used.

  - **Analyze associated command lines:** Assess the specific command lines used in the parent `rundll32.exe` process. Look for suspicious arguments or paths. Legitimate execution typically involves standard INF installation routines without obfuscation or unusual parameters.

  - **Identify unusual file modifications:** Inspect the registry keys associated with `Run` or `RunOnce`. If recent modifications are present without administrative intent, it may suggest persistence mechanisms being introduced by adversaries.

  - **Correlate with malicious indicators:** Investigate whether the logs show known malicious INF files (e.g., from references) or unusual `INF` files that deviate from regular update or installation processes.

  - **Inspect for historical context:** Review the system's software and driver installation history to determine if this `runonce.exe` execution aligns with documented administrative actions. Cross-reference with change management records.

  ### Prioritization

  This alert should be considered of medium severity as it reflects a potential attempt to execute an unusual process chain that could signify malware behavior. The impact is heightened on critical systems, and while administrative tasks may trigger this detection occasionally, the use of `rundll32` in a suspicious context is a common technique leveraged by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by evasive tactics, such as modifying command line parameters or utilizing alternative DLLs not captured by this rule. Reliable detection hinges on proper logging configurations for process creation; without them, this behavior may go unnoticed. Legitimate activities, such as administrative software updates, could trigger similar alerts, necessitating contextual investigation. Companion detections include suspicious registry modifications under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run` or similar locations to bolster monitoring capabilities.

