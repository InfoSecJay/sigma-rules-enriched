title: Suspicious Rundll32 Setupapi.dll Activity
id: 285b85b1-a555-4095-8652-a8a4106af63f
status: test
description: setupapi.dll library provide InstallHinfSection function for processing
  INF files. INF file may contain instructions allowing to create values in the registry,
  modify files and install drivers. This technique could be used to obtain persistence
  via modifying one of Run or RunOnce registry keys, run process or use other DLLs
  chain calls (see references) InstallHinfSection function in setupapi.dll calls runonce.exe
  executable regardless of actual content of INF file.
references:
- https://lolbas-project.github.io/lolbas/Libraries/Setupapi/
- https://gist.githubusercontent.com/bohops/0cc6586f205f3691e04a1ebf1806aabd/raw/baf7b29891bb91e76198e30889fbf7d6642e8974/calc_exe.inf
- https://raw.githubusercontent.com/huntresslabs/evading-autoruns/master/shady.inf
- https://twitter.com/Z3Jpa29z/status/1313742350292746241?s=20
author: Konstantin Grishchenko, oscd.community
date: 2020-10-07
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\runonce.exe'
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - 'setupapi.dll'
    - 'InstallHinfSection'
  condition: selection
falsepositives:
- Scripts and administrative tools that use INF files for driver installation with
  setupapi.dll
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of `runonce.exe` invoked via `rundll32.exe` with the `setupapi.dll` library's `InstallHinfSection` function. This behavior is indicative of attempts to create persistence on a system by modifying registry keys like Run or RunOnce, or installing malicious drivers as part of a post-exploitation activity. The likely attacker objective is to maintain access and execute arbitrary code outside direct user interaction.

  This detection maps to the MITRE ATT&CK technique of **Reg/Run Keys / Startup Folder** (T1218.011). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to persistent compromise, enabling attackers to run their payloads automatically on system startup. Importantly, this detection does NOT confirm malicious intent on its own, as there may be legitimate administrative use of INF files for driver installations.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for `runonce.exe` with the associated `ParentImage` of `rundll32.exe` and the `ParentCommandLine` containing `setupapi.dll InstallHinfSection`. Look for unusual command-line arguments indicative of a payload.

  - **Verify registry changes:** Search the Windows Registry for any recent modifications to Run or RunOnce keys. Specifically, examine HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run and HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run for new entries correlating with the alert.

  - **Identify benign scenarios:** Confirm any legitimate software installations or system updates that utilize `setupapi.dll` for known hardware or software updates. This may include reviewing ticketing systems or documentation for planned administrative actions that coincide with the alert timeframe.

  - **Assess file creation activity:** Analyze file system changes within the same timeframe, focusing on newly created files or executables initiated by `runonce.exe`. Look for unusual file paths or file types that shouldn't be present, checking C:\Windows\System32 or user profile directories.

  - **Correlate with threat intelligence:** Cross-reference the executed command with known threat actor techniques or malware samples that leverage `setupapi.dll` for persistence. Use threat intelligence feeds or internal knowledge bases to identify commonly exploited behaviors.

  - **Engage with asset management:** Review the asset's criticality and role within the infrastructure. Determine if the affected system holds sensitive data or controls significant organizational functions, heightening the response priority if malicious activity is confirmed.

  ---

  ### Prioritization

  This alert is of medium severity due to potential persistence implications if the behavior is malicious. Systems with critical roles, like domain controllers or servers handling sensitive data, increase the likelihood of exploitation. Given that the misuse of `setupapi.dll` is known in the attack landscape, timely investigation is imperative.

  ---

  ### Blind Spots and Assumptions

  There may be detection limitations as legitimate administrative tools using INF scripts for driver installations can trigger the same alert. Reliable detection requires appropriate logging configurations for process creation and registry access. Additionally, integrations like EDR solutions may improve granularity. Related detections include those for `rundll32.exe` invocations without typical administrative context, strengthening overall monitoring coverage.

