title: Suspicious Rundll32 Setupapi.dll Activity
id: 285b85b1-a555-4095-8652-a8a4106af63f
status: test
description: setupapi.dll library provide InstallHinfSection function for processing
  INF files. INF file may contain instructions allowing to create values in the registry,
  modify files and install drivers. This technique could be used to obtain persistence
  via modifying one of Run or RunOnce registry keys, run process or use other DLLs
  chain calls (see references) InstallHinfSection function in setupapi.dll calls runonce.exe
  executable regardless of actual content of INF file.
references:
- https://lolbas-project.github.io/lolbas/Libraries/Setupapi/
- https://gist.githubusercontent.com/bohops/0cc6586f205f3691e04a1ebf1806aabd/raw/baf7b29891bb91e76198e30889fbf7d6642e8974/calc_exe.inf
- https://raw.githubusercontent.com/huntresslabs/evading-autoruns/master/shady.inf
- https://twitter.com/Z3Jpa29z/status/1313742350292746241?s=20
author: Konstantin Grishchenko, oscd.community
date: 2020-10-07
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\runonce.exe'
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - 'setupapi.dll'
    - 'InstallHinfSection'
  condition: selection
falsepositives:
- Scripts and administrative tools that use INF files for driver installation with
  setupapi.dll
level: medium
note: |
  ### Technical Context
  This rule detects suspicious activity involving the `rundll32.exe` process, specifically when it utilizes the `setupapi.dll` library to execute the `InstallHinfSection` function. This function can process INF files, which are configuration files used for the installation of drivers and system components in Windows. An attacker may leverage this functionality to modify registry keys and establish persistence mechanisms on a compromised system, such as by adding entries to the Run or RunOnce registry keys. The use of `rundll32.exe` in this context generally raises red flags as it is commonly associated with malicious payload execution.

  The relevant MITRE ATT&CK tactics and techniques that apply to this detection rule include Defense Evasion (ID: TA0005) and the specific technique of "Run DLLs" (ID: T1218.011). Attackers may exploit these techniques to mask malicious activities and maintain persistence, thereby aiding in prolonged access to compromised environments.

  Primary data sources for evidence include process creation logs that detail the execution of `rundll32.exe` and its command-line parameters, as well as Windows registry logs that can provide insights into changes made to the system’s startup configuration and persistence mechanisms.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of `rundll32.exe` that have `setupapi.dll` in the command line, particularly focusing on the argument `InstallHinfSection`.
  - **Examine Remote File Access**: Investigate any unusual or unauthorized INF files that have been downloaded or accessed around the same time as the suspicious `rundll32.exe` executions.
  - **Analyze Registry Changes**: Search for modifications to the Run or RunOnce registry keys, especially any entries that might reference executed commands associated with the observed rundll32 behavior.
  - **Correlate with Network Activity**: Look for outbound connections or communications that coincide with the times of detected suspicious activity, particularly if abnormal IP addresses or domains are involved.

  ### Prioritization
  This alert should be treated with medium priority due to the potential for significant impact through unauthorized persistence mechanisms. The likelihood of exploitation using these techniques underscores the necessity for timely investigation.

  ### Blind Spots and Assumptions
  The detection logic assumes that the execution of `rundll32.exe` will consistently utilize `setupapi.dll` in a suspicious context. There may be blind spots if legitimate administrative actions or scripts use INF files for valid purposes, leading to possible false positives. Additionally, the rule relies on the availability of complete process creation logs and relevant registry auditing. If these logs are not captured or configured correctly, it may impact the detection’s effectiveness.

