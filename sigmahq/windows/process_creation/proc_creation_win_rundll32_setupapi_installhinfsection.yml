title: Suspicious Rundll32 Setupapi.dll Activity
id: 285b85b1-a555-4095-8652-a8a4106af63f
status: test
description: setupapi.dll library provide InstallHinfSection function for 
  processing INF files. INF file may contain instructions allowing to create 
  values in the registry, modify files and install drivers. This technique could
  be used to obtain persistence via modifying one of Run or RunOnce registry 
  keys, run process or use other DLLs chain calls (see references) 
  InstallHinfSection function in setupapi.dll calls runonce.exe executable 
  regardless of actual content of INF file.
references:
- https://lolbas-project.github.io/lolbas/Libraries/Setupapi/
- https://gist.githubusercontent.com/bohops/0cc6586f205f3691e04a1ebf1806aabd/raw/baf7b29891bb91e76198e30889fbf7d6642e8974/calc_exe.inf
- https://raw.githubusercontent.com/huntresslabs/evading-autoruns/master/shady.inf
- https://twitter.com/Z3Jpa29z/status/1313742350292746241?s=20
author: Konstantin Grishchenko, oscd.community
date: 2020-10-07
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\runonce.exe'
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - 'setupapi.dll'
    - 'InstallHinfSection'
  condition: selection
falsepositives:
- Scripts and administrative tools that use INF files for driver installation 
  with setupapi.dll
level: medium
note: |
  ### Technical Context

  This rule detects suspicious behavior associated with the execution of `runonce.exe` from a parent process of `rundll32.exe` using the `setupapi.dll` library. Attackers may use this technique to manipulate the Windows registry for persistence purposes by running unwanted programs or modifying system settings via `.INF` files. Relevant MITRE ATT&CK techniques include: Defense Evasion (T1218.011) - using malicious `.INF` files to gain persistence. The primary telemetry source is Windows Process Creation logs, specifically focusing on Event ID 4688, which provides insights into new process creation and their command lines.

  If this behavior is confirmed as malicious, it could lead to unauthorized persistence, enabling further compromise of the target system. However, this detection does NOT confirm the malicious intent or successful exploitation on its own and should be assessed in conjunction with additional context.

  ### Investigation Steps

  - **Verify process creation context:** Review Process Creation logs (Event ID 4688) for `runonce.exe` and ensure it's invoked under the parent process `rundll32.exe`. Check if the command line includes `setupapi.dll` and `InstallHinfSection`.

  - **Identify benign usage of INF files:** Look for legitimate scripts or administrative tools that utilize INF files for necessary driver installations. Compare command lines against known safe processes to deduce normal operational behavior.

  - **Check for persistence registry modifications:** Query the registry (HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run) for any recent additions or modifications that align with the alert's process. Newly created entries containing suspicious command lines or abnormal file paths should be flagged.

  - **Analyze high-confidence malicious indicators:** Investigate for known malicious `.INF` files or templates, like `shady.inf`, which can be used to discern red flags. Check if the source of this file correlates with previous incident patterns.

  - **Review related security events:** Correlate with other security events logged around the same timestamp (Event IDs 4657 and 4663) that indicate permissions changes or file modifications which could indicate unauthorized activity.

  ### Prioritization

  This alert is of medium severity. While it indicates possible ongoing malicious activity, the impact depends on the system's role within the enterprise. The likelihood of adversarial abuse exists due to the known use of `setupapi.dll` for persistence techniques. This behavior is recognized as a method frequently weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection limitations may exist due to the potential for legitimate administrative scripts to trigger this alert, leading to false positives. Accurate monitoring requires ensuring comprehensive logging of process creation events and registry modifications. Additionally, benign processes utilizing `rundll32.exe` for legitimate operations could mistakenly trigger this detection. A companion detection that can enhance coverage would involve monitoring direct registry writes or changes related to persistence mechanisms.

