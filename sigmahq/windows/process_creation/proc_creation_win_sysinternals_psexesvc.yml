note: |
  ### Technical Context
  This detection rule identifies the execution of the `PSEXESVC` service, which is indicative of remote execution via the PsExec tool. PsExec, a utility in the Sysinternals Suite, allows administrators to execute processes on remote systems. However, attackers often misuse PsExec to gain unauthorized access and execute commands or malicious software remotely, aligning with their objectives to expand their control within a target network.

  The primary MITRE ATT&CK tactics related to this detection are **Execution** (TA0002) with the technique of **Command-Line Interface** (T1059) and **Remote Services** (T1021). The rule focuses on detecting unauthorized execution which might suggest lateral movement or exploitation. The threat may come from various instances of adversarial activity, such as malware or manual exploitation techniques that leverage remote service capabilities to access additional systems within the environment.

  To effectively monitor for this activity, the best data sources include **process creation events** and **Windows event logs** that capture service execution on endpoints, especially logs that detail actions taken by administrative tools or user accounts with privileged access.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events to identify instances of `PSEXESVC.exe` being launched, including checking the parent process for context on how the service was executed.
  - **Analyze User Accounts Involved**: Investigate the user accounts associated with the execution of the `PSEXESVC` service to determine if they are legitimate administrative accounts or improperly used credentials that could indicate compromise.
  - **Investigate Network Connections**: Look into the connections made by the system during the time of the PsExec execution for any unusual or unauthorized outbound traffic that could suggest further compromise.
  - **Correlate with Privilege Escalation Activities**: Check for other related activities in the timeframe, such as privilege escalation events, lateral movement, and account enumeration that could align with the use of PsExec.

  ### Prioritization
  The alert is of **medium severity** due to the potential impact of PsExec being used in unauthorized scenarios that could lead to a security breach, especially in environments where sensitive data is present. The likelihood of such activity occurring increases when considering the capabilities of attackers to exploit administrative tools.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if auditing is not enabled for process creation logs or if logs are not retained for sufficient periods. This detection rule assumes that the presence of PsExec service execution is not limited to legitimate administrative tasks, although these may generate false positives. Adequate logging and monitoring configurations must be set in order for the alert to function effectively, requiring an understanding of normal administrative behaviors to filter out false alerts.

