note: |
  ### Technical Context

  This Sigma rule detects the execution of the PsExec service, specifically indicating that the `PSEXESVC.exe` process has been launched. This behavior is often associated with lateral movement techniques employed by attackers, allowing them to execute commands on remote systems. The likely objective of the attacker is to gain remote access to and control over a target system without alerting detection mechanisms.

  This detection relates primarily to the MITRE ATT&CK technique for remote service execution under the tactic of Execution (T1203). The primary telemetry source required is Windows process creation logs, specifically monitoring Event ID 4688 for the creation of `PSEXESVC.exe`. If malicious, this could allow further exploitation and access to sensitive information or resources on the target system. However, it is important to note that this detection alone does not confirm malicious intent, as `PSEXESVC.exe` can be legitimately used by administrators for remote management tasks.

  ### Investigation Steps

  - **Check process creation logs:** Verify Event ID 4688 in the Windows Security Event Log to confirm that `C:\Windows\PSEXESVC.exe` was created, focusing on the process command line used for execution to identify any suspicious parameters.

  - **Review source IP and user context:** Cross-reference the execution event with user accounts and source IP addresses that initiated the PsExec command to determine if they are authorized administrative users. Look for unusual or external IP addresses.

  - **Validate expected administrative usage:** Ensure that the use of PsExec was authorized and typical for the system's role. Legitimate usage often occurs during routine patching or system maintenance executed by known administrators.

  - **Identify associated process chains:** Investigate any parent processes that initiated `PSEXESVC.exe` by querying Event ID 4688 to trace back to the originating process, as suspicious parent processes may indicate a potentially malicious execution chain.

  - **Check for unusual outbound connections:** Utilize connection logs to inspect any outbound traffic generated by systems executing PsExec. Look for unusual connections to external systems or data exfiltration attempts that may correlate with the execution.

  - **Monitor for related detections:** Be aware of companion detection rules that may indicate lateral movement, such as unusual SMB traffic or other remote system access attempts, enhancing the context of the alert.

  ### Prioritization

  Alerts generated by this detection rule should be treated with medium severity. While the impact on the affected system could be significant through potential unauthorized access, the likelihood of malicious abuse hinges on the context in which PsExec is invoked. Given that PsExec is commonly weaponized for lateral movement, any detection warrants timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper process creation logging configurations, which can hinder comprehensive monitoring. Additionally, legitimate administrative tasks (e.g., network troubleshooting) can trigger this alert, affecting the accuracy of assessments. It is essential to be aware of related detection mechanisms, such as alerts for abnormal SMB traffic (e.g., file sharing via ILD file access patterns), to strengthen overall monitoring coverage.

