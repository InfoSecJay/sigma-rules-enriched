title: Renamed Gpg.EXE Execution
id: ec0722a3-eb5c-4a56-8ab2-bf6f20708592
status: test
description: Detects the execution of a renamed "gpg.exe". Often used by ransomware
  and loaders to decrypt/encrypt data.
references:
- https://securelist.com/locked-out/68960/
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2023-08-09
tags:
- attack.impact
- attack.t1486
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName: 'gpg.exe'
  filter_main_img:
    Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  condition: selection and not 1 of filter_main_*
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of a renamed "gpg.exe," a tool frequently leveraged by threat actors in ransomware and loader attacks for data encryption and decryption processes. The likely attacker objective is to obfuscate malicious activities related to file encryption, with the potential to impact data integrity and availability within the enterprise. This behavior maps to the MITRE ATT&CK technique T1486 (Data Encrypted for Impact). The primary telemetry source for this detection comes from process creation events within Windows environments, specifically monitoring the `OriginalFileName` attribute. If the behavior is malicious, it can lead to significant disruption, data loss, and potential ransom demands. Importantly, this detection does NOT confirm that the activity is malicious on its own; benign use cases for GnuPG may also trigger this alert.

  ---

  ### Investigation Steps

  - **Verify process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for logs indicating the execution of files ending in "gpg.exe" or "gpg2.exe." Look for the parent process and execution context to determine if it appears suspicious.

  - **Identify associated command-line arguments:** Analyze the command-line arguments of the process, which may provide context about its usage. Malicious executions might involve unusual flags, such as those targeting multiple files or directories.

  - **Examine file properties:** Investigate the attributes of the executable file in question. Legitimate GPG installations will typically have version information; anything else, such as missing details or altered timestamps, may indicate malicious behavior.

  - **Assess recent changes to system files:** Confirm log entries for modifications in critical system files or directories where GPG might be used for encryption, especially if those changes coincide with the execution of the detected process.

  - **Monitor for lateral movement or file encryption activity:** Investigate logs from file shares or critical servers for unusual read/write activity following the detection of "gpg.exe" execution, as this could indicate an ongoing ransomware operation.

  ---

  ### Prioritization

  This alert is classified as high severity due to its potential impact on data integrity and availability within the environment. The likelihood of malicious abuse is significant, as this behavior is commonly weaponized in ransomware attacks, making it critical to triage it promptly and thoroughly.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if execution logs are not consistently collected or if verbose logging for the specific process creation is disabled. Legitimate activities that may trigger this alert include the use of GnuPG for encryption in development or administrative tasks. An additional detection to consider is monitoring for other encryption tools or known ransomware file patterns, which can enhance threat detection and response capabilities.

