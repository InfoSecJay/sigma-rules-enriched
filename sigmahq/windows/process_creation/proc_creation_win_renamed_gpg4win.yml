title: Renamed Gpg.EXE Execution
id: ec0722a3-eb5c-4a56-8ab2-bf6f20708592
status: test
description: Detects the execution of a renamed "gpg.exe". Often used by 
  ransomware and loaders to decrypt/encrypt data.
references:
- https://securelist.com/locked-out/68960/
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2023-08-09
tags:
- attack.impact
- attack.t1486
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName: 'gpg.exe'
  filter_main_img:
    Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  condition: selection and not 1 of filter_main_*
level: high
note: |
  ### Technical Context

  This rule detects the execution of a renamed instance of "gpg.exe," commonly exploited by adversaries for data decryption or encryption processes as part of ransomware operations or malware loaders. The likely attacker objective includes data exfiltration or malicious data manipulation, which directly impacts the integrity and availability of enterprise data. Relevant to this detection are the MITRE ATT&CK techniques T1486 (Data Encrypted for Impact) and T1560 (Network File Copy).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If successfully executed for malicious purposes, this behavior can lead to significant data loss or operational disruption. This detection does NOT confirm malicious intent on its own, as benign uses of similar processes might exist.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 for the instances of "gpg.exe." Check parent process IDs (PPID) to identify the legitimate workflows that initiated the process. Expected behavior includes administrative scripts or scheduled tasks executing the process.

  - **Determine the file path of execution:** Look for the execution path of the detected process. Gpg.exe should not exist in unconventional directories (e.g., user profiles); for benign instances, the path might be within the official installation directory (e.g., C:\Program Files\GnuPG\bin\).

  - **Correlate with other security alerts:** Cross-reference alerts from EDR solutions or SIEMs for any related malicious indicators, such as outbound network connections to known C2 servers or additional process creations that indicate possible lateral movement.

  - **Analyze command line parameters:** Check the command line argument in Security Event ID 4688 entries. Malicious executions may include unusual flags or arguments typical of data manipulation and encryption, such as specifying unique file paths or encrypted output files.

  - **Validate log configuration:** Ensure that your logging configuration captures all relevant process creation events. Missing or improperly configured logging (like Sysmon not installed or misconfigured) can lead to gaps in detection capabilities for similar evasion techniques.

  ### Prioritization

  This alert is categorized as high severity due to its potential impact on critical systems, the high likelihood of being abused in data compromise scenarios, and the prevalence of ransomware utilizing renamed gpg.exe binaries. This behavior is often weaponized, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations may arise from naming obfuscation, where legitimate applications may also be renamed or improperly executed from rogue directories. Required log sources must include both Windows Event Logging and Sysmon for reliable detection; installation and configuration of Sysmon are essential. Legitimate activities, such as system administrator actions involving legitimate data encryption, may also trigger this alert. It is beneficial to have companion detections for unusual file activity related to encrypted files, such as sudden bulk file modifications or deletions.

