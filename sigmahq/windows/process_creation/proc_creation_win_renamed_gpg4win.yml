title: Renamed Gpg.EXE Execution
id: ec0722a3-eb5c-4a56-8ab2-bf6f20708592
status: test
description: Detects the execution of a renamed "gpg.exe". Often used by ransomware
  and loaders to decrypt/encrypt data.
references:
- https://securelist.com/locked-out/68960/
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2023-08-09
tags:
- attack.impact
- attack.t1486
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName: 'gpg.exe'
  filter_main_img:
    Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  condition: selection and not 1 of filter_main_*
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of a renamed `gpg.exe`, a legitimate command-line utility typically used for encryption and signing. Attackers often rename or misuse this tool to facilitate malicious activities, particularly in the context of ransomware operations and various loading mechanisms. The primary objective of such attacks is to gain unauthorized access to and control over sensitive data, encrypting it to prevent access by the victim and demanding ransom for decryption.

  In terms of MITRE ATT&CK alignment, this activity is related to the **Impact** tactic, specifically under the **Data Encrypted for Impact** technique (T1486). This technique is commonly employed by adversaries to disrupt the availability of data, potentially leading to operational downtime or financial loss for the targeted organization. Relevant telemetry for this detection primarily comes from process creation logs on Windows systems, which will capture the execution details of processes, including any renamed instances of `gpg.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs for instances of `gpg.exe` or `gpg2.exe`. Pay particular attention to any instances where the original file name is listed as `gpg.exe`, indicating potential misuse.

  - **Correlate with User Behavior**: Investigate the context of the execution by correlating user accounts with the timestamps of when the process was initiated. Look for any anomalous behavior patterns, such as those belonging to unusual accounts or at unusual hours.

  - **Check File Locations**: Examine the directories from where the renamed executables were run. Legitimate `gpg.exe` usage usually occurs in known software installation paths; any execution from non-standard locations might indicate suspicious activity.

  - **Assess Other Security Alerts**: Look for other related security alerts or indicators of compromise (IOCs) that might indicate a broader attack campaign, such as concurrent anomalies in network traffic or file activity linked to ransomware behaviors.

  ### Prioritization
  The severity of this alert is high due to the potential impact of ransomware attacks on businesses, which can lead to significant data loss, operational disruption, and financial damage. The likelihood of encountering this tactic is elevated, given the rise of ransomware threats in various industries.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage exists if the threat actor employs further obfuscation techniques to mask the presence of `gpg.exe` or similar tools. Additionally, this detection assumes that the original file name is preserved in logs, which may not occur in all environments or configurations. Proper logging of process creations is also necessary for this alert to function effectively, meaning organizations must ensure comprehensive logging is enabled in their Windows environments.

