note: |
  ### Technical Context

  This Sigma rule detects the execution of IEExec.exe with a command line containing HTTP or HTTPS links, indicating that a file is being downloaded and executed. The likely objective of this behavior is to facilitate command and control (C2) activities, allowing an adversary to retrieve malicious payloads remotely for exploitation of the target system. Relevant MITRE ATT&CK tactics include Command and Control (TA0011) and Application Layer Protocol (T1105).

  Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it may lead to data exfiltration or further compromise of the system. Importantly, this detection does NOT confirm the execution of malicious content; it solely indicates that files were downloaded via IEExec.exe.

  ### Investigation Steps

  - **Review the process creation log:** Check Security Event ID 4688 or Sysmon Event ID 1 for entries where the `Image` path ends with `\IEExec.exe` and `CommandLine` includes HTTP/HTTPS links. Compare timestamps with other suspicious activities to assess context.

  - **Check the nature of the downloaded file:** Investigate the command line to identify the specific URL being accessed. Look for known malicious domains or patterns via threat intelligence sources to assess potential risk.

  - **Analyze associated parent processes:** Use Sysmon Event ID 1 to identify the parent process for IEExec.exe execution. Legitimate instances typically originate from trusted applications, whereas suspicious executions may stem from unknown or malicious processes.

  - **Validate file creation:** If the download successfully creates new files, check for associated file creation events (e.g. Windows Event ID 4663) to confirm if any executable or script files were created and executed post-download.

  - **Assess network traffic:** Monitor outbound connections from the host during the time of the alert using network traffic logs (e.g., Windows Firewall logs) to identify potential data leakage or connections to known C2 servers.

  ### Prioritization

  This alert carries a high severity due to the potential impact on compromised systems and the high likelihood of abuse by adversaries leveraging IEExec.exe for downloading malware. Given that this technique (T1105) is commonly weaponized in real-world attacks, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where IEExec.exe is used for legitimate purposes, or where outbound filtering prevents logs from capturing details on the downloaded content. Ensuring that Windows logs for process creation and firewall activity are properly configured is essential for reliable detection. Legitimate software updates or scripts that utilize IEExec.exe may trigger the alert; monitoring for those patterns can help refine detection. Companion detections such as monitoring for unusual PowerShell usage (T1059.001) can enhance visibility and contextual understanding of potential malicious behaviors.

