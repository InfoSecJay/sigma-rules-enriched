title: Node Process Executions
id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
status: test
description: Detects the execution of other scripts using the Node executable packaged
  with Adobe Creative Cloud
references:
- https://twitter.com/mttaggart/status/1511804863293784064
author: Max Altgelt (Nextron Systems)
date: 2022-04-06
tags:
- attack.defense-evasion
- attack.execution
- attack.t1127
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\Adobe Creative Cloud Experience\libs\node.exe'
  filter:
    CommandLine|contains: 'Adobe Creative Cloud Experience\js'     # Folder where Creative Cloud's JS resources are located
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies unauthorized or suspicious script executions through the `node.exe` executable bundled with Adobe Creative Cloud applications. Attackers may leverage this method to execute malicious scripts while evading traditional security measures that do not scrutinize script execution originating from trusted software like Adobe. The typical threat scenario revolves around a malicious actor attempting to execute JavaScript payloads to perform various actions such as data exfiltration, lateral movement, or even deploying payloads on compromised machines.

  Relevant MITRE ATT&CK tactics and techniques associated with this activity include:
  - **Execution (T1203)**: This technique is utilized to execute malicious scripts or code on systems.
  - **Defense Evasion (T1083)**: Attackers may use trusted tools to blend in and avoid detection.
  - **Script Execution (T1059.007)**: Specifically pertains to the execution of scripts through an environment like Node.js.

  The primary data sources that will offer valuable insights into this behavior are process creation logs which detail the execution of processes and command-line arguments being utilized. Analyzing these logs can help pinpoint potentially malicious activity being disguised under legitimate software processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the `process_creation` logs for any instances of `node.exe` being executed. Focus on correlating the parent process to identify suspicious activity that may indicate exploitation.
  - **Analyze Command-Line Arguments**: Investigate the command-line entries associated with the execution of `node.exe`. Specifically, look for any references to the `Adobe Creative Cloud Experience\js` folder and assess whether the arguments align with legitimate usage.
  - **Check for Malicious Scripts**: Inspect for any JavaScript files executed during this activity and assess their contents for indicators of compromise. Pay attention to unusual or obfuscated code that might suggest malicious intent.
  - **Correlate with Other Security Events**: Cross-reference these findings with other security alerts or logs (e.g., EDR alerts, firewall logs) that could indicate lateral movement or data exfiltration activities within the network.

  ### Prioritization
  The medium severity of this alert is warranted due to the potential risk posed by malicious scripts leveraging trusted applications for execution, thereby increasing the likelihood of successful attacks against the enterprise's infrastructure.

  ### Blind Spots and Assumptions
  This detection rule may not capture all malicious activities if attackers use different methods to execute scripts or employ alternative software that does not involve `node.exe`. The detection logic assumes that malicious command lines will explicitly reference the targeted Adobe Creative Cloud location and that relevant process creation logs are being collected consistently. Proper logging settings and configurations must be ensured for accurate detection capabilities.

