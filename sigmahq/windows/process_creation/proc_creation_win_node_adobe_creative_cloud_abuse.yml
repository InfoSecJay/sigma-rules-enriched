title: Node Process Executions
id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
status: test
description: Detects the execution of other scripts using the Node executable 
  packaged with Adobe Creative Cloud
references:
- https://twitter.com/mttaggart/status/1511804863293784064
author: Max Altgelt (Nextron Systems)
date: 2022-04-06
tags:
- attack.defense-evasion
- attack.execution
- attack.t1127
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\Adobe Creative Cloud Experience\libs\node.exe'
  filter:
    CommandLine|contains: 'Adobe Creative Cloud Experience\js'     # Folder where Creative Cloud's JS resources are located
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the Node.js process bundled with Adobe Creative Cloud, specifically when it executes scripts from the specified JavaScript resource folder. The likely attacker objective is to leverage trusted applications to obfuscate malicious activities, such as running scripts that may aid in exfiltration or malware deployment. This behavior fits into the MITRE ATT&CK framework under the tactics of Execution (T1203) and Defense Evasion (T1135).

  Primary telemetry sources include Windows process creation events from Sysmon (Event ID 1) and standard Security Event Logs (Event ID 4688). If malicious, the impact could involve significant data breaches or system compromise via hidden malware execution. This detection does NOT confirm that a malicious action is occurring; benign activity can trigger it, as legitimate scripts may also be executed using the Adobe Node.js environment.

  ### Investigation Steps

  - **Review process creation events:** Correlate Sysmon Event ID 1 and Security Event ID 4688. Look for processes created with the image path ending in `\Adobe Creative Cloud Experience\libs\node.exe` that do not contain expected command line parameters.

  - **Analyze command line arguments:** Focus on the command line for execution paths involving `\js`. Legitimate executions should reflect standard Adobe operations, such as rendering tasks or updating resources.

  - **Cross-check timestamps against user activity:** Verify whether the execution times align with known user activity. Legitimate use typically occurs within active user sessions during work hours.

  - **Identify high-confidence malicious indicators:** Specifically, look for command lines that invoke unusual JavaScript files, or those not part of the Adobe Creative Cloud suite, which could suggest exploitation or unauthorized access.

  - **Investigate parent-child process relationships:** Check for unusual parent processes (like `cmd.exe` or `powershell.exe`) initiating the Node.js executable, as these can be strong indicators of malicious intent and abuse of trusted applications.

  ### Prioritization

  This alert has medium severity based on the criticality of the Adobe Creative Cloud application inferred in creative and development environments. While abuse of such a trusted application is less common, the likelihood of adversaries utilizing creative tools for malicious purposes is increasing, given their access to scripting capabilities.

  ### Blind Spots and Assumptions

  Potential evasion techniques include adversaries modifying command-line parameters to hide malicious intent. Reliably detecting this behavior requires comprehensive logging from Sysmon; ensure that System and Security logs are properly aggregated. Legitimate activities may trigger the alert, particularly during software updates or user-initiated processes within Creative Cloud. A related detection rule monitoring for unusual parent processes invoking Node.js could further strengthen alert coverage.

