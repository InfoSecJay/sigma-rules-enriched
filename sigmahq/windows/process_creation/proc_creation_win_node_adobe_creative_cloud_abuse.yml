title: Node Process Executions
id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
status: test
description: Detects the execution of other scripts using the Node executable 
  packaged with Adobe Creative Cloud
references:
- https://twitter.com/mttaggart/status/1511804863293784064
author: Max Altgelt (Nextron Systems)
date: 2022-04-06
tags:
- attack.execution
- attack.stealth
- attack.t1127
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\Adobe Creative Cloud Experience\libs\node.exe'
  filter:
    CommandLine|contains: 'Adobe Creative Cloud Experience\js'     # Folder where Creative Cloud's JS resources are located
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of scripts through the Node.js executable that is packaged with Adobe Creative Cloud. Malicious actors may leverage this behavior to execute arbitrary JavaScript as part of script-based attacks, using trusted applications like Adobe to bypass security controls. The relevant MITRE ATT&CK tactics are **Execution (T1203)** and **Script Execution (T1059.007)**. The primary telemetry source is the Windows process creation logs, specifically the event logs for process creation (Security Event ID 4688) or Sysmon Event ID 1. If detected as malicious, the security impact could involve unauthorized data access, lateral movement, or other execution of harmful scripts. It's important to note that this detection does NOT confirm that the executed script is inherently malicious without further context.

  ### Investigation Steps

  - **Check execution details:** Review Security Event ID 4688 and Sysmon Event ID 1 logs for instances where `Image` ends with `\node.exe`. Look for the `CommandLine` field indicating command usage.

  - **Identify suspicious command line arguments:** Look for CommandLine strings that contain JavaScript (.js) paths in the folder `Adobe Creative Cloud Experience\js`. A command line that includes internal paths in a typical user environment, such as `javaScript.js`, could indicate potential malicious use.

  - **Determine user context:** Review the `User` field in the process creation events. If the process was initiated by a service account or an unusual user account without a legitimate need for Adobe Creative Cloud, it may indicate malicious activity.

  - **Validate benign activity:** Identify historical legitimate usage of Adobe Creative Cloud within the environment. Look for typical signatures such as specific user accounts or regular operational patterns that align with normal use.

  - **Correlate with file activity:** Check for any file modifications or network activity that coincide with the timing of the process execution by reviewing related Event ID 4663 for file modification along with any unusual network connectors in the logs.

  ### Prioritization

  This alert is of medium severity due to the potential for misuse of trusted applications, particularly in environments heavily using Adobe products. Although not commonly weaponized at scale, the context and usage of Node.js can have serious consequences if exploited by an adversary. The criticality of affected systems, especially when dealing with creative assets and data, raises the urgency for investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by potential evasion techniques such as renaming tools or using development systems without robust logging. Reliable detection requires proper configuration of security event logging, particularly for process creation on endpoints. Legitimate activities may include automated script execution during normal software updates or user tasks involving the Adobe suite. Companion detections could include monitoring for abnormal file creations or deletions in conjunction with process executions to bolster detection capabilities.

