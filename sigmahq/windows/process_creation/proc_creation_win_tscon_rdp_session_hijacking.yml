note: |
  ### Technical Context
  This rule detects potential Remote Desktop Protocol (RDP) session hijacking activity, a tactic commonly used by attackers to take control of active RDP sessions on compromised systems. When an attacker gains unauthorized access to an active RDP session using tools like `tscon.exe`, they can manipulate the user’s session, potentially leading to data exfiltration or system compromise.

  In a corporate environment, such behavior might indicate that an attacker is attempting to bypass authentication controls to escalate privileges or gain access to sensitive information on the victim’s account, aligning with the MITRE ATT&CK techniques such as **Remote Desktop Protocol (T1021.001)** and **Credential Dumping (T1003)** since credential access is often needed to initiate session hijacking. The primary data sources for detecting this activity include process creation events on Windows systems, focusing on instances where `tscon.exe` is executed with high integrity levels.

  ### Investigation Steps
  - **Review Process Creation Events:** Collect and analyze system logs for any process creation events surrounding `tscon.exe`. Focus on identifying unusual invocation details, such as the user context under which it was executed and nearby process activities.

  - **Check Integrity Levels:** Validate that any instances where `tscon.exe` is running with a system integrity level or SID `S-1-16-16384` are legitimate, as this is indicative of potential session hijacking attempts.

  - **Correlate User Sessions:** Investigate the user accounts involved in the RDP session. Look for discrepancies or unexpected logons/logoffs that coincide with `tscon.exe` executions, especially in cases where an account shows signs of recent credential access.

  - **Monitor Network Activity:** Analyze recent network traffic for any unusual RDP connections or patterns that coincide with discovered `tscon.exe` events, including source IPs that were not previously associated with legitimate administrative tasks.

  ### Prioritization
  The alert is classified as medium severity due to the potential impact of RDP session hijacking on data integrity and system security. Given the prevalence of remote access in enterprise environments and the likelihood of attackers employing session hijacking tactics, swift investigation is critical.

  ### Blind Spots and Assumptions
  This detection rule relies on the assumption that appropriate logging for process creation events is enabled and is capturing sufficient detail for analysis. Gaps may exist in environments where logging is not comprehensive or where legitimate administrative activities could generate false positives, especially in high-privilege user scenarios. Additionally, if processes can be masked or strategies for session hijacking evolve, the effectiveness of this detection may diminish without regular updates.

