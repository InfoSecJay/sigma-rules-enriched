note: |
  ### Technical Context

  This rule detects potential RDP session hijacking, focusing specifically on instances where the `tscon.exe` process is initiated. This behavior commonly indicates an attacker attempting to take control of an existing Remote Desktop Protocol (RDP) session, potentially allowing unauthorized access to sensitive data or systems. The relevant MITRE ATT&CK tactic is "Execution," and the technique is "Remote Services: RDP Hijacking" (T1076).

  Primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688, which provides detailed information about process execution. If a hijacking occurs, the impact could be significant, as it leads to unauthorized access to user sessions, exposing critical data. It's important to note that this detection does not confirm a successful hijacking on its own; additional context is needed to assess intent and impact.

  ### Investigation Steps

  - **Check for process creation events**: Review Event ID 4688 for instances where `tscon.exe` is executed. Look for parent process IDs indicating the command line used and any suspicious activity leading up to the event.

  - **Analyze the integrity level of the process**: Validate for processes with IntegrityLevel `System` or `S-1-16-16384`, as this level of execution is unusual for legitimate RDP user sessions.

  - **Evaluate normal administrative behavior**: Confirm if the execution of `tscon.exe` correlates with documented administrative activities, such as system maintenance or scheduled tasks, to identify potential benign actions.

  - **Identify active RDP sessions**: Use `query session` command on the server, or review Terminal Services logs, to see if there are any other active sessions corresponding to the identified `tscon.exe` execution.

  - **Look for signs of fragmentation in session activity**: Cross-reference the execution time of `tscon.exe` with session disconnect events (Event ID 4624) to determine if a legitimate session was disconnected immediately before hijacking.

  - **Assess user abnormality**: Verify that the user's account used to initiate `tscon.exe` typically has administrative rights, focusing on any unusual geographic or timing patterns—especially if the user is not part of a normal operational role.

  ### Prioritization

  The severity of this alert is medium due to its potential impact on sensitive systems accessed via RDP. While RDP hijacking attempts are increasingly weaponized by adversaries, the presence of `tscon.exe` does not guarantee malicious intent, necessitating further analysis to evaluate the likelihood of abuse.

  ### Blind Spots and Assumptions

  This detection may be bypassed through obscure administrative tools or complex layered attacks that obscure legitimate administrative activities. Reliable detection requires accurate Event Logs from both Security and Terminal Services, and conditions that may trigger this alert include regular administrative remote maintenance. A companion alert to consider is the monitoring of RDP login attempts (Event ID 4624), which can provide additional context on sessions potentially being hijacked.

