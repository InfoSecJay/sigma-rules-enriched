  ---

  ### Technical Context

  This rule detects the execution of the PowerShell cmdlet `Get-ADComputer` with specific output redirection operators, indicating an attempt to collect and export computer account information from Active Directory. The likely attacker objective is to gather information about the network environment, which can be leveraged for lateral movement or privilege escalation. This behavior aligns with the MITRE ATT&CK tactic of Discovery (T1087) and technique of Active Directory Discovery (T1033).

  The primary telemetry sources include Windows Security Event logs (Event ID 4688 for process creation) and PowerShell logs that capture command execution. If malicious, this behavior could facilitate unauthorized access or manipulation of systems, critical in preventing sensitive data breaches. Notably, detection of this activity does NOT confirm that a compromise has occurred, as it can also be triggered by legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Verify the process creation event:** Check Windows Security Event ID 4688 for processes initiating PowerShell (powershell.exe or pwsh.exe) with the command line containing `Get-ADComputer`. This confirms if the cmdlet was indeed executed.

  - **Inspect command line parameters:** Examine the command line arguments used in the process, particularly for output redirection (`>`, `| Select`, `Out-File`, etc.). Malicious indicators include usage patterns inconsistent with standard administrative functions.

  - **Determine the execution context:** Identify the user account that executed the cmdlet. Cross-reference this account against typical administrative practices within the organization to assess legitimacy; frequent activity from non-admin accounts is a red flag.

  - **Monitor for file output artifacts:** Validate whether any files were created or modified during the execution of this command. Look for new or modified files with extensions like .txt or .csv in locations such as `C:\Users\<UserName>\Documents\` or defined output directories.

  - **Assess typical legitimate usage:** Consider how legitimate administrators typically use the `Get-ADComputer` cmdlet in regular monitoring or inventory scripts. Legitimate commands will typically lack unusual or excessive output methods.

  - **Review related alerts:** Check for other related alerts suggesting reconnaissance behavior, such as results from `Get-ADUser` (also applicable under the same MITRE technique), to strengthen the investigation.

  ---

  ### Prioritization

  The alert has medium severity due to the moderate potential impact of information gathering on high-value systems. The likelihood of misuse is significant, as attackers often utilize such commands in their reconnaissance phase. While this behavior is somewhat common for administrative tasks, unauthorized execution can indicate emerging threats.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use obfuscation techniques or execute similar commands outside the expected execution flow. Reliable detection requires proper logging configurations for PowerShell command execution and process creation. Legitimate administrative scripts may trigger this alert if not filtered appropriately based on execution context. A related detection is any abnormal use of `Get-ADUser`, which enhances visibility into potential reconnaissance activities.

