note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell cmdlet `Get-ADComputer` to collect information about computers in an Active Directory environment and output that information to a file. The behavior suggests potential reconnaissance activity, where an attacker seeks to gather detailed network and system data to plan further exploitation steps. This aligns with the MITRE ATT&CK framework under the tactic "Discovery" (TA0007) and the technique "Account Discovery" (T1033).

  The primary telemetry sources are Windows Event Logs related to process creation, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing the details of executed commands. If this activity is malicious, it could lead to further exploitation or lateral movement within the network, highlighting a significant risk to security. Notably, this alert does not confirm that malicious activity is occurring on its own, as legitimate administrative tasks can also trigger it.

  ### Investigation Steps

  - **Investigate process creation events:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for entries related to `powershell.exe` or `pwsh.exe`. Look for CommandLine entries containing `Get-ADComputer`, and check for output redirection (e.g., '>', 'Out-File', 'Set-Content').

  - **Check for unusual user accounts:** Validate the user account associated with the PowerShell command. Compare against known administrators. An unexpected user performing this action could indicate malicious intent.

  - **Review output file paths:** Identify any files created during the execution, particularly those written by legitimate scripts. Check if the output files are being generated in unexpected directories (e.g., user home directories versus administrative shares).

  - **Examine the context of legitimate usage:** Cross-reference the executed command against typical legitimate activities within your organization, such as regular AD audits. Distinguish if the command was executed during regular maintenance windows by recognized admin accounts.

  - **Document indicator patterns:** Look for high-confidence indicators like unusual patterns in command execution, such as multiple rapid successive calls to `Get-ADComputer` beyond normal operational use.

  - **Monitor for related activities:** Assess if any follow-up actions were taken after this command execution, such as attempts to enumerate users or access sensitive data. Use logs from related detection rules for comprehensive insight.

  ### Prioritization

  This alert has a medium severity level. Although it may indicate benign administrative activity, the likelihood of malicious use for unauthorized reconnaissance is high, particularly if linked with other suspicious behaviors. The technique is commonly weaponized by attackers for lateral movement or reconnaissance purposes, necessitating prompt review.

  ### Blind Spots and Assumptions

  This detection may have limitations due to legitimate administrative scripts that employ similar commands, potentially generating false positives. Proper logging configurations need to be in place to capture all process creations effectively, particularly for PowerShell cmdlets. Additionally, legitimate activities such as regular audits may trigger this alert, requiring close monitoring of user behavior. Companion detections that might strengthen coverage include monitoring for suspicious account creations or modifications following reconnaissance actions.

