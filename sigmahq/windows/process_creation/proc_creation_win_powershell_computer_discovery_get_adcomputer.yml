detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - 'Get-ADComputer '
    - ' -Filter \*'
    CommandLine|contains:
    - ' > '
    - ' | Select '
    - 'Out-File'
    - 'Set-Content'
    - 'Add-Content'
  condition: all of selection_*
falsepositives:
- Legitimate admin scripts may use the same technique, it's better to exclude specific
  computers or users who execute these commands or scripts often
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the **Get-ADComputer** cmdlet in PowerShell, which can be exploited by malicious actors to gather information about computers within an Active Directory environment. Attackers may use this command to facilitate lateral movement within a network, often seeking to collect data on computer systems for further exploitation or reconnaissance. The ultimate objective of the attacker could include obtaining sensitive information, pivoting into other systems, or preparing for a larger attack such as ransomware deployment.

  The relevant MITRE ATT&CK tactics include:
  - **Discovery** (TA0007)
    - **Active Directory Enumeration** (T10679): This cmdlet allows attackers to sift through AD to gather insights on the environment.

  Primary data sources to consider when investigating this activity involve:
  - PowerShell process creation events to capture the cmdlet execution.
  - Command line arguments passed to PowerShell, useful for gaining context about the actions performed.
  - Audit logs from Active Directory to note any unusual patterns in query behaviors linked to the cmdlet.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for events related to `powershell.exe` or `pwsh.exe` in your process creation logs that show the `Get-ADComputer` cmdlet being executed.
  - **Analyze Command Line Arguments:** Examine command line arguments associated with the PowerShell instance, specifically looking for indications that output is being redirected (e.g., `>`, `| Select`, `Out-File`, `Set-Content`, `Add-Content`).
  - **Check for Patterns in Active Directory Queries:** Investigate LDAP or Active Directory logs for unusual querying frequency or volume, which could suggest reconnaissance activities beyond normal administrative tasks.
  - **Assess User and Computer Context:** Consider the context from which the command was run, noting whether it was a legitimate administrative account or an unexpected source, and look for any indications of compromised credentials.

  ### Prioritization
  The severity of this alert is considered medium because while the command itself can be run legitimately by an administrator, its misuse by unauthorized actors for discovery poses significant risk due to potential follow-on attacks. Rapid response is crucial to mitigate the risk to the enterprise environment.

  ### Blind Spots and Assumptions
  This rule may have gaps in detection coverage where legitimate administrative scripts frequently use the **Get-ADComputer** cmdlet, resulting in potential false positives. The detection logic assumes that the cmdlet will be executed in a manner typically associated with enumeration and data export, which may not capture all forms of misuse. Additionally, proper logging must be enabled for both process creation and command line parameters for this alert to function effectively, ensuring that the relevant telemetry is captured and available for analysis.

