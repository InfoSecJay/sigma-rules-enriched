title: Copy From Or To Admin Share Or Sysvol Folder
id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
status: test
description: Detects a copy command or a copy utility execution to or from an Admin
  share or remote
references:
- https://twitter.com/SBousseaden/status/1211636381086339073
- https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
- https://www.elastic.co/guide/en/security/current/remote-file-copy-to-a-hidden-share.html
- https://www.microsoft.com/en-us/security/blog/2022/10/18/defenders-beware-a-case-for-post-ransomware-investigations/
author: Florian Roth (Nextron Systems), oscd.community, Teymur Kheirkhabarov @HeirhabarovT,
  Zach Stanford @svch0st, Nasreddine Bencherchali
date: 2019-12-30
modified: 2025-10-22
tags:
- attack.lateral-movement
- attack.collection
- attack.exfiltration
- attack.t1039
- attack.t1048
- attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_target:
    CommandLine|contains:
    - '\\\\*\\*$'         # example \\SVR_NAME\ADMIN$
    - '\Sysvol\'
  selection_other_tools:
  - Image|endswith:
    - '\robocopy.exe'
    - '\xcopy.exe'
  - OriginalFileName:
    - 'robocopy.exe'
    - 'XCOPY.EXE'
  selection_cmd_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cmd_cli:
    CommandLine|contains: 'copy'
  selection_pwsh_img:
  - Image|contains:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell_ise.exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains:
    - 'copy-item'
    - 'copy '
    - 'cpi '
    - ' cp '
    - 'move '
    - ' move-item'
    - ' mi '
    - ' mv '
  condition: selection_target and (selection_other_tools or all of selection_cmd_*
    or all of selection_pwsh_*)
falsepositives:
- Administrative scripts
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects file copy operations involving administrative shares (like ADMIN$) or Sysvol folders, indicating potential lateral movement or data exfiltration attempts by an attacker. The likely objective is to steal sensitive information or deploy malicious payloads during post-exploitation phases. This behavior falls under the MITRE ATT&CK tactics of Lateral Movement (T1075), Collection (T1039), and Exfiltration (T1048).

  The primary telemetry sources include Windows process creation events, particularly focusing on Event ID 4688, which details process execution, including command line arguments. If malicious, this behavior can lead to unauthorized data exposure or modification. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks might also trigger the alert.

  ---

  ### Investigation Steps

  - **Review process creation events**: Analyze Security Event ID 4688 logs for unusual command lines that reference ADMIN$ or Sysvol, particularly looking for terms such as `copy`, `robocopy`, or `xcopy`.

  - **Correlate against remote access logs**: Check for prior authentication events (Event ID 4624) to determine if the user had administrative privileges or if there were abnormal access patterns before the copy action was executed.

  - **Identify script execution on hosts**: Review Windows PowerShell logs (Event ID 4104) for any copy-related commands being executed, particularly focusing on those invoking `copy-item` or `move-item`. Legitimate administrative activity may include scheduled maintenance tasks running these commands.

  - **Examine associated network activity**: Investigate any network logs that might show connections to the affected administrative shares, particularly sysvol or admin shares, to identify patterns consistent with data exfiltration or misuse.

  - **Confirm benign operations**: Check recent administrative tasks to determine if any authorized backup or file transfer operations utilized common tools like `xcopy.exe` or `robocopy.exe` from system administrators.

  - **Watch for high-confidence malicious patterns**: Identify instances where the COPY commands are executed by non-administrative services or unusual user accounts, especially if accompanied by failed access logs prior to the copy event.

  ---

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on sensitive data stored in administrative shares. Given that this behavior is sometimes weaponized in lateral movement and exfiltration scenarios, the likelihood of malicious use is significant, warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  The detection may miss scenarios where attackers use obfuscated commands or legitimate administrative tools that do not trigger the defined log events. Reliable detection requires proper logging configurations for process creation and network activity. Legitimate administrative scripts running file operations may cause false positives. Companion detections, such as monitoring for unusual RDP sessions (T1076) or suspicious file creation events, can help strengthen coverage against potential threats.

