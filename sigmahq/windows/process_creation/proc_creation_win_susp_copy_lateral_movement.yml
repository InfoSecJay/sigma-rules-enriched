title: Copy From Or To Admin Share Or Sysvol Folder
id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
status: test
description: Detects a copy command or a copy utility execution to or from an 
  Admin share or remote
references:
- https://twitter.com/SBousseaden/status/1211636381086339073
- https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
- https://www.elastic.co/guide/en/security/current/remote-file-copy-to-a-hidden-share.html
- https://www.microsoft.com/en-us/security/blog/2022/10/18/defenders-beware-a-case-for-post-ransomware-investigations/
author: Florian Roth (Nextron Systems), oscd.community, Teymur Kheirkhabarov 
  @HeirhabarovT, Zach Stanford @svch0st, Nasreddine Bencherchali
date: 2019-12-30
modified: 2025-10-22
tags:
- attack.lateral-movement
- attack.collection
- attack.exfiltration
- attack.t1039
- attack.t1048
- attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_target:
    CommandLine|contains:
    - '\\\\*\\*$'         # example \\SVR_NAME\ADMIN$
    - '\Sysvol\'
  selection_other_tools:
  - Image|endswith:
    - '\robocopy.exe'
    - '\xcopy.exe'
  - OriginalFileName:
    - 'robocopy.exe'
    - 'XCOPY.EXE'
  selection_cmd_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cmd_cli:
    CommandLine|contains: 'copy'
  selection_pwsh_img:
  - Image|contains:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell_ise.exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains:
    - 'copy-item'
    - 'copy '
    - 'cpi '
    - ' cp '
    - 'move '
    - ' move-item'
    - ' mi '
    - ' mv '
  condition: selection_target and (selection_other_tools or all of 
    selection_cmd_* or all of selection_pwsh_*)
falsepositives:
- Administrative scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects file copy operations executed via command-line utilities to or from Windows administrative shares (e.g., ADMIN$ and SYSVOL). Such behaviors could indicate an attacker attempting to move files for lateral movement, data exfiltration, or preparation for further exploitation, among other malicious objectives. This detection aligns with MITRE ATT&CK tactics: Lateral Movement (T1021), Collection (T1039), and Exfiltration (T1048).

  The primary telemetry sources for this detection include Windows process creation logs, specifically focusing on processes and command-line parameters revealing file copy operations. If the activity is malicious, it can lead to unauthorized access to sensitive data, data breaches, or further system compromise. Importantly, this detection does NOT confirm that all file copy operations to these shares are malicious, as legitimate administrative activities might trigger similar alerts.

  ### Investigation Steps

  - **Analyze the command line details:** Examine the specific command line string leading to the alert. Look for executed commands containing `\\*\\$`, `Sysvol`, or any copy command (e.g., `copy`, `robocopy`, `xcopy`). Flag alerts involving unusual or non-administrative users for further investigation.

  - **Check process creation logs:** Review Security Event ID 4688 (Process Created) for the relevant Image Name. Look especially for `cmd.exe`, `powershell.exe`, `robocopy.exe`, or `xcopy.exe`. Identify the user account associated with the command to assess whether it is an authorized administrative user or an unexpected account.

  - **Identify source and destination specifics:** Determine the share used (e.g., ADMIN$, SYSVOL) and the context of the file being copied. A copy to or from these network shares by non-administrative accounts is a significant red flag indicating likely malicious intent.

  - **Review for legitimate use cases:** Verify any recent temp administrative activities or staffing changes that could explain the behavior. Legitimate administrative tasks may involve routine backups or deployments to the SYSVOL directory by authorized admins.

  - **Correlate with other log sources:** Check Event ID 5140 (Network Share Access) to validate attempts to access these shares. Look for high-volume access patterns that may indicate data theft or lateral movement, especially from unexpected IP addresses.

  - **Assess network traffic:** If available, analyze network logs (e.g., firewall logs, NetFlow data) for unusual outgoing connections to external addresses following the event. Any transfers of large datasets could corroborate a malicious file exfiltration attempt.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive Windows administrative shares and the likelihood of exploitation. Given that the behavior could indicate either benign administrative action or malicious activity, high vigilance is necessary for user accounts without administrative privileges accessing these shares.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative tasks inherently involving file operations to and from administrative shares. Evasion techniques may include using less common tools or invoking file copy operations with obfuscated commands. Reliable detection requires sufficient logging configuration of Windows Event Logs or Sysmon. Companion detections might include monitoring for unusual lateral movement through the application of process creation and network connection logs, enhancing overall visibility into anomalous activities.

