detection:
  selection_img:
  - Image|endswith: '\fsutil.exe'
  - OriginalFileName: 'fsutil.exe'
  selection_cli:
    CommandLine|contains: 'drives'
  condition: all of selection_*
falsepositives:
- Certain software or administrative tasks may trigger false positives.
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the `fsutil` command-line utility to enumerate drives on a Windows system. Attackers may leverage `fsutil` to gather information about the connected drives, which can provide insights into the system's configuration and may reveal sensitive information stored on various disks. The behavior typically aligns with reconnaissance activities where the attacker seeks to map out the environment or find potential targets for further exploitation.

  The suspected threat family for this rule includes various actors who utilize typical enumeration tools, with a notable mention of the Turla group, known for utilizing `fsutil` for information gathering. The rule correlates to the MITRE ATT&CK framework, specifically under the tactic of "Discovery", and technique T1120, which relates to the discovery of system information.

  Primary data sources for this detection will include process creation logs, particularly monitoring for executions of `fsutil.exe`, as well as analyzing command-line parameters passed to this utility to detect any enumeration of drives.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine `process_creation` logs for instances of `fsutil.exe` execution. Focus on extracting command-line arguments to identify any enumeration attempts.

  - **Correlate with User Activity**: Investigate the user initiating the `fsutil` command. A sudden spike in activity by non-administrative accounts could indicate unauthorized use.

  - **Analyze Historical Context**: Look into the recent system changes and administrative tasks that may contextually justify the use of `fsutil`. This helps in differentiating between legitimate administrative tasks and malicious activity.

  - **Monitor Environment for Further Enumeration**: Keep an eye on follow-on activities that typically accompany drive enumeration, such as file access or additional system discovery commands.

  ### Prioritization
  The alert severity is considered low, as the use of `fsutil` for drive enumeration can sometimes occur during legitimate administrative tasks. However, it's essential to remain vigilant due to the potential for misuse by attackers to gain insights into system configurations.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage concerning legitimate administrative activities that may trigger this alert, leading to potential false positives. The detection logic assumes that the execution of `fsutil` with drive enumeration is indicative of malicious activity, which may not always be the case. Additionally, the alert relies on proper logging of process creation events, which must be configured on the Windows systems for the detection to function effectively.

