note: |
  ### Technical Context

  This Sigma rule detects the use of the `fsutil` command to enumerate connected drives on a Windows system. An attacker may utilize this command as part of their reconnaissance phase to identify available drives, potentially leading to further exploitation or data exfiltration activities. This behavior aligns with the MITRE ATT&CK tactic of **Discovery** and specifically the technique **T1120: Peripheral Device Discovery**. The primary telemetry sources for detection are Windows process creation logs, specifically the events generated when `fsutil.exe` is executed. If this command is used maliciously, it raises concerns about information gathering that could facilitate further attacks or exploitation. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also invoke this command.

  ### Investigation Steps

  - **Check specific command execution:** Review Windows Security Event ID 4688 for instances where `fsutil.exe` is executed, filtering for those with CommandLine values that contain "drives".

  - **Assess user context:** Identify the user account executing the command; legitimate use often involves administrative accounts or system services, while suspicious user accounts may indicate unauthorized activity.

  - **Examine the time context:** Document when the command was run to correlate against other suspicious events. Note if it occurs during unusual hours or immediately following other potential attack vectors.

  - **Compare with known good activity:** Validate expected behavior by checking for administrative tasks or software that might legitimately use `fsutil.exe`, particularly in environments where drive enumeration is part of routine maintenance.

  - **Look for process tree indications:** Utilize Sysmon Event ID 1 to analyze the parent-child relationship of `fsutil.exe` to identify if it was spawned by a non-legitimate process, indicating possible malicious activity.

  - **Review surrounding logs:** Analyze Windows Security Event ID 5145 to check for file access patterns that may follow the `fsutil` command invocation, ensuring there is no excessive file access that could indicate data exfiltration attempts.

  ### Prioritization

  This alert is classified as low severity. It indicates a potential precursor to more disruptive or damaging behavior, but drive enumeration is not inherently harmful by itself. There is a moderate likelihood of malicious abuse in environments where sensitive information resides, but this behavior is common among system administrators for legitimate purposes.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative uses of `fsutil`, leading to false positives. Sufficient log source configurations must be in place to capture process creation events effectively. Automated scripts or third-party management tools may regularly invoke similar commands, raising the possibility of benign alerts. A related detection rule for monitoring drive access patterns post-enumeration could strengthen coverage, such as logging file access activities via Windows Event ID 5145.

