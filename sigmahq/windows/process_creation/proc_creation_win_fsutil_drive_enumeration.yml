  ---

  ### Technical Context

  This Sigma rule detects the use of the `fsutil.exe` utility to enumerate connected drives on a Windows system. The behavior suggests that an attacker may be attempting to map out available drives for potential exfiltration or malicious execution on those drives. This technique relates to the MITRE ATT&CK framework under the Discovery tactic, specifically technique T1120: Peripheral Device Discovery.

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line execution details. If this activity is malicious, it can lead to greater exposure of sensitive data or unauthorized access to connected storage devices. It's important to note that this detection alone does not confirm malicious intent; legitimate administrative activities might also trigger this rule.

  ---

  ### Investigation Steps

  - **Review Process Creation Events:** Check Security Event ID 4688 or Sysmon Event ID 1 for any instances of `fsutil.exe` being executed. Look for command lines containing the term `drives`, particularly executed by non-administrative users or unusual accounts.

  - **Identify User Context:** Determine the user context in which the `fsutil.exe` command was executed. If it was executed by a service account, compare this against known legitimate administrative tasks to assess if it aligns with expected behavior.

  - **Check for Recent Drive Access:** Cross-reference any connected drive configurations in the environment (e.g., Event ID 5136 in Directory Service logs for drive mappings) to confirm whether the drive enumeration aligns with recent changes or legitimate access patterns.

  - **Analyze Command Line Context:** Validate the command line context and ensure that any parameters passed with `fsutil.exe` do not contain additional unexpected commands that could indicate malicious intent, such as attempts to manipulate or interact with those drives.

  - **Monitor for Follow-Up Actions:** Beyond the fsutil enumeration, investigate if any additional follow-up actions were taken subsequently, such as file access or modification patterns on those enumerated drives (e.g., Event ID 4663 for file access events).

  ---

  ### Prioritization

  The alert severity is low, as it could indicate benign administrative tasks if seen in established processes. However, given the low barrier to execution of `fsutil.exe`, there exists a likelihood of misuse by an attacker, particularly if performed in conjunction with other suspicious activities. Therefore, context and correlation with other alerts are critical for proper assessment.

  ---

  ### Blind Spots and Assumptions

  Detection may miss executions of `fsutil.exe` if log sources are misconfigured or not present, particularly on systems without Sysmon or appropriate event logging levels. Legitimate administrative tasks, such as managing drive mappings or performing maintenance, may also trigger this alert. Companion detections such as monitoring for unusual file access on mapped drives (potential data exfiltration) could provide enhanced context and support for investigation.

