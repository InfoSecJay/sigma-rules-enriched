detection:
  selection_parent:
    ParentImage|endswith: '\explorer.exe'
    CommandLine|contains: '#'
  selection_cli_captcha:
    CommandLine|contains:
    - 'account'
    - 'anti-bot'
    - 'botcheck'
    - 'captcha'
