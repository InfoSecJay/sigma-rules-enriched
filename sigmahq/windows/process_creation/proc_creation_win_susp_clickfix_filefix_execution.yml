note: |
  ---

  ### Technical Context

  This detection rule identifies instances where a user is manipulated into executing commands via clipboard contents, typically involving social engineering techniques. Attackers often employ fake verification prompts or CAPTCHA challenges to coax users into running crafted commands that can execute potentially harmful payloads, frequently utilizing `mshta.exe` or `powershell.exe`.

  Relevant MITRE ATT&CK techniques include *Phishing: Exploit Public-Facing Application (T1204.001)* and *User Execution: Malicious File (T1204.004)*. The primary telemetry source includes process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1. If malicious, these actions could lead to unauthorized access or the installation of malware, severely compromising the integrity of impacted systems. However, this detection does NOT confirm that the command executed was malicious without further corroborating evidence.

  ---

  ### Investigation Steps

  - **Examine Process Creation Logs**: Review Windows Event ID 4688 for processes spawned from `explorer.exe` with command lines containing `#` or suspicious keywords such as "captcha", "verification", or "identify". Look for newly spawned instances of `mshta.exe` or `powershell.exe`.

  - **Validate Command Line Arguments**: For any identified processes, analyze the CommandLine field for evidence of clipboard contents or parameters mimicking legitimate verification scenarios (e.g., 'botcheck'). Legitimate entries typically don't include suspicious strings or payload-like syntax.

  - **Identify User Context**: Determine the user associated with the executed command. Check if the user had any prior interactions with known phishing attempts or suspicious links that may have led to clipboard hijacking.

  - **Review User Activity Log**: Check application logs or browser history to see if the user recently interacted with webpages associated with known phishing campaigns or CAPTCHA challenges. Look for high-risk URLs in browsing history.

  - **Check for Malware Artifacts**: Verify the presence of unusual file creations or modifications associated with the detected process, looking specifically for files created in %TEMP% or other common execution paths utilized by malware.

  ---

  ### Prioritization

  This alert should be regarded as high severity due to the potential impact on critical systems, especially if user credentials or sensitive data could be compromised. Given that similar techniques are frequently employed in social engineering attacks, there is a moderate to high likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  The detection may miss custom or obfuscated commands that do not utilize the typical command patterns identified. It relies on process creation logging being enabled and may not capture attacks that execute quickly or persistently in the background. Legitimate activities might include legitimate verification processes or utilities that invoke similar command line structures. Complementary detections could include monitoring for abnormal outbound connections initiated by `mshta.exe` or `powershell.exe`, reinforcing visibility into potential exfiltration or C2 communications.

