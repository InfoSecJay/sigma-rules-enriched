note: |
  ### Technical Context

  This Sigma rule detects the execution of `taskmgr.exe` (Windows Task Manager) under the SYSTEM user context, which is atypical for most legitimate operations. Attackers may escalate privileges to use this process for various objectives, such as hiding malicious activities or manipulating system performance and settings to undermine security. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1070 - Indicator Removal on Host) and the technique of Process Injection (T1055).

  The primary telemetry source for this detection is Windows process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1. If this execution is malicious, it can lead to significant security impacts, such as privilege escalation, unauthorized access, or system compromise. However, it is crucial to note that this detection does NOT confirm malicious intent on its own; further context regarding system activity and user behavior is needed.

  ### Investigation Steps

  - **Check recent process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1. Look for entries where `Image` contains `taskmgr.exe` and `User` is `SYSTEM`. Legitimate task manager activity typically occurs under user contexts, not SYSTEM.

  - **Investigate parent process information:** Correlate the detected `taskmgr.exe` instance with its parent process in the logs (Event ID 4688/Sysmon ID 1). A legitimate parent might be a user-initiated tool, while an unusual parent (like a remote administration tool) may indicate malicious behavior.

  - **Review active connections:** Utilize netstat or network monitoring logs to examine established connections during the execution of the process. Malicious actors might use `taskmgr.exe` to facilitate or cover network communications, especially to indicators of command and control (C2) infrastructure.

  - **Analyze system performance baselines:** Look into performance metrics (CPU, memory usage) around the time of the alert within log insights or performance monitoring tools. High resource activity concurrent with `taskmgr.exe` run by SYSTEM may indicate a red flag for malicious activity.

  - **Identify related scheduled tasks or services:** Review Scheduled Tasks and services through Windows Event Log (Event ID 4697) to identify any that may have been altered or created to facilitate taskmanager usage by SYSTEM. Legitimate configurations remain consistent across expected change periods.

  ### Prioritization

  This alert is classified as high severity due to the critical nature of the systems potentially flagged and the significant risk posed by malicious privilege escalation and the capability to manipulate system processes. The likelihood of abuse is elevated as attackers frequently leverage system processes for stealthy operations.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where process logging is not thoroughly implemented, as absence of logs can hide both malicious and benign activity. Evasion techniques might include renaming or using different tools to achieve similar ends under the guise of legitimate processes. Legitimate system administrators may execute `taskmgr.exe` for maintenance or troubleshooting, potentially leading to false positives. Consider companion detections such as those for abnormal network activity during the same time frame for holistic investigation coverage.

