note: |
  ### Technical Context

  This Sigma rule detects the execution of the `taskmgr.exe` process under the `LOCAL_SYSTEM` user context. This behavior is unusual because the Windows Task Manager (`taskmgr.exe`) is typically initiated by interactive users and runs under their user context. The likely objective of an attacker using this method is to manipulate the process for suspicious purposes, such as hiding malicious processes or facilitating post-exploitation activities without raising user awareness.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1036), and the technique is **Masquerading** (ID: T1036). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it poses a high security risk as it indicates the potential exploitation of local system privileges to bypass defenses. This detection does not, on its own, confirm that an intrusion has occurred; it only highlights unusual process behavior that warrants further investigation.

  ### Investigation Steps

  - **Review process creation events**: Check Security Event ID 4688 and Sysmon Event ID 1 for the creation of `taskmgr.exe` by `LOCAL_SYSTEM`. Confirm that no legitimate interactive user initiated it.

  - **Check parent process**: Examine the `ParentProcessId` field in the logs for the originating process. If the parent process is related to a known legitimate service or scheduled task, consider it benign; otherwise, flag it for further investigation.

  - **Investigate user privileges**: Verify User SID context in the events. `LOCAL_SYSTEM` context execution without legitimate triggers indicates potential malicious behavior, especially if no prior manual intervention is logged.

  - **Review scheduled tasks**: Search for any scheduled tasks (Task Scheduler logs, Event ID 106) that could have launched `taskmgr.exe` as part of an automation or legitimate maintenance operation. Unexpected tasks might suggest a compromised system.

  - **Correlation with other alerts**: Identify other alerts or logs from endpoints indicating lateral movement or privilege escalation (e.g., unusual account activity). Any related suspicious activity could reinforce the severity of the current alert.

  - **Monitor for file modifications**: Check for unusual file activity related to `taskmgr.exe`, such as file creation events or modifications in directories where it shouldn't be present (e.g., Event ID 4663). Ensure that it was not altered to execute malicious behavior.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential for significant security implications if an attacker exploits `LOCAL_SYSTEM` privileges. The likelihood of abuse is considerable, as this tactic is known to be weaponized in various attack scenarios, particularly in post-exploitation efforts.

  ### Blind Spots and Assumptions

  One limitation in detection is the potential for evasion techniques, such as an attacker using legitimate process creation methods to mask malicious intent or using different executables with similar behavior. Required log sources include both Security Event logs and Sysmon configurations to ensure comprehensive visibility. Legitimate activities, such as system maintenance tasks or automated scripts running with `LOCAL_SYSTEM`, could inadvertently trigger this alert. A related detection to strengthen coverage could be the monitoring of high-privilege account logins, which may indicate further malicious intent when correlated with `taskmgr.exe` execution events.

