note: |
  ### Technical Context
  This rule detects instances where the `taskmgr.exe` process is spawned in the context of the `LOCAL_SYSTEM` user account. The creation of `taskmgr.exe` (Task Manager) under this context could indicate suspicious behavior since Task Manager is typically executed under a user context for monitoring system performance rather than running as `LOCAL_SYSTEM`, which is a highly privileged account. Attackers may leverage this behavior as part of a tactic to manipulate system processes or evade detection by simulating legitimate operations within the system.

  The likely attacker objective could be to establish persistence, conceal malicious activity, or facilitate further privilege escalation by manipulating system processes. Such activities fall under the MITRE ATT&CK tactics of Defense Evasion (ID: T1562) and Indicator Removal on Host (ID: T1040), given the risk that this behavior may allow attackers to hide their presence on a compromised machine effectively.

  The primary data sources pertinent to detecting this rule include process creation logs from Windows Event Logs, specifically filtering for the creation of processes by the `LOCAL_SYSTEM` account, which can provide critical evidence of unexpected or malicious activities.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze Windows Event Logs (Event ID 4688) for `taskmgr.exe` launched by `LOCAL_SYSTEM`. Identify any other associated processes that were launched concurrently.
  - **Correlate with User Activity:** Check for recent user logins or suspicious user activity in the Security logs to determine if there was an unusual context or pattern associated with the `LOCAL_SYSTEM` process creation.
  - **Investigate Execution Context:** Look for additional context regarding the execution environment, including Group Policy settings or scheduled tasks that may indicate lateral movement or privilege escalation tactics.
  - **Assess System Integrity:** Examine system integrity using tools that verify the legitimacy of the `taskmgr.exe` binary. Confirm it is not a masquerade by checking its file path and verifying the signature against known good sources.

  ### Prioritization
  The severity of this alert is rated high due to the potential implications of underprivileged processes spawning in the `LOCAL_SYSTEM` context, which could signify an ongoing attack or a confirmed security breach that compromises critical system integrity.

  ### Blind Spots and Assumptions
  This detection rule operates under the assumption that log collection for process creation events is properly configured and that monitoring is in place for `LOCAL_SYSTEM` actions. Gaps in detection coverage may arise if the logs from certain endpoints are not collected due to network segmentation or if processes are executed in an uncommon or unmonitored manner. Additional configurations might be necessary to capture related events that provide insights into privileged account usage and system manipulations.

