title: Webshell Hacking Activity Patterns
id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
status: test
description: |
  Detects certain parent child patterns found in cases in which a web shell is used to perform certain credential dumping or exfiltration activities on a compromised system
references:
- https://youtu.be/7aemGhaE9ds?t=641
author: Florian Roth (Nextron Systems)
date: 2022-03-17
modified: 2023-11-09
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
   # Webserver
  selection_webserver_image:
    ParentImage|endswith:
    - '\caddy.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\w3wp.exe'
    - '\ws_tomcatservice.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    CommandLine|contains:
    - 'catalina.jar'
    - 'CATALINA_HOME'
    # Suspicious child processes
  selection_child_1:
        # Process dumping
    CommandLine|contains|all:
    - 'rundll32'
    - 'comsvcs'
  selection_child_2:
        # Winrar exfil
    CommandLine|contains|all:
    - ' -hp'
    - ' a '
    - ' -m'
  selection_child_3:
        # User add
    CommandLine|contains|all:
    - 'net'
    - ' user '
    - ' /add'
  selection_child_4:
    CommandLine|contains|all:
    - 'net'
    - ' localgroup '
    - ' administrators '
    - '/add'
  selection_child_5:
    Image|endswith:
            # Credential stealing
    - '\ntdsutil.exe'
            # AD recon
    - '\ldifde.exe'
    - '\adfind.exe'
            # Process dumping
    - '\procdump.exe'
    - '\Nanodump.exe'
            # Destruction / ransom groups
    - '\vssadmin.exe'
    - '\fsutil.exe'
  selection_child_6:
        # SUspicious patterns
    CommandLine|contains:
    - ' -decode '          # Used with certutil
    - ' -NoP '          # Often used in malicious PowerShell commands
    - ' -W Hidden '          # Often used in malicious PowerShell commands
    - ' /decode '          # Used with certutil
    - ' /ticket:'          # Rubeus
    - ' sekurlsa'          # Mimikatz
    - '.dmp full'          # Process dumping method apart from procdump
    - '.downloadfile('          # PowerShell download command
    - '.downloadstring('          # PowerShell download command
    - 'FromBase64String'         # PowerShell encoded payload
    - 'process call create'         # WMIC process creation
    - 'reg save '          # save registry SAM - syskey extraction
    - 'whoami /priv'
  condition: 1 of selection_webserver_* and 1 of selection_child_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious parent-child process relationships indicative of web shell activity seeking to perform credential dumping or exfiltration. Attackers may leverage compromised web servers to execute subsequent commands for extracting sensitive information or adjusting permissions in the environment, using tools like Mimikatz or built-in Windows command utilities.

  The relevant MITRE ATT&CK tactics include **Persistence** (T1537), **Discovery** (T1018), and more specifically techniques like **Credential Dumping** (T1003.001) and **Active Directory enumeration** (T1087). Primary telemetry sources include Windows process creation logs—particularly Security Event ID 4688 and Sysmon Event ID 1—highlighting the execution of commands from web servers.

  If malicious, the impact could be significant, including data breaches, loss of credentials, or unauthorized changes to user privileges. However, this detection does NOT confirm that an attack has occurred on its own; further investigation is required to corroborate malicious intent and context.

  ### Investigation Steps

  - **Review parent-child process relationships**: Investigate Security Event ID 4688 or Sysmon Event ID 1 for process creation details, focusing on any child processes with parent processes such as `httpd.exe` or `nginx.exe`. Look for suspicious child executions linked to credential dumping or system manipulation.

  - **Validate command execution context**: Check the `CommandLine` used in the logs for key phrases such as `rundll32 comsvcs`, `net user /add`, or credential manipulation terms (e.g., `sekurlsa`, `whoami /priv`) to identify potentially malicious activity.

  - **Correlate other signs of compromise**: Inspect surrounding telemetry for signs of web shell deployment, such as outbound connections or abnormal file changes in web server directories. Review file creation times and analyze logs for unusual access patterns.

  - **Identify recent changes in user accounts**: Scrutinize Event ID 4720 (user creation) and Event ID 4728 (added to a group) to detect unauthorized account modifications that might accompany the detected behaviors.

  - **Examine legitimate operational behavior**: Validate expected behavior from the affected web application instances. For example, ensure that the processes are only executing legitimate scripts or functions, with no unexpected connections or high-frequency command executions.

  ### Prioritization

  This alert carries a high severity rating, as it may indicate an attack exploiting a compromised web server used for credential dumping and potentially undermining user accounts. The likelihood of abuse is considerable, given the established patterns and tools used in web shells and their links to prevalent attack vectors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as legitimate command execution or the use of obfuscated command-line arguments that could bypass the rule. Successful detection relies on comprehensive logging configurations, including Sysmon and Windows Event logs. Legitimate administrative tasks might trigger this alert, particularly during periods of server maintenance or updates. A related companion detection is establishing alerts for abnormal outbound network traffic that might indicate data exfiltration following suspicious process activity.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
