title: Webshell Hacking Activity Patterns
id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
status: test
description: |
  Detects certain parent child patterns found in cases in which a web shell is used to perform certain credential dumping or exfiltration activities on a compromised system
references:
- https://youtu.be/7aemGhaE9ds?t=641
author: Florian Roth (Nextron Systems)
date: 2022-03-17
modified: 2023-11-09
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
   # Webserver
  selection_webserver_image:
    ParentImage|endswith:
    - '\caddy.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\w3wp.exe'
    - '\ws_tomcatservice.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    CommandLine|contains:
    - 'catalina.jar'
    - 'CATALINA_HOME'
    # Suspicious child processes
  selection_child_1:
        # Process dumping
    CommandLine|contains|all:
    - 'rundll32'
    - 'comsvcs'
  selection_child_2:
        # Winrar exfil
    CommandLine|contains|all:
    - ' -hp'
    - ' a '
    - ' -m'
  selection_child_3:
        # User add
    CommandLine|contains|all:
    - 'net'
    - ' user '
    - ' /add'
  selection_child_4:
    CommandLine|contains|all:
    - 'net'
    - ' localgroup '
    - ' administrators '
    - '/add'
  selection_child_5:
    Image|endswith:
            # Credential stealing
    - '\ntdsutil.exe'
            # AD recon
    - '\ldifde.exe'
    - '\adfind.exe'
            # Process dumping
    - '\procdump.exe'
    - '\Nanodump.exe'
            # Destruction / ransom groups
    - '\vssadmin.exe'
    - '\fsutil.exe'
  selection_child_6:
        # SUspicious patterns
    CommandLine|contains:
    - ' -decode '          # Used with certutil
    - ' -NoP '          # Often used in malicious PowerShell commands
    - ' -W Hidden '          # Often used in malicious PowerShell commands
    - ' /decode '          # Used with certutil
    - ' /ticket:'          # Rubeus
    - ' sekurlsa'          # Mimikatz
    - '.dmp full'          # Process dumping method apart from procdump
    - '.downloadfile('          # PowerShell download command
    - '.downloadstring('          # PowerShell download command
    - 'FromBase64String'         # PowerShell encoded payload
    - 'process call create'         # WMIC process creation
    - 'reg save '          # save registry SAM - syskey extraction
    - 'whoami /priv'
  condition: 1 of selection_webserver_* and 1 of selection_child_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies sophisticated webshell activity on Windows servers, particularly focusing on parent-child process relationships that suggest malicious behavior. Webshells often serve as a foothold for attackers to execute arbitrary commands on compromised systems. In this case, the rule looks for activity associated with webservers (e.g., Caddy, Nginx) as the initial point of compromise, which is then used to drop malicious payloads or perform credential dumping and other exfiltration activities.

  The attacker may aim to escalate privileges, gather sensitive information, or maintain persistence within the environment. Given the nature of web shells, the detected patterns could point to various tactics, including credential dumping and lateral movement. The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (T1505.003)**: Web shell installation allows attackers prolonged access.
  - **Credential Access (T1003)**: Techniques like credential dumping are prior objectives of the attacker.
  - **Discovery (T1018) and (T1087)**: Attackers may also seek to gather information about user accounts and system configurations.

  Primary telemetry sources for these detections include Windows process creation events, command-line arguments from those processes, and logs that detail the execution paths of applications, which can help analysts map out the activities of the attackers.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows Event logs for process creation events involving known web server executables (e.g., Caddy, Nginx). Look for unusual child processes spawned from these parent processes.
  - **Analyze Command-Line Arguments**: Focus on command-line arguments associated with suspicious child processes that are indicative of credential dumping or user enumeration (e.g., `whoami /priv`, `net user /add`).
  - **Check for Known Bad Tools**: Identify Execution of known Windows tools associated with credential access and system information gathering (such as `procdump.exe`, `ntdsutil.exe`, and `ldifde.exe`) that may have been invoked from web server processes.
  - **Correlate with Network Logs**: Look at network traffic logs to identify any data exfiltration attempts or external command and control callbacks that may relate to the detected malicious activity.

  ### Prioritization
  This alert is classified as high severity due to the substantial threat posed by webshells, which can lead to widespread credential compromise and further exploitation in enterprise environments. The likelihood of successful exploitation using a webshell is significant, and a rapid response is critical.

  ### Blind Spots and Assumptions
  There are several potential blind spots in this detection logic. If malicious user activity is obfuscated or if tools are renamed, the detection may fail to trigger. The logic assumes that the web server's process tree will not be significantly altered by the attacker to avoid detection. Reliable logging of process creation events, including command-line execution, is essential for this alert to function effectively. Additionally, if logging is not properly configured or if important processes are running with altered command arguments, detection may be impaired.

