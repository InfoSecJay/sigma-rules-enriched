title: Potential LSASS Process Dump Via Procdump
id: 5afee48e-67dd-4e03-a783-f74259dcf998
status: stable
description: |
  Detects potential credential harvesting attempts through LSASS memory dumps using ProcDump.
  This rule identifies suspicious command-line patterns that combine memory dump flags (-ma, -mm, -mp) with LSASS-related process markers.
  LSASS (Local Security Authority Subsystem Service) contains sensitive authentication data including plaintext passwords, NTLM hashes, and Kerberos tickets in memory.
  Attackers commonly dump LSASS memory to extract credentials for lateral movement and privilege escalation.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
- https://research.splunk.com/endpoint/3742ebfe-64c2-11eb-ae93-0242ac130002
- https://x.com/wietze/status/1958302556033065292?s=12
author: Florian Roth (Nextron Systems)
date: 2018-10-30
modified: 2025-10-19
tags:
- attack.defense-evasion
- attack.t1036
- attack.credential-access
- attack.t1003.001
- car.2013-05-009
logsource:
  category: process_creation
  product: windows
detection:
  selection_flags:
    CommandLine|contains|windash:
    - ' -ma '
    - ' -mm '         # Mini dump
    - ' -mp '         # Miniplus dump
  selection_process:
    CommandLine|contains:
    - ' ls'         # Short for lsass
    - ' keyiso'
    - ' samss'
  condition: all of selection_*
falsepositives:
- Unlikely, because no one should dump an lsass process memory
- Another tool that uses command line flags similar to ProcDump
level: high
note: |
  ### Technical Context
  This detection rule identifies potential credential harvesting attempts through the use of ProcDump to dump the memory of the LSASS (Local Security Authority Subsystem Service) process. LSASS is a critical Windows process that manages authentication and stores sensitive data such as plaintext passwords, NTLM hashes, and Kerberos tickets, which are highly sought after by attackers for lateral movement and privilege escalation within networks. The rule flags specific command-line patterns that indicate an attempt to extract this sensitive information by utilizing memory dump flags (-ma, -mm, -mp) alongside process names related to LSASS.

  The likely attacker objectives in this scenario include gaining unauthorized access to user credentials to facilitate further malicious activities, like moving laterally within the network or manipulating systems with elevated privileges. This method falls under several MITRE ATT&CK tactics, specifically "Credential Access" (TA0200) and "Defense Evasion" (TA0005), with relevant techniques including "Credential Dumping: LSASS Memory" (T1003.001) and "Masquerading" (T1036).

  Primary data sources for this detection include process creation event logs that can reveal command-line arguments used when executing processes, which are critical for identifying suspicious activities related to ProcDump's invocation on LSASS.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for any instances of ProcDump being executed with the flags (-ma, -mm, -mp) in conjunction with LSASS or other relevant processes.
  - **Analyze Command-Line Arguments:** Examine the command-line strings in the process logs to identify if any unusual patterns or arguments were present, particularly those indicative of memory dumping.
  - **Correlate with User Activity:** Investigate the user account associated with the execution of the memory dump to determine if it is legitimate, has proper authorization, or if it has a history of suspicious behavior.
  - **Check for Related Activity:** Monitor for any subsequent processes spawned by the same user session that may indicate lateral movement or other malicious activities following the memory dump.

  ### Prioritization
  This alert is considered high severity due to the critical nature of LSASS in storing sensitive authentication data. The potential impact of credential theft is severe, as it can lead to significant breaches or data loss if an attacker successfully escalates privileges or moves laterally within the environment.

  ### Blind Spots and Assumptions
  The primary blind spot in this detection is the possibility of legitimate administrative tasks that may involve memory dumps for troubleshooting or forensic analysis, which could trigger false positives. Additionally, the detection logic assumes that no other legitimate tools will use similar command-line flags as ProcDump, which may impact its accuracy. For this alert to function correctly, there needs to be comprehensive logging enabled for process creation events, particularly capturing full command-line arguments, to ensure no relevant data is omitted.

