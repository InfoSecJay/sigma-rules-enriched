title: Potential LSASS Process Dump Via Procdump
id: 5afee48e-67dd-4e03-a783-f74259dcf998
status: stable
description: |
  Detects potential credential harvesting attempts through LSASS memory dumps using ProcDump.
  This rule identifies suspicious command-line patterns that combine memory dump flags (-ma, -mm, -mp) with LSASS-related process markers.
  LSASS (Local Security Authority Subsystem Service) contains sensitive authentication data including plaintext passwords, NTLM hashes, and Kerberos tickets in memory.
  Attackers commonly dump LSASS memory to extract credentials for lateral movement and privilege escalation.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
- https://research.splunk.com/endpoint/3742ebfe-64c2-11eb-ae93-0242ac130002
- https://x.com/wietze/status/1958302556033065292?s=12
author: Florian Roth (Nextron Systems)
date: 2018-10-30
modified: 2025-10-19
tags:
- attack.defense-evasion
- attack.t1036
- attack.credential-access
- attack.t1003.001
- car.2013-05-009
logsource:
  category: process_creation
  product: windows
detection:
  selection_flags:
    CommandLine|contains|windash:
    - ' -ma '
    - ' -mm '         # Mini dump
    - ' -mp '         # Miniplus dump
  selection_process:
    CommandLine|contains:
    - ' ls'         # Short for lsass
    - ' keyiso'
    - ' samss'
  condition: all of selection_*
falsepositives:
- Unlikely, because no one should dump an lsass process memory
- Another tool that uses command line flags similar to ProcDump
level: high
note: |
  ### Technical Context

  This rule detects potential credential harvesting attempts through the use of ProcDump to create memory dumps of the LSASS (Local Security Authority Subsystem Service) process. Attackers may leverage this technique to extract sensitive authentication data stored in memory, including plaintext passwords and NTLM hashes. The relevant MITRE ATT&CK tactics and techniques include Credential Access (TA0006) and Process Injection (T1003.001). Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1, to assess command-line activity. If malicious, this behavior could lead to unauthorized access to user credentials and lateral movement within the network. Importantly, this detection does NOT confirm that credentials were successfully harvested—it merely indicates an attempt to dump LSASS memory.

  ### Investigation Steps

  - **Review command-line arguments:** Check for event logs where the command line contains flags like `-ma`, `-mm`, or `-mp` along with markers for LSASS such as `ls`, `keyiso`, or `samss` (Security Event ID 4688, Sysmon Event ID 1).

  - **Search for high-risk user actions:** Examine the context in which the dump was attempted. Look for patterns of behavior that indicate potential misuse of elevated privileges, focusing on privileged accounts or admin workstations.

  - **Identify expected legitimate usage:** Determine if the command was issued by an authorized tool or admin operation. Regular analysis might show that specific applications or scripts commonly invoke similar LSASS interactions for legitimate purposes.

  - **Correlate with user activity:** Cross-reference the alert with user activity logs (e.g., Windows Event ID 4624 for logins) around the time of the suspicious command execution. Confirm if the user was within an acceptable pattern of usage or if there was an unauthorized access attempt.

  - **Monitor for follow-up actions:** Assess subsequent events after the memory dump attempt for lateral movement or access of sensitive systems. Check if there are related process creations (Event ID 4688) indicative of further credential use.

  - **Validate file creation or exfiltration:** Look for signs of file creation events related to ProcDump output. Inspect file paths or extensions that align with memory dumps, monitoring for any unauthorized file transfers or log deletion actions (Event ID 4663).

  ### Prioritization

  This alert is high severity due to the potential impact on credential security and the likelihood of malicious usage. LSASS dumps are a common technique in credential theft and lateral movement strategies, making this behavior critical to investigate promptly within an enterprise environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of other legitimate tools that employ similar command-line flags, which may evoke false positives. Ensure that logging is comprehensive for process creation events, as missing data may hinder detection effectiveness. Legitimate administrative actions such as troubleshooting or debugging processes might also trigger this alert. A companion detection to consider is monitoring for unusual authentication patterns, such as failed logins or access from atypical locations, which could signal attempts to exploit dumped credentials.

