title: Potential LSASS Process Dump Via Procdump
id: 5afee48e-67dd-4e03-a783-f74259dcf998
status: stable
description: |
  Detects potential credential harvesting attempts through LSASS memory dumps using ProcDump.
  This rule identifies suspicious command-line patterns that combine memory dump flags (-ma, -mm, -mp) with LSASS-related process markers.
  LSASS (Local Security Authority Subsystem Service) contains sensitive authentication data including plaintext passwords, NTLM hashes, and Kerberos tickets in memory.
  Attackers commonly dump LSASS memory to extract credentials for lateral movement and privilege escalation.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
- https://research.splunk.com/endpoint/3742ebfe-64c2-11eb-ae93-0242ac130002
- https://x.com/wietze/status/1958302556033065292?s=12
author: Florian Roth (Nextron Systems)
date: 2018-10-30
modified: 2025-10-19
tags:
- attack.stealth
- attack.t1036
- attack.credential-access
- attack.t1003.001
- car.2013-05-009
logsource:
  category: process_creation
  product: windows
detection:
  selection_flags:
    CommandLine|contains|windash:
    - ' -ma '
    - ' -mm '         # Mini dump
    - ' -mp '         # Miniplus dump
  selection_process:
    CommandLine|contains:
    - ' ls'         # Short for lsass
    - ' keyiso'
    - ' samss'
  condition: all of selection_*
falsepositives:
- Unlikely, because no one should dump an lsass process memory
- Another tool that uses command line flags similar to ProcDump
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_sysinternals_procdump_lsass/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of ProcDump to create memory dumps from the LSASS process, which is often targeted by attackers for credential harvesting. The likely attacker objective is to extract sensitive information such as passwords and hashes stored in LSASS memory to facilitate lateral movement within a network. This behavior corresponds to the following MITRE ATT&CK tactics and techniques: **Credential Access (T1003.001)**.

  The primary telemetry source is Windows process creation logs, specifically the Security Event ID 4688 and Sysmon Event ID 1, which capture command-line arguments of processes. The security impact is significant as successful credential extraction can lead to unauthorized access to other systems. It is crucial to note that this detection does NOT confirm that the memory was successfully dumped or that the attacker accessed the credentials; it merely identifies suspicious command-line activity related to LSASS.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for the associated user context. Look for instances where the command line includes "procdump" with flags like "-ma", "-mm", or "-mp". Benign activity is typically devoid of such suspicious command line usage.

  - **Verify process access rights:** Review the permissions of the user account that executed the ProcDump command. Standard users typically should not have permissions to dump LSASS. Consider Event ID 4672 for special privileges.

  - **Assess running processes:** List processes running during the alert timeframe using Sysmon Event ID 1. Identify unexpected instances of ProcDump and correlate them with LSASS processes. Malicious indicators include unexpected user accounts executing such processes.

  - **Contextualize user activity:** Look at the user's recent authentication logs (Event ID 4624) to establish if there are legitimate reasons for accessing LSASS, such as troubleshooting or system maintenance. Normal behavior often involves administrative tools being used with clear justifications.

  - **Review system logs for unusual activity:** Examine logs for unusual network connections or file accesses that might indicate subsequent lateral movement after LSASS dumping, especially around Event ID 5140 (file share access).

  - **Look for cleanup or obfuscation attempts:** Determine if there are any attempts to remove or hide the ProcDump executable or its logs, as deleting or tampering with logs would indicate malicious intent (e.g., Event ID 4673).

  ### Prioritization

  This alert is of high severity due to the critical nature of LSASS, which handles sensitive credentials. The likelihood of malicious abuse is elevated, as process dumping of LSASS is a commonly observed technique in credential theft and escalation. Given the serious implications of credential compromise, this behavior is frequently weaponized by threat actors.

  ### Blind Spots and Assumptions

  Detection may be evaded if the attacker uses alternative methods or tools that achieve similar outcomes without using ProcDump. Additionally, without Sysmon installed or adequate logging configurations, the rule may not produce reliable alerts. Legitimate applications, such as software debugging or system maintenance tools, may inadvertently trigger this alert. A companion detection could be monitoring for network traffic that shows unusual access patterns following a detected LSASS dump, enhancing overall coverage.

