title: Potential LSASS Process Dump Via Procdump
id: 5afee48e-67dd-4e03-a783-f74259dcf998
status: stable
description: |
  Detects potential credential harvesting attempts through LSASS memory dumps using ProcDump.
  This rule identifies suspicious command-line patterns that combine memory dump flags (-ma, -mm, -mp) with LSASS-related process markers.
  LSASS (Local Security Authority Subsystem Service) contains sensitive authentication data including plaintext passwords, NTLM hashes, and Kerberos tickets in memory.
  Attackers commonly dump LSASS memory to extract credentials for lateral movement and privilege escalation.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
- https://research.splunk.com/endpoint/3742ebfe-64c2-11eb-ae93-0242ac130002
- https://x.com/wietze/status/1958302556033065292?s=12
author: Florian Roth (Nextron Systems)
date: 2018-10-30
modified: 2025-10-19
tags:
- attack.stealth
- attack.t1036
- attack.credential-access
- attack.t1003.001
- car.2013-05-009
logsource:
  category: process_creation
  product: windows
detection:
  selection_flags:
    CommandLine|contains|windash:
    - ' -ma '
    - ' -mm '         # Mini dump
    - ' -mp '         # Miniplus dump
  selection_process:
    CommandLine|contains:
    - ' ls'         # Short for lsass
    - ' keyiso'
    - ' samss'
  condition: all of selection_*
falsepositives:
- Unlikely, because no one should dump an lsass process memory
- Another tool that uses command line flags similar to ProcDump
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential credential harvesting attempts via memory dumps of the LSASS (Local Security Authority Subsystem Service) process using ProcDump. Attackers typically aim to extract sensitive authentication data, such as plaintext passwords and NTLM hashes, for lateral movement or privilege escalation within the network. The relevant MITRE ATT&CK tactics and techniques for this behavior include Credential Access (ID: T1003.001) and Defense Evasion (ID: T1036).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details about command-line arguments used during process execution. If the detected behavior is indeed malicious, it poses a significant security risk as it can facilitate unauthorized access to systems. This detection does NOT confirm that a successful credential extraction occurred; it merely indicates the potential for such an action.

  ### Investigation Steps

  - **Identify the command-line execution context**: Review Security Event ID 4688 or Sysmon Event ID 1 for the process creation related to ProcDump. Look for command-line arguments that contain “-ma”, “-mm”, or “-mp” along with references to “lsass”, “keyiso”, or “samss”.

  - **Correlate with system behavior**: Check for expected behavior, such as legitimate administrative tasks involving memory dumps. If a session on the affected system is performing a legitimate backup or diagnostic operation with similar command-line flags, document this context.

  - **Track process lineage**: Utilize Sysmon Process Tree (Event ID 1) to analyze the parent process of the potentially malicious activity. Ensure that it corresponds to a known system process or expected administrative tool, as anomalies here may indicate compromise.

  - **Review for high-confidence malicious indicators**: Look for multiple instances of LSASS memory dump attempts occurring in a short timeframe across various systems, as this could suggest an automated attack tool being used.

  - **Assess impacted system's role**: Evaluate the criticality of the host system being flagged. Systems performing authentication or identity services (e.g., domain controllers) require elevated attention and rapid response.

  - **Validate for file creation or exfiltration artifacts**: Check for any newly created files in the system directories, especially temporary directories where ProcDump may persist the memory dumps (such as %TEMP% or %APPDATA%). Look at timestamps and file sizes to assess legitimacy.

  ### Prioritization

  This alert is high-severity due to the potential impact on systems containing sensitive authentication data. The likelihood of malicious abuse is significant, as the techniques used are commonly weaponized by threat actors during credential harvesting. Targeted analyses of systems that typically handle sensitive data is essential.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate tools or scripts using similar command-line flags, which may inadvertently trigger the alert. Ensure Windows auditing is configured to capture process creation events for reliable detection. Also, standard maintenance activities, such as diagnostic memory analysis performed by IT personnel, could generate similar command-line patterns. A companion detection that would strengthen coverage includes monitoring for abnormal outbound connections from the affected system that could indicate subsequent unauthorized access attempts.

