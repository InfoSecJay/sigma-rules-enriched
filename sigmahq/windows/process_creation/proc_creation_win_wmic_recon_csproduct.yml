note: |
  ### Technical Context

  This Sigma rule detects the execution of WMIC (Windows Management Instrumentation Command-line) with the argument "csproduct," which retrieves detailed hardware-related information, such as the make and model of a system's hardware. The likely attacker objective is reconnaissance to gather system and environment information for further exploitation or persistence tactics. This behavior maps to the MITRE ATT&CK tactic “Execution” and the technique “Command and Scripting Interpreter” (T1047).

  The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, which provide details about command-line executions and associated process information. If this behavior is malicious, it could lead to unauthorized system profiling or an elevated risk of further attacks based on the identified hardware. It is important to note that while this detection indicates the use of WMIC for reconnaissance, it does NOT confirm malicious intent on its own, as legitimate administrative tasks can also utilize this command.

  ### Investigation Steps

  - **Check the process creation log:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for entries containing 'wmic.exe' in the `Image` field and 'csproduct' in the `CommandLine` field. Look for an anomalous parent process; legitimate usage usually originates from trusted administrative tools or scripts.

  - **Analyze the context of execution:** Confirm the user context in which WMIC was executed (Event ID 4688 -> `SubjectUserName`, `SubjectDomainName`). If initiated by a non-administrative account, this raises suspicion. Legitimate administrative accounts will often execute this under controlled circumstances.

  - **Correlate associated actions:** Check for other events from the same timeframe (Event ID 4688) that might indicate further suspicious activity, such as rapid pivots to access other resources. Look for elevated privilege escalation attempts shortly after the reconnaissance action.

  - **Identify benign usage patterns:** Document scenarios where legitimate applications or administrators would invoke WMIC with the "csproduct" parameter for hardware information during system audits. These might include IT asset management tools or inventory checks.

  - **Review for indicators of compromise:** Look for other known malicious indicators being leveraged in proximity to WMIC executions, such as unusual network connections, unexpected command-line arguments, or usage of general reconnaissance tools alongside WMIC activities.

  ### Prioritization

  This alert is assessed as medium severity due to its potential for information gathering that could facilitate further attacks, especially if conducted on critical infrastructure or sensitive systems. While its likelihood of abuse is significant among adversaries performing initial reconnaissance, benign use is common among system administrators.

  ### Blind Spots and Assumptions

  This detection may not capture instances where attackers employ techniques to disguise the usage or name of WMIC (e.g., by using cmd.exe or PowerShell as a wrapper). Reliable detection depends on proper logging of process creation events on Windows devices to capture all relevant command-line arguments. Legitimate software inventory tools may trigger this alert frequently, and monitoring related utilities, such as PowerShell commands for hardware checks (e.g., `Get-WmiObject`), can enhance overall detection capabilities.

