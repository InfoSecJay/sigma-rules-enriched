note: |
  ### Technical Context
  This detection rule identifies the use of Plink.exe, a command-line interface to facilitate SSH connections, as a method for creating RDP tunnels. Attackers may leverage Plink to establish indirect access to Remote Desktop Protocol (RDP) services, often for the purposes of data exfiltration or maintaining persistent access to a compromised system. The primary objectives of such actions may include bypassing network security controls and establishing covert communication channels.

  The relevant MITRE ATT&CK tactics for this behavior include **Command and Control** (TA0011) and specifically **Application Layer Protocol** (T1572), where attackers utilize legitimate tools for tunneling and data exfiltration. The primary data sources for detection will be **process creation logs**, which capture the execution of processes, alongside their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for instances of `plink.exe` execution. Focus on the `CommandLine` arguments to identify potential tunneling attempts to RDP services.

  - **Analyze Network Traffic:** Monitor outgoing connections for unusual behavior associated with RDP protocols. Validate if there are unexpected connections to localhost (e.g., `127.0.0.1:3389`).

  - **Identify Related Activity:** Cross-reference any identified Plink usage with other telemetry sources, such as firewall logs, to uncover additional patterns indicating SSH tunneling or RDP exploitation.

  - **Examine User Activity:** Investigate the user context under which the Plink.exe executed. Determine if this usage aligns with normal operational activity or if it indicates anomalous behavior suggesting possible compromise.

  ### Prioritization
  Given the high severity of this alert, immediate attention is warranted due to the potential risk of unauthorized access to critical systems via RDP, which could lead to significant data breaches or system compromises.

  ### Blind Spots and Assumptions
  This detection rule may miss instances of Plink being executed with altered command-line arguments that do not conform to the defined selection criteria, as well as potential usage of other tunneling tools. It assumes that adequate logging is enabled across all relevant systems to capture `process creation` events, and that security monitoring can correlate the presence of Plink with anomalous network traffic patterns effectively.

