note: |
  ### Technical Context

  This Sigma rule detects attempts to change the PowerShell execution policy via modifications made to the respective registry key. Attackers may seek to bypass standard script execution restrictions, such as requiring signed scripts, to execute malicious code. This behavior aligns with the MITRE ATT&CK framework tactic of Defense Evasion (T1562) and the specific technique of Modification of Registry (T1112). The primary telemetry source for this detection is process creation logs, specifically identifying registry modification events related to PowerShell execution policies. If malicious, the impact can be significant, as it could facilitate the execution of untrusted scripts, leading to further compromise of the system. It is important to note that this detection does not confirm malicious intent by itself; legitimate administrative actions could also result in similar alerts.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 logs that show command line activity related to changing the execution policy (e.g., including `\ShellIds\Microsoft.PowerShell\ExecutionPolicy`).

  - **Identify Domain Administrator Activity:** Cross-reference the command execution with user accounts. Legitimate changes often occur under administrative accounts during scheduled maintenance. If the user does not normally perform such tasks, this may indicate malicious activity.

  - **Assess Command Line Parameters:** Look for command lines containing `Bypass`, `RemoteSigned`, or `Unrestricted`. These parameters indicate an attempt to lower security measures in PowerShell scripting.

  - **Correlate with Other Security Events:** Investigate related alerts from companion detections that capture PowerShell command execution or script block logging (e.g., see related Sigma rules like PowerShell ScriptBlock and Cmdlet executions). This can provide context to the execution policy changes.

  - **Examine for Additional Indicators of Compromise (IoCs):** Check for associated artifacts indicating post-execution activities, such as the creation of unusual files or outbound connections shortly after the execution policy change. Validate file creation or modifications in commonly used directory paths.

  - **Identify Unregistered or Uncommon Tools:** Look for execution of unauthorized binaries or scripts directly following the policy change which can suggest exploitation is taking place.

  ### Prioritization

  This alert has a high severity level due to the potential to allow untrusted code execution on critical systems. The risk is escalated on systems hosting sensitive data or critical infrastructure. The method of bypassing execution policies is commonly weaponized in various attack scenarios, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by lack of visibility into all user actions, leading to missed legitimate uses of execution policy changes by trusted users or admins. Enabling detailed PowerShell logging (e.g., Transcription or Module logging) is vital for thorough tracking of actions that may trigger this alert. Common legitimate activities include updates to execution policies by IT staff during routine maintenance or security assessments. Companion detection rules that monitor for PowerShell script execution or unusual internal network activity can provide additional context and enhance coverage.

