note: |
  ### Technical Context

  This rule detects modifications to the PowerShell execution policy registry keys, which are often aimed at bypassing security controls around script execution on Windows systems. Attackers aim to execute malicious scripts without being blocked by default security settings, facilitating further exploitation. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (T1562) and the technique "Modify Registry" (T1112).

  The primary telemetry source is the Windows Process Creation logs, specifically focusing on changes to specific registry paths related to PowerShell execution policies. If an alert is confirmed as malicious, it could lead to unauthorized code execution, data exfiltration, or deeper intrusions into the network. Importantly, this detection does not confirm that malicious execution has occurred; it only flags potential circumvention of security policies.

  ### Investigation Steps

  - **Review Process Creation Events**: Check Event ID 4688 for new processes associated with PowerShell, specifically those that contain command lines with `ExecutionPolicy` alongside values such as `Bypass`, `RemoteSigned`, or `Unrestricted`.

  - **Inspect Registry Modifications**: Utilize `Sysinternals RegMon` or similar tools to validate changes made to the registry paths: `HKLM\Software\Microsoft\PowerShell\3\PowerShellEngine\ExecutionPolicy` or `HKCU\Software\Microsoft\PowerShell\3\PowerShellEngine\ExecutionPolicy`. Look for unexpected changes outside of normal administrative maintenance.

  - **Correlate with Active User Accounts**: Identify the user accounts making these changes using Event ID 4663 (File/Registry Access). Benign changes are typically made by known administrative accounts, while unexpected modifications can indicate potential compromise.

  - **Validate Legitimate PowerShell Scripts**: Cross-check the command line with a known list of authorized scripts or processes. Legitimate activities might include scheduled tasks or management scripts run by admins, while deviations could signify nefarious intent.

  - **Check for Subsequent Execution**: Look for any PowerShell processes (Event 4688) that are executed following the registry changes and analyze their command lines for indicators of malicious activity, particularly those that appear obfuscated or invoke remote resources.

  ### Prioritization

  This alert should be treated with high severity due to the potential for a serious compromise on critical systems. The likelihood of malicious abuse is moderate to high, as tampering with execution policies is a well-documented technique used by attackers to enable script-based attacks. This behavior is commonly weaponized in sophisticated intrusions.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited if logs are not properly collected or if administrative activities are mistaken for malicious ones. Environments without strict change management might inadvertently trigger this rule due to legitimate administrative actions. Monitoring related detections, such as the one for **ProcCreation Cmdlet** (ID: 87e3c4e8-a6a8-4ad9-bb4f-46e7ff99a180), may strengthen coverage by providing context on PowerShell commands used in conjunction with policy changes.

