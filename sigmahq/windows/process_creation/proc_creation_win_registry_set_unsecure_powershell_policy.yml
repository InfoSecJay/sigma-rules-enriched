note: |
  ### Technical Context
  This detection rule monitors for changes to the PowerShell execution policy in the Windows registry, specifically targeting the registry keys that dictate how scripts can be executed. Attackers often adjust these policies to bypass security controls and execute malicious scripts without restrictions. By modifying the execution policy to settings like "Bypass" or "Unrestricted," they can run harmful scripts, leading to potential data compromise, lateral movement, or installation of persistent threats.

  The behavior of tampering with execution policies aligns with the MITRE ATT&CK framework under the tactic of **Defense Evasion**. Relevant techniques include **T1562.001: Impair Defenses**. The detection operates primarily on process creation events, particularly examining the command line for any calls that reference changes to the execution policy. Observing these events can help identify malicious activity before it escalates into a more significant security incident.

  Primary data sources for this detection include:
  - Windows process creation logs to capture executed commands and their parameters.
  - Registry change logs to monitor modifications to execution policy keys.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation events for any commands that include the execution policy registry path or the specific keywords "Bypass," "RemoteSigned," or "Unrestricted". Pay attention to the context of execution (user accounts, parent processes) for anomalies.

  - **Analyze Command History**: Retrieve and examine PowerShell command history for any recent commands executed by users, especially those related to changing PowerShell policies. This can provide context on whether the changes were authorized or part of a malicious activity.

  - **Inspect Registry Changes**: Use registry monitoring tools to locate and analyze recent changes to the PowerShell execution policy keys. Confirm whether these changes were legitimate and determine the users or processes responsible for them.

  - **Identify Unusual Account Activity**: Check for any unusual or unauthorized account activities around the time of the policy change, such as logins from outside normal hours or atypical access patterns.

  ### Prioritization
  This alert’s severity is high due to the significant potential impact of a successful bypass of PowerShell execution policy, which enables attackers to execute arbitrary code on systems, often leading to further exploitation or data breaches.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are not adequately collected or if registry monitoring is not in place. The detection logic assumes that any modification to the execution policy is malicious, which may not account for legitimate administrative actions. Ensuring proper logging of both process creation and registry changes is critical for this alert to function effectively. Additionally, reliance on context from command line execution may miss changes made directly through other means outside of command line execution.

