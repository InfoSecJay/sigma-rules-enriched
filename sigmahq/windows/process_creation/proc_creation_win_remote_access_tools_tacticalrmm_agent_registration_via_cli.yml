detection:
  selection:
    Image|contains: '\TacticalAgent\tacticalrmm.exe'
    CommandLine|contains|all:
    - '--api'
    - '--auth'
    - '--client-id'
    - '--site-id'
    - '--agent-type'
  condition: selection
falsepositives:
- Legitimate system administrator deploying TacticalRMM
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the installation of the TacticalRMM agent where specific command-line arguments are present. This behavior suggests that an attacker might be silently registering the agent to an unauthorized or malicious Remote Monitoring and Management (RMM) server. The likely attacker objective is to gain persistent, unauthorized remote access to the targeted system.

  The relevant MITRE ATT&CK techniques are Command and Control (T1219) and Remote Services (T1105). Primary telemetry sources include process creation logs from Windows, specifically focusing on Security Event ID 4688 or Sysmon Event ID 1 to capture process execution context. If malicious, this activity can facilitate extensive control over the affected system, leading to potential data exfiltration or lateral movement. This detection does NOT confirm a successful compromise solely based on the command-line arguments; it requires context regarding the system and user environment.

  ---

  ### Investigation Steps

  - **Examine command-line arguments:** Review the command-line parameters of TacticalRMM agent execution (Security Event ID 4688 and Sysmon Event ID 1). Look specifically for `--api`, `--auth`, `--client-id`, and `--site-id`. Malicious indicators include the presence of these flags combined with an unknown or suspicious RMM server.

  - **Identify user context:** Investigate the user account that initiated the TacticalRMM installation (Security Event ID 4688). Confirm if the user is part of the IT or administrative teams. Legitimate installations should originate from trusted accounts with a history of RMM usage.

  - **Correlate installation timestamps:** Check for concurrent or recent suspicious activities logged around the agent installation (e.g., unusual logins or changes to system configurations). Unscheduled installations, especially outside business hours, may indicate malicious intent.

  - **Validate network connections:** Analyze network traffic logs associated with TacticalRMM communications to verify the destination of the connections. Identify if the RMM server is part of your environment or a known malicious IP address (e.g., using firewall or proxy logs).

  - **Check for existing TacticalRMM agents:** Use PSExec or a similar tool to verify whether multiple TacticalRMM agents have been registered on the same or related systems unexpectedly, which could indicate a broader compromise.

  ---

  ### Prioritization

  This alert is of **medium** severity, as it signifies the potential for an attacker to establish remote control over a system, which is a critical risk, especially in environments with sensitive data. However, the likelihood of this being exploited is moderate to high, given the rising trend of weaponizing RMM tools in attacks.

  ---

  ### Blind Spots and Assumptions

  The detection may miss scenarios where command-line arguments are obfuscated or altered to avoid detection. Additionally, if logging is misconfigured or if appropriate telemetry sources are not enabled, the detection may fail. Legitimate activities, such as authorized system administrators deploying TacticalRMM for legitimate reasons, can trigger this alert. A related detection could involve monitoring for unusual outbound connections to known RMM server domains, strengthening overall coverage against unauthorized access attempts.

