title: Remote Access Tool - TacticalRMM Agent Registration to Potentially Attacker-Controlled
  Server
id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
status: experimental
description: |
  Detects TacticalRMM agent installations where the --api, --auth, and related flags are used on the command line.
  These parameters configure the agent to connect to a specific RMM server with authentication, client ID, and site ID.
  This technique could indicate a threat actor attempting to register the agent with an attacker-controlled RMM infrastructure silently.
references:
- https://github.com/amidaware/tacticalrmm
- https://apophis133.medium.com/powershell-script-tactical-rmm-installation-45afb639eff3
author: Ahmed Nosir (@egycondor)
date: 2025-05-29
tags:
- attack.command-and-control
- attack.t1219
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains: '\TacticalAgent\tacticalrmm.exe'
    CommandLine|contains|all:
    - '--api'
    - '--auth'
    - '--client-id'
    - '--site-id'
    - '--agent-type'
  condition: selection
falsepositives:
- Legitimate system administrator deploying TacticalRMM
level: medium
note: |
  ### Technical Context
  This detection rule monitors for the installation and registration of the TacticalRMM (Remote Monitoring and Management) agent on Windows systems when specific command-line parameters are used. The presence of flags such as `--api`, `--auth`, `--client-id`, and `--site-id` suggests that the agent is being configured to connect to a potentially attacker-controlled RMM server. Attackers might exploit this tool to maintain persistent access to compromised environments or to manage a fleet of compromised devices remotely.

  The threat scenario here involves an attacker using TacticalRMM to bypass traditional defenses and manage infected systems without raising alarms. The likely attacker objectives include establishing a clandestine control channel for exploitation or further lateral movement within the target network. This behavior aligns with MITRE ATT&CK tactics such as **Command and Control (T1071)** and techniques like **Application Layer Protocol (T1071.001)**.

  Primary data sources for evidence include process creation events sourced from Windows operating systems. Monitoring for specific command-line flags will be crucial in identifying potentially malicious use of the TacticalRMM agent.

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate logs for the execution of `tacticalrmm.exe` alongside the specified command-line arguments. Check the associated process ID for parent processes to determine if it was executed in a suspicious context.
  - **Analyze System Admin Activity**: Confirm whether the deployment of TacticalRMM is legitimate by correlating with known system administrator accounts or recent changes to the IT environment.
  - **Examine Network Connections**: Look at outbound network traffic to identify connections from the TacticalRMM agent to any unusual or unrecognized servers that may indicate an external command-and-control presence.
  - **Conduct a Full Threat Assessment**: Evaluate the role of any newly discovered or altered RMM installations against existing asset management records to identify unauthorized changes or installations.

  ### Prioritization
  This alert is deemed medium severity due to the potential for remote control and management of compromised endpoints. The likelihood of misuse is increased in environments where remote access tools are prevalent yet may also be valid for ongoing legitimate administrative activities.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging or monitoring of command-line arguments is not enabled on all Windows endpoints. The detection logic assumes that the installation of TacticalRMM is anomalous when using specific flags, which might not capture all potential uses. Additionally, environments that actively utilize TacticalRMM without strict controls may experience higher false positives, necessitating further contextual understanding to validate alerts.

