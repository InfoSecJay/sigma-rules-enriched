title: Remote Access Tool - TacticalRMM Agent Registration to Potentially 
  Attacker-Controlled Server
id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
status: experimental
description: |
  Detects TacticalRMM agent installations where the --api, --auth, and related flags are used on the command line.
  These parameters configure the agent to connect to a specific RMM server with authentication, client ID, and site ID.
  This technique could indicate a threat actor attempting to register the agent with an attacker-controlled RMM infrastructure silently.
references:
- https://github.com/amidaware/tacticalrmm
- https://apophis133.medium.com/powershell-script-tactical-rmm-installation-45afb639eff3
author: Ahmed Nosir (@egycondor)
date: 2025-05-29
tags:
- attack.command-and-control
- attack.t1219
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains: '\TacticalAgent\tacticalrmm.exe'
    CommandLine|contains|all:
    - '--api'
    - '--auth'
    - '--client-id'
    - '--site-id'
    - '--agent-type'
  condition: selection
falsepositives:
- Legitimate system administrator deploying TacticalRMM
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the installation of the TacticalRMM agent on Windows systems, specifically when the command line arguments indicate an attempt to connect to a potentially attacker-controlled RMM server. The attacker’s objective could be to establish a foothold for remote management or malware deployment by registering the agent without legitimate authorization. This behavior fits within the MITRE ATT&CK framework under the Command and Control tactic (TA0011) and the technique of Application Layer Protocol, specifically tool-based command and control (T1219).

  Primary telemetry sources include Windows process creation logs, particularly Security Event ID 4688 (process creation) or Sysmon Event ID 1 (process creation with command line). If malicious, this installation can lead to unauthorized access and control over targeted systems. Importantly, this detection does not confirm malicious intent on its own, as legitimate system administrators may also deploy TacticalRMM agents with similar command-line parameters.

  ---

  ### Investigation Steps

  - **Review process creation events:** Examine Event ID 4688 or Sysmon Event ID 1 for process creation entries involving 'tacticalrmm.exe'. Confirm that the command line includes the specified flags (`--api`, `--auth`, `--client-id`, and `--site-id`), which are strongly indicative of an unauthorized installation.

  - **Check for context in the Source IP:** Verify the IP address and hostname of the server the TacticalRMM agent is attempting to connect to. Compare against internal documentation to identify whether it aligns with known legitimate RMM servers. Potential malicious activity may indicate external or unrecognized IP addresses.

  - **Assess legitimate installations:** Identify and document instances of TacticalRMM deployment within your environment that conform to expected parameters (timing, IP ranges). Ensure these match expected system administrator activities.

  - **Look for other signs of compromise:** Cross-check for any related signs such as unusual account logins in Security Event ID 4624, especially for accounts typically used by administrators. Specifically, focus on successful logins from unusual geographic locations or at strange hours.

  - **Evaluate network traffic:** Analyze network logs for outbound traffic to the RMM server. Unusually high connection attempts, unexpected port usage, or anomalous traffic patterns may indicate a compromise. Use tools like Wireshark or firewall logs to assess this activity.

  - **Identify additional artifacts:** Check for additional artifacts associated with the installation, such as registry entries or system service changes that may have occurred around the same time as the TacticalRMM agent installation.

  ---

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on affected systems, particularly if the agent is successfully registered with a malicious server. The likelihood of exploitation is moderate, given that Remote Management Tools are commonly weaponized for unauthorized access.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging for process creation or network connections is not adequately configured. Attackers could use various evasion techniques such as altering command-line parameters to bypass detection. Legitimate deployments by system administrators may inadvertently trigger this alert, especially during routine management tasks. A related detection that enhances coverage is monitoring for PowerShell commands associated with the download and execution of TacticalRMM installers, which may indicate a preparatory step in the attack chain.

