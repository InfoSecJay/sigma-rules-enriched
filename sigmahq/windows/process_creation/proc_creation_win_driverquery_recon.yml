note: |
  ### Technical Context

  This Sigma rule detects the execution of the `driverquery.exe` utility, which is often used by attackers for reconnaissance to gather information about installed drivers on a Windows system. The likely attacker objective is to identify vulnerable drivers that can be exploited for privilege escalation or further persistence. This behavior falls under the MITRE ATT&CK framework, specifically within the Discovery tactic (T1082) and the technique of System Information Discovery (T1003).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 for process creation, or Sysmon Event ID 1 if Sysmon is deployed. If this behavior is malicious, it can lead to system compromise, data breaches, or further exploitation of the target system. This detection does not confirm malicious intent on its own, as legitimate administrative scripts or tools may use the same command without malicious intent.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check for Security Event ID 4688 or Sysmon Event ID 1, confirming `driverquery.exe` was executed, and note the parent process (e.g., `cscript.exe`, `mshta.exe`). Analyze the command line parameters for anything suspicious.

  - **Identify Parent Process Context**: Examine the parent process of `driverquery.exe` to determine if it is a known scripting host such as `wscript.exe` or `cscript.exe`. Legitimate automated scripts might trigger this behavior, typically executing in a user-context environment.

  - **Check for Suspicious File Locations**: Validate that `driverquery.exe` is run from sensitive directories like `\AppData\Local\`, `\Users\Public\`, or `\Windows\Temp\`. Runs from these locations may indicate malicious behavior, especially if combined with unusual parent processes.

  - **Correlate with Other Reconnaissance Activities**: Investigate any additional recon tools or commands executed around the same time. This includes checking other process execution logs or CMD/PowerShell usage to see if catalogued recon activities are part of a larger incident.

  - **Assess Asset Criticality**: Consider the criticality of the affected host. If the incident occurs on a sensitive or high-privilege server, prioritize this alert for immediate investigation, as compromises could impact broader enterprise security.

  - **Review for Known Malicious Indicators**: Cross-reference the execution with threat intelligence feeds for known campaigns or indicators of compromise related to the Ursnif malware family, as it has been documented to use `driverquery.exe` for malicious reconnaissance.

  ### Prioritization

  The alert carries a high severity due to the potential impact of discovering vulnerabilities in installed drivers that may allow elevation of privileges or further exploits. Given that reconnaissance activities are typically preliminary steps before a more severe incident, the likelihood of malicious abuse is considered significant. This behavior has been weaponized in known malware campaigns, increasing its threat profile.

  ### Blind Spots and Assumptions

  Detection may be limited if process monitoring tools are misconfigured or if logging is incomplete. Legitimate administrative scripts may also trigger this alert, requiring contextual analysis to differentiate benign uses from malicious intent. Companion detections such as monitoring for unusual file modifications or command execution timelines (e.g., PowerShell activity) can enhance overall situational awareness and threat detection.

