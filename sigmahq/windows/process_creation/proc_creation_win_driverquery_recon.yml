note: |
  ### Technical Context
  This rule detects potential reconnaissance activity that utilizes the `driverquery.exe` utility to gather information about installed drivers on a Windows system. Attackers often leverage this tool to enumerate drivers in an effort to identify vulnerabilities or misconfigurations that can be exploited for privilege escalation or lateral movement. The usage of `driverquery.exe` in an unusual context, especially when called by suspicious parent processes, may indicate a malicious actor probing for system weaknesses.

  The primary objectives of an attacker employing this behavior are likely to gain deeper insights into the target environment and establish footholds for further exploitation. This technique falls under the MITRE ATT&CK framework, specifically within the 'Discovery' tactic, using techniques such as 'System Information Discovery' (T1082) and possibly 'Permission Groups Discovery' (T1069) depending on the broader reconnaissance context.

  Data sources that will provide the best evidence include process creation events within Windows, particularly those logged through an EDR solution. These logs will reveal what processes were initiated, the parent processes, command-line arguments used, and any relevant timestamps.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent `process_creation` logs for instances of `driverquery.exe` being executed, focusing on timestamps that align with the alert generation.
  - **Analyze Parent Process Relationships:** Investigate child-parent process relationships. Look for instances where `driverquery.exe` was spawned by potentially suspicious processes like `cscript.exe` or `mshta.exe` as indicated in the detection logic.
  - **Correlate with Other Logs:** Cross-reference findings with additional telemetry such as Windows Event Logs or EDR insights that could provide context on user activity and other system interactions leading up to the execution of `driverquery.exe`.
  - **Identify Targeted User Accounts:** Determine which user accounts executed `driverquery.exe` and check for any related accounts that have exhibited anomalous behavior or possess elevated privileges.

  ### Prioritization
  The alert is classified as high severity due to the potential insights an attacker can gain from executing reconnaissance commands like `driverquery.exe`, which could facilitate further exploitation of the network and systems.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage, particularly around legitimate script usage of `driverquery.exe`, which may generate false positives if not correlated with additional context. The detection logic assumes that `driverquery.exe` will predominantly be executed within suspicious contexts, which may not account for all legitimate administrative activities. Required for effective alerting is a well-configured EDR to capture detailed process creation events and comprehensive logging of all system processes.

