  ---

  ### Technical Context

  This rule detects the execution of the Windows utility `driverquery.exe`, which is often used by adversaries to enumerate installed drivers on a system. The likely attacker objective is to gather reconnaissance information that could aid in crafting further attacks or evading detection, especially by identifying driver versions that may have known vulnerabilities. This behavior aligns with the MITRE ATT&CK tactic of Discovery (TA0007) under the technique ID T1012 (Query Registry).

  The primary telemetry source is Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1 related to process creation events. If malicious, this behavior could facilitate privilege escalation or lateral movement by identifying vulnerable drivers. Importantly, this detection does NOT confirm that the activity is malicious on its own; legitimate scripts may invoke `driverquery.exe` for valid administrative tasks.

  ---

  ### Investigation Steps

  - **Check process execution details:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `driverquery.exe`. Look for parent processes like `cscript.exe` and `mshta.exe`, which are commonly associated with malicious scripts.

  - **Analyze process creation patterns:** Observe the execution location of `driverquery.exe`. Legitimate executions typically stem from expected paths such as `C:\Windows\System32`. Abnormal paths (e.g., from `C:\Users\Public\` or `C:\Windows\Temp\`) may indicate potentially malicious activity.

  - **Identify associated parent processes:** Look at Event ID 4688 for parent-child relationships. Malicious execution often involves atypical parent processes, such as `wscript.exe` or `regsvr32.exe`, which can indicate script-based attacks.

  - **Review timing and frequency of execution:** Assess how frequently `driverquery.exe` was called and if there were multiple instances in a short time frame. Rapid successive executions may indicate automated reconnaissance and should be treated as suspicious.

  - **Correlate with other security events:** Cross-reference the execution with relevant telemetry from EDR solutions or Windows Event logs to identify anomalous behavior, such as attempts to modify registry keys that pertain to installed drivers (e.g., Event ID 4657).

  ---

  ### Prioritization

  This alert should be treated with high priority due to the impact on system integrity if exploited. The likelihood of an adversary using this technique to gather system information is significant, especially in environments with a history of targeted attacks. This behavior is often a precursor to other malicious activities, making it critical to investigate promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may not capture all instances of malicious activity, as skilled adversaries might use tools to obfuscate the execution of `driverquery.exe`. Continuous monitoring is necessary, and telemetry from PowerShell or other scripting languages might also be needed for comprehensive coverage. Legitimate administrative tasks, such as software inventory scripts, can trigger this alert, leading to potential false positives. A related detection could include monitoring for unusual scripts that execute `driverquery.exe` or other process creation patterns that leverage typical administrative tools for malicious purposes.

