title: LSA PPL Protection Disabled Via Reg.EXE
id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
status: test
description: Detects the usage of the "reg.exe" utility to disable PPL protection
  on the LSA process
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
author: Florian Roth (Nextron Systems)
date: 2022-03-22
modified: 2023-03-26
tags:
- attack.defense-evasion
- attack.t1562.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_cli:
    CommandLine|contains: 'SYSTEM\CurrentControlSet\Control\Lsa'
    CommandLine|contains|all:
    - ' add '
    - ' /d 0'
    - ' /v RunAsPPL '
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the Windows utility `reg.exe` to disable the Protected Process Light (PPL) feature on the Local Security Authority (LSA) process. Disabling PPL protection can make the LSA process vulnerable to attacks aimed at extracting sensitive information, such as credentials. Attackers may utilize this technique to facilitate further exploitation within a compromised environment. The likely objective of an attacker executing this action is to elevate privileges, maintain persistence, or extract sensitive data, thus increasing their control over the system.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Defense Evasion** (TA0005) and **Disable or Modify Tools** (T1562.010), as the action of modifying system settings is often employed to evade detection and potentially undermine system integrity. Furthermore, this detection requires robust telemetry from Windows process creation events, particularly those related to command-line activities and system registry modifications that provide insights into system changes.

  Primary data sources that will yield the best evidence for this detection include:
  - Process creation logs, which record the execution of commands and can provide context on the process initiated by `reg.exe`.
  - Windows Event logs focused on registry changes or modifications, particularly those affecting system security settings.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze logs that document the execution of `reg.exe`. Look for any command line arguments that indicate manipulation of LSA settings. Note the time, user, and originating system context of the events.

  - **Inspect Command Line Activity:** Focus particularly on command lines that contain the parameters `/d 0` and `/v RunAsPPL`. Determine if these configurations were made during suspicious or unexpected times or contexts.

  - **Analyze Windows Security and System Logs:** Cross-reference changes made by `reg.exe` with security event logs to determine whether unauthorized users or systems initiated such changes, and look for any other associated suspicious activities.

  - **Correlate with Other Security Alerts:** Check for other indicators of compromise or sensitive event alerts leading up to or following the registry change to understand the context and potential operational impact of the detected behavior.

  ### Prioritization
  This alert carries a high severity due to its potential to allow attackers to bypass critical security protections, enhancing their ability to conduct further malicious activities within the enterprise environment. The likelihood of this being part of a more extensive compromise mechanism increases the urgency for investigation.

  ### Blind Spots and Assumptions
  This detection logic assumes that the `reg.exe` utility will consistently be used in the same manner for disabling protections, and may not account for other methods of disabling PPL or similar processes. If logs related to process creation or registry changes are not enabled or are improperly configured, detection may fail. There's also a gap if advanced users or legitimate administrative actions inadvertently trigger the alert without malicious intent, which can lead to false positives in the analysis.

