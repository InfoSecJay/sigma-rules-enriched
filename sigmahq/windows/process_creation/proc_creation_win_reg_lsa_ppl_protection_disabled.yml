logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_cli:
    CommandLine|contains: 'SYSTEM\CurrentControlSet\Control\Lsa'
    CommandLine|contains|all:
    - ' add '
    - ' /d 0'
    - ' /v RunAsPPL '
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the use of the "reg.exe" utility to disable Protected Process Light (PPL) protection on the Local Security Authority (LSA) process. By modifying the RunAsPPL registry setting to 0, an adversary aims to weaken system defenses and facilitate credential theft or elevated privilege escalation. This behavior aligns with the MITRE ATT&CK technique T1562.010 (Disable or Modify Tools), which falls under the Defense Evasion tactic. The primary telemetry source involves process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, showcasing command-line arguments used in the modification. If successful, this action could significantly compromise system integrity by exposing sensitive credentials. However, this detection alone does not confirm an active compromise without further context and corroborating indicators.

  ### Investigation Steps

  - **Check process creation logs**: Investigate Security Event ID 4688 and Sysmon Event ID 1 for any instances of "reg.exe" with command-line parameters containing 'SYSTEM\CurrentControlSet\Control\Lsa', 'add', '/d 0', and '/v RunAsPPL'.

  - **Correlate with user activities**: Analyze the context of the command execution, checking for any prior legitimate activities from the same user account or system, such as administrative tasks that involve registry modifications.

  - **Identify suspicious parent processes**: Examine the process tree for the instance of "reg.exe" to determine if it was spawned from a legitimate application (e.g., cmd.exe) or a suspicious process that may indicate malicious intent (e.g., PowerShell).

  - **Monitor for repeated modifications**: Ensure that this registry modification hasn't been part of a script or routine toolset deployment. Legitimate services usually do not modify PPL settings routinely unless in specific administrative contexts.

  - **Look for indicators of credential manipulation**: Concurrently examine for other signs of credential theft or privilege escalation, such as processes accessing LSASS memory (Event IDs 10 or 13 from Sysmon), which may corroborate malicious intent.

  ### Prioritization

  This alert is high-severity due to its potential impact on the entire system's security posture, specifically targeting high-value assets handling sensitive credentials. The likelihood of malicious abuse is considerable, as disabling PPL can facilitate credential theft and lateral movement, tactics frequently employed by advanced adversaries.

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited if logging for process creation is not enabled or if PowerShell is used to carry out malicious actions, which may not generate direct alerts for registry changes. Legitimate administrative processes, particularly during system maintenance, may inadvertently trigger this alert. A related detection to consider is monitoring for unauthorized access attempts to LSA or alterations to LSASS memory to complement coverage against credential extraction techniques.

