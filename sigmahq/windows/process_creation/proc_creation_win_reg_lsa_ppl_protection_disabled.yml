  ---

  ### Technical Context

  This rule detects the execution of `reg.exe` to disable Protected Process Light (PPL) protection on the Local Security Authority (LSA) process. Disabling PPL is often a precursor to credential theft or lateral movement, as it allows for easier access to sensitive system processes. The relevant MITRE ATT&CK technique is Defense Evasion (T1562.010). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing command-line arguments. If associated with malicious activity, it can lead to significant compromise of sensitive information and user credentials. This detection does NOT confirm that the system has been compromised; it only indicates that an attempt to disable a security feature has been made.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 or Sysmon Event ID 1. Filter for processes where `Image` ends with `\reg.exe` and examine `CommandLine` for expected arguments containing ‘add’, ‘/d 0’, and ‘/v RunAsPPL'.

  - **Verify against known legitimate usage:** Confirm if the action aligns with approved administrative tasks; legitimate admins may occasionally modify settings in the LSA using `reg.exe`, but should not typically disable PPL.

  - **Identify anomalous command usage:** Look for command-line arguments related to disabling security settings, focusing on anomalies in user context. Malicious attempts often involve execution under a non-standard user context or during unusual hours.

  - **Correlate with user activity:** Review recent user logins and associated activities. Investigate if this execution corresponds to a legitimate user's behavior or if it seems out of context.

  - **Check for further indicators of compromise (IOC):** Look for additional unscheduled tasks or processes (e.g., abnormal DLL injections) that frequently accompany disabling LSA PPL as part of the attack lifecycle.

  - **Audit system integrity:** If PPL has been disabled, conduct a system state assessment for unauthorized changes, including new services or modified permissions that could indicate further exploitation.

  ---

  ### Prioritization

  This alert carries high severity due to its potential impact on the integrity of the system's security model, specifically the LSA, which contains sensitive credential information. The likelihood of malicious abuse is significant as disabling PPL is a known tactic used by adversaries to facilitate credential theft and lateral movement. This behavior is commonly weaponized in various attack campaigns.

  ---

  ### Blind Spots and Assumptions

  It's important to recognize that legitimate administrative tasks may trigger this alert if performed by authorized personnel under specific circumstances. Additionally, if logging for process creation is not configured properly or if there are gaps in telemetry, detection may be less effective. Evasion techniques such as using alternative methods to modify registry keys (e.g., scripting) could also bypass detection. A related detection to strengthen coverage would involve monitoring for unauthorized changes to LSA settings through other registry methods or API calls.

