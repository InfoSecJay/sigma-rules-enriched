note: |
  ### Technical Context

  This rule detects modifications to the Windows registry that disable the System Restore feature, typically executed via command line tools like PowerShell or Reg.exe. The likely attacker objective is to prevent restoration to a previous state, thereby hindering forensic investigations and facilitating malicious activities without detection. This activity aligns with the MITRE ATT&CK technique T1490 (Inhibit System Recovery).

  The primary telemetry sources include process creation logs indicating command line executions (Windows Security Event ID 4688 and Sysmon Event ID 1) related to specific registry manipulation commands. A successful disabling of System Restore can significantly compromise incident response efforts and persistent threat mitigation. Importantly, this detection does NOT confirm that the change was executed with malicious intent; it merely indicates that the registry modification occurred.

  ### Investigation Steps

  - **Examine the command line activity:** Review Security Event ID 4688 or Sysmon Event ID 1 for command line strings that include 'add', 'Set-ItemProperty', 'New-ItemProperty', and paths like '\SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore' or '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore'.

  - **Identify known good behavior:** Cross-check with established baselines for legitimate use cases of registry modifications related to System Restore. Document any administrative scripts or maintenance tasks that may have invoked similar commands.

  - **Correlate with user accounts:** Check the user account associated with the alert. Privileged accounts (e.g., System Administrators) may have legitimate reasons for making registry changes, while non-privileged accounts would warrant further scrutiny.

  - **Look for concurrent suspicious activity:** Assess other logs (e.g., Windows Event Logs or Sysmon) for indications of coordinated activity, such as process trees where abnormal processes invoke commands related to System Restore modifications.

  - **Evaluate impacts on incident response:** Consider the ramifications of the registry change. If System Restore is disabled, assess if there are other remediation or recovery mechanisms in place and prepare for potential further investigative actions.

  ### Prioritization

  This alert is highly severe due to the critical role of System Restore in recovery and incident response within enterprise environments. The likelihood of malicious exploitation is significant, as disabling recovery mechanisms is a common tactic among adversaries to maintain persistence and obfuscate their actions.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logging is insufficiently configured to capture process creation events or by administrative actions taken by authorized personnel that could trigger this alert. Administrative scripts or normal maintenance tasks may also result in legitimate changes. Related detections include monitoring for unauthorized access to critical registry keys or abnormal process creations that could indicate an attempted exploitation of system recovery mechanisms.

