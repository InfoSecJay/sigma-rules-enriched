note: |
  ### Technical Context

  This Sigma rule detects behavior indicative of potential hijacking attempts on the Amazon SSM (System Manager) Agent, particularly the execution of the agent with specific command-line arguments that could signify unauthorized registration or configuration. The likely attacker objective is to leverage the SSM Agent to establish persistence or remote access into an AWS-hosted Windows environment. This behavior aligns with the MITRE ATT&CK technique for command and control (T1219.002).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide insights into process creation and command-line arguments used. If confirmed as malicious, this hijacking could enable an attacker to maintain access and control over critical cloud infrastructure. However, this detection does NOT confirm that the action is definitely malicious; benign use by system administrators must be considered.

  ### Investigation Steps

  - **Check process creation logs: Security Event ID 4688 and Sysmon Event ID 1:** Filter logs for 'amazon-ssm-agent.exe' to identify the process. Cross-reference command-line arguments to assess legitimacy.

  - **Analyze command line arguments:** Look specifically for the presence of '-register', '-code', '-id', and '-region'. Malicious indicators are if the command involves suspicious or unfamiliar REGION and CODE values.

  - **Investigate system administrator activity:** Confirm if a known system administrator has executed the command, reviewing recent changes in SSM Agent configurations to ascertain normal operational behavior.

  - **Correlate with known AWS accounts:** Match the account executing the SSM Agent against authorized IAM roles to determine legitimacy. Look for anomalies in usage patterns.

  - **Check for related network connections:** Review outbound connectivity logs (CloudTrail, VPC flow logs) initiated by the SSM Agent process. Identify any connections to external IPs that do not match AWS' expected IP ranges, indicating possible C2 communication.

  - **Verify AWS IAM policy changes:** Examine AWS CloudTrail logs for any recent changes to IAM policies that could allow unauthorized access to SSM or modification of the SSM Agent. Malicious activity could correlate with recent policy adjustments that weaken security.

  ### Prioritization

  This alert is assigned medium severity. If the SSM Agent is being hijacked, it could lead to significant intrusion risks across potentially critical cloud environments. The likelihood of malicious abuse is elevated due to the increasing trend of using such tools for post-exploitation activities. Additionally, this behavior is increasingly weaponized in cloud-based environments, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations within the AWS environment. Certain legitimate administrative operations might trigger this alert, particularly from trusted accounts executing standard SSM configurations. Evasion techniques might include obfuscation of command line parameters or the use of alternate accepted tools for SSM interactions. A companion detection rule focusing on unusual IAM policy changes could enhance coverage against potential exploitation attempts.

