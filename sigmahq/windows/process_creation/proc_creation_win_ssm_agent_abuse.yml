note: |
  ### Technical Context
  This rule identifies potential hijacking attempts of the Amazon Simple Systems Manager (SSM) agent on Windows systems. The SSM agent is a management tool used for automating administrative tasks within an AWS environment. Attackers may exploit this tool to gain and maintain remote access to a system, mimicking legitimate administrative actions while performing malicious activities. The typical goal for these attackers is to establish command and control over compromised assets to exfiltrate data or deploy further exploits.

  Relevant MITRE ATT&CK tactics that apply include:
  - **Command and Control (T1071)**
  - **Persistence (T1219.002)**, which specifically involves the use of valid accounts, such as those provided by services like Amazon SSM.

  To effectively monitor for these threats, primary data sources would include **process creation logs**, as process execution events can identify invocation of the SSM agent and its associated command-line arguments, which are critical for understanding the legitimacy of its use.

  ### Investigation Steps
  - **Review Process Creation Events:** Check the logs for instances of `amazon-ssm-agent.exe` running. Pay attention to the command-line arguments used to launch this process for any anomalous patterns or values.
  - **Analyze Command-Line Patterns:** Investigate instances containing `-register`, `-code`, `-id`, or `-region` to establish the legitimacy of the actions taken by the SSM agent. Document normal usage patterns for legitimate administrative activities.
  - **Monitor Network Activity:** Assess network traffic to and from AWS endpoints, looking for unexpected connections that could point to unauthorized control instructions or data exfiltration attempts.
  - **Correlate with AWS IAM Logs:** Check AWS Identity and Access Management (IAM) logs to validate if the account associated with the compromised SSM session exhibited unusual behavior leading up to or following the suspected hijack attempt.

  ### Prioritization
  This alert should be considered medium severity due to the potential impact of unauthorized remote access and the likelihood of such exploitation in an AWS-enabled enterprise environment. The ability to misuse administrative tools poses significant risk to data integrity and system availability.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the SSM agent is not consistently monitored or if logging for process creation is not enabled on all instances. Additionally, the detection logic assumes that attackers will use recognizable command-line parameters associated with the SSM agent; sophisticated attackers may obfuscate or change typical usage patterns. Effective logging and alert configurations are essential to ensure that command-line parameters and process executions are captured reliably.

