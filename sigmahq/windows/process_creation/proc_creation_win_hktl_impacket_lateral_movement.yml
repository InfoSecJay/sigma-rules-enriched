logsource:
  category: process_creation
  product: windows
detection:
  selection_other:
        # *** wmiexec.py
        #    parent is wmiprvse.exe
        #    examples:
        #       cmd.exe /Q /c whoami 1> \\127.0.0.1\ADMIN$\__1567439113.54 2>&1
        #       cmd.exe /Q /c cd  1> \\127.0.0.1\ADMIN$\__1567439113.54 2>&1
        # *** dcomexec.py -object MMC20
        #   parent is mmc.exe
        #   example:
        #       "C:\Windows\System32\cmd.exe" /Q /c cd  1> \\127.0.0.1\ADMIN$\__1567442499.05 2>&1
        # *** dcomexec.py -object ShellBrowserWindow
        #  runs %SystemRoot%\System32\rundll32.exe shell32.dll,SHCreateLocalServerRunDll {c08afd90-f2a1-11d1-8455-00a0c91f3880} but parent command is explorer.exe
        #  example:
        #   "C:\Windows\System32\cmd.exe" /Q /c cd \ 1> \\127.0.0.1\ADMIN$\__1567520103.71 2>&1
        # *** smbexec.py
        #   parent is services.exe
        #   example:
        #       C:\Windows\system32\cmd.exe /Q /c echo tasklist ^> \\127.0.0.1\C$\__output 2^>^&1 > C:\Windows\TEMP\execute.bat & C:\Windows\system32\cmd.exe /Q /c C:\Windows\TEMP\execute.bat & del C:\Windows\TEMP\execute.bat
    ParentImage|endswith:
    - '\wmiprvse.exe'                # wmiexec
    - '\mmc.exe'                # dcomexec MMC
    - '\explorer.exe'                # dcomexec ShellBrowserWindow
    - '\services.exe'                # smbexec
    CommandLine|contains|all:
    - 'cmd.exe'
    - '/Q'
    - '/c'
    - '\\\\127.0.0.1\\'
    - '&1'
  selection_atexec:
    ParentCommandLine|contains:
    - 'svchost.exe -k netsvcs'               # atexec on win10 (parent is "C:\Windows\system32\svchost.exe -k netsvcs")
    - 'taskeng.exe'               # atexec on win7 (parent is "taskeng.exe {AFA79333-694C-4BEE-910E-E57D9A3518F6} S-1-5-18:NT AUTHORITY\System:Service:")
            # cmd.exe /C tasklist /m > C:\Windows\Temp\bAJrYQtL.tmp 2>&1
    CommandLine|contains|all:
    - 'cmd.exe'
    - '/C'
    - 'Windows\Temp\'
    - '&1'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of the Impacket framework's utilities, specifically wmiexec, dcomexec, atexec, and smbexec, based on their command-line patterns and parent process relationships. The likely attacker objective is to execute commands remotely on Windows systems, which is typical during lateral movement in an operation. This behavior aligns with MITRE ATT&CK techniques T1047 (Windows Management Instrumentation) and T1021.003 (Remote Services: WMI).

  Primary telemetry sources include Windows process creation events via Security Event ID 4688 or Sysmon Event ID 1, focused on command line arguments and their origins. If confirmed as malicious, this activity poses a significant risk by enabling unauthorized access and control over systems on the network. Importantly, this detection does not confirm the presence of a successful compromise on its own, as legitimate WMI operations can also generate similar activity.

  ### Investigation Steps

  - **Review process creation logs for WMIC executions**: Look for Security Event ID 4688 or Sysmon Event ID 1 where the ParentImage indicates `wmiprvse.exe` or `mmc.exe` and CommandLine contains `cmd.exe`, `/Q`, `/c`, and `\\127.0.0.1\`. This matches expected patterns from Impacket tools used for lateral movement.

  - **Identify potentially malicious command lines**: Focus on instances where CommandLine includes `cmd.exe`, `/C`, and redirects output to `C:\Windows\Temp\` or `\\127.0.0.1\ADMIN$`. These patterns are indicative of the atexec and smbexec methods and warrant further scrutiny.

  - **Evaluate parent process relationships**: Check if the parent processes of detected executions include `services.exe`, `taskeng.exe`, or `svchost.exe -k netsvcs`. These relationships are typically leveraged by attackers to obscure their actions.

  - **Assess benign usage patterns**: Investigate if the hosts display typical WMI or remote command execution operations correlated to legitimate administrative tasks or tools. Know that well-configured environments will utilize WMI for legitimate patching or system management purposes.

  - **Cross-reference with current threat intelligence**: Use threat intelligence platforms to determine if any detected activity corresponds to known threat actor TTPs leveraging Impacket for lateral movement, enhancing confidence in judgment.

  - **Check for temporary file indicators**: Validate the existence of temporary files generated in `C:\Windows\Temp\` with timestamps matching the suspicious command execution and look for signs of deletion or unexpected modifications to the directory after execution.

  ### Prioritization

  This alert is high priority due to the critical systems potentially impacted, the ease with which attackers can abuse WMI for lateral movement, and the prevalence of these techniques in established attack patterns. Malicious use of WMI can lead to severe breaches if not promptly investigated.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for false positives from legitimate administrative actions utilizing WMI. Log sources must be reliably configured to ensure visibility, particularly for process creation and command-line arguments, which may not always be captured. Legitimate activities that may trigger alerts include standard administrative scripts or system configuration changes. Related detections could include monitoring for failed login attempts following such executions to provide additional context on suspicious behavior.

