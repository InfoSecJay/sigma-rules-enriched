logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\tasklist.exe'
  - OriginalFileName: 'tasklist.exe'
  selection_flags:
    CommandLine|contains|windash: '-m'
  selection_module:
        # Note: add other interesting modules or binaries
    CommandLine|contains: 'rdpcorets.dll'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the use of the `tasklist.exe` utility to enumerate loaded modules associated with specific DLLs or executables within a Windows environment. The `tasklist.exe` command allows an attacker to retrieve a list of currently running processes along with their identifiers and loaded DLLs, enabling them to pinpoint processes that may contain exploitable vulnerabilities or sensitive information.

  Attackers often employ this technique as part of a broader strategy to conduct memory dumping or other post-exploitation activities. By identifying the exact process identifier (PID) for a targeted DLL, threats such as credential dumping or lateral movement can be executed more effectively. This behavior is relevant to the MITRE ATT&CK framework, particularly in the following tactics and techniques:
  - Credential Access (TA0006, T1003).

  Data sources that will provide the necessary evidence include process creation event logs, which capture command-line activity and can reveal instances of `tasklist.exe` being executed with specific flags or arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for instances of `tasklist.exe` being run, especially looking for command-line arguments indicating module enumeration (e.g., `-m`).
  - **Investigate Targeted DLLs:** Focus on any recorded command-line executions that involve notable DLLs such as `rdpcorets.dll`, and explore the context of their usage, including the parent processes.
  - **Analyze Network Connections:** Look for network activity that may correspond with processes identified in the enumeration, providing insight into suspicious behavior, such as connections to command and control servers or unauthorized data exfiltration.
  - **Correlate User Actions:** Determine if the account initiating the task has a valid reason for its actions. Check for unusual user activity or logon events correlating with the enumeration timeframe.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of successful credential dumping and the likelihood of unauthorized access that could result from such a technique. Monitoring for this behavior is essential to prevent further compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage depending on the logging configuration and event retention policies in place for process creation events. The detection logic assumes `tasklist.exe` is being used in a suspicious context; however, legitimate administrative tasks could also trigger this alert. Proper monitoring and logging of administrative activities are necessary to ensure the reliability of this detection, as well as configurations that capture comprehensive process creation events.

