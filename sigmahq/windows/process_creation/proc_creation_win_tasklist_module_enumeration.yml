logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\tasklist.exe'
  - OriginalFileName: 'tasklist.exe'
  selection_flags:
    CommandLine|contains|windash: '-m'
  selection_module:
        # Note: add other interesting modules or binaries
    CommandLine|contains: 'rdpcorets.dll'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the use of `tasklist.exe` to enumerate loaded modules, specifically targeting the `rdpcorets.dll`. This behavior is often observed when attackers identify process IDs (PIDs) before dumping memory or executing further malicious actions involving that library. The relevant MITRE ATT&CK tactic is Credential Access (TA0006), specifically technique T1003 (Credential Dumping). The primary telemetry sources include Windows process creation logs, specifically from Event ID 4688, logged during the execution of `tasklist.exe`. If malicious, this activity may indicate a sophisticated attempt to extract credentials or manipulate user sessions. This detection does NOT confirm actual credential theft or successful exploitation on its own.

  ---

  ### Investigation Steps

  - **Confirm the invocation of tasklist.exe: ** Check Windows Security Event ID 4688 for `tasklist.exe` execution on affected hosts, noting the `NewProcessName` and `CommandLine` fields for details on parameters used.

  - **Identify usage of the specified DLL: ** Search for the presence of `rdpcorets.dll` within the CommandLine parameters of the tasklist process. Cross-reference with Event ID 4688 for suspicious activity related to this specific module.

  - **Evaluate process context: ** Analyze the parent process of `tasklist.exe` using the `ParentProcessId` from Event ID 4688 logs. Legitimate usage typically sees `tasklist.exe` invoked by system-level processes (e.g., `explorer.exe`, `powershell.exe`). Anomalous parent processes may indicate malicious intent.

  - **Check execution frequency: ** Review the frequency of `tasklist.exe` executions. A high volume in a short timeframe may signal automated malicious activity rather than legitimate administrative use (e.g., IT staff troubleshooting).

  - **Investigate related artifact creation: ** Validate if any process dumping activity, such as memory readings from the identified PID, follows shortly after this enumeration. Look for additional artifacts in security logs or Sysmon Event ID 10 (ProcessAccess) indicating memory access on those processes.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential security impact of exposing credentials. Although the likelihood of misuse is moderate, the enumeration of sensitive modules like `rdpcorets.dll` can indicate a preparatory step for credential dumping, which is a common tactic utilized by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs from systems not fully monitored or configured to capture all process creation events. Attackers could employ evasion techniques, such as using tools other than `tasklist.exe` for module enumeration. Legitimate activities might include admin tasks or troubleshooting scenarios that involve monitoring processes. Companion detections include monitoring `Sysmon` logs for suspicious process injection or memory access activities that could indicate credential dumping following module enumeration.

