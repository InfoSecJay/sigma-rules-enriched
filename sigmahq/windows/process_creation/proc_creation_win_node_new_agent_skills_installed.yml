title: New Agent Skills Installation Attempt Via Node.EXE
id: afa71271-6a97-4e47-810f-83120fb1a4ce
status: experimental
description: |
  Detects the attempt to install new skills for AI agents using the "npx skills" command.
  Agent skills enhance AI agents with new capabilities, but attackers may abuse this mechanism to inject malicious commands executed by the agent on behalf of the user.
  The "npx skills" command can install skills for various agents (e.g., Claude Code, Cursor, and others).
  Analysts should review any installed skills to verify their legitimacy.
  Note: Tune this rule based on whether AI agent tooling is allowed in your environment.
  In environments where such tooling is authorized, this detection may reflect normal activity and the alert level should be adjusted accordingly.
  In environments where AI agent tooling is not permitted, this activity is likely suspicious and may require immediate investigation.
references:
- https://blog.lukaszolejnik.com/supply-chain-risk-of-agentic-ai-infecting-infrastructures-via-skill-worms/
- https://github.com/vercel-labs/skills/blob/1f7fbc8d0e49c4e0601d364696bd1bdd15e80967/README.md
- https://opensourcemalware.com/blog/clawdbot-skills-ganked-your-crypto
- https://promptintel.novahunting.ai/molt
author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
date: 2026-02-03
tags:
- attack.execution
- attack.t1059.007
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\node.exe'
  - OriginalFileName: 'node.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'npx-cli.js'
    - 'skills '
    - ' add '
  condition: all of selection_*
falsepositives:
- This rule will be triggered when a new agent skill is installed regardless if 
  it is benign or malicious.
- High false positive rate expected in environments where AI agent tooling is 
  authorized and commonly used.
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_node_new_agent_skills_installed/info.yml
note: |
  ### Technical Context

  This Sigma rule detects attempts to install new skills for AI agents using the `npx skills` command executed via `node.exe`. Attackers may leverage this mechanism to install malicious skills that execute harmful commands on behalf of the user. The rule relates to the MITRE ATT&CK technique for Command-Line Interface (T1059.007), which highlights execution through command-line interfaces. Primary telemetry sources include Windows process creation logs, specifically capturing Security Event ID 4688 for process creation and Sysmon Event ID 1 for more granular process details. If malicious, the security impact could result in unauthorized command execution, potentially leading to data exfiltration or system compromise. This detection alone does not confirm a malicious act; it only indicates that a skill installation attempt occurred.

  ### Investigation Steps

  - **Check the command line for suspicious arguments:** Review logs for Security Event ID 4688 or Sysmon Event ID 1 that show `node.exe` with a command line containing `npx-cli.js` and `skills add`. Malicious installations will often have commands indicative of unusual or unauthorized skills.

  - **Validate skill legitimacy:** If skills are installed, retrieve and review the skill definitions. Check their source URLs and creation timestamps to assess legitimacy. Skills from unknown sources or with past incidents linked to malicious activity should be flagged.

  - **Examine the host environment's approved configurations:** Confirm whether the use of AI agents is permitted within the organization. If agents are unauthorized, the alert should be prioritized for immediate investigation, as it is likely to be malicious.

  - **Monitor for subsequent unusual activity:** Investigate for further anomalous behavior following the skill installation, such as unauthorized access attempts or unexpected network connections from the agent.

  - **Identify suspicious file modifications:** Review Windows Event logs (e.g., Sysmon Event ID 11 for file creation/modification) for any new or modified files in directories related to installed skills, indicating potential attempted exploitation.

  ### Prioritization

  The alert is medium severity, particularly in environments where AI agents are not authorized. The potential for adversaries to leverage installed skills for malicious purposes is significant, as such tactics have been observed in real-world attacks. The capability for command execution via these skills increases the urgency of review.

  ### Blind Spots and Assumptions

  This detection may overlook legitimate skill installations in environments where AI tooling is sanctioned, leading to false positives. The ability to install skills relies on the correct logging configuration (ensure process creation logging is enabled). The detection does not account for instances where legitimate users might install skills for approved projects. A related detection could involve monitoring outbound connections made by the AI agents to flag unauthorized data exfiltration attempts.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
