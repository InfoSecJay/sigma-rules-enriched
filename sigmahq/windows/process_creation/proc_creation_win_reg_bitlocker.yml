detection:
  selection:
    CommandLine|contains|all:
    - 'REG'
    - 'ADD'
    - '\SOFTWARE\Policies\Microsoft\FVE'
    - '/v'
    - '/f'
    CommandLine|contains:
    - 'EnableBDEWithNoTPM'
    - 'UseAdvancedStartup'
    - 'UseTPM'
    - 'UseTPMKey'
    - 'UseTPMKeyPIN'
    - 'RecoveryKeyMessageSource'
    - 'UseTPMPIN'
    - 'RecoveryKeyMessage'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious modifications to Windows BitLocker registry keys using the `reg.exe` utility. Specifically, it targets changes made that could potentially undermine the security of BitLocker, a critical component for disk encryption in enterprise environments. Attackers may seek to gain unauthorized access to encrypted data or configure BitLocker to facilitate further malicious activities. The changes to registry entries linked to BitLocker settings could indicate attempts to disable security features or prepare for unauthorized access following a compromise.

  The relevant MITRE ATT&CK tactics/techniques involved in this scenario include **Impact** (TA0082) and **Data Encrypted for Impact** (T1486). Attackers often use encryption technologies to prevent data access during the course of attacks, establishing a strategic foothold or preparing for data exfiltration. Key telemetry sources that should be monitored for this type of suspicious activity include **process creation events**, particularly those logged by Windows, as they will contain necessary command line details of executed processes.

  ### Investigation Steps
  - **Analyze Process Creation Events**: Review logs for process creation events that include the `reg.exe` utility used in conjunction with the suspicious command line arguments related to BitLocker registry modifications.
  - **Review Registry Changes**: Investigate the registry changes made to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE`. Focus on any recent additions or modifications to keys pertaining to BitLocker functionality.
  - **Correlate User Activity**: Assess the activity of the user or system account that executed the `reg.exe` command. Determine whether their actions align with typical administrative tasks or if the command was executed in an unusual context.
  - **Examine Related Logs**: Collect and analyze any relevant logs from EDR or endpoint security solutions that may provide additional context or evidence of malicious activity, especially any surrounding activities that suggest a security breach.

  ### Prioritization
  This alert has a high severity rating due to the potential impact of unauthorized changes to BitLocker configurations, which could lead to unauthorized data access and significant operational disruption in an enterprise environment.

  ### Blind Spots and Assumptions
  One gap in detection coverage lies in the possibility of attackers utilizing alternative methods or utilities for registry modifications that may not trigger this specific rule. The detection logic assumes that any legitimate administrative activities or changes to BitLocker settings are significantly unlikely, which could lead to potential false negatives for casual or legitimate use cases. Proper logging configurations must be enabled for process creation events, and any EDR solutions should be adequately set to capture detailed command line arguments for effective detection.

