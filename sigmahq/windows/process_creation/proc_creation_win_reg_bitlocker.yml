note: |
  ### Technical Context

  This Sigma rule detects suspicious registry modifications related to BitLocker via the `reg.exe` utility, particularly commands that add or modify keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE`. The behavior may indicate an attempt to manipulate BitLocker settings, potentially to disable protections or enable unauthorized recovery methods. The likely attacker's objective is to facilitate data access post-compromise, for example, by ensuring that files can be decrypted or to stealthily operate without encryption.

  This detection aligns with the MITRE ATT&CK framework under the tactic "Impact" (TA0002) and technique "Data Encrypted for Impact" (T1486). The primary telemetry sources are Windows process creation logs (Event ID 4688) that capture command-line executions. If malicious, this behavior could lead to full disk decryption and unauthorized access to sensitive data. However, this detection does NOT independently confirm malicious intent as there may be legitimate administrative activities involving BitLocker adjustments.

  ### Investigation Steps

  - **Review Event IDs for process creation**: Check Windows Security Event ID 4688 to confirm the invocation of the `reg.exe` command and identify the user account executing it. Look for unusual user accounts with elevated privileges.

  - **Analyze command-line parameters**: Examine the CommandLine field for the presence of keywords such as 'EnableBDEWithNoTPM' or 'UseTPMKey'. Malicious modifications typically include parameters that suggest enabling BitLocker without a TPM or changing key recovery settings.

  - **Validate the modification target**: Confirm whether changes are being made to the expected registry key path `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\FVE`. Legitimate administrative activities may involve settings in this path but should follow established organizational policies.

  - **Correlate user behavior with historical context**: If the user account executing the command is a service account, validate against known behaviors and documentations for legitimate changes. Check for any recent incidents on endpoints where these changes occurred.

  - **Identify high-confidence malicious indicators**: Confirm if the command was executed from a non-standard directory (e.g., not from `C:\Windows\System32`) which could indicate malicious intent. Track back any associated processes for further signs of compromise.

  - **Check for creation of suspicious files**: Monitor for newly created BitLocker recovery files following the registry modification. Track changes in file paths related to recovery keys, particularly unusual or unexpected locations.

  ### Prioritization

  This alert is high severity due to the potential impact on device security and data integrity. Given that attacker manipulation of BitLocker settings is commonly weaponized in infiltration scenarios, the likelihood of malicious intent should be closely evaluated.

  ### Blind Spots and Assumptions

  Detection may be limited by non-standard configurations or other administrative tools that modify registry settings without using `reg.exe`. Ensure that Windows process creation logging is consistently enabled across all endpoints to capture such activities effectively. Legitimate administrative changes, especially in automated environments, may falsely trigger this alert; understanding normal change management processes is essential. Companion detections might include monitoring for script execution that automates BitLocker configurations or file modifications following registry changes, which could provide additional context for investigation.

