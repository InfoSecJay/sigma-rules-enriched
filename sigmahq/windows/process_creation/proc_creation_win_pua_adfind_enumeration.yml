note: |
  ### Technical Context
  This rule is designed to detect suspicious enumeration activities related to Active Directory (AD) leveraging the AdFind tool, a commonly used CLI utility for retrieving information from AD. The detected behavior indicates an attempt to gather sensitive information about the user's environment, including password policies and user permissions, which can be leveraged by attackers for lateral movement or privilege escalation. Attackers may employ this tool to map out the organization's AD structure, making it easier to identify potential targets for attacks.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) and **Active Directory Enumeration** (T1087.002). These tactics and techniques indicate that the suspected adversaries may intend to identify and exploit accounts with administrative privileges, particularly if they are not authorized personnel. The primary data sources utilized for detection include process creation logs from Windows systems, which capture the command-line arguments used during execution, allowing for the identification of the script or tool used for enumeration.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for instances of AdFind.EXE being executed, specifically focusing on command lines that contain known flags associated with AD enumeration such as `-sc admincountdmp` or password policy flags.

  - **Check for Unusual User Activity**: Analyze the user accounts running the AdFind.EXE command for unusual behaviors or patterns, including accounts that have not been previously known to perform AD enumeration, which could indicate a compromised account.

  - **Correlate with Network Traffic**: Investigate any related network traffic that corresponds with the time of AdFind execution to identify unusual connections or attempts to communicate with other systems that may suggest lateral movement.

  - **Audit Account Permissions**: Review user account permissions and roles within Active Directory to determine if the accounts executing these commands have legitimate administrative privileges or if they may represent a misconfiguration or breach.

  ### Prioritization
  This alert is classified as high severity due to its potential to indicate an attacker enumerating Active Directory for sensitive information. The likelihood of exploitation from unauthorized enumeration makes it critical to investigate swiftly to prevent further compromise.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if the AdFind tool has been misconfigured or renamed in a way that bypasses detection mechanisms. The detection logic assumes that the command-line arguments will be logged appropriately and that the execution of AdFind.EXE is not part of normal authorized activities by IT administrators. For the alert to function effectively, process creation logs must be enabled and correctly configured on all Windows endpoints.

