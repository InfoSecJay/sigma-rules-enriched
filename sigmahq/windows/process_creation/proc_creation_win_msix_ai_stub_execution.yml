note: |
  ### Technical Context

  This Sigma rule detects the execution of AI_STUBS components from Advanced Installer's MSIX Package Support Framework, specifically the executable named 'popupwrapper.exe'. This behavior may indicate an attempt to execute malicious code packaged through MSIX, exploiting the Package Support Framework to circumvent application control measures. The likely attacker objective is to deploy unauthorized software or malware under the guise of legitimate installation, evading standard security mechanisms.

  This detection corresponds to MITRE ATT&CK tactic "Execution" (ID: T1204) and technique "User Execution" (ID: T1204.002) as well as "Defense Evasion" (ID: T1553.005). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If utilized maliciously, this behavior could lead to unauthorized software execution and potential compromise of sensitive data. However, this detection alone does NOT confirm malicious intent; it requires further investigation of context and additional indicators.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of 'popupwrapper.exe' execution. Look for suspicious parent processes or unusual command-line arguments indicative of manual or automated exploitation.

  - **Validate execution paths:** Ensure that the paths for executed files (e.g., '\AI_STUBS\AiStubX64.exe') are legitimate and consistent with known application installations. Unusual file path locations can indicate potential compromise.

  - **Review file signatures:** Inspect the digital signatures of the 'popupwrapper.exe' executable. Legitimate packages should have trusted signatures from recognized publishers; absence or mismatched signatures may suggest malicious modification.

  - **Identify background activity:** Look for concurrent network activity associated with the process in network logs. Unusual outbound connections or data exfiltration attempts following the execution could be a high-confidence malicious indicator.

  - **Assess legitimate software usage:** Cross-reference any identified instances of 'popupwrapper.exe' against your inventory of approved applications to confirm whether the alert is triggered by expected business operations.

  ### Prioritization

  The alert severity is moderate due to the potential impact on enterprise systems if malicious code executes. Though the use of MSIX alongside AI_STUBS is less common, its potential for abuse makes it a relevant concern. The technique is increasingly weaponized in targeting enterprise applications, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments lacking complete logging configurations or where advanced evasion techniques might disguise MSIX usage within legitimate applications. Legitimate installations of software using Advanced Installer could trigger alerts, necessitating careful review. A related detection mechanism includes monitoring for the creation of unauthorized MSIX packages, which adds an additional layer of coverage in identifying potential threats.

