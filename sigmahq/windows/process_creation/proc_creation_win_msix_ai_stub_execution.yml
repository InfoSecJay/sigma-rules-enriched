note: |
  ### Technical Context
  This detection rule identifies the execution of the Advanced Installer MSIX Package Support Framework (PSF) components, particularly focusing on executables named 'popupwrapper.exe' originating from the AI_STUBS directory. The presence of this specific executable may indicate the deployment of malicious MSIX packages that leverage Advanced Installer's features to circumvent application control mechanisms. Attackers may utilize this method to execute unauthorized code or deliver malware. Given the capability of MSIX packages, adversaries can hide malicious payloads within seemingly legitimate installations, making detection critical.

  The relevant MITRE ATT&CK tactics related to this malicious behavior include **Execution (T1204)**, where adversaries execute code via user interactions, and **Defense Evasion (T1553.005)**, which pertains to the use of signed but malicious software to bypass security controls. Monitoring processes related to MSIX package execution can reveal potential misuse of this technology.

  Key data sources for monitoring this activity include **process creation events** on Windows systems, which can provide insights into what processes are being launched and from where, potentially exposing any unauthorized use of the MSIX Package Support Framework.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events that show executions of `AiStubX64Elevated.exe`, `AiStubX86Elevated.exe`, `AiStubX64.exe`, and `AiStubX86.exe`. Look for entries that include 'popupwrapper.exe' as the original filename.

  - **Correlate with Software Inventory**: Examine your software inventory and application control policies to determine if the observed executions are linked to legitimate applications. Highlight any discrepancies between expected and actual software deployments.

  - **Monitor for User Interactions**: Investigate any recent user interactions or installations that may have triggered the execution of these components, especially those that may have involved downloading or running software from untrusted sources.

  - **Analyze Related Network Traffic**: If available, review network traffic logs for unusual activity corresponding with the timestamps of the detected execution. Pay attention to any connections that may indicate command and control or data exfiltration attempts.

  ### Prioritization
  This alert has a **low severity** level within an enterprise context due to the potential for both legitimate and malicious uses of MSIX packages. While detection of this behavior is essential, many instances may be benign, particularly those involving authorized applications.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the possibility of legitimate applications that also utilize the Advanced Installer MSIX framework, which could lead to false positives. The detection logic assumes that any execution of 'popupwrapper.exe' from the specified paths is suspicious, potentially overlooking legitimate use cases. Additionally, this rule requires adequate process creation logging to function correctly; if such logging is not enabled or properly configured, the detection will not trigger, making the organization vulnerable to this stealthy attack vector.

