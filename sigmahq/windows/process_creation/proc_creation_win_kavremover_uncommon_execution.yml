title: Kavremover Dropped Binary LOLBIN Usage
id: d047726b-c71c-4048-a99b-2e2f50dc107d
status: test
description: Detects the execution of a signed binary dropped by Kaspersky Lab 
  Products Remover (kavremover) which can be abused as a LOLBIN to execute 
  arbitrary commands and binaries.
references:
- https://nasbench.medium.com/lolbined-using-kaspersky-endpoint-security-kes-installer-to-execute-arbitrary-commands-1c999f1b7fea
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-01
tags:
- attack.defense-evasion
- attack.t1127
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains: ' run run-cmd '
  filter_main_legit_parents:
    ParentImage|endswith:
    - '\cleanapi.exe'         # When launched from KES installer
    - '\kavremover.exe'         # When launched from kavremover.exe
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a signed binary associated with Kaspersky Lab Products Remover (kavremover), specifically when it is used to run arbitrary commands or binaries through command line arguments containing 'run run-cmd'. The primary objective of an attacker leveraging this behavior would be to abuse legitimate software to execute malicious commands in a stealthy manner, thereby evading detection. This activity is associated with the MITRE ATT&CK technique "Signed Binary Proxy Execution" (T1127).

  The primary telemetry sources involve Windows process creation events, specifically focusing on Event ID 4688 from the Security log and related Sysmon logs to capture detailed process creation data. If malicious, this activity can lead to system compromise or data exfiltration. Importantly, this detection does not confirm the intent behind the execution or the outcome of the executed command; it merely indicates that the kavremover binary is being misused.

  ### Investigation Steps

  - **Identify process creation details**: Review Security Event ID 4688 logs for the execution of processes containing 'run run-cmd'. Validate that the ParentImage is either 'cleanapi.exe' or 'kavremover.exe' for potential abuse scenarios.

  - **Examine command line arguments**: Analyze the command line fields (CommandLine) of the identified events for other arguments or commands being executed. Look for indications of unexpected behavior or malicious payloads.

  - **Establish baseline for legitimate use**: Determine the normal operational use of 'kavremover.exe' in your environment. If it is used for legitimate software cleanup, document expected command line arguments and parent processes.

  - **Correlate with other signs of compromise**: Check for related indicators of compromise, such as unusual outbound communication or suspicious file creations linked to this execution, including dropped files in common temp directories (C:\Windows\Temp).

  - **Investigate user context**: Review the user account (AccountName) associated with the process. Look for anomalies, such as privileged accounts executing this command in inappropriate contexts or times.

  - **Monitor for additional malicious behaviors**: Track subsequent events or processes spawned by this command to identify any further suspicious actions or connections that could indicate a successful compromise.

  ### Prioritization

  The severity of this alert is high. The use of a known legitimate binary (kavremover) to execute arbitrary commands presents significant risks, particularly if executed in a sensitive context or by an elevated privilege account. This technique is well-documented in adversarial tactics, making it a credible threat to enterprise security.

  ### Blind Spots and Assumptions

  This detection relies on the availability of detailed process creation logs (Event ID 4688); therefore, any gaps in logging could lead to missed malicious activity. Attackers may attempt to disguise this behavior through obfuscation or by using variations of the legitimate invocation pattern. Legitimate administrative tasks may occasionally trigger this alert, particularly if kavremover tool is employed in its intended capacity. Companion detections that monitor for unusual process behavior or network activity, such as outbound connections after executing this binary, would enhance coverage and provide a more comprehensive security posture.

