title: Kavremover Dropped Binary LOLBIN Usage
id: d047726b-c71c-4048-a99b-2e2f50dc107d
status: test
description: Detects the execution of a signed binary dropped by Kaspersky Lab Products
  Remover (kavremover) which can be abused as a LOLBIN to execute arbitrary commands
  and binaries.
references:
- https://nasbench.medium.com/lolbined-using-kaspersky-endpoint-security-kes-installer-to-execute-arbitrary-commands-1c999f1b7fea
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-01
tags:
- attack.defense-evasion
- attack.t1127
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains: ' run run-cmd '
  filter_main_legit_parents:
    ParentImage|endswith:
    - '\cleanapi.exe'         # When launched from KES installer
    - '\kavremover.exe'         # When launched from kavremover.exe
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of a potentially malicious signed binary, specifically targeting instances where the Kaspersky Lab Products Remover (Kavremover) is abused as a living-off-the-land binary (LOLBIN). Attackers may leverage Kavremover to execute arbitrary commands or launch additional malicious binaries without raising suspicion, as it is a legitimate tool. The primary objective here is often to circumvent traditional security measures, thereby achieving stealthy access and control over target systems.

  The detection logic focuses on command line parameters related to the execution of the Kavremover tool. Specifically, it looks for instances where the command line includes the phrase 'run run-cmd', indicating that an attempt to execute commands has occurred via this binary. This behavior is consistent with the MITRE ATT&CK techniques of Defense Evasion (TA0005) and Execution (TA0002), particularly T1127: "Execution using Linked Command Script".

  The primary data sources relevant to this detection include process creation events from Windows logs, which will reveal any activities related to the execution of Kavremover and its command-line interactions. These logs are critical for identifying suspicious behaviors and understanding the context of the execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation events for instances where Kavremover or its associated binaries were executed. Pay attention to the command line parameters used at the time of execution.

  - **Examine Parent Processes:** Identify and investigate the parent processes launching Kavremover. Legitimate usage should stem from specific applications like `cleanapi.exe` or `kavremover.exe`. Look for any anomalies or unexpected parent processes.

  - **Check for Anomalous Command Execution:** Focus on command line arguments containing 'run run-cmd'. Any unusual usage patterns or execution outside of normal operational contexts should be flagged for further analysis.

  - **Assess Impacted Systems:** Perform an inventory check on systems that executed Kavremover, focusing on user accounts and access patterns. Investigate any subsequent actions that may indicate deeper compromises or lateral movements within the environment.

  ### Prioritization
  The severity of this alert is high due to the potential impact of an attacker being able to execute arbitrary commands within a targeted environment. The likelihood of exploitation increases as Kavremover is a tool that could be misused, which mandates urgent investigation to prevent further malicious activities.

  ### Blind Spots and Assumptions
  This rule assumes that the execution of Kavremover will be captured in process creation logs; thus, any gaps in logging configurations may hinder detection effectiveness. If local logging is disabled or minimal logging is applied, it may lead to undetected usages of Kavremover. Additionally, this detection logic may overlook other methods of execution or variations of command line arguments that do not align exactly with the specified parameters in the rule.

