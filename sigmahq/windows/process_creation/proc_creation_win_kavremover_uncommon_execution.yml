title: Kavremover Dropped Binary LOLBIN Usage
id: d047726b-c71c-4048-a99b-2e2f50dc107d
status: test
description: Detects the execution of a signed binary dropped by Kaspersky Lab 
  Products Remover (kavremover) which can be abused as a LOLBIN to execute 
  arbitrary commands and binaries.
references:
- https://nasbench.medium.com/lolbined-using-kaspersky-endpoint-security-kes-installer-to-execute-arbitrary-commands-1c999f1b7fea
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-11-01
tags:
- attack.execution
- attack.stealth
- attack.t1127
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains: ' run run-cmd '
  filter_main_legit_parents:
    ParentImage|endswith:
    - '\cleanapi.exe'         # When launched from KES installer
    - '\kavremover.exe'         # When launched from kavremover.exe
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a signed binary associated with Kaspersky Lab's Products Remover (kavremover), which is often misused as a Living-off-the-land Binary (LOLBIN) to execute commands stealthily. The potential attacker objective includes the covert execution of malicious commands or payloads while bypassing traditional security measures by utilizing legitimate software to mask their activities. Relevant MITRE ATT&CK tactic and technique include Execution (TA0002) and LOLBins (T1127).

  Primary telemetry sources for this detection are process creation logs from Windows, specifically focusing on command line arguments. If leveraged maliciously, this behavior can lead to unauthorized execution of malicious code, potentially leading to data leakage or further attacks. However, this detection does NOT confirm that malicious activity occurred; the execution might be part of legitimate administrative tasks, as Kaspersky tools are commonly used in enterprise environments.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for processes containing 'run run-cmd' in their command line. Look for execution from expected suspicious parents like `kavremover.exe` or `cleanapi.exe`.

  - **Identify execution context:** Confirm the parent process of `kavremover.exe`. If it originated from legitimate systems such as Kaspersky Endpoint Security (KES), further investigation might be warranted rather than an immediate escalation.

  - **Analyze command line parameters:** Look for any unusual or unexpected commands being executed through this binary. Legitimate usages might involve basic task automation, while any complex command or script execution likely indicates malicious intent.

  - **Collect spatial logs:** Verify process execution history through Sysmon Event ID 1 to identify the execution chain leading to this alert. Unusual parent-child relationships should be escalated.

  - **Check for additional artifacts:** Validate the presence of any newly created files or unusual network activity after the detected execution using File Creation timestamps and outbound connections in your logs. Unscheduled remote connections following the execution can be a high-confidence indicator of malicious actions.

  ### Prioritization

  The alert is categorized as high severity due to the potential impact on sensitive systems, such as critical infrastructure managed by Kaspersky. The common tactics associated with LOLBIN usage make this behavior a likely vector for malicious activity. Moreover, the misuse of trusted binaries to execute arbitrary commands significantly increases the likelihood of exploitation.

  ### Blind Spots and Assumptions

  This detection relies on the presence of precise command line arguments, which could be evaded by obfuscating command-line usage or using alternative legitimate tools. The logs from process creation must be consistently collected and monitored; otherwise, missed executions might lead to gaps in detection. Legitimate administrative tasks may trigger the alert, especially in managed environments where Kaspersky tools are used routinely. An additional layer of detection around unauthorized binary execution would strengthen coverage, potentially incorporating rules for monitoring process injection or wire data flow from these binaries.

