detection:
  selection_img:
  - Image|endswith: '\rdrleakdiag.exe'
  - OriginalFileName: RdrLeakDiag.exe
  selection_cli_dump:
    CommandLine|contains|windash:
    - '/memdmp'
    - 'fullmemdmp'
  selection_cli_output_process:
    CommandLine|contains|windash:
    - ' /o '         # Output
    - ' /p '         # Process
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the Microsoft Windows Resource Leak Diagnostic tool, `rdrleakdiag.exe`, which can be exploited by threat actors to create memory dumps of running processes. Such memory dumps can be used to extract sensitive information, particularly credentials, and are a common tactic employed in credential access attacks. Attackers may use this tool to capture data from high-privilege processes residing in memory, potentially enabling further access or lateral movement within the compromised network.

  Relevant MITRE ATT&CK tactics and techniques associated with this rule are:
  - **Tactic**: Credential Access (TA0006)
  - **Technique**: Credential Dumping: Process Memory (T1003.001)

  The primary data sources for this detection include Windows process creation logs, particularly monitoring the execution of `rdrleakdiag.exe` and any related commands that may indicate attempts to perform memory dumps. Additionally, scrutinizing command line arguments in these logs can provide insights into the intentions behind the memory dumps.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate logs for any instances of `rdrleakdiag.exe` being executed. Focus on the user context and associated command line arguments to understand the target processes and intent behind the activity.
  - **Analyze Command Line Arguments**: Specifically, look for command line options like `/memdmp`, `fullmemdmp`, `/o`, and `/p`, which indicate attempts to dump memory and specify output destinations. This can reveal whether sensitive information was targeted.
  - **Inspect Event Logs**: Check Windows Event Logs for any unusual patterns or preceding events that could indicate preparation for memory dumping activities, such as privilege escalation or reconnaissance actions.
  - **Correlate with User Behavior**: Assess the user account associated with the execution of `rdrleakdiag.exe`. Determine whether this usage is consistent with known behavior and role within the organization; investigate if the account has been compromised.

  ### Prioritization
  This alert is marked as high severity due to the significant impact that successful credential dumping can have on an organization. Given the potential for threat actors to gain elevated access and execute further attacks, timely investigation is critical.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if `rdrleakdiag.exe` logs are not enabled or if process creation logs are not collected comprehensively. The detection logic assumes that any invocation of this tool will be malicious; however, there could be legitimate scenarios in which it is used for troubleshooting by authorized personnel. Required logs include thorough process creation logs and command line arguments, with proper configurations to ensure they capture all relevant activities for effective detection.

