note: |
  ### Technical Context

  This Sigma rule detects the execution of the `rdrleakdiag.exe` command-line tool, which is typically used for dumping the memory of other processes on Windows systems. The behavior indicates a potential attacker objective of extracting sensitive information, such as credentials or token data, from running processes. This activity falls under the MITRE ATT&CK framework, specifically in the "Credential Access" tactic (TA0006), and technique T1003.001, which focuses on memory scraping.

  The primary telemetry source for detecting this behavior comes from Windows process creation logs, specifically targeting Event ID 4688 for process creation or Sysmon Event ID 1 for detailed execution metadata. If malicious, this action can lead to unauthorized access to sensitive information stored in memory. Importantly, this detection does not confirm that sensitive data has been successfully extracted; it only indicates that an attempt was made to use a tool associated with such actions.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and/or Sysmon Event ID 1 for any instances where `rdrleakdiag.exe` was launched on critical systems. Note the user context and time of execution.

  - **Analyze command line arguments:** Inspect the command-line arguments in the event logs; legitimate use will typically not contain flags such as `/memdmp` or `/fullmemdmp`. Presence of these flags may indicate malicious intent.

  - **Identify output redirection:** Look for command line entries containing `/o` or `/p` in the process creation logs. This indicates the process is being instructed to output data or target a specific process, which is a strong indicator of malicious behavior.

  - **Review host activity:** Determine what legitimate activities might resemble this tool's execution. Standard usage could involve developers troubleshooting applications without the flags indicative of memory dumping. Contextual baselines are important.

  - **Correlate with known indicators:** Check for previous flagged behavior linked to `rdrleakdiag.exe` execution within the last 90 days to establish a pattern. If malicious, this would typically show correlation with other credential dumping techniques or indicators of compromise.

  ### Prioritization

  This alert is considered high severity due to the impact on compromised systems that could lead to credential theft. The likelihood of malicious abuse is significant, especially as tools like `rdrleakdiag.exe` are commonly weaponized by adversaries for credential access. Analyzing this behavior in high-risk environments or critical assets is necessary to prevent potential breaches.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers renaming or modifying the binary, which could evade standard detection. Additionally, log sources must be consistently configured to track process creation accurately; failure to log Event ID 4688 or Sysmon can lead to missed detections. Legitimate Developer or SysAdmin activities may trigger similar logs if they utilize the tool for diagnostic purposes. A related detection rule focusing on other credential dumping techniques (e.g., Mimikatz usage) could strengthen overall detection coverage.

