title: Suspicious WindowsTerminal Child Processes
id: 8de89e52-f6e1-4b5b-afd1-41ecfa300d48
status: test
description: Detects suspicious children spawned via the Windows Terminal 
  application which could be a sign of persistence via WindowsTerminal (see 
  references section)
references:
- https://persistence-info.github.io/Data/windowsterminalprofile.html
- https://twitter.com/nas_bench/status/1550836225652686848
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-25
modified: 2023-02-14
tags:
- attack.execution
- attack.persistence
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\WindowsTerminal.exe'
    - '\wt.exe'
  selection_susp:
  - Image|endswith:
              # Add more LOLBINS
    - '\rundll32.exe'
    - '\regsvr32.exe'
    - '\certutil.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\csc.exe'
  - Image|contains:
              # Add more suspicious paths
    - 'C:\Users\Public\'
    - '\Downloads\'
    - '\Desktop\'
    - '\AppData\Local\Temp\'
    - '\Windows\TEMP\'
  - CommandLine|contains:
              # Add more suspicious commandline
    - ' iex '
    - ' icm'
    - 'Invoke-'
    - 'Import-Module '
    - 'ipmo '
    - 'DownloadString('
    - ' /c '
    - ' /k '
    - ' /r '
  filter_builtin_visual_studio_shell:
    CommandLine|contains|all:
    - 'Import-Module'
    - 'Microsoft.VisualStudio.DevShell.dll'
    - 'Enter-VsDevShell'
  filter_open_settings:
    CommandLine|contains|all:
    - '\AppData\Local\Packages\Microsoft.WindowsTerminal_'
    - '\LocalState\settings.json'
  filter_vsdevcmd:
    CommandLine|contains|all:
    - 'C:\Program Files\Microsoft Visual Studio\'
    - '\Common7\Tools\VsDevCmd.bat'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Other legitimate "Windows Terminal" profiles
level: medium
note: |
  ### Technical Context

  This rule detects when suspicious child processes are spawned via the Windows Terminal application (WindowsTerminal.exe or wt.exe), which may indicate an attempt to execute malicious code or establish persistence. The likely attacker objective is to leverage Windows Terminal as a command execution platform, utilizing commonly abused legitimate executables (like rundll32.exe, certutil.exe, etc.) to carry out further malicious activities. This corresponds with the MITRE ATT&CK tactics of Execution (TA0002) and Persistence (TA0003).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1) capturing details about process initiation and parent-child relationships. If malicious, this behavior could lead to unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm that the executed processes are indeed malicious; rather, it flags suspicious interaction patterns for further investigation.

  ### Investigation Steps

  - **Check Process Details**: Review Security Event ID 4688 or Sysmon Event ID 1 for the parent process of the suspicious child processes, specifically looking for `WindowsTerminal.exe` or `wt.exe` as the parent. Determine if the child processes match known legitimate activity.

  - **Evaluate Command Lines**: Investigate the command line arguments of the spawned processes. Check for keywords such as ‘Invoke-’, ‘Import-Module’, or other suspicious phrases that may indicate malicious behavior. Legitimate uses will typically not contain these patterns.

  - **Assess File Locations**: Analyze the file paths of the suspicious child processes against known legitimate locations (e.g., `C:\Windows\`, `C:\Program Files\`). Child processes located in user directories like `C:\Users\Public\` or `C:\Downloads\` increase suspicion of malicious activity.

  - **Correlate with PowerShell Activity**: Cross-reference with PowerShell logs (Event ID 4104 or PowerShell transcripts) to see if any PowerShell commands were executed that correlate with the suspicious process creation. Look for commands that may have been used to manipulate or execute scripts.

  - **Review Recent Changes**: Investigate the recent changes or modifications made to Windows Terminal profiles. Legitimate profiles shouldn't include command lines or paths associated with known malicious tools. Check settings.json for alterations.

  - **Confirm Legitimate Usage**: Determine if the user has recent history of legitimate workloads using Windows Terminal to run legitimate tools. Compare logins, processes, and executed commands against typical user behavior to identify consistent usage patterns.

  ### Prioritization

  This alert should be considered medium priority in an enterprise context. The systems affected, particularly file servers or endpoints with elevated privileges, may serve critical functions. There is a notable likelihood of malicious exploitation as adversaries frequently weaponize command shells for persistence and execution, making this behavior an important vector to monitor.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques such as benign command line arguments or legitimate processes being invoked inappropriately. It requires proper logging configuration to capture all necessary event data reliably. Events triggered by legitimate automation scripts or user workflows may yield false positives. Companion detections such as monitoring for abnormal PowerShell activity could further strengthen coverage and context around alerts raised by this Sigma rule.

