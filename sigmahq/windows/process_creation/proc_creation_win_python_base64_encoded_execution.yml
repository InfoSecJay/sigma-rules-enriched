title: Python One-Liners with Base64 Decoding
id: 50a0aa3d-ab16-4594-a8aa-5145a6e6792b
related:
- id: 55e862a8-dd9c-4651-807a-f21fcad56716
  type: similar
status: experimental
description: |
  Detects Python one-liners that use base64 decoding functions in command line executions.
  Malicious scripts or attackers often use python one-liners to decode and execute base64-encoded payloads, which is a common technique for obfuscation and evasion.
references:
- https://docs.python.org/3/library/base64.html
- https://www.virustotal.com/gui/file/bc43e925d7b4b74319f6e74e836a96f1997ba404e14ac566cf12a21e9da463db/behavior
- https://cloud.google.com/blog/topics/threat-intelligence/cybercriminals-weaponize-fake-ai-websites
author: Hugh Ryan (HueCodes), Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-03-09
tags:
- attack.execution
- attack.stealth
- attack.t1059.006
- attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|contains: '\python'
  - OriginalFileName|contains: 'python'
  selection_cli:
    CommandLine|contains|all:
    - 'import'
    - 'base64'
    - ' -c'
    CommandLine|contains:
    - '.decode'
    - 'b16decode'
    - 'b32decode'
    - 'b32hexdecode'
    - 'b64decode'
    - 'b85decode'
    - 'z85decode'
  condition: all of selection_*
falsepositives:
- Legitimate use of Python for decoding data, which is uncommon in typical 
  enterprise environments but possible in development or data analysis contexts.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_python_base64_encoded_execution/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of Python one-liners that utilize base64 decoding functions, which are often employed by attackers to decode and run obfuscated payloads. The likely attacker objective is to execute malicious code while minimizing detection. This behavior corresponds to the MITRE ATT&CK technique for "Interpret Command and Scripting Interpreter" (T1059.006) and "Obfuscated Files or Information" (T1027.010). The primary telemetry source includes process creation logs, specifically Windows Event ID 4688 or Sysmon Event ID 1, capturing the command line arguments used during execution. If malicious, this detection can lead to remote command execution, data exfiltration, or further compromise of the affected system. However, this detection does not confirm that a malicious event has occurred on its own; further investigation is necessary.

  ### Investigation Steps

  - **Review the command line:** Examine the Process Creation logs (Event ID 4688) for entries containing `python` along with `base64` decoding commands such as `.decode` or `b64decode`. Verify if the process is initiated by expected users or from uncommon locations.

  - **Analyze the parent process:** Check for the parent process ID (PID) associated with the detected `python` process. A legitimate use case typically shows common scripting tools or applications (e.g., Jupyter Notebook, IDEs) as parents, whereas unexpected command line tools may indicate malicious intent.

  - **Inspect for network activity:** Look for any outbound connections initiated by the Python process in network logs (e.g., Firewall logs or Windows Security Event ID 5156). Malicious behavior may exhibit connections to unusual or known malicious IP addresses not aligned with typical organizational activity.

  - **Identify high-confidence malicious indicators:** Validate if the command line contains highly suspicious strings such as encoded base64 data or parameters indicating file write operations (e.g. `open`, `write`). Malicious indicators will likely have long, convoluted Base64 strings or automated download commands.

  - **Confirm system context:** Determine if the Python execution is occurring on a critical asset (e.g., domain controllers, server infrastructure) versus user workstations. Elevated privileges combined with this behavior substantially increase the risk profile.

  - **Document legitimate use cases:** Consider and document any recent legitimate activities involving Python and base64 decoding within the environment, particularly in research, development, or data analysis activities, to rule out false positives.

  ### Prioritization

  The alert warrants high severity due to the potential impact on sensitive systems and the likelihood of adversaries using such techniques for malicious purposes. This behavior is recognized as a common method for executing obfuscated payloads, making it vital for rapid investigation.

  ### Blind Spots and Assumptions

  Limitations include the potential for evasion techniques, such as using legitimate Python scripts for benign purposes resulting in false positives. The detection relies on proper logging configurations, with the need for complete command line capture to ensure comprehensive analysis. Legitimate activities that may trigger this alert can include development or data engineering tasks. Related detections, like those monitoring unusual outbound connection attempts post command execution, can enhance visibility and context.

