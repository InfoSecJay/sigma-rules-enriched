logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|contains: '\python'
  - OriginalFileName|contains: 'python'
  selection_cli:
    CommandLine|contains|all:
    - 'import'
    - 'base64'
    - ' -c'
    CommandLine|contains:
    - '.decode'
    - 'b16decode'
    - 'b32decode'
    - 'b32hexdecode'
    - 'b64decode'
    - 'b85decode'
    - 'z85decode'
  condition: all of selection_*
falsepositives:
- Legitimate use of Python for decoding data, which is uncommon in typical 
  enterprise environments but possible in development or data analysis contexts.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_python_base64_encoded_execution/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of Python one-liners that utilize base64 decoding methods through command line inputs. Attackers often employ such one-liners to decode and execute obfuscated payloads, typically with the objective of delivering malware or exfiltrating data. This behavior aligns with the MITRE ATT&CK technique for Execution (T1059.006) and Defense Evasion (T1027.010). The key telemetry sources for this detection are process creation logs from Windows systems, particularly focusing on CommandLine and Image fields to verify the execution context. If malicious, this activity may facilitate further exploitation or compromise of the system. However, it is critical to note that this detection does NOT confirm malicious intent on its own, as legitimate use of Python for data manipulation can occur in isolated environments.

  ### Investigation Steps

  - **Review the command line execution:** Check the Process Creation logs (Windows Event ID 4688) for entries containing 'python' with filtered CommandLine parameters for terms like 'import base64 -c'. Identify if the behavior deviates from standard usage patterns.

  - **Identify malicious indicators:** Look for base64 decode functions like 'b64decode' or 'b32decode' in CommandLine entries, as these are strong indicators of potentially malicious intent, especially in a non-development context.

  - **Baseline legitimate activities:** Consider expected behavior within your environment. Typical usage would involve standard Python scripts related to data processing, not ad-hoc commands using base64 decoding. Establish a scope of benign Python command activities used in your organization.

  - **Analyze process parentage:** Investigate the parent process of the Python execution (check ParentProcessId in Windows Event ID 4688) to determine whether it was initiated by a system service or suspicious process, which could indicate lateral movement or infection chains.

  - **Check for obfuscation patterns:** Evaluate if there are other layers of obfuscation in CommandLine strings or parent processes linking back to known malicious artifacts in threat intelligence to strengthen the context of the execution.

  ### Prioritization

  This alert carries high severity due to its potential impact on system integrity and confidentiality. The use of base64 decoding in Python commands indicates a likelihood of malicious exploitation, especially as such techniques are commonly weaponized by threat actors to bypass traditional security measures.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of Python in research or development, leading to false positives. Ensure that logging is appropriately configured to capture comprehensive command line arguments (CommandLine field) across your environment for reliable detection. Additionally, other benign tasks involving Python could trigger this alert, hence context is critical. A related detection to consider would be methods tracking unusual PowerShell commands, as PowerShell is often used in conjunction with similar base64 decoding for obfuscation.

