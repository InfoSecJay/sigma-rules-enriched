title: New Remote Desktop Connection Initiated Via Mstsc.EXE
id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
status: test
description: |
  Detects the usage of "mstsc.exe" with the "/v" flag to initiate a connection to a remote server.
  Adversaries may use valid accounts to log into a computer using the Remote Desktop Protocol (RDP). The adversary may then perform actions as the logged-on user.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.001/T1021.001.md#t1021001---remote-desktop-protocol
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/mstsc
author: frack113
date: 2022-01-07
modified: 2024-06-04
tags:
- attack.lateral-movement
- attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  selection_cli:
    CommandLine|contains|windash: ' /v:'
  filter_optional_wsl:
        # Example: mstsc.exe /v:XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX /hvsocketserviceid:XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX /silent /wslg /plugin:WSLDVC /wslgsharedmemorypath:WSL\XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX\wslg C:\ProgramData\Microsoft\WSL\wslg.rdp
    ParentImage: 'C:\Windows\System32\lxss\wslhost.exe'
    CommandLine|contains: 'C:\ProgramData\Microsoft\WSL\wslg.rdp'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- WSL (Windows Sub System For Linux)
level: medium
note: |
  ### Technical Context
  This detection rule identifies the initiation of Remote Desktop Protocol (RDP) sessions executed through `mstsc.exe` with the `/v` flag, indicating a connection to a remote machine. Such activity may signify unauthorized access attempts by an adversary leveraging valid user credentials to gain control over a system and perform potentially malicious actions. Attackers often seek to move laterally within an environment, escalate privileges, and maintain persistent access to compromised systems.

  The relevant MITRE ATT&CK tactics include **Lateral Movement**, specifically under the technique ID **T1021.001 - Remote Desktop Protocol**. This technique encompasses adversaries using RDP to connect to local or remote systems, particularly when they are attempting to expand their foothold within the target environment.

  Primary data sources for detecting this activity are **process creation logs**, which capture details about the execution of applications, including command lines to identify how executables like `mstsc.exe` are invoked. Additionally, any successful RDP connection attempts may be logged through Windows event logs, providing further context around the source and destination IP addresses involved in these connections.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze process creation logs to identify instances of `mstsc.exe` being executed. Look for command lines that include the `/v` flag which indicates a remote connection.
  - **Examine RDP Connection Logs**: Investigate RDP-related logs for successful and failed connection attempts. Pay attention to any anomalies such as logins from unexpected IP addresses or times.
  - **Check User Account Activity**: Assess the user accounts associated with the RDP sessions. Look for unusual or out-of-normal patterns, such as administrative accounts being used or connections from atypical geographic locations.
  - **Monitor Network Traffic**: Capture and analyze network packets to trace RDP traffic. This can help determine if there are any incoming or outgoing connections that appear suspicious in relation to `mstsc.exe` usage.

  ### Prioritization
  This alert carries a **medium severity** in an enterprise environment due to the potential for unauthorized access through valid user accounts. The likelihood of exploitation exists, especially in networks where RDP is enabled and accessible from external sources.

  ### Blind Spots and Assumptions
  The detection rule may not cover all potential methods of lateral movement as adversaries might use alternative RDP clients or manipulate the command line in ways that bypass this rule. Additionally, there are assumptions that every invocation of `mstsc.exe` is legitimate unless flagged otherwise, which may lead to potential false positives. Proper logging configurations must be enabled, including capturing detailed process creation events, to ensure the effectiveness of this detection logic.

