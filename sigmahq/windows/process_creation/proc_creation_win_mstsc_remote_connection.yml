title: New Remote Desktop Connection Initiated Via Mstsc.EXE
id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
status: test
description: |
  Detects the usage of "mstsc.exe" with the "/v" flag to initiate a connection to a remote server.
  Adversaries may use valid accounts to log into a computer using the Remote Desktop Protocol (RDP). The adversary may then perform actions as the logged-on user.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.001/T1021.001.md#t1021001---remote-desktop-protocol
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/mstsc
author: frack113
date: 2022-01-07
modified: 2024-06-04
tags:
- attack.lateral-movement
- attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  selection_cli:
    CommandLine|contains|windash: ' /v:'
  filter_optional_wsl:
        # Example: mstsc.exe /v:XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX /hvsocketserviceid:XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX /silent /wslg /plugin:WSLDVC /wslgsharedmemorypath:WSL\XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX\wslg C:\ProgramData\Microsoft\WSL\wslg.rdp
    ParentImage: 'C:\Windows\System32\lxss\wslhost.exe'
    CommandLine|contains: 'C:\ProgramData\Microsoft\WSL\wslg.rdp'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- WSL (Windows Sub System For Linux)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `mstsc.exe` with the `/v` flag, which initiates a Remote Desktop Protocol (RDP) connection, typically used for accessing remote servers. The likely attacker objective is to gain unauthorized access to an internal system using valid user credentials, facilitating lateral movement within the network. This detection aligns with the MITRE ATT&CK technique for "Remote Desktop Protocol" (T1021.001), which falls under the "Lateral Movement" tactic. The primary telemetry source comprises Windows process creation logs, specifically focusing on Event ID 4688 for process creation events.

  If the behavior is confirmed as malicious, it may leave the organization vulnerable to data exfiltration or unauthorized system modifications. However, this detection alone does not confirm malicious intent, as legitimate administrative RDP access may trigger it.

  ### Investigation Steps

  - **Review the process creation event:** Examine Event ID 4688 for `mstsc.exe` and ensure it contains the `/v` flag. Look for unusual or unauthorized destination IPs or hostnames to identify potential malicious RDP connections.

  - **Identify the user account involved:** Check the `SubjectUserName` and `SubjectDomainName` fields in the Event ID 4688 log entry. Confirm whether the account is a legitimate admin or a regular user, as unusual accounts initiating RDP connections could indicate malicious behavior.

  - **Inspect network logs for suspicious traffic:** Analyze firewall logs for outbound RDP connections (TCP Port 3389) that correspond to the time of the alert. Focus on connections to unfamiliar or external IP addresses, which can signify unauthorized access attempts.

  - **Correlate with System Event logs:** Review Windows Security Event ID 4624 (Logon) and Event ID 4625 (Failed Logon) closely following or preceding the Event ID 4688 for credential verification issues related to the same user account involved in the RDP initiation.

  - **Identify legitimate RDP usage patterns:** Document known, routine RDP connections by trusted users during regular business hours to establish a baseline. Compare these patterns against the activity detected by this rule to differentiate between benign and suspicious behavior.

  - **Check for abnormal session duration or behavior:** Review if the RDP session persists longer than expected based on typical user activity. Look for high privilege actions being executed during the session, which might suggest exploitation of valid accounts.

  ### Prioritization

  The alert severity is medium due to its potential impact on critical systems accessed via RDP. The likelihood of malicious abuse is notable since RDP is a common vector for attackers. This behavior has been widely weaponized in various attack scenarios, especially in environments where RDP is used frequently.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of different RDP clients or modifications to command-line patterns that avoid detection. Reliable detection requires comprehensive logging and monitoring of RDP connections, including configuration for process creation events. Legitimate system administrators may trigger this alert if they connect to remote servers for maintenance. A related detection could include monitoring for unusual authentication events (e.g., Event ID 4624 for successful logins) connecting to sensitive resources following RDP sessions to enhance overall coverage and context.

