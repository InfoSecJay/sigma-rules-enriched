note: |
  ### Technical Context
  This rule detects the execution of the Windows utility `lodctr.exe`, which is used to rebuild performance counter values in the registry. Attackers may abuse this legitimate tool to manipulate performance counter configurations by providing a malicious configuration file, potentially leading to misleading metrics and allowing them to evade detection by security solutions. The overarching threat scenario typically involves attackers trying to obfuscate their activities or hinder incident response capabilities by confusing monitoring tools about the actual system performance.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and specifically the technique **Use System Tools** (T1203). By utilizing authorized system commands, attackers can carry out malicious activities without raising immediate alarms. In this case, leveraging `lodctr.exe` for malicious intent may complicate the detection of genuine threats.

  Primary data sources for effective detection include **process creation events** logged by the operating system, which capture the execution of binaries like `lodctr.exe`, and **command line arguments** which can reveal potentially suspicious usage patterns, particularly if the command includes parameters indicating manipulation of registry values.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigate all process creation logs for instances of `lodctr.exe`. Note the user account that executed the command and correlate with legitimate administrative activity.
  - **Analyze Command Line Arguments:** Focus on command line parameters associated with `lodctr.exe`, especially any that include `-r`, indicating a possible rebuild of performance counter data. Look for anomalies in context, such as unusual user accounts or timing of execution.
  - **Check for Malicious Config Files:** Validate any configuration files used in conjunction with `lodctr.exe`. Determine if these files are signed by a trusted source or associated with inappropriate modification attempts.
  - **Correlate with Other Security Logs:** Look at related telemetry from other security solutions (e.g., EDR alerts or network logs) to identify potential lateral movement or co-occurring suspicious activities that could indicate a broader compromise.

  ### Prioritization
  This alert is considered medium priority due to the potential for an attacker to mislead monitoring tools, which could extend the time required for incident detection and response. The chance of misuse of `lodctr.exe` is moderate; therefore, any irregularities warrant prompt investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage may include legitimate administrative use of `lodctr.exe`, which could produce false positives if the monitoring tools do not sufficiently distinguish between benign and malicious execution contexts. The detection logic assumes that any command execution involving `lodctr.exe` and specific parameters is suspicious, but it may not account for all scenarios of legitimate use by administrators. Moreover, comprehensive logging for process creation and command line arguments must be enabled on Windows to ensure this detection rule functions effectively.

