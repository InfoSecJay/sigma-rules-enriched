detection:
  selection_img:
    Image|endswith: '\lodctr.exe'
    OriginalFileName: 'LODCTR.EXE'
  selection_cli:
    CommandLine|contains|windash: ' -r'
  condition: all of selection_*
falsepositives:
- Legitimate usage by an administrator
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `lodctr.exe` with the command line argument `-r`, which is typically used to rebuild performance counter registry values in Windows. Attackers may exploit this functionality by providing a malicious configuration file to overwrite legitimate performance counter settings, effectively obfuscating their activities and evading detection systems. The relevant MITRE ATT&CK tactic is **Execution** (T1203), with the technique focusing on the use of system tools for malicious purposes.

  Primary telemetry sources include Windows security logs, specifically focusing on Process Creation events (Event ID 4688) and Sysmon logs (Event ID 1). If this rule indicates a malicious usage scenario, it could significantly hinder an organization's ability to monitor processes effectively, providing a means for threat actors to subtly manipulate system performance metrics. This detection does NOT confirm that malicious activity is occurring on its own; further context and corroborating evidence are necessary.

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 4688 or Sysmon Event ID 1 for `lodctr.exe` executions, particularly filtering logs for the command line containing `-r`. Malicious uses typically will present unusual file paths or arguments.

  - **Validate the configuration file:** Identify any configuration files used with `lodctr.exe`. Malicious indicators include unexpected file locations such as temporary directories or the use of files not typically associated with performance counters.

  - **Correlate with other alerts:** Cross-reference this alert with any logged suspicious activities, such as changes to security settings or unusual logon events. Look for a sequence of events that might suggest privilege escalation or lateral movement.

  - **Check for legitimate administrator actions:** Identify if `lodctr.exe` execution is part of routine maintenance by your IT staff. Normal usage usually occurs with standard performance monitoring tools and does not accompany unusual changes to system configurations.

  - **Examine for persistence mechanisms:** Investigate if the execution is part of a larger script or command sequence. High-confidence malicious indicators would be any script or scheduled task created that routinely calls `lodctr.exe` with misleading arguments.

  ### Prioritization

  The alert severity is medium; while the affected system may not be critical, the capability of an attacker to manipulate performance monitoring poses a significant risk. The likelihood of malicious abuse is elevated due to its potential role in evading detection mechanisms, making this behavior a common tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for `lodctr.exe` to be legitimately executed by system administrators, which may lead to false positives. Ensure that logging is properly configured to capture all relevant process creation events and command lines for reliable detection. Legitimate administrative activities such as system optimization or troubleshooting may trigger the alert. A companion detection that strengthens coverage includes monitoring for unusual registry modifications or the execution of common scripts alongside `lodctr.exe`.

