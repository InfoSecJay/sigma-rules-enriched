  ---

  ### Technical Context

  This Sigma rule detects the execution of "lodctr.exe," a Windows utility used to rebuild performance counter registry values. Malicious actors might exploit this tool by supplying a malicious configuration file, potentially to overwrite legitimate performance counter settings, which can hinder monitoring efforts and facilitate evasion from detection mechanisms.

  This behavior aligns with the MITRE ATT&CK framework under the technique ID T1203 (Exploitation for Client Execution) with its focus on executing system commands that could hinder detection. The primary telemetry sources are Windows process creation logs and command-line arguments, typically sourced from Event ID 4688 in Windows Security logs or Sysmon Event ID 1. If malicious, this could lead to an attacker altering system performance metrics to mask further malicious activities.

  It is important to note that this detection alone does not confirm malicious intent; legitimate administrative activities might trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review process execution:**
    Check Windows Security Event ID 4688 or Sysmon Event ID 1 logs for instances of "lodctr.exe" executing, ensuring the command line contains parameters like " -r" that indicate rebuilding performance counters.

  - **Identify command line arguments:**
    Examine the CommandLine field for the specific execution of "lodctr.exe -r". Malicious use often involves non-standard configurations being loaded; look for unusual file paths or configurations that could indicate tampering.

  - **Assess context of execution:**
    Validate the account executing "lodctr.exe." If executed by a known administrator during scheduled maintenance, it is likely benign, while execution by an unauthorized account may require further investigation.

  - **Analyze recent performance counter issues:**
    Correlate the timing of the "lodctr.exe" execution with recent performance-related alerts or anomalies. If performance counters were previously noted as suspicious, this may indicate proactive evasion efforts by an adversary.

  - **Check for suspected file activity:**
    Investigate any newly created or modified performance counter configuration files within the registry or the system's filesystem that could be tied to the execution of "lodctr.exe." Look for file creation timestamps and known hash values for comparison.

  ---

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on system observability. The likelihood of this behavior being malicious is relevant given how it can be weaponized to obscure further malicious actions. However, legitimate administrative actions may account for some instances, necessitating thorough context investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if "lodctr.exe" executions are scripted or executed in contexts that do not generate conventional logs (e.g., from remote sessions or within automated workflows). Required log sources include Windows Security and Sysmon logs which must be consistently monitored for situational awareness. Legitimate configurations for performance counters typically occur through documented administrative processes and may trigger this alert inadvertently. A related detection for changes in performance counter values or configuration modifications can enhance monitoring efficacy.

