note: |
  ### Technical Context
  This rule detects potentially malicious child processes spawned by the Microsoft HTML Help executable (HH.exe). Attackers may leverage HH.exe as a means to evade detection while executing other executable files that could contain malicious payloads. The detection logic specifically looks for child processes originating from HH.exe that end with certain executable names known to assist in executing scripts or commands, thereby indicating possible exploitation or malicious activity.

  The threat scenario involves attackers utilizing HH.exe to launch secondary executables, such as PowerShell or WMIC, often associated with initial access or evasion techniques. This aligns with various MITRE ATT&CK tactics, particularly **Execution (TA0002)**, where adversaries run malicious code on a victim's system. Techniques relevant to this rule include **Command-Line Interface (T1059)**, which encompasses various command execution methods, and **Process Injection (T1218)**, used to run code through legitimate processes in a stealthy manner.

  The primary data sources for this detection include Windows process creation events, which log details about processes that have been started alongside their parent processes. This data provides critical evidence of any suspicious behavior involving HH.exe and related executables.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for process creation events emanating from HH.exe. Look specifically for child processes that match the specified executable names.

  - **Examine Parent-Child Relationships**: Investigate the relationship between HH.exe and its child processes. Look for execution patterns that are unusual or not typically associated with legitimate use of HH.exe.

  - **Check for Anomalous Execution Contexts**: Identify the user context in which HH.exe is running to see if it deviates from normal operational usage, which could indicate misuse or exploitation.

  - **Correlate with Threat Intelligence**: Utilize threat intelligence sources to validate the executables detected against known malicious activities or behaviors. This can aid in confirming whether the observed behavior is indicative of an active threat.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant impact on the enterprise environment. The execution of malicious child processes from a commonly utilized application like HH.exe may facilitate the deployment of malware or payloads that could compromise sensitive data or entire systems.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage exists if malicious actors utilize different parent processes or if they obfuscate their executable names, which would evade this rule. The detection logic also assumes that HH.exe will be employed in malicious scenarios, which may not always be the case. This rule requires complete process creation logging to adequately track and evaluate the activity surrounding HH.exe and its associated child processes. Regular monitoring and logging configurations must be ensured to enable effective detection.

