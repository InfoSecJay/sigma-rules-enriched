note: |
  ### Technical Context

  The rule detects the execution of suspicious child processes spawned by the Microsoft HTML Help (HH.exe) application. Attackers may leverage HTML Help files as initial access vectors, employing them to deliver payloads such as malware or information stealers. The likely objective of the attacker is to gain unauthorized access to systems or execute malicious commands in a stealthy manner.

  This behavior fits within the MITRE ATT&CK framework, specifically under the tactics of Execution and Initial Access (ID: T1059.001, T1059.003). The primary telemetry sources for this detection are Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact can range from data exfiltration to system compromise. This detection does NOT confirm that the process is always malicious; it requires further context for validation.

  ---

  ### Investigation Steps

  - **Review parent-child process relationships**: Examine Security Event ID 4688 or Sysmon Event ID 1 for HH.exe as the parent process. Investigate child processes such as CertUtil.exe or Powershell.exe. Malicious patterns often appear when these processes are executed unexpectedly with a timestamp indicating recent user interaction.

  - **Identify command-line arguments**: Verify command-line arguments of child processes linked to HH.exe. Pay attention to suspicious flags or parameters that could indicate malicious intent, such as web requests or file manipulations.

  - **Assess behavior of related processes**: Assess processes like msiexec.exe or regsvr32.exe, which often indicate installation scripts or potential harmful execution paths when launched from HH.exe, especially if there are no legitimate installation activities documented.

  - **Check for notable baseline behavior**: Document expected legitimate uses of HH.exe within your environment. For instance, troubleshooting assistance or user-help documentation for applications. Compare current alerts against this baseline.

  - **Monitor for related file artifacts**: Look for file creation or modification in known temp locations (e.g., C:\Users\%USERNAME%\AppData\Local\Temp) associated with the detected execution. Creation of unusual filenames or extensions can indicate a compromised event.

  - **Investigate potential persistence**: Examine recent changes to scheduled tasks via schtasks.exe in the event of a detection. Investigate configurations and whether they are consistent with normal administrative actions or reflect signs of persistence mechanisms used by adversaries.

  ---

  ### Prioritization

  The alert carries high severity due to the potential impact from a compromised system, particularly if it involves critical assets or data. The likelihood of malicious abuse is elevated as the methodology observed is commonly weaponized in attack vectors. The use of HH.exe as a parent process introduces a high-risk scenario for malware delivery.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming legitimate files to mask malicious activity or using code obfuscation within trusted processes. The rule relies heavily on the presence of accurate process creation logging; any missing logs could result in detection gaps. Legitimate activities, such as aid from third-party applications utilizing HH.exe for help documentation, could inadvertently trigger alerts. A related detection to consider is monitoring for unusual file creations associated with HTML Help files (T1218.010), which can strengthen overall coverage against file-based exploitation attempts.

