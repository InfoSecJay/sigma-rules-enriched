title: Potentially Suspicious Windows App Activity
id: f91ed517-a6ba-471d-9910-b3b4a398c0f3
status: test
description: Detects potentially suspicious child process of applications 
  launched from inside the WindowsApps directory. This could be a sign of a 
  rogue ".appx" package installation/execution
references:
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-12
modified: 2025-10-07
tags:
- attack.stealth
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
        # GrandParentImage|endswith: '\sihost.exe'
    ParentImage|contains: 'C:\Program Files\WindowsApps\'
  selection_susp_img:
    Image|endswith:
            # You can add more LOLBINs
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_susp_cli:
        # You can add more potentially suspicious keywords
    CommandLine|contains:
    - 'cmd /c'
    - 'Invoke-'
    - 'Base64'
  filter_optional_terminal:
    ParentImage|contains: ':\Program Files\WindowsApps\Microsoft.WindowsTerminal'
    ParentImage|endswith: '\WindowsTerminal.exe'
        # Note: to avoid FP add the default shells and profiles that your WT integrates
    Image|endswith:
    - '\powershell.exe'
    - '\cmd.exe'
    - '\pwsh.exe'
  filter_optional_sysinternals:
    ParentImage|startswith: 'C:\Program Files\WindowsApps\Microsoft.SysinternalsSuite'
    Image|endswith: '\cmd.exe'
  condition: selection_parent and 1 of selection_susp_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate packages that make use of external binaries such as Windows 
  Terminal
level: medium
note: |
  ### Technical Context

  This rule detects potentially malicious child processes spawned by applications located in the WindowsApps directory, which may indicate unauthorized execution of rogue ".appx" packages. The likely attacker objective is to exploit legitimate Windows Apps to run malicious commands or scripts, which can facilitate lateral movement, persistence, or data exfiltration. This behavior aligns with the MITRE ATT&CK technique T1071.001 - Application Layer Protocol: Web Protocols, as it may use commonly trusted applications to bypass security measures.

  The primary telemetry sources are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior poses a significant risk to system integrity, potentially leading to compromise of sensitive data or further system exploitation. However, this detection does NOT confirm that the process is inherently malicious; legitimate applications may trigger the rule due to their use of external binaries.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for the triggering process. Look for processes launched from `C:\Program Files\WindowsApps\`. Benign indicators may include known application names or expected behavior associated with trusted applications.

  - **Analyze command line arguments:** Examine the `CommandLine` field in the process creation logs for potential use of suspicious phrases such as 'cmd /c', 'Invoke-', or 'Base64'. A high-confidence malicious indicator would be if the command line contains encoded PowerShell commands or suspicious file paths.

  - **Identify parent-child relationships:** Confirm the parent process is indeed a trusted app (e.g., `sihost.exe`). If the parent process falls outside of known legitimate applications, prioritize further investigation.

  - **Document legitimate usage:** Note whether legitimate applications, such as Windows Terminal or user-defined scripts, frequently utilize these binaries. Include any evidence of benign use in your findings.

  - **Check for known malware signatures:** Cross-reference detected process hashes with known malware databases to determine if any child processes are recognized threats. Use threat intelligence monitoring tools where available.

  - **Capture additional telemetry if needed:** If there's suspicion of malicious behavior, collect execution artifacts such as created files, especially if involved with exfiltration of data or persistence mechanisms (e.g., installation of rogue services or registry modifications).

  ### Prioritization

  The alert severity is medium due to the specific behavior being indicative of potential exploitation of the Windows App environment, a method that could bypass conventional defenses. While exploitation of this nature is not common, it poses a serious risk if performed, particularly on critical systems such as servers or admin workstations.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate applications can spawn similar processes, potentially leading to false positives. Reliable detection necessitates proper configurations for logging process creations and maintaining comprehensive telemetry for Windows operating systems. Legitimate activities, such as automated scripts or administrative tasks that leverage Windows Apps, may also trigger this alert. A related detection focusing on unusual PowerShell activity, such as excessive use of `Invoke-Expression`, would enhance overall coverage and provide additional context to investigate findings.

