title: Potentially Suspicious Windows App Activity
id: f91ed517-a6ba-471d-9910-b3b4a398c0f3
status: test
description: Detects potentially suspicious child process of applications 
  launched from inside the WindowsApps directory. This could be a sign of a 
  rogue ".appx" package installation/execution
references:
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-12
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
        # GrandParentImage|endswith: '\sihost.exe'
    ParentImage|contains: 'C:\Program Files\WindowsApps\'
  selection_susp_img:
    Image|endswith:
            # You can add more LOLBINs
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_susp_cli:
        # You can add more potentially suspicious keywords
    CommandLine|contains:
    - 'cmd /c'
    - 'Invoke-'
    - 'Base64'
  filter_optional_terminal:
    ParentImage|contains: ':\Program Files\WindowsApps\Microsoft.WindowsTerminal'
    ParentImage|endswith: '\WindowsTerminal.exe'
        # Note: to avoid FP add the default shells and profiles that your WT integrates
    Image|endswith:
    - '\powershell.exe'
    - '\cmd.exe'
    - '\pwsh.exe'
  filter_optional_sysinternals:
    ParentImage|startswith: 'C:\Program Files\WindowsApps\Microsoft.SysinternalsSuite'
    Image|endswith: '\cmd.exe'
  condition: selection_parent and 1 of selection_susp_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate packages that make use of external binaries such as Windows 
  Terminal
level: medium
note: |
  ### Technical Context

  This rule detects suspicious child processes initiated from applications within the WindowsApps directory, specifically targeting potentially rogue ".appx" package installations or execution. Attackers often leverage WindowsApps for executing malicious payloads, which may circumvent traditional detection methods. The primary objective for the attacker can be to execute commands or deliver additional malicious payloads while exploiting trusted system processes. Relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and **Execution** (T1059).

  Primary telemetry sources include Windows security event logs, specifically looking for process creation events (Event ID 4688) and related logs for command-line arguments. If malicious, this behavior can lead to system compromise, data exfiltration, or lateral movement. Importantly, this detection does NOT confirm that the activity is malicious; it indicates potential for suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Review Process Creation Events**: Examine Security Event ID 4688 for the parent process, specifically looking for entries originating from `C:\Program Files\WindowsApps\`. Cross-reference the initiating user and process ID for unauthorized access patterns.

  - **Investigate Command-Line Parameters**: Analyze command-line arguments in Event ID 4688 logs for suspicious indicators such as `cmd /c`, `Invoke-`, or `Base64`. Identifiers matching these patterns should be flagged as high confidence for investigation.

  - **Identify Normal Usage Patterns**: Determine legitimate processes running from the WindowsApps directory by verifying against known applications and services in your environment. Ensure processes like `WindowsTerminal.exe` or standard system utilities are excluded from further scrutiny.

  - **Look for Evasion Techniques**: Check if common evasion techniques are in place, such as attempts to obfuscate execution (e.g., indirect calls to PowerShell). Review logs for any potentially malicious activity closely related to the detected event.

  - **Assess Asset Criticality**: Identify the role of the affected system and its importance to the organization. Escalate findings if a critical system (e.g., domain controllers, file servers) is involved.

  - **Correlate with Other Alerts**: Check for companion alerts related to unusual outbound connections, file modifications, or additional process creations that coincide with the timing of the suspicious activity. This may offer context and corroborate malicious intent.

  ### Prioritization

  This alert should be treated as medium severity due to potential impacts on critical systems if malicious activity is confirmed. The involvement of the WindowsApps directory significantly raises the likelihood of malicious abuse, as this is a less frequently monitored area prone to exploitation by attackers. Such behaviors have been observed in notable attack patterns, making them a key focus for remediation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications that utilize external binaries, potentially generating false positives. Ensure that log sources are adequately collected from all relevant systems and that logging is properly configured for comprehensive process creation details. Be aware that legitimate applications like Windows Terminal may also trigger this alert. Companion detections for unusual direct execution from application directories (e.g., AppData) could enhance overall detection effectiveness.

