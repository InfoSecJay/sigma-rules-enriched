title: Potentially Suspicious Windows App Activity
id: f91ed517-a6ba-471d-9910-b3b4a398c0f3
status: test
description: Detects potentially suspicious child process of applications launched
  from inside the WindowsApps directory. This could be a sign of a rogue ".appx" package
  installation/execution
references:
- https://news.sophos.com/en-us/2021/11/11/bazarloader-call-me-back-attack-abuses-windows-10-apps-mechanism/
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-12
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
        # GrandParentImage|endswith: '\sihost.exe'
    ParentImage|contains: 'C:\Program Files\WindowsApps\'
  selection_susp_img:
    Image|endswith:
            # You can add more LOLBINs
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_susp_cli:
        # You can add more potentially suspicious keywords
    CommandLine|contains:
    - 'cmd /c'
    - 'Invoke-'
    - 'Base64'
  filter_optional_terminal:
    ParentImage|contains: ':\Program Files\WindowsApps\Microsoft.WindowsTerminal'
    ParentImage|endswith: '\WindowsTerminal.exe'
        # Note: to avoid FP add the default shells and profiles that your WT integrates
    Image|endswith:
    - '\powershell.exe'
    - '\cmd.exe'
    - '\pwsh.exe'
  filter_optional_sysinternals:
    ParentImage|startswith: 'C:\Program Files\WindowsApps\Microsoft.SysinternalsSuite'
    Image|endswith: '\cmd.exe'
  condition: selection_parent and 1 of selection_susp_* and not 1 of filter_optional_*
falsepositives:
- Legitimate packages that make use of external binaries such as Windows Terminal
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious activities involving child processes initiated from applications located within the WindowsApps directory. The likely threat scenario involves attackers leveraging rogue ".appx" packages to execute malicious commands or payloads, possibly using techniques like BazarLoader to establish persistence or gain further access. As attackers increasingly exploit legitimate systems and applications to launch activities, recognizing such behaviors becomes crucial to detecting potential intrusions.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1203)**: Use of application vulnerabilities to evade detection.
  - **Execution (T1059)**: Utilizing various command-line interfaces and scripts to execute malicious content.

  The primary data sources for this rule are:
  - **Process creation event logs**: These logs provide insights into command executions and their corresponding initiation sources, helping to discern malicious behaviors hiding within legitimate applications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation events to identify unusual child processes spawned from applications in the WindowsApps directory, focusing on activity related to potentially malicious command-line tools.

  - **Examine Command-Line Arguments**: Inspect command-line inputs for flagged keywords, such as `cmd /c`, `Invoke-`, or `Base64`, which may indicate illicit usage of scripting or command execution techniques.

  - **Correlate with Known Good Baselines**: Determine if the identified applications and behaviors deviate from known, trusted activities in the environment to help minimize false positives stemming from legitimate application functionalities.

  - **Investigate Parent Process Relationships**: Map the parent-child relationships of processes to identify if benign-looking applications have spawned suspicious processes, ensuring to differentiate between legitimate and malicious interactions.

  ### Prioritization
  This alert should be regarded with medium severity due to the potential impact of compromised systems through rogue .appx applications, especially considering the stealthy nature of threats that leverage established software to execute malware.

  ### Blind Spots and Assumptions
  This detection may miss instances where malicious actions occur through non-standard or obfuscated approaches, especially if the malware does not utilize common Windows processes as depicted in the rule. Furthermore, the detection logic assumes that all executable activities are logged, and if logging is not configured correctly or is incomplete, crucial information may be lost. The success of this detection also relies on the presence of detailed process creation logs and potential command-line arguments captured by the operating system.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
