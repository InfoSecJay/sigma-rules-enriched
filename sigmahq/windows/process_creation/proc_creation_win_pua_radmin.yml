  ### Technical Context

  This Sigma rule detects the execution of Radmin Viewer, a remote administration tool commonly abused by attackers to gain unauthorized control over Windows machines. The likely attacker objective is to establish a remote session for further exploitation, pivoting, or lateral movement within an enterprise network. This behavior aligns with the MITRE ATT&CK technique of Remote Access Software (T1072).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which captures process creation events on Windows systems. The security impact of malicious use of Radmin Viewer is significant, allowing an adversary to control a compromised system, exfiltrate data, or conduct further attacks undetected. This detection does NOT confirm malicious activity on its own, as legitimate administrative use may also trigger this alert.

  ### Investigation Steps

  - **Check process details in logs:** Review Windows Security Event ID 4688 for process creation details, including the command line and parent process. Look for unusual command line arguments that are not typical in your environment. Confirm whether legitimate users typically execute Radmin Viewer or if it is an anomaly.

  - **Identify user and context:** Determine the user account associated with the execution event. Normal administrative users may invoke Radmin Viewer; however, unexpected executions by non-administrative users or during off-hours could indicate illicit activity.

  - **Correlate network activity:** Examine firewall or network logs (e.g., Windows Firewall Event ID 2004 or proxy logs) for outbound connections to remote IP addresses that Radmin Viewer might initiate. Malicious activity would likely show connections to known threat IPs or unusual destinations.

  - **Inspect file system for Radmin remnants:** Check the system for Radmin installation artifacts, such as the presence of the executable (`Radmin.exe`) within the standard installation directory (typically C:\Program Files (x86)\Radmin\). Ensure that no unauthorized installation occurred.

  - **Identify lateral movement behavior:** Look for related events indicating lateral movement, such as another process launching from a remote host or multiple instances of Radmin Viewer across several machines in a short time frame. This could suggest coordinated malicious activity.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact on system security and the likelihood of abuse. Radmin Viewer is a tool frequently weaponized by attackers for remote access, making any detections of its execution warrant immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate remote support activities may trigger this alert, particularly in organizations using Radmin for administration. This detection relies solely on process creation events; without corresponding network logs or endpoint detection capabilities, the context of the activity may be unclear. Companion detections, such as monitoring for remote desktop protocol (RDP) sessions (T1076), can enhance overall coverage against similar lateral movement tactics.

