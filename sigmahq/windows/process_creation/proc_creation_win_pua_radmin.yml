note: |
  ### Technical Context
  This detection rule identifies the execution of Radmin Viewer, a remote access tool that can be exploited by adversaries to gain unauthorized control over Windows machines. Radmin offers potential attackers a means to remotely manage systems, which could facilitate lateral movement within the network. The presence of this tool may indicate either benign remote administrative tasks or malicious activity if deployed without appropriate authorization.

  The relevant MITRE ATT&CK tactics associated with this detection include **Execution (T1203)** and **Lateral Movement (T1072)**, as the use of Radmin Viewer could enable an attacker to execute commands or interact with other machines within the network. Monitoring for the execution of such tools is crucial as they can be leveraged during different phases of an attack, including initial access and post-exploitation.

  Primary data sources for this detection include **process creation events**, specifically looking for the command line and characteristics of processes spawned on Windows systems. These logs can provide insight into unauthorized execution, allowing responders to correlate activity with known malicious patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:** Look for instances of 'Radmin Viewer' or 'Radmin.exe' in process creation logs to determine when and where the tool has been executed. Pay attention to the parent process to understand its context.

  - **Check for Unusual Account Activity:** Investigate the accounts that executed Radmin Viewer. Determine if the accounts were authorized for remote access and whether they show suspicious behavior, such as accessing sensitive systems or data.

  - **Analyze Network Connections:** Examine network traffic logs to identify any outbound connections initiated by Radmin Viewer. Look for unusual destinations or connections made to known malicious IP addresses.

  - **Evaluate System Auditing Settings:** Ensure that appropriate logging levels are configured on all endpoints. Verify that the security monitoring frameworks or agents are set to capture detailed process executions and command line parameters.

  ### Prioritization
  The medium severity alert for Radmin Viewer execution reflects the potential risk posed by remote access tools in an enterprise environment. While such applications can facilitate legitimate remote work, their misuse for unauthorized access significantly raises the threat level and merits immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of Radmin Viewer execution if the logging configuration is insufficient or if the tool is executed in a non-standard way (e.g., renamed or packed). The logic assumes that Radmin Viewer will be invoked under its original name and description. It requires process creation logs to be enabled and sufficiently detailed to include the necessary attributes; without these, detection may fail.

