logsource:
  product: windows
  category: process_creation
detection:
  selection1:
    CommandLine|contains:
    - 'echo '
    - 'copy '
    - 'type '
    - 'file createnew'
  selection2:
    CommandLine|contains:
    - ' C:\Windows\System32\Tasks\'
    - ' C:\Windows\SysWow64\Tasks\'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious use of the globally writable Tasks folders in Windows, specifically in the directories C:\Windows\System32\Tasks and C:\Windows\SysWow64\Tasks. Adversaries may leverage these folders to manipulate scripts or .NET applications and execute custom payloads via trusted Windows components like cscript, wscript, or mshta. The relevant MITRE ATT&CK techniques include Privilege Escalation (T1548.001) and Defense Evasion (T1574.001).

  Primary telemetry sources include process creation logs which capture command line arguments, particularly Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to the execution of unauthorized scripts or applications, compromising system integrity. Importantly, this detection does not confirm an actual compromise has occurred; instead, it indicates potential abuse of system capabilities.

  ### Investigation Steps

  - **Review command line parameters for suspicious activity:** Check Security Event ID 4688 for command lines containing 'echo ', 'copy ', or 'type ' along with file paths in C:\Windows\System32\Tasks or C:\Windows\SysWow64\Tasks. For benign activity, look for expected administrative operations such as scheduled task management using legitimate tools.

  - **Check for known malicious indicators:** Look for creation or modification of files in C:\Windows\System32\Tasks and C:\Windows\SysWow64\Tasks. Validate if any files exhibit unusual naming conventions or recent timestamps unrelated to normal operations.

  - **Verify the context of process execution:** Identify the parent process of any suspicious command lines extracted from Event ID 4688. Malicious activity often has unusual parent-child relationships, such as non-interactive sessions spawning these commands.

  - **Assess the purpose and functionality of modified tasks:** Identify any scheduled tasks that are not part of the standard OS configuration through the Task Scheduler GUI or PowerShell commands, focusing on their actions and triggers. Typical legitimate usage should align with system maintenance or updates.

  - **Monitor network activity following detection:** Look for outbound connections or unusual data flows related to newly created or modified tasks, which may indicate exfiltration attempts or command and control callbacks. Validate against normal network baselines.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and user data if an adversary successfully manipulates task execution. The likelihood of abuse is significant, as these folders are commonly exploited for persistence and further execution of malicious payloads, coinciding with known tactics and techniques in the threat landscape.

  ### Blind Spots and Assumptions

  Detection may be influenced by legitimate administrative activities, such as scheduled task modifications by IT staff, which could trigger the rule. Evasion techniques, such as using alternate scripting methods or leveraging non-standard paths, may bypass this detection. Reliable detection requires comprehensive logging of process creation and access to Task Scheduler events. Companion detections include monitoring for unauthorized modifications to critical Windows folders or logs pertaining to script executions (e.g., Event ID 4104 for PowerShell logs), which bolster comprehensive visibility into potential threats.

