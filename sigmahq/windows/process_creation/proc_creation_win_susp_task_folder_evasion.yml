- attack.t1574.001
logsource:
  product: windows
  category: process_creation
detection:
  selection1:
    CommandLine|contains:
    - 'echo '
    - 'copy '
    - 'type '
    - 'file createnew'
  selection2:
    CommandLine|contains:
    - ' C:\Windows\System32\Tasks\'
    - ' C:\Windows\SysWow64\Tasks\'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the manipulation of the Tasks folder within the Windows System32 and SysWow64 directories, targeting globally writable paths to execute custom commands using script hosts like cscript, wscript, regsvr32, mshta, or eventvwr. The likely attacker objective is privilege escalation or persistence through the execution of unauthorized scripts or applications. This behavior maps to the MITRE ATT&CK techniques for Persistence (T1547.001), Abuse Elevation Control Mechanism (T1203), and Execution (T1203).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1 for detailed command line activity. If malicious, this activity can result in unauthorized system manipulation or data exfiltration. Importantly, this detection does not confirm the legitimacy of the command execution nor does it indicate that the execution was successful or harmful by itself.

  ### Investigation Steps

  - **Verify command execution context:**
    Review Security Event ID 4688 for the process creation events related to paths `C:\Windows\System32\Tasks\` or `C:\Windows\SysWow64\Tasks\`, checking for unusual parent processes like explorer.exe or cmd.exe that may indicate scripting misuse.

  - **Analyze command line parameters:**
    Examine the command line parameters for events containing 'echo ', 'copy ', 'type ', or 'file createnew'. Benign commands for system maintenance should not involve writing or executing scripts from the Tasks directory.

  - **Correlate with user behavior:**
    Check the account used for running the command against the User Activity logs. A legitimate user will likely be performing tasks typical to their role without interaction with system directories.

  - **Look for high-confidence malicious indicators:**
    Identify if the command contains the execution of `mshta.exe`, `regsvr32.exe`, or similar tools that are often exploited by attackers for execution and persistence. Capture Event ID 4688 associated with these commands as strong indicators of malicious activity.

  - **Review for potential file creation/exfiltration:**
    Investigate if any new files were created in the Tasks directory or associated with the command. Check timestamps and file paths to validate against legitimate task scheduling and automation processes.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and the likelihood of an adversary abusing these globally writable paths for malicious purposes. The exploitability of the Tasks folder makes this behavior a commonly weaponized technique in targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection may miss events if logs are not configured to capture all process creation activities or if log retention is insufficient. An adversary may modify file permissions or use less common scripting utilities to evade detection. Legitimate administrative activities, such as scheduled task configurations, may also generate similar alerts. Companion detections could include monitoring for abnormal patterns in scheduled task modifications or executions that help strengthen coverage against persistence and execution threats.

