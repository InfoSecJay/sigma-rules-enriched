logsource:
  product: windows
  category: process_creation
detection:
  selection1:
    CommandLine|contains:
    - 'echo '
    - 'copy '
    - 'type '
    - 'file createnew'
  selection2:
    CommandLine|contains:
    - ' C:\Windows\System32\Tasks\'
    - ' C:\Windows\SysWow64\Tasks\'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  The "Tasks Folder Evasion" detection rule aims to identify potentially malicious behavior related to the exploitation of globally writable paths in the Windows operating system's Task Scheduler directories, specifically `C:\Windows\System32\Tasks\` and `C:\Windows\SysWow64\Tasks\`. Attackers may use these paths to execute scripts or load custom assemblies through common Windows scripting engines like `cscript`, `wscript`, or utilities like `regsvr32` and `mshta`. This could be part of an operational strategy to establish persistence, evade defenses, or escalate privileges within a compromised system.

  In this scenario, an attacker would typically seek to execute arbitrary code without raising alarms, potentially leading to further privilege escalation and lateral movement within the network. Key techniques associated with this activity include **T1574.001** (Registry Run Keys / Startup Folder), which signifies an approach to achieve persistence, and overall tactics such as **Defense Evasion**, **Persistence**, and **Execution**.

  The primary data sources for identifying these activities are **process creation events**, which log details about the command lines used to execute processes. Analyzing the command line arguments will be crucial in determining whether malicious intent is present.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate recent entries in the process creation logs for command lines that include suspicious keywords like "echo", "copy", or paths leading to `C:\Windows\System32\Tasks\` and `C:\Windows\SysWow64\Tasks\`. Pay close attention to the timing and associated user accounts.

  - **Analyze Command Line Arguments**: If relevant process creation events are detected, collect and analyze the command line arguments used. Look for clear indicators of abuse, such as attempts to create or modify task definitions through scripting.

  - **Check Task Scheduler Entries**: Query the Task Scheduler for new or modified tasks that may not follow standard operational procedures. Review their properties and execution times for anomalies that may indicate unauthorized alterations.

  - **Investigate Associated Processes**: Upon finding suspicious command executions, follow the trail by examining parent-child relationships of processes to identify how the tasks were initiated and whether any other processes may have been compromised.

  ### Prioritization
  The alert's severity is rated high due to the potential for significant operational impact. Successful exploitation of these writable paths can lead to persistent threats within the environment, enabling attackers to maintain access even after attempts to remediate the situation.

  ### Blind Spots and Assumptions
  This detection mechanism may miss techniques that do not involve the specified command patterns or those that employ alternative methods for task creation and manipulation. The logic assumes that process creation logs are enabled and sufficiently detailed, capturing the necessary command line arguments for analysis. Additionally, if system protections or logging configurations are not properly set up, key evidence for these activities may be lost, reducing the reliability of the detection.

