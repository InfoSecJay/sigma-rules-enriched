note: |
  ### Technical Context
  This rule detects the use of `regini.exe` to import an alternate data stream (ADS) and modify Windows registry keys. Attackers may leverage this technique to implement persistence mechanisms, modify security settings, or evade detection by hiding changes to the registry under the guise of legitimate administrative tasks. The use of alternate data streams is a common tactic employed by adversaries to conceal malicious artifacts from standard file system scanning and inspection.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Persistence** (TA0003) through the use of **Registry Run Keys / Startup Folder** (T1112) and **Defense Evasion** (TA0005) by hiding malicious activity using data streams. These techniques represent a significant risk as they enable persistent access while minimizing visibility.

  Primary data sources for this detection include process creation logs from Windows systems, which capture command-line arguments and original file names, providing key insights into the actions being performed by programs.

  ### Investigation Steps
  - **Collect Process Creation Logs:** Gather logs related to process creation to identify instances of `regini.exe` execution and analyze the command-line parameters being used, particularly for patterns indicating ADS usage.

  - **Review Registry Modifications:** Analyze recent changes to the Windows registry, focusing on keys that may indicate persistence mechanisms, such as Run keys or other areas frequently targeted by attackers.

  - **Correlate with Threat Intelligence:** Cross-reference the observed activity with known threat intelligence to determine if there are associated malware or tools that utilize `regini.exe` for malicious purposes.

  - **Assess File Integrity and Behavior:** Inspect file system integrity and behavior surrounding `regini.exe`’s execution to uncover any related suspicious files or abnormal network activity that may indicate further malicious intentions.

  ### Prioritization
  This alert is prioritized as high severity due to the potential impact of unauthorized modifications to the registry, which can lead to undetected persistence and elevated privileges for an attacker. The likelihood of such behavior indicating malicious activity is significantly elevated based on the use of `regini.exe`, a known tool for altering system configurations.

  ### Blind Spots and Assumptions
  This detection may not cover all potential ways attackers could exploit registry modifications, particularly if they use alternative methods or tools outside of `regini.exe`. The alert also assumes `regini.exe` will be executed in a context that is logged, which may not always be the case in environments with restrictive logging configurations. To ensure optimal detection, appropriate process creation logging must be enabled and configured to capture all relevant parameters, including command-line arguments.

