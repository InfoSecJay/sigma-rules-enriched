note: |
  ### Technical Context

  This Sigma rule detects the execution of `regini.exe`, specifically when it is used to import changes from an alternate data stream (ADS) to modify Windows registry keys. This behavior can indicate an attacker’s objective to persistently embed malicious configurations in the registry, potentially to facilitate further exploitation or conceal their presence. The relevant MITRE ATT&CK tactic is Persistence (TA0003) and the technique is Registry Run Keys / Startup Folder (T1112).

  The primary telemetry source is Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which track the execution of processes. If this behavior is malicious, it could allow an adversary to ensure that their code runs at startup or persists even after reboots. It is crucial to note that this detection does NOT, by itself, confirm an attack; there may be legitimate reasons for using `regini.exe`.

  ### Investigation Steps

  - **Review process creation logs:** Look for Security Event ID 4688 and Sysmon Event ID 1 involving `regini.exe`. Check for the `CommandLine` field for unusual parameters and paths that could indicate malicious usage.

  - **Analyze the CommandLine arguments:** Investigate entries that match the regex pattern `:[^ \\]` in the `CommandLine` field to identify alternate data stream usage. Highlight any entries with unexpected or unauthorized paths.

  - **Identify legitimate usage:** Determine if any known administrative tasks or configuration management activities are associated with `regini.exe`. Documenting scheduled tasks or documented maintenance activities from IT can provide context to benign uses.

  - **Check registry modifications:** Examine the Windows Registry for changes made by the corresponding `regini.exe` execution, particularly in locations like `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`. Look for new or modified keys associated with the process.

  - **Correlate with other indicators:** Review logs from other security tools such as EDR solutions or network logging tools to find related suspicious actions that coincide with the execution of `regini.exe`, which might increase confidence in a malicious assessment.

  - **Confirm system role impact:** Consider the role of the affected system (e.g., critical servers versus user endpoints). A `regini.exe` execution on a domain controller may warrant higher scrutiny compared to a non-critical system.

  ### Prioritization

  This alert is classified as high severity due to the potential for impacting critical infrastructure through unauthorized registry modifications. The likelihood of malicious abuse is significant, as the use of `regini.exe` in this context often aligns with known persistence techniques employed by adversaries. Such registry modifications are commonly weaponized in advanced threat environments.

  ### Blind Spots and Assumptions

  The rule is limited as legitimate administrative tasks may also trigger the alert, leading to potential false positives. Detection relies on the availability and proper configuration of Windows security logging, particularly for process creation and registry modification events. An associated detection that can enhance coverage is monitoring for unusual registry access patterns, which may provide context around the authentication and timing of `regini.exe` executions.

