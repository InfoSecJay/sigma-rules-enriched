title: Scheduled Task Creation Via Schtasks.EXE
id: 92626ddd-662c-49e3-ac59-f6535f12d189
status: test
description: Detects the creation of scheduled tasks by user accounts via the "schtasks"
  utility.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
author: Florian Roth (Nextron Systems)
date: 2019-01-16
modified: 2025-10-22
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
- attack.s0111
- car.2013-08-001
- stp.1u
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: ' /create '
  filter_main_system_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_optional_msoffice:
        #  schtasks.exe /Create /tn "Microsoft\Office\Office Performance Monitor" /XML "C:\ProgramData\Microsoft\ClickToRun\{9AC08E99-230B-47e8-9721-4577B7F124EA}\Microsoft_Office_Office Performance Monitor.xml"
    ParentImage:
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    Image:
    - 'C:\Windows\System32\schtasks.exe'
    - 'C:\Windows\SysWOW64\schtasks.exe'
    CommandLine|contains: 'Microsoft\Office\Office Performance Monitor'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative activity
- Software installation
level: low
note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks on Windows systems using the `schtasks.exe` utility. Scheduled tasks can automate various operations, including running scripts or executables at specified times. While this functionality can support legitimate administrative activities, it is also exploited by attackers to maintain persistence, potentially executing malicious payloads even after a system reboot. The objectives of such an action often include establishing a backdoor, enabling further exploitation, or executing malware at regular intervals.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior are **Execution (T1203)**, specifically **Scheduled Task/Job (T1053.005)** and persistence mechanisms such as **Windows Service (T1543.002)**. In enterprise environments, primary data sources for this detection include process creation events, which capture command-line activity and the user context in which tasks are executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the logs for instances of `schtasks.exe`, paying particular attention to the command line for `/create` arguments. Analyze the user context to identify any unauthorized or unusual account activity.

  - **Assess Scheduled Task Configurations**: Investigate the properties of newly created scheduled tasks. Look for tasks scheduled to run scripts or executables in non-standard locations, or with names that do not follow organizational naming conventions.

  - **Correlate with User Activity**: Cross-reference the time of scheduled task creation with user login times and other actions taken by the associated user account. Identify potential anomalies indicative of compromise.

  - **Check for Common Indicators of Compromise**: Look for patterns of behavior usually associated with malicious task creation, such as tasks related to known malware, or those set to run at startup that do not match typical operational practices.

  ### Prioritization
  This alert is considered low severity due to its potential for both legitimate use (administrative tasks) and malicious activity. However, the likelihood of misuse increases if anomalous patterns are observed in conjunction with other security alerts or user behaviors.

  ### Blind Spots and Assumptions
  There may be gaps in detection if `schtasks.exe` is invoked through obfuscated methods or alternative utilities that perform similar functions without utilizing native Windows APIs. The detection logic assumes direct invocation of `schtasks.exe` with clear command line arguments, which may not capture all malicious use. Effective monitoring requires process creation logs with comprehensive coverage of the Windows event log to ensure this alert is actionable in all environments.

