title: Scheduled Task Creation Via Schtasks.EXE
id: 92626ddd-662c-49e3-ac59-f6535f12d189
status: test
description: Detects the creation of scheduled tasks by user accounts via the 
  "schtasks" utility.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
author: Florian Roth (Nextron Systems)
date: 2019-01-16
modified: 2025-10-22
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
- attack.s0111
- car.2013-08-001
- stp.1u
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: ' /create '
  filter_main_system_user:
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_optional_msoffice:
        #  schtasks.exe /Create /tn "Microsoft\Office\Office Performance Monitor" /XML "C:\ProgramData\Microsoft\ClickToRun\{9AC08E99-230B-47e8-9721-4577B7F124EA}\Microsoft_Office_Office Performance Monitor.xml"
    ParentImage:
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    Image:
    - 'C:\Windows\System32\schtasks.exe'
    - 'C:\Windows\SysWOW64\schtasks.exe'
    CommandLine|contains: 'Microsoft\Office\Office Performance Monitor'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative activity
- Software installation
level: low
note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks on Windows systems using the "schtasks.exe" utility. Attackers often use scheduled tasks to maintain persistence or automate malicious activities related to lateral movement, privilege escalation, or malware execution. The relevant MITRE ATT&CK techniques are "Scheduled Task/Job" (T1053.005) and "Command-Line Interface" (T1059.002). Primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon event logs for detailed command-line activity. If malicious, this behavior may allow an adversary to execute arbitrary code at specified intervals or system events. This detection does NOT confirm malicious intent on its own, as legitimate administrative tasks and application installations may trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for instances of "schtasks.exe" and examine the command line parameters used. Look for unusual task names or contexts that suggest malicious activity, e.g., tasks created with generic or obfuscated names.

  - **Correlate with previous user activity:** Investigate the account creating the tasks via Event ID 4624 to determine if this account is legitimate and has a trusted history of activity. Accounts with no previous administrative behavior may suggest a breach.

  - **Examine command line arguments:** Analyze command line inputs to "schtasks.exe." Malicious inputs often contain uncommon task names (e.g., non-human-readable strings) or point to unusual executables or scripts not typically used for legitimate scheduled tasks.

  - **Look for other indicators of compromise:** Validate whether additional malicious indicators exist, such as unexpected file creations in system directories, as viewed through Sysmon Event ID 11 (file creation time), particularly in paths related to common malware activities.

  - **Identify expected behavior:** Review regular scheduled tasks on the system to establish a baseline. Administratively created tasks typically have recognizable naming conventions and known paths, e.g., vendor-specific update tasks.

  - **Review file access or data movements:** Check for logs indicating file access or movements (Event ID 4663) correlated with the time of task creation to identify any suspicious post-creation behavior, such as file deletions or unauthorized data exfiltration.

  ### Prioritization

  This alert should be prioritized as moderate severity, particularly on systems with elevated privileges or critical business functions. Scheduled task creation is a common technique exploited by attackers to maintain persistence, which raises the likelihood of malicious use, especially if the activity comes from non-administrative users or automated scripts.

  ### Blind Spots and Assumptions

  Detection may be limited by user-defined tasks that are legitimate, resulting in false positive alerts. Accurate detection requires comprehensive logging of process creation and command line parameters. It is crucial to tune log sources to minimize benign alerts, particularly as administrative tasks or application installations can trigger this detection. A related detection to consider is the unusual creation or modification of executables (e.g., via Sysmon Event ID 1), which can help correlate with potentially malicious task creations.

