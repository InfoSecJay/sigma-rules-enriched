title: Remote Access Tool - AnyDesk Piped Password Via CLI
id: b1377339-fda6-477a-b455-ac0923f9ec2c
status: test
description: Detects piping the password to an anydesk instance via CMD and the '--set-password'
  flag.
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-28
modified: 2023-03-05
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
            # Example: C:\WINDOWS\system32\cmd.exe /C cmd.exe /c echo J9kzQ2Y0qO |C:\ProgramData\anydesk.exe --set-password
    - '/c '
    - 'echo '
    - '.exe --set-password'
  condition: selection
falsepositives:
- Legitimate piping of the password to anydesk
- Some FP could occur with similar tools that uses the same command line '--set-password'
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the AnyDesk remote access tool, specifically when a password is being piped via the command line using the `--set-password` flag. This behavior may indicate an attempt by an attacker to establish unauthorized persistent access to a compromised system. Attackers often use remote access tools for command and control (C2) to manipulate and manage infected devices, and setting a password allows them to regain access without needing to exploit the system again.

  In this threat scenario, the attacker may aim to maintain long-term access to the victim's environment without detection, facilitating operations such as data exfiltration or lateral movement within the network. Relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) associated with techniques such as **Remote Access Tools** (T1219) and more specifically **Remote Access Tool - AnyDesk** (T1219.002). The primary data source for this detection is process creation logs on Windows systems, which provide visibility into command line arguments used in executing applications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Gather process creation events from endpoints to identify instances where AnyDesk is invoked with the `--set-password` flag, paying close attention to command line arguments.
  - **Analyze Network Traffic**: Inspect outgoing connections and payloads to check for AnyDesk-related traffic targeting external IP addresses, which may confirm unauthorized remote access attempts.
  - **Evaluate User Behavior**: Investigate the user accounts that executed the AnyDesk command for any signs of unusual behavior, especially those with elevated privileges or those not typically associated with remote access tools.
  - **Correlate with Other Alerts**: Check for additional alerting on lateral movement, privilege escalation, or abnormal access patterns to ascertain if this behavior correlates with other malicious activity that may indicate a broader compromise.

  ### Prioritization
  The alert is assigned a medium severity due to the potential impact of persistent unauthorized access facilitated by the use of AnyDesk, combined with the likelihood of such tools being misused in corporate environments for nefarious purposes.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage regarding legitimate use cases, as legitimate users may also use command line piping for AnyDesk for benign purposes, leading to possible false positives. Additionally, the rule assumes that the logging configurations for command line arguments are enabled on all relevant endpoints. If process creation logging is not configured correctly or if similar tools (that may use different command line parameters) are employed, this detection might not trigger. Effective detection is reliant on comprehensive logging and monitoring of endpoint activities.

