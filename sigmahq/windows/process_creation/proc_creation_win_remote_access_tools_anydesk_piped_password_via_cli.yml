title: Remote Access Tool - AnyDesk Piped Password Via CLI
id: b1377339-fda6-477a-b455-ac0923f9ec2c
status: test
description: Detects piping the password to an anydesk instance via CMD and the 
  '--set-password' flag.
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-28
modified: 2023-03-05
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
            # Example: C:\WINDOWS\system32\cmd.exe /C cmd.exe /c echo J9kzQ2Y0qO |C:\ProgramData\anydesk.exe --set-password
    - '/c '
    - 'echo '
    - '.exe --set-password'
  condition: selection
falsepositives:
- Legitimate piping of the password to anydesk
- Some FP could occur with similar tools that uses the same command line 
  '--set-password'
level: medium
note: |
  ### Technical Context

  This detection rule identifies instances where an attacker is utilizing the AnyDesk remote access tool by piping a password into its command line interface through the `--set-password` flag. This technique can be used by threat actors to facilitate remote access to compromised systems, supporting further exploitation. The relevant MITRE ATT&CK tactic is Command and Control (T1219.002), specifically focused on remote access tools.

  The primary telemetry source for this detection originates from Windows process creation logs, particularly focusing on the command line executables that indicate the execution of AnyDesk with manipulated parameters. If successful, this behavior would allow an adversary to maintain persistent access to the device. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate users may also employ similar command line configurations.

  ### Investigation Steps

  - **Check command-line arguments:** Review Security Event ID 4688 and Sysmon Event ID 1 on the impacted host for processes invoking AnyDesk with the `--set-password` flag. Look for command lines that match the pattern: `cmd.exe /C cmd.exe /c echo [password] | C:\ProgramData\anydesk.exe --set-password`.

  - **Identify user context:** Analyze the user account associated with the process creation. If the account is a known administrative user or has recently exhibited anomalous behavior, it may indicate malicious intent.

  - **Verify installation path:** Inspect the AnyDesk installation path. Typically, it should be located at a standard directory (e.g., `C:\Program Files (x86)\AnyDesk\`). Any deviations may suggest a malicious variant of the application.

  - **Correlate with network activity:** Cross-reference the process creation with network traffic logs for unusual outbound connections or communication with known malicious IP addresses associated with remote access tools to confirm potential malicious command and control.

  - **Evaluate legitimate use cases:** Determine if authorized personnel regularly use AnyDesk for legitimate remote support operations and check for documented procedures. Unexpected usage patterns after hours may warrant further scrutiny.

  - **Review other processes:** Monitor for any other unusual command-line activities or processes executed around the same timeframe that may indicate lateral movement or additional system compromise, such as other remote access tools or credential dumping tools.

  ### Prioritization

  This alert is categorized with medium severity due to the potential impact on compromised systems, especially if AnyDesk is misused for unauthorized remote access. The likelihood of malicious exploitation is moderate, given the specific command-line indicators utilized in the rule. Remote access tools, particularly those like AnyDesk, are commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Potential detection limitations include adversaries using similar command-line structures with other benign applications or legitimate administrative use of AnyDesk for support purposes, which may trigger false positives. The effective monitoring of this rule relies on comprehensive logging from the Windows process creation settings. Related detections could include monitoring for modifications to user access permissions or other Command and Control behaviors to enhance overall threat coverage.

