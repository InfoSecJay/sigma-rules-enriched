detection:
  selection_img:
  - Image|endswith: '\ksetup.exe'
  - OriginalFileName: 'ksetup.exe'
  selection_cli:
    CommandLine|contains: ' /ChangePassword '
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of `ksetup.exe` for changing the password of the logged-on user. An attacker might exploit this functionality to perform password changes that allow them to maintain or gain unauthorized access to an account, especially when attempting to pivot within the network or evade detection. This activity is relevant to the MITRE ATT&CK technique for credential dumping (T1003) and privilege escalation (T1068). The primary telemetry source for this detection is Windows process creation logs, specifically those detailing command-line operations associated with `ksetup.exe`. If malicious, this behavior could lead to unauthorized access to sensitive resources. However, this detection does NOT confirm that the password change was malicious by itself; it merely indicates that a password change occurred via this tool.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Event ID 4688 for process creation of `ksetup.exe`. Look for command-line arguments containing `/ChangePassword`. A high-confidence malicious indicator is the presence of unexpected or unauthorized user accounts in the logs.

  - **Assess account context**: Validate the account context under which `ksetup.exe` was executed. Cross-reference with Active Directory logs (Event ID 4624) to see if the user has a history of legitimate behavior or if the account seems newly compromised, indicated by unusual login patterns.

  - **Examine command-line arguments**: Review the full command line in the process creation logs for any additional suspicious flags or parameters. Legitimate use will typically involve clear connection to organizational accounts, while unusual parameters may indicate adversarial behavior.

  - **Check for related account changes**: Look in Security Event ID 4723 for any other password changes or security modifications occurring closely before or after the execution of `ksetup.exe`. Such correlational examination can indicate a broader scope of activity.

  - **Identify host activity**: Evaluate the role of the impacted host. If it’s a critical system, escalated scrutiny is necessary as this could represent a higher-value target. Assess network logs for any anomalous inbound/outbound traffic patterns following the execution.

  ### Prioritization

  This alert should be considered medium severity in an enterprise context. The potential impact is significant if an account is exploited maliciously, particularly in systems critical to operations. While credential manipulation is a common tactic for attackers, the likelihood of this specific behavior being weaponized depends on the attacker’s sophistication and operational goals.

  ### Blind Spots and Assumptions

  There are limitations in detecting this behavior since legitimate users may also change their passwords using `ksetup.exe`, especially in environments with varied operational policies. Successful detection requires Event ID 4688 and potential command-line logging configurations to be enabled. Additionally, institutional password policies may trigger this alert during regular administrative activities, such as routine password resets. Companion detections, such as monitoring for lateral movement attempts or changes to sensitive group memberships, can enhance coverage against this threat.

