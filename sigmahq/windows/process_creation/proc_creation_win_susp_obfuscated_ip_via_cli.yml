title: Obfuscated IP Via CLI
id: 56d19cb4-6414-4769-9644-1ed35ffbb148
status: test
description: Detects usage of an encoded/obfuscated version of an IP address (hex,
  octal, etc.) via command line
references:
- https://h.43z.one/ipconverter/
- https://twitter.com/Yasser_Elsnbary/status/1553804135354564608
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
date: 2022-08-03
modified: 2023-11-06
tags:
- attack.discovery
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\ping.exe'
    - '\arp.exe'
  selection_ip_1:
    CommandLine|contains:
    - ' 0x'
    - '//0x'
    - '.0x'
    - '.00x'
  selection_ip_2:
    CommandLine|contains|all:
    - 'http://%'
    - '%2e'
  selection_ip_3:
        # http://81.4.31754
  - CommandLine|re: 'https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}'
        # http://81.293898
  - CommandLine|re: 'https?://[0-9]{1,3}\.0[0-9]{3,7}'
        # http://1359248394
  - CommandLine|re: 'https?://0[0-9]{3,11}'
        # http://0121.04.0174.012
  - CommandLine|re: 'https?://(0[0-9]{1,11}\.){3}0[0-9]{1,11}'
        # http://012101076012
  - CommandLine|re: 'https?://0[0-9]{1,11}'
        # For octal format
  - CommandLine|re: ' [0-7]{7,13}'
  filter_main_valid_ip:
    CommandLine|re: 'https?://((25[0-5]|(2[0-4]|1\d|[1-9])?\d)(\.|\b)){4}'
  condition: selection_img and 1 of selection_ip_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of obfuscated IP addresses in command line arguments, which may indicate attempts to evade detection or carry out malicious activities. Attackers often encode or obfuscate IP addresses to circumvent network security mechanisms, hide malicious activity, or create confusion during investigations. The ability to execute commands with obfuscated IPs is commonly associated with behaviors linked to reconnaissance or lateral movement within a network.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Discovery**: The attacker may be attempting to gather system or network information without being detected (T1083, T1012).
  - **Command and Control**: Obfuscated IPs could be used to communicate with malicious infrastructure (T1071).

  Key data sources for detecting this activity are process creation events from the operating system, which can reveal command lines used during executions. Additional sources may include network traffic logs to correlate with command execution for patterns of traffic signaling.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Review logs from the endpoint for process creation events, focusing specifically on the command line arguments. Look for any executions of common tools like `ping.exe` or `arp.exe` with potentially obfuscated IP addresses.
  - **Check for Network Traffic Correlation**: Analyze network traffic that corresponds with process creations that have encoded IPs. Look for unusual outbound connections to newly contacted IPs or domain names.
  - **Examine User Behavior**: Investigate the account associated with the command execution for any unusual activities prior to this event. Consider user history and potential unauthorized privilege escalations.
  - **Cross-reference with Threat Intelligence**: Look for known malicious infrastructures that may correlate with the obfuscated IP patterns. Utilize threat intelligence feeds to assess whether the obfuscated IPs suggest connection to known bad actors.

  ### Prioritization
  This alert is rated medium severity as it indicates potentially unauthorized recon activities that may precede a larger compromise or data exfiltration effort. While obfuscated IP usage could be benign in certain environments, its occurrence under specific tools and execution contexts warrants prompt investigation.

  ### Blind Spots and Assumptions
  This rule may miss obfuscation techniques that are not covered by the detection logic, such as other forms of encoding not related to IP addresses. It assumes that all relevant process creation events are logged and accessible. Without proper logging configurations, including command line arguments, detection may be incomplete. Analysts should ensure that logging is set up to capture detailed command line inputs for effective detection.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
