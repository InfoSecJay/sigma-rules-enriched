title: Obfuscated IP Via CLI
id: 56d19cb4-6414-4769-9644-1ed35ffbb148
status: test
description: Detects usage of an encoded/obfuscated version of an IP address 
  (hex, octal, etc.) via command line
references:
- https://h.43z.one/ipconverter/
- https://twitter.com/Yasser_Elsnbary/status/1553804135354564608
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
date: 2022-08-03
modified: 2026-03-16
tags:
- attack.discovery
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\ping.exe'
    - '\arp.exe'
  selection_ip_1:
    CommandLine|contains:
    - ' 0x'
    - '//0x'
    - '.0x'
    - '.00x'
  selection_ip_2:
    CommandLine|contains|all:
    - 'http://%'
    - '%2e'
  selection_ip_3:
        # http://81.4.31754
  - CommandLine|re: 'https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}'
        # http://81.293898
  - CommandLine|re: 'https?://[0-9]{1,3}\.0[0-9]{3,7}'
        # http://1359248394
  - CommandLine|re: 'https?://0[0-9]{3,11}'
        # http://0121.04.0174.012
  - CommandLine|re: 'https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}'
        # http://012101076012
  - CommandLine|re: 'https?://0[0-9]{1,11}'
        # For octal format
  - CommandLine|re: ' [0-7]{7,13}'
  filter_main_valid_ip:
    CommandLine|re: 'https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}'
  condition: selection_img and 1 of selection_ip_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of command-line interfaces to call system utilities (such as `ping.exe` and `arp.exe`) with obfuscated IP addresses. Attackers often use encoded or obfuscated formats (like hex or octal) to hide malicious activity and avoid detection while conducting reconnaissance or network scanning. This behavior aligns with the MITRE ATT&CK tactic of **Discovery** (TA Discovery) and technique **Network Service Scanning** (T1046).

  The primary telemetry source involves process creation logs on Windows systems, specifically those reported through Security Event ID 4688. If the detected behavior is malicious, it could indicate preparation for data exfiltration, lateral movement, or scanning for vulnerable services. However, this detection does NOT confirm the intent of the command (malicious or benign) without additional context.

  ### Investigation Steps

  - **Review the command line arguments of the process:** Identify if the arguments contain obfuscated IP patterns, such as `0x` or octal numbers, within the process creation logs (Security Event ID 4688, command line field). Look for specific keywords like `ping.exe` or `arp.exe` which may indicate scanning behavior.

  - **Cross-check the originating IP address:** Validate the legitimacy of the source IP of the request related to the detected obfuscated IP usage against known IP reputation databases. Malicious IP addresses may have a history of exploitation or compromise.

  - **Assess the process context:** Determine if the invoking process had a legitimate administrative context. For example, if `ping.exe` was executed by an unprivileged user or on a workstation, this behaviour might be suspicious, whereas it could be expected if initiated by a network administrator.

  - **Identify established baseline activity:** Establish what normal command line usage looks like in your environment for `ping.exe` and `arp.exe`. Note the typical IP address formats seen and common use cases for these commands to distinguish benign from potentially malicious usage.

  - **Investigate surrounding events for lateral movement:** Review recent authentication and network traffic events for unusual user activity or account usage associated with the identified obfuscated command line execution, particularly focusing on failed login events or non-standard access patterns.

  - **Look for extensive automated scanning patterns:** Identify if there were multiple processes invoking the obfuscated IP within a short time frame, which could indicate scripted or automated attacks. These would typically show up in the same logs as anomalies in command line execution.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on network operations if malicious. The likelihood of abuse is significant; obfuscation is a common tactic employed by adversaries during reconnaissance or exploitation phases. While not every instance of obfuscated IP usage signals malicious intent, it warrants immediate investigation due to the nature of the tools involved.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for situational awareness gaps; legitimate scripts or tools may utilize similar obfuscation techniques for legitimate purposes. Reliability depends on effective logging configurations in place that capture all required command execution details. Additionally, some benign activities, such as scripted monitoring or custom network tools using obfuscated IPs, could inadvertently trigger alerts. The companion detection of unusual outbound connections can enhance coverage, indicating where the obfuscated traffic may lead to any known malicious domains or IPs.

