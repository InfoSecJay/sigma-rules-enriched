title: Obfuscated IP Via CLI
id: 56d19cb4-6414-4769-9644-1ed35ffbb148
status: test
description: Detects usage of an encoded/obfuscated version of an IP address 
  (hex, octal, etc.) via command line
references:
- https://h.43z.one/ipconverter/
- https://twitter.com/Yasser_Elsnbary/status/1553804135354564608
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
date: 2022-08-03
modified: 2023-11-06
tags:
- attack.discovery
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\ping.exe'
    - '\arp.exe'
  selection_ip_1:
    CommandLine|contains:
    - ' 0x'
    - '//0x'
    - '.0x'
    - '.00x'
  selection_ip_2:
    CommandLine|contains|all:
    - 'http://%'
    - '%2e'
  selection_ip_3:
        # http://81.4.31754
  - CommandLine|re: 'https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}'
        # http://81.293898
  - CommandLine|re: 'https?://[0-9]{1,3}\.0[0-9]{3,7}'
        # http://1359248394
  - CommandLine|re: 'https?://0[0-9]{3,11}'
        # http://0121.04.0174.012
  - CommandLine|re: 'https?://(0[0-9]{1,11}\.){3}0[0-9]{1,11}'
        # http://012101076012
  - CommandLine|re: 'https?://0[0-9]{1,11}'
        # For octal format
  - CommandLine|re: ' [0-7]{7,13}'
  filter_main_valid_ip:
    CommandLine|re: 'https?://((25[0-5]|(2[0-4]|1\d|[1-9])?\d)(\.|\b)){4}'
  condition: selection_img and 1 of selection_ip_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of obfuscated versions of IP addresses in command-line arguments, which can indicate an attempt by an adversary to mask communications or enumerate network resources stealthily. The likely attacker objective is to bypass network security mechanisms that rely on analyzing legible IP addresses to prevent unauthorized access or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of "Discovery" (TA0007), specifically techniques such as "Network Service Scanning" (T1046) and "Application Layer Protocol" (T1071).

  The primary telemetry sources for this detection include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which record executed processes and their associated command-line parameters. If malicious, such activities could enable lateral movement, data exfiltration, or establishment of command and control (C2) channels. Importantly, this detection alone does NOT confirm malicious intent; it merely signals that obfuscated IP addresses were utilized, which must be reviewed in conjunction with other context indicators.

  ### Investigation Steps

  - **Review Process Creation Events**: Check Security Event ID 4688 and Sysmon Event ID 1 for legitimate processes (`ping.exe`, `arp.exe`) using PowerShell or the command line. Confirm usage of command-line arguments containing encoded IP formats as described in the detection criteria.

  - **Identify High-Confidence Malicious Indicators**: Focus on command-line invocations that feature obfuscated IP addresses (e.g., hexadecimal `0x` formats, octal patterns) and compare with known threat actor methodologies. Ensure the command line does not include valid IP address formats, as indicated by the exclusion filter.

  - **Examine Network Activity Logs**: Review your firewall or proxy logs for connections to the detected obfuscated addresses. Look for unusual outbound connections that align with the detected obfuscated IP to assess any associated malicious activity.

  - **Understand Legitimate Use Cases**: Recognize that certain applications may legitimately use encoded IP formats for internal checks or communication, particularly in development or testing environments—contextualize findings accordingly.

  - **Assess File and Network Activity**: If applicable, check for file creation associated with the process using `ping.exe` or `arp.exe` that may indicate malicious payload delivery. Validate against your typical network baseline to identify deviations.

  - **Document Affected Hosts and Roles**: Document the impacted systems considering their roles within the environment (e.g., endpoint vs. server). Prioritize investigation of critical assets that might be targeted for lateral movement if malicious activity is confirmed.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on the network if malicious IP obfuscation is indicative of hostile actions. The likelihood of exploitation through obfuscated communications is moderate, as threat actors commonly employ such techniques to evade detection while scanning networks or conducting external reconnaissance.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using alternate encoding methods that may not be captured by the current patterns. The alert may also trigger from legitimate scenarios involving coding practices or internal tools that inadvertently use encoded IP formats. Ensure logging of all relevant process creations and network connections to maintain effective detection capability. A related detection rule for monitoring direct network connections would enhance overall coverage and mitigate blind spots.

