note: |
  ### Technical Context

  This rule detects the use of Gpg4win for file encryption on Windows systems, specifically searching for the execution of gpg.exe or gpg2.exe with command-line arguments indicating file encryption with a passphrase. The likely attacker objective is to obfuscate malicious files or sensitive data, making it difficult for security tools to analyze or for investigators to retrieve information. This behavior maps to the MITRE ATT&CK technique T1486: Data Encrypted for Impact under the Execution tactic.

  The primary telemetry source is process creation logs, specifically looking for Security Event ID 4688 or Sysmon Event ID 1. If the detected activity is malicious, it poses a significant security risk by defending against detection or facilitating data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own—it may also indicate legitimate use by authorized personnel for secure data handling.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and/or Sysmon Event ID 1 for the creation of gpg.exe or gpg2.exe, specifically noting the command line arguments (`-c` and `passphrase`). Benign usage would typically not involve suspicious or unrecognized passphrase values.

  - **Identify execution context:** Determine the user account and process parentage of the Gpg4win execution. Malicious instances may originate from unexpected or unauthorized user accounts or processes, such as known malware frameworks.

  - **Examine recently encrypted files:** Investigate known output directories for newly created files encrypted with Gpg4win. The absence of legitimate business justification for recent file encryptions may indicate malicious activity.

  - **Assess related process activity:** Correlate with recent file creation or access logs (e.g., Security Event ID 4663) to identify potentially hidden malicious files or unauthorized data exfiltration attempts. Malicious behavior might involve rapid creation and subsequent deletion of large files.

  - **Review user behavior baseline:** Conduct a review of the user's typical activity, focusing on the frequency and origin of Gpg4win usage. Regular use by users typically engaged in file encryption for business purposes could indicate benign activity.

  - **Check for other indicators of compromise:** Investigate for any indications of file exfiltration or lateral movement correlated with abnormal execution patterns of Gpg4win, or related detections like T1041: Exfiltration Over Command and Control Channel.

  ### Prioritization

  This alert has medium severity due to the potential impact of data being encrypted and hidden from detection, especially if occurring on critical systems. There is a moderate likelihood of malicious attempts, as encryption tools can be weaponized by adversaries to hinder investigation. Although encryption is not an uncommon legitimate activity, unusual or unauthorized use should raise concerns.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing legitimate file encryption methods for benign purposes, leading to false positives. Gpg4win usage in legitimate contexts can trigger alerts, particularly if users have business justification for encryption. Reliable detection requires proper logging configurations for both process creation and related file activity. A related detection would be monitoring attempts to access or modify the files encrypted by Gpg4win, as it provides additional context to establish malicious intent.

