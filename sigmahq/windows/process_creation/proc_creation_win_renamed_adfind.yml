note: |
  ### Technical Context
  This detection rule identifies the execution of a renamed version of AdFind.exe, a reconnaissance tool commonly exploited by threat actors to gather information about domain trusts in a network environment. Threat actors deploy this tool as a means of understanding the architecture and vulnerabilities of a target network before executing further attack stages, such as lateral movement or privilege escalation.

  The use of AdFind is associated with various cyber threat activities, particularly involving advanced persistent threats (APTs) and cybercriminal groups. Their objectives typically include gaining deeper insights into a network's structure and identifying high-value targets to exploit. The tool can facilitate various reconnaissance tasks, leading to potential data exfiltration or compromise of critical systems.

  Relevant MITRE ATT&CK techniques include:
  - **T1018 - Remote System Discovery**: This technique involves discovering information about remote systems and their configuration.
  - **T1087.002 - Account Enumeration**: Threat actors may utilize tools like AdFind to gather information on user accounts, including their status and groups.
  - **T1482 - Domain Trust Discovery**: The use of AdFind for domain trust enumeration falls under this technique, allowing adversaries to discover trust relationships between domains.
  - **T1069.002 - Permission Groups Discovery**: This technique is relevant as AdFind can be employed to retrieve details about permission groups in a domain.

  Primary data sources for detecting this behavior include:
  - Process creation event logs from Windows systems that record command-line arguments and details about executed processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and examine Windows process creation logs to identify instances of AdFind.exe execution and the command-line arguments used. Look for signs of unusual or unexpected parameter usage that may indicate malicious intent.

  - **Analyze Command-Line Arguments**: Focus specifically on command-line patterns indicative of domain discovery and trust enumeration (e.g., parameters such as 'domainlist', 'trustdmp', or others associated with AdFind). Determine if the execution aligns with known legitimate usage or signals potential misuse.

  - **Check for File Hashes**: Cross-reference the reported AdFind.exe executions with known hash values (IMPHASHes) to confirm if the executing binary is a legitimate or renamed variant. Investigate any matches to see if they correlate with known threat actor behavior.

  - **Assess Network Activity**: Investigate any associated network traffic that may have occurred around the time of the detected AdFind activity. Look for signs of information exfiltration or communication with external IP addresses that could indicate further malicious actions.

  ### Prioritization
  This alert is considered high severity due to the critical nature of reconnaissance activities that can precede more damaging attacks. The likelihood of successful lateral movement and privilege escalation increases significantly when adversaries utilize tools like AdFind for domain information gathering.

  ### Blind Spots and Assumptions
  Potential gaps in detection may arise from the lack of logging for renamed or obfuscated tools that may not trigger this detection rule. Additionally, the rule assumes that execution of AdFind.exe, even when renamed or modified, remains observable in process creation logs. Required logs may include full command-line logging in process creation events, and if such logging is not enabled, detection may be compromised.

