note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed version of AdFind.exe, a tool frequently used in adversarial reconnaissance activities such as domain trust discovery and user enumeration. Attackers typically leverage AdFind to gather information about Active Directory (AD) structures, which aids in planning further intrusion stages. The relevant MITRE ATT&CK tactics and techniques for this detection are "Discovery" (TA0007) and "Domain Trust Discovery" (T1018). Primary telemetry sources include Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1, which detail process executions and command-line arguments. If malicious, the security impact includes unauthorized access to sensitive AD information, enabling further lateral movement or privilege escalation. It's essential to clarify that detecting this behavior does **NOT** confirm malicious intent on its own, as legitimate administrators may also use similar tools for valid purposes.

  ### Investigation Steps

  - **Identify the executing process:** Check Security Event ID 4688 for the process creation event of the identified command. Look for the `NewProcessName` field containing paths ending in `\AdFind.exe`, or other relevant paths when renamed.

  - **Review command-line arguments:** If a suspicious process is detected, examine the `CommandLine` field from Security Event ID 4688 or Sysmon Event ID 1 logs to identify usage of command-line options (e.g., `-subnets -f`, `domainlist`, `trustdmp`) that indicate reconnaissance activity.

  - **Correlate with known malicious hashes:** Cross-reference the `Hashes` field in the log against known AdFind hash values (e.g., `IMPHASH=BCA5675746D13A1F246E2DA3C2217492`). Any match should be treated with high confidence as a malicious indicator.

  - **Assess legitimate usage patterns:** Investigate whether there have been recent administrative tasks involving legitimate users that may account for the presence of AdFind. Look for typical command-line arguments like `-dclist` or `adinfo` in known admin sessions or tools used during scheduled maintenance.

  - **Examine process origins and parent-child relationships:** Determine if the parent process of the detected AdFind instance is a legitimate administrative command shell (e.g., cmd.exe or PowerShell.exe). Anomalous parent processes can indicate malicious intent.

  - **Inspect network activity for exfiltration attempts:** Look for outbound connections made by the process (if applicable), particularly those targeting external IPs or known malicious domains, indicating possible information exfiltration.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive AD environments and the fact that domain reconnaissance is commonly leveraged in attack scenarios. The likelihood of malicious use is significant, as AdFind is a tool frequently seen in post-exploitation phases of advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion by renaming the executable or modifying hashing algorithms. Effective detection relies on comprehensive logging of Windows process creation and configuration to audit policy for PowerShell command logs. Legitimate activities, such as routine AD health checks performed by system administrators, may also trigger this alert. A companion detection that enhances coverage includes monitoring for unusual parent processes spawning AdFind, indicating potential exploitation patterns.

