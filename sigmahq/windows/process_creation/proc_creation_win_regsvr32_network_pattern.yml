  ---

  ### Technical Context

  This rule detects the execution of Regsvr32 to potentially download or register unauthorized DLLs hosted on HTTP or FTP servers. The objective of an attacker utilizing this technique is often to bypass traditional security controls, enabling the execution of malicious code. This behavior aligns with the MITRE ATT&CK technique T1218.010 (Signed Binary Proxy Execution: Regsvr32).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If determined to be malicious, the impact could range from system compromise to unauthorized data access. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is necessary to establish the context of the Regsvr32 execution.

  ---

  ### Investigation Steps

  - **Check the command line parameters:** Verify the Security Event ID 4688 or Sysmon Event ID 1 for the command line arguments associated with Regsvr32 execution. Look for flags like `/i` or `-i` along with URLs containing `ftp` or `http`. Legitimate use cases typically include internal network paths, not external URLs.

  - **Review the origin of the command:** Investigate the parent process ID linked to the detected Regsvr32 execution. If the parent process is a known benign application (e.g., legitimate software installation), mark it as suspicious, while any process from an unknown or system-level application may require escalation.

  - **Analyze network activity:** Cross-reference recorded outbound network connections around the time of execution by examining firewall or proxy logs. Document any attempts to connect to unusual or suspicious external servers, which may corroborate malicious intent.

  - **Identify newly registered DLLs:** Utilize Windows Event Logs to check for DLL registrations. Look for new .DLL files registered immediately after the execution of Regsvr32. If these are sourced from the previously mentioned URLs, this is a strong indicator of malicious activity.

  - **Monitor user behavior:** Check the user account that executed the Regsvr32 command. Verify against a list of approved users for installing software or changes to system configurations. Any execution by non-administrative accounts may raise flags for further analysis.

  - **Validate the integrity of downloaded files:** If possible, check the cryptographic hash of any DLLs that were downloaded/registered. Legitimate DLLs will often have known hashes; discrepancies could suggest a substitution with a malicious version.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact of a compromised system and the likelihood that this behavior is indicative of malicious intent. The usage of Regsvr32 to execute code from external sources is uncommon in typical enterprise environments, thus elevating its risk profile when detected.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if process creation logs or API monitoring aren't fully enabled across all endpoints, particularly for unauthorized software installations. Legitimate activities could include system updates or software installations by trusted IT personnel, which may trigger this alert. Complementary detections may include monitoring for unusual HTTP/FTP server communications or other file execution anomalies to strengthen overall coverage.

