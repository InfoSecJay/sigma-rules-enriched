  ### Technical Context

  This Sigma rule detects the execution of the NirCmd tool to run commands as the Local System user, commonly through the command line argument `runassystem`. This behavior may indicate an attacker attempting to exploit system privileges or execute malicious commands without proper user context to evade detection. It aligns with the MITRE ATT&CK techniques "Execution" (T1203) and "System Owner/User Discovery" (T1123). The primary telemetry sources include Windows Security Event ID 4688 (process creation), where `NirCmd.exe` is invoked with `runassystem`. If leveraged maliciously, this behavior can facilitate lateral movement, data exfiltration, or persistence mechanisms. Importantly, the detection does NOT confirm malicious intent, as legitimate administrative actions may result in similar execution patterns.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Security Event ID 4688 for instances where `NirCmd.exe` is executed with the `runassystem` argument. Correlate these instances with the command line arguments used for additional context.

  - **Identify the User Context**: Verify the user account that initiated the `NirCmd` execution. Legitimate SYSTEM-level commands may be executed by administrative accounts, while unexpected accounts executing this command warrant closer scrutiny.

  - **Analyze Execution Frequency**: Investigate the frequency of `NirCmd.exe` executions on the system in question. Frequent or automated executions in a short timeframe can indicate malicious activity, especially if outside the regular administrative operations.

  - **Review Installed Applications**: Check for the legitimate installation of NirCmd across systems by reviewing application files or folders at `C:\Program Files\NirSoft\`. Monitoring for unauthorized installations can help differentiate between benign and suspicious activity.

  - **Monitor Network Activity**: Look at outbound communications or command and control (C2) traffic that may correspond with the execution. An effective method includes examining process exit logs and associated network connections made following `NirCmd` execution.

  ### Prioritization

  This alert is high severity due to its potential impact on critical systems, especially if NirCmd is being misused by adversaries to gain elevated privileges or execute unauthorized commands. The likelihood of misuse is significant, as tools like NirCmd are often weaponized in attacks to interact with systems covertly.

  ### Blind Spots and Assumptions

  This detection may be bypassed if NirCmd is executed with obfuscated command lines or via alternative scripting methods. It relies on the comprehensive logging of Windows Security Event IDs, including process creations, which must be enabled. Legitimate administrative tasks may correctly trigger this alert, such as system maintenance actions by IT staff. Companion detections targeting unusual use of other execution tools, or abnormal scheduled task creation, can strengthen overall coverage against misuse.

