note: |
  ### Technical Context

  This rule detects potentially suspicious child processes spawned by `Diskshadow.exe`, a legitimate Windows utility for managing shadow copies of volumes. Attackers may exploit this to perform stealthy data exfiltration or malicious persistence by executing nefarious commands or utilities like `certutil.exe`, `powershell.exe`, or `mshta.exe`. This behavior typically fits into the MITRE ATT&CK framework under Tactic: **Defense Evasion** (ID: TA0005) and Technique: **Indicator Removal on Host** (ID: T1070).

  The primary telemetry sources for detection include Windows process creation logs, specifically Security Event ID 4688, which logs process creation events. If malicious, such behavior could lead to data compromise, system integrity issues, or unauthorized access to sensitive data. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative activities could also generate similar alerts.

  ### Investigation Steps

  - **Verify the Parent Process Context:** Check Security Event ID 4688 and confirm the parent process is `Diskshadow.exe`. Valid cases may include scheduled shadow copy creation or backup scripts executed by system administrators.
  - **Examine the Child Process Details:** Identify the invoked child processes using Security Event ID 4688 logs. Confirm if they match entries such as `certutil.exe`, `powershell.exe`, or `mshta.exe`. Any invocation of uncommon child processes should be scrutinized for malicious intent.
  - **Assess Timestamp Correlation:** Review process logs for anomalies in timestamps. Look for rapid succession of processes creating or modifying shadow copies, which may indicate automated or scripted attacks.
  - **Check for Unauthorized File Modifications:** Validate associated file creation or modification events in the presence of shadows created by the detected process using Sysmon Event ID 11 (File creation time changed) or Event ID 13 (File created). Lack of legitimate usage could indicate malicious metadata manipulation.
  - **Audit Lateral Movement Indicators:** Investigate if the detected child process activity correlates with any lateral movement, especially if the `Diskshadow.exe` invocation originates from non-administrative user accounts or on unusual servers relevant to the role.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on critical systems when shadow copy capabilities are misused. The likelihood of malicious abuse is moderate, especially since utilities like `Diskshadow.exe` are often exploited in targeted attacks, but false positives can arise from legitimate IT operations.

  ### Blind Spots and Assumptions

  Detection may be evaded by attackers who use legitimate tools without using `Diskshadow.exe`, or who utilize children processes not listed in the detection rule. Complete visibility requires comprehensive logging including Sysmon configuration for additional process monitoring. Legitimate administrative scripts may periodically trigger these detections, necessitating a context-aware evaluation. A companion detection strategy should include monitoring for `Diskshadow` execution from anomalous locations, enhancing the ability to catch misuse.

