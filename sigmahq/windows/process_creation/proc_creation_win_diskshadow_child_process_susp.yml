note: |
  ### Technical Context
  This detection rule identifies suspicious child processes spawned from `Diskshadow.exe`, a legitimate Windows utility for managing shadow copies. Attackers may exploit this tool as part of their strategy to evade detection mechanisms in place for monitoring executable behavior. For instance, an adversary could use `Diskshadow.exe` to execute malicious scripts or tools like PowerShell or CertUtil, enabling them to extract credentials or manipulate file systems without raising alarms. The goal is often to bypass application whitelisting and other preventative measures by leveraging trusted system processes.

  The applicable MITRE ATT&CK techniques include:
  - **T1218: Signed Binary Proxy Execution**: This technique involves using signed binaries to execute malicious payloads, effectively allowing adversaries to sidestep security controls.
  - **Defense Evasion**: The overall tactic of moving stealthily to avoid detection, particularly pertinent in the context of application whitelisting and monitoring.

  The primary data sources for this detection mechanism are:
  - **Process creation events**: Logs that capture the creation of processes and their parent-child hierarchies in Windows environments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for instances where `Diskshadow.exe` is a parent process, particularly looking for unusual child processes that may indicate malicious activity.
  - **Analyze Child Process Behavior**: Investigate the command-line arguments and execution contexts of child processes like `powershell.exe` or `certutil.exe` initiated by `Diskshadow.exe` to identify potential misuse patterns.
  - **Correlate with Other Events**: Look for related events in the timeline, such as failed logins or changes to Active Directory objects, that may suggest an attempted credential dump or lateral movement.
  - **Conduct a Threat Intelligence Lookup**: Utilize threat intelligence resources to identify if any of the child processes are known indicators of compromise (IoCs) related to recent attacks or exploits leveraging `Diskshadow.exe`.

  ### Prioritization
  This alert is assigned medium severity due to the potential impact of malicious actions resulting from the execution of child processes, which can facilitate data theft or unauthorized access. Considering the likelihood that attackers may use trusted binaries for their operations, such detections should be prioritized for quicker investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if certain scripts or legitimate tools are falsely identified as suspicious, leading to potential false positives during administrative actions. The detection logic assumes that `Diskshadow.exe` is not frequently used in legitimate workflows, meaning legitimate administrative practices involving this tool may lead to benign alerts. Additionally, the efficacy of this detection depends on ensuring comprehensive process creation logging is enabled and properly configured across all Windows systems within the organization.

