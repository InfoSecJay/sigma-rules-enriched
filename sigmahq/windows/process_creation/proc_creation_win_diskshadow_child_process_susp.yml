note: |
  ### Technical Context

  This detection identifies potentially suspicious child processes spawned by `Diskshadow.exe`, which may indicate an attempt by an attacker to evade detection mechanisms such as parent/child relationship tracking or application whitelisting. The likely attacker objective is to use legitimate Windows tools to manipulate Volume Shadow Copies for credential dumping or data exfiltration, which often precedes further exploitation or lateral movement. Relevant MITRE ATT&CK tactics include Defense Evasion (T1203) due to the misuse of system tools and Credential Access (T1003) for potential access to sensitive data stored in shadow copies.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which record process generation. If successful, the attacker may gain escalated privileges and access critical data. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative scripts may also trigger this alert.

  ### Investigation Steps

  - **Analyze process execution paths**: Investigate the command line arguments and the execution paths in Security Event ID 4688 logs for any suspicious parameter use with `Diskshadow.exe`. Look for unusual or unexpected child processes like `powershell.exe` or `mshta.exe`.

  - **Identify legitimate administrative usage**: Review recent administrative activities where `Diskshadow.exe` was legitimately used. Confirm the absence of suspicious process spawning, especially from scripts run by known administration accounts.

  - **Check process parent-child relationships**: Validate the parent-child relationships of the processes involved. If `Diskshadow.exe` is spawning uncommon processes in a non-standard manner (e.g., unexpected paths like `%TEMP%`), this could indicate malicious activity.

  - **Look for patterns in command line usage**: Capture Sysmon Event ID 1 for child processes and analyze the command lines for known malicious patterns. Check for encoded or obfuscated commands in child process arguments, indicating potential obfuscation attempts.

  - **Assess asset criticality**: Confirm whether the alert pertains to critical systems, such as domain controllers or servers containing sensitive data. Higher criticality may necessitate a more thorough investigation.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems and the likelihood of malicious abuse through common native Windows tools. The behavior is not universally indicative of an attack, but when coupled with other anomalous activities, it raises concerns for weaponization.

  ### Blind Spots and Assumptions

  Evasion techniques may include using legitimate administrative scripts and executing from a benign location to minimize detection. Reliable detection requires consistent logging of process creation events (Security Event ID 4688) and appropriate Sysmon configuration. Legitimate user activities, such as admin script execution, may also trigger this alert. For enhanced coverage, consider companion detections for unusual `diskshadow` usage transformations or uncommon script execution patterns.

