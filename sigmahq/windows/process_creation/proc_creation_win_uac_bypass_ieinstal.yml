note: |
  ### Technical Context
  This rule detects an attempt to bypass User Account Control (UAC) using the `IEInstal.exe` process, which is associated with a technique known as UACMe. UAC bypass techniques are often employed by attackers to escalate privileges within a system without raising immediate alerts. In this scenario, the attacker may exploit weaknesses in UAC to execute arbitrary code with elevated privileges, enabling them to perform malicious actions, such as installing malware or exfiltrating sensitive data after gaining administrative access.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Defense Evasion** (TA0005)
  - **Privilege Escalation** (TA0004)
  The specific technique detected here is **Bypass User Account Control** (T1548.002), which illustrates the attacker’s strategy to execute processes with higher privileges than those initially granted.

  The primary data sources for this detection are Windows process creation logs. These logs provide insights into newly created processes, their parent-child relationships, and the integrity levels of processes, which are crucial for identifying UAC bypass attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs around the time of the alert. Look for `consent.exe` executions with a parent process of `ieinstal.exe` and verify the integrity levels associated with both processes.
  - **Correlate User Activity**: Check user activity prior to the event to identify any suspicious behavior patterns or unauthorized actions that could suggest privilege escalation or potential compromise.
  - **Monitor for Other UAC Bypass Techniques**: Conduct a broader search for other UAC bypass methods in the environment to assess the likelihood of concurrent attacks or ongoing malicious activities.
  - **Analyze System Configurations**: Ensure that Windows security settings regarding UAC are properly configured to prevent bypass attempts. Investigate if there have been any unauthorized changes to these settings.

  ### Prioritization
  This alert is categorized as high severity due to the potential impact of successful UAC bypass attempts. If exploited, an attacker could gain significant control over the system, leading to data breaches or further infiltration of the enterprise network.

  ### Blind Spots and Assumptions
  Detection coverage can be limited if process creation logs are not adequately collected or if the environment uses alternative methods for UAC implementations. The detection logic assumes that `ieinstal.exe` is employed as a parent process for elevating privileges and does not account for potential obfuscation methods attackers might use. Additionally, logs must include comprehensive process creation events for this detection to function effectively, making it critical that logging configurations are correctly set up to capture all relevant activities.

