  ### Technical Context

  This Sigma rule detects a potential User Account Control (UAC) bypass by monitoring processes spawned from `ieinstal.exe`, specifically focusing on instances where the parent process is `consent.exe` and the child process resides in a temporary file directory. The likely objective of an attacker using this technique is to escalate privileges without triggering security mechanisms. This behavior corresponds to the MITRE ATT&CK tactic of Privilege Escalation, specifically the technique T1548.002 for UAC Bypass.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. Should the activity be malicious, it may allow an attacker to gain elevated permissions, giving them more control over the system. Importantly, while this detection indicates suspicious behavior, it does NOT confirm malicious intent without further corroborating evidence.

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 or Sysmon Event ID 1 where `Image` contains `\AppData\Local\Temp\` and `ParentImage` ends with `\ieinstal.exe`. Note any occurrences of `consent.exe`. Legitimate activity is expected to originate from trusted application paths.

  - **Analyze the integrity level:** Evaluate the integrity level of the process in question. An integrity level of 'High' (S-1-16-12288) or 'System' (S-1-16-16384) can indicate malicious intent when spawned by `ieinstal.exe`, contrasting typical user-level integrity levels.

  - **Correlate against known benign behavior:** Confirm if `ieinstal.exe` is part of a legitimate process or installation routine in your environment. Document any known legitimate applications that routinely perform actions involving `consent.exe` from trusted executable locations (e.g., `C:\Windows\System32`).

  - **Identify any abnormal file paths:** Look for the presence of files created around the same time in the `\AppData\Local\Temp\` directory (especially under unusual filenames). Malicious actors may utilize temporary directories to hide worrisome activity.

  - **Investigate parent-child process relationships:** Evaluate the full process tree for additional indicators of compromise. Determine if other processes could be involved in this workflow, indicating further escalation attempts.

  - **Examine for known APT activity:** Cross-reference the detection with threat intelligence sources for associations with advanced persistent threats (APTs) known to utilize UAC bypass techniques, adding context to the ongoing investigation.

  ### Prioritization

  The alert carries a high severity due to the potential impact on critical systems if an attacker successfully escalates privileges. The likelihood of malicious abuse is significant, as UAC bypass techniques are frequently weaponized in attack scenarios. This behavior should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include altering the file paths or names of the processes involved, thus eluding detection. Reliable detection requires proper logging configurations including Sysmon or detailed Windows event logging. Legitimate software installations or updates may inadvertently trigger this alert if they use `ieinstal.exe`. A related detection to enhance coverage would be monitoring for abnormal process creations from trusted applications or the utilization of known privilege escalation tools.

