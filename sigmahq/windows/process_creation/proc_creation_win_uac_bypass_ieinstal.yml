  ---

  ### Technical Context

  This Sigma rule detects potential User Account Control (UAC) bypass attempts leveraging `ieinstal.exe` as a parent process for `consent.exe`, which is utilized for elevated permissions in Windows environments. The likely attacker objective is to achieve privilege escalation, allowing them to execute code with higher permissions than originally granted. This behavior aligns with the MITRE ATT&CK techniques for Defense Evasion (T1548.002 - Bypass User Account Control).

  The primary telemetry sources include Windows process creation logs, specifically Security Event IDs 4688 and Sysmon Event ID 1, which capture details about process execution, parent-child relationships, integrity levels, and image paths. Should this detection prove true, it could indicate a significant breach of system integrity, potentially allowing adversaries to execute malicious code without proper user consent. However, this detection alone does not confirm that a compromise has occurred, as it may include benign instances of `consent.exe` being invoked for legitimate administrative purposes.

  ---

  ### Investigation Steps

  - **Identify the process inheritance**: Review Security Event ID 4688 for `consent.exe` with a parent process of `ieinstal.exe`. Look for the Image Path field to confirm the presence of `\AppData\Local\Temp\ieinstal.exe`.

  - **Check integrity level**: Validate the integrity level associated with the `consent.exe` process. Ensure that it reads either 'High' or 'System' (SIDs: S-1-16-16384 or S-1-16-12288), as legitimate consent processes typically operate under lower integrity levels.

  - **Cross-reference with legitimate behavior**: Search process creation logs for expected activity by known applications that use `consent.exe` legitimately (e.g., Windows updates or trusted installers) to rule out benign execution.

  - **Analyze existing processes**: Investigate if `ieinstal.exe` was executed recently by checking Event ID 4688. Investigate unusual execution paths and timestamps, focusing on potentially suspicious timeframes or missing elements in command-line arguments.

  - **Correlate with other telemetry sources**: Confirm the presence of evidence in Sysmon logs, focusing on Event ID 10 (ProcessAccess) to see if any abnormal access attempts are logged against `consent.exe`.

  - **Monitor for follow-on activity**: Utilize EDR tools to review any subsequent processes spawned from `consent.exe`. Look for unusual network connections or file writes that may indicate malicious behavior post-execution.

  ---

  ### Prioritization

  This alert should be prioritized as high due to its potential impact on systems where privilege escalation could enable further exploits or lateral movement within the network. The likelihood of abuse is significantly increased as the behavior demonstrated is a known method for bypassing UAC controls, which are often weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of comprehensive logging across all potential UAC bypass methods. Evasion techniques, such as altering `ieinstal.exe` to use different filenames or modifying its execution path, could bypass this detection. Additionally, legitimate administrative tasks may inadvertently trigger this alert, particularly in environments with frequent elevation of privileges. Related detections such as unusual process chains involving `PowerShell` and `WMI` can provide supplementary context to flag potential misuse.

