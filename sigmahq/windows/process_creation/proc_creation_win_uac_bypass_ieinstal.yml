note: |
  ### Technical Context

  This Sigma rule detects the use of the `ieinstal.exe` process as a parent to the `consent.exe` process which is indicative of an attempt to bypass User Account Control (UAC). The objective of the attacker is likely to execute malicious code with higher privileges by circumventing security prompts designed to prevent unauthorized actions. The relevant MITRE ATT&CK tactic is "Defense Evasion" and the associated technique is "Bypass User Account Control" (T1548.002). The primary telemetry source includes process creation logs from Windows, typified by Security Event ID 4688 or Sysmon Event ID 1, which capture process attributes during execution.

  If successful, this tactic can lead to significant security impacts, including the execution of malware with elevated privileges, potentially gaining control over the affected system. However, it is essential to note that this detection alone does not confirm malicious intent; legitimate uses of UAC bypass techniques may exist in authorized administrative processes.

  ### Investigation Steps

  - **Check process creation details:** Review Security Event ID 4688 or Sysmon Event ID 1 for the creation of `consent.exe` from the parent process `ieinstal.exe` located in `AppData\Local\Temp`. Note any timestamps and user accounts involved.

  - **Verify process integrity level:** Confirm that `consent.exe` is initiated with a high integrity level or as a system process (Integrity Level: High or System); this is suspicious if originating from `AppData\Local\Temp`.

  - **Assess user activity:** Investigate the user account that executed `ieinstal.exe`. Look for recent administrative actions by the user, who should have appropriate privileges, and validate any legitimate administrative tasks that may have triggered similar behavior.

  - **Identify known benign instances:** Review historical logs for known instances of legitimate applications or processes that may utilize `ieinstal.exe` in normal operations. Compare timestamps to identify anomalies.

  - **Check for associated network activity:** If applicable, correlate with firewall or proxy logs to identify any outbound connections initiated by `consent.exe`, which could indicate data exfiltration or command and control communication.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact on critical systems, particularly if execution occurs within sensitive environments. The likelihood of abuse is notable since UAC bypass methods are often weaponized in real-world attacks, targeting environments where users may have high privileges.

  ### Blind Spots and Assumptions

  Detection limitations include the ability of advanced adversaries to obfuscate the use of `ieinstal.exe` or the ability to spawn `consent.exe` through other means that do not trigger this alert. Reliable detection requires comprehensive logging configurations, including enabling Sysmon or Windows Event logging for process creation. Legitimate activities may include authorized application installations or administrative scripts. A related detection that enhances coverage is monitoring for unexpected process interactions involving `consent.exe` or atypical application deployment activities.

