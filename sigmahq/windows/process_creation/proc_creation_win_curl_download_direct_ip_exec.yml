note: |
  ### Technical Context

  This Sigma rule detects the use of `curl.exe` to download files directly from an IP address, which can indicate potentially suspicious activities such as data exfiltration or downloading malicious payloads. The objective of an attacker using this method would typically be to bypass standard domain security controls or to obscure their activity by avoiding fully qualified domain names, thus making it harder for defenders to track their actions. This behavior aligns with the MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Command and Scripting Interpreter: Command-Line Interface" (T1059.004).

  The primary telemetry source for this detection is the Windows Process Creation logs, specifically looking for Event ID 4688, which captures new processes being created along with their command line arguments. If malicious, this could lead to malware infection, lateral movement, or data theft. Importantly, this detection does NOT confirm whether the downloaded file is malicious; it only indicates that a download from an IP address occurred using `curl.exe`.

  ### Investigation Steps

  - **Validate the command-line argument:** Review the `CommandLine` field for Event ID 4688 to confirm it includes `curl.exe` and the "-O" or "--output" flag indicating a file download. Look for patterns like `curl.exe http://[IP_ADDRESS]` or `curl.exe -O http://[IP_ADDRESS]/file.exe`.

  - **Assess for known malicious files:** Check if any downloaded files match known malicious signatures or hashes recorded in threat intelligence sources, particularly referencing the IOC lists from the provided references.

  - **Identify file creation artifacts:** Use File System logs to look for new files created in common download directories (e.g., `C:\Users\<username>\Downloads\`) shortly after the detection, which can confirm if a file was successfully downloaded.

  - **Distinguish between legitimate and suspicious usage:** For context, legitimate use of `curl.exe` may include command line calls from trusted applications or scripts where download sources are valid domain names rather than IP addresses. Document who runs these commands and their intent.

  - **Check for lateral movement indicators:** If applicable, monitor network traffic for further suspicious connections immediately following the download, potentially examining NetFlow logs or IDS alerts.

  ### Prioritization

  This alert should be considered medium severity. The likelihood of this behavior being exploited for malicious purposes is significant, particularly when coupled with known techniques for command-line execution used by threat actors. Given that downloading files directly from IP addresses is not common in regular business operations, this should prompt immediate investigation.

  ### Blind Spots and Assumptions

  This detection may miss cases where the content is downloaded using a different technique or a different tool not covered by the rule. There is an assumption that relevant logs (specifically Process Creation logs) are being captured consistently. Legitimate administrative actions, such as software installations from internal script repositories, may trigger this alert if the scripts are not using domain-based URLs. A related detection that could strengthen coverage is one that identifies network connections to suspicious IP addresses following a file download.

