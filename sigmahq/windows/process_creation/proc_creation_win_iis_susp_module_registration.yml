title: Suspicious IIS Module Registration
id: 043c4b8b-3a54-4780-9682-081cb6b8185c
status: test
description: Detects a suspicious IIS module registration as described in 
  Microsoft threat report on IIS backdoors
references:
- https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
author: Florian Roth (Nextron Systems), Microsoft (idea)
date: 2022-08-04
modified: 2023-01-23
tags:
- attack.persistence
- attack.t1505.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\w3wp.exe'
  selection_cli_1:
    CommandLine|contains: 'appcmd.exe add module'
  selection_cli_2:
    CommandLine|contains: ' system.enterpriseservices.internal.publish'
    Image|endswith: '\powershell.exe'
  selection_cli_3:
    CommandLine|contains|all:
    - 'gacutil'
    - ' /I'
  condition: selection_parent and 1 of selection_cli_*
falsepositives:
- Administrative activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects abnormal registrations of IIS modules that could indicate the presence of a backdoor, specifically when appcmd.exe, PowerShell, or gacutil is executed under the IIS worker process (w3wp.exe). The likely attacker objective is to establish persistence on compromised servers, providing ongoing access and control. This behavior aligns with the MITRE ATT&CK technique for “Application Layer Protocol” (T1505.004).

  The primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688, which captures command-line arguments, and potentially Sysmon Event ID 1 for more detailed process creation information. If malicious, the installed module could allow unauthorized users to interact with the server, execute arbitrary code, or exfiltrate data without detection. This detection does NOT confirm a compromise but indicates a suspicious behavior requiring further investigation.

  ### Investigation Steps

  - **Verify process context:** Review Event ID 4688 for process creation logs where the `ParentImage` ends with `\w3wp.exe`. Confirm if the command line contains suspicious entries, which indicates potential malicious modification of IIS.

  - **Assess command-line details:** Analyze the fields for detected command lines. If `appcmd.exe add module` is present, note the module name being added. This should not be part of normal admin tasks; compare against known legitimate module registrations.

  - **Investigate PowerShell invocations:** For any logs showing `powershell.exe` and `system.enterpriseservices.internal.publish` in the CommandLine, verify if these scripts are related to standard operations or if they deviate from expected administrative usage patterns.

  - **Determine expected behavior:** Identify legitimate administrative activities around IIS module management by consulting internal documentation or contacting system administrators. Legitimate modules typically have known names and usage patterns.

  - **Identify high-confidence malicious indicators:** Look for the execution of `gacutil` with the `/I` flag, especially if it is preceded by `w3wp.exe`. This indicates an attempt to install assemblies into the Global Assembly Cache, which is highly unusual in regular operations.

  - **Check for persistence mechanisms:** Search for any related events indicating subsequent HTTP requests or activity linked to the added modules, assessing if unusual traffic patterns emerge that may indicate exploitation of the newly registered module.

  ### Prioritization

  This alert is high-severity due to the significant risk posed by unauthorized IIS module registrations, as they can lead to severe compromises of the web server's integrity. The likelihood of malicious use is high, given that known exploits often target IIS configurations. Unauthorized module registration is a tactic commonly weaponized in campaigns against web servers.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include legitimate administrative changes to perform similar actions or malware that mimics valid administrative commands. Reliable detection requires proper logging of process creation events (Event ID 4688) and may include additional visibility into PowerShell command execution. Legitimate activities may trigger this alert during regular updates or custom application deployments. A related detection can involve monitoring IIS access and error logs for unexpected behavior or traffic patterns post-module modification, enhancing overall visibility into potential compromises.

