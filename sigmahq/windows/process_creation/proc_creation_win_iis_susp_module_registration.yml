title: Suspicious IIS Module Registration
id: 043c4b8b-3a54-4780-9682-081cb6b8185c
status: test
description: Detects a suspicious IIS module registration as described in Microsoft
  threat report on IIS backdoors
references:
- https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
author: Florian Roth (Nextron Systems), Microsoft (idea)
date: 2022-08-04
modified: 2023-01-23
tags:
- attack.persistence
- attack.t1505.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\w3wp.exe'
  selection_cli_1:
    CommandLine|contains: 'appcmd.exe add module'
  selection_cli_2:
    CommandLine|contains: ' system.enterpriseservices.internal.publish'
    Image|endswith: '\powershell.exe'
  selection_cli_3:
    CommandLine|contains|all:
    - 'gacutil'
    - ' /I'
  condition: selection_parent and 1 of selection_cli_*
falsepositives:
- Administrative activity
level: high
note: |
  ### Technical Context
  This rule detects potentially malicious registration of Internet Information Services (IIS) modules, which may indicate the presence of backdoors on web servers hosted within the enterprise. Attackers often utilize techniques like these to gain persistent access to compromised systems, manipulate web application behavior, or exfiltrate sensitive data. The typical attacker objectives include maintaining access after initial compromise, evading detection, and escalating privileges within the environment.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and the specific technique **Malicious IIS Modules** (T1505.004). These tactics and techniques highlight the methods by which adversaries establish and maintain their foothold in the environment, potentially using compromised web servers as platforms for further attacks.

  Primary data sources that will yield valuable evidence for this detection include process creation events, specifically focusing on instances where IIS worker process (w3wp.exe) is the parent process and command lines associated with IIS module registration activities. These logs can provide insights into any unauthorized modifications or registrations occurring on the server.

  ### Investigation Steps
  - **Review Process Creation Events:** Collect and analyze logs for any processes launched under the parent image `w3wp.exe`, focusing on command line arguments that indicate IIS module registration operations.
  - **Correlate With System Audits:** Cross-reference the findings with system audit logs to identify any unauthorized changes to IIS configuration or module behavior following the suspicious registration events.
  - **Assess Network Activity:** Examine network logs for any outbound communications initiated by the IIS application during or after the module registration to detect potential data exfiltration or command-and-control (C2) communications.
  - **Query IIS Configuration:** Analyze the IIS configuration and installed modules for any unexpected entries or modifications, checking against established baselines to help detect unauthorized changes.

  ### Prioritization
  The alert's severity is high due to the critical role of IIS servers in hosting web applications and the potential for significant impacts, including data breaches, loss of service, or further penetration into the network. The likelihood of exploitation through malicious modules also raises concern for ongoing persistence threats.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate administrative activities that involve IIS module registration, which could lead to false positives. The detection logic assumes that the initial context of the command line and parent process is indicative of malicious behavior, without accounting for valid administrative changes. Additionally, for the alert to function optimally, proper logging configurations must be established to capture all necessary process creation events in the Windows event log.

