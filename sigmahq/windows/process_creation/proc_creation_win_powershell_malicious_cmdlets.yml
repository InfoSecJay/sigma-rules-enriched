note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of well-known PowerShell commandlets commonly associated with malicious activities such as data exfiltration, persistence mechanisms, and privilege escalation. The likely attacker objective is to manipulate the Windows environment to achieve unauthorized access, maintain control over compromised systems, extract sensitive information, or exploit known vulnerabilities. Relevant MITRE ATT&CK tactics and techniques include *Execution (T1203)*, *Credential Access (T1003)*, and *Discovery (T1087)*.

  Telemetry sources primarily include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior may compromise sensitive data and system integrity, enabling unauthorized actions within the network. However, it is important to note that this detection does not confirm that any unauthorized access has occurred; it merely indicates that potentially malicious commandlets were invoked.

  ---

  ### Investigation Steps

  - **Review detected commandlet execution:** Check for Security Event ID 4688 and Sysmon Event ID 1 for the executed command strings containing the specified commandlets in the alert. Verify context—malicious commandlets should not typically appear in regular administrative operations.

  - **Identify user context:** Determine the user account executing the PowerShell command by reviewing the User field in the event logs. Legitimate administrative users may invoke certain PowerShell commands, but unusual accounts or accounts with atypical permissions should trigger deeper scrutiny.

  - **Analyze process parentage:** Utilize Sysmon Event ID 1 to examine the process tree, focusing on the parent process accessing the PowerShell instance. Unauthorized scripts or commandlets typically do not originate from expected parent processes (e.g., PowerShell ISE or Windows Terminal).

  - **Cross-check with known threats:** Use threat intelligence feeds to assess if the commandlets executed correlate with known threat actor TTPs (Tactics, Techniques, Procedures). Look for overlaps with documented malicious frameworks (e.g., PowerSharpPack, Invoke-Mimikatz).

  - **Examine for side effects or artifacts:** Look for Sysmon logs indicating unusual activity initiated by the executed commandlets, such as unusual file creations (e.g., .exe files) or communication attempts to known bad IPs. Investigate any unexpected outbound network connections related to these commandlets.

  - **Consult historical data:** Query logs for historical occurrences of the detected commandlets to identify repeat offenders or patterns. If the commandlets have a record of usage, correlate against normal operational procedures to distinguish benign scripting from potential malicious intent.

  ---

  ### Prioritization

  The severity of this alert is high due to its potential impact on sensitive systems where credential theft or unauthorized data manipulation can have far-reaching consequences. Given that many of the commandlets listed are commonly weaponized in real-world attacks, rapid investigation and response are critical.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques such as obfuscation of PowerShell commands or the use of scripting frameworks that dynamically generate commandlets. An essential requirement for reliable detection includes ensuring PowerShell logging is fully enabled on all endpoints. Legitimate administrative scripting activities may trigger this alert, necessitating proper context to avoid false positives. A related detection to strengthen coverage could include monitoring for suspicious network activity generated by PowerShell processes, enhancing visibility into potentially malicious behaviors.

