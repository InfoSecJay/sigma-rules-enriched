note: |
  ### Technical Context
  This detection rule identifies the execution of specific PowerShell commandlets commonly associated with malicious activities, particularly those used in exploitation frameworks. The commandlets listed in the rule may facilitate tasks like exfiltration of data, persistence mechanisms, backdoor creation, or interacting with Active Directory in potentially harmful ways. The targeted attacker objectives generally include gaining unauthorized access, maintaining control over compromised systems, and extracting sensitive information.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (TA0002)**: Powershell-based attacks fall under the execution tactic.
  - **Discovery (TA0007)**: Many of the commandlets relate to reconnaissance, such as identifying Active Directory structures.
  - **Credential Access (TA0006)**: Commandlets that retrieve passwords or credential data highlight this technique.
  - **Exfiltration (TA0006)**: Commands designed for data extraction reinforce potential data theft activities.

  Primary data sources for this detection would be process creation logs from Windows systems, as these logs can capture the command line arguments and PowerShell instances being spawned, providing critical evidence of malicious activity.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze Windows process creation logs to identify instances where the flagged PowerShell commandlets were executed, especially focusing on the context of their usage.
  - **Correlate with User Activity**: Check user activity logs and behavior around the time these commandlets were executed to determine if the execution aligns with standard user behavior or is anomalous.
  - **Investigate Parent Processes**: Identify the parent processes that initiated the PowerShell commands. Look for common indicators of compromise or other malicious behavior originating from those parent processes.
  - **Collect Artifacts from Affected Systems**: If malicious usage is confirmed, gather additional forensic evidence by examining logs from EDR solutions, outputs from PowerShell scripts, and any affected files to assess the extent of the compromise.

  ### Prioritization
  This alert is of **high severity**, as the usage of these commandlets typically indicates an advanced threat actor attempting to exploit systems, which could lead to data breaches or significant operational disruption if not mitigated swiftly.

  ### Blind Spots and Assumptions
  The detection logic assumes that the commandlets will be executed with recognizable arguments in environments where logging is adequately configured. There may be gaps in detection if PowerShell execution is obfuscated or if logging at the process creation level is not enabled. Additionally, environments using restrictive PowerShell Constrained Language Mode may not log all commandlet executions effectively, limiting visibility into potential threats. It is essential that process creation logging is enabled and properly configured on all Windows endpoints to ensure functionality of this detection rule.

