note: |
  ### Technical Context

  This Sigma rule detects the execution of known malicious PowerShell commandlets associated with exploitation frameworks. These commandlets are often employed by attackers for various purposes, including credential dumping, system reconnaissance, and establishing persistence. The likely objective of the attacker is to exploit system vulnerabilities or gain unauthorized access to sensitive data by executing these PowerShell scripts.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Execution (T1203)
  - Discovery (T1087)
  - Credential Access (T1003)

  The primary telemetry source is the Windows process creation logs, specifically looking for Event ID 4688, which captures detailed information about PowerShell command execution. If these commandlets are observed, there may be a significant security impact, including data exfiltration or unauthorized access. This detection does NOT confirm that the action is malicious on its own; context and additional investigation are required to validate the intent behind the command execution.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 for the command line used and the parent process. Look for instances where PowerShell or `pwsh.exe` is invoked alongside any of the specified malicious commandlets.

  - **Check execution context:** Verify the user account executing the command. Legitimate entities typically run PowerShell in environments such as administrative or system contexts, whereas malicious activity may originate from unusual accounts or contexts.

  - **Identify related processes:** Look for unusual parent-child process relationships in Sysmon Event ID 1 (process creation). Malicious PowerShell scripts may spawn from unexpected sources, like `powershell.exe`, `cmd.exe`, or other non-standard processes.

  - **Validate file artifacts:** Confirm if any temporary files or scripts were created during the PowerShell execution. Use file system logs (File Creation Event IDs) to check for paths typically associated with malicious scripts, such as the `%TEMP%` directory.

  - **Look for scheduled tasks or registry changes:** Check for new scheduled tasks or modifications to persistence points (e.g., registry keys related to PowerShell) that correspond to the execution. Use Event ID 4697 for newly created services or scheduled tasks.

  - **Investigate for lateral movement indicators:** If the command involves features for remote access or movement (e.g., `Invoke-WmiCommand`), validate network connections in the Windows Firewall logs for unusual external connections or lateral movement attempts.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical systems, especially if executed in sensitive areas such as domain controllers or databases. The likelihood of malicious abuse is significant, as many of the listed commandlets are known to be used in various PowerShell exploitation techniques.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of PowerShell logging or if the commandlets are executed in a non-Windows environment or via encoded payloads, which can evade detection. Ensure that Windows auditing is configured correctly to capture relevant logs. Legitimate administrative PowerShell usage may trigger this alert if they use similar commandlets for benign purposes, such as administration or legitimate security assessments. A related detection could involve monitoring for instances of `Invoke-Mimikatz`, which could indicate credential dumping activity associated with the same detection category.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
