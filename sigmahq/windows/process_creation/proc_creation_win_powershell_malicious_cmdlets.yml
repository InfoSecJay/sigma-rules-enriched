note: |
  ### Technical Context

  This Sigma rule detects the execution of specific PowerShell commandlets associated with known exploitation frameworks and tools. The behavior signifies potential malicious activity such as exfiltration of data, persistence mechanisms, and manipulation of Active Directory environments. The likely attacker objective is to gain unauthorized access, escalate privileges, or exfiltrate sensitive data.

  Relevant MITRE ATT&CK tactics and techniques include Execution (T1203), Credential Access (T1003), and Discovery (T1087). Primary telemetry sources required for detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide necessary details regarding command lines executed. If the activity is confirmed as malicious, it poses a significant security threat due to the potential for system compromise and data breach. Notably, this detection does NOT confirm that an attack has occurred; it merely indicates the presence of potentially malicious commandlets.

  ### Investigation Steps

  - **Review command line arguments:**
    Check for evidence of specific commandlets in process creation logs (Event ID 4688 or Sysmon Event ID 1). Look for entries containing keywords like 'Invoke-Mimikatz' or 'Get-ADIDNS', which are often indicators of malicious activity.

  - **Validate process context:**
    Identify the parent process of the suspicious activity. Legitimate PowerShell activities often originate from known management systems or system scripts. If the parent process is a common tool like `powershell.exe` invoked from a known administrative environment, it may indicate benign activity.

  - **Correlate with user behavior:**
    Cross-reference the activity with the user's recent actions logged in the Security Event Log (Event IDs 4624 for logon attempts). Determine if the user is authorized to run these commandlets or if there's a mismatch between user roles and executed commands.

  - **Analyze frequency of invocation:**
    Investigate how often these commandlets are executed by the same user account or machine. A sudden spike in their occurrence may indicate malicious behavior regardless of user role, necessitating further analysis.

  - **Check for credential dumping artifacts:**
    Look for evidence of credential dumping through logs capturing processes or access to sensitive files (e.g., SAM or SYSTEM hive). Malicious indicators include accesses stemming from `Get-ADIDNS` or `Get-Credential` that deviate from normal operational patterns.

  - **Assess network connections:**
    Validate any outbound network connections made by PowerShell processes (Network logs with outbound connection details). Misuse of commandlets like `Invoke-WebRequest` to external sites can signify data exfiltration attempts.

  ### Prioritization

  Given the high potential impact of the affected systems, particularly in environments with sensitive data or critical infrastructure, the likelihood of malicious abuse is significant. This behavior is associated with several known attack methodologies frequently employed in real-world cyber threats, warranting urgent investigation.

  ### Blind Spots and Assumptions

  This detection may not capture evasion techniques such as obfuscating commandlets or using alternative scripting methods to execute similar actions, which are common among sophisticated adversaries. Reliable detection also requires proper logging configurations, including enabling Windows process creation logging and Sysmon capabilities. Legitimate administrational scripts or automated tasks may trigger similar alerts, necessitating contextual understanding of regular operational behaviors. A companion detection rule focusing on lateral movement activities like PSExec usage could enhance overall coverage against these exploitation attempts.

