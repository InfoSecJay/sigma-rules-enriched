logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\bcp.exe'
  - OriginalFileName: 'BCP.exe'
  selection_cli:
    CommandLine|contains:
    - ' out '         # Export data from a table
    - ' queryout '         # Export data based on a SQL query
  condition: all of selection_*
falsepositives:
- Legitimate data export operations.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the BCP (Bulk Copy Program) utility, specifically when it is used to export data from an MSSQL database. The detection targets activities where an attacker might extract sensitive information or malware stored in the database. The objective of such behavior typically includes data exfiltration (e.g., stealing proprietary data) or moving malicious payloads from the database.

  Relevant MITRE ATT&CK tactics and techniques include Exfiltration (TA0010) and Command and Scripting Interpreter (T1059). The primary telemetry sources are Windows process creation logs, specifically focusing on the use of 'bcp.exe' and associated command line arguments. If malicious, this behavior could indicate a severe data breach or compromise of sensitive information. It is important to note that this detection does NOT confirm that the user executing the command has malicious intent, as it can be used in legitimate operations.

  ---

  ### Investigation Steps

  - **Identify the process initiation:** Review event logs for **Windows Security Event ID 4688** to find instances of **bcp.exe** execution. Analyze the event for the account ID and process creation timestamp.

  - **Examine the command line arguments:** Search for command line parameters associated with **BCP** in the logs using **Sysmon Event ID 1**. Look specifically for the presence of keywords like 'out' or 'queryout'. Legitimate exports often contain clear references to intended databases and tables.

  - **Correlate with user behavior:** Check against **user activity logs** to assess if the account used for executing BCP has legitimate access to the database and consistently performs data export tasks. Look for patterns that match previous export operations.

  - **Identify high-confidence malicious indicators:** Determine if the output file path in the command line contains unusual directories or file types often associated with malware storage (e.g., executables or scripts).

  - **Assess database access logs:** Utilize MSSQL logs to verify the context of data access before the export. Analyze who queried the database and for what purpose. Unauthorized access might indicate prior compromise.

  - **Cross-reference threat intelligence:** Investigate if this alert correlates with known threat actor TTPs associated with data exfiltration or MSSQL attacks, using sources like the referenced AhnLab or Huntress blogs.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on sensitive systems if confirmed malicious. Data exfiltration is a common malicious tactic, making it essential for investigation. The likelihood of abuse is noticeable, with varying levels of sophistication based on the attacker’s objectives.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded if the attacker uses alternative methods of data exfiltration that do not invoke BCP or if they modify the execution behavior to mask the command’s true intent. Reliable logging of MSSQL database activity is vital for confirming context around alerts. Legitimate activities, including regular data export processes by authorized users, may trigger false positives. Companion detection strategies should include monitoring direct database connections or unusual query patterns, which can act as a supplementary alert mechanism.

