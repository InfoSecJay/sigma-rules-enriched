title: Data Export From MSSQL Table Via BCP.EXE
id: c615d676-f655-46b9-b913-78729021e5d7
status: test
description: |
  Detects the execution of the BCP utility in order to export data from the database.
  Attackers were seen saving their malware to a database column or table and then later extracting it via "bcp.exe" into a file.
references:
- https://docs.microsoft.com/en-us/sql/tools/bcp-utility
- https://asec.ahnlab.com/en/61000/
- https://asec.ahnlab.com/en/78944/
- https://www.huntress.com/blog/attacking-mssql-servers
- https://www.huntress.com/blog/attacking-mssql-servers-pt-ii
- https://news.sophos.com/en-us/2024/08/07/sophos-mdr-hunt-tracks-mimic-ransomware-campaign-against-organizations-in-india/
- https://research.nccgroup.com/2018/03/10/apt15-is-alive-and-strong-an-analysis-of-royalcli-and-royaldns/
author: Omar Khaled (@beacon_exe), MahirAli Khan (in/mahiralikhan), Nasreddine Bencherchali
  (Nextron Systems)
date: 2024-08-20
tags:
- attack.execution
- attack.exfiltration
- attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\bcp.exe'
  - OriginalFileName: 'BCP.exe'
  selection_cli:
    CommandLine|contains:
    - ' out '         # Export data from a table
    - ' queryout '         # Export data based on a SQL query
  condition: all of selection_*
falsepositives:
- Legitimate data export operations.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the BCP (Bulk Copy Program) utility, which can be exploited by attackers to export data from MSSQL databases. Attackers may save malicious payloads within database tables or columns and subsequently utilize BCP to extract this hidden data, facilitating data exfiltration or malware deployment. By monitoring instances of BCP usage, organizations can identify potential malicious activities that leverage administrative database functions for nefarious purposes.

  The likely threat scenarios involve attackers aiming to extract sensitive information, which may include credentials, proprietary data, or malware binaries stored in the database. The use of BCP in such contexts aligns with the MITRE ATT&CK tactics of **Execution** (T1203) and **Exfiltration** (T1041), particularly the technique of **Exfiltration Over Command and Control Channel** (T1048). Primary data sources for effective detection include process creation events, which log the execution of Ithe BCP utility and its command line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `bcp.exe` execution to determine the context and legitimacy of the operation, specifically noting the associated command line parameters.

  - **Analyze Command Line Arguments**: Assess command line input for patterns that suggest data export (e.g., usage of 'out' or 'queryout') and verify whether the source and destination paths are appropriate and authorized.

  - **Correlate with Database Audit Logs**: Cross-reference with MSSQL database logs to look for any anomalous or unauthorized read operations that correspond to the timing of the BCP execution.

  - **Investigate User Activity and Roles**: Determine the user accounts executing BCP commands and their privilege levels, checking for any accounts that have been misused or compromised to facilitate data extraction.

  ### Prioritization
  This alert is of medium severity due to the potential for serious data exfiltration incidents that could compromise sensitive data within an enterprise. Given that attackers often target databases, the prevalence of vulnerability in these systems necessitates prompt investigation to prevent significant information loss.

  ### Blind Spots and Assumptions
  Detection capabilities may be limited if process creation logs are not consistently collected or if changes in legitimate BCP usage patterns are not well understood. The detection logic assumes that all instances of BCP execution with the specified flags are indicative of malicious behavior, potentially leading to false positives from legitimate data export operations. Additionally, without proper logging of database activity, such as failed access attempts or unauthorized data queries, the investigation may lack crucial context to assess the legitimacy of BCP usage effectively.

