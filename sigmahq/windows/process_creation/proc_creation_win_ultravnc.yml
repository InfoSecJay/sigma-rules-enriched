  ### Technical Context

  This Sigma rule detects the execution of UltraVNC's VNCViewer, a remote access software, which may be utilized by adversaries to establish interactive remote command and control sessions on targeted systems. The likely attacker objective is to gain unauthorized access to systems while avoiding detection by utilizing a legitimate tool commonly used for desktop support. This behavior aligns with the MITRE ATT&CK technique **T1219.002 - Remote Access Software**.

  The primary telemetry source for this detection is process creation events on Windows systems, specifically those indicating the execution of UltraVNC. Relevant log types include Security Event ID 4688 (process creation) and potentially Sysmon Event ID 1. If malicious, the security impact is significant as it can facilitate unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent on its own, as UltraVNC can be used legitimately for remote support.

  ### Investigation Steps

  - **Identify process details: ** Review Security Event ID 4688 logs for UltraVNC process creation where `New Process Name` contains `VNCViewer.exe`. Look for `<User>` accounts; legitimate users may include IT support staff.

  - **Check execution paths:** Verify the execution path of `VNCViewer.exe`. A benign execution typically occurs from common installation directories (e.g., `C:\Program Files\UltraVNC\`), while malicious instantiations may emerge from unusual paths (e.g., user profile folders).

  - **Cross-reference user activity:** Monitor for typical user account activity. Legitimate connections from remote support personnel may coincide with business hours, while unauthorized access might occur outside normal hours.

  - **Review network communications:** Analyze firewall logs for outbound connections to unusual IP addresses or ports initiated by UltraVNC. Look for unusual or unexpected communication patterns indicative of command and control (e.g., connections to known malicious IPs).

  - **Assess persistence mechanisms:** Investigate for any indicators of persistence related to UltraVNC, such as the creation of startup entries or scheduled tasks. Evidence of malicious persistence may include alterations in `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`.

  ### Prioritization

  This alert carries medium severity, driven by the ability of UltraVNC to facilitate unauthorized remote access to critical systems. The likelihood of malicious abuse is moderate, as adversaries often weaponize legitimate remote access tools to blend in with normal operational activities. Given the increasing use of remote support tools in organizations, careful review is essential to determine if usage is legitimate.

  ### Blind Spots and Assumptions

  Potential evasion techniques include adversaries renaming or modifying UltraVNC binaries to mask their activity. Reliable detection requires appropriate logging configurations, specifically ensuring that process creation events are captured by Windows Security or Sysmon. Additionally, legitimate IT activities, such as managed remote support sessions, may trigger this alert. Companion detections, such as monitoring for unusual outbound connections or authentication patterns, can enhance overall visibility and context surrounding the use of remote access software.

