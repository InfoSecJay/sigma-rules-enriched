  ### Technical Context
  This Sigma rule is designed to detect suspicious process creations involving the use of **X509Enrollment**, which is often leveraged by attackers to manipulate or create digital certificates. Such behavior could indicate attempts to bypass security measures, especially when paired with malicious intentions such as impersonation or privilege escalation. Attackers may seek to deploy undetected backdoors or manipulate SSL/TLS communications to establish a foothold within a network.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion** (TA0005) and specifically the technique **Fake TLS Certificates** (T1553.004). By using X509Enrollment in their operations, adversaries utilize legitimate tools for illegitimate actions—enhancing their stealth and complicating detection efforts.

  The primary data sources for this detection include **process creation logs** from Windows operating systems, which provide visibility into the commands executed and the processes spawned within the environment. This data can help analysts correlate suspicious activity with potential certificate manipulation or related attacks.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs for instances of `X509Enrollment.CBinaryConverter` and its associated GUID. Look for instances that deviate from normal operational behaviors or occur outside of expected administrative tasks.

  - **Examine Command-Line Arguments**: Investigate command-line arguments used in the detections. Pay particular attention to unusual or obfuscated commands that could indicate an attempt to disguise malicious activity.

  - **Correlate with User Activity**: Match the timestamps of the detected process creations with user login events and administrative access logs. This will help identify if legitimate administrative users are executing this command outside of their typical workflows.

  - **Assess Network Communications**: If possible, analyze outbound network traffic for unusual communications following the suspicious process creation event. Look for indicators of data exfiltration or connections to known malicious IP addresses.

  ### Prioritization
  This alert is categorized with a medium severity due to the potential impact on the enterprise. The use of X509Enrollment for certificate creation or manipulation poses serious risks, including undetected persistence and privilege escalation, making it imperative to investigate promptly.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on process creation logs alone, which may not capture all instances of malicious behavior, especially if the processes are carried out in a stealthy manner. The detection logic assumes that the execution of specific commands is abnormal; however, legitimate administrative activities might generate false positives. Moreover, proper logging settings must be configured on Windows systems to ensure that all relevant process creations are captured for this detection to function effectively.

