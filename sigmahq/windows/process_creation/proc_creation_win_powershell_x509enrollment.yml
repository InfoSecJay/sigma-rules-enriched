  ### Technical Context

  This rule detects the execution of processes utilizing the `X509Enrollment` class, specifically targeting the use of `X509Enrollment.CBinaryConverter` and a unique GUID directly related to certificate enrollment. Attackers may leverage this behavior to manipulate or steal certificates, thereby achieving persistence or evasion tactics. This activity aligns with the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and the technique "Application Layer Protocol" (T1553.004) due to the potential misuse of legitimate processes to obfuscate unauthorized actions. The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which detail process activity and command-line arguments.

  If this behavior is indeed malicious, the security impact could be significant, allowing attackers to perform actions like issuing fake certificates or communicating over trusted channels. This detection does NOT confirm malicious intent on its own; legitimate administrative actions may use similar commands and structures.

  ### Investigation Steps

  - **Review command-line arguments:** Check Security Event ID 4688 or Sysmon Event ID 1 for command-line usage of `X509Enrollment.CBinaryConverter` or the specified GUID. Legitimate usage may occur in administrative scripts but should be annotated and documented in your organization's change control logs.

  - **Assess process parentage:** Verify the parent process of the detected instance. A suspicious launcher, such as a PowerShell script or an obfuscated binary, typically indicates a malicious workflow rather than a benign administrative tool or application.

  - **Check for additional indicators:** Look for related artifacts in Security Event ID 5145 (File Share Access) and Security Event ID 5156 (Windows Filtering Platform), which may indicate unauthorized access or network communication involving certificate management processes.

  - **Inspect user context:** Identify the user account executing the process. Anomalous or unexpected accounts, particularly those with elevated privileges but lacking administrative roles, warrant higher scrutiny.

  - **Correlate with other detections:** Validate the alert against similar detections (e.g., related Sigma rule with ID 504d63cb-0dba-4d02-8531-e72981aace2c) which may provide additional context or confirm patterns of suspicious behavior.

  ### Prioritization

  This alert has a medium severity due to the potential impact of unauthorized certificate manipulation, which can severely undermine trust in communication channels. The chance of misuse is realistic, especially if employees misuse administrative tools, but occurs less frequently than more commonly weaponized techniques.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs from compromised systems or configurations that do not monitor process creations accurately. Legitimate administrative operations, especially from authorized personnel deploying certificates, may trigger this rule and require contextual evaluation. A companion detection for abnormal PowerShell usage can enhance visibility into possible malicious activities related to this behavior.

