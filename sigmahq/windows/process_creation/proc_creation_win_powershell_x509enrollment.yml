  ### Technical Context

  This Sigma rule detects the invocation of `X509Enrollment.CBinaryConverter`, a COM object associated with handling X.509 certificate enrollments, which may be used maliciously to bypass standard security mechanisms and install unauthorized certificates or create deceptive signatures. The likely attacker objective involves defense evasion and executing payloads without detection, particularly related to installing rogue certificates or impersonating legitimate entities.

  This behavior falls under the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Certificate Management" (T1553.004). The primary telemetry sources include Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1 for capturing the command line arguments tied to process creation. If malicious, the impact could include unauthorized access, data loss, or system compromise via misleading certificate-related activities. Importantly, this detection does NOT confirm that malicious activity has occurred; it merely indicates that the X509Enrollment process was called, warranting further investigation.

  ### Investigation Steps

  - **Examine process creation details:** Review Security Event ID 4688 and Sysmon Event ID 1 logs for the process creation details including CommandLine, ParentImage, and User. Look for command lines containing 'X509Enrollment.CBinaryConverter' or '884e2002-217d-11da-b2a4-000e7bbb2b09'. Malicious indicators include unusual or unexpected parent processes.

  - **Verify command line arguments:** Inspect the CommandLine arguments for suspicious parameters or payloads that deviate from standard enrollment activities, focusing on any obfuscated or encoded data. Legitimate command lines typically involve straightforward enrollment tasks without complex scripting.

  - **Correlate user account activity:** Check for the user account associated with the process execution in Windows Event ID 4624 logs. Confirm if the user has a legitimate reason for invoking X.509 processes. Abnormal or administrative accounts executing this process without valid context may indicate a security risk.

  - **Analyze the timing and frequency of execution:** Investigate the frequency of this event within a short time frame. Multiple invocations in rapid succession or during odd hours could signify an automated attack or exploitation attempt. Contextualize this against typical administrative activities.

  - **Monitor for associated file or registry modifications:** Validate if the execution leads to changes in the registry or creation of spurious certificates, particularly within locations like `HKLM\SOFTWARE\Microsoft\Cryptography\MachineKeys`. The presence of unusual file modifications or creations relevant to certificates is a high-conviction malicious indicator.

  ### Prioritization

  The alert should be treated with medium severity due to the potential significant security impact of misused certificate enrollment, combined with the likelihood of such methods being abused in targeted attacks. Given that certificate manipulation is a known tactic among advanced adversaries, it warrants prompt investigation for any related malicious activity.

  ### Blind Spots and Assumptions

  Detection could be evaded through techniques such as code obfuscation or using legitimate administrative scripts with hidden or altered command strings. Adequate and complete logging of process arguments and command execution is imperative for reliability in detection. Legitimate administrative tasks such as planned certificate renewals or group policy updates might occasionally trigger this alert. A related detection to consider includes monitoring for certificate-related changes in Windows Event ID 4740, which tracks certificate usage across the domain.

