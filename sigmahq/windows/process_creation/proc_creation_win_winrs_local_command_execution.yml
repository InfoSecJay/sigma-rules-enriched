title: Winrs Local Command Execution
id: bcfece3d-56fe-4545-9931-3b8e92927db1
status: experimental
description: |
  Detects the execution of Winrs.exe where it is used to execute commands locally.
  Commands executed this way are launched under Winrshost.exe and can represent proxy execution used for defense evasion or lateral movement.
references:
- https://cardinalops.com/blog/living-off-winrm-abusing-complexity-in-remote-management/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/winrs
author: Liran Ravich, Nasreddine Bencherchali
date: 2025-10-22
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.006
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # Note: Example of command to simulate (winrm needs to be enabled): "c:\Windows\System32\winrs.exe" calc.exe
  - Image|endswith: '\winrs.exe'
  - OriginalFileName: 'winrs.exe'
  selection_local_ip:
    CommandLine|contains|windash:
    - '/r:localhost'
    - '/r:127.0.0.1'
    - '/r:[::1]'
    - '/remote:localhost'
    - '/remote:127.0.0.1'
    - '/remote:[::1]'
  filter_main_remote:
    CommandLine|contains|windash:
    - "/r:"
    - "/remote:"
  condition: all of selection_* or (selection_img and not 1 of filter_main_*)
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of Winrs.exe, which allows command execution locally through the Windows Remote Shell, particularly targeting localhost or local IP addresses. The likely attacker objective is to execute commands without raising alarms, making it a potential method for lateral movement and defense evasion. This behavior aligns with the MITRE ATT&CK technique for lateral movement (T1021.006 – Remote Services: WinRM) and defense evasion (T1218 – Signed Binary Proxy Execution).

  Primary telemetry sources include Windows process creation logs and security event logs that capture command execution activities (e.g., Event ID 4688). If successful, this detection could indicate malicious behavior like an attacker attempting to maintain persistence or execute arbitrary commands without being directly observed. It’s important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also result in similar logs.

  ---

  ### Investigation Steps

  - **Analyze command details:** Review the command line associated with the Winrs.exe execution (Event ID 4688). Look for parameters containing `/r:localhost` or similar locals. Legitimate administrative tasks may include commands like `/r:localhost notepad.exe`.

  - **Verify Winrshost.exe behavior:** Check for the creation or execution of Winrshost.exe alongside Winrs.exe. Look for the process Tree indicating a child-parent relationship between these executables. This is frequently seen in malicious use but can also be involved in valid administrative use.

  - **Cross-reference user actions:** Identify the user or service account associated with the command execution. Determine if this is a typical user or an administrator performing the action during the incident.

  - **Identify malicious indicators:** Look for recent changes or abnormal patterns related to the time the alert was triggered. For example, sudden executions of scripts or commands not commonly used by administrators should be flagged.

  - **Correlate with event logs:** Search system event logs (Event ID 4688) that may give context on the execution, particularly looking for any previously scheduled tasks or automation scripts that could trigger this activity legitimately.

  - **Check for additional remote connections:** Review Windows Firewall logs for any blocked or allowed connections to local services (particularly for WinRM) around the same time as the Winrs.exe execution to identify possible lateral movement patterns.

  ---

  ### Prioritization

  The alert severity is high due to the critical impact on systems that allow local command execution via Winrs, which is a common technique used by attackers to move laterally within a network. Given the likelihood of abuse for lateral movement and the strategic use of this technique in advanced persistent threat scenarios, prompt investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques, such as using alternative or obfuscated command executions. The rule relies on having detailed process creation logs enabled, which should be appropriately configured for reliable detection. Legitimate administrative tasks, such as routine systems maintenance or troubleshooting, may trigger the alert. A related detection could include monitoring for unusual WinRM traffic patterns, providing a contextual understanding of how Winrs may be used nefariously.

