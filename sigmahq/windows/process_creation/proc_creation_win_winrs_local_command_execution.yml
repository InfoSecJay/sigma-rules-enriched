title: Winrs Local Command Execution
id: bcfece3d-56fe-4545-9931-3b8e92927db1
status: experimental
description: |
  Detects the execution of Winrs.exe where it is used to execute commands locally.
  Commands executed this way are launched under Winrshost.exe and can represent proxy execution used for defense evasion or lateral movement.
references:
- https://cardinalops.com/blog/living-off-winrm-abusing-complexity-in-remote-management/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/winrs
author: Liran Ravich, Nasreddine Bencherchali
date: 2025-10-22
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.006
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # Note: Example of command to simulate (winrm needs to be enabled): "c:\Windows\System32\winrs.exe" calc.exe
  - Image|endswith: '\winrs.exe'
  - OriginalFileName: 'winrs.exe'
  selection_local_ip:
    CommandLine|contains|windash:
    - '/r:localhost'
    - '/r:127.0.0.1'
    - '/r:[::1]'
    - '/remote:localhost'
    - '/remote:127.0.0.1'
    - '/remote:[::1]'
  filter_main_remote:
    CommandLine|contains|windash:
    - "/r:"
    - "/remote:"
  condition: all of selection_* or (selection_img and not 1 of filter_main_*)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of `Winrs.exe`, particularly when commands are executed locally via WinRM (Windows Remote Management). The primary concern is that `Winrs.exe` can serve as a means for attackers to perform lateral movement or evade defenses by executing commands under `Winrshost.exe`, potentially allowing them to manipulate systems without raising alarms.

  Attackers might leverage this technique to execute malicious commands or scripts locally, taking advantage of the built-in Windows functionality. The key objectives for such activities generally include gaining unauthorized access to systems, escalating privileges, or maintaining persistence.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Lateral Movement (TA\_community-attack.lateral-movement)
     - Remote Services: WinRM (T1021.006)
  - Defense Evasion (TA\_community-attack.defense-evasion)
     - Application Layer Protocol Manipulation (T1218)

  The primary data source for this detection is process creation events, specifically monitoring for instances of `Winrs.exe` executed with particular command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine process creation logs for instances of `Winrs.exe`, particularly focusing on commands executed with parameters indicating local execution (e.g., `/r:localhost`).
  - **Analyze Command-line Arguments**: Scrutinize the command-line arguments used with `Winrs.exe` to identify any suspicious or unexpected commands being executed to understand the intent behind the command.
  - **Check for Remote Management Configuration**: Verify the configuration of WinRM services on the affected system to identify any unauthorized modifications or potentially insecure settings that could facilitate misuse.
  - **Investigate Related User Activity**: Correlate the execution of `Winrs.exe` with user login activity or any indications of lateral movement within the network to assess if this command is part of a broader, suspicious pattern.

  ### Prioritization
  This alert is high-severity due to the potential impact of lateral movement and defense evasion by unauthorized users or threat actors, which can lead to significant compromises within the enterprise environment.

  ### Blind Spots and Assumptions
  There are potential gaps in detection if the logging level for process creation events is not properly configured or if `Winrs.exe` is being executed in a legitimate administrative context. The detection logic assumes that any local execution via WinRM using `Winrs.exe` is suspicious, which may not account for legitimate operational tasks. Ensuring proper logging of WinRM activities is critical for this alert to function effectively.

