title: Winrs Local Command Execution
id: bcfece3d-56fe-4545-9931-3b8e92927db1
status: experimental
description: |
  Detects the execution of Winrs.exe where it is used to execute commands locally.
  Commands executed this way are launched under Winrshost.exe and can represent proxy execution used for defense evasion or lateral movement.
references:
- https://cardinalops.com/blog/living-off-winrm-abusing-complexity-in-remote-management/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/winrs
author: Liran Ravich, Nasreddine Bencherchali
date: 2025-10-22
tags:
- attack.lateral-movement
- attack.stealth
- attack.t1021.006
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # Note: Example of command to simulate (winrm needs to be enabled): "c:\Windows\System32\winrs.exe" calc.exe
  - Image|endswith: '\winrs.exe'
  - OriginalFileName: 'winrs.exe'
  selection_local_ip:
    CommandLine|contains|windash:
    - '/r:localhost'
    - '/r:127.0.0.1'
    - '/r:[::1]'
    - '/remote:localhost'
    - '/remote:127.0.0.1'
    - '/remote:[::1]'
  filter_main_remote:
    CommandLine|contains|windash:
    - "/r:"
    - "/remote:"
  condition: all of selection_* or (selection_img and not 1 of filter_main_*)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of `winrs.exe`, a Windows Remote Shell utility, specifically when used to run commands locally. Attackers may leverage `winrs.exe` for lateral movement or defense evasion techniques by executing commands directly on a machine rather than remotely, aiming to avoid detection. The relevant MITRE ATT&CK tactics are Lateral Movement (TA0008) and Command and Control (TA0011), with techniques T1021.006 (Remote Services: WinRM) and T1218 (Signed Binary Proxy Execution).

  The primary telemetry source is the Windows process creation logs, specifically looking for Event ID 4688 or Sysmon Event ID 1. If an attack is successful, this can lead to unauthorized access, system compromise, or data exfiltration. It is important to note that this detection does NOT confirm malicious intent solely based on the observance of `winrs.exe` usage, as it could also reflect legitimate administrative actions.

  ### Investigation Steps

  - **Check execution context:** Review Event ID 4688 logs for `winrs.exe` to verify the user context under which the command was executed. Look for any non-administrative accounts or suspicious user names that might indicate misuse.

  - **Examine command line arguments:** Look at the `CommandLine` field in Event ID 4688 logs. Confirm if it contains `/r:localhost` or similar indicators, which suggest local command execution. Legitimate uses often involve administrative scripts or tool management.

  - **Identify high-confidence indicators:** If the command line contains any unusual or suspicious commands (e.g., `calc.exe` or other non-administrative applications), treat this as a high-confidence malicious indicator warranting further investigation.

  - **Cross-reference with execution logs:** Correlate the usage of `winrs.exe` with related processes (e.g., `winrshost.exe`), checking Sysmon Event ID 1 for process creation and termination in case of rapid execution cycles or unusual parent-child process relationships.

  - **Review host roles and criticality:** Determine if the system running `winrs.exe` is critical to operations (like a Domain Controller or application server) and the impact of a potential compromise. Focus on endpoints that handle sensitive information.

  - **Monitor for known benign activities:** Note that legitimate usage of `winrs.exe` typically occurs during remote management tasks by IT staff. Confirm scheduled tasks or maintenance scripts that might trigger usage to rule out false positives.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and the likelihood of malicious exploitation through lateral movement. Since tools like `winrs.exe` can be weaponized for evasion and local command execution, immediate investigation is essential to prevent unauthorized access or data compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log process creation events or improper filtering of legitimate activity. Users with administrative roles may trigger this alert during normal operations. It’s essential to configure Windows logging correctly to capture all necessary details for reliable detection. A related detection, such as monitoring for unusual PowerShell commands (T1086), can strengthen coverage against lateral movements and command execution abuse.

