title: Winrs Local Command Execution
id: bcfece3d-56fe-4545-9931-3b8e92927db1
status: experimental
description: |
  Detects the execution of Winrs.exe where it is used to execute commands locally.
  Commands executed this way are launched under Winrshost.exe and can represent proxy execution used for defense evasion or lateral movement.
references:
- https://cardinalops.com/blog/living-off-winrm-abusing-complexity-in-remote-management/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/winrs
author: Liran Ravich, Nasreddine Bencherchali
date: 2025-10-22
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.006
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # Note: Example of command to simulate (winrm needs to be enabled): "c:\Windows\System32\winrs.exe" calc.exe
  - Image|endswith: '\winrs.exe'
  - OriginalFileName: 'winrs.exe'
  selection_local_ip:
    CommandLine|contains|windash:
    - '/r:localhost'
    - '/r:127.0.0.1'
    - '/r:[::1]'
    - '/remote:localhost'
    - '/remote:127.0.0.1'
    - '/remote:[::1]'
  filter_main_remote:
    CommandLine|contains|windash:
    - "/r:"
    - "/remote:"
  condition: all of selection_* or (selection_img and not 1 of filter_main_*)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Winrs.exe for local command execution on Windows systems. This behavior is characteristic of an attacker leveraging the Windows Remote Management (WinRM) framework to execute commands locally, which may indicate attempts at lateral movement or evasion of defenses. The relevant MITRE ATT&CK tactics are **Lateral Movement (TA0011)** using the technique **Remote Services: WinRM (T1021.006)** and **Defense Evasion (TA0005)** with the technique **Trusted Developer Utilities (T1218)**.

  The primary telemetry source is process creation logs, specifically focusing on Event ID 4688 within Windows Security logs or Sysmon Event ID 1. If this activity is deemed malicious, it may allow an adversary to execute arbitrary commands remotely or locally, posing a significant security risk. Notably, this detection does NOT confirm malicious intent by itself and requires further investigation to ascertain the legitimacy of the command execution.

  ### Investigation Steps

  - **Identify the command execution context:** Review the command line associated with the Winrs process (Security Event ID 4688 or Sysmon Event ID 1). Look for indications of local proxy execution (e.g., parameters like `/r:localhost`, `/remote:127.0.0.1`). Legitimate usage typically involves standard administrative tasks and management commands, as opposed to unexpected or unusual executions.

  - **Check the parent process:** Assess the parent process of `winrs.exe` (Event ID 4688: New Process ID/Parent Process ID). If `winrs.exe` was launched by a legitimate administrative tool (like PowerShell or Task Scheduler), it may indicate benign activity, whereas a suspicious parent process could point to malicious intent.

  - **Correlate with user activity:** Cross-reference the user's account who executed the command with user login logs (Security Event ID 4624). Legitimate administrative users should be validated against normal behavior patterns to differentiate between routine maintenance and potential abuse.

  - **Verify executed commands:** Analyze the commands executed through Winrs (found in the CommandLine field). Look for known malicious commands or deviations from typical usage patterns related to your organization's operational procedures. Suspicious commands indicative of lateral movement, such as those attempting to interact with sensitive system resources, warrant further investigation.

  - **Monitor network connections:** Investigate any network connections initiated by `winrs.exe`, particularly those going to unusual endpoints or communicating over non-standard ports. This can be validated through network logs, which might indicate data exfiltration or connection to a command and control infrastructure.

  - **Review configuration settings:** Ensure that WinRM configurations aren’t open to unnecessary exposure to unauthorized users. Check Group Policy settings related to WinRM and validate that only authorized personnel are allowed access.

  ### Prioritization

  Given the potential for lateral movement and command execution on critical systems, this alert should be treated with high severity. The likelihood of malicious abuse is significant due to common attacker techniques leveraging WinRM for evasion and remote execution. Due to its potential for being abused, any detection of this behavior warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the necessary logging for process creation is not enabled on targeted hosts. Attackers may evade detection using techniques such as process hollowing or executing commands through legitimate administrative scripts. Additionally, trusted administrative applications might trigger this alert during standard operations, indicating false positives. Related detections include monitoring for unusual usage of PowerShell (T1086) or any other remote management tools to strengthen overall coverage against lateral movement activities.

