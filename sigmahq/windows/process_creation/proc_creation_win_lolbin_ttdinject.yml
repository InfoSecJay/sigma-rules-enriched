  ### Technical Context
  This detection rule identifies the execution of `TTDInject.exe`, a legitimate binary that is part of the Time Travel Debugging feature introduced in Windows 10 version 1809 and later. This feature allows developers to debug applications by capturing the execution state and “rewinding” to diagnose issues. However, malicious actors may take advantage of this tool to execute malicious code or perform undetected debugging to bypass security controls, acting as a potential vector for evading detection while conducting attacks on enterprise environments.

  The primary objective of using `TTDInject.exe` in a malicious context often relates to evading detection during lateral movement or the execution of arbitrary code, as it can inject code into processes under the guise of legitimate debugging. This behavior falls under the MITRE ATT&CK tactics of **Defense Evasion** (ID: T1562) and is specifically associated with the technique **Impair Defenses** (ID: T1127), where attackers seek to manipulate or circumvent security mechanisms.

  The best sources for evidence to support this detection rule are Windows process creation logs, specifically those that capture the execution of processes. Monitoring these logs can provide insights into unusual activity related to `TTDInject.exe`, including identifying if, and how often, it is being utilized outside of standard development practices.

  ### Investigation Steps
  - **Examine Process Creation Logs:** Analyze the Windows process creation logs for instances of `TTDInject.exe`. Look for any commands that may suggest injection activity or the execution context that deviates from typical development processes.

  - **Check Parent Process Relationships:** Investigate the parent processes of any `TTDInject.exe` executions. Legitimate usages often originate from development tools or environments, while suspicious contexts may include unknown or malicious executables.

  - **Review Anomalous Debugger Activity:** Inspect logs for any debug-related activities that follow the execution of `TTDInject.exe`. Look specifically for signs of code injection or suspicious handling of process states, which may indicate malicious intent.

  - **Correlate with Other Security Logs:** Cross-reference findings with other sources, such as EDR and firewall logs, to identify any corresponding anomalous network activity or suspicious file access that may follow the execution of this binary.

  ### Prioritization
  The alert is deemed medium in severity due to the potential for `TTDInject.exe` to be misused for malicious activities, coupled with the fact that its presence in legitimate development contexts can lead to false positives. However, the threat of enabling an attacker to bypass defenses warrants timely investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the legitimate use of `TTDInject.exe` by authorized developers, which may lead to false positives that complicate investigations. The detection logic assumes that the execution of this binary is not common in the environment outside of development, which may not hold true in all organizations. This alert will function correctly only if process creation logs are enabled and properly configured to capture detailed information about process executions.

