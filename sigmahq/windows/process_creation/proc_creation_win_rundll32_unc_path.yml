note: |
  ### Technical Context
  This detection rule focuses on identifying instances where the `rundll32.exe` process is executed with a command-line argument that includes a Universal Naming Convention (UNC) path, indicating that a dynamic link library (DLL) is being loaded from a potentially malicious remote location. Such behavior is a common tactic employed by attackers to execute malicious code without raising alarms, as `rundll32` is a legitimate Windows utility used for loading and executing DLLs.

  The threat scenario typically involves an attacker attempting to achieve lateral movement within a network or executing malicious payloads from a compromised system. The use of UNC paths often signifies that the attacker could be leveraging shared resources or external servers for hosting their malicious code, which may evade traditional endpoint defenses. Key MITRE ATT&CK tactics and techniques relevant to this detection include **Execution (T1203)**, **Lateral Movement (T1021.002)**, and **Defense Evasion (T1218.011)**, illustrating the multi-faceted approach attackers may use.

  The primary data sources for this detection include process creation logs from endpoints, which capture details about executed processes, their command lines, and associated user account information. These logs are essential in revealing the context of execution that either may indicate legitimate administrative tasks or malicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation logs specifically looking for entries that involve `rundll32.exe` with `CommandLine` containing UNC paths. Check for the user accounts associated with these executions to identify any unauthorized use.

  - **Analyze Suspicious Network Activity:** Investigate network logs to determine the legitimacy of the UNC paths used. Look for connections to unfamiliar hosts or unusual file shares to identify potential external commands or payloads being downloaded.

  - **Correlate with User Behavior:** Compare the command execution against user roles and behaviors. If a non-administrative user triggers `rundll32` with a UNC path, it raises red flags that warrant deeper investigation.

  - **Examine Security Alerts and Logs:** Check for additional alerts across other security tools (such as EDR or NDR) that may coincide with the execution of `rundll32.exe`, to understand the broader context of the potential compromise or attack.

  ### Prioritization
  Due to the possibility of malicious code execution and lateral movement associated with UNC path usage, alerts generated by this detection rule are categorized as high severity. Attackers using this method have the potential for significant impact on the network, leading to data breaches, system compromises, or further infiltration.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in effectiveness if logs for process creation are not being collected consistently across all endpoints, particularly those in high-risk areas such as remote access servers or file servers. It assumes that any legitimate use of `rundll32` will not frequently utilize UNC paths, which could lead to false negatives if legitimate processes are misidentified. Additionally, accurate detection relies on proper configurations to ensure that all necessary process creation data is captured, which may vary by environment.

