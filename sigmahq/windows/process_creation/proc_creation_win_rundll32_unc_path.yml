  ---

  ### Technical Context

  This rule detects the execution of `rundll32.exe` with a command line that includes a UNC path, indicating that a DLL is being executed from a remote share. The likely attacker objective is to execute malicious code without leaving a significant footprint, which falls under MITRE ATT&CK Tactic: Execution (ID: TA0002) and Technique: Command-Line Interface (ID: T1218.011). Primary telemetry sources include Windows Event ID 4688 (Process Creation) or Sysmon Event ID 1, which logs detailed process creation events. If this behavior is malicious, it could lead to system compromise or lateral movement across the network. However, this detection does NOT confirm that the executed code is definitively malicious; further investigation is required.

  ---

  ### Investigation Steps

  - **Check event logs for evidence of execution**: Review Windows Event ID 4688 or Sysmon Event ID 1 for the command line execution of `rundll32.exe` containing `\\` within the command line.

  - **Identify the source of the UNC path**: Lookup the UNC path in the command line to assess whether it points to a known or legitimate server asset versus an unusual or suspicious file share.

  - **Verify expected behavior of rundll32.exe**: Confirm if legitimate applications or processes within the environment commonly execute `rundll32.exe` with remote DLLs. Document any expected command patterns for baseline comparison.

  - **Assess endpoint context and user behavior**: Note the executing user account and the host machine. Check if recent login patterns or user behavior align with known operations, especially for high-value asset servers.

  - **Cross-reference against threat intelligence**: Use threat intelligence sources to see if the identified UNC path corresponds to reported malicious activity related to known threat actor techniques, specifically those leveraging `rundll32.exe`.

  - **Look for additional indicators of compromise (IOCs)**: Search for related artifacts such as file creation events or network connections associated with the UNC path, especially around the time of execution, to identify any data exfiltration or lateral movement activity.

  ---

  ### Prioritization

  This alert should be treated with high priority in an enterprise context due to the potential impact of executing remote code on trusted systems, the likelihood that these actions can be exploited by adversaries, and the common use of this technique in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may miss attempts where the adversary modifies process behaviors through obfuscation or crafting alternate command parameters. Successful detection requires appropriate monitoring of Event IDs, particularly ensuring Sysmon is properly configured in the environment. Legitimate administrative tasks such as software updates from trusted network shares may inadvertently trigger this alert, highlighting a need for context-based review. A related detection to strengthen coverage is monitoring for unusual process executions from less common applications that might serve as a front for malicious actions.

