note: |
  ### Technical Context

  This rule detects the execution of `rundll32.exe` with a command line that includes a UNC (Universal Naming Convention) path pointing to a remote share. This behavior is often exploited by attackers to run malicious DLLs hosted on external shares, potentially as part of lateral movement or to execute remote payloads. The likely attacker objective is executing malware without transferring the file directly to the victim machine, thereby reducing the chance of detection.

  This relates to the MITRE ATT&CK technique: Lateral Movement (T1021.002) and Execution via Command and Scripting Interpreter (T1218.011). The primary telemetry source for this detection is process creation logs from Windows, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, the security impact could involve unauthorized access, data exfiltration, or compromising additional systems. Importantly, this detection does NOT confirm malicious intent without additional context regarding the legitimacy of the executed DLL.

  ### Investigation Steps

  - **Identify Process Details:** Retrieve the process creation event for `rundll32.exe` using Security Event ID 4688 or Sysmon Event ID 1. Check the `CommandLine` field for UNC path references and note the user account under which the process was initiated.

  - **Validate UNC Path Usage:** Examine the UNC path in the command line. If it points to a known and trusted internal share used for legitimate operations, it may be benign. Conversely, if the UNC path leads to an untrusted source (e.g., external URL or unknown file share), it is likely malicious.

  - **Review User Behavior:** Cross-reference the user account executing the command against a list of expected roles or activities. Users with legitimate reasons to initiate `rundll32.exe` might include system administrators or automated services executing maintenance scripts.

  - **Check for High-Confidence Indicators:** Investigate recent connections to the UNC path (e.g., via SMB logs). Look for patterns indicating multiple accesses from different systems, which could indicate lateral movement or exploitation.

  - **Assess Related Artifacts:** If a malicious execution is confirmed, look for auxiliary indicators such as recent file creation or deletion in relation to the executed DLL. This can include monitoring Windows Event Logs (e.g., File System Events) for suspicious file operations around the same timeframe.

  - **Reference Security Tools:** Utilize endpoint detection tools to gather additional context on the running instance of `rundll32.exe`, tracking any further actions it may take such as creating new processes or network connections.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical systems, especially if `rundll32.exe` is executing malicious payloads from external sources. The likelihood of exploitation is significant since this method is frequently utilized by attackers for lateral movement and initial execution of code during a breach.

  ### Blind Spots and Assumptions

  The detection might miss cases where attackers use obfuscation techniques in command-line arguments or employ legitimate DLLs from trusted locations, as these might be perceived as benign. It requires accurate process logging configuration to avoid gaps in monitoring. Legitimate activity such as administrative scripts or scheduled tasks may trigger this alert. A related detection to consider is for anomalous SMB traffic, which could indicate broader lateral movement efforts.

