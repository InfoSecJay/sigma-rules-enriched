note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` with a command line argument pointing to a DLL located on a remote UNC path. This behavior is indicative of an attacker using `rundll32` to execute potentially malicious code hosted on a remote server, often as part of lateral movement or to evade local security controls. The likely objective of an attacker executing this command is to run malicious code on a target system without alerting traditional security solutions.

  This behavior aligns with the MITRE ATT&CK tactic for "Execution" (TA0002) and the technique "Remote Services: UNC Path Execution" (T1021.002), as well as the technique for "Dll Sideloading" (T1218.011). The primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, focusing on the command-line arguments. If the detected behavior is malicious, it could potentially lead to unauthorized access, data exfiltration, or a complete system compromise. However, this detection does NOT confirm that the behavior is malicious alone, as it could be initiated by legitimate applications under certain conditions.

  ### Investigation Steps

  - **Examine the Command Line Arguments:** Check for UNC paths in the command line of Security Event ID 4688 or Sysmon Event ID 1. Look for patterns like `\\servername\share\malicious.dll`. Legitimate use typically involves local paths or known trusted directories.

  - **Review the Source of the Executable:** Validate the integrity of `rundll32.exe` by checking its file properties. Look for OriginalFileName being 'RUNDLL32.EXE', and confirm that it resides in the `C:\Windows\System32` or trusted directories. Any other location warrants further investigation.

  - **Collect Network Activity Logs:** Inspect network logs for connections to the UNC path referenced in the command line. Look for unusual SMB traffic towards unusual hosts or shares, which may indicate a system trying to pull malicious code from a remote server.

  - **Check Process Hierarchy:** Use tools such as Sysinternals’ Process Explorer to examine parent-child relationships. Determine if `rundll32.exe` was spawned by a known process (e.g., a legitimate system process) or a suspicious one. Malicious invocations often have unexpected parent processes.

  - **Identify System Impact:** Assess the importance of the affected host in your environment. Critical systems executing `rundll32` with UNC paths should be prioritized for immediate investigation.

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant systemic impact. The execution of code from a remote location using `rundll32` is a tactic commonly used by adversaries for lateral movement and deploying payloads, suggesting a high likelihood of malicious intent.

  ### Blind Spots and Assumptions

  There are inherent limitations as attackers may use encoding or obfuscation techniques to conceal the command line, which can evade detection. Ensure that relevant logging (e.g., Sysmon, Windows Security logs for process creation) is correctly configured to capture necessary telemetry. Legitimate administrative tasks may result in similar alerts, such as IT management activities involving remote scripts. A related detection rule for "Windows Process Creation with Suspicious Parent/Child Relationships" could strengthen coverage against exploitation behavior.

