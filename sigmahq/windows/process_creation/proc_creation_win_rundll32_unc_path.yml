note: |
  ### Technical Context

  This rule detects the execution of `rundll32.exe` with a command line that specifies a DLL located on a remote location (UNC path). Such behavior is typically employed by attackers as a method for executing malicious code stored on a shared network resource, often as a means of lateral movement within a network. The likely attacker objective is to leverage `rundll32` to run malicious payloads without directly writing to local disk, evading some conventional defenses.

  The relevant MITRE ATT&CK techniques are **Execution (T1203)** and **Lateral Movement (T1021.002)**. The primary telemetry sources are Windows process creation logs, specifically focusing on Security Event ID 4688 for process creation events and Sysmon Event ID 1 for detailed process and command line tracking. If malicious, this behavior can lead to unauthorized access, data exfiltration, or further incursions into the environment. This detection does not confirm whether the executed command is indeed malicious, as `rundll32.exe` can also be utilized for legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Examine process creation details:** Review Security Event ID 4688 and Sysmon Event ID 1 logs. Verify if `rundll32.exe` command line arguments contain a UNC path (e.g., `\\server\share\file.dll`). Malicious: Uses UNC paths. Benign: Direct local paths only.

  - **Identify associated network activity:** Look at network logs (e.g., Firewall rules, IDS logs) for connections made to the UNC destination during the time of execution. Malicious: Unexpected outbound connections to infrequently accessed shares; Benign: Standard business-related traffic to known UNC paths.

  - **Inspect user context for execution:** Confirm the user account running the `rundll32.exe` process. Correlate this with expected operational behavior. Malicious: Execution by non-privileged or anomalous user accounts; Benign: Executed by administrative accounts during normal operations.

  - **Check for suspicious DLLs:** Review the DLL being executed with `rundll32.exe`. Validate the source and integrity of this DLL against known lists. Malicious: Unrecognized or known malicious DLLs; Benign: Authorized and regularly used libraries.

  - **Assess temporal patterns:** Determine the timing of the `rundll32.exe` executions relative to other security events. A concerted attack might manifest with this command around the same time as other suspicious activities.

  ---

  ### Prioritization

  This alert should be considered high severity due to its potential impact on the organization’s security posture. The use of `rundll32.exe` with a remote DLL could indicate an active compromise of a network resource, and such behaviors are often weaponized in real-world attacks. The likelihood of malicious abuse is significant, especially in mature enterprise environments where lateral movement is a common goal for threat actors.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by environments where process execution logging is not properly configured. Attackers may use different executable names or obfuscate command lines to avoid detection. Legitimate administrative actions or business operations may result in similar command usage with `rundll32.exe`, especially in environments supporting shared resources. A related detection to strengthen coverage could be monitoring for unusual SMB activity, as it often accompanies unauthorized access.

