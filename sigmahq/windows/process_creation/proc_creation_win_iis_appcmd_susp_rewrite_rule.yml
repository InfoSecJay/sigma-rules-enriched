title: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
status: test
description: Detects usage of "appcmd" to create new global URL rewrite rules. This
  behaviour has been observed being used by threat actors to add new rules so they
  can access their webshells.
references:
- https://twitter.com/malmoeb/status/1616702107242971144
- https://learn.microsoft.com/en-us/answers/questions/739120/how-to-add-re-write-global-rule-with-action-type-r
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\appcmd.exe'
  - OriginalFileName: 'appcmd.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'set'
    - 'config'
    - 'section:system.webServer/rewrite/globalRules'
    - 'commit:'
  condition: all of selection_*
falsepositives:
- Legitimate usage of appcmd to add new URL rewrite rules
level: medium
note: |
  ### Technical Context
  This rule is designed to detect potentially malicious use of the `appcmd` command-line tool in Microsoft Internet Information Services (IIS). It focuses on the creation of new global URL rewrite rules which attackers may utilize to establish persistence or redirect traffic to malicious webshells. In a typical attack scenario, a threat actor may leverage this method to create or modify configurations on a compromised web server, enabling them to respond to remote commands or control access to certain resources.

  The alert is particularly relevant in the context of the MITRE ATT&CK framework, specifically under the tactics of **Defense Evasion** (TA0005). The techniques applicable here include **Web Service Permissions** (T1194) and **System Information Discovery** (T1082), as attackers may aim to understand the web server's configuration or reconfigure it to facilitate further exploitation. Primary data sources that would provide the necessary telemetry include process creation events that log `appcmd` executions, aiding in the identification of methods by which configuration changes were made on the server.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for instances of `appcmd.exe` with a command line containing keywords like 'set', 'config', 'section:system.webServer/rewrite/globalRules', and 'commit:' to identify any unauthorized modifications made to global rewrite rules.

  - **Correlate with Web Server Logs:** Analyze IIS logs for unusual access patterns or requests around the time the `appcmd` command was executed to identify if the created rules have facilitated unexpected web traffic or access to webshells.

  - **Assess User Activity:** Track the user account under which `appcmd` was executed. Determine if it aligns with legitimate administrative actions or if it indicates a potential compromise, especially if performed by non-administrative users.

  - **Investigate File Changes:** Review web server configuration files associated with IIS to identify any unauthorized changes made to URL rewrite rules or other related settings which could signal persistence mechanisms being established by an attacker.

  ### Prioritization
  This alert should be regarded with medium severity as it indicates a potential threat to web infrastructure, particularly as it could enable further exploitation if an attacker is able to create and use webshells. The likelihood of detection may vary based on the environment and existing defenses.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging is not enabled for `process_creation` events or if the necessary permissions are not set for audit logging in IIS configurations. The detection logic assumes that any use of `appcmd` by users outside of known administrative activities is suspicious. It also relies heavily on the comprehensive logging of command lines used, indicating a need for proper logging configurations to be established for effective monitoring and detection.

