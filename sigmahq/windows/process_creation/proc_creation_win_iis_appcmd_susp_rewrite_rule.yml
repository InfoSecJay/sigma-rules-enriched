title: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
status: test
description: Detects usage of "appcmd" to create new global URL rewrite rules. 
  This behaviour has been observed being used by threat actors to add new rules 
  so they can access their webshells.
references:
- https://twitter.com/malmoeb/status/1616702107242971144
- https://learn.microsoft.com/en-us/answers/questions/739120/how-to-add-re-write-global-rule-with-action-type-r
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\appcmd.exe'
  - OriginalFileName: 'appcmd.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'set'
    - 'config'
    - 'section:system.webServer/rewrite/globalRules'
    - 'commit:'
  condition: all of selection_*
falsepositives:
- Legitimate usage of appcmd to add new URL rewrite rules
level: medium
note: |
  ### Technical Context

  This rule detects the use of the "appcmd" utility, specifically commands to create or modify global URL rewrite rules within IIS (Internet Information Services). The likely attacker objective is to establish a means of persistence or access via webshells by manipulating HTTP traffic through custom rules. This detection aligns with the MITRE ATT&CK tactic of Persistence (Tactics: Persistence | Techniques: Web Shells [T1505]). The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688 for process creation or Sysmon Event ID 1. If successful, an attacker could leverage these rules to redirect traffic or expose sensitive interfaces. Importantly, this detection alone does not confirm malicious intent, as legitimate administration of IIS may involve similar commands.

  ### Investigation Steps

  - **Check the process creation details:** Review Security Event ID 4688 or Sysmon Event ID 1 to identify the process "appcmd.exe." Check the "CommandLine" field for indications of URL rewrite configuration.

  - **Analyze command parameters:** Investigate the command-line parameters included with "appcmd" to confirm they include "set" and "commit:" referencing globalRules. The presence of these specific strings is a high-confidence malicious indicator.

  - **Evaluate the account used:** Determine the user or service account executing the command. If the context is unexpected (e.g., a standard user account executing IIS configurations instead of an administrator), this raises suspicion.

  - **Correlate with expected activity:** Review logs or change management documentation for any legitimate usages of "appcmd.exe" related to URL rewrites. This can include recent IT maintenance windows or planned updates to web applications.

  - **Inspect IIS configuration logs:** Check IIS logs for recent changes or access patterns indicative of webshells. Look for unusual access times or request methods (POST, GET) from internal servers that do not align with baseline activity.

  ### Prioritization

  The severity of this alert is medium, as it indicates potential unauthorized manipulation of IIS configurations, which can impact system availability and confidentiality. Given that attackers often exploit web configurations, the likelihood of malicious abuse is significant, especially if followed by webshell activity.

  ### Blind Spots and Assumptions

  Detection is limited by the fact that legitimate administrators may use appcmd for benign purposes, complicating true positive identification. Comprehensive coverage requires detailed logging from appcmd and IIS access logs to understand the full context of changes. Legitimate activities may involve authorized use during maintenance windows; therefore, correlating logs with change management records is crucial. A related detection could include monitoring HTTP requests that indicate webshell activity, such as calls to suspicious endpoints reflecting arbitrary file execution.

