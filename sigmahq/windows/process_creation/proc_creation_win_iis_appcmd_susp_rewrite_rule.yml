title: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
status: test
description: Detects usage of "appcmd" to create new global URL rewrite rules. 
  This behaviour has been observed being used by threat actors to add new rules 
  so they can access their webshells.
references:
- https://twitter.com/malmoeb/status/1616702107242971144
- https://learn.microsoft.com/en-us/answers/questions/739120/how-to-add-re-write-global-rule-with-action-type-r
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\appcmd.exe'
  - OriginalFileName: 'appcmd.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'set'
    - 'config'
    - 'section:system.webServer/rewrite/globalRules'
    - 'commit:'
  condition: all of selection_*
falsepositives:
- Legitimate usage of appcmd to add new URL rewrite rules
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `appcmd.exe` with commands to create global URL rewrite rules within IIS, a behavior indicative of attempting to manipulate web server configurations. Threat actors may use this tactic to persist webshells or enable unauthorized access to their remote payloads. The relevant MITRE ATT&CK tactic and technique are Defense Evasion (T1070.001) and Web Shell (T1100). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688. If the rule triggers due to malicious activity, the attacker may gain control over the web server, allowing further exploitation or data exfiltration. Importantly, this detection does NOT confirm that malicious activity has occurred; it merely indicates that suspicious behavior related to URL rewrite rules is present.

  ### Investigation Steps

  - **Check process details:** Review Security Event ID 4688 for `appcmd.exe` creation, focusing on CommandLine fields for evidence of `set config section:system.webServer/rewrite/globalRules commit:`. Malicious instances will likely contain unusual parameters or appear at odd hours.

  - **Correlate with web server logs:** Examine IIS logs (W3C format, Event IDs 501, 502) around the time of `appcmd` execution. Look for access patterns to newly created rules or access to webshell locations that deviate from normal usage patterns.

  - **Assess expected behavior:** Identify legitimate use cases for `appcmd.exe` in your environment (e.g., administrative scripts or scheduled tasks) by checking with system administrators to understand typical rewrite rule changes and timing.

  - **Identify known malicious indicators:** Look for patterns or IP addresses associated with known exploit attempts or payloads in correlated logs (e.g., unusual outbound connections made at the time of the appcmd execution).

  - **Validate configuration changes:** Check for changes made to the IIS `ApplicationHost.config` file around the time of the alert using tools like File Integrity Monitoring. Legitimate changes should have accompanying documentation or change logs.

  ### Prioritization

  The alert is of medium severity. Affected systems hosting web applications can become critical points of exploitation. The behavior noted here is notably weaponized by actors aiming to achieve persistence or maintain control over compromised environments, warranting immediate investigation.

  ### Blind Spots and Assumptions

  This detection has limitations, as actors may obfuscate their use or rely on legitimate administrative access to avoid detection. Required log sources include detailed IIS configuration change auditing, which may not always be enabled by default. Legitimate administrative changes, particularly during scheduled maintenance, may trigger this alert. Related detections such as abnormal use of Powershell or unexpected processes in the same timeframe would strengthen the overall coverage against this threat.

