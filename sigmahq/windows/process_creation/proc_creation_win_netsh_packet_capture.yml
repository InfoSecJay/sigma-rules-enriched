logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'trace'
    - 'start'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `netsh.exe` with the "trace" flag, indicating that a network trace is being initiated on a Windows host. The suspected threat scenario is one where an attacker may leverage this functionality to collect sensitive network traffic, which can include credentials, unencrypted communication, and other valuable information that can aid in further reconnaissance or attack phases.

  Attackers often use network capture tools to gather intelligence on the organization’s infrastructure, application traffic, and user behavior. This action aligns with the MITRE ATT&CK tactics and techniques of **Discovery** (TA0007) and **Credential Access** (TA0006), specifically technique **T1040: Network Sniffing**, which facilitates the observation of network traffic to obtain sensitive information.

  The primary data sources for detecting this activity should include process creation events, specifically focusing on the execution of `netsh.exe`, along with the command-line arguments used during its execution, as these will provide context on the intention behind the command.

  ### Investigation Steps
  - **Review Process Creation Events**: Look for instances of `netsh.exe` in process creation logs, focusing specifically on events that feature the command line arguments "trace" and "start."

  - **Analyze Command-Line Arguments**: Collect details of the specific command-line arguments used during the execution of `netsh.exe`, noting any additional flags that could indicate malicious intent or further capture activities.

  - **Cross-reference Network Traffic**: Correlate the timing of netsh command executions with network traffic logs to identify any unusual patterns or spikes in data transfer that may suggest the collection of sensitive information.

  - **Look for Unusual User Behavior**: Investigate the user accounts that executed the command. Check for any unusual behavior or roles outside of typical administrative tasks, which may indicate compromised credentials.

  ### Prioritization
  This alert should be treated with medium severity due to the potential for exploitation of sensitive network data, alongside the likelihood that an attacker may utilize such methods during their operational workflow to conduct reconnaissance or establish persistence within the network.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative activities that also initiate network captures, potentially leading to false positives in typical environments. The detection logic primarily relies on the execution of `netsh.exe`, which assumes that all instances of this command are suspicious; however, authorized administrative users may perform similar tasks legally. Required logs include robust process creation event logging on endpoints, as well as command-line logging to capture the complete context of executed commands.

