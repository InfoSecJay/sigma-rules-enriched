logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'trace'
    - 'start'
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `netsh.exe` with the "trace" flag to initiate a network capture. Attackers may use this functionality to collect sensitive information, such as credentials or unencrypted traffic, to facilitate further exploitation or lateral movement within the network. This behavior is associated with the MITRE ATT&CK technique T1040: Network Sniffing, which falls under both the Discovery and Credential Access tactics.

  Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) and Sysmon Event ID 1, which detail process start events and command-line arguments. If malicious, capturing network traces can lead to severe data breaches and loss of system integrity. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrators may use the tool for network troubleshooting and diagnostics.

  ### Investigation Steps

  - **Verify process execution details**: Check for Security Event ID 4688 and Sysmon Event ID 1 to confirm `netsh.exe` was executed with a command line containing both the terms "trace" and "start". Look for user accounts that may not typically perform network troubleshooting.

  - **Analyze command line arguments**: Specifically, verify if additional component flags (e.g., `capture` options) are present. Malicious activity often includes unusual parameters that indicate targeted data collection strategies.

  - **Identify associated network activities**: Review network logs (e.g., firewall logs or packet captures) near the time of the alert to determine if there is any unusual outbound traffic, especially to unknown or external addresses.

  - **Determine legitimate use case**: Assess the role of the executing user. If the user is part of IT or network administration with a documented need for such tools, it may indicate benign activity. Conversely, any unexpected user initiation should be treated with suspicion.

  - **Correlate with other detection tools**: If available, cross-reference alerts from Endpoint Detection and Response (EDR) tools that capture process behavior and network connections. Search for unusual network activity or communications with known suspicious domains.

  ### Prioritization

  This alert has medium severity due to the potential impact of a network trace capture revealing sensitive information, which can lead to credential theft or further attacks. The likelihood of malicious abuse is moderate since this technique is weaponized primarily in targeted attack scenarios, making its discovery critical for timely response.

  ### Blind Spots and Assumptions

  Limitations exist in detecting this activity when logs are not adequately generated or configured (e.g., Sysmon not deployed). Legitimate administrative activities such as troubleshooting or network audits may trigger this alert, leading to false positives. A related detection, monitoring for abnormal outbound network traffic patterns, can strengthen overall coverage and lead to a better assessment of malicious intent.

