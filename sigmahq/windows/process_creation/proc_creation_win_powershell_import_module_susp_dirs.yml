note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that import modules from suspicious directories such as `%Temp%`, `%Appdata%`, or `C:\Users\Public\`. These locations are commonly used by attackers to store malicious scripts or payloads due to their accessibility. The likely attacker objective includes executing malicious code or maintaining persistence on a compromised system. Relevant MITRE ATT&CK tactics include Execution (TA0002) and the technique for scripting with PowerShell (T1059.001). The primary telemetry sources are Windows Process Creation events (Event ID 4688) and Sysmon logs (Event ID 1 for process creation). If malicious, this behavior can indicate an attempt to execute unauthorized commands or exploit the system. However, detection of this activity does NOT confirm that the imported module is malicious without additional context or supporting evidence.

  ---

  ### Investigation Steps

  - **Check recent process creation events:** Review Event ID 4688 in Windows Security logs or Sysmon Event ID 1 for the presence of PowerShell processes with command lines matching the Sigma rule's suspicious patterns. Malicious indicators include attempts to import modules from `%Temp%`, `%Appdata%`, or `C:\Users\Public\`.

  - **Compare against known malicious indicators:** Investigators should cross-reference the command line used with known threat intelligence databases to check for previously documented malicious scripts or modules associated with these paths.

  - **Assess the account context:** Identify the user account that executed the PowerShell command. Look at the User field in Event ID 4688 and consider legitimacy based on the user's role. If a non-admin or unexpected account imported modules from these directories, it raises suspicion.

  - **Investigate legitimate PowerShell activity:** Review the historical usage of PowerShell commands by regular accounts to establish a baseline. For example, legitimate systems administration tasks might involve importing modules from standard directories like `C:\Windows\System32\WindowsPowerShell\v1.0\Modules`.

  - **Validate file creation or modification:** Search for any files created or modified in the directories referenced in the command line using the File Creation events from Sysmon (Event ID 11) or Windows Security logs. Compare timestamps and content to identify potential malicious scripts.

  ---

  ### Prioritization

  This alert has a medium severity due to the potential for execution of malicious code from commonly abused directories. The likelihood of malicious activity is moderate since attackers often utilize these paths for obfuscation and persistence, making it an avenue for ongoing exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if PowerShell logging is not enabled or if the log volume is insufficient to catch transient malicious activity. Legitimate software updates or administrative scripts might trigger this alert as well. A companion detection may involve monitoring for unusual file creations in the suspicious directories, which could strengthen the investigation context.

