note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell activity, specifically when scripts import modules from suspicious directories like the user’s temporary folder (`$Env:Temp`), AppData, or the Public directory. Attackers may exploit PowerShell due to its ease of use and the powerful capabilities it provides, allowing them to execute commands and scripts that could lead to data exfiltration or system compromise. By importing modules from atypical locations, adversaries can orchestrate a stealthy attack or deploy malicious payloads that may evade standard security solutions.

  The relevant MITRE ATT&CK tactics for this detection include **Execution (T1059.001)**, as it involves the execution of scripts in PowerShell, which is commonly used by attackers to execute payloads. Other related techniques could involve using PowerShell scripts to carry out actions on objectives or to abuse tools like PowerShell for post-exploitation efforts.

  Primary data sources for evidence include **process creation events**, which log command-line activity, allowing analysts to see which commands were issued and from what context. Additionally, logs from EDR solutions that monitor for suspicious script execution can also provide insights into these activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation events for the presence of PowerShell commands that include `Import-Module` for the suspicious directories mentioned. Pay close attention to context, such as the user initiating the command and the timing of the execution.

  - **Correlate with User Behavior**: Assess the baseline behavior of users who executed the detected commands. Determine if the detected activity is aligned with expected user behavior or shows signs of a compromised account.

  - **Examine Related EDR Alerts**: Investigate if there are any additional EDR alerts linked to the identified process creation events, such as unusual script execution or file access patterns, which may indicate broader malicious activity.

  - **Collect Environmental Context**: Gather information about the user’s environment, including the safety and legitimacy of the modules being imported and any other associated files or scripts in `$Env:Temp` or AppData directories.

  ### Prioritization
  This alert should be classified as medium severity due to its potential to indicate malicious activity while also being reliant on context to determine its impact. If found in unusual patterns or linked to other alerts, it may suggest active exploitation efforts.

  ### Blind Spots and Assumptions
  One of the main gaps in detection coverage is the inability to monitor PowerShell activity that does not utilize `Import-Module` while invoking scripts from legitimate directories. This detection logic assumes that the presence of command-line entries matching the rule indicates suspicious behavior, but it may generate false positives from benign administrative tasks. Additionally, logs from all necessary directories need to be collected and retained properly for this detection to function effectively, particularly the process creation and appropriate EDR logs for comprehensive visibility.

