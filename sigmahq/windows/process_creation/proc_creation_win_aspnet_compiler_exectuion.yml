note: |
  ### Technical Context

  This Sigma rule detects the execution of the **aspnet_compiler.exe**, which is a legitimate .NET framework utility often used for compiling ASP.NET applications. However, attackers may exploit this executable to run arbitrary C# code, potentially allowing for code injection or execution of malicious scripts. The likely attacker objective could be to establish a foothold or execute payloads within the context of a Web server or application server.

  This behavior corresponds to the **MITRE ATT&CK** tactic: **Defense Evasion** (TA0005) and technique: **Indicator Removal on Host** (T1127). The primary telemetry source is **Windows process creation logs** (Event ID 4688). If executed maliciously, this could lead to unauthorized access or execution of malicious code on affected systems. Notably, this detection does NOT confirm malicious intent on its own, as there may be legitimate uses in a web development context.

  ### Investigation Steps

  - **Review process creation logs**: Check for Event ID 4688 in Windows Security logs; filter for processes involving "aspnet_compiler.exe". Look for unusual parent processes, as legitimate usage will typically originate from web development tools like Visual Studio.

  - **Analyze command line arguments**: Examine the command line associated with the process creation (use Event ID 4688, CommandLine field). Malicious usage may include obfuscated or unfamiliar arguments, while legitimate commands will typically be straightforward and related to compiling specific web applications.

  - **Cross-check file origin**: Ensure the execution path of "aspnet_compiler.exe" is legitimate (e.g., typically located in `C:\Windows\Microsoft.NET\Framework\`). Any execution from non-standard directories (e.g., user directories or temporary folders) should raise suspicion of being malicious.

  - **Identify recent changes in web applications**: Investigate any recent deployments or updates of ASP.NET applications around the time of the execution. Legitimate requests for "aspnet_compiler.exe" may coincide with development cycles or application modifications.

  - **Correlate with network activity**: Check for any unusual outbound connections from the host where "aspnet_compiler.exe" was detected (consider using network logs or firewall logs). Look for connections to uncommon external IP addresses that were initiated shortly after the execution.

  ### Prioritization

  This alert carries a medium severity due to the potential for unauthorized code execution on servers or critical application hosts. The likelihood of abuse is moderate, as the legitimate use of this tool is less common in production environments. However, given its capabilities, it is a vector that adversaries may leverage when targeting .NET applications.

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker renames the executable or uses alternate methods of code execution. The success of the detection relies on the configuration of the Windows event logging; proper auditing must be enabled to capture these events. Additionally, legitimate development activities, especially in environments with frequent web application updates, may frequently trigger this alert. A companion detection to consider is monitoring for unusual file creation activities in directories associated with ASP.NET applications to identify potential code injection attempts.

