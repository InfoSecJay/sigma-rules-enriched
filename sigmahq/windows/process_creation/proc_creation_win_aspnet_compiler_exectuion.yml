note: |
  ### Technical Context
  This detection rule identifies the execution of `aspnet_compiler.exe`, a legitimate tool in the .NET framework that can be manipulated by attackers to compile and execute arbitrary C# code. This behavior can be notorious in scenarios where threat actors seek to perform remote code execution (RCE), escalate privileges, or bypass security controls by leveraging trusted system binaries in an unexpected manner.

  Attackers leveraging this technique often aim to gain unauthorized access or execute malicious payloads in environments where .NET applications reside, significantly increasing their footprint and operational capabilities. In doing so, they may manipulate web servers or other critical infrastructure to execute commands that can lead to data exfiltration or lateral movement within the network.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) as the use of `aspnet_compiler.exe` helps evade standard security mechanisms, and **Execution** (TA0002), specifically categorized under the technique **Execution through API** (T1127), as the tool can run unmanaged code through .NET applications. Primary data sources that will capture this activity include Windows process creation logs, which record the invocation of executables including their file paths and parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check logs related to the execution of `aspnet_compiler.exe`, paying close attention to the process parent and any associated command-line arguments that suggest malicious intent.
  - **Analyze Parent Process**: Investigate the parent process that initiated `aspnet_compiler.exe`. Look for suspicious processes or those related to unauthorized user activity which may indicate exploitation.
  - **Correlate with Application Logs**: Examine application and web server logs for any irregular C# code compilation activities or unusual request patterns that coincide with the execution of `aspnet_compiler.exe`.
  - **Inspect for File Modifications**: Look for signs of modified or newly created files in directories typically associated with .NET applications, particularly those related to the deployment of compiled code.

  ### Prioritization
  The alert's severity is medium, as while the execution of `aspnet_compiler.exe` can indicate benign administrative activity, its misuse can lead to significant operational risks including unauthorized code execution and potential data breaches in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection may not cover all potential abuses of `aspnet_compiler.exe`, especially if attackers use alternate means to execute code or if this process is used legitimately outside the context of threat activity. The detection logic assumes that `aspnet_compiler.exe` will be initiated from typical .NET Framework locations; however, if the tool is executed from unusual paths or if the execution is heavily obfuscated, this alert may fail to trigger. Additionally, it requires appropriate logging of process creation to be effective, meaning logging levels must be adequately configured on monitored systems.

