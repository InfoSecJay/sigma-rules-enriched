note: |
  ### Technical Context

  This Sigma rule detects the execution of `aspnet_compiler.exe`, a legitimate Windows tool used to compile ASP.NET applications. Malicious actors may exploit this executable to compile and run arbitrary C# code, potentially leading to remote code execution or unauthorized access to resources. This behavior may relate to the MITRE ATT&CK techniques: `Execution` (T1203) and `Stealth` (T1127). The primary telemetry source for this detection is process creation events captured by the Windows Security Event log (Event ID 4688) and Sysmon (Event ID 1). If used maliciously, it could facilitate exploitation of vulnerabilities within ASP.NET applications or enable backdoor creation. Notably, this detection does NOT confirm malicious activity on its own; benign usage can occur in legitimate development scenarios.

  ### Investigation Steps

  - **Check process creation logs**: Investigate Security Event ID 4688 or Sysmon Event ID 1 to identify the execution context of `aspnet_compiler.exe`, including the parent process and command-line arguments used.

  - **Analyze parent process**: Determine the parent process of the `aspnet_compiler.exe` execution. A legitimate context often involves development or deployment tools (e.g., MSBuild.exe). Suspicious parenting processes, like command prompts or file transfers, may indicate malicious intent.

  - **Examine command-line arguments**: Review for unusual parameters or file paths referenced in the command line. Legitimate invocations often involve ASP.NET file paths, while suspicious ones may include paths to temporary directories or executables unrelated to web development.

  - **Verify user context**: Identify the user account that executed the process. Process executions initiated by system accounts or unrecognized user accounts with administrative privileges should be further scrutinized, as they may indicate unauthorized activities.

  - **Correlate with network activity**: Review network logs for outbound connections shortly after execution. Malicious actions may involve connections to external servers for data exfiltration or command and control.

  - **Review related detections**: Utilize companion detections such as those for suspicious child process creation (`SuspChild` detection) or temporary file execution (`TMP File` detection) to support or refute findings based on this alert.

  ### Prioritization

  This alert has medium severity, primarily due to the impact on web server infrastructure and the potential for malicious exploitation of the ASP.NET framework. The likelihood of abuse is moderate, especially in environments where web applications run exposed to the internet. Given the nature of the executable, this behavior might be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logging for process creation events is not properly configured or where Sysmon is absent. Legitimate activities, such as developers compiling ASP.NET applications, could trigger this alert, making contextual analysis critical. Companion detections, like monitoring for suspicious parent processes or cmd.exe execution, can enhance detection capabilities in relation to this behavior.

