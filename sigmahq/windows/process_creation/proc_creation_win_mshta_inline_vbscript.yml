note: |
  ### Technical Context

  This Sigma rule detects the execution of commands containing the keywords "Wscript," "Shell," and "Run," often associated with malicious activities such as script exploitation, malware delivery, or execution of Windows Script Host (WSH) scripts. The likely attacker objective is to execute arbitrary scripts to gain access to systems, exfiltrate data, or deploy additional malicious payloads. This behavior aligns with the MITRE ATT&CK technique for execution, specifically T1059 (Command and Scripting Interpreter).

  The primary telemetry source is the Windows Process Creation logs, specifically Security Event ID 4688. If malicious, the security impact can range from unauthorized access to complete system compromise through remote code execution. This detection does NOT confirm that an attack is in progress; it only indicates that a command matching the specified keywords has been executed.

  ### Investigation Steps

  - **Check execution context**: Review Security Event ID 4688 to determine the parent process name that initiated the command. A legitimate process typically includes responses to user inputs such as logon scripts, while suspicious indicators include unknown parent processes, especially if children are Command Prompt or PowerShell.

  - **Examine command details**: Analyze the CommandLine field associated with the event. Any benign command executed by known applications, such as system administrative scripts, should be documented, whereas the presence of "Wscript," "Shell," and "Run" without valid business justification signals potential malicious activity.

  - **Lookup user behavior**: Cross-reference the User field from the Event ID 4688 logs against recent user access patterns. Legitimate users will typically have multiple scheduled tasks or scripts linked to administration functions; meanwhile, anomalous activities could suggest a credential compromise.

  - **Validate file creation**: Investigate subsequent file creation events in common script directories (e.g., C:\Windows\Temp or user profile directories) within the same timeframe. Look for EXE or VBS files created by suspicious scripts, which could indicate script-based malware deployment.

  - **Monitor network activity**: Review firewall or proxy logs for suspicious outbound connections initiated shortly after the detected command execution. Look for connections to known malicious IP addresses or domains consistent with malware behavior.

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems and the increased likelihood of malicious abuse using similar script execution techniques. The behavior detected is indicative of common tactics employed by adversaries and should be investigated promptly to prevent further exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate admins to use similar scripting techniques, which can generate false positives. Dependencies on the configuration of logging settings (e.g., process creation logging) are crucial for reliable detection. Common benign triggers may include legitimate administrative tasks executed by WMI scripts. A related detection to consider is monitoring for unexpected network communications from newly created or modified scripts, strengthening overall threat visibility.

