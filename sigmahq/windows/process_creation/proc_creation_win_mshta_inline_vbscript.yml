  ---

  ### Technical Context

  This detection rule identifies instances where the Windows Script Host (using Wscript) is invoked with Shell and Run parameters, which may indicate potential execution of malicious scripts or payloads. The primary attacker objective could include executing unauthorized commands, downloading additional payloads, or maintaining persistence. This behavior falls under the MITRE ATT&CK framework, specifically under the technique "Command and Scripting Interpreter" (T1059).

  The main telemetry sources for this detection are Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1), which capture command-line arguments of executed processes. If the detected activity is malicious, it can lead to a compromise of the system, unauthorized access, or data exfiltration. However, it is important to note that this detection alone does not confirm malicious intent, as legitimate scripts may also utilize these commands.

  ---

  ### Investigation Steps

  - **Identify the source process: ** Check the parent process ID in the logs (Security Event ID 4688 or Sysmon Event ID 1) to determine the legitimacy of the process that invoked Wscript. Validate against known legitimate applications or scripts for benign behaviors.

  - **Examine command-line arguments: ** Review the complete command line for the process to assess whether it includes suspicious URLs or payloads. Look for atypical commands or long strings that might signify obfuscation.

  - **Review process creation timestamps: ** Cross-reference the event timestamp with other security events in the vicinity. Frequent executions or unusual timing (such as late-night activity) can be a red flag for malicious behavior.

  - **Validate presence of scripting execution: ** Investigate the directory paths and files associated with the invoked scripts. Legitimate scripts typically reside in well-known locations (like C:\Windows\System32) and should not be running from user profile directories or temporary folders.

  - **Correlate with user activity: ** Analyze user behavior and permissions around the execution time. Unexpected user accounts invoking script execution, especially those with administrative privileges, should be flagged for review.

  - **Check for known malicious indicators: ** Cross-reference the command-line execution against threat intelligence databases or previous incidents related to scripting abuses (e.g., signatures of known malware delivery methods).

  ---

  ### Prioritization

  The alert warrants medium priority due to its potential impact, particularly if linked to a high-value system or sensitive data. The likelihood of malicious abuse is moderate, as scripting languages like Wscript are often weaponized in various cyber-attacks, including trojan delivery or remote access.

  ---

  ### Blind Spots and Assumptions

  One limitation of this detection is that sophisticated attackers may obfuscate command-line input or use alternative methods to execute commands, thus evading detection. Reliable detection requires consistent logging of command-line arguments; ensuring Sysmon or appropriate security event logging is configured is crucial. Legitimate use cases include administrative scripts or software maintenance, which may generate similar command-line patterns. Another related detection mechanism to strengthen coverage could include monitoring for unusual patterns in PowerShell execution (T1086), as it often complements Wscript usage in malicious scenarios.

