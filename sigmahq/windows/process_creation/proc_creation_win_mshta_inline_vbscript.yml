note: |
  ### Technical Context
  This rule is designed to detect instances where the `Wscript` scripting engine is invoked with the `Shell` and `Run` commands in the command line. This behavior is often associated with malicious activities, such as executing payloads or invoking scripts used in exploitation campaigns. Attackers leveraging Windows Script Host (WSH) can utilize such commands to execute malicious scripts, which may lead to the deployment of malware, such as information stealers or remote access trojans (RATs).

  The likely attacker objective is to execute malicious scripts that can facilitate data exfiltration or lateral movement within a network. The presence of `Wscript`, `Shell`, and `Run` in command line arguments could signal an attempt to invoke potentially harmful scripts, especially if found in conjunction with other indicators of malicious behavior.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and techniques such as **Command-Line Interface** (T1059). This detection relies primarily on process creation events logged on Windows systems, which capture command line invocations and can provide insight into both legitimate and suspicious process activities.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for the instance of `Wscript` that executed with `Shell` and `Run` parameters. Collect timestamps, user accounts, and parent processes to understand the context of execution.
  - **Analyze Related Network Activity:** Check network logs and traffic generated by the identified process to determine if it initiated unusual outbound connections to known malicious domains or IP addresses.
  - **Investigate User Context:** Assess the user account that executed the command. Look for patterns of unusual behavior, such as logins from uncommon locations or devices, or concurrent activities that may indicate compromise.
  - **Correlate with Threat Intelligence:** Utilize threat intelligence feeds to determine if the command line activity aligns with known malware behaviors or attack patterns. Review references for similar campaign activities involving `Wscript`.

  ### Prioritization
  The alert is marked as medium priority due to its potential association with script-based attacks that can lead to significant breaches. Given the prevalence of malware distribution techniques employing scripts, the likelihood of encountering such execution in an enterprise environment warrants careful investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate use cases of `Wscript` by system administrators or approved applications, which could lead to false positives. The detection logic assumes that the presence of `Wscript`, `Shell`, and `Run` always indicates malicious intent, which might not hold true in every scenario. Effective detection relies on comprehensive process creation logs being captured and properly configured, as any absence of relevant telemetry may hinder accurate identification of suspicious activities.

