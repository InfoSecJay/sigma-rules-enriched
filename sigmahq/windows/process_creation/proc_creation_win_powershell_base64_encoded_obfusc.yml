note: |
  ### Technical Context
  This rule detects the execution of suspicious PowerShell commands that are obfuscated using UTF-16 encoding or Base64. Attackers often employ these techniques to conceal malicious activities, making it more challenging to identify their intentions. The use of obfuscation is prevalent among threat actors attempting to bypass security measures, especially during initial access or execution phases, as they look to avoid detection while executing payloads or establishing persistence.

  The likely attacker objectives include reconnaissance, lateral movement, or deploying additional payloads in the environment. By obscuring command lines, attackers can deliver commands that execute malicious scripts, establish command and control (C2) channels, or exploit vulnerabilities in other applications. Relevant MITRE ATT&CK tactics/techniques include **Defense Evasion** (T1562) and **Execution** (T1203), where obfuscation serves to frustrate detection mechanisms.

  Primary data sources for identifying these behaviors include **process creation events**, which capture command-line arguments, and possibly **Windows event logs** that specifically track PowerShell execution, allowing analysts to scrutinize the context in which the commands were executed.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the *process creation logs* for instances of PowerShell execution containing the detected obfuscation patterns. Focus on command line arguments that use Base64 or UTF-16 encoding, which are likely indicators of malicious intent.

  - **Correlate with User Activity:** Analyze user account activities during the timeframe of the detected command. Check for any anomalies such as unusual logins, especially if the commands are executed under administrative privileges or service accounts.

  - **Assess Environment Changes:** Investigate for changes to the environment that may have occurred in conjunction with the suspicious execution of PowerShell commands. This includes new user accounts, group membership changes, or any modifications to system files or configurations.

  - **Extract and Decode Command:** If found, extract the obfuscated command and decode it to ascertain the intent and potential impact. Understanding the original command can provide insight into the attack vector and whether additional remediation is needed.

  ### Prioritization
  Given the high severity level assigned to this detection, the potential impact of successful exploitation is significant, as attackers utilizing obfuscated PowerShell might achieve unauthorized access or data exfiltration. The likelihood of this being a true positive is elevated due to the trend of using obfuscation to evade detection in enterprise environments.

  ### Blind Spots and Assumptions
  This detection relies on the proper configuration of **process creation logging** within the Windows environment, which may not be enabled in all organizations. There may also be gaps in detection if attackers utilize legitimate, benign obfuscation methods or if commands executed are not logged properly. Furthermore, the logic assumes that command line patterns are generally consistent and does not account for any user-mitigated defenses that could either mask or encode commands in an unexpected fashion. Analysts should ensure that logging policies capture the necessary details for effective detection.

