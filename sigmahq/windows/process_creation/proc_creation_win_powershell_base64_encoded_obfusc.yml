note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that are obfuscated using UTF16 encoding or Base64 encoding techniques, which are indicative of malicious behaviors. The likely objective for an attacker employing such obfuscation techniques is to execute arbitrary code while evading detection by traditional security controls. This behavior maps primarily to the MITRE ATT&CK technique of **Command and Scripting Interpreter: PowerShell (T1059.001)** under the tactic of **Execution**.

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line arguments associated with process creation. If malicious, the impact could escalate to full system compromise or lateral movement within the network. Importantly, this detection does NOT confirm that the activity is necessarily malicious; PowerShell is frequently used for legitimate administrative tasks, and the context of the command execution must be fully understood.

  ### Investigation Steps

  - **Analyze Command Line Arguments:** Review Security Event ID 4688 and Sysmon Event ID 1 for the specific command lines executed. Look for the presence of encoded PowerShell scripts containing Base64 or UTF16 strings that match entries in the detection rule.

  - **Identify Process Parentage:** Investigate the parent process of the PowerShell invocation through Event ID 4688. A suspicious parent process (e.g., `cmd.exe` or another process not typically invoking PowerShell) may indicate malicious intent.

  - **Compare against Safe Scripts:** Determine if the executed PowerShell command line has been documented as safe for usage in your organization. Compare with legitimate PowerShell scripts and administrative tasks that your IT teams commonly execute.

  - **Correlate with Additional Logs:** Review Sysmon Event ID 3 (Network Connection) for any concurrent network activity, especially connections to known command and control (C2) IPs or unusual outbound traffic reflecting possible exfiltration attempts.

  - **Check File System Changes:** Look for any newly created scripts or modified files around the same timeframe that triggered the alert. Validate creation timestamps for unusual file activity that coincides with the PowerShell execution.

  ### Prioritization

  This alert is classified as **high severity** due to the potential impact on sensitive systems and the likelihood of being leveraged in attacks, such as credential harvesting or ransomware deployment. The use of obfuscated PowerShell code is a common tactic employed by sophisticated adversaries, highlighting increased urgency in response.

  ### Blind Spots and Assumptions

  Detection may be limited by adversaries' capabilities to employ further obfuscation techniques or custom encoding that bypasses the current rule. Ensure that the Windows Security Logs and Sysmon configurations are enabled to capture process creation events comprehensively. Legitimate usage patterns involve administrative PowerShell commands executed with clear, human-readable arguments, whereas heavily obfuscated strings indicate higher risk. A related detection is code execution via `mshta.exe`, which can also be a method for delivering and executing obfuscated scripts.

