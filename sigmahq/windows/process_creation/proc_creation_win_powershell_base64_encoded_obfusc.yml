note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands that often utilize UTF16 or Base64 encoding techniques. The likely attacker objective is to bypass security controls and execute malicious scripts, such as malware delivery or data exfiltration. This behavior typically aligns with the MITRE ATT&CK technique for PowerShell Obfuscation (T1027) under the Defense Evasion tactic.

  The primary telemetry source is Windows process creation logs, specifically those that capture command-line arguments used to initiate PowerShell. If malicious, execution of such obfuscated scripts could lead to significant security breaches, including unauthorized access to sensitive data or lateral movement across the network. However, this detection does NOT confirm that the behavior is malicious on its own, as benign applications may also utilize obfuscation.

  ### Investigation Steps

  - **Analyze command-line arguments:** Review PowerShell lines with common obfuscations (e.g., containing "IAAtAGIAeABvAHIA"). Check Security Event ID 4688 for newly created processes and inspect the CommandLine field.

  - **Identify high-confidence malicious indicators:** Look for process initiations that show extensive concatenation or chaining, often indicated by encoded strings and significant use of the `-f` formatting operator, indicating potential script execution (`powershell.exe` with suspicious command-line content).

  - **Review legitimate PowerShell use cases:** Validate if the command execution is part of known and benign administrative tasks, such as system maintenance or authorized scripts run by IT staff. Routine automation scripts should not contain obfuscation.

  - **Correlate with other security events:** Investigate if this PowerShell execution aligns with any anomalous behavior, such as unexpected outbound connections from the same host by cross-referencing with network egress logs (e.g., firewall logs, Event ID 5156 for Windows filtering platform).

  - **Pinpoint asset context:** Determine the role of the affected host (e.g., domain controller, workstation) and criticality to assess the potential impact of any identified malicious action.

  ### Prioritization

  Alerts generated by this detection are high priority due to the potential for significant impacts on network security and sensitive data if the PowerShell execution is malicious. Given that this method is a common technique used by adversaries for attack execution and lateral movement, it poses a credible risk.

  ### Blind Spots and Assumptions

  This detection is susceptible to evasion if the attacker uses less common obfuscation techniques or integrates PowerShell within legitimate processes that do not raise alarms. It requires adequate logging configuration, such as ensuring PowerShell command-line logging is enabled to capture necessary telemetry. Legitimate activities may include routine automation scripts, which could falsely trigger alerts. Companion detections, such as anomalous outbound traffic detection linked to executed PowerShell scripts, can enhance security coverage.

