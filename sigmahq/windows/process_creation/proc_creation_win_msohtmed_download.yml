logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\MSOHTMED.exe'
  - OriginalFileName: 'MsoHtmEd.exe'
  selection_cli:
    CommandLine|contains:
    - 'ftp://'
    - 'http://'
    - 'https://'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the usage of the "MSOHTMED.EXE" executable to download arbitrary files from the internet using protocols such as HTTP, HTTPS, or FTP. Attackers may leverage this technique to retrieve malware or exfiltrate data from a compromised system, often as a part of larger campaigns aiming to maintain persistence or escalate privileges. The presence of malicious downloads can indicate nefarious activity such as data theft or the installation of backdoors.

  In terms of MITRE ATT&CK, this detection relates to the following tactics and techniques:
  - **Execution (TA0040)**: This is where the rule primarily fits, as it deals with running executables to carry out actions on the target system.
  - **Defense Evasion (TA0005)**: By using a legitimate process to download malicious files, the attacker may be trying to evade detection tools that do not monitor process behaviors closely.
  - **Technique T1218 - Signed Binary Proxy Execution**: This technique allows attackers to utilize legitimate signed binaries in Windows to execute their commands covertly.

  The primary data sources for gathering evidence in this scenario will include process creation events that log the execution of processes, command line arguments used, and any subsequent network connections established by the executable.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of "MSOHTMED.EXE" being executed. Pay particular attention to the image path and original file name to ensure it aligns with the legitimate executable.

  - **Analyze Command Line Arguments**: Investigate the command line used during the execution of the process, focusing on any commands that include HTTP, HTTPS, or FTP. This can indicate potential downloads of malicious files.

  - **Monitor Network Activity**: Track outbound connections initiated by "MSOHTMED.EXE" to see if any data transfers occur to suspicious domains or IP addresses that are known for hosting malicious content.

  - **Cross-reference Downloaded Files**: If specific files were downloaded, analyze the file hashes against threat intelligence sources to determine if they are known to be malicious or associated with adversary tactics.

  ### Prioritization
  The alert has a medium severity level due to the potential for significant impact; arbitrary file downloads can be a precursor to data breaches or deployment of ransomware. The likelihood of encountering this technique is moderate, particularly in environments where users are permitted to download files.

  ### Blind Spots and Assumptions
  This detection coverage may miss non-standard execution methods or renamed files that do not match expected naming conventions but still utilize the MSOHTMED functionality. Additionally, the detection relies on accurate process creation logs and command line logging, which must be enabled and properly configured. If there are restrictions on logging or if the executable is invoked by other means (e.g., through script execution without proper logging), the detection may fail to trigger as intended.

