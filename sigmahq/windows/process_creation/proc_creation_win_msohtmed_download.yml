note: |
  ### Technical Context

  This rule detects the use of MSOHTMED.EXE, a Microsoft Office HTML editor, to download arbitrary files over HTTP/FTP protocols. Attackers may leverage this behavior to download malware or data exfiltration tools under the guise of benign applications. This detection aligns with the MITRE ATT&CK tactic Initial Access (TA0001) and technique Command-Line Interface (T1059.004).

  The primary telemetry sources include Windows Process Creation logs, specifically looking for Event ID 4688. If malicious, this behavior could indicate a compromised system downloading payloads for further exploitation. This detection alone does NOT confirm that the downloaded content is malicious—it merely identifies the use of the potentially harmful process with unusual command-line arguments.

  ### Investigation Steps

  - **Review process creation events**: Check Windows Security Event ID 4688 for the creation of MSOHTMED.EXE. Validate the command line used; suspicious entries will contain URLs (e.g., "ftp://", "http://", "https://") that were used for downloading files.

  - **Examine command-line arguments**: Parse the command line captured in Event ID 4688 to look for unusual patterns or symbols often associated with malicious downloads, such as unexpected IP addresses or commands following legitimate executions.

  - **Identify file download artifacts**: Check for file creation or modification events related to downloads. Look for Event ID 4663 (File Access), focusing on the files downloaded at the timestamps noted in Event ID 4688 to discern between legitimate and suspicious file types (e.g., .exe, .scr).

  - **Determine legitimate use cases**: Contextualize the MSOHTMED.EXE usage by validating if the application was opened by trusted Office documents or known workflows, especially in cases involving safe work environments or familiar user behavior.

  - **Check for related processes**: Investigate if other potentially malicious processes were spawned before or after the event of interest. Look for indications of a PowerShell (Event ID 4104) or command prompt (Event ID 4688) invocation linked to abnormal network connections.

  ### Prioritization

  This alert is of medium severity due to the potential impact of the affected system being used as a launch point for malware or data theft. The likelihood of malicious abuse is moderate as this method of using MSOHTMED.EXE to download files has been weaponized in various attack scenarios, necessitating quick follow-up to determine the nature of the download.

  ### Blind Spots and Assumptions

  This detection is limited by the availability of Event ID 4688 logs; environments with logging disabled may miss this. Evasion techniques could involve using legitimate tools in allowed contexts to mask malicious activity. Legitimate activities that may trigger the alert include automated updates or patching scenarios involving Microsoft applications. A companion detection would be monitoring for unexpected network activity or unusual outbound connections (like unusual DNS requests) that could correlate with this behavior and indicate command and control traffic.

