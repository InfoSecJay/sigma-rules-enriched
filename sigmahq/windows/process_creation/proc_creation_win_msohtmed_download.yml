note: |
  ### Technical Context

  This Sigma rule detects the use of `MSOHTMED.EXE`, a legitimate Microsoft process often utilized for handling HTML documents, to download arbitrary files from remote sources via protocol URLs (ftp, http, https). The likely objective of an adversary using this technique is to exfiltrate sensitive data or introduce malicious payloads into the victim environment. This behavior maps to the MITRE ATT&CK technique **T1218: System Binary Proxy Execution**, where a trusted system binary is leveraged to facilitate malicious activities.

  The primary telemetry sources for monitoring this behavior include Windows Security Event ID **4688** (process creation) and Sysmon Event ID **1** (process creation), which provide detailed information about command line arguments and their origins. If this behavior is malicious, it can lead to data exfiltration, system compromise, or lateral movement within the network. However, this detection does NOT confirm malicious intent on its own; legitimate use of `MSOHTMED.EXE` for downloading files may occur in normal operations.

  ### Investigation Steps

  - **Analyze command line arguments:** Check for Windows Security Event ID **4688** or Sysmon Event ID **1** capturing `MSOHTMED.EXE`. Review the command line for URLs containing `ftp://`, `http://`, or `https://`. Legitimate command lines may involve standard URLs related to company operations, while unusual or obfuscated URLs may indicate malicious activity.

  - **Examine the parent process:** Review the parent process associated with `MSOHTMED.EXE` by correlating Event ID **4688**. Legitimate activity is often initiated by known processes (e.g., MS Word); however, if initiated by a suspicious or uncommon parent process, it raises the risk of malicious execution.

  - **Review network activity:** Inspect network logs for connections initiated by `MSOHTMED.EXE`. Focus on outbound connections that correspond with the detected file download, specifically looking for unusual destinations or file types that align with adversarial behavior.

  - **Validate file creation or transfer:** Check for the presence of any new files in common temporary directories or downloads folder that may have been created around the same time as the process execution. Relevant forensic lookups might include examining file creation dates and comparing them to the timestamps of the `MSOHTMED.EXE` execution.

  - **Identify Indicators of Compromise (IOCs):** Look for known malicious IOCs such as domain names or hashes associated with artifacts that might correlate with the process execution. Use threat intelligence feeds to cross-reference any external IPs or URLs used in the downloads.

  ### Prioritization

  The severity of this alert is medium, indicating a potential threat to the enterprise environment. The impact can vary based on the system's criticality; if it involves a sensitive server or endpoint, the risk is heightened. This behavior is not commonplace for legitimate activity, increasing the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection is limited by the need for comprehensive logging; if Sysmon is not deployed or properly configured, this behavior may go unnoticed. Legitimate use may include automated tools or scripts that use `MSOHTMED.EXE` for document retrieval purposes. A companion detection to consider is monitoring unusual outbound network connections or DNS requests corresponding to the URLs detected, enhancing coverage against potential exfiltration attempts.

