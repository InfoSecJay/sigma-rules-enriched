title: Scheduled Task Executing Encoded Payload from Registry
id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
status: test
description: Detects the creation of a schtask that potentially executes a 
  base64 encoded payload stored in the Windows Registry using PowerShell.
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: pH-T (Nextron Systems), @Kostastsale, TheDFIRReport, X__Junior (Nextron 
  Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-02-12
modified: 2023-02-04
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
        # schtasks.exe /Create /F /TN "{97F2F70B-10D1-4447-A2F3-9B070C86E261}" /TR "cmd /c start /min \"\" powershell.exe -Command IEX([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String((Get-ItemProperty -Path HKCU:\SOFTWARE\Pvoeooxf).yzbbvhhdypa))) " /SC MINUTE /MO 30
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains: '/Create'
  selection_cli_encoding:
    CommandLine|contains:
    - 'FromBase64String'
    - 'encodedcommand'
  selection_cli_get:
    CommandLine|contains:
    - 'Get-ItemProperty'
    - ' gp '         # Alias
  selection_cli_hive:
    CommandLine|contains:
    - 'HKCU:'
    - 'HKLM:'
    - 'registry::'
    - 'HKEY_'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the creation of a scheduled task that executes a PowerShell command embedded within a Base64-encoded payload stored in the Windows Registry. The behavior indicates potential malicious activity, as adversaries often use scheduled tasks for persistence, enabling them to reconvene or execute payloads remotely at defined intervals. The relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001) and Persistence (T1053.005). The primary telemetry sources are Windows process creation logs with specific focus on the registry access captured through Event ID 4688 and other syscall logs that detail PowerShell executions.

  If this behavior is confirmed malicious, it could lead to system compromise, data exfiltration, or lateral movement within the environment. However, this detection on its own does not confirm if the executed payload is specifically harmful or if any command was actually executed successfully.

  ### Investigation Steps

  - **Review scheduled tasks created:** Check scheduled tasks with **Task Scheduler** or through **PowerShell Get-ScheduledTask** to identify any tasks created in a suspicious manner. Look for tasks with names containing GUIDs similar to `{97F2F70B-10D1-4447-A2F3-9B070C86E261}`.

  - **Analyze process creation logs:** Investigate Windows Security Event ID 4688 logs to find any instance of `schtasks.exe` being executed. Focus on the CommandLine field to identify if it matches patterns such as containing `cmd /c start /min "powershell.exe -Command IEX(`.

  - **Inspect registry access:** Review relevant logs for registry access events (e.g., Sysmon Event ID 10) that involve `HKCU:\SOFTWARE` or `HKLM:` for anomalous calls to `Get-ItemProperty` around the time the task creation was logged.

  - **Identify encoded commands:** Payload analysis is crucial. If the `Base64-encoded` string or related commands are present in the logs, decode them for potential malicious content. Use Sysmon for detailed command-line capture and look for any indicators of known malware signatures.

  - **Check for legitimate counterparts:** Compare with expected business processes or legitimate tasks. Identify regular scheduled tasks historically seen within your environment and their modification patterns to distinguish benign behavior.

  - **Correlate with additional alerts or incidents:** Search for related security incidents or alerts involving user accounts modified within the same timeframe, possibly indicating an initial compromise leading to subsequent malicious actions.

  ### Prioritization

  This alert is high severity due to the potential impact on sensitive systems where scheduled tasks are critical for operations. The likelihood of misuse is significant, especially in environments where adversaries are known to exploit PowerShell for various attack vectors, making this behavior a common pattern in weaponization.

  ### Blind Spots and Assumptions

  Potential evasion techniques could include using obfuscated PowerShell commands or modifying task descriptions to appear legitimate. Ensuring logging for both process creation and registry access events is crucial for reliable detection, particularly for tasks executed with hidden or peculiar arguments. Legitimate activities could range from system maintenance to scheduled updates that might also trigger this alert. A companion detection could involve monitoring for unusual PowerShell executions (T1059.001) that further enhances coverage of potential misuse scenarios.

