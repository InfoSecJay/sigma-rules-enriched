title: Scheduled Task Executing Encoded Payload from Registry
id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
status: test
description: Detects the creation of a schtask that potentially executes a 
  base64 encoded payload stored in the Windows Registry using PowerShell.
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: pH-T (Nextron Systems), @Kostastsale, TheDFIRReport, X__Junior (Nextron 
  Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-02-12
modified: 2023-02-04
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
        # schtasks.exe /Create /F /TN "{97F2F70B-10D1-4447-A2F3-9B070C86E261}" /TR "cmd /c start /min \"\" powershell.exe -Command IEX([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String((Get-ItemProperty -Path HKCU:\SOFTWARE\Pvoeooxf).yzbbvhhdypa))) " /SC MINUTE /MO 30
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains: '/Create'
  selection_cli_encoding:
    CommandLine|contains:
    - 'FromBase64String'
    - 'encodedcommand'
  selection_cli_get:
    CommandLine|contains:
    - 'Get-ItemProperty'
    - ' gp '         # Alias
  selection_cli_hive:
    CommandLine|contains:
    - 'HKCU:'
    - 'HKLM:'
    - 'registry::'
    - 'HKEY_'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_schtasks_reg_loader_encoded/info.yml
note: |
  ### Technical Context

  This rule detects the creation of a scheduled task using `schtasks.exe`, which executes a command that retrieves and decodes a base64 encoded payload from the Windows Registry. The likely attacker objective is to establish persistence and execute a malicious payload without direct user interaction. The relevant MITRE ATT&CK tactics are Persistence (T1053.005) and Execution (T1059.001). Primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, focusing on command line arguments. If malicious, this behavior can result in unauthorized execution of code that may lead to system compromise. Importantly, this detection does NOT confirm whether the payload executed successfully or was indeed malicious on its own.

  ### Investigation Steps

  - **Review scheduled tasks:** Check for any newly created tasks in the Windows Task Scheduler that match the naming pattern of GUIDs (e.g., "{97F2F70B-10D1-4447-A2F3-9B070C86E261}"). This can be validated via the Task Scheduler GUI or by querying for scheduled tasks in the registry.

  - **Inspect process creation logs:** Look at Windows Event ID 4688 and Sysmon Event ID 1 for instances of `schtasks.exe` being executed with `/Create`. Pay specific attention to the command line that includes parameters like `/TN`, `/TR`, and `/SC`, which may indicate malicious activity.

  - **Analyze command line arguments:** Focus on the command line containing `FromBase64String` or `Get-ItemProperty`. These arguments often suggest an encoded payload retrieval. Capture the entire command line for further analysis.

  - **Identify relevant registry keys:** Determine if the registry path `HKCU:\SOFTWARE\` or similar keys are being accessed to retrieve the encoded data. Query the relevant registry key for existing values that match expected formats and inspect the base64 data if accessible.

  - **Validate legitimate behavior:** Scheduled tasks for system maintenance, updates, or user-defined applications typically use standard paths and command formats. Verify against historical logs for legitimate scheduled tasks to distinguish between normal and abnormal activities.

  - **Cross-reference payload execution:** If base64 content is identified, decode it and analyze its content for known malicious patterns or behaviors (e.g., downloading additional malware, executing scripts).

  ### Prioritization

  This alert is of high severity as it potentially indicates an attacker trying to establish persistence or execute malicious code without user knowledge. Given the ease of executing encoded commands and the prevalence of similar tactics in the wild, swift analysis is warranted, particularly if the affected system has critical functions.

  ### Blind Spots and Assumptions

  Detection may be limited due to obfuscation techniques used by attackers, including the use of different encoding methods or alternate executables that achieve similar functionality. Ensure that Sysmon is configured to capture detailed process creation events. Legitimate scheduled tasks (e.g., backup or maintenance tasks) may trigger this alert, hence analysts should be familiar with typical scheduled tasks in the environment. A complementary detection to consider includes monitoring for unusual base64 encoded strings in command lines or registry values to enhance coverage.

