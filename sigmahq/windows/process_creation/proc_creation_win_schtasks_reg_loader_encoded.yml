title: Scheduled Task Executing Encoded Payload from Registry
id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
status: test
description: Detects the creation of a schtask that potentially executes a base64
  encoded payload stored in the Windows Registry using PowerShell.
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: pH-T (Nextron Systems), @Kostastsale, TheDFIRReport, X__Junior (Nextron Systems),
  Nasreddine Bencherchali (Nextron Systems)
date: 2022-02-12
modified: 2023-02-04
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
        # schtasks.exe /Create /F /TN "{97F2F70B-10D1-4447-A2F3-9B070C86E261}" /TR "cmd /c start /min \"\" powershell.exe -Command IEX([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String((Get-ItemProperty -Path HKCU:\SOFTWARE\Pvoeooxf).yzbbvhhdypa))) " /SC MINUTE /MO 30
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains: '/Create'
  selection_cli_encoding:
    CommandLine|contains:
    - 'FromBase64String'
    - 'encodedcommand'
  selection_cli_get:
    CommandLine|contains:
    - 'Get-ItemProperty'
    - ' gp '         # Alias
  selection_cli_hive:
    CommandLine|contains:
    - 'HKCU:'
    - 'HKLM:'
    - 'registry::'
    - 'HKEY_'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of a scheduled task via `schtasks.exe` that runs a PowerShell command to decode a base64 encoded payload stored in the Windows Registry. The behavior suggests that an attacker may be attempting to maintain persistence or execute arbitrary commands in a post-exploitation scenario. This detection relates to the MITRE ATT&CK techniques of **Scheduled Task/Job (T1053.005)** and **PowerShell (T1059.001)**. The primary telemetry source is the process creation logs, specifically monitoring for Event ID 4688 on Windows systems.

  If malicious, this behavior can lead to unauthorized code execution and system compromise, potentially allowing attackers to escalate privileges or establish a foothold within the network. However, it is crucial to note that this detection alone does not confirm that the payload is malicious or that successful execution occurred.

  ---

  ### Investigation Steps

  - **Review the Command Line Arguments**: Check for `CommandLine` containing `/Create` and expected parameters like `-TR` to understand the context of the scheduled task creation. Look for unusual or unexpected task names in Event ID 4688.

  - **Examine Registry Access**: Correlate registry access operations via command line arguments like `Get-ItemProperty` or references to `HKCU` and `HKLM`. Investigate the entries mentioned in the command, such as `HKCU:\SOFTWARE\Pvoeooxf`, and verify their legitimacy.

  - **Look for Base64 Encoded Content**: Identify instances where `FromBase64String` or `encodedcommand` exists in the `CommandLine`. Collect these strings for analysis; legitimate use cases will typically lack obfuscation.

  - **Determine Schedule and Frequency**: Investigate the scheduling parameters, especially `/SC MINUTE /MO 30`. Legitimate tasks often have clear purposes and appropriate frequencies; atypically frequent execution can suggest malicious intent.

  - **Evaluate the Host Context**: Identify the asset on which the task is created, noting whether it typically serves as a server or user workstation. High-privileged systems, like domain controllers, warrant greater scrutiny.

  - **Correlate with Output Behaviors**: If execution occurs, check for any suspicious processes that match the task's criteria or unexpected output files or network connections that could indicate successful exploitation.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant impact on sensitive systems, especially if the affected system is pivotal (e.g., a domain controller). The likelihood of malicious abuse is high, as encoded commands often indicate evasion tactics. This method of scheduling tasks is a common technique leveraged by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the suppression of certain logs or misconfigurations that prevent logging of task creation activities. Optionally, some legacy system management or automation tools may trigger this alert benignly. A related detection, such as `PowerShell executing encoded commands`, would complement this Sigma rule and provide broader context on malicious activity involving PowerShell.

