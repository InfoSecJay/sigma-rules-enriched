title: Scheduled Task Executing Encoded Payload from Registry
id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
status: test
description: Detects the creation of a schtask that potentially executes a base64
  encoded payload stored in the Windows Registry using PowerShell.
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: pH-T (Nextron Systems), @Kostastsale, TheDFIRReport, X__Junior (Nextron Systems),
  Nasreddine Bencherchali (Nextron Systems)
date: 2022-02-12
modified: 2023-02-04
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
        # schtasks.exe /Create /F /TN "{97F2F70B-10D1-4447-A2F3-9B070C86E261}" /TR "cmd /c start /min \"\" powershell.exe -Command IEX([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String((Get-ItemProperty -Path HKCU:\SOFTWARE\Pvoeooxf).yzbbvhhdypa))) " /SC MINUTE /MO 30
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains: '/Create'
  selection_cli_encoding:
    CommandLine|contains:
    - 'FromBase64String'
    - 'encodedcommand'
  selection_cli_get:
    CommandLine|contains:
    - 'Get-ItemProperty'
    - ' gp '         # Alias
  selection_cli_hive:
    CommandLine|contains:
    - 'HKCU:'
    - 'HKLM:'
    - 'registry::'
    - 'HKEY_'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks that execute potentially harmful payloads encoded in base64, retrieved from the Windows Registry using PowerShell. The threat scenario typically involves attackers using scheduled tasks to maintain persistence within an environment, circumventing security measures to execute malicious code at regular intervals. With the use of PowerShell and encoded commands, attack vectors may exploit legitimate administrative tools for malicious purposes.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (T1543)**: Adversaries may create scheduled tasks to ensure their payload runs at defined intervals.
  - **Execution (T1059.001)**: PowerShell is a powerful scripting language that adversaries frequently leverage for executing malignant commands.
  - **Privilege Escalation (T1053.005)**: Scheduled tasks can execute processes with elevated privileges, enabling unauthorized actions.

  The primary data sources that would contain relevant evidence for detecting this behavior are:
  - **Process creation logs**: These logs will record the invocation of the schtasks.exe process and any command-line arguments used, providing insight into potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for the execution of schtasks.exe, focusing specifically on command-lines that include "/Create" and utilize base64 encoding functions like 'FromBase64String'.

  - **Inspect Scheduled Task Configuration**: Validate the configuration of newly created scheduled tasks for unusual or unauthorized entries. Specifically, check for tasks that execute PowerShell commands retrieving data from the registry.

  - **Analyze Registry Access Logs**: Collect and analyze logs related to registry access, targeting keys that are commonly employed for malicious purposes. Look for read requests to paths like HKCU:\SOFTWARE or HKLM:\SOFTWARE.

  - **Correlate with Other Logs**: Assess network connections and endpoint activity that coincide with the scheduled task execution timeframe to uncover any coordinated malicious actions.

  ### Prioritization
  Given the rule's high severity rating, it indicates a potential for significant impact due to the nature of scheduled tasks allowing persistent adversarial actions. The likelihood of a successful execution stemming from such tactics further elevates the urgency for rapid investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by configurations that do not log process creation events or lack visibility into PowerShell activities. Additionally, the detection rule assumes that scheduled tasks will consistently follow identifiable naming conventions and will not be obfuscated. The alert requires proper logging settings in place for process creation, command-line arguments, and registry key accesses to function effectively.

