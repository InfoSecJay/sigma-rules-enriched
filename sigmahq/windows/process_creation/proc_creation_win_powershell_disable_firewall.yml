note: |
  ### Technical Context
  This detection rule identifies attempts to disable the Windows Firewall through PowerShell commands. The act of disabling the Windows Firewall can indicate malicious intent, as attackers may seek to lower defenses to facilitate unauthorized access or to deploy malware without detection. The ability to disable security features such as the firewall is critical for attackers aiming to evade detection, increase persistency, or gain broader control over the target system.

  The relevant MITRE ATT&CK tactics for this rule fall under **Defense Evasion** (TA0060) and specifically focuses on **Indicator Removal on Host** (T1562), where an attacker may disable host-based preventative measures like firewalls. This type of behavior can often be indicative of more sophisticated attacks or the preparation stage of post-exploitation actions.

  Primary data sources for detecting this behavior include **process creation events** from Windows logs, which will capture PowerShell execution with relevant command-line arguments, providing insights into both the commands being executed and the context in which they were run.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine recently logged process creation events to identify instances where PowerShell (`powershell.exe`, `pwsh.exe`, `powershell_ise.exe`) was executed with command lines that include `Set-NetFirewallProfile -Enabled False`. Note additional flags used in the command to understand the scope of the firewall profiles potentially affected.

  - **Analyze Command-Line Arguments**: Focus on the command-line parameters used in PowerShell executions, particularly any that reference disabling the firewall across all profiles or specify individual profiles such as `Public`, `Domain`, or `Private`. Look for patterns or anomalies in how these commands were executed.

  - **Correlate with User Activity**: Cross-reference the identified PowerShell executions with user account activity logs to determine if the command was run by a legitimate user or if it originated from a potentially compromised account.

  - **Investigate Contextual Information**: Review contextual data such as the time of the events, associated logon types, and network traffic around the time of the execution to gather additional insights into potential unauthorized behavior or an elevated risk scenario.

  ### Prioritization
  This alert should be considered of **medium severity** due to the potential impact on the organization’s security posture. Disabling the Windows Firewall significantly increases the risk of successful attacks by reducing defensive perimeter controls. The likelihood is moderate as this behavior may be prevalent in both benign administrative tasks and malicious activities.

  ### Blind Spots and Assumptions
  There may be detection gaps for legitimate administrative use cases where firewall modifications are made purposefully and documented through standard procedures. The rule assumes that any disabling of the firewall without proper documentation or justification could be malicious. Furthermore, it requires sufficient logging of process creation events, specifically PowerShell executions, to be effective. If logging is not enabled or properly configured, instances may go undetected, leading to blind spots in threat visibility.

