note: |
  ### Technical Context

  This Sigma rule detects attempts to disable the Windows Firewall using PowerShell commands, specifically through `Set-NetFirewallProfile -Enabled False`. The likely attacker objective is to lower the defenses of the system, making it easier to conduct further malicious activities such as lateral movement or network enumeration. This behavior aligns with the MITRE ATT&CK tactic of defense evasion (T1562) and specifically technique T1685 (Disable or Modify a Security Tool).

  Primary telemetry sources include Windows Event Logs related to process creation. Specifically, Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation) are necessary to capture the relevant process and command line details. If this action is malicious, it may lead to an increased risk of exploitation and unauthorized access. However, this detection alone does NOT confirm that an attacker has gained access or that further malicious activity is occurring beyond the disabling of the firewall.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 and Sysmon Event ID 1 on the affected host. Look for `powershell.exe`, `pwsh.exe`, or `powershell_ise.exe` in the Image field, along with the CommandLine containing `Set-NetFirewallProfile -Enabled False`.

  - **Analyze command-line arguments:** Ensure the CommandLine includes all relevant parameters like `-All`, `Public`, `Domain`, or `Private`. These parameters indicate the scope of firewall changes, potentially signaling an attempt to disable security profiles widely across the system.

  - **Identify high-confidence malicious indicators:** Search for recent process creation events that include suspicious command line arguments within the last 24 hours. Focus on multiple attempts to disable firewall settings in quick succession, which may indicate automation or scripting usage by an attacker.

  - **Evaluate the context of the activity:** Compare the identified command with a baseline of legitimate activity. For instance, legitimate IT changes occurring via PowerShell might include `Set-NetFirewallProfile -Enabled True`, or changes with user account context reflecting administrative roles and purpose.

  - **Check for additional alert triggers:** Investigate if other security controls or detection rules were also triggered around the same time, such as unusual inbound/outbound traffic alerts or successful login attempts from non-administrative users that could tie into an attack sequence.

  ### Prioritization

  This alert is of medium severity due to its potential impact on system security. Disabling the Windows Firewall significantly increases the risk of successful exploitation or unauthorized access. While this behavior can indicate malicious activity, it is sometimes leveraged in legitimate administrative tasks, making contextual analysis necessary for accurate assessment.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions that allow legitimate PowerShell updates. Adversaries may employ techniques such as execution obfuscation or alternate PowerShell hosts to bypass detection. Ensure logging is enabled for PowerShell command-line execution to capture necessary details consistently. Related detections such as alerts for changes to Group Policy Objects or other security settings can complement and strengthen coverage against such evasion tactics.

