note: |
  ### Technical Context

  This detection rule identifies attempts to disable the Windows Firewall using PowerShell by monitoring specific command-line arguments associated with the `Set-NetFirewallProfile` cmdlet. The likely objective of an attacker in this scenario is to disable critical host defenses, thereby facilitating further malicious activities such as unauthorized access, lateral movement, or data exfiltration. This behavior falls under the MITRE ATT&CK tactics of Defense Evasion (TA0005) and the specific technique of Disable Security Tools (T1562).

  The primary telemetry sources for this rule are Windows process creation logs, specifically Event ID 4688. When the Windows Firewall is disabled, it could significantly increase the risk of compromise on the affected host, as it removes an important barrier against network-based attacks. However, this detection alone does not confirm malicious intent, as there are legitimate scenarios in which administrators might disable the firewall for troubleshooting or configuration purposes.

  ### Investigation Steps

  - **Check Event ID 4688 for process creation:** Review Security Event ID 4688 logs where the `Image` is `powershell.exe`, `pwsh.exe`, or similar. Look for commands containing `Set-NetFirewallProfile -Enabled False` to confirm the execution of the disabling command.

  - **Analyze command-line arguments:** Examine the `CommandLine` field in the Event ID 4688 logs for additional flags like `-All`, `Public`, `Domain`, and `Private`. Presence of these flags along with `-Enabled False` could indicate a more extensive disabling operation across profiles.

  - **Compare against baseline behavior:** Determine if the action fits within normal operational patterns for the asset. If the device is a server that frequently interacts with security configurations, this may be an acceptable administrative action. Conversely, unexpected or unknown use may warrant further investigation.

  - **Validate user context:** Cross-reference the user who executed the command with known administrative credentials. Anomalous accounts or users with a history of little to no administrative access could indicate potential exploitation.

  - **Look for additional indicators of malicious activity:** Identify if there are any subsequent logs for actions that indicate lateral movement attempts or other suspicious activities following the firewall disablement. For instance, check for unusual SMB (Server Message Block) traffic or remote management tools being invoked.

  ### Prioritization

  The severity of this alert is medium, as disabling the Windows Firewall can significantly impact the security posture of the affected system. The likelihood of malicious abuse is high since adversaries often disable security controls to facilitate their operations, and such behavior is commonly weaponized in penetration testing and real attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative actions that involve firewall modifications. Comprehensive logging must be enabled for process creation to ensure reliable detection. Legitimate activities, such as firewall configuration adjustments by authorized personnel, may trigger this alert. A companion detection to consider is monitoring for subsequent network traffic that attempts to exploit the vulnerabilities introduced by disabled firewall protections.

