  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands using specific COM object CLSIDs, which can be leveraged by adversaries to download malicious files through the `GetTypeFromCLSID` method. The primary objective of such behavior is often file retrieval for subsequent exploitation or Command and Control (C2) communications. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically the technique for Remote Content (T1105).

  The primary telemetry sources include Windows process creation logs with Event ID 4688, specifically investigating the CommandLine field for defined CLSIDs. If this behavior is confirmed as malicious, it poses a considerable risk, as it often precedes further exploitation or data exfiltration. Importantly, this detection does not confirm that the downloaded content is harmful or being executed maliciously; it only indicates the usage of potentially exploitative COM objects.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for process creation events involving PowerShell, focusing on the CommandLine field for any appearance of `[Type]::GetTypeFromCLSID(` or listed CLSIDs.

  - **Identify legitimate uses:** Cross-reference the detected CLSID usage with known legitimate applications (such as Microsoft Office) that may invoke these methods. If found, classify as benign.

  - **Examine the full command execution:** Analyze additional parameters in the CommandLine for suspicious patterns or unexpected arguments beyond the detected CLSID, which may indicate malicious intent.

  - **Check loaded modules:** Identify DLLs loaded by the PowerShell process (use Process Explorer or Sysinternals tools) to detect any unusual or malicious modules that could be fetched via the detected CLSID.

  - **Correlate with network activity:** Investigate any outbound network connections initiated from the PowerShell process, checking for suspicious or unfamiliar endpoints indicating potential C2 communications.

  - **Validate file creation artifacts:** Look for newly created files in the system (using Event ID Creation 4663) that correspond to any downloads post-command execution, focusing on unusual file paths or extensions that deviate from normal patterns.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive systems, particularly if the affected asset hosts critical organizational data. There is a moderate likelihood of abuse given the existence of known exploitation methods using these COM objects, making it vital to investigate promptly. While this behavior can be weaponized, it is also seen in legitimate scenarios, necessitating careful analysis.

  ### Blind Spots and Assumptions

  The detection may miss some evasion techniques, such as adversaries using non-standard COM objects or obfuscation within the command line parameters. Logging must be enabled for PowerShell execution and process creation; otherwise, telemetry may be incomplete. Legitimate operations such as installer scripts or administrative tasks may naturally invoke the reviewed CLSIDs, leading to false positives. Companion detections that can enhance coverage include monitoring of unusual network activity post PowerShell execution and file hash integrity checks for known malicious indicators.

