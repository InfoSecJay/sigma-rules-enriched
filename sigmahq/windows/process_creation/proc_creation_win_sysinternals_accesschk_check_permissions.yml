- System administrator Usage
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `Accesschk`, a utility developed by Sysinternals that auditors and attackers often use to assess process permissions in Windows environments. While legitimate system administrators may use `Accesschk` for auditing purposes, it can also serve malicious purposes, where attackers leverage it to map out privilege escalation paths and identify vulnerabilities in access control management. The threat scenario here likely involves an internal or external adversary attempting to gain elevated privileges within the network by assessing what resources they can access.

  This rule primarily maps to the MITRE ATT&CK framework under the tactic of Discovery, particularly the technique T1069.001, which involves gaining knowledge of the operating environment to facilitate further actions, such as privilege escalation. The primary telemetry sources for this detection include process creation logs, which can provide insights into command-line arguments and executable paths utilized by `Accesschk`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of `accesschk.exe` or `accesschk64.exe` being executed. Focus on the command-line arguments provided to understand the context in which the tool was used.
  - **Analyze User Behavior**: Identify the user account that executed `Accesschk`. Investigate whether this user has legitimate reasons to perform access audits or if it deviates from their typical behavior.
  - **Check for Privilege Escalation Attempts**: Correlate the access check execution with other privileged actions or changes in privileges to identify any possible attempts for privilege escalation or lateral movement within the network.
  - **Evaluate Audit Logs for Related Activity**: In addition to monitoring process creation logs, review any associated security logs, such as access requests denied or success, that coincide with the execution of `Accesschk`, which may indicate further attempts to exploit permission schemes.

  ### Prioritization
  This alert should be prioritized as medium severity given that the leveraging of `Accesschk` can indicate reconnaissance for privilege escalation, which can lead to further compromise of sensitive data and system integrity within an organization.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if systems do not log process creation events comprehensively or if `Accesschk` is executed on endpoints with inadequate logging configurations. Additionally, the detection logic assumes that any execution of `Accesschk`, even by legitimate users, is potentially malicious, which may lead to false positives specifically from system administrators performing their duties. Ensuring that all relevant logging configurations are appropriately set to capture detailed process executions is critical for the alert to function effectively.

