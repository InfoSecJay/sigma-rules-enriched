detection:
  selection_img:
  - Product|endswith: 'AccessChk'
  - Description|contains: 'Reports effective permissions'
  - Image|endswith:
    - '\accesschk.exe'
    - '\accesschk64.exe'
    - '\accesschk64a.exe'
  - OriginalFileName: 'accesschk.exe'
  selection_cli:
    CommandLine|contains:     # These are the most common flags used with this tool. You could add other combinations if needed
    - 'uwcqv '
    - 'kwsu '
    - 'qwsu '
    - 'uwdqs '
  condition: all of selection*
falsepositives:
- System administrator Usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "Accesschk" utility, a Sysinternals tool used for auditing access control and privileges within Windows environments. Attackers may leverage this tool to gather information on permissions that could enable privilege escalation or lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique T1069.001 (Permission Groups Discovery).

  The primary telemetry source for this detection is Windows process creation logs, specifically highlighting Event ID 4688 from the Security log or equivalent Sysmon Event ID 1. If malicious, this behavior can significantly impact security by revealing sensitive information about user roles and permissions, potentially facilitating unauthorized access. Notably, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also utilize Accesschk.

  ### Investigation Steps

  - **Review process creation events:** Identify Event ID 4688 (or Sysmon Event ID 1) that references the Accesschk.exe process execution. Check fields such as `NewProcessName` and `CommandLine` to verify the presence of known flags indicative of auditing behavior.

  - **Analyze command-line arguments:** Check the `CommandLine` field for suspicious flags such as 'uwcqv', 'kwsu', 'qwsu', or 'uwdqs'. Use these flags as a basis to differentiate between benign administrative usage and potential adversary behavior.

  - **Verify account context:** Confirm the user account that executed Accesschk by checking the `SubjectUserName` field in the detected event. Legitimate administrative activity will typically involve service accounts or known administrative users.

  - **Assess for concurrent suspicious activity:** Examine other audit logs around the same timeframe for additional indicators of malicious user behavior, such as failed logins or unusual access patterns.

  - **Identify known benign usages:** Cross-reference any detected instances of Accesschk with documented administrative usage within your organization. If an entry aligns with known schedules or processes, it may indicate benign activity.

  ### Prioritization

  Alerts generated by this detection should be treated with medium severity. While the exploitation potential is present, and the behavior is commonly weaponized for reconnaissance, the context of the executing user and the command-line arguments used is crucial to determine overall risk and impact.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate use cases by system administrators who may run Accesschk for valid permissions audits. Proper log collection and retention of process creation logs are essential for reliable detection of such behavior. Additionally, similar command-line patterns used in benign scripts could inadvertently trigger this alert; ensuring coverage with related detections specific to privilege escalation attempts can enhance overall security posture.

