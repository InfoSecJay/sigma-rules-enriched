detection:
  selection_img:
  - Product|endswith: 'AccessChk'
  - Description|contains: 'Reports effective permissions'
  - Image|endswith:
    - '\accesschk.exe'
    - '\accesschk64.exe'
  - OriginalFileName: 'accesschk.exe'
  selection_cli:
    CommandLine|contains:     # These are the most common flags used with this tool. You could add other combinations if needed
    - 'uwcqv '
    - 'kwsu '
    - 'qwsu '
    - 'uwdqs '
  condition: all of selection*
falsepositives:
- System administrator Usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Accesschk, a Sysinternals tool used for auditing user privileges and permissions on Windows systems. Attackers may use Accesschk to assess the security posture of a target system, facilitating privilege escalation efforts by identifying valuable resources and misconfigurations. The relevant MITRE ATT&CK tactic is **Discovery**, specifically the technique **Permission Groups Discovery** (T1069.001). The primary telemetry sources required for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1.

  If malicious, misuse of Accesschk could lead to unauthorized privilege escalation and potential lateral movement within the network. However, it is crucial to note that this detection does not confirm malicious intent—system administrators may legitimately use Accesschk to audit permissions.

  ### Investigation Steps

  - **Check security event logs for process creation:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of Accesschk.exe or Accesschk64.exe being executed. Look for anomalies in typical usage patterns or unauthorized timeframes.

  - **Analyze command line arguments:** Validate the CommandLine field for common flags used such as `uwcqv ` or `qwsu `. Legitimate uses typically include fewer or no flags, while suspicious executions may show varied and complex flag combinations.

  - **Identify the user context:** Establish the account running Accesschk. If it is a system administrator account, review the accompanying actions in logs to ensure compliance with organizational policies.

  - **Review network activity post-execution:** Check logs for any outgoing connections or suspicious activities following the execution of Accesschk, including any file transfers or commands indicative of exploitation.

  - **Correlate with known legitimate activities:** Compare the timing and context of Accesschk executions with known scheduled audits or legitimate administrative maintenance to determine the appropriateness of the activity.

  ### Prioritization

  This alert carries medium severity due to the potential impact on security if misused but must be assessed in context. As Accesschk is commonly weaponized for reconnaissance in privilege escalation attacks, its detection warrants further investigation but does not inherently indicate a breach.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate administrative activities where Accesschk is appropriately employed, leading to potential false positives. Proper configuration of log collection for process creation is essential for this detection to be effective. Additionally, related detection mechanisms for privilege escalation behaviors (e.g., unauthorized changes to permissions) should be in place to enhance monitoring capabilities.

