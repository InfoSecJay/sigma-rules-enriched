note: |
  ### Technical Context

  This Sigma rule detects the execution of CleanWipe, a tool typically used for removing Symantec antivirus software. The likely attacker objective is to disable or uninstall security products from the target machine, which can facilitate further malicious actions such as persistence, data exfiltration, or lateral movement. This behavior falls under the MITRE ATT&CK tactic of "Defense Evasion" (T1562) and the technique "Disable or Remove Tools" (T1685).

  The primary telemetry sources are process creation logs, specifically focusing on Windows Event ID 4688 or Sysmon Event ID 1, which capture details related to the execution of processes. If malicious, the impact includes increased vulnerability to malware infections and unauthorized access to sensitive data. It is crucial to note that this detection alone does NOT confirm malicious activity, as CleanWipe may also be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Check process execution details:** Review Event ID 4688 or Sysmon Event ID 1 for the execution of `SepRemovalToolNative_x64.exe`, `CATClean.exe`, `NetInstaller.exe`, or `WFPUnins.exe`. Look for unexpected usage times or from untrusted user accounts.

  - **Analyze command-line arguments:** For detected processes, particularly `CATClean.exe` and `WFPUnins.exe`, scrutinize the command line. Legitimate uses typically do not include uninstall flags (e.g., `--uninstall`, `/uninstall`, or `/enterprise`).

  - **Identify associated parent processes:** Investigate where the CleanWipe process was spawned from by reviewing the `ParentProcessId` field. Legitimate administrative tasks are expected to originate from known system management tools or scripts running from authorized user accounts.

  - **Correlate with asset inventory:** Validate if the affected system has Symantec antivirus installed prior to execution. Systems without it may indicate suspicious behavior or a false positive instance.

  - **Assess user account activity:** Review the account that executed CleanWipe for any recent activities. Malicious user accounts may display irregular login times or access patterns, suggesting potential compromise.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems that may undermine overall security posture. The likelihood of malicious use is significant since CleanWipe is specifically designed to remove antivirus defenses, which is commonly weaponized in various attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of relevant process creation logs if logging is not appropriately configured on endpoints. Legitimate administrative activities, particularly those involving security software management, may trigger this detection if performed without proper documentation or user privileges. A related detection for enhancing coverage includes monitoring for the installation of unauthorized software (T1218.011), which can also signal attempts to manipulate system security tools.

