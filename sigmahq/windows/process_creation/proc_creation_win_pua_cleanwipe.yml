detection:
  selection1:
    Image|endswith: '\SepRemovalToolNative_x64.exe'
  selection2:
    Image|endswith: '\CATClean.exe'
    CommandLine|contains: '--uninstall'
  selection3:
    Image|endswith: '\NetInstaller.exe'
    CommandLine|contains: '-r'
  selection4:
    Image|endswith: '\WFPUnins.exe'
    CommandLine|contains|all:
    - '/uninstall'
    - '/enterprise'
  condition: 1 of selection*
falsepositives:
- Legitimate administrative use (Should be investigated either way)
level: high
note: |
  ### Technical Context
  This rule is designed to detect the execution of CleanWipe, a tool commonly used for the uninstallation of Symantec antivirus products. Attackers may utilize this tool to disrupt security measures within a network, especially when intending to implement further malicious actions without detection. The primary objective in such scenarios is often to facilitate the deployment of additional malware or to create an exploitable network condition by removing security defenses that would otherwise alert security teams to their presence.

  The relevant MITRE ATT&CK tactics include *Defense Evasion* (TA0005), which focuses on techniques that adversaries use to avoid detection and bypass security measures. The specific technique associated with this detection is *Indicator Removal on Host* (T1562.001), where adversaries may remove indicators of compromise or security solutions to maintain persistence and operate undetected. The best evidence for this detection will primarily be found in process creation logs, which capture details about executed processes and their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any instances of process creation where the image ends with `SepRemovalToolNative_x64.exe`, `CATClean.exe`, `NetInstaller.exe`, and `WFPUnins.exe`, paying particular attention to their command-line arguments.

  - **Analyze Command-Line Arguments**: Focus on command-line parameters, especially those that indicate uninstallation actions (e.g., containing `--uninstall` or `/uninstall`), to identify potential malicious intent behind the execution.

  - **Correlate with User Activity**: Investigate the user accounts associated with the execution of CleanWipe. Determine if the actions align with legitimate administrative engagements or if they appear suspicious based on user behavior and operational context.

  - **Monitor Related Network Activities**: Look for any unusual network traffic or communications that coincide with the execution of these processes. This may involve checking logs from firewalls or proxy servers for outbound connections that could indicate follow-on malicious activities.

  ### Prioritization
  The alert has been categorized as high severity due to the potential impact of an attacker utilizing CleanWipe to remove critical defenses, leading to increased chances of successful exploitation or lateral movement within the environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are not retained or if there are configurations that may prevent logging of command-line arguments. The detection logic assumes that the tool is being used outside of legitimate administrative tasks, which means false positives may occur. Organizations must ensure comprehensive logging configurations are enabled to capture relevant artifacts and may need to establish parameters for legitimate administrative use to minimize noise in alerts.

