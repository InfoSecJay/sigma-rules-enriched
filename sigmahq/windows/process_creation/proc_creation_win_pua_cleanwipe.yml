note: |
  ### Technical Context

  This Sigma rule detects the execution of CleanWipe, a tool typically used to uninstall Symantec antivirus products. Adversaries may use this tool to disable or remove security controls, facilitating unauthorized access or malware installation. It maps to the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Indicator Removal on Host (T1562.001). The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688. If executed with malicious intent, it could allow an attacker to bypass endpoint protections, leading to potential data theft or system compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also invoke this behavior.

  ### Investigation Steps

  - **Check recent process execution details**: Review Security Event ID 4688 for the execution of `SepRemovalToolNative_x64.exe`, `CATClean.exe`, `NetInstaller.exe`, or `WFPUnins.exe`, focusing on CommandLine parameters for signs of potential malicious usage.

  - **Identify non-standard execution contexts**: Look for execution on sensitive endpoints (e.g., Domain Controllers, file servers) where such tools are typically unnecessary, indicating suspicious activity despite the execution of CleanWipe processes.

  - **Validate command line arguments**: Particularly assess if `CATClean.exe` includes `--uninstall` or `WFPUnins.exe` includes `/uninstall` and `/enterprise`. These flags can indicate uninstall attempts rather than benign administrative use.

  - **Review recent administrative activities**: Compare with logged administrative actions (Event ID 4672: Special Privileges Assigned to New Logon) to establish context around the execution. Legitimate administrative use should be documented and correlate with scheduled maintenance activities.

  - **Check for corresponding malicious files**: Look for indicators of compromise related to known malware, such as anomalous file creations in the `%TEMP%` or user profile paths shortly after CleanWipe execution.

  - **Examine audit and security controls**: Ensure that security event auditing is comprehensive and that log source configurations (e.g., process creation logging) are intact to detect unauthorized changes effectively.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on security controls on critical systems, specifically if malware or unauthorized software is installed following the execution. The likelihood of malicious abuse is significant, as the behavior is associated with known evasion techniques often used in targeted attacks.

  ### Blind Spots and Assumptions

  Limitations include potential evasion tactics like manipulating command line parameters or using alternative uninstallers. Reliable detection requires active monitoring of process creation logs, particularly in enterprise environments. Legitimate administrative tasks, if poorly documented, could inadvertently trigger this alert. A companion detection, such as monitoring for anomalous software installation events (e.g., Event ID 11707 for MSI), would enhance overall detection coverage for suspected malicious actions.

