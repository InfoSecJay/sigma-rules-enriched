note: |
  ### Technical Context

  This Sigma rule detects the execution of ZipExec, a Proof-of-Concept (POC) tool designed to package executables into password-protected zip files, potentially used for malicious payload delivery or obfuscation. The primary objective of an attacker using ZipExec would be to evade detection by wrapping malicious binaries within a zip file, and then executing or deleting these files on the target system. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and technique of Command-Line Interface (T1059) and the technique of Obfuscated Files or Information (T1027).

  The primary telemetry source for this detection is Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command-line arguments for new process creation. If this activity is malicious, it can lead to unauthorized execution of potentially harmful software, loss of data confidentiality, and a compromise of the integrity of the affected system. Importantly, this detection does NOT inherently confirm that a system has been compromised; legitimate use cases for zip utilities exist, and further investigation is warranted.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for any instances of process creation with the command line containing '/generic:Microsoft_Windows_Shell_ZipFolder:filename=', '.zip', '/pass:', and '/user:'. Legitimate zip utility usage may involve creating zip files for data compression, typically seen in administrative tasks and not containing suspicious flags.

  - **Identify high-confidence malicious indicators**: Look for command lines that include '/delete' and also contain '.zip' as this indicates a potential cleanup action post-exploit, which is often employed by attackers to remove any traces of their activity.

  - **Correlate user behavior**: Check user activity logs to see if the user account associated with this process execution has documented administrative tasks requiring zip file manipulation. Look for Event IDs related to normal administrative actions that would typically allow zip file executions.

  - **Analyze scheduled tasks and scripts**: Confirm if any scheduled tasks or PowerShell scripts have invoked ZipExec or similar tools without valid justification or context. Check Task Scheduler logs for unexpected task creation events.

  - **Validate file creation and transfer**: Investigate the presence of newly created zip files or any zip files that contain executable binaries, especially in unusual directories. Validate file integrity and timestamps against expected patterns (e.g., temporary directories versus user profile directories).

  ### Prioritization

  This alert should be considered medium priority due to the impact of potential execution of malware on systems handling sensitive data and the manageable likelihood of malicious abuse via tools like ZipExec, as this technique is increasingly weaponized by attackers. However, context must be established to differentiate between legitimate use and potential compromise.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative use of zip utilities, which may lead to false positives. It is crucial to ensure that full process command line logging is enabled for reliable detection, as incomplete logs may miss critical indicators. Legitimate activities such as batch data archiving or user-initiated zipping of files may trigger this alert. One related detection to strengthen coverage would be monitoring for abnormal PowerShell usage, which could accompany malicious zip file manipulations (technique T1059.001).

