note: |
  ### Technical Context
  This detection rule identifies the execution of ZipExec, a Proof-of-Concept (POC) tool that wraps binary-based tools into password-protected zip files. Attackers may utilize ZipExec to obscure the delivery of malicious payloads or to bypass security controls by disguising their executables as benign zip files. This can be part of a larger strategy to execute code on compromised systems while evading detection mechanisms.

  The likely attacker objectives behind using tools like ZipExec typically include data exfiltration, lateral movement, or deploying additional malware while minimizing their visibility in security monitoring environments. The relevant MITRE ATT&CK tactics for this rule include **Execution** (T1202 - Command and Scripting Interpreter) and **Defense Evasion** (T1218 - Signed Binary Proxy Execution), indicating that attackers may employ this technique to execute files while attempting to evade detection.

  Primary data sources to capture useful evidence include process creation logs, which will reflect command-line arguments used during the unzipping and execution processes. Additionally, monitoring file creation and deletion events regarding unusual zip files may provide further context regarding potential misuse.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for any instances of `ZipExec` executions, particularly focusing on the command line arguments that contain the keywords `/generic:Microsoft_Windows_Shell_ZipFolder:filename=`, `.zip`, `/pass:`, and `/user:`. Look for patterns that indicate automated or unusual execution.

  - **Correlate with File Activity**: Check for the creation or deletion of zip files in sensitive directories. Investigate if any password-protected zip files were created or if there was evidence of their immediate deletion post-extraction.

  - **Examine User Accounts**: Verify the user accounts that executed the `ZipExec` commands. Identify any accounts that do not normally perform such operations, which can indicate a compromised account or insider threat.

  - **Assess Network Traffic**: Investigate outbound network activity for any suspicious connections established after the execution of `ZipExec`. Look for unusual data transfers that may suggest exfiltration attempts.

  ### Prioritization
  This alert is rated medium severity due to the potential for malicious exploitation of the tool, where attackers could gain unauthorized access or transfer sensitive data. The likelihood of this activity correlating with known attack vectors increases given the sophistication of adversaries utilizing such tactics.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to legitimate uses of zip file handling tools, which could lead to false positives. The detection logic assumes that the execution of ZipExec will always utilize the specified command-line parameters, possibly missing variations of the tool's use. Required logs include a comprehensive set of process creation events, and systems must have adequate monitoring configurations to capture detailed command-line argument data for effective detection to function.

