title: HackTool - Htran/NATBypass Execution
id: f5e3b62f-e577-4e59-931e-0a15b2b94e1e
status: test
description: Detects executable names or flags used by Htran or Htran-like tools
  (e.g. NATBypass)
references:
- https://github.com/HiwinCN/HTran
- https://github.com/cw1997/NATBypass
author: Florian Roth (Nextron Systems)
date: 2022-12-27
modified: 2023-02-04
tags:
- attack.command-and-control
- attack.t1090
- attack.s0040
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - '\htran.exe'
    - '\lcx.exe'
  selection_cli:
    CommandLine|contains:
    - '.exe -tran '
    - '.exe -slave '
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of Htran or similar tools like NATBypass, which are commonly used for covert network communication and to evade detection by masking data traffic. The likely attacker objective is to establish a backdoor or covert channel for command and control (C2) purposes, allowing the adversary to maintain persistent access and exfiltrate data discreetly. Relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Application Layer Protocol (T1090).

  Primary telemetry sources for this detection include Windows process creation logs, particularly those captured via Security Event ID 4688 or Sysmon Event ID 1. The security impact of detecting such behavior is significant, as it could indicate an ongoing compromise with potential data exfiltration or further lateral movement within the environment. This detection does NOT confirm that malicious activity has occurred; it only indicates the presence of tool usage, which could also include legitimate application scenarios.

  ### Investigation Steps

  - **Check process execution details: ** Review Security Event ID 4688 for process creation events related to `htran.exe` or `lcx.exe`. Assess the user and parent process to determine if the command was initiated from a legitimate context (e.g., system maintenance tasks) or if it's suspicious.

  - **Analyze command line arguments:** Examine Sysmon Event ID 1 for details on command lines containing flags such as `-tran` or `-slave`. Look for unusual background execution or runs from non-standard directories which may indicate an adversary's use.

  - **Identify high-confidence malicious indicators:** Look for processes attempting to establish network connections that use atypical ports while running Htran or NATBypass. Use network detection tools to correlate outbound traffic patterns with internal logs to confirm exfiltration attempts.

  - **Validate legitimate use cases:** Confirm benign execution scenarios, such as system administration scripts or authorized software updates. Review application logs or process tree hierarchies to ensure no legitimate user context was compromised.

  - **Assess asset criticality:** Determine if the affected system is a critical asset, such as a domain controller or server with sensitive data. Investigate the potential impact based on the asset's function within the environment.

  ### Prioritization

  This alert is considered high priority due to its association with potential C2 and data exfiltration activities. The impact can be significant if the affected system holds sensitive information or critical business functions. This behavior is commonly weaponized by adversaries to maintain persistence and control over compromised networks.

  ### Blind Spots and Assumptions

  Detection may be limited by certain evasion techniques, such as renaming the executables or using legitimate software with similar command-line parameters. Reliable detection requires proper logging configurations for Windows process creation. Legitimate applications, such as network monitoring or administrative tools, could trigger this alert. A related detection to strengthen coverage could involve monitoring for suspicious outbound network traffic patterns associated with the execution of these tools.

