title: Potential Credential Dumping Via WER
id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
status: test
description: Detects potential credential dumping via Windows Error Reporting 
  LSASS Shtinkering technique which uses the Windows Error Reporting to dump 
  lsass
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
author: '@pbssubhash , Nasreddine Bencherchali'
date: 2022-12-08
modified: 2022-12-09
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\Werfault.exe'
  - OriginalFileName: 'WerFault.exe'
  selection_cli:
    ParentUser|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
    User|contains:
    - 'AUTHORI'
    - 'AUTORI'
    CommandLine|contains|all:
            # Doc: WerFault.exe -u -p <target process> -ip <source process> -s <file mapping handle>
            # Example: C:\Windows\system32\Werfault.exe -u -p 744 -ip 1112 -s 244
            # If the source process is not equal to the target process and the target process is LSASS then this is an indication of this technique
            # Example: If the "-p" points the PID of "lsass.exe" and "-ip" points to a different process than "lsass.exe" then this is a sign of malicious activity
    - ' -u -p '
    - ' -ip '
    - ' -s '
  filter_lsass:
    ParentImage: 'C:\Windows\System32\lsass.exe'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Windows Error Reporting might produce similar behavior. In that case, check 
  the PID associated with the "-p" parameter in the CommandLine.
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential credential dumping attempts using the Windows Error Reporting (WER) process, specifically targeting LSASS (Local Security Authority Subsystem Service) via the “LSASS Shtinkering” technique. The likely attacker objective is to extract sensitive credentials without raising immediate alarm, leveraging WER to bypass traditional defenses. This behavior corresponds with the MITRE ATT&CK tactic of Credential Access, specifically technique T1003.001 (Credential Dumping: LSASS Memory). Primary telemetry sources include Windows process creation logs, particularly from Sysmon (Event ID 1) or Security logs (Event ID 4688), capturing usage of the WerFault.exe executable. If successful, this activity could allow an attacker to obtain sensitive credentials, significantly impacting security posture. It is important to note that this detection does NOT confirm a successful credential dump on its own; further investigation is necessary to ascertain intent and impact.

  ### Investigation Steps

  - **Review the Command Line Arguments:** Check for the presence of "-p" and "-ip" parameters in the command line of WerFault.exe (Event ID 4688). A potential malicious indicator is when the "-p" parameter points to LSASS (PID 744) while the "-ip" points to a different process.

  - **Inspect the Parent Process:** Investigate the ParentImage associated with the detected WerFault.exe process. Confirm that the parent process is lsass.exe to validate suspicious behavior. Normal instances of WerFault.exe will not have this direct parent-child relationship.

  - **Evaluate the Event IDs:** Review Sysmon Event ID 1 to examine the Image, OriginalFileName, and CommandLine fields. Look for a match to the WerFault.exe signature and any execution paths suggesting abnormal usage.

  - **Identify Benign Behavior:** Analyze baseline behavior of legitimate Windows Error Reporting processes around typical system errors. Legitimate instances usually do not exhibit the specific command line characteristics targeting LSASS.

  - **Correlate with Other Indicators:** Cross-reference alerts with other telemetry sources, such as security logs or EDR alerts, to identify known malicious indicators associated with the use of WerFault.exe.

  - **Confirm Process Hierarchy:** Validate that the source of the WerFault.exe execution does not stem from legitimate user processes (e.g., User or Admin actions) but rather from unauthorized access or system compromises.

  ### Prioritization

  This alert should be treated with high severity given the potential impact on credentials being compromised directly from LSASS, which is a critical component responsible for managing local security policies and information on Windows systems. The likelihood of malicious abuse through this technique is elevated, as it is a known method employed by threat actors in the wild.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate Windows Error Reporting activities that can produce similar behaviors, necessitating thorough investigation of context and command line parameters. It is also critical to ensure that logging configurations for process creation are properly set, including Sysmon logging. Legitimate system processes such as user-initiated troubleshooting or application reporting may inadvertently trigger this alert. A companion detection to strengthen coverage would include monitoring traditional credential dumping techniques via lsass.exe directly or through other malicious command line activities in Security Event logs.

