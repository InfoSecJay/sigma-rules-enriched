note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell (or pwsh) as a child process of the WMI Provider Service (WmiPrvSE.exe). This behavior is characteristic of lateral movement attempts leveraging Windows Management Instrumentation (WMI), where an adversary may use WMI to execute payloads on remote systems without direct access. The likely objective of an attacker using this technique is gaining unauthorized access to other systems within the network by executing commands remotely.

  This detection aligns with the MITRE ATT&CK techniques for Execution (T1047 - Windows Management Instrumentation) and Command-Line Interface (T1059.001 - PowerShell). The primary logs required for this detection are process creation telemetry, specifically focusing on Windows Security Event ID 4688 or Sysmon Event ID 1, which capture details about newly created processes. If confirmed as malicious, this could result in significant security implications, such as unauthorized access to sensitive data or system compromise. However, this detection alone does not confirm malicious intent without additional context, as PowerShell can also be used for legitimate administrative tasks.

  ### Investigation Steps

  - **Check for WMI usage logs:** Review WMI logs (Event IDs 19 and 20) to identify any recent queries executed prior to the alert, which may indicate legitimate administrative activities or potential abuse. Look for script blocks that align with standard operational tasks.

  - **Analyze parent-child process relationships:** Investigate the process tree using Sysmon Event ID 1 to confirm WmiPrvSE.exe as the parent and ensure that the PowerShell instance has no preceding suspicious commands or scripts executed.

  - **Identify unusual PowerShell command execution:** Examine the command line arguments of the initiated PowerShell process; any obfuscated code or unusual command parameters (e.g., directly invoking remote scripts) would be indicators of potential malicious use.

  - **Validate the asset's role and criticality:** Determine the role of the impacted asset (e.g., is it a domain controller or application server?). Advise heightened scrutiny if this process originates from a critical or high-value asset that may be involved in administrative or sensitive data handling.

  - **Review for legitimate application conflicts:** Check for existence of legitimate applications like AppvClient or Configuration Manager (CCM) that may perform similar actions; if found, document their behavior as potential false positives.

  ### Prioritization

  This alert is medium severity due to its potential for misuse in an enterprise context, particularly if originating from sensitive or critical systems. While WMI-based lateral movement techniques are often weaponized, legitimate administrative tasks can also trigger similar alerts, necessitating careful review.

  ### Blind Spots and Assumptions

  Evasion techniques include attackers using benign or legitimate WMI queries for malicious purposes, which may bypass some detection methods. Reliable detection relies on complete and properly configured logging of process execution events. Additionally, benign applications may trigger this alert, such as administrative tools leveraging WMI. Related detection includes monitoring for suspicious WMI queries (e.g., using Event ID 22) to enhance visibility of WMI-based activities.

