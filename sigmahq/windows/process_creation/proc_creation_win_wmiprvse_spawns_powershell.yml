note: |
  ### Technical Context
  This detection rule identifies instances where PowerShell is spawned as a child process by the Windows Management Instrumentation Provider Service (WmiPrvSE.exe). Such activity may indicate potential lateral movement within an environment, as attackers often use WMI to execute commands on remote machines without needing a direct network connection. The use of WMI for lateral movement can be particularly stealthy, allowing malicious actors to blend in with normal administrative tasks while achieving their objectives of reconnaissance, command execution, or network exploitation.

  The rule aligns with two key MITRE ATT&CK techniques: **T1047 - Windows Management Instrumentation (WMI)**, which describes the use of WMI for execution, and **T1059.001 - PowerShell**, which involves the execution of commands in PowerShell scripts or commands. The relevant telemetry sources that can provide critical evidence include process creation events, which log the execution of processes and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine log entries associated with the creation of PowerShell processes. Look for instances where `WmiPrvSE.exe` is listed as the parent process.

  - **Analyze Parent-Child Relationships:** Utilize the parent-child relationship data from your process creation logs to assess whether legitimate administrative actions are being mistaken for potential malicious activity.

  - **Correlate with Timeframe of Other Activity:** Cross-reference the identified PowerShell executions with other logs (e.g., event logs, user access logs) during the same timeframe to determine if legitimate administrative or suspicious activity occurred.

  - **Inspect WMI Queries and Commands:** Check for any unusual WMI queries being executed via the detected PowerShell processes. Investigate the potential use of script blocks that could indicate suspicious behavior not typical of standard administrative tasks.

  ### Prioritization
  The alert has a medium severity level in an enterprise environment due to the potential for significant unauthorized access or control over systems. Lateral movement via WMI is a common tactic employed by attackers that may go undetected among legitimate administrative activities, warranting a thorough investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the reliance on standard process creation logs, which may not capture every instance of WMI usage or may generate false positives from legitimate system processes like AppvClient or WinRM. The detection logic assumes PowerShell execution through WMI is malicious, which may not always be the case. For this alert to function correctly, it is essential that proper logging is enabled for process creation events on Windows systems, and that logs are retained and accessible for forensic analysis.

