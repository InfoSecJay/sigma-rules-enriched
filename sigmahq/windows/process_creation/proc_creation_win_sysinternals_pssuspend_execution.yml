  ### Technical Context
  This rule detects the execution of Sysinternals PsSuspend, a utility that can be leveraged by attackers to suspend critical processes on Windows systems. By suspending processes, attackers can disrupt services, evade detection, and further exploit the compromised system for malicious purposes. The typical threat scenario involves an attacker who has gained some level of access to a system and seeks to manipulate its processes to facilitate further attacks or maintain persistence without detection.

  The relevant MITRE ATT&CK tactics include **Privilege Escalation (T1068)**, where an attacker might elevate their privileges by stopping security processes, and **Discovery (T1083)**, through gathering information on which processes are critical or running and their state. Additionally, PsSuspend can be involved in **Persistence (T1543.003)**, as an attacker may use it to manipulate services, leading to a sustained presence on the target machine.

  Primary data sources for this detection include **process creation events** that log when executables like PsSuspend are executed. Monitoring these logs will help identify potentially malicious activity stemming from the utility being run.

  ### Investigation Steps
  - **Review Process Creation Events:** Check the logs from process creation events in your endpoint detection solution for any instances of 'pssuspend.exe' or 'pssuspend64.exe'. Pay close attention to the parent processes to identify the context in which PsSuspend was invoked.

  - **Analyze Command-Line Arguments:** Look for any suspicious command-line arguments used with PsSuspend in the process creation logs. Attackers may include options to target specific processes, hinting at their malicious intent.

  - **Investigate Related Activities:** Examine related activity around the same timestamp, such as other security-related processes that may have been suspended. Look for indicators that might suggest a broader attack, such as suspicious file changes or unexpected network connections.

  - **Cross-Reference with Threat Intelligence:** Validate any alerts against threat intelligence to assess known bad actors or malware families associated with the usage of process suspension tools. This will help contextualize the threat level of the detected activity.

  ### Prioritization
  This alert should be treated with medium priority due to the potential for significant impact if critical processes are maliciously suspended. The likelihood of its usage in real-world attacks makes it essential to investigate promptly to mitigate risks to enterprise operations.

  ### Blind Spots and Assumptions
  One gap in detection coverage may be the lack of identification for other process manipulation tools beyond PsSuspend. The detection logic assumes that command-line arguments are logged and will need to monitor logs accordingly. Additionally, successful detection relies on comprehensive logging of process creation events, which may not be configured on all endpoints, potentially leaving blind spots if logging isn't enabled effectively.

