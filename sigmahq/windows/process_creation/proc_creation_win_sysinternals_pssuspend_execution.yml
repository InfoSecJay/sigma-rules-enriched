note: |
  ### Technical Context

  This Sigma rule detects the execution of Sysinternals PsSuspend, a tool that can suspend running processes. The likely attacker objective is to manipulate or disable critical processes, perhaps to evade detection, conduct privilege escalation, or establish persistence in the compromised environment. This behavior falls under the MITRE ATT&CK technique of Process Injection (T1055) and Privilege Escalation (T1543.003). The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which record process creation events along with details about the executed command. If malicious, the impact could include system instability, evasion of security controls, or exploitation of critical applications. However, this detection does NOT confirm that an attack is underway, as PsSuspend may be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Identify PsSuspend execution:** Review Security Event ID 4688 for process creation logs that reference `pssuspend.exe`, `pssuspend64.exe`, or `pssuspend64a.exe`. Check the command line parameters for suspicious flags or targets.

  - **Correlate with user context:** Determine the account used to execute PsSuspend. Legitimate execution often comes from administrative accounts performing system maintenance. Look for processes started under a typical admin account versus unexpected accounts.

  - **Check process state changes:** Use Sysmon Event ID 5 (Process Terminated) to verify if any critical processes have been suspended or terminated after the use of PsSuspend, focusing on critical OS or security processes.

  - **Monitor for process resumption:** Investigate subsequent actions showing if suspended processes were resumed or if new processes were created afterward. This can indicate attempts to re-establish functionality after potential malicious actions.

  - **Look for associated execution artifacts:** Search for file creations or modifications related to PsSuspend (e.g., logs in C:\Windows\Temp or other temp directories) to validate if the tool was downloaded or executed recently.

  ### Prioritization

  This alert should be prioritized as medium severity due to its potential impact on critical systems if used maliciously. While not all instances of PsSuspend usage are indicative of a threat, the likelihood of abuse is significant, especially in environments where attackers commonly use process suspension as a tactic.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion if the tool is renamed or if its execution is masked by legitimate process interactions. Required log sources for effective detection include both Windows Security Event logs and Sysmon configuration to ensure comprehensive coverage. Legitimate administrative tasks, such as system maintenance or debugging, may trigger this alert. A related detection to enhance coverage would be monitoring for the execution of other Sysinternals tools known for process manipulation, such as PsExec.

