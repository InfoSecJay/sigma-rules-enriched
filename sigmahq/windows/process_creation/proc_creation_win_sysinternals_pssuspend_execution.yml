  ---

  ### Technical Context

  This rule detects the execution of Sysinternals PsSuspend, a tool that can suspend running processes, which may indicate an attacker trying to halt security software or other critical processes. The objective of using PsSuspend is typically to facilitate further malicious actions, such as installing malware or extracting sensitive data without interference from security mechanisms.

  This behavior aligns with MITRE ATT&CK techniques T1543.003 (Service Execution) and T1546.001 (Event Triggered Execution), where an attacker may attempt to maintain persistence or execute malicious tasks in a stealthy manner. The primary telemetry source for this detection includes Windows process creation logs, specifically looking for Event ID 4688 (process creation). If malicious, this activity could compromise system integrity and lead to the exploitation of other vulnerabilities within the environment.

  It is important to note that the detection of PsSuspend execution does NOT confirm malicious intent on its own; legitimate administrative activities may also trigger this alert.

  ---

  ### Investigation Steps

  - **Check process creation details**: Review Windows Security Event ID 4688 logs for instances of 'pssuspend.exe' or 'pssuspend64.exe', focusing on the 'NewProcessName' field to identify the initiating command and parent process. Look for suspicious command-line arguments indicative of a malicious workflow.

  - **Identify the affected process**: Determine which processes were suspended, examining the 'ProcessName' and 'ProcessID' fields in the logs. Suspensions targeting critical system processes (e.g., antivirus or system services) are more indicative of malicious behavior.

  - **Analyze parent process context**: Investigate the parent process of the PsSuspend execution. If it stems from a process commonly associated with malware (e.g., powershell.exe, cmd.exe), it raises concerns about the legality of the PsSuspend invocation.

  - **Correlate with known benign usage**: Compare identified uses of PsSuspend against a baseline of legitimate operations within the organization, like administrative maintenance tasks that may temporarily suspend processes for updates or patches.

  - **Confirm log source availability**: Ensure that the Windows Security logs are actively collected and retained in your SIEM to support ongoing detection efforts, focusing on Event ID 4688 and related fields.

  - **Document other detections**: Consider using related detections, such as Sigma rules for unexpected process creation or remote execution (e.g., RDP sessions) which may provide context about how PsSuspend was invoked and whether it was part of a larger attack scenario.

  ---

  ### Prioritization

  This alert should be treated with medium severity as it potentially indicates a privilege escalation attempt. The likelihood of abuse is significant due to the tool’s capability to hinder security monitoring, which is a common strategy utilized in various attack scenarios. The presence of Sysinternals tools in an environment should be heavily scrutinized when seen under suspicious circumstances, as they are frequently weaponized.

  ---

  ### Blind Spots and Assumptions

  One limitation is that sophisticated adversaries could use custom or modified tools to evade detection, while legitimate administrators might also invoke PsSuspend for maintenance tasks. Proper log configurations are essential to detect all instances effectively; missing Event ID 4688 could hinder monitoring efforts. Furthermore, alternative legitimate activities, such as troubleshooting or patching scenarios, may inadvertently trigger the same alerts. Companion detections, like monitoring for services being stopped or started unexpectedly, can enhance coverage and provide additional context for the analysis.

