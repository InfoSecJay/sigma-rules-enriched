note: |
  ### Technical Context

  This Sigma rule detects the use of Microsoft Connection Manager Profile Installer (cmstp.exe) to run commands that install specially formatted local .INF files, potentially allowing an attacker to bypass User Account Control (UAC). The likely attacker objective is privilege escalation on a Windows system, enabling unauthorized execution of commands with higher privileges. This behavior maps to the MITRE ATT&CK technique T1548.002 (Use Alternate Authentication Material) and T1218.003 (Signed Binary Proxy Execution).

  The primary telemetry sources for this detection include the Windows Event Log, capturing process creation events (Event ID 4688) and Sysmon (Event ID 1) logs. If the cmstp.exe utility is invoked maliciously, it could facilitate unauthorized access to sensitive system functions. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate usage of cmstp.exe occurs in various administrative scenarios.

  ### Investigation Steps

  - **Inspect process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 focusing on cmstp.exe execution. Check the "CommandLine" field to identify usage patterns including "/s", "-s", "/au", or "/ni". Legitimate command lines typically involve installation or configuration of network profiles and do not include repetitive or suspicious flags.

  - **Evaluate user context:** Identify the user account executing cmstp.exe to assess if it aligns with administrative roles. Unusual activity from standard or low-privilege accounts could signify malicious intent.

  - **Analyze the command line arguments:** Look for specific indicators like "/s" or "/au" within the CommandLine field that are commonly used in exploitation scenarios to indicate silent execution or privilege escalation attempts.

  - **Correlate with logs of recent INF file changes:** Cross-reference with Event IDs 5145 (File/Create) and 4663 (File Access) to check if an unrecognized or suspicious .INF file was modified around the same time. Legitimate changes should be documented and associated with appropriate administrative tasks.

  - **Identify known bad indicators:** Check for known malicious .INF file hashes in conjunction with the execution of cmstp.exe. High-confidence malicious indicators include the execution of cmstp.exe with proprietary or obfuscated .INF files that do not match standard configurations.

  ### Prioritization

  This alert is categorized as high severity due to the potential for privilege escalation and significant impact on the compromised system. The likelihood of malicious abuse is high, as adversaries commonly weaponize cmstp.exe in post-exploitation scenarios. Timely investigation is crucial to prevent further exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited if users employ legitimate administrative tasks involving cmstp.exe, which could result in false positives. Ensure that logging is enabled for both process creation and file access events to maintain reliable detection. Common benign activities include the deployment of legitimate network configurations. A companion detection to consider includes monitoring for execution of other methods of UAC bypass, such as exploiting task scheduler or service configuration changes.

