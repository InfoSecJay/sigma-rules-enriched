logsource:
  category: process_creation
  product: windows
detection:
  selection_sql:
  - Product: SQLite
  - Image|endswith:
    - '\sqlite.exe'
    - '\sqlite3.exe'
  selection_firefox:
    CommandLine|contains:
    - 'cookies.sqlite'
    - 'places.sqlite'         # Bookmarks, history
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the "sqlite" binary used to query SQLite databases within Firefox and other Gecko-based browsers. These databases may contain sensitive user information, including cookies, bookmarks, and browsing history, commonly targeted for credential theft or session hijacking. The likely attacker objective is to access and extract this sensitive data to facilitate further exploitation or unauthorized access.

  This detection maps to the MITRE ATT&CK techniques: Credential Access (T1539) and Collection (T1005). The primary telemetry sources are process creation logs, specifically Windows Security Event ID 4688, showing the execution of the SQLite binaries with specific command-line arguments. If successful, the security impact includes unauthorized access to user credentials and personal data. However, this detection alone does not confirm malicious intent; legitimate applications or users may access SQLite databases.

  ### Investigation Steps

  - **Review Process Creation Log:** Check Windows Security Event ID 4688 for the execution of "sqlite.exe" or "sqlite3.exe". Malicious indicators include command lines containing 'cookies.sqlite' or 'places.sqlite'. Legitimate usage typically does not involve these databases.

  - **Inspect Command Line Arguments:** Analyze the CommandLine field in the Event ID for suspicious flags or arguments. Command lines with significant string manipulations or attempts to access sensitive user files may indicate malicious intent.

  - **Check for Previous Alerts:** Correlate any preceding alerts related to unauthorized access attempts or anomalous behavior on the affected host. This may reveal patterns consistent with known attacker workflows.

  - **Validate User Activity:** Cross-reference the process creation logs with user activity logs to ensure that the user associated with the command line has a legitimate reason to access these files. Legitimate users may query these databases for development or troubleshooting.

  - **Assess Asset Criticality:** Determine the role of the affected host. Workstations holding sensitive user information or credentials represent higher risk and warrant immediate attention.

  - **Identify Potential Exfiltration:** Look for file creation events in user directories where cookies or other data files may have been copied or modified, indicating potential data exfiltration efforts.

  ### Prioritization

  This alert is high severity due to the potential for sensitive credential exposure through targeted attacks. Given that querying browser databases is a known technique among credential stealing tools, the likelihood of malicious exploitation is significant, especially on critical endpoints.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate SQLite usage patterns in applications or scripts that might also access these files, such as database management tools. Ensure proper logging of all SQLite processes and command executions to enhance detection reliability. This alert may also trigger on users performing legitimate maintenance or development tasks related to SQLite databases. A useful companion detection might involve monitoring for unusual outbound network traffic following the execution of this process, which could indicate data exfiltration attempts.

