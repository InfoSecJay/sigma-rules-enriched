detection:
  selection_sql:
  - Product: SQLite
  - Image|endswith:
    - '\sqlite.exe'
    - '\sqlite3.exe'
  selection_firefox:
    CommandLine|contains:
    - 'cookies.sqlite'
    - 'places.sqlite'         # Bookmarks, history
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the "sqlite" binary to access databases associated with Firefox and other Gecko-based browsers. The rule is designed to potentially uncover malicious activity where an attacker uses SQLite to query sensitive information, such as cookies, bookmarks, or browsing history, from the user’s browser profile. By exploiting the SQLite databases, adversaries may aim to steal session cookies or sensitive data, facilitating further attacks such as account compromise or credential theft.

  The primary threat scenario reflects attackers leveraging SQLite to gather user data stealthily. The likely objective is to harvest sensitive information that enables them to impersonate users or conduct additional exploitative actions, focusing on **Credential Access** and **Data Collection** as outlined in the MITRE ATT&CK framework. Relevant tactics include:
  - **Tactic: Credential Access** (ID: TA0006)
    - **Technique: Data from Information Repositories** (ID: T1005)
  - **Tactic: Collection** (ID: TA0009)
    - **Technique: Data from Application Layer Protocol** (ID: T1539).

  The best sources of telemetry to support this detection include process creation events from Windows, particularly those logging command line arguments, as well as file access logs where SQLite database files like `cookies.sqlite` and `places.sqlite` are stored.

  ### Investigation Steps
  - **Review Process Creation Events:** Check for instances of `sqlite.exe` or `sqlite3.exe` in the process creation logs, noting any unusual parent processes or execution times that deviate from normal patterns.
  - **Examine Command Line Arguments:** For any detected SQLite actions, analyze the command line arguments specifically looking for references to `cookies.sqlite` or `places.sqlite`, which indicate attempts to access browser-related data.
  - **Correlate File Access Logs:** If available, check file access logs for any read or write operations on the targeted SQLite database files within user profile directories, noting the times and users involved.
  - **Analyze User Activity:** Investigate the context of the user account accessing these databases, especially for accounts with unusual or unauthorized access patterns, and review user session logs for any anomalies that coincide with the detected activity.

  ### Prioritization
  Given the high sensitivity of potential stolen data—such as user cookies and bookmarks—the severity of this alert is high. The likelihood of malicious usage of the SQLite binary for data theft is substantial, especially in environments where web applications and browsers are heavily utilized.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in visibility for environments where SQLite is used for legitimate purposes, which could lead to false positives if not appropriately contextualized. The detection logic assumes that the logs from process creation events are available and adequately configured to capture command line arguments. If logging configurations do not include details about the processes or their command lines, then this rule may fail to trigger appropriately. Additionally, environments with restricted access to browsers may mitigate this risk but require the rule to be adapted for unique operational contexts.

