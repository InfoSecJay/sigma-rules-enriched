  ### Technical Context

  This Sigma rule detects modifications to Internet Explorer's ZoneMap settings that downgrade the security level for HTTP and HTTPS protocols to the “My Computer” zone. This change effectively allows downloaded files from the internet to be treated with the same trust as locally stored files, potentially facilitating the execution of malicious payloads. The likely attacker objective includes executing malicious scripts or code executed through browser vulnerabilities.

  This detection aligns with the MITRE ATT&CK tactics of Execution (T1203) and Defense Evasion (T1203). The primary telemetry sources are Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1 logs capturing command line execution details. The security impact of such a modification is significant, as it increases the risk of executing untrusted code, which can lead to data exfiltration or system compromise. Importantly, this detection does NOT confirm that the activities are inherently malicious; legitimate applications may also adjust these settings.

  ### Investigation Steps

  - **Review Command Line Arguments:**
    Analyze the corresponding process creation logs (Security Event ID 4688) for the command-line argument containing the path `Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults` combined with `http` and `0`. Look for unusual user accounts or system processes initiating this change as a high-confidence malicious indicator.

  - **Identify Recent Software Changes:**
    Investigate any recent software installations or updates within the last 30 days that could explain legitimate behavior associated with ZoneMap changes. Review installation logs for applications that modify browser security settings.

  - **Check Windows Registry:**
    Query the Windows registry (specifically at `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults`) for the values of `http` and `https`. Flag any modifications in these values that deviate from organizational baselines, indicating potential malicious intent.

  - **Monitor User Account Behavior:**
    Assess the account security log (Event ID 4624) to determine if the changes were made by a high-privilege user (e.g., Administrator) or an account with a suspicious login pattern. Legitimate system administrators typically manage these settings.

  - **Review Application Event Logs:**
    Check for application event logs (Event ID 60000 or higher) that indicate changes to system settings or Internet Explorer configurations within the same time frame to identify potential connections to malicious activities.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on systems that rely on Internet Explorer for critical operations, combined with the likelihood of malicious abuse by attackers seeking to execute malware or exploit users. The behavior is commonly weaponized in phishing campaigns or as part of broader attack strategies to escalate privileges and exfiltrate data.

  ### Blind Spots and Assumptions

  Limitations in detection capabilities arise from potential misuse of configuration changes by legitimate administrative tools or scripts, which may inadvertently trigger this alert. Necessary log sources include comprehensive process creation logs and registry modification monitoring, which must be configured correctly for effective detection. Additionally, legitimate user activities such as software installations or updates of security-aware applications may produce similar modifications to ZoneMap settings. Companion detections include monitoring for the execution of suspicious processes post-update, which could provide more context around the risky changes in ZoneMap settings.

