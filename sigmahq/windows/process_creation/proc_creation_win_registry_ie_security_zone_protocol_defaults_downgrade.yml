note: |
  ### Technical Context

  This Sigma rule detects changes to Internet Explorer's ZoneMap configuration, specifically the reassignment of the "HTTP" protocol to the "My Computer" zone. This misconfiguration allows malicious files downloaded from the internet to be treated with the same trust level as local files, potentially leading to malware execution and other security compromises. The likely attacker objective is to exploit this setting to execute undesirable code on targeted systems.

  This behavior aligns with the **MITRE ATT&CK** tactic of **Execution** (T1203). The primary telemetry sources include Windows process creation logs (Event ID 4688) that show command-line activity. If malicious, this could lead to data exfiltration, system compromise, or lateral movement within the network. Importantly, this detection does not confirm successful execution of malicious code by itself; further investigation is required to determine the impact.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Security Event ID 4688 to identify commands executed on the affected system. Look for specific command lines containing `\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults`, `http`, and `0`.

  - **Correlate with user activity:** Determine if the user associated with the alert has legitimate business justification for modifying Internet Explorer settings. Look for recent user activity in Windows Event ID 4624 (Logon) to validate normal user behavior.

  - **Identify malicious indicators:** Look for processes initiated via the command line that potentially indicate compromise, such as known malware hashes. Any command involving ZoneMap configurations without justification should be flagged as suspicious.

  - **Check group policy settings:** Validate if there are any Group Policy Objects (GPOs) enforcing Internet Explorer configurations. Legitimate changes might occur during system updates or IT policy enforcement, seen in logs of relevant GPO applications (Event ID 4101 or 5136).

  - **Investigate network telemetry:** If available, check DNS logs or proxy logs for unusual outbound HTTP/HTTPS requests following the configuration change. This may signal attempted exploitation or data exfiltration.

  - **Assess host criticality:** Determine the role of the affected system (e.g., server, endpoint) to prioritize follow-up actions. Compromised endpoints can lead to lateral movement, especially on critical infrastructure.

  ### Prioritization

  This alert is of high severity due to the potential for significant impact if exploited. Given that this misconfiguration allows a classified security risk, the likelihood of malicious abuse by attackers is elevated. Additionally, tactics that modify security zone settings are weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may be evaded by users with administrative privileges who can restore configurations after a change is detected. Reliable detection requires that process creation logs are properly collected and configured. Legitimate activities such as administrative updates or software installations may trigger the alert inadvertently. It is advisable to implement additional monitoring rules for related Registry changes around IE security settings to strengthen coverage on this exploit vector.

