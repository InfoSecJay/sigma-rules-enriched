note: |
  ### Technical Context

  This rule detects modifications to Internet Explorer's ZoneMap configuration that downgrade the security settings for the "HTTP" and "HTTPS" protocols, allowing web content to be treated with the same trust level as local files. The likely attacker objective is to facilitate the execution of malicious scripts or the installation of malware by bypassing the default security checks that normally prevent potentially harmful content from being executed as trusted. This behavior aligns with the MITRE ATT&CK tactic of **Execution** (TA0002) and the technique **Command and Scripting Interpreter** (T1059).

  The primary telemetry sources involved are Windows process creation logs (Event ID 4688 or Sysmon Event ID 1), which can capture command line activities. The potential security impact is significant; if successfully exploited, it could allow an attacker to execute arbitrary code or install malware without proper security restrictions. However, this detection alone does not confirm an active attack or malicious intent, as legitimate administrative tasks might also modify these settings.

  ### Investigation Steps

  - **Review command line arguments:**
    Check for Event ID 4688 or Sysmon Event ID 1 where the **CommandLine** contains `\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults`, `http`, and `0`. Analyze the context of the process making the change (e.g., user account, execution context).

  - **Identify the user:**
    Determine the user account associated with the process. If the account is a known administrative or legitimate account performing routine maintenance, this could indicate benign activity.

  - **Correlate with other logs:**
    Cross-reference this change with Group Policy logs (Event ID 51468) or security logs to confirm if this was part of a broader configuration management task.

  - **Look for high-confidence malicious indicators:**
    Investigate if the process triggering this change is preceded by known Indicators of Compromise (IoCs) such as unusual process hierarchies, unexpected parent processes leading to this command execution, or usage of scripting tools like PowerShell or WScript.

  - **Check for legitimate use cases:**
    Identify if any maintenance operations or legitimate administrative user actions recently modified the security settings. For example, regular maintenance might include guided use of scripts attempting to reconfigure settings.

  - **Monitor for related activities:**
    Look for subsequent HTTP/S traffic generated by modified settings, especially downloads from external URLs being executed (e.g., using network logs, web proxy logs, or DNS queries).

  ### Prioritization

  The alert severity is high due to the potential for significant impact on the compromised system, where altered security settings can lead to widespread malware deployment. The likelihood of malicious use is also elevated as this technique is a known method for bypassing security measures, and similar misconfigurations are commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection limitations exist if command line logging is not properly configured or if the security settings modify without generating associated process creation logs. Evasion techniques may include attackers using legitimate administrative tools to make changes without raising suspicion. Furthermore, legitimate software installations or administrative configurations can trigger this alert, such as an IT team changing settings for valid use cases. A related detection to consider is monitoring for unexpected HTTP/S traffic patterns, which could indicate exploitation attempts following ZoneMap modifications.

