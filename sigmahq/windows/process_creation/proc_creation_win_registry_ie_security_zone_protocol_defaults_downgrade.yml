note: |
  ### Technical Context
  This Sigma rule detects modifications to Internet Explorer's ZoneMap configuration, specifically changing the trust level of "HTTP" and "HTTPS" protocols to the "My Computer" zone. This configuration enables downloaded files from the Internet to be treated with the same trust authority as files stored locally, potentially allowing malicious files to bypass security measures. Such misconfigurations can facilitate various attacks, including the execution of malicious scripts or payloads that may compromise a user's system or escalate privileges.

  The likely attacker objective is to exploit this configuration change to manipulate how content from the Internet is accessed, potentially leading to the execution of malicious code without appropriate security warnings. This behavior aligns with the following MITRE ATT&CK tactics and techniques:
  - **Execution** (TA0002) - executing unauthorized commands or scripts.
  - **Defense Evasion** (TA0005) - altering system configurations to avoid detection.

  Primary data sources that will provide relevant evidence include:
  - Windows process creation logs, which capture command line arguments and can show manipulations to the registry associated with Internet Explorer settings.

  ### Investigation Steps
  - **Review Command Line Arguments**: Analyze process creation logs to identify any commands modifying the ZoneMap settings. Pay special attention to commands invoking `reg.exe` or `PowerShell` that reference `ZoneMap\ProtocolDefaults`.

  - **Examine Registry Changes**: Investigate the Windows registry, specifically the key corresponding to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults`. Look for recent modifications related to HTTP or HTTPS.

  - **Analyze User Activity**: Correlate the timing of the registry changes with user activity logs to determine if these changes were made by a user session with atypical behavior or outside of normal maintenance windows.

  - **Check for Compromised Accounts**: Investigate the account used to make these changes. Review if the account has known vulnerabilities or signs of compromise, such as unusual logins or access patterns.

  ### Prioritization
  The alert should be treated with high severity due to its ability to facilitate significant security risks, including the execution of malicious files and exploitation of user systems. Given the prevalence of such configurations in targeted attacks, timely investigation is crucial.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that the alert may not capture all methods of modifying the ZoneMap settings, as attackers may employ different techniques or scripts that avoid standard tool footprints. The detection logic assumes that the process creation log captures all relevant command line executions, which may not always be the case if logging is misconfigured. To ensure reliable detection, it is essential to have comprehensive logging enabled for both process creation events and registry modifications.

