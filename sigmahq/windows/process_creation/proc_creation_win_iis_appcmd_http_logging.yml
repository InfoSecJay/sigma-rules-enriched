note: |
  ### Technical Context

  This Sigma rule detects the disabling of HTTP logging on a Windows IIS web server, primarily using the `appcmd.exe` tool to execute a command that alters the IIS configuration. This behavior is indicative of an attacker attempting to evade detection, likely aiming to hide malicious activities or web traffic following an unauthorized entry. The relevant MITRE ATT&CK technique is **T1562.002: Disable or Modify Tools**.

  Primary telemetry sources include Windows process creation logs (Event ID 4688) to capture the execution of `appcmd.exe` and the specific command line arguments used. If this behavior is confirmed to be malicious, it could significantly impact security visibility on the server, leading to undetected data exfiltration or web attacks. Importantly, this detection does not confirm whether the disabling of logging was executed by a legitimate administrator or an attacker.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 for `appcmd.exe` execution. Look for the command line containing `set config section:httplogging dontLog:true`. If found, investigate further.

  - **Monitor IIS configuration changes**: Check the IIS configuration files for changes related to HTTP logging. Legitimate activity would typically show an administrator setting logging options rather than disabling them completely.

  - **Verify user accounts involved**: Investigate the user account executing the command for anomaly. A legitimate administrator should have a known IP address and expected access time; an unfamiliar account may indicate compromise.

  - **Analyze timeline of events**: Correlate the timing of the logging disablement with other events, such as unauthorized access attempts or known compromise indicators (e.g., evidence of lateral movement).

  - **Identify file modifications**: Review the modification timestamps of the related IIS log files, which should have contained the HTTP transaction logs. Use file auditing logs (Object Access Event ID 4663) to check for instances of deletion or access by unauthorized accounts.

  ### Prioritization

  This alert should be treated with high severity, as the affected system (the IIS web server) often hosts critical applications and data. The likelihood of malicious abuse is considerable, given that disabling logging is a tactic commonly used by adversaries to evade detection after exploiting a vulnerability or obtaining unauthorized access.

  ### Blind Spots and Assumptions

  This detection may have limitations because attackers could use variations of the command or different tooling to achieve similar outcomes without triggering the rule. Reliable detection requires monitoring for all process creation events and capturing logs from IIS configuration changes. Legitimate website maintenance or configuration changes may also inadvertently trigger this alert. A related detection to consider would be monitoring for significant changes in web server configurations or access patterns that could signal unauthorized activities.

