note: |
  ### Technical Context

  This rule detects the disabling of HTTP logging on a Windows IIS web server via the use of `appcmd.exe`. This behavior is typically executed by an attacker aiming to eliminate traces of their activities on the server, thereby facilitating ongoing exploitation without detection. The relevant MITRE ATT&CK techniques include Defense Evasion (T1562.002). The primary telemetry source is Windows process creation logs, particularly those capturing executions of `appcmd.exe` with specific command-line arguments. If malicious, the impact could be severe, as it compromises the logging capabilities of the web server, hindering incident response efforts and allowing unauthorized activities to go unnoticed. However, this detection does not confirm that an actual compromise occurred—legitimate administrative changes may also trigger this rule.

  ### Investigation Steps

  - **Check Event IDs for malicious process creation:** Examine Security Event ID 4688 or Sysmon Event ID 1 logs to view the execution of `appcmd.exe`. Look for instances with the command line containing `set config section:httplogging dontLog:true`.

  - **Review process lineage:** Investigate the parent process for the `appcmd.exe` execution. A common benign case might involve IIS management tools executing `appcmd.exe`. If observed from an unusual parent process, it may indicate malicious activity.

  - **Look for alterations in HTTP logging configuration:** Analyze the IIS configuration files or the Microsoft IIS log directory to verify if the HTTP logging has indeed been disabled. Check for expected entries or modifications that align with regular server maintenance.

  - **Identify uncommon account usage:** Check the account that executed the command. If it belongs to a non-admin or unknown user, this could raise suspicion. Compare against typical account usage patterns for server management.

  - **Correlate with external threat intelligence:** Reference external threat intelligence sources to determine if this behavior aligns with known tactics used by Threat Group 3390 (Bronze Union).

  ### Prioritization

  This alert should be treated as high severity because it targets an essential logging function of a web server, which, if disabled, can severely impede forensic investigations post-incident. The likelihood of this behavior being abused by malicious actors is high, given its connection to established tactics of threat groups.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administration tasks to unintentionally trigger the alert. Reliable detection requires appropriate logging configurations, including enabling detailed process creation logging. Additionally, legitimate scenarios may involve updates or administrative changes where HTTP logging is adjusted temporarily. A companion detection to consider could be monitoring for suspicious file deletions or modifications in relevant log directories.

