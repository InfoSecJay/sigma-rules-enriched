note: |
  ### Technical Context
  This rule detects attempts to disable HTTP logging on a Windows IIS web server, a technique frequently employed by threat actors to obfuscate their activities and evade detection. By turning off logging, attackers can eliminate a critical source of forensic evidence that might help investigators trace their actions, ultimately facilitating unauthorized access or data exfiltration. This activity is associated with Threat Group 3390 (Bronze Union), known for employing various tactics to shield their operations from detection.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion** (Tactic) and **Disable or Alter Tools** (Technique ID: T1562.002), which pertains specifically to the manipulation of logging mechanisms as a means to reduce the visibility of malicious actions within an environment. Observing such behavior may indicate a broader attempt to compromise and maintain persistence within the network.

  Primary data sources for this detection include **process creation events** captured by the operating system, where the activities of processes like `appcmd.exe` can be monitored. Additionally, security information and event management (SIEM) systems can aggregate logs to identify the command line arguments used during attempts to alter IIS configurations.

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate the logged process creation events to identify instances of `appcmd.exe`. Look for entries that include command line arguments indicating a change in logging settings.

  - **Analyze Command Line Arguments**: Focus on command line arguments that contain `set config section:httplogging dontLog:true`. This specific command signature is crucial for confirming attempts to disable HTTP logging.

  - **Correlate with Other Logs**: Correlate findings with IIS logs, if available, to establish a timeline of exposure and identify any potential malicious activity that may have occurred before or after logging was disabled.

  - **Investigate User Activity**: Check for user accounts associated with the modification and any related anomalies, such as privileged account usage or connections from unusual geographic locations, that may indicate compromised credentials.

  ### Prioritization
  The severity of this alert is high due to the significant impact that disabling logging can have on an enterprise environment. This action directly undermines the organization's ability to monitor and respond to threats, potentially enabling data breaches and prolonged unauthorized access.

  ### Blind Spots and Assumptions
  One blind spot of this detection is the reliance on process creation logs, which may not capture all contexts of how `appcmd.exe` is leveraged if logging settings are already compromised. The detection logic assumes that the standard application and event logging configurations are intact prior to the alteration. Proper logging configurations on Windows IIS servers are critical for the alert's efficacy; without them, critical events may go undetected. It is assumed that sufficient logging is enabled to capture both process creation events and any subsequent actions taken within IIS.

