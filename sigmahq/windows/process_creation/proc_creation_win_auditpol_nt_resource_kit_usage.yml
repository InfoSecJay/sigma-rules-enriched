note: |
  ### Technical Context

  This detection rule identifies attempts to tamper with the audit policy in a Windows environment via the older version of the `auditpol` binary from the NT Resource Kit. The likely attacker objective is to disable or modify audit settings to evade detection of malicious activity. This behavior is associated with the MITRE ATT&CK technique "Defense Evasion" (T1685.001). The primary telemetry sources for this detection are Windows Process Creation logs, specifically Event ID 4688, which captures command-line usage. The security impact of malicious activity in this context is significant; altering audit policies can prevent detection of subsequent malicious actions, thereby compromising system integrity. This detection does NOT confirm that a compromise has occurred on its own, as legitimate activities may exist that utilize similar command-line parameters.

  ### Investigation Steps

  - **Review Event ID 4688 logs:** Check for instances where the `auditpol` command contains sequences such as `/logon:none`, `/system:none`, etc. This indicates possible tampering with the audit policies.

  - **Cross-reference the command line against legitimate usage:** Legitimate configurations typically do not involve the use of the deprecated `auditpol` version. Validate the environment against standard operating procedures regarding audit policy management.

  - **Evaluate the process lineage:** Use Sysmon Event ID 10 to understand the parent-child process relationships. Unauthorized use of `auditpol` may exhibit atypical parent processes, indicating suspicious behavior.

  - **Identify high-confidence malicious indicators:** Look for multiple instances of policy changes within a short timeframe or associated processes that are not part of standard administration workflows.

  - **Correlate with system integrity checks:** Investigate any recent changes to system integrity protection settings, such as disabling SMB signing which may correlate with evasive techniques employed by attackers.

  ### Prioritization

  This alert warrants high severity due to the criticality of the systems potentially impacted; tampering with audit policies significantly lowers detection capabilities for further malicious actions. The likelihood of malicious abuse is high, as attackers frequently leverage such tactics to persist undetected.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using legitimate tools with similar flags or employing newer `auditpol` versions that do not trigger this rule. Required log configurations must ensure that Process Creation logging is fully enabled on Windows systems. Legitimate system administrators may also use `auditpol`, particularly in troubleshooting scenarios or transitioning from older to newer systems. A related detection that strengthens coverage could include monitoring for unusual changes to security auditing settings via Group Policy changes or registry alterations.

