note: |
  ### Technical Context

  This Sigma rule detects the execution of the legacy `auditpol` utility from the NT resource kit, specifically when it is used to disable critical audit policies. Attackers typically aim to reduce visibility of their activities, thereby impairing the ability of security systems to detect malicious actions. The relevant MITRE ATT&CK techniques are Defense Evasion (T1562.002). Primary telemetry sources include Windows process creation logs, specifically looking for Event ID 4688 or Sysmon Event ID 1 with specific command line arguments. If the activity is confirmed as malicious, it can significantly undermine an organization’s security posture by masking other malicious behavior. This detection alone does not confirm that an individual has been compromised, as legitimate use of the `auditpol` tool, albeit unlikely, could exist in specific scenarios, like system maintenance.

  ### Investigation Steps

  - **Verify process execution context:** Check for the process execution via Windows Security Event ID 4688. Look for `auditpol.exe` with the `/logon:none` or other suppression flags in the command line field. Legitimate use is rare, but valid administrative actions may involve toggling limited audit settings.

  - **Identify user and origin:** Investigate the user account that executed the command and its logon type (e.g., Event ID 4624). Determine whether the user has administrative privileges, and check for known connections to secure or high-risk assets.

  - **Check other audit policies:** Compare current audit policies (use `auditpol /get /category:*`) against a baseline configuration to evaluate unauthorized changes, looking for any notable discrepancies that may indicate policy manipulation.

  - **Correlate timeline with other alerts:** Review other telemetry data around the same time, such as logs from EDR solutions, intrusion detection systems, or firewall logs, to identify related suspicious activities that might support malicious intent.

  - **Review for malicious indicators:** Focus on identifying command line arguments typical of defensively-minded actors, such as the presence of "/system:none" or "/privilege:none". The execution of such suppressive command flags in conjunction with elevated privileges is a strong indicator of suspicious behavior.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on detection capabilities across the enterprise. Given that disabling audit policies is a common tactic for malware and advanced persistent threats, the likelihood of malicious abuse is considerable, warranting immediate analysis.

  ### Blind Spots and Assumptions

  The detection may miss instances where the attacker utilizes alternate methods to alter audit settings without `auditpol`. Organizations must ensure logging of administrative actions is fully enabled to capture any similar activities. Additionally, legitimate administrative tasks that involve audit modification, such as for organizational compliance updates, may inadvertently trigger this alert. A related detection to consider is monitoring changes to security policies or configurations via Group Policy logs (Event ID 4783) for enhanced coverage.

