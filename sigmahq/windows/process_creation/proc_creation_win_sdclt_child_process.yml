note: |
  ### Technical Context

  This rule detects the creation of new processes spawned by the `sdclt.exe` executable, which could indicate the use of the Service Duplicator client (`sdclt`) for privilege escalation or evading User Account Control (UAC). The likely attacker objective is to execute malicious commands or scripts with elevated privileges by exploiting the behavior of `sdclt`. This detection is aligned with the MITRE ATT&CK technique for Privilege Escalation: `T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control)`.

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. Malicious behavior can result in unauthorized access to system resources or data exfiltration. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate software may also create child processes under certain conditions.

  ### Investigation Steps

  - **Check process details for `sdclt.exe`:** Review Security Event ID 4688 for details about the `sdclt.exe` execution, focusing on the ParentImage and CommandLine fields. Legitimate execution may typically originate from trusted system processes.

  - **Examine child processes spawned by `sdclt.exe`:** Look for newly created processes following `sdclt.exe` in Sysmon Event ID 1 logs. Pay special attention to unusual process names or patterns, which would indicate potential malicious activity.

  - **Investigate user context of execution:** Validate the user context under which `sdclt.exe` was executed (via Event ID 4624). Elevated permissions, especially from non-administrative user accounts, could indicate misuse.

  - **Correlate with other event logs:** Cross-reference the timestamp with Web Proxy or Firewall logs (such as Microsoft Defender ATP, Event ID 5156) to identify outbound connections initiated by spawned processes. Unusual destinations or protocols might indicate exfiltration attempts.

  - **Identify common legitimate usage:** Review historical logs for `sdclt.exe` execution within your environment; legitimate operations typically involve system updates or service monitoring. Unusual frequency or patterns could signal malware activity.

  ### Prioritization

  This alert has medium severity, primarily affecting systems with elevated privileges and critical roles, increasing the potential impact of misuse. The likelihood of this specific behavior being weaponized increases with adversarial tactics, especially those related to privilege escalation techniques commonly employed by attackers.

  ### Blind Spots and Assumptions

  Evasion techniques might include process obfuscation or launching `sdclt.exe` from uncommon directories to avoid detection. Reliable detection requires adequate logging of process creation events, which should be configured appropriately on all Windows systems. Legitimate IT administrative tools may trigger this alert, emphasizing the need for contextual analysis. Companion detections, such as logging process creations from known vulnerability exploit tools or administrative scripts, can enhance coverage and provide additional contextual insights.

