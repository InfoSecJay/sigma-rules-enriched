note: |
  ### Technical Context

  This rule detects instances where the Windows process "sdclt.exe" (the Microsoft System Data Collection and Reporting Tool) spawns new child processes. This behavior is often associated with attackers attempting to bypass User Account Control (UAC) to execute unauthorized commands or scripts under elevated privileges. The likely attacker objective is privilege escalation, allowing the adversary to execute malicious payloads with higher privileges unnoticed.

  This behavior maps to MITRE ATT&CK technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control). The primary telemetry source for this detection is the process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture whenever a new process is created. If malicious, this behavior could lead to significant security impacts, such as data exfiltration or unauthorized system access. However, this detection alone does not confirm malicious intent; it merely indicates the occurrence of a potentially suspicious process creation pattern.

  ### Investigation Steps

  - **Check the process parent-child relationship:** Validate that sdclt.exe is indeed the parent process creating the new child processes. Use Sysmon Event ID 1 for the specific logging format to assess the PID relationship.

  - **Validate command line arguments:** Review the command line arguments of the spawned child processes in Sysmon Event ID 1 logs, focusing on unusual or suspicious commands such as scripts, executable paths that do not match enterprise standards, or the use of obfuscation techniques.

  - **Identify legitimate usage scenarios:** Confirm if sdclt.exe is part of legitimate software utilized within the environment (e.g., Windows System Restore). If the process is called from a known legitimate source, it may suggest benign activity rather than an attack.

  - **Investigate the timing of the event:** Correlate the time of the process spawning with other security events such as login events or file access patterns (refer to Security Event ID 4624 and relevant file access logs) to detect any suspicious timing that aligns with known attack patterns.

  - **Monitor for related malicious indicators:** Look for known malicious child processes that frequently occur with sdclt.exe. Specifically, search for common payloads used after bypassing UAC, such as PowerShell or WMIC with Sysmon Event ID 1.

  - **Cross-reference with additional telemetry:** Check for additional alerts in endpoint protection or EDR systems that correlate with the process creation. This can include looking at file creation logs, registry changes, or network connections that might suggest lateral movement or further exploitation post UAC bypass.

  ### Prioritization

  This alert is of medium severity due to the potential impact on systems with heightened privileges. Although the activity can indicate a risk, sdclt.exe may sometimes be invoked legitimately, making the likelihood of malicious abuse context-dependent. The behavior itself is recognized in some attack vectors but does not always guarantee malicious intentions.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative tools that also utilize sdclt.exe for system maintenance, potentially leading to false positives. Proper logging configurations for both Security Event ID 4688 and Sysmon Event ID 1 are needed for reliable monitoring. Additionally, various scheduled tasks or legitimate software installations could trigger similar alerts, requiring analysts to differentiate benign activity from real threats. A companion detection rule for monitoring "UAC bypass events" can enhance coverage, catching additional instances of privilege escalation attempts.

