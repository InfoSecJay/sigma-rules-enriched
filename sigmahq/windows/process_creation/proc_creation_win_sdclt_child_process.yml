  ### Technical Context

  This Sigma rule detects instances where the process `sdclt.exe` (the Windows System Data Communication Link Tool) spawns new processes. This behavior is often seen in attacks leveraging process injection or privilege escalation tactics, specifically using techniques to bypass User Account Control (UAC). The likely attacker objective is to execute malicious payloads with elevated privileges, maintaining persistence or covertly running additional code.

  The relevant MITRE ATT&CK technique is Privilege Escalation (T1548.002). Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) or Sysmon Event ID 1. If this behavior is malicious, it could lead to unauthorized system access or command execution with elevated permissions. Importantly, this detection does NOT confirm malicious activity on its own since legitimate applications might also use `sdclt.exe` for benign purposes.

  ### Investigation Steps

  - **Check event logs for process creation:** Review Security Event ID 4688 for `sdclt.exe` spawning child processes. Specifically, look for suspicious child process names that are atypical for the environment (e.g., command shells, PowerShell scripts, or unfamiliar executables).

  - **Identify parent-child process relationships:** Use Sysmon Event ID 1 to investigate the command line of spawned processes. Legitimate activity typically shows child processes such as `explorer.exe` or Windows utilities, whereas malicious activity may show uncommon executables or scripts.

  - **Analyze command line arguments:** Investigate command line arguments of newly created processes associated with `sdclt.exe`. Look for unusual flags or parameters that do not correlate with known legitimate usage patterns.

  - **Evaluate the context of `sdclt.exe` execution:** Assess the context in which `sdclt.exe` was executed by checking the file path in Event ID 4688. Benign instances should originate from system directories, while suspicious instances might be run from temporary or user home directories.

  - **Correlate with lateral movement indicators:** Review logs for lateral movement indicators following the process execution, including unusual network connections or remote desktop protocol (RDP) logins from the affected host.

  - **Confirm legitimacy of associated binaries:** Validate hashes of the child processes against known malware databases to identify high-confidence malicious indicators, focusing on any executable processes spawned directly by `sdclt.exe`.

  ### Prioritization

  This alert has medium severity due to the potential impact of compromised systems and the likelihood of adversaries utilizing process spawning and UAC bypass techniques. While `sdclt.exe` may be used in legitimate contexts, its misuse is increasingly weaponized for privilege escalation in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate tools or legitimate administrative tasks to trigger the alert. Required log sources include both Security Event ID 4688 and Sysmon Event ID 1 for comprehensive visibility. Legitimate system operations, such as software installations or updates, may also spawn child processes from `sdclt.exe`. A related detection to strengthen coverage could involve monitoring for unusual command line activities associated with elevated privilege processes, such as those detected through Sysmon Event ID 1.

