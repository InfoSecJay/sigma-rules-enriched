  ### Technical Context

  This rule detects the execution of the DInjector PowerShell cradle, which attackers utilize to perform privilege escalation and stealthy code execution within Windows environments. The primary objective for adversaries deploying DInjector is to inject malicious PowerShell code into legitimate processes, thus avoiding detection and maintaining persistence. This behavior aligns with the MITRE ATT&CK framework's techniques, specifically T1055 (Process Injection) under the privilege escalation tactic.

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on specific command-line arguments associated with the DInjector tool. The security impact can be significant, as successful exploitation may lead to unauthorized access and control over targeted systems. However, this detection does NOT confirm that the execution is malicious without additional context or indicators.

  ### Investigation Steps

  - **Review the command line execution:** Check for Security Event ID 4688 or Sysmon Event ID 1 covering the PowerShell process. Look for command line arguments containing " /am51" and " /password" to confirm potential malicious activity.

  - **Cross-reference parent processes:** Verify the parent process of the PowerShell execution. Malicious instances often originate from unusual parent processes like cmd.exe or other non-legitimate tools. Legitimate activities typically stem from known applications like Microsoft Management Console (MMC).

  - **Assess file system changes:** Look for any newly created artifacts associated with this execution, specifically checking for temporary execution files in the user directory or System32 folder that might correlate with DInjector's behavior. Access the file creation events (e.g., event IDs 4608, 4663) for verification.

  - **Consult threat intelligence:** Leverage your threat intelligence platform to check if the identified command line sequences or associated hashes have been flagged in the past. Confirm any correlation with other known attack patterns.

  - **Identify account provenance:** Determine the user context in which this activity occurred. Elevated privileges or execution under service accounts could indicate a higher risk profile for the observed behavior.

  ### Prioritization

  The alert is classified as critical due to the high impact associated with potential privilege escalation capabilities. The likelihood of malicious abuse is significant, particularly given the established use of DInjector in various attack scenarios. This behavior is commonly weaponized by sophisticated adversaries to maintain persistence and evade detection.

  ### Blind Spots and Assumptions

  Detection may be evaded through process hollowing techniques and may not capture all indirect invocations of DInjector if executed from within other scripts or processes. It is crucial to ensure logging for PowerShell execution policies and parameters is correctly configured to capture legitimate PowerShell scripts that might resemble this malicious command structure. Related detections could include monitoring for unusual PowerShell script executions (e.g., the use of encoded command flags) to enhance overall detection capabilities.

