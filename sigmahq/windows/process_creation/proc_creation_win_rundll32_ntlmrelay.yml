logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'C:\windows\system32\davclnt.dll,DavSetCookie'
    - 'http'
    CommandLine|contains:
    - 'spoolss'
    - 'srvsvc'
    - '/print/pipe/'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to exploit the Printer Spooler service by coercing NTLM authentication using a specific command to invoke `rundll32.exe` with the `davclnt.dll` library. The likely attacker objective is to gain unauthorized access elevated privileges on target systems via NTLM relay attacks, particularly targeting the print-related functionalities. This behavior fits within the MITRE ATT&CK framework under Tactic: **Privilege Escalation (TA0004)** and Technique: **Credential Access (T1212)**.

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and relevant entries from Sysmon Event ID 1, tracking process creation with command-line arguments. The security impact is significant as successful exploitation could lead to unauthorized system access and privilege escalation. However, this detection on its own does **NOT** confirm whether a successful compromise occurred—it merely highlights a suspicious activity pattern.

  ### Investigation Steps

  - **Review detailed process creation logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for entries involving `rundll32.exe`, ensuring command-line parameters include `davclnt.dll,DavSetCookie` and terms like `spoolss` or `/print/pipe/`.

  - **Identify command execution origin**: Determine the user context or service account running the command by examining the `SubjectUserSid` or `AccountName` in Event ID 4688. Legitimate usage often involves system processes or on-demand print jobs.

  - **Correlate network activity**: Analyze network logs for connections to print servers or other network resources, focusing on NTLM authentication traffic. Look for unusual login attempts or spikes in traffic to the Print Spooler service.

  - **Validate legitimate print-related activities**: Cross-reference alerts with expected print service activities, like scheduled maintenance tasks or legitimate print job submissions, as these may involve legitimate calls to the Spooler service.

  - **Look for signs of payload delivery**: Review file system logs for new or modified files related to `davclnt.dll` or similar DLL files, verifying if any suspicious external payloads were delivered.

  - **Identify repeat offenders**: If multiple alerts correlate to the same user or machine over a short period, flag that asset for deeper investigation as recurrent behavior may hint at internal compromise or misuse.

  ### Prioritization

  This alert has high severity due to its potential impact on critical systems, as exploitation could lead to significant privilege escalation. It is a known vector in sophisticated attacks, making it likely to be abused by malicious actors actively targeting enterprise environments.

  ### Blind Spots and Assumptions

  Detection can be limited by environments misconfigured for logging or lack of comprehensive monitoring of all involved processes. Legitimate activities, like automated print services interacting with file shares, could inadvertently trigger this alert. Companion detections such as monitoring NTLM authentication failures or unusual access patterns to the Print Spooler service would enhance the coverage and context for investigations.

