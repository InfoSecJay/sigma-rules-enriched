title: Suspicious NTLM Authentication on the Printer Spooler Service
id: bb76d96b-821c-47cf-944b-7ce377864492
status: test
description: Detects a privilege elevation attempt by coercing NTLM authentication
  on the Printer Spooler service
references:
- https://twitter.com/med0x2e/status/1520402518685200384
- https://github.com/elastic/detection-rules/blob/dd224fb3f81d0b4bf8593c5f02a029d647ba2b2d/rules/windows/credential_access_relay_ntlm_auth_via_http_spoolss.toml
author: Elastic (idea), Tobias Michalski (Nextron Systems)
date: 2022-05-04
modified: 2023-02-09
tags:
- attack.privilege-escalation
- attack.credential-access
- attack.t1212
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'C:\windows\system32\davclnt.dll,DavSetCookie'
    - 'http'
    CommandLine|contains:
    - 'spoolss'
    - 'srvsvc'
    - '/print/pipe/'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious NTLM authentication attempts that leverage the Printer Spooler service, specifically through the utilization of the `rundll32.exe` executable to manipulate authentication behavior. In this scenario, an attacker may be attempting to escalate privileges by coercively capturing NTLM credentials, taking advantage of the weak security posture commonly associated with the Printer Spooler service. Such activities typically indicate an effort to move laterally within the environment, gain unauthorized access, or escalate privileges for further exploitation.

  The relevant MITRE ATT&CK tactics include:
  - **Privilege Escalation** (TA0004) – attack techniques used to gain higher-level permissions.
  - **Credential Access** (TA0006) – behaviors related to obtaining account credentials.
  - **Exploitation of Remote Services** (T1212) – exploiting services with elevated privileges to execute unauthorized actions.

  Primary data sources for evidence include process creation logs, which can provide insights into command line arguments and execution context, along with network logs that may detail communications through the Printer Spooler service.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine process creation logs for instances of `rundll32.exe` executing commands containing 'spoolss' and 'davclnt.dll'. Focus on the context and any associated user accounts.

  - **Analyze Network Traffic:** Investigate network logs for connections to the Printer Spooler service or unusual communications related to printing and SMB services, particularly looking for HTTP requests that may indicate credential relay attempts.

  - **Inspect Authentication Logs:** Scrutinize NTLM authentication logs to identify any anomalies in authentication patterns, such as failed logins followed by successful ones, or logins from unusual locations or times.

  - **Review Security Configurations:** Check the configurations related to the Printer Spooler service to ensure appropriate security measures are in place, and investigate any changes in settings or policies that may introduce vulnerabilities.

  ### Prioritization
  This alert is of high severity due to the potential for significant impact on an organization’s security posture, as it involves techniques for privilege escalation and credential capture that could lead to further compromise and lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection logic may not identify all forms of privilege escalation or credential capture activities, especially if they are executed through other means that do not utilize `rundll32.exe` or the Printer Spooler service. Additionally, the effectiveness of the detection relies on the proper logging of process creation events and the capture of relevant command-line arguments. If logging is not enabled or properly configured for these sources, detection may be impaired.

