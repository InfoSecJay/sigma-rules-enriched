    - '\net1.exe'
    - '\PowerShell_ISE.EXE'
    - '\powershell.exe'
    - '\PsService.exe'
    - '\PsService64.exe'
    - '\pwsh.exe'
    - '\sc.exe'
    - '\wmic.exe'           # wmic process call win32_service where name='servicename' delete
