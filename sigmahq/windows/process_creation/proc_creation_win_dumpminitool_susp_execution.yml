title: Suspicious DumpMinitool Execution
id: eb1c4225-1c23-4241-8dd4-051389fde4ce
status: test
description: Detects suspicious ways to use the "DumpMinitool.exe" binary
references:
- https://twitter.com/mrd0x/status/1511415432888131586
- https://twitter.com/mrd0x/status/1511489821247684615
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/DumpMinitool/
author: Florian Roth (Nextron Systems)
date: 2022-04-06
modified: 2023-04-12
tags:
- attack.credential-access
- attack.stealth
- attack.t1036
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\DumpMinitool.exe'
    - '\DumpMinitool.x86.exe'
    - '\DumpMinitool.arm64.exe'
  - OriginalFileName:
    - 'DumpMinitool.exe'
    - 'DumpMinitool.x86.exe'
    - 'DumpMinitool.arm64.exe'
  filter_folder:
    Image|contains:
    - '\Microsoft Visual Studio\'
    - '\Extensions\'          # https://github.com/microsoft/vstest/blob/b2e2126f1aa7e5753cafe9515563c99ade6a59ce/src/package/nuspec/Microsoft.TestPlatform.Portable.nuspec#L159
  susp_flags:
    CommandLine|contains: '.txt'
  cmd_has_flags:
    CommandLine|contains:
    - ' Full'
    - ' Mini'
    - ' WithHeap'
  filter_cmd_misses_flags:
    CommandLine|contains: '--dumpType'
  condition: selection and ( ( not filter_folder ) or susp_flags or ( 
    cmd_has_flags and not filter_cmd_misses_flags ) )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "DumpMinitool.exe" binary, which may indicate potential credential dumping activities, particularly when certain command-line arguments are present or default settings are bypassed. The rule expects the behavior to align with attackers attempting to extract cached credentials or sensitive information from memory, typically using this tool due to its stealthy nature. The relevant MITRE ATT&CK techniques are Credential Dumping (T1003.001) and Masquerading (T1036).

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creation events along with command-line arguments. Should this behavior be malicious, it could lead to unauthorized access or data breach related to sensitive credential stores. Importantly, this detection does NOT confirm that credential dumping is occurring by itself; legitimate uses of the binary may trigger the rule.

  ### Investigation Steps

  - **Review Command-Line Arguments**: Inspect the command-line arguments of the executed instance of DumpMinitool. Look for flags such as “Full”, “Mini”, or “WithHeap” indicating command usage not commonly associated with benign use cases. Focus on the CommandLine field in Security Event ID 4688.

  - **Inspect Process Image Path**: Confirm the Image path of the DumpMinitool process. Executions from non-standard directories could indicate suspicious behavior. Look for entries in Sysmon Event ID 1 where Image contains paths like `\Microsoft Visual Studio\` or `\Extensions\`. Legitimate executions should ideally source from usual system paths.

  - **Check for Suspicious File Creation**: Validate if any .txt files were created in connection with this process. The presence of newly created text files alongside the execution could suggest credential dumping, especially when matched with the susp_flags condition in the event of suspicious activity.

  - **Analyze System Context**: Determine the role of the host where the DumpMinitool was executed. For instance, if the execution occurs on a domain controller or a sensitive server, it amplifies the potential risk and justification for further investigation.

  - **Cross-reference with User Activity**: Review the user context under which DumpMinitool was executed. Compare with intended user roles and see if the user has legitimate access needs that would require such tools. Investigate any anomalous user behaviors or logins around the time of the alert.

  - **Look for Related Indicators**: Identify if any sessions exist indicating other tools typical of credential dumping, like Mimikatz. For example, look for log entries indicating executions that relate to the use of memory access tools, as they may corroborate potentially malicious activity in conjunction with DumpMinitool.

  ### Prioritization

  Alerts triggered by this rule should be prioritized as high due to the significant potential for data breach and credential theft if malicious. The impact is particularly severe if the activity is detected on high-value target systems, thereby increasing the likelihood of an adversary conducting credential dumping as this technique is frequently weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of DumpMinitool in development environments, leading to false positives. Reliable detection necessitates proper logging of command-line arguments and system access paths. Additionally, scenarios where users may legitimately use similar tools, such as for testing purposes, could inadvertently trigger this rule. Companion detections, such as monitoring for process injections or unexpected use of memory scraping tools, can enhance coverage and context around this activity.

