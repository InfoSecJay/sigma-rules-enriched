title: Suspicious DumpMinitool Execution
id: eb1c4225-1c23-4241-8dd4-051389fde4ce
status: test
description: Detects suspicious ways to use the "DumpMinitool.exe" binary
references:
- https://twitter.com/mrd0x/status/1511415432888131586
- https://twitter.com/mrd0x/status/1511489821247684615
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/DumpMinitool/
author: Florian Roth (Nextron Systems)
date: 2022-04-06
modified: 2023-04-12
tags:
- attack.defense-evasion
- attack.credential-access
- attack.t1036
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\DumpMinitool.exe'
    - '\DumpMinitool.x86.exe'
    - '\DumpMinitool.arm64.exe'
  - OriginalFileName:
    - 'DumpMinitool.exe'
    - 'DumpMinitool.x86.exe'
    - 'DumpMinitool.arm64.exe'
  filter_folder:
    Image|contains:
    - '\Microsoft Visual Studio\'
    - '\Extensions\'          # https://github.com/microsoft/vstest/blob/b2e2126f1aa7e5753cafe9515563c99ade6a59ce/src/package/nuspec/Microsoft.TestPlatform.Portable.nuspec#L159
  susp_flags:
    CommandLine|contains: '.txt'
  cmd_has_flags:
    CommandLine|contains:
    - ' Full'
    - ' Mini'
    - ' WithHeap'
  filter_cmd_misses_flags:
    CommandLine|contains: '--dumpType'
  condition: selection and ( ( not filter_folder ) or susp_flags or ( 
    cmd_has_flags and not filter_cmd_misses_flags ) )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious execution of the `DumpMinitool.exe` binary, which is often used for memory dumping on Windows systems. The primary objective of an attacker leveraging this tool would be to extract sensitive data from the memory of processes, typically to harvest credentials or other sensitive information. This behavior corresponds with the MITRE ATT&CK frameworks, specifically Tactics: **Credential Access** (TA0006) and **Defense Evasion** (TA0005), Techniques: **Credential Dumping** (T1003.001) and **Obfuscated Files or Information** (T1027).

  The primary telemetry sources for this detection include Windows process creation logs, specifically filtered for Event ID 4688 (New Process Created) or Sysmon Event ID 1 (Process Creation). If utilized with malicious intent, the impact to the organization could be significant, potentially leading to data breaches involving sensitive user information. It is critical to note that this detection does NOT confirm malicious intent on its own, as `DumpMinitool` might be used legitimately in certain contexts.

  ### Investigation Steps

  - **Verify Process Creation Logs:** Review Event ID 4688 logs for process creation of `DumpMinitool.exe` and note the parent process. A benign instance typically originates from a legitimate application context, such as Microsoft Visual Studio or testing frameworks.

  - **Analyze Command Line Arguments:** Look within the command line field for Event ID 4688 or Sysmon Event ID 1 for indications of suspicious flags, specifically `--dumpType` absence, as well as `Full`, `Mini`, or `WithHeap` presence. A lack of expected flags combined with high-use flags significantly increases the likelihood of malicious activity.

  - **Investigate the Parent Process:** Examine the parent process's path to determine legitimacy. If executed from non-development directories (e.g., C:\Users\Public), it may indicate an unauthorized use case or attack.

  - **Check Output File Locations:** If possible, validate if any output files are created in unexpected locations (e.g., system folders or user profile directories) after `DumpMinitool` runs. Analyze file creation timestamps and user accounts associated with those files.

  - **Cross-reference with User Behavior:** Compare the execution time of `DumpMinitool.exe` against known user activity logs. Legitimate development or testing activities may correlate with its execution, whereas isolated runs during non-business hours may be considered suspicious.

  ### Prioritization

  This alert is classified as high-priority in an enterprise context due to its association with credential theft and defense evasion tactics. Given the potential impact of compromised credentials and the tool's commonality in both legitimate and malicious activities, analysts should respond promptly to verify the context of the execution.

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete logging configurations; ensure all relevant process creation events are captured. `DumpMinitool.exe` may also be executed through legitimate development activities involving debuggers or analysis tools, making contextual understanding essential. A related detection to consider is the monitoring of known credential dumping tools such as `Mimikatz`, which can be cross-referenced to strengthen coverage against memory manipulation attacks.

