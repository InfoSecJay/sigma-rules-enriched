title: Suspicious DumpMinitool Execution
id: eb1c4225-1c23-4241-8dd4-051389fde4ce
status: test
description: Detects suspicious ways to use the "DumpMinitool.exe" binary
references:
- https://twitter.com/mrd0x/status/1511415432888131586
- https://twitter.com/mrd0x/status/1511489821247684615
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/DumpMinitool/
author: Florian Roth (Nextron Systems)
date: 2022-04-06
modified: 2023-04-12
tags:
- attack.defense-evasion
- attack.credential-access
- attack.t1036
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\DumpMinitool.exe'
    - '\DumpMinitool.x86.exe'
    - '\DumpMinitool.arm64.exe'
  - OriginalFileName:
    - 'DumpMinitool.exe'
    - 'DumpMinitool.x86.exe'
    - 'DumpMinitool.arm64.exe'
  filter_folder:
    Image|contains:
    - '\Microsoft Visual Studio\'
    - '\Extensions\'          # https://github.com/microsoft/vstest/blob/b2e2126f1aa7e5753cafe9515563c99ade6a59ce/src/package/nuspec/Microsoft.TestPlatform.Portable.nuspec#L159
  susp_flags:
    CommandLine|contains: '.txt'
  cmd_has_flags:
    CommandLine|contains:
    - ' Full'
    - ' Mini'
    - ' WithHeap'
  filter_cmd_misses_flags:
    CommandLine|contains: '--dumpType'
  condition: selection and ( ( not filter_folder ) or susp_flags or ( cmd_has_flags
    and not filter_cmd_misses_flags ) )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious usage of the "DumpMinitool.exe" binary, a tool often employed by attackers to extract and manipulate process memory. The primary objective of such activity is typically to capture sensitive data, particularly credentials or other sensitive information stored in memory. This behavior could align with broader credential theft tactics, where adversaries aim to escalate privileges or maintain persistence within an environment.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Defense Evasion (TA0005)**: Attackers may use various techniques to avoid detection by security tools.
  - **Credential Access (TA0006)**: Specifically, this may relate to techniques such as **T1036 (Masquerading)** and **T1003.001 (Credential Dumping: LSASS Memory)**, indicating the tool's potential misuse to access sensitive credentials.

  Primary data sources that could provide valuable telemetry include:
  - **Process creation events**: These logs will capture the execution details of the DumpMinitool executable, including command line arguments.
  - **File system logs**: To monitor access to specific locations that are often used in legitimate application interactions (e.g., Microsoft's Visual Studio folders).

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate log entries for all instances of `DumpMinitool.exe` execution. Pay particular attention to command line arguments, especially suspicious flags or unusual context in which the tool was invoked.

  - **Analyze Command Line Arguments**: Focus on identifying parameters that indicate potentially malicious usage; flags like `Full`, `Mini`, or `WithHeap` are concerning, especially when not accompanied by the `--dumpType` option.

  - **Examine Suspicious File Paths**: Check the execution context to see if DumpMinitool was run from unusual directories, especially those unrelated to its legitimate operations, which might suggest an attempt to obfuscate malicious intent.

  - **Cross-Reference with Known Indicators**: Validate against existing intelligence or previous investigations regarding memory dumping tools, correlating any findings with TTPs observed in past incidents.

  ### Prioritization
  This alert is classified as high severity due to the potential for the weaponization of leaked credentials, which could facilitate lateral movement or even breach of sensitive systems, depending on the user's access level. Any indication of DumpMinitool usage should be treated with urgency and thoroughly investigated.

  ### Blind Spots and Assumptions
  The main gaps in detection coverage include environments where logging for process creation is insufficient or misconfigured, as well as instances where the attacker may rename the executable to evade detection. Assumptions also include that the logs will contain comprehensive command line arguments and that security controls are in place to prevent the usage of this tool in non-legitimate scenarios. For optimal function of the alert, ensure process creation logging is enabled across all endpoints where user interaction may occur.

