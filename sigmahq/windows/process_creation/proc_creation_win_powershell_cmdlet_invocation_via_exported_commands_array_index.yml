note: |
  ### Technical Context

  This Sigma rule detects PowerShell commands that utilize obfuscated, indirect invocation of cmdlets from the Microsoft.PowerShell.Utility module through array indexing of the ExportedCommands property. The likely attacker objective is to execute malicious scripts while evading detection mechanisms that typically observe explicit command strings, such as `Invoke-RestMethod`. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1086: PowerShell) and Execution (T1059.001: PowerShell). The primary telemetry sources include process creation logs from Windows (Event ID 4688) and PowerShell command line activity. If successful, this could lead to unauthorized execution of malicious code. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate scenarios may involve similar behavior under specific conditions.

  ### Investigation Steps

  - **Review suspicious command lines:** Examine process creation logs for Event ID 4688, particularly for PowerShell processes with CommandLine containing `Get-Module -ListAvailable 'Microsoft.PowerShell.Utility'` and `ExportedCommands.Values`. Malicious commands typically utilize complex obfuscation and index array accesses.

  - **Identify legitimate PowerShell usage:** Look for standard usage patterns where ExportedCommands array indexing is employed in a non-obfuscated context, which should be rare. Expected command lines usually have clear, recognizable cmdlet names without excessive obfuscation.

  - **Check for known malicious indicators:** Investigate any URLs in command lines pointing to external scripts (for example, a URL containing `raw.githubusercontent.com`). If detected, validate whether it leads to known malicious scripts listed in threat intelligence sources.

  - **Verify file creation and exfiltration:** Validate file system activity where files are created in unusual paths, such as `C:\Temp\maldoc.ps1`. Use file creation timestamps to check if the script corresponds to the process invocations.

  - **Analyze process parentage:** Check process lineage to confirm whether the PowerShell command was spawned from a trusted process or suspicious parent. Leverage Sysmon Event ID  ParentImage to trace lineage.

  - **Cross-reference with other detections:** Look for companion detections, such as Unauthorized PowerShell module loading or network connections (based on corresponding alerts) which can strengthen the context around the alert.

  ### Prioritization

  This alert is high priority due to the potential of invoking malicious scripts in the environment, particularly if the affected system has critical assets or sensitive data. The obfuscated nature of the command increases the likelihood of misuse, and similar techniques are increasingly observed in real-world attacks against enterprises.

  ### Blind Spots and Assumptions

  Evasion techniques may include more complex obfuscation of command lines that are not caught by simplistic pattern matches. Reliable detection requires the comprehensive logging of PowerShell events and configurations to capture all relevant telemetry. Furthermore, legitimate administrative activities may utilize similar command patterns for valid use cases. A related detection to consider is PowerShell command execution that includes typical obfuscation sequences as a complementary detection strategy.

