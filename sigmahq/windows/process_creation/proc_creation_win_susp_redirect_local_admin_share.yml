title: Suspicious Redirection to Local Admin Share
id: ab9e3b40-0c85-4ba1-aede-455d226fd124
status: test
description: Detects a suspicious output redirection to the local admins share, this
  technique is often found in malicious scripts or hacktool stagers
references:
- https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
- http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
author: Florian Roth (Nextron Systems)
date: 2022-01-16
modified: 2023-12-28
tags:
- attack.exfiltration
- attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection_redirect:
    CommandLine|contains: '>'
  selection_share:
    CommandLine|contains:
    - '\\\\127.0.0.1\\admin$\\'
    - '\\\\localhost\\admin$\\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious attempts to redirect output to local administrative shares, specifically targeting administrative shares such as `\\127.0.0.1\admin$` and `\\localhost\admin$`. Such behavior is often indicative of malicious activities where threat actors use tools or scripts to manipulate or exfiltrate data in a covert manner. The underlying objective may be to perform reconnaissance, elevate privileges, or stage malicious payloads.

  This activity aligns with the MITRE ATT&CK frameworks, particularly the Exfiltration tactic (T1048) where adversaries may try to utilize local shares for data movement. By redirecting output to administrative shares, attackers can potentially execute commands or scripts with elevated permissions, which poses significant risks to the integrity and confidentiality of the system and its data.

  The primary data sources to analyze for this detection would be process creation logs, which capture command line arguments used when processes are initiated. Capturing events from the system that detail command execution provides critical evidence of potential exploits or misuse of administrative capabilities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Start by examining process creation logs for entries that include command line arguments with output redirection (e.g., `>`), particularly those referencing local administrative shares.
  - **Correlate with User Activity:** Cross-reference the timing and context of the command execution with user account activity. Look for accounts that may not typically perform such operations or follow a suspicious pattern that suggests compromise.
  - **Check for Related Network Activity:** Investigate network logs for any additional connections to administrative shares or unusual SMB traffic that corresponds with the identified process creation events.
  - **Analyze Suspicious Scripts or Tools:** If a specific script or tool is identified, analyze its contents to determine its purpose, especially look for patterns or actions typical of known hacking tools or techniques.

  ### Prioritization
  This alert merits high severity due to the potential impact of unauthorized access to sensitive system areas and the likelihood that such activities indicate a compromised host or malicious intent. If left unchecked, these actions could lead to significant data breaches or system compromises.

  ### Blind Spots and Assumptions
  While this rule provides coverage for output redirection to local administrative shares, it may not capture all legitimate administrative activities that involve these shares. Furthermore, the detection relies on the accurate logging of process creation events; if logging is not enabled or configured correctly, detection may fail. The assumption is made that the threat actor will utilize these command line patterns, which may not encompass all possible evasion tactics employed by sophisticated attackers.

