logsource:
  category: process_creation
  product: windows
detection:
  selection_redirect:
    CommandLine|contains: '>'
  selection_share:
    CommandLine|contains:
    - '\\\\127.0.0.1\\admin$\\'
    - '\\\\localhost\\admin$\\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the suspicious output redirection of command line arguments to a local administrative share (\\127.0.0.1\admin$ or \\localhost\admin$). This behavior is often associated with malicious scripts or tools attempting to stage or exfiltrate data to a local file share, signaling a potential compromise within the environment. The likely adversary objective is to execute commands and redirect outputs to the administrative share for later retrieval or exploitation.

  This activity aligns with the MITRE ATT&CK techniques T1048 (Exfiltration Over Alternative Protocol) and T1049 (Exfiltration Over Command and Control Channel). Primary telemetry source includes Windows process creation logs, specifically Security Event ID 4688 and related Sysmon Event ID 1 with fields focused on CommandLine details. If confirmed malicious, this behavior can enable attackers to collect sensitive information or maintain persistence. Importantly, this detection does not confirm compromise on its own; further investigation is necessary to validate intent and outcome.

  ### Investigation Steps

  - **Analyze the command line arguments:** Review Security Event ID 4688 and Sysmon Event ID 1 for command lines containing '>' and checks for redirection paths to local admin shares. Look for variations in the command that might indicate legitimate use versus potentially malicious intent.

  - **Review user account context:** Identify the user account associated with the process creation by checking the respective log fields (e.g., ‘NewProcessName’ and ‘UserName’). Legitimate administrative actions may show authorized users, while anomalous accounts may indicate misuse.

  - **Identify the parent process:** Check the parent process ID (ProcessID) in the logs to establish the origin of the command. Malicious exploits often have recognizable parents, like PowerShell or cmd.exe, while legitimate redirection may come from known sysadmin tools.

  - **Check for known scripts or tools:** Cross-reference the detected command with threat intelligence resources or internal repositories to see if it matches known malicious scripts or tools that exhibit such behavior.

  - **Confirm persistence mechanisms:** If the redirection is part of a broader suspicious activity, determine whether any scheduled tasks, services, or registry modifications are present that indicate a higher level of threat.

  ### Prioritization

  This alert carries a high severity level due to the significant potential impact on confidentiality, integrity, and availability of sensitive data, combined with a relatively high likelihood of being exploited by adversaries. The technique of redirecting output to administrative shares is a recognized behavior among attackers and is often a precursor to data exfiltration.

  ### Blind Spots and Assumptions

  Limitations may arise from legitimate administrative activities that might also trigger this alert, such as authorized scripts performing data backup or logging operations. Required log sources include comprehensive Windows Event logs, and proper Sysmon configuration to capture detailed process creation events. A related detection to strengthen coverage would be monitoring for access to the admin shares, particularly involving unauthorized user accounts or unusual times.

