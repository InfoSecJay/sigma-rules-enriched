logsource:
  category: process_creation
  product: windows
detection:
  selection_redirect:
    CommandLine|contains: '>'
  selection_share:
    CommandLine|contains:
    - '\\\\127.0.0.1\\admin$\\'
    - '\\\\localhost\\admin$\\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_redirect_local_admin_share/info.yml
note: |
  ### Technical Context

  This Sigma rule detects behaviors indicative of malicious attempts to redirect output to local administrative shares, typically seen in attack scenarios involving data exfiltration or malware installation. The likely objective of the attacker is to save command output or malware components to hidden shared locations for later retrieval or execution. This activity is categorized under the MITRE ATT&CK tactic "Exfiltration" (ID: TA0010) and technique "Exfiltration Over Alternative Protocol" (T1048).

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688, which provides insights into command-line inputs. If detected, the security impact may involve unauthorized access to sensitive data or malware persistence within an organization. This detection alone does NOT confirm that malicious activity has occurred, as legitimate system maintenance tasks could potentially generate similar behavior.

  ### Investigation Steps

  - **Inspect process creation logs**: Review Security Event ID 4688 for processes that match commands containing redirection to `\\127.0.0.1\admin$` or `\\localhost\admin$`. Look for unusual user accounts or timestamps that do not align with expected administrative behavior.

  - **Evaluate the command line details**: Analyze the CommandLine field for the specific use of `>` followed by the share path. Legitimate commands do not commonly redirect output to administrative shares; thus, see if the involved processes are known or expected administrative scripts.

  - **Correlate logged users with expected behavior**: Consider user roles; legitimate local administrators may occasionally redirect output for maintenance. Cross-reference noted users with expected administrative activities to confirm validity.

  - **Identify high-confidence malicious indicators**: Look for evidence of suspicious PowerShell use or other scripting languages that commonly exhibit this behavior, notably without proper user context or justification.

  - **Review share access logs**: Gather data from SMB logs indicating any recent access attempts to `admin$` shares, particularly any that follow the redirection events. Unusual timestamps or non-administrative user access should heighten concern.

  - **Check for persistence indicators**: Look for newly created files in the targeted share location, including unusual file extensions or modified timestamps coinciding with suspicious process creation events. Validate the signatures of files created and compare them against known malicious hashes.

  ### Prioritization

  This alert indicates high severity due to the potential impact on sensitive data and system integrity. The likelihood of abuse is significant, as this technique is commonly utilized in exploitation frameworks. Given its association with hacking tools, proactive investigation is crucial to prevent further compromise.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers use alternative protocols or techniques to achieve similar outcomes, such as directly leveraging administrative shares without redirection commands. It requires accurate configuration of logging settings on Windows to capture the necessary telemetry reliably. Legitimate backup scripts or administrative tasks may trigger this alert, necessitating careful context evaluation. Related detections include monitoring for unexpected file creations in administrative shares or fallback commands that do not typically use redirection.

