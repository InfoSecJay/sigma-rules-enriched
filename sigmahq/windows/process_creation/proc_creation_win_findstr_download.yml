logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_download_1:
    CommandLine|contains|windash: ' -v '
  selection_cli_download_2:
    CommandLine|contains|windash: ' -l '
  selection_cli_download_3:
    CommandLine|contains: '\\\\'
  condition: selection_findstr and all of selection_cli_download_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of the `findstr.exe` command in Windows with specific command-line arguments that indicate an attempt to download content from a remote file share. The likely objective of this behavior is data exfiltration or lateral movement, allowing an adversary to retrieve potentially sensitive files without using more commonly detected tools. This activity directly maps to the MITRE ATT&CK technique "Use of CMD for Lateral Movement" (T1218) and "Credential Dumping" (T1552.001). The primary telemetry sources include process creation logs, specifically focusing on Event ID 4688 in Windows Security logs and Sysmon Event ID 1. If successful and malicious, the impact includes unauthorized data access or theft from corporate resources. However, this detection does NOT prove that malicious activity has occurred without additional context or corroborating evidence.

  ---

  ### Investigation Steps

  - **Review process creation events:** Look for Security Event ID 4688 or Sysmon Event ID 1 that corresponds to `findstr.exe` execution. Confirm the legitimate execution context (such as administrative tasks) versus unusual contexts (e.g., non-admin accounts executing the command).

  - **Inspect command-line arguments in detail:** Identify if the command-line includes both `-v` and `-l` flags paired with a remote share path. Such flags indicate attempts to retrieve data. Example monitoring fields: `CommandLine`, `Image`, `WorkingDirectory`.

  - **Verify access to the flagged remote share:** Access logs or file shares should reveal if the requesting user has legitimate permissions to access the remote file shares. Check audit logs for any unauthorized access or failed attempts to open files.

  - **Correlate against the asset's role:** Determine whether the device initiating the command is classified as a sensitive or critical asset. If the asset is a user workstation, the severity may be increased.

  - **Cross-reference with known baselines:** Compare the command execution against baseline behavioral data for user activity to identify anomalies, such as a user who typically does not use `findstr.exe` or access file shares.

  - **Identify unusual user behavior:** Look for patterns indicating lateral movement, such as repeated remote file access from a user account that typically doesn’t initiate remote connections.

  ---

  ### Prioritization

  This alert has medium severity due to its potential for abuse in an enterprise context. Since this behavior can be indicative of data exfiltration tactics, the likelihood of malicious intent is moderate, especially if flagged from sensitive assets. The use of `findstr.exe` for file retrieval is less common, potentially heightening its risk profile.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging mechanisms do not capture all relevant process creations or command-line arguments. Some attackers may obfuscate this technique using alternative tools or flags. Legitimate activities, such as system administrators performing diagnostics, may trigger this alert. Related detections, like those monitoring for SMB enumeration or suspicious file access (e.g., Sysmon network connections), can strengthen the overall incident response coverage.

