logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_download_1:
    CommandLine|contains|windash: ' -v '
  selection_cli_download_2:
    CommandLine|contains|windash: ' -l '
  selection_cli_download_3:
    CommandLine|contains: '\\\\'
  condition: selection_findstr and all of selection_cli_download_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `findstr.exe` with specific command-line arguments indicative of downloading files from remote shares. The `findstr` command, when used with flags `-v` and `-l` along with a UNC path, can unintentionally serve as a means for threat actors to exfiltrate data or manipulate files from remote locations. This behavior aligns with the tactics of data exfiltration and command and control, where an attacker may attempt to retrieve sensitive information from compromised systems.

  The scenario typically involves malicious actors leveraging non-standard tools or commands to obscure their activities, thereby attempting to evade detection mechanisms. By using `findstr`, which is often a benign utility for searching strings in files, they can sidestep traditional firewall and endpoint protections. The relevant MITRE ATT&CK techniques include:
  - **T1218 - Signing of Trusted Code**: Using trusted binaries to execute commands.
  - **T1105 - Ingress Tool Transfer**: Transferring tools or files to a compromised system.
  - **T1564.004 - Hide Artifacts**: Utilizing obscure methods to download or hide data.
  - **T1552.001 - Application Layer Protocol: Web**: Such as accessing remote shares via HTTP or SMB.

  The primary data sources for this detection will include process creation logs that record command executions on Windows systems, providing insights into executed command-line arguments and files accessed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events for instances of `findstr.exe` to verify the command-line arguments used, especially filtering for the presence of `-v`, `-l`, and any UNC paths.
  - **Analyze Network Traffic**: Look at network logs for unusual traffic directed toward remote shares or other external resources during the timeframe of the suspicious execution, particularly focusing on SMB traffic.
  - **Correlate with User Activity**: Check user activity logs to determine if the account executing the command had prior suspicious behavior or was associated with compromised credentials.
  - **Audit File Integrity**: Investigate any altered or downloaded files in relation to the remote share to gauge the impact and confirm whether sensitive data was potentially exfiltrated.

  ### Prioritization
  This alert carries medium severity due to the potential risk associated with data exfiltration and the covert collection of sensitive information. The likelihood of encountering this behavior is moderate in environments where external file shares are regularly accessed, thus warranting prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate uses of `findstr` that are not malicious, leading to false positive alerts. The detection logic assumes that an attacker will utilize these specific command-line arguments, which may not account for all possible variations of malicious file access methods. Effective logging from the process creation category is essential for this rule to function properly, necessitating an appropriate configuration of logging policies across the Windows environment.

