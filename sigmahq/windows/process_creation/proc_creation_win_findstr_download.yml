logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_download_1:
    CommandLine|contains|windash: ' -v '
  selection_cli_download_2:
    CommandLine|contains|windash: ' -l '
  selection_cli_download_3:
    CommandLine|contains: '\\\\'
  condition: selection_findstr and all of selection_cli_download_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_findstr_download/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `findstr.exe` command-line utility with specific flags that enable the tool to download content from a remote share. The likely objective of the attacker might be to retrieve files from a remote location discretely, avoiding typical download methods that may trigger alerts. This behavior aligns with several MITRE ATT&CK techniques, notably Command and Control (T1218) and Exfiltration Over Command and Control Channel (T1041). The primary telemetry source is Windows process creation logs, specifically looking for Event ID 4688 tied to command execution logs.

  If malicious, this behavior suggests potential data exfiltration or the transfer of malicious payloads. However, this detection alone does not confirm that malicious intent was present, as benign use cases exist for similar command executions under legitimate administrative tasks.

  ### Investigation Steps

  - **Review command execution context:** Examine the process creation logs for Event ID 4688, focusing on User SID and Parent Process ID. Legitimate usage typically involves `findstr.exe` being executed by admin users for file searches rather than data downloads.

  - **Analyze command line arguments:** Inspect the command line arguments for any instance of `findstr` that contains `-v`, `-l`, and a remote share indicator like `\\\\`. If these parameters are present, further scrutiny is needed as they indicate potential malicious file interaction.

  - **Identify remote share access:** Check for access logs to the remote share referenced in the command. If significant data retrieval has occurred or the account does not usually access that share, it raises suspicion.

  - **Correlate user activity over time:** Utilize SIEM solutions to correlate the user’s behavior leading to the alert, tracking login times, remote command executions, and any unusual patterns in accessing other resources to build a profile of normal vs. suspicious activity.

  - **Examine the destination environment:** Determine the role of the affected asset. If it is a non-administrative host or an asset that typically does not interact with remote resources, this raises the risk profile for potential malicious activity.

  ### Prioritization

  This alert should be considered medium severity within enterprise environments. The affected system's classification, specifically if it's a critical asset, combined with the likelihood of this behavior being weaponized by adversaries for stealthy data exfiltration, warrants timely investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion techniques, such as renaming tools or launching them within unusual directories that are not monitored. Ensuring that logging captures detailed command-line invocation is essential for reliable detection. Legitimate administrative tasks may trigger the alert, particularly in scenarios where remote file access is warranted. A companion detection to consider is the monitoring of SMB access logs, which may indicate unusual read patterns correlating with the time of `findstr.exe` executions.

