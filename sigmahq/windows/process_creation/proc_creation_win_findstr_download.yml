logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_download_1:
    CommandLine|contains|windash: ' -v '
  selection_cli_download_2:
    CommandLine|contains|windash: ' -l '
  selection_cli_download_3:
    CommandLine|contains: '\\\\'
  condition: selection_findstr and all of selection_cli_download_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the `findstr.exe` command-line tool with specific flags that suggest an attempt to download content from a remote share. The likely objective of an attacker is to access sensitive files from an external network location, potentially facilitating data exfiltration or lateral movement within a target environment. The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1564.004) and Command and Control (T1105).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 for process creation, capturing the `CommandLine` and `Image` fields. The security impact of such behavior could be significant, as it may indicate an attempt to retrieve data that could compromise the organization’s security posture. However, this detection alone does not confirm malicious intent; it could also arise from legitimate uses of the `findstr` command to pull files for valid administrative purposes.

  ### Investigation Steps

  - **Evaluate the command line parameters:** Analyze the `CommandLine` field from Event ID 4688. Look for the presence of `-v` and `-l` flags, along with any UNC paths (e.g., `\\\\`). Legitimate usage typically includes structured paths that do not point to unknown external locations.

  - **Identify remote paths:** Review the `CommandLine` for any UNC paths. Benign cases may involve internal domain shares (`\\domain\share`). Malicious indicators include paths pointing to external IPs or domains, especially from untrusted or unexpected locations.

  - **Cross-reference process source:** Use Sysmon Event ID 1 to verify the parent process of `findstr.exe`. Legitimate activity often originates from trusted administrative scripts or tools (e.g., PowerShell or batch files) whereas unusual parent processes may indicate malicious workflows.

  - **Check process creation frequency:** Analyze the time and frequency of the alerting process' execution across Windows event logs. Frequent execution in a short time span may suggest automated or scripted attacks, indicative of malicious actions.

  - **Correlate with user behavior:** Validate the corresponding user account associated with the alert. Known administrative users performing usual maintenance tasks with `findstr` is expected; however, unexpected users (especially with low privileges) should raise suspicion.

  - **Examine network traffic:** Investigate related network logs (e.g., DNS requests or firewall logs) for any outgoing connections to the resolved IP from the detected UNC path during `findstr` execution.

  ### Prioritization

  This alert should be considered medium-priority. The impact is heightened if the affected system is part of critical infrastructure or has access to sensitive data. Furthermore, the likelihood of malicious exploitation is significant, as similar techniques are known to be weaponized for command and control-related activities.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing alternative methods to bypass standard command usage, such as aliases or PowerShell alternatives. This rule relies on Windows event logging, and any misconfigurations or lack of Sysmon deployment may result in missed detections. Legitimate scenarios could include administrative tasks performed by IT staff. A related detection rule for PowerShell usage, especially for remote calls (e.g., T1059.001), may enhance overall coverage for similar malicious behaviors.

