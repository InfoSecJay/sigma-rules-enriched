logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
  - CommandLine|contains: findstr
  - Image|endswith: 'findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_cli_download_1:
    CommandLine|contains|windash: ' -v '
  selection_cli_download_2:
    CommandLine|contains|windash: ' -l '
  selection_cli_download_3:
    CommandLine|contains: '\\\\'
  condition: selection_findstr and all of selection_cli_download_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the `findstr.exe` command with specific flags that facilitate downloading content from a remote file share. The likely objective of an attacker is to exfiltrate or manipulate data from a remote resource, often as part of a command-and-control operation or credential access. This behavior aligns with the MITRE ATT&CK framework techniques: "T1105 - Ingress Tool Transfer" and "T1564.004 - Hide Artifacts: Alternate Data Streams". Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the security impact can lead to significant data exfiltration or unauthorized access to sensitive resources. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; it merely indicates the execution of a potentially suspicious command.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for the execution of `findstr.exe` with a command line containing `-v`, `-l`, or a UNC path (e.g., `\\\\`). Look for unusual execution timestamps or user context, implying potential misuse.

  - **Inspect file access events**: Validate logs from the file share (e.g., SMB logs) to determine if the command led to an actual file being accessed or downloaded. Look for files accessed immediately following the execution within 5 minutes.

  - **Assess the command line**: Examine the full command line used to invoke `findstr.exe`. Legitimate operations will typically not include the flags `-v` and `-l` together with a UNC path, while suspicious use will prominently feature these elements.

  - **Identify possible legitimate scenarios**: Consider context where the rule might trigger legitimately, such as scheduled tasks or scripts used by system administrators for maintenance that utilize `findstr.exe` in expected ways. Document user roles involved in these operations.

  - **Look for related artifacts**: Review for alternate data streams (ADS) associated with the file being accessed from the remote share. Use tools like Sysinternals or PowerShell to audit for unexpected ADS on newly downloaded files.

  - **Monitor user behavior patterns**: Check user behavior analytics to identify whether the user that executed the command has demonstrated atypical access patterns or is attempting unauthorized access to sensitive systems or data.

  ### Prioritization

  This alert has a medium severity level, particularly if it involves a high-value asset or sensitive data. The likelihood of malicious abuse is significant, especially in environments where remote file shares are used for sensitive operations. Additionally, the `findstr` command is lesser known, increasing the risk of being weaponized in stealthy data exfiltration campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where `findstr.exe` is used legitimately for benign administrative tasks, potentially creating false positives. Evasion techniques include altering the command line slightly to avoid detection or utilizing a different legitimate-seeming executable. Reliable detection requires proper logging of both process creation and file access events. Companion detections include monitoring for network connections made by the user or system after executing `findstr` to assess potential exfiltration activities.

