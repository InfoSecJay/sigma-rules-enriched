  ### Technical Context

  This rule detects the execution of the "systeminfo.exe" command, which allows users to retrieve detailed system information including OS version, installed hotfixes, system memory, and network adapter configuration. The likely attacker objective is to gather system information to aid in further reconnaissance, particularly in preparation for lateral movement or exploitation. This behavior is categorized under the MITRE ATT&CK tactic "Discovery" (ID: T1082).

  The primary telemetry source for this detection is process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, which provide details on executable launches. If this activity is malicious, it may signal an attacker probing the environment for vulnerabilities. It is important to understand that this detection alone does not confirm malicious intent, as the "systeminfo.exe" command can be used legitimately by system administrators or other authorized users for maintenance and support.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of "systeminfo.exe". Look for the CommandLine field to see if it includes any suspicious flags or parameters.

  - **Verify execution context:** Understand who executed the command by checking the "CreatorProcessId" and "User" fields in the process creation log. Legitimate activity may show execution by system administrators or automated monitoring tools, whereas unauthorized users may indicate a potential incident.

  - **Identify anomalies:** Correlate execution with recent user activity in logs (Event IDs 4624 for logon events). Determine if the user account typically executes "systeminfo.exe" or if it is an unexpected occurrence.

  - **Inspect for subsequent behavior:** Look for follow-up commands or related process creation (e.g., accessing sensitive files or processes) that may indicate further exploitation following the "systeminfo" command. Review logs for high-risk commands executed soon after (e.g., tools like PowerShell, WMI calls).

  - **Validate the execution environment:** Confirm if "systeminfo.exe" was executed on critical systems (e.g., Domain Controllers, application servers) by referencing asset inventory or role classification. Malicious execution in sensitive environments warrants elevated scrutiny.

  - **Cross-check with other telemetry:** Enhance investigative context by reviewing other security logs, such as DLP logs for data exfiltration attempts, to see if "systeminfo.exe" was part of a larger series of suspicious actions. Identify if similar behavior was flagged in other alerts to correlate potential attack patterns.

  ### Prioritization

  This alert should be considered low severity in a typical enterprise context. While "systeminfo.exe" can be abused for reconnaissance, its legitimate use is common. However, it should not be ignored, especially when occurring on critical infrastructure or associated with unusual user behavior.

  ### Blind Spots and Assumptions

  This detection may be evaded by an attacker utilizing alternative system information gathering methods, such as PowerShell commands (e.g., `Get-ComputerInfo`) or utilizing custom scripts. Reliable detection requires appropriate logging configurations in place (such as enabling Sysmon logging) and may be sensitive to legitimate, administrative system maintenance, such as automated health checks. A related detection might involve monitoring for unusual command line arguments in PowerShell or logging for network enumeration activities (e.g., NetShare enumeration - T1135).

