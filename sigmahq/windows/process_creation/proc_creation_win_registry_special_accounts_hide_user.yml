note: |
  ### Technical Context

  This rule detects the modification of the Windows registry at the path "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist" to hide user accounts from the logon screen. The likely objective of an attacker invoking this command is to obfuscate malicious access or operations by preventing the relevant user accounts from being visible, thereby aiding in persistence or evasion efforts. This activity falls under the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically the technique of Hide User Account (T1564.002).

  The primary telemetry source is process creation events from Windows, which can be captured with Security Event ID 4688 or Sysmon Event ID 1, specifically looking for commands executed with `reg.exe` to alter registry keys. If executed maliciously, this can lead to significant security impacts including unauthorized access and persistence within the environment. This detection does not confirm the intent behind the registry change and may reflect legitimate administrative actions if performed by trusted personnel.

  ### Investigation Steps

  - **Review process details for `reg.exe`:** Check for Security Event ID 4688 or Sysmon Event ID 1, filtering for the Image field to match `reg.exe`. Note the User field to determine if this command was executed by a known administrator or a potentially compromised account.

  - **Examine command line parameters:** Identify command lines containing `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList`, `add`, `/v`, and `/d 0`. Confirm that the values reflect modifications to hide accounts rather than legitimate changes made by system administrators.

  - **Investigate timestamp and frequency of changes:** Look for patterns in the timing of the registry change related to other security events, especially if they correlate with known adversarial activity. A single occurrence versus multiple instances within a short time frame can indicate malicious intent.

  - **Validate legitimate activity:** Compare the registry change with known administrative processes. Confirm whether recognized IT personnel performed these actions or if the behavior aligns with standard user management protocols used during maintenance windows.

  - **Cross-reference with EDR solutions:** Correlate the event with other telemetry sources for anomalous behavior, such as unusual logins or accesses to sensitive resources following the registry change, which may signal exploitation attempts.

  ### Prioritization

  This alert should be classified as medium severity. The affected system's criticality and the likelihood of malicious usage drive this prioritization. Hiding accounts is a tactic commonly employed by advanced adversaries, particularly those seeking to maintain a foothold on the network without detection.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions that can trigger the same alert, complicating the triage process. Ensure that the proper logging configurations are in place for complete coverage of process creation events. Additionally, ensure that monitoring includes configurations highly susceptible to being targeted for similar evasion tactics, such as local accounts and credential storage. A related detection to enhance coverage could involve monitoring for unusual user account creations and deletions, which may indicate ongoing threat activity.

