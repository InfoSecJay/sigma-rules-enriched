note: |
  ### Technical Context
  This detection rule identifies changes to the Windows Registry key designated for controlling user visibility on the logon screen, specifically changes to `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist`. When the value of a user account is set to "0," that account is hidden from the logon interface, which can be indicative of an attacker attempting to obscure their presence or to impede detection efforts in a compromised environment. The primary objective of such actions is often related to maintaining persistence, evading detection, or preparing for further malicious activities.

  This activity aligns with the MITRE ATT&CK framework under the tactic of **Defense Evasion** (TA0005). The specific techniques associated with this behavior include **T1564.002 - Hide Artifact**. By modifying registry keys in an attempt to conceal user accounts, attackers can evade security measures and monitoring practices typically employed by organizations to detect unauthorized access.

  The most relevant data sources for this detection include process creation events specifically targeting registry manipulation (like changes invoked through `reg.exe`), as well as logs that document registry access or modifications. Such telemetry is critical for identifying suspicious activity, particularly when combined with other network and endpoint signals.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the Windows Registry for any modifications made to the `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist` key, particularly focusing on entries set to "0".

  - **Analyze Command Execution Logs:** Scrutinize process creation logs for instances of `reg.exe` alongside the command line parameters including `add`, `/v`, and `/d 0`, to confirm that the detection aligns with the observed behavior.

  - **Correlate with User Activity:** Assess user account activity and logon events to determine if the account that was hidden has been involved in any suspicious operations or if it's linked to other known malicious behaviors.

  - **Investigate Related Alerts:** Look for any additional alerts that may indicate lateral movement or other malicious activities happening concurrently, as these may provide context to the reason behind hiding a user account.

  ### Prioritization
  Given the potential implications of hidden user accounts for unauthorized access and persistence, this alert should be treated with medium priority. The risks associated with eagle-eyed attackers seeking to undermine detection efforts make it crucial to investigate further, especially in enterprise environments where further lateral movement could endanger sensitive assets.

  ### Blind Spots and Assumptions
  This detection may not cover legitimate administrative activities where system administrators also modify the `Userlist` key for valid purposes, such as managing service accounts or user visibility. The detection logic assumes that all changes to this registry key are malicious, which may not be the case in a properly managed environment. A potential gap exists if process creation logging is not fully configured, as this could lead to incomplete visibility into the execution context of the `reg.exe` process. Ensuring that logging for registry modifications and process creation is enabled is essential for the alert to function correctly.

