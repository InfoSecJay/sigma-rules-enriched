note: |
  ### Technical Context

  This rule detects modifications to the registry key `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist`, specifically when a user account is set to "0" to hide it from the Windows logon screen. This behavior is commonly associated with an attacker seeking to conceal unauthorized access or presence of a compromised user account. The relevant MITRE ATT&CK technique for this activity is T1564.002: Hide Artifacts.

  The primary telemetry source for this rule is Windows process creation logs, specifically capturing data from Security Event ID 4688. If malicious, this behavior indicates an active attempt to obfuscate adversarial operations on the system. It’s important to note that this detection alone does not confirm malicious intent, as legitimate activities by system administrators could also trigger the alert.

  ### Investigation Steps

  - **Check for suspicious registry modification activities:** Review Security Event ID 4688 for any instances of `reg.exe` executing with arguments containing `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList`, ensuring you note the user context under which it executed.

  - **Identify the account being hidden:** Analyze the CommandLine parameter in the detected process creation event for the specific user account being set to hidden. Look for patterns of hiding more than one account or hiding administrative accounts.

  - **Validate legitimate administrative activities:** Cross-reference the timing and account used in the detected event against known scheduled maintenance or administrative workflows to determine if the modification was part of a legitimate system change.

  - **Correlate with other security events:** Check for any related alerts or security events, such as failed logon attempts (Security Event ID 4625) or unusual account behavior around the same time, which may suggest this was part of a larger attack.

  - **Examine for prior file exfiltration or creation attempts:** Look into other log sources such as file system access or other registry modifications to identify if this action was paired with data theft or other malicious activities, indicating an adversary's presence.

  ### Prioritization

  This alert holds medium severity as it may signal an attempt to hide malicious activities on critical systems. The likelihood of malicious use is moderate, particularly if linked with other suspicious behaviors such as unauthorized access attempts. Concealing accounts is a technique often leveraged by advanced threats and ransomware actors.

  ### Blind Spots and Assumptions

  Detection may be limited by variations in command-line execution or misuse of legitimate administrative privileges. Ensure that logging is enabled for process creation and that there are appropriate configurations for capturing detailed command-line arguments. Legitimate administrative tasks, such as user account management, may trigger false positives. A related detection to strengthen coverage could be monitoring for unusual command-line usage with other administrative tools like `net user` or `net localgroup`.

