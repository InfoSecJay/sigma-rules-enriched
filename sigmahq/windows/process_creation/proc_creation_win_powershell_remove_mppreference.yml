note: |
  ### Technical Context

  This Sigma rule detects attempts to alter or disable Windows Defender configurations using the `Remove-MpPreference` cmdlet. Such behavior typically reflects an attacker’s objective to weaken system defenses, making it easier to execute malicious activities such as malware deployment or unauthorized access. Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (TA0005) and Command-Line Interface (T1059.001).

  Primary telemetry sources involve Windows process creation logs, particularly Security Event ID 4688 or Sysmon Event ID 1. If malicious, this behavior could lead to malware persistence and data breaches. It's important to note that this detection does NOT confirm that an attack has taken place; benign scripts with legitimate administrative tasks can trigger the alert.

  ### Investigation Steps

  - **Review process execution: ** Analyze Security Event ID 4688 for the `Remove-MpPreference` command execution on hosts. Check the Process Command Line field for specific parameters indicating intent to disable Defender components.

  - **Identify malicious parameters: ** Look for command line arguments such as `-ControlledFolderAccessProtectedFolders`, `-AttackSurfaceReductionRules_Ids`, or `-AttackSurfaceReductionRules_Actions`. Executions of these options typically indicate attempts to neutralize defenses.

  - **Validate legitimate behavior: ** Consider typical administrative tasks performed by your IT team. If the cmdlet is executed without these parameters, it may be part of standard operations to manage Windows Defender.

  - **Correlate with threat intelligence: ** Research if the same command was reported recently in conjunction with known malware variants. Use logs from other security tools (e.g., EDR systems) to correlate similar behaviors reported in the wild.

  - **Assess affected systems: ** Analyze host role and criticality for the affected endpoint. If it is a domain controller or high-value system, prioritize the investigation accordingly.

  - **Check for file activity: ** Review Windows Event IDs related to file creations or modifications (e.g., 4663) after the execution of the command. Investigate any suspicious file behaviors tied to newly altered Windows Defender settings.

  ### Prioritization

  This alert should be considered high severity due to its potential to compromise endpoint security. The fact that a critical component of the Windows security architecture is being tampered with increases its risk profile in environments with valuable assets. This behavior is also commonly weaponized, making it essential to respond promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by different administrative policies that permit legitimate use of `Remove-MpPreference`, resulting in false positives. Ensure that Windows Defender logs are fully enabled to capture necessary events. Additionally, legitimate PowerShell usage by administrators may trigger this alert. A related detection to consider is monitoring for changes in Defender settings through other PowerShell cmdlets like `Set-MpPreference`, which can enhance overall visibility into potential tampering incidents.

