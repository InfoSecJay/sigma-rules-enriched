note: |
  ### Technical Context

  This Sigma rule detects the execution of the `Remove-MpPreference` PowerShell cmdlet, which is typically used to modify or disable Windows Defender security configurations, such as Controlled Folder Access and Attack Surface Reduction settings. The likely attacker objective is to weaken endpoint defenses, thereby facilitating unauthorized activities like malware execution or data exfiltration. This behavior is associated with the MITRE ATT&CK tactic of Defense Evasion (T1562.001).

  Primary telemetry sources include Windows Security Event logs (Event ID 4688 for process creation) and PowerShell logs (Event ID 4104 for script block logging). If this behavior is malicious, it could lead to significant security impacts, allowing attackers to bypass proactive endpoint protections. However, this detection does NOT confirm successful exploitation or malicious intent without additional contextual evidence.

  ### Investigation Steps

  - **Review process creation logs:** Check for PowerShell execution related to `Remove-MpPreference` using Security Event ID 4688. Look for unusually timed executions or from untrusted accounts as malicious indicators.

  - **Validate command arguments:** Analyze the CommandLine field for specific parameters like `-ControlledFolderAccessProtectedFolders` or `-AttackSurfaceReductionRules_Ids`. Instances where these options are used in the context of known hostile actors or unusual patterns may indicate malicious actions.

  - **Correlate with PowerShell logs:** Look at PowerShell logs (Event ID 4104) for the execution of the cmdlet to identify potential script-based attacks. Scripts that contain various hostile parameters should be considered suspicious.

  - **Identify benign activities:** Confirm if the `Remove-MpPreference` command was executed as part of legitimate administrative tasks or maintenance scripts performed by trusted personnel. Track expected scripts that document approved changes in security settings.

  - **Check for elevated privileges:** Validate if the actions were performed by accounts with administrative privileges. Repeated access attempts from standard user accounts could indicate an adversary attempting to escalate privileges improperly.

  - **Examine associated network activity:** Look for subsequent network connections or communication with known malicious IP addresses or URLs that may signify malware distribution or data exfiltration attempts following the command execution.

  ### Prioritization

  This alert should be considered high severity due to the impact on critical systems running Windows Defender, which is essential for endpoint protection. The likelihood of malicious abuse is significant since the behavior aligns with common tactics used by adversaries to disable security measures, making it a frequently weaponized action.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques such as obfuscation of PowerShell commands or the execution of benign scripts that utilize `Remove-MpPreference` appropriately. Reliance on comprehensive logging settings, including PowerShell script block logging and setting proper monitoring of security event logs, is crucial for reliable detection. Legitimate administrative activities may trigger alerts when poorly documented changes are made. Additionally, monitoring for related actions like the execution of `Set-MpPreference` (similar detection) can provide stronger coverage against potential abuse.

