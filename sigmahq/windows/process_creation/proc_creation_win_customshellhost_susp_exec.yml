title: Suspicious CustomShellHost Execution
id: 84b14121-9d14-416e-800b-f3b829c5a14d
status: test
description: |
  Detects the execution of CustomShellHost.exe where the child isn't located in 'C:\Windows\explorer.exe'. CustomShellHost is a known LOLBin that can be abused by attackers for defense evasion techniques.
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/180
- https://lolbas-project.github.io/lolbas/Binaries/CustomShellHost/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2025-10-29
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\CustomShellHost.exe'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives are unlikely, investigate matches carefully.
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of `CustomShellHost.exe`, a known Living-Off-the-Land Binary (LOLBin) that can be exploited by attackers to avoid detection during their operations. The rule specifically triggers when the parent process is `CustomShellHost.exe`, and the child process does not originate from the standard Windows explorer executable located at `C:\Windows\explorer.exe`. Attackers often use LOLBins for evading security solutions and executing malicious commands without raising alarms, with the intent to carry out actions such as privilege escalation, lateral movement, or data exfiltration.

  Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1216), where attackers manipulate legitimate processes to perform malicious activities stealthily. The detection is crucial as it highlights a potentially harmful deviation from expected process execution patterns, enabling analysts to investigate further for signs of malicious behavior.

  Data sources yielding valuable evidence include Windows process creation event logs, which capture information such as process IDs, command-line arguments, and parent-child relationships between processes, providing insights into abnormal execution patterns that may point to hostile actions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the specifics of the process creation event for `CustomShellHost.exe`, focusing on the command-line parameters used and any accompanying arguments that might indicate misuse.
  - **Analyze Parent-Child Relationship:** Confirm the parent-child relationships in process execution logs. Determine if any child processes were spawned by `CustomShellHost.exe` that do not link back to `C:\Windows\explorer.exe`.
  - **Check User Activity Logs:** Determine the context of the user account that initiated the `CustomShellHost.exe` process. Evaluate permissions and previous activities that might indicate whether the user’s actions are legitimate or suspicious.
  - **Correlate with Network Activity:** Review any corresponding network activity logs from endpoints where `CustomShellHost.exe` was executed. Look for unusual outbound connections that may indicate command and control (C2) traffic or data exfiltration efforts.

  ### Prioritization
  The high severity of this alert is justified as the execution of `CustomShellHost.exe` can represent an advanced tactic employed by attackers to bypass traditional security mechanisms. Given the potential impacts on the enterprise, including unauthorized access and data compromise, timely investigation is critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate uses of `CustomShellHost.exe`, as it may be invoked in normal operational workflows by trusted applications or users. The detection logic assumes that notable deviations from typical execution—specifically deviations from the standard parent process—will only occur in malicious instances. For optimal operation of this rule, it is essential to have continuous logging enabled for processes and to configure the environment such that all instances of `CustomShellHost.exe` are recorded accurately, along with extensive parent-child process relationships.

