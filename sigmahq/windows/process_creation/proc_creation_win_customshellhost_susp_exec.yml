note: |
  ### Technical Context

  This Sigma rule detects the execution of `CustomShellHost.exe` when its parent process is not `C:\Windows\explorer.exe`, indicating potential misuse of this utility as a living-off-the-land binary (LOLBin). Adversaries may leverage `CustomShellHost.exe` for command execution, often as part of lateral movement or to evade detection mechanisms while installing or executing malicious payloads.

  This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (ID: T1216), specifically leveraging LOLBins for stealthy operations. The primary telemetry sources for this detection come from process creation events, specifically focusing on Windows Event ID **4688** and Sysmon Event ID **1**, which capture the details surrounding process execution. If this activity is malicious, it may facilitate further system compromise and persistence.

  It is essential to note that this detection does NOT confirm that the activity is malicious by itself, as benign applications may use `CustomShellHost.exe` as well.

  ### Investigation Steps

  - **Check the Parent Process: ** Confirm the parent process of `CustomShellHost.exe`:  Evaluate Event ID **4688** for details about the process hierarchy. If the parent is not `explorer.exe`, proceed with deeper investigation as it may indicate suspicious behavior.

  - **Review Command Line Arguments: ** Analyze the command line arguments used with `CustomShellHost.exe`: Extract from Sysmon Event ID **1** or Windows Event ID **4688**. Look for unusual flags or parameters that suggest malicious intent, such as references to known malware or avoidance of standard operational commands.

  - **Cross-reference Execution Timing: ** Identify the timing of the execution against suspicious activity: Use Event ID **4616** to correlate system uptime with the execution time of `CustomShellHost.exe` for any anomalies, indicating possible compromise.

  - **Validate against Known Good Behavior: ** Understand legitimate usage scenarios: Confirm if `CustomShellHost.exe` executed under expected circumstances for applications that utilize this binary legitimately; if found, it might suggest benign behavior.

  - **Investigate the Execution Path: ** Examine the file path of `CustomShellHost.exe`: Ensure that it is not running from unexpected directories. The legitimate executable should reside in system directories; anything running from user directories or non-standard folders warrants a deeper look.

  - **Identify Artifacts from Possible Exfiltration: ** Check for network activity associated with `CustomShellHost.exe`: Review network logs for any unusual DNS queries or HTTP requests made by the process that might indicate data exfiltration or callback attempts.

  ### Prioritization

  This alert is of **high severity** due to the potential impact of an attack leveraging `CustomShellHost.exe` for stealthy lateral movement or malware installation. The likelihood of such behavior being malicious is significant, as LOLBins are often weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited if `CustomShellHost.exe` is operating in scenarios where it utilizes common and legitimate parent processes. The reliability of this rule is contingent upon logging configurations that include both process creation events and command line data. Additionally, some user behavior, such as custom scripts invoking `CustomShellHost.exe`, may trigger false positives. A relevant companion detection could involve monitoring outbound network connections established shortly after the execution of processes associated with LOLBins for enhanced detection capabilities.

