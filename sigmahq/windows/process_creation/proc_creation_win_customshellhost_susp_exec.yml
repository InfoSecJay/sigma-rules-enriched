detection:
  selection:
    ParentImage|endswith: '\CustomShellHost.exe'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives are unlikely, investigate matches carefully.
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of `CustomShellHost.exe` as a parent process where its child process is not `C:\Windows\explorer.exe`. The behavior often indicates that an attacker may be using a Living off the Land Binary (LOLBin) to bypass security measures and execute malicious commands. The likely attacker objective is to gain unauthorized access or perform actions that maintain persistence while evading detection.

  The relevant MITRE ATT&CK tactic is Defense Evasion (T1203) and the technique is Abuse Elevation Control Mechanism (T1216). The primary telemetry sources include Windows process creation logs (such as Security Event ID 4688 and Sysmon Event ID 1). If malicious, this activity can lead to system compromise, data exfiltration, and further lateral movement. Importantly, this detection does NOT confirm malicious activity by itself, as it requires contextual investigation.

  ---

  ### Investigation Steps

  - **Review process creation events**: Examine Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of `CustomShellHost.exe`. Look for the `Image` field that indicates the child process and verify if it matches `C:\Windows\explorer.exe`.

  - **Analyze parent process details**: Check the `CommandLine` field of `CustomShellHost.exe` instances. Legitimate use cases typically include benign arguments related to shell commands, while malicious cases might contain unusual or obfuscated commands.

  - **Check process parent-child relationships**: Investigate the process tree around `CustomShellHost.exe` by examining the `ParentProcessId` (PPID) in relevant logs. Malicious instances will likely show unusual parent processes that do not relate to legitimate user activity or system processes.

  - **Correlate with user activity**: Validate recent user activity to ensure accessibility aligns with the process creation timeline. Expected behavior may include legitimate shell interactions or scripting for system maintenance.

  - **Look for known indicators of compromise (IoCs)**: Search for indicators linked to known malicious campaigns utilizing `CustomShellHost.exe`. This can include checking against threat intelligence feeds for related hashes or malicious CommandLine arguments.

  ---

  ### Prioritization

  The alert is rated high priority due to the potential impact on critical systems if the execution of `CustomShellHost.exe` is indeed malicious. The likelihood of abuse is significant, as many attackers exploit LOLBins like this for evasion techniques. Additionally, using `CustomShellHost.exe` in such contexts is not common for legitimate operations, raising the red flag to investigate further.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers alter the image path or use carefully crafted arguments to bypass detection. Reliable alerts require that process creation logs from Windows are properly configured and enabled. Legitimate activities that may trigger this alert include authorized administrative scripts involving `CustomShellHost.exe`, such as standard deployment or maintenance operations. A related detection to consider is the use of other LOLBins, providing coverage for additional defense evasion tactics, such as subprocess creation using `PowerShell.exe` or `cmd.exe`.

