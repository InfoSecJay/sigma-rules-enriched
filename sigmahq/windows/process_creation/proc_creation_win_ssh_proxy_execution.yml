level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of `ssh.exe` as a proxy or command execution medium, potentially for lateral movement or command-and-control (C2) operations. Attackers may leverage SSH, through the "ProxyCommand" or "LocalCommand" configuration options, to obfuscate the execution of their payloads, allowing for malicious programs to be launched under the guise of legitimate SSH activity. Relevant MITRE ATT&CK tactics include Execution (T1203) and Defense Evasion (T1218).

  The primary telemetry source is Windows process creation logs, specifically monitoring the execution of `ssh.exe` initiated by `sshd.exe`. A malicious execution could facilitate the running of unauthorized commands on remote systems or serve as part of a broader intrusion strategy. Importantly, this detection does NOT confirm an actual compromise on its own; it merely indicates suspicious usage of SSH.

  ---

  ### Investigation Steps

  - **Examine parent process IDs**: Review Windows Security Event ID 4688 logs to confirm if `ssh.exe` was launched from `C:\Windows\System32\OpenSSH\sshd.exe`. Assess whether this parent-child relationship indicates an unusual execution context.

  - **Analyze command-line arguments**: Inspect the CommandLine field for `ssh.exe` executions, looking for the presence of 'ProxyCommand=' or 'PermitLocalCommand=yes'. These flags are potential indicators of malicious intent and should be followed by scrutiny of the commands that follow.

  - **Identify known malicious hashes**: Cross-reference the IMHashes of the executed `ssh.exe` against known threat intelligence. Utilize Sysmon Event ID 10 to extract and verify file hashes, marking those with matched or suspicious hashes as high-confidence malicious indicators.

  - **Review legitimate administrative usage**: In some cases, `ssh.exe` may be legitimately used by system administrators for remote management. Confirm with your asset inventory that this activity aligns with expected administrative workflows in your environment.

  - **Check for unusual network traffic**: Utilize network telemetry to identify any outbound connections made immediately following the execution of `ssh.exe`. Pay attention to connections to suspicious IP addresses or payloads indicative of external C2 communication.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact on enterprise systems, particularly if `ssh.exe` is being used for unauthorized access or lateral movement. Such behavior, while not uncommon, can represent a clear violation of security protocols, necessitating immediate investigation and response.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate usage of SSH for management tasks, which could generate false positives. Ensure logging for Windows process execution is enabled to facilitate accurate detection. Be aware that advanced adversaries may employ encryption or modify the command structure to evade this detection. A related detection to consider is monitoring unusual `C2` communication patterns, which can help confirm malicious activity following `ssh.exe` usage.

