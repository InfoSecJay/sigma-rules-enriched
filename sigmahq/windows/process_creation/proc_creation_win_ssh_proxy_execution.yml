title: Program Executed Using Proxy/Local Command Via SSH.EXE
id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
status: test
description: Detect usage of the "ssh.exe" binary as a proxy to launch other 
  programs.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Ssh/
- https://github.com/LOLBAS-Project/LOLBAS/pull/211/files
- https://gtfobins.github.io/gtfobins/ssh/
- https://man.openbsd.org/ssh_config#ProxyCommand
- https://man.openbsd.org/ssh_config#LocalCommand
author: frack113, Nasreddine Bencherchali
date: 2022-12-29
modified: 2025-10-16
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
        # ParentCommandLine: '"C:\Windows\System32\OpenSSH\sshd.exe" -R'
    ParentImage: 'C:\Windows\System32\OpenSSH\sshd.exe'
  selection_cli_img:
  - Image|endswith: '\ssh.exe'
  - Product: 'OpenSSH for Windows'
  - Hashes|contains:
    - 'IMPHASH=55b4964d29aad5438b9e950052dbbbc0'
    - 'IMPHASH=334d66c33503ccbf647c15b47c27eef4'
    - 'IMPHASH=27b0da080ef92afb37983d30d839141e'
    - 'IMPHASH=977eb4c263d384e47daa0712d34713ab'
    - 'IMPHASH=3eaadce9ae43d5a918bb082065815c3b'
    - 'IMPHASH=980fe6cf0d996ab1eedf877222e722aa'
    - 'IMPHASH=5f959422308ac3d721010d66647e100e'
    - 'IMPHASH=a49aaa3d03d1cd9c8dc7fca60f7f480b'
    - 'IMPHASH=dd335f759b6d5d6a8382b71dd9d65791'
  selection_cli_flags:
  - CommandLine|contains: 'ProxyCommand='
  - CommandLine|contains|all:
    - 'PermitLocalCommand=yes'
    - ' LocalCommand'
  condition: selection_parent or all of selection_cli_*
falsepositives:
- Legitimate usage for administration purposes
level: medium
note: |
  ### Technical Context

  This rule detects the use of "ssh.exe" to execute commands using a proxy or to run local commands via the SSH client. The likely attacker objective is to bypass standard security controls and execute payloads or commands remotely, potentially to establish persistence or maintain access. This behavior maps to the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1 for capturing the execution of processes. If deemed malicious, the impact could vary from unauthorized data access to lateral movement within the network. This detection does NOT confirm actual malicious activity on its own; legitimate administration could invoke similar behaviors.

  ### Investigation Steps

  - **Review the parent process:** Check for Security Event ID 4688 or Sysmon Event ID 1 where `ParentImage` is `C:\Windows\System32\OpenSSH\sshd.exe`. If present, it indicates `ssh.exe` was used in conjunction with SSH daemon for executing potential commands.

  - **Analyze command-line arguments:** Inspect `CommandLine` in the process creation logs for the presence of `ProxyCommand=` or flags `PermitLocalCommand=yes` and `LocalCommand`. Legitimate entries should relate to authorized server management rather than unauthorized activity.

  - **Verify the hashes of executed processes:** Confirm the `IMPHASH` values for `ssh.exe`. Use known hashes from the detection rule to identify tampered or altered binaries—seek discrepancies that may result from malicious activity.

  - **Cross-reference recent admin activities:** Identify legitimate administrative use by correlating with historical logs showing expected usage patterns of `ssh.exe` for necessary remote administration without proxy use.

  - **Monitor for lateral movement attempts:** Check for any other processes executed immediately following `ssh.exe`, as lateral movement attempts often lead to additional command execution. Look for signs of unauthorized data access post-command execution.

  - **Assess system criticality:** Understand the server's role within the enterprise. If it’s critical infrastructure (e.g., domain controller or database server), escalate findings accordingly due to increased impact potential.

  ### Prioritization

  The alert's severity is medium due to the potential for lateral movement and unauthorized command execution. While this behavior can be used legitimately in administrative tasks, its occurrence in critical infrastructure systems enhances the importance of review. The likelihood of this method being weaponized by adversaries makes it concerning for enterprise environments.

  ### Blind Spots and Assumptions

  Detection may miss cases where logs are not configured to capture SSH command execution details prominently or are disabled. Legitimate administrative use of `ssh.exe` with proxy commands for cloud or remote server management may trigger this alert frequently. A related detection to consider is monitoring for significant and unauthorized outbound connections made from the server, which can further indicate potential misuse of `ssh.exe`.

