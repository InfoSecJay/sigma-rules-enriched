  condition: selection_parent or all of selection_cli_*
falsepositives:
- Legitimate usage for administration purposes
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the `ssh.exe` binary is used to proxy or launch other programs via local commands in Windows environments. This behavior is indicative of potential misuse, where an attacker repurposes legitimate tools to create a backdoor or to conceal their actions. The use of `ssh` as a proxy can allow an attacker to tunnel traffic or remotely execute commands while avoiding traditional detection mechanisms.

  Attackers leveraging this method may aim for persistence, lateral movement, or data exfiltration within the network. They may use the SSH protocol, which is typically associated with secure, legitimate administrative tasks, to mask their illicit activities. Relevant MITRE ATT&CK techniques associated with this detection include **T1218: Signed Binary Proxy Execution** and potentially others involving remote command execution and lateral movement.

  The primary data sources for detecting this behavior will be Windows process creation logs, which provide details on executed binaries and their command-line arguments. Additionally, logs from SSH-related activities—if available—may provide supplementary evidence of misuse.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate process creation events related to `ssh.exe`, focusing on unusual command-line arguments that include `ProxyCommand` or `PermitLocalCommand=yes`.

  - **Analyze Parent Process Context:** Identify the parent process that initiated `ssh.exe` to uncover potential malicious chains of execution, particularly those involving `sshd.exe` or other unusual executables.

  - **Correlate with Connection Logs:** If available, check network connection logs to determine if there were any suspicious outbound connections made through `ssh.exe` following its execution.

  - **Examine User Activity Context:** Look into the user account associated with the `ssh.exe` invocation. Unusual accounts or ones with minimal expected administrative tasks should be flagged for further review.

  ### Prioritization
  This alert is deemed medium severity due to the potential for legitimate users to run SSH commands for administrative purposes. However, the misuse of `ssh.exe` for proxying other commands could indicate malicious intent and requires prompt investigation to mitigate the risk of lateral movement or data breaches.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage, particularly if processes do not log their execution details or if the `ssh.exe` usage is masked under legitimate administrative tasks. The logic assumes that all instances of `ssh.exe` usage are benign unless specific flags are identified in the command line. Required logs include detailed process creation logs, which must be enabled in Windows logging configurations, as well as any associated SSH activity logs if applicable.

