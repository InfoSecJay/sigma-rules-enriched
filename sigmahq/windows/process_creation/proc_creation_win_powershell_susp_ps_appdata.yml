title: PowerShell Script Run in AppData
id: ac175779-025a-4f12-98b0-acdaeb77ea85
status: test
description: Detects a suspicious command line execution that invokes PowerShell
  with reference to an AppData folder
references:
- https://twitter.com/JohnLaTwC/status/1082851155481288706
- https://app.any.run/tasks/f87f1c4e-47e2-4c46-9cf4-31454c06ce03
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
date: 2019-01-09
modified: 2022-07-14
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains:
    - 'powershell.exe'
    - '\powershell'
    - '\pwsh'
    - 'pwsh.exe'
  selection2:
    CommandLine|contains|all:
    - '/c '
    - '\AppData\'
    CommandLine|contains:
    - 'Local\'
    - 'Roaming\'
  condition: all of selection*
falsepositives:
- Administrative scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell from a user’s AppData directory, which is often indicative of attempts to run malicious scripts or payloads that have been concealed within user-specific folders. The primary objective for an attacker using this method is to maintain persistence or run auxiliary commands without raising immediate suspicion. Relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001) as it relates to the execution of scripts via PowerShell.

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log command line arguments and process creation events. If this behavior is malicious, it could enable attackers to execute unauthorized commands or exfiltrate data via scripts. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate administrative tasks may also occur from AppData.

  ### Investigation Steps

  - **Review command line arguments**: Check processes matching the detection criteria (Event ID 4688, Sysmon Event ID 1). Look for unusual PowerShell commands and presence of encoded commands, e.g., `-EncodedCommand` or `-ExecutionPolicy Bypass`.

  - **Examine user account activity**: Correlate the process creation with the user account executing it. Review if the account has a history of administrative use or a known pattern of legitimate PowerShell scripts executed from AppData.

  - **Identify benign PowerShell use**: Use a baseline of normal user activity to differentiate. Consider reviewing the presence of legitimate scripts in the AppData locations commonly used by administrators (e.g., `C:\Users\<User>\AppData\Local\Scripts`).

  - **Check for unusual child processes**: Review the parent-child process hierarchy where PowerShell is launched, specifically any unexpected parent processes (Event ID 4688 and Sysmon Event ID 1). Look for command prompts or suspicious executables launching PowerShell.

  - **Investigate file system changes**: Look for evidence of new files created or modified within the AppData folder (File Event IDs 4656 for handle access, 4663 for object access), focusing on timestamps correlating with the execution of the suspicious PowerShell command.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on the affected system, which could be critical if the accounts are privileged or manage sensitive data. The likelihood of malicious activity is moderate, given that attackers commonly exploit PowerShell in this way, especially for post-exploitation scenarios.

  ### Blind Spots and Assumptions

  This detection may have false negatives when attackers use obfuscation techniques or alternate execution mechanisms. It assumes adequate logging is enabled, particularly Sysmon for complete process details and security logs for tracking PowerShell executions. Legitimate administrative scripts stored in AppData may also trigger this alert, necessitating careful identification of context around the execution. Companion detections worth monitoring include unusual outbound network connections from systems experiencing this behavior, as they often indicate data exfiltration.

