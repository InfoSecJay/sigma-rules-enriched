title: PowerShell Script Run in AppData
id: ac175779-025a-4f12-98b0-acdaeb77ea85
status: test
description: Detects a suspicious command line execution that invokes PowerShell with
  reference to an AppData folder
references:
- https://twitter.com/JohnLaTwC/status/1082851155481288706
- https://app.any.run/tasks/f87f1c4e-47e2-4c46-9cf4-31454c06ce03
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
date: 2019-01-09
modified: 2022-07-14
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains:
    - 'powershell.exe'
    - '\powershell'
    - '\pwsh'
    - 'pwsh.exe'
  selection2:
    CommandLine|contains|all:
    - '/c '
    - '\AppData\'
    CommandLine|contains:
    - 'Local\'
    - 'Roaming\'
  condition: all of selection*
falsepositives:
- Administrative scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where PowerShell scripts are executed from the AppData folder, which can be a common tactic employed by malicious actors to execute payloads and maintain persistence on compromised systems. The AppData directory is often used by attackers to evade detection as it is less scrutinized than other directory locations. Attackers may use these scripts to run commands that can exfiltrate data, download further payloads, or perform other malicious activities while avoiding scrutiny by security analysts.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), indicating the adversary is executing code. The specific technique involved is **Malicious PowerShell Scripts** (T1059.001), reflecting how adversaries leverage legitimate tools such as PowerShell for malicious intent. The primary data sources for detection include process creation logs, which capture command lines executed on Windows systems and can provide insights into potentially unauthorized activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of PowerShell commands executed from the AppData directory, focusing on command lines that reference 'powershell.exe', '\powershell', or related executables.

  - **Analyze Command-Line Parameters:** Pay close attention to the parameters passed alongside the PowerShell command, particularly those using the '/c' switch and relevant paths like 'Local' and 'Roaming' under AppData to understand the context of the execution.

  - **Correlate with User Context:** Investigate the user account associated with the PowerShell execution to determine if there are patterns typical of legitimate administrative tasks or if it indicates possible compromise.

  - **Monitor for Related Activities:** Look for additional indicators of malicious behavior, such as unusual network connections, file modifications in the AppData folder, or further script executions that might be indicative of a more extensive compromise.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential for significant impact. While not all PowerShell executions from AppData are malicious, the context and behavior they exhibit can lead to serious security implications. The likelihood of occurrence is moderately high, as attackers frequently leverage PowerShell for various malicious activities.

  ### Blind Spots and Assumptions
  One significant gap in this detection coverage is its reliance on standard command line patterns; sophisticated attackers may obfuscate their command lines or use other techniques to bypass this detection. Additionally, the detection logic assumes that all usage of PowerShell from the AppData folder is suspicious, which may not account for legitimate administrative scripts. It requires comprehensive process creation logs with command line details enabled for effective detection. Without these logs, the rule may yield false negatives.

