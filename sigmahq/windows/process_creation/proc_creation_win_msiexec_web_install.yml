  ---

  ### Technical Context

  This Sigma rule detects instances where the `msiexec.exe` process is initiated with a command line argument that includes a web address. This behavior is indicative of potential abuse of the Windows Installer service to download and execute malicious payloads from the internet, which aligns with attacker objectives related to command-and-control (C2) and software distribution. The relevant MITRE ATT&CK tactics and techniques are **Defense Evasion (T1218.007)** and **Command and Control (T1105)**.

  The primary telemetry source is process creation events owing to Windows Event ID 4688, which logs the creation of a new process, along with specific command line arguments. The security impact in the event of malicious use could include unauthorized software installations, data exfiltration, or system compromise. However, the alert does not confirm that malicious activity has occurred; legitimate administrative actions may trigger the same behavior depending on the environment.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Check Windows Security Event ID 4688. Look for processes initiated using `msiexec.exe` containing '://'. Malicious indicators may include unexpected domains or IP addresses, while legitimate usage may show internal URLs or administrative scripts.

  - **Validate host role:** Identify whether the host running `msiexec.exe` is a standard user system or a server. Legitimate usage on user systems should be infrequent. Frequent entries on servers may warrant closer scrutiny.

  - **Cross-reference with network traffic logs:** Analyze proxies or firewall logs for outbound connections matching the command line URL. Look for suspicious outbound communication patterns that correlate with the process creation.

  - **Check for associated processes:** Investigate for sibling processes spawned from `msiexec.exe`, specifically searching for unknown executables in proximity (Event ID 4688) that may suggest lateral movement or malicious payload execution.

  - **Review documentation of authorized usage:** Validate if there is documentation supporting the legitimate use of installers in your environment. If an internal tool is referenced in the command line, it should be evaluated against documented processes.

  - **Monitor for abnormal behavior post-execution:** After identifying the instance, look for abnormal behaviors such as unusual network connections or new file creations, using Sysmon Event ID 11 for file creations or Event ID 3 for network connections initiated by new processes.

  ---

  ### Prioritization

  The alert severity should be considered medium due to the potential risk associated with unauthorized software execution. While instances of `msiexec.exe` being invoked with web addresses are not extremely common, when they occur, they often indicate an increased likelihood of exploitation. Such behavior can lead to significant compromise if weaponized.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of bypass techniques, such as adversaries using obfuscated URLs or known legitimate paths, which might mask malicious intent. Reliable detection requires continuous logging of process creation events and command line parameters. Legitimate administrative tools such as software updates or script-based installations can trigger similar alerts. A related detection to consider is monitoring for unusual outbound DNS queries, which could indicate further C2 attempts.

