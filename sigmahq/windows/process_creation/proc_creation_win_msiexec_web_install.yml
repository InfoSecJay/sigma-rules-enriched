  ### Technical Context

  This rule detects suspicious executions of the `msiexec` process, specifically when invoked with web addresses as parameters. This behavior suggests an attempt to download and execute a malicious installer from the internet, potentially aiming to install malware or exfiltrate data. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011) with the technique "System Shell: msiexec" (T1218.007).

  Primary telemetry comes from Windows process creation logs, specifically Event ID 4688, which captures command-line arguments for process instantiation. If this activity is determined to be malicious, it poses a significant risk as it could facilitate unauthorized software installation or code execution on endpoints. Notably, this detection does NOT confirm that the installer is malicious by itself; further investigation is necessary.

  ### Investigation Steps

  - **Verify command-line arguments:** Check Windows Security Event ID 4688 for `msiexec` command-line parameters. Look for indications of download paths for installers, especially URLs containing `http://` or `https://`. Mark instances using trusted software installers as benign.

  - **Cross-reference installed applications:** Examine installed applications in the 'Add or Remove Programs' panel to identify recent installations related to the detected `msiexec` invocation. Compare installed versions to known benign application versions to rule out harmless installers.

  - **Investigate process parentage:** Analyze the parent process ID of the `msiexec` process in Event ID 4688 logs to identify how it was launched. Legitimate activity typically originates from known administrative tools or software installers without external web requests.

  - **Review endpoint security alerts:** Check the endpoint's security solution (e.g., endpoint detection and response) for alerts linked to the invocation. A high-confidence malicious indicator is a correlation of the `msiexec` process execution with outbound traffic to suspicious domains post-execution.

  - **Analyze network traffic:** Investigate traffic logs (e.g., firewall or proxy logs) for connections initiated by the endpoint following the `msiexec` execution. Look for leads to known malicious domains or IPs associated with malware distribution.

  ### Prioritization

  This alert is of medium severity due to the potential impact on the affected system, as the execution of web-based installers can lead to malware installation. While this behavior can be weaponized, certain contexts like administrative scripts may trigger the alert without malicious intent, thereby affecting the likelihood of abuse.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative activities utilizing `msiexec` for legitimate updates or installations, leading to false positives. It requires reliable logging of process creation events and access to the command-line details. Evasion techniques can include obfuscation of command line parameters or using legitimate tools for malware delivery. Companion detections could include monitoring for anomalous outbound connections post-execution to strengthen overall threat coverage.

