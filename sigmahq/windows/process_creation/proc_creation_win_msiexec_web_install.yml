note: |
  ### Technical Context

  This rule detects suspicious executions of the msiexec process that incorporate web addresses in their command-line parameters. Attackers often leverage msiexec for malicious installs, either downloading malware directly or using it to execute malware hosted on a web server, thereby obscuring their activities under the legitimate appearance of software installation.

  The relevant MITRE ATT&CK tactics and techniques for this activity include “Command and Control” (TA0011) and “Exploitation for Client Execution” (T1218.007). Primary telemetry sources include Windows Security Event ID 4688 (process creation) and Sysmon Event ID 1. If malicious, successful exploitation via this method can lead to compromise of host systems and potential lateral movement. It's important to note that this detection does NOT confirm that any execution is inherently malicious; legitimate administrative tasks might generate similar command-line usage.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for msiexec executions. Look for instances where the command line includes "://". Typical benign usage should not involve web addresses.

  - **Correlate with network logs:** Inspect network activity corresponding to this process execution to identify any outbound connections to unknown IP addresses or domains, especially those associated with known malware distributions.

  - **Assess asset criticality:** Evaluate the role of the affected host. Servers or endpoints with high privileges or exposure (e.g., domain controllers, financial systems) should be prioritized for further investigation compared to other hosts.

  - **Document the command-line context:** If multiple msiexec instances appear with varying web URLs, analyze each instance's full command-line arguments and check for patterns, such as multiple executions in short succession or unusual user accounts invoking the processes.

  - **Identify known bad URLs:** Cross-check any URLs found in the command line against threat intelligence feeds to quickly confirm if they are associated with known malicious sites.

  ### Prioritization

  This alert is of medium severity, as the execution of msiexec with web parameters can indicate potential compromise. However, the impact depends on the criticality of the affected system. While the likelihood of malicious activity is moderate, this behavior has been weaponized in various attack scenarios, warranting careful analysis.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured logging settings that do not capture all process creation events or command-line details. Legitimate administrative tools or scripts that use msiexec for updates may trigger this alert. A companion detection, such as monitoring for downloads initiated by powershell (T1086), can strengthen overall visibility into potential malicious activities within the same context.

