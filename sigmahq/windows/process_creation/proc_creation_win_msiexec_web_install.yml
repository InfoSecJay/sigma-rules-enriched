  ### Technical Context

  This Sigma rule detects the invocation of the `msiexec` process with Command Line parameters indicating web addresses (e.g., containing `://`). This behavior often signifies an attempt to execute a malicious installation package downloaded from the internet, potentially aligning with adversaries looking to deploy malware or perform post-exploitation activities.

  This activity is relevant to the MITRE ATT&CK framework under the tactic "Execution" (TA0002) and specifically the technique "Windows Installer Abuse" (T1218.007). Primary telemetry sources include Windows Security Event logs (Event ID 4688) for process creation, and Sysmon logs (Event ID 1) for detailed process execution information. The security impact is significant, as successful exploitation may lead to malware deployment and system compromise.

  It is important to note that this detection alone does not confirm malicious intent; legitimate administrative tasks or software deployments may also use `msiexec` with web parameters.

  ### Investigation Steps

  - **Review process creation events for msiexec:** Examine Security Event ID 4688 and Sysmon Event ID 1 for instances where the command line contains `msiexec` and `://`. Malicious indicators include unexpected parameters or connections to known bad URLs.

  - **Analyze the parent process:** Identify the parent process of the `msiexec` execution. If it is a known administrative tool or script corresponding to expected business operations, consider it legitimate; otherwise, raise suspicion on potential malicious activity.

  - **Check network connections:** Review firewall logs (Event ID 5156 or equivalent) to determine if the `msiexec` process is initiating outbound connections. Look for unusual or untrusted destination IP addresses that are inconsistent with regular traffic patterns.

  - **Inspect installed packages:** Analyze the presence of newly installed software related to the msiexec activity. Use PowerShell commands like `Get-WmiObject -Class Win32_Product` to identify unauthorized installations or changes indicative of a successful compromise.

  - **Validate user context executing the command:** Check the account under which the msiexec command was executed using Event ID 4688 or Sysmon. If the process was run under the system account without justification, it raises the potential for malicious intent.

  ### Prioritization

  The alert is of medium severity due to the potential impact on affected systems, where malicious installations could lead to further exploitation. The likelihood of malicious use is increased when msiexec executes with web parameters, as this behavior is commonly associated with malware distribution, making it a notable vector in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be hindered by the use of techniques like process name obfuscation or the use of legitimate administrative tools mimicking the behavior of msiexec. The collection of logs from critical endpoints is essential for reliable detection. Legitimate activities, such as deploying software updates or remote installations from trusted sources, may trigger this alert. A related detection to enhance coverage is monitoring for unusual PowerShell scripts that could initiate similar malicious installs.

