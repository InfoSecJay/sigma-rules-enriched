title: Suspicious ArcSOC.exe Child Process
id: 8e95e73e-ba02-4a87-b4d7-0929b8053038
status: experimental
description: |
  Detects script interpreters, command-line tools, and similar suspicious child processes of ArcSOC.exe.
  ArcSOC.exe is the process name which hosts ArcGIS Server REST services. If an attacker compromises an ArcGIS
  Server system and uploads a malicious Server Object Extension (SOE), they can send crafted requests to the corresponding
  service endpoint and remotely execute code from the ArcSOC.exe process.
references:
- https://reliaquest.com/blog/threat-spotlight-inside-flax-typhoons-arcgis-compromise/
- https://enterprise.arcgis.com/en/server/12.0/administer/windows/inside-an-arcgis-server-site.htm
author: Micah Babinski
date: 2025-11-25
tags:
- attack.execution
- attack.t1059
- attack.t1203
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\ArcSOC.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wmic.exe'
    - '\wscript.exe'
  filter_main_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine: 'cmd.exe /c "ver"'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious child processes spawned by `ArcSOC.exe`, particularly when these processes are typical command-line interpreters or scripting tools. This is significant because `ArcSOC.exe` serves as an execution host for ArcGIS Server REST services; thus, an attacker could exploit it to execute arbitrary code through uploaded malicious Server Object Extensions (SOEs). The rule seeks out processes that may indicate an attempt to leverage the ArcGIS environment for unauthorized purposes.

  The attacker’s main objective in this scenario would typically involve compromising an ArcGIS Server to exfiltrate data, manipulate server functionality, or gain a foothold in the network. By injecting malicious scripts or commands via a trusted application like `ArcSOC.exe`, the attacker can evade detection by blending in with normal server operations.

  This detection aligns with several MITRE ATT&CK tactics and techniques, particularly **Execution** (TA0002), focusing specifically on **Command-Line Interface** (T1059) and potentially **Exploitation of Remote Services** (T1203). The primary data source for this detection includes process creation logs from Windows systems, which capture details about process initiation, including parent-child relationships and command-line arguments used.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the Windows process creation logs for instances where `ArcSOC.exe` has spawned child processes. Pay special attention to the command-line arguments used and the exact times of these executions.

  - **Correlate with ArcGIS Activity**: Cross-reference the timeline of the suspicious child processes with any legitimate administrative actions or scheduled tasks related to `ArcGIS`. This can help determine if the activity may have been a legitimate request or an attack.

  - **Analyze Network Traffic**: Check network connection logs for any unusual outbound connections originating from the ArcGIS server, particularly if they coincide with the identified suspicious process execution, which could indicate data exfiltration or beaconing behavior.

  - **Inspect for SOE Modifications**: Examine the server for recent modifications to Server Object Extensions or any uploads made. Investigating the integrity of these files can clarify whether an attacker has successfully implanted a malicious payload within the application.

  ### Prioritization
  Alerts generated by this rule should be classified as high severity due to the potential impact of a compromise in an ArcGIS Server environment, where sensitive geospatial data could be at risk, and the likelihood of exploitation given known vulnerabilities in web-facing applications.

  ### Blind Spots and Assumptions
  This detection logic may miss non-standard script execution methods that don't utilize well-known interpreters or require unusual variations in command-line arguments. It assumes that `ArcSOC.exe` is being used legitimately and will also overlook processes spawned from other legitimate parent processes. Additionally, this detection relies on having comprehensive logging enabled for process creation events, which may not be configured uniformly across all environments or systems.

