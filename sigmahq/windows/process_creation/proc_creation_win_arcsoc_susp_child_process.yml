title: Suspicious ArcSOC.exe Child Process
id: 8e95e73e-ba02-4a87-b4d7-0929b8053038
status: experimental
description: |
  Detects script interpreters, command-line tools, and similar suspicious child processes of ArcSOC.exe.
  ArcSOC.exe is the process name which hosts ArcGIS Server REST services. If an attacker compromises an ArcGIS
  Server system and uploads a malicious Server Object Extension (SOE), they can send crafted requests to the corresponding
  service endpoint and remotely execute code from the ArcSOC.exe process.
references:
- https://reliaquest.com/blog/threat-spotlight-inside-flax-typhoons-arcgis-compromise/
- https://enterprise.arcgis.com/en/server/12.0/administer/windows/inside-an-arcgis-server-site.htm
author: Micah Babinski
date: 2025-11-25
tags:
- attack.execution
- attack.t1059
- attack.t1203
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\ArcSOC.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wmic.exe'
    - '\wscript.exe'
  filter_main_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine: 'cmd.exe /c "ver"'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious child processes spawned by `ArcSOC.exe`, a legitimate process associated with ArcGIS Server REST services. Attackers may exploit vulnerabilities within ArcGIS by uploading a malicious Server Object Extension (SOE), enabling them to execute arbitrary code through `ArcSOC.exe`. The primary MITRE ATT&CK tactics and techniques relevant here include **Execution (T1203)** for code execution and **Command and Scripting Interpreter (T1059)** due to the use of scripting tools for exploitation.

  The primary telemetry source is Windows Process Creation logs, specifically capturing process-related artifacts through Security Event ID **4688** or Sysmon Event ID **1**. If malicious, an attacker could leverage this to execute malicious commands, potentially leading to further compromise or data exfiltration. It is important to note that this alert does not independently confirm malicious intent; further investigation is needed to understand the context and legitimacy of the processes being initiated.

  ### Investigation Steps

  - **Check for unusual child processes: **Review child processes spawned by `ArcSOC.exe` (Event ID 4688). Focus on command-line snippets indicating usage of scripting interpreters like `cmd.exe`, `powershell.exe`, or `wscript.exe`. Legitimate use cases should involve typical service calls rather than unusual command executions or scripts.

  - **Analyze command-line arguments: **Inspect the CommandLine field for the parent process (`ArcSOC.exe`). Look for unusual or potentially harmful arguments (e.g., those invoking downloads or remote execution) that deviate from normal usage patterns observed in legitimate production environments.

  - **Identify high-confidence malicious indicators: **Look for specific command lines associated with known exploitation techniques, such as `powershell.exe` commands that download or execute payloads. Documentation on past attacks can provide insights into common patterns.

  - **Correlate with other logs: **Cross-reference findings with IIS or ArcGIS logs to trace back to the original request that might have triggered execution. A legitimate request to `ArcSOC.exe` should be a well-defined service action, whereas an anomaly may indicate an attack vector being used.

  - **Review asset criticality: **Determine the role and criticality of the host running `ArcSOC.exe`. If it is a critical system, escalate the findings immediately as it may indicate a significant compromise risk affecting core organizational services.

  ### Prioritization

  This alert should be considered high priority due to the critical nature of `ArcGIS Server` in enterprise environments and the likelihood of malicious exploitation. The potential for an attacker to gain control over system functions and escalate privileges emphasizes the urgency of investigating this alert, given that such behaviors are common in targeted attacks on web services.

  ### Blind Spots and Assumptions

  Detection may be limited by attackers using encodings or alternative scripting techniques to obfuscate their activity, which could bypass detection rules. Ensure that Windows Process Creation logging and Sysmon are properly configured to capture necessary events for comprehensive visibility. Legitimate activities, such as scheduled tasks or automated scripts utilizing `ArcSOC.exe`, may trigger the alerts, necessitating contextual understanding before labeling activities as malicious. A strong companion detection can include monitoring for unusual network traffic originating from the ArcGIS server to identify external command-and-control communications.

