title: Remote Access Tool - RURAT Execution From Unusual Location
id: e01fa958-6893-41d4-ae03-182477c5e77d
status: test
description: Detects execution of Remote Utilities RAT (RURAT) from an unusual location
  (outside of 'C:\Program Files')
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-19
modified: 2023-03-05
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\rutserv.exe'
    - '\rfusclient.exe'
  - Product: 'Remote Utilities'
  filter:
    Image|startswith:
    - 'C:\Program Files\Remote Utilities'
    - 'C:\Program Files (x86)\Remote Utilities'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the Remote Utilities Remote Access Tool (RURAT) from locations other than the typical installation directories. RURAT is often used by attackers for remote access and control over compromised systems. The primary concern is that unauthorized execution of this tool, particularly from unusual locations, indicates a potential compromise or malicious actor attempting to establish persistence on an enterprise network.

  The threat scenario includes attackers leveraging RURAT to facilitate remote manipulation of systems, often as a precursor to data theft, lateral movement, or further exploitation activities. The MITRE ATT&CK tactics relevant to this detection include **Defense Evasion (T1218)**, where attackers might camouflage their activities by executing tools from unexpected locations, and **Remote Access Software (T1219)**, which relates directly to tools like RURAT that provide remote control capabilities.

  The primary data sources for this detection rule come from Windows process creation logs that capture details about newly spawned processes, including the location from which they were executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation events involving `rutserv.exe` and `rfusclient.exe` from the Windows event logs to confirm unauthorized execution.
  - **Identify Execution Location**: Check the file paths of the executed processes to determine if they originated from locations other than `C:\Program Files\Remote Utilities` or `C:\Program Files (x86)\Remote Utilities`.
  - **Correlate with User Activity**: Investigate any associated user activity around the time of execution, identifying any unusual login patterns or access from atypical IP addresses.
  - **Examine Network Connections**: Analyze outbound connections initiated by the detected processes for unusual patterns or foreign IP addresses, which may indicate command and control communication.

  ### Prioritization
  This alert is rated as medium severity due to the potential for significant impact if RURAT is exploited by an attacker, combined with the likelihood of detection being needed, especially in environments where remote access tools are tightly controlled.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if RURAT is executed from whitelisted or less scrutinized directories, as well as if obfuscation techniques are employed by the attackers. The detection logic assumes that process creation events are being adequately logged and that no privilege escalation occurred during the attack. For this alert to function effectively, proper logging configurations must be in place for Windows process creation events, ensuring that all execution attempts are captured for analysis.

