title: Remote Access Tool - RURAT Execution From Unusual Location
id: e01fa958-6893-41d4-ae03-182477c5e77d
status: test
description: Detects execution of Remote Utilities RAT (RURAT) from an unusual 
  location (outside of 'C:\Program Files')
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-19
modified: 2023-03-05
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\rutserv.exe'
    - '\rfusclient.exe'
  - Product: 'Remote Utilities'
  filter:
    Image|startswith:
    - 'C:\Program Files\Remote Utilities'
    - 'C:\Program Files (x86)\Remote Utilities'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of Remote Utilities RAT (RURAT) from a location outside the expected installation directories, specifically from directories other than `C:\Program Files\Remote Utilities` or `C:\Program Files (x86)\Remote Utilities`. The likely attacker objective here is to use RURAT for unauthorized remote access to a compromised system, potentially to exfiltrate sensitive information or maintain persistence.

  This behavior falls under the MITRE ATT&CK tactic of "Defense Evasion" (T1567) and the technique of "External Remote Services" (T1133). The primary telemetry source for this detection is Windows process creation logs, specifically looking for security event logs like Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it poses a significant security risk as it indicates unauthorized access and potential data breaches. Notably, this detection does NOT confirm malicious intent on its own; legitimate applications may exhibit similar behaviors.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for the creation of processes named `rutserv.exe` or `rfusclient.exe` from unauthorized paths. Note any paths that don’t match legitimate installation directories.

  - **Identify the user context:** Examine the user account that executed the processes. Events tied to privileged or uncommon user accounts outside their normal working behavior could indicate malicious activity.

  - **Correlate with network activity:** Analyze network logs for connections initiated by these processes. Look for outbound connections to unusual IP addresses or locations, specifically focusing on TCP/UDP flows that are atypical for the host.

  - **Consider legitimate usage:** Evaluate whether the observed application is used within the context of the organization. If remote access tools are sanctioned, verify their deployment in appropriate environments.

  - **Check for persistence mechanisms:** Review automated tasks or scheduled jobs for entries that invoke `rutserv.exe` or `rfusclient.exe` from unauthorized paths. Legitimate installations should not create persistence with executable paths outside the designated installation locations.

  - **Assess host criticality:** Determine if the affected host is part of a critical operation or process. Compromised critical systems elevate the incident's severity and urgency for response.

  ---

  ### Prioritization

  The alert is of medium severity due to the potential impact on sensitive organizational systems. While RURAT can signify malicious activity, some legitimate use cases exist, making the likelihood of abuse context-dependent. Given its capability for remote access, this behavior is common among adversaries seeking to maintain control over compromised assets.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete process creation logging or if systems are misconfigured to allow execution from unusual directories. Legitimate software deployment or updates may trigger this alert, necessitating careful analysis of context. A companion detection, such as monitoring for abnormal outbound connections when these processes execute, could strengthen overall security posture.

