title: Remote Access Tool - RURAT Execution From Unusual Location
id: e01fa958-6893-41d4-ae03-182477c5e77d
status: test
description: Detects execution of Remote Utilities RAT (RURAT) from an unusual 
  location (outside of 'C:\Program Files')
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-19
modified: 2023-03-05
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\rutserv.exe'
    - '\rfusclient.exe'
  - Product: 'Remote Utilities'
  filter:
    Image|startswith:
    - 'C:\Program Files\Remote Utilities'
    - 'C:\Program Files (x86)\Remote Utilities'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the Remote Utilities Remote Access Tool (RURAT) from an unconventional location outside the standard installation directories. This behavior often indicates an adversary attempting to bypass administrative controls or attempting to establish remote access through ruse. The detected activity can fall under the MITRE ATT&CK tactics such as "Initial Access" (TA0001) and "Command and Control" (TA0011), specifically the technique for "Remote Access Software" (T1071).

  Primary telemetry sources include Windows Security Event ID 4688 for process creation, along with specific Path attributes. If this behavior is malicious, it could lead to significant security risks, granting unauthorized access to sensitive systems. However, this detection alone does not confirm that RURAT is being used maliciously, as there may be legitimate use cases for the functionality.

  ### Investigation Steps

  - **Verify process creation events**: Check Windows Security Event ID 4688 for process creation details, focusing on Image paths for `rutserv.exe` or `rfusclient.exe`. Look for instance creation outside typical `C:\Program Files\Remote Utilities` paths as a high-confidence malicious indicator.

  - **Identify originating locations**: Examine the paths of the executed processes. Any executions found in temporary directories (e.g., `%TEMP%`) or user profile folders (e.g., `C:\Users\<username>\`) could indicate malicious usage, while operations from standard installation directories are typically benign.

  - **Correlate with network activity**: Investigate outbound connections from the host in the Event Logs or network monitoring solutions. Look for unusual external connections initiated by the identified processes, especially to known command and control IPs or domains.

  - **Check for unusual user context**: Review Windows Security Event ID 4624 for logon events. Analyze whether RURAT is being executed under unusual accounts (e.g., non-admin or accounts not typically performing administrative tasks).

  - **Assess operational impact**: Note the criticality of the affected system's role in your environment. Workstations, servers, or sensitive assets with this activity observed should prompt an escalated response.

  - **Review legitimate use cases**: Confirm if there is an existing business justification for RURAT’s usage in your environment. Documenting such use cases can help distinguish true positives from false positives in future investigations.

  ### Prioritization

  This alert is of medium severity—executions of RURAT from outside of its expected installation paths suggest potential malicious activity. Given the tool's function for remote access, its detection raises concerns about unauthorized access to sensitive information and should be addressed promptly.

  ### Blind Spots and Assumptions

  Detection is limited by the absence of specific logging configurations. Executions might not generate alerts if proper logging settings aren’t enabled. Legitimate software updates or administrative tasks could trigger similar alerts, reflecting benign usage. Companion detections, such as alerting on unusual outbound network traffic linked to RURAT processes, can provide additional context and strengthen overall detection capabilities.

