title: Remote Access Tool - RURAT Execution From Unusual Location
id: e01fa958-6893-41d4-ae03-182477c5e77d
status: test
description: Detects execution of Remote Utilities RAT (RURAT) from an unusual location
  (outside of 'C:\Program Files')
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-19
modified: 2023-03-05
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\rutserv.exe'
    - '\rfusclient.exe'
  - Product: 'Remote Utilities'
  filter:
    Image|startswith:
    - 'C:\Program Files\Remote Utilities'
    - 'C:\Program Files (x86)\Remote Utilities'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of Remote Utilities Remote Access Tool (RURAT) executables (`rutserv.exe` and `rfusclient.exe`) originating from locations other than the standard installation directories. This behavior can indicate potential unauthorized use of the RAT, often employed by attackers for remote access and control of compromised systems.

  The likely attacker objective is to re-establish persistent access or conduct reconnaissance within the environment. The relevant MITRE ATT&CK tactic and technique are: *Execution* (TA0002), specifically *Command and Scripting Interpreter* (T1059). The primary telemetry sources include Windows process creation logs, specifically those generated by Sysmon (Event ID 1) and Security Event ID 4688. If executed maliciously, it can lead to significant security incidents such as data exfiltration or lateral movement.

  This detection does NOT confirm that the execution is inherently malicious; legitimate applications could also trigger this alert if they are executed from non-standard directories.

  ---

  ### Investigation Steps

  - **Check process creation logs for `rutserv.exe` and `rfusclient.exe`:** Review Sysmon Event ID 1 and Security Event ID 4688, filtering for these images and looking for the `ProcessCommandLine` field. Verify if they are running from locations outside `C:\Program Files\Remote Utilities\` or `C:\Program Files (x86)\Remote Utilities\`.

  - **Identify user context and associated permissions:** Analyze the `NewProcessId` and `User` fields in the process creation logs to ascertain the account executing the process. Determine if the user has legitimate reasons for running this software from an unusual location.

  - **Investigate historical behavior of the affected asset:** Cross-reference the assets against the prior installation directories of Remote Utilities. Typical legitimate behavior should show the application launching from the designated folders. Use logs or asset inventory tools to confirm previous known-good states.

  - **Review network activity for anomalous connections:** Check for outbound connections associated with the identified processes using Windows Firewall logs (Event ID 5156) or network IDS/IPS logs. Watch for unusual IP addresses or protocols that don't align with normal operational communications.

  - **Assess for known malicious indicators:** Look for indicators of compromise (IoCs) related to RURAT execution in threat intelligence feeds. High-confidence indicators might include related file hashes, command line parameters indicative of misuse, or associated C2 IP/domain communications.

  - **Correlate with other detection mechanisms:** Validate findings with detections for other RAT behaviors or persistence mechanisms within the environment, such as unusual autostart locations or abnormal login patterns in authentication logs (Event ID 4624).

  ---

  ### Prioritization

  This alert is of medium severity in an enterprise context. It hints at potential unauthorized access, which, if leveraged, could lead to elevated privileges and broad access to sensitive data. However, the likelihood of malicious abuse is contingent on further investigation into the user behavior and the context of the action, as RURAT may also be used legitimately under certain circumstances.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through renaming or moving executables into permitted directories or the use of other legitimate software misused for malicious purposes. Required log sources include Sysmon for detailed process monitoring and Windows Security event logs for process creation tracking. Legitimate activities that may trigger the alert include software updates or reconfigurations performed by IT staff. A related detection to consider for strengthening coverage includes monitoring for other RAT installations and executables like Ammyy Admin or TeamViewer for behavioral similarities.

