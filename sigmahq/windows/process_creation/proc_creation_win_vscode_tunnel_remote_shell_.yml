title: Visual Studio Code Tunnel Shell Execution
id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
status: test
description: Detects the execution of a shell (powershell, bash, wsl...) via 
  Visual Studio Code tunnel. Attackers can abuse this functionality to establish
  a C2 channel and execute arbitrary commands on the system.
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
- https://code.visualstudio.com/docs/remote/tunnels
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-10-25
tags:
- attack.command-and-control
- attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains: '\servers\Stable-'
    ParentImage|endswith: '\server\node.exe'
    ParentCommandLine|contains: '.vscode-server'     # Technically one can host its own local server instead of using the VsCode one. And that would probably change the name (requires further research)
    # Note: Child processes (ie: shells) can be whatever technically (with some efforts)
  selection_child_1:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains: '\terminal\browser\media\shellIntegration.ps1'
  selection_child_2:
    Image|endswith:
    - '\wsl.exe'
    - '\bash.exe'
  condition: selection_parent and 1 of selection_child_*
falsepositives:
- Legitimate use of Visual Studio Code tunnel and running code from there
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of shell processes (like PowerShell or WSL) initiated through a Visual Studio Code (VSCode) tunnel. Attackers may exploit this functionality to create a command-and-control (C2) channel, allowing them to execute arbitrary commands on the compromised system. This behavior fits into the MITRE ATT&CK framework under the Command and Control tactic, specifically technique T1071.001 (Application Layer Protocol: Web Protocols).

  The primary telemetry source for this detection comes from process creation events on Windows, specifically tracking parent-child process relationships, where the parent is VSCode and the child is a shell process. If malicious, this behavior can lead to unauthorized command execution, potential data exfiltration, and system compromise. However, this detection alone does not confirm malicious intent; legitimate users can use the VSCode tunnel feature for development purposes.

  ### Investigation Steps

  - **Verify parent process:** Check for process creation events (Windows Event ID 4688) where ParentImage includes `\servers\Stable-` and ends with `\server\node.exe`. Confirming this establishes the context for potential malicious activity.

  - **Identify malicious shell usage:** Investigate any child processes linked to the parent along with their CommandLine parameters that contain `\terminal\browser\media\shellIntegration.ps1`. Malicious usage often shows patterns deviating from expected script parameters.

  - **Review legitimate VSCode usage:** Confirm typical development activities where users may utilize the VSCode tunnel, including executing development scripts or remote code testing to distinguish them from anomalous behavior.

  - **Check for known indicators:** Look for any command line that invokes `powershell.exe`, `pwsh.exe`, `wsl.exe`, or `bash.exe` with parameters commonly associated with malicious execution as seen across previous incidents.

  - **Validate telemetry completeness:** Ensure collection of necessary logs by checking Windows security auditing for Event ID 4688 and any relevant Sysmon event data. Missing logs might hinder detection capability.

  ### Prioritization

  This alert is of medium severity as it involves potentially compromised systems where attackers could establish control and execute commands. The likelihood of malicious abuse is notable because this method is increasingly weaponized in current attacks. Lower critical assets using VSCode for development may warrant lighter responses, while critical systems should trigger immediate investigation.

  ### Blind Spots and Assumptions

  Detection of this behavior may be limited by the use of legitimate VSCode tunnel features, potentially generating false positives. There is also reliance on the configuration of process logging; without enabling detailed logging, the detection may miss instances of exploitation. Certain legitimate applications may run similar command patterns as the detected behavior. A related detection to strengthen coverage could include monitoring for network connections initiated by the detected shell processes to identify potential data exfiltration or additional C2 communications.

