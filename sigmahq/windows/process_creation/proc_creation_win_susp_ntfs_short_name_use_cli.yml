logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '~1.exe'
    - '~1.bat'
    - '~1.msi'
    - '~1.vbe'
    - '~1.vbs'
    - '~1.dll'
    - '~1.ps1'
    - '~1.js'
    - '~1.hta'
    - '~2.exe'
    - '~2.bat'
    - '~2.msi'
    - '~2.vbe'
    - '~2.vbs'
    - '~2.dll'
    - '~2.ps1'
    - '~2.js'
    - '~2.hta'
  filter:
  - ParentImage|endswith:
    - '\WebEx\WebexHost.exe'
    - '\thor\thor64.exe'
  - CommandLine|contains: 'C:\xampp\vcredist\VCREDI~1.EXE'
  condition: selection and not filter
falsepositives:
- Applications could use this notation occasionally which might generate some 
  false positives. In that case Investigate the parent and child process.
level: medium
note: |
  ### Technical Context

  This rule detects the invocation of Windows 8.3 short names in command line arguments, which is often utilized by attackers to obfuscate malicious command execution and avoid detection. The likely attacker objective is to evade security mechanisms by using alternate file naming conventions that may not trigger standard detection capabilities. This behavior aligns with the MITRE ATT&CK tactic for Defense Evasion (T1564.004).

  The primary telemetry source for this detection is process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, which log command line arguments. If malicious, detection indicates potential attempts to use legitimate-looking processes as a cover for execution of malware or scripts. However, this detection does NOT confirm malicious activity on its own, as the use of short names may sometimes occur through legitimate applications and user behavior.

  ---

  ### Investigation Steps

  - **Verify the command line execution:**
    Check Security Event ID 4688 logs for the specific command line containing short names. Pay attention to the presence of patterns like ‘~1.exe’ or ‘~2.bat’.

  - **Assess the parent process:**
    Investigate the ParentImage field in the process creation logs. Look for processes like '\WebEx\WebexHost.exe' or '\thor\thor64.exe'. If the parent process is not recognized or is suspicious, further investigation is warranted.

  - **Identify legitimate behavior:**
    Recognize that typical applications may use short names (like WebEx). If the command is generated from a known enterprise application functioning as expected, it may be benign.

  - **Analyze file artifacts:**
    If applicable, utilize Sysmon to verify file creation events (Sysmon Event ID 11) related to the executed command. Check the path and hash of the file for any known malicious indicators.

  - **Determine high-confidence indicators:**
    Investigate logs for unusual command line arguments combined with short names executed on critical assets (e.g., servers) that typically do not run such applications, indicating possible illicit activity.

  ---

  ### Prioritization

  The severity of this alert should be considered medium due to the potential impact of system compromise if short names are used to execute malware. The likelihood of malicious abuse is notable given that attackers commonly employ evasion techniques using short names. This behavior is relatively common in weaponized scripts and tools to bypass security measures.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if short names are used in legitimate software deployments or applications that utilize them frequently. It's also important to have detailed logs that fully capture process execution for reliable detection; missing or misconfigured logging could lead to false negatives. Legitimate administrative scripts or maintenance tasks may also result in triggering this alert, leading to false positives. A related detection that strengthens coverage is monitoring for unusual PowerShell command usage, as it can also signify malicious activities (e.g., execution of PowerShell scripts that may use short names).

