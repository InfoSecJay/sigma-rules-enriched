logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '~1.exe'
    - '~1.bat'
    - '~1.msi'
    - '~1.vbe'
    - '~1.vbs'
    - '~1.dll'
    - '~1.ps1'
    - '~1.js'
    - '~1.hta'
    - '~2.exe'
    - '~2.bat'
    - '~2.msi'
    - '~2.vbe'
    - '~2.vbs'
    - '~2.dll'
    - '~2.ps1'
    - '~2.js'
    - '~2.hta'
  filter:
  - ParentImage|endswith:
    - '\WebEx\WebexHost.exe'
    - '\thor\thor64.exe'
  - CommandLine|contains: 'C:\xampp\vcredist\VCREDI~1.EXE'
  condition: selection and not filter
falsepositives:
- Applications could use this notation occasionally which might generate some 
  false positives. In that case Investigate the parent and child process.
level: medium
note: |
  ### Technical Context

  This detection targets the use of Windows 8.3 short file names, which may be exploited to obfuscate malicious command-line execution and evade detection mechanisms. An attacker may utilize this technique to hide the true nature of files or scripts and prevent identification in command line logs, ultimately aiming to execute malicious payloads undetected. This behavior aligns with the MITRE ATT&CK technique T1564.004 (Hide Artifacts: Hidden Files and System Files).

  The primary telemetry source for this detection is process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, which capture command-line arguments used during process initiation. If the command-line usage of short names is determined to be malicious, it can lead to compromised systems and potential data breaches. It is crucial to note that this detection does NOT confirm that the activity is malicious on its own; further investigation is needed to ascertain intent.

  ### Investigation Steps

  - **Verify the command-line arguments:** Review process creation logs for Event ID 4688 and identify where short names (e.g., `~1.exe`, `~2.bat`) appear in the command line. Compare against known application behaviors to determine if this usage is typical.

  - **Assess parent process:** Check the parent process of any detected command lines that use 8.3 short names. Look for suspicious parent processes such as `WebexHost.exe` or `thor64.exe`, which may indicate malicious intent.

  - **Determine process context:** Utilize Sysmon logs (Event ID 1) to correlate the execution of short name processes with their timestamps and the user account under which they were executed. This helps establish whether the execution context is anomalous to normal operational behavior.

  - **Identify legitimate application use:** Note that some legitimate applications may utilize 8.3 short names. Investigate the presence and behavior of common applications that may generate these logs, analyzing their typical operation to differentiate between benign and suspicious activity.

  - **Look for associated malicious indicators:** Analyze for additional signs of known malware behavior, such as unusual network requests, file modifications, or suspicious parent-child process relationships that may support a conclusion of malicious activity.

  - **Cross-reference with threat intelligence:** Compare detected short name usage against threat intelligence feeds to identify if the observed behavior matches known malicious patterns or signatures for active threats.

  ### Prioritization

  This alert is of medium severity as it indicates potentially stealthy command execution behavior that can be indicative of lateral movement or intrusion attempts. Given the typical attacker’s tendency to use obfuscation techniques, such behavior warrants prompt review, particularly if it is observed in critical system contexts.

  ### Blind Spots and Assumptions

  Detection is limited by the presence of legitimate applications that may also utilize 8.3 short names, which can generate false positives. This detection requires process creation logs to be configured and monitored continuously for reliable coverage. It's plausible for benign scripts to leverage short names during execution. A companion detection, such as monitoring for unusual process spawning (e.g., Event ID 4688 with high-privilege accounts), can bolster alert confirmation and context.

