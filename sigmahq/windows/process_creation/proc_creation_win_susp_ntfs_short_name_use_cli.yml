title: Use NTFS Short Name in Command Line
id: dd6b39d9-d9be-4a3b-8fe0-fe3c6a5c1795
related:
- id: 3ef5605c-9eb9-47b0-9a71-b727e6aa5c3b
  type: similar
status: test
description: Detect use of the Windows 8.3 short name. Which could be used as a method
  to avoid command-line detection
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/jonasLyk/status/1555914501802921984
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-05
modified: 2022-09-21
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '~1.exe'
    - '~1.bat'
    - '~1.msi'
    - '~1.vbe'
    - '~1.vbs'
    - '~1.dll'
    - '~1.ps1'
    - '~1.js'
    - '~1.hta'
    - '~2.exe'
    - '~2.bat'
    - '~2.msi'
    - '~2.vbe'
    - '~2.vbs'
    - '~2.dll'
    - '~2.ps1'
    - '~2.js'
    - '~2.hta'
  filter:
  - ParentImage|endswith:
    - '\WebEx\WebexHost.exe'
    - '\thor\thor64.exe'
  - CommandLine|contains: 'C:\xampp\vcredist\VCREDI~1.EXE'
  condition: selection and not filter
falsepositives:
- Applications could use this notation occasionally which might generate some false
  positives. In that case Investigate the parent and child process.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of Windows 8.3 short names in command-line arguments, which may indicate an attempt at evading detection mechanisms within an enterprise environment. Attackers may utilize these shortened file names to obscure malicious activity, as standard logging mechanisms might not capture such references clearly. An example scenario involves malware or unauthorized scripts leveraging these short names to execute without triggering security alerts.

  The detection primarily relates to the **Defense Evasion** tactic in the MITRE ATT&CK framework, specifically technique **T1564.004: File and Directory Permissions Modification**. By manipulating file name formats, attackers can bypass security controls that are less vigilant towards unusual filename patterns, making it crucial for security analysts to monitor such activities closely.

  Primary data sources include:
  - Windows process creation logs, which capture command-line executions.
  - Event logs that may detail unusual file accesses or manipulations.
  - Logs from security tools that may flag suspicious process behaviors associated with short names.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the specific command-line arguments in the Windows process creation logs to confirm the presence of 8.3 short names, particularly focusing on `~1`, `~2`, and other short name patterns noted in the detection logic.

  - **Analyze Parent-Child Relationships**: Look into the parent processes indicated in the logs (e.g., `WebexHost.exe` and `thor64.exe`) to analyze their behavior and context. Check if the parent processes are legitimate or atypical for your operational environment.

  - **Cross-Reference with Known Good Applications**: Since some applications may utilize 8.3 naming for legitimate reasons, correlate findings with a list of recognized applications within your organization to identify if a potential false positive exists or if further investigation is warranted.

  - **Check for Additional Contextual Information**: Leverage additional telemetry from endpoints or network security devices that may provide context around the identified process behaviors and any network interactions related to the detected short names.

  ### Prioritization
  This alert is considered medium severity due to its capability to indicate potentially stealthy and evasive behaviors by attackers. While the use of 8.3 short names could be legitimate in certain contexts, their frequent appearance in command lines may signify a deeper compromise requiring immediate investigation to prevent further exploitation.

  ### Blind Spots and Assumptions
  One gap in detection coverage could arise if an attacker avoids using 8.3 naming conventions altogether, or if the relevant logs are not adequately collected or retained. The detection logic assumes that attacks will use specific parent processes, which may not always be valid if new or different tactics are employed. Additionally, this rule requires consistent and reliable process creation logs to function effectively; any misconfigurations or lack of logging could hinder detection reliability.

