note: |
  ### Technical Context
  This detection rule identifies attempts to gather system information through direct queries to the Windows Registry. Attackers may use such methods to collect valuable information about the operating system, installed applications, and system configurations, which can aid in further exploitation or reconnaissance. The ability to understand the environment allows attackers to refine their strategies, escalate privileges, or deploy malware tailored to the system's specific characteristics.

  The relevant MITRE ATT&CK techniques for this rule include **T1082: System Information Discovery**, which focuses on gathering system details, and **T1124: System Time Discovery**, which involves querying time zone information. These tactics suggest that the attacker may be attempting to understand the environment better, potentially before carrying out further malicious activities.

  The primary data sources for this detection include **process creation events**, which provide logs of the execution of commands like `reg.exe` and `powershell.exe` along with their command line arguments, and **Windows Registry access logs**.

  ### Investigation Steps
  - **Analyze Process Creation Events**: Review process creation logs to detect instances where `reg.exe` or `powershell.exe` are executed with commands that indicate system information queries.
  - **Inspect Command Line Arguments**: Pay special attention to command line arguments that include `query`, `Get-ItemPropertyValue`, or reference registry paths such as `\SOFTWARE\Microsoft\Windows NT\CurrentVersion`, as these are indicative of system enumeration attempts.
  - **Correlate with User Activity**: Investigate the context of the commands by correlating execution times and users with recent activities, especially if they are unexpected or unauthorized.
  - **Review Registry Access Patterns**: Check for unusual registry access patterns or timestamps tied to the events, which might suggest an ongoing reconnaissance or malicious activity.

  ### Prioritization
  The alert has a **low severity** due to the nature of the behavior detected, often occurring in legitimate administrative tasks. However, regular occurrences from unexpected accounts or situations warrant further investigation to rule out potential malicious intent.

  ### Blind Spots and Assumptions
  The detection may miss coverage if log retention policies do not retain sufficient process creation logs for analysis. This rule assumes that the execution of the specific commands captured in the selection criteria is malicious in nature, which may not always be the case, as legitimate applications may invoke similar commands. Additionally, the rule relies on the proper logging configuration for process creation events, which must be enabled to ensure accurate detection and reporting.

