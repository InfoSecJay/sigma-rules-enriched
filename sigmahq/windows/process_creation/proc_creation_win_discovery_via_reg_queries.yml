note: |
  ---

  ### Technical Context

  This rule detects attempts to query system information from the Windows Registry using both command-line tools (specifically `reg.exe` and PowerShell) and certain parameters indicative of discovery activities. The likely attacker objective is to gather system details, which can inform further exploitation or lateral movement within the compromised network. This behavior is classified under the MITRE ATT&CK framework as Discovery (T1082 - System Information Discovery).

  The primary telemetry source is process creation events from Windows, including Event ID 4688, which captures command line invocations. If this behavior is malicious, it could potentially allow an adversary to identify useful system configurations, installed software, or security mechanisms in place. Importantly, this detection does NOT confirm actual exploitation or successful intrusion on its own.

  ---

  ### Investigation Steps

  - **Identify the command used:** Review process creation logs for Event ID 4688. Look for command lines that contain either `reg.exe` with the `query` and `-v` flags or PowerShell commands using `Get-ItemPropertyValue` (fields: `NewProcessName`, `CommandLine`).

  - **Check Registry Keys Accessed:** Validate which Registry keys are being targeted in the command. Commonly accessed keys include `\SOFTWARE\Microsoft\Windows NT\CurrentVersion` or `\SYSTEM\CurrentControlSet\Services`. Legitimate admin activities often include similar queries but are more focused on configuration management or maintenance tasks.

  - **Correlate process parent-child relationships:** Use Event ID 4656 and 4663 to check if these registry queries are executed from authorized administrative tools (e.g., `mmc.exe`, `powershell.exe`), or if they follow suspicious or unauthorized process chains.

  - **Establish baseline behavior:** Determine if the observed command lines align with typical administrative operations within the organization (fields: `AccountName`, `ExecutionProcess`, `CommandLine`). Look for anomalies such as unusual timing or non-standard user accounts executing these commands.

  - **Identify malicious indicators:** High-confidence malicious activity may include repeated queries on service keys or discovery-related keys such as `\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall`, especially when executed by unexpected users or systems (fields: `ProcessID`, `UserID`).

  - **Validate asset criticality:** Consider the asset's role within your environment. Queries on critical infrastructure like domain controllers or production servers indicate higher risk and should be escalated accordingly.

  ---

  ### Prioritization

  Alert severity is considered low within a general context, as system discovery activities can be legitimate and regular. However, the likelihood of abuse exists, particularly if performed on sensitive systems. This behavior can sometimes be weaponized in preparation for follow-up malicious actions, warranting closer examination.

  ---

  ### Blind Spots and Assumptions

  One significant detection limitation is the possibility of benign administrative actions by authorized users triggering this alert, potentially leading to false positives. Additionally, if logs for command-line analysis are not enabled consistently, detection may miss important events. Legitimate activities such as system maintenance or audits may also confront this rule. A related detection rule for suspicious command-line arguments or unauthorized use of administrative tools may provide stronger context and coverage.

