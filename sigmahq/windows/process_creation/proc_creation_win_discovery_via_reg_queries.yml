note: |
  ### Technical Context

  This Sigma rule detects behavior associated with system information discovery via querying the Windows Registry. Attackers typically aim to collect vital information about the operating system, installed software, and system configuration to aid in post-exploitation activities or privilege escalation. The relevant MITRE ATT&CK tactic is **Discovery**, specifically techniques **T1082: System Information Discovery** and **T1124: System Time Discovery**.

  Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688 or Sysmon Event ID 1) that capture the execution of processes like `reg.exe` or `powershell.exe` with specific command-line arguments aimed at querying registries. The security impact of successful malicious execution could involve gathering sensitive system information, which can lead to further exploitation or lateral movement. Notably, while this detection indicates a potential reconnaissance activity, it does NOT confirm malicious intent or successful exploitation on its own.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where processes like `reg.exe` or `powershell.exe` are invoked, specifically with command-line flags that include `query` or `Get-ItemPropertyValue`.

  - **Examine command-line arguments**: Identify command lines that contain targeted registry keys such as `\SOFTWARE\Microsoft\Windows NT\CurrentVersion` or `\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall`.

  - **Identify high-confidence malicious indicators**: Look for unusual execution patterns wherein `reg.exe` or `powershell.exe` queries for sensitive information (e.g., the existence of registry keys that generally should not be accessed, such as security-related settings).

  - **Correlate with legitimate activity**: Ensure that expected administrative or support operations, such as system maintenance scripts or software installations, were not the cause of the detected behavior, highlighting acceptable command lines that access registry keys.

  - **Assess asset criticality**: Determine if the affected host is a critical server or user workstation. Malicious information gathering is more concerning on sensitive servers (e.g., domain controllers) compared to regular user systems.

  ### Prioritization

  This alert should be considered low severity in a mature enterprise SOC. While it indicates possible reconnaissance activity, the likelihood of malicious exploitation varies based on the context. The impact of affected systems will also dictate prioritization; actions against high-value assets warrant increased investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include malware disabling logging or using non-standard tools to query the registry without triggering alerts. The detection requires process creation logs configured for auditing, which may not be consistently enabled across all environments. Legitimate use cases include IT support activities that require checking installed software. A related detection that strengthens coverage includes identifying unusual access patterns to critical registry keys or unauthorized access to sensitive scripts.

