logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\winlogon.exe'
    Image|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
    - '\wt.exe'
    CommandLine|contains:
    - 'sethc.exe'
    - 'utilman.exe'
    - 'osk.exe'
    - 'Magnify.exe'
    - 'Narrator.exe'
    - 'DisplaySwitch.exe'
  condition: selection
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the execution of processes related to the Sticky Keys feature or other accessibility tools that have been repurposed to install backdoors. An adversary may use this capability to maintain persistent access to a compromised system through legitimate Windows features. This behavior fits within the MITRE ATT&CK framework under the tactics of "Persistence" (T1546.008) and "Privilege Escalation."

  The primary telemetry sources for detection include Windows process creation events, specifically Security Event ID 4688. If malicious, this behavior can allow an attacker to bypass authentication controls and gain unauthorized access to the system. Importantly, this detection does NOT confirm active compromise on its own, as it may also generate false positives from legitimate administrative activities or accessibility feature usage.

  ### Investigation Steps

  - **Identify the triggering process:** Review Security Event ID 4688 logs for process creation events where the `ParentImage` ends with `winlogon.exe`. Look specifically for the `Image` field containing `cmd.exe`, `powershell.exe`, etc.

  - **Examine the command line arguments:** Check the `CommandLine` field for entries containing `sethc.exe`, `utilman.exe`, or other mentioned accessibility tools. Malicious indicators will typically include these terms, which are uncommon in normal operations.

  - **Assess recent system changes:** Review the `System` and `Application` event logs for any recent installations or unusual changes that coincide with the timing of the alert. Look for Event ID 6005 or 6006 indicating service start/stop related to accessibility.

  - **Validate legitimate use cases:** Check for expected usage scenarios where accessibility features are utilized, such as during scheduled maintenance or by users with disabilities. This activity will often have corresponding access requests or documentation.

  - **Correlate with related alerts:** Investigate if there are other alerts related to privilege escalation or persistence mechanisms, such as those stemming from Event ID 4672 (Special Privileges Assigned), to understand the broader context of user behavior.

  ### Prioritization

  This alert should be treated with high priority due to the likelihood of privilege escalation and persistence in a critical system, which can lead to further exploitation. The commonality of utilizing these techniques makes the detection pertinent for immediate response.

  ### Blind Spots and Assumptions

  There may be limitations in detection accuracy if logging for process creation is not properly configured; without these logs, detection will fail. Legitimate administrative actions, like those performed during system upgrades or accessibility feature testing, could also trigger this alert. A related detection, such as anomalous logon events from the same user account, can provide supplementary context for a more accurate risk assessment.

