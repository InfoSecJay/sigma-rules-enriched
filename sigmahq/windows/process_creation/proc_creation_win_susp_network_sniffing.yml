- attack.t1040
logsource:
  category: process_creation
  product: windows
detection:
  selection_tshark:
    Image|endswith: '\tshark.exe'
    CommandLine|contains: '-i'
  selection_windump:
    Image|endswith: '\windump.exe'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activity to troubleshoot network issues
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of network tools such as "tshark" and "windump", which can be used for network sniffing activities. The likely objective of an attacker utilizing these tools is to capture sensitive network traffic—this may include unencrypted credentials or confidential business communications. The relevant MITRE ATT&CK tactic is "Credential Access" (TA0006) and the technique is "Network Sniffing" (T1040). Primary telemetry sources include process creation logs from Windows systems, specifically Security Event ID 4688 or Sysmon Event ID 1, to capture relevant command-line arguments and image paths. If malicious, the security impact may include data breaches or unauthorized access to network communications. This detection does NOT confirm malicious intent on its own, as legitimate administration activities can involve similar commands.

  ---

  ### Investigation Steps

  - **Identify the process creation event**: Review Security Event ID 4688 or Sysmon Event ID 1 for processes involving "tshark.exe" or "windump.exe". Focus on the 'CommandLine' fields to check for network interfaces specified with `-i`.

  - **Check for unusual command-line arguments**: Examine the command-line parameters for "tshark" and "windump". Malicious indicators include flags signaling promiscuous mode (e.g., `-i` combined with interface names) or extensive filtering options indicative of data capture.

  - **Validate legitimate usage**: Cross-reference the timestamp of the alert with scheduled tasks or known maintenance windows. Legitimate network monitoring might involve similar commands but typically includes familiar user accounts and common network interfaces.

  - **Assess user privileges**: Identify the user account executing the commands. High-privilege accounts running network sniffing tools without prior authorization are suspicious compared to standard user accounts or those linked with IT support.

  - **Observe network traffic patterns**: Validate whether network traffic patterns align with the execution of these tools. This may include observations of high traffic rates or unusual protocols monitored around the event time.

  - **Investigate network shares**: If applicable, monitor for unusual file sharing behavior or access patterns that coincide with the execution time of these sniffing tools, particularly on critical assets or sensitive shares.

  ---

  ### Prioritization

  This alert should be regarded as medium severity due to the potential risk associated with network sniffing activities. The likelihood of malicious abuse is moderate, as these tools are commonly utilized for both legitimate networking troubleshooting and adversarial purposes. While not extremely common, instances of this behavior are a well-known tactic used by attackers.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as process obfuscation, where attackers rename or use alternative tools for network sniffing. It is essential that security logs for process creation and user activity are consistently collected and configured properly to ensure reliability. Legitimate administrative activities, such as troubleshooting network issues by IT staff, may generate similar alerts. A related detection to consider is the monitoring of network interface changes or configurations, which could provide additional context around network access activities.

