title: Potential Network Sniffing Activity Using Network Tools
id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
status: test
description: |
  Detects potential network sniffing via use of network tools such as "tshark", "windump".
  Network sniffing refers to using the network interface on a system to monitor or capture information sent over a wired or wireless connection.
  An adversary may place a network interface into promiscuous mode to passively access data in transit over the network, or use span ports to capture a larger amount of data.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1040/T1040.md
author: Timur Zinniatullin, oscd.community, Nasreddine Bencherchali (Nextron Systems)
date: 2019-10-21
modified: 2023-02-20
tags:
- attack.credential-access
- attack.discovery
- attack.t1040
logsource:
  category: process_creation
  product: windows
detection:
  selection_tshark:
    Image|endswith: '\tshark.exe'
    CommandLine|contains: '-i'
  selection_windump:
    Image|endswith: '\windump.exe'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activity to troubleshoot network issues
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential network sniffing activities that may indicate malicious intent, specifically through the use of network analysis tools like "tshark" and "windump." Network sniffing involves monitoring or capturing data being transmitted over a network, which can be leveraged by adversaries for credential theft, reconnaissance, or to gather sensitive information. In this scenario, an attacker may use promiscuous mode or SPAN ports to intercept data packets, gaining unauthorized access to potentially confidential data.

  The rule relates to MITRE ATT&CK techniques focused on credential access and network discovery, specifically T1040 (Network Sniffing). Adversaries employing these tools could aim to gather sensitive credentials or other critical information from network traffic, which can facilitate further compromise within the organization. The primary data sources for this detection include process creation events from systems within the network that could indicate the execution of these tools and their corresponding command-line arguments.

  ### Investigation Steps
  - **Verify Process Creation Logs:** Review process creation logs to identify instances of "tshark.exe" or "windump.exe" being executed, along with their command-line parameters for suspicious indicators.
  - **Analyze Network Traffic:** Inspect network traffic for any unusual patterns or spikes that coincide with the execution of the sniffing tools. Look for any promiscuous mode operations or unauthorized SPAN port activities.
  - **Check User Accounts:** Investigate the user accounts initiating these processes to determine if they align with normal administrative activities or if they exhibit signs of potential account compromise.
  - **Correlate with Other Logs:** Cross-reference findings with logs from NGFW or NDR solutions to identify any unusual data exfiltration patterns or unauthorized access attempts that may be related to the use of these network tools.

  ### Prioritization
  This alert is rated medium severity due to the potential impact of unauthorized data interception, which can compromise sensitive information and lead to further security incidents. The likelihood of such activities occurring in a corporate environment necessitates prompt investigation to mitigate risks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administration activities where tools like "tshark" and "windump" might be appropriately used for troubleshooting purposes. The detection logic assumes that command-line arguments associated with these tools will indicate nefarious use, which might not always be accurate. Additionally, this alert requires adequate logging of process creation events; if such logs are not enabled or retained, the detection mechanism could fail to trigger.

