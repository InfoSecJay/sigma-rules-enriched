logsource:
  category: process_creation
  product: windows
detection:
  selection_tshark:
    Image|endswith: '\tshark.exe'
    CommandLine|contains: '-i'
  selection_windump:
    Image|endswith: '\windump.exe'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activity to troubleshoot network issues
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential network sniffing activities through the execution of network analysis tools like "tshark" and "windump." These tools can enable threat actors to monitor and capture unencrypted network traffic, facilitating unauthorized data access. The likely attacker objective is to gather sensitive information, such as credentials or intellectual property, by capturing network traffic in real-time. The relevant MITRE ATT&CK tactic is Credential Access (TA0006), and the technique is Network Sniffing (T1040).

  Primary telemetry sources include Windows process creation logs (Event ID 4688) that capture command line arguments indicating the usage of these tools. If malicious, such activity may lead to significant data breaches or compromise network confidentiality. However, this detection does NOT confirm user intention, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for instances of "tshark.exe" or "windump.exe." Analyze command line arguments for flags like '-i', indicating network interface monitoring.
  - **Verify authorized activities:** Identify if the logged user is part of the IT team or if there is a documented need for network troubleshooting to differentiate between benign and malicious activity.
  - **Investigate network interfaces:** Assess if the network interfaces on the affected systems were set to promiscuous mode. Evidence can be inferred from network monitoring tools or commands executed post-detection.
  - **Check for additional indicators:** Review network flow logs for evidence of unusual traffic patterns including increased data throughput that coincides with the tool usage, using tools like NetFlow or equivalent log sources.
  - **Correlate with user behavior:** Cross-reference the timing of the sniffing activity with alerts or anomalies in user behavior, especially for accounts with access to sensitive data.
  - **Assess asset criticality:** Determine the role of the affected system in the network. Systems with higher sensitivity (e.g., database servers, application servers) elevate the severity of the detected behavior.

  ### Prioritization

  The alert severity is medium as potential network sniffing could lead to credential compromise and data breaches, especially if the affected system holds sensitive data. However, the likelihood of malicious abuse can vary, as some users may legitimately use these tools for troubleshooting. Notably, these network tools are commonly weaponized by adversaries to sift through network traffic.

  ### Blind Spots and Assumptions

  There are detection limitations since advanced adversaries may use obfuscation or renaming tactics to disguise their activity. Proper logging configuration is essential for capturing the requisite telemetry to ensure reliable detection. Legitimate administrative troubleshooting could trigger this alert, thus requiring context for appropriate response. A related detection is monitoring for unusual outbound traffic patterns, which could indicate data exfiltration following such sniffing activities.

