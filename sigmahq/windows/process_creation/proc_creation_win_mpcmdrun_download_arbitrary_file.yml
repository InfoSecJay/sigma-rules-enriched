note: |
  ### Technical Context
  This detection rule identifies the use of Windows Defender's MpCmdRun.EXE to download files from the internet. Attackers may exploit this legitimate utility to exfiltrate data or to facilitate further malicious activities while masquerading as an authorized process. The primary objective typically centers around executing command-and-control (C2) operations or evading detection by utilizing trusted system tools in a deceptive manner.

  Relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)**, where attackers use system tools to obfuscate unauthorized actions, and **Command and Control (T1105)**, as malicious downloads can enable follow-on exploits or malware installations. The technique **Execution (T1218)** is also applicable, referring to the use of system binaries to execute the download, showcasing a tiered method of surfacing malicious intentions under normal operational processes.

  Primary data sources for this detection include process creation events generated by the Windows operating system. Tracking the command line parameters utilized by MpCmdRun.EXE can provide insight into potentially malicious file downloads.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check logs for processes initiated by MpCmdRun.EXE, noting the specific command line arguments utilized. Pay attention to any variations or unusual parameters indicating potential malicious activity.
  - **Analyze Network Traffic**: Evaluate outbound network connections around the time the download occurred. Look for connections to unfamiliar or suspicious URLs that correlate with the command line parameters observed.
  - **Validate Downloaded Files**: If feasible, examine the file(s) downloaded for content or behavior. Determine if they are known malicious files or benign yet unauthorized downloads.
  - **Correlate with Threat Intelligence**: Utilize threat intelligence resources to check if the URLs used correlate with known malicious indicators or commonly used commands by threat actors.

  ### Prioritization
  The severity of this alert is high due to the potential for data exfiltration or malware introduction through trusted system utilities, which can pose significant risks to enterprise security. Given the likelihood of misuse of a legitimate tool for nefarious purposes, prompt investigation is crucial.

  ### Blind Spots and Assumptions
  There may be blind spots in detection if certain logging features are not enabled on Windows systems, as detailed process command line arguments may not be available. This detection logic assumes that logs pertaining to process creation are being generated and sufficiently retained. Additionally, it assumes that the use of MpCmdRun.EXE in this manner is not a common practice within the organization, as frequent legitimate downloads using this utility could lead to high rates of false positives without thorough contextual awareness.

