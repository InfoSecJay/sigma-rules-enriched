note: |
  ### Technical Context

  This Sigma rule detects the use of Windows Defender's `MpCmdRun.EXE` to download files, indicating potential misuse of a legitimate utility for malicious purposes. Attackers could leverage this behavior to exfiltrate data or introduce malware while evading traditional defenses that may consider `MpCmdRun` a trusted process. This activity aligns with the MITRE ATT&CK tactics of Defense Evasion (TA0005) and Command and Control (TA0011), specifically techniques T1218 (Signed Binary Proxy Execution) and T1105 (Ingress Tool Transfer).

  The primary telemetry sources are Windows Process Creation logs (Event ID 4688) and possibly Sysmon Event ID 1 for enhanced visibility. If the activity is determined to be malicious, the impact could range from data theft to the introduction of further malicious software within the environment. Importantly, this detection does NOT confirm that the files downloaded are malicious or that the activity was not authorized; further context is necessary for a conclusive assessment.

  ### Investigation Steps

  - **Verify the source process of the download:** Examine Security Event ID 4688 or Sysmon Event ID 1 logs for `MpCmdRun.exe`. Validate that the parent process pipeline is legitimate; it should originate from trusted system processes like `svchost.exe` or system maintenance tasks.

  - **Analyze the command line arguments:** Check the CommandLine field in logs. Suspicious command line arguments should contain 'DownloadFile' and a URL. Legitimate instances should not show unusual or unauthorized URLs. Identify URLs that point to external sources not associated with known safe domains.

  - **Inspect the downloaded file:** If identifiable, determine the file name and file type being downloaded. Malicious downloads often target executable or script formats, such as .exe, .bat, .cmd, or .ps1, while benign operations typically involve legitimate application updates.

  - **Contextualize user activity:** Cross-reference the timestamps of the process creation with user logon events in Security Event ID 4624. If the command was executed outside of regular user hours or during a time of high background system activity, it may indicate malicious intent.

  - **Evaluate host behavior post-download:** Look for subsequent processes initiated within a short time frame after the file download. A new process spawned immediately after the download could indicate an execution attempt of a malicious payload.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems and the likelihood that hostile actors may exploit Windows utilities like `MpCmdRun.EXE` for actions such as file exfiltration or malware deployment. Such behavior is known and documented in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in logging settings that do not capture Process Creation events for all users or tasks. Evasion techniques could involve using `MpCmdRun.EXE` with obscured or unexpected command line arguments that are difficult to enumerate. Legitimate administrative tasks or updates may trigger this alert, particularly if they involve downloading protection updates or definitions from trusted sources. A companion detection to consider is monitoring scheduled tasks for unexpected jobs that may also utilize `MpCmdRun.EXE` for downloading files.

