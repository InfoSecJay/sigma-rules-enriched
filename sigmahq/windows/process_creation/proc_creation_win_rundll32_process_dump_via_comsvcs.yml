logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli_1:
    CommandLine|contains|all:
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - '#-'
    - '#+'
    - '#24'
    - '24 '
    - 'MiniDump'         # Matches MiniDump and MinidumpW
    - '#65560'         # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.  for e.g ordinal 24 can be also represented by 65560 (65536+24)
  selection_generic:
    CommandLine|contains|all:
    - '24'
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - ' #'
    - ',#'
    - ', #'
    - '"#'
  condition: (selection_img and 1 of selection_cli_*) or selection_generic
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of memory dump processes via the `comsvcs.dll` library using `rundll32.exe`. Attackers often employ this method to collect sensitive information, such as credentials or secrets from memory, which can facilitate further unauthorized access or lateral movement within a network. By using process injection and memory dumping techniques, threat actors can remain stealthy while extracting critical data from compromised systems.

  The likely objectives of attackers leveraging this technique include the extraction of sensitive information for credential access (T1003.001) and evading defenses against malware (T1036). It is crucial for security teams to understand that the utilization of `comsvcs.dll` for memory dumping can be a precursor to more extensive attacks, potentially leading to system compromises or data breaches.

  Relevant MITRE ATT&CK tactics/techniques include:
  - Credential Access (T1003 - Credential Dumping)
  - Defense Evasion (T1036 - Masquerading)

  Primary data sources that will provide the best evidence for this detection include:
  - Process creation logs from Windows, which detail command line arguments and executable names.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze recent process creation logs for instances where `rundll32.exe` was executed with suspicious command-line arguments, particularly those involving `comsvcs.dll` and memory dump commands.
  - **Examine Command Line Arguments**: Look for command lines that include keywords associated with memory dumping, such as `MiniDump`, and note any unusual or high ordinal values that deviate from typical usage patterns.
  - **Correlate with User Behavior**: Investigate user activity leading up to the detection. Check for anomalous login times or patterns and whether the user has a legitimate reason to execute memory dumps.
  - **Check for Follow-Up Activity**: Following an identified event, assess further system events for signs of lateral movement or additional data exfiltration attempts which may indicate a broader compromise.

  ### Prioritization
  Given the high impact and potential for credential theft or system compromise, alerts generated by this detection rule should be treated with high priority. The likelihood of exploitation via memory dumping techniques makes timely investigation imperative to mitigating associated risks.

  ### Blind Spots and Assumptions
  This rule may miss instances where memory dumps are executed via alternate methods (e.g., using tools outside of `rundll32.exe` or leveraging other libraries). Additionally, it assumes that appropriate logging settings are enabled on Windows systems to capture detailed process creation data. If these logs are not configured or retained, the alert may not function as intended. Analysts should ensure that process creation logging is enabled for robust detection coverage.

