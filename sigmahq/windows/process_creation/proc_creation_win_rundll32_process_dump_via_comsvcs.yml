logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli_1:
    CommandLine|contains|all:
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - '#-'
    - '#+'
    - '#24'
    - '24 '
    - 'MiniDump'         # Matches MiniDump and MinidumpW
    - '#65560'         # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.  for e.g ordinal 24 can be also represented by 65560 (65536+24)
  selection_generic:
    CommandLine|contains|all:
    - '24'
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - ' #'
    - ',#'
    - ', #'
    - '"#'
  condition: (selection_img and 1 of selection_cli_*) or selection_generic
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs/info.yml
note: |
  ### Technical Context

  This rule detects the use of `rundll32.exe` to initiate memory dumps of processes via `comsvcs.dll`. This behavior is associated with credential theft or other malicious activities aimed at extracting sensitive information from memory. The likely attacker objective is to capture credentials or other sensitive data from a targeted process. This detection correlates with the MITRE ATT&CK tactics of Credential Access (T1003) and Defense Evasion (T1036).

  The primary telemetry source is process creation events on Windows systems, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, the security impact could be significant, potentially leading to credential compromise or lateral movement. It's important to note that this detection does *not* confirm malicious intent on its own, as legitimate software or administrative tools may also invoke similar processes.

  ### Investigation Steps

  - **Review the process creation event:** Analyze Security Event ID 4688 or Sysmon Event ID 1 for `rundll32.exe`. Look for the specific command line containing `comsvcs`, `MiniDump`, or any numeral variants like `#24`. Legitimate usage may include known administrative tasks or application debugging processes.

  - **Validate command line arguments:** Check if the `rundll32.exe` invocation includes any suspicious parameters such as `#24`, which suggests an attempt to manipulate memory dump functionality in an unconventional way. Malicious use typically involves varied ordinals or unexpected command line behavior.

  - **Check the parent process:** Determine the parent process of `rundll32.exe` in the execution chain. Legitimate parent processes usually include known management tools or software, whereas a parent process from an unexpected path may indicate malicious behavior.

  - **Investigate process memory dumps:** Inspect file artifacts for any created memory dump files, especially those created in unusual directories or timestamps. File creations in temp directories or user profile folders may suggest data exfiltration.

  - **Cross-reference with known threat intelligence:** Use threat intelligence platforms or logs to check if the detected command patterns match any known malware signatures or attack techniques capable of exploiting `comsvcs.dll`.

  - **Document legit use cases:** Record legitimate activities involving `rundll32.exe` for memory tasks, like administrative tools for debugging that may generate similar command lines. This provides context for ongoing alerts and can help reduce false positives.

  ### Prioritization

  This alert should be treated as high severity due to the potential for sensitive data exfiltration from a system with high impact. The use of `comsvcs.dll` for memory dumping is a technique commonly exploited by adversaries to bypass security mechanisms and compromise credentials, making it a significant threat vector.

  ### Blind Spots and Assumptions

  Detection limitations exist as adversaries may use alternative, less detectable methodologies for memory dumping, such as using custom tools or alternate DLLs. The required log sources must be properly configured to capture process creation events, and missing logs could lead to undetected activity. Legitimate administrative tasks involving `rundll32.exe` may also trigger these alerts. Companion detections include monitoring for unusual process hierarchies or other process injection techniques, strengthening overall exposure to credential theft activities.

