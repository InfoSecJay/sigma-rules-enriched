logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli_1:
    CommandLine|contains|all:
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - '#-'
    - '#+'
    - '#24'
    - '24 '
    - 'MiniDump'         # Matches MiniDump and MinidumpW
    - '#65560'         # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.  for e.g ordinal 24 can be also represented by 65560 (65536+24)
  selection_generic:
    CommandLine|contains|all:
    - '24'
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - ' #'
    - ',#'
    - ', #'
    - '"#'
  condition: (selection_img and 1 of selection_cli_*) or selection_generic
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a process memory dump using `comsvcs.dll` via `rundll32.exe`. The rule targets specific command line arguments and behaviors commonly associated with credential theft and privilege escalation objectives. The relevant MITRE ATT&CK tactics and techniques are "Credential Access" (T1003.001) and "Defense Evasion" (T1036). Primary telemetry sources include process creation events (Windows Security Event ID 4688 or Sysmon Event ID 1) that highlight unusual command line arguments indicating the use of `rundll32.exe` for memory dumping operations. If confirmed malicious, this activity can compromise sensitive information stored in memory, such as credentials and tokens. Importantly, this detection alone does not confirm successful data extraction or that the actor has established a foothold in the environment.

  ### Investigation Steps

  - **Review Process Creation Events**: Check for Security Event ID 4688 or Sysmon Event ID 1 that display the execution of `rundll32.exe`. Look for unusual parent processes or command lines, specifically for instances containing `comsvcs`.

  - **Analyze Command Line Arguments**: Validate the command line parameters from the identified process creation events. A typical malicious execution might include keywords like `comsvcs`, `MiniDump`, or numeric arguments like `24` or `65560`. Verify against legitimate application behavior that does not utilize memory dumping.

  - **Correlate with User Activity**: Identify the user account associated with the process. Cross-reference this with user login events (Event ID 4624) to establish if the execution aligns with normal behavior, such as maintenance tasks. Unauthorized executions, particularly from service accounts, raise suspicion.

  - **Check for File Artifacts**: Search for created or modified files in the system, particularly in temporary directories (e.g., `%TEMP%`). Indicators of successful dumping include .dmp files or other artifacts indicating the presence of dumped memory.

  - **Compare with Baseline Activity**: Review historical process and command line data to establish a baseline. Legitimate applications may also utilize similar command lines, but the context and frequency of usage can determine their legitimacy.

  - **Identify System Role and Criticality**: Determine the criticality of the affected system. High-risk systems (e.g., domain controllers, database servers) escalate the urgency of the investigation, as they hold higher value to adversaries.

  ### Prioritization

  This alert is of high severity due to the potential for significant impact on data confidentiality and integrity, especially on critical systems where sensitive information is stored. The likelihood of malicious abuse is elevated given the specific nature of the command line arguments associated with known memory dumping techniques. Additionally, such operations are often employed by advanced persistent threats (APTs) to extract data.

  ### Blind Spots and Assumptions

  The detection may not capture all variations of process memory dumping, especially if an adversary employs less common tools or obfuscates command line arguments. Ensure logging for process creation is adequately configured to cover all necessary details, especially in environments with restrictive logging settings. Legitimate software updates or debugging scenarios may inadvertently trigger this alert. A related detection rule focusing on other memory injection techniques (e.g., usage of `CreateRemoteThread` or direct memory access methods) could provide complementary coverage.

