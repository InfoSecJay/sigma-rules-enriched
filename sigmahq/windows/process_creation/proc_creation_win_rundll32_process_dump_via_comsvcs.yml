detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli_1:
    CommandLine|contains|all:
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - '#-'
    - '#+'
    - '#24'
    - '24 '
    - 'MiniDump'         # Matches MiniDump and MinidumpW
    - '#65560'         # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.  for e.g ordinal 24 can be also represented by 65560 (65536+24)
  selection_generic:
    CommandLine|contains|all:
    - '24'
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - ' #'
    - ',#'
    - ', #'
    - '"#'
  condition: (selection_img and 1 of selection_cli_*) or selection_generic
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of a memory dump process through the `comsvcs.dll` library via `rundll32.exe`. Attackers may utilize this technique to extract sensitive information from memory, including credentials and other sensitive application data, with the goal of credential theft or lateral movement. It aligns with the MITRE ATT&CK tactics of **Credential Access** (TA0006) and **Defense Evasion** (TA0005), specifically techniques **T1003.001** (Credential Dumping: LSASS Memory) and **T1036** (Masquerading).

  The primary telemetry source is Windows process creation logs, specifically analyzing Event ID 4688, which captures detailed command lines and associated processes. If malicious, this behavior significantly compromises system integrity, leading to unauthorized access and potential data exfiltration. Importantly, this detection does NOT confirm that sensitive data has been compromised; it only indicates attempted memory dumping.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Check for instances of `rundll32.exe` (Event ID 4688). Look for command lines containing `comsvcs`, `#-`, or `MiniDump`. Legitimate usage typically does not involve suspicious parameters such as `#` or `MiniDump`.

  - **Identify associated processes:** Use the Process Explorer or Sysinternals tools to correlate the `rundll32.exe` process with other potentially malicious parent processes. Malicious indicators might include processes initiated by suspicious executables or unusual user accounts.

  - **Examine process creation logs:** Inspect Security Event ID 4688 and verify the original file name is `RUNDLL32.EXE`. Correlate this with the timestamp of the alert to identify possible lateral movement or escalation patterns.

  - **Check for memory artifacts:** Validate if any `.dmp` files have been created on the filesystem during the time of the alert. Legitimate applications may create dump files, but their presence should be infrequent and should not coincide with suspicious command line activity.

  - **Look for persistence mechanisms:** Investigate the startup entries for unusual modifications that could suggest persistence setup by a threat actor using this technique, such as registry keys that execute memory dumps on boot.

  ---

  ### Prioritization

  The alert is of **high severity** due to the potential critical impact on sensitive systems that may store credentials or confidential data. The likelihood of malicious abuse is significant, as this technique is commonly utilized by adversaries to facilitate credential theft and lateral movement.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations, particularly if logging is improperly configured or if `rundll32.exe` is executed in a privileged context that bypasses standard logging mechanisms. Legitimate processes, such as debugging tools or certain administrative applications, may inadvertently trigger this alert. Companion detections such as monitoring for unexpected process parent-child relationships (related to `rundll32.exe`) or unusual network activity from systems executing these commands can enhance coverage and context.

