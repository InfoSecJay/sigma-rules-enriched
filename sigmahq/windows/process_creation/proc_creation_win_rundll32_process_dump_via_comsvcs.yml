logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  - CommandLine|contains: 'rundll32'
  selection_cli_1:
    CommandLine|contains|all:
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - '#-'
    - '#+'
    - '#24'
    - '24 '
    - 'MiniDump'         # Matches MiniDump and MinidumpW
    - '#65560'         # ordinal is 16 bit ordinal, so if you make the number large enough (don't fit in 16 bit space), then it normally wraps around.  for e.g ordinal 24 can be also represented by 65560 (65536+24)
  selection_generic:
    CommandLine|contains|all:
    - '24'
    - 'comsvcs'
    - 'full'
    CommandLine|contains:
    - ' #'
    - ',#'
    - ', #'
    - '"#'
  condition: (selection_img and 1 of selection_cli_*) or selection_generic
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a memory dump process using `comsvcs.dll` via `rundll32.exe`. This behavior is often associated with credential extraction attacks, where adversaries attempt to extract sensitive information from memory, which can include passwords or tokens. The relevant MITRE ATT&CK tactics and techniques are Credential Access (TA0006) and Credential Dumping (T1003.001).

  Primary telemetry sources include process creation logs on Windows systems, particularly focusing on Security Event ID 4688 and Sysmon Event ID 1. If this activity is malicious, it can lead to severe compromises, allowing threat actors to bypass authentication mechanisms. However, this detection does NOT confirm that sensitive data has been successfully extracted or accessed; it merely indicates the invocation of a memory dumping command.

  ### Investigation Steps

  - **Validate suspicious processes:** Check for any execution of `rundll32.exe` (Security Event ID 4688, Sysmon Event ID 1). Look for parent-child relationships, specifically if `rundll32.exe` is spawned from an unexpected or unusual parent process, indicating possible malicious intent.

  - **Examine command-line arguments:** Review the command line for `rundll32.exe` instances, especially those containing `comsvcs` and `MiniDump`. Look for unusual arguments like `full`, `24`, or any references to `#` or `65560`.

  - **Identify malicious indicators:** Focus on instances where `rundll32.exe` runs with `comsvcs.dll` and includes the terms `MiniDump`, `full`, or arguments indicative of malicious activity. Malicious indicators are guided by context, particularly where processes are executed on sensitive systems like Domain Controllers or servers handling sensitive data.

  - **Correlate with legitimate behavior:** Compare with known legitimate usage of `rundll32.exe` for administrative purposes, such as system troubleshooting or application debugging which typically do not involve the `comsvcs` DLL or unusual command line arguments.

  - **Investigate further machine context:** If detected on critical assets (e.g., domain controllers, financial databases), prioritize for immediate analysis. Gather logs that might indicate lateral movement or follow-up commands after a memory dump process.

  - **Look for exfiltration artifacts:** Validate the creation of any suspicious files. Investigate potential artifacts like .dmp files created in temporary or user profile directories which could indicate successful memory dumps.

  ### Prioritization

  This alert has a high priority since it targets the extraction of credentials and sensitive data, which can severely impact enterprise security. The likelihood of malicious exploitation is significant given that credential dumping techniques are commonly weaponized in attack scenarios.

  ### Blind Spots and Assumptions

  Detection may have limitations against highly customized or obfuscated command-line arguments that evade regex matching in the rule. Reliable detection requires logging to be correctly configured for process creation events on all critical assets. Legitimate memory diagnostic tools or administrative scripts may generate similar alerts, necessitating further context for validation. A companion detection to consider is monitoring for unusual task scheduler events, which may signify automated credential dumping attempts or further exploitation.

