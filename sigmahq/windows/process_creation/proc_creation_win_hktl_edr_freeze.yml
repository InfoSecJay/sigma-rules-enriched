note: |
  ### Technical Context

  This Sigma rule detects the execution of EDR-Freeze, a tool designed to suspend Endpoint Detection and Response (EDR) and antivirus processes by exploiting the MiniDumpWriteDump function via the WerFaultSecure.exe process. The behavior aligns with tactics used to impair the functionality of security solutions, making it easier for adversaries to conduct malicious activities undetected. This detection correlates with the MITRE ATT&CK framework under "Defense Evasion" (TA0005), specifically technique T1685, which focuses on the impairment of security tools.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture the execution of processes and their command-line arguments. Malicious use of EDR-Freeze can severely impact an environment by temporarily disabling vital security monitoring functions. Importantly, detection of this tool does not confirm a successful compromise or malicious intent on its own; it may also indicate a legitimate process invocation if not corroborated with additional context.

  ### Investigation Steps

  - **Identify the process execution:**
    Review Windows Security Event ID 4688 and Sysmon Event ID 1 logs for the presence of `EDR-Freeze.exe` and similar variants. Look for command-line arguments that may indicate malicious intent, e.g., arguments typically used in automated exploitation scripts.

  - **Extract process hashes:**
    Check logged process artifacts for known IMPHASHes associated with EDR-Freeze (e.g., `1195F7935954A2CD09157390C33F8E8C`). Utilize hash lookup tools to determine if these hashes are recognized as malicious or benign within threat intelligence platforms.

  - **Verify legitimate behavior:**
    Cross-reference the process creation events against documented legitimate uses of similar tools in your environment, ensuring that no approved operational activities are present that could explain their execution.

  - **Assess parent-child relationships:**
    Investigate the parent process associated with the EDR-Freeze execution by examining the fields in Sysmon Event ID 1, particularly focusing on whether a legitimate administrative tool or task scheduler initiated the process.

  - **Monitor for related artifacts:**
    Look for signs of process suspension or manipulation in other logs, such as unexpected behavior in Security Event IDs 4688 for suspicious parent-child relationships or Sysmon Event ID 10 (ProcessAccess) that might indicate tampering.

  ### Prioritization

  This alert is considered high severity due to the critical nature of EDR systems in enterprise environments. The likelihood of malicious abuse is elevated, given that EDR-Freeze specifically targets security measures, representing a clear intent to bypass detection. Such behavior is a recognized tactic among adversaries looking to conduct uninterrupted operations within compromised networks.

  ### Blind Spots and Assumptions

  Detection may be limited if EDR or antivirus solutions are temporarily disabled or if there is inadequate logging configured across endpoints. Legitimate activities, such as administrators using similar tools for valid operational tasks, could inadvertently trigger this alert. Additionally, companion detections, such as alerts for unusual process access behaviors (Sysmon Event ID 10), can strengthen the investigation’s contextual understanding and confirm malicious intent.

