note: |
  ### Technical Context
  This rule detects the execution of EDR-Freeze, a tool designed to bypass security solutions by exploiting the `MiniDumpWriteDump` function along with `WerFaultSecure.exe`. The primary objective of EDR-Freeze is to put endpoint detection and response (EDR) and antivirus processes into a dormant state, allowing attackers to operate undetected. This technique represents a significant shift in tactics as it employs user-mode functions rather than requiring kernel-level exploits or bring your own vulnerable driver (BYOVD) techniques.

  In the context of potential threats, adversaries leveraging EDR-Freeze are typically focused on evading detection during malicious activities, such as data exfiltration or lateral movement within a network. The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA1203) primarily categorized under the technique **Thread Execution - EDR and Antivirus Bypass** (T1562.001). These tactics highlight the intent to keep actions stealthy and undetected by traditional security measures.

  Primary data sources for this alert include Windows process creation logs, which provide detailed insights into the execution history of processes, including command line arguments, parent processes, and image hashes. This information is crucial for identifying the presence of EDR-Freeze and any potentially malicious activity associated with it.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation events for instances of EDR-Freeze or similar executables (e.g., `*EDR-Freeze*.exe`). Check for unusual parent processes or command-line arguments that could indicate suspicious behavior.

  - **Analyze Process Memory Dumps**: If available, analyze memory dumps around the time of EDR-Freeze execution to determine if security processes were suspended or manipulated. Look for signs of the `MiniDumpWriteDump` function being invoked on security monitoring tools.

  - **Check Import Hashes**: Validate the integrity of running processes by cross-referencing their import hashes against known indicators from the detection logic. Look for processes that contain any of the listed IMPHASH values associated with EDR-Freeze.

  - **Monitor Network Traffic**: Investigate any outbound connections or network traffic generated by the processes related to EDR-Freeze. Unusual or unauthorized connections during or after the execution of the tool can indicate compromise.

  ### Prioritization
  This alert is categorized as high severity due to the significant potential impact of EDR-Freeze on an organization’s security posture. The likelihood of attackers using this tool to evade detection makes it critical for timely response and investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the capabilities of the monitoring tools in use, especially if EDR or antivirus solutions are ineffective against the EDR-Freeze technique. The detection logic assumes that the logs containing process creation events are being captured correctly and that there are no gaps in monitoring policy implementation. Additionally, if users have permission to execute potentially harmful tools without restrictions, the chance of detecting malicious intent diminishes. Ensuring that logs for process creation and other relevant activities are enabled and properly configured is essential for this alert to function effectively.

