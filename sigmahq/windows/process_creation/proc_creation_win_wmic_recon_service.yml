detection:
  selection_img:
  - Image|endswith: '\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: 'service'
  filter_main_win32_methods:
    CommandLine|contains:
    - 'Change'
    - 'Create'
    - 'Delete'
    - 'PauseService'
    - 'ResumeService'
    - 'SetSecurityDescriptor'
    - 'StartService'
    - 'StopService'
    - 'UserControlService'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of WMIC (Windows Management Instrumentation Command-line) to query service information on remote systems, indicating potential reconnaissance activity by an adversary. The likely attacker objective is to identify running services, which can assist in further exploitation. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **WMIC** (T1047). The primary telemetry source includes Windows Process Creation events (Security Event ID 4688) and log types related to process execution.

  If the detected activity is malicious, it could lead to service manipulation or enumeration of services in preparation for additional attacks. However, this detection does NOT confirm that an actual exploitation attempt has occurred, as legitimate administrative actions may also trigger the alert.

  ### Investigation Steps

  - **Verify the Command Line Used**: Check if the `CommandLine` field contains 'service' (Security Event ID 4688). Legitimate use may involve administrative actions or system checks rather than unusual service queries.

  - **Identify Target Systems**: Review the `TargetUserId`, `TargetProcessId`, and `NewProcessName` fields to determine if the query was directed at critical systems or assets. Queries to sensitive servers may elevate the severity of the alert.

  - **Check Related Process Hierarchies**: Analyze the process tree for parent process relationships. If `WMIC.exe` was spawned by a suspicious or unexpected parent (like `powershell.exe`), this may indicate a malicious context.

  - **Correlate with Firewall and Network Logs**: Look for unusual outbound connections or RPC activity related to the queried services, particularly using logs from Windows Firewall or network monitoring tools.

  - **Quantify Recurrence of Activity**: Determine if similar WMIC service queries have been repetitively executed in a short timeframe, using the `EventID` timestamps to identify potential malicious reconnaissance patterns.

  - **Assess Recent Service Changes**: Review relevant service logs (like System Event logs, Event ID 7045) for changes in services that occurred around the same time as the WMIC execution. A pattern of service modifications following these queries could imply malicious intent.

  ### Prioritization

  This alert is of medium severity due to its potential impact on critical systems if it indicates unauthorized reconnaissance. The likelihood of malicious use is significant, as service enumeration commonly precedes further exploitation. This behavior is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Evasion techniques such as running WMIC from unusual locations or obfuscating command lines may bypass detection. This rule relies on the presence of adequate logging settings for process creation. Legitimate administrative tasks may inadvertently trigger the alert, especially in environments with active IT support. A related detection to consider is monitoring for unauthorized Service Control Manager (SCM) interactions, as they strengthen coverage for malicious service manipulation attempts.

