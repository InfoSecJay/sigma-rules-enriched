note: |
  ### Technical Context

  This Sigma rule detects the execution of WMIC (Windows Management Instrumentation Command-line) to query service status on remote machines. This behavior is often part of a reconnaissance phase, where an attacker aims to gather information about services running on a target system, potentially leading to further exploitation. The relevant MITRE ATT&CK tactic is **Execution**, with the technique identified as **T1047: Windows Management Instrumentation**.

  Primary telemetry sources include process creation logs from Windows, specifically **Security Event ID 4688** and **Sysmon Event ID 1**, capturing the command executed and its context. Should the activity be malicious, it could signify a precursor to lateral movement or privilege escalation within the environment. However, this detection alone does not confirm malicious intent; WMIC can be used by legitimate administrators for network management and service checks.

  ### Investigation Steps

  - **Check Process Creation Records**: Review **Security Event ID 4688** or **Sysmon Event ID 1**. Look for processes where `Image` ends with `WMIC.exe` and `CommandLine` contains “service”. Confirm if this activity originates from a known administrative account or a potentially compromised user.

  - **Validate Command Line Arguments**: Pay close attention to the `CommandLine` field from the logs. Flags such as `stopservice` or `startservice` indicate potential manipulations and warrant deeper investigation compared to benign service checks.

  - **Identify Legitimate User Activity**: Compare log entries to known operational hours and user roles. Legitimate service queries by IT personnel typically involve standard service names and occur during routine maintenance windows.

  - **Correlate with Recent User Activity**: Analyze user and system behavior surrounding the timing of the WMIC command. If alerts coincide with unusual access patterns from accounts not typically engaging in service queries, this could raise suspicion.

  - **Monitor Network Connections**: Evaluate any network activity generated by the machine executing WMIC, particularly outbound connections to external IPs. Malicious conduct might be evidenced by unusual communication patterns post-query.

  ### Prioritization

  The severity of this alert is moderate, primarily due to the potential for network reconnaissance and lateral movement. If targeting critical systems or sensitive data, such behavior could indicate preparatory steps for more impactful attacks. Such usage of WMIC is a well-documented tactic among adversaries, necessitating timely investigation.

  ### Blind Spots and Assumptions

  There exists a risk of evasion, as attackers could use legitimate administrative scripts or utilities to obscure their true intent. Required log sources include functioning **Sysmon** and **Windows Security auditing** configurations to capture relevant actions reliably. Routine administrative tasks may trigger this alert; thus, it is essential to contextualize findings based on user roles. Companion detections, such as alerts for unusual PowerShell commands or abnormal user login patterns, can provide enhanced visibility into suspicious activities.

