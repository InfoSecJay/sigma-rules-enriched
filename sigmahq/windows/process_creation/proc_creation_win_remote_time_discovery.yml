logsource:
  category: process_creation
  product: windows
detection:
  selection_time:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
    CommandLine|contains: 'time'
  selection_w32tm:
    Image|endswith: '\w32tm.exe'
    CommandLine|contains: 'tz'
  condition: 1 of selection_*
falsepositives:
- Legitimate use of the system utilities to discover system time for legitimate reason
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of specific commands that query a system's time settings, which can be indicative of reconnaissance activities by an attacker. Attackers often check a system's time for various reasons, such as ensuring their scheduled tasks execute at appropriate intervals or gaining knowledge about the system’s time zone, which could aid further exploitation. Understanding system time can inform an attacker about user patterns and assist in timing their malicious actions.

  The relevant MITRE ATT&CK tactics for this behavior include **Discovery** (TA0007), particularly focusing on the technique **System Time Discovery** (T1124). Such actions are commonly linked with threat scenarios in which an attacker aims to gather information about the target environment before launching more intrusive activities. The primary telemetry sources for detecting this activity are **process creation events**, particularly focused on command line invocations that employ system utilities like `net.exe`, `net1.exe`, or `w32tm.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events to identify instances of `net.exe`, `net1.exe`, or `w32tm.exe` being executed with command lines that include "time" or "tz". Pay attention to the user accounts and the time of these executions.
  - **Assess User Context**: Determine if the user executing the commands is legitimate or if the account has shown any suspicious behavior. Check previous activity for any unusual access patterns or privilege escalations.
  - **Cross-Reference with Network Activity**: Look at associated network logs to see if there were any follow-on connections to remote systems, particularly during the time these commands were executed.
  - **Examine System Event Logs**: Check system logs for any other event IDs related to time synchronization or system time changes around the same timestamp to identify any potential coordinated activity.

  ### Prioritization
  This alert has a low severity rating as it may frequently be triggered by legitimate administrative tasks; however, it should still be monitored closely, given that misuse of time querying could indicate preparatory stages for more sophisticated attack vectors.

  ### Blind Spots and Assumptions
  One potential gap in this detection coverage is that legitimate administrative users may execute similar commands without malicious intent, leading to false positives. The detection logic assumes that instances of querying system time are rare in your environment for non-administrative tasks and relies on capturing process creation logs. It is essential that process creation logging is adequately configured and that logs are retained long enough to allow for comprehensive investigations.

