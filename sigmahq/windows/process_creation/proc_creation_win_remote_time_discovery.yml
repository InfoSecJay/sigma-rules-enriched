detection:
  selection_time:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
    CommandLine|contains: 'time'
  selection_w32tm:
    Image|endswith: '\w32tm.exe'
    CommandLine|contains: 'tz'
  condition: 1 of selection_*
falsepositives:
- Legitimate use of the system utilities to discover system time for legitimate 
  reason
level: low
note: |
  ### Technical Context

  This rule detects the use of command-line utilities (`net.exe`, `net1.exe`, `w32tm.exe`) to query system time, which may be leveraged by attackers for reconnaissance tasks, such as determining the system's timezone and time settings prior to executing scheduled activities or payloads. The likely objective is to gather environmental details about the target system, potentially aiding in further exploitation or lateral movement. Relevant MITRE ATT&CK techniques include the "Time Zone" discovery (T1124) within the "Discovery" tactic.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688, which captures details about new process instances and their command lines. The potential security impact, if malicious, can lead to adversaries optimizing their attacks based on time-sensitive operations. Additionally, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may involve querying the system time.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 where the `Image` value ends with `net.exe`, `net1.exe`, or `w32tm.exe`. Analyze the `CommandLine` for instances that include "time" or "tz" to identify suspicious activities.

  - **Identify high-confidence malicious indicators:** Look for unusual command line arguments or activity around the execution of the time-querying commands. Malicious operations might showcase commands coupled with `schtasks` or involving automation tools.

  - **Verify legitimate versus suspicious usage:** For context, an administrative user querying the time might include commands like `w32tm /query /tz` run during regular business hours. Identify legitimate user accounts against timestamps of detected commands to assess risk.

  - **Analyze related process interactions:** Examine whether the detected commands are followed by executions of `schtasks.exe` or other task scheduling commands that suggest timing manipulation for further exploitation.

  - **Assess host role and criticality:** Determine the role of the affected system (e.g., domain controller, application server). Prioritize investigation on critical systems where time discrepancies could impact security protocols or scheduled tasks.

  - **Confirm absence of exfiltration artifacts:** Investigate for file creation or data exfiltration logs related to the time query command. Look for any unexpected file writes or outputs generated, which could indicate logging or reporting behaviors driven by exploitation.

  ### Prioritization

  This alert has a low severity in an enterprise context as it relates to a reconnaissance action that may not directly lead to an immediate threat. However, if observed on high-value assets or in conjunction with other suspicious activities, it warrants further examination.

  ### Blind Spots and Assumptions

  The detection may miss instances where attackers employ stealthier methods or scripted operations to query time without invoking the usual command-line utilities. Ensure that the Windows process creation logs are collected thoroughly with all command line arguments to reliably detect this behavior. Legitimate tools like scheduled systems management tasks or scripts can also trigger this alert, complicating triage. A related detection to consider would include monitoring for abnormal task scheduling activities (`schtasks.exe` usages) to provide better insights into potential automation following system time queries.

