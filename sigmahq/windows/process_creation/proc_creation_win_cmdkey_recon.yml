note: |
  ### Technical Context
  This rule detects the use of the `cmdkey.exe` utility to search for cached credentials on a Windows system. Cmdkey is commonly leveraged by attackers to extract stored credentials, which can then be used for unauthorized access or lateral movement within a network. The observed command-line activity, particularly any commands utilizing the `-l` parameter, indicates an attempt to list credentials, raising the alarm for potential credential harvesting or reconnaissance behavior.

  The threat scenario involves an adversary targeting stored credentials to facilitate privilege escalation or lateral movement within the environment. The attacker’s objective is likely to gather necessary credentials for accessing sensitive resources without raising suspicions. This tactic falls under the MITRE ATT&CK framework, specifically under the **Credential Access** tactic (TA0006) and the technique of **Credentials from Password Stores** (T1003.005).

  Primary data sources for detecting this behavior include process creation events that log the execution of applications, specifically focusing on the invocation of `cmdkey.exe` with particular command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for instances of `cmdkey.exe`, paying close attention to the command line used. Look for any entries where `-l` is specified which indicates an attempt to list credentials.

  - **Correlate with User Activity:** Investigate the user accounts invoking cmdkey.exe. Verify if the usage aligns with normal administrative tasks or if the accounts are flagged for suspicious activity previously.

  - **Analyze Network Connections:** If available, check for subsequent network connections or sessions initiated by the same user to identify any unauthorized access attempts following the cmdkey activity.

  - **Inspect Security Logs for Anomalies:** Review Windows security logs that might provide additional context around account logins or privilege escalations closely associated with the timeline of cmdkey.exe execution.

  ### Prioritization
  The alert is categorized as high severity due to the potential impact of compromised credentials and the likelihood of an attacker gaining significant access to sensitive resources in an enterprise environment. Credential access operations are fundamental steps for many sophisticated attack paths.

  ### Blind Spots and Assumptions
  There may be gaps in detection if cmdkey.exe is used in legitimate administrative scenarios that could create false positives. The detection logic assumes that malicious activity will trigger the specified command line, and it requires comprehensive process creation logs to function effectively. Environments that do not adequately log or monitor process creation may miss these critical indicators of compromise.

