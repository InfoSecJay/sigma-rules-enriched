note: |
  ### Technical Context

  This rule detects the invocation of `cmdkey.exe`, a Windows utility that manages stored user credentials. Specifically, it targets the usage of the command with the `-l` flag, which indicates that an attacker may be attempting to enumerate cached credentials for credential theft or lateral movement. This behavior is commonly associated with reconnaissance activities prior to launching further attacks, aligning with the MITRE ATT&CK technique for Credential Dumping (T1003.005).

  The primary telemetry source for this detection is process creation events, specifically focusing on the command line arguments passed to `cmdkey.exe`. If this behavior is initiated by a malicious actor, the security impact could include unauthorized access to sensitive systems or data, enabling further compromise within the environment. Note that this detection alone does not confirm malicious intent, as legitimate administrative users may also run this command for valid purposes.

  ### Investigation Steps

  - **Review process creation logs for `cmdkey.exe`:** Check for Security Event ID 4688 and Sysmon Event ID 1 on affected hosts. Focus on the command line arguments for usage of `-l`. Verify if this was executed by a known administrative user to distinguish legitimate actions from potential reconnaissance.

  - **Analyze the user context of the process execution:** Investigate the user account that executed the command. If it is a service or unknown account lacking a legitimate business need for credential management, this may indicate malicious intent.

  - **Correlate activity with recent logins or system changes:** Look at Event ID 4624 (successful logon) to see if this execution correlates with unusual login patterns or times, which may indicate an attacker is operating under a compromised account.

  - **Check for additional reconnaissance tools:** Ensure there are no other potentially malicious tools or activities detected on the same host, such as the use of PowerShell commands or additional credential access attempts, by reviewing Sysmon Event ID 10 and Event ID 5 logs.

  - **Document legitimate use cases of `cmdkey.exe`:** Acknowledge routine administrative tasks that may require running `cmdkey.exe`, such as network configuration or performance monitoring. If applicable, ensure proper documentation is available for any legitimate administrative use.

  - **Investigate for automated scripts:** Check for scripts or scheduled tasks that may be executing `cmdkey.exe` inappropriately, specifically logging to Task Scheduler Event ID 106. Automation scripts should ideally be reviewed for internal compliance with security policies.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on compromised credentials, which can enable access to critical systems. The likelihood of malicious abuse is significant, as using `cmdkey.exe` for credential enumeration is a common tactic among adversaries to laterally move within an environment.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of obfuscation or alteration of command line arguments, as attackers may employ tactics to disguise their activities. Ensure that process monitoring is enabled for all relevant assets to effectively capture this telemetry. Legitimate cases include system administrators performing credential management or troubleshooting, which may also trigger the alert. Companion detections, such as monitoring for unusual logon activities or the use of other credential dumpers, can enhance coverage and reinforce threat identification.

