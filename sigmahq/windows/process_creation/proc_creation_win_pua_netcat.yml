title: PUA - Netcat Suspicious Execution
id: e31033fc-33f0-4020-9a16-faf9b31cbf08
status: test
description: Detects execution of Netcat. Adversaries may use a non-application 
  layer protocol for communication between host and C2 server or among infected 
  hosts within a network
references:
- https://nmap.org/ncat/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1095/T1095.md
- https://www.revshells.com/
author: frack113, Florian Roth (Nextron Systems)
date: 2021-07-21
modified: 2023-02-08
tags:
- attack.command-and-control
- attack.t1095
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # can not use OriginalFileName as is empty
    Image|endswith:
    - '\nc.exe'
    - '\ncat.exe'
    - '\netcat.exe'
  selection_cmdline:
        # Typical command lines
    CommandLine|contains:
    - ' -lvp '
    - ' -lvnp'
    - ' -l -v -p '
    - ' -lv -p '
    - ' -l --proxy-type http '
            # - ' --exec cmd.exe ' # Not specific enough for netcat
    - ' -vnl --exec '
    - ' -vnl -e '
    - ' --lua-exec '
    - ' --sh-exec '
  condition: 1 of selection_*
falsepositives:
- Legitimate ncat use
level: high
note: |
  ### Technical Context

  This rule detects the execution of Netcat (ncat), a versatile tool often used for establishing communications between a compromised system and a command and control (C2) server. Attackers typically leverage Netcat due to its ability to use non-application layer protocols and evade traditional security measures, aiming to exfiltrate data or maintain persistent access. The relevant MITRE ATT&CK tactic is Command and Control (T1071) and the technique is Application Layer Protocol (T1095).

  Primary telemetry sources include Windows process creation logs, particularly focusing on the command line arguments and the executable names associated with Netcat. If executed maliciously, this behavior can indicate a severe security impact, such as the establishment of a backdoor or data exfiltration. Importantly, this detection alone does not confirm malicious intent; benign uses of Netcat may exist.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 to identify instances of Netcat (`nc.exe`, `ncat.exe`, `netcat.exe`) execution, noting the host where execution occurred and the user context.

  - **Analyze command line arguments**: Validate the command line syntax associated with detected executions, focusing on atypical flags such as `-lvp`, `-lvnp`, or `-e`. A legitimate use case may involve specific, less suspicious command lines without these options.

  - **Correlate with network activity**: Investigate associated outbound connections in Network logs (e.g., Windows Firewall, or network monitoring solutions) for unusual destinations corresponding with Netcat execution timelines, particularly focusing on suspicious external IPs or non-standard ports.

  - **Identify legitimate use cases**: Note instances where internal applications or authorized users may employ Netcat for legitimate purposes (e.g., network diagnostics). Compare this with baseline behavior by reviewing previously documented legitimate Netcat executions.

  - **Look for indicators of compromise (IoCs)**: Be alert to known bad IP addresses or domains in connection attempts from systems executing Netcat. Report any high-confidence matches to your incident response team.

  - **Assess file system artifacts**: Investigate for any created or modified temporary files or logs (`.tmp`, `.log` etc.) that may have originated from Netcat's execution, indicating potential file exfiltration or configuration use.

  ### Prioritization

  This alert is of high severity due to Netcat's capability for establishing unauthorized communication channels. Given its common use in post-exploitation scenarios, there is a significant likelihood that its presence indicates malicious activity, particularly in sensitive or critical systems.

  ### Blind Spots and Assumptions

  Detection may be limited by users running legitimate applications that utilize Netcat quietly or modify command line arguments to appear benign. Ensure that logging for process creation is enabled and comprehensive across all endpoints for reliable detection. Other legitimate network troubleshooting tools may also generate similar logs, necessitating careful contextual analysis. A related detection to strengthen coverage could involve monitoring for other common C2 protocols or command execution patterns indicative of payload deliveries.

