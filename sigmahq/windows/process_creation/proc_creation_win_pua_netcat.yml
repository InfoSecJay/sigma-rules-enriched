title: PUA - Netcat Suspicious Execution
id: e31033fc-33f0-4020-9a16-faf9b31cbf08
status: test
description: Detects execution of Netcat. Adversaries may use a non-application layer
  protocol for communication between host and C2 server or among infected hosts within
  a network
references:
- https://nmap.org/ncat/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1095/T1095.md
- https://www.revshells.com/
author: frack113, Florian Roth (Nextron Systems)
date: 2021-07-21
modified: 2023-02-08
tags:
- attack.command-and-control
- attack.t1095
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
        # can not use OriginalFileName as is empty
    Image|endswith:
    - '\nc.exe'
    - '\ncat.exe'
    - '\netcat.exe'
  selection_cmdline:
        # Typical command lines
    CommandLine|contains:
    - ' -lvp '
    - ' -lvnp'
    - ' -l -v -p '
    - ' -lv -p '
    - ' -l --proxy-type http '
            # - ' --exec cmd.exe ' # Not specific enough for netcat
    - ' -vnl --exec '
    - ' -vnl -e '
    - ' --lua-exec '
    - ' --sh-exec '
  condition: 1 of selection_*
falsepositives:
- Legitimate ncat use
level: high
note: |
  ### Technical Context
  This detection rule is focused on identifying the execution of **Netcat**, a versatile networking utility often exploited by malicious actors to establish command and control (C2) communication channels. Threat actors may utilize Netcat to bypass conventional application layer protocols, effectively communicating between compromised hosts or directly with a C2 server to exfiltrate data, execute commands, or manage malware operations. The primary objective for adversaries running Netcat is to create a persistent and stealthy communication link that avoids detection by standard security mechanisms.

  The relevant MITRE ATT&CK tactics include **Command and Control** (TA0011), specifically the technique **Non-Application Layer Protocol** (T1095). This technique involves utilizing non-standard methods of communication, which are less likely to be monitored or registered by traditional security tools. Primary data sources to consider for this detection include **process creation events**, particularly those that capture command-line executions, as these provide insight into what processes are being initiated and any unusual flags or parameters used.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for instances of `nc.exe`, `ncat.exe`, or `netcat.exe` with unusual or suspicious command-line arguments, such as those indicating a listening mode or execution parameters that suggest non-standard usage.

  - **Analyze Network Traffic**: Investigate any associated network traffic originating from hosts where Netcat was executed. Look for outbound connections on unusual ports or using non-standard protocols, which may indicate potential C2 communication attempts.

  - **Correlate with User Activity**: Assess the user accounts associated with the execution of Netcat to understand the context of its use. Check for unusual logins or activities around the time of execution, especially from service accounts or non-administrative users.

  - **Check for Persistence Mechanisms**: Look for signs of persistence related to Netcat, such as scheduled tasks, startup items, or registry entries that could indicate that it is set to run automatically, which is frequently a tactic employed by adversaries to maintain access to systems.

  ### Prioritization
  This alert is marked as high severity due to the potential impact of an attacker gaining control over a host through Netcat. Given its capabilities for unauthorized data access and direct command execution, any detection of its use warrants immediate investigation to mitigate risks of further compromise.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, as legitimate administrative usage of Netcat for network troubleshooting or testing may lead to false positives. The detection logic assumes that the observed command-line parameters are indicative of malicious use, which may not always be the case. Successful detection relies on comprehensive process creation logs being enabled and accessible; if those logs are insufficient or improperly configured, the alert may fail to trigger during actual malicious activity.

