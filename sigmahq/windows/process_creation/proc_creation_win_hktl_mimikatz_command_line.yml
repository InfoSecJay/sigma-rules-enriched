logsource:
  category: process_creation
  product: windows
detection:
  selection_tools_name:
    CommandLine|contains:
    - 'DumpCreds'
    - 'mimikatz'
  selection_function_names:   # To cover functions from modules that are not in module_names
    CommandLine|contains:
    - '::aadcookie'         # misc module
    - '::detours'         # misc module
    - '::memssp'         # misc module
    - '::mflt'         # misc module
    - '::ncroutemon'         # misc module
    - '::ngcsign'         # misc module
    - '::printnightmare'         # misc module
    - '::skeleton'         # misc module
    - '::preshutdown'          # service module
    - '::mstsc'          # ts module
    - '::multirdp'          # ts module
  selection_module_names:
    CommandLine|contains:
    - 'rpc::'
    - 'token::'
    - 'crypto::'
    - 'dpapi::'
    - 'sekurlsa::'
    - 'kerberos::'
    - 'lsadump::'
    - 'privilege::'
    - 'process::'
    - 'vault::'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of Mimikatz, a well-known credential dumping tool, by identifying specific command-line arguments and function names commonly associated with its use. The likely attacker objective is to harvest user credentials, which can subsequently be used for lateral movement or privilege escalation within a network. Relevant MITRE ATT&CK tactics include Credential Access (TA0006) and techniques such as Credential Dumping (T1003.001), LSASS Memory Dumping (T1003.002), and more.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on the command line arguments of processes. If malicious, this behavior can lead to significant security impacts, including unauthorized access to sensitive systems and data breaches. Importantly, the detection of Mimikatz execution does NOT confirm that credentials have been successfully dumped or used for further exploitation on its own.

  ### Investigation Steps

  - **Review the process creation logs:** Examine security event ID 4688 to identify the command line of the process execution. Look for specific terms such as 'DumpCreds,' 'mimikatz,' or function names like 'sekurlsa::' which are associated with Mimikatz.

  - **Validate user context:** Check the user account that executed the suspicious process by cross-referencing Event ID 4672 for special privileges. Legitimate admin actions may include user credential access under unusual circumstances.

  - **Investigate parent process:** Inspect the parent process ID in the process creation logs to determine its origin. Typically, Mimikatz is executed from a command line interface or PowerShell. Legitimate activity may stem from trusted administrative tools rather than unknown or compromised binaries.

  - **Identify high-confidence malicious indicators:** Look for lateral movement or RDP connection attempts following Mimikatz execution via Windows Event ID 4624 (logon). Especially focus on unusual login times or from unrecognized machines.

  - **Correlate with other telemetry:** Review the memory dump artifacts by checking Windows Event ID 2004 (Process Creation) in conjunction with Sysmon Event ID 10 for detailed execution paths, confirming any unauthorized DLL loading that points to malicious actions.

  - **Assess asset risk:** Consider the criticality of the system where Mimikatz was executed. Servers with sensitive data (e.g., domain controllers) should be prioritized for investigation to mitigate potential widespread impacts.

  ### Prioritization

  This alert is classified as high severity due to the potential for significant impact on the organization’s security posture. Mimikatz is widely weaponized and often indicates a serious compromise, especially if executed on high-value target systems like domain controllers or servers that manage credentials.

  ### Blind Spots and Assumptions

  Detection may miss Mimikatz executions where obfuscation techniques are applied, such as renaming the executable or using custom-built binaries. Reliable detection requires thorough configuration of Windows security logs and Sysmon for process monitoring. Legitimate activities that could trigger this alert may include authorized penetration testing or administrative tasks involving credential management tools. A companion detection rule for tracking anomalous logon attempts can strengthen coverage and provide context for possible credential abuse following the execution alert.

