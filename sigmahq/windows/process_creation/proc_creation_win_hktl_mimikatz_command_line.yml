logsource:
  category: process_creation
  product: windows
detection:
  selection_tools_name:
    CommandLine|contains:
    - 'DumpCreds'
    - 'mimikatz'
  selection_function_names:   # To cover functions from modules that are not in module_names
    CommandLine|contains:
    - '::aadcookie'         # misc module
    - '::detours'         # misc module
    - '::memssp'         # misc module
    - '::mflt'         # misc module
    - '::ncroutemon'         # misc module
    - '::ngcsign'         # misc module
    - '::printnightmare'         # misc module
    - '::skeleton'         # misc module
    - '::preshutdown'          # service module
    - '::mstsc'          # ts module
    - '::multirdp'          # ts module
  selection_module_names:
    CommandLine|contains:
    - 'rpc::'
    - 'token::'
    - 'crypto::'
    - 'dpapi::'
    - 'sekurlsa::'
    - 'kerberos::'
    - 'lsadump::'
    - 'privilege::'
    - 'process::'
    - 'vault::'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential executions of Mimikatz, a well-known credential dumping tool used to extract sensitive authentication credentials from local memory or system processes. The rule focuses on detecting specific command line arguments and module functions commonly associated with Mimikatz usage, such as `DumpCreds` and various module names like `sekurlsa::` and `lsadump::`. The presence of these commands typically indicates an attacker attempting to acquire credentials to further compromise a network or escalate privileges.

  In a typical threat scenario, an attacker may gain initial access to a system via phishing or exploitation of vulnerabilities and then deploy Mimikatz to harvest credentials for lateral movement or privilege escalation. The objective is often to capture Active Directory credentials to access critical systems or sensitive resources without detection. This behavior maps to several MITRE ATT&CK techniques, including **T1003 - Credential Dumping**, with specific sub-techniques like **T1003.001 - LSASS Memory** and **T1003.004 - Credential Dumping from Password Managers**.

  Primary data sources for this detection include process creation logs, which capture command line arguments used during process execution, as well as Windows system event logs that may shed light on unusual or unauthorized access to system memory.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation logs for instances of Mimikatz execution. Look specifically for command lines containing `DumpCreds`, `mimikatz`, or relevant module names identified in the detection logic.
  - **Analyze User Context:** Determine the user account that executed the command and assess whether this user has legitimate privileges to run such tools. Identify any deviations from normal behavior for that account.
  - **Correlate with Other Logs:** Check event logs for other suspicious activities around the same time, such as failed logins, privilege escalation attempts, or anomalous access to sensitive files and resources.
  - **Check for Lateral Movement:** Investigate any subsequent network activity from the source system where Mimikatz was detected to evaluate if there were further attempts to access other systems in the environment.

  ### Prioritization
  This alert is classified as high severity due to the critical nature of credential dumping operations, which can lead to significant breaches of information and unauthorized access to sensitive systems, representing a high likelihood of imminent threat in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logging is not enabled or if there are insufficient permissions to view command line arguments. The logic assumes that Mimikatz will be executed with recognizable command line arguments and does not account for modified or obfuscated commands, which skilled attackers may use to evade detection. Additionally, the rule may not detect variants of credential dumping attacks that utilize different tools or methods not covered by this detection logic. For optimal performance, ensure that process creation logging is comprehensive and available for analysis.

