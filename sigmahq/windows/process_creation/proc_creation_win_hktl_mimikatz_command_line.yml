note: |
  ### Technical Context

  This Sigma rule detects the execution of Mimikatz, a popular credential dumping tool frequently used by attackers to extract sensitive authentication data from memory. The primary objective of using Mimikatz is to gain unauthorized access to user credentials, which can facilitate lateral movement within a compromised network. The relevant MITRE ATT&CK tactics and techniques include Credential Access (T1003) with sub-techniques like Credential Dumping (T1003.001, T1003.002, T1003.004, T1003.005, T1003.006). The primary telemetry source is Windows process creation logs, particularly those capturing command line invocations (Event ID 4688 and Sysmon Event ID 1). If malicious, the attack could lead to unauthorized access, data exfiltration, and further compromise of the organization's security. However, this detection does NOT confirm successful credential theft; it only indicates that Mimikatz was executed.

  ### Investigation Steps

  - **Examine the command line execution:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for processes containing 'mimikatz' or known Mimikatz command-line arguments (e.g., 'DumpCreds', 'sekurlsa::'). Malicious indicators include exact matches with these terms.

  - **Correlate with parent process information:** Investigate the parent process by checking the ParentProcessId field in the process creation logs. A legitimate parent process such as "powershell.exe" or "cmd.exe" may indicate benign usage, while unusual or unexpected parents like "svchost.exe" or "services.exe" could signal malicious intent.

  - **Identify abnormal user behavior:** Check for the users executing Mimikatz. Legitimate administrative users may run Mimikatz during authorized penetration tests, while non-privileged or anomalous accounts running the tool are more likely targets of misused credentials.

  - **Review recent user logon activity:** Utilize Windows Security Event ID 4624 to verify recent logon events associated with the user account running Mimikatz. An account showing multiple logons from various hosts within a short timeframe may indicate credential theft activity.

  - **Search for file creation or modification artifacts:** Look for the creation/modification of artifacts associated with Mimikatz, such as logs or dumped credentials typically stored in locations like C:\Users\<User>\AppData\Local\Temp\. Gathering data about unusual file timestamps or patterns can suggest malicious actions.

  ### Prioritization

  This alert should be treated with high priority due to the significant security impact of credential theft. If Mimikatz is indeed executed, it exposes the potential for wide-ranging compromise within the network. Given the prevalence of this behavior being weaponized in real attacks, analysts should act quickly upon confirmation.

  ### Blind Spots and Assumptions

  This detection may be affected by evasion techniques, such as attackers running Mimikatz under obfuscated command-line parameters or using legitimate tools to perform similar tasks. Effective detection also relies on the proper configuration of security auditing on endpoint devices to capture required log sources. Additionally, legitimate administrative activities, such as authorized security reviews or testing, may trigger this alert, necessitating thorough context checks. A companion detection might involve monitoring for unusual PowerShell activity (TTPs like T1059) to provide better coverage against credential dumping techniques.

