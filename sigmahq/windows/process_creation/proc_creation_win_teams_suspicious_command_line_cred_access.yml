title: Potentially Suspicious Command Targeting Teams Sensitive Files
id: d2eb17db-1d39-41dc-b57f-301f6512fa75
status: test
description: |
  Detects a commandline containing references to the Microsoft Teams database or cookies files from a process other than Teams.
  The database might contain authentication tokens and other sensitive information about the logged in accounts.
references:
- https://www.bleepingcomputer.com/news/security/microsoft-teams-stores-auth-tokens-as-cleartext-in-windows-linux-macs/
- https://www.vectra.ai/blogpost/undermining-microsoft-teams-security-by-mining-tokens
author: '@SerkinValery'
date: 2022-09-16
modified: 2023-12-18
tags:
- attack.credential-access
- attack.t1528
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - '\Microsoft\Teams\Cookies'
    - '\Microsoft\Teams\Local Storage\leveldb'
  filter_main_legit_locations:
    Image|endswith: '\Microsoft\Teams\current\Teams.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious command-line activity targeting Microsoft Teams sensitive files, specifically database files and cookies, from processes that do not originate from the legitimate Microsoft Teams executable. Attackers may exploit these files to obtain authentication tokens and other sensitive user information, potentially leading to unauthorized access to Teams and associated services. The objective of such an attack could be to harvest credentials or impersonate legitimate users within an organization.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and technique **Collection of Credentials from Cloud Applications** (T1528). By gaining access to these sensitive files, an attacker can leverage the extracted data for lateral movement or access to sensitive communications and documents stored within Microsoft Teams. Primary data sources that will provide evidence for this detection include process creation events from Windows, which capture the command used to launch applications and the associated command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the process creation logs for any commands that reference Microsoft Teams database or cookie files, noting the parent process and user context to determine if the activity is legitimately expected.
  - **Analyze Application Whitelisting Rules:** Check application whitelisting or allowed application configurations to confirm if the detected command-line is initiated from a non-legitimate process, providing context for possible malicious intent.
  - **Correlate with User Activity:** Cross-reference the timestamps and user accounts in the logs against usual user patterns to identify any anomalies or unauthorized access attempts that could indicate malicious behavior.
  - **Check for Additional Artifacts:** Look for any other signs of suspicious activity related to the same user, such as unusual network connections to external domains or elevated privilege usage, that might indicate further compromise.

  ### Prioritization
  This alert is classified with medium severity due to the potential for sensitive credential exposure and unauthorized access to enterprise communications. The likelihood of exploitation is heightened given the widespread use of Microsoft Teams and the critical nature of the information exchanged within the platform.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging settings for process creation are not properly configured or if certain environments do not log command-line details. The detection logic assumes that any command not initiated by the legitimate Teams executable is potentially malicious, which may not account for benign scripts or applications. Furthermore, this rule requires sufficient logging from Windows process creation events to function effectively, particularly the inclusion of command-line arguments.

