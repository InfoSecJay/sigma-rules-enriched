title: Potentially Suspicious Command Targeting Teams Sensitive Files
id: d2eb17db-1d39-41dc-b57f-301f6512fa75
status: test
description: |
  Detects a commandline containing references to the Microsoft Teams database or cookies files from a process other than Teams.
  The database might contain authentication tokens and other sensitive information about the logged in accounts.
references:
- https://www.bleepingcomputer.com/news/security/microsoft-teams-stores-auth-tokens-as-cleartext-in-windows-linux-macs/
- https://www.vectra.ai/blogpost/undermining-microsoft-teams-security-by-mining-tokens
author: '@SerkinValery'
date: 2022-09-16
modified: 2023-12-18
tags:
- attack.credential-access
- attack.t1528
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - '\Microsoft\Teams\Cookies'
    - '\Microsoft\Teams\Local Storage\leveldb'
  filter_main_legit_locations:
    Image|endswith: '\Microsoft\Teams\current\Teams.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects command-line executions that reference Microsoft Teams database or cookie files, specifically those initiated by processes not associated with Teams itself. The behavior suggests potential exploitation of sensitive data such as authentication tokens and cookies, with the likely attacker objective being unauthorized access to legitimate user accounts and information.

  This detection aligns with MITRE ATT&CK Tactic: Credential Access (TA0006) and Technique: Credentials from Password Stores (T1528). Primary telemetry sources include Windows Process Creation logs, specifically related to process execution, with a focus on fields capturing command line parameters. If malicious, this could lead to account compromise and data breaches. Importantly, detection by itself does not confirm malicious intent; further context and investigation are necessary.

  ### Investigation Steps

  - **Review command-line arguments:** Examine Security Event ID 4688 to identify any process invocations with command lines containing '\Microsoft\Teams\Cookies' or '\Microsoft\Teams\Local Storage\leveldb' from unexpected sources.

  - **Validate process origins:** Confirm via Windows Event ID 4688 that the invoking process is not 'Teams.exe' or a known legitimate application. If found from other executables, further investigation is necessary.

  - **Identify legitimate access patterns:** Check logs for processes accessing Teams files from user accounts typically authorized to do so, such as office productivity tools (like Word or Excel). Note the expected behavior and user roles.

  - **Correlate user activity:** Use Windows Security logs to investigate the user accounts associated with the detected command. Are there anomalies in user behavior during the time of access?

  - **Check for suspicious modifications:** Look for any changes in the Microsoft Teams directories, especially in cookies or local storage using file system monitoring logs. Focus on new or unexpected file creations that may indicate malicious activity.

  - **Determine access scope:** Establish whether the affected system has sensitive information or elevated privileges associated with its user, influencing the risk if compromised.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of accessing authentication tokens and sensitive information. The likelihood of exploitation is significant, as unauthorized access to Teams data can lead to serious breaches, aligning with emerging attacker methodologies to mine credential information.

  ### Blind Spots and Assumptions

  Detection may be limited by user settings or configurations that legitimize access to Teams data, creating false positives. It assumes the presence of appropriate logging for process creation; without these, detection may fail. Legitimate activities such as troubleshooting or data extraction by IT personnel can trigger this alert. A related detection to consider is monitoring for unusual process behavior using Sysmon Event ID 1 to enhance visibility into process integrity and anomaly detection.

