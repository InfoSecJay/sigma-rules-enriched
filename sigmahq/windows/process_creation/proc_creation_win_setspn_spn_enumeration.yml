  product: windows
detection:
  selection_pe:
  - Image|endswith: '\setspn.exe'
  - OriginalFileName: 'setspn.exe'
  - Description|contains|all:
    - 'Query or reset the computer'
    - 'SPN attribute'
  selection_cli:
    CommandLine|contains:
    - ' -q '
    - ' /q '
  condition: all of selection_*
falsepositives:
- Administration activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential enumeration of Service Principal Names (SPNs) using the `setspn.exe` tool on Windows systems. SPN enumeration is often exploited by attackers to gather information about service accounts and their associated SPNs, which can facilitate Kerberoasting attacks. In such scenarios, attackers aim to collect SPNs to request service tickets (TGS), which may be subjected to offline brute-force attacks to extract the associated account credentials.

  The relevant MITRE ATT&CK tactics and techniques for this activity include **Credential Access (TA0006)**, specifically focusing on **Kerberoasting (T1558.003)**. This technique is particularly critical in environments with Active Directory where administrative privileges are sought after through impersonating service accounts. Analysts should be aware of this threat, as successful exploitation could lead to significant credential theft.

  Primary data sources to monitor for this behavior include **process creation events** that capture details about the execution of `setspn.exe`, as well as **command line arguments** that indicate a query operation. These logs are essential for understanding the context in which `setspn.exe` is being used and can help pinpoint suspicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for the execution of `setspn.exe`, focusing on the time of invocation, user context, and parent processes to identify any anomalous behavior.
  - **Analyze Command Line Arguments**: Look for instances where `setspn.exe` is executed with `-q` or `/q` options, as these flags indicate a query of SPNs, providing insight into possible enumeration attempts.
  - **Check Event Viewer Logs**: Search the Windows Event Viewer for relevant security events that coincide with the use of `setspn.exe`. Pay special attention to any service accounts being queried and correlate this with known legitimate administrative activities.
  - **Investigate User Account Activity**: Verify the legitimacy of the user account performing the SPN enumeration. Investigate recent access patterns, especially if the account is not typically used for administrative tasks or is leveraging elevated privileges.

  ### Prioritization
  Alerts generated by this rule should be prioritized as medium severity due to the potential for credential compromise through SPN enumeration, which can enable further privilege escalation and lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection may miss SPN enumeration performed via other tools or methods outside of `setspn.exe`. The detection logic assumes that logging is appropriately configured to capture process creation and command line details; without this data, alerts may be generated without sufficient context. Additionally, legitimate administrative activities may lead to false positives, so context and user behavior should be carefully assessed.

