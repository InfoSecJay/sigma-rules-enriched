detection:
  selection_pe:
  - Image|endswith: '\setspn.exe'
  - OriginalFileName: 'setspn.exe'
  - Description|contains|all:
    - 'Query or reset the computer'
    - 'SPN attribute'
  selection_cli:
    CommandLine|contains:
    - ' -q '
    - ' /q '
  condition: all of selection_*
falsepositives:
- Administration activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `setspn.exe` with parameters that indicate potential Service Principal Name (SPN) enumeration. The behavior typically indicates an attacker attempting to gather information about SPNs within an Active Directory environment, which is commonly leveraged during a Kerberoasting attack to exploit service accounts after obtaining the necessary SPN details. This aligns with the MITRE ATT&CK tactic of Credential Access and the technique T1558.003 (Kerberoasting).

  The primary telemetry source is Windows process creation logs, specifically focusing on events from Sysmon (Event ID 1) or Security Event ID 4688, documenting instances of `setspn.exe` execution. If malicious, this activity can lead to unauthorized access to service account credentials, significantly impacting the organization's security posture. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Verify process creation logs:** Review Sysmon Event ID 1 and Security Event ID 4688 to validate that `setspn.exe` was executed, including checking the `CommandLine` field for `-q` or `/q`. Look for anomalous execution time or user accounts not typically associated with administrative tasks.

  - **Analyze user context:** Determine if the user executing the command is an administrator or a typical user. Legitimate users may run `setspn.exe` for maintenance; consider the context of the activity and user account behavior.

  - **Check for other SPN-related queries:** Look in the event logs for additional queries against SPNs, such as Event ID 4672 (Special privileges assigned to new logon) and Event ID 4624 (Successful logon), which can indicate ongoing reconnaissance activity.

  - **Correlate with known adversary behaviors:** Identify if the command execution aligns with known post-exploitation techniques by checking for suspicious account usage or coinciding failed logon attempts that might suggest credential access attempts following SPN enumeration.

  - **Preserve potential evidence:** Validate that `setspn.exe` artifact creation is captured, ensuring that any files or logs generated during this event can be reviewed for signs of improper access or changes.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on Active Directory environments and the high likelihood of exploitation through Kerberoasting techniques. Given that SPN enumeration is a common precursor to credential theft, this behavior should be treated with urgency.

  ### Blind Spots and Assumptions

  Detection may be limited in environments with insufficient logging configuration or where Process Creation logging is disabled. Legitimate administrative activities, such as server maintenance or configuration changes, may trigger this alert. A companion detection to consider is monitoring for unusual Kerberos service ticket requests (TGT requests), which can confirm a further step in the Kerberoasting attack process.

