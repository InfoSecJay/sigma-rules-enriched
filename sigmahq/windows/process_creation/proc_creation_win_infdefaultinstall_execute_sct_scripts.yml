  ### Technical Context

  This Sigma rule detects the execution of the `InfDefaultInstall.exe` process with command-line arguments containing a `.inf` file. This behavior is often indicative of an attacker leveraging Windows driver installation mechanisms to execute malicious scripts or payloads via the `scrobj.dll` object. The likely attacker objective here is to execute malicious code with elevated privileges while bypassing standard security controls. This technique fits within the MITRE ATT&CK framework under the tactic of Defense Evasion, specifically Technique T1218 (Signed Binary Proxy Execution).

  The primary telemetry source for this detection is Windows process creation logs, particularly Security Event ID 4688 (Process Creation). If this activity is deemed malicious, it can lead to system compromise, potential data exfiltration, or further lateral movement within the network. Notably, this detection does NOT confirm that the behavior observed is inherently malicious; further contextual investigation is necessary.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 for entries corresponding to `InfDefaultInstall.exe` execution along with any associated command-line arguments. Look for unusual or unexpected `.inf` file references, especially those not originating from trusted sources.

  - **Analyze command-line parameters:** Check the CommandLine field of log entries for `InfDefaultInstall.exe`. Malicious executions often exhibit suspicious patterns such as scripts or executables that rely on `scrobj.dll`, unlike legitimate installations that should have known and authorized drivers.

  - **Identify the parent process:** Investigate the ParentProcessId field in the process creation logs to determine the initiating process. Legitimate executions are typically spawned by system services or trusted applications. Be wary of unusual parent-child relationships.

  - **Check for related activity:** If `InfDefaultInstall.exe` execution correlates with other process behaviors, such as unusual network connections or file creation actions (e.g., Event ID 4656 for file creation attempts in sensitive directories), flag these for further scrutiny.

  - **Look for file system artifacts:** Confirm any new files created during the execution of `InfDefaultInstall.exe` using a tool like Sysmon. Create a specific watch for file creation events (e.g., Event ID Creation for directories that may contain scripts or executables).

  - **Review recent changes and system state:** Analyze system configurations or recent updates to determine if legitimate software installations occurred. This may provide context for normal versus suspicious activity related to driver installations.

  ### Prioritization

  This alert should be categorized as medium severity within an enterprise context. The affected system's criticality influences the potential impact of an attack, while the unique method of execution suggests a higher likelihood of malicious intent given how it mimics legitimate behavior. Such techniques are increasingly weaponized as they exploit common system functionalities.

  ### Blind Spots and Assumptions

  Detection of `InfDefaultInstall.exe` may be circumvented by attackers using obfuscated command-line parameters or invoking through pre-existing legitimate parent processes, making investigation challenging. Dependable detection requires comprehensive logging from process creation mechanisms, as well as validation of related event logs. Additionally, legitimate activities such as driver updates or software installations might trigger this alert, necessitating thorough context review. A companion detection to strengthen coverage could include monitoring for unusual `.inf` file modifications in directories like `C:\Windows\inf\`, which can indicate attempts at manipulating driver installations.

