note: |
  ### Technical Context

  This Sigma rule detects the execution of the `InfDefaultInstall.exe`, which is commonly used to run scripts via the `scrobj.dll` library, initiated from command lines containing `.inf` files. The likely objective of an attacker is to execute malicious scripts or payloads through legitimate methods, thus bypassing traditional security controls. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Executing Code from a Script (T1218).

  Primary telemetry sources include Windows Process Creation logs with notable Event ID 4688, which captures the creation of processes. The security impact can be significant if this execution is associated with malware delivery, as it may facilitate persistent access or lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own, as `InfDefaultInstall.exe` can also be used in legitimate software installations and updates.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 for `InfDefaultInstall.exe`. Look for unusual parent process IDs that deviate from known patterns, indicating possible misuse.

  - **Analyze command line usage:** Extract the full command line arguments associated with the execution of `InfDefaultInstall.exe`. Malicious executions will uniquely contain patterns related to specific `.inf` files, while benign usage typically involves a straightforward installation process.

  - **Investigate related DLL activity:** Examine Windows Event ID 4663 or Sysmon Event ID 10 (Image Load) for any unusual loading of `scrobj.dll`. Legitimate loads may correlate with standard operating system configurations, while suspicious ones may arise in the context of unauthorized applications.

  - **Identify network activity:** Check for outbound network connections that may be associated with `InfDefaultInstall.exe` using firewall logs or endpoint detection, especially looking for unusual destinations or ports. Malicious indicators include unexpected connections during the script execution timeframe.

  - **Review your asset’s role:** If the affected host is classified as a critical asset (e.g., Domain Controller or sensitive server), prioritize your analysis due to the heightened risk profile associated with compromises in these environments.

  ### Prioritization

  Given the potential impact of executing scripts through `InfDefaultInstall.exe` on critical systems, the alert should be considered medium to high severity. The likelihood of malicious abuse is present, particularly given that this activity can be weaponized for stealthy malware execution and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited if the relevant Windows logs are not enabled or properly configured, particularly Event ID 4688. Attackers may also employ obfuscation techniques such as renaming `.inf` files or changing script contents to evade detection. Legitimate activities include standard driver installations or software updates that also trigger the same events. A related detection to strengthen coverage could focus on unauthorized execution of other script executors, such as `wscript.exe` or `powershell.exe`.

