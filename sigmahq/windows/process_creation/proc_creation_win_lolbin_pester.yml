note: |
  ### Technical Context

  This Sigma rule detects code execution attributed to `Pester.bat`, a script commonly used in PowerShell testing, specifically when spawned from a PowerShell parent process. The likely objective of the attacker could include running unauthorized scripts or executing additional payloads under the cover of legitimate testing activity, potentially to achieve lateral movement or persistence. The relevant MITRE ATT&CK tactics and techniques are **Execution (TA0002)** and **Scripting (T1059.001)**.

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 from the Security log. If malicious, the security impact could include unauthorized code execution leading to compromised systems and data exfiltration. Importantly, this detection alone does not confirm malicious intent; `Pester` can be used legitimately for PowerShell script testing.

  ### Investigation Steps

  - **Check process creation logs for parent-child relationships:** Review logs for Event ID 4688, filtering for processes with `ParentImage` that ends with `powershell.exe` or `pwsh.exe`, and check `ParentCommandLine` for references to `Pester`. Malicious activity would show unusual or unexpected subsequent child processes.

  - **Validate command-line arguments for evidence of malicious execution:** Search logs for `ParentCommandLine` containing `Invoke-Pester -EnableExit` or `Get-Help "` to find signs of misuse. Legitimate uses often end with expected test results or helper outputs, while anomalies might indicate exploitation.

  - **Review execution context and asset criticality:** Determine the host role of the system involved. Check if it's a development or production server; unexpected Pester usage on production systems is a higher risk indicator.

  - **Identify high-confidence malicious indicators:** Look for subsequent execution patterns that are not typical of testing scenarios, such as launching unusual processes or accessing sensitive data outside of the expected context post-Pester execution.

  - **Confirm legitimate behavior by checking usage patterns:** Investigate historical logs to analyze whether `Pester` has been used legitimately on the affected host, looking for a pattern of scheduled testing or in line with software development lifecycle activities.

  ### Prioritization

  The alert is of medium severity due to the potential impact on critical systems if exploited. The likelihood of malicious use is moderate as attackers often weaponize scripting tools like PowerShell. However, the prevalence of legitimate Pester usage mitigates urgency, demanding careful review to differentiate intent.

  ### Blind Spots and Assumptions

  Detection efficacy is limited if process creation logging is not enabled or if modified command lines are obfuscated. Legitimate activities, such as authorized testing scripts or maintenance tasks, may trigger this alert. A related detection to consider is alerting on abnormal PowerShell execution patterns (e.g., execution frequency or command types), which would strengthen overall monitoring of scripting-related anomalies.

