note: |
  ### Technical Context

  This Sigma rule detects attempts to bypass the Antimalware Scan Interface (AMSI) by searching for the method `AmsiUtils.amsiInitFailed` and specific reflection techniques in .NET, which may indicate malicious intent to disable AMSI scanning. The likely attacker objective is to evade detection mechanisms that monitor script executions, allowing for the execution of malicious payloads that would otherwise be flagged. This behavior maps to the MITRE ATT&CK tactic "Defense Evasion" (ID: T1562) and technique "Impair Defenses" (ID: T1685).

  The primary telemetry sources for this detection are process creation logs on Windows systems, specifically focusing on CommandLine parameters within Security Event ID 4688. If successful, this technique could allow an attacker to execute payloads undetected, significantly increasing the security impact of the attack. Importantly, this detection does not confirm that a successful compromise occurred; it merely suggests a possible attempt to evade defenses.

  ### Investigation Steps

  - **Check the Command Line Arguments:** Review Security Event ID 4688 for suspicious process creation logs that include `System.Management.Automation.AmsiUtils` and `amsiInitFailed`. Malicious indicators include exact matches of these terms, while benign activity typically does not include AMSI modification calls.

  - **Validate Reflective Method Calls:** Inspect the creation of processes with arguments containing `[Ref].Assembly.GetType` and `SetValue($null,$true)`. These strings are suspect if seen together, and their presence is a high-confidence indicator of malicious activity leveraging reflection techniques.

  - **Audit Parent Process:** Identify the parent process of suspicious executions. If the parent process is a legitimate script or tool (e.g., PowerShell or MSHTA), it may indicate benign activity. Conversely, unexpected parent processes (e.g., cmd.exe launching PowerShell) may warrant further investigation.

  - **Cross-check with Threat Intelligence:** Consult threat intelligence feeds for any known indicators or signatures associated with AMSI bypass attempts. This includes malware behavior associated with disabling AMSI that can inform the severity of the event.

  - **Assess File Integrity and Creation:** Check for the creation of any files or scripts associated with the command line arguments specified. Ensure that no unexpected files were created during the time window of the suspicious process execution.

  ### Prioritization

  This alert is high-severity given that it targets a critical security mechanism (AMSI) commonly weaponized by sophisticated attackers. The likelihood of malicious abuse is moderate, as many advanced threats utilize AMSI bypass techniques to evade detection methodologies present in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of appropriate logging configurations or due to process obfuscation techniques that minimize traceability for legitimate processes. Additionally, legitimate users may invoke similar AMSI bypassing techniques in custom scripts. Related detections, such as monitoring for abnormal PowerShell command execution patterns, can enhance the coverage of this threat vector.

