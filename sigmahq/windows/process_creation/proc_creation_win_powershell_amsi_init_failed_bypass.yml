  ### Technical Context

  This rule detects attempts to bypass the Antimalware Scan Interface (AMSI) in Windows environments by monitoring for specific command line arguments related to AMSI initialization failures. Typically, an attacker aims to disable AMSI to evade detection by security products when executing malicious PowerShell scripts. The relevant MITRE ATT&CK tactic is **Defense Evasion**, specifically technique **T1562.001: Disable or Modify System Security Controls**.

  The primary telemetry sources are process creation logs, specifically from Windows Event ID 4688 and Sysmon Event ID 1. If successful, an adversary may execute malicious payloads without being detected by traditional security mechanisms, compromising the integrity of the system and exposing sensitive data. Importantly, this detection does **NOT** confirm successful exploitation or malicious activity on its own, as it may also be the result of legitimate actions by administrative users.

  ---

  ### Investigation Steps

  - **Examine the alerting command line:** Review the command line provided in Event ID 4688 or Sysmon Event ID 1 for the presence of `amasiInitFailed` and `System.Management.Automation.AmsiUtils`. Compare to known benign commands to differentiate malicious attempts.

  - **Validate process origin:** Check the parent process of the executing command, noting the GUIDs or hashes of trusted binaries. Malicious execution often stems from untrusted scripts or processes, evidenced by unexpected parent processes or file paths.

  - **Assess frequency and context:** Investigate the frequency of this command line execution across the environment. Legitimate administrative scripts may invoke AMSI, while unusual spikes may indicate potential abuse.

  - **Identify known malicious indicators:** Search for historical logs using the same command patterns as known malware attacks. A command containing `SetValue($null,$true)` indicates possible manipulation of AMSI protections.

  - **Confirm legitimate administrative behavior:** Establish a baseline of typical PowerShell usage patterns within your organization. Legitimate use cases may include service management and automation tasks, generally associated with specific user accounts or infrastructure roles.

  ---

  ### Prioritization

  Given the high severity of this alert, the impact is significant if this bypass succeeds, potentially granting attackers full access to the system. The likelihood of abuse for launching malware via PowerShell is historically high, making this behavior a critical concern worthy of prompt investigation.

  ---

  ### Blind Spots and Assumptions

  This rule may not catch all bypass attempts, as attackers could employ alternative or obfuscated methods to disable AMSI. Ensuring complete coverage requires enabling full logging for PowerShell and monitoring PowerShell script execution. Legitimate administrative activities, particularly those involving shell scripting or automation tools, may inadvertently trigger this alert. A related detection to consider is monitoring for unusual PowerShell activity patterns, which can further enhance visibility into potential abuse.

