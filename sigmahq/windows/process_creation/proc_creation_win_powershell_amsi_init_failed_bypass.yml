detection:
  selection:
  - CommandLine|contains|all:
    - 'System.Management.Automation.AmsiUtils'
    - 'amsiInitFailed'
  - CommandLine|contains|all:
    - '[Ref].Assembly.GetType'
    - 'SetValue($null,$true)'
    - 'NonPublic,Static'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects potential attempts to bypass the Antimalware Scan Interface (AMSI) by monitoring for specific PowerShell commands that trigger the "amsiInitFailed" function. Attackers may exploit this capability to disable AMSI scanning and evade detection mechanisms in the Windows environment, making it easier to execute malicious scripts or load compromised DLLs without alerts. The command patterns observed in this rule are indicative of fully-fledged evasion techniques often employed by sophisticated threat actors, both in red team exercises and real-world attacks.

  The relevant MITRE ATT&CK tactics affiliated with this detection include **Defense Evasion** (TA0005), specifically the **Bypass User Account Control** technique (T1562.001), which highlights methods used to evade security controls. By monitoring for the presence of specific PowerShell commands, defenders can identify when potential bypass techniques are being initiated.

  Primary data sources for this detection include **Windows process creation events**, which log command line arguments used to invoke PowerShell and other processes. This telemetry provides insight into potentially malicious activities and enables rapid identification of suspicious commands that indicate attempts to disable AMSI.

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate any recent process creation logs containing the strings "System.Management.Automation.AmsiUtils" or "amsiInitFailed". Pay attention to the context of these calls and the user account making them.
  - **Analyze PowerShell Command Logs**: Analyze PowerShell-specific logs (e.g., transcription logs or module logs) to identify any related output or error messages that could elucidate the purpose behind the AMSI bypass attempt.
  - **Correlate with Known Threats**: Check for known indicators of compromise or related behaviors in your threat intelligence platform that match the identified command structures.
  - **Check for Unusual Script Execution**: Look for any unusual scripts or binaries executed by the account in question, as bypassing AMSI commonly precedes further malicious activity.

  ### Prioritization
  The alert is classified as high severity due to the potential of malicious actors leveraging this technique to disable critical security features in the enterprise environment. The likelihood of an attacker using AMSI bypass techniques is significant, particularly in targeted attacks where high-value assets are at stake.

  ### Blind Spots and Assumptions
  This detection relies primarily on the availability of detailed Windows process creation logs with command line arguments enabled. Gaps may exist if logging policies do not capture all instances of PowerShell execution or if certain command-line use cases are valid in legitimate operations. Additionally, this rule assumes that attackers inevitably execute the recognized command patterns, which may not always be the case. If these commands are not logged or if PowerShell logs are disabled, detection may be significantly hampered.

