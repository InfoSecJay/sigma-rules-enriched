title: Suspicious File Execution From Internet Hosted WebDav Share
id: f0507c0f-a3a2-40f5-acc6-7f543c334993
status: test
description: Detects the execution of the "net use" command to mount a WebDAV server
  and then immediately execute some content in it. As seen being used in malicious
  LNK files
references:
- https://twitter.com/ShadowChasing1/status/1552595370961944576
- https://www.virustotal.com/gui/file/a63376ee1dba76361df73338928e528ca5b20171ea74c24581605366dcaa0104/behavior
author: pH-T (Nextron Systems)
date: 2022-09-01
modified: 2023-02-21
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|contains: '\cmd.exe'
  - OriginalFileName: 'Cmd.EXE'
  selection_base:
    CommandLine|contains|all:
    - ' net use http'
    - '& start /b '
    - '\DavWWWRoot\'
  selection_ext:
    CommandLine|contains:
    - '.exe '
    - '.dll '
    - '.bat '
    - '.vbs '
    - '.ps1 '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potentially malicious behavior involving the execution of the "net use" command to mount a WebDAV share followed by the execution of various script or executable files contained within that share. This behavior is characteristic of threat actors attempting to run malicious payloads stored on internet-exposed WebDAV servers, which is a technique used in maintaining access and executing commands remotely. The goal of such an attack typically is to compromise victim systems, exfiltrate data, or move laterally within a network.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1203)**: The execution of commands and scripts, a frequent step in exploitation.
  - **Command and Scripting Interpreter (T1059.001)**: Specifically involving command script execution.

  Primary data sources that can provide useful evidence for this detection include:
  - Process creation events from Windows systems, which capture command-line arguments and the execution path.
  - Network logs that can show connections to external WebDAV shares.
  - Any logs from security solutions capturing the activity around command execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify the specific instances of `cmd.exe` execution linked to the "net use" command. This will help confirm if a WebDAV share was used.
  - **Analyze Command-Line Arguments:** Investigate the command-line arguments for `cmd.exe` to isolate any occurrences of the "net use" command followed by potentially malicious execution commands (e.g., `.exe`, `.dll`, `.bat`, `.vbs`, `.ps1`).
  - **Check Network Connections:** Determine if the system made outbound connections to known malicious or suspicious WebDAV URLs. This could indicate communication with a compromised server.
  - **Correlate with Other Alerts:** Look for other related alerts or suspicious activities in the vicinity of the detected execution, such as unusual file downloads or access to sensitive directories.

  ### Prioritization
  The alert carries high severity in an enterprise environment due to the potential for widespread damage from malware execution and unauthorized access, which could lead to data breaches or system compromises.

  ### Blind Spots and Assumptions
  This detection logic assumes that no protective measures such as application whitelisting are in place that would prevent the execution of such scripts. Additionally, it may not capture instances where files are executed without the use of "net use" or from more covert locations on the filesystem. Required logs include comprehensive process creation events from endpoints as well as network logs for tracking external connections; without these, the alert's effectiveness diminishes.

