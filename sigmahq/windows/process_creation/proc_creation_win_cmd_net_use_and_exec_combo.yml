title: Suspicious File Execution From Internet Hosted WebDav Share
id: f0507c0f-a3a2-40f5-acc6-7f543c334993
status: test
description: Detects the execution of the "net use" command to mount a WebDAV 
  server and then immediately execute some content in it. As seen being used in 
  malicious LNK files
references:
- https://twitter.com/ShadowChasing1/status/1552595370961944576
- https://www.virustotal.com/gui/file/a63376ee1dba76361df73338928e528ca5b20171ea74c24581605366dcaa0104/behavior
author: pH-T (Nextron Systems)
date: 2022-09-01
modified: 2023-02-21
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|contains: '\cmd.exe'
  - OriginalFileName: 'Cmd.EXE'
  selection_base:
    CommandLine|contains|all:
    - ' net use http'
    - '& start /b '
    - '\DavWWWRoot\'
  selection_ext:
    CommandLine|contains:
    - '.exe '
    - '.dll '
    - '.bat '
    - '.vbs '
    - '.ps1 '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the "net use" command followed by the execution of files from an Internet-hosted WebDAV share. Such behaviors often serve as an initial access vector for attackers, leveraging WebDAV to run potentially malicious scripts or executables. The likely attacker objective is to execute remote code by mounting a network drive, typically as part of a malicious payload, such as LNK files. This activity corresponds to the MITRE ATT&CK tactic of Execution (T1203) and the specific technique of Command-Line Interface (T1059.001).

  The primary telemetry sources for this detection are process creation logs from Windows (Event ID 4688 and Sysmon Event ID 1), which capture command-line arguments and associated processes. If executed in a malicious context, this behavior could lead to data exfiltration, lateral movement, or system compromise. However, this detection does NOT confirm that the action was successful or that the executed file is inherently malicious without further context.

  ### Investigation Steps

  - **Check event logs for process creation:** Review Security Event ID 4688 and Sysmon Event ID 1 for any instances where `cmd.exe` is invoked with the command line containing `net use http`. Compare timestamps to correlate with other suspicious activities.

  - **Analyze command arguments:** Look for command-line patterns that include `& start /b` and `\DavWWWRoot\`. If these patterns are present, further investigation is warranted, as they are commonly indicative of suspicious web content execution.

  - **Validate legitimate operations:** Determine if the user or system role typically mounts WebDAV shares. Look for expected legitimate usage patterns in your environment (e.g., known applications using WebDAV for legitimate purposes, documented in change requests).

  - **Identify malicious indicators:** Search for file extensions in the command line arguments (e.g., `.exe`, `.vbs`, `.ps1`). Files executed with these extensions from an external WebDAV source are strong indicators of potential compromise, especially if noted in non-standard locations.

  - **Correlate with other security alerts:** Investigate any simultaneous alerts from EDR or IDS that may further indicate exploitation efforts or successful remote code execution on the same host during the same time frame.

  - **Monitor file creation or modification:** Check for unexpected file creation or modifications in directory paths consistent with WebDAV shares. This could include temporary files or logs that may hint at post-compromise behavior.

  ### Prioritization

  This alert is considered high severity given that it indicates the potential execution of unauthorized commands sourced from external locations. The likelihood of malicious abuse is significant, as the behavior matches common tactics used by attackers. This method of execution is often weaponized in phishing schemes or malware distribution.

  ### Blind Spots and Assumptions

  Limitations of this detection include the potential for legitimate activities to trigger false positives, such as authorized users accessing shared resources for valid business purposes. Required log sources must include detailed command execution telemetry from Windows; thus, Sysmon should be properly configured for comprehensive data capture. Additionally, network anomalies could indicate broader exploitation activities; related detections, like unusual outbound connections to known malicious IPs, can complement this rule and reinforce overall detection coverage.

