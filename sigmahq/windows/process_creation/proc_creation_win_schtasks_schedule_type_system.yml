note: |
  ### Technical Context

  This rule detects the creation or modification of scheduled tasks that are set to run with high privileges using the `schtasks.exe` utility. The behavior indicates an attempt by an adversary to maintain persistence or execute malicious actions with elevated permissions, possibly in preparation for further exploitation within the environment. The relevant MITRE ATT&CK technique is **Scheduled Task/Job (T1053.005)**.

  The primary telemetry sources for this detection include Windows process creation logs, specifically looking for Event ID 4688, which records new process creations, and corresponding command line arguments related to `schtasks.exe`. If malicious, this behavior could allow an attacker to execute arbitrary code or scripts with elevated privileges whenever a specified condition (like system logon or idle state) is met. Importantly, this detection does NOT confirm malicious intent solely based on the presence of high-privilege scheduled tasks; legitimate software installations may utilize similar approaches.

  ### Investigation Steps

  - **Review recent scheduled tasks:** Check for tasks created or modified around the alert time. Look for Event ID 4698 (a task was created) and Event ID 4699 (a task was deleted). Confirm suspicious schedule types like `ONLOGON`, `ONSTART`, or `ONIDLE`.

  - **Analyze command line parameters:** Investigate the command line for `schtasks.exe`. Look for parameters including 'NT AUTHORITY\SYSTEM', 'HIGHEST', or 'SYSTEM' as this indicates high privilege elevation, which is inconsistent with standard usage.

  - **Check for legitimate scheduled tasks:** Compare the identified tasks against known and expected corporate scheduled tasks. Tasks from legitimate software installers may appear suspicious; review any that include installation processes or maintenance routines.

  - **Identify unusual file creation or modifications:** Use Sysmon (Event ID 11) or Windows File Audit logs to check for any file system changes associated with the executable launched by the scheduled tasks, looking for unusual files or modifications in sensitive directories.

  - **Monitor user account activity:** Review the accounts associated with the creation or modification of the scheduled tasks. Any administrative or SYSTEM account access outside normal operational hours should be flagged for further review.

  ### Prioritization

  This alert has medium severity due to the potential for privilege escalation and persistence mechanisms enabled by unauthorized scheduled tasks. While some scheduled tasks are legitimate, the combination of high privileges and suspicious schedule types raises concerns for malicious abuse, especially in environments where these patterns are not standard.

  ### Blind Spots and Assumptions

  Detection limitations may include legitimate software installations that utilize `schtasks.exe`, resulting in potential false positives. Ensure that logging for process creation (Event ID 4688) and task scheduling changes (Event ID 4698) is enabled and properly configured. Legitimate administrative activities, scripts, or software updates may trigger this alert due to similar mechanisms. A companion detection to strengthen coverage would be monitoring for unusual process creations by other task management tools or scripts on affected hosts.

