level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying the creation or modification of scheduled tasks (`schtasks.exe`) that are set to run with high privileges, particularly under suspicious scheduling types like ONLOGON, ONSTART, ONCE, or ONIDLE. Such activity could indicate malicious intentions, such as persistence mechanisms implemented by attackers to ensure that their payloads run with elevated privileges, potentially allowing them to maintain access to compromised systems even after reboots.

  Attackers may leverage these capabilities to execute malware, establish backdoors, or perform other malicious tasks without user intervention, thus achieving their objectives of lateral movement, persistence, or privilege escalation within the environment.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1203)**: running malicious code via task scheduling.
  - **Persistence (T1053.005)**: utilizing scheduled tasks to maintain a foothold.
  - **Privilege Escalation (T1068)**: executing tasks with high privileges that may lead to compromised accounts or administrative access.

  Primary data sources for effective detection include:
  - Process creation events capturing `schtasks.exe` usage.
  - Command-line arguments associated with scheduled tasks.
  - Security event logs detailing privilege levels used for execution.

  ### Investigation Steps
  - **Review Scheduled Task Entries**: Examine the scheduled task library for unusually named or configured tasks, especially those associated with high privilege levels and suspicious triggers (e.g., ONLOGON, ONSTART).
  - **Analyze Process Creation Logs**: Check process creation logs for `schtasks.exe` invocations, focusing on command-line arguments that suggest high privilege execution or unusual scheduling types.
  - **Inspect User Accounts and Permissions**: Validate the user account under which the scheduled task was created. Investigate if the account has administrative privileges and whether it has a legitimate need for elevated access.
  - **Correlate with Other Indicators**: Look for associated events leading up to or following the task creation, such as unusual login attempts, lateral movement activities, or other forms of suspicious behavior that could indicate broader compromise.

  ### Prioritization
  The severity of this alert is classified as medium due to its potential to facilitate significant malicious activities, such as persistence and privilege escalation. If exploited, the attacker can gain sustained access to sensitive systems within the enterprise, making it crucial to address promptly.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of malicious scheduled task creation, particularly if attackers use uncommon or legitimate scheduling parameters that do not match the criteria. Additionally, the detection assumes that `schtasks.exe` is consistently utilized in an enterprise environment, and proper logging settings are configured to capture detailed process creation logs. Environments using third-party scheduling tools or heavily customized task configurations may experience gaps in detection coverage.

