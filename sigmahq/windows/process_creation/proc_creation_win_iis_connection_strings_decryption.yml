title: Microsoft IIS Connection Strings Decryption
id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
status: test
description: Detects use of aspnet_regiis to decrypt Microsoft IIS connection 
  strings. An attacker with Microsoft IIS web server access via a webshell or 
  alike can decrypt and dump any hardcoded connection strings, such as the MSSQL
  service account password using aspnet_regiis command.
references:
- https://www.elastic.co/guide/en/security/current/microsoft-iis-connection-strings-decryption.html
author: Tim Rauch, Elastic (idea)
date: 2022-09-28
modified: 2022-12-30
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
  - Image|endswith: '\aspnet_regiis.exe'
  - OriginalFileName: 'aspnet_regiis.exe'
  selection_args:
    CommandLine|contains|all:
    - 'connectionStrings'
    - ' -pdf'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `aspnet_regiis.exe` command, specifically when it is used to decrypt Microsoft IIS connection strings. Attackers with access to the IIS web server can execute this command to extract sensitive information such as database connection strings and credentials. The likely attacker objective is to gain unauthorized access to databases or services by retrieving hardcoded service account passwords. This activity is relevant to the MITRE ATT&CK tactic "Credential Access" (T1003). Primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized access to critical databases, compromising data integrity and confidentiality. It is important to note that this detection does NOT confirm that an attacker successfully accessed the database, only that a potentially malicious decryption attempt occurred.

  ### Investigation Steps

  - **Identify process creation events:** Search for Security Event ID 4688 or Sysmon Event ID 1 that reference `aspnet_regiis.exe`. Extract the `CommandLine` field to confirm the presence of `-pdf` and `connectionStrings`.

  - **Verify the execution context:** Check for the user context in which `aspnet_regiis.exe` was executed. A legitimate execution should typically involve service accounts or administrative users managing IIS; unexpected execution by standard user accounts may indicate a breach.

  - **Review historical usage of connection strings:** Query the application logs and configuration files for the expected files in line with the detected command. Normal applications may log or use connection strings without attempting decryption.

  - **Assess for high-confidence malicious indicators:** Look for evidence of unauthorized modifications or creations of logs, configuration files, or user accounts related to the IIS environment following the decryption command execution.

  - **Determine the asset criticality:** If the process was executed on a production web server that houses sensitive customer data, escalate the investigation as there may be significant risk in terms of compliance and business continuity.

  ### Prioritization

  The severity of this alert is high, as it indicates potential unauthorized access to sensitive credentials on an IIS web server, which could lead to further compromise, including data breaches. The likelihood of malicious abuse is high due to the usefulness of decrypted credentials in lateral movement and escalating privileges. This behavior is commonly weaponized by attackers targeting web applications.

  ### Blind Spots and Assumptions

  There are detection limitations if logging for process creation is not enabled at the endpoint or if logs are not retained long enough. Attackers may employ evasion techniques such as renaming the executable or running it from a non-standard path. Legitimate activities that may trigger the alert include routine maintenance by authorized IT staff using the same decryption command. Related detection rules for unauthorized file access or modifications in IIS logs can provide additional context to confirm potential compromises.

