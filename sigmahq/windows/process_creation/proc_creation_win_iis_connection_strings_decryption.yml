title: Microsoft IIS Connection Strings Decryption
id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
status: test
description: Detects use of aspnet_regiis to decrypt Microsoft IIS connection strings.
  An attacker with Microsoft IIS web server access via a webshell or alike can decrypt
  and dump any hardcoded connection strings, such as the MSSQL service account password
  using aspnet_regiis command.
references:
- https://www.elastic.co/guide/en/security/current/microsoft-iis-connection-strings-decryption.html
author: Tim Rauch, Elastic (idea)
date: 2022-09-28
modified: 2022-12-30
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
  - Image|endswith: '\aspnet_regiis.exe'
  - OriginalFileName: 'aspnet_regiis.exe'
  selection_args:
    CommandLine|contains|all:
    - 'connectionStrings'
    - ' -pdf'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the usage of the `aspnet_regiis` utility to decrypt connection strings on Microsoft Internet Information Services (IIS). An attacker who gains access to a web server, potentially through a web shell or compromised credentials, could use this utility to reveal sensitive hardcoded information, such as a Microsoft SQL Server service account password. This technique could lead to further exploitation of the database or lateral movement within the environment.

  The relevant MITRE ATT&CK techniques include **Credential Access (T1003)**, which encompasses methods for extracting credentials from various types of storage. This behavior typically indicates an attacker trying to escalate privileges or gather critical account credentials for deeper infiltration into the network.

  Primary data sources for this detection include **process creation logs**, which will reveal the invocation of `aspnet_regiis.exe` along with the associated command-line arguments, providing insight into potential malicious activity.

  ### Investigation Steps
  - **Review Process Creation Events:** Check for process creation logs that include `aspnet_regiis.exe` to confirm if it was executed on the system.
  - **Analyze Command-Line Arguments:** Investigate the command-line parameters used with `aspnet_regiis.exe`, focusing on any instances containing 'connectionStrings' and ' -pdf', as these indicate an intention to decrypt sensitive information.
  - **Correlate with Web Server Access Logs:** Cross-reference the timestamps of the detected process execution with web server access logs to identify any potentially anomalous access patterns or known IP addresses related to the threat actor.
  - **Check for Web Shell or Unusual Processes:** Look for signs of web shells or other potentially malicious processes running on the IIS server, as these may indicate how the attacker initially gained access.

  ### Prioritization
  The alert is classified as high severity due to the critical nature of the information that can be compromised through the decryption of connection strings, which may lead to unauthorized access to databases and elevated privileges within the organization's environment.

  ### Blind Spots and Assumptions
  The detection logic assumes that `aspnet_regiis.exe` will be used in a typical manner when executed for decryption. There may be blind spots in environments where this utility is legitimately used for maintenance or development purposes without strict monitoring. Additionally, the effectiveness of the detection depends on accurate process creation logs being enabled and readily available; if these logs are missing or misconfigured, the detection may not trigger appropriately.

