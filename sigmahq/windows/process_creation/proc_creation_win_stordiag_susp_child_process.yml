title: Execution via stordiag.exe
id: 961e0abb-1b1e-4c84-a453-aafe56ad0d34
status: test
description: Detects the use of stordiag.exe to execute schtasks.exe 
  systeminfo.exe and fltmc.exe
references:
- https://strontic.github.io/xcyclopedia/library/stordiag.exe-1F08FC87C373673944F6A7E8B18CD845.html
- https://twitter.com/eral4m/status/1451112385041911809
author: Austin Songer (@austinsonger)
date: 2021-10-21
modified: 2022-12-25
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\stordiag.exe'
    Image|endswith:
    - '\schtasks.exe'
    - '\systeminfo.exe'
    - '\fltmc.exe'
  filter:
    ParentImage|startswith:     # as first is "Copy c:\windows\system32\stordiag.exe to a folder"
    - 'c:\windows\system32\'
    - 'c:\windows\syswow64\'
  condition: selection and not filter
falsepositives:
- Legitimate usage of stordiag.exe.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the invocation of system management tools (schtasks.exe, systeminfo.exe, and fltmc.exe) by stordiag.exe, a known utility exploited by adversaries to perform unwanted actions. The likely attacker objective is to execute system commands or gather system information stealthily. This behavior aligns with the MITRE ATT&CK technique for "User Execution" (T1218) and can also relate to "Defense Evasion" (T1203). The primary telemetry source is Windows process creation logs, specifically Monitoring Event ID 4688 or Sysmon Event ID 1. If malicious, this could lead to unauthorized system modifications or information leakage. This detection alone does NOT confirm malicious intent since stordiag.exe could be used legitimately.

  ### Investigation Steps

  - **Validate process lineage:** Review the creation of Event ID 4688 where `ParentImage` is `stordiag.exe`. Look for the `Image` field showing schtasks.exe, systeminfo.exe, or fltmc.exe. A direct invocation by known tools typically indicates benign activity.

  - **Correlate timings of executions:** Check for the execution times of the detected processes relative to other system activity captured in Windows Event Logs (IDs 4624 for logon events, 4672 for special privileges assigned). Look for suspicious timeframes or patterns aligning with threat actor behavior.

  - **Investigate command line parameters:** Assess the command line used in the Event ID 4688 entries for the detected processes. Malicious indicators include unusual flags or arguments that deviate from standard operations, like a cron job or inactivity period.

  - **Identify known good usage:** Compare detection instances against documented legitimate uses of stordiag.exe in the environment. Seek thresholds or historical logs that indicate standard operational parameters to distinguish benign executions.

  - **Scan for related artifacts:** Look for recent file modifications or creations in `C:\Windows\System32\` or `C:\Windows\SysWOW64\` relevant to stordiag.exe or scanned command outputs. File paths, created timestamps, and file signatures can provide insight into escalation.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical systems and the likelihood of malicious activity exploiting commonly trusted system tools. The utilization of stordiag.exe for executing such commands is often weaponized in attack scenarios, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited by evasion techniques, such as using alternate execution paths or renaming legitimate tools. Reliable detection requires precise configurations of logging, including ensuring Sysmon is correctly deployed and configured to capture detailed process creation events. Legitimate IT maintenance or scripting activity may trigger this alert. Companion detections related to unusual process chains or lateral movement (e.g., using `PsExec` or similar tools) would provide stronger overall security posture.

