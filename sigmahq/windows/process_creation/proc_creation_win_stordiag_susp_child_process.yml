title: Execution via stordiag.exe
id: 961e0abb-1b1e-4c84-a453-aafe56ad0d34
status: test
description: Detects the use of stordiag.exe to execute schtasks.exe systeminfo.exe
  and fltmc.exe
references:
- https://strontic.github.io/xcyclopedia/library/stordiag.exe-1F08FC87C373673944F6A7E8B18CD845.html
- https://twitter.com/eral4m/status/1451112385041911809
author: Austin Songer (@austinsonger)
date: 2021-10-21
modified: 2022-12-25
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\stordiag.exe'
    Image|endswith:
    - '\schtasks.exe'
    - '\systeminfo.exe'
    - '\fltmc.exe'
  filter:
    ParentImage|startswith:     # as first is "Copy c:\windows\system32\stordiag.exe to a folder"
    - 'c:\windows\system32\'
    - 'c:\windows\syswow64\'
  condition: selection and not filter
falsepositives:
- Legitimate usage of stordiag.exe.
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of system utilities (`schtasks.exe`, `systeminfo.exe`, and `fltmc.exe`) by a potentially malicious process, `stordiag.exe`. The presence of `stordiag.exe` as a parent process is significant because it is often associated with tactics used by attackers to evade detection while gathering system information or manipulating scheduled tasks. The threat scenario involves an attacker aiming to execute arbitrary commands under a seemingly legitimate process, thereby bypassing standard security measures and gaining unauthorized access to system information or manipulating the scheduling of tasks.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) due to the obfuscation of malicious activity by leveraging a trusted system binary, and potentially **Execution** (T1218) since the rule captures the execution of system commands through legitimate applications. Primary data sources for this detection include **process creation events**, specifically the logs detailing parent-child relationships of processes on Windows environments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for instances where `stordiag.exe` served as the parent process. Note the timestamps and user context to identify any unusual behavior patterns.
  - **Inspect System Utility Execution**: Check for executions of `schtasks.exe`, `systeminfo.exe`, and `fltmc.exe` that followed `stordiag.exe`. Cross-reference these logs against normal operational baselines for the involved systems.
  - **Analyze User Activity**: Investigate the user account that initiated the command. Determine if the user has the necessary permissions and whether the behavior aligns with their usual activity patterns.
  - **Examine Anomalous File Locations**: Look for any instances of `stordiag.exe` operating from non-standard file paths. This could indicate an attempt to hide the actual location of the executable, suggesting malicious intent.

  ### Prioritization
  The alert is classified as high severity due to the potential for attackers to gain unauthorized access to sensitive system information and manipulate scheduled tasks. Leveraging a known binary for evasion amplifies the likelihood of successful exploitation within an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of `stordiag.exe` execution, particularly in cases where legitimate administrative tasks are performed that coincide with these utilities. The detection logic assumes that all executions of `stordiag.exe` are suspicious when they invoke the specified child processes, which may not account for all valid use cases. Required logs include detailed process creation logs, and the environment must be properly configured to ensure these logs are collected and retained for effective detection capabilities.

