title: Execution via stordiag.exe
id: 961e0abb-1b1e-4c84-a453-aafe56ad0d34
status: test
description: Detects the use of stordiag.exe to execute schtasks.exe 
  systeminfo.exe and fltmc.exe
references:
- https://strontic.github.io/xcyclopedia/library/stordiag.exe-1F08FC87C373673944F6A7E8B18CD845.html
- https://twitter.com/eral4m/status/1451112385041911809
author: Austin Songer (@austinsonger)
date: 2021-10-21
modified: 2022-12-25
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\stordiag.exe'
    Image|endswith:
    - '\schtasks.exe'
    - '\systeminfo.exe'
    - '\fltmc.exe'
  filter:
    ParentImage|startswith:     # as first is "Copy c:\windows\system32\stordiag.exe to a folder"
    - 'c:\windows\system32\'
    - 'c:\windows\syswow64\'
  condition: selection and not filter
falsepositives:
- Legitimate usage of stordiag.exe.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `schtasks.exe`, `systeminfo.exe`, and `fltmc.exe` with `stordiag.exe` as the parent process. This behavior indicates potentially malicious activity, as `stordiag.exe` is often used for reconnaissance and is not a standard tool in many enterprise environments. The likely attacker objective is to gather system information or manipulate scheduled tasks stealthily, leveraging a less-commonly monitored executable.

  This behavior aligns with the MITRE ATT&CK tactic of "Execution" (T1203) and technique "Execution via sibling process" (T1218). The primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, an attacker could utilize this technique to escalate privileges or pivot within the environment. Importantly, this detection does not confirm an active compromise on its own; further investigation is required to establish intent and continued access.

  ### Investigation Steps

  - **Review Process Creation Events**: Check Security Event ID 4688 or Sysmon Event ID 1 logs for instances where `stordiag.exe` is the parent process of `schtasks.exe`, `systeminfo.exe`, or `fltmc.exe`. Look for unusual execution patterns or times that deviate from normal operational hours.

  - **Analyze Parent Process Path**: Validate that the parent process `stordiag.exe` is executing from `C:\Windows\System32\` or `C:\Windows\SysWOW64\`. Any execution from non-standard paths could indicate malicious modifications.

  - **Investigate Activity Frequency**: Identify how often `stordiag.exe` launches these child processes. Frequent executions in a short time frame or executions occurring outside typical usage patterns may indicate suspicious activity.

  - **Identify Legitimate Usage**: Assess logs for known legitimate use-cases of `stordiag.exe` within your environment. Document typical process parent-child relationships and user accounts associated with those executions.

  - **Extract System Information**: For any identified executions, capture system information logs (Event ID 7036 or similar) that may indicate what system changes or scheduled tasks were affected. Look for abnormal tasks or system commands being modified.

  - **Correlate with Known Threat Intelligence**: Reference threat intelligence sources regarding `stordiag.exe` to identify documented malicious behavior or variants associated with the tool. This can aid in determining if observed activity matches known attack patterns.

  ### Prioritization

  This alert is high priority due to the nature of the detected processes and the context provided by `stordiag.exe`. The affected systems may be critical infrastructure components, and the likelihood of malicious abuse is significant, especially when executing tools that could provide system insights or alter task scheduling. Such behavior is commonly weaponized in exploitation scenarios.

  ### Blind Spots and Assumptions

  The detection may miss sophisticated evasion attempts, such as renaming or modifying legitimate tools. Reliable detection requires capturing detailed process creation logs across all endpoints, ensuring no relevant telemetry (such as Sysmon configurations) is omitted. Legitimate IT administration or troubleshooting activities could trigger this alert, particularly in environments where `stordiag.exe` is expected. A related detection for scheduled tasks being modified or created unexpectedly could provide greater context to this potential alert.

