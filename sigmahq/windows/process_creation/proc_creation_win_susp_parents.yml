title: Suspicious Process Parents
id: cbec226f-63d9-4eca-9f52-dfb6652f24df
status: test
description: Detects suspicious parent processes that should not have any 
  children or should only have a single possible child program
references:
- https://twitter.com/x86matthew/status/1505476263464607744?s=12
- https://svch0st.medium.com/stats-from-hunting-cobalt-strike-beacons-c17e56255f9b
author: Florian Roth (Nextron Systems)
date: 2022-03-21
modified: 2022-09-08
tags:
- attack.stealth
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\minesweeper.exe'
    - '\winver.exe'
    - '\bitsadmin.exe'
  selection_special:
    ParentImage|endswith:
    - '\csrss.exe'
    - '\certutil.exe'
         # - '\schtasks.exe'
    - '\eventvwr.exe'
    - '\calc.exe'
    - '\notepad.exe'
  filter_special:
    Image|endswith:
    - '\WerFault.exe'
    - '\wermgr.exe'
    - '\conhost.exe'         # csrss.exe, certutil.exe
    - '\mmc.exe'             # eventvwr.exe
    - '\win32calc.exe'         # calc.exe
    - '\notepad.exe'
  filter_null:
    Image:
  condition: selection or ( selection_special and not 1 of filter_* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious parent processes that create child processes that are unusual or unexpected. Specifically, it focuses on certain legitimate applications, like `minesweeper.exe` and `winver.exe`, which should not typically spawn additional processes, along with others that can spawn limited children but in unusual contexts. The likely attacker goal is to leverage these commonly benign processes for malicious activity, such as executing secondary payloads or beacons stealthily.

  The relevant MITRE ATT&CK technique is T1036 (Masquerading) under the tactic of "Defense Evasion." The primary telemetry source is Windows process creation logs, particularly Security Event ID 4688. If malicious, this behavior can indicate an ongoing compromise, potential lateral movement, or command-and-control activity initiated from benign-looking processes. However, this detection alone does not confirm malicious activity; legitimate applications may behave similarly under certain conditions.

  ### Investigation Steps

  - **Check process creation history:** Review Security Event ID 4688 for the detected parent process and note the creation time, command line, and user context for any anomalies (e.g., unusual accounts or timing).

  - **Identify parent-child relationships:** Use Sysinternals Process Explorer or PowerShell cmdlets to track the process tree, confirming if legitimate child processes are created only by appropriate parent processes as per expected behaviors.

  - **Verify expected behavior for benign applications:** Confirm that expected child processes are limited for applications like `minesweeper.exe`, which should not have any child processes. Documenting the legitimate process behavior provides a baseline to identify deviations.

  - **Correlate with known adversary techniques:** Cross-reference parent processes flagged by this detection with threat intelligence or known attack patterns related to T1036. Look for reported behaviors from recent adversary campaigns.

  - **Analyze command line arguments:** Examine command line parameters associated with the parent process using Security Event ID 4688. Unexpected arguments could indicate malicious intent, especially when paired with known suspicious parent processes.

  - **Monitor for additional indicators:** If `certutil.exe` or `schtasks.exe` is involved, check for known indicators of compromise (IOCs) and evaluate if further threat hunting is warranted based on past alerts regarding these applications.

  ### Prioritization

  Given the high severity level, this alert should be prioritized due to its potential impact on the affected systems, as they may serve critical roles in the enterprise infrastructure. The likelihood of malicious abuse is substantial, especially as these parent processes are often associated with evasion techniques used by attackers to disguise their activities.

  ### Blind Spots and Assumptions

  This detection may have limitations due to common legitimate use cases for the identified parent processes, which could generate false positives. Evasion techniques may include renaming files or altering command lines to mimic legitimate behavior. Ensure that logging is enabled for all process creation events (Security Event ID 4688) and consider collecting Sysmon logs for more granularity. Related detections include monitoring for unusual command line arguments in conjunction with process creation logs to accompany the results from this rule effectively.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
