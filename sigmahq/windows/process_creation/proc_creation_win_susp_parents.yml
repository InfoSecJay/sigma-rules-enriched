title: Suspicious Process Parents
id: cbec226f-63d9-4eca-9f52-dfb6652f24df
status: test
description: Detects suspicious parent processes that should not have any children
  or should only have a single possible child program
references:
- https://twitter.com/x86matthew/status/1505476263464607744?s=12
- https://svch0st.medium.com/stats-from-hunting-cobalt-strike-beacons-c17e56255f9b
author: Florian Roth (Nextron Systems)
date: 2022-03-21
modified: 2022-09-08
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\minesweeper.exe'
    - '\winver.exe'
    - '\bitsadmin.exe'
  selection_special:
    ParentImage|endswith:
    - '\csrss.exe'
    - '\certutil.exe'
         # - '\schtasks.exe'
    - '\eventvwr.exe'
    - '\calc.exe'
    - '\notepad.exe'
  filter_special:
    Image|endswith:
    - '\WerFault.exe'
    - '\wermgr.exe'
    - '\conhost.exe'         # csrss.exe, certutil.exe
    - '\mmc.exe'             # eventvwr.exe
    - '\win32calc.exe'         # calc.exe
    - '\notepad.exe'
  filter_null:
    Image:
  condition: selection or ( selection_special and not 1 of filter_* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  The "Suspicious Process Parents" rule is designed to detect instances where certain legitimate but potentially malicious parent processes are observed spawning child processes in an unusual manner. Specifically, this rule focuses on parent processes that typically should not have children or are limited to a single type of child process. The detection logic targets familiar Windows system processes such as `minesweeper.exe`, `winver.exe`, `bitsadmin.exe`, and others that are often exploited in various attack scenarios, including those involving Cobalt Strike.

  Attackers leveraging Cobalt Strike, a popular post-exploitation toolkit, may use common Windows executables as parents for malicious child processes to evade detection. By exploiting legitimate tools, attackers can maintain stealth while conducting reconnaissance or lateral movement within a network. This behavior aligns with the MITRE ATT&CK tactics of **Defense Evasion** (T1027) and **Process Injection** (T1055), as well as technique **T1036: Masquerading**, where attackers disguise their tools to blend in with normal operations.

  The primary data sources for this detection include process creation events, which provide insight into the lifecycle of processes as they are spawned on Windows systems. These logs can help analysts identify when suspicious parent-child relationships occur that deviate from established norms.

  ### Investigation Steps
  - **Review Process Creation Events**: Collect logs related to process creation on affected endpoints to identify the parent and child relationships. Pay close attention to processes invoked by the listed suspicious parent executables.
  - **Correlate with Additional Logs**: Examine security logs from systems like EDR or SIEM for alerts related to the activity of the identified processes, looking for other suspicious behaviors or indicators of compromise associated with Cobalt Strike.
  - **Analyze Process Anomalies**: Investigate any child processes spawned from the suspicious parents. Look for unusual command line arguments, execution paths, and file hashes that deviate from normal activity patterns.
  - **Identify Contextual Information**: Collect contextual information regarding the host, such as user activity, recent user logins, and other session-related data, to determine if there is a legitimate reason for the process behaviors detected.

  ### Prioritization
  This alert is considered high severity due to the potential for significant impact on enterprise security. Given the likelihood that such behaviors indicate an active compromise, timely investigation and response are crucial to prevent data exfiltration or lateral movement across the network.

  ### Blind Spots and Assumptions
  This detection may not cover all potential attack vectors, especially if attackers use processes that are not captured by the specified parent or filter criteria. The detection logic assumes legitimate processes won’t deviate from their expected behavior; however, advanced attackers may craft custom executables or alter process behaviors. Additionally, the monitoring environment must be properly configured to capture process creation events for this rule to function effectively, which may not be the case in all enterprise setups.

