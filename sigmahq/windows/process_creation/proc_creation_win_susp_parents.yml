title: Suspicious Process Parents
id: cbec226f-63d9-4eca-9f52-dfb6652f24df
status: test
description: Detects suspicious parent processes that should not have any 
  children or should only have a single possible child program
references:
- https://twitter.com/x86matthew/status/1505476263464607744?s=12
- https://svch0st.medium.com/stats-from-hunting-cobalt-strike-beacons-c17e56255f9b
author: Florian Roth (Nextron Systems)
date: 2022-03-21
modified: 2022-09-08
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\minesweeper.exe'
    - '\winver.exe'
    - '\bitsadmin.exe'
  selection_special:
    ParentImage|endswith:
    - '\csrss.exe'
    - '\certutil.exe'
         # - '\schtasks.exe'
    - '\eventvwr.exe'
    - '\calc.exe'
    - '\notepad.exe'
  filter_special:
    Image|endswith:
    - '\WerFault.exe'
    - '\wermgr.exe'
    - '\conhost.exe'         # csrss.exe, certutil.exe
    - '\mmc.exe'             # eventvwr.exe
    - '\win32calc.exe'         # calc.exe
    - '\notepad.exe'
  filter_null:
    Image:
  condition: selection or ( selection_special and not 1 of filter_* )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious parent processes in the Windows process creation logs, specifically those that typically do not spawn child processes or should only have specific, expected child processes. The likely attacker objective is to conceal malicious activity by leveraging benign-looking processes like `minesweeper.exe` or `certutil.exe` to initiate secondary malicious tasks. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically with the technique T1036 (Masquerading).

  The primary telemetry sources for this detection are Windows Security Event logs (Event ID 4688) and Sysmon logs (Event ID 1), which capture process creation events. If malicious, this behavior could indicate a compromised system potentially being used to conduct further attacks or lateral movement. Importantly, this detection does NOT confirm malicious behavior on its own, as legitimate applications may occasionally exhibit similar parent-child relationships.

  ### Investigation Steps

  - **Identify the parent process:**
    Examine Security Event ID 4688 or Sysmon Event ID 1 to identify the parent process. Look for entries where ParentImage matches `minesweeper.exe`, `winver.exe`, or other specified processes.

  - **Evaluate child processes spawned:**
    Check the same logs to see if any child processes were created from the identified parent process. Confirm that they are not any of the specified benign filters like `WerFault.exe`, `wermgr.exe`, or `conhost.exe`.

  - **Review legitimate process behavior:**
    Validate common usage of `certutil.exe` or `notepad.exe` on the system. These processes should primarily function with predictable child processes or none at all in non-malicious contexts.

  - **Correlate with known bad behavior:**
    Cross-reference the identified parent-child relationship against threat intelligence feeds or internal detections for known malicious behavior associated with these parent processes.

  - **Assess system criticality:**
    Determine the role of the affected system (e.g., server, workstation) and its criticality to understand the potential impact of the alert on overall operations.

  - **Investigate file creations or data exfiltration:**
    Look for any recent file creations or unauthorized access patterns using process monitoring tools. For instance, track any unusual files created by the processes in question that may indicate data extraction or payload retrieval activities.

  ### Prioritization

  This alert is high severity due to the implications of compromise and the potential impact on sensitive systems. The likelihood of malicious abuse is significant, particularly as threat actors commonly weaponize benign-like processes to carry out their attacks. Immediate investigation is warranted to confirm whether the alert is indicative of an active threat or an innocent anomaly.

  ### Blind Spots and Assumptions

  This detection may have limitations around legitimate administrative tasks or software updates triggering similar parent-child relationships, leading to false positives. It requires correct configuration of Windows Event logging or Sysmon to capture relevant details reliably. Additionally, common processes like `calc.exe` might appear benign but can also be abused in an attack scenario. To enhance detection efficacy, monitoring for the use of other parent processes known to relate to post-exploitation activities (like `powershell.exe` or `cmd.exe`) should be considered.

