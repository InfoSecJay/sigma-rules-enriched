title: HKTL - SharpSuccessor Privilege Escalation Tool Execution
id: 38a1ac5f-9c74-47d2-a345-dd6f5eb4e7c8
status: experimental
description: |
  Detects the execution of SharpSuccessor, a tool used to exploit the BadSuccessor attack for privilege escalation in WinServer 2025 Active Directory environments.
  Successful usage of this tool can let the attackers gain the domain admin privileges by exploiting the BadSuccessor vulnerability.
references:
- https://github.com/logangoins/SharpSuccessor
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-06-06
tags:
- attack.privilege-escalation
- attack.t1068
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\SharpSuccessor.exe'
  - OriginalFileName: 'SharpSuccessor.exe'
  - CommandLine|contains: 'SharpSuccessor'
  - CommandLine|contains|all:
    - ' add '
    - ' /impersonate'
    - ' /path'
    - ' /account'
    - ' /name'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of SharpSuccessor, a tool specifically designed to exploit the BadSuccessor vulnerability for privilege escalation in Windows Server 2025 Active Directory environments. The primary objective of an attacker utilizing this tool is to gain elevated privileges, potentially achieving domain admin access, which allows for extensive control over the affected environment. This behavior corresponds with MITRE ATT&CK techniques for privilege escalation (T1068).

  The primary telemetry source for this detection is Windows process creation logs, specifically capturing Event ID 4688. If successful, the use of SharpSuccessor can severely compromise system integrity and security by allowing unauthorized access to sensitive resources and data. Importantly, this detection does NOT confirm that a successful escalation occurred; it merely indicates the execution of a potentially malicious tool.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for instances where the Image path ends with `\SharpSuccessor.exe`. Look for evidence of the process starting, including the UserName of the executing account to identify potential unauthorized access.

  - **Inspect command line arguments:** Analyze the CommandLine field of the process creation logs for usage of keywords like `add`, `/impersonate`, `/path`, `/account`, or `/name`. Presence of these flags in conjunction with the SharpSuccessor execution increases the likelihood of malicious intent.

  - **Validate expected behavior:** Identify systems that should not have SharpSuccessor executed, as this tool is not a standard application in typical environments. Investigate the context of any legitimate administrative tasks being performed on the server.

  - **Correlate with other activity:** Check for pre-existing indicators of compromise, such as failed logins or unusual account behavior prior to SharpSuccessor execution. Review logs for suspicious activities that may indicate prior reconnaissance or credential theft.

  - **Evaluate impact based on asset role:** Determine the criticality of the affected system (e.g., whether it is a domain controller or file server). Privilege escalation on critical systems warrants a higher priority for investigation.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential impact on the domain and the likelihood of malicious abuse, given that tools like SharpSuccessor are specifically designed for privilege escalation. The use of such tools is often weaponized by threat actors targeting AD environments, and they need immediate attention.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques, such as renaming the executable or using process injection to mask activity. Reliable detection requires that process creation logging is enabled and properly configured on monitored endpoints. Legitimate administrative activities may sometimes trigger this alert, especially if IT teams are experimenting with tools in a controlled environment. A related detection that strengthens coverage includes monitoring for unsuccessful executions or environmental misconfigurations leading up to the execution of SharpSuccessor.

