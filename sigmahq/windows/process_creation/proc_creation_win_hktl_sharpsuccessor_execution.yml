title: HKTL - SharpSuccessor Privilege Escalation Tool Execution
id: 38a1ac5f-9c74-47d2-a345-dd6f5eb4e7c8
status: experimental
description: |
  Detects the execution of SharpSuccessor, a tool used to exploit the BadSuccessor attack for privilege escalation in WinServer 2025 Active Directory environments.
  Successful usage of this tool can let the attackers gain the domain admin privileges by exploiting the BadSuccessor vulnerability.
references:
- https://github.com/logangoins/SharpSuccessor
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-06-06
tags:
- attack.privilege-escalation
- attack.t1068
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\SharpSuccessor.exe'
  - OriginalFileName: 'SharpSuccessor.exe'
  - CommandLine|contains: 'SharpSuccessor'
  - CommandLine|contains|all:
    - ' add '
    - ' /impersonate'
    - ' /path'
    - ' /account'
    - ' /name'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of SharpSuccessor, a tool specifically designed to exploit the BadSuccessor vulnerability, targeting privilege escalation within WinServer 2025 Active Directory environments. Successful execution of SharpSuccessor can enable attackers to gain domain admin privileges, potentially compromising the integrity of the entire Active Directory infrastructure. SharpSuccessor operates by impersonating accounts and executing commands that escalate privileges without proper authorization.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Privileged Escalation** (TA-0004)
    - Technique: **Exploitation of Vulnerabilities** (T1068)

  The primary data sources for detecting this activity include process creation logs from Windows systems, which will capture instances of the SharpSuccessor executable being run along with its command line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for instances of `SharpSuccessor.exe` and examine the command line arguments for any suspicious usage patterns indicating privilege escalation attempts.
  - **Analyze Scheduled Tasks:** Investigate for any newly created or modified scheduled tasks that involve `SharpSuccessor.exe`, which might indicate a persistent threat or automated exploitation efforts.
  - **Correlate User Activity:** Look into the user accounts associated with the execution of SharpSuccessor to determine if any unauthorized accounts are being used to execute the tool or if legitimate accounts are being impersonated suspiciously.
  - **Check Active Directory Logs:** Review Active Directory logs for any unusual authentication events or privilege escalations following the execution of SharpSuccessor, paying attention to changes in group memberships or permission escalation.

  ### Prioritization
  The alert is categorized as high severity due to the significant impact potential of successful privilege escalation, as it can lead to full domain control by attackers. The likelihood of this tool being utilized in a targeted attack against enterprise environments underscores the necessity for prompt investigation.

  ### Blind Spots and Assumptions
  This detection may not capture all variants or altered executions of SharpSuccessor if the attacker modifies its name or execution parameters to obfuscate their activity. The logic assumes that the execution of this tool will be logged in process creation events and that all relevant logging mechanisms are enabled in the Windows environment. Required logs include detailed process creation logs and appropriate configurations to ensure comprehensive visibility over system processes.

