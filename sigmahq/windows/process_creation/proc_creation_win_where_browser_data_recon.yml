title: Suspicious Where Execution
id: 725a9768-0f5e-4cb3-aec2-bc5719c6831a
status: test
description: |
  Adversaries may enumerate browser bookmarks to learn more about compromised hosts.
  Browser bookmarks may reveal personal information about users (ex: banking sites, interests, social media, etc.) as well as details about
  internal network resources such as servers, tools/dashboards, or other related infrastructure.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1217/T1217.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-13
modified: 2022-06-29
tags:
- attack.discovery
- attack.t1217
logsource:
  category: process_creation
  product: windows
detection:
  where_exe:
  - Image|endswith: '\where.exe'
  - OriginalFileName: 'where.exe'
  where_opt:
    CommandLine|contains:
            # Firefox Data
    - 'places.sqlite'
    - 'cookies.sqlite'
    - 'formhistory.sqlite'
    - 'logins.json'
    - 'key4.db'
    - 'key3.db'
    - 'sessionstore.jsonlz4'
            # Chrome Data
    - 'History'
    - 'Bookmarks'
    - 'Cookies'
    - 'Login Data'
  condition: all of where_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the execution of the **where.exe** process, which is leveraged by attackers to enumerate browser bookmarks and potentially retrieve sensitive information. The likely attacker objective is to gather personal details or internal resources that may assist in further exploitation or lateral movement within the network. This activity aligns with the **Discovery** tactic, specifically the **T1217: Browser Bookmark Enumeration** technique.

  Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688 and Sysmon Event ID 1) capturing execution details of the **where.exe** process and possibly related file access notifications from the file system. If this activity is malicious, it may expose user credentials or internal system details, enabling advanced attacks. However, this detection alone does NOT confirm that the bookmarks have been successfully extracted or leveraged for compromise.

  ### Investigation Steps

  - **Identify Process Creation Events:** Query Security Event ID 4688 logs for occurrences of **where.exe** executed. Check for suspicious parent process IDs that could suggest a malicious context.

  - **Analyze Command Line Arguments:** Review any associated command line strings in the logs for patterns indicative of bookmark enumeration such as file paths containing **places.sqlite**, **History**, or **Bookmarks**.

  - **Correlate with User Activity:** Compare findings to user activity logs (e.g., via Event ID 4624 - Successful logon) to determine if **where.exe** was invoked by a legitimate user or an unexpected account, noting user roles and access rights.

  - **Review Related File Access:** Inspect file system logs for accesses to known browser data files such as **~/.mozilla/firefox/*.default/places.sqlite** or **~/.config/google-chrome/Default/Bookmarks**. Legitimate use would involve standard web browser functionality, not unusual usernames or non-default paths.

  - **Identify Malicious Indicators:** Confirm the execution of **where.exe** outside of expected user workflows or on systems not commonly associated with browser usage to raise confidence in malicious intent.

  - **Evaluate for False Positives:** Document any contextual user behavior that could trigger this alert, such as legitimate low-level background tasks by IT admins or website debugging tools, which may utilize browser data without malicious intent.

  ### Prioritization

  The alert is of **low** severity based on its potential impact, as it typically targets non-critical information. While this behavior may indicate malicious reconnaissance, it is less likely to lead to immediate compromise than more aggressive techniques. However, its occurrence could signal preparatory steps before more serious attacks.

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers use disguised or modified versions of **where.exe** to avoid triggering alerts. Reliable detection requires comprehensive logging of process creation events and file system changes. Legitimate user actions, such as system updates or browser migrations, that invoke the same files may also trigger the alert. To enhance coverage, monitoring for other discovery techniques such as T1087: Account Discovery may provide complementary insights.

