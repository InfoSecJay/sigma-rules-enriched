title: Suspicious Where Execution
id: 725a9768-0f5e-4cb3-aec2-bc5719c6831a
status: test
description: |
  Adversaries may enumerate browser bookmarks to learn more about compromised hosts.
  Browser bookmarks may reveal personal information about users (ex: banking sites, interests, social media, etc.) as well as details about
  internal network resources such as servers, tools/dashboards, or other related infrastructure.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1217/T1217.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2021-12-13
modified: 2022-06-29
tags:
- attack.discovery
- attack.t1217
logsource:
  category: process_creation
  product: windows
detection:
  where_exe:
  - Image|endswith: '\where.exe'
  - OriginalFileName: 'where.exe'
  where_opt:
    CommandLine|contains:
            # Firefox Data
    - 'places.sqlite'
    - 'cookies.sqlite'
    - 'formhistory.sqlite'
    - 'logins.json'
    - 'key4.db'
    - 'key3.db'
    - 'sessionstore.jsonlz4'
            # Chrome Data
    - 'History'
    - 'Bookmarks'
    - 'Cookies'
    - 'Login Data'
  condition: all of where_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This Sigma rule detects the execution of the `where.exe` command-line utility, which may be used by adversaries to enumerate browser bookmarks and other browser-related files, such as history and cookies. By accessing this data, attackers can gather sensitive information about users’ online behavior, potential financial assets, and internal resources. The scenario often arises during post-exploitation stages, where an attacker seeks to map out the environment and extract useful credentials or information (e.g., banking sites, internal tools).

  The relevant MITRE ATT&CK tactics involved in this behavior are **Discovery** (TA0007) as the adversary is seeking to learn information about the compromised systems. Specifically, the technique being detected is **Browser Bookmark Enumeration** (T1217), which can inform an attacker of organizational structures, user habits, and vulnerabilities.

  To effectively gather evidence of this behavior, primary data sources would include **process creation events**, which log details about executed commands, and **command-line arguments** that reveal specific inquiries made by users or, in this case, potential adversaries.

  ### Investigation Steps
  - **Identify Process Creation Events:** Review process creation logs for instances where `where.exe` was executed, focusing on unusual command-line arguments that reference browser-related files.
  - **Analyze Command-Line Arguments:** Investigate the command-line parameters associated with `where.exe`. Pay particular attention to entries indicating access to browser data files such as `places.sqlite`, `History`, or `Bookmarks`.
  - **Review User Activity Context:** Correlate the `where.exe` executions with user account activity logs to determine if there was any legitimate business purpose. This can involve monitoring recent login events or accessing sensitive resources.
  - **Monitor for Anomalous Behavior:** Set up alerts for additional signs of enumeration or scanning behavior following the execution of this command, especially from unauthorized accounts or on endpoints where no browser data should reside.

  ### Prioritization
  This alert is classified as low severity as the execution of `where.exe` could also be part of legitimate workflows; however, it carries implications for potential reconnaissance by unauthorized users, warranting further investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage concerning legitimate uses of `where.exe`, as normal administrative scripts or user actions could trigger these events without malice. The detection logic assumes that all executions of `where.exe` with specific command-line arguments are suspect; however, it does not account for scripted or automated tasks that might perform similar queries. For the alert to function optimally, process creation logs must be enabled and configured correctly, capturing detailed command-line logs.

