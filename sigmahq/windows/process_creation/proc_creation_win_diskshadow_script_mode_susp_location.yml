detection:
  selection_img:
  - OriginalFileName: 'diskshadow.exe'
  - Image|endswith: '\diskshadow.exe'
  selection_cli:
    CommandLine|contains|windash: '-s '
  selection_paths:
    CommandLine|contains:
            # Note: Add additional susp paths based on your org needs
    - ':\Temp\'
    - ':\Windows\Temp\'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '\ProgramData\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- False positives may occur if you execute the script from one of the paths mentioned
  in the rule. Apply additional filters that fits your org needs.
level: medium
note: |
  ### Technical Context
  This detection rule identifies when the Windows command-line utility `Diskshadow.exe` is executed in script mode using the `/s` flag, specifically from potentially suspicious locations such as Temp directories or user profile paths. The execution of this command, particularly from non-standard locations, may indicate malicious behavior, often associated with data exfiltration or persistence mechanisms used by threat actors to access or manipulate Volume Shadow Copies (VSS).

  Threat actors may exploit `Diskshadow.exe` to create shadow copies of the NTDS.dit file, which contains sensitive Active Directory information. This behavior is concerning as it aligns with tactics employed by various threat families to gain unauthorized access to credentials or to maintain persistence in a compromised environment. The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1218) and **Credential Dumping** (T1003).

  Primary telemetry sources for this rule include process creation logs, which capture details about executables run on the system, as well as command-line arguments that provide insight into the operational context during execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `diskshadow.exe` execution. Pay close attention to the command-line parameters used and the paths from which it was executed.

  - **Check Script Source:** Investigate the contents of the script executed with the `/s` flag by locating it in the suspicious file paths identified (e.g., Temp directories, AppData) and examining its content for suspicious commands or payloads.

  - **Evaluate User Behavior:** Assess whether the user or system account executing `diskshadow.exe` has a valid business justification for running scripts from these locations. Look for anomalous patterns of behavior, especially for accounts with administrative privileges.

  - **Monitor for Related Artifacts:** Look for other related indicators of compromise in the environment, including unusual access to VSS or NTDS.dit, and correlate any findings with existing threat intelligence.

  ### Prioritization
  The alert is marked as medium severity due to the potential for significant impact, including unauthorized access to sensitive credentials. Given the misuse of `Diskshadow.exe`, rapid identification and investigation are critical to mitigate the risk of broader exploitation or data exfiltration.

  ### Blind Spots and Assumptions
  The detection logic may miss legitimate use cases where `diskshadow.exe` is executed from standard paths for valid operations. There may also be gaps in detection if logs from process creation are not fully captured or if paths deviating from those noted in the rule are employed maliciously. The successful detection relies on comprehensive logging configurations that capture process creation events and command execution details.

