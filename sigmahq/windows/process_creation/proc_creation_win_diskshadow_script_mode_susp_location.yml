detection:
  selection_img:
  - OriginalFileName: 'diskshadow.exe'
  - Image|endswith: '\diskshadow.exe'
  selection_cli:
    CommandLine|contains|windash: '-s '
  selection_paths:
    CommandLine|contains:
            # Note: Add additional susp paths based on your org needs
    - ':\Temp\'
    - ':\Windows\Temp\'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '\ProgramData\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- False positives may occur if you execute the script from one of the paths 
  mentioned in the rule. Apply additional filters that fits your org needs.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `diskshadow.exe` in script mode, specifically targeting instances where the command includes the `/s` flag and the script is found in potentially suspicious locations (e.g., Temp folders or user profile directories). The likely objective of an attacker utilizing this method could range from creating shadow copies of data for later retrieval (potential data exfiltration) to maintaining persistence through backup mechanisms. This behavior aligns with the MITRE ATT&CK technique for "Command and Scripting Interpreter" (T1218).

  The primary telemetry source is Windows process creation logs, particularly focusing on Process Creation events (Event ID 4688) that capture the command line arguments associated with `diskshadow.exe`. If malicious, the impact could lead to unauthorized data access or manipulation. It is important to clarify that while this detection identifies suspicious usage of `diskshadow.exe`, it does NOT confirm malicious intent on its own, as there are legitimate contexts in which this command can be used.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Windows Security Event ID 4688 logs for instances of `diskshadow.exe` being executed, focusing on the CommandLine field for the `/s` switch and suspicious path locations such as `C:\Temp\`, `C:\Windows\Temp\`, and user-specific directories.

  - **Validate Script Path Legitimacy**: Determine if the script being executed in script mode exists within well-known or appropriate administrative directories. Legitimate use cases typically involve scripts stored in secure administrative shares or designated script repositories, not transient locations like Temp directories.

  - **Identify Malicious Indicators**: Look for indicators such as unusually named scripts or those that contain obfuscation within the `CommandLine` arguments. For example, a script named with random characters may indicate an attempted evasion strategy.

  - **Cross-Reference Past Alerts**: Investigate if this execution is linked to any previous alerts or documented incidents involving `diskshadow.exe`, noting any patterns in execution context that imply malicious behavior.

  - **Examine Related Artifact Creation**: If `diskshadow.exe` is used for shadow copy creation, check for the existence of shadow copies through commands like `vssadmin list shadows`. Confirming unauthorized listings can indicate potential data exposure.

  - **Analyze User Context and Asset Significance**: Consider the role of the user initiating the command. Executions by non-admin accounts on critical servers should be flagged for heightened scrutiny given the potential for lateral movement or data manipulation.

  ### Prioritization

  This alert has medium severity due to the potential risk involved with unauthorized access to shadow copies of data, especially if performed on critical systems. The use of `diskshadow.exe` inappropriately is not commonly weaponized in all environments, but its misuse can indicate an evolving attacker methodology, meriting timely investigation.

  ### Blind Spots and Assumptions

  Detection may miss executions of `diskshadow.exe` from legitimate administrative scripts or benign scenarios. A reliance on process creation logs necessitates proper logging configurations to catch all relevant events, especially on systems where logging may be restricted. Legitimate administrative tasks or maintenance scripts that utilize `diskshadow.exe` may inadvertently trigger this alert, particularly if executed from user directories. Related detections, such as monitoring process creation anomalies or specific patterns of command-line arguments used with administrative tools, enhance coverage against misuse.

