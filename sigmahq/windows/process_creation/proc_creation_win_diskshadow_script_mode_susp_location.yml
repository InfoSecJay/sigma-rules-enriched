detection:
  selection_img:
  - OriginalFileName: 'diskshadow.exe'
  - Image|endswith: '\diskshadow.exe'
  selection_cli:
    CommandLine|contains|windash: '-s '
  selection_paths:
    CommandLine|contains:
            # Note: Add additional susp paths based on your org needs
    - ':\Temp\'
    - ':\Windows\Temp\'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '\ProgramData\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- False positives may occur if you execute the script from one of the paths 
  mentioned in the rule. Apply additional filters that fits your org needs.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of "Diskshadow.exe" in script mode with the "/s" flag, specifically when the script resides in potentially suspicious locations such as system temporary folders or user directories. Adversaries might exploit this behavior to manipulate Volume Shadow Copies (VSS) for data exfiltration or persistence, indicating a credential access or defense evasion objective. This behavior aligns with MITRE ATT&CK's **Tactic: Defense Evasion** (ID: TA0005) and **Technique: Windows Command Shell** (T1218).

  The primary telemetry source is Windows Process Creation logs, utilizing Security Event ID 4688 and Sysmon Event ID 1 to capture relevant command line arguments and executable images. If malicious, this action could allow an attacker unauthorized access to sensitive data or system modifications. Importantly, this detection does not confirm that a compromise has occurred without additional corroborating evidence such as suspicious actions following the execution.

  ### Investigation Steps

  - **Review Event Logs:** Investigate Security Event ID 4688 and Sysmon Event ID 1 for process creation entries associated with "diskshadow.exe" and identify the exact command line used during execution.

  - **Identify Suspicious Command Line Parameters:** Check for command lines containing "/s" indicating script execution. Combine this with telemetry retrieving fields where the command line outputs refer to directories like `C:\Temp\` or `C:\Users\Public\` as potentially suspicious.

  - **Validate Origin of Script:** Determine the path of the script file executed with Diskshadow. Legitimate administrative tasks may involve running scripts from controlled scripts repositories, while scripts in user profile directories or temp folders indicate higher risk.

  - **Correlate Additional Activities:** Look for any child processes spawned from Diskshadow.exe within a short time frame (e.g., Event IDs indicating process creation above 5000 - Sysmon Event ID 1). A related suspicious behavior could be credential dumping or file modifications shortly after.

  - **Check for Normal Usage:** Understand expected behavior of Diskshadow, particularly if it’s being used for regular backups or VSS management in your environment. Confirm ongoing legitimate administrative practices to validate non-malicious activity.

  - **Assess Asset Criticality:** Identify if the alerted system has access to sensitive data or is a key asset in the infrastructure. This will help prioritize the urgency of the investigation.

  ### Prioritization

  This alert carries medium severity due to the potential impact on systems critical for data integrity and availability. The likelihood of malicious use is moderate, with Diskshadow commonly weaponized for data exfiltration and persistence techniques. Rapid response may be necessary to prevent further exploitation.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative scripts may also execute from the identified suspicious paths, creating false positives. Proper logging configurations must include detailed process creation logs to ensure comprehensive coverage. It's essential to remain aware that disk shadowing often occurs for legitimate backups. A companion detection to consider is alerts for file access involving `ntds.dit`, which can be a target following things like disk shadow manipulation.

