note: |
  ### Technical Context
  This detection rule identifies suspicious activity related to the spawning of Chromium-based browser instances with the usage of custom extensions. The presence of the `--load-extension=` flag in the command line can indicate that an attacker is trying to manipulate the browser to perform malicious activities, such as data exfiltration, information gathering, or delivery of further malicious payloads. This technique can also be leveraged to bypass security controls and evade detection by executing custom or malicious code within a commonly used application.

  The suspected threat family here relates to browser-based attacks, which can utilize tactics like **Persistence** (T1547) and **Command and Control** (T1071). The attacker’s goal is likely to maintain a foothold in the environment by manipulating trusted applications to execute custom logic that may be undetectable through traditional monitoring.

  Relevant MITRE ATT&CK techniques include:
  - **T1176.001: Browser Bookmark/Extension Manipulation** - the tactic of using custom extensions to extend browser capabilities illegally.

  The primary data sources necessary for this detection include:
  - **Process creation logs** (from EDR or the OS), which would capture the command line arguments used when launching browser instances.
  - Event logs that track the execution of parental processes (e.g., PowerShell, command prompt) that could invoke these browser instances.

  ### Investigation Steps
  - **Check Process Creation Logs**: Review process creation logs for instances of Chromium-based browsers (e.g., `chrome.exe`, `brave.exe`) initiated by potentially suspicious parent processes such as `cmd.exe`, `powershell.exe`, and `mshta.exe`. Look specifically for the `--load-extension=` flag in the command line.

  - **Analyze Parent Process Behavior**: Investigate the actions taken by the parent processes leading to the suspicious browser spawn. Determine if they have a legitimate reason for their invocation, especially searching for unusual patterns of execution or command line arguments.

  - **Correlate Network Activity**: Examine outbound network traffic for connections initiated by the suspicious browser instances to identify potential data exfiltration, command and control, or further malware downloads. Pay attention to unusual domains or IP addresses that may indicate malicious activity.

  - **Evaluate Browser Extension Activity**: If applicable, inspect installed browser extensions on affected machines. Determine if there are any unauthorized or suspicious extensions installed and seek to understand their permissions and functionalities.

  ### Prioritization
  This alert is considered high severity due to the potential impact of browser manipulation by attackers, which can result in data breaches or further compromise of internal systems. The likelihood of such attacks is increased given the widespread use of browsers in enterprise environments, making detection and response vital.

  ### Blind Spots and Assumptions
  There may be gaps in detection if logging levels are insufficient to capture detailed process creation events or if command line logging is not enabled. The detection logic assumes that the presence of the command line flag `--load-extension=` in conjunction with a Chromium-based browser execution is indicative of malicious intent. Additionally, this detection method relies on accurate logging configurations across all endpoints where such processes could occur, and false positives may arise if legitimate applications utilize similar command line operations.

