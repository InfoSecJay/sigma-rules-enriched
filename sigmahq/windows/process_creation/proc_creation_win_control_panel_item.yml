logsource:
  product: windows
  category: process_creation
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cli:
    CommandLine|contains|all:
    - 'add'
    - 'CurrentVersion\Control Panel\CPLs'
  selection_cpl:
    CommandLine|endswith: '.cpl'
  filter_cpl_sys:
    CommandLine|contains:
    - '\System32\'
    - '%System%'
    - '|C:\Windows\system32|'
  filter_cpl_igfx:
    CommandLine|contains|all:
    - 'regsvr32 '
    - ' /s '
    - 'igfxCPL.cpl'
  condition: all of selection_reg_* or (selection_cpl and not 1 of filter_cpl_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of malicious Control Panel items, specifically monitoring for unusual command line usage related to registry manipulation and Control Panel files. The likely objective of an attacker is to achieve persistence and elevate privileges by executing .cpl files through Windows tools like `reg.exe` or `regsvr32`. This behavior falls under the MITRE ATT&CK tactics of Execution (T1203) and Privilege Escalation (T1546). Primary telemetry sources include Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1) that capture details about the executed processes and their command lines. If confirmed malicious, this activity can enable an attacker to maintain a foothold within the environment. However, this detection alone does not confirm the intent or capability of an actor; further investigation is necessary to ascertain malignancy.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for processes spawned that include `reg.exe`, `regsvr32`, or any `.cpl` files in the CommandLine field to identify initial execution.

  - **Analyze CommandLine parameters:** Look specifically for command lines containing 'add' and 'CurrentVersion\Control Panel\CPLs' within `reg.exe` invocations associated with suspicious PID or user accounts.

  - **Identify legitimate behavior:** Confirm if the execution of .cpl files is being performed by expected system processes or admins. Typical benign command lines should reference standard control panel items and not manipulate registry keys or invoke unusual command-line arguments.

  - **Investigate encoded or obfuscated parameters:** Examine any command lines for suspiciously encoded or obfuscated parameters, especially focusing on any use of `regsvr32` combined with user-defined cpl files (e.g., `igfxCPL.cpl`) that should be reviewed for legitimacy.

  - **Assess asset criticality:** Focus on systems critical for operations or sensitive data. As execution of malicious Control Panel items could affect system integrity, prioritize investigations involving domain controllers or critical infrastructure.

  - **Correlate with other telemetry:** Verify user behavior via authentication logs or recent account activity to assess if unrelated system administrators or users performed the actions around the same time.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and the capacity for privilege escalation. The likelihood of malicious abuse is elevated, given that attackers often leverage Control Panel items for stealthy persistence methods. Such behavior is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative, non-standard tools or encoded command lines that conceal the actual operations taking place. Reliable detection requires comprehensive logging configurations enabled for both process creation and command line arguments. Legitimate administrative tools and configuration changes may trigger the alert, especially in environments with extensive user training on system customization. A companion detection to strengthen coverage could include monitoring for unusual registry edits associated with the control panel or unauthorized changes in `HKEY_CURRENT_USER`.

