title: Control Panel Items
id: 0ba863e6-def5-4e50-9cea-4dd8c7dc46a4
status: test
description: Detects the malicious use of a control panel item
references:
- https://ired.team/offensive-security/code-execution/code-execution-through-control-panel-add-ins
author: Kyaw Min Thein, Furkan Caliskan (@caliskanfurkan_)
date: 2020-06-22
modified: 2023-10-11
tags:
- attack.privilege-escalation
- attack.execution
- attack.defense-evasion
- attack.t1218.002
- attack.persistence
- attack.t1546
logsource:
  product: windows
  category: process_creation
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cli:
    CommandLine|contains|all:
    - 'add'
    - 'CurrentVersion\Control Panel\CPLs'
  selection_cpl:
    CommandLine|endswith: '.cpl'
  filter_cpl_sys:
    CommandLine|contains:
    - '\System32\'
    - '%System%'
    - '|C:\Windows\system32|'
  filter_cpl_igfx:
    CommandLine|contains|all:
    - 'regsvr32 '
    - ' /s '
    - 'igfxCPL.cpl'
  condition: all of selection_reg_* or (selection_cpl and not 1 of filter_cpl_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity associated with the execution of Control Panel items, particularly through the execution of registry commands and related Control Panel item (.cpl) files. Attackers may leverage these mechanisms to achieve persistence, execute arbitrary code, or elevate privileges within a Windows environment. The rule is designed to catch behaviors that deviate from normal operational patterns, indicating potential exploitation.

  The rule aligns with several MITRE ATT&CK techniques that attackers may use, notably:
  - **T1218.002 - System Firmware (CPL File Execution)**: Using Control Panel items for code execution.
  - **T1546 - Event Triggered Execution**: Exploiting system events for execution purposes.
  - **T1060 - Registry Run Keys / Startup Folder**: Utilizing registry modifications for persistence.
  - **T1071.001 - Application Layer Protocol: Web Protocols**: If the command line indicates that the execution is being invoked through web communication.

  Key telemetry sources to monitor include Windows process creation logs, which provide insights into the executed commands and associated images, as well as the registry activity logs that show modifications tied to Control Panel features.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for `reg.exe` execution, focusing on command lines that manipulate the registry, especially those adding Control Panel items.
  - **Analyze Command Line Arguments**: Investigate instances where command line inputs contain paths to `.cpl` files, noting the use of unusual or unexpected Control Panel items.
  - **Check Registry Modifications**: Audit the Registry for changes ensuring that new Control Panel items or modifications align with expected administrative activity and do not indicate malicious intent.
  - **Correlate with User Activity**: Assess the timing and origin of the command executions against known user activity to determine if they were initiated by legitimate users or indicative of potential compromise.

  ### Prioritization
  The severity of this alert is high in an enterprise environment due to the potential for privilege escalation and persistence that can be achieved through the manipulation of system control items. Given the ease of code execution via such methods, swift response is warranted to mitigate risks.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if attackers employ obfuscation techniques or use non-standard paths for executing legitimate Control Panel items not covered by the filters. The detection logic assumes standard operational behavior surrounding registry access and Control Panel usage; any deviations could result in missed detections. Additionally, proper logging configurations for process creation and registry activities must be in place for the rule to function effectively.

