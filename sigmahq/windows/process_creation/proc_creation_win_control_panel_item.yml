logsource:
  product: windows
  category: process_creation
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cli:
    CommandLine|contains|all:
    - 'add'
    - 'CurrentVersion\Control Panel\CPLs'
  selection_cpl:
    CommandLine|endswith: '.cpl'
  filter_cpl_sys:
    CommandLine|contains:
    - '\System32\'
    - '%System%'
    - '|C:\Windows\system32|'
  filter_cpl_igfx:
    CommandLine|contains|all:
    - 'regsvr32 '
    - ' /s '
    - 'igfxCPL.cpl'
  condition: all of selection_reg_* or (selection_cpl and not 1 of filter_cpl_*)
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of Control Panel items, particularly through malicious use of the Windows Registry and control panel files (CPLs). Attackers may leverage this technique to gain unauthorized access or escalate privileges, utilizing Control Panel items to execute arbitrary commands or manipulate the system. Relevant MITRE ATT&CK tactics and techniques include: Execution (T1203) and Defense Evasion (T1546).

  Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688 and Sysmon Event ID 1) related to command execution and potential malicious script processes. If malicious, this behavior can lead to significant compromise of system integrity and confidentiality. However, this detection does NOT confirm that the activity is definitively malicious without further context.

  ---

  ### Investigation Steps

  - **Review process creation logs for relevant activity:** Check for Security Event ID 4688 and Sysmon Event ID 1 for process creation events involving 'reg.exe' and command lines that include 'add' and 'CurrentVersion\Control Panel\CPLs'.

  - **Analyze command line arguments:** Inspect command line details for any processes ending with '.cpl' and look specifically for `regsvr32` execution with 'igfxCPL.cpl' without expected arguments, indicating potential exploitation (e.g., '/s').

  - **Verify legitimate behavior patterns:** Document expected legitimate usage of control panel items by internal teams, such as system administrators executing CPLs for configurations, and confirm these do not align with the alert's characteristics.

  - **Identify high-confidence indicators of compromise:** Look for instances where 'reg.exe' is executed with suspicious paths or unknown arguments, particularly those not originating from reputable system processes.

  - **Cross-reference with historical logs and incidents:** Compare current findings with past incidents involving control panel item exploitation, to assess patterns or reoccurring behaviors that align with known attack methodologies.

  - **Check the criticality of affected hosts:** Determine if the affected system is a high-privileged machine or server that could amplify the impact of a potential compromise.

  ---

  ### Prioritization

  This alert is of high severity, especially if it involves systems with elevated privileges or sensitive data. The likelihood of malicious abuse is significant, as this behavior is a known method for attackers to manipulate system settings and gain unwanted access, thereby warranting urgent attention.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as modifying legitimate scripts or hiding in benign applications. Reliable detection requires comprehensive logging from Windows process creation, which must be enabled. Legitimate activities that may trigger this alert include IT staff executing control panel items for maintenance. A related detection that strengthens overall monitoring includes the use of abnormal Parent-Child process relationships, which can indicate suspicious activity.

