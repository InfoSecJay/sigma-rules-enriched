title: Control Panel Items
id: 0ba863e6-def5-4e50-9cea-4dd8c7dc46a4
status: test
description: Detects the malicious use of a control panel item
references:
- https://ired.team/offensive-security/code-execution/code-execution-through-control-panel-add-ins
author: Kyaw Min Thein, Furkan Caliskan (@caliskanfurkan_)
date: 2020-06-22
modified: 2023-10-11
tags:
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1218.002
- attack.persistence
- attack.t1546
logsource:
  product: windows
  category: process_creation
detection:
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_cli:
    CommandLine|contains|all:
    - 'add'
    - 'CurrentVersion\Control Panel\CPLs'
  selection_cpl:
    CommandLine|endswith: '.cpl'
  filter_cpl_sys:
    CommandLine|contains:
    - '\System32\'
    - '%System%'
    - '|C:\Windows\system32|'
  filter_cpl_igfx:
    CommandLine|contains|all:
    - 'regsvr32 '
    - ' /s '
    - 'igfxCPL.cpl'
  condition: all of selection_reg_* or (selection_cpl and not 1 of filter_cpl_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the usage of malicious Control Panel items, particularly through the execution of `reg.exe` for manipulating the Windows Registry, alongside attempts to register Control Panel files (`.cpl`). The likely attacker objective is to execute arbitrary code or maintain persistence by leveraging legitimate system processes to avoid detection. This technique aligns with the MITRE ATT&CK framework’s Tactics and Techniques: "Privilege Escalation" (TA0004, T1218.002: Signed Binary Proxy Execution) and "Persistence" (T1546: Event Triggered Execution).

  The primary telemetry source is process creation logs, specifically from Windows systems. Key log types include Security Event ID 4688 (process creation) and Sysmon Event ID 1. The security impact if this activity is malicious could lead to system compromise or a foothold in the environment. Importantly, this detection does NOT confirm that the detected command was executed with malicious intent; it simply identifies abnormal usage patterns.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 for related processes. Focus on instances where `reg.exe` is invoked with arguments related to Control Panel items to identify malicious execution patterns.

  - **Analyze Command Line Parameters:** Inspect the CommandLine field for occurrences of `add` and `CurrentVersion\Control Panel\CPLs`. Validate whether these invocations pertain to known legitimate applications or system functions.

  - **Identify High-Confidence Malicious Indicators:** Look for `regsvr32` calls in the CommandLine that include `.cpl` files (e.g., `igfxCPL.cpl`). This specific combination can indicate an attempt to exploit the Control Panel functionality for malicious purposes.

  - **Baseline Legitimate Usage:** Observe typical usage patterns for `reg.exe` when updating or configuring legitimate software. Legitimate CommandLines will generally not invoke Control Panel item manipulation outside of administrative tasks.

  - **Assess Log File Presence:** Verify the creation of new files or modifications to system files linked to Control Panel settings. Instances of recently modified `.cpl` files in `C:\Windows\System32` can indicate potential tampering.

  - **Evaluate Host Role:** If the investigation involves a critical asset (e.g., a domain controller), escalate findings for immediate review due to higher risks associated with privilege escalation.

  ### Prioritization

  This alert is high severity given its potential impact. The presence of Control Panel exploits often indicates an attempt to gain elevated privileges or maintain persistence within the network. Such tactics are commonly weaponized by adversaries to circumvent security measures often put in place.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for certain privileged operations or evasion techniques like command obfuscation. Required log sources include detailed process creation logs, which must be correctly configured for thorough monitoring. Legitimate activities, such as software installations or resets, may also trigger the alert. A related detection to strengthen coverage would be monitoring for abnormal use of `mshta.exe`, which can also be exploited for malicious execution.

