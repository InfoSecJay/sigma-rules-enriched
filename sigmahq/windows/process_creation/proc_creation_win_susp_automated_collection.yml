title: Automated Collection Command Prompt
id: f576a613-2392-4067-9d1a-9345fb58d8d1
status: test
description: Once established within a system or network, an adversary may use automated
  techniques for collecting internal data.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.001/T1552.001.md
author: frack113
date: 2021-07-28
modified: 2022-11-11
tags:
- attack.collection
- attack.t1119
- attack.credential-access
- attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_ext:
    CommandLine|contains:
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.rtf'
    - '.pdf'
    - '.txt'
  selection_other_dir:
    CommandLine|contains|all:
    - 'dir '
    - ' /b '
    - ' /s '
  selection_other_findstr:
    OriginalFileName: 'FINDSTR.EXE'
    CommandLine|contains:
    - ' /e '
    - ' /si '
  condition: selection_ext and 1 of selection_other_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies automated collection activities commonly employed by adversaries to extract internal documents and files from compromised systems or networks. Attackers often utilize scriptable tools and commands to streamline the collection process, targeting common document formats that could be sensitive or valuable. By executing commands that list or search for document files, adversaries are able to gather intelligence or sensitive information without raising immediate alarms.

  The likely attacker objectives are to harvest data such as confidential reports, credentials stored in documents, or other sensitive business information that can aid in further exploitation or data breaches. This behavior is associated with the MITRE ATT&CK tactics of Collection (T1119) and Credential Access (T1552.001), which indicates a focus on gathering and exploiting sensitive information.

  Key data sources for detecting these activities include Windows process creation logs, which capture detailed command line activity, as well as any logs that capture file access or enumeration commands. By analyzing these logs, security teams can identify patterns indicative of automated collection attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs for commands that involve document file extensions such as .doc, .xls, and .pdf, focusing on the command line arguments used during execution.

  - **Inspect Command Line Arguments**: Pay close attention to the use of directory listing or recursive search commands, such as "dir /b" or "dir /s," which indicate attempts to systematically locate files across directories.

  - **Analyze FINDSTR Command Usage**: Investigate instances where FINDSTR.EXE is invoked, particularly with command line options suggesting broad text searches (e.g., '/e', '/si'), as these indicate automated attempts to locate specific content within documents.

  - **Correlate with User Behavior**: Cross-reference identified command usage with user behavior patterns to determine if the actions appear anomalous or fit a legitimate business need, prioritizing investigation of unusual or high-privilege user accounts.

  ### Prioritization
  The alert is rated as medium priority due to the potential risk of sensitive document extraction, which could lead to data breaches or further attacks. However, detection is contextually dependent on the legitimacy of user activity and requires additional investigation to avoid false positives.

  ### Blind Spots and Assumptions
  Detection logic may miss adversarial activities that utilize alternative methods for data exfiltration or less common file types. An assumption is made that all relevant logs are being generated and retained, particularly process creation logs with command line details. It is crucial to ensure proper logging settings are enabled on all endpoints to support detection and that any scripts or legitimate automation tasks are considered in the analysis to reduce false alerts.

