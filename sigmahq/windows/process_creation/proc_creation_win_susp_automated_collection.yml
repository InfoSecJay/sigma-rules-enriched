logsource:
  category: process_creation
  product: windows
detection:
  selection_ext:
    CommandLine|contains:
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.rtf'
    - '.pdf'
    - '.txt'
  selection_other_dir:
    CommandLine|contains|all:
    - 'dir '
    - ' /b '
    - ' /s '
  selection_other_findstr:
    OriginalFileName: 'FINDSTR.EXE'
    CommandLine|contains:
    - ' /e '
    - ' /si '
  condition: selection_ext and 1 of selection_other_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the automated collection of documents and text files using specific command-line patterns commonly seen in adversarial behavior. The behavior likely indicates that an attacker has established a foothold in the environment and is attempting to gather sensitive internal data, often to facilitate data exfiltration or reconnaissance. The relevant MITRE ATT&CK tactics are **Collection** (TA0009) with techniques specifically noted as **Data from Local System** (T1119) and **Credentials from Password Stores** (T1552.001).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process execution details, alongside relevant command-line arguments. If malicious, this activity poses a significant security risk as it may lead to unauthorized data access and potential exfiltration. Importantly, this detection does NOT confirm a successful exfiltration or compromise, only that an automated collection activity has been flagged.

  ---

  ### Investigation Steps

  - **Examine process creation logs**: Review Security Event ID 4688 to identify instances of "cmd.exe" or similar processes executing with suspicious command-line flags, particularly those containing `dir /b`, `dir /s`, or using `FINDSTR.EXE`.

  - **Identify file types being accessed**: Look for command-line arguments that include file extensions like `.doc`, `.pdf`, or `.xlsx`. Confirm if files accessed align with known organizational data sources, assessing if this aligns with legitimate user behavior.

  - **Check for unusual user behavior**: Review user account activity around the time of the alert, including login patterns (Event ID 4624), focusing on any unusual timing (e.g., late-night access) or behavior that differs from established baselines.

  - **Analyze related file system changes**: Investigate for any document copying or strange modifications in directories typically associated with sensitive files (e.g., `C:\Users\[Username]\Documents`). Consider Volatile File System Events (Sysmon Event ID 11) for evidence of file manipulations.

  - **Evaluate host environment context**: Determine the criticality of the affected host; servers handling sensitive data should be scrutinized more closely, especially concerning data collection activities.

  - **Cross-reference alerts with threat intelligence**: Analyze whether the patterns from this alert have been associated with known threat actor tactics or malware signatures. Utilize threat intelligence platforms to correlate this activity with known malicious behaviors.

  ---

  ### Prioritization

  This alert is classified as medium severity. It signifies potential reconnaissance or preparatory actions for data theft, especially if it originates from a critical asset or a sensitive environment. The likelihood of weaponization is moderate, as automated collection commands suggest intent to gather sensitive information.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist if logging is not comprehensive or properly configured; without complete process creation logs, patterns may be missed. Legitimate activities, such as system maintenance tasks or automated backup scripts, may trigger this alert. A related detection that strengthens coverage is monitoring for data exfiltration indicators, such as large outbound data transfers or unusual file access patterns following this collection behavior.

