logsource:
  category: process_creation
  product: windows
detection:
  selection_ext:
    CommandLine|contains:
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.rtf'
    - '.pdf'
    - '.txt'
  selection_other_dir:
    CommandLine|contains|all:
    - 'dir '
    - ' /b '
    - ' /s '
  selection_other_findstr:
    OriginalFileName: 'FINDSTR.EXE'
    CommandLine|contains:
    - ' /e '
    - ' /si '
  condition: selection_ext and 1 of selection_other_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_automated_collection/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the automated collection of internal data by monitoring specific command line patterns. Attackers may automate data gathering for sensitive files, such as documents and spreadsheets, which can facilitate credential access or data exfiltration. The relevant MITRE ATT&CK techniques are Collection (T1119) and Credential Access via Input Data (T1552.001). Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide visibility into command execution details. If this behavior is determined to be malicious, it indicates a significant security threat to the organization, potentially leading to unauthorized data access or exfiltration. However, it is essential to note that this detection does not confirm malicious intent on its own; legitimate administrative tasks may trigger similar patterns.

  ### Investigation Steps

  - **Examine process creation events:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for any instances of the command line containing file extensions such as '.doc', '.xls', and '.pdf'. Look for suspicious parent processes like `cmd.exe` or `powershell.exe`.

  - **Check command execution patterns:** Analyze the command lines for instances containing parameters like 'dir ', ' /b ', or ' /s '. Legitimate usage usually involves explicit paths and concise parameters; abnormal parameters may indicate malicious automation.

  - **Identify usage of FINDSTR.EXE:** Look for processes where OriginalFileName is 'FINDSTR.EXE' and the command line includes options such as ' /e ' or ' /si '. Malicious use will typically have less discernible arguments than legitimate commands.

  - **Cross-reference user behavior:** Validate against typical user activity; if a user frequently accesses documents and spreadsheets but has no history of using automation commands, this may warrant further investigation.

  - **Correlate log sources for validation:** Use a SIEM tool to correlate command line activities with other logs, like file access logs, to determine if the detected commands correspond with file read events, indicating potential data collection attempts.

  - **Assess host criticality:** Identify if the affected system is a critical server or workstation. Important systems require a higher urgency in response due to the potential for severe data breaches if compromised.

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive data and the likelihood that attackers commonly employ these automated techniques for data collection. Systems identified may be critical assets containing sensitive information, thus warranting careful assessment.

  ### Blind Spots and Assumptions

  Detection is limited by the accuracy and completeness of logging; if process creation logs are not enabled or filtered, malicious behavior may go unnoticed. Legitimate administrative scripts or tools might generate similar command patterns, potentially resulting in false positives. Companion detections, such as monitoring for file access or creating file copies, strengthen coverage and give more context to potential data exfiltration activities.

