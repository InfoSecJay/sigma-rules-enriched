logsource:
  category: process_creation
  product: windows
detection:
  selection_ext:
    CommandLine|contains:
    - '.doc'
    - '.docx'
    - '.xls'
    - '.xlsx'
    - '.ppt'
    - '.pptx'
    - '.rtf'
    - '.pdf'
    - '.txt'
  selection_other_dir:
    CommandLine|contains|all:
    - 'dir '
    - ' /b '
    - ' /s '
  selection_other_findstr:
    OriginalFileName: 'FINDSTR.EXE'
    CommandLine|contains:
    - ' /e '
    - ' /si '
  condition: selection_ext and 1 of selection_other_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  The Sigma rule detects automated data collection through command line execution involving file extensions commonly associated with document formats (e.g., .doc, .pdf) and Windows command utilities (e.g., 'dir', 'findstr'). The primary objective of an attacker using this behavior is to gather sensitive information from files accessible on the compromised system, potentially leading to data exfiltration. This activity correlates with the MITRE ATT&CK technique T1119: Automated Collection and T1552.001: Credentials from Password Stores.

  The primary telemetry source for this detection is Windows process creation logs, particularly Security Event ID 4688, which logs command line activity. If leveraged by an adversary, this behavior poses a high security impact, as it indicates preparation for data theft. However, the detection alone does not confirm that malicious intent was behind the command; it merely highlights potential reconnaissance or preparatory activities.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of command line execution containing keyword patterns such as '.doc', '.xls', and 'dir '. Focus on the 'New Process Name' and 'Command Line' fields for any suspicious contexts.

  - **Identify key file access:** Cross-reference with File Access logs to determine if accessible files match the extensions listed in the command line. Look for recent modifications or accesses around the execution time to spot potential exfiltration targets.

  - **Correlate commands with user context:** Verify the user account executing the commands. Assess if the account has legitimate reasons for accessing those files based on job role and responsibilities to rule out benign activity.

  - **Look for indicators of compromise:** Flag instances of 'FINDSTR.EXE' with command line elements such as ' /e ' or ' /si '. Identify if these commands are used in combination with a known exploit or toolset commonly associated with data gathering.

  - **Audit expected behavior:** Identify typical commands executed by authorized users in similar use cases. For legitimate data collection, commands might include specific scripting actions or tool usage that align with business processes, without the use of automated tools or mass file access.

  ### Prioritization

  This alert is considered medium severity due to the sensitive nature of the file types involved and the potential for misuse in data exfiltration scenarios. While automated collection techniques are part of many legitimate administrative practices, their frequent use by malicious actors raises the likelihood of abuse in this context.

  ### Blind Spots and Assumptions

  The detection may be limited by noise from legitimate automation tools or scripts that engage with document files for valid purposes, possibly generating false positives. Essential log sources include ensuring comprehensive auditing is enabled on process creation and file access events. Legitimate activities, such as bulk content access for reporting purposes, may trigger this alert. A related detection to consider is monitoring for abnormal user behavior using User Behavior Analytics (UBA) focusing on file access patterns.

