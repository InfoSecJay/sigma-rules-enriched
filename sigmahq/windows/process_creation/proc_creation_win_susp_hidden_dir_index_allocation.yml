note: |
  ### Technical Context

  This Sigma rule detects command-line execution containing references to the NTFS "::$index_allocation" stream, which can be used to create hidden directories or files not easily accessible via standard tools like Windows Explorer. The likely attacker objective is to create concealed storage locations for malicious files or data exfiltration, thereby evading detection by conventional security tools. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" and the technique "Hidden Files and Directories" (T1564.004).

  The primary telemetry source for this detection is Windows process creation logs, particularly those that track command-line arguments executed by the process. If this behavior is malicious, it could facilitate various attack scenarios such as data exfiltration or persistence mechanisms. It is important to note that detecting this command line does NOT confirm that any malicious activity has taken place; it merely indicates potential misuse of the NTFS filesystem based on the command line observed.

  ### Investigation Steps

  - **Verify command line execution:** Review Process Creation logs (Security Event ID 4688 or Sysmon Event ID 1) for instances of command lines that include "::$index_allocation." Flag any occurrences for further analysis.

  - **Analyze process parent-child relationships:** Investigate the parent process of the detected command (look for unusual processes or command lines as parent instances). Event ID 4688 can provide insight here, where a legitimate process like `cmd.exe` spawning unexpected child processes may indicate malicious intent.

  - **Correlate with user activity:** Check for user context associated with the command execution, using event logs such as Security Event ID 4624 for logins. Determine if the user has legitimate reasons for accessing or modifying the filesystem in this manner.

  - **Assess file system impact:** Utilize tools like PowerShell or sysinternals to enumerate any hidden directories indexed by the NTFS stream. Check for unusual file indicators or modification timestamps that don’t align with regular business operations.

  - **Identify benign use cases:** Look for known processes or scripts within the organization that can legitimately use index allocation. Example benign indicators could include authorized system utilities or maintenance scripts that manipulate NTFS streams as part of their function.

  - **Investigate for high-confidence malicious indicators:** Specifically look for the existence of files or directories created via this method or any unusual data patterns, such as large files in hidden directories. Use file system auditing tools to check for anomalies in file access and creation logs across critical directories.

  ### Prioritization

  This alert is of medium severity due to the potential risk associated with the creation of undetectable storage locations within the filesystem. While not all hidden directories indicate malicious intent, this technique is known to be weaponized in various attack vectors, making timely investigation essential, particularly on critical systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of logging support through all tools, as traditional EDRs might not capture detailed attributes tied to NTFS streams unless specifically configured. Legitimate activities such as certain custom scripts or administrative tasks may inadvertently trigger this alert. A relevant companion detection could include monitoring for writing to "::$INDEX_ALLOCATION" in association with file creation or modification logs, enhancing visibility into potentially malicious activities.

