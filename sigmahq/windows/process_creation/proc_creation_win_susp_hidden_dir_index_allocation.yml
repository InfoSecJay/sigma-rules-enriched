detection:
  selection:
        # Note: Both Sysmon and ETW are unable to log the presence of such stream in the CommandLine. But EDRs such as Crowdstrike are able to using for example CMD console history. Users are advised to test this before usage
    CommandLine|contains: '::$index_allocation'
  condition: selection
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This detection rule identifies the command line usage of the "::$index_allocation" stream in Windows environments. The "::$index_allocation" feature in NTFS allows attackers to create hidden directories that may evade standard file browsing tools like Windows Explorer and PowerShell, enabling them to store and access malicious files without detection. By utilizing this technique, an attacker can obscure their activities, making forensic investigation significantly more challenging.

  This behavior is linked to the MITRE ATT&CK technique T1564.004 (Hide Files or Information), which falls under the broader tactic of Defense Evasion. Attackers leveraging this technique generally aim to maintain persistence while evading detection from security tools and analysts. As such, it is crucial for security teams to look for potential abuses of file system streams to ensure they are not being exploited for covert operations.

  Primary data sources for investigating this alert include process creation logs, specifically focusing on command line arguments. These logs can provide crucial insights into any command line usage referencing the hidden directory and indicate potentially malicious activities.

  ### Investigation Steps
  - **Review Command Lines:** Examine the process creation logs for any instances of command lines containing '::$index_allocation'. Pay particular attention to the context in which these were executed to understand the possible intent behind their use.
  - **Analyze File System Activity:** Investigate related file system activities to see if any files or folders are being created or accessed unexpectedly. Check for any anomalies in the filesystem that could indicate the presence of hidden or suspicious files.
  - **Correlate with User Activity:** Cross-reference the identified command line activity with user accounts. Look for any anomalous behavior, such as commands executed by unusual users or at odd times.
  - **Check for Other Evasion Techniques:** As this method is one of many used for evasion, correlating with logs from other security tools (like EDRs and SIEM) may reveal other suspicious activities or related threats.

  ### Prioritization
  This alert should be considered medium-severity due to the nature of the detected behavior, which indicates a potential attempt to conceal malicious activities. Given the techniques involved, swift investigation is warranted to mitigate possible compromise and identify any payloads or methods used by the attacker.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that not all environments may have the necessary logging enabled or may not utilize an EDR capable of capturing this command line context, as traditional Sysmon and ETW logging may not log these streams directly. This detection assumes the presence of a capable EDR that records command line history. If such logs are not available, the detection logic may not trigger. Additionally, the use of hidden directories is not common; thus, there could be a reliance on user behavior patterns that are not well-defined in every organizational context.

