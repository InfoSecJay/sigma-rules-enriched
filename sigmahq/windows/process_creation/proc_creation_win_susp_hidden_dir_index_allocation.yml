note: |
  ### Technical Context

  This Sigma rule detects the execution of command-line instructions containing references to the "::$index_allocation" stream, a tactic that offers stealthy file storage options to adversaries. Attackers may exploit this behavior to hide files within NTFS directories, thereby circumventing common detection mechanisms like Windows Explorer or PowerShell. It relates to the MITRE ATT&CK technique T1564.004 (Hide Data Using NTFS Alternate Data Streams).

  The primary telemetry sources for this detection are process creation events, specifically focusing on command-line arguments passed during software execution. If utilized maliciously, this technique can potentially store sensitive or harmful files, enabling further exploitation or data exfiltration while remaining undetected. However, this alert does not definitively prove malicious intent on its own, as legitimate users can also create alternative data streams under certain circumstances.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for the relevant command lines containing "::$index_allocation". Verify whether the context of execution aligns with known, expected administrative actions or unusual behaviors.

  - **Analyze user context:** Identify the user or process that executed the command. Malicious behavior is more likely if the command comes from an unexpected user (e.g., automated scripts or non-privileged users triggering it).

  - **Cross-reference application logs:** Check for recent file creations or modifications linked to the command execution. Confirmation of file activity (creation/modification) in hidden streams can indicate a high-confidence malicious indicator.

  - **Identify expected legitimate behavior:** Determine if the behavior correlates with known applications that legitimately use alternate data streams, such as backup or archiving software. Understanding these baselines helps differentiate benign activities from malicious ones.

  - **Assess asset criticality:** Consider whether the affected host is an endpoint or a server with sensitive data. Higher criticality assets warrant a more thorough investigation and immediate containment actions if malicious intent is confirmed.

  ### Prioritization

  The alert has medium severity due to the potential impact of hidden data storage on sensitive systems. The likelihood of abuse is moderate, as this technique is sometimes used by advanced adversaries to hide their tracks. Given the stealthy nature of this behavior, it is crucial to investigate and confirm intent.

  ### Blind Spots and Assumptions

  Detection may be limited by tools that do not log alternate data stream usage effectively, which can allow adversaries to remain undetected. Required log sources include detailed process creation logs that capture command-line arguments. Legitimate activities, such as certain IT maintenance tasks, may inadvertently trigger this alert. A related detection to enhance coverage includes monitoring for manipulations to file integrity or unexpected directory access patterns, which can indicate further malicious activity.

