  ### Technical Context
  This detection rule identifies potentially malicious use of SSH (Secure Shell) to establish a tunnel for Remote Desktop Protocol (RDP) traffic. Specifically, it looks for the execution of `ssh.exe` with command-line parameters indicating an attempt to forward RDP traffic on port 3389. This behavior suggests that an attacker might be attempting to create covert channels for data exfiltration or to bypass security controls by tunneling RDP connections through a secure method.

  The threat scenario involves attackers who have compromised a system and are leveraging SSH to maintain access or exfiltrate data through a hidden communication channel that bypasses traditional network defenses. By tunneling RDP through SSH, attackers target the confidentiality and integrity of the data while circumventing detection mechanisms.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic**: Command and Control
  - **Technique**: Application Layer Protocol (T1572)

  Primary data sources for this detection include:
  - Process creation logs that record application execution and command-line arguments.
  - Network flow logs or firewall logs that may contain information about unusual outbound connections or traffic patterns associated with RDP.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for instances of `ssh.exe` being executed, particularly those with command-line arguments indicating RDP tunneling (`:3389`).
  - **Examine Network Traffic**: Investigate network flows to identify any unexpected or unauthorized SSH traffic, particularly connections to external IPs that may correlate with the timing of the detected activity.
  - **Check for Anomalous RDP Sessions**: Look for unusual remote desktop sessions or connections originating from uncommon user accounts or devices, especially during non-business hours.
  - **Investigate Firewall Logs**: Review firewall logs for any rules that may have allowed or blocked SSH or RDP traffic, paying attention to traffic frequencies that deviate from baseline usage.

  ### Prioritization
  This alert should be treated with high severity due to its potential to indicate a significant security breach. The use of SSH for tunneling RDP traffic suggests an attempt to establish persistent, covert access to enterprise systems, which could lead to data exfiltration or further compromise.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where attackers use alternative tools or methods to tunnel RDP traffic, such as VPNs or other tunneling software. It assumes that all process creation logs for `ssh.exe` will be captured, which may not be the case if logging configurations are inadequate. Additionally, proper network logging must be in place to monitor outbound traffic patterns effectively for an accurate assessment of tunneled connections.

