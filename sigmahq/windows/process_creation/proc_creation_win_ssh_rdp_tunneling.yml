  ---

  ### Technical Context

  This rule detects the execution of `ssh.exe` with command lines that include port `:3389`, which indicates an attempt to tunnel RDP connections over SSH. The likely attacker objective is to create an encrypted tunnel for remote access to the target system, which can facilitate unauthorized data access or command-and-control activities. This behavior aligns with the MITRE ATT&CK technique "Backend Communication over RDP" (T1572).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, it could lead to significant compromises of sensitive systems. It is essential to note that this detection alone does not confirm malicious intent, as legitimate SSH tunneling for RDP purposes can occur in a corporate environment.

  ---

  ### Investigation Steps

  - **Check recent process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for `ssh.exe`. Look for user context and command lines that end with `:3389`. Legitimate usage typically does not involve unusual names or command structures.

  - **Analyze command-line arguments:** Investigate the exact command line containing `:3389`. Malicious indicators include unusual flag usage (e.g., `-D`, `-L`). Legitimate entries are often well-structured and for known purposes.

  - **Correlate with user activity:** Verify the user account associated with this execution. Malicious activity often involves non-administrative or previously dormant accounts attempting to tunnel for RDP access.

  - **Review network traffic:** If applicable, gather network logs to isolate outbound SSH connections. Look for unusual external IP addresses or domains associated with the connection. Legitimate activity usually connects to known internal SSH servers.

  - **Examine system role and criticality:** Determine if the affected system is a server hosting sensitive applications or data. Malicious tunneling is of higher concern on critical systems, especially if they host RDP services.

  - **Validate file and process relationships:** If an SSH tunnel is detected, review any related processes spawned by `ssh.exe`. Malicious activity may spawn other direct processes that are not part of normal operational procedures.

  ---

  ### Prioritization

  The alert is rated high severity due to the potential impact of tunneling RDP through SSH, which can lead to unauthorized access and data breaches. The likelihood of malicious abuse is significant, especially if the attacker has specific access to the network infrastructure. This behavior is often weaponized by advanced persistent threats (APTs).

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via legitimate SSH usage for remote work or administrative tasks. Required log sources, including Sysmon logs for detailed process creation, must be configured for reliable detection. Legitimate activities that may trigger the alert include system administrators tunneling for RDP during maintenance. A related detection to strengthen coverage is alerting on unusual outbound SSH connections without prior authorization, as this could indicate lateral movement or command-and-control activity.

