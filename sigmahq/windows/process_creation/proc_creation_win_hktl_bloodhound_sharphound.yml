title: HackTool - Bloodhound/Sharphound Execution
id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
status: test
description: Detects command line parameters used by Bloodhound and Sharphound 
  hack tools
references:
- https://github.com/BloodHoundAD/BloodHound
- https://github.com/BloodHoundAD/SharpHound
author: Florian Roth (Nextron Systems)
date: 2019-12-20
modified: 2023-02-04
tags:
- attack.discovery
- attack.t1087.001
- attack.t1087.002
- attack.t1482
- attack.t1069.001
- attack.t1069.002
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Product|contains: 'SharpHound'
  - Description|contains: 'SharpHound'
  - Company|contains:
    - 'SpecterOps'
    - 'evil corp'
  - Image|contains:
    - '\Bloodhound.exe'
    - '\SharpHound.exe'
  selection_cli_1:
    CommandLine|contains:
    - ' -CollectionMethod All '
    - ' --CollectionMethods Session '
    - ' --Loop --Loopduration '
    - ' --PortScanTimeout '
    - '.exe -c All -d '
    - 'Invoke-Bloodhound'
    - 'Get-BloodHoundData'
  selection_cli_2:
    CommandLine|contains|all:
    - ' -JsonFolder '
    - ' -ZipFileName '
  selection_cli_3:
    CommandLine|contains|all:
    - ' DCOnly '
    - ' --NoSaveCache '
  condition: 1 of selection_*
falsepositives:
- Other programs that use these command line option and accepts an 'All' 
  parameter
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of BloodHound and SharpHound tools, which are commonly used for Active Directory enumeration and reconnaissance by attackers. The likely attacker objective is to gather information about user and group relationships, permissions, and other directory objects to facilitate lateral movement and escalation within a network. This behavior is associated with the MITRE ATT&CK techniques T1087.001 (Account Discovery: Domain Account) and T1087.002 (Account Discovery: Local Account).

  The primary telemetry source is Windows process creation logs, specifically focusing on the command-line parameters used during execution. If malicious, the security impact can be significant, as it may lead to unauthorized access and exploitation of sensitive information within the Active Directory. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative tasks may also use similar command-line parameters.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 for processes involving 'Bloodhound.exe' or 'SharpHound.exe'. Document the account and the time of execution, correlating with other activity on the host.

  - **Analyze command-line parameters:** Check for command lines containing specific keywords such as ' -CollectionMethod All ', '--Loop', and 'Get-BloodHoundData'. Legitimate tools might not use these exact parameters; anomalous combinations indicate potential misuse.

  - **Correlate with user behavior:** Investigate the account that initiated the process, particularly if it is not part of the administrative group. If the command is executed by a user with standard privileges, this should raise suspicion.

  - **Validate file creation artifacts:** Verify the existence of JSON files or zip archives created in directories typically used for reconnaissance activities, focusing on paths relevant to BloodHound outputs.

  - **Identify legitimate usage:** Note that legitimate administrative tasks may invoke similar commands; confirm if there’s an established usage pattern for these tools in your organization, including approved users or times of execution.

  - **Investigate related alerts:** Look for any alerts indicating abnormal Active Directory changes or failed login attempts following the detected execution, which may indicate further malicious activities.

  ### Prioritization

  This alert is of high severity due to the potential compromise of administrative credentials and the subsequent risk posed to the integrity of the Active Directory environment. The likelihood of exploitation is high since tools like BloodHound and SharpHound are often used in the initial stages of an attack for reconnaissance.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as attackers renaming the tools or using obfuscation methods to disguise their command lines. Reliable detection requires comprehensive logging configurations for process creation events. Legitimate administrative activities that may trigger the alert include authorized use of BloodHound for security assessments. For strengthened coverage, companion detections for unusual user account activity or lateral movement attempts should be established.

