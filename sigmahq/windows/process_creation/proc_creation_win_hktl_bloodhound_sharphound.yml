title: HackTool - Bloodhound/Sharphound Execution
id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
status: test
description: Detects command line parameters used by Bloodhound and Sharphound 
  hack tools
references:
- https://github.com/BloodHoundAD/BloodHound
- https://github.com/BloodHoundAD/SharpHound
author: Florian Roth (Nextron Systems)
date: 2019-12-20
modified: 2023-02-04
tags:
- attack.discovery
- attack.t1087.001
- attack.t1087.002
- attack.t1482
- attack.t1069.001
- attack.t1069.002
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Product|contains: 'SharpHound'
  - Description|contains: 'SharpHound'
  - Company|contains:
    - 'SpecterOps'
    - 'evil corp'
  - Image|contains:
    - '\Bloodhound.exe'
    - '\SharpHound.exe'
  selection_cli_1:
    CommandLine|contains:
    - ' -CollectionMethod All '
    - ' --CollectionMethods Session '
    - ' --Loop --Loopduration '
    - ' --PortScanTimeout '
    - '.exe -c All -d '
    - 'Invoke-Bloodhound'
    - 'Get-BloodHoundData'
  selection_cli_2:
    CommandLine|contains|all:
    - ' -JsonFolder '
    - ' -ZipFileName '
  selection_cli_3:
    CommandLine|contains|all:
    - ' DCOnly '
    - ' --NoSaveCache '
  condition: 1 of selection_*
falsepositives:
- Other programs that use these command line option and accepts an 'All' 
  parameter
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_hktl_bloodhound_sharphound/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of BloodHound or SharpHound, tools commonly used for Active Directory reconnaissance. The likely attacker objective is to gather information about user accounts, group memberships, and privileges, facilitating further lateral movement or privilege escalation within a target environment. Relevant MITRE ATT&CK techniques include Discovery (T1087), specifically T1087.001 (Account Discovery) and T1087.002 (Group Discovery), as well as Execution techniques such as T1059.001 (PowerShell).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1, which track command-line arguments and executable paths. The security impact of these tools being used is significant, as they can enable attackers to map out the Active Directory environment, potentially leading to further attacks. It is important to note that this detection alone does not confirm malicious intent, as legitimate tools may use similar command-line options.

  ### Investigation Steps

  - **Review process creation logs**: Identify Security Event ID 4688 or Sysmon Event ID 1 for process creations involving `Bloodhound.exe` or `SharpHound.exe`.

  - **Analyze command line arguments**: Look specifically for signs of reconnaissance activity in CommandLine fields that include options like `-CollectionMethod All` or `-JsonFolder`. Benign usage will typically not have these specific parameters.

  - **Correlate with user activity**: Determine the executing user’s account and check for any recent suspicious login activity or privilege escalations within the environment. Legitimate use may be performed by authorized personnel during a security assessment.

  - **Check for related network traffic**: Use network logs to verify if any unusual outbound connections or data exfiltration attempts coincide with the execution of these tools, especially if you observe parameters like `--PortScanTimeout` in command lines.

  - **Investigate asset criticality**: Analyze role and criticality of the host where the alert triggered to assess the potential impact if malicious. High-value assets like domain controllers are of greater concern.

  - **Identify high-confidence malicious indicators**: Look for known threat actor signatures or behaviors associated with BloodHound and SharpHound, such as previously reported cases or integration with other malicious payloads.

  ### Prioritization

  This alert should be considered high severity due to the critical nature of Active Directory reconnaissance and the potential for further exploitation. The tools detected are commonly weaponized in real-world scenarios, presenting a serious risk if unauthorized access is confirmed.

  ### Blind Spots and Assumptions

  Detection may have limitations if similar command-line options are used by legitimate applications, leading to false positives. Ensure that logging is configured correctly to capture process creation events (Event ID 4688) and Sysmon data. Legitimate security assessments can also trigger this alert, necessitating an understanding of context. A related detection for broader reconnaissance may include failed authentication attempts or unusual account activity that indicates potential privilege escalation efforts.

