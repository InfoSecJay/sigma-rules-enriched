note: |
  ### Technical Context
  This rule detects potentially suspicious execution of malicious scripts or executables through .LNK files accessed on a WebDAV server. Attackers often use WebDAV as a means to deliver payloads or command-and-control communication, leveraging LNK (shortcut) files to execute potentially harmful commands without raising immediate suspicion. The likelihood of this behavior suggests attackers could be aiming to exploit vulnerabilities in the network or conduct further reconnaissance.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002), particularly via **Command and Scripting Interpreter** (T1059.001) and **User Execution** (T1204). Both techniques highlight the methods attackers use to initiate malicious actions through user actions or script execution.

  Primary data sources for the best evidence include:
  - Process creation events that provide insights into executed commands and scripts.
  - Logs from WebDAV servers capturing access patterns and file interactions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events for any instances where scripts (cmd.exe, powershell.exe, etc.) are initiated with command lines indicating access to WebDAV directories (`DavWWWRoot`).

  - **Analyze WebDAV Access Logs:** Investigate WebDAV server logs for suspicious access patterns, specifically targeting LNK files or unusual file requests from internal hosts.

  - **Correlate with User Behavior:** Cross-reference user accounts that accessed these WebDAV files with their normal behavior. Look for anomalies, such as execution times or unexpected command-line arguments.

  - **Assess File Integrity:** Verify the integrity and origin of the executed LNK files. Consider using hash comparisons against known malicious indicators or authoritative file repositories to identify potentially compromised files.

  ### Prioritization
  Given the medium-level severity of this alert, it is essential to prioritize investigations as the use of LNK files to execute commands can indicate an attempted compromise that, if successful, may lead to deeper network penetration or data exfiltration.

  ### Blind Spots and Assumptions
  This detection rule may miss legitimate usage of WebDAV for regular operations by internal users who frequently access remote files. Additionally, it assumes that logging is robust enough to capture all relevant process creation details and WebDAV access logs. Missing or misconfigured logging on WebDAV servers or client machines may hinder effective detection of this behavior. It is crucial to ensure that detailed logging is enabled and appropriately retained to support this detection capability.

