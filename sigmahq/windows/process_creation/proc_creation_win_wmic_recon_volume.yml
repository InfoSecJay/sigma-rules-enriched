detection:
  selection_img:
  - Image|endswith: '\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
  - CommandLine|contains:
    - ' volumename'
    - ' logicaldisk'
  - CommandLine|contains|all:
    - 'path'
