note: |
  ### Technical Context
  This rule detects reconnaissance activities related to system disks and volumes using the Windows Management Instrumentation Command-line (WMIC) utility. Threat actors, such as those identified with the Volt Typhoon campaign, may utilize WMIC to extract valuable information about the system's disk volumes, including volume names, sizes, and available free space. This behavior typically aligns with an attacker's objectives of mapping the environment for further exploitation or lateral movement activities.

  In the MITRE ATT&CK framework, this detection corresponds to the tactics of **Execution** (TA0002) and **Discovery** (TA0007). The relevant techniques include **WMIC (T1047)** and **System Information Discovery (T1082)**, as attackers may leverage these methods to gather key details necessary for planning subsequent actions or identifying vulnerable targets within a network.

  The primary data sources for this rule include **process creation events**, specifically those capturing WMIC command executions, as well as the associated command-line parameters that can reveal suspicious queries targeting system volume details.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate any instances of `WMIC.exe` execution, particularly focusing on the command-line arguments used. Look for indications of volume-related queries which can suggest reconnaissance efforts.

  - **Correlate with User Context**: Determine the user account that executed the WMIC commands. Assess whether the account has legitimate reasons for performing such disk reconnaissance or if it appears anomalous based on typical behavior patterns.

  - **Analyze Command-Line Arguments**: Examine the full command-line input for WMIC executions to identify specific queries related to `volumename`, `logicaldisk`, and `win32_logicaldisk`. Note any combinations that may indicate scripted or automated activities rather than legitimate administrative actions.

  - **Cross-Reference with Network Activity**: Look for correlating network activity or lateral movement patterns during the same timeframe. This may include unusual connections or data exfiltration attempts that align with the reconnaissance activity.

  ### Prioritization
  The alert has a medium severity due to the potential for an adversary to leverage discovered disk information to facilitate further exploitation or lateral movement within the network. While not immediately malicious, the reconnaissance represents a proactive step in an attack lifecycle that could lead to significant risks if left unchecked.

  ### Blind Spots and Assumptions
  This detection may face gaps due to several factors including limited visibility on external threats that may not utilize WMIC for disk reconnaissance or instances where WMIC activities occur through benign administrative use. The detection logic assumes that WMIC commands are suspicious in nature based on their context and structure, which may not always hold true. Moreover, the rule relies on comprehensive logging of process creation events, which must be enabled and correctly configured within the environment for effective detection.

