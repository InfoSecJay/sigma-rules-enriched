note: |
  ### Technical Context

  This rule detects the execution of the WMIC (Windows Management Instrumentation Command-line) utility with specific command-line parameters that query disk information, such as volume names and sizes. An attacker may utilize this reconnaissance technique to gather information about the target system's disk layout, which could inform further exploitation or data exfiltration strategies.

  The detection aligns with the MITRE ATT&CK tactic for Discovery (TA0007) and specifically targets the technique of System Information Discovery (T1082) as well as the use of Command-Line Interface (T1059). Primary telemetry sources include process creation logs (Event ID 4688 for Windows) and Sysmon logs (Event ID 1) that capture detailed command-line arguments. If malicious, this behavior could facilitate unauthorized access or further malicious actions on the system.

  However, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also invoke WMIC with similar parameters.

  ### Investigation Steps

  - **Verify process creation event:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 capturing the execution of `wmic.exe`. Identify the user account and process parent-child relationships to ascertain context.

  - **Examine command line arguments:** Investigate the fields related to CommandLine contained in the process creation logs. Look for the presence of `volumename`, `logicaldisk`, `path`, and `win32_logicaldisk`. Assess if these arguments are part of expected administrative queries to disks.

  - **Compare against known good behavior:** Cross-reference logged `wmic` behavior with baseline administrative tasks in your environment. Legitimate IT admins might invoke `wmic` commands for system maintenance or inventory assessments.

  - **Identify malicious indicators:** Focus on unusual execution patterns or triggering accounts not typically involved in disk management. Note instances where `wmic` command usage correlates with an increase in privileged user actions or unauthorized access attempts.

  - **Review system impact:** Evaluate the role of the affected host (e.g., critical infrastructure, end-user devices) and system importance. Assess potential implications such as data harvesting or lateral movement.

  ### Prioritization

  The severity of this alert is medium due to the potential for system reconnaissance that could lead to further exploitation. Systems identified are not always critical but could be integral to determining the attacker's movement within the network. This behavior can be an indication of preparation for more serious malicious actions.

  ### Blind Spots and Assumptions

  Detection may be limited by the ability to scrutinize WMIC usage closely due to its common usage in administrative functions. Ensure relevant logging is enabled on all endpoints to capture detailed command-line arguments. Legitimate activities might include regular system audits by IT staff or scripts running for maintenance. Utilize companion detections like PowerShell commands invoking similar WMI operations (e.g., T1047) to enhance visibility of potentially malicious activities.

