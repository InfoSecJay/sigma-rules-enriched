note: |
  ### Technical Context

  This rule detects the execution of 7-Zip to compress files with a ".dmp" or ".dump" extension. This behavior can indicate an attempt to exfiltrate memory dump files, which may contain sensitive information about the system or software state. The likely objective of an attacker is to extract valuable data, which can be leveraged for further exploitation, reconnaissance, or credential theft.

  This detection aligns with the MITRE ATT&CK tactic **Collection** and technique **T1560.001: Archive Collected Data**. The primary telemetry sources are Windows process creation logs, specifically capturing **Event ID 4688** (Process Creation) for monitoring process execution and arguments. If the compression of memory dump files is part of a malicious activity, it can lead to data loss or unauthorized access to sensitive information. However, this detection does NOT confirm that the files are being exfiltrated; it only indicates compression activity.

  ### Investigation Steps

  - **Verify the process execution details**: Check **Event ID 4688** for occurrences of '7z.exe', '7za.exe', or '7zr.exe'. Look for process creation time, the user context, and parent process information to establish legitimacy.

  - **Examine command-line arguments used**: Inspect the **CommandLine** field in the process creation logs for any instances containing ".dmp", ".dump", or ".hdmp". Analyze for unexpected flags or arguments that indicate suspicious behavior.

  - **Identify benign use cases**: Confirm if the user has a legitimate need for compressing ".dmp" files (e.g., Windows Error Reporting). Review user job roles or established patterns of normal behavior for 7-Zip usage on the asset.

  - **Correlate with filesystem changes**: Monitor for any file creation or modification events for compressed files. Check for new archives in directories typically accessed by users (e.g., Documents or specific application folders), using **File Creation Events** (Windows **Event ID 4663**, with Access Mask for 'Write Data' or 'Append Data').

  - **Assess relevant user privileges**: Review the permissions of the user executing the 7-Zip commands. Higher privileges (e.g., Admin groups) can indicate potential malicious intent, especially if outside expected operational behaviors.

  - **Investigate potential exfiltration behaviors**: Cross-reference logs for network activity post-compression. Specifically, check for unusual outbound connections that may suggest attempts to transfer the compressed files, utilizing tools like **Firewall logs** or **Network Flow logs**.

  ### Prioritization

  This alert has medium severity due to the potential impact of sensitive data being extracted from memory dumps, particularly if these files are transmitted to an external entity. While the action itself can indicate malicious intent, it may also occur in legitimate scenarios; thus, understanding the context of the user’s intent and normal operating behavior is crucial.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of adversaries employing alternative compression tools or evasion techniques, such as renaming the executable or using built-in Windows tools for compression. Reliable detection relies on consistent process creation logging (Event ID 4688) and potentially combining it with file system access logs. Legitimate compression activities, such as those for debugging purposes, may trigger this alert without malicious intent. Related detections involving unusual network outbound traffic following compression could enhance overall detection efficacy.

