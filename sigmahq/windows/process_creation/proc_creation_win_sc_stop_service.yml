note: |
  ### Technical Context

  This Sigma rule detects the use of the `sc.exe` utility to stop Windows services, a behavior often associated with malicious activities such as service disruption or lateral movement within a compromised network. The likely attacker objective is to disable security services or critical business applications to facilitate further exploitation. This behavior aligns with the MITRE ATT&CK framework tactic and technique: Impact (T1489).

  The primary telemetry source is Windows Process Creation logs, specifically those capturing service management actions. Event IDs related to this behavior include Security Event ID 4688 (process creation) and Sysmon Event ID 1 (process creation). If malicious, stopping a critical service may lead to security breaches, system instability, or facilitate an adversary's subsequent actions. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also trigger this rule.

  ### Investigation Steps

  - **Review command line arguments for suspicious keywords**: Check for `CommandLine` field in Event ID 4688/Sysmon Event ID 1. Look for use of `sc.exe stop <service_name>`. Identify any services known to be critical or high-value in your environment, such as antivirus or critical business applications, which could indicate malicious intent.

  - **Correlate service stop actions with user activity**: Examine the `SubjectUserName` field in related log events to correlate the user account that executed the stop command. Determine if the user has privileges consistent with service management. Ensure that the user account is not associated with unexpected behavior or anomalies.

  - **Validate affected services**: Use Windows Management Instrumentation (WMI) or PowerShell to query the current status of the services affected by the stopping event. Identify if critical (e.g., Windows Defender, file-sharing services) or security-related services were intentionally stopped, as these may indicate an attack.

  - **Investigate historical context of service stopping**: Check for prior events in the audit log that show normal operation of the service prior to the stop command. If this `sc.exe` command executed without any documented reason or prior notifications to change service states, this may indicate a security event requiring further investigation.

  - **Document legitimate maintenance activities**: Review recent change management logs or ticketing systems to identify scheduled maintenance or updates that may have legitimately stopped the service. Compare timestamps to isolate any unexpected or unscheduled activity related to the service stopping.

  ### Prioritization

  This alert carries a low severity in a typical enterprise context due to the frequent legitimate reasons for stopping services, like routine maintenance or troubleshooting. However, the likelihood of malicious abuse increases if critical security services are targeted, as this technique is commonly weaponized by attackers to disrupt defenses.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to monitor all relevant process creations or command line activities effectively. Legitimate administrative actions, such as scheduled maintenance or system updates, may also trigger this alert, requiring careful consideration during investigations. A companion detection to consider is monitoring for service creation events, which could indicate an attacker stopping a service to replace it with their own malicious service for persistence.

