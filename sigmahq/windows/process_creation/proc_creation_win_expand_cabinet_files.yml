title: Potentially Suspicious Cabinet File Expansion
id: 9f107a84-532c-41af-b005-8d12a607639f
status: test
description: Detects the expansion or decompression of cabinet files from 
  potentially suspicious or uncommon locations, e.g. seen in Iranian 
  MeteorExpress related attacks
references:
- https://labs.sentinelone.com/meteorexpress-mysterious-wiper-paralyzes-iranian-trains-with-epic-troll
- https://blog.malwarebytes.com/threat-intelligence/2021/08/new-variant-of-konni-malware-used-in-campaign-targetting-russia/
author: Bhabesh Raj, X__Junior (Nextron Systems)
date: 2021-07-30
modified: 2024-11-13
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    Image|endswith: '\expand.exe'
    CommandLine|contains|windash: '-F:'
  selection_folders_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\ProgramData'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Admin$\'
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\C$\'
    - '\Temporary Internet'
  selection_folders_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  filter_optional_dell:
        # Launched by Dell ServiceShell.exe
    ParentImage: 'C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe'
    CommandLine|contains: 'C:\ProgramData\Dell\UpdateService\Temp\'
  condition: selection_cmd and 1 of selection_folders_* and not 1 of 
    filter_optional_*
falsepositives:
- System administrator Usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the expansion or decompression of cabinet files using the `expand.exe` utility from potentially suspicious directories such as system temporary files and common user directories. Such behavior is often associated with adversaries attempting to deploy malware or other malicious payloads within a target environment, particularly observed in Iranian MeteorExpress-related attacks. The relevant MITRE ATT&CK tactics include **Execution (T1203)** and **Command and Control (T1218)**, indicating an attempt to execute code after transferring it from a compromised location.

  The primary telemetry source is Windows process creation logs, specifically monitoring for *Event ID 4688*, which records process creation. If malicious, this behavior could indicate an initial compromise, spreading of malware, or execution of unauthorized scripts. However, this detection alone does not confirm malicious activity without further context, as legitimate administrative or system processes might also trigger it.

  ### Investigation Steps

  - **Identify process invocation: **Use security Event ID 4688 to find instances of `expand.exe`. Validate the presence of a suspicious command line argument `-F:` which indicates file extraction. This is a critical indicator of potential malicious behavior.

  - **Examine command line arguments:** Investigate the command line and parent process for targeted executions. Look for unusual parent processes or arguments associated with expansion from contentious directories such as `C:\Windows\Temp\` or `C:\Users\Public\`.

  - **Review User Activity:** Cross-reference with the User Activity log to identify whether the user historically accessed cabinet files or expansion tools. Legitimate administrative actions should reflect normal operational behavior for system administrators.

  - **Analyze Environment Context:** Determine the host's role and criticality. If it is a sensitive server or endpoint, prioritize the investigation. If the activity is occurring on a non-critical machine with no administrative intent, further context may be needed before proceeding.

  - **Look for high-confidence indicators:** Check for additional artifacts like the presence of newly created or modified files in associated temporary directories, particularly looking for anomalies (e.g., file timestamps) that deviate from expected activity patterns.

  ### Prioritization

  This alert is categorized as medium severity due to the potential impact on critical systems and the likelihood of malicious activity stemming from common exploitation techniques. Certain adversaries frequently exploit cabinet files to orchestrate further attacks, making this behavior significant in the threat landscape.

  ### Blind Spots and Assumptions

  The detection may be evaded by renaming executables or utilizing alternative archive formats, circumventing the monitoring of `expand.exe`. Proper log collection from all endpoints and validating log integrity across critical systems is necessary for reliable detections. Legitimate software installations and updates may trigger similar alerts, such as Dell's ServiceShell. Companion detections, such as monitoring for unusual PowerShell executions or unauthorized downloads, can strengthen overall coverage against this attack vector.

