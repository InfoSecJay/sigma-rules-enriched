title: Potentially Suspicious Cabinet File Expansion
id: 9f107a84-532c-41af-b005-8d12a607639f
status: test
description: Detects the expansion or decompression of cabinet files from 
  potentially suspicious or uncommon locations, e.g. seen in Iranian 
  MeteorExpress related attacks
references:
- https://labs.sentinelone.com/meteorexpress-mysterious-wiper-paralyzes-iranian-trains-with-epic-troll
- https://blog.malwarebytes.com/threat-intelligence/2021/08/new-variant-of-konni-malware-used-in-campaign-targetting-russia/
author: Bhabesh Raj, X__Junior (Nextron Systems)
date: 2021-07-30
modified: 2024-11-13
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    Image|endswith: '\expand.exe'
    CommandLine|contains|windash: '-F:'
  selection_folders_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\ProgramData'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Admin$\'
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\C$\'
    - '\Temporary Internet'
  selection_folders_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  filter_optional_dell:
        # Launched by Dell ServiceShell.exe
    ParentImage: 'C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe'
    CommandLine|contains: 'C:\ProgramData\Dell\UpdateService\Temp\'
  condition: selection_cmd and 1 of selection_folders_* and not 1 of 
    filter_optional_*
falsepositives:
- System administrator Usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the expansion or decompression of cabinet files (`expand.exe`) executed from suspicious or uncommon locations, which is often associated with potential malware deployment, particularly in campaigns like those targeting Iranian infrastructure. The objective of an attacker using this method is typically to extract malicious payloads hidden within compressed files in order to execute them on victim systems. This behavior aligns with the MITRE ATT&CK techniques T1218 (Signed Binary Proxy Execution), and it can indicate the presence of stealthy activities that are part of a broader attack lifecycle, specifically in the lateral movement or command-and-control phases.

  The primary telemetry sources include Windows Process Creation events, specifically focusing on Event ID 4688 recordings in the Security log, and Process Creation events in Sysmon (Event ID 1). If successfully executed, this activity can lead to the installation of backdoors or other malware on the system, compromising its security. Importantly, while this detection indicates suspicious behavior, it does NOT confirm that malicious activity is occurring without further context about the source and intent of the file execution.

  ### Investigation Steps

  - **Review execution context**: Check the invoking process from Security Event ID 4688 or Sysmon Event ID 1 to determine the parent process. Look for unusual parent processes (e.g., not typical admin tools) that are launching `expand.exe`.

  - **Correlate command line usage**: Examine the CommandLine field for instances of `expand.exe` containing the switch `-F:` and check the path from which it is executed. Malicious indicators may include executions from locations such as `C:\Windows\Temp\` or `C:\ProgramData\`.

  - **Assess process origin**: Validate the file properties of `expand.exe` (e.g., file signature) to determine if it is the legitimate Windows utility. Malicious variants often have altered signatures or originate from non-standard directories.

  - **Investigate folder access**: Identify any other recent file modifications or accesses in suspicious or uncommon directories listed in the rule (such as `C:\Users\Public\` or `C:\AppData\Local\Temp\`). This helps gauge if additional malicious behavior may be occurring.

  - **Identify benign use cases**: Consider legitimate instances where administrators or automated processes may use `expand.exe`, particularly during system updates or maintenance. Ensure that such activities correspond with expected organizational operations.

  - **Check for exfiltration activities**: Look for related log events indicating file creation or transfer (e.g., Event ID 4663 for file access) subsequent to the alarming process. Successful file extraction could suggest ongoing malicious operations.

  ### Prioritization

  This alert is of medium severity as the impacted systems might contain critical infrastructure or sensitive data, increasing the potential impact of any malicious actions. The likelihood of abuse is moderate due to the specificity of the file locations and command-line arguments used; however, these behaviors can often be weaponized by sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection capabilities may be hindered if requisite logs (e.g., Sysmon) are not configured, limiting the ability to capture detailed process execution data. Legitimate system management activities, such as updates or administrative tasks from trusted software like Dell’s Update Service, may trigger the alert. A related detection that strengthens coverage would include monitoring other decompression tools or utilities that could be leveraged similarly, ensuring comprehensive visibility into file extraction activities.

