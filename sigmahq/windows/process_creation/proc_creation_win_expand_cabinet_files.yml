title: Potentially Suspicious Cabinet File Expansion
id: 9f107a84-532c-41af-b005-8d12a607639f
status: test
description: Detects the expansion or decompression of cabinet files from potentially
  suspicious or uncommon locations, e.g. seen in Iranian MeteorExpress related attacks
references:
- https://labs.sentinelone.com/meteorexpress-mysterious-wiper-paralyzes-iranian-trains-with-epic-troll
- https://blog.malwarebytes.com/threat-intelligence/2021/08/new-variant-of-konni-malware-used-in-campaign-targetting-russia/
author: Bhabesh Raj, X__Junior (Nextron Systems)
date: 2021-07-30
modified: 2024-11-13
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    Image|endswith: '\expand.exe'
    CommandLine|contains|windash: '-F:'
  selection_folders_1:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\ProgramData'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Admin$\'
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\C$\'
    - '\Temporary Internet'
  selection_folders_2:
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - CommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  filter_optional_dell:
        # Launched by Dell ServiceShell.exe
    ParentImage: 'C:\Program Files (x86)\Dell\UpdateService\ServiceShell.exe'
    CommandLine|contains: 'C:\ProgramData\Dell\UpdateService\Temp\'
  condition: selection_cmd and 1 of selection_folders_* and not 1 of filter_optional_*
falsepositives:
- System administrator Usage
level: medium
note: |
  ### Technical Context
  This detection rule identifies the expansion or decompression of cabinet files (`expand.exe`) from potentially suspicious or uncommon directories on Windows systems. Such activity is associated with post-exploitation behaviors, particularly in targeted attacks where attackers aim to extract payloads or tools necessary for lateral movement or data deletion. The rule is particularly relevant as it relates to Iranian MeteorExpress-related attacks, where the use of cabinet file expansion has been observed.

  In this context, attackers may be attempting to deliver malicious payloads concealed within cabinet files from atypical locations (e.g., public user directories or system folders). This behavior is indicative of potential data exfiltration or the deployment of additional malware. The detection aligns with relevant MITRE ATT&CK tactics such as **Defense Evasion** (T1203) and the technique for **Exploitation for Client Execution** (T1218), which focuses on malicious activities exploiting system capabilities to achieve persistence or deliver payloads.

  Primary data sources for this detection include process creation logs from Windows systems, which capture the execution of `expand.exe` along with associated command-line arguments. This telemetry is crucial for identifying unusual execution patterns indicative of these attacks.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze recent process creation logs for instances of `expand.exe` being executed. Pay attention to the command-line parameters that indicate potentially malicious use, especially those pointing to uncommon directories.

  - **Correlate with User Activity**: Check the user accounts associated with the activity. Identify if the users typically have legitimate reasons to access the directories being targeted and whether their behaviors align with common usage patterns.

  - **Examine File System Changes**: Look into recent changes within the directories from which cabinet files were expanded. Identify any newly created or modified files that could indicate further malicious activity.

  - **Perform Endpoint Analysis**: Investigate the endpoints where the suspicious activity was detected. Look for additional enterprise-wide patterns, such as other tools commonly associated with lateral movement or follow-up exploit behaviors.

  ### Prioritization
  The severity of this alert is medium, given that while the activity may stem from legitimate administrative tasks, the potential for exploitation in an enterprise environment necessitates attention. The identification of such behavior from unexpected locations may indicate underlying threats that merit further investigation.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage, particularly if system administrators are performing legitimate tasks that involve the expansion of cabinet files. The rule assumes that all instances of `expand.exe` from the specified directories are malicious, which may not always be the case. Additionally, the alert requires that process creation logs are properly configured and collected from all endpoints for effective detection. Without comprehensive logging, potential incidents could go unnoticed.

