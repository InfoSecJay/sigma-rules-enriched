title: Suspicious Child Process Created as System
id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
status: test
description: Detection of child processes spawned with SYSTEM privileges by 
  parents with LOCAL SERVICE or NETWORK SERVICE accounts
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://foxglovesecurity.com/2016/09/26/rotten-potato-privilege-escalation-from-service-accounts-to-system/
- https://github.com/antonioCoco/RogueWinRM
- https://twitter.com/Cyb3rWard0g/status/1453123054243024897
author: Teymur Kheirkhabarov, Roberto Rodriguez (@Cyb3rWard0g), Open Threat 
  Research (OTR)
date: 2019-10-26
modified: 2024-12-01
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134.002
logsource:
  category: process_creation
  product: windows
  definition: 'Requirements: ParentUser field needs sysmon >= 13.30'
detection:
  selection:
    ParentUser|contains:
    - 'AUTHORI'
    - 'AUTORI'
    ParentUser|endswith:
    - '\NETWORK SERVICE'
    - '\LOCAL SERVICE'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
    User|endswith:     # System
    - '\SYSTEM'
    - '\Système'
    - '\СИСТЕМА'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains: 'DavSetCookie'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of child processes running with SYSTEM privileges, specifically when spawned by processes owned by the LOCAL SERVICE or NETWORK SERVICE accounts. This behavior may indicate an attempt to escalate privileges or execute malicious activities under a highly privileged context, often associated with lateral movement or establishing a foothold within a target network. The relevant MITRE ATT&CK tactic is **Privilege Escalation** (TA0004), with the technique identified as **Win32 Privilege Escalation** (T1134.002).

  Primary telemetry sources include Windows Process Creation events monitored via Sysmon (with a minimum version of 13.30). The security impact of this detection is significant; if confirmed as malicious, it may lead to an attacker gaining full control over affected systems. It is important to note that this detection does NOT confirm that a compromise has occurred on its own and further investigation is needed to determine intentions.

  ### Investigation Steps

  - **Check parent process user context:** Review Sysmon Event ID 1 for the Process ID of the suspicious child process. Confirm if the parent user is from LOCAL SERVICE or NETWORK SERVICE accounts, indicative of potential privilege escalation behavior.

  - **Validate child process integrity level:** Examine the integrity level of the child process using Sysmon Event ID 1. Confirm it shows as SYSTEM (S-1-16-16384), which is expected to be controlled and monitored, especially for processes spawned by non-administrative accounts.

  - **Analyze command line arguments:** For detected rundll32.exe process, analyze the CommandLine field in Sysmon Event ID 1 to identify specific parameters (e.g., occurrences of "DavSetCookie"). legitimate or expected command line executions should typically not invoke such arguments.

  - **Identify similar recent alerts:** Search across the last 30 days for similar patterns involving SYSTEM-level children spawned from NETWORK or LOCAL SERVICE parents. Consistency in alerts may indicate a larger, ongoing attack pattern as opposed to a one-off incident.

  - **Assess system role and impact:** Consider the role of the host where the alert was triggered (i.e., critical infrastructure or domain controller). Determine if this system's compromise could significantly impact the enterprise.

  - **Compare with known benign processes:** Research if the involved processes have an established benign history, especially for internal applications where known legitimate service accounts may invoke SYSTEM-level child processes for valid operational reasons.

  ### Prioritization

  This alert is classified as high severity due to the potential for escalated privileges on critical systems, which could jeopardize the integrity and confidentiality of the network. The technique is known to be weaponized in various attack scenarios, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited if Sysmon is not deployed or misconfigured; the requirement for the ParentUser field indicates that without Sysmon version >= 13.30, coverage may be incomplete. Legitimate activities, such as certain application behaviors or maintenance scripts, could also trigger this alert when executing under service accounts. A related detection that should be implemented includes monitoring for anomalies in service account logon events, which can help correlate this behavior with potential compromises.

