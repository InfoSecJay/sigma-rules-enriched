title: Suspicious Child Process Created as System
id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
status: test
description: Detection of child processes spawned with SYSTEM privileges by parents
  with LOCAL SERVICE or NETWORK SERVICE accounts
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://foxglovesecurity.com/2016/09/26/rotten-potato-privilege-escalation-from-service-accounts-to-system/
- https://github.com/antonioCoco/RogueWinRM
- https://twitter.com/Cyb3rWard0g/status/1453123054243024897
author: Teymur Kheirkhabarov, Roberto Rodriguez (@Cyb3rWard0g), Open Threat Research
  (OTR)
date: 2019-10-26
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.002
logsource:
  category: process_creation
  product: windows
  definition: 'Requirements: ParentUser field needs sysmon >= 13.30'
detection:
  selection:
    ParentUser|contains:
    - 'AUTHORI'
    - 'AUTORI'
    ParentUser|endswith:
    - '\NETWORK SERVICE'
    - '\LOCAL SERVICE'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
    User|endswith:     # System
    - '\SYSTEM'
    - '\Système'
    - '\СИСТЕМА'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains: 'DavSetCookie'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where a child process is created with SYSTEM privileges by a parent process running under the LOCAL SERVICE or NETWORK SERVICE accounts. This behavior often indicates an attempt to escalate privileges within a Windows environment, potentially allowing an attacker to execute unauthorized commands or gain a higher level of access than intended.

  Threat actors may exploit such privilege escalation techniques to move laterally within a network, install malicious software, or perform unauthorized data exfiltration. The use of `rundll32.exe` with specific command-line arguments like `DavSetCookie` is particularly suspicious, as it can be leveraged to invoke DLLs and execute code elevated to SYSTEM level.

  Relevant MITRE ATT&CK tactics include:
  - Privilege Escalation (TA0004)
    - T1134.002: Token Manipulation
  - Defense Evasion (TA0005)

  The primary data sources for this rule primarily include process creation events generated by Windows systems utilizing Sysmon (System Monitor), which provides detailed logging of process activity including their parent-child relationships and security context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Sysmon process creation logs for instances where child processes have been spawned by `LOCAL SERVICE` or `NETWORK SERVICE` accounts, particularly looking for entries with SYSTEM-level privileges.

  - **Examine Command-Line Arguments**: Focus on command-line arguments accompanying the `rundll32.exe` execution. Investigate any unusual or unexpected parameters, especially combinations that involve cookie setting or similar web-based operations.

  - **Correlate with User Accounts**: Check the user accounts associated with the parent processes. Ensure that any action taken by SYSTEM processes is legitimate and does not arise from unauthorized access or misuse of service accounts.

  - **Conduct Behavioral Analysis**: Look for patterns of behavior, such as repeated execution attempts of the same process, and assess whether they fit known attack indicators or customary operations within your environment.

  ### Prioritization
  The severity of this alert is high due to the potential for significant security breaches when SYSTEM-level access is improperly leveraged. The likelihood of exploitation increases with the use of trusted service accounts, which typically have fewer security controls compared to user accounts.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, particularly if Sysmon is not configured to generate comprehensive process creation logs or if relevant Windows events are not being monitored. The detection logic assumes that the attacker's behavior will involve manipulating parent processes belonging to service accounts, which may not always be the case. Moreover, it relies on the assumption that the relevant Windows and Sysmon configuration needed for effective detection is in place and that the environment is logged adequately to capture all related activity.

