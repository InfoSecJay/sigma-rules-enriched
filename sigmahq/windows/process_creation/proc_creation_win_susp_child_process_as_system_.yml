title: Suspicious Child Process Created as System
id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
status: test
description: Detection of child processes spawned with SYSTEM privileges by 
  parents with LOCAL SERVICE or NETWORK SERVICE accounts
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://foxglovesecurity.com/2016/09/26/rotten-potato-privilege-escalation-from-service-accounts-to-system/
- https://github.com/antonioCoco/RogueWinRM
- https://twitter.com/Cyb3rWard0g/status/1453123054243024897
author: Teymur Kheirkhabarov, Roberto Rodriguez (@Cyb3rWard0g), Open Threat 
  Research (OTR)
date: 2019-10-26
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.002
logsource:
  category: process_creation
  product: windows
  definition: 'Requirements: ParentUser field needs sysmon >= 13.30'
detection:
  selection:
    ParentUser|contains:
    - 'AUTHORI'
    - 'AUTORI'
    ParentUser|endswith:
    - '\NETWORK SERVICE'
    - '\LOCAL SERVICE'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
    User|endswith:     # System
    - '\SYSTEM'
    - '\Système'
    - '\СИСТЕМА'
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
  filter_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains: 'DavSetCookie'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects instances where a child process is created with SYSTEM privileges by a parent process running under LOCAL SERVICE or NETWORK SERVICE accounts. This behavior is often indicative of privilege escalation attempts, where an attacker aims to gain higher privileges on a compromised system. The relevant MITRE ATT&CK techniques are Privilege Escalation (T1068) and Privilege Escalation via Windows Service (T1134.002). The primary telemetry sources are Windows Security logs (Event ID 4688), Sysmon logs (Event ID 1), specifically monitoring the processes' parent and child relationships. If the detected activity is malicious, it can lead to complete system takeover and administrative access for the adversary. This detection does not confirm that the SYSTEM process is malicious on its own; further context is required to establish intent.

  ### Investigation Steps

  - **Review process creation events:** Analyze Windows Security Event ID 4688 or Sysmon Event ID 1 for the child process creation. Focus on the `ParentUser`, `User`, and `IntegrityLevel` fields to confirm that the observed child process was indeed created by a service account and runs with SYSTEM privileges.

  - **Check for known malicious command line usage:** Inspect the `CommandLine` field for the presence of `DavSetCookie`. This specific command usage in conjunction with `rundll32.exe` can indicate malicious intent, as it is often leveraged in exploitation scenarios.

  - **Identify expected behavior of service accounts:** Establish baseline behavior for LOCAL SERVICE and NETWORK SERVICE accounts in your environment, noting typical child processes they generate and their command line usage to spot anomalies against expected patterns.

  - **Correlate with endpoint logs:** Cross-reference alerts with additional telemetry such as EDR or endpoint logs for any anomalous behavior originating from the same asset. Look for any related odd system calls or abnormal network connections to assess the potential impact.

  - **Analyze historical execution context:** Investigate the timeline of process creation events leading to this detection to see if previous malicious behaviors have been documented for the asset or user in question.

  - **Assess asset criticality:** Because this detection can indicate a potential breach, check if the affected system is a critical asset within your infrastructure. Systems with greater privileges or sensitive data should prompt immediate action.

  ### Prioritization

  This alert is high-severity due to the system’s role as a potential target for privilege escalation. SYSTEM-level process creation is commonly abused by attackers for lateral movement or establishing persistence, making it a frequent target for exploitation. The likelihood of malicious abuse is high, especially if observed in conjunction with known malicious indicators.

  ### Blind Spots and Assumptions

  Detection may be limited by specific configurations of Sysmon and Windows logging, particularly if not all process creation events are captured. Legitimate scenarios that could trigger the alert include misconfigurations or automated process behaviors associated with service accounts. A related detection that strengthens coverage is monitoring process injection activities, which can provide additional context about possible exploitation attempts against services.

