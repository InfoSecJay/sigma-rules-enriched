note: |
  ### Technical Context

  This rule detects the execution of the Sysinternals tool PsSuspend, particularly when used to suspend critical processes such as Windows Defender (msmpeng.exe). The likely attacker objective is to disable security defenses to facilitate further malicious activities, such as malware installation or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic **Defense Evasion** (ID: T1685).

  The primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If this action is malicious, it can severely compromise system integrity and confidentiality by disabling protective mechanisms. Importantly, this detection does NOT confirm malicious activity on its own; it merely identifies the invocation of a potentially dangerous tool, which may also be used for benign or administrative purposes.

  ### Investigation Steps

  - **Check Event IDs:** Review Security Event ID 4688 and Sysmon Event ID 1 for process creation logs. Look for entries where the command line contains 'pssuspend.exe' or similar variants. Benign uses typically involve documented system administration tasks, while suspicious activities will show frequent invocation close to critical process names like 'msmpeng.exe.'

  - **Analyze Command Line Arguments:** Investigate the specific command line arguments passed to PsSuspend. Malicious indicators would include targeting critical system processes or security applications, whereas legitimate uses would not imply targeting sensitive applications.

  - **Cross-reference Process Parentage:** Validate the parent process of PsSuspend using Process Explorer or similar tools. Malicious execution may be initiated by processes like cmd.exe or PowerShell, whereas legitimate usage would originate from trusted administrative tools or user-initiated tasks.

  - **Assess for Additional Tool Usage:** Look for other Sysinternals tools executed in conjunction with PsSuspend, particularly tools that also act to bypass defenses, like PsExec or PsKill. This can indicate a broader malicious intent.

  - **Document Execution Context:** It can be useful to note whether PsSuspend is invoked by a user account with high privileges (e.g., SYSTEM or administrative role) versus a standard user account. High-privilege executions increase the risk of malicious activity.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical systems and the likelihood of being used in real-world attacks to evade defenses. Since PsSuspend usage is often correlated with attempts to disable security measures, it represents a significant indicator of potential compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of necessary log configurations for process creation events. Malicious actors may attempt to evade detection by running tools from non-standard locations or modifying command line parameters to appear legitimate. Legitimate administrative actions using PsSuspend for system maintenance could also trigger this alert. A related detection to consider is the invocation of PsExec (T1059.004), which often works in tandem with PsSuspend in layered attacks targeting defenses.

