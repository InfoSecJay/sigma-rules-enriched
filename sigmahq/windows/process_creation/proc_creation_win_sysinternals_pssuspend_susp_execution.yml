note: |
  ### Technical Context

  This Sigma rule detects the execution of Sysinternals PsSuspend, particularly when it is used to suspend critical processes like antivirus (AV) or endpoint detection and response (EDR) solutions, which are common tactics employed by attackers to bypass security measures. The likely attacker objective is to manipulate the operating environment by halting security services, thus allowing for further malicious activity without detection.

  The relevant MITRE ATT&CK tactics and technique for this detection include Defense Evasion (T1562) and Process Injection (T1055). The primary telemetry source is Windows process creation logs, particularly Event ID 4688, which captures the process creation details, including command line arguments. If malicious, the security impact can be severe, as suspended AV or EDR processes may result in undetected malware execution or data exfiltration. It is important to note that this detection alone does not confirm malicious intent, as there could be legitimate administrative use of the tool.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 for instances of 'pssuspend.exe' or 'pssuspend64.exe' being executed on systems where critical processes (e.g., msmpeng.exe) were also suspended, indicating potential abuse.

  - **Review command line arguments**: Look specifically at the CommandLine field in Event ID 4688. A command line containing 'msmpeng.exe' or other AV processes suggests potential malicious intent, while benign uses may involve administrative tasks with clear justifications.

  - **Validate process state**: Use Sysinternals tools or PowerShell to verify the state of the suspended process (e.g., msmpeng.exe). If it's running or can be started again without issues, this may support a contention that the suspension was for legitimate reasons.

  - **Correlate with additional logs**: Check for related logs from EDR or AV solutions for alerts or logs indicating abnormal activity around the same time, which may corroborate suspicious behavior or signal attempts to evade detection.

  - **Identify system criticality**: Assess the role of the affected asset. Suspending processes on critical servers or endpoints increases risk and should be prioritized for deeper investigation.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on security controls. The likelihood of malicious abuse is significant since PsSuspend is often weaponized in attacks targeting security software. Immediate investigation is warranted on systems that are integral to defense operations.

  ### Blind Spots and Assumptions

  This detection may face limitations, particularly if PsSuspend is executed on systems lacking comprehensive logging configurations. Legitimate administrative activities, such as maintenance tasks by IT staff using PsSuspend for troubleshooting, may trigger the alert. Additionally, companion detections, such as those for process injection techniques (e.g., T1055), can provide further insights into malicious workflows when used alongside this rule.

