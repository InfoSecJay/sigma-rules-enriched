note: |
  ### Technical Context

  This Sigma rule detects the execution of Sysinternals PsSuspend, specifically when it is used to suspend critical security processes such as Windows Defender (`msmpeng.exe`). The likely attacker objective is to disable or bypass security software, thereby facilitating further malicious activities without detection. This behavior is associated with the MITRE ATT&CK technique "Process Hollowing" (T1562.001), which falls under the tactic of "Defense Evasion." Primary telemetry sources include Windows process creation logs (Security Event ID 4688) and Sysmon logs (Event ID 1). If malicious, the ability to halt security processes can lead to significant security breaches and increased risk of compromise. It is important to note that this detection alone does not confirm malicious intent; legitimate usage of PsSuspend in administrative contexts may occur.

  ### Investigation Steps

  - **Verify Process Creation Events:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 to identify the creation of `pssuspend.exe`. Record the process ID and user context to understand if it aligns with known administrative actions.

  - **Analyze Command Line Arguments:** Review the command line for the `pssuspend.exe` execution to confirm it contains `msmpeng.exe`, indicating an attempt to suspend the Windows Defender process. Look for additional arguments that may indicate suspicious activity.

  - **Assess User Context:** Determine the user executing the command. Administrative user contexts are less concerning; however, any execution by non-administrative users warrants additional scrutiny.

  - **Inspect Related Processes:** Identify any active processes before and after the execution of `pssuspend.exe` for abnormal behavior or other processes that may be used to manipulate security settings (e.g., process names or paths unrelated to normal operations).

  - **Review Recent EDR/AV Logs:** Check for alerts or logs from your EDR/AV solutions related to `msmpeng.exe` that indicate attempts to suspend or alter its behavior. This can provide insight into whether the activity correlates with an evasion attempt.

  - **Document Legitimate Usage:** If found in a testing or scripted context, validate the intention behind using `pssuspend.exe` by cross-referencing with known maintenance or administrative procedures documented within your organization.

  ### Prioritization

  Given the impact of the affected system, especially if it is a critical endpoint or server running security solutions, the alert severity is high. The likelihood of malicious abuse is significant, as PsSuspend is commonly weaponized to prevent detection during attacks. This behavior typically indicates a heightened risk posture, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for legitimate administrative actions, which could trigger this alert. Additionally, evasion techniques may include using alternative tools or stealthy commands that do not leverage PsSuspend directly. Legitimate activity may occur during scheduled maintenance or legitimate administrative procedures within the environment. A related detection for monitoring could be general process creation anomalies, improving overall observability of suspicious command executions across the environment.

