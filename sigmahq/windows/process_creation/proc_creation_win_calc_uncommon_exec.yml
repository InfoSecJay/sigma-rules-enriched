title: Suspicious Calculator Usage
id: 737e618a-a410-49b5-bec3-9e55ff7fbc15
status: test
description: |
  Detects suspicious use of 'calc.exe' with command line parameters or in a suspicious directory, which is likely caused by some PoC or detection evasion.
references:
- https://twitter.com/ItsReallyNick/status/1094080242686312448
author: Florian Roth (Nextron Systems)
date: 2019-02-09
modified: 2023-11-09
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains: '\calc.exe '
  selection_2:
    Image|endswith: '\calc.exe'
  filter_main_known_locations:
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  condition: selection_1 or ( selection_2 and not filter_main_known_locations )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious instances of `calc.exe`, particularly when it is executed with command line parameters or launched from non-standard directories. The use of `calc.exe`, typically benign as a Windows calculator application, can indicate attempts at evasion tactics, especially when employed in an unusual context. Attackers may leverage common applications like this to serve as a cover for malicious activities, such as executing payloads or as part of a post-exploitation phase.

  The primary threat scenario here revolves around defense evasion tactics, where adversaries may attempt to mask their actions by using expected applications in unconventional ways. For instance, they could use `calc.exe` to execute arbitrary code with command line parameters that may appear benign at first glance. This behavior is consistent with MITRE ATT&CK tactics such as *Defense Evasion* (TA0005) and techniques like *Masquerading* (T1036), which includes legitimate applications being misused to avoid detection.

  The primary data sources for identifying these activities will be Windows process creation logs, where we can capture the execution of processes along with their command line arguments and originating directories.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs for instances of `calc.exe`, specifically focusing on command line arguments and source directories to identify any unusual parameters or paths.
  - **Assess Anomalous Behavior:** Look for a pattern of execution related to `calc.exe`. Determine if it follows typical user activity or if it appears out of context, such as during off-hours or in conjunction with other suspicious activities.
  - **Correlate with Other Logs:** Check system and security logs (like EDR or SIEM) for additional telemetry that may indicate malicious actions occurring alongside `calc.exe` executions, such as unusual network connections or file creations.
  - **Conduct User and System Context Analysis:** Investigate the user context under which `calc.exe` was executed. Verify if the execution aligns with normal user activity, including roles and recent access patterns.

  ### Prioritization
  This alert is considered high severity due to its potential to indicate an ongoing attack where attackers attempt to evade detection while executing malicious commands. The likelihood of an attack leveraging a benign application like `calc.exe` within an enterprise environment is significant, making timely investigation crucial.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage lies in the normal usage of `calc.exe` by users, which may generate false positives if not correlated with additional context. The detection logic assumes that execution parameters or atypical directories indicate malicious intent, but benign scenarios could exist. Additionally, effective log collection from Windows process creation events is required; any limitations in logging configurations or oversight of process creation events could hinder the alert's effectiveness.

