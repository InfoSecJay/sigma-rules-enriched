logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains: '\calc.exe '
  selection_2:
    Image|endswith: '\calc.exe'
  filter_main_known_locations:
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  condition: selection_1 or ( selection_2 and not filter_main_known_locations )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious usage of `calc.exe` when executed with command-line parameters or from non-standard directories. Attackers may use this tactic to execute malicious payloads while attempting to blend in with legitimate activity, thus masking their true intentions. The likely objective is to execute or obfuscate code in the context of a common operating system utility.

  The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically the technique "Indicator Removal on Host" (T1036). This detection mainly relies on process creation telemetry, specifically Windows Event ID 4688 (process creation events) which captures command-line execution details, including the location and parameters used.

  If malicious, the impact can be significant, as this could indicate a hostile actor leveraging a common tool to execute further attacks or evade detection. However, it is crucial to note that this detection alone does not confirm malicious intent; legitimate usage of calc.exe with parameters in non-standard locations may also occur.

  ### Investigation Steps

  - **Gather process creation events:** Query Windows Security Event ID 4688 for `calc.exe` instances. Look at the command line and image path for anomalies. Typical benign use would show standard paths (`C:\Windows\System32\calc.exe`) without unusual command-line arguments.

  - **Analyze command-line parameters:** Review the command-line arguments associated with `calc.exe`. Malicious indicators can include unusual parameters or scripts executed alongside. Legitimate usage typically has no or minimal command-line arguments.

  - **Check the execution directory:** Validate the image path of the `calc.exe` process. Legitimate executions will likely originate from `C:\Windows\System32\calc.exe`. Check for executions from unusual directories (e.g., user profiles or TEMP folders).

  - **Correlate other system activities:** Look for related activities in the same timeframe, such as abnormal outbound network connections or creation of new services (Event ID 4697), which could indicate lateral movement or further exploitation.

  - **Validate asset criticality:** Determine if the host running `calc.exe` is critical to business operations or has access to sensitive data. Higher criticality systems should be prioritized for further analysis.

  ### Prioritization

  This alert should be considered high priority in a mature enterprise environment due to the potential impact of a legitimate application being used as a cover for malicious activity. The use of common tools like `calc.exe` is a tactic often employed by attackers, increasing the likelihood of abuse by adversaries.

  ### Blind Spots and Assumptions

  Detection may have limitations due to potential evasion techniques, such as attackers renaming or moving binaries to avoid detection. Reliable detection requires proper configuration to ensure all relevant logs are captured, particularly Windows Security logs for process creation. Legitimate administrative tasks could trigger this alert, such as scripted checkups or automated processes. A related detection improvement would be monitoring for script executions (e.g., PowerShell or batch files) that could also signal malicious intent associated with atypical `calc.exe` usage.

