title: Suspicious Calculator Usage
id: 737e618a-a410-49b5-bec3-9e55ff7fbc15
status: test
description: |
  Detects suspicious use of 'calc.exe' with command line parameters or in a suspicious directory, which is likely caused by some PoC or detection evasion.
references:
- https://twitter.com/ItsReallyNick/status/1094080242686312448
author: Florian Roth (Nextron Systems)
date: 2019-02-09
modified: 2023-11-09
tags:
- attack.stealth
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains: '\calc.exe '
  selection_2:
    Image|endswith: '\calc.exe'
  filter_main_known_locations:
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  condition: selection_1 or ( selection_2 and not filter_main_known_locations )
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_calc_uncommon_exec/info.yml
note: |
  ### Technical Context

  This Sigma rule detects suspicious executions of 'calc.exe' that occur with non-standard command line parameters or from directories not commonly associated with legitimate usage. This behavior might indicate an attacker trying to evade detection or utilize the calculator application as a cover for malicious activity, such as executing additional payloads or embedding shell commands.

  The primary MITRE ATT&CK tactic represented here is **Defense Evasion** (ID: T1036), specifically focusing on **Masquerading** techniques. The telemetry primarily comes from Windows process creation logs, relying on Security Event ID 4688 or Sysmon Event ID 1, which capture detailed command line arguments and execution paths. If malicious, this behavior can lead to greater compromise of the system and potentially lateral movement within the network. Importantly, this detection does not confirm malicious intent without additional context or corroborating evidence.

  ### Investigation Steps

  - **Examine the process creation logs**: Look for Security Event ID 4688 or Sysmon Event ID 1. Check the command line parameters associated with 'calc.exe'. Legitimate usage typically includes non-parameterized executions from standard directories.

  - **Identify directory paths**: Validate the directory path where 'calc.exe' was executed. Executions from non-standard locations (e.g., user temp folders) are suspicious and could indicate evasion techniques.

  - **Review previous executions of calc.exe**: Analyze historical logs for the same user or host for patterns of suspicious use. Multiple launches with parameters can suggest automated scripts or evasion tactics.

  - **Detect related processes**: Check for anomalies by reviewing any parent processes or immediate successor processes launched after 'calc.exe'. Malicious indicators could be parent processes like PowerShell or cmd.exe.

  - **Correlate with other telemetry**: Cross-reference findings with other security tools. Look for indications of file creation or manipulation in the directory where 'calc.exe' was executed, focusing on unusual file names or extensions created shortly before or after the execution.

  - **Assess user activity**: Identify if the user account launching 'calc.exe' has a legitimate business need for this tool. Unexpected usage could indicate compromised accounts or insider threats.

  ### Prioritization

  This alert is considered **high severity** due to the potential impact on security if used maliciously, particularly if the affected system has greater privileges or accesses sensitive data. The likelihood of adversaries utilizing commonly available tools like 'calc.exe' for nefarious purposes is considerable, as it allows them to blend in with legitimate processes.

  ### Blind Spots and Assumptions

  The detection may miss cases where legitimate applications are intentionally named to resemble system utilities or where benign command line arguments are used creatively. Accurate coverage necessitates comprehensive logging configurations, including both process creation and invocation of command line arguments. Legitimate user activity, such as IT troubleshooting tasks, can unintentionally trigger the alert. Considering companion detections, monitoring for PowerShell activity related to the same timeframe could provide strengthened visibility into potential malicious use.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
