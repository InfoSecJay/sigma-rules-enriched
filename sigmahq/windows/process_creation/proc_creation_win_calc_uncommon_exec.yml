logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains: '\calc.exe '
  selection_2:
    Image|endswith: '\calc.exe'
  filter_main_known_locations:
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  condition: selection_1 or ( selection_2 and not filter_main_known_locations )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects instances where `calc.exe` is executed with unusual command line parameters or from non-standard directories. Attackers may misuse `calc.exe` as part of a covert strategy to evade detection, often embedding malicious payloads to exploit system vulnerabilities or perform lateral movement.

  The relevant MITRE ATT&CK tactics and techniques for this detection are **Defense Evasion (T1203)**, with the technique specifically indicating the use of benign applications for malicious purposes. Primary telemetry sources include process creation logs, namely Windows Event ID 4688 and Sysmon Event ID 1, detailing command line executions and paths. If malicious, such behavior could indicate an attempt to manipulate processes without raising immediate alarms. It is important to clarify that this detection does NOT confirm malicious activity on its own; legitimate usage may trigger the rule under certain conditions.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 and Sysmon Event ID 1 for `calc.exe` execution details, focusing on the CommandLine and ImagePath fields. Legitimate uses typically include execution from `C:\Windows\System32\calc.exe` with no additional parameters.

  - **Analyze command line arguments**: Look for suspicious patterns in the CommandLine field that include unusual parameters or scripts. Malicious indicators may include parameters that suggest remote execution or obfuscation methods.

  - **Correlate execution timestamps**: Assess the timeline of when `calc.exe` was executed in relation to other system events, such as service starts or file modifications. Anomalies like execution times during off-hours or after known attacks may indicate malicious intent.

  - **Check parent processes**: Evaluate the ParentProcessId field in logs to identify which process initiated `calc.exe`. Malicious executions often have an unusual parent process, such as PowerShell or another scripting host.

  - **Investigate filesystem activity**: Review the creation of files or modifications in suspicious directories following the execution of `calc.exe`. Artifact creation or changes around the time of execution may suggest an escalation attempt or payload delivery.

  ### Prioritization

  This alert carries high severity due to the potential for misuse of benign applications to facilitate unauthorized actions on critical systems. The likelihood of malicious abuse is elevated, particularly given the common exploitation practices within enterprise environments. This behavior is not typical and warrants immediate investigation.

  ### Blind Spots and Assumptions

  Common evasion techniques include attackers renaming or mimicking benign applications like `calc.exe`, which may evade some detection mechanisms. Reliable detection requires complete logging from Windows Security and Sysmon, configured to capture detailed process creation events. Additionally, legitimate administrative tools or troubleshooting activities may unintentionally trigger this alert, such as system administrators using `calc.exe` for standard calculations during maintenance. A related detection that reinforces coverage is monitoring for PowerShell command execution patterns, as they're often used in conjunction with applications like `calc.exe`.

