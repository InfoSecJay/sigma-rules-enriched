title: Potential Suspicious Mofcomp Execution
id: 1dd05363-104e-4b4a-b963-196a534b03a1
status: test
description: |
  Detects execution of the "mofcomp" utility as a child of a suspicious shell or script running utility or by having a suspicious path in the commandline.
  The "mofcomp" utility parses a file containing MOF statements and adds the classes and class instances defined in the file to the WMI repository.
  Attackers abuse this utility to install malicious MOF scripts
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
- https://github.com/The-DFIR-Report/Sigma-Rules/blob/75260568a7ffe61b2458ca05f6f25914efb44337/win_mofcomp_execution.yml
- https://learn.microsoft.com/en-us/windows/win32/wmisdk/mofcomp
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2023-04-11
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mofcomp.exe'
  - OriginalFileName: 'mofcomp.exe'
  selection_case:
  - ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wsl.exe'
    - '\wscript.exe'
    - '\cscript.exe'
  - CommandLine|contains:
    - '\AppData\Local\Temp'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - '%temp%'
    - '%tmp%'
    - '%appdata%'
  filter_main_wmiprvse:
    ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    CommandLine|contains: 'C:\Windows\TEMP\'
    CommandLine|endswith: '.mof'
  filter_optional_null_parent:
        # Sometimes the parent information isn't available from the Microsoft-Windows-Security-Auditing provider.
    CommandLine|contains: 'C:\Windows\TEMP\'
    CommandLine|endswith: '.mof'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious execution of the Windows Management Instrumentation (WMI) compilation utility, "mofcomp.exe," typically triggered by inconspicuous shell processes (e.g., cmd.exe, PowerShell). The detection targets adversaries attempting to exploit WMI by installing malicious MOF scripts for persistence or command execution. This aligns with the MITRE ATT&CK framework, specifically Tactic: Defense Evasion and Technique: T1218 (Signed Binary Proxy Execution).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1). If malicious, such behavior can lead to unauthorized access or control over the system via WMI. It is important to note that this detection alone does not confirm malicious intent; legitimate use of "mofcomp" exists, particularly in administrative tasks.

  ---

  ### Investigation Steps

  - **Review parent process: **Correlate process execution with Security Event ID 4688 to identify the parent process; suspicious parents include cmd.exe or PowerShell. Legitimate parent processes often include system management tools.

  - **Examine command-line arguments: **Look for command-line patterns in the process creation logs, particularly those containing paths like "\AppData\Local\Temp" or using environment variables such as "%temp%". Legitimate executions typically do not use these high-risk locations.

  - **Check for existing WMI classes: **Query the system for unusual WMI classes or instances created around the time of the "mofcomp" execution. Look for signs of abnormal activities such as unexpected pending deletions or configurations.

  - **Identify malicious execution patterns: **Cross-reference the command-line for ".mof" file operations in the execution context. High confidence indicators include non-standard WMI classes or instances loading unexpected scripts not documented in registry setups.

  - **Audit file creation timestamps: **Validate creation timestamps of the targeted MOF files located in temporary directories (e.g., C:\Windows\TEMP\). Malicious artifacts often show creation very close to the execution time of "mofcomp".

  ---

  ### Prioritization

  This alert carries high severity due to the potential exploitation of WMI for malicious persistence and command control. The common abuse of "mofcomp" in cyberattacks prompts immediate investigation, especially in environments where administrative privileges are high.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include possible legitimate uses of "mofcomp" by system administrators, which may trigger false positives. Required log sources such as process creation logs must be enabled and properly configured for reliable detection. Legitimate activities that might trigger this alert include routine system maintenance or WMI configuration tasks. A related detection to strengthen coverage would involve monitoring changes to WMI repositories and audit logs, which can help correlate cohort incidents.

