title: Potential Suspicious Mofcomp Execution
id: 1dd05363-104e-4b4a-b963-196a534b03a1
status: test
description: |
  Detects execution of the "mofcomp" utility as a child of a suspicious shell or script running utility or by having a suspicious path in the commandline.
  The "mofcomp" utility parses a file containing MOF statements and adds the classes and class instances defined in the file to the WMI repository.
  Attackers abuse this utility to install malicious MOF scripts
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
- https://github.com/The-DFIR-Report/Sigma-Rules/blob/75260568a7ffe61b2458ca05f6f25914efb44337/win_mofcomp_execution.yml
- https://learn.microsoft.com/en-us/windows/win32/wmisdk/mofcomp
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2023-04-11
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mofcomp.exe'
  - OriginalFileName: 'mofcomp.exe'
  selection_case:
  - ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wsl.exe'
    - '\wscript.exe'
    - '\cscript.exe'
  - CommandLine|contains:
    - '\AppData\Local\Temp'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - '%temp%'
    - '%tmp%'
    - '%appdata%'
  filter_main_wmiprvse:
    ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    CommandLine|contains: 'C:\Windows\TEMP\'
    CommandLine|endswith: '.mof'
  filter_optional_null_parent:
        # Sometimes the parent information isn't available from the Microsoft-Windows-Security-Auditing provider.
    CommandLine|contains: 'C:\Windows\TEMP\'
    CommandLine|endswith: '.mof'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `mofcomp.exe` as a child process of suspicious shells or scripts and identifies command-line arguments that may indicate malicious use. Attackers often use `mofcomp.exe`, which adds classes to the WMI repository, to execute malicious Management Object Format (MOF) scripts that can manipulate system settings or persist malware. This behavior fits within the MITRE ATT&CK framework under the tactic "Execution" (TA0002) and the technique "User Execution" (T1203) as attackers leverage this utility to execute code within the Windows environment.

  The primary telemetry sources include Windows process creation logs with `Event ID 4688` and Sysmon `Event ID 1`, which track process creation details and command-line arguments. If the detected behavior is malicious, it can lead to unauthorized system configuration changes and persistence mechanisms for further exploitation. However, this detection does NOT confirm that all executions of `mofcomp.exe` are malicious, as there are legitimate uses for this utility in system administration.

  ### Investigation Steps

  - **Analyze parent process:** Check the `ParentImage` field from `Event ID 4688`. Take note if it is `cmd.exe`, `powershell.exe`, or another suspicious shell. Legitimate uses typically occur from controlled scripts or administrative tools rather than from untrusted sources.

  - **Review command-line arguments:** Investigate the `CommandLine` field for the presence of temp directories or unusual paths. Indicators of malicious use include arguments containing paths like `\AppData\Local\Temp` or keywords like '%temp%'.

  - **Verify for high-confidence malicious indicators:** Look for instances where `mofcomp.exe` is run with an argument pointing to a MOF file located in a temporary directory. Record any command-line instances that end with `.mof`, as this is a strong indicator of suspicious activity.

  - **Assess related WMI activity:** Cross-reference `Event ID 4663` for any changes to WMI objects around the same time as the `mofcomp.exe` execution. Expected behavior would show limited changes from authorized administrative users rather than high-frequency access from scripts.

  - **Check for anomalies in process hierarchy:** Use Sysmon logs (Event ID 1) to observe process trees for this execution. Anomalies, such as a seemingly benign shell spawning `mofcomp.exe`, could indicate potential misuse.

  ### Prioritization

  This alert is of **high severity** due to the potential for significant impact on system security if malicious activity is confirmed. The likelihood of abuse is notable, as `mofcomp.exe` is commonly weaponized in targeted attacks to establish persistence or perform administrative tasks covertly.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative processes may trigger this rule, leading to potential false positives. The absence of historical logging for certain permission levels may obscure malicious actions. Additionally, some attackers may use alternative methods to avoid detection, such as crafting legitimate-looking WMI calls. Similar detections, such as those monitoring unauthorized WMI object modifications (e.g., using WinEvent 4663), can complement this detection for a clearer security posture.

