title: Potential Suspicious Mofcomp Execution
id: 1dd05363-104e-4b4a-b963-196a534b03a1
status: test
description: |
  Detects execution of the "mofcomp" utility as a child of a suspicious shell or script running utility or by having a suspicious path in the commandline.
  The "mofcomp" utility parses a file containing MOF statements and adds the classes and class instances defined in the file to the WMI repository.
  Attackers abuse this utility to install malicious MOF scripts
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
- https://github.com/The-DFIR-Report/Sigma-Rules/blob/75260568a7ffe61b2458ca05f6f25914efb44337/win_mofcomp_execution.yml
- https://learn.microsoft.com/en-us/windows/win32/wmisdk/mofcomp
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2023-04-11
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mofcomp.exe'
  - OriginalFileName: 'mofcomp.exe'
  selection_case:
  - ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wsl.exe'
    - '\wscript.exe'
    - '\cscript.exe'
  - CommandLine|contains:
    - '\AppData\Local\Temp'
    - '\Users\Public\'
    - '\WINDOWS\Temp\'
    - '%temp%'
    - '%tmp%'
    - '%appdata%'
  filter_main_wmiprvse:
    ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    CommandLine|contains: 'C:\Windows\TEMP\'
    CommandLine|endswith: '.mof'
  filter_optional_null_parent:
        # Sometimes the parent information isn't available from the Microsoft-Windows-Security-Auditing provider.
    CommandLine|contains: 'C:\Windows\TEMP\'
    CommandLine|endswith: '.mof'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "mofcomp" utility, which is known to be abused by attackers to install malicious Managed Object Format (MOF) scripts that interact with Windows Management Instrumentation (WMI). The likely attacker objective is to establish persistence or to leverage WMI for further malicious activity, such as executing code or deploying additional payloads. This detection corresponds to the MITRE ATT&CK technique T1218 (System Firmware). The primary telemetry sources include Windows process creation logs (Event ID 4688 and Sysmon Event ID 1), focusing on the command line parameters and parent process relationships. If this behavior is confirmed as malicious, it could lead to unauthorized data access or lateral movement within the environment. Importantly, this detection does NOT alone confirm that an attack is occurring; it signals suspicious activity that requires deeper investigation.

  ### Investigation Steps

  - **Review parent process details: ** Check the parent process for "mofcomp.exe" using Security Event ID 4688 and Sysmon Event ID 1. Evaluate whether it is launching from legitimate sources such as `C:\Windows\System32\` or from suspicious paths (e.g., `C:\Users\Public\`).

  - **Examine command line arguments: ** Analyze the command line associated with the "mofcomp" execution for the presence of temp directory paths like `\AppData\Local\Temp\` or `\WINDOWS\Temp\`. Legitimate use may include standard operations such as device settings updates; any unusual parameters should be flagged.

  - **Identify malicious indicators: ** Look for indicators of compromise such as unusual file names (e.g., those with `.mof` extensions) located in the `C:\Windows\TEMP\` directory executed via non-standard parent processes such as `cmd.exe` or `powershell.exe`.

  - **Check WMI repository status: ** Use the WMI command-line tool (`wmic`) to query the repository's health and verify that no suspicious MOF classes have been created. Look for unexpected or non-standard entries that could signal malicious modifications.

  - **Cross-reference user context: ** Investigate the user account associated with this execution to determine if there are any previous alerts or anomalies related to that account in the last 30 days. Look for patterns of anomalous behavior or access rights that might indicate compromise.

  - **Confirm expected behavior: ** Validate if the execution aligns with known processes or maintenance scripts run by system admins. Legitimate administrative actions would typically involve executing "mofcomp" directly associated with known management tools or scripts rather than from temporary directories.

  ### Prioritization

  This alert carries a high-severity rating due to the potential impact of unauthorized changes to WMI, which could facilitate further compromise. The nature of "mofcomp.exe" being abused by various threat actors heightens its likelihood as a malicious tactic, making detection and response critical in mitigating potential threats.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility of missing processes if log collection for parent-child relationships is incomplete or if WMI interaction is established by other means. Legitimate administrative scripts that utilize "mofcomp" for system maintenance could inadvertently trigger this alert. A companion detection rule targeted at monitoring unusual WMI activity or monitoring for known bad MOF scripts may enhance overall security visibility and coverage against these tactics.

