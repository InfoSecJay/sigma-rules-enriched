title: Potentially Suspicious Mofcomp Execution
id: 1dd05363-104e-4b4a-b963-196a534b03a1
status: test
description: |
  Detects execution of the "mofcomp" utility as a child of a suspicious shell or script running utility or by having a suspicious path in the commandline.
  The "mofcomp" utility parses a file containing MOF statements and adds the classes and class instances defined in the file to the WMI repository.
  Attackers abuse this utility to install malicious MOF scripts
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
- https://github.com/The-DFIR-Report/Sigma-Rules/blob/75260568a7ffe61b2458ca05f6f25914efb44337/win_mofcomp_execution.yml
- https://learn.microsoft.com/en-us/windows/win32/wmisdk/mofcomp
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
modified: 2026-08-06
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mofcomp.exe'
  - OriginalFileName: 'mofcomp.exe'
  selection_case:
  - ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wsl.exe'
    - '\wscript.exe'
    - '\cscript.exe'
  - CommandLine|contains:
    - '\AppData\Local\Temp'
    - '\Contacts\'
    - '\Favorites\'
    - '\Favourites\'
    - '\Music\'
    - '\Pictures\'
    - '\Users\Public\'
    - '\Videos\'
    - '\WINDOWS\Temp\'
    - '%appdata%'
    - '%temp%'
    - '%tmp%'
  filter_main_wmiprvse:
    ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    CommandLine|contains: 'C:\Windows\TEMP\'
    CommandLine|endswith: '.mof'
  filter_main_installutil:
    ParentCommandLine|endswith: '\InstallUtil.exe /Uninstall C:\Windows\CCM\Microsoft.ConfigurationManager.SVProvider.dll'
    ParentImage|endswith: '\InstallUtil.exe'
    CommandLine|contains|all:
    - 'C:\Windows\TEMP'
    - '.tmp'
  filter_optional_null_parent:
    ParentCommandLine:
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the "mofcomp" utility under potentially suspicious conditions, specifically when it is initiated by a known scripting or command shell (e.g., `cmd.exe`, `powershell.exe`) or when the command line includes suspicious paths associated with temporary directories. Attackers use "mofcomp" to parse and register malicious Management Object Format (MOF) files to the Windows Management Instrumentation (WMI) repository, which may serve as a persistence mechanism or for other malicious purposes.

  The likely attacker objective is to establish persistence or execute pre-defined commands through WMI, contributing to lateral movement or further malicious activity. Relevant MITRE ATT&CK tactics and techniques include "Execution" (TA0002) and "Command and Scripting Interpreter" (T1059) as well as "IMPLANT Persistence" via WMI (T1218). The primary telemetry sources needed for this detection are process creation logs, specifically Windows Event ID 4688 or Sysmon Event ID 1, that capture details regarding process execution.

  If malicious, the presence of "mofcomp" execution indicates a significant compromise; however, this detection does NOT confirm malicious intent without further context. It’s essential to correlate with additional telemetry for a thorough assessment.

  ### Investigation Steps

  - **Check the Parent Process:** Review the logs for Event ID 4688 and identify the parent process of "mofcomp.exe." Legitimate executions will typically have system processes as parents, while suspicious ones may derive from cmd.exe or powershell.exe.

  - **Analyze Command Line Arguments:** Examine the command line associated with "mofcomp.exe." If it contains path strings (e.g., `%temp%`, `C:\Users\Public\`, etc.), evaluate which files or MOFs were being processed and where they originated from (e.g., local temp directories).

  - **Correlate with WMI Activity:** Investigate WMI activity, specifically querying the WMI repository for newly registered classes post-execution of "mofcomp." This can identify any potentially installed malicious classes. Monitor for entries associated with non-standard namespaces or unexpected classes.

  - **Identify Download Activity:** Look for recent download artifacts that may contain malicious MOF scripts. This can be achieved by reviewing the network logs (firewall and proxy logs) and searching for downloads from suspicious URLs or IP addresses.

  - **Examine Artifact Creation:** Investigate file creation timestamps and contents in the `%temp%` or similar directories identified in the command line. Malicious indicators include unusual file types (e.g., `.mof` files) or attributes that suggest tampering (e.g., altered timestamps).

  - **Review Legitimate Use Cases:** Validate with known-good behavior by checking whether "mofcomp.exe" was called in the context of legitimate applications (e.g., software installations that require WMI registration) when issued from expected parent processes.

  ### Prioritization

  This alert is classified as high severity due to the potential for significant impacts, such as establishing persistence or executing unauthorized commands on critical systems. The likelihood of malicious abuse is elevated given the known usage of "mofcomp" for nefarious purposes in advanced persistent threat (APT) scenarios. This behavior is not common in standard operations, making it a noteworthy indicator.

  ### Blind Spots and Assumptions

  Detection may miss sophisticated evasion techniques, such as the use of signed binaries or encrypted WMI scripts that do not trigger the alert. Reliance on specific path patterns may lead to false positives from legitimate administrative tasks. Additionally, the detection requires that process creation logging is reliably enabled across endpoints. A related detection to consider is the execution of WMI queries or access to the WMI repository, as it can indicate attempts to enumerate or manipulate system configurations following MOF exploitation.

