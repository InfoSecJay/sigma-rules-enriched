title: Suspicious Ping/Del Command Combination
id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
status: test
description: Detects a method often used by ransomware. Which combines the 
  "ping" to wait a couple of seconds and then "del" to delete the file in 
  question. Its used to hide the file responsible for the initial infection for 
  example
references:
- https://blog.sygnia.co/kaseya-ransomware-supply-chain-attack
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2022/06/23093553/Common-TTPs-of-the-modern-ransomware_low-res.pdf
- https://www.acronis.com/en-us/blog/posts/lockbit-ransomware/
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/blackbyte-exbyte-ransomware
author: Ilya Krestinichev
date: 2022-11-03
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Note: In the case of sysmon and similar logging utilities, see this discussion https://github.com/SigmaHQ/sigma/discussions/4277
    # Example: "C:\Windows\System32\cmd.exe"  /C ping 127.0.0.7 -n 3 > Nul & fsutil file setZeroData offset=0 length=524288 "C:\Users\User\Desktop\lockbit\lockbit.exe" & Del /f /q "C:\Users\User\Desktop\lockbit\lockbit.exe".
  selection_count:
    CommandLine|contains|windash: ' -n '
  selection_nul:
    CommandLine|contains: 'Nul'     # Covers "> Nul" and ">Nul "
  selection_del_param:
    CommandLine|contains|windash:
    - ' -f '
    - ' -q '
  selection_all:
    CommandLine|contains|all:
    - 'ping'         # Covers "ping" and "ping.exe"
    - 'del '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of a command-line sequence that combines a `ping` command with `del` (delete) to obfuscate deletion of potentially malicious files, a technique often leveraged by ransomware to clean up after payload execution. The likely attacker objective is to execute malware while minimizing detection through file deletion. This behavior relates to the MITRE ATT&CK tactic of Defense Evasion (T1070.004) and targets Windows environments.

  Primary telemetry sources include Windows Security Event ID 4688 (process creation) capturing command line arguments, and Sysmon Event ID 1, which may also log these commands. If malicious, this activity signifies an attempt to remove evidence of file-based malware execution, significantly impacting the integrity and availability of affected systems. Importantly, this detection does NOT confirm that the file was successfully deleted or that malicious intent exists without further context.

  ### Investigation Steps

  - **Review command line execution logs**: Analyze Security Event ID 4688 and Sysmon Event ID 1 for process creation log entries. Look for command lines detailing usage of `ping` followed by `del`, particularly noting patterns with `> Nul`.

  - **Identify benign uses of ping**: Determine whether the `ping` command is associated with legitimate network diagnosis operations. Include investigations of known scripts or scheduled tasks using `ping` for legitimate purposes.

  - **Check for followed deletion patterns**: Look for instances where deletion follows unusual use of `fsutil file setZeroData`, which could indicate an effort to erase files following execution. Validate any files targeted for deletion against known good file inventories.

  - **Correlate with filesystem changes**: Examine file system logs, particularly looking for file removal (e.g., using the `del` command) in the paths indicated in command lines. Identify file names or locations associated with known ransomware families, particularly those mentioned in threat intelligence sources.

  - **Assess system criticality and role**: Determine the role of the impacted host (e.g., server vs. workstation) and its criticality. Elevated privileges on sensitive systems (like domain controllers) warrant a higher level of scrutiny.

  - **Validate file indicators in process creation**: If files such as `lockbit.exe` are identified, check their hash against known malware signatures in threat repositories for definitive malicious indicators.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact on critical systems and the likelihood that this command sequence is indicative of ransomware activity. Given that this method is a common tactic among ransomware groups, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  The detection may be limited by environments not logging command-line arguments or lacking comprehensive monitoring on endpoints. Evasion techniques might include using obfuscation methods to hide the presence of `ping` or `del`. Legitimate system maintenance scripts or scheduled tasks that employ similar commands can trigger this alert. Companion detections worth considering include monitoring for unusual file creation patterns or execution traces via Sysmon Event ID 1 related to suspicious executable behavior.

