title: Suspicious Ping/Del Command Combination
id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
status: test
description: Detects a method often used by ransomware. Which combines the 
  "ping" to wait a couple of seconds and then "del" to delete the file in 
  question. Its used to hide the file responsible for the initial infection for 
  example
references:
- https://blog.sygnia.co/kaseya-ransomware-supply-chain-attack
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2022/06/23093553/Common-TTPs-of-the-modern-ransomware_low-res.pdf
- https://www.acronis.com/en-us/blog/posts/lockbit-ransomware/
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/blackbyte-exbyte-ransomware
author: Ilya Krestinichev
date: 2022-11-03
modified: 2024-03-05
tags:
- attack.stealth
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
    # Note: In the case of sysmon and similar logging utilities, see this discussion https://github.com/SigmaHQ/sigma/discussions/4277
    # Example: "C:\Windows\System32\cmd.exe"  /C ping 127.0.0.7 -n 3 > Nul & fsutil file setZeroData offset=0 length=524288 "C:\Users\User\Desktop\lockbit\lockbit.exe" & Del /f /q "C:\Users\User\Desktop\lockbit\lockbit.exe".
  selection_count:
    CommandLine|contains|windash: ' -n '
  selection_nul:
    CommandLine|contains: 'Nul'     # Covers "> Nul" and ">Nul "
  selection_del_param:
    CommandLine|contains|windash:
    - ' -f '
    - ' -q '
  selection_all:
    CommandLine|contains|all:
    - 'ping'         # Covers "ping" and "ping.exe"
    - 'del '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects a pattern where the `ping` command is used to introduce a delay before executing the `del` command to delete a specified file. This behavior is often leveraged by ransomware to mask the initial file responsible for infection, effectively attempting to destroy evidence of the malicious payload. The primary MITRE ATT&CK technique associated with this behavior is **T1070.004 - File Deletion**, with the overarching tactic being **T1027 - Obfuscated Files or Information**.

  The main telemetry sources for this detection include process creation logs (such as Security Event ID 4688) and command line arguments captured via Sysmon (Event ID 1). If this behavior is indeed malicious, it indicates an attempted obfuscation tactic meant to hinder detection and investigation. However, the detection does NOT confirm that a malware infection is definitely occurring; it merely highlights suspicious command execution related to file deletion.

  ### Investigation Steps

  - **Identify process execution details**: Review Security Event ID 4688 logs to check for the command line corresponding to the `cmd.exe` execution, specifically looking for snippets that include `ping` and `del`. Validate that there is a clear timing relation, indicating the execution order is intended to be malicious.

  - **Check command output direction**: Look for logs indicating the output being directed to `Nul` (using the marker `> Nul`). Commands using this directionality are suspicious as they indicate a possible intent to mask output and activities.

  - **Legitimate behavior checks**: Identify benign use cases for `ping` and `del` commands. Common administrative tasks might involve legitimate testing via `ping` without subsequent deletion of files, or using `del` on non-malicious user files.

  - **High-confidence malicious indicator**: Identify any preceding process (especially unusual or non-standard applications) that led to the command execution observed. Linux or Windows native tools executing arbitrary file deletions, particularly against files from known ransomware families, should be flagged for further action.

  - **Review file creation/deletion events**: Use Sysmon (Event ID 11) to confirm that the file intended for deletion was indeed a malicious executable (e.g., `lockbit.exe`). Monitor the timeline for file modifications that coincide with the suspicious command execution.

  - **Investigate system roles**: Consider the host's role in the environment. If the system is a critical server or contains sensitive data, prioritize this alert over activities originating from less critical endpoints.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive systems and the high likelihood of malicious intent. The behavior follows a common ransomware technique, indicating a risk of data loss or compromise if not investigated and mitigated promptly.

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion through command obfuscation or alternative tools that avoid detection of `cmd.exe`. Reliable detection of this behavior requires proper logging configurations (e.g., Sysmon and Security Event logs). Additionally, legitimate activities—such as routine system maintenance or administrative file management—may trigger similar commands. Strengthening detection coverage could involve monitoring for unusual command line arguments or scripted automation that frequently invokes file system changes.

