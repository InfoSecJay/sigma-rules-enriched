  ### Technical Context

  This Sigma rule detects the execution of `diantz.exe` to compress target files into CAB files stored in Alternate Data Streams (ADS). The likely objective is to hide malicious files or artifacts within the file system, making detection more difficult. This behavior aligns with the MITRE ATT&CK technique for Alternate Data Stream (T1564.004), which is often employed in data exfiltration and evasion tactics.

  Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments and process execution details. If executed maliciously, leveraging ADS can lead to stealthy data manipulation or malware persistence. This detection does NOT confirm intent or guarantee that malicious actions have occurred; it simply indicates unusual behavior that warrants further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 with command line evidence containing `diantz.exe` and `.cab` within the CommandLine field. Look for unexpected usage on critical servers or endpoints.

  - **Correlate with ADS usage patterns:** Check for file modifications in the ADS of legitimate artifacts by using tools like `dir` or PowerShell’s `Get-Item`. Legitimate usage may include scheduled tasks or application updates, while unusual patterns could indicate malicious activities.

  - **Identify suspicious command-line attributes:** Investigate the presence of `:[^\\]` in the command-line logs to confirm that ADS is being accessed. This is an indicator of potential obfuscation efforts by adversaries.

  - **Cross-reference with file creation events:** Validate whether any CAB files are created or modified in unusual locations using File Creation/Modification events (e.g., Event ID 4663). Invasive or suspicious file names should be treated with caution.

  - **Analyze historical user behavior:** Check for any prior legitimate usage of `diantz.exe` on the system to understand the normal operational baseline. Look for evidence of scheduled tasks or configuration management that might justify its use.

  ### Prioritization

  The alert severity is medium due to the potential for impact on sensitive data and the likelihood that an attacker may use this technique to evade detection. While not as commonly weaponized as other methods, the risk of system compromise through ADS manipulation is significant.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging configuration does not capture all necessary Windows process creation events or if the ADS feature is not actively monitored. Legitimate administrative activities or specific backup tools may trigger this alert. Companion detections that might strengthen coverage include monitoring for unauthorized file access attempts or anomalous use of system utilities associated with data manipulation.

