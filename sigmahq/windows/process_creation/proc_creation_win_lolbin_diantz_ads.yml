  ### Technical Context

  This Sigma rule detects the execution of the Diantz tool, which is often used to compress files into a CAB format stored in an Alternate Data Stream (ADS). The primary aim of an attacker utilizing this technique is to hide malicious files in a less visible location on the file system, thereby evading standard detection methods. This behavior corresponds with the MITRE ATT&CK technique T1564.004, which focuses on hiding artifacts via Alternate Data Streams.

  The primary telemetry sources for this detection include process creation logs specific to Windows, such as Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, this behavior may facilitate further exploitation by obfuscating payloads and preventing easy identification by security tools. Importantly, this detection rule does NOT confirm the execution of malicious activities on its own; additional context is necessary to understand the legitimacy of the behavior observed.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Security Event ID 4688 for instances of `diantz.exe` in the command-line for a match. Confirm that unusual or unexpected processes are present alongside it, indicating potential misuse.

  - **Examine Command Line Arguments**: Look for `.cab` in the command-line arguments for `diantz.exe` to identify possible compression of files into ADS. Note the paths and associated user privilege levels to assess whether this aligns with normal user behavior.

  - **Assess the Location of ADS**: Investigate the alternate data stream of the file being modified (using the command `dir /R` in Windows). Verify whether the files compressed by Diantz are in typical user directories, which could indicate malicious behavior if they’re in sensitive or unusual locations.

  - **Establish Normal Operational Expectations**: For a baseline, review the expected use cases and legitimate activities involving `diantz.exe` within your organization. Determine if users regularly create and compress files into cab formats in alternate data streams.

  - **Identify Malicious Indicators**: Look for behavior suggesting the compressed files contain known malware signatures or are associated with command-and-control communications. This may include unusual IP addresses or domain names referenced in the compressed files.

  ### Prioritization

  The alert severity is medium, as the affected systems are likely Windows environments that could be key in processing sensitive data. The likelihood of malicious abuse is significant, given the stealthy nature of techniques that use Alternate Data Streams for hiding files. This tactic is often weaponized by attackers to maintain access and obfuscate their activities.

  ### Blind Spots and Assumptions

  Detection may be limited by systems not logging process creation events adequately or if Alternate Data Streams are not being monitored. Legitimate activities that may trigger this alert include users employing Diantz for legitimate compression tasks. Companion detections to consider include alerts for suspicious file creation in general or monitoring for the presence of known malicious files via file integrity monitoring tools.

