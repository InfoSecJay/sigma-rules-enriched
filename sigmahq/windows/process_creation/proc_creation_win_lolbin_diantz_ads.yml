  ### Technical Context
  This detection rule identifies the use of Diantz.exe, a utility that compresses files into a cabinet (CAB) format, particularly when it is executed in the context of an Alternate Data Stream (ADS) on Windows systems. Attackers may leverage ADS functionality to evade detection during malicious activities, as data stored in ADS can be hidden from standard file system views. The suspected threat scenario involves adversaries aiming to store or execute malicious payloads without triggering conventional alerts, facilitating later retrieval or execution.

  The relevant MITRE ATT&CK tactics are Defense Evasion, specifically the technique ID T1564.004, which refers to the use of Alternate Data Streams for hiding malware or tools. This behavior can be indicative of advanced persistent threats (APTs) or other malicious actors intending to maintain access while evading security measures.

  The primary data sources that can provide evidence of this behavior include process creation logs from Windows Event Logs, which capture details about commands executed on the system, and potentially file system monitoring logs that track changes to files and their Alternate Data Streams.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify instances of `diantz.exe` being executed. Focus on the command line arguments to confirm the usage of `.cab` files and check for any unusual parent processes.

  - **Check File System for ADS:** Investigate files that may have Alternate Data Streams by using tools that can enumerate ADS on the filesystem. Look for files with unexpected or suspicious streams containing compressed data.

  - **Analyze Context of Execution:** Determine the circumstances around the execution of `diantz.exe`, including the user account that initiated the command, related network activities, and recent changes made to the system prior to the detection.

  - **Assess for Other Evasion Techniques:** Look for other signs of defense evasion such as missing indicators of compromise (IOCs), hidden files, or unusual activity in file directories that often host malicious content.

  ### Prioritization
  This alert carries medium severity due to its potential association with advanced evasion tactics. The likelihood of malicious use is increased in enterprise environments where sensitive information or critical infrastructure could be targeted.

  ### Blind Spots and Assumptions
  Detection may not cover all instances of ADS usage, particularly if command-line arguments change or if other similar utilities are used to create CAB files. The detection logic assumes that all executions of `diantz.exe` with corresponding patterns are malicious, which might not be true in all contexts. Additionally, proper logging must be configured to capture process creation events effectively, ensuring that the necessary telemetry is available for analysis.

