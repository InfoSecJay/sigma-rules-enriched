note: |
  ### Technical Context

  This Sigma rule detects the execution of files with misleading double extensions or deceptive characters that conceal malicious executable files, such as `.pdf.exe` or filenames containing spaces and underscores before the `.exe` extension. Attackers aim to trick users into executing these files, which could lead to the deployment of malware. This behavior falls under the MITRE ATT&CK tactic of **Initial Access** and the technique **Phishing: Spear Phishing Attachment (T1566.001)**. The primary telemetry source involves process creation events from Windows, specifically **Event ID 4688** and possibly **Sysmon Event ID 1**. If the behavior is malicious, it could compromise systems, leading to data breaches or persistent access. However, this detection does NOT confirm that the file is malicious, as it can also indicate legitimate use cases.

  ### Investigation Steps

  - **Review process creation logs:** Check for **Event ID 4688** for the detected suspicious executable paths. Focus on the **Image** and **CommandLine** fields for double extensions or deceptive characters.

  - **Identify benign usage:** Check for legitimate applications such as document viewers or editors (e.g., `winword.exe` or `explorer.exe`) that may initiate processes with expected filenames. Ensure they do not invoke the suspicious patterns detected.

  - **Correlate with user behavior:** Investigate the user account context who executed the process. Look for unusual behavior such as access to sensitive files or generic user accounts that support a spear phishing scenario.

  - **Check file properties:** Verify the properties of the suspicious file, particularly focusing on file creation timestamps and whether the file was executed from a user’s downloads directory or a temporary folder, which is common in phishing attacks.

  - **Analyze network activity:** Use network logs to validate any outbound connections immediately following the execution of the detected file. Look for unusual domains in DNS or traffic to known malicious IPs that could indicate further compromise.

  - **Look for additional indicators of compromise:** Reference related detection rules (e.g., for known malware signatures or subsequent suspicious processes) that could indicate broader malicious activity or payload delivery.

  ### Prioritization

  Given the high-impact nature of this detection, (i.e., execution of potential malware) and the likelihood that this method is used in spear phishing attacks, alerts should be prioritized. If such behavior is observed on critical systems or user accounts with elevated privileges, it should be treated with high urgency.

  ### Blind Spots and Assumptions

  This detection may have limitations if the event logs are not properly configured, potentially leading to missed executions. Additionally, legitimate programs may execute files with similar names (like document preview features), thus potentially triggering the alert. Companion detections such as monitoring for known malicious file hashes or specific user behavior anomalies can enhance overall detection effectiveness.

