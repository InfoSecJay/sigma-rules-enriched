note: |
  ### Technical Context
  This detection rule identifies suspicious file execution involving double extensions that disguise executable files, a tactic often employed in spear phishing campaigns. For instance, a file named "document.pdf.exe" attempts to fool users into thinking it is a harmless PDF when, in fact, it is a malicious executable. Attackers use these misleading extensions to bypass initial defenses and execute payloads on compromised systems, ultimately aiming to accomplish objectives such as data exfiltration, lateral movement, or the establishment of persistence.

  Relevant MITRE ATT&CK techniques for this behavior include:
  - Initial Access: Phishing (T1566) - The act of delivering malicious content through deceptive communications.
  - Spear Phishing Attachment (T1566.001) - Targeting specific users with crafted attachments designed to execute when opened.

  The primary data sources for this detection will be process creation events from Windows systems, as they log instances of executable files being run, alongside command line arguments which reveal the full name and paths of executed files.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for any newly created processes with the suspicious double extension patterns outlined in the rule, paying specific attention to parent processes that may indicate how these files were executed.
  - **Analyze Command Line Arguments**: Look for suspicious command line inputs linked to those processes. Examine arguments that may provide context about the execution chain and any associated malware behavior.
  - **Correlate with User Activity**: Investigate recent user activity to determine if the execution correlates with atypical patterns, such as accessing files via email or unusual downloads that could suggest a phishing attempt.
  - **Inspect File Properties**: If the suspicious files are accessible, assess their properties such as their hash values, creation timestamps, and digital signatures to identify if they match known malware or if they are linked to user-specific galleries or directories.

  ### Prioritization
  Given the high likelihood of impact associated with executed malware disguised as legitimate files, this alert is prioritized as high severity. Successful execution of such files can lead to unauthorized access, data breaches, and significant operational disruption.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where process creation logs are not fully enabled or where endpoint logging is insufficient. This rule assumes that logs of both executed file names and command line executions are readily available and properly parsed. Additionally, analysts should be aware that some legitimate software may utilize similar double extensions, potentially leading to false positives requiring further investigation to validate the alerts.

