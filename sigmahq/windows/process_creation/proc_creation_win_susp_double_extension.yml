note: |
  ### Technical Context

  This Sigma rule detects the execution of files with misleading double extensions, such as `.pdf.exe` or `.doc.exe`. Such patterns are commonly used in spear phishing attacks, where attackers aim to trick users into running malicious payloads disguised as benign documents. The likely attacker objective is to achieve initial access by executing malware on targeted systems.

  This detection corresponds to the MITRE ATT&CK tactic "Initial Access" (TA0001) and technique "Phishing: Spear Phishing Attachment" (T1566.001). The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688, which provides details on new processes spawned on the system. If detected, there is significant security impact, as malicious files could lead to data breaches, system compromise, or lateral movement within the network. However, it is crucial to note that this detection alone does not confirm malicious intent; legitimate applications may also exhibit similar behavior in rare cases.

  ### Investigation Steps

  - **Check the process creation logs:** Look for Security Event ID 4688 to see which specific process was executed. Focus on processes that trigger this rule, especially those originating from non-standard locations or users with limited privileges.

  - **Examine the command line arguments:** Investigate the CommandLine field from Event ID 4688 to identify the complete command used for execution. Malicious indicators include command lines containing double extensions with spaces or unusual characters, indicating an attempt to obfuscate the executable.

  - **Validate the context of the file:** Determine the parent process through Event ID 4688's ParentImage field. Legitimate applications (e.g., Microsoft Word for .docx files) should show expected parent processes, while suspicious ones may point to command shells (e.g., cmd.exe) or other unexpected executables.

  - **Review file path and source:** Scrutinize the file path of the executed file for typical indicators of malicious activity. Files executed from user directories or temporary folders, particularly those with file names that resemble existing documents but have suspicious extensions, are a strong indicator of an attack.

  - **Assess user behavior:** Identify the user account that executed the file. If the user is a regular employee and the activity occurs outside of normal operational contexts (e.g., off-hours), this could indicate malicious behavior.

  - **Cross-reference with threat intelligence:** Use threat intelligence resources to check if the observed file names or hashes are associated with known malware campaigns or attacking groups, further confirming the likelihood of malicious intent.

  ### Prioritization

  This alert should be prioritized as high severity, given that the affected systems are often critical to operational functionality and user productivity. The likelihood of malicious abuse is high because deceptive file extensions are a common tactic used in successful phishing campaigns. The behavior is frequently weaponized, making prompt investigation essential.

  ### Blind Spots and Assumptions

  This detection may be limited by adversary evasion techniques that alter executable formats or use legitimate applications to carry out attacks. Reliable detection requires comprehensive logging configurations for Event ID 4688, and a focus on user training is needed to mitigate risks associated with legitimate activities that could trigger these alerts. Companion detections focused on unusual outbound network activity can enhance security visibility by capturing potential exfiltration attempts post-execution.

