note: |
  ### Technical Context

  This Sigma rule detects instances where the `regedit.exe` tool is used to export critical Windows Registry keys to a file, specifically targeting keys such as those found in `HKEY_LOCAL_MACHINE` that may contain sensitive information. The likely objective of an attacker utilizing this behavior is to exfiltrate critical system configuration, security settings, or account information, which could facilitate further unauthorized access or privilege escalation. This activity can be mapped to the MITRE ATT&CK technique “Registry Run Keys / Startup Folder” (T1012).

  Primary telemetry sources include process creation events (Windows Security Event ID 4688 or Sysmon Event ID 1) that detail command line arguments and the executed process. If this behavior is malicious, it could lead to unauthorized access to stored credentials or configuration, compromising the system's security posture. It is important to note that this detection does NOT confirm that malicious intent is present without additional context; legitimate activities such as backup operations or forensic investigations may trigger the same alerts.

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 or Sysmon Event ID 1. Look for instances of `regedit.exe` with command line arguments including `-E`, targeting paths like `hklm`, `\system`, or `\sam`.

  - **Correlate with known safe activities:** Assess for recent backup or maintenance tasks that may explain legitimate use of registry exports. Check timestamps and user accounts involved in the activities to validate their purpose, especially for management accounts or scheduled tasks.

  - **Identify high-confidence malicious indicators:** Look for command lines that specifically export sensitive keys such as `\system`, `\sam`, or `\security` that don’t correlate to known business operations. Focus on unusual scheduling or user accounts not typically associated with routine maintenance.

  - **Cross-reference with user behavior analytics:** Review user activity logs to determine whether the exporting of registry keys corresponds with other suspicious behaviors, such as failed login attempts (Event ID 4625) or unusual access patterns for the user account used.

  - **Check the resulting output file:** If an exported file is located, verify its contents and timestamp to ensure it aligns with expected behavior and no sensitive information has been exfiltrated.

  ### Prioritization

  The alert severity is high due to the potential impact on sensitive information exposure and the likelihood of malicious intent in exporting critical registry keys. This behavior is often weaponized by attackers looking to gather credentials or system data for further exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of full logging, as some event sources must be properly configured and monitored continuously. Also, legitimate administrative tasks such as backups or system repairs could inadvertently trigger the rule. A companion detection to enhance coverage would be monitoring for unusual file access or exfiltration behaviors following registry exports, such as file creation events in suspicious directories (e.g., unusual `$TEMP` locations).

