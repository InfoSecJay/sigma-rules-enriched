title: Regsvr32 DLL Execution With Uncommon Extension
id: 50919691-7302-437f-8e10-1fe088afa145
status: test
description: Detects a "regsvr32" execution where the DLL doesn't contain a common
  file extension.
references:
- https://app.any.run/tasks/34221348-072d-4b70-93f3-aa71f6ebecad/
author: Florian Roth (Nextron Systems)
date: 2019-07-17
modified: 2023-05-24
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\regsvr32.exe'
  - OriginalFileName: 'REGSVR32.EXE'
  filter_main_legit_ext:
    CommandLine|contains:
            # Note: For better accuracy you might not want to use contains
    - '.ax'
    - '.cpl'
    - '.dll'         # Covers ".dll.mui"
    - '.ocx'
  filter_optional_pascal:
    CommandLine|contains: '.ppl'
  filter_optional_avg:
    CommandLine|contains: '.bav'
  filter_main_null_4688:
    CommandLine:
  filter_main_empty_4688:
    CommandLine: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate extensions currently not in the list either from third party or
  specific Windows components.
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances of `regsvr32.exe` being executed with unusual or rare file extensions that do not match common formats associated with legitimate DLLs. Attackers may exploit `regsvr32.exe` to execute malicious payloads disguised as DLL files, potentially facilitating privilege escalation, persistence, or obfuscation efforts. The execution of DLLs with uncommon extensions can indicate the use of tactics to evade detection and maintain an ongoing foothold in the network.

  Relevant MITRE ATT&CK techniques associated with this detection include:
  - **Technique T1574: Hijack Execution Flow** - The use of regsvr32 may indicate an attempt to hijack the execution flow of the system.
  - **Technique T1055: Process Injection** - Unusual DLL execution could also be a step toward process injection.
  - **Technique T1105: Ingress Tool Transfer** - It may signify that the attacker has delivered tools or payloads through methods that are less scrutinized.

  Key data sources for monitoring this activity include process creation logs, particularly on Windows systems, which track the execution of applications and their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine process creation logs for `regsvr32.exe` executions that match the detection criteria, focusing on command line arguments and the context of execution.
  - **Analyze Command Line Arguments**: Investigate the command line arguments used during `regsvr32.exe` execution, particularly looking for unusual file extensions that do not conform to common DLL formats.
  - **Correlate with Other Logs**: Cross-reference any unusual executions with logs from file access events or network connections to see if the DLLs were loaded from suspicious locations or if there were subsequent connection attempts to known malicious servers.
  - **Assess for Legitimate Usage**: Determine if the observed executions can be attributed to authorized software installations or operational requirements within the organization to rule out false positives effectively.

  ### Prioritization
  This alert necessitates a medium severity level due to the potential implications of privilege escalation and persistence strategies it may signify. Attackers leveraging `regsvr32.exe` with unusual extensions could represent a serious operational threat, necessitating prompt investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the lack of visibility into all possible DLL extensions that may be used in a legitimate context, leading to potential false positives. The detection logic assumes that the presence of `regsvr32.exe` with uncommon extensions indicates malicious intent, which may not always be the case. Proper logging configurations and monitoring capabilities are required on Windows endpoints to ensure comprehensive visibility of process creation, including command line information. Without these logs, the effectiveness of this detection is significantly diminished.

