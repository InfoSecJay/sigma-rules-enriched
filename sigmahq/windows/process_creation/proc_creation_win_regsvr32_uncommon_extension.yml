title: Regsvr32 DLL Execution With Uncommon Extension
id: 50919691-7302-437f-8e10-1fe088afa145
status: test
description: Detects a "regsvr32" execution where the DLL doesn't contain a 
  common file extension.
references:
- https://app.any.run/tasks/34221348-072d-4b70-93f3-aa71f6ebecad/
author: Florian Roth (Nextron Systems)
date: 2019-07-17
modified: 2023-05-24
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\regsvr32.exe'
  - OriginalFileName: 'REGSVR32.EXE'
  filter_main_legit_ext:
    CommandLine|contains:
            # Note: For better accuracy you might not want to use contains
    - '.ax'
    - '.cpl'
    - '.dll'         # Covers ".dll.mui"
    - '.ocx'
  filter_optional_pascal:
    CommandLine|contains: '.ppl'
  filter_optional_avg:
    CommandLine|contains: '.bav'
  filter_main_null_4688:
    CommandLine:
  filter_main_empty_4688:
    CommandLine: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate extensions currently not in the list either from third party 
  or specific Windows components.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects executions of `regsvr32.exe` that utilize atypical file extensions. The behavior suggests possible execution of malicious or unauthorized scripts masquerading as legitimate components. The likely attacker objective is to achieve persistence or escalate privileges by executing DLLs that are less likely to be monitored, potentially using the functionality of `regsvr32.exe` to load malicious code. This aligns with the MITRE ATT&CK technique for code execution (T1574) and may also impact persistence (T1547).

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments and parent-child relationships among processes. If executed by an adversary, this behavior could lead to system compromise, unauthorized access, or data exfiltration. Note, however, that this detection does not confirm malicious intent on its own; it solely indicates an anomalous implementation of `regsvr32.exe`.

  ---

  ### Investigation Steps

  - **Analyze the command line arguments**: Review the command line associated with the execution of `regsvr32.exe` from Security Event ID 4688 or Sysmon Event ID 1. Look for unusual file extensions like `.ppl`, `.bav`, or non-standard DLL extensions.

  - **Cross-reference file paths**: Validate the file path of the `regsvr32.exe` instance in use, focusing on `C:\Windows\System32\regsvr32.exe`. Executions from unusual directories (e.g., user profile locations or temp folders) may indicate malicious behavior.

  - **Identify parent process**: Examine the parent process for the `regsvr32.exe` execution; successful malfeasance typically involves processes like `cmd.exe` or `powershell.exe`. Legitimate processes should correlate with known software installation or configuration tasks.

  - **Check for detailed Sysmon logs**: If Sysmon is deployed, analyze logs for additional context about the executed process (Event ID 1). Correlate the execution with network activity, focusing on external connections initiated post-execution.

  - **Review system change artifacts**: Investigate any system configuration changes following the detected execution, using Event ID 4703 (which captures changes to permissions) to evaluate if unauthorized modifications were made.

  - **Document legitimate usage patterns**: Record instances where similar command executions were noted in a legitimate context, such as software updates or system configurations involving extensions that do not match the indicators specified in the rule.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact associated with the affected host, particularly if critical systems or servers are involved. The likelihood of malicious abuse is moderate, as this technique is characteristic of evasion tactics used in practical exploitation scenarios. Nonetheless, the behavior could also occur during legitimate administrative tasks, which must be considered during triage.

  ---

  ### Blind Spots and Assumptions

  Detection may miss executions with alternative naming conventions or obfuscations used to disguise `regsvr32.exe`. Comprehensive log collection is critical; ensure that Sysmon is deployed to enhance visibility. Additionally, legitimate software behavior, such as custom installers or administrative scripts, may trigger this alert. Complementary detections for DLL loading attempts (e.g., monitoring `LoadLibrary` calls) could strengthen defensive capabilities against such threats.

