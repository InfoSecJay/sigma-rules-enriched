title: Regsvr32 DLL Execution With Uncommon Extension
id: 50919691-7302-437f-8e10-1fe088afa145
status: test
description: Detects a "regsvr32" execution where the DLL doesn't contain a 
  common file extension.
references:
- https://app.any.run/tasks/34221348-072d-4b70-93f3-aa71f6ebecad/
author: Florian Roth (Nextron Systems)
date: 2019-07-17
modified: 2023-05-24
tags:
- attack.privilege-escalation
- attack.persistence
- attack.stealth
- attack.t1574
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\regsvr32.exe'
  - OriginalFileName: 'REGSVR32.EXE'
  filter_main_legit_ext:
    CommandLine|contains:
            # Note: For better accuracy you might not want to use contains
    - '.ax'
    - '.cpl'
    - '.dll'         # Covers ".dll.mui"
    - '.ocx'
  filter_optional_pascal:
    CommandLine|contains: '.ppl'
  filter_optional_avg:
    CommandLine|contains: '.bav'
  filter_main_null_4688:
    CommandLine:
  filter_main_empty_4688:
    CommandLine: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legitimate extensions currently not in the list either from third party 
  or specific Windows components.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects executions of the `regsvr32.exe` process, specifically when the executed DLL files have uncommon extensions not typically associated with legitimate Windows operations. Attackers may exploit this behavior to execute malicious scripts or payloads disguised as DLLs, intending to escalate privileges or maintain persistence on a system. This activity correlates with the MITRE ATT&CK tactics of Privilege Escalation (TA0004) and Execution (TA0002), specifically the technique T1574: Compiled HTML File (CHM) or other scripting mechanisms.

  The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688, which captures new process creation events. If malicious, this behavior could lead to unauthorized access or control over the affected system. Importantly, this detection alone does not confirm that the executed process is malicious without further context, as legitimate software may use uncommon extensions for various reasons.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 for `regsvr32.exe` entries. Identify associated CommandLine parameters to find any uncommon file extensions that do not match standard DLL, OCX, CPL, or AX formats.

  - **Investigate parent process relationships:** Check the parent process of the detected `regsvr32.exe` execution via Event ID 4688. Legitimate executions typically have trusted processes (e.g., `explorer.exe` or system maintenance tasks) as parents. Uncommon parent processes may indicate malicious activity.

  - **Cross-check file properties and locations:** For any identified DLL file, validate the file path and properties (such as Digital Signatures and Original File Name). Legitimate DLLs should originate from known directories (e.g., `C:\Windows\System32`).

  - **Analyze command-line parameters for suspicious indicators:** Look for potentially harmful command-line arguments in the process creation logs, such as obfuscation techniques or unexpected flags that deviate from standard usage.

  - **Check for known malicious indicators:** Utilize threat intelligence feeds or internal blacklists to identify if the executed DLL or its associated file path is associated with previous malicious incidents or behaviors.

  - **Assess system impacts based on host roles:** If the detected activity involves critical systems (e.g., domain controllers, application servers), prioritize investigation due to the elevated risk and potential impact of exploitation.

  ### Prioritization

  This alert is classified as medium severity since it targets common execution vectors for privilege escalation through `regsvr32.exe`, which could lead to serious breaches in critical systems. The risk of malicious exploitation is significant, particularly as this behavior can be weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by legitimate applications that utilize uncommon extensions for valid purposes, potentially leading to false positives. Required logs, such as process creation details, must be adequately retained and monitored for reliable detection. Events executed from legitimate administrative scripts may also trigger this alert. A related detection that strengthens coverage is examining unusual PowerShell script executions (using Event ID 4688 for `powershell.exe`), which may indicate coordinated malicious activities.

