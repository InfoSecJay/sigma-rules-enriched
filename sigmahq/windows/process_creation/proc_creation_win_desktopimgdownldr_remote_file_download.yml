title: Remote File Download Via Desktopimgdownldr Utility
id: 214641c2-c579-4ecb-8427-0cf19df6842e
status: test
description: Detects the desktopimgdownldr utility being used to download a 
  remote file. An adversary may use desktopimgdownldr to download arbitrary 
  files as an alternative to certutil.
