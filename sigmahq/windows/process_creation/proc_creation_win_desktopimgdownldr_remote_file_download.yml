title: Remote File Download Via Desktopimgdownldr Utility
id: 214641c2-c579-4ecb-8427-0cf19df6842e
status: test
description: Detects the desktopimgdownldr utility being used to download a remote
  file. An adversary may use desktopimgdownldr to download arbitrary files as an alternative
  to certutil.
references:
- https://www.elastic.co/guide/en/security/current/remote-file-download-via-desktopimgdownldr-utility.html
author: Tim Rauch, Elastic (idea)
date: 2022-09-27
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\desktopimgdownldr.exe'
    ParentImage|endswith: '\desktopimgdownldr.exe'
    CommandLine|contains: '/lockscreenurl:http'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the `desktopimgdownldr` utility, which can be leveraged by attackers to download files from remote sources. The context surrounding its usage is indicative of potential malicious activity, where an adversary aims to introduce malware, scripts, or other unauthorized content into a target environment. This specific method may be employed as an evasion technique, circumventing traditional security measures associated with more common tools like `certutil`.

  In terms of MITRE ATT&CK, the primary tactics involved are **Command and Control** (TA0011) and **Exfiltration** (TA0010), with the specific technique being **Exfiltration Over Command and Control Channel** (T1105). The rule monitors process creation events, particularly focusing on the `desktopimgdownldr` utility. This will generally capture evidence from logs pertaining to process executions from Windows-based environments.

  Relevant telemetry sources include **process creation event logs** from Windows systems, which will provide insights into the execution of the `desktopimgdownldr` utility along with its parameters and parent process details, aiding in further investigation of potential incursions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for instances of `desktopimgdownldr.exe` being executed. Look specifically at the command line arguments to identify any suspicious URLs or operation patterns that deviate from normal usage.

  - **Analyze Parent Process Relationships**: Investigate the parent processes that initiated `desktopimgdownldr.exe`. Determine if they align with known applications or if they signal a potentially suspicious routine establishing the execution context.

  - **Inspect Network Activity**: Check for any outbound network connections initiated around the same time the utility was executed. Analyze traffic to identify if external communications are being made to unfamiliar or blocked domains.

  - **Correlate with Threat Intelligence**: Utilize threat intelligence feeds to see if the observed execution patterns or download behaviors of `desktopimgdownldr` correlate with known malicious activities or campaigns.

  ### Prioritization
  This alert is classified as medium severity due to the potential for significant impact if an adversary successfully downloads and executes malicious payloads on an organization's systems. The likelihood is moderate, as while not all instances of `desktopimgdownldr` are malicious, its misuse has been associated with advanced threat actors.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by any gaps in process logging configurations, particularly if verbose logging is not enabled for process creation events. The detection logic assumes that every execution of the `desktopimgdownldr` utility with a specific command line pattern is suspect, which may not always be the case in legitimate use scenarios. Therefore, contextual awareness and correlation with other logs such as network and authentication logs may be necessary for accurate investigations. It is critical that the Windows Event Log settings are configured to log all process creation events for this alert to function effectively.

