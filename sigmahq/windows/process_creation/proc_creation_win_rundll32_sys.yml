note: |
  ### Technical Context

  This rule detects the execution of `rundll32.exe` with a command line argument referencing a `.sys` file, a behavior notably leveraged by threat actors, including UNC2452, to execute malicious payloads. The likely objective of the attacker is to execute or load a malicious driver, potentially leading to unauthorized system control or data exfiltration. The relevant MITRE ATT&CK tactic is Defense Evasion, and the technique is T1218.011 (Signed Binary Proxy Execution: rundll32).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can facilitate deeper system compromises or lateral movement within the network. Importantly, the detection does not confirm that the use of `rundll32.exe` in this manner is definitely malicious, as legitimate processes may also trigger the alert in specific contexts.

  ### Investigation Steps

  - **Review process execution timeline**: Check Windows Security Event ID 4688 to confirm the execution time, parent process, and user context. Look for suspicious parent processes such as `cmd.exe` or other tools typically used to launch `rundll32.exe`.

  - **Analyze command line arguments**: Inspect the command line used in the alert for additional context. Look for specific flags or parameters that initiate suspicious behavior, particularly those referencing `.sys` files. Malicious indicators include file paths leading to unexpected directories like `%TEMP%` or `C:\Windows\System32`.

  - **Correlate with Sysmon logs**: Examine Sysmon Event ID 1 for `rundll32.exe` execution details, focusing on the 'Image Loaded' field to see if it loads any unexpected or known malicious `.sys` files. Confirm if any loaded images match known threat signatures.

  - **Identify known benign use cases**: Document legitimate processes that may use `rundll32.exe` with `.sys` files, such as specific system updates or third-party trusted applications. Compare command line arguments against known safe patterns.

  - **Check for lateral movement artifacts**: Look for potential lateral movement by reviewing other affected Windows Security Event IDs from hosts within the same network segment, especially if the command line indicates usage of remote execution tools or command injection.

  - **Validate file creation or modification**: Confirm file creation or modification events in the same timeframe, including Sysmon Event ID 11 (FileCreate), which may detail the creation of unusual or malicious `.sys` files in system directories.

  ### Prioritization

  This alert warrants high priority due to the potential for severe impact on critical systems if exploited. The likelihood of this behavior being malicious is elevated, particularly given it mimics tactics used by advanced persistent threats (APTs). The use of `rundll32.exe` for executing driver-level code represents a significant risk for exploitation.

  ### Blind Spots and Assumptions

  Detection can be evaded by attackers using alternative methods to load the `.sys` files or utilizing lower-profile binaries. Additionally, all necessary Windows process creation logs must be enabled to ensure reliable detection. Legitimate administrative tasks or poorly configured software could unintentionally trigger this alert. Monitoring for related Sigma rules such as detecting suspicious driver loading activity will enhance coverage and improve response capabilities.

