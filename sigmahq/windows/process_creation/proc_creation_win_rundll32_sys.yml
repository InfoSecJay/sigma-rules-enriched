note: |
  ### Technical Context
  This rule detects suspicious activity involving the `rundll32.exe` process that is executed with command line arguments referencing `.sys` files. Such behavior is indicative of potential exploitation techniques used by adversaries, such as the UNC2452 threat group who has leveraged similar tactics for nefarious objectives like data exfiltration and lateral movement within targeted environments.

  The primary objective of attackers executing commands like this is to load malicious drivers or exploit vulnerabilities in legitimate drivers to gain higher privileges or manipulate system functions stealthily. Notably, this behavior ties to the MITRE ATT&CK framework under the tactic of **Defense Evasion** (TA0005) and the technique of **Run DLL hijacking** (T1218.011), highlighting its potential to bypass security controls and execute unauthorized actions in the system.

  The most relevant data sources for identifying such activities include **process creation logs** from Windows Event Logs, which capture detailed command line arguments used during process execution. Observing these logs can help reveal patterns consistent with malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for instances of `rundll32.exe` being executed, paying close attention to command lines containing `.sys` file references.
  - **Analyze Command Line Arguments**: Identify unusual or unexpected `.sys` files referenced in the command line. Investigate any file paths or names that do not align with known good entries.
  - **Correlate with File System Changes**: Look for recent changes in the file system, especially modifications or creations of `.sys` files in system directories, which may indicate the presence of malicious drivers.
  - **Check for Unusual Parent Processes**: Investigate the parent processes that initiated `rundll32.exe`. Assess whether any legitimate applications were running concurrently, providing context to perhaps benign actions versus potential malicious behavior.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact from successful privilege escalation and malicious runtime manipulation. Given the capabilities of such tactics to compromise systems or expose sensitive data, timely investigation is critical.

  ### Blind Spots and Assumptions
  This detection rule may not capture scenarios where attackers use alternate methods to invoke scripts or processes bypassing `rundll32.exe`, or if a legitimate application generates similar command line patterns. The detection logic assumes that appropriate logging settings are enabled on Windows systems to capture detailed process creation information. Additionally, the effectiveness of this alert relies on having complete and unaltered event logs; any misconfigurations could hinder detection capabilities.

