title: Execute Code with Pester.bat
id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
status: test
description: Detects code execution via Pester.bat (Pester - Powershell Modulte 
  for testing)
references:
- https://twitter.com/Oddvarmoe/status/993383596244258816
- https://github.com/api0cradle/LOLBAS/blob/d148d278f5f205ce67cfaf49afdfb68071c7252a/OSScripts/pester.md
author: Julia Fomina, oscd.community
date: 2020-10-08
modified: 2023-11-09
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  powershell_module:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Pester'
    - 'Get-Help'
  cmd_execution:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - 'pester'
    - ';'
  get_help:
    CommandLine|contains:
    - 'help'
    - '\?'
  condition: powershell_module or (cmd_execution and get_help)
falsepositives:
- Legitimate use of Pester for writing tests for Powershell scripts and modules
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Pester, a PowerShell module frequently used for testing scripts and validating code, via PowerShell or CMD. The likely objective of an attacker may involve running scripts that utilize Pester as a means of obfuscating malicious activity under the guise of legitimate testing. This behavior falls under the MITRE ATT&CK Tactic "Execution" (TA0002) and specifically targets the technique "Command and Scripting Interpreter" (T1059.001).

  The primary telemetry sources are process creation events, specifically those logged by Windows (Event ID 4688) or Sysmon (Event ID 1). If malicious, the execution of Pester can indicate code being run that may be harmful or unauthorized. Importantly, this detection does NOT confirm that malicious activity is occurring, as legitimate use of the Pester module for testing is common in development environments.

  ### Investigation Steps

  - **Check the command line for Pester usage:** Review process creation logs for Event ID 4688 (or Sysmon Event ID 1) to find instances where `powershell.exe` or `cmd.exe` contains the terms `Pester` and `Get-Help`. Legitimate use typically includes simple testing commands without unusual command chaining or lengthy execution times.

  - **Identify usage context:** Assess the context under which Pester was invoked by examining the parent process ID (PPID). Expected benign scenarios might involve known development or testing applications, while anomalous PPIDs could suggest malicious intent.

  - **Correlate with user activity:** Verify the user context against historical behavior. Investigate if the account running the command has a history of PowerShell use or any other indication of typical development activities.

  - **Look for error messages:** Analyze the command execution outputs or any logs that capture error messages when invoking `Get-Help` with Pester. Legitimate operations will follow standard PowerShell syntax without unexpected failures.

  - **Check for malicious scripts:** Examine for the presence of any new or modified scripts in directories associated with the command execution. Look for indicators of malicious PowerShell scripts that may leverage Pester, such as unexpected file creations in `%TEMP%` or unusual PowerShell session logs (Event ID 4104).

  ### Prioritization

  This alert should be prioritized as medium severity due to the risk of attackers leveraging legitimate tools like Pester for nefarious purposes. The systems involved are often critical, primarily in development environments, and while such behavior could indicate potential exploitation, it may also reflect regular testing practices.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of obfuscation techniques that disguise malicious intent within legitimate commands or behaviors. It is essential to ensure logging for PowerShell execution is properly configured and monitoring is in place for both Sysmon and Windows Event logs. Legitimate activities may include authorized testing and development efforts, which can trigger similar alerts. Related detections to consider for comprehensive coverage include monitoring PowerShell scripts for indications of added or modified artifacts leveraging other scam techniques (e.g., T1216).

