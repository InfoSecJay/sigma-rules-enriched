title: Execute Code with Pester.bat
id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
status: test
description: Detects code execution via Pester.bat (Pester - Powershell Modulte 
  for testing)
references:
- https://twitter.com/Oddvarmoe/status/993383596244258816
- https://github.com/api0cradle/LOLBAS/blob/d148d278f5f205ce67cfaf49afdfb68071c7252a/OSScripts/pester.md
author: Julia Fomina, oscd.community
date: 2020-10-08
modified: 2023-11-09
tags:
- attack.execution
- attack.stealth
- attack.t1059.001
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  powershell_module:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Pester'
    - 'Get-Help'
  cmd_execution:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - 'pester'
    - ';'
  get_help:
    CommandLine|contains:
    - 'help'
    - '\?'
  condition: powershell_module or (cmd_execution and get_help)
falsepositives:
- Legitimate use of Pester for writing tests for Powershell scripts and modules
level: medium
note: |
  ### Technical Context

  This Sigma rule detects code execution involving `Pester.bat`, a testing framework for PowerShell scripts, indicating potential misuse or internal reconnaissance efforts by an attacker. The likely attacker objective could include executing malicious scripts or manipulating PowerShell's functionalities to gather information or escalate privileges, which aligns with MITRE ATT&CK techniques such as **Execution** (T1059.001) and **Command and Scripting Interpreter** (T1216).

  Primary telemetry sources include process creation logs from Windows, such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to the execution of unwanted code that compromises system integrity or confidentiality. However, this detection alone does not prove the malicious intent of the executed code, as it could also stem from legitimate administrative activities or testing.

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Security Event ID 4688 for the execution of `powershell.exe` or `cmd.exe` with parameters containing `Pester`. Determine the user context to assess if it’s a legitimate user or a potentially compromised account.

  - **Examine Command Line Arguments**: Focus on CommandLine fields for any instance where `-Get-Help` or commands with `pester;` are used. Legitimate PowerShell testing should primarily involve structured scripts without multi-command execution.

  - **Identify Legitimate Use Cases**: Locate other instances of `Pester` usage within the environment to establish baseline behavior. Typically, scheduled testing tasks or administrative scripts should produce coherent logging around `Pester` without suspicious command chaining.

  - **Correlate with Security Alerts**: Investigate any associated alerts or previous suspicious activities correlated to the user or machine where `Pester.bat` was executed. Links to lateral movement indicators can imply malicious intent.

  - **Validate Against Known Malicious Activity**: Look for recognized patterns of abuse such as execution of tools like `Invoke-Expression` or `Invoke-Command` after Pester execution. This can indicate the use of backdoors or payload delivery mechanisms.

  ### Prioritization

  This alert has a medium severity level due to the potential impact of unauthorized code execution on systems that can lead to privilege escalation or data exfiltration. Malicious use of PowerShell and its modules is a prevalent tactic among attackers, indicating a high likelihood of abuse in environments with critical assets.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate activities triggering the alert, particularly in development environments where `Pester` is commonly used for scripting tests. Reliable detection requires comprehensive logging of process creation events and PowerShell execution parameters. Additionally, benign or legitimate administrative tasks may also trigger this alert, such as routine testing or script validation. Related detections, such as monitoring for `Invoke-Expression` usage, can bolster coverage against script-based execution threats.

