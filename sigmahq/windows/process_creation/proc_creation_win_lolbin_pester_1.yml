title: Execute Code with Pester.bat
id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
status: test
description: Detects code execution via Pester.bat (Pester - Powershell Modulte for
  testing)
references:
- https://twitter.com/Oddvarmoe/status/993383596244258816
- https://github.com/api0cradle/LOLBAS/blob/d148d278f5f205ce67cfaf49afdfb68071c7252a/OSScripts/pester.md
author: Julia Fomina, oscd.community
date: 2020-10-08
modified: 2023-11-09
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  powershell_module:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Pester'
    - 'Get-Help'
  cmd_execution:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - 'pester'
    - ';'
  get_help:
    CommandLine|contains:
    - 'help'
    - '\?'
  condition: powershell_module or (cmd_execution and get_help)
falsepositives:
- Legitimate use of Pester for writing tests for Powershell scripts and modules
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of Pester, a PowerShell module used for testing scripts and modules, via PowerShell or command line. The behavior is indicative of potential malicious activity when executed in a context unlikely to be legitimate, such as in environments with sensitive operations or data. The likely attacker objective could involve testing malicious scripts or evading security mechanisms through misuse of the Pester framework. This detection aligns with the MITRE ATT&CK technique for Command and Scripting Interpreter (T1059.001) and may also relate to defense evasion (T1216).

  The primary telemetry sources for this rule are process creation logs, specifically capturing events related to PowerShell (Event ID 4688) and command prompt executions. The security impact of a successful malicious execution could range from data exfiltration to lateral movement within a network. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use of Pester for testing purposes can trigger it.

  ---

  ### Investigation Steps

  - **Review command line details:** Examine the process creation logs (Event ID 4688) for the command lines. Look for specific patterns like "Pester" executed with "Get-Help" or "help" commands, as these may indicate legitimate use. Malicious patterns will often lack expected testing context.

  - **Validate user activity:** Cross-reference the user account associated with the detection against known legitimate uses of Pester within your organization. Identify any discrepancies or unexpected user activity within corporate assets.

  - **Check execution context:** Analyze the parent process IDs from logs to understand how Pester was invoked. Look for unusual parent processes that are not typically linked to testing environments, such as script hosts or unrelated applications.

  - **Identify high-confidence malicious indicators:** Focus on command line activity containing “pester” combined with suspicious formats or conjunctions (like ‘;’). Such patterns could indicate potential attempts to chain commands or execute malware.

  - **Assess system role and asset criticality:** Identify whether the system running the detected process has elevated privileges or handles sensitive information. These factors increase the potential impact of malicious executions.

  ---

  ### Prioritization

  Alert severity is medium due to the potential impact of Pester misuse on sensitive systems. While typically associated with legitimate testing, the specific contexts in which Pester is executed may indicate malicious behavior given the variable nature of adversaries utilizing scripting tools for exploitation.

  ---

  ### Blind Spots and Assumptions

  Limitations of detection include the potential for legitimate administrative use of Pester to trigger the alert without malicious intent. Reliable detection relies heavily on comprehensive logging configurations for PowerShell and command execution, particularly in environments where Pester is used. Legitimate automation testing processes utilizing Pester may result in false positives. An effective companion detection would be monitoring for anomalous execution patterns or unexpected process chains initiated by PowerShell or command prompt processes.

