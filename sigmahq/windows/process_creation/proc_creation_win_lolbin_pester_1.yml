title: Execute Code with Pester.bat
id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
status: test
description: Detects code execution via Pester.bat (Pester - Powershell Modulte for
  testing)
references:
- https://twitter.com/Oddvarmoe/status/993383596244258816
- https://github.com/api0cradle/LOLBAS/blob/d148d278f5f205ce67cfaf49afdfb68071c7252a/OSScripts/pester.md
author: Julia Fomina, oscd.community
date: 2020-10-08
modified: 2023-11-09
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  powershell_module:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains|all:
    - 'Pester'
    - 'Get-Help'
  cmd_execution:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - 'pester'
    - ';'
  get_help:
    CommandLine|contains:
    - 'help'
    - '\?'
  condition: powershell_module or (cmd_execution and get_help)
falsepositives:
- Legitimate use of Pester for writing tests for Powershell scripts and modules
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances of code execution originating from the `Pester.bat` script, which is part of the Pester framework used for testing PowerShell scripts. The rule is particularly relevant in scenarios where an attacker may leverage legitimate test frameworks and modules for malicious purposes, such as executing payloads or commands while evading detection. Attackers may aim to execute scripts to maintain persistence, perform reconnaissance, or facilitate lateral movement within a network.

  In the context of the MITRE ATT&CK framework, this behavior aligns with the following tactics and techniques:
  - **Execution** (T1203): utilizing legitimate tools within the environment to execute code.
  - **Defense Evasion** (T1216): using tools that might be trusted or standard in order to escape detection while executing potentially malicious scripts.

  Primary data sources that will provide the best evidence for this detection include process creation logs, which capture detailed information about the execution of commands and scripts, as well as command line arguments utilized during the execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for entries associated with `powershell.exe`, `pwsh.exe`, or `cmd.exe` where 'Pester', 'Get-Help', or variants appear in the command line arguments.

  - **Analyze Command Line Arguments**: Look specifically for instances of command lines that include ';' which may indicate command chaining often used to obscure malicious intent behind legitimate commands.

  - **Correlate with User Activity**: Validate if the executed commands align with known user behavior or approved use of Pester in your organization. Check if these commands were executed in expected contexts, like development environments.

  - **Cross-check with Threat Intelligence**: Utilize threat intelligence sources to investigate if there are known exploits or malicious uses of Pester that are relevant to your environment, especially regarding any ongoing campaigns or emerging threats.

  ### Prioritization
  The severity of alerts generated from the rule is medium due to the potential for misuse of legitimate tools like Pester in executing code that may compromise the integrity of systems. While the use of Pester itself can be benign, its execution in a non-standard or unexpected context should raise concern in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots related to scripts or commands that do not explicitly invoke 'Pester' but still leverage PowerShell or command-line executables such as `powershell.exe` and `cmd.exe` in other illicit ways. The detection logic assumes that Pester will be called in a typical manner that includes 'Get-Help' or similar constructs. Additionally, for the alert to function effectively, proper logging configurations for process creation must be enabled, and environments must be monitored consistently for this type of activity.

