note: |
  ### Technical Context

  This rule detects the execution of PowerShell with specific command line flags indicative of the Wmiexec tool, which is often leveraged by adversaries for lateral movement and command execution without raising red flags. The likely attacker objective is to execute arbitrary commands on remote systems while evading detection. This behavior aligns with the MITRE ATT&CK tactics of Lateral Movement (TA0031) and Execution (TA0040), specifically the technique for Remote Command Execution (T1047).

  Primary telemetry sources include process creation logs such as Windows Security Event ID 4688 and Sysmon Event ID 1. The security impact of successful exploitation includes potential data exfiltration, system compromise, or further spread within the network. Importantly, this detection does NOT confirm that the action is malicious on its own; it could be triggered by legitimate administrative activities or scripts.

  ### Investigation Steps

  - **Check the command line arguments:**
    Review Event ID 4688 and Sysmon Event ID 1 for processes with the command line containing `-NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc`. Malicious executions commonly use these flags.

  - **Evaluate parent-child process relationships:**
    Investigate the parent process of the PowerShell instance. Legitimate executions often originate from known administrative tools, while anomalous parent processes may indicate malicious behavior.

  - **Inspect user account context:**
    Verify the user account that initiated the PowerShell execution (refer to Event ID 4688, `SubjectUserName`). High-risk indicators include execution by highly privileged accounts performing unexpected tasks.

  - **Review network activity associated with PowerShell:**
    Examine logs from Windows Defender Firewall or networking tools for unusual outbound connections (such as to untrusted IPs) initiated shortly after the PowerShell execution. Legitimate admin work should have expected destination patterns.

  - **Confirm file modification or creation activities:**
    Check for file system changes or new file creation in relevant directories post-command execution. Malicious actors may leave scripts or payloads (`C:\Windows\Temp` or other temp folders) following their actions.

  ### Prioritization

  This alert is high severity due to the potential impact of lateral movement and execution capabilities by an attacker, particularly on sensitive systems. The actions represented are commonly weaponized tools within cyber-attacks, increasing the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited if process creation logging is not fully enabled, particularly in environments with overly restrictive logging configurations. False positives may arise from legitimate administrative scripts using similar PowerShell flags. Related detections include monitoring for usage of the `wmic` command, as it could indicate similar lateral movement or execution attempts, enhancing overall coverage against these techniques.

