  ---

  ### Technical Context

  This Sigma rule detects the use of the `icacls.exe` command to modify access control lists (ACLs) in a way that denies access to the "Everyone" group for specific files, particularly those found in the user profile (such as `C:\Users\admin\AppData\Local`). This behavior is often associated with an adversary's attempt to conceal malicious files by restricting visibility and access. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), with the corresponding technique being **Indicator Removal on Host** (T1564.001).

  Primary telemetry sources include Windows process creation logs, specifically targeting Event ID 4688, which captures the command line executed. If this activity is malicious, it can lead to insider threats, data exfiltration, and persistence of malware. Importantly, this detection does not confirm malicious intent by itself; legitimate administrative actions may trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review event logs for `icacls.exe`:** Check for Security Event ID 4688 where the `OriginalFileName` is `iCACLS.EXE` to confirm execution of the command.

  - **Examine command line arguments:** Investigate the CommandLine field for instances containing `/deny *S-1-1-0:`. Compare against expected usage patterns; legitimate administrative tasks typically do not deny access to "Everyone."

  - **Check file access permissions:** Use PowerShell or another management tool to list ACLs for the affected file (e.g., `Get-Acl "C:\Users\admin\AppData\Local\37f92fe8-bcf0-4ee0-b8ba-561f797f5696"`) and identify any unusual access restrictions.

  - **Identify file existence and legitimacy:** Validate if this specific file path contains unusual or previously unknown executables or scripts (e.g., check creation date and file size). Suspicious files commonly follow non-standard naming conventions.

  - **Evaluate asset criticality:** Consider the role of the asset (e.g., a user workstation vs. a server). Manipulation of files on critical infrastructure increases the potential impact.

  ---

  ### Prioritization

  The alert is of **medium severity**. While various users have legitimate reasons to modify file permissions, the restricted access on user profile directories can indicate an attempt at obfuscation or malware persistence. This behavior is commonly weaponized by threats looking to hide their activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded by adversaries utilizing alternative methods to change file permissions or by modifying system logs. The accuracy of detection relies heavily on capturing process creation logs; failure to log these events appropriately can lead to missed detections. Legitimate administrative activities, such as setting permissions for organizational compliance, may result in alerts. An additional related detection could involve monitoring for unusual file creation events in the same directory, providing a broader context for investigation.

