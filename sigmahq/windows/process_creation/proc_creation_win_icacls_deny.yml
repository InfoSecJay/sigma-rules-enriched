note: |
  ### Technical Context

  This rule detects the use of the `icacls` command utility to deny access rights for all users to a specified file or directory, commonly used to obscure malicious files from detection. The likely attacker objective is to hide malicious payloads by modifying file permissions, reducing the likelihood of user or administrator access to those files. It aligns with the MITRE ATT&CK technique "Hide Artifacts" (T1564.001).

  The primary telemetry source is Windows process creation logs, specifically capturing instances where `icacls.exe` is executed with denial flags. If this behavior is malicious, it could signify an attempt to thwart security measures and maintain persistence. Importantly, this detection does NOT confirm that the file is malicious or that an attack is actively occurring on its own; context and further investigation are essential.

  ### Investigation Steps

  - **Review process creation telemetry**: Search Security Event ID 4688 for any instance of `icacls.exe` being executed. Check the `CommandLine` field for parameters containing `/deny` and `*S-1-1-0:`.

  - **Identify suspicious command execution**: Validate that the command line includes both the `/deny` option and the SID `*S-1-1-0:` (Everyone). This combination is a strong indicator of an attempt to restrict access maliciously.

  - **Check for anomalous file locations**: Analyze the targeted file path in the command to determine if it points to known user folders (e.g., `C:\Users\<username>\AppData\Local\`). Legitimate usage usually does not affect personal directories in this manner.

  - **Correlate with other alerts**: Cross-reference any findings with existing alerts for related abnormal activity, such as suspicious user behavior in the context of file access or modifications.

  - **Assess file permissions changes**: Investigate the file or directory in question for permission changes. Use PowerShell or icacls to audit permissions and ensure they reflect expected behaviors.

  ### Prioritization

  This alert is medium severity because it targets user directories, which, if exploited, can lead to significant security risks. The likelihood of malicious exploitation is moderate as this technique is commonly weaponized by adversaries seeking to conceal their activities on a compromised system.

  ### Blind Spots and Assumptions

  The detection may miss manual permission changes executed via other means or by legitimate administrators. It assumes that log sources for process creation are accurately configured and comprehensive. Legitimate activities, such as users tweaking permissions on shared documents, may trigger the alert. A related detection that strengthens coverage includes monitoring for unexpected file creations and deletions within user directories, which may indicate a broader campaign of stealthy malicious behavior.

