note: |
  ### Technical Context

  This Sigma rule detects the use of the `icacls` command-line utility to deny access to specific files or folders, specifically through the use of the `*S-1-1-0` (Everyone) identifier. The likely attacker objective is to conceal malicious files by modifying access controls, making it difficult for users and security tools to detect or access the files. This behavior fits within the MITRE ATT&CK framework under the Tactic: Defense Evasion (ID: TA0005), specifically Technique: Hidden Files and Directories (T1564.001).

  The primary telemetry source is Windows process creation logs, including Security Event ID 4688 or Sysmon Event ID 1, which record the execution of processes on Windows systems. If deployed maliciously, this behavior could allow an attacker to manipulate visibility to exploit sensitive data or install persistent malware without detection. It is important to note that detection of this command's execution does NOT confirm that an actual malicious file or activity is present; it merely indicates a change in file access permissions.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where `icacls.exe` is called. Validate if the command includes `/deny *S-1-1-0:`.

  - **Assess command-line arguments:** Inspect the entire command line for context. A legitimate use of `icacls` might include access adjustments for administrative tasks that do not involve `/deny *S-1-1-0:`.

  - **Identify high-confidence malicious indicators:** Look for instances where `icacls` is executed in directories commonly targeted by malware, such as `C:\Users\admin\AppData\Local`. Any usage involving denial of access to the Everyone group is suspicious.

  - **Check for subsequent file access:** Validate that the target file and its parent directory still exist and check their permissions using `Get-Acl` in PowerShell. This can reveal whether permissions were modified and if they are consistent with malicious activities.

  - **Correlate with other security events:** Investigate if there have been any related alerts such as unusual file modifications (e.g., through Windows Event ID 4663 or Sysmon Event ID 11), indicating potential file manipulation efforts.

  ### Prioritization

  This alert should be treated as medium severity in an enterprise context due to the potential impact on system integrity and the likelihood of being used in a malicious context. While not all instances are harmful, the ability to hide files can be a precursor to exploitation, making it crucial for a timely investigation.

  ### Blind Spots and Assumptions

  The detection may have limitations if logging is not properly configured, especially if verbose command-line logging is not enabled. Legitimate administrative uses of `icacls` can trigger this alert, particularly in scenarios where access permissions are regularly adjusted for various administrative tasks. A related detection to enhance coverage could include monitoring for anomalous file creation and modification events in sensitive directories, which may further indicate hidden malicious activity.

