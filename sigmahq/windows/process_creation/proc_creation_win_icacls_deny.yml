note: |
  ### Technical Context
  This detection rule identifies the use of the Windows command-line utility `icacls` to set permissions that deny access for all users to files within the Users folder, a tactic often utilized by attackers to conceal malicious files from discovery. By modifying access permissions, an adversary can prevent regular users and security tools from viewing or interacting with harmful artifacts, making this a common step in the persistence and evasion phases of an attack.

  The threat scenario typically involves an attacker who has gained a foothold in the network, possibly through methods such as phishing or exploiting vulnerabilities. Once inside, they may deploy their malware and then obscure it by altering its file permissions, making it difficult for security personnel to detect the threat during regular checks. Attackers leverage this technique to enhance their operational security and maintain persistence undetected.

  Relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Defense Evasion** (TA0005) and **Modify Permissions** (T1564.001). Primary data sources for detecting this behavior include process creation logs from Windows systems, which capture the invocation of the `icacls` command and its related parameters.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `icacls.exe` being executed, focusing on events where the command line includes the `/deny` flag and the SID for "Everyone" (`*S-1-1-0:`).

  - **Correlate with File Access Events:** Check the corresponding file access events to determine if any files in the Users folder have restricted permissions set, which could indicate tampering.

  - **Investigate User Activity:** Look into the user accounts executing the `icacls` command; ensure they have an appropriate business need for modifying file permissions. Analyze whether this behavior aligns with their typical usage patterns.

  - **Cross-check with Security Tools:** Utilize EDR or other endpoint detection tools to identify any suspicious changes or anomalies in the affected file system area, as well as running processes associated with the user at the time of the command execution.

  ### Prioritization
  Alerts generated by this rule should be treated with medium priority in an enterprise environment, as unauthorized modification of file permissions can indicate active attempts to conceal malware or other malicious activities. The threat impact is significant, especially in environments where data confidentiality and integrity are paramount.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if process creation logging is disabled or if the system is configured not to log certain types of command executions. The detection logic assumes that the `icacls` command will be issued in its typical form and that the targeted files are within the Users folder. Additionally, proper logging and monitoring configurations for process creation events are necessary for this rule to function effectively.

