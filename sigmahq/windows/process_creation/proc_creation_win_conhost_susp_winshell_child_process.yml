detection:
  selection_parent:
    ParentImage|endswith: '\conhost.exe'
  selection_child:
  - Image|endswith:
    - '\cmd.exe'                       # Windows Command Prompt
    - '\cscript.exe'                   # Windows Script Host (used for scripting exploits)
    - '\mshta.exe'                     # MSHTA (HTML Application Host, often abused)
    - '\powershell_ise.exe'            # PowerShell ISE
    - '\powershell.exe'                # Windows PowerShell
    - '\pwsh.exe'                      # PowerShell Core
    - '\regsvr32.exe'                  # Windows Registry Server (commonly used for exploits)
    - '\wscript.exe'                   # Windows Script Host (for executing scripts)
  - OriginalFileName:
    - 'cmd.exe'
    - 'cscript.exe'
    - 'mshta.exe'
    - 'powershell_ise.exe'
    - 'powershell.exe'
    - 'pwsh.dll'
    - 'regsvr32.exe'
    - 'wscript.exe'
  condition: all of selection_*
falsepositives:
- Legitimate administrative tasks using `conhost.exe` to spawn child processes 
  such as `cmd.exe`, `powershell.exe`, or `regsvr32.exe`.
level: high
note: |
  ### Technical Context

  This rule detects suspicious child processes spawned by `conhost.exe`, indicating potential misuse of trusted Windows components for executing malicious commands or scripts. Attackers may leverage this behavior to obfuscate their actions, often aiming to execute payloads, maintain persistence, or perform lateral movement. The relevant MITRE ATT&CK technique is T1202 (Command and Scripting Interpreter) and T1218 (Signed Binary Proxy Execution).

  Primary telemetry sources include Process Creation logs (Security Event ID 4688) and Sysmon Event ID 1. If the detected behavior is malicious, it poses a significant security risk by enabling the execution of unauthorized commands or scripts, which can lead to data exfiltration, system compromise, or other malicious outcomes. This detection does NOT confirm the actual execution of malicious activity; it only highlights a suspicious combination of parent and child processes.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 for `conhost.exe` (ParentImage) spawning child processes such as `powershell.exe` or `cmd.exe`. Look for logged command lines (CommandLine field) that appear encoded, obfuscated, or excessively lengthy, which may indicate malicious intent.

  - **Identify legitimate usage patterns:** Confirm normal use cases for `conhost.exe`, such as administrative scripts or scheduled tasks, that invoke `cmd.exe` or `powershell.exe` without extensive command-line arguments. Log sources like Task Scheduler or Windows Event Logs might also provide context about scheduled executions.

  - **Check for known malicious indicators:** Look for specific child process images associated with known threats, like `mshta.exe` or `regsvr32.exe`. Validate their Origin/Path against threat intelligence to determine if they are recognized as malicious, focusing on unusual locations outside typical system paths.

  - **Evaluate command lines for suspicious parameters:** Analyze the CommandLine field of relevant events to identify unusual flags or script URLs, such as `http://` or `https://`. Malicious command executions often contain such indicators as part of their arguments.

  - **Assess host role and activity context:** Determine the role of the affected host (e.g., workstation, server, domain controller) to understand the impact of suspicious activity. For instance, if a domain controller is executing commands via `powershell.exe`, this activity warrants immediate escalation.

  - **Search for signs of lateral movement or persistence:** Investigate subsequent events following the identified process creations for further indicators, like unusual service installations or registry modifications. Sysmon Event ID 10 (Process Access) can reveal additional interactions with the detected processes.

  ### Prioritization

  This alert should be considered high severity due to the sensitive nature of processes involved and their potential for enabling further malicious actions. The operational impact can be significant, especially if successful execution leads to command execution or the deployment of additional payloads. Furthermore, the misuse of legitimate system binaries is common in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion tactics, such as attackers using alternative, less suspicious parent processes for execution or digitally signed binary spoofing. Accurate log configuration is required to capture all relevant process creation events effectively. Legitimate administrative tasks could inadvertently trigger this rule, especially automated scripts running via `powershell.exe`. A companion detection rule that focuses on unexpected command line arguments for PowerShell (T1059.001) could enhance overall detection efficacy.

