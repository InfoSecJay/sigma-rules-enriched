note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving the Windows Console Host (`conhost.exe`) that spawns child processes associated with common Windows utilities. Attackers may exploit trusted system components to avoid detection and execute malicious commands or scripts. By monitoring the processes that parent from `conhost.exe`, security teams can gain insights into potential abuse of these utilities for activities such as data exfiltration, system compromise, or lateral movement within the network.

  The threat scenario may involve an attacker utilizing tools like PowerShell or Windows Script Host to execute commands or scripts intended for malicious purposes, often leveraging legitimate system behavior to evade security mechanisms. Employees or attackers executing commands through a console host that lead to unauthorized activities could indicate a breach or malicious intent.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002): Techniques for running malicious code, specifically through trusted utilities.
  - **Defense Evasion** (TA0005): Employing common system binaries to obfuscate malicious actions and evade detection.
  - **Command and Scripting Interpreter** (T1059): Utilizing command-line interfaces to execute commands.

  Primary data sources that can provide insight into this activity include process creation events, which log the initiation of processes along with their parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for `conhost.exe` activity, focusing on sibling processes spawned from it, especially those that should not typically be executed concurrently.
  - **Inspect Command History**: Check command history logs from `cmd.exe` or `powershell.exe` for unusual commands that could indicate adversary activity or exploitation attempts.
  - **Correlate with Other Security Tools**: Use EDR, SIEM, or log management tools to correlate events around the time of suspicious `conhost.exe` activity for broader threat context, such as network connections or authentication events.
  - **Validate Against Trusted Usage**: Assess whether flagged process executions are part of legitimate administrative tasks, ensuring to distinguish between normal and suspicious behavior.

  ### Prioritization
  Due to the high impact and probability of successful exploitation when trusted processes like `conhost.exe` are misused, this alert is categorized as high severity. Such activities can compromise sensitive data integrity or lead to further intrusions within an organization’s network.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by legitimate administrative activities that use `conhost.exe` to spawn common utilities like `powershell.exe` or `cmd.exe`, potentially generating false positives. The detection logic assumes that these operations occur in a malicious context and may not fully account for benign administrative tasks. Required logs include comprehensive process creation logs with detailed parent-child relationships, which must be configured properly to ensure accurate detection.

