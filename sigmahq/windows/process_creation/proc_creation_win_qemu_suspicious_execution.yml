title: Potentially Suspicious Usage Of Qemu
id: 5fc297ae-25b6-488a-8f25-cc12ac29b744
status: test
description: |
  Detects potentially suspicious execution of the Qemu utility in a Windows environment.
  Threat actors have leveraged this utility and this technique for achieving network access as reported by Kaspersky.
references:
- https://securelist.com/network-tunneling-with-qemu/111803/
- https://www.qemu.org/docs/master/system/invocation.html#hxtool-5
author: Muhammad Faisal (@faisalusuf), Hunter Juhan (@threatHNTR)
date: 2024-06-03
tags:
- attack.command-and-control
- attack.t1090
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '-m 1M'         # VM with just 1MB of ram is insufficient this is a suspicious flag
    - '-m 2M'
    - '-m 3M'
    CommandLine|contains|all:
    - 'restrict=off'
    - '-netdev '
    - 'connect='
    - '-nographic'         # This is also a key detection no one invoke without UI from console usually its a flag.
  filter_main_normal_usecase:
    CommandLine|contains:
    - ' -cdrom '         # Normal usage cases
    - ' type=virt '
    - ' -blockdev '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious usage of the Qemu utility within a Windows environment. Qemu, a popular open-source machine emulator and virtualizer, can be misused by threat actors to establish network tunnels and evade detection, as noted in recent reports. Attackers leveraging Qemu may aim to create virtual machines (VMs) with minimal resources to circumvent security measures or to run covert operations on compromised hosts.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Command and Control** (T1090) and **Application Layer Protocol** (T1572), as both techniques can involve manipulating legitimate tools to achieve unauthenticated network access. By analyzing how Qemu is executed—specifically flags that are used unusually or a command-line structure that deviates from normal operations—analysts can uncover potentially malicious activities involving network tunneling.

  Primary data sources for this detection include **process creation events** that capture command-line arguments used when Qemu is executed. Monitoring these logs provides insight into how the utility is being deployed, highlighting any patterns that deviate from standard usage.

  ### Investigation Steps
  - **Review Qemu Execution Logs:** Examine process creation logs for instances of Qemu with suspicious command-line arguments such as `-m 1M`, `restrict=off`, `-nographic`, or `-netdev connect=`. Any match suggests investigation into the user's intent and behavior.
  - **Correlate with User Activity:** Analyze user behavior around the time of the suspicious Qemu execution. Look for abnormal login times, privilege escalations, or recent activities that could indicate illicit access.
  - **Cross-check with Network Traffic:** Inspect network logs for outbound connections or unusual patterns that coincide with Qemu execution. Specifically, look for evidence of network tunneling or remote connections being established using the utility.
  - **Evaluate Environment for Legitimate Use Cases:** Identify and document any legitimate use cases within your environment where Qemu is used. Understanding normal operational patterns can help differentiate between benign and potentially malicious activity.

  ### Prioritization
  The alert is categorized with **medium severity** due to its potential to indicate malicious behavior that could lead to unauthorized network access. Given the nature of the tactic, quick action may be necessary to prevent data exfiltration or further exploitation within the environment.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the use of Qemu in conjunction with other obfuscation or legitimate virtualization techniques that may not be captured by process creation logs alone. The detection logic assumes that Qemu will be executed with atypical parameters, however, skilled adversaries may alter arguments to mimic normal usage patterns. Additionally, without comprehensive logging configurations or monitoring tailored for your environment, the effectiveness of this detection may be limited.

