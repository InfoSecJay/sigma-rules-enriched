title: Potentially Suspicious Usage Of Qemu
id: 5fc297ae-25b6-488a-8f25-cc12ac29b744
status: test
description: |
  Detects potentially suspicious execution of the Qemu utility in a Windows environment.
  Threat actors have leveraged this utility and this technique for achieving network access as reported by Kaspersky.
references:
- https://securelist.com/network-tunneling-with-qemu/111803/
- https://www.qemu.org/docs/master/system/invocation.html#hxtool-5
author: Muhammad Faisal (@faisalusuf), Hunter Juhan (@threatHNTR)
date: 2024-06-03
tags:
- attack.command-and-control
- attack.t1090
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - '-m 1M'         # VM with just 1MB of ram is insufficient this is a suspicious flag
    - '-m 2M'
    - '-m 3M'
    CommandLine|contains|all:
    - 'restrict=off'
    - '-netdev '
    - 'connect='
    - '-nographic'         # This is also a key detection no one invoke without UI from console usually its a flag.
  filter_main_normal_usecase:
    CommandLine|contains:
    - ' -cdrom '         # Normal usage cases
    - ' type=virt '
    - ' -blockdev '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious executions of the Qemu virtualization utility in Windows environments. The execution of Qemu with specific command-line parameters, particularly with minimal RAM configurations and networking flags, may indicate an adversary attempting to set up covert network access or command-and-control capabilities. The corresponding MITRE ATT&CK tactic is "Command and Control" (TA0011), with techniques T1090 (Application Layer Protocol) and T1572 (Protocol Tunneling).

  The primary telemetry source is Windows process creation logs, specifically focusing on Command Line parameters through Security Event ID 4688. If this behavior is malicious, it could allow an attacker to bypass security controls, maintaining persistence and covert communication. However, this detection does NOT confirm malicious intent on its own, as Qemu can also be used legitimately for development or testing within virtual environments.

  ### Investigation Steps

  - **Check the Command Line Arguments:**
    - Analyze the process creation events (Security Event ID 4688) for Qemu's command line arguments. Look for unexpected flags such as `-m 1M`, `-m 2M`, and `-nographic`, which may indicate suspicious usage.

  - **Review for Normal Usage Cases:**
    - Validate command lines containing expected safe parameters such as `-cdrom`, `type=virt`, or `-blockdev`. Evidence of these parameters can signify legitimate Qemu use rather than an attack.

  - **Observe Parent Process:**
    - Investigate the parent process of the Qemu execution for any unusual origins, especially processes initiated by non-administrative users or common scripts. This can help identify whether this execution is part of a larger suspicious chain.

  - **Collect Network Telemetry:**
    - If applicable, review network logs (e.g., firewall logs or DNS queries) for unusual outbound connections made from the host running Qemu. Successful attempts to connect to unfamiliar addresses can strengthen suspicion.

  - **Examine System Resources:**
    - Check for unexpected resource consumption from the process. Anomalies such as high CPU or network activity from Qemu without related benign activities could indicate misuse.

  ### Prioritization

  The severity of this alert is medium due to its association with potential command-and-control activities, which could compromise the security of sensitive systems. The likelihood of malicious abuse is moderate, as while Qemu can be used legitimately, its misuse for tunneling is documented and targeted by threat actors.

  ### Blind Spots and Assumptions

  This detection may be limited if Qemu is executed without indicative flags or if it uses command-line arguments that are not covered by the rule, leading to potential evasion. Reliable detection relies on logging configurations that encompass process creation events, specifically capturing command-line arguments. Legitimate activities, such as testing or development by IT staff, may also trigger this alert. A companion detection to strengthen coverage could involve monitoring network traffic for protocol tunneling under T1090 to confirm attempted evasion measures.

