note: |
  ### Technical Context

  This Sigma rule detects the execution of AdFind, a command-line tool frequently used for Active Directory enumeration, particularly with suspicious flags that indicate possible reconnaissance activity by adversaries. The likely attacker objective is to collect sensitive information about the environment, including user privileges and domain structures, which can facilitate further attacks. This behavior aligns with the MITRE ATT&CK tactic of Discovery (TA0007) and technique T1018: Remote System Discovery.

  The primary telemetry source for this detection is Windows process creation events, specifically Security Event ID 4688. If malicious, this activity could lead to unauthorized access or lateral movement within the network. However, it is important to note that the detection of AdFind execution does NOT confirm that the activity is malicious on its own, as it may be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Review command line arguments:**
    Check the process creation events (Event ID 4688) for AdFind with arguments commonly associated with malicious usage, such as `-sc dclist`, `domainlist`, and `-subnets -f`. Legitimate usage typically includes less ominous flags, focusing on standard administrative tasks.

  - **Inspect user context:**
    Determine the account under which AdFind was executed. Analyze whether it was run by an administrative or service account and if it aligns with expected behavior for legitimate administrative tasks.

  - **Correlate with network activity:**
    Check for associated network telemetry, such as unusual outbound connections to external IPs following the AdFind execution. This may indicate that collected data is being exfiltrated.

  - **Evaluate historical usage:**
    Analyze historical logs to identify previous legitimate uses of AdFind on the system. Frequent usage by non-administrative accounts or during off-hours could indicate suspicious activity.

  - **Check for concurrent suspicious processes:**
    Look for other suspicious processes or activities occurring around the same time as the AdFind execution, like PowerShell commands or scripts that may indicate scripted attacks or automated tool usage.

  ### Prioritization

  This alert is high priority due to the potential impact of discovering sensitive information about the Active Directory environment, which can lead to more severe security incidents. The likelihood of malicious intent is significant, given the common weaponization of enumeration tools in initial compromise and lateral movement scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative usage of AdFind by authorized personnel, which may trigger the alert. Ensure that the log collection configuration includes all necessary account activity to accurately correlate legitimate and suspicious events. False positives may arise from legitimate system maintenance or audits. A related detection, such as uncommon PowerShell command execution (T1086), can enhance coverage of nearby suspicious activities.

