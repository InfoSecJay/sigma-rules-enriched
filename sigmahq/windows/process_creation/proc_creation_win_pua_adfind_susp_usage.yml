note: |
  ### Technical Context
  This rule detects the execution of **AdFind**, a tool commonly used for enumerating Active Directory environments. AdFind can be employed by attackers to gather information about domain users, groups, and other objects, which is critical for reconnaissance in preparation for further attacks, such as privilege escalation or lateral movement. By identifying commands that invoke certain flags often abused during malicious activities, this rule aims to highlight suspicious execution patterns that might indicate an ongoing attack.

  The primary objective of an attacker utilizing AdFind is to gather intelligence about the Active Directory structure and its objects, often targeting domain admin groups or any misconfigurations that could facilitate future exploitation. This behavior aligns with various MITRE ATT&CK techniques, particularly **Discovery (T1018: Remote System Discovery)** and **Active Directory Enumeration (T1087.002)**, which fall under the tactics of gathering information to facilitate further exploitation.

  The best sources of telemetry for this detection include process creation events from Windows systems, as they can capture the command-line arguments used when AdFind is executed, enabling analysts to recognize patterns indicative of malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation logs for instances of AdFind execution, specifically focusing on those with suspicious command line arguments usually associated with reconnaissance.

  - **Correlate with User Behavior:** Determine the context in which AdFind was run by correlating process logs with user account activities. Investigate if the user is a legitimate administrator or if the execution seems anomalous for the identified user.

  - **Check LDAP Query Logs:** Analyze any lookup or search patterns against Active Directory that correspond with the specific command-line parameters used with AdFind to uncover any additional reconnaissance activity.

  - **Investigate Network Traffic:** If applicable, monitor for any outbound queries or unusual connections to domain controllers that coincide with the timing of AdFind execution, as this may provide further insights on the attack vector used.

  ### Prioritization
  Given the high risk associated with unauthorized reconnaissance of Active Directory environments, this alert should be treated with high priority. Unauthorized access or intelligence gathering can lead to severe impacts, including data breaches or loss of sensitive information due to subsequent malicious activities.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate administrative usage of AdFind, as real admin activity can often mimic malicious behavior due to the nature of the tool. The detection logic assumes that all instances of AdFind with the specified arguments are potentially malicious, which may not hold true in every instance of usage. It is crucial to ensure comprehensive logging and configuration of process creation details on all Windows systems to facilitate the success of this alert.

