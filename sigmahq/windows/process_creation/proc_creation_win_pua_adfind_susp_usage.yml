note: |
  ---

  ### Technical Context

  This rule detects the execution of the AdFind tool with specific command-line arguments commonly associated with reconnaissance activities in Active Directory environments. The likely objective of an attacker utilizing AdFind is to gather information about users, groups, and organizational units for further exploitation such as privilege escalation or lateral movement. Relevant MITRE ATT&CK tactics include Discovery (T1087.002) and Active Directory Enumeration (T1018). Primary telemetry sources include Windows process creation logs, specifically looking at Security Event ID 4688 and Sysmon Event ID 1 for details on command-line execution. If malicious, such behavior could lead to an unauthorized access breach or lateral movement within the network. Importantly, this detection alone does not confirm malicious activity, as legitimate administrative tasks may use AdFind.

  ---

  ### Investigation Steps

  - **Review process creation logs for suspicious command-line arguments:** Inspect Windows Security Event ID 4688 or Sysmon Event ID 1 for processes containing command-line flags such as 'domainlist', 'trustdmp', or 'adinfo'. Presence of these flags indicates potential malicious use.

  - **Identify the user context of the AdFind execution:** Check the user account that executed the command; legitimate administrative accounts may generate benign usage, while unexpected accounts raising these flags should be scrutinized.

  - **Validate legitimate use cases:** Determine if AdFind execution is a scheduled or established key task for admins by cross-referencing with other telemetry or documented administrative activities. Look for regular patterns (e.g., timing, command parameters) in command-line inputs compared to the current alert.

  - **Correlate with network activity:** Review network logs for any outgoing connections or unusual communication patterns that may align with the timing of the AdFind execution. Check for network connections involving sensitive systems post-execution.

  - **Look for subsequent lateral movement tactics:** Monitor for related activity using tools or commands that suggest the attacker may be leveraging the information gathered (e.g., abnormal remote access tools or exploitation behaviors following the AdFind command).

  - **Assess the environment's criticality:** If AdFind was run on domain controllers or other critical systems, escalate the investigation due to the potential risk of domain compromise.

  ---

  ### Prioritization

  This alert should be prioritized as high. If the affected system is a domain controller or other critical infrastructure, the potential impact of the attack is significant. The likelihood of malicious abuse is high, particularly as AdFind is often weaponized for reconnaissance by adversaries during phishing or initial access phases.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative activities that utilize AdFind, which could lead to false positives. Required log sources must include detailed process creation logs (Security Event ID 4688, Sysmon Event ID 1) for reliable detection. Other security measures like GPOs or scripts could trigger this alert benignly. A related detection for successful logon events (Event ID 4624) can provide additional validation context for user behavior linking to this activity.

