title: Renamed ProcDump Execution
id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
related:
- id: 03795938-1387-481b-9f4c-3f6241e604fe
  type: obsolete
status: test
description: |
  Detects the execution of a renamed ProcDump executable.
  This often done by attackers or malware in order to evade defensive mechanisms.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2019-11-18
modified: 2026-06-29
tags:
- attack.stealth
- attack.t1036.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_ofn:
    OriginalFileName: 'procdump'
  selection_cli_dump_flag:
    CommandLine|contains|windash:
    - ' -ma '         # Full Dump
    - ' -mp '         # Mini Plus
  selection_cli_eula_flag:
        # Note: Even though the "accepteula" flag isn't required. We add it to avoid collision with similar utilities.
    CommandLine|contains|windash: ' /accepteula'
  filter_main_known_names:
    Image|endswith:
    - '\procdump.exe'
    - '\procdump64.exe'
    - '\procdump64a.exe'
  condition: (selection_ofn or all of selection_cli_*) and not 1 of 
    filter_main_*
falsepositives:
- Procdump illegally bundled with legitimate software.
- Administrators who rename binaries (should be investigated).
level: high
note: |
  ### Technical Context

  This rule detects the execution of a renamed ProcDump executable, a common utility used for memory dumps that can easily be abused by attackers for malware analysis and exfiltration. The likely attacker objective is to capture sensitive information from memory without being immediately detected by security solutions. This behavior fits within the MITRE ATT&CK framework under the tactic "Defense Evasion" and technique "Rename System Utilities" (T1036.003).

  Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) and Sysmon Event ID 1, which provide insight into the creation of processes. If malicious, the use of renamed ProcDump can lead to further compromise or data exfiltration. Importantly, this detection does NOT confirm that the activity is malicious without additional context, as legitimate use cases may exist.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for process creation events associated with "procdump.exe" variants. Look for deviations in typical usage patterns, such as an unknown path or unusually named file versions.

  - **Analyze command-line parameters**: Inspect the command line of the process for flags like “-ma” (full dump) or “-mp” (mini plus). An unusual combination of these parameters alongside renamed executables can indicate potential misuse.

  - **Identify legitimate usage patterns**: Confirm that known internal processes utilizing ProcDump exhibit typical naming conventions and paths. Legitimate administrative activities usually do not involve renamed versions of system utilities.

  - **Assess historical usage on the host**: Look for previous executions of ProcDump on the same host by querying Sysmon or Event Viewer for Event ID 1 or 4688 related to "procdump". Consistent behavior could indicate a benign operational need.

  - **Correlate with threat intelligence**: Look for indicators of compromise (IOCs) and cross-reference the usage of renamed ProcDump against threat intelligence databases for links to known attack patterns or affiliated threat actors.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and the likelihood that it is used for malicious purposes. As attackers frequently utilize renaming as an evasion technique, any alert from this rule warrants prompt investigation, particularly on critical infrastructure or sensitive environments.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses, such as administrative tools that bundle ProcDump. Additional log sources, such as WMI or PowerShell logs, may enhance coverage but are not strictly required. There may be cases where legitimate applications rename ProcDump for internal use, which could trigger false positives. A companion detection to consider is monitoring for anomalous command-line arguments used in conjunction with other known system utilities, which may indicate a broader attack methodology.

