title: Renamed ProcDump Execution
id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
related:
- id: 03795938-1387-481b-9f4c-3f6241e604fe
  type: obsolete
status: test
description: |
  Detects the execution of a renamed ProcDump executable.
  This often done by attackers or malware in order to evade defensive mechanisms.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2019-11-18
modified: 2024-06-25
tags:
- attack.stealth
- attack.t1036.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_ofn:
    OriginalFileName: 'procdump'
  selection_cli_dump_flag:
    CommandLine|contains|windash:
    - ' -ma '         # Full Dump
    - ' -mp '         # Mini Plus
  selection_cli_eula_flag:
        # Note: Even though the "accepteula" flag isn't required. We add it to avoid collision with similar utilities.
    CommandLine|contains|windash: ' /accepteula'
  filter_main_known_names:
    Image|endswith:
    - '\procdump.exe'
    - '\procdump64.exe'
  condition: (selection_ofn or all of selection_cli_*) and not 1 of 
    filter_main_*
falsepositives:
- Procdump illegally bundled with legitimate software.
- Administrators who rename binaries (should be investigated).
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed ProcDump executable, a commonly used tool for creating memory dumps. Attackers may rename ProcDump to evade detection by security solutions, leveraging it to collect sensitive data from a target system. The likely objective for attackers is to perform memory analysis or exfiltrate sensitive information without raising alarms.

  Relevant MITRE ATT&CK Tactics and Techniques include:
  - Tactic: Defense Evasion (TA0005)
  - Technique: Masquerading (T1036.003).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688, which provides details of process creation events. If malicious, this behavior indicates unauthorized data extraction or system compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could trigger similar alerts.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 for events where `NewProcessName` contains renamed instances of ProcDump (e.g., `C:\path\to\renamed_procdump.exe`). Look for unusual parent processes indicative of suspicious activity.

  - **Examine command line arguments**: Validate the `CommandLine` field in Event ID 4688 for suspicious arguments. Specific flags such as `-ma` (full dump) or `-mp` (mini plus) indicate potential malicious intent.

  - **Identify legitimate use cases**: Confirm if the system hosts any known and approved software that utilizes ProcDump under its legitimate name. If found, this context can indicate permissible usage and reduces suspicion.

  - **Check for indicators of compromise**: Investigate for high-confidence malicious indicators such as anomalous file paths or process hierarchies, focusing particularly on parent processes like `powershell.exe` or `cmd.exe` that may invoke the renamed executable.

  - **Consult EDR telemetry**: If your environment includes endpoint detection and response (EDR) tools, cross-correlate the execution with any alerts from those tools. Note if there are indicators of data exfiltration attempts or any triggered file creation.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive data. The likelihood of malicious abuse is elevated because renamed ProcDump is an established method used by attackers to gather information stealthily. The behavior is weaponized in various threat campaigns, particularly in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection is limited as attackers may use obfuscation techniques, such as further renaming or repackaging tools. Reliable detection requires that process creation logs are enabled and monitored, ensuring no gaps in telemetry. Legitimate activities, such as IT administrative tasks involving software development or diagnostics, could inadvertently trigger this alert. A related detection to consider is monitoring for the execution of other well-known utilities commonly abused by attackers, such as `Mimikatz` (T1003), further strengthening overall defense coverage.

