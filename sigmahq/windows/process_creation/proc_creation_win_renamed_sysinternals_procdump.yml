description: |
  Detects the execution of a renamed ProcDump executable.
  This often done by attackers or malware in order to evade defensive mechanisms.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2019-11-18
modified: 2024-06-25
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_ofn:
    OriginalFileName: 'procdump'
  selection_cli_dump_flag:
    CommandLine|contains|windash:
    - ' -ma '         # Full Dump
    - ' -mp '         # Mini Plus
  selection_cli_eula_flag:
        # Note: Even though the "accepteula" flag isn't required. We add it to avoid collision with similar utilities.
    CommandLine|contains|windash: ' /accepteula'
  filter_main_known_names:
    Image|endswith:
    - '\procdump.exe'
    - '\procdump64.exe'
  condition: (selection_ofn or all of selection_cli_*) and not 1 of 
    filter_main_*
falsepositives:
- Procdump illegally bundled with legitimate software.
- Administrators who rename binaries (should be investigated).
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed ProcDump executable, often utilized by attackers to evade detection mechanisms. By renaming this common utility, adversaries can create deceptive processes that facilitate command and control or data exfiltration efforts. The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1562), specifically the technique **Impair Defenses: Rename Tools** (T1036.003).

  Primary telemetry sources for this detection include Windows process creation logs, specifically monitoring Process Creation Event ID 4688. If malicious, the security impact is significant, as ProcDump can capture memory dumps which may contain sensitive data or code. Importantly, detection of this behavior does not confirm malicious intent on its own, as legitimate uses do exist.

  ### Investigation Steps

  - **Check process creation logs for related events:** Review Windows Security Event ID 4688 for entries with Image names that do not match original ProcDump file paths and verify the CommandLine for flags like `-ma` (full dump) or `-mp` (mini plus).

  - **Evaluate the legitimacy of the invoking user:** Identify the user account that executed the renamed ProcDump. Look for anomalies, such as execution by service accounts or unknown users.

  - **Compare against expected behavior:** Determine if ProcDump has been legitimately renamed as part of a software installation or system administration task and confirm this with Change Management records.

  - **Identify high-confidence malicious indicators:** Look for command line arguments that are commonly associated with abuse, such as `-ma` or `-mp`, when used in unusual contexts (e.g., non-IT personnel or during non-business hours).

  - **Review the environment for supported applications:** Validate whether other instances of ProcDump or similar tools are present on the host to assess if this execution was part of a broader set of actions by an unauthorized user.

  - **Monitor for signs of data exfiltration:** If applicable, check for file creation events (e.g., Event ID 4663) related to the dumps created by ProcDump, indicating potential data leaks.

  ### Prioritization

  This alert warrants a high priority response due to its potential implications for system integrity and data security. The ability of attackers to leverage a legitimate tool like ProcDump can indicate advanced evasion tactics aiming to bypass security controls, making this behavior a significant security concern.

  ### Blind Spots and Assumptions

  This detection may miss renamed legitimate tools or custom scripts that perform similar memory capture functions, posing evasion risks to detection mechanisms. Ensure that logging configurations capture complete process command lines and file paths to enhance detection reliability. Additionally, legitimate administrative actions, such as tool renaming or software bundling scenarios, may trigger this alert. Companion detections focusing on unusual process parent-child relationships could improve overall analysis and coverage.

