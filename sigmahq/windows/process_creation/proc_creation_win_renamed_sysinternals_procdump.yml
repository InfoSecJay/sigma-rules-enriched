title: Renamed ProcDump Execution
id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
related:
- id: 03795938-1387-481b-9f4c-3f6241e604fe
  type: obsolete
status: test
description: |
  Detects the execution of a renamed ProcDump executable.
  This often done by attackers or malware in order to evade defensive mechanisms.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2019-11-18
modified: 2024-06-25
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_ofn:
    OriginalFileName: 'procdump'
  selection_cli_dump_flag:
    CommandLine|contains|windash:
    - ' -ma '         # Full Dump
    - ' -mp '         # Mini Plus
  selection_cli_eula_flag:
        # Note: Even though the "accepteula" flag isn't required. We add it to avoid collision with similar utilities.
    CommandLine|contains|windash: ' /accepteula'
  filter_main_known_names:
    Image|endswith:
    - '\procdump.exe'
    - '\procdump64.exe'
  condition: (selection_ofn or all of selection_cli_*) and not 1 of filter_main_*
falsepositives:
- Procdump illegally bundled with legitimate software.
- Administrators who rename binaries (should be investigated).
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of a renamed ProcDump executable, a widely-used tool that can capture process memory dumps. Attackers may use renamed versions to bypass security controls and perform malicious actions such as extracting sensitive data from memory. The relevant MITRE ATT&CK tactics are **Defense Evasion** (TA0005) and the technique **Obfuscated Files or Information** (T1036.003). Primary telemetry sources include Windows process creation logs (Security Event ID 4688, Sysmon Event ID 1) focused on the original file name, executable name, and command-line arguments. If malicious, this behavior could lead to significant data breaches or lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own; further investigation is required to establish context.

  ---

  ### Investigation Steps

  - **Check process creation events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for the process creation details. Look for processes that executed from non-standard paths or with unusual names that include ‘procdump’ to determine if they were renamed.

  - **Analyze command-line arguments:** Investigate command-line arguments associated with the executable. Any use of `-ma` (full dump) or `-mp` (mini plus) flags in the command line when related to a renamed ProcDump is a strong indicator of potential malicious behavior.

  - **Review context for rename actions:** Assess the asset history for instances of legitimate software bundles known to include ProcDump. If recent changes to software installations align with the timeline of the alert, consider it benign.

  - **Correlate with antivirus logs:** Search antivirus logs or endpoint detection systems for any additional alerts related to the visible behaviors of ProcDump usage (e.g., attempts to access sensitive files) to gain a broader understanding of the potential threat.

  - **Look for known benign renaming patterns:** Search for any documented renaming practices by IT administration or trusted software deployments that might explain the behavior. Typically, legitimate admins may retain original executable paths or include proper documentation when renaming executable files.

  - **Identify high-confidence malicious indicators:** Check for associated network activity by cross-referencing with firewall logs or network flow data. Identify any outbound connections post-ProcDump execution indicative of potential data exfiltration.

  ---

  ### Prioritization

  Given that this alert pertains to the execution of a tool often associated with lateral movement and data exfiltration, the severity is high. The probability that named executables are malicious is significant, as this accounts for a common tactic used by adversaries to evade detection. Understanding the asset's role is critical, particularly if sensitive information is being managed on that host.

  ---

  ### Blind Spots and Assumptions

  This detection relies on the accurate logging of process creation events; missing or misconfigured logs can lead to missed alerts. Legitimate activities such as admin tasks or software updates may trigger the rule and should be noted when assessing context. It's also important to be aware that attackers may employ variations of ProcDump or alter command-line parameters to obscure their intentions. Companion detections like monitoring for abnormal outbound connections or leveraging other stateful behaviors can enhance overall coverage against potential data exfiltration.

