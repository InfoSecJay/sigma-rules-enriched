note: |
  ### Technical Context

  This Sigma rule detects the execution of Microsoft HTML Help (HH.exe) in suspicious contexts, specifically targeting instances where the command line or file paths indicate potential misuse for exploitation. The likely objective of the attacker includes delivering malware or conducting reconnaissance activities as HH.exe can be used maliciously to execute scripts or deliver payloads through compiled HTML files. This behavior aligns with MITRE ATT&CK techniques such as Execution (T1203) and Scripting (T1064). The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1.

  If identified as malicious, such behavior could result in unauthorized access, data exfiltration, or system compromise. However, the execution of HH.exe does not confirm malicious activity on its own, as it can also be used legitimately for its intended purpose.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for entries associated with HH.exe, focusing on command line arguments for suspicious indicators (e.g., ".application", temp file paths).

  - **Normalize command line arguments**: Identify the full command line associated with HH.exe execution. Legitimate uses typically do not contain unusual path patterns or parameters utilizing public folders or temporary directories.

  - **Correlate with previous alerts**: Examine if the executing user has a history of executing HH.exe or other potentially malicious software. Review user behavior for anomalies.

  - **Identify network activity**: Look for outbound network connections initiated by the process (e.g., using Windows Firewall logs - Event ID 5156) to external hosts post-execution. Unusual or unauthorized connections may indicate malicious behavior.

  - **Assess file creation events**: Validate whether HH.exe execution resulted in the creation of files in non-standard directories (e.g., Downloads, Temp) leveraging Windows File Audit logs (e.g., Event ID 4663) for high-confidence malicious indicators.

  - **Document legitimate execution context**: If the process is linked to known applications or users performing legitimate tasks, such as opening help documentation for software installations, document this context to distinguish from suspicious behavior.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems and data, particularly if HH.exe is leveraged to execute malicious content. The likelihood of exploitation is significant given that adversaries have historically weaponized this executable, particularly in phishing and initial access scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as renaming HH.exe or executing it from benign paths. Required log sources must include complete process creation logging as configured in Windows Event Logs and Sysmon to ensure comprehensive visibility. Legitimate software installations or updates may trigger this alert, necessitating thorough context analysis. Related detections to consider include alerts for anomalous access to compilation files (e.g., CHM files) which can reinforce assessment accuracy.

