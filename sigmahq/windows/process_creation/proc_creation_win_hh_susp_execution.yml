note: |
  ### Technical Context

  This Sigma rule detects suspicious executions of the Microsoft HTML Help executable (HH.exe) when invoked with specific command-line parameters or from potentially unintended locations, such as temporary directories or user-accessible folders. The likely attacker objective for executing HH.exe in this manner is to deliver malicious content, such as payloads or phishing attempts, leveraging the legitimate functionality of HTA and CHM files, thereby evading typical security controls.

  Relevant MITRE ATT&CK tactics include Execution (T1203) and Defense Evasion (T1218). The primary telemetry sources for this detection are Windows process creation logs, which include Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity could indicate an attempt to execute payloads designed to establish backdoor access or facilitate data theft. Importantly, this detection alone does NOT confirm that a compromise has occurred; further investigation is needed to assess intent and impact.

  ### Investigation Steps

  - **Check process creation logs:** Query Security Event ID 4688 or Sysmon Event ID 1 to identify recent executions of HH.exe, focusing on the command line. Look for unusual parameters associated with potential exploitation, such as paths that include Temp or Downloads.

  - **Review command line arguments:** Identify any suspicious command-line arguments associated with HH.exe executions. Legitimate command lines typically do not include references to temporary files or scripts designed to execute other files.

  - **Validate source paths:** Examine the file execution paths to see if HH.exe is originating from unconventional directories (e.g., `%TEMP%`, `%APPDATA%\Local\Temp\`, `%USERPROFILE%\Downloads\`). Legitimate executions are often from system directories.

  - **Investigate related file activity:** Look for file creation or modification events (e.g., Security Event ID 4663) in proximity to the HH.exe execution. Check for the creation of temporary files or files with potentially malicious extensions (e.g., .scr, .hta).

  - **Identify indicators of compromise:** Analyze the presence of payloads or other binaries downloaded alongside HH.exe. Specific known malicious indicators include unusual executable files in the same directory as the HH execution.

  - **Correlate with user activity:** Review the user's history and behavior leading to the HH.exe execution. Check recent downloads or email activity that could explain a legitimate use case versus potential phishing or malicious activities.

  ### Prioritization

  This alert is of high severity because it can indicate an attempt to execute malicious code on potentially critical systems, especially if targeting endpoints involved in sensitive operations. The likelihood of abuse is high due to the common use of HH.exe in exploitation scenarios. The association with known malware delivery techniques underlines its potential risk.

  ### Blind Spots and Assumptions

  Detection may be limited by users legitimately employing HH.exe for benign purposes, such as opening help files. Evasion techniques could include renaming the executable or altering common execution techniques to bypass detection. Reliable detection requires comprehensive logging of process creation events and command-line arguments. Companion detections could include alerts for the use of .application files, which often accompany malicious HH.exe execution attempts.

