note: |
  ### Technical Context
  This rule is designed to detect the execution of Microsoft HTML Help (HH.exe) in suspicious contexts, specifically targeting potential abuse of this utility for malicious purposes by threat actors. HH.exe is typically used for displaying help files but can be exploited to deliver malware, including banking trojans, by executing harmful scripts embedded within HTML Help files. Attackers often use HH.exe as part of their initial access tactics to execute payloads or to evade traditional defenses due to its legitimate use in Windows environments.

  The MITRE ATT&CK techniques relevant to this rule include:
  - **Execution (T1059)**, which covers the use of scripting languages and command-line interfaces to execute payloads.
  - **Initial Access (T1566)**, particularly regarding phishing delivery methods that lead to malicious payload execution.
  - **Defense Evasion (T1218)**, where scripts or applications like HH.exe are used to avoid detection from security solutions.

  The primary data source for this detection is **process creation logs** from Windows, which can provide insights into command-line arguments and the context in which HH.exe is executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Start by examining process creation events for instances of HH.exe, focusing on the command-line arguments used. Pay special attention to any unusual paths or parameters indicating potential misuse.
  - **Examine Suspicious File Locations**: Check if the execution path of HH.exe originates from common temporary folders or is included in email attachments, which could indicate phishing activity (e.g., '\AppData\Local\Temp\', '\Content.Outlook\', '\Downloads\').
  - **Analyze Associated Processes**: Investigate processes spawned by HH.exe to identify if any known malware behaviors emerge, such as outbound connections to suspicious IP addresses or the creation of new files.
  - **Cross-Reference with Threat Intelligence**: Leverage threat intelligence to correlate activities involving HH.exe with known campaigns or threat actors, particularly those implicated in using HH.exe for malware delivery.

  ### Prioritization
  This alert is classified as high severity due to the potential for malicious exploitation of HH.exe to deliver payloads for various types of attacks, including financial fraud and data theft. The combination of execution within suspicious contexts and the historical association of HH.exe with malware further heightens its threat potential in an enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic may not capture all instances of HH.exe execution, particularly if the attacker uses different legitimate applications or if the file has been renamed. Additionally, the effectiveness hinges on the availability of process creation logs; environments lacking comprehensive logging may miss these critical events. It's also assumed that there are no proper security measures in place that might block common execution paths leveraged by attackers, which can affect detection capabilities.

