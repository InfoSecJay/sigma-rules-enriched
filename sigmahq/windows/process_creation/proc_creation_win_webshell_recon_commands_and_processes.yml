title: Webshell Detection With Command Line Keywords
id: bed2a484-9348-4143-8a8a-b801c979301c
status: test
description: Detects certain command line parameters often used during reconnaissance
  activity via web shells
references:
- https://www.fireeye.com/blog/threat-research/2013/08/breaking-down-the-china-chopper-web-shell-part-ii.html
- https://unit42.paloaltonetworks.com/bumblebee-webshell-xhunt-campaign/
- https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, Anton Kutepov, oscd.community,
  Chad Hudson, Matt Anderson
date: 2017-01-01
modified: 2024-12-14
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - '\w3wp.exe'
    - '\php-cgi.exe'
    - '\nginx.exe'
    - '\httpd.exe'
    - '\caddy.exe'
    - '\ws_tomcatservice.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    CommandLine|contains:
    - 'catalina.jar'
    - 'CATALINA_HOME'
  selection_susp_net_utility:
    OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
    CommandLine|contains:
    - ' user '
    - ' use '
    - ' group '
  selection_susp_ping_utility:
    OriginalFileName: 'ping.exe'
    CommandLine|contains: ' -n '
  selection_susp_change_dir:
    CommandLine|contains:
    - '&cd&echo'          # china chopper web shell
    - 'cd /d '          # https://www.computerhope.com/cdhlp.htm
  selection_susp_wmic_utility:
    OriginalFileName: 'wmic.exe'
    CommandLine|contains: ' /node:'
  selection_susp_powershell_cli:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -w hidden '
    - ' -windowstyle hidden'
    - '.WebClient).Download'
  selection_susp_misc_discovery_binaries:
  - Image|endswith:
    - '\dsquery.exe'
    - '\find.exe'
    - '\findstr.exe'
    - '\ipconfig.exe'
    - '\netstat.exe'
    - '\nslookup.exe'
    - '\pathping.exe'
    - '\quser.exe'
    - '\schtasks.exe'
    - '\systeminfo.exe'
    - '\tasklist.exe'
    - '\tracert.exe'
    - '\ver.exe'
    - '\wevtutil.exe'
    - '\whoami.exe'
  - OriginalFileName:
    - 'dsquery.exe'
    - 'find.exe'
    - 'findstr.exe'
    - 'ipconfig.exe'
    - 'netstat.exe'
    - 'nslookup.exe'
    - 'pathping.exe'
    - 'quser.exe'
    - 'schtasks.exe'
    - 'sysinfo.exe'
    - 'tasklist.exe'
    - 'tracert.exe'
    - 'ver.exe'
    - 'VSSADMIN.EXE'
    - 'wevtutil.exe'
    - 'whoami.exe'
  selection_susp_misc_discovery_commands:
    CommandLine|contains:
    - ' Test-NetConnection '
    - 'dir \'          # remote dir: dir \<redacted IP #3>\C$:\windows\temp\*.exe
  condition: 1 of selection_webserver_* and 1 of selection_susp_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of suspicious command-line parameters commonly associated with webshells, particularly during reconnaissance activities. Webshells can be deployed by adversaries to maintain persistent access to a compromised web application or server. By analyzing the command lines executed by various web server processes (such as `w3wp.exe`, `nginx.exe`, and `httpd.exe`) and identifying specific keywords and utilities often exploited in these contexts, the detection helps to uncover unauthorized activities that may indicate a breach or a compromised environment.

  The threat actors leveraging webshells typically aim to execute commands, exfiltrate data, or elevate privileges. They may utilize known utilities like `net.exe`, `ping.exe`, and `wmic.exe` to gather information about the environment, scan the network, or manipulate system configurations. The techniques identified in this detection align with several MITRE ATT&CK tactics, including persistence (Persistence: T1505.003), discovery (Discovery: T1018, T1033, T1087), and command execution (Execution: T1059).

  Primary data sources for this detection include process creation logs from the Windows operating system, where the command line information can reveal patterns indicative of webshell activity or unauthorized reconnaissance.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for processes related to web servers (`w3wp.exe`, `nginx.exe`, `httpd.exe`) to identify any suspicious command-line arguments indicating potential webshell activity.

  - **Analyze Command Line Parameters:** Look for specific command elements such as `cd /d`, `Test-NetConnection`, and encoded PowerShell commands, which may suggest exploitation techniques commonly employed by attackers.

  - **Collect Network Activity Insights:** Investigate network connections initiated by the detected process to identify potential data exfiltration or lateral movement attempts. Focus on traffic to known malicious IP addresses or unusual destinations.

  - **Correlate with Security Intelligence:** Cross-reference any identified command line executions with threat intelligence feeds or known signatures associated with specific webshells, such as the China Chopper or Bumblebee webshell.

  ### Prioritization
  This alert is rated as high severity due to the potential impact of webshells on the enterprise environment, which may lead to unauthorized access, data breaches, or lateral movement within the network. The likelihood of these occurrences increases given the prevalence of web application vulnerabilities.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, particularly if logs for certain processes are not enabled or if the command-line parameters used by adversaries evolve and are not included in the detection logic. The detection assumes proper logging of process creation events, including command-line arguments. Organizations must ensure that their security configurations capture detailed logging for process execution to enable effective alerting and investigation.

