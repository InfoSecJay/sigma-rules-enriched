title: Webshell Detection With Command Line Keywords
id: bed2a484-9348-4143-8a8a-b801c979301c
status: test
description: Detects certain command line parameters often used during 
  reconnaissance activity via web shells
references:
- https://www.fireeye.com/blog/threat-research/2013/08/breaking-down-the-china-chopper-web-shell-part-ii.html
- https://unit42.paloaltonetworks.com/bumblebee-webshell-xhunt-campaign/
- https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, Anton Kutepov, 
  oscd.community, Chad Hudson, Matt Anderson
date: 2017-01-01
modified: 2024-12-14
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - '\w3wp.exe'
    - '\php-cgi.exe'
    - '\nginx.exe'
    - '\httpd.exe'
    - '\caddy.exe'
    - '\ws_tomcatservice.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    CommandLine|contains:
    - 'catalina.jar'
    - 'CATALINA_HOME'
  selection_susp_net_utility:
    OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
    CommandLine|contains:
    - ' user '
    - ' use '
    - ' group '
  selection_susp_ping_utility:
    OriginalFileName: 'ping.exe'
    CommandLine|contains: ' -n '
  selection_susp_change_dir:
    CommandLine|contains:
    - '&cd&echo'          # china chopper web shell
    - 'cd /d '          # https://www.computerhope.com/cdhlp.htm
  selection_susp_wmic_utility:
    OriginalFileName: 'wmic.exe'
    CommandLine|contains: ' /node:'
  selection_susp_powershell_cli:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -w hidden '
    - ' -windowstyle hidden'
    - '.WebClient).Download'
  selection_susp_misc_discovery_binaries:
  - Image|endswith:
    - '\dsquery.exe'
    - '\find.exe'
    - '\findstr.exe'
    - '\ipconfig.exe'
    - '\netstat.exe'
    - '\nslookup.exe'
    - '\pathping.exe'
    - '\quser.exe'
    - '\schtasks.exe'
    - '\systeminfo.exe'
    - '\tasklist.exe'
    - '\tracert.exe'
    - '\ver.exe'
    - '\wevtutil.exe'
    - '\whoami.exe'
  - OriginalFileName:
    - 'dsquery.exe'
    - 'find.exe'
    - 'findstr.exe'
    - 'ipconfig.exe'
    - 'netstat.exe'
    - 'nslookup.exe'
    - 'pathping.exe'
    - 'quser.exe'
    - 'schtasks.exe'
    - 'sysinfo.exe'
    - 'tasklist.exe'
    - 'tracert.exe'
    - 'ver.exe'
    - 'VSSADMIN.EXE'
    - 'wevtutil.exe'
    - 'whoami.exe'
  selection_susp_misc_discovery_commands:
    CommandLine|contains:
    - ' Test-NetConnection '
    - 'dir \'          # remote dir: dir \<redacted IP #3>\C$:\windows\temp\*.exe
  condition: 1 of selection_webserver_* and 1 of selection_susp_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects command line parameters often used to identify and exploit web shells on web servers, specifically via reconnaissance and lateral movement techniques. The likely attacker objective is to assess system vulnerabilities and gain unauthorized access through persistent web shell placements. Relevant MITRE ATT&CK tactics and techniques include Persistence (T1505.003) and Discovery (T1018, T1033, T1087). The primary telemetry sources include process creation logs from Windows (Event ID 4688) and potentially network logs related to web server activity.

  If malicious, the security impact could involve complete system compromise, data exfiltration, or further exploitation across the network. It's important to note that this detection does NOT confirm successful exploitation or active malicious presence without additional corroborating evidence.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Event ID 4688 logs for processes that match the characteristics of web server executables (e.g., `w3wp.exe`, `php-cgi.exe`, `nginx.exe`) and look for suspicious command line parameters indicative of web shell activity.

  - **Correlate with web server logs:** Examine web server logs (e.g., IIS, Apache) for unusual access patterns or requests that coincided with the timing of the detected alerts. Look for POST requests to paths that are atypical for application behavior.

  - **Identify known malicious parameters:** Focus specifically on command lines containing keywords such as `&cd&echo` (indicative of China Chopper web shell) and any flags like `-w hidden` or `-enc`, which are frequently used in obfuscated PowerShell commands.

  - **Assess legitimate activity:** Identify expected behavior in the environment, such as authorized users executing valid maintenance tasks via command line; legit command lines typically include valid application commands without suspicious switches or encodings.

  - **Check process relationships:** Assess parent-child process relationships to determine if the flagged processes spawned by legitimate services or user-initiated commands. Malicious instances often show unusual parent processes indicative of exploitation.

  - **Validate high-confidence indicators:** Investigate logs for the use of network utilities being invoked with suspicious parameters—particularly `net.exe` with "user" or "group" indications, or `ping.exe` with abnormal flags that could signal reconnaissance efforts.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical web servers and the likelihood of malicious abuse, as exploitation via web shells is a known technique employed by adversaries to maintain access and perform reconnaissance. The behavior detected is actively weaponized in the wild.

  ### Blind Spots and Assumptions

  There are limitations in detection, particularly if command line logging is not enabled or if command obfuscation methods are employed to evade detection. Additionally, legitimate administrative tools or command-line usage for system maintenance may trigger this alert. It is beneficial to have companion detections in place, such as monitoring for abnormal web server behaviors or unusual outgoing network connections, which can provide a clearer picture of exploitative intent.

