title: Webshell Detection With Command Line Keywords
id: bed2a484-9348-4143-8a8a-b801c979301c
status: test
description: Detects certain command line parameters often used during 
  reconnaissance activity via web shells
references:
- https://www.fireeye.com/blog/threat-research/2013/08/breaking-down-the-china-chopper-web-shell-part-ii.html
- https://unit42.paloaltonetworks.com/bumblebee-webshell-xhunt-campaign/
- https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, Anton Kutepov, 
  oscd.community, Chad Hudson, Matt Anderson
date: 2017-01-01
modified: 2026-07-14
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - '\w3wp.exe'
    - '\php-cgi.exe'
    - '\nginx.exe'
    - '\httpd.exe'
    - '\caddy.exe'
    - '\ws_tomcatservice.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    CommandLine|contains:
    - 'catalina.jar'
    - 'CATALINA_HOME'
  selection_susp_net_utility:
    OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
    CommandLine|contains:
    - ' user '
    - ' use '
    - ' group '
  selection_susp_ping_utility:
    OriginalFileName: 'ping.exe'
    CommandLine|contains: ' -n '
  selection_susp_change_dir:
    CommandLine|contains:
    - '&cd&echo'          # china chopper web shell
    - 'cd /d '          # https://www.computerhope.com/cdhlp.htm
  selection_susp_wmic_utility:
    OriginalFileName: 'wmic.exe'
    CommandLine|contains: ' /node:'
  selection_susp_powershell_cli:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -w hidden '
    - ' -windowstyle hidden'
    - '.WebClient).Download'
  selection_susp_misc_discovery_binaries:
  - Image|endswith:
    - '\dsquery.exe'
    - '\find.exe'
    - '\findstr.exe'
    - '\ipconfig.exe'
    - '\netstat.exe'
    - '\nslookup.exe'
    - '\pathping.exe'
    - '\quser.exe'
    - '\schtasks.exe'
    - '\systeminfo.exe'
    - '\tasklist.exe'
    - '\tracert.exe'
    - '\wevtutil.exe'
    - '\whoami.exe'
  - OriginalFileName:
    - 'dsquery.exe'
    - 'find.exe'
    - 'findstr.exe'
    - 'ipconfig.exe'
    - 'netstat.exe'
    - 'nslookup.exe'
    - 'pathping.exe'
    - 'quser.exe'
    - 'schtasks.exe'
    - 'sysinfo.exe'
    - 'tasklist.exe'
    - 'tracert.exe'
    - 'VSSADMIN.EXE'
    - 'wevtutil.exe'
    - 'whoami.exe'
  selection_susp_misc_discovery_commands:
    CommandLine|contains:
    - ' Test-NetConnection '
    - 'dir \'          # remote dir: dir \<redacted IP #3>\C$:\windows\temp\*.exe
  condition: 1 of selection_webserver_* and 1 of selection_susp_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects command line parameters associated with the use of web shells, particularly during reconnaissance activities. The likely attacker objective is to exploit the compromised web server to perform lateral movement, data gathering, or further attacks within an organization's network. This detection maps to the MITRE ATT&CK tactics for Persistence (TA0003), Discovery (TA0007), and features techniques including Web Shell (T1505.003) and System Information Discovery (T1018).

  Primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line arguments and parent process details. If malicious, the use of web shells can lead to significant security impacts such as unauthorized access, data theft, or foothold establishment. It is crucial to note that this detection does NOT confirm that malicious activity is occurring on its own; it identifies behavior often associated with reconnaissance but may also capture legitimate tasks performed by system administrators.

  ### Investigation Steps

  - **Check relevant process creation logs**: Review Security Event ID 4688 for command line arguments from processes such as `w3wp.exe`, `php-cgi.exe`, and other listed binaries. Identify any unusual or suspicious parameters, especially those related to web shells or command utilities.

  - **Analyze process parent-child relationships**: Investigate Sysmon Event ID 1 to see if processes like `cmd.exe` or `powershell.exe` were spawned by `w3wp.exe` or other web server processes. Malicious activity typically shows atypical parent-child relationships indicating command execution from web application contexts.

  - **Identify high-confidence malicious indicators**: Look for command line patterns such as `&cd&echo` and `-enc` or `-EncodedCommand`. These strings are strong indicators of a web shell in action and may show up in Event ID 4688 logs as suspicious commands.

  - **Review for legitimate web server activity**: Ensure that any commands associated with `java.exe` and Tomcat processes (referencing `catalina.jar` or `CATALINA_HOME`) are part of normal application deployment or maintenance. Compare timestamps for unrelated administrative tasks to assess user behavior.

  - **Correlate with network activity**: Check network logs for unexpected outbound connections initiated from the server related to the detected command line activities. Anomalous DNS queries or file downloads could indicate data exfiltration or further exploitation attempts.

  - **Validate file alterations or creations**: Search for logs indicating file changes in directories typically used by web applications, such as `/var/www/html/` for Linux servers or corresponding IIS application folders. Look for unusual file creation timestamps or file types that aren't normally present.

  ### Prioritization

  This alert has a **high** severity due to the potential impacts on web server integrity and data security. The likelihood of malicious abuse is significant, especially since web shells are commonly weaponized for initial access and lateral movement. The presence of such command line activity is indicative of advanced persistence threats.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as using legitimate tools’ functionality for illicit purposes or employing custom/obfuscated commands that don't trigger the rule. Monitoring must ensure proper logging configurations are enabled for accurate process tracking. Legitimate administrative tasks, particularly around web server management or automation scripts, may trigger this alert. Companion detections, such as monitoring for unusual application log entries or anomalies in web application frameworks, can enhance detection capabilities.

