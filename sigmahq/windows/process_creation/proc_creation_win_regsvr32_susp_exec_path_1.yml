note: |
  ### Technical Context

  This Sigma rule detects the execution of the `regsvr32.exe` command pointing to potentially suspicious DLL locations, often indicative of stealthy malware behavior or attempts to bypass application whitelisting. The likely objective of an attacker using this technique is to load malicious DLLs without raising immediate suspicion by leveraging legitimate system utilities in non-standard directories. This behavior aligns with the MITRE ATT&CK technique "Signed Binary Proxy Execution" (T1218.010).

  The primary telemetry source is the Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, an attack could lead to unauthorized execution of code with elevated privileges and system compromise. However, this detection does NOT confirm that the execution is malicious on its own; further context is required to assess intent.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for `regsvr32.exe` invocation. Look for the `CommandLine` field to identify DLL paths.
  - **Investigate DLL path norms:** Validate if the DLLs being loaded from directories like `%TEMP%`, `%PROGRAMDATA%`, or `C:\Users\Public\` are expected for legitimate applications. Legitimate installers may reference these locations.
  - **Correlate with other activity:** Ensure no related suspicious activities were observed around the time of execution, such as unexpected network communications or additional process creations that could indicate a wider compromise.
  - **Identify high-confidence malicious indicators:** Look for known malicious DLL hashes or signed binaries that are not part of legitimate packages or libraries to confirm if the execution of regsvr32 is targeting suspicious DLLs.
  - **Observe for misconfigured applications:** Review configurations of applications that may genuinely execute `regsvr32.exe` for their legitimate operational behavior in your environment, as some installers may trigger this alert.
  - **Assess impact on critical systems:** If the affected host is highly critical (e.g., a domain controller or a server hosting sensitive applications), prioritize immediate investigation to mitigate potential risks associated with unauthorized execution.

  ### Prioritization

  This alert carries medium severity. While its occurrence is not uncommon, the risk escalates significantly if it targets critical systems or is accompanied by additional malicious indicators. The use of `regsvr32` for loading DLLs from suspicious locations is a technique that is weaponized by various adversaries.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative execution paths or renaming legitimate executables to masquerade malicious behaviors. Reliable detection requires proper logging configurations, including Sysmon for detailed process creation logs. Legitimate software installations or updates might trigger this alert, especially if they make use of `regsvr32` for proper functionality. A related detection that strengthens coverage is monitoring for unusual network communications following `regsvr32.exe` executions to identify potential command and control activities.

