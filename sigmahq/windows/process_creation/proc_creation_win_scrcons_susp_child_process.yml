note: |
  ### Technical Context
  This detection rule identifies suspicious child processes spawned by the Script Event Consumer (scrcons.exe), a legitimate Windows component that can be exploited for malicious purposes. Attackers may leverage scrcons.exe due to its ability to execute scripts within a Windows environment. The likely objective of such attacks is to execute malicious payloads covertly or escalate privileges using trusted system processes. Because scrcons.exe is typically used in automated script execution, its misuse is a significant indicator of potential malicious activities.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Execution** (TA0002): This tactic focuses on executing arbitrary code on a target system.
  - **Indicator of Attack** (T1047): This technique specifically relates to the use of Windows Management Instrumentation (WMI) to execute commands and scripts, which is applicable here due to the nature of scrcons.exe facilitating script execution.

  Key data sources for detecting these activities include process creation logs, which capture detailed insights into executed processes and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of scrcons.exe spawning child processes like svchost.exe, powershell.exe, or any unexpected executable. Look for unusual processes or execution patterns.
  - **Examine Parent-Child Relationships:** Investigate the process tree to understand the lineage of processes spawned from scrcons.exe. A legitimate chain should follow known behaviors; anything anomalous warrants further scrutiny.
  - **Check for Scheduled Tasks:** Look for any newly created or modified scheduled tasks related to scrcons.exe. Malicious actors may create scheduled tasks to maintain persistence on the system.
  - **Correlate with WMI Events:** Investigate WMI logs that may indicate the use of scrcons.exe for executing remote scripts or other suspicious commands. Anomalous WMI events should be cross-referenced with other telemetry.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact on the organization's network, as it indicates possible exploitation of a legitimate Windows process to execute malicious scripts or payloads. Early detection is crucial to mitigate potential data breaches or further internal compromise.

  ### Blind Spots and Assumptions
  This detection relies on the existence of process creation logging configured correctly on all monitored endpoints. If logging is misconfigured or not comprehensive, activities may go undetected. Additionally, false positives may arise from legitimate script executions by authorized applications or users. The detection logic assumes that typical behavior aligns with known usage patterns, and any deviations should be treated with caution. Regular updates and reviews of trusted applications and scripts are recommended to refine detection accuracy.

