logsource:
  category: process_creation
  product: windows
detection:
  selection_call_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_call_parent:
    ParentImage|endswith: '\cmd.exe'
  selection_call_cli:
    CommandLine|contains: 'user32.dll,'
  selection_function:
    CommandLine|contains: 'LockWorkStation'
  condition: all of selection_*
falsepositives:
- Scripts or links on the user desktop used to lock the workstation instead of 
  Windows+L or the menu option
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious execution of the `rundll32.exe` process to call the `LockWorkStation` function within `user32.dll`. It indicates an abnormal method of locking a workstation, which could signify an attempt by an adversary to conceal malicious activities by locking the screen while executing other processes. The likely attacker objective is to gain time to execute further actions unnoticed after gaining access. This behavior associates with the MITRE ATT&CK tactic of Stealth (T1560) and the technique for Disabling Security Tools (T1089).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688, which captures the creation of processes and their command line arguments. The detection may imply an ongoing attack if malicious; however, it does NOT confirm that a system compromise has occurred without further corroborating evidence of unauthorized access.

  ### Investigation Steps

  - **Verify process execution history**: Investigate Event ID 4688 for any additional run history of `rundll32.exe`, look for anomalies in command line arguments that do not align with legitimate use cases. Legitimate execution typically shows standard usage patterns with `user32.dll`.

  - **Analyze parent process relationships**: Check for the presence of Event ID 4688 noting the parent process for `rundll32.exe`. If the parent process is `cmd.exe`, examine for unusual scripting or command line parameters indicating a potential attack.

  - **Identify user activity logs**: Review Windows Security Event ID 4624 for logon events just before the suspicious activity. Correlation with a valid user session can provide context; if the user is not logged in or if the time of execution is outside normal hours, consider it suspicious.

  - **Cross-check with known malicious indicators**: Search for previous engagements or incidents involving malicious `rundll32.exe` execution related to workstation locking. Common signatures can include attempts to run PowerShell or batch scripts invoking `rundll32.exe`.

  - **Evaluate physical or administrative alerts**: Assess any related incident reports or logs from remote access tools, DLP systems, or monitoring solutions that indicate unauthorized screen locks or unusual user interactions.

  - **Monitor for follow-up actions**: Check for any network communications or outbound access attempts following the execution. Utilize Firewall logs or network traffic analysis to identify suspicious behavior that transpired after the workstation was locked.

  ### Prioritization

  This alert holds medium severity due to the potential impact of unauthorized user interface manipulation and the possibility of covering tracks after malicious actions. The likelihood of exploitation is moderate, as similar tactics have been weaponized in targeted attacks to remain undetected. Active monitoring is crucial, especially in high-value asset environments.

  ### Blind Spots and Assumptions

  Common evasion techniques may include executing locking commands via different benign-looking processes. Reliable detection depends on comprehensive logging configuration surrounding `rundll32.exe` actions and parent-child process relationships. Innocuous user scripts or shortcuts that utilize the locking function can falsely trigger this alert, necessitating stronger contextual clarifications. Companion detections, such as those monitoring for unusual `cmd.exe` execution patterns or application utilization, may reinforce coverage against misuse.

