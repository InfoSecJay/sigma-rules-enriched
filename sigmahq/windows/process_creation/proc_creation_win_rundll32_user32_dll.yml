title: Suspicious Workstation Locking via Rundll32
id: 3b5b0213-0460-4e3f-8937-3abf98ff7dcc
status: test
description: Detects a suspicious call to the user32.dll function that locks the user
  workstation
references:
- https://app.any.run/tasks/2aef9c63-f944-4763-b3ef-81eee209d128/
author: frack113
date: 2022-06-04
modified: 2023-02-09
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_call_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_call_parent:
    ParentImage|endswith: '\cmd.exe'
  selection_call_cli:
    CommandLine|contains: 'user32.dll,'
  selection_function:
    CommandLine|contains: 'LockWorkStation'
  condition: all of selection_*
falsepositives:
- Scripts or links on the user desktop used to lock the workstation instead of Windows+L
  or the menu option
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving the `rundll32.exe` utility, which is often abused by attackers to execute DLL functions. Specifically, it focuses on when `rundll32.exe` is used to call the `LockWorkStation` function from the `user32.dll` library, potentially indicating an attempt to lock a user's workstation without their consent. This kind of activity could be part of a larger attack scenario where an adversary aims to gain unauthorized access to a session or distract the user while executing further malicious actions.

  In terms of attacker objectives, this behavior may be utilized to facilitate lateral movement or maintain persistence within the environment. The technique aligns closely with the MITRE ATT&CK framework tactics of **Defense Evasion** and potentially **Execution** through the misuse of legitimate tools like `rundll32.exe`. Relevant techniques include **T1568.002: Execution via API** and **T1055: Process Injection,** which describe similar methods of executing code via valid system processes.

  Primary data sources that will provide insight into this activity include **process creation events** that log details such as the command line used, the image name, and the parent process associated with the execution of `rundll32.exe`. These logs are crucial for detecting the unauthorized invocation of functions that could be a precursor to further malicious actions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for `rundll32.exe` invocation, ensuring to examine the command line arguments and look for references to `user32.dll`.
  - **Examine Parent Process Relationships:** Investigate other entries where `cmd.exe` is listed as the parent process, concentrating on the context surrounding the invocation to determine if it correlates with known legitimate activity.
  - **Assess User Activity and Context:** Check user activity during the time of the event to confirm if it aligns with normal usage patterns or if there was unauthorized access to the workstation.
  - **Cross-Reference with Security Logs:** Look for any additional security alerts related to unusual account activities that may accompany the detected behavior, such as failed login attempts or unusual access patterns.

  ### Prioritization
  The alert is deemed medium severity due to the potential for an attacker to manipulate legitimate tools to execute malicious actions while evading detection. If confirmed, it could indicate an ongoing effort to compromise user sessions and escalate privileges within the enterprise.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage that could occur due to legitimate usages of scripts that invoke `rundll32.exe` to lock workstations, leading to false positives. Moreover, the detection logic assumes that all workstation locking attempts through `rundll32.exe` are malicious, not accounting for benign scenarios initiated by users. For the alert to function effectively, it is essential that comprehensive logging of process creation events and command line arguments is enabled across Windows endpoints.

