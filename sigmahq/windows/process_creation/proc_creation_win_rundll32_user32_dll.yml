title: Suspicious Workstation Locking via Rundll32
id: 3b5b0213-0460-4e3f-8937-3abf98ff7dcc
status: test
description: Detects a suspicious call to the user32.dll function that locks the
  user workstation
references:
- https://app.any.run/tasks/2aef9c63-f944-4763-b3ef-81eee209d128/
author: frack113
date: 2022-06-04
modified: 2023-02-09
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_call_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_call_parent:
    ParentImage|endswith: '\cmd.exe'
  selection_call_cli:
    CommandLine|contains: 'user32.dll,'
  selection_function:
    CommandLine|contains: 'LockWorkStation'
  condition: all of selection_*
falsepositives:
- Scripts or links on the user desktop used to lock the workstation instead of 
  Windows+L or the menu option
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious invocations of the `rundll32.exe` process to call the `LockWorkStation` function from `user32.dll`. This activity is often indicative of an attacker attempting to obscure their actions or manipulate the user interface, potentially as part of a broader attack strategy to disrupt operations or facilitate further malicious behavior, such as credential theft or escalation. The relevant MITRE ATT&CK tactic and technique is **Defense Evasion (T1203)**.

  The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID **4688** and Sysmon Event ID **1**, capturing process creation and command line arguments. If the activity is malicious, it can disrupt productivity, potentially allowing an attacker to access unattended workstations or perform further manipulation undiscovered. Notably, this detection does NOT confirm that the activity is malicious in isolation, as legitimate scripts may also invoke the `LockWorkStation` function.

  ### Investigation Steps

  - **Review process creation events:**
    Check Security Event ID **4688** and Sysmon Event ID **1** for `rundll32.exe` initiating the lock workstation command, focusing on the Command Line for the string `user32.dll, LockWorkStation`. Benign cases typically show normal user patterns.

  - **Identify the parent process:**
    Confirm that the Parent Image is `cmd.exe` to validate if this was a direct malicious invocation; this is unusual and often associated with scripted attacks, whereas expected behavior may show the process called by legitimate user actions, such as using the Windows interface.

  - **Correlate user activity:**
    Cross-reference logins and workstation activity around the time of the event. Check for user account activity with Event ID **4624** (logon) and ensure no users were logged on or active, which may indicate malicious intentions if workstation locking occurred unexpectedly.

  - **Check for script presence:**
    Investigate any recent script executions (by searching for `.bat`, `.cmd`, or other script extensions) that tie to the locking behavior, especially if located on user desktops or in common script execution folders.

  - **Monitor for associated artifacts:**
    Validate if any additional command line or scheduled tasks are related to the workspace locking, as malware may utilize a chaining technique that could leave residual artifacts in logs.

  - **Evaluate history of alerts:**
    Review historical alerts related to this behavior across your organization. High-frequency detections tied to specific workstations may signal targeted attacks and warrant further investigation.

  ### Prioritization

  This alert is of medium severity. It operates on systems that can be critical for operations and could indicate persistent adversary behavior when weaponized. While workstation locking itself is not often malicious, the method of execution through script invocations raises the potential for misuse and requires thorough review to ensure it's not a cover for more nefarious activities.

  ### Blind Spots and Assumptions

  Detection may not effectively identify legitimate usage of `rundll32.exe` for functions other than locking the workstation, leading to potential false positives, especially from user-initiated scripts or automated processes. This rule relies on comprehensive logging being enabled for effective monitoring; any gaps in logging may result in undetected exploit attempts. Companion detections for suspicious child process execution, such as **cmd.exe** or other command interpreters initiating unusual processes, can enhance the overall security posture and coverage against various attack vectors.

