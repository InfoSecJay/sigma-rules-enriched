title: Potential Manage-bde.wsf Abuse To Proxy Execution
id: c363385c-f75d-4753-a108-c1a8e28bdbda
status: test
description: Detects potential abuse of the "manage-bde.wsf" script as a LOLBIN 
  to proxy execution
references:
- https://lolbas-project.github.io/lolbas/Scripts/Manage-bde/
- https://gist.github.com/bohops/735edb7494fe1bd1010d67823842b712
- https://twitter.com/bohops/status/980659399495741441
- https://twitter.com/JohnLaTwC/status/1223292479270600706
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1216/T1216.md
author: oscd.community, Natalia Shornikova, Nasreddine Bencherchali (Nextron 
  Systems)
date: 2020-10-13
modified: 2023-02-03
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_wscript_img:
  - Image|endswith: '\wscript.exe'
  - OriginalFileName: 'wscript.exe'
  selection_wscript_cli:
    CommandLine|contains: 'manage-bde.wsf'
  selection_parent:
    ParentImage|endswith:
    - '\cscript.exe'
    - '\wscript.exe'
    ParentCommandLine|contains: 'manage-bde.wsf'
  selection_filter_cmd:
    Image|endswith: '\cmd.exe'
  condition: all of selection_wscript_* or (selection_parent and not 
    selection_filter_cmd)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential abuse of the "manage-bde.wsf" script, which is a Windows script used for managing BitLocker Drive Encryption, as a Living Off The Land Binary (LOLBIN) to facilitate malicious proxy execution. Attackers may utilize this script to execute payloads stealthily or bypass security controls. The detection aligns with the MITRE ATT&CK technique T1216 (Script Proxy Execution).

  The primary telemetry source for this rule is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could allow attackers to execute arbitrary commands, leading to data exfiltration or system compromise. This detection does NOT confirm malicious activity on its own; legitimate administrative use of the script may also trigger the alert.

  ### Investigation Steps

  - **Review process creation logs**: Examine Security Event ID 4688 and Sysmon Event ID 1 for instances where `wscript.exe` is launched with a command line containing `manage-bde.wsf`. Look for specific user accounts and execution context to assess intention.

  - **Check parent process**: Identify the parent process of the `wscript.exe` instance. If it was initiated by `cscript.exe` or another script host with `manage-bde.wsf`, this might indicate potential misuse. Legitimate instances may show usage by known administrative users during maintenance windows.

  - **Correlate with known malicious indicators**: Search for additional process creation events that involve system-critical scripts or executables that are typically abused in conjunction with `manage-bde.wsf`, such as PowerShell or cmd.exe (Event ID 4688, process command line).

  - **Validate execution on critical assets**: Ensure that this behavior is logged on critical servers or endpoints with sensitive information. Normal activity on these systems typically does not involve `manage-bde.wsf` being executed.

  - **Look for artifacts of exfiltration**: If the alert correlates with the use of `manage-bde.wsf`, check for file creation or modification logs indicating possible data staging or exfiltration, such as suspicious file transfers through command line parameters in related processes.

  ### Prioritization

  This alert should be considered high severity due to the potential for exploitation on critical systems managing disk encryption. The likelihood of malicious abuse is elevated, as the use of LOLBIN techniques is common in current attack methodologies, enabling adversarial actions to go undetected.

  ### Blind Spots and Assumptions

  Potential evasion techniques might include obfuscating the script execution or utilizing other LOLBINs to achieve similar outcomes without triggering the detection. Reliable detection requires comprehensive logging of Windows process creations and access to the necessary security event logs. Legitimate activities may involve system admins running the script for encryption or decryption tasks. A related detection that strengthens coverage would be monitoring for unusual PowerShell activity (T1086) that may accompany this script execution.

