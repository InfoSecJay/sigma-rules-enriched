logsource:
  category: process_creation
  product: windows
detection:
  selection_wscript_img:
  - Image|endswith: '\wscript.exe'
  - OriginalFileName: 'wscript.exe'
  selection_wscript_cli:
    CommandLine|contains: 'manage-bde.wsf'
  selection_parent:
    ParentImage|endswith:
    - '\cscript.exe'
    - '\wscript.exe'
    ParentCommandLine|contains: 'manage-bde.wsf'
  selection_filter_cmd:
    Image|endswith: '\cmd.exe'
  condition: all of selection_wscript_* or (selection_parent and not 
    selection_filter_cmd)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential misuse of the `manage-bde.wsf` script, which can be leveraged by attackers to execute commands through Windows Script Host (WSH) without raising immediate suspicion. Attackers may aim to bypass security mechanisms or retrieve sensitive data from encrypted drives, thereby compromising the confidentiality and integrity of the targeted system. The relevant MITRE ATT&CK tactic is "Execution" (TA0002) and the technique is "Windows Script Hosting" (T1216).

  Primary telemetry sources include process creation logs, specifically Windows Event ID 4688 for process creation, which indicates the execution of scripts via `wscript.exe`. Malicious activity could result in unauthorized access or execution of commands that disrupt business operations. However, it is important to note that this detection alone does not prove malicious intent, as legitimate administrative tasks could trigger the same alert.

  ### Investigation Steps

  - **Review process creation logs:** Extract Event ID 4688 for any instances of `wscript.exe` with a `CommandLine` containing `manage-bde.wsf`. Check for associated `ParentImage` fields to identify whether they originate from known benign scripts or suspicious ones.

  - **Evaluate parent process activity:** Analyze the `ParentCommandLine` information linked to the detected `wscript.exe` execution. If it is initiated by commonly trusted tools (e.g., `cscript.exe`) in legitimate contexts, this may indicate benign behavior.

  - **Identify command line parameters:** Seek unusual command line parameters passed with `manage-bde.wsf` executions. Legitimate uses typically include options related to drive encryption management. Entities using it with unrecognized flags could signal malicious intent.

  - **Look for signs of data access or manipulation:** Check for any file access or file creation actions logged that pertain to context before and after `manage-bde.wsf` usage, which might indicate lateral movement or data exfiltration efforts.

  - **Cross-reference with endpoint roles:** Identify the host role associated with the activity. System assets like domain controllers or financial servers have a higher criticality, and suspicious activities on these machines should be prioritized for deeper investigation.

  ### Prioritization

  This alert should be treated as high severity, particularly if the activity occurs on critical systems such as servers or endpoints handling sensitive data. The likelihood of malicious abuse is elevated due to the potential for script-based evasion of traditional security tools, making it significant in the threat landscape.

  ### Blind Spots and Assumptions

  Detection may be circumvented by adversaries employing other scripting languages or obscured execution paths, highlighting the need for diverse script detection methods. Continuous monitoring of process creation logs is essential to ensure comprehensive coverage. Additionally, administrative user activities may inadvertently trigger this alert if they use `manage-bde.wsf` for legitimate operations, requiring contextual understanding of the environment. Companion detections for related PowerShell usage (T1086) could enhance the investigation's coverage to capture a broader range of execution vectors.

