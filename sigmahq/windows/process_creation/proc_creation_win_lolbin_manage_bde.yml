title: Potential Manage-bde.wsf Abuse To Proxy Execution
id: c363385c-f75d-4753-a108-c1a8e28bdbda
status: test
description: Detects potential abuse of the "manage-bde.wsf" script as a LOLBIN to
  proxy execution
references:
- https://lolbas-project.github.io/lolbas/Scripts/Manage-bde/
- https://gist.github.com/bohops/735edb7494fe1bd1010d67823842b712
- https://twitter.com/bohops/status/980659399495741441
- https://twitter.com/JohnLaTwC/status/1223292479270600706
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1216/T1216.md
author: oscd.community, Natalia Shornikova, Nasreddine Bencherchali (Nextron Systems)
date: 2020-10-13
modified: 2023-02-03
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_wscript_img:
  - Image|endswith: '\wscript.exe'
  - OriginalFileName: 'wscript.exe'
  selection_wscript_cli:
    CommandLine|contains: 'manage-bde.wsf'
  selection_parent:
    ParentImage|endswith:
    - '\cscript.exe'
    - '\wscript.exe'
    ParentCommandLine|contains: 'manage-bde.wsf'
  selection_filter_cmd:
    Image|endswith: '\cmd.exe'
  condition: all of selection_wscript_* or (selection_parent and not selection_filter_cmd)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential misuse of the `manage-bde.wsf` script, which is often used in Windows environments to enable BitLocker encryption management. Attackers may exploit this script as a Living Off the Land Binaries and Scripts (LOLBAS) technique to execute commands or scripts without raising immediate suspicion. The likely motivation behind this activity is to evade detection while executing malicious payloads, such as downloading additional malware or establishing a reverse shell.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the technique **Command and Scripting Interpreter** (T1216). The use of `manage-bde.wsf` to proxy execution can indicate an attempt by threat actors to bypass security controls by leveraging legitimate system tools. The primary data sources for detecting this activity are **process creation events** from the Windows operating system, which log activities related to executed processes, their command lines, and parent-child relationships between processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for any instances where `wscript.exe` or `cscript.exe` is invoked with `manage-bde.wsf` in the command line parameters.
  - **Analyze Parent Process Relationships:** Investigate the parent processes associated with the instances of `manage-bde.wsf` execution. Look for suspicious patterns, especially if `cmd.exe` or `wscript.exe` is the parent.
  - **Correlate with Other Security Alerts:** Cross-reference any detected `manage-bde.wsf` executions with other alerts from EDR, SIEM or firewall logs to identify potential coordinating actions indicative of a wider attack or incident.
  - **Collect Artifact Evidence:** If identified, gather all associated logs around the time of suspicious execution and examine executed commands to determine if further investigation or remediation is necessary.

  ### Prioritization
  Given the potential for significant impact if an attacker gains access and control over systems, along with the likelihood of execution attempts being masked by legitimate tool usage, this alert is classified as high severity. Quick action may prevent further compromise.

  ### Blind Spots and Assumptions
  This detection rule may not cover all possible methods of `manage-bde.wsf` abuse, particularly if attackers utilize alternative command execution methods or obfuscate their usage. The detection logic assumes that the `manage-bde.wsf` script will execute with recognizable parent processes. Successful detection is contingent upon accurately configured process creation logging, which must capture command-line arguments and parent-child relationships comprehensively.

