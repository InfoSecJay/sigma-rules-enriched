title: Mstsc.EXE Execution From Uncommon Parent
id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
status: test
description: Detects potential RDP connection via Mstsc using a local ".rdp" 
  file located in suspicious locations.
references:
- https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
- https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.lateral-movement
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
            # Covers potential downloads/clicks from browsers
    - '\brave.exe'
    - '\CCleanerBrowser.exe'
    - '\chrome.exe'
    - '\chromium.exe'
    - '\firefox.exe'
    - '\iexplore.exe'
    - '\microsoftedge.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\vivaldi.exe'
    - '\whale.exe'
            # Covers potential downloads/clicks from email clients
    - '\outlook.exe'
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Remote Desktop Protocol (RDP) client (Mstsc.EXE) initiated from unusual parent processes, such as web browsers or email clients. This behavior is often indicative of an attack where an adversary could be attempting to establish an RDP session to a compromised or sensitive system, potentially to move laterally within the network. The relevant MITRE ATT&CK tactic is "Lateral Movement" (TA0008), with the technique being "Remote Services" (T1021).

  The primary telemetry source for this detection is Windows process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If detected as malicious, the impact could range from potential data exfiltration to full system compromise, allowing unauthorized access to sensitive information. This detection does NOT confirm malicious intent by itself, as it may also trigger during legitimate administrative or remote access activities.

  ### Investigation Steps

  - **Review process parent relationships:** Check for Mstsc.EXE execution with parent processes like `chrome.exe`, `firefox.exe`, or `outlook.exe` by inspecting Windows Security Event ID 4688. Look for unusual patterns, such as RDP initiated from browsers or email clients, which may indicate misuse.

  - **Validate user activity context:** Investigate the user account associated with the Mstsc.EXE launch, checking for recent user logins or if the account has administrative privileges. A legitimate user should typically launch Mstsc from a trusted source or directly, rather than being spawned by unintended applications.

  - **Check for associated network connections:** Analyze network logs (e.g., Windows Event ID 5156 or firewall logs) for outbound RDP connections (port 3389) occurring shortly after the Mstsc.EXE execution. Identify if the destination IP aligns with known assets or if it’s an external or unusual endpoint.

  - **Examine log file creation or modification:** Confirm whether any `.rdp` files were created or modified around the time of Mstsc.EXE execution, potentially indicating a scripted or automated attack approach. Look at the properties of these files for suspicious paths or unexpected user alterations.

  - **Identify high-confidence malicious indicators:** Search for any patterns where Mstsc.EXE is executed within a rapid succession timeline alongside scripts or other malicious binaries. Pay special attention to behaviors characteristic of lateral movement.

  ### Prioritization

  The alert severity is high due to the potential impact of the affected systems, notably if those systems contain sensitive data or administrative access. The likelihood of malicious abuse increases with remote access tools being a common vector in attacks. RDP sessions spawned from unusual parent processes are a clear indicator of potential compromise in a typical enterprise environment.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where legitimate users access RDP via appropriate methods, such as directly using the Run dialog. Additionally, it relies on consistent logging configurations for both process creation and network traffic; any gaps may lead to missed detections. Evasion techniques include the use of alternative remote access tools or legitimate administrative applications masquerading as RDP clients. Consider companion detections like abnormal outbound traffic alerts or execution of PowerShell commands invoking RDP sessions to enhance coverage.

