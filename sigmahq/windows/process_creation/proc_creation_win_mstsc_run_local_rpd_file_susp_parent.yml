title: Mstsc.EXE Execution From Uncommon Parent
id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
status: test
description: Detects potential RDP connection via Mstsc using a local ".rdp" file
  located in suspicious locations.
references:
- https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
- https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.lateral-movement
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
            # Covers potential downloads/clicks from browsers
    - '\brave.exe'
    - '\CCleanerBrowser.exe'
    - '\chrome.exe'
    - '\chromium.exe'
    - '\firefox.exe'
    - '\iexplore.exe'
    - '\microsoftedge.exe'
    - '\msedge.exe'
    - '\opera.exe'
    - '\vivaldi.exe'
    - '\whale.exe'
            # Covers potential downloads/clicks from email clients
    - '\outlook.exe'
  selection_img:
  - Image|endswith: '\mstsc.exe'
  - OriginalFileName: 'mstsc.exe'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects instances of the `mstsc.exe` (Microsoft Terminal Services Client) being executed with a suspicious parent process, particularly when this execution is initiated from uncommon locations or with a local RDP file. The likely threat scenario involves attackers leveraging Remote Desktop Protocol (RDP) for unauthorized access into an organization's network, often attempting to gain access through social engineering or the execution of malicious files that utilize RDP for lateral movement. The use of RDP, when not properly monitored, poses severe risks to an organization's security posture, as it could lead to data exfiltration or further compromise.

  In terms of the MITRE ATT&CK framework, this rule aligns with the tactics and techniques relating to **Lateral Movement** (TA0031) and **Remote Services** (T1021), specifically focusing on the use of **Remote Desktop Protocol (T1076)**. Attackers may utilize malicious RDP files or modify legitimate ones to fit their purposes, evading traditional security mechanisms. To effectively identify these activities, the most relevant primary data sources would be **process creation logs**, which track the execution details of processes on Windows systems.

  ### Investigation Steps
  - **Review RDP Execution Details**: Analyze the process creation logs to examine the command line used in the `mstsc.exe` execution, focusing on parameters that indicate remote connections, especially from '.rdp' files.
  - **Inspect Parent Process Information**: Collect data about the parent processes that initiated `mstsc.exe`, ensuring to confirm whether the initiating processes match typical browser or email client applications listed in the detection rule.
  - **Examine RDP File Locations**: Check the directory paths of any `.rdp` files used during the `mstsc.exe` execution. Look for instances stored in unusual or unexpected locations that could suggest malicious intent.
  - **Correlation with User Behavior**: Investigate the user accounts executing the RDP connections, comparing their typical behavior to identify any anomalies, particularly connectivity attempts outside of business hours or from unusual geographic locations.

  ### Prioritization
  Given the high potential impact associated with unauthorized RDP access in an enterprise environment, the alert carries a high severity level. The likelihood of an attacker exploiting this vector to gain persistence or control over internal systems makes it a critical alert that warrants immediate investigation.

  ### Blind Spots and Assumptions
  While this detection rule offers valuable insights into potentially malicious RDP access, it may miss instances where legitimate processes are being used inappropriately, such as users executing RDP connections from typical applications without any malicious intent. The detection logic assumes that all RDP executions that originate from defined parent processes and that utilize atypical `.rdp` file locations are inherently suspicious. Additionally, for this alert to function optimally, the enterprise must have proper logging enabled for all relevant process creations, and access to detailed process metadata must be present in the logs to maximize detection efficacy.

