title: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
id: 129966c9-de17-4334-a123-8b58172e664d
status: test
description: |
  Detects when a user is potentially trying to bypass the Windows Defender AV by renaming a tool to dump64.exe and placing it in the Visual Studio folder.
  Currently the rule is covering only usage of procdump but other utilities can be added in order to increase coverage.
references:
- https://twitter.com/mrd0x/status/1460597833917251595
author: Austin Songer @austinsonger, Florian Roth (Nextron Systems), Nasreddine Bencherchali
  (Nextron Systems)
date: 2021-11-26
modified: 2024-06-21
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_dump:
    Image|startswith: ':\Program Files'
    Image|contains: '\Microsoft Visual Studio\'
    Image|endswith: '\dump64.exe'
  selection_tools_procdump:
  - OriginalFileName: 'procdump'
  - CommandLine|contains:
    - ' -ma '           # Full Dump
    - ' -mp '           # Mini Plus
  condition: selection_dump and 1 of selection_tools_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential bypass attempts of Windows Defender Antivirus (AV) by monitoring the renaming of a utility to 'dump64.exe' within the Visual Studio directory. Attackers may utilize this approach to evade detection while conducting memory dumps, which could be a preliminary step in credential theft or lateral movement. The specific threat scenario suggests that an attacker, potentially using tools like ProcDump, is trying to extract sensitive information from a compromised system without raising alarms from AV software.

  The MITRE ATT&CK framework identifies this behavior under the tactic of Credential Access, specifically technique T1003.001 (Credential Dumping: LSASS Memory). By leveraging memory dumping tools, threats such as credential theft can lead to escalation of privileges or infiltration of other systems within a network. Detection of such activities is critical due to the potential for attackers to harvest sensitive data and maintain persistence.

  Primary data sources for effective monitoring include process creation logs from Windows, which capture command-line arguments and the context in which binaries are executed, as well as event logs related to file and process activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate recent process creation events for instances of 'dump64.exe' being executed from the Visual Studio directory and note any anomalies in command line parameters.
  - **Analyze File Activity Logs:** Check for changes or renaming of files in the Visual Studio folder, particularly focused on any newly created executables or scripts that may indicate suspicious activity.
  - **Inspect Command-Line Arguments:** Look for specific command-line arguments typically associated with memory dumping, such as '-ma' or '-mp', which suggest intent to capture sensitive data.
  - **Correlate with User Activity:** Cross-reference user activity logs to determine if there are any corresponding logins or access patterns that indicate potential insider threat or unauthorized access around the time of the detected event.

  ### Prioritization
  This alert holds a high severity in an enterprise environment as it indicates an attempt to bypass established security measures, suggesting an advanced threat that could lead to unauthorized data access or system compromise. Immediate attention is essential to prevent further exploits.

  ### Blind Spots and Assumptions
  The detection logic may not cover all potential tools for memory dumping beyond ProcDump, as attackers could utilize other methods to achieve similar objectives. It assumes that logs related to process creation and modifications in critical directories are enabled and being monitored effectively. Additionally, if the tool or any other name is used instead of 'dump64.exe', this alert may not trigger, leaving a gap in detection coverage. Ensuring comprehensive logging and monitoring across all executable renaming activities is essential for strengthening defenses.

