title: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
id: 129966c9-de17-4334-a123-8b58172e664d
status: test
description: |
  Detects when a user is potentially trying to bypass the Windows Defender AV by renaming a tool to dump64.exe and placing it in the Visual Studio folder.
  Currently the rule is covering only usage of procdump but other utilities can be added in order to increase coverage.
references:
- https://twitter.com/mrd0x/status/1460597833917251595
author: Austin Songer @austinsonger, Florian Roth (Nextron Systems), Nasreddine 
  Bencherchali (Nextron Systems)
date: 2021-11-26
modified: 2024-06-21
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_dump:
    Image|startswith: ':\Program Files'
    Image|contains: '\Microsoft Visual Studio\'
    Image|endswith: '\dump64.exe'
  selection_tools_procdump:
  - OriginalFileName: 'procdump'
  - CommandLine|contains:
    - ' -ma '           # Full Dump
    - ' -mp '           # Mini Plus
  condition: selection_dump and 1 of selection_tools_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to bypass Windows Defender Antivirus (AV) by renaming a potentially malicious executable to "dump64.exe" and placing it within the Microsoft Visual Studio directory. This behavior indicates an attacker may seek to exploit Windows Defender's naming conventions to avoid detection while using tools like ProcDump, which is commonly employed for memory dumping and credential extraction. The relevant MITRE ATT&CK tactic is Credential Access, specifically technique T1003.001 (Credential Dumping: Process Dumping).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 which records the creation of processes. If the behavior is malicious, it could lead to unauthorized data access or exfiltration, posing significant risk to the enterprise environment. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate developers could also be using similar techniques for valid purposes.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Security Event ID 4688 for instances where "dump64.exe" is spawned. Investigate the parent process and the command line arguments used for any suspicious flags like '-ma' or '-mp', which indicate a full dump.

  - **Validate File Location & Naming:** Confirm that "dump64.exe" is located in the "C:\Program Files\Microsoft Visual Studio\" directory. A legitimate Visual Studio process should not normally spawn this executable.

  - **Examine Command Line Arguments:** Look for the presence of "OriginalFileName" as "procdump" in processes. A legitimate usage context would not typically invoke these commands with flags intended for captures like memory dumps.

  - **Identify User Account Activity:** Check the user account that executed the process. Users with administrative privileges are more likely to be targeted for attacks. Compare user behavior against known baselines for abnormal activity patterns.

  - **Review for Established Patterns:** Investigate similar past alerts triggered by the same user or system to determine if this behavior is part of a larger strategy indicating persistence or lateral movement.

  - **Monitor for Data Exfiltration Artifacts:** Validate systems for suspicious outbound connections or unusual file creations that may indicate data exfiltration attempts following a dump process.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive data handling. The likelihood of malicious use is significant, as the behavior aligns with known tactics for credential dumping, which are commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if logs from specific execution contexts are not captured, such as when a file is executed from a different non-standard directory. Legitimate development activities might trigger this alert, particularly in higher-privileged contexts. Companion detections such as those for unusual command-line arguments in PowerShell or abnormal process parent-child relationships can enhance the coverage and context surrounding this rule.

