title: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
id: 129966c9-de17-4334-a123-8b58172e664d
status: test
description: |
  Detects when a user is potentially trying to bypass the Windows Defender AV by renaming a tool to dump64.exe and placing it in the Visual Studio folder.
  Currently the rule is covering only usage of procdump but other utilities can be added in order to increase coverage.
references:
- https://twitter.com/mrd0x/status/1460597833917251595
author: Austin Songer @austinsonger, Florian Roth (Nextron Systems), Nasreddine Bencherchali
  (Nextron Systems)
date: 2021-11-26
modified: 2024-06-21
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_dump:
    Image|startswith: ':\Program Files'
    Image|contains: '\Microsoft Visual Studio\'
    Image|endswith: '\dump64.exe'
  selection_tools_procdump:
  - OriginalFileName: 'procdump'
  - CommandLine|contains:
    - ' -ma '           # Full Dump
    - ' -mp '           # Mini Plus
  condition: selection_dump and 1 of selection_tools_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects potentially malicious activity where an adversary attempts to bypass Windows Defender Antivirus by renaming a known tool, dump64.exe, and placing it within the Microsoft Visual Studio directory. The likely attacker objective is credential harvesting or enabling further persistence through process memory dumping, consistent with the Tactics and Techniques from MITRE ATT&CK with the tactic of Credential Access (TA0006) and the technique for Memory Dumping (T1003.001). The rule primarily leverages Windows process creation logs, specifically targeting Event ID 4688 to identify when the renamed executable is launched.

  If this activity is confirmed as malicious, it could lead to extensive credential theft and further exploitation of the system. Importantly, this detection does NOT confirm that a compromise has occurred on its own; it merely indicates a potentially suspicious behavior that warrants further investigation.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for occurrences of dump64.exe being executed from the location `C:\Program Files\Microsoft Visual Studio\`. Look for process creation time and user context to identify if this aligns with authorized development activity.

  - **Inspect command line arguments:** Verify command line usage associated with dump64.exe under Event ID 4688. Legitimate usage might not include `-ma` (Full Dump) or `-mp` (Mini Plus). If present, this indicates possible credential dumping activity.

  - **Identify legitimate Visual Studio usage:** Analyze recent file access and process executions from the Visual Studio directory. Cross-reference to identify if any known development processes or developer activities coincide with the alert timeframe, establishing a benign baseline.

  - **Correlate with related processes:** Check for simultaneous execution of known exploit tools or suspicious processes. Use Sysmon Event ID 1 to correlate any related actions or sibling processes that may indicate persistent malicious behavior.

  - **Validate file creation artifacts:** Investigate the timestamp and attributes of dump64.exe and associated logs. Confirm that it was not a legitimate deployment by a software installer, referencing installation logs or software distribution systems if available.

  ---

  ### Prioritization

  Given that this alert involves a potential bypass of critical security measures on systems where sensitive data may reside, it carries a high severity. If malicious, it could lead to serious breaches of confidentiality. The exploitation of known tools for credential dumping is a common tactic among adversaries, raising the likelihood of this behavior being weaponized.

  ---

  ### Blind Spots and Assumptions

  This detection is limited by the potential for attackers to rename other malicious binaries or use different methods of evasion, such as employing new or lesser-known tools. Required logging configurations must include detailed process creation events (Event ID 4688) and potentially Sysmon logs for deeper visibility. Legitimate software development and debugging practices may sporadically trigger this alert. Companion detections could include monitoring for unusual access to sensitive files or anomalous user activity within development directories to strengthen detection capabilities.

