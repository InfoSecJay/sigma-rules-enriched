title: File Deletion Via Del
id: 379fa130-190e-4c3f-b7bc-6c8e834485f3
status: test
description: |
  Detects execution of the builtin "del"/"erase" commands in order to delete files.
  Adversaries may delete files left behind by the actions of their intrusion activity.
  Malware, tools, or other non-native files dropped or created on a system by an adversary may leave traces to indicate to what was done within a network and how.
  Removal of these files can occur during an intrusion, or as part of a post-intrusion process to minimize the adversary's footprint.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.004/T1070.004.md
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113
date: 2022-01-15
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_flags:
    CommandLine|contains|windash:
    - ' -f'         # Force deleting of read-only files.
    - ' -s'         # Delete specified files from all subdirectories.
    - ' -q'         # Quiet mode, do not ask if ok to delete on global wildcard
  condition: all of selection_*
falsepositives:
- False positives levels will differ Depending on the environment. You can use a combination
  of ParentImage and other keywords from the CommandLine field to filter legitimate
  activity
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the built-in Windows commands `del` or `erase`, which can be leveraged by malicious actors to delete files on a system. The ability to delete files is critical for adversaries who want to eliminate traces of their activities, especially after executing intrusion tactics. By removing artifacts left behind by malware or other tools, attackers aim to obfuscate their actions, hinder forensic investigations, and ultimately reduce their footprint within the environment.

  The relevant MITRE ATT&CK techniques associated with this behavior include **T1070.004: File Deletion**, which falls under the tactic of **Defense Evasion**. Adversaries utilize these commands to delete sensitive application logs, dropped payloads, or any other files that might indicate their presence in a network. The primary data sources for detecting this activity are process creation logs, which record command-line executions and provide insights into potentially nefarious actions taken by users or services.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation events to identify executions of `cmd.exe`, focusing on command line arguments that include `del` or `erase`.
  - **Check for Flags**: Look for the usage of flags such as `-f`, `-s`, and `-q` in command line execution; these may indicate an adversary's intention to force the deletion of files quietly and recursively.
  - **Investigate Parent Processes**: Assess the parent process that initiated the `cmd.exe` execution to distinguish between legitimate system processes and potential adversary actions. Cross-reference with known benign application behavior.
  - **Correlate with Other Artifacts**: Integrate findings with other logs and telemetry sources, such as file system change logs, to ascertain whether the deleted files have any critical implications for investigation or incident response.

  ### Prioritization
  This alert is marked as low severity due to the potential for legitimate administrative actions that may involve file deletions. However, in environments with stringent compliance and audit requirements, detecting unauthorized file deletions remains important given the high impact of data loss incidents and potential risks associated with malicious file tampering.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if process creation logging is not enabled or if command line auditing is limited. The detection logic assumes that adversaries will execute the deletion commands via a command prompt, which may not cover all scenarios where files can be deleted (e.g., through scripted or automated processes). Additionally, legitimate users with administrative privileges may frequently execute file deletion commands as part of their role, which could lead to false positives without effective filtering based on context. Adequate log configurations and monitoring must be in place for this alert to be effective.

