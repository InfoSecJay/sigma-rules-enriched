title: File Deletion Via Del
id: 379fa130-190e-4c3f-b7bc-6c8e834485f3
status: test
description: |
  Detects execution of the builtin "del"/"erase" commands in order to delete files.
  Adversaries may delete files left behind by the actions of their intrusion activity.
  Malware, tools, or other non-native files dropped or created on a system by an adversary may leave traces to indicate to what was done within a network and how.
  Removal of these files can occur during an intrusion, or as part of a post-intrusion process to minimize the adversary's footprint.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.004/T1070.004.md
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113
date: 2022-01-15
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_flags:
    CommandLine|contains|windash:
    - ' -f'         # Force deleting of read-only files.
    - ' -s'         # Delete specified files from all subdirectories.
    - ' -q'         # Quiet mode, do not ask if ok to delete on global wildcard
  condition: all of selection_*
falsepositives:
- False positives levels will differ Depending on the environment. You can use a combination
  of ParentImage and other keywords from the CommandLine field to filter legitimate
  activity
level: low
note: |
  ---

  ### Technical Context

  This rule detects the execution of the Windows command line utilities "del" or "erase," which are commonly used to delete files from a system. The likely attacker objective is to eliminate evidence of their activities, such as malware or other artifacts left during intrusion. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1070.004 (File Deletion). The primary telemetry source involves process creation events captured via Windows Security Event ID 4688 or Sysmon Event ID 1, focusing on the CommandLine field to identify specific command executions. If malicious, the impact could include loss of forensic evidence and potential persistence breaches. Importantly, this detection does NOT confirm malicious intent unless correlated with additional context such as the executed process's origin or the environment's baseline behavior.

  ---

  ### Investigation Steps

  - **Verify command execution details:** Check Security Event ID 4688 or Sysmon Event ID 1 logs for the process creation event related to "cmd.exe." Look for the CommandLine field containing "del" or "erase" to identify potentially malicious execution.

  - **Assess parent process context:** Evaluate the ParentImage field in the process creation logs to identify the parent process that invoked the command. Legitimate files may be deleted by system maintenance scripts, whereas suspicious commands are often spawned by other executable files associated with malware.

  - **Scrutinize command options used:** Identify command line arguments such as "-f," "-s," or "-q" in the CommandLine field that indicate aggressive file deletion methods. High-confidence malicious deletions often leverage these flags to delete multiple files without user interaction.

  - **Look for recent file changes:** Cross-reference deleted files with recent file creation or modification events using Security Event ID 4663. Correlate the timestamps from the deletion command with file activity to determine whether they align with suspicious behaviors.

  - **Investigate the host role:** Determine the criticality of the affected asset. If the command was executed on a server or sensitive system, escalate the alert due to the potential impact on organizational security and integrity.

  - **Examine for related logs:** Validate any other telemetry that may indicate previous unauthorized activity on the machine, such as logins or process creation events leading up to the deletion, particularly looking for known malware indicators or unusual access patterns.

  ---

  ### Prioritization

  Alerts triggered by this detection should be treated with moderate urgency, particularly if they involve critical systems, as they may indicate attempts to obfuscate malicious activities. The likelihood of such behavior being weaponized is significant, especially in environments where sensitive files are present, increasing the urgency to investigate.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if command execution is obfuscated or if artifacts are swiftly removed post-execution. Settings to capture detailed process creation logs, such as enabling Sysmon, are essential for reliable detection. Legitimate administrative scripts or cleanup activities could trigger this alert, warranting a contextual review. A companion detection for file creation or modification events would enhance the investigation by establishing a complete timeline surrounding file deletions.

