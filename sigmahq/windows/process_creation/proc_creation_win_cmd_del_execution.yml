title: File Deletion Via Del
id: 379fa130-190e-4c3f-b7bc-6c8e834485f3
status: test
description: |
  Detects execution of the builtin "del"/"erase" commands in order to delete files.
  Adversaries may delete files left behind by the actions of their intrusion activity.
  Malware, tools, or other non-native files dropped or created on a system by an adversary may leave traces to indicate to what was done within a network and how.
  Removal of these files can occur during an intrusion, or as part of a post-intrusion process to minimize the adversary's footprint.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.004/T1070.004.md
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113
date: 2022-01-15
modified: 2024-03-05
tags:
- attack.stealth
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_flags:
    CommandLine|contains|windash:
    - ' -f'         # Force deleting of read-only files.
    - ' -s'         # Delete specified files from all subdirectories.
    - ' -q'         # Quiet mode, do not ask if ok to delete on global wildcard
  condition: all of selection_*
falsepositives:
- False positives levels will differ Depending on the environment. You can use a
  combination of ParentImage and other keywords from the CommandLine field to 
  filter legitimate activity
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `del` or `erase` commands used to delete files via `cmd.exe`. This behavior indicates that an adversary may be attempting to mitigate traces left by their intrusion activity, such as removing malware or artifacts created during the attack. The relevant MITRE ATT&CK tactic is “Defense Evasion” (TA0005), specifically technique T1070.004 (File and Directory Deletion).

  The primary telemetry source is Windows process creation events, focusing on logs such as Security Event ID 4688 for command execution and Sysmon Event ID 1. If malicious, this behavior can lead to a significant loss of evidence and hinder incident response efforts. Importantly, this detection does not confirm malicious actions on its own; legitimate administrative tasks may also use these commands.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for `cmd.exe` executions. Review the `CommandLine` field for parameters indicating potential hostile usage (e.g., `del`, `erase`, flags like `-f`, `-s`, or `-q`).

  - **Identify suspicious parent processes:** Analyze the `ParentImage` field associated with the detected command to determine the legitimacy of the command execution. Expect benign usage from administrative tools or maintenance scripts.

  - **Cross-verify file activity:** Access file system logs or use file integrity monitoring solutions to confirm whether the files targeted by deletion commands were indeed present and were accessible prior to the command execution.

  - **Identify high-confidence malicious indicators:** Look for patterns of rapid file deletions (multiple deletions within a short time frame) or commands executed shortly after the presence of known malware or unauthorized scripts, indicating a cover-up effort.

  - **Understand expected administrative behavior:** Legitimate deletion commands should be well-documented as part of scheduled maintenance tasks, and should not involve unusual command line arguments or be executed by non-administrative users.

  ### Prioritization

  This alert is considered low severity in typical environments, as the impact of file deletion can vary greatly depending on the affected system's role. However, the likelihood of malicious abuse exists, particularly in contexts where sensitive files could be targeted to eliminate evidence of compromise. While file deletion is a common post-exploitation task, it is often not indicative of active exploitation unless correlated with other suspicious activities.

  ### Blind Spots and Assumptions

  The primary limitations for this detection may arise from legitimate administrative actions that also involve file deletion. Additionally, the detection relies on configured log sources such as Sysmon and Security Audit logs. Legitimate backups or clean-up scripts may generate noise that could trigger false positives. Companions to this detection could include monitoring for unusual file creation events (such as Sysmon Event ID 11) to provide a fuller picture of file lifecycle management.

