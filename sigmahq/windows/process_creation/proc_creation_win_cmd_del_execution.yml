title: File Deletion Via Del
id: 379fa130-190e-4c3f-b7bc-6c8e834485f3
status: test
description: |
  Detects execution of the builtin "del"/"erase" commands in order to delete files.
  Adversaries may delete files left behind by the actions of their intrusion activity.
  Malware, tools, or other non-native files dropped or created on a system by an adversary may leave traces to indicate to what was done within a network and how.
  Removal of these files can occur during an intrusion, or as part of a post-intrusion process to minimize the adversary's footprint.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.004/T1070.004.md
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/erase
author: frack113
date: 2022-01-15
modified: 2024-03-05
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_del:
    CommandLine|contains:
    - 'del '
    - 'erase '
  selection_flags:
    CommandLine|contains|windash:
    - ' -f'         # Force deleting of read-only files.
    - ' -s'         # Delete specified files from all subdirectories.
    - ' -q'         # Quiet mode, do not ask if ok to delete on global wildcard
  condition: all of selection_*
falsepositives:
- False positives levels will differ Depending on the environment. You can use a
  combination of ParentImage and other keywords from the CommandLine field to 
  filter legitimate activity
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the built-in "del" or "erase" commands via `cmd.exe`, which adversaries may use to delete files that are remnants of their intrusion activities. This behavior is typical during the post-exploitation phase, where attackers aim to minimize their footprint and cover their tracks after other malicious actions have been completed. The relevant MITRE ATT&CK technique this rule corresponds to is Defense Evasion (T1070.004).

  The primary telemetry sources include process creation events with necessary log types being Windows Security Event ID 4688 or Sysmon Event ID 1. If successful and malicious, the deletions could obstruct forensic investigations and compromise overall security posture. However, it's important to note that this detection does not confirm malicious intent on its own, as legitimate system maintenance could invoke similar command usage by administrators or automated scripts.

  ### Investigation Steps

  - **Review process creation events:** Examine Security Event ID 4688 or Sysmon Event ID 1 to confirm the execution of `cmd.exe` and associated command lines containing "del" or "erase."

  - **Identify command parameters:** Check for flags such as `-f`, `-s`, or `-q` in the CommandLine field. The presence of these flags may indicate attempts to delete files forcefully or in quiet mode, which is often associated with malicious activity.

  - **Look for parent process relationships:** Inspect the ParentImage field. A command line executed by `cmd.exe` with a suspicious parent process (e.g., `powershell.exe`, or a known malicious binary) may signal an elevated threat level, indicating potential exploitation.

  - **Correlate with scheduled tasks or scripts:** Identify if this command execution is part of automation in batch scripts or scheduled tasks legitimate to the business environment, which might mitigate concerns.

  - **Check retention of deleted files:** If possible, verify the existence of recovery or shadow copies that could hold remnants of deleted files, which can shine light on intent and possible malware operations.

  - **Investigate user context:** Review the user account involved in executing the delete command. Anomalies such as a standard user executing these commands or execution outside of routine hours may raise red flags for further investigation.

  ### Prioritization

  This alert is of low severity in a mature enterprise SOC context due to the relatively lower impact of deleting individual files unless those files are critical. The likelihood of malicious abuse is present, particularly if combined with other suspicious activities. The behavior detected is weaponized in specific scenarios, especially tied to broader malicious practices.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through command obfuscation or scripting, which may not trigger this rule. Dependable detection relies on complete and correctly configured Sysmon or Windows Security Event logging. Furthermore, legitimate user behavior, such as routine cleanup or system maintenance, may generate similar command executions. A related companion detection would be monitoring for unusual process creations that align with this alert to further solidify incident response context.

