  ### Technical Context

  This Sigma rule detects the execution of the CreateMiniDump tool, which is commonly used to extract memory dumps from the LSASS process on Windows systems. The primary objective of an attacker utilizing this tool is to harvest sensitive credential information stored in memory, which can then be used for further exploitation, lateral movement, or persistence within a network. This behavior aligns with the MITRE ATT&CK framework’s tactic of Credential Access (TA0006) and technique T1003.001, which focuses on LSASS memory dumping.

  The primary telemetry source for this detection is Windows process creation logs, specifically looking for process creation events that involve CreateMiniDump.exe. If left unchecked, successful execution may allow an adversary to gain unauthorized access to usernames and passwords, significantly impacting the security posture of the enterprise. It is crucial to note that this detection does NOT confirm that credentials have been successfully harvested, as it only identifies the execution of the tool.

  ### Investigation Steps

  - **Review process creation logs:** Inspect Security Event ID 4688 to identify instances of CreateMiniDump.exe execution. Look for deviations in normal behavior, especially on servers or workstations where this tool should not be present.

  - **Check for recent credential dumping activity:** Correlate the timing of the CreateMiniDump.exe execution with Security Event ID 4624 (Successful Logon) to see if there are suspicious logins that align with the execution, which may indicate a successful credential theft attempt.

  - **Analyze memory dumps if available:** If applicable, check for any minidump files created as a result of the CreateMiniDump execution. Look in common temporary directories for files with .dmp extensions that match timestamps of the suspicious process creation.

  - **Cross-reference running software:** Ensure that CreateMiniDump.exe is not a legitimate component of in-house applications or authorized tools. Check against your asset/permissions inventory to confirm if any system is authorized to run this software.

  - **Identify related process trees:** Examine sibling processes and parent processes on the same host that may indicate malicious behavior, particularly any unusual parent processes that may suggest exploitation (e.g., scripts or other executables launching CreateMiniDump.exe).

  ### Prioritization

  This alert is high severity due to its association with credential theft and the potential for a compromised system to have far-reaching consequences. The likelihood of malicious abuse is significant, as tools like CreateMiniDump are often used in active attacks against enterprise environments. This behavior is commonly seen in advanced persistent threats (APTs) and other targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if the environment lacks adequate logging configurations or if process creation logging is disabled. Attackers may attempt to evade detection by renaming the tool or using other memory dumping techniques. Legitimate administrative actions, particularly those involving debugging or troubleshooting applications, may trigger this alert. Companion detections such as monitoring for suspicious `procdump.exe` activity can enhance coverage and context.

