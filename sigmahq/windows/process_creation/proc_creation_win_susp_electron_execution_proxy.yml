detection:
  selection_img:
  - Image|endswith:
              # Add more electron based app to the list
    - '\chrome.exe'
    - '\code.exe'
    - '\discord.exe'
    - '\GitHubDesktop.exe'
    - '\keybase.exe'
    - '\msedge_proxy.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\msteams.exe'
    - '\slack.exe'
    - '\Teams.exe'
  - OriginalFileName:
              # Add more electron based app to the list
    - 'chrome.exe'
    - 'code.exe'
    - 'discord.exe'
    - 'GitHubDesktop.exe'
    - 'keybase.exe'
    - 'msedge_proxy.exe'
    - 'msedge.exe'
    - 'msedgewebview2.exe'
    - 'msteams.exe'
    - 'slack.exe'
    - 'Teams.exe'
  selection_cli:
    CommandLine|contains:
    - '--browser-subprocess-path'
    - '--gpu-launcher'
    - '--renderer-cmd-prefix'
    - '--utility-cmd-prefix'
  condition: all of selection_*
falsepositives:
- Legitimate usage for debugging purposes
# Increase the level once FP rate is known better (see status)
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious command-line arguments associated with Electron applications, such as Microsoft Teams, Discord, and Slack. The identified command-line patterns may indicate an abuse of these legitimate, signed binaries to execute malicious activities through proxy mechanisms or as a conduit for other exploits. The typical attacker objective would involve leveraging trusted applications to execute code in a manner that evades traditional security measures, taking advantage of the trust granted to these widely used tools.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and could further extend to **Defense Evasion** (TA0005) due to the use of established applications for malicious intent. Specifically, techniques such as **Masquerading** (T1036) may apply, wherein malicious actors disguise their actions within legitimate software processes. Primary data sources for this detection include process creation logs that capture command-line arguments, which provide insight into how these Electron applications are being invoked on endpoints.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for suspicious instances of Electron applications launching with unusual command-line arguments. Pay particular attention to query logs that record process starts, including the command-line syntax.
  - **Analyze Application Behavior**: Check the behavior of Electron-based applications on a target endpoint. Look for atypical networking behavior or unexpected file access that would suggest exploitation or lateral movement.
  - **Investigate Parent Processes**: Assess the parent processes associated with the Electron application execution. Determine if the invocation followed typical usage patterns or if it originated from a potentially malicious parent process.
  - **Correlate with Other Security Tools**: Utilize EDR and NDR telemetry to correlate findings from the command-line analysis with network activity and endpoint behaviors, confirming or disproving suspicious activity.

  ### Prioritization
  This alert is rated as medium severity due to the potential impact of malicious activity being disguised within trusted applications. Attackers frequently exploit such trusted applications to facilitate their operations, making detection crucial for timely intervention.

  ### Blind Spots and Assumptions
  One significant blind spot is the potential for legitimate debugging operations, which may generate similar command-line patterns without malicious intent. The detection relies on the ability to capture complete process creation events, including command-line arguments; any gaps in logging or misconfigurations could lead to undetected malicious actions. Additionally, the assumption made here is that attackers will use recognizable command-line switches typical to Electron apps, which may not always be the case if they adopt alternative methods or new techniques.

