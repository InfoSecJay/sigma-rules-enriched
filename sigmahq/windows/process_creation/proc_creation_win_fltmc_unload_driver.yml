detection:
  selection_img:
  - Image|endswith: '\fltMC.exe'
  - OriginalFileName: 'fltMC.exe'
  selection_cli:
    CommandLine|contains: 'unload'
  filter_optional_avira:
    ParentImage|contains:
    - '\AppData\Local\Temp\'
    - ':\Windows\Temp\'
    ParentImage|endswith: '\endpoint-protection-installer-x64.tmp'
    CommandLine|endswith:
    - 'unload rtp_filesystem_filter'
    - 'unload rtp_filter'
  filter_optional_manageengine:
    ParentImage: 'C:\Program Files (x86)\ManageEngine\uems_agent\bin\dcfaservice64.exe'
    CommandLine|endswith: 'unload DFMFilter'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity where the filter driver is being unloaded using the `fltMC.exe` utility. Filter drivers are critical components in the Windows operating system that interact with file systems to monitor or manipulate I/O requests. Attackers may use `fltMC.exe` to unload these drivers as part of their strategy to evade defenses, particularly in ransomware or other sophisticated attacks that target file access and manipulation. The main objective of an attacker employing this technique could involve disabling security filters to facilitate malicious actions like data theft or system compromise.

  The relevant MITRE ATT&CK techniques associated with this detection include:
  - **T1562.002 - Impair Defenses: Disable or Modify Tools**: Unloading system filters can disable security mechanisms.
  - **T1070 - Indicator Removal on Host**: By unloading filters, attackers may aim to conceal their activities or ensure their malware remains undetected.

  The primary data sources for this detection include Windows process creation events (Sysmon logs) that provide insights into application behavior and command-line arguments used to invoke processes.

  ### Investigation Steps
  - **Review Sysmon Logs**: Check for any process creation events where `fltMC.exe` is being invoked. Pay particular attention to command-line arguments containing 'unload' which indicate potentially suspicious behavior.
  - **Analyze Parent Process**: Investigate the parent process of `fltMC.exe` to determine if it originated from a legitimate source or if there are signs of compromise. Analyze the paths and executables that initiated the unloading.
  - **Check for Filter Driver Integrity**: Verify the integrity and status of the filter drivers that were unloaded. Look for any unusual changes in the driver status or missing configurations that could indicate tampering.
  - **Correlate with Other Logs**: Cross-reference findings with other logs such as EDR, Firewall, and Proxy logs for any related suspicious activities that coincide with the timeline of the `fltMC.exe` command execution.

  ### Prioritization
  This alert holds medium severity due to the potential for significant impact if an attacker successfully disables security mechanisms. The likelihood of exploitation is elevated, particularly in environments targeted by ransomware and advanced persistent threats.

  ### Blind Spots and Assumptions
  There may be gaps in detection if organizations do not have Sysmon logging configured to capture process creation events, which is critical for the effectiveness of this rule. The detection logic assumes that any unloading of a filter driver via `fltMC.exe` without contextual exceptions is indeed malicious. Additionally, this detection relies on appropriate logging configurations, including command-line arguments, which must be consistently collected and retained for effective monitoring.

