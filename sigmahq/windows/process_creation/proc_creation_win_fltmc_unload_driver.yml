detection:
  selection_img:
  - Image|endswith: '\fltMC.exe'
  - OriginalFileName: 'fltMC.exe'
  selection_cli:
    CommandLine|contains: 'unload'
  filter_optional_avira:
    ParentImage|contains:
    - '\AppData\Local\Temp\'
    - ':\Windows\Temp\'
    ParentImage|endswith: '\endpoint-protection-installer-x64.tmp'
    CommandLine|endswith:
    - 'unload rtp_filesystem_filter'
    - 'unload rtp_filter'
  filter_optional_manageengine:
    ParentImage: 'C:\Program Files (x86)\ManageEngine\uems_agent\bin\dcfaservice64.exe'
    CommandLine|endswith: 'unload DFMFilter'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the unloading of filter drivers through the use of the `fltmc.exe` utility, specifically when invoked with the `unload` command. Filter drivers are commonly used to intercept and modify system calls in Windows OS, making their unloading a significant indicator of possible malicious activity. The likely attacker objective includes evading security controls, such as endpoint protection solutions. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (T1070) and technique "Indicator Removal on Host" (T1562).

  The primary telemetry source for this rule is Windows process creation logs, specifically Event ID 4688. If malicious, unloading a filter driver could allow an attacker to bypass detection mechanisms and maintain persistence. However, this detection does NOT confirm malicious intent on its own, as legitimate applications can also unload drivers.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Event ID 4688 for `fltmc.exe` initiations, focusing on the command line containing `unload`. Identify any suspicious parent processes.

  - **Investigate the parent process:** Confirm the legitimacy of the parent process spawning `fltmc.exe`. For suspicious activity, match against known benign parent images (e.g., legitimate endpoint protection installers).

  - **Analyze command line details:** Look for command line arguments associated with known harmful operations, like `unload rtp_filesystem_filter`. This can signify attempts to disable security features.

  - **Correlate with Sysmon logs:** If Sysmon is deployed, review Event ID 1 for detailed process creation logs that may provide additional context around the loading/unloading of drivers.

  - **Evaluate historical patterns:** Compare the current unloading event with historical behavior of the same system or processes to identify anomalies or repeat occurrences of unloading without valid justification.

  - **Identify legitimate activities:** Understand that temporary system maintenance or updates from trusted applications can result in unloading drivers, look for associated services running, and check documentation from those software vendors.

  ### Prioritization

  This alert has medium severity due to the potential impact on endpoint security and the likelihood that attackers could leverage this technique to evade detection. While not extremely common, the unloading of critical drivers is a method employed by sophisticated attackers, making it necessary for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate software updates or maintenance activities that also invoke `fltmc.exe`. Ensure that sysmon logging is properly configured to capture all relevant process creation details. Additionally, unexpected legitimate activities may trigger this alert, such as updates from security software that responsibly unload filters. A related detection to consider is monitoring for the loading of driver files, which can help establish a clearer picture of filter driver lifecycle events.

