title: Potential SysInternals ProcDump Evasion
id: 79b06761-465f-4f88-9ef2-150e24d3d737
status: test
description: Detects uses of the SysInternals ProcDump utility in which ProcDump or
  its output get renamed, or a dump file is moved or copied to a different name
references:
- https://twitter.com/mrd0x/status/1480785527901204481
author: Florian Roth (Nextron Systems)
date: 2022-01-11
modified: 2023-05-09
tags:
- attack.defense-evasion
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - 'copy procdump'
    - 'move procdump'
  selection_2:
    CommandLine|contains|all:
    - 'copy '
    - '.dmp '
    CommandLine|contains:
    - '2.dmp'
    - 'lsass'
    - 'out.dmp'
  selection_3:
    CommandLine|contains:
    - 'copy lsass.exe_'          # procdump default pattern e.g. lsass.exe_220111_085234.dmp
    - 'move lsass.exe_'          # procdump default pattern e.g. lsass.exe_220111_085234.dmp
  condition: 1 of selection_*
falsepositives:
- False positives are expected in cases in which ProcDump just gets copied to a different
  directory without any renaming
level: high
note: |
  ### Technical Context
  This detection rule identifies potential evasion tactics involving the SysInternals ProcDump utility, a tool frequently used by attackers to capture memory dumps of processes like LSASS (Local Security Authority Subsystem Service). The use of ProcDump can serve various purposes, including harvesting credentials as LSASS contains sensitive information. Specifically, this rule looks for instances when the ProcDump command or its output files are being renamed, copied, or moved, which may indicate an attempt to obscure malicious intents.

  In the threat landscape, attackers leveraging ProcDump aim to execute credential theft or maintain persistence by stealthily extracting credentials from memory. This is aligned with the MITRE ATT&CK techniques of **T1036** (Masquerading), which involves disguising malicious activities to evade detection, and **T1003.001** (Credential Dumping: LSASS Memory), focusing on extracting sensitive information from LSASS memory.

  To effectively detect these types of activities, primary data sources include **process creation events** that log command line arguments, enabling the identification of unusual ProcDump usage patterns and renaming activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events from EDR or SIEM for any instances of ProcDump being executed. Look specifically for command lines that include `copy procdump`, `move procdump`, or references to `lsass` and `.dmp` file extensions.
  - **Analyze File Activity**: Investigate file system logs or monitoring solutions that capture file operations to identify any suspicious renaming, copying, or movement of dump files (e.g., files following the naming convention `lsass.exe_*`).
  - **Check for Anomalous User Activity**: Correlate any identified ProcDump activity with user behavior, focusing on accounts with unusual privilege levels and any recent authentication events that could suggest unauthorized access.
  - **Enhance Visibility on Standard Tools**: Ensure that logging is configured to include detailed command line arguments for all processes on endpoints, as this will enhance capabilities for detection and alerting around tools like ProcDump.

  ### Prioritization
  Given the high potential impact associated with credential theft and defense evasion tactics, this alert is rated as high severity. The likelihood of misuse in compromise scenarios and the sensitive nature of the data involved necessitate quick response and investigation.

  ### Blind Spots and Assumptions
  This detection may suffer from gaps in coverage, particularly in environments where the logging of command line arguments is not thoroughly enabled or configured. Furthermore, the detection logic assumes that the standard patterns of ProcDump and its outputs are being used; unusual or custom naming schemes could evade detection. Without proper file monitoring, cases where dump files are merely moved without renaming may not be captured. Required logs for effective alerting include detailed process creation logs and file activity logs reflecting rename and copy commands.

