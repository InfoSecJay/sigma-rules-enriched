title: Potential SysInternals ProcDump Evasion
id: 79b06761-465f-4f88-9ef2-150e24d3d737
status: test
description: Detects uses of the SysInternals ProcDump utility in which ProcDump
  or its output get renamed, or a dump file is moved or copied to a different 
  name
references:
- https://twitter.com/mrd0x/status/1480785527901204481
author: Florian Roth (Nextron Systems)
date: 2022-01-11
modified: 2023-05-09
tags:
- attack.stealth
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - 'copy procdump'
    - 'move procdump'
  selection_2:
    CommandLine|contains|all:
    - 'copy '
    - '.dmp '
    CommandLine|contains:
    - '2.dmp'
    - 'lsass'
    - 'out.dmp'
  selection_3:
    CommandLine|contains:
    - 'copy lsass.exe_'          # procdump default pattern e.g. lsass.exe_220111_085234.dmp
    - 'move lsass.exe_'          # procdump default pattern e.g. lsass.exe_220111_085234.dmp
  condition: 1 of selection_*
falsepositives:
- False positives are expected in cases in which ProcDump just gets copied to a 
  different directory without any renaming
level: high
note: |
  ### Technical Context

  This rule detects actions related to the SysInternals ProcDump utility, specifically focusing on cases where ProcDump or its generated dump files are renamed, moved, or copied. An attacker may utilize ProcDump to extract sensitive process memory (e.g., LSASS) for credential harvesting or to pivot within a compromised environment. This behavior aligns with the MITRE ATT&CK techniques for credential access (T1003.001) and stealth (T1036).

  The primary telemetry sources include process creation events captured via Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to significant security breaches, including theft of credentials or sensitive data from memory. However, it is crucial to note that this detection does NOT confirm that credentials were successfully harvested or that the dump file was maliciously used.

  ### Investigation Steps

  - **Check process creation logs for ProcDump activity:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where ProcDump or commands such as 'copy procdump' or 'move procdump' appear.

  - **Analyze command line arguments:** Look for command lines containing '.dmp' along with references to 'copy' or 'move', specifically composite strings like 'copy lsass.exe_' and 'move lsass.exe_', indicating potential attempts to relocate sensitive dump files.

  - **Verify timestamps and source directories:** Cross-reference timestamp and paths in the event with legitimate processes where ProcDump might have been used, for instance, system support activities or maintenance scripts running on server-grade assets.

  - **Identify benign usage scenarios:** Understand normal administrative practices where ProcDump may be legitimately invoked for troubleshooting or performance analysis, determining if any occurrences align with this context.

  - **Look for malicious indicators of compromise:** High-confidence malicious indicators include frequent command line variations with 'lsass' in suspicious paths (e.g., %TEMP%), especially if unusual Windows process creation events align with abnormal user activity.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential for significant impact, particularly regarding sensitive credential exposure. The behavior is commonly weaponized during targeted attacks, making swift investigation critical in enterprise environments.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate use of ProcDump in administrative tasks, which could generate false positives when dump files are moved without renaming. Reliability hinges on proper configurations to ensure detailed process creation logging is enabled. Additionally, similar action patterns could occur during standard operational processes, such as system debugging, or legitimate software installations. A related detection for monitoring direct access or administrative usage of LSASS should complement this coverage.

