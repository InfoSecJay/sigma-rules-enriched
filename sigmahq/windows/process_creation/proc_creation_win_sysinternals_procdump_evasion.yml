title: Potential SysInternals ProcDump Evasion
id: 79b06761-465f-4f88-9ef2-150e24d3d737
status: test
description: Detects uses of the SysInternals ProcDump utility in which ProcDump
  or its output get renamed, or a dump file is moved or copied to a different 
  name
references:
- https://twitter.com/mrd0x/status/1480785527901204481
author: Florian Roth (Nextron Systems)
date: 2022-01-11
modified: 2023-05-09
tags:
- attack.defense-evasion
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - 'copy procdump'
    - 'move procdump'
  selection_2:
    CommandLine|contains|all:
    - 'copy '
    - '.dmp '
    CommandLine|contains:
    - '2.dmp'
    - 'lsass'
    - 'out.dmp'
  selection_3:
    CommandLine|contains:
    - 'copy lsass.exe_'          # procdump default pattern e.g. lsass.exe_220111_085234.dmp
    - 'move lsass.exe_'          # procdump default pattern e.g. lsass.exe_220111_085234.dmp
  condition: 1 of selection_*
falsepositives:
- False positives are expected in cases in which ProcDump just gets copied to a 
  different directory without any renaming
level: high
note: |
  ### Technical Context

  This Sigma rule detects usage of the SysInternals ProcDump utility where either the utility itself or its output dump files are renamed or moved, which is commonly indicative of an adversary attempting to exfiltrate credential information—often from LSASS (Local Security Authority Subsystem Service). The likely attacker objective here is credential harvesting, aiming to capture sensitive information stored in the LSASS process. This behavior aligns with the MITRE ATT&CK techniques of Defense Evasion (T1036) and Credential Access (T1003.001).

  The primary telemetry sources are Windows process creation logs, particularly Event ID 4688, with a focus on CommandLine parameters. If this activity is malicious, it poses a significant security risk, as it can lead to unauthorized access to credentials. Importantly, this detection does NOT on its own confirm that a successful exfiltration of credentials has occurred; it simply indicates the potential misuse of ProcDump.

  ### Investigation Steps

  - **Review command line activity:** Focus on Event ID 4688 logs for any instances where `procDump` or associated dump files are moved or renamed. Legitimate usage of ProcDump will often have command lines without additional copy or move commands.

  - **Identify high-risk process involvement:** Check for any instances with CommandLine fields containing `lsass.exe` within the same log entry. The use of `lsass.exe` suggests potential credential harvesting activity, especially if associated with a dump file (e.g., `lsass.exe_*.dmp`).

  - **Cross-reference user context:** Validate the user account executing the ProcDump command by examining logons (via Event ID 4624). Confirm if the account is a standard user or part of privileged groups; unexpected usage by low-privilege accounts indicates potential compromise.

  - **Search for duplicate dumps:** Examine the filesystem for any newly created or renamed .dmp files, especially in directories atypical for legitimate activities (like `C:\Windows\Temp\`). Use File Creation timestamps to detect anomalous activity within sensitive areas.

  - **Look for ProcDump in script use:** Investigate logs for batch scripts or PowerShell commands where `procDump` might be invoked. Scripts can often obfuscate intent, and legitimate automated tasks typically would not rename files repeatedly.

  ### Prioritization

  This alert should be considered high severity due to the sensitive nature of credential exfiltration from LSASS, the potential impact on system integrity, and the commonality of the technique being weaponized by attackers. Systems compromised in this manner can lead to significant breaches involving further lateral movement or escalation.

  ### Blind Spots and Assumptions

  This rule may have evasion limitations if attackers use other mechanisms to dump LSASS without utilizing ProcDump or if they obfuscate their command line entries. Ensure that process creation logs are adequately configured to capture detailed command line arguments for reliable detection. Legitimate administrative activities, such as routine debugging or system diagnostics, may trigger this alert. A companion detection rule for direct LSASS access attempts (via credential dumping techniques) would strengthen overall coverage.

