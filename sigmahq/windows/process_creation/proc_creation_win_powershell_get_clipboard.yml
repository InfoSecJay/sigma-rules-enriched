note: |
  ### Technical Context
  This detection rule targets the usage of the PowerShell `Get-Clipboard` cmdlet when invoked from the command line interface (CLI). The presence of this command can indicate potential data exfiltration activities or lateral movement tactics employed by attackers to harvest sensitive information from the clipboard. Attackers often leverage such commands in conjunction with other tools or scripts to manipulate data within compromised systems.

  The probable threat scenario involves an adversary with access to the target system, executing commands to gather sensitive information that might have been copied to the clipboard, which can include passwords, tokens, or sensitive data. This behavior aligns with MITRE ATT&CK techniques such as **Data from Information Repositories (T1115)** and indicates a focus on the **Collection** tactic, where the goal is to gather and steal data for later use.

  Primary data sources that provide critical evidence for this detection include `Process Creation` logs and `Windows Event Logs`, which can capture the command-line arguments associated with executed processes, thus identifying potentially malicious uses of PowerShell cmdlets.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for occurrences of `Get-Clipboard` being executed. Pay close attention to the context in which this command was run, including user identity and associated scripts or processes.

  - **Analyze User Behavior:** Investigate the user associated with the command execution. Check if their activity aligns with their normal behavior patterns, and whether any sign of privilege escalation or account compromise is evident.

  - **Correlate with Other Activities:** Look for concurrent activities or related processes that could indicate malicious behavior, such as file transfers or other PowerShell commands that are often used in exfiltration scenarios.

  - **Collect Clipboard Data Context:** If feasible, gather information about the contents that may have been in the clipboard prior to the command execution. This may require looking into application logs or memory analysis to ascertain what sensitive data may have been leveraged.

  ### Prioritization
  The alert is categorized with medium severity due to the potential impact of data exfiltration, which can lead to command loss, identity theft, or unauthorized access to sensitive information. Given the likelihood of misuse, it demands timely attention and investigation in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in coverage depending on the visibility into PowerShell execution or if process creation logs are not adequately collected across all endpoints. The detection logic assumes that command-line arguments are logged consistently and that no obfuscation techniques were employed by the attacker to disguise their activities. Additionally, the alert's effectiveness hinges on having proper logging configurations enabled for PowerShell and corresponding events in capture, alongside comprehensive visibility into user activity.

