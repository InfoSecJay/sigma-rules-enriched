  ---

  ### Technical Context

  This rule detects the execution of the PowerShell command `Get-Clipboard`, which is typically used to access clipboard data on a Windows machine. An adversary may utilize this functionality to extract sensitive information from the clipboard, such as credentials or tokens, aiming to achieve data exfiltration or lateral movement in the network.

  This behavior aligns with the MITRE ATT&CK framework under the **Collection** tactic (TA0009) and the technique **Clipboard Data** (T1115). The primary telemetry source for this detection is Windows process creation logs, specifically monitoring command-line arguments through Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it could signify unauthorized access to sensitive data, particularly if it follows other suspicious activities; however, it does NOT confirm malicious intent without additional context or corroborating suspicious actions.

  ---

  ### Investigation Steps

  - **Review process creation details:** Check Event ID 4688 (Windows Security logs) for the execution of `powershell.exe` or `pwsh.exe` with the `Get-Clipboard` command. Look for the user account associated with this execution; if it corresponds to an administrative account or one with elevated privileges, escalate the investigation.

  - **Correlate with user activity:** Investigate the user's recent activity by reviewing Event ID 4624 (Logon events) and verifying if the account was engaged in legitimate clipboard-related operations, such as document editing or data retrieval where clipboard access is expected.

  - **Inspect command line context:** Analyze the command line arguments provided in the logs. Legitimate usage may include scenarios where users are working with data-pasting workflows, whereas the presence of unusual contexts or high frequencies of `Get-Clipboard` may indicate malicious behavior.

  - **Look for subsequent actions:** Monitor for any command execution immediately following `Get-Clipboard`; for example, if this command precedes activities such as network connections or file transfers, particularly over non-standard ports or to unrecognized IPs, this strengthens the case for an attack.

  - **Identify high-confidence Indicators of Compromise (IoCs):** Search for anomalous script executions or processes associated with `Get-Clipboard` in Sysmon logs (Event ID 1) that appear out of the ordinary, such as being run from locations that are not typically used for user scripts (e.g., non-user directories).

  ---

  ### Prioritization

  This alert is deemed medium severity due to the potential for significant impact on data confidentiality if the clipboard contains sensitive information. While the likelihood of this command being misused exists, it will depend on the user’s behavioral patterns and context. This command is not commonly weaponized on its own but could accompany other malicious activities, warranting closer inspection.

  ---

  ### Blind Spots and Assumptions

  The detection may miss legitimate uses of `Get-Clipboard`, particularly during normal user interactions, making it important to analyze the context. Evasion techniques could involve the use of different command line syntax or PowerShell obfuscation methods to avoid detection. Reliable detection requires that process creation logs are adequately captured, and companion detections related to other data exfiltration techniques, such as PowerShell script anomalies (e.g., execution of `Invoke-WebRequest`), can enhance coverage against inline threats.

