note: |
  ### Technical Context
  This detection rule identifies the execution of IOX, a tool commonly utilized for port forwarding and setting up intranet proxies. IOX can be leveraged by malicious actors to create tunneling sessions that allow them to bypass network controls, facilitating unauthorized access to internal resources. Attackers may use IOX to establish covert communication channels for command and control purposes, or to exfiltrate data from compromised systems.

  The rule aligns with the MITRE ATT&CK framework, particularly under the tactics of Command and Control (ID: TA0011) and the technique of Application Layer Protocol (ID: T1090). By monitoring for the specific malicious command-line arguments associated with IOX, security teams can detect potential misuse of the tool in their environments.

  Primary data sources include Windows process creation events, which offer critical visibility into what applications are running on endpoints. Additionally, logs detailing command-line arguments can provide further insights into the specific functionalities of IOX being utilized, such as port forwarding or proxying activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify instances of `iox.exe` execution, focusing on anomalies or unauthorized use patterns that deviate from typical operational behavior.
  - **Analyze Command-Line Parameters:** Look for specific command-line arguments that include `.exe fwd -l`, `.exe fwd -r`, `.exe proxy -l`, and `.exe proxy -r`. These indicators provide insight into how the tool is being used and for what purposes.
  - **Check for Known Hashes:** Cross-reference any detected instances of IOX with the specified hash values (MD5, SHA1, SHA256) in the alert to confirm the integrity and origin of the executable being executed.
  - **Investigate Network Traffic Logs:** If available, review network logs for unusual outbound connections or traffic patterns originating from the host running IOX, as this may indicate unauthorized tunneling or data exfiltration attempts.

  ### Prioritization
  The alert's severity is classified as high due to the potential for IOX to enable bypassing security measures and facilitate malicious command and control activities. The likelihood of exploitation increases in environments where internal network controls are lax or improperly configured.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage with this rule. It may not flag instances of IOX used for legitimate administrative purposes, leading to possible false positives. The detection logic assumes that all instances of `iox.exe` execution represent malicious activity, which may not always be the case. Additionally, the alert requires comprehensive process creation logging to function effectively; any gaps in this logging could lead to missed detections. Organizations should ensure that process monitoring is enabled and that they maintain a complete inventory of authorized applications to better contextualize detections.

