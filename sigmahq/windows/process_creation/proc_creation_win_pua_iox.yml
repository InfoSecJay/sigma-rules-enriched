note: |
  ### Technical Context

  This Sigma rule detects the execution of IOX, a tool commonly used for port forwarding and intranet proxying, which can be exploited by adversaries for command and control (C2) communication. The likely attacker objective is to establish covert communication channels to bypass security controls and facilitate further exploitation within the network. This behavior is relevant to the MITRE ATT&CK framework, specifically for the tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1090).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 (Process Creation). The security impact of successful malicious use includes the potential for unauthorized data exfiltration or remote access by attackers. Importantly, detection of the IOX tool execution does not confirm malicious intent on its own, as it can also be utilized for legitimate purposes.

  ### Investigation Steps

  - **Identify the process creation event:** Review Security Event ID 4688 for new processes with the image path ending in `\iox.exe`. Note legitimate uses may include internal testing or development by network engineers.

  - **Examine command line arguments:** Check the CommandLine field in Event ID 4688 for arguments containing `fwd -l`, `fwd -r`, `proxy -l`, or `proxy -r`. Malicious indicators include the use of these arguments for unusual port forwarding set-ups that do not align with known internal applications or services.

  - **Verify file hashes:** Cross-reference the process hashes against known malicious signatures. The MD5 `9DB2D314DD3F704A02051EF5EA210993`, SHA1 `039130337E28A6623ECF9A0A3DA7D92C5964D8DD`, and SHA256 `C6CF82919B809967D9D90EA73772A8AA1C1EB3BC59252D977500F64F1A0D6731` should be flagged for high-confidence malicious indicators.

  - **Investigate network connections:** Analyze network logs (e.g., Windows Filtering Platform, or WFP) for unusual outbound connections originating from the system running `iox.exe`. Malicious activity may show connections to unknown IPs or unusual ports not associated with normal organizational traffic.

  - **Check for concurrent activity:** Look for other processes that initiate around the same time as the observed `iox.exe`, especially those engaging in unusual network activities or communicating with known bad IPs, which could indicate a coordinated attack.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical systems, as IOX can facilitate data exfiltration or remote access by threat actors. Given that tools like IOX are often weaponized to bypass security controls, organizations should prioritize investigating these alerts.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate users to have installed IOX for valid purposes, leading to false positives. Dependencies on sufficient logging configuration for process creation events must be ensured to achieve reliable detection. Common legitimate activities could involve internal applications requiring tunneling for remoting tasks. Companion detections related to network traffic anomalies or other C2 indicators can strengthen the overall monitoring effectiveness of potential IOX misuse.

