note: |
  ### Technical Context

  This Sigma rule detects attempts to modify the Windows registry through VBScript, specifically using methods like `CreateObject("Wscript.shell")` and `RegWrite`. This behavior often indicates an attacker’s effort to establish persistence on a compromised system while bypassing detection mechanisms typically focused on traditional registry modification tools, such as `regedit.exe`.

  The likely attacker objective is to ensure that malicious software is executed upon system startup or user logon by modifying registry keys without raising alarms from standard security protocols. The relevant MITRE ATT&CK tactics include Persistence (T1547) and Execution (T1059.005). The primary telemetry source is process creation logs, with key Event IDs being 4688 for Windows Security and Sysmon Event ID 1 for detailed process creation data.

  If successfully executed, this type of modification can lead to persistent malware residing in the system, which is a significant security threat. However, this detection does NOT confirm that malicious activity has occurred, as legitimate administrative actions using VBScript might trigger similar alerts.

  ### Investigation Steps

  - **Examine the Process Creation Log:** Look for Security Event ID 4688 or Sysmon Event ID 1. Check command line details for the presence of `CreateObject`, `Wscript.shell`, and `.RegWrite`. Confirm if these commands originate from uncommon or suspicious parent processes.

  - **Identify High-Confidence Malicious Indicators:** If the command line arguments include attempts to modify sensitive registry branches (e.g., `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`), correlate with known malware signatures. Investigate any base64 or obfuscated scripts indicative of advanced threats.

  - **Review Solutions for Benign Activity:** Validate if the user executing the script is a legitimate IT administrator performing system configurations. Review typical behavior, such as scheduled tasks created via trusted management tools rather than VBS.

  - **Correlate Against Other Logs:** Analyze script execution frequency and associated logins to identify patterns. Use PowerShell logs (Event ID 4104) to find if related scripts have been executed that could indicate a coordinated attack.

  - **Check for File Artifacts:** Validate the presence or modification timestamps of script files in the user profile, particularly in directories such as `C:\Users\[Username]\AppData\Local\Temp` or startup folders. Document any unusual file creation that coincides with the detected event.

  - **Evaluate Asset Criticality:** Consider the role of the affected host (e.g., domain controllers, workstations) to prioritize the response. High-value targets may warrant immediate isolation and a deeper forensic investigation.

  ### Prioritization

  The severity of this alert is medium, as registry modifications can have significant impacts on the affected system's security posture. The likelihood of malicious exploitation is moderate, given that this method can be used by both attackers and legitimate administrators, but the behavior is often associated with persistent threats in the enterprise environment.

  ### Blind Spots and Assumptions

  The detection may miss sophisticated attempts where custom or modified scripts are used that do not clearly invoke `Wscript.shell`. Misconfigured event logging may also lead to gaps in visibility; ensure that both process creation and script execution logs are fully enabled. Additionally, legitimate administrative activities may falsely flag this detection, such as scheduled tasks or legitimate automation scripts using VBScript. A companion detection for anomalous PowerShell script executions could strengthen this rule's coverage against a broader range of attack vectors.

