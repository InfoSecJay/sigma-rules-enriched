note: |
  ### Technical Context

  This Sigma rule detects attempts to modify the Windows registry using VBScript's CreateObject method to instantiate a WScript.Shell object combined with RegWrite commands. The likely attacker objective is to establish persistence by manipulating the registry without triggering traditional detection mechanisms associated with tools like regedit.exe or reg.exe. This behavior aligns with MITRE ATT&CK tactics, specifically "Defense Evasion" (T1562) and "Persistence" (T1112), as well as "Execution" through scripting (T1059.005).

  The primary telemetry source for this detection is process creation logs, specifically focusing on command line arguments. If successful, this attack could lead to the alteration of registry entries that can autonomously execute malicious payloads upon system startup. It is crucial to note that the detection of this behavior does NOT confirm the malicious intent on its own; further context is required to determine the legitimacy of the action.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for processes with command line arguments containing 'CreateObject', 'Wscript.shell', and '.RegWrite'. Note instances where these terms are present in legitimate user scripts.

  - **Identify high-confidence malicious indicators:** Look for execution patterns of common LOLBINs (Living Off the Land Binaries) such as 'wscript.exe' or 'cscript.exe'. Cross-reference process parents for suspicious execution contexts or unexpected parent processes.

  - **Assess registry modifications:** Use tools like Regedit or command line checks (e.g., `reg query`) to review any recent modifications to key registry locations (e.g., HKCU\Software\Microsoft\Windows\CurrentVersion\Run). Document any anomalous entries that may correspond with the detected behavior.

  - **Compare against known good configurations:** Establish a baseline of typical registry entries and creation times. Look for deviations in timestamps or entries correlated with the alert. Legitimate applications like automated update scripts may create similar registry entries.

  - **Review user activity:** Investigate user actions related to the triggering system, including recent logged activities or scheduled tasks, to contextualize the use of scripts. Identify any previous instances when the user executed scripts involving WScript.

  ### Prioritization

  This alert carries medium severity due to its potential impact on system integrity if malicious. The likelihood of abuse is elevated, given that the behavior is characteristic of persistence mechanisms commonly employed by attackers. While this specific script invocation may not be highly weaponized, it is indicative of recon activity preceding likely exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques utilizing obfuscation or alternative scripting languages. The reliability of detection hinges on logging configurations for processes, specifically ensuring that CommandLine details are captured. Legitimate administrative tasks or trusted applications may legitimately trigger this alert, necessitating careful review of user intent. A related detection to reinforce coverage involves monitoring for direct registry modifications via traditional methods, such as Event ID 4657 (Registry Value Modified).

