note: |
  ### Technical Context
  This detection rule identifies attempts to modify the Windows registry using VBScript, specifically leveraging the `CreateObject("Wscript.shell")` and `RegWrite` methods. This behavior is notable because threat actors often seek to manipulate the registry for persistence mechanisms while avoiding detection by conventional security tools that monitor direct interaction with registry modification utilities like `regedit.exe` and `reg.exe`. The intent behind this activity typically aligns with maintaining access or executing malware in the system through less-obvious means.

  The common attacker objectives, in this case, are to create persistence layers that can ensure malware or unauthorized access remains after a system reboot or user intervention. As part of this threat, the techniques employed primarily align with MITRE ATT&CK's tactics of **Defense Evasion (T1070)** and **Persistence (T1547)**, along with **Execution (T1059.005)** which specifically focuses on scripting languages like VBScript. The primary data source for these detections will be process creation events that capture command-line arguments, allowing security teams to identify unauthorized registry manipulation attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for process creation events that include command lines containing `CreateObject`, `Wscript.shell`, and `.RegWrite`. Cross-reference these against known benign processes to filter out false positives.

  - **Correlate with Related Events**: Look for related events in the timeline that show other scripting activity or unusual command execution to ascertain if the registry modification attempt is part of a more extensive attack surface.

  - **Investigate Registry Changes**: Check the registry for recent changes made around the same time as the process activity to see which keys were altered, especially under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run` or similar locations.

  - **Analyze User Context**: Determine the user context under which the script was executed. Investigate whether the user has sufficient privileges for making these changes and verify if this activity aligns with the user’s known behavior.

  ### Prioritization
  The alert's severity is considered medium due to the potential impact of unauthorized registry modifications that can lead to persistent threats. Given that the detection logic targets a method commonly used by threat actors, timely response can help mitigate the risk of escalated intrusions.

  ### Blind Spots and Assumptions
  This detection might miss modifications made through other legitimate programming interfaces or tools that do not rely on VBScript. Additionally, if logs are not adequately collected or if process creation logging is disabled, this alert will not function as intended. Assumptions include that the detection environment employs comprehensive logging and there are no significant obfuscation techniques in use that could bypass these detections. Continuous improvement and monitoring are essential to adapt to evolving evasion tactics.

