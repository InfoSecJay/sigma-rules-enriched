note: |
  ### Technical Context

  This Sigma rule detects the invocation of the `tscon.exe` utility with a command-line argument indicative of an RDP session redirect. Attackers may utilize this to hijack existing Remote Desktop Protocol (RDP) sessions, allowing unauthorized access to systems, potentially with elevated privileges. This behavior aligns with the MITRE ATT&CK techniques for lateral movement and remote access: **T1021.001 (Remote Services: RDP)** and **T1563.002 (Remote Services: External Remote Services)**.

  Primary telemetry sources include Windows process creation events (Security Event ID 4688 and Sysmon Event ID 1), as they log command-line arguments and process behavior. A successful RDP session hijack can lead to significant security incidents, including data exfiltration or system control. However, this detection does NOT confirm the compromise of a system or successful access by the attacker without corroborating evidence of session hijacking or unauthorized account usage.

  ### Investigation Steps

  - **Check security event logs for process creation**: Look for Security Event ID 4688 or Sysmon Event ID 1 indicating `tscon.exe` execution. Examine the command line for `/dest:rdp-tcp#` to confirm malicious intent.

  - **Correlate user sessions**: Validate known active RDP sessions via "quser" command results to determine if any legitimate users are affected or if session redirection is anomalous. This aids in differentiating between benign and suspicious activity.

  - **Investigate account activity**: Review account logs (Event ID 4624) for suspicious logons that coincide with the `tscon.exe` execution time. Look for unusual patterns like logons from unfamiliar IP addresses or outside normal working hours.

  - **Analyze the network activity**: Check for unusual remote access connections (e.g., through firewall logs, Event ID 5156) or endpoint connections made post-redirection, indicative of potential exploitation.

  - **Assess host criticality and asset value**: Identify the affected system's role (e.g., server, workstation) and the sensitivity of the data it handles. Higher criticality systems may warrant immediate containment or remediation actions.

  - **Review RDP settings and configurations**: Monitor for any changes in RDP settings (Event ID 4648 for explicit credential usage when connecting) that could signal attempts to exploit RDP vulnerabilities.

  ### Prioritization

  This alert is classified as high severity, as it implicates potential unauthorized access to critical systems via session hijacking, which has a high likelihood of exploitation among intruders. Given the common usage of RDP in enterprise environments, there is a significant risk that attackers may exploit this behavior for lateral movement across networks.

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers utilize alternative remote access tools to exploit RDP, as not all malicious activity will invoke `tscon.exe`. Reliable detection requires thorough logging configuration for process creation and authentication events. Legitimate scenarios, such as administrative tasks involving RDP session management by authorized personnel, may inadvertently trigger the alert. Companion detections like monitoring for `Event ID 4776 (Computer Account Logon)` can provide additional context for analyzing suspicious credential usage.

