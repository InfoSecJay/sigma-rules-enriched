  ### Technical Context
  This detection rule is designed to identify suspicious activity related to Remote Desktop Protocol (RDP) session redirection through the use of the `tscon.exe` utility. The `tscon.exe` command allows users to connect to an existing RDP session, which could be exploited by attackers to hijack sessions and gain unauthorized access to sensitive systems. The rule specifically looks for command line arguments that suggest an RDP session is being redirected, indicating a potential lateral movement tactic employed by adversaries.

  The threat scenario here likely involves an attacker who has either compromised a user's credentials or gained access to a legitimate system through other means (e.g., phishing, exploitation). Their objective may be to leverage the hijacked session to maintain persistence, escalate privileges, or move laterally within the network to sensitive resources. This behavior correlates with the MITRE ATT&CK techniques of "Remote Service Session Hijacking" (T1563.002) and "Remote Desktop Protocol" (T1021.001).

  Primary data sources for detecting such activity include process creation events, which log command line activity, enabling immediate identification of potential misuse of tools such as `tscon.exe`. Additionally, analysis of user account activity and RDP connection logs can provide supplementary insights into session hijacking incidents.

  ### Investigation Steps
  - **Review Command Line Arguments:** Check the command line associated with `tscon.exe` executions, particularly those containing ` /dest:rdp-tcp#`, to identify potential hijacked sessions.
  - **Analyze Process Creation Logs:** Investigate process creation logs to correlate the execution of `tscon.exe` with the respective user and system events, ensuring they align with normal user behavior.
  - **Monitor RDP Connection Logs:** Evaluate logs related to RDP connections for any unexpected or unauthorized session redirection or unusual IP addresses linked to these sessions.
  - **Inspect User Account Activity:** Examine user account activity and audit logs for any suspicious logins or session activity related to potentially compromised accounts.

  ### Prioritization
  This alert should be prioritized as high severity due to the significant impact of unauthorized access through RDP session hijacking. The likelihood of exploitation is raised in environments where RDP is widely utilized, particularly when access controls and monitoring are insufficient.

  ### Blind Spots and Assumptions
  There may be blind spots in this detection logic if legitimate administrative activities involving `tscon.exe` are not properly logged or if user behavior variances are not accounted for. The detection assumes that the command line structure and usage patterns remain consistent; variations in legitimate use may lead to false negatives. Additionally, the rule requires comprehensive process creation logs to effectively capture the execution details necessary for detection to function optimally.

