  ---

  ### Technical Context

  This Sigma rule detects the execution of `tscon.exe` with a command line argument that specifies a terminal session ID redirecting a Remote Desktop Protocol (RDP) session. This behavior may indicate an attacker’s objective of hijacking an active RDP session, likely to gain unauthorized access to a remote desktop session, exploit user credentials, or pivot further into the network. The relevant MITRE ATT&CK techniques include "Lateral Movement" (TA0008) and "Remote Services" (T1021.001) as well as "Exploitation of Remote Services" (T1563.002).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing the command line arguments of running processes. The security impact of a successful hijack can lead to unauthorized administrative access, potential data exfiltration, and control over critical systems. However, this detection does NOT confirm whether malicious intent exists without additional context, such as user behavior or normal operational patterns.

  ---

  ### Investigation Steps

  - **Check relevant process logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `tscon.exe`. Look for command line arguments containing `/dest:rdp-tcp#`, indicating a redirect attempt.

  - **Identify recent RDP session activity:** Look at Event ID 4624 (logon events) to verify if the user had an active RDP session prior to the execution of `tscon.exe`. A legitimate sequence typically includes a connection followed by standard usage patterns.

  - **Examine user account context:** Validate whether the user account executing `tscon.exe` has administrative privileges. Elevated privileges increase the likelihood of malicious activity.

  - **Correlate with network activity:** Check firewall or network proxy logs for unusual outbound connections immediately following the `tscon.exe` invocation, particularly to unfamiliar IP addresses or ports, indicating potential data exfiltration.

  - **Monitor for related alerts:** Look for other suspicious events or alerts in proximity to this alert, such as unauthorized logins (Event ID 4625) or anomalous account usage patterns. This can provide further contextual understanding of the incident.

  - **Assess system criticality:** Determine if the affected system is critical (e.g., domain controllers or financial servers) that could further escalate risks if compromised.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems through RDP session hijacking. The likelihood of malicious abuse is significant, as RDP is frequently targeted by adversaries for lateral movement and exploitation strategies. This technique is commonly weaponized in real-world attacks.

  ---

  ### Blind Spots and Assumptions

  Detecting execution of `tscon.exe` does not inherently confirm malicious activity, as legitimate administrative actions may trigger this alert. Additionally, detection can be limited by logging configurations; ensure that both process creation and remote desktop logs are adequately collected.  Legitimate activities, such as authorized remote administrative tasks, may also lead to this alert being triggered. A related detection to strengthen coverage would include monitoring for unauthorized RDP logon attempts (Event ID 4625).

