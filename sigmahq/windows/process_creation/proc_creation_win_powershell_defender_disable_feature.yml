note: |
  ### Technical Context

  This Sigma rule detects attempts to disable Microsoft Defender features via PowerShell commands, specifically through cmdlets like `Set-MpPreference` and `Add-MpPreference`. The likely attacker objective is to evade detection and persistence mechanisms by reducing the host's security posture. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1562.001). Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, which capture command-line activities. If successful, a malicious actor could compromise the integrity of endpoint security measures, leading to increased vulnerability to malware and other attacks. It is important to note that this detection does NOT confirm malicious intent on its own, as benign administrative actions could trigger similar alerts.

  ### Investigation Steps

  - **Review command line inputs:** Check Event ID 4688 for instances of `Set-MpPreference` or `Add-MpPreference`. Look for any use of the parameters like `-DisableRealtimeMonitoring $true`, as they indicate potential malicious intent.

  - **Validate legitimate activity:** Corroborate alerts against known administrative actions. Investigate if users with elevated privileges routinely modify Defender settings, and confirm expected PowerShell usage patterns, such as scheduled maintenance tasks or security updates.

  - **Inspect context of execution:** Confirm the user session and process owner for the process creation logs. Look for unusual user accounts executing these commands, as legitimate administrators typically handle Defender configurations.

  - **Gather additional telemetry:** Query Sysmon logs for Event ID 1 to identify specific execution paths and parent-child process relationships. Malicious actions often stem from a suspicious parent process or sudden and isolated use of the PowerShell cmdlet by a standard user.

  - **Identify encoded commands:** Look for unusual Base64 encoded commands in Event ID 4688. Commands like `RABpAHMAYQBiAGwAZQBJ` that decode to PowerShell commands disabling security features may indicate obfuscation attempts and should raise concerns.

  - **Cross-check against threat intelligence:** Use external threat intelligence sources to identify if the involved command patterns are associated with known threat actor activities or malware that leverage such techniques to disable endpoint protections.

  ### Prioritization

  This alert is of high severity due to its potential impact on endpoint defenses and the likelihood of malicious abuse. The behavior captured is not only specific to advanced adversaries but is also a common tactic associated with many malware families.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques such as using different cmdlet names or altered PowerShell syntax to disable Defender features. Comprehensive logging of PowerShell activities is critical for reliable detection; ensure that logging is enabled fully across all endpoints. Additionally, benign administrative scripts may occasionally trigger this alert, such as routine updates or legitimate configuration adjustments. A complementary detection for suspicious PowerShell usage should include monitoring for unexpected PowerShell modules being loaded or invoked, especially those related to system security manipulation.

