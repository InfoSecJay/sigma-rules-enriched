note: |
  ### Technical Context
  This detection rule identifies attempts to disable essential features of Microsoft Defender using PowerShell commands. Attackers may attempt to lower security defenses by disabling features such as real-time monitoring, archive scanning, and behavior monitoring. The goal is often to create a more opportune environment for malware execution or to facilitate lateral movement within the network without immediate detection by security tools.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - **Defense Evasion (T1562.001)**: Disabling security features can make it easier for attackers to execute malicious actions without triggering alerts.

  The primary data sources for this detection will be process creation logs, particularly those that capture PowerShell command-line arguments. These logs provide insights into executed commands and parameters that may indicate an effort to weaken security controls.

  ### Investigation Steps
  - **Review PowerShell Activity Logs**: Examine process creation logs for occurrences of PowerShell commands like `Set-MpPreference` and parameters indicating disabled features.
  - **Assess User Accounts and Privileges**: Identify the user accounts that executed the command to determine if they have a legitimate reason to disable Defender functionalities. Check for unusual access patterns or roles.
  - **Analyze Execution Context**: Investigate any recurring or suspicious process parent-child relationships that could indicate malicious automation, focusing on instances that lead to `Add-MpPreference` or similar commands.
  - **Correlate with Other Security Events**: Cross-reference the identified instances of command execution with alerts from other security tools (EDR, antivirus logs) to gather context about the user's actions and the potential external threat landscape.

  ### Prioritization
  This alert is deemed **high severity** due to the critical nature of disabling antivirus protective measures, which can allow for malware installation and persistence, significantly increasing the likelihood of a data breach or system compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, especially in cases where legitimate administrative activities also utilize these PowerShell commands, leading to potential false positives. The detection logic assumes that PowerShell execution is not legitimately performed by users with proper administrative rights. Additionally, lacking specific logging configurations or policies may hinder the effective capture of relevant command-line arguments that facilitate detection.

