note: |
  ### Technical Context

  This Sigma rule detects attempts to disable features of Microsoft Defender using PowerShell commands. The likely attacker objective is to weaken endpoint defenses, thereby facilitating further malicious activities without detection. This behavior is associated with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Disable or Modify Security Tools (T1685). Primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command-line executions. If malicious, the security impact could include increased susceptibility to malware or ransomware. This detection does NOT confirm a compromise on its own, as legitimate administrative actions may trigger similar alerts.

  ### Investigation Steps

  - **Review command-line arguments:** Check for command lines containing 'Set-MpPreference ' or 'Add-MpPreference ' within Security Event ID 4688. Malicious configurations may include parameters like 'DisableRealtimeMonitoring $true'.

  - **Validate base64 encoded scripts:** Look for command lines with base64 encoded options that contain variations of 'Disable*' within Sysmon Event ID 1. Suspicious strings are indicative of obfuscated malicious behavior.

  - **Identify expected administrative behavior:** Legitimate administrative changes should be verifiable and documented, often executed by domain admins or via approved maintenance windows. Review the timeline of command execution against defined change management processes.

  - **Check for high-confidence indicators:** Look for instances of 'DisableRealtimeMonitoring' or 'DisableBehaviorMonitoring' parameters set to '$true' in the command line. These are strong indicators of malicious intent.

  - **Cross-reference user accounts:** Examine the user context associated with the PowerShell execution. If it is associated with a non-administrative account, it is more likely to be a malicious attempt to disable security features.

  - **Monitor for follow-up activity:** After determining if the command was executed, look for subsequent suspicious file activities or process creations that suggest continued exploitation efforts, such as the execution of known malware binaries.

  ### Prioritization

  This alert has high severity due to its potential impact on endpoint defenses, which are critical in preventing malware and other threats. The likelihood of malicious abuse is significant, as attackers commonly seek to disable security tools to avoid detection.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate administrative activities that use similar command parameters. Proper logging must be configured to capture detailed command-line arguments, particularly for PowerShell executions. Additionally, routine maintenance or configuration changes by system administrators may also generate similar alerts. A related detection to strengthen coverage would be monitoring for abnormal increases in process creation events associated with PowerShell right after a disable command is executed.

