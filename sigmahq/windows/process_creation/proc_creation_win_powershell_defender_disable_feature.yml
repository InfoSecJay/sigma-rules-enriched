  ---

  ### Technical Context

  This Sigma rule detects attempts to disable key Microsoft Defender features via PowerShell commands, specifically commands such as `Set-MpPreference` or `Add-MpPreference`, with parameters that disable various security functions. The likely attacker objective is to evade detection and facilitate further malicious activities by reducing the system's defenses. This behavior aligns with the MITRE ATT&CK technique T1562.001 (Disable or Modify Security Tools).

  Primary telemetry sources include Windows process creation logs, predominantly Security Event ID 4688 and Sysmon Event ID 1, which capture command-line execution details. If malicious, the compromise can lead to significant security impacts, as it enables attackers to operate without effective endpoint protection. This detection does NOT confirm malicious intent on its own since legitimate administrative actions may utilize similar commands.

  ---

  ### Investigation Steps

  - **Check command line execution details:**
    Inspect Security Event ID 4688 for the command line input. Look for the presence of `Set-MpPreference` or `Add-MpPreference` along with any disable parameters like `DisableRealtimeMonitoring` or `DisableBehaviorMonitoring`.

  - **Evaluate the user context:**
    Identify the user or system account executing the command. Legitimate administrative users may frequently execute such commands for maintenance, but suspicious accounts performing this action could indicate malicious activity.

  - **Correlate with additional security logs:**
    Review Sysmon Event ID 1 for supplementary context on process creation. Validate that the process parent-child relationships are as expected. Unusual parent processes (like cmd.exe or PowerShell spawning from untrusted applications) could be malicious.

  - **Analyze frequency of commands:**
    Determine if there are multiple occurrences of disabling commands in a short timeframe. Repeated execution of these commands suggests malicious intent, especially from non-administrative accounts.

  - **Inspect for related event IDs:**
    Review Event ID 5025 from the Microsoft-Windows-Security-Mitigated-Identity-API log, which tracks Windows security features' disabling. This could provide corroborative evidence.

  - **Identify indicators of compromise:**
    Check if there are any artifacts or changes in Defender logs indicating that the security features were indeed disabled. Look for log entries stating the disabling of specific protection features at or shortly after the time of the command execution.

  ---

  ### Prioritization

  This alert has a high severity level due to the impact of disabling security features on critical systems. The likelihood of this behavior being exploited by malicious actors is significant, as it is commonly weaponized to bypass security controls and maintain persistence within compromised environments.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as encoding commands or modifying PowerShell to hide command-line inputs. Reliable detection requires proper logging configurations and Sysmon deployment across endpoints. Additionally, legitimate administrative tasks may trigger this alert, particularly if security tools are being reconfigured for maintenance. Companion detections that strengthen coverage could include monitoring for changes in security policies or configuration management logs that track administrative intents.

