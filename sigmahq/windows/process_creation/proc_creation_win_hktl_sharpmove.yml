title: HackTool - SharpMove Tool Execution
id: 055fb54c-a8f4-4aee-bd44-f74cf30a0d9d
status: test
description: |
  Detects the execution of SharpMove, a .NET utility performing multiple tasks such as "Task Creation", "SCM" query, VBScript execution using WMI via its PE metadata and command line options.
references:
- https://github.com/0xthirteen/SharpMove/
- https://pentestlab.blog/tag/sharpmove/
author: Luca Di Bartolomeo (CrimpSec)
date: 2024-01-29
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\SharpMove.exe'
  - OriginalFileName: SharpMove.exe
  selection_cli_computer:
        # In its current implementation the "computername" flag is required in all actions
    CommandLine|contains: 'computername='
  selection_cli_actions:
    CommandLine|contains:
    - 'action=create'
    - 'action=dcom'
    - 'action=executevbs'
    - 'action=hijackdcom'
    - 'action=modschtask'
    - 'action=modsvc'
    - 'action=query'
    - 'action=scm'
    - 'action=startservice'
    - 'action=taskscheduler'
  condition: selection_img or all of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of SharpMove, a .NET utility often utilized in lateral movement attacks within a network. SharpMove executes various tasks, such as task creation, service manipulation, and VBScript execution via Windows Management Instrumentation (WMI), primarily targeting Windows environments. Attackers commonly leverage such tools to establish persistence and conduct reconnaissance activities, aiming to maintain control over compromised systems or escalate privileges within the network.

  The relevant MITRE ATT&CK tactics and techniques for this detection are "Lateral Movement" (TA-0035) and the "Windows Service Execution" technique (T1021.002). By monitoring for this tool's execution, defenders can identify unauthorized movements and potentially thwart an attacker's efforts to pivot within a network or exploit vulnerable systems further.

  Primary data sources for this alert include process creation logs from Windows systems, which provide insight into application executions and command-line arguments used, thereby revealing potentially malicious behavior associated with SharpMove.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the log entries for any instances of `SharpMove.exe`, paying close attention to the command-line arguments that indicate action types and targets.
  - **Examine Command-Line Arguments**: Analyze specific action commands included in the execution of SharpMove, such as `action=create`, `action=dcom`, or `action=query`, to understand the intent of the operation.
  - **Correlate with System Changes**: Look for changes in Windows services, scheduled tasks, or WMI operations that coincide with the execution of SharpMove to identify potential impacts on system integrity.
  - **Investigate Network Activity**: Assess network traffic logs for any unusual communications initiated by the host where SharpMove was detected, as this could indicate further exploitation or lateral movement.

  ### Prioritization
  Given the nature of SharpMove as an adversarial tool for lateral movement and privilege escalation, this alert is categorized as high severity. Its presence suggests active attempts to compromise further or persist within the environment, which could lead to significant threat impacts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if additional lateral movement tools or scripts are employed that do not exhibit similar executable behavior. The detection logic assumes that all executions of SharpMove will be logged appropriately in process creation events. Additionally, proper logging configurations and permissions are necessary for the alert to function effectively; absence of these could hinder detection capabilities.

