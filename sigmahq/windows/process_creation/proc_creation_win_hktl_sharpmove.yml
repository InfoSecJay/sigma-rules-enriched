logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\SharpMove.exe'
  - OriginalFileName: SharpMove.exe
  selection_cli_computer:
        # In its current implementation the "computername" flag is required in all actions
    CommandLine|contains: 'computername='
  selection_cli_actions:
    CommandLine|contains:
    - 'action=create'
    - 'action=dcom'
    - 'action=executevbs'
    - 'action=hijackdcom'
    - 'action=modschtask'
    - 'action=modsvc'
    - 'action=query'
    - 'action=scm'
    - 'action=startservice'
    - 'action=taskscheduler'
  condition: selection_img or all of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of SharpMove, a .NET utility known for its capabilities in lateral movement within Windows environments. It can perform functions such as task creation, service control management (SCM), and executing VBScript utilizing Windows Management Instrumentation (WMI). The likely attacker objective is to leverage SharpMove for post-exploitation activities within a network, allowing them to execute commands, manipulate services, or create scheduled tasks stealthily.

  Relevant MITRE ATT&CK tactic is "Lateral Movement," specifically technique T1021.002 (Remote Services: Windows Admin Shares). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, focusing on the execution of SharpMove.exe and the associated command-line arguments. If malicious, the security impact could be significant, enabling attackers to pivot through the network and maintain persistence. It is important to note that detection of SharpMove’s execution does NOT confirm that an attack is taking place; it may include benign administrative activities.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for any instances of `SharpMove.exe`, paying attention to the `CommandLine` field for presence of parameters like `computername=` or actions such as `action=create`. Malicious activity will frequently have unusual command-line arguments.

  - **Examine behavior of command line arguments:** Analyze the `CommandLine` field for values associated with known malicious actions (e.g., `action=executevbs`, `action=startservice`) indicating potential unauthorized operations. Legitimate administrative actions might include typical service management without parameters indicating potential misuse.

  - **Investigate task and service manipulations:** If `action=modschtask` or `action=modsvc` is detected, further review the system logs (Event ID 4697 for service creation) for irregular service modifications or the creation of new scheduled tasks, which can indicate attempts to maintain persistence.

  - **Assess last modified timestamps:** Correlate timestamps for `SharpMove.exe` execution with other system events (e.g., authentication logs from Event ID 4624) to identify anomalous patterns such as high-frequency executions during off-hours.

  - **Check for other indicators of compromise:** Look for other instances of unusual process spawning, especially from accounts not typically associated with administrative tasks. High-confidence indicators would include multiple executions of SharpMove in a short timeframe.

  - **Review endpoint configurations:** Validate that endpoints are not misconfigured, allowing unauthorized software execution. Check Group Policy Objects (GPOs) and application whitelisting configurations, as legitimate administrative tools might occasionally overlap with SharpMove’s functionalities.

  ---

  ### Prioritization

  The alert has a high severity due to the potential impact of lateral movement in a network environment, allowing an attacker to gain extensive control over critical assets. The likelihood of its malicious abuse is significant, as SharpMove is specifically designed for adversarial purposes and often seen in organized attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging or by the use of legitimate administrative tools that could trigger similar alerts, such as normal WMI queries. Accurate detection requires the correct configuration of logging for process creation within the operating system. Additionally, legitimate administrative activity, such as task scheduling or service management by IT personnel, may lead to false positives. A related detection to strengthen coverage would be monitoring for unauthorized WMI usage or systemic service management actions.

