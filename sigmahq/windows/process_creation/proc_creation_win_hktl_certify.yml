title: HackTool - Certify Execution
id: 762f2482-ff21-4970-8939-0aa317a886bb
status: test
description: Detects Certify a tool for Active Directory certificate abuse based
  on PE metadata characteristics and common command line arguments.
references:
- https://github.com/GhostPack/Certify
author: pH-T (Nextron Systems)
date: 2023-04-17
modified: 2023-04-25
tags:
- attack.discovery
- attack.credential-access
- attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\Certify.exe'
  - OriginalFileName: 'Certify.exe'
  - Description|contains: 'Certify'
  selection_cli_commands:
    CommandLine|contains:
    - '.exe cas '
    - '.exe find '
    - '.exe pkiobjects '
    - '.exe request '
    - '.exe download '
  selection_cli_options:
    CommandLine|contains:
    - ' /vulnerable'
    - ' /template:'
    - ' /altname:'
    - ' /domain:'
    - ' /path:'
    - ' /ca:'
  condition: selection_img or all of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Certify tool, which is commonly associated with Active Directory certificate abuse. Attackers may use Certify to enumerate certificate templates, request certificates, or access sensitive information, ultimately aiming to escalate privileges or perform lateral movement within a network. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA-0006) and the technique Active Directory Certificate Services Abuse (T1649).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, leveraging Certify could compromise the integrity of Active Directory by allowing unauthorized access to sensitive resources. It is important to note that the detection of Certify execution alone does not confirm that an attack has occurred; legitimate administrative use may also trigger this alert.

  ### Investigation Steps

  - **Identify the executing process:** Review Windows Event ID 4688 or Sysmon Event ID 1 for the creation of `Certify.exe`, focusing on the `Image` field for paths ending with `\Certify.exe`. Confirm that no benign application is mistakenly invoking this executable.

  - **Examine the command line parameters:** Check the `CommandLine` field in the event log for indicative terms such as `/domain:`, `/template:`, or `/vulnerable`. Malicious executions often use specific parameters to query or download certificate data.

  - **Determine legitimate usage patterns:** Validate whether Certify was executed by standard administrative accounts or services, ideally referencing a baseline of normal operations that involve certificate management in your organization.

  - **Correlate with other security events:** Look for related events, such as unusual logon patterns or subsequent artifact creation, that may indicate malicious activity, for example, Event ID 4776 (Credential Validation) or Event ID 4768 (Kerberos Authentication).

  - **Check for administrative permissions:** Review the user account launching Certify to determine if it has elevated privileges that are typically associated with administrative tasks.

  - **Examine the creation of artifacts:** If applicable, analyze any output files or logs during the execution of Certify. Look for unexpected file creations in temporary directories or reports sent from `/path:` commands, which could indicate exfiltration or unauthorized access.

  ### Prioritization

  This alert has a high severity level due to its association with potential insider threats or external adversaries probing for privileged access in Active Directory. The impact on affected systems can be significant, especially if attackers leverage certificate abuse methods. Additionally, the functionalities of the Certify tool are commonly weaponized in credential attack scenarios.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility of legitimate administrative use of Certify within controlled environments, which can generate false positives. Furthermore, certain logging configurations may be required to capture all relevant process creation events effectively. Activities such as routine certificate renewals or testing by IT security can also trigger this alert. To enhance coverage, it is beneficial to couple this detection with rules monitoring for unusual administrative logon activities or privilege escalation behaviors, such as T1078 (Valid Accounts).

