title: HackTool - Certify Execution
id: 762f2482-ff21-4970-8939-0aa317a886bb
status: test
description: Detects Certify a tool for Active Directory certificate abuse based on
  PE metadata characteristics and common command line arguments.
references:
- https://github.com/GhostPack/Certify
author: pH-T (Nextron Systems)
date: 2023-04-17
modified: 2023-04-25
tags:
- attack.discovery
- attack.credential-access
- attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\Certify.exe'
  - OriginalFileName: 'Certify.exe'
  - Description|contains: 'Certify'
  selection_cli_commands:
    CommandLine|contains:
    - '.exe cas '
    - '.exe find '
    - '.exe pkiobjects '
    - '.exe request '
    - '.exe download '
  selection_cli_options:
    CommandLine|contains:
    - ' /vulnerable'
    - ' /template:'
    - ' /altname:'
    - ' /domain:'
    - ' /path:'
    - ' /ca:'
  condition: selection_img or all of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of Certify, a tool utilized for Active Directory certificate abuse. Certify can be used by attackers to request certificates for malicious purposes, potentially leading to further compromise of systems through credential theft or impersonation. The detection logic is based on specific PE metadata characteristics of the tool and commonly used command line arguments that indicate active exploitation behavior.

  The primary threat scenario revolves around attackers who gain unauthorized access to Active Directory environments to escalate privileges or move laterally within the network using forged certificates. This activity aligns with the MITRE ATT&CK framework, specifically within the tactics of Credential Access (TA0006) and Discovery (TA0007). Techniques relevant to this detection include "Credential Dumping" (T1003) and "Active Directory Enumeration" (T1618).

  The primary data source for this detection is process creation logs from Windows systems, which provide insights into executed applications, their metadata, and the command line arguments used during their execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for instances of `Certify.exe` execution, focusing on the Image path, Original File Name, and Description fields to confirm the use of the tool.
  - **Examine Command Line Arguments**: Investigate the command line parameters associated with `Certify.exe` executions, particularly looking for known malicious options such as `/vulnerable`, `/template:`, and `/ca:` which indicate attempts to manipulate certificate authority processes.
  - **Correlate with Network Activity**: Look for corresponding network activity that may indicate external communications or requests related to certificate distribution and verification, especially any unusual connections to domain controllers.
  - **Assess Active Directory Logs**: Review Active Directory and security event logs for any unusual or unauthorized certificate requests that could be associated with Certify's usage, along with any related escalation patterns.

  ### Prioritization
  This alert is considered high severity due to the significant risk of credential compromise and privilege escalation associated with Active Directory certificate manipulation. In an enterprise environment, such activity could lead to unauthorized access to sensitive data and systems.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where logging is misconfigured or disabled, particularly for process creation events. The detection logic assumes that Certify will be executed with recognizable characteristics, which may not account for possible evasion techniques used by sophisticated attackers. To ensure this alert functions effectively, process creation logging must be enabled across endpoints, and command line logging should be configured to capture detailed command execution behavior.

