title: Suspicious Csi.exe Usage
id: 40b95d31-1afc-469e-8d34-9a3a667d058e
status: test
description: Csi.exe is a signed binary from Microsoft that comes with Visual Studio
  and provides C# interactive capabilities. It can be used to run C# code from a file
  passed as a parameter in command line. Early version of this utility provided with
  Microsoft “Roslyn” Community Technology Preview was named 'rcsi.exe'
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Csi/
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Rcsi/
- https://enigma0x3.net/2016/11/21/bypassing-application-whitelisting-by-using-rcsi-exe/
- https://twitter.com/Z3Jpa29z/status/1317545798981324801
author: Konstantin Grishchenko, oscd.community
date: 2020-10-17
modified: 2022-07-11
tags:
- attack.lateral-movement
- attack.execution
- attack.t1072
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\csi.exe'
    - '\rcsi.exe'
  - OriginalFileName:
    - 'csi.exe'
    - 'rcsi.exe'
  selection_cli:
    Company: 'Microsoft Corporation'
  condition: all of selection*
falsepositives:
- Legitimate usage by software developers
level: medium
note: |
  ### Technical Context
  This detection rule targets the suspicious usage of `Csi.exe` and its predecessor `Rcsi.exe`, which are legitimate executables from Microsoft associated with the C# interactive capabilities of Visual Studio. However, these binaries have been misused by attackers for executing C# scripts, allowing them to bypass security measures and implement malicious commands. The risk lies in the potential use of these tools for script-based attacks, lateral movement, or data exfiltration. The threat scenario involves an adversary leveraging these binaries to run unauthorized scripts as part of their malicious activities against enterprises.

  The relevant MITRE ATT&CK tactics include "Execution" (ATT&CK ID: T1203), which pertains to the execution of malicious code, and "Defense Evasion" (ATT&CK ID: T1218), which relates to the avoidance of detection by security controls. Attackers may use these tools to interact with the system undetected, thus raising the stakes for security teams who must remain vigilant against such activities.

  Primary data sources to monitor for this rule include process creation events, where logs can reveal details about the execution of `Csi.exe` and `Rcsi.exe`, alongside command line arguments which can indicate suspicious usage patterns or attempts to execute unauthorized scripts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the logs for instances of `Csi.exe` and `Rcsi.exe` that include unusual command line parameters. Look for any signs of script execution or vectors indicative of malicious activity.

  - **Analyze User Context**: Determine the user accounts under which the suspicious processes are executed. Evaluate whether these accounts typically engage in software development-related tasks or have elevated privileges that may not align with regular usage patterns.

  - **Correlate with Security Alerts**: Cross-reference the detected usage of `Csi.exe` or `Rcsi.exe` with other security alerts, such as lateral movement or unauthorized access attempts, to ascertain if this is part of a broader attack pattern.

  - **Monitor for Anomalous Behavioral Patterns**: Look for recurrent or patterned execution of these binaries, especially when coupled with processes that are known to be associated with adversarial actions, like credential dumping or remote access.

  ### Prioritization
  This alert is classified as medium severity due to the potential misuse of a legitimate Microsoft tool for nefarious purposes. The likelihood of this behavior indicates a significant risk, especially if coupled with other suspicious activities, suggesting a determined adversary targeting the enterprise's security posture.

  ### Blind Spots and Assumptions
  There are potential gaps in detecting sophisticated attackers who might obfuscate their use of `Csi.exe` or `Rcsi.exe` by altering the command parameters or executing them in a non-standard way. This detection assumes that most organizational users engaging in software development will have legitimate reasons for using these tools. Additionally, for this alert to function effectively, comprehensive process creation logging must be enabled, capturing all instances of program execution within the environment.

