logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\csi.exe'
    - '\rcsi.exe'
  - OriginalFileName:
    - 'csi.exe'
    - 'rcsi.exe'
  selection_cli:
    Company: 'Microsoft Corporation'
  condition: all of selection*
falsepositives:
- Legitimate usage by software developers
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of `csi.exe` (C# Interactive) or its earlier variant `rcsi.exe`, which are both legitimate Microsoft binaries associated with Visual Studio. The likely motive for an attacker utilizing this utility is to execute arbitrary C# code, potentially as part of a lateral movement attempt (MITRE ATT&CK Tactic: Execution; Technique: T1218). The primary telemetry comes from Windows process creation events, specifically looking for Event ID 4688 or Sysmon Event ID 1. If used maliciously, this could enable adversaries to run scripts or perform actions that compromise systems, execute payloads, or escalate privileges. However, this detection does not confirm malicious intent without further context—it could also be used legitimately by developers.

  ### Investigation Steps

  - **Review recent `csi.exe` or `rcsi.exe` executions:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances where these binaries were created. Look for anomalous parent processes or unusual command-line arguments that deviate from typical development tasks.

  - **Verify command-line arguments:** Calculate the specific command-line parameters passed to `csi.exe` or `rcsi.exe`. Legitimate developers usually pass benign parameters (e.g., script files or `-r` for reference); suspicious usage could point to obfuscated scripts or command execution.

  - **Correlate process creation with system role:** Identify whether the process originated from a system hosting developer tools. If not, this may indicate potential misuse, especially on production servers where such tools should not be present.

  - **Cross-reference with known benign users:** Review the account associated with the execution. Legitimate usage is expected from accounts with development roles; any execution from unusual accounts (especially service or generic accounts) may warrant further investigation.

  - **Investigate file system interactions:** If the process created or modified files, examine Sysmon Event ID 11 for file creation timestamps and paths. Malicious processes may attempt to create executable files or scripts in unusual directories.

  - **Identify high-confidence malicious indicators:** Search for any underlying scripts or methods that were invoked through `csi.exe`. If there are network connections established post-invocation (e.g., command-and-control callback), this presents a direct indicator of malicious activity.

  ### Prioritization

  This alert is prioritized at a medium severity due to potential impacts on system integrity, especially if it is observed on critical systems where development tools are not expected. The likelihood of abuse is plausible given the utility's ability to execute code, making it a common vector for lateral movement or payload delivery in a compromised environment.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if logging for process creation is not fully enabled or if legitimate activities predominately utilize `csi.exe`. Additionally, developers may unintentionally trigger this rule during normal operations when running scripts. Companion detections such as those monitoring network activity for unusual outbound connections can further bolster the analysis of potential misuse of `csi.exe`.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
