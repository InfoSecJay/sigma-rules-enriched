title: Suspicious Csi.exe Usage
id: 40b95d31-1afc-469e-8d34-9a3a667d058e
status: test
description: Csi.exe is a signed binary from Microsoft that comes with Visual 
  Studio and provides C# interactive capabilities. It can be used to run C# code
  from a file passed as a parameter in command line. Early version of this 
  utility provided with Microsoft “Roslyn” Community Technology Preview was 
  named 'rcsi.exe'
