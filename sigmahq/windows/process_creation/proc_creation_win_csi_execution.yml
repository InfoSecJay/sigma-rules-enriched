note: |
  ### Technical Context

  This Sigma rule detects the execution of `csi.exe` or `rcsi.exe`, which are legitimate binaries from Microsoft used for running C# code interactively. The likely attacker objective is to execute malicious C# scripts for tasks such as credential dumping or lateral movement without being detected. This behavior fits into the MITRE ATT&CK framework under the Execution tactic, specifically Technique T1218 (Signed Binary Proxy Execution) and T1072 (Software Deployment Tools).

  Primary telemetry sources include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1. The security impact of this behavior could be severe if it is used maliciously, as it may facilitate other attacks. However, this detection does NOT confirm malicious intent on its own, as the binaries can also be used legitimately by software developers.

  ---

  ### Investigation Steps

  - **Check process creation logs for csi.exe or rcsi.exe:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `csi.exe` or `rcsi.exe` being executed. Focus on the ParentProcessName field to identify the invoking process.

  - **Analyze command-line parameters:** Examine the CommandLine field in process creation logs for unusual or suspicious arguments passed to `csi.exe` or `rcsi.exe`. Legitimate usage typically involves simple script files with known paths; suspicion arises if command-line arguments reference obfuscated scripts or unexpected directories.

  - **Identify parent processes:** Investigate the parent process initiating the execution of `csi.exe` or `rcsi.exe`. Legitimate calls often originate from development tools or IDEs, while atypical sources (e.g., `powershell.exe`, `cmd.exe`) may indicate malicious intent.

  - **Monitor for child processes spawned by csi.exe:** Utilize Sysmon Event ID 1 or similar telemetry to identify any child processes created by `csi.exe`. Presence of unexpected or known malicious executables spawned from it strengthens malicious indicators.

  - **Validate file creation or modification artifacts:** Check for any newly created or modified files around the time of the `csi.exe` execution. Files with unusual extensions or created in ephemeral or non-standard directories may indicate malicious use.

  ---

  ### Prioritization

  The alert should be prioritized as medium severity due to the potential impact on systems associated with development tasks. The likelihood of malicious abuse exists, particularly if `csi.exe` is used to execute obfuscated code. This behavior has been observed in prior attacks, highlighting its relevance in current threat landscapes.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by user behavior, as legitimate software development practices could easily trigger this alert. Ensuring reliable detection may require additional log sources beyond standard process creation logs. Legitimate scenarios include software developers executing `csi.exe` for testing/debugging purposes. Companion detections, such as monitoring PowerShell usage (e.g., T1059.001), could strengthen overall coverage against script-based execution attempts.

