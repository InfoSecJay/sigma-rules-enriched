title: Potential Fake Instance Of Hxtsr.EXE Executed
id: 4e762605-34a8-406d-b72e-c1a089313320
status: test
description: |
  HxTsr.exe is a Microsoft compressed executable file called Microsoft Outlook Communications.
  HxTsr.exe is part of Outlook apps, because it resides in a hidden "WindowsApps" subfolder of "C:\Program Files".
  Any instances of hxtsr.exe not in this folder may be malware camouflaging itself as HxTsr.exe
references:
- Internal Research
author: Sreeman
date: 2020-04-17
modified: 2024-02-08
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  product: windows
  category: process_creation
detection:
    # TODO: Link this to the more generic system process rule
  selection:
    Image|endswith: '\hxtsr.exe'
  filter_main_hxtsr:
    Image|contains: ':\program files\windowsapps\microsoft.windowscommunicationsapps_'
    Image|endswith: '\hxtsr.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects instances of `hxtsr.exe`, a component associated with Microsoft Outlook Communications, being executed from locations outside its standard directory. The presence of `hxtsr.exe` in non-standard locations can indicate potential malware trying to masquerade as the legitimate application, a technique often used by attackers to evade detection while executing malicious payloads. This scenario is relevant for security teams managing enterprise environments where email communication applications are heavily utilized.

  The main objectives of such an attack may include data exfiltration, system compromise, or further lateral movement within the network. By disguising itself as a trusted application, the malicious executable can leverage user trust and permissions to execute its payload without raising immediate alarms. This detection aligns with the MITRE ATT&CK framework under **Defense Evasion (T1070)** and **Masquerading (T1036)** tactics, focusing on the evasion of security controls.

  Primary data sources for this detection include **process creation events**, which log the execution of applications, and **Windows event logs**. These logs will contain vital information about the execution path of `hxtsr.exe`, assisting analysts in identifying any suspicious processes that deviate from standard behavior.

  ### Investigation Steps
  - **Review Process Creation Events:** Check Windows process creation logs for instances of `hxtsr.exe` that do not originate from `C:\Program Files\WindowsApps`. Investigate the execution context and parent process to determine how the process was initiated.

  - **Inspect File Paths and Integrity:** Analyze the file paths of flagged `hxtsr.exe` instances. Verify the file properties, including digital signatures and hashes, against known good versions to ascertain authenticity.

  - **Correlate with User Activity:** Evaluate user accounts associated with the execution of suspicious `hxtsr.exe` instances. Look for unusual user activity or access patterns, such as logins from unfamiliar workstations or after-hours access.

  - **Check for Related Artifacts:** Search for other suspicious application behaviors, including any outbound connections, attempts to access sensitive data, or changes to system settings immediately following the execution of the anomalous process.

  ### Prioritization
  The alert has a medium severity because while the specific execution of a fake `hxtsr.exe` may not be immediately catastrophic, it poses a considerable risk of compromise within the network that could enable further exploitation if not addressed promptly.

  ### Blind Spots and Assumptions
  This detection may not cover all potential paths for malware hiding as legitimate executables. It assumes that the execution paths for `hxtsr.exe` can be effectively monitored and that no other legitimate applications are using the same masquerading techniques. Additionally, logging must be appropriately configured to capture all process creation events; without such configurations, the detection will not function as intended.

