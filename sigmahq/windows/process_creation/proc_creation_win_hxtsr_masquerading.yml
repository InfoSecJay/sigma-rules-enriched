title: Potential Fake Instance Of Hxtsr.EXE Executed
id: 4e762605-34a8-406d-b72e-c1a089313320
status: test
description: |
  HxTsr.exe is a Microsoft compressed executable file called Microsoft Outlook Communications.
  HxTsr.exe is part of Outlook apps, because it resides in a hidden "WindowsApps" subfolder of "C:\Program Files".
  Any instances of hxtsr.exe not in this folder may be malware camouflaging itself as HxTsr.exe
references:
- Internal Research
author: Sreeman
date: 2020-04-17
modified: 2024-02-08
tags:
- attack.stealth
- attack.t1036
logsource:
  product: windows
  category: process_creation
detection:
    # TODO: Link this to the more generic system process rule
  selection:
    Image|endswith: '\hxtsr.exe'
  filter_main_hxtsr:
    Image|contains: ':\program files\windowsapps\microsoft.windowscommunicationsapps_'
    Image|endswith: '\hxtsr.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies instances of the executable `hxtsr.exe` running from paths outside the legitimate installation directory, which is typically a subfolder of `C:\Program Files\WindowsApps`. The likely objective of an attacker using such a method is to evade detection by masquerading as a legitimate Microsoft process, thereby establishing or maintaining persistence on the system. This behavior aligns with the MITRE ATT&CK technique for "Masquerading" (T1036).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 or Sysmon Event ID 1. The security impact of detecting malicious hxtsr.exe instances could be significant, posing risks of data exfiltration or unauthorized access to sensitive information. This detection, however, does NOT confirm that all identified instances are malicious, as legitimate software may also exhibit similar behavior.

  ### Investigation Steps

  - **Verify the file path of `hxtsr.exe`:** Check the process creation log for Event ID 4688 where `Image` equals `hxtsr.exe`. Confirm the `Process ID` and `Parent Process ID` to ensure it is not running from the legitimate `C:\Program Files\WindowsApps` path. Legitimate instances will always originate from this directory.

  - **Check execution context and parent processes:** Look for the `Parent Process Name` in Event ID 4688 data. Common benign parent processes may include `outlook.exe`. A suspicious parent process like `powershell.exe` or an unusual executable could indicate malicious intent.

  - **Inspect command line arguments:** Analyze the command line arguments for the process using Event ID 4688. Legitimate instances should have minimal or no arguments. Unexpected or suspicious arguments could signal malicious activity.

  - **Correlate with additional telemetry:** Check endpoint detection logs for any additional anomalous behavior related to the executing process, such as unusual outbound connections or file creations. Look for Event IDs 5140 (Network Share Access) and 5145 (File System Access) for unexpected access attempts.

  - **Review system integrity:** Utilize Sysinternals tools such as `Process Explorer` to inspect running instances of `hxtsr.exe` for signatures, digital signatures, and file properties to confirm whether it belongs to the official Microsoft suite.

  - **Identify prior instances of the process:** Search for historical execution logs to determine if multiple instances of `hxtsr.exe` have been triggered and whether they exhibit similar suspicious behaviors or irregular paths over time.

  ### Prioritization

  This alert has a medium severity due to the potential for a significant impact on the affected system, particularly if it is part of a critical infrastructure or security environment. The likelihood of malicious abuse is moderate given the stealthy nature of adversary techniques to masquerade legitimate processes. However, this specific behavior is not as commonly weaponized as other techniques.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques where malware may use exact file names from legitimate software, existing in the correct directories. The investigation relies on the availability and accuracy of Windows process creation logs (Event ID 4688). Legitimate applications, particularly software updates or legitimate instances of Outlook, may trigger this alert. A companion detection to consider is monitoring for unusual parent processes associated with `hxtsr.exe` instances to strengthen coverage against sophisticated malware behavior.

