title: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
id: 551d9c1f-816c-445b-a7a6-7a3864720d60
status: test
description: |
  Detects suspicious child processes of Excel which could be an indicator of lateral movement leveraging the "ActivateMicrosoftApp" Excel DCOM object.
references:
- https://posts.specterops.io/lateral-movement-abuse-the-power-of-dcom-excel-application-3c016d0d9922
- https://github.com/grayhatkiller/SharpExShell
- https://learn.microsoft.com/en-us/office/vba/api/excel.xlmsapplication
author: Aaron Stratton
date: 2023-11-13
tags:
- attack.t1021.003
- attack.lateral-movement
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\excel.exe'
  selection_child:
  - OriginalFileName:
    - 'foxprow.exe'
    - 'schdplus.exe'
    - 'winproj.exe'
  - Image|endswith:
    - '\foxprow.exe'
    - '\schdplus.exe'
    - '\winproj.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious child processes initiated by Excel through the "ActivateMicrosoftApp" DCOM object. This is significant because attackers may use Excel as a living-off-the-land tactic to execute malicious code on remote systems, facilitating lateral movement within a network. By creating child processes linked to legitimate applications, threat actors can obfuscate their activities and evade detection.

  The primary threat scenario revolves around a malicious actor leveraging DCOM to execute unauthorized commands through Excel, potentially to gain access to sensitive information or further spread malware across the network. Relevant MITRE ATT&CK tactics and techniques include **Lateral Movement (T1021)** and **Lateral Movement via Application Layer Protocol (T1021.003)**, as this activity utilizes built-in applications like Excel for malicious purposes.

  To effectively monitor for this activity, the main data sources needed include **process creation logs** from Windows systems, which capture the execution of processes and can reveal unusual parent-child relationships indicative of possible lateral movement attempts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs related to process creation on systems where Excel has been executed to identify any instances of suspicious child processes like `foxprow.exe`, `schdplus.exe`, or `winproj.exe` that are spawned from `excel.exe`.

  - **Correlate with Network Traffic:** Analyze network traffic logs to determine if any unusual connections were made by the detected child processes or the parent Excel process, particularly to unexpected or high-risk internal or external IP addresses.

  - **Investigate User Context:** Identify the user account that initiated Excel and any child processes, checking for anomalous behavior such as usage patterns outside normal business hours or from unfamiliar devices.

  - **Assess DCOM Configuration:** Verify the DCOM permissions on systems to ensure that only authorized configurations are in place, and identify any modifications to these settings that may facilitate unauthorized lateral movement.

  ### Prioritization
  This alert is considered high severity due to the potential for lateral movement within the environment, which can lead to significant unauthorized access to sensitive data or systems, impacting overall company security.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise if process creation logs are not adequately captured or retained over time. The detection logic assumes that malwares like `foxprow.exe`, `schdplus.exe`, and `winproj.exe` are not legitimate processes in your environment; however, false positives may occur if legitimate business applications use these executables. Ensuring that process creation logs are enabled and comprehensive on all endpoints is essential for effective detection.

