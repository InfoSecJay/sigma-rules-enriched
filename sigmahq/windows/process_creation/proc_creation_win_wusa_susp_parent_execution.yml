title: Wusa.EXE Executed By Parent Process Located In Suspicious Location
id: ef64fc9c-a45e-43cc-8fd8-7d75d73b4c99
status: test
description: |
  Detects execution of the "wusa.exe" (Windows Update Standalone Installer) utility by a parent process that is located in a suspicious location.
  Attackers could instantiate an instance of "wusa.exe" in order to bypass User Account Control (UAC). They can duplicate the access token from "wusa.exe" to gain elevated privileges.
references:
- https://www.fortinet.com/blog/threat-research/konni-campaign-distributed-via-malicious-document
author: X__Junior (Nextron Systems)
date: 2023-11-26
modified: 2024-08-15
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wusa.exe'
  selection_paths_1:
    ParentImage|contains:
            # Note: Add additional suspicious locations to increase coverage
    - ':\Perflogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Appdata\Local\Temp\'
    - '\Temporary Internet'
  selection_paths_2:
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Pictures\'
  filter_main_msu:
        # Note: We exclude MSU extension files. A better approach is to baseline installation of updates in your env to avoid false negatives.
    CommandLine|contains: '.msu'
  condition: selection_img and 1 of selection_paths_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of `wusa.exe`, the Windows Update Standalone Installer, when launched by a parent process located in suspicious directories such as temporary file locations or user public folders. The likely attacker objective is to leverage the elevated privileges gained through `wusa.exe` to execute malicious payloads or scripts while bypassing User Account Control (UAC). This behavior aligns with the MITRE ATT&CK technique "Exploitation for Client Execution" (T1203) as well as "Process Injection" (T1055). Primary telemetry sources include Windows process creation logs (Event ID 4688) where the command line and parent process image path details are essential for analysis. If this behavior is determined to be malicious, it can lead to severe impacts, such as unauthorized access to sensitive data or further exploitation within the network. Notably, this detection does NOT confirm malicious activity on its own; investigation of additional context is necessary.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 logs for all instances of `wusa.exe`. Observe the `ParentImage` and `CommandLine` fields to identify suspicious parent processes located in potentially malicious folders.

  - **Evaluate the Parent Process Location:** Investigate the `ParentImage` path. If it originates from `C:\Perflogs\`, `C:\Users\Public\`, `C:\Windows\Temp\`, or similar paths, consider it highly suspicious. Legitimate software installations typically do not execute from these locations.

  - **Analyze Command Line Arguments:** Inspect the `CommandLine` field for any arguments that include `.msu`. The presence of this file extension should be excluded from malicious assessment, as it indicates a legitimate Windows update operation.

  - **Cross-Check with User Account Control (UAC) Settings:** Verify whether the system's UAC settings are enabled. If `wusa.exe` is executed without UAC prompts from suspicious paths, it indicates potential abuse of privilege escalation techniques.

  - **Review Event Logs for Associated Activities:** Check for recent file modifications or unusual activities around the same time as `wusa.exe` execution, such as changes in the `C:\Users\Public\` or `C:\Windows\Temp\` directories. Look for Event ID 5140 (File Share Access) and monitor for unexpected access patterns.

  - **Correlate with Threat Intelligence Reports:** Investigate any context about the detected behavior in existing threat intelligence sources or internal logs. Reference reports like the one provided on the Konni campaign to contextualize the risk and possibly identify impersonating indicators.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential for elevated privilege abuse in enterprise environments. The likelihood of malicious exploitation is moderate, as `wusa.exe` is often weaponized to escalate privileges stealthily. Additionally, execution from suspicious locations raises significant concerns regarding the origin and intent behind the process.

  ---

  ### Blind Spots and Assumptions

  Limitations in detection include the possibility of evasion through legitimate use of `wusa.exe` for installing updates. Detection relies heavily on logging configuration; therefore, any systems without adequate process creation logging may skip detection entirely. There is a risk of false positives triggered by legitimate applications that may be incorrectly located in suspect folders. To enhance coverage, consider monitoring for additional related behaviors, such as "Command Execution" (T1059) involving scripts or other executable attackers might leverage alongside `wusa.exe`.

