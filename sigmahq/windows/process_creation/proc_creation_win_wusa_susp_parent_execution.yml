title: Wusa.EXE Executed By Parent Process Located In Suspicious Location
id: ef64fc9c-a45e-43cc-8fd8-7d75d73b4c99
status: test
description: |
  Detects execution of the "wusa.exe" (Windows Update Standalone Installer) utility by a parent process that is located in a suspicious location.
  Attackers could instantiate an instance of "wusa.exe" in order to bypass User Account Control (UAC). They can duplicate the access token from "wusa.exe" to gain elevated privileges.
references:
- https://www.fortinet.com/blog/threat-research/konni-campaign-distributed-via-malicious-document
author: X__Junior (Nextron Systems)
date: 2023-11-26
modified: 2024-08-15
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wusa.exe'
  selection_paths_1:
    ParentImage|contains:
            # Note: Add additional suspicious locations to increase coverage
    - ':\Perflogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Appdata\Local\Temp\'
    - '\Temporary Internet'
  selection_paths_2:
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Pictures\'
  filter_main_msu:
        # Note: We exclude MSU extension files. A better approach is to baseline installation of updates in your env to avoid false negatives.
    CommandLine|contains: '.msu'
  condition: selection_img and 1 of selection_paths_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects execution of `wusa.exe`, the Windows Update Standalone Installer, by a parent process located in suspicious directories, such as `C:\Perflogs\` or `C:\Windows\Temp\`. The behavior indicates potential malicious activity where an attacker uses `wusa.exe` to bypass User Account Control (UAC) and elevate privileges by duplicating access tokens.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique is **User Execution** (T1203). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing process creation details and the associated command lines. If malicious, the activity could lead to unauthorized access and control over affected systems.

  It is important to note that this detection does NOT confirm that the execution is necessarily malicious; further investigation is required to assess the context of the process execution.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for the execution of `wusa.exe` and identify the parent process. Look for parent processes originating from suspicious directories: `C:\Perflogs\`, `C:\Windows\Temp\`, or similar paths.

  - **Analyze command line parameters:** Inspect the command line associated with `wusa.exe` for any suspicious flags or arguments, particularly those containing `.msu`, as legitimate update installations will typically use this format.

  - **Establish baseline legitimate behavior:** Identify typical use cases of `wusa.exe` within your environment, commonly invoked by processes like `svchost.exe` or SYSTEM-level services doing legitimate Windows updates, which could aid in distinguishing benign actions from malicious ones.

  - **Correlate elevated privilege activities:** Review user access token activities from Windows Security logs (Event ID 4672) and check if any users were granted elevated privileges immediately after the execution of `wusa.exe`, which may indicate malicious intent.

  - **Validate the origin of parent processes:** For parent processes executing `wusa.exe`, check for known malicious indicators or behaviors associated with the directory from which they originated. Review Execution timestamps against known threat actor activity timelines.

  - **Assess file creation or modification:** Confirm if any files were created or modified in temporary directories (`C:\Windows\Temp\`, `%TEMP%`) along with the execution of `wusa.exe`, as this may signal an attempt to deploy additional malicious payloads.

  ### Prioritization

  This alert warrants high severity due to the potential for critical impact if elevated privileges are achieved on compromised systems. The likelihood of abuse is heightened given the common use of exploitation techniques involving `wusa.exe`. The behavior observed is often weaponized in targeted attacks, increasing its significance in threat detection.

  ### Blind Spots and Assumptions

  This detection may miss cases where legitimate applications use `wusa.exe` for valid installation purposes if they come from the same suspicious paths. Evasion techniques could include renaming or relocating the `wusa.exe` executable or using legitimate parent processes. Reliable detection requires configurations ensuring full process creation logging (including command lines) and attention to related processes that could act as deceptive actors in UAC bypass scenarios, like `cmd.exe` or PowerShell scripts. A companion detection to strengthen coverage would be monitoring for unusual parent-child process relationships involving lateral movement indicators.

