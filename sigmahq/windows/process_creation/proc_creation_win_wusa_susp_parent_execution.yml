title: Wusa.EXE Executed By Parent Process Located In Suspicious Location
id: ef64fc9c-a45e-43cc-8fd8-7d75d73b4c99
status: test
description: |
  Detects execution of the "wusa.exe" (Windows Update Standalone Installer) utility by a parent process that is located in a suspicious location.
  Attackers could instantiate an instance of "wusa.exe" in order to bypass User Account Control (UAC). They can duplicate the access token from "wusa.exe" to gain elevated privileges.
references:
- https://www.fortinet.com/blog/threat-research/konni-campaign-distributed-via-malicious-document
author: X__Junior (Nextron Systems)
date: 2023-11-26
modified: 2024-08-15
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\wusa.exe'
  selection_paths_1:
    ParentImage|contains:
            # Note: Add additional suspicious locations to increase coverage
    - ':\Perflogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Appdata\Local\Temp\'
    - '\Temporary Internet'
  selection_paths_2:
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - ParentImage|contains|all:
    - ':\Users\'
    - '\Pictures\'
  filter_main_msu:
        # Note: We exclude MSU extension files. A better approach is to baseline installation of updates in your env to avoid false negatives.
    CommandLine|contains: '.msu'
  condition: selection_img and 1 of selection_paths_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of "wusa.exe," the Windows Update Standalone Installer, when it is initiated by a parent process located in suspicious directories. Typically, legitimate instances of "wusa.exe" are executed as part of system update processes; however, attackers may manipulate this tool to escalate privileges by bypassing User Account Control (UAC) mechanisms. By running "wusa.exe" from unusual directories, adversaries can impersonate legitimate actions to facilitate malicious objectives such as unauthorized access or executing further payloads.

  This behavior aligns with the MITRE ATT&CK framework under techniques such as **T1068: Exploitation of Elevation Control Mechanism**, which covers methods for bypassing UAC or privilege escalation, and **T1203: Exploitation for Client Execution**, where malicious documents lead to execution of potentially harmful applications. Primary data sources vital for this detection include process creation events that log the parent-child relationship of processes, particularly focusing on the parent paths and command line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for the execution of "wusa.exe" to identify the parent process and its location. Note any instances where the parent process originates from suspicious directories listed in the detection logic.

  - **Analyze Command Line Arguments:** Investigate the command line used during the execution of "wusa.exe". Look for indicators such as the presence of '.msu' files and any unusual parameters that may signal malicious intent.

  - **Correlate with User Activity:** Check user activity in relation to the execution time of "wusa.exe". Look for any recent document openings or interactions that may have preceded the execution, as these can provide context on potential social engineering tactics used by attackers.

  - **Cross-reference with Existing Threat Intelligence:** Utilize threat intelligence resources to determine if there are known indicators or features associated with recent malware campaigns leveraging "wusa.exe," such as the Konni campaign mentioned in the references.

  ### Prioritization
  The high severity of this alert is warranted in an enterprise environment because executing "wusa.exe" from atypical directories may indicate an attempt to escalate privileges and compromise sensitive systems. The impact of such actions can be significant, resulting in unauthorized access to critical systems and data.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage arises if "wusa.exe" is executed from non-suspicious but still inappropriate locations, or in environments where legitimate installations occur frequently from these paths. The detection logic assumes that all instances originating from identified suspicious directories are malicious, which may not always be the case. To effectively generate alerts, proper logging of process creation events and command line arguments must be enabled and configured on endpoints to capture the necessary security telemetry.

