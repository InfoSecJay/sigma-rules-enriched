title: Suspicious Debugger Registration Cmdline
id: ae215552-081e-44c7-805f-be16f975c8a2
status: test
description: Detects the registration of a debugger for a program that is 
  available in the logon screen (sticky key backdoor).
references:
- https://blogs.technet.microsoft.com/jonathantrull/2016/10/03/detecting-sticky-key-backdoors/
- https://bazaar.abuse.ch/sample/6f3aa9362d72e806490a8abce245331030d1ab5ac77e400dd475748236a6cc81/
author: Florian Roth (Nextron Systems), oscd.community, Jonhnathan Ribeiro
date: 2019-09-06
modified: 2022-08-06
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.008
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains: '\CurrentVersion\Image File Execution Options\'
  selection2:
    CommandLine|contains:
    - 'sethc.exe'
    - 'utilman.exe'
    - 'osk.exe'
    - 'magnify.exe'
    - 'narrator.exe'
    - 'displayswitch.exe'
    - 'atbroker.exe'
    - 'HelpPane.exe'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the suspicious registration of a debugger for built-in Windows applications, particularly those that can be accessed at the logon screen, such as Sticky Keys (sethc.exe). Attackers may leverage this technique to maintain persistence and bypass login controls, effectively establishing a foothold on the system. The relevant MITRE ATT&CK tactic is "Persistence" and technique "Debuggers" (T1546.008).

  Primary telemetry sources include Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line arguments during process starts. A successful malicious incident could allow an adversary to escalate privileges and take full control of the machine, leading to significant security impacts. This detection alone does NOT confirm that an attack is occurring; it indicates a potentially suspicious activity warranting further investigation.

  ### Investigation Steps

  - **Verify Command Line Usage:** Review Security Event ID 4688 and Sysmon Event ID 1 for the command line strings. Look for entries containing `\CurrentVersion\Image File Execution Options\` alongside any of the keywords (e.g., `sethc.exe`, `utilman.exe`). Entries matching these criteria should be treated with high suspicion.

  - **Check for Legitimate Usage Patterns:** Compare the detected command lines against documented business processes and scripts in use. Legitimate administrative or accessibility tasks may use these commands, such as setting up accessibility features for authorized users.

  - **Assess Account Context:** Confirm the account under which the command was executed. High privilege accounts (e.g., Domain Admins) executing these commands should be further scrutinized, whereas entries from non-admin accounts may represent less risk but still require investigation.

  - **Analyze Related Event Logs:** Check the Windows Event Viewer for any anomalous login attempts or account lockouts (Event IDs 4625 and 4740). An uptick in these events could suggest an ongoing brute force or exploitation attempt.

  - **Evaluate System Integrity:** Use Sysinternals' Process Explorer to evaluate running processes and their command-line arguments. Investigate unexpectedly created processes or instances of the mentioned executables that don’t align with organizational policies.

  - **Correlate with Additional Anomalies:** Check for other indicators of compromise (IoCs) across the environment. Compare against threat intelligence feeds or previous alerts for known malicious artifacts or tactics related to unauthorized debugger registrations.

  ### Prioritization

  This alert is of high severity due to the potential for significant impact on affected systems, especially if linked to a privileged account. The likelihood of malicious exploitation is elevated, considering this technique is commonly weaponized in real-world attack scenarios to gain persistent access.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility that legitimate administrative actions by trusted users may trigger the alert, such as system configurations or accessibility changes. Reliable detection requires thorough logging of process creation across all endpoints and proper configuration of Sysmon. Additionally, the existence of remote access tools (RATs) may complicate this detection. A related detection to consider is monitoring for unusual network connections or outbound traffic from unusual processes, which can further strengthen monitoring capabilities around this type of activity.

