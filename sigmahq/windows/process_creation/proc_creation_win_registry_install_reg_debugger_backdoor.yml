title: Suspicious Debugger Registration Cmdline
id: ae215552-081e-44c7-805f-be16f975c8a2
status: test
description: Detects the registration of a debugger for a program that is available
  in the logon screen (sticky key backdoor).
references:
- https://blogs.technet.microsoft.com/jonathantrull/2016/10/03/detecting-sticky-key-backdoors/
- https://bazaar.abuse.ch/sample/6f3aa9362d72e806490a8abce245331030d1ab5ac77e400dd475748236a6cc81/
author: Florian Roth (Nextron Systems), oscd.community, Jonhnathan Ribeiro
date: 2019-09-06
modified: 2022-08-06
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.008
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains: '\CurrentVersion\Image File Execution Options\'
  selection2:
    CommandLine|contains:
    - 'sethc.exe'
    - 'utilman.exe'
    - 'osk.exe'
    - 'magnify.exe'
    - 'narrator.exe'
    - 'displayswitch.exe'
    - 'atbroker.exe'
    - 'HelpPane.exe'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the malicious registration of a debugger to processes associated with accessibility features in Windows, specifically targeting programs that are presented at the logon screen, such as Sticky Keys. Attackers can exploit these accessibility features to gain unauthorized access to a system, potentially leading to privilege escalation or persistent access. A common tactic is the manipulation of these processes to create backdoors or bypass authentication mechanisms.

  The primary MITRE ATT&CK techniques relevant to this detection include **Persistence (T1546.008)** and **Privilege Escalation (T1068)**. This highlights the intention of the attacker to maintain an ongoing foothold in the environment and elevate their access rights by leveraging system utilities that are typically trusted by users and system administrators.

  Key telemetry sources that provide critical evidence for these activities include Windows process creation logs, which capture events related to applications being executed and can reveal suspicious command-line arguments associated with legitimate system processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check system event logs specifically for process creation events that include command lines with the specified debugger registration paths. Look for any anomalies involving accessibility executables.

  - **Analyze Command-Line Arguments:** Investigate the context of the command-line executions for `sethc.exe` and other listed executables. Pay attention to any unusual parameters or execution patterns that deviate from normal usage.

  - **Check User Accounts Involved:** Determine which user accounts executed these suspicious processes. Identify if these accounts have elevated privileges or are typically not involved in executing these types of commands.

  - **Cross-Reference with Authentication Logs:** Correlate the process creation events with Windows authentication logs around the same time. This can help identify any failed or unusual logon attempts that coincide with the suspicious activity, indicating attempted access or a configured backdoor.

  ### Prioritization
  Due to the high-impact nature of a potential backdoor exploiting Windows accessibility features, this alert should be prioritized as high severity. An attacker utilizing these techniques can achieve persistent access, which significantly raises the risk profile for the organization.

  ### Blind Spots and Assumptions
  This detection may miss situations where the debugger registration occurs in ways not captured by standard logging configurations. There could be a reliance on processes that might not always be logged, such as systems with inadequate auditing enabled. The logic assumes that any command line including the specified strings indicates malicious intent; however, legitimate administrative actions may also trigger this rule if not properly contextualized. Proper Windows process logging must be enabled for this alert to function effectively.

