title: Rundll32 Spawned Via Explorer.EXE
id: 1723e720-616d-4ddc-ab02-f7e3685a4713
status: test
description: Detects execution of "rundll32.exe" with a parent process of Explorer.exe.
  This has been observed by variants of Raspberry Robin, as first reported by Red
  Canary.
references:
- https://redcanary.com/blog/raspberry-robin/
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: CD_ROM_
date: 2022-05-21
modified: 2023-08-31
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\explorer.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_generic:
  - CommandLine|contains: ' C:\Windows\System32\'       # The space at the start is required
  - CommandLine|endswith: ' -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'       # Windows 10 volume control
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of `rundll32.exe` when spawned by `explorer.exe`, which indicates a potentially malicious activity commonly associated with the Raspberry Robin malware variant. Attackers leveraging this technique typically aim to conduct defense evasion, execute malicious payloads, or perform reconnaissance within the compromised environment. By utilizing `rundll32.exe`, malicious actors can execute DLL files that may obfuscate their true intent and evade traditional security controls.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Tactic**: Defense Evasion
    - **Technique**: `T1203 - Exploitation for Client Execution`

  This detection primarily focuses on process creation events generated by the Windows operating system. The critical log sources provide evidence of the process hierarchy and command line parameters that can reveal anomalous behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events focusing on entries where `rundll32.exe` is launched by `explorer.exe`. Note any command lines that diverge from expected usage scenarios.
  - **Examine Command Line Arguments**: Investigate the complete command line arguments associated with the `rundll32.exe` execution, specifically looking for suspicious or unexpected DLL names or invocation details.
  - **Check for Parent-Child Process Relationships**: Evaluate the complete execution tree of `explorer.exe` to determine if additional child processes were spawned by `rundll32.exe`, indicating potential follow-on malicious activity.
  - **Correlate with Known Threat Intelligence**: Utilize threat intelligence feeds to identify if the observed behavior matches known indicators or signatures associated with Raspberry Robin or similar threats.

  ### Prioritization
  The severity of this alert is medium due to the potential risk that the execution of `rundll32.exe`, especially when initiated by `explorer.exe`, represents an attempt to bypass endpoint defenses and execute malicious payloads. Given the evolving nature of malware tactics, timely investigation is essential.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if users legitimately use `rundll32.exe` for benign tasks, as this rule may generate false positives. The logic assumes that all instances of `rundll32.exe` called from `explorer.exe` are suspicious; however, this activity may not always indicate malicious intent. For the alert to function effectively, comprehensive logging of process creations must be enabled, along with command line details, which may not be configured by default in all environments.

