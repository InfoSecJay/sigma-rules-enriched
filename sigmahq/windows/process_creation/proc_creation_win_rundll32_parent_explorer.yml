title: Rundll32 Spawned Via Explorer.EXE
id: 1723e720-616d-4ddc-ab02-f7e3685a4713
status: test
description: Detects execution of "rundll32.exe" with a parent process of 
  Explorer.exe. This has been observed by variants of Raspberry Robin, as first 
  reported by Red Canary.
references:
- https://redcanary.com/blog/raspberry-robin/
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: CD_ROM_
date: 2022-05-21
modified: 2023-08-31
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\explorer.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_generic:
  - CommandLine|contains: ' C:\Windows\System32\'       # The space at the start is required
  - CommandLine|endswith: ' -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'       # Windows 10 volume control
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of "rundll32.exe" initiated by "explorer.exe", a common behavior exploited by some malware variants, notably Raspberry Robin. The likely attacker objective is to execute malicious payloads through legitimate system processes to evade detection. This activity is associated with the MITRE ATT&CK technique for **Process Injection (T1055)**, under the tactic of **Execution**.

  The primary telemetry sources for this detection are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can facilitate unauthorized command execution, potentially leading to further compromise or data exfiltration. However, it's important to note that this detection alone does not prove malicious intent; it requires additional context and investigation to confirm malicious activity.

  ### Investigation Steps

  - **Check the process tree structure**: Use Sysmon Event ID 1 to review the parent-child relationship between processes. Legitimate execution typically shows "explorer.exe" as a parent for tasks like file opening or system operations, not unexpected executables appearing with no context.

  - **Analyze the command line arguments**: Examine Event ID 4688 for the "rundll32.exe" command line. A benign command line is usually straightforward, whereas malicious commands may include unusual GUIDs or unexpected parameters like `-localserver <GUID>`.

  - **Correlate with recent file changes**: Look for any new files or modifications in the directory where "rundll32.exe" was executed (i.e., C:\Windows\System32\). Unscheduled file changes may indicate suspicious activity.

  - **Review companion detections**: Check for other alerts related to "explorer.exe" launching unusual processes. Correlating findings with detection logs for lateral movement, such as **PowerShell (T1059.001)** activity, strengthens anomaly validation.

  - **Verify execution context**: Determine if the user account executing "explorer.exe" is legitimate or appropriate for the environment. Unusual users can indicate an elevated risk.

  - **Inspect for known malicious behavior**: Cross-reference the properties of "rundll32.exe" against threat intelligence sources to determine if the hashes or execution contexts match known malware signatures.

  ### Prioritization

  This alert is of medium severity in an enterprise context. If malicious, it indicates a potential compromise that could escalate privileges or facilitate lateral movement. While this behavior isn't universally weaponized, variants like Raspberry Robin exemplify its use in attacks, emphasizing the need for prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of process hollowing or other evasion techniques that obscure the actual execution of malicious code. A reliable detection setup requires full audit logging via Windows event logs, specifically configurations for process creation events. Legitimate software installations or updates may trigger this alert, particularly during system maintenance. Related detections, such as monitoring for **WMI Command Shell (T1047)** activity, can provide additional context to strengthen coverage against similar threats.

