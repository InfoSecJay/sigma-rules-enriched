title: Rundll32 Spawned Via Explorer.EXE
id: 1723e720-616d-4ddc-ab02-f7e3685a4713
status: test
description: Detects execution of "rundll32.exe" with a parent process of 
  Explorer.exe. This has been observed by variants of Raspberry Robin, as first 
  reported by Red Canary.
references:
- https://redcanary.com/blog/raspberry-robin/
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: CD_ROM_
date: 2022-05-21
modified: 2023-08-31
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\explorer.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter_main_generic:
  - CommandLine|contains: ' C:\Windows\System32\'       # The space at the start is required
  - CommandLine|endswith: ' -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'       # Windows 10 volume control
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances where `rundll32.exe` is executed by `explorer.exe`, which is indicative of potential misuse of the Windows utility to load DLLs. This method has been leveraged by various adversaries, including variants of Raspberry Robin, to execute malicious payloads. The primary objective is to facilitate the execution of hidden or unauthorized code on the system, thereby enabling further actions such as lateral movement or data exfiltration.

  This behavior corresponds to the MITRE ATT&CK framework under the tactic of Defense Evasion (TA0005) and the technique of Obfuscated Files or Information (T1027). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details on process creation events. If executed maliciously, this could lead to significant security impacts, including system compromise and unauthorized data access. Note that this detection does NOT confirm malicious activity on its own, as legitimate applications may also use `rundll32.exe` in similar contexts.

  ### Investigation Steps

  - **Analyze process creation logs**: Review Security Event ID 4688 logs for the creation of `rundll32.exe` with `explorer.exe` as the parent process. Compare timestamps and user accounts to identify potential malicious activity.

  - **Inspect the command line**: Check for command line arguments associated with the `rundll32.exe` process. Look for unusual or non-standard parameters, especially those containing `-localserver`, as seen in the rule. Legitimate usages should not typically include these arguments.

  - **Correlate with Sysmon events**: Utilize Sysmon Event ID 1 for additional context around the process execution. Specifically verify `SourceImage`, `TargetImage`, and `CommandLine` fields to determine if the paths and execution context are consistent with known benign usage.

  - **Identify known benign usages**: Recognize legitimate processes that invoke `rundll32.exe`, such as system apps or scheduled tasks. If the parent process or command line matches any known benign applications, it may indicate normal operation.

  - **Review recent changes to the environment**: Check for any recent modifications to system configurations or patches that may impact process behavior. Sudden spikes in `rundll32.exe` executions could indicate exploitation attempts.

  - **Confirm external indicators of compromise**: Utilize threat intelligence or established indicators related to Raspberry Robin or similar adversarial frameworks. Identify any known hashes or behaviors linked to the usage of `rundll32.exe`.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on endpoint integrity and the likelihood of adversary exploitation. Given that the execution method has been associated with known attacks, the presence of this activity warrants prompt investigation, especially on critical systems.

  ### Blind Spots and Assumptions

  Evasion techniques for this detection might include the use of alternate or renamed executables to achieve similar outcomes while avoiding traditional detection methods. The effective capture of this behavior requires proper configuration of telemetry, particularly enabling detailed process creation logging. Legitimate activities may trigger this alert, especially in environments utilizing `rundll32.exe` for legitimate applications or maintenance tasks. A related detection for additional contextual awareness could involve monitoring for unusual DLL loads or unscheduled task executions targeting sensitive systems.

