logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli_1:
        # Example: netsh firewall set opmode disable
    CommandLine|contains|all:
    - 'firewall'
    - 'set'
    - 'opmode'
    - 'disable'
  selection_cli_2:
        # Example: netsh advfirewall set currentprofile state off
    CommandLine|contains|all:
    - 'advfirewall'
    - 'set'
    - 'state'
    - 'off'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate administration activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `netsh.exe` commands that disable the Windows Firewall, a crucial security control. The likely attacker objective for this behavior is to reduce the system's security posture, making it easier to conduct malicious activities such as lateral movement or exploitation of services. This activity corresponds to the MITRE ATT&CK techniques of Defense Evasion (T1562.004) and, more broadly, Impairment of Defense Mechanisms (T1686.003).

  The primary telemetry sources for this detection are Windows process creation events, specifically looking for Security Event ID 4688 (Process Creation) and associated Sysmon Event ID 1 (Process Creation). If malicious, disabling the firewall can significantly increase the risk of successful attacks or breaches. It is important to note that this detection does NOT confirm malicious action on its own; legitimate administrative activities may trigger this alert.

  ### Investigation Steps

  - **Examine Process Creation Events**: Review Security Event ID 4688 and Sysmon Event ID 1 for `netsh.exe` execution. Validate the user and context to differentiate between benign administrative activity and potential misuse.

  - **Assess Command Line Arguments**: Look for command lines containing 'firewall' and 'disable' (e.g., `netsh advfirewall set currentprofile state off`). Confirm if the arguments match the detected event and check timestamps against other security logs for context.

  - **Check User Role and Activity**: Identify the user ID executing the command. A non-administrative account executing this command is a high-confidence indicator of potential compromise. Compare their recent activity to the expected roles and responsibilities.

  - **Identify Firewall State Before and After**: Query Windows Firewall settings using PowerShell (e.g., `Get-NetFirewallProfile`). If the firewall is in a disabled state following the command execution and should normally be enabled, this strengthens malicious suspicion.

  - **Correlate with Other Security Alerts**: Look for corresponding events in Windows Security logs that indicate unusual patterns, such as multiple failed login attempts or changes in system settings around the same time.

  - **Document Legitimate Administrative Actions**: Determine if any scheduled maintenance or documented changes were planned that might justify the firewall being disabled, and ensure these actions align with organizational policies.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of disabling the firewall on the affected system. While the firewall covers entry points that adversaries may utilize, the likelihood of this behavior indicating malicious intent is non-negligible, especially if coupled with unusual account activity. This technique is commonly weaponized by attackers to facilitate further actions following initial compromise.

  ### Blind Spots and Assumptions

  This detection may have limitations due to legitimate administrative tasks performed by IT staff that involve disabling the firewall temporarily. Reliable detection requires appropriate logging configurations for process creation events and may miss actions taken by users with sufficient privileges if logging is inadequate. Activities such as script executions or PowerShell commands that modify firewall settings may be related and warrant investigation as companion detections.

