title: Firewall Disabled via Netsh.EXE
id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
status: test
description: Detects netsh commands that turns off the Windows firewall
references:
- https://www.winhelponline.com/blog/enable-and-disable-windows-firewall-quickly-using-command-line/
- https://app.any.run/tasks/210244b9-0b6b-4a2c-83a3-04bd3175d017/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.004/T1562.004.md#atomic-test-1---disable-microsoft-defender-firewall
author: Fatih Sirin
date: 2019-11-01
modified: 2023-02-13
tags:
- attack.defense-evasion
- attack.t1562.004
- attack.s0108
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli_1:
        # Example: netsh firewall set opmode disable
    CommandLine|contains|all:
    - 'firewall'
    - 'set'
    - 'opmode'
    - 'disable'
  selection_cli_2:
        # Example: netsh advfirewall set currentprofile state off
    CommandLine|contains|all:
    - 'advfirewall'
    - 'set'
    - 'state'
    - 'off'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate administration activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the Windows firewall is disabled via the `netsh.exe` command-line utility. Such activity can signify that an attacker is attempting to reduce the security posture of the machine, making it easier for malicious traffic to enter or exit the network. Attackers may disable firewalls to facilitate lateral movement or introduce unauthorized applications to a compromised system.

  The relevant MITRE ATT&CK tactics associated with this rule include **Defense Evasion** (TA0005) and specifically the technique **T1562.004: Disable Windows Defender Firewall**. Attackers may employ this technique to avoid detection by security measures in place, aiming to create an environment where their actions remain unnoticed.

  Primary data sources for detecting this behavior include **process creation logs** from Windows, which will capture the execution of `netsh.exe` along with its command-line arguments. Monitoring these logs allows security teams to spot potential unauthorized modifications to system settings.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs to identify instances of `netsh.exe` execution. Look for entries that match the rule's detection logic to confirm if firewall disabling has occurred.

  - **Analyze Command-Line Arguments:** Focus on command-line arguments associated with `netsh.exe`. Identify any commands that indicate attempts to disable the firewall, specifically looking for patterns such as "firewall set opmode disable" or "advfirewall set state off."

  - **Investigate User Context:** Determine the user context under which `netsh.exe` was executed. Investigate whether the command was run by an authorized administrator or by an account that typically wouldn’t perform such an action, suggesting a potential compromise.

  - **Cross-Reference with Other Security Logs:** Validate the findings with other security sources such as EDR logs or firewall logs to identify any subsequent suspicious network activity that may correlate with the command execution.

  ### Prioritization
  This alert is prioritized as **medium severity** due to its potential impact on the organization's network security. Disabling the firewall can lead to significant vulnerabilities, allowing unauthorized access or communication; however, it could also be part of legitimate administrative actions.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes scenarios where attackers may use alternate methods to disable the firewall, such as utilizing scripts or other administrative tools not captured by this specific detection rule. The alert assumes that the appropriate logging is enabled and that all instances of `netsh.exe` execution are being captured effectively. Without comprehensive process creation logging, the detection may fail to trigger during an attack.

