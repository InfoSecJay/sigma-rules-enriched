title: Firewall Disabled via Netsh.EXE
id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
status: test
description: Detects netsh commands that turns off the Windows firewall
references:
- https://www.winhelponline.com/blog/enable-and-disable-windows-firewall-quickly-using-command-line/
- https://app.any.run/tasks/210244b9-0b6b-4a2c-83a3-04bd3175d017/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.004/T1562.004.md#atomic-test-1---disable-microsoft-defender-firewall
author: Fatih Sirin
date: 2019-11-01
modified: 2023-02-13
tags:
- attack.defense-evasion
- attack.t1562.004
- attack.s0108
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli_1:
        # Example: netsh firewall set opmode disable
    CommandLine|contains|all:
    - 'firewall'
    - 'set'
    - 'opmode'
    - 'disable'
  selection_cli_2:
        # Example: netsh advfirewall set currentprofile state off
    CommandLine|contains|all:
    - 'advfirewall'
    - 'set'
    - 'state'
    - 'off'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Legitimate administration activity
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the `netsh.exe` command-line tool to disable the Windows Firewall, an action typically associated with evading detection or facilitating lateral movement within a network. The likely attacker objective is to weaken system defenses by disabling critical security controls. This behavior is mapped to the MITRE ATT&CK technique T1562.004 (Impair Defenses: Disable or Modify Tools).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture detailed command execution actions. If malicious, disabling the firewall can significantly increase the risk of malware infections or unauthorized access. However, it is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative activities may also result in similar commands being executed.

  ### Investigation Steps

  - **Check recent Windows events for netsh execution:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for instances where `netsh.exe` was executed. Look for a command line containing "firewall" or "advfirewall" with "disable" or "off."

  - **Investigate user and process context:** Validate the user account that executed the command and the process tree. Legitimate administrative accounts often execute such commands on endpoints during maintenance, whereas unfamiliar accounts may indicate potential malicious activity.

  - **Correlate with other security controls:** Cross-reference this alert with other security appliance logs, such as IDS/IPS or EDR, to identify any associated suspicious behaviors, like unexpected network connections following the command execution.

  - **Identify system roles affected:** Prioritize investigations on critical asset roles, such as servers hosting sensitive applications or those with sensitive data. Any instance of the Windows Firewall being disabled on these hosts should be escalated immediately.

  - **Assess for indicators of compromise (IoCs):** Look for concurrent alerts or logs showing unusual outbound traffic or unauthorized changes to system configurations shortly after the firewall was disabled.

  ### Prioritization

  This alert is of medium severity, given the potential impact of disabling the firewall on critical systems and its frequent usage by attackers to facilitate further actions. While this behavior is not commonly routine, when observed, it raises significant concerns about possible ongoing malicious activity or advanced persistent threats.

  ### Blind Spots and Assumptions

  Detection may miss instances where the firewall is disabled via alternative methods or tools. Adequate logging must be enabled on systems to capture process creation events effectively. Common legitimate activities that may trigger this alert include routine maintenance or troubleshooting by IT staff. It is advisable to have companion detections for abnormal network traffic over the same timeline to strengthen coverage against potential exploitation.

