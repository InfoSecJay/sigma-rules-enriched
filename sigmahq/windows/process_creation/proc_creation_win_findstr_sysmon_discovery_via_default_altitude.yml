level: high
note: |
  ### Technical Context
  This detection rule identifies instances of the `findstr.exe` command being used with the argument "385201", which may indicate an attacker attempting to discover the Sysinternals Sysmon service. Sysmon is often used in environments for advanced logging of process creation, network connections, and more, making it a target for attackers looking to evade detection or analyze the environment.

  The likely attacker objective in this scenario is to ascertain the existence of the Sysmon service, which could lead to further exploitation opportunities. By identifying this service, an attacker may seek to disable it, modify configurations, or alter the way their activities are logged, thereby improving their chances of remaining undetected.

  This alert corresponds to the MITRE ATT&CK tactics of Discovery, specifically the technique ID T1518.001 - "Security Software Discovery". The main data source for this detection is process creation log data, which records command-line arguments used within the Windows environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs from systems where this alert has been triggered, focusing on instances of `findstr.exe` or `find.exe`, including their command-line arguments and timestamps to establish context around the discovery attempt.
  - **Check for Sysmon Service Status**: Validate whether the Sysmon service is running on the concerned systems. Investigate if there were any attempts to disable or modify Sysmon settings immediately following the discovery query.
  - **Correlate with Other Discovery Techniques**: Investigate other logs that may indicate additional enumeration or discovery attempts, such as PowerShell execution logs or network connections to potentially suspicious IP addresses that could suggest an intrusion attempt.
  - **Assess User Account Activity**: Identify the user accounts that executed the `findstr` command. Determine any unusual patterns of activity associated with these accounts, including command frequency and other commands executed around the same timeframe.

  ### Prioritization
  This alert is of high severity due to its potential implications for the security posture of the enterprise. If an attacker is actively attempting to discover and manipulate security monitoring tools like Sysmon, it raises concerns about their intentions and capabilities within the network.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if the `findstr.exe` command is executed with different arguments or not logged correctly by the process creation logging mechanism. The detection logic assumes that execution of `findstr.exe` with the specific argument "385201" is limited to malicious intent, potentially overlooking benign use cases. Proper logging of process creation events must be configured on all endpoints for this detection to function effectively; otherwise, legitimate actions may go unnoticed.

