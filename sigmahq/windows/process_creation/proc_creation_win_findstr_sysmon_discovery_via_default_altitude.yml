logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\find.exe'
    - '\findstr.exe'
  - OriginalFileName:
    - 'FIND.EXE'
    - 'FINDSTR.EXE'
  selection_cli:
    CommandLine|contains: ' 385201'     # Sysmon driver default altitude
  condition: all of selection_*
falsepositives:
