note: |
  ### Technical Context

  This rule detects the execution of `findstr.exe` with the specific command line argument "385201". This behavior is indicative of an attacker conducting reconnaissance to locate the Sysinternals Sysmon service, leveraging the default driver altitude. The likely objective is to assess system configurations and identify security monitoring tools present in the environment. This activity aligns with the MITRE ATT&CK tactics of “Discovery” (TA0007) and the specific technique “Security Software Discovery” (T1518.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture process creation events and command line execution details. If malicious, the security impact could be significant as it may lead to evasion of security monitoring if attackers manipulate or disable Sysmon. However, this detection alone does not confirm malicious intent, as legitimate administrative activities may utilize similar commands.

  ### Investigation Steps

  - **Review process creation logs for `findstr.exe`:** Check Security Event ID 4688 or Sysmon Event ID 1, filtering for command line arguments including "385201". This identifies potential malicious activity that needs further scrutiny.

  - **Identify command line context:** Analyze the full command line of the detected event for any additional arguments or parent process anomalies. Legitimate usage typically does not include obscure arguments related to Sysmon.

  - **Correlate with scheduled tasks or scripts:** Investigate if the `findstr` command was triggered by a scheduled task or script by checking for any linked events associated with Task Scheduler (Event ID 106) to identify potential persistence mechanisms.

  - **Check for errant processes:** Validate if the `findstr` process is being executed by a known user or service account with appropriate permissions. Unusual execution by non-administrative users can be a strong indicator of malicious intent.

  - **Review security software logs:** Inspect logs from existing security tools (e.g., EDR) employed on the system for alerts or logs that correlate with `findstr` executions or attempts to access Sysinternals artifacts.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on the security posture of the enterprise if an attacker attempts to disable or bypass Sysmon. The likelihood of malicious abuse is elevated, as this behavior is linked to reconnaissance tactics commonly associated with advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Detection may be limited if process execution logs are not comprehensive or if `findstr` is executed through a legitimate process. Additionally, if administrative scripts commonly use this command for benign purposes, it could lead to false positives. Ensuring proper configurations and log collection is essential for accurate detection. Companion detection rules surrounding script execution (e.g., PowerShell command invocations) can enhance overall security visibility and context for this activity.

