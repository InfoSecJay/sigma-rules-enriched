logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\verclsid.exe'
  - OriginalFileName: 'verclsid.exe'
  selection_cli:
    CommandLine|contains|all:
    - '/S'
    - '/C'
  filter_main_runtimebroker:
    ParentImage|endswith: 'C:\Windows\System32\RuntimeBroker.exe'
    CommandLine|contains|all:
    - 'verclsid.exe" /S /C {'
    - '} /I {'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `verclsid.exe`, a Windows utility that can be exploited to run COM objects via GUIDs. Attackers may use this tool to leverage COM hijacking techniques for executing malicious payloads or for persistence mechanisms. The relevant MITRE ATT&CK technique is T1218 - Signed Binary Proxy Execution. The primary telemetry source is Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1.

  If exploited maliciously, this behavior may allow an adversary to execute unauthorized code in a manner that may bypass certain defenses due to the use of a trusted binary. However, this detection does NOT confirm that the action is inherently malicious; legitimate software behaviors may also employ this method for valid purposes.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for `verclsid.exe` execution. Look for the command line to contain `/S /C` parameters, which are often indicators of misuse.

  - **Evaluate parent processes**: Determine if `verclsid.exe` was launched by `RuntimeBroker.exe`. Malicious instances often have unexpected parent processes. If the parent process differs from `C:\Windows\System32\RuntimeBroker.exe`, this is anomalous and may indicate malicious activity.

  - **Correlate GUID usage**: Analyze the command line for specific GUIDs used with `verclsid.exe`, such as indications of known malicious COM objects. A comparison against expected benign GUIDs can help identify potential misuse.

  - **Identify legitimate usage patterns**: Standard administrative tasks involving `verclsid.exe` may include application compatibility testing or COM registration. Validate the context in which `verclsid.exe` was executed, ensuring it aligns with expected administrative activities.

  - **Inspect file creations**: Investigate related file creation or modification events on the system post-execution (using Event ID 4663) to check for any unauthorized or suspicious files created by the process.

  - **Confirm host role validity**: Assess whether the host where the alert was triggered typically runs applications or services that might legitimately use `verclsid.exe`. Anomalies on critical servers may heighten concern for malicious activity.

  ### Prioritization

  The alert level is medium due to the potential security implication of executing COM objects, which can be weaponized for lateral movement and persistence. The target system’s role—especially if it is a critical workstation or server—can compound the risk. Given that this technique has been observed in various attacks, the likelihood of malicious abuse is significant.

  ### Blind Spots and Assumptions

  The detection may miss execution attempts where `verclsid.exe` is not used, or where command line parameters are altered to evade detection. Proper logging configurations (Sysmon and Windows Event logs) are essential for reliable detection and should be validated regularly. Legitimate software installation processes or administrative updates may trigger this rule, so context is vital. Companion detections for actions involving GUID resolutions or unusual COM activity (e.g., direct use of COM APIs) can complement coverage.

