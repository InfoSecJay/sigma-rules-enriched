logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\verclsid.exe'
  - OriginalFileName: 'verclsid.exe'
  selection_cli:
    CommandLine|contains|all:
    - '/S'
    - '/C'
  filter_main_runtimebroker:
    ParentImage|endswith: 'C:\Windows\System32\RuntimeBroker.exe'
    CommandLine|contains|all:
    - 'verclsid.exe" /S /C {'
    - '} /I {'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where `verclsid.exe`, a Windows utility for handling COM objects, is used to run a command with a specific structure that potentially indicates an abuse of the COM registry structure. Attackers may leverage `verclsid.exe` as a means to execute malicious code under the guise of legitimate system activity, often aiming to bypass security controls and maintain persistence within an environment. The likelihood of such tactics being employed suggests that the rule targets adversaries attempting to evade detection by using trusted system processes.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (TA0005)
  - **Abuse Elevation Control Mechanism** (T1218)

  Key data sources that will provide the necessary evidence for this detection include process creation logs, which track when `verclsid.exe` is executed, alongside details about command line arguments and parent processes that initiated the execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for `verclsid.exe` executions to find instances that match the detection criteria, focusing on command line arguments and parent processes.
  - **Examine Parent Process**: Investigate any parent process that runs `verclsid.exe`, particularly instances where `RuntimeBroker.exe` is the parent, to establish context around the execution.
  - **Check for Unusual Command Line Arguments**: Look for command line patterns containing `/S` and `/C` which may indicate automated scripts or potentially malicious activity. Ensure to assess any GUID-like structures in the command.
  - **Correlate with Known COM Abuse Techniques**: Utilize available threat intelligence regarding COM object abuse, focusing on signatures or behavior patterns that align with tactics detailed in the referenced materials.

  ### Prioritization
  The rule is of **medium severity** as it detects a method employed by attackers to execute arbitrary commands under a trusted system process, which could lead to significant compromise if not addressed. Given the potential for a successful exploit to grant further access, timely investigation is crucial.

  ### Blind Spots and Assumptions
  One major gap in detection coverage is the reliance on the existence of process creation logs, which may not capture all instances of `verclsid.exe` usage, especially if the local logging configuration is insufficient. The detection logic assumes that execution via `RuntimeBroker.exe` is nefarious, despite the possibility of legitimate uses. For the alert to function effectively, adequate logging of command line arguments and parent-child process relationships must be enabled on Windows systems.

