title: Verclsid.exe Runs COM Object
id: d06be4b9-8045-428b-a567-740a26d9db25
status: test
description: Detects when verclsid.exe is used to run COM object via GUID
references:
- https://lolbas-project.github.io/lolbas/Binaries/Verclsid/
- https://gist.github.com/NickTyrer/0598b60112eaafe6d07789f7964290d5
- https://bohops.com/2018/08/18/abusing-the-com-registry-structure-part-2-loading-techniques-for-evasion-and-persistence/
author: Victor Sergeev, oscd.community
date: 2020-10-09
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\verclsid.exe'
  - OriginalFileName: 'verclsid.exe'
  selection_cli:
    CommandLine|contains|all:
    - '/S'
    - '/C'
  filter_main_runtimebroker:
    ParentImage|endswith: 'C:\Windows\System32\RuntimeBroker.exe'
    CommandLine|contains|all:
    - 'verclsid.exe" /S /C {'
    - '} /I {'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `verclsid.exe` with specific command line arguments that indicate an attempt to run a COM object via a GUID. An attacker may utilize this technique to execute malicious code, bypass security controls, or maintain persistence in the environment. The relevant MITRE ATT&CK tactic is **Defense Evasion** and technique **T1218: Signed Binary Proxy Execution**.

  The primary telemetry sources include Windows Process Creation logs, specifically Security Event ID **4688** and Sysmon Event ID **1**, which provide insights into process creation events. If malicious, this could lead to unauthorized actions on the system or lateral movement within the network. It is important to note that detection of this behavior does NOT confirm malicious intent; legitimate applications may also utilize `verclsid.exe` for valid purposes.

  ### Investigation Steps

  - **Check process details:** Review the execution of `verclsid.exe` using Security Event ID **4688** or Sysmon Event ID **1**. Look for specific command line arguments, such as `/S` and `/C`, and correlate with the parent process to assess context.

  - **Examine parent process:** Investigate the parent process for the `verclsid.exe` execution. Ensure that it is not being spawned by legitimate processes like `RuntimeBroker.exe` to differentiate potentially malicious behavior from legitimate use cases.

  - **Assess command line contents:** Analyze command line arguments for unusual content, especially the GUIDs being referenced. Legitimate executions will typically involve known and expected COM objects, whereas unknown or suspicious GUIDs may indicate a potential attack.

  - **Review recent changes:** Check for recent changes in COM registrations or usage patterns, including Event Logs related to COM activity. This might highlight unusual registrations that could be linked to the suspected activity.

  - **Identify known malicious GUIDs:** Correlate against threat intelligence sources for known malicious GUIDs that could be exploited by `verclsid.exe`. Documentation of malicious GUIDs can assist in identifying high-confidence malicious indicators.

  ### Prioritization

  This alert holds a medium severity based on the capability of the affected system to run malicious code via COM objects, which could lead to significant compromise. Given the prevalence of defense evasion techniques leveraging `verclsid.exe`, the likelihood of malicious abuse is notable, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of benign COM operations that also trigger this rule. Log sources such as Windows Event Logs and Sysmon must be properly configured to ensure comprehensive coverage. Legitimate software installers or configuration changes may also invoke this process, potentially resulting in false positives. Companion detection rules for related techniques (e.g., monitoring for unusual COM object registrations) can enhance coverage and reduce false negatives.

