detection:
  selection_account:
    CommandLine|contains:
    - ' /account=system '
    - ' /account=ti '
  selection_exec:
    CommandLine|contains: '/exec='
  condition: all of selection_*
falsepositives:
- Legitimate use by administrators
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of commands via the RunXCmd tool employing either the System or TrustedInstaller accounts. The behavior typically indicates an attempt to execute potentially unauthorized commands with elevated privileges, which could lead to system misconfigurations, data breaches, or lateral movement within the network. The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and the technique **User Execution** (T1569.002).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688, which captures the command-line arguments used during process initiation. If the detected activity is malicious, it could signify an adversary attempting to manipulate system functions or exfiltrate data. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also utilize RunXCmd for remote command execution.

  ### Investigation Steps

  - **Identify command execution events:** Review Windows Security Event ID 4688 logs for process creation events where CommandLine includes `RunXCmd`. Investigate the process ID and parent process to distinguish potentially malicious executions.

  - **Verify account used for execution:** Check the fields in the log for the account specified in the CommandLine. Legitimate use may occur under administrative accounts; however, executions under 'system' or 'ti' accounts warrant further analysis.

  - **Correlate with other security events:** Examine related telemetry from Sysmon (Event ID 1) and Windows Event Logs to identify any anomalies, such as connections to suspicious IP addresses or changes to critical system files that coincide with the RunXCmd execution.

  - **Assess for malicious patterns:** Look for CommandLine entries where `/exec=` is used, especially when executed from unexpected locations, like user profiles or temporary folders, which is common in malicious activity.

  - **Review historical context:** Analyze previous command execution logs for the same account or host to establish a behavioral baseline. Legitimate administrators typically have a consistent set of command patterns that differ from those used by attackers.

  - **Check for file modification indicators:** Validate for file activities that may have been executed as a result of `RunXCmd`. Investigate creation/modification timestamps of system files and any corresponding Event IDs related to file access (e.g., Event ID 4663 for file modifications).

  ### Prioritization

  This alert should be considered high severity as it involves elevated system accounts executing commands that could lead to significant risk for the enterprise. The likelihood of malicious abuse is elevated due to the stealthy nature of tools like RunXCmd, which are often weaponized in advanced attacks for privilege escalation and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper logging configurations or if logs are not aggregated effectively. Legitimate administrative tasks, such as system maintenance, may trigger this alert, potentially leading to false positives. Additionally, an adversary might use other tools or techniques to execute commands with elevated privileges that bypass detection; thus, companion detections like process injection or remote execution should also be in place to enhance overall coverage.

