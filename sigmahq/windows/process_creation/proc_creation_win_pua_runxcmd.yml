  ---

  ### Technical Context

  This Sigma rule detects the use of the RunXCmd tool to execute commands with elevated privileges, specifically under the System and TrustedInstaller accounts. The likely objective of an attacker leveraging this tool would be to execute malicious commands while avoiding detection, using these high-privileged accounts to bypass security measures. The relevant MITRE ATT&CK tactic is Execution, with the associated technique being "Command and Scripting Interpreter" (T1059) and "Command-Line Interface" (T1203).

  The primary telemetry sources for this detection are Windows process creation logs, particularly focusing on CommandLine arguments. If malicious, the impact could include unauthorized system changes, malware installation, or exfiltration of data. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may involve similar command executions.

  ---

  ### Investigation Steps

  - **Review command line arguments**: Identify instances where the CommandLine contains '/account=system' or '/account=ti' alongside '/exec='. Verify the context and necessity of these commands against expected operational behaviors.

  - **Correlate with process creation events**: Examine Security Event ID 4688 logs. Check for the creation of processes by non-standard executables or unusual parent processes (e.g., nothing should spawn a command execution tool like RunXCmd without a valid operational reason).

  - **Assess user context**: Check the user account that executed RunXCmd; logins under low-risk administrative accounts might be legitimate while unauthorized access patterns indicate potential compromise.

  - **Investigate system logs for similar activity**: Analyze Sysmon Event ID 1 and Windows Event IDs related to high-privilege executions. Look for patterns in timestamps and environment to indicate bulk execution or combinatorial attempts, which are typical of adversarial behavior.

  - **Identify known benign usage**: Validate recent legitimate administrative actions that used similar command patterns, such as system maintenance or software updates, correlating dates and times to ascertain normal operations.

  - **Search for other remediation signals**: Review security logs for any file access or changes made by the processes initiated by RunXCmd. Look for new file creations or modifications that align closely with the execution time to identify unauthorized data manipulation or potential C2 communications.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential for significant impact on system integrity, especially if triggered on critical infrastructure. The use of tools like RunXCmd is often weaponized by adversaries, heightening the likelihood of malicious abuse and necessitating immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection might be limited by potential evasion techniques, such as using alternative tools or disguising the command syntax. Reliable detection requires comprehensive logging configuration for process creation and elevated account usage. Legitimate administrative tasks, especially in systems management, may trigger the alert. Companion detections to consider include monitoring for abnormal application behavior (e.g., frequent subprocess creation or anomalous API calls) to strengthen adversary activity coverage.

