logsource:
  category: process_creation
  product: windows
detection:
  selection_account:
    CommandLine|contains:
    - ' /account=system '
    - ' /account=ti '
  selection_exec:
    CommandLine|contains: '/exec='
  condition: all of selection_*
falsepositives:
- Legitimate use by administrators
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the RunXCmd tool, which allows users to execute commands with elevated privileges, specifically leveraging the System or TrustedInstaller accounts on Windows systems. The primary threat scenario involves attackers attempting to gain unauthorized access to sensitive system-level functionalities or configurations by executing arbitrary commands with these high-stakes accounts. This behavior is often part of lateral movement or privilege escalation tactics, aligning with malicious activities that aim to maintain persistence or control over a target environment.

  Relevant MITRE ATT&CK tactics for this detection include **Execution** (T1203) through the execution of user-added commands in a privileged context, and **System Information Discovery** (T1082) if attackers are using these elevated commands to gather information about the system environment. Additionally, the tool's actions may tie into technique **T1569.002: Command and Scripting Interpreter: Windows Command Shell** and **T0029: Command-line Interface (CLI)**. The primary data sources for effective detection include process creation events from Windows logs, which provide details about command line executions, along with associated user account information.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for any instances of RunXCmd execution by reviewing Windows process creation logs for command lines containing '/account=system', '/account=ti', and '/exec=' to identify any suspicious executions.

  - **Analyze User Accounts:** Investigate the accounts executing the commands. Any use of System or TrustedInstaller accounts should be evaluated closely, particularly for commands executed without a justified administrative context.

  - **Correlate with Other Logs:** Collect and analyze additional logs such as security event logs and application logs to correlate any detected RunXCmd executions with other potentially malicious activity within the environment.

  - **Assess Network Activity:** Review network activity logs for any unusual outbound connections associated with the times RunXCmd was executed, as attackers may use this tool as part of a broader campaign involving command and control infrastructure.

  ### Prioritization
  The severity of this alert is high due to the potential for severe impact; the use of elevated privileges could allow attackers to execute harmful commands, modify system configurations, or even disable security controls, all of which could lead to significant data breaches and system compromises.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the legitimate use of the RunXCmd tool by system administrators for administrative tasks, which could result in false positives. The detection logic assumes that any execution of commands with these specific account types is indicative of malicious intent. Effective detection hinges on the availability of comprehensive process creation logs; if these logs are not captured or if there are auditing gaps in command executions, some legitimate or malicious usages may go undetected.

