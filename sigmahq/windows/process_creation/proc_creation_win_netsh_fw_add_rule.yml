title: New Firewall Rule Added Via Netsh.EXE
id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
status: test
description: Detects the addition of a new rule to the Windows firewall via netsh
references:
- https://web.archive.org/web/20190508165435/https://www.operationblockbuster.com/wp-content/uploads/2016/02/Operation-Blockbuster-RAT-and-Staging-Report.pdf
author: Markus Neis, Sander Wiebing
date: 2019-01-29
modified: 2023-02-10
tags:
- attack.defense-evasion
- attack.t1562.004
- attack.s0246
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' firewall '
    - ' add '
  filter_optional_dropbox:
    CommandLine|contains:
    - 'advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program
      Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any'
    - 'advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program
      Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activity
- Software installations
level: medium
note: |
  ### Technical Context
  This detection rule identifies the addition of new firewall rules on Windows systems using the `netsh.exe` command-line utility. The act of adding rules can indicate potential malicious behavior, such as an attacker seeking to bypass security controls by allowing specific network traffic, particularly if done without proper authorization or in a suspicious context. Intruders may exploit this capability to facilitate command and control communications, exfiltrate data, or obfuscate their activities within an organization’s network.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (TA0005)** and **Application Layer Protocol (T1562.004)**, as the attackers may be attempting to evade network security measures. The detection relies primarily on process creation events, particularly those that capture command-line activity of `netsh.exe`, which is commonly used for network configuration tasks in Windows.

  To support the detection, primary data sources include Windows event logs that capture process creation activities (`Event ID 4688`), which will provide information about commands executed, along with any associated command-line parameters that might indicate malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows security logs (`Event ID 4688`) to identify instances where `netsh.exe` was executed. Pay close attention to the command-line arguments to determine if they pertain to suspicious firewall rule additions.

  - **Check for Unusual IP Traffic**: Analyze network traffic logs for any unusual outbound connections that may correspond to the rules added via `netsh.exe`. Look for traffic to unrecognized or uncommon external IP addresses, particularly those that could relate to command and control servers.

  - **Validate Change Management Policies**: Cross-reference the firewall rule changes with internal change management records. Ensure that they were approved and documented as part of legitimate system administration practices.

  - **Investigate User Activity**: Identify the user account or system that executed the command. Analyze their recent activities and privileges to determine if they align with expected behavior from that account, particularly if it is a non-administrative user making these changes.

  ### Prioritization
  This alert should be treated with medium severity as it indicates potential unauthorized attempts to modify firewall settings. The impact of these changes can lead to significant security vulnerabilities, particularly in environments with a strict security posture.

  ### Blind Spots and Assumptions
  The main gaps in detection coverage may arise if logging for process creation events is not enabled or if the `netsh.exe` utility is legitimately used for routine administrative tasks, leading to potential false positives. The detection logic assumes that any addition of firewall rules without proper context or authorization should be flagged. Consequently, it is essential to ensure that system auditing is properly configured to capture all relevant events, including the detailed command-line arguments of executed processes.

