title: New Firewall Rule Added Via Netsh.EXE
id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
status: test
description: Detects the addition of a new rule to the Windows firewall via 
  netsh
references:
- https://web.archive.org/web/20190508165435/https://www.operationblockbuster.com/wp-content/uploads/2016/02/Operation-Blockbuster-RAT-and-Staging-Report.pdf
author: Markus Neis, Sander Wiebing
date: 2019-01-29
modified: 2023-02-10
tags:
- attack.defense-evasion
- attack.t1562.004
- attack.s0246
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' firewall '
    - ' add '
  filter_optional_dropbox:
    CommandLine|contains:
    - 'advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program
      Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any'
    - 'advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program
      Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activity
- Software installations
level: medium
note: |
  ### Technical Context

  This detection rule identifies the addition of new firewall rules on a Windows system via the `netsh.exe` utility. The likely attacker objective could include bypassing security controls, enabling persistence, or allowing outbound connections for exfiltration or command and control (C2) communications. This activity relates to the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Application Layer Protocol" (T1562.004). The primary telemetry source is process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, along with command-line arguments. If this activity is malicious, it can allow unauthorized access and control over the system, leading to data leaks or further compromise. However, this detection alone does not confirm malicious intent; legitimate administrative changes or software installations may trigger similar logs.

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Windows Security Event ID 4688 or Sysmon Event ID 1 logs for process creation of `netsh.exe`. Confirm the command line contains “firewall add” to correlate with the alert.

  - **Validate Command-Line Arguments**: Investigate the specific command-line arguments used. For example, look for arguments that do not match benign patterns, such as adding rules for known software (like `Dropbox`) in non-standard configurations.

  - **Identify Recent Changes**: Examine the Windows Firewall logs (Windows Event ID 2004) for any recent changes to firewall rules to establish a timeline and context around the netsh activity.

  - **Review ACL Changes**: Check if similar events correlate with changes in access control lists (ACLs) or other security settings suggesting attempts to modify application behavior.

  - **Compare Against Users and Roles**: Identify the user or service account that executed the command. Compare it against the role and typical behavior of that account to determine legitimacy.

  ### Prioritization

  This alert is of medium severity in an enterprise environment due to the potential for significant security impacts through unauthorized rule modifications. The likelihood of malicious abuse exists, especially if executed by non-administrative accounts. This behavior can also reflect common tactics used in breaches or compromised systems.

  ### Blind Spots and Assumptions

  The main detection limitations stem from the possibility of legitimate system administration actions producing similar logs, hence the need for context. Evasion techniques might include using alternative methods to modify firewall rules, such as PowerShell or other command-line interfaces. If not properly configured, logging levels may miss critical details. Related detections, such as monitoring unusual process creations or network connections initiated by newly added rules, can strengthen overall detection coverage.

