title: New Firewall Rule Added Via Netsh.EXE
id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
status: test
description: Detects the addition of a new rule to the Windows firewall via 
  netsh
references:
- https://web.archive.org/web/20190508165435/https://www.operationblockbuster.com/wp-content/uploads/2016/02/Operation-Blockbuster-RAT-and-Staging-Report.pdf
author: Markus Neis, Sander Wiebing
date: 2019-01-29
modified: 2023-02-10
tags:
- attack.defense-impairment
- attack.t1686.003
- attack.s0246
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' firewall '
    - ' add '
  filter_optional_dropbox:
    CommandLine|contains:
    - 'advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program
      Files (x86)\Dropbox\Client\Dropbox.exe" enable=yes profile=Any'
    - 'advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program
      Files\Dropbox\Client\Dropbox.exe" enable=yes profile=Any'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activity
- Software installations
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of new firewall rules on Windows systems using the `netsh.exe` command-line utility. This behavior may denote an attacker modifying firewall settings to permit unauthorized network traffic, which suggests an objective of facilitating further malicious actions, including lateral movement or establishing persistence. This aligns with the MITRE ATT&CK tactic "Defense Evasion" (T1562) and the technique "Modify Firewall Rules" (T1571). The primary telemetry source is process creation events, specifically Event ID 4688 from Windows Security logs or Sysmon Event ID 1.

  If malicious, this activity can lead to data exfiltration, command and control (C2) establishment, or other malicious traffic being allowed through the firewall. This detection does not confirm that the change is malicious on its own; legitimate administrative activities can also trigger this alert.

  ### Investigation Steps

  - **Verify process creation**: Check for Event ID 4688 logs from the Security event log or Sysmon Event ID 1 to confirm that `netsh.exe` is utilized for modifications, particularly involving firewall rules.

  - **Examine command line arguments**: Review the CommandLine field of the process creation logs for instances containing keywords "firewall" and "add". Note any inclusion of trusted applications or benign rule modifications.

  - **Identify high-confidence malicious indicators**: Look for specific command line sequences that add firewall rules with anomalous programs, such as entries like `advfirewall firewall add rule name=Dropbox dir=in action=allow "program=?:\Program Files (x86)\Dropbox\Client\Dropbox.exe"` which could be used to bypass security controls and are not typical of usual enterprise configurations.

  - **Assess administrator activity**: Correlate with Legitimate administrative actions recorded in logs. Commonly, updates to firewall rules may occur during routine maintenance or legitimate software installations, which can justify benign activity.

  - **Check for unusual access patterns**: Monitor for any outbound connections following the addition of new rules, especially if the rules permit communication with anomalous IP addresses or domains not characteristic of the organization.

  - **Confirm critical assets and policies**: Identify the host role; if the affected system is a critical server (e.g., domain controller or database server), escalate for immediate review. Validate organizational policy compliance regarding direct firewall modifications.

  ### Prioritization

  This alert should be classified as medium severity due to the potential for significant impact if modifications lead to unauthorized access. The likelihood of malicious activity is elevated because modifying firewall rules is a common tactic used in lateral movement or establishing persistence by attackers. Given the active use of such methods in breach tactics, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate administrative activities to generate false positives, particularly during software installations or configuration changes. Reliance on comprehensive logging settings, especially for Sysmon, is critical for detection fidelity. Common legitimate activities that may trigger this alert include firewall rule adjustments by IT staff during maintenance windows. Companion detections could include monitoring for unexpected outbound connections post-firewall changes, enhancing overall visibility of network behavior.

