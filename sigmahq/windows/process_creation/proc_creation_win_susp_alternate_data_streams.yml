title: Execute From Alternate Data Streams
id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
status: test
description: Detects execution from an Alternate Data Stream (ADS). Adversaries 
  may use NTFS file attributes to hide their malicious data in order to evade 
  detection
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
author: frack113
date: 2021-09-01
modified: 2022-10-09
tags:
- attack.stealth
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_stream:
    CommandLine|contains: 'txt:'
  selection_tools_type:
    CommandLine|contains|all:
    - 'type '
    - ' > '
  selection_tools_makecab:
    CommandLine|contains|all:
    - 'makecab '
    - '.cab'
  selection_tools_reg:
    CommandLine|contains|all:
    - 'reg '
    - ' export '
  selection_tools_regedit:
    CommandLine|contains|all:
    - 'regedit '
    - ' /E '
  selection_tools_esentutl:
    CommandLine|contains|all:
    - 'esentutl '
    - ' /y '
    - ' /d '
    - ' /o '
  condition: selection_stream and (1 of selection_tools_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of processes that read from Alternate Data Streams (ADS) in NTFS file systems, which is a technique adversaries may use to hide malicious files and evade detection. The likely objective is to execute malicious payloads without raising suspicion, as standard file scanning might not detect these hidden streams. This behavior aligns with the MITRE ATT&CK technique **T1564.004: Execute From Alternate Data Streams**.

  The primary telemetry sources for this detection include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact can be significant, as it can lead to the execution of malware while bypassing traditional file-based detection mechanisms. Importantly, this detection does not confirm that a malicious action was performed, as benign activities may also use ADS for legitimate purposes.

  ### Investigation Steps

  - **Review Process Creation Events:** Check Security Event ID 4688 and Sysmon Event ID 1 for the command lines containing `txt:`. Analyze the caller process to distinguish between known legitimate applications versus suspicious ones.

  - **Identify Command-Line Usage:** Look for command lines that contain `type ` combined with redirects `>`, which indicates the potential use of ADS for execution. Validate if this is from expected administrative or scripting processes.

  - **Confirm Suspicious Tools:** Investigate commands that utilize `makecab`, `reg`, `regedit`, or `esentutl` alongside the ADS syntax. For example, if a command line shows `reg export ... > ...:txt:`, this raises a red flag and should be prioritized for further analysis.

  - **Analyze User Context:** Cross-reference the user account associated with the command. If the account has local administrative rights performing ADS operations, this could indicate a higher likelihood of malicious intent.

  - **Look for Legitimate Usage:** Determine if there is documented legitimate use of ADS by known internal processes or tools in your enterprise environment. This could help separate benign activities from potential threats.

  - **Examine File Creation and Exfiltration Artifacts:** If file manipulation is suspected, validate file creation logs for unusual activity in paths likely to host ADS (e.g., user app data directories). Look for unusual file sizes or modification times that do not align with typical usage patterns.

  ### Prioritization

  The severity of this alert is **medium** due to the potential risk of undetected malware execution within the enterprise. The likelihood of malicious abuse is notable, especially for systems that handle sensitive data, and the behavior is recognized as a common technique employed by threat actors.

  ### Blind Spots and Assumptions

  This detection might miss sophisticated evasion techniques where adversaries manipulate tool commands or use uncommon utilities that don't trigger this rule. Effective detection also requires proper logging of process creation events and might not capture actions performed by highly privileged or system processes. Legitimate activities might include system maintenance scripts or automated backups. A related detection worthy of consideration is tracking file access patterns combined with user context to better establish baselines and highlight deviations in behavior.

