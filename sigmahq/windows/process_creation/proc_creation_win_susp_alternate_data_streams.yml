title: Execute From Alternate Data Streams
id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
status: test
description: Detects execution from an Alternate Data Stream (ADS). Adversaries 
  may use NTFS file attributes to hide their malicious data in order to evade 
  detection
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
author: frack113
date: 2021-09-01
modified: 2022-10-09
tags:
- attack.stealth
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_stream:
    CommandLine|contains: 'txt:'
  selection_tools_type:
    CommandLine|contains|all:
    - 'type '
    - ' > '
  selection_tools_makecab:
    CommandLine|contains|all:
    - 'makecab '
    - '.cab'
  selection_tools_reg:
    CommandLine|contains|all:
    - 'reg '
    - ' export '
  selection_tools_regedit:
    CommandLine|contains|all:
    - 'regedit '
    - ' /E '
  selection_tools_esentutl:
    CommandLine|contains|all:
    - 'esentutl '
    - ' /y '
    - ' /d '
    - ' /o '
  condition: selection_stream and (1 of selection_tools_*)
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_alternate_data_streams/info.yml
note: |
  ### Technical Context

  This Sigma rule detects command-line activities indicative of executing code from Alternate Data Streams (ADS) on NTFS file systems. Attackers may use ADS to hide malicious payloads, exploiting its capability to store data in non-standard locations, thus evading traditional security measures. The main objective of such behavior is to execute malicious code while avoiding detection by security solutions and analysts.

  The relevant MITRE ATT&CK tactic is **Defense Evasion (TA0005)**, specifically the technique: **Indicator Removal on Host (T1564.004)**. Primary telemetry sources include Windows process creation logs, specifically **Security Event ID 4688** and **Sysmon Event ID 1**, which track new process creation events and command-line parameters. If malicious, the security impact includes unauthorized access to the system and potential data exfiltration. Notably, this detection does NOT confirm the presence of a successful compromise or the execution of purely malicious commands without further context.

  ### Investigation Steps

  - **Review command-line attributes:** Check for **Security Event ID 4688** or **Sysmon Event ID 1** logs for command lines containing `txt:` indicating execution from an ADS.

  - **Evaluate process creation timing:** Cross-reference the process creation timestamps with user activity logs to determine if the execution aligns with normal user behavior, especially for sensitive assets.

  - **Identify tools used:** Investigate any instances of command lines with `makecab`, `reg`, `regedit`, or `esentutl`, which may indicate misuse of these tools for ADS execution. Confirm if such tools are expected in the environment.

  - **Analyze legitimate usage patterns:** Review historical command-line patterns of users or applications to determine what legitimate ADS usage looks like, which may include legitimate software updates or configuration exports.

  - **Correlate with other telemetry:** Identify any related alerts or anomalies across the environment that may indicate a more extensive exploitation attempt, such as unusual outbound connections or file access patterns.

  - **Check for high-confidence malicious indicators:** Search for known malware signatures or hashes linked to prior incidents that may correlate with the command-line executed from ADS.

  ### Prioritization

  This alert is of medium severity as it could indicate attempts to evade detection through the use of ADS, but may also reflect legitimate administrative actions. The likelihood of malicious abuse is moderate, with historically weaponized techniques leveraging ADS to conceal payloads.

  ### Blind Spots and Assumptions

  Detection can be limited by the availability of logging or if ADS execution is not commonly monitored. Legitimate activities, such as software installation processes or user-configured tasks, may trigger this alert. A related detection to enhance coverage could be monitoring for **Registry modifications** (T1543) that could indicate lateral movement or persistence through ADS. Ensure high-fidelity logging from endpoints is enabled to capture these events effectively.

