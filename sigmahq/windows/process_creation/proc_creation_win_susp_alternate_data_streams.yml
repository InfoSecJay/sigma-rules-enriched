title: Execute From Alternate Data Streams
id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
status: test
description: Detects execution from an Alternate Data Stream (ADS). Adversaries 
  may use NTFS file attributes to hide their malicious data in order to evade 
  detection
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
author: frack113
date: 2021-09-01
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_stream:
    CommandLine|contains: 'txt:'
  selection_tools_type:
    CommandLine|contains|all:
    - 'type '
    - ' > '
  selection_tools_makecab:
    CommandLine|contains|all:
    - 'makecab '
    - '.cab'
  selection_tools_reg:
    CommandLine|contains|all:
    - 'reg '
    - ' export '
  selection_tools_regedit:
    CommandLine|contains|all:
    - 'regedit '
    - ' /E '
  selection_tools_esentutl:
    CommandLine|contains|all:
    - 'esentutl '
    - ' /y '
    - ' /d '
    - ' /o '
  condition: selection_stream and (1 of selection_tools_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of commands that leverage Alternate Data Streams (ADS) on Windows systems. Attackers may exploit ADS to conceal malicious executables, avoiding detection by placing them in seemingly harmless file attributes. The likely attacker objective involves maintaining persistence or executing malicious code stealthily, making it part of the Defense Evasion tactics outlined by MITRE ATT&CK (T1564.004).

  The primary telemetry sources include Windows Security Event IDs 4688 (process creation) and Sysmon Event ID 1 (process creation). The security impact is significant if malicious, as it can lead to unauthorized access, data exfiltration, or lateral movement within the network. This detection does NOT confirm that a system has been compromised; it may also capture benign activities using ADS.

  ### Investigation Steps

  - **Review process creation events:** Examine Windows Security Event ID 4688 for any related process creation linked to ADS usage. Look for CommandLine arguments that include 'txt:'.

  - **Correlate with Sysmon logs:** Check Sysmon Event ID 1 for detailed command execution data. Focus on the `CommandLine` field for patterns that indicate the use of ADS.

  - **Identify benign use cases:** Cross-reference any detected commands against known legitimate operations involving ADS, such as IT administration tasks that might involve using `reg export` or `esentutl`.

  - **Investigate for high-confidence malware indicators:** Look for CommandLine executions containing tools like 'makecab' or 'regedit' that are invoked with ADS paths. This could indicate abnormal behavior.

  - **Assess host criticality:** Pay special attention to alerts from critical infrastructure servers or endpoints where the presence of malware could lead to heightened risk or impact.

  - **Validate potential file creation or data exfiltration:** Check for the creation of any files or data that are suspiciously linked to the detected command or process in the filesystem, particularly within known directories for ADS storage.

  ### Prioritization

  This alert has medium severity due to the potential impact on highly sensitive enterprise systems. The likelihood of malicious use is significant, as exploiting ADS is a common technique for evading detection. This behavior is often weaponized by advanced threat actors aiming for persistent access.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative activities may trigger this alert; understanding the context of the environment is essential. Required logs must include both Windows Security and Sysmon event logs for reliable detection. Additionally, some evasion techniques may involve using obfuscation methods that obscure the presence of ADS. Related detections, such as monitoring for unusual process creation patterns (e.g., using 'cmd.exe' or 'powershell.exe' executing scripts), can enhance coverage and improve detection efficacy.

