title: Execute From Alternate Data Streams
id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
status: test
description: Detects execution from an Alternate Data Stream (ADS). Adversaries may
  use NTFS file attributes to hide their malicious data in order to evade detection
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
author: frack113
date: 2021-09-01
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_stream:
    CommandLine|contains: 'txt:'
  selection_tools_type:
    CommandLine|contains|all:
    - 'type '
    - ' > '
  selection_tools_makecab:
    CommandLine|contains|all:
    - 'makecab '
    - '.cab'
  selection_tools_reg:
    CommandLine|contains|all:
    - 'reg '
    - ' export '
  selection_tools_regedit:
    CommandLine|contains|all:
    - 'regedit '
    - ' /E '
  selection_tools_esentutl:
    CommandLine|contains|all:
    - 'esentutl '
    - ' /y '
    - ' /d '
    - ' /o '
  condition: selection_stream and (1 of selection_tools_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of commands from Alternate Data Streams (ADS) on Windows systems. Attackers may leverage ADS to conceal their malicious payloads, using the ability to associate hidden data with legitimate files, thus making it an effective technique for evading detection and maintaining persistence. Indicators of this behavior can involve command-line executions that include streams identified by the 'txt:' prefix or specific commands associated with file manipulation and registry operations.

  The suspected threat aligns with the MITRE ATT&CK framework, specifically under the tactics of Defense Evasion. The relevant techniques include **T1564.004 - Hide Data in Alternate Data Streams**. The objective of leveraging ADS typically points to an adversary attempting to obfuscate their activities from security detection systems while executing malicious payloads or conducting further actions on compromise.

  Primary data sources for this detection include **process creation events** from endpoint telemetry, such as EDR solutions, which provide insights into command-line arguments and application behaviors, as well as logs from the operating system that may indicate file access or manipulation within NTFS streams.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze the process creation logs to identify any usage of command-line arguments containing 'txt:' that indicate execution from an ADS. Pay special attention to processes related to file manipulation and registry interactions.
  - **Correlate with File Access Logs:** Verify any unusual file activity associated with the commands identified, focusing on NTFS streams to check for unexpected data hiding or manipulation of legitimate files.
  - **Inspect Security Products’ Alerts:** Look through alerts raised by other security products for related activities or additional context around ADS usage in your environment, such as EDR or Antivirus solutions that may have flagged the processes.
  - **Assess User Context and Privileges:** Determine the user context under which the commands were executed and assess whether the users have the necessary privileges to interact with ADS as seen in the suspicious process executions.

  ### Prioritization
  This alert is of **medium severity** given that execution from ADS generally represents a sophisticated level of evasion by adversaries. While not commonly utilized in every attack, when observed, it indicates a potential compromise or high-risk malicious behavior that warrants immediate investigation.

  ### Blind Spots and Assumptions
  There are potential blind spots in detecting ADS activity due to reliance on specific command-line patterns, which may not capture all forms of execution. Additionally, the detection logic assumes that malicious actors will utilize recognizable and predictable command structures associated with ADS. Effective logging and monitoring of process creation events are essential for this alert to function correctly; if any logging settings are misconfigured or if logs are not comprehensive, valuable evidence may be lost.

