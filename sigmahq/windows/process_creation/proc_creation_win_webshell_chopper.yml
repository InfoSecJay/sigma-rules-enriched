title: Chopper Webshell Process Pattern
id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
status: test
description: Detects patterns found in process executions cause by China Chopper like
  tiny (ASPX) webshells
references:
- https://www.microsoft.com/security/blog/2022/09/30/analyzing-attacks-using-the-exchange-vulnerabilities-cve-2022-41040-and-cve-2022-41082/
author: Florian Roth (Nextron Systems), MSTI (query)
date: 2022-10-01
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_origin:
  - Image|endswith: '\w3wp.exe'
  - ParentImage|endswith: '\w3wp.exe'
  selection_cmdline:
    CommandLine|contains:
    - '&ipconfig&echo'
    - '&quser&echo'
    - '&whoami&echo'
    - '&c:&echo'
    - '&cd&echo'
    - '&dir&echo'
    - '&echo [E]'
    - '&echo [S]'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies process creation patterns linked to the China Chopper webshell, commonly deployed through vulnerabilities in web applications. An attacker using this webshell can gain unauthorized access, execute commands, and manipulate the underlying server, particularly targeting Windows environments utilizing IIS (Internet Information Services). The typical objectives of such an attack include maintaining persistence within the network, executing commands for reconnaissance, and escalating privileges to further exploit the environment.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection are:
  - Persistence (T1505.003): Web Shell
  - Discovery (T1018): Remote System Discovery
  - Discovery (T1033): System Owner/User Discovery
  - Discovery (T1087): Account Discovery

  The primary data sources for effective detection include process creation logs, where attributes like the command line along with the associated images can provide critical insights into the execution of potentially malicious commands initiated by the webshell.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for processes initiated by `w3wp.exe` to identify any unusual command line arguments indicative of webshell activity.
  - **Analyze Command Line Arguments**: Look for suspicious commands that include "ipconfig," "quser," "whoami," and other `echo` statements, which may suggest reconnaissance actions or attempts to manipulate server configurations.
  - **Correlate with Web Server Logs**: Check IIS logs for unusual HTTP requests or any evidence of file uploads that could indicate the presence of a webshell. Look for anomalies in timestamps or source IP addresses.
  - **Examine Parent Process Relationships**: Investigate the parent process of indicators to determine how the webshell was invoked. This could provide clues about the methods used to establish the initial foothold.

  ### Prioritization
  The alert has a high severity level due to the significant risk posed by webshells, which facilitate ongoing access and control for attackers. The impact is critical, as such vulnerabilities can lead to extensive data breaches and widespread system compromise, particularly in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule assumes that the logs from process creation events are properly configured and retained for adequate timeframes. Blind spots may arise if logging is insufficient or if webshells employ techniques to obfuscate their execution environment. Additionally, if the web applications do not use standard configurations or modified versions of `w3wp.exe`, detection may be less reliable. Ensuring comprehensive logging across all relevant processes and monitoring for both normal and anomalous usage patterns is crucial for effective detection.

