title: Chopper Webshell Process Pattern
id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
status: test
description: Detects patterns found in process executions cause by China Chopper
  like tiny (ASPX) webshells
references:
- https://www.microsoft.com/security/blog/2022/09/30/analyzing-attacks-using-the-exchange-vulnerabilities-cve-2022-41040-and-cve-2022-41082/
author: Florian Roth (Nextron Systems), MSTI (query)
date: 2022-10-01
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_origin:
  - Image|endswith: '\w3wp.exe'
  - ParentImage|endswith: '\w3wp.exe'
  selection_cmdline:
    CommandLine|contains:
    - '&ipconfig&echo'
    - '&quser&echo'
    - '&whoami&echo'
    - '&c:&echo'
    - '&cd&echo'
    - '&dir&echo'
    - '&echo [E]'
    - '&echo [S]'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies malicious process executions originating from ASPX webshells associated with the China Chopper toolkit. The rule focuses on command line arguments containing patterns typically used by attackers to retrieve system information or perform reconnaissance (e.g., `&ipconfig&echo`). The likely objective is to maintain persistence and extract sensitive data from compromised web applications.

  The relevant MITRE ATT&CK techniques are Persistence via Web Shell (T1505.003) and Discovery techniques such as System Information Discovery (T1087) and Account Discovery (T1018). Primary telemetry sources include Windows process creation logs (Event ID 4688) and execution logs from the IIS application pool worker process (w3wp.exe). Malicious activity could lead to data breaches or further exploitation of the application and its underlying systems. It is important to note that this detection does NOT confirm the exploitation of a vulnerability; it simply indicates suspicious command executions potentially stemming from a compromise.

  ### Investigation Steps

  - **Check process creation logs**: Examine Windows Security Event ID 4688 logs for new process creation events where `Image` or `ParentImage` ends with `\w3wp.exe` around the alert time. Look for unusual child processes spawned from this application, indicating potential exploitation.

  - **Review command line arguments**: Analyze the `CommandLine` field within Event ID 4688. Focus on executions containing: `&ipconfig&echo`, `&quser&echo`, or any other suspicious commands listed. These patterns signify a potential webshell being used for information gathering.

  - **Identify expected behavior**: Compare legitimate processes initiated by `w3wp.exe`. Normal command lines should contain expected ASP.NET parameters without suspicious execution patterns. Validate that the application path and command line do not include any unexpected or malicious input.

  - **Cross-reference with IIS logs**: Look for corresponding entries in IIS logs (typically located in C:\inetpub\logs\LogFiles) to verify website access patterns and connections. Confirm whether the timings of web requests align with suspected process executions.

  - **Monitor system anomalies**: Look for indicators of lateral movement or further exploitation, such as processes communicating over uncommon ports or initiating connections to unknown endpoints. Log types include network connections logs (Windows Event ID 5156) or firewall logs.

  - **Identify potential exfiltration artifacts**: Validate for file creation or modification events across sensitive directories, especially using System Monitor (Sysmon) Event ID 11. Indicators of potential exfiltration can include unusual write access to files such as configuration or log files.

  ### Prioritization

  This alert is classified as high severity due to the significant impact that a webshell compromise can have on an enterprise environment. Given the likelihood of abuse by adversaries leveraging web applications, it is crucial to prioritize immediate investigation. Furthermore, China Chopper is a known tool widely weaponized in targeted attacks against web applications.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through altered command lines or obscured execution paths. Reliable detection requires proper configurations of Windows process creation logs and IIS logging to ensure adequate visibility. Legitimate administrative scripts or maintenance activities might trigger similar patterns, necessitating context review. Companion detections that strengthen coverage include monitoring for file modifications or unexpected user account changes indicative of lateral movement or privilege escalation.

