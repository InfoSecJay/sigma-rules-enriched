logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  WMIC  /NameSpace:\\root\default Class StdRegProv Call EnumKey hDefKey=&H80000002 sSubKeyName="Software\Microsoft\Windows\CurrentVersion\Uninstall"
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'stdregprov'
    - 'call'
    CommandLine|contains:
    - 'CheckAccess'
    - 'EnumKey'
    - 'EnumValues'
    - 'GetBinaryValue'
    - 'GetDWORDValue'
    - 'GetExpandedStringValue'
    - 'GetMultiStringValue'
    - 'GetQWORDValue'
    - 'GetSecurityDescriptor'
    - 'GetStringValue'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context

  This rule detects attempts to enumerate or read the Windows registry using the WMI StdRegProv class, particularly through the execution of `wmic.exe`. Attackers often exploit this method to gather information about system configurations, installed software, or sensitive information such as credentials, all of which can aid in lateral movement or privilege escalation. The relevant MITRE ATT&CK tactics include Discovery (T1082) and Execution (T1047).

  Telemetry sources include Windows process creation logs (Security Event ID 4688) and WMI execution logs. If this behavior is malicious, it could indicate a reconnaissance phase of an attack, potentially leading to further exploitation or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may also utilize WMI for registry access.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 entries. Look for `wmic.exe` as the image name and ensure OriginalFileName matches 'wmic.exe'. Benign activity often involves valid administrative commands that do not include suspicious subkey names or less common flags.

  - **Examine command-line arguments**: Identify instances where CommandLine contains keywords like 'stdregprov', 'call', 'GetStringValue', etc. Legitimate administrative scripts typically have verbose logging or use standard executable names without odd registry queries.

  - **Validate registry access patterns**: Cross-reference registry interactions with legitimate administrative tasks. Document standard actions on the system, such as typical registry paths accessed during necessary maintenance.

  - **Identify potential malicious indicators**: Look specifically for unwarranted and unexpected registry reads, especially for sensitive keys related to credentials or application configurations (e.g., `Software\Microsoft\Windows\CurrentVersion\Uninstall`). High confidence in malicious behavior if the same command queries recently set or less common registry values.

  - **Assess asset criticality**: If the alert pertains to sensitive systems like Domain Controllers or servers managing critical infrastructure, escalate the investigation accordingly. These systems are prime targets for credential harvesting.

  - **Check for file creation artifacts**: Look for signs of associated file manipulation or exfiltration, particularly if registry queries coincide with other telemetry showing unwanted data movement or unauthorized file access.

  ### Prioritization

  This alert carries medium severity due to its potential for indicating reconnaissance by attackers. The impact is heightened if sensitive information is accessed on critical systems. Such behavior is not commonly weaponized on its own but can be a precursor to more serious intrusions in a broader attack campaign.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where legitimate users frequently use `wmic.exe` for administrative tasks, potentially leading to the alert being triggered without malicious intent. Ensure WMI logging is enabled for more comprehensive coverage. Typical benign usage includes administrative inventory checks, which can mimic malicious behavior if not contextualized. Related detections involving direct registry manipulation (e.g., similar WMI interactions) can help confirm or deny the intent of the observed behavior.

