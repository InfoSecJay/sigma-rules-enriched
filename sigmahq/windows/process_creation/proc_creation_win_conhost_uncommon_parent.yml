title: Conhost Spawned By Uncommon Parent Process
id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
status: test
description: Detects when the Console Window Host (conhost.exe) process is 
  spawned by an uncommon parent process, which could be indicative of potential 
  code injection activity.
references:
- https://www.elastic.co/guide/en/security/current/conhost-spawned-by-suspicious-parent-process.html
author: Tim Rauch, Elastic (idea)
date: 2022-09-28
modified: 2025-03-06
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\conhost.exe'
    ParentImage|endswith:
    - '\explorer.exe'
            # - '\csrss.exe'  # Legitimate parent as seen in EchoTrail https://www.echotrail.io/insights/search/csrss.exe
            # - '\ctfmon.exe'  # Seen several times in a testing environment
            # - '\dllhost.exe'  # FP on clean system from grandparent 'svchost.exe -k DcomLaunch -p'
    - '\lsass.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\services.exe'
    - '\smss.exe'
    - '\spoolsv.exe'
    - '\svchost.exe'
    - '\userinit.exe'
            # - '\wermgr.exe'  # Legitimate parent as seen in EchoTrail https://www.echotrail.io/insights/search/wermgr.exe
    - '\wininit.exe'
    - '\winlogon.exe'
  filter_main_svchost:
    ParentCommandLine|contains:
    - '-k apphost -s AppHostSvc'
    - '-k imgsvc'
    - '-k localService -p -s RemoteRegistry'
    - '-k LocalSystemNetworkRestricted -p -s NgcSvc'
    - '-k NetSvcs -p -s NcaSvc'
    - '-k netsvcs -p -s NetSetupSvc'
    - '-k netsvcs -p -s wlidsvc'
    - '-k NetworkService -p -s DoSvc'
    - '-k wsappx -p -s AppXSvc'
    - '-k wsappx -p -s ClipSVC'
    - '-k wusvcs -p -s WaaSMedicSvc'
  filter_optional_dropbox:
    ParentCommandLine|contains:
    - 'C:\Program Files (x86)\Dropbox\Client\'
    - 'C:\Program Files\Dropbox\Client\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the spawning of the Console Window Host (conhost.exe) process by uncommon parent processes, which may signify attempts at process injection or malicious behavior. The likely objective of an attacker is to execute malicious code hidden within a legitimate process context, leveraging conhost.exe to evade detection. This behavior aligns with the MITRE ATT&CK technique "Command-Line Interface" (T1059). Primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon logs (Event ID 1), focusing on the "Image" and "ParentImage" fields. If malicious, the impact could include unauthorized data access or full system compromise. This detection does NOT confirm malicious behavior by itself—it indicates a potentially suspicious process interaction requiring further investigation.

  ---

  ### Investigation Steps

  - **Review the spawning process details:** Analyze Security Event ID 4688 or Sysmon Event ID 1 to identify the specific parent process leading to conhost.exe creation. Compare typical parent processes (like explorer.exe) against the uncommon list; usage by unusual parents (e.g., lsass.exe) can suggest potential malicious activity.

  - **Confirm command-line arguments used:** Check the "ParentCommandLine" field for any specific command-line arguments that indicate legitimate service actions or unusual commands associated with the spawning parent process. Patterns should conform to expected service operations; deviations may indicate misuse.

  - **Identify potential high-confidence indicators:** Look for processes that regularly spawn conhost.exe without legitimate context. If a non-standard parent (e.g., svchost.exe or services.exe) is identified, cross-reference with known attacker methods to escalate privileges or execute unwanted payloads.

  - **Check for related legitimate activity:** Validate if the parent process is executing expected operations by consulting operational baselines for critical systems, especially if software like Dropbox is involved. Legitimate uses of conhost.exe often stem from user actions in the graphical interface, like launching terminal commands.

  - **Examine system integrity post-detection:** After identifying the event, check for additional events around the same timeframe—reviewing Event ID 4688 for any related process creation activity—including potential file manipulation or external connections (Event ID 5156 for Windows Firewall logs).

  ---

  ### Prioritization

  This alert has medium severity due to the potential for significant impact on affected systems if an attacker successfully executes code through conhost.exe. The likelihood of malicious abuse is moderate, as uncommon parent processes are often leveraged for code injection during exploitation phases. While not universally weaponized, these tactics are increasingly noted in sophisticated attack campaigns.

  ---

  ### Blind Spots and Assumptions

  The detection may miss advanced evasion techniques that utilize legitimate processes or behavior replication to obscure malicious intent. Reliable detection requires comprehensive Windows event logging; inadequate logging settings may lead to missed detections. Benign activities such as software updates or legitimate service behavior may trigger this alert, particularly from known software suites. Companion detections targeting abnormal network connections (e.g., unusual outbound traffic per Event ID 5156) can augment the investigation and provide further assurance on the threat presence.

