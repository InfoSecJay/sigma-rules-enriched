note: |
  ### Technical Context

  This rule detects the execution of a renamed instance of "dctask64.exe," which is commonly associated with ZOHO Corporation's ManageEngine Endpoint Central. Adversaries may target this binary to facilitate DLL injection and arbitrary command execution, often leveraging it to gain elevated privileges or maintain persistence within a compromised environment. The primary MITRE ATT&CK tactics involved are Privilege Escalation (T1068), Defense Evasion (T1202), and Process Injection (T1055.001). The primary telemetry source for detection is Windows process creation logs, especially relevant event IDs for process execution, such as Security Event ID 4688 or Sysmon Event ID 1. If confirmed malicious, this activity signifies an immediate threat to the organization's integrity, as it could allow attackers to execute arbitrary code. However, this detection does NOT confirm malicious activity on its own, as legitimate use of this binary for management tasks exists.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where "dctask64.exe" has been executed from unexpected paths. Legitimate execution usually occurs from a management directory under C:\Program Files\ManageEngine.

  - **Analyze parent process relationships:** Investigate the parent process of the dctask64.exe execution within the same logs or Sysmon Event ID 1. Common benign parents might include known ZOHO processes, whereas unusual parents may indicate suspicious behavior.

  - **Correlate with known hashes:** Validate the execution against provided IMPHASH values: '6834B1B94E49701D77CCB3C0895E1AFD', '1BB6F93B129F398C7C4A76BB97450BBA', 'FAA2AC19875FADE461C8D89DCF2710A3', and 'F1039CED4B91572AB7847D26032E6BBF'. An executable matching these hashes corroborates malicious intent.

  - **Investigate network connections:** Check if the executed binary establishes outbound network connections using network logging or Sysmon Event ID 3. Malicious indicators might include connections to known suspicious IPs or unusual port usage.

  - **Identify file manipulation actions:** Review logs for file creation or modification actions associated with the executions (e.g., Event ID 4663 for file access). A sudden spike in modifications in directories related to sensitive applications could indicate abuse.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical management infrastructure and the likelihood of exploitation through the renaming of a legitimate process. The behavior is particularly concerning as it leverages a known enterprise tool, which can easily be weaponized against internal systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate instances of "dctask64.exe" that perform acceptable functions within the organization's environment. It is essential to ensure that logging for Windows process creation is properly configured to capture all relevant details for reliable detection. Legitimate administrative automation scripts may also spawn this executable, which could result in false positives. A related detection could involve monitoring for unusual parent-child process creation chains, thereby providing additional context for suspicious behaviors.

