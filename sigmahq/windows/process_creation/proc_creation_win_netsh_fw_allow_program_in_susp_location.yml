title: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
id: a35f5a72-f347-4e36-8895-9869b0d5fc6d
status: test
description: Detects Netsh command execution that whitelists a program located in
  a suspicious location in the Windows Firewall
references:
- https://www.virusradar.com/en/Win32_Kasidet.AD/description
- https://www.hybrid-analysis.com/sample/07e789f4f2f3259e7559fdccb36e96814c2dbff872a21e1fa03de9ee377d581f?environmentId=100
author: Sander Wiebing, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
date: 2020-05-25
modified: 2023-12-11
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
  - CommandLine|contains|all:
    - 'firewall'
    - 'add'
    - 'allowedprogram'
  - CommandLine|contains|all:
    - 'advfirewall'
    - 'firewall'
    - 'add'
    - 'rule'
    - 'action=allow'
    - 'program='
  selection_paths:
    CommandLine|contains:
    - ':\$Recycle.bin\'
    - ':\RECYCLER.BIN\'
    - ':\RECYCLERS.BIN\'
    - ':\SystemVolumeInformation\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Users\Desktop\'
    - ':\Users\Public\'
    - ':\Windows\addins\'
    - ':\Windows\cursors\'
    - ':\Windows\debug\'
    - ':\Windows\drivers\'
    - ':\Windows\fonts\'
    - ':\Windows\help\'
    - ':\Windows\system32\tasks\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\Downloads\'
    - '\Local Settings\Temporary Internet Files\'
    - '\Temporary Internet Files\Content.Outlook\'
    - '%Public%\'
    - '%TEMP%'
    - '%TMP%'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of the **Netsh.EXE** command, specifically when it is used to whitelist a program located in suspicious or unexpected file paths in the Windows Firewall. The presence of a whitelisted program in atypical locations, such as the Recycle Bin or temporary system folders, often indicates malicious intent, including efforts by attackers to avoid detection while establishing persistence or facilitating lateral movement within a network.

  The suspected threat family includes commodity malware often used in both opportunistic and targeted attacks. Attackers may aim to bypass security controls by manipulating firewall settings to permit malicious applications to communicate freely, enhancing their ability to execute additional payloads or maintain access to compromised systems. Relevant MITRE ATT&CK tactics for this behavior are **Defense Evasion** (ID: T1562) and specifically the technique **Impair Defenses: Whitelisting** (ID: T1562.004).

  Telemetry sources that will provide valuable evidence for the detection of this activity include **process creation logs** from EDR solutions, which document the execution of processes, including command-line arguments that reveal the specific use of Netsh.EXE and the paths of whitelisted programs.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs for instances of `netsh.exe` execution, particularly focusing on command-line arguments that include ‘firewall’ and ‘add allowedprogram’ or ‘add rule action=allow’.

  - **Inspect Whitelisted Program Paths**: Identify and verify any programs added to the firewall that are located in suspicious paths (e.g., `%TEMP%`, `%PUBLIC%`, and system temporary directories) to determine if they align with known threats or common malicious behavior.

  - **Check Firewall Configuration Changes**: Assess the Windows Firewall configuration to understand what programs have been whitelisted recently, paying particular attention to the timing and source of these changes.

  - **Utilize Threat Intelligence**: Cross-reference the identified whitelisted programs against threat intelligence databases to check for known malicious indicators or associations with malware families.

  ### Prioritization
  The high severity of this alert is due to the potential for attackers to exploit firewall configurations to enable undetected communications. The likelihood of this behavior being indicative of an active breach or preparation for one makes it a critical detection in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logs from process creation are not collected consistently or if event logging is not adequately configured in Windows environments. The detection logic assumes that any execution of Netsh.EXE involving suspicious paths indicates malicious activity; however, benign administrative actions may also occur. The rule requires process creation logs and proper logging of Windows Firewall changes to ensure effectiveness.

