logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
  - CommandLine|contains|all:
    - 'firewall'
    - 'add'
    - 'allowedprogram'
  - CommandLine|contains|all:
    - 'advfirewall'
    - 'firewall'
    - 'add'
    - 'rule'
    - 'action=allow'
    - 'program='
  selection_paths:
    CommandLine|contains:
    - ':\$Recycle.bin\'
    - ':\RECYCLER.BIN\'
    - ':\RECYCLERS.BIN\'
    - ':\SystemVolumeInformation\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Users\Desktop\'
    - ':\Users\Public\'
    - ':\Windows\addins\'
    - ':\Windows\cursors\'
    - ':\Windows\debug\'
    - ':\Windows\drivers\'
    - ':\Windows\fonts\'
    - ':\Windows\help\'
    - ':\Windows\system32\tasks\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
