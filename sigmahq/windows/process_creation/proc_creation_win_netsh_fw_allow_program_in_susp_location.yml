note: |
  ### Technical Context

  This rule detects the execution of the `netsh.exe` command that adds a program located in suspicious directories to the Windows Firewall's allowed program list. The likely attacker objective is to establish persistence and evade detection by whitelisting malicious applications, allowing them to communicate freely through the firewall. This behavior aligns with the MITRE ATT&CK technique "Application Layer Protocol" (T1562.004).

  The primary telemetry source for this rule is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this action can facilitate unauthorized access or command-and-control communication. However, this detection alone does not confirm that malicious activity occurred; it simply indicates a potentially suspicious action that requires further investigation.

  ### Investigation Steps

  - **Review command line execution details**: Check Security Event ID 4688 or Sysmon Event ID 1 to analyze the command line arguments used with `netsh.exe`. Look for the keywords ‘firewall’, ‘add’, and ‘allowedprogram’ combined with suspicious paths (e.g., `C:\Users\Default\`) indicating possible malicious intent.

  - **Correlate process creation with file location**: Examine the process creation logs for `netsh.exe` and cross-reference the file path to ensure it aligns with standard application locations (e.g., `%SystemRoot%\System32`). Legitimate instances are typically initiated from known system directories.

  - **Identify whitelisted programs**: Inspect the Windows Firewall's configuration using `netsh advfirewall firewall show rule` commands to see what programs have been whitelisted. Confirm if the added program correlates with known malicious indicators (e.g., hashes or filenames tied to malware).

  - **Evaluate execution context and permissions**: Determine which user account executed the `netsh.exe` command through the event logs. Suspicious execution by a non-administrative user or a standard user can indicate misuse of privileged operations.

  - **Check for related process activity**: Look for subsequent network connections made by the newly whitelisted program, and assess its behavior. Malicious indicators include connections to known command-and-control IP addresses or unusual outbound traffic patterns.

  ### Prioritization

  This alert has high severity due to the potential for a compromised system to bypass security controls and maintain persistence within the environment. The likelihood of malicious abuse is significant, as attackers commonly leverage such techniques to facilitate their objectives without immediate detection.

  ### Blind Spots and Assumptions

  There are limitations in detecting the use of legitimate applications that may also perform similar commands, leading to potential false positives. Robust logging configurations must be in place to capture all instances of command-line activity, particularly for `netsh.exe`. Legitimate administrative actions, such as firewall rule modifications for genuine applications, may trigger this alert. A related detection to consider is monitoring modifications to Windows Firewall rules more generally for additional context and coverage.

