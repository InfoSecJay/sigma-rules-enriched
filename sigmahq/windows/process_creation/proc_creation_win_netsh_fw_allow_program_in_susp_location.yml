title: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
id: a35f5a72-f347-4e36-8895-9869b0d5fc6d
status: test
description: Detects Netsh command execution that whitelists a program located 
  in a suspicious location in the Windows Firewall
references:
- https://www.virusradar.com/en/Win32_Kasidet.AD/description
- https://www.hybrid-analysis.com/sample/07e789f4f2f3259e7559fdccb36e96814c2dbff872a21e1fa03de9ee377d581f?environmentId=100
author: Sander Wiebing, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
date: 2020-05-25
modified: 2023-12-11
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
  - CommandLine|contains|all:
    - 'firewall'
    - 'add'
    - 'allowedprogram'
  - CommandLine|contains|all:
    - 'advfirewall'
    - 'firewall'
    - 'add'
    - 'rule'
    - 'action=allow'
    - 'program='
  selection_paths:
    CommandLine|contains:
    - ':\$Recycle.bin\'
    - ':\RECYCLER.BIN\'
    - ':\RECYCLERS.BIN\'
    - ':\SystemVolumeInformation\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Users\Desktop\'
    - ':\Users\Public\'
    - ':\Windows\addins\'
    - ':\Windows\cursors\'
    - ':\Windows\debug\'
    - ':\Windows\drivers\'
    - ':\Windows\fonts\'
    - ':\Windows\help\'
    - ':\Windows\system32\tasks\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\Downloads\'
    - '\Local Settings\Temporary Internet Files\'
    - '\Temporary Internet Files\Content.Outlook\'
    - '%Public%\'
    - '%TEMP%'
    - '%TMP%'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of `netsh.exe` to whitelist a program in the Windows Firewall from suspicious locations, which may indicate an attempt by an attacker to bypass security measures. The likely attacker objective is to ensure malicious programs can operate without interruption by preventing firewall blockages. Relevant MITRE ATT&CK tactic is "Defense Evasion" (T1562), with the technique "Impair Defenses" (T1686).

  Primary telemetry sources are process creation logs, specifically monitoring for Security Event ID 4688 generated by Windows. The security impact of this detection is significant; if malicious, it allows an attacker to maintain persistence and avoid detection. This detection does NOT confirm malicious intent on its own but indicates a potential security risk that requires further investigation.

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 where the `Image` field shows `netsh.exe`. Verify the `CommandLine` for included parameters and paths indicative of malicious activity.

  - **Analyze command line arguments:** Look for command lines that include `firewall add allowedprogram` or `firewall add rule action=allow program=`, especially if the path leads to known potentially malicious locations like `C:\$Recycle.bin\`.

  - **Identify benign configurations:** Investigate documented use cases for `netsh.exe` in your organization. For example, legitimate software installations may require firewall exceptions, usually involving paths like `C:\Program Files\` rather than obscure directories.

  - **Search for additional telemetry:** Gather logs from Windows Firewall (using Windows Event IDs 2004 or 2005) to check for corresponding firewall changes that align with the `netsh` command execution to confirm allowed programs.

  - **Check for multiple commands in logs:** Review Sysmon logs (Event ID 1) that track process creation to see if there are clusters of suspicious activity around the same timeframe that may suggest a coordinated attack or other indicators of compromise.

  - **Assess the host's role:** Identify the host's criticality and function within the organization. If the machine is a critical server or endpoint holding sensitive data, escalate for immediate remediation.

  ### Prioritization

  This alert should be treated as high severity due to its potential to enable persistent attacks. The risk is elevated, especially if the affected system is critical or exposed to sensitive data and if the behavior of whitelisting programs in unusual locations is a known tactic among cyber adversaries.

  ### Blind Spots and Assumptions

  Detection limitations may involve custom configurations of legitimate operations that use `netsh`, leading to potential false positives. Required log sources should include detailed process creation and Windows Firewall logs to ensure comprehensive coverage. Legitimate activities such as administrative changes to firewall rules may erroneously trigger this alert. A related detection focusing on unusual process creations using direct PowerShell commands to adjust firewall settings can strengthen overall coverage.

