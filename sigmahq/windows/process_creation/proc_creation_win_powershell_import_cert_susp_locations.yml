title: Root Certificate Installed From Susp Locations
id: 5f6a601c-2ecb-498b-9c33-660362323afa
status: test
description: Adversaries may install a root certificate on a compromised system 
  to avoid warnings when connecting to adversary controlled web servers.
references:
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
- https://learn.microsoft.com/en-us/powershell/module/pki/import-certificate?view=windowsserver2022-ps
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
modified: 2023-01-16
tags:
- attack.defense-evasion
- attack.t1553.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'Import-Certificate'
    - ' -FilePath '
    - 'Cert:\LocalMachine\Root'
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - ':\Windows\TEMP\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Perflogs\'
    - ':\Users\Public\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of a root certificate via the `Import-Certificate` PowerShell command, specifically when sourced from temporary or user directories typically associated with malicious activity. An attacker may utilize root certificates to bypass security warnings when connecting to their controlled web servers, facilitating man-in-the-middle attacks or the distribution of malware disguised as legitimate software.

  This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the associated technique for Installing an Application on a compromised system (T1553.004). Primary telemetry sources include Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1, capturing command line execution details. If malicious, this activity can undermine system integrity and user trust. However, this detection does not confirm compromise on its own; further analysis is required to ascertain intent and context.

  ### Investigation Steps

  - **Evaluate the Command Line Execution:** Examine the relevant telemetry, especially Security Event ID 4688 and Sysmon Event ID 1, to identify `Import-Certificate` usage from paths like `C:\Users\<username>\AppData\Local\Temp\`. Malicious indicators include unexpected use from these temp directories.

  - **Check Certificate Store Post-Execution:** Inspect the Local Machine Root certificate store (e.g., using `certutil` or PowerShell). Look for newly added certificates, especially those with unusual Issuer names or creation dates immediately following suspicious process creations. Legitimate installations typically originate from known management tools, not user directories.

  - **Cross-reference Contextual User Activity:** Verify the legitimacy of the user who executed the command. If the user is a regular non-admin account performing non-administrative work, flag this for further review as anomalous behavior.

  - **Analyze Related Processes and Parent Hierarchy:** Investigate parent processes leading to `powershell.exe` creation to identify potentially related or precursor malicious activities. Check for execution chains that could indicate post-compromise behavior, such as exploitation or lateral movement.

  - **Monitor Network traffic related to the Certificate:** Review network logs for outbound connections to suspicious IP addresses or domains shortly after certificate installation (e.g., DNS logs, firewall logs). Mark connections involving newly installed root certificates as high-risk.

  - **Document Historical Trends:** Track the user's historical installation behavior for certificates and patterns. Frequent changes to trusted certificates from a user can point to stealthier, prolonged attack vectors.

  ### Prioritization

  Alerts of this nature are high severity due to the potential for significant security impact on systems considered critical or core to operations. This activity is often exploited by advanced persistent threats (APTs) aiming to establish long-term persistence undetected. The likelihood of malicious action is elevated given the typical usage of these techniques in recent threat actor campaigns.

  ### Blind Spots and Assumptions

  Detection is limited by the absence of proper auditing settings, which can obscure legitimate root certificate activities. Admin activities, such as legitimate software installations or updates, may trigger similar alerts if commands are sourced from temp directories. Ensuring comprehensive endpoint telemetry is key for effective detection. Companion detections include monitoring for outbound connections to malicious or unexpected certificates, reinforcing the understanding of any potential compromise.

