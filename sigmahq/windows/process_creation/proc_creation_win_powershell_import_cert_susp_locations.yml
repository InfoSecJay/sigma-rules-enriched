title: Root Certificate Installed From Susp Locations
id: 5f6a601c-2ecb-498b-9c33-660362323afa
status: test
description: Adversaries may install a root certificate on a compromised system to
  avoid warnings when connecting to adversary controlled web servers.
references:
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
- https://learn.microsoft.com/en-us/powershell/module/pki/import-certificate?view=windowsserver2022-ps
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
modified: 2023-01-16
tags:
- attack.defense-evasion
- attack.t1553.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'Import-Certificate'
    - ' -FilePath '
    - 'Cert:\LocalMachine\Root'
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - ':\Windows\TEMP\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Perflogs\'
    - ':\Users\Public\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the installation of root certificates from suspicious locations on Windows systems. Attackers may employ this technique to prevent alerts and warnings when a user connects to malicious web servers under their control, effectively facilitating man-in-the-middle attacks by intercepting encrypted traffic. The installation of a root certificate can grant the attacker the ability to decrypt and manipulate sensitive information without detection.

  The primary MITRE ATT&CK tactics relevant to this rule are **Defense Evasion** (T1070) and the specific technique of **Valid Accounts** (T1553.004), where an attacker may try to avoid detection through legitimate processes like importing certificates. The detection relies on identifying command-line invocations that include the use of the `Import-Certificate` PowerShell cmdlet, particularly from uncommon or user profile-specific locations like Temp, Downloads, and Public folders, indicating potentially unauthorized or automated scripting activity.

  The best sources of data for this detection include **process creation events**, specifically monitoring command-line arguments that are employed when new certificates are imported, as they contain information about the command issuer and context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of the `Import-Certificate` command being executed. Pay attention to the command-line arguments to identify any unusual file paths or execution contexts that suggest possible malicious use.

  - **Analyze Certificate Store Changes**: Use PowerShell or certificate management tools to enumerate changes to the machine's root certificate store, specifically looking for certificates that were recently added or that have unusual origins.

  - **Correlate with Network Activity**: Investigate outbound connections initiated shortly after the certificate installation from the detected process. Look for unusual or unauthorized traffic heading to known malicious domains or IP addresses.

  - **Validate User Context**: Check the user accounts associated with the process creation events. Determine if the account has the correct privileges and whether it is common for users with that role to manipulate certificates.

  ### Prioritization
  This alert should be treated with high severity due to the potential for significant impact, including data breaches and unauthorized access to sensitive information. The likelihood of an attacker successfully executing this technique can be high, especially in environments where administrative privileges are available to users without strict controls.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may occur if the command is executed through obfuscated or non-standard methods that don't utilize common PowerShell cmdlets. The detection logic assumes that suspicious locations for certificate files are indicative of potentially malicious behavior, but legitimate administrative actions from system administrators could also trigger false positives. To ensure effective detection, logs must be enabled for process creation events, and PowerShell script logging should be configured to provide detailed command-line activity information.

