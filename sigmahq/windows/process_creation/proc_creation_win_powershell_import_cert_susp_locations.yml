title: Root Certificate Installed From Susp Locations
id: 5f6a601c-2ecb-498b-9c33-660362323afa
status: test
description: Adversaries may install a root certificate on a compromised system 
  to avoid warnings when connecting to adversary controlled web servers.
references:
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
- https://learn.microsoft.com/en-us/powershell/module/pki/import-certificate?view=windowsserver2022-ps
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
modified: 2023-01-16
tags:
- attack.defense-impairment
- attack.t1553.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'Import-Certificate'
    - ' -FilePath '
    - 'Cert:\LocalMachine\Root'
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - ':\Windows\TEMP\'
    - '\Desktop\'
    - '\Downloads\'
    - '\Perflogs\'
    - ':\Users\Public\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of root certificates from suspicious directories, often indicative of an adversary compromising a system to avoid certificate warnings when connecting to malicious servers. The likely attacker objective is to facilitate man-in-the-middle (MitM) attacks or secure unauthorized data exfiltration. This behavior maps to the MITRE ATT&CK technique "Install Root Certificate" (T1553.004), under the tactic of Defense Evasion.

  The primary telemetry source is Windows process creation logs, particularly focusing on CommandLine events from Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it can enable the attacker to intercept encrypted communications, leading to significant data breaches. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative activities may also involve installing certificates.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 associated with the command `Import-Certificate`, specifically targeting any command lines that include file paths to `Cert:\LocalMachine\Root` along with suspicious directories (`AppData\Local\Temp\`, `Downloads`, etc.).

  - **Analyze File Sources:** Investigate the certificate file's location; if it originates from known temporary folders or common download areas, it is a strong indicator of potential malicious activity.

  - **Correlate with User Accounts:** Identify the user account that executed the command. If the account does not typically perform certificate management or is non-administrative, this raises a potential flag for lateral movement or compromise.

  - **Evaluate Legitimate Contexts:** Compare with expected behavior in the environment; legitimate certificate installations typically come from trusted administrative processes, not temporary folders or public directories.

  - **Identify Malicious Indicators:** Look for patterns in the command line such as unusual arguments in the `Import-Certificate` command. Repeated installations from these directories should be prioritized.

  - **Cross-Check with Authority Logs:** Validate against Windows Event ID 4648 (Logon Attempt) or Event ID 4656 (Handle Accessed) to establish if the installation occurred with elevated privileges that are out of the ordinary for the associated user.

  ### Prioritization

  This alert is of high severity due to its potential impact on system integrity and the likelihood of being used in real-world attacks. The behavior is indicative of a method frequently weaponized by adversaries to enable further malicious activities, making prompt investigation critical.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate administrative activities to invoke similar command patterns, especially within development environments. Reliable detection requires consistent monitoring of Windows process creation logs across all endpoints, and certain endpoints may have varying configurations. Legitimate software installations may occasionally trigger the alert, expanding the range of false positives. Strengthening coverage can be achieved by monitoring for other associated techniques such as unauthorized certificate updates or unexpected network activity originating from the affected systems.

