logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - ':\Perflogs\'
    - ':\Users\All Users\'
    - ':\Users\Default\'
    - ':\Users\NetworkService\'
    - ':\Windows\addins\'
    - ':\Windows\debug\'
    - ':\Windows\Fonts\'
    - ':\Windows\Help\'
    - ':\Windows\IME\'
    - ':\Windows\Media\'
    - ':\Windows\repair\'
    - ':\Windows\security\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - '$Recycle.bin'
    - '\config\systemprofile\'
    - '\Intel\Logs\'
    - '\RSA\MachineKeys\'
  filter_optional_ibm:
    Image|startswith: 'C:\Users\Public\IBM\ClientSolutions\Start_Programs\'
  filter_optional_citrix:
    Image|startswith: 'C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\'
    Image|endswith: '\CitrixReceiverUpdater.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects process executions originating from a range of potentially suspicious or uncommon directories on Windows systems. The behavior indicated may signal an attacker’s attempt to execute malicious payloads from non-standard locations that are often overlooked in comprehensive security assessments. The likely attacker objective is to maintain persistence or execute various payloads without detection. The relevant MITRE ATT&CK tactic is Execution (TA0040), specifically technique T1036: Masquerading, which highlights the evasion of detection mechanisms through unusual execution paths.

  Primary telemetry sources include Windows Event Logs, particularly Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Created). If this behavior is malicious, it could lead to account compromise, data exfiltration, or lateral movement within the network. It is important to note that this detection does NOT confirm the activity is malicious on its own; further investigation into contextual elements of the execution is crucial.

  ### Investigation Steps

  - **Review the Execution Path:** Examine the `Image` field in Security Event ID 4688 logs. Check for paths containing `Perflogs`, `NetworkService`, and less common user directories. Confirm if these paths are standard for the environment or have been abused historically.

  - **Correlate against known software:** Identify any legitimate software that may utilize these folders by cross-referencing the process name or path with documentation or known software lists. Legitimate processes such as system updates or maintenance tasks should have records.

  - **Analyze Parent Process:** For the suspicious process creation, check the `ParentProcessId` from Security Event ID 4688 or Sysmon Event ID 1. A parent process like `cmd.exe` or `powershell.exe` from unusual directories may indicate malicious activity.

  - **Examine Running Processes:** Utilize Process Explorer or similar tools to check for running processes in the same directory. Look for unusual parent-child relationships or processes not typically found in production environments.

  - **Extract and Validate Indicators:** If file creation is involved, confirm creation timestamps and file attributes. Use `Sysinternals Suite` tools to verify any potential obfuscation in file names typical for malware (e.g., random strings).

  - **Log Directory Listings:** Review directory listings for execution paths using Windows PowerShell commands (e.g., `Get-ChildItem -Path "C:\Users\All Users\"`) to identify unusual file or script creations around the time of the alert.

  ### Prioritization

  This alert is of high severity within an enterprise context because it involves process execution from uncommon directories, often leveraged by adversaries to avoid detection. The potential impact on critical systems is substantial as this behavior can lead to data breaches or system compromise. The likelihood of malicious abuse is considerable, given such tactics are frequently weaponized by threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by benign applications legitimately using uncommon directories. Certain users or applications could trigger the alert under normal operations, especially during software updates or maintenance. Ensuring the logging of all relevant process creation events and enabling Sysmon can strengthen detection capabilities. A companion detection, such as monitoring for script execution in unusual directories or tracking registry changes related to software installations, can provide additional context and coverage.

