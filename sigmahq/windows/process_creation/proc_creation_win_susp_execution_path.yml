title: Process Execution From A Potentially Suspicious Folder
id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
status: test
description: Detects a potentially suspicious execution from an uncommon folder.
references:
- https://github.com/mbevilacqua/appcompatprocessor/blob/6c847937c5a836e2ce2fe2b915f213c345a3c389/AppCompatSearch.txt
- https://www.secureworks.com/research/bronze-butler-targets-japanese-businesses
- https://www.crowdstrike.com/resources/reports/2019-crowdstrike-global-threat-report/
- https://github.com/ThreatHuntingProject/ThreatHunting/blob/cb22598bb70651f88e0285abc8d835757d2cb596/hunts/suspicious_process_creation_via_windows_event_logs.md
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2019-01-16
modified: 2024-07-12
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - ':\Perflogs\'
    - ':\Users\All Users\'
    - ':\Users\Default\'
    - ':\Users\NetworkService\'
    - ':\Windows\addins\'
    - ':\Windows\debug\'
    - ':\Windows\Fonts\'
    - ':\Windows\Help\'
    - ':\Windows\IME\'
    - ':\Windows\Media\'
    - ':\Windows\repair\'
    - ':\Windows\security\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - '$Recycle.bin'
    - '\config\systemprofile\'
    - '\Intel\Logs\'
    - '\RSA\MachineKeys\'
  filter_optional_ibm:
    Image|startswith: 'C:\Users\Public\IBM\ClientSolutions\Start_Programs\'
  filter_optional_citrix:
    Image|startswith: 'C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\'
    Image|endswith: '\CitrixReceiverUpdater.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious process executions from uncommon folders on Windows systems. Such executions may indicate malicious actors attempting to evade standard security measures and leverage non-standard directories for execution. Attackers often choose these locations to conceal their activities from security monitoring, as executables in usual file paths are subject to more scrutiny.

  The rule specifically targets processes that are initiated from directories that are atypical for legitimate applications, including folders such as `C:\Perflogs\`, `C:\Users\Default\`, and `C:\Windows\addins\`. The potential objective of the attacker is to execute malicious payloads, conduct reconnaissance, or manipulate system settings without attracting attention. This behavior can be associated with tactics and techniques identified in the MITRE ATT&CK framework, particularly **Defense Evasion (TA0005)**, and **Process Injection (T1055)** for the broader context of secure system exploitation.

  Primary data sources for this detection include process creation events from Windows logs, which capture detailed information about executed commands and their originating paths.

  ### Investigation Steps
  - **Review Process Execution Logs:** Examine process creation logs for any instances where executables are launched from the identified suspicious folders. Pay attention to the command line arguments and user context.
  - **Correlate with User Behavior:** Analyze the behavior of the user or service account that initiated the process. Look for patterns that diverge from established norms, such as scheduled tasks or unusual login times.
  - **Cross-Reference with Threat Intelligence:** Use external intelligence sources and internal baseline data to determine if the identified paths have a history of being associated with malicious activity or are part of known attack methodologies.
  - **Inspect File Details:** Investigate the characteristics of the executable files in question, including hash values, signatures, and creation timestamps. Assess whether these files are known or have been recently modified.

  ### Prioritization
  The high severity of this alert is warranted based on the potential impact of process execution from unusual directories, which indicates possible evasion tactics being employed by an attacker. This behavior is uncommon in normal operational environments and may suggest active compromise attempts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for less common execution scenarios that do not originate from the specified suspicious folders or for processes executed through legitimate applications that may be compromised (e.g., benign applications executing malicious code). Additionally, the detection logic assumes that process creation events are being effectively logged and that there are no significant gaps in monitoring for all systems. It requires appropriate Windows event logging configurations to capture all necessary process execution data accurately.

