title: Process Execution From A Potentially Suspicious Folder
id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
status: test
description: Detects a potentially suspicious execution from an uncommon folder.
references:
- https://github.com/mbevilacqua/appcompatprocessor/blob/6c847937c5a836e2ce2fe2b915f213c345a3c389/AppCompatSearch.txt
- https://www.secureworks.com/research/bronze-butler-targets-japanese-businesses
- https://www.crowdstrike.com/resources/reports/2019-crowdstrike-global-threat-report/
- https://github.com/ThreatHuntingProject/ThreatHunting/blob/cb22598bb70651f88e0285abc8d835757d2cb596/hunts/suspicious_process_creation_via_windows_event_logs.md
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2019-01-16
modified: 2024-07-12
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - ':\Perflogs\'
    - ':\Users\All Users\'
    - ':\Users\Default\'
    - ':\Users\NetworkService\'
    - ':\Windows\addins\'
    - ':\Windows\debug\'
    - ':\Windows\Fonts\'
    - ':\Windows\Help\'
    - ':\Windows\IME\'
    - ':\Windows\Media\'
    - ':\Windows\repair\'
    - ':\Windows\security\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - '$Recycle.bin'
    - '\config\systemprofile\'
    - '\Intel\Logs\'
    - '\RSA\MachineKeys\'
  filter_optional_ibm:
    Image|startswith: 'C:\Users\Public\IBM\ClientSolutions\Start_Programs\'
  filter_optional_citrix:
    Image|startswith: 'C:\Windows\SysWOW64\config\systemprofile\Citrix\UpdaterBinaries\'
    Image|endswith: '\CitrixReceiverUpdater.exe'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects process execution from various potentially suspicious directories on a Windows system, such as those in `C:\Windows`, `C:\Users`, and `C:\ProgramData`. The likely attacker objective is to execute malicious code while obfuscating the origin of the executable by using non-standard directories, leveraging common system locations to blend in with legitimate processes. This behavior aligns with the MITRE ATT&CK tactics for Defense Evasion (TA0005) and the technique for Masquerading (T1036).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688, along with Sysmon Event ID 1. If the detected behavior is malicious, it can indicate an attacker executing malware or executing scripts for lateral movement or data exfiltration. However, this detection does NOT confirm that the execution is definitively malicious; further investigation is required to attribute intent.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 for each detected process. Focus on the `Image` field to check for the location of the executable. Malicious indicators include executables from the predefined suspicious paths (e.g., `C:\Windows\Fonts\`).

  - **Validate the legitimacy of the executable:** Check the `User` and `ParentImage` fields in the logs to identify which user initiated the process and its parent process. Legitimate processes often originate from known applications and have common parent-child hierarchies.

  - **Correlate with known threats:** Utilize threat intelligence sources to identify if the process (e.g., `CitrixReceiverUpdater.exe`) has been reported as malicious. These correlations rely on threat databases and repositories for updates.

  - **Identify unusual user behavior:** Monitor the `Account Name` associated with the process execution. Legitimate administrative accounts typically execute from system folders, whereas anomalous accounts executing from suspicious directories may indicate compromise.

  - **Inspect network activity:** Check for outbound connections or data transfers associated with the suspicious process creation. Tools like Windows Defender Firewall logs may show unusual network connections initiated by newly executed processes.

  - **Conduct a file attribute analysis:** For flagged processes, examine the file properties (using PowerShell’s `Get-ItemProperty` command) including timestamps, digital signatures, and hash values to determine if they’re authentic or if hashes match known bad signatures.

  ### Prioritization

  The severity of this alert is high as it concerns the execution of applications from uncommon directories, which is frequently exploited in malicious operations. Given the critical nature of the systems potentially affected, the chances of malicious abuse are significant, especially if the observed behavior matches known TTPs used by threat actors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate applications may occasionally execute from these uncommon directories, leading to potential false positives. Reliable detection requires consistent logging configurations for all relevant process creations. Additionally, activities such as scheduled tasks or application updates might trigger the rule; filtering such cases is essential. Companion detections, such as those for unusual outbound connections (e.g., from Sysmon network connections), can greatly enhance overall threat visibility and assessment.

