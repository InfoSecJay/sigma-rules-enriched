note: |
  ### Technical Context
  This detection rule identifies potential lateral movement activity within a Windows environment using the Microsoft Management Console (MMC). It specifically looks for the execution of the `MMC.exe` process as a child of the `svchost.exe` process with the command line argument `-Embedding`. Such behavior is commonly associated with attackers attempting to execute malicious code on remote systems by leveraging legitimate administrative tools, thus blending in with normal operating behavior.

  Attackers may aim to execute malicious commands, move laterally within the network, or escalate privileges by exploiting the trusted functionality of system processes. Detecting this behavior is critical as it indicates unauthorized access to systems that could lead to further infiltration, data exfiltration, and compromise of sensitive information.

  Relevant MITRE ATT&CK tactics include:
  - **Execution** (TA0002) - using legitimate tools to execute commands.
  - **Lateral Movement** (TA0008) - using techniques like `T1021.003: Remote Services: Windows Admin Shares` for accessing systems remotely.

  The primary telemetry sources for evidencing this detection include:
  - **Process creation events** from endpoint detection tools like EDR.
  - Logs from the Windows Event Log indicating process execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for `mmc.exe` spawned by `svchost.exe` to confirm the presence of the `-Embedding` command line flag. Gather additional context on execution time and the user account involved.
  - **Analyze Parent-Child Relationships:** Investigate the parent-child process relationships to track the origin of the lateral movement attempt and identify unusual process trees that may indicate exploitation.
  - **Correlate with User Activity:** Check the activity of the user account that triggered the alert for any anomalous behavior, such as accessing unusual systems or performing unexpected administrative tasks.
  - **Conduct Network Analysis:** Review credible network traffic logs that correspond with the time of the alert; look for unusual SMB traffic patterns or RDP sessions that may suggest lateral movement.

  ### Prioritization
  This alert has a high severity rating in an enterprise environment due to the increased risk of lateral movement enabling an attacker to escalate privileges and compromise additional systems, posing a significant threat to the integrity and security of the network.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage when legitimate administrative activities utilize similar mechanisms, potentially resulting in false negatives. The detection logic assumes that `-Embedding` is a significant indicator of malicious intent, which may not always hold true in environments where MMC is regularly used for legitimate purposes. Additionally, proper logging configuration on all Windows hosts is required for this alert to function effectively, as missing process creation logs could lead to undetected malicious activity.

