detection:
  selection:
    ParentImage|endswith: '\svchost.exe'
    Image|endswith: '\mmc.exe'
    CommandLine|contains: '-Embedding'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects lateral movement using the Microsoft Management Console (MMC) through the spawning of the MMC application (`mmc.exe`) with the command line argument `-Embedding` as a child process of `svchost.exe`. This behavior is indicative of an attacker using legitimate system tools to gain unauthorized access to do actions on other hosts or sensitive data. The relevant MITRE ATT&CK tactic is "Lateral Movement" (ID: T1021.003).

  The primary telemetry sources for this rule are the Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If the rule is triggered maliciously, it could indicate an attempt to pivot or gain unauthorized access to resources, affecting the confidentiality and integrity of the system. Note that this detection does NOT confirm that a compromise has occurred on its own; further investigation is required to establish intent and impact.

  ---

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for process creation records involving `svchost.exe` as the parent image and `mmc.exe` with the `-Embedding` argument. This can pinpoint the existence of potentially malicious lateral movement.

  - **Identify user context:** Determine the user context under which `mmc.exe` was executed by reviewing the `NewProcessName`, `ProcessId`, and the `CreatorProcessId` fields. Legitimate uses will typically show system or administrative users, whereas suspicious invocations may originate from unfamiliar accounts.

  - **Examine parent process lineage:** Analyze the command line arguments of `svchost.exe` (ParentImage) to identify any anomalies. Legitimate uses usually do not invoke MMC this way and should show typical service-related arguments.

  - **Correlate with network activity:** Look for outbound connections linked to the timestamps of the alert. Use Windows Firewall logs or Proxy logs to check if the machine was communicating with unusual external or internal systems concurrently, which may indicate laterally exploiting other systems.

  - **Document system role:** Consider the asset involved; if it hosts critical resources or sensitive data, increase the urgency of the investigation. Compare against baseline behavior for the specific machine type (e.g., domain controller, workstation).

  - **Confirm file creation or modifications:** Check for any newly created files or modifications in the file system related to `mmc.exe` using the File Creation Timestamp or Windows Event ID 4663. Look for logs indicating unauthorized access or change to sensitive directories.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and data. The behavior is often weaponized by attackers for lateral movement, making it a significant threat indicator. Systems running this process are typically central to management functions, heightening the possibility of escalating privileges.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include altering the command line or using alternative process invocation methods. Reliable detection requires proper logging configurations for process creation, which should be enabled via Group Policy or endpoint telemetry solutions. Legitimate system admin tasks may trigger this rule when using MMC to manage services or settings. A related detection to consider is monitoring for interactions with remote desktop services, which may indicate further lateral movement activities.

