detection:
  selection:
    Image|endswith: ':\Windows\System32\query.exe'
    CommandLine|contains:
    - 'session >'
    - 'process >'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  The rule detects the execution of `query.exe`—a native Windows process—to gather and potentially exfiltrate system information, with specific command-line parameters indicating the retrieval of session and process data. The attacker’s objective may include reconnaissance, where they aim to gather intelligence about system operations and user sessions, which can be an early stage in the attack lifecycle. This behavior aligns with the MITRE ATT&CK technique T1083 (File and Directory Discovery) under the Reconnaissance tactic.

  Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which captures process creation events including command-line arguments. If the activity is malicious, it could lead to unauthorized data disclosure. However, this detection does not confirm intent or subsequent malicious actions, as legitimate administrative activities could use `query.exe` for system management purposes.

  ### Investigation Steps

  - **Review process creation events**: Check Windows Security Event ID 4688 for instances of `query.exe` execution. Look for command-line arguments containing 'session >' or 'process >' to identify potential exfiltration attempts.

  - **Check command-line usage**: Analyze the full command line executed with `query.exe`. Legitimate use typically includes parameters like `/?`, while the presence of 'session >' or 'process >' indicates potential malicious intent.

  - **Correlate with user account**: Identify the user account associated with the alert. Determine if the account has elevated privileges or unusual activity patterns that might classify it as a potential insider threat or compromised account.

  - **Investigate related process activity**: Look for other process creation events that occurred in proximity (within minutes) of the detected `query.exe` usage. A pattern of unusual tool use (e.g., followed by running other administrative commands) may indicate malicious activity.

  - **Assess asset criticality**: Determine whether the affected host is critical to the organization (e.g., a domain controller or a server with sensitive information). Malicious use on critical assets warrants immediate escalation and investigation.

  ### Prioritization

  This alert has medium severity due to the potential for compromising sensitive operational data. While the likelihood of malicious abuse is moderate, especially within systems handling critical information, `query.exe` can also be used legitimately by system administrators, necessitating careful analysis of context.

  ### Blind Spots and Assumptions

  The primary detection limitation lies in the potential for evasion if attackers disguise their commands or use alternate tools for query execution. Reliable detection requires comprehensive logging of process creation events, including command-line arguments. Legitimate administrative tasks may inadvertently trigger alerts when using `query.exe`. A companion detection for enhanced coverage could involve monitoring for abnormal patterns of process discovery or subsequent commands leading to data manipulation or extraction.

