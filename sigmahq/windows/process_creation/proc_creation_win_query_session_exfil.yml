title: Query Usage To Exfil Data
id: 53ef0cef-fa24-4f25-a34a-6c72dfa2e6e2
status: test
description: Detects usage of "query.exe" a system binary to exfil information such
  as "sessions" and "processes" for later use
references:
- https://twitter.com/MichalKoczwara/status/1553634816016498688
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-01-19
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: ':\Windows\System32\query.exe'
    CommandLine|contains:
    - 'session >'
    - 'process >'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of `query.exe`, a legitimate Windows system binary, which may be exploited by attackers to exfiltrate sensitive information about system sessions and processes. Attackers may utilize this tool as part of their reconnaissance efforts, gathering details that can aid in privilege escalation or in crafting further attacks within the environment. The primary objective of such behavior is to gather operational intelligence that could be leveraged for lateral movement, data theft, or disruption of services.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002), as the rule detects the execution of a system command for potentially nefarious purposes. Specifically, techniques associated with this detection include **Command-Line Interface** (T1059), as attackers might leverage command-line tools to manipulate system queries for data collection or theft.

  Primary data sources that provide valuable evidence for this detection include **process creation logs**, which track executable launches and command-line arguments. These logs can aid in identifying when and how `query.exe` is invoked, particularly focusing on any suspicious patterns or unexpected parameter usage indicative of exfiltration attempts.

  ### Investigation Steps
  - **Review Process Creation Events**: Check the process creation logs for instances of `query.exe` being executed. Pay close attention to the command-line arguments used, particularly those that involve redirections like `session >` and `process >`.

  - **Correlate with User Activity**: Validate if the execution of `query.exe` corresponds with known user activity or legitimate administrative tasks. Look for anomalous usage patterns that deviate from typical operational behaviors.

  - **Examine Related System Logs**: Investigate any system or Windows event logs that indicate access to sensitive information or alterations to sessions and processes. This could include event IDs related to process creation and user logons.

  - **Check for External Data Exfiltration**: Although the detection centers on the local usage of `query.exe`, consider monitoring for any associated outbound connections or data transfers that could signal that exfiltrated information is being sent externally.

  ### Prioritization
  The severity of this alert is medium due to the potential risk associated with an attacker using native tools to exfiltrate system data, which can pave the way for more significant breaches or disruptions within the enterprise environment. While legitimate administrative uses exist, anomalous patterns warrant urgent investigation.

  ### Blind Spots and Assumptions
  This detection may not capture all instances where `query.exe` is misused, particularly if attackers obfuscate their commands or utilize alternative methods to extract similar information. The detection logic assumes that `query.exe` will be executed as recorded in process creation logs with the specified command-line parameters. For effective detection, process creation logging must be enabled and properly configured within the Windows environment. Without comprehensive logging, detection capabilities could be severely diminished, leading to potential blind spots in recognizing malicious use of otherwise benign tools.

