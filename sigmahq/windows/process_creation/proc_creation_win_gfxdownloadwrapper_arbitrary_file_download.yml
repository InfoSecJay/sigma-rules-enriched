title: Arbitrary File Download Via GfxDownloadWrapper.EXE
id: eee00933-a761-4cd0-be70-c42fe91731e7
status: test
description: Detects execution of GfxDownloadWrapper.exe with a URL as an 
  argument to download file.
references:
- https://lolbas-project.github.io/lolbas/HonorableMentions/GfxDownloadWrapper/
author: Victor Sergeev, oscd.community
date: 2020-10-09
modified: 2023-10-18
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\GfxDownloadWrapper.exe'
    CommandLine|contains:
    - 'http://'
    - 'https://'
  filter_main_known_urls:
    CommandLine|contains: 'https://gameplayapi.intel.com/'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `GfxDownloadWrapper.exe` with a URL argument, indicating potential data exfiltration or malicious file download. The likely attacker objective is to leverage the `GfxDownloadWrapper.exe` utility to download arbitrary files without raising alarms, giving attackers an avenue for content that may be used in later stages of an attack. This behavior aligns with the MITRE ATT&CK technique: “Application Layer Protocol” (T1105).

  The primary telemetry sources are Windows process creation logs, specifically looking for Security Event ID 4688 and Sysmon Event ID 1. If the detected behavior is malicious, it can lead to unauthorized file downloads and potential code execution. This detection does NOT confirm that the file downloaded is malicious, as the presence of this execution alone cannot verify the intent or content of the downloaded file.

  ### Investigation Steps

  - **Review execution context of GfxDownloadWrapper.exe:** Check Security Event ID 4688 for instances of `GfxDownloadWrapper.exe`, noting the parent process and user context. Legitimate uses typically originate from known applications or processes such as Intel Graphics drivers.

  - **Analyze command line parameters:** Examine the CommandLine field in Sysmon Event ID 1 for URLs that accompany `GfxDownloadWrapper.exe`. URLs pointing to untrusted domains or containing suspicious keywords can indicate malicious activity.

  - **Correlate with network traffic:** Inspect network logs for outbound connections that match the URLs used in the `GfxDownloadWrapper.exe` execution. Look for anomalies in source IPs, high volumes of traffic, or connections to blacklisted or geographic risk locations.

  - **Check for file creation events:** Review Security Event ID 4656 for file creation events that coincide with the execution of `GfxDownloadWrapper.exe`. Look for newly created files in temporary directories or user directories that may suggest unauthorized downloads.

  - **Monitor legitimate Intel Graphic activities:** Validate that the use of `GfxDownloadWrapper.exe` aligns with expected behavior from Intel Graphics driver updates. Check for corresponding driver updates or installations in the environment, as these may justify the legitimate use of this executable.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems by allowing arbitrary file downloads, which can be exploited by attackers. While the likelihood of abuse is moderate, it is a well-known tactic among threat actors, particularly in environments where user privilege escalation could occur.

  ### Blind Spots and Assumptions

  Detection is limited by potential usage of `GfxDownloadWrapper.exe` for legitimate file downloads in managed environments. Ensuring that logging for process creation and the necessary telemetry from network devices are configured is essential for reliable detection. Moreover, legitimate application updates or security tools that utilize the executable might trigger this alert; hence, understanding the baseline usage is critical. Companion detections for other file download methods (like PowerShell or WMI) would strengthen overall detection capabilities.

