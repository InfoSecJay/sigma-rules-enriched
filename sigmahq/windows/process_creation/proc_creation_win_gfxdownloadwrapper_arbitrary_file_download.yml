title: Arbitrary File Download Via GfxDownloadWrapper.EXE
id: eee00933-a761-4cd0-be70-c42fe91731e7
status: test
description: Detects execution of GfxDownloadWrapper.exe with a URL as an argument
  to download file.
references:
- https://lolbas-project.github.io/lolbas/HonorableMentions/GfxDownloadWrapper/
author: Victor Sergeev, oscd.community
date: 2020-10-09
modified: 2023-10-18
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\GfxDownloadWrapper.exe'
    CommandLine|contains:
    - 'http://'
    - 'https://'
  filter_main_known_urls:
    CommandLine|contains: 'https://gameplayapi.intel.com/'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is focused on identifying the execution of `GfxDownloadWrapper.exe` with a URL parameter used for file downloads, a behavior indicating potential misuse of legitimate software to facilitate an arbitrary file download from the internet. This activity may be indicative of a command-and-control (C2) operation, where an attacker aims to retrieve malicious payloads onto a victim's machine under the guise of legitimate processes.

  The likely attacker objective is to leverage `GfxDownloadWrapper.exe` for downloading potentially harmful files, which can lead to further exploitation, data exfiltration, or installation of malware. Often used in conjunction with social engineering tactics, this method can evade traditional defenses by using trusted application names.

  This rule maps to the MITRE ATT&CK technique T1105 - "Ingress Tool Transfer". By detecting such behaviors, analysts can identify suspicious file downloads that could lead to further compromise. The primary data source for this detection comes from process creation events, particularly those monitored by EDR solutions, which will capture the command-line arguments used during execution.

  ### Investigation Steps
  - **Review Process Creation Events**: Look for instances of `GfxDownloadWrapper.exe` in your endpoint logs. Pay particular attention to the command-line arguments, specifically for any URLs present that indicate external connections.

  - **Investigate External Connections**: Analyze network logs to identify connections made to URLs retrieved during the execution of `GfxDownloadWrapper.exe`. This may involve querying firewall or proxy logs for unusual outbound traffic that corresponds with the identified URLs.

  - **Correlate with Other Logs**: Check if there are any related suspicious activities in other telemetry sources, such as antivirus alerts or behavioral logs from endpoint detection tools that align with the timeline of the execution of `GfxDownloadWrapper.exe`.

  - **Assess Environmental Context**: Evaluate the permissions and execution context of `GfxDownloadWrapper.exe`. Determine if it was run by a user with administrative privileges or from a suspicious location that could indicate a compromise.

  ### Prioritization
  The severity of this alert is medium due to the potential for unauthorized file downloads leading to malware infections and the likelihood that such activity may go unnoticed without proper monitoring of process execution context.

  ### Blind Spots and Assumptions
  One possible gap in detection coverage arises from legitimate use of `GfxDownloadWrapper.exe`, which might generate false positives in environments where it is rightly used. The detection logic assumes that any file download via this process is malicious unless specified as a trusted URL. For the alert to function effectively, it requires comprehensive logging of process creation events alongside complete command-line argument visibility, as well as a robust network logging solution to monitor outbound connections.

