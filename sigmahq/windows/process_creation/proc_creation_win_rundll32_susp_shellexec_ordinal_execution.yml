title: Suspicious ShellExec_RunDLL Call Via Ordinal
id: 8823e85d-31d8-473e-b7f4-92da070f0fc6
related:
- id: d87bd452-6da1-456e-8155-7dc988157b7d
  type: derived
status: test
description: |
  Detects suspicious call to the "ShellExec_RunDLL" exported function of SHELL32.DLL through the ordinal number to launch other commands.
  Adversary might only use the ordinal number in order to bypass existing detection that alert on usage of ShellExec_RunDLL on CommandLine.
references:
- https://redcanary.com/blog/raspberry-robin/
- https://www.microsoft.com/en-us/security/blog/2022/10/27/raspberry-robin-worm-part-of-larger-ecosystem-facilitating-pre-ransomware-activity/
- https://github.com/SigmaHQ/sigma/issues/1009
- https://strontic.github.io/xcyclopedia/library/shell32.dll-65DA072F25DE83D9F83653E3FEA3644D.html
author: Swachchhanda Shrawan Poudel
date: 2024-12-01
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_img:
    ParentCommandLine|contains: 'SHELL32.DLL'
  selection_parent_ordinal:
    ParentCommandLine|contains:
            # Note: The ordinal number may differ depending on the DLL version
            # Example: rundll32 SHELL32.DLL,#572 "cmd.exe" "/c calc.exe"
    - '#568'
    - '#570'
    - '#572'
    - '#576'
  selection_susp_cli_parent:
        # Note: Add additional binaries and suspicious paths to increase coverage
  - ParentCommandLine|contains:
    - 'comspec'
    - 'iex'
    - 'Invoke-'
    - 'msiexec'
    - 'odbcconf'
    - 'regsvr32'
  - ParentCommandLine|contains:
    - '\Desktop\'
    - '\ProgramData\'
    - '\Temp\'
    - '\Users\Public\'
  selection_susp_child_img:
    Image|endswith:
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\curl.exe'
    - '\mshta.exe'
    - '\msiexec.exe'
    - '\msxsl.exe'
    - '\odbcconf.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\schtasks.exe'
    - '\wmic.exe'
    - '\wscript.exe'
  condition: all of selection_parent_* and 1 of selection_susp_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious invocations of the `ShellExec_RunDLL` function of `SHELL32.DLL` using ordinal numbers instead of named exports. Attackers may leverage this technique to evade detection mechanisms monitoring standard command line executions, aiming to execute additional commands or scripts without raising alarms. The associated MITRE ATT&CK tactic is **Defense Evasion** (ID: T1218.011). Primary telemetry includes Windows process creation events specifically targeting Event ID 4688. If malicious, this behavior poses a significant security risk, allowing potential command execution or system compromise. However, this detection does NOT confirm malicious intent on its own; further context and investigation are necessary.

  ### Investigation Steps

  - **Verify Process Creation Events**: Check Windows Security Event ID 4688 for entries related to `rundll32` or other suspicious parent commands that feature ordinal calls, filtering for ParentCommandLine containing `SHELL32.DLL` and the specified ordinals (#568, #570, #572, #576).

  - **Analyze Suspicious Child Processes**: Inspect the created processes where the Image field matches known malicious executables (e.g., `cmd.exe`, `powershell.exe`, `mshta.exe`) that could indicate malicious activity stemming from the detected rule.

  - **Baseline Legitimate Use Cases**: Document and compare the alerting process against known legitimate usage of `ShellExec_RunDLL` in administrative tasks like software installs that may legitimately invoke processes through `msiexec.exe`.

  - **Investigate Command Line Arguments**: Review command line arguments in the Event ID 4688 logs for any suspicious flags or payloads, especially those that utilize command shells or such calling methods that could indicate redirection or execution of malicious payloads.

  - **Correlate with User Activity**: Cross-reference the detected process with user account activity. Look for anomalous login times or unusual accounts executing these commands, checking Active Directory logs for atypical behavior.

  - **Check for Elevated Permissions**: Look at the logs for any elevated permissions associated with the parent or child processes. Analyze the User SID fields in Event ID 4688 for any unauthorized administrative actions linked with the alert.

  ### Prioritization

  The severity of this alert is high, as it indicates potential use of advanced evasion techniques that could lead to system compromise. The system in question may host sensitive information or serve critical functions, increasing the risk of malicious abuse. The exploitation of this technique is commonly observed in targeted attacks, making timely response crucial.

  ### Blind Spots and Assumptions

  This detection has limitations as it may be evaded if attackers use alternate methods of launching commands or utilize different execution mechanisms that do not involve `SHELL32.DLL`. Ensuring comprehensive logging from Windows Security Event Logs is critical for detection reliability. Additionally, legitimate administrative actions and certain software installations may inadvertently trigger these alerts, necessitating thorough contextual investigations. A related detection to consider is the monitoring of unusual command-line patterns using Sysmon’s process creation events (Event ID 1) for broader coverage.

