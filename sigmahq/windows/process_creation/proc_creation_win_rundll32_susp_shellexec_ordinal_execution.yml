title: Suspicious ShellExec_RunDLL Call Via Ordinal
id: 8823e85d-31d8-473e-b7f4-92da070f0fc6
related:
- id: d87bd452-6da1-456e-8155-7dc988157b7d
  type: derived
status: test
description: |
  Detects suspicious call to the "ShellExec_RunDLL" exported function of SHELL32.DLL through the ordinal number to launch other commands.
  Adversary might only use the ordinal number in order to bypass existing detection that alert on usage of ShellExec_RunDLL on CommandLine.
references:
- https://redcanary.com/blog/raspberry-robin/
- https://www.microsoft.com/en-us/security/blog/2022/10/27/raspberry-robin-worm-part-of-larger-ecosystem-facilitating-pre-ransomware-activity/
- https://github.com/SigmaHQ/sigma/issues/1009
- https://strontic.github.io/xcyclopedia/library/shell32.dll-65DA072F25DE83D9F83653E3FEA3644D.html
author: Swachchhanda Shrawan Poudel
date: 2024-12-01
tags:
- attack.stealth
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_img:
    ParentCommandLine|contains: 'SHELL32.DLL'
  selection_parent_ordinal:
    ParentCommandLine|contains:
            # Note: The ordinal number may differ depending on the DLL version
            # Example: rundll32 SHELL32.DLL,#572 "cmd.exe" "/c calc.exe"
    - '#568'
    - '#570'
    - '#572'
    - '#576'
  selection_susp_cli_parent:
        # Note: Add additional binaries and suspicious paths to increase coverage
  - ParentCommandLine|contains:
    - 'comspec'
    - 'iex'
    - 'Invoke-'
    - 'msiexec'
    - 'odbcconf'
    - 'regsvr32'
  - ParentCommandLine|contains:
    - '\Desktop\'
    - '\ProgramData\'
    - '\Temp\'
    - '\Users\Public\'
  selection_susp_child_img:
    Image|endswith:
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\curl.exe'
    - '\mshta.exe'
    - '\msiexec.exe'
    - '\msxsl.exe'
    - '\odbcconf.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\schtasks.exe'
    - '\wmic.exe'
    - '\wscript.exe'
  condition: all of selection_parent_* and 1 of selection_susp_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious invocations of the "ShellExec_RunDLL" function in the SHELL32.DLL, specifically when called via ordinal numbers. Attackers may utilize this method to execute commands while evading conventional detection mechanisms focused on command line arguments. The likely objective is to execute malicious payloads or scripts stealthily on a victim's system. This behavior aligns with the MITRE ATT&CK tactic of Execution, specifically the technique for running executables via legitimate system processes (T1218.011).

  The primary telemetry sources for this detection include Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which provide information on process execution. If the detected behavior is indeed malicious, it could facilitate further malicious actions such as data exfiltration or malware installation. This detection does NOT confirm that malicious activity is occurring; it merely indicates a suspicious execution pattern warranting further investigation.

  ### Investigation Steps

  - **Review Process Creation Logs**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for the involved process. Look specifically for the executed command lines that include SHELL32.DLL and its ordinal value calls.

  - **Identify Malicious Indicators**: Look for the presence of suspicious child processes such as `cmd.exe`, `powershell.exe`, `bash.exe`, or others listed in the rule. Check if they appear in association with SHELL32.DLL calls, particularly those referencing the ordinals like `#570` or `#572`.

  - **Assess Parent Process Context**: Validate what initiated the ShellExec_RunDLL call. Analyze the `ParentCommandLine` fields for familiar execution paths. Legitimate calls often come from known system processes or user-initiated tasks, while unusual paths like `\Temp\`, `\ProgramData\`, or others can indicate compromise.

  - **Check for High-Confidence Malicious Payloads**: Investigate if there are any known malicious indicators associated with the detected command line calls. Use threat intelligence sources to identify if the specific executable (e.g., `mshta.exe`, `msiexec.exe`) has been tied to any previous incidents or documented threats.

  - **Examine Asset Criticality**: Consider the role of the affected asset. If the system is critical (e.g., server hosting sensitive applications), prioritize the investigation actions to prevent potential escalation of damage.

  - **Validate Artifacts in Temporary Locations**: If the execution appears malicious, check specific directories for unusual file creations or modifications around the time of execution, particularly in `\Temp\` or `\ProgramData\`.

  ### Prioritization

  This alert is of **high severity** due to the potential impact on critical systems and the likelihood of malicious behavior given the use of a stealthy execution method. The behavior indicated by this rule is a known tactic employed by attackers to bypass security controls, making it a common technique in exploitation and lateral movement scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion traits such as legitimate applications mimicking these calls or modifications in command line usage that differ from typical patterns. Reliance on specific event logging configurations is required to ensure comprehensive visibility; for example, Sysmon must be properly configured to capture process creation events. Legitimate usage of SHELL32.DLL in software installations could potentially trigger this alert. A companion detection rule focusing on `rundll32.exe` activity could further strengthen coverage against this attack vector.

