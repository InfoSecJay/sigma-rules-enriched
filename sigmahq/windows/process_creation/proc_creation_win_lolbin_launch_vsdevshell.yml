detection:
  selection_script:
    CommandLine|contains: 'Launch-VsDevShell.ps1'
  selection_flags:
    CommandLine|contains:
    - 'VsWherePath '
    - 'VsInstallationPath '
  condition: all of selection_*
falsepositives:
- Legitimate usage of the script by a developer
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of the `Launch-VsDevShell.ps1` script, which is a Microsoft signed PowerShell script commonly used to set up development environments. Attackers may use this script to evade detection while executing malicious commands, aiming to leverage developer tools for malicious purposes, such as establishing a foothold or executing further commands without raising suspicion.

  The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005), specifically technique T1216.001 – "Script-based payloads." Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to unauthorized access or code execution in a trusted development environment. This detection alone does not confirm malicious intent; legitimate use by developers is a known occurrence.

  ---

  ### Investigation Steps

  - **Review the command line arguments**: Check for `CommandLine` in Security Event ID 4688 or Sysmon Event ID 1 that contains `Launch-VsDevShell.ps1`. Ensure there are no additional suspicious flags or commands executed alongside it.

  - **Identify legitimate execution patterns**: Determine if similar script executions have a valid rationale, such as legitimate developer workstations executing `Launch-VsDevShell.ps1` for setting up environments. Look for the presence of standard development tools in use.

  - **Check for suspicious parent processes**: Examine the ParentProcessName field in the process creation logs for evidence of unusual or unexpected parent processes that could indicate a malicious execution chain.

  - **Cross-reference user activity**: Validate the user associated with the execution of the script against known developer identities. Any use by non-developer accounts may indicate potential abuse.

  - **Analyze spawned processes**: After the execution of `Launch-VsDevShell.ps1`, monitor for newly created processes linked to the script execution. Check for indicators of potentially malicious activity, such as attempts to connect to remote servers not associated with known developer tools.

  - **Validate file artifacts**: Look for any newly created files or modifications to scripts in common development directories as a result of running `Launch-VsDevShell.ps1`. This includes monitoring for unexpected files that may suggest misuse of development setup tools.

  ---

  ### Prioritization

  This alert should be treated with medium severity. While the impacted systems (developer workstations) can be critical in the enterprise landscape, the likelihood of abuse depends on user roles. Additionally, this behavior can often be observed during legitimate use cases by developers, requiring careful context in triage.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if execution logs are not enabled or if other PowerShell obfuscation techniques are employed. The legitimate usage of the script can occur during routine development tasks, potentially leading to false positives. A companion detection that strengthens coverage includes monitoring for unexpected scripts executed with elevated privileges, such as PowerShell scripts running with `-ExecutionPolicy Bypass`.

