detection:
  selection_script:
    CommandLine|contains: 'Launch-VsDevShell.ps1'
  selection_flags:
    CommandLine|contains:
    - 'VsWherePath '
    - 'VsInstallationPath '
  condition: all of selection_*
falsepositives:
- Legitimate usage of the script by a developer
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the 'Launch-VsDevShell.ps1' PowerShell script, which is commonly used to initiate a development shell session in Visual Studio. The likely attacker objective is to blend in with legitimate developer actions while gaining a foothold for further malicious activity through the established environment. This detection corresponds with the MITRE ATT&CK technique "Command and Scripting Interpreter: Windows Command Shell" (T1059.003) and "Scripting: PowerShell" (T1059.001).

  The primary telemetry source required for this detection is Windows process creation logs, specifically focusing on command line arguments associated with PowerShell execution (Event ID 4688 or Sysmon Event ID 1). If this behavior is malicious, it could lead to unauthorized access to sensitive development environments or facilitate lateral movement. However, this detection does NOT confirm that the execution was malicious on its own, as developers may legitimately use this script during their workflow.

  ### Investigation Steps

  - **Check the complete command line: **Review Event ID 4688 for the full command line of the executed process. Look for phrases like "Launch-VsDevShell.ps1" used with flags such as "VsWherePath" or "VsInstallationPath" to determine legitimacy.

  - **Correlate with known developer activity:** Validate if other processes or user account activity (e.g., logins or software installations) aligns with the time of execution. Legitimate activities may include frequent script usage by known developer accounts in applications like Visual Studio.

  - **Monitor process hierarchies:** Investigate parent process information tied to this execution via Sysmon Event ID 1. Check if the script was spawned by a legitimate application (e.g., Visual Studio), or if it is suspiciously executed by a less common parent like cmd.exe or a non-administrative user account.

  - **Identify malicious indicators:** Look for indicators of compromise, such as unusual command usage within the 'Launch-VsDevShell.ps1', or subsequent created processes attempting to access sensitive directories or network resources.

  - **Evaluate host role:** If this is observed on a critical system, such as a build server or a machine with access to sensitive code repositories, escalate the investigation to a higher tier due to increased risk.

  - **Examine subsequent network activity:** Use network logs to verify if any outbound connections were attempted post-execution of the script. Look for unusual external IP connections or data exfiltration patterns involving the developer workstation.

  ### Prioritization

  This alert should be prioritized as medium severity in enterprise context due to the potential risk of an attacker leveraging seemingly legitimate scripts for nefarious purposes, particularly in development environments. While this behavior may not always indicate actual compromise, it does present a plausible vector for abuse.

  ### Blind Spots and Assumptions

  Detection limitations include the risk of false positives from legitimate developer activity using 'Launch-VsDevShell.ps1', particularly in environments with active development teams. Complete logging of PowerShell command execution is crucial for reliable detection, as incomplete telemetry could allow malicious activity to go unnoticed. Related detections might include alerts for unusual PowerShell or command line activity that might indicate an elevated risk of exploitation or further investigation into the command context.

