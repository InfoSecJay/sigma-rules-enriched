title: Launch-VsDevShell.PS1 Proxy Execution
id: 45d3a03d-f441-458c-8883-df101a3bb146
status: test
description: Detects the use of the 'Launch-VsDevShell.ps1' Microsoft signed script
  to execute commands.
references:
- https://twitter.com/nas_bench/status/1535981653239255040
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
tags:
- attack.defense-evasion
- attack.t1216.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_script:
    CommandLine|contains: 'Launch-VsDevShell.ps1'
  selection_flags:
    CommandLine|contains:
    - 'VsWherePath '
    - 'VsInstallationPath '
  condition: all of selection_*
falsepositives:
- Legitimate usage of the script by a developer
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the Microsoft-signed script `Launch-VsDevShell.ps1`, which is commonly used to launch a Visual Studio Developer Command Prompt. While the script itself is legitimate and signed, its misuse can indicate potential malicious activities, especially if the script is used to execute unauthorized commands or invoke other tools. Attackers may leverage this script to evade detection while interacting with the development environment, potentially as part of a broader effort to gain persistence or execute further payloads through scripting.

  The rule primarily relates to the MITRE ATT&CK tactics of **Defense Evasion** (T1203) and specifically the technique **`T1216.001 - Script Execution: PowerShell Script`**. By utilizing signed scripts, attackers can obscure their actions, making it more challenging for conventional detection methods to catch them. Analysts should focus on telemetry from process creation events, particularly those originating from PowerShell, to identify when the `Launch-VsDevShell.ps1` script is executed.

  The best sources of evidence for this detection are **process creation logs** from Windows systems, which include details such as the command line arguments used, the user account executing the script, and the parent processes that spawned the PowerShell instance.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze the process creation logs specifically for instances where `Launch-VsDevShell.ps1` was executed. Pay attention to the context of the execution, including user account roles and the parent process.

  - **Check Command Line Arguments:** Look for unusual command line arguments accompanying the script execution such as `VsWherePath` and `VsInstallationPath`. Evaluate whether these paths correspond to legitimate installations of Visual Studio on the system.

  - **Assess User Activity:** Investigate the user account that triggered the script execution. Determine if there are any flags indicating unusual or unexpected behavior, such as attempts to access sensitive directories or services beyond the user's usual scope.

  - **Monitor Subsequent Commands:** After detecting the invocation of `Launch-VsDevShell.ps1`, evaluate any subsequent commands executed in the session. Such follow-up actions can provide critical insights into the intention behind the script's execution.

  ### Prioritization
  This alert is deemed medium severity due to the potential for misuse in a development environment. While the execution of the `Launch-VsDevShell.ps1` script alone may not be malicious, it can serve as a vector for attackers trying to obfuscate their activities, making immediate investigation necessary to understand the context of its use.

  ### Blind Spots and Assumptions
  The detection logic for this alert relies on the visibility of process creation logs. If logging is not adequately configured, there may be significant gaps in monitoring activities related to this script. Additionally, the rule assumes that the script execution happens without proper authorization; however, legitimate developer usage could lead to false positives. To function effectively, the appropriate logging needs to be enabled, and the security policies governing script execution must be enforced.

