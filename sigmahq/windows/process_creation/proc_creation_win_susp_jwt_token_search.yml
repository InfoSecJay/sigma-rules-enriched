title: Potentially Suspicious JWT Token Search Via CLI
id: 6d3a3952-6530-44a3-8554-cf17c116c615
status: test
description: |
  Detects potentially suspicious search for JWT tokens via CLI by looking for the string "eyJ0eX" or "eyJhbG".
  JWT tokens are often used for access-tokens across various applications and services like Microsoft 365, Azure, AWS, Google Cloud, and others.
  Threat actors may search for these tokens to steal them for lateral movement or privilege escalation.
references:
- https://mrd0x.com/stealing-tokens-from-office-applications/
- https://www.scip.ch/en/?labs.20240523
author: Nasreddine Bencherchali (Nextron Systems), kagebunsher
date: 2022-10-25
modified: 2025-10-21
tags:
- attack.credential-access
- attack.t1528
- attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_tools:
    CommandLine|contains:
    - 'find '
    - 'find.exe'
    - 'findstr'
    - 'select-string '
    - 'strings'
  selection_jwt_string:
    CommandLine|contains:
    - 'eyJ0eXAiOi'         # {"typ":
    - 'eyJhbGciOi'         # {"alg":
    - ' eyJ0eX'
    - ' "eyJ0eX"'
    - " 'eyJ0eX'"
    - ' eyJhbG'
    - ' "eyJhbG"'
    - " 'eyJhbG'"
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious command-line activities that involve searching for JSON Web Tokens (JWTs), particularly those containing specific substrings (e.g., "eyJ0eX" or "eyJhbG"). Attackers may exploit JWTs, often used as access tokens in cloud services such as Microsoft 365, Azure, and AWS, to perform lateral movement or privilege escalation by stealing valid tokens. The relevant MITRE ATT&CK techniques include Credential Access (T1528) and Abuse Elevation Control Mechanism (T1552.001).

  Primary telemetry sources are process creation logs from Windows, specifically looking for command-line arguments in Event ID 4688. If the detected behavior is malicious, it could lead to unauthorized access to sensitive systems and data. It is crucial to note that this detection does NOT independently confirm malicious intent, as legitimate users may also search for JWT tokens for valid reasons.

  ### Investigation Steps

  - **Identify the Command Line Usage:** Review Security Event ID 4688 logs for instances where the CommandLine field contains "find ", "findstr", "select-string", or "strings" alongside any of the JWT substrings.

  - **Evaluate the User Context:** Cross-reference the user account executing the commands with a list of authorized personnel who would require access to JWTs. Legitimate users may include application developers or system administrators using these tools for maintenance purposes.

  - **Investigate Process Origin:** Determine the parent process that generated the command invoking the search for JWTs. Commands executed by unusual or suspicious parent processes, like cmd.exe or PowerShell, warrant closer scrutiny.

  - **Check for Other Indicators of Compromise:** Look for patterns indicating automated scripts or tools that might be used for malicious activity, such as frequent or repetitive searches for JWT strings from the same user or system.

  - **Assess the Impact of Affected Systems:** Identify whether the affected system is critical or involved in sensitive operations, such as handling authentication and access management tasks, which increases severity if compromised.

  - **Collect Additional Contextual Logs:** Collect related logs (e.g., Azure AD sign-in logs, application access logs) to trace whether JWTs in question were recently accessed or if there are logs indicating abnormal authentication behaviors.

  ### Prioritization

  This alert has medium severity due to the potential criticality of affected systems, especially if they are related to access management. While the likelihood of malicious abuse is significant, the actions may also be indicative of legitimate administrative tasks. However, as JWTs are frequently abused in attacks, close monitoring is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited if command-line auditing is not fully enabled, as attackers could obfuscate their searches using various command-line tools or bypass it altogether. Be aware that legitimate administrative tasks or development activities may also trigger this alert, particularly in environments where JWTs are frequently used. A relevant companion detection could be tracking failed authentication attempts or unusual login patterns (MITRE ATT&CK ID: T1078) to strengthen overall situational awareness of potential credential abuse.

