title: Potentially Suspicious JWT Token Search Via CLI
id: 6d3a3952-6530-44a3-8554-cf17c116c615
status: test
description: |
  Detects potentially suspicious search for JWT tokens via CLI by looking for the string "eyJ0eX" or "eyJhbG".
  JWT tokens are often used for access-tokens across various applications and services like Microsoft 365, Azure, AWS, Google Cloud, and others.
  Threat actors may search for these tokens to steal them for lateral movement or privilege escalation.
references:
- https://mrd0x.com/stealing-tokens-from-office-applications/
- https://www.scip.ch/en/?labs.20240523
author: Nasreddine Bencherchali (Nextron Systems), kagebunsher
date: 2022-10-25
modified: 2025-10-21
tags:
- attack.credential-access
- attack.t1528
- attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_tools:
    CommandLine|contains:
    - 'find '
    - 'find.exe'
    - 'findstr'
    - 'select-string '
    - 'strings'
  selection_jwt_string:
    CommandLine|contains:
    - 'eyJ0eXAiOi'         # {"typ":
    - 'eyJhbGciOi'         # {"alg":
    - ' eyJ0eX'
    - ' "eyJ0eX"'
    - " 'eyJ0eX'"
    - ' eyJhbG'
    - ' "eyJhbG"'
    - " 'eyJhbG'"
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potentially suspicious command-line activity that indicates a search for JSON Web Tokens (JWT) using commonly utilized text-searching tools like `find`, `findstr`, or `select-string`. JWTs are often leveraged for authentication and authorization in web services such as Microsoft 365, AWS, and Azure. Attackers may seek to discover these tokens to exploit them for lateral movement within an environment or gain elevated privileges, thereby increasing their foothold in the target network.

  The relevant MITRE ATT&CK tactics that apply include **Credential Access** (TA0006) via techniques like **Steal Application Access Token** (T1528) and **Exploitation of Credentials** (T1552.001). The threat scenario typically involves a threat actor who has gained initial access and seeks to escalate privileges by acquiring access tokens through a host's command line interface.

  Primary data sources for this detection include **process creation logs**, specifically monitoring command-line arguments, which will reveal any executed commands that involve text searches for JWT patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs from endpoint detection and response (EDR) solutions for any recent command-line activities where suspicious search terms such as “eyJ0eX” or “eyJhbG” were used.
  - **Analyze User Context:** Identify the user account involved in the suspicious activity. Determine if it is an unusual account or if there have been any recent changes to its permissions that may raise flags for potential misuse.
  - **Correlate with Lateral Movement Indicators:** Look for any subsequent lateral movement attempts or attempts to access sensitive resources, particularly involving cloud services or enterprise applications.
  - **Investigate Related System Changes:** Check for any recent system configuration changes, particularly in authentication mechanisms or service account permissions, that could signal a more extensive compromise.

  ### Prioritization
  This alert is categorized as medium severity in an enterprise environment due to the critical nature of JWTs for access control, combined with the likelihood that attackers will search for these tokens to facilitate further unauthorized access or privilege escalation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are not retained for an adequate duration or if endpoint monitoring is not consistently applied across all user machines. The detection logic assumes that attackers will utilize common command-line tools for their searches, which may not apply to all attack scenarios. For this alert to function effectively, process creation logs must be collected and analyzed in real-time, and systems must be configured to capture and forward command-line invocation details accurately.

