status: test
description: Detects changing the PowerShell script execution policy to a 
  potentially insecure level using the "-ExecutionPolicy" flag.
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/set-executionpolicy?view=powershell-7.4
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_execution_policies?view=powershell-7.4
- https://adsecurity.org/?p=2604
- https://thedfirreport.com/2021/11/01/from-zero-to-domain-admin/
author: frack113
date: 2021-11-01
modified: 2025-10-07
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - OriginalFileName:
    - 'powershell_ise.exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  selection_option:
    CommandLine|contains:
    - '-executionpolicy '
    - ' -ep '
    - ' -exec '
  selection_level:
    CommandLine|contains:
    - 'Bypass'
    - 'Unrestricted'
  filter_main_powershell_core:
    ParentImage:
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\msiexec.exe'
    CommandLine|contains:
    - '-NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\PowerShell\7\'
    - '-NoProfile -ExecutionPolicy Bypass -File "C:\Program Files (x86)\PowerShell\7\'
  filter_optional_avast:
    ParentImage|contains:
    - 'C:\Program Files\Avast Software\Avast\'
    - 'C:\Program Files (x86)\Avast Software\Avast\'
    - '\instup.exe'
    CommandLine|contains:
    - '-ExecutionPolicy ByPass -File "C:\Program Files\Avast Software\Avast'
    - '-ExecutionPolicy ByPass -File "C:\Program Files (x86)\Avast Software\Avast\'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Administrator scripts
level: medium
note: |
  ### Technical Context

  This rule detects attempts to change the PowerShell script execution policy to insecure settings, such as "Bypass" or "Unrestricted", which allows scripts to run without restrictions. This behavior can be indicative of an attacker seeking to execute malicious scripts or payloads without being blocked by security mechanisms. It relates to the MITRE ATT&CK technique "Command and Scripting Interpreter: PowerShell" (T1059.001).

  The primary telemetry source for this detection is Windows process creation events, specifically Event ID 4688, capturing command line arguments associated with PowerShell processes. If malicious, this behavior can significantly compromise system integrity, allowing execution of arbitrary malicious code. It is crucial to note that the detection of insecure execution policy changes does NOT confirm malicious activity on its own, as legitimate administrative scripts may also perform similar actions.

  ### Investigation Steps

  - **Check PowerShell CommandLine Arguments:** Review Security Event ID 4688 for PowerShell processes where the `CommandLine` contains `-ExecutionPolicy Bypass` or `-ExecutionPolicy Unrestricted`. Malicious indications include command lines that perform unusual tasks, especially if combined with other suspicious indicators.

  - **Identify Legitimate Use Cases:** Determine if any authorized administrative actions were recently performed by correlating related events, such as legitimate administrator usage of PowerShell scripts with expected command lines. Look for patterns in business operations that typically use higher execution policies.

  - **Review Parent Process:** For any detected PowerShell execution, check the `ParentImage` field in Event ID 4688. If the parent process is not an expected administrative tool (e.g., `msiexec.exe`, or other benign processes), flag the activity for deeper analysis.

  - **Cross-Reference with Known Save Locations:** Validate if the script files being executed (indicated in command line with `-File`) reside in unexpected directories or show atypical names. Legitimate scripts often reside in standard folders (e.g., `C:\Scripts\`) rather than in user directories.

  - **Evaluate Process Completion Status:** Monitor the exit code of detected PowerShell executions in the logs. A non-zero exit code may indicate failure in legitimate operations, warranting further investigation into the executed commands.

  - **Consider Host Role:** If the alert originates from a critical server (e.g., Domain Controller, Database Server), prioritize this investigation due to the potential impact and risk of lateral movement.

  ### Prioritization

  This alert holds medium severity as it could indicate an evolving attack vector to exploit the environment. The presence of insecure execution policies significantly enhances the likelihood of malicious abuse, particularly on sensitive systems. However, this activity could also be legitimate in certain administrative contexts.

  ### Blind Spots and Assumptions

  Detection can be circumvented by well-crafted scripts that use legitimate execution policies or tools that operate outside standard PowerShell practices. Adequate logging configurations are crucial; ensure that process creation events convey detailed command lines. Additionally, legitimate administrative tasks, particularly during system deployments or updates, may frequently trigger this alert. Related detections, such as tracking changes to Group Policy Objects (GPO) affecting script execution policy, can strengthen coverage against overall malicious behavior.

