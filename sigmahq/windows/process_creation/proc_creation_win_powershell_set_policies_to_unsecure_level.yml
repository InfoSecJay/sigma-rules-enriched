note: |
  ### Technical Context

  This Sigma rule detects the alteration of PowerShell script execution policies to less secure levels (Bypass or Unrestricted) using the `-ExecutionPolicy` parameter. This behavior is typically associated with an attacker’s objective to run potentially malicious scripts that would otherwise be blocked by default PowerShell execution restrictions. The relevant MITRE ATT&CK technique here is "Command and Scripting Interpreter: PowerShell" (T1059.001).

  The primary telemetry source is the process creation logs on Windows systems, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture the command-line arguments used when launching PowerShell. If executed maliciously, this action could allow an adversary to execute arbitrary scripts or payloads, significantly increasing the risk of successful compromise. Importantly, this rule does NOT confirm malicious activity on its own, as legitimate administrative tasks can also modify the execution policy.

  ### Investigation Steps

  - **Review process creation logs**: Look for Windows Security Event ID 4688 or Sysmon Event ID 1. Examine the `CommandLine` field for entries containing `-ExecutionPolicy`, specifically 'Bypass' or 'Unrestricted'.

  - **Identify abnormal parent processes**: Confirm that the PowerShell instance is not spawned by trusted processes such as `C:\Windows\SysWOW64\msiexec.exe`. This may indicate a legitimate software installation rather than potential abuse.

  - **Check for known benign scripts or applications**: Assess if the PowerShell command involves legitimate script files, especially those located in `C:\Program Files\` or related directories for known applications like Avast that might not pose a threat.

  - **Document expected behavior**: Recognize that legitimate administrative tasks may involve changing execution policies. An expected benign activity may include scripts with `-ExecutionPolicy` set to `RemoteSigned` followed by actual script paths that reside within organizational policy.

  - **Look for signs of suspicious activity**: High-confidence malicious indicators include `CommandLine` patterns combining `-NoProfile`, `-ExecutionPolicy Bypass`, and pointing to uncommon script paths not recognized by the organization.

  - **Validate file creation or modifications**: Check for indicators of file or script creation in directories not typically used for trusted applications. This includes any `*.ps1` or `*.psm1` files created at the time the insecure policy was set, indicating possible script injection or unauthorized execution.

  ### Prioritization

  This alert should be elevated based on the potential impact on critical systems, as changing execution policies can enable broad script execution which is commonly weaponized in attacks. Given the likelihood of being exploited for scripting attacks, the alert warrants prompt investigation, especially in sensitive environments where PowerShell is heavily utilized.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as attackers using encoded commands or modifying execution policies through other indirect means. Moreover, this rule relies on the configuration of process creation logging being enabled; without this, the detection is ineffective. Legitimate administrative tasks, like updates or maintenance scripts, may also trigger the alert. Companion detections to consider include monitoring changes to user privileges or group memberships that may enable more extensive execution rights, enhancing overall security posture.

