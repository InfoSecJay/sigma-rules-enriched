logsource:
  category: process_creation
  product: windows
detection:
  selection_rundll:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: RUNDLL32.EXE
  - CommandLine|contains:
    - 'rundll32.exe'
    - 'rundll32 '
  selection_params:
    CommandLine|contains: '.dll'
    CommandLine|endswith:
    - ' StartW'
    - ',StartW'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects execution of the `rundll32.exe` process with commands that load DLLs, particularly using the `StartW` function, which is commonly associated with the Cobalt Strike framework. The likely objective of an attacker using this technique is to execute malicious payloads hidden within DLL files, enabling backdoor access or other malicious activities. This behavior falls under the MITRE ATT&CK technique T1218.011 (Signed Binary Proxy Execution) within the exploit and delivery phases of the attack lifecycle.

  The primary telemetry source for detection includes Windows process creation logs, specifically looking for Security Event ID 4688, which captures process creation details, including command line arguments. If this behavior is attributed to an adversary, it could lead to unauthorized access and further compromise of critical systems. However, this detection alone does not confirm that malicious activity has occurred, as legitimate applications may also use similar command line constructs.

  ### Investigation Steps

  - **Review process creation events:**
    - Check Security Event ID 4688 for instances of `rundll32.exe` with command line arguments. Look for uses of `StartW` or DLL paths in the process creation events.

  - **Identify command line arguments:**
    - Focus on the `CommandLine` field within process creation logs. Malicious activity typically has obfuscated or unusual DLL paths, while benign uses will generally involve known and trusted system DLLs.

  - **Analyze parent process relationships:**
    - Investigate the parent process of `rundll32.exe` to identify how it was launched. Look for anomalies such as suspicious parent processes (e.g., cmd.exe or powershell.exe) that may indicate a malicious chain of execution.

  - **Cross-reference system integrity:**
    - Validate the `Image` field against known good hashes for `rundll32.exe`. This can help to rule out tampered or replaced binaries, which is a strong indicator of compromise.

  - **Identify recent changes or unusual activities:**
    - Review system event logs for recent modifications to the system or suspicious accounts. Examples might include unexpected administrative logins, changes to Group Policy Objects, or unusual Windows services starting.

  ### Prioritization

  The alert should be considered high priority due to its potential impact on affected systems, especially if executed on critical infrastructure. The nature of DLL loading via `rundll32.exe` is commonly exploited in advanced persistent threats (APTs) and is frequently weaponized in modern attacks whereby adversaries deploy command-and-control capabilities.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where logging is not consistently enabled or configured for process creation events. Well-crafted benign applications might trigger this alert, such as legitimate software that uses `rundll32.exe` to load essential components correctly. A companion detection to consider is monitoring for unusual network connections initiated by `rundll32.exe`, which may provide further context for the investigation.

