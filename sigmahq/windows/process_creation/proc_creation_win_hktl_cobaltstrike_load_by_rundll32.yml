title: CobaltStrike Load by Rundll32
id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
status: test
description: Rundll32 can be use by Cobalt Strike with StartW function to load DLLs
  from the command line.
references:
- https://www.cobaltstrike.com/help-windows-executable
- https://redcanary.com/threat-detection-report/
- https://thedfirreport.com/2020/10/18/ryuk-in-5-hours/
author: Wojciech Lesicki
date: 2021-06-01
modified: 2022-09-16
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_rundll:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: RUNDLL32.EXE
  - CommandLine|contains:
    - 'rundll32.exe'
    - 'rundll32 '
  selection_params:
    CommandLine|contains: '.dll'
    CommandLine|endswith:
    - ' StartW'
    - ',StartW'
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential usage of Cobalt Strike by monitoring the command-line activity of `rundll32.exe`. Specifically, the rule looks for instances where this legitimate Windows utility is invoked in an unusual manner to load dynamic link libraries (DLLs) that may be used for malicious purposes, particularly the 'StartW' function associated with Cobalt Strike. Attackers may use Cobalt Strike, a popular post-exploitation tool, to maintain persistence, enable remote command execution, or orchestrate further stage payload delivery during a compromise.

  The primary objective of these activities is to exploit legitimate system utilities for malicious purposes, evading traditional security measures and gaining a foothold in a targeted environment. The relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)** and the technique **Rundll32 (T1218.011)**, reflecting the misuse of system tools to bypass detection and establish control over the victim system.

  For optimal detection of these activities, the primary data source will be **process creation events**, which log executable activity within the Windows environment, including invoked command lines and associated parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events for instances of `rundll32.exe` executing with unusual command line parameters, especially focusing on any usages that include '.dll' and the 'StartW' function.
  - **Investigate Parent Process Relationships:** Identify the parent process responsible for calling `rundll32.exe`. Look for any suspicious or non-standard processes that initiated these commands, as they may indicate lateral movement or additional compromise.
  - **Examine DLLs Loaded:** If possible, retrieve and analyze the DLLs being loaded by `rundll32.exe`. Assess their origin and integrity to determine if they are known legitimate Windows files or potentially malicious payloads.
  - **Correlate with Other Security Logs:** Cross-reference findings with logs from your EDR, firewall, and proxy to identify other related suspicious behaviors or communications that may indicate a coordinated attack pattern.

  ### Prioritization
  The alert's severity is classified as high due to the significant implications of an attacker leveraging Cobalt Strike to establish a foothold, which poses a considerable risk to enterprise security and integrity.

  ### Blind Spots and Assumptions
  This detection rule may not capture all variants of rundll32 misuse or attacks using alternative tools or methods. Additionally, it assumes that logging for process creation events is enabled and properly configured in the environment. If logging is disabled or the execution of suspicious processes is subsequently blocked by other security controls, detection may fail. Ensuring comprehensive logging and real-time monitoring is essential for accommodating such detection logic effectively.

