note: |
  ### Technical Context

  This Sigma rule detects the execution of rundll32.exe, a legitimate Windows process, that is being used to load Dynamic Link Libraries (DLLs) with the 'StartW' function from the command line. This behavior is characteristic of Cobalt Strike, a known attack framework that is often utilized in post-exploitation scenarios. The likely attacker objective is to execute malicious payloads stealthily by leveraging the built-in rundll32 utility, facilitating commands without triggering traditional security measures.

  The relevant MITRE ATT&CK tactic for this behavior is "Defense Evasion" (T1203), specifically technique "Rundll32" (T1218.011). Primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture command-line arguments and the process tree. If this behavior is malicious, it could lead to further compromise, exfiltration of data, or lateral movement within the network. However, this detection alone does NOT confirm that the activity is malicious, as rundll32 can be legitimately used for various system functions.

  ### Investigation Steps

  - **Examine the command line arguments:** Check for Event ID 4688 (Security log) or Sysmon Event ID 1 for rundll32.exe executions where `CommandLine` contains `.dll` and ends with `StartW` or `,StartW`. Malicious indicators include the non-standard use of rundll32 to execute DLLs.

  - **Review parent process relationships:** Evaluate the parent process of rundll32.exe (accessible in Event ID 4688 and Sysmon). A parent process like cmd.exe or PowerShell with unusual command-line arguments may indicate malicious activity, while benign processes like Explorer.exe do not raise concern.

  - **Identify legitimate rundll32 usage:** Compare against common system/service activities. Legitimate rundll32 calls usually do not load arbitrary DLLs or invoke `StartW`. Routine system activity can be verified against known-good hashes or application whitelists.

  - **Correlate with network activity:** Cross-reference unexpected rundll32 execution with network logs (e.g., proxy, firewall) for calls to external IPs or domains associated with known malicious actors. Look for unusual outbound traffic correlated with the timestamp of the alert.

  - **Flag suspicious file access:** Monitor for unusual DLL file access patterns in the relevant directories (typically C:\Windows\System32\ and user temp directories). Validate creation or modification timestamps that coincide with the rundll32 execution.

  ### Prioritization

  This alert has a high severity due to the potential impact on critical servers or endpoints. The use of rundll32 by a known exploit framework like Cobalt Strike suggests a high likelihood of malicious intent, especially if observed in environments that do not typically utilize this process in such a manner. The behavior is commonly weaponized in advanced persistent threats and is pivotal in post-exploitation activities.

  ### Blind Spots and Assumptions

  Detection of this behavior may be evaded through process impersonation or by using alternate tools that achieve similar results without invoking rundll32. Reliable detection requires Sysmon for detailed process creation logging. Legitimate administrative tasks or software installations may trigger the alert, such as updates or system maintenance routines. Monitoring companion detections such as abnormal PowerShell usage (T1059.001) can enhance threat visibility and validation of malicious activity.

