detection:
  selection_convert_b64:
    CommandLine|contains|all:
    - '-nop'
    - ' -w '
    - 'hidden'
    - ' -c '
    - '[Convert]::FromBase64String'
  selection_iex:
    CommandLine|contains|all:
    - ' -w '
    - 'hidden'
    - '-noni'
    - '-nop'
    - ' -c '
    - 'iex'
    - 'New-Object'
  selection_enc:
    CommandLine|contains|all:
    - ' -w '
    - 'hidden'
    - '-ep'
    - 'bypass'
    - '-Enc'
  selection_reg:
    CommandLine|contains|all:
    - 'powershell'
    - 'reg'
    - 'add'
    - '\software\'
  selection_webclient:
    CommandLine|contains|all:
    - 'bypass'
    - '-noprofile'
    - '-windowstyle'
    - 'hidden'
    - 'new-object'
    - 'system.net.webclient'
    - '.download'
  selection_iex_webclient:
    CommandLine|contains|all:
    - 'iex'
    - 'New-Object'
    - 'Net.WebClient'
    - '.Download'
  filter_chocolatey:
    CommandLine|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1"
    - 'Write-ChocolateyWarning'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell command invocations that exhibit characteristics commonly associated with malicious activity, such as obfuscation or bypassing security measures. The likely attacker objective is to execute PowerShell scripts discreetly to download or execute malware, perform reconnaissance, or manipulate system configurations without detection. This aligns with the MITRE ATT&CK framework, specifically the tactics of Execution (T1203) and Defense Evasion (T1218).

  The primary telemetry sources for detection include Windows Event ID 4688, which logs process creations, and Sysmon Event ID 1. If executed maliciously, such behavior may lead to unauthorized system access or data exfiltration. It is essential to note that this detection does NOT confirm malicious behavior on its own; further investigation is required to understand the context of the invocation.

  ### Investigation Steps

  - **Review Event Details: ** Check Windows Event ID 4688 for the detected PowerShell invocation. Investigate the `New-ProcessId` and `CommandLine` fields for the specific arguments flagged by the rule. Identify if the command line includes parameters like `-nop`, `-w hidden`, or any suspicious content.

  - **Trace Parent Process:** Identify the parent process of the PowerShell invocation in Event ID 4688. Look for known legitimate processes (e.g., cmd.exe, rundll32.exe) versus unusual or suspicious ones that may indicate process injection or manipulation.

  - **Check Execution Context:** Validate the account that triggered the PowerShell execution by analyzing Event ID 4624 (logon events). Confirm whether the user context is an administrative account, as malicious actors often leverage such accounts.

  - **Correlate Frequency of Execution:** Determine if the PowerShell command has been executed multiple times in a short timeframe. Multiple instances can indicate automated exploitation or malware activity as opposed to a single legitimate instance.

  - **Identify Malicious Indicators:** Look for additional signs of compromise or malicious behavior, such as the creation of unusual files or artifacts typically associated with malware downloads (like .exe files), especially in temporary directory paths.

  - **Contextualize with Legitimate Usage:** Cross-reference the command with documented legitimate use cases for PowerShell in your environment, particularly if used for administrative functions or scripted tasks. Check against automation frameworks (e.g., Site Reliability Engineering) that may explain the behavior.

  ### Prioritization

  This alert is of **medium severity** due to the potential impact on affected systems, especially if tied to administrative accounts or critical assets. The likelihood of abuse is moderate, as similar PowerShell techniques are often weaponized by adversaries for malicious actions.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as legitimate use of PowerShell for administrative tasks, which may trigger similar alerts. The success of this detection depends on having comprehensive logging enabled for process creation. Additionally, legitimate automation scripts and internal tools may exhibit similar behaviors, leading to false positives. A related detection is monitoring network traffic for unusual PowerShell data exfiltration to enhance coverage on suspicious activities.

