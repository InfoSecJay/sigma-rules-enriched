detection:
  selection_convert_b64:
    CommandLine|contains|all:
    - '-nop'
    - ' -w '
    - 'hidden'
    - ' -c '
    - '[Convert]::FromBase64String'
  selection_iex:
    CommandLine|contains|all:
    - ' -w '
    - 'hidden'
    - '-noni'
    - '-nop'
    - ' -c '
    - 'iex'
    - 'New-Object'
  selection_enc:
    CommandLine|contains|all:
    - ' -w '
    - 'hidden'
    - '-ep'
    - 'bypass'
    - '-Enc'
  selection_reg:
    CommandLine|contains|all:
    - 'powershell'
    - 'reg'
    - 'add'
    - '\software\'
  selection_webclient:
    CommandLine|contains|all:
    - 'bypass'
    - '-noprofile'
    - '-windowstyle'
    - 'hidden'
    - 'new-object'
    - 'system.net.webclient'
    - '.download'
  selection_iex_webclient:
    CommandLine|contains|all:
    - 'iex'
    - 'New-Object'
    - 'Net.WebClient'
    - '.Download'
  filter_chocolatey:
    CommandLine|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1"
    - 'Write-ChocolateyWarning'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell invocations characterized by specific command-line parameters commonly associated with obfuscation techniques. The behavior indicates a likely attempt to run malicious scripts or payloads through PowerShell, a common tool leveraged by attackers to execute commands stealthily. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), with the technique being **PowerShell** (T1059.001).

  The primary telemetry source is **Windows Process Creation logs**, specifically Security Event ID **4688** for monitoring command-line activities of PowerShell. If malicious, this could lead to unauthorized data access, system compromise, or lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own; further investigation is needed to validate the context and impact.

  ### Investigation Steps

  - **Examine the command line of the detected process**: Review the Security Event ID **4688** logs for the specific command line arguments used, focusing on obfuscation signs (e.g., '-nop', 'hidden'). Compare these against known legitimate PowerShell scripts or usages.

  - **Look for high-confidence malicious indicators**: Search for recent invocation patterns of PowerShell with parameters like 'iex' and 'Convert' combined with Base64 encoded strings in the command line. This indicates script downloading or execution, often associated with malware.

  - **Check for context around the process creation**: Verify the user account and the parent process that triggered the PowerShell execution in the logs. Legitimate administrative tasks may trigger the execution but typically do not use obfuscation parameters.

  - **Identify correlating logs for further confirmation**: Review network logs for unusual outbound connections that occurred following the PowerShell execution. Check for traffic patterns to known malicious IPs or domains that the PowerShell might be querying.

  - **Validate the presence of file creations/exfiltration**: Look for file creation or modification timestamps in directories commonly associated with script execution or temporary files, such as the user’s TEMP folder. Document any artifacts suggesting successful payload execution.

  ### Prioritization

  This alert should be treated with medium severity due to the potential harmful impact of an affected system, particularly if it is a critical asset or server. Given PowerShell's extensive use in modern attacks, the likelihood of malicious abuse is significant. Additionally, the behavior detected is commonly weaponized for initial access and lateral movement within environments.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques such as encoding parameters or using non-standard PowerShell flags that might bypass standard detection rules. Reliable detection relies on comprehensive logging configurations for process creation, command line data, and surrounding context. Legitimate activities, such as administrative script execution for system updates or configuration, may trigger these alerts. A companion detection to consider is monitoring for abnormal Windows service changes (MITRE ATT&CK ID: T1543) that might indicate a follow-up action from the detected PowerShell execution.

