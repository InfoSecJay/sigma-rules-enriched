detection:
  selection_convert_b64:
    CommandLine|contains|all:
    - '-nop'
    - ' -w '
    - 'hidden'
    - ' -c '
    - '[Convert]::FromBase64String'
  selection_iex:
    CommandLine|contains|all:
    - ' -w '
    - 'hidden'
    - '-noni'
    - '-nop'
    - ' -c '
    - 'iex'
    - 'New-Object'
  selection_enc:
    CommandLine|contains|all:
    - ' -w '
    - 'hidden'
    - '-ep'
    - 'bypass'
    - '-Enc'
  selection_reg:
    CommandLine|contains|all:
    - 'powershell'
    - 'reg'
    - 'add'
    - '\software\'
  selection_webclient:
    CommandLine|contains|all:
    - 'bypass'
    - '-noprofile'
    - '-windowstyle'
    - 'hidden'
    - 'new-object'
    - 'system.net.webclient'
    - '.download'
  selection_iex_webclient:
    CommandLine|contains|all:
    - 'iex'
    - 'New-Object'
    - 'Net.WebClient'
    - '.Download'
  filter_chocolatey:
    CommandLine|contains:
    - "(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1"
    - 'Write-ChocolateyWarning'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious PowerShell command invocations indicative of potential exploitation or malicious activity within a Windows environment. The focus is on PowerShell commands that exhibit behaviors commonly associated with evasion techniques, such as command obfuscation (e.g., encoding with Base64), running scripts in hidden windows, and initiating downloads via .NET web clients. Attackers may leverage these methods to execute unauthorized scripts, facilitating data exfiltration or the deployment of additional malicious payloads while attempting to evade detection.

  The related MITRE ATT&CK tactics for this detection include **Defense Evasion (TA0005)**, where adversaries strive to avoid detection and defensive measures. Specific techniques involved are:
  - **PowerShell (T1086)**: Utilizing PowerShell for command execution, often seen during post-exploitation.
  - **Command and Scripting Interpreter (T1059)**: Highlighting the use of command line interfaces for invoking scripts.
  - **Software Deployment Tools (T1072)**: Using environments like PowerShell to execute unwanted software, often exploiting legitimate functionalities.

  Primary data sources for this rule include process creation events that log command-line arguments, specifically focusing on logs from Windows process creation which will showcase the invoked PowerShell commands and their parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for any PowerShell instances that match the specified suspicious command patterns. Pay special attention to those using hidden windows (`-windowstyle hidden`).

  - **Analyze Command Parameters**: Assess the command-line arguments for signs of obfuscation or unusual behavior, such as encoded strings or references to web clients that may suggest downloading malicious content.

  - **Collect and Investigate Script Contents**: If a suspicious PowerShell invocation is located, check for the presence of scripts that are executed. Look for any scripts that may have been downloaded from external sources or have unclear origins.

  - **Correlate with Network Traffic**: Review outbound connections from the host to identify any downloads or connections made during the suspicious PowerShell command execution. Investigate if these communications align with known malicious infrastructure.

  ### Prioritization
  The severity level of this alert is medium due to the potential impact of PowerShell abuse in executing arbitrary commands and scripts, which can lead to significant breaches or data loss if not addressed. The likelihood of encountering such events increases, given the extensive use of PowerShell in administrative tasks within enterprise environments.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage as this rule may not capture all variations of malicious PowerShell usage, especially if attackers employ sophisticated methods to obscure their commands. The detection logic assumes that PowerShell logs are enabled and that command-line parameters are being recorded accurately. If command-line logging is not configured, or if the attacker uses tools not captured by this rule, there could be missed signals. Ensuring comprehensive logging and monitoring of PowerShell execution is essential for improving detection effectiveness.

