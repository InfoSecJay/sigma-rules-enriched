title: Service StartupType Change Via Sc.EXE
id: 85c312b7-f44d-4a51-a024-d671c40b49fc
status: test
description: Detect the use of "sc.exe" to change the startup type of a service 
  to "disabled" or "demand"
references:
- https://www.virustotal.com/gui/file/38283b775552da8981452941ea74191aa0d203edd3f61fb2dee7b0aea3514955
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-03-04
tags:
- attack.execution
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' config '
    - 'start'
    CommandLine|contains:
    - 'disabled'
    - 'demand'
  condition: all of selection_*
falsepositives:
- False positives may occur with troubleshooting scripts
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `sc.exe` utility to modify the startup type of a Windows service, specifically changing it to "disabled" or "demand." This behavior is commonly associated with attackers attempting to disable critical services to evade detection or disrupt system functionality. The relevant MITRE ATT&CK tactics are **Execution** (TA0002) and **Defense Evasion** (TA0005), with the specific technique being **Modify Existing Service** (T1562.001).

  Primary telemetry sources include Windows security event logs, specifically Process Creation events (Event ID 4688) and Sysmon logs (Event ID 1). If executed maliciously, this behavior can lead to significant security impacts, including the disabling of security measures and persistence mechanisms. Importantly, this detection does NOT confirm that malicious activity is occurring; it merely highlights a potentially suspicious change requiring further investigation.

  ### Investigation Steps

  - **Check Process Creation Events:** Validate the execution of `sc.exe` through Windows Security Event ID 4688 or Sysmon Event ID 1. Look for command lines that include `config` with parameters `disabled` or `demand`. Legitimate uses often involve administrative scripts for service management.

  - **Correlate with Service Changes:** Review the Service Control Manager (SCM) logs to identify changes made to service configurations. Confirm the affected services and their startup types prior to this command execution.

  - **Verify Administrator Access:** Examine user context under which the command was executed. If the command was run by a non-administrative user, this may indicate potential malicious intent.

  - **Analyze Command-Line Parameters:** Focus on command lines that include `sc.exe config` and confirm that the expected services are not critical to operations. Any unexpected service changes, especially for foundational services like Windows Update or security software, warrant deeper investigation.

  - **Determine the Asset Role:** Identify the host's role within the environment. For critical infrastructures, such as domain controllers or application servers, changes to services can pose higher risks.

  - **Review for Scheduled Tasks or Scripts:** Investigate if this command was executed as part of a larger script or scheduled task. Look for associated Event ID 4698 (scheduled task created) or corresponding task definitions to understand the context behind the service change.

  ### Prioritization

  This alert warrants medium priority based on the potential impact to affected systems, especially if they host critical services. The likelihood of malicious abuse is moderate, as service disruption or evasion tactics are frequently weaponized by adversaries during post-compromise scenarios.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion through the use of alternate command methods or tools that manipulate service configurations without utilizing `sc.exe`. Reliable detection requires proper logging configurations for both Process Creation and SCM events. Legitimate administrative actions, such as troubleshooting or team maintenance, may inadvertently trigger this alert. Companion detection, such as monitoring for abnormal service behavior or unexpected service stops (Event ID 7036), enhances overall coverage.

