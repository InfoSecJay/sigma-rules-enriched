detection:
  selection_img:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' config '
    - 'start'
    CommandLine|contains:
    - 'disabled'
    - 'demand'
  condition: all of selection_*
falsepositives:
- False positives may occur with troubleshooting scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the Windows command-line utility `sc.exe` to modify the startup type of a service, specifically changing it to "disabled" or "demand." Such changes may indicate an attempt by an attacker to disable security services or functionality, effectively paving the way for further malicious activities. The primary objective of this behavior is to hinder detection and response capabilities, potentially leading to a compromised system going unnoticed by security measures.

  The relevant MITRE ATT&CK techniques associated with this rule include **T1562.001 - Disable Security Tools** and **Execution (TA0002)**, as the use of `sc.exe` represents a method of gaining execution rights to alter service configurations. Attackers leveraging this behavior typically look to maintain persistence, escalate privileges, or evade detection, which can significantly impact the organization’s security posture.

  The primary data sources for this detection logic include **process creation events** from Windows logs, which would document when `sc.exe` is executed, along with any associated command-line arguments. This data is crucial for determining the context and intent behind the service modifications.

  ### Investigation Steps
  - **Identify Process Creation Events:** Review the process creation logs for instances of `sc.exe` execution, noting the user and timestamp for further context.
  - **Analyze Command-Line Arguments:** Examine the command-line arguments used with `sc.exe`, specifically looking for the presence of keywords such as "config," "start," "disabled," or "demand" to understand the nature of the service change.
  - **Correlate with Service Configuration State:** Investigate the Service Control Manager logs or Windows Management Instrumentation (WMI) to confirm the current state of services and whether any critical services have been disabled or modified.
  - **Assess User Behavior:** Determine whether the user executing the command has the appropriate permissions and legitimate justification for altering service states, and check for any unusually elevated privileges.

  ### Prioritization
  Alerts related to the modification of service startup types are of medium severity due to their potential impact on the security environment. Such changes can signal an attempt to bypass security mechanisms, which is a common tactic among threat actors looking to maintain stealth and control over compromised systems.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate administrative activities occurring, which may generate false positives when maintenance tasks are executed by authorized personnel. The detection logic assumes that any change to critical service startup types is malicious unless proven otherwise. Additionally, accurate logging configurations must be enabled to capture detailed process creation events, as this is essential for the alert to function effectively.

