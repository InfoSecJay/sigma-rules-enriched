title: Service StartupType Change Via Sc.EXE
id: 85c312b7-f44d-4a51-a024-d671c40b49fc
status: test
description: Detect the use of "sc.exe" to change the startup type of a service 
  to "disabled" or "demand"
references:
- https://www.virustotal.com/gui/file/38283b775552da8981452941ea74191aa0d203edd3f61fb2dee7b0aea3514955
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-03-04
tags:
- attack.execution
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\sc.exe'
  - OriginalFileName: 'sc.exe'
  selection_cli:
    CommandLine|contains|all:
    - ' config '
    - 'start'
    CommandLine|contains:
    - 'disabled'
    - 'demand'
  condition: all of selection_*
falsepositives:
- False positives may occur with troubleshooting scripts
level: medium
note: |
  ### Technical Context

  This rule detects the use of `sc.exe` to change the startup type of a Windows service to "disabled" or "demand". This behavior may indicate an attacker attempting to disable critical services to hinder detection or response efforts. The likely objective includes establishing persistence, evading security mechanisms, or creating a foothold within the system. Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **Defense Evasion** (TA0005), specifically the technique **Modify Service** (T1685).

  Primary telemetry sources for this detection are Windows Process Creation logs, specifically Security Event ID 4688, which logs process creation events. The security impact of this detection, if malicious, includes the potential for significant disruption to system operations. Importantly, this detection alone does not confirm malicious intent, as benign administrative actions such as service reconfiguration may also trigger the alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for `sc.exe` execution. Look for command lines that include patterns like `config` and `start`, followed by `disabled` or `demand`.

  - **Validate service adjustments:** Use PowerShell or WMIC commands to retrieve the current startup type for affected services. For instance, `Get-Service <ServiceName> | Select-Object StartType` will confirm if the service is indeed set to `disabled` or `demand` which could indicate malicious behavior.

  - **Investigate source of command:** Check the command line parameters of the `sc.exe` process. Valid command line entries will include `config` along with `start` followed closely by `disabled` or `demand`. Legitimate administrative scripts might present similar patterns but will typically involve other recognized service adjustments.

  - **Identify patterns of abuse:** Investigate the frequency and context of the `sc.exe` usage by tracking it over time. Multiple changes across several critical services or during unusual hours could indicate malicious intent.

  - **Assess user privileges:** Check the user account that executed the `sc.exe` command. Accounts with administrative privileges are more likely to be exploited. Use Security Event ID 4624 to identify the logon type and privileges of the executing user account.

  ### Prioritization

  This alert's severity is medium due to the potential impact on critical services, particularly if an attacker is attempting to disrupt detection mechanisms. The likelihood of malicious abuse is moderate, as disabling services is a common tactic among adversaries, particularly in later stages of an attack lifecycle.

  ### Blind Spots and Assumptions

  Detection could be limited by evasion techniques, such as spoofed command execution or the use of service management tools that do not trigger standard logs. Proper logging configurations for process creation and monitoring of service state changes are necessary for reliable detection. Legitimate activities such as system updates or administrative maintenance may also trigger similar alerts. Companion detections, such as monitoring for unauthorized service creations (also part of the service management vector), can provide additional coverage against related threats.

