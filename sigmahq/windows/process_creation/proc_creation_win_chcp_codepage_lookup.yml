logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\cmd.exe'
    ParentCommandLine|contains|windash:
    - ' -c '
    - ' -r '
    - ' -k '
    Image|endswith: '\chcp.com'
    CommandLine|endswith:
    - 'chcp'
    - 'chcp '
    - 'chcp  '
  condition: selection
falsepositives:
- During Anaconda update the 'conda.exe' process will eventually execution the 
  'chcp' command.
- Discord was seen using chcp to look up code pages
level: medium
