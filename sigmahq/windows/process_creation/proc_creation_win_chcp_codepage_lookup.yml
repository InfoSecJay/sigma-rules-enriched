note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the `chcp` command, which is used to check the current code page setting in Windows. This behavior is commonly associated with reconnaissance activities where adversaries seek to gather system information, particularly during the initial phases of a compromise to identify system configurations and language settings. The relevant MITRE ATT&CK technique is Discovery → System Information Discovery (T1614.001).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can indicate attempts by an attacker to understand the victim's system environment, which could aid in planning more effective attacks. However, this detection does NOT confirm malicious intent on its own, as legitimate applications and processes can also call `chcp`.

  ---

  ### Investigation Steps

  - **Identify the originating process: **Review Security Event ID 4688 logs for the creation of the `chcp.com` process. Check the `ParentImage` field to see if it lists `cmd.exe`, indicating that the command was run through a command shell.

  - **Analyze the command line: **Examine the `CommandLine` field in the logs for instances of `chcp`, especially variations like `chcp`, `chcp `, or `chcp  `. Look for anomalies, such as arguments or suspicious parent processes that could indicate malintent.

  - **Look for legitimate usage patterns: **Consider benign scenarios where `chcp` might be invoked, such as during the operation of Python environments (e.g., Anaconda) or applications like Discord. Validate against known behavior patterns to differentiate between normal and suspicious activity.

  - **Correlate with system state: **Cross-reference findings with Sysmon Event ID 1 logs, focusing on the `User` and `CommandLine` fields. Check for concurrent anomalous activity related to system enumeration or privilege escalation that might suggest a more significant compromise.

  - **Check for additional artifacts: **Investigate any file creations or modifications in directories typically associated with known attack tools. Validate that no unauthorized links to the system locale or sensitive file access occurred post-command execution.

  ---

  ### Prioritization

  This alert has medium severity as an indication of potential reconnaissance activity, especially in a sensitive or critical system environment. While `chcp` usage can be part of legitimate operational processes, its invocation alongside suspicious command line parameters enhances the probability of malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon or inadequate logging configurations. Legitimate activities such as software updates or common application behavior could trigger this alert, potentially resulting in false positives. Companion detections to consider may include monitoring for other command-line enumeration tools and Sysmon Event ID 10 (Process Access) to identify potential exploitation attempts following the discovery phase.

