note: |
  ### Technical Context
  This detection rule identifies the execution of the `chcp` (Change Code Page) command in a Windows environment, specifically when it is run from a command prompt (`cmd.exe`) with the intent of querying the system locale. The use of `chcp` for host discovery may indicate an adversary attempting to gather information about the system's configurations as part of the reconnaissance phase of an attack. Attackers often aim to map out a target environment to identify vulnerabilities or establish persistence.

  The relevant MITRE ATT&CK tactics and techniques that apply include **Discovery** (TA0007) and specifically **System Information Discovery** (T1614.001). Given that this command reveals details about the system's locale, it can assist attackers in confirming system configurations that may influence their subsequent actions or play a role in the exploitation phase.

  Primary data sources for detecting this activity include **process creation events**, which provide details on commands being executed, including parent processes. Querying Windows security logs can also be valuable, as they will capture the execution context in which `chcp` was used.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation events for instances of `chcp` being executed, particularly focusing on the command line arguments and parent images. Look for suspicious parent processes like `cmd.exe`.

  - **Check for Related Parent Commands**: Investigate the command line of the parent process for unusual options or pipe commands that might suggest the execution of additional commands.

  - **Analyze System Locale Context**: Validate the necessity of the `chcp` command in the context it was executed. Determine if the execution of this command aligns with typical organizational activities, as legitimate applications may also trigger these processes.

  - **Investigate Associated Network Activity**: Correlate any abnormal `chcp` executions with network behavior to identify if there were any data exfiltrations or unusual connections made that align with potential reconnaissance efforts.

  ### Prioritization
  The alert is classified with medium severity due to the potential for reconnaissance activity that may precede more harmful actions by an attacker. While executing `chcp` alone is not inherently malicious, its context within a sequence of commands or behaviors can indicate nefarious intent, necessitating timely investigation.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where legitimate software, such as Anaconda or Discord, may legally invoke the `chcp` command, potentially leading to false positives. The detection logic assumes that all uses of `chcp` are malicious when executed in a certain context, which may not always hold true. Effective detection relies on the availability of detailed process creation logs that must be configured and consistently collected in the environment for accurate alerting and analysis.

