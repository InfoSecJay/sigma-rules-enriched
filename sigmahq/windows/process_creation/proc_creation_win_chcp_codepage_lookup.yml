note: |
  ### Technical Context

  This rule detects the execution of the `chcp` command, which is used to determine the active code page on Windows systems, typically in the context of host discovery. Attackers may use this to ascertain system configuration and locale information as part of reconnaissance activities. The relevant MITRE ATT&CK tactics are Discovery, specifically the technique T1614.001 (System Information Discovery). The primary telemetry sources are Windows process creation events captured via Event ID 4688 and Sysmon Event ID 1, which track process execution and command lines. If executed maliciously, this command can indicate that an adversary is mapping the environment for further exploitation. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may also invoke `chcp`.

  ### Investigation Steps

  - **Check process execution details:** Review Windows Event ID 4688 or Sysmon Event ID 1 for the execution of `chcp.com`. Look specifically for the fields `Image`, `CommandLine`, and `ParentImage` to assess the context of invocation.

  - **Evaluate parent process context:** Identify the `ParentImage` which should end with `\cmd.exe` and check `ParentCommandLine` for arguments containing keywords like `-c`, `-r`, or `-k`. If the parent command line parameters do not align with typical administrative tasks, this may indicate malicious use.

  - **Identify regular use cases:** Understand that legitimate applications, like Anaconda updates and Discord, may issue `chcp` commands; correlate their execution times and associated applications against user activity logs to identify benign use.

  - **Analyze command consistency:** Confirm if the command line arguments for `chcp` appear consistently in a short time frame across multiple hosts, which could indicate automated reconnaissance by an adversary.

  - **Cross-check system criticality:** Investigate the asset role that executed the command. If a critical server or a sensitive system has executed `chcp`, prioritize for potential follow-up actions.

  - **Review for abnormal behavior:** Look for any accompanying suspicious activity, such as unexpected outbound connections or file changes, that might coincide with the execution of `chcp`, indicating a broader malicious instructional set.

  ### Prioritization

  This alert should be considered medium severity due to the potential for reconnaissance by an adversary, which can lay the groundwork for further exploitation. The likelihood of malicious use is moderate, particularly in sensitive or rarely accessed systems where host discovery could indicate preparation for an attack.

  ### Blind Spots and Assumptions

  There are limitations in detecting this behavior, as specific benign applications may trigger the alert (e.g., updates or certain software operations). Reliable detection requires accurate logging of command line executions via Event IDs; ensure Sysmon is correctly configured. Additionally, legitimate tasks, such as software installations and updates, may invoke `chcp`, creating noise in the alerting ecosystem. A related detection to consider is monitoring for suspicious process creation patterns associated with other discovery commands like `systeminfo` or `wmic`, which could enhance visibility into potential attacks.

