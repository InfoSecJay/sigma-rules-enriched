note: |
  ### Technical Context

  This Sigma rule detects the use of `wbadmin.exe` to recover files from backups, a behavior that can indicate potential adversarial activity. The likely attacker objective is to restore sensitive files—such as NTDS.DIT or registry hives—to exploit or extract credentials. This activity aligns with the MITRE ATT&CK tactic of **Impact** (TA1490), specifically targeting the technique associated with **Data Manipulation**.

  The primary telemetry sources include process creation events (specifically Windows Event ID 4688 for Security and Sysmon Event ID 1). If malicious, the recovery of sensitive files could compromise the integrity and confidentiality of critical systems. However, this detection does NOT confirm malicious intent on its own, as legitimate system administrators may occasionally use `wbadmin.exe` for recovery operations.

  ### Investigation Steps

  - **Examine Process Creation Events:** Review Windows Event ID 4688 for instances where the `Image` path contains `wbadmin.exe`, focusing on the `CommandLine` for keywords `recovery`, `recoveryTarget`, and `itemtype:File`.

  - **Confirm Host Role and Context:** Validate whether recovery activities are expected based on the host's role (e.g., backup server, admin workstation) and if they align with scheduled backup operations or recovery efforts.

  - **Analyze CommandLine Parameters:** Check the parameters used in the `CommandLine` field for signs of suspicious recovery targets (e.g., NTDS.DIT or registry hives), indicating a potential malicious focus on credential extraction.

  - **Review Timing of Activity:** Investigate the timestamps of `wbadmin.exe` usage in relation to other security events (such as unauthorized access attempts) to determine if this activity correlates with suspicious behavior or incident reports.

  - **Investigate Recent Backups:** Confirm the integrity and origin of the backups being accessed. Legitimate backups should be up-to-date and come from regular backup cycles; anomalies may indicate tampering or unauthorized access.

  - **Identify Indicators of Compromise (IoC):** Look for high-confidence malicious indicators such as unusual recovery target paths, particularly if they contain critical system files or properties that suggest unauthorized recovery activity.

  ### Prioritization

  The alert is medium severity due to its potential impact on sensitive systems, such as domain controllers or file servers that could lead to credential theft. Given that `wbadmin.exe` can be weaponized for harmful recovery actions, a proactive investigation is warranted whenever this flag is triggered.

  ### Blind Spots and Assumptions

  Detection accuracy may be limited by legitimate administrative use of `wbadmin.exe` for recovery tasks, potentially causing false positives. Dependable logs require proper configuration of Windows Event Log and Sysmon for comprehensive monitoring. Routine administrative activities, such as scheduled backup restorations or maintenance tasks by IT personnel, may trigger this alert. A related detection focused on changes to sensitive file statuses or access (e.g., examining Windows File Access Events) could enhance alerting accuracy and context.

