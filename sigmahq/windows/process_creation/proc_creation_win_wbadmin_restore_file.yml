note: |
  ### Technical Context
  This rule detects the execution of the `wbadmin.exe` tool to recover files from backups, which may indicate suspicious activity by an attacker attempting to restore sensitive files, such as the NTDS.DIT database or registry hives, from a backup. These files can contain critical information including user credentials, and attackers may seek to exploit this information to elevate privileges or access sensitive data within the environment. The usage of `wbadmin.exe` for recovery operations, typically reserved for legitimate system administration tasks, can signal unauthorized access or misuse.

  The relevant MITRE ATT&CK tactics include **Impact (TA0040)**, specifically the technique **Data Manipulation (T1490)**, which encompasses actions aimed at recovering or modifying data to accomplish an attacker's goals. To effectively detect this behavior, focus on monitoring process creation events that generate logs pertaining to the execution of the `wbadmin.exe` command.

  Primary data sources for analysis will include:
  - Process creation logs to capture execution details of the `wbadmin.exe` tool.
  - System logs that might document backup activity.
  - Potential changes in file system or access logs of sensitive directories after recovery operations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the logs for any instances of `wbadmin.exe` execution, particularly those with command line arguments indicating a recovery operation such as 'recovery' and 'itemtype:File'.
  - **Examine Backup and File Access Logs**: Check logs related to file system changes or access patterns following the execution of `wbadmin.exe` to see if sensitive files were restored.
  - **Query User Activity**: Investigate the account used to run `wbadmin.exe`; determine if it matches a legitimate administrator or if there are signs of compromise (e.g., unusual login times or locations).
  - **Assess Backup Configuration**: Confirm that backup configurations permit recovery operations only to authorized personnel, ensuring that access controls are properly enforced.

  ### Prioritization
  This alert should be considered medium severity due to the potential for significant data exfiltration and credential harvesting. Unauthorized recovery of critical files from backups demonstrates an active threat in the environment, highlighting the need for immediate investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the lack of logs capturing all instances of backup operations or if logging for process creation is not fully enabled on all endpoints. Assumptions include that the use of `wbadmin.exe` is not legitimate within all environments and that administrative activities are closely monitored. The detection logic relies on the accurate logging of process creation events and command line arguments associated with `wbadmin.exe`; therefore, proper configurations must be in place for effective detection.

