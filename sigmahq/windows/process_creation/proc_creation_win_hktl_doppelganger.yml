note: |
  ### Technical Context

  This Sigma rule detects the execution of the Doppelanger hacktool, which targets the LSASS process to dump security credentials. The primary attacker objective is to extract sensitive user credentials from the memory of the LSASS process. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006), specifically technique T1003.001, which focuses on OS Credential Dumping via process memory. The key telemetry source for this detection is process creation events from Windows, specifically event IDs 4688 (Process Created) and Sysmon ID 1 (Process Creation). If confirmed malicious, this activity poses a significant security risk, as it may lead to unauthorized access to critical accounts. This detection does NOT prove that credentials were successfully dumped; it only indicates the execution of the tool.

  ### Investigation Steps

  - **Verify process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for any executions of `Doppelganger.exe`. Export the details such as Process ID, User, and Parent Process ID to correlate context.

  - **Analyze command-line arguments:** Inspect the command line of the process creation events for unusual parameters that may indicate credential dumping behavior, such as memory address manipulation or specific target user accounts.

  - **Identify behavior of LSASS:** Understand typical LSASS behavior or legitimate processes attempting to access LSASS memory, such as IT administration tools or security solutions. This can be determined through historical analysis of common tools in your environment.

  - **Cross-reference known hashes:** Look for occurrences of the specific IMPHASH values (AB94D5217896ADCD765A06B2D52F0AEB and 65F0EA61156EE0C2A35421926F0C7F78) associated with Doppelanger. This can help differentiate between legitimate applications and confirmed malicious indicators.

  - **Monitor process interactions:** Use Sysinternals tools or supported solutions to trace the interactions made by the process post-creation to spot any suspicious behavior, like attempts to read from LSASS or creating additional processes.

  - **Fan-out subsequent activity:** Investigate if there are any outbound connections or suspicious file creation events post-execution, particularly in sensitive directories, which may indicate credential exfiltration attempts.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on sensitive system accounts and the likelihood that this technique is weaponized in advanced persistent threat scenarios. The ability to extract credentials from LSASS gives attackers extensive access to enterprise environments, making this behavior critical to investigate immediately.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of event logging, as Sysmon must be deployed to capture detailed process creations and interactions. Legitimate administrative applications may trigger false positives by attempting to interact with LSASS for legitimate purposes. Companion detections based on other credential dumping techniques, such as Mimikatz executions or abnormal access to LSASS, would strengthen overall coverage and allow for better context.

