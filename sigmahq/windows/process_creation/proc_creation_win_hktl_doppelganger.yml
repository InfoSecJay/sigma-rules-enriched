  ### Technical Context

  This rule detects the execution of the Doppelanger tool, which is employed by attackers to dump LSASS memory by cloning processes, thereby aiming to extract sensitive credentials. The likely objective of using this hacktool is credential theft, facilitating lateral movement or further exploitation of the network. This behavior corresponds to the MITRE ATT&CK technique for Credential Access: LSASS Memory Theft (T1003.001). Primary telemetry sources include process creation events from Windows Security (Event ID 4688) and Sysmon (Event ID 1) logs, capturing relevant information about processes initiated on the system. If malicious, the execution of this tool could severely compromise user credentials leading to unauthorized access. Importantly, this detection does not confirm that the credentials have been successfully extracted or misused.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs:** Check Windows Security Event ID 4688 for new process creation events. Look for process names ending with `Doppelganger.exe`. Note any parent processes that initiated this executable, as benign instances often originate from legitimate administration tools.

  - **Check Sysmon Logs for Execution Details:** Query Sysmon Event ID 1 to gather additional context on the process, including command-line arguments and hashes. Verify the presence of the specific IMPHASH values associated with Doppelanger (e.g., `AB94D5217896ADCD765A06B2D52F0AEB`).

  - **Analyze the Process Environment:** Examine the environment variables of the executing Doppelanger process in both the Security and Sysmon logs to determine if suspicious artifacts or configurations suggest malicious intent.

  - **Identify High-Confidence Indicators:** Look for a sudden spike in abnormal LSASS memory access patterns, which may indicate the tool’s use for credential dumping. Correlate this with any known indicators of compromise within the network.

  - **Assess the Host Role and Criticality:** Confirm if the process was executed on a critical server (e.g., domain controllers or application servers) where credential access could be more damaging. This could elevate the severity of the incident.

  - **Document Legitimate Usage Scenarios:** Identify and note any known legitimate uses of process cloning or credential access tools within the organization, as these may lead to false positives. Examples include justifiable administrative tasks or security assessments that utilize similar methodologies.

  ---

  ### Prioritization

  The alert should be treated as high severity due to the critical nature of credential theft and the capability of the Doppelanger tool to bypass standard detection mechanisms. Systems affected by this alert are often central to an organization's security infrastructure, making them prime targets for adversaries. This behavior is increasingly weaponized within attack scenarios, raising the potential for significant breaches.

  ---

  ### Blind Spots and Assumptions

  This detection has limitations, particularly due to potential evasion techniques that attackers may use to mask process execution or alter signatures. It requires comprehensive logging configuration, including enabling Sysmon for detailed process logs to ensure reliable detection. Legitimate activities that might trigger this alert include authorized security assessments or troubleshooting sessions involving similar tooling. A related detection rule focusing on abnormal LSASS memory access patterns (e.g., identifying sudden spikes in memory usage) could further strengthen overall monitoring.

