note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows Package Manager (winget) specifically when an attacker attempts to add a new download source. The likely attacker objective may be to execute or install malicious applications without alerting security systems by utilizing trusted legitimate tooling. This behavior falls under the MITRE ATT&CK technique "Command and Scripting Interpreter" (T1059).

  The primary telemetry source is Process Creation logs, specifically Security Event ID 4688 for process creation events. If malicious, the security impact could include unauthorized software installation, potentially allowing an attacker to deploy further malicious payloads or backdoors on the system. This detection does NOT confirm that the execution is malicious on its own; legitimate administrative actions may trigger this alert when adding trusted package sources.

  ### Investigation Steps

  - **Review the command line arguments: **Focus on Security Event ID 4688 for winget.exe to capture the complete command line. Legitimate commands may include adding known repository URLs, whereas suspicious URLs or repository names should raise concern.

  - **Identify previous actions: **Check for recent administrative changes (Event ID 4670) that may indicate a contextual pattern for adding sources. A sudden change in allowed sources without documented need may suggest malicious intent.

  - **Cross-reference with DNS logs: **Analyze DNS queries related to the added source to ensure they resolve to expected and legitimate addresses. Any resolutions to unknown or unsecured domains could indicate a compromise.

  - **Validate the source repository: **Investigate the listed repository source in the winget command. Confirm whether it has been previously trusted or documented by IT. Adding repositories from unrecognized sources can indicate malicious activity.

  - **Analyze user behavior: **Look into the user account executing the command (Event ID 4624) to determine if it aligns with typical administrative practices. An unusual user or a non-admin account performing this action could be suspicious.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized software installation, particularly on critical systems. The likelihood of malicious use is moderate, given the common exploitation of trusted tools for nefarious purposes. It is a known tactic in lateral movement and establishing persistent access.

  ### Blind Spots and Assumptions

  Limitations include the potential for false positives from legitimate administrative actions when a trusted source is added. The necessity for reliable process creation logs and appropriate logging configurations is critical for detecting this behavior. Legitimate activities may include adding trusted company repository sources. A related detection to strengthen coverage is monitoring for unusual application installations from added sources, which can be further investigated alongside application logs.

