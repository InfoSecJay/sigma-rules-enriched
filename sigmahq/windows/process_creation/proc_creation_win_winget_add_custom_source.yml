note: |
  ### Technical Context
  This rule detects the use of the Windows Package Manager (`winget`) to add new download sources, which could indicate attempts to modify package sources that have not been authorized in an enterprise environment. Attackers may use this capability to enable the installation of malicious software by adding unverified sources, thereby bypassing organizational controls. By leveraging `winget`, adversaries can exploit trust in package management to execute arbitrary code, potentially delivering malware or conducting further malicious activities.

  The primary MITRE ATT&CK tactics relevant to this detection include:
  - **Defense Evasion (T1562)**: Adding unapproved sources helps in evading detection by allowing malicious payloads to be installed through legitimate means.
  - **Execution (T1059)**: The use of command-line tools like `winget` directly falls under execution techniques, where adversaries execute scripts or commands to carry out malicious actions.

  The primary data source for this detection is the **process creation logs** on Windows systems, where `winget.exe` commands are logged. Additional logs around Windows Event IDs specifically pertaining to command-line executions will provide further context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances where `winget.exe` has been executed, focusing on the command line parameters used, particularly those related to "source add".
  - **Check for Unauthorized Sources**: Query the current list of configured sources in `winget` using `winget source list` to identify any unfamiliar or unauthorized entries that may have been added.
  - **Correlate with User Activity**: Assess user accounts that executed the `winget` command to determine if they have the legitimate permissions to modify package sources; look for anomalies in user behavior.
  - **Monitor for Related Activity**: Investigate subsequent installations or updates via `winget` that may have originated from the newly added sources; this can indicate exploitation following the addition of malicious sources.

  ### Prioritization
  The severity of this alert is medium due to the potential for malicious software installation that could lead to significant enterprise risk. While it may indicate unauthorized changes, the context of the command usage must be analyzed to determine the actual threat level.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative activities versus malicious ones, especially if privileged users are involved. The detection logic assumes that any addition of a source is suspicious, but organizations might allow this for specific cases. It requires that process creation logs are enabled and properly configured on endpoints to function effectively. Additionally, the rule may produce false positives when administrators add sources for verified utilities, highlighting the need for contextual understanding in each case.

