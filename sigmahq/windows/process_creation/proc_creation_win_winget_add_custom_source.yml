note: |
  ### Technical Context

  This rule detects the execution of the `winget` command-line tool to add new download sources to the Windows Package Manager. Attackers may use `winget` to install malicious software or add compromised repositories to facilitate the download of harmful binaries. This behavior correlates to the MITRE ATT&CK tactic of Execution (TA0002) and the technique Command-Line Interface (T1059). The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to unauthorized software installations or increased attack surface through untrusted sources. It is important to note that this detection does not confirm malicious activity by itself, as legitimate administrators may also perform this task.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for `winget.exe` execution. Focus on the `CommandLine` field for instances containing 'source add', as benign use cases may appear with approved repository names.

  - **Examine command line arguments:** Analyze the full command-line arguments used in `winget.exe`. Look for unusual or untrusted source URLs—these could indicate malicious intent. Legitimate command lines typically reference known, authorized sources.

  - **Review repository additions:** Investigate the repository list with the `winget source list` command. Compare newly added sources against a whitelist of approved repositories. Any discrepancies warrant further scrutiny.

  - **Assess system criticality:** Identify whether the affected system is a critical asset (e.g., servers or workstations with sensitive data). Malicious additions on critical systems pose a greater risk.

  - **Verify network activity:** Inspect network logs or packet captures for communications made to newly added repositories. Malicious indicators may include DNS queries or connections to known bad IP addresses.

  - **Correlate with similar alerts:** Cross-reference with related detection (ID: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2) about command-line use and process creation that may indicate a larger attack context or campaign.

  ### Prioritization

  The alert severity is considered medium due to the potential for unauthorized installations caused by adding untrusted sources. While the use of `winget` can be legitimate, the specific behavior detected (adding a new source) is atypical for common user activity, highlighting an increased likelihood of malicious exploitation, especially if performed on critical endpoints.

  ### Blind Spots and Assumptions

  This detection can be circumvented by attackers using obfuscated command lines or invoking `winget` indirectly through other binaries. Reliable detection requires robust logging configurations and monitoring for `winget` activity. False positives may arise from legitimate administrative actions or internal scripts, particularly if they involve adding trusted sources. Companions such as detecting changes to the `winget` configuration files (related detection ID: c15a46a0-07d4-4c87-b4b6-89207835a83b) could enhance coverage and provide a fuller picture of the activity.

