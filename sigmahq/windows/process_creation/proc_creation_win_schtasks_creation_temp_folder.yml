title: Suspicious Scheduled Task Creation Involving Temp Folder
id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
status: test
description: Detects the creation of scheduled tasks that involves a temporary folder
  and runs only once
references:
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
author: Florian Roth (Nextron Systems)
date: 2021-03-11
modified: 2022-10-09
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - ' /create '
    - ' /sc once '
    - '\Temp\'
  condition: selection
falsepositives:
- Administrative activity
- Software installation
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks on Windows systems that reference a temporary folder and are designed to execute only once. Such behavior is often leveraged by attackers to execute malicious payloads without creating a persistent presence that could be easily identified by security tools. The usage of temporary folders may indicate an attempt to hide the execution technique, making it more challenging for traditional security measures to catch it.

  The suspected threat scenario aligns with tactics employed by various threat actors using malware to establish initial footholds or deliver payloads that could escalate privileges or exert malicious control over a system. Notably, this activity can include executing initial access techniques or privilege escalation strategies as defined within the MITRE ATT&CK framework. Relevant tactics and techniques include:
  - **Execution** (TA0002) and specifically **Scheduled Task/Job (T1053.005)**
  - **Persistence** (TA0003), since the creation of a scheduled task is indicative of an attacker attempting to maintain a foothold.

  Primary data sources for detection include process creation events, specifically monitoring command-line activity and the use of the `schtasks.exe` utility.

  ### Investigation Steps
  - **Review Task Scheduler Logs:** Investigate the Windows Task Scheduler logs to identify any newly created or modified tasks that utilize temporary directories and run under suspicious user accounts.
  - **Analyze Command-Line Arguments:** Examine the command-line arguments passed to the `schtasks.exe` process for patterns that match the creation of tasks. Look for malicious parameters indicating one-time executions in temporary folders.
  - **Correlate User Activity:** Cross-reference the execution of this scheduled task with user activity logs to determine if the task creation corresponds to legitimate administrative actions or malicious activity attempting to utilize system functionality for nefarious purposes.
  - **Check for Cleanup/Deletion Patterns:** Monitor for subsequent deletions of the scheduled tasks and associated temporary files, which might indicate an attempt to cover tracks after the execution of a malicious payload.

  ### Prioritization
  The alert is categorized as high severity due to the impactful nature of malicious scheduled tasks that can be leveraged for privilege escalation or data exfiltration. The likelihood of such tasks being used for advanced attacks increases in environments where administrative oversight is limited or user permissions are misconfigured.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may include legitimate administrative use of scheduled tasks that could exhibit similar command-line patterns, leading to false positives. The detection rule assumes that the environment's logging level captures detailed process creation events and that `schtasks.exe` is the only way tasks are created through command-line interface. To ensure the alert functions correctly, comprehensive logging of process creations and command-line parameters must be enabled, particularly on endpoints where unusual task creation is monitored.

