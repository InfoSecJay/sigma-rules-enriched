logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - ' /create '
    - ' /sc once '
    - '\Temp\'
  condition: selection
falsepositives:
- Administrative activity
- Software installation
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks using the Windows `schtasks.exe` command, specifically targeting tasks that run once and utilize the system's temporary folder. This behavior is characteristic of lateral movement or post-exploitation activities by an attacker, likely aiming to maintain persistence or execute malicious payloads without alerting defenses. The relevant MITRE ATT&CK tactic is Persistence, with the associated technique being Scheduled Task/Job (T1053.005).

  The primary telemetry source for this detection is Windows Process Creation logs, particularly focusing on event logs related to task creation, which can highlight unauthorized scheduled tasks. If this activity is malicious, it could allow an attacker to execute payloads with elevated privileges, potentially leading to further exploitation or data exfiltration. However, this detection does NOT confirm that malicious activity is ongoing or that the task is indeed harmful; it merely indicates a suspicious behavior that requires further investigation.

  ### Investigation Steps

  - **Review the Process Creation Logs:** Examine Windows Security Event ID 4688 for instances of `schtasks.exe` with a CommandLine parameter containing both `/create` and `/sc once`. Check for legitimate administrative activities that may show expected uses of the Temp folder.

  - **Validate Suspicious CommandLine Parameters:** Inspect the CommandLine for unusual parameters or obfuscation techniques. An example of a high-confidence malicious indicator would be a CommandLine including encoded or obfuscated scripts intended to run from the Temp folder.

  - **Cross-Reference Scheduled Tasks:** Use `schtasks` or PowerShell cmdlets (e.g., `Get-ScheduledTask`) to list all scheduled tasks on the system. Determine if the newly created task matches an expected administrative task, such as backups or maintenance routines.

  - **Identify Creation User Context:** Correlate the event with the User field from Event ID 4688 to determine which account created the scheduled task. Look for unfamiliar accounts or accounts with unusual activity patterns.

  - **Check for Temporary Folder Artifacts:** Investigate the contents of the Temp folder (C:\Users\<Username>\AppData\Local\Temp) for unexpected or recently created files that might be associated with the newly scheduled task.

  - **Assess System Context and Asset Criticality:** Determine if the affected system is critical to operations, such as domain controllers or servers handling sensitive data. Elevated risk may require immediate remediation actions or heightened monitoring.

  ### Prioritization

  This alert should be prioritized as high due to the potential for immediate impact if a malicious actor gains persistence on a critical enterprise system. Malicious scheduling of tasks has been commonly weaponized in various cyber threat scenarios, raising the likelihood of exploitation.

  ### Blind Spots and Assumptions

  This detection may miss scheduled tasks created by legitimate administrative processes if proper logging is not enabled. It relies on detailed Windows event logging, which must be configured correctly to catch all instances. Legitimate activities such as software installation can trigger this alert, possibly leading to false positives. A related detection to strengthen coverage would be monitoring for unexpected PowerShell executions (T1059.001) that often precede or follow the creation of malicious tasks.

