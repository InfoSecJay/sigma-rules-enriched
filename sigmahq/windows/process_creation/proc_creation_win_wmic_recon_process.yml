title: Process Reconnaissance Via Wmic.EXE
id: 221b251a-357a-49a9-920a-271802777cc0
status: test
description: Detects the execution of "wmic" with the "process" flag, which adversary
  might use to list processes running on the compromised host or list installed software
  hotfixes and patches.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
author: frack113
date: 2022-01-01
modified: 2023-02-14
tags:
- attack.execution
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: 'process'
  filter_main_creation:
    CommandLine|contains|all:
            # Rule id 526be59f-a573-4eea-b5f7-f0973207634d for `wmic process call create #{process_to_execute}`
    - 'call'
    - 'create'
  condition: all of selection* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `wmic.exe` with a specific focus on the "process" flag, which adversaries may leverage to gather intelligence about running processes or installed software patches on a compromised system. Attackers might use this technique during the early stages of an attack to map out a victim's environment, identify potential targets for further attacks, or develop a deeper insight into the security posture of the system.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002) and the specific technique known as **System Information Discovery** (T1047). The primary data sources likely to provide useful evidence include process creation logs from endpoint detection and response (EDR) tools, which will capture details about executed commands and their arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look into process creation logs to identify occurrences of `wmic.exe` launching with command-line parameters. Focus on entries that contain both `process` and `call create`, as these can indicate reconnaissance activities.
  - **Analyze Command-Line Arguments**: Examine the specific command-line arguments used with `wmic.exe`. Check for any unusual or suspicious parameters that may indicate malicious intent or targeted reconnaissance.
  - **Correlate with User Activity**: Map the activities of the user or system account that executed `wmic.exe`. Look into recent login times, origin IP addresses, and any related activities that could provide context around the execution event.
  - **Monitor for Further Commands**: After identifying `wmic.exe` execution, look for subsequent commands or activity indicative of privilege escalation or lateral movement, especially involving network connections or additional tools.

  ### Prioritization
  This alert is prioritized as medium severity due to the potential use of process reconnaissance techniques by attackers to facilitate further malicious actions, which could lead to significant compromises if not addressed quickly.

  ### Blind Spots and Assumptions
  Possible gaps in detection might arise from the absence of adequate logging on systems lacking EDR agents or if process creation logging is not enabled. The detection logic assumes that `wmic.exe` will be utilized in typical reconnaissance methods; however, it may not account for legitimate administrative use cases or other actors using different tools or method variations. Ensuring that process creation logging is properly configured is vital for the efficacy of this rule.

