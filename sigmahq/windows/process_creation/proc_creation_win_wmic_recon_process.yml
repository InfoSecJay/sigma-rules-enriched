note: |
  ### Technical Context

  This Sigma rule detects the execution of `wmic.exe` with the `process` parameter, which is often used in reconnaissance activities to gather information about running processes on a Windows host. Attackers may aim to enumerate processes to understand the running services or target specific applications. This behavior aligns with the MITRE ATT&CK technique for process discovery (T1057) and WMI (Windows Management Instrumentation) execution (T1047). Primary telemetry sources include Windows Process Creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If this activity is malicious, the adversary may be attempting to collect sensitive information about the system state or plan further attacks.

  However, detecting this behavior does NOT confirm a successful compromise or malicious intent on its own, as legitimate system administration and monitoring tools may utilize the same commands.

  ### Investigation Steps

  - **Identify the process execution details**: Review Security Event ID 4688 for `wmic.exe` execution, specifically the `CommandLine` field that includes the 'process' parameter to confirm the context of the command.

  - **Check for recent changes**: Inspect Sysmon Event ID 1 logs for `wmic.exe` to correlate the activity time and any subsequent noteworthy actions, ensuring no critical changes were made around this time.

  - **Assess for known benign usage**: Evaluate whether the `wmic` command was executed by legitimate administrative users. Review command history, user accounts, or application management tasks that might include such commands in legitimate system operations.

  - **Correlate with process details**: Cross-reference the output from the command with the current list of running processes (Security Event ID 4688 or Task Manager on the affected host) to check legitimacy and identify potentially malicious patterns, such as the enumeration of processes that are typically not accessed by normal users.

  - **Monitor for high-confidence indicators**: Look for atypical users or service accounts executing `wmic.exe`, especially if combined with flags often associated with malicious activity (`call create` or `call terminate`). These actions may indicate an attacker is attempting to manipulate process states on the system.

  ### Prioritization

  This alert raises a medium severity in an enterprise context due to the potential for reconnaissance activities that could lead to further exploitation. If critical systems are affected, malicious use of such commands could quickly escalate risk. The technique is commonly utilized by adversaries, making it vital to evaluate the context of the activity.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion if attackers use alternative methods or tools for reconnaissance (such as PowerShell). Reliable detection requires proper configuration of security event logging for process creation. Legitimate administrative tasks, especially during system updates or service maintenance, may trigger similar alerts. A related detection to consider includes monitoring for abnormal WMI calls (T1047), which may indicate deeper malicious use of WMI beyond simple process querying.

