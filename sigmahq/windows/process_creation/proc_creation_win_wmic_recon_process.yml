title: Potential Process Reconnaissance via Wmic.EXE
id: 221b251a-357a-49a9-920a-271802777cc0
status: test
description: |
  Detects the execution of "wmic" with the "process" flag, which might indicate an attempt to perform reconnaissance on running processes.
  Adversaries may use wmic to query for running processes and their details as part of their reconnaissance efforts.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
author: frack113
date: 2022-01-01
modified: 2025-06-10
tags:
- attack.execution
- attack.t1047
- attack.discovery
- attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: 'process'
  filter_main_creation:
    CommandLine|contains|all:
            # Rule id 526be59f-a573-4eea-b5f7-f0973207634d for `wmic process call create #{process_to_execute}`
    - 'call'
    - 'create'
  filter_main_terminate:
    CommandLine|contains|all:
            # Rule id 49d9671b-0a0a-4c09-8280-d215bfd30662 for `wmic path win32_process where processid=#{processid_to_terminate} call terminate`
    - 'call'
    - 'terminate'
  condition: all of selection* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `wmic.exe` with the "process" flag, indicative of reconnaissance activities targeting running processes on a Windows system. Attackers typically utilize this command-line tool to gather information about processes in an environment which aids in further exploitation or evasion. This behavior falls under the MITRE ATT&CK tactic of Discovery, specifically the technique T1047 (Windows Management Instrumentation).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1 logs that capture process creation events. If the behavior is malicious, the security impact could include unauthorized access to sensitive process information, which may lead to further compromise of the environment. This detection does NOT confirm malicious intent outright; it only indicates that an elevated privilege action was performed which may warrant further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Identify instances of `wmic.exe` being executed via Security Event ID 4688 or Sysmon Event ID 1. Look for command lines that include the term "process" to confirm the match to this alert.

  - **Correlate with user and time context:** Analyze the user account associated with the `wmic.exe` execution. Legitimate administrative accounts may execute this command during routine maintenance, while unusual accounts (e.g., service accounts) could indicate potential misuse.

  - **Check for additional suspicious flags:** Look for command line arguments that follow "process" such as "call create" or "call terminate." This may indicate more targeted actions against discovered processes, which are common in advanced adversary techniques.

  - **Identify execution context:** Determine if the command was run in a context that suggests normal administrative behavior (System or Administrator account) versus a user context that may represent an anomalous activity.

  - **Investigate recent changes in system state:** Examine recent changes or anomalies in running processes before and after the execution to uncover any disruptive actions taken post-reconnaissance.

  - **Monitor the presence of malicious indicators:** Check for any running processes that stood out during the reconnaissance, such as known malware signatures or processes that shouldn't be running within the environment context.

  ### Prioritization

  This alert should be treated with medium severity. The affected system's criticality and the use of `wmic.exe` imply a potential reconnaissance stage in an attack lifecycle. While not all uses of WMIC are malicious, adversaries often exploit this tool to gather essential information for further exploitation.

  ### Blind Spots and Assumptions

  Detection may miss `wmic.exe` executions that are obfuscated or altered to evade detection. Without proper logging configurations for process creation events, critical telemetry that aids detection could be absent. Additionally, legitimate administrative tasks, such as system monitoring by IT teams, could trigger this alert. Companion detections like monitoring for unusual process creation patterns (e.g., escalation patterns identified by MITRE ATT&CK T1068) can provide stronger coverage against these behaviors.

