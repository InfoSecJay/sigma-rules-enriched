detection:
  selection_img:
  - Image|endswith: '\WMIC.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: 'process'
  filter_main_creation:
    CommandLine|contains|all:
            # Rule id 526be59f-a573-4eea-b5f7-f0973207634d for `wmic process call create #{process_to_execute}`
    - 'call'
    - 'create'
  condition: all of selection* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  The Sigma rule detects the execution of `wmic.exe` with the `process` flag, which is often leveraged by adversaries to gather information about running processes or installed software on compromised Windows hosts. The likely attacker objective is to perform reconnaissance for further exploitation or lateral movement within the environment. This behavior aligns with MITRE ATT&CK technique T1047 (Windows Management Instrumentation).

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring for events related to the execution of `wmic.exe`. If malicious, this activity could indicate an adversary seeking critical information that may facilitate further actions, such as privilege escalation or lateral movement. However, this detection does NOT confirm that malicious activity is occurring on its own; it merely indicates that a potentially suspicious command was executed.

  ### Investigation Steps

  - **Check recent `wmic.exe` process creation events:** Review Security Event ID 4688 to identify `(New Process Created)` events involving `wmic.exe`. Investigate the user account used and process parent processes for context.

  - **Analyze the command line arguments:** Look for `CommandLine` field details in the process creation logs. A command line containing "process" without additional filtering parameters may indicate a benign user check.

  - **Identify the user account:** Cross-reference the user executing the command against normal user behavior. If it was run by a non-administrative account or from an unexpected location, it may indicate malicious intent.

  - **Review historical activity:** Query Sysmon Event ID 1 logs to determine if `wmic.exe` has been executed previously on the same host, specifically looking for repetitive or automated calls that could indicate malicious behavior.

  - **Monitor for subsequent process creation:** Check for additional processes spawned by `wmic.exe` that would indicate further exploration or exploitation, especially involving toolsets commonly used in attacks.

  - **Log for benign activities:** Document legitimate use cases of `wmic` such as system maintenance tasks conducted by the IT staff. Knowing expected commands and environments can help differentiate normal activity from potential threats.

  ### Prioritization

  The severity of this alert is medium due to the potential for an attacker to gather sensitive information that may lead to a broader compromise. The behavior is indicative of reconnaissance, which is a common precursor to further exploitative actions. While the execution of `wmic.exe` itself is not inherently malicious, its usage in this context merits immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by the execution of legitimate administrative tasks or scripted activities running `wmic`, which can generate false positives. Ensure that Windows Event Forwarding or Sysmon are correctly configured to capture the necessary telemetry for accurate detections. Additionally, consider companion detections such as unusual service creation (Sysmon Event ID 7030) to enhance visibility of potential lateral movement or reconnaissance efforts.

