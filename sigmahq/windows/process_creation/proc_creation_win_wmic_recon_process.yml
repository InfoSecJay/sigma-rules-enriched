note: |
  ---

  ### Technical Context

  This rule detects the execution of `wmic.exe` with the "process" argument, which allows an adversary to enumerate running processes on a host or query system information such as installed patches. The likely attacker objective is reconnaissance, aiming to gather information on the system's state or running applications as a precursor to further exploitation. This behavior aligns with the MITRE ATT&CK technique T1047 - "Windows Management Instrumentation".

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. The security impact of this activity is significant, as it may indicate an intruder's attempt to assess the environment for vulnerabilities or additionally compromised accounts. Importantly, this detection does NOT confirm an adversary's successful breach or ongoing malicious activity without further evidence.

  ---

  ### Investigation Steps

  - **Check Event Logs for Execution:** Review Security Event ID 4688 or Sysmon Event ID 1 for `wmic.exe` execution. Look for the `CommandLine` field to confirm it contains "process". Legitimate executions may include system administrators running maintenance commands.

  - **Analyze Command Line Arguments:** If the `CommandLine` for `wmic.exe` includes "call" and "create", this may indicate a more in-depth attempt at process manipulation. Investigate the specific context of this command for possible malicious intent.

  - **Identify the User Context:** Examine the `SubjectUserName` and `SubjectDomainName` in Event ID 4688 to establish if the command was executed by a legitimate user or a service account. Legitimate administrative actions should show expected user accounts (e.g., domain admins).

  - **Correlate with Other Activities:** Look for related event patterns, such as other suspicious process creations or use of remote administration tools (e.g., RDP, PsExec) in proximity to the detected `wmic` execution. This can strengthen the case for malicious activities.

  - **Check for System Changes Post-Execution:** Investigate any subsequent log entries or changes immediately following the detected `wmic` invocation. Determine if new processes were spawned or unauthorized applications were installed.

  - **Assess Asset Criticality:** If the detection occurs on critical assets (e.g., domain controllers, databases), prioritize analysis due to the higher impact potential of compromised systems.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact on hosts where sensitive data or operations occur, coupled with the likelihood that the behavior can be leveraged for further malicious actions. The usage of `wmic.exe` for reconnaissance is a common tactic employed by adversaries.

  ---

  ### Blind Spots and Assumptions

  Common evasion techniques might include disabling WMI or using obfuscated command-line arguments. The effectiveness of detection is reliant on logging configurations for both local and remote command executions; ensure Windows auditing is properly set. Legitimate maintenance scripts run by system administrators using `wmic` could trigger this alert. Related detections, such as suspicious command line executions or anomalous user behavior, should be monitored to enhance detection coverage.

