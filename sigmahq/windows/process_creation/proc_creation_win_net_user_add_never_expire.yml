note: |
  ### Technical Context
  This detection rule identifies the creation of local user accounts on Windows systems using the `net.exe` command with the `never expire` option. The presence of this command indicates a potential attempt by an attacker to establish persistent access to the compromised system, as accounts configured with a "never expire" option can be used for long-term covert access. Attackers may utilize this behavior as part of their strategy to maintain persistence, allowing them to return to the system even after the initial infection has been detected and remediated.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003)
  - **Create Account** (T1136.001)

  These techniques indicate that an adversary is focused on ensuring their continued access to a target environment by creating accounts that evade standard account management practices.

  The primary data sources for this detection rule are **process creation logs**, specifically focusing on the execution of `net.exe` or `net1.exe`, including details of the command line arguments used during each invocation.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze process creation logs for any instances of `net.exe` or `net1.exe` that include the command line parameters for creating users with the `expires:never` option.
  - **Correlate with User Account Logs:** Check local user account logs to list newly created accounts and confirm if any have the "never expire" attribute set.
  - **Identify Unusual Activity:** Look for accompanying suspicious activities around the time of user creation, such as sudden privilege escalation attempts or unusual logins by the new account.
  - **Confirm System Integrity:** Investigate the source IP or user context that executed the command, and verify if the execution aligns with standard account management practices within the organization.

  ### Prioritization
  Given the potential for sustained access and the malicious use of accounts that are set to never expire, this alert is considered high severity. The impact of such an event can lead to severe data breaches or persistent control over enterprise systems, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to users being created through methods other than `net.exe`, such as PowerShell or third-party tools. The detection logic assumes that local account creation via the specified commands is indicative of malicious intent. Additionally, proper logging configurations for process events and command line arguments must be enabled for this alert to function effectively.

