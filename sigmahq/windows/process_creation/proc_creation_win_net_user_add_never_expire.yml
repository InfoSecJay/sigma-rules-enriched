note: |
  ### Technical Context

  This Sigma rule detects the creation of local user accounts via the `net.exe` command with the "never expire" option. The typical attacker objective is to establish persistent access to a compromised system, as a user account with a never-expiring password can facilitate continued access without prompt for credential renewal. This behavior aligns with the MITRE ATT&CK technique for Persistence: `T1136.001 - Create Account`. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this activity is malicious, it can lead to unauthorized access and control over the system. This detection alone does NOT confirm that the action was malicious, as legitimate administrative tasks might also trigger this rule.

  ### Investigation Steps

  - **Review Process Creation Logs**: Look for Security Event ID 4688 and Sysmon Event ID 1 that indicate process creation involving `net.exe` or `net1.exe`. Check fields for `CommandLine` containing "user add expires:never" to identify direct usage of this command.

  - **Examine Command Line Parameters**: Analyze the `CommandLine` field in the process creation logs for typical benign usage. Legitimate administrators may execute `net user <username> /expires:never` during account setups. If the username follows a pattern typical of service accounts (e.g., "svc_*"), further scrutiny is warranted.

  - **Check User Account Features**: Confirm the presence of newly created accounts in Active Directory or local user management. Ensure the account has been set with the "never expire" attribute. Cross-reference account creation timestamps with the process creation events for correlation.

  - **Monitor for Subsequent Activity**: Investigate if the created account has been used immediately after creation to log in or access sensitive resources. Look for related Event ID 4624 (logon), which may indicate misuse.

  - **Identify Known Malicious Indicators**: Flag any creation attempts that originate from processes with suspicious paths or command line parameters. Look for variations or common naming conventions associated with known malware.

  ### Prioritization

  This alert has high severity due to its potential for system compromise and the likelihood of misuse by adversaries to establish persistence. The impact can escalate if the affected system holds sensitive data or administrative capabilities. Creating accounts with a "never expire" setting is a common technique utilized in various attack scenarios, including ransomware deployment.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers altering the command syntax or using PowerShell equivalents (e.g., `New-LocalUser`) to avoid detection. Reliable detection requires proper logging settings for process creation events, and logs must be retained for sufficient time to investigate historic behaviors. Legitimate administrative actions like account setups for service automation may also trigger this alert. A related detection, such as monitoring for elevated privilege creations or changes (e.g., `T1069.001 - Permission Groups Discovery`), can provide additional context and strengthen detection coverage.

