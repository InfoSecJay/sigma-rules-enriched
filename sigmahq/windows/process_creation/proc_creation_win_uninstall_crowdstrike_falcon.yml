note: |
  ### Technical Context

  This rule detects the uninstallation of the Crowdstrike Falcon sensor via process creation events in Windows. The likely attacker objective is to disable endpoint detection and response (EDR) capabilities to reduce the likelihood of detection during subsequent malicious activities. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and the technique "Indicator Removal on Host" (T1562.001).

  Key telemetry sources include Windows Security Event ID 4688 and Sysmon Event ID 1, which provide visibility into process creation activities and the command line arguments utilized. If malicious, the impact can lead to the compromised system lacking adequate protection, making it vulnerable to further exploitation. This detection does NOT confirm that the uninstallation was malicious since administrators may perform similar actions for legitimate reasons, such as maintenance or troubleshooting.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 with the command line containing "\WindowsSensor.exe /uninstall /quiet". Examine who initiated the uninstall command and from which user account.

  - **Correlate user accounts**: Identify if the user account has administrative privileges. Security Event ID 4672 can indicate special privileges. If a normal user account executed the command, treat it as suspicious.

  - **Identify recent administrative actions**: Look for any legitimate administrative actions taken prior to the uninstallation, such as software updates or maintenance tasks. Check for corresponding timestamps in logs to establish context.

  - **Analyze system configuration changes**: Review the System event log for any related changes indicating that Crowdstrike was uninstalled. Event ID 7036 (Service Status Change) can be relevant for confirming that the Falcon service has been stopped.

  - **Evaluate endpoint behavior post-uninstallation**: Verify any evidence of increased suspicious activity from the endpoint following the uninstallation, such as unexpected outbound connections or execution of unknown processes, in Security Event ID 4648 or network logs.

  ### Prioritization

  This alert is high severity due to the potential impact of leaving a system unmonitored and defenseless. The likelihood of adversarial abuse is significant since disabling EDR solutions is a common step during intrusions. This behavior is often weaponized in targeted attacks against enterprises.

  ### Blind Spots and Assumptions

  Detection may miss instances where the command is executed via a different method or through malicious scripts that evade standard logging. Reliable detection requires that logging for process creation is enabled and appropriately configured on all endpoints. Legitimate administrative activity, such as troubleshooting or reconfiguring security settings, may trigger this alert. A companion detection to consider is the monitoring of failed attempts to reinstall the Falcon sensor, which might indicate that an adversary is attempting to cover their tracks.

