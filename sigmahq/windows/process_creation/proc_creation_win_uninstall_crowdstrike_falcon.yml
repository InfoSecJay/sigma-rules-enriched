note: |
  ### Technical Context
  This detection rule identifies attempts to uninstall the CrowdStrike Falcon sensor from Windows systems. Adversaries may seek to disable or remove security tools like CrowdStrike Falcon to avoid detection of their malicious activities and to create opportunities for further exploitation. This behavior can indicate a potential compromise, as legitimate users and system administrators will rarely need to uninstall a security solution in this manner without specific justification or oversight.

  The relevant MITRE ATT&CK tactic for this detection is **Defense Evasion**, particularly the technique **T1562.001 - Disable or Modify Security Tools**. This technique describes methods adversaries use to disrupt the functionality of security software, making it easier for them to execute their operations undetected.

  The primary data source for this detection is **process creation logs** from Windows systems, which capture command-line arguments executed on the system, allowing security teams to identify unauthorized attempts to uninstall critical security agents.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation events in your SIEM for instances of `WindowsSensor.exe` with the `/uninstall` and `/quiet` command-line arguments. This will help identify potential unauthorized uninstallation attempts.

  - **Correlate with User Activity**: Investigate the user accounts associated with the uninstallation command to determine if they were authorized and if there are any previous suspicious activities related to those accounts.

  - **Examine System Integrity**: Check the current state of the CrowdStrike Falcon sensors on affected systems to confirm whether the uninstallation was successful and if other security tools exhibit signs of tampering or disabling.

  - **Investigate Associated Alerts**: Look for other security alerts or anomalies that coincide with the uninstallation attempts, such as failed login attempts or other process anomalies, which may indicate a broader compromise.

  ### Prioritization
  This alert is classified as high severity due to the significant risk posed by the potential removal of endpoint protection, which could enable attackers to carry out further malicious activities undetected. The likelihood of this scenario should lead to immediate investigation and remediation efforts.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate system administrators performing similar uninstall commands for legitimate purposes, such as troubleshooting or system maintenance. Assumptions made by the detection logic include that any invocation of the uninstallation command line is unauthorized unless properly documented and justified. Additionally, the rule relies on adequate logging of process creation events being enabled and correctly configured on all endpoints in the enterprise environment to function effectively.

