  ### Technical Context

  This Sigma rule detects the uninstallation of the CrowdStrike Falcon sensor on Windows systems. The likely attacker objective behind this behavior is to disable endpoint detection and response capabilities, thereby evading security monitoring and potentially manipulating the environment undetected. The relevant MITRE ATT&CK tactic here is "Defense Evasion" (TA0005), specifically the technique "Indicator Removal on Host" (T1562.001).

  The primary telemetry sources are Windows process creation logs that monitor command execution. Specifically, the expected log types include Security Event ID 4688 and Sysmon Event ID 1 for process creation events. If this uninstallation is executed maliciously, it significantly impacts the organization's security posture by removing a crucial layer of protection. This detection does NOT confirm the intent behind the action—where an administrator could perform a similar command for operational reasons.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for command line arguments containing '\WindowsSensor.exe /uninstall /quiet'. Look for execution from non-administrator accounts as a high-confidence malicious indicator.

  - **Identify affected systems:** Use asset inventory to determine the role and criticality of the system where the uninstallation occurred. For example, if the uninstallation happened on a critical server, prioritize the investigation.

  - **Validate legitimate usage:** Confirm if there have been scheduled maintenance windows or documented administrative communications for software updates involving the CrowdStrike sensor. Documenting legitimate contexts could further clarify the situation.

  - **Examine user accounts:** Investigate the account that executed the command. Determine whether it was an administrative account and review recent user behavior for suspicious activity, such as failed login attempts or connections outside normal hours.

  - **Look for related artifacts:** Check for file deletions or modifications around the same timestamp in the directory where CrowdStrike Falcon was installed. This could include logs that indicate whether the uninstall process removed related files or configurations.

  - **Cross-reference with EDR alerts:** Review any alerts generated by other security tools during the same timeframe as the uninstallation to identify potential pre- or post-attack activities. This can identify if the action was part of a broader compromise.

  ### Prioritization

  This alert holds a high severity in an enterprise context due to the significant security impact of removing endpoint detection capabilities. The likelihood of malicious abuse is considerable, as disabling security tools is a common technique used by adversaries to facilitate further intrusions or lateral movements. The potential weaponization of this behavior underscores the need for urgent investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded if adversaries use system-level privileges or obfuscate their activity with similar legitimate administrative tasks. It requires the appropriate logging configurations in place, specifically enabling detailed process creation logging in Windows. Administrators performing legitimate uninstalls for maintenance or troubleshooting could trigger this alert; hence, context matters significantly. A related detection worth considering is any command for stopping or disabling the CrowdStrike service (e.g., querying for 'sc stop Crowdstrike' in process logs), which complements coverage for defense evasion techniques.

