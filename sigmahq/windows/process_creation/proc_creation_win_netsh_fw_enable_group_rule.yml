note: |
  ### Technical Context
  This detection rule identifies potential adversary attempts to modify system firewall settings on Windows systems using the `netsh` command, specifically allowing certain group policies on the Microsoft Defender Firewall. Attackers may exploit this behavior to evade network controls, thereby facilitating unauthorized access or lateral movement within the network. By altering firewall rules, they can enable communication for services like SMB (Server Message Block) or RDP (Remote Desktop Protocol) that would otherwise be restricted, effectively bypassing security measures.

  The relevant MITRE ATT&CK tactics associated with this detection are "Defense Evasion" (TA0005) and the technique "Disable or Modify Tools" (T1562.004). Attackers leveraging these tactics often aim to remain undetected while executing their attack objectives, including data exfiltration or establishing persistent access points in compromised networks.

  The primary data sources for this detection are process creation logs, specifically focused on the execution of the `netsh.exe` command, which can provide insights into administrative commands run on endpoints, including any modifications made to the firewall configurations.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze process creation events to identify instances where `netsh.exe` has been executed, noting the user context and timestamps of these events.
  - **Inspect Command Line Parameters:** Analyze the command line arguments of the `netsh` process executions that include keywords such as 'advfirewall', 'set', 'rule', and 'enable=Yes' to verify if they correlate with known malicious patterns.
  - **Cross-Reference with Firewall Logs:** Review firewall logs to check for recently modified rules, looking for suspicious activities that align with the modified policies detected through `netsh`.
  - **Investigate User Activity:** Evaluate the user accounts associated with these operations to determine if they have legitimate administrative privileges or if they’re linked to suspicious user behavior.

  ### Prioritization
  The medium severity of this alert is due to the significant potential for impact if an adversary successfully modifies firewall rules to allow malicious traffic, especially in environments where strict network segmentation is critical. The likelihood of legitimate administrative activity does exist, but abnormal usage patterns warrant immediate investigation.

  ### Blind Spots and Assumptions
  This detection may miss instances of legitimate administrative activities if those users are authorized to make firewall changes. The rule assumes that any usage of `netsh` for enabling firewall rules is potentially malicious unless otherwise validated. Reliable logging of process creation events and detailed command line outputs is critical for effective detection, necessitating proper configurations of endpoint logging on Windows systems to ensure comprehensive coverage.

