note: |
  ### Technical Context

  This Sigma rule detects the execution of `netsh.exe` with commands that modify Microsoft Defender Firewall settings, particularly enabling rules that may allow traffic for SMB and RDP. The likely attacker objective is to bypass firewall controls to facilitate lateral movement or unauthorized network access. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.004).

  The primary telemetry source is process creation logs that capture the execution of `netsh.exe`, including specific command-line arguments that indicate a potential firewall rule modification. If malicious, the security impact could be significant, potentially allowing adversaries to expose sensitive services to broader access. This detection does NOT confirm a successful exploit or compromise on its own.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 for instances of `netsh.exe` being executed. Focus on the command line for the presence of `advfirewall`, `set`, `rule`, `group=`, and `enable=Yes`.

  - **Identify known good configurations:** Check for legitimate administrative activity by confirming recent scheduled maintenance or updates that could involve changes to firewall settings, specifically related to SMB or RDP.

  - **Correlate user activity:** Investigate the user account associated with the `netsh.exe` execution. Legitimate users should exhibit roles of network administrators or should have logged in during authorized maintenance times.

  - **Examine firewall state changes:** Utilize Windows Event Logs (Event ID 8005 for Firewall changes) to assess if the firewall rules have indeed been modified. Look for changes corresponding to the execution time of the detected `netsh.exe` command.

  - **Check for related network connections:** Use network monitoring tools to identify connections to potentially compromised hosts or any unusual inbound/outbound traffic patterns that coincide with the detected modification of firewall rules.

  ### Prioritization

  This alert has a medium severity level due to the potential impact of modifying firewall settings on critical systems. While the direct action of `netsh.exe` may often be legitimate, its misuse to alter firewall rules can facilitate a malicious adversary's maneuvering, making it a behavior of concern.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administration activities that could trigger similar alerts, such as standard firewall rule updates during maintenance. Successful detection requires that both Sysmon and Security Event logs are properly configured on the host. Additionally, related detections that monitor for unusual outbound traffic (e.g., DLP logs) could enhance overall coverage against this modality.

