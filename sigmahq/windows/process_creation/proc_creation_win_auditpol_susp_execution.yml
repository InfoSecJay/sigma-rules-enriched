level: high
note: |
  ### Technical Context

  This rule detects the use of the `auditpol` tool to modify Windows audit policies, which can be indicative of malicious intent to impair monitoring capabilities. Attackers often seek to disable crucial logging features to evade detection during lateral movement or execution of malicious activities. Relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)** and specifically **Disable or Modify Tools (T1562.002)**.

  The primary telemetry source is Windows process creation logs, typically containing Event ID **4688** for process creation or Sysmon Event ID **1** for detailed execution data. If the detected behavior is malicious, it can significantly hinder an organization’s ability to monitor and respond to security incidents. Importantly, this detection alone does not confirm that the system has been compromised; it merely indicates the potential for harmful activity in modifying audit policies.

  ### Investigation Steps

  - **Verify process creation events**: Check for Windows Security Event ID **4688** or Sysmon Event ID **1** showing process creation for `auditpol.exe`. Identify the user account associated with the event and ensure it’s not a known administrative action.

  - **Investigate command-line arguments**: Examine the command line used with the process under Event ID **4688** or Sysmon Event ID **1**. Look for any usage of keywords such as "disable," "clear," "remove," or "restore" that indicates an intention to modify audit policies.

  - **Identify legitimate administrative actions**: Determine if the audit policy changes align with documented maintenance or security configurations performed by authorized administrators, such as scheduled scripts or routine security adjustments.

  - **Correlate with user activity**: Cross-reference the timestamp of the `auditpol` execution with other user activities or admin logs. Investigate if there are patterns related to unauthorized access or other signs of compromised credentials.

  - **Monitor system integrity post-detection**: After detecting unauthorized changes, look for related artifacts indicating policy restoration, such as logs showing sudden increases in event logging (indicating default policies being reinstated) or unusual behavior from the affected system.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on the integrity of logging mechanisms within the system. The likelihood of malicious abuse is high, as such actions are often employed by threat actors to hinder detection processes during attacks. Modifying audit policies is a well-known method to facilitate prolonged access and evasion by adversaries.

  ### Blind Spots and Assumptions

  Limitations in detection can occur due to administrative users legitimately invoking the `auditpol` tool, which may trigger false positives. Ensuring comprehensive logging configurations is crucial for reliable detection, specifically that Sysmon or detailed event auditing is enabled. Legitimate maintenance scripts or configuration changes by administrators may inadvertently trigger this alert. Related detections include monitoring changes to other critical security configurations or changes in Group Policy settings as a companion measure for enhancing security oversight.

