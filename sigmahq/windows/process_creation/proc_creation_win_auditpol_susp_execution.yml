logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\auditpol.exe'
  - OriginalFileName: 'AUDITPOL.EXE'
  selection_cli:
    CommandLine|contains:
    - 'disable'         # disables a specific audit policy
    - 'clear'           # delete or clears audit policy
    - 'remove'          # removes an audit policy
    - 'restore'         # restores an audit policy
  condition: all of selection_*
falsepositives:
- Administrator or administrator scripts might leverage the flags mentioned in 
  the detection section. Either way, it should always be monitored
level: high
note: |
  ### Technical Context

  This rule detects the use of the `auditpol` command-line utility to modify Windows audit policies, which can weaken security monitoring by disabling or restoring specific audit configurations. The likely attacker objective is to cover their tracks and reduce the visibility of their malicious activities. This behavior corresponds with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Impact on Audit Policies (T1685.001). The primary telemetry sources for this detection are the Windows process creation logs, specifically focusing on Event ID 4688 for process execution with the `auditpol` binary. If successful, this could lead to undetected malicious activity within the environment. Importantly, this detection alone does not confirm malicious intent; legitimate administrators may execute similar commands for maintenance or configuration purposes.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 with the `auditpol.exe` as the New Process Name. Look for unexpected command line arguments indicative of policy changes.

  - **Analyze command line arguments:** Identify variations in the CommandLine field that include keywords such as 'disable', 'clear', 'remove', or 'restore'. Legitimate use typically involves benign modifications without these commands.

  - **Correlate with user activity:** Verify the user account executing the command. If it aligns with known administrative activities and scheduled maintenance, it may be benign. Investigate if the account has unusual access patterns leading up to the execution.

  - **Identify the context of command usage:** Search for related logs around the event time, such as Windows Security logs and System logs (Event ID 1102 indicates audit log clear actions).

  - **Examine other security logs:** Look for any active alerts related to modified audit trails or events (like Event ID 4662), indicating changes to security settings that complement the `auditpol` usage.

  ### Prioritization

  This alert is of high severity due to its potential impact on the ability to detect later malicious activities. The likelihood of abuse by attackers is notable, particularly as this technique is often weaponized by advanced persistent threats (APTs) aiming to maintain persistence while evading detection.

  ### Blind Spots and Assumptions

  Detection limitations include the fact that legitimate activities, particularly by administrators, can trigger this alert, leading to potential false positives. Sufficient log configuration must be in place to reliably detect command executions, particularly from the Sysmon or Security Event Logs. This detection is strengthened by companion detections for other command and control behaviors or interactions with suspicious process activity, such as the related detection for old auditpol usage (ID: c6c56ada-612b-42d1-9a29-adad3c5c2c1e).

