logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\auditpol.exe'
  - OriginalFileName: 'AUDITPOL.EXE'
  selection_cli:
    CommandLine|contains:
    - 'disable'         # disables a specific audit policy
    - 'clear'           # delete or clears audit policy
    - 'remove'          # removes an audit policy
    - 'restore'         # restores an audit policy
  condition: all of selection_*
falsepositives:
- Administrator or administrator scripts might leverage the flags mentioned in the
  detection section. Either way, it should always be monitored
level: high
note: |
  ### Technical Context
  This rule detects potentially malicious alterations to system audit policies executed through the `auditpol` utility. Threat actors may utilize this tool to manipulate the Windows audit configuration, effectively silencing or obscuring their presence and activities. By disabling key audit logs or restoring fraudulent audit policies, attackers can impede detection mechanisms and create a blind spot for security teams. This behavior is particularly concerning, as it may point towards an ongoing or prior compromise aimed at evading detection.

  The primary MITRE ATT&CK tactics relevant to this detection include **Defense Evasion (T1562)**, and more specifically **T1562.002: Disable or Modify System Firewall**. Adversaries seeking to cover their tracks often exploit such legitimate tools, leveraging their capabilities to erase or alter log entries that would otherwise provide forensic evidence of their actions.

  The best evidence for this detection can be found in **process creation events** logged by the Windows operating system. These logs capture details about executed commands, including any alterations made via `auditpol`, making them essential for identifying such tampering attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `auditpol.exe`. Pay attention to timeframes associated with suspicious behavior or incidents, focusing on command line arguments that include keywords such as `disable`, `clear`, `remove`, and `restore`.
  - **Examine Audit Policy Changes**: Validate any recent changes to audit policies through System Event logs. This can provide context for any tampering and highlight whether legitimate administrative actions are behind the changes.
  - **Correlate with User Activity**: Investigate the user accounts involved in executing `auditpol`. Determine if the behavior originated from legitimate administrator accounts or involves suspicious activity from non-privileged users.
  - **Monitor for Follow-up Behavior**: Look for other indicators of compromise that may accompany audit policy changes, such as unusual login patterns or changes in user privileges, as these may suggest a broader attack vector.

  ### Prioritization
  Given the high impact of audit policy tampering on an organization's ability to detect intrusions, this alert should be treated as high severity. The likelihood of threat actors employing this technique makes it imperative for security teams to respond appropriately.

  ### Blind Spots and Assumptions
  This detection logic is predicated on the assumption that the `auditpol` utility is not frequently utilized by authorized personnel for legitimate purposes. If administrators are using `auditpol` regularly, it could lead to frequent false positives. Additionally, the detection relies on complete logging of process creation events; if these logs are disabled or improperly configured, the accurate detection of tampering will be compromised. There may also be gaps in visibility regarding how audit policies are accessed and modified through non-standard methods outside of `auditpol`.

