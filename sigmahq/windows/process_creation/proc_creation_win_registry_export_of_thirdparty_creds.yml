note: |
  ### Technical Context
  This detection rule identifies the use of the `reg.exe` utility to export registry paths that are commonly associated with third-party credentials. Attackers often leverage credential stealers, which are malicious programs designed to harvest sensitive information, such as login credentials, stored in the Windows registry. By exporting this data, attackers may aim to gain unauthorized access to user accounts or sensitive systems within the enterprise.

  The relevant MITRE ATT&CK tactics for this detection include **Credential Access** (TA-0006), specifically under the technique for credential dump from operating systems, denoted as **Credential Dumping via Registry (T1552.002)**. The attacker’s objective is typically to collect credentials covertly, allowing them further persistence and control over compromised systems.

  Primary data sources for this detection include **process creation events**, which log when `reg.exe` is executed, and **command-line parameter logs**, which provide insights into the specific commands used and the paths being targeted for export. These logs are vital in determining whether potentially malicious exporting of sensitive data has occurred.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `reg.exe` being executed, noting any unusual execution times or originating accounts that do not typically use this tool.
  - **Analyze Command-Line Parameters**: Look closely at the command line arguments associated with the `reg.exe` executions. Specific flags like `save` or `export`, along with suspicious registry paths, can indicate malicious activity.
  - **Cross-reference with Known Applications**: Check against a list of common third-party applications known to store credentials in the registry and establish whether the detected activity correlates with those applications.
  - **Investigate User Activity**: Review the user account that triggered the reg.exe export. Determine if their behavior aligns with normal patterns or if there are any indicators of compromise associated with that account.

  ### Prioritization
  This alert is deemed high severity due to the potential impact on the enterprise's security posture. Unauthorized access to credentials could lead to further attacks and compromise of additional systems, making swift investigation and remediation paramount.

  ### Blind Spots and Assumptions
  Detection may be limited if the `reg.exe` binary has been renamed or if attackers utilize other methods or tools to extract registry data (e.g., PowerShell). The detection logic assumes that logging is enabled for process creation and command-line arguments. Therefore, any misconfigurations leading to absence of these logs could hinder the rule's effectiveness, making timely investigation and remediation more challenging.

