title: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
status: test
description: |
  Detects suspicious reconnaissance command line activity on Windows systems using Net.EXE
  Check if the user that executed the commands is suspicious (e.g. service accounts, LOCAL_SYSTEM)
references:
- https://redcanary.com/blog/how-one-hospital-thwarted-a-ryuk-ransomware-outbreak/
- https://thedfirreport.com/2020/10/18/ryuk-in-5-hours/
- https://research.nccgroup.com/2022/08/19/back-in-black-unlocking-a-lockbit-3-0-ransomware-attack/
author: Florian Roth (Nextron Systems), omkar72, @svch0st, Nasreddine Bencherchali
  (Nextron Systems)
date: 2019-01-16
modified: 2023-03-02
tags:
- attack.discovery
- attack.t1087.001
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
    # Covers group and localgroup flags
  selection_group_root:
    CommandLine|contains:
    - ' group '
    - ' localgroup '
  selection_group_flags:
    CommandLine|contains:
            # Add more groups for other languages
    - 'domain admins'
    - ' administrator'         # Typo without an 'S' so we catch both
    - ' administrateur'         # Typo without an 'S' so we catch both
    - 'enterprise admins'
    - 'Exchange Trusted Subsystem'
    - 'Remote Desktop Users'
    - 'Utilisateurs du Bureau à distance'         # French for "Remote Desktop Users"
    - 'Usuarios de escritorio remoto'         # Spanish for "Remote Desktop Users"
    - ' /do'         # short for domain
  filter_group_add:
        # This filter is added to avoid the potential case where the point is not recon but addition
    CommandLine|contains: ' /add'
    # Covers 'accounts' flag
  selection_accounts_root:
    CommandLine|contains: ' accounts '
  selection_accounts_flags:
    CommandLine|contains: ' /do'     # short for domain
  condition: selection_img and ((all of selection_group_* and not filter_group_add)
    or all of selection_accounts_*)
falsepositives:
- Inventory tool runs
- Administrative activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious reconnaissance activities executed through the `Net.EXE` command-line utility on Windows systems. The primary purpose of the `Net` command is to manage network resources such as shared files and printers, manage user accounts, and manage groups on a Windows operating system. Attackers often leverage `Net.EXE` to enumerate groups and accounts as part of their pre-attack reconnaissance efforts, aiming to gain visibility into user permissions and access controls. This information can potentially lead to unauthorized privilege escalation and lateral movement within the network.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) with techniques for **Account Discovery** (T1087) and **Group Discovery** (T1087.001). The insights gained from these commands can aid attackers in crafting targeted attacks against high-value resources or services, hence understanding the sensitivity of the detected behavior is critical for incident response teams. The rule focuses specifically on the command-line activity generated by `Net.EXE` that indicates attempts to enumerate user accounts and security groups, which could reveal excessive privileges or misconfigurations.

  Key data sources for this detection include process creation logs, which capture command-line arguments and the originating user context. These logs provide the necessary detail to identify potential misuse of the `Net.EXE` utility within an enterprise network.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze process creation logs to pinpoint any instances of `Net.EXE` or `Net1.EXE` being executed, paying particular attention to the command-line arguments used.
  - **Identify User Context:** Determine the user identity that executed the `Net.EXE` commands. Look for suspicious accounts such as service accounts or system-level accounts (e.g., LOCAL_SYSTEM) that are atypical for executing reconnaissance commands.
  - **Examine Command-Line Arguments:** Specifically check for command-line usages involving 'group', 'localgroup', 'accounts', or any other relevant flags that may indicate enumeration. Cross-reference these with known user groups and roles to ascertain risk levels.
  - **Correlate with Other Security Logs:** Integrate findings with other logs such as authentication logs, Active Directory event logs, or alerts from EDR solutions to identify any related anomalous behavior or signs of compromise.

  ### Prioritization
  Due to the potential for attackers to gain critical permissions through reconnaissance activities, alerts generated by this rule should be prioritized as medium to high severity. Detection of reconnaissance is essential, as it often precedes more damaging actions, such as privilege escalation or lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection rule may not catch all instances of reconnaissance activities, especially if attackers use alternative tools or command-line options that are not captured in the defined parameters. The detection logic assumes that relevant logs are enabled and available; if process creation logging is not configured properly, this rule may fail to trigger on malicious actions. Additionally, false positives may arise from legitimate administrative activity or inventory tool usage that employs `Net.EXE`. Consequently, maintaining an updated inventory of all administrative and authorized tools is necessary for effective threat detection.

