title: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
status: test
description: |
  Detects suspicious reconnaissance command line activity on Windows systems using Net.EXE
  Check if the user that executed the commands is suspicious (e.g. service accounts, LOCAL_SYSTEM)
references:
- https://redcanary.com/blog/how-one-hospital-thwarted-a-ryuk-ransomware-outbreak/
- https://thedfirreport.com/2020/10/18/ryuk-in-5-hours/
- https://research.nccgroup.com/2022/08/19/back-in-black-unlocking-a-lockbit-3-0-ransomware-attack/
author: Florian Roth (Nextron Systems), omkar72, @svch0st, Nasreddine 
  Bencherchali (Nextron Systems)
date: 2019-01-16
modified: 2023-03-02
tags:
- attack.discovery
- attack.t1087.001
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
    # Covers group and localgroup flags
  selection_group_root:
    CommandLine|contains:
    - ' group '
    - ' localgroup '
  selection_group_flags:
    CommandLine|contains:
            # Add more groups for other languages
    - 'domain admins'
    - ' administrator'         # Typo without an 'S' so we catch both
    - ' administrateur'         # Typo without an 'S' so we catch both
    - 'enterprise admins'
    - 'Exchange Trusted Subsystem'
    - 'Remote Desktop Users'
    - 'Utilisateurs du Bureau à distance'         # French for "Remote Desktop Users"
    - 'Usuarios de escritorio remoto'         # Spanish for "Remote Desktop Users"
    - ' /do'         # short for domain
  filter_group_add:
        # This filter is added to avoid the potential case where the point is not recon but addition
    CommandLine|contains: ' /add'
    # Covers 'accounts' flag
  selection_accounts_root:
    CommandLine|contains: ' accounts '
  selection_accounts_flags:
    CommandLine|contains: ' /do'     # short for domain
  condition: selection_img and ((all of selection_group_* and not 
    filter_group_add) or all of selection_accounts_*)
falsepositives:
- Inventory tool runs
- Administrative activity
level: medium
note: |
  ### Technical Context

  This rule detects suspicious reconnaissance activity on Windows systems using the Net.EXE tool, focusing on command line options that involve user groups and accounts. The likely attacker objective is to gather intelligence about users and groups, which could facilitate privilege escalation or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Discovery, specifically techniques T1087.001 (Account Discovery) and T1087.002 (Group Discovery).

  The primary telemetry sources are Windows process creation logs, especially Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity may reveal an adversary's attempts to enumerate privileged groups or accounts, enabling further compromising actions. However, this detection does NOT confirm unauthorized access or malicious intent solely on its own.

  ### Investigation Steps

  - **Review command line arguments:** Check the CommandLine field for keywords like "group" or "accounts" in Event ID 4688 logs. Legitimate administrative tasks often do not include such specific reconnaissance commands targeting privileged groups.

  - **Identify the user context:** Analyze the user associated with the Net.EXE execution. Focus on unusual accounts, especially service accounts or LOCAL_SYSTEM performing this operation, which indicates potential malicious activity.

  - **Validate timing and frequency:** Look for patterns in the execution time of the Net.EXE commands. Legitimate administrative activities typically occur during standard work hours and are infrequent. Repeated or odd-hour executions can highlight malicious intent.

  - **Correlate with other logs:** Examine related logs (e.g., Security Event Log, Sysmon logs) for follow-up commands or suspicious activities immediately after the Net.EXE usage. Look for additional attempts to modify group memberships or access sensitive resources.

  - **Cross-reference with known benign activities:** Check inventory tool logs or administrative change logs to identify if similar commands were run by authorized personnel on a recent basis. A lack of documentation for the activity may signify potential malicious intent.

  - **Identify malicious group memberships:** Focus on any attempts to enumerate critical groups such as "Domain Admins" or "Enterprise Admins” in the CommandLine. These are high-confidence indicators of reconnaissance that could precede a targeted attack.

  ### Prioritization

  The alert severity is medium, as it pertains to potential reconnaissance activity that could lead to significant security breaches. Compromised systems or user accounts often lead to increased likelihood of malicious exploitation, especially if the activities are associated with elevated permissions or sensitive assets.

  ### Blind Spots and Assumptions

  This detection may miss cases where adversaries employ evasion techniques, such as renaming executable files or using alternative tools for enumeration. Reliable detection requires comprehensive logging of process creation events and proper configuration of Sysmon for detailed command line visibility. Legitimate network administration tools and scripts could inadvertently trigger this alert, making context critical. Companion detections, such as those for suspicious PowerShell usage (T1059.001), can enhance coverage by identifying correlated behaviors associated with reconnaissance.

