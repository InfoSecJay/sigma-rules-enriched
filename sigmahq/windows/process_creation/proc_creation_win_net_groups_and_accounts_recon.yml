title: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
status: test
description: |
  Detects suspicious reconnaissance command line activity on Windows systems using Net.EXE
  Check if the user that executed the commands is suspicious (e.g. service accounts, LOCAL_SYSTEM)
references:
- https://redcanary.com/blog/how-one-hospital-thwarted-a-ryuk-ransomware-outbreak/
- https://thedfirreport.com/2020/10/18/ryuk-in-5-hours/
- https://research.nccgroup.com/2022/08/19/back-in-black-unlocking-a-lockbit-3-0-ransomware-attack/
author: Florian Roth (Nextron Systems), omkar72, @svch0st, Nasreddine 
  Bencherchali (Nextron Systems)
date: 2019-01-16
modified: 2023-03-02
tags:
- attack.discovery
- attack.t1087.001
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
    # Covers group and localgroup flags
  selection_group_root:
    CommandLine|contains:
    - ' group '
    - ' localgroup '
  selection_group_flags:
    CommandLine|contains:
            # Add more groups for other languages
    - 'domain admins'
    - ' administrator'         # Typo without an 'S' so we catch both
    - ' administrateur'         # Typo without an 'S' so we catch both
    - 'enterprise admins'
    - 'Exchange Trusted Subsystem'
    - 'Remote Desktop Users'
    - 'Utilisateurs du Bureau à distance'         # French for "Remote Desktop Users"
    - 'Usuarios de escritorio remoto'         # Spanish for "Remote Desktop Users"
    - ' /do'         # short for domain
  filter_group_add:
        # This filter is added to avoid the potential case where the point is not recon but addition
    CommandLine|contains: ' /add'
    # Covers 'accounts' flag
  selection_accounts_root:
    CommandLine|contains: ' accounts '
  selection_accounts_flags:
    CommandLine|contains: ' /do'     # short for domain
  condition: selection_img and ((all of selection_group_* and not 
    filter_group_add) or all of selection_accounts_*)
falsepositives:
- Inventory tool runs
- Administrative activity
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_net_groups_and_accounts_recon/info.yml
note: |
  ### Technical Context

  This Sigma rule detects suspicious account and group reconnaissance activity by identifying the invocation of `net.exe` or `net1.exe` with specific command-line parameters. The primary attacker objective is to gather information on user accounts and groups within a network, potentially for the purposes of lateral movement or privilege escalation. This behavior relates to the MITRE ATT&CK tactics of Discovery (TA0007), specifically techniques T1087.001 (Account Discovery) and T1087.002 (Group Discovery).

  The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments used during process execution. The security impact can be significant, potentially allowing an adversary to enumerate accounts and groups and identify targets for further exploitation. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative tasks or inventory tools could cause similar command execution.

  ### Investigation Steps

  - **Check the command line arguments:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `net.exe` or `net1.exe` and scrutinize the `CommandLine` field for suspicious terms such as 'group', 'localgroup', or notable group names (e.g., 'domain admins', 'enterprise admins'). If legitimate admin functions are evident, prioritize those logs.

  - **Identify the executing user:** Assess the `SubjectUserName` field from the respective event logs to determine if the user is a common service account or has an administrative role. Execution by service accounts like `LOCAL_SYSTEM` or service accounts with high privileges may indicate a higher likelihood of malicious intent.

  - **Correlate with other telemetry sources:** Use Windows Event Logs (e.g., Event ID 4742 for group creation/modification) or Active Directory logs to look for unusual patterns related to account/group changes around the same time as the net.exe command execution. Multiple events may indicate reconnaissance leading to further activity.

  - **Review environmental context:** Gather information on the asset's role in your environment. If the host is a sensitive server (like a domain controller), prioritize the review of net.exe executions over non-critical systems.

  - **Identify benign activity:** Review any recent administrative tasks that could explain legitimate executions of `net.exe`, such as routine system checks or maintenance tasks logged by authorized users within a defined operational time frame.

  - **Look for high-confidence indicators:** Confirm if there are events showing command line components containing ` /add` as they may indicate malicious creation of groups or accounts, which wouldn't normally be involved in reconnaissance activities and may suggest exploitation.

  ### Prioritization

  This alert is classified as medium severity due to its potential impact; reconnaissance on accounts or groups is a common precursor to more significant attacks. The likelihood of malicious abuse is moderate, as while this behavior can stem from legitimate administrative tasks, it is often utilized by adversaries to facilitate further attacks. Reconnaissance actions are frequently weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations, as some reconnaissance attempts could evade detection by altering command parameters or using different executable methods. Legitimate administrative activities, such as software deployment or inventory management, may trigger this alert. Companion detections, such as monitoring for lateral movement techniques (e.g., T1075 - Pass the Hash), can enhance overall visibility into potential threats associated with group and account enumeration.

