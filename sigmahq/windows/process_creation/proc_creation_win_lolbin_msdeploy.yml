detection:
  selection:
    CommandLine|contains|all:
    - 'verb:sync'
    - '-source:RunCommand'
    - '-dest:runCommand'
    Image|endswith: '\msdeploy.exe'
  condition: selection
falsepositives:
- System administrator Usage
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of `msdeploy.exe` with specific parameters that indicate potential misuse for executing commands remotely on a Windows system. An attacker may leverage this tool to execute arbitrary commands under the pretense of legitimate administrative actions, potentially gaining control over the victim system or moving laterally. The relevant MITRE ATT&CK tactics and techniques are **Execution (TA0002)** and **Command and Scripting Interpreter (T1059)**.

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1) which capture process execution details such as command-line arguments and process paths. If an alert is confirmed to be malicious, the security impact could include unauthorized system access and execution of harmful commands. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger the same conditions.

  ### Investigation Steps

  - **Review process creation logs**: Investigate Security Event ID 4688 and Sysmon Event ID 1 for instances of `msdeploy.exe` execution, focusing on the CommandLine field for the presence of `verb:sync` and `-source:RunCommand`. Look for irregularities in the execution time and user context.

  - **Analyze the executing user**: Determine if the user executing the command has administrative privileges. Compare the user to internal roles; legitimate use by system administrators is more acceptable, whereas usage by non-admin accounts could indicate malicious activity.

  - **Check for lateral movement patterns**: Look for subsequent network connections or process creations initiated by `msdeploy.exe` that may indicate lateral movement or post-exploitation activity. These may be evident in logs from Windows Firewall or network monitoring tools.

  - **Identify normal usage patterns**: Document and review legitimate usage patterns of `msdeploy.exe` within your environment. Ensure that usage conforms to documented practices by your system administrators and identify any anomalies.

  - **Inspect command output or logs**: If available, retrieve and review output logs generated by `msdeploy.exe` during command execution. Analyze for anomalous commands that deviate from typical administrative tasks.

  - **Look for file alterations**: Check for file creation or manipulation logs in common targets (e.g., system binaries or configuration files) around the same timestamp as the `msdeploy.exe` execution, which may suggest an attempt to modify or exfiltrate data.

  ### Prioritization

  This alert warrants medium severity due to the sensitive nature of the system processes involved. The likelihood of malicious abuse is notable as tools like `msdeploy.exe` are frequently weaponized for remote command execution, especially if used by unauthorized users or in unexpected contexts.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using process hollowing techniques or by masquerading their activity as legitimate administrative use. It is crucial to maintain sufficient logging configurations for full visibility, including enabling detailed process creation logging. Legitimate system administrator usage of `msdeploy.exe` can trigger the alert, necessitating thorough investigation. A companion detection rule focused on suspicious network activities resulting from remote command execution would enhance overall coverage against such threats.

