note: |
  ### Technical Context
  This detection rule identifies techniques used in PowerShell to obscure command execution, specifically through the use of token obfuscation as demonstrated by the Invoke-Obfuscation framework. Attackers often utilize such obfuscation methods to evade security controls and perform malicious actions on a compromised system. The rule targets command line executions that exhibit unusual patterns, which are commonly associated with PowerShell scripts designed to hide their intent.

  The primary threat scenarios include the deployment of payloads by threat actors seeking to exfiltrate data, execute lateral movement, or establish persistence. By using obfuscated commands, attackers aim to bypass endpoint detection and response (EDR) solutions and remain undetected while executing potentially harmful scripts. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion, particularly T1027.009, which refers to "Obfuscated Files or Information" and encompasses various obfuscation strategies.

  Primary data sources for this detection rule include process creation events from Windows systems, specifically focusing on the command line arguments used during the execution of PowerShell scripts. Analyzing these logs provides critical insights into potentially malicious behavior that may indicate a compromise.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze Windows process creation logs. Focus on entries involving PowerShell executions where the command line contains obfuscated patterns.

  - **Check for Unusual PowerShell Patterns:** Look for instances of command line syntax that include backticks (`) or other non-standard coding obfuscation techniques, especially when combined with calls to `New-Object`, `Invoke`, or direct API calls.

  - **Investigate Related System Activities:** Correlate findings with other system activities such as file creations and network connections initiated from the same process instance. This can help identify the spread or impact of the obfuscated payload.

  - **Assess Security Controls and EDR Alerts:** Ensure that your EDR system is configured to provide alerts on PowerShell commands that may involve obfuscation techniques. Review configured rules or policies that might have overlooked such behavior.

  ### Prioritization
  This alert is considered high severity in an enterprise environment due to the potential for significant impact from obfuscated PowerShell commands. Successful exploitation could lead to data breaches, system compromise, and lateral movement within the network.

  ### Blind Spots and Assumptions
  There may be detection gaps if PowerShell is being executed in a non-standard manner that does not fit the obfuscation patterns outlined in this rule. The detection logic assumes that denied script execution policies or other protective measures are in place. Additionally, for this alert to function optimally, comprehensive process creation logs with command line details need to be enabled and collected from all relevant endpoints.

