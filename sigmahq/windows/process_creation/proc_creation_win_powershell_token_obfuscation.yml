note: |
  ### Technical Context

  This rule detects the use of PowerShell token obfuscation techniques, specifically through the invocation of obfuscated command strings, which often indicates an attempt to evade detection. The likely attacker objective is to execute malicious PowerShell scripts without being easily recognizable, which suggests a sophisticated adversary trying to maintain persistence or deploy malware. This behavior aligns with the MITRE ATT&CK technique T1027.009 (Obfuscated Files or Information).

  The primary telemetry sources are Windows Process Creation logs, specifically monitoring CommandLine arguments (Event ID 4688 and Sysmon Event ID 1). If this behavior is malicious, it can lead to unauthorized access and control over the compromised system. Importantly, this detection does not confirm that a compromise has occurred; it merely highlights potentially suspicious command execution patterns that warrant further investigation.

  ### Investigation Steps

  - **Review the CommandLine Arguments:** Check Security Event ID 4688 or Sysmon Event ID 1 for process creation events. Focus on the CommandLine field for obfuscated PowerShell commands, particularly those fitting the regex patterns indicated in the detection (e.g., usage of backticks or unusual character structures).

  - **Validate PowerShell Execution History:** Use PowerShell logs (Event ID 4104) to identify prior script executions from the same source or related processes. Look for non-standard execution flows and compare timestamps with the suspected command execution.

  - **Identify known malicious indicators:** Examine the process tree surrounding the invoked command for execution patterns leading to known malicious artifacts like `powershell.exe` loading from uncommon directories or using flags that signal scripted execution (`-EncodedCommand`, `-ExecutionPolicy Bypass`).

  - **Assess for Legitimate Use Cases:** Determine if the observed command patterns can be attributed to legitimate administrative activities, particularly in environments where PowerShell is used for automation or DevOps practices. Check for usual scripts or administrative commands that are common in your organization’s workflows.

  - **Correlate with Other Security Events:** Look for alerts related to lateral movement or initial access attempts that coincide with the observed PowerShell execution (e.g., Windows Event ID 4624 for logons, Event ID 4648 for credential validation). Malicious use often correlates with other event anomalies.

  ### Prioritization

  This alert should be considered high severity, as it may indicate a compromised system engaging in covert operations using common attack techniques. The likelihood of abuse is significant, especially given the prevalence of PowerShell as an attack vector in recent threats. Obfuscation methods are frequently used in sophisticated attacks, making this a critical alert for further investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by various evasion techniques such as different levels of obfuscation beyond the regex patterns provided, which might escape detection. Reliable detection requires comprehensive logging settings, including PowerShell script block logging (Event ID 4104) and process creation events. Additionally, legitimate administrative tasks, particularly in scripting and automation contexts, may inadvertently trigger this alert. To enhance coverage, consider companion detections for anomalous user behavior or lateral movement alerts.

