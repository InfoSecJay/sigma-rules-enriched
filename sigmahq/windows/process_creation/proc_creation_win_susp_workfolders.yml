detection:
  selection:
    Image|endswith: '\control.exe'
    ParentImage|endswith: '\WorkFolders.exe'
  filter:
    Image: 'C:\Windows\System32\control.exe'
  condition: selection and not filter
falsepositives:
- Legitimate usage of the uncommon Windows Work Folders feature.
level: high
note: |
  ### Technical Context

  This rule detects the execution of `control.exe` as a child process of `WorkFolders.exe`, which is abnormal behavior when considering legitimate Windows operations. Attackers may exploit `WorkFolders.exe` to execute arbitrary commands, potentially aiming to bypass defenses or to execute payloads stealthily. This action relates to the MITRE ATT&CK technique for "Masquerading" (T1218), particularly the use of legitimate system processes for malicious purposes.

  The primary telemetry source is Windows process creation logs, particularly Security Event ID 4688, which captures all process creations. If this behavior is found to be malicious, it may indicate deeper compromise or lateral movement within an enterprise environment. It is important to note that this detection alone does not confirm malicious activity; it merely identifies suspicious process relationships that warrant further investigation.

  ### Investigation Steps

  - **Review Security Event ID 4688:** Check for process creation logs indicating `control.exe` initiated by `WorkFolders.exe`. Look for the specific command line used with `control.exe` for parameters depicting malicious intent (e.g., obfuscated commands).

  - **Analyze Parent Process Behavior:** Inspect the behavior of `WorkFolders.exe` before the execution of `control.exe`. For legitimate usage, it should not typically spawn other processes. If `WorkFolders.exe` was run from a user’s session context unexpectedly, this could signal a benign application being exploited.

  - **Look for Related File Creation Events:** Check for any related file activities, especially creation or modification events in directories commonly exploited by malware (e.g., %TEMP%, %APPDATA%). Key Event IDs to monitor include 4663 (file access).

  - **Verify User Context:** Investigate the user account context under which `WorkFolders.exe` is running. If it is initiated by a non-administrative user without a recent login that warrants its execution, this may indicate abuse.

  - **Check Associated Network Activity:** Review network logs for unusual outbound connections initiated by `control.exe` or `WorkFolders.exe`. This can help identify potential exfiltration activities, particularly looking at high-risk destinations.

  - **Audit other Process Relationships:** Investigate if `control.exe` has spawned additional child processes indicating multi-stage execution typical of malware. These child processes can provide insight into the malicious intent of the parent-child relationship.

  ### Prioritization

  This alert is classified as high severity due to the potential impact of the affected system. The execution of `control.exe` by `WorkFolders.exe` suggests a likely avenue for malicious activity, with this execution technique being a known method to execute payloads stealthily. Given that such processes can evade traditional detection methods, it merits urgent investigation.

  ### Blind Spots and Assumptions

  The detection may be evaded by threat actors disabling logging or manipulating `WorkFolders.exe` to run legitimate commands to mask malicious intent. There should be awareness that the Work Folders feature can be used legitimately, which could trigger this alert under normal operations. Additional detections focused on observing unusual command-line arguments with `control.exe` or tracking other parent-child relationships can enhance coverage and provide context for alert triage.

