logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\control.exe'
    ParentImage|endswith: '\WorkFolders.exe'
  filter:
    Image: 'C:\Windows\System32\control.exe'
  condition: selection and not filter
falsepositives:
- Legitimate usage of the uncommon Windows Work Folders feature.
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify potential misuse of the `WorkFolders.exe` process to launch an arbitrary instance of `control.exe`. This behavior may indicate an adversary attempting to execute malicious commands or scripts through a legitimate Windows process, which falls within the realm of living-off-the-land tactics. Attackers often seek to exploit trusted processes within the Operating System to evade detection while achieving their objectives, such as gaining remote control over systems, executing payloads, or bypassing security measures.

  In this scenario, the likely attacker objective may be to leverage a trusted process to execute control panel functionalities, perhaps to manipulate system settings or access sensitive data without raising alarms. The related MITRE ATT&CK tactics include **Defense Evasion** (TA0005), as the use of `WorkFolders.exe` appears to be an attempt to blend malicious activity with normal system operations, and **Execution** (TA0002) for running the `control.exe` executable.

  The primary data sources for this detection rule include **process creation events** from the endpoint’s operating system, which capture how and when processes are initiated, as well as their relationships with parent processes.

  ### Investigation Steps
  - **Analyze Process Creation Logs:** Review the process creation events to identify any instances where `control.exe` is launched with `WorkFolders.exe` as the parent process. Pay attention to the timestamps and user context in which these actions occur.
  - **Review for Anomalous Activity:** Check for other processes spawned around the same time that may indicate suspicious activity or coordination with other tools. Look for unusual account behavior or command executions that seem out of the ordinary.
  - **Evaluate Environment Context:** Assess the broader context of the operational environment, including user roles and activities, to determine legitimate vs. suspicious usage of `WorkFolders.exe` and the associated commands being executed.
  - **Correlate with Other Security Alerts:** Cross-reference the findings with alerts or logs from other domains (e.g., Antivirus, Network Traffic Analysis) to identify potential indicators of compromise related to this activity.

  ### Prioritization
  The severity of this alert is categorized as high because unauthorized execution of processes via trusted applications can lead to significant security breaches and data exfiltration. Given the ease with which adversaries can manipulate trusted processes, immediate investigation is warranted.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of malicious behavior if attackers deploy specialized variants of `WorkFolders.exe` or utilize other inconspicuous processes. Additionally, the detection assumes that the environment is configured to log complete process creation events; should logging be inadequate or misconfigured, the detection could fail. Organizations should ensure that comprehensive logging configurations are in place, including retention policies, to support ongoing detection and investigation efforts.

