note: |
  ### Technical Context

  This rule detects the use of CertOC.exe, a Windows binary associated with certificate operations, to download files from the internet. An attacker may utilize this behavior to fetch malicious payloads or exfiltrate data under the guise of legitimate certificate management operations. The relevant MITRE ATT&CK tactic is Command and Control (T1071), utilizing technique T1105 (Ingress Tool Transfer).

  The primary telemetry sources include process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command-line arguments and image paths for executable processes. The security impact of successful exploitation includes unauthorized data retrieval or delivery of payloads, which can lead to further compromise of the system. Importantly, this detection does NOT confirm malicious activity on its own; it requires context and additional corroborative evidence.

  ### Investigation Steps

  - **Inspect process creation logs for CertOC.exe:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances where `Image` ends with `\certoc.exe` and `OriginalFileName` is `CertOC.exe`. Note the command-line parameters used, specifically if they include `-GetCACAPS` and URLs containing 'http'.

  - **Validate command-line execution context:** Look for execution contexts that are unusual, such as CertOC.exe running from temporary or user folders (e.g., C:\Users\{username}\AppData\Local\Temp). Legitimate use typically comes from system contexts and with specific administrative operations.

  - **Correlate network activity related to the download:** Check firewall logs, proxy logs, or network IDS for any outbound connections to the URL used in the command-line during the time of CertOC.exe execution. High-confidence malicious indicators could involve known malicious domains or IPs.

  - **Assess the host assets and roles involved:** Determine if the host running CertOC.exe is a critical system, such as a domain controller or sensitive user workstation. This increases the severity of the alert as compromise on such assets can lead to wider access.

  - **Look for subsequent processes following CertOC.exe execution:** Review for unusual behavior immediately after CertOC.exe executes, such as the creation of new processes (use Event ID 4688) or network connections that may indicate a payload delivery.

  - **Compare against the MITRE ATT&CK framework:** Cross-reference the observed behavior with documented adversarial techniques to understand potential follow-on actions or related TTPs that can help assess the threat level.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems and the likelihood of misuse for malicious purposes. While file download via legitimate processes can occur, the association with CertOC.exe heightens risk given its typical usage patterns and the possibility of it being weaponized for Command and Control activities.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to rename malicious binaries to evade detection, or misuse other common utilities for similar actions. A complete baseline of legitimate CertOC.exe usage is necessary to minimize false positives. Legitimate activities such as standard IT procedures may trigger this alert, such as authenticating certificates for internal services. Companion detections include monitoring PowerShell for suspicious commands (e.g., Command and Control T1047) since it can also be used to download files.

