note: |
  ### Technical Context

  This Sigma rule detects the execution of processes that query specific Windows registry keys associated with the storage of credentials for third-party applications via command-line parameters. The likely attacker objective is to extract sensitive credentials, allowing unauthorized access to various third-party services or applications. This aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and specifically with the technique of Credentials from Password Stores (T1552.002).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events that include command-line arguments. If malicious, this behavior poses a significant security risk as it may indicate a breach attempt or unauthorized activity on sensitive user accounts. It is important to note that this detection does NOT, on its own, confirm successful credential extraction or exploitation; it only signifies potential attempts to gather credentials.

  ---

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the command line arguments that contain known credential storage registry paths such as `\Software\Mobatek\MobaXterm\`. Look for unusual user accounts executing this behavior.

  - **Identify high-confidence malicious indicators:** Focus on the execution of `reg.exe` with command-line arguments that include 'export' or 'save' for the found registry paths. This indicates an attempt to read the credential data which is often a precursor to credential theft.

  - **Verify expected legitimate activity:** Confirm whether legitimate applications like MobaXterm or WinSCP are used by administrators for valid purposes on the system. Check if scheduled tasks or known user workflows involve calls to these registry keys without malicious intent.

  - **Collect additional context from the environment:** Gather surrounding logs, such as user access logs and application logs for software known to store credentials in the registry keys being queried. Cross-reference access patterns with the behavior being detected.

  - **Check file system changes:** After identifying suspicious process execution, examine for created files or altered configurations relevant to credential storage locations. Use EDR tools to see if any unwanted or unexpected files related to credential dumping appear.

  - **Look for lateral movement:** Investigate if the executing user account has attempted connections to other systems using the fetched credentials. Examine access patterns and network logs for indications of unauthorized lateral movement.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on sensitive credentials and the likelihood of their exploitation by adversaries. While not all detected behavior necessarily indicates malicious activity, the exploitation of these registry keys is a common step in broader credential theft campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by user behavior not consistently being logged, or if an adversary uses legitimate credentials to perform the actions, leading to false negatives. There may be a requirement for additional logging configurations to ensure that all necessary processes are monitored effectively. Legitimate use of credential storage by authorized users can trigger this alert; thus, analysts must consider user context. Companion detections related to suspicious command line execution or changes to service states may strengthen overall monitoring for credential access activities.

