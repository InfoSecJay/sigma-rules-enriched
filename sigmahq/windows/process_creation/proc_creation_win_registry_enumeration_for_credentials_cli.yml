detection:
  selection:
    CommandLine|contains:     # Add more paths as they are discovered
    - '\Software\Aerofox\Foxmail\V3.1'
    - '\Software\Aerofox\FoxmailPreview'
    - '\Software\DownloadManager\Passwords'
    - '\Software\FTPWare\COREFTP\Sites'
    - '\Software\IncrediMail\Identities'
    - '\Software\Martin Prikryl\WinSCP 2\Sessions'
    - '\Software\Mobatek\MobaXterm\'
    - '\Software\OpenSSH\Agent\Keys'
    - '\Software\OpenVPN-GUI\configs'
    - '\Software\ORL\WinVNC3\Password'
    - '\Software\Qualcomm\Eudora\CommandLine'
    - '\Software\RealVNC\WinVNC4'
    - '\Software\RimArts\B2\Settings'
    - '\Software\SimonTatham\PuTTY\Sessions'
    - '\Software\SimonTatham\PuTTY\SshHostKeys\'
    - '\Software\Sota\FFFTP'
    - '\Software\TightVNC\Server'
    - '\Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin'
  filter_main_other_rule:    # matched by cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
    Image|endswith: 'reg.exe'
    CommandLine|contains:
    - 'export'
    - 'save'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects processes that query specific third-party registry keys known to store credentials via the command line. Attackers often target these tools to extract stored credentials for later use in malicious activities, potentially allowing them to gain unauthorized access to sensitive systems and data. The underlying motive is typically linked to credential theft, which can facilitate lateral movement within networks, escalate privileges, or enable further exploitation.

  Relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and specifically the technique of **Credentials from Applications** (T1552.002). Groups or individuals utilizing this technique may be engaged in reconnaissance or exploitation activities, aiming to steal user credentials in order to bypass authentication mechanisms.

  The primary data sources that will provide the best evidence for this detection include **process creation logs** on Windows systems, which capture command-line arguments passed to executables, and relevant registry access logs that monitor query operations on these key credential stores.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for process creation events that include command lines fetching registry paths indicative of credential access. Focus on entries related to known applications like FTP clients, email clients, and remote access software.

  - **Correlate with User Activity**: Compare the process creation logs against user activity logs to determine if the behavior is expected or sudden and suspicious. This helps identify potential unauthorized use of legitimate tools.

  - **Analyze Registry Access**: If the security tools allow, inspect registry access logs to see if there have been queries or modifications to the relevant credential-storing registry keys leading up to the detected incident.

  - **Check for Other Indicators**: Look for concurrent unusual behavior such as failed login attempts, unusual outbound connections, or additional suspicious process executions that may indicate a broader compromise.

  ### Prioritization
  This alert is assigned medium priority because while credential theft is a serious threat with the potential for significant impact, the presence of legitimate processes querying these registry keys may also generate false positives. As such, careful investigation is warranted to differentiate between benign and malicious activity.

  ### Blind Spots and Assumptions
  The detection logic may not cover all possible credential storage mechanisms, leading to potential blind spots in monitoring lesser-known registry paths or custom applications. The assumption is made that automated tools like `reg.exe` are being used maliciously, but legitimate administrative use may exist. Required logs include detailed process creation logs with command-line data and, ideally, registry access logs to ensure comprehensive detection capabilities for this type of activity.

