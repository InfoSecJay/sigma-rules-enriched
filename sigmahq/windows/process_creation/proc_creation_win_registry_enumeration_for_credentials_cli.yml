note: |
  ---

  ### Technical Context

  This Sigma rule detects the enumeration of 3rd party applications that store credentials in Windows registry keys. Malicious actors may exploit this behavior to retrieve sensitive information like passwords for various network applications, aiding in lateral movement or persistence within a target environment.

  This aligns with the MITRE ATT&CK framework under the tactic of Credential Access (ID: T1552) specifically targeting Credentials from Applications (ID: T1552.002). The primary telemetry source includes Windows process creation logs, particularly Event ID 4688 and Sysmon Event ID 1, where command-line arguments contain strings associated with known application registry paths.

  If this alert triggers, it could indicate potential malicious activity aimed at credential theft but does not on its own confirm an ongoing attack, as legitimate applications may also access these registry entries.

  ---

  ### Investigation Steps

  - **Review alert context in SIEM:** Check the specific command line that triggered the alert, focusing on Event ID 4688 or Sysmon Event ID 1 for the process creation event. Note any attempts to access registry keys associated with credential storage.

  - **Identify potentially malicious command line arguments:** Search for the presence of keywords like `export` and `save` in the CommandLine field. Legitimate behavior typically lacks these terms unless in a specific operational context.

  - **Cross-reference against approved applications:** Consult your organization's software inventory to determine if the triggering executable (including its path) is an authorized application used for legitimate purposes (e.g., `reg.exe` for Windows registry interactions).

  - **Investigate system roles and security posture:** Assess the host's role (e.g., desktop versus server) and the criticality of the affected system. Systems with elevated privileges or used for sensitive operations should receive immediate attention.

  - **Validate any file operations post-enumeration:** Check for artifacts indicating file creation or changes post-alert in locations where credential files are typically stored (e.g., temporary folders). Use file system logs or Sysmon File Creation events for validation.

  - **Gather intelligence on related indicators:** Review logs for previous instances of similar command line patterns across the network to identify potential indicators of compromise (IoCs) or campaigns.

  ---

  ### Prioritization

  The alert is rated as medium priority due to the potential severity of credential theft, which can lead to unauthorized access to sensitive assets or lateral movement within the network. While enumeration via known tools can indicate malicious intent, it is not uncommon for system administrators to query these settings for troubleshooting.

  ---

  ### Blind Spots and Assumptions

  There may be detection limitations if malicious actors utilize custom or less known applications that also access these registry keys, leading to evasion of this rule. It is imperative to have comprehensive auditing configurations for process creations and registry access logged. Additionally, legitimate administrative tasks or troubleshooting actions may inadvertently trigger the alert. For complementary coverage, consider using detections that monitor for unusual privilege escalation behavior related to credential manipulation.

