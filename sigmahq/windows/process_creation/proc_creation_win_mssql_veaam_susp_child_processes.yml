  ---

  ### Technical Context

  This Sigma rule detects suspicious child processes that are spawned by the Veeam SQL Server process (`sqlservr.exe`) with command lines that include various indicators of potential malicious behavior, such as downloading content from the internet or executing script commands. The likely attacker objective is to leverage Veeam's trusted environment to execute malicious commands or programs, which could indicate attempts of remote code execution (RCE) or exploitation of vulnerabilities through SQL injection.

  Relevant MITRE ATT&CK tactics and techniques include Initial Access (TA0001) and Persistence (TA0003) as well as Privilege Escalation (TA0004). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which record process creation events. If this activity is malicious, attackers may gain unauthorized access, exfiltrate data, or maintain persistent footholds in the environment. Importantly, this detection does NOT confirm malicious intent without additional context, as benign usage of similar commands in legitimate administrative activities can trigger this alert.

  ---

  ### Investigation Steps

  - **Identify the Parent Process:**
    Check Security Event ID 4688 or Sysmon Event ID 1 for the parent process name `sqlservr.exe`. Confirm that it was executed from a legitimate location (typically `C:\Program Files\Veeam\`) as a part of expected operations.

  - **Examine Child Process Command Lines:**
    Review command line arguments associated with child processes (`cmd.exe`, `powershell.exe`, etc.) for malicious indicators such as `-ex`, `bypass`, or URLs using HTTP/HTTPS. Flags like `DownloadString` and commands such as `mshta` or `regsvr32` may indicate an attempt to download or execute unauthorized scripts.

  - **Analyze Recent Process Activity:**
    Look at the process execution history and correlate any instances of Veeam services starting around the same time as the suspicious child processes. Legitimate activities for Veeam typically include backups and recovery operations without unusual command line parameters.

  - **Evaluate Network Connections:**
    Check for any outbound connections initiated by child processes to external URLs or IP addresses, particularly those associated with suspicious command lines. Use firewall logs and network traffic analysis tools to identify unusual patterns or destinations.

  - **Confirm the Location of Executables:**
    Verify the file paths of detected child processes against file integrity monitoring logs. Files like `cmd.exe` or `powershell.exe` should originate from trusted directories, and any counterparts found in unexpected locations may be a sign of compromise.

  - **Assess Host Integrity:**
    Monitor the host’s role and sensitivity in the environment. As Veeam is often tied to critical data backups, compromised systems could lead to severe data loss or operational disruption. Prioritize investigation on hosts with elevated privileges or critical data.

  ---

  ### Prioritization

  This alert is critical due to the potential impact on critical data systems. The likelihood of malicious abuse is significant given that the detection highlights potential exploitation techniques that adversaries commonly employ. This behavior is often weaponized, particularly in environments utilizing Veeam for backup, making swift investigation essential.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed command line logging, as not all environments may capture full command line input. Evasion techniques could include renaming executables or using built-in Windows utilities in seemingly benign ways. Legitimate administrative actions using PowerShell or CMD for daily operations may trigger this alert. Related detections such as unusual authenticated access to SQL Server services can strengthen coverage and provide context for further analysis.

