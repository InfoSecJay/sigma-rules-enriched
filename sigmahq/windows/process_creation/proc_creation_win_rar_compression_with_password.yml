logsource:
  category: process_creation
  product: windows
detection:
  selection_password:
    CommandLine|contains: ' -hp'
  selection_other:
    CommandLine|contains:
    - ' -m'
    - ' a '
  condition: selection_password and selection_other
falsepositives:
- Legitimate use of Winrar command line version
- Other command line tools, that use these flags
level: high
note: |
  ### Technical Context

  This rule detects the use of `rar.exe`, specifically when it is invoked with command-line flags indicating password protection (` -hp`) and a specific compression level (` -m`). This behavior is often associated with adversaries attempting to exfiltrate data or stealthily compress and encrypt sensitive files before sending them to external locations. The relevant MITRE ATT&CK technique is **T1560.001** (Archive Collected Data).

  The primary telemetry source for this detection is **Windows Process Creation Logs**, notably Security Event ID **4688** and Sysmon Event ID **1**, which record the creation of new processes and their command-line arguments. If this activity is confirmed as malicious, it can indicate data exfiltration, potential evasion of security tools, or preparation for lateral movement. Importantly, this detection does NOT conclusively confirm malicious intent; legitimate usage by authorized personnel may trigger the alert, particularly within environments that utilize `rar.exe` for valid archiving operations.

  ### Investigation Steps

  - **Check command-line arguments**: Review the command line in Security Event ID **4688** or Sysmon Event ID **1** for the presence of ` -hp` and ` -m`. A legitimate usage might include standard backup operations without password protection or compression level specification.

  - **Validate execution context**: Determine the user account executing `rar.exe` and correlate with user roles and permissions. Regular users or non-administrative accounts executing this command may warrant further scrutiny.

  - **Examine related process activity**: Analyze the parent process IDs of the alerting instance in Sysmon Event ID **1**. Legitimate processes like backup utilities might have a legitimate parent-child relationship, while unexpected parents may indicate a potentially malicious workflow.

  - **Review file output**: Check for new archive creation events (e.g., files with `.rar` extensions) in directories commonly used for sensitive data. Use Windows Event ID **4663** to track access and creation of these artifacts.

  - **Search for data exfiltration patterns**: Investigate any immediate network activity following the detection, particularly outbound connections or transfers involving the created archive. Use firewall or network monitoring logs that capture external communication with unusual file size transfers.

  ### Prioritization

  The alert is classified with **high severity** due to the potential impact on data integrity and confidentiality, as well as the likelihood of malicious abuse in environments where attackers seek to exfiltrate data stealthily. The behavior detected (using `rar.exe` with specific flags) is commonly weaponized in targeted attacks attempting to obfuscate sensitive information.

  ### Blind Spots and Assumptions

  This detection may miss variants of legitimate archiving tools or scripts that may perform similar operations without triggering the alert. It relies on the availability of comprehensive Windows Process Creation logs; gaps in logging configurations could hinder detection efficacy. Additionally, authorized personnel might genuinely employ these commands for benign reasons, often requiring context-based analysis. Related detections for comprehensive coverage might include monitoring for data transfers using tools like `curl` or `wget`, which could signal coordinated exfiltration activity.

