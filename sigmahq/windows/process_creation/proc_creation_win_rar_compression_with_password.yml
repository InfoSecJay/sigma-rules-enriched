detection:
  selection_password:
    CommandLine|contains: ' -hp'
  selection_other:
    CommandLine|contains:
    - ' -m'
    - ' a '
  condition: selection_password and selection_other
falsepositives:
- Legitimate use of Winrar command line version
- Other command line tools, that use these flags
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of `rar.exe` to create password-protected archives, a behavior often associated with malicious intent such as data exfiltration or obfuscation of files. Attackers may use this technique to conceal sensitive data or payloads within compressed archives, aimed at bypassing detection mechanisms or facilitating ease of transfer to external locations. The relevant MITRE ATT&CK tactic is **Collection (T1560)** and the specific technique is **Archive Collected Data (T1560.001)**.

  The primary telemetry sources include Windows process creation logs, particularly focusing on Event ID 4688 for process creation events that capture command line arguments used with `rar.exe`. If this activity is malicious, it could lead to unauthorized data access and exfiltration, compromising sensitive information. Importantly, this detection does NOT confirm that malicious activity is occurring—it could reflect legitimate usage of the tool for archive creation.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 to find instances of `rar.exe` being executed. Look for `CommandLine` containing `-hp` (password-protected) and either `-m` (compression level flag) or `a` (archive flag) to identify suspicious activity.

  - **Identify high-confidence malicious indicators**: Check for unexpected execution of `rar.exe` in systems where it is not typically used. For instance, a server not designated for file archiving should not have this tool executing with these flags.

  - **Assess legitimate usage scenarios**: Cross-reference the user executing `rar.exe` with known legitimate workflows. For example, if a user with no cause to create password-protected archives does so, it raises suspicion.

  - **Check for additional artifacts**: Look for file creation events related to newly created `.rar` files using Sysmon Event ID 11. Examine the destination and size of these files to determine if they reflect exfiltration activity.

  - **Monitor the timing of executions**: Correlate the `rar.exe` command execution with other potentially suspicious activities, such as unusual file access or network connections to external IPs shortly afterward.

  ---

  ### Prioritization

  This alert is of **high severity** due to the potential impact on data confidentiality if a sensitive system is involved or if critical data is being exfiltrated. The tactic is commonly weaponized in insider threats and advanced persistent threat (APT) scenarios, increasing the likelihood of malicious abuse.

  ---

  ### Blind Spots and Assumptions

  The detection may miss legitimate use cases, such as system administrators utilizing `rar.exe` for permissible file organization. It is crucial to ensure that process creation logs are fully enabled for reliable detection. Additionally, attackers might use alternative archiving tools that do not trigger this rule. A companion detection for monitoring unsolicited outbound connections can enhance coverage by identifying potential data exfiltration attempts that coincide with compressed archive creation.

