title: Rar Usage with Password and Compression Level
id: faa48cae-6b25-4f00-a094-08947fef582f
status: test
description: Detects the use of rar.exe, on the command line, to create an archive
  with password protection or with a specific compression level. This is pretty indicative
  of malicious actions.
references:
- https://labs.sentinelone.com/the-anatomy-of-an-apt-attack-and-cobaltstrike-beacons-encoded-configuration/
- https://ss64.com/bash/rar.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
author: '@ROxPinTeddy'
date: 2020-05-12
modified: 2022-03-16
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_password:
    CommandLine|contains: ' -hp'
  selection_other:
    CommandLine|contains:
    - ' -m'
    - ' a '
  condition: selection_password and selection_other
falsepositives:
- Legitimate use of Winrar command line version
- Other command line tools, that use these flags
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the `rar.exe` command-line utility is invoked to create archives with password protection or specific compression levels. Such usage is often associated with malicious activities, including data exfiltration or the obfuscation of stolen data. The implementation of password protection and specific compression settings can indicate that attackers are attempting to hide their actions or make their files less detectable by security tools.

  The likely attacker objectives include the encryption of sensitive files prior to exfiltration or the organization of data in a way that evades detection during the impact phase of an attack. This behavior aligns with the MITRE ATT&CK Tactic of **Collection** (TA0011), specifically the technique **T1560.001 - Archive Collected Data**, which outlines methods by which adversaries package data for exfiltration.

  Primary data sources that would be useful for this detection include **process creation events** from Windows systems, which log command-line arguments used in process invocation and can provide insights into potentially malicious activity surrounding `rar.exe`.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine the logs for instances of `rar.exe` with command-line arguments containing `-hp` (indicating password protection) and other compression level indicators. Focus on the context of these executions to identify any unusual patterns.
  - **Correlate with Exfiltration Activity**: Check for other signs of data exfiltration or abnormal data movement, such as large file transfers or unusual outbound connections, that coincide with `rar.exe` invocations.
  - **Analyze User Context**: Determine whether the user executing the command had legitimate reasons to create such archives. Look into the user's role, previous activities, and whether there are any indicators of credential theft or account compromise.
  - **Inspect Related Logs for Anomalies**: Review additional logs such as file access logs or network logs for any other suspicious activities that may correlate with the use of the `rar.exe` command, including authentication logs that show unusual access patterns.

  ### Prioritization
  The severity of this alert is high due to the potential for data exfiltration operations and the obfuscation tactics that attackers may employ to evade detection. Given the critical nature of sensitive data in an enterprise environment, any indicators of misuse with tools like `rar.exe` demand immediate investigation.

  ### Blind Spots and Assumptions
  This rule may miss legitimate uses of `rar.exe` by authorized personnel who have a valid need for file compression. Additionally, if adversaries use alternative tools or methods to compress and encrypt data, this detection may not trigger. The detection logic assumes that the command-line invocations containing the defined keywords are indicative of malicious activity, which may not always be true in environments where similar functionality is required for legitimate operations. Access to **comprehensive process creation logs** with sufficient retention, alongside monitoring for additional context around potential exfiltration, is necessary for the effective functioning of this alert.

