  ---

  ### Technical Context

  This Sigma rule detects instances where the `svchost.exe` process is spawned without any command-line arguments, a suspicious behavior often indicative of malicious activity. An attacker may aim to achieve process injection or execute alternative payloads leveraging `svchost.exe` as a cover for their actions. This behavior corresponds primarily to the MITRE ATT&CK technique "Process Injection" (T1055) and is associated with the "Defense Evasion" and "Privilege Escalation" tactics.

  The primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture the execution of processes along with their associated command-line arguments and parent processes. If exploited maliciously, this behavior can lead to unauthorized privilege escalation and persistent threats within the environment. It is crucial to note that the detection alone does not confirm malicious activity; benign instances of legitimate software, like some versions of lojack software, may also exhibit similar behavior.

  ---

  ### Investigation Steps

  - **Correlate process execution events**: Review Security Event ID 4688 or Sysmon Event ID 1 for the `svchost.exe` instance, focusing on the command-line arguments and parent processes. Look for instances where the ParentImage is `rpcnet.exe` or `rpcnetp.exe`.

  - **Identify high-confidence malicious indicators**: Check for the absence of command-line arguments in the `svchost.exe` instance. Malicious activity is strongly indicated if `svchost.exe` is spawned with no CLI arguments and appears as a child to `rpcnet.exe` or `rpcnetp.exe`.

  - **Validate legitimate behavior**: Identify and document any known legitimate instances of `svchost.exe` being spawned during routine operations, particularly against the associated command-line parameters typical for known software and configured services.

  - **Field validation for parent processes**: Assess the lineage of the process tree using Sysmon Event ID 5 (Process Terminated) and Event ID 6 (Driver Loaded) for interactions with `rpcnet.exe` or `rpcnetp.exe`, to determine if related anomalies exist.

  - **Host role consideration**: Analyze alerts in the context of critical assets or servers. `svchost.exe` activity originating from domain controllers or databases should be subject to more scrutiny due to their elevated privilege implications.

  - **Cross-reference with system integrity**: Check if any integrity tool or EDR has flagged unusual behavior for `svchost.exe`. Look for file creation events (Sysmon Event ID 11) or modifications that could indicate potential fileless attack vectors.

  ---

  ### Prioritization

  This alert is of high severity due to the potential for significant impact if an attack is confirmed, particularly in enterprise environments where escalation of privileges can give attackers extensive control. The likelihood of malicious exploitation is elevated given the abnormal spawning of `svchost.exe`, a commonly abused process in attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if logs are not properly configured to capture all relevant process creation events, as well as potential evasion tactics employed by sophisticated attackers, such as process hollowing or the stealing of legitimate process identities. Legitimate applications could trigger the alert during routine operations, especially software that interacts with the Windows service architecture. A related detection rule that can strengthen coverage is the examination of unusual parent-child process relationships, directly watching for unexpected parent processes initiating system-critical services.

