detection:
  selection:
    CommandLine|endswith: 'svchost.exe'
    Image|endswith: '\svchost.exe'
  filter:
  - ParentImage|endswith:
    - '\rpcnet.exe'
    - '\rpcnetp.exe'
  - CommandLine:             # no CommandLine value available
  condition: selection and not filter
falsepositives:
- Rpcnet.exe / rpcnetp.exe which is a lojack style software. 
  https://www.blackhat.com/docs/us-14/materials/us-14-Kamlyuk-Kamluk-Computrace-Backdoor-Revisited.pdf
level: high
note: |
  ### Technical Context
  This detection rule identifies abnormal instances of the `svchost.exe` process being spawned without command-line arguments, which is typically associated with malicious activity. In a legitimate context, `svchost.exe` is a critical Windows system process that hosts multiple Windows services. However, when spawned without any parameters, it may indicate that an attacker is exploiting this commonly used process to run malicious code or inject payloads. This behavior is often observed in various types of attacks aimed at maintaining persistence or executing further actions on a compromised system.

  The attacker’s objectives in such scenarios typically include executing code undetected by security solutions, evading defenses by utilizing trusted processes, and potentially maintaining access to the target environment. This behavior aligns particularly with the following MITRE ATT&CK techniques: **Process Injection (T1055)**, which describes techniques where an attacker injects code into the memory of another process, and both **Privilege Escalation (T1068)** and **Defense Evasion (T1070)** as they may seek to use legitimate processes to avoid detection.

  The primary data source for monitoring these suspicious activities would be Windows process creation logs, as they provide details on newly created processes, their parent processes, and any associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze Windows process creation logs to identify instances of `svchost.exe` spawning without command-line arguments, particularly focusing on parent processes such as `rpcnet.exe` or `rpcnetp.exe`.
  - **Correlate with Endpoint Data:** Investigate endpoint detection and response (EDR) alerts related to `svchost.exe` and any associated behavior; look for memory injection activity around the reported timestamps.
  - **Assess Network Activity:** Examine network logs for any anomalous outbound connections made shortly after the suspicious `svchost.exe` process creation, which may suggest data exfiltration or communication with a command-and-control server.
  - **Verify Authenticity of Components:** Check the integrity of the files associated with `rpcnet.exe` and `rpcnetp.exe`, as these could indicate legitimate software (like Lojack) or potentially unwanted programs (PUPs) that have been compromised.

  ### Prioritization
  The severity of this alert is high due to the potential impact of unauthorized process injections, which can lead to complete system compromise and lateral movement within the network. As such, even a low likelihood event can result in significant threats.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of malicious activity since attackers can modify typical behaviors of processes or employ alternative methods to evade detection. The detection logic assumes that threat actors will rely on `svchost.exe` to spawn malicious activities, which may not always be the case. Additionally, this rule requires complete and continuous logging of Windows process creation events to function effectively; any lack of logging for these events could lead to missed detections.

