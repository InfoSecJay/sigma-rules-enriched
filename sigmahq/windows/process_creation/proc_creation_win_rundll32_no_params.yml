detection:
  selection:
    CommandLine|endswith:
    - '\rundll32.exe'
    - '\rundll32.exe"'
    - '\rundll32'
  filter:
    ParentImage|contains:
    - '\AppData\Local\'
    - '\Microsoft\Edge\'
  condition: selection and not filter
falsepositives:
- Possible but rare
level: high
note: |
  ### Technical Context

  This rule detects the execution of `rundll32.exe` without accompanying command-line parameters from processes initiated by untrusted parent applications such as those located in the user's AppData or Microsoft Edge directories. This behavior is often associated with post-exploitation activities, particularly when adversaries attempt to leverage legitimate Windows features to execute payloads stealthily.

  The likely attacker objective includes establishing a foothold or executing malicious code without drawing attention, fitting within the MITRE ATT&CK framework under the Tactic: *Defense Evasion*, Technique: *Indicator Removal on Host* (T1202). Primary telemetry sources involve process creation logs, specifically Windows Security Event ID 4688, which provide details of process instantiation, along with Sysmon Event ID 1, which offers detailed insights into command-line arguments. If malicious, this can lead to further compromise or exfiltration of data.

  This detection does NOT confirm malicious activity by itself; it only indicates suspicious activity that warrants further investigation.

  ### Investigation Steps

  - **Review parent process details:** Analyze Windows Security Event ID 4688 for the `rundll32.exe` process to identify the parent process. Legitimate execution typically originates from well-known applications, not transient processes in user folders.

  - **Inspect command-line arguments:** Verify that there are no command-line parameters associated with `rundll32.exe` in Sysmon Event ID 1. Malicious execution often lacks legitimate parameters, while normal execution typically includes them.

  - **Validate execution along established paths:** Cross-reference the execution path in the logs; if `rundll32.exe` is initiated from `C:\Windows\System32` or another system directory, this may indicate normal activity, whereas execution from `$APPDATA$\Local\` raises suspicion.

  - **Correlate with prior alerts:** Check for recurring instances of `rundll32.exe` execution in the environment. Multiple occurrences, especially from the same parent process, strengthen the case for a malicious indicator.

  - **Monitor for lateral movement:** Investigate related Sysmon events (e.g., Event ID 10 for ProcessAccess) for potential credential dumping or attempts to access other processes from the suspicious `rundll32.exe` instance.

  ### Prioritization

  This alert is of high severity due to the potential for significant security impact if `rundll32.exe` is used maliciously. The threat posed by this tactic is recognized in many attack frameworks, as it is a common technique wielded by adversaries for executing malicious payloads without detection.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques such as legitimate use of `rundll32.exe` through authorized scripts or tools. Accurate detection relies on comprehensive logging from all critical Windows systems and may require additional context for legitimate processes. Legitimate administrative tasks may trigger this alert if they utilize `rundll32.exe`. Companion detections, such as monitoring abnormal DLL loads (Sysmon Event ID 7), can enhance visibility of potential malicious behavior associated with this detection.

