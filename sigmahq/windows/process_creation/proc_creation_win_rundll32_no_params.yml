title: Rundll32 Execution Without CommandLine Parameters
id: 1775e15e-b61b-4d14-a1a3-80981298085a
status: test
description: Detects suspicious start of rundll32.exe without any parameters as found
  in CobaltStrike beacon activity
references:
- https://www.cobaltstrike.com/help-opsec
- https://twitter.com/ber_m1ng/status/1397948048135778309
author: Florian Roth (Nextron Systems)
date: 2021-05-27
modified: 2023-08-31
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|endswith:
    - '\rundll32.exe'
    - '\rundll32.exe"'
    - '\rundll32'
  filter:
    ParentImage|contains:
    - '\AppData\Local\'
    - '\Microsoft\Edge\'
  condition: selection and not filter
falsepositives:
- Possible but rare
level: high
note: |
  ### Technical Context
  This detection rule identifies instances of `rundll32.exe` being executed without any command-line parameters, which is commonly observed in Cobalt Strike beacon activity. Cobalt Strike is a legitimate penetration testing tool often abused by threat actors to facilitate command-and-control (C2) communications within compromised networks. The execution of `rundll32.exe` without parameters is indicative of potential reconnaissance or lateral movement activities, as attackers may manipulate this Windows utility to execute malicious code hidden in DLLs.

  The relevant MITRE ATT&CK techniques for this behavior include **Defense Evasion (T1202)**, where attackers execute code in a manner that bypasses defenses or avoids detection by security tools. Attackers aim to remain stealthy and blend in with legitimate system processes, hence the use of `rundll32.exe` without visible parameters. It is critical to monitor process creation events to identify potential misuse of this utility.

  Key data sources for this detection include Windows process creation logs, which provide insight into command executions. These logs can help analysts track unusual execution patterns and investigate the context around the actions taken by the `rundll32.exe` process.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the Windows process creation logs for instances of `rundll32.exe` without command-line parameters. Note the timestamps and parent processes associated with these executions.
  - **Analyze Parent Process Context:** Investigate the parent process that initiated `rundll32.exe`. Search for any suspicious activity or known malicious process identifiers, particularly focusing on processes launching from `AppData\Local\` or `Microsoft\Edge\`.
  - **Cross-reference with User Behavior:** Check the user account associated with the execution. Look for any unusual or unauthorized access patterns related to the account at the time of the incident.
  - **Correlate with Network Activity:** If available, analyze outgoing network connections from the host where the `rundll32.exe` execution occurred to identify any communication with known malicious IP addresses or domains.

  ### Prioritization
  The alert is considered high severity due to the potential impact of detecting Cobalt Strike activities, which could indicate active compromise and threat actor presence in the enterprise environment. Given the sophisticated nature of Cobalt Strike, the likelihood of serious data breaches or lateral movement increases, warranting prompt investigation.

  ### Blind Spots and Assumptions
  There are several blind spots related to this detection rule. It may miss instances where `rundll32.exe` is executed with parameters, which could still be legitimate or malicious. Additionally, the detection assumes that the process is being spawned from specific suspicious locations, which may not account for other methods of execution that could be equally malicious. Required logs include detailed process creation events, and environments not logging these events or improperly configured to capture necessary telemetry will not trigger this alert effectively.

