title: Obfuscated IP Download Activity
id: cb5a2333-56cf-4562-8fcb-22ba1bca728d
status: test
description: Detects use of an encoded/obfuscated version of an IP address (hex,
  octal...) in an URL combined with a download command
references:
- https://h.43z.one/ipconverter/
- https://twitter.com/Yasser_Elsnbary/status/1553804135354564608
- https://twitter.com/fr0s7_/status/1712780207105404948
author: Florian Roth (Nextron Systems), X__Junior (Nextron Systems)
date: 2022-08-03
modified: 2025-07-18
tags:
- attack.discovery
logsource:
  category: process_creation
  product: windows
detection:
  selection_command:
    CommandLine|contains:
    - 'Invoke-WebRequest'
    - 'iwr '
    - 'Invoke-RestMethod'
    - 'irm '
    - 'wget '
    - 'curl '
    - 'DownloadFile'
    - 'DownloadString'
  selection_ip_1:
    CommandLine|contains:
    - ' 0x'
    - '//0x'
    - '.0x'
    - '.00x'
  selection_ip_2:
    CommandLine|contains|all:
    - 'http://%'
    - '%2e'
  selection_ip_3:
        # http://81.4.31754
  - CommandLine|re: 'https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}'
        # http://81.293898
  - CommandLine|re: 'https?://[0-9]{1,3}\.0[0-9]{3,7}'
        # http://1359248394
  - CommandLine|re: 'https?://0[0-9]{3,11}'
        # http://0121.04.0174.012
  - CommandLine|re: 'https?://(0[0-9]{1,11}\.){3}0[0-9]{1,11}'
        # http://012101076012
  - CommandLine|re: 'https?://0[0-9]{1,11}'
        # For octal format
  - CommandLine|re: ' [0-7]{7,13}'
  filter_main_valid_ip:
    CommandLine|re: 'https?://((25[0-5]|(2[0-4]|1\d|[1-9])?\d)(\.|\b)){4}'
  condition: selection_command and 1 of selection_ip_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects potentially malicious attempts to download files by using obfuscated IP addresses in command-line execution contexts, such as PowerShell and curl. The likely attacker objective is to hide the destination of a file download to evade detection. This behavior may indicate the initial stages of exploitation or the delivery of payloads post-exploitation, fitting within the "Command and Control" (T1071) tactic of the MITRE ATT&CK framework.

  Primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command-line execution details. If the detected activity is malicious, it can lead to unauthorized file execution, data breaches, or further compromise of the environment. Importantly, this detection does NOT confirm a successful compromise; it only highlights the use of obfuscated commands that could be benign or malicious.

  ### Investigation Steps

  - **Review command history:** Examine relevant Security Event ID 4688 logs to find instances of "Invoke-WebRequest", "Invoke-RestMethod", "wget", or "curl" commands. Check if they are being run by unexpected users or on non-standard endpoints.

  - **Analyze obfuscation pattern:** Look for command-line arguments containing obfuscated IPs (e.g., `'0x'`, `%2e`). Focus on Sysmon Event ID 1 that shows the `CommandLine` field for signs of encoded behavior that diverges from typical organizational usage.

  - **Identify legitimate activities:** Cross-reference the command execution with known good patterns used by internal scripts or applications, particularly those executed by legitimate processes. For example, validate whether `Invoke-WebRequest` is used for internal network operations.

  - **Correlate with known malicious indicators:** Check the command context against threat intelligence databases or internal logs for similar obfuscation techniques that have been previously linked to malicious behavior.

  - **Track file download activities:** Monitor for corresponding file system events (such as Security Event ID 4663) that indicate file creation or modification in the directories where the downloads might occur. Look for unexpected file types or unusual timestamps matching the command execution.

  - **Assess process parentage:** Use Sysmon Event ID 1 to investigate parent processes of the detected commands, identifying suspicious origins. Investigate if the process tree indicates an initial script execution by tools commonly involved in data exfiltration or system manipulation.

  ### Prioritization

  This alert should be considered medium priority due to its potential impact on system integrity and data security. Given that obfuscated IP downloads are less common in legitimate operations, there is a moderate likelihood of malicious activity, especially if detected on critical assets. This behavior is often weaponized in various exploit scenarios, necessitating timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate benign activity triggering the alert, such as software updates or the use of scripts by authorized personnel. A requirement for reliable detection is the configuration of comprehensive logging through Windows Security and Sysmon to ensure all relevant command-line executions are captured. A related detection to consider is for unusual PowerShell commands (such as invocation of encoded commands), which can further enhance visibility into potentially malicious behaviors.

