title: Obfuscated IP Download Activity
id: cb5a2333-56cf-4562-8fcb-22ba1bca728d
status: test
description: Detects use of an encoded/obfuscated version of an IP address (hex, octal...)
  in an URL combined with a download command
references:
- https://h.43z.one/ipconverter/
- https://twitter.com/Yasser_Elsnbary/status/1553804135354564608
- https://twitter.com/fr0s7_/status/1712780207105404948
author: Florian Roth (Nextron Systems), X__Junior (Nextron Systems)
date: 2022-08-03
modified: 2025-07-18
tags:
- attack.discovery
logsource:
  category: process_creation
  product: windows
detection:
  selection_command:
    CommandLine|contains:
    - 'Invoke-WebRequest'
    - 'iwr '
    - 'Invoke-RestMethod'
    - 'irm '
    - 'wget '
    - 'curl '
    - 'DownloadFile'
    - 'DownloadString'
  selection_ip_1:
    CommandLine|contains:
    - ' 0x'
    - '//0x'
    - '.0x'
    - '.00x'
  selection_ip_2:
    CommandLine|contains|all:
    - 'http://%'
    - '%2e'
  selection_ip_3:
        # http://81.4.31754
  - CommandLine|re: 'https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}'
        # http://81.293898
  - CommandLine|re: 'https?://[0-9]{1,3}\.0[0-9]{3,7}'
        # http://1359248394
  - CommandLine|re: 'https?://0[0-9]{3,11}'
        # http://0121.04.0174.012
  - CommandLine|re: 'https?://(0[0-9]{1,11}\.){3}0[0-9]{1,11}'
        # http://012101076012
  - CommandLine|re: 'https?://0[0-9]{1,11}'
        # For octal format
  - CommandLine|re: ' [0-7]{7,13}'
  filter_main_valid_ip:
    CommandLine|re: 'https?://((25[0-5]|(2[0-4]|1\d|[1-9])?\d)(\.|\b)){4}'
  condition: selection_command and 1 of selection_ip_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects suspicious download activity where an attacker is using obfuscated or encoded IP addresses as part of the command-line arguments associated with network requests on Windows systems. Attackers may utilize obfuscation techniques to bypass security mechanisms and hide their true intentions when downloading potentially malicious files from the internet. By using encoded representations of IP addresses (such as hexadecimal or octal), adversaries can mask the destination of their downloads, making it challenging for traditional security measures to identify malicious activity.

  The relevant MITRE ATT&CK tactics for this type of behavior include **Command and Control (TA0011)**, as the activity likely involves establishing communication with potentially harmful external systems. The techniques of interest would be **Command-Line Interface (T1059)** due to the use of command-line tools (e.g., `wget`, `curl`) and possibly **Application Layer Protocol (T1071)** related to utilizing web protocols for data exfiltration or remote control purposes. The primary data source for detecting this activity will be **process creation events**, particularly those that provide detailed command line arguments.

  ### Investigation Steps
  - **Review Process Creation Events:** Gather and analyze process creation logs for instances of `Invoke-WebRequest`, `Invoke-RestMethod`, `wget`, `curl`, and other associated commands that include obfuscated IP addresses.
  - **Examine Command-Line Arguments:** Look closely at the command-line arguments used during the process creation to identify any usage of hexadecimal, octal, or other obfuscation patterns within URLs leading to downloads.
  - **Correlate Network Activity:** Investigate outbound network traffic that corresponds to the identified processes to determine if connections are being made to suspicious external IPs or domains.
  - **Assess for Unusual Behavior:** Check for other indicators of compromise, such as additional network activity to known-malicious domains or abnormal patterns in legitimate system behavior indicating potential exploitation.

  ### Prioritization
  The severity of this alert is considered medium due to the nature of the obfuscated IP download activity. While not all instances may represent genuine threats, the use of obfuscation is a common tactic employed by attackers, warranting prompt investigation in an enterprise environment to prevent potential threats from manifesting.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of obfuscated IP download activity, particularly if the obfuscation methods change over time or if legitimate applications use similar command-line patterns. The detection logic assumes that proper process creation monitoring is in place and that command line arguments are logged effectively. Additionally, an adequate level of logging and monitoring configuration must be enabled for this alert to function, as variations in logging settings could mask legitimate threats or lead to missed detections.

