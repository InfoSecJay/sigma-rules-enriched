title: Obfuscated IP Download Activity
id: cb5a2333-56cf-4562-8fcb-22ba1bca728d
status: test
description: Detects use of an encoded/obfuscated version of an IP address (hex,
  octal...) in an URL combined with a download command
references:
- https://h.43z.one/ipconverter/
- https://twitter.com/Yasser_Elsnbary/status/1553804135354564608
- https://twitter.com/fr0s7_/status/1712780207105404948
author: Florian Roth (Nextron Systems), X__Junior (Nextron Systems)
date: 2022-08-03
modified: 2026-03-16
tags:
- attack.discovery
logsource:
  category: process_creation
  product: windows
detection:
  selection_command:
    CommandLine|contains:
    - 'Invoke-WebRequest'
    - 'iwr '
    - 'Invoke-RestMethod'
    - 'irm '
    - 'wget '
    - 'curl '
    - 'DownloadFile'
    - 'DownloadString'
  selection_ip_1:
    CommandLine|contains:
    - ' 0x'
    - '//0x'
    - '.0x'
    - '.00x'
  selection_ip_2:
    CommandLine|contains|all:
    - 'http://%'
    - '%2e'
  selection_ip_3:
        # http://81.4.31754
  - CommandLine|re: 'https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}'
        # http://81.293898
  - CommandLine|re: 'https?://[0-9]{1,3}\.0[0-9]{3,7}'
        # http://1359248394
  - CommandLine|re: 'https?://0[0-9]{3,11}'
        # http://0121.04.0174.012
  - CommandLine|re: 'https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}'
        # http://012101076012
  - CommandLine|re: 'https?://0[0-9]{1,11}'
        # For octal format
  - CommandLine|re: ' [0-7]{7,13}'
  filter_main_valid_ip:
    CommandLine|re: 'https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}'
  condition: selection_command and 1 of selection_ip_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances where encoded or obfuscated IP addresses are included in command-line requests intended for downloading files, utilizing common tools such as PowerShell’s Invoke-WebRequest or curl. The likely attacker objective is to download malicious payloads from remote servers while obscuring their true destination to evade detection mechanisms. This behavior aligns with the MITRE ATT&CK tactic of "Command and Control" (T1071) and the technique "Application Layer Protocol" (T1071.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Security Event ID 4688. If successful, this attack could allow an adversary to introduce malware into the environment, thereby compromising the integrity and confidentiality of systems. However, this detection does NOT confirm that a malicious action was definitively taken, as legitimate use of these commands can also be commonplace for system administration or software retrieval.

  ### Investigation Steps

  - **Review command-line arguments:** Investigate Event ID 4688 for commands containing 'Invoke-WebRequest', 'wget', or 'curl'. Note any encoded or obfuscated IPs. Legitimate usage often involves clear text URLs without obfuscation.

  - **Check parent process:** Assess the parent process IDs (PPID) reported in Event ID 4688. Investigate whether they originate from legitimate processes (e.g., PowerShell ISE) or from suspicious executables (e.g., cmd.exe launched from a non-standard location).

  - **Evaluate download completion:** For successful downloads, review file creation timestamps and paths created in the system's $TEMP directory or PowerShell's execution context (e.g., Check for files created within a short timeframe after the command execution).

  - **Cross-reference URL reputation:** Use external threat intelligence sources to determine the reputation of the IP address or domain associated with the downloads. Check logs for requests making calls to known malicious indicators.

  - **Identify additional network activity:** Analyze network flow logs or proxy logs within the timeframe of the alarm to determine if outbound connections were made to the obfuscated IPs. Consider the timestamps of connection attempts for correlation with the command execution time.

  ### Prioritization

  This alert has medium severity due to the potential impact of downloading malicious software onto a system, particularly if the affected asset is a high-value target (e.g., domain controllers or administrative workstations). Given that obfuscated IP addresses are a red flag for C2 communication, there is a significant likelihood of malicious use in such activities.

  ### Blind Spots and Assumptions

  Detection limitations may arise from aggressive obfuscation techniques that evade simple pattern matching, which malicious actors often employ. Required log sources include comprehensive process creation logs and network monitoring for effective detection. Legitimate administrative activities (like system updates or software installations) could trigger this alert if they use similar commands. Companion detections, such as monitoring for the installation of newly created files in conjunction with this detection, could enhance investigative success.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
