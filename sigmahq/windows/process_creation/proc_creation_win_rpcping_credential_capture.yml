title: Capture Credentials with Rpcping.exe
id: 93671f99-04eb-4ab4-a161-70d446a84003
status: test
description: Detects using Rpcping.exe to send a RPC test connection to the 
  target server (-s) and force the NTLM hash to be sent in the process.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rpcping/
- https://twitter.com/vysecurity/status/974806438316072960
- https://twitter.com/vysecurity/status/873181705024266241
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/hh875578(v=ws.11)
author: Julia Fomina, oscd.community
date: 2020-10-09
modified: 2025-10-31
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_main_img:
  - Image|endswith: '\RpcPing.exe'
  - OriginalFileName: '\RpcPing.exe'
  selection_main_flag:
    CommandLine|contains|windash: '-s'
  selection_cli_ntlm:
    CommandLine|contains|windash: '-u'
    CommandLine|contains: 'NTLM'
  selection_cli_ncacn:
    CommandLine|contains|windash: '-t'
    CommandLine|contains: 'ncacn_np'
  condition: all of selection_main_* and 1 of selection_cli_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This rule detects the use of `Rpcping.exe` to send Remote Procedure Call (RPC) connection tests, specifically when the command line contains flags that may force the transmission of NTLM hashes. The likely attacker objective is to capture NTLM credentials by tricking a target server into revealing sensitive authentication information. This activity aligns with the MITRE ATT&CK technique "Credential Dumping" (T1003).

  Primary telemetry sources include process creation logs, specifically from Windows Event ID 4688 and Sysmon Event ID 1. The security impact can be significant; successfully capturing NTLM hashes may allow an adversary to authenticate as a user without their knowledge, leading to unauthorized access. Importantly, this detection alone does not confirm a successful compromise or that the NTLM credentials were effectively captured.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Event ID 4688 and Sysmon Event ID 1 for instances where `Rpcping.exe` is executed. Look for command line arguments including `-s`, `-u`, and 'NTLM'. Benign use may include legitimate system administrators performing network diagnostics.

  - **Analyze command line parameters:** Identify command line flags associated with the detected execution. Ensure that `-s` (which specifies the target server) is present alongside `-u` (user) and 'NTLM' to confirm the potential for credential capture.

  - **Correlate with network activity:** Investigate related network connections at the time of the process creation log. Use tools like NetFlow or firewall logs to detect outbound connections to unusual or unauthorized servers originating from the affected host.

  - **Assess affected assets:** Determine the role of the host where the alert triggered. If it is a critical server or a domain controller, escalate the investigation as this increases potential impact.

  - **Identify malicious indicators:** Look for repeated instances of `Rpcping.exe` with the specified parameters across multiple endpoints. A high confidence indicator would be multiple alerts stemming from the same source within a short time frame.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on credentials for critical systems. The likelihood of malicious use is moderate as `Rpcping.exe` is not a commonly used tool; however, if observed, it can indicate attempts to exploit authentication protocols, which are frequently targeted for credential theft.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not configured properly across all endpoints. Legitimate administrative activities may occur using `Rpcping.exe`, particularly in troubleshooting scenarios, which could trigger false positives. Additional detections, such as monitoring for unusual authentication attempts or abnormal NTLM logins (related to TLM), can strengthen overall coverage and context around this detection.

