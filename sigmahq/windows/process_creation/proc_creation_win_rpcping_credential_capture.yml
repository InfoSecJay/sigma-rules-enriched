title: Capture Credentials with Rpcping.exe
id: 93671f99-04eb-4ab4-a161-70d446a84003
status: test
description: Detects using Rpcping.exe to send a RPC test connection to the 
  target server (-s) and force the NTLM hash to be sent in the process.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rpcping/
- https://twitter.com/vysecurity/status/974806438316072960
- https://twitter.com/vysecurity/status/873181705024266241
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/hh875578(v=ws.11)
author: Julia Fomina, oscd.community
date: 2020-10-09
modified: 2026-10-31
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_main_img:
  - Image|endswith: '\RpcPing.exe'
  - OriginalFileName: 'RpcPing.exe'
  selection_main_flag:
    CommandLine|contains|windash: '-s'
  selection_cli_ntlm:
    CommandLine|contains|windash: '-u'
    CommandLine|contains: 'NTLM'
  selection_cli_ncacn:
    CommandLine|contains|windash: '-t'
    CommandLine|contains: 'ncacn_np'
  condition: all of selection_main_* and 1 of selection_cli_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This detection identifies the use of `Rpcping.exe` with specific flags that can be leveraged to force NTLM hashes to be transmitted during RPC test connections. The likely objective of an attacker using this tool is to capture NTLM credentials from a targeted entity, contributing to credential theft and lateral movement within the network. The relevant MITRE ATT&CK tactic is Credential Access (TA0006), specifically technique T1003: Credential Dumping.

  The primary telemetry source for this detection is Windows Process Creation logs, particularly focusing on Event ID 4688. If malicious, the impact could be significant, leading to unauthorized access or systems compromise. It is important to note that this detection does NOT, on its own, confirm that credential theft has occurred; it simply highlights potentially suspicious command-line activity.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for entries with `Image` ending in `\RpcPing.exe` and `CommandLine` containing `-s`. Identify the user context and system where this command was executed.

  - **Analyze the command line for malicious indicators:** Confirm the presence of flags `-u`, `NTLM`, `-t`, and `ncacn_np` in the command line. Instances of these flags appearing together could indicate an attempt to capture credentials.

  - **Identify normal workload behavior:** Assess if `Rpcping.exe` is associated with legitimate administrative tasks. Document expected command usage, such as checking RPC connectivity without the flags for credential capture.

  - **Correlate with account activity:** Validate user activity against corresponding Windows Event logs (e.g., Event ID 4624 for logon events) to determine if the user associated with the process had a legitimate need for RPC Testing.

  - **Examine network traffic:** If network logs are available, investigate communications resulting from the `Rpcping.exe` execution, especially any outbound traffic to unusual destinations or RPC-related communication.

  - **Assess host criticality:** Focus on alerts from high-value systems or accounts (e.g., domain controllers or accounts with elevated privileges) that could increase the risk of successful exploitation if targeted.

  ### Prioritization

  The alert is of medium severity due to the potential for significant impact on credentials if the action is malicious. Given that NTLM hash capture can facilitate lateral movement, the likelihood of abuse is moderate. This behavior is less commonly seen but can be weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative use of `Rpcping.exe`, which may trigger false alerts. Reliable detection requires proper logging configurations for process creation and should include a monitoring plan for RPC-related activities. Expected legitimate activities might involve routine RPC testing by system administrators. A related detection might include monitoring for unauthorized use of `Mimikatz` or other credential dumping tools that often follow a similar attack path.

