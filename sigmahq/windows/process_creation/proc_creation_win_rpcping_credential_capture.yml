title: Capture Credentials with Rpcping.exe
id: 93671f99-04eb-4ab4-a161-70d446a84003
status: test
description: Detects using Rpcping.exe to send a RPC test connection to the target
  server (-s) and force the NTLM hash to be sent in the process.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rpcping/
- https://twitter.com/vysecurity/status/974806438316072960
- https://twitter.com/vysecurity/status/873181705024266241
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/hh875578(v=ws.11)
author: Julia Fomina, oscd.community
date: 2020-10-09
modified: 2025-10-31
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_main_img:
  - Image|endswith: '\RpcPing.exe'
  - OriginalFileName: '\RpcPing.exe'
  selection_main_flag:
    CommandLine|contains|windash: '-s'
  selection_cli_ntlm:
    CommandLine|contains|windash: '-u'
    CommandLine|contains: 'NTLM'
  selection_cli_ncacn:
    CommandLine|contains|windash: '-t'
    CommandLine|contains: 'ncacn_np'
  condition: all of selection_main_* and 1 of selection_cli_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This rule detects the misuse of the `Rpcping.exe` utility, which is primarily used for testing Remote Procedure Call (RPC) connections. The detection logic focuses on instances where `Rpcping.exe` is invoked with specific flags that indicate the intention to initiate a connection while simultaneously transmitting NTLM hashes. This behavior is indicative of credential theft attempts, often performed by attackers seeking to capture sensitive authentication information for further lateral movement within a network.

  The likely threat actor behind such behavior is a credential-harvesting tool or a malicious insider exploiting administrative tools to leak usernames and their associated NTLM hashes. This method can facilitate unauthorized access to multiple services by masquerading as legitimate user credentials, ultimately posing a considerable risk to the enterprise environment.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Credential Access** (TA0006)
    - **Credential Dumping** (T1003)

  The primary data sources for detecting this behavior include process creation logs, which capture detailed information about executed processes, their command line arguments, and other relevant execution metadata.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze recent process creation events for instances of `Rpcping.exe`, paying attention to the command line arguments used. Focus on flags like `-s`, `-u`, and any indication of NTLM being involved.

  - **Cross-Reference User Activity**: Check the user accounts that invoked `Rpcping.exe`. Validate if these accounts traditionally utilize such tools or if their recent activity is unusual or suspicious.

  - **Analyze Network Traffic**: Investigate the network traffic to and from the server targeted by the RPC connection. Look for any anomalous patterns or unexpected connections that coincide with the execution of `Rpcping.exe`.

  - **Review Authentication Logs**: Examine authentication logs for any failed login attempts or anomalous login patterns that align with the time frame of the suspicious `Rpcping.exe` executions. Pay particular attention to NTLM-related failures or unexpected access requests.

  ### Prioritization
  This alert is of **medium severity** due to the potential impact of credential theft on an enterprise environment, which could lead to unauthorized access and lateral movement by attackers. While the likelihood of a legitimate use case exists, any unauthorized invocation should be treated seriously given the implications of NTLM credential exposure.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the limited visibility into environments where `Rpcping.exe` may be used legitimately without the associated risks. The detection logic assumes that any invocation of `Rpcping.exe` with the specified flags is malicious, which may not always hold true. Adequate logging of process creation and command line arguments is necessary for the alert to function effectively; missing logs or incorrect configurations (such as disabled command line logging) could hinder detection capabilities.

