title: Service StartupType Change Via PowerShell Set-Service
id: 62b20d44-1546-4e61-afce-8e175eb9473c
status: test
description: Detects the use of the PowerShell "Set-Service" cmdlet to change 
  the startup type of a service to "disabled" or "manual"
references:
- https://www.virustotal.com/gui/file/38283b775552da8981452941ea74191aa0d203edd3f61fb2dee7b0aea3514955
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-04
tags:
- attack.execution
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\powershell.exe'
  - OriginalFileName: 'PowerShell.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'Set-Service'
    - '-StartupType'
    CommandLine|contains:
    - 'Disabled'
    - 'Manual'
  condition: all of selection_*
falsepositives:
- False positives may occur with troubleshooting scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell `Set-Service` cmdlet to alter the startup type of Windows services, specifically setting them to "disabled" or "manual." Attackers may leverage this capability to impair the functionality of critical services, hindering security controls or operational processes. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Defense Evasion (T1203).

  The primary telemetry sources for this detection are Windows process creation logs, particularly Security Event ID 4688, and Sysmon Event ID 1, capturing detailed command-line activity. If malicious, the impact could be significant, resulting in the compromise of essential system functions and security measures. Note that this detection alone does not confirm malicious intent, as it may also be used in legitimate administrative contexts.

  ### Investigation Steps

  - **Review command-line arguments**: Check for instances of `Set-Service -StartupType Disabled` or `Set-Service -StartupType Manual` in Security Event ID 4688 or Sysmon Event ID 1. Identify if the `CommandLine` contains legitimate administrative functions or unusual entries.

  - **Check for associated parent processes**: Look for the parent process in Event ID 4688 records. A PowerShell process initiated by `explorer.exe` or `taskeng.exe` may indicate legitimate administration, while executions from `cmd.exe` or remote management tools could signal potential misuse.

  - **Confirm user context**: Validate the user account executing the command in Security Event ID 4624. Investigate whether the user has appropriate privileges. Unusual accounts lacking administrative roles executing this command may indicate malicious activity.

  - **Inspect service configuration changes**: Use PowerShell commands like `Get-Service` to confirm the current startup type of affected services. If critical services have been changed to "disabled" or "manual," escalate for further investigation on the implications.

  - **Review logs for frequency of execution**: Analyze the frequency of `Set-Service` commands in the logs. Repeated changes from the same user or system over a short period can highlight potential automation or script-based attacks.

  ### Prioritization

  The severity of this alert is medium. The impact can be high if critical services are disabled, leading to a loss of functionality or security. While not commonly weaponized, the ability to modify service startup types is a red flag that could indicate preparation for more extensive attacks.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative tasks resulting in false positives, particularly during system maintenance. The effectiveness of this detection relies on comprehensive logging of PowerShell activities, so ensure Sysmon is installed and correctly configured for robust coverage. Legitimate troubleshooting scripts may trigger alerts, necessitating contextual understanding by analysts. A related detection is monitoring for unusual PowerShell usage patterns, which can provide broader context for actions taken by the same user or system.

