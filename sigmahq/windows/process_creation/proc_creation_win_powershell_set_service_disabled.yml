title: Service StartupType Change Via PowerShell Set-Service
id: 62b20d44-1546-4e61-afce-8e175eb9473c
status: test
description: Detects the use of the PowerShell "Set-Service" cmdlet to change the
  startup type of a service to "disabled" or "manual"
references:
- https://www.virustotal.com/gui/file/38283b775552da8981452941ea74191aa0d203edd3f61fb2dee7b0aea3514955
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-04
tags:
- attack.execution
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\powershell.exe'
  - OriginalFileName: 'PowerShell.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'Set-Service'
    - '-StartupType'
    CommandLine|contains:
    - 'Disabled'
    - 'Manual'
  condition: all of selection_*
falsepositives:
- False positives may occur with troubleshooting scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies changes made to the startup type of Windows services through the use of the PowerShell `Set-Service` cmdlet. Specifically, it flags instances where the startup type is altered to either "disabled" or "manual". Attackers may manipulate service configurations to hinder detection by security tools or disrupt normal operations, reflecting their objective to maintain persistence and evade defenses.

  Relevant tactics from the MITRE ATT&CK framework include Execution (T1203) and Defense Evasion (T1562.001). An attacker using PowerShell to modify startup types is likely attempting to mask malicious services that could otherwise trigger alerts or impede access. The ability to disable services is critical, as it gives attackers greater control over the environment, potentially leading to further exploitation.

  Primary data sources valuable for gathering evidence include process creation events captured by EDR solutions, which log the execution of commands and command-line arguments. Monitoring Windows security event logs can also provide insights into service modifications, while PowerShell logs may reveal unusual patterns in administrative activity.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for PowerShell executions, especially those invoking `Set-Service`. Pay close attention to the command-line parameters and the context of execution (e.g., user accounts and times of execution).

  - **Analyze PowerShell Logs:** Check PowerShell operational logs for any commands that include `Set-Service` and note the changes to service startup types. Look for patterns of behavior that are unusual for the environment, especially based on user roles.

  - **Examine Service Configuration:** Conduct an audit of the services configured on the affected system. Verify the current startup types and cross-reference them with expected configurations, looking for discrepancies or unauthorized changes.

  - **Investigate User Account Activities:** Monitor the actions of the user account that executed the command. Ascertain if they have the necessary privileges to alter service configurations and investigate any other potentially malicious activities associated with that account.

  ### Prioritization
  This alert holds medium severity due to the potential impact of unauthorized service modifications, which can significantly affect system integrity and operational continuity. The likelihood of its occurrence is raised in environments where PowerShell is frequently used for legitimate administrative tasks, thus justifying the need for alerting on such changes.

  ### Blind Spots and Assumptions
  One gap in detection coverage surrounds the use of alternative scripting languages or tools that might be employed to modify service configurations without detection, such as direct API calls or other management frameworks. The detection logic assumes the presence of sufficient logging capabilities to capture PowerShell commands in their entirety. Without PowerShell logging enabled, or if logs are poorly retained, this alert may yield false negatives. Adequate configuration of logging settings on the monitored systems is crucial for the alert’s effectiveness.

