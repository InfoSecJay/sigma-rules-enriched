title: Service StartupType Change Via PowerShell Set-Service
id: 62b20d44-1546-4e61-afce-8e175eb9473c
status: test
description: Detects the use of the PowerShell "Set-Service" cmdlet to change 
  the startup type of a service to "disabled" or "manual"
references:
- https://www.virustotal.com/gui/file/38283b775552da8981452941ea74191aa0d203edd3f61fb2dee7b0aea3514955
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-04
tags:
- attack.execution
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\powershell.exe'
  - OriginalFileName: 'PowerShell.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'Set-Service'
    - '-StartupType'
    CommandLine|contains:
    - 'Disabled'
    - 'Manual'
  condition: all of selection_*
falsepositives:
- False positives may occur with troubleshooting scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of the PowerShell `Set-Service` cmdlet to change a Windows service's startup type to "disabled" or "manual." This modification may indicate that an attacker is attempting to hinder the functionality of essential services, possibly as part of lateral movement or to prepare the environment for malicious activities. The relevant MITRE ATT&CK techniques are Defense Evasion (T1562.001) and Execution, specifically the misuse of PowerShell for modifications to system service configurations.

  The primary telemetry source for this detection is process creation logs, specifically those generated by Windows Security Event ID 4688 or Sysmon Event ID 1. The security impact of malicious activity includes potential service disruption and a heightened risk of the adversary maintaining persistence in the environment. This detection alone does not confirm malicious intent; it may also be triggered by legitimate administrative actions.

  ### Investigation Steps

  - **Review recent PowerShell command activity:** Examine Security Event ID 4688 or Sysmon Event ID 1 for PowerShell executions within the time frame of the alert. Look for command lines containing `Set-Service -StartupType` followed by either `Disabled` or `Manual`.

  - **Verify service status changes:** Check the current and historical configurations of the affected service using `Get-Service` to ensure it reflects the changes noted in the alert. Confirm whether the service is critical for operations (e.g., Windows Update, Security services).

  - **Cross-reference with administrative logs:** Look into Windows Event ID 4682 (Service state changes) to identify if another user account with elevated privileges executed the command around the same time, which may indicate authorized administrative activity.

  - **Identify common legitimate usage:** Determine if the change was part of a known maintenance or troubleshooting script run by internal admins. Scripts should be evaluated for their history and justification.

  - **Assess installed software and scripts:** Inspect the file system and task scheduler for any suspicious scripts or executables containing embedded PowerShell commands resembling the detected activity. Look for evidence of lateral movement or persistence methods.

  - **Correlate with external threat intelligence:** Check any related hashes against threat intelligence platforms (e.g., VirusTotal) to identify known malicious artifacts that have invoked similar behaviors.

  ### Prioritization

  This alert has medium severity as it impacts potentially critical services and indicates possible abuse of administrative privileges. The likelihood of exploitation is significant, given that disabling services can lead to further compromise or initial access attempts. This behavior is known to be weaponized in various campaigns and should be prioritized accordingly.

  ### Blind Spots and Assumptions

  The detection may not capture all instances of legitimate service modifications, as routine administrative tasks can trigger the same alert. An adversary may also employ obfuscation techniques to mask the PowerShell command or invoke commands indirectly, evading detection. Reliable coverage requires monitoring of Event ID 4688 and Sysmon logs; companion detections include alerts for unusual service state changes (Event ID 4682) to identify subsequent service manipulations.

