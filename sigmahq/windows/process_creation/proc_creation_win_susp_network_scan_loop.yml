detection:
  selection_loop:
    CommandLine|contains:
    - 'for '
    - 'foreach '
  selection_tools:
    CommandLine|contains:
    - 'nslookup'
    - 'ping'
  condition: all of selection_*
falsepositives:
- Legitimate script
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious scan loops on a network, which are indicative of reconnaissance activities often performed by adversaries. When an attacker gains access to a host, they may initiate a series of commands designed to enumerate other devices on the network. This behavior aids lateral movement strategy by identifying potential targets based on their IP addresses or hostnames.

  The likely attacker objectives include gathering information about the network environment, mapping out the devices connected, and assessing potential vulnerabilities for further exploitation. The detected command patterns (e.g., using "for" or "foreach" in conjunction with scanning tools like `nslookup` or `ping`) suggest that an adversary is automating the enumeration process to gather intelligence on targets.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Discovery (TA0007)**: General category for techniques that gather information about system and network structures.
  - **Network Service Scanning (T1018)**: Specifically focuses on techniques used to discover services and devices on a network.
  - **Command and Scripting Interpreter (T1059)**: This includes the execution of commands via script-based interfaces.

  The primary data sources that will provide the best evidence for this detection are **process creation logs** from Windows systems, which capture command-line executions that can reveal the presence of these potentially malicious patterns.

  ### Investigation Steps
  - **Review Process Creation Logs**: Start by collecting and analyzing recent process creation events, focusing on command lines that include "for", "foreach", or known scanning tools like `nslookup` and `ping`.
  - **Identify Anomalous Patterns**: Look for unusual or repetitive execution patterns involving these command line strings that deviate from normal operational behavior within the environment.
  - **Correlate with User Activity**: Cross-reference the identified processes with user accounts and scheduled tasks to determine if the commands were executed by legitimate users or automated scripts that may require further scrutiny.
  - **Assess Network Traffic**: Complement your review by analyzing corresponding network traffic for excessive queries or unreachable host logs that align with the timing of the suspicious process activity.

  ### Prioritization
  This alert is prioritized as medium severity due to the potential for network reconnaissance being a precursor to significant lateral movement or data theft. While the activity does not imply immediate compromise, it indicates that an attacker may be actively preparing for deeper infiltration.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage since legitimate administrative scripts may also utilize similar looping constructs without any malicious intent. The detection logic assumes that any command execution involving "for" or "foreach" alongside scanning tools is suspicious, which could yield false positives. Required configurations include ensuring that process creation logging is enabled on all Windows endpoints to accurately capture the relevant artifacts necessary for this detection to function effectively.

