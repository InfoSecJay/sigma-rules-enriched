note: |
  ### Technical Context

  This rule detects command-line activities where scripts or commands are executed to list or scan network resources using loops (e.g., 'for' or 'foreach') in combination with network commands like 'nslookup' or 'ping.' The likely attacker objective is to identify other systems on the network, which may facilitate lateral movement or further reconnaissance. The relevant MITRE ATT&CK tactics include Discovery (TA0007) and Lateral Movement (TA0008), with techniques T1018 (Remote System Discovery) and T1059 (Command and Scripting Interpreter).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which record command-line activities. If this behavior is malicious, it can lead to unauthorized access to other systems, potentially compromising sensitive data or services. However, this detection does NOT confirm malicious behavior on its own, as it can also appear in benign administrative or operational tasks.

  ### Investigation Steps

  - **Identify the executing process**: Check Security Event ID 4688 or Sysmon Event ID 1 for the parent process to understand the context. Look for processes running common administrative tools (e.g., PowerShell, cmd.exe) to distinguish between legitimate and malicious intent.

  - **Review command-line parameters**: Analyze the CommandLine field in logs to confirm the presence of suspicious patterns like 'for' or 'foreach' combined with 'nslookup' or 'ping.' Malicious examples may include multiple simultaneous calls to IP addresses or unknown hosts.

  - **Assess timing and frequency**: Evaluate the timestamps and frequency of the command executions. Frequent execution of the same commands against a wide range of IP addresses over a short duration indicates potential reconnaissance rather than normal operations.

  - **Cross-reference with network traffic**: Examine network logs (e.g., firewall logs, DNS queries) for corresponding traffic generated by the suspect commands. Look for anomalous outgoing DNS requests or high volumes of ICMP traffic to discover possible scanning activity.

  - **Benchmark against known legitimate activity**: Compare logs with typical operational behaviors of network administrators, who may also use scripts to check system status or connectivity, ensuring the commands fall within an expected operational timeframe and target ranges.

  - **Check for high-confidence malicious indicators**: Look for indicators such as the execution of obfuscated or encoded PowerShell commands that initiate a scan for connected resources, often characterized by unusual network activity or indicators of lateral movement.

  ### Prioritization

  The severity of this alert is medium, as the affected system may play a significant role in the network and the likelihood of lateral movement is plausible. Active network scanning can indicate reconnaissance typically used in preliminary stages of an attack, making it a notable risk, even if the behavior itself is not definitively malicious.

  ### Blind Spots and Assumptions

  Detection can be limited by the log collection configuration; if Sysmon is not implemented or properly configured, relevant process creation events may not be captured. Legitimate administrative tasks can inadvertently trigger this alert, particularly during network assessments or maintenance. A related detection that strengthens coverage is monitoring for unusual incoming connections from new or unexpected hosts, which could indicate lateral movement attempts following the initial scan.

