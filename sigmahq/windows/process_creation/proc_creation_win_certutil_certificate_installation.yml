note: |
  ### Technical Context

  This Sigma rule detects the execution of `certutil.exe` with the `-addstore` flag, where a new root certificate is added to the certificate store on a Windows system. This behavior is often leveraged by attackers to install rogue root certificates, enabling man-in-the-middle (MitM) attacks by suppressing warnings when connecting to malicious servers. The relevant MITRE ATT&CK technique is **Install Root Certificate** (T1553.004). The primary telemetry source is Windows process creation logs, specifically looking for events related to `certutil` execution (Event ID 4688). If malicious, this behavior allows an attacker to intercept encrypted communications. Importantly, this detection does NOT confirm actual malicious intent; legitimate IT operations may trigger similar behavior.

  ### Investigation Steps

  - **Analyze Process Execution Logs:** Review Security Event ID 4688 to confirm the execution of `certutil.exe`. Look for command lines containing `-addstore` and `root` to indicate a new root certificate being installed.

  - **Identify Legitimate Use Cases:** Document instances where IT or Help Desk services might legitimately invoke `certutil` to add corporate root certificates, ensuring to validate if these actions were conducted under normal operating procedures.

  - **Examine Certificates Installed:** Use Event ID 4719 (System Audit Policy Change) or check the certificate store, specifically computing the `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CAs` registry path to find any unauthorized or unexpected root certificates, especially those installed shortly after the detected event.

  - **Review for Suspicious Command Line Arguments:** Look for command lines executed with `certutil` that include unusual switches or file paths, as malicious activities may utilize atypical command constructions.

  - **Correlate Other Security Events:** Investigate related security events that may indicate weaponization of the installed root certificate, such as outbound traffic to known malicious IPs or domain names, and check for suspicious DNS resolutions (Event ID  DNS 5156).

  ### Prioritization

  This alert is medium severity due to the potential impact of a compromised system on network security. The installation of rogue root certificates poses a significant risk, as it can facilitate further exploitation and data exfiltration. While this behavior is not extremely common, it can be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Legitimate system administration tasks can trigger this alert, especially when managing corporate certificates via GPOs or Help Desk support. Detection is limited if certain logging configurations (like PowerShell command logging) are not enabled, as attackers may employ obfuscation techniques to avoid detection. A related detection rule could include monitoring specific certificates being utilized in network traffic or HTTP requests to identify abnormal communications post-installation.

