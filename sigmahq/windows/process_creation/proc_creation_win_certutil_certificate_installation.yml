note: |
  ### Technical Context
  This detection rule identifies the execution of `certutil.exe` with the `-addstore` flag, which is typically used to install a new root certificate on a Windows system. The ability to install a root certificate can be exploited by attackers to add their own certificate to the trusted root certificate store. This allows them to perform man-in-the-middle (MitM) attacks, intercepting and decrypting encrypted communications between the compromised system and external services without triggering typical security warnings. This behavior may indicate an attacker’s aim to maintain persistence or to facilitate data exfiltration by disguising their malicious traffic.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion** (TA0005)
  - **Application Layer Protocol** (T1071)
  - **Install Root Certificates** (T1553.004)

  Primary data sources for detecting this activity include process creation logs, which provide insights into executed commands and their parameters, and system event logs that track changes to certificate stores.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect logs related to `certutil.exe` execution, focusing on any instances where `-addstore` and `root` appear in the command line arguments.
  - **Analyze System Event Logs:** Check for changes in the certificate store, specifically looking for modifications that indicate a new root certificate has been installed.
  - **Investigate Network Connections:** Examine outbound connections from the affected system to identify any unexpected or suspicious server communications that may involve the installed malicious certificate.
  - **Evaluate Previous User Actions:** Cross-reference the time of the `certutil.exe` execution with other user activity logs to determine if there are any suspicious logins or activities leading up to the event.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of an attacker installing a root certificate, which can facilitate unauthorized access and data interception. The likelihood of this event occurring is moderately high in environments where users have administrative privileges or where security controls are lax.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where logging of process creation events is not enabled or where users frequently require certificates to be installed legitimately, such as in IT-managed deployments. The detection logic assumes that every instance of `certutil.exe` with certain command-line arguments is malicious, potentially leading to false positives in cases where help desk or IT personnel are performing routine tasks. Effective detection requires that process creation logging is consistently enabled across systems.

