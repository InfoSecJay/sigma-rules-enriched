note: |
  ### Technical Context

  This rule detects the execution of `certutil` with the `-addstore` command line argument, indicative of the installation of a new root certificate on a Windows system. Attackers may aim to facilitate man-in-the-middle (MitM) attacks by installing trusted certificates that enable them to intercept or alter encrypted communications without triggering security warnings.

  This activity aligns with the MITRE ATT&CK technique T1553.004 (Root Certificate Installation). Primary telemetry sources include process creation logs (e.g., Security Event ID 4688) and Sysmon Event ID 1 that capture command-line arguments and process metadata. If malicious, the impact is significant, as it could compromise encrypted communications, leading to data theft or further system exploitation. Importantly, this detection does not confirm that malicious activity is occurring; it merely highlights that a root certificate has been added.

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 (or Sysmon Event ID 1) related to `certutil.exe`. Look for command line arguments containing `-addstore` and `root`. Ensure the process was executed by an authorized user.

  - **Identify legitimate use cases:** Confirm if the root certificate addition was performed by Help Desk or IT personnel as part of a corporate update. Look for related process execution closely timed with known IT tasks, such as group policy updates.

  - **Check certificate details:** Validate the installed root certificate against your organization's approved CA list. Review the certificate's issuer, expiration date, and associated key usage fields in Certificate Store (e.g., using `certmgr.msc`).

  - **Look for suspicious command patterns:** Search for any instances of `certutil.exe` that include unusual switches or arguments not typical in standard operations (e.g., references to unrecognized or suspicious domains).

  - **Monitor for lateral movement indicators:** Investigate for additional suspicious activity on the system after `certutil` execution, such as unusual outbound connections or changes to browser behavior, focusing on HTTP/HTTPS logs.

  - **Correlation with other alerts:** Examine logs for other alerts (e.g., from EDR solutions) that may indicate suspicious activity coinciding with the certificate installation, creating a comprehensive view of potential malicious actions.

  ### Prioritization

  This alert has medium severity due to the potential compromise of the system's trusted certificate store. The execution of `certutil -addstore` could lead to serious security incidents if exploited for MitM attacks. While not all uses are malicious, it is a known technique employed by attackers, warranting priority investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of `certutil` for corporate certificate management, potentially causing false positives. Ensure that logs for process creation and execution are reliably collected and monitored. Additionally, be aware that direct system administration, such as IT adding valid corporate certificates, could trigger this alert. A companion detection for unauthorized outbound network connections can strengthen defense against potential MitM exploitation.

