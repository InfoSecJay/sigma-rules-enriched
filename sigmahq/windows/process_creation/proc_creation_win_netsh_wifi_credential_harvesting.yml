note: |
  ### Technical Context

  This Sigma rule detects the use of the `netsh.exe` command-line tool to harvest Wi-Fi credentials from a Windows system. The likely attacker objective is to extract stored Wi-Fi credentials to facilitate lateral movement or establish connectivity to trusted networks for unauthorized access. This behavior aligns with the MITRE ATT&CK framework under the tactic of Credential Access (ID: T1040). The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1 for the execution of `netsh.exe`. If malicious, this could enable an attacker to move laterally within the network or establish footholds in trusted environments. This detection does NOT confirm that the credentials were successfully harvested or that they are exploitable.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where `netsh.exe` was executed, noting the corresponding user account, timestamp, and the parent process ID.

  - **Analyze command line arguments:** Inspect the `CommandLine` field associated with the `netsh.exe` process creation to confirm the presence of parameters such as `wlan`, `s`, `p`, and `k=`. Malicious command lines typically include `=clear`, indicating an attempt to extract stored credentials.

  - **Review contextual behavior:** Identify whether legitimate users (e.g., IT personnel) executed `netsh.exe` for appropriate tasks, such as troubleshooting network connections. Legitimate use may not include the aforementioned command-line parameters and could involve different commands like `wlan show profiles`.

  - **Correlate user accounts:** Look for unusual patterns such as `netsh.exe` execution by non-administrator accounts or accounts that do not typically manage network settings, which can indicate potential malicious activity.

  - **Validate related network logs:** Cross-reference with network logs to see if there have been subsequent connections to unauthorized or unusual networks after the execution of the command. This can indicate an attacker using stolen credentials.

  ### Prioritization

  This alert is medium severity due to the potential security impact on sensitive systems connected to compromised Wi-Fi networks. Given that the harvesting of credentials is a known tactic used in more extensive lateral movement attacks, the likelihood of malicious abuse is significantly increased, particularly in environments where sensitive data is transmitted over wireless connections.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if `netsh.exe` execution is not logged thoroughly or if logging is misconfigured, potentially allowing an adversary to evade detection. Legitimate activities, such as network troubleshooting by administrators, can also trigger this alert. A related detection that could enhance coverage includes monitoring for subsequent use of compromised credentials for access attempts on network resources.

