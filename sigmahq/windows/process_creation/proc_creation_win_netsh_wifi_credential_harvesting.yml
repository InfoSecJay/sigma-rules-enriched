detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'wlan'
    - ' s'
    - ' p'
    - ' k'
    - '=clear'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the Windows utility `netsh.exe` to harvest Wi-Fi credentials, a behavior frequently associated with malicious software such as variants of Agent Tesla, which is known to steal sensitive information. Attackers leveraging `netsh.exe` may aim to exfiltrate stored Wi-Fi passwords or analyze network configurations to facilitate further attacks within a corporate environment. The use of such utilities might indicate reconnaissance efforts or an attempt to create a foothold for lateral movement.

  The relevant MITRE ATT&CK tactics involved in this activity are:
  - **Discovery (T1087)**: Gaining information about the network and its assets, including Wi-Fi configurations.
  - **Credential Access (T1040)**: Specifically targeting stored credentials, such as Wi-Fi passwords, to gain unauthorized access to systems.

  The primary data sources for honing in on this activity include **process creation events**, which log the execution of applications like `netsh.exe`, and **command-line arguments**, which reveal the specific commands used during execution that might indicate malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs for instances of `netsh.exe`. Pay attention to the parent processes and any unexpected execution paths that could indicate malicious use.
  - **Analyze Command-Line Arguments**: Examine the command-line arguments associated with the execution of `netsh.exe`. Look specifically for the presence of "wlan", "s", "p", and "k=clear" to confirm that the tool is being used to harvest Wi-Fi credentials.
  - **Correlate with User Context**: Verify the user account that executed the command. Identify if the action was performed by an authorized administrator or if it seems anomalous compared to typical user activity.
  - **Investigate Network Connections**: Check for any unusual outbound connections following the execution of `netsh.exe`, which may indicate that stolen credentials are being exfiltrated or used to connect to unauthorized networks.

  ### Prioritization
  This alert is of medium severity within an enterprise environment due to the potential risk of sensitive Wi-Fi credentials being compromised, which could lead to unauthorized access to internal networks, facilitating further attacks.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage could arise from the use of privileged accounts or if attackers execute `netsh.exe` through obfuscation techniques to hide their activity. The detection logic assumes that `netsh.exe` is being executed in a standard manner, and may not account for alternate methods of credential extraction. Required log sources include detailed process creation events, which must be enabled and configured to capture command-line arguments for full visibility into potentially malicious use of `netsh.exe`.

