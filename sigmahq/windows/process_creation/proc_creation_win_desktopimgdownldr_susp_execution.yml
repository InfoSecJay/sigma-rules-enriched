title: Suspicious Desktopimgdownldr Command
id: bb58aa4a-b80b-415a-a2c0-2f65a4c81009
status: test
description: Detects a suspicious Microsoft desktopimgdownldr execution with 
  parameters used to download files from the Internet
references:
- https://labs.sentinelone.com/living-off-windows-land-a-new-native-file-downldr/
- https://twitter.com/SBousseaden/status/1278977301745741825
author: Florian Roth (Nextron Systems)
date: 2020-07-03
modified: 2021-11-27
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains: ' /lockscreenurl:'
  selection1_filter:
    CommandLine|contains:
    - '.jpg'
    - '.jpeg'
    - '.png'
  selection_reg:
    CommandLine|contains|all:
    - 'reg delete'
    - '\PersonalizationCSP'
  condition: ( selection1 and not selection1_filter ) or selection_reg
falsepositives:
- False positives depend on scripts and administrative tools used in the 
  monitored environment
level: high
note: |
  ### Technical Context

  This rule detects the execution of the Microsoft `desktopimgdownldr` command, which is used to download images from the Internet. The behavior indicates a potential attempt by an adversary to leverage native Windows tools for command-and-control, potentially to establish persistence or to download additional payloads. This aligns with the MITRE ATT&CK technique for Command and Control (T1105 - Ingress Tool Transfer).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1, focusing on command line arguments that contain suspicious parameters. If malicious, the impact could be significant as it may allow unauthorized data retrieval or facilitate further exploitation. This detection does NOT confirm intent or indicate compromised systems on its own; legitimate administrative tasks could invoke similar behavior.

  ### Investigation Steps

  - **Investigate process details: **Check Windows Security Event ID 4688 for the `desktopimgdownldr.exe` process. Look at the parent process and user context to validate if it was executed by a legitimate process such as `explorer.exe` or an unauthorized entity.

  - **Examine command line arguments: **Review Sysmon Event ID 1 for specific command line arguments containing '/lockscreenurl:' along with file extensions '.jpg', '.jpeg', or '.png’ to identify potential malicious use cases.

  - **Compare against legitimate usage: **Determine if there are legitimate use cases for `desktopimgdownldr` in your environment, such as system configurations or admin scripts that adjust lock screen images, which would involve similar command arguments without suspicious payloads.

  - **Correlate with registry edits: **Analyze for Registry edits using Windows Event Log (Event ID 4657) for entries that indicate suspicious ‘reg delete’ actions referencing '\PersonalizationCSP', which typically indicate an attempt to manipulate system settings.

  - **Monitor for network connections: **Check for outbound connections to unusual IP addresses or domains associated with the command execution timestamps, referencing Windows Firewall logs (Event ID 5156) and DNS query logs.

  - **Review user behavior: **Assess user activities leading to the command execution by correlating recent logons and actions, ensuring the context is part of their regular responsibilities to detect potential account compromise.

  ### Prioritization

  The alert should be considered high priority due to the potential impact on the system if an adversary is able to execute code or download unwanted files. The likelihood of such native tools being weaponized is significant, especially as they blend seamlessly into normal operations and bypass traditional detection mechanisms.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate administrative scripts or tools frequently utilize similar command structures. Reliably configuring monitoring for process creation and command-line arguments is essential. Legitimate corporate wallpaper updates or image downloads may also trigger this alert. A companion detection to consider is monitoring for known malicious IP addresses or domains during temporal associations with this behavior to strengthen detection capabilities.

