title: Suspicious Desktopimgdownldr Command
id: bb58aa4a-b80b-415a-a2c0-2f65a4c81009
status: test
description: Detects a suspicious Microsoft desktopimgdownldr execution with parameters
  used to download files from the Internet
references:
- https://labs.sentinelone.com/living-off-windows-land-a-new-native-file-downldr/
- https://twitter.com/SBousseaden/status/1278977301745741825
author: Florian Roth (Nextron Systems)
date: 2020-07-03
modified: 2021-11-27
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains: ' /lockscreenurl:'
  selection1_filter:
    CommandLine|contains:
    - '.jpg'
    - '.jpeg'
    - '.png'
  selection_reg:
    CommandLine|contains|all:
    - 'reg delete'
    - '\PersonalizationCSP'
  condition: ( selection1 and not selection1_filter ) or selection_reg
falsepositives:
- False positives depend on scripts and administrative tools used in the monitored
  environment
level: high
note: |
  ### Technical Context
  This detection rule identifies the suspicious use of the `desktopimgdownldr` command in Windows, which is known for downloading files from the internet and is often exploited by attackers to persist malicious payloads or exfiltrate data. By analyzing the command line arguments, the rule can uncover attempts to leverage this legitimate Windows tool for unauthorized purposes. Such behavior typically aligns with advanced persistent threats (APTs) or cybercriminals aiming for stealthy data retrieval, making it critical to monitor for these activities.

  The suspected threat scenario involves an attacker utilizing the `desktopimgdownldr` tool either to download images for a malicious purpose or to execute further payloads. The attacker may aim to establish persistence on the target machine or exfiltrate sensitive information under the guise of legitimate file activity. Relevant MITRE ATT&CK tactics and techniques include **Command and Control (T1071)**, which pertains to application layer protocols used for communication with the attacker, and **Exfiltration Over Command and Control Channel (T1041)**, which refers to the act of sending data out through such channels.

  Primary data sources that contain vital evidence for this detection include process creation logs that capture the command lines executed on endpoints, as well as security logs related to file downloads that could indicate unauthorized or suspicious file retrieval.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for instances of `desktopimgdownldr` execution, paying special attention to the full command line used and any associated processes that may indicate malicious intent.
  - **Analyze Network Traffic:** Monitor outbound traffic for connections to suspicious IP addresses or domains that coincide with the timeline of the `desktopimgdownldr` command execution, especially those making requests for image file types (e.g., `.jpg`, `.jpeg`, `.png`).
  - **Check File Download Activity:** Investigate any recent downloads and their sources linked with executed commands, ensuring that all retrieved files align with expected business operations and do not coincide with unusual behavior.
  - **Correlate with EDR Alerts:** Cross-reference any alerts from EDR solutions that may provide insight into subsequent actions taken by the system after the execution of the `desktopimgdownldr` command, including any modifications to system settings or registry entries.

  ### Prioritization
  This alert is prioritized as high due to the potential for data exfiltration or persistence mechanisms being employed by an attacker. Actions triggered by legitimate tools can often be indicative of significant threats, particularly in environments where sensitive data is managed.

  ### Blind Spots and Assumptions
  Detection may miss legitimate administrative uses of `desktopimgdownldr`, especially in environments where this tool is commonly used for file management tasks. The logic assumes that any command containing `/lockscreenurl:` and subsequent file types indicates malicious activity unless filtered correctly. Additionally, proper logging configurations must be enabled on Windows endpoints to capture detailed command line arguments necessary for this detection to function effectively.

