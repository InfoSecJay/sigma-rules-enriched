title: Webshell Tool Reconnaissance Activity
id: f64e5c19-879c-4bae-b471-6d84c8339677
status: test
description: |
  Detects processes spawned from web servers (PHP, Tomcat, IIS, etc.) that perform reconnaissance looking for the existence of popular scripting tools (perl, python, wget) on the system via the help commands
references:
- https://ragged-lab.blogspot.com/2020/07/webshells-automating-reconnaissance.html
author: Cian Heasley, Florian Roth (Nextron Systems)
date: 2020-07-22
modified: 2023-11-09
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - '\caddy.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\w3wp.exe'
    - '\ws_tomcatservice.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    CommandLine|contains:
    - 'CATALINA_HOME'
    - 'catalina.jar'
  selection_recon:
    CommandLine|contains:
    - 'perl --help'
    - 'perl -h'
    - 'python --help'
    - 'python -h'
    - 'python3 --help'
    - 'python3 -h'
    - 'wget --help'
  condition: 1 of selection_webserver_* and selection_recon
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential webshell reconnaissance activities by examining process creation events on web servers such as Apache, Nginx, Tomcat, and PHP-based services. Specifically, it focuses on instances where these servers spawn processes that query for the existence of scripting tools like Perl, Python, and Wget using help commands. The primary concern is that an attacker could use these commands to ascertain whether their desired tools for further exploitation are present on the server before deploying malicious scripts.

  The likely attacker objective in this scenario is to prepare an environment in which they can execute additional malicious actions, often tied to the exploitation of web applications. The reconnaissance phase is critical, as attackers typically gather information to facilitate persistence and lateral movement within the network. This activity aligns with the MITRE ATT&CK framework, notably under the tactics of **Persistence** and techniques such as **T1505.003 - Web Shell**, which highlights the use of web-based remote access.

  Primary data sources include process creation logs from Windows operating systems and detailed command line invocation logs. Collecting data from these sources will aid in the identification of anomalous scripts being executed that could indicate malicious reconnaissance on target systems.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events on web servers for instances where unexpected processes are spawned from canonical web server services (e.g., Caddy, Nginx, Tomcat). Check for unusual parent-child relationships and command line arguments.

  - **Scrutinize Command Line Arguments:** Focus on command lines that contain help queries for Perl, Python, and Wget. This can provide insight into whether an attacker is trying to assess available tools on the system post-access.

  - **Cross-Reference with Web Server Logs:** Look at access logs on the respective web infrastructure (e.g., IIS, Apache) to correlate any web traffic patterns with the time frame of the detected suspicious process creations. Identify any potential exploit attempts or reconnaissance.

  - **Inspect Configuration Management:** Ensure that script execution permissions and configurations on web servers follow security best practices. Look for deviations in configurations that would allow for unauthorized scripts or commands.

  ### Prioritization
  This alert should be regarded as high severity due to the elevated risk associated with malicious webshell deployments. The likelihood of successful exploitation exponentially increases if attackers are conducting reconnaissance to prepare a favorable environment for their malicious activities.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on specific processes and command line structures, which may not account for variations in legitimate administrative tasks or custom web server configurations. Additionally, the detection logic assumes that reconnaissance will always be initiated in this predictable manner. The alert will only function effectively if process creation logging is adequately configured across all relevant web servers, and if command line logging is enabled to capture the execution context of processes accurately.

