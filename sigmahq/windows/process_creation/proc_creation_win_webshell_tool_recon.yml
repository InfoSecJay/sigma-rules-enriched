title: Webshell Tool Reconnaissance Activity
id: f64e5c19-879c-4bae-b471-6d84c8339677
status: test
description: |
  Detects processes spawned from web servers (PHP, Tomcat, IIS, etc.) that perform reconnaissance looking for the existence of popular scripting tools (perl, python, wget) on the system via the help commands
references:
- https://ragged-lab.blogspot.com/2020/07/webshells-automating-reconnaissance.html
author: Cian Heasley, Florian Roth (Nextron Systems)
date: 2020-07-22
modified: 2023-11-09
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - '\caddy.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\w3wp.exe'
    - '\ws_tomcatservice.exe'
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    ParentImage|contains:
    - '-tomcat-'
    - '\tomcat'
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - '\java.exe'
    - '\javaw.exe'
    CommandLine|contains:
    - 'CATALINA_HOME'
    - 'catalina.jar'
  selection_recon:
    CommandLine|contains:
    - 'perl --help'
    - 'perl -h'
    - 'python --help'
    - 'python -h'
    - 'python3 --help'
    - 'python3 -h'
    - 'wget --help'
  condition: 1 of selection_webserver_* and selection_recon
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where processes spawned from web server applications (such as IIS, Apache, or Tomcat) execute reconnaissance commands to query for the existence of scripting tools like Perl, Python, or Wget. This behavior is indicative of an attacker’s objective to identify available tools that can be leveraged for further compromise, potentially leading to persistence or privilege escalation on a compromised system. The relevant MITRE ATT&CK tactic is “Persistence” (TA0003) with a specific technique of “Web Shell” (T1505.003).

  The primary telemetry sources include process creation events from Windows systems, specifically monitoring Event ID 4688 or Sysmon Event ID 1 logs for command line arguments and parent process relationships. If successful, the compromise may lead to a full system compromise, lateral movement, or data exfiltration. Importantly, this detection does NOT confirm that an actual compromise has occurred—only that reconnaissance attempts were made from a web server context.

  ### Investigation Steps

  - **Identify the parent process: ** Review the Event ID 4688 logs for the format `ParentImage` containing known web server process names such as `w3wp.exe` or `nginx.exe`. This helps establish the context of execution.

  - **Check command line parameters: ** Look for command lines containing `perl --help`, `python --help`, or `wget --help` in Event ID 4688. These specific parameters indicate attempts at reconnaissance indicative of malicious intent.

  - **Assess legitimate operational behavior: ** Validate whether the detected processes typically run legitimate scripts or commands during normal operations. For instance, if the python commands are part of a scheduled task that performs regular logging, this may suggest benign activity.

  - **Correlate with recent changes: ** Investigate any recent updates or changes to web applications associated with the affected server that might explain the triggering of this rule as a routine administrative action.

  - **Evaluate asset criticality: ** Determine the criticality of the affected server within the environment. Web servers often have significant exposure and impact; thus, further investigation is paramount.

  - **Look for related artifacts: ** Validate if any files corresponding to script or tool installations (e.g., `perl.exe`, `python.exe`) were created or modified in the last 24 hours. This can indicate either legitimate activity or malicious setup.

  ### Prioritization

  The alert is of **high severity** due to the potential impact of a web server being exploited as a foothold into the environment. Given the likelihood of malicious use of scripting tools, this activity should be prioritized for immediate investigation. The behaviors detected are commonly utilized by attackers as part of their initial reconnaissance phase in a targeted attack.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who might disguise their reconnaissance or execute it via indirect methods that do not involve direct command-line execution. Additionally, if logging levels are inadequate or if necessary telemetry is not collected from web servers, alerts may be missed. Legitimate administrative scripts could unintentionally trigger this alert, such as system maintenance routines that use similar commands. A related detection to enhance coverage would be monitoring web server logs for unusual access patterns indicative of automated scripts attempting exploitation (e.g., repeated access attempts with rare user agents).

