detection:
  selection_img:
    Image|endswith:
    - '\squirrel.exe'
    - '\update.exe'
  selection_download_cli:
    CommandLine|contains:
    - ' --download '
    - ' --update '
    - ' --updateRollback='
  selection_download_http_keyword:
