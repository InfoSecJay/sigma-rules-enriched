note: |
  ### Technical Context
  This detection rule identifies the usage of `Squirrel.exe`, an executable commonly found in Electron-based applications like Slack, Teams, and Discord, to download arbitrary files from the internet. Attackers may leverage `Squirrel.exe` to execute malicious downloads under the guise of legitimate application updates, facilitating unauthorized access to the environment or malware deployment. Given its potential for abuse, it is important to monitor this behavior closely.

  The relevant MITRE ATT&CK tactics for this rule include:
  - **Execution (TA0002)**: The attacker executes code on the target system.
  - **Defense Evasion (TA0005)**: The use of legitimate binaries to bypass security controls.
  - **Command and Control (TA0011)**: Downloading files may indicate an attempt to establish or maintain command and control with external threats.

  The primary data sources for detecting this activity are process creation logs from Windows. These logs provide visibility into commands executed on the system, enabling identification of the specific usage patterns and associated binaries.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the process creation logs for instances of `Squirrel.exe` with command lines containing `--download`, `--update`, or `http`. This can help identify suspicious execution patterns.

  - **Examine Network Traffic**: Inspect the outbound network traffic during the time `Squirrel.exe` was executed. Look for connections to unusual or unrecognized domains that may indicate a malicious download.

  - **Check Installed Applications**: Verify the legitimate applications installed on systems that triggered the alert. Identify any Electron-based applications to determine if the behavior is expected or potentially malicious.

  - **Analyze System Artifacts**: Collect and analyze relevant artifacts, such as logs generated by antivirus or endpoint detection and response (EDR) solutions, which may provide additional context around the execution of `Squirrel.exe` and any downloaded files.

  ### Prioritization
  This alert has a medium severity rating due to the potential for exploitation through arbitrary file downloads. While the behavior may be legitimate in some contexts, the use of `Squirrel.exe` for downloads poses a risk that could be leveraged by an attacker to introduce malware or exfiltrate data.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to benign usage of `Squirrel.exe` in environments where Electron applications are frequently installed. The detection logic assumes that any usage of `Squirrel.exe` for file downloads is suspicious, which may not always be accurate given legitimate applications. For the alert to function effectively, it requires comprehensive process creation logs to be collected and analyzed. Any misconfigurations in logging settings could hinder detection capabilities.

