title: Suspicious Schtasks Execution AppData Folder
id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
status: test
description: 'Detects the creation of a schtask that executes a file from C:\Users\<USER>\AppData\Local'
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: pH-T (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-03-15
modified: 2022-07-28
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - '/Create'
    - '/RU'
    - '/TR'
    - 'C:\Users\'
    - '\AppData\Local\'
    CommandLine|contains:
    - 'NT AUT'         # This covers the usual NT AUTHORITY\SYSTEM
    - ' SYSTEM '         # SYSTEM is a valid value for schtasks hence it gets it's own value with space
  filter:
        # FP from test set in SIGMA
    ParentImage|contains|all:
    - '\AppData\Local\Temp\'
    - 'TeamViewer_.exe'
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/TN TVInstallRestore'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `schtasks.exe` command, specifically when it creates a scheduled task that runs a file located in a user's AppData Local directory. This behavior is often indicative of an attacker attempting to establish persistence on a compromised system, executing malicious payloads from a location that is typically overlooked during security audits. The relevant MITRE ATT&CK technique is "Scheduled Task/Job" (T1053.005) combined with "Command and Scripting Interpreter" (T1059.001).

  The primary telemetry source for this detection is Windows process creation logs, particularly from Event ID 4688 that captures detailed command-line information. If malicious, successful execution could lead to unauthorized access or data exfiltration through the execution of rogue processes. This detection does NOT confirm that the activity is inherently malicious; legitimate applications may also utilize scheduled tasks to execute functions.

  ### Investigation Steps

  - **Review command-line parameters for malicious indicators:** Examine the command line for `Event ID 4688` or `Sysmon Event ID 1`. Look for suspicious parameters such as `C:\Users\<USER>\AppData\Local\<malicious_file>`. Identify if the target executable is known and trusted or has a reputation for being malicious.

  - **Check parent process context:** Analyze the parent process for the `schtasks.exe` execution. Identify if the process originated from unusual sources such as `C:\Users\<USER>\AppData\Local\Temp\` or an unexpected application (e.g., an installer or remote access tool like `TeamViewer_.exe`).

  - **Validate scheduled tasks list:** Use PowerShell to enumerate scheduled tasks (e.g., `Get-ScheduledTask | Where-Object {$_.Actions -like '*AppData*'}`). Check if the created tasks match the alert and whether they are recognized and necessary for operations.

  - **Assess user activity on the affected system:** Investigate user logon events (Event ID 4624) to establish if the executing user was authorized and active at the time of the suspicious command. This helps in pointing out whether the activity aligns with expected user behavior.

  - **Identify familiarization with persistence techniques:** If the `schtasks.exe` was called with parameters indicating system-level execution (e.g., `NT AUTHORITY\SYSTEM`), analyze logs for previous occurrences of similar tasks or patterns on the machine. Common tools include Sysmon event IDs 1 and 11.

  ### Prioritization

  The alert is high severity due to the potential impact on the system, especially if it is a critical server or workstation. The ability of `schtasks.exe` to create a persistent backdoor makes this a commonly exploited technique by adversaries. The likelihood of malicious actors leveraging this method for post-exploitation tasks is significant.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may utilize legitimate tools or scripts that do not trigger this alert by creating scheduled tasks with different execution paths. Reliance on the availability of Windows process creation logs (Event ID 4688) is critical; without them, detection becomes less effective. Legitimate applications, such as system management tools running scripts from the AppData directory, may also create tasks that generate similar alerts. A companion detection rule to consider is for unexpected modifications to scheduled tasks or monitoring for unusual command line patterns across multiple instances.

