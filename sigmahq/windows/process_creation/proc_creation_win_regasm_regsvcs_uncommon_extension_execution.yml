note: |
  ### Technical Context

  This Sigma rule detects the execution of Microsoft .NET utilities Regasm and Regsvcs with uncommon file extensions such as .dat, .gif, .jpeg, .jpg, .png, and .txt. The likely attacker objective is to execute malicious code disguised with legitimate tool names while obfuscating the actual file type, potentially aiming to perform actions such as DLL hijacking or executing malware payloads without raising immediate suspicion.

  The relevant MITRE ATT&CK tactics and techniques include "Execution" (T1203) and "Stealth" (T1218.009). The primary telemetry sources include Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1) that monitor when these utilities are invoked with specific command line parameters. If malicious, the execution of these commands could lead to unauthorized access or control over target systems. Importantly, this detection does NOT confirm malicious activity on its own; further investigation is required to verify intent and impact.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of Regsvcs.exe or Regasm.exe being executed. Look for command lines containing uncommon extensions. Legitimate usage should typically involve standard application extensions (e.g., .dll or .exe).

  - **Analyze command line arguments:** Examine the CommandLine field for instances where .dat, .gif, .jpeg, .jpg, .png, or .txt extensions are used. Malicious executions often attempt to camouflage actions or hide the real intent, whereas legitimate usage typically does not include these extensions.

  - **Check parent process relationships:** Investigate the ParentProcessId field associated with the detected processes to identify if they were launched by legitimate applications (like development tools) rather than potentially malicious actors trying to exploit these utilities.

  - **Correlate with known IOCs:** Cross-reference the SHA256 hashes of both the processes and any files associated with this behavior against threat intelligence feeds. High-confidence malicious indicators may include known malign versions of these tools or unusual file hashes.

  - **Assess asset criticality:** Consider the role of the affected host. If it’s a server hosting critical applications, prioritize the investigation to mitigate potential risk quickly.

  - **Verify file creation or modification:** Check for file creation events in the directory where the uncommon extension files were executed, ensuring they align with expected behavior. Malicious activity often generates files without clear legitimate purpose.

  ### Prioritization

  This alert warrants medium severity due to the potential security impact associated with the use of .NET utilities in an atypical manner. While not an immediate indication of compromise, the likelihood of abuse in this context is significant, as these utilities can be weaponized by attackers to execute unauthorized code.

  ### Blind Spots and Assumptions

  Evasion techniques could include encoding command line arguments or using alternative execution methods that do not invoke these utilities directly. Reliable detection requires comprehensive monitoring of process creation events, particularly from trusted sources. Legitimate activities that may trigger the alert could include development environments where developers may use Regsvcs or Regasm with unusual extensions for testing purposes. A related detection could involve monitoring for suspicious use of PowerShell (T1059.001), which can also be used to launch code disguised as legitimate applications.

