note: |
  ### Technical Context

  The rule detects the execution of the Regasm (Assembly Registration Tool) and Regsvcs (Service Host for .NET Services) binaries with uncommon file extensions such as `.dat`, `.gif`, `.jpeg`, `.jpg`, `.png`, and `.txt`. The likely objective of an attacker using this method is to obfuscate malicious payloads or to execute scripts disguised under common image or text file types to bypass security controls. This behavior is indicative of the MITRE ATT&CK technique "Executable from the web" (T1218.009), which is often exploited for unauthorized execution and lateral movement.

  The primary telemetry source is Windows process creation events, specifically monitored via Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it can lead to unauthorized access or control over affected systems. However, this detection alone does not confirm malicious intent, as similar command lines could result from legitimate automation or development processes.

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances of Regasm.exe or Regsvcs.exe. Look for parent processes; indicators of malicious activity include execution from uncommon directories or unusual parent processes (e.g., not spawned by cmd.exe or PowerShell).

  - **Analyze Command Line Arguments**: Examine the CommandLine field for process creation logs. If the command line contains unusual extensions such as `.dat`, `.gif`, or `.txt` alongside Regasm/Regsvcs, consider this a potential indicator of compromise (IoC) for further investigation.

  - **Assess Historical Execution Patterns**: Compare against historical baselines for legitimate applications using Regasm/Regsvcs. Note any deviations or increased frequency in their execution. Legitimate activity might include registrations of .NET applications; check for normal execution patterns during software deployment cycles.

  - **Correlate with Other Data Sources**: Cross-reference findings with application logs, installation directories, or network traffic to ascertain if files corresponding to the observed extensions were transferred or executed from remote sources.

  - **Review File System Changes**: Look for changes in critical directories (e.g., C:\Windows\System32) for file creation/modification timestamps related to uncommon extensions used with the detected executables. This may reveal unauthorized use.

  - **Identify High-Confidence Malicious Indicators**: If the execution of Regasm/Regsvcs was observed from unusual source locations, such as temporary folders or user profile paths without valid user interactions, flag these for immediate investigation as high-confidence indicators of compromise.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of the affected systems, especially if they are servers or hosts handling critical applications. The likelihood of misuse is moderate, given that these tools are frequently found in legitimate software installations but can also be exploited by adversaries, making it vital to ascertain the context surrounding the alert.

  ### Blind Spots and Assumptions

  Limitations of this rule include the potential for evasion through legitimate application execution or benign scripts that utilize Regasm/Regsvcs with unusual extensions for valid purposes. Detection relies heavily on proper Windows logging configurations for process creation, which, if not enabled, will hinder accurate alerting. Additionally, legitimate activities such as software development and automated testing may trigger the rule. Monitoring companion detections, such as unusual script execution or file downloads (e.g., PowerShell commands or HTTP requests for file retrieval), can strengthen overall coverage against such threats.

