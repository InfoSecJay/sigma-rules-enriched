title: Suspicious SYSTEM User Process Creation
id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
status: test
description: Detects a suspicious process creation as SYSTEM user (suspicious 
  program or command line parameter)
references:
- Internal Research
- https://tools.thehacker.recipes/mimikatz/modules
author: Florian Roth (Nextron Systems), David ANDRE (additional keywords)
date: 2021-12-20
modified: 2025-10-19
tags:
- attack.credential-access
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134
- attack.t1003
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_special:
  - Image|endswith:
    - '\calc.exe'
    - '\cscript.exe'
    - '\forfiles.exe'
    - '\hh.exe'
    - '\mshta.exe'
    - '\ping.exe'
    - '\wscript.exe'
  - CommandLine|re: 'net\s+user\s+'
  - CommandLine|contains:
              # - 'sc stop ' # stops a system service # causes FPs
    - ' -NoP '            # Often used in malicious PowerShell commands
    - ' -W Hidden '            # Often used in malicious PowerShell commands
    - ' -decode '            # Used with certutil
    - ' /decode '            # Used with certutil
    - ' /urlcache '            # Used with certutil
    - ' -urlcache '            # Used with certutil
    - ' -e* JAB'            # PowerShell encoded commands
    - ' -e* SUVYI'            # PowerShell encoded commands
    - ' -e* SQBFAFgA'            # PowerShell encoded commands
    - ' -e* aWV4I'            # PowerShell encoded commands
    - ' -e* IAB'            # PowerShell encoded commands
    - ' -e* PAA'            # PowerShell encoded commands
    - ' -e* aQBlAHgA'            # PowerShell encoded commands
    - 'vssadmin delete shadows'            # Ransomware
    - 'reg SAVE HKLM'            # save registry SAM - syskey extraction
    - ' -ma '            # ProcDump
    - 'Microsoft\Windows\CurrentVersion\Run'            # Run key in command line - often in combination with REG ADD
    - '.downloadstring('            # PowerShell download command
    - '.downloadfile('            # PowerShell download command
    - ' /ticket:'            # Rubeus
    - 'dpapi::'               # Mimikatz
    - 'event::clear'                  # Mimikatz
    - 'event::drop'               # Mimikatz
    - 'id::modify'                # Mimikatz
    - 'kerberos::'                 # Mimikatz
    - 'lsadump::'                # Mimikatz
    - 'misc::'               # Mimikatz
    - 'privilege::'                 # Mimikatz
    - 'rpc::'                # Mimikatz
    - 'sekurlsa::'                 # Mimikatz
    - 'sid::'                  # Mimikatz
    - 'token::'                # Mimikatz
    - 'vault::cred'               # Mimikatz
    - 'vault::list'               # Mimikatz
    - ' p::d '            # Mimikatz
    - ';iex('            # PowerShell IEX
    - 'MiniDump'            # Process dumping method apart from procdump
  filter_main_ping:
    CommandLine|contains|all:
    - 'ping'
    - '127.0.0.1'
    - ' -n '
  filter_vs:
    Image|endswith: '\PING.EXE'
    ParentCommandLine|contains: '\DismFoDInstall.cmd'
  filter_config_mgr:
    ParentImage|contains: ':\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  filter_java:
    ParentImage|contains:
    - ':\Program Files (x86)\Java\'
    - ':\Program Files\Java\'
    ParentImage|endswith: '\bin\javaws.exe'
    Image|contains:
    - ':\Program Files (x86)\Java\'
    - ':\Program Files\Java\'
    Image|endswith: '\bin\jp2launcher.exe'
    CommandLine|contains: ' -ma '
  condition: all of selection* and not 1 of filter_*
falsepositives:
- Administrative activity
- Scripts and administrative tools used in the monitored environment
- Monitoring activity
level: high
note: |
  ### Technical Context

  This rule detects the creation of processes running under the SYSTEM user account that exhibit suspicious behavior, particularly those using specific executable names or command-line arguments commonly associated with credential access and privilege escalation techniques. The likely attacker objective is to gain unauthorized access to sensitive information or control over the system. Relevant MITRE ATT&CK techniques include Credential Access (T1003) and Privilege Escalation (T1134). The primary telemetry sources for this detection are Windows Process Creation logs (Event ID 4688) and Sysmon logs (Event ID 1).

  If malicious, the security impact could range from unauthorized data access and exfiltration to complete system control, facilitating further attacks or lateral movement within the network. This detection does NOT confirm the presence of an attack on its own; legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1 that show processes launched under the SYSTEM account. Focus on images like `calc.exe`, `cscript.exe`, or PowerShell with encoded parameters.

  - **Analyze command lines for known bad patterns:** Look specifically for command-line arguments like `-NoP`, `-W Hidden`, `event::drop`, and others typical for malicious activities involving Mimikatz or PowerShell encoded commands.

  - **Validate legitimate activities:** Consider the context of the process creation; legitimate administrative scripts or tools used within the organization may lead to similar alerts. Document expected usage of tools like PowerShell for automation and maintenance tasks.

  - **Identify high-confidence malicious indicators:** Confirm if `vssadmin delete shadows` or PowerShell commands involving `downloadstring` or `downloadfile` are present in the command lines, indicating likely ransomware or exfiltration activities.

  - **Check associated parent processes:** Investigate the parent command line of the suspicious process. For example, if the parent process is `DismFoDInstall.cmd`, it may signify legitimate tool usage. Document any benign patterns observed.

  - **Assess asset criticality:** Determine if the affected asset is critical to business operations. Systems with sensitive data or administrative functions are prioritized for deeper investigation.

  ### Prioritization

  This alert is categorized as high severity due to the potential for significant impact on the security posture of the enterprise if the SYSTEM-level processes are indeed malicious. The likelihood of exploitation using these techniques is high, as they are commonly weaponized in various attack frameworks.

  ### Blind Spots and Assumptions

  Detection limitations include the risk of false positives due to legitimate administrative actions that use similar process creation patterns. It requires complete and comprehensive logging configurations for reliable detection, especially for process creation and command-line arguments. Legitimate scenarios could include routine automated tasks triggered by system administrators. A related detection that strengthens coverage includes monitoring for unusual PowerShell activity, as this can be indicative of attack planning or post-exploitation behavior.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
