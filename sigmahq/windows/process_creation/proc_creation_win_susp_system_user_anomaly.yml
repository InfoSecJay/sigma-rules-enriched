title: Suspicious SYSTEM User Process Creation
id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
status: test
description: Detects a suspicious process creation as SYSTEM user (suspicious 
  program or command line parameter)
references:
- Internal Research
- https://tools.thehacker.recipes/mimikatz/modules
author: Florian Roth (Nextron Systems), David ANDRE (additional keywords)
date: 2021-12-20
modified: 2025-10-19
tags:
- attack.credential-access
- attack.privilege-escalation
- attack.stealth
- attack.t1134
- attack.t1003
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    IntegrityLevel:
    - 'System'
    - 'S-1-16-16384'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  selection_special:
  - Image|endswith:
    - '\calc.exe'
    - '\cscript.exe'
    - '\forfiles.exe'
    - '\hh.exe'
    - '\mshta.exe'
    - '\ping.exe'
    - '\wscript.exe'
  - CommandLine|re: 'net\s+user\s+'
  - CommandLine|contains:
              # - 'sc stop ' # stops a system service # causes FPs
    - ' -NoP '            # Often used in malicious PowerShell commands
    - ' -W Hidden '            # Often used in malicious PowerShell commands
    - ' -decode '            # Used with certutil
    - ' /decode '            # Used with certutil
    - ' /urlcache '            # Used with certutil
    - ' -urlcache '            # Used with certutil
    - ' -e* JAB'            # PowerShell encoded commands
    - ' -e* SUVYI'            # PowerShell encoded commands
    - ' -e* SQBFAFgA'            # PowerShell encoded commands
    - ' -e* aWV4I'            # PowerShell encoded commands
    - ' -e* IAB'            # PowerShell encoded commands
    - ' -e* PAA'            # PowerShell encoded commands
    - ' -e* aQBlAHgA'            # PowerShell encoded commands
    - 'vssadmin delete shadows'            # Ransomware
    - 'reg SAVE HKLM'            # save registry SAM - syskey extraction
    - ' -ma '            # ProcDump
    - 'Microsoft\Windows\CurrentVersion\Run'            # Run key in command line - often in combination with REG ADD
    - '.downloadstring('            # PowerShell download command
    - '.downloadfile('            # PowerShell download command
    - ' /ticket:'            # Rubeus
    - 'dpapi::'               # Mimikatz
    - 'event::clear'                  # Mimikatz
    - 'event::drop'               # Mimikatz
    - 'id::modify'                # Mimikatz
    - 'kerberos::'                 # Mimikatz
    - 'lsadump::'                # Mimikatz
    - 'misc::'               # Mimikatz
    - 'privilege::'                 # Mimikatz
    - 'rpc::'                # Mimikatz
    - 'sekurlsa::'                 # Mimikatz
    - 'sid::'                  # Mimikatz
    - 'token::'                # Mimikatz
    - 'vault::cred'               # Mimikatz
    - 'vault::list'               # Mimikatz
    - ' p::d '            # Mimikatz
    - ';iex('            # PowerShell IEX
    - 'MiniDump'            # Process dumping method apart from procdump
  filter_main_ping:
    CommandLine|contains|all:
    - 'ping'
    - '127.0.0.1'
    - ' -n '
  filter_vs:
    Image|endswith: '\PING.EXE'
    ParentCommandLine|contains: '\DismFoDInstall.cmd'
  filter_config_mgr:
    ParentImage|contains: ':\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
  filter_java:
    ParentImage|contains:
    - ':\Program Files (x86)\Java\'
    - ':\Program Files\Java\'
    ParentImage|endswith: '\bin\javaws.exe'
    Image|contains:
    - ':\Program Files (x86)\Java\'
    - ':\Program Files\Java\'
    Image|endswith: '\bin\jp2launcher.exe'
    CommandLine|contains: ' -ma '
  condition: all of selection* and not 1 of filter_*
falsepositives:
- Administrative activity
- Scripts and administrative tools used in the monitored environment
- Monitoring activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious process creation executed by the SYSTEM user, specifically targeting potentially malicious commands or parameters that could indicate credential theft or privilege escalation attempts. The expected attacker objective includes using SYSTEM privileges to conceal unauthorized activities, such as extracting credentials via tools like Mimikatz or executing encoded PowerShell commands.

  Relevant MITRE ATT&CK tactics include Credential Access (T1003), Privilege Escalation (T1134), and Defense Evasion (T1027). The primary telemetry sources are Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. Malicious actions identified may lead to severe security impacts, including unauthorized access to sensitive data and persistence in the environment. Notably, this detection does NOT confirm malicious activity on its own; further analysis is required to establish intent.

  ### Investigation Steps

  - **Examine the process creation details:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for the alerting process. Check the `Image`, `User`, and `CommandLine` fields for any indications of legitimate administrative practices versus malicious patterns.

  - **Identify expected legitimate behaviors:** Investigate if the SYSTEM user has legitimate reasons to execute common administrative tools such as `ping.exe` or `powershell.exe`. Legitimate process creation may include standard OS maintenance or updates executed through established scripts.

  - **Assess command line complexity:** Analyze the `CommandLine` field for any suspicious parameters or encoded strings (e.g., commands containing `-e` followed by text, which signifies encoded commands likely to be utilized in malware). High confidence exists if the command includes Mimikatz keywords like `sekurlsa::` or any credential extraction indicators.

  - **Correlate with other alerts and logs:** Cross-reference the detected process creation with other events in the same timeframe using the same user credentials. For instance, check for recent entries in Windows Event Logs that indicate possible lateral movement or credential abuse.

  - **Check system integrity and artifact creation:** Validate if any unexpected artifacts were created during the process execution, particularly for known malicious tools like Mimikatz. Look for the presence of dumps or shadow copies that should not exist, indicating possible unauthorized actions.

  - **Review environmental context and asset criticality:** Assess whether the host affected is critical (e.g., domain controllers or sensitive servers) and if the user context aligns with expected administrative roles. Confirm if this user activity fits within established operational baselines.

  ### Prioritization

  This alert should be treated as high priority, given that actions taken by the SYSTEM user can significantly compromise system integrity and security. The likelihood of malicious exploitation through process manipulation is high, particularly with known techniques frequently employed by attackers to establish persistence or exfiltrate data.

  ### Blind Spots and Assumptions

  Detection may have limitations due to potential evasion techniques used by sophisticated attackers, such as mimicking legitimate administrative tasks or using uncommon processes to avoid detection. Accurate log collection from both Security Event and Sysmon sources must be ensured for reliable detection. Additionally, legitimate administrative tools and scripts in the environment could trigger similar alerts, thus the need for context-rich analysis. Strengthened coverage may be provided by related rules that monitor for unusual user activity combined with privilege escalation attempts.

