logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Note: Example of command to simulate (winrm needs to be enabled): "c:\Windows\System32\winrs.exe" powershell
    ParentImage|endswith: '\winrshost.exe'
  filter_main_conhost:
    Image: 'C:\Windows\System32\conhost.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate use of WinRM within the organization
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential lateral movement within a network by monitoring for processes spawned by `winrshost.exe`, which indicates the use of Windows Remote Shell (WinRs). The ability to execute commands remotely via WinRs opens avenues for attackers, particularly if they have already gained initial access to a system and are attempting to exploit trusted connections and credentials to move laterally through an environment.

  The primary objectives of an attacker using WinRM and WinRs are to escalate privileges, perform reconnaissance within the network, and execute payloads on remote machines without raising alarms. By blending legitimate administrative tools with malicious intent, they can avoid detection while compromising additional systems. This activity relates to the MITRE ATT&CK framework, specifically to the **Lateral Movement** tactic (ID: T1021) and the technique **Remote Services: WinRM** (ID: T1021.006).

  Relevant telemetry sources for this detection include process creation logs that capture the invocation of `winrshost.exe`, which provides insight into command execution patterns that may be indicative of malicious lateral movement.

  ### Investigation Steps
  - **Review Process Logs:** Analyze process creation logs for instances of `winrshost.exe`. Pay special attention to parent-child relationships indicating unexpected command executions that could suggest unauthorized remote access.

  - **Inspect User Activity:** Check user account activity and authentication logs around the time of the detection. Look for unusual user behaviors or accounts that are accessing systems they typically do not interact with, as this may indicate lateral movement attempts.

  - **Correlate Network Traffic:** Look for outbound network traffic to known remote management ports, especially using WinRM (commonly TCP 5985 and 5986). Suspicious patterns here could further corroborate unauthorized usage of WinRs.

  - **Identify Legitimate Use Cases:** Consult your organizational logs to outline expected use of WinRM and WinRs. Determine whether the detected instances of `winrshost.exe` correlate with documented administrative activities or if they appear anomalous.

  ### Prioritization
  This alert is classified as medium severity due to the potential for significant impact on enterprise security; successful lateral movement can lead to extensive system compromises. Given that WinRM is a legitimate administrative tool, it requires careful investigation to differentiate between authorized and malicious use.

  ### Blind Spots and Assumptions
  This rule may not fully capture all lateral movement activities, particularly if attackers employ methods to obscure their actions or use other tools that do not invoke `winrshost.exe`. It assumes that logs for process creation are adequately configured and retained, including the necessary permissions and auditing requirements to capture relevant events. Gaps in detection may arise in environments where the use of WinRM is common and thus may lead to legitimate activities being flagged as potential threats.

