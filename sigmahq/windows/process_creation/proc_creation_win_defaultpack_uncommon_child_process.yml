note: |
  ### Technical Context

  This Sigma rule detects uncommon child processes that are spawned by `DefaultPack.EXE`, a Windows binary often utilized by adversaries for execution of further malicious payloads. The likely attacker objective is to execute secondary malicious applications while evading detection by disguising their activities under the default Windows binary. This behavior is associated with the MITRE ATT&CK technique for “Execution” (T1218).

  Primary telemetry sources include process creation events logged by Windows (Event ID 4688) and Sysmon (Event ID 1). If this behavior is indeed malicious, it could lead to the execution of harmful payloads compromising the system's integrity or exfiltrating sensitive data. It is important to note that this detection does NOT confirm whether the child process is malicious without further investigation.

  ### Investigation Steps

  - **Check for the parent process:** Review Security Event ID 4688 or Sysmon Event ID 1 for process creation entries that indicate `DefaultPack.EXE` as the parent. Look for uncommon child process names that do not belong to typical system services or applications.

  - **Identify the child process:** Look for characteristics of the spawned child processes in the `NewProcessName` field. Malicious indicators may include unusual filenames, particularly those related to known malware or unexpected execution paths.

  - **Assess legitimate contexts:** Compare the logged process activity against known normal operations. Legitimate usage often stems from managed IT tools or system maintenance tasks that utilize `DefaultPack.EXE` for standard updates, which can be validated against asset inventory records.

  - **Verify command-line parameters:** Review `CommandLine` fields for executed child processes. Be alert for suspicious arguments that can indicate malicious behavior, such as arguments related to file downloads, script executions, or unexpected network connections.

  - **Cross-check timestamps and user accounts:** Examine the `SubjectUserName` in the process creation logs and the timestamps. Legitimate processes should align with authorized user activity and administrative schedules; any deviations should prompt further investigation.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of interacting malicious processes on sensitive systems. Given that `DefaultPack.EXE` is often abused for launching secondary payloads, a confirmed alert should be prioritized for review as it signifies potential exploitation attempts commonly seen in the wild.

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate applications utilizing `DefaultPack.EXE` or the ability of attackers to manipulate process creation to evade detection. Reliable detection requires the configuration of Sysmon and proper logging of process creations (Event ID 4688). Furthermore, common administrative tools may trigger the alert if they execute unusual child processes, complicating triage efforts. Stronger coverage could be achieved by complementing this detection with rules around network connections initiated by suspicious child processes (e.g., outbound connections monitoring).

