title: Xwizard.EXE Execution From Non-Default Location
id: 193d5ccd-6f59-40c6-b5b0-8e32d5ddd3d1
status: test
description: |
  Detects the execution of Xwizard tool from a non-default directory.
  When executed from a non-default directory, this utility can be abused in order to side load a custom version of "xwizards.dll".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Xwizard/
- http://www.hexacorn.com/blog/2017/07/31/the-wizard-of-x-oppa-plugx-style/
author: Christian Burkard (Nextron Systems)
date: 2021-09-20
modified: 2024-08-15
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\xwizard.exe'
  - OriginalFileName: 'xwizard.exe'
  filter_main_legit_location:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Windows installed on non-C drive
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `xwizard.exe` tool from a non-default directory, indicating potential abuse for side-loading a malicious version of `xwizards.dll`. The likely attacker objective is to escalate privileges or establish persistence using custom or tampered versions of trusted binaries, potentially leading to unauthorized system access. This activity corresponds to MITRE ATT&CK tactics and techniques, specifically **Privilege Escalation (T1574.001)**.

  The primary telemetry sources are Windows process creation logs, specifically looking at Event ID 4688 in the Security log or Sysmon Event ID 1. If the execution is indeed malicious, it could allow an attacker to execute arbitrary code with elevated privileges. This detection does not confirm whether the executable was launched with malicious intent, as there could be legitimate reasons for running `xwizard.exe` from a non-standard location.

  ### Investigation Steps

  - **Verify the process creation event:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for `xwizard.exe` execution, focusing on the process creation time and user context. An unusual execution time outside of business hours may indicate malicious activity.

  - **Assess the execution path:** Confirm the directory from which `xwizard.exe` was executed. If the path is not one of the known safe locations (`C:\Windows\System32\`, `C:\Windows\SysWOW64\`, `C:\Windows\WinSxS\`), note this as a strong indicator of potential compromise.

  - **Investigate associated DLLs:** Cross-reference the execution of `xwizard.exe` with the presence of `xwizards.dll` in the same directory. Any unexpected or modified versions of `xwizards.dll` should be analyzed for potential malicious alterations.

  - **Check user and process history:** Investigate the user identity that executed the process, looking for unauthorized user accounts or service accounts. Legitimate users typically run `xwizard.exe` from approved locations.

  - **Correlate with other alerts:** Look for simultaneous events related to privilege escalation or persistence tactics in the logs (e.g., unauthorized changes to user permissions or scheduled tasks) that may indicate a broader attack pattern.

  ### Prioritization

  This alert should be treated as high priority due to its potential impact on system security and the likelihood of malicious abuse. Execution of `xwizard.exe` from a non-standard directory is not a common or benign behavior and is often exploited by attackers to escalate privileges or maintain persistence on compromised systems.

  ### Blind Spots and Assumptions

  The primary limitation of this detection is the possibility of legitimate use cases, such as customized installations or application testing, which could trigger false positives. It requires that both process creation logging and, ideally, Sysmon configurations are in place to ensure reliable detection. Additionally, benign activities like system maintenance or troubleshooting by authorized personnel may also result in similar alerts. A related detection might include monitoring for unusual or suspicious DLL loading events that indicate potential side-loading activities.

