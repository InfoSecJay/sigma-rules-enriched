title: Xwizard.EXE Execution From Non-Default Location
id: 193d5ccd-6f59-40c6-b5b0-8e32d5ddd3d1
status: test
description: |
  Detects the execution of Xwizard tool from a non-default directory.
  When executed from a non-default directory, this utility can be abused in order to side load a custom version of "xwizards.dll".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Xwizard/
- http://www.hexacorn.com/blog/2017/07/31/the-wizard-of-x-oppa-plugx-style/
author: Christian Burkard (Nextron Systems)
date: 2021-09-20
modified: 2024-08-15
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\xwizard.exe'
  - OriginalFileName: 'xwizard.exe'
  filter_main_legit_location:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Windows installed on non-C drive
level: high
note: |
  ### Technical Context
  This rule detects the execution of the Xwizard utility from a non-standard directory, which may indicate malicious activity. The Xwizard tool, typically used for legitimate purposes in software installation, can be exploited by attackers to execute custom DLLs via side-loading. This behavior permits an attacker to escalate privileges, maintain persistence, or evade detection due to the legitimate nature of the tool.

  The likely attacker objectives include the installation of malware or backdoors using Xwizard's capabilities, manipulating it to execute malicious code without raising immediate suspicion. This type of execution aligns with several MITRE ATT&CK techniques, notably **T1574.001** (DLL Side-Loading) for creating a pathway to executing unauthorized code while masquerading as legitimate activity. The primary data source for detection is process creation logs, which can provide insights into how and from where executables are being run.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for instances of `xwizard.exe` being executed from directories that are not part of the default install locations (e.g., `C:\Windows\System32\`).
  - **Investigate DLL File Paths**: Check for any accompanying or executed DLLs, specifically looking for `xwizards.dll` in unusual or suspicious locations to ascertain if side-loading has taken place.
  - **Correlate with User Activity**: Identify the user account executing the command and review any recent user activity for unusual access patterns, especially if privileges were elevated during the execution.
  - **Examine Alternatives for Triggering**: Consider other processes that may invoke Xwizard directly or indirectly, including installers or scripts that could suggest a broader attack pattern.

  ### Prioritization
  The severity of this alert is high due to the potential impact of privilege escalation and persistence that can be introduced through malicious use of legitimate tools. Given that attackers often use strategies to evade detection, monitoring for such non-standard executions is crucial in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage as legitimate Xwizard executions from non-default locations can exist, especially in environments where Windows is installed on non-default drives. The detection logic assumes that all legitimate instances strictly resolve from standard directories, which may not hold true for every organization. For this alert to function effectively, it requires comprehensive logging of process creation events and the establishment of baseline execution paths for legitimate applications.

