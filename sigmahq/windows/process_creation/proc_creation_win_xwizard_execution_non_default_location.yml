title: Xwizard.EXE Execution From Non-Default Location
id: 193d5ccd-6f59-40c6-b5b0-8e32d5ddd3d1
status: test
description: |
  Detects the execution of Xwizard tool from a non-default directory.
  When executed from a non-default directory, this utility can be abused in order to side load a custom version of "xwizards.dll".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Xwizard/
- http://www.hexacorn.com/blog/2017/07/31/the-wizard-of-x-oppa-plugx-style/
author: Christian Burkard (Nextron Systems)
date: 2021-09-20
modified: 2024-08-15
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\xwizard.exe'
  - OriginalFileName: 'xwizard.exe'
  filter_main_legit_location:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Windows installed on non-C drive
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Xwizard utility from non-standard directories. This behavior typically indicates an attempt by an adversary to load a malicious DLL through side-loading, exploiting Xwizard to execute payloads stealthily. The likely attacker objective is to achieve persistence and execute arbitrary code with elevated privileges, leveraging techniques such as "Sideloading" (T1574.001).

  The primary telemetry source is process creation logs, specifically from Windows Event ID 4688 or Sysmon Event ID 1. If this detection corresponds to malicious activity, it poses a significant risk as it may allow threat actors to maintain control over compromised systems, potentially leading to data exfiltration or further lateral movement. Notably, this detection does not confirm that malicious activity is occurring without additional contextual information.

  ### Investigation Steps

  - **Check for process execution location:** Review Event ID 4688 logs for the execution of `xwizard.exe`. Focus on the `New Process Name` field to identify path locations. Legitimate executions typically occur from `C:\Windows\System32\`. Non-standard paths warrant further investigation.

  - **Analyze parent process relationships:** Correlate parent process IDs from Event ID 4688 to identify processes that initiated `xwizard.exe`. Track any unusual parent processes which may indicate a compromise, such as running it from unusual executables or scripts.

  - **Verify DLL loading behavior:** If the tool is executed, check for associated DLLs in the same directory. Use Sysmon Event ID 7 (Image loaded) to look for `xwizards.dll` being loaded from non-standard paths. The presence of marked DLLs in atypical locations usually signals abuse.

  - **Investigate system configurations for anomalies:** Research the system's configuration to identify why Xwizard would be executed outside of its default directory. Pay attention to asset criticality—if it's a server or endpoint with access to sensitive data, prioritize your response.

  - **Identify history of previous alerts:** Review previous alerts related to the execution of `xwizard.exe` across the environment. Frequent triggering of this rule on the same system may indicate ongoing adversarial techniques or misconfigured environments.

  ### Prioritization

  This alert is rated high in severity due to the impact on system integrity and the potential for privilege escalation. The likelihood of malicious abuse is significant, as this technique is commonly weaponized by attackers leveraging Xwizard for DLL side-loading. Immediate investigation is warranted on systems that trigger this alert.

  ### Blind Spots and Assumptions

  Detection limitations exist as attackers may obfuscate paths or names to avoid detection. Configurations must ensure complete process creation logging, including paths. Legitimate activities, such as a misconfigured application installation on a non-default directory, could trigger this alert. Implementing companion detections for other known side-loading techniques will enhance coverage and context in investigations.

