note: |
  ### Technical Context

  This rule detects instances where the `mshtml.dll` is used to execute arbitrary code through the `RunHTMLApplication` function, commonly leveraged by attackers to execute malicious scripts or commands. The likely objective of attackers using this technique is to bypass application whitelisting and execute payloads stealthily. The relevant MITRE ATT&CK tactic is Execution, specifically the technique ID T1203 (Exploitation for Client Execution).

  Primary telemetry sources include Windows Security Event logs for process creation (Event ID 4688) and Sysmon logs (Event ID 1) capturing process execution details, including command line arguments. If exploited, this behavior could lead to system compromise, data exfiltration, or additional malware installation. Importantly, this detection does NOT confirm malicious intent by itself; legitimate uses of `mshtml.dll` may exist.

  ### Investigation Steps

  - **Check Security Event Logs for Process Creation:**
    Review Windows Security Event ID 4688 for any instance where `mshtml.dll` is invoked to check the command line for unusual parameters, such as `#135` or `RunHTMLApplication`, indicating potentially malicious usage.

  - **Examine Sysmon Logs for Process Activity:**
    Look at Sysmon Event ID 1 to identify the parent process that invoked `mshtml.dll`. Legitimate instances often include known applications like browsers or authorized scripts.

  - **Review Command Line Arguments:**
    Focus on command lines containing suspicious patterns (e.g., `\..\` and `mshtml`). For instance, a command invoking `RunHTMLApplication` outside of standard application contexts could indicate exploitation.

  - **Identify High-Confidence Malicious Indicators:**
    Search for known non-standard protocols or unusual script handlers in command lines (e.g., `vbscript` or `javascript`). These could imply an attempt to use Windows scripting environments for malicious execution.

  - **Validate Asset Role and Criticality:**
    Determine whether the affected system is a high-value target (e.g., a domain controller or financial system). Increased scrutiny is warranted if the alert originates from critical assets.

  - **Correlate with Other Detection Rules:**
    Investigate companion rules for related behaviors, such as suspicious PowerShell execution or unusual inbound connections, that may suggest a coordinated malicious effort.

  ### Prioritization

  This alert is high severity due to the potential impact on sensitive systems and the likelihood of malicious abuse through widely exploited methods for remote code execution. The behavior is frequently weaponized in targeted attacks, making timely investigation critical.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as code obfuscation or legitimate use of scripting applications that could trigger similar alerts. Required telemetry includes accurate logging of command line arguments; without these logs, it may be challenging to assess context. Legitimate scenarios might trigger the alert, such as automated scripts running legitimate code. A related detection is the monitoring of browser activity for unexpected or malformed URLs that may correspond with `mshtml.dll` usage.

