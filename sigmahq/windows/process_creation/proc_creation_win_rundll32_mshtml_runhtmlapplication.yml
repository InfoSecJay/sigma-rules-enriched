note: |
  ### Technical Context

  This Sigma rule detects the execution of commands utilizing the "mshtml.dll" RunHTMLApplication to run arbitrary code via different protocol handlers, such as vbscript, javascript, or HTTP. The likely objective of an attacker using this method is to execute malicious payloads or conduct further reconnaissance and exploitation through script execution capabilities embedded in HTML content. This behavior aligns with the MITRE ATT&CK technique for Execution (T1203).

  The primary telemetry source for this detection is the process creation logs from Windows, specifically focusing on command line arguments. If detected behavior is malicious, the impact can be significant, as it may lead to unauthorized system access or compromise. The detection does NOT confirm that the action is malicious on its own; it requires further investigation to understand the context of the execution.

  ### Investigation Steps

  - **Check command line arguments: ** Review process creation logs (Event ID 4688) for commands that contain 'RunHTMLApplication' and abnormal paths (e.g., `..\\`). Legitimate usage typically has straightforward paths without unnecessary directory traversal.

  - **Verify parent process relationships: ** Examine the parent process of the detected instance through Sysmon Event ID 1. Legitimate applications invoking mshtml.dll usually have known, trusted parent processes (e.g., explorer.exe).

  - **Assess log sources: ** Ensure that process creation logs (Event ID 4688) and Sysmon logs (if deployed) are enabled and properly configured. Missing these logs can lead to gaps in detection.

  - **Analyze network activity: ** Correlate detected execution with network logs (e.g., proxy or firewall logs) for outgoing connections or unusual traffic patterns post-execution. This could provide insights into post-exploitation activity.

  - **Identify high-confidence indicators: ** Look for command line arguments that include both 'mshtml' and unusual flags (#135) or encodings consistent with evasion techniques. Consider that flag #135 is an expected indicator of potential abuse.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on critical systems and the likelihood of exploitation using commonly weaponized methods such as file execution or remote scripts. The risk escalates if the action is performed on sensitive or privileged assets.

  ### Blind Spots and Assumptions

  Detection may face limitations due to the possible evasion techniques like obfuscation in the command line input, which can bypass detection. Ensuring logs from process creation are gathered consistently is essential for reliable detection. Legitimate activities, such as system updates or local administrative scripts, can invoke mshtml.dll, which may trigger the alert. An additional detection rule for other execution methods (e.g., PowerShell Script Execution, T1086) can complement this rule to provide broader monitoring for script-based attacks.

