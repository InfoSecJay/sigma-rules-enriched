note: |
  ---

  ### Technical Context

  This rule detects the execution of commands leveraging the "mshtml.dll" RunHTMLApplication export, which can potentially run arbitrary code via various protocols including VBScript and JavaScript. Attackers may use this technique for code execution or to deliver malicious payloads with the aim to achieve persistence or data exfiltration. The relevant MITRE ATT&CK tactic is Execution (TA0002) and the technique is Running HTML Application (T1036.003).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688, which detail the process creation and the associated command line used. If triggered by a malicious actor, the security impact could include unauthorized access, data exfiltration, or execution of further malicious actions on the system. Importantly, this detection does NOT confirm that the usage of "RunHTMLApplication" is malicious on its own; further investigation is necessary.

  ---

  ### Investigation Steps

  - **Review command line arguments**: Analyze the command line in Event ID 4688. Look for commands containing 'mshtml' or 'RunHTMLApplication'. Malicious usage will often have obfuscated or unexpected parameters, such as '...\..' directory traversal hints.

  - **Check parent process**: Investigate the parent process ID (PID) associated with the suspicious process creation. Malicious executions often stem from benign applications like web browsers or document files launched by unexpected processes.

  - **Compare with known benign behavior**: Identify legitimate applications that utilize mshtml.dll and document expected command lines. Benign usages may include legitimate scripts or applications that execute HTML content. Any deviation may indicate threat activity.

  - **Identify unusual network activity**: Review proxy logs or network telemetry for outbound connections initiated by the process. Look for suspicious domains or IP addresses reached after executing the command, which may indicate data exfiltration or communication with a command and control server.

  - **Correlate with initial access techniques**: Investigate the environment for any recent spear-phishing attempts or web-based malware that could have facilitated the execution of this command. Such vectors might preempt the detection.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact on infected systems, including sensitive data compromise or lateral movement by malicious actors. The likelihood of this behavior being malicious is considerable since the misuse of mshtml.dll for code execution is a recognized and weaponized technique in modern threat landscapes.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications utilizing "RunHTMLApplication" without it indicating compromise. Required log sources include comprehensive Windows Event Logs; lack of process creation logging can reduce detection effectiveness. Legitimate activities, such as internal web applications or automation scripts, may mistakenly trigger this alert. Related detections for comprehensive coverage could include monitoring for PowerShell command executions (T1059.001), which could similarly indicate suspicious activities within the environment.

