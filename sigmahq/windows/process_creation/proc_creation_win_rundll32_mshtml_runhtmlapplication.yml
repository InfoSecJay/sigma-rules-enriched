note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity associated with the use of `mshtml.dll`, specifically its `RunHTMLApplication` export, to execute arbitrary code through various protocol handlers such as VBScript, JavaScript, and HTTP. The rule aims to detect command-line invocations that leverage this vector, which can be indicative of attempts to load and execute malicious payloads originating from seemingly benign applications or scripts.

  The primary threat scenario revolves around an attacker manipulating expected behaviors of legitimate applications to execute malware without raising suspicions. This technique is often employed during the execution phase of an attack, where the attacker seeks to run malicious code to achieve objectives such as data exfiltration, system compromise, or lateral movement within the network. The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (T1203) – Exploiting software vulnerabilities to run code.
  - **Defense Evasion** (T1218) – Utilizing trusted binaries or components to bypass security measures.

  To support the detection logic, the best telemetry sources include process creation events, where the command-line arguments can be evaluated, as well as any related logs that capture the context of command executions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances of `mshtml.dll` being invoked with suspicious command-line parameters, specifically looking for those containing `RunHTMLApplication` and patterns indicative of malicious intent.

  - **Correlate with Network Traffic**: Examine outgoing network traffic that may correlate with the execution events, particularly focusing on HTTP/S traffic that could be fetching additional payloads or command-and-control communications.

  - **Analyze Related Artifacts**: Investigate other related artifacts such as script files (VBScript, JavaScript) that may have been executed in conjunction with the command. Look for unusual locations or access patterns.

  - **Check for Indicators of Compromise**: Search for known indicators of compromise associated with the techniques utilized by `mshtml.dll` abuse, including any specific hash values or endpoint behaviors documented in threat intelligence sources related to similar exploits.

  ### Prioritization
  This alert is considered high severity due to the significant risk associated with arbitrary code execution vulnerabilities. Attackers can leverage this technique to gain high levels of access and inflict severe impacts on enterprise systems if successful.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on process creation event logs, which may not capture executions on systems where such logging is disabled or configured improperly. The detection logic assumes that command-line arguments will be observable and indicative of an attack; however, obfuscation tactics could be employed by threat actors to evade detection. Additionally, proper logging configurations on Windows systems are essential to ensure complete visibility into process creation and related activities for this detection to function effectively.

