note: |
  ### Technical Context

  This rule detects the execution of commands that use the "mshtml.dll" library to run arbitrary code through various protocol handlers, such as VBScripts, JavaScripts, or HTTP requests. The attacker’s objective is likely to execute malicious content without raising alarms, targeting systems with the intention of conducting a range of actions like data exfiltration or remote access.

  The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Defense Evasion (T1484). Primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688. If malicious, the security impact includes potential system compromise and unauthorized access to sensitive data. This detection does NOT confirm that the executed command is malicious on its own; further investigation is required to establish context.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Windows Security Event ID 4688 to identify the command line associated with the process creation event. Look for the presence of parameters like `RunHTMLApplication` and any indicators of `mshtml.dll`. Legitimate usage generally excludes such parameters or shows expected application behavior.

  - **Verify execution context:** Check if the command was initiated from a known and trusted application. Use Event ID 4704 to understand if the process had unusual parent-child relationships or originated from unexpected locations.

  - **Identify high-risk command patterns:** Look specifically for command lines that contain `\..\` along with `mshtml`. These patterns are often indicative of malicious activities. Compare against baseline behavior in your environment to determine anomalies.

  - **Cross-reference with user activity:** Check user activity logs (e.g., Event ID 4624 for logons) to correlate if the user account that triggered this event has previous incidents or unusual activity patterns that might indicate compromise.

  - **Inspect network activity:** Utilize network logs, including firewall logs and proxy logs, to see if there are outbound connections associated with the time of the alert that align with `RunHTMLApplication` execution. Malicious execution might coincide with suspicious data transfer behavior or domain requests.

  ### Prioritization

  This alert carries a high severity due to the potential impact on critical systems, as arbitrary code execution can lead to full system compromise. The likelihood of this behavior being malicious is elevated, given that the usage of `mshtml.dll` in this context is often weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate applications may sometimes invoke `mshtml.dll` for valid purposes; reviewing context is vital for accurate classification. Required log sources include process creation events and network telemetry, which must be enabled for reliable detection. Common legitimate activities that may trigger this alert could be software updates or internal scripts that employ `mshtml`. A companion detection to strengthen coverage includes monitoring for unusual files or scripts created in conjunction with this alert pattern, highlighting potential exfiltration activities.

