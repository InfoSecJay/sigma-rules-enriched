level: high
note: |
  ### Technical Context

  This rule detects the execution of the AnyDesk remote access software from non-standard directory locations, which may signal malicious activity. Attackers often use tools like AnyDesk to establish command and control channels and remotely manipulate compromised systems, as these tools blend in with legitimate administrative activities. The relevant MITRE ATT&CK technique associated with this behavior is Command and Control (T1219.002).

  The primary telemetry sources for this detection are Windows process creation logs, specifically looking at Security Event ID 4688. If this activity is malicious, it can lead to unauthorized access, data exfiltration, or system compromise. However, this detection alone does not confirm malicious intent; legitimate usage from a non-standard folder may trigger this alert.

  ### Investigation Steps

  - **Identify the process execution event:** Review Security Event ID 4688 logs for process creation events involving `AnyDesk.exe` or `AnyDeskMSI.exe` in non-standard directories, especially paths under `AppData\`.

  - **Examine process parent-child relationships:** Investigate the parent process of the AnyDesk execution to identify if it was spawned by a suspicious or known malicious process (e.g., cmd.exe, PowerShell).

  - **Check execution path legitimacy:** Validate the installation and execution path against expected locations (e.g., `C:\Program Files\AnyDesk\` vs. `C:\Users\<User>\AppData\Local\Temp\`) to distinguish between benign and malicious indicators.

  - **Look for additional indicators of compromise:** Correlate the presence of AnyDesk with other potential malicious behaviors, such as unusual outbound network connections or anomalous login events from the same host using network logs (Firewall or IDS logs).

  - **Confirm legitimate use cases:** Identify if the user that triggered the event has a business need for AnyDesk. Check for any recent installations or legitimate support requests involving remote access.

  - **Identify file manipulation or creation:** Validate if any unexpected file creation or modifications were made in conjunction with the AnyDesk execution by reviewing the file system or using EDR telemetry for file metadata.

  ### Prioritization

  Given that AnyDesk can allow remote interactive sessions, its presence in non-standard directories raises significant concerns regarding potential unauthorized access. The likelihood of malicious usage is high, especially in environments where remote access tools are not regularly sanctioned. Therefore, this alert is classified as high severity.

  ### Blind Spots and Assumptions

  This detection can be evaded if attackers rename the executable or alter the installation path to known legitimate directories. Reliable detection requires comprehensive logging from endpoint protection solutions, ensuring no gaps in process execution events. Legitimate activities such as IT support using AnyDesk from non-standard directories may trigger this alert. Companion detections, such as monitoring for suspicious outbound connections following AnyDesk execution, can enhance coverage and provide additional context on possible command and control activities.

