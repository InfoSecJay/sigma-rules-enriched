detection:
  selection:
  - Image|endswith:
    - '\AnyDesk.exe'
    - '\AnyDeskMSI.exe'
  - Description: AnyDesk
  - Product: AnyDesk
  - Company: AnyDesk Software GmbH
  filter:
    Image|contains:
    - '\AppData\'
    - 'Program Files (x86)\AnyDesk'
    - 'Program Files\AnyDesk'
  condition: selection and not filter
falsepositives:
- Legitimate use of AnyDesk from a non-standard folder
level: high
note: |
  ### Technical Context
  This detection rule identifies instances of AnyDesk execution from suspicious or uncommon directories, such as user-specific application data folders. Adversaries often utilize remote access tools like AnyDesk to establish a command and control (C2) channel to compromised systems, leveraging the legitimacy of these applications to bypass security measures. The typical attacker objective is to maintain access and control over the target environment, facilitate lateral movement, or exfiltrate sensitive information without detection.

  The detection aligns with multiple MITRE ATT&CK tactics and techniques, notably **Command and Control** (TA0011) and **Application Layer Protocol** (T1071), which detail the use of remote management tools for malicious purposes. The specific technique referenced is **T1219.002 - Remote Access Software**, indicating the threat landscape surrounding remote utilities.

  The primary data sources that will provide the best evidence for this detection are **process creation events**, which include details about executed applications, their paths, and attributes. This allows analysts to observe the context of application execution and assess any deviations from normal usage patterns in their environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect process creation logs to identify instances of AnyDesk execution, particularly focusing on paths that deviate from typical installation locations such as the default Program Files directory.

  - **Correlate with User Activity**: Analyze user account activity alongside AnyDesk execution timestamps to determine whether the execution is consistent with legitimate user actions or indicative of unauthorized access.

  - **Inspect Network Traffic**: Monitor network traffic for AnyDesk-related connections, specifically looking for outbound or suspicious traffic patterns associated with remote access sessions.

  - **Check for Other Indicators**: Look for other signs of compromise, such as unusual account logins, alterations to group memberships, or simultaneous sessions from unexpected locations, to further assess the broader security posture.

  ### Prioritization
  The alert is categorized as high severity due to the significant risk posed by the potential for unauthorized remote access to sensitive systems. The combination of a seemingly legitimate application being executed from a non-standard location raises alarms about possible malicious intent and exploitation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to legitimate uses of AnyDesk and similar remote access tools, particularly if application whitelisting is in place or if users frequently access these tools in uncommon environments. The detection logic assumes that AnyDesk will only be executed from standard directories, potentially missing valid cases where it is executed legitimately from a user profile directory. To ensure adequate functionality of the alert, logging of all process creation events, including user activity and network connections, must be configured and operational.

