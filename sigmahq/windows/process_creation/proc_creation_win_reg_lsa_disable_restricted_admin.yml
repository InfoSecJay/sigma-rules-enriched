note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the "DisableRestrictedAdmin" registry value, which directly influences the functionality of RestrictedAdmin mode in Windows systems. The intended behavior of this feature is to avoid transmitting reusable credentials over Remote Desktop connections, thereby safeguarding sensitive authentication information from potential adversary exploitation.

  The likely objective of an attacker manipulating this registry setting includes facilitating credential theft on compromised systems. This action falls under the MITRE ATT&CK tactic of Defense Evasion (T1203) and the technique of Registry Run Keys / Startup Folder (T1112). The primary telemetry sources for this detection are Windows process creation events, particularly focusing on processes altering registry settings, such as those logged under Security Event ID 4688 or Sysmon Event ID 1. If this behavior is confirmed as malicious, it could lead to significant security impacts, including unauthorized access and lateral movement within the network.

  However, this detection does NOT confirm with certainty that a compromise has occurred; legitimate administrative actions or services may also modify this registry value.

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 to identify the process responsible for the registry modification. Look for parent processes associated with legitimate administrative tools versus unusual executables.

  - **Verify registry changes:** Check the registry path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System` for the "DisableRestrictedAdmin" value. Compare the new value against previous known good states, noting any recent changes to indicate unauthorized access.

  - **Assess legitimate behavior:** CLI tools or Windows features such as Remote Desktop Configuration and Group Policy could normally invoke changes to this registry value. If recent changes coincided with scheduled administrative activities or notified updates, they may be benign.

  - **Identify high-confidence malicious indicators:** Cross-reference the process modification with known malicious binaries or unusual command-line arguments. Filter for parameters suggesting automation or scripts, especially if the values are changed to either enable or disable restricted admin mode in unexpected situations.

  - **Review associated processes:** Identify sibling or child processes spawned by the modifying process in event logs. Anomalous variations in the command line, such as unusual flags set on legitimate executables, may indicate credential harvesting behavior.

  - **Correlate with known attacks:** Investigate related logs or companion rules, especially those detecting suspicious remote desktop login attempts (e.g., from Event ID 4624 in Security logs) alongside changes to the "DisableRestrictedAdmin" value.

  ### Prioritization

  This alert is of high severity due to its potential for enabling malicious actors to harvest credentials and further propagate within the environment. Systems where this change occurs and are critical for business operations represent a particular risk, especially if suspect process ancestry is noted. The weaponization of remote desktop connections by adversaries is a well-documented approach in lateral movement strategies.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of monitoring solutions that log registry changes comprehensively or by evasion through established tools that modulate registry values without detection. Legitimate administrative activities, such as Group Policy refreshes or scheduled maintenance, may trigger this alert if log sources are not configured to distinguish appropriately. A companion detection could focus on remote desktop service logins (e.g., Event ID 4624) during the same timeframe, enhancing the context for investigations into potentially related activities.

