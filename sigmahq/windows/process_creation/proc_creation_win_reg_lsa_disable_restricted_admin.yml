note: |
  ### Technical Context
  This rule detects unauthorized modifications to the "DisableRestrictedAdmin" registry value on Windows systems, which controls whether RestrictedAdmin mode is enabled for Remote Desktop connections. RestrictedAdmin mode is crucial as it prevents reusable credentials from being transmitted during remote desktop sessions, significantly mitigating the risk of credential harvesting if the remote server is compromised. Attackers may alter this setting to facilitate credential theft during lateral movement through Remote Desktop connections in a targeted enterprise environment.

  The likely attacker objectives include bypassing security measures designed to protect sensitive credentials and achieving unauthorized access to remote systems. This behavior ties into multiple MITRE ATT&CK tactics, particularly **Persistence (TA0003)** through credential dumping techniques like **T1112: Modify Registry**. Modifying the registry to disable security features is an established method for attackers seeking elevated privileges or prolonged access.

  Key data sources for detecting these activities include process creation logs that record command-line arguments used during registry modifications. Such telemetry is essential for identifying potential tampering with security settings on critical systems.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze the process creation logs for entries associated with registry modifications, especially commands targeting `\System\CurrentControlSet\Control\Lsa` that include `DisableRestrictedAdmin`.

  - **Correlate User Activities:** Cross-reference the process creation events with user activity logs to identify if the changes were made by an authorized or unauthorized user, looking specifically for unusual or suspicious user behavior.

  - **Inspect Registry History:** If available, check the registry history logs to confirm the timeline of changes to the "DisableRestrictedAdmin" value, noting any back-and-forth changes that could indicate malicious tampering.

  - **Assess Remote Desktop Configurations:** Evaluate the Remote Desktop configuration settings to identify any discrepancies or unauthorized changes that may coincide with the registry modifications.

  ### Prioritization
  This alert has a high severity level due to the significant risk posed by disabling RestrictedAdmin mode. If an attacker successfully alters this registry value, it could enable the theft of user credentials during remote access sessions, leading to potential lateral movement and access to sensitive systems within the enterprise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging for registry modifications is not enabled or if process creation logging is misconfigured. The detection logic assumes that unauthorized access will manifest as process creation events leading to the modification of the registry key. It relies on the availability of detailed logs for processes initiated by various user accounts in the environment. Organizations should ensure that logging is configured correctly and that historical log data is retained for correlation and analysis.

