note: |
  ### Technical Context

  This Sigma rule detects modifications to the "DisableRestrictedAdmin" registry value, which governs the functioning of RestrictedAdmin mode in Windows. This mode is designed to enhance security during Remote Desktop connections by preventing the transmission of reusable credentials to potentially compromised remote systems. The likely attacker objective is to disable this protective feature in order to capture user credentials, facilitating lateral movement or privilege escalation.

  The relevant MITRE ATT&CK tactics for this behavior are Persistence (T1547) and Defense Evasion (T1112). The primary telemetry sources are Windows process creation events, specifically focusing on Event ID 4688. If this alert is triggered by malicious activity, there may be significant security repercussions, including unauthorized access to sensitive systems. Importantly, this detection does NOT confirm that an attack is occurring; it merely indicates that a registry modification has taken place, which requires further investigation.

  ### Investigation Steps

  - **Review registry change details:** Examine Windows Registry Event logs, particularly Event ID 4663, to find the specific date, time, and user account that made changes to the "DisableRestrictedAdmin" value, checking for unexpected accounts making the modification.

  - **Check associated process creation events:** Look for Windows Security Event ID 4688 entries with command lines containing "\System\CurrentControlSet\Control\Lsa" and "DisableRestrictedAdmin." Verify the parent process path and hash to determine if it correlates with known malicious binaries.

  - **Identify legitimate use cases:** Review expected administrative tasks that may involve legitimate changes to the "DisableRestrictedAdmin" value, focusing on timestamps aligned with scheduled maintenance or updates by trusted IT personnel.

  - **Validate remote connection behaviors:** Inspect Windows Remote Desktop logs (Event ID 4624 and 4625) for any suspicious logins that may coincide with the timing of registry changes. Look for unusual user account activity, particularly from external IP addresses or unfamiliar accounts.

  - **Assess target system security posture:** Consider the role and criticality of the host where changes are detected. High-impact systems, such as domain controllers, should be prioritized for deeper scrutiny due to their potential exposure to future lateral movement.

  - **Analyze for exfiltration artifacts:** Investigate network logs for unusual outbound connections occurring soon after registry changes, focusing on event patterns that may suggest attempts to exfiltrate data after credential harvesting.

  ### Prioritization

  This alert should be treated with high priority, particularly if it affects critical or sensitive systems. The likelihood of malicious abuse is significant, particularly in contexts where Remote Desktop Protocol (RDP) is commonly utilized. Given that this behavior can be easily weaponized by adversaries seeking to compromise credentials, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be ineffective against scenarios where attackers use legitimate administrative tools to modify the registry, bypassing standard monitoring. Reliable detection hinges on the capture of precise log sources, particularly Registry and Process Creation logs, which must be properly configured. Legitimate activities—such as system updates or reconfigurations by system administrators—may also trigger this alert. A related detection, such as tracking unauthorized changes to Group Policy settings (MITRE ID T1484), can provide complementary coverage against credential theft attempts.

