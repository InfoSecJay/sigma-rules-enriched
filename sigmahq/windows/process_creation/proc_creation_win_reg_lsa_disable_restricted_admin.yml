note: |
  ### Technical Context

  This rule detects changes to the "DisableRestrictedAdmin" registry value, which controls the availability of Restricted Admin mode for Remote Desktop Protocol (RDP) sessions. By altering this registry value, an attacker may aim to enable unrestricted credential transmission, thereby exposing user credentials on compromised endpoints. This behavior fits within the MITRE ATT&CK framework under the tactic "Persistence" and technique "Registry Run Keys / Startup Folder" (T1112).

  The primary telemetry sources for this detection come from Windows process creation events, specifically monitoring command-line arguments related to registry modifications. If this behavior is malicious, it might facilitate credential harvesting and further compromise into sensitive systems. However, this detection alone does not confirm successful exploitation or that any credentials have been accessed.

  ### Investigation Steps

  - **Identify the process creation event:** Check for Process Creation events (Windows Security Event ID 4688 or Sysmon Event ID 1) that reference registry modifications, particularly with paths leading to `\System\CurrentControlSet\Control\Lsa`.

  - **Analyze command-line arguments:** Review the CommandLine field in event logs for entries containing 'DisableRestrictedAdmin'. Any command line modifying this registry value without legitimate administrative purpose is suspicious.

  - **Correlate with user and time:** Check the user associated with the process creation event. If the user is a non-administrative account performing this operation during non-business hours, it may indicate malicious intent.

  - **Look for legitimate administrative roles:** Ensure that expected administrative actions are taken by authorized personnel. Typical behavior would show admins using tools like `Reg.exe` or `PowerShell` under well-defined contexts, such as system updates or maintenance tasks.

  - **Check related events for multiple modifications:** If multiple process creation events target the same registry value in a short timeframe, investigate for patterns of rapid change, which could be indicative of automated or scripted malicious activity.

  - **Examine historical context:** Review previous configurations of the "DisableRestrictedAdmin" value from the registry or other config management logs to confirm if the change aligns with normal administrative procedures.

  ### Prioritization

  Given the potential impact on credential security in a corporate environment, tampering with the “DisableRestrictedAdmin” setting is a high-severity alert. The likelihood of an attacker exploiting this avenue is concerning, as credential-based breaches are commonly weaponized in attack campaigns.

  ### Blind Spots and Assumptions

  The detection may miss subtle evasion tactics where legitimate administration tools are used to alter registry keys. Reliable detection requires comprehensive logging from Sysmon or advanced Windows logging configurations. Legitimate administrative operations—such as security assessments or maintenance routines—could trigger similar alerts. A related detection for Registry access events on this value would enhance investigation coverage.

