note: |
  ### Technical Context

  This rule detects the use of `cleanmgr.exe` for bypassing User Account Control (UAC) through scheduled tasks. This behavior is indicative of an attacker attempting to escalate privileges on a system by exploiting UAC bypass techniques, which are designed to execute commands with elevated privileges without user consent. Relevant MITRE ATT&CK tactics include Defense Evasion (T1568) and Privilege Escalation (T1548.002). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creations and Sysmon Event ID 1 for process events. The security impact of a successful exploitation can result in an attacker gaining unauthorized administrative access to critical systems. Importantly, this detection alone does not confirm malicious activity but highlights potential abuse of system utilities commonly leveraged for privilege escalation.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 for instances of `cleanmgr.exe` being executed. Look for command lines ending with `"\system32\cleanmgr.exe /autoclean /d C:`. Legitimate use typically includes different command line arguments or a different parent process context.

  - **Identify parent process legitimacy**: Validate the parent process for suspect instances. Confirm if the parent command line includes `C:\Windows\system32\svchost.exe -k netsvcs -p -s Schedule`, which is often indicative of scheduled task executions. Legitimate scheduled tasks rarely use `cleanmgr.exe` in this manner.

  - **Analyze integrity levels**: Investigate the integrity level of the process creation. High and System integrity levels (SIDs: S-1-16-16384, S-1-16-12288) are common for escalation attempts. Check Sysmon Event ID 1 logs for cases where cleanmgr.exe is executed with elevated integrity.

  - **Correlate with other security alerts**: Determine if there are associated alerts in endpoint detection tools that indicate other suspicious behavior patterns, such as multiple processes following the execution of `cleanmgr.exe` that imply further exploitation.

  - **Examine scheduled tasks**: Inspect Task Scheduler for any newly created or modified tasks. Focus on tasks using `cleanmgr.exe` to ensure they are explicitly created by administrative users and not by potentially compromised accounts. Legitimate tasks usually fit clear operational profiles.

  ### Prioritization

  This alert should be treated with high severity due to the potential for privilege escalation within critical systems. The specific technique detected is weaponized commonly by adversaries, making timely investigation imperative to mitigate risk effectively.

  ### Blind Spots and Assumptions

  Detection may be limited by missing or misconfigured logging for process creation. Adversaries might deploy other UAC bypass techniques or legitimate administrative tasks which could trigger this alert. The use of administrative tools under routine maintenance by IT operations could yield false positives. A related detection for monitoring unusual task scheduler activities may strengthen overall security posture against UAC bypass tactics.

