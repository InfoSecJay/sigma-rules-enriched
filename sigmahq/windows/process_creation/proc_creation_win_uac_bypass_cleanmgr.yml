  ---

  ### Technical Context

  This rule detects the use of the Disk Cleanup tool (cleanmgr.exe) as a means to bypass User Account Control (UAC) through the creation of scheduled tasks. Attackers may utilize this technique to escalate privileges by running actions in a higher integrity context without user consent. The relevant MITRE ATT&CK tactics are **Defense Evasion** (TA0005) and **Privilege Escalation** (TA0004), specifically the technique **Bypass User Account Control** (T1548.002).

  Primary telemetry sources include process creation logs from Windows (Event ID 4688) which capture command-line arguments used to launch processes. If the command-line shows exceptions of unexpected parameters or execute paths, it could indicate an adversarial activity. Malicious use of this technique can represent critical security incidents as it may allow attackers to gain elevated privileges unaided. This detection does not confirm that an attack has occurred unless corroborated with additional indicators, such as suspicious behaviors around privilege escalation.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 logs. Look for instances with "cleanmgr.exe /autoclean /d C:" in the command line, specifically parented by `svchost.exe`. Validate the integrity levels of these processes.

  - **Assess integrity levels:** Identify if the integrity level is 'High' or 'System' (SIDs: S-1-16-16384, S-1-16-12288). A legitimate disk cleanup typically runs at a lower integrity level.

  - **Evaluate scheduled tasks:** Inspect for unusual scheduled tasks created around the time of this event using Task Scheduler or Event ID 4698 logs. Typical tasks should include regular maintenance or update schedules.

  - **Determine user context:** Establish the user and process context that initiated the command. Check if authorized users were within administrative roles during the execution timeframe, which may signal benign usage.

  - **Review for additional indicators:** Correlate with log files such as Sysmon (Event ID 1) to spot related actions or anomalous file creations/executions that align with privilege escalation.

  - **Identify potential exfiltration:** Investigate related logs for suspicious file writes or network activity immediately following the execution of cleanmgr.exe, particularly looking for unexpected file transfers or communications.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact it poses to privileged systems. The likelihood of malicious abuse is elevated since UAC bypass techniques are frequently weaponized in attacks to gain unauthorized access. The combination of elevated command execution and evidence of scheduled tasks necessitates urgent review.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded through methods like disguising commands or using valid user credentials to execute cleanmgr.exe within acceptable parameters. Required logs must be fully configured for process creation and task scheduling to ensure comprehensive coverage. Legitimate administrative actions, such as routine system maintenance, can falsely trigger this alert. A complementary detection may include monitoring for other privilege escalation techniques under MITRE ATT&CK tactics, such as the use of Windows Management Instrumentation (WMI) for task automation.

