note: |
  ### Technical Context

  This Sigma rule detects potentially malicious behavior involving the creation of scheduled tasks using the `schtasks.exe` utility to execute a payload that is retrieved from the Windows Registry. The objective of the attacker in this case is likely to establish persistence on the compromised system by executing a PowerShell command that decodes and runs a hidden payload. This activity aligns with the MITRE ATT&CK techniques for Persistence (T1053.005) and Command and Scripting Interpreter (T1059.001).

  Primary telemetry sources include process creation logs from Windows (Security Event ID 4688) and Sysmon Event ID 1, which capture details about command line execution. If this behavior is indeed malicious, it can lead to unauthorized access, data exfiltration, or lateral movement within the network. However, it’s important to note that this detection does NOT confirm whether the payload executed is indeed malicious — it simply indicates that a scheduled task creation was attempted under suspicious circumstances.

  ### Investigation Steps

  - **Identify the scheduled task creation event:** Review Security Event ID 4688 for process creation by `schtasks.exe`. Check for paths involved in command line arguments and validate against expected command structures.

  - **Analyze command line details:** Examine the command line of the detected process creation for keywords such as `/Create`, `Get-ItemProperty`, and Base64 encoding indicators. Legitimate scheduled tasks do not typically involve fetching commands from the registry using these methods.

  - **Correlate with Sysmon logs:** Validate against Sysmon Event ID 1 for additional context on process creation. Look for parent-child process relationships to identify if `schtasks.exe` was spawned from a legitimate application or a suspicious parent process.

  - **Review registry access logs:** Check for any `HKCU:\SOFTWARE` or `HKLM:\SOFTWARE` changes around the time of detection. This could indicate unusual registry access patterns relevant to the task creation.

  - **Identify high-confidence malicious indicators:** If the command contains `FromBase64String`, any output generated from this command should be logged and evaluated for potential malware signatures or unusual behavior.

  - **Review legitimate scheduled task patterns:** Note the typical structure and operation of scheduled tasks in the environment; they should usually refer to known executables with clear policy use cases and not involve registry-based encoding or obfuscation mechanisms.

  ### Prioritization

  This alert is of medium severity. The impact can be significant if a system with sensitive information is compromised. Scheduled tasks executing obfuscated commands indicate a high likelihood of malicious intent, particularly if consistent with known attack patterns, like those observed in malware incidents. Such behavior is common in exploitation attempts aiming for persistence within the environment.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where an attacker may use legitimate user credentials or obfuscate command lines to avoid detection. Reliable detection relies on the availability of detailed process creation logs and Sysmon logs, which must be configured correctly. Legitimate scheduled tasks created by system administrators or maintenance scripts that use registry access might trigger this alert, leading to false positives. A companion detection related to abnormal registry changes (e.g., monitoring `reg add` or `reg delete` events) can strengthen coverage against this behavior.

