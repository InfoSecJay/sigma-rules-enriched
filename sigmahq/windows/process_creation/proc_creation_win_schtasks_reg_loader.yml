detection:
  selection_img:
        # schtasks.exe /Create /F /TN "{97F2F70B-10D1-4447-A2F3-9B070C86E261}" /TR "cmd /c start /min \"\" powershell.exe -Command IEX([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String((Get-ItemProperty -Path HKCU:\SOFTWARE\Pvoeooxf).yzbbvhhdypa))) " /SC MINUTE /MO 30
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_create:
    CommandLine|contains: '/Create'
  selection_cli_get:
    CommandLine|contains:
    - 'Get-ItemProperty'
    - ' gp '         # Alias
  selection_cli_hive:
    CommandLine|contains:
    - 'HKCU:'
    - 'HKLM:'
    - 'registry::'
    - 'HKEY_'
  filter_main_encoding:
    CommandLine|contains:
    - 'FromBase64String'
    - 'encodedcommand'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of Windows scheduled tasks that potentially execute malicious payloads stored in the Windows Registry using PowerShell. The scheduled tasks are constructed via `schtasks.exe` with a specific command line format that indicates an attempt to retrieve and execute encoded commands. Attackers may employ this technique to maintain persistence within a compromised environment while using PowerShell for execution, which is a common behavior among various threat actors.

  The likely attacker objectives in this scenario include privilege escalation and maintaining access to the system, achieved through the execution of payloads that may perform malicious actions such as data exfiltration or lateral movement within the network. This behavior aligns with multiple MITRE ATT&CK techniques, including **T1053.005** (Scheduled Task/Job: Scheduled Tasks with Task Scheduler) and **T1059.001** (Command and Scripting Interpreter: Windows Command Shell).

  The primary data sources that provide evidence for this detection include **process creation events** that capture the execution of `schtasks.exe`, along with command line arguments that indicate the creation and execution of the task.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze the logs for any instances of `schtasks.exe` being executed, focusing on the command line arguments to identify unusual or unauthorized task creations.

  - **Examine Command Line Arguments:** Pay special attention to command lines containing terms like `/Create`, and look for references to `Get-ItemProperty` as well as any mentions of Windows Registry paths (`HKCU:`, `HKLM:`).

  - **Inspect Registry Access Logs:** If available, gather logs associated with registry access, specifically looking for any unusual activity that correlates with the execution of scheduled tasks.

  - **Correlate with Other Activity:** Look for additional suspicious activities around the time of the scheduled task's creation, such as unusual account logins, unexpected network connections, or other indicators of lateral movement.

  ### Prioritization
  This alert is considered medium to high severity due to the potential consequences of a successful payload execution from a scheduled task. The likelihood of this behavior indicating malicious activity is increased by its association with known attack techniques that facilitate persistence and privilege escalation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage may arise from environments not logging detailed command line arguments or process creations, which could prevent the detection logic from functioning correctly. The detection logic assumes that commands executed through `schtasks.exe` will include recognizable patterns of registry manipulation, which might not always be the case. Furthermore, if logs are not appropriately collected or configured for the system under observation, the alert may generate false negatives or miss legitimate threats entirely.

