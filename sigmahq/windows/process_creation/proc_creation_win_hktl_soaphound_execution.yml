logsource:
  product: windows
  category: process_creation
detection:
  selection_1:
    CommandLine|contains:
    - ' --buildcache '
    - ' --bhdump '
    - ' --certdump '
    - ' --dnsdump '
  selection_2:
    CommandLine|contains:
    - ' -c '
    - ' --cachefilename '
    - ' -o '
    - ' --outputdirectory'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of SOAPHound, a .NET utility that can extract sensitive information from Active Directory (AD) through various command-line arguments. The intent behind using SOAPHound is typically to gather credentials, service accounts, or other critical AD data, which may facilitate further exploitation or lateral movement within an environment. It aligns with the MITRE ATT&CK technique for Active Directory Enumeration, specifically T1087 (Account Discovery).

  The primary telemetry source for this rule is Windows process creation logs, specifically focusing on CommandLine parameters that indicate SOAPHound execution, such as `--buildcache`, `--certdump`, and `--dnsdump`. If this behavior is confirmed as malicious, it could lead to unauthorized access or privilege escalation, significantly jeopardizing the integrity and confidentiality of the organization’s sensitive data. It’s essential to note that this detection does NOT confirm malicious intent solely based on the observed command-line arguments; contextual investigation is necessary.

  ### Investigation Steps

  - **Identify the process execution source:** Review Windows Event ID 4688 logs to determine the User Name and Source IP associated with the SOAPHound execution. Look for suspicious or unfamiliar accounts.

  - **Inspect command-line arguments:** Examine the CommandLine field for Windows Event ID 4688. Legitimate administrative tasks will typically not include flagged arguments like `--buildcache` or `--certdump`.

  - **Correlate with network activity:** Check for outbound connections from the identified source process in firewall logs or other network monitoring tools. Any unusual data exfiltration or connection to external IPs may indicate malicious intent.

  - **Review common behavior patterns:** Compare the execution timing and context against known administrative scripts or processes. If SOAPHound runs during unusual hours or alongside unrelated high-risk procedures, this could indicate malicious use.

  - **Evaluate file creation artifacts:** Investigate for any files created in temporary directories or specified output directories, as indicated by `--outputdirectory`. Files with sensitive AD data or unauthorized access lists should be treated as high-confidence malicious indicators.

  - **Document benign usage scenarios:** Note that legitimate tools or administrative practices might also use Active Directory enumeration tools. Clear documentation of such cases helps reduce false positives during alert triage.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive Active Directory data. The likelihood of malicious abuse is significant, as SOAPHound is often utilized by attackers for reconnaissance phases leading to impactful data breaches. As the misuse of such a tool is common in targeted attacks, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete command-line logging or if the tool is executed in ways that evade detection, such as being run from memory. Establishing logging for process creation events is critical for reliable detection. Legitimate activities could trigger this alert, such as authorized security assessments or administrative tasks that use similar tools but with different parameters. To enhance coverage, consider companion detections for other Active Directory enumeration techniques like `PowerView` or `BloodHound`.

