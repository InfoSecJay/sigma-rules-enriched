note: |
  ### Technical Context
  This rule detects the execution of SOAPHound, a tool designed for collecting sensitive Active Directory (AD) information through specific command-line arguments that suggest data extraction activities. Attackers may leverage SOAPHound to enumerate AD environments, aiming to extract user credentials, service account information, or configurations that could lead to further exploitation of systems. This can be part of a broader strategy to establish footholds, escalate privileges, or engage in lateral movement within targeted networks.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Discovery** (T1087): The technique involves the discovery of credentials and configurations from systems and services.
  - **Account Discovery** (T1087.001): This specific sub-technique relates to obtaining information about local or domain accounts, which can be crucial for attackers looking to elevate privileges or access sensitive data.

  Primary data sources that can provide insights into this behavior include process creation events, particularly monitoring for the command-line arguments associated with the SOAPHound execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for any instances of the SOAPHound execution, paying particular attention to the command-line arguments that match known patterns indicative of extraction attempts.

  - **Inspect Active Directory Logs:** Gather LDAP query logs to identify any unusual read operations, particularly those triggered by the user or service account associated with the SOAPHound execution.

  - **Correlate User Behavior:** Investigate the user or process that initiated SOAPHound. Look for anomalous behavior or patterns, such as executing from uncommon locations or unusual hours of operation.

  - **Assess Network Traffic:** Monitor network traffic for connections initiated by SOAPHound, especially to external or unusual endpoints that could indicate data leaks or command and control activities.

  ### Prioritization
  The alert's severity is considered high due to the potential impact of SOAPHound on an enterprise's security posture, as it facilitates the extraction of critical AD data that could be exploited by malicious actors. The likelihood of encountering such a detection increases with the prevalence of attacks that aim to compromise credentials and gain unauthorized access.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if organizations do not maintain detailed process creation logs or if command-line logging is not enabled on Windows systems. The detection logic assumes that the execution of SOAPHound will include the specified command-line arguments, which may vary in different use cases or be disguised by attackers to evade detection. Continued monitoring and analysis of command-line activity are crucial, and organizations should ensure that proper logging configurations are in place to capture the necessary telemetry for this rule to be effective.

