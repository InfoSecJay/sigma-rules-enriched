  ---

  ### Technical Context

  This Sigma rule detects the execution of SOAPHound, a .NET utility that collects sensitive data from Active Directory using specific command-line arguments, such as `--buildcache`, `--bhdump`, and similar flags. The likely objective behind its use by an attacker is to harvest credentials, enumeration information, or other sensitive data from AD, a critical action in the reconnaissance phase of an attack. Relevant MITRE ATT&CK tactics and techniques include Discovery (ID: TA0007) and Active Directory Enumeration (T1087).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details and command-line arguments. If malicious, executing this tool can lead to unauthorized access to AD information, enabling further exploitation within the environment. Importantly, this detection does NOT confirm unauthorized access or successful data exfiltration on its own, merely the execution of a potentially malicious tool.

  ---

  ### Investigation Steps

  - **Review command-line arguments:** Look for process creation logs (Event ID 4688 / Sysmon ID 1) that contain SOAPHound command-line arguments such as `--buildcache`, `--bhdump`, `--certdump`. Compare with known benign use cases; legitimate administrative tools may invoke outputs without these flags.

  - **Identify the user context:** Check the `NewProcessName` and `User` fields in the process creation logs to determine which user executed SOAPHound. Look for unusual accounts or non-administrator users executing this tool, indicating non-legitimate use.

  - **Inspect parent process relationships:** Analyze the `ParentProcessId` field in the logs to identify the parent process. Investigate if it was launched from a legitimate administrative tool like PowerShell or a remote management application.

  - **Correlate with scheduled tasks or known malicious behaviors:** Cross-reference execution times with other security events such as failed login attempts or unusual task creation (Event ID 4697) on the same host to highlight potential malicious activity.

  - **Audit file creations or references:** Validate if the execution resulted in the creation of suspicious files or directories (like output cache files). Check relevant locations for files containing sensitive information, especially in paths noted in the command-line (`--outputdirectory`).

  - **Consult known legitimate workflows:** Identify and understand regular administrative tasks that may invoke similar behaviors for context. For example, legitimate AD enumeration tools might show similar command-line structures but with different flags.

  ---

  ### Prioritization

  This alert should be classified as high severity given the potential impact on sensitive data exposure within Active Directory and the likelihood of such tools being weaponized in attacks. The execution of SOAPHound by untrusted users represents a significant risk that may point to ongoing reconnaissance or lateral movement efforts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of command-line obfuscation or execution from scripts that may mask the actual intent. Reliable detection requires enabling detailed process creation logging and monitoring of specific command-line arguments. Additionally, legitimate administrative tasks, such as troubleshooting AD or script execution by trusted administrators, could trigger this alert. A related detection, possibly monitoring for unusual PowerShell usage (T1059.001), could enhance overall coverage against similar reconnaissance activities.

