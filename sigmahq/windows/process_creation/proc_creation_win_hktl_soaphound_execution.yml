note: |
  ### Technical Context

  This Sigma rule detects the execution of SOAPHound, a tool designed to extract sensitive information from Active Directory (AD) using specific command-line arguments. These arguments suggest an intent to gather or export AD data, indicating potential reconnaissance activities targeting AD infrastructure. The likely attacker objective is to harvest credentials or organizational data for lateral movement or privilege escalation.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Tactic: Discovery
  - Technique: Active Directory Enumeration (T1087)

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. The security impact can be significant, as successful data extraction can lead to unauthorized access and data breaches. However, this detection does NOT confirm malicious intent on its own; it merely indicates that SOAPHound was executed with specific parameters.

  ### Investigation Steps

  - **Verify process creation events:** Check for Security Event ID 4688 or Sysmon Event ID 1 entries involving SOAPHound. Focus on the "New Process Name" field for known SOAPHound paths (`SOAPHound.exe`).

  - **Evaluate command-line arguments:** Review the "Command Line" field in the logs for indications of malicious arguments (e.g., `--buildcache`, `--bhdump`, etc.). Compare this with expected usage patterns of the tool, as legitimate use cases typically do not include these flags.

  - **Analyze the originating user account:** Inspect the user account that executed SOAPHound. Identify whether it has administrative privileges and whether it is a known service account or an atypical user. Look for related user activity in Windows Security logs.

  - **Check for AD data output files:** Investigate the file system for any recent creations of output files in the expected directories (e.g., where SOAPHound might write its results). Look for files indicating sensitive data extraction, such as cache files or dump files.

  - **Identify suppressed alerts:** Cross-reference the execution log with existing security alerts in your SIEM. Validate if other related alerts (e.g., unauthorized access or unusual network traffic) co-occurred during this timeframe.

  ### Prioritization

  This alert is high severity due to the high impact potential of compromised Active Directory data. The likelihood of malicious exploitation is significant, especially within corporate environments where AD is critical for user and role management. SOAPHound's specific capabilities for data extraction make this behavior relevant and commonly weaponized among threat actors.

  ### Blind Spots and Assumptions

  Detection may miss cases where SOAPHound is executed with different parameters or as part of a script that obfuscates its activity. Evasion techniques could include renaming the tool or launching it from a less suspicious parent process. Ensure that process creation logging is consistently configured on all endpoints for reliable detection. Additionally, legitimate IT administrative activities related to AD may trigger the alert, especially if tools overlap in functionality. Monitoring for related detections like PowerShell scripts that interact with AD can enhance overall coverage.

