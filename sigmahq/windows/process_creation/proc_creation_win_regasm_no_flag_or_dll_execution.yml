logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\RegAsm.exe'
  - OriginalFileName: 'RegAsm.exe'
  selection_cli:
    CommandLine|endswith:
    - 'RegAsm'
    - 'RegAsm.exe'
    - 'RegAsm.exe"'
    - "RegAsm.exe'"
  condition: all of selection_*
falsepositives:
- Legitimate use of Regasm by developers.
# Note: You can increase after an initial baseline
level: low
note: |
  ### Technical Context
  This rule detects instances where "RegAsm.exe" is executed without the usual command-line arguments or associated files, suggesting potential misuse for process injection. Typically, "RegAsm.exe" (the Assembly Registration Tool) is invoked with specific DLL file paths or a command-line flag such as "/?". The absence of such expected usage patterns may indicate that an attacker is leveraging this tool in a stealthy manner, often as part of a broader strategy to evade detection while executing injected code or malicious payloads.

  Attackers might use "RegAsm.exe" as a means to register assemblies without raising alarms, particularly in attempts to facilitate persistence or execute code via in-memory techniques. This behavior falls under the MITRE ATT&CK tactics of **Defense Evasion** and the technique **T1218.009: Signed Binary Proxy Execution**. The primary sources of telemetry that will provide the best insights include process creation logs from the Windows operating system, which record details about all executed processes and their parameters.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of "RegAsm.exe" execution to identify any occurrences without typical command-line flags or DLL specifications. Look for unusual paths or execution by non-standard user accounts.
  - **Check for Parent Process Relationships:** Investigate the parent process of the detected "RegAsm.exe" execution to determine if it correlates with other suspicious activities, especially those related to known malware or exploitation tools.
  - **Correlate with Other Logs:** Look into other logs such as Windows Event Logs or EDR alerts to identify related activities such as subsequent process creations, file writes, or network connections that may indicate malicious behavior.
  - **Assess User Context:** Evaluate the privileges and roles of the user that executed "RegAsm.exe". Determine if this user has a legitimate reason to invoke the tool, particularly in the context of their workstation or endpoint.

  ### Prioritization
  The alert's severity is low due to the possibility of legitimate use cases by developers; however, the likelihood of malicious usage warrants attention, particularly in environments with high-value assets or where advanced persistent threats are a concern.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage includes scenarios where "RegAsm.exe" is executed with legitimate command-line flags or in conjunction with other applications that could mask its use. The detection logic assumes that "RegAsm.exe" should always be associated with specific arguments. For accurate detection, it is crucial to ensure that process creation logging is enabled and that no filtering occurs that might omit relevant entries. Proper configuration of logging mechanisms is essential for this alert to function effectively.

