note: |
  ### Technical Context
  This detection rule identifies attempts to bypass User Account Control (UAC) by leveraging a known technique involving the modification of Windows token properties through the `msconfig` application. The tactic exploited is commonly described in the usage of tools like UACMe, specifically the version corresponding to method number 55. Attackers typically aim to escalate privileges without raising immediate alarms, allowing them to execute malicious code with elevated permissions.

  In this threat scenario, the predominant objectives of the attacker include gaining unauthorized access to higher privilege levels or executing commands in a high-integrity process space. This behavior is classified under the MITRE ATT&CK framework, specifically targeting techniques related to Defense Evasion (T1548) and Privilege Escalation (T1548.002), highlighting how attackers manipulate processes to avoid detection while advancing their operational goals.

  The primary data source for this detection rule is the Windows process creation logs, which provide comprehensive insights into the execution of processes and their respective command-line arguments, as well as their parent processes. By analyzing these logs, security analysts can pinpoint suspicious activities indicative of UAC bypass attempts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze process creation event logs for instances where `msconfig.exe` is invoked, particularly focusing on command line parameters and parent process details.
  - **Examine Parent Process:** Verify any instances where the parent process is `pkgmgr.exe` found in the `C:\Users\<username>\AppData\Local\Temp\` directory, as this combination may indicate an attempted UAC bypass.
  - **Check Integrity Levels:** Investigate the integrity levels of the processes involved, specifically looking for processes that are running with High or System integrity levels, which may suggest that the UAC bypass was successful.
  - **Correlate with Other Events:** Enhance the investigation by correlating findings with other potentially relevant security events, such as unusual login activities or prior privilege escalation attempts, to assess the broader context of the observed behavior.

  ### Prioritization
  This alert holds a high severity in an enterprise environment as it indicates a successful attempt at privilege escalation, which can lead to significant security breaches if left unaddressed. The likelihood of this tactic being employed in real-world attacks is notable, given its practicality and effectiveness among adversaries.

  ### Blind Spots and Assumptions
  The detection logic may not account for instances where UAC is disabled or where other legitimate administrative activities could produce similar command-line arguments. Additionally, if logging levels are insufficient or if process creation events are not adequately captured, the effectiveness of this rule may be compromised. As such, it is essential to ensure that the logging configuration for Windows Security Auditing is appropriately set to capture detailed process creation events to leverage this detection effectively.

