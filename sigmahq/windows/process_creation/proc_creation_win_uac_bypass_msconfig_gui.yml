note: |
  ### Technical Context

  This rule detects potential User Account Control (UAC) bypass attempts through a specific modification of the MSConfig token, particularly triggered by the application package manager (pkgmgr.exe) running as a parent process. The likely attacker objective is to gain higher privileges on a Windows system without triggering UAC prompts, which is a common step in privilege escalation. This behavior maps to the MITRE ATT&CK technique **"Bypass User Account Control" (T1548.002)**.

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring for executable processes with high or system integrity levels. If malicious, this could allow an adversary to execute privileged commands without detection. This detection does NOT, on its own, confirm that a UAC bypass was successful or that malicious intention is present, as legitimate administrative actions could produce similar logs.

  ### Investigation Steps

  - **Analyze process creation logs:** Check for Windows Security Event ID **4688** or Sysmon Event ID **1** to see if the process `msconfig.exe` was executed with the command line argument `-5`. Review the **CommandLine** field for this specific parameter.

  - **Examine parent process context:** Confirm the parent process is `pkgmgr.exe`. The presence of this parent in the context of UAC bypass raises suspicion. Validate using the **ParentImage** field of the process creation event.

  - **Identify executed with high integrity levels:** Filter results to events where the **IntegrityLevel** is set to **High** or **System**. Legitimate system maintenance actions should not involve the `msconfig.exe` process executed this way.

  - **Investigate for known compromise indicators:** Check for previous alerts associated with `pkgmgr.exe` and `msconfig.exe` in the last 30 days. Elevated execution from arbitrary paths can indicate a compromised host.

  - **Correlate with user authentication:** Examine logs in **Event ID 4624** or **4625** for the user that executed `msconfig.exe`. Unusual users or systems correlating with this event may warrant further investigation.

  - **Review legitimate use cases:** Acknowledge expected behavior where legitimate system administrators might execute `msconfig.exe`. This typically involves command lines without the `-5` argument and may involve tools for system troubleshooting.

  ### Prioritization

  This alert should be considered high severity due to the potential for significant security impact via privilege escalation in enterprise environments. The likelihood of malicious actors exploiting UAC bypass techniques is well-documented, increasing the urgency of investigation, especially in high-value assets.

  ### Blind Spots and Assumptions

  This detection may be evaded through modifications in the command line or the use of different parent process mechanisms. It relies on the presence of accurate process creation logs; if Windows auditing is not properly configured, key events may be missed. Legitimate administrative tasks could trigger this alert, especially in environments with high activity. A companion detection that strengthens coverage includes monitoring for **Windows Event ID 4697**, which captures new service creation, as persistence mechanisms may accompany such privilege escalation attempts.

