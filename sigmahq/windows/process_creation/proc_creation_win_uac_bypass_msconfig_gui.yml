note: |
  ### Technical Context

  This Sigma rule detects attempts to bypass User Account Control (UAC) by leveraging a specific command-line execution pattern involving `msconfig.exe`. The likely attacker objective is to escalate privileges to gain unauthorized access to sensitive system functions or files without raising alerts. This behavior relates to the MITRE ATT&CK technique T1548.002: Abuse Elevation Control Mechanism, which focuses on manipulating Windows UAC for privilege escalation.

  The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments and parent-child relationships of processes. If malicious, the security implications could be severe, as it may allow the attacker to execute high-privilege code on the affected system. Notably, this detection does not confirm whether the command was executed successfully; it only identifies that the indicator of a potential bypass pattern has occurred.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances where `msconfig.exe` is invoked with the command line `"C:\Windows\system32\msconfig.exe" -5`. Pay attention to the parent process noted as `pkgmgr.exe` in `ParentImage` attributes.

  - **Analyze command-line parameters:** Validate the parameters following `msconfig.exe`. Malicious use often includes `-5`, whereas legitimate activities would not typically invoke this parameter.

  - **Correlate with user context:** Identify the user account under which the command was executed. Legitimate administrative processes may use `msconfig.exe` but usually under an authorized user context.

  - **Check for elevated privilege levels:** Identify the process integrity level from the logs: High or System integrity levels (S-1-16-16384 for System or S-1-16-12288 for High) should be confirmed. Malicious execution usually elevates to these levels.

  - **Identify related events or indicators:** Look for multiple instances of this behavior in short timeframes, which could indicate automation or scripting. This may point toward malicious intents rather than user-initiated legitimate actions.

  ### Prioritization

  This alert is of high severity due to its potential impact on the affected system, as it enables attackers to escalate privileges undetected. The likelihood of malicious abuse is elevated, as techniques for UAC bypass are commonly weaponized in phishing exploits and other attack campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications or system processes to interact with `msconfig.exe`, which can result in false positives. Effective detection also requires that all necessary monitoring and logging capabilities for process creation are active. Additionally, users may legitimately use `msconfig.exe` for configuration changes, which could trigger this alert. Related detections could include monitoring for other UAC bypass techniques, such as direct registry manipulation or modified service configurations, to strengthen overall coverage.

