note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` with the `InstallScreenSaver` argument, which is often associated with malicious activity, such as installing a rogue screensaver that may be a trojan or another form of malware. The likely attacker objective is to execute malicious payloads on a target system under the guise of a legitimate system process. This behavior fits into the MITRE ATT&CK framework under Tactic: Execution, Technique: Command and Scripting Interpreter (T1218.011).

  The primary telemetry sources for this detection include process creation logs, specifically Windows Security Event ID 4688, and Sysmon Event ID 1 for detailed command line and image path information. A successful exploitation could allow an adversary to gain control over the system or execute further malicious activities. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate users may also execute the command for benign reasons.

  ### Investigation Steps

  - **Check process execution history:** Review Security Event ID 4688 for instances of `rundll32.exe` creation and associated command lines. Look for entries containing `InstallScreenSaver` and validate the user and context of execution.

  - **Analyze Sysmon logs for detailed context:** Gather Sysmon Event ID 1 logs to examine the command line parameters and parent processes that initiated `rundll32.exe`. Compare to known benign processes executing similar commands—e.g., system administrators setting up screensavers.

  - **Evaluate the legitimacy of the command context:** Determine what user executed the command. If the execution is by a non-administrative user on a desktop system with no known screensaver deployment scheduled, it increases suspicion of malicious activity.

  - **Investigate file creation or modifications:** Check for any files created, modified, or accessed within the typical screensaver directories (e.g., `C:\Windows\System32\`) around the time of execution. Sysmon File creation events (ID 11) can provide insights into new `.scr` files that may have been dropped.

  - **Correlate with user behavior:** Review recent user activity and configuration changes related to screen savers or unauthorized software installations, particularly if there are multiple instances of `rundll32.exe` executions using similar arguments detected.

  ### Prioritization

  This alert is assessed as medium severity due to the potential for compromise on affected systems and the possibility of lateral movement within the environment. The use of `rundll32.exe` to invoke malicious code is commonly seen in exploitation scenarios, hence the likelihood of malicious abuse is notable.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the disabling of Sysmon or insufficient logging configurations of process creation events. Additionally, legitimate administrative activities—like deploying approved screensavers—may trigger this alert. Related detections, such as invoking suspicious scripts (e.g., PowerShell commands related to screen savers), can provide additional coverage and context for investigations.

