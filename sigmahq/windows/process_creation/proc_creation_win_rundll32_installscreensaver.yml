note: |
  ### Technical Context
  This rule detects the execution of a malicious application disguised as a screensaver through the Windows utility `rundll32.exe`. Attackers may leverage this technique to execute arbitrary code by using the command `rundll32.exe desk.cpl,InstallScreenSaver`, potentially allowing for persistence or remote access within the environment. The use of `rundll32.exe` to execute `.scr` files is a known tactic associated with evading detection via legitimate processes.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (TA0005)
    - **T1218.011: Rundll32** - Execution of malicious code under the guise of legitimate Windows operations can help an attacker maintain stealth.

  Key data sources that provide evidence of this behavior include process creation events and command line logs, allowing analysts to review the invocation of `rundll32.exe` along with the associated parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `rundll32.exe` being executed. Focus on command lines containing `InstallScreenSaver` to identify potential misuse of this utility.
  - **Analyze Command Line Parameters**: Look for unusual command line arguments passed with `rundll32.exe`. Reviewing these details can reveal if the process is being used to execute a malicious screensaver, which is atypical for standard administrative tasks.
  - **Cross-Reference with Known Good**: Validate against lists of legitimate screensaver installations to identify any unauthorized applications. This may help to differentiate between benign installations and potential malicious activities.
  - **Correlate with User Activity**: Check for the user accounts linked to the execution of the process. Note any discrepancies or if the command was run by accounts with no history of screensaver configurations, indicating potential compromise.

  ### Prioritization
  This alert holds medium severity due to the risk of a legitimate system process being exploited to execute malicious code. The likelihood of this scenario occurring within an enterprise environment is non-trivial, necessitating timely investigation to mitigate potential impacts.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, particularly in environments where logging of command line parameters is disabled, or where `rundll32.exe` execution is a common practice for legitimate processes. An assumption is made that the presence of `InstallScreenSaver` in the command line is indicative of malicious intent, though some benign screensaver installations may falsely trigger this alert. For effective detection, comprehensive process creation logs with command line details must be enabled.

