note: |
  ### Technical Context

  This Sigma rule detects the execution of rundll32.exe with the command line argument "InstallScreenSaver", a method often exploited by attackers to execute arbitrary code through DLL files. The likely objective here is to execute a malicious screensaver that may contain payloads for further exploitation or persistence on the system. This behavior aligns with MITRE ATT&CK technique T1218.011 (Signed Binary Proxy Execution), which emphasizes the use of signed binaries to evade detection.

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the execution is malicious, the attacker could potentially gain unauthorized access or control over the system. However, it is important to note that the alert alone does not confirm malicious intent, as legitimate applications may utilize similar command-line arguments for valid screensaver installations.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for rundll32.exe instances with the command line containing "InstallScreenSaver". Look for associated parent processes that may indicate how the execution was triggered.

  - **Correlate with known good applications**: Identify if the rundll32.exe execution is linked to known legitimate installations of screensavers, particularly from trusted sources. Check for any signs of unusual execution patterns or timestamps.

  - **Analyze command line arguments**: Focus on the CommandLine field in the logs to verify if the executed command includes suspicious paths or additional parameters, especially those that native installations wouldn’t normally use.

  - **Validate presence of associated artifacts**: Search for newly created files in the user's AppData or Program Files directories that correspond to a screensaver installation. Look for potential indicators of compromise, such as unusual file signatures or unexpected screensaver file types.

  - **Check for anomalous user behavior**: Review user activity around the time of execution to identify any precursors to the rundll32.exe execution. Look for anomalous logins, privilege escalations, or access patterns.

  - **Identify high-confidence malicious indicators**: Confirm if the executed screensaver executable is known to be malicious by cross-referencing it against threat intelligence databases. Look specifically for hashes of known malicious screensaver files.

  ### Prioritization

  This alert should be considered medium severity due to the ability of rundll32.exe to execute potentially harmful payloads while leveraging legitimate binaries, making it a common tactic employed by attackers for defense evasion. The impact could be high if it compromises a critical system or user account, and while this technique is occasionally weaponized, it also has legitimate use cases.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of rundll32.exe for system administration tasks, which could lead to false positives. It requires proper logging configuration for Event ID 4688 or Sysmon to capture complete process activity reliably. Common legitimate activities that might trigger this alert include user-installation of new screensavers. Related detections could include monitoring for suspicious DLL loading events (e.g., monitoring for Event ID  Audit System events related to DLL loading) to enhance visibility into malicious behaviors using DLLs.

