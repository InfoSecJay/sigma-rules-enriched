detection:
  selection_name:
    Image|endswith: '\SharpLdapWhoami.exe'
  selection_pe:   # in case the file has been renamed after compilation
  - OriginalFileName|contains: 'SharpLdapWhoami'
  - Product: 'SharpLdapWhoami'
  selection_flags1:
    CommandLine|endswith:
    - ' /method:ntlm'
    - ' /method:kerb'
    - ' /method:nego'
    - ' /m:nego'
    - ' /m:ntlm'
    - ' /m:kerb'
  condition: 1 of selection*
falsepositives:
- Programs that use the same command line flags
level: high
note: |
  ### Technical Context
  This rule detects the execution of SharpLdapWhoami, a tool primarily used for gathering information about a domain controller by querying the Lightweight Directory Access Protocol (LDAP) service. Attackers may utilize this tool to enumerate user identities and permissions, which could facilitate unauthorized access, privilege escalation, or lateral movement within the network. By leveraging SharpLdapWhoami, an attacker can quietly gather sensitive information about directory structures and user attributes without raising immediate alarms.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) and the associated technique **LDAP Enumeration** (T1033). Through this method, compromised hosts can query domain controllers for information, making it an important vector for attackers during the initial compromise or lateral movement phases. The primary data sources for this detection rule are process creation events that capture the execution of suspicious applications like SharpLdapWhoami on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for the execution of `SharpLdapWhoami.exe` or indications of its renamed versions. Look for any related command line arguments that suggest LDAP enumeration activities.
  - **Analyze Command Line Arguments**: Focus on command lines utilizing flags like `/method:ntlm`, `/method:kerb`, or their variations, as these denote specific methods employed by the tool for authentication against the LDAP service.
  - **Correlate with User Activities**: Evaluate user behavior to determine if the execution of SharpLdapWhoami aligns with expected activities. Look for anomalous behaviors such as unusual times of execution or execution under non-admin accounts.
  - **Examine Network Traffic**: If possible, inspect outgoing network connections to the domain controller during the time of execution. Look for LDAP queries that could correlate with the usage of SharpLdapWhoami.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant impact on corporate networks if an adversary uses this tool for unauthorized access or privilege escalation. The likelihood of detection can vary based on the operational context of the user executing the command.

  ### Blind Spots and Assumptions
  This detection may miss instances where similar command line arguments are utilized by legitimate applications, potentially leading to false positives. The effectiveness of this rule relies on proper logging configurations for process creation events on endpoints running Windows. Additionally, if SharpLdapWhoami is executed from a file path that does not conform to the expected executable location or command line flags employed by this detection logic, the alert may not trigger as intended. Continuous monitoring and tuning of this rule may be necessary to adapt to changing threat patterns and environments.

