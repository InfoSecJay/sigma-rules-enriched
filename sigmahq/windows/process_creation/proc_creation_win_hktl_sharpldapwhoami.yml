note: |
  ### Technical Context

  This Sigma rule detects the execution of SharpLdapWhoami, a tool used to query LDAP services in a Windows environment. Attackers may employ this tool to enumerate user privileges and gather information for lateral movement, thereby facilitating unauthorized access to sensitive resources. The relevant MITRE ATT&CK tactic is Discovery, specifically technique T1033 (Service Discovery). The primary telemetry sources include process creation events (e.g., Windows Event ID 4688 and Sysmon Event ID 1), which log executable file paths, command line arguments, and user context.

  If malicious, the security impact is significant, as LDAP enumeration could reveal user identities, group memberships, and other critical information that could aid in further exploitation. Importantly, this detection does NOT confirm that an actual compromise occurred; legitimate administrative operations could trigger it.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for executions of `SharpLdapWhoami.exe` and inspect the command line used.

  - **Analyze command line arguments:** Look for command line flags ending with `/method:ntlm`, `/method:kerb`, or `/m:nego`. Legitimate activity typically uses standard LDAP tools, not custom scripts with such specific flags.

  - **Identify user context:** Confirm the user account running `SharpLdapWhoami` through event logs. Non-administrative accounts running this tool warrant additional scrutiny as it may indicate malicious behavior.

  - **Correlate with LDAP traffic:** Monitor for LDAP traffic during the same timeframe, particularly `ldap_search` operations with unusual volume or targeting sensitive OUs/groups which could indicate information gathering efforts.

  - **Cross-check against known users:** Validate if the executing user has administrative privileges. Non-privileged users executing this tool could indicate a potential breach.

  - **Validate potential exfiltration artifacts:** Look for any unusual outbound connections following execution, especially if LDAP queries are directed outside the typical organizational flow to external networks.

  ### Prioritization

  The alert is high severity due to the potential impact on sensitive systems and the likelihood of malicious use. The behavior detected is associated with legitimate administrative actions but also widely weaponized by attackers for reconnaissance purposes.

  ### Blind Spots and Assumptions

  Detection may be limited if the adversary renames the tool or uses similar command line flags from other benign applications. Thorough collection of process creation logs, especially from Sysmon, is essential for reliable detection. Legitimate tools such as system management scripts may trigger this alert. Related detections include monitoring for other LDAP enumeration tools or unusual logins to monitor for broader reconnaissance activities.

