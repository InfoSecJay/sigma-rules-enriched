note: |
  ### Technical Context

  This Sigma rule detects the dropping of password filter DLLs into the Windows System32 directory, which are often used by attackers to harvest user credentials from the Local Security Authority Subsystem Service (LSASS). The likely attacker objective is to establish a persistent foothold while gaining access to sensitive user information for credential theft. This behavior aligns with the MITRE ATT&CK tactic of Credential Access and the technique T1556.002 (Credentials from Password Filters).

  The primary telemetry source is Windows process creation logs, specifically Event ID 4688, which captures command-line execution details. The security impact if malicious includes potential credential theft leading to unauthorized access to accounts. Importantly, this detection does NOT confirm that a successful credential theft has occurred; it only indicates that a suspicious action has been attempted.

  ### Investigation Steps

  - **Verify the Command Line Arguments:** Check Windows Security Event ID 4688 for cmdline containing 'reg add' and 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'. Confirm this activity is related to a DLL drop that could be malicious.

  - **Investigate the DLL File Creation:** Look for newly created files in C:\Windows\System32 with names resembling common password filter names. Validate file creation timestamps against associated process execution.

  - **Analyze Parent Process:** Identify the parent process of the detected activity within the security logs. Confirm if it's originating from legitimate processes like 'services.exe' or 'svchost.exe'. Malicious indicators would include unexpected sources or processes like 'cmd.exe'.

  - **Check for Other Indicative Behaviors:** Review Sysmon Event ID 10 (ProcessAccess) for access to LSASS by the newly dropped DLL. This is a high-confidence malicious indicator that suggests an attempt to read sensitive information.

  - **Recognize Legitimate Usage Patterns:** Document any known scheduled tasks or legitimate applications in your environment that may adjust the LSA settings without dropping a DLL. Compare against the observed activity.

  ### Prioritization

  The alert severity is medium based on the potential impact of credential theft within the enterprise. The likelihood of this DLL drop being used for malicious purposes is high, as the technique is commonly exploited in real-world attacks against Windows environments.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of obfuscation techniques or alternate storage paths used by attackers to hide DLLs. Ensure that logging is properly configured to capture detailed process creation events. Legitimate IT maintenance activities, such as updates or modifications made by system administrators, might trigger similar alerts. Companion detections could include monitoring modifications to registry paths related to LSA to strengthen overall security posture.

