note: |
  ### Technical Context

  This rule detects the creation of a cloned LSASS process on Windows systems, which is often indicative of credential dumping activities by attackers. The likely objective of the attacker is to extract credentials or sensitive information from memory to gain unauthorized access to systems and networks. This behavior relates to the MITRE ATT&CK framework specifically under the tactic of Credential Access (TA0006) and technique T1003.001 (Credential Dumping via LSASS).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the security impact can be severe, as successful credential dumping can lead to lateral movement within the network or the compromise of critical accounts. Importantly, this detection alone does not confirm that credential dumping has occurred; further investigation is required to ascertain malicious intentions or outcomes.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 to identify the creation of the LSASS process. Look for logs indicating the process is spawned with a parent process of `lsass.exe`. Legitimate system operations will typically show only one instance of LSASS running, originating from standard system services.

  - **Review command-line arguments:** Search for unusual command-line arguments in the process creation events related to the cloned LSASS process. Malicious activities may include arguments that invoke tools or scripts known for credential dumping, while benign processes will not have these flags.

  - **Analyze process tree:** Use Sysinternals tools or similar to investigate the process tree and verify if other processes created from the LSASS clone are attempting to access sensitive data. Malicious behavior often displays unexpected child processes in the tree, while legitimate processes maintain usual parent-child relationships.

  - **Identify suspicious user accounts:** Check user accounts running the LSASS clone process. Malicious activity may come from compromised or atypical accounts, whereas legitimate usage will involve service accounts tied to administrative functions, with relevant roles assigned.

  ### Prioritization

  The severity of this alert is critical due to the potential impact of credential exposure, which can facilitate unauthorized access to sensitive information or systems. Given that credential dumping techniques are actively weaponized by adversaries, the likelihood of malicious intent from such alerts is high.

  ### Blind Spots and Assumptions

  Limitations of detection may include evasion techniques employed by attackers, such as using legitimate system tools to obfuscate activity. Reliable detection requires proper logging configurations to capture all process creation events. Legitimate activities that may trigger this alert include backup or recovery programs accessing LSASS for valid reasons. A related detection to consider is the monitoring of unusual access patterns to sensitive files or services after an LSASS clone is detected, enhancing contextual analysis.

