  ---

  ### Technical Context

  This Sigma rule detects cloning of the Local Security Authority Subsystem Service (LSASS) process, a common method employed by adversaries to harvest credentials from Windows systems. The primary objective behind this activity is to exfiltrate sensitive authentication information, which can be leveraged for lateral movement or initial access into additional systems. This behavior aligns with the MITRE ATT&CK framework under the tactic "Credential Access" and technique "Credential Dumping" (T1003, T1003.001).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Event ID 4688 (Process Creation) and Sysmon Event ID 1. If the cloning of LSASS is confirmed to be malicious, the impact could be severe, potentially leading to unauthorized access to critical systems and data breaches. It is important to note that this detection alone does not confirm malicious intent; legitimate software processes may also clone LSASS in some contexts.

  ---

  ### Investigation Steps

  - **Check for process cloning activity**: Review Security Event ID 4688 logs for process creations with the Image path ending in `\Windows\System32\lsass.exe`. Look for ParentImage indicating that the process is spawned from `lsass.exe`.

  - **Identify unusual parent processes**: Investigate the ParentImage of the LSASS clone. If parent processes are legitimate administrative tools or applications (e.g., task managers or legitimate security tools), this may indicate benign activity; otherwise, it could point to malicious intent.

  - **Analyze command-line arguments**: For the identified LSASS clone processes, check Sysmon Event ID 1 for any unusual command-line arguments that might indicate credential theft programs or other suspicious behavior.

  - **Correlate with known credential dumping tools**: Cross-reference the detected cloning with any indicators of compromise from threat intelligence regarding known credential dumping tools such as Mimikatz. Look for the execution of these tools in Event ID 4688 logs.

  - **Review Asset Criticality**: Assess the role of the affected host. If the host is a domain controller or an endpoint with elevated privileges, prioritize this investigation due to higher potential impacts.

  - **Identify legitimate processes**: Clearly document known administrative actions or applications that are allowed to clone LSASS, such as certain antivirus programs or system maintenance tools, to enhance context during the investigation.

  ---

  ### Prioritization

  Given that the affected system often contains sensitive credentials, LSASS process clones are of critical severity. The likelihood of malicious use is high, as credential dumping is a well-known attack vector. This behavior is commonly weaponized in various attack scenarios, heightening the need for prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection of LSASS process cloning may lead to false positives, especially from legitimate applications used in administrative contexts that also mimic this behavior. Properly configured logging sources, including Sysmon with detailed process logging enabled, are essential for effective detection. Additionally, benign management tools might inadvertently trigger this rule, complicating the assessment. Correlate alerts with detections from other sources, such as MDE or EDR telemetry focused on suspicious process behavior, to enhance overall situational awareness.

