  ### Technical Context

  This rule detects the execution of `TruffleSnout.exe`, a tool commonly utilized for Active Directory discovery by offensive operators. The likely attacker objective is to gather information about user accounts, groups, and organizational structures to facilitate further attacks within the target environment. This activity aligns with the MITRE ATT&CK technique T1482 - "Domain Discovery."

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the execution of this tool could enable an attacker to gather sensitive information and exploit vulnerabilities further. Importantly, the detection of `TruffleSnout.exe` does NOT, on its own, confirm that malicious activity is occurring without corroborative evidence of attempted lateral movement or exploitation.

  ### Investigation Steps

  - **Verify process execution details:** Examine Security Event ID 4688 for `TruffleSnout.exe`. Focus on fields like `NewProcessName`, `ProcessCommandLine`, and `CreatorProcessId` to assess the context of the execution and whether it's initiated by a legitimate administrative tool.

  - **Check for abnormal process parentage:** Analyze Sysmon Event ID 1 to identify the parent process for `TruffleSnout.exe`. Legitimate tool execution is typically initiated by trusted administrative applications like PowerShell or command prompt. Look for potential indications of command line obfuscation or unusual chaining (i.e., initiated by unexpected users or processes).

  - **Identify execution frequency and user accounts:** Review the execution history for `TruffleSnout.exe` within the last 30 days. High-frequency executions or executions by non-administrative accounts may indicate a malicious intent. Utilize the Windows Event Viewer or SIEM for insights on repeated access.

  - **Assess relevant AD artifacts:** Evaluate Active Directory logs for recent queries or enumeration attempts. Look for patterns such as `ldap_search` events that correspond with the expected behavior of `TruffleSnout.exe`, indicating legitimate admin activity versus potential enumeration for attack.

  - **Correlate against threat intelligence:** Cross-reference any known bad IP addresses or domains against the executing host to discern if the context aligns with known attacker patterns or behaviours associated with the use of `TruffleSnout.exe`.

  ### Prioritization

  The alert is classified as high severity due to the potential impact of AD enumeration on organizational security. Such behavior is a precursor to lateral movement and escalation of privileges, both common objectives in targeted attacks. Furthermore, the use of `TruffleSnout` is increasingly weaponized among adversaries focusing on privileged access.

  ### Blind Spots and Assumptions

  Detection may be impacted by the use of whitelisting mechanisms, which could allow `TruffleSnout.exe` to bypass detection. Consistent logging configurations for process creation (Event ID 4688) and Sysmon should be in place for reliable detection. Legitimate administrative actions, such as system audits or diagnostic tools, may inadvertently trigger this alert.

  To strengthen coverage, a related detection for unusual PowerShell commands (e.g., `Get-ADUser` or other directory queries) can provide additional context to ensure a comprehensive security posture.

