  ### Technical Context
  This detection rule targets the execution of TruffleSnout.exe, a known tool used for Active Directory (AD) enumeration by threat actors. TruffleSnout is designed to enable low-noise enumeration of AD environments, allowing attackers to gather valuable insights about user accounts, group memberships, and permissions without drawing attention. Attackers leveraging this tool typically aim to facilitate subsequent actions such as lateral movement, privilege escalation, or further reconnaissance within the target environment.

  Relevant MITRE ATT&CK techniques for this rule include:
  - **T1482: Domain Information Discovery** – This technique involves querying the domain for information related to user accounts, computers, and groups, which is precisely the capability TruffleSnout offers.
  - TruffleSnout predominantly interacts with AD to gather reconnaissance data, aligning it with tactics related to discovery and reconnaissance stages of an attack lifecycle.

  The primary data sources for effective detection of TruffleSnout execution include process creation events from the Windows operating system, as they provide insights into processes spawned on the system, including their command-line arguments and parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for any instances of TruffleSnout.exe, looking specifically for unusual instances of the process in the event timeline that might indicate unauthorized execution.

  - **Analyze Command-Line Arguments:** Investigate any command-line arguments used with TruffleSnout.exe to identify specific actions taken. This could reveal whether the tool was used for benign purposes or malicious reconnaissance.

  - **Cross-Reference User Activities:** Correlate the execution of TruffleSnout with user activities. Understand the account that executed the tool and check if it aligns with the user's typical behavior patterns or expected permissions.

  - **Monitor Network Traffic:** If possible, review network traffic to detect any exfiltration of gathered AD information or communication to external systems, which could indicate further malicious activity or data leakage.

  ### Prioritization
  This alert carries high severity due to the potential for TruffleSnout to facilitate unauthorized access or escalation of privileges within the network, representing a significant risk to enterprise security. The tool's ability to quietly gather sensitive directory information without detection poses a considerable threat, especially when executed by accounts with elevated privileges.

  ### Blind Spots and Assumptions
  This detection strategy assumes that all relevant Windows process creation events are being captured adequately. A potential gap exists if there are instances of TruffleSnout being executed from removable media or in isolated environments that do not log process creations effectively. Additionally, the detection logic presumes that threat actors will not disguise the tool’s execution through renaming or altering of the original file, which could evade the alert without further behavioral indicators. The functionality of this alert hinges on the availability of comprehensive process creation logs configured to capture all executions on endpoints within the environment.

