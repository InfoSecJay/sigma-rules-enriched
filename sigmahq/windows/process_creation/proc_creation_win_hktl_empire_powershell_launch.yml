note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that include suspicious launch parameters commonly associated with the Empire framework, a known post-exploitation tool. Attackers using Empire typically aim to maintain persistence, execute payloads, or evade detection by obfuscating their command-line arguments. This behavior primarily aligns with the MITRE ATT&CK technique **"PowerShell" (T1059.001)**.

  The primary telemetry source for this detection is Windows process creation logs, specifically using **Security Event ID 4688** and **Sysmon Event ID 1**. If malicious, the presence of these command-line parameters indicates an attempt to execute obfuscated PowerShell commands that can compromise systems and exfiltrate data. However, while this detection points to potentially malicious PowerShell activity, it does NOT confirm that an attack is occurring, as the parameters could also be used by legitimate applications unintentionally.

  ### Investigation Steps

  - **Inspect Process Creation Events:** Review Security Event ID 4688 for new PowerShell process creation. Check the command line for these indicators: ' -NoP -sta -NonI -W Hidden -Enc ', ' -nop -exec bypass -EncodedCommand '. Flag any matches for further analysis.

  - **Analyze Sysmon Logs:** Validate related **Sysmon Event ID 1** logs. Look for PowerShell command lines with the aforementioned parameters. Compare timestamps with user activity logs to identify any discrepancies that suggest unauthorized execution.

  - **Correlate with User Activity:** Check user account activity using Windows Event ID 4624 (Logon). Determine if the account executing these commands has made any recent administrative changes or executed other suspicious processes.

  - **Evaluate Known Legitimate Uses:** Identify if there are known legitimate applications or scripts in use on the system that may utilize similar command line arguments. Document these activities to minimize false positives.

  - **Identify Malicious Usage Patterns:** Look for high-confidence indicators such as encoded command execution, unusual parent process relationships (e.g., commands launched from unexpected parent processes), or anomalies in timing and execution context that deviate from normal operational patterns.

  - **Check for File Creation/Exfiltration:** Validate any spawned processes for file creation or transfer to external locations. Review for any output from **Sysmon Event ID 11** (file creation time) and assess network connections on **Event ID 5156** to mark potential exfiltration events.

  ### Prioritization

  This alert is of **high severity** due to the critical nature of PowerShell in executing commands and the elevated privileges often involved. The use of Empire parameters suggests a deliberate attempt to use obscured commands for potentially malicious purposes. This behavior is frequently associated with post-exploitation phases of an attack.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of PowerShell with similar parameters for scripting or automation. It is essential to have Windows logs configured properly to ensure complete visibility into process creations. Activities such as administrative scripts or cloud management tools could trigger the alert, leading to false positives. Companion detections include monitoring for unusual scheduled tasks or services (e.g., "Task Scheduler" Event ID 106) that could further indicate persistence mechanisms in use.

