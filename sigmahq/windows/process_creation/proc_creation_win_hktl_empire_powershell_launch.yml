detection:
  selection:
    CommandLine|contains:
    - ' -NoP -sta -NonI -W Hidden -Enc '
    - ' -noP -sta -w 1 -enc '
    - ' -NoP -NonI -W Hidden -enc '
    - ' -noP -sta -w 1 -enc'
    - ' -enc  SQB'
    - ' -nop -exec bypass -EncodedCommand '
  condition: selection
falsepositives:
- Other tools that incidentally use the same command line parameters
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify suspicious PowerShell command line parameters that are commonly associated with the Empire framework, a post-exploitation tool used by attackers. Empire utilizes PowerShell to execute commands hidden from standard detection mechanisms, providing attackers with a stealthy method to control compromised systems. The specific parameters detected, such as `-NoP`, `-sta`, `-W Hidden`, and `-enc`, indicate attempts to obfuscate the command and bypass security controls, aligning with typical adversarial behavior aimed at persistence and lateral movement.

  The MITRE ATT&CK framework is relevant in this context, specifically under the tactics of **Execution** and the techniques associated with PowerShell (T1059.001). Attackers leveraging Empire will often seek to execute commands that escalate privileges or maintain access to a network, making this detection crucial for identifying early signs of sophisticated threats.

  Primary data sources for this detection include **process creation events**, which contain details about command line executions. This information is critical for monitoring potentially malicious use of PowerShell and recognizing patterns indicative of exploitation techniques.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check PowerShell execution logs for instances related to the detected command line parameters. Focus on timestamps that align with detected activities to correlate with event logs.
  - **Analyze Process Creation Events**: Harvest and inspect process creation events from the endpoint's logs. Look for unusual patterns of execution that correspond with the PowerShell command line parameters identified, especially from non-standard parent processes.
  - **Investigate Parent Processes**: Identify the parent processes associated with the PowerShell executions, particularly focusing on legitimate processes that may have been exploited to launch suspicious PowerShell commands.
  - **Correlate with Network Activity**: Examine network logs for any outbound connections or suspicious network activity originating from affected hosts. Correlate this data with the timing of the detected PowerShell commands to determine if data exfiltration or command and control activity occurred.

  ### Prioritization
  This alert is of high severity due to the potential impact posed by an attacker utilizing Empire for post-exploitation activities. The likelihood of this behavior indicates a significant threat to enterprise environments, necessitating immediate investigation to mitigate risks.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage, particularly concerning benign applications or users that might incidentally employ similar command line parameters under legitimate circumstances. This detection assumes that the execution of PowerShell commands with these specific parameters is indicative of malicious intent, which may not always hold true. Reliable logs must be configured and collected for PowerShell script execution and process creation to ensure the rule functions effectively, including ensuring that scripts are not blocked or logged improperly.

