logsource:
  category: process_creation
  product: windows
detection:
  selection_main:
    Image|endswith: '\node.exe'
    CommandLine|contains:
    - ' -e '
    - ' --eval '
    # Add more pattern of abuse as actions
  selection_action_reverse_shell:
    CommandLine|contains|all:
    - '.exec('
    - 'net.socket'
    - '.connect'
    - 'child_process'
  condition: selection_main and 1 of selection_action_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of `node.exe`, which is commonly used in various legitimate software applications but can also be exploited by adversaries to run arbitrary code, such as establishing reverse shells. The likely attacker objective is to execute malicious scripts that may lead to data breaches, system infiltration, or lateral movement within the network. This detection maps to the MITRE ATT&CK technique "Command and Scripting Interpreter: Node.js" (T1127).

  Telemetry sources include process creation events from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is associated with a malicious actor, it may lead to significant security impacts such as unauthorized access or data compromise. This detection does NOT confirm malicious activity exclusively; further investigation is essential to rule out legitimate uses of Node.js applications.

  ### Investigation Steps

  - **Review process creation events:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 to identify when `node.exe` was executed. Look specifically for command lines containing `-e` or `--eval`. Distinguishing legitimate applications from malicious use is crucial, as many applications use `node.exe` legitimately.

  - **Analyze command line arguments:** Focus on the presence of suspicious command line arguments such as `.exec(`, `net.socket`, `.connect`, or `child_process`. A legitimate use of `node.exe` typically includes standard flags that don't suggest code execution (e.g., scripts without suspicious evaluation commands).

  - **Correlate execution with network activity:** Examine related network logs (e.g., Firewall or Proxy logs) for outbound connections initiated from the host running `node.exe`. High-risk indicators include connections to known malicious IPs and unusual ports, which may confirm reverse shell activity.

  - **Identify linked processes and parent-child relationships:** Using Sysmon logs, find any associated parent processes for `node.exe` executions (Event ID 1). Malicious instances often spawn from unexpected sources like `cmd.exe` or suspicious applications, as opposed to legitimate process hierarchies.

  - **Verify file creation or alteration timestamps:** Look into the file system for newly created or modified files around the time `node.exe` was executed. Malicious activities might leave behind newly created script files or logs that could indicate script execution or artifacts of data exfiltration.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on sensitive systems and the high likelihood of malicious exploitation, such as establishing reverse shells. The use of `node.exe` in the context of the command and scripting interpreter is often weaponized, making it essential to prioritize further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging; if `node.exe` runs without corresponding log entries or if required telemetry settings are not enabled (e.g., Sysmon), important events may be missed. Legitimate software installations may also trigger this detection if they utilize `node.exe`, therefore, context is crucial. Companion detections, such as monitoring outbound connections post `node.exe` execution, enhance coverage by confirming potential exploit activity or data exfiltration attempts.

