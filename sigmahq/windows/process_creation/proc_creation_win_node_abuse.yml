logsource:
  category: process_creation
  product: windows
detection:
  selection_main:
    Image|endswith: '\node.exe'
    CommandLine|contains:
    - ' -e '
    - ' --eval '
    # Add more pattern of abuse as actions
  selection_action_reverse_shell:
    CommandLine|contains|all:
    - '.exec('
    - 'net.socket'
    - '.connect'
    - 'child_process'
  condition: selection_main and 1 of selection_action_*
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of `node.exe`, a Node.js runtime commonly bundled with applications like VMware and Adobe. The behavior indicates an attempt by an attacker to leverage Node.js to execute arbitrary code, potentially setting up reverse shells, particularly in scenarios exploiting known vulnerabilities like Log4j. The relevant MITRE ATT&CK tactics are Defense Evasion (T1562) and Execution (T1203). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing process details and command line arguments. If confirmed malicious, this activity can lead to system compromise and unauthorized access or control over the affected asset. Importantly, this detection does not confirm intent or success of malicious activity on its own.

  ---

  ### Investigation Steps

  - **Identify process creation details:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for `node.exe` with a focus on the `CommandLine` field for indicators like `-e` or `--eval`. Note that legitimate usage (e.g., during application startup) might have no eval parameters.

  - **Check for reverse shell patterns:** Search for command lines containing keywords such as `.exec(`, `net.socket`, and `.connect`. Matches here would strongly suggest malicious intent, especially combined with known vulnerabilities.

  - **Analyze parent process relationship:** Investigate the parent process of `node.exe` execution in process creation logs; legitimate executions are often spawned by known applications (e.g., VMware). Unusual parent processes might indicate potential abuse.

  - **Correlate logs with network activity:** Validate any outbound network connections using firewall logs or network monitoring tools for unusual connections initiated from the host running `node.exe`. Legitimate applications typically connect to known endpoints.

  - **Review asset criticality:** If the affected system is a server or a system hosting sensitive data, prioritize further investigation due to the higher impact of associated risks.

  - **Gather additional context from incident history:** Check for previous alerts or incidents related to the asset to understand any patterns of misuse or exploitation that might correlate with the detected behavior.

  ---

  ### Prioritization

  This alert is deemed high severity due to the potential for arbitrary code execution, which could lead to serious compromise of critical systems. The likelihood of exploitation through Node.js is rising, especially given its association with vulnerabilities like Log4j, making it a favored method for adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if `node.exe` is legitimately used within software frameworks without suspicious command usage. Legitimate activities could include automated deployment scripts that utilize Node.js without exploitation intent. A related detection for further coverage may include monitoring for abnormal outbound connections initiated by legitimate applications identified in process creation logs.

