logsource:
  category: process_creation
  product: windows
detection:
  selection_main:
    Image|endswith: '\node.exe'
    CommandLine|contains:
    - ' -e '
    - ' --eval '
    # Add more pattern of abuse as actions
  selection_action_reverse_shell:
    CommandLine|contains|all:
    - '.exec('
    - 'net.socket'
    - '.connect'
    - 'child_process'
  condition: selection_main and 1 of selection_action_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `node.exe`, which may be abused by malicious actors to run arbitrary code, such as establishing reverse shells. The likely attacker objective is to gain remote access or control over the compromised system, often utilizing this technique in the context of exploiting vulnerabilities like Log4j. This behavior aligns with the MITRE ATT&CK technique T1127: "Trusted Developer Utilities."

  Primary telemetry sources include Windows process creation logs from Security Event ID 4688 and Sysmon Event ID 1, focusing on instances where `node.exe` is executed with specific command-line arguments indicating potential malicious activity. If the detection triggers, it could result in significant security impacts, including system compromise and data exfiltration. However, this detection does NOT confirm whether code execution has been successful or if the action was performed with malicious intent.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 and Sysmon Event ID 1 for the execution of `node.exe`. Pay attention to the `NewProcessName` field for paths that point to known directories or legitimate installations.

  - **Analyze command-line arguments:** Specifically inspect the `CommandLine` field for invocation patterns that contain `-e` or `--eval`. Even benign uses of Node.js should not commonly include these flags in standard operations.

  - **Identify malicious indicators:** Look for command-line structures that include `.exec(`, `net.socket`, or `.connect` within the same process activation. These patterns are highly indicative of reverse shell attempts and warrant immediate escalation.

  - **Validate legitimate usages:** Confirm whether the execution of `node.exe` correlates with scheduled tasks, known maintenance activities, or authorized software deployments. Activity that is tagged as legitimate should have clear, documented support cases.

  - **Check additional logs for network activity:** Correlate detected `node.exe` execution with network-related logs, such as Firewall or Proxy logs, to identify any suspicious outbound connections that may signal a successful reverse shell.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and the likelihood of exploitation by adversaries. Similar techniques have been weaponized in real-world attacks, increasing the urgency of an in-depth review.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into command-line execution in non-standard contexts, and legitimate applications utilizing `node.exe` may trigger false positives. Structured logging of command-line arguments is essential for reliable detection. Companion detection might include monitoring for unexpected outbound network connections from the affected host, as it would supplement the context of potential malicious activity.

