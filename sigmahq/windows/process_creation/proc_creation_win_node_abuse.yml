title: Potential Arbitrary Code Execution Via Node.EXE
id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
status: test
description: Detects the execution node.exe which is shipped with multiple software
  such as VMware, Adobe...etc. In order to execute arbitrary code. For example to
  establish reverse shell as seen in Log4j attacks...etc
references:
- http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
- https://www.sprocketsecurity.com/resources/crossing-the-log4j-horizon-a-vulnerability-with-no-return
- https://www.rapid7.com/blog/post/2022/01/18/active-exploitation-of-vmware-horizon-servers/
- https://nodejs.org/api/cli.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
modified: 2023-02-03
tags:
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection_main:
    Image|endswith: '\node.exe'
    CommandLine|contains:
    - ' -e '
    - ' --eval '
    # Add more pattern of abuse as actions
  selection_action_reverse_shell:
    CommandLine|contains|all:
    - '.exec('
    - 'net.socket'
    - '.connect'
    - 'child_process'
  condition: selection_main and 1 of selection_action_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of `node.exe`, a runtime environment often packaged with various legitimate applications such as VMware and Adobe. This detection is significant due to the potential malicious use of Node.js to execute arbitrary code, particularly in attacking scenarios involving reverse shells, as evidenced in high-profile exploits like those targeting the Log4j vulnerability. Attackers often manipulate `node.exe` to run scripts that can lead to unauthorized access or internal network reconnaissance, fulfilling their objective of executing malicious code in a compromised environment.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Execution** (T1203): Running malware or scripts on the target system.
  - **Defense Evasion** (T1127): Utilizing legitimate system binaries like Node.js to carry out activities that evade detection.

  The primary data sources for detecting this activity are Windows process creation logs, which can provide visibility into command line arguments and executed images, helping analysts identify potentially malicious uses of `node.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check logs for instances of `node.exe` execution, focusing on command line arguments that contain suspicious patterns, particularly those including `-e` or `--eval`.
  - **Analyze Network Activity**: Investigate any outbound connections initiated by `node.exe`, especially those that might indicate reverse shell activity or unusual external endpoints.
  - **Examine Application Context**: Verify the context in which `node.exe` is executed, including the parent process and user account used, to correlate with legitimate applications running in the environment.
  - **Identify Persistence Mechanisms**: Look for any signs of scripts or commands that persistently leverage `node.exe` to ensure continued unauthorized access or control.

  ### Prioritization
  This alert is categorized as high severity because the arbitrary execution of code can lead to critical security incidents such as data breaches or full system compromise. The likelihood of exploitation is heightened by the increasing frequency of attacks leveraging similar techniques to establish footholds within enterprise networks.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if process creation logs are not regularly monitored or if there are configurations where script block logging is not enabled in Node.js applications. The detection logic assumes that any execution of `node.exe` accompanied by specific command line patterns is suspicious; however, there may be legitimate use cases that could generate false positives. Ensuring that comprehensive logging is enabled for all applications that might spawn `node.exe` is essential for the effectiveness of this alert.

