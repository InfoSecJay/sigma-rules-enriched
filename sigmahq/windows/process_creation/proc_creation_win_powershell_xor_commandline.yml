detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Description: 'Windows PowerShell'
  - Product: 'PowerShell Core 6'
  selection_cli_xor:
    CommandLine|contains: 'bxor'
  selection_cli_other:
    CommandLine|contains:
    - 'ForEach'
    - 'for('
    - 'for '
