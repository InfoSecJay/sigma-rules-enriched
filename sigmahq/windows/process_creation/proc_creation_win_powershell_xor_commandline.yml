  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  - Description: 'Windows PowerShell'
  - Product: 'PowerShell Core 6'
  selection_cli_xor:
    CommandLine|contains: 'bxor'
  selection_cli_other:
    CommandLine|contains:
    - 'ForEach'
    - 'for('
    - 'for '
    - '-join '
    - "-join'"
    - '-join"'
    - '-join`'
    - '::Join'
    - '[char]'
  condition: all of selection_*
