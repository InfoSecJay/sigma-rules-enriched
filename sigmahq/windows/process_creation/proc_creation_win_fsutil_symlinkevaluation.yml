logsource:
  category: process_creation
  product: windows
detection:
  selection_img_proxy:
        # Note: Example command observed:  cmd.exe /c "fsutil behaviour set SymlinkEvaluation"
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_fsutil_cli:
    CommandLine|contains|all:
    - 'fsutil'
    - 'behavior'
    - 'set'
    - 'SymlinkEvaluation'
  selection_symlink_params:
    CommandLine|contains:
    - 'R2L:1'         # Remote to Local
    - 'R2R:1'         # Remote to Remote
    - 'L2L:1'         # Local to Local
  condition: all of selection_*
falsepositives:
- Legitimate usage, investigate the parent process and context to determine if 
  benign.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious modifications to NTFS symbolic link behavior through the use of the `fsutil` command. Attackers may adjust symlink evaluation settings to establish covert paths from remote systems to local resources or between remote systems, thereby facilitating lateral movement or data exfiltration. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique is **Command-Line Interface** (T1059); additionally, it plays into **Defense Evasion** (TA0005) via **Symlink Evaluation** (T1222.001).

  The primary telemetry sources for this detection are Windows process creation logs, specifically targeting Event ID 4688 and Sysmon Event ID 1, which capture command-line arguments. If malicious, this behavior could indicate a preparation phase for further exploitation or compromise. However, this detection does NOT confirm that an attacker has successfully executed malicious actions; it merely highlights the modification attempt.

  ### Investigation Steps

  - **Review command execution context:** Check the parent process of any detected command line entries that include `fsutil behavior set SymlinkEvaluation`. Analyze whether this was executed from a legitimate administrative context, such as from a known sysadmin account or domain controller.

  - **Extract command line details:** Focus on command lines within Event ID 4688 or Sysmon Event ID 1, especially looking for instances containing `fsutil`, `behavior`, `set`, and parameters like `R2L:1`, `R2R:1`, or `L2L:1`. Note that legitimate use typically does not involve these parameters.

  - **Identify high-confidence malicious indicators:** Look for symlink evaluation settings being changed immediately prior to the execution of suspicious or unusual processes. Cross-reference against known threat actor techniques that exploit symlink configurations.

  - **Validate legitimate use cases:** Confirm if recent legitimate administrative operations have included modifications to symbolic link behaviors, as these changes may occur during authorized maintenance or configuration updates in certain environments.

  - **Assess asset criticality:** Determine the role of the affected system; if it's a sensitive server, the risk level increases significantly, warranting escalated investigation.

  - **Check for persistence methods:** Investigate creation times and properties of any new symbolic links relative to system activity. Any symlinks pointing to unusual locations should be flagged for further review.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive systems if symlink behavior modifications are connected to attacker activities. The likelihood of this behavior being exploited by adversaries is moderate, as it may facilitate various malicious activities. While not common, documented cases do exist where attackers utilized such methods to hide malicious actions.

  ### Blind Spots and Assumptions

  Detection might be limited if logging for command-line activity is not properly configured or if Sysmon logging is absent. Additionally, legitimate administrative activities might trigger this alert, especially during system updates or configurations. It’s crucial to be aware that some administrators may have legitimate reasons for modifying symlink behaviors. A companion detection such as monitoring for anomalous file access patterns or unusual remote connections would provide stronger coverage and context for this behavior.

