title: Potentially Suspicious NTFS Symlink Behavior Modification
id: c0b2768a-dd06-4671-8339-b16ca8d1f27f
status: test
description: |
  Detects the modification of NTFS symbolic link behavior using fsutil, which could be used to enable remote to local or remote to remote symlinks for potential attacks.
references:
- https://www.cybereason.com/blog/cybereason-vs.-blackcat-ransomware
- https://learn.microsoft.com/fr-fr/windows-server/administration/windows-commands/fsutil-behavior
- https://thedfirreport.com/2025/06/30/hide-your-rdp-password-spray-leads-to-ransomhub-deployment/
author: frack113, The DFIR Report
date: 2022-03-02
modified: 2025-11-13
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1222.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_proxy:
        # Note: Example command observed:  cmd.exe /c "fsutil behaviour set SymlinkEvaluation"
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_fsutil_cli:
    CommandLine|contains|all:
    - 'fsutil'
    - 'behavior'
    - 'set'
    - 'SymlinkEvaluation'
  selection_symlink_params:
    CommandLine|contains:
    - 'R2L:1'         # Remote to Local
    - 'R2R:1'         # Remote to Remote
    - 'L2L:1'         # Local to Local
  condition: all of selection_*
falsepositives:
- Legitimate usage, investigate the parent process and context to determine if benign.
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to NTFS symbolic link behavior through the usage of the `fsutil` command, which can enable remote-to-local (R2L) or remote-to-remote (R2R) symbolic links on Windows systems. Attackers may leverage these capabilities to create malicious symbolic links that can facilitate unauthorized access to local resources or create paths for data exfiltration, lateral movement, or privilege escalation. By manipulating NTFS symbolic link behavior, adversaries can disguise malicious actions and evade detection mechanisms.

  This rule is particularly relevant in the context of advanced persistent threats (APTs) and ransomware operations, where attackers seek to maintain persistence and evade detection while moving across the network. It correlates with the following MITRE ATT&CK tactics and techniques:
  - **Execution** (T1059): Utilizing command-line interfaces to execute scripts or commands.
  - **Defense Evasion** (T1222.001): Manipulating system functionalities to avoid detection.

  Primary data sources for detecting this behavior include **process creation events**, which provide insights into command execution and parameters used, allowing security teams to identify suspicious commands impacting system behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs from the process creation source to identify the execution of `cmd.exe`, `powershell.exe`, or related tools that initiated the `fsutil behavior set SymlinkEvaluation` command.
  - **Analyze Command Line Arguments**: Focus on the command line arguments used, especially those indicating changes to symlink behavior (`R2L:1`, `R2R:1`, `L2L:1`). Look for unusual context or parent processes in the execution path.
  - **Investigate Parent Processes**: Identify the parent processes associated with the detected commands. Determine if they correspond to legitimate administrative tasks or if they indicate potential malicious activity.
  - **Check for Subsequent Activities**: Monitor for any subsequent activities or behaviors that exploit the newly modified symlink capabilities, such as unusual file access patterns or network communications.

  ### Prioritization
  This alert is rated as medium severity due to its potential link to malicious activities that involve access manipulation and lateral movement in a compromised environment. While not all modifications are indicative of a breach, the association with known attack techniques necessitates prompt investigation.

  ### Blind Spots and Assumptions
  The detection relies on the availability of complete process creation logs and may miss instances where commands are executed through other, non-standard means or in environments where logging is not comprehensive. An assumption made in this detection is that all legitimate usage is benign; therefore, further context is critical to filtering false positives. Additionally, the alert's effectiveness hinges on correct configurations that capture the relevant command execution details.

