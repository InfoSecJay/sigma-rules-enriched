title: Potentially Suspicious NTFS Symlink Behavior Modification
id: c0b2768a-dd06-4671-8339-b16ca8d1f27f
status: test
description: |
  Detects the modification of NTFS symbolic link behavior using fsutil, which could be used to enable remote to local or remote to remote symlinks for potential attacks.
references:
- https://www.cybereason.com/blog/cybereason-vs.-blackcat-ransomware
- https://learn.microsoft.com/fr-fr/windows-server/administration/windows-commands/fsutil-behavior
- https://thedfirreport.com/2025/06/30/hide-your-rdp-password-spray-leads-to-ransomhub-deployment/
author: frack113, The DFIR Report
date: 2022-03-02
modified: 2025-11-13
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1222.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_proxy:
        # Note: Example command observed:  cmd.exe /c "fsutil behaviour set SymlinkEvaluation"
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_fsutil_cli:
    CommandLine|contains|all:
    - 'fsutil'
    - 'behavior'
    - 'set'
    - 'SymlinkEvaluation'
  selection_symlink_params:
    CommandLine|contains:
    - 'R2L:1'         # Remote to Local
    - 'R2R:1'         # Remote to Remote
    - 'L2L:1'         # Local to Local
  condition: all of selection_*
falsepositives:
- Legitimate usage, investigate the parent process and context to determine if benign.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the modification of NTFS symbolic link behavior using `fsutil`, specifically changes to the `SymlinkEvaluation` setting which can enable the use of remote to local or remote to remote symlinks. This behavior can be exploited by adversaries to facilitate attacks such as privilege escalation or remote code execution, particularly in environments where symbolic links can bridge local and remote file systems. The relevant MITRE ATT&CK techniques are **Execution** (T1059) and **Defense Evasion** (T1222.001).

  Primary telemetry sources include Windows process creation logs, noting specific command lines executed, with a focus on `cmd.exe`, `powershell.exe`, and usage of `fsutil`. If malicious, such modifications can allow an attacker to manipulate file operations, enhancing their foothold on the target system. It is essential to note that this detection does NOT confirm an active attack on its own; it must be contextualized with additional information about the environment and processes involved.

  ---

  ### Investigation Steps

  - **Review command execution context**: Check Security Event ID 4688 for the `cmd.exe` or `powershell.exe` invocation. Analyze the parent process (e.g., legitimate administrative actions) and user context executing the command to determine if the activity correlates with normal operations.

  - **Verify fsutil command usage**: Search for relevant System event logs or PowerShell logs detailing the exact command executed, specifically for command lines containing `"fsutil behavior set SymlinkEvaluation"`. Analyze any use of parameters such as `R2L:1`, `R2R:1`, or `L2L:1` to ascertain intent.

  - **Identify high-risk indicators**: Look for a combination of command execution with parameters aimed at enabling remote symlink evaluation. A command line with all three parameters (`Remote to Local` or `Remote to Remote`) is particularly concerning when combined with suspicious parent processes.

  - **Correlate with known malicious activity**: Cross-reference the timing and context of the alert with threat intelligence sources (e.g., recent attacks related to symlink abuse) to determine if this behavior aligns with known tactics used by adversaries.

  - **Assess legitimate behavior**: Compare against typical operations performed by system administrators or automated scripts. Legitimate symlink configurations often do not require modification unless there is a specific, documented need, such as system updates or configurations.

  - **Review access logs for unusual activity**: Examine Windows Security logs (Event ID 4663) for suspicious file access patterns that may suggest exploitation of modified symlink behavior, especially surrounding sensitive directories or file types.

  ---

  ### Prioritization

  This alert is medium severity due to the potential for enabling elevated privileges or unauthorized access to sensitive files via symlink manipulation. The likelihood of malicious abuse is significant; this technique may be weaponized in targeted attacks, especially in environments vulnerable to mishandled symlink configurations.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if `fsutil` usage is embedded in legitimate scripts or tools without close scrutiny on the contexts of their execution. A primary limitation arises from environments where administrative users often modify symlink behavior for legitimate purposes. Additionally, ensure all relevant logs are collected and retained for comprehensive analysis. A companion detection that strengthens coverage could include monitoring for direct symlink creation attempts (e.g., using Sysmon Event ID 10) to identify if such modifications lead to suspicious file paths being utilized.

