title: Potentially Suspicious NTFS Symlink Behavior Modification
id: c0b2768a-dd06-4671-8339-b16ca8d1f27f
status: test
description: |
  Detects the modification of NTFS symbolic link behavior using fsutil, which could be used to enable remote to local or remote to remote symlinks for potential attacks.
references:
- https://www.cybereason.com/blog/cybereason-vs.-blackcat-ransomware
- https://learn.microsoft.com/fr-fr/windows-server/administration/windows-commands/fsutil-behavior
- https://thedfirreport.com/2025/06/30/hide-your-rdp-password-spray-leads-to-ransomhub-deployment/
author: frack113, The DFIR Report
date: 2022-03-02
modified: 2025-11-13
tags:
- attack.execution
- attack.defense-impairment
- attack.t1059
- attack.t1222.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_proxy:
        # Note: Example command observed:  cmd.exe /c "fsutil behaviour set SymlinkEvaluation"
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_fsutil_cli:
    CommandLine|contains|all:
    - 'fsutil'
    - 'behavior'
    - 'set'
    - 'SymlinkEvaluation'
  selection_symlink_params:
    CommandLine|contains:
    - 'R2L:1'         # Remote to Local
    - 'R2R:1'         # Remote to Remote
    - 'L2L:1'         # Local to Local
  condition: all of selection_*
falsepositives:
- Legitimate usage, investigate the parent process and context to determine if 
  benign.
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_fsutil_symlinkevaluation/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the invocation of `fsutil behavior set SymlinkEvaluation` command through `cmd.exe`, `powershell.exe`, or `pwsh.exe`, which modifies the behavior of NTFS symbolic links. The likely objective of an attacker executing this command is to enable remote-to-local (R2L) and remote-to-remote (R2R) symlink capabilities, potentially facilitating lateral movement or privilege escalation in compromised systems. This behavior maps to MITRE ATT&CK technique T1222.001 (File and Directory Permissions Modification), as well as T1059 (Command and Scripting Interpreter).

  Primary telemetry sources include Windows process creation logs (Event ID 4688) and command line auditing from configurations that capture command line parameters for `cmd.exe` and PowerShell. If malicious, this modification could lead to unauthorized access to sensitive files or the establishment of attack vectors for ransomware or lateral movement. However, this detection does not confirm that malicious activity is indeed occurring; legitimate administrative actions may lead to the triggering of this rule.

  ### Investigation Steps

  - **Review command invocation details:** Examine Security Event ID 4688 for occurrences of `fsutil behavior set SymlinkEvaluation` in the command line. Check the `ProcessId`, `ProcessName`, and `NewProcessName` fields to track the execution context.

  - **Check for R2L and R2R parameters:** Validate if the command line includes 'R2L:1' or 'R2R:1'. A presence of these parameters indicates a potential attempt to enable malicious symlink behavior.

  - **Assess parent process integrity:** Investigate the parent process of the `fsutil` command for legitimacy. If invoked from expected administrative tools or by users with necessary privileges, it may indicate benign activity.

  - **Identify recent symlink creations:** Review the file system for newly created symbolic links using PowerShell or cmd, focusing on paths that are unusual or contain sensitive directories. Use commands like `Get-Item -Path <linkPath>` in PowerShell.

  - **Analyze asset criticality:** Focus on systems classified as high-impact assets (e.g., Domain Controllers, critical application servers). Any invocation on these systems raises the severity of the alert.

  - **Look for associated alerts:** Confirm if there are other related detections, such as suspicious command executions using PowerShell or processes spawning associated commands, indicating a broader attack framework.

  ### Prioritization

  This alert should be classified as medium severity due to the potential impact on critical systems if exploited. Given that modifying symlink behavior can be used in advanced attack scenarios, including ransomware deployment or lateral move exploitation, the likelihood of malicious abuse is notable but must be validated through further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain telemetry, such as logs from systems that do not enforce command line logging configurations. Legitimate administrative actions by system admins could inadvertently trigger this alert, indicating a need for contextual information. Additionally, other detection rules tracking abnormal PowerShell or cmd command executions could bolster coverage against related malicious activity.

