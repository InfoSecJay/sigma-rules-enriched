title: Potentially Suspicious NTFS Symlink Behavior Modification
id: c0b2768a-dd06-4671-8339-b16ca8d1f27f
status: test
description: |
  Detects the modification of NTFS symbolic link behavior using fsutil, which could be used to enable remote to local or remote to remote symlinks for potential attacks.
references:
- https://www.cybereason.com/blog/cybereason-vs.-blackcat-ransomware
- https://learn.microsoft.com/fr-fr/windows-server/administration/windows-commands/fsutil-behavior
- https://thedfirreport.com/2025/06/30/hide-your-rdp-password-spray-leads-to-ransomhub-deployment/
author: frack113, The DFIR Report
date: 2022-03-02
modified: 2025-11-13
tags:
- attack.execution
- attack.defense-impairment
- attack.t1059
- attack.t1222.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_proxy:
        # Note: Example command observed:  cmd.exe /c "fsutil behaviour set SymlinkEvaluation"
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_fsutil_cli:
    CommandLine|contains|all:
    - 'fsutil'
    - 'behavior'
    - 'set'
    - 'SymlinkEvaluation'
  selection_symlink_params:
    CommandLine|contains:
    - 'R2L:1'         # Remote to Local
    - 'R2R:1'         # Remote to Remote
    - 'L2L:1'         # Local to Local
  condition: all of selection_*
falsepositives:
- Legitimate usage, investigate the parent process and context to determine if 
  benign.
level: medium
note: |
  ### Technical Context

  This rule detects modifications to NTFS symbolic link behavior via the `fsutil` command, specifically enabling symlink evaluation settings which could allow the creation of remote-to-local or remote-to-remote symbolic links. Such modifications are often indicative of an attacker attempting to escalate privileges or manipulate file access behaviors for malicious purposes. The relevant MITRE ATT&CK techniques include Execution (T1059) and Defense Evasion (T1222.001). Primary telemetry sources include process creation logs from Windows (Security Event ID 4688 and Sysmon Event ID 1) tracking the use of `cmd.exe`, `PowerShell`, or `pwsh.exe`. If malicious, these modifications can facilitate deeper exploitation of the system, compromising data integrity and confidentiality. This detection does not confirm that a compromise has occurred—it merely identifies that a potentially risky configuration change was attempted.

  ### Investigation Steps

  - **Review the process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 showing the execution of `cmd.exe`, `PowerShell`, or `pwsh.exe`. Look for the command line containing `fsutil behavior set SymlinkEvaluation`, noting any suspicious parent processes.

  - **Check for command parameters:** Identify if the `CommandLine` for the `fsutil` command specifically includes parameters like `R2L:1`, `R2R:1`, or `L2L:1`. These indicate malicious intent as they alter link evaluation settings that can be exploited by attackers.

  - **Validate legitimate usage:** Confirm if the detected process executions are part of legitimate administrative tasks by cross-referencing the timestamps and context against known system maintenance practices or scheduled tasks.

  - **Look for other indicators of compromise:** Analyze nearby log entries for unusual activity, such as file access patterns or other process creations coinciding with the symlink behavior modification. Specific attention should be on lateral movement tools or known malware signatures.

  - **Assess asset criticality:** If the modification occurs on a high-value asset (e.g., domain controllers or database servers), escalate the alert due to increased potential impact.

  - **Cross-reference with user behavior analytics:** Review user activities around the time of the modification. Legitimate admin actions should show reasonable safeguards and context for any discrepancies found.

  ### Prioritization

  This alert has medium severity, as modifications to NTFS symbolic link behavior may be indicative of malicious intent, particularly in critical systems. The likelihood of malicious abuse is moderate, given that these changes have clear implications for privilege escalation and lateral movement, which are commonly weaponized by threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions that also modify symlink behaviors, such as system upgrades or configuration changes from automated scripts. Required log sources include process creation logs from both Security and Sysmon, ensuring that all necessary attributes are being captured. Methods to evade this detection may include using alternative scripting languages or tools that do not trigger the same logging mechanisms. Additionally, monitoring for file changes resulting from symlink evaluations would bolster detection capabilities, thereby enriching the context of this alert.

