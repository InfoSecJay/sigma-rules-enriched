detection:
  selection:
    CommandLine|contains:
            # cme/protocols/smb/wmiexec.py (generalized execute_remote and execute_fileless)
    - 'cmd.exe /Q /c * 1> \\\\*\\*\\* 2>&1'
            # cme/protocols/smb/atexec.py:109 (fileless output via share)
    - 'cmd.exe /C * > \\\\*\\*\\* 2>&1'
            # cme/protocols/smb/atexec.py:111 (fileless output via share)
    - 'cmd.exe /C * > *\\Temp\\* 2>&1'
            # https://github.com/byt3bl33d3r/CrackMapExec/blob/d8c50c8cbaf36c29329078662473f75e440978d2/cme/helpers/powershell.py#L136 (PowerShell execution with obfuscation)
    - 'powershell.exe -exec bypass -noni -nop -w 1 -C "'
            # https://github.com/byt3bl33d3r/CrackMapExec/blob/d8c50c8cbaf36c29329078662473f75e440978d2/cme/helpers/powershell.py#L160 (PowerShell execution without obfuscation)
    - 'powershell.exe -noni -nop -w 1 -enc '
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects execution patterns characteristic of the CrackMapExec (CME) framework, which is often employed for post-exploitation activities, including lateral movement and credential dumping. The likely attacker objective involves executing arbitrary commands on remote systems to establish persistence or further exploit a network. This behavior aligns with the MITRE ATT&CK framework, specifically under "Execution" (T1059) and "Credential Dumping" (T1003) tactics.

  The primary telemetry sources for detection are Windows process creation logs, specifically monitoring CommandLine arguments in Security Event ID 4688, Sysmon Event ID 1, or PowerShell execution logs. A successful detection may indicate an active compromise, allowing adversaries to leverage credentials and gain unauthorized access to sensitive systems. Importantly, this detection does NOT confirm malicious intent without further corroborating evidence, as legitimate administrative scripts might invoke similar CommandLines.

  ### Investigation Steps

  - **Review generated process events:** Check Security Event ID 4688 or Sysmon Event ID 1 for process creation events involving `cmd.exe` or `powershell.exe`. Look specifically for the presence of suspicious CommandLines (e.g., `cmd.exe /C * > \\*\\*\\* 2>&1`).

  - **Examine parent processes:** Investigate the process tree to identify if the CME execution originated from a legitimate administrative tool or a potentially malicious source. Look for unusual parent processes such as `explorer.exe` that may suggest initial exploitation.

  - **Identify high-confidence malicious indicators:** Look for CommandLine arguments such as `-exec bypass` or `-enc` in PowerShell execution indicating possible obfuscation techniques. These are indicative of malicious tool usage rather than benign scripting activities.

  - **Analyze file creation artifacts:** For detected PowerShell commands, check file modification logs in the system's `Temp` folder for any unauthorized script or executable creations resulting from the CME execution commands. Focus on timestamps that correlate with process creation logs.

  - **Confirm legitimate activity:** Cross-reference with legitimate administrative actions that typically use `cmd.exe` or `powershell.exe` for authorized troubleshooting or system management. Validate against documented administrative scripts in the organization.

  - **Assess host criticality and asset impact:** Document the asset running CME. If it's a critical server, escalate the alert due to the potential risk of significant data compromise or further lateral movement within the environment.

  ### Prioritization

  This alert is of high severity due to the potential compromise of critical systems. The likelihood of exploitation is significant, as CrackMapExec is frequently leveraged in credential theft and lateral movement attacks, making it a commonly weaponized tool among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log detailed command execution. Evasion techniques such as altering command syntax or executing commands via non-standard scripts may bypass detection. Legitimate administrative scripts that replicate CME behaviors could trigger the alert. A related detection to consider would be monitoring for unusual PowerShell execution patterns (T1059.001) to strengthen overall visibility into potential exploitation activities.

