note: |
  ### Technical Context

  This Sigma rule detects execution patterns associated with CrackMapExec (CME), a popular post-exploitation framework used by attackers to facilitate lateral movement, privilege escalation, and persistence in Windows environments. The rule captures command-line patterns indicative of potentially malicious actions, specifically focusing on how commands are executed and where output is directed, for instance via SMB shares or temporary directories.

  The likely attacker objective is to leverage CME’s capabilities to execute commands on target systems without being detected, thus facilitating further exploitation or data exfiltration. This detection aligns with the MITRE ATT&CK techniques T1047 (Windows Management Instrumentation), T1053 (Scheduled Task/Job), T1059.001 (PowerShell), and T1059.003 (Windows Command Shell). The primary telemetry source for this detection is Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, capturing details about command-line invocations.

  If successful, malicious activity could lead to unauthorized access, data breaches, or full compromise of the target system. However, this detection does NOT confirm that malicious activity took place without further contextual investigation. It merely highlights potential abuse of the CrackMapExec tool.

  ### Investigation Steps

  - **Review executed commands:** Examine the command-line logs (Event ID 4688 or Sysmon ID 1) for instances of `cmd.exe` or `powershell.exe` containing patterns like `cmd.exe /C * > \\\\*\\*` or `powershell.exe -exec bypass`. Look for any commands executed that are not typically part of legitimate administrative functions.

  - **Assess execution context:** Identify the user account and permissions under which the command was executed. Check for anomalous accounts or those typically not associated with administrative tasks in the same process creation logs.

  - **Verify target system roles:** Determine if the target systems are typically used for legitimate administrative tasks. Investigate if they belong to sensitive roles (e.g., domain controllers or systems with critical data) and whether those systems have a history of legitimate CME usage.

  - **Correlate with network activity:** Cross-reference detected commands with network logs to identify outbound connections to known malicious IPs or unusual SMB traffic. Look for the use of `smb` protocols or file sharing connections from unusual internal IPs.

  - **Identify benign behaviors:** Note any legitimate instances of CrackMapExec use, such as authorized penetration tests or system maintenance tasks. Compare command patterns against these instances to mitigate false positives.

  - **Check for common evasion techniques:** Be alert for obfuscation—like unusual flags in PowerShell commands or unusual cmd.exe syntax—often employed by attackers to evade detection. Investigate if command syntax closely resembles that of known PowerShell injection or obfuscation techniques.

  ### Prioritization

  This alert has high severity due to the potential impact on critical systems and the likelihood of malicious abuse by actors leveraging CrackMapExec for lateral movement and exploitation. The behavior detected is commonly weaponized in cyber operations and indicates an active attempt to compromise the integrity of the environment.

  ### Blind Spots and Assumptions

  Detection may be limited by infrequent logging of command-line arguments or if process creation events are disabled. False positives may be triggered during authorized pentests or administrative tasks, as legitimate use of CME exists. Ensure logging of both PowerShell and command execution is enabled across all Windows systems. A related detection to consider is monitoring for anomalous scheduled tasks, which could indicate follow-on actions after initial exploitation, reinforcing overall coverage.

