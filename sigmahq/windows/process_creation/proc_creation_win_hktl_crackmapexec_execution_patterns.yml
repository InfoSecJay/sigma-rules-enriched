logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
            # cme/protocols/smb/wmiexec.py (generalized execute_remote and execute_fileless)
    - 'cmd.exe /Q /c * 1> \\\\*\\*\\* 2>&1'
            # cme/protocols/smb/atexec.py:109 (fileless output via share)
    - 'cmd.exe /C * > \\\\*\\*\\* 2>&1'
            # cme/protocols/smb/atexec.py:111 (fileless output via share)
    - 'cmd.exe /C * > *\\Temp\\* 2>&1'
            # https://github.com/byt3bl33d3r/CrackMapExec/blob/d8c50c8cbaf36c29329078662473f75e440978d2/cme/helpers/powershell.py#L136 (PowerShell execution with obfuscation)
    - 'powershell.exe -exec bypass -noni -nop -w 1 -C "'
            # https://github.com/byt3bl33d3r/CrackMapExec/blob/d8c50c8cbaf36c29329078662473f75e440978d2/cme/helpers/powershell.py#L160 (PowerShell execution without obfuscation)
    - 'powershell.exe -noni -nop -w 1 -enc '
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies execution patterns associated with the CrackMapExec (CME) penetration testing framework, which is commonly used by both security professionals and attackers. CME allows users to execute commands on remote systems, facilitating activities such as lateral movement, command execution, and exploitation of vulnerabilities. Attackers leveraging CME often have objectives that include credential dumping, establishing persistence, or escalating privileges within a targeted environment.

  The relevant MITRE ATT&CK tactics and techniques associated with this rule include:
  - **Execution (T1203)**: Utilizing CME for remote command execution.
  - **Privilege Escalation (T1053)**: Executing commands that may attempt to escalate privileges.
  - **Persistence (T1059.003)**: Using PowerShell scripts for executing malicious code that continues after initial infection.
  - **Lateral Movement (T1047)**: Leveraging networks and services to move laterally within an enterprise.

  Primary data sources for this detection include process creation logs, specifically monitoring command-line arguments, which will reveal possible usage of CME or related behaviors directly in Windows environments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for `cmd.exe` and `powershell.exe` invocations containing commands that match known CME patterns, focusing on those with obfuscation or redirection to UNC paths.
  - **Inspect Network Traffic**: Monitor for suspicious SMB connections, especially those targeting file shares or initiated near the times of detected CME usage.
  - **Analyze Event Logs**: Examine Windows Event Logs for unusual authentication attempts or process access related to lateral movements that could correspond with CME usage.
  - **Identify Unrecognized Commands**: Investigate any unrecognized or unusual commands executed in conjunction with CME, particularly those involving privilege escalation or output redirection.

  ### Prioritization
  The alert should be prioritized as high severity due to the potential for significant impacts, including unauthorized access to systems, privilege escalation, or full network compromise if attackers successfully execute commands via CrackMapExec within an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to scenarios where CrackMapExec is utilized with non-standard command syntax or custom scripts that do not match the defined rule patterns. Additionally, the detection logic assumes that process creation logs are enabled and adequately monitored, which may not be the case in all environments. The effectiveness of this alert also depends on the proper configuration of logging levels to capture necessary command-line arguments fully.

