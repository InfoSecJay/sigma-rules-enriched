logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\schtasks.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    - '\wsl.exe'
            # Note: office applications are covered by: 438025f9-5856-4663-83f7-52f878a70a50
  selection_msdt:
  - Image|endswith: '\msdt.exe'
  - OriginalFileName: 'msdt.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of msdt.exe launched by a suspicious parent process, a behavior commonly associated with exploiting CVE-2022-30190 (Follina). The likely objective of an attacker utilizing this exploit is to achieve remote code execution, allowing them to deploy malware or execute arbitrary commands under the context of the affected machine. This detection relates to the MITRE ATT&CK techniques for Stealth (T1218) and Masquerading (T1036).

  The primary telemetry source is Windows Process Creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, this behavior may lead to significant security impacts, including unauthorized access to system resources and data exfiltration. It is important to note that this detection does NOT confirm that a compromise has occurred on its own; it simply indicates that potentially suspicious behavior has been identified.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1. Look for instances of msdt.exe with parent processes ending in cmd.exe, powershell.exe, or other specified executables to confirm suspicious activity.

  - **Validate the context of parent process:** Ensure the parent process (e.g., cmd.exe) is not part of a legitimate admin script or automation. A benign instance may involve known administrative scripts or scheduled tasks executing msdt.exe.

  - **Examine command line arguments:** Parse the command line used by the msdt.exe process in Event ID 4688. Look for indicators like unusual parameters or calls that suggest exploitation rather than standard troubleshooting.

  - **Correlate with additional telemetry:** Review for any network activity or connections initiated after msdt.exe execution (e.g., web requests that might indicate callback activity) and correlate with Windows Firewall logs or external network intrusion detection system logs.

  - **Check for further post-exploitation behavior:** Look for subsequent execution of suspicious processes (e.g., other DLLs or executables invoked shortly after msdt.exe execution) and filter by time frame to identify any patterns indicating malicious behavior.

  - **Identify asset criticality:** Consider the role of the impacted host (e.g., server, workstation) and potential impact from exploitation. Critical assets should be prioritized for a detailed forensic examination.

  ### Prioritization

  This alert is high severity due to the capability of the detected behavior to indicate potential exploitation of a critical vulnerability (CVE-2022-30190), which can lead to significant compromise on systems. The method is well-understood among adversaries and often weaponized in targeted attacks, warranting urgent investigation if triggered.

  ### Blind Spots and Assumptions

  Limitations include potential evasion by attackers using benign-looking parent processes or legitimate administrative operations triggering the alert. Reliable detection is dependent on configuring appropriate logging settings within the environment to capture relevant execution details. Activities such as legitimate troubleshooting by support staff using msdt.exe may inadvertently trigger the alert, as could automation scripts involving msdt.exe. A related detection might include monitoring for unusual network traffic following process creation events, strengthening the investigation by correlating behavior with potential exfiltration attempts.

