logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\schtasks.exe'
    - '\wmic.exe'
    - '\wscript.exe'
    - '\wsl.exe'
            # Note: office applications are covered by: 438025f9-5856-4663-83f7-52f878a70a50
  selection_msdt:
  - Image|endswith: '\msdt.exe'
  - OriginalFileName: 'msdt.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of `msdt.exe` (Microsoft Support Diagnostic Tool) by suspicious parent processes, which could indicate exploitation of CVE-2022-30190, known as the "Follina" vulnerability. Attackers using this method can leverage a legitimate Windows tool to execute malicious commands or payloads, potentially allowing them to bypass traditional security mechanisms. The intent behind this behavior is to perform reconnaissance, facilitate lateral movement, or execute arbitrary commands undetected within a Windows environment.

  The relevant MITRE ATT&CK tactics associated with this detection include **Execution** (T1203 - Exploitation for Client Execution) and **Defense Evasion** (T1036 - Masquerading), as attackers may use legitimate tools to obfuscate their actions. The primary data sources for this detection are process creation events that provide visibility into the parent-child relationships of executed processes, highlighting any anomalies linked to the execution of `msdt.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze detailed process creation logs for instances where `msdt.exe` is launched, focusing on parent process names and command-line arguments to identify unusual patterns or previously unseen process relationships.
  - **Correlate with Other Security Tools**: Utilize SIEM or EDR tools to correlate any alerts triggered by this rule with other security telemetry, such as indicators of compromise (IOCs) from threat intelligence feeds, which may provide context for the observed behavior.
  - **Inspect Network Activity**: Check outbound network requests initiated by `msdt.exe` to determine if any connections were made to known malicious domains or IP addresses, indicating potential data exfiltration or communication with command-and-control (C2) servers.
  - **Analyze User Behavior**: Investigate the user account that triggered the alert to ascertain if it aligns with expected organizational roles and activities, and determine if multiple alerts indicate possible credential compromise or a compromised account.

  ### Prioritization
  Given the potential for significant impact, as exploitation of this vulnerability can lead to remote code execution and compromise of sensitive data, this alert should be considered high severity. The likelihood of an attacker exploiting this vulnerability in an enterprise environment is notable, particularly if the organization uses unpatched or outdated software.

  ### Blind Spots and Assumptions
  The detection logic may have gaps, particularly if the logs for process creation are not consistently collected or if there are configurations in place that do not log `msdt.exe` executions. It assumes that the environment is adequately patched against CVE-2022-30190, and discrepancies could arise if legitimate processes are misidentified as suspicious. To ensure effectiveness, proper logging of process creation should be enabled across all endpoints, and threat detection tools must be calibrated to recognize variations in 'normal' behavior based on user and operational roles.

