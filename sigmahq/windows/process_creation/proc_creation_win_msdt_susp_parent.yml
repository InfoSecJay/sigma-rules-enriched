  selection_msdt:
  - Image|endswith: '\msdt.exe'
  - OriginalFileName: 'msdt.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msdt.exe` (Microsoft Support Diagnostic Tool) initiated by suspicious parent processes such as `cmd.exe`, `PowerShell`, or `wscript.exe`. Such behavior is often linked to exploitation activity targeting CVE-2022-30190, also known as the Follina vulnerability, where attackers use `msdt.exe` to execute malicious code remotely. The relevant MITRE ATT&CK tactic is **Defense Evasion (T1036)**, and the technique is **Masquerading (T1218)**.

  The primary telemetry sources include process creation logs from Windows Event ID 4688 and Sysmon Event ID 1. If confirmed malicious, the security impact could range from data exfiltration to full system compromise. However, this detection does NOT confirm intent or successful exploitation on its own; it merely indicates suspicious use of a legitimate process.

  ### Investigation Steps

  - **Examine parent processes**: Identify the process tree for the `msdt.exe` execution, focusing on the parent process using Event ID 4688. Check if it originated from known legitimate processes. Legitimate uses of `msdt.exe` might come from user-initiated troubleshooting actions.

  - **Verify execution arguments**: Analyze the command-line arguments passed to `msdt.exe`. Unusual arguments or flags, especially those suggesting remote commands or connections, are indicative of malicious activity.

  - **Check file paths**: Confirm that the `msdt.exe` path is typical (C:\Windows\System32\msdt.exe). Look for discrepancies in file location or signs of tampering, as these can indicate malicious alterations.

  - **Review historical execution**: Utilize Sysmon Event ID 1 or Windows Event ID 4688 to determine the frequency of `msdt.exe` executions. High frequency or repeated executions within a short timeframe from suspicious parent processes may suggest malicious behavior.

  - **Investigate network activity**: Correlate any network connections initiated by the suspicious process that executes `msdt.exe`. Use network logs to review connections to unknown or untrusted external IP addresses or domains.

  - **Assess endpoint context**: Consider the role of the host where the alert was triggered. If the affected system is a server or a system with sensitive information, prioritize the investigation, as the potential impact is higher.

  ### Prioritization

  This alert is of **high severity** due to the criticality of `msdt.exe` in potential exploitation scenarios related to CVE-2022-30190. The likelihood of malicious exploitation is elevated, especially given the historical context of attacks leveraging this specific behavior.

  ### Blind Spots and Assumptions

  Detection may be limited if anti-malware solutions are being bypassed or if logs are misconfigured. Legitimate administrative tasks could inadvertently trigger this alert, particularly in environments with extensive use of PowerShell or command-line utilities. A related detection mechanism could include alerts for unusual PowerShell command executions (e.g., T1086) which could further bolster coverage against similar threats.

