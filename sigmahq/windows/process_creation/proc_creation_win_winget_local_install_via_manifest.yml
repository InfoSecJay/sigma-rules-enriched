title: Install New Package Via Winget Local Manifest
id: 313d6012-51a0-4d93-8dfc-de8553239e25
status: test
description: |
  Detects usage of winget to install applications via manifest file. Adversaries can abuse winget to download payloads remotely and execute them.
  The manifest option enables you to install an application by passing in a YAML file directly to the client.
  Winget can be used to download and install exe, msi or msix files later.
references:
- https://learn.microsoft.com/en-us/windows/package-manager/winget/install#local-install
- https://lolbas-project.github.io/lolbas/Binaries/Winget/
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
author: Sreeman, Florian Roth (Nextron Systems), frack113
date: 2020-04-21
modified: 2023-04-17
tags:
- attack.defense-evasion
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\winget.exe'
  - OriginalFileName: 'winget.exe'
  selection_install_flag:
    CommandLine|contains:
    - 'install'
    - ' add '         # https://github.com/microsoft/winget-cli/blob/02d2f93807c9851d73eaacb4d8811a76b64b7b01/src/AppInstallerCLICore/Commands/InstallCommand.h
  selection_manifest_flag:
    CommandLine|contains:
    - '-m '
    - '--manifest'
  condition: all of selection_*
falsepositives:
- Some false positives are expected in some environment that may use this functionality
  to install and test their custom applications
level: medium
note: |
  ### Technical Context
  This rule detects the usage of the Windows Package Manager (`winget`) to install applications via local manifest files. Attackers may exploit this functionality to remotely download and execute malicious payloads by leveraging YAML manifest files. This ability to install applications non-interactively can lead to unauthorized software deployment and potentially facilitate lateral movement and persistence actions within a network. The use of `winget` for such purposes is particularly concerning because it may bypass traditional security measures by masquerading as legitimate software installation activity.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic: Execution** (TA0002)
    - **Technique: Command and Scripting Interpreter (T1059)** - Attackers can execute commands through `winget` to run malicious applications.
  - **Tactic: Defense Evasion** (TA0005)
    - **Technique: Masquerading (T1036)** - Malicious actors may disguise payload installations as legitimate software deployments.

  The best data sources for evidence collection include process creation events that capture command line arguments, specifically focusing on entries involving `winget.exe` and the flags used for installation and manifest file usage.

  ### Investigation Steps
  - **Review Command Line Arguments**: Analyze process creation logs for any instances of `winget.exe` with command line parameters indicating an installation (`install`, `-m`, `--manifest`). Pay attention to any unusual paths or scripts used in conjunction with these commands.

  - **Investigate Manifest File**: Check for any YAML files referenced during the installation process. Assess the contents of these manifests for suspicious binaries, unexpected sources, or any indicators of benign vs. malicious behavior.

  - **Monitor Network Activity**: Inspect outbound network traffic related to `winget` installations. Look for connections to known malicious domains or anomalous IP addresses that could indicate attempts to fetch payloads.

  - **Cross-reference Installed Packages**: Compare the list of installed applications against known software baselines and organizational policies to identify any unauthorized installations. Establish a process for reviewing newly installed packages.

  ### Prioritization
  Alerts generated by this detection rule should be treated with medium priority due to the potential for abuse in corporate environments. The likelihood of attackers exploiting `winget` to install unauthorized software or execute payloads directly impacts system integrity and overall security posture.

  ### Blind Spots and Assumptions
  This rule may miss instances where attackers utilize legitimate software installation processes without manifest files or machine-installed software that does not make use of `winget`. The detection logic assumes that the command line usage for `winget` correlates directly with malicious intent, which may not always hold true in environments where `winget` is used legitimately. For the alert to be effective, it is essential that relevant process creation logs are adequately captured and that `winget` installations are logged consistently through Windows Event Logs.

