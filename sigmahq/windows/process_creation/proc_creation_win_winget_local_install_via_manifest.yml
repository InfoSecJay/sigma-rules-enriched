title: Install New Package Via Winget Local Manifest
id: 313d6012-51a0-4d93-8dfc-de8553239e25
status: test
description: |
  Detects usage of winget to install applications via manifest file. Adversaries can abuse winget to download payloads remotely and execute them.
  The manifest option enables you to install an application by passing in a YAML file directly to the client.
  Winget can be used to download and install exe, msi or msix files later.
references:
- https://learn.microsoft.com/en-us/windows/package-manager/winget/install#local-install
- https://lolbas-project.github.io/lolbas/Binaries/Winget/
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
author: Sreeman, Florian Roth (Nextron Systems), frack113
date: 2020-04-21
modified: 2023-04-17
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\winget.exe'
  - OriginalFileName: 'winget.exe'
  selection_install_flag:
    CommandLine|contains:
    - 'install'
    - ' add '         # https://github.com/microsoft/winget-cli/blob/02d2f93807c9851d73eaacb4d8811a76b64b7b01/src/AppInstallerCLICore/Commands/InstallCommand.h
  selection_manifest_flag:
    CommandLine|contains:
    - '-m '
    - '--manifest'
  condition: all of selection_*
falsepositives:
- Some false positives are expected in some environment that may use this 
  functionality to install and test their custom applications
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of `winget` to install applications via a local manifest file, which can be exploited by attackers to download and execute malicious payloads. The likely attacker objective is to install unauthorized software, potentially leading to unauthorized command execution or system compromise. This behavior aligns with the MITRE ATT&CK technique **T1059** (Command and Scripting Interpreter).

  The primary telemetry sources are Windows process creation logs, specifically focusing on security Event ID **4688** or Sysmon Event ID **1**, highlighting processes where `winget.exe` is executed with specific command-line arguments. If malicious, this could lead to substantial security risks including unauthorized application installation. However, this detection does **not** confirm if the installed application is indeed malicious without further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID **4688** or Sysmon Event ID **1** where `Image` ends with `\winget.exe` and `OriginalFileName` is `winget.exe`. Detecting this without the appropriate command-line flags may indicate legitimate usage.

  - **Analyze command-line arguments:** Focus on events containing `CommandLine` with flags `install`, `add`, `-m`, or `--manifest`. Malicious activity typically includes additional unexpected file paths or URLs in these commands.

  - **Validate installed applications:** Cross-reference installations against a known list of legitimate software. If `winget` executed commands that installed software outside of expected parameters or a manifest, this may indicate malicious activity.

  - **Check for linked execution behavior:** Investigate whether the execution of `winget` follows known malicious patterns such as creating or altering scheduled tasks, which can be seen in Event ID **4697** (service installation) or **4698** (scheduled task).

  - **Identify high-confidence indicators:** Search for any `winget` executions paired with suspicious file paths leading to executables like `.exe`, `.msi`, or `.msix` that do not typically appear in legitimate corporate deployments or maintenance tasks.

  - **Document expected behavior:** Legitimate use of `winget` often includes installation of applications for corporate environments, cited in internal documentation. Compare observed behaviors to these documented processes to assess legitimacy.

  ### Prioritization

  This alert is of medium severity due to its potential impact on system integrity and application control. The likelihood of malicious abuse is moderate, given that `winget` is often exploited for installing unauthorized software. While this behavior can signal diverse attacker intentions, its frequent legitimate usage necessitates further validation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include modifying command-line parameters or disguising the installation of malicious payloads as benign applications through manifests. Reliable detection requires adequate logging configurations, particularly ensuring Sysmon is enabled to capture detailed process creation events. Legitimate activities may occur during custom application testing or software deployment scenarios, particularly in development environments. A related detection to consider is monitoring for the download of unusual files via `winget`, which could indicate an initial stage of compromise leading to this installation behavior.

