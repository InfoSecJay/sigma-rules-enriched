title: Install New Package Via Winget Local Manifest
id: 313d6012-51a0-4d93-8dfc-de8553239e25
status: test
description: |
  Detects usage of winget to install applications via manifest file. Adversaries can abuse winget to download payloads remotely and execute them.
  The manifest option enables you to install an application by passing in a YAML file directly to the client.
  Winget can be used to download and install exe, msi or msix files later.
references:
- https://learn.microsoft.com/en-us/windows/package-manager/winget/install#local-install
- https://lolbas-project.github.io/lolbas/Binaries/Winget/
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
author: Sreeman, Florian Roth (Nextron Systems), frack113
date: 2020-04-21
modified: 2023-04-17
tags:
- attack.defense-evasion
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\winget.exe'
  - OriginalFileName: 'winget.exe'
  selection_install_flag:
    CommandLine|contains:
    - 'install'
    - ' add '         # https://github.com/microsoft/winget-cli/blob/02d2f93807c9851d73eaacb4d8811a76b64b7b01/src/AppInstallerCLICore/Commands/InstallCommand.h
  selection_manifest_flag:
    CommandLine|contains:
    - '-m '
    - '--manifest'
  condition: all of selection_*
falsepositives:
- Some false positives are expected in some environment that may use this functionality
  to install and test their custom applications
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the use of the Windows Package Manager (winget) to install applications via a local manifest file. Attackers may exploit winget to remotely download and execute malicious payloads under the guise of legitimate software installations. The relevant MITRE ATT&CK tactic is Execution, with technique T1059 (Command and Scripting Interpreter). The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688. If malicious, such behavior could lead to the installation of insecure or malware-laden applications, compromising the integrity and security of the affected system. Importantly, this detection does NOT confirm malicious activity on its own; legitimate software installations using winget can trigger this alert.

  ---

  ### Investigation Steps

  - **Review the process creation logs:**
    Check Windows Security Event ID 4688 for instances where the Image path ends with '\winget.exe'. Note any unusual execution context or unexpected user accounts.

  - **Analyze command line arguments:**
    In the same Event ID 4688 logs, investigate the CommandLine field for the presence of 'install' and flags such as '-m ' or '--manifest'. Expect legitimate usage to include standard software names and sources.

  - **Correlate with application threat intel:**
    Cross-reference the installed application with known threat intelligence sources to identify if the software is flagged as malicious. Use application hashes for verification.

  - **Identify high-confidence malicious indicators:**
    Look for unusual external IP addresses or domains being contacted during the installation process in your network traffic logs. This may indicate downloading of malicious payloads.

  - **Understand legitimate usage patterns:**
    Recognize that internal development or testing teams may use winget with specific applications for development purposes. Monitor for unusual frequency or timing that diverges from standard operational patterns.

  - **Document any file creation events:**
    Validate that no unexpected executables (e.g., .exe, .msi, .msix) related to the installation manifest were created in the common directories (e.g., C:\Program Files). Use file creation and modification timestamps in your analysis.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact of successful installations on critical systems and the likelihood of such behaviors being misused by attackers to deliver payloads. The use of winget has become a common vector for abuse, particularly in targeted environments where it may not be closely monitored.

  ---

  ### Blind Spots and Assumptions

  There are potential evasion techniques, as attackers might disguise malicious payloads as trusted applications or use obfuscated command-line arguments that may evade detection. Reliable detection requires comprehensive logging of Windows process creations and regular updates to manifest files. Legitimate development environments that utilize winget could inadvertently trigger this alert. A related detection for file downloads via PowerShell (T1071.001) could enhance monitoring for suspicious behaviors associated with this rule.

