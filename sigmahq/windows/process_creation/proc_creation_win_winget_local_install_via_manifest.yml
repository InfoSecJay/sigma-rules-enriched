title: Install New Package Via Winget Local Manifest
id: 313d6012-51a0-4d93-8dfc-de8553239e25
status: test
description: |
  Detects usage of winget to install applications via manifest file. Adversaries can abuse winget to download payloads remotely and execute them.
  The manifest option enables you to install an application by passing in a YAML file directly to the client.
  Winget can be used to download and install exe, msi or msix files later.
references:
- https://learn.microsoft.com/en-us/windows/package-manager/winget/install#local-install
- https://lolbas-project.github.io/lolbas/Binaries/Winget/
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
author: Sreeman, Florian Roth (Nextron Systems), frack113
date: 2020-04-21
modified: 2023-04-17
tags:
- attack.defense-evasion
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\winget.exe'
  - OriginalFileName: 'winget.exe'
  selection_install_flag:
    CommandLine|contains:
    - 'install'
    - ' add '         # https://github.com/microsoft/winget-cli/blob/02d2f93807c9851d73eaacb4d8811a76b64b7b01/src/AppInstallerCLICore/Commands/InstallCommand.h
  selection_manifest_flag:
    CommandLine|contains:
    - '-m '
    - '--manifest'
  condition: all of selection_*
falsepositives:
- Some false positives are expected in some environment that may use this 
  functionality to install and test their custom applications
level: medium
note: |
  ### Technical Context

  This rule detects the installation of applications via WinGet using a local manifest file. An adversary may exploit this behavior to execute malicious payloads, leveraging WinGet’s ability to directly install executables, MSI, or MSIX files from a specified manifest. This action is particularly relevant during the Execution phase of the MITRE ATT&CK framework, specifically under the technique ID T1059 (Command and Scripting Interpreter).

  The primary telemetry sources for this detection are Windows process creation logs, especially Security Event ID 4688 and Sysmon Event ID 1, which capture details such as the command line arguments and the executing image. If malicious, the impact could be significant as it may allow unauthorized software installation, which could lead to a full compromise. However, this detection does not confirm that the installed application is malicious on its own; further investigation is required to ascertain the nature of the software.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for instances where the `Image` ends with `\winget.exe`. Evaluate the `CommandLine` field to confirm usage of the install command with manifest flags (e.g., containing '-m' or '--manifest').

  - **Correlate with application inventory**: Validate the software being installed against an approved application inventory. This can indicate whether the process is legitimate, especially if known software is listed.

  - **Inspect the manifest file**: If available, analyze the contents of the manifest file used for the installation. This file should detail the application being installed. Check for any references to known malware or untrusted sources.

  - **Assess recent user behavior**: Identify the user account associated with the process. Review its recent activity for any indicators of compromise or unusual behavior that may align with exploit scenarios.

  - **Identify malicious indicators**: Look for command line arguments that include suspicious URLs or unexpected executable file extensions. This could suggest an attempt to download malicious software.

  - **Understand expected usage**: In environments where WinGet is utilized, legitimate installations can involve company-specific applications. Normal behavior should be consistent with internal policies and deployment methods, such as automated installation scripts or centrally managed software distribution.

  ### Prioritization

  The alert should be considered medium severity due to the system impact, especially if the affected endpoint is critical (e.g., servers, development machines). The likelihood of malicious abuse is moderate, as adversaries frequently use software distribution mechanisms like WinGet to install malware. However, given its potential for legitimate use, additional context is necessary for accurate assessment.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate custom application installations triggering the alert, which may happen in some environments. Additionally, environments lacking proper logging configurations might not record all relevant actions, hampering detection reliability. False positives may arise from standard software deployment practices, particularly with internal applications. Related detections such as abnormal outbound network connections following a WinGet installation could provide further context and strengthen detection coverage.

