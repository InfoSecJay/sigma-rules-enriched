detection:
  selection:
    Image|contains:
    - '\JWrapper-Remote Access\'
    - '\JWrapper-Remote Support\'
    Image|endswith: '\SimpleService.exe'
  condition: selection
falsepositives:
- Legitimate usage of the tool
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the Simple Help remote access tool, a known method for establishing a command and control (C2) channel within compromised networks. Attackers often utilize remote access software like Simple Help for post-exploitation activities, enabling them to control victim systems interactively without raising immediate suspicion. The relevant MITRE ATT&CK tactic is "Command and Control" (T1071) and the technique is "Application Layer Protocol" (T1219.002).

  The primary telemetry source is Windows process creation logs, specifically Event ID 4688 from the Security log or Sysmon Event ID 1 capturing process creation events. If leveraged maliciously, this tool can lead to unauthorized access, data exfiltration, or lateral movement within the network. It is crucial to note that while this detection indicates the potential use of remote access software, it does not conclusively prove malicious intent, as the tool may be used legitimately in support operations.

  ### Investigation Steps

  - **Verify process details**: Check Security Event ID 4688 or Sysmon Event ID 1 for the execution of `SimpleService.exe`. Look for the account name, command line arguments, and parent process ID for context. Expect usage patterns consistent with legitimate software deployment for desktop support.

  - **Correlate user activity**: Review recent user activity tied to the account executing the process, using authentication logs (Event ID 4624) to ensure the account has a legitimate reason to use remote support tools. Legitimate sessions often involve known technicians during business hours.

  - **Assess log access rules**: Examine Windows Application and Services logs, focusing on whether there are specific application control rules in place that permit Simple Help on critical systems. Investigate any exceptions that might have been configured, revealing unintended exposure.

  - **Identify suspicious activity**: Look for unusual command line arguments associated with `SimpleService.exe`, such as remote connection initiation flags. High-confidence indicators of malicious usage include connections to known IP addresses or domains not associated with legitimate support services.

  - **Review network traffic**: Analyze network logs for outbound connections from the system running `SimpleService.exe` to external IP addresses that are not part of the organization's legitimate support infrastructure. Traffic to suspicious endpoints or over unencrypted channels may indicate malicious use.

  - **Analyze legitimate alternatives**: Document typical legitimate usage patterns of remote access tools in your environment, such as documented incidences of authorized remote support. Compare with current alerts to identify false positives effectively.

  ### Prioritization

  This alert has a medium severity rating. Affected systems, particularly if they handle sensitive data or critical operations, could be significantly impacted. The likelihood of malicious abuse is moderate, as remote access tools are common vectors for maintaining persistence and lateral movement in compromised environments. Their frequent use in attacks makes detection vital.

  ### Blind Spots and Assumptions

  Detection may miss incidents where legitimate users have used Simple Help without recording necessary telemetry or misconfigured application control rules. Adversaries may leverage commonly allowed remote access tools, complicating detection efforts. Furthermore, legitimate internal technical support sessions might trigger this alert. A companion detection, such as monitoring event logs for unauthorized remote desktop protocol (RDP) sessions, could enhance overall visibility into potential abuse.

