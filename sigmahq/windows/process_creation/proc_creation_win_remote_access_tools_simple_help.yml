title: Remote Access Tool - Simple Help Execution
id: 95e60a2b-4705-444b-b7da-ba0ea81a3ee2
status: test
description: |
  An adversary may use legitimate desktop support and remote access software, such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and may be allowed by application control within a target environment.
  Remote access tools like VNC, Ammyy, and Teamviewer are used frequently when compared with other legitimate software commonly used by adversaries. (Citation: Symantec Living off the Land)
references:
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-02-23
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '\JWrapper-Remote Access\'
    - '\JWrapper-Remote Support\'
    Image|endswith: '\SimpleService.exe'
  condition: selection
falsepositives:
- Legitimate usage of the tool
level: medium
note: |
  ### Technical Context
  This detection rule captures the execution of remote access tools (RATs) such as TeamViewer, Ammyy Admin, or similar applications that may be exploited by adversaries to maintain control over compromised systems. These applications, while often used for legitimate technical support purposes, can serve as interactive command and control (C2) channels when utilized improperly. Attackers may leverage these tools to bypass standard security measures, allowing them to traverse the enterprise network undetected.

  The threat scenario typically involves attackers gaining unauthorized access to systems by exploiting trusted remote support software. Their objectives can include data exfiltration, lateral movement, and establishing persistent access. The relevant MITRE ATT&CK framework includes the "Command and Control" tactic, specifically technique T1219.002, which covers the usage of remote access software for malicious purposes.

  The primary data sources for detecting these actions are Windows process creation events. Monitoring for specific image paths and executable names connected with recognized remote support tools will help identify potentially unauthorized usage.

  ### Investigation Steps
  - **Review Process Creation Logs**: Start by analyzing recent process creation events in the Windows environment to identify instances of the captured remote access tools being executed.
  - **Correlate with User Activity**: Investigate whether the user context under which the tools were executed appears legitimate. Look for any discrepancies in user behavior, such as the timing of access or the geographic location of users.
  - **Examine Network Traffic**: Analyze outbound network connections to determine if there is suspicious activity related to these remote access tools, including unusual foreign IP addresses or connections during off-hours.
  - **Audit Application Whitelisting**: Check if the execution aligns with your organization's whitelisting policies. Legitimate usage may be permissible but should be under scrutiny if it occurs outside of expected parameters.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to the potential for sweeping access to sensitive systems and data. Although remote access tools are sometimes used legitimately, their misuse significantly increases the risk of data breaches and unauthorized access.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage as not all execution instances of remote access tools may be malicious; legitimate support activities could generate false positives. The detection logic assumes that these remote access tools are operating in an unapproved manner and may not account for properly authorized access. For effective detection, logging configurations must be verified to ensure all relevant process creation events are being captured, especially in environments where application whitelisting is enforced.

