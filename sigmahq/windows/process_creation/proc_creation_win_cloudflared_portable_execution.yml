date: 2023-12-20
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cloudflared.exe'
  filter_main_admin_location:
    Image|contains:
    - ':\Program Files (x86)\cloudflared\'
    - ':\Program Files\cloudflared\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate usage of Cloudflared portable versions
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the "cloudflared" binary from non-standard locations on Windows systems. The primary intent is to catch instances where the executable is run from potentially malicious or unauthorized paths, indicating that an attacker may be attempting to tunnel network traffic from within the enterprise environment, thereby obfuscating their activities and creating a command-and-control (C2) channel.

  The threat scenario often involves attackers leveraging "cloudflared" to establish persistent tunnels for data exfiltration or remote control of compromised systems. By abusing this tool, attackers can evade traditional detection methods and communicate with external servers without being directly detected by security defenses. Relevant MITRE ATT&CK tactics associated with this behavior include **Command and Control** (TA0011) and the specific technique of **Application Layer Protocol** (T1090.001), which refers to the use of application layer protocols to communicate with C2 infrastructure.

  The primary data sources for effective detection include **process creation events**, which log the execution of applications on Windows systems, providing insight into the paths from which executables are run.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for instances of `cloudflared.exe` being executed. Look specifically for unusual paths outside of the standard installation directories.

  - **Analyze Network Activity:** Inspect network logs for outbound connections originating from the system where `cloudflared.exe` was executed. Focus on unusual external IP addresses and ports that do not conform to normal baselines.

  - **Check for Other Indicators of Compromise:** Investigate related artifacts such as scheduled tasks, installed services, or anything that could indicate persistence mechanisms tied to the execution of `cloudflared`.

  - **Review Authorized Software Lists:** Compare the execution logs against known and authorized software lists to determine whether the observed instance aligns with legitimate usage, or if it is an unauthorized instance that necessitates further action.

  ### Prioritization
  This alert should be considered medium priority due to the potential threat posed by unauthorized tunnels created via `cloudflared`. Although the likelihood of false positives exists with legitimate usage, unauthorized execution could indicate a serious breach, making prompt investigation essential.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage, primarily due to potential legitimate usage of `cloudflared`, especially in configurations where it is officially sanctioned. The detection logic assumes that any execution from outside standard paths is suspicious, which may not always hold true in environments where custom configurations or software are implemented. For accurate detection, it is crucial that process creation logging is enabled and configured to capture all pertinent details of executed processes. Additionally, if other means of execution (e.g., scripts or batch files invoking `cloudflared`) are present, they may not be captured by this rule.

