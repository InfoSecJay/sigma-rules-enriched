level: medium
note: |
  ### Technical Context

  This rule detects the execution of the "cloudflared" binary from a non-standard location on Windows systems. Attackers may use cloudflared to establish unauthorized tunnels for command-and-control (C2) purposes, exfiltrate data, or facilitate lateral movement within the network. The relevant MITRE ATT&CK techniques involved are Command and Control (T1090) and specifically the use of non-standard tools for creating tunnels (T1090.001).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior indicates that an attacker is potentially using cloudflared for nefarious purposes, which could result in significant security impacts, such as data breaches or network compromise. Importantly, this detection does NOT confirm malicious intent on its own. Legitimate applications of cloudflared also exist, particularly in cloud and network environments.

  ### Investigation Steps

  - **Check the execution path of cloudflared:**
    Review the process creation logs for Security Event ID 4688 or Sysmon Event ID 1 that include the path of `cloudflared.exe`. Look for non-standard paths outside of `C:\Program Files\` or `C:\Program Files (x86)\`. Legitimate instances should reside in these locations.

  - **Identify the parent process:**
    Investigate the parent process of the `cloudflared.exe` instance to ascertain context. Legitimate usage might be initiated by network management tools or system administrators, as indicated by common parent processes (e.g., `powershell.exe`, `cmd.exe` with expected user accounts).

  - **Review executed parameters:**
    Check the command line arguments associated with the execution of cloudflared (found in Sysmon Event ID 1, `CommandLine` field). Look for unusual options that might suggest a malicious intent, such as tunnel destination that points to suspicious IP addresses or domains.

  - **Cross-reference with known malicious indicators:**
    Validate the presence of IPs or domains in threat intelligence feeds that are associated with malicious cloudflared activity. Specific patterns or hostname signatures should trigger further scrutiny.

  - **Assess network traffic for suspicious activity:**
    Monitor network traffic from the host running cloudflared, particularly for outbound requests to external IPs. Investigate if the traffic corresponds to known command-and-control destinations or if it's anomalous for the host’s typical behavior.

  ### Prioritization

  This alert is classified as medium severity due to the potential risk related to unauthorized tunneling and C2 capabilities. The likelihood of abuse is significant, especially if the affected system is critical and has access to sensitive resources. The usage of cloudflared for malicious purposes has been observed in various adversarial campaigns.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if the logs are not configured correctly or if cloudflared is executed with obfuscation techniques. Legitimate activities such as system administration or cloud-based operations can lead to false positives. Consider additional detections that monitor for unusual process creation patterns or unusual outbound connections to further strengthen coverage against C2 activities.

