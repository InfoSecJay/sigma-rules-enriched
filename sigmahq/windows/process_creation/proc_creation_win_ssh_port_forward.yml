note: |
  ### Technical Context

  This Sigma rule detects the use of the `ssh.exe` process with a command line that includes remote port forwarding (`-R` option). The behavior indicates possible attempts to create a tunnel for unauthorized data transmission or command and control (C2) communication by an attacker. The likely objective includes establishing persistence or lateral movement within the network to exfiltrate data or communicate with external malicious infrastructure.

  This detection maps to the MITRE ATT&CK tactics of Command and Control (T1072) and Lateral Movement (T1021.001 and T1021.004). The primary telemetry source is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to significant data breaches or unauthorized access to sensitive systems. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also use similar commands for valid purposes.

  ### Investigation Steps

  - **Review the process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for instances of `ssh.exe` being executed with the `-R` argument. Focus on the `CommandLine` field for context.

  - **Identify the user executing the command**: Determine if the behavior was initiated by an account with administrative privileges or a known legitimate user. Analyze the `NewProcessName` and `UserName` fields in the logs.

  - **Cross-reference with approved activities**: Validate whether the observed port forwarding aligns with authorized administrative practices. Check internal documentation and procedures for any legitimate use cases for `ssh` with remote port forwarding.

  - **Check for associated outbound connections**: Investigate any active connections established by `ssh.exe`. Use network logs to find connections from the subject machine to external IPs and verify with the `DestinationIP` in your firewall or proxy logs.

  - **Analyze the persistence of the activity**: Look in the registry or application logs for any signs of `ssh.exe` being set up for recurring execution, such as scheduled tasks or startup scripts that may indicate the goal of maintaining presence.

  - **Identify high-confidence malicious artifacts**: Look for unusual or unexpected network activity that originates from the affected machine following the execution of the `ssh.exe -R` command, such as connections to known bad IP addresses or domains.

  ### Prioritization

  This alert is of medium severity due to its potential for significant data exfiltration or lateral movement within a network. While port forwarding can indicate malicious behavior, it can also be part of legitimate administrative tasks. The likelihood of malicious exploitation exists, as this technique is common among attackers to establish covert channels.

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers use custom or different SSH clients or have disabled process logging. It requires comprehensive logging settings for Event ID 4688 and Sysmon to capture relevant information reliably. Legitimate activities, such as systems administrators performing maintenance, could trigger this alert. A related detection of outbound connections from `ssh.exe` could enhance visibility into potentially malicious behaviors associated with this technique.

