level: medium
note: |
  ### Technical Context
  This detection rule identifies port forwarding activities initiated through the `ssh.exe` executable on Windows systems. This behavior often signifies an attempt by attackers to establish a stealthy communication channel or to facilitate lateral movement within a network. Often used in legitimate administrative tasks, port forwarding can be misused by adversaries for Command and Control (C2) operations, allowing unauthorized access to internal resources while bypassing conventional network defenses.

  In typical scenarios, attackers may exfiltrate data or pivot to other systems after gaining an initial foothold in the network. The relevant MITRE ATT&CK frameworks associated with this behavior include:
  - **Tactic:** Command and Control
     - **Technique:** Application Layer Protocol (T1572)
     - **Technique:** Remote Services (T1021.001)
     - **Technique:** Remote Desktop Protocol (T1021.004)

  To effectively detect this behavior, the primary data sources considered include process creation logs, which capture instances of executable activity and their associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for instances where `ssh.exe` was executed, particularly those containing the `-R` parameter indicative of port forwarding. Verify the legitimacy of the source and context of this execution.
  - **Analyze Command-Line Arguments:** Collect and scrutinize the command-line arguments of the `ssh.exe` processes to uncover any suspicious patterns or unusual behavior that diverges from normal administrative use cases.
  - **Investigate Network Connections:** Look for associated outbound or inbound network connections to determine if there are any connections made by the forwarded ports that may indicate malicious activity or unauthorized access attempts.
  - **Correlate with User Activity:** Cross-reference user accounts associated with the detected port forwarding activity against known administrative users. Investigate if the actions correspond to legitimate administrative tasks or if further escalation is necessary.

  ### Prioritization
  The alert carries medium severity due to the potential for unauthorized lateral movement and data exfiltration through established port forwarding channels, which may compromise sensitive internal assets and threaten the integrity of the entire network.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of port forwarding, especially if attackers use alternative methods or tools not involving `ssh.exe`. The detection logic assumes that administrative users have legitimate reasons for using port forwarding, which could lead to false positives if those actions are not properly contextualized. Additionally, the rule relies on precise logging configurations to ensure all `ssh.exe` command invocations are captured, making it vital for the SIEM to be appropriately configured to log process creation events with detailed command-line information.

