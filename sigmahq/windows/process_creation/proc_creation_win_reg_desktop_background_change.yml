title: Potentially Suspicious Desktop Background Change Using Reg.EXE
id: 8cbc9475-8d05-4e27-9c32-df960716c701
related:
- id: 85b88e05-dadc-430b-8a9e-53ff1cd30aae
  type: similar
status: test
description: |
  Detects the execution of "reg.exe" to alter registry keys that would replace the user's desktop background.
  This is a common technique used by malware to change the desktop background to a ransom note or other image.
references:
- https://www.attackiq.com/2023/09/20/emulating-rhysida/
- https://research.checkpoint.com/2023/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/
- https://www.trendmicro.com/en_us/research/23/h/an-overview-of-the-new-rhysida-ransomware.html
- https://www.virustotal.com/gui/file/a864282fea5a536510ae86c77ce46f7827687783628e4f2ceb5bf2c41b8cd3c6/behavior
- https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.WindowsDesktop::Wallpaper
- https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.ControlPanelDisplay::CPL_Personalization_NoDesktopBackgroundUI
author: Stephen Lincoln @slincoln-aiq (AttackIQ)
date: 2023-12-21
tags:
- attack.persistence
- attack.impact
- attack.defense-impairment
- attack.t1112
- attack.t1491.001
logsource:
  product: windows
  category: process_creation
detection:
    # TODO: Improve this to also focus on variation using PowerShell and other CLI tools
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_flag:
    CommandLine|contains: 'add'
  selection_keys:
    CommandLine|contains:
    - 'Control Panel\Desktop'
    - 'CurrentVersion\Policies\ActiveDesktop'
    - 'CurrentVersion\Policies\System'
  selection_cli_reg_1:
    CommandLine|contains|all:
    - '/v NoChangingWallpaper'
    - '/d 1'         # Prevent changing desktop background
  selection_cli_reg_2:
    CommandLine|contains|all:
    - '/v Wallpaper'
    - '/t REG_SZ'
  selection_cli_reg_3:
    CommandLine|contains|all:
    - '/v WallpaperStyle'
    - '/d 2'         # Stretch
  condition: all of selection_reg_* and selection_keys and 1 of 
    selection_cli_reg_*
falsepositives:
- Administrative scripts that change the desktop background to a company logo or
  other image.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `reg.exe` to alter registry keys related to desktop background settings. Specifically, it identifies commands that modify the wallpaper, a behavior often exploited by malware to display ransom notes or inappropriate images. The likely attacker objective is to leverage these changes for ransom demands, disruption, or creating a deception to mask other malicious activities within a compromised system.

  This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (TA0003) and the specific technique of **Modify Existing Service** (T1112) and **Inhibit System Recovery** (T1491.001). The primary telemetry source is Windows process creation logs, where specific Event IDs (e.g., 4688) can indicate the execution of `reg.exe`. If this action is malicious, it may lead to significant operational disruptions or data loss.

  It is important to note that this detection alone does not confirm malicious intent; it may also indicate benign administrative actions, such as legitimate changes performed by IT staff.

  ### Investigation Steps

  - **Identify event details:** Review Security Event ID **4688** for the `reg.exe` process, capturing the **CommandLine**, **ParentProcessId**, and **User** fields. Look for suspicious command line parameters indicating unauthorized registry changes.

  - **Assess command execution:** Examine the command line arguments for presence of registry commands affecting desktop configuration, particularly those referencing `Control Panel\Desktop` or `CurrentVersion\Policies`. Validate if changes are consistent with organizational policy.

  - **Refer to baseline changes:** Compare the detected behavior against expected administrative actions. **Legitimate activity** may include changes to the desktop background for company branding; ensure such actions are pre-approved by the organization.

  - **Evaluate parent processes:** Investigate the **ParentProcessId** of the `reg.exe` instance. Determine if it had a suspicious origin, such as unexpected scripts or applications that are commonly associated with malware activity.

  - **Check the user context:** Analyze the user context under which `reg.exe` was executed. Actions executed by standard users may indicate potential compromise, while those from administrative accounts may have contextual legitimacy, pending established change requests.

  - **Validate unauthorized artifacts:** Look for evidence of undesirable file creations or modifications tied to ransom or deviation from standard procedures, such as changes to wallpaper files related to the changes initiated by `reg.exe`.

  ### Prioritization

  The alert severity is medium due to the potential impact on user experience and company operations if malicious. Given that background changes are a common tactic in ransomware and other malicious campaigns, a confirmed instance can escalate quickly, meriting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative actions that trigger the rule, such as routine desktop customization by IT. Evasion techniques could include the use of alternative command-line tools or scripting languages like PowerShell to make similar changes. Reliable detection requires comprehensive logging configurations, particularly ensuring that process creation events are recorded. A related rule that could strengthen coverage involves monitoring PowerShell command execution for similar registry modifications.

