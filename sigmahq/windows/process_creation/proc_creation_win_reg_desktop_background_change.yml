  type: similar
status: test
description: |
  Detects the execution of "reg.exe" to alter registry keys that would replace the user's desktop background.
  This is a common technique used by malware to change the desktop background to a ransom note or other image.
references:
- https://www.attackiq.com/2023/09/20/emulating-rhysida/
- https://research.checkpoint.com/2023/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/
- https://www.trendmicro.com/en_us/research/23/h/an-overview-of-the-new-rhysida-ransomware.html
- https://www.virustotal.com/gui/file/a864282fea5a536510ae86c77ce46f7827687783628e4f2ceb5bf2c41b8cd3c6/behavior
- https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.WindowsDesktop::Wallpaper
- https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.ControlPanelDisplay::CPL_Personalization_NoDesktopBackgroundUI
author: Stephen Lincoln @slincoln-aiq (AttackIQ)
date: 2023-12-21
tags:
- attack.persistence
- attack.defense-evasion
- attack.impact
- attack.t1112
- attack.t1491.001
logsource:
  product: windows
  category: process_creation
detection:
    # TODO: Improve this to also focus on variation using PowerShell and other CLI tools
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_flag:
    CommandLine|contains: 'add'
  selection_keys:
    CommandLine|contains:
    - 'Control Panel\Desktop'
    - 'CurrentVersion\Policies\ActiveDesktop'
    - 'CurrentVersion\Policies\System'
  selection_cli_reg_1:
    CommandLine|contains|all:
    - '/v NoChangingWallpaper'
    - '/d 1'         # Prevent changing desktop background
  selection_cli_reg_2:
    CommandLine|contains|all:
    - '/v Wallpaper'
    - '/t REG_SZ'
  selection_cli_reg_3:
    CommandLine|contains|all:
    - '/v WallpaperStyle'
    - '/d 2'         # Stretch
  condition: all of selection_reg_* and selection_keys and 1 of 
    selection_cli_reg_*
falsepositives:
- Administrative scripts that change the desktop background to a company logo or
  other image.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `reg.exe` to modify registry keys associated with desktop wallpaper settings. The likely attacker objective is to change the user's desktop background to a ransom note or other threatening image, which is a common tactic in ransomware attacks, including those utilizing the Rhysida ransomware variant. The relevant MITRE ATT&CK tactics and techniques are Persistence (T1112) and Defense Evasion (T1491.001). The primary telemetry source is Windows process creation logs, specifically looking at Event ID 4688. A successful malicious execution could result in significant operational disruption, user distress, or data loss. Importantly, this detection alone does NOT confirm malicious intent, as administrative scripts or legitimate user activity may perform similar actions.

  ### Investigation Steps

  - **Review Event Logs for Execution:** Check Windows Security Event ID 4688 logs for `reg.exe` execution events. Look for suspicious command lines containing the keywords `Control Panel\Desktop`, `CurrentVersion\Policies\ActiveDesktop`, or `CurrentVersion\Policies\System`.

  - **Analyze Command Line Arguments:** Investigate the CommandLine field of the detected `reg.exe` execution for presence of `/v Wallpaper`, `/t REG_SZ`, or `/v NoChangingWallpaper`, confirming potential changes to wallpaper settings.

  - **Identify High-Confidence Malicious Activity:** Look for modifications where the registry value for `Wallpaper` is set to an unexpected file path (e.g., a ransom note image) or the flags `/d 1` / `/d 2` are used to restrict wallpaper changes. Use values from the CommandLine for further drilling into the changes.

  - **Correlate with Other Logs:** Cross-reference the detected activity with previous user activity logs (e.g., User Logon Events - Event ID 4624) to identify if the user has a history of legitimate desktop modifications, which may indicate benign intent.

  - **Assess Environmental Context:** If `reg.exe` is executed on a server or critical asset, treat the alert as high-priority. Conversely, if this occurs on non-critical endpoints or in an administrative role known for desktop customizations, consider it lower priority.

  - **Check for Administrative Scripts:** Investigate any scheduled tasks or logon scripts that might legitimately invoke `reg.exe` for changing wallpapers company-wide. Compare the timing and context of the alert against these known scripts.

  ### Prioritization

  The alert carries medium severity due to its potential impact, particularly if associated with critical systems or user endpoints. The likelihood of malicious abuse is plausible, given the recognized tactics in recent ransomware campaigns, reinforcing that this behavior is often weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as altering legitimate processes or executing changes through PowerShell instead of direct registry modifications. Ensure that Windows auditing is properly configured to capture all potential process creations, as missing logs could hinder detection efficacy. Legitimate activities, such as company-wide desktop changes to promotional images, could trigger the alert. A related detection to consider is monitoring for the execution of PowerShell scripts modifying system registry values or changes to desktop settings.

