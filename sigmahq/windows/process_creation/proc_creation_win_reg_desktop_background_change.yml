title: Potentially Suspicious Desktop Background Change Using Reg.EXE
id: 8cbc9475-8d05-4e27-9c32-df960716c701
related:
- id: 85b88e05-dadc-430b-8a9e-53ff1cd30aae
  type: similar
status: test
description: |
  Detects the execution of "reg.exe" to alter registry keys that would replace the user's desktop background.
  This is a common technique used by malware to change the desktop background to a ransom note or other image.
references:
- https://www.attackiq.com/2023/09/20/emulating-rhysida/
- https://research.checkpoint.com/2023/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/
- https://www.trendmicro.com/en_us/research/23/h/an-overview-of-the-new-rhysida-ransomware.html
- https://www.virustotal.com/gui/file/a864282fea5a536510ae86c77ce46f7827687783628e4f2ceb5bf2c41b8cd3c6/behavior
- https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.WindowsDesktop::Wallpaper
- https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.ControlPanelDisplay::CPL_Personalization_NoDesktopBackgroundUI
author: Stephen Lincoln @slincoln-aiq (AttackIQ)
date: 2023-12-21
tags:
- attack.persistence
- attack.defense-evasion
- attack.impact
- attack.t1112
- attack.t1491.001
logsource:
  product: windows
  category: process_creation
detection:
    # TODO: Improve this to also focus on variation using PowerShell and other CLI tools
  selection_reg_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_flag:
    CommandLine|contains: 'add'
  selection_keys:
    CommandLine|contains:
    - 'Control Panel\Desktop'
    - 'CurrentVersion\Policies\ActiveDesktop'
    - 'CurrentVersion\Policies\System'
  selection_cli_reg_1:
    CommandLine|contains|all:
    - '/v NoChangingWallpaper'
    - '/d 1'         # Prevent changing desktop background
  selection_cli_reg_2:
    CommandLine|contains|all:
    - '/v Wallpaper'
    - '/t REG_SZ'
  selection_cli_reg_3:
    CommandLine|contains|all:
    - '/v WallpaperStyle'
    - '/d 2'         # Stretch
  condition: all of selection_reg_* and selection_keys and 1 of selection_cli_reg_*
falsepositives:
- Administrative scripts that change the desktop background to a company logo or other
  image.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `reg.exe` for altering registry keys related to the desktop background on Windows systems. Such actions may be leveraged by attackers to impose their ransomware's ransom note as the desktop background or alter user desktop settings for malicious purposes. Attackers often change desktop backgrounds to disrupt user activities and spread fear or confusion following an intrusion.

  The related MITRE ATT&CK techniques include **T1112: Modify Registry** and **T1491.001: Unauthorized File Deletion**. Both techniques can contribute to persistence and defense evasion by modifying user settings to implement malicious objectives. Recognizing changes to these registry keys can reveal potential unauthorized access or malicious modifications facilitated by malware, particularly ransomware like Rhysida, which has been reported to use similar tactics.

  Primary data sources to investigate include:
  - Process creation events that log command execution and parameters.
  - Registry modification logs to track changes to keys related to desktop background settings.
  - Any relevant auditing logs that provide insights into system configuration changes made on user environments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of `reg.exe` launching with command-line arguments resembling those specified in the detection logic, particularly looking for changes to `Control Panel\Desktop` or related keys.

  - **Examine Registry Modifications**: Query the Windows registry for recent changes involving `NoChangingWallpaper`, `Wallpaper`, and `WallpaperStyle` keys to identify unauthorized alterations.

  - **Analyze User Activity**: Cross-reference the timestamps of the detected `reg.exe` execution with user activity logs to determine if the changes correlate with legitimate administrative actions or user behavior.

  - **Check for Ransomware Indicators**: Look for other indicators of compromise associated with ransomware activities in the environment, such as known malicious file hashes, unusual network traffic patterns, or additional registry changes that align with malicious intents.

  ### Prioritization
  This alert is classified as medium severity due to its potential correlation with ransomware attacks. Unauthorized changes to the desktop background can indicate an ongoing attack or preparation for ransom demands, necessitating prompt investigation and response.

  ### Blind Spots and Assumptions
  There could be gaps in detection coverage concerning other methods of altering desktop backgrounds, such as using PowerShell scripts or other command-line tools. The detection logic assumes that `reg.exe` will be used exclusively for unauthorized changes, which may not account for legitimate administrative tasks. Required logging configurations include enabling detailed process creation and registry auditing to ensure that modifications are properly logged and available for analysis.

