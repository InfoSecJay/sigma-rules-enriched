logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\trufflehog.exe'
  selection_cli_platform:
    CommandLine|contains:
    - ' docker --image '
    - ' Git '
    - ' GitHub '
    - ' Jira '
    - ' Slack '
    - ' Confluence '
    - ' SharePoint '
    - ' s3 '
    - ' gcs '
  selection_cli_verified:
    CommandLine|contains: ' --results=verified'
  condition: selection_img or all of selection_cli_*
falsepositives:
- Legitimate use of TruffleHog by security teams or developers.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of TruffleHog, a tool utilized to search for confidential information within source code repositories and platforms such as GitHub, Slack, and Jira. The likely attacker objective is credential theft or unauthorized data extraction, as evidenced by its usage in the Shai-Hulud malware campaign, which targeted vulnerabilities in npm packages to gather sensitive information. The relevant MITRE ATT&CK tactics and techniques for this behavior are Credential Access (T1552.001) and Discovery (T1083).

  The primary telemetry sources are Windows process creation logs, particularly Event ID 4688 or Sysmon Event ID 1, capturing process execution details. If malicious, the security impact is significant, as it may lead to unauthorized access to sensitive data or credentials. Importantly, this detection alone does not confirm malicious intent; legitimate use of TruffleHog by developers and security teams can occur.

  ### Investigation Steps

  - **Review process execution details**: Analyze Event ID 4688 (Process Creation) for the creation of `trufflehog.exe`. Check fields like `NewProcessName` to examine the execution path and confirm the command line contains `docker --image`.

  - **Inspect command line arguments**: Look for CommandLine entries containing keywords like `Git`, `GitHub`, and `Jira`. Legitimate usage typically includes security assessments but watch for unusual patterns in execution context or unexpected sources.

  - **Identify instances of verified results**: Search for processes executing TruffleHog with the command-line flag `--results=verified`, which may indicate unauthorized scanning efforts, particularly if executed without transparency.

  - **Cross-reference user context**: Investigate the user account running TruffleHog. Commonly, these should be service accounts or security personnel. Unrecognized users executing this tool should escalate for further scrutiny.

  - **Validate telemetry completeness**: Ensure that Windows process creation audits are enabled across all endpoints and that Sysmon is logging appropriate details to avoid blind spots in process detection.

  ### Prioritization

  This alert should be considered medium severity due to the potential for credential exposure and sensitive data extraction. While TruffleHog has legitimate uses, its deployment in this context raises risk, and the possibility of exploitation is plausible, especially if used in conjunction with other attack vectors.

  ### Blind Spots and Assumptions

  Detection may be limited if process creation auditing is not consistently enabled across all systems. Additionally, the alert may trigger during legitimate activities by authorized developers or security teams. It's important to consider related detections, such as suspicious API calls to repository services or unexpected access to sensitive data. A companion detection could involve monitoring for unauthorized access patterns within Git repositories (T1083).

