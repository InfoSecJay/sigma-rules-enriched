detection:
  selection_cmdlet:
    CommandLine|contains: 'Set-MpPreference'
  selection_action:
    CommandLine|contains:
    - '-LowThreatDefaultAction'
    - '-ModerateThreatDefaultAction'
    - '-HighThreatDefaultAction'
    - '-SevereThreatDefaultAction'
    - '-ltdefac '
    - '-mtdefac '
    - '-htdefac '
    - '-stdefac '
  selection_value:
    CommandLine|contains:
    - 'Allow'
    - '6'
    - 'NoAction'
    - '9'
  condition: all of selection_*
