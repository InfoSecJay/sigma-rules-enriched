logsource:
  category: process_creation
  product: windows
detection:
  selection_cmdlet:
    CommandLine|contains: 'Set-MpPreference'
  selection_action:
    CommandLine|contains:
    - '-LowThreatDefaultAction'
    - '-ModerateThreatDefaultAction'
    - '-HighThreatDefaultAction'
    - '-SevereThreatDefaultAction'
    - '-ltdefac '
    - '-mtdefac '
    - '-htdefac '
    - '-stdefac '
  selection_value:
    CommandLine|contains:
    - 'Allow'
    - '6'
    - 'NoAction'
    - '9'
  condition: all of selection_*
falsepositives:
- Highly unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of the PowerShell cmdlet `Set-MpPreference`, specifically when the `ThreatSeverityDefaultAction` parameter is modified to 'Allow' (value '6') or 'NoAction' (value '9'). This behavior indicates an attempt to alter Windows Defender's response mechanism to threats, effectively reducing its ability to automatically handle severe malware threats. The likely attacker objective is to compromise a system by disabling critical security features before executing a malicious payload, potentially leading to successful exploitation.

  This action aligns with the MITRE ATT&CK tactic of **Defense Evasion** (TA0051) and the technique **Modify System Process: T1685**. The primary telemetry sources for this detection are the process creation logs from Windows, particularly focusing on PowerShell command execution captured via Security Event ID 4688 or Sysmon Event ID 1. If this change is conducted maliciously, it could severely reduce the organization's response capability to malware incidents. It’s important to note that this detection does NOT confirm malicious intent, as legitimate administrators may also use this cmdlet for troubleshooting or testing.

  ### Investigation Steps

  - **Review PowerShell command execution logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for the execution of `Set-MpPreference`. Focus on command lines containing terms such as `-LowThreatDefaultAction`, `-ModerateThreatDefaultAction`, or `-HighThreatDefaultAction`, followed by 'Allow' or 'NoAction'.

  - **Identify user context:** Note the user account running the command. If it’s an account with administrative privileges and not usually associated with security modifications, this may indicate malicious intent.

  - **Compare with baseline legitimate configurations:** Review the history of `Set-MpPreference` executions in your environment. If these values have not been changed before or if the command is executed unexpectedly from a non-administrative system, flag for further investigation.

  - **Correlate with network traffic:** Look for correlated suspicious outbound connections following the change in Windows Defender settings. Use Network Event monitoring for any unusual activity (e.g., unusual PowerShell sessions or external connections from the host).

  - **Examine auxiliary logs for related activity:** Check for logs related to changes in system security settings or service manipulation, especially in Windows Event Logs. Look for Event IDs indicating configuration changes (e.g., event ID 1102 for audit log clearing).

  - **Validate against threat intelligence:** Look for known malware or threat actor groups that utilize similar tactics for disabling protections and correlate any findings with external threat intelligence reports.

  ### Prioritization

  This alert is high priority due to the direct impact on the security posture of the affected systems. The alteration of Windows Defender settings poses a significant risk, as it creates a pathway for malware to operate without automatic mitigation. Additionally, this behavior is not commonly performed by legitimate users, making the likelihood of malicious abuse high.

  ### Blind Spots and Assumptions

  This detection may face limitations due to possible evasion techniques such as unauthorized users leveraging obfuscation methods to bypass logging. A comprehensive logging strategy is essential; without it, you risk missing critical indicators of compromise. Legitimate administrative activities, particularly in testing or troubleshooting scenarios, may occasionally trigger this alert. Implementing companion detections for PowerShell script block logging (Sysmon Event ID 22) can enhance coverage and detection capabilities against this type of malicious behavior.

