logsource:
  category: process_creation
  product: windows
detection:
  selection_cmdlet:
    CommandLine|contains: 'Set-MpPreference'
  selection_action:
    CommandLine|contains:
    - '-LowThreatDefaultAction'
    - '-ModerateThreatDefaultAction'
    - '-HighThreatDefaultAction'
    - '-SevereThreatDefaultAction'
    - '-ltdefac '
    - '-mtdefac '
    - '-htdefac '
    - '-stdefac '
  selection_value:
    CommandLine|contains:
    - 'Allow'
    - '6'
    - 'NoAction'
    - '9'
  condition: all of selection_*
falsepositives:
- Highly unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of the PowerShell cmdlet `Set-MpPreference` to change Windows Defender's threat severity default actions to 'Allow' (6) or 'NoAction' (9). Such configurations significantly diminish Windows Defender's ability to automatically respond to potential threats, effectively making malware deployment easier. The likely attacker objective is to bypass native security measures prior to executing malicious payloads, facilitating more successful exploitation attempts.

  This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.001). The primary telemetry sources are Windows process creation logs, specifically monitoring Command Line arguments associated with PowerShell executions. If malicious, this activity poses a substantial risk by eliminating critical endpoint defenses. Note that this detection alone does NOT confirm malicious intent, as legitimate administrative activities may involve altering these settings under certain contexts.

  ### Investigation Steps

  - **Verify the command execution context:** Check for Event ID 4688 (Process Creation) or Sysmon Event ID 1 logs to identify the parent process (e.g., was it initiated by a command shell or legitimate admin tools?). Legitimate changes might come from confirmed administrators on domain-joined machines.

  - **Review the full command line arguments:** Specifically, look for CommandLine field values that include `Set-MpPreference` with `-LowThreatDefaultAction`, `-ModerateThreatDefaultAction`, `-HighThreatDefaultAction`, or `-SevereThreatDefaultAction`. Note if mentioned values are 'Allow' (6) or 'NoAction' (9), indicating a possible malicious change.

  - **Examine user account details:** Validate the identity of the user or service account invoking the PowerShell command. Confirm whether this account is associated with standard operational activity or if it’s typically non-administrative, which would indicate potential abuse.

  - **Investigate surrounding log entries:** Look for correlated events within a close timeframe to discern further malicious behaviors, such as abnormal process creation (Event ID 4688) or suspicious network activity related to the same user or machine.

  - **Correlate with historical data:** Check if the same user or machine has made similar changes historically. Consistent changes could signify a standard administrative practice, while isolated cases may require deeper investigation.

  ### Prioritization

  This alert should be considered high priority due to the potential for significant security impact on affected systems. The likelihood of malicious actors using this technique is elevated, as it directly undermines endpoint security. Furthermore, this behavior is increasingly common in various attack vectors aimed at disabling detection mechanisms.

  ### Blind Spots and Assumptions

  There are limitations regarding detection effectiveness based on logging configurations; if process creation logging is disabled or improperly configured, detection may not occur. Legitimate tools or scripts used by system administrators may inadvertently trigger this alert, particularly during maintenance windows. A related detection to bolster coverage could include monitoring for unusual PowerShell command executions beyond the defense evasion context, such as remote execution patterns or attempts to disable security features across endpoints.

