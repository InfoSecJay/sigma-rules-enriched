logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'shell32.dll'
    - 'Control_RunDLL'
    CommandLine|contains:
    - '%AppData%'
    - '%LocalAppData%'
    - '%Temp%'
    - '%tmp%'
    - '\AppData\'
    - '\Temp\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `shell32.dll` via `rundll32.exe` in directories commonly associated with temporary or user-specific data, such as AppData and Temp directories. Attackers may use this technique to execute malicious DLLs in these locations to evade detection and maintain persistence. The relevant MITRE ATT&CK tactic is Execution (TA0002) specifically for the technique T1218.011, which includes executing a DLL through a legitimate process.

  The primary telemetry sources for this alert are process creation logs, specifically Windows Event ID 4688 for process creation events. If malicious, this behavior could lead to unauthorized access, data exfiltration, or lateral movement. Importantly, this detection does NOT confirm that all instances of `shell32.dll` execution are malicious; benign administrative activities could also be responsible.

  ### Investigation Steps

  - **Investigate process creation events:** Review Windows Security Event ID 4688 for instances where `rundll32.exe` executes with a CommandLine referencing `shell32.dll` in suspicious directories (e.g., AppData, Temp). Look for unusual parent processes that could indicate malicious activity.

  - **Analyze command-line arguments:** Examine the CommandLine field in the event logs for keywords such as `Control_RunDLL` and paths that include `%AppData%`, `%Temp%`, or similar. Identify benign use cases, such as legitimate software installations or system updates, which may use these arguments.

  - **Check for DLL file existence:** Validate the presence of `shell32.dll` in the identified execution paths using File System logs. Look for signs of unauthorized modifications or newly created DLL files that might accompany the detected execution.

  - **Gather additional context from Sysmon logs:** Cross-reference Sysmon Event ID 7 (Image Load) to see if `shell32.dll` was loaded from a non-standard directory or if it has unusual parent process activity, which could indicate malicious use.

  - **Identify high-confidence malicious patterns:** Look for repetitive execution of the same command with varying parameters, which could signify attempts to obfuscate activity. Track down any associated processes or services that reference these executions.

  - **Document legitimate use cases:** Note legitimate applications that may utilize `rundll32.exe` with `shell32.dll`. Common examples might include user-driven GUI applications or automated updates, ensuring these scenarios are considered during the analysis.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on sensitive systems, as software execution from user directories often indicates evasion tactics and could lead to further compromise. The likelihood of malicious abuse is significant because this technique is known among attackers for stealthy execution.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logging is misconfigured or where sysadmin tools legitimately execute similar commands, potentially leading to false positives. Essential log sources include Security Event Logs for process creation and Sysmon logs for image load details, both of which must be configured for comprehensive visibility. Additionally, companion detections involving unusual network outbound connections from affected hosts can strengthen coverage and help differentiate benign from malicious behavior.

