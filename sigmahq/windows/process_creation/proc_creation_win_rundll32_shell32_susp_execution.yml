  ---

  ### Technical Context

  This Sigma rule detects executions of `shell32.dll` through `rundll32.exe` in suspicious directories such as AppData or Temp. The potential attacker objective is to execute malicious DLLs, possibly as part of a persistence mechanism or payload delivery. This behavior aligns with the MITRE ATT&CK technique T1218.011 (Signed Binary Proxy Execution: rundll32). The primary telemetry sources are Windows process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing command-line arguments and the process image paths. If confirmed malicious, this activity could lead to system compromise or data exfiltration. However, this detection does NOT confirm intent without additional context, as legitimate applications may also use similar mechanisms.

  ---

  ### Investigation Steps

  - **Check process creation details:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for `rundll32.exe` execution. Look for command lines containing `shell32.dll` and paths referencing `%AppData%`, `%Temp%`, or `%LocalAppData%`.

  - **Identify suspicious command-line patterns:** Confirm any command-line includes both `Control_RunDLL` and one or more suspicious directory paths mentioned in the Sigma rule. For instance, a command line like `rundll32.exe shell32.dll,Control_RunDLL %AppData%\malicious.dll` indicates potential malicious activity.

  - **Verify file presence in suspicious directories:** Check the file system on the affected system for the presence of `shell32.dll` in the `%AppData%` or `%Temp%` directories. Legitimate use would not normally invoke `shell32.dll` from these paths.

  - **Analyze the parent process:** Investigate the parent process of `rundll32.exe` using Event ID 4688 or Sysmon Event ID 1. If the parent process is a known application (e.g., a trusted application installer), it may indicate benign behavior.

  - **Correlate events across the network:** Use network logs to check for any outbound connections initiated immediately after the suspicious execution. Look for unusual destination IPs or URLs indicative of data exfiltration.

  - **Consult historical logs for trend analysis:** Search for previous occurrences of similar executions in Windows Event logs to determine if this is part of an established pattern or a one-off event. Repeated instances may suggest an ongoing compromise.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact of executing malicious code through legitimate channels. The abuse of `rundll32.exe` for executing DLLs is a common tactic leveraged by adversaries, indicating a high likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by evasion tactics such as malware obfuscation of file paths or command-line arguments. Required log sources include both Security Event logs and Sysmon logs configured for detailed process execution tracking. Legitimate administrative activities, such as Windows updates or configuration changes, may also trigger similar alerts if they involve `rundll32.exe`. A related detection to consider strengthening coverage is monitoring for unusual PowerShell or batch script executions that may also launch similar processes.

