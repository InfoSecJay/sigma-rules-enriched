logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'shell32.dll'
    - 'Control_RunDLL'
    CommandLine|contains:
    - '%AppData%'
    - '%LocalAppData%'
    - '%Temp%'
    - '%tmp%'
    - '\AppData\'
    - '\Temp\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential malicious use of `shell32.dll` executed from uncommon or suspicious directories via `rundll32.exe`. The execution of legitimate Windows DLLs like `shell32.dll` from locations such as AppData, LocalAppData, Temp, or shared public directories can indicate an attempt to evade detection and execute harmful payloads. Attackers often leverage this technique to mask their actions, aiming to execute arbitrary code or facilitate further malicious activities, such as lateral movement or persistence within the environment.

  The relevant MITRE ATT&CK tactics are **Execution (TA0002)**, specifically the technique **Rundll32 (T1218.011)**, and the technique **Defense Evasion (TA0005)**. This indicates a notable risk within an enterprise environment, especially if an adversary gains persistence through deceptive means or executes an attack tool in a way that disguises its true intent.

  Primary data sources for detection include **process creation logs**, which capture details of any executed commands, alongside attributes like the specific executable names and the command line used.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the logs for instances of `rundll32.exe` execution in conjunction with `shell32.dll`. Look for anomalies in execution paths indicating a potentially malicious origin.
  - **Inspect Command Line Arguments**: Examine command line input for executions of `rundll32.exe`. Pay attention to parameters or directories that align with user profile folders (e.g., `%AppData%`, `%LocalAppData%`, and shared directories).
  - **Cross-reference with Threat Intelligence**: Utilize external intelligence feeds to identify any known threats associated with the `shell32.dll` execution patterns, particularly from unreliable directories.
  - **Collect Related Artifacts**: Gather related files and artifacts in the suspected execution directories, and analyze them for any signs of payloads or additional components being executed.

  ### Prioritization
  This alert is classified as high severity due to the potential risk to enterprise environments. The use of a legitimate Windows process to execute code from suspicious directories is often indicative of attempts to bypass security measures and could lead to severe impacts, including data breaches or system compromises.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if `rundll32.exe` is utilized outside the specified suspicious directories or if logs for process creation events are not adequately configured. The detection logic assumes that administrators have not modified the default behavior or security posture of Windows environment logs, and it relies on existing logging configurations to capture the necessary process creation events accurately. Without proper log collection in place, this detection may fail to trigger when actual indicators of compromise are present.

