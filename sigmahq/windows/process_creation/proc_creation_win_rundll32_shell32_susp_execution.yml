logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'shell32.dll'
    - 'Control_RunDLL'
    CommandLine|contains:
    - '%AppData%'
    - '%LocalAppData%'
    - '%Temp%'
    - '%tmp%'
    - '\AppData\'
    - '\Temp\'
    - '\Users\Public\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `shell32.dll` via `rundll32.exe` in directories typically associated with temporary or user-specific data (e.g., `%AppData%`, `%LocalAppData%`, `%Temp%`). Attackers may use this technique to execute malicious DLLs under the guise of legitimate processes, often aiming to achieve persistence or execute payloads without triggering traditional security mechanisms. Relevant MITRE ATT&CK tactics include **Execution (T1203)** and **Defense Evasion (T1218.011)**.

  The primary telemetry source for this detection is Windows process creation events, specifically from Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity could allow an attacker to run arbitrary code and potentially compromise the system's integrity and confidentiality. Importantly, this detection alone does NOT confirm malicious intent; benign applications may also trigger it.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the creation of `rundll32.exe`. Look for the specific command line containing `shell32.dll` and check the timestamp for anomalous behavior relative to other activity.

  - **Identify unusual file paths:** Investigate whether `shell32.dll` is executed from unusual locations, such as `%AppData%`, `%LocalAppData%`, `%Temp%`, or `%tmp%`. If found, flag as suspicious.

  - **Compare against known legitimate activity:** Determine if the execution corresponds with a known application or system process. For instance, legitimate use may show up with files in expected directories or during regular scheduled tasks.

  - **Inspect parent process details:** Identify the parent process of `rundll32.exe`. Check if it was spawned by a legitimate application or an unexpected CLI tool. Unusual parent processes may indicate malicious workflows.

  - **Look for related artifacts:** Validate the presence of new or modified files in the suspicious directories noted above. For example, check for newly created DLLs in `%Temp%` or `%AppData%` that do not match known software signatures.

  - **Analyze behavioral patterns:** Record if any other related alerts (e.g., unusual registry changes or outbound connections) coincide with this event. Cross-reference with alerts from companion detections like process injection techniques.

  ### Prioritization

  This alert carries high severity due to its potential impact on system security. The execution of `shell32.dll` in insecure directories can indicate an attempted compromise. Given the popularity of `rundll32.exe` for executing malicious payloads, it is critical to prioritize these alerts for further analysis.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications triggering this alert, such as software that uses `rundll32.exe` for configuration. Required log sources, including Security Event ID 4688 and Sysmon Event ID 1, must be properly configured to ensure effective detection. Additionally, file execution from scheduled tasks or automated system maintenance may result in similar behavior, necessitating context-aware analysis. A related detection to consider is a rule that monitors for unusual command-line arguments used with `rundll32.exe`, enhancing keyword coverage.

