note: |
  ### Technical Context

  The rule detects suspicious child processes spawned from Outlook that are sourced from remote locations, specifically SMB or WebDav shares. This behavior can indicate that an attacker is attempting to execute malicious payloads or actions triggered via email, potentially targeting sensitive data or system compromise. The attacker may aim to establish persistence, execute commands remotely, or exploit vulnerabilities in Outlook.

  This falls under the MITRE ATT&CK tactic of Execution, employing techniques like Command and Scripting Interpreter (T1059) and Exploitation of Vulnerability (T1202). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, which capture details about process start events. If malicious, this behavior can lead to unauthorized data access or system infiltration. Notably, this detection does not confirm the intent or specific action of the spawned process without further investigation.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 detailing the child process with ParentImage of `outlook.exe`. Look for Image path starting with `\\` indicating a remote source.

  - **Validate the legitimacy of spawned processes**: Cross-reference the child processes against known legitimate applications. If the process name or path isn’t recognized or isn’t common, flag it as suspicious.

  - **Check user account behaviors**: Monitor the user account's activity for unusual behavior, such as accessing SMB shares unexpectedly. Utilize Windows Security logs to see for Event IDs associated with network access (e.g., 5140, 5145 for network share access).

  - **Correlate with related alerts**: Look for any companion alerts related to Outlook or remote process execution that could provide context, such as the similar detection for "Outlook Child Processes".

  - **Identify high-confidence malicious indicators**: Look for digital signatures or hashes of the detected processes that match known malware databases. Review logs for any additional unusual network connections that might correlate with the suspicious process.

  - **Assess host role and criticality**: Determine the asset criticality of the affected machine. If the host is classified as critical infrastructure or contains sensitive data, escalation may be warranted.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on enterprise systems, as compromised processes could lead to broader network exploitation. Given the accessibility of techniques that leverage remote execution from a trusted application like Outlook, they are high-risk and frequently abused by adversaries.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited by the absence of relevant log sources, specifically if SMB logging is not enabled or if Sysmon is not configured correctly. Legitimate activities, such as using shared resources for collaborative work with authorized personnel, may trigger this alert. A related detection that enhances coverage is monitoring for Windows Event ID 5145 which tracks access to shared folders, providing additional context around adversary activity.

