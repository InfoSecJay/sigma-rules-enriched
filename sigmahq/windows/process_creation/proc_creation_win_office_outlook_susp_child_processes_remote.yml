  ### Technical Context

  This Sigma rule detects instances where a suspicious child process is spawned from Outlook, specifically when the child process's executable image is stored in a remote location such as SMB or WebDAV shares. This behavior suggests an attacker may be leveraging Outlook as a means to execute malicious code, potentially aiming to bypass traditional defenses by masquerading as a legitimate process in a trusted application.

  The relevant MITRE ATT&CK tactic is Execution (T1202), with the technique identified as Command and Scripting Interpreter (T1059). Primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688 from the Windows Security log or Sysmon Event ID 1 for process creation events. If successful, this behavior can result in data exfiltration or system compromise. Importantly, this detection does NOT confirm malicious intent solely on its own; further investigation is required to contextualize the findings.

  ### Investigation Steps

  - **Verify process parent-child relationships:** Utilize Event ID 4688 to confirm the parent process (Outlook) and the child process's properties. Examine the "NewProcessName" and "ParentProcessId" fields. Look for any child processes executing commands that are unusual, such as ones not commonly associated with email activities.

  - **Check the path and source of the child process:** Analyze the "NewProcessName" field to see if the file path begins with "\\" indicating it originates from a remote SMB share or WebDAV location. This can be correlated with known malicious behavior associated with malware delivery or control.

  - **Assess the legitimacy of the remote source:** Collect additional data from file shares or file access logs (such as SMB logs) to ascertain whether the remote share is recognized within the organization. Legitimate internal processes should generally not spawn from external or untrusted locations.

  - **Look for related IOCs from recent incidents:** Cross-reference the spawned process with known indicators of compromise (IOCs) involving Outlook or malicious activity patterns. High-confidence malicious indicators may include hashes of known malware or anomalous command lines.

  - **Confirm recent Outlook activity and context:** Review Outlook event logs for user activity that may have preceded the alert to determine legitimate use cases. This may include legitimate email access or attachments that triggered the alert.

  - **Identify asset criticality:** Assess the impact of the affected system. This alert is more critical if it originated from a domain controller, financial system, or other critical infrastructure, as malware execution from these assets could lead to significant organizational risk.

  ### Prioritization

  This alert is high priority due to the potential for executing malicious payloads from a trusted application (Outlook) and the implications of exploit attempts leveraging common user tools. The likelihood of malicious abuse is significant, especially considering that adversaries commonly weaponize email clients for delivery of executed malware or exfiltration.

  ### Blind Spots and Assumptions

  Key limitations include the potential for evasion techniques such as using common or known good images from remote paths that could mislead analysts. Reliable detection requires comprehensive logging capabilities, including complete Windows process creation logs and SMB/WebDAV access logs. Legitimate activities that may trigger this alert include automated scripts or legitimate plugins that interact with email systems in unusual ways. A companion detection could include monitoring for suspicious outbound connections initiated by identified child processes to further validate potential malicious activity.

