note: |
  ### Technical Context
  This detection rule identifies suspicious child processes that spawn from Microsoft Outlook, specifically when the invoked executable is hosted on a remote location such as a network share or via WebDav. The primary threat scenario involves an attacker using Outlook as a conduit to execute malicious code residing remotely, thereby bypassing local defenses and potentially establishing a foothold or persistence mechanism in the environment. Attackers may exploit Outlook's trusted status within organizations to execute commands, which is commonly associated with evasion tactics.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002):** The attacker is executing code on the system.
  - **Defense Evasion (TA0005):** Leveraging Outlook helps evade detection as it’s a legitimate application.
  - **Command and Scripting Interpreter (T1059):** Usage of trusted applications to execute scripts or commands.
  - **Exploitation of Remote Services (T1202):** Utilizing documents and application services that leverage remote resources.

  Primary data sources vital for this analysis include process creation event logs from Windows systems, which capture both the parent and child process details, and information on executed commands.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze process creation events to identify instances where a child process originated from `outlook.exe`. Focus on the paths of child processes to confirm they originate from remote shares.

  - **Examine Network Traffic:** Analyze outbound connections for suspicious patterns, such as communications with known malicious IPs or connections to unusual remote SMB/WebDav endpoints that may have been used to initiate the remote executable.

  - **Validate Logon Sessions:** Inspect logon session information for the user accounts executing Outlook. Check for unusual user behaviors or patterns, such as logons from unexpected locations or at odd hours.

  - **Correlate with Other Alerts:** Cross-reference the findings with alerts from other security tools (like EDR and SIEM) to identify signs of lateral movement or other behaviors indicative of an attacker present in the environment.

  ### Prioritization
  This alert is considered high severity due to the potential impact of malicious code execution through a trusted application like Outlook, which could lead to data exfiltration, system compromise, or lateral movement within the enterprise network.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if certain logging mechanisms for process creation are not enabled consistently across all endpoints. This detection logic assumes that the established criteria (a remote image spawning from Outlook) reflects malicious activity; however, legitimate applications or services could inadvertently trigger the alert, leading to potential false positives. Adequate logging configurations must be maintained to ensure comprehensive process creation monitoring capabilities are in place across the enterprise environment.

