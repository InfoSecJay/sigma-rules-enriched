  ---

  ### Technical Context

  This rule detects suspicious child processes originating from Outlook, particularly when these processes are executed from remote locations via SMB or WebDAV shares. The likely attacker objective is to exploit Outlook as a vector to execute malicious payloads, leveraging the trust typically associated with applications like Outlook for persistence or lateral movement. This behavior corresponds to the MITRE ATT&CK tactic "Execution" (T1202) and the technique "Command and Scripting Interpreter" (T1059).

  The primary telemetry sources required for this detection include process creation logs, specifically Windows Security Event ID 4688, which captures process creation details. If malicious, this behavior could indicate compromise of the endpoint, enabling attackers to execute arbitrary code unnoticed. Importantly, this detection does NOT confirm that the activity is malicious on its own; it only flags potentially suspicious behavior warranting further investigation.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for entries where the `ParentImage` equals `outlook.exe` and the `Image` path starts with `\\`. Identify legitimate child processes, such as `powershell.exe` being spawned for legitimate automation tasks.

  - **Check remote file access:** Validate the remote path utilized in the process creation log against known good sources. A path from trusted internal file shares or repositories is benign, whereas paths to unknown SMB/WebDAV shares may indicate malicious activity.

  - **Correlate with user activity:** Assess user behavior around the time of the alert. If the user was actively engaged in sending emails or executing scripts, it may indicate legitimate use of process spawning. Unscheduled activity, especially after hours, should raise suspicion.

  - **Identify known threats:** Cross-reference the detected activity with threat intelligence feeds for any indication of known malware using similar tactics, specifically leveraging Outlook. Presence of any signatures or hashes from linked campaigns increases the likelihood of compromise.

  - **Validate persistence mechanisms:** If a multi-step attack has occurred, look for additional indicators of compromise (IoCs) such as registry changes or scheduled tasks that may have been created in correlation with the alert.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of Outlook in enterprise environments and the likelihood that attackers may target it for execution of attacks. The use of remote processes for malware execution is a known tactic that is often weaponized, warranting immediate investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by false positives, especially in environments where legitimate applications routinely spawn child processes from Outlook for automation purposes. Log sources must be properly configured to ensure full capture of process creation events. Legitimate activities such as automated email responses or scripting through Outlook’s COM objects could also trigger this alert. Related detections for script execution (like PowerShell execution from known good processes) can provide stronger context to assess these alerts effectively.

