logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\svchost.exe'
    - '\taskhost.exe'
    - '\lsm.exe'
    - '\lsass.exe'
    - '\services.exe'
    - '\lsaiso.exe'
    - '\csrss.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
  filter_sys:
  - ParentImage|endswith:
    - '\SavService.exe'
    - '\ngen.exe'
  - ParentImage|contains:
    - '\System32\'
    - '\SysWOW64\'
  filter_msmpeng:
    ParentImage|contains:
    - '\Windows Defender\'
    - '\Microsoft Security Client\'
    ParentImage|endswith: '\MsMpEng.exe'
  filter_null:
  - ParentImage:
  - ParentImage:
    - ''
    - '-'
  condition: selection and not 1 of filter_*
falsepositives:
- Some security products seem to spawn these
level: low
note: |
  ### Technical Context

  This rule detects instances of well-known Windows processes (e.g., `svchost.exe`, `taskhost.exe`) being spawned by suspicious parent processes, such as `SavService.exe` or `ngen.exe`. The likely attacker objective is to camouflage malicious activities under the guise of legitimate system processes, making detection more challenging. Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1036) and **Masquerading** (T1036.003).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID **4688** and Sysmon Event ID **1**, which log process creation events. If malicious, this behavior could indicate an adversary attempting to establish persistence or execute payloads without triggering alerts. Importantly, this detection does NOT confirm malicious activity on its own; further investigation is needed to contextualize the findings.

  ### Investigation Steps

  - **Check parent process relationships:** Review Security Event ID **4688** and Sysmon Event ID **1** for the parent process of the flagged processes. Look for `SavService.exe` or similar known binaries as the launching entity.

  - **Corroborate with system logs:** Examine the Event Viewer for Windows logs, focusing on the **Process Creation** section. Verify legitimate processes that typically spawn these known executables, ensuring no anomalous behavior from legitimate applications.

  - **Identify high-confidence malicious indicators:** If `svchost.exe` is spawned by `SavService.exe`, immediately initiate a full forensic review of `SavService.exe`, as it is less common for legitimate operations.

  - **Observe system impact:** Determine if the affected system is critical for business operations (e.g., domain controllers or file servers). Prioritize investigations on these systems to mitigate potential impacts of malicious exploitation.

  - **Conduct hash checks:** Perform a hash lookup on `SavService.exe` and any other identified parent processes against threat intelligence databases to confirm any known malicious signatures.

  ### Prioritization

  The alert is categorized as low severity due to the potential for benign triggers from security products. However, the likelihood of malicious abuse exists, as adversaries often leverage these processes for defense evasion. This behavior is less common but can be indicative of cunning obfuscation techniques employed by attackers, warranting timely investigation but not immediate escalation.

  ### Blind Spots and Assumptions

  Evasion techniques may include adversaries utilizing legitimate system processes to disguise malicious activity, leading to false positives in an enterprise setting. Ensuring logging for Windows Security Event IDs and maintaining consistent monitoring of process creation events are crucial for reliable detection. Legitimate third-party security products may frequently generate similar parent-child process relationships. A related rule to strengthen coverage involves monitoring for any unusual network connections initiated by the flagged processes, which could provide additional context for investigation.

