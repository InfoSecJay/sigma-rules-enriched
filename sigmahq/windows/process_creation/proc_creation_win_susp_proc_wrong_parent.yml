title: Windows Processes Suspicious Parent Directory
id: 96036718-71cc-4027-a538-d1587e0006a7
status: test
description: Detect suspicious parent processes of well-known Windows processes
references:
- https://web.archive.org/web/20180718061628/https://securitybytes.io/blue-team-fundamentals-part-two-windows-processes-759fe15965e2
- https://www.carbonblack.com/2014/06/10/screenshot-demo-hunt-evil-faster-than-ever-with-carbon-black/
- https://www.13cubed.com/downloads/windows_process_genealogy_v2.pdf
author: vburov
date: 2019-02-23
modified: 2025-03-06
tags:
- attack.defense-evasion
- attack.t1036.003
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\svchost.exe'
    - '\taskhost.exe'
    - '\lsm.exe'
    - '\lsass.exe'
    - '\services.exe'
    - '\lsaiso.exe'
    - '\csrss.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
  filter_sys:
  - ParentImage|endswith:
    - '\SavService.exe'
    - '\ngen.exe'
  - ParentImage|contains:
    - '\System32\'
    - '\SysWOW64\'
  filter_msmpeng:
    ParentImage|contains:
    - '\Windows Defender\'
    - '\Microsoft Security Client\'
    ParentImage|endswith: '\MsMpEng.exe'
  filter_null:
  - ParentImage:
  - ParentImage:
    - ''
    - '-'
  condition: selection and not 1 of filter_*
falsepositives:
- Some security products seem to spawn these
level: low
note: |
  ### Technical Context
  This detection rule is designed to identify suspicious parent processes associated with well-known Windows system processes such as `svchost.exe` and `lsass.exe`. Attackers often utilize legitimate processes to mask malicious activities, making it essential to monitor parent-child process relationships for anomalies. By detecting these relationships, security teams can uncover potential lateral movement, execution of malicious payloads, or attempts to gain unauthorized access to sensitive information through process masquerading.

  The threat scenario typically involves an adversary leveraging process impersonation techniques, where they launch malicious code under the guise of trusted system processes. This behavior aligns with several MITRE ATT&CK techniques, including `T1036.003: Masquerading - Rename Escape` and `T1036.005: Masquerading - Match Legitimate Name`. The aim of the attackers through this tactic is to evade detection mechanisms and execute tasks under a trusted process.

  Primary data sources critical for this detection rule include process creation logs from EDR solutions that provide information on the relationship between processes (parent and child), which can help identify unauthorized manipulations of system resources.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for any instances where the detected Windows system processes have suspicious parent processes. Look for common signs of evasion within the parent-child relationships.

  - **Analyze Parent Process Details:** Investigate the parent processes identified in the alerts. Gather additional details such as the command line used, user context, and the time of execution to identify any patterns or anomalies.

  - **Correlate with Other Security Alerts:** Cross-reference the findings with other security alerts from your SIEM or EDR systems to determine if this behavior is part of a broader attack narrative or campaign.

  - **Check for Known Threat Indicators:** Utilize threat intelligence sources to check if the parent processes or any associated components have been flagged as malicious or part of known exploit techniques, especially in conjunction with the involved Windows processes.

  ### Prioritization
  The severity of this alert is categorized as low; however, it warrants attention due to its potential implication in stealthy attacker behavior. In a large enterprise environment, detecting processes masquerading as legitimate Windows functions can signify an active compromise and should be analyzed promptly.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage may arise from legitimate system management activities or benign software that also spawns these processes under similar names, leading to false positives. The detection logic assumes that all parent processes that do not align with known legitimate paths or that are null are indicators of malicious activity. This rule relies heavily on accurate and comprehensive process creation logs being available and correctly configured in the environment to function effectively.

