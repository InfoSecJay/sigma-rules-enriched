title: Windows Processes Suspicious Parent Directory
id: 96036718-71cc-4027-a538-d1587e0006a7
status: test
description: Detect suspicious parent processes of well-known Windows processes
references:
- https://web.archive.org/web/20180718061628/https://securitybytes.io/blue-team-fundamentals-part-two-windows-processes-759fe15965e2
- https://www.carbonblack.com/2014/06/10/screenshot-demo-hunt-evil-faster-than-ever-with-carbon-black/
- https://www.13cubed.com/downloads/windows_process_genealogy_v2.pdf
author: vburov
date: 2019-02-23
modified: 2025-03-06
tags:
- attack.defense-evasion
- attack.t1036.003
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\svchost.exe'
    - '\taskhost.exe'
    - '\lsm.exe'
    - '\lsass.exe'
    - '\services.exe'
    - '\lsaiso.exe'
    - '\csrss.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
  filter_sys:
  - ParentImage|endswith:
    - '\SavService.exe'
    - '\ngen.exe'
  - ParentImage|contains:
    - '\System32\'
    - '\SysWOW64\'
  filter_msmpeng:
    ParentImage|contains:
    - '\Windows Defender\'
    - '\Microsoft Security Client\'
    ParentImage|endswith: '\MsMpEng.exe'
  filter_null:
  - ParentImage:
  - ParentImage:
    - ''
    - '-'
  condition: selection and not 1 of filter_*
falsepositives:
- Some security products seem to spawn these
level: low
note: |
  ### Technical Context

  This Sigma rule detects suspicious parent processes associated with critical Windows system processes such as `svchost.exe`, `lsass.exe`, and `winlogon.exe`. The likely attacker objective is to hide malicious activity by manipulating trusted system processes, possibly aiming for persistence or privilege escalation. Relevant MITRE ATT&CK tactics include: Defense Evasion (T1203, T1136), and Process Injection (T1055). The primary telemetry sources involve Windows process creation events captured via Event ID 4688 or Sysmon Event ID 1, specifically monitoring the ParentImage field for unusual relationships. If malicious, this behavior can facilitate unauthorized access or control over a system. However, this detection alone does not confirm the presence of malicious activity without further context and supporting evidence.

  ### Investigation Steps

  - **Identify parent process relationships**: Correlate the detected Event ID 4688 (Process Creation) logs with Event ID 4656 (Handle Request) to verify parent-child process relationships and identify if any of the suspicious parents (e.g., `SavService.exe`, `ngen.exe`) are being exploited.

  - **Review the command line arguments**: Analyze the command line of the detected suspicious processes by inspecting Event ID 4688. Look for potentially malicious arguments or unexpected behaviors compared to legitimate process execution.

  - **Assess system health and legitimacy**: Check for legitimate instances of `svchost.exe` family processes running under usual parent processes. For example, ensure that `svchost.exe` is not spawned by irrelevant parent processes like `ngen.exe` which might indicate a possible compromise.

  - **Confirm persistence mechanisms**: Investigate recent installation timestamps and startup type related to `SavService.exe` or similar parent processes using Windows Event Log (Event ID 7036) to assess whether these are legitimate services or potentially backdoor mechanisms.

  - **Check for process anomalies**: Use Sysinternals tools (like Process Explorer) to inspect the running processes in real-time for unusual behavior, such as high CPU usage or unusual parent-child hierarchy.

  - **Examine automated indicators**: Look for high-confidence malicious indicators, such as known hashes or digital signatures linked to the suspicious parents across the environment. Use established threat intelligence feeds to cross-reference.

  ### Prioritization

  The alert severity is moderate to high based on the criticality of affected Windows systems commonly used in enterprise environments. The manipulation of trusted processes indicates a higher likelihood of malicious abuse, particularly since such methods are frequently weaponized for lateral movement and persistence.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated attacks that mimic legitimate process behavior or utilize non-standard parent processes. Continuous log collection from all relevant Windows sources, including those for security products, is vital to ensure reliable detection. Legitimate activities that may trigger the alert include benign security software behaviors or legitimate application updates. A companion detection rule that could strengthen coverage is one monitoring unusual command line arguments related to known critical Windows processes.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
