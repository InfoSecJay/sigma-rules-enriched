logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: 'Product'
  filter_main_call_operations:
        # wmic /node:"#{node}" product where "name like '#{product}%%'" call uninstall
    CommandLine|contains:
    - ' uninstall'
    - ' install'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This alert detects the execution of the Windows Management Instrumentation Command-line (WMIC) tool, specifically when commands are used to retrieve a list of installed firewall and antivirus products. Attackers may utilize this technique to gather reconnaissance information about an organization's security posture, allowing them to identify potential weaknesses and plan subsequent attacks, such as targeted malware deployment or evading existing defenses. The detection logic targets instances where WMIC is called with commands containing "Product," particularly in contexts that do not indicate installation or uninstallation, which could suggest malicious intent.

  Relevant MITRE ATT&CK techniques include:
  - **T1047**: Windows Management Instrumentation (WMI)
  - **T1083**: File and Directory Discovery

  The primary data sources for this detection include process creation events that log the execution of WMIC, capturing both the command-line parameters and the associated image file information.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for instances of `wmic.exe` execution, paying close attention to the command-line parameters to identify intended reconnaissance activity.
  - **Analyze Command-Line Arguments**: Focus on any command-line arguments containing "Product." Look for patterns indicating suspicious behavior, particularly in conjunction with other system commands or unexpected paths.
  - **Cross-reference Security Solutions**: Check the list of security solutions detected against known vulnerabilities and compatibility with prior incidents, to assess whether the timing and nature of the reconnaissance align with any ongoing security events.
  - **Inspect for Subsequent Actions**: After identifying potential reconnaissance activity, investigate any subsequent behavior, particularly processes that involve persistent changes, such as attempts to disable or bypass identified security products.

  ### Prioritization
  This alert should be treated with medium severity as WMIC can be a legitimate tool for system administration. However, given that attackers are known to use it for reconnaissance of security controls, any detected execution should be assessed within the context of recent security incidents or unusual activity patterns.

  ### Blind Spots and Assumptions
  One potential blind spot is the ability to detect WMIC usage across various non-standard environments or configurations where the logging of process creation might be altered or disabled. The detection logic assumes that the command is executed from typical user contexts and that the necessary process creation logs are available. If organizations do not log command-line arguments, or if WMIC is being executed from scripts with obfuscated commands, this may lead to missed detections. Proper logging and monitoring configurations must be in place to ensure the effectiveness of this alert.

