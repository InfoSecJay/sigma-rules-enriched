title: Potential Product Reconnaissance Via Wmic.EXE
id: 15434e33-5027-4914-88d5-3d4145ec25a9
status: test
description: Detects the execution of WMIC in order to get a list of firewall 
  and antivirus products
references:
- https://thedfirreport.com/2023/03/06/2022-year-in-review/
- https://www.yeahhub.com/list-installed-programs-version-path-windows/
- https://learn.microsoft.com/en-us/answers/questions/253555/software-list-inventory-wmic-product
author: Nasreddine Bencherchali
date: 2023-02-14
modified: 2025-10-22
tags:
- attack.execution
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: 'Product'
  filter_main_call_operations:
        # wmic /node:"#{node}" product where "name like '#{product}%%'" call uninstall
    CommandLine|contains:
    - ' uninstall'
    - ' install'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of WMIC (Windows Management Instrumentation Command-line) with commands aimed at querying installed firewall and antivirus products. An attacker may utilize this to assess the defensive posture of a target environment, as identifying security solutions can inform subsequent evasion strategies or exploitation tactics. This behavior aligns with the MITRE ATT&CK technique for Command and Control under T1047 (Windows Management Instrumentation).

  The primary telemetry sources include process creation logs, particularly looking for Event ID 4688 in Windows Security Event logs or Sysmon Event ID 1. If malicious, the security impact could involve an attacker gathering intelligence that enables them to bypass security measures, facilitating data exfiltration or lateral movement. Importantly, this detection does not confirm that WMIC execution indicates malicious intent on its own; legitimate administrative activities may also invoke it.

  ### Investigation Steps

  - **Review process creation logs:** Filter for Security Event ID 4688 or Sysmon Event ID 1 for any instance of `wmic.exe`. Look for a CommandLine containing "Product". Assess the specific parameters used in the command; legitimate uses typically involve benign administrative tasks.

  - **Correlate execution with active incidents:** Check if the user account that executed WMIC has any current or past incidents linked to unauthorized access. Look for events like failed logins or anomalous account activity.

  - **Identify high-confidence malicious indicators:** Focus on CommandLine arguments such as "uninstall" or "install" alongside "Product". This may indicate a potential threat actor attempting to alter, disable, or evade security products.

  - **Validate asset criticality:** Ensure the execution is assessed in the context of the asset's role within the enterprise. For example, WMIC usage on servers that host critical applications should raise higher alarm than on standard user workstations.

  - **Check historical context:** Review past executions of WMIC commands on the host to establish baseline behavior. Frequent requests for installed products in a short timeframe may indicate reconnaissance activity rather than legitimate maintenance work.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on system security, especially if performed on critical assets. While WMIC execution can be benign, certain parameters can indicate reconnaissance probing from adversaries, making it a noteworthy activity that requires immediate attention.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that also utilize WMIC for troubleshooting. Additionally, if logging is not consistently implemented across all endpoints, it may miss critical executions. Awareness of benign activities such as software inventory checks conducted by IT personnel is essential to avoid misinterpretation of the alert. A companion detection to consider is monitoring for abnormal access patterns to administrative tools, which can provide context to WMIC usage.

