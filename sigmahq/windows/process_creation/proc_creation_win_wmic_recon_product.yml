title: Potential Product Reconnaissance Via Wmic.EXE
id: 15434e33-5027-4914-88d5-3d4145ec25a9
status: test
description: Detects the execution of WMIC in order to get a list of firewall 
  and antivirus products
references:
- https://thedfirreport.com/2023/03/06/2022-year-in-review/
- https://www.yeahhub.com/list-installed-programs-version-path-windows/
- https://learn.microsoft.com/en-us/answers/questions/253555/software-list-inventory-wmic-product
author: Nasreddine Bencherchali
date: 2023-02-14
modified: 2025-12-15
tags:
- attack.execution
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains: 'Product'
  filter_main_call_operations:
        # wmic /node:"#{node}" product where "name like '#{product}%%'" call uninstall
    CommandLine|contains:
    - ' uninstall'
    - ' install'
  filter_main_csproduct:
        # wmic /node:"#{node}" csproduct get name, identifyingnumber, uuid
        # covered by 3e3ceccd-6c06-48b8-b5ff-ab1d25db8c1d
    CommandLine|contains: 'csproduct'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_wmic_recon_product/info.yml
note: |
  ### Technical Context

  This rule detects the execution of `wmic.exe` with commands that query or modify installed software, specifically focusing on product reconnaissance via the `Product` keyword. Attackers may aim to gather information on firewall and antivirus products to identify potential security controls for evasion or exploitation, aligning with the MITRE ATT&CK technique of Execution (T1047). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution and command line arguments. If malicious, successful reconnaissance could lead to a higher likelihood of compromising vulnerable systems. However, this detection does NOT alone confirm malicious intent or successful exploitation, as legitimate administrative tasks may utilize similar queries.

  ### Investigation Steps

  - **Check the command line arguments:** Validate the presence of `Product` in CommandLine logs (Event ID 4688 / Sysmon ID 1) to confirm the reconnaissance activity. Benign examples may include administrative scripts or inventories, while suspicious use would likely follow an unusual pattern for the user context.

  - **Assess user account behavior:** Review the user account initiating `wmic.exe`. If it is a non-administrative account with infrequent usage, this could indicate a potential compromise, whereas a known administrator executing such commands during maintenance is benign.

  - **Inspect process parent-child relationships:** Analyze parent process information in process trees (via Sysmon's ProcessId or ParentProcessId fields) to see if `wmic.exe` was launched by a known and trusted process (e.g., `cmd.exe`). Any suspicious parent process could indicate malicious workflows.

  - **Review for subsequent actions:** Look for potential follow-on activities, particularly command lines involving `uninstall` or `install`, as indicated by the filter. High-confidence indicators would include any commands that suggest tampering with security software.

  - **Correlate with threat intelligence:** Refer to external intelligence sources or known IOCs for recent exploitation techniques or campaigns that utilize `wmic` for reconnaissance, validating the alert in the context of current threat trends.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems running security products. The likelihood of malicious abuse is moderate, as product reconnaissance is a common tactic among attackers to aid lateral movement or initial access strategies. This behavior can be weaponized but is also present in legitimate administrative tasks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that also utilize `wmic.exe`, causing potential false positives. Required log sources must be properly configured to cover all relevant process creation events and ensure comprehensive telemetry. Additionally, alerts could be triggered during standard maintenance or inventory operations, highlighting the need for context in analysis. A related detection to strengthen coverage would be monitoring for anomalous PowerShell usage (T1059.001) that may indicate script-based reconnaissance combined with `wmic` activities.

