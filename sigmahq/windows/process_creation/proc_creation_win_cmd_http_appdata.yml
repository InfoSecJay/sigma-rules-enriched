title: Command Line Execution with Suspicious URL and AppData Strings
id: 1ac8666b-046f-4201-8aba-1951aaec03a3
status: test
description: Detects a suspicious command line execution that includes an URL and
  AppData string in the command line parameters as used by several droppers (js/vbs
  > powershell)
references:
- https://www.hybrid-analysis.com/sample/3a1f01206684410dbe8f1900bbeaaa543adfcd07368ba646b499fa5274b9edf6?environmentId=100
- https://www.hybrid-analysis.com/sample/f16c729aad5c74f19784a24257236a8bbe27f7cdc4a89806031ec7f1bebbd475?environmentId=100
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
date: 2019-01-16
modified: 2021-11-27
tags:
- attack.execution
- attack.command-and-control
- attack.t1059.003
- attack.t1059.001
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - 'http'         # captures both http and https
    - '://'
    - '%AppData%'
  condition: selection
falsepositives:
- High
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify potentially malicious command line executions that incorporate both URLs and references to the AppData directory in the command line parameters. This behavior is commonly associated with various droppers—malicious scripts that typically execute other payloads, including JavaScript or VBScript invoked through PowerShell. Attackers may leverage this technique to download and execute additional malware, thereby establishing a foothold within the compromised environment.

  The primary objective of such an attack is to gain unauthorized access and control over systems, allowing the attacker to further exploit vulnerabilities or exfiltrate sensitive data. This scenario falls under multiple MITRE ATT&CK tactics and techniques, primarily focusing on Execution (Tactics) with relevant techniques such as Command and Scripting Interpreter (T1059.003) and Windows Command Shell (T1059.001). The rule can effectively identify these behaviors in environments where Windows processes execute command line instructions.

  The main data source relevant for this detection is **process creation logs** from Windows, which capture command line arguments associated with executed commands, providing critical insight into potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for instances of `cmd.exe` executing commands containing both a URL (http/https) and references to `%AppData%`. Look for execution timestamps and correlate with user activity.

  - **Analyze Recent Executable Activity:** Identify any suspicious executables that may have executed via command line along with the related parent process. Correlate these events with known indicators of compromise.

  - **Check for Unusual Network Activity:** Investigate outbound connections to the URL identified in the command line parameters. Note any unusual patterns such as connections to newly registered domains or known malicious sites.

  - **Investigate User Accounts and Permissions:** Review the user account that executed the command for unusual privilege levels or access patterns. Evaluate whether the command execution respects the least privilege principle.

  ### Prioritization
  This alert should be considered medium severity due to its potential to indicate the presence of droppers, which can lead to further exploitation of systems. The likelihood is elevated, as sophisticated attackers often utilize these techniques to execute payloads in the enterprise environment.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the potential for attackers to obfuscate their commands, which may not be captured by the specific strings used in the detection logic. The detection assumes that process creation logs are configured and monitored consistently. It may also overlook command line executions that do not involve AppData or that utilize different command interpreters. Effective detection depends on the presence of comprehensive logging configurations that include process command line parameters.

