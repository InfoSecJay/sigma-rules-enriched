title: Potential PowerShell Obfuscation Via Reversed Commands
id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
status: test
description: Detects the presence of reversed PowerShell commands in the 
  CommandLine. This is often used as a method of obfuscation by attackers
references:
- https://2019.offzone.moscow/ru/report/hunting-for-powershell-abuses/
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=66
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim 
  Shelton
date: 2020-10-11
modified: 2023-05-31
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
    - 'hctac'
    - 'kaerb'
    - 'dnammoc'
    - 'ekovn'         # Also covers 'ekovni'
    - 'eliFd'
    - 'rahc'
    - 'etirw'
    - 'golon'
    - 'tninon'
    - 'eddih'
    - 'tpircS'
    - 'ssecorp'
    - 'llehsrewop'
    - 'esnopser'
    - 'daolnwod'
    - 'tneilCbeW'
    - 'tneilc'
    - 'ptth'
    - 'elifotevas'
    - '46esab'
    - 'htaPpmeTteG'
    - 'tcejbO'
    - 'maerts'
    - 'hcaerof'
    - 'retupmoc'
  filter_main_encoded_keyword:
        # We exclude usage of encoded commands as they might generate FPs as shown here:
        #   https://github.com/SigmaHQ/sigma/pull/2720
        #   https://github.com/SigmaHQ/sigma/issues/4270
    CommandLine|contains:
    - ' -EncodedCommand '
    - ' -enc '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of reversed PowerShell commands in command line executions, a common obfuscation technique employed by attackers to evade detection. The primary objective of such behavior is to execute malicious payloads or scripts while avoiding straightforward analysis from security tools and analysts. This activity maps to the MITRE ATT&CK tactics of Defense Evasion (T1203) and Execution (T1059.001).

  The primary telemetry sources are the process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, capturing command line parameters. If malicious, this behavior can lead to unauthorized system access, lateral movement, or data exfiltration. It's important to note that this detection does NOT confirm that the PowerShell execution is malicious; legitimate operations may also utilize PowerShell.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Event ID 4688 and Sysmon Event ID 1 for instance of PowerShell executed with reversed commands (e.g., 'hctac', 'kaerb'). Cross-reference this with the user account to determine if it is expected behavior.

  - **Correlate with historical activity**: Analyze the user and system behavior preceding the alert to identify any prior network activity or successful logins that align with the alert time frame, focusing on unusual command line patterns.

  - **Identify legitimate PowerShell usage**: Determine if the detected commands are part of legitimate administrative tasks or scheduled jobs. Regular PowerShell usage should prominently feature clear, understandable commands without obfuscation.

  - **Search for sensitive file interactions**: Examine for concurrent file operations or transfers, such as data written to system folders or non-standard locations that could indicate exfiltration attempts, utilizing Sysmon Event ID 11 for file creation.

  - **Look for associated alerts**: Cross-reference with other alerts indicating suspicious network activity, such as unusual outbound connections that may accompany the use of obfuscated commands, particularly those targeting common C2 ports.

  ### Prioritization

  This alert is rated high due to the critical nature of PowerShell and its ability to execute arbitrary commands, which can lead to severe security incidents. The presence of reverse commands is a strong indicator of potential malicious intent, particularly within environments where PowerShell misuse is prevalent.

  ### Blind Spots and Assumptions

  Limitations of this detection include the potential for evasion techniques such as command obfuscation through encoding or varying command syntax, which may not generate alarms. Furthermore, the configuration of the logging infrastructure is crucial; any gaps in command line logging could lead to undetected malicious activity. Additionally, legitimate IT operations or maintenance scripts performing complex operations may inadvertently trigger this alert. Companion detections, such as monitoring for unusual network connections (e.g., outbound traffic to unrecognized domains) after these command executions, can enhance detection capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
