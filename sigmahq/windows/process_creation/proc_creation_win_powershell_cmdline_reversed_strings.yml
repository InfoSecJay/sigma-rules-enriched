title: Potential PowerShell Obfuscation Via Reversed Commands
id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
status: test
description: Detects the presence of reversed PowerShell commands in the 
  CommandLine. This is often used as a method of obfuscation by attackers
references:
- https://2019.offzone.moscow/ru/report/hunting-for-powershell-abuses/
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=66
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim 
  Shelton
date: 2020-10-11
modified: 2023-05-31
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
    - 'hctac'
    - 'kaerb'
    - 'dnammoc'
    - 'ekovn'         # Also covers 'ekovni'
    - 'eliFd'
    - 'rahc'
    - 'etirw'
    - 'golon'
    - 'tninon'
    - 'eddih'
    - 'tpircS'
    - 'ssecorp'
    - 'llehsrewop'
    - 'esnopser'
    - 'daolnwod'
    - 'tneilCbeW'
    - 'tneilc'
    - 'ptth'
    - 'elifotevas'
    - '46esab'
    - 'htaPpmeTteG'
    - 'tcejbO'
    - 'maerts'
    - 'hcaerof'
    - 'retupmoc'
  filter_main_encoded_keyword:
        # We exclude usage of encoded commands as they might generate FPs as shown here:
        #   https://github.com/SigmaHQ/sigma/pull/2720
        #   https://github.com/SigmaHQ/sigma/issues/4270
    CommandLine|contains:
    - ' -EncodedCommand '
    - ' -enc '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of reversed PowerShell commands, a common obfuscation technique employed by attackers to hide their activities and evade detection. The likely attacker objective includes executing malicious scripts or commands while masking their true intentions. This behavior corresponds to the MITRE ATT&CK techniques of Defense Evasion (T1027) and Command and Control (T1059.001) using PowerShell.

  The primary telemetry source is Windows process creation logs, particularly focusing on the `CommandLine` field and `Image` corresponding to PowerShell executable files such as `powershell.exe` or `pwsh.exe`. If malicious, this activity can lead to unauthorized access, data exfiltration, or system compromise. However, this detection does NOT confirm malicious intent solely based on the presence of reversed commands without contextual evidence.

  ### Investigation Steps

  - **Verify the process origin:** Check the `Image` field in Event ID 4688 logs to confirm whether the process ran from a legitimate path (e.g., `C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe`). Path deviations or unusual directories may indicate malicious activity.

  - **Analyze the CommandLine:** Review the `CommandLine` field values for reversed commands like `kaerb` (break) or `golon` (login). Any instances of these should be scrutinized for contextual use and combined with other telemetry.

  - **Look for known benign usage:** Identify legitimate PowerShell scripts or administrative tasks that may demonstrate the legitimate use of PowerShell commands, such as routine maintenance tasks or updates. Note the CommandLine patterns used in these contexts to differentiate from suspicious behavior.

  - **Check for evidence of further exploitation:** Examine Event IDs 4104 (PowerShell script block logging) and Windows Event ID 4688 for subsequent command executions or process chains stemming from the detected activity. Observe for processes spawned directly by PowerShell with suspicious command lines.

  - **Correlate with other threat intelligence:** Cross-reference noted reversed commands with threat intelligence feeds or known attack patterns that detail their use in previous incidents. Identify any malware or known tactics associated with the detected commands.

  - **Report and escalate as necessary:** If a definitive malicious indicator is established, such as the execution of an obfuscated command leading to a script that downloads additional payloads (especially if using URLs like `-tneilCbeW`), escalate to Tier 3 for further investigation and remediation.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on enterprise security if compromised systems are involved in executing malicious commands. The likelihood of abuse is significant, given that this obfuscation technique is commonly utilized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate PowerShell usage to trigger false positives, as many administrative tasks may employ similar command structures. The effective operation of this detection relies on the configuration of Windows Event Logging to capture detailed process creation events (Event ID 4688). Additionally, expected administrative tasks using PowerShell may include routine updates or configuration changes, which should be well-documented to avoid misidentification. A related detection to consider is monitoring for unusual network connections generated by PowerShell scripts, as this can reinforce context and provide additional coverage regarding malicious activity.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
