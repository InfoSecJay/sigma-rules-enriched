title: Potential PowerShell Obfuscation Via Reversed Commands
id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
status: test
description: Detects the presence of reversed PowerShell commands in the CommandLine.
  This is often used as a method of obfuscation by attackers
references:
- https://2019.offzone.moscow/ru/report/hunting-for-powershell-abuses/
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=66
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
date: 2020-10-11
modified: 2023-05-31
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
    - 'hctac'
    - 'kaerb'
    - 'dnammoc'
    - 'ekovn'         # Also covers 'ekovni'
    - 'eliFd'
    - 'rahc'
    - 'etirw'
    - 'golon'
    - 'tninon'
    - 'eddih'
    - 'tpircS'
    - 'ssecorp'
    - 'llehsrewop'
    - 'esnopser'
    - 'daolnwod'
    - 'tneilCbeW'
    - 'tneilc'
    - 'ptth'
    - 'elifotevas'
    - '46esab'
    - 'htaPpmeTteG'
    - 'tcejbO'
    - 'maerts'
    - 'hcaerof'
    - 'retupmoc'
  filter_main_encoded_keyword:
        # We exclude usage of encoded commands as they might generate FPs as shown here:
        #   https://github.com/SigmaHQ/sigma/pull/2720
        #   https://github.com/SigmaHQ/sigma/issues/4270
    CommandLine|contains:
    - ' -EncodedCommand '
    - ' -enc '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the utilization of reversed PowerShell commands, a common obfuscation technique employed by attackers to run malicious scripts and evade detection mechanisms. By reversing the alphanumeric characters in PowerShell commands (e.g., changing "Get-Command" to "dnammoc-teG"), adversaries aim to hinder analysis and impede traditional security tools. Attackers may utilize this technique as part of broader strategies to execute unauthorized commands in compromised environments, advance their foothold, or deploy malware payloads.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Defense Evasion (TA0005)** and **Execution (TA0002)**. The specific techniques are **Obfuscated Files or Information (T1027)** and **Command and Scripting Interpreter: Windows PowerShell (T1059.001)**. These techniques highlight the methods used by threat actors to circumvent security controls and execute harmful code within target systems.

  Primary data sources for effective detection include **process creation events (Windows Security logs)**, which capture detailed command line arguments and process images. Additionally, **Windows Event logs** can provide context on PowerShell operations, giving visibility into potentially nefarious activities within an enterprise's systems.

  ### Investigation Steps
  - **Review Command Line Arguments**: Analyze the command line arguments in process creation events for any instances of reversed PowerShell commands or unusual patterns indicative of obfuscation techniques. Pay particular attention to "powershell.exe" and "pwsh.exe" entries.

  - **Correlate with User Activity**: Check for associated user activity and contextualize the PowerShell execution by cross-referencing with user logs, application logs, and authentication logs to determine if the command execution was legitimate or suspicious based on user roles and behaviors.

  - **Examine Related Processes**: Investigate any parent-child relationships in process creation that may indicate a chain of command execution leading to the usage of obfuscated PowerShell commands. This may help uncover further malicious activity.

  - **Query System and Security Logs**: Utilize your SIEM or security tools to run queries against logs for repeated occurrences of known obfuscated commands and track any anomalies or patterns that may suggest larger exploitation attempts or campaigns in progress.

  ### Prioritization
  Given the high likelihood of severe consequences from successful exploitation, alerts generated by this rule should be treated with high severity. PowerShell is a powerful tool often utilized by attackers for malicious purposes, making this detection critical to preventing persistent threats within the environment.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage regarding legitimate administrative usage of obfuscated commands. There is an assumption that all PowerShell command executions are scrutinized, which may not account for benign administrative activities requiring similar command structures. Additionally, proper logging configurations must be in place for process creation events to ensure that command line information is captured and available for analysis effectively for this rule to function optimally.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
