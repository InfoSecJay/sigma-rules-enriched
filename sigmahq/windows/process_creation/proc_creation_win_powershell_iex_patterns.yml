title: Suspicious PowerShell IEX Execution Patterns
id: 09576804-7a05-458e-a817-eb718ca91f54
status: test
description: Detects suspicious ways to run Invoke-Execution using IEX alias
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-expression?view=powershell-7.2
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-03-24
modified: 2022-11-28
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_combined_1:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - ' | iex;'
    - ' | iex '
    - ' | iex}'
    - ' | IEX ;'
    - ' | IEX -Error'
    - ' | IEX (new'
    - ');IEX '
  selection_combined_2:
    CommandLine|contains:
    - '::FromBase64String'
    - '.GetString([System.Convert]::'
  selection_standalone:
    CommandLine|contains:
    - ')|iex;$'
    - ');iex($'
    - ');iex $'
    - ' | IEX | '
    - ' | iex\"'
  condition: all of selection_combined_* or selection_standalone
falsepositives:
- Legitimate scripts that use IEX
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell command executions that utilize the IEX (Invoke-Expression) alias to run potentially malicious code, particularly through obfuscated strings or encoding techniques. The likely objective of such behavior is to execute arbitrary commands or payloads that may be a part of post-exploitation activities, such as remote access or data exfiltration. This behavior correlates with the MITRE ATT&CK technique "Command and Scripting Interpreter: Windows PowerShell" (T1059.001).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Windows Sysmon Event ID 1. If malicious, the impact could include unauthorized system access, data theft, or lateral movement within the network. It is important to note that this detection alone does not confirm malicious intent—legitimate PowerShell scripts may also utilize IEX for valid purposes.

  ### Investigation Steps

  - **Inspect the PowerShell command line arguments:** Review Security Event ID 4688 for the command line of the detected process. Look for patterns of obfuscation, specifically the presence of '| iex' or encoding patterns such as '[System.Convert]::FromBase64String'.

  - **Identify high-confidence malicious indicators:** Check for suspicious scripts or known hash values of malicious payloads in execution context. Look for obfuscated scripts by checking for patterns indicating encodings (e.g., Base64) in CommandLine fields.

  - **Validate legitimate usage:** Identify whether the alerting IEX usage aligns with legitimate business processes. Document expected PowerShell scripts that run IEX for legitimate purposes and confirm their execution context against the time of alert.

  - **Cross-reference with Sysmon logs:** Review Sysmon Event ID 1 for the parent process to contextualize the execution. A PowerShell instance spawned by a process such as cmd.exe or a suspicious executable could indicate malicious behavior.

  - **Monitor for follow-on behaviors:** Following IEX execution, track subsequent commands or processes initiated by PowerShell. Look for outbound network connections to known malicious IPs, data exfiltration patterns, or credential dumping attempts.

  ### Prioritization

  This alert should be treated with high severity given the potential for significant impact on the organization if exploited. The use of IEX is commonly associated with malware that aims to gain unauthorized access or steal sensitive data, making this behavior a priority for investigation.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative use of IEX in scripts, potentially leading to false positives. Reliable detection necessitates proper logging of PowerShell activities, requiring configurations in Group Policy for Enhanced Logging. Common legitimate activities like routine system maintenance scripts may trigger this alert. Additional detections that can complement this rule include monitoring for unusual network connections established by PowerShell processes to identify potential data exfiltration or command-and-control communication.

