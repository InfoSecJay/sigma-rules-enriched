title: Suspicious PowerShell IEX Execution Patterns
id: 09576804-7a05-458e-a817-eb718ca91f54
status: test
description: Detects suspicious ways to run Invoke-Execution using IEX alias
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-expression?view=powershell-7.2
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-03-24
modified: 2022-11-28
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_combined_1:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - ' | iex;'
    - ' | iex '
    - ' | iex}'
    - ' | IEX ;'
    - ' | IEX -Error'
    - ' | IEX (new'
    - ');IEX '
  selection_combined_2:
    CommandLine|contains:
    - '::FromBase64String'
    - '.GetString([System.Convert]::'
  selection_standalone:
    CommandLine|contains:
    - ')|iex;$'
    - ');iex($'
    - ');iex $'
    - ' | IEX | '
    - ' | iex\"'
  condition: all of selection_combined_* or selection_standalone
falsepositives:
- Legitimate scripts that use IEX
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_iex_patterns/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell's Invoke-Expression (`IEX`) command with suspicious patterns. Attackers typically use `IEX` to execute arbitrary code or download and execute malicious scripts, often obfuscating the commands to evade detection. This behavior aligns with the MITRE ATT&CK technique **Execution via PowerShell (T1059.001)**.

  The primary telemetry source for this detection is Windows process creation events, specifically monitored via Security Event ID 4688 or Sysmon Event ID 1, which log command-line arguments. If the command indicated is malicious, it could lead to the execution of payloads, unauthorized data access, or further lateral movement within the network. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate scripts may also use `IEX`.

  ### Investigation Steps

  - **Check the command line:**
    Review the command line in Security Event ID 4688 or Sysmon Event ID 1 for patterns containing ` | iex;`, ` | IEX -Error`, or similar. Legitimate use cases may include known scripts from trusted sources but typically won't be obfuscated.

  - **Identify the parent process:**
    Investigate the parent process of the PowerShell execution. Look for suspicious processes such as cmd.exe or a known malicious tool (e.g., Meterpreter) that may indicate an attack vector.

  - **Monitor for unusual network activity:**
    Analyze network logs for outbound connections initiated shortly after the suspicious PowerShell execution. Look specifically at connections to untrusted external IPs or domains that resolve immediately following `IEX` commands.

  - **Correlate with other alerts:**
    Cross-reference the event with other alerts that might indicate lateral movement or exploitation, such as failed logins, unusual account activities, or a spike in resource utilization.

  - **Check for script history:**
    Review the user's PowerShell script history for recent commands run via `IEX`. If the history shows a pattern of commands that are not regularly executed by the user, this could indicate malicious behavior.

  ### Prioritization

  This alert warrants a high-priority response due to the potential impact on compromised systems and the common exploitation patterns observed with `IEX` in malicious operations. The likelihood of abuse is significant as this technique is often associated with a variety of attacks, including ransomware distribution and data exfiltration.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to capture detailed command line information or if log retention is set too low. Legitimate administrative actions using `IEX` for script execution may inadvertently trigger the alert. A related detection to consider is monitoring for base64 encoded commands in PowerShell (`T1059.001`), which may indicate further obfuscation techniques employed by adversaries.

