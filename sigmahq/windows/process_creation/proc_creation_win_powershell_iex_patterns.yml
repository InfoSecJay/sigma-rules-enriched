title: Suspicious PowerShell IEX Execution Patterns
id: 09576804-7a05-458e-a817-eb718ca91f54
status: test
description: Detects suspicious ways to run Invoke-Execution using IEX alias
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-expression?view=powershell-7.2
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-03-24
modified: 2022-11-28
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_combined_1:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - ' | iex;'
    - ' | iex '
    - ' | iex}'
    - ' | IEX ;'
    - ' | IEX -Error'
    - ' | IEX (new'
    - ');IEX '
  selection_combined_2:
    CommandLine|contains:
    - '::FromBase64String'
    - '.GetString([System.Convert]::'
  selection_standalone:
    CommandLine|contains:
    - ')|iex;$'
    - ');iex($'
    - ');iex $'
    - ' | IEX | '
    - ' | iex\"'
  condition: all of selection_combined_* or selection_standalone
falsepositives:
- Legitimate scripts that use IEX
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious execution patterns involving PowerShell’s `Invoke-Expression` (IEX) alias, which is often used in malicious scripts to execute code dynamically. Attackers frequently exploit this functionality to execute payloads that may have been encoded or obfuscated, making it a common technique during exploitation, lateral movement, or command-and-control activities. By recognizing these patterns, organizations can detect potential post-compromise behaviors and prevent further exploitation.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002) and specifically the technique **Command and Scripting Interpreter: Windows PowerShell** (T1059.001). The primary data sources for this detection are process creation events that log the execution parameters of PowerShell and other associated command-line invocation patterns. Proper monitoring of these logs can reveal suspicious activities indicative of exploitation attempts or the presence of malicious PowerShell scripts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation event logs for `powershell.exe` and `pwsh.exe`, focusing on command lines that include the patterns specified in the detection logic.
  - **Analyze Recent PowerShell Activity:** Investigate recent executions of PowerShell, especially those containing `iex` and .NET conversion methods, which may highlight malicious scripts or tools in use.
  - **Correlate with Endpoint Activity:** Check for other related artifacts such as unusual network connections, file changes, or registry modifications that may indicate an ongoing attack or post-exploitation activity.
  - **Assess User Behavior:** Evaluate whether the user account that executed the suspicious commands has a legitimate reason for doing so. Look for evidence of credential theft or lateral movement if the command was executed outside of typical behavior for that user.

  ### Prioritization
  This alert is classified as high severity due to the significant risk associated with the execution of PowerShell using IEX, which is often leveraged by threat actors to bypass security controls and execute malicious payloads. Misuse of this technique could lead to data breaches, lateral movement, or deployment of additional malware.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the organization employs legitimate PowerShell scripts that use IEX, as these could trigger false positives. The detection logic assumes that all instances of IEX invocations are suspicious, but there may be valid use cases within the enterprise. Additionally, adequate logging of process creation events with full command-line arguments must be enabled; otherwise, the execution patterns may not be captured accurately, affecting the efficacy of this rule.

