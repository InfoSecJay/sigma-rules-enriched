logsource:
  product: windows
  category: process_creation
detection:
  parent_selection:
    ParentImage|endswith: '\cmd.exe'
    ParentCommandLine|endswith: '.bat'
  selection1:
    Image|endswith: '\xcopy.exe'
    CommandLine|contains|all:
    - 'powershell.exe'
    - '.bat.exe'
  selection2:
    Image|endswith: '\xcopy.exe'
    CommandLine|contains|all:
    - 'pwsh.exe'
    - '.bat.exe'
  selection3:
    Image|endswith: '\attrib.exe'
    CommandLine|contains|all:
    - '+s'
    - '+h'
    - '.bat.exe'
  condition: parent_selection and (1 of selection*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the usage of Jlaive, a tool utilized for executing assemblies within an altered PowerShell environment, specifically when executed via command line interfaces like `cmd.exe`. The detection focuses on the behavioral patterns exhibited when Jlaive attempts to circumvent security measures, which include executing arbitrary code using `xcopy.exe` or `attrib.exe` commands in conjunction with PowerShell. The likely objective of an attacker leveraging Jlaive is to evade antivirus and security solutions by executing malicious scripts or commands in memory, thus minimizing the chance of detection.

  Relevant MITRE ATT&CK tactics/techniques applicable to this rule include **Execution (T1203)**, as it captures execution methods used by adversaries to run malicious code. Specifically, it also aligns with **Command and Scripting Interpreter: PowerShell (T1059.003)**, focusing on the misuse of PowerShell for executing potentially harmful commands. The primary data sources for this detection involve process creation logs, where entries indicate suspicious command line activities and parent-child process relationships, particularly involving PowerShell and batch scripts.

  ### Investigation Steps
  - **Examine Process Creation Logs:** Review logs for process creation events where the parent process is `cmd.exe` or an associated batch file. Pay particular attention to any unusual command lines that include `xcopy.exe` or `attrib.exe` executing PowerShell scripts.
  - **Analyze Command Line Arguments:** Scrutinize command-line parameters used in associated process creation events for signs of malicious intent, especially those containing `.bat.exe`, `+s`, or `+h` flags, which can indicate attempts to manipulate file attributes stealthily.
  - **Inspect Network Activity:** If applicable, check for any outbound connections or network traffic originating from systems where these processes were detected, as this could indicate command and control communication or data exfiltration attempts.
  - **Correlate with User Behavior:** Investigate whether the user account associated with the execution has a history of executing scripts or performing tasks that warrant scrutiny. Unusual behavior may indicate potential compromise or misuse of privileges.

  ### Prioritization
  Alerts generated by this detection rule are deemed medium severity due to the potential for significant impact if an adversary gains unauthorized execution capabilities through Jlaive while also indicating an intention to evade security controls. The likelihood of occurrence can be moderate in environments where PowerShell is frequently used, necessitating careful monitoring.

  ### Blind Spots and Assumptions
  The detection logic has some limitations, particularly regarding its reliance on known command patterns associated with Jlaive. It may not capture all instances of Jlaive’s use if attackers employ modifications or different execution methods that do not conform to the defined rules. Additionally, the rule assumes that the presence of specific parent commands and parameters indicates malicious activity, which may not always hold true. For optimal alert functionality, it is essential that process creation logs are enabled and retained for analysis in the security monitoring systems.

