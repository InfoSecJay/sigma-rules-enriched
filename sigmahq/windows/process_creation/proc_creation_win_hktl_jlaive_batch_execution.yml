detection:
  parent_selection:
    ParentImage|endswith: '\cmd.exe'
    ParentCommandLine|endswith: '.bat'
  selection1:
    Image|endswith: '\xcopy.exe'
    CommandLine|contains|all:
    - 'powershell.exe'
    - '.bat.exe'
  selection2:
    Image|endswith: '\xcopy.exe'
    CommandLine|contains|all:
    - 'pwsh.exe'
    - '.bat.exe'
  selection3:
    Image|endswith: '\attrib.exe'
    CommandLine|contains|all:
    - '+s'
    - '+h'
    - '.bat.exe'
  condition: parent_selection and (1 of selection*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of assemblies via the Jlaive tool, which leverages PowerShell for evasion during execution of batch files (e.g., *.bat). The likely objective of an attacker using Jlaive is to execute arbitrary code on a target system while evading detection mechanisms, often for data exfiltration or system compromise. The relevant MITRE ATT&CK techniques are **Execution** (T1059.003 - Windows Command Shell) and **Defense Evasion** (T1218.011 - Signed Binary Proxy Execution).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Script Block Logging for PowerShell (if enabled) to capture the command lines involved. If successfully executed, this behavior can lead to unauthorized actions or prolonged access to the target system. It is important to note that this detection does NOT confirm malicious intent on its own; a benign use of similar command patterns in legitimate administrative scripts might trigger the alert.

  ### Investigation Steps

  - **Verify the parent process: ** Review Process Creation logs for Event ID 4688 to confirm that the detected command originated from `cmd.exe` running a *.bat file. If confirmed, proceed with further analysis.

  - **Analyze command line arguments: ** Inspect CommandLine fields in process logs for instances of `powershell.exe` or `pwsh.exe` followed by `*.bat.exe`. If these are present, consider the possibility of malicious activity.

  - **Identify legitimate administrative behavior: ** Confirm expected use of PowerShell/BAT scripts for scheduled tasks or administrative scripts. Check the originating system's role to see if it is designed for script execution (e.g., a management server).

  - **Look for multiple execution patterns: ** Cross-reference the executed commands against normal operational patterns. A spike in executions of `xcopy.exe` with batch files during business hours could indicate malicious use.

  - **Review potential file artifacts: ** Check for the creation of any temporary files associated with the execution, particularly those created unknowingly by `xcopy.exe` or other related tools. This could indicate an attempt to stage or exfiltrate data.

  - **Correlate with related alerts: ** Check SIEM for any correlated alerts related to PowerShell execution anomalies or other known evasion techniques. Any prior alerts could provide context indicating a larger attack vector or a sophisticated adversary.

  ### Prioritization

  This alert should be treated with medium severity due to its potential link to malicious execution techniques and the importance of the systems involved. Systems that detect this behavior are often critical and could indicate early stages of persistent threats leveraging Jlaive.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain logging configurations for PowerShell. The use of legitimate administrative tools like `xcopy.exe` or batch scripts can trigger this alert, thus necessitating careful analysis of context. Additionally, similar execution behaviors may occur due to other benign circumstances and should be considered alongside companion detections such as unusual execution of `powershell.exe` or suspicious PowerShell scripts (e.g., T1059 - command line execution).

