note: |
  ### Technical Context

  This rule detects the use of the `Get-ADUser` cmdlet, a PowerShell command used to retrieve Active Directory user information, typically followed by file output commands. The likely attacker objective is to enumerate user accounts within a domain, which could facilitate further attacks, such as credential harvesting or lateral movement. This behavior aligns with the MITRE ATT&CK technique T1033: Credential Collection.

  Primary telemetry sources include Windows process creation logs, specifically focusing on PowerShell execution events. If an attacker uses this cmdlet maliciously, the security impact can be significant as it may expose sensitive account information. This detection does NOT confirm malicious activity on its own, as legitimate administrative tasks can also generate this alert.

  ### Investigation Steps

  - **Review process creation events**: Check Security Event ID 4688 for PowerShell process creation, focusing on `NewProcessName` containing `powershell.exe` or `pwsh.exe` and `CommandLine` for suspicious arguments related to `Get-ADUser`.

  - **Analyze command output redirection**: Look for PowerShell command lines with operators like `>`, `| Select`, `Out-File`, `Set-Content`, or `Add-Content`, indicating that data may be exported to a file, which is common in malicious use cases.

  - **Validate legitimate administrative actions**: Compare the alerting command with typical PowerShell scripts run by IT administrators, as these commands might be regularly used for user audits or reports, especially in Windows Server environments.

  - **Investigate recent account activity**: Cross-reference the output file generated with recent changes in Active Directory to identify if legitimate accounts were targeted during the event, indicating potential abuse.

  - **Look for abnormal data transfer**: Review the affected system for Event ID 5145 (File Share Access) or relevant HTTP logs that indicate file transfers to external servers following the suspicious PowerShell execution.

  ### Prioritization

  This alert carries medium severity, as the detection involves potentially sensitive account information retrieval. The likelihood of malicious abuse is moderate, with a known adversary tactic to leverage such PowerShell commands. While the behavior can be legitimate, it is often weaponized during reconnaissance phases of more extensive targeted attacks.

  ### Blind Spots and Assumptions

  The detection may miss obfuscation techniques used by attackers to disguise their command. Ensuring that the logging level for PowerShell activities is appropriately configured is critical for reliable detection. Legitimate activities, such as administrative auditing and reporting tasks, may trigger this alert, leading to false positives. Monitoring for related detections, such as unusual file output patterns, can enhance overall security coverage.

