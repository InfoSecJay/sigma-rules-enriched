note: |
  ### Technical Context
  This detection rule identifies the use of the PowerShell cmdlet `Get-ADUser` for gathering user information from Active Directory and subsequently exporting that data to a file. Attackers may exploit such cmdlets to enumerate user accounts as part of their reconnaissance phase during a compromise. With the information obtained, they can identify potential targets for further attacks, such as phishing or lateral movement, thereby enhancing their operational intelligence.

  The rule aligns with several MITRE ATT&CK techniques, specifically `T1033: System Owner/User Discovery`, which falls under the `Discovery` tactic. By leveraging `Get-ADUser`, an attacker aims to collect user attributes to identify privileges, roles, or ownership of sensitive accounts, which can facilitate further exploitation. Primary data sources for this detection include process creation logs from Windows systems that capture command-line usage of PowerShell, which is where the command would typically be executed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for any instances of `powershell.exe` or `pwsh.exe` along with the execution of the `Get-ADUser` cmdlet. Pay close attention to command-line arguments that may indicate mass enumeration or exporting of user data.

  - **Analyze Command-Line Arguments:** Investigate command-line arguments used with `Get-ADUser`, particularly looking for patterns that include redirection (`>`), piping (`|`), or the usage of output commands like `Out-File`, `Set-Content`, or `Add-Content` which suggest that the output is being saved externally.

  - **Correlate with Event Logs:** Cross-reference with Windows Security logs to look for any subsequent user or group modifications that relate to the information harvested during the discovery phase, indicating potential further malicious activities.

  - **Check Regular Use Patterns:** Identify any legitimate administrative scripts that might frequently execute the `Get-ADUser` cmdlet. This may involve creating an exception list for specific users or machines that routinely perform these actions to reduce false positives.

  ### Prioritization
  This alert is rated medium severity due to its potential to assist attackers in the early stages of a multistage attack, facilitating further exploitation of accounts and systems within the enterprise. The likelihood of an attacker utilizing this method to gather sensitive information before executing more impactful actions warrants timely investigation.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage related to legitimate administrative activities, as this detection may generate false positives when authorized users execute the `Get-ADUser` cmdlet as part of routine administrative tasks. The detection logic assumes that the presence of `Get-ADUser` with exporting behaviors is inherently malicious, which may not always be valid. To ensure this alert functions properly, it is essential to have accurate process creation logs enabled and properly configured to capture command-line arguments comprehensively.

