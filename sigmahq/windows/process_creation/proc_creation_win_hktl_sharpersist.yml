logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\SharPersist.exe'
  - Product: 'SharPersist'
  selection_cli_1:
    CommandLine|contains:
    - ' -t schtask -c '
    - ' -t startupfolder -c '
  selection_cli_2:
    CommandLine|contains|all:
    - ' -t reg -c '
    - ' -m add'
  selection_cli_3:
    CommandLine|contains|all:
    - ' -t service -c '
    - ' -m add'
  selection_cli_4:
    CommandLine|contains|all:
    - ' -t schtask -c '
    - ' -m add'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the hacktool SharPersist, which is employed to establish persistence mechanisms on compromised Windows systems. The likely objective of an attacker using SharPersist is to maintain access to the system even after reboots or system updates by creating scheduled tasks, registry entries, or services. This behavior is relevant to the MITRE ATT&CK tactic of Persistence (TA0003) and techniques such as Scheduled Task/Job (T1053) and Registry Run Keys / Startup Folder (T1547).

  The primary telemetry source for this detection is Windows process creation logs that capture the execution of processes, specifically looking for the SharPersist executable and its associated command-line arguments. If malicious, the presence of this tool could indicate a significant security risk by facilitating ongoing unauthorized access. Importantly, this detection does not confirm malicious intent on its own, as the tool may be used legitimately by security professionals for testing or research purposes.

  ### Investigation Steps

  - **Check Process Execution**: Review the process creation logs (Security Event ID 4688 or Sysmon Event ID 1) for instances of `SharPersist.exe`. Look for event data showing execution time, user context, and parent processes to identify unexpected activity.

  - **Analyze Command-Line Arguments**: Inspect the command line associated with the `SharPersist.exe` execution. Particularly, identify if it includes `-t schtask -c`, `-t startupfolder -c`, `-t reg -c` with `-m add`, or `-t service -c`. This indicates actions meant to register persistence mechanisms.

  - **Identify Anomalous User Context**: Determine the user account executing `SharPersist.exe`. Legitimate administrative users performing system maintenance may invoke such tools, but abnormal use by non-admins or unfamiliar accounts should raise flags for investigation.

  - **Cross-Reference System Logs**: Look for additional signs of persistence mechanisms being set up via event logs, such as Security Event ID 4702 (Service modified) or Scheduled Task events (Event ID 106), indicating potential registry or service modifications.

  - **Validate against Known Tools**: Ensure that the execution of `SharPersist.exe` is not part of authorized tool use within the environment. Compare the detected instance with organizational baselines and check if there are similar tools allowed for legitimate use.

  ### Prioritization

  This alert is categorized as high severity due to potentially significant impacts on system integrity, as successful exploitation can result in unauthorized access and control. Given that persistence mechanisms are a focus of many attacks, the likelihood of malicious abuse is high, especially against critical systems.

  ### Blind Spots and Assumptions

  Detection may be limited if process logging is not enabled or configured correctly. Attackers may evade detection by using different persistence mechanisms or modifying the tool's executable. Legitimate IT administrative activities might trigger the alert when using similar methods for maintenance or testing purposes. A related detection that could strengthen coverage includes monitoring for changes in startup services (Event ID 7045).

