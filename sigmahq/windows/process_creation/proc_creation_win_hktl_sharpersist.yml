detection:
  selection_img:
  - Image|endswith: '\SharPersist.exe'
  - Product: 'SharPersist'
  selection_cli_1:
    CommandLine|contains:
    - ' -t schtask -c '
    - ' -t startupfolder -c '
  selection_cli_2:
    CommandLine|contains|all:
    - ' -t reg -c '
    - ' -m add'
  selection_cli_3:
    CommandLine|contains|all:
    - ' -t service -c '
    - ' -m add'
  selection_cli_4:
    CommandLine|contains|all:
    - ' -t schtask -c '
    - ' -m add'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the hacktool SharPersist, which is notably used by adversaries to establish persistence mechanisms on compromised systems. Persistence allows attackers to maintain access to a system even after reboots or standard remediation efforts. The primary objective of using SharPersist is to manipulate system functionalities, such as scheduled tasks, startup folders, registry entries, or services, to ensure that malicious payloads can execute without direct user intervention.

  The relevant MITRE ATT&CK tactics for this rule include:
  - **Persistence (T1547)**: Techniques involved with establishing persistence mechanisms.
  - **Execution (T1203)**: Techniques that involve running malicious code on a system.
  - **Privilege Escalation (T1068)**: Techniques that involve exploiting vulnerabilities to gain higher-level permissions.

  The best sources of telemetry for gathering evidence of this behavior include process creation events from Windows logs, specifically those that record command-line arguments associated with executable processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs for instances where the SharPersist executable (`SharPersist.exe`) is invoked. Pay close attention to the timestamps and user accounts associated with the process execution.

  - **Investigate Command-Line Arguments**: Focus on the command-line arguments utilized during execution. Look for any configurations reflecting common persistence methods, such as scheduled tasks or service installations, indicated by strings like `-t schtask -c` or `-m add`.

  - **Examine System Changes**: Check for recent modifications in system configuration files, service entries, tasks, or registry settings that may indicate unauthorized persistence techniques being implemented. This can include looking specifically for changes to the registry or system services.

  - **Correlate with User Activity**: Cross-reference the detected activity with user logs and authentication records to determine if the execution aligns with legitimate administrative actions or appears anomalous in the context of user behavior.

  ### Prioritization
  Given that persistence mechanisms are a critical step for attackers in maintaining illicit access, this alert holds a high severity in an enterprise setting. The execution of SharPersist could indicate that an organization has been compromised, necessitating immediate investigation and response to prevent further exploitation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may include environments where command-line logging is not enabled, or where process creation events are not fully captured. The detection logic assumes that the presence of SharPersist is anomalous in the environment; however, if legitimate applications of this tool exist, false positives may occur. Additionally, for the alert to function effectively, appropriate logging configurations must be enabled on Windows systems to capture the necessary process creation events and command-line arguments.

