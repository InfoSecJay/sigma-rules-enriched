title: Delete All Scheduled Tasks
id: 220457c1-1c9f-4c2e-afe6-9598926222c1
status: test
description: Detects the usage of schtasks with the delete flag and the asterisk symbol
  to delete all tasks from the schedule of the local computer, including tasks scheduled
  by other users.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-delete
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
tags:
- attack.impact
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - ' /delete '
    - '/tn \*'
    - ' /f'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to delete all scheduled tasks on a Windows machine using the `schtasks.exe` command. The specific command pattern involves the `/delete`, `/tn *`, and `/f` flags, which collectively enable the removal of all tasks from the local task scheduler. Attackers might employ this technique to disrupt system operations or to cover their tracks by eliminating utilities or scripts that could aid in their detection or forensic investigation.

  The likely threat actors could range from insiders with malicious intent to external attackers seeking to limit the victim's operational capabilities or erase traces of their presence. The ability to manipulate scheduled tasks ties closely to the MITRE ATT&CK technique of "Impact" (T1489), as deleting tasks can hinder organizational workflows and disaster recovery plans.

  Primary data sources for detecting this behavior should mainly include process creation events from Windows systems, which capture the execution of `schtasks.exe`, along with its command-line arguments that provide context about the operation being performed.

  ### Investigation Steps
  - **Review Process Creation Events**: Search for recent process creation logs that include `schtasks.exe` to find potentially malicious commands executed on the system.
  - **Analyze Command-Line Arguments**: Focus on command-line arguments, specifically those containing `/delete`, ` /tn *`, and `/f`, to confirm if all scheduled tasks were targeted for removal.
  - **Check for Related User Activity**: Investigate the user account responsible for executing the command to determine if it was authorized or if it shows signs of compromise.
  - **Correlate with Scheduled Task Logs**: Cross-reference any findings with scheduled task logs to establish when tasks were created and subsequently deleted, potentially linking this activity to other suspicious events.

  ### Prioritization
  The alert warrants high severity as deleting all scheduled tasks can severely impact operational capabilities, potentially leading to system downtime or disruption of critical services within an enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic may not capture scenarios where attackers use alternative methods to delete scheduled tasks or employ scripting techniques to perform batch deletions without direct calls to `schtasks.exe`. Additionally, the effectiveness of this rule hinges on the logging configuration of the Windows systems; if process creation logs are not collected or adequately retained, detection will be compromised. Assumptions include that the environment adheres to standard logging practices and that adequate privileges are required to execute the command in question.

