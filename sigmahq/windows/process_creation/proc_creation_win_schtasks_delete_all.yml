title: Delete All Scheduled Tasks
id: 220457c1-1c9f-4c2e-afe6-9598926222c1
status: test
description: Detects the usage of schtasks with the delete flag and the asterisk symbol
  to delete all tasks from the schedule of the local computer, including tasks scheduled
  by other users.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-delete
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
tags:
- attack.impact
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - ' /delete '
    - '/tn \*'
    - ' /f'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of the `schtasks.exe` command with the `/delete` flag, the `*` wildcard in its task name (`/tn *`), and the `/f` flag which forces deletion without confirmation. This behavior suggests an attempt to remove all scheduled tasks on the local computer, potentially indicating malicious actions aimed at disrupting services, hiding artifacts, or covering tracks after executing other tasks.

  The attacker's objective likely aligns with MITRE ATT&CK technique T1489 (Service Stop), where an adversary seeks to interrupt or disable scheduled operations, thus minimizing detection and operational awareness. The primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation) which log significant details about process invocations, including command line arguments.

  Malicious impacts include the removal of critical scheduled tasks that could affect system functionality and security monitoring features. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may invoke similar command structures.

  ---

  ### Investigation Steps

  - **Review executed commands:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for `schtasks.exe` being executed with `/delete /tn * /f`. Malicious executions will typically occur in unusual contexts or times compared to typical administrative scheduling activities.

  - **Assess recent task creations:** Look through Event ID 4698 (Task Created) to identify legitimate scheduled tasks created or modified shortly before or after the deletion command. Confirm that these tasks have a valid operational purpose.

  - **Verify user context:** Identify the user account executing `schtasks.exe`. Use Event ID 4624 (Logon) to ensure it’s a legitimate administrator or automated service account. Unexpected user accounts could indicate an adversary's presence.

  - **Track system changes:** Investigate artifacts in `C:\Windows\System32\Tasks\` to identify if significant or critical tasks are missing post-deletion. Compare against a baseline snapshot of tasks to identify any disruptions.

  - **Look for lateral movement indicators:** If `schtasks.exe` is executed on critical servers or domain controllers, cross-reference with Event ID 4627 (Group Membership) to determine if any privileged groups were accessed or altered within a suspicious timeframe.

  ---

  ### Prioritization

  The alert is rated high severity, particularly on critical servers or domain controllers, due to the potential for widespread disruption of scheduled security monitoring and maintenance tasks. The likelihood of malicious abuse is high, as this command is commonly weaponized by attackers to hide traces of their activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by techniques that employ command obfuscation or process injection to conceal malicious executions. The rule requires proper Windows logging configurations to capture necessary events reliably. Legitimate administrative scripts or routines may trigger similar commands. Consider implementing related detections targeting the creation of new scheduled tasks for a more holistic view of scheduled task modifications.

