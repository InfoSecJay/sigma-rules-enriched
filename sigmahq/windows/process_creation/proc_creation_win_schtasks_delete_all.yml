title: Delete All Scheduled Tasks
id: 220457c1-1c9f-4c2e-afe6-9598926222c1
status: test
description: Detects the usage of schtasks with the delete flag and the asterisk
  symbol to delete all tasks from the schedule of the local computer, including 
  tasks scheduled by other users.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-delete
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
tags:
- attack.impact
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - ' /delete '
    - '/tn \*'
    - ' /f'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `schtasks.exe` utility with parameters that enable the deletion of all scheduled tasks on a Windows machine. The detection specifically identifies the use of the `/delete` command along with the `/tn *` flag, which targets all tasks indiscriminately. The likely attacker objective is to disrupt legitimate scheduled tasks, potentially as part of a broader strategy to impair system functionality, cover tracks, or conduct further malicious activity such as privilege escalation or lateral movement.

  This behavior aligns with the MITRE ATT&CK framework under the tactic of Impact, specifically technique T1489 (Impact: Inhibit System Recovery). The primary telemetry source is process creation logs, particularly Windows Security Event ID 4688 (for process creation) and potentially Sysmon Event ID 1 for detailed command line logging. If successful and malicious, this action can severely disrupt operations. However, this detection does NOT confirm malicious intent on its own; it requires further context and analysis of other indicators.

  ### Investigation Steps

  - **Review process execution logs**: Check for Security Event ID 4688 log entries where the Image field contains `schtasks.exe`. Look for the CommandLine field to confirm the parameters include `/delete`, `/tn *`, and `/f`.

  - **Identify the user context**: Determine the user account executing this command. Cross-reference the account against known administrative roles and investigate whether it's unusual for this user to delete scheduled tasks.

  - **Examine existing scheduled tasks**: Use PowerShell (e.g., `Get-ScheduledTask`) to enumerate existing scheduled tasks before the alert. Compare them to post-alert state to confirm whether tasks have indeed been deleted.

  - **Assess system impact**: Review the system role of the affected host. If it's a critical server (e.g., domain controller, file server), the impact of deleting scheduled tasks is significantly higher, warranting immediate escalation.

  - **Look for other indicators of compromise**: Scan for ancillary log artifacts, such as suspicious file modifications or unusual process executions around the same time that this command was executed, to assess whether it ties into broader malicious activity.

  - **Identify legitimate script executions**: Validate whether any known maintenance scripts or administrative operations scheduled routine task deletions at this time, which could explain the activity as benign.

  ### Prioritization

  This alert has a high severity due to the potential impact on critical system functions. The likelihood of malicious use is considerable since the deletion of all scheduled tasks can disrupt services and is a common tactic employed by threat actors to maintain persistence or facilitate lateral movement.

  ### Blind Spots and Assumptions

  The detection may not catch all evasion techniques, such as attackers using alternate methods to delete tasks or employing stealthier approaches like scripting that obfuscates command execution. Additionally, it relies on correctly configured logging for process creation; missing or improperly configured logs can lead to undetected activities. Legitimate administrative actions, such as routine maintenance by IT staff, may also trigger this alert. A related detection could focus on the creation of potentially malicious scheduled tasks, which helps provide deeper insights into the behavior surrounding this alert.

