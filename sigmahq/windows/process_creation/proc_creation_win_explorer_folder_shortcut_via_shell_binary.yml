title: File Explorer Folder Opened Using Explorer Folder Shortcut Via Shell
id: c3d76afc-93df-461e-8e67-9b2bad3f2ac4
status: test
description: |
  Detects the initial execution of "cmd.exe" which spawns "explorer.exe" with the appropriate command line arguments for opening the "My Computer" folder.
author: '@Kostastsale'
references:
- https://ss64.com/nt/shell.html
date: 2022-12-22
modified: 2024-08-23
tags:
- attack.discovery
- attack.t1135
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith: '\explorer.exe'
    CommandLine|contains: 'shell:mycomputerfolder'
  condition: selection
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_explorer_folder_shortcut_via_shell_binary/info.yml
note: |
  ---

  ### Technical Context

  This Sigma rule detects instances where "cmd.exe" or its PowerShell equivalents are used to spawn "explorer.exe" with the specific command line argument to open the "My Computer" folder, commonly seen in legitimate use cases. However, this behavior can be indicative of an adversary's reconnaissance activity in a victim environment, as accessing system files and directory structure can aid malicious objectives such as data exfiltration or privilege escalation.

  The relevant MITRE ATT&CK techniques are Discovery (T1083) and Command and Control (T1135). Primary telemetry sources include Windows Security Event ID 4688 for process creation and Sysmon Event ID 1 to capture process details. If malicious, this behavior can lead to unauthorized access and exploitation of sensitive data. This detection does NOT confirm that malicious action is taking place; it highlights abnormal use of system commands that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for detailed insights into the process tree. Look for processes where "ParentImage" is "cmd.exe," "powershell.exe," or "pwsh.exe" and "Image" is "explorer.exe."

  - **Analyze command line arguments**: Check if the "CommandLine" field includes 'shell:mycomputerfolder.' Legitimate uses usually involve GUI-based access; suspicious command line usages may indicate an attacker trying to manipulate the system.

  - **Identify user context**: Determine the user account associated with the process creation. Administrative accounts executing this command could raise concern, while standard user accounts may indicate expected behavior if aligned with their roles.

  - **Correlate with atypical patterns**: Look for anomalies such as timestamps or the frequency of the events. Frequent access to the ‘My Computer’ folder by a user not engaged in legitimate administrative tasks may indicate malicious intent.

  - **Check for other command line executions**: Investigate related command executions around the same time that could signal lateral movement or further exploitation attempts. Focus on other processes initiated by the same parent process.

  - **Review file access logs**: Inspect log files for any indication of suspicious file access patterns that may coincide with the explorer execution, especially files that might be of interest to an attacker, like scripts or sensitive documents.

  ---

  ### Prioritization

  This alert should be considered high severity due to the elevated risk of discovery and potential exploitation associated with unauthorized system access. The likelihood of abuse is increased if the alert pertains to sensitive or critical systems. Such command patterns are known to be weaponized in various attack scenarios aimed at lateral movement and reconnaissance.

  ---

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative activities, particularly if IT staff routinely access system directory structures for troubleshooting. Additional telemetry such as PowerShell command logs or Windows Event logs will enhance detection reliability. The alert may also trigger from benign automation scripts that manipulate system folders. Companion detections to consider include alerts for anomalous PowerShell activity, which can reinforce overall visibility into potential exploitation activities.

