logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith: '\explorer.exe'
    CommandLine|contains: 'shell:mycomputerfolder'
  condition: selection
falsepositives:
- Unknown
level: high
regression_tests_path: 
