note: |
  ### Technical Context

  This Sigma rule detects an instance where `cmd.exe` or PowerShell spawns `explorer.exe` with command line arguments designed to open the "My Computer" folder using the shell shortcut. This behavior could indicate an adversary using Windows shell commands to navigate the file system as part of reconnaissance or data exfiltration efforts, such as exploring sensitive directories or identifying file locations.

  The relevant MITRE ATT&CK tactics and techniques include: **Discovery** (TA0007) and **GUI Application** (T1135). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which provides details on process spawning activities. If malicious in nature, this could indicate an attempt to investigate or steal sensitive information. However, this detection does NOT confirm malicious activity on its own as it can also be triggered by legitimate administrative tasks or user interactions.

  ### Investigation Steps

  - **Verify process chain**: Check the process tree for the parent PID of the `explorer.exe` instance. Look for unusual parent processes like `cmd.exe` or PowerShell processes (Event ID 4688 - `New Process Name` field should indicate `explorer.exe`).

  - **Assess command line arguments**: Inspect the command line parameters of the `explorer.exe` instance. Legitimate examples will often include default arguments without unusual file paths or flags (such as `shell:mycomputerfolder`). Review for any anomalies in the command line (Event ID 4688 - `Command Line` field).

  - **Review user context**: Identify the user account that triggered the event. Legitimate administrative tasks or user interactions can generate similar logs. Check if the user’s role aligns with that level of access, particularly if they should not normally access such directories (Active Directory logs can help confirm the user's role).

  - **Monitor for additional malicious indicators**: Look for other simultaneous suspicious behaviors, such as a high volume of file access by the same user account. Cross-reference with file access logs (Windows Security Event ID 4663 - `Object Type` and `Object Name` fields) to determine if sensitive files were accessed.

  - **Validate host behavior**: Review logs from the host to confirm expected behavior during the detection timeframe. For instance, if the host typically does not perform file system navigation actions via `cmd.exe` or `PowerShell`, that may indicate malicious activity.

  ### Prioritization

  This alert should be considered high severity due to the potential for discovery of sensitive information and the ease with which adversaries can exploit such capabilities. Given that command shell interactions are often weaponized in lateral movement and information gathering stages of an attack, immediate investigation is warranted, especially if this behavior is detected on critical assets.

  ### Blind Spots and Assumptions

  Detection may be circumvented by sophisticated attackers who use process injection or reflective loading techniques, thereby evading parent-child process tracking. Ensure you have comprehensive logging enabled for both process creations and command line activities to maintain reliable detection. Legitimate administrative tasks, such as system maintenance or user logins, may also trigger this alert. Companion detections could include monitoring for unusual command line usage patterns or elevated privileges being abused that correlate with this behavior.

