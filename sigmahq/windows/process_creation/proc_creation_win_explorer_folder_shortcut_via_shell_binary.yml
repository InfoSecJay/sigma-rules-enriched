note: |
  ### Technical Context
  This detection rule identifies instances where a command-line interface (CLI) process, specifically `cmd.exe` or a PowerShell variant, initiates the `explorer.exe` process to open the "My Computer" folder via the `shell:mycomputerfolder` argument. This behavior can indicate potentially malicious activity, such as an attacker attempting to access system files or manipulate the filesystem as part of a larger exploitation strategy or lateral movement effort.

  The threat scenario includes attackers leveraging command and control (C2) mechanisms that utilize legitimate system tools to obfuscate their actions. This technique may be used as a precursor to more overt malicious actions, such as privilege escalation, data exfiltration, or deploying additional payloads. Attackers might aim to gather information about the environment or search for exploitable assets before launching further attacks.

  Relevant MITRE ATT&CK techniques include:
  - **Discovery:**
    - T1135: Network Share Discovery
  - **Command and Control:**
    - T1071.001: Application Layer Protocol: Web Protocols

  The primary data sources for collecting evidence related to this detection rule include Windows process creation logs, which capture detailed information about newly started processes, their command lines, and their parent processes.

  ### Investigation Steps
  - **Event Log Review:** Examine Windows Event Logs related to process creation (Event ID 4688) to identify the invocation of `cmd.exe`, `powershell.exe`, or `pwsh.exe` that spawned `explorer.exe` with the `shell:mycomputerfolder` argument.
  - **Command Line Analysis:** Analyze the command line arguments of the detected processes for any abnormal or suspicious parameters that might indicate an unusual use of system tools.
  - **ProcMon Capture:** If available, use Windows Sysinternals Process Monitor (ProcMon) to capture further process behaviors leading to the detection, looking for file system changes or unusual process tree behaviors.
  - **Investigate User Context:** Determine the user context under which these processes were executed, looking for patterns of anomalous behavior that may indicate an insider threat or compromised account.

  ### Prioritization
  This alert is categorized as high severity due to the potential for exploitation of system tools by an attacker. Malicious use of legitimate processes can significantly increase the risk of data compromise and integrity loss within the enterprise environment.

  ### Blind Spots and Assumptions
  The detection relies on the accurate logging of process creation events on Windows systems. However, it may not capture cases where the attacker's methods do not involve the use of `cmd.exe`, `powershell.exe`, or `pwsh.exe`, thereby leaving a gap in detection coverage for diverse attack vectors. Assumptions made include that the environments are configured to log detailed process creation events. Proper auditing settings must be enabled, and logs must be retained to ensure the functionality of this alert.

