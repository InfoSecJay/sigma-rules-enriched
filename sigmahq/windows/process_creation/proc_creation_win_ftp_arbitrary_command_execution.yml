title: Potential Arbitrary Command Execution Via FTP.EXE
id: 06b401f4-107c-4ff9-947f-9ec1e7649f1e
status: test
description: Detects execution of "ftp.exe" script with the "-s" or "/s" flag 
  and any child processes ran by "ftp.exe".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Ftp/
author: Victor Sergeev, oscd.community
date: 2020-10-09
modified: 2024-04-23
tags:
- attack.execution
- attack.stealth
- attack.t1059
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\ftp.exe'
  selection_child_img:
  - Image|endswith: '\ftp.exe'
  - OriginalFileName: 'ftp.exe'
  selection_child_cli:
    CommandLine|contains|windash: '-s:'
  condition: selection_parent or all of selection_child_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `ftp.exe` with specific command line arguments (`-s` or `/s`), as well as any subsequent child processes it spawns. The likely attacker objective is to leverage FTP to transfer files, potentially executing arbitrary commands or data exfiltration without detection. This behavior fits within the MITRE ATT&CK framework under "Command and Control" (TA0011) and "Command-Line Interface" (T1059).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 for process creation and possibly Sysmon Event ID 1 for more granular details on command line arguments. If malicious, the security impact could involve data exfiltration or unauthorized command execution. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative tasks may also use FTP.

  ### Investigation Steps

  - **Check process creation details: **Review Security Event ID 4688 or Sysmon Event ID 1 logs for `ftp.exe`. Validate the command line arguments, specifically looking for usage of `-s`.

  - **Identify child processes initiated by `ftp.exe`:** Monitor events for any suspicious processes spawned after `ftp.exe` execution (Event ID 4688/Sysmon Event ID 1). Look for known malicious executables or scripts.

  - **Examine the execution context and parent processes: **Assess the user account that executed `ftp.exe`, particularly focusing on system accounts or suspicious users. Review logs to ensure it was not triggered by legitimate administrative actions.

  - **Determine legitimate FTP use cases:** Cross-reference the use of `ftp.exe` with documented business processes. Legitimate use might include file transfers for system updates, typically executed by specific accounts in controlled environments.

  - **Investigate file transfer activity:** Check FTP logs for transferred files and analyze timestamp patterns and file names. Look for unusual file sizes or types in the context of the environment.

  ### Prioritization

  This alert carries medium severity due to the potential for abuse in data exfiltration or remote command execution. Systems affected by this behavior, especially if critical, increase the urgency for follow-up. While FTP is a legitimate protocol, its misuse for command execution is commonly weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection capabilities are limited by the potential for `ftp.exe` to be disguised or replaced by legitimate applications, as well as obfuscation of command line parameters. Reliable detection requires proper logging configurations for process creation and access to FTP logs. Legitimate activities that may trigger this alert include system administrators performing FTP transfers. A related detection to enhance coverage would be monitoring for unusual outbound network connections following the execution of `ftp.exe` or other suspicious applications.

