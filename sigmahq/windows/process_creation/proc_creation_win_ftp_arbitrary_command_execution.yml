title: Potential Arbitrary Command Execution Via FTP.EXE
id: 06b401f4-107c-4ff9-947f-9ec1e7649f1e
status: test
description: Detects execution of "ftp.exe" script with the "-s" or "/s" flag 
  and any child processes ran by "ftp.exe".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Ftp/
author: Victor Sergeev, oscd.community
date: 2020-10-09
modified: 2024-04-23
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\ftp.exe'
  selection_child_img:
  - Image|endswith: '\ftp.exe'
  - OriginalFileName: 'ftp.exe'
  selection_child_cli:
    CommandLine|contains|windash: '-s:'
  condition: selection_parent or all of selection_child_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of `ftp.exe` with the `-s` or `/s` flag, which is used to run scripts for automated FTP commands. Attackers may leverage this functionality to execute arbitrary commands, potentially facilitating data exfiltration or lateral movement. The relevant MITRE ATT&CK techniques include **Execution (T1202)**, highlighting the risk of arbitrary code execution, and **Command-Line Interface (T1059)**, as this involves executing commands through the command line interface.

  The primary telemetry sources for this detection are Windows Process Creation logs, specifically **Security Event ID 4688** and **Sysmon Event ID 1**, which capture process creation events and their command-line arguments. If leveraged maliciously, this behavior can enable data theft or system compromise. However, this detection does not confirm that malicious activity has occurred on its own; further investigation is required to establish intent.

  ### Investigation Steps

  - **Review process creation logs:** Check for **Event ID 4688** (Windows Security) and **Sysmon Event ID 1** to confirm the execution of `ftp.exe` with `-s` or `/s`. Analyze the full command line for additional context.

  - **Correlate child processes:** Identify any child processes spawned by `ftp.exe` since they may indicate further malicious intent. Look for related commands in the command line details under **Process ID** associated with the parent `ftp.exe`.

  - **Inspect command line arguments:** Determine the exact command line passed to `ftp.exe`. Malicious usage may include suspicious scripts aimed at unauthorized data transfer, as opposed to legitimate scripts for file upload/download.

  - **Identify asset criticality:** Evaluate whether the system where `ftp.exe` was executed is a critical asset (e.g., a server with sensitive data). Increased scrutiny may be required if the execution occurred on such platforms.

  - **Assess legitimate use cases:** Compare the command line against known benign scripts used within the organization. If a user typically runs FTP scripts to manage file transfers, this may not be indicative of malicious activity.

  - **Check for unauthorized file transfers:** Monitor for outbound network traffic logs during the timeframe of the alert, particularly focusing on FTP-related ports (e.g., 20, 21) and file transfer patterns that diverge from normal operations.

  ### Prioritization

  This alert has medium severity due to the potential for sensitive data exposure through FTP, especially if executed on critical infrastructure. Given that FTP can be used in various legitimate contexts, the likelihood of malicious abuse hinges on the context of execution and the credibility of associated activities.

  ### Blind Spots and Assumptions

  Detection may fail if `ftp.exe` is configured to run in a manner that avoids traditional logging, such as executing from a non-standard path or using obfuscation techniques within command line arguments. Proper logging configurations for both process creation and network activity are crucial for reliable detection. Legitimate automated scripts for file transfers could trigger this alert, necessitating contextual analysis. A companion detection to strengthen coverage may include monitoring for unusual network activity associated with FTP commands.

