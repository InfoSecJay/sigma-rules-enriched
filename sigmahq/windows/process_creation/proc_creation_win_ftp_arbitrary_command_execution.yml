title: Potential Arbitrary Command Execution Via FTP.EXE
id: 06b401f4-107c-4ff9-947f-9ec1e7649f1e
status: test
description: Detects execution of "ftp.exe" script with the "-s" or "/s" flag and
  any child processes ran by "ftp.exe".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Ftp/
author: Victor Sergeev, oscd.community
date: 2020-10-09
modified: 2024-04-23
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\ftp.exe'
  selection_child_img:
  - Image|endswith: '\ftp.exe'
  - OriginalFileName: 'ftp.exe'
  selection_child_cli:
    CommandLine|contains|windash: '-s:'
  condition: selection_parent or all of selection_child_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying potential arbitrary command execution via the `ftp.exe` utility, specifically when it is invoked with the `-s` or `/s` flags. These flags allow attackers to execute commands stored in a script file, making `ftp.exe` a possible vector for command injection and remote code execution. In a threat scenario, an attacker may exploit this behavior to execute malicious commands on a compromised system, potentially leading to unauthorized data access or further compromise within the network.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002): The direct execution of malicious commands via FTP.
  - **Defense Evasion** (TA0005): Use of legitimate tools (such as `ftp.exe`) to bypass security mechanisms.
  - **Command and Control** (TA0011): Use of FTP to establish communication channels with compromised systems.

  Primary data sources for this detection include process creation events, particularly monitoring for executions of `ftp.exe`, command-line invocation logs, and any child processes that are spawned by it.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs to identify instances of `ftp.exe` being executed, particularly noting the use of the `-s` or `/s` flags. Check the parent process and verify the process hierarchy involving `ftp.exe`.

  - **Examine Child Processes**: Collect and analyze any child processes initiated by `ftp.exe`. Look for any suspicious behavior or unexpected command-line arguments that could indicate malicious activity.

  - **Scrutinize Network Traffic**: Investigate outbound FTP connections to determine if there are any unauthorized file transfers or communications that align with potential command execution. Pay attention to the destination IP addresses and request patterns.

  - **Correlate with Historical Data**: Compare current detections with historical logs to identify possible recurring patterns or behaviors associated with the use of `ftp.exe` in your environment. Look for anomalies that deviate from normal operational usage.

  ### Prioritization
  The alert is assigned medium severity due to the potential impact of arbitrary command execution through a commonly trusted application, combined with the rarity of legitimate usage of the `-s` flag in typical operational scenarios. This behavior raises the likelihood of malicious exploitation, necessitating timely investigation.

  ### Blind Spots and Assumptions
  This detection logic may not cover instances where attackers use other methods to invoke `ftp.exe` indirectly or where command execution is wrapped in legitimate workflows. It assumes that relevant logs for process creation are enabled and adequately monitored. Additionally, the effectiveness of this detection relies on accurately parsing command-line arguments and the correct logging of parent-child process relationships. Any gaps in logging settings or failure to capture process creation data could lead to undetected malicious behavior.

