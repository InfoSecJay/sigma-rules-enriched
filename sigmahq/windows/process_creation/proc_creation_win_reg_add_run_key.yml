title: Potential Persistence Attempt Via Run Keys Using Reg.EXE
id: de587dce-915e-4218-aac4-835ca6af6f70
status: test
description: Detects suspicious command line reg.exe tool adding key to RUN key in
  Registry
references:
- https://app.any.run/tasks/9c0f37bc-867a-4314-b685-e101566766d7/
- https://learn.microsoft.com/en-us/windows/win32/setupapi/run-and-runonce-registry-keys
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2021-06-28
modified: 2025-02-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
    - 'reg'
    - ' add '
    CommandLine|contains:
    - 'Software\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
  condition: selection
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reasons.
- Legitimate administrator sets up autorun keys for legitimate reasons.
- Discord
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_reg_add_run_key/info.yml
note: |
  ### Technical Context
  This detection rule identifies potential persistence mechanisms employed by attackers using the `reg.exe` command line tool to modify the Windows Registry by adding keys to the "RUN" paths. Such behavior is indicative of an attacker attempting to maintain access to a compromised system by ensuring their malicious payload or script runs upon system startup. Successful exploitation can lead to privilege escalation, unauthorized access, and the establishment of a foothold within the target environment.

  Attackers leveraging this technique typically aim to execute malicious code every time the system starts, effectively maintaining persistence even if other malicious software is detected or removed. Specifically, this detection aligns with the MITRE ATT&CK framework under the Persistence tactic (ID: TA0003) and the specific technique of "Registry Run Keys / Startup Folder" (ID: T1547.001).

  The primary data sources for detecting this activity include process creation events that capture the execution context of command-line utilities such as `reg.exe`, along with associated command-line arguments that will reveal attempts to manipulate registry keys related to startup behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for instances where `reg.exe` is executed, especially focusing on command-line parameters that suggest the modification of RUN keys in the Registry.

  - **Analyze Command-Line Arguments**: Look for command-line strings that contain 'reg add' combined with paths related to the RUN keys. Focus particularly on entries that reference `Software\Microsoft\Windows\CurrentVersion\Run` or similar directories.

  - **Check for Legitimate Use Cases**: Assess the context of the detected `reg.exe` commands to differentiate between legitimate administrative actions or installations versus potentially malicious activities. Investigate any associated user accounts.

  - **Correlate with Other Security Events**: Cross-reference these events with other security logs (e.g., account logins, EDR alerts) to identify any preceding suspicious behaviors or anomalies that could indicate an ongoing attack or compromise.

  ### Prioritization
  This alert is categorized as medium severity due to the potential risk of persistence mechanisms being established within the environment. Given that legitimate operations may also create similar entries, a contextual analysis is crucial for distinguishing threats from routine administrative behavior.

  ### Blind Spots and Assumptions
  This detection rule may not capture cases where attackers utilize other scripting languages or tools to manipulate the registry for persistence, resulting in potential blind spots. It assumes that key logging sources, such as process creation logs, are configured to capture relevant command-line parameters and that the environment does not frequently employ benign registry modifications for legitimate applications. Continuous monitoring and effectiveness of these logs are essential for reliable detection.

