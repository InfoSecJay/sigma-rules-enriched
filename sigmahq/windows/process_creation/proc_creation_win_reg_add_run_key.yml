title: Potential Persistence Attempt Via Run Keys Using Reg.EXE
id: de587dce-915e-4218-aac4-835ca6af6f70
status: test
description: Detects suspicious command line reg.exe tool adding key to RUN key 
  in Registry
references:
- https://app.any.run/tasks/9c0f37bc-867a-4314-b685-e101566766d7/
- https://learn.microsoft.com/en-us/windows/win32/setupapi/run-and-runonce-registry-keys
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron 
  Systems)
date: 2021-06-28
modified: 2025-02-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
    - 'reg'
    - ' add '
    CommandLine|contains:
    - 'Software\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
  condition: selection
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reasons.
- Legitimate administrator sets up autorun keys for legitimate reasons.
- Discord
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_reg_add_run_key/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of the `reg.exe` command-line tool to add entries to the Windows Registry's Run keys. Such behavior is typically associated with an attacker attempting to establish persistence; by modifying these keys, an adversary ensures that their malicious application or script runs every time the user logs into the system. The relevant MITRE ATT&CK tactic is **Persistence** and the technique is **Registry run keys / start folder (T1547.001)**.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID **4688** and Sysmon Event ID **1**, which capture command line event details. If successful and malicious, exploitation can lead to unauthorized access and control over the affected system, allowing for further malicious actions. However, this detection alone does not confirm intent, as legitimate applications and administrators may perform similar actions for valid reasons.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID **4688** or Sysmon Event ID **1** to locate the `reg.exe` command execution. Focus on the `CommandLine` field for evidence of parameters that include `add` and references to the `Run` registry keys.

  - **Identify benign modifications:** Determine if the `reg.exe` command execution corresponds to known legitimate installations or updates, which may include identifiers related to software installers or common administrative tasks.

  - **Examine for malicious indicators:** Look for unusual command line patterns or parent processes that lead to `reg.exe`, especially if executed by non-administrative accounts or in unusual contexts (e.g., run by scripts, web browsers, or user applications not typical for administrative tasks).

  - **Verify changed registry keys:** Investigate affected registry paths (`Software\Microsoft\Windows\CurrentVersion\Run`, `\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run`, or `\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run`) using Registry Explorer or PowerShell commands like `Get-ItemProperty`. Confirm unexpected entries that do not align with known software.

  - **Check asset criticality:** Evaluate the role of the affected system. Is it a user workstation, server, or critical infrastructure? Higher criticality assets should prioritize immediate remediation if malicious activity is confirmed.

  - **Monitor for follow-up behaviors:** Track subsequent logins or command executions that leverage modified Run keys to validate the persistence attempts, ensuring other logging mechanisms (like Sysmon and event logs) recognize any subsequent execution of potentially malicious software.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on the system's integrity and the likelihood of misuse for persistent malware deployment. While not every instance of this behavior indicates malicious intent, it is a recognized tactic leveraged by threat actors and thus warrants thorough investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers who utilize obfuscation techniques or employ different command-line tools that accomplish similar persistence strategies without invoking `reg.exe`. Reliable detection requires comprehensive monitoring of all process creation events on endpoints. Legitimate administrative activities, such as system configuration updates, may trigger this alert. Companion detections include monitoring for unusual application behavior post-registration changes, enhancing visibility into potential exploitation following registry modifications.

