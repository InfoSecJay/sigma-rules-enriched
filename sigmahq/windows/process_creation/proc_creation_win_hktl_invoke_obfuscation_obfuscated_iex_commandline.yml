title: Invoke-Obfuscation Obfuscated IEX Invocation
id: 4bf943c6-5146-4273-98dd-e958fd1e3abf
status: test
description: Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the following code block
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: 'Daniel Bohannon (@Mandiant/@FireEye), oscd.community'
date: 2019-11-08
modified: 2022-12-31
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - CommandLine|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - CommandLine|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - CommandLine|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - CommandLine|re: '\*mdr\*\W\s*\)\.Name'
  - CommandLine|re: '\$VerbosePreference\.ToString\('
  - CommandLine|re: '\[String\]\s*\$VerbosePreference'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of obfuscated PowerShell commands generated by the Invoke-Obfuscation framework. These commands are often utilized by attackers to evade detection mechanisms while executing malicious scripts. The primary objective of an attacker using obfuscated PowerShell is to execute payloads that may compromise a system or exfiltrate sensitive information without triggering security alerts. By hiding command execution patterns, attackers increase the likelihood of successful execution of their operations.

  Relevant MITRE ATT&CK tactics include **Execution (TA0002)**, where the obfuscated commands are executed, and **Defense Evasion (TA0005)**, as the obfuscated format is employed specifically to evade detection by security products. The specific techniques associated with this detection rule are **Obfuscated Files or Information (T1027)** and **PowerShell (T1059.001)**, which detail the use of obfuscated code and PowerShell for execution.

  Primary data sources that will provide the necessary evidence for this detection include **process creation logs** from Windows systems that capture command-line arguments. Such logs can help analysts trace potentially malicious execution paths and understand the context of the obfuscation being utilized.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the Windows process creation logs to identify specific instances of PowerShell invocation, paying close attention to command-line arguments that match the regex patterns outlined in the detection rule.
  - **Identify Anomalous Scripts:** Search for any scripts executed within a short timeframe or scripts that are not part of standard operations within your environment, particularly those invoking PowerShell with obfuscated commands.
  - **Correlate with Other Alerts:** Check for related security alerts or behaviors, such as unusual network activity, to provide context and support for the identification of malicious actions.
  - **Validate Source and Context:** Determine the source of the PowerShell command execution. Validate whether the user or process executing it has legitimate reasons to run such obfuscated scripts, considering both internal and external factors that could influence activity.

  ### Prioritization
  Given that obfuscated PowerShell execution can be indicative of sophisticated malicious activity aimed at evading detection, this alert should be assigned a high severity level. The potential impact on the organization—ranging from data breaches to complete system compromise—alongside the likelihood of such attacks in enterprise environments justifies prompt investigation.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where script obfuscation techniques are not specific to the Invoke-Obfuscation framework or when commands are not logged due to system misconfigurations. The detection logic assumes that Windows PowerShell process execution will generate detailed command-line logs. Without the proper logging configuration in place, such as enabling command-line logging via Group Policy, the required events may not be available.

