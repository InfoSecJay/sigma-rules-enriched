title: Invoke-Obfuscation Obfuscated IEX Invocation
id: 4bf943c6-5146-4273-98dd-e958fd1e3abf
status: test
description: Detects all variations of obfuscated powershell IEX invocation code
  generated by Invoke-Obfuscation framework from the following code block
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: 'Daniel Bohannon (@Mandiant/@FireEye), oscd.community'
date: 2019-11-08
modified: 2022-12-31
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - CommandLine|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - CommandLine|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - CommandLine|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
  - CommandLine|re: '\*mdr\*\W\s*\)\.Name'
  - CommandLine|re: '\$VerbosePreference\.ToString\('
  - CommandLine|re: '\[String\]\s*\$VerbosePreference'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell commands specifically generated by the Invoke-Obfuscation framework, often utilized by attackers to conceal malicious code execution. The objective typically involves executing harmful scripts while evading security mechanisms, thereby facilitating activities like data exfiltration or lateral movement. This behavior aligns with MITRE ATT&CK technique T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell).

  The primary telemetry source for this detection is Windows process creation logs, particularly those from Sysmon (Event ID 1) and Security Event ID 4688. If malicious, these activities could lead to unauthorized data access or system compromise. Importantly, this detection does NOT confirm that the command executed successfully or that it had malicious intent without further corroborative evidence.

  ### Investigation Steps

  - **Review PowerShell command details:** Examine the CommandLine field of Event ID 4688 logs for obfuscated strings matching patterns defined in the rule. If found, note the specific obfuscation used for further analysis.

  - **Validate the process owner:** Identify the process owner in Event ID 4688 logs. PowerShell executed by system accounts or local service accounts may indicate suspicious activity, as typical PowerShell use originates from user-initiated sessions.

  - **Correlate with Sysmon logs:** In Sysmon Event ID 1, cross-reference the process creation events with process integrity level and parent processes. An anomaly in process lineage, where PowerShell spawns from an unusual parent (e.g., not an interactive user session), may indicate malicious behavior.

  - **Identify timestamps and frequency:** Investigate the timestamps of the detected PowerShell invocations within Windows Security logs for frequency. A high frequency of such command calls in a short period can indicate automated or scripted attacks.

  - **Investigate legitimate use cases:** Determine whether the detected commands were part of authorized administrative tasks. Common benign activities may include scheduled scripts executed by known applications, noted by tracing their parent process.

  - **Check for known malicious hashes:** Utilize antivirus or EDR solutions to check against known signatures or hashes associated with recently created PowerShell scripts. A match could indicate a high-confidence malicious file was involved.

  ### Prioritization

  The severity of this alert is high given the potential impact on sensitive systems and data integrity. The likelihood of malicious abuse is elevated, particularly as obfuscation techniques are common in sophisticated attacks. Since obfuscated PowerShell commands can be weaponized, prompt investigation is essential to determine intent.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques that do not match the specified regular expressions. Additionally, collections that do not include comprehensive process creation logs may miss legitimate or malicious activities. Legitimate administrative actions, such as system maintenance scripts or third-party management solutions, might also trigger this alert. Implementing detection for lateral movement techniques (like T1071.001 - Application Layer Protocol: Web Protocols) can enhance coverage and provide context in the event of obfuscation alerts.

