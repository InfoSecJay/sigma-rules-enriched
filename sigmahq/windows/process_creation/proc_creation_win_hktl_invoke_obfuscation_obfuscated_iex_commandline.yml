logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
  - CommandLine|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
  - CommandLine|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
  - CommandLine|re: '\$env:ComSpec\[(?:\s*\d{1,3}\s*,){2}'
  - CommandLine|re: '\*mdr\*\W\s*\)\.Name'
  - CommandLine|re: '\$VerbosePreference\.ToString\('
  - CommandLine|re: '\[String\]\s*\$VerbosePreference'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands generated by the Invoke-Obfuscation framework, which are often used by attackers to hide malicious payloads from detection tools. The likely objectives of the attacker include executing additional payloads or establishing a foothold within the environment while evading security measures. This behavior is associated primarily with the MITRE ATT&CK techniques for "Obfuscated Files or Information" (T1027) and "Command and Scripting Interpreter" (T1059.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring command line arguments associated with PowerShell processes. If exploited maliciously, this behavior can lead to unauthorized code execution, data exfiltration, or lateral movement within the network. However, this detection does NOT alone confirm that an actor has successfully compromised a system; further investigation is required to validate the intent behind the command execution.

  ### Investigation Steps

  - **Inspect the command line arguments:** Review Security Event ID 4688 or Sysmon Event ID 1 for PowerShell processes that include obfuscated strings, such as those containing `$PSHome[]`, `$ShellId[]`, or `$env:Public[]`.

  - **Identify high-confidence malicious indicators:** Look for frequent or repeated execution of PowerShell commands with obfuscation patterns that match the detection criteria. Particularly, focus on character patterns that indicate obfuscation, such as `$env:ComSpec[,]`.

  - **Validate benign PowerShell usage:** Check for scheduled task executions or application deployment processes that may utilize standard PowerShell scripts. For instance, typical admin scripts may use clean, non-obfuscated command syntax without complex environment variable manipulation.

  - **Evaluate user context:** Assess the user context executing the obfuscated PowerShell commands. If the action is being performed by a high-privilege account or an unexpected user, it could indicate malicious intent.

  - **Analyze network activity:** Review network logs and packet captures for any outbound connections initiated during or right after the obfuscated command execution (e.g., DNS queries or HTTP requests) which could indicate payload delivery or command and control traffic.

  - **Check for compliance with security baselines:** Ensure that endpoint protections are in place and that logging for PowerShell activity is enabled and configured properly, as this will assist in retaining necessary visibility for effective detection.

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on system integrity and the likelihood of malicious intent. The use of obfuscated command structures is a common tactic employed in advanced attacks, implicating a need for immediate investigation to prevent potential escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the effectiveness of logging configurations, particularly if PowerShell command-line history is disabled or insufficiently retained. Legitimate administrative activities such as legitimate script obfuscation for security or compliance purposes could trigger this alert. Continuous monitoring for command-line executions should be complemented by alerts on known malicious indicators, such as file creations resulting from the execution of PowerShell commands or logs indicating the use of common antivirus evasion techniques.

