note: |
  ### Technical Context

  This rule detects the execution of Sysinternals PsService, a tool that can be exploited for service reconnaissance and tampering on Windows systems. Adversaries may leverage PsService to enumerate running services, change service configurations, or create, stop, or delete services, all of which can facilitate further malicious activity or persistence. The relevant MITRE ATT&CK tactics include Discovery (T1087) and Privilege Escalation (T1543.003).

  Primary telemetry sources for this detection include process creation logs such as Windows Security Event ID 4688 and Sysmon Event ID 1, which provide information on process executions and their command-line arguments. If this behavior is malicious, it poses a significant risk to system integrity and availability, as it may allow unauthorized changes to critical services. However, the detection of PsService execution does NOT alone confirm malicious intent, as legitimate administrative use is common.

  ### Investigation Steps

  - **Review process execution details:** Examine Security Event ID 4688 for instances of ‘PsService.exe’ or related images in the command line. Look for execution from unusual paths or accounts that typically wouldn't use system management tools.

  - **Verify command-line arguments:** Check Sysmon Event ID 1 for command-line arguments associated with PsService executions. Look for suspicious flags like “create”, “stop”, or “delete” that could indicate malicious service manipulation.

  - **Identify account context:** Assess the user or service account from which PsService was executed. Administrative accounts performing service operations are typically expected. Non-administrative accounts executing PsService warrant further scrutiny.

  - **Cross-reference with service logs:** Review Windows Service Control Event logs (Event ID 7045) post-execution to identify what actions were taken by PsService, such as service creation or deletion, and check for unexpected behaviors.

  - **Look for known malicious indicators:** Search for previous incidents related to PsService abuse or other alerts that indicate lateral movement or privilege escalation activities that align with this execution.

  - **Check for legitimate usage patterns:** Determine if the execution corresponds to scheduled maintenance or administrative tasks. If PsService is executed during regular change windows for service management, this may indicate normal operations.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems and the likelihood of misuse by adversaries. While PsService can be used for legitimate administrative purposes, its common association with service manipulation tactics increases concern for vigilant monitoring.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as renaming the PsService executable or using alternative service management tools not covered by this rule. Reliable detection requires configuration of process creation event logging via Sysmon or Windows Security logs. Additionally, legitimate administrative activities, such as system maintenance or troubleshooting, may trigger this alert. Related detections to consider include process injection or unusual network activity related to services being manipulated.

