note: |
  ### Technical Context

  This Sigma rule detects the execution of Sysinternals PsService, a utility that can be used for service reconnaissance and manipulation on Windows systems. Malicious actors may utilize this tool to enumerate services or to execute unauthorized service modifications, facilitating lateral movement or privilege escalation within the environment. The relevant MITRE ATT&CK technique is Privilege Escalation (T1543.003) and Discovery (T1087).

  The primary telemetry source for this rule is Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If used maliciously, PsService execution allows attackers to modify service configurations, potentially leading to service disruption or persistence mechanisms. This detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also generate similar alerts.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for any instances of `psservice.exe` or `psservice64.exe`. Look for unusual parent processes that deviate from standard administrative workflows.

  - **Validate User Context:** Determine the user account that executed the PsService command. Legitimate administrative users (e.g., Domain Admins) may trigger this, but unexpected accounts, especially those with limited privileges, raise suspicion.

  - **Cross-Reference with Service Modifications:** Investigate any subsequent service state changes logged (e.g., using PowerShell's Get-Service or Service Control Manager logs) around the time of PsService execution to identify if any critical services were stopped, started, or altered.

  - **Check for Command-Line Arguments:** Extract and analyze command-line arguments associated with the PsService invocation in Sysmon logs. Malicious use may involve suspicious service manipulation commands that differ from standard administrative usage patterns.

  - **Identify Service Account Misuse:** Investigate the services being queried or modified. If PsService is used to manipulate known critical or sensitive services, it suggests malicious intent, especially if atypical changes occur.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on system services and the likelihood of abuse in privilege escalation or reconnaissance scenarios. While the tool is legitimate, the context of its use must be carefully assessed to determine whether it serves a legitimate purpose or is indicative of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by administrative users legitimately using PsService for system management, leading to false positives. Ensure proper logging configurations are in place to capture all process creation events thoroughly. External remote administration tools or administrative scripts may trigger the same alert; hence, continuous monitoring and companion detections such as PowerShell command execution analysis can enhance overall visibility in service-related threats.

