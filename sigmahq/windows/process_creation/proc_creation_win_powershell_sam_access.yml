title: PowerShell SAM Copy
id: 1af57a4b-460a-4738-9034-db68b880c665
status: test
description: Detects suspicious PowerShell scripts accessing SAM hives
references:
- https://twitter.com/splinter_code/status/1420546784250769408
author: Florian Roth (Nextron Systems)
date: 2021-07-29
modified: 2023-01-06
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains|all:
    - '\HarddiskVolumeShadowCopy'
    - 'System32\config\sam'
  selection_2:
    CommandLine|contains:
    - 'Copy-Item'
    - 'cp $_.'
    - 'cpi $_.'
    - 'copy $_.'
    - '.File]::Copy('
  condition: all of selection*
falsepositives:
- Some rare backup scenarios
- PowerShell scripts fixing HiveNightmare / SeriousSAM ACLs
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell scripts that attempt to access and copy the Security Account Manager (SAM) hive from a Windows system. The SAM hive contains sensitive account information, including user passwords and security identifiers (SIDs), making it a prime target for attackers aiming to escalate privileges or conduct lateral movement within an enterprise. By executing these PowerShell commands, a malicious actor may be attempting to extract credentials or gain unauthorized access to user accounts, which can lead to significant security breaches.

  The relevant MITRE ATT&CK tactics associated with this detection are:
  - **Credential Access (T1003)**, which encompasses techniques used by adversaries to steal account credentials;
  - **Credential Dumping (T1003.002)** specifically focuses on the extraction of credentials from operating system hives such as the SAM database.

  The primary data source for this rule is **process creation events** on Windows systems, where command line arguments are monitored to catch the suspicious behavior related to SAM hive access and copying.

  ### Investigation Steps
  - **Review CommandLine Arguments**: Collect and analyze recent process creation logs focusing on PowerShell commands that include references to the SAM hive or DiskVolumeShadowCopy. Look for unusual patterns or known malicious indicators.
  - **Validate PowerShell Execution Context**: Check the context in which PowerShell was executed, including the user account, permissions, and the parent process. This can help determine if the activity was performed by a legitimate administrator or indicates unauthorized access.
  - **Correlate with Other Security Logs**: Examine other telemetry, such as Windows Event Logs (particularly Security and Application logs), to identify any correlated events that could indicate compromised accounts or abnormal authentication attempts following the execution of the suspicious commands.
  - **Analyze for False Positives**: Be aware of known scenarios that may generate false positives, such as backup operations or scripts intended to fix configurations related to HiveNightmare / SeriousSAM. Validate the necessity of the performed actions in the context of regular operations.

  ### Prioritization
  This alert is categorized as high severity due to the sensitive nature of the data being targeted—the SAM hive—and the significant risk it poses if an attacker gains access to credentials stored within. Given the critical role credentials play in maintaining enterprise security, any detection indicating potential unauthorized access should be treated with utmost urgency.

  ### Blind Spots and Assumptions
  This detection rule may not cover all scenarios in which SAM hive access occurs, particularly if the commands are obfuscated or if legitimate applications are used to access the hive without PowerShell. The rule also assumes that detailed process creation logs are enabled and retained in the environment; lack of logging, especially at the command line level, could limit detection capability. Additionally, the identification of false positives relies on context and understanding of organizational activity patterns related to PowerShell usage.

