title: PowerShell SAM Copy
id: 1af57a4b-460a-4738-9034-db68b880c665
status: test
description: Detects suspicious PowerShell scripts accessing SAM hives
references:
- https://twitter.com/splinter_code/status/1420546784250769408
author: Florian Roth (Nextron Systems)
date: 2021-07-29
modified: 2023-01-06
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains|all:
    - '\HarddiskVolumeShadowCopy'
    - 'System32\config\sam'
  selection_2:
    CommandLine|contains:
    - 'Copy-Item'
    - 'cp $_.'
    - 'cpi $_.'
    - 'copy $_.'
    - '.File]::Copy('
  condition: all of selection*
falsepositives:
- Some rare backup scenarios
- PowerShell scripts fixing HiveNightmare / SeriousSAM ACLs
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_sam_access/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that attempt to access the Security Accounts Manager (SAM) hive, which is critical for storing user account information and credentials. Attackers may execute this behavior to extract sensitive account data, enabling unauthorized access to accounts and services in the compromised environment. This activity maps to the MITRE ATT&CK tactic "Credential Access" and the technique "Credentials from Password Stores" (T1003.002).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing command-line activities. If successfully executed by an adversary, this could lead to credential theft and further lateral movement. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate scenarios such as backup or system maintenance might also trigger the rule.

  ### Investigation Steps

  - **Review the command-line arguments:** Inspect Security Event ID 4688 for any PowerShell commands containing `Copy-Item` or paths related to `System32\config\sam`. Malicious indicators include attempts to access the SAM hive without legitimate context.

  - **Identify legitimate activity:** Verify whether the behavior aligns with known backup scripts or maintenance routines. Documented procedures using the SAM hive for legitimate purposes should be noted, and any discrepancies with approved processes should be flagged.

  - **Cross-reference process parentage:** Look for the parent process of the PowerShell execution in Sysmon logs (Event ID 1) to determine if it was spawned by a legitimate process (like a scheduled task or administrative tool) or a suspicious entry point.

  - **Check for file activity:** Examine file creations associated with the alert. Look for any unexpected creation of files in directories like `C:\Windows\Temp` or similar that could indicate data export (e.g., suspicious `.txt` or `.csv` files).

  - **Investigate user privileges:** Assess whether the user account executing the command has elevated permissions. Unprivileged users executing commands accessing the SAM hive can be a strong sign of compromise.

  ### Prioritization

  This alert should be considered high severity due to the critical nature of the SAM hive, which, if accessed maliciously, can lead to significant breaches of credential security. The likelihood of adversaries attempting to read or copy the SAM data makes this behavior a commonly weaponized tactic, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environment configurations that do not log all PowerShell activities or if logging isn’t enabled for crucial events (like specific process creations). Legitimate activities such as specific system maintenance or administrative tasks may trigger this alert. A related detection to consider could be monitoring for execution of anomalous PowerShell scripts (e.g., those running from unusual directories) to strengthen overall security posture.

