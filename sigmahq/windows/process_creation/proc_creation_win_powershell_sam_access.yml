title: PowerShell SAM Copy
id: 1af57a4b-460a-4738-9034-db68b880c665
status: test
description: Detects suspicious PowerShell scripts accessing SAM hives
references:
- https://twitter.com/splinter_code/status/1420546784250769408
author: Florian Roth (Nextron Systems)
date: 2021-07-29
modified: 2023-01-06
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains|all:
    - '\HarddiskVolumeShadowCopy'
    - 'System32\config\sam'
  selection_2:
    CommandLine|contains:
    - 'Copy-Item'
    - 'cp $_.'
    - 'cpi $_.'
    - 'copy $_.'
    - '.File]::Copy('
  condition: all of selection*
falsepositives:
- Some rare backup scenarios
- PowerShell scripts fixing HiveNightmare / SeriousSAM ACLs
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of PowerShell scripts that attempt to access the Security Account Manager (SAM) database on Windows systems by copying the SAM hives, which is typically indicative of credential dumping activities. The likely objective of an attacker employing this behavior is to extract sensitive account information such as user credentials, which can then be leveraged for lateral movement or privilege escalation. This activity aligns with the MITRE ATT&CK technique for credential access, specifically T1003.002 (OS Credential Dumping: Security Account Manager).

  The primary telemetry source for this detection is the Windows process creation logs, recorded under Security Event ID 4688. Analyzing the CommandLine field will be critical for investigations. If malicious, the impact can be severe, potentially leading to unauthorized access to sensitive accounts and escalation of privileges in the environment. Importantly, this detection does NOT confirm that an attack has occurred solely based on the command line content—it requires further investigation into execution context and outcomes.

  ---

  ### Investigation Steps

  - **Review PowerShell command line arguments**: Check Security Event ID 4688 for process creation events where CommandLine contains both `\HarddiskVolumeShadowCopy` and `System32\config\sam`. Look for suspicious invocations that do not align with legitimate usage patterns.

  - **Analyze the parent process**: Determine the parent process using the Process ID (PID) from Event ID 4688. Malicious activity often originates from unusual parent processes like cmd.exe or unexpected PowerShell instances rather than standard operational tasks.

  - **Identify legitimate operations**: Cross-reference the detected commands against common administrative activities or backup tasks. Legitimate commands may explore SAM hives for troubleshooting or legitimate fixes. Ensure that these occur within the expected operational context.

  - **Validate file creation activity**: Use Sysmon Event ID 10 to check for file creation in the directory C:\Windows\System32\config\ to confirm whether SAM files were copied. Pay attention to timestamps and execution context to spot anomalies.

  - **Check for access permissions**: Review access control lists (ACLs) and auditing logs on the SAM files. You can utilize Event IDs 4663 and 5145 to monitor for unauthorized access attempts to the SAM hives. Malicious behavior is often characterized by unauthorized or unusual access patterns.

  - **Monitor for exfiltration behavior**: After identifying malicious PowerShell execution, assess whether there were any attempts to exfiltrate the copied SAM files through network connections or removal media. Look at outbound connection logs in your firewall or network monitoring tools.

  ---

  ### Prioritization

  This alert carries a high severity due to the sensitive nature of the SAM database and the potential risk of unauthorized credential access. The likelihood of malicious abuse is pronounced, particularly if found in high-privileged environments. Credential dumping via PowerShell scripts is a known tactic by threat actors and is often weaponized in the wild.

  ---

  ### Blind Spots and Assumptions

  Detection may be obscured by legitimate backup processes or administrative scripts that also engage with SAM hives. Ensure complete logging of PowerShell activity and maintain strict audit logging for Event IDs related to file access to improve detection reliability. Legitimate administrative access and troubleshooting can trigger this alert, which necessitates thorough context correlation. Companion detections that monitor for unusual PowerShell module loading or script execution (e.g., PowerShell Exit codes, Event ID 4104) can bolster coverage and provide additional context.

