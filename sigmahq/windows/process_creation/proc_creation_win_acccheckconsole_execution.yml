title: Potential DLL Injection Via AccCheckConsole
id: 0f6da907-5854-4be6-859a-e9958747b0aa
status: test
description: |
  Detects the execution "AccCheckConsole" a command-line tool for verifying the accessibility implementation of an application's UI.
  One of the tests that this checker can run are called "verification routine", which tests for things like Consistency, Navigation, etc.
  The tool allows a user to provide a DLL that can contain a custom "verification routine". An attacker can build such DLLs and pass it via the CLI, which would then be loaded in the context of the "AccCheckConsole" utility.
references:
- https://gist.github.com/bohops/2444129419c8acf837aedda5f0e7f340
- https://twitter.com/bohops/status/1477717351017680899?s=12
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/AccCheckConsole/
author: Florian Roth (Nextron Systems)
date: 2022-01-06
modified: 2024-08-29
tags:
- attack.execution
- detection.threat-hunting
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AccCheckConsole.exe'
  - OriginalFileName: 'AccCheckConsole.exe'
  selection_cli:
    CommandLine|contains:
    - ' -hwnd'
    - ' -process '
    - ' -window '
  condition: all of selection_*
falsepositives:
- Legitimate use of the UI Accessibility Checker
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of the "AccCheckConsole" tool with specific command-line argument patterns indicative of potential DLL injection attempts. Attackers may use this utility to load malicious DLLs under the guise of verifying UI accessibility, ultimately aiming to execute code within the context of the target application. This behavior aligns with the MITRE ATT&CK technique for Execution via command-line interface (T1059).

  Primary telemetry sources include Windows process creation logs, particularly Windows Security Event ID 4688, which captures the creation of new processes along with their command-line arguments. If malicious, this behavior could lead to unauthorized code execution with the privileges of the application's user context. Importantly, detection of this specific execution does NOT confirm that an attack is occurring; legitimate use of this utility may trigger the alert.

  ---

  ### Investigation Steps

  - **Review command-line arguments:** Analyze Security Event ID 4688 for process creation events involving "AccCheckConsole.exe." Look for command-line parameters such as `-hwnd`, `-process`, or `-window`, which indicate potential misuse. Legitimate use will typically not include suspicious DLLs as parameters.

  - **Check for malicious DLL indicators:** Investigate any associated DLL files being loaded with "AccCheckConsole." Examine for entries in Sysmon Event ID 7 (Image Loading) that reference unusual or non-standard DLLs. Any DLL not commonly used for UI testing should be flagged as potentially malicious.

  - **Correlate with application behavior:** Analyze the application behavior post-execution of "AccCheckConsole." Any unexpected UI modifications, unauthorized access requests, or application crashes could indicate exploitation attempts.

  - **Verify user profiles:** Cross-check the executing user account against your organization’s user inventory. If the user does not have a valid business need for UI Accessibility testing, consider this an indicator of potential malicious activity.

  - **Identify system criticality:** Determine the role and sensitivity of the affected system. If it is part of a critical business operation, prioritize this alert for immediate review due to heightened risk.

  ---

  ### Prioritization

  This alert should be categorized as medium severity due to the potential impact of such behavior on critical applications. There is a moderate likelihood of this technique being weaponized, as it allows adversaries to execute arbitrary code indirectly. However, such usage is not common and warrants further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection could be limited by the absence of comprehensive logging across all systems, particularly those with low log retention periods. Legitimate testing activities using "AccCheckConsole" could also trigger false positives, necessitating contextual analysis to distinguish between legitimate and malicious actions. A companion detection to consider is the monitoring of unusual DLL load patterns across systems, which could further highlight suspicious activity related to this technique.

