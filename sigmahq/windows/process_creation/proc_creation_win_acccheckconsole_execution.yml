title: Potential DLL Injection Via AccCheckConsole
id: 0f6da907-5854-4be6-859a-e9958747b0aa
status: test
description: |
  Detects the execution "AccCheckConsole" a command-line tool for verifying the accessibility implementation of an application's UI.
  One of the tests that this checker can run are called "verification routine", which tests for things like Consistency, Navigation, etc.
  The tool allows a user to provide a DLL that can contain a custom "verification routine". An attacker can build such DLLs and pass it via the CLI, which would then be loaded in the context of the "AccCheckConsole" utility.
references:
- https://gist.github.com/bohops/2444129419c8acf837aedda5f0e7f340
- https://twitter.com/bohops/status/1477717351017680899?s=12
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/AccCheckConsole/
author: Florian Roth (Nextron Systems)
date: 2022-01-06
modified: 2024-08-29
tags:
- attack.execution
- detection.threat-hunting
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AccCheckConsole.exe'
  - OriginalFileName: 'AccCheckConsole.exe'
  selection_cli:
    CommandLine|contains:
    - ' -hwnd'
    - ' -process '
    - ' -window '
  condition: all of selection_*
falsepositives:
- Legitimate use of the UI Accessibility Checker
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "AccCheckConsole" utility with parameters indicative of potential DLL injection attacks. Attackers may use AccCheckConsole to load malicious DLLs under the guise of testing accessibility implementations, potentially to execute code or escalate privileges. This behavior aligns with the MITRE ATT&CK technique T1203 - Exploitation for Client Execution, as it leverages a legitimate application to achieve malicious objectives. The primary telemetry sources include Windows process creation logs, specifically looking for Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, it can lead to unauthorized access or remote code execution on the affected system. Importantly, this detection alone does not confirm intent; benign use of the tool for valid accessibility assessments can also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for any instances of "AccCheckConsole.exe" being executed. Verify the `CommandLine` field for flags such as `-hwnd`, `-process`, or `-window`, which indicate potential misuse.

  - **Identify benign usage patterns:** Cross-reference the execution timestamps of AccCheckConsole with scheduled tasks or documented accessibility assessments within the organization. Legitimate usage typically does not involve the aforementioned command-line flags.

  - **Correlate with user context:** Identify the account that executed the command and determine its level of privilege. Use Account Logon Events (Security Event ID 4624) to establish whether the account has baseline permissions consistent with user job functions.

  - **Analyze command-line parameters:** Look for unusual arguments passed to AccCheckConsole in the CommandLine field that may signal malicious activity. Anomalies in the provided DLL or commands should be flagged.

  - **Check for event chaining:** Review related events indexed around the same timeframe that may suggest lateral movement or privilege escalation, such as subsequent process creations or unusual network activity following the AccCheckConsole execution.

  - **Validate DLL artifacts:** If a custom DLL was specified, investigate the creation time and source of the DLL file. Check the file path and digital signatures to ascertain the file's legitimacy, looking for known malicious signatures.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on user endpoints and the commonality of exploited applications as delivery mechanisms for malicious code. The likelihood of abuse is moderate, especially in environments where basic user permissions allow for execution of such utilities.

  ### Blind Spots and Assumptions

  Detection can be evaded if an attacker disguises the utility's execution under legitimate names or modifies the command-line arguments minimally. Reliable detection requires that process creation logs are consistently collected at both high and low elevation scenarios. Legitimate accessibility assessments may inadvertently trigger this alert. It would be beneficial to include companion detections for anomalous DLL creations or unexpected network connections made shortly after AccCheckConsole execution to strengthen overall detection capabilities.

