title: Potential CommandLine Path Traversal Via Cmd.EXE
id: 087790e3-3287-436c-bccf-cbd0184a7db1
status: test
description: Detects potential path traversal attempt via cmd.exe. Could 
  indicate possible command/argument confusion/hijacking
references:
- https://hackingiscool.pl/cmdhijack-command-argument-confusion-with-path-traversal-in-cmd-exe/
- https://twitter.com/Oddvarmoe/status/1270633613449723905
author: xknow @xknow_infosec, Tim Shelton
date: 2020-06-11
modified: 2023-03-06
tags:
- attack.execution
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - ParentImage|endswith: '\cmd.exe'
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'cmd.exe'
  selection_flags:
  - ParentCommandLine|contains:
    - '/c'
    - '/k'
    - '/r'
  - CommandLine|contains:
    - '/c'
    - '/k'
    - '/r'
  selection_path_traversal:
  - ParentCommandLine: '/../../'
  - CommandLine|contains: '/../../'
  filter_java:
    CommandLine|contains: '\Tasktop\keycloak\bin\/../../jre\bin\java'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Java tools are known to produce false-positive when loading libraries
level: high
note: |
  ### Technical Context

  This rule detects potential path traversal attempts via `cmd.exe` execution, often indicating command argument confusion or hijacking tactics by an adversary. The likely attacker objective is to manipulate the command line arguments to execute unauthorized commands or scripts, potentially to escalate privileges, pivot, or exfiltrate data. This behavior aligns with the MITRE ATT&CK framework under the Execution tactic, specifically technique T1059.003, which pertains to command and scripting interpreter usage.

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, the security impact could lead to unauthorized access or execution of harmful scripts, thereby compromising system integrity. Importantly, this detection does not confirm malicious activity on its own; legitimate tool usage or misconfigured applications may also trigger this alert.

  ### Investigation Steps

  - **Review Command Line Arguments**: Examine the process creation logs for Event ID 4688 and Sysmon Event ID 1, focusing on the `CommandLine` and `ParentCommandLine` fields. Look for instances containing both `/c` or `/k` and `/../../`. Legitimate commands should not contain such unusual traversal patterns.

  - **Identify Malicious Execution Indicators**: Check for indications of command line usage that includes unauthorized directories or unexpected command patterns. A recognized malicious indicator would be paths leading to system-critical directories without legitimate context.

  - **Correlate with Parent Process**: Verify the `ParentImage` field to ensure that it is indeed `cmd.exe`. Non-standard invocation of `cmd.exe`, especially from unexpected parent processes, can indicate a malicious activity.

  - **Analyze Context of the Alert**: Understand the role of the host. If the alert came from a critical system (e.g., a domain controller), prioritize it higher. Review user activity during the time of the alert to assess whether the behavior aligns with normal operational activity.

  - **Validate Environment-Specific Legitimate Use**: Investigate if Java tools are being executed within the context of known libraries or applications. Cross-reference with documentation or vendor guidelines, as they can produce false positives when incorrectly loading libraries aggressively.

  ### Prioritization

  This alert should be treated as high severity given the potential impact on critical systems and the likelihood of exploitation. Path traversal attacks are commonly weaponized in advanced adversary scenarios, indicating a risk of significant harm if malicious intent is confirmed.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for false positives due to legitimate software configurations, particularly Java tools. Effective coverage requires comprehensive process creation logging, including both Sysmon and Windows Security logs. Legitimate admin scripts or user commands may accidentally trigger this alert, especially during system maintenance. A companion detection to consider is network activity monitoring for unusual outbound connections following such command executions, which could further indicate malicious actions.

