title: Potential CommandLine Path Traversal Via Cmd.EXE
id: 087790e3-3287-436c-bccf-cbd0184a7db1
status: test
description: Detects potential path traversal attempt via cmd.exe. Could indicate
  possible command/argument confusion/hijacking
references:
- https://hackingiscool.pl/cmdhijack-command-argument-confusion-with-path-traversal-in-cmd-exe/
- https://twitter.com/Oddvarmoe/status/1270633613449723905
author: xknow @xknow_infosec, Tim Shelton
date: 2020-06-11
modified: 2023-03-06
tags:
- attack.execution
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - ParentImage|endswith: '\cmd.exe'
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'cmd.exe'
  selection_flags:
  - ParentCommandLine|contains:
    - '/c'
    - '/k'
    - '/r'
  - CommandLine|contains:
    - '/c'
    - '/k'
    - '/r'
  selection_path_traversal:
  - ParentCommandLine: '/../../'
  - CommandLine|contains: '/../../'
  filter_java:
    CommandLine|contains: '\Tasktop\keycloak\bin\/../../jre\bin\java'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Java tools are known to produce false-positive when loading libraries
level: high
note: |
  ### Technical Context
  This rule detects potential command-line path traversal attempts via `cmd.exe`, which could indicate command or argument confusion, potentially leading to unauthorized access or code execution. Attackers may exploit these types of vulnerabilities to navigate through directories outside the intended boundaries and execute malicious scripts or commands. The primary objective is likely to gain escalated privileges or execute arbitrary commands on a target system.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution**: The attacker executes malicious commands using the command line (T1059.003).
  - **Path Traversal**: Manipulating the file path to access restricted directories or files.

  Primary data sources for this detection include:
  - Process creation events, which provide logs of executed commands and their arguments.
  - Windows event logs detailing command-line activity associated with `cmd.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances where `cmd.exe` is the parent or child executable, noting the command line used and any suspicious arguments.
  - **Monitor Command Line Arguments**: Look for occurrences of `/c`, `/k`, or `/r` in the command line, especially in conjunction with `/../../`, to identify potential path traversal attempts.
  - **Correlate with File Access Logs**: Investigate any file system access logs that may indicate attempts to access files outside expected directories as specified by the command-line arguments.
  - **Assess System Applications**: Identify known applications (e.g., Java tools) that may trigger false positives and differentiate typical behavior from potential threats.

  ### Prioritization
  Given the high severity of this alert, it indicates a significant risk in an enterprise environment, especially if sensitive or restricted files may be accessed through path traversal, suggesting a likely attempt to exploit the system.

  ### Blind Spots and Assumptions
  This detection may have gaps concerning legitimate processes that utilize `cmd.exe` for benign operations, such as certain Java applications that could create false positives. The logic assumes that any command line containing `/../../` or similar constructs is indicative of malicious behavior; however, this may not always be true. The rule relies on comprehensive logging of process creation events and command line execution, which must be adequately configured for effective detection.

