title: MMC Executing Files with Reversed Extensions Using RTLO Abuse
id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
status: experimental
description: Detects malicious behavior where the MMC utility (`mmc.exe`) 
  executes files with reversed extensions caused by Right-to-Left Override (RLO)
  abuse, disguising them as document formats.
references:
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
- https://en.wikipedia.org/wiki/Right-to-left_override
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.execution
- attack.t1204.002
- attack.defense-evasion
- attack.t1218.014
- attack.t1036.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
  - Image|endswith: '\mmc.exe'
  - OriginalFileName: 'MMC.exe'
  selection_commandline:
    CommandLine|contains:     # While looking at these files the prefix of their name will look something like csm.pdf, but in reality it is msc file
    - 'cod.msc'          # Reversed `.doc`
    - 'fdp.msc'          # Reversed `.pdf`
    - 'ftr.msc'          # Reversed `.rtf`
    - 'lmth.msc'          # Reversed `.html`
    - 'slx.msc'          # Reversed `.xls`
    - 'tdo.msc'          # Reversed `.odt`
    - 'xcod.msc'          # Reversed `.docx`
    - 'xslx.msc'          # Reversed `.xlsx`
    - 'xtpp.msc'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Legitimate administrative actions using MMC to execute misnamed `.msc` files.
- Unconventional but non-malicious usage of RLO or reversed extensions.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the Microsoft Management Console (MMC) to execute files that employ Right-to-Left Override (RLO) to disguise their true file extensions. The likely attacker objective is to obfuscate malicious payloads by presenting them as benign document formats (e.g., `.pdf`, `.docx`), thereby tricking users into executing harmful software. This behavior falls under the MITRE ATT&CK tactics of Execution (T1204.002) and Defense Evasion (T1036.002). The primary telemetry source for this detection is Windows process creation logs, specifically events related to the execution of `mmc.exe`. If this activity is confirmed to be malicious, it may lead to compromise of sensitive information, installation of malware, or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger similar alerts.

  ### Investigation Steps

  - **Check process execution details:** Review Windows Security Event ID 4688 for instances of `mmc.exe` being executed. Confirm that the command line contains reversed extensions like `cod.msc` or `fdp.msc` which are indicative of potential malicious behavior.

  - **Analyze the command line arguments:** For the same Event ID, inspect specific command line arguments for any unusual or unexpected contents. Benign activity typically involves standard management tasks, while malicious commands may include suspicious extensions.

  - **Review user privilege levels:** Examine the user account that executed the command. Elevated privileges (e.g., Administrator or service accounts) executing MMC with reversed extensions warrant further investigation, as they increase the potential risk.

  - **Assess if the file is staged or created:** Validate if the suspicious `.msc` files originated from known malware repositories or were created recently. Use File Creation Time and paths to identify potentially unauthorized modifications.

  - **Identify legitimate RLO usage context:** Cross-reference logs of known administrative tasks that utilize `.msc` files. Examples include updates from IT staff or scheduled administrative scripts, which should be consistent with the organizational role.

  - **Determine related alerts:** Check for associated alerts in the past 24-48 hours around the same user or asset for suspicious activities that indicate a pattern of misuse or compromise.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems managed by MMC and the likelihood of malicious abuse associated with disguising executables as legitimate documents. The use of RLO techniques is known in phishing and malware distribution campaigns, making this behavior particularly concerning.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Windows event logs if appropriate logging configurations aren't applied. Additionally, legitimate administrative actions, including unconventional file management practices using RLO, may trigger this alert. It’s important to employ companion detections for common file executions or suspected command line behaviors surrounding advanced persistent threat (APT) activities to reinforce coverage against these evasion techniques.

