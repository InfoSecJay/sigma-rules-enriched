title: MMC Executing Files with Reversed Extensions Using RTLO Abuse
id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
status: experimental
description: Detects malicious behavior where the MMC utility (`mmc.exe`) executes
  files with reversed extensions caused by Right-to-Left Override (RLO) abuse, disguising
  them as document formats.
references:
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
- https://en.wikipedia.org/wiki/Right-to-left_override
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.execution
- attack.t1204.002
- attack.defense-evasion
- attack.t1218.014
- attack.t1036.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
  - Image|endswith: '\mmc.exe'
  - OriginalFileName: 'MMC.exe'
  selection_commandline:
    CommandLine|contains:     # While looking at these files the prefix of their name will look something like csm.pdf, but in reality it is msc file
    - 'cod.msc'          # Reversed `.doc`
    - 'fdp.msc'          # Reversed `.pdf`
    - 'ftr.msc'          # Reversed `.rtf`
    - 'lmth.msc'          # Reversed `.html`
    - 'slx.msc'          # Reversed `.xls`
    - 'tdo.msc'          # Reversed `.odt`
    - 'xcod.msc'          # Reversed `.docx`
    - 'xslx.msc'          # Reversed `.xlsx`
    - 'xtpp.msc'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Legitimate administrative actions using MMC to execute misnamed `.msc` files.
- Unconventional but non-malicious usage of RLO or reversed extensions.
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of files with reversed extensions via the Microsoft Management Console (MMC) (`mmc.exe`), leveraging Right-to-Left Override (RLO) abuse to disguise executable files as common document formats. The likely attacker objective is to bypass defenses that might prevent the execution of directly malicious files, making these attacks stealthier and more effective. Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **Defense Evasion** (TA0005), specifically techniques **T1204.002: Malicious File** and **T1218.014: Signed Binary Proxy Execution**.

  The primary telemetry sources for monitoring this behavior are process creation logs, particularly focusing on Windows Event ID 4688 that captures detailed information about processes initiated on the system. Malicious execution of files disguised through this technique could lead to further compromise or lateral movement within the network. It is important to note that this detection alone does **NOT confirm** malicious intent; legitimate administrative activity may use similar commands.

  ---

  ### Investigation Steps

  - **Review the command line arguments:** Check Event ID 4688 for instances of `mmc.exe` with suspicious command lines, particularly those containing reversed file extensions (e.g., `cod.msc`, `fdp.msc`). Note the original file name and execution context.

  - **Identify process origin:** Validate the file path of `mmc.exe` in the activity recorded in Event ID 4688. It should be located in `C:\Windows\System32\mmc.exe`. Deviations could indicate a substitution by malware.

  - **Examine parent-child process relationships:** Look for any unusual parent process (Event ID 4688) making the call to `mmc.exe`. Legitimate uses typically originate from administrative tools or scripts rather than unknown executables.

  - **Correlate with user activity:** Review user login histories and actions around the time of execution. Legitimate users may have initiated the command as part of routine administrative tasks.

  - **Check for any related suspicious file activity:** Look for file write events or modifications linked to the created `.msc` files within the Windows Event Log (particularly Event ID 4663) that capture access to these suspiciously named files.

  - **Monitor for lateral movement behavior:** After identifying potential malicious activity, check for network connections or suspicious logins initiated by users or services associated with the executable to determine further compromise.

  ---

  ### Prioritization

  This alert is of **high severity** due to the execution of potentially malicious files disguised as documents using RLO techniques. The impact of a compromised administrative tool like MMC can be significant, as it may provide the adversary with extensive privileges to manipulate security settings and systems. Given the stealthy nature of this technique, the likelihood of abuse in real-world attacks is high.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate administrative actions that also use `mmc.exe` with reversed file names, resulting in potential false positives. Logs must be properly configured to capture all relevant process creation details (Event ID 4688) for reliable detection. Additionally, be aware that some users may utilize unconventional but non-malicious practices involving RLO. A companion detection to augment coverage could involve monitoring for **file extensions** manipulated in similar manners using Windows Sysmon logs (Event ID 1).

