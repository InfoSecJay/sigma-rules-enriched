title: MMC Executing Files with Reversed Extensions Using RTLO Abuse
id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
status: experimental
description: Detects malicious behavior where the MMC utility (`mmc.exe`) 
  executes files with reversed extensions caused by Right-to-Left Override (RLO)
  abuse, disguising them as document formats.
references:
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
- https://en.wikipedia.org/wiki/Right-to-left_override
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.execution
- attack.stealth
- attack.t1204.002
- attack.t1218.014
- attack.t1036.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
  - Image|endswith: '\mmc.exe'
  - OriginalFileName: 'MMC.exe'
  selection_commandline:
    CommandLine|contains:     # While looking at these files the prefix of their name will look something like csm.pdf, but in reality it is msc file
    - 'cod.msc'          # Reversed `.doc`
    - 'fdp.msc'          # Reversed `.pdf`
    - 'ftr.msc'          # Reversed `.rtf`
    - 'lmth.msc'          # Reversed `.html`
    - 'slx.msc'          # Reversed `.xls`
    - 'tdo.msc'          # Reversed `.odt`
    - 'xcod.msc'          # Reversed `.docx`
    - 'xslx.msc'          # Reversed `.xlsx`
    - 'xtpp.msc'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Legitimate administrative actions using MMC to execute misnamed `.msc` files.
- Unconventional but non-malicious usage of RLO or reversed extensions.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of malicious files disguised with reversed extensions via the Microsoft Management Console (MMC) utility (`mmc.exe`). Attackers leverage Right-to-Left Override (RLO) to obfuscate file types, impersonating common document formats like PDFs or Word files. The likely attacker objective is to execute potentially harmful scripts or payloads while evading detection by appearing as benign file types.

  The relevant MITRE ATT&CK tactics and techniques include Execution (TA0002) and Spear Phishing via Attachments (T1204.002). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing command line arguments and process image names. If malicious, the impact could involve system compromise, data exfiltration, or lateral movement. Note that this detection does NOT confirm a compromise without corroborating evidence of malicious intent or network indicators.

  ### Investigation Steps

  - **Review the command line:** Check for `mmc.exe` instances with arguments like `cod.msc` or `xcod.msc`. These files should typically not be executed in this format within normal operational contexts.

  - **Analyze Security Event ID 4688:** Focus on event logs that indicate the creation of processes with reversed extensions. Verify the parent process and chain of execution to identify unusual patterns.

  - **Identify legitimate MMC usage:** Determine if the observed `mmc.exe` processes correlate with known administrative activities, like legitimate configuration changes or system monitoring. Typical usage includes `mmc.exe` with standard plugins such as `services.msc`.

  - **Correlate with antivirus logs:** Check AV/EDR telemetry for any alerts associated with events linked to `mmc.exe` executing files with reversed extensions. High-confidence malicious indicators would be detected if integrated with proactive threat intelligence.

  - **Inspect for file creation artifacts:** Verify the presence of temporary or execution files created in relation to the reversed extension files. Look for unusual file paths or timestamps that align with the process creation.

  - **Cross-reference with threat intelligence:** Search across threat intelligence platforms for any indicators (IOCs) or TTPs matching the command-line arguments found in the alerts. This can provide context on how often this evasion technique is leveraged by known adversaries.

  ### Prioritization

  This alert is high severity due to the potential for significant impact on compromised systems. The likelihood of abuse is moderate to high, given the commonality of RLO techniques in malware campaigns. This method is often weaponized in targeted phishing attacks, making rapid response critical.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions or benign uses of RLO that could trigger the alert. Reliable detection relies on complete logging and visibility of process creation events. Unconventional usage of RLO for non-malicious purposes may also occur, complicating investigations. Related detection coverage may include monitoring for scripting activity or unusual PowerShell commands, which could provide additional context on malicious workflows.

