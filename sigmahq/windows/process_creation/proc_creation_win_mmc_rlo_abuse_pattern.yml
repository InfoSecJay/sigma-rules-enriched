title: MMC Executing Files with Reversed Extensions Using RTLO Abuse
id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
status: experimental
description: Detects malicious behavior where the MMC utility (`mmc.exe`) executes
  files with reversed extensions caused by Right-to-Left Override (RLO) abuse, disguising
  them as document formats.
references:
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
- https://en.wikipedia.org/wiki/Right-to-left_override
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.execution
- attack.t1204.002
- attack.defense-evasion
- attack.t1218.014
- attack.t1036.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
  - Image|endswith: '\mmc.exe'
  - OriginalFileName: 'MMC.exe'
  selection_commandline:
    CommandLine|contains:     # While looking at these files the prefix of their name will look something like csm.pdf, but in reality it is msc file
    - 'cod.msc'          # Reversed `.doc`
    - 'fdp.msc'          # Reversed `.pdf`
    - 'ftr.msc'          # Reversed `.rtf`
    - 'lmth.msc'          # Reversed `.html`
    - 'slx.msc'          # Reversed `.xls`
    - 'tdo.msc'          # Reversed `.odt`
    - 'xcod.msc'          # Reversed `.docx`
    - 'xslx.msc'          # Reversed `.xlsx`
    - 'xtpp.msc'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Legitimate administrative actions using MMC to execute misnamed `.msc` files.
- Unconventional but non-malicious usage of RLO or reversed extensions.
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious behaviors involving the Microsoft Management Console (MMC) utility (`mmc.exe`) executing files with reversed extensions, an exploitation tactic utilizing the Right-to-Left Override (RLO) character to disguise file types. Attackers may leverage this technique to trick users into executing harmful scripts or files that appear legitimate, such as finance-related documents, by using misleading file names that don’t reflect their true type. The objective is often to bypass security solutions and user suspicions, leading to further exploitation within the environment.

  Key MITRE ATT&CK tactics involved include:
  - **Execution (T1204.002)**: The misuse of RLO for executing scripts or files that appear to be innocuous.
  - **Defense Evasion (T1218.014)**: The act of employing deceptive methods to avoid detection and analysis.
  - **Obfuscated Files or Information (T1036.002)**: Crafting misleading names and formats to hide malicious intent.

  The primary data sources effective for detecting this behavior are process creation events, particularly noting execution context for `mmc.exe` and the associated command lines that may indicate reversed extension usage.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of `mmc.exe` in process creation logs, especially the `CommandLine` field for anomalies indicating reversed extensions.
  - **Analyze Command Line Arguments**: Identify command lines with file names containing reversed extensions (e.g., `cod.msc`, `fdp.msc`) to determine legitimacy and possible malicious intent.
  - **Examine File Paths and Origins**: Investigate the file paths from where the `.msc` files are being executed to check for unusual locations that might indicate potential compromise.
  - **Correlate with User Behavior**: Look at historical user behavior patterns to ascertain whether executing these files aligns with user roles and activities, highlighting any deviations from normal practice.

  ### Prioritization
  The alert's severity is high due to its potential to result in significant compromises, as attackers successfully using RLO abuse can execute harmful scripts while deceiving users and security measures, increasing the likelihood of data breaches or system exploitation.

  ### Blind Spots and Assumptions
  Detection coverage may falter when legitimate administrative actions utilize similarly misnamed `.msc` files, as these could generate false positives. The detection logic assumes that all executions of `mmc.exe` with reversed extensions are indicative of malicious behavior, overlooking legitimate scenarios where this behavior might occur. For this alert to function effectively, it is crucial that process creation logs contain detailed command line and image data relevant to all executed applications.

