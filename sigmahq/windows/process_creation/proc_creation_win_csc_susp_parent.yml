title: Csc.EXE Execution Form Potentially Suspicious Parent
id: b730a276-6b63-41b8-bcf8-55930c8fc6ee
status: test
description: Detects a potentially suspicious parent of "csc.exe", which could 
  be a sign of payload delivery.
references:
- https://www.uptycs.com/blog/warzonerat-can-now-evade-with-process-hollowing
- https://reaqta.com/2017/11/short-journey-darkvnc/
- https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/yellow-liderc-ships-its-scripts-delivers-imaploader-malware.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems), X__Junior (Nextron Systems)
date: 2019-02-11
modified: 2024-05-27
tags:
- attack.execution
- attack.t1059.005
- attack.t1059.007
- attack.defense-evasion
- attack.t1218.005
- attack.t1027.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\csc.exe'
  - OriginalFileName: 'csc.exe'
  selection_parent_generic:
    ParentImage|endswith:
    - '\cscript.exe'
    - '\excel.exe'
    - '\mshta.exe'
    - '\onenote.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    - '\wscript.exe'
  selection_parent_powershell:
    ParentImage|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    ParentCommandLine|contains:
    - '-Encoded '
    - 'FromBase64String'
  selection_parent_susp_location:
  - ParentCommandLine|re: '([Pp]rogram[Dd]ata|%([Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\([Ll]ocal([Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$'
  - ParentCommandLine|contains:
    - ':\PerfLogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Temporary Internet'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  filter_main_programfiles:
        # Note: this is a generic filter. You could baseline execution in your env for a more robust rule
    ParentImage|startswith:
    - 'C:\Program Files (x86)\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
    - 'C:\Program Files\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_sdiagnhost:
    ParentImage: 'C:\Windows\System32\sdiagnhost.exe'     # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_w3p:
    ParentImage: 'C:\Windows\System32\inetsrv\w3wp.exe'     # https://twitter.com/gabriele_pippi/status/1206907900268072962
  filter_optional_chocolatey:
    ParentImage: 'C:\ProgramData\chocolatey\choco.exe'     # Chocolatey https://chocolatey.org/
  filter_optional_defender:
    ParentCommandLine|contains: '\ProgramData\Microsoft\Windows Defender Advanced
      Threat Protection'
  filter_optional_ansible:
        # Note: As ansible is widely used we exclude it with this generic filter.
        # A better option would be to filter based on script content basis or other marker while hunting
    ParentCommandLine|contains:
            # '{"failed":true,"msg":"Ansible requires PowerShell v3.0 or newer"}'
    - 'JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw'
    - 'cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA'
    - 'nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA'
  condition: selection_img and 1 of selection_parent_* and not 1 of 
    filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects potentially malicious process creation of `csc.exe` with a suspicious parent process, indicating possible payload delivery. Attackers may aim to execute malicious scripts disguised within legitimate processes, utilizing process creation to bypass security measures. This activity aligns with MITRE ATT&CK's Execution tactic, particularly techniques T1059.005 (JavaScript) and T1059.007 (VBScript).

  The primary telemetry sources are Windows process creation logs, specifically Event ID 4688 for process creation and Sysmon Event ID 1. If malicious, the impact can be significant, allowing attackers to execute code or maintain persistence on the system. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate processes could exhibit similar patterns.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Event ID 4688 and Sysmon Event ID 1 for entries where `csc.exe` is invoked. Focus on both the command line and the parent process details to identify the exact nature of the invocation.

  - **Validate Parent Process:** Inspect the parent process of `csc.exe`. A parent process like `powershell.exe` with command line arguments containing `-Encoded` or `FromBase64String` is a high-confidence malicious indicator.

  - **Identify Legitimate Processes:** Note common applications that legitimately invoke `csc.exe`, such as Microsoft Visual Studio. Check if the invocation stems from users developing or compiling code.

  - **Examine Environment Variables:** Analyze command lines for signs of uncommon paths such as those containing `ProgramData` or `\Temp\`, which are typical indicators of suspicious activity.

  - **Investigate for Evasion Techniques:** Be aware that attackers may utilize processes like `powershell.exe` or `cscript.exe` from unusual locations. Ensure logging for any such instances is configured effectively.

  - **Correlate with Additional Alerts:** Look for other alerts that indicate potential lateral movement, such as anomalous PowerShell executions (T1086). This can confirm broader suspicious behavior within the environment.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential impact on systems where `csc.exe` is invoked by suspicious parents. The likelihood of malicious abuse is elevated, as this behavior is often weaponized in modern attack vectors.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of process hollowing or script obfuscation techniques to hide the true nature of the command line. Ensure comprehensive logging is enabled for process creation and monitoring of command line arguments. Legitimate development or scripting activities could inadvertently trigger this alert, necessitating careful context evaluation. A related detection for monitoring `powershell.exe` scripts can provide additional coverage against contextual threats.

  ---

