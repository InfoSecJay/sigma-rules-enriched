title: Csc.EXE Execution Form Potentially Suspicious Parent
id: b730a276-6b63-41b8-bcf8-55930c8fc6ee
status: test
description: Detects a potentially suspicious parent of "csc.exe", which could 
  be a sign of payload delivery.
references:
- https://www.uptycs.com/blog/warzonerat-can-now-evade-with-process-hollowing
- https://reaqta.com/2017/11/short-journey-darkvnc/
- https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/yellow-liderc-ships-its-scripts-delivers-imaploader-malware.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems), X__Junior (Nextron Systems)
date: 2019-02-11
modified: 2026-03-23
tags:
- attack.execution
- attack.stealth
- attack.t1059.005
- attack.t1059.007
- attack.t1218.005
- attack.t1027.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\csc.exe'
  - OriginalFileName: 'csc.exe'
  selection_parent_generic:
    ParentImage|endswith:
    - '\cscript.exe'
    - '\excel.exe'
    - '\mshta.exe'
    - '\onenote.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    - '\wscript.exe'
  selection_parent_powershell:
    ParentImage|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    ParentCommandLine|contains:
    - '-Encoded '
    - 'FromBase64String'
  selection_parent_susp_location:
  - ParentCommandLine|re: '(?:[Pp]rogram[Dd]ata|%(?:[Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\(?:[Ll]ocal(?:[Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$'
  - ParentCommandLine|contains:
    - ':\PerfLogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\Temporary Internet'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Contacts\'
  - ParentCommandLine|contains|all:
    - ':\Users\'
    - '\Pictures\'
  filter_main_programfiles:
        # Note: this is a generic filter. You could baseline execution in your env for a more robust rule
    ParentImage|startswith:
    - 'C:\Program Files (x86)\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
    - 'C:\Program Files\'         # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_sdiagnhost:
    ParentImage: 'C:\Windows\System32\sdiagnhost.exe'     # https://twitter.com/gN3mes1s/status/1206874118282448897
  filter_main_w3p:
    ParentImage: 'C:\Windows\System32\inetsrv\w3wp.exe'     # https://twitter.com/gabriele_pippi/status/1206907900268072962
  filter_optional_chocolatey:
    ParentImage: 'C:\ProgramData\chocolatey\choco.exe'     # Chocolatey https://chocolatey.org/
  filter_optional_defender:
    ParentCommandLine|contains: '\ProgramData\Microsoft\Windows Defender Advanced
      Threat Protection'
  filter_optional_ansible:
        # Note: As ansible is widely used we exclude it with this generic filter.
        # A better option would be to filter based on script content basis or other marker while hunting
    ParentCommandLine|contains:
            # '{"failed":true,"msg":"Ansible requires PowerShell v3.0 or newer"}'
    - 'JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw'
    - 'cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA'
    - 'nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA'
  condition: selection_img and 1 of selection_parent_* and not 1 of 
    filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of "csc.exe" (C# compiler) under potentially suspicious circumstances, specifically when launched by processes like `cscript.exe`, `powershell.exe`, or various Microsoft Office applications. The likely attacker objective is to execute malicious code for purposes such as payload delivery or command execution, taking advantage of legitimate system tools. This behavior fits within the Framework of MITRE ATT&CK under the tactic of Execution and techniques such as T1059.005 (scripting: .NET) and T1059.007 (scripting: PowerShell).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Event IDs 4688 (Process Creation) and Sysmon Event ID 1. If malicious, the impact can be severe, potentially leading to further exploitation of systems through subsequent payload execution. It is important to note that this detection does NOT confirm malicious intent on its own; it must be corroborated with additional context and evidence.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for instances of `csc.exe` alongside its parent process IDs. Confirm if legitimate applications like `powershell.exe` or `cscript.exe` are present and evaluate their command lines for unexpected parameters.

  - **Analyze parent process interactions**: Investigate Sysmon Event ID 1 for the created process tree involving `csc.exe`. If the parent is `powershell.exe`, ensure to inspect its command line for encoded PowerShell commands or Base64 strings, which are suspicious.

  - **Evaluate command line arguments**: Look for instances where the parent command line contains paths that are typically associated with non-user directories, such as `C:\ProgramData`, `\AppData`, or `\Temp`. This may reveal abnormal execution patterns.

  - **Identify benign usage patterns**: Understand and document common or legitimate usage of `csc.exe` in your environment. For example, development activities using Visual Studio, which might involve `csc.exe`, should look different from malicious behavior.

  - **Confirm high-confidence malicious indicators**: Look for instances where `csc.exe` is invoked without typical user processes present in the command line. Extract files or scripts from `C:\Users\<username>\AppData\`, which may support indications of abnormal activity.

  - **Correlate with existing incidents**: Reference any prior incidents involving `csc.exe` or identified techniques such as T1059 to identify possible patterns of behavior or shared indicators across alerts.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on the executing system and broader network if utilized for malicious payload delivery. The likelihood of abuse is considerable, as scripting with processes like `csc.exe` is an established technique used by adversaries to bypass security controls.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate automation scripts using `csc.exe` may trigger the rule. Additionally, environments with heavy use of PowerShell or scripting may produce increased false positives. Reliable detection requires proper logging configuration for both Sysmon and Event Logs. A related detection could involve monitoring for downloads of potentially malicious scripts, which could complement the process execution information gathered here.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
