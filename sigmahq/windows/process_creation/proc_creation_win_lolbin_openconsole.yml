title: Use of OpenConsole
id: 814c95cc-8192-4378-a70a-f1aafd877af1
status: test
description: Detects usage of OpenConsole binary as a LOLBIN to launch other binaries
  to bypass application Whitelisting
references:
- https://twitter.com/nas_bench/status/1537563834478645252
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-16
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName: 'OpenConsole.exe'
  - Image|endswith: '\OpenConsole.exe'
  filter:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.WindowsTerminal'     # We exclude the default path for WindowsTerminal
  condition: selection and not filter
falsepositives:
- Legitimate use by an administrator
level: medium
note: |
  ### Technical Context
  This rule detects the use of the OpenConsole binary, which is often employed as a living off the land binary (LOLBIN) to evade application whitelisting controls. OpenConsole can facilitate the launching of other binaries in an environment where direct execution might be blocked or monitored, making it a valuable tool for an attacker seeking to evade detection. The threat scenario revolves around an attacker who has gained access to an environment and is attempting to escalate privileges or execute unauthorized commands while remaining under the radar.

  The primary MITRE ATT&CK tactics relevant to this detection include **Execution** (T1059), which encompasses a variety of techniques for executing malicious code. The use of LOLBINs such as OpenConsole falls under this tactic, as it allows attackers to execute harmful actions while leveraging existing, trusted executables. The key data source for this detection is **process creation events** on Windows systems, specifically focusing on instances where OpenConsole is executed outside of its typical operational context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances of OpenConsole.exe being launched. Pay close attention to parent processes that may indicate suspicious behavior.
  - **Correlate with User Activity**: Investigate the account that executed OpenConsole. Determine if it aligns with legitimate administrative tasks or if it appears to be abusing privileges for malicious purposes.
  - **Check Execution Context**: Examine the context in which OpenConsole is executed, looking for signs of other binaries being invoked or launched immediately after its execution, suggesting potential lateral movement or further exploitation.
  - **Investigate Command Arguments**: Look for any unusual command-line arguments passed to OpenConsole. This might reveal attempts to execute unintended scripts or commands that could lead to further compromise.

  ### Prioritization
  This alert is classified as medium severity in an enterprise environment due to the potential for significant impact. The use of LOLBINs like OpenConsole can indicate a heightened risk of exploitation or lateral movement, particularly if conducted by compromised accounts or unexpected user roles.

  ### Blind Spots and Assumptions
  The detection logic relies on the assumption that OpenConsole is not used for legitimate administrative purposes outside its default context. Potential gaps in detection may arise from legitimate uses of OpenConsole by administrators, which could generate false positives. Additionally, if process creation logging is not sufficiently detailed or configured on all endpoints, there may be instances of OpenConsole's execution that go undetected. Ensuring comprehensive logging and clear policies around the use of LOLBINs will be essential to maintain coverage.

