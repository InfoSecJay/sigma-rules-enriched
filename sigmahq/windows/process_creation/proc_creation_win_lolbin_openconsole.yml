logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName: 'OpenConsole.exe'
  - Image|endswith: '\OpenConsole.exe'
  filter:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.WindowsTerminal'     # We exclude the default path for WindowsTerminal
  condition: selection and not filter
falsepositives:
- Legitimate use by an administrator
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the OpenConsole binary, which may be used as a living-off-the-land binary (LOLBIN) by adversaries to launch other processes while bypassing application whitelisting mechanisms. The likely attacker objective is to gain persistence or execute malicious scripts under the guise of legitimate tools. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and User Execution (T1203). The primary telemetry sources are Windows process creation events captured via Security Event ID 4688 or Sysmon Event ID 1 that document the execution of processes on the system. If malicious, the use of OpenConsole can indicate an attempt to evade detection mechanisms by using trusted binaries. Importantly, this detection alone does not confirm malicious behavior; legitimate administrative uses may trigger the alert.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 where the `NewProcessName` field reveals `OpenConsole.exe`. Look for the context of the parent process indicating if it was spawned by a legitimate application or a potentially malicious one. Malicious indicators include processes launched parented by suspicious executables.

  - **Analyze command-line arguments:** Extract the command-line arguments used during execution from the process creation logs. Malicious usage may involve launching unexpected binaries or scripts that are not commonly executed through the OpenConsole.

  - **Validate expected behavior:** Identify normal use cases of OpenConsole by your administrators, such as software installation or maintenance tasks. Compare the timestamps and contexts of the alerts against any recorded administrative actions.

  - **Cross-reference with user activity logs:** If available, analyze user activity logs (Event ID 4624) around the same timeframe to confirm if the users executing OpenConsole have a history of legitimate administrative operations or if there's any anomalous behavior.

  - **Check for additional malicious activity:** Look for connected malicious indicators in the process tree. For instance, identify any child processes spawned by OpenConsole that are known malicious executables or scripts. Use Sysmon logs to monitor potentially harmful command executions.

  - **Examine Windows Application Whitelisting settings:** Confirm if the execution of OpenConsole was part of an attempt to exploit vulnerable application whitelisting configurations. Investigate any recent changes to whitelisting policies or the security posture of the environment.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact of an adversary leveraging trusted binaries for malicious purposes. The likelihood of abuse is considered moderate, especially in environments lacking stringent application whitelisting. However, benign scenarios—such as administrative use—are plausible, which underscores the need for contextual evaluation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logging, as some environments may not capture all events due to configuration constraints. Legitimate administrative use, especially during maintenance or updates, can frequently trigger this alert. A companion detection that complements this coverage is the monitoring for unusual parent-child process relationships, which could indicate further malicious behavior in the context of LOLBINS.

