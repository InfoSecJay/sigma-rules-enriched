title: Use of OpenConsole
id: 814c95cc-8192-4378-a70a-f1aafd877af1
status: test
description: Detects usage of OpenConsole binary as a LOLBIN to launch other 
  binaries to bypass application Whitelisting
references:
- https://twitter.com/nas_bench/status/1537563834478645252
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-16
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName: 'OpenConsole.exe'
  - Image|endswith: '\OpenConsole.exe'
  filter:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.WindowsTerminal'     # We exclude the default path for WindowsTerminal
  condition: selection and not filter
falsepositives:
- Legitimate use by an administrator
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `OpenConsole.exe` binary, commonly used by adversaries as a living-off-the-land binary (LOLBIN) to bypass application whitelisting by launching other binaries. The likely attacker objective is to execute malicious commands or scripts without raising suspicion, often post-exploitation. The relevant MITRE ATT&CK technique associated with this behavior is **Command-Line Interface (T1059)**, which encompasses manipulating command-line utilities to achieve execution.

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID **4688** or Sysmon Event ID **1**, capturing the creation of processes. If malicious, this behavior could lead to further exploitation within the environment, including lateral movement or persistence. This detection does NOT confirm malicious intent solely based on the execution of `OpenConsole.exe`, as legitimate administrative actions could also trigger the alert.

  ### Investigation Steps

  - **Review the process tree:** Examine the parent-child relationships of processes in the execution tree related to `OpenConsole.exe` using Sysmon Event IDs. Look for unusual parent processes (e.g., unexpected executables) that might indicate malicious activity.

  - **Check command-line arguments:** For Security Event ID **4688**, analyze the command-line arguments associated with `OpenConsole.exe`. Legitimacy would typically show standard administrative commands while any suspicious flags or executables should be marked for further scrutiny.

  - **Validate execution path:** Confirm the path of `OpenConsole.exe` by correlating it to legitimate installations. Legitimate executions should be from paths like `C:\Program Files\WindowsApps\Microsoft.WindowsTerminal`. Any deviations could indicate an unauthorized version.

  - **Analyze executed child processes:** Identify child processes created by `OpenConsole.exe`, especially those invoking scripts or executables typically associated with exploitation. Events where child processes do not align with known good behavior should be flagged.

  - **Correlate with user activity logs:** Review user account activity around the time of the alert. Compare legitimate administrative use against any user behavior suggesting potential compromise, such as unexpected users executing `OpenConsole.exe`.

  ### Prioritization

  The alert has a **medium** severity level due to the potential impact of the execution on critical systems within the enterprise. The likelihood of malicious abuse is significant, as attackers frequently leverage LOLBINs for nefarious purposes. Meanwhile, legitimate uses by administrators could contribute to noise around this detection.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of `OpenConsole.exe` by system administrators, which can generate false positives. Reliable detection depends on properly configured logging, specifically ensuring that both Sysmon and Windows Security logs are enabled. Common alternatives for evasion include renaming or executing `OpenConsole.exe` from non-standard locations. Additionally, a related detection to consider is monitoring for abnormal command-line activities in conjunction with the execution of PowerShell scripts (T1059.001) for layered coverage.

