logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\wsl.exe'
    - '\wslhost.exe'
  selection_children_images:
    Image|endswith:
            # Add more suspicious/uncommon "lolbin" processes
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_children_paths:
    Image|contains:
    - '\AppData\Local\Temp\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
    - 'C:\Temp\'
    - '\Downloads\'
    - '\Desktop\'
  condition: selection_parent and 1 of selection_children_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious child processes being spawned from Windows Subsystem for Linux (WSL) executables, particularly `wsl.exe` and `wslhost.exe`. Attackers may utilize WSL for evasion strategies or persistence mechanisms, launching uncommon child processes to circumvent standard detection methods focused on native Windows tools. This behavior aligns with the MITRE ATT&CK technique for Execution (T1202) and Defense Evasion (T1218).

  Key telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which contains the relevant fields for parent and child process relationships. If malicious, the exploitation could lead to increased persistence and further infiltration of the network. However, this detection does not confirm that the execution is malicious by itself, as it may also capture benign WSL usage.

  ---

  ### Investigation Steps

  - **Review Process Parentage:** Examine Security Event ID 4688 logs for any process with ParentImage containing `wsl.exe` or `wslhost.exe` to confirm the parent-child relationship.

  - **Identify Suspicious Child Processes:** Check for child processes spawned by WSL that end with names like `calc.exe`, `cmd.exe`, or `powershell.exe`, particularly focusing on unusual paths such as `\AppData\Local\Temp\` or `\Downloads\`.

  - **Analyze Execution Context:** Determine the context in which the WSL process was executed. Legitimate uses may include development tasks or authorized software installations, while illegitimate uses often lack identifiable user interaction.

  - **Correlate with User Accounts:** Examine the involved user account's activity (e.g., Event ID 4624 for logon events) to assess whether the behavior matches normal user patterns, noting any anomalous accounts or session times.

  - **Validate Temp File Artifacts:** Check the presence of any temporary file artifacts or scripts created within `C:\Users\Public\` or `C:\Windows\Temp\` around the time of the alert for evidence of malicious behavior.

  - **Cross-reference with LOLBAS Indicators:** Investigate any related alerts for common Living Off the Land Binaries (LOLBIN) usage, such as analysis on the execution of widely used administrative utilities that may indicate legitimate automation versus exploit intent.

  ---

  ### Prioritization

  This alert should be considered medium severity. The impacted system's role in the enterprise, especially if it holds sensitive data, increases the potential impact. Given that using WSL for malicious objectives is less common but increasingly observed, further inquiry is warranted into the behavior.

  ---

  ### Blind Spots and Assumptions

  Detection is limited if WSL activity is not logged or if appropriate configurations aren't set for monitoring process creation effectively. Legitimate DevOps or IT administrative tasks may trigger the alert without being malicious. A related detection rule that could strengthen coverage would focus on monitoring unexpected command execution from known LOLBINs in conjunction with the presence of WSL process activities.

