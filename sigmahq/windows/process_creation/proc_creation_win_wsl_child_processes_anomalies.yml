- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\wsl.exe'
    - '\wslhost.exe'
  selection_children_images:
    Image|endswith:
            # Add more suspicious/uncommon "lolbin" processes
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_children_paths:
    Image|contains:
    - '\AppData\Local\Temp\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
    - 'C:\Temp\'
    - '\Downloads\'
    - '\Desktop\'
  condition: selection_parent and 1 of selection_children_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection identifies unusual child processes being launched from Windows Subsystem for Linux (WSL) instances, particularly from `wsl.exe` or `wslhost.exe`. Such behavior may indicate that a threat actor is attempting to bypass traditional detection mechanisms by leveraging WSL for malicious activities, which could include executing scripts or carrying out persistence through cron jobs. The relevant MITRE ATT&CK tactics and techniques include Execution (T1202) and Stealth (T1218).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, the actions may lead to the execution of unauthorized programs, facilitating lateral movement or data exfiltration. This detection does NOT confirm malicious intent on its own, as it may also trigger from legitimate administrative tasks using WSL.

  ### Investigation Steps

  - **Check parent process:** Review Security Event ID 4688 logs to identify the parent process. Look for entries indicating spawning from `wsl.exe` or `wslhost.exe`. Legitimate uses will typically show expected child processes like PowerShell or command prompt scripts related to administrative tasks.

  - **Identify suspicious child processes:** Search for child processes listed in the detection rule (e.g., `cmd.exe`, `powershell.exe`, or `wscript.exe`). Any legitimate administrative action should maintain transparency and follow organizational policies.

  - **Review file paths of child processes:** Inspect the paths of the executed child processes for common malicious indicators, such as `C:\Users\Public\` or `C:\Windows\Temp\`. Files in these directories are often created during suspicious activities, while legitimate processes are usually located in application-specific directories.

  - **Analyze execution time and context:** Cross-reference the time of the alert with user activity logs. Evaluate if WSL was actively used during the time of execution, as legitimate administrative actions usually occur during business hours, while attacks may show unusual timing.

  - **Correlate with related alerts:** Check for any existing alerts related to known LOLBINS associated with child processes of WSL. Previous detections or anomalies may strengthen the case for further investigation if they appear concurrently.

  - **Confirm environment specifics:** Validate the role of the triggered system (e.g., server vs. endpoint) and criticality to the organization. Systems handling sensitive data or assets warrant a higher-level investigation compared to less critical assets.

  ### Prioritization

  The alert is of medium severity, given that WSL is commonly used in enterprise environments, which raises the potential for misuse. Although legitimate usage is possible, the likelihood of malicious exploitation exists due to the stealthy nature of the setup, making this behavior an effective vector for executing attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if WSL logging is not properly configured or if other obfuscation techniques (e.g., renamed files) are used to create child processes outside typical naming conventions. Legitimate administrative tasks using WSL, like software installations or system upgrades, can trigger this alert. A companion detection to consider includes alerts for suspicious command-line arguments associated with the detected child processes, further enriching the investigation output.

