logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - '\wsl.exe'
    - '\wslhost.exe'
  selection_children_images:
    Image|endswith:
            # Add more suspicious/uncommon "lolbin" processes
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_children_paths:
    Image|contains:
    - '\AppData\Local\Temp\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
    - 'C:\Temp\'
    - '\Downloads\'
    - '\Desktop\'
  condition: selection_parent and 1 of selection_children_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects unusual child processes spawned from Windows Subsystem for Linux (WSL) processes, like `wsl.exe` or `wslhost.exe`. Attackers may utilize WSL to execute commands or scripts with reduced detection risk, attempting to evade traditional monitoring tools that focus on standard Windows process execution. This activity could indicate an attempt to establish persistence or evade security controls through processes that are typically overlooked.

  The suspected threat behavior relates to multiple tactics, notably **Execution** (TA0002) and **Defense Evasion** (TA0005). Techniques within these tactics include **Command and Scripting Interpreter** (T1059) and **Windows Command Shell** (T1059.003), which represent common methods used by adversaries to execute malicious payloads. The execution of unusual child processes under WSL can facilitate various malicious activities, from data exfiltration to lateral movement within a network.

  Key data sources for this detection include **process creation logs** from Windows. These logs provide crucial insight into the parent-child relationship of processes, enabling analysts to identify suspicious chains indicative of potential compromises.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze all process creation logs, focusing on entries where the parent process is `wsl.exe` or `wslhost.exe`. Look for child processes that are unusual or uncommon, as defined in the detection logic.

  - **Correlate with User Activity**: Examine the associated user account activity to determine whether the execution of these child processes aligns with legitimate user behavior. Investigate any anomalies that may suggest compromised accounts.

  - **Inspect Child Process Parameters**: Analyze command-line parameters for the identified child processes. Investigating these arguments can reveal more about the intent of the process execution and potential malicious usage scenarios.

  - **Check File System Locations**: Verify the file paths where the child processes were executed from, particularly if they originate from temporary directories or user profile locations. Accessing these paths can indicate attempts to conceal malicious activity.

  ### Prioritization
  The alert's medium severity stems from the potential impact of WSL-based execution on the environment and the likelihood of attackers utilizing this method to avoid detection. Organizations must prioritize this alert, as it can signify a significant threat that could lead to data compromise or system manipulation.

  ### Blind Spots and Assumptions
  There is a gap in detection coverage regarding the initial configuration and execution context of WSL processes, which might not be logged comprehensively depending on the environment's logging configuration. The detection logic assumes that all execution of uncommon child processes in a WSL context is suspicious; however, benign use cases may exist. Effective logging of all process creation events is essential for this rule to function optimally, along with monitoring for legitimate uses of WSL.

