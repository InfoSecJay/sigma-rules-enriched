note: |
  ### Technical Context

  This rule detects the indirect execution of commands through the use of the legitimate SFTP.exe binary with a ProxyCommand parameter in the command line. Attackers may leverage this technique to execute arbitrary commands on the target system without triggering typical security alerts, thereby achieving their objectives while remaining hidden. The relevant MITRE ATT&CK technique for this behavior is Defense Evasion (T1202).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture the creation of new processes and their command-line arguments. If malicious, this activity could lead to unauthorized command execution, data exfiltration, or further compromise of the host. Importantly, this detection alone does not confirm malicious activity; legitimate administrative tasks may also utilize SFTP with ProxyCommand.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 entries for SFTP.exe. The command line must include "ProxyCommand=". Examine the timestamp and user context for any anomalies (e.g., non-admin user running commands).

  - **Investigate the command parameters:** Extract and review the full command-line arguments associated with SFTP.exe. Compare them against known good usage scenarios for your environment. Legitimate usage might include commands for file transfers without ProxyCommand.

  - **Evaluate user account activity:** Analyze the user account initiating the SFTP command in relation to their role. Confirm whether the user is authorized to use SFTP and had a valid reason to use ProxyCommand, such as specific network requirements.

  - **Check for abnormal parent processes:** Track the parent process of the SFTP.exe instance created. If it's unrelated to any user-initiated process or appears as a child of a known malicious process, it may indicate exploitation.

  - **Confirm operational contexts:** Review other Windows logs or telemetry that may contextualize this activity. Look for accompanying log entries that show attempts to create files or network connections to unusual destinations.

  - **Correlate with threat intelligence:** Verify if any known indicators of compromise (IoCs) or tactics associated with the malicious use of SFTP and ProxyCommand have been reported. High-confidence indicators include unusual outbound connections and command patterns previously linked to breaches.

  ### Prioritization

  The severity of this alert is medium based on the potential impact of unauthorized command execution on critical systems. While this technique can be weaponized, it's also relatively uncommon, making verification critical before escalating.

  ### Blind Spots and Assumptions

  Detection can be evaded by modifying SFTP command usage; attackers may obfuscate their commands or use alternative tools. Accurate detection relies on comprehensive process creation logging and correct Sysmon configurations to capture all relevant events. Legitimate administrative activities may occasionally trigger this alert, particularly in complex networking environments. Companion detections for process anomalies (e.g., unusual parent-child process relationships) can enhance coverage and context for alert investigations.

