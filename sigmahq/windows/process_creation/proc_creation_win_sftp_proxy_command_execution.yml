title: Indirect Command Execution via SFTP ProxyCommand
id: 762bb580-79b4-40f4-8b9e-9349ce1710f4
status: experimental
description: |
  Detects the use of SFTP.exe to execute commands indirectly via ProxyCommand parameter.
  Threat actors were seen leveraging this legitimate Windows binary to bypass security controls and execute arbitrary commands while evading detection.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Sftp/
- https://news.sophos.com/en-us/2025/05/09/lumma-stealer-coming-and-going/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-04-27
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sftp.exe'
    CommandLine|contains: 'ProxyCommand='
  condition: selection
falsepositives:
- Legitimate use of SFTP with proxy commands for administration or networking 
  tasks
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_lolbin_sftp_indirect_cmd_execution/info.yml
note: |
  ### Technical Context

  This rule detects the execution of commands indirectly using the SFTP.exe binary with the ProxyCommand parameter. Attackers may leverage this technique to evade security controls and conduct unauthorized actions, aiming to compromise systems or exfiltrate data. This behavior fits within the MITRE ATT&CK framework under the tactic of "Execution" and technique T1202 (Insufficiently Protected Credentials). Primary telemetry sources include process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the security impact could result in system compromise and data loss. However, this detection alone does not confirm that the execution was malicious, as administrative or legitimate scripting activities may also utilize this command.

  ### Investigation Steps

  - **Validate process creation:** Cross-reference Security Event ID 4688 and/or Sysmon Event ID 1 for processes initiated with Image ending in '\sftp.exe'. Confirm the presence of the command line that includes 'ProxyCommand='.

  - **Examine command line arguments:** Investigate the full command line associated with the SFTP.exe process. Legitimate use typically reflects structured SFTP commands without ProxyCommand or have recognizable administrative functions.

  - **Review user context:** Identify the user account associated with the SFTP command. Pay particular attention to accounts with elevated privileges, as atypical usage could indicate malicious intent.

  - **Check system logs for anomalies:** Look for accompanying logs in Windows Event Logs (Event IDs 5140 and 5145) to see if there were any unauthorized access attempts to file shares or sensitive directories around the same time of the SFTP command execution.

  - **Identify known malicious patterns:** If the command line exhibits arguments leading to obscure or unrecognized proxy commands (e.g., connections to non-standard IPs or ports), these are high-confidence indicators of malicious activity.

  ### Prioritization

  This alert has medium severity as it indicates potential misuse of a legitimate binary that could lead to system compromise. Given that command execution via SFTP with ProxyCommand is not common in standard operations, the likelihood of malicious abuse is elevated.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for process creation is not adequately enabled or if logs are aggregated improperly, leading to missed events. Legitimate administrative tasks may inadvertently trigger this alert, especially in environments leveraging SFTP for automated processes. A related detection to consider is event correlation with other command execution patterns to identify potential multi-stage attacks or lateral movement, strengthening overall coverage against sophisticated threats.

