note: |
  ### Technical Context

  This rule detects the execution of processes that utilize "whoami" as a command line parameter, which is often indicative of potentially malicious activity, particularly related to privilege escalation tools like EfsPotato. Attackers may leverage this command in the context of enumeration or credential extraction to gain insights into system user privileges, aiding lateral movement within a network.

  The likely attacker objective here aligns with the MITRE ATT&CK tactic of Discovery (Tactic ID: TA0007) using the technique of System Information Discovery (Technique ID: T1033). Primary telemetry sources for this detection include Windows Process Creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1. A successful exploitation could lead to unauthorized access to sensitive information and increased foothold within the victim environment.

  This detection does not confirm that the behavior is malicious by itself; the use of "whoami" might occur in legitimate system operations. Analysts should be aware of the context in which this command is executed.

  ### Investigation Steps

  - **Identify process activity:** Review Security Event ID 4688 and Sysmon Event ID 1 logs for processes containing '.exe whoami' in the command line. Look for processes launched from unusual directories (e.g., C:\Users\Public\ or recent downloads).

  - **Determine parent process:** Investigate the parent process of the detected command to assess its behavior. If the parent process is a legitimate application (e.g., PowerShell) with a known benign context, it may indicate a false positive.

  - **Check user accounts involved:** Examine the user context under which the command was executed (Event ID 4688 fields include "New Process Creator" and "User Name"). Legitimate administrative users may trigger this for routine tasks, whereas non-administrative accounts may signal suspicious activity.

  - **Analyze command line behavior:** Validate the complete command line arguments used with Event ID 4688 or Sysmon Event ID 1. Any distinct patterns or additional arguments can indicate specific tool usage or malicious intent.

  - **Review historical data:** Query previous executions of 'whoami' to identify if it's part of a repetitive pattern linked to other suspicious activities across the environment. Look for relationships with other triggers like network connections or privilege escalation attempts.

  - **Examine asset criticality:** Assess the significance of the affected host. If it is categorized as a critical server or contains sensitive information, the alert should be prioritized for immediate investigation.

  ### Prioritization

  This alert has a high severity level due to the potential for misuse of "whoami" in the context of privilege escalation and discovery activities, which are common in lateral movement techniques. The likelihood of malicious activity is significant given that this parameter is atypical for standard operations, particularly when observed across multiple accounts or systems.

  ### Blind Spots and Assumptions

  The detection may have limitations against evasion techniques that involve obfuscation of command lines or leveraging legitimate binaries in uncommon ways. Reliable detection requires proper configuration of logging, such as enabling detailed process creation auditing on Windows systems. Legitimate administrative tasks may trigger this alert, particularly in environments with frequent system management. Related detections to consider include monitoring for abnormal parent processes leading to suspicious command executions, such as unusual PowerShell or WMI activity.

