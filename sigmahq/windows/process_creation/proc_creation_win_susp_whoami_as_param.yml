level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious command-line activity involving the execution of processes with `whoami` as the first parameter, particularly indicative of techniques used by tools like EfsPotato. This behavior is consistent with post-exploitation scenarios where attackers attempt to gather system information or manipulate system privileges under the cover of benign commands. The use of `whoami` in this context suggests an intention to escalate privileges or gather information about the current user session, making it a potential signal of malicious activity.

  The relevant MITRE ATT&CK tactics for this detection include **Discovery** (T1083), focusing specifically on the technique **File and Directory Discovery** (T1083), as attackers often need to identify accessible files and directories after gaining a foothold. Additionally, the technique **Account Discovery** (T1123) is pertinent, as attackers may use this command to determine user accounts and permissions on the compromised system. Primary data sources for this detection include Windows process creation logs that provide insights into command-line arguments and associated executable actions.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for processes that executed with `whoami` as the initial command-line parameter, focusing on the execution context and user accounts involved.
  - **Correlate with User Activity:** Investigate the user associated with the command for unusual behavior or privileges previously unknown, especially if the activity aligns with known user work hours or roles.
  - **Analyze Surrounding Events:** Examine system logs for other suspicious activities leading up to the event to identify a broader attack pattern or additional compromised access.
  - **Check for Known Tools:** Look for concurrent execution of known post-exploitation tools or suspicious scripts that may indicate more extensive malicious activity in the environment.

  ### Prioritization
  The alert's severity is high due to the potential for privilege escalation and unauthorized access that can result from the detected command-line activity. In an enterprise environment, this can lead to significant security breaches and data leaks, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the logs that track process creation are not adequately captured or retained. This detection logic assumes that `whoami` will consistently appear in a suspicious context, disregarding benign usages that might also trigger alerts. Continuous logging of process creation events is required for this rule to function effectively, and any misconfiguration in logging could lead to missed detections.

