title: Potential PsExec Remote Execution
id: ea011323-7045-460b-b2d7-0f7442ea6b38
status: test
description: Detects potential psexec command that initiate execution on a 
  remote systems via common commandline flags used by the utility
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2023-02-28
modified: 2025-09-01
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Accepting EULA in commandline - often used in automated attacks
    CommandLine|contains|all:
    - 'accepteula'
    - ' -u '
    - ' -p '
    - ' \\\\'
  filter_main_localhost:
    CommandLine|contains:
    - '\\\\localhost'
    - '\\\\127.'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential remote execution attempts using PsExec by looking for specific command-line flags associated with the utility. Attackers often utilize PsExec to execute commands on remote systems, targeting legitimate processes to bypass security controls. The likely objective of the attacker may be lateral movement or execution of malicious payloads on compromised hosts. This behavior aligns with the MITRE ATT&CK tactic "Resource Development" (T1587.001). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing details of command lines and associated processes. If malicious, this could lead to unauthorized access or control over multiple systems. Importantly, this detection does NOT confirm that a successful breach occurred or that executed commands were inherently malicious on their own.

  ### Investigation Steps

  - **Review command-line arguments:** Check Security Event ID 4688 logs for process creation events with command lines containing both 'accepteula' alongside the flags '-u', '-p', and '\\\\'. Malicious indicators include unexpected use of these flags in unusual contexts, especially targeting multiple machines.

  - **Identify execution context:** Cross-reference the process with Sysmon Event ID 1 to validate the parent process. Legitimate execution will typically be initiated by authorized administrative processes or IT maintenance tools; thus, an unusual parent process may indicate malicious use.

  - **Validate target systems:** Examine command lines referencing '\\\\localhost' or IPs in the range '\\\\127.' to ensure there's no legitimate service communication occurring on intended or isolated networks. Check Event ID 4624 for log-on events to authenticate normal usage patterns.

  - **Assess recent changes or updates:** Check if there have been recent administrative changes on affected systems using Event ID 5136 in Directory Service logs or relevant security records to confirm if PsExec was part of a sanctioned activity or legitimate maintenance process.

  - **Investigate for lateral movement:** Analyze accounting logs or network traffic for attempts to use PsExec across multiple machines within the environment, as this behavior may suggest malicious lateral movement as opposed to standard operational use.

  ### Prioritization

  This alert is high-severity as it indicates a possible attempt at remote execution, which is often used in lateral movement by malicious actors. The ability to execute commands remotely on critical systems raises the likelihood of successful exploitation. PsExec is frequently weaponized in attacks, making immediate investigation essential.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations are incomplete or if legitimate administrative tools coincidentally use similar command-line arguments. Related legitimate activities such as automated script deployment by IT teams or software installations may trigger false positives. A companion detection focusing on abnormal Windows service creation or modifications using Sysmon could strengthen coverage and provide context for these activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
