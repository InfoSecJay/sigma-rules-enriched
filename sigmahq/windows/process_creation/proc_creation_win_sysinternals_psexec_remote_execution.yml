title: Potential PsExec Remote Execution
id: ea011323-7045-460b-b2d7-0f7442ea6b38
status: test
description: Detects potential psexec command that initiate execution on a remote
  systems via common commandline flags used by the utility
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-28
modified: 2025-09-01
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Accepting EULA in commandline - often used in automated attacks
    CommandLine|contains|all:
    - 'accepteula'
    - ' -u '
    - ' -p '
    - ' \\\\'
  filter_main_localhost:
    CommandLine|contains:
    - '\\\\localhost'
    - '\\\\127.'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of commands that utilize PsExec, a legitimate tool commonly used for remote process execution in Windows environments. The detection logic focuses on specific command-line flags often employed in orchestrated attacks, indicating the potential misuse of this tool by threat actors to execute payloads on remote systems. The underlying threat scenario involves an attacker leveraging PsExec to facilitate lateral movement, potentially leading to data exfiltration, further system compromise, or deployment of ransomware.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **Lateral Movement** (TA0008), specifically targeting techniques such as **Remote Services** (T1021) and **Use of Remote Services** (T1021.001). The primary data sources for monitoring these activities will be **process creation events** from Windows systems, which provide insights into command-line usage and execution flags utilized during potential malicious actions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate all process creation logs around the timestamp of the alert to identify the origin of the PsExec command and any subsequent processes that may have been spawned.
  - **Analyze Command-Line Arguments**: Focus on the command-line arguments of the detected instance, particularly looking for the presence of `accepteula`, `-u`, `-p`, and any UNC paths indicating possible remote targeting.
  - **Check Network Connections**: Look for any unusual or unauthorized outbound connections made by the initiating host to other systems following the PsExec execution to confirm lateral movement attempts.
  - **Investigate User Accounts**: Verify the user account associated with the execution of PsExec commands to establish if it has the requisite administrative privileges or if it deviates from normal usage patterns.

  ### Prioritization
  This alert is considered high severity due to the significant potential impact of an unauthorized PsExec execution in an enterprise environment, which could allow attackers to gain access to critical systems, execute malicious payloads, or perform reconnaissance.

  ### Blind Spots and Assumptions
  The current detection logic may not capture all instances of legitimate PsExec usage, leading to potential gaps in coverage for environments where PsExec is routinely employed for administrative tasks. Additionally, the presence of known legitimate command-line arguments may result in false negatives. The effectiveness of this alert relies on comprehensive process creation logging activation and accurate configuration of command-line monitoring across all endpoints in the environment.

