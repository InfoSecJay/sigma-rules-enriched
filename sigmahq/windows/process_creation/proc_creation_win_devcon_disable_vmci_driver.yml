title: Devcon Execution Disabling VMware VMCI Device
id: 85f520e7-6f5e-43ca-874c-222e5bf9c0de
status: experimental
description: |
  Detects execution of devcon.exe with commands that disable the VMware Virtual Machine Communication Interface (VMCI) device.
  This can be legitimate during VMware Tools troubleshooting or driver conflicts, but may also indicate malware attempting to hijack communication with the hardware via the VMCI device.
  This has been used to facilitate VMware ESXi vulnerability exploits to escape VMs and execute code on the ESXi host.
references:
- https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/devcon
- https://communities.vmware.com/t5/VMware-Workstation-Pro/VMCI-driver-issues/td-p/2866060
- https://github.com/search?q=devcon+disable+VMWVMCIHOSTDEV
- https://huntress.com/blog/esxi-vm-escape-exploit
author: Matt Anderson, Dray Agha, Anna Pham (Huntress)
date: 2026-01-02
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-impairment
- attack.t1543.003
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\devcon.exe'
  - OriginalFileName: 'DevCon.exe'
  selection_action:
    CommandLine|contains: ' disable '
  selection_vmci_pci:
    CommandLine|contains:
    - '15AD&DEV_0740'         # VMware VMCI PCI device (Vendor 0x15AD = VMware, Device 0x0740 = VMCI)
    - 'VMWVMCIHOSTDEV'         # VMware VMCI root host device driver name
  condition: all of selection_*
falsepositives:
- Legitimate VMware administration, Tools installation/uninstallation, or 
  troubleshooting driver conflicts.
- Automated scripts in virtualized environments for device cleanup.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_devcon_disable_vmci_driver/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `devcon.exe` with commands that disable the VMware Virtual Machine Communication Interface (VMCI) device. This behavior may indicate an attacker attempting to manipulate VM communication for nefarious purposes, such as executing escape techniques from a virtual machine to the host environment. The relevant MITRE ATT&CK tactics and techniques include "Persistence" (TA0003) and "Privilege Escalation" (TA0004), specifically T1543.003 (Create or Modify System Process: Windows Service).

  The primary telemetry sources are process creation logs from Windows systems, specifically Event ID 4688 from the Security log or Sysmon Event ID 1. If malicious, the impact could be significant as it potentially allows an attacker to exploit vulnerabilities in VMware, facilitating unauthorized access to host systems. This detection does NOT confirm that the behavior is malicious without additional context and analysis.

  ### Investigation Steps

  - **Review process creation details:** Check for Event ID 4688 or Sysmon Event ID 1. Focus on the `CommandLine` field to identify any invocation of `devcon.exe` that includes 'disable' and ‘VMWVMCIHOSTDEV’ or the specific VMCI PCI device ID (`15AD&DEV_0740`).

  - **Identify the user context:** Review the `Account Name` and `Logon ID` fields associated with the process creation event. Confirm whether it was executed by an administrative account or a low-privileged user. Unusual invocation by non-admin users can indicate a potential attack.

  - **Examine for benign usage:** Validate whether the invocation aligns with legitimate VMware administrative activities such as completing troubleshooting steps or software installations. Look for adjacent logs indicating typical VMware maintenance actions (installation of VMware Tools, updates).

  - **Check for automated scripts:** Review any scheduled tasks, scripts, or automation frameworks that may have executed `devcon.exe`. Legitimate automation could account for the command but is less common for disabling critical drivers.

  - **Correlate with host activity:** Analyze the interactions with the VMCI device immediately preceding and following the event. Look for telemetry indicating anomalous behavior such as unusual network connections, unauthorized access attempts, or exploitation activities reported in logs.

  - **Look for additional alerts:** Identify any related alerts triggered by other detection rules, such as those focused on unusual network behavior or privilege escalation activities (especially those related to VM escape scenarios). Investigate any patterns that corroborate with pivoting towards host access.

  ### Prioritization

  The alert is rated high due to the substantial impact an exploit on a virtualized environment can have – unauthorized access to the host system could lead to data exfiltration and lateral movement. The likelihood of malicious abuse is elevated given that the disabling of VMCI could facilitate known VMware exploits. This behavior has been weaponized in various documented attack vectors and requires immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative tasks may trigger this alert, leading to false positives. The detection relies on accurate process creation logs; insufficient logging configurations may obscure this behavior. Additionally, legitimate use-cases such as automated scripts in a CI/CD pipeline may inadvertently disable the VMCI device. A companion detection, such as monitoring outbound connections for VM hosts, could strengthen this detection's efficacy by corroborating malicious intent.

