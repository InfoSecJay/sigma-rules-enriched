title: Devcon Execution Disabling VMware VMCI Device
id: 85f520e7-6f5e-43ca-874c-222e5bf9c0de
status: experimental
description: |
  Detects execution of devcon.exe with commands that disable the VMware Virtual Machine Communication Interface (VMCI) device.
  This can be legitimate during VMware Tools troubleshooting or driver conflicts, but may also indicate malware attempting to hijack communication with the hardware via the VMCI device.
  This has been used to facilitate VMware ESXi vulnerability exploits to escape VMs and execute code on the ESXi host.
references:
- https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/devcon
- https://communities.vmware.com/t5/VMware-Workstation-Pro/VMCI-driver-issues/td-p/2866060
- https://github.com/search?q=devcon+disable+VMWVMCIHOSTDEV
- https://huntress.com/blog/esxi-vm-escape-exploit
author: Matt Anderson, Dray Agha, Anna Pham (Huntress)
date: 2026-01-02
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\devcon.exe'
  - OriginalFileName: 'DevCon.exe'
  selection_action:
    CommandLine|contains: ' disable '
  selection_vmci_pci:
    CommandLine|contains:
    - '15AD&DEV_0740'         # VMware VMCI PCI device (Vendor 0x15AD = VMware, Device 0x0740 = VMCI)
    - 'VMWVMCIHOSTDEV'         # VMware VMCI root host device driver name
  condition: all of selection_*
falsepositives:
- Legitimate VMware administration, Tools installation/uninstallation, or 
  troubleshooting driver conflicts.
- Automated scripts in virtualized environments for device cleanup.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_devcon_disable_vmci_driver/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `devcon.exe` with commands that disable the VMware Virtual Machine Communication Interface (VMCI) device. The likely attacker objective is to interfere with the VMCI for malicious purposes, potentially allowing an attacker to escape from a virtual machine and exploit vulnerabilities on the ESXi host. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (T1562.001) and Persistence (T1543.003). Primary telemetry sources include Windows process creation logs (Event ID 4688, Sysmon Event ID 1) that capture command-line activity. If malicious, this action can allow unauthorized communication and control over virtualized environments, posing a significant security risk. Notably, this detection alone does NOT confirm malicious intent, as disabling the VMCI device can occur during legitimate troubleshooting efforts.

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 4688 logs for `devcon.exe` execution. Look for command line arguments containing "disable" and "15AD&DEV_0740" or "VMWVMCIHOSTDEV". Unusual parameters indicate potential malicious activity.

  - **Analyze source of execution:** Identify the parent process of `devcon.exe`. Legitimate triggers often come from management tools or scripts. Malicious execution may have unexpected parent processes, especially those unrelated to VMware.

  - **Cross-check with VMware logs:** Examine VMware logs for any recent changes or issues with the VMCI device that could explain legitimate usage. Look for entries reflecting normal operational behavior versus abrupt or unexplained interventions.

  - **Verify system criticality:** Assess the asset's role in the environment. If the affected system is a critical ESXi host, prioritize this investigation as the impact could be high due to potential VM escape.

  - **Identify indicators of compromise:** Look for concurrent activity such as unusual outbound network connections or file manipulations related to the VMCI element after the execution of `devcon.exe`. Specifically, look for logs suggesting expected IP communications or file manipulations that align with your normal operating environment.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on critical ESXi hosts and the likelihood of adversaries abusing VMCI device manipulation. Given that this behavior can be weaponized in attacks against ESXi vulnerabilities, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logging for process creation is not comprehensively enabled, as well as by adversaries using legitimate administrative practices to disguise their activity. Legitimate activities might involve normal VM troubleshooting or updates that could unintentionally trigger this alert. A related detection rule for monitoring abnormal outbound network connections following similar process executions would enhance coverage and detection efficacy.

