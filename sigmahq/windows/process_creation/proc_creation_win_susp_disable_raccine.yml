logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains|all:
    - 'taskkill '
    - 'RaccineSettings.exe'
  selection2:
    CommandLine|contains|all:
    - 'reg.exe'
    - 'delete'
    - 'Raccine Tray'
  selection3:
    CommandLine|contains|all:
    - 'schtasks'
    - '/DELETE'
    - 'Raccine Rules Updater'
  condition: 1 of selection*
falsepositives:
- Legitimate deinstallation by administrative staff
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to uninstall Raccine, a free ransomware protection tool designed to detect and mitigate ransomware threats on Windows systems. Attackers may target security software like Raccine to disable protections, effectively enhancing their chances of successful ransomware deployment or other malicious activities. The likely objective is to facilitate a subsequent compromise or to carry out ransomware attacks without interference from existing protective measures.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Defense Evasion (TA0005)** and **Indicator Removal on Host (T1562.001)**. By uninstalling security tools, threat actors attempt to remove traces of their activities or protect their ransomware payloads from detection.

  To gather evidence for this detection, primary data sources include **process creation logs** from Windows systems, which provide insight into executed commands. Monitoring these logs is vital for identifying suspicious command-line operations targeted at security software configurations or instances.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events to identify any `taskkill` commands targeting `RaccineSettings.exe`, as well as any `reg.exe` commands that delete entries related to the Raccine Tray.

  - **Analyze Command-Line Arguments:** Check the command line arguments for indications of Raccine uninstallation, specifically looking for commands that invoke `schtasks` with the `/DELETE` parameter on `Raccine Rules Updater`.

  - **Validate Endpoints:** Confirm that any uninstallation requests align with known administrative actions. Engage with administrative staff to verify if the activity is legitimate or malicious.

  - **Correlate with Other Logs:** Cross-reference findings with other telemetry sources, such as EDR alerts, to identify potential malware activity or other suspicious behavior surrounding the Raccine removal activities.

  ### Prioritization
  This alert is categorized as high severity because the uninstallation of security software like Raccine can indicate a serious breach attempt by an adversary, significantly increasing the risk of successful ransomware infiltration or other malicious acts against enterprise assets.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage lies in legitimate administrative actions, where IT staff may uninstall Raccine for valid maintenance reasons, leading to false positives. The detection logic assumes that command patterns exclusively indicate uninstallation attempts rather than benign activities. For this alert to function effectively, appropriate process creation logging must be enabled on all endpoints, ensuring comprehensive visibility into command executions across the enterprise.

