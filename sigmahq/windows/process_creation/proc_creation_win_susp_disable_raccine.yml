  ---

  ### Technical Context

  This detection rule identifies attempts to uninstall Raccine, a freeware designed to protect systems from ransomware attacks. The likely objective of the attacker is to disable this protective measure to facilitate subsequent malicious activities, such as executing ransomware. This behavior correlates with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562.001 (Impair Defenses).

  The primary telemetry source is process creation logs from Windows, specifically focusing on command-line arguments that indicate direct actions against Raccine's functionality. If malicious, this behavior can significantly increase the risk of a ransomware infection. However, this detection alone does not confirm malicious intent, as legitimate deinstallation by administrative staff may trigger the same alerts.

  ---

  ### Investigation Steps

  - **Review command-line details in process logs:** Check for Event ID 4688 for process creation events that involve command-line arguments containing 'taskkill' and 'RaccineSettings.exe'.

  - **Validate registry deletion attempts:** Inspect for any 'reg.exe' commands in Event ID 4688 or Sysmon Event ID 1 that include 'delete' and reference 'Raccine Tray'. Look for excessive or unplanned registry modifications indicating malicious intent.

  - **Examine scheduled task deletions:** Query for instances where 'schtasks' command is executed with '/DELETE' and 'Raccine Rules Updater' in the command-line (Event ID 4688). A legitimate system admin would typically have an accompanying justification in ticketing systems.

  - **Cross-check user activity timing:** Compare the execution timestamps of the detected commands against user activity logs (such as Windows Event ID 4624). Identify if the uninstall actions were performed by a known administrative user using legitimate credentials or unexpected accounts with elevated privileges.

  - **Document evidence of benign activity:** Note if Raccine's uninstallation aligns with recent maintenance schedules communicated to the staff, including valid change management documentation supporting the action.

  - **Identify high-confidence malicious indicators:** Look for patterns where these uninstall commands occur in non-administrative user accounts or during odd hours, which may indicate unauthorized access or a compromise.

  ---

  ### Prioritization

  This alert is of high severity given that it involves the potential disablement of critical ransomware protection on endpoints. The likelihood of malicious abuse is significant since attackers frequently aim to eliminate security solutions to facilitate ransomware deployment. Such behavior is not only suspicious but is also characterized as a common tactic among threat actors.

  ---

  ### Blind Spots and Assumptions

  Limitations in this detection include the potential for administrative staff to perform legitimate Raccine uninstalls, which can result in false positives. Reliable detection requires proper logging configurations in place for process creation events. Additionally, activities such as legitimate software updates or security tool audits could trigger similar alerts. Companion detections like unauthorized process creation around the same timeframe can help strengthen coverage and detect coordinated attacks.

