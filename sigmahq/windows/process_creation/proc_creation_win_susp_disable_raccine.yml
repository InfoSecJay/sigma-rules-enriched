title: Raccine Uninstall
id: a31eeaed-3fd5-478e-a8ba-e62c6b3f9ecc
status: test
description: Detects commands that indicate a Raccine removal from an end 
  system. Raccine is a free ransomware protection tool.
references:
- https://github.com/Neo23x0/Raccine
author: Florian Roth (Nextron Systems)
date: 2021-01-21
modified: 2022-10-09
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains|all:
    - 'taskkill '
    - 'RaccineSettings.exe'
  selection2:
    CommandLine|contains|all:
    - 'reg.exe'
    - 'delete'
    - 'Raccine Tray'
  selection3:
    CommandLine|contains|all:
    - 'schtasks'
    - '/DELETE'
    - 'Raccine Rules Updater'
  condition: 1 of selection*
falsepositives:
- Legitimate deinstallation by administrative staff
level: high
note: |
  ### Technical Context

  This Sigma rule detects commands that indicate the removal of Raccine, a ransomware protection tool. The likely attacker objective is to disable ransomware defenses in order to execute malicious payloads without detection. The relevant MITRE ATT&CK tactics and techniques are **Defense Evasion (T1562)** and **Indicator Removal on Host (T1070)**. Primary telemetry sources include Windows process creation logs, specifically Security Event IDs 4688 and/or Sysmon Event ID 1 for process execution. If malicious, the impact could lead to increased susceptibility to ransomware attacks, compromising data integrity and availability. It is important to note that this detection does NOT confirm compromise on its own, as legitimate administrative deinstallation efforts can trigger the same commands.

  ### Investigation Steps

  - **Identify Command Execution Context:** Check to see which user executed the command using Event ID 4688 and validate that it aligns with administrative privileges. Expected behavior includes administrative users performing deinstallations during routine maintenance.

  - **Review Command Line Arguments:** Investigate the full command line in question (e.g., `taskkill`, `reg.exe`) from detected processes via Sysmon Event ID 1 or Windows event logs. Legitimate activity may show standard administrative tasks, while unusual combinations may indicate malicious intent.

  - **Correlate with SIEM Alerts:** Search SIEM for concurrent alerts around the same timestamp, particularly for any relevant events that suggest unauthorized access, such as abnormal logins or privilege escalation attempts (e.g., Event Log IDs 4624, 4672).

  - **Understand System Role:** Assess the asset's role (e.g., critical server vs. endpoint) and prioritize investigation based on criticality. For instance, removal on critical production systems is a higher risk.

  - **Check for Previous Raccine Activity:** Review logs for any historical entries associated with Raccine's operations, such as Event IDs related to its installations or updates. Frequent removal commands could indicate ongoing hostile activity.

  ### Prioritization

  This alert is of **high severity** due to the potential impact on critical systems protected by Raccine and the frequent exploitation of defenses by adversaries. The likelihood of malicious abuse is significant, as attackers often seek to disable security controls to execute ransomware attacks. This type of behavior can be commonly weaponized in attacks targeting enterprise environments.

  ### Blind Spots and Assumptions

  There may be limitations in detection if the security logs are not adequately configured to capture all command-line executions. Legitimate activities such as system upgrade processes that uninstall security tools for compatible replacements can trigger this detection. Monitoring enhancements, such as correlating with alerts on unusual user behavior (using the **T1071** technique), would strengthen overall coverage against such detection gaps.

