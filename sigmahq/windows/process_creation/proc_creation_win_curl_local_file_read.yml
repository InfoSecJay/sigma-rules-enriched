level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_local_file_read/info.yml
note: |
  ### Technical Context
  This detection rule identifies instances where `curl.exe` is executed with the `file://` protocol, typically indicating an attempt to read local files on a Windows system. Attackers may utilize this method to exfiltrate sensitive data or access configuration files without invoking traditional file access, potentially avoiding detection by security solutions. The ability to read local files can be an initial step toward more extensive data exfiltration or lateral movement within the network.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic:** Execution (TA0002)
  - **Technique:** Command-Line Interface (T1059)

  The primary data sources for evidence include process creation events on Windows systems, which log details about executed processes and their command-line arguments. Monitoring these logs can help quickly identify unauthorized or suspicious use of `curl.exe`, especially when combined with contextual data about the host system and user account behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the Windows process creation logs for instances of `curl.exe` running with the `file:///` protocol. Identify the user account and originating process, if applicable, to understand the context of execution.
  - **Analyze Command-Line Arguments:** Extract and review the full command-line arguments used during the `curl.exe` execution. This can provide insights into the specific files being accessed or potentially exfiltrated.
  - **Assess User Behavior:** Investigate the user behavior associated with the triggering event. If a user without a legitimate need to run `curl.exe` executes it, this could indicate malicious intent.
  - **Correlate with File Access Events:** If available, correlate the process creation event with file access logs to determine if specific sensitive files were accessed during the `curl.exe` execution.

  ### Prioritization
  This alert is classified as medium severity due to the potential risk of sensitive data being read and exfiltrated by unauthorized users. Curl is a legitimate tool, but its misuse in this manner raises significant concerns about potential data breaches or insider threats.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where process creation logs may not be configured to capture all execution events or where `curl.exe` usage is deemed legitimate and prevalent. The detection logic assumes that command-line arguments will accurately reflect malicious intent; however, legitimate users may use `curl.exe` with the `file:///` protocol for valid purposes. Proper log collection and configuration are necessary for this alert to function effectively; without comprehensive monitoring of process creation on Windows systems, critical events may be missed.

