note: |
  ---

  ### Technical Context

  This rule detects the execution of `curl.exe` with the `file://` protocol, which indicates an attempt to read local files on a Windows system. The likely attacker objective is to exfiltrate sensitive information or probe for configurations and credentials stored on the local file system. This behavior fits into the MITRE ATT&CK framework under the tactic of Execution (TA0002) and the technique of User Execution (T1203). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, focusing on command line arguments and the executed image.

  If malicious, successful exploitation can lead to unauthorized information disclosure. However, this detection alone does NOT confirm that an attack is occurring, as legitimate uses of `curl.exe` for local file access may exist.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances of `curl.exe` being executed with `file:///` in the CommandLine argument. Look for unusual paths that are not typical for standard operations.

  - **Identify high-confidence malicious indicators:** Look for patterns in command-line arguments that suggest an attacker’s interest in sensitive files (e.g., `file:///C:/Users/*/Documents`, `file:///C:/ProgramData`, etc.). Cross-reference with known attack scenarios.

  - **Assess legitimate usage:** Determine if `curl.exe` is commonly used within the environment for valid operations (e.g., DevOps tasks, application interactions). Validate if the execution occurred in the context of authorized processes or users.

  - **Analyze parent process relationships:** Investigate the parent process of the `curl.exe` execution to gain context about how it was invoked, particularly if it was launched by a process with administrative privileges or unusual origins.

  - **Check for creation or access of sensitive files:** Examine log files in the indicated paths for recent access or modifications that coincide with the execution time of `curl.exe`, especially focusing on files like configuration or credential stores.

  - **Correlate with network activity:** If possible, review related network logs to confirm whether this local file access coincides with any outbound connections (that are suspicious) initiated shortly after the execution of `curl.exe`.

  ---

  ### Prioritization

  The alert is of medium severity due to the potential risk of data exposure on critical systems if exploited. The likelihood of malicious use is significant, as attackers often utilize `curl` for file access during reconnaissance or data exfiltration. This behavior is notable in many recent attacks, underscoring the need for thorough investigation.

  ---

  ### Blind Spots and Assumptions

  Detecting this behavior could be thwarted by configured alerts for benign `curl.exe` usage in certain environments, potentially leading to false negatives on legitimate operations. Comprehensive logging of process creation events must be enabled across all endpoints to ensure effective detection. Legitimate activities, such as developers or administrators utilizing `curl` for local file testing, may trigger this alert. A companion detection that enhances coverage is monitoring for unusual file access patterns via file integrity monitoring tools.

