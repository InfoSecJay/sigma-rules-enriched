title: Cloudflared Tunnel Execution
id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
status: test
description: Detects execution of the "cloudflared" tool to connect back to a tunnel.
  This was seen used by threat actors to maintain persistence and remote access to
  compromised networks.
references:
- https://blog.reconinfosec.com/emergence-of-akira-ransomware-group
- https://github.com/cloudflare/cloudflared
- https://developers.cloudflare.com/cloudflare-one/connections/connect-apps
author: Janantha Marasinghe, Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-17
modified: 2023-12-20
tags:
- attack.command-and-control
- attack.t1102
- attack.t1090
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - ' tunnel '
    - ' run '
    CommandLine|contains:
    - '-config '
    - '-credentials-contents '
    - '-credentials-file '
    - '-token '
  condition: selection
falsepositives:
- Legitimate usage of Cloudflared tunnel.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the "cloudflared" tool, which is often utilized by attackers to establish a tunnel back to compromised networks. The use of cloudflared can indicate an attempt to maintain persistent access or perform command-and-control (C2) operations without being detected. Threat actors may employ this tool to bypass traditional security measures and could leverage it to exfiltrate data or further infiltrate the network.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - Command and Control (T1071): Application Layer Protocol (e.g., using cloudflared to relay commands via HTTPS).
  - Remote Access (T1102): Application Layer Protocol (using application-specific tools such as cloudflared for remote connections).
  - Initial Access (T1090): Proxy (establishing an outbound connection to a malicious endpoint).

  The primary data sources to consider for detecting this behavior are process creation logs from endpoint devices, specifically focusing on the command-line parameters used during execution. These logs will help identify any suspicious usage patterns, such as the presence of unusual commands or flags related to cloudflared.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze recent process creation records for any instances of cloudflared execution, particularly focusing on command lines that include "tunnel" and "run" along with options like "-config" or "-token".

  - **Correlate with Network Activity**: Check associated network logs for outbound connections initiated by the host running cloudflared. Look for connections to unusual IP addresses or domains, which may suggest C2 communication.

  - **Examine Host's Installed Software**: Investigate the host's software installation or inventory to confirm whether cloudflared is a legitimate tool for business purposes or if it appears without proper authorization.

  - **Assess User Activity**: Analyze user activity logs around the time of the cloudflared execution. Look for any suspicious user behavior that might indicate privilege escalation or unauthorized access prior to the execution event.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of a threat actor maintaining persistent access through cloudflared. While there are legitimate use cases for the tool, its unauthorized execution poses a significant risk for data exfiltration and further compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection if process creation logging is not properly configured or if the logs are not retained long enough to analyze historical behavior. The detection logic assumes that any invocation of cloudflared with specific arguments is indicative of malicious intent; however, legitimate use cases may exist. For this rule to function effectively, it is essential that all process creation events are logged comprehensively and that additional context is gleaned from network activity to validate the cause of the execution.

