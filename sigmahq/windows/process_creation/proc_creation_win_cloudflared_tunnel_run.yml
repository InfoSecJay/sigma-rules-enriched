logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - ' tunnel '
    - ' run '
    CommandLine|contains:
    - '-config '
    - '-credentials-contents '
    - '-credentials-file '
    - '-token '
  condition: selection
falsepositives:
- Legitimate usage of Cloudflared tunnel.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "cloudflared" tool, specifically when it is invoked with commands indicating a connection to a tunnel. The behavior often points to an attacker attempting to establish persistent access to a compromised network, facilitating other malicious activities such as data exfiltration or lateral movement. This aligns with MITRE ATT&CK tactics and techniques for Command and Control (T1071), Remote Access Software (T1102), and Application Layer Protocol (T1572). The primary telemetry source is Windows process creation logs, specifically looking for relevant fields in security event logs (Event ID 4688) that indicate command-line execution details. If this behavior is malicious, it can signify a severe compromise that allows an adversary prolonged access to the environment. It is critical to note that the execution of the cloudflared command alone does not confirm malicious intent, as legitimate applications may also utilize this service.

  ### Investigation Steps

  - **Review command-line arguments:** Check the command line for the executed process in Event ID 4688. Look for arguments such as `-config`, `-credentials-contents`, `-credentials-file`, or `-token`, which are often associated with malicious usage.

  - **Identify parent process:** Investigate the parent process of the cloudflared execution using Event ID 4688. A suspicious parent process (like PowerShell, cmd.exe, or rundll32) can indicate potential malicious activity.

  - **Correlate with network logs:** Check for outbound connections in firewall or proxy logs that match the timing of the cloudflared execution. Legitimate cloudflared usage typically has known endpoints, while malicious attempts may connect to unusual IPs or domains.

  - **Validate asset criticality:** Confirm the asset on which cloudflared is running and its role within the network. Instances on high-value servers are more concerning than on less critical assets.

  - **Cross-reference with threat intelligence:** Use the execution context to compare against known threat actor profiles. If the process appears with a previously identified actor’s TTPs (Tactics, Techniques, and Procedures), this significantly raises malicious confidence.

  - **Examine for file artifacts:** Investigate the file system for any associated files created or modified by cloudflared (e.g., credential files or log files), validating whether these artifacts correspond to legitimate usage or indicate compromise.

  ### Prioritization

  The alert is medium severity due to its association with possible command and control operations. The likelihood of abuse is moderate, as attackers often use cloudflared for bypassing organization security measures and maintaining persistent access. This behavior is increasingly noted in real-world attacks, particularly in ransomware scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of cloudflared within the organization, leading to potential false positives. It's crucial to ensure that logging is properly configured to capture all process creations and command-line arguments for accuracy. Additionally, benign uses of cloudflared by developers or DevOps teams may trigger the alert. A related detection is monitoring for anomalous DNS queries to domains associated with cloudflared usages, enhancing coverage against detection evasion tactics.

