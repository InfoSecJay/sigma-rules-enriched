detection:
  selection_img:
  - Image|endswith: '\node.exe'
  - OriginalFileName: 'node.exe'
  - Product: 'Node.js'
  selection_cmd:
    CommandLine|contains|all:
    - 'http'
    - 'execSync'
    - 'spawn'
    - 'fs'
    - 'path'
