note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` with potentially malicious command line arguments indicative of attempts to load registered COM objects. The likely attacker objective is to achieve persistence or privilege escalation, leveraging the Windows Component Object Model (COM) to execute arbitrary code without raising suspicion. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Remote Service Creation (T1546.015).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details about process executions. If malicious, it can lead to unauthorized access and execution of code on the system. However, this detection alone does not confirm malicious intent, as `rundll32.exe` is also used legitimately by Windows processes and applications.

  ### Investigation Steps

  - **Check Process Creation Events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for `rundll32.exe` executions. Confirm if the execution is invoked with unusual command line arguments (e.g., `-sta`, `-localserver`). Evaluate the Digital Signature and OriginalFileName fields for anomalies.

  - **Review Command Line Arguments:** Analyze the CommandLine field for the presence of JSON-like structures `{}` alongside `-sta` and `-localserver`. Legitimate `rundll32.exe` calls typically do not include these arguments, particularly in combination.

  - **Identify Parent Processes:** Investigate the ParentProcessID field linked to the detected `rundll32.exe` process. Malicious invocations often have unusual parent processes like `powershell.exe` or `cmd.exe`, while legitimate ones generally stem from system processes.

  - **Correlate with Registry Changes:** Look for related Registry modifications typically associated with COM object registration, checking the `HKEY_CLASSES_ROOT` and `HKEY_LOCAL_MACHINE\SOFTWARE\Classes` keys. Unauthorized changes might signify malicious persistence efforts.

  - **Assess System Roles:** Determine the role of the affected host to understand the potential impact. High-privilege or critical assets (e.g., domain controllers) facing this activity should escalate investigation efforts immediately.

  - **Identify Known Malicious Artifacts:** Cross-reference the command line used with threat intelligence databases and known malware signatures, focusing on any prior correlations with documented malicious usage of `rundll32.exe`.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems, particularly if malicious execution leads to privilege escalation or persistence. The likelihood of this behavior being weaponized in targeted attacks is high, as attackers often leverage `rundll32.exe` for stealthy command execution.

  ### Blind Spots and Assumptions

  Limitations include the possibility of evasion through obfuscation or legitimate software utilizing the flagged execution behavior, resulting in false positives. Reliable detection requires appropriate logging settings for both security and Sysmon events. Legitimate administrative tasks may also trigger this alert if they involve valid COM manipulations. To strengthen coverage, companion detections for abnormal PowerShell usage (e.g., T1059.001) should be implemented.

