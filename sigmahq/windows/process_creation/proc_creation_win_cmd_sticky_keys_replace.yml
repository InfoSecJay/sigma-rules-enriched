note: |
  ### Technical Context
  This detection rule identifies a potential persistence mechanism known as a "Sticky Keys" backdoor, where an attacker replaces the Sticky Keys executable with the Command Prompt (CMD) executable. When a user activates Sticky Keys—usually by pressing the Shift key five times—it triggers a privileged Windows console session without requiring authentication, allowing the attacker to gain unauthorized access to the system. This technique is commonly employed to facilitate further lateral movement or data exfiltration within compromised environments.

  The primary objective of this type of attack is to maintain persistence on a target system, enabling attackers to execute commands and maintain control even after an initial access point has been closed. This method relates closely to the MITRE ATT&CK tactics of Persistence (TA0023) and Privilege Escalation (TA0004), specifically the technique T1546.008 known as "Indicator Removal on Host" or "Sticky Keys."

  To effectively detect this behavior, telemetry sources such as process creation events are crucial, particularly logs detailing command lines used during executable creation and modifications. These logs can reveal suspicious activity indicative of this persistence mechanism.

  ### Investigation Steps
  - **Analyze Process Creation Logs:** Review process creation events to identify instances where the command line indicates the copying of CMD.exe to sethc.exe (e.g., `copy /y C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe`).
  - **Correlate User Activity:** Investigate user logins and account activity around the time the Sticky Keys executable was modified to understand the context and potentially identify unauthorized access.
  - **Review Change Logs:** If available, inspect system change logs to track any modifications to the Sticky Keys executable or other critical system files that may indicate tampering.
  - **Assess System Integrity:** Conduct a forensic analysis of the filesystem, focusing on timestamps and integrity of the original Sticky Keys executable, to confirm whether it has been altered.

  ### Prioritization
  This alert is critical due to the high impact associated with unauthorized privileged access and the likelihood of exploitation, especially in enterprise environments where sensitive data and resources are at stake.

  ### Blind Spots and Assumptions
  This detection logic assumes that the execution of the Sticky Keys executable is not a normal or legitimate activity, which might not hold true in every environment. Potential blind spots include reliance on specific command line patterns that could be obfuscated or altered by attackers. Additionally, proper logging configurations must be in place to capture process creation events, and there may be gaps in detection if monitoring is not consistently applied across all endpoints.

