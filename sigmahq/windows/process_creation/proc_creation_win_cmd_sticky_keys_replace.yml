detection:
  selection:
    CommandLine|contains|all:
    - 'copy '
    - '/y '
    - 'C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe'
  condition: selection
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the replacement of the Sticky Keys executable in Windows with the Command Prompt executable (cmd.exe). This behavior indicates an attacker trying to maintain persistence by leveraging a well-known method to gain privileged access to a system without authentication. The likely attacker objective is to enable unauthorized access and control over the affected system covertly, which aligns with the MITRE ATT&CK technique "Indicator of Compromise - T1546.008" (Kernel Module and Driver).

  The primary telemetry sources include Windows Security Event ID 4688 for process creation activities, as well as potential Sysmon Event ID 1 for command line arguments. If this behavior is malicious, it could facilitate unauthorized access to sensitive data or system manipulation. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is necessary to determine if the behavior was conducted by a legitimate administrator or a malicious actor.

  ### Investigation Steps

  - **Check Event ID 4688 for process creation:** Look for entries where the CommandLine field contains `copy /y C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe`. This indicates an attempt to overwrite the Sticky Keys executable.

  - **Correlate with Sysmon Event ID 1:** Review Sysmon logs to corroborate the process creation activity, focusing on the CommandLine field for similar copy operations. Comparing timestamps with user login/logout events may differentiate between legitimate administration and potential UA compromise.

  - **Identify legitimate usage of Sticky Keys:** Validate expected user activity, such as accessibility checks or legitimate administrative operations using Sticky Keys under scheduled maintenance windows. Such operations typically occur during logged hours by known administrators.

  - **Look for abnormal user accounts:** Examine user accounts that triggered the alert and assess their permission levels. Accounts with high privileges performing file operations on system executables outside normal administrative tasks raise red flags.

  - **Analyze recently modified files:** Check the file creation/modification timestamps for `sethc.exe` and correlating logs indicating operations performed on this file. Unexpected timestamps may suggest exploitation.

  ### Prioritization

  This alert should be treated with high priority due to its potential to expose critical systems to attacker control via unauthorized access. The method leveraged is commonly weaponized in attack strategies, increasing the likelihood of malicious use. The affected system's criticality further enhances the urgency for rapid investigation and response.

  ### Blind Spots and Assumptions

  The detection may miss instances where an attacker uses legitimate administrative credentials to perform actions that mirror this behavior sans logging mechanisms. It’s essential to ensure that Sysmon and Windows Security logging features are enabled for comprehensive visibility. Legitimate OS upgrades or accessibility feature tests might trigger the alert as well. Incorporating companion detections for unusual process creation can enhance overall threat detection capabilities.

