title: Remote Access Tool - ScreenConnect Remote Command Execution
id: b1f73849-6329-4069-bc8f-78a604bb8b23
status: test
description: Detects the execution of a system command via the ScreenConnect RMM service.
references:
- https://github.com/SigmaHQ/sigma/pull/4467
author: Ali Alwashali
date: 2023-10-10
modified: 2024-02-26
tags:
- attack.execution
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\ScreenConnect.ClientService.exe'
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
        # Example:
        #   CommandLine: "cmd.exe" /c "C:\Windows\TEMP\ScreenConnect\23.6.8.8644\3c41d689-bbf5-4216-b2f4-ba8fd6192c25run.cmd"
    CommandLine|contains: '\TEMP\ScreenConnect\'
  condition: all of selection_*
falsepositives:
- Legitimate use of ScreenConnect. Disable this rule if ScreenConnect is heavily used.
# Note: Increase the level if you don't leverage ScreenConnect
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of system commands through the ScreenConnect Remote Management (RMM) service. It monitors for instances where `cmd.exe` is launched as a child process of the ScreenConnect client service, which could signal potential malicious activity, such as an attacker exploiting the remote access tool to execute commands on a system without authorization.

  In a possible threat scenario, an attacker may leverage ScreenConnect to gain unauthorized access to a system, and then use that access to run commands for data exfiltration, lateral movement, or system manipulation. As ScreenConnect is often used for remote support, compromised instances of the application could allow an unauthorized user to perform malicious actions under the guise of technical support.

  This behavior aligns with the MITRE ATT&CK techniques, particularly:
  - **Execution** (T1203) - Exploitation for Client Execution
  - **Command and Control** (T1059.003) - Command and Scripting Interpreter: Windows Command Shell

  The primary data source for this detection rule includes **process creation logs** from Windows systems, specifically focusing on the relationship between parent and child processes.

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate the process creation logs to identify instances of `cmd.exe` being initiated by `ScreenConnect.ClientService.exe`. Look for the corresponding `CommandLine` arguments that may indicate unusual activity.

  - **Analyze CommandLine Arguments**: Examine the `CommandLine` used during the execution of `cmd.exe`. Pay attention to paths that include `\TEMP\ScreenConnect\` and any unusual commands that may suggest misuse of the tool.

  - **Correlate with User Activity**: Cross-reference the timestamps and user accounts associated with the detected command execution with known activities or scheduled maintenance windows to determine if the usage is legitimate or suspicious.

  - **Check for Prior Alerts**: Review historical alerts or incidents related to the use of ScreenConnect to identify patterns of behavior or known compromised credentials that could provide context for the current event.

  ### Prioritization
  The severity of this alert is considered low due to the potential for legitimate use of the ScreenConnect service in an enterprise environment. However, the presence of unauthorized command execution could indicate a serious security event that warrants further investigation.

  ### Blind Spots and Assumptions
  This detection logic may not account for fully legitimate administrative activities where ScreenConnect is frequently used. It assumes that all instances of `cmd.exe` being spawned from ScreenConnect are suspect, which may not always be true. For effective detection, log collection should ensure that process creation logs are enabled and adequately retained for analysis. Additionally, organizations with high legitimate usage of ScreenConnect may experience an increase in false positives, impacting the effectiveness of this rule.

