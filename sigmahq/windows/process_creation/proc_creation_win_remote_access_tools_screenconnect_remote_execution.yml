title: Remote Access Tool - ScreenConnect Remote Command Execution
id: b1f73849-6329-4069-bc8f-78a604bb8b23
status: test
description: Detects the execution of a system command via the ScreenConnect RMM
  service.
references:
- https://github.com/SigmaHQ/sigma/pull/4467
author: Ali Alwashali
date: 2023-10-10
modified: 2024-02-26
tags:
- attack.execution
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\ScreenConnect.ClientService.exe'
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
        # Example:
        #   CommandLine: "cmd.exe" /c "C:\Windows\TEMP\ScreenConnect\23.6.8.8644\3c41d689-bbf5-4216-b2f4-ba8fd6192c25run.cmd"
    CommandLine|contains: '\TEMP\ScreenConnect\'
  condition: all of selection_*
falsepositives:
- Legitimate use of ScreenConnect. Disable this rule if ScreenConnect is heavily
  used.
# Note: Increase the level if you don't leverage ScreenConnect
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of system commands via the ScreenConnect Remote Management (RMM) service by monitoring for the creation of cmd.exe processes with specific command-line parameters originating from ScreenConnect’s client service. The likely attacker objective is to leverage a legitimate remote access tool for unauthorized command execution, potentially leading to system compromise or persistent access. This behavior maps to the MITRE ATT&CK technique for command and scripting interpreter execution (T1059.003).

  The primary telemetry source is Windows process creation events, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If the detected activity is malicious, it can result in unauthorized actions being performed on the system. However, this detection does NOT confirm that the activity is malicious on its own, as ScreenConnect may also be legitimately used.

  ### Investigation Steps

  - **Identify the process creation event:** Examine Security Event ID 4688 or Sysmon Event ID 1 for parent process details. Look for entries where the ParentImage ends with `\ScreenConnect.ClientService.exe` to confirm the relationship between processes.

  - **Review the command line arguments:** Inspect the CommandLine field within the process creation event for patterns including `\TEMP\ScreenConnect\`. This could indicate suspicious use of ScreenConnect for command execution. Legitimate usage will typically not involve obfuscated or irrelevant commands.

  - **Analyze the execution context:** Verify the user account associated with the process. If the account is a standard user with no administrative privileges, further investigation is warranted. Also, check for the legitimacy of the current user’s access to ScreenConnect.

  - **Correlate historical usage of ScreenConnect:** Search for historical logs of ScreenConnect use in the environment to determine baseline behavior (e.g., command execution frequency, types of commands run). Typical use might involve connections for support sessions, not frequent command line executions.

  - **Isolate high-confidence malicious indicators:** Investigate any executions detected that include access to known malicious payloads or that create unexpected files in the TEMP folder. Look for unusual paths or file names that resemble typical ScreenConnect setups.

  - **Validate file creation artifacts if applicable:** Check for temporary files created in `C:\Windows\TEMP\ScreenConnect\` during the same time frame as the suspicious process activity. Validate whether these files were created legitimately (e.g., timestamps, expected file names).

  ### Prioritization

  This alert should be treated with moderate priority, considering the potential impact on sensitive systems if exploitation is attempted. The likelihood of this behavior being part of a broader attack is elevated, given that many adversaries utilize legitimate remote access tools like ScreenConnect for command execution.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative usage of ScreenConnect, which can lead to false positives. Ensure that logs from ScreenConnect and process creation are consistently collected and available for analysis. Common legitimate activities may include simple remote support tasks or software installations executed through ScreenConnect. Companion detections, such as monitoring for suspicious activity in connected sessions or unusual outbound connections from the affected host, could enhance coverage and identification of malicious intent.

