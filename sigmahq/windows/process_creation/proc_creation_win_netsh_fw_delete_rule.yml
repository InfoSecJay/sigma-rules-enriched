title: Firewall Rule Deleted Via Netsh.EXE
id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
status: test
description: Detects the removal of a port or application rule in the Windows 
  Firewall configuration using netsh
references:
- https://app.any.run/tasks/8bbd5b4c-b82d-4e6d-a3ea-d454594a37cc/
author: frack113
date: 2022-08-14
modified: 2025-10-07
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'firewall'
    - 'delete '
  filter_optional_dropbox:
    ParentImage|endswith: '\Dropbox.exe'
    CommandLine|contains: 'name=Dropbox'
  filter_optional_avast:
    ParentImage|endswith: '\instup.exe'
    CommandLine|contains: 'advfirewall firewall delete rule name="Avast Antivirus
      Admin Client"'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activity
- Software installations and removal
level: medium
note: |
  ### Technical Context

  The Sigma rule detects the deletion of firewall rules on Windows systems using the `netsh.exe` command-line utility. This behavior may indicate an attacker’s objective to impair security controls, allowing malicious traffic to pass unimpeded or to manipulate firewall settings for further exploitation. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) with technique ID T1686.003. Primary telemetry sources include Windows Security Event logs (Event ID 4688 for process creation), along with command-line logs if enabled. If malicious, this activity can lead to unimpeded access for attackers, making lateral movement and data exfiltration easier. Importantly, this detection does NOT confirm that the action was malicious on its own, as similar legitimate administrative activities may trigger it.

  ### Investigation Steps

  - **Verify process creation event**: Check Windows Security Event ID 4688 for entries showing `netsh.exe` execution. Confirm the CommandLine fields contain 'firewall' and 'delete.' Analyze the creator user account for signs of privilege escalation.

  - **Examine command-line usage details**: Investigate the complete CommandLine field (Event ID 4688) for phrases like ‘delete rule name=.’ Note the specific rule being deleted; this may indicate targeted behavior. Legitimate activity often discusses referenced rules and context with other admin actions.

  - **Review parent processes**: Identify the parent process of `netsh.exe` for context (e.g., Event ID 4657, indicating changes to indicators). Look for benign parent processes like `cmd.exe` or `powershell.exe`. Any deletion triggered by processes like `Dropbox.exe` or `instup.exe` should be assessed against benign exceptions defined in the rule.

  - **Audit firewall settings post-deletion**: After the detection, review the windows firewall settings using Event ID 2004 or `Get-NetFirewallRule` cmdlet outputs to confirm what rules were deleted. Determine if critical and expected rules were altered, particularly those that relate to sensitive data flows.

  - **Check for other signs of compromise**: If this activity occurs in a significant context, such as alongside other abnormal behavior (e.g., unusual outbound connections, account lockouts), escalate as possible multi-stage attack indicators. Correlate related detections or events from SIEM to build context.

  ### Prioritization

  This alert should be regarded as medium severity due to the potential impact on the security posture of critical systems and the likelihood of exploitation by adversaries to manipulate firewall settings. Defensive measures against this technique are commonly seen in active attacks, making awareness essential.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques, such as renaming `netsh.exe` or the use of alternative command-line interfaces. The effectiveness relies on consistent log collection of process creation and command-line arguments. Legitimate administrative tasks, especially during routine maintenance or software installations, may trigger this alert, emphasizing the need for contextual analysis. Companion detections such as unauthorized application installations or abnormal user account activities (e.g., Event ID 4768) can provide additional context and enhance overall coverage.

