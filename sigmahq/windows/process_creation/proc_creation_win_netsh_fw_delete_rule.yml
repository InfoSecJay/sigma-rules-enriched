title: Firewall Rule Deleted Via Netsh.EXE
id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
status: test
description: Detects the removal of a port or application rule in the Windows 
  Firewall configuration using netsh
references:
- https://app.any.run/tasks/8bbd5b4c-b82d-4e6d-a3ea-d454594a37cc/
author: frack113
date: 2022-08-14
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'firewall'
    - 'delete '
  filter_optional_dropbox:
    ParentImage|endswith: '\Dropbox.exe'
    CommandLine|contains: 'name=Dropbox'
  filter_optional_avast:
    ParentImage|endswith: '\instup.exe'
    CommandLine|contains: 'advfirewall firewall delete rule name="Avast Antivirus
      Admin Client"'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activity
- Software installations and removal
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the deactivation or removal of port or application rules from the Windows Firewall configuration using the `netsh.exe` command-line tool. The likely attacker objective is to lower defenses, enabling easier lateral movement or unauthorized access. The relevant MITRE ATT&CK tactic is **Defense Evasion (T1562)**, with the specific technique being **Modify Firewall Rule (T1562.004)**. Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 for process creation and relevant command-line arguments related to firewall modifications. If malicious, this behavior can severely undermine enterprise security controls. Importantly, this detection does NOT confirm malicious intent without additional context; benign administrative activities may also trigger this alert.

  ### Investigation Steps

  - **Review event logs for process creation:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for instances where `netsh.exe` is executed, particularly with command-line parameters that include ‘firewall delete’.

  - **Inspect command-line arguments:** Look for `CommandLine` entries containing both ‘firewall’ and ‘delete’. Focus on specific rules being deleted to determine if they correspond with known important firewall rules.

  - **Compare against legitimate activities:** Identify patterns of legitimate administrative use, such as scheduled maintenance or software configurations, which may result in similar `netsh.exe` command usage without deletion being involved.

  - **Identify parent process behavior:** Analyze logs to determine the parent process of the `netsh.exe` execution; legitimate commands might often be initiated from administrative tools or scripts. Ensure no unusual parent processes, like `Dropbox.exe` or `instup.exe`, are associated with deletions.

  - **Spot high-confidence malicious indicators:** Look for deletions of critical firewall rules directly related to network perimeter defenses or applications that monitor network traffic, indicating a higher likelihood of malicious intent.

  - **Assess system criticality:** For the affected system, evaluate its role and significance within the network architecture. A server with critical security roles (like a firewall or gateway) being manipulated drastically elevates risk levels.

  ### Prioritization

  This alert is of medium severity due to its potential to facilitate unauthorized access if firewall protections are disabled. The likelihood of malicious abuse is moderate, as such behavior can be associated with lateral movement tactics that adversaries commonly deploy. However, benign administrative actions may also lead to similar alerts.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers utilize alternate methods or tools to modify firewall rules or might be conducted in a stealthy manner. Reliable detection requires comprehensive telemetry from Windows Event Logs; if they are disabled or not captured, detection will be hindered. Routine administrative activities, such as legitimate software updates, may produce similar alerts. Related detections, such as those monitoring changes to group policy objects (GPO) affecting firewall settings, could bolster overall security posture and coverage.

