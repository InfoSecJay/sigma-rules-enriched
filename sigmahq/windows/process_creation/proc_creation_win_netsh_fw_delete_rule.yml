note: |
  ### Technical Context

  This rule detects the deletion of a port or application rule in the Windows Firewall configuration through the use of the `netsh.exe` utility. The likely attacker objective is to weaken defenses by removing firewall rules, potentially to allow unauthorized traffic or to facilitate lateral movement within the network. This is classified under the MITRE ATT&CK tactic **Defense Evasion** (TA0005) and technique **Disable or Modify System Firewall** (T1686.003).

  The primary telemetry sources include process creation logs, specifically from the Windows Security Event ID 4688 and Sysmon Event ID 1, detailing command-line invocations. If malicious, this activity could lead to heightened risk for the affected system, compromising its security posture. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative actions could cause similar logs.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for `netsh.exe` execution. Focus on the presence of "firewall delete" in the CommandLine field.

  - **Assess command context:** Analyze the full CommandLine for suspicious arguments or unusual parent processes that might suggest an attacker is executing the command as part of malicious behavior rather than legitimate administration.

  - **Identify benign activity:** Verify whether `netsh.exe` was executed during legitimate administrative tasks, such as scheduled maintenance or firewall configuration changes. Look for other logs or documentation supporting standard operations.

  - **Correlate with network activity:** Utilize network monitoring tools to check for unusual inbound or outbound traffic coinciding with the timing of the firewall rule deletion. Look for access attempts that align with the time of deletion, which may indicate a breach.

  - **Highlight high-confidence indicators:** Look for unusual parent processes such as `Dropbox.exe` or `instup.exe` with command lines related to deleting a firewall rule. This context can indicate potential evasion techniques utilized by attackers.

  ### Prioritization

  This alert is of medium severity. The impact is notable, especially if the affected system is critical to operations or handles sensitive data. The likelihood of malicious abuse is moderate, as attackers often exploit this technique to disable critical defenses. Additionally, the method of using `netsh.exe` to manipulate firewall settings is a known adversary behavior.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where the attacker uses alternative command-line utilities or scripts to manipulate firewall rules. For reliable detection, ensure that logging is enabled for command-line arguments and that Sysmon is deployed across endpoints. Legitimate activities such as software installations or legitimate administrative tasks may trigger this alert. Companion detections could include monitoring for unexpected service creation or modifications to firewall logging events.

