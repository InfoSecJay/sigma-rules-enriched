title: Firewall Rule Deleted Via Netsh.EXE
id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
status: test
description: Detects the removal of a port or application rule in the Windows Firewall
  configuration using netsh
references:
- https://app.any.run/tasks/8bbd5b4c-b82d-4e6d-a3ea-d454594a37cc/
author: frack113
date: 2022-08-14
modified: 2025-10-07
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'firewall'
    - 'delete '
  filter_optional_dropbox:
    ParentImage|endswith: '\Dropbox.exe'
    CommandLine|contains: 'name=Dropbox'
  filter_optional_avast:
    ParentImage|endswith: '\instup.exe'
    CommandLine|contains: 'advfirewall firewall delete rule name="Avast Antivirus
      Admin Client"'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activity
- Software installations and removal
level: medium
note: |
  ### Technical Context
  This rule detects the use of the `netsh.exe` command-line tool to remove firewall rules on a Windows system. Specifically, it identifies the command execution patterns that suggest an attacker might be manipulating the firewall configurations to evade detection or to allow malicious traffic. The likely threat scenario involves an attacker gaining access to a system (either through initial access techniques or post-exploitation) and subsequently altering firewall settings to silence defenses, potentially facilitating lateral movement or data exfiltration.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), specifically the technique **T1562.004: Impair Defenses**. This technique involves disabling or circumventing security mechanisms, and in this context, deleting firewall rules significantly impacts the organization's ability to detect or block malicious activities. In terms of data sources, primary telemetry includes **process creation events** that capture the execution of commands and related parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs that track process creation on endpoints to identify instances of `netsh.exe` being executed along with command-line arguments that include "firewall" and "delete". This will help pinpoint potential incidents of rule deletions.
  - **Examine Firewall Logs**: Check Windows Firewall logs to detect any discrepancies in firewall rules or unusual traffic that may result from the deletion of rules. Look for logs indicating the addition or removal of rules that deviate from standard operating procedures.
  - **Identify Suspicious Parent Processes**: Investigate the parent processes associated with `netsh.exe` executions, particularly any instances involving known applications (e.g., Dropbox or Avast). Assess whether these executions are contextually appropriate or indicative of suspicious activity.
  - **Correlate with User Behavior**: Cross-reference user behavior and access logs during the timeframe of the potential rule deletion to establish whether legitimate administrative activity coincided with the suspicious firewall manipulation. Identify any anomalous user actions.

  ### Prioritization
  This alert is assigned a medium severity due to the significant implications of unauthorized firewall modifications in an enterprise environment. The ability of an attacker to alter firewall rules increases the likelihood of successful data breaches or lateral movement, making it a critical area for monitoring.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of unauthorized firewall rule deletions, especially if attackers employ alternative methods or tools that do not involve `netsh.exe`. The effectiveness of this rule assumes that logging for process creation is enabled and that logs are retained for a sufficient period. Additionally, legitimate administrative activities could produce false positives, as there are valid scenarios for modifying firewall rules within the organization. It is essential to have comprehensive monitoring and established baseline configurations to mitigate these risks.

