detection:
  selection_img:
  - Image|endswith: '\dism.exe'
  - OriginalFileName: 'DISM.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'WindowsPowerShellWebAccess'
    - '/online'
    - '/enable-feature'
  condition: all of selection_*
falsepositives:
- Legitimate PowerShell Web Access installations by administrators
level: high
note: |
  ### Technical Context
  This detection rule identifies the enabling of the PowerShell Web Access feature using the Deployment Image Servicing and Management (DISM) tool on Windows systems. PowerShell Web Access allows administrators to run PowerShell commands remotely, but when improperly configured, it can be exploited by attackers to gain unauthorized remote access to systems—potentially leading to further compromise or lateral movement within an enterprise environment.

  Attackers may enable this feature to establish persistence and facilitate command and control (C2) operations, leveraging it to execute malicious scripts and commands remotely. The tactics and techniques relevant to this detection include **Persistence (T1548.002)**, where attackers establish mechanisms to maintain access, and **Defense Evasion (T1562)**, as enabling remote access can help evade detection by traditional security measures.

  The primary data sources for this detection are process creation events that capture command line arguments associated with processes, specifically for `dism.exe`. Monitoring these logs allows analysts to identify suspicious usage patterns and correlating actions related to this potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine the logs for `dism.exe` processes, focusing on the command line arguments to identify entries where the feature `WindowsPowerShellWebAccess` is enabled.
  - **Analyze Related Command History**: Investigate whether other commands related to remote management or session initiation were executed around the same time, indicating potential escalation or lateral movement activity.
  - **Correlate User Activity**: Check for the user account associated with the `dism.exe` execution. Determine if the user had legitimate reasons to enable PowerShell Web Access or if their account shows signs of compromise.
  - **Inspect System Configuration**: Evaluate the system’s PowerShell Web Access configuration, including any changes made to the settings or permissions, to ascertain if it aligns with organizational policies or indicates unauthorized adjustments.

  ### Prioritization
  This alert carries a high severity due to the critical nature of remote access capabilities that PowerShell Web Access provides; unauthorized enabling can significantly increase the risk of an attacker maintaining persistence and executing further malicious actions in the environment.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection rule is the possibility of legitimate administrative actions that may produce similar alerts, as authorized personnel might enable this feature for appropriate business needs. The detection logic assumes that any use of DISM with `WindowsPowerShellWebAccess` is potentially malicious, which could lead to false positives. To enhance detection accuracy, it is essential to have comprehensive logging enabled for process creation events and potentially to correlate these alerts with user context or historical activity to avoid misattributions.

