note: |
  ### Technical Context

  This Sigma rule detects the use of the Deployment Image Servicing and Management (DISM) tool to enable the PowerShell Web Access feature on Windows systems. The primary objective of an attacker leveraging this capability may include establishing remote access for subsequent exploitation or lateral movement in the environment. This behavior falls under the MITRE ATT&CK tactics of Persistence (TA0003) and Privilege Escalation (TA0004), specifically the technique of "Enable Windows Optional Features" (T1548.002).

  The primary telemetry source for this detection is process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1. If malicious, enabling PowerShell Web Access could allow unauthorized access to the system, posing a significant security risk. However, it is crucial to note that this detection alone does not confirm malicious intent, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Identify the triggering process:** Review Security Event ID 4688 or Sysmon Event ID 1 for dism.exe executions. Check the CommandLine field for the presence of 'WindowsPowerShellWebAccess', '/online', and '/enable-feature' to confirm the specific action that triggered the alert.

  - **Assess the user account:** Investigate the user account that executed the DISM command. Legitimate administrative accounts may use this process appropriately, while anomalous accounts or unexpected execution times may indicate potential compromise.

  - **Review system configuration:** Check the system settings for the status of PowerShell Web Access. Use the Get-PswaWebAccess function to validate if the feature has been enabled recently, confirming whether this behavior is consistent with expected administrative tasks.

  - **Correlate with other logs:** Cross-reference this activity with related log sources, such as Windows Event ID 4700 (User Account Management) or Windows Firewall logs, to identify any associated outbound connections or attempts to access the system remotely.

  - **Look for high-confidence indicators:** Identify any instances of unusual network traffic to the system after the feature was enabled, focusing on external IP addresses or unexpected protocols. This serves as a strong indicator of potential malicious abuse.

  ### Prioritization

  This alert is considered high severity due to the potential impact of unauthorized remote access to the system, which could facilitate further attacks. The likelihood of this behavior being weaponized is high, as attackers often exploit remote management tools for persistence and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative usage of DISM for PowerShell Web Access installation, which could lead to false positives. Reliable detection requires proper logging configurations for process creation and command-line arguments. Additionally, PowerShell Web Access could be enabled for troubleshooting or maintenance; thus, normal administrative tasks should be documented. A related detection focusing on outbound network connections (e.g., suspicious IP access logs) would enhance coverage and context for this alert.

