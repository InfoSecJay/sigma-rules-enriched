detection:
  selection_img:
  - Image|endswith: '\dism.exe'
  - OriginalFileName: 'DISM.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'WindowsPowerShellWebAccess'
    - '/online'
    - '/enable-feature'
  condition: all of selection_*
falsepositives:
- Legitimate PowerShell Web Access installations by administrators
level: high
note: |
  ### Technical Context

  This rule detects the enabling of the PowerShell Web Access feature via the Deployment Image Servicing and Management (DISM) tool, which can be exploited by attackers to gain remote administrative access to a system. The primary objective of an attacker enabling this feature would be to create a backdoor for persistent access or to facilitate lateral movement within the network. This behavior maps to MITRE ATT&CK tactic **Privilege Escalation** (TA0004) with the technique **Enable Remote Access via PowerShell Web Access** (T1548.002).

  The primary telemetry source is process creation logs from Windows, specifically looking for events related to DISM execution. If malicious, this action could allow an adversary to circumvent security controls and maintain persistence. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger this alert.

  ### Investigation Steps

  - **Check for DISM execution details:** Review Security Event ID 4688 for any execution of ‘dism.exe’ and confirm the CommandLine contains ‘/enable-feature’ and ‘WindowsPowerShellWebAccess’. Look for indicators of unauthorized use, such as unusual execution context or timings outside of normal admin hours.

  - **Correlate with user activity:** Examine logins (Event ID 4624) and correlate timestamps with the DISM execution. If the user is not an admin or is showing suspicious behavior, increases the likelihood of malicious activity.

  - **Identify existing PowerShell Web Access features:** Validate if PowerShell Web Access was previously enabled and check the configurations. Inspect the IIS logs to see if the Web Access service (URL access) has been established in recent sessions, indicating probable misuse.

  - **Analyze changes in system configurations:** Review Event ID 60000 (Windows PowerShell Web Access configuration changes) to identify changes made to web access settings. Legitimate activity may include recent updates by a recognized administrator in maintenance periods.

  - **Monitor for subsequent access attempts:** Look for further PowerShell activity related to remote access (Event ID 4104 for transcripts) or unusual authenticated requests in the system logs, signalling potential follow-on actions by an attacker.

  ### Prioritization

  This alert warrants high priority attention as it involves changes that could heighten the risk of unauthorized remote access to critical systems. The likelihood of malicious abuse is significant since the feature, if improperly enabled, can be weaponized to facilitate comprehensive access throughout the enterprise.

  ### Blind Spots and Assumptions

  Detection may miss situations where logs have been disabled or where legitimate administrative actions occur in high-volume environments. The accuracy of this alert is contingent on proper audit log configurations for process execution. It’s also important to note that legitimate administrative actions, such as planned deployments or maintenance efforts, may trigger this detection. Companion detections related to unauthorized remote sessions or privilege escalation attempts can enhance visibility and response capabilities.

