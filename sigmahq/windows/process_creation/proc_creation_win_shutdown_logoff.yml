note: |
  ### Technical Context

  This rule detects the execution of the `shutdown.exe` command with the `/l` parameter, which logs off the current user. This action, though potentially legitimate, is unusual and may indicate unauthorized attempts to disrupt user activity or process access. The likely attacker objective includes evading detection by masking malicious activity under a common administrative function. This behavior relates to the MITRE ATT&CK tactic "Impact" (TA0006) and technique "Remote System Logoff" (T1529). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide data on executed processes and their command lines. If malicious, the security impact could include potential data exfiltration or disruption of services. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; further investigation is required.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the process `shutdown.exe` with `/l` in the CommandLine field. Look for anomalies in execution time or user accounts.

  - **Inspect execution context:** Validate the user account and privileges under which the command was executed. Legitimate users typically execute logoff commands through user interface interactions, not command line.

  - **Assess system criticality:** Evaluate the role of the affected system. If it's a critical server, unauthorized logoffs could present a higher risk compared to non-critical workstation activity.

  - **Review other related commands:** Look for adjacent command execution or unusual command line arguments in the log source. Multiple suspicious commands executed in sequence may indicate a malicious workflow.

  - **Confirm user and session activity:** Cross-reference with user activity logging to determine if the logoff was initiated by the user via standard means or if it seems incongruent with user behavior patterns.

  ### Prioritization

  This alert has medium severity due to the potential impact on user productivity and system operations. While logging off a user may not directly compromise security, it can signify preparatory steps for more malicious actions, especially if done unexpectedly or without user knowledge.

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses different methods to log off users, such as employing scripting tools that don’t utilize `shutdown.exe`. Adequate logging configurations for process creation must be in place to ensure reliable detection. Legitimate administrative activities, such as scheduled maintenance or user assistance, may also trigger this alert. A companion detection for unusual remote desktop session activity could strengthen this coverage by identifying potential preparatory staging for malicious logoff actions.

