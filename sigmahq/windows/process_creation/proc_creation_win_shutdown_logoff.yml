note: |
  ### Technical Context
  This detection rule identifies the use of the `shutdown.exe` command-line tool with the `/l` argument, which is employed to log off a user. While legitimate users may use this command occasionally, its rare execution in an enterprise environment could indicate suspicious behavior, particularly if it coincides with other anomalous activities or occurs without a clear user intent. Attackers may leverage this command to hinder incident response efforts or disrupt user sessions while they attempt to carry out malicious activities.

  The relevant MITRE ATT&CK tactics include **Impact (TA0040)**, particularly focusing on the technique **System Shutdown/Reboot (T1529)**. This represents a direct attempt to disrupt availability by logging off users and could be part of a broader attack strategy that seeks to evade detection or allow for additional malicious actions to occur without interruption.

  Primary data sources for detecting this activity will include process creation events from the endpoint detection system logs, which can provide insights into the execution of the command alongside any associated user contexts or other executed commands that might indicate malicious intent.

  ### Investigation Steps
  - **Query Process Creation Logs:** Review the process creation logs to identify instances of `shutdown.exe` being executed with the `/l` argument. Pay attention to the user account that initiated the command and the context in which it was run.

  - **Analyze User Activity:** Investigate the activity of the associated user before and after the shutdown command was executed. Look for any suspicious actions such as privilege escalation attempts, unusual process executions, or other commands that might indicate a compromise.

  - **Check for Contextual Anomalies:** Examine related event logs for any unusual patterns or anomalies occurring around the same time as the `shutdown.exe` execution, such as unrecognized remote logins, unexpected application behavior, or simultaneous connection attempts from unusual locations.

  - **Correlate with Endpoint EDR Data:** If available, correlate findings with any data from EDR solutions to identify other malicious indicators or activities tied to the system where the command was executed, including additional command-line activities or indicators of lateral movement.

  ### Prioritization
  This alert is classified as medium severity due to its potential to disrupt user activities and facilitate further malicious actions. While the execution of this command might appear benign in isolation, its rarity in enterprise environments elevates its significance, warranting immediate investigation.

  ### Blind Spots and Assumptions
  The detection rule may miss execution if the attacker employs alternate methods to log off users, such as using scripts that do not directly call `shutdown.exe`. Additionally, the detection is predicated on the assumption that logging of process creation is enabled across all endpoints within the environment. If logging configurations are incomplete or inconsistent, this alert may not function as intended, leading to gaps in visibility around potentially malicious actions.

