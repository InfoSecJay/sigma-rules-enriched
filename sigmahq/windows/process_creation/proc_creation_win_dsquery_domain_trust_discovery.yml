note: |
  ### Technical Context

  This Sigma rule detects the execution of `dsquery.exe` for domain trust discovery, a behavior typically employed by attackers to enumerate domain trusts and assess an organization's Active Directory (AD) configuration. The main objective of this activity is to gather intelligence about inter-domain trust relationships, which can be exploited for lateral movement and privilege escalation in a targeted network environment. This activity aligns with the MITRE ATT&CK tactic of Discovery (TA0007) and technique T1482: Domain Trust Discovery.

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring Event ID 4688 or Sysmon Event ID 1, which provide insights into process execution details, including the command line arguments. Malicious exploitation of this detection can lead to the compromise of trust relationships, allowing attackers to escalate privileges or access sensitive resources across trusted domains. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative activities can trigger similar alerts.

  ### Investigation Steps

  - **Check the command line arguments:** View Event ID 4688 for `dsquery.exe` execution and confirm if it includes `trustedDomain`. Investigate the context of the execution to determine if it aligns with legitimate administrative tasks.

  - **Identify the user context:** Review the User SID or account name associated with the detected `dsquery.exe` execution. Legitimate domain administrators may have run this command during scheduled maintenance or a security assessment.

  - **Examine the execution time and frequency:** Look for patterns in the execution times of `dsquery.exe`. Frequent execution by the same user or account outside of normal business hours can indicate malicious activity.

  - **Cross-reference with known legitimate usage:** Compare the instances of `dsquery.exe` execution with documented scheduled administrative tasks or security assessments. Reasonable adjustments to domain trusts are expected during certain IT operations.

  - **Analyze group membership:** Investigate the group memberships of the user responsible for executing `dsquery.exe`. Users in the Domain Admins group executing this query might warrant deeper investigation for potential misuse.

  - **Look for related suspicious activity:** Review for other process creation events (Event ID 4688) within a short timeframe before or after `dsquery.exe` execution that might indicate follow-up actions (e.g., lateral movement tools or other enumeration commands).

  ### Prioritization

  This alert should be treated as medium priority due to the potential impact on the organization's security posture through exposure of sensitive domain relationships, which could be exploited for lateral movement. The likelihood of malicious abuse is significant, as similar activities are commonly observed in unauthorized access scenarios.

  ### Blind Spots and Assumptions

  Detection can be limited by the absence of correct logging or if dsquery activity is masked by legitimate administrative workflows. Legitimate users running dsquery for security assessments or maintenance tasks may inadvertently trigger this alert. Companion detections, such as monitoring for unusual authentication or enumeration behaviors (like LDAP queries), can strengthen coverage of potential malicious activities surrounding domain trust enumeration.

