note: |
  ### Technical Context
  This detection rule identifies the execution of `dsquery.exe`, a legitimate Windows command-line utility used for querying Active Directory (AD). The purpose of monitoring this activity specifically pertains to domain trust discovery, which may indicate an attacker attempting to gather information about Trust Relationships between domains in an Active Directory environment. This can be an initial step for lateral movement or privilege escalation, where an adversary aims to map the domain structure and identify potential targets.

  The relevant MITRE ATT&CK tactics for this activity include **Discovery** (TA0007) and the technique **Domain Trust Discovery** (T1482). Attackers leveraging this method typically aim to expand their access across trusted domains or systems, finding weakness or further credentials to exploit. The primary data sources for detecting this behavior are **process creation events**, where the execution of `dsquery.exe` is logged, and **command line arguments** that can reveal the intent behind the execution, often focusing on the inclusion of the term 'trustedDomain'.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any instances of `dsquery.exe` being executed. Pay special attention to the context of execution, such as whether this occurs during unusual hours or by unexpected user accounts.
  - **Analyze Command Line Parameters**: Focus on command line arguments associated with `dsquery.exe`. Any appearance of 'trustedDomain' within the commands should be closely scrutinized for suspicious behavior or context.
  - **Correlate with User Activity**: Identify the user accounts that initiated the `dsquery.exe` commands. Evaluate their role and activity on the network for any deviations from expected use patterns, especially regarding domain trust inquiries.
  - **Check for Lateral Movement**: Investigate additional network logs for any follow-up queries or connections made towards trusted domains. Look for signs of lateral movement, such as authentication attempts or file shares accessed in other domains.

  ### Prioritization
  This alert is assigned a medium severity level due to the potential for significant impact if an attacker successfully avails themselves of information regarding domain trusts, which can enable them to further infiltrate the network. The likelihood of encountering this behavior is concerning given the regular usage of `dsquery.exe` by administrators for legitimate purposes, necessitating a careful review of contextual legitimacy.

  ### Blind Spots and Assumptions
  This detection may not capture activities where the command execution is obfuscated or executed by something other than `dsquery.exe`, such as scripts that call the command indirectly. It assumes that process creation logs are consistently generated and retained within the environment; thus, any gaps or misconfigurations in logging settings may lead to missed detections. Additionally, high volumes of legitimate `dsquery.exe` usage could introduce noise, necessitating effective context gathering to differentiate malicious use from normal administrative tasks.

