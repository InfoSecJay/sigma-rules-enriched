  ---

  ### Technical Context

  This rule detects instances of User Account Control (UAC) bypass by monitoring the execution of `werfault.exe` when launched by `consent.exe` with high or system integrity levels. The behavior indicates an attempt by an attacker to escalate privileges and execute code with elevated permissions, potentially leading to further system compromise. This tactic is aligned with the MITRE ATT&CK framework under the tactic "Defense Evasion" and technique "Bypass User Account Control" (T1548.002).

  The primary telemetry sources for this detection include process creation events from Windows Security Event ID 4688 or Sysmon Event ID 1, specifically monitoring for the listed parent and child process relationships. A successful UAC bypass can significantly impact the security posture of the environment, allowing attackers to perform unauthorized actions, access sensitive data, or modify system configurations. Importantly, this detection does NOT confirm malicious activity on its own; it indicates behavior that requires further investigation.

  ---

  ### Investigation Steps

  - **Review process relationships:** Examine Event ID 4688 for process creation logs to confirm if `werfault.exe` is started by `consent.exe` on affected systems. Confirm that the ParentImage field aligns with `consent.exe`.

  - **Check for high integrity levels:** Identify the IntegrityLevel of `werfault.exe` in the same event logs. The presence of values such as 'High' or 'System' suggests potential misuse. Look for a complete absence of legitimate use for this process configuration in your environment.

  - **Analyze command line arguments:** Investigate logs for any command line parameters associated with `werfault.exe`. Unusual or non-standard arguments may indicate an attempt to exploit the UAC bypass technique.

  - **Identify legitimate activity:** Determine if `werfault.exe` typically operates in your environment without obvious elevation from `consent.exe`, such as not being used by administrators, to establish a baseline for expected use.

  - **Correlate with other alerts:** Search for other related alerts around the same time (e.g., concerning privilege escalation attempts) to identify patterns or related attack behaviors, strengthening the investigation context.

  ---

  ### Prioritization

  This alert should be treated with high severity, particularly if it affects critical assets or servers with administrative access. The likelihood of malicious abuse is significant as UAC bypass techniques are commonly used in sophisticated attacks, thus warranting urgent investigation.

  ---

  ### Blind Spots and Assumptions

  The rule may have limitations due to legitimate software or administrative tools that trigger similar patterns during normal operations. Ensure that the logging configuration captures all necessary process creation events, as inadequate log settings could prevent detection. Additionally, this technique may be used alongside other methods of privilege escalation, so consider companion detections like those monitoring other UAC bypass techniques or unusual account activities that elevate permissions.

