note: |
  ### Technical Context
  This rule detects potential attempts at User Account Control (UAC) bypass through the use of `consent.exe` and `werfault.exe` processes, which are indicative of tactics used by attackers to escalate privileges without the expected level of user consent. The observed behavior suggests that an attacker may be trying to execute malicious code or commands under elevated permissions by abusing legitimate system processes, which is a common method in post-exploitation scenarios.

  The likely objectives of such an attack include gaining unauthorized access to sensitive system functionalities, executing arbitrary code, or exfiltrating data with elevated privileges while avoiding detection. This technique falls under the **Defense Evasion** and **Privilege Escalation** tactics from the MITRE ATT&CK framework, specifically utilizing technique **T1548.002** (Bypass User Account Control).

  The primary data sources for this detection are logs capturing process creation events, specifically focusing on the use of `ParentImage`, `Image`, and `IntegrityLevel` attributes to identify irregularities in process execution that may indicate privilege escalation attempts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for entries where `ParentImage` ends with `\consent.exe` and `Image` ends with `\werfault.exe`. Pay special attention to the associated `IntegrityLevel`, ensuring it matches expected values (i.e., High or System).

  - **Analyze Parent-Child Process Relationships:** Investigate the process tree to identify suspicious parent-child relationship patterns indicative of exploitation attempts. Look for chains leading back to `consent.exe` with unexpected child processes.

  - **Correlate with User Activity:** Assess the context of user activity around the time of the alert. Look for unexpected logins or administrative actions that could coincide with the detected UAC bypass.

  - **Check for Recent Changes in Privileges:** Audit any recent changes to administrative privileges or group memberships that coincide with the detection timeframe, as these could provide insights into broader attack narratives.

  ### Prioritization
  The alert is classified as high severity due to the critical nature of privilege escalation attacks, which can lead to extensive system compromise and data breaches within an enterprise environment. Given the method's stealthy nature, it is crucial to investigate potential incidents promptly.

  ### Blind Spots and Assumptions
  This detection logic may not capture all variations of UAC bypass techniques, which could lead to false negatives if attackers employ less common methods or custom obfuscations. The detection assumes that standard Windows processes will be used in their typical forms and that logs capturing process creation events are enabled and properly configured on all monitored endpoints. Without comprehensive logging of all process activities, there may be significant blind spots in identifying these exploit attempts.

