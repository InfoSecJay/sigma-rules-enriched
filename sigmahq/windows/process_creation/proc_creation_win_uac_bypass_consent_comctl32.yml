note: |
  ### Technical Context

  This Sigma rule detects the abuse of User Account Control (UAC) via the `consent.exe` process, initiating `werfault.exe` at high or system integrity levels. This behavior indicates an attempt to escalate privileges without user consent, aligning with adversaries' objectives to gain unauthorized access to elevated system capabilities. It is relevant to the MITRE ATT&CK tactic of **Privilege Escalation** and technique **T1548.002 - UAC Bypass**. Primary telemetry comes from Windows process creation logs detailing the parent process and the initiated child process, specifically `Event ID 4688` for process creation. If malicious, this behavior could allow attackers to execute arbitrary code with elevated privileges. However, this detection does NOT confirm whether the executed process was indeed malicious or intended for legitimate use.

  ### Investigation Steps

  - **Review process creation details:** Examine `Event ID 4688` for entries where `ParentImage` ends with `\consent.exe` and `Image` ends with `\werfault.exe`. Assess if any legitimate applications were initiating these processes.

  - **Confirm integrity level:** Check the `IntegrityLevel` field in the process creation logs; legitimate processes usually do not run at **High** or **System** levels without valid reasons. Look for `S-1-16-16384` or `S-1-16-12288` level entries.

  - **Correlate timestamps:** Investigate the activity leading up to the alert and review other related process creation logs for suspicious behavior or patterns occurring around the same time. Malicious indicators typically occur alongside other exploitation tactics.

  - **Identify user context:** Analyze the user account initiating the action. Legitimate administrative users may trigger this behavior but require further validation. Note unusual user accounts performing activities typical of higher privilege escalation.

  - **Check for process hierarchies:** Use Sysinternals tools (e.g., Process Explorer) to visualize the parent-child relationship of processes. Malicious use often showcases an unusual chaining from `consent.exe` to `werfault.exe`.

  ### Prioritization

  This alert is high severity due to the potential for an attacker to gain elevated privileges, which can lead to significant damage or compromise across critical systems. The presence of `consent.exe` and `werfault.exe` in this context is uncommon and suggests a strong likelihood of exploitation by adversaries familiar with UAC bypass techniques.

  ### Blind Spots and Assumptions

  This detection is limited by the reliance on specific processes and may miss evasion through alternate UAC bypass methods or tools that do not utilize `consent.exe`. Reliable detection requires auditing Windows process creation logs and ensuring no filtering is applied to these entries. Legitimate software installations or updates may inadvertently trigger this alert, so contextual awareness is crucial. Companion detections such as monitoring for unusual command line arguments in elevated processes can help strengthen overall detection capabilities.

