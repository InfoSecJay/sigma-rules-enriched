note: |
  ### Technical Context

  This Sigma rule detects a potential User Account Control (UAC) bypass technique involving `consent.exe` and `werfault.exe`, which may indicate an attempt to escalate privileges on a Windows system. The attacker’s objective is likely to execute unauthorized code with elevated privileges without user consent. This behavior correlates with the MITRE ATT&CK tactics of Defense Evasion (T1211) and Privilege Escalation (T1548.002).

  The primary telemetry source is process creation logs, specifically from Windows, captured through Security Event ID 4688. If the bypass is successful, it may lead to unauthorized system changes and data exposure, significantly impacting organizational security. It is essential to note that this detection does NOT confirm a successful attack on its own; it merely indicates a suspicious process creation sequence that requires further investigation.

  ### Investigation Steps

  - **Review process creation events:** Examine Security Event ID 4688 for the process creation details, focusing on entries where the `ParentImage` ends with `consent.exe` and `Image` ends with `werfault.exe`. Look for high or system integrity levels (SIDs: S-1-16-16384, S-1-16-12288).

  - **Identify common legitimate usage:** Note that `consent.exe` is normally invoked when legitimate software installations or updates are occurring. Check for typical software installs around the alert timestamp that could have triggered this behavior legitimately.

  - **Check for high-confidence indicators:** Validate if the process was created on a critical asset (e.g., domain controllers, admin workstations). Any instance of unexpected high-integrity processes initiated by `consent.exe` without an authorized installation process is a strong indicator of potential malicious activity.

  - **Correlate with additional logs:** Investigate Sysmon Event ID 1 for `werfault.exe` to provide context on when this application was executed and any associated parent processes to understand the flow of execution.

  - **Assess user privileges:** Determine the account used during the UAC bypass attempt. Analyze Event ID 4732 (Group Membership) to identify whether the account belongs to a privileged group which may enhance the risk.

  ### Prioritization

  This alert is high severity due to the potential for privilege escalation on sensitive systems. The likelihood of malicious abuse is significant as UAC bypass techniques are often weaponized in attacks targeting Windows environments. Successful exploitation could allow attackers to gain elevated privileges, leading to extensive damage.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for sophisticated evasion techniques, including using signature-less malware or legitimate administrative tools that could replicate the observed behavior. Complete logging from Windows security auditing must be enabled for proper detection. Legitimate actions like software updates or system repairs involving `consent.exe` could trigger alerts, leading to false positives. Companion detections involving unusual network activity post-incident (e.g., internal lateral movement via Windows Remote Management) could strengthen coverage against such techniques.

