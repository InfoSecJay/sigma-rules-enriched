title: Suspicious PowerShell Parent Process
id: 754ed792-634f-40ae-b3bc-e0448d33f695
related:
- id: 692f0bec-83ba-4d04-af7e-e884a96059b6
  type: derived
status: test
description: Detects a suspicious or uncommon parent processes of PowerShell
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=26
author: Teymur Kheirkhabarov, Harish Segar
date: 2020-03-20
modified: 2023-02-04
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
  - ParentImage|contains: 'tomcat'
  - ParentImage|endswith:
    - '\amigo.exe'
    - '\browser.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\httpd.exe'
    - '\iexplore.exe'
    - '\jbosssvc.exe'
    - '\microsoftedge.exe'
    - '\microsoftedgecp.exe'
    - '\MicrosoftEdgeSH.exe'
    - '\mshta.exe'
    - '\nginx.exe'
    - '\outlook.exe'
    - '\php-cgi.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\safari.exe'
    - '\services.exe'
    - '\sqlagent.exe'
    - '\sqlserver.exe'
    - '\sqlservr.exe'
    - '\vivaldi.exe'
    - '\w3wp.exe'
  selection_powershell:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - CommandLine|contains:
    - '/c powershell'            # FPs with sub processes that contained "powershell" somewhere in the command line
    - '/c pwsh'
  - Description: 'Windows PowerShell'
  - Product: 'PowerShell Core 6'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  condition: all of selection_*
falsepositives:
- Other scripts
level: high
note: |
  ### Technical Context
  This rule detects instances where a PowerShell process is spawned with a suspicious or uncommon parent process. PowerShell is a powerful scripting environment that is often misused by attackers to execute malicious commands, download additional payloads, or exfiltrate data. By monitoring the parent processes, this detection rule aims to uncover potential misuse of PowerShell initiated by less common applications (like web servers or email clients) which aren't typically associated with initial PowerShell launches.

  Attackers may exploit PowerShell to execute commands and payloads after previously gaining access to the system through vulnerabilities or social engineering. Common objectives include implementing persistence, lateral movement, or executing remote commands. Highlighted MITRE ATT&CK techniques include "Execution" (T1059.001: PowerShell), as the detection focuses on how malicious actors may initiate PowerShell from unexpected sources.

  The primary data sources for this detection will be process creation events on Windows systems, providing visibility into what processes are spawning PowerShell and their parent processes.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine process creation logs to identify the unusual parent processes that initiated PowerShell. Focus on the complete command line and associated metadata to determine context.
  - **Analyze Parent Process Behavior:** Investigate the parent processes (such as `httpd.exe`, `nginx.exe`, or other uncommon executors) for previous activity and determine if they are legitimate or have been compromised.
  - **Check Command Line Details:** Look for specific command line arguments used with PowerShell that may indicate malicious intent, like downloading scripts or executing obfuscated commands.
  - **Correlate with Threat Intelligence:** Compare findings against threat intelligence reports to see if the identified parent processes have been previously associated with known malicious activities.

  ### Prioritization
  Due to the potential for significant threat impact and the ability of PowerShell to perform malicious actions silently, alerts triggered by this detection are considered high severity. The likelihood of exploitation is notable given the prevalence of PowerShell in enterprise environments.

  ### Blind Spots and Assumptions
  One detection gap is the reliance on the parent processes being truly uncommon; legitimate applications may also spawn PowerShell in valid scenarios, potentially generating false positives. The detection logic assumes that process creation data is accurately logged, and there are no missing records. For optimal coverage, ensure that process creation logging is enabled at the appropriate verbosity in event logging settings.

