logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
  - ParentImage|contains: 'tomcat'
  - ParentImage|endswith:
    - '\amigo.exe'
    - '\browser.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\httpd.exe'
    - '\iexplore.exe'
    - '\jbosssvc.exe'
    - '\microsoftedge.exe'
    - '\microsoftedgecp.exe'
    - '\MicrosoftEdgeSH.exe'
    - '\mshta.exe'
    - '\nginx.exe'
    - '\outlook.exe'
    - '\php-cgi.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\safari.exe'
    - '\services.exe'
    - '\sqlagent.exe'
    - '\sqlserver.exe'
    - '\sqlservr.exe'
    - '\vivaldi.exe'
    - '\w3wp.exe'
  selection_powershell:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - CommandLine|contains:
    - '/c powershell'            # FPs with sub processes that contained "powershell" somewhere in the command line
    - '/c pwsh'
  - Description: 'Windows PowerShell'
  - Product: 'PowerShell Core 6'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  condition: all of selection_*
falsepositives:
- Other scripts
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell initiated by suspicious or uncommon parent processes, such as web browsers or server applications. Attackers often leverage PowerShell to execute malicious code, usually aiming to deploy malware, exfiltrate data, or conduct lateral movement within the network. The relevant MITRE ATT&CK tactic is "Execution," specifically technique T1059.001 (PowerShell).

  The primary telemetry sources required for this detection are Windows process creation logs, specifically Event ID 4688, which records every instance of process creation and includes details about the parent process. If this behavior is malicious, it can lead to severe security breaches, including unauthorized access to sensitive systems and data. This detection does NOT confirm an attack on its own; further investigation is required to assess the context and intent behind the PowerShell execution.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for any PowerShell processes (`powershell.exe` or `pwsh.exe`) with uncommon parent processes like `tomcat.exe`, `chrome.exe`, or `mshta.exe`. Look for indicators of initial compromise or lateral movement.

  - **Examine command line arguments:** In the logs, focus on the CommandLine field for signs of malicious intent, such as arguments containing `/c powershell`. Legitimate user activity may have benign commands that do not include suspicious objectives like script execution.

  - **Investigate parent process behavior:** Confirm the legitimacy of the parent process. For example, if `chrome.exe` is executing PowerShell, analyze the user context and correlating application behavior to determine if this is a normal user activity or indicative of a potentially malicious operation.

  - **Validate file creation:** If PowerShell commands appear to create or modify files, review file system activity for associated artifacts (especially unusual file paths), particularly looking for temporary files or file names that suggest obfuscation.

  - **Cross-reference network activity:** Query firewall or proxy logs for unusual outbound connections initiated shortly after the PowerShell execution. Look for unexpected connections to known malicious IPs or domains as high confidence indicators of compromise.

  ### Prioritization

  The alert represents a high severity due to the potential impact on critical systems and the likelihood of malicious abuse, as PowerShell is frequently targeted and weaponized by adversaries. Uncommon parent processes increase the risk profile, especially if observed in sensitive environments.

  ### Blind Spots and Assumptions

  Detection of PowerShell executed by expected parent processes may lead to false positives; legitimate administrative scripts or maintenance tasks could trigger this alert. Ensure collection of formal telemetry sources like Sysmon for additional visibility, particularly around process creation. Related detections, such as those monitoring outbound connections or file modifications (e.g., via Sysmon or EDR), can enhance coverage and help confirm malicious activity.

