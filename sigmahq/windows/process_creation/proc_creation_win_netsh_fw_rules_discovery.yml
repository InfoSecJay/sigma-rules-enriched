logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'netsh'
    - 'show '
    - 'firewall '
    CommandLine|contains:
    - 'config '
    - 'state '
    - 'rule '
    - 'name=all'
  condition: all of selection_*
falsepositives:
- Administrative activity
level: low
note: |
  ### Technical Context
  This rule detects the use of the Windows utility `netsh.exe` to query firewall configurations on a system. Attackers may utilize this tool to gather information about network settings, firewall rules, and security configurations, which can assist them in further compromising a network. Understanding the firewall settings can help an adversary craft their actions to evade detection, establish persistence, or navigate the network securely.

  The relevant MITRE ATT&CK tactics and techniques include **Discovery (TA0007)** and specifically, **Network Service Discovery (T1016)**. By executing commands that reveal detailed firewall rules, adversaries can optimize their strategies to exploit known vulnerabilities or avoid security measures already in place.

  Primary data sources for this detection include **process creation logs**, which capture details about executed commands and their parameters, giving insight into administrative or potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect logs from the endpoint to identify any instances of `netsh.exe` execution. Focus on timestamps and user accounts associated with the process to understand the context of the activity.

  - **Analyze Command Line Arguments:** Specifically look for command line arguments that indicate firewall querying, such as `show firewall`, `config`, or `state`. These arguments can provide clarity on what information the attacker was attempting to gather.

  - **Examine User Context:** Investigate the user context in which the command was executed. Check if the command was run by an administrative account or an unusual user account, which could indicate a potential compromise.

  - **Identify Related Network Traffic:** Cross-reference any identified `netsh` usage with network traffic logs for connections to external entities or unusual internal communication, which may indicate further malicious behavior following the discovery activity.

  ### Prioritization
  The severity of this alert is considered low; however, it is important in an enterprise environment because it indicates potential reconnaissance activity that may precede a more significant attack. While the likelihood of an administrator using `netsh.exe` for legitimate purposes is higher, awareness of its misuse for unauthorized discovery is critical.

  ### Blind Spots and Assumptions
  Detection may be limited in environments where logging of process creation events is not enabled or where command line logging is not captured. The detection logic assumes that any invocation of `netsh.exe` with specific arguments indicates discovery activity, but legitimate administrative tasks might result in similar command lines. For effective detection, ensure that process creation auditing and logging are properly configured on all relevant endpoints.

