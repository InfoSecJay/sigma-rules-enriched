logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'netsh'
    - 'show '
    - 'firewall '
    CommandLine|contains:
    - 'config '
    - 'state '
    - 'rule '
    - 'name=all'
  condition: all of selection_*
falsepositives:
- Administrative activity
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of `netsh.exe` with commands indicating an attempt to retrieve Windows Firewall settings. The behavior suggests that an adversary is conducting information discovery to understand network configurations, potentially to identify exploitable services or to facilitate lateral movement. The relevant MITRE ATT&CK technique is Reconnaissance - Network Service Scanning (T1016).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688, Sysmon Event ID 1) focusing on command-line parameters of the `netsh.exe` process. If unauthorized or malicious, this could grant the adversary insights into firewall rules, exposing attack vectors. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may trigger the same alerts.

  ### Investigation Steps

  - **Check for process creation logs:** Inspect Security Event ID 4688 and Sysmon Event ID 1 for instances of `netsh.exe` being executed with command-line arguments that include "show", "firewall", and "rule name=all". Look for any indications that it wasn't executed as part of normal administrative activities.

  - **Analyze command-line parameters:** Identify and break down the CommandLine field to confirm if it contains malicious indicators such as `config` or `state`, alongside legitimate administrative commands. Legitimate usage may have less extensive outputs and less frequent occurrences.

  - **Review host activity logs:** Examine past entries in Windows Application or Security logs for the execution frequency of `netsh.exe`. Frequent or automated command invocations, especially from non-administrative users, may indicate potential compromise.

  - **Identify user accounts associated with the execution:** Verify which user account executed `netsh.exe` through the SubjectUserName and SubjectDomainName fields in the event logs. Administrative access may confirm benign activity, while unauthorized accounts could indicate potential threat actor behavior.

  - **Correlate with network activity:** Cross-reference alerts from firewall logs or IDS/IPS systems that monitor unusual network traffic patterns that may correlate with the timing of the `netsh.exe` executions. Look for connections to external IPs or unusual data flows following these commands.

  ### Prioritization

  The alert severity is low in many enterprise contexts due to the potential for legitimate administrative tasks triggering the rule. However, it could escalate to a higher concern if detected in sensitive systems or if account compromise is suspected, especially given that reconnaissance tactics are frequently employed in pre-attack phases.

  ### Blind Spots and Assumptions

  Detection might miss if the adversary utilizes multiple other tools or scripts to extract firewall configurations without invoking a visible command line or if they obfuscate their activity. Reliable detection requires ensuring that logging for detailed process creation is enabled and configured properly. Legitimate administrative tasks, such as network configuration updates, can easily trigger this alert. Companion detections might include monitoring unauthorized access attempts related to administratively privileged actions within the environment.

