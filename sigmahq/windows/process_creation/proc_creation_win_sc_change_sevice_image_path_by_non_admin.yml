title: Possible Privilege Escalation via Weak Service Permissions
id: d937b75f-a665-4480-88a5-2f20e9f9b22a
status: test
description: Detection of sc.exe utility spawning by user with Medium integrity level
  to change service ImagePath or FailureCommand
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://pentestlab.blog/2017/03/30/weak-service-permissions/
author: Teymur Kheirkhabarov
date: 2019-10-26
modified: 2024-12-01
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  scbynonadmin:
    Image|endswith: '\sc.exe'
    IntegrityLevel:
    - 'Medium'
    - 'S-1-16-8192'
  selection_binpath:
    CommandLine|contains|all:
    - 'config'
    - 'binPath'
  selection_failure:
    CommandLine|contains|all:
    - 'failure'
    - 'command'
  condition: scbynonadmin and 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the Windows service control utility (`sc.exe`) is launched by a user with medium integrity levels to modify service configurations, specifically targeting the `ImagePath` or `FailureCommand` attributes. Attackers may exploit this action to escalate privileges, establish persistence, or evade detection by altering service-related settings on compromised systems. The ability to manipulate services is critical for attackers aiming to gain higher levels of control within a network environment.

  The probable attacker objectives in this scenario include maintaining access to compromised systems and managing service behaviors to avoid detection. Such tactics are commonly observed in advanced persistent threats (APTs) and other malicious actors who attempt to gain control over system services to further their goals. This behavior aligns with the MITRE ATT&CK techniques for persistence and privilege escalation, notably **`T1574.011 - Service Registry Permissions Weakness`**.

  Primary sources of data that will yield useful evidence for this rule include **process creation logs**, which capture the execution details of `sc.exe` and any command-line parameters passed during execution. Additionally, Windows Event Logs pertaining to service changes and configuration events can provide further insight into these actions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for instances where `sc.exe` is executed by users at medium integrity levels, noting any suspicious command-line arguments that target the service configurations.
  - **Analyze Command-Line Arguments:** Investigate command-line inputs for potential malicious indicators, such as `config`, `binPath`, or `failure command` terms that signify attempts to alter service settings.
  - **Validate Service Configuration Changes:** Correlate the detected `sc.exe` executions with changes in service configurations in Windows Services to determine if unauthorized modifications occurred.
  - **Assess User Privileges and Roles:** Examine the user accounts executing the command for unusual privilege levels or suspicious history that may indicate compromised accounts or privilege escalation attempts.

  ### Prioritization
  The alert is assigned a high severity level due to the potential for significant impact on system security if an attacker is able to successfully escalate privileges or achieve persistence through service manipulation. The likelihood of this alert indicates malicious intent, making prompt investigation essential in an enterprise setting.

  ### Blind Spots and Assumptions
  This detection logic may not account for legitimate administrative actions performed by authorized users, especially in scenarios where service configurations are routinely modified. It assumes that the logs for process creation and service activities are correctly captured and retained. Any gaps in logging configurations or missing event logs could lead to gaps in detection coverage, allowing malicious activity to go unnoticed. It's essential to ensure that auditing for service changes is enabled across systems to facilitate comprehensive monitoring.

