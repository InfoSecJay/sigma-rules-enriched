title: Possible Privilege Escalation via Weak Service Permissions
id: d937b75f-a665-4480-88a5-2f20e9f9b22a
status: test
description: Detection of sc.exe utility spawning by user with Medium integrity 
  level to change service ImagePath or FailureCommand
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://pentestlab.blog/2017/03/30/weak-service-permissions/
author: Teymur Kheirkhabarov
date: 2019-10-26
modified: 2024-12-01
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  scbynonadmin:
    Image|endswith: '\sc.exe'
    IntegrityLevel:
    - 'Medium'
    - 'S-1-16-8192'
  selection_binpath:
    CommandLine|contains|all:
    - 'config'
    - 'binPath'
  selection_failure:
    CommandLine|contains|all:
    - 'failure'
    - 'command'
  condition: scbynonadmin and 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows service control manager utility (`sc.exe`) by a user operating at a Medium integrity level, attempting to alter service configurations, specifically `ImagePath` or `FailureCommand`. The most likely objective of this behavior is to escalate privileges or maintain persistence by leveraging weak service permissions. The relevant MITRE ATT&CK tactics and techniques include Persistence (TA0003), Privilege Escalation (TA0004), and the specific technique of Service Registry Permissions Weakness (T1574.011).

  The primary telemetry sources are Windows process creation logs, with a focus on Event ID 4688 for process launch details. If malicious, this behavior could allow an attacker to gain unauthorized control over services, potentially compromising the host system. However, this detection does NOT confirm that the activity was malicious; it only highlights that a non-admin user is attempting to modify service properties.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `sc.exe` execution by users with Medium integrity (`S-1-16-8192`). Look for anomalies in user accounts attempting service changes.
  - **Assess command line parameters:** Investigate Event ID 4688's `CommandLine` field for instances containing both `config` and `binPath` or `failure` and `command`. Analyze if these correspond to expected service modifications or indicate potential misuse.
  - **Verify service permissions:** Use PowerShell to check service permissions via `Get-Service`. Ensure the user’s account attempting the modification does not have elevated permissions on critical services. Legitimate modifications should come from authorized personnel with high-level privileges.
  - **Identify executed commands:** Cross-reference the commands executed with `sc.exe` against known benign maintenance activities. Authorized admins may execute similar commands, particularly for service restarts or configuration validation.
  - **Analyze service impact:** Identify the services being modified and their criticality to business operations. For example, changes to `Windows Update` or `Remote Desktop Services` pose higher risks and should be prioritized for deeper investigation.
  - **Evaluate additional sysmon logs:** If Sysmon is deployed, review Event ID 1 (Process Create) for detailed correlating information regarding the parent process, timestamps, and additional metrics about the environment from which `sc.exe` was spawned.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems when a non-admin user attempts to change service configurations, which can lead to privilege escalation. The likelihood of malicious abuse is significant, particularly if the organization has a history of privileged escalation attempts. This behavior is commonly targeted by attackers looking to exploit misconfigurations in system services.

  ### Blind Spots and Assumptions

  Detection may be limited if log sources like Windows Security Event logs or Sysmon are not properly configured to capture relevant events. Attackers may employ evasion techniques by using legitimate administrative accounts or running their own tools disguised as `sc.exe`. Additionally, authorized users performing legitimate service maintenance may trigger this alert, requiring contextual analysis of user behavior. Related detections, such as monitoring for unexpected changes in service configurations or user account activities, can strengthen overall coverage against this tactic.

