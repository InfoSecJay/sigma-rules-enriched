title: Possible Privilege Escalation via Weak Service Permissions
id: d937b75f-a665-4480-88a5-2f20e9f9b22a
status: test
description: Detection of sc.exe utility spawning by user with Medium integrity 
  level to change service ImagePath or FailureCommand
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://pentestlab.blog/2017/03/30/weak-service-permissions/
author: Teymur Kheirkhabarov
date: 2019-10-26
modified: 2024-12-01
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  scbynonadmin:
    Image|endswith: '\sc.exe'
    IntegrityLevel:
    - 'Medium'
    - 'S-1-16-8192'
  selection_binpath:
    CommandLine|contains|all:
    - 'config'
    - 'binPath'
  selection_failure:
    CommandLine|contains|all:
    - 'failure'
    - 'command'
  condition: scbynonadmin and 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `sc.exe` utility by users with a Medium integrity level attempting to change service settings, specifically the `ImagePath` or `FailureCommand`. This behavior is associated with privilege escalation attempts where an attacker seeks to manipulate services to execute malicious payloads or gain unauthorized access. The relevant MITRE ATT&CK tactics and techniques include "Persistence" (TA0003) and "Privilege Escalation" (TA0004) under the technique "Service Permissions Weakness" (T1574.011).

  The primary telemetry source involves process creation logs from Windows, specifically Security Event ID 4688. If this behavior is malicious, it could lead to persistent backdoors or unauthorized system access. However, this detection alone does not confirm malicious intent; legitimate system administrators can also execute similar commands as part of normal operations.

  ### Investigation Steps

  - **Review the Command Line: ** Check the `CommandLine` field in Security Event ID 4688 for `sc.exe` invocations containing 'config' and 'binPath' keywords for changes to service paths. Legitimate use would typically involve predefined service settings management by authorized personnel.

  - **Identify Integrity Level: ** Examine the `IntegrityLevel` field for the process. A Medium integrity level indicates that the command was run by a standard user without administrative privileges. Elevated privileges without justification should be viewed as suspicious.

  - **Check Modification Details: ** Investigate the details in the `ImagePath` or `FailureCommand` fields in the service modification logs (Service Control Manager logs) to identify if system services are being redirected or modified to unexpected paths, indicating potential malicious behavior.

  - **Cross-Reference User Activity: ** Correlate the user running `sc.exe` against standard operational roles within the organization. Unapproved users executing service modifications should raise red flags.

  - **Review Service Account Permissions: ** Analyze permissions of the affected service accounts using `Get-Service` and identify any unusual configurations that could suggest weak permissions or potential exploitation.

  - **Inspect for Related Artifacts: ** Look for evidence of file creation or execution in directory paths associated with modified services. This may include log files, binaries, or network connections that were established following the modification, indicating potential exfiltration or lateral movement.

  ### Prioritization

  Given the potential impact on system integrity and the likelihood of privilege escalation, alerts from this detection are rated high severity. The behavior outlined in this detection is often used by adversaries to achieve persistence and may indicate a compromised system if executed by unauthorized users.

  ### Blind Spots and Assumptions

  Evasion techniques could include legitimate administrative activities that could trigger false positives, such as scheduled tasks or system updates. Reliable detection requires continuous monitoring of process creation logs and service configuration data. Additionally, misconfigured delegation settings might permit malformed service configurations, leading to legitimate alerts. Companion detections regarding unusual user activity (e.g., using `net user` commands or accessing high-risk services) will strengthen overall security coverage.

