detection:
  selection:
    Image|endswith: '\DumpStack.log'
  selection_download:
    CommandLine|contains: ' -o DumpStack.log'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies potential evasion techniques utilized by attackers who manipulate the filename "DumpStack.log" to bypass Microsoft Defender. The presence of this specific filename in conjunction with abnormal command-line arguments suggests an attempt to conceal malicious activities, likely during a post-exploitation phase where the attacker seeks to manipulate or exfiltrate data while avoiding detection. Attackers may aim to maintain persistence, exfiltrate sensitive information, or execute malicious payloads without triggering security alerts.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (T1560)**, as the rule focuses on how attackers might try to bypass security mechanisms. The techniques that align with this behavior include **Obfuscated Files or Information (T1027)** and potentially **Indicator Removal on Host (T1070)**, as they indicate attempts to hide evidence of malicious activities.

  Primary data sources for this detection include **process creation logs** that capture command-line arguments and the executed image paths, which are critical for identifying unusual file usage and potential malicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of "DumpStack.log" in the Filename or Image field. Investigate other surrounding process activities that may indicate a compromise.
  - **Evaluate Command-Line Arguments:** Investigate instances where the process command line contains `-o DumpStack.log`. Cross-reference with known good or expected command-line behaviors to identify anomalies.
  - **Inspect Subsequent Child Processes:** Check for any child processes spawned by the detected instance. Malicious activities often evolve into further exploits or lateral movement within the network.
  - **Correlate with Other Security Events:** Look for related alerts in other systems (e.g., EDR, SIEM) that might indicate broader attack patterns or related suspicious behavior and gather context.

  ### Prioritization
  This alert is classified as critical due to the potential for attackers to successfully evade detection mechanisms, facilitating further malicious activities such as data exfiltration or lateral movement within the enterprise environment.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if attack techniques vary or if the attacker utilizes alternate filenames or methods to evade detection. The detection logic assumes that the filename and command-line signature are sufficient indicators for identifying malicious intent, which may not account for legitimate usage scenarios. For this alert to function effectively, it requires comprehensive logging of process creation events and command-line arguments across all relevant endpoints.

