  ---

  ### Technical Context

  This Sigma rule detects the use of the filename `DumpStack.log`, which is often employed in attempts to evade Microsoft Defender's detection mechanisms. Attackers may leverage this filename to route malicious behavior into a less scrutinized file, thereby mitigating detection during post-exploitation activities.

  The relevant MITRE ATT&CK Tactic is Defense Evasion (TA0005), with the technique being "Obfuscated Files or Information" (T1027). Primary telemetry sources include Windows Process Creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, focusing on the `Image` and `CommandLine` fields. If malicious, the use of this filename can indicate an adversary's attempts to conceal their actions or payloads, posing significant risks to the environment.

  It's important to note that this detection alone does not confirm that a malicious activity has occurred; it simply signals unusual behavior that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review Process Creation Events:** Check Security Event ID 4688 and Sysmon Event ID 1 for processes with the `Image` ending in `\DumpStack.log`. Malicious activity may include unusual parent processes or context without legitimate user initiation.

  - **Analyze Command Line Arguments:** Identify any instances of `CommandLine` containing ` -o DumpStack.log` within relevant logs. Presence in unauthorized or unexpected contexts may indicate malicious usage.

  - **Correlate with User and Asset Context:** Validate whether the user or application trying to access or create `DumpStack.log` is known and legitimate. Expected behavior typically involves system-level processes or known maintenance tasks; deviations could be suspicious.

  - **Assess File Integrity and Creation Log:** Utilize file monitoring tools or check file system logs for `DumpStack.log` creation events. Specifically, look for an unexpected timestamp or creation by non-system accounts.

  - **Identify Patterns of Prior Usage:** Conduct a historical review of existing `DumpStack.log` files on the system. If this file name is rarely observed in normal operations, its recent appearance may indicate a potential compromise.

  ---

  ### Prioritization

  This alert should be treated with high severity, as using `DumpStack.log` for evasion is a known tactic. The likelihood of malicious abuse is significant given the ease of bypassing standard defenses, and this behavior is consistent with ongoing adversarial tactics seen in observed attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate applications or system processes utilizing `DumpStack.log` for valid reasons, thus potentially causing false positives. Reliable detection requires correlation across multiple telemetry sources (e.g., process creation and file system logs) to provide context. Additionally, similar behaviors involving other non-standard filenames can indicate a broader evasion technique, thus implementing companion detections for such filenames may enhance coverage.

