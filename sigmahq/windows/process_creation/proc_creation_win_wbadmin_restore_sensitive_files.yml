note: |
  ### Technical Context
  This detection rule identifies the unauthorized use of the `wbadmin.exe` utility to recover sensitive files such as the NTDS.DIT and SECURITY hive from backups. Attackers may leverage this legitimate administrative tool to exfiltrate critical credentials and sensitive information from the system, particularly targeting Active Directory-related files. The primary objective of the attacker when using this method is to gather intelligence and escalate privileges within the network by accessing sensitive security configurations or user credentials found in these files.

  The detected activity aligns with the MITRE ATT&CK techniques for Credential Access, specifically T1003.003: Credential Dumping: Local Security Authority Subsystem Service (LSASS) Memory, where attackers exploit legitimate tools to compromise sensitive information. By utilizing `wbadmin.exe`, attackers can circumvent traditional security measures that monitor only for malicious behaviors, potentially leading to significant security breaches.

  The primary data sources for this detection include process creation events and command line arguments that reveal the use of `wbadmin.exe`. Monitoring these logs allows for the detection of suspicious command activities related to file recovery operations executed by `wbadmin.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of `wbadmin.exe` execution, focusing on the command line arguments used. Investigate any instances containing `recovery`, `recoveryTarget`, or `itemtype:File`, as these indicate attempts to recover sensitive files.

  - **Inspect Command Line Arguments:** Analyze the specific files being referenced in the command line. Look for any references to `\config\SAM`, `\config\SECURITY`, `\config\SYSTEM`, or `\Windows\NTDS\NTDS.dit`, which suggest an attempt to access sensitive information.

  - **Correlate with Backup Activity:** Cross-reference the execution of `wbadmin.exe` with backup schedules and operational logs. Verify whether the activity aligns with authorized backup processes or if it deviates from normal operations, indicating potential unauthorized actions.

  - **Assess User Permissions:** Determine the user account that executed the `wbadmin.exe` command. Verify if the user has legitimate reasons or permissions to perform backup recoveries and assess any abnormal access patterns that may suggest compromise.

  ### Prioritization
  This alert is rated high because the unauthorized retrieval of sensitive data could lead to severe security incidents, such as account takeovers and data breaches. Given the persistent threat of attackers targeting sensitive credentials in enterprise environments, such activity warrants immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may not capture scenarios where attackers have legitimate access to backup utilities due to their permissions but are engaging in malicious activities. There is an assumption that logging for process creation and command line arguments is enabled and adequately configured on monitored systems. Additionally, environments with restrictive access controls may limit instances of legitimate usage of `wbadmin.exe`, potentially leading to a higher false positive rate if not properly filtered for context.

