note: |
  ### Technical Context

  This Sigma rule detects the use of the `wbadmin.exe` utility to recover sensitive files, specifically targeting files like "NTDS.DIT," the "SECURITY" hive, and others that can contain credentials or sensitive organizational data. The likely attacker objective is to exfiltrate or manipulate sensitive user information for credential theft or lateral movement within the network. This behavior falls under the MITRE ATT&CK framework, specifically the tactic of Credential Access (TA-0006) and the technique "Credential Dumping: Windows: Wbadmin" (T1003.003).

  The primary telemetry source is Windows process creation logs, specifically monitoring for `wbadmin.exe`. Key required log types involved include Security Event ID 4688 and Sysmon Event ID 1, which log process creation and command line activity. If malicious, the security impact includes unauthorized access to sensitive credentials, leading to further compromise of accounts or systems. Notably, this detection does NOT confirm whether the files were successfully retrieved or used maliciously, as legitimate usage may also trigger the alert.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 for instances of `wbadmin.exe`. Look for suspicious command line arguments, particularly those referencing paths such as `\config\SAM`, `\config\SECURITY`, `\Windows\NTDS\NTDS.dit`.

  - **Analyze command line arguments:** Check the CommandLine field for evidence of recovery operations, especially for strings like 'recovery', 'recoveryTarget', and 'itemtype:File'. Malicious indicators include direct references to sensitive file paths.

  - **Evaluate the context of the process:** Identify the user account associated with the `wbadmin.exe` execution. If the execution is from a non-administrative context and is unexpected (e.g., from a service account), it raises suspicion.

  - **Characterize legitimate behavior:** Determine if there are scheduled or documented backups occurring with `wbadmin.exe` as part of regular IT operations. Common patterns would show routine use according to organization policy rather than ad-hoc command execution.

  - **Identify file access artifacts:** If possible, verify the existence of the dumped files by reviewing relevant file system logs or detection tools for file creation or modification timestamps linked to `wbadmin.exe`.

  - **Correlate with user behavior:** Assess any recent user activity on the machine to identify unusual behavior leading up to the execution of `wbadmin.exe`. Look for failed login attempts or other suspicious activity in related logs.

  ---

  ### Prioritization

  This alert is high severity due to the potential exposure of sensitive information that could facilitate further attacks within the environment. The likelihood of malicious abuse is significant, given the utility's capability to recover critical credential files. Such behavior is often weaponized in attacks targeting user credentials and privilege escalation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for the `wbadmin.exe` tool to be used legitimately, leading to false positives. Reliable detection necessitates comprehensive logging configurations to capture all relevant process creation events and command arguments. Legitimate activities, such as IT practices for backup and recovery, may inadvertently trigger alerts. A related detection to strengthen coverage could involve monitoring for anomalous service accounts or scripted tasks that execute `wbadmin.exe` outside of normal operational hours.

