title: UAC Bypass Using NTFS Reparse Point - Process
id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
status: test
description: Detects the pattern of UAC Bypass using NTFS reparse point and wusa.exe
  DLL hijacking (UACMe 36)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-30
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|startswith: '"C:\Windows\system32\wusa.exe"  /quiet C:\Users\'
    CommandLine|endswith: '\AppData\Local\Temp\update.msu'
    IntegrityLevel:
    - 'High'
    - 'System'
    - 'S-1-16-16384'         # System
    - 'S-1-16-12288'         # High
  selection2:
    ParentCommandLine: '"C:\Windows\system32\dism.exe" /online /quiet /norestart /add-package
      /packagepath:"C:\Windows\system32\pe386" /ignorecheck'
    IntegrityLevel:
    - 'High'
    - 'System'
    CommandLine|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Temp\'
    - '\dismhost.exe {'
    Image|endswith: '\DismHost.exe'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential User Account Control (UAC) bypass attempts through the exploitation of NTFS reparse points, specifically targeting `wusa.exe` as part of the attack methodology. The rule highlights scenarios where malicious actors may seek to escalate privileges by hijacking legitimate Windows processes, thereby executing arbitrary code with elevated privileges. The likely objective of such an attack is to manipulate system functionally undetected, allowing adversaries to perform unauthorized actions, extract sensitive information, or establish persistence in a compromised environment.

  Relevant MITRE ATT&CK techniques include **T1548.002: Abuse Elevation Control Mechanism: Elevation via Exploitation of a Vulnerability**. This technique encompasses various methods to bypass UAC protections, including DLL hijacking, which can lead to system-level access. The primary data sources for this detection are Windows **process creation logs** that record command line execution and integrity levels of running processes, which are crucial for identifying unauthorized actions taken by compromised software.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate process creation events for instances of `wusa.exe` and `DismHost.exe` to identify any abnormal command lines indicating UAC bypass attempts.
  - **Analyze Parent Process Relationships**: Examine the parent process of any `wusa.exe` calls, paying close attention to whether they originated from common administrative tools like `dism.exe`, which may suggest the use of exploitation techniques.
  - **Check Integrity Levels**: Confirm the integrity levels of the processes involved. High or System-level integrity for processes that should operate at a lower level might indicate potential compromise or misuse.
  - **Correlate with Other Events**: Look for associated events, such as changes in file system permissions or modifications to the Temp directory. Cross-reference with other telemetry (e.g., EDR alerts, user activity logs) for further indicators of compromise.

  ### Prioritization
  This alert has a high severity due to the critical nature of privilege escalation and the potential for significant harm if an attacker successfully bypasses UAC protections. The likelihood of encountering such techniques in sophisticated attacks necessitates prompt investigation.

  ### Blind Spots and Assumptions
  The detection relies on accurate logging of process creation events and integrity levels, which may not be consistently available across all environments. Assumptions include that the behavior of legitimate software processes will not change significantly, and that any legitimate use of `wusa.exe` or `dism.exe` does not involve reparse points in a typical context, which could lead to false positives. Environments not utilizing System and High integrity logging, or lacking comprehensive endpoint detection capabilities, may miss these critical indicators.

