title: UAC Bypass Using NTFS Reparse Point - Process
id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
status: test
description: Detects the pattern of UAC Bypass using NTFS reparse point and 
  wusa.exe DLL hijacking (UACMe 36)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-30
modified: 2024-12-01
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|startswith: '"C:\Windows\system32\wusa.exe"  /quiet C:\Users\'
    CommandLine|endswith: '\AppData\Local\Temp\update.msu'
    IntegrityLevel:
    - 'High'
    - 'System'
    - 'S-1-16-16384'         # System
    - 'S-1-16-12288'         # High
  selection2:
    ParentCommandLine: '"C:\Windows\system32\dism.exe" /online /quiet /norestart /add-package
      /packagepath:"C:\Windows\system32\pe386" /ignorecheck'
    IntegrityLevel:
    - 'High'
    - 'System'
    CommandLine|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Temp\'
    - '\dismhost.exe {'
    Image|endswith: '\DismHost.exe'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the abuse of User Account Control (UAC) by leveraging NTFS reparse points and DLL hijacking with `wusa.exe` to escalate privileges. The likely attacker objective is to gain elevated access rights on a Windows system, allowing them to execute malicious payloads or tools while bypassing security measures. This behavior falls under the MITRE ATT&CK techniques for Privilege Escalation (T1548.002) and Defense Evasion.

  Primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688 for new process creation, and the command line provided in those logs. The potential security impact is significant as it may allow an adversary to operate with system-level permissions undetected. However, this detection does NOT confirm malicious activity on its own; further investigation is required to establish intent and context.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Windows Security Event ID 4688 for instances of `wusa.exe` being invoked with parameters indicating it is executing `update.msu` from a user's Temp directory (`C:\Users\*\AppData\Local\Temp\`). This may indicate a potential UAC bypass.

  - **Review Parent Process Context:** Verify the presence of the parent process `dism.exe` (Event ID 4688) with command line parameters showing `/online /quiet /norestart /add-package /packagepath:"C:\Windows\system32\pe386" /ignorecheck`. If this command is seen alongside elevated integrity levels, it indicates a higher likelihood of malicious intent.

  - **Inspect Integrity Levels:** Focus on processes that are launched with 'High' or 'System' integrity levels (Event ID 4688). Legitimate usage typically does not involve launching `wusa.exe` or `DismHost.exe` directly from user directories and usually runs at lower integrity levels.

  - **Identify Malicious Indicators:** Look for the presence of the `DismHost.exe` executed with command lines containing `\dismhost.exe {` as well as the usage of Temp folders. If found as low-frequency but elevated integrity level processes, this is a strong indication of a malicious escalation attempt.

  - **Cross-Reference with Other Logs:** Compare against Sysmon Event ID 1 (Process Creation) to link `wusa.exe` and `DismHost.exe` events with executed code or relationships with other processes that might not conform to normal patterns.

  ### Prioritization

  The alert must be considered high priority given the potential for system level privilege escalation that could allow a threat actor extensive control over affected systems. The use of UAC bypass techniques is commonly weaponized in attacks, making it crucial for analysts to prioritize these alerts.

  ### Blind Spots and Assumptions

  There is a risk of false positives, particularly due to legitimate applications invoking similar command patterns during software updates or installations. This rule may miss instances where logs are not configured to capture all related process creation events. For effective detection, ensure Windows Process Auditing is enabled for process creation and include Sysmon logging. A related detection to consider is monitoring for unusual command line parameters in other standard Windows processes that could indicate abuse or modification.

