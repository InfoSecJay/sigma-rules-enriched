logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|startswith: '"C:\Windows\system32\wusa.exe"  /quiet C:\Users\'
    CommandLine|endswith: '\AppData\Local\Temp\update.msu'
    IntegrityLevel:
    - 'High'
    - 'System'
    - 'S-1-16-16384'         # System
    - 'S-1-16-12288'         # High
  selection2:
    ParentCommandLine: '"C:\Windows\system32\dism.exe" /online /quiet /norestart /add-package
      /packagepath:"C:\Windows\system32\pe386" /ignorecheck'
    IntegrityLevel:
    - 'High'
    - 'System'
    CommandLine|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Temp\'
    - '\dismhost.exe {'
    Image|endswith: '\DismHost.exe'
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) using NTFS reparse points and DLL hijacking techniques, specifically through the execution of `wusa.exe` or `DismHost.exe`. The likely attacker objective is to gain elevated privileges on a Windows system by exploiting these vulnerabilities. The relevant MITRE ATT&CK tactic is **Privilege Escalation**, and the technique is **T1548.002: Abuse Elevation Control Mechanism: Bypass User Access Control**. The primary telemetry sources are process creation logs, specifically Security Event ID 4688 and Windows Sysmon Event ID 1, which provide details on command line arguments and process integrity levels. If malicious, this behavior can lead to unauthorized access to sensitive data and administrative capabilities.

  This detection does not confirm intent or the success of an attack on its own and must be correlated with additional data points to ascertain the risk.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `wusa.exe` where the command line starts with `"C:\Windows\system32\wusa.exe" /quiet C:\Users\` and ends with `\AppData\Local\Temp\update.msu`. Match with `IntegrityLevel` values of 'High' or 'System' for potential malicious activity.

  - **Examine parent process relationships:** Look into process creation logs for `DismHost.exe`, specifically filtering for the parent command line as `"C:\Windows\system32\dism.exe" /online /quiet /norestart /add-package /packagepath:"C:\Windows\system32\pe386" /ignorecheck`. Ensure that the `IntegrityLevel` also matches 'High' or 'System'.

  - **Identify benign usage:** Legitimate updates or administrative activity may use `wusa.exe` for system updates from recognized sources (e.g., Microsoft). Confirm whether the detected `update.msu` files are from trusted updates or installations to differentiate between benign and malicious behavior.

  - **Look for suspicious task scheduling:** Check for any scheduled tasks that might leverage the `wusa.exe` or `DismHost.exe` to execute during unusual times or from atypical user profiles, as this behavior may indicate attempts to leverage the detected technique.

  - **Verify DLL integrity:** Validate the presence of `wusa.exe` and `DismHost.exe` against known good hashes and check for any unauthorized changes, particularly in the `C:\Windows\system32\` directory that may indicate hijacking.

  ### Prioritization

  This alert is high severity due to the risk of privilege escalation that could significantly impact system integrity and security. The likelihood of malicious abuse is substantial, as UAC bypass techniques are commonly weaponized by adversaries to escalate privileges and execute malicious payloads undetected.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative actions that could mirror the behavior of the rule, leading to potential false positives. It is crucial to ensure that logging for process creation is consistently enabled across all endpoints, as missing logs would hinder detection success. Additionally, legitimate software installations or system updates could inadvertently trigger this alert, making context-based analysis critical. A related detection to consider is monitoring for malformed or suspicious executable files being executed from the `\AppData\Local\Temp\` directory, which could bolster coverage against similar evasion techniques.

