note: |
  ### Technical Context
  This detection rule focuses on identifying the usage of the `at.exe` utility with an "interactive" command line argument, which may indicate unauthorized scheduling of tasks that run with elevated privileges. The `at.exe` utility is an older Windows command-line tool that can schedule commands and programs to run at specific times. Attackers may use it for privilege escalation by creating interactive scheduled tasks that execute in the context of a user with higher privileges, providing them with elevated access to the system.

  The threat scenario typically involves an attacker who has gained initial access to a system with limited privileges, possibly through exploitation or phishing, and seeks to escalate their privileges. By creating an interactive AT job, the attacker can execute malicious commands or payloads discreetly and maintain persistence within the environment. This behavior aligns with several MITRE ATT&CK tactics and techniques, specifically **Persistence (T1053.002)** and **Privilege Escalation (T1068)**.

  The primary data sources for this detection rule are **process creation events** from Windows systems. These events will provide logs containing the execution of the `at.exe` command along with its associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation logs for instances of `at.exe` being executed, particularly focusing on entries with the "interactive" command line argument.

  - **Analyze Command Line Arguments**: Investigate the full command line used in the detected `at.exe` execution to identify any unusual or unauthorized commands that may indicate malicious intent.

  - **Examine User Accounts**: Determine which user account executed the interactive `at.exe`. Verify the legitimacy of the account, its privileges, and whether it aligns with expected behavior.

  - **Check Scheduled Task Configurations**: Review the list of scheduled tasks on the affected system to identify any newly created tasks that may not have been authorized, especially those that run interactively.

  ### Prioritization
  This alert is considered high severity due to the potential for significant impact on the organization's security posture. Privilege escalation through scheduled tasks can enable attackers to gain control over critical systems, access sensitive data, and introduce further compromises.

  ### Blind Spots and Assumptions
  One gap in this detection coverage is the reliance on `at.exe`, which has been deprecated since Windows 8. Therefore, it may not be applicable in environments using newer versions of Windows. Additionally, the detection logic assumes that an attacker will use the `at.exe` utility for privilege escalation, which may not always be the case as they may opt for other methods or tools. Required logs for this alert include comprehensive process creation logs that capture all executed commands and their arguments within the Windows environment.

