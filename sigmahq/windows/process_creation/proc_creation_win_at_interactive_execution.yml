note: |
  ### Technical Context

  This rule detects the execution of the `at.exe` command with the 'interactive' flag, which can be employed by attackers to schedule malicious tasks that execute in the context of a logged-in user. This behavior often indicates an attempt at privilege escalation or persistence within a compromised environment. The relevant MITRE ATT&CK tactic is Persistence, with technique T1053.002 (Scheduled Task/Job: at).

  Primary telemetry sources include Windows Security Event ID 4688—process creation events detailing the execution of `at.exe`. If this behavior is malicious, it may lead to unauthorized actions being executed with higher privileges. Note that this detection alone does NOT confirm that an authenticated user has malicious intent; benign administrative tasks could trigger similar alerts.

  ### Investigation Steps

  - **Check Process Creation Event:** Review Security Event ID 4688 for the `at.exe` process execution and associated CommandLine to ensure the 'interactive' parameter is present.

  - **Examine User Context:** Analyze the user account that invoked `at.exe`—compare against expected administrator accounts. Legitimate usage typically involves automation by system administrators rather than casual or unknown user accounts.

  - **Review Task Scheduler Logs:** Look into Task Scheduler logs (Microsoft-Windows-TaskScheduler/Operational) for unexpected tasks created with elevated privileges in correlation with the timing of the alert.

  - **Validate Execution Context:** Investigate any related running tasks using PowerShell commands like `Get-ScheduledTask` to identify job configurations set by this `at.exe` invocation; confirm if they present as potentially harmful.

  - **Assess Logs for Anomalous Patterns:** Review for common indicators of suspicious activity within the same timeframe, such as multiple rapid Task Scheduler jobs created in succession, which could indicate automated exploitation.

  - **Identify Post-Execution Artifacts:** Check for any potential outbound network connections or subsequent processes spawned by jobs created with `at.exe` that signal command and control (e.g., suspicious `cmd.exe` or `powershell.exe` executions).

  ### Prioritization

  This alert is high severity given that the affected system may be pivotal within the enterprise network and the potential for abuse is significant. The 'interactive' execution of `at.exe` is not common and can be utilized in orchestrated attacks, making it a target for weaponization by adversaries.

  ### Blind Spots and Assumptions

  Detection is limited by the deprecation of `at.exe` in Windows 8 and later, which reduces its legitimate use. Analysts must ensure logging for process creation is enabled across relevant systems for effective detection. Legitimate administrative activities may also set similar flags if for automation processes. Monitoring for related alerts (like unauthorized Task Scheduler modifications) can strengthen coverage and context around this behavior.

