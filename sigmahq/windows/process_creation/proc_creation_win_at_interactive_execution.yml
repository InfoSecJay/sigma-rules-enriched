note: |
  ### Technical Context

  This rule detects the creation of an interactive scheduled task via `at.exe`, specifically when the command line includes the term "interactive." This behavior may indicate an attempt to escalate privileges, as adversaries can use `at.exe` to schedule commands that execute with elevated permissions. The relevant MITRE ATT&CK technique is **Scheduled Task/Job (T1053.002)**, which falls under the tactics of **Persistence** and **Privilege Escalation**.

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Security Event ID **4688** and Sysmon Event ID **1**. If the detected behavior is malicious, it could lead to unauthorized access to sensitive systems or data. It is important to note that the presence of an interactive `at.exe` job does NOT automatically confirm malicious intent; it could be the result of legitimate administrative actions, particularly on legacy systems.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID **4688** or Sysmon Event ID **1**. Look for `Image` paths ending with `\at.exe` and confirm the `CommandLine` includes "interactive." Malicious indicators may include unexpected user accounts and non-administrative contexts.

  - **Verify the scheduled task**: Use `schtasks /query` in a command line or PowerShell. Look for tasks with the `interactive` flag that do not conform to standard administrative practices. Benign configurations typically involve standard accounts and did not require user interaction.

  - **Examine user accounts**: Determine whether the task was scheduled by a legitimate administrative user or a user associated with a security incident. Suspicious accounts may include newly created users or users lacking administrative responsibilities.

  - **Assess system impact and roles**: Identify whether the affected system is critical to operations (e.g., a domain controller or application server). This can help determine the urgency of the response.

  - **Investigate for companion activities**: Look for any related artifacts of privilege escalation, such as changes to user rights or other scheduled tasks that could indicate a broader campaign (e.g., creation of new user accounts or modification of existing ones).

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on sensitive systems if a malicious actor escalates privileges. The method of using `at.exe` is less common in modern environments, making it suspicious and likely indicative of malicious behavior.

  ### Blind Spots and Assumptions

  Detection is limited by the deprecation of `at.exe` in newer Windows versions, which reduces its legitimate usage and may lead to evasion. Environments still using older versions need to ensure logs for scheduled tasks are enabled, specifically for `schtasks` and `at.exe` completions. Legitimate administrative behaviors, such as scheduled tasks for maintenance, may also trigger this alert. A related detection for scheduled tasks using PowerShell also strengthens the coverage against the use of alternative scheduling methods.

