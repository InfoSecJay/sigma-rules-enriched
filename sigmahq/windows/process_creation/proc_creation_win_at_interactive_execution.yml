  ---

  ### Technical Context

  This rule detects the use of `at.exe` to create interactive scheduled tasks, a technique that can be employed for privilege escalation and maintaining persistence by executing commands with elevated privileges. Attackers may use this method to schedule malicious commands or scripts to run under the context of a privileged user or system account. This behavior fits within the MITRE ATT&CK framework, specifically under the Persistence tactic (T1053.002) and Execution technique.

  The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688, which captures process creation events containing command line parameters and image paths. If this detection is confirmed malicious, it could allow unauthorized command execution or persistence on the system. However, this alert does not confirm that malicious activity occurred solely based on the detection of interactive `at.exe` usage; further investigation is necessary.

  ---

  ### Investigation Steps

  - **Validate Process Creation:** Review Security Event ID 4688 logs for instances where `Image` ends with `\at.exe` and `CommandLine` contains `interactive`. A high-confidence malicious indicator is a process that creates remote or unknown commands lasting beyond normal scheduled task behaviors.

  - **Identify User Context:** Examine the user context under which the `at.exe` command ran. If it is invoked by a service or an unprivileged user, this may indicate potential malicious activity. Note legitimate scheduled tasks created by known administrators.

  - **Assess Scheduled Task History:** Inspect the Windows Task Scheduler (Task Scheduler Library) for any tasks created with the name 'at' or similar naming conventions that run back to unknown script locations. Legitimate tasks typically execute regular maintenance scripts and have clear, documented purposes.

  - **Cross-reference Command History:** For systems with PowerShell or command line access, check the command history or logs for prior `at.exe` executions, which may reveal a series of execution attempts aimed at establishing persistence.

  - **Examine Related Logs:** Seek potential file modifications or unexpected activity in file system logs, specifically for any scripts indicated in the `CommandLine`, as malicious actors may utilize PowerShell scripts or batch files alongside `at.exe`.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential for significant impact on system integrity and the likelihood of misuse since `at.exe` is a well-known target for privilege escalation attacks. The behavior it detects is not commonly seen in normal operations, making it a notable indicator of adversarial tactics.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if `at.exe` was removed from a system during privilege escalation attempts, or the environment lacks proper logging configuration to capture this activity. Similarly, automated background scripts may produce legitimate alerts that need further scrutiny. Log sources such as Windows Task Scheduler and detailed command execution logs would strengthen detection capabilities. Companion detections for scheduled task creation (T1053.001) could enhance coverage of this attack vector.

