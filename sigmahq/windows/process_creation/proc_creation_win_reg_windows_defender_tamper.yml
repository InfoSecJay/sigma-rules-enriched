title: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
id: 452bce90-6fb0-43cc-97a5-affc283139b3
status: test
description: |
  Detects the usage of "reg.exe" to tamper with different Windows Defender registry keys in order to disable some important features related to protection and detection
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
- https://github.com/swagkarna/Defeat-Defender-V1.2.0/tree/ae4059c4276da6f6303b8f53cdff085ecae88a91
- https://www.elevenforum.com/t/video-guide-how-to-completely-disable-microsoft-defender-antivirus.14608/page-2
- https://tria.ge/241231-j9yatstqbm/behavioral1
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel, Nasreddine 
  Bencherchali (Nextron Systems)
date: 2022-03-22
modified: 2025-06-04
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_root_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_root_path:
    CommandLine|contains:
    - 'SOFTWARE\Microsoft\Windows Defender\'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender Security Center'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_0:
    CommandLine|contains|all:
    - ' add '
    - 'd 0'
    CommandLine|contains:
    - 'DisallowExploitProtectionOverride'
    - 'EnableControlledFolderAccess'
    - 'MpEnablePus'
    - 'PUAProtection'
    - 'SpynetReporting'
    - 'SubmitSamplesConsent'
    - 'TamperProtection'
  selection_dword_1:
    CommandLine|contains|all:
    - ' add '
    - 'd 1'
    CommandLine|contains:
    - 'DisableAccess'
    - 'DisableAntiSpyware'
    - 'DisableAntiSpywareRealtimeProtection'
    - 'DisableAntiVirus'
    - 'DisableAntiVirusSignatures'
    - 'DisableArchiveScanning'
    - 'DisableBehaviorMonitoring'
    - 'DisableBlockAtFirstSeen'
    - 'DisableCloudProtection'
    - 'DisableConfig'
    - 'DisableEnhancedNotifications'
    - 'DisableIntrusionPreventionSystem'
    - 'DisableIOAVProtection'
    - 'DisableNetworkProtection'
    - 'DisableOnAccessProtection'
    - 'DisablePrivacyMode'
    - 'DisableRealtimeMonitoring'
    - 'DisableRoutinelyTakingAction'
    - 'DisableScanOnRealtimeEnable'
    - 'DisableScriptScanning'
    - 'DisableSecurityCenter'
    - 'Notification_Suppress'
    - 'SignatureDisableUpdateOnStartupWithoutEngine'
  condition: all of selection_root_* and 1 of selection_dword_*
falsepositives:
- Rare legitimate use by administrators to test software (should always be 
  investigated)
level: high
note: |
  ### Technical Context

  This rule detects the use of `reg.exe` to modify Windows Defender registry keys, potentially disabling critical security features. The likely attacker objective is to impair the system’s defense mechanisms, making it easier to install malware or carry out further attacks undetected. This behavior aligns with the MITRE ATT&CK technique "Impair Defenses" (T1685).

  Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, capturing the command line arguments used. If malicious, the alteration of these registry keys can compromise the entire security posture of the system. This detection alone does NOT confirm that an attack has occurred; legitimate administrative actions may also trigger similar registry modifications.

  ### Investigation Steps

  - **Review the Process Creation Log:** Check Windows Security Event ID 4688 logs for instances where `reg.exe` is executed. Look for `CommandLine` entries containing modifications to the Windows Defender registry paths. Compare against legitimate administration actions.

  - **Examine Command Line Arguments:** Identify whether the command includes keywords like `add`, `d 0`, or `d 1` associated with disabling Defender features. An example of a high-confidence malicious indicator would be `DisableAntiVirus`, which indicates an attempt to disable antivirus protections.

  - **Assess System Impact:** Review the affected system’s role (e.g., server or endpoint) and its criticality within the environment. Systems with heightened importance, such as domain controllers, should be prioritized for immediate investigation.

  - **Identify Legitimate Usage Patterns:** Note rare legitimate scenarios where administrators might modify these keys, such as during testing phases or troubleshooting Windows Defender. Ensure these occasions are documented and pre-approved.

  - **Validate Registries After Modification:** After identifying anomalous command line usage, check to see if the changes in the registry have indeed persisted. Use the registry editor or PowerShell commands (e.g., `Get-ItemProperty` for the specific keys) to verify current settings reflect unauthorized changes.

  ### Prioritization

  This alert holds a high severity in an enterprise context due to the critical nature of Windows Defender in protecting endpoints from threats. The likelihood of malicious abuse is significant, especially if the behavior is associated with known attack techniques, making it a common target for adversaries.

  ### Blind Spots and Assumptions

  Detection can be evaded if attackers utilize alternate methods or privileged access to disable antivirus features without using `reg.exe`. Reliable detection requires logging settings that capture process creation events, and any modifications made by legitimate administrators may inadvertently trigger this alert. Companion detections involving unauthorized software installations or unexpected third-party antivirus disablement can strengthen surveillance against related threats.

