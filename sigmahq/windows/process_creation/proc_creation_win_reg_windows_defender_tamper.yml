title: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
id: 452bce90-6fb0-43cc-97a5-affc283139b3
status: test
description: |
  Detects the usage of "reg.exe" to tamper with different Windows Defender registry keys in order to disable some important features related to protection and detection
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
- https://github.com/swagkarna/Defeat-Defender-V1.2.0/tree/ae4059c4276da6f6303b8f53cdff085ecae88a91
- https://www.elevenforum.com/t/video-guide-how-to-completely-disable-microsoft-defender-antivirus.14608/page-2
- https://tria.ge/241231-j9yatstqbm/behavioral1
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel, Nasreddine 
  Bencherchali (Nextron Systems)
date: 2022-03-22
modified: 2025-06-04
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_root_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_root_path:
    CommandLine|contains:
    - 'SOFTWARE\Microsoft\Windows Defender\'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender Security Center'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_0:
    CommandLine|contains|all:
    - ' add '
    - 'd 0'
    CommandLine|contains:
    - 'DisallowExploitProtectionOverride'
    - 'EnableControlledFolderAccess'
    - 'MpEnablePus'
    - 'PUAProtection'
    - 'SpynetReporting'
    - 'SubmitSamplesConsent'
    - 'TamperProtection'
  selection_dword_1:
    CommandLine|contains|all:
    - ' add '
    - 'd 1'
    CommandLine|contains:
    - 'DisableAccess'
    - 'DisableAntiSpyware'
    - 'DisableAntiSpywareRealtimeProtection'
    - 'DisableAntiVirus'
    - 'DisableAntiVirusSignatures'
    - 'DisableArchiveScanning'
    - 'DisableBehaviorMonitoring'
    - 'DisableBlockAtFirstSeen'
    - 'DisableCloudProtection'
    - 'DisableConfig'
    - 'DisableEnhancedNotifications'
    - 'DisableIntrusionPreventionSystem'
    - 'DisableIOAVProtection'
    - 'DisableNetworkProtection'
    - 'DisableOnAccessProtection'
    - 'DisablePrivacyMode'
    - 'DisableRealtimeMonitoring'
    - 'DisableRoutinelyTakingAction'
    - 'DisableScanOnRealtimeEnable'
    - 'DisableScriptScanning'
    - 'DisableSecurityCenter'
    - 'Notification_Suppress'
    - 'SignatureDisableUpdateOnStartupWithoutEngine'
  condition: all of selection_root_* and 1 of selection_dword_*
falsepositives:
- Rare legitimate use by administrators to test software (should always be 
  investigated)
level: high
note: |
  ### Technical Context

  This Sigma rule detects the invocation of the Windows Registry Editor (`reg.exe`) to modify critical registry keys associated with Windows Defender. Specifically, it identifies commands that disable important security features, such as real-time monitoring and anti-virus capabilities. The likely attacker objective is to disable protective measures, enhancing their ability to deploy malware without detection. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.001).

  The primary telemetry source is process creation logs within Windows, specifically Security Event ID 4688, which captures details on command line executions. If observed, this malicious activity could significantly weaken the organization's security posture, allowing malware to operate unchecked. It is important to note that the detection does NOT confirm a successful breach or malicious activity by itself; further investigation is required to understand the intent behind the registry modification.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for instances where `reg.exe` is called. Focus on the CommandLine field for any entries containing paths associated with Windows Defender, such as `SOFTWARE\Microsoft\Windows Defender\`.

  - **Identify registry modifications:** Look for specific flags in the CommandLine that indicate attempts to disable key features (e.g., `-d 0` for enabling settings and `-d 1` for disabling settings), particularly entries that modify `TamperProtection`, `DisableAntiVirus`, or `DisableRealtimeMonitoring`. These should be treated as high-confidence indicators of potential malicious intent.

  - **Analyze the context of the event:** Determine the user account that executed the command and the time of execution. Legitimate administrative actions may occur but are relatively rare and should be contextualized by the user’s typical behavior and recent changes in the environment.

  - **Correlate with previous activities:** Review the event for nearby logs (e.g., user logins, changes to group policy objects, changes in administrative roles) that could suggest other suspicious activities around the same time frame.

  - **Validate asset criticality:** Assess the system affected by the command for its role within the network. Systems hosting critical assets or sensitive data warrant a higher level of scrutiny and response.

  - **Confirm legitimate administrative use:** Investigate if the modification was part of a sanctioned administrative task, such as software testing or troubleshooting. If the user has a history of legitimate administration, corroborate with ticketing systems or documentation to validate intent.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical systems and the high likelihood that such behavior indicates malicious activity aimed at disrupting security protocols. Modifying Windows Defender settings is a common tactic employed by adversaries seeking to establish persistence and evade detection.

  ### Blind Spots and Assumptions

  The detection may have limitations if logging for process creation is not enabled or is misconfigured, which could lead to missed alerts. Legitimate administrative behavior, while rare, can trigger this alert, necessitating careful review of context. Additionally, an adversary might employ PowerShell or other scripting methods as alternative routes to modify registry settings, which this Sigma rule would not cover. Companion detections focusing on unauthorized registry modifications or unusual PowerShell command execution (e.g., T1086) can enhance coverage and inform a broader incident context.

