title: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
id: 452bce90-6fb0-43cc-97a5-affc283139b3
status: test
description: |
  Detects the usage of "reg.exe" to tamper with different Windows Defender registry keys in order to disable some important features related to protection and detection
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
- https://github.com/swagkarna/Defeat-Defender-V1.2.0/tree/ae4059c4276da6f6303b8f53cdff085ecae88a91
- https://www.elevenforum.com/t/video-guide-how-to-completely-disable-microsoft-defender-antivirus.14608/page-2
- https://tria.ge/241231-j9yatstqbm/behavioral1
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel, Nasreddine Bencherchali
  (Nextron Systems)
date: 2022-03-22
modified: 2025-06-04
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_root_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_root_path:
    CommandLine|contains:
    - 'SOFTWARE\Microsoft\Windows Defender\'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender Security Center'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_0:
    CommandLine|contains|all:
    - ' add '
    - 'd 0'
    CommandLine|contains:
    - 'DisallowExploitProtectionOverride'
    - 'EnableControlledFolderAccess'
    - 'MpEnablePus'
    - 'PUAProtection'
    - 'SpynetReporting'
    - 'SubmitSamplesConsent'
    - 'TamperProtection'
  selection_dword_1:
    CommandLine|contains|all:
    - ' add '
    - 'd 1'
    CommandLine|contains:
    - 'DisableAccess'
    - 'DisableAntiSpyware'
    - 'DisableAntiSpywareRealtimeProtection'
    - 'DisableAntiVirus'
    - 'DisableAntiVirusSignatures'
    - 'DisableArchiveScanning'
    - 'DisableBehaviorMonitoring'
    - 'DisableBlockAtFirstSeen'
    - 'DisableCloudProtection'
    - 'DisableConfig'
    - 'DisableEnhancedNotifications'
    - 'DisableIntrusionPreventionSystem'
    - 'DisableIOAVProtection'
    - 'DisableNetworkProtection'
    - 'DisableOnAccessProtection'
    - 'DisablePrivacyMode'
    - 'DisableRealtimeMonitoring'
    - 'DisableRoutinelyTakingAction'
    - 'DisableScanOnRealtimeEnable'
    - 'DisableScriptScanning'
    - 'DisableSecurityCenter'
    - 'Notification_Suppress'
    - 'SignatureDisableUpdateOnStartupWithoutEngine'
  condition: all of selection_root_* and 1 of selection_dword_*
falsepositives:
- Rare legitimate use by administrators to test software (should always be investigated)
level: high
note: |
  ### Technical Context
  This rule is designed to detect suspicious activity involving the misuse of `reg.exe` for tampering with Windows Defender registry keys. Attackers may employ this technique to disable essential security features of the Microsoft Defender Antivirus, allowing them to operate with reduced risk of detection while conducting malicious actions on a compromised system. The alteration of settings such as real-time protection and cloud protection can significantly increase the likelihood of a successful compromise, as it may lead to undetected malware installation or lateral movement within the network.

  The primary MITRE ATT&CK tactics and techniques relevant to this detection include **Defense Evasion** (TA0005) and specifically the sub-technique **Indicator Removal on Host** (T1562.001). These techniques highlight an attacker's efforts to evade detection by manipulating security settings. The primary data source for this detection includes process creation events, which log command-line activities that can indicate unauthorized modifications to critical security settings.

  ### Investigation Steps
  - **Review Process Creation Logs**: Search for any recent entries involving `reg.exe`, paying close attention to command-line arguments that reference Windows Defender registry keys. Analyze timestamps and the user context to identify the source of the changes.
  - **Analyze Registry Changes**: Utilize Windows Registry auditing tools to track changes made to the keys associated with Windows Defender. Focus on any settings that correlate with known security features and check if they were disabled or altered.
  - **Correlate with User Activity**: Investigate the user accounts associated with the process execution. Determine if legitimate administrative actions were taken at the time or if the changes align with suspicious activity or known attacker behavior.
  - **Conduct Endpoint Response**: For systems where tampering is detected, perform an endpoint response investigation to determine if there are any other signs of compromise or malicious activity, such as unusual application behavior or indicators of lateral movement.

  ### Prioritization
  Given the significant risk that disabling core security features entails and the potential for undetected malicious activity, alerts generated by this detection rule should be prioritized as **high severity**. Immediate investigation is essential to mitigate the risk of a more extensive breach.

  ### Blind Spots and Assumptions
  This detection logic may not capture all potential tampering incidents, particularly if attackers use tools other than `reg.exe` or if they employ more stealthy methods to change registry settings. Additionally, the detection assumes that command-line logging is enabled reliably across systems. Without proper audit configurations, the effectiveness of this detection may be limited, and alerts may be missed entirely. Regular configuration and log checks are crucial to ensure complete coverage.

