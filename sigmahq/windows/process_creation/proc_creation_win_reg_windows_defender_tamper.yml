title: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
id: 452bce90-6fb0-43cc-97a5-affc283139b3
status: test
description: |
  Detects the usage of "reg.exe" to tamper with different Windows Defender registry keys in order to disable some important features related to protection and detection
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
- https://github.com/swagkarna/Defeat-Defender-V1.2.0/tree/ae4059c4276da6f6303b8f53cdff085ecae88a91
- https://www.elevenforum.com/t/video-guide-how-to-completely-disable-microsoft-defender-antivirus.14608/page-2
- https://tria.ge/241231-j9yatstqbm/behavioral1
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel, Nasreddine Bencherchali
  (Nextron Systems)
date: 2022-03-22
modified: 2025-06-04
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_root_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_root_path:
    CommandLine|contains:
    - 'SOFTWARE\Microsoft\Windows Defender\'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender Security Center'
    - 'SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_0:
    CommandLine|contains|all:
    - ' add '
    - 'd 0'
    CommandLine|contains:
    - 'DisallowExploitProtectionOverride'
    - 'EnableControlledFolderAccess'
    - 'MpEnablePus'
    - 'PUAProtection'
    - 'SpynetReporting'
    - 'SubmitSamplesConsent'
    - 'TamperProtection'
  selection_dword_1:
    CommandLine|contains|all:
    - ' add '
    - 'd 1'
    CommandLine|contains:
    - 'DisableAccess'
    - 'DisableAntiSpyware'
    - 'DisableAntiSpywareRealtimeProtection'
    - 'DisableAntiVirus'
    - 'DisableAntiVirusSignatures'
    - 'DisableArchiveScanning'
    - 'DisableBehaviorMonitoring'
    - 'DisableBlockAtFirstSeen'
    - 'DisableCloudProtection'
    - 'DisableConfig'
    - 'DisableEnhancedNotifications'
    - 'DisableIntrusionPreventionSystem'
    - 'DisableIOAVProtection'
    - 'DisableNetworkProtection'
    - 'DisableOnAccessProtection'
    - 'DisablePrivacyMode'
    - 'DisableRealtimeMonitoring'
    - 'DisableRoutinelyTakingAction'
    - 'DisableScanOnRealtimeEnable'
    - 'DisableScriptScanning'
    - 'DisableSecurityCenter'
    - 'Notification_Suppress'
    - 'SignatureDisableUpdateOnStartupWithoutEngine'
  condition: all of selection_root_* and 1 of selection_dword_*
falsepositives:
- Rare legitimate use by administrators to test software (should always be investigated)
level: high
note: |
  ---

  ### Technical Context

  This rule detects attempts to modify critical Windows Defender registry keys using the `reg.exe` command-line utility. By altering these registry keys, an attacker may seek to disable important antivirus protections, facilitating malware execution or undetected lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique "Disable or Modify Tools" (T1562.001), indicating an effort to evade detection rather than directly executing malicious payloads.

  The primary telemetry source is process creation logs, specifically the telemetry generated by `reg.exe`. If malicious, this action could lead to a compromised environment where defenders are blind to active threats. Importantly, this detection does NOT confirm that an attack has occurred; it merely indicates an attempt to tamper with essential security settings, which could also occur during legitimate testing or configuration by administrators.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `reg.exe` being called. Focus on timestamps that match the alert and any command-line arguments tied to modifications in Windows Defender settings.

  - **Review command-line arguments:** Look for uses of `SOFTWARE\Microsoft\Windows Defender\` in the command line. Legitimate administrative tasks may include adding or modifying benign keys, while suspicious activity typically contains `d 0` or `d 1` flags, indicating potential disablement of security features.

  - **Identify high-confidence malicious indicators:** Investigate instances where the command line contains keywords like `DisableAntiVirus`, `TamperProtection`, or `DisallowExploitProtectionOverride`. These are high-confidence indicators of malicious intent. Record the associated process ID and parent process for deeper analysis.

  - **Correlate with Windows Defender logs:** Check Windows Defender logs (Event ID 5007) to see if any alerts or events correspond with the modifications. For instance, if logs indicate previously active protection features are disabled simultaneously with Registry changes, this is strongly indicative of a malicious action.

  - **Document affected systems and asset criticality:** Assign priority to compromised systems based on their roles within the network (e.g., domain controllers, sensitive servers). Evaluate if elevated privileges were used or if there is no record of legitimate administrative workflows.

  - **External threat intelligence review:** Consider any reported exploits or techniques similar to automated attacks against Defender settings, such as those mentioned in associated references. This will help ascertain if this behavior is part of a broader pattern of attacks.

  ---

  ### Prioritization

  The severity of this alert is high, as it indicates potential system-wide exposure due to disabled antivirus protections. Malicious abuse is likely, especially given the prevalence of techniques targeting security defenses in the wild. This behavior is commonly weaponized in targeted attacks and malware campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection is limited to processes using `reg.exe`; attackers may use alternative methods such as PowerShell or DLL injection to achieve the same objectives. Ensure that logging for Sysmon is correctly configured to capture the necessary process creation events. Legitimate administrative actions, though rare, may coincide with alerts and necessitate careful review. Companion detection rules, such as monitoring for PowerShell scripts altering similar registry keys, can enhance coverage and insights into ongoing threats.

