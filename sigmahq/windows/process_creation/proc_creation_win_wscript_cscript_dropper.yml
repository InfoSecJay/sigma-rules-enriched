  ---

  ### Technical Context

  This rule detects the execution of Windows Script Host (WSH) scripts, specifically through `wscript.exe` or `cscript.exe`, initiated from common user directories and temporary folders. The objective of an attacker utilizing this technique may be to deliver a dropper script that installs further malware, often leveraging scripting languages such as JavaScript or VBScript. This behavior aligns with the MITRE ATT&CK technique for Command and Scripting Interpreter (T1059.005) and Windows Command Shell (T1059.007). Primary telemetry sources include Windows event logs, notably Event ID 4688 for process creation and Sysmon Event ID 1 for detailed execution context.

  If the detected activity is malicious, it poses significant risks such as unauthorized access and system compromise, potentially leading to lateral movement or data exfiltration. However, this detection does not confirm the intent of the script execution on its own and should be investigated further to ascertain context and impact.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and/or Sysmon Event ID 1 for instances of `wscript.exe` or `cscript.exe` being executed. Verify the command line arguments for presence of script files (e.g., `.js`, `.vbs`).

  - **Investigate the execution path:** Assess the paths from which the scripts are being executed. Legitimate activity may involve script execution from known, legitimate application directories; however, executions from directories like `C:\Users\Public\` or `C:\Temp\` may be suspicious.

  - **Analyze the command line arguments:** Specifically, look for command line arguments that reference scripts commonly associated with malware (e.g., `*.js` or `*.vbe`). Malicious scripts often show unexpected file names or obfuscation techniques.

  - **Identify known malicious indicators:** Cross-reference the detected script file names with threat intelligence feeds for any known malicious signatures or behaviors associated with reported dropper scripts.

  - **Check for associated network activity:** Look into the network logs (Firewall logs, Proxy logs, or EDR telemetry) for any outbound connections immediately following the script execution. Suspicious connections to known bad IPs or domains can indicate further malicious intent.

  - **Review recent installations or updates:** Some legitimate installers might trigger this behavior. Validate recent installations or system updates that could explain the execution of `wscript.exe` or `cscript.exe`.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact on end-user systems when a dropper script is executed. The likelihood of malicious abuse is moderate, as these scripts can be weaponized by adversaries to gain initial access or load additional malware. Although dropper scripts are commonly used in attacks, the specific context of this alert will dictate the urgency of the response.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate software behavior, as installers can use scripting tools to run processes, possibly leading to false positives. It is crucial to ensure that all relevant logs from Security, Sysmon, and network sources are systematically collected for reliable detection. Legitimate activities, such as administrative scripts for maintenance, may also trigger this alert. Companion detections might include monitoring for suspicious command-line arguments or identifying known IOCs related to scripts and dropper processes from threat intelligence sources.

