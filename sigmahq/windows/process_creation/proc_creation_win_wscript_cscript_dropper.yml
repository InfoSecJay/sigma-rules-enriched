logsource:
  category: process_creation
  product: windows
detection:
  selection_exec:
    Image|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
  selection_paths:
    CommandLine|contains:
    - ':\Temp\'
    - ':\Tmp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  selection_ext:
    CommandLine|contains:
    - '.js'
    - '.jse'
    - '.vba'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: all of selection_*
falsepositives:
- Some installers might generate a similar behavior. An initial baseline is required
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential malicious activity related to the execution of dropper scripts through Windows script hosts, specifically `wscript.exe` and `cscript.exe`. Attackers commonly use these scripts to deliver payloads or exploit vulnerabilities in target systems. The attack scenario involves the execution of scripts located in user directories or temporary folders, which may indicate an attempt to bypass traditional defenses and launch further malicious actions. Attackers leveraging this technique typically aim to achieve initial access and establish a foothold within an environment.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002): The rule specifically targets script execution.
  - **User Execution** (T1203): This is concerned with scenarios where user interaction is required to execute the malicious script.
  - **Scripting** (T1059.005) and **Windows Script Host** (T1059.007): These techniques outline how attackers may use legitimate Windows scripting tools to achieve their aims.

  The primary data sources for this detection are process creation events, which provide insight into script execution, and command line arguments that include paths and extensions indicative of potential malicious scripts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of `wscript.exe` or `cscript.exe` being executed, focusing on time frames surrounding the alert.
  - **Analyze Command Line Parameters**: Look at the command line arguments associated with these processes, specifically checking for suspicious file paths (e.g., containing `:\Temp\` or `:\Users\Public\`) and file extensions that are commonly associated with dropper scripts (e.g., `.js`, `.vbs`).
  - **Check User Activity**: Determine if the user account that executed the script has a legitimate reason to run such scripts, cross-referencing recent activity to identify any unusual behavior.
  - **Correlate with File Creation/Modification Events**: Investigate any related file creation or modification events in the specified directories, as malicious scripts often create or modify files to facilitate further exploitation.

  ### Prioritization
  This alert is considered medium severity due to the potential for initial access or the installation of further payloads in an enterprise environment. Given that script execution can lead to significant breaches if left unchecked, timely investigation is critical.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the execution of scripts from non-standard locations or legitimate scripts that may also trigger this alert, such as system maintenance tasks. The detection logic assumes that most legitimate user activity will not involve running scripts from temporary locations. For successful detection, it's crucial that process creation logs are enabled and correctly configured to capture command line parameters. There is an expectation that a baseline understanding of normal user behavior exists to discern malicious actions from benign ones.

