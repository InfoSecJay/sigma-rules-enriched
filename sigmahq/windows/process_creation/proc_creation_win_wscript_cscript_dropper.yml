detection:
  selection_exec:
    Image|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
  selection_paths:
    CommandLine|contains:
    - ':\Temp\'
    - ':\Tmp\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  selection_ext:
    CommandLine|contains:
    - '.js'
    - '.jse'
    - '.vba'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: all of selection_*
falsepositives:
- Some installers might generate a similar behavior. An initial baseline is 
  required
level: medium
note: |
  ### Technical Context

  This detection rule identifies the execution of scripts using Windows Script Host (WSH) components, specifically `wscript.exe` and `cscript.exe`, with script files commonly located in directories like `C:\Temp\` or `C:\AppData\Local\Temp\`. Such behavior is often employed by attackers to execute malicious scripts or droppers, which can download and execute additional payloads. The likely attacker objective is to deliver malware payloads or establish persistence on compromised systems.

  The relevant MITRE ATT&CK tactics are **Execution** (TA0002) and the techniques are **Command-Line Interface** (T1059.005) and **Scripting** (T1059.007). Key telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments and image paths. If the detected behavior is malicious, it may lead to data exfiltration, unauthorized access, or system compromise. Importantly, this detection alone does not confirm that malicious activity is occurring without further investigation into the context and source of the script execution.

  ### Investigation Steps

  - **Check process creation logs for `wscript.exe` or `cscript.exe`:** Gather Windows Security Event ID 4688 or Sysmon Event ID 1 logs to identify when these executables were run, paying close attention to the command line used for execution.

  - **Review command line arguments for suspicious paths:** Filter the logs for entries with command lines containing paths like `C:\Temp\`, `C:\Users\Public\`, or `C:\AppData\Local\Temp\`. Legitimate scripts typically do not execute from these temporary directories.

  - **Identify file extensions in command lines:** Look for script file types in the command line such as `.js`, `.vbs`, `.wsf`, or `.vb`. The presence of these extensions in unusual execution contexts can indicate potential malicious intent.

  - **Cross-reference with recent user activity:** Check for user activity in proximity to the detected execution. Look for legitimate usage patterns like software installations where installers may spawn script executables, contrasting with unusual execution times or user roles.

  - **Check for associations in AV/EDR tools:** Match the process initiation with threat intelligence reporting or antivirus detection logs to identify if the detected script execution correlates with known malicious behaviors or hash indicators.

  ### Prioritization

  This alert warrants medium severity due to the potential impact on systems with sensitive data or critical functions. Given that this method of execution is commonly employed by adversaries in campaigns, the likelihood of malicious abuse is significant, necessitating swift investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include attackers using legitimate tools or scripts from non-temp directories to disguise malicious activity. Full visibility requires comprehensive logging from Windows event sources; if process execution logs are not properly configured, detection could be incomplete. Legitimate software installers may generate false positives, as they often execute scripts during installation. A related detection approach might include monitoring for unusual outbound network connections following the script execution, which may highlight potential data exfiltration.

