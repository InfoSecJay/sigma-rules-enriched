logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\NimScan.exe'       # Other metadata fields such as originalfilename and product were omitted because they were null
  - Hashes|contains:
    - 'IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C'           # v1.0.8
    - 'IMPHASH=B1B6ADACB172795480179EFD18A29549'           # v1.0.6
    - 'IMPHASH=0D1F896DC7642AD8384F9042F30279C2'           # v1.0.4 and v1.0.2
  condition: selection
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of **NimScan**, a port scanner utility. NimScan is used to proactively identify open ports on remote hosts, which can be leveraged by adversaries to discover vulnerabilities during a post-compromise stage in an environment. By scanning for open ports, attackers may establish entry points for further exploitation, lateral movement, or data exfiltration, seeking to map the network infrastructure thoroughly.

  The primary MITRE ATT&CK tactics relevant to this detection are **Discovery** (Tactic ID: TA0007) and the technique **Network Service Scanning** (T1046). An adversary may utilize NimScan in their reconnaissance phase to gather information on hosts in the network to identify potential targets for exploitation.

  The best telemetry for detecting NimScan activity includes **process creation events** specifically looking for the execution of NimScan executable files, as well as assessing any corresponding log entries that reflect unusual network behavior from the affected systems.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for entries that indicate the execution of `NimScan.exe` and correlate with user accounts and timelines to detect unauthorized or suspicious usage patterns.
  - **Analyze Network Traffic:** Investigate network logs for unusual spikes in scanning activity or outgoing connections, especially targeting multiple ports and hosts within a short timeframe that may indicate automated scanning.
  - **Inspect Host Activity:** Look into additional logs that might show related malicious activities or redundant scanning behaviors hinting at broader reconnaissance efforts, which could lead to further compromise.
  - **Correlate with Threat Intelligence:** Use threat intelligence feeds to validate the presence of NimScan as a tool in the environment and correlate it with known adversary activities that utilize this tool.

  ### Prioritization
  The medium severity alert is warranted due to the potential impact of NimScan usage within an enterprise environment, as port scanning can lead to the discovery of exploitable services or vulnerabilities. Given the increasing prevalence of such tactics by malicious actors, timely intervention is critical.

  ### Blind Spots and Assumptions
  One significant gap is the possibility of legitimate administrative use of NimScan during troubleshooting or network assessments, which may lead to false positives. Additionally, this detection logic assumes that logs for process creation are enabled and configured correctly across all endpoints. Without comprehensive process logging and visibility into network activity, the detection may fail to capture all instances of fraudulent use.

