  ---

  ### Technical Context

  This Sigma rule detects execution of NimScan, a utility often used for network port scanning within compromised environments. The likely attacker objective is to identify open ports and services on target systems, facilitating further exploitation or lateral movement. This behavior corresponds to the MITRE ATT&CK tactic "Discovery" and technique "Network Service Scanning" (T1046). The primary telemetry source is Windows process creation logs, specifically capturing events where NimScan is executed. If malicious, this activity allows adversaries to gain insights into the network topology and potential vulnerabilities of systems. Importantly, this detection does NOT confirm that exploitation occurred; it only indicates the use of a scanning tool.

  ---

  ### Investigation Steps

  - **Check process execution logs:** Review Windows Security Event ID 4688 for any instances of 'NimScan.exe' being executed, focusing on timestamps and the user context under which it was run. Compare hash values with known benign hashes to rule out legitimate usage.

  - **Analyze network activity:** Inspect firewall or network logs for unusual outbound connections or access attempts corresponding to the timing of the NimScan execution. Look specifically for connections to non-standard ports or IP ranges to identify potential scanning activity.

  - **Determine legitimate usage:** Identify any known administrative tasks or scheduled scans in your organization that might use NimScan. Document this to distinguish between authorized and suspicious scanning behavior.

  - **Correlate with threat intel:** Cross-reference the execution logs against your threat intelligence sources or internal adversary behavior profiles to see if this version of NimScan has been linked to known malicious activity or threats.

  - **Identify anomalous user behavior:** Look for suspicious user account patterns or the use of elevated privileges when NimScan was executed, especially if the account typically does not perform network scanning tasks.

  - **Validate presence of persistence mechanisms:** Check for any created or modified scheduled tasks or startup programs that may indicate that NimScan is being used to establish ongoing access to the network.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact of compromised systems being discovered by an adversary. The likelihood of malicious abuse is moderate: while not every usage is inherently harmful, NimScan is often associated with reconnaissance efforts in a malicious context. This behavior is commonly weaponized in targeted attacks, making its detection critical.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques such as modifying NimScan file names or using different scanning tools altogether. Adequate log configurations, specifically for process creation (Event ID 4688), are necessary for reliable detection of this activity. Legitimate activities, such as internal network assessments by trusted IT personnel, may trigger the alert. A related detection to strengthen coverage could include tracking abnormal user logins or lateral movement attempts (e.g., using Mimikatz or PsExec) following the execution of NimScan.

