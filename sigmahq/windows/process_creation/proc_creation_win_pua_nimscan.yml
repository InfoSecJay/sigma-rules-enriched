note: |
  ### Technical Context

  This Sigma rule detects the execution of NimScan, a port scanner utility frequently used by adversaries to identify open ports on compromised systems within a network. The main objective of utilizing NimScan is reconnaissance, which allows attackers to gather information on potential vulnerabilities or services running on remote hosts. This behavior relates to the MITRE ATT&CK framework under the tactic "Discovery" and the technique "Network Service Scanning" (T1046).

  Primary telemetry sources include process creation logs from Windows, particularly focusing on logs that capture the execution of processes with specific image names and hashes associated with the NimScan tool. If malicious, the impact of this activity can facilitate further exploitation by revealing attack paths. It is critical to note that simply detecting NimScan execution does NOT confirm malicious intent without additional context, as it can also be employed in legitimate administrative tasks.

  ### Investigation Steps

  - **Review process execution logs:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 for process creation events with Image Name ending in `NimScan.exe` and matching the known hashes. Look for the user context; an execution by a non-administrative user may indicate malicious activity.

  - **Assess network behavior:** Analyze outbound traffic for any attempts to connect to external IPs or ports, using firewall or proxy logs to identify unusual scanning patterns. Compare against known benign administrator activities, which typically involve accessing specific service ports rather than broad-range port scanning.

  - **Validate user context:** Investigate the user associated with the process execution. Administrator actions that involve NimScan may be part of routine checks, while unexpected execution by non-privileged users raises red flags.

  - **Monitor subsequent actions:** Look for subsequent network connections made after NimScan execution, which can suggest that discovered open ports are being targeted. Utilize Event ID 5156 in Windows Filtering Platform logs to capture allowed connections.

  - **Identify additional scanning tools:** Check for the presence of other suspicious scanning or enumeration tools that may indicate an adversary's toolkit, which might include logs for other known port scanners or similar utilities. Cross-reference file paths and hashes.

  ### Prioritization

  The severity of this alert is medium due to the potential for a compromised application or unauthorized scanning activity that can pave the way for further attacks. The likelihood of malicious use is significant given the nature of tool usage, especially if executed by non-administrative users on sensitive assets.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative activities triggering this alert, especially in environments where network assessments are part of routine work. Reliable detection necessitates comprehensive logging of process creation and adequate hash lists for NimScan binaries. Moreover, legitimate network scans might also generate this alert, making contextual investigation vital. A companion detection that strengthens coverage could involve monitoring for unusual outbound connections post port scanning behavior.

