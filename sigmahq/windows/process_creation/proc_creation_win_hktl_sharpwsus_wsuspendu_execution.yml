title: HackTool - SharpWSUS/WSUSpendu Execution
id: b0ce780f-10bd-496d-9067-066d23dc3aa5
status: test
description: |
  Detects the execution of SharpWSUS or WSUSpendu, utilities that allow for lateral movement through WSUS.
  Windows Server Update Services (WSUS) is a critical component of Windows systems and is frequently configured in a way that allows an attacker to circumvent internal networking limitations.
references:
- https://labs.nettitude.com/blog/introducing-sharpwsus/
- https://github.com/nettitude/SharpWSUS
- https://web.archive.org/web/20210512154016/https://github.com/AlsidOfficial/WSUSpendu/blob/master/WSUSpendu.ps1
author: '@Kostastsale, Nasreddine Bencherchali (Nextron Systems)'
date: 2022-10-07
modified: 2024-08-23
tags:
- attack.execution
- attack.lateral-movement
- attack.t1210
logsource:
  product: windows
  category: process_creation
detection:
  selection_wsuspendu_inject:
    CommandLine|contains: ' -Inject '
  selection_wsuspendu_payload:
    CommandLine|contains:
    - ' -PayloadArgs '
    - ' -PayloadFile '
  selection_sharpwsus_commands:
    CommandLine|contains:
    - ' approve '
    - ' create '
    - ' check '
    - ' delete '
  selection_sharpwsus_flags:
    CommandLine|contains:
    - ' /payload:'
    - ' /payload='
    - ' /updateid:'
    - ' /updateid='
  condition: all of selection_wsuspendu_* or all of selection_sharpwsus_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of SharpWSUS or WSUSpendu, two tools that facilitate lateral movement through Windows Server Update Services (WSUS). These utilities exploit the WSUS infrastructure to gain unauthorized access to networked machines, allowing an attacker to bypass traditional networking restrictions. The usage of such tools often indicates that an adversary has already gained some foothold within the network and is attempting to expand their access, thereby threatening sensitive data and systems.

  The relevant MITRE ATT&CK tactics for this rule include **Execution** (TA0002) and **Lateral Movement** (TA0008). Techniques such as **Exploitation of Remote Services** (T1210) come into play, as these tools often leverage existing WSUS connections to deploy malicious payloads onto targeted systems. Primary data sources for detection include process creation events, which capture command-line arguments of executed processes, providing insights into potential misuse of administrative tools like SharpWSUS and WSUSpendu.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for any instances of process creation involving SharpWSUS or WSUSpendu, especially focusing on command-line arguments that contain indicators such as `-Inject`, `approve`, or `check`.
  - **Check for Anomalous Activity:** Look for unexpected WSUS commands being executed from machines that do not typically perform WSUS management, indicating possible unauthorized lateral movement.
  - **Inspect Network Traffic:** Examine network logs for unusual outbound connections from WSUS servers, correlating this with the timestamps of detected command-line activity to identify possible data exfiltration or communication with external command and control servers.
  - **Audit User Activity:** Investigate the accounts used to execute these tools, checking for unusual or unauthorized logins, especially from accounts that do not have WSUS management permissions.

  ### Prioritization
  Given the potential for extensive lateral movement and privilege escalation within an organization, alerts generated by this detection rule should be considered high severity. The likelihood of these tools being misused in a compromised environment increases the risk of data breaches and impacts on system integrity.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage because SharpWSUS and WSUSpendu could be executed in environments without appropriate logging configurations. The detection logic assumes that malicious command-line arguments will always be logged during process creation, which may not be the case in restricted environments or if auditing has been disabled. To ensure proper functionality of this alert, it is essential to have comprehensive process creation logging enabled and continuously monitored for anomalies.

