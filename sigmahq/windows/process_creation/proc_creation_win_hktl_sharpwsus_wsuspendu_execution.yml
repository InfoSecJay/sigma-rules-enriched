logsource:
  product: windows
  category: process_creation
detection:
  selection_wsuspendu_inject:
    CommandLine|contains: ' -Inject '
  selection_wsuspendu_payload:
    CommandLine|contains:
    - ' -PayloadArgs '
    - ' -PayloadFile '
  selection_sharpwsus_commands:
    CommandLine|contains:
    - ' approve '
    - ' create '
    - ' check '
    - ' delete '
  selection_sharpwsus_flags:
    CommandLine|contains:
    - ' /payload:'
    - ' /payload='
    - ' /updateid:'
    - ' /updateid='
  condition: all of selection_wsuspendu_* or all of selection_sharpwsus_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of SharpWSUS or WSUSpendu, tools often employed for lateral movement within networks through the misuse of Windows Server Update Services (WSUS). Attackers utilizing these tools typically aim to facilitate unauthorized access to other networked systems and exfiltrate data or deploy additional malware. Relevant MITRE ATT&CK techniques include Lateral Movement (T1210) and Execution (T1059). The primary telemetry sources are Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1.

  If these tools are maliciously leveraged, the security impact can be severe, compromising multiple systems and potentially allowing for data breaches. However, this detection alone does not confirm that the activity is malicious; it only indicates that these potentially dangerous tools were invoked and requires further investigation.

  ---

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for process creation logs that include 'SharpWSUS' or 'WSUSpendu' in the command line. Look for processes originating from unusual locations, such as user directories or temp folders, which may indicate malicious intent.

  - **Analyze command line arguments:** Inspect the details in the command line arguments for associated actions (e.g., directives including 'approve', 'create', 'delete', 'check'). Malicious use is indicated by unauthorized or suspicious command line patterns when these utilities are invoked.

  - **Review parent process information:** Identify the parent process of the detected invocation by linking it with Event ID 4688. Legitimate usage often stems from processes like 'wuauclt.exe' or 'wuauserv' under controlled administrative environments, whereas suspicious parents may include cmd.exe or PowerShell.

  - **Assess task sequences in WSUS:** Examine WSUS logs under specific paths for historical commands and approvals associated with the identified process. This may include reviewing update approvals made outside of normal maintenance windows, which would suggest malicious behavior.

  - **Investigate system and network behavior:** Evaluate network logs or firewall data to identify connections initiated by the detected tool, focusing on unusual internal communication patterns or outbound connections that appear anomalous following the detection.

  - **Verify system roles and expected usages:** Determine if the affected system has a legitimate role related to WSUS management tasks. Many internal WSUS servers will have authorized configurations and update schedules; deviation from this can indicate compromise.

  ---

  ### Prioritization

  This alert is of high severity due to the potential ability of SharpWSUS and WSUSpendu to facilitate significant lateral movement within a network. Given their functionality, malicious use is probable, especially in targeted attacks where the deployment of these tools is known to be weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the execution of obfuscated commands or the use of environment variables to mask the invocation of SharpWSUS or WSUSpendu. To ensure reliable detection, all relevant process creation and command line logging must be consistently captured and monitored. Legitimate administrator activities, such as approved patch management processes, may trigger this alert. A related detection to strengthen coverage would be to monitor for abnormal Windows Update changes or unauthorized user access logs within WSUS configurations.

