title: HackTool - SharpWSUS/WSUSpendu Execution
id: b0ce780f-10bd-496d-9067-066d23dc3aa5
status: test
description: |
  Detects the execution of SharpWSUS or WSUSpendu, utilities that allow for lateral movement through WSUS.
  Windows Server Update Services (WSUS) is a critical component of Windows systems and is frequently configured in a way that allows an attacker to circumvent internal networking limitations.
references:
- https://labs.nettitude.com/blog/introducing-sharpwsus/
- https://github.com/nettitude/SharpWSUS
- https://web.archive.org/web/20210512154016/https://github.com/AlsidOfficial/WSUSpendu/blob/master/WSUSpendu.ps1
author: '@Kostastsale, Nasreddine Bencherchali (Nextron Systems)'
date: 2022-10-07
modified: 2024-08-23
tags:
- attack.execution
- attack.lateral-movement
- attack.t1210
logsource:
  product: windows
  category: process_creation
detection:
  selection_wsuspendu_inject:
    CommandLine|contains: ' -Inject '
  selection_wsuspendu_payload:
    CommandLine|contains:
    - ' -PayloadArgs '
    - ' -PayloadFile '
  selection_sharpwsus_commands:
    CommandLine|contains:
    - ' approve '
    - ' create '
    - ' check '
    - ' delete '
  selection_sharpwsus_flags:
    CommandLine|contains:
    - ' /payload:'
    - ' /payload='
    - ' /updateid:'
    - ' /updateid='
  condition: all of selection_wsuspendu_* or all of selection_sharpwsus_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of SharpWSUS and WSUSpendu, tools used for lateral movement through Windows Server Update Services (WSUS). An attacker leveraging these tools aims to exploit misconfigurations within WSUS to propagate malware or execute commands on other systems within the network, effectively bypassing security measures. This behavior aligns with the MITRE ATT&CK tactic of Lateral Movement (TA 0008) and techniques like Command and Control (T1210).

  The primary telemetry sources include Windows process creation logs, specifically focusing on CommandLine argument fields within Security Event ID 4688 or Sysmon Event ID 1. If malicious, the security impact can be significant, as it may indicate a deeper compromise where attackers utilize system management tools for malicious purposes. Importantly, this detection does not confirm that an attack is occurring, only that potentially malicious tools are being executed.

  ### Investigation Steps

  - **Review process creation events: ** Extract Security Event ID 4688 logs for processes containing `SharpWSUS` or `WSUSpendu` in the CommandLine. Look for timestamps around the alert firing. Legitimate process creation for WSUS typically involves 'wuauserv' or 'wuauclt.exe' without significant CommandLine modifications.

  - **Identify malicious CommandLine arguments: ** Analyze the CommandLine fields for terms such as `-Inject`, `-PayloadArgs`, or `-PayloadFile`. The presence of these arguments indicates potential misuse of the tools for malicious lateral movement.

  - **Validate the execution environment: ** Correlate with network environment logs to establish the context of the device executing the alert. Consider if the device has roles associated with WSUS, like patch management; if not, this raises suspicion.

  - **Investigate parent process relationships: ** Check for the parent process of the detected commands from the Sysmon logs (Event ID 1). Look for common benign parent processes like `powershell.exe` or `cmd.exe` as potential indicators of legitimate use versus unexpected escalation.

  - **Assess log collection settings: ** Verify that process creation logs (Event IDs 4688 and 4689, or Sysmon Event ID 1) are being collected adequately across all relevant endpoints, as incomplete data may result in missed detections.

  ### Prioritization

  This alert is high severity due to the criticality of WSUS in enterprise environments and the potential for extensive damage through lateral movement. The vulnerability to these utilities for exploitation makes this behavior a realistic threat, and both tools are documented in attack scenarios that are actively weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logging isn't enabled, as attackers could run these utilities with obfuscation techniques through PowerShell sessions. Legitimate administrative activities can also trigger the alert when using WSUS for batch approvals or updates. Companion detections for abnormal activity in WSUS logs (e.g., Event ID 1016 related to WSUS updates) can enhance observability and improve alert fidelity.

