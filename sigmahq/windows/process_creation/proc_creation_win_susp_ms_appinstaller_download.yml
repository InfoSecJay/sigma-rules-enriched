  ---

  ### Technical Context

  This rule detects the invocation of the "ms-appinstaller" protocol handler through command line activities, specifically when it is constructed with a URL containing the "http" scheme. Attackers may exploit this functionality to download malicious files without raising suspicions, leveraging the AppInstaller framework which is typically used for legitimate software installation processes. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Defense Evasion (T1218).

  The primary telemetry source is the Windows Process Creation logs (Event ID 4688), which detail command line activity. If this behavior is malicious, the security impact can include downloading and executing unauthorized or harmful files that compromise system integrity. Importantly, this detection does NOT confirm the execution or malicious intent of a file; further investigation is needed to ascertain whether any downloaded content poses a risk.

  ---

  ### Investigation Steps

  - **Review command line parameters:** Examine Process Creation logs (Event ID 4688) for entries containing `ms-appinstaller://?source=` along with any HTTP URLs. Look for abnormal querying behavior as a potential malicious indicator.

  - **Check downloaded artifacts:** Navigate to `C:\Users\%username%\AppData\Local\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\AC\INetCache\` and identify any files with unusual names or extensions downloaded around the time of the alert. Malicious files often have executable or script extensions (e.g., .exe, .bat).

  - **Verify typical usage:** Validate if the command line and protocol handler were invoked by known applications or users typically engaged in installation or deployment activities. For example, compare with logs from users in IT or software deployment roles.

  - **Analyze parent processes:** Look for the parent process that initiated the command containing `ms-appinstaller`. Legitimate calls may come from known installers or software configuration management tools; suspicious parents might include unusual executables or scripts.

  - **Cross-reference user behavior:** Review the user's logon history and recent activities. Suspicious behavior, such as execution from non-standard hours or from an atypical host, can indicate malicious exploitation of the protocol handler.

  - **Validate network connections:** Check for outbound connections to suspicious or known malicious hosts caused by the downloaded files. Monitor network logs and DNS queries around the alert timeframe for anomalies.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on system integrity if malicious files are downloaded. The likelihood of adversaries using this method for file download is moderate, as it leverages a legitimate Windows feature. Given the rise in supply chain attacks, such behaviors may also be weaponized more frequently.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of the command being executed for legitimate purposes, such as internal application updates. Malicious actors might modify command line patterns to evade detection. Reliable detection requires comprehensive logging configurations for process creation and should include monitoring for file downloads. Related detections, such as abnormal process injections or unusual outbound connections, can reinforce visibility into potentially malicious activities leveraging this protocol.

