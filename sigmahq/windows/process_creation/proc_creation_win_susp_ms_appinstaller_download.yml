note: |
  ### Technical Context
  This rule detects the use of the "ms-appinstaller" protocol handler in Windows through the command line, which is typically leveraged to download arbitrary files via AppInstaller.EXE. Attackers may exploit this mechanism to deliver malicious payloads, leveraging its inherent trust and execution context to bypass traditional security controls. The downloaded files could be malware or other harmful files aimed at breaching the organization's defenses.

  The relevant attacker objectives include delivering payloads that may facilitate further exploitation or lateral movement within the network. This activity can lead to initial access and potentially execute code remotely, fitting into various stages of the kill chain. In terms of MITRE ATT&CK, this detection aligns with the following tactics and techniques: Execution (T1203) and Defense Evasion (T1218).

  Primary data sources for this detection include process creation events that monitor command-line arguments, particularly those involving the "ms-appinstaller" protocol.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for instances of AppInstaller.EXE being executed with the "ms-appinstaller://?source=" command. Look for unusual command-line arguments that may indicate malicious activity.

  - **Analyze Downloaded Files**: Investigate the specified directory where files are downloaded: `C:\Users\%username%\AppData\Local\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\AC\INetCache\<RANDOM-8-CHAR-DIRECTORY>`. Identify and analyze any files for indicators of compromise (IOCs).

  - **Correlate with Network Activity**: Check network traffic logs or proxy logs for outbound connections related to the command-line activity. Specifically, identify any unusual requests to external hosts during the timeframe of the detected command.

  - **Cross-reference with User Behavior**: Analyze the user account associated with the execution of the AppInstaller process for any suspicious behavior or deviations from normal activity patterns. Pay attention to any unauthorized access attempts involving privilege escalation.

  ### Prioritization
  This alert has a **medium** severity due to the potential risks associated with arbitrary file downloads, which could lead to malware infection or data exfiltration. The likelihood of occurrence is moderate, given that such an attack vector can evade basic security protocols.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage may include systems that do not log or retain sufficient process creation events, particularly if logging is not adequately configured. The detection logic assumes that the "ms-appinstaller" protocol handler is being misused specifically through the command line, which might not capture instances initiated through graphical interfaces or scripting. It is crucial to ensure that logging for process creations is enabled and that command line arguments are being captured in detail for accurate detection.

