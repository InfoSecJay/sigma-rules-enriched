note: |
  ### Technical Context

  This Sigma rule detects the use of the "ms-appinstaller" protocol handler to initiate file downloads via command line, specifically through the use of AppInstaller.EXE. The behavior typically suggests that an attacker might be attempting to leverage this protocol to download malicious files to a user's machine without their explicit consent. The relevant MITRE ATT&CK techniques are "User Execution" (T1203) due to the user's potential execution of a command, and "Scripting" (T1064) if scripted automation is involved.

  The primary telemetry sources are Windows process creation events, specifically Event ID 4688, which logs command-line invocations. If exploited maliciously, this technique may result in arbitrary file downloads that could introduce malware to the environment. It's important to note that this detection alone does not confirm malicious intent, as benign applications might also utilize the AppInstaller protocol for legitimate purposes.

  ### Investigation Steps

  - **Examine the Process Creation Event:** Look for Security Event ID 4688 detailing the command line used. Focus on any instance where `ms-appinstaller://?source=` and an external URL are included.

  - **Analyze the Download Location:** Check `%LOCALAPPDATA%\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\AC\INetCache\`. Identify any recent file downloads; legitimate activity often involves common app updates, while suspect files may have unusual names or extensions.

  - **Review the User Context:** Investigate the user account associated with this activity. Evaluate if the user has a legitimate business need for using AppInstaller or if they typically don’t utilize this feature.

  - **Validate Execution Claims:** Confirm if files downloaded from `ms-appinstaller` were executed. Use Sysmon Event ID 1 to identify subsequent process creations initiated by the downloaded files.

  - **Identify Non-Human Trigger Indicators:** Look for instances where `ms-appinstaller` commands are executed by scripts or automated tasks. This could indicate malicious use while benign activity generally involves user-initiated commands.

  - **Check Egress Traffic:** Monitor outbound connections using firewall or proxy logs. Look for connections to suspicious domains or IP addresses that may correlate with the command execution time, indicating possible attempts at exfiltration or C2 communication.

  ### Prioritization

  This alert is of medium severity in an enterprise context. The impact depends on the system’s criticality and the nature of files downloaded. The likelihood of abuse exists, as leveraging such protocol handlers is a known method used by adversaries. However, this behavior is less commonly weaponized compared to more prominent attack vectors.

  ### Blind Spots and Assumptions

  Detection might miss cases where the protocol is used to deliver benign applications. Additionally, if the logging level is insufficient or if the AppInstaller process is not monitored, detection may fail. Legitimate activities include standard app installations or updates triggered by users, which may also lead to the alert being fired. A related detection might include monitoring for Windows Execution (Event ID 4688) with suspicious command-line patterns, enhancing overall visibility.

