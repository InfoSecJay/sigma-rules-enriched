note: |
  ### Technical Context

  This Sigma rule detects the execution of the "ms-appinstaller" protocol handler via command line, which may indicate that an attacker is attempting to download arbitrary files using AppInstaller.EXE. The likely objective of this behavior is to deliver malware or unwanted applications by exploiting the AppInstaller functionality potentially to evade security mechanisms. This activity fits within the MITRE ATT&CK tactic of Execution (T1203) and Defense Evasion (T1218).

  The primary telemetry sources are Windows process creation events, particularly Security Event ID 4688 and Sysmon Event ID 1, focusing on the CommandLine field. If this behavior is malicious, it can lead to the unauthorized execution of downloaded files, compromising system integrity and confidentiality. It is important to note that this detection does NOT confirm a breach or successful file execution on its own; it merely highlights suspicious command-line usage.

  ### Investigation Steps

  - **Review Process Creation Events**: Filter for Security Event ID 4688 or Sysmon Event ID 1 where CommandLine contains 'ms-appinstaller://?source='. Examine if the source URLs are known and trusted.

  - **Analyze File Download Locations**: Check the temp directory `C:\Users\%username%\AppData\Local\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\AC\INetCache\` for any files created recently following the execution of AppInstaller. Validate if these files are legitimate installers from known providers.

  - **Identify Malicious Indicators**: Look for uncommon or untrusted domains in the CommandLine arguments. Any URL that does not match known software sources is a high-confidence indicator of malicious intent.

  - **Determine Legitimate Use Cases**: Investigate previous usage of AppInstaller in your environment, such as updates or legitimate applications deployed via AppInstaller, that could result in similar command-line executions.

  - **Assess System Role and Criticality**: Check if the affected system has critical roles (e.g., Domain Controller, Database Server). Prioritize investigations on these systems to mitigate potential risks.

  - **Correlate with Network Activity**: If possible, check for related outbound network connections that could correspond to the execution time. Look for HTTP/S requests in network logs that match the suspicious command-line sourced URLs.

  ### Prioritization

  This alert has medium severity due to the potential for malicious file downloads which may compromise system security. Given the functionality of the ms-appinstaller protocol, this behavior could be weaponized, but it is less frequently exploited compared to more common attack vectors.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete process creation logs or if AppInstaller is used legitimately within the environment, potentially generating false positives. Ensure that logging for process creation (Event ID 4688) is enabled universally across all endpoints. Consider augmenting detection strategies with related rules focused on suspicious outbound HTTP/S activity to further guard against successful exploit attempts.

