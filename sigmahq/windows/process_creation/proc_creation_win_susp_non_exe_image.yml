title: Execution of Suspicious File Type Extension
id: c09dad97-1c78-4f71-b127-7edb2b8e491a
status: test
description: |
  Detects whether the image specified in a process creation event doesn't refer to an ".exe" (or other known executable extension) file. This can be caused by process ghosting or other unorthodox methods to start a process.
  This rule might require some initial baselining to align with some third party tooling in the user environment.
references:
- https://pentestlaboratories.com/2021/12/08/process-ghosting/
author: Max Altgelt (Nextron Systems)
date: 2021-12-09
modified: 2023-11-23
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  known_image_extension:
    Image|endswith:
    - '.bin'
    - '.cgi'
    - '.com'
    - '.exe'
    - '.scr'
    - '.tmp'         # sadly many installers use this extension
  filter_main_image:   # Windows utilities without extension
    Image:
    - 'System'
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  filter_main_msi_installers:
    Image|contains: ':\Windows\Installer\MSI'
  filter_main_driver_store:
    Image|contains: ':\Windows\System32\DriverStore\FileRepository\'
  filter_main_msi_rollbackfiles:
    Image|contains: ':\Config.Msi\'
    Image|endswith:
    - '.rbf'
    - '.rbs'
  filter_main_windows_temp:
  - ParentImage|contains: ':\Windows\Temp\'
  - Image|contains: ':\Windows\Temp\'
  filter_main_deleted:
    Image|contains: ':\$Extend\$Deleted\'
  filter_main_empty:
    Image:
    - '-'
    - ''
  filter_main_null:
    Image:
  filter_optional_avira:
    ParentImage|contains: ':\ProgramData\Avira\'
  filter_optional_nvidia:
    Image|contains: 'NVIDIA\NvBackend\'
    Image|endswith: '.dat'
  filter_optional_winpakpro:
    Image|contains:
    - ':\Program Files (x86)\WINPAKPRO\'
    - ':\Program Files\WINPAKPRO\'
    Image|endswith: '.ngn'
  filter_optional_myq_server:
    Image|endswith:
    - ':\Program Files (x86)\MyQ\Server\pcltool.dll'
    - ':\Program Files\MyQ\Server\pcltool.dll'
  filter_optional_wsl:
    Image|contains|all:
    - '\AppData\Local\Packages\'
    - '\LocalState\rootfs\'
  filter_optional_lzma_exe:
    Image|endswith: '\LZMA_EXE'
  filter_optional_firefox:
    Image|contains: ':\Program Files\Mozilla Firefox\'
  filter_optional_docker:
    ParentImage: 'C:\Windows\System32\services.exe'
    Image|endswith: 'com.docker.service'
  condition: not known_image_extension and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of processes that originate from files without a standard executable extension (e.g., ".exe"). By identifying these anomalous process creation events, the rule aims to uncover techniques like process ghosting, where attackers may leverage unusual file types to execute malicious payloads while evading detection. The behavior aligns with MITRE ATT&CK Tactic: Execution (TA0002) and Technique: Process Injection (T1055).

  Primary telemetry sources include Windows security logs (Event ID 4688 for process creation) and Sysmon logs (Event ID 1) that capture process creations and the corresponding image names. If malicious, this behavior can indicate an effort to execute rogue software or obfuscate true intentions. Importantly, this detection does NOT confirm malicious intent on its own; benign applications or legitimate use cases can also spawn non-standard executables.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 logs to correlate the detected process with its parent process. Identify if the parent process is legitimate (e.g., `C:\Windows\System32\services.exe`).

  - **Identify unusual file types:** Focus on captured image names without standard extensions and cross-reference them against known safe binaries. Legitimate applications typically use .exe, .dll, or .msi extensions.

  - **Analyze process behavior:** Examine runtime properties of the flagged process through process monitoring tools (e.g., Process Explorer) to assess its behavior. Look for unauthorized network connections or attempts to access sensitive parts of the file system.

  - **Correlate artifacts:** Verify file creation or modification events within the same timeframe. Use Sysmon Event ID 11 (FileCreate) to look for related files that may indicate a malware dropper or secondary payload.

  - **Identify High-Confidence Malicious Indicators:** Look for execution of known malicious payloads or scripts that leverage name obfuscation or uncommon extensions (e.g., `.tmp`) and signify potential compromise.

  - **Review recent changes or installations:** Investigate recent software installations or updates within the environment that may correlate with the detected event (e.g., logs from Windows Installer) to determine if a newly installed application is triggering the alert.

  ### Prioritization

  This alert has medium severity. While the behavior may indicate potential malicious activity, the likelihood of abuse depends on the context and criticality of the affected system. Non-standard executable files can indicate stealthy attacks, but they may also arise from legitimate applications, warranting further investigation.

  ### Blind Spots and Assumptions

  There are limitations in distinguishing between malicious activity and benign processes, as legitimate software may use non-executable extensions to initiate execution. Effective detection relies on comprehensive logging configurations for both Event ID 4688 and Sysmon Event ID 1, along with consistent process baseline monitoring. Activities such as software installations or updates may inadvertently trigger this alert, especially within environments using unconventional deployment methods or extensions. Related detections could include monitoring for abnormal parent-child process relationships (e.g., parent processes not typically linked to the detected processes).

