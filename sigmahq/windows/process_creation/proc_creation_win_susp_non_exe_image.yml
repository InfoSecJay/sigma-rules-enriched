title: Execution of Suspicious File Type Extension
id: c09dad97-1c78-4f71-b127-7edb2b8e491a
status: test
description: |
  Detects whether the image specified in a process creation event doesn't refer to an ".exe" (or other known executable extension) file. This can be caused by process ghosting or other unorthodox methods to start a process.
  This rule might require some initial baselining to align with some third party tooling in the user environment.
references:
- https://pentestlaboratories.com/2021/12/08/process-ghosting/
author: Max Altgelt (Nextron Systems)
date: 2021-12-09
modified: 2023-11-23
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  known_image_extension:
    Image|endswith:
    - '.bin'
    - '.cgi'
    - '.com'
    - '.exe'
    - '.scr'
    - '.tmp'         # sadly many installers use this extension
  filter_main_image:   # Windows utilities without extension
    Image:
    - 'System'
    - 'Registry'
    - 'MemCompression'
    - 'vmmem'
  filter_main_msi_installers:
    Image|contains: ':\Windows\Installer\MSI'
  filter_main_driver_store:
    Image|contains: ':\Windows\System32\DriverStore\FileRepository\'
  filter_main_msi_rollbackfiles:
    Image|contains: ':\Config.Msi\'
    Image|endswith:
    - '.rbf'
    - '.rbs'
  filter_main_windows_temp:
  - ParentImage|contains: ':\Windows\Temp\'
  - Image|contains: ':\Windows\Temp\'
  filter_main_deleted:
    Image|contains: ':\$Extend\$Deleted\'
  filter_main_empty:
    Image:
    - '-'
    - ''
  filter_main_null:
    Image:
  filter_optional_avira:
    ParentImage|contains: ':\ProgramData\Avira\'
  filter_optional_nvidia:
    Image|contains: 'NVIDIA\NvBackend\'
    Image|endswith: '.dat'
  filter_optional_winpakpro:
    Image|contains:
    - ':\Program Files (x86)\WINPAKPRO\'
    - ':\Program Files\WINPAKPRO\'
    Image|endswith: '.ngn'
  filter_optional_myq_server:
    Image|endswith:
    - ':\Program Files (x86)\MyQ\Server\pcltool.dll'
    - ':\Program Files\MyQ\Server\pcltool.dll'
  filter_optional_wsl:
    Image|contains|all:
    - '\AppData\Local\Packages\'
    - '\LocalState\rootfs\'
  filter_optional_lzma_exe:
    Image|endswith: '\LZMA_EXE'
  filter_optional_firefox:
    Image|contains: ':\Program Files\Mozilla Firefox\'
  filter_optional_docker:
    ParentImage: 'C:\Windows\System32\services.exe'
    Image|endswith: 'com.docker.service'
  condition: not known_image_extension and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects process creation events where the executable image does not correspond to recognized file extensions (e.g., `.exe`, `.com`). This behavior is often associated with atypical process initiation techniques such as process ghosting, which adversaries may employ to bypass detection. The likely attacker objective is to execute malicious payloads or scripts while obscuring their origin, potentially facilitating lateral movement or persistence on a compromised system.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1203), and the technique is **Process Injection** (T1055). Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. The security impact of successfully executing such processes can be significant, leading to malware deployment or system compromise. This detection does not confirm malicious intent on its own; legitimate applications or scripts may occasionally use non-standard extensions.

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Security Event ID 4688 and Sysmon Event ID 1 for suspicious process creation logs. Look for processes with non-standard extensions, especially those not included in the Sigma rule’s exceptions.

  - **Identify Malicious Indicators:** Focus on any created processes within unusual directories (e.g., user profiles or temporary folders). Additionally, determine if the parent process is a known legitimate application or if it shows signs of compromise (like unexpected command lines).

  - **Validate Expected Behavior:** Confirm legitimate process creation by identifying known applications that may generate non-executable files (e.g., installers or script runners). Establish a baseline of normal application activity for context.

  - **Assess Process Parentage:** Investigate the parent process relationships. If the parent process is a legitimate system process (e.g., `explorer.exe`), but the child process is suspicious, flag it for further scrutiny.

  - **Check for File Artifacts:** Search for related file creation or modification events that may have occurred prior to the alert. Look for timestamps and file types consistent with malware operations, particularly in user temp directories or unknown application directories.

  - **Consider Asset Criticality:** Pay attention to the role of the affected hosts. If alerts originate from critical servers or endpoints with sensitive functions (e.g., domain controllers or financial servers), escalate for further analysis.

  ### Prioritization

  The alert severity is moderate. While the behavior detected is often indicative of attempts at stealthier execution methods by adversaries, it may also arise from benign software activities. However, the likelihood of exploitation using such tactics underscores the need for particular scrutiny, especially in critical environments.

  ### Blind Spots and Assumptions

  The rule may not detect evasion techniques such as valid processes being hijacked to initiate malicious payloads or approved software misconfigurations. Required log sources must include comprehensive auditing of process creation, while legitimate applications can generate alerts when employing unconventional file types. A companion detection to strengthen coverage can involve monitoring for unusual network activity concurrent with this alert, helping to identify potential command and control communications.

