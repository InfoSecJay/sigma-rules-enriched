note: |
  ### Technical Context

  This Sigma rule detects the execution of renamed binaries typically exploited by attackers for defense evasion, such as system administration tools or scripts that have been altered to hide their true purpose. The likely objective is to execute malicious payloads while obfuscating activity from security monitoring tools. This behavior aligns with the MITRE ATT&CK technique T1036.003 (Masquerading: Rename System Utilities).

  The primary telemetry source for this detection is Windows Process Creation logs, notably Sysmon logs detailing the `OriginalFileName`. This activity can severely impact the organization by facilitating unauthorized access, data exfiltration, or system compromise. This detection alone does not confirm malicious intent, as legitimate applications may use renamed binaries.

  ### Investigation Steps

  - **Review Process Creation Logs**: Investigate Windows Event ID 4688 or Sysmon Event ID 1 for processes with `OriginalFileName` matching one of the specified binaries. Look for unusual user accounts or unexplained execution times.

  - **Check Process Path and Command Line**: Analyze the `Image` path and command line arguments in the logs for suspicious patterns, especially for binaries executing from temporary folders (e.g., `%TEMP%` or `%APPDATA%`). Legitimate executions often originate from standard directories (e.g., `C:\Windows\System32`).

  - **Validate Parent Process Relationships**: Examine the `ParentImage` field in Sysmon logs to confirm whether the process was spawned by a legitimate process (e.g., `powershell.exe` or `cmd.exe`). Non-standard parent-child relationships can indicate malicious behavior.

  - **Correlate with Known Threat Intelligence**: Utilize threat intelligence platforms to assess whether the renamed binary is associated with known malware, such as those referenced in the provided documentation.

  - **Check for Whitelisted Applications**: Identify if the involved binary has a legitimate purpose within your organization's context. Custom applications using slightly renamed binaries may need to be whitelisted, but ensure that the operational need is legitimate.

  ### Prioritization

  This alert is of **high severity** due to the potential impact on critical systems, especially when involving administrative tools that can facilitate lateral movement or data exfiltration. The likelihood of abuse by attackers is elevated, given the frequent use of these tactics in recent cyber incidents.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of evasion techniques, such as further renaming or using custom variations of the binaries that do not match the rule’s parameters. Reliable detection requires consistent logging from Sysmon with appropriate configuration. Legitimate administrative tasks by IT staff may trigger the alert, particularly if they use tools like PsExec. Related detections, such as those for execution of known malicious file hashes or suspicious script execution, can enhance coverage and threat visibility.

