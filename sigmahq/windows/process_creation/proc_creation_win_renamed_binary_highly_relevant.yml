note: |
  ### Technical Context

  This rule detects execution of commonly abused Windows binaries that have been renamed, often as a means of evasion by malware and attackers. The objective may include executing malicious scripts or tools while avoiding detection by security solutions. This behavior is associated with the MITRE ATT&CK technique: **T1036.003 - Masquerading: Rename File**. The primary telemetry source is process creation events from Windows, specifically logging data from Sysmon's `OriginalFileName` and `Image` fields.

  If malicious, the execution of these renamed binaries can lead to significant security impacts, including unauthorized system access or data exfiltration. It's important to note that this detection alone does not confirm malicious activity; legitimate applications may also use renamed binaries.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Sysmon Event ID 1 logs for processes with `OriginalFileName` matching known binaries (e.g., `powershell.exe`, `mshta.exe`). Analyze process parent-child relationships to identify suspicious execution chains.

  - **Validate File Naming:** Investigate the `Image` field for any processes that end with the names in the filter (e.g., `\powershell.exe`, `\regsvr32.exe`). Identify any deviations from their standard executable paths (e.g., non-standard directories).

  - **Audit Legitimate Applications:** Look for expected behavior where renaming happens for legitimate applications. Custom enterprise apps may use similar naming conventions and should be noted in whitelist policies.

  - **Identify High Confidence Indicators:** Focus on instances of `psexec.exe` or `wmic.exe` executed under unusual account contexts (such as non-admin service accounts). If logged, check for abnormal command-line arguments or execution from suspicious directories.

  - **Examine Related Alerts:** Cross-reference alerts or logs from companion detection systems related to known malicious activity involving these binaries. Companion detections could include lateral movement alerts or privilege escalation events.

  ### Prioritization

  Given the potential for abuse and the critical nature of the binaries involved, this alert should be treated with high urgency. Renamed binaries are commonly used in modern attack methodologies, making the likelihood of malicious intent significant, especially in sensitive environments.

  ### Blind Spots and Assumptions

  This detection may not capture all instances of renamed binaries due to potential obfuscation techniques employed by attackers. If Sysmon is improperly configured or absent, effective monitoring of process creation will be limited. Furthermore, benign scenarios may occur where custom applications rename binaries for legitimate purposes. A related detection to consider is monitoring for unusual `cmd` or PowerShell executions that might accompany the renamed binaries and indicate a broader attack strategy.

