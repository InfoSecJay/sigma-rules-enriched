  - Product: 'Sysinternals PsExec'
  - Description|startswith:
    - 'Windows PowerShell'
    - 'pwsh'
  - OriginalFileName:
    - 'certutil.exe'
    - 'cmstp.exe'
    - 'cscript.exe'
