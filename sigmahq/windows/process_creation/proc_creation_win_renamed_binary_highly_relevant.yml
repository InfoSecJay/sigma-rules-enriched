    - 'reg.exe'
    - 'regsvr32.exe'
    - 'rundll32.exe'
    - 'WerMgr'
    - 'wmic.exe'
    - 'wscript.exe'
  filter:
    Image|endswith:
    - '\certutil.exe'
    - '\cmstp.exe'
