note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of highly relevant binaries that have been renamed, a common technique used by attackers to evade detection. The likely motive behind such behavior is to execute malicious code while avoiding security controls that monitor for known file names. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (T1203), specifically the technique of Masquerading (T1036.003).

  The primary telemetry sources for this detection include Windows process creation logs, particularly Sysmon Event ID 1, which captures process creation events and includes fields such as `OriginalFileName`. If malicious, this behavior could signal an active compromise aiming to execute malware under the guise of a legitimate process. Importantly, this detection alone does not confirm malicious activity, as legitimate applications may utilize renamed binaries.

  ---

  ### Investigation Steps

  - **Review Sysmon logs for process creation events**: Check for Sysmon Event ID 1 and focus on the `Image` and `OriginalFileName` fields. Compare against the predetermined list of targeted binaries to identify potential malicious activity.

  - **Identify benign instances of renamed binaries**: Look for any known custom applications that may use binaries with slight renaming, e.g., `powershell_custom.exe`. Whitelist these to avoid false positives.

  - **Correlate with other alerts**: Analyze any related alerts or logs from additional detection tools (e.g., EDR solutions) for further context on the user's actions leading up to the alert. Pay attention to unusual command-line arguments or network activity following the execution.

  - **Check for common malicious indicators**: Look specifically for `powershell.exe` or `cmd.exe` being called alongside suspicious command lines that could indicate scripting or automation techniques often used in attacks (e.g., use of `-ExecutionPolicy Bypass`).

  - **Assess system criticality and role**: Evaluate the affected host's role within your environment. For instance, if the host is a critical server, the alert severity and investigation urgency are heightened.

  - **Evaluate for file creation/exfiltration artifacts**: Look for any creation of files in temporary or unusual directories that coincide with the execution, including apps like `mshta.exe` and `rundll32.exe`, which may be used to serve payloads.

  ---

  ### Prioritization

  The alert is of high severity, particularly if triggered on critical systems capable of processing sensitive data. The likelihood of abuse from renamed known binaries is significant, as many of these executables are frequently weaponized in attacks targeting enterprises.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers renaming files or using less common binaries. Reliability of detection depends on the inclusion of Sysmon logging; without it, visibility into process creation events is limited. Legitimate applications may trigger this alert when using renamed binaries. Companion detections related to PowerShell or command-line behavior can strengthen coverage of this issue and help correlate activities effectively.

