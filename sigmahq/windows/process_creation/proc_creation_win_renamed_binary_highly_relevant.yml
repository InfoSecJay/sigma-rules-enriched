note: |
  ### Technical Context
  This detection rule identifies the execution of commonly used Windows binaries that have been renamed, which is a technique employed by attackers to evade detection. Renaming system binaries allows malicious actors to hide their activities, as security tools may not flag the execution of these binaries if they don't match expected filenames. The rule leverages Sysmon’s `OriginalFileName` field to ascertain the legitimacy of the binary in question.

  Threat scenarios associated with this detection include the execution of renamed binaries for lateral movement, malware deployment, or obtaining unauthorized access, often with the goal of maintaining persistence or escalating privileges. Attackers may use tools like PsExec or PowerShell to execute these renamed binaries remotely, effectively blending in with normal system activities while performing malicious actions.

  This detection aligns with multiple MITRE ATT&CK techniques, particularly under the tactic of Defense Evasion. Key techniques include:
  - T1036.003: Masquerading: Renamed binaries
  The primary data sources for effective evidence gathering include process creation logs from Sysmon, which detail executable file launches and their associated metadata, such as the original filename and image path.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Sysmon process creation logs for instances where the `OriginalFileName` field matches known malicious binaries, even if the `Image` used is renamed. Focus on any unusual activity involving those binaries.

  - **Analyze Unusual Command Execution**: Investigate commands executed with potential renamed binaries, particularly those initiated through remote execution tools like PsExec or PowerShell. Cross-reference execution times with user activity logs for anomalies.

  - **Correlate with Threat Intelligence**: Check against known threat indicators for recent attacker tools or techniques that leverage renamed binaries, especially for the identified executables. Incorporating threat intelligence can help determine if activity appears suspicious based on context.

  - **Inspect User and Network Behavior**: Monitor user behavior around the times of execution to spot potential misuse of legitimate tools. Analyze network connection attempts associated with the revealed processes for indications of lateral movement or data exfiltration.

  ### Prioritization
  The severity of this alert is high due to the critical nature of binaries involved often used for legitimate administrative tasks, which adversaries can exploit. The likelihood of these events indicates a potential compromise or ongoing attack, necessitating prompt analysis and response.

  ### Blind Spots and Assumptions
  Detection effectiveness may be limited when custom applications utilize similar renamed binaries, leading to potential false positives. The logic presumes that the `OriginalFileName` field is consistent and accurately populated for all binaries, which may not hold true for all execution scenarios (e.g., certain installations of PsExec). Additionally, sufficient logging and configuration of Sysmon are essential for this detection rule to function effectively; without comprehensive logging, critical activities may be missed.

