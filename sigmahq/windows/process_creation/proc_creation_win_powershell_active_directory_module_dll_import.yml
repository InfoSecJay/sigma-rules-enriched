note: |
  ### Technical Context
  This detection rule identifies the use of the Import-Module cmdlet to load the Microsoft.ActiveDirectory.Management.dll, which is frequently leveraged by attackers for Active Directory (AD) enumeration. AD enumeration is a technique employed by adversaries to gather information about user accounts, computer accounts, and group memberships, often prior to executing further attacks such as privilege escalation or lateral movement. The primary objective is to identify vulnerable accounts or misconfigurations that can be exploited to gain unauthorized access to critical resources.

  Relevant MITRE ATT&CK tactics associated with this behavior include Reconnaissance (TA0043) and Discovery (TA0007), specifically techniques such as Active Directory Enumeration (T10679) and PowerShell (T1059.001). The utilization of PowerShell scripts allows attackers to perform these reconnaissance activities stealthily within a target environment. The most effective data sources for capturing evidence of these activities are process creation event logs that capture the command line arguments passed to PowerShell, which provide context for the operations being performed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate all recent process creation logs involving powershell.exe or pwsh.exe, focusing on the CommandLine field for any occurrences of "Import-Module" and "Microsoft.ActiveDirectory.Management.dll."

  - **Analyze Command Line Arguments:** Pay special attention to the command line arguments executed alongside the Import-Module statements. Look for unusual or unauthorized syntaxes that might indicate malicious intent or abnormal usage patterns.

  - **Check for User Context:** Determine the user accounts executing these commands. Investigate whether these accounts have the necessary privileges and if their activity aligns with their typical behavior patterns.

  - **Correlate with Other Logs:** Cross-reference findings with additional logs, such as event logs from Azure AD or Windows Security logs, for any further indications of unauthorized access or suspicious enumeration activities.

  ### Prioritization
  This alert is categorized as medium severity due to its potential impact on an organization's security posture; successful AD enumeration directly facilitates lateral movements and privilege escalation, increasing the likelihood of a broader breach.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the absence of monitoring for legitimate administrative actions that might involve the same cmdlet for authorized purposes. The detection logic assumes that any instance of the Import-Module cmdlet loading the specified DLL is suspicious, which may lead to false positives. Additionally, a requirement for accurate detection is that the process creation logs must be enabled and properly configured to capture comprehensive command line details.

