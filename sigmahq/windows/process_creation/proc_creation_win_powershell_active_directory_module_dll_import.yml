note: |
  ### Technical Context

  This Sigma rule detects the use of the PowerShell `Import-Module` cmdlet to load the `Microsoft.ActiveDirectory.Management.dll` library, a common tactic employed by attackers for Active Directory enumeration. The objective is often to gather sensitive information about user accounts, groups, and other directory services that can aid in further attacks such as privilege escalation or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Active Directory enumeration (T1046), which falls under the reconnaissance tactic.

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring PowerShell execution. Event IDs 4688 (Process Creation) and 4104 (PowerShell Script Block Logging) are essential for capturing this activity. If this behavior is malicious, it can result in an unauthorized disclosure of sensitive directory information, leading to increased risk for the organization. Notably, this detection does not confirm the intent behind the PowerShell command; it could be part of legitimate administrative tasks.

  ### Investigation Steps

  - **Verify process execution details:** Review Windows Event ID 4688 for the process creation event. Look for `Image` fields ending with `powershell.exe` or `pwsh.exe` and correlate the `CommandLine` containing `Import-Module` and `Microsoft.ActiveDirectory.Management.dll`.

  - **Evaluate the legitimacy of the command:** Investigate the user account associated with the process. Determine if the user belongs to an administrative role or if the execution context is suspicious. Legitimate use typically involves known administrators running common admin tasks.

  - **Inspect execution context and environment:** Check for concurrent tasks using Event ID 4104 for possible script block logging. Examine the `ScriptBlock` field for context around the command. Legitimate modules may be used alongside other common PowerShell commands, indicating standard administrative functions.

  - **Identify malicious indicators:** Look for anomalous patterns such as the execution of PowerShell without prior administrative context, especially from non-administrative accounts or unusual hosts. Any direct invocation of sensitive modules in an unexpected sequence should be considered suspicious.

  - **Correlate with historical activity:** Cross-reference the user's command history in PowerShell to identify if similar enumeration commands have been executed previously. This can provide insight into repeated reconnaissance attempts potentially linked to a targeted attack.

  ### Prioritization

  This alert indicates a medium severity due to the potential impact of unauthorized Active Directory enumeration, which could facilitate further attacks. Given the targeted nature of AD enumeration, the likelihood of malicious exploitation is moderate but should be assessed based on the user's role and context. This technique is often weaponized in real-world attacks, underscoring the need for urgency.

  ### Blind Spots and Assumptions

  Detection may be limited by the deployment of PowerShell logging or if logging levels for script block executions are not adequately configured. Evasion techniques such as obfuscating command syntax may bypass detection. Legitimate administrative actions against the Active Directory might trigger this alert, emphasizing the need for context in the investigation. A companion detection could involve monitoring for unusual LDAP queries, providing layered visibility into potential reconnaissance activities.

