note: |
  ### Technical Context

  This Sigma rule detects the execution of `devinit.exe` with specific command line arguments that indicate an attempt to download and install arbitrary MSI packages. This behavior is often seen when attackers leverage "living off the land" binaries (LOLBINs) to evade detection, aiming to install malware or other malicious software on a compromised system. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1218, which pertains to the use of system tools for execution.

  The primary telemetry sources necessary for detection include Windows Process Creation events, specifically Security Event ID 4688 or Sysmon Event ID 1. Malicious activity could lead to installation of backdoors, remote access tools, or other forms of malware impacting confidentiality, integrity, and availability of targeted systems. It’s critical to note that this detection does not confirm malicious intent on its own, as benign applications could utilize similar command line flags under legitimate circumstances.

  ### Investigation Steps

  - **Check the process execution history:**
    Use Windows Security Event ID 4688 to verify the creation of `devinit.exe`. Review the CommandLine field for the presence of `-t msi-install` and `-i http`. Benign execution typically shows no network-related command line arguments.

  - **Correlate with network activity:**
    Look for outbound connections linked to the command execution in your firewall logs or network monitoring tools (e.g., DNS query logs). Identify entries where `devinit.exe` downloads MSI files; legitimate executions should not result in unexpected internet traffic.

  - **Analyze parent process relationships:**
    Review the parent process of `devinit.exe` (Event ID 4688 or Sysmon Event ID 1) to determine the context of execution. If invoked by a known system or administrative tool, it might be benign. Malicious indicators include execution initiated from non-standard applications or user contexts.

  - **Validate sign integrity of the downloaded MSI:**
    After execution, check for MSI files created or modified in common application directories (e.g., C:\ProgramData\Microsoft\Windows\Start Menu\Programs). Use file system logs to validate the presence and integrity of these potentially harmful payloads.

  - **Identify related alerts or detections:**
    Monitor for other related anomalies such as unusual Windows service creation (Security Event ID 7045), which may support the deployment of a backdoor following the execution of `devinit.exe`.

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact if exploited, particularly if it installs unauthorized software on critical systems. The likelihood of abuse is high, as malicious actors commonly exploit LOLBINs for stealth operations. This specific behavior has been documented in several attack scenarios leveraging `devinit.exe`.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is incomplete, particularly if process creation logs aren't universally collected or if command line arguments are stripped by certain logging configurations. Additionally, benign usage patterns may exist where IT operations utilize `devinit.exe` for legitimate software deployments. A related detection that could improve coverage includes monitoring for unusual file creation events associated with newly installed MSI packages (e.g., tracking Event ID 4663).

