title: Arbitrary MSI Download Via Devinit.EXE
id: 90d50722-0483-4065-8e35-57efaadd354d
status: test
description: Detects a certain command line flag combination used by 
  "devinit.exe", which can be abused as a LOLBIN to download arbitrary MSI 
  packages on a Windows system
