logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains|all:
    - '-Sta'
    - '-Nop'
    - '-Window'
    - 'Hidden'
    CommandLine|contains:
    - '-Command'
    - '-EncodedCommand'
  selection_2:
    CommandLine|contains:
    - 'sv o (New-Object IO.MemorySteam);sv d '
    - 'mshta file.hta'
    - 'GruntHTTP'
    - '-EncodedCommand cwB2ACAAbwAgA'
  condition: 1 of selection_*
level: high
note: |
  ### Technical Context
  This detection rule is focused on identifying the use of Covenant, a post-exploitation tool commonly utilized by attackers for remote control and lateral movement within compromised networks. By analyzing the command line arguments associated with process creation events, the rule seeks to unveil potentially malicious activities stemming from Covenant's PowerShell launcher. Attackers leveraging Covenant aim to establish persistence, execute commands, and evade detection by using obfuscated PowerShell commands.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Execution (T1203)**, concerning the execution of malicious scripts, and **Defense Evasion (T1564.003)**, which pertains to the use of obfuscation techniques like encoded commands to avoid detection. Therefore, the ability to detect these specific command line patterns is crucial in mitigating the risk of unauthorized access and lateral movement facilitated by Covenant.

  The primary data sources for this detection are **process creation logs**, specifically on Windows systems, which provide insights into the command lines used during the execution of processes. Analyzing these logs helps to reveal any suspicious command executions that could signal Covenant activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs for suspicious command lines that match detection criteria, focusing on entries that include PowerShell commands with obfuscated or unusual arguments.
  - **Identify Related Network Activity**: Investigate any associated network connections or communications initiated by processes matching the suspect command lines. Lookup logs for connections to known malicious IPs or unusual destinations.
  - **Correlate with User Activities**: Assess user account activities during the time of detection to determine if the command execution was initiated by an unusual user or during an atypical time period for the user’s behavior.
  - **Examine System Artifacts**: Look for remnants of Covenant or other related tools within the system, such as indicator files or scripts that may corroborate the presence of the tool and provide further context to the investigation.

  ### Prioritization
  The severity of this alert is rated as high due to the potential impact that successful Covenant exploitation can have on an organization, including unauthorized access, data exfiltration, and further lateral movement through the network. The likelihood of encountering such tools in attacks has increased, necessitating prompt investigation and response.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the PowerShell logging is not enabled or if process creation logs are not retained long enough for retrospective analysis. The detection logic assumes that Covenant will utilize specific command line patterns, which may not cover all possible obfuscation techniques that an attacker could employ. Additionally, the effectiveness of this detection relies on the proper configuration of logging settings within Windows environments to capture detailed command line arguments.

