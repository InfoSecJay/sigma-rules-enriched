logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains|all:
    - '-Sta'
    - '-Nop'
    - '-Window'
    - 'Hidden'
    CommandLine|contains:
    - '-Command'
    - '-EncodedCommand'
  selection_2:
    CommandLine|contains:
    - 'sv o (New-Object IO.MemorySteam);sv d '
    - 'mshta file.hta'
    - 'GruntHTTP'
    - '-EncodedCommand cwB2ACAAbwAgA'
  condition: 1 of selection_*
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious command lines associated with Covenant PowerShell launchers that are indicative of potential malicious activity. The likely attacker objective involves executing payloads or establishing persistence by leveraging PowerShell through hidden or obfuscated command execution. This behavior corresponds to the MITRE ATT&CK technique for PowerShell (T1059.001) and the steganography technique (T1564.003).

  Key telemetry sources include Windows process creation logs (Event ID 4688) that capture command line arguments. If malicious, such activity may indicate an active post-exploitation phase of an attack, potentially leading to data exfiltration or additional lateral movement. It is crucial to note that this detection does NOT confirm an active compromise on its own and must be correlated with other security events for context.

  ### Investigation Steps

  - **Check the command line for suspicious arguments**: Review Windows Security Event ID 4688 logs for command lines containing flags such as '-Sta', '-Nop', '-Window', or 'Hidden'. Compare to known benign PowerShell commands or scripts executed in your environment.

  - **Identify any use of encoded commands**: Search for command lines containing '-EncodedCommand' or strings like 'cwB2ACAAbA' to detect attempts to obfuscate operations. Any encoding should be justified and part of legitimate automation.

  - **Determine expected behavior for legitimate PowerShell usage**: Analyze recent PowerShell operations in your environment, noting typical command patterns and expected processes that do not raise this alert, especially during approved administrative tasks or automation.

  - **Correlate detected activity with other endpoints**: Investigate whether the suspicious command execution aligns with unusual behavior across other hosts, such as attempting to download or execute files through 'mshta' or calling 'GruntHTTP'.

  - **Verify any file creation or persistence mechanisms used**: Look for related artifacts such as newly created files (e.g., HTA files) using Windows Security Event ID  creation logs. Identify any processes that have unusual parent-child relationships which could indicate persistence techniques.

  ### Prioritization

  This alert carries high severity due to the potential impact on critical systems and data if such techniques are leveraged by adversaries for post-exploitation. Command lines linked to PowerShell launchers in Covenant are commonly weaponized by attackers for executing malicious payloads, warranting immediate attention.

  ### Blind Spots and Assumptions

  One limitation of this detection is the evasion potential via alternate PowerShell execution methods or implementations that do not utilize the specified command line arguments. Reliable detection requires comprehensive logging (including PowerShell execution policies) and correct configuration of system monitoring. Legitimate automation scripts or administrative maneuvers might trigger this alert, necessitating careful review. Companion detections, such as monitoring for known malicious PowerShell modules or pre-existing scheduled tasks, can provide enhanced coverage against these threats.

