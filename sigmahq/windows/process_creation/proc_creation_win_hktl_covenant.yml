logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains|all:
    - '-Sta'
    - '-Nop'
    - '-Window'
    - 'Hidden'
    CommandLine|contains:
    - '-Command'
    - '-EncodedCommand'
  selection_2:
    CommandLine|contains:
    - 'sv o (New-Object IO.MemorySteam);sv d '
    - 'mshta file.hta'
    - 'GruntHTTP'
    - '-EncodedCommand cwB2ACAAbwAgA'
  condition: 1 of selection_*
level: high
note: |
  ### Technical Context

  This rule detects the use of suspicious command-line arguments commonly associated with Covenant PowerShell launchers, which are tools used by adversaries for remote access and command execution on compromised systems. The likely attacker objective is to execute malicious scripts or commands stealthily by utilizing encoded PowerShell commands, which can evade simple detection mechanisms. This behavior relates to the MITRE ATT&CK tactic of Execution (TA0002), specifically the technique of PowerShell (T1059.001) and the Defense Evasion technique of Obfuscated Files or Information (T1564.003).

  The primary telemetry source for this detection is the process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1, which log command-line parameters. If executed successfully, these commands could lead to system compromise and unauthorized data access. It is important to note that this detection does NOT confirm malicious activity by itself; it indicates potential suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Check Process Creation Logs**: Identify processes with Security Event ID 4688 or Sysmon Event ID 1, focusing on command lines containing '-Sta', '-Nop', or other specified parameters. Compare with known legitimate use cases of PowerShell.

  - **Validate Command Context**: Examine the originating user and the execution context (e.g., whether it's running from a user profile or a service account). Legitimate PowerShell scripts may include common administrative tasks rather than encoded commands or hidden windows.

  - **Analyze Network Connections**: Look for any outbound connections from the host using firewall logs or network monitoring tools that coincide with the execution time of the detected commands, particularly for suspicious endpoints or unusual traffic patterns.

  - **Investigate Parent Process Relationships**: Correlate the detected process with its parent process. If the parent is a well-known script or legitimate administrative tool (e.g., PowerShell ISE), this may indicate benign behavior. Conversely, unexpected parent processes could indicate malicious intent.

  - **Identify High-Confidence Indicators**: Look for command lines containing 'GruntHTTP' or structured commands that appear heavily obfuscated, such as those starting with 'EncodedCommand cwB2ACAAbA', which are commonly associated with Covenant activity.

  - **Review File System Changes**: Check for file creation or modification events related to PowerShell scripts, HTA files, or other files specified in the command lines (e.g., those containing 'mshta file.hta') to confirm if potentially malicious files were introduced into the environment.

  ### Prioritization

  Alerts generated by this detection are categorized as high-severity due to the potential impact of remote command execution and the significant risk of exploitation via known malicious tools. The likelihood of abuse is significant because these specific command-line patterns are directly linked to active threat actor techniques, making this behavior indicative of a potential compromise.

  ### Blind Spots and Assumptions

  There are limitations in detection as legitimate administrative actions may also invoke similar command-line structures, which can lead to false positives. Required log sources include both process creation and Sysmon logs for comprehensive visibility. Awareness of legitimate PowerShell usage in your environment is crucial, as administrative scripts may involve similar syntax. A companion detection strategy involving the monitoring of suspicious outbound connections or administrative command execution could enhance overall security posture against Covenant and similar threats.

