note: |
  ### Technical Context

  This Sigma rule detects the presence of encoded Base64 strings that represent MZ headers, commonly associated with the execution of malware or shellcode on a Windows system. The likely objective of an attacker triggering this detection is to execute malicious payloads or exploit existing vulnerabilities on the host. This behavior is mapped to the Execution tactic in the MITRE ATT&CK framework, specifically the technique T1203 (Exploitation for Client Execution).

  Primary telemetry sources include Windows process creation events (Event ID 4688) and Sysmon logs (Event ID 1) that capture command-line arguments. If the detection indicates malicious activity, it may reflect a significant compromise, potentially leading to system infiltration or lateral movement within the network. However, the detection does NOT confirm that the executed process is inherently malicious on its own; additional context is required.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 and Sysmon Event ID 1 for command-line arguments containing MZ Base64 strings such as 'TVqQAAMAAAAEAAAA'. Look for unusual parent-child process relationships, particularly those with non-standard applications initiating these command lines.

  - **Identify high-confidence malicious indicators**: Look for known hashes or signatures associated with malware that exploit MZ headers, such as binaries related to CryptoMiners or APT groups. Cross-reference against threat intelligence sources for potential matches.

  - **Evaluate normal operational behavior**: Watch for expected command lines in legitimate applications, which should not contain suspicious MZ Base64 strings. Identify common legitimate tools in your environment that may produce benign process executions for validation.

  - **Monitor for file creation and execution**: Check for unusual file creation events (Sysmon Event ID 11 or Security Event ID 4663) that coincide with the appearance of the suspicious command line. This may point to the extraction and execution of malware binaries.

  - **Assess system impact**: Determine if the affected host is critical, such as a domain controller or a server hosting sensitive data. Assign higher urgency for investigation if the alert originates from such systems.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact of a successful malware execution on critical enterprise assets. Malicious abuse is highly likely, given that MZ header patterns are frequently leveraged in known malware campaigns. This behavior is also often weaponized, underscoring the need for rapid investigation and response.

  ### Blind Spots and Assumptions

  Limitations of this detection include its inability to distinguish between benign and malicious uses of MZ signatures without additional context. Ensure that appropriate logs, such as Sysmon configurations, are in place for reliable detection. Legitimate software, especially certain installers or development tools, might inadvertently trigger this alert by utilizing MZ headers. A related detection rule that could enhance coverage might involve monitoring for unusual network communications from processes that executed with these command lines, checking for external command and control activity.

