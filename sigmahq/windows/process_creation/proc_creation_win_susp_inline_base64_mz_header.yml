title: Base64 MZ Header In CommandLine
id: 22e58743-4ac8-4a9f-bf19-00a0428d8c5f
status: test
description: Detects encoded base64 MZ header in the commandline
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-12
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - 'TVqQAAMAAAAEAAAA'         # MZ..........
    - 'TVpQAAIAAAAEAA8A'
    - 'TVqAAAEAAAAEABAA'
    - 'TVoAAAAAAAAAAAAA'
    - 'TVpTAQEAAAAEAAAA'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where a Base64 encoded MZ header is found within command line arguments during process creation on Windows systems. The presence of these specific signatures indicates that a potentially malicious executable, likely delivered via a scripting or command-line interface, may be attempting to execute or install itself. Attackers frequently use encoded payloads to obfuscate their activities and evade detection mechanisms.

  The threat scenario suggests malicious actors may be attempting to deploy malware such as crypto miners (e.g., XMRig, as referenced in associated threats) or other types of remote access tools. The objective is usually to gain unauthorized access to the system or to exploit the computing resources for crypto mining. In terms of the MITRE ATT&CK framework, the relevant tactics are Execution and possibly Persistence, employing techniques such as "Command and Scripting Interpreter" (T1059) and “Scheduled Task/Job” (T1053).

  Primary data sources for effective detection include process creation logs which capture command line execution details, particularly from Windows Event IDs 4688 that log whenever a new process is created.

  ### Investigation Steps
  - **Review Process Creation Logs:** Look at logs for suspicious commands that include the detected Base64 strings. Focus on the associated user accounts and processes to assess if they are legitimate or indicative of malicious intent.
  - **Analyze Parent Process:** Investigate the parent process of the detected command-line execution. Determine if it is coming from a legitimate application or a potentially compromised system and check for any known malware indicators related to the parent process.
  - **Cross-Check with Threat Intelligence:** Use threat intelligence sources to correlate the detected command lines with known malicious activities or signatures, especially for the detected Base64 strings. Check if they are linked to any recent attack patterns or malware families.
  - **Monitor System Behavior:** Observe system performance and network activity following the detection of the encoded MZ header. Look for unusual outbound connections or spikes in resource usage, which could indicate that the payload is trying to execute.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of executing malware on enterprise endpoints, which could lead to data exfiltration, resource exploitation, or deployment of further malicious payloads.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that the Base64 strings may not capture all variations of encoded payloads, especially if attackers use different encoding methods or modify the MZ header. The detection logic assumes that the presence of the specific Base64 encoded strings is indicative of malicious intent, which may not always be the case in environments with legitimate uses of similar command lines. Additionally, the rule relies on process creation logs; without proper logging enabled, detection will fail to trigger as intended.

