note: |
  ### Technical Context

  This rule detects the potential downloading of arbitrary files via Microsoft Office applications (Excel, PowerPoint, Word) when they execute commands that reference HTTP or HTTPS links. The likely objective of an attacker is to obtain a malicious payload through these commonly trusted document applications, which could lead to further exploitation or data exfiltration. This behavior maps to the MITRE ATT&CK tactic of "Command and Control" (TA0011) and the technique "Application Layer Protocol" (T1202).

  The primary telemetry source is process creation logs, specifically focusing on the execution of the Office applications under the logs categorized as process creation. If executed maliciously, the impact could range from data breach to complete system compromise. Importantly, this detection alone does not confirm that a malicious file was successfully downloaded or executed.

  ### Investigation Steps

  - **Identify the executing process**: Check for process creation events (Windows Security Event ID 4688 or Sysmon Event ID 1) related to EXCEL.EXE, POWERPNT.EXE, or WINWORD.EXE within the timeframe of the alert.

  - **Analyze command line parameters**: Review the CommandLine field for the detected process creation events, specifically looking for occurrences of 'http://' or 'https://'. Legitimate usage often consists of document opening commands without web links.

  - **Check process parentage**: Determine the parent process of the detected Office app executions (look for Event ID 4688 or Sysmon Event ID 1). Processes spawned from known administrative or benign applications (e.g., legitimate user-initiated execution) may indicate normal activity.

  - **Monitor for file downloads**: Investigate the specific directories that were accessed or files downloaded during this timeframe. Look for TEMP or USER directories in download events (User's download folder access in file system logs) that correspond to the processes identified.

  - **Correlate to network activity**: Review firewall or proxy logs that align with the timestamps of the document application executions. Specifically search for outbound HTTP/S requests to domains that are either known to be malicious or not commonly referenced in business operations.

  - **Validate with endpoint protection alerts**: Cross-reference any alerts or logs generated by Endpoint Detection and Response (EDR) solutions for suspicious activities associated with the identified processes.

  ### Prioritization

  This alert is high severity due to the potential for significant security incidents stemming from arbitrary file downloads within trusted applications. The likelihood of malicious exploitation via this vector is considerable, given its common usage in cyberattack scenarios such as credential theft or ransomware delivery.

  ### Blind Spots and Assumptions

  Detection capabilities might be limited if Office applications are directly exploited without triggering process creation logs, or if the relevant logging mechanisms are not enabled. Additionally, legitimate activities such as automated reporting or data retrieval processes may trigger the alert. A companion detection that improves coverage includes monitoring for abnormal command line arguments in standard applications (MITRE ATT&CK technique T1202).

