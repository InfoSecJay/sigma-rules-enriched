note: |
  ### Technical Context

  This Sigma rule detects potential arbitrary file downloads initiated through Microsoft Office applications (Excel, PowerPoint, Word) via HTTP or HTTPS requests. The likely objective of an attacker employing this technique is to download malicious payloads, taking advantage of the trust users have in commonly used office software. This behavior falls under the MITRE ATT&CK tactic of "Defense Evasion" and technique ID T1202, which relates to exploiting application vulnerabilities for undesirable actions.

  The primary telemetry sources for this detection are process creation logs specifically from Windows, focusing on CommandLine parameters of the Office applications in question. If successful, such a download could lead to unwanted file execution, data compromise, or the introduction of further exploits. It is essential to clarify that this detection alone does not confirm malicious activity; legitimate use of Office applications may also trigger the alert.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 to identify when `EXCEL.EXE`, `POWERPNT.EXE`, or `WINWORD.EXE` have been executed.

  - **Analyze command line arguments:** Focus on the CommandLine field for occurrences of "http://" or "https://." If a flagged application contains these links, it warrants a deeper investigation.

  - **Identify legitimate usage patterns:** Determine if the observed execution aligns with normal business activities. For example, an office user downloading a company document typically should not exhibit download commands from malicious web sources.

  - **Check for known malicious indicators:** Look for documented threat intelligence signatures related to the downloaded files or associated user accounts. Validate whether these files correlate with known malicious URLs from threat feeds.

  - **Confirm file creation/network indicators:** Investigate file creation events and network logs (e.g., Event IDs 5145, 4663) for any file writes to directories typically used for document downloads, which may indicate payload retrieval.

  ---

  ### Prioritization

  This alert is categorized as high severity due to the direct potential impact on sensitive systems that can lead to data breaches or malware infections. The opportunity for abuse is significant since attackers frequently weaponize Office applications to exploit trusted user behavior.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of relevant telemetry; it requires thorough configuration to capture all necessary logs from the Office applications. Certain legitimate activities, such as business file downloads through Office applications, may erroneously trigger alerts. A companion detection that could enhance coverage includes monitoring for unusual outbound network connections from these Office processes, which may identify exfiltration or suspicious downloads more effectively.

