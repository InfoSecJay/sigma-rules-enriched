title: Uncommon Svchost Command Line Parameter
id: f17211f1-1f24-4d0c-829f-31e28dc93cdd
status: experimental
description: |
  Detects instances of svchost.exe running with an unusual or uncommon command line parameter by excluding known legitimate or common patterns.
  This could point at a file masquerading as svchost, a process injection, or hollowing of a legitimate svchost instance.
references:
- https://cardinalops.com/blog/the-art-of-anomaly-hunting-patterns-detection/
- https://www.security.com/threat-intelligence/blackbyte-exbyte-ransomware
- https://cloud.google.com/blog/topics/threat-intelligence/apt41-initiates-global-intrusion-campaign-using-multiple-exploits/
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/08064518/Carbanak_APT_eng.pdf
author: Liran Ravich
date: 2025-11-14
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1036.005
- attack.t1055
- attack.t1055.012
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Example of command to simulate: "C:\Windows\System32\svchost.exe" calc.exe
    Image|endswith: '\svchost.exe'
  filter_main_flags:
    CommandLine|re: '-k\s\w{1,64}(\s?(-p|-s))?'
  filter_main_empty:
    CommandLine: ''
  filter_main_null:
    CommandLine:
  filter_optional_defender:
    ParentImage|endswith: '\MsMpEng.exe'
    CommandLine|contains: 'svchost.exe'
  filter_optional_mrt:
    ParentImage|endswith: '\MRT.exe'
    CommandLine: 'svchost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances of `svchost.exe` executing with uncommon command line parameters, which may indicate malicious activities such as process injection or masquerading. Attackers often utilize `svchost.exe`, a legitimate Windows process, to execute malicious payloads and evade detection. The relevant MITRE ATT&CK techniques include: Defense Evasion (T1036.005) and Process Injection (T1055).

  The primary telemetry sources for this detection are Windows Event logs associated with process creation, specifically Event ID 4688, which captures details of newly created processes. This detection poses significant risk if malicious, as it may indicate unauthorized access or control over a system. It should be noted that this detection alone does not confirm malicious behavior, as there may be legitimate scenarios where `svchost.exe` uses uncommon parameters.

  ### Investigation Steps

  - **Examine command line parameters:** Review Event ID 4688 logs for `svchost.exe`. Focus on the `CommandLine` field to identify any uncommon parameters (e.g., `-k`, `-p`, `-s`). Legitimate `svchost.exe` processes typically do not use these arguments.

  - **Check parent process details:** Identify the parent process of the suspicious `svchost.exe` instance by examining the `ParentImage` field in Event ID 4688. A parent process not associated with legitimate system operations may indicate malicious activity.

  - **Inspect process integrity:** Utilize Sysmon Event ID 10 to cross-reference process integrity levels. Confirm if the `svchost.exe` instance shows an unexpected integrity level (e.g., SYSTEM level processes spawning user-level processes), which could indicate process hollowing.

  - **Verify asset criticality:** Consider the role of the host where the alert originated. For critical servers (e.g., domain controllers, file servers), ensure that any suspicious `svchost.exe` activity is escalated for urgent review due to the potential impact.

  - **Look for file artifacts:** Check for unauthorized file creation or modification related to the process. Validate the presence of unexpected files (e.g., temporary executable files) in the `C:\Windows\System32` directory using file listing commands or tools.

  ### Prioritization

  This alert is of high severity as it indicates potentially malicious use of a critical system process on potentially critical assets. Given that attackers commonly abuse `svchost.exe` for their actions, there exists a significant likelihood of exploitation of this behavior.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers using alternative process names or legitimate command line variations. Additionally, comprehensive detection relies on the correct configuration of process creation logging on all Windows endpoints. Legitimate uses of `svchost.exe` with uncommon parameters (e.g., by system maintenance tools) may trigger false positives. A companion detection to consider is monitoring for unusual network connections initiated by the detected `svchost.exe` process, which would strengthen the assessment of the process's legitimacy.

