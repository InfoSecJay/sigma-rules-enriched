title: Uncommon Svchost Command Line Parameter
id: f17211f1-1f24-4d0c-829f-31e28dc93cdd
status: experimental
description: |
  Detects instances of svchost.exe running with an unusual or uncommon command line parameter by excluding known legitimate or common patterns.
  This could point at a file masquerading as svchost, a process injection, or hollowing of a legitimate svchost instance.
references:
- https://cardinalops.com/blog/the-art-of-anomaly-hunting-patterns-detection/
- https://www.security.com/threat-intelligence/blackbyte-exbyte-ransomware
- https://cloud.google.com/blog/topics/threat-intelligence/apt41-initiates-global-intrusion-campaign-using-multiple-exploits/
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/08064518/Carbanak_APT_eng.pdf
author: Liran Ravich
date: 2025-11-14
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1036.005
- attack.t1055
- attack.t1055.012
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Example of command to simulate: "C:\Windows\System32\svchost.exe" calc.exe
    Image|endswith: '\svchost.exe'
  filter_main_flags:
    CommandLine|re: '-k\s\w{1,64}(\s?(-p|-s))?'
  filter_main_empty:
    CommandLine: ''
  filter_main_null:
    CommandLine:
  filter_optional_defender:
    ParentImage|endswith: '\MsMpEng.exe'
    CommandLine|contains: 'svchost.exe'
  filter_optional_mrt:
    ParentImage|endswith: '\MRT.exe'
    CommandLine: 'svchost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects anomalous command line parameters used with `svchost.exe`, specifically when it executes with uncommon arguments that are not associated with legitimate Windows processes. The likely objective of an attacker in this scenario is to utilize a trusted process (`svchost.exe`) for malicious actions such as process injection or maintaining persistence, which can facilitate privilege escalation or evasion from detection. The relevant MITRE ATT&CK techniques include Defense Evasion (T1036.005) for disguising as legitimate processes and Process Injection (T1055) for executing code within the context of another process.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, capturing the process creation activity and command line arguments. If this behavior is malicious, it can lead to significant security risks, including unauthorized access and potential data breaches. However, this detection does NOT confirm actual malicious behavior on its own; further investigation is required to determine intent.

  ---

  ### Investigation Steps

  - **Review process creation events:** Examine Security Event ID 4688 for instances of `svchost.exe` running with rare command line parameters. Identify if arguments that deviate from the norm, such as `-k` with uncommon values, are present.

  - **Correlate with parent process:** Check the parent process of the detected `svchost.exe` instance. If it originates from known security applications (`MsMpEng.exe` or `MRT.exe`) with command lines containing `svchost.exe`, categorize as benign.

  - **Analyze command line arguments:** Document any command line parameters that are not associated with legitimate operations. Legitimate usage typically appears without additional parameters or only includes common flags like `-k Local`.

  - **Check additional event logs:** Look for related activity in Sysmon Event ID 1, which provides information on process creation, including hashes and parent-child relationships. This can reveal if the `svchost.exe` process has been involved in suspicious activities.

  - **Identify established baselines:** Consult standard operating procedure documentation to compare the detected command line arguments against a list of permitted or common parameters for `svchost.exe` to assess familiarity.

  - **Monitor for persistence mechanisms:** Investigate any signs of persistence mechanisms that might leverage this process using Registry or Scheduled Task logs that could relate to the detected behavior, specifically looking for abnormal entries.

  ---

  ### Prioritization

  This alert should be treated with high severity as unusual uses of `svchost.exe` can signify active attempts to evade detection and escalate privileges within an enterprise environment. The likelihood of malicious exploitation is high, given that such techniques are commonly weaponized in various attack methodologies.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques where an attacker mimics legitimate svchost behavior, thus not triggering alerts. Reliable detection requires that process creation logging and auditing are fully enabled across endpoints. Certain legitimate activities, such as specific software updates or system maintenance tasks, may trigger this alert. A related detection includes monitoring for anomalous behavior in newly created processes or changes to system configurations that align with typical attack vectors to improve contextual accuracy.

