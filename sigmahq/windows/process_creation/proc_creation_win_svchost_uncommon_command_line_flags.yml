title: Uncommon Svchost Command Line Parameter
id: f17211f1-1f24-4d0c-829f-31e28dc93cdd
status: experimental
description: |
  Detects instances of svchost.exe running with an unusual or uncommon command line parameter by excluding known legitimate or common patterns.
  This could point at a file masquerading as svchost, a process injection, or hollowing of a legitimate svchost instance.
references:
- https://cardinalops.com/blog/the-art-of-anomaly-hunting-patterns-detection/
- https://www.security.com/threat-intelligence/blackbyte-exbyte-ransomware
- https://cloud.google.com/blog/topics/threat-intelligence/apt41-initiates-global-intrusion-campaign-using-multiple-exploits/
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/08064518/Carbanak_APT_eng.pdf
author: Liran Ravich
date: 2025-11-14
modified: 2026-03-23
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1036.005
- attack.t1055
- attack.t1055.012
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Example of command to simulate: "C:\Windows\System32\svchost.exe" calc.exe
    Image|endswith: '\svchost.exe'
  filter_main_flags:
    CommandLine|re: '-k\s\w{1,64}(?:\s?(?:-p|-s))?'
  filter_main_empty:
    CommandLine: ''
  filter_main_null:
    CommandLine:
  filter_optional_defender:
    ParentImage|endswith: '\MsMpEng.exe'
    CommandLine|contains: 'svchost.exe'
  filter_optional_mrt:
    ParentImage|endswith: '\MRT.exe'
    CommandLine: 'svchost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_svchost_uncommon_command_line_flags/info.yml
note: |
  ### Technical Context

  This Sigma rule detects instances of `svchost.exe` being executed with uncommon command line parameters that do not match known legitimate patterns. Malicious actors may exploit `svchost.exe` for process injection or to masquerade malicious activities by misusing this system process. The relevant MITRE ATT&CK tactics involved include **Execution** (T1202) and **Privilege Escalation** (T1050). Primary telemetry sources include Windows process creation events, specifically Event ID 4688 which captures the command line execution details. If malicious, this behavior could lead to unauthorized code execution or system compromise. This detection alone does not confirm malware presence; it could also indicate an application running legitimately if further context is not established.

  ### Investigation Steps

  - **Review event details for abnormal command lines:** Check Windows Security Event ID 4688 for instances of `svchost.exe` running with parameters such as `-k` followed by an unusual service name. Legitimate invocations typically do not include such uncommon parameters.

  - **Analyze parent process relationships:** Examine the `ParentImage` field of the related Event ID 4688 records. Confirm whether `svchost.exe` was spawned by legitimate processes like `explorer.exe` or common system processes. Suspicious parent processes may indicate potential compromise.

  - **Cross-reference against known legitimate behaviors:** Compare the detected parameters with established baseline command lines for `svchost.exe` in your environment. Legitimate usages often include specific, documented flags; deviations could signal malicious intent.

  - **Assess for file system anomalies:** Lookup related file creation or modifications in the directory of `svchost.exe`, typically located in `C:\Windows\System32\`. Any unexpected file creation or modification around the time of the detection may indicate file masquerading.

  - **Investigate network activity related to the process:** Correlate the `svchost.exe` activity with network logs to identify any unusual outbound connections or DNS queries that could suggest data exfiltration or command and control communication.

  - **Identify common malware indicators:** Check for known malicious hashes or signatures in your endpoint protection system that were active around the time of the alert to determine if `svchost.exe` is associated with recognized malware.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of `svchost.exe` within Windows processes, the risk of exploitation for persistence or privilege escalation, and the prevalence of tools that leverage this process for malicious operations. The likelihood of abuse by adversaries is significant, as these tactics are commonly exploited in attack scenarios.

  ### Blind Spots and Assumptions

  The detection might not capture evasion techniques where adversaries modify the `svchost.exe` name or use other means to disguise their payloads. Reliable detection requires logging configurations that capture detailed event data, such as enabling process command line logging in Windows. Legitimate activities sparked by system updates or administrative tasks could potentially trigger this alert. Related detections, such as monitoring for unusual behavior from `explorer.exe` (e.g., spawning processes with unusual command line flags), can enhance overall coverage.

