title: Uncommon Svchost Command Line Parameter
id: f17211f1-1f24-4d0c-829f-31e28dc93cdd
status: experimental
description: |
  Detects instances of svchost.exe running with an unusual or uncommon command line parameter by excluding known legitimate or common patterns.
  This could point at a file masquerading as svchost, a process injection, or hollowing of a legitimate svchost instance.
references:
- https://cardinalops.com/blog/the-art-of-anomaly-hunting-patterns-detection/
- https://www.security.com/threat-intelligence/blackbyte-exbyte-ransomware
- https://cloud.google.com/blog/topics/threat-intelligence/apt41-initiates-global-intrusion-campaign-using-multiple-exploits/
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/08064518/Carbanak_APT_eng.pdf
author: Liran Ravich
date: 2025-11-14
modified: 2026-03-23
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1036.005
- attack.t1055
- attack.t1055.012
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Example of command to simulate: "C:\Windows\System32\svchost.exe" calc.exe
    Image|endswith: '\svchost.exe'
  filter_main_flags:
    CommandLine|re: '-k\s\w{1,64}(?:\s?(?:-p|-s))?'
  filter_main_empty:
    CommandLine: ''
  filter_main_null:
    CommandLine:
  filter_optional_defender:
    ParentImage|endswith: '\MsMpEng.exe'
    CommandLine|contains: 'svchost.exe'
  filter_optional_mrt:
    ParentImage|endswith: '\MRT.exe'
    CommandLine: 'svchost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where `svchost.exe` is being executed with unusual or uncommon command line parameters. Such behaviors are indicative of potential process injection, binary masquerading, or exploitation techniques designed to exploit the legitimate `svchost` process for malicious activities. The likely attacker objective could include privilege escalation and stealthy malware execution.

  This detection aligns with the MITRE ATT&CK technique of Process Injection (T1055), specifically targeting the sub-technique Process Injection (T1055.012). The primary telemetry source necessary for this detection is Windows process creation logs, specifically event IDs related to process creation (Event ID 4688) and Sysmon process creation events (Event ID 1). Malicious activity leveraging this technique can compromise the integrity of essential system processes, which may lead to significant security incidents. It’s important to note that this detection does not confirm malicious intent on its own since benign applications can also utilize unusual command line parameters.

  ### Investigation Steps

  - **Review Process Creation Events:** Check Security Event ID 4688 and Sysmon Event ID 1 for instances of `svchost.exe`. Look for the command line parameter structure that deviates from typical patterns, noting expected benign command lines such as those initializing standard services.

  - **Examine Parent Process Relationships:** Identify the parent process of the suspicious `svchost.exe` instance. Review if the parent process matches known legitimate services (e.g., `MsMpEng.exe` for Windows Defender, or `MRT.exe` for Microsoft Removal Tool). Unusual parent-child relationships may indicate malicious behavior.

  - **Cross-Reference Command Lines:** Analyze the command line of the detected `svchost.exe` execution. Compare against a whitelist of legitimate command line arguments. Uncommon flags or additional applications being invoked (e.g., `calc.exe`) should raise red flags for potential misuses.

  - **Investigate File Origin:** Validate the file path of `svchost.exe`. Ensure it is originating from `C:\Windows\System32\svchost.exe`. Any deviation (e.g., a different directory) may indicate the presence of a malicious file masquerading as a system service.

  - **Check for Exfiltration Artifacts:** If applicable, confirm the absence of unusual outbound connections made by the detected process which could indicate data exfiltration attempts. Use network telemetry to check for unexpected traffic patterns originating from the system in question.

  ### Prioritization

  The alert severity is high, particularly if the affected system runs critical services or is considered an endpoint with sensitive data. The prevalence of process injection techniques makes the likelihood of malicious abuse substantial. Instances of anomalous command lines in system processes are frequently weaponized.

  ### Blind Spots and Assumptions

  There are limitations in detection accuracy, as legitimate applications can use uncommon command line parameters without malicious intent. Additionally, insufficient logging configurations may hinder detection efficacy; ensure that Sysmon-based logging is appropriately configured to capture necessary event IDs. Activities by legitimate system services may inadvertently trigger this alert and require contextual analysis. A related detection, such as alerts for unusual network connections initiated by `svchost.exe`, can enhance coverage and context for investigation.

