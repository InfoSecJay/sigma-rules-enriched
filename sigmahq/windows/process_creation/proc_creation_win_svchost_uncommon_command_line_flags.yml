title: Uncommon Svchost Command Line Parameter
id: f17211f1-1f24-4d0c-829f-31e28dc93cdd
status: experimental
description: |
  Detects instances of svchost.exe running with an unusual or uncommon command line parameter by excluding known legitimate or common patterns.
  This could point at a file masquerading as svchost, a process injection, or hollowing of a legitimate svchost instance.
references:
- https://cardinalops.com/blog/the-art-of-anomaly-hunting-patterns-detection/
- https://www.security.com/threat-intelligence/blackbyte-exbyte-ransomware
- https://cloud.google.com/blog/topics/threat-intelligence/apt41-initiates-global-intrusion-campaign-using-multiple-exploits/
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/08064518/Carbanak_APT_eng.pdf
author: Liran Ravich
date: 2025-11-14
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1036.005
- attack.t1055
- attack.t1055.012
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # Example of command to simulate: "C:\Windows\System32\svchost.exe" calc.exe
    Image|endswith: '\svchost.exe'
  filter_main_flags:
    CommandLine|re: '-k\s\w{1,64}(\s?(-p|-s))?'
  filter_main_empty:
    CommandLine: ''
  filter_main_null:
    CommandLine:
  filter_optional_defender:
    ParentImage|endswith: '\MsMpEng.exe'
    CommandLine|contains: 'svchost.exe'
  filter_optional_mrt:
    ParentImage|endswith: '\MRT.exe'
    CommandLine: 'svchost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies instances of `svchost.exe` that are executed with unusual or uncommon command line parameters. Since `svchost.exe` is a legitimate system process that hosts multiple Windows services, its misuse can indicate potential malicious activities such as process injection or the execution of a rogue executable masquerading as `svchost.exe`. Attackers often abuse this process to evade detection and maintain persistence on compromised systems, thereby achieving their objectives of data theft, lateral movement, or deployment of additional malware.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Defense Evasion (T1562)**: The use of uncommon parameters can help attackers bypass standard detection mechanisms by leveraging a well-known and trusted process.
  - **Privilege Escalation (T1055)**: By injecting into `svchost.exe`, attackers may gain elevated privileges on the host system.

  Primary data sources for this detection are Windows process creation events, specifically monitoring command line arguments associated with `svchost.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate recent instances of `svchost.exe` in the process creation logs and examine their command line parameters for any irregularities or deviations from typical usage patterns.
  - **Analyze Parent Process Context**: Check the parent processes of unusual `svchost.exe` invocations to determine if they are initiated by trusted processes (e.g., `MsMpEng.exe`, `MRT.exe`) or any suspicious applications.
  - **Identify Related Network Activity**: Correlate the timing of unusual `svchost.exe` executions with network logs to identify any potentially malicious outbound connections during that timeframe, particularly to known or suspected Command and Control (C2) servers.
  - **Conduct Memory Analysis**: If applicable, perform a memory dump analysis of the host to identify any potential process injection or hollowing techniques being utilized by malicious actors that leverage `svchost.exe`.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant impact, including system compromise and data exfiltration. The likelihood of this unusual usage indicating malicious activity is elevated, especially within environments that may have previously experienced targeted attacks.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage arises from the need for comprehensive command line logging; if command-line data is not included in the configured event logs, this rule may miss critical evidence. Additionally, the detection logic assumes the environment will capture all instances of `svchost.exe`, meaning any obfuscation or disguise of the executable could evade detection. Proper logging of process creation events, including command line parameters, is essential for this alert to function effectively.

