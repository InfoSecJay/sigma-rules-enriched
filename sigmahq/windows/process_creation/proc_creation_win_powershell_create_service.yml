note: |
  ### Technical Context
  This detection rule identifies the creation of a new service on Windows systems using PowerShell, specifically through the invocation of the `New-Service` cmdlet with the `-BinaryPathName` parameter. This behavior can signal potential malicious activity where an attacker attempts to establish persistence by creating a service that could launch malware or maintain control over a compromised system. Typically, attackers use this method to ensure their payloads are executed at startup, thereby maintaining access even after a system reboot.

  The relevant MITRE ATT&CK techniques associated with this detection are T1543.003 (Create or Modify System Service), which falls under the persistence tactic. By leveraging PowerShell, an attacker avoids detection through common mechanisms, as it is a legitimate administrative tool that can be abused for nefarious purposes. Primary data sources that provide insights into this activity include process creation events and command line arguments logged by the operating system.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the logs for the creation of any new services, particularly focusing on the command line arguments to identify if `New-Service` was used alongside `-BinaryPathName`.
  - **Analyze Binary Files:** Investigate the binaries associated with newly created services for known malware signatures or suspicious behavior to determine whether they are legitimate or potentially harmful.
  - **Correlate with User Activities:** Examine user activity logs around the same time to identify any unusual or unauthorized actions leading up to the service creation event that could indicate malicious intent.
  - **Inspect Scheduled Tasks:** Look for any related scheduled tasks or other persistence mechanisms that might complement the newly created service, thereby determining if multiple persistence methods are being employed.

  ### Prioritization
  The alert bears low severity as it may often be triggered by legitimate administrative actions or software installations. However, due to the potential for misuse in establishing persistence by attackers, any alerts should still be investigated promptly to rule out adversarial activity.

  ### Blind Spots and Assumptions
  This detection may miss legitimate use cases where administrators create services for valid reasons, as well as instances where malicious services are created without the use of PowerShell. The detection logic assumes that all service creations will invoke `New-Service` in PowerShell, which may not always be the case, especially if attackers use other tools or scripting languages. Proper logging of command line execution is crucial for this alert's effectiveness, and it may rely on a suitable logging configuration to capture all necessary details.

