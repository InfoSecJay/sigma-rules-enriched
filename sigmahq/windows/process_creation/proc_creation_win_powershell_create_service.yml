note: |
  ### Technical Context

  This Sigma rule detects the creation of new Windows services using PowerShell commands that include `New-Service` and `-BinaryPathName`. The likely attacker objective is to establish persistence on a target system, allowing for continuous access, privilege escalation, or execution of malicious payloads. This action aligns with the MITRE ATT&CK tactic for persistence and corresponds to technique T1543.003 (Create or Modify System Service).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 for process creation and possible Sysmon Event ID 1 for enhanced logging details. If malicious, the creation of unauthorized services can lead to persistent threats and facilitate further exploitation. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Security Event ID 4688 for the creation of PowerShell processes and check command line arguments for `New-Service` and `-BinaryPathName`. Look for entries linked to known user accounts; suspicious accounts can signify potential compromise.

  - **Investigate the service creation details:** Retrieve Service Control Manager logs (Event ID 7045) to confirm the creation of the new service, including Service Name, Display Name, and Binary Path. Malicious indicators may include services created in unusual paths such as `C:\Temp` or similar directories.

  - **Identify related processes:** Look for child processes spawned by PowerShell or the service executable that create network connections (e.g., Event ID 5156 for Windows Firewall logs). Confirming connections to unknown or suspicious IP addresses can indicate malicious activity.

  - **Assess legitimate administrator actions:** Query recent administrative activity through logs for intended service installations or modifications and correlate with asset inventory. Legitimate services or installations should follow established procedures and be documented.

  - **Check for evasion patterns:** Monitor for use of techniques such as Base64 encoding in command lines or the use of PowerShell scripts that could obfuscate the command. This may indicate an attempt to conceal malicious actions.

  ### Prioritization

  The alert is of **low severity** in a mature enterprise context as it involves creation of a new service, which can be indicative of legitimate administrative activity. However, malicious abuse is plausible, especially in environments where system services are strictly controlled. This behavior, while not as common as other tactics, may be weaponized in certain ransomware or advanced persistent threats (APTs) scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include scenarios where the attacker disables logging or utilizes scripts that do not generate the expected telemetry. Reliable detection hinges on the availability of complete and configured log sources for process creation and service management. Additionally, legitimate activities such as software installations or service updates could inadvertently trigger this alert. A related detection that strengthens coverage would be monitoring for service modification actions via Sysmon Event ID 22.

