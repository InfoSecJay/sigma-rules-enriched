title: Malicious PE Execution by Microsoft Visual Studio Debugger
id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
status: test
description: |
  There is an option for a MS VS Just-In-Time Debugger "vsjitdebugger.exe" to launch specified executable and attach a debugger.
  This option may be used adversaries to execute malicious code by signed verified binary.
  The debugger is installed alongside with Microsoft Visual Studio package.
references:
- https://twitter.com/pabraeken/status/990758590020452353
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vsjitdebugger/
- https://learn.microsoft.com/en-us/visualstudio/debugger/debug-using-the-just-in-time-debugger?view=vs-2019
author: Agro (@agro_sev), Ensar Şamil (@sblmsrsn), oscd.community
date: 2020-10-14
modified: 2022-10-09
tags:
- attack.t1218
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\vsjitdebugger.exe'
  reduction1:
    Image|endswith: '\vsimmersiveactivatehelper*.exe'
  reduction2:
    Image|endswith: '\devenv.exe'
  condition: selection and not (reduction1 or reduction2)
falsepositives:
- The process spawned by vsjitdebugger.exe is uncommon.
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the Microsoft Visual Studio Just-In-Time Debugger (`vsjitdebugger.exe`) is used to execute potentially malicious processes. Adversaries can leverage this functionality to run malicious code in the context of a legitimate, signed binary, thus evading detection by security measures that analyze execution based on the legitimacy of the parent process. This technique allows an attacker to gain a foothold while hiding in plain sight, as the execution appears to be initiated by a standard debugging tool widely associated with software development.

  The relevant MITRE ATT&CK tactics and techniques associated with this rule include **Defense Evasion (TA0005)**, particularly the technique **Signed Binary Proxy Execution (T1218)**. By utilizing signed binaries such as `vsjitdebugger.exe`, attackers can obfuscate malicious activity during execution, particularly in environments where security solutions are programmed to trust signed executables and thus may overlook their usage for nefarious purposes.

  Primary data sources for effective validation of this detection include **process creation events** from Windows logs, which capture the launching of processes and their parent-child relationships, providing visibility into suspicious execution patterns linked to legitimate tools.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Review process creation events to identify instances where `vsjitdebugger.exe` has initiated new process executions. Pay attention to the hierarchy of processes and any unusual patterns.

  - **Analyze Parent Processes**: Focus on the context in which the Just-In-Time Debugger is launched. Investigate the parent processes to ensure they are legitimate and not indicative of lateral movement or malicious activity.

  - **Check for Common Reductions**: Investigate any processes matching the exceptions `\vsimmersiveactivatehelper*.exe` and `\devenv.exe` to ensure that they are not being used as cover for malicious activities.

  - **Review System Behavior**: Look for anomalies in system behavior following the execution, such as unusual network connections or file modifications that could indicate the aftermath of a successful malicious exploit initiated via the debugger.

  ### Prioritization
  The severity of this alert is medium because, while the use of the Just-In-Time Debugger can indicate benign activity, it is a commonly exploited mechanism among adversaries. The impact can be significant if an attacker successfully utilizes this method to execute malicious code under the guise of trusted applications.

  ### Blind Spots and Assumptions
  This detection may have coverage gaps if the `vsjitdebugger.exe` is not frequently invoked in the environment or if it is combined with other legitimate development practices. The detection logic assumes that the absence of common reduction flags corresponds to malicious intent; however, legitimate development activities may also trigger similar events. Additionally, for proper function, detailed process creation logging must be enabled and correctly configured to capture relevant execution details.

