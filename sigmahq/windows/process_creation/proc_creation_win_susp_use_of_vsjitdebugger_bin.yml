title: Malicious PE Execution by Microsoft Visual Studio Debugger
id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
status: test
description: |
  There is an option for a MS VS Just-In-Time Debugger "vsjitdebugger.exe" to launch specified executable and attach a debugger.
  This option may be used adversaries to execute malicious code by signed verified binary.
  The debugger is installed alongside with Microsoft Visual Studio package.
references:
- https://twitter.com/pabraeken/status/990758590020452353
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vsjitdebugger/
- https://learn.microsoft.com/en-us/visualstudio/debugger/debug-using-the-just-in-time-debugger?view=vs-2019
author: Agro (@agro_sev), Ensar Şamil (@sblmsrsn), oscd.community
date: 2020-10-14
modified: 2022-10-09
tags:
- attack.t1218
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\vsjitdebugger.exe'
  reduction1:
    Image|endswith: '\vsimmersiveactivatehelper*.exe'
  reduction2:
    Image|endswith: '\devenv.exe'
  condition: selection and not (reduction1 or reduction2)
falsepositives:
- The process spawned by vsjitdebugger.exe is uncommon.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially malicious programs that are launched by the Microsoft Visual Studio Just-In-Time Debugger (vsjitdebugger.exe). Attackers may leverage this tool to execute malicious payloads under the guise of legitimate software due to its trusted nature. The relevant MITRE ATT&CK tactics are **Execution (TA0002)** and **Defense Evasion (TA0005)**, with technique ID **T1218**.

  The primary telemetry source is Windows process creation logs. Essential log types include Security Event ID 4688, which captures process creation events, and Sysmon Event ID 1 for more detailed insights. If the detected behavior is malicious, it could indicate an attempt to execute code that bypasses traditional security measures, thereby compromising system integrity. It is important to note that this detection alone does NOT confirm malicious intent; further investigation is required to understand the context of the execution.

  ### Investigation Steps

  - **Check the parent process:** Analyze Security Event ID 4688 logs for the creation of new processes with the parent image being `\vsjitdebugger.exe`. Look for any child processes spawned that are uncommon or not typically associated with legitimate development activities.

  - **Identify the executed image:** Review the Image path field in the process creation logs to identify if the executed binary ends with `\vsjitdebugger.exe`. Note down any unusual or unknown executable names that might be indicative of compromise.

  - **Examine execution context:** Investigate the command line parameters used during the execution of vsjitdebugger.exe by checking the 'CommandLine' field in the logs. Legitimate usage typically doesn't include unusual command-line arguments.

  - **Filter out benign instances:** For known legitimate operations, track instances where the debugger is invoked by common tools like `\devenv.exe` or related applications like `\vsimmersiveactivatehelper*.exe`, which are associated with recognized development processes.

  - **Look for malicious indicators:** Cross-reference the executed child processes against known threat intelligence feeds for signatures of commonly exploited binaries or malware variants.

  - **Validate against file exfiltration:** If file creation is detected during the execution path, check relevant file system audit logs for unusual file creation events, particularly in sensitive directories.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on critical systems by allowing code execution under the guise of a trusted application. While the likelihood of malicious abuse exists, especially in environments where Visual Studio is installed, this behavior may not be commonly weaponized and warrants further contextual evaluation.

  ### Blind Spots and Assumptions

  Evasion techniques may include attackers disguising malicious payloads as legitimate SDK or development processes. Reliable detection requires comprehensive monitoring of the process creation event logs and ensuring that security mechanisms are not bypassed by whitelisting vsjitdebugger.exe. Legitimate debugging activities could inadvertently trigger this alert, especially in environments with active development. For enhanced coverage, consider companion detections focusing on the creation of suspicious child processes from other trusted applications.

