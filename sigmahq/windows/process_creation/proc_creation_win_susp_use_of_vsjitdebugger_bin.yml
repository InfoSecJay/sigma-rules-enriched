title: Malicious PE Execution by Microsoft Visual Studio Debugger
id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
status: test
description: |
  There is an option for a MS VS Just-In-Time Debugger "vsjitdebugger.exe" to launch specified executable and attach a debugger.
  This option may be used adversaries to execute malicious code by signed verified binary.
  The debugger is installed alongside with Microsoft Visual Studio package.
references:
- https://twitter.com/pabraeken/status/990758590020452353
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vsjitdebugger/
- https://learn.microsoft.com/en-us/visualstudio/debugger/debug-using-the-just-in-time-debugger?view=vs-2019
author: Agro (@agro_sev), Ensar Şamil (@sblmsrsn), oscd.community
date: 2020-10-14
modified: 2022-10-09
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\vsjitdebugger.exe'
  reduction1:
    Image|endswith: '\vsimmersiveactivatehelper*.exe'
  reduction2:
    Image|endswith: '\devenv.exe'
  condition: selection and not (reduction1 or reduction2)
falsepositives:
- The process spawned by vsjitdebugger.exe is uncommon.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially malicious code using the Microsoft Visual Studio Just-In-Time Debugger (`vsjitdebugger.exe`). Adversaries may leverage this debugger to execute signed binaries, potentially bypassing security controls while interacting with trusted applications. This behavior aligns with the MITRE ATT&CK technique for "Signed Binary Proxy Execution" (T1218).

  The primary telemetry sources include process creation logs, specifically focusing on the parent-child relationship indicative of the debugger spawning other processes. If this behavior is identified as malicious, it may enable an adversary to execute payloads stealthily. However, this detection does NOT confirm malicious activity by itself as the execution may also be part of legitimate debugging processes.

  ### Investigation Steps

  - **Correlate Process Creation Events:** Review Security Event ID 4688 or Sysmon Event ID 1 for `vsjitdebugger.exe` and any spawned child processes. Legitimate executions may show parent-child relationships with known Visual Studio components like `devenv.exe`.

  - **Identify Parent-Child Relationships:** Check for abnormal child processes spawned from `vsjitdebugger.exe`. Investigate any executables that are not part of standard development activity, noting any execution of potentially unnecessary or unknown binaries.

  - **Analyze Command-Line Arguments:** Examine the command-line arguments of processes spawned by `vsjitdebugger.exe`. Malicious instances may include unexpected or obfuscated parameters that signify payload execution rather than debugging.

  - **Check for Known Malicious Indicators:** Look for file hashes associated with known malware that may be executed via `vsjitdebugger.exe`, especially focusing on executable files that exhibit suspicious behavior or lack known use cases within the organization's development environment.

  - **Review User Context and Asset Roles:** Validate the user account that initiated the debugging process. Expected behavior generally comes from developers or IT staff on development machines, while unexpected executions from standard user accounts or non-development machines may indicate abuse.

  ### Prioritization

  This alert should be treated with medium severity due to moderate likelihood of malicious activity, particularly if suspicious executables are involved. The impact may be significant on endpoints used for software development, yet the context could vary based on asset criticality and visibility into legitimate debugger usage.

  ### Blind Spots and Assumptions

  This detection has limitations in environments where legitimate debugging is common, which may result in false positives. It requires detailed process creation logs and, potentially, command-line visibility for effective detection. Additionally, legitimate usages of `vsjitdebugger.exe`, such as troubleshooting application bugs, can trigger alerts. A companion detection focusing on unusual child processes of other common debuggers (like `windbg.exe`) can enhance coverage against evasion.

