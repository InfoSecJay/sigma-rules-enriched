title: Malicious PE Execution by Microsoft Visual Studio Debugger
id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
status: test
description: |
  There is an option for a MS VS Just-In-Time Debugger "vsjitdebugger.exe" to launch specified executable and attach a debugger.
  This option may be used adversaries to execute malicious code by signed verified binary.
  The debugger is installed alongside with Microsoft Visual Studio package.
references:
- https://twitter.com/pabraeken/status/990758590020452353
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vsjitdebugger/
- https://learn.microsoft.com/en-us/visualstudio/debugger/debug-using-the-just-in-time-debugger?view=vs-2019
author: Agro (@agro_sev), Ensar Şamil (@sblmsrsn), oscd.community
date: 2020-10-14
modified: 2022-10-09
tags:
- attack.t1218
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\vsjitdebugger.exe'
  reduction1:
    Image|endswith: '\vsimmersiveactivatehelper*.exe'
  reduction2:
    Image|endswith: '\devenv.exe'
  condition: selection and not (reduction1 or reduction2)
falsepositives:
- The process spawned by vsjitdebugger.exe is uncommon.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of potentially malicious processes initiated by the Microsoft Visual Studio Just-In-Time Debugger (`vsjitdebugger.exe`). Adversaries may leverage this tool to execute signed binaries, circumventing typical detection mechanisms, while maintaining a facade of legitimacy. This behavior typically indicates an attempt to evade defenses by exploiting commonly trusted executables.

  Relevant MITRE ATT&CK techniques include **Process Injection (T1055)** and **Software Deployment Tools (T1218)**. Primary telemetry sources include Windows Security Event ID **4688** (Process Creation) and Sysmon Event ID **1** (Process Creation). If exploited maliciously, this can lead to unauthorized code execution, data exfiltration, or breaching sensitive systems. It is crucial to note that this detection alone does not confirm malicious activity, as legitimate debugging processes may also initiate `vsjitdebugger.exe`.

  ---

  ### Investigation Steps

  - **Check Parent Process:** Review Security Event ID **4688** or Sysmon Event ID **1** for `vsjitdebugger.exe` runs with parent processes that are suspicious or unexpected, such as unusual behavior from non-development applications. Legitimate use typically occurs during the debugging of known applications.

  - **Examine Command-Line Arguments:** Inspect the command-line arguments associated with `vsjitdebugger.exe` in the relevant event logs. Malicious invocations may include specific atypical executables or unexpected script paths, while legitimate processes often reference known binaries and environments.

  - **Validate Process Image:** Identify the actual executable launched by `vsjitdebugger.exe` through Event ID **4688**. High-confidence malicious indicators would be the execution of a known malware binary or a binary located in an unusual directory (e.g., non-standard application folders).

  - **Cross-Reference Execution Time:** Compare the execution time of `vsjitdebugger.exe` against other scheduled tasks or common application activity timelines. Unexpected invocation during off-hours or high-activity times can indicate malicious intent.

  - **Review System for Indicators of Compromise:** Conduct a forensic examination of the system for additional compromised indicators, especially focusing on file creation or modification timestamps, registry changes, or network connections initiated by the launched process.

  - **Identify Legitimate Debugging Activity:** Look for instances of Visual Studio or development tools being used around the time of the alert. If a known developer’s workflow includes `vsjitdebugger.exe`, this may signify benign use if supported by contextual activities.

  ---

  ### Prioritization

  This alert warrants medium severity as the execution of `vsjitdebugger.exe` can indicate potential abuse of trusted tools. The affected system's role in the environment—especially if involved in development, production, or critical services—increases the need for investigation, as adversaries frequently weaponize debugger tools to execute payloads covertly.

  ---

  ### Blind Spots and Assumptions

  Detecting the execution of `vsjitdebugger.exe` does not account for adversaries employing other debugging tools or scripts that might be similarly misconfigured but not logged. Reliable detection depends on comprehensive logging configurations, particularly for process creations across all servers and workstations. Legitimate activities involving software debugging may inadvertently trigger this alert, such as routine development practices. Related detection, such as vigilant monitoring for unusual command-line arguments or processes spawned at odd times, can enhance overall threat visibility.

