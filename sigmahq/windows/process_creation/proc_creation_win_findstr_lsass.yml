title: LSASS Process Reconnaissance Via Findstr.EXE
id: fe63010f-8823-4864-a96b-a7b4a0f7b929
status: test
description: Detects findstring commands that include the keyword lsass, which 
  indicates recon actviity for the LSASS process PID
references:
- https://blog.talosintelligence.com/2022/08/recent-cyber-attack.html?m=1
author: Florian Roth (Nextron Systems)
date: 2022-08-12
modified: 2024-06-04
tags:
- attack.credential-access
- attack.t1552.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr_img:
  - Image|endswith:
    - '\find.exe'
    - '\findstr.exe'
  - OriginalFileName:
    - 'FIND.EXE'
    - 'FINDSTR.EXE'
  selection_findstr_cli:
    CommandLine|contains: 'lsass'
  selection_special:
    CommandLine|contains|windash:
    - ' /i "lsass'
    - ' /i lsass.exe'
    - 'findstr "lsass'
    - 'findstr lsass'
    - 'findstr.exe "lsass'
    - 'findstr.exe lsass'
  condition: all of selection_findstr_* or selection_special
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_findstr_lsass/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `findstr.exe` or `find.exe` commands that query the Local Security Authority Subsystem Service (LSASS) process, specifically looking for command lines containing the keyword "lsass". The likely attacker objective is to perform reconnaissance on credentials or sensitive information stored in memory by LSASS, a crucial component of Windows security, indicating an attempt to exfiltrate credentials or escalate privileges. This activity is associated with the MITRE ATT&CK tactic of Credential Access (TA0006) and technique T1552.006 (Application Layer Protocol: Credential Dumping).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which detail process creation events along with their command lines. If the malicious nature of this activity is confirmed, it could lead to significant security breaches, including unauthorized access to sensitive data. This detection does NOT confirm that credential theft has occurred on its own; it merely indicates potentially suspicious reconnaissance activity targeting LSASS.

  ### Investigation Steps

  - **Review related process creation events**: Check for Security Event ID 4688 or Sysmon Event ID 1 around the same timestamp as the alert to identify all processes launched by the user and their command lines. Look for unusual parent-child process relationships that could indicate malicious chaining.

  - **Check command-line arguments for malicious intent**: Examine the command line associated with the detected `findstr` execution. Malicious examples would contain arguments like `/i "lsass"` or directly invoke `lsass.exe`. Legitimate uses are less common and likely to reference other known Windows services.

  - **Identify user context and privileges**: Determine the user account and its privileges running the `findstr` command. Investigate whether the account has the necessary permissions to access LSASS, which might indicate legitimate administration versus potential exploitation.

  - **Correlate with past alerts or incidents**: Review historical incident data or previous alerts related to Credential Access or unauthorized access to LSASS. This can provide context on potential ongoing adversarial behavior.

  - **Cross-verify with process memory access events**: Check Sysmon Event ID 10 to see if there are any subsequent memory access attempts on LSASS, which would further corroborate the reconnaissance activity detected.

  ### Prioritization

  The alert's severity is high due to the critical role of LSASS in securing credentials and the increased likelihood of malicious intent, as such reconnaissance activity is often a precursor to credential theft or privilege escalation. This behavior can be weaponized in various cyber attack scenarios, positioning it as a significant red flag for ongoing security threats.

  ### Blind Spots and Assumptions

  The detection may miss obfuscation techniques employed by adversaries, such as using benign-looking alternatives to `findstr` or executing scripts in a less detectable manner. Continuous logging from Windows Process Creation is essential for reliability, along with ensuring the appropriate Sysmon configuration for full visibility. Legitimate administrative activities may sometimes trigger this alert, such as systems administrators running commands for diagnostic analysis. A related detection for additional coverage would be monitoring access to LSASS memory via Sysmon Event ID 10 (Process Access) which can signal further exploited behavior.

