note: |
  ---

  ### Technical Context

  This rule detects reconnaissance activity targeting the Local Security Authority Subsystem Service (LSASS) process using the `findstr.exe` command. This behavior is often indicative of attackers seeking to harvest credentials in Windows environments, particularly aiming to extract sensitive information stored in the LSASS memory space. The relevant MITRE ATT&CK techniques are Credential Access (T1552.006) and Process Discovery (T1057). Primary telemetry sources include process creation events (Security Event ID 4688) from Windows' Security Auditing or Sysmon Event ID 1 for detailed command line parameters. If confirmed malicious, this behavior could potentially lead to credential theft and lateral movement within the network. Importantly, this detection does NOT confirm that credentials have been successfully exfiltrated or that malicious intent is definitely present without further context.

  ---

  ### Investigation Steps

  - **Review process creation logs for `findstr.exe`:** Check Security Event ID 4688 or Sysmon Event ID 1 for entries specifically involving `findstr.exe`. Look for unusual parent processes, especially if initiated from non-standard applications like PowerShell or CMD.

  - **Inspect command line arguments:** Focus on command lines that contain `lsass`, particularly those with patterns like `/i "lsass` or `findstr "lsass`. Malicious variations may appear with obfuscation techniques. Validate if the detected command resembles customary operational commands executed in your environment.

  - **Correlate with historical usage:** Examine the frequency and context of `findstr` usage in your environment. Legitimate activities might include scripting or troubleshooting attempts in automation scripts or during maintenance.

  - **Identify associated parent processes:** Investigate the parent process of the detected `findstr.exe` execution for anomalies. If the parent is a highly privileged application (e.g., running under SYSTEM or Administrator), consider this a high-confidence malicious indicator.

  - **Assess for follow-on activities:** If credential theft is suspected, check for subsequent process creations involving tools commonly used for data exfiltration, such as `powershell.exe` or direct access to LSASS memory (e.g., using Mimikatz). This includes looking for processes like `lsass.exe` being executed.

  - **Examine sensitive asset roles:** Determine if the active alert occurred on systems designated as Domain Controllers or servers managing sensitive data. This could elevate the urgency and significance of the alert.

  ---

  ### Prioritization

  This alert has a high-severity level given its detection of potentially malicious reconnaissance aimed at LSASS, which is critical for password and credential storage. The likelihood of exploitation is high, particularly amongst modern threat actors, making this behavior a common precursor to a credential theft or lateral movement.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of command-line obfuscation or aliasing, as attackers might employ various means to disguise their actions. It is crucial to ensure that process creation logging is fully enabled for comprehensive monitoring. Legitimate activities, such as system monitoring or legitimate administrative tasks, may trigger this alert. A related detection that strengthens coverage is monitoring for direct access or dump attempts against the LSASS memory (e.g., through Sysmon or process dump logs).

