title: LSASS Process Reconnaissance Via Findstr.EXE
id: fe63010f-8823-4864-a96b-a7b4a0f7b929
status: test
description: Detects findstring commands that include the keyword lsass, which indicates
  recon actviity for the LSASS process PID
references:
- https://blog.talosintelligence.com/2022/08/recent-cyber-attack.html?m=1
author: Florian Roth (Nextron Systems)
date: 2022-08-12
modified: 2024-06-04
tags:
- attack.credential-access
- attack.t1552.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr_img:
  - Image|endswith:
    - '\find.exe'
    - '\findstr.exe'
  - OriginalFileName:
    - 'FIND.EXE'
    - 'FINDSTR.EXE'
  selection_findstr_cli:
    CommandLine|contains: 'lsass'
  selection_special:
    CommandLine|contains|windash:
    - ' /i "lsass'
    - ' /i lsass.exe'
    - 'findstr "lsass'
    - 'findstr lsass'
    - 'findstr.exe "lsass'
    - 'findstr.exe lsass'
  condition: all of selection_findstr_* or selection_special
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_findstr_lsass/info.yml
note: |
  ### Technical Context
  This detection rule focuses on identifying potential reconnaissance activities targeting the LSASS (Local Security Authority Subsystem Service) process on Windows systems. Before an attacker can exploit LSASS for credential harvesting, they may run commands utilizing `findstr` to identify instances of the process or extract sensitive information related to it. This behavior is indicative of an attacker preparing to escalate privileges or execute further malicious activities.

  The threat scenario suggests that an attacker is attempting to map out the LSASS process to gather information regarding user credentials, which may serve as a precursor to achieving broader access within the network. This aligns with MITRE ATT&CK tactics, specifically "Credential Access" (TA0006) and technique "Credential Dumping: LSASS Memory" (T1552.006), as the goal is to exploit LSASS for credential harvesting.

  Primary data sources for this detection include process creation events, specifically logs capturing command-line arguments associated with `find.exe` and `findstr.exe`. These logs can provide insights into attempts to probe the LSASS process.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and examine process creation events for `find.exe` and `findstr.exe`, particularly those with command-line arguments that include 'lsass'. Look for any unusual patterns or repeated access attempts.

  - **Analyze Command-Line Parameters:** Focus on the command-line parameters used in detected instances. Determine if the commands include variations of 'lsass' that indicate a specific intent to probe the LSASS process.

  - **Correlate with User Activity:** Investigate the user context under which the `findstr` commands were executed. Cross-reference with legitimate user activities to identify any anomalies or suspicious access patterns.

  - **Identify Previous Reconnaissance Steps:** Check for prior reconnaissance commands or tools run on the same device or users. See if there is a pattern of gathering information that points to a more extensive attack preparation phase.

  ### Prioritization
  Given the high potential impact associated with successful credential access through LSASS, this alert should be prioritized as high severity. The likelihood of exploitation following such reconnaissance activities underscores the necessity for prompt investigation and response.

  ### Blind Spots and Assumptions
  One limitation of this detection rule is that it may miss obfuscated or indirect attempts at probing LSASS if attackers use tools other than `findstr` or `find.exe`. The rule assumes that all reconnaissance will manifest through standard process creation logs and does not account for built-in Windows tools or custom scripts attempting similar reconnaissance. Furthermore, there is a reliance on having comprehensive process creation logging enabled; without this, detection will not function properly.

