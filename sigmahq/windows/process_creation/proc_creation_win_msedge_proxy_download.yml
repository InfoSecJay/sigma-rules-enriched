note: |
  ### Technical Context

  This detection rule identifies instances where `msedge_proxy.exe`, a Microsoft Edge component, is utilized to download arbitrary files via HTTP or HTTPS protocols. Attackers may leverage this technique to exfiltrate data or download malicious payloads, often attempting to circumvent established security controls. The relevant MITRE ATT&CK technique is "Command and Scripting Interpreter: Command-Line Interface (T1059.003)," closely linked to tactics such as Execution and Defense Evasion.

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring the process image path and command line arguments associated with the execution of `msedge_proxy.exe`. If exploited maliciously, this could lead to unauthorized data access or system compromise, as an attacker could download malicious files or sensitive information. However, the detection alone does not confirm malicious intent, as `msedge_proxy.exe` can be used legitimately for downloading web content.

  ### Investigation Steps

  - **Examine process creation logs**: Review Security Event ID 4688 to confirm instances of `msedge_proxy.exe` executing. Look for command line arguments that include `http://` or `https://`, indicating an attempt to download content. Document the timestamp and user account associated with the process.

  - **Cross-reference command line usage with legitimate activity**: Identify typical `msedge_proxy.exe` usage in the environment. Legitimate usage often involves integration with standard browsing activities, so check for contextual activity patterns around this process.

  - **Inspect download URLs for malicious content**: Analyze the command line arguments for the URLs being accessed. Verify if the requested files are from known safe domains or correlate with threat intelligence feeds for potential malicious indicators.

  - **Monitor for high-confidence indicators of compromise**: If the previewed file extensions (e.g., `.exe`, `.zip`, `.js`) after a download are suspicious, tag these as high-risk. Collect additional data around these file downloads including Security Event ID 4688 for any subsequent processes spawned.

  - **Assess the context of affected assets**: Identify the role and criticality of the system running `msedge_proxy.exe`. If this process is found on a sensitive server or workstation, elevate the investigation urgency.

  ### Prioritization

  This alert holds medium severity due to the potential impact of downloaded files on sensitive systems. The likelihood of malicious actors exploiting `msedge_proxy.exe` for file downloads during an attack is significant, especially considering this behavior aligns with common obfuscation tactics to bypass security mechanisms.

  ### Blind Spots and Assumptions

  Detection of this behavior may be limited by the legitimate use of `msedge_proxy.exe` in normal operations, which could lead to false positives. It is essential to ensure comprehensive logging of process creations and network activities, particularly for HTTP/HTTPS traffic. Additionally, Windows security configurations should be reviewed to enhance detection capabilities. Related detections, such as those for unexpected file creation events (e.g., Event ID 4663), complement this rule by providing insights into potential file exfiltration or manipulation.

