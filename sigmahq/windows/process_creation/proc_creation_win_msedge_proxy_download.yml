note: |
  ### Technical Context

  This detection targets the use of `msedge_proxy.exe` for downloading arbitrary files from the internet, a behavior typically linked to unauthorized data acquisition or lateral movement. The likely objective of an attacker leveraging this method is to stealthily download tools or exfiltrate data without raising alerts typical of more detectable methods. This aligns with the MITRE ATT&CK technique "Indirect Command Execution" (T1218), where malware may utilize legitimate processes to execute harmful actions.

  Primary telemetry sources for this alert are process creation logs that can be obtained from Windows Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments and image details. If malicious, the security impact can involve data leakage or the introduction of malware into the system. This detection does not confirm that the action is malicious by itself—legitimate usage of the Edge Proxy for downloading files may also trigger this rule, depending on the context of the activity.

  ### Investigation Steps

  - **Review process creation logs:** Inspect Windows Security Event ID 4688 and Sysmon Event ID 1 for `msedge_proxy.exe`. Confirm the command line parameters contain `http://` or `https://`. Legitimate instances typically include URLs from known domains used for legitimate updates or resources.

  - **Analyze the URL patterns:** Look for any unusual URLs in the command line that could indicate malicious intent. For instance, a URL pointing to a non-corporate domain within the context of a sensitive system could indicate a high-confidence malicious download.

  - **Check system impact and context:** Investigate the role of the affected system. If the process appears on critical servers or endpoints handling sensitive data, the potential impact is higher, necessitating deeper scrutiny.

  - **Investigate the download destination:** Validate the presence of newly created files, such as documents or executables, in temporary directory locations (e.g., `%TEMP%`). Look for unusual file types that do not match expectations for allowed downloads.

  - **Cross-reference with threat intelligence:** Utilize threat intelligence to identify any reported malicious actors or campaigns using msedge_proxy.exe for file downloads. This could provide secondary validation of inherent risk.

  ### Prioritization

  This alert should be treated with medium urgency. Although the specific use of `msedge_proxy.exe` is not a commonly weaponized technique, its ability to facilitate arbitrary file downloads poses a risk, particularly if it involves sensitive or critical assets within the environment. The likelihood of malicious actors employing such stealthy tactics increases the importance of thorough investigation.

  ### Blind Spots and Assumptions

  Limitations in detection may arise if `msedge_proxy.exe` usage is poorly logged or if command line arguments are not captured adequately. It is also possible that legitimate administrative actions during legitimate software updates could trigger this alert. Companion detections, such as monitoring for suspicious network connections (using firewall or network logs), could enhance visibility into potentially malicious activity being executed alongside the detected behavior.

