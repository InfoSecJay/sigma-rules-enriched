note: |
  ### Technical Context
  This detection rule identifies the use of "msedge_proxy.exe" to download arbitrary files, which could indicate malicious activity such as data exfiltration or the download of malware. Attackers may exploit this legitimate proxy executable to bypass security measures, using it to establish covert channels for transferring malicious payloads. This behavior is particularly concerning as it can be utilized to target corporate networks stealthily, aiming to compromise sensitive data or system integrity.

  Relevant to this detection are the MITRE ATT&CK tactics of **Execution** (T1203 - Exploitation for Client Execution) and **Defense Evasion** (T1218 - Signed Binary Proxy Execution). Attackers often leverage trusted binaries in unconventional ways to evade detection by security tools. Primary data sources include **process creation events** that record the execution of `msedge_proxy.exe`, as well as command line logs that capture any URL-related arguments that may indicate arbitrary file downloads through this process.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of `msedge_proxy.exe` in the process creation logs, paying special attention to the context in which it was executed and any parent processes that initiated it.
  - **Analyze Command Line Arguments**: Examine the command line strings associated with the execution of `msedge_proxy.exe`. Focus on any URLs that may suggest downloading external content, especially if they redirect to unfamiliar or suspicious domains.
  - **Correlate with Network Traffic**: If possible, check network traffic logs for unusual outbound connections initiated by the IP address associated with the suspect machine. Look for connections to potentially malicious hosts or patterns indicating data exfiltration.
  - **Investigate File Downloads**: Identify and analyze any files downloaded as a result of this activity. Check if these files are stored in locations common for downloads or if they exhibit characteristics typical of malware or other unwanted software.

  ### Prioritization
  This alert is given a medium severity due to its potential to indicate significant security risks, such as information leakage or malware execution, particularly if combined with other suspicious activities. Timely investigation is crucial, as delayed responses could result in further compromises.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the potential for attackers to delete or obfuscate logs related to this executable, which might prevent complete investigation of the incident. The detection logic assumes that `msedge_proxy.exe` is invoked with observable command line arguments that follow its typical usage patterns. Moreover, necessary log configurations must be enabled on Windows systems to capture both process creation and command line details which might not be available in all environments.

