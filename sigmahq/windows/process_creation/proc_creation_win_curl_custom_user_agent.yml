title: Curl Web Request With Potential Custom User-Agent
id: 85de1f22-d189-44e4-8239-dc276b45379b
status: test
description: Detects execution of "curl.exe" with a potential custom "User-Agent".
  Attackers can leverage this to download or exfiltrate data via "curl" to a domain
  that only accept specific "User-Agent" strings
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
- https://github.com/WithSecureLabs/iocs/blob/344203de742bb7e68bd56618f66d34be95a9f9fc/FIN7VEEAM/iocs.csv
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-27
modified: 2025-12-11
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
    # Example: This command line would trigger the rule
    # curl.exe -H "User-Agent: EvilAgent" http://malicious.example.com
  selection_img:
  - Image|endswith: '\curl.exe'
  - OriginalFileName: 'curl.exe'
  selection_header_flag_1:
    CommandLine|re: '\s-H\s'     # Must be Regex as the flag needs to be case sensitive
  selection_header_flag_2:
    CommandLine|contains: '--header'
  selection_user_agent:
    CommandLine|contains: 'User-Agent:'
  condition: selection_img and 1 of selection_header_* and selection_user_agent
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_curl_custom_user_agent/info.yml
note: |
  ### Technical Context
  This detection rule identifies the execution of `curl.exe` with a custom `User-Agent` header, which may indicate potential malicious activity. Attackers often use `curl` to download or exfiltrate data, particularly to domains that specifically require certain `User-Agent` strings to bypass security measures or to mimic legitimate traffic. By leveraging specific headers, including a custom `User-Agent`, adversaries attempt to conceal their operations and evade detection.

  This behavior is closely aligned with MITRE ATT&CK techniques such as **T1071.001** (Application Layer Protocol: Web Protocols) and **T1105** (Ingress Tool Transfer). These techniques encompass scenarios where attackers transfer tools or data through web protocols, such as HTTP/S, potentially indicating a data exfiltration or command-and-control (C2) operation. The primary data sources for detecting such activities include process creation events, which capture command-line arguments passed to processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `curl.exe` being executed with non-standard or custom `User-Agent` strings. Pay special attention to the command line parameters used during execution.

  - **Correlate with Network Traffic:** Examine outbound connections matched with the identified `curl` executions. Look for any suspicious traffic patterns or connections to malicious or unexpected domains that align with the identified command and headers.

  - **Identify User Context:** Investigate the user account that executed `curl.exe`. Look for accounts that may have anomalous privileges or are typically not associated with such activities, as this could indicate unauthorized access.

  - **Cross-Reference with Threat Intelligence:** Utilize external threat intelligence resources or the provided references to see if similar activities or indicators have been reported that may correlate with your findings.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential impact of attackers using `curl` for data exfiltration or command and control communication, which can lead to significant data loss or system compromise. Given that the use of `curl` is often legitimate in administrative tasks, the context and execution environment must be carefully considered.

  ### Blind Spots and Assumptions
  This detection rule may have gaps if `curl.exe` is executed with obfuscated or alternate command-line parameters that do not trigger the current detection logic. It assumes that logs related to process creation are adequately collected and retained. Required configurations include ensuring the monitoring of command-line arguments for process executions, which may not be universally enabled in all environments. Additionally, false positives could arise from legitimate use of `curl` in various administrative operations, which should be factored into operational responses.

