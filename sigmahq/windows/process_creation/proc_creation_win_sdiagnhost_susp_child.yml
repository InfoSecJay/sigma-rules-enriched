title: Sdiagnhost Calling Suspicious Child Process
id: f3d39c45-de1a-4486-a687-ab126124f744
status: test
description: Detects sdiagnhost.exe calling a suspicious child process (e.g. 
  used in exploits for Follina / CVE-2022-30190)
references:
- https://twitter.com/nao_sec/status/1530196847679401984
- https://doublepulsar.com/follina-a-microsoft-office-code-execution-vulnerability-1a47fce5629e
- https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
- https://app.any.run/tasks/f420d295-0457-4e9b-9b9e-6732be227583/
- https://app.any.run/tasks/c4117d9a-f463-461a-b90f-4cd258746798/
author: Nextron Systems, @Kostastsale
date: 2022-06-01
modified: 2024-08-23
tags:
- attack.stealth
- attack.t1036
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\sdiagnhost.exe'
    Image|endswith:
            # Add more suspicious LOLBins
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    - '\mshta.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\taskkill.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
            # - '\csc.exe'   # https://app.any.run/tasks/f420d295-0457-4e9b-9b9e-6732be227583/
    - '\calc.exe'          # https://app.any.run/tasks/f420d295-0457-4e9b-9b9e-6732be227583/
  filter_main_cmd_bits:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'bits'
  filter_main_powershell_noprofile:
    Image|endswith: '\powershell.exe'
    CommandLine|endswith:
    - '-noprofile -'
    - '-noprofile'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where `sdiagnhost.exe` spawns potentially malicious child processes, which are commonly exploited in attacks such as the Follina vulnerability (CVE-2022-30190). The likely attacker objective is to leverage trusted Windows processes to execute arbitrary commands or scripts, facilitating lateral movement or data exfiltration. This detection aligns with the MITRE ATT&CK techniques: **T1036 - Masquerading** and **T1218 - Signed Binary Proxy Execution**.

  The primary telemetry sources include Windows Process Creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If exploited, this behavior poses a significant security risk as it allows attackers to execute harmful payloads under the guise of legitimate processes. However, it's important to note that this detection alone does not confirm malicious intent; additional context is required for a conclusive assessment.

  ### Investigation Steps

  - **Identify the parent process details:**
    Check Security Event ID 4688 or Sysmon Event ID 1 for `sdiagnhost.exe`. Note its start time and any associated user account, indicating whether it aligns with legitimate use.

  - **Review child process command lines:**
    Look for command lines of the spawned child processes (e.g., `cmd.exe`, `powershell.exe`). Malicious indicators include suspicious arguments like `-noprofile`, which can conceal malicious scripts.

  - **Correlate with known LOB applications:**
    Determine if `sdiagnhost.exe` was legitimately executed by reviewing application usage logs. Legitimate behavior often includes system diagnostics within scheduled tasks or troubleshooting tools.

  - **Examine related logs for anomalous behavior:**
    Gather logs from Windows Defender (Event ID 5007), or MDE, regarding file executions that follow `sdiagnhost.exe`. Malicious indicators include unusual file creation patterns or exfiltrated file types like `.zip` or `.exe`.

  - **Assess the system's asset criticality:**
    Focus on systems that are part of sensitive operations or critical infrastructure. Investigate anomalies in their process creation patterns to assess the potential risk of compromise.

  ### Prioritization

  This alert should be treated as high priority, given that it involves a potentially exploited Windows process in critical enterprise systems. The likelihood of malicious activity is significant due to the known exploits related to Follina, which have seen widespread weaponization in the wild.

  ### Blind Spots and Assumptions

  Detection may suffer from false positives stemming from legitimate user activities that involve diagnostics or troubleshooting. Additionally, oversight in tracking the launch context of `sdiagnhost.exe`, especially if executed by benign administrative tasks, may lead to missed interpretations. Ensure that logging for Process Creation (Event ID 4688) and Sysmon is properly configured on all endpoints. Related detections, like anomalous PowerShell executions (T1059.001), can enhance coverage and context around potentially malicious behaviors.

