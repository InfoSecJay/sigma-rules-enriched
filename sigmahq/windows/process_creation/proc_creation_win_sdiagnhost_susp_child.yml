title: Sdiagnhost Calling Suspicious Child Process
id: f3d39c45-de1a-4486-a687-ab126124f744
status: test
description: Detects sdiagnhost.exe calling a suspicious child process (e.g. 
  used in exploits for Follina / CVE-2022-30190)
references:
- https://twitter.com/nao_sec/status/1530196847679401984
- https://doublepulsar.com/follina-a-microsoft-office-code-execution-vulnerability-1a47fce5629e
- https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
- https://app.any.run/tasks/f420d295-0457-4e9b-9b9e-6732be227583/
- https://app.any.run/tasks/c4117d9a-f463-461a-b90f-4cd258746798/
author: Nextron Systems, @Kostastsale
date: 2022-06-01
modified: 2024-08-23
tags:
- attack.defense-evasion
- attack.t1036
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\sdiagnhost.exe'
    Image|endswith:
            # Add more suspicious LOLBins
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
    - '\mshta.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\taskkill.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
            # - '\csc.exe'   # https://app.any.run/tasks/f420d295-0457-4e9b-9b9e-6732be227583/
    - '\calc.exe'          # https://app.any.run/tasks/f420d295-0457-4e9b-9b9e-6732be227583/
  filter_main_cmd_bits:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'bits'
  filter_main_powershell_noprofile:
    Image|endswith: '\powershell.exe'
    CommandLine|endswith:
    - '-noprofile -'
    - '-noprofile'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects when the `sdiagnhost.exe` process spawns a potentially malicious child process, which may indicate exploitation attempts such as those associated with vulnerabilities like Follina (CVE-2022-30190). The likely attacker objective is to leverage this seemingly benign Microsoft utility to perform unauthorized actions through other Windows executables or scripts. The relevant MITRE ATT&CK techniques include Defense Evasion (T1562) and Execution (T1203). The primary telemetry sources required for this detection are process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1 for process creation.

  If this behavior is confirmed as malicious, the security impact could result in unauthorized access, data exfiltration, or compromise of critical systems. Importantly, while this detection identifies suspicious activity, it does NOT confirm the intent or success of an attack on its own.

  ### Investigation Steps

  - **Review Process Creation Events**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where `sdiagnhost.exe` is the parent process. Look for child processes that match the specified list (e.g., `powershell.exe`, `cmd.exe`). Benign calls should be limited to expected administrative tasks.

  - **Analyze Command Line Arguments**: For any identified child processes, review the `CommandLine` field for suspicious arguments. For example, look for patterns that include `-noprofile` (for PowerShell) or any references to `bits` (for cmd) that may indicate malicious intent.

  - **Cross-reference with Known Malicious Indicators**: Check the `Image` and `CommandLine` fields against known indicators of compromise or malicious behavior. High-confidence indicators would include unusual `.exe` paths or unexpected scripts running from user directories.

  - **Assess Asset Criticality**: Determine the role and function of the affected system. If the alert originates from a critical server or sensitive endpoint, prioritize further investigation due to increased risk.

  - **Confirm Legitimate Use Cases**: Validate whether any legitimate administrative tasks or software updates occurred around the time of the alert. Identify common processes that may utilize `sdiagnhost.exe` for maintenance purposes.

  ### Prioritization

  This alert has a high severity level due to potential exploitation of critical vulnerabilities through legitimate system processes. The likelihood of malicious abuse is significant, given the exploitation attempts seen with Follina-related attacks. Such behaviors are becoming more commonly weaponized by adversaries exploiting trusted processes for execution.

  ### Blind Spots and Assumptions

  Detection may miss obfuscation methods where attackers rename or script around `sdiagnhost.exe` to evade this rule. Reliable detection requires proper logging configurations, including Sysmon or enhanced Windows Auditing for process creation. Legitimate activities that might trigger this alert include administrative scripts for system updates or diagnostics. A companion detection that strengthens coverage could include monitoring for unusual PowerShell execution patterns associated with script block logging (T1059.001).

