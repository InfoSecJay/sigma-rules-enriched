detection:
  selection:
    Image|re: '[a-zA-Z]:\\'
    CurrentDirectory|contains: '\\\\wsl.localhost'     # Note: programs not supporting UNC paths (example: cmd.exe). Will default to another location
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of Windows binaries from within a Windows Subsystem for Linux (WSL) instance. The execution of binaries in this context can indicate suspicious activity, as attackers may leverage WSL to execute Windows tools in a manner that evades detection mechanisms, disguising the origins and intent of their commands. By executing binaries in WSL, an attacker may aim to bypass security controls, escalating their access levels or conducting reconnaissance without drawing attention.

  The relevant MITRE ATT&CK tactics for this rule include "Execution" (TA0002) and "Defense Evasion" (TA0005). Techniques that apply here are "Command and Scripting Interpreter" (T1059) and "Exploitation for Client Execution" (T1202), as malicious users may exploit capabilities within WSL to execute commands that have the potential to compromise the integrity of the system.

  Primary data sources for detecting this behavior include process creation logs that capture the details of commands executed on the system, particularly those that involve WSL environments. Monitoring these logs is crucial to identifying anomalous patterns that may indicate malicious intent.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for any recent creation of processes initiated from WSL that may involve known Windows binaries. Correlate with legitimate activities to identify outliers.
  - **Inspect Current Directory Details**: Analyze the `CurrentDirectory` field in process creation logs to confirm whether processes are being run from `\\wsl.localhost`. This can signify an execution context that warrants further scrutiny.
  - **Correlate Execution with User Activity**: Look for the associated user account to determine whether it is a legitimate account and check for any abnormal login behavior around the same timeframe.
  - **Monitor for Parent-Child Process Relationships**: Investigate the relationships between parent and child processes to detect any unusual patterns or sequences, especially if a known administrative tool is being executed from WSL.

  ### Prioritization
  This alert carries a medium severity level due to its potential implications for the security posture of the enterprise. The ability to execute Windows binaries from WSL may indicate an active evasion tactic by an attacker, especially in environments where such activities are uncommon.

  ### Blind Spots and Assumptions
  Detection logic may miss instances where binaries are executed via alternative methods not captured by the current rules, such as obfuscated scripts or processes launching from unexpected directories. It also assumes that WSL usage in the environment is clearly defined and monitored; if legitimate usage is not well-understood, false positives may arise. For this rule to function effectively, comprehensive process creation logs must be available, ensuring that WSL activities are logged regularly in the enterprise environment.

