title: Use of VSIISExeLauncher.exe
id: 18749301-f1c5-4efc-a4c3-276ff1f5b6f8
status: test
description: The "VSIISExeLauncher.exe" binary part of the Visual Studio/VS Code can
  be used to execute arbitrary binaries
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/VSIISExeLauncher/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-09
tags:
- attack.defense-evasion
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\VSIISExeLauncher.exe'
  - OriginalFileName: 'VSIISExeLauncher.exe'
  selection_cli:
    CommandLine|contains:
    - ' -p '
    - ' -a '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the invocation of the `VSIISExeLauncher.exe` binary, which is associated with Visual Studio and Visual Studio Code. While this tool is primarily intended for development purposes, it can be exploited by malicious actors to execute arbitrary binaries, potentially leading to code execution on compromised systems. Attackers may leverage this capability to bypass security controls by disguising their activities within legitimate processes, making it crucial to monitor and investigate its usage.

  In a typical attack scenario, an adversary may use `VSIISExeLauncher.exe` to run payloads that perform actions such as downloading additional malware or establishing persistence mechanisms. The primary goals of such threats include evading detection and escalating privileges within the environment. This activity aligns with the MITRE ATT&CK tactics of **Defense Evasion** (TA0005) and the specific technique of **Exploitation for Client Execution** (T1127).

  To effectively monitor this activity, primary data sources include process creation events on Windows endpoints, which will provide insight into the execution of the binary, its command-line parameters, and associated parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events in your SIEM or EDR to identify instances of `VSIISExeLauncher.exe` being executed. Pay close attention to the parent processes and any irregular patterns indicating suspicious behavior.

  - **Examine Command-Line Parameters**: Check the command line arguments used with `VSIISExeLauncher.exe`. Look for unusual flags such as `-p` and `-a`, which may indicate attempts to exploit the binary for unauthorized purposes.

  - **Correlate with User Activity**: Identify the user accounts that initiated the execution of `VSIISExeLauncher.exe`. Cross-reference their activity logs to determine if the usage aligns with typical development workflows or if it represents an anomaly.

  - **Investigate Network Activity**: Monitor network traffic tied to the execution of this binary for any indications of outbound connections to dubious hosts or attempts to download further malicious binaries.

  ### Prioritization
  This alert carries a medium severity due to the potential consequences of arbitrary code execution via a normally benign application. The likelihood of exploitation through such a mechanism increases if the enterprise environment lacks comprehensive application whitelisting or endpoint protection strategies.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logging for process creation events is not enabled or if security agents do not monitor command-line arguments effectively. The detection logic assumes that `VSIISExeLauncher.exe` usage should be limited within the enterprise context and that any execution with suspicious parameters is likely malicious. Ensuring that systems are configured to capture detailed process logs is essential for this rule to function effectively. Additional configuration may be needed to enrich logs with relevant contextual data for improved detection fidelity.

