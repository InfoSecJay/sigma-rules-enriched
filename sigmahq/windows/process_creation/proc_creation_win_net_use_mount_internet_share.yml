  ---

  ### Technical Context

  This rule detects the usage of the `net.exe` or `net1.exe` utility to mount an internet-hosted WebDAV share. This behavior is characteristic of lateral movement or data exfiltration scenarios where an adversary may attempt to access or transfer sensitive data over the internet using a compromised system. The likely attacker objective is to establish persistence or retrieve information remotely.

  This detection maps to the MITRE ATT&CK technique: **T1021.002 - Remote Services: WebDAV**. The primary telemetry source comes from Windows process creation events, specifically monitoring for the execution of `net.exe` or `net1.exe` with the specified command-line parameters. A successful exploitation could allow unauthorized access to resources or sensitive data, creating a security risk. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative users may also use these commands for valid purposes.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Examine Security Event ID 4688 for recent instances of `net.exe` or `net1.exe` being executed. Look for command-line arguments containing 'use' and 'http'. Any unauthorized or unexpected usage could indicate malicious activity.

  - **Review User Context:** Identify the user account that executed the command and its role. If the account lacks administrative privileges, this could indicate suspicious behavior. Validate against the user’s typical activity pattern.

  - **Inspect network traffic:** Analyze firewall logs and Web proxy logs for connections to unusual external IP addresses, especially those involved in the command execution. Use the fields for destination IP, port, and user agent to flag potential exfiltration.

  - **Monitor for related file activity:** Verify if any files were created or modified as a result of this command. Review related telemetry from File System logs or Sysmon Event ID 11, paying attention to the volume of data moved (e.g., unexpected large uploads).

  - **Document expected behavior:** Cross-reference against legitimate administrative actions seen in your environment where WebDAV shares are typically mounted for business operations. Identify standard IPs and users involved to separate benign from malicious indicators.

  ---

  ### Prioritization

  This alert should be treated as high priority due to the potential impact on sensitive data and assets. The likelihood of malicious usage is significant, as attackers often exploit accessible avenues like WebDAV for lateral movement or exfiltration. This technique is weaponized in various attack campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities, which can trigger false positives if not carefully parsed against user behavior. Ensure that you have sufficient logging enabled across all endpoints to capture `net.exe` executions effectively. Additionally, legitimate software updates or configurations may also involve mounting WebDAV shares. Related detections, such as monitoring for unusual outbound traffic patterns, can enhance overall visibility into potential data exfiltration attempts.

