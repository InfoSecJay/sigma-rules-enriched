logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'powershell.exe'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_cli_action:
    CommandLine|contains:
    - ' add '                   # reg.exe add subcommand
    - 'New-ItemProperty'
    - 'Set-ItemProperty'
    - 'sp '                     # PowerShell alias for Set-ItemProperty
  selection_cli_key:
    CommandLine|contains:
    - '\Lxss\MSI'
    - '/Lxss/MSI'               # forward-slash variant sometimes used with PowerShell paths
  selection_cli_value:
    CommandLine|contains: 'InstallLocation'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_wsl_installlocation_modification_via_cmdline/info.yml
note: |
  ### Technical Context

  This Sigma rule detects attempts to modify the Windows Subsystem for Linux (WSL) InstallLocation registry key using command-line tools such as `reg.exe` or PowerShell. The likely objective of an attacker is to hijack the WSL execution environment, potentially redirecting it to execute malicious binaries instead of legitimate WSL processes. This behavior is associated with the MITRE ATT&CK technique "Scripting" (T1218) and "Registry Run Keys / Startup Folder" (T1112).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log command-line activity. If malicious, this can allow adversaries to persist unwanted software and execute payloads outside typical detection mechanisms. Importantly, this detection does not confirm malicious intent or successful exploitation by itself; context and additional investigation are necessary.

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 and/or Sysmon Event ID 1 for instances where `reg.exe`, `powershell.exe`, or `pwsh.exe` is invoked with arguments containing 'add', 'New-ItemProperty', or 'Set-ItemProperty'. Look for command-line arguments that reference `\Lxss\MSI` or 'InstallLocation'.

  - **Identify legitimate activity:** Verify recent activity related to legitimate WSL updates, focusing on events triggered by `msiexec.exe`. Any WSL updates performed via Windows Installer should appear as process creation from `msiexec.exe` rather than the suspicious processes.

  - **Validate the registry modification:** Check the WSL InstallLocation registry key path `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Lxss` to see if it matches expected values. Discrepancies may indicate malicious modification.

  - **Search for indicators of compromise:** Collect and analyze any related telemetry, including logs from security tools that monitor PowerShell scripts or command execution. Look for commands that attempt to execute scripts from unauthorized paths.

  - **Assess affected system's criticality:** Determine if the affected host has elevated privileges or plays a crucial role within the network, increasing the potential impact of a successful malicious action.

  - **Document additional suspicious indicators:** Cross-reference with metadata in event logs to identify patterns or correlations with historical malicious behavior associated with WSL, reinforcing the severity of the alert.

  ### Prioritization

  This alert is of high severity due to the potential impact on systems running WSL, which can be leveraged for persistent attacks. Given the relatively uncommon legitimate use of direct registry modifications for WSL manipulation, the likelihood of malicious activity in this context is significant. Similar exploitation methods have been weaponized in the past.

  ### Blind Spots and Assumptions

  This alert can be evaded if an attacker modifies the WSL registry key through monitoring bypass techniques, such as executing commands through non-standard user agents or environment settings. Full visibility into changes requires configuring endpoint monitoring to encompass all relevant process creation events adequately. Legitimate administrative scripts that modify the WSL configuration may also trigger this detection. A companion detection to strengthen coverage could include monitoring for unusual outbound WSL network connections that do not align with typical user behavior.

