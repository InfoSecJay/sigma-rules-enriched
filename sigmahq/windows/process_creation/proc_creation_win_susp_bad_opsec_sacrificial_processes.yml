logsource:
  category: process_creation
  product: windows
detection:
  selection_werfault:
    Image|endswith: '\WerFault.exe'
    CommandLine|endswith: 'WerFault.exe'
  selection_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  selection_regsvcs:
    Image|endswith: '\regsvcs.exe'
    CommandLine|endswith: 'regsvcs.exe'
  selection_regasm:
    Image|endswith: '\regasm.exe'
    CommandLine|endswith: 'regasm.exe'
  selection_regsvr32:
    Image|endswith: '\regsvr32.exe'
    CommandLine|endswith: 'regsvr32.exe'
  filter_optional_edge_update:
    ParentImage|contains: '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  filter_optional_chromium_installer:
        # As reported in https://github.com/SigmaHQ/sigma/issues/4570 and others
    ParentImage|contains:
    - '\AppData\Local\BraveSoftware\Brave-Browser\Application\'
    - '\AppData\Local\Google\Chrome\Application\'
    ParentImage|endswith: '\Installer\setup.exe'
    ParentCommandLine|contains: '--uninstall '
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects instances where common Windows utility processes, such as `rundll32.exe`, `WerFault.exe`, `regsvcs.exe`, and `regasm.exe`, are executed without the expected command-line arguments. Attackers may exploit these tools as sacrificial processes to inject malicious capabilities, often bypassing defenses by employing default or incorrect usage patterns. This behavior suggests that an attacker may aim to maintain a foothold, execute payloads, or persist on a system while attempting to evade detection.

  The relevant MITRE ATT&CK tactics include **Execution** and **Stealth** (T1218.011). The primary telemetry source is Windows Process Creation logs, typically captured via Security Event ID 4688 or Sysmon Event ID 1, which detail process creation parameters. If exploited maliciously, such actions could lead to unauthorized code execution or privilege escalation. However, this detection alone does not confirm malicious intent or outcome without additional context.

  ### Investigation Steps

  - **Identify suspicious process execution:** Review [Security Event ID 4688](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4688) or [Sysmon Event ID 1](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon) logs for any instances of `WerFault.exe`, `rundll32.exe`, `regsvcs.exe`, or `regasm.exe` running without expected arguments.

  - **Correlate with parent processes:** Check the `ParentImage` field to understand the context of the executed command. Look for unusual parent processes, particularly those that are not commonly associated with launching these utilities.

  - **Evaluate command-line usage:** Analyze the `CommandLine` field associated with identified processes. Legitimate usage usually includes specific parameters. For instance, `rundll32.exe` is often used with DLL file paths and specific function calls; instances with no arguments or default behaviors are suspicious.

  - **Flag high-confidence malicious indicators:** Investigate any alerts where `rundll32.exe` runs from a user directory with default arguments, as this is a common tactic for covert executions. Correlate with user activity to rule out standard system processes.

  - **Contextualize with asset role:** Assess the criticality of the host system involved. For enterprise-critical assets, such behavior is especially concerning and requires immediate attention.

  - **Check for logs on anomalous permissions:** Ensure logs of any unauthorized access attempts, especially if the process is run from commonly abused locations like `C:\Windows\Temp\`, which can indicate an abuse of the environment.

  ### Prioritization

  This alert is of **high severity**, given that it arises from key system processes commonly leveraged for malicious purposes. The likelihood of abuse exists, especially as attackers frequently use these processes for evasion and persistence. The behaviors monitored are well-documented in various attack methods, making them critical for immediate analysis.

  ### Blind Spots and Assumptions

  Evasion techniques include carefully crafting command-line arguments or using legitimate tools to masquerade malicious activity. The effectiveness of detection relies on proper logging configuration within Windows systems; if these logs are not correctly set up, malicious tactics may go undetected. Additionally, legitimate administrative or development tasks may also trigger this alert, particularly misconfigured scripts or applications. A companion detection to consider is monitoring for credential dumps or unusual parent-child relationships in process executions to enhance situational awareness.

