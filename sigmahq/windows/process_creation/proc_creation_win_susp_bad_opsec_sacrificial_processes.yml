logsource:
  category: process_creation
  product: windows
detection:
  selection_werfault:
    Image|endswith: '\WerFault.exe'
    CommandLine|endswith: 'WerFault.exe'
  selection_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  selection_regsvcs:
    Image|endswith: '\regsvcs.exe'
    CommandLine|endswith: 'regsvcs.exe'
  selection_regasm:
    Image|endswith: '\regasm.exe'
    CommandLine|endswith: 'regasm.exe'
  selection_regsvr32:
    Image|endswith: '\regsvr32.exe'
    CommandLine|endswith: 'regsvr32.exe'
  filter_optional_edge_update:
    ParentImage|contains: '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  filter_optional_chromium_installer:
        # As reported in https://github.com/SigmaHQ/sigma/issues/4570 and others
    ParentImage|contains:
    - '\AppData\Local\BraveSoftware\Brave-Browser\Application\'
    - '\AppData\Local\Google\Chrome\Application\'
    ParentImage|endswith: '\Installer\setup.exe'
    ParentCommandLine|contains: '--uninstall '
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of specific Windows utilities (rundll32.exe, WerFault.exe, regsvcs.exe, regasm.exe, regsvr32.exe) with improper arguments or as sacrificial processes, which are often leveraged in malicious activities to execute payloads or bypass security mechanisms. The likely objective of an attacker using such methods is to inject malicious capabilities into trusted processes without raising suspicion. Relevant MITRE ATT&CK tactics include Defense Evasion (T1218.011). The primary telemetry sources for this detection are process creation logs, specifically focusing on command lines and images.

  If the behavior is confirmed to be malicious, it may lead to significant security incidents, such as data exfiltration or compromised systems. However, this detection alone does NOT confirm malicious intent without further investigation, as legitimate applications may also spawn these processes under certain conditions.

  ---

  ### Investigation Steps

  - **Review process creation events**: Check for Security Event ID 4688 and Sysmon Event ID 1 that include `WerFault.exe`, `rundll32.exe`, `regsvcs.exe`, `regasm.exe`, or `regsvr32.exe`. Legitimate uses may include system updates or troubleshooting, which typically have well-defined command lines.

  - **Analyze command line arguments**: Examine the command lines of the detected processes for empty arguments or nonsensical flags. Malicious use often shows defaults with no parameters, while legitimate uses will include specific parameters indicating their normal operation.

  - **Inspect parent processes**: Identify the parent process of these commands. Malicious behavior is more likely if the parent process is unrelated or suspicious (e.g., `powershell.exe`). Review the related Event IDs and APIs for context on how the user interacted with the system.

  - **Correlate timestamps with user activity**: Cross-reference the process creation timestamps with user actions or known legitimate software installations. User roles with administrative privileges may yield false positives, so determine the legitimacy based on contextual factors.

  - **Look for high-confidence indicators**: Identify if the process is attempting to trigger other known malicious activities, such as creating new user accounts or initiating network connections to suspicious external servers.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential impact of the affected system, which may act as a foothold for further malicious activity. The likelihood of abuse is significant since adversaries often leverage these processes as part of common TTPs (Tactics, Techniques, and Procedures) in their attack strategies. These methods are often weaponized in multi-step attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if processes are executed in a manner that successfully obfuscates the command lines or exploits trusted process paths. Evasion techniques could include altering process arguments or using other legitimate software to spawn these processes without triggering alerts. Legitimate activities that may also trigger this detection include specific software installations or system updates that utilize these executables. A companion detection to strengthen coverage includes monitoring for abnormal child-parent process relationships that align with known attack patterns.

