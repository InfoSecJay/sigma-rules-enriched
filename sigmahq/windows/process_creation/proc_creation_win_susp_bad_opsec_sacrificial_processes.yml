logsource:
  category: process_creation
  product: windows
detection:
  selection_werfault:
    Image|endswith: '\WerFault.exe'
    CommandLine|endswith: 'WerFault.exe'
  selection_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  selection_regsvcs:
    Image|endswith: '\regsvcs.exe'
    CommandLine|endswith: 'regsvcs.exe'
  selection_regasm:
    Image|endswith: '\regasm.exe'
    CommandLine|endswith: 'regasm.exe'
  selection_regsvr32:
    Image|endswith: '\regsvr32.exe'
    CommandLine|endswith: 'regsvr32.exe'
  filter_optional_edge_update:
    ParentImage|contains: '\AppData\Local\Microsoft\EdgeUpdate\Install\{'
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  filter_optional_chromium_installer:
        # As reported in https://github.com/SigmaHQ/sigma/issues/4570 and others
    ParentImage|contains:
    - '\AppData\Local\BraveSoftware\Brave-Browser\Application\'
    - '\AppData\Local\Google\Chrome\Application\'
    ParentImage|endswith: '\Installer\setup.exe'
    ParentCommandLine|contains: '--uninstall '
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of specific Windows executables (WerFault.exe, rundll32.exe, regsvcs.exe, regasm.exe, regsvr32.exe) without the expected command-line arguments, indicating poor operational security (OpSec) practices. Attackers may aim to leverage these legitimate processes to execute payloads or other capabilities without attracting attention. This behavior can correlate with evasion tactics used during lateral movement or post-exploitation phases. Relevant MITRE ATT&CK technique is Defense Evasion (T1218.011), which focuses on process injection and abuse of legitimate tools. Primary telemetry sources include Windows Process Creation logs (Event ID 4688) and Sysmon log data for detailed command-line arguments. If malicious, this behavior can lead to compromised systems or escalated privileges. It is important to note that this detection alone does not confirm malicious intent; further investigation into context is necessary.

  ### Investigation Steps

  - **Review the process creation logs:** Examine Security Event ID 4688 for instances of WerFault.exe, rundll32.exe, regsvcs.exe, regasm.exe, or regsvr32.exe being executed without expected arguments. Expected behavior typically involves these processes being executed with specific parameters related to legitimate system functions.

  - **Analyze command-line arguments:** Look for command-line arguments associated with the detected processes in Sysmon Event ID 1 logs. A command like "rundll32.exe" without additional parameters is highly suspicious and can be indicative of misuse.

  - **Check parent process details:** Investigate the ParentImage field in the process creation logs to identify the immediate parent process responsible for launching these executables. Be skeptical of unknown processes initiating benign-looking executables.

  - **Cross-reference with threat intelligence:** Validate against known malicious indicators from platforms like VirusTotal or enterprise threat intelligence feeds. Reports on using tools like Cobalt Strike or Kraken may show overlaps with detected process behaviors.

  - **Investigate system criticality:** Determine if the affected asset is a critical server or workstation. Assets more prone to exploit (e.g., domain controllers) should be prioritized for immediate investigation.

  - **Identify previous context of execution:** Look for any prior unusual activities surrounding the time of detection, such as remote access or unusual network traffic patterns that could indicate broader malicious intent.

  ### Prioritization

  This alert should be considered high severity due to the potential for significant security impact if legitimate processes are misused. The likelihood of malicious exploitation is elevated, particularly in environments with advanced threats leveraging built-in Windows utilities. The techniques observed are frequently weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if certain log sources are not enabled or properly configured, particularly Sysmon logs which provide deeper insights into command-line arguments. Legitimate scenarios, such as automated system updates or other software relying on these executables, could also trigger this alert. Companion detections, such as monitoring for unusual network connections initiated by these processes, can enhance overall visibility into potential threats.

