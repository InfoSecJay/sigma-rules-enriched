title: Arbitrary Binary Execution Using GUP Utility
id: d65aee4d-2292-4cea-b832-83accd6cfa43
status: test
description: Detects execution of the Notepad++ updater (gup) to launch other commands
  or executables
references:
- https://twitter.com/nas_bench/status/1535322445439180803
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-10
modified: 2023-03-02
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\gup.exe'
    Image|endswith: '\explorer.exe'
  filter:
    Image|endswith: '\explorer.exe'
    CommandLine|contains: '\Notepad++\notepad++.exe'
  filter_parent:
    ParentImage|contains: '\Notepad++\updater\'
  filter_null:
    CommandLine:
  condition: selection and not 1 of filter*
falsepositives:
- Other parent binaries using GUP not currently identified
level: medium
note: |
  ### Technical Context
  This rule detects the execution of arbitrary binaries through the Notepad++ updater utility (gup.exe). Attackers may leverage gup.exe to launch other executables or commands, evading security controls by disguising malicious activities under the guise of a legitimate process. This technique may be used to execute backdoors, payloads, or scripts that could lead to further unauthorized actions, such as data exfiltration or lateral movement within the network.

  Relevant MITRE ATT&CK tactics and techniques related to this detection include **Execution (TA0002)** and specifically **Execution through Application Layer Protocol (T1203)**, where attackers execute arbitrary code via misused legitimate processes. The primary data sources for this detection include **process creation events** that log the activities surrounding the execution of binaries, which can provide insight into the commands and their origins.

  ### Investigation Steps
  - **Review Process Logs:** Check the process creation logs for instances of gup.exe as the parent process and examine any child processes initiated, particularly looking for the execution of notepad++.exe or other unfamiliar binaries.
  - **Analyze Command-Line Arguments:** Investigate the command-line arguments tied to the detected process. Determine if they reveal any suspicious or unusual commands that deviate from typical usage patterns for Notepad++ or related applications.
  - **Examine Parent Process Metadata:** Assess the metadata of the parent process (gup.exe) to ensure it is legitimate and not a malicious copy. Verify its path against known good locations and its digital signature if available.
  - **Correlate with Other Security Events:** Look for related security events across the SIEM, EDR, and other telemetry sources. Gather context from network logs or endpoint detections to determine if further suspicious behavior accompanies the arbitrary execution.

  ### Prioritization
  This alert is considered medium severity due to the potential for exploitation of legitimate processes to execute arbitrary code, leading to significant security risks in an enterprise environment. The likelihood of this behavior being indicative of malicious activity increases when the process execution deviates from known good usage patterns.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage due to the use of other binaries that utilize GUP without proper identification. Additionally, the detection logic assumes that any use of gup.exe to launch arbitrary executables is malicious; however, there may be benign use cases that could generate false positives. To improve detection accuracy, comprehensive logging of process creation events must be enabled and configured correctly across the enterprise environment.

