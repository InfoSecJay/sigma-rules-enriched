title: Arbitrary Binary Execution Using GUP Utility
id: d65aee4d-2292-4cea-b832-83accd6cfa43
status: test
description: Detects execution of the Notepad++ updater (gup) to launch other commands
  or executables
references:
- https://twitter.com/nas_bench/status/1535322445439180803
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-10
modified: 2023-03-02
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\gup.exe'
    Image|endswith: '\explorer.exe'
  filter:
    Image|endswith: '\explorer.exe'
    CommandLine|contains: '\Notepad++\notepad++.exe'
  filter_parent:
    ParentImage|contains: '\Notepad++\updater\'
  filter_null:
    CommandLine:
  condition: selection and not 1 of filter*
falsepositives:
- Other parent binaries using GUP not currently identified
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of Notepad++’s updater (gup.exe) being used as a parent process to launch other commands or executables, specifically Notepad++. The primary attacker objective likely involves utilizing gup.exe as a trusted process to obscure malicious activity, such as executing payloads under the guise of a legitimate application. This behavior correlates with the MITRE ATT&CK tactics of Execution (TA0002) and the technique of Command-Line Interface (T1059).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688, which logs process creation events, and Sysmon Event ID 1, which provides detailed information about process creation. If this behavior is malicious, it may indicate bypassing security measures and executing unauthorized software. However, it is essential to note that this detection alone does not confirm malicious intent without further contextual information.

  ---

  ### Investigation Steps

  - **Review event details:** Check Security Event ID 4688 or Sysmon Event ID 1 for the `ParentImage` field containing `gup.exe` and the `Image` field containing `explorer.exe`. This indicates the use of Notepad++’s updater as a potential launching point for other commands.

  - **Analyze command-line arguments:** Observe the `CommandLine` field within Event ID 4688 or Sysmon logs. A legitimate process typically has `CommandLine` presenting Notepad++ parameters, e.g., `\Notepad++\notepad++.exe`. Be cautious of atypical or unexpected parameters indicative of potential abuse.

  - **Identify the file paths:** Verify the `Path` of the executed image against expected installation directories for Notepad++. Legitimate paths should be within the Notepad++ installation directory (e.g., `C:\Program Files\Notepad++`). Paths leading to developer environments or off-site locations may indicate malicious intent.

  - **Cross-reference with established baselines:** Compare the current process executions against historical baselines for the system and user account involved. Frequent use of gup.exe followed by execution of unfamiliar commands may signal suspicious activity.

  - **Correlation with other alerts:** Review recent alerts from EDR tools or network logs for unauthorized access attempts correlating with this execution. Multiple detections across various systems may indicate a coordinated attack.

  - **Assess system criticality:** Determine the role and criticality of the affected host. If the host is part of sensitive infrastructure, such as domain controllers or financial systems, prioritize the investigation due to heightened risk.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for exploitation if gup.exe is abused to execute unauthorized commands. The likelihood of such behavior being weaponized is moderate, as attackers often leverage trusted applications for stealth. An affected system's criticality further amplifies the urgency for swift investigation.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion if attackers use other legitimate-looking binaries to execute malicious payloads, leading to similar process creation logs. Ensuring comprehensive process creation logging is crucial for reliable detection, as well as monitoring for other trusted applications that might exhibit similar behavior. Legitimate updates or administrative scripts using gup.exe could inadvertently trigger this alert. Correlate with other detection methods, such as detecting suspicious command lines executed from user environments (related detection: Execution of non-standard applications in user contexts).

