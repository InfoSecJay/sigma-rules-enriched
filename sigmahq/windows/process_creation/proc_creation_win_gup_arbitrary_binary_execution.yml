title: Arbitrary Binary Execution Using GUP Utility
id: d65aee4d-2292-4cea-b832-83accd6cfa43
status: test
description: Detects execution of the Notepad++ updater (gup) to launch other 
  commands or executables
references:
- https://twitter.com/nas_bench/status/1535322445439180803
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-10
modified: 2023-03-02
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\gup.exe'
    Image|endswith: '\explorer.exe'
  filter:
    Image|endswith: '\explorer.exe'
    CommandLine|contains: '\Notepad++\notepad++.exe'
  filter_parent:
    ParentImage|contains: '\Notepad++\updater\'
  filter_null:
    CommandLine:
  condition: selection and not 1 of filter*
falsepositives:
- Other parent binaries using GUP not currently identified
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of arbitrary binaries via the Notepad++ updater (gup.exe). An attacker may leverage the updater's process to execute malicious commands or applications, disguising their behavior to evade detection. This activity is associated with the MITRE ATT&CK tactic "Execution" and technique "Command and Scripting Interpreter: PowerShell" (T1059).

  The primary telemetry source required for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it could lead to unauthorized execution of payloads or persistence mechanisms. This detection does NOT confirm that malicious activity has occurred on its own, as there may be legitimate uses of gup.exe that fit the detection criteria.

  ---

  ### Investigation Steps

  - **Check the process parent and command line details**: Review Event ID 4688 or Sysmon Event ID 1 for logs indicating that gup.exe is the parent process. Note the command line used; malicious indicators typically contain commands for executing unauthorized binaries like Notepad++.

  - **Identify legitimate usage of Notepad++**: Examine user behavior related to Notepad++. If users are known to regularly update and run Notepad++, this may suggest benign activity. Confirming typical paths and command line patterns used can help establish context.

  - **Verify execution details and integrity of created processes**: Look for subprocess creation logs where the command line indicates unauthorized path execution, such as "C:\Program Files\Notepad++\notepad++.exe" being invoked with unusual parameters. This indicates high-confidence malicious behavior.

  - **Assess the user account behavior**: Analyze user account-related logs for unusual activity. If the account associated with gup.exe execution lacks administrative privileges or is unrecognized, this could signal malicious activity.

  - **Explore for existing alerts or logs around the time of execution**: Use logs from the SIEM to correlate with other potentially suspicious activities or alerts that may reinforce the context of this detection, such as related Event IDs that highlight network connections or suspicious file modifications.

  ---

  ### Prioritization

  This alert has medium severity due to the potential execution of unauthorized binaries on user systems that could lead to data compromise or further malicious actions. The likelihood of abuse via this method is moderate, particularly if Notepad++ is a common application in the environment and often updated.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate use of the gup.exe process, which may lead to false positives. Reliable detection requires that all process creation logs from relevant endpoints are configured correctly, including Sysmon for comprehensive event coverage. Legitimate updater activity, especially during known maintenance windows, may trigger this alert. A related detection to consider is monitoring for unusual outbound connections from the same user agent, as it may indicate exfiltration attempts post-execution.

