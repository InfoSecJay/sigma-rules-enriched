title: Suspicious Manipulation Of Default Accounts Via Net.EXE
id: 5b768e71-86f2-4879-b448-81061cbae951
status: test
description: Detects suspicious manipulations of default accounts such as 
  'administrator' and 'guest'. For example 'enable' or 'disable' accounts or 
  change the password...etc
references:
- https://www.trellix.com/en-sg/about/newsroom/stories/threat-labs/lockergoga-ransomware-family-used-in-targeted-attacks.html
- https://redacted.com/blog/bianlian-ransomware-gang-gives-it-a-go/
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-01
modified: 2023-02-21
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_user_option:
    CommandLine|contains: ' user '
  selection_username:
    CommandLine|contains:
            # Note: We need to write the full account name for cases starting with 'admin' to avoid lookups only with the user flag
    - ' Järjestelmänvalvoja '         # Finish
    - ' Rendszergazda '         # Hungarian
    - ' Администратор '         # Russian
    - ' Administrateur '         # French
    - ' Administrador '         # Portuguese (Brazil + Portugal) + Spanish
    - ' Administratör '         # Swedish
    - ' Administrator '         # English
    - ' guest '
    - ' DefaultAccount '
            # The cases below are for when an attacker requests the net command via 'cmd /c....'
            # First in double quotes
    - ' "Järjestelmänvalvoja" '         # Finish
    - ' "Rendszergazda" '         # Hungarian
    - ' "Администратор" '         # Russian
    - ' "Administrateur" '         # French
    - ' "Administrador" '         # Portuguese (Brazil + Portugal) + Spanish
    - ' "Administratör" '         # Swedish
    - ' "Administrator" '         # English
    - ' "guest" '
    - ' "DefaultAccount" '
            # Second in single quotes
    - " 'Järjestelmänvalvoja' "         # Finish
    - " 'Rendszergazda' "         # Hungarian
    - " 'Администратор' "         # Russian
    - " 'Administrateur' "         # French
    - " 'Administrador' "         # Portuguese (Brazil + Portugal) + Spanish
    - " 'Administratör' "         # Swedish
    - " 'Administrator' "         # English
    - " 'guest' "
    - " 'DefaultAccount' "
  filter:
    CommandLine|contains|all:
    - 'guest'
    - '/active no'
  condition: all of selection_* and not filter
falsepositives:
- Some false positives could occur with the admin or guest account. It depends 
  on the scripts being used by the admins in your env. If you experience a lot 
  of FP you could reduce the level to medium
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_net_user_default_accounts_manipulation/info.yml
note: |
  ### Technical Context

  This rule detects suspicious manipulations of default accounts, specifically focusing on operations affecting accounts like 'Administrator' and 'Guest' via the use of the `net.exe` command. The likely attacker objective is to enable, disable, or alter passwords of these accounts to maintain persistence or elevate privileges within the system. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique Account Manipulation (T1560.001).

  Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 for process creation events. If executed with malicious intent, the impact could include unauthorized access to sensitive data or system controls. It is crucial to note that this detection alone does NOT confirm malicious intent; legitimate administrative actions may trigger the same rule.

  ### Investigation Steps

  - **Examine process creation events:** Check Windows Security Event ID 4688 for process creation involving `net.exe` or `net1.exe`. Look for the CommandLine containing any of the following keywords: 'Administrator', 'Guest', or 'DefaultAccount'.

  - **Identify command line parameters:** Focus on CommandLine arguments that include 'user', as this indicates attempts to manipulate user accounts. If flags like '/active no' are present in the command line, evaluate the legitimacy of this action against organizational policy.

  - **Cross-check user roles:** Verify the account executing the command. Legitimate changes should be performed by administrators; assess whether the user has the right privileges and whether such account modifications are common practice in your environment.

  - **Look for anomalies:** Investigate if the `net.exe` command was run from suspicious processes or locations. Authentic usage usually occurs from standard paths (like `C:\Windows\System32\`). Any deviations could indicate malicious activity.

  - **Assess logon patterns:** Check for abnormal logon patterns or times associated with the actions. For example, account modifications outside of standard working hours might raise red flags.

  - **Confirm previously documented activities:** Identify any legitimate scripts or administrative tools that have previously accessed `net.exe` to establish a baseline of expected normal behavior, which can help differentiate between legitimate and malicious actions.

  ### Prioritization

  This alert is considered high severity due to the potential for an attacker to gain elevated privileges through the manipulation of default accounts, which are often targeted in enterprise environments. The likelihood of malicious abuse is significant as these accounts typically have powerful access to systems, making them frequent targets.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative tasks that could trigger this rule, leading to false positives. Ensuring comprehensive logging from all endpoints and maintaining updated telemetry configurations are essential for reliable detection. Additionally, legitimate scripts utilizing `net.exe` for tasks like account management could inadvertently trigger alerts. Companion detections, such as monitoring for account logon failures (Event ID 4625), can help identify potential abuse patterns related to this activity.

