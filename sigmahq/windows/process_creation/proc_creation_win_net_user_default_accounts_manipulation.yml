title: Suspicious Manipulation Of Default Accounts Via Net.EXE
id: 5b768e71-86f2-4879-b448-81061cbae951
status: test
description: Detects suspicious manipulations of default accounts such as 
  'administrator' and 'guest'. For example 'enable' or 'disable' accounts or 
  change the password...etc
references:
- https://www.trellix.com/en-sg/about/newsroom/stories/threat-labs/lockergoga-ransomware-family-used-in-targeted-attacks.html
- https://redacted.com/blog/bianlian-ransomware-gang-gives-it-a-go/
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-01
modified: 2023-02-21
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_user_option:
    CommandLine|contains: ' user '
  selection_username:
    CommandLine|contains:
            # Note: We need to write the full account name for cases starting with 'admin' to avoid lookups only with the user flag
    - ' Järjestelmänvalvoja '         # Finish
    - ' Rendszergazda '         # Hungarian
    - ' Администратор '         # Russian
    - ' Administrateur '         # French
    - ' Administrador '         # Portuguese (Brazil + Portugal) + Spanish
    - ' Administratör '         # Swedish
    - ' Administrator '         # English
    - ' guest '
    - ' DefaultAccount '
            # The cases below are for when an attacker requests the net command via 'cmd /c....'
            # First in double quotes
    - ' "Järjestelmänvalvoja" '         # Finish
    - ' "Rendszergazda" '         # Hungarian
    - ' "Администратор" '         # Russian
    - ' "Administrateur" '         # French
    - ' "Administrador" '         # Portuguese (Brazil + Portugal) + Spanish
    - ' "Administratör" '         # Swedish
    - ' "Administrator" '         # English
    - ' "guest" '
    - ' "DefaultAccount" '
            # Second in single quotes
    - " 'Järjestelmänvalvoja' "         # Finish
    - " 'Rendszergazda' "         # Hungarian
    - " 'Администратор' "         # Russian
    - " 'Administrateur' "         # French
    - " 'Administrador' "         # Portuguese (Brazil + Portugal) + Spanish
    - " 'Administratör' "         # Swedish
    - " 'Administrator' "         # English
    - " 'guest' "
    - " 'DefaultAccount' "
  filter:
    CommandLine|contains|all:
    - 'guest'
    - '/active no'
  condition: all of selection_* and not filter
falsepositives:
- Some false positives could occur with the admin or guest account. It depends 
  on the scripts being used by the admins in your env. If you experience a lot 
  of FP you could reduce the level to medium
level: high
note: |
  ### Technical Context

  This rule detects the manipulation of default accounts, specifically through commands issued by `net.exe`. Attackers may leverage these commands to enable, disable, or change passwords for accounts like 'administrator' or 'guest' as a tactic to maintain persistence or move laterally within the environment. This behavior typically aligns with the MITRE ATT&CK tactic "Credential Access" (TA0006) and technique "Manipulation of Default Accounts" (T1560.001). The primary telemetry source is process creation logs from Windows, specifically focusing on Event ID 4688 or Sysmon Event ID 1, capturing command line arguments used during the execution of `net.exe`. A successful execution may lead to unauthorized access, privilege escalation, and lateral movement within the network.

  It is critical to note that this detection does NOT confirm that an account was successfully manipulated; it only highlights suspicious command execution involving default accounts, further investigation is required.

  ### Investigation Steps

  - **Review the specific command execution:** Examine the command line arguments associated with Event ID 4688 (Process Creation) for `net.exe`, focusing specifically on commands that involve 'administrator' or 'guest'. Malicious indicators include commands related to enabling/disabling these accounts or changing their passwords.

  - **Check account status:** Use Windows Event ID 4722 (User Account Enabled) or 4725 (User Account Disabled) logs to determine if the target accounts had their statuses changed, providing a high-confidence indicator of malicious behavior.

  - **Identify legitimate usage:** During typical administrative workflows, check for instances where 'net.exe' is used with commonly accepted commands (e.g., `net localgroup administrators`). This may be a legitimate activity if performed by known administrative users during routine maintenance tasks.

  - **Inspect user account logs:** Analyze Security Event ID 4776 (Credential Validation) or Event ID 4624 (Successful Logon) to establish if the accounts in question were targeted for logons after manipulation, indicating potential unauthorized access attempts.

  - **Correlate with lateral movement tools:** Look for any additional logs from tools or behaviors associated with post-exploitation frameworks (e.g., Mimikatz or other credential dumping tools) that may follow this manipulation of default accounts indicating an escalated threat.

  - **Host role consideration:** Validate whether the affected system is a domain controller or other critical infrastructure. The impact of unauthorized account manipulation on such systems can be significantly higher, warranting urgent investigation and response.

  ### Prioritization

  This alert is of **high severity** within the enterprise context due to the potential impact on system integrity and access control. Given the importance of default accounts in maintaining administrative control, any manipulation is likely to be leveraged maliciously. The techniques observed are commonly weaponized by adversaries, making prompt investigation critical.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain log sources or incomplete event logging configurations; ensure that process creation logs are consistently collected and ingested. Legitimate activities, such as scheduled maintenance scripts, may inadvertently trigger this alert. A complementary detection mechanism includes monitoring for lateral movement patterns to strengthen overall coverage against this type of account manipulation. Moreover, administrative scripts that modify user accounts may lead to false positives, necessitating review thresholds to minimize alert fatigue.

