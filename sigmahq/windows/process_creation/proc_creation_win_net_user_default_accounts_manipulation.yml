title: Suspicious Manipulation Of Default Accounts Via Net.EXE
id: 5b768e71-86f2-4879-b448-81061cbae951
status: test
description: Detects suspicious manipulations of default accounts such as 'administrator'
  and 'guest'. For example 'enable' or 'disable' accounts or change the password...etc
references:
- https://www.trellix.com/en-sg/about/newsroom/stories/threat-labs/lockergoga-ransomware-family-used-in-targeted-attacks.html
- https://redacted.com/blog/bianlian-ransomware-gang-gives-it-a-go/
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-01
modified: 2023-02-21
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_user_option:
    CommandLine|contains: ' user '
  selection_username:
    CommandLine|contains:
            # Note: We need to write the full account name for cases starting with 'admin' to avoid lookups only with the user flag
    - ' Järjestelmänvalvoja '         # Finish
    - ' Rendszergazda '         # Hungarian
    - ' Администратор '         # Russian
    - ' Administrateur '         # French
    - ' Administrador '         # Portuguese (Brazil + Portugal) + Spanish
    - ' Administratör '         # Swedish
    - ' Administrator '         # English
    - ' guest '
    - ' DefaultAccount '
            # The cases below are for when an attacker requests the net command via 'cmd /c....'
            # First in double quotes
    - ' "Järjestelmänvalvoja" '         # Finish
    - ' "Rendszergazda" '         # Hungarian
    - ' "Администратор" '         # Russian
    - ' "Administrateur" '         # French
    - ' "Administrador" '         # Portuguese (Brazil + Portugal) + Spanish
    - ' "Administratör" '         # Swedish
    - ' "Administrator" '         # English
    - ' "guest" '
    - ' "DefaultAccount" '
            # Second in single quotes
    - " 'Järjestelmänvalvoja' "         # Finish
    - " 'Rendszergazda' "         # Hungarian
    - " 'Администратор' "         # Russian
    - " 'Administrateur' "         # French
    - " 'Administrador' "         # Portuguese (Brazil + Portugal) + Spanish
    - " 'Administratör' "         # Swedish
    - " 'Administrator' "         # English
    - " 'guest' "
    - " 'DefaultAccount' "
  filter:
    CommandLine|contains|all:
    - 'guest'
    - '/active no'
  condition: all of selection_* and not filter
falsepositives:
- Some false positives could occur with the admin or guest account. It depends on
  the scripts being used by the admins in your env. If you experience a lot of FP
  you could reduce the level to medium
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious manipulations of default accounts such as 'Administrator' and 'Guest' through the Windows command-line utility 'net.exe'. This behavior typically aligns with attempts to disable, enable, or modify the passwords of high-privilege accounts, potentially indicating an attacker’s objective to obtain or maintain unauthorized access to critical systems. The relevant MITRE ATT&CK tactic is **Credential Access** (TA0006) and the technique is **Manipulation of Default Accounts** (T1560.001).

  The primary telemetry source involves process creation events, particularly focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, such actions pose a significant security risk as they can circumvent access controls and facilitate further actions like lateral movement or persistence. However, this detection does NOT confirm that the command was executed without legitimate justification, such as maintenance operations by system administrators.

  ---

  ### Investigation Steps

  - **Review command usage:** Check Security Event ID 4688 for process creation events that include **net.exe** under the user context. Legitimate entries typically involve system administrators using this tool for user management without triggering multiple account manipulations.

  - **Analyze command line arguments:** Look for the presence of keywords like 'enable', 'disable', or 'change password' in the CommandLine field for the process. A combination of **'guest'** and **'/active:no'** indicates a potential malicious intent to disable the guest account.

  - **Check user account activity:** Cross-reference the user account activity in the logs (e.g., Event ID 4624 for logon events) to determine if the account executing the command has a legitimate reason to manipulate default accounts. Look for unexpected accounts performing such actions.

  - **Identify high-confidence malicious indicators:** Investigate instances where **DefaultAccount** is manipulated or where the command line contains multiple languages or unexpected flags indicating evasion attempts, such as unapproved characters or misleading syntax.

  - **Examine related telemetry for anomalies:** Analyze Windows Event Logs focusing on user and account management, looking for sudden spikes in account management commands within a short time frame, which is atypical for standard operational behavior.

  ---

  ### Prioritization

  Given the impact of altering 'Administrator' or 'Guest' accounts, this alert has a high severity level. The likelihood of malicious abuse is significant, especially if the alerts are triggered on systems storing sensitive data or critical operations. Such manipulations are commonly weaponized in the early stages of attacks, especially by adversaries looking to gain a foothold in a network.

  ---

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques, such as attackers using obfuscated commands or alternate methods of account manipulation that do not utilize **net.exe**. Reliable detection relies on proper configuration and monitoring of account management logs, particularly for sensitive organizational accounts. Legitimate administrative scripts or automated maintenance tasks may also trigger these alerts. A related detection to consider is monitoring for failed login attempts (e.g., Event ID 4625), which may indicate attempts to modify default accounts.

