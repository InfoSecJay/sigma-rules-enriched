title: Suspicious Manipulation Of Default Accounts Via Net.EXE
id: 5b768e71-86f2-4879-b448-81061cbae951
status: test
description: Detects suspicious manipulations of default accounts such as 'administrator'
  and 'guest'. For example 'enable' or 'disable' accounts or change the password...etc
references:
- https://www.trellix.com/en-sg/about/newsroom/stories/threat-labs/lockergoga-ransomware-family-used-in-targeted-attacks.html
- https://redacted.com/blog/bianlian-ransomware-gang-gives-it-a-go/
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-01
modified: 2023-02-21
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_user_option:
    CommandLine|contains: ' user '
  selection_username:
    CommandLine|contains:
            # Note: We need to write the full account name for cases starting with 'admin' to avoid lookups only with the user flag
    - ' Järjestelmänvalvoja '         # Finish
    - ' Rendszergazda '         # Hungarian
    - ' Администратор '         # Russian
    - ' Administrateur '         # French
    - ' Administrador '         # Portuguese (Brazil + Portugal) + Spanish
    - ' Administratör '         # Swedish
    - ' Administrator '         # English
    - ' guest '
    - ' DefaultAccount '
            # The cases below are for when an attacker requests the net command via 'cmd /c....'
            # First in double quotes
    - ' "Järjestelmänvalvoja" '         # Finish
    - ' "Rendszergazda" '         # Hungarian
    - ' "Администратор" '         # Russian
    - ' "Administrateur" '         # French
    - ' "Administrador" '         # Portuguese (Brazil + Portugal) + Spanish
    - ' "Administratör" '         # Swedish
    - ' "Administrator" '         # English
    - ' "guest" '
    - ' "DefaultAccount" '
            # Second in single quotes
    - " 'Järjestelmänvalvoja' "         # Finish
    - " 'Rendszergazda' "         # Hungarian
    - " 'Администратор' "         # Russian
    - " 'Administrateur' "         # French
    - " 'Administrador' "         # Portuguese (Brazil + Portugal) + Spanish
    - " 'Administratör' "         # Swedish
    - " 'Administrator' "         # English
    - " 'guest' "
    - " 'DefaultAccount' "
  filter:
    CommandLine|contains|all:
    - 'guest'
    - '/active no'
  condition: all of selection_* and not filter
falsepositives:
- Some false positives could occur with the admin or guest account. It depends on
  the scripts being used by the admins in your env. If you experience a lot of FP
  you could reduce the level to medium
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious manipulations targeting default accounts, specifically the built-in 'administrator' and 'guest' accounts, using the `net.exe` utility. Attackers often aim to enable or disable these accounts or alter their passwords to maintain access and escalate privileges within a compromised system. The use of default accounts for manipulation is a tactic often employed in various ransomware attacks, such as the ones utilized by the Lockergoga and Bianlian gangs, where misuse of such accounts is a precursor to further malicious activities.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence (T1547)**: Creating or modifying system accounts such as 'administrator' to maintain access.
  - **Privilege Escalation (T1068)**: Taking advantage of default or misconfigured accounts to gain higher privileges unlawfully.
  - **Credential Access (T1560.001)**: Collecting account information, especially for high-privilege accounts.

  Primary data sources for this detection include process creation events from Windows systems, specifically logs that detail command-line executions, thereby providing context around actions taken with default accounts via the `net.exe` command.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of `net.exe` or `net1.exe` in the command-line fields that include manipulations of the 'administrator' or 'guest' accounts.
  - **Analyze Command-Line Arguments**: Focus on any command-line arguments that indicate account management actions, such as 'enable', 'disable', or password changes related to the mentioned accounts.
  - **Investigate Recent Logon Events**: Cross-reference the times of detected commands with logon events for the 'administrator' and 'guest' accounts to identify any unusual activity patterns or concurrent access.
  - **Check for Unusual Network Activity**: Monitor related network connections (e.g., SMB traffic) that may correlate with the manipulations of default accounts, as this could indicate lateral movement or exploitation attempts.

  ### Prioritization
  Due to the critical nature of default accounts in Windows environments, alerts regarding their manipulation should be prioritized as high severity. Such actions often signify potential intrusion attempts and could lead to escalated privileges or broader network compromise.

  ### Blind Spots and Assumptions
  While this detection covers various manipulations of default accounts, there may be gaps in coverage regarding scripted administrative actions that may not trigger the alert. The detection logic assumes that attackers will utilize recognizable commands to manipulate these accounts, which may not always be the case. Additionally, the success of this alert requires accurate process creation logging and the absence of overly complex command usage by legitimate administrators to prevent false positives.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
