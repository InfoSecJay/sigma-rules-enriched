detection:
  selection_binary:
  - Image|endswith: '\mpiexec.exe'
  - Hashes|contains: 'IMPHASH=d8b52ef6aaa3a81501bdfff9dbb96217'
  selection_flags:
    CommandLine|contains:
    - ' /n 1 '
    - ' -n 1 '
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `mpiexec.exe`, a legitimate command-line utility from High Performance Computing (HPC) Pack, with specific command-line flags that may indicate malicious activities. Attackers may use `mpiexec.exe` to execute arbitrary binaries under the guise of legitimate operations, aiming to maintain persistence or execute payloads remotely. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1203) and Defense Evasion (T1218).

  The primary telemetry source is Windows process creation logs, specifically monitoring CommandLine arguments and hashing the process image for integrity verification. If this activity is malicious, it could lead to unauthorized access, lateral movement within the environment, or execution of malware. It is important to note that the detection of this command execution does not confirm malicious activity on its own; further context and investigation are required.

  ### Investigation Steps

  - **Check Process Creation Events:**
    Look for Security Event ID 4688 that indicates the creation of `mpiexec.exe`. Analyze the CommandLine to pinpoint the usage of flags `/n 1` or `-n 1`.

  - **Validate Image Integrity:**
    Confirm that the process image matches the known hash `IMPHASH=d8b52ef6aaa3a81501bdfff9dbb96217`. A mismatch may indicate a malicious variant of `mpiexec.exe`.

  - **Identify Legitimate Usage Patterns:**
    Review the logs for typical usage of `mpiexec.exe` within authorized HPC tasks, which might not include the flagged command-line options and typically references legitimate input files or executables.

  - **Correlate with Network Activity:**
    Analyze network logs (e.g., using Windows Firewall logs or network monitoring solutions) for any outbound connections associated with the execution of `mpiexec.exe`. Legitimate traffic may include specific HPC job submissions rather than unexpected external connections.

  - **Review User Context:**
    Confirm the user context that triggered the alert. Scripts or automation tools running under a service account may have benign explanations, while unexpected user interactions with `mpiexec.exe` warrant deeper investigation.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical HPC systems which could be leveraged for lateral movement or execution of unauthorized code. The likelihood of malicious exploitation is significant as attackers frequently use legitimate binaries for evasion. Given the specific command-line flags being analyzed, this behavior is not common among legitimate processes.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into all process arguments, particularly if the command is truncated or if logging is misconfigured. Evasion techniques could include using different flags or legitimate user actions in HPC environments. Additionally, legitimate administrative tasks may incidentally trigger this alert, necessitating careful examination of context. A related detection could involve monitoring for unusual network activity or other lateral movement techniques which may complement this event for a more comprehensive threat assessment.

