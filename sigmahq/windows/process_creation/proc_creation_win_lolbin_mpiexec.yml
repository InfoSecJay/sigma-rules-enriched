title: MpiExec Lolbin
id: 729ce0ea-5d8f-4769-9762-e35de441586d
status: test
description: Detects a certain command line flag combination used by mpiexec.exe LOLBIN
  from HPC pack that can be used to execute any other binary
references:
- https://twitter.com/mrd0x/status/1465058133303246867
- https://learn.microsoft.com/en-us/powershell/high-performance-computing/mpiexec?view=hpc19-ps
author: Florian Roth (Nextron Systems)
date: 2022-01-11
modified: 2024-11-23
tags:
- attack.execution
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_binary:
  - Image|endswith: '\mpiexec.exe'
  - Hashes|contains: 'IMPHASH=d8b52ef6aaa3a81501bdfff9dbb96217'
  selection_flags:
    CommandLine|contains:
    - ' /n 1 '
    - ' -n 1 '
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of `mpiexec.exe`, a legitimate Windows command used in high-performance computing environments, with specific command line flags that are often associated with malicious behavior. The command combination detected in this rule can be leveraged by threat actors to execute arbitrary binaries, facilitating unauthorized actions within a compromised environment. This misuse of `mpiexec.exe` falls into the realm of living off the land binaries (LOLBins), which attackers often rely on to evade detection while carrying out their objectives.

  Threat scenarios involve attackers executing malicious payloads on target machines without invoking traditional malware signatures, thereby reducing the likelihood of detection by security tools. The primary attacker objectives might include lateral movement, execution of payloads, or persistence within the compromised environment. Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **Defense Evasion** (TA0005), particularly the technique of **Signed Binary Proxy Execution** (T1218).

  The primary data sources to support this detection are process creation logs, which capture command line arguments, binary execution details, and any related parent-child process relationships. These logs are crucial in identifying the use of `mpiexec.exe` in contexts that deviate from its expected operational use.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `mpiexec.exe` along with the specific command line flags `/n 1` or `-n 1`. Look for any unusual parent processes that may indicate suspicious behavior.

  - **Correlate with Sysinternals Tools:** If available, utilize Sysinternals tools like Process Explorer or Sysmon to examine ongoing processes and their command line arguments for any suspicious execution patterns associated with `mpiexec.exe`.

  - **Examine Installed Applications:** Check the installed programs for the High-Performance Computing (HPC) Pack to ensure that `mpiexec.exe` was legitimately deployed; unauthorized installations might suggest malicious intent.

  - **Perform Network Analysis:** Investigate any network connections initiated by `mpiexec.exe`. Look for anomalies in traffic patterns or connections to untrusted hosts that could indicate data exfiltration or command and control communication.

  ### Prioritization
  This alert is assigned a high severity due to the potential for significant impact if a threat actor successfully utilizes `mpiexec.exe` to execute unauthorized code, particularly in environments with high-value assets or sensitive data. The likelihood of this tactic being employed is heightened by its effectiveness in bypassing traditional security measures.

  ### Blind Spots and Assumptions
  While this detection rule captures a targeted behavior, there may be gaps in coverage for other command line patterns that could also signify malicious usage of `mpiexec.exe`. It assumes that detailed process creation logs are being collected and monitored; the absence of such logs limits the detection's effectiveness. Additionally, the logic does not account for possible legitimate uses of `mpiexec.exe` by authorized users or applications that might replicate the detected patterns, necessitating careful tuning to minimize false positives.

