title: MpiExec Lolbin
id: 729ce0ea-5d8f-4769-9762-e35de441586d
status: test
description: Detects a certain command line flag combination used by mpiexec.exe
  LOLBIN from HPC pack that can be used to execute any other binary
references:
- https://twitter.com/mrd0x/status/1465058133303246867
- https://learn.microsoft.com/en-us/powershell/high-performance-computing/mpiexec?view=hpc19-ps
author: Florian Roth (Nextron Systems)
date: 2022-01-11
modified: 2024-11-23
tags:
- attack.execution
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_binary:
  - Image|endswith: '\mpiexec.exe'
  - Hashes|contains: 'IMPHASH=d8b52ef6aaa3a81501bdfff9dbb96217'
  selection_flags:
    CommandLine|contains:
    - ' /n 1 '
    - ' -n 1 '
  condition: all of selection*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `mpiexec.exe` with specific command line flags that are commonly associated with malicious activity. The primary behavior of interest is the use of the `-n 1` or `/n 1` flag, which could indicate an attempt to run arbitrary binaries in a stealthy manner. This could be a tactic employed by adversaries to execute payloads while evading detection by blending into legitimate high-performance computing (HPC) environments.

  The relevant MITRE ATT&CK tactics and techniques include Execution (TA0002) and the use of LOLBins (Living Off the Land Binaries) (T1218). The primary telemetry sources include process creation logs, specifically focusing on Windows Security Event ID 4688, which captures command line arguments related to process executions. If this behavior is malicious, it could lead to unauthorized access or damage to critical systems, as adversaries could execute malware under the guise of legitimate HPC activity. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is necessary to determine the context of the command execution.

  ### Investigation Steps

  - **Review process creation logs:** Look for Windows Security Event ID 4688 entries corresponding to `mpiexec.exe`, filtering for entries where the command line includes `-n 1` or `/n 1`. Verify if the execution aligns with known system processes typical in your environment.

  - **Check for contextual behavior:** Investigate if `mpiexec.exe` is being run from standard installation directories (e.g., `C:\Program Files\Microsoft HPC Pack`) or from unexpected locations, which may indicate unauthorized use.

  - **Validate associated processes:** Examine sibling processes created by `mpiexec.exe` in logs, using a parent-child relationship in Event ID 4688 to identify any associated suspicious binaries that were invoked nearby. Look for signs of malware execution following the use of `mpiexec.exe`.

  - **Identify legitimate HPC usage:** Confirm if any approved workflows or tasks were executed using `mpiexec.exe` with `-n 1` or `/n 1`. This could include known job scheduling or compute tasks common in HPC environments.

  - **Assess file creation and modifications:** Review Windows Event ID 4663 (Access this Object) or similar logs for any file creations/modifications correlated with the time of execution. Pay attention to any unfamiliar file paths or extensions created.

  - **Analyze associated network activity:** Correlate any outbound connections from the system running `mpiexec.exe` with known malicious indicators (e.g., IP addresses or domains from threat intelligence feeds) to determine if exfiltration or command and control communications are occurring.

  ### Prioritization

  This alert is high priority due to its potential impact on critical HPC systems, where the execution of arbitrary binaries could result in severe data loss or service disruption. The likelihood of malicious abuse is significant; the tactics employed in this detection are commonly exploited in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of alternative command flags not captured by this rule or the presence of evasive techniques such as renaming legitimate binaries or executing malicious code via non-standard methods. Reliable detection requires comprehensive logging configurations, ensuring that all relevant processes and command-line arguments are captured. Legitimate research and development activities with HPC tools may trigger this alert; hence, context is critical. A companion detection focusing on sibling process activity or unusual network behavior could provide additional context to strengthen coverage.

