note: |
  ### Technical Context
  This detection rule identifies instances where Chromium-based browsers are launched in headless mode with remote debugging enabled, specifically when pointing to a user profile. Such behavior is often associated with data-stealing activities or remote control, indicating a potential compromise where an attacker seeks to manipulate or exfiltrate sensitive information from a user's web session. Attackers may leverage these functionalities to bypass typical security mechanisms and gain unauthorized access to data.

  The threat scenario revolves around attackers utilizing headless browsers for credential collection or session hijacking, exploiting the browser's capabilities to access cookies and saved information without triggering standard security alerts. The applicable MITRE ATT&CK tactics/techniques include **Defense Evasion (T1564.003)**, where attackers hide their activities, and **Credential Access (T1185)**, which encompasses techniques for obtaining sensitive information from compromised accounts.

  Primary data sources that will contain relevant evidence include **process creation logs**, which record when and how applications are executed, along with their command line arguments. Monitoring these logs is critical for detecting unauthorized browser configurations and potential abuse.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for any instances of Chromium browsers launched with command-line arguments containing `--remote-debugging-`, `--user-data-dir`, and `--headless`. Look for unusual activity or behaviors associated with these launches.
  - **Correlate User Activity**: Investigate user account activity around the time of the detected headless browser instances. Check for any alerts related to unauthorized data access or browser extensions that may be indicative of a compromised environment.
  - **Explore Browser User Profiles**: Inspect associated user profiles for suspicious browser behavior, such as abnormal access patterns to cookies or local storage. Focus on any stored credentials and their usage history.
  - **Assess Network Traffic**: Monitor outbound network traffic for anomalous connections initiated by the headless browser processes. Pay particular attention to requests to known exfiltration destinations or unauthorized communications.

  ### Prioritization
  This alert is tagged as high severity due to the potential impact of data exfiltration and credential compromise, which can lead to unauthorized access to sensitive systems and data within the enterprise. Given the relatively easy setup of such headless browsing attacks, the likelihood of occurrence is significant.

  ### Blind Spots and Assumptions
  There exists a possibility of detection gaps if the logging level is not configured to capture all necessary process creation events or if other Chromium-based activities are occurring legitimately. The detection logic assumes that any instance of browsers being started with the specified command-line options is suspicious. Effective detection depends on having comprehensive logging of process creations enabled across all endpoints using Chromium browsers.

