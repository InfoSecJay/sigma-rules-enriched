title: Renamed AutoIt Execution
id: f4264e47-f522-4c38-a420-04525d5b880f
status: test
description: |
  Detects the execution of a renamed AutoIt2.exe or AutoIt3.exe.
  AutoIt is a scripting language and automation tool for Windows systems. While primarily used for legitimate automation tasks, it can be misused in cyber attacks.
  Attackers can leverage AutoIt to create and distribute malware, including keyloggers, spyware, and botnets. A renamed AutoIt executable is particularly suspicious.
references:
- https://twitter.com/malmoeb/status/1665463817130725378?s=12&t=C0_T_re0wRP_NfKa27Xw9w
- https://www.autoitscript.com/site/
author: Florian Roth (Nextron Systems)
date: 2023-06-04
modified: 2024-11-23
tags:
- attack.stealth
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - ' /AutoIt3ExecuteScript'
    - ' /ErrorStdOut'
  selection_2:
    Hashes|contains:
    - 'IMPHASH=FDC554B3A8683918D731685855683DDF'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=CD30A61B60B3D60CECDB034C8C83C290'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=F8A00C72F2D667D2EDBB234D0C0AE000'          # AutoIt v3 - doesn't cover all binaries
  selection_3:
    OriginalFileName:
    - 'AutoIt3.exe'
    - 'AutoIt2.exe'
    - 'AutoIt.exe'
  filter_main_legit_name:
    Image|endswith:
    - '\AutoIt.exe'
    - '\AutoIt2.exe'
    - '\AutoIt3_x64.exe'
    - '\AutoIt3.exe'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of renamed AutoIt executables, specifically AutoIt2.exe and AutoIt3.exe. AutoIt is a scripting language frequently used for automation; however, attackers may exploit it to execute malicious scripts, including keyloggers and malware distributors. The likely attacker objective is to execute arbitrary code on a system using these scripts to evade detection. This detection correlates with the MITRE ATT&CK technique T1027 (Obfuscated Files or Information).

  Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, successful execution could allow an attacker to install or run malware while maintaining persistence on the target system. Importantly, this detection does NOT validate whether the executed script is indeed malicious—legitimate scripts could trigger the alert.

  ### Investigation Steps

  - **Inspect process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the process creation of any executables with names matching or similar to AutoIt2.exe or AutoIt3.exe. Determine if they are renamed variants based on the original naming convention.

  - **Analyze command line arguments:** Look for command line parameters containing '/AutoIt3ExecuteScript' or '/ErrorStdOut'. Legitimate usage typically won't include these parameters altered for malicious purposes.

  - **Validate hash values:** Check the hashes in the logs against known hashes for AutoIt executables (FDC554B3A8683918D731685855683DDF for AutoIt2.exe and F8A00C72F2D667D2EDBB234D0C0AE000 for AutoIt3.exe). A match may indicate a legitimate file, while discrepancies warrant further scrutiny.

  - **Examine for file renaming practices:** Identify if the image path ends with a legitimate version name (e.g., '\AutoIt3.exe'). If a different name is identified, it raises suspicion of possible malicious activity.

  - **Review system roles and activity:** Consider the role of the system in question. Workstations executing AutoIt scripts might warrant closer examination than servers or infrastructure devices, which typically do not run such scripts.

  - **Identify previous alerts of similar nature:** Cross-reference with historical alerts for AutoIt executions. Frequent alerts from the same endpoint with varying executable naming patterns could indicate ongoing malicious activity.

  ### Prioritization

  This alert should be regarded as high priority due to the potential for significant impact. Renamed AutoIt executables are suspicious and may indicate attempts to execute malicious scripts. The likelihood of abuse is notable, as renaming an executable is a common technique employed by adversaries during malicious operations.

  ### Blind Spots and Assumptions

  This detection has limitations; attackers may obfuscate their scripts further, making detection challenging. Reliable detection relies on the accurate logging of process creation events from all endpoints, ensuring no legitimate automation tasks are excluded. Legitimate administrative tasks may occasionally trigger this alert. Related detections such as script execution or process injection events could enhance visibility into potential adversarial actions.

