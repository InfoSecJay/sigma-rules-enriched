title: Renamed AutoIt Execution
id: f4264e47-f522-4c38-a420-04525d5b880f
status: test
description: |
  Detects the execution of a renamed AutoIt2.exe or AutoIt3.exe.
  AutoIt is a scripting language and automation tool for Windows systems. While primarily used for legitimate automation tasks, it can be misused in cyber attacks.
  Attackers can leverage AutoIt to create and distribute malware, including keyloggers, spyware, and botnets. A renamed AutoIt executable is particularly suspicious.
references:
- https://twitter.com/malmoeb/status/1665463817130725378?s=12&t=C0_T_re0wRP_NfKa27Xw9w
- https://www.autoitscript.com/site/
author: Florian Roth (Nextron Systems)
date: 2023-06-04
modified: 2024-11-23
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - ' /AutoIt3ExecuteScript'
    - ' /ErrorStdOut'
  selection_2:
    Hashes|contains:
    - 'IMPHASH=FDC554B3A8683918D731685855683DDF'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=CD30A61B60B3D60CECDB034C8C83C290'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=F8A00C72F2D667D2EDBB234D0C0AE000'          # AutoIt v3 - doesn't cover all binaries
  selection_3:
    OriginalFileName:
    - 'AutoIt3.exe'
    - 'AutoIt2.exe'
    - 'AutoIt.exe'
  filter_main_legit_name:
    Image|endswith:
    - '\AutoIt.exe'
    - '\AutoIt2.exe'
    - '\AutoIt3_x64.exe'
    - '\AutoIt3.exe'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity through the execution of renamed AutoIt executables, specifically `AutoIt2.exe` and `AutoIt3.exe`. AutoIt is a legitimate scripting language used primarily for automation on Windows systems. However, attackers can misuse this tool by renaming its executables to disguise them, leveraging it to create malware such as keyloggers, spyware, or botnets. The detection focuses on the suspicious execution patterns that suggest evasion tactics commonly employed by threat actors.

  The likely attacker objectives include automating tasks to facilitate unauthorized access, exfiltrating sensitive information, or deploying persistent malicious payloads while evading traditional security measures. The relevant MITRE ATT&CK tactics include **Defense Evasion (T1027)**, where threat actors attempt to obfuscate their tools or processes to avoid detection, and **Execution (T1203)**, which relates to executing scripts or malicious code on compromised systems. Primary data sources for this detection include process creation events from endpoint logging systems.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for process creation relating to AutoIt executables, specifically searches for command line arguments containing `/AutoIt3ExecuteScript` or `/ErrorStdOut`.
  - **Analyze Hashes**: Check for specific IMPHASH values associated with AutoIt executables to determine if any renamed instances have been executed, which could confirm malicious activity.
  - **Investigate Original File Names**: Look for execution instances where the original file names `AutoIt's` have changed; logs should be scrutinized for instances where such files were executed unexpectedly.
  - **Assess Surrounding Context**: Evaluate the process tree for other suspicious processes that may have launched alongside the renamed AutoIt executables, checking for unusual parent-child relationships or other signs of anomalous behavior.

  ### Prioritization
  This alert is prioritized as high severity because the execution of renamed AutoIt executables typically indicates attempts to bypass security measures for malicious purposes, which can significantly impact the integrity of enterprise systems.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where logging of process creation events is not enabled or when the AutoIt executables are executed in non-standard ways that do not match the specified detection criteria. The logic assumes that renamed executables will still utilize identifiable characteristics, such as command line arguments or specific file hashes; without effective logging and monitoring on all endpoints, true impacts may go unnoticed.

