title: Renamed AutoIt Execution
id: f4264e47-f522-4c38-a420-04525d5b880f
status: test
description: |
  Detects the execution of a renamed AutoIt2.exe or AutoIt3.exe.
  AutoIt is a scripting language and automation tool for Windows systems. While primarily used for legitimate automation tasks, it can be misused in cyber attacks.
  Attackers can leverage AutoIt to create and distribute malware, including keyloggers, spyware, and botnets. A renamed AutoIt executable is particularly suspicious.
references:
- https://twitter.com/malmoeb/status/1665463817130725378?s=12&t=C0_T_re0wRP_NfKa27Xw9w
- https://www.autoitscript.com/site/
author: Florian Roth (Nextron Systems)
date: 2023-06-04
modified: 2024-11-23
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - ' /AutoIt3ExecuteScript'
    - ' /ErrorStdOut'
  selection_2:
    Hashes|contains:
    - 'IMPHASH=FDC554B3A8683918D731685855683DDF'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=CD30A61B60B3D60CECDB034C8C83C290'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=F8A00C72F2D667D2EDBB234D0C0AE000'          # AutoIt v3 - doesn't cover all binaries
  selection_3:
    OriginalFileName:
    - 'AutoIt3.exe'
    - 'AutoIt2.exe'
    - 'AutoIt.exe'
  filter_main_legit_name:
    Image|endswith:
    - '\AutoIt.exe'
    - '\AutoIt2.exe'
    - '\AutoIt3_x64.exe'
    - '\AutoIt3.exe'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of renamed AutoIt executables, specifically AutoIt2.exe and AutoIt3.exe, which are often utilized in malicious contexts despite their legitimate use for automation. The attacker objective is typically to execute scripts that could include the delivery and operation of malware, such as keyloggers and other forms of payloads, while evading detection by altering the executable names. Relevant MITRE ATT&CK tactics include Defense Evasion (T1027), which highlights techniques used by adversaries to avoid detection. Primary telemetry sources are Windows process creation logs, specifically looking for Event ID 4688, which captures process-related activities and command-line arguments. The security impact of malicious behavior can lead to unauthorized data access, malware installation, and further exploitation of the environment. However, this detection alone does not confirm malicious intent without additional context or corroborating evidence.

  ### Investigation Steps

  - **Check command-line arguments:** Review the associated Event ID 4688 logs for command-line arguments containing ` /AutoIt3ExecuteScript` or ` /ErrorStdOut`. Malicious usage may not adhere to legitimate command patterns.

  - **Identify renamed executables:** Examine the file path and name of the executable. Look for executions of files named differently than `AutoIt.exe`, `AutoIt2.exe`, or `AutoIt3.exe`, indicating a potential attempt at evasion or malicious use.

  - **Evaluate process parentage:** Investigate the parent process of the suspect AutoIt execution via the `ParentImage` field in the Event ID 4688 logs. Legitimate invocations typically originate from known automation tools or scripts, while suspicious ones may come from unexpected or unusual sources.

  - **Cross-reference hash values:** Check the `Hashes` field for matching IMPHASH values that correspond to AutoIt (v2 or v3) executables. A match may highlight potential malicious use, particularly if the execution context is suspicious.

  - **Look for anomalies in user context:** Determine the executing user account against established norms. Legitimate tasks are often executed by privileged or service accounts that are known in the environment; deviations could signal malicious activity.

  - **Validate asset criticality:** Assess the asset's role in your organization (e.g., user workstation vs. critical server). Unusual AutoIt usage on high-value or sensitive systems should be escalated for immediate review.

  ### Prioritization

  This alert is high-severity due to the potential impact on sensitive systems if malicious. The likelihood of abuse is elevated, considering AutoIt’s known use in both benign automation and cyber threat activity, particularly for scripting attacks. Additionally, renamed executables are a common tactic used to obfuscate malware.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as further renaming of executables or using legitimate AutoIt scripts in expected manners. It’s crucial to have comprehensive process creation logging enabled and to correlate with other security events to establish full context. Legitimate automation tasks by users or systems can trigger this alert when misconfigured or renamed scripts are executed. Companion detections, such as network activity tied to unusual DNS queries or proxy logs, can provide corroborative evidence that strengthens overall threat assessments.

