title: Renamed AutoIt Execution
id: f4264e47-f522-4c38-a420-04525d5b880f
status: test
description: |
  Detects the execution of a renamed AutoIt2.exe or AutoIt3.exe.
  AutoIt is a scripting language and automation tool for Windows systems. While primarily used for legitimate automation tasks, it can be misused in cyber attacks.
  Attackers can leverage AutoIt to create and distribute malware, including keyloggers, spyware, and botnets. A renamed AutoIt executable is particularly suspicious.
references:
- https://twitter.com/malmoeb/status/1665463817130725378?s=12&t=C0_T_re0wRP_NfKa27Xw9w
- https://www.autoitscript.com/site/
author: Florian Roth (Nextron Systems)
date: 2023-06-04
modified: 2024-11-23
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - ' /AutoIt3ExecuteScript'
    - ' /ErrorStdOut'
  selection_2:
    Hashes|contains:
    - 'IMPHASH=FDC554B3A8683918D731685855683DDF'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=CD30A61B60B3D60CECDB034C8C83C290'          # AutoIt v2 - doesn't cover all binaries
    - 'IMPHASH=F8A00C72F2D667D2EDBB234D0C0AE000'          # AutoIt v3 - doesn't cover all binaries
  selection_3:
    OriginalFileName:
    - 'AutoIt3.exe'
    - 'AutoIt2.exe'
    - 'AutoIt.exe'
  filter_main_legit_name:
    Image|endswith:
    - '\AutoIt.exe'
    - '\AutoIt2.exe'
    - '\AutoIt3_x64.exe'
    - '\AutoIt3.exe'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of renamed instances of AutoIt executables (AutoIt2.exe or AutoIt3.exe), which are commonly associated with scripting and automation on Windows systems. The likely attacker objective is to execute malicious scripts that could allow for various unauthorized actions, including keylogging, remote access, or other malicious payloads. This activity is aligned with MITRE ATT&CK tactics such as Defense Evasion (T1027).

  The primary telemetry sources for this detection are Windows process creation logs, specifically looking for event details where command lines and original file names are associated with AutoIt executables. If malicious, this could result in significant security breaches, such as system compromise or data exfiltration. Importantly, this detection does NOT confirm that an incident is occurring on its own; further investigation is needed to confirm malicious intent.

  ---

  ### Investigation Steps

  - **Check the Command Line Arguments:** Review the command line associated with the process creation; look for elements like ' /AutoIt3ExecuteScript' or ' /ErrorStdOut' in Event ID 4688. Legitimate usage would typically not include these arguments.

  - **Analyze Original File Names:** Investigate the OriginalFileName field in Event ID 4688 for entries matching 'AutoIt2.exe' or 'AutoIt3.exe'. Confirm that these do not match benign installations of the AutoIt environment typically located under legitimate directories.

  - **Validate Process Hashes for Known Malicious Variants:** Cross-reference the process hashes in the detection against known bad hashes for AutoIt executables (e.g., IMHash values) present in the logs for malicious indicators. Any process matching these hashes should be treated as high confidence malicious.

  - **Inspect System Activity Following Execution:** Review subsequent activities in Sysmon (Event ID 10 for process create) or other logs to see if there's anomalous behavior potentially indicative of malware following the AutoIt execution, such as network connections or file modifications.

  - **Assess Historical Context and Legitimate Usage Patterns:** Understand the typical usage of AutoIt scripts within your environment by checking previous executions. Legitimate scripts are usually well-documented; anomalies may indicate misuse.

  - **Check for File Creation or Exfiltration:** Search for any newly created files or external connections by correlating event logs that include process creations (Event ID 4688) followed by network connection events (Event ID 5156). Legitimate files will typically reside within authorized directories without unexpected outbound connections.

  ---

  ### Prioritization

  The alert's severity is high due to the potential impact on critical systems where AutoIt may be used inappropriately for automated tasks. The likelihood of malicious abuse is significant, as renamed executables are often an evasion tactic employed by adversaries. This technique has been weaponized in various attacks, warranting immediate attention.

  ---

  ### Blind Spots and Assumptions

  Possible evasion techniques include obscuring the executable name further or using legitimate AutoIt scripts as a cover for malicious operations. Effective detection requires proper configuration of Windows process creation logs to ensure comprehensive coverage. Legitimate automation tasks may trigger this alert, especially in environments where AutoIt is commonly used. A related detection for PowerShell script executions (such as T1059.001) may complement this alert, enhancing visibility into potential abuse scenarios.

