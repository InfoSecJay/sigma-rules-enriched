title: Renamed Microsoft Teams Execution
id: 88f46b67-14d4-4f45-ac2c-d66984f22191
status: test
description: Detects the execution of a renamed Microsoft Teams binary.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-07-12
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName:
    - 'msteams.exe'
    - 'teams.exe'
  filter_main_legit_names:
    Image|endswith:
    - '\msteams.exe'
    - '\teams.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of a renamed Microsoft Teams binary, specifically targeting instances where the original executable name (`msteams.exe` or `teams.exe`) has been altered. Attackers may attempt to execute a malicious payload disguised as a legitimate Microsoft Teams process, leveraging the application's trusted status to evade detection. This behavior typically aligns with MITRE ATT&CK technique T1584 (Community/Private Tool), under the Execution tactic.

  The primary telemetry source for this detection comes from Windows process creation events, particularly Security Event ID 4688 and Sysmon Event ID 1, which log detailed information about process execution. If executed maliciously, this activity could indicate an attempt to establish a foothold in the environment or facilitate lateral movement. Importantly, this detection does NOT confirm malicious intent solely on its own, as legitimate users might also rename executables inadvertently or for legitimate purposes.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for process creation events with the following attributes: `OriginalFileName` set to `msteams.exe` or `teams.exe`, but with an altered `Image` path. Look for variations such as `\fake_teams.exe` or `\modified_teams.exe` which suggest potential malfeasance.

  - **Identify parent process relationships:** Investigate the parent process of the detected instance by examining the `ParentProcessId` field in Event ID 4688. A legitimate parent process would typically be `explorer.exe` or an authorized application. Watch for suspicious parent processes such as `cmd.exe`, `powershell.exe`, or any process associated with known malware.

  - **Review system context:** Analyze the host role of the system triggering the alert. If it's an end-user machine but is accessing sensitive data or enterprise resources, escalate the findings for further scrutiny. Legitimate use of Microsoft Teams should align with typical operational patterns, such as user login and regular application usage.

  - **Correlate with external threat intelligence:** Cross-reference the execution attempt with threat intelligence repositories to identify if the renamed executable has been reported as part of a known malware campaign or behavior pattern. This could strengthen the confidence level in the finding as malicious.

  - **Examine for file creation or modification activities:** Validate whether any unexpected files were created or modified in conjunction with the process execution. Check for unusual file signatures or timestamps in directories where executable files are stored, potentially indicating malware installation efforts.

  ### Prioritization

  The medium severity level indicates a noteworthy risk as it involves an application utilized in corporate environments, which could be weaponized by attackers for command and control (C2). The likelihood of malicious abuse is heightened by the common practice of renaming executables to slip past detection mechanisms.

  ### Blind Spots and Assumptions

  This detection may miss rename evasion techniques from sophisticated adversaries who employ alternate methods to disguise malicious processes. Furthermore, reliable detection is contingent on having Sysmon configured correctly to capture the necessary events. Legitimate scenarios could include IT operations or user actions that involve performing updates or troubleshooting Microsoft Teams. Companion detections such as monitoring unusual scripts or PowerShell commands might provide a broader context to further assess the threat landscape related to this indicator.

