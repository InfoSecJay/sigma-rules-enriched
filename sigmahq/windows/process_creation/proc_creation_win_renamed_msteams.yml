title: Renamed Microsoft Teams Execution
id: 88f46b67-14d4-4f45-ac2c-d66984f22191
status: test
description: Detects the execution of a renamed Microsoft Teams binary.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-07-12
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName:
    - 'msteams.exe'
    - 'teams.exe'
  filter_main_legit_names:
    Image|endswith:
    - '\msteams.exe'
    - '\teams.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of a renamed Microsoft Teams executable. The primary objective of such a detection is to uncover potential evasion tactics employed by threat actors who may rename legitimate applications to disguise malicious activity. The use of renamed binaries is a common tactic in phishing or malware delivery campaigns, where attackers aim to blend in with authentic software to avoid detection by security measures.

  The relevant MITRE ATT&CK tactics associated with this detection are **Defense Evasion** (T1203), where attackers seek to obfuscate their activity, and potentially **Execution** (T1203), as they execute malicious payloads. By monitoring for changes to the original file names of legitimate applications, security teams can better identify unauthorized usage or malicious attempts to leverage trusted software.

  Primary data sources for this detection logic include **process creation events** on Windows systems. These events log information about executed binaries, including their paths and original file names, providing insight into any potentially suspicious renaming activities surrounding widely used applications like Microsoft Teams.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation logs for any instances where the binaries 'msteams.exe' or 'teams.exe' are executed from unusual or unexpected paths.
  - **Correlate with User Activity:** Look for any associated user behavior or context surrounding the execution, such as recent phishing attempts, unusual account activity, or unexpected login locations.
  - **Verify File Integrity:** Check the hashes of the observed executables against known good signatures to determine if the binary has been altered or is part of a known malicious campaign.
  - **Monitor for Additional Indicators:** Assess the system for other artifacts such as loaded modules, network connections, and parent processes that may indicate a larger compromise or malicious usage of the Office suite.

  ### Prioritization
  The alert is assigned a medium severity due to the potential impact of attackers using a trusted application like Microsoft Teams for malicious purposes. While the name alteration itself may not immediately indicate a breach, it suggests a higher likelihood of malicious behavior that warrants further investigation, especially if tied to abnormal user actions.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of malicious activity, particularly if attackers employ other methods of obfuscation or run their payloads without renaming legitimate binaries. The detection logic assumes that any execution of the software outside its normal naming conventions is suspect. Required configurations include robust process creation logging on Windows systems, as any gaps in logging may result in missed detections. Additionally, false positives could arise from legitimate users renaming the application for personal usage.

