title: Notepad Password Files Discovery
id: 3b4e950b-a3ea-44d3-877e-432071990709
status: experimental
description: Detects the execution of Notepad to open a file that has the string
  "password" which may indicate unauthorized access to credentials or suspicious
  activity.
references:
- https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
- https://intel.thedfirreport.com/eventReports/view/57      # Private Report
author: 'The DFIR Report'
tags:
- attack.discovery
- attack.t1083
date: 2025-02-21
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\explorer.exe'
    Image|endswith: '\notepad.exe'
    CommandLine|endswith:
        # Note: Commandline to contain a file with the string password and a specific extension
    - 'password*.txt'
    - 'password*.csv'
    - 'password*.doc'
    - 'password*.xls'
  condition: selection
falsepositives:
- Legitimate use of opening files from remote hosts by administrators or users. 
  However, storing passwords in text readable format could potentially be a 
  violation of the organization's policy. Any match should be investigated 
  further.
level: low
note: |
  ### Technical Context

  This rule detects the execution of Notepad to open files containing the string "password" in their names, such as "password.txt" or "password.csv". This behavior might indicate unauthorized attempts to access or disclose sensitive credential information, potentially reflecting an attacker’s objective to exploit or exfiltrate passwords stored in these files.

  The relevant MITRE ATT&CK tactic is Discovery (ID: TA0007), specifically technique T1083 which involves the reconnaissance of stored credentials. The primary telemetry sources are Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1. If the activity is confirmed malicious, it could indicate a significant security risk leading to credential theft or privilege escalation.

  This detection does NOT independently confirm that an account has been compromised or that malicious activity is occurring; it merely indicates a potential area of concern that requires further investigation.

  ### Investigation Steps

  - **Review process creation logs**: Search for Security Event ID 4688 or Sysmon Event ID 1 to identify the process creation of Notepad. Check the CommandLine field for file names containing "password" (e.g., 'password*.txt', 'password*.csv').

  - **Validate file source**: Confirm the path of the file being accessed to identify its storage location. Legitimate access from administrative users may involve networked drives or specific folders like 'C:\Credentials'. Investigate if the file resides in unexpected or suspicious locations.

  - **Examine user activity and context**: Investigate the user account that initiated the process. Review recent activity associated with this user to determine if there are any suspicious login patterns or abnormal behavior in terms of file access.

  - **Cross-reference with application logs**: Check for related events within the application or endpoint security logs that may indicate previous access to sensitive files or repeated attempts to open similar files.

  - **Identify benign indicators**: Note any legitimate user actions that may explain Notepad usage, such as administrative tasks involving document review. Assess whether the usage aligns with the user's job responsibilities.

  - **Check for concurrent suspicious activity**: Look for other alerts triggered by the same user or system around the same timeframe, especially concerning unauthorized access attempts or privilege escalation flags.

  ### Prioritization

  This alert has a low severity level in an enterprise context; while the affected system's security may not be significantly compromised immediately, the potential for malicious intent in accessing sensitive credential files warrants proactive investigation. Although the behavior could reflect common user practices, it is essential to remain vigilant due to its relevance to credential theft.

  ### Blind Spots and Assumptions

  The detection may be limited by users legitimately stored passwords in text-readable formats or administrative roles performing acceptable activities that trigger the alert. It relies heavily on the accuracy of process creation logs and assumes that the appropriate logging level is enabled on the endpoints. Additionally, related detections, such as alerts for other tools indicating the exfiltration or misuse of sensitive data, should be in place to strengthen coverage.

