title: Notepad Password Files Discovery
id: 3b4e950b-a3ea-44d3-877e-432071990709
status: experimental
description: Detects the execution of Notepad to open a file that has the string "password"
  which may indicate unauthorized access to credentials or suspicious activity.
references:
- https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
- https://intel.thedfirreport.com/eventReports/view/57      # Private Report
author: 'The DFIR Report'
tags:
- attack.discovery
- attack.t1083
date: 2025-02-21
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\explorer.exe'
    Image|endswith: '\notepad.exe'
    CommandLine|endswith:
        # Note: Commandline to contain a file with the string password and a specific extension
    - 'password*.txt'
    - 'password*.csv'
    - 'password*.doc'
    - 'password*.xls'
  condition: selection
falsepositives:
- Legitimate use of opening files from remote hosts by administrators or users. However,
  storing passwords in text readable format could potentially be a violation of the
  organization's policy. Any match should be investigated further.
level: low
note: |
  ### Technical Context
  This detection rule identifies instances where Notepad is invoked to open files that contain the string "password" in their names, such as `password.txt`, `password.csv`, `password.doc`, or `password.xls`. This behavior can indicate unauthorized access to sensitive information or other malicious activities, as attackers may search for stored credentials on compromised systems. The execution of Notepad in this context often suggests that an individual is attempting to retrieve sensitive information that could be leveraged for further exploitation within the network.

  The affected MITRE ATT&CK tactics include **Discovery** (TA0007), and specifically the technique **File and Directory Discovery** (T1083). Attackers may utilize this method to locate credential files or sensitive documents, which could further aid in privilege escalation or lateral movement within a compromised environment. The principal data source for this detection is process creation logs that track the execution of applications on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify events where Notepad is launched alongside files containing the string "password." Look for any unusual user accounts associated with these executions.

  - **Correlate User Activity**: Investigate the user’s activity prior to the detection. Check if the user was accessing any shared drives or performing other actions that could indicate legitimate behavior versus compromise.

  - **Check for Credential Storage Practices**: Verify if any organizational policies regarding password storage practices are being violated. Determine if the files opened contain sensitive information and whether their storage adheres to security standards.

  - **Examine the Context of Access**: Identify if the Notepad instances were opened from unexpected locations (e.g., remote connections) by scrutinizing the parent process as well as the source IP and hostname of the machine making the request.

  ### Prioritization
  Despite a low severity level, this alert should not be dismissed, as discovering password-related files being accessed can indicate potential security policy violations or undetected malicious activity, warranting further investigation to assess the associated risks.

  ### Blind Spots and Assumptions
  This rule may miss cases where malicious actors employ non-standard applications or rename their tools to evade detection, as it specifically monitors Notepad's activity. The logic assumes that any file containing "password" in its name is suspicious, which could lead to false positives if such naming conventions are employed legitimately within the organization. To ensure effectiveness, proper configurations for capturing process creation events are necessary; otherwise, key activities may go unnoticed.

