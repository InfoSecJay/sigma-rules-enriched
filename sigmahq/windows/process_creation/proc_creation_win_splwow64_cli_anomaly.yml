  ### Technical Context

  This Sigma rule detects instances of the Windows process `splwow64.exe` being executed without any command line parameters. The presence of this process with no parameters is unusual because `splwow64.exe` typically facilitates printing for 32-bit applications on 64-bit Windows systems, and legitimate executions generally include specific arguments for functionality. The attacker's objective might involve evoking the splwow64.exe process for malicious purposes, such as fileless execution of payloads or evading detection mechanisms.

  Relevant MITRE ATT&CK techniques include **Defense Evasion (T1202)**, as the absence of parameters could show attempts to obfuscate malicious activities. Primary telemetry sources for this rule include Windows Security Event ID **4688** (Process Creation) and Sysmon Event ID **1** (Process Creation). If determined to be malicious, the impact could be severe, leading to system compromise or data exfiltration. This detection does NOT confirm malware presence on its own; further investigation will be necessary to ascertain the intent and context of the process execution.

  ### Investigation Steps

  - **Check for command line parameters:** Review Event ID 4688 for the command line used with `splwow64.exe`. Legitimate instances typically include parameters related to specific 32-bit applications or printers. The absence of parameters is notably suspicious.

  - **Verify the file path:** Ensure the process is running from its canonical path: `C:\Windows\System32\splwow64.exe`. Any deviation could indicate a potential malicious binary masquerading as a legitimate process.

  - **Review parent processes:** Look at the parent process ID (PID) in the Event ID 4688 logs. An unexpected or malicious parent process (e.g., `cmd.exe`, `powershell.exe`) indicates a higher risk of malicious activity.

  - **Cross-check with Sysmon logs:** Analyze Sysmon Event ID 1 for extensive process creation data. Cross-referencing process creation timelines can help detect suspicious chains of activity or concurrent entries which suggest exploitation attempts.

  - **Assess asset criticality:** If the system executing `splwow64.exe` is a critical server (e.g., a print server or file server), prioritize further investigation, potentially including network traffic inspection to identify C2 communications.

  ### Prioritization

  The severity of this alert is high due to the sensitive nature of a process that, under usual circumstances, runs with specific parameters. The likelihood of malicious abuse is significant given the common use of process evasion techniques in the wild. This behavior is less frequently weaponized, but all occurrences should be thoroughly vetted to rule out compromise.

  ### Blind Spots and Assumptions

  Possible evasion techniques include renaming the process to avoid detection or executing it in a manner that does not trigger logging. Reliable detection hinges on the configuration of Sysmon and Security Event Logs; without these logs enabled, detection may be hit or miss. Legitimate activities may include software installations or printing tasks where `splwow64.exe` is invoked correctly with relevant parameters. Additional detections for other unauthorized process behavior would be beneficial for holistic threat detection.

