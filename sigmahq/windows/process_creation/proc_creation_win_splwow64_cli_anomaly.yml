  ### Technical Context

  This rule detects the spawning of the Splwow64.exe process without any command line parameters, which indicates a potential suspicious behavior commonly associated with privilege escalation or stealth tactics. Attackers may use Splwow64.exe to manipulate processes or conduct tasks that require interaction with 32-bit applications on a 64-bit Windows system. This behavior aligns with the MITRE ATT&CK tactic **Defense Evasion (T1202)**, utilizing the technique of escaping detection by using legitimate system binaries.

  The primary telemetry sources needed for this detection include Windows Security Event ID 4688 for process creation and Sysmon Event ID 1, which logs detailed process execution. If this process is invoked without parameters, it could indicate malicious intent, such as evading detection mechanisms. However, this detection does not confirm that activity is indeed malicious on its own, since routine system operations may lead to similar behavior.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Event ID 4688 and Sysmon Event ID 1 to confirm the creation of Splwow64.exe, focusing on the CommandLine field. Look specifically for entries where CommandLine is null or empty. Legitimate instances may include empty execution but often align with expected task automation within known applications.

  - **Analyze parent process relationships**: Capture the parent process ID from the Event ID logs. Determine if Splwow64.exe is spawned by a known or legitimate application (e.g., a recognized software installation process). Legitimate occurrences would typically follow established software workflows, while deviation may indicate risky behavior.

  - **Correlation with other logs**: Cross-reference this alert with application logs or other configuration management events. The absence or presence of relevant activities around the same timeframe can reveal benign or malicious intent. A lack of recent installations or application updates could cue in on malicious activity.

  - **Check for common indicators of compromise (IoCs)**: Review the CommandLine parameter history for prior executions of Splwow64.exe. Consistent spawning without parameters across various events may suggest malicious scripting, especially if correlated with unusual application behaviors.

  - **Evaluate host criticality**: Identify the asset on which Splwow64.exe executed. Running this process on critical infrastructure, such as domain controllers or key business servers, increases the risk and highlights a need for urgent investigation.

  ### Prioritization

  This alert warrants a high severity rating due to the significant risk it poses, especially if occurring on critical systems. The likelihood of malicious exploitation is elevated, given the common use of Splwow64.exe in contextually stealthy operations by adversaries. Such behavior is increasingly weaponized to circumvent detection.

  ### Blind Spots and Assumptions

  Detection limitations include potential legitimate use cases within standard application operations, especially during software updates or installations that can spawn Splwow64.exe. Ensuring that appropriate logging configurations are enabled, such as Sysmon and Windows Event Forwarding, is crucial to capture necessary telemetry reliably. Companion detections, such as monitoring for abnormal process chains involving the Windows registry or PowerShell scripts, can strengthen overall detection coverage against sophisticated evasion tactics.

