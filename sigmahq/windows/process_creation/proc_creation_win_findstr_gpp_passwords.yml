note: |
  ### Technical Context

  This Sigma rule detects the execution of the `findstr.exe` or `find.exe` processes when their command line includes the terms 'cpassword', a reference to extracting cached credentials stored in Group Policy Preferences files. The primary attacker objective is to retrieve sensitive credentials for lateral movement or privilege escalation within a Windows domain environment. This behavior aligns with the MITRE ATT&CK technique T1552.006: "Credential Access: GPP Passwords."

  The primary telemetry sources are Windows process creation logs, specifically looking for Security Event ID 4688 which provides details about process creation, including command line arguments. If this activity is malicious, attackers could use the decrypted credentials to gain unauthorized access to systems. However, this detection does NOT confirm that a successful credential extraction has occurred, nor does it indicate whether the access gained was malicious or legitimate.

  ### Investigation Steps

  - **Review process creation log details**: Examine Security Event ID 4688 for instances of `findstr.exe` or `find.exe` being executed with command-line arguments containing 'cpassword', '\sysvol\', and '.xml'. This indicates potential misuse related to GPP passwords.

  - **Identify system roles**: Confirm if the process was initiated on a Domain Controller system, as this role is critical for managing Group Policy and is more likely to be targeted by adversaries. Look for Event ID 4688 logs from Domain Controllers.

  - **Check user context**: Validate the user account that executed the command. Legitimate administrative accounts may run similar commands during maintenance, whereas anomalous accounts executing this command should be flagged for review.

  - **Analyze command line arguments for anomalies**: If the command line variations (e.g., different paths or additional arguments) deviate from typical administrative tasks, flag this for further investigation. Legitimate uses of `findstr` typically do not access Group Policy Preference files in this manner.

  - **Cross-reference additional log sources**: Investigate Directory Service logs for changes or queries related to Group Policy Objects (GPOs) around the time of the process execution to understand the broader context of potential credential exposure.

  - **Look for successful extraction indicators**: Check for any log entries or artifacts associated with known credential extraction tools or scripts typically used after this detection, such as files created by `gpp-decrypt`, to identify if the attacker successfully retrieved credentials.

  ### Prioritization

  This alert should be prioritized as high severity. A successful retrieval of credentials from Group Policy Preferences can lead to significant security risks, including unauthorized access and lateral movement across the network. The likelihood of malicious abuse is significant, as this technique is commonly weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not configured to capture process command lines or if logging levels are insufficient on monitored endpoints. Additionally, legitimate activities by system administrators may inadvertently trigger this alert, such as troubleshooting GPO configurations. A related detection to consider is monitoring for unusual access patterns to SYSVOL, which may indicate suspicious file access or manipulation of Group Policy objects.

