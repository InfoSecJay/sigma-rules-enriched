note: |
  ### Technical Context
  This rule detects the use of the `findstr` utility to search for encrypted Group Policy Preference (GPP) passwords within XML files located on a Domain Controller. Attackers may exploit GPP to retrieve credentials stored in group policies, which can be decrypted with tools like `gpp-decrypt`. This behavior often indicates an attempt at credential access, allowing attackers to elevate privileges or gain unauthorized access to resources within a Windows domain environment.

  Relevant MITRE ATT&CK techniques for this detection include:
  - **T1552.006**: **GPP Passwords** - This technique describes the exploitation of GPP to extract sensitive information such as credentials.

  Primary data sources that can provide relevant evidence include process creation events, where specific command line arguments and executed utilities are logged. Monitoring these logs can reveal attempts to access sensitive configurations or perform reconnaissance on credential stores.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate event logs for `find.exe` or `findstr.exe` executions, paying particular attention to the command line parameters used. Look for indications that the commands were run against `\sysvol\` directories containing `.xml` files.

  - **Collect Domain Controller Event Logs**: Gather and examine logs from the Domain Controller, focusing on changes or access to Group Policy Objects (GPOs) that may indicate unauthorized attempts to extract credential information.

  - **Analyze Network Traffic**: If possible, monitor for unusual outbound connections following the execution of the detection commands. This can help identify if the extracted credentials are being used for lateral movement or data exfiltration.

  - **Inspect Related User Activity**: Review user activity and account permissions to determine if there are any anomalies around the time of the detected command execution, such as privilege escalation or access to sensitive systems.

  ### Prioritization
  The alert is deemed high severity due to the critical risks associated with credential theft, which can lead to unauthorized access to sensitive systems and data. If successful, it can significantly impact the enterprise environment by allowing attackers to execute further malicious activities.

  ### Blind Spots and Assumptions
  This detection may have blind spots, particularly if logs related to process creation or command usage are not being captured effectively. The detection logic assumes that tools like `findstr` will be used in a predictable manner to target specific GPO configurations. For the alert to function correctly, detailed logging of process creation events must be enabled on Windows endpoints, including capturing full command lines, and the logs should be centralized for analysis.

