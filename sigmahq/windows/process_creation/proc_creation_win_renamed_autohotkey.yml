note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed `AutoHotkey.exe` binary based on inconsistencies in the PE metadata, particularly the `OriginalFileName` field. The behavior suggests that an attacker may be using AutoHotkey, a scripting language often leveraged for automation tasks, to execute malicious activities under the disguise of a legitimate application. This aligns with the MITRE ATT&CK technique T1070.001 - "Indicator Removal on Host: File and Directory Permissions Modification".

  The primary telemetry sources are Windows process creation logs, particularly Events ID 4688 (Security log) and Sysmon Event ID 1. If malicious, executing a renamed or modified AutoHotkey script could facilitate unauthorized automation tasks, data exfiltration, or lateral movement within the network. This detection does NOT confirm malicious intent on its own, as legitimate users may also utilize AutoHotkey for automation.

  ### Investigation Steps

  - **Check process creation logs:**
    Review Security Event ID 4688 for logs on process creation. Look for entries with `Image` fields containing variations of `AutoHotkey`, and note the user context in which it was launched to assess legitimacy.

  - **Examine Sysmon events for modifications:**
    Analyze Sysmon Event ID 1 for detailed process creation events. Look for discrepancies in `OriginalFileName` or `Description` fields that deviate from legitimate versions of the application.

  - **Investigate running instances of AutoHotkey:**
    Use PowerShell to query running processes: `Get-Process | Where-Object {$_.Name -like "AutoHotkey*"}`. Determine if the process is interacting with sensitive applications, signaling potential malicious activity.

  - **Validate environment and user behavior:**
    Compare the execution of AutoHotkey with known legitimate user workflows. If the script was triggered by a known IT task like automation for office software, it may be benign.

  - **Identify high-confidence indicators of compromise:**
    Look for unrecognized or suspicious command-line arguments in process creation logs that may indicate misuse of AutoHotkey for unintended tasks, such as file manipulation or external communication.

  - **Review file creation activities:**
    Check for recent file activity related to AutoHotkey scripts using `Get-WinEvent` for "File Creation" events. Unauthorized file creation or unusual file names may indicate malicious scripts being run.

  ### Prioritization

  This alert has medium severity due to the potential impact of the affected system, especially if it relates to endpoint automation capabilities. While users may utilize AutoHotkey for benign purposes, its ability to execute complex scripts raises the risk of sophisticated abuse. Such behavior is occasionally weaponized in attacks aimed at automating malicious tasks, especially where custom scripts are involved.

  ### Blind Spots and Assumptions

  Detection may be limited by typical user behavior around legitimate usage of AutoHotkey, as many users may run renamed executables for personal automation. Proper configurations for tracking process creation and file creation events are essential for reliable detection of this activity. Additionally, legitimate scripts might trigger this alert if users engage in scripting activities for productivity. A related detection to enhance coverage could include monitoring registry changes associated with AutoHotkey installations and configurations, which might indicate abuse.

