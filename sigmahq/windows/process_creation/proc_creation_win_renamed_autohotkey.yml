  ---

  ### Technical Context

  This Sigma rule detects the execution of renamed instances of the AutoHotkey executable, which is often misused for scripting automation tasks or malicious actions. The likely adversary objective is to automate commands on the victim’s machine without authorization, potentially to exfiltrate data, install malware, or perform lateral movement. This behavior is categorized under the MITRE ATT&CK technique "Command-Line Interface" (T1059).

  The primary telemetry sources include Windows process creation logs, specifically focusing on events such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity can lead to unauthorized access and control over systems, posing a significant risk. However, this detection does NOT confirm the intent behind execution; legitimate use cases for AutoHotkey exist, such as user-initiated automation scripts.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Look for Security Event ID 4688 or Sysmon Event ID 1 that logs the execution of any AutoHotkey processes. Identify the specific instance of interest and its execution context.

  - **Validate the command line parameters:** Inspect the CommandLine field for suspicious arguments or payloads typically used in malicious AutoHotkey scripts (e.g., obfuscated commands, file paths leading to removable drives).

  - **Check timestamp and user:** Determine if the execution time coincides with other suspicious activity (e.g., unusual logins) and identify the user account executing the script. Legitimate use should align with known employee activities.

  - **Identify the file path:** Examine the Image field to confirm if the executable is located in common paths (e.g., C:\Program Files) or unusual directories (e.g., user profile folders or temporary directories), which may indicate malicious use.

  - **Look for process parentage:** Analyze the parent process (ParentImage field) to see if AutoHotkey was spawned by a trusted application or by a process that could indicate malicious behavior (e.g., cmd.exe or powershell.exe).

  - **Correlate with known good actors:** Cross-reference the process with any inventory of known legitimate AutoHotkey scripts used within the organization to distinguish benign activity from potential threats.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact on endpoint integrity if exploited for malicious purposes. While AutoHotkey is commonly used for helpful automation, its capabilities for automation can be weaponized, making its detection noteworthy but context-dependent.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through renaming the executable further or modifying application signatures. Required log sources must be actively enabled to capture the relevant event IDs, as improper configurations may lead to incomplete visibility. Legitimate activities, such as user-initiated automation, may trigger this alert. A related detection to consider is monitoring for suspicious command-line activities as per "Command-Line Interface" (T1059) to provide broader context on potentially malicious actions.

