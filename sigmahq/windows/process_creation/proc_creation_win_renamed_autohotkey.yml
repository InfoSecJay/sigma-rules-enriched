note: |
  ### Technical Context

  This rule detects the execution of AutoHotkey executables that have been renamed, a common tactic used by adversaries to evade detection by security products. Attackers may leverage AutoHotkey for automating tasks, including potentially malicious activities like keylogging or deploying screenscraping tools to collect sensitive information. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1562.001), specifically focusing on obfuscation.

  The primary telemetry sources necessary for this detection include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. If the behavior is malicious, the security impact could be significant, leading to credential theft or unauthorized access to sensitive data. However, this detection alone does not confirm malicious intent as legitimate scripted automation may also utilize AutoHotkey.

  ### Investigation Steps

  - **Examine process creation events:** Review Windows Security Event ID 4688 for any processes associated with renamed AutoHotkey binaries, specifically looking for unauthorized users or unusual parent processes that do not align with standard business operations.

  - **Identify file metadata:** Verify the metadata of the identified executable using Sysinternals tools such as Sigcheck. Look for the presence of 'AutoHotkey.exe' in the OriginalFileName field and assess whether the file path indicates a suspicious directory (e.g., user profile folders vs. system directories).

  - **Validate typical user behavior:** Cross-reference the execution times of the detected scripts with user activity logs (such as Windows Security Event ID 4624 for logon events) to confirm if the activities align with legitimate employee tasks or automation routines at expected times.

  - **Search for patterns of abuse:** Look for instances where users execute multiple AutoHotkey scripts in a short timeframe, particularly those with obfuscated or renamed executable names, indicating potential malicious usage.

  - **Assess environment and context:** Consider the role and criticality of the asset where the execution was detected. For example, if detected on a sensitive workstation (e.g., finance or HR), escalate for deeper investigation compared to standard customer service machines.

  - **Collect and analyze outbound connections:** If exfiltration is suspected, check Sysmon Event ID 3 (Network Connection) for unusual outbound connections related to AutoHotkey execution, indicating potential data theft or C2 communication.

  ### Prioritization

  The alert severity is medium, reflecting the potential for significant impact if the AutoHotkey execution is linked to malicious activity. Given the dual-use nature of AutoHotkey, the likelihood of it being misused in an organization is moderate, especially as classified techniques related to scripting and automation are common among adversaries.

  ### Blind Spots and Assumptions

  Potential evasion techniques include renaming the binaries to common executable names or placing suspicious scripts in legitimate application directories, making detection more challenging. Reliable detection requires comprehensive auditing of process creation events; ensure Sysmon is configured to log network connections as well. Moreover, legitimate automation setups could trigger this rule if untracked, such as user-initiated automation scripts in a testing environment, which should be documented. As a companion detection, consider monitoring for suspicious PowerShell commands, which often accompany malicious AutoHotkey usage.

