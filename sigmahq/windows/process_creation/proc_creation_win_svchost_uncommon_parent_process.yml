logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\svchost.exe'
  filter_main_generic:
    ParentImage|endswith:
    - '\Mrt.exe'
    - '\MsMpEng.exe'
    - '\ngen.exe'
    - '\rpcnet.exe'
    - '\services.exe'
    - '\TiWorker.exe'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - '-'
    - ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances where `svchost.exe` is launched by uncommon parent processes, which may indicate malicious activity, as attackers often attempt to exploit legitimate processes for persistence or C2 communications. The likely objective of this behavior is to evade detection while executing malicious payloads using a trusted Windows service host process. This behavior correlates with the MITRE ATT&CK technique: **T1036.005 - Masquerading - Match Legitimate Name or Location**.

  The primary telemetry source for this detection is Windows process creation events, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized access, data theft, or further lateral movement within the environment. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts or services may also create these parent-child relationships.

  ### Investigation Steps

  - **Check the parent process**: Review the process tree for the `svchost.exe` instance. Security Event ID 4688 or Sysmon Event ID 1 should show the complete lineage of the process. Indicator: `ParentImage` should not match legitimate Windows services like `services.exe` or `rpcnet.exe`.

  - **Analyze the command line arguments**: Examine the command line used to launch the `svchost.exe`. Look for unusual flags or scripts that deviate from standard behavior. Typical arguments should not include obfuscated code or scripts that are not associated with legitimate background tasks.

  - **Identify processes by their file path**: Verify the file path of `svchost.exe`. Legitimate `svchost.exe` should reside in `C:\Windows\System32\`. Instances located in unusual directories (e.g., user folders or temporary directories) are more likely to be malicious.

  - **Review historical baseline**: Compare this event against historical process creation data for the asset. If `svchost.exe` has never been spawned by uncommon parent processes previously, this deviation could warrant further investigation.

  - **Monitor for subsequent network connections**: Cross-reference with network logs (e.g., Windows Firewall logs or your network monitoring solution) to determine if the detected `svchost.exe` is initiating suspicious outbound connections. Legitimate `svchost.exe` instances typically do not attempt to reach unknown external IP addresses or exhibit anomalous communication patterns.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of an 공격 on critical systems, especially if the process is running on domain controllers or application servers. The likelihood of malicious abuse is moderate since attackers frequently utilize the `svchost.exe` process to disguise their activities. While not exclusively weaponized, similar behavior is commonly observed during advanced persistent threat (APT) campaigns.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for process masquerading techniques, where legitimate processes may be compromised. It requires reliable logging of process creation events across all endpoints to function optimally. Additionally, legitimate software updates or IT maintenance activities might trigger the alert due to expected deviations in parent-child process relationships. Companion detections that might strengthen coverage include monitoring unusual file paths for system binaries (e.g., tampered `svchost.exe`) and establishing alerts for abnormal network traffic patterns originating from `svchost.exe`.

