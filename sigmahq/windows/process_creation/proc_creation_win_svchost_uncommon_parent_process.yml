title: Uncommon Svchost Parent Process
id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
status: test
description: Detects an uncommon svchost parent process
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2017-08-15
modified: 2022-06-28
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\svchost.exe'
  filter_main_generic:
    ParentImage|endswith:
    - '\Mrt.exe'
    - '\MsMpEng.exe'
    - '\ngen.exe'
    - '\rpcnet.exe'
    - '\services.exe'
    - '\TiWorker.exe'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - '-'
    - ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the `svchost.exe` process is launched with uncommon or suspicious parent processes. The underlying goal is to uncover potential process injection or manipulation techniques often used by threat actors to evade detection. Attackers may use `svchost.exe`, a legitimate Windows system process, to disguise malicious activities, giving them the ability to execute arbitrary code or maintain persistence on a compromised system.

  The likely attacker objectives include maintaining stealth within a target environment while performing actions such as privilege escalation, data exfiltration, or establishing command and control connections. This detection aligns with the MITRE ATT&CK framework, specifically under the tactics of Defense Evasion (TA0005) and Persistence (TA0003), and techniques such as Masquerading (T1036.005).

  Key telemetry sources for this rule include process creation event logs from Windows systems. Monitoring these logs is crucial as they provide detailed insights into process hierarchies and the context of how processes are executed, aiding in identifying discrepancies indicative of malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent Windows process creation logs, focusing on instances where `svchost.exe` was spawned with abnormal parent processes. Look for patterns that deviate from normal operations.

  - **Analyze Parent Process Behavior**: Investigate the behavior of the parent processes listed in the rule. This includes understanding their standard operating procedures and any potential deviations that may point to malicious intent.

  - **Correlate with Other Security Alerts**: Check for other security alerts or logs from overlaid security instrumentation (e.g., EDR or SIEM) that may correlate with the suspicious process creation, indicating a broader attack pattern.

  - **Conduct a System Health Check**: Perform an assessment of the affected system, looking for indicators of compromise (IoCs), such as unusual network activity, unexpected inbound or outbound traffic, or any other processes that might exhibit malicious characteristics.

  ### Prioritization
  This alert poses a medium-level risk as it could indicate process manipulation or the presence of stealthy malware. While not every instance may indicate a threat, the presence of `svchost.exe` with uncommon parent processes warrants immediate investigation due to the potential impact on system integrity and security.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes scenarios where malicious processes are obfuscated in ways not accounted for by this rule, such as using legitimate parent processes not listed. The detection logic assumes that uncommon parent processes are indicative of malicious behavior, which may not always be the case. Additionally, this rule requires comprehensive process creation logs to function effectively; any misconfigurations in logging settings or log retention policies could lead to undetected malign behavior.

