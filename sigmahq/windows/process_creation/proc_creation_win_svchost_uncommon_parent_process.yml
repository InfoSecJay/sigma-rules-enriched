title: Uncommon Svchost Parent Process
id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
status: test
description: Detects an uncommon svchost parent process
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2017-08-15
modified: 2022-06-28
tags:
- attack.stealth
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\svchost.exe'
  filter_main_generic:
    ParentImage|endswith:
    - '\Mrt.exe'
    - '\MsMpEng.exe'
    - '\ngen.exe'
    - '\rpcnet.exe'
    - '\services.exe'
    - '\TiWorker.exe'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - '-'
    - ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where the `svchost.exe` process is spawned with unusual parent processes that are typically not associated with legitimate system activity. The objective of an attacker employing this behavior often involves executing malicious components while evading detection by leveraging the common `svchost.exe` process as a cover. The relevant MITRE ATT&CK tactic is **Defense Evasion** and the technique is **T1036.005** (Masquerading: Match Legitimate Name or Location).

  The primary telemetry sources include Windows Process Creation events (Event ID 4688) and Sysmon (Event ID 1), which provide details on process execution and relationships. If malicious, this behavior can indicate an attempt to stealthily run a payload under the guise of a trusted process. Importantly, this detection does not confirm that the parent process or its activity is intrinsically malicious; further investigation is necessary.

  ### Investigation Steps

  - **Examine process lineage:** Utilize Windows Event ID 4688 to inspect the complete command line and parent-child relationship for `svchost.exe`. Look for unusual command line parameters indicating potential exploitation (e.g., commands that do not align with typical system operations).

  - **Identify known good parent processes:** Compare parent process entries against a whitelist of established processes (e.g., `Mrt.exe`, `MsMpEng.exe`, etc.). Legitimate behavior will often show these common processes as parents of `svchost.exe`.

  - **Check Sysmon logs:** Review Sysmon Event ID 1 to identify file hashes, creation time, and user context for processes involved. Malicious indicators may include strange or mismatched hashes for `svchost.exe`; known good hashes can be compared.

  - **Monitor for persistence mechanisms:** Investigate registry entries or scheduled tasks that may correlate with the unusual process spawnings. Look for references in the registry (`HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services`) linked to non-standard executable paths.

  - **Assess potential lateral movement:** If the detected `svchost.exe` runs in a sensitive or critical system role (e.g., domain controllers or financial systems), prioritize the investigation due to potential implications of lateral movement toward more critical assets.

  ### Prioritization

  This alert should be considered medium severity as it involves potentially anomalous behavior in a critical system process. The ability for adversaries to leverage `svchost.exe` to hide malicious activities makes this behavior noteworthy, although detailed context is necessary to ascertain the true severity and intent of the activity.

  ### Blind Spots and Assumptions

  Detection can miss evasion techniques such as attackers using custom-named binaries that mimic `svchost.exe`, which may evade this rule. Reliable detection requires complete logging of Windows process creation events and Sysmon configurations to ensure comprehensive visibility. Regular administrative activities, such as system updates or security scans, might trigger similar alerts if not appropriately whitelisted. Companion detections focusing on known malicious behavior associated with `svchost.exe`, like keyword searches for known malicious command lines, can strengthen overall detection capabilities.

