title: Uncommon Svchost Parent Process
id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
status: test
description: Detects an uncommon svchost parent process
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2017-08-15
modified: 2026-10-19
tags:
- attack.stealth
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\svchost.exe'
  filter_main_generic:
    ParentImage|endswith:
    - '\Mrt.exe'
    - '\MsMpEng.exe'
    - '\ngen.exe'
    - '\rpcnet.exe'
    - '\services.exe'
    - '\TiWorker.exe'
  filter_main_svchost:
    ParentImage|endswith: '\svchost.exe'
    CommandLine|endswith:
    - 'svchost.exe"'
    - 'svchost.exe'
    - '-k TSLicensing'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - '-'
    - ''
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the spawning of an uncommon `svchost.exe` process that originates from anomalous parent processes, such as `Mrt.exe` (Microsoft Windows Malicious Software Removal Tool) or `MsMpEng.exe` (Microsoft Malware Protection Engine). The behavior is indicative of potential privilege escalation, exploitation, or lateral movement tactics by an adversary, aiming to execute malicious payloads disguised as legitimate Windows services.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and **System Service Discovery** (T1056). The primary telemetry sources are Windows process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1. The security impact could be significant as it may indicate malicious activity evading traditional security measures. However, this detection does NOT confirm that the activity is inherently malicious without corroborating evidence from additional telemetry.

  ### Investigation Steps

  - **Inspect process creation logs:** Review Security Event ID 4688 for the creation of `svchost.exe`. Focus on the `ParentImage` field to identify any known benign parent processes (e.g., `services.exe`). If the parent process matches any listed in the Sigma rule’s filters, it is suspicious.

  - **Analyze command line arguments:** For instances where `svchost.exe` was spawned, check the CommandLine field for unusual options or parameters. An expected benign entry would typically either have no arguments or be related to system services, whereas unexpected flags may indicate malicious intent.

  - **Cross-reference against known processes:** Identify if the originating parent process (`Mrt.exe`, `MsMpEng.exe`, etc.) was invoked by legitimate system activities or user actions. Legitimate occurrences are generally scheduled tasks or user-initiated scans.

  - **Look for high-confidence malicious indicators:** Investigate any `svchost.exe` instances that have a `ParentImage` of `services.exe`. If the `Image` field's file path does not exist in typical system directories (e.g., `C:\Windows\System32\`), categorize this as high confidence in malicious activity.

  - **Validate file creation or modification:** Check the file system for recent changes involving `svchost.exe` and related executable signatures. Use appropriate file integrity monitoring tools to identify unauthorized modifications, particularly if a newly created or modified executable is present.

  - **Assess asset criticality:** Determine if the affected system is crucial to enterprise operations. If it hosts critical applications or sensitive data, alerting higher-tier analysts is imperative, regardless of confirmation of malicious behavior.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on a critical system if exploited. The likelihood of malicious abuse is elevated, particularly as the behavior aligns with commonly weaponized techniques for stealth and lateral movement in targeted environments.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate processes that could match the parent criteria under varied circumstances, such as scheduled maintenance or updates. It assumes that the necessary logging configurations are enabled to capture each relevant process creation event. Common legitimate activities may include system updates triggering `svchost.exe`, and a companion detection rule for unusual system service behavior could enhance overall visibility.

