title: Process Memory Dump Via Dotnet-Dump
id: 53d8d3e1-ca33-4012-adf3-e05a4d652e34
status: test
description: |
  Detects the execution of "dotnet-dump" with the "collect" flag. The execution could indicate potential process dumping of critical processes such as LSASS.
references:
- https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-dump#dotnet-dump-collect
- https://twitter.com/bohops/status/1635288066909966338
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-14
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\dotnet-dump.exe'
  - OriginalFileName: 'dotnet-dump.dll'
  selection_cli:
    CommandLine|contains: 'collect'
  condition: all of selection_*
falsepositives:
- Process dumping is the expected behavior of the tool. So false positives are 
  expected in legitimate usage. The PID/Process Name of the process being dumped
  needs to be investigated
level: medium
note: |
  ### Technical Context

  This rule detects the execution of "dotnet-dump" with the "collect" flag, which may indicate an adversary attempting to extract sensitive information from critical processes, such as LSASS (Local Security Authority Subsystem Service). The likely attacker objective is to acquire credentials or other sensitive data from compromised systems. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (T1562) and the specific technique of Process Injection (T1218).

  The primary telemetry sources for this detection are process creation logs generated by the Windows Security Auditing (Event ID 4688) and Sysmon (Event ID 1). If malicious, this behavior can lead to credential theft or other impacts related to privilege escalation. Importantly, this detection does NOT confirm malicious intent on its own, as "dotnet-dump" has legitimate use cases for debugging .NET applications.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 and Sysmon Event ID 1 for executions of "dotnet-dump.exe" with a command line containing "collect." Examine the parent process to contextualize the execution.

  - **Examine targeted processes:** Identify which process is being dumped by analyzing the PID in the logs. Look for processes related to LSASS or other sensitive applications. Dumping LSASS specifically is often a malicious indicator.

  - **Evaluate command line arguments:** Look for additional command line parameters and flags that enhance malicious intent, such as arguments specifying target PIDs associated with high-value processes (e.g., "collect --pid <PID>").

  - **Analyze file system activity:** Use Process Monitor or equivalent to verify file creation or modification by "dotnet-dump." Specifically check for .dmp files created in unusual locations (e.g., user temp directories), as these could indicate data exfiltration attempts.

  - **Identify expected legitimate usage:** Contrast the context against legitimate use cases for "dotnet-dump," such as authorized debugging sessions conducted by development teams, and evaluate if the execution aligns with known processes or scheduled tasks.

  ### Prioritization

  This alert is considered medium severity as it indicates a potential attempt to extract sensitive information from critical processes, posing high-risk implications if successful. However, this behavior can also be benign in scenarios involving development or troubleshooting by trusted personnel.

  ### Blind Spots and Assumptions

  This detection may be evaded if "dotnet-dump" is executed with carefully crafted parameters or via obfuscated methods. Reliable detection requires complete event logging for process creation across the environment. Legitimate activities could include authorized debugging sessions or troubleshooting cases. Companion detections to consider include monitoring the creation of unusual process dump files or alerts from credential dumping techniques in conjunction with this rule.

