logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\dotnet-dump.exe'
  - OriginalFileName: 'dotnet-dump.dll'
  selection_cli:
    CommandLine|contains: 'collect'
  condition: all of selection_*
falsepositives:
- Process dumping is the expected behavior of the tool. So false positives are expected
  in legitimate usage. The PID/Process Name of the process being dumped needs to be
  investigated
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the `dotnet-dump` utility with the "collect" flag, which can signal a potential process memory dump. The execution of this utility is noteworthy because it can be employed by threat actors to gather sensitive information from critical processes, such as LSASS (Local Security Authority Subsystem Service), which is responsible for enforcing the security policy on Windows systems and handles authentication. By dumping the memory of LSASS, attackers may extract sensitive credentials and tokens that could facilitate further malicious actions within the environment.

  In the context of the MITRE ATT&CK framework, this behavior relates to the **Defense Evasion** tactic and specifically to the technique **T1218: Signed Binary Proxy Execution**. Attackers leveraging this technique often aim to execute trusted binaries to avoid detection while performing unauthorized actions, such as credential theft. The primary data sources for detecting this behavior include process creation logs, which can reveal the invocation of `dotnet-dump`, along with any relevant command-line arguments that were used during execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events to locate instances of `dotnet-dump.exe` being executed, focusing on command lines that include the "collect" flag.
  - **Correlate with Critical Processes:** Identify the process identifiers (PIDs) and names associated with the `dotnet-dump` executions, particularly if they involve sensitive applications like LSASS.
  - **Assess System Context:** Investigate the context of the execution, including the user account that executed the command, the timing, and any relevant access logs that could indicate suspicious activity.
  - **Check for Previous Anomalies:** Look for other indications of anomalous behavior around the time `dotnet-dump` was executed, such as unexpected privilege escalation or unusual access patterns to sensitive resources.

  ### Prioritization
  Given that the execution of `dotnet-dump` with the "collect" flag is indicative of potential credential dumping activities, this alert is of medium priority as it may signal a significant threat to the organization’s security posture if leveraged by malicious actors.

  ### Blind Spots and Assumptions
  There may be blind spots in this detection logic as legitimate usage of `dotnet-dump` for troubleshooting or diagnostic purposes could lead to false positives. The detection assumes that the execution context is unexpected or suspicious, especially when tied to sensitive processes. Successful detection relies on accurate logging from process creation events and the ability to monitor command-line activities; organizations must ensure that these log types are enabled and adequately configured to capture the necessary details.

