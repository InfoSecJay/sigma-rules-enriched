note: |
  ### Technical Context

  This Sigma rule detects the execution of "dotnet-dump" with the "collect" flag, which is used to create memory dumps of running processes. This behavior is particularly concerning when targeting critical processes like LSASS, as attackers may leverage memory dumps to extract sensitive information like credentials. The relevant MITRE ATT&CK tactic is "Credential Access" (TA0006) using the technique "Process Injection" (T1218).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details about executed processes. If malicious, this activity may lead to credential theft or unauthorized access to sensitive information. Notably, this detection does not confirm that any credentials have been successfully extracted; it merely indicates a potential preparatory step.

  ### Investigation Steps

  - **Examine associated process details:** Check Security Event ID 4688 for the process ID that executed `dotnet-dump.exe` and identify the parent process. A suspicious parent process such as `powershell.exe` or `cmd.exe` should raise concerns.

  - **Validate command line arguments:** Review the command line arguments in Sysmon Event ID 1 for suspicious flags or additional parameters. Legitimate use may involve `dotnet-dump collect` followed by specific process IDs; deviations could indicate malicious intent.

  - **Check for common legitimate usage:** Identify instances of `dotnet-dump` being used in your environment with processes that are known to generate dumps safely, such as for debugging applications during development cycles. Expect frequent legitimate executions related to development processes or troubleshooting activities.

  - **Assess for high-confidence malicious indicators:** Look for memory dumps targeting LSASS or other sensitive processes. If found, correlate these with abnormal authentication logs or indications of lateral movement (Security Event ID 4624 for logons), suggesting further exploitation efforts.

  - **Identify unusual access patterns:** Review Windows Event ID 5145 for file access to memory dump locations (e.g., `C:\Users\<username>\AppData\Local\Temp`). Unusual access patterns to dump files, especially from administrative accounts, may indicate malicious activity.

  ### Prioritization

  This alert is of medium severity due to its potential impact on credential security and system integrity, especially if targeting high-value assets. While process dumping is sometimes legitimate, the likelihood of abuse is significant given the prevalence of such tools in adversaries' arsenals.

  ### Blind Spots and Assumptions

  This detection could be evaded if an attacker uses custom-built tools or hidden command-line arguments that do not include "collect". It relies on the availability and configuration of Sysmon and Windows Security logs; insufficient logging can lead to missed detections. Legitimate developers and support teams might trigger this alert during debugging or troubleshooting sessions. Related detections include monitoring for unexpected memory dumping patterns or powershell script executions that may signify preparation for credential theft.

