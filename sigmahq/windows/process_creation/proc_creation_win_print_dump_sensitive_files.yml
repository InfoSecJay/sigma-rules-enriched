logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\print.exe'
  - OriginalFileName: 'Print.EXE'
  selection_cli:
    CommandLine|contains|windash: '/D'
    CommandLine|contains:
    - '\config\SAM'
    - '\config\SECURITY'
    - '\config\SYSTEM'
    - '\windows\ntds\ntds.dit'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
