note: |
  ### Technical Context

  This Sigma rule detects the misuse of the Print.exe utility to extract sensitive files related to Windows credentials, specifically targeting the SAM, SECURITY, SYSTEM, and ntds.dit files. The likely attacker objective is credential harvesting to facilitate lateral movement or privilege escalation within a compromised environment. This behavior aligns with the MITRE ATT&CK technique T1003.003 (Credential Dumping: Security Account Manager), and T1003.002 (Credential Dumping: NTDS).

  The primary telemetry source for this detection includes process creation logs, specifically capturing Event ID 4688 from the Windows Security Event log or Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized access and a significant compromise of sensitive information across the organization. Notably, this detection does NOT confirm that credentials have been successfully harvested, only that the Print.exe tool was used in a potentially malicious manner.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 or Sysmon Event ID 1. Filter for instances of Print.exe with command line arguments containing `/D` and attempts to access `\config\SAM`, `\config\SECURITY`, `\config\SYSTEM`, or `\windows\ntds\ntds.dit`.

  - **Identify legitimate uses of Print.exe**: Look for benign processes utilizing Print.exe in a standard operational context, such as network printing tasks with no command line parameters targeting sensitive directories.

  - **Correlate with user account activities**: Investigate the user accounts associated with the Print.exe processes. Validate if the accounts typically execute printing tasks and have the required privileges to access sensitive files.

  - **Analyze command line arguments**: Assess the full command line for any indicators of abuse. Legitimate command lines for Print.exe typically do not include paths to sensitive files or restricted directories.

  - **Monitor for access to targeted files**: Cross-reference any successful operations with file access logs for ntds.dit, SAM, SECURITY, and SYSTEM to confirm if there were previous read operations performed prior to the Print.exe execution.

  - **Review recent escalation attempts**: Investigate nearby security events indicating privilege escalation or anomalous authentication attempts (e.g., unusual logins to sensitive assets) that may support the motive behind credential dumping via Print.exe.

  ### Prioritization

  This alert is high severity due to the potential compromise of sensitive user credentials. The likelihood of malicious exploitation is significant, especially in environments where sensitive data is critical. Misuse of Print.exe for credential harvesting is an established technique among adversaries and should be treated with urgent attention.

  ### Blind Spots and Assumptions

  Detection may be limited by non-log events or if Print.exe is executed with obfuscated parameters. Ensure that security auditing is enabled to capture thorough process creation data. Legitimate administrative tasks, such as system maintenance or configurations, might trigger this alert when using Print.exe. A related detection to consider is monitoring for unauthorized access or activity on sensitive files, such as those listed in this rule, which can enhance overall situational awareness.

