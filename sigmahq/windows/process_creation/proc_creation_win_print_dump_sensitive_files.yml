note: |
  ### Technical Context

  This Sigma rule detects the abuse of the Print.exe utility to copy sensitive files, such as ntds.dit, SAM, SECURITY, and SYSTEM, from the Windows directory for potential credential harvesting. The attacker likely aims to obtain user credentials, enabling further attacks like lateral movement or privilege escalation. This behavior maps to MITRE ATT&CK techniques T1003.003 (Credential Dumping: NTDS) and T1003.002 (Credential Dumping: Security Account Manager).

  The primary telemetry source is Windows process creation logs, specifically those capturing Event ID 4688 or Sysmon Event ID 1. If malicious, this behavior poses a significant security risk, potentially granting access to critical system resources or sensitive information. Notably, this detection does NOT confirm that credentials have been successfully harvested or that they are being used maliciously.

  ### Investigation Steps

  - **Check process creation logs:** Look for Event ID 4688 or Sysmon Event ID 1 where the Image path ends with '\print.exe'. Ensure the OriginalFileName is 'Print.EXE'.

  - **Analyze command line arguments:** Review the CommandLine field for any instances containing '/D' in combination with paths like '\config\SAM', '\config\SECURITY', '\config\SYSTEM', or '\windows\ntds\ntds.dit'. This may indicate malicious intent.

  - **Identify legitimate use cases:** Validate that Print.exe is being invoked as part of normal operations, such as printer installations or configured print jobs, without accessing sensitive files.

  - **Correlate with user activity:** Cross-reference with user behaviors by checking logs for suspicious login patterns or accounts that should not be accessing sensitive files, using tools like Security Event Logs (Event IDs 4624 and 4625).

  - **Look for concurrent events:** Examine other relevant logs (e.g., Windows Event Log or Sysmon) for common indicators of malicious behavior, such as unusual account activity or events involving credential dumping.

  - **Investigate file access logs:** If possible, check for modifications or access to sensitive files post the Print.exe invocation, which may indicate an attempted or successful credential extraction.

  ### Prioritization

  This alert carries high severity due to the potential exposure of sensitive credential information which can lead to further compromise or lateral movement within the network. The likelihood of malicious abuse is substantial, as the techniques used are well-documented within the threat landscape and have been previously weaponized in various attacks.

  ### Blind Spots and Assumptions

  This detection can be evaded by modifying command arguments or using alternative methods for credential dumping that do not involve Print.exe. Ensure logging is adequately configured to capture process creation and command-line arguments for reliable detection. Legitimate administrative activities, like backups or system migrations, may trigger this alert if not properly understood. A companion detection, such as monitoring for unusual logon events to critical systems, can enhance coverage against these types of credential theft attempts.

