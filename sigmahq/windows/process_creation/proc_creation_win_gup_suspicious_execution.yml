title: Suspicious GUP Usage
id: 0a4f6091-223b-41f6-8743-f322ec84930b
status: test
description: Detects execution of the Notepad++ updater in a suspicious directory,
  which is often used in DLL side-loading attacks
references:
- https://www.fireeye.com/blog/threat-research/2018/09/apt10-targeting-japanese-corporations-using-updated-ttps.html
author: Florian Roth (Nextron Systems)
date: 2019-02-06
modified: 2022-08-13
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\GUP.exe'
  filter_programfiles:
    Image|endswith:
    - '\Program Files\Notepad++\updater\GUP.exe'
    - '\Program Files (x86)\Notepad++\updater\GUP.exe'
  filter_user:
    Image|contains: '\Users\'
    Image|endswith:
    - '\AppData\Local\Notepad++\updater\GUP.exe'
    - '\AppData\Roaming\Notepad++\updater\GUP.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Execution of tools named GUP.exe and located in folders different than Notepad++\updater
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the GUP.exe (Notepad++ updater) from suspicious directories, which may indicate attempts at DLL side-loading attacks. Attackers often use legitimate applications and their update mechanisms to execute malicious payloads, evading traditional security measures. By running GUP.exe from locations outside of its standard installation path, such as user profile directories, adversaries may be trying to manipulate the allowed update process to execute arbitrary code, potentially leading to privilege escalation or the establishment of persistence mechanisms.

  The rule relates to several MITRE ATT&CK tactics and techniques, including **Privilege Escalation (TA0004)**, **Persistence (TA0003)**, and **Defense Evasion (TA0005)**, particularly the technique **Trusted Developer Utilities (T1574.001)**. The critical focus here is on how attackers exploit trusted applications to gain unauthorized access or maintain their foothold within the environment using established update mechanisms.

  To effectively utilize this detection, analysts should monitor process creation events in the Windows environment, focusing on instances of GUP.exe being executed from non-standard paths, which can be critical indicators of compromise.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for instances of GUP.exe and analyze the execution paths to determine if they originate from suspicious directories, particularly within user profile folders.
  - **Check for DLL Injections:** Investigate any DLLs that are loaded at the time of GUP.exe execution in relation to abnormal process behavior, including memory analysis to identify anomalies that may point to a side-loading attempt.
  - **Correlate with User Activity:** Analyze user activity around the time of the detection to see if the execution correlates with known legitimate activity or indicates unauthorized access, especially if unusual access patterns are noted.
  - **Audit Installed Applications:** Conduct an inventory of installed applications, particularly Notepad++, to ensure that only authorized versions are present and verify that no unauthorized modifications have been made to the updater executable.

  ### Prioritization
  The alert is classified as high severity due to the potential for significant impact. If attackers successfully execute code through DLL side-loading, it could lead to extensive compromise within an organization, including data exfiltration or lateral movement.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage where legitimate applications or services use similarly named executables, which could produce false positives. The detection logic assumes that GUP.exe will not be found and executed from legitimate directories other than those defined in the filters. Proper logging configuration for process creation events – specifically for user-level activity and path details – is required for this alert to function effectively. Evaluation of event logs needs to ensure comprehensive coverage of user activity to minimize gaps in detection.

