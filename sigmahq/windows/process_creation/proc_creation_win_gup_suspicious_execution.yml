title: Suspicious GUP Usage
id: 0a4f6091-223b-41f6-8743-f322ec84930b
status: test
description: Detects execution of the Notepad++ updater in a suspicious 
  directory, which is often used in DLL side-loading attacks
references:
- https://www.fireeye.com/blog/threat-research/2018/09/apt10-targeting-japanese-corporations-using-updated-ttps.html
author: Florian Roth (Nextron Systems)
date: 2019-02-06
modified: 2022-08-13
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\GUP.exe'
  filter_programfiles:
    Image|endswith:
    - '\Program Files\Notepad++\updater\GUP.exe'
    - '\Program Files (x86)\Notepad++\updater\GUP.exe'
  filter_user:
    Image|contains: '\Users\'
    Image|endswith:
    - '\AppData\Local\Notepad++\updater\GUP.exe'
    - '\AppData\Roaming\Notepad++\updater\GUP.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Execution of tools named GUP.exe and located in folders different than 
  Notepad++\updater
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Notepad++'s updater (GUP.exe) from suspicious directories, often a precursor to DLL side-loading attacks. Attackers may leverage this behavior to execute malicious payloads while disguising them as trusted software updates, thus potentially gaining elevated privileges or maintaining persistence within the environment. The relevant MITRE ATT&CK techniques include `T1574.001 - DLL Side-Loading`.

  The primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture new process creation events. If malicious, this behavior could result in undetected execution of harmful code and further compromise of the system. Importantly, this detection does NOT confirm that a compromise has occurred; rather, it highlights a potentially suspicious execution context that warrants further investigation.

  ### Investigation Steps

  - **Examine process creation logs:** Retrieve Windows Security Event ID 4688 and Sysmon Event ID 1 focusing on processes executing `GUP.exe`. Look for unexpected command-line arguments or parent processes that are out of the ordinary.

  - **Identify parent processes:** Analyze the parent process of `GUP.exe`. A legitimate execution typically occurs from Notepad++ or its installation directory. Any execution from an unexpected context (e.g., user applications not related to Notepad++) is suspect.

  - **Review directory location:** Validate the execution path of `GUP.exe`. Legitimate executions will originate from `\Program Files\Notepad++\updater\` or `\Program Files (x86)\Notepad++\updater\`. Locations within `\Users\...\AppData\` could indicate malicious activity.

  - **Assess running processes and associated DLLs:** Investigate any loaded DLLs associated with the `GUP.exe` process. Use tools like Sysinternals' Process Explorer to identify atypical or unsanctioned DLLs loaded by this process.

  - **Check for file creation activities:** Look for signs of file creation in the directory where `GUP.exe` was executed. Any accompanying executable files created in suspicious directories could indicate an attempted side-loading attack.

  ### Prioritization

  The alert is classified as high severity due to the potential impact on critical assets when GUP.exe is executed from unreliable locations. This method is frequently weaponized by adversaries to deliver payloads stealthily, raising the likelihood of malicious abuse significantly.

  ### Blind Spots and Assumptions

  Detection limitations exist, as attackers may rename or obfuscate their executables to evade this detection. Furthermore, systems not logging process creation events due to configuration errors may not capture this activity. Legitimate software installations or updates may also trigger the alert if `GUP.exe` is executed within user directories. Monitoring for related threats, such as `T1071.001 - Application Layer Protocol: Web Protocols`, can provide additional context for suspicious communications if DLL side-loading is confirmed.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
