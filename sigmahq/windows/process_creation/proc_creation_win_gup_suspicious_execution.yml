title: Suspicious GUP Usage
id: 0a4f6091-223b-41f6-8743-f322ec84930b
status: test
description: Detects execution of the Notepad++ updater in a suspicious 
  directory, which is often used in DLL side-loading attacks
references:
- https://www.fireeye.com/blog/threat-research/2018/09/apt10-targeting-japanese-corporations-using-updated-ttps.html
author: Florian Roth (Nextron Systems)
date: 2019-02-06
modified: 2022-08-13
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\GUP.exe'
  filter_programfiles:
    Image|endswith:
    - '\Program Files\Notepad++\updater\GUP.exe'
    - '\Program Files (x86)\Notepad++\updater\GUP.exe'
  filter_user:
    Image|contains: '\Users\'
    Image|endswith:
    - '\AppData\Local\Notepad++\updater\GUP.exe'
    - '\AppData\Roaming\Notepad++\updater\GUP.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Execution of tools named GUP.exe and located in folders different than 
  Notepad++\updater
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of GUP.exe (Notepad++ updater) from suspicious directories, particularly user directories, which may indicate a DLL side-loading attack. The likely objective of an attacker is to exploit the GUP.exe process to load malicious DLLs, gaining persistence and elevating privileges while avoiding detection. This behavior is associated with the MITRE ATT&CK technique of **DLL Side-Loading** (T1574.001).

  The primary telemetry source is process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture new process creation events. If executed maliciously, this could lead to unauthorized persistence and compromise of sensitive data or system integrity. Importantly, this detection does NOT confirm malicious activity on its own; it requires further investigation to validate intent and context.

  ### Investigation Steps

  - **Verify process origin:** Check the path of GUP.exe: Confirm if it is being executed from `C:\Program Files\Notepad++\updater` or `C:\Program Files (x86)\Notepad++\updater`. Legitimate activity is expected from these paths; anything from `C:\Users\<username>\AppData\Local\Notepad++\updater` or `C:\Users\<username>\AppData\Roaming\Notepad++\updater` is suspicious.

  - **Review user execution context:** Examine the User Account that executed the process: Look for unusual user accounts or administrative access in process creation logs (Event ID 4688). Non-standard or generic accounts may indicate malicious use.

  - **Check for DLL load events:** Investigate for associated DLLs loaded by GUP.exe: Inspect Sysmon Event ID 5 logs to identify any anomalous or unexpected DLLs residing in the same directory (`C:\Users\<username>\AppData\...`). Confirm that expected DLLs for the Notepad++ updater are being loaded.

  - **Analyze command-line arguments:** Assess the command-line parameters passed to GUP.exe: Control for common flags associated with updates and ensure they align with expected benign operations. Malicious arguments may indicate an exploit attempt.

  - **Correlate with threat intelligence:** Reference current threat intelligence regarding DLL side-loading activities associated with GUP.exe: Compare any observed patterns against known TTPs from related advisories, such as the one provided by FireEye, to identify potential threats.

  ### Prioritization

  This alert is considered high severity due to the potential for privilege escalation and persistence on critical endpoints, particularly if the affected system is a user workstation with access to sensitive data. The likelihood of misuse is increased due to the prevalence of DLL side-loading techniques in modern attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive Windows process creation logs, which can result in false negatives. Attackers may use different directory structures or legitimate applications in conjunction with similar names, complicating detection. Legitimate automation or standard user updates of Notepad++ may trigger this alert. Companion detection such as monitoring DLL load events could enhance detection capabilities by confirming the legitimacy of DLLs being loaded by GUP.exe.

