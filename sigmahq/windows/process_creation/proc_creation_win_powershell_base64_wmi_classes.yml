note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that contain base64-encoded strings corresponding to Windows Management Instrumentation (WMI) classes like `Win32_ShadowCopy`, `Win32_ScheduledJob`, etc. Such behavior is typically associated with adversarial activity, where attackers use obfuscation techniques to hide malicious intents, such as creating system snapshots, scheduling tasks, or performing lateral movement. The likely attacker objective is to leverage these capabilities to persist within a network or exfiltrate data.

  This detection relates to the MITRE ATT&CK tactic: Execution (T1059.001: PowerShell) and may also relate to Anti-Detection Techniques (T1027: Obfuscated Files or Information). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the detected behavior is indeed malicious, it poses a significant security threat, potentially allowing an attacker to create unauthorized backups or execute scheduled tasks. However, this detection does NOT confirm malicious activity on its own, as there may be legitimate uses for these commands within operational environments.

  ### Investigation Steps

  - **Review Process Creation Logs**: Examine Windows Security Event ID 4688 and Sysmon Event ID 1 for processes related to `powershell.exe` or `pwsh.exe`. Note command lines that include base64-encoded strings indicating WMI class usage. Benign command lines may involve legitimate administrative tasks or scripts.

  - **Decode Base64 Command Line Parameters**: Decode the base64 strings extracted from the alert to analyze their content. This can reveal whether the commands correspond to legitimate administrative tasks or possible malicious activity.

  - **Correlate with Recent Changes**: Check for recent changes in system settings or scheduled tasks using Windows Event ID 4697 (Service Created) and Task Scheduler logs. Unscheduled tasks that match the decoded commands can indicate malicious activity.

  - **Investigate User Context**: Identify the user context from which the PowerShell command was executed using the `SubjectUserName` field in relevant logs. Legitimate administrators may use these commands, whereas anomalous accounts or service accounts should be scrutinized further.

  - **Assess Host Role**: Consider the criticality of the asset where the activity was detected. For example, if these commands were executed on domain controllers or database servers, prioritize them for immediate investigation.

  - **Monitor for Evasion Techniques**: Look for signs of masking or redeclaration via aliases or obscured script execution paths. Check logs for patterns an attacker may use to bypass detection, such as non-standard encodings or unexpected parent processes.

  ### Prioritization

  The alert is considered high severity due to the critical impact of potentially malicious WMI interactions, especially on sensitive systems like servers and domain controllers. The likelihood of malicious abuse is high, as the use of base64-encoded PowerShell commands is often observed in real-world attacks, including ransomware deployment and lateral movement strategies.

  ### Blind Spots and Assumptions

  There are limitations in detecting truly stealthy operations; an attacker might employ additional obfuscation techniques that can evade this detection. Reliable logging of process creations is necessary; ensure Sysmon is configured appropriately to capture process creation events. Legitimate administrative tools and scripts can trigger this alert, so understanding context is crucial. A related detection that strengthens coverage is monitoring for suspicious user credential misuse via Windows Event ID 4624 (Logon).

