note: |
  ### Technical Context

  This Sigma rule detects potentially malicious usage of PowerShell that executes Base64 encoded commands targeting specific Windows Management Instrumentation (WMI) classes. This technique is commonly employed by adversaries to execute commands stealthily, leveraging WMI to perform actions like creating shadow copies or scheduling jobs without attracting immediate attention.

  The likely attacker objective is to manipulate system configurations or gather information to further their attack goals, fitting within the MITRE ATT&CK framework under tactics such as Execution (T1059.001) and Defense Evasion (T1027). The primary telemetry source for this detection is process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which capture details about the invoked PowerShell process and its command line arguments.

  If malicious, this behavior could allow adversaries to create unauthorized backups, modify system settings, or gain persistence on the system. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also utilize these PowerShell commands.

  ### Investigation Steps

  - **Review the PowerShell command line:** Check the command line arguments in Event ID 4688 (Windows Security) or Sysmon Event ID 1 for Base64 encoded strings, particularly those containing known patterns related to WMI classes like `Win32_ShadowCopy` or `Win32_ScheduledJob`.

  - **Identify abnormal process parents:** Analyze the parent process for the detected PowerShell instance. Legitimate PowerShell usage is often initiated from trusted processes such as `explorer.exe` or other administrative tools. Requests initiated from unusual parent processes (e.g., unknown executables) could indicate malicious activity.

  - **Check for recent user activity:** Cross-reference the logged-on user from the detected PowerShell execution with user activity logs (e.g., Event ID 4624). Verify if this user has a legitimate reason to perform these operations, as unauthorized user accounts executing such commands can be a strong indicator of compromise.

  - **Investigate related log artifacts:** Examine the WMI logs (Windows Event ID 5857) for any execution of commands related to `Win32_ShadowCopy`, `Win32_ScheduledJob`, or other WMI classes to establish a timeline of events and potential system manipulation.

  - **Validate permissions and system state:** Assess the permissions of the executing user and the criticality of the affected system. If the system is a backup server or critical asset, the security impact of malicious actions is heightened.

  - **Look for associated malicious indicators:** Search through other logs (e.g., EDR solutions, firewall logs) to identify any additional anomalous activities or known malicious indicators associated with the detected PowerShell commands, using threat intelligence feeds where available.

  ### Prioritization

  The alert should be considered high severity, particularly on critical systems, as it indicates potential abuse of administrative capabilities that could lead to substantial data exfiltration or further compromise. The likelihood of malicious abuse is significant, given the stealthy nature of WMI and Base64 encoding, both of which are techniques frequently weaponized in post-exploitation scenarios by threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where WMI is heavily utilized for legitimate administrative purposes, potentially leading to false positives. Ensure that logging for PowerShell and WMI is comprehensively configured to capture all necessary details, including command line arguments. Legitimate administrative tasks may also trigger this alert, particularly during routine maintenance. A related detection to strengthen coverage can include monitoring for unusual WMI event subscriptions (MITRE ATT&CK technique T1046), which can indicate similar nefarious persistence mechanisms.

