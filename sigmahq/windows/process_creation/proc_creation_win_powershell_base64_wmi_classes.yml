note: |
  ### Technical Context
  This detection rule is designed to identify suspicious PowerShell executions that involve base64 encoded commands targeting WMI classes such as "Win32_ShadowCopy" and "Win32_ScheduledJob." Attackers often use PowerShell for malicious activities, taking advantage of its capabilities to perform tasks like remote command execution, data exfiltration, and system manipulation. The base64 encoding is frequently employed to obfuscate the commands, making it difficult to analyze them without proper decoding.

  These encoded commands may indicate malicious objectives such as creating shadow copies for data exfiltration or scheduling tasks to execute other payloads. The likely behaviors associated with these operations suggest that the attacker aims to establish persistence, escalate privileges, or conduct reconnaissance within the environment. The relevant MITRE ATT&CK tactics include **Execution** (TA0002), specifically **PowerShell** (T1059.001), and **Defense Evasion** (TA0005), particularly **Obfuscated Files or Information** (T1027).

  The primary data sources for detecting this activity include process creation events that capture command-line arguments and related Windows API usage, specifically focusing on PowerShell processes.

  ### Investigation Steps
  - **Review PowerShell Execution Logs**: Examine logs for process creation events involving PowerShell or pwsh, specifically looking for any command line entries that include base64 encoded strings indicative of WMI tasks.

  - **Decode Command Line Arguments**: For identified processes, extract the command line associated with the base64 encoded strings and decode them to understand the exact operations being executed by the attacker.

  - **Monitor WMI Activity**: Check for any unusual WMI activity related to the targeted classes (e.g., Win32_ShadowCopy, Win32_ScheduledJob) using Windows Event logs or WMI logs that can provide insight into the commands executed alongside these objects.

  - **Correlate with User Activities**: Investigate the user accounts associated with the suspicious PowerShell executions to determine if they show signs of credential theft or unauthorized access, reviewing their login history and privileges assigned.

  ### Prioritization
  The severity of this alert is high due to the potential impact of WMI-based attacks on data integrity and system availability. The use of obfuscated PowerShell commands significantly increases the likelihood of undetected lateral movement or data exfiltration within an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may miss non-encoded PowerShell commands or those executed by other legitimate administrative processes that use WMI. Additionally, the effectiveness of the detection relies on the availability of detailed process creation logs and could be impacted by configuration settings that do not consistently capture all relevant activity. The presence of false positives is also a consideration, as legitimate administrative tasks may trigger the detection logic.

