title: Portable Gpg.EXE Execution
id: 77df53a5-1d78-4f32-bc5a-0e7465bd8f41
status: test
description: Detects the execution of "gpg.exe" from uncommon location. Often used
  by ransomware and loaders to decrypt/encrypt data.
references:
- https://www.trendmicro.com/vinfo/vn/threat-encyclopedia/malware/ransom.bat.zarlock.a
- https://securelist.com/locked-out/68960/
- https://github.com/redcanaryco/atomic-red-team/blob/c4097dc7ed14d7f7d08c89d148c4307097e8c294/atomics/T1486/T1486.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-06
modified: 2023-11-10
tags:
- attack.impact
- attack.t1486
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  - OriginalFileName: 'gpg.exe'
  - Description: 'GnuPG’s OpenPGP tool'
  filter_main_legit_location:
    Image|contains:
    - ':\Program Files (x86)\GNU\GnuPG\bin\'
    - ':\Program Files (x86)\GnuPG VS-Desktop\'
    - ':\Program Files (x86)\GnuPG\bin\'
    - ':\Program Files (x86)\Gpg4win\bin\'
  condition: selection and not 1 of filter_main_*
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `gpg.exe`, a tool frequently associated with encrypting and decrypting data, particularly when invoked from locations that deviate from its standard installation paths. The rule aims to uncover potential misuse of this legitimate application, which could indicate malicious activity such as ransomware operations or unauthorized data exfiltration by adversaries. Attackers leveraging `gpg.exe` might aim to encrypt files on compromised systems as part of a ransomware attack or utilize it to handle sensitive data covertly.

  The relevant MITRE ATT&CK techniques include **Data Encrypted for Impact (T1486)**, which directly relates to the usage of `gpg.exe` for data encryption purposes by malicious actors. The likely techniques employed for these objectives align with operational behaviors typical in ransomware attacks or during the exfiltration of sensitive information. The primary data sources for this detection include process creation logs on Windows, which provide insights into the execution context, file paths, and the legitimacy of the invoked binaries.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for instances of `gpg.exe` or `gpg2.exe` execution, focusing especially on paths that do not align with known legitimate installations. Pay close attention to execution timestamps and source processes.
  - **Analyze File System Changes:** Investigate any file system changes or alterations in sensitive directories that correlate with the times `gpg.exe` was executed. Look for newly encrypted files or changes in file extensions.
  - **Correlate with Network Activity:** Look at outgoing network connections or abnormal data transfers that may indicate exfiltration attempts. Understanding the context of what files were processed can help validate the legitimacy of `gpg.exe` usage.
  - **Check for Unusual Parent Processes:** Identify the parent processes of the executed `gpg.exe` instances to understand if they were initiated by higher-risk processes or during suspicious system activity.

  ### Prioritization
  Given that the misuse of encryption tools like `gpg.exe` could signify imminent data loss or exfiltration, this alert should be prioritized as medium severity in an enterprise environment. The possibility of ransomware deployment or sensitive data breaches presents significant operational and reputation risks.

  ### Blind Spots and Assumptions
  There are potential gaps in detecting the use of `gpg.exe` if adversaries employ alternative methods of execution, such as running it from legitimate paths or using process injection techniques. The detection logic assumes that `gpg.exe` will not typically be executed from uncommon or suspicious paths, which may not cover all attack vectors. Additionally, adequate process creation logging is required for this detection to function effectively, and any misconfigurations or limitations in logging could lead to missed detection opportunities.

