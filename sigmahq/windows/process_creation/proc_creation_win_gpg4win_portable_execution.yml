logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - '\gpg.exe'
    - '\gpg2.exe'
  - OriginalFileName: 'gpg.exe'
  - Description: 'GnuPG’s OpenPGP tool'
  filter_main_legit_location:
    Image|contains:
    - ':\Program Files (x86)\GNU\GnuPG\bin\'
    - ':\Program Files (x86)\GnuPG VS-Desktop\'
    - ':\Program Files (x86)\GnuPG\bin\'
    - ':\Program Files (x86)\Gpg4win\bin\'
  condition: selection and not 1 of filter_main_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `gpg.exe` or `gpg2.exe` from locations that are not typical for legitimate installations. Such behavior is likely indicative of malicious activity, specifically, the usage of GnuPG as a tool for encrypting or decrypting data by adversaries—often in the context of ransomware or data exfiltration efforts. The relevant MITRE ATT&CK tactic is "Impact" (TA0040) and the technique is "Data Encrypted for Impact" (T1486).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, which capture the execution of processes. If this behavior is malicious, it can lead to data loss, service disruption, or serious breaches of confidentiality. However, this detection does NOT confirm that the execution is definitively malicious; further investigation is required to determine intent and context.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 to gather specific details about the process creation, including the command line arguments, parent process, and associated user account. Malicious executions may have unusual parent processes or argument patterns not typically associated with `gpg.exe`.

  - **Identify execution location:** Determine the file path of the executed `gpg.exe` or `gpg2.exe`. Legitimate installations will usually be found in `C:\Program Files (x86)\GNU\GnuPG\bin\` or similar directories. Executions from unexpected locations (e.g., temporary files or user profile paths) are suspicious.

  - **Analyze command line arguments:** Evaluate the command line used to execute `gpg.exe`. Look for indicators such as arguments that appear to be part of a data encryption routine or that specify input/output files that are anomalous or sensitive in nature.

  - **Check user activity context:** Identify the account that executed the process and validate whether this user typically uses GnuPG. Legitimate usage may be confined to specific users or roles, while anomalous usage patterns may suggest unauthorized access.

  - **Correlation with known threats:** Cross-reference the user and file path details against threat intelligence feeds. High-confidence malicious indicators would include known compromised accounts operating `gpg.exe` from unusual directories.

  - **Examine the presence of encrypted files:** Investigate for accompanying artifacts or files in the system that have been recently encrypted or appear suspiciously missing. Use file modification or creation dates and check for any unusual file extensions (e.g., `.encrypted`, `.lock`).

  ### Prioritization

  The alert is of medium severity due to the potential impact on critical data if the activity is confirmed as malicious. Given that GnuPG can be weaponized for ransomware and data tampering, the probability of malicious abuse is significant, especially in environments where sensitive information is stored.

  ### Blind Spots and Assumptions

  Evasion techniques, such as renaming malicious `gpg.exe` or using alternate paths, could limit detection effectiveness. Reliable detection requires consistent logging of process creation events, so ensure Sysmon and Windows Event Audit policies are correctly configured. Legitimate activity may involve developers or security operations using GnuPG for encryption; thus, prior approval and monitoring of these users are advisable. Companion detections from the MITRE ATT&CK framework on "Credential Dumping" (T1003) could strengthen overall coverage against related tactics.

