title: Windows Defender Disabled Via SystemSettingsAdminFlows.EXE
id: da92713f-ca2d-4fab-8320-098013d3f43a
status: experimental
description: |
  Detects the usage of SystemSettingsAdminFlows.exe to disable Windows Defender.
  SystemSettingsAdminFlows.exe is a legitimate Windows component used for administrative configuration tasks.
  However, attackers may abuse it to disable Windows Defender as part of their attack chain, especially in the context of ransomware or other malware campaigns.
references:
- https://thedfirreport.com/2026/02/23/apache-activemq-exploit-leads-to-lockbit-ransomware/
- https://www.huntress.com/blog/lolbin-to-inc-ransomware
tags:
- attack.defense-impairment
- attack.t1685
author: Chirag Damani (KPMG India), Swachchhanda Shrawan Poudel (Nextron 
  Systems)
date: 2026-07-01
logsource:
  category: process_creation
  product: windows
detection:
  selection_ssaf_img:
  - Image|endswith: '\SystemSettingsAdminFlows.exe'
  - OriginalFileName: 'SystemSettingsAdminFlows.EXE'
  selection_ssaf_cli:
    CommandLine|contains: 'defender'
  selection_cli_enable_opt:
    CommandLine|contains:
    - 'RTP '
    - 'RealTimeProtection '
    - 'DisableEnhancedNotifications '
  selection_cli_enable_value:
    CommandLine|contains: '1'
  selection_cli_disable_opt:
    CommandLine|contains:
    - 'SubmitSamplesConsent '
    - 'SpyNetReporting '
    - 'DisableCDPUserAuthPolicy '
  selection_cli_disable_value:
    CommandLine|contains: '0'
    # In Enterprise environments, if defender was disabled via GUI, it would be expected to see the following parent-child process relationship:
    # Thus, uncomment the below filter to exclude such cases because of high false positives:
    # filter_main_gui_options:
    #     ParentImage|endswith:
    #         - '\SystemSettings.exe'
    #         - '\Explorer.exe'
  condition: all of selection_ssaf_* and (all of selection_cli_enable_* or all 
    of selection_cli_disable_*)
falsepositives:
- Legitimate turn off of Windows Defender by the technical users or 
  administrators for troubleshooting or other purposes.
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_lolbin_systemsettingsadminflows_defender_disable/info.yml
note: |
  ### Technical Context

  This rule detects attempts to disable Windows Defender using the legitimate but potentially misused `SystemSettingsAdminFlows.exe`. Attackers often aim to disable security measures like Windows Defender to facilitate malicious activities such as ransomware deployment. The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the technique **Indicator Blocking** (T1685). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing process creation details and command-line arguments. If successful, this action significantly increases the risk surface, allowing malware to operate undetected. However, this detection alone does not confirm malicious intent; it requires further investigation to validate the context of the action.

  ### Investigation Steps

  - **Check the process initiation: ** Review Security Event ID 4688 or Sysmon Event ID 1 for `SystemSettingsAdminFlows.exe` with the command line containing the terms 'defender', 'RTP', or 'RealTimeProtection'. Legitimate usage typically involves administrative troubleshooting and should originate from trusted source processes like `SystemSettings.exe` or `Explorer.exe`.

  - **Examine command line arguments:** Identify the use of parameters such as `DisableEnhancedNotifications` and `SubmitSamplesConsent` with values (e.g., `1` for disabling) in the command line. Malicious configurations will likely include combinations aimed at disabling core protection settings.

  - **Correlate parent process:** Look at the parent process of `SystemSettingsAdminFlows.exe`. A parent process not typically associated with user-initiated administrative tasks (like malware executables or unusual scripts) may indicate malicious intent.

  - **Assess user and system role:** Verify the account under which `SystemSettingsAdminFlows.exe` is executed. Low-privileged accounts executing this process could signify potential misuse, especially if it does not correspond with IT administrative tasks.

  - **Validate log completeness:** Ensure that necessary logging and telemetry are enabled for capturing all relevant actions. Missing logs can indicate incomplete visibility, allowing successful evasion by attackers.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact of disabling a critical security feature on enterprise systems. The likelihood of malicious abuse is significant, especially in environments with increased ransomware activity. Attackers frequently leverage such techniques to disable defenses prior to executing their attacks.

  ### Blind Spots and Assumptions

  The detection might be circumvented by variations in the execution method (e.g., using PowerShell or scripting to disable Windows Defender), which may not always generate logs. Reliable detection requires comprehensive logging configurations to capture all process creation events accurately. Legitimate administrative activities may trigger the alert if users purposely disable Windows Defender for valid reasons, such as testing. Companion detections addressing PowerShell command usage or monitoring logs for disabling security settings can strengthen overall coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
