note: |
  ### Technical Context

  This Sigma rule detects the execution of the `ComputerDefaults.exe` process with high security/privilege levels (such as System or High) when launched from a parent process in system directories. This behavior is indicative of a UAC (User Account Control) bypass attempt, often employed by attackers aiming to escalate privileges and execute malicious code with elevated rights. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically technique "Bypass User Account Control" (T1548.002).

  The primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which track the execution of processes. If this behavior is confirmed to be malicious, it can lead to systems being compromised, allowing attackers to perform a range of actions such as installing malware, exfiltration of data, or further lateral movement. However, this detection does NOT confirm actual compromise or malicious intent by itself; further investigation is required to assess context and intent.

  ### Investigation Steps

  - **Examine process creation logs**: Review Windows Event ID 4688 or Sysmon Event ID 1 for entries related to `C:\Windows\System32\ComputerDefaults.exe`. Check the `IntegrityLevel` field for values indicating elevated privileges (e.g., High, System).

  - **Identify parent process**: Investigate the `ParentImage` field in the process creation logs. Legitimate processes in trusted directories (like `C:\Windows\System32`) should be expected; unusual parent processes may be indicative of malicious activity.

  - **Check for related processes**: Look for other associated processes. Analyze if any subsequent processes fork from `ComputerDefaults.exe`, focusing on their Execution Paths and `IntegrityLevel` levels (preferably not elevated).

  - **Validate asset criticality**: Assess the system where `ComputerDefaults.exe` was executed. High-value assets or critical servers (e.g., domain controllers, financial systems) warrant higher urgency in investigation.

  - **Cross-reference with threat intel**: Search for known UAC bypass tools linked to `ComputerDefaults.exe`, like UACMe. Check for the presence of related indicators of compromise (IOCs) in threat intelligence feeds or internal repositories.

  - **Document legitimate use cases**: Review any previous instances (if applicable) where `ComputerDefaults.exe` has been executed legitimately for system updates or configuration purposes, indicating controlled use rather than malicious intent.

  ### Prioritization

  Given the potentially high-impact nature of privilege escalation through UAC bypass exploits, the alert is set to high severity. The likelihood of abuse is significant since UAC bypass techniques are widely weaponized in various attack vectors, making swift remediation critical.

  ### Blind Spots and Assumptions

  This detection may miss attempts that utilize custom UAC bypass methods or tools not triggering this specific behavior. Reliable detection requires that logging of process creations is enabled across affected systems. Legitimate administrative tasks that may trigger this alert include maintenance scripts or software updates executed under elevated privileges. A related detection to consider is tracking unauthorized administrative access through Account Management logs (e.g., Event ID 4720 for user account creation) to bolster coverage around privilege escalation attempts.

