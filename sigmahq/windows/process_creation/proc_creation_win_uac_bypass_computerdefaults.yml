note: |
  ### Technical Context

  This Sigma rule detects the execution of `ComputerDefaults.exe` at high integrity levels, a common behavior associated with UAC (User Account Control) bypass techniques, particularly using tools like UACMe. The likely attacker objective is to escalate privileges on a Windows system by circumventing UAC protections. This activity falls under the MITRE ATT&CK framework, specifically the technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control).

  The primary telemetry sources include Windows Process Creation events (Security Event ID 4688 and Sysmon Event ID 1) and log artifacts such as the command line arguments of the executed process. If the detection is confirmed malicious, it may lead to unauthorized elevation of privileges, posing a significant security risk. However, this detection does NOT confirm active malicious intent on its own, as benign applications could theoretically invoke `ComputerDefaults.exe` under similar conditions.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 logs for entries related to `C:\Windows\System32\ComputerDefaults.exe`. Look for high integrity level indicators (S-1-16-16384 or S-1-16-12288). Legitimate usage typically involves processes launched by trusted system components.

  - **Analyze Parent Process Context:** Investigate the `ParentImage` field in the process creation log. If the parent process is not from a system directory (e.g., not under `C:\Windows\System32` or `C:\Program Files`), this could indicate malicious activity.

  - **Examine Command Line Arguments:** Access Sysmon Event ID 1 logs to check command line arguments used when launching `ComputerDefaults.exe`. Be on the lookout for unusual or flags that are not part of normal operational use cases.

  - **Validate Integrity Levels:** Confirm the integrity level of the process using `Get-Process` or similar tools to ensure it runs at `System` or `High`. High-integrity levels could indicate privilege escalation attempts; normal activities generally operate under lower integrity levels.

  - **Investigate for Exfiltration Activities:** If any artifacts (files or registry modifications) were created by `ComputerDefaults.exe`, confirm they align with legitimate operations. Unusual file creations or modifications could indicate malicious behavior.

  ### Prioritization

  This alert should be treated with high priority due to the potential high impact on system security and the likelihood of privilege escalation abuse. The specific behavior detected is weaponized in various attack scenarios aimed at bypassing protections that are built to safeguard system integrity.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative tasks that require elevated privileges. Evasion techniques could include name spoofing or legitimate applications improperly configured to launch `ComputerDefaults.exe` at high integrity. Reliable detection requires properly configured Windows security logging, especially for process creation and integrity levels. Companion detections monitoring access control events, such as Windows Event ID 4672 for special privileges assigned at logon, can enhance monitoring coverage.

