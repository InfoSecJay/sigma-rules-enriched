title: Indirect Command Execution From Script File Via Bash.EXE
id: 2d22a514-e024-4428-9dba-41505bd63a5b
related:
- id: 5edc2273-c26f-406c-83f3-f4d948e740dd
  type: similar
status: test
description: |
  Detects execution of Microsoft bash launcher without any flags to execute the content of a bash script directly.
  This can be used to potentially bypass defenses and execute Linux or Windows-based binaries directly via bash.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Bash/
- https://linux.die.net/man/1/bash
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-15
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - ':\Windows\System32\bash.exe'
    - ':\Windows\SysWOW64\bash.exe'
  - OriginalFileName: 'Bash.exe'
  filter_main_cli_flag:
    CommandLine|contains:
            # Note: we're not interested in flags being passed first
    - 'bash.exe -'
    - 'bash -'
  filter_main_no_cli:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_no_flag:
    CommandLine:
    - 'bash.exe'
    - 'bash'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of the Microsoft Bash launcher (`bash.exe`) without any accompanying command-line flags, which indicates that a script file might be executed directly. Attackers can exploit this behavior to bypass security controls and execute payloads derived from Linux or Windows binaries within a potentially benign-looking script. The capability to invoke `bash.exe` without flags can also facilitate lateral movement or execution of malicious code within environments that permit such commands.

  The relevant MITRE ATT&CK tactics for this behavior include **Defense Evasion (T1202)**, as the absence of flags may evade security tooling that monitors standard command invocation patterns. This action may also correlate with the broader tactic of **Execution** as it reflects the use of a legitimate tool (Bash) to perform unauthorized activities.

  The primary data sources that will provide visibility into this activity include **process creation events** from the Windows operating system, which capture the invocation of processes and their respective command lines.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and examine process creation logs from the affected hosts to identify instances of `bash.exe` execution without flags. Pay attention to the command line details associated with this activity.

  - **Correlate with Known Baselines:** Compare the identified occurrences against established baselines for normal operational activity. This will help to separate potentially malicious executions from benign scripts utilized for standard processes.

  - **Analyze Script Content:** If a suspicious execution is noted, review the script file that was executed through `bash.exe`. This may provide insights into the intent of the command, revealing whether the script contains known malicious patterns or behaviors.

  - **Inspect User Context:** Investigate the user account context under which the `bash.exe` was executed. This analysis can uncover anomalies or unauthorized use of privileges, particularly if the script is run under a user profile that normally does not use Bash.

  ### Prioritization
  This alert should be prioritized as medium severity due to its potential to indicate attempts at bypassing security measures and executing unauthorized scripts. The likelihood of exploitation is notable in environments where both Windows and Linux interactions are prevalent.

  ### Blind Spots and Assumptions
  There are limitations in detecting all potential misuse scenarios as the detection relies primarily on the absence of flags with `bash.exe`. Assumptions include the dependency on specific configurations that ensure process creation logs are actively collected and retained. If logs are not configured or if command-line details are not fully captured (e.g., due to logging limitations), this detection may not function as intended.

