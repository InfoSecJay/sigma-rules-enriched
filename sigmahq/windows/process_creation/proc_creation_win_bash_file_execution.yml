description: |
  Detects execution of Microsoft bash launcher without any flags to execute the content of a bash script directly.
  This can be used to potentially bypass defenses and execute Linux or Windows-based binaries directly via bash.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Bash/
- https://linux.die.net/man/1/bash
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-15
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - ':\Windows\System32\bash.exe'
    - ':\Windows\SysWOW64\bash.exe'
  - OriginalFileName: 'Bash.exe'
  filter_main_cli_flag:
    CommandLine|contains:
            # Note: we're not interested in flags being passed first
    - 'bash.exe -'
    - 'bash -'
  filter_main_no_cli:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_no_flag:
    CommandLine:
    - 'bash.exe'
    - 'bash'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Microsoft Bash launcher (bash.exe) without any command line flags. This behavior may indicate indirect command execution of a script file, which can facilitate the execution of scripts or binaries in a potentially unauthorized manner. The likely attacker objective is to bypass security controls by executing unwanted commands or scripts on the system.

  The relevant MITRE ATT&CK tactic is "Execution," with the technique being "Command-Line Interface" (T1202). The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1, which log process creation events. If malicious, this behavior could lead to unauthorized code execution, system compromise, and lateral movement. Importantly, while this detection raises an alert, it does not confirm malicious activity on its own, as legitimate administrative use of bash may occur in operational environments.

  ### Investigation Steps

  - **Review Process Creation Logs**: Examine Security Event ID 4688 and Sysmon Event ID 1 for instances of bash.exe being executed. Ensure to check the `CommandLine` field for the absence of flags or commands that suggest legitimate use.

  - **Check for Script Files Execution**: Look for script files that might have been executed in a proximity timeline with the bash.exe execution. Valid command examples include calling a known named script, such as `script.sh`.

  - **Identify High-Confidence Malicious Indicators**: Look for unexpected scripts or binaries that were executed immediately after bash.exe execution, particularly if they are sourced from unusual directories or user profiles.

  - **Assess Legitimate Use**: Cross-reference bash.exe usage against documented administrative tasks requiring bash. Confirm if these instances match operational procedures, such as system administration tasks or authorized updates, ensuring the `CommandLine` field has appropriate flags or commands.

  - **Monitor for Compromise Patterns**: Investigate if there are any other indicators of compromise on the system, such as unusual network activity or privilege escalation events related to the same user account under which bash.exe was executed.

  - **Check Environment Variability**: Validate whether bash.exe execution is common in your environment. If the asset is non-standard for running bash (e.g., a Windows server without development tools), it suggests higher risk.

  ### Prioritization

  This alert indicates moderate severity due to the potential for significant impact if an attacker exploits the system through indirect command execution. The likelihood of malicious abuse increases if bash.exe is executed without command line parameters, which is generally not a common administrative action and can lead to exploitation of script execution vulnerabilities.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging of command line arguments is not properly configured on endpoints. Legitimate uses can include system maintenance or configuration tasks executed by authorized personnel. Additionally, evasion techniques may involve using obfuscated command lines or renaming scripts. A related detection may include monitoring for suspicious script execution directly from PowerShell (T1086), which can further enhance coverage.

