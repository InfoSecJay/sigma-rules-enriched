title: Indirect Command Execution From Script File Via Bash.EXE
id: 2d22a514-e024-4428-9dba-41505bd63a5b
related:
- id: 5edc2273-c26f-406c-83f3-f4d948e740dd
  type: similar
status: test
description: |
  Detects execution of Microsoft bash launcher without any flags to execute the content of a bash script directly.
  This can be used to potentially bypass defenses and execute Linux or Windows-based binaries directly via bash.
references:
- https://lolbas-project.github.io/lolbas/Binaries/Bash/
- https://linux.die.net/man/1/bash
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-15
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - ':\Windows\System32\bash.exe'
    - ':\Windows\SysWOW64\bash.exe'
  - OriginalFileName: 'Bash.exe'
  filter_main_cli_flag:
    CommandLine|contains:
            # Note: we're not interested in flags being passed first
    - 'bash.exe -'
    - 'bash -'
  filter_main_no_cli:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_no_flag:
    CommandLine:
    - 'bash.exe'
    - 'bash'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances where the Microsoft Bash launcher (`bash.exe`) is executed without any command-line flags or arguments. This behavior may suggest an attempt by an attacker to indirectly execute a script leveraging Bash, allowing for potential evasion of security controls and execution of malicious payloads on a targeted system. The likely attacker objective is to execute arbitrary commands or binaries that could lead to command and control activities or lateral movement within the network.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: TA0011), specifically the technique **Command-Line Interface** (ID: T1202). Primary telemetry sources include Windows process creation logs (Security Event ID 4688), capturing command line and image path details. If malicious, the security impact could range from data exfiltration to the installation of backdoors. However, this detection does NOT confirm that the execution is inherently malicious or that a successful compromise occurred; benign uses of Bash for legitimate purposes may trigger the alert.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 logs in the Windows Event Viewer. Focus on `Image` paths ending with `bash.exe` and note `CommandLine` values. Evaluate the absence of command-line arguments to confirm suspicious behavior.

  - **Identify command-line indicators:** Capture cases where `CommandLine` is exactly `bash.exe` or `bash`, and cross-reference with recent changes in scripts or policy that may justify legitimate baseless directly executed instances.

  - **Determine host role:** Identify the asset that triggered the alert. If the host is critical (e.g., a server running web applications), prioritize the investigation. Understand its intended use of Bash for legitimacy.

  - **Analyze recent execution patterns:** Inspect execution times and user accounts associated with invoked Bash processes. Look for patterns consistent with known legitimate activity, such as scheduled tasks or authorized maintenance scripts that may use Bash without arguments.

  - **Validate any script execution:** Check if files were executed or created immediately following the bash command in process logs. Look for artifacts like temporary files in the `%TEMP%` directory or script modifications on the filesystem.

  ### Prioritization

  This alert ranks as medium severity due to the potential misuse of a standard tool (Bash) to bypass defenses and execute commands. The impact is particularly concerning if the affected system plays a critical role in the enterprise infrastructure, and the likelihood of malicious abuse is reasonable given known adversary techniques.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of alternative tools or evasion techniques that do not employ `bash.exe`, such as direct native executables or scripting through PowerShell. Logs from Windows process creation must be configured properly and maintained to ensure visibility. Legitimate activities, such as manual execution of administrative scripts or development activities, might trigger alerts. Companion detections reflecting the use of scheduled tasks or common post-exploitation frameworks (like Cobalt Strike’s `bash` usage) could provide additional context and enhance coverage.

