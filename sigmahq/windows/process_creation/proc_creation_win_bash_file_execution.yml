logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - ':\Windows\System32\bash.exe'
    - ':\Windows\SysWOW64\bash.exe'
  - OriginalFileName: 'Bash.exe'
  filter_main_cli_flag:
    CommandLine|contains:
            # Note: we're not interested in flags being passed first
    - 'bash.exe -'
    - 'bash -'
  filter_main_no_cli:
    CommandLine:
  filter_main_empty:
    CommandLine: ''
  filter_main_no_flag:
    CommandLine:
    - 'bash.exe'
    - 'bash'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the `bash.exe` Windows launcher without any command-line flags or arguments, which may indicate an attempt to execute scripts indirectly. An attacker might leverage this behavior to bypass security measures, potentially executing malicious bash scripts or system binaries in an unmonitored manner. The relevant MITRE ATT&CK tactic is Defense Evasion (T1202). Primary telemetry sources include process creation events, specifically Windows Event ID 4688 or Sysmon Event ID 1, which capture details of process executions. If malicious, this behavior could lead to unauthorized access or data exfiltration. However, this detection does NOT confirm that an actual attack occurred; it only flags the execution of `bash.exe` in a suspicious manner and requires further investigation.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Event ID 4688 or Sysmon Event ID 1 related to `bash.exe` execution on critical systems. Look for any abnormal parent process relationships, as legitimate usage usually stems from trusted applications.

  - **Examine command line arguments:** Investigate the `CommandLine` field in the event log. A benign instance typically shows user-specific flags or arguments following `bash.exe`, while a suspicious entry will only show `bash.exe` with no flags, indicating potential circumvention of security measures.

  - **Validate script file presence:** Cross-reference any detected execution against known script locations (e.g., `C:\Users\<username>\Documents\*.sh`) to confirm if an actual script file is linked and being executed. Absence of such files may indicate a malicious intent.

  - **Identify parent process and user context:** Determine the parent process examining the `ParentProcessId` within the event logs. Legitimate executions often originate from user scripts or console sessions, while unexpected origins (like service accounts or system processes) indicate potential compromise.

  - **Check for known binaries:** If encountering the execution of `bash.exe`, investigate for other known malicious binaries or scripts associated with this execution. Use hash comparisons against threat intelligence feeds to identify high-confidence malicious indicators.

  - **Document system role:** Note if the alert occurred on a server or workstation role. Systems like web servers or development environments may have legitimate `bash.exe` usage, guiding further contextual analysis.

  ---

  ### Prioritization

  This alert should be treated with medium priority as the detection indicates potentially unsafe behavior executed on systems that could be leveraged for lateral movements or data breaches. The likelihood of misuse exists, especially in environments where `bash.exe` is not typically employed, and such patterns may align with known attack vectors.

  ---

  ### Blind Spots and Assumptions

  This rule may not capture every invocation of `bash.exe`, especially if log sources are misconfigured or if processes are hidden through various evasion tactics like creating processes with alternative methods. Legitimate automated scripts or workflows can also trigger this alert inadvertently. A related detection to consider is monitoring for script execution specific to environments configured to allow `bash.exe`, enhancing overall visibility into Unix-like command execution behavior.

