note: |
  ### Technical Context

  This detection rule monitors for tampering of AMSI (Anti-Malware Scan Interface) related registry values using command-line tools such as `reg.exe` and PowerShell. The behavior indicates that an attacker is attempting to disable or alter AMSI to evade detection of malicious scripts and executed code. This activity fits within the MITRE ATT&CK framework under the defense evasion tactic, specifically techniques T1562.001 (Disable or Modify Tools) and T1562.006 (Disable Security Tools).

  The primary telemetry sources for this detection are process creation logs that capture command-line arguments from Windows, specifically Events IDs 4688 and 4689. If malicious, the alteration of AMSI settings can allow threat actors to execute scripts undetected, thus significantly increasing the risk to the environment. It's important to note that this detection does NOT confirm that malicious activity has occurred, as legitimate administrative actions might also modify AMSI settings.

  ### Investigation Steps

  - **Review triggered alerts for context**: Check the timestamp and user context associated with the alert in the SIEM. Look for Event ID 4688 detailing the process creation, including the specific command line used. Identify if the user context is known and expected.

  - **Validate the legitimacy of AMSI modifications**: Look for typical administrative actions around the same time (e.g., Event IDs 4624 for logon events) that could explain why legitimate users might alter AMSI settings. Compare user activity against organizational policies on registry modifications.

  - **Examine command-line arguments**: Focus on command-line arguments associated with `reg.exe` or PowerShell, specifically those containing `\Software\Microsoft\Windows Script\Settings` and `AmsiEnable`. High confidence in malicious intent arises from the presence of arguments like `add` or commands such as `Set-ItemProperty` or `New-ItemProperty` within the command line.

  - **Cross-reference with EDR alerts**: Look for additional alerts related to PowerShell execution (Event ID 4103 for script block logging) that coincide with this registry modification. This could strengthen evidence of malicious activity.

  - **Check for known evasion techniques**: Review for any known tools or scripts used for evasion operations (e.g., common malware artifacts) that may have been executed around the same time as the registry modification.

  ### Prioritization

  This alert should be treated with high priority as it involves registry tampering that could disable an important layer of security. The likelihood of malicious abuse is significant since tampering with AMSI is a common tactic used by adversaries attempting to evade detection mechanisms within the environment. The context of the affected system, especially if it includes critical assets, further underscores the importance of an immediate and thorough investigation.

  ### Blind Spots and Assumptions

  The detection mechanism may miss modifications made by privileged administrative accounts with a valid purpose, like legitimate maintenance. Log sources must include detailed process creation logs and PowerShell transcription settings for reliable capture of the detected behavior. Activities such as legitimate software deployment or updates could trigger similar alerts, complicating investigations. A related detection rule for increased coverage would be monitoring the use of `powershell.exe` for suspicious command-line activities, especially those executing scripts or downloading external content.

