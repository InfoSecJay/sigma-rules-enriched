note: |
  ### Technical Context

  This detection identifies modifications to AMSI (Anti-Malware Scan Interface) related registry values using command line tools, potentially indicating an attempt to disable AMSI to prevent the detection of malicious scripts. The likely objective for an attacker executing this behavior is to execute malware or scripts without triggering security mechanisms that rely on AMSI to scan and block threats. This behavior falls under the MITRE ATT&CK tactic of **Defense Evasion (T1562)** and the specific technique **AMSI Bypass (T1562.001)**. The primary telemetry sources include process creation logs, specifically looking for entries from `reg.exe` or `PowerShell.exe`. If malicious, this action could allow an attacker to run undetected scripts, greatly impacting system security. However, this detection does NOT confirm that a successful compromise has occurred, as benign registry modifications can also trigger this alert.

  ### Investigation Steps

  - **Inspect command line arguments used:** Review process creation logs (Windows Security Event ID 4688 or Sysmon Event ID 1) for command lines containing 'Set-ItemProperty' or 'New-ItemProperty' alongside `AmsiEnable`. Look for unusual entries that deviate from regular administrative tasks.

  - **Identify user context:** Check the user account associated with the process invoking these command line arguments. Legitimate activity usually comes from administrative users during system maintenance, whereas suspicious activities are often initiated by non-privileged users or service accounts.

  - **Analyze registry changes:** Query the Windows Registry to verify changes under `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows Script\Settings\`. Check values and types; unexpected changes could indicate malicious intent.

  - **Correlate with other alerts:** Cross-reference with alerts for other suspicious behaviors occurring around the same time (for example, PowerShell script executions or unusual process creations) to establish a broader context of the incident.

  - **Monitor for additional artifacts:** Validate presence of potential file creation or modification artifacts (e.g., malicious script files invoked by the `powershell.exe` process). Review file paths and timestamps for anomalies.

  ### Prioritization

  This alert has high severity as it directly indicates attempts to evade built-in security mechanisms on potentially critical systems. Given the common enterprise usage of AMSI, malicious actors regularly exploit these mechanisms, making the likelihood of abuse significant.

  ### Blind Spots and Assumptions

  This detection may miss cases where legitimate software or admin tools modify AMSI settings for valid purposes. Additionally, reliance on correct logging configuration is crucial for activity visibility; ensuring Windows registry change audits are enabled is essential. Legitimate PowerShell operations might also trigger this alert, especially in environments with frequent administrative automation. Companion detections, such as alerts for unusual PowerShell script behavior or known AMSI evasion techniques, can provide stronger validation and context for investigations.

