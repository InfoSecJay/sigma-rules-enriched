note: |
  ### Technical Context
  This detection rule identifies the execution of files with suspicious double extensions, such as `.doc.lnk` or `.doc.js`, which can indicate an attempt to execute malicious scripts disguised as harmless documents. Attackers often use double extensions to bypass security controls and trick users into executing harmful payloads, with the primary objectives being data theft, system compromise, or lateral movement within the network.

  The associated MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and specifically the technique **Masquerading** (T1036.007). By employing file names that appear legitimate, attackers aim to deceive users and security systems, increasing the likelihood of successful exploitation. The primary data sources for this detection include **process creation events**, which capture the details around the execution of processes on Windows systems, providing insights into potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine events that include suspicious command lines and parent image paths matching the specified double extensions.
  - **Analyze Parent Process Details**: Identify the parent processes of the suspicious executables to determine their legitimacy and origin, verifying if they are known system applications.
  - **Correlate with User Behavior**: Assess the user accounts that executed these processes, checking for unusual patterns or behavior that could indicate compromised accounts.
  - **Conduct Threat Intelligence Lookup**: Utilize threat intelligence databases to check if the detected file names or hashes are linked to known threats or malware incidents.

  ### Prioritization
  The alert's severity is considered high due to the potential impact of successful execution of these file types in an enterprise environment, where they can lead to data breaches or further lateral movement by the attacker. The likelihood of occurrence is also high, given the common use of social engineering tactics to distribute these types of files.

  ### Blind Spots and Assumptions
  This detection rule may not cover all malicious file execution scenarios, particularly those that use single extensions or legitimate filenames not captured in the current logic. The detection relies on the assumption that process creation events are logged appropriately; thus, any configurations or logging gaps may prevent accurate detection. Ensuring comprehensive process logging is critical for this alert to perform effectively.

