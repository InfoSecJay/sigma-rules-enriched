note: |
  ### Technical Context

  This Sigma rule detects the execution of files with suspicious double extensions, such as `.doc.lnk` or `.doc.js`, indicating potential malicious behavior typically associated with malware delivery or exploitation tactics. Attackers may use these file types to bypass security controls by masquerading harmful scripts as benign document files. This behavior aligns with the MITRE ATT&CK technique T1036.007 (Masquerading: Match Legitimate Name or Location).

  The primary telemetry source for this detection includes Windows process creation logs, specifically focusing on `ParentImage` and `ParentCommandLine`. If the detected behavior is malicious, it could lead to the execution of payloads, data exfiltration, or lateral movement within the environment. Importantly, this detection does NOT confirm that the executed file is malicious; it merely indicates that suspicious execution behavior occurred.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for any processes associated with suspicious double extensions (e.g., `.doc.lnk`, `.doc.js`). Malicious activity is indicated if the `ParentCommandLine` contains these extensions.

  - **Correlate with file hashes:** Use a service like VirusTotal to analyze the hash of the executed file. A positive detection or previous reports of a similar hash indicate heightened risk.

  - **Examine the command line context:** Investigate `ParentCommandLine` for encoded execution patterns (e.g., PowerShell, WMI) that indicate misuse of legitimate scripting tools, consolidating the flags associated with potential malicious execution.

  - **Determine legitimate use cases:** Identify expected or legitimate behaviors, such as commonly used templates opening from trusted locations (e.g., `C:\Users\<username>\Documents`). Document any benign usage to aid in prioritization.

  - **Identify related active sessions:** Check for other recent logins or background tasks tied to the user at risk, looking for unusual account activity, particularly against sensitive assets.

  - **Look for additional indicators of compromise:** Check recent Windows Event Logs (Event IDs 4104 for PowerShell logs or 4688) for follow-up activity immediately after the execution, which could suggest lateral movement or payload deployment.

  ### Prioritization

  This alert is categorized as high severity due to the potential impact of malware execution on critical systems and the high likelihood of abuse by threat actors employing social engineering tactics. Given that malicious double extension files are commonly weaponized, they require urgent attention.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate applications using similar naming conventions, which can lead to false positives. The rule relies on the collection of comprehensive process creation logs and may require tuning based on legitimate application behavior. Common legitimate triggers might include automated document processing tools. Companion detections such as monitoring for unusual PowerShell commands and scripts (MITRE T1059.001) can enhance overall visibility and threat detection capabilities.

