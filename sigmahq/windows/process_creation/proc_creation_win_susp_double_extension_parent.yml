note: |
  ### Technical Context

  This rule detects the execution of files with suspicious double extensions (e.g., `.doc.lnk` or `.xls.js`), which are common tactics employed by attackers to disguise malicious payloads as legitimate documents. The likely objective of an attacker using this method is to trick users into executing the file, thereby enabling malware installation or other malicious activities. The relevant MITRE ATT&CK tactics are **Defense Evasion** and **Masquerading** (T1036.007).

  Primary telemetry sources include Windows process creation logs (Event ID 4688 or Sysmon Event ID 1) that capture details about the parent process and any executed commands. If successful, such behavior can lead to compromised systems, unauthorized access, and data loss. This detection does NOT confirm that malicious activity is occurring by itself; further investigation is necessary to attribute malicious intent.

  ### Investigation Steps

  - **Examine the process tree:** Review Event ID 4688 logs to determine the parent-child process relationships. Suspicious parent processes that lead to double extension executions are often indicative of malicious intent.

  - **Investigate command line arguments:** Focus on the `ParentCommandLine` field of the Event ID 4688 logs. Look for command lines containing indicators such as `.doc.lnk` or `.js`. Malicious activity will typically feature unusual arguments or unexpected parent processes.

  - **Assess file properties:** Cross-reference the executed file paths against known safe file signatures. Verify file hashes and check against antivirus or sandbox analysis reports for any evidence of malicious behavior.

  - **Identify legitimate use cases:** Review the context in which similar extensions are typically used within your organization. Documented, authorized file types or instances should be noted as benign reference points.

  - **Check recent file changes:** Look for unusual file creation or modification times in conjunction with the parent process execution in event logs. Event logs related to file system changes (e.g., File System Auditing) could indicate previous malware installation or other suspicious activities.

  - **Correlate with other alerts:** Evaluate any related detections for the same asset, particularly alerts indicating command and control (C2) or lateral movement. Companion detections, such as unusual network connections from the same host, would strengthen the case for malicious behavior.

  ### Prioritization

  This alert holds high severity due to the potential risk posed by compromised systems that execute disguised malicious files. Double-extension files are a common method of delivery for malware, which suggests a heightened likelihood of exploitation. Such behavior is often weaponized by attackers targeting end-user systems.

  ### Blind Spots and Assumptions

  This detection might miss sophisticated evasion techniques such as file renaming or spoofing that an attacker might employ to bypass detection. Additionally, a lack of complete logging configurations could inhibit accurate detection, and legitimate usage of double extensions may occur from trusted applications. A related detection to consider is the correlation of execution logs with external network communication, which could indicate data exfiltration or C2 contact.

