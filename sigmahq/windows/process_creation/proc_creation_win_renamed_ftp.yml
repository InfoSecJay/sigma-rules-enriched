note: |
  ### Technical Context

  This rule detects the execution of a binary originally named "ftp.exe," which has been renamed to potentially bypass detection mechanisms. The behavior indicates a possible attempt to disguise malicious activities, such as data exfiltration or command-and-control connections. The likely attacker objective is to leverage the FTP protocol for unauthorized file transfer, often to exfiltrate sensitive data. This detection aligns with the MITRE ATT&CK tactics of Execution (T1059) and sometimes Stealth (T1202).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation. If malicious, the execution of a renamed "ftp.exe" could facilitate unauthorized data transfers or remote access to the system. Importantly, this detection does NOT confirm that the execution is malicious on its own; further corroborative evidence is needed.

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Security Event ID 4688 for the command line used during the execution of the renamed binary. Look for indicators such as unusual parent processes or parameters that do not commonly accompany FTP commands.

  - **Validate File Characteristics**: Identify the file path and hash of the executable in question. Use Sysmon Event ID 10 to correlate file creation with the execution. Verify if the hash matches known-good or known-malicious binaries.

  - **Assess Anomalous Network Activity**: Analyze network logs for unusual FTP traffic from the host. Check for connections to suspicious IP addresses on ports commonly associated with FTP (21, 22) using firewall or network flow logs.

  - **Review Legitimate Usage Patterns**: Examine the behavior of legitimate FTP use on the network, especially if the host is expected to contact FTP servers. Document the expected hosts and interactions to compare against known patterns.

  - **Corroborate with EDR Data**: Check endpoint detection and response (EDR) logs for any signs of lateral movement or connections back to a potential command-and-control server associated with this behavior.

  ### Prioritization

  This alert should be classified with medium severity due to the potential for data exfiltration and the method's plausibility for evasion. While the affected system's importance can vary, any system involved in FTP operations could be a target, increasing the likelihood of abuse. The behavior detected is relevant to known exploitation techniques, emphasizing the importance of immediate follow-up.

  ### Blind Spots and Assumptions

  Detection may be limited by systems that are not configured to log process creation or those lacking full logging capabilities. Attackers could evade this detection by renaming the executable to something less recognizable beyond "ftp.exe." Legitimate tools or scripts that rename FTP executables for automation could inadvertently trigger this alert. A related detection of concern would be abnormal outbound connection logs related to FTP usage, strengthening the coverage against potential exfiltration attempts.

