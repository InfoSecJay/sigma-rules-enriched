note: |
  ### Technical Context
  This rule is designed to detect the execution of a binary that has been renamed to "ftp.exe," a common tactic used by attackers to disguise malicious activity. By examining the Portable Executable (PE) metadata fields, such as the original file name, this detection aims to identify situations where legitimate processes may have been maliciously altered to obscure their true nature. Attackers typically leverage this technique to bypass security filters and monitor communication without raising immediate suspicion.

  The likely attack scenario involves an adversary executing a malicious payload disguised as a standard FTP client to exfiltrate data or communicate with a command and control server. Attackers may aim to blend their activities with normal network traffic, rendering the malicious execution less noticeable to security monitoring systems.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1059)**: Utilizing a legitimate or renamed executable to run arbitrary commands.
  - **Defense Evasion (T1202)**: Evading detection mechanisms by disguising malware as a known application.

  Primary data sources for this detection rule include:
  - **Process creation events**: Providing information on executed binaries and their associated metadata.
  - **Windows event logs**: Specifically, logs that track process execution and application installations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate any recent process creation events for instances where the original file name matches "ftp.exe" while the executable's path or filename differs at execution time.
  - **Correlate with Network Traffic**: Analyze outgoing network connections to identify suspicious activity or data transfers associated with the renamed executable, particularly looking for anomalous connections to unfamiliar IP addresses.
  - **Check for Additional Malicious Indicators**: Search for known indicators of compromise (IOCs) that could be related to a malicious implantation masquerading as "ftp.exe," including checksum or hash values of the suspicious binaries.
  - **Examine System Configuration**: Check for any recent changes in local security policies, firewall rules, or unauthorized installations that may suggest a breach attempt was made leveraging this tactic.

  ### Prioritization
  This alert should be treated as medium severity due to the potential for significant impact; attackers using this method may access sensitive information or establish persistent footholds within the network. The likelihood of encountering such tactics in a typical enterprise environment underscores the need for prompt investigation.

  ### Blind Spots and Assumptions
  This detection may miss variations of the attack where the binary is renamed to something other than "ftp.exe" or if the metadata has been altered to obscure its origin. The logic also assumes that process creation events are adequately logged and retained; without this data, detection will fail. Additionally, environments that do not monitor or log executable metadata may be vulnerable due to insufficient visibility in process executions.

