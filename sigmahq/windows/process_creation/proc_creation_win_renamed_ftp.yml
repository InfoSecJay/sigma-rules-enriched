note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of a binary that has been renamed to "ftp.exe," but does not match the expected original file name in the PE metadata. This behavior is often associated with attempts to disguise malicious activity, where an adversary may utilize a legitimate-looking binary to maintain persistence or exfiltration. The attacker objective is likely to establish a foothold in the environment without raising alerts associated with the original "ftp.exe" executable.

  The relevant MITRE ATT&CK tactics and techniques include **Execution (TA0040)** and **User Execution (T1203)**, as well as **Defense Evasion (TA0061)**, targeting methods to run commands undetected. Primary telemetry sources include Windows Security Event ID 4688 (process creation) and Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized data access, lateral movement, or data exfiltration. It is important to note that this detection does NOT confirm malicious intent on its own; further investigation is necessary to determine the context of the execution.

  ---

  ### Investigation Steps

  - **Review process creation details:** Examine Security Event ID 4688 and Sysmon Event ID 1 for the process creation event. Look for the `New Process Name` field to identify if the command line contains unusual flags or arguments that deviate from typical FTP behavior.

  - **Check parent process information:** Investigate the parent process ID to understand what initiated the "ftp.exe." Legitimate FTP operations typically originate from trusted applications or services, like file transfer applications. Assess the `ParentProcessName` field.

  - **Analyze process hash values:** Confirm the hash of the executable against known values for legitimate FTP binaries. If the hash does not match known good values, this can be a strong indicator of malicious activity. Investigate the `ImagePath` field to locate the executable.

  - **Investigate network activity:** Examine outbound connections initiated by the process. Use Windows Firewall logs (Event ID 5156) to track any unusual ports or destinations, especially if they indicate data exfiltration attempts.

  - **Cross-check with file creation logs:** If the FTP process is claiming to transfer files, validate logs for file creation events (Windows Event ID 4663) to ensure the files are legitimate and expected by the organization.

  - **Identify historical behavior:** Review historical logs around the time of the alert for any previous executions of the renamed process. Legitimate FTP usage often follows usual patterns; deviations from this should be flagged for further analysis.

  ---

  ### Prioritization

  This alert is of medium severity based on the potential impact of the affected system being compromised, particularly if it is a file server or sensitive system. The likelihood of adversaries using this technique for obfuscation is high, as renaming binaries is a common evasion tactic. Such behavior is often weaponized in targeted breaches.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist as advanced adversaries may utilize techniques to alter process metadata or execute benign commands inappropriately, leading to false positives. Required log sources include Sysmon for detailed process creation metadata, while lack of proper logging configurations may hinder reliable detection. Legitimate activities, such as traditional file transfer usage in the environment, may also trigger this alert. A related detection, such as monitoring for known malicious command-line usage (e.g., peculiar FTP commands), can strengthen coverage against this evasion technique.

