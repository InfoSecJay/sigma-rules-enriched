note: |
  ### Technical Context

  The rule detects suspicious activity involving the use of the `diantz.exe` utility to download and compress remote files into a CAB file on a local machine. This behavior suggests an attacker may be attempting to exfiltrate data or deliver a payload in a compressed format, potentially indicating preparation for a further attack or data theft. The relevant MITRE ATT&CK techniques are Command and Control (T1105) and potentially Data Obfuscation (T1005).

  The primary telemetry sources for this detection include process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments for processes initiated on endpoints. If this behavior is confirmed malicious, it can compromise sensitive data and contribute to a larger network breach. Importantly, this detection does NOT confirm that the files created are indeed malicious without additional context or corroborative evidence.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 entries with `Image` containing `diantz.exe`, `CommandLine` containing both `\\` and `.cab`. Legitimate uses may show valid file handling without remote paths.

  - **Analyze file creation events**: Look for file creation events (Windows Event ID 4663) on the local machine that correspond to the generated CAB files. Validate the content or size against known values for legitimate software.

  - **Investigate network connections**: Examine network logs for outbound connections made by the host, specifically connections to unusual external IPs or domains at the same time as the `diantz.exe` execution. Legitimate behavior usually involves common, well-known destinations.

  - **Correlate with antivirus logs**: Check endpoint protection logs for alerts related to detected malicious behavior associated with CAB files or `diantz.exe`, especially those that indicate the file was blocked or flagged.

  - **Look for recent suspicious changes**: Review system changes or installations made on the host around the time `diantz.exe` executed. Legitimate updates might link to known software updates or product installations.

  ### Prioritization

  This alert should be considered medium severity based on the potential impact on the affected system, particularly if it involves sensitive data. The likelihood of malicious abuse is moderate, as the behavior can closely mimic benign tasks but may also indicate exfiltration or misuse of toolsets. This specific behavior is also recognized in actual attack patterns in the wild.

  ### Blind Spots and Assumptions

  Detection is limited by varying legitimate uses of `diantz.exe`, leading to potential false positives. It requires proper logging configurations for process creation and file access to ensure visibility. Legitimate activities may include authorized use by IT personnel for copying files, thus necessitating careful assessment. A related detection could include monitoring for the use of PowerShell or other scripting methods that could facilitate similar file downloads or obfuscation behaviors.

