note: |
  ### Technical Context
  This detection rule identifies the behavior of downloading a remote file and compressing it into a CAB (Cabinet) file using the `diantz.exe` command-line tool on Windows systems. This behavior is typically associated with an attacker attempting to exfiltrate data or deploy malicious payloads in an organization. By compressing files into the CAB format, attackers can obfuscate contents and bypass certain security controls, leading to data theft or persistent malware deployment.

  The suspected threat scenario revolves around adversaries utilizing tools like `diantz.exe`, which can easily be found in the LOLBAS (Living Off The Land Binaries and Scripts) project. Their objective might be exfiltration of sensitive information or facilitating a larger attack chain within the environment. The relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) as the method often implies some form of remote communication, and **Data Exfiltration** (TA0010) since the file being compressed is likely being prepared for transfer outside the network. The specific techniques implicated here are **Application Layer Protocol** (T1105), as the download indicates an external communication.

  Primary data sources to consider for further investigation include process creation events that log executed commands, potentially enriched with network traffic logs that can show any outbound connections indicative of file transfer activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the process creation logs to identify all instances where `diantz.exe` is executed. Analyze the command-line arguments to verify the presence of remote file paths and CAB file issues.

  - **Analyze Network Traffic:** Look into outbound network traffic during the windows of detected `diantz.exe` execution. Check for unusual connections to external IPs and URLs which might correlate with the file downloads tracked in the above logs.

  - **Examine File System Changes:** Inspect the file system for newly created CAB files around the timestamps of detected executions. Verify the contents and origins of these files to assess whether they are legitimate or potentially malicious payloads.

  - **Check for Known IOCs:** Cross-reference identified external IP addresses and domains with known indicators of compromise (IOCs) related to malicious activities and tools used in similar threat scenarios.

  ### Prioritization
  This alert should be treated with medium priority within an enterprise context, as it indicates a potential method of exfiltration or malware deployment by an external actor, which could lead to sensitive data loss or further compromising of the network.

  ### Blind Spots and Assumptions
  One potential blind spot is the reliance on the presence of process creation logs; if logging levels are insufficient, these events may not be captured. Additionally, the detection logic assumes that attackers will use `diantz.exe` in a recognizable way, but advanced adversaries could obfuscate their commands or utilize other tools. The alert requires accurate logging of command-line activities from Windows systems to function effectively; ensuring this logging is enabled is crucial for the coverage of such potential threats.

