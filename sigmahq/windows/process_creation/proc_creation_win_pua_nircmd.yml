title: PUA - NirCmd Execution
id: 4e2ed651-1906-4a59-a78a-18220fca1b22
status: test
description: Detects the use of NirCmd tool for command execution, which could be
  the result of legitimate administrative activity
references:
- https://www.nirsoft.net/utils/nircmd.html
- https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
- https://www.nirsoft.net/utils/nircmd2.html#using
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-24
modified: 2023-02-13
tags:
- attack.execution
- attack.t1569.002
- attack.s0029
logsource:
  category: process_creation
  product: windows
detection:
  selection_org:
  - Image|endswith: '\NirCmd.exe'
  - OriginalFileName: 'NirCmd.exe'
  selection_cmd:
    CommandLine|contains:
    - ' execmd '
    - '.exe script '
    - '.exe shexec '
    - ' runinteractive '
  combo_exec:
    CommandLine|contains:
    - ' exec '
    - ' exec2 '
  combo_exec_params:
    CommandLine|contains:
    - ' show '
    - ' hide '
  condition: 1 of selection_* or all of combo_*
falsepositives:
- Legitimate use by administrators
level: medium
note: |
  ### Technical Context
  This rule detects the execution of the NirCmd tool, which is designed to perform various system commands and tasks in the background. While the use of NirCmd can be legitimate, particularly by system administrators for efficient task completion, its capabilities to execute commands quietly and manipulate system settings make it equally attractive to malicious actors. The rule aims to identify potentially nefarious uses of this tool, flagging scenarios where it may be employed to bypass security controls or execute unauthorized commands.

  In an enterprise environment, an attacker might leverage NirCmd to gain unauthorized access or perform actions such as hiding command prompt windows or executing other executable scripts that could facilitate a larger attack. The likely objectives include privilege escalation, lateral movement, or executing payloads while avoiding detection.

  This detection aligns with several MITRE ATT&CK techniques, specifically:
  - **T1060**: Remote File Copy
  - **T1569.002**: Command and Scripting Interpreter (Windows Command Shell)
  - **T1059.001**: Command-Line Interface

  The primary data sources for effective detection include process creation events that capture the execution of NirCmd.exe, providing insights into how and when the tool is invoked, and command line parameters indicating potentially suspicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation logs for instances of `NirCmd.exe` being executed. Focus on the parent process details to determine if the execution was initiated by a legitimate process or potentially malicious activity.
  - **Analyze Command Line Arguments**: Examine the command line parameters associated with NirCmd executions. Look for unusual patterns, such as the use of commands that are typically not executed by administrative roles, such as `execmd`, `runinteractive`, or commands that hide or obscure execution.
  - **Correlate with User Activity**: Investigate the user account associated with the NirCmd execution. Determine if the execution correlates with legitimate administrative tasks or matches known user behavior patterns to identify potential misuse.
  - **Check for Related Activities**: Monitor for other suspicious activities occurring around the same time, such as unexpected process creations or network connections initiated by the same user, which may indicate broader malicious intent.

  ### Prioritization
  This alert should be categorized as medium severity due to the potential for both legitimate administrative activity and malicious use. Given NirCmd's capabilities, unauthorized executions warrant careful scrutiny in order to prevent exploitation or further compromise of systems.

  ### Blind Spots and Assumptions
  A potential gap in this detection is the reliance on process creation logs, which may not capture every instance of exploitation if an attacker attempts to obfuscate their activity. The detection logic assumes that NirCmd will not be used legitimately for purposes outlined in the known references; hence the effectiveness of this rule is contingent on the understanding of normal administrative behaviors within the environment. Ensure that logging is properly configured to capture process creation events and command line arguments to support this detection.

