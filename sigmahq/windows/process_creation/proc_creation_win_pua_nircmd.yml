logsource:
  category: process_creation
  product: windows
detection:
  selection_org:
  - Image|endswith: '\NirCmd.exe'
  - OriginalFileName: 'NirCmd.exe'
  selection_cmd:
    CommandLine|contains:
    - ' execmd '
    - '.exe script '
    - '.exe shexec '
    - ' runinteractive '
  combo_exec:
    CommandLine|contains:
    - ' exec '
    - ' exec2 '
  combo_exec_params:
    CommandLine|contains:
    - ' show '
    - ' hide '
  condition: 1 of selection_* or all of combo_*
falsepositives:
- Legitimate use by administrators
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the NirCmd utility, a command-line tool that provides various functionalities like executing commands or manipulating system settings. The likely attacker objective is to leverage NirCmd for malicious tasks, such as executing arbitrary commands directly or running scripts without user interaction to evade detection. This behavior aligns with the "Execution" tactic in MITRE ATT&CK (T1203) and the "Execution through application layer" technique (T1569.002).

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture the execution of processes along with their command lines. If malicious, NirCmd could be used for system manipulation or data exfiltration, posing significant risks to system integrity and data confidentiality. Importantly, the detection of NirCmd execution alone does NOT confirm malicious activity, as it may represent legitimate administrative actions.

  ---

  ### Investigation Steps

  - **Review the command line arguments**: Check the command line for the execution of 'NirCmd.exe' and any associated parameters. Focus on keywords such as 'execmd', 'runinteractive', or '.exe script'. Malicious usage often includes execution of scripts that modify system behavior or access sensitive data.

  - **Validate process parent-child relationships**: Utilize Sysmon logs (Event ID 1) to check the parent process of NirCmd.exe. If the parent is a process associated with system administration (e.g., PowerShell or cmd.exe), it might indicate legitimate usage. An unexpected parent process could signal malicious intent.

  - **Check for unexpected network activity**: Examine firewall logs or network monitoring tools for any outbound connections initiated by NirCmd. Use Event ID 5156 (Windows Filtering Platform) to identify new network connections. Malicious uses may attempt to exfiltrate data or establish remote connections.

  - **Identify existing system roles**: Consider the host role of the affected system (e.g., server, workstation) and its criticality within the environment. NirCmd execution on critical servers without a corresponding administrative action may indicate an ongoing attack.

  - **Look for associated persistence mechanisms**: Inspect for any scheduled tasks or registry modifications related to NirCmd across the system. Legitimate administrative activity will typically not create persistent entries without proper context.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems and the likelihood of misuse. While NirCmd can be used for legitimate purposes, it is not commonly found in standard user behavior, making its detection a key indicator of possible malicious activity.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of scripted automation by legitimate processes that could trigger this alert without malicious intent. Reliable detection relies on consistent logging of Windows Process Creation events and Sysmon configurations to capture comprehensive command line details. Also, legitimate administrative tasks, including system management via NirCmd, may inadvertently trigger this alert. For comprehensive coverage, consider companion detections that analyze PowerShell script executions (T1059.001) which could indicate similar malicious activities.

