note: |
  ### Technical Context

  This detection rule identifies attempts to add a new network provider via command line operations in Windows. This behavior is often associated with credential dumping activities, as attackers may use this method, akin to the functionality of tools like NPPSpy, to extract clear text credentials from the system. The likely attacker objective is to gain unauthorized access to user credentials stored in memory or within services leveraging network providers.

  This detection correlates with the MITRE ATT&CK framework under the tactic of Credential Access (T1003). The primary telemetry sources are process creation logs, specifically Windows Event ID 4688, which captures command line activities. If malicious, this could lead to the compromise of user credentials, putting sensitive data and systems at risk. Importantly, this detection does NOT confirm credential dumping has successfully occurred — it merely indicates an attempt to manipulate network provider settings.

  ### Investigation Steps

  - **Review process creation details:** Check for related log entries in Security Event ID 4688 for processes with command lines containing `\System\CurrentControlSet\Services\` and `\NetworkProvider`. Look for indicators of the specific provider being targeted.

  - **Correlate event timing:** Match timestamps of the suspicious process creation with user login events (Event ID 4624) to determine if there is suspicious access aligned with the credential dumping attempt.

  - **Identify known benign providers:** Determine whether the alert is triggered by legitimate network providers (like `WebClient`, `LanmanWorkstation`, or `RDPNP`). Consult your environment's documentation on configured network providers to distinguish between legitimate activity and potentially malicious attempts.

  - **Examine parent process relationships:** Investigate the parent process of any flagged command line activity to determine if it is a known malicious tool or application. Use Sysmon Event ID 1 to extract parent-child process relationships.

  - **Cross-reference unusual user behavior:** Check if the user account associated with this process has abnormal login times or activities. Use Auditing logs (Event ID 4624) to review the user’s historical logins for context.

  - **Validate file operations:** Look for signs of credential dumping tools (e.g., NPPSpy) or related artifacts in temporary directories (like downloading events and file creations). Check for files related to the dumping operation using file system logs.

  ### Prioritization

  The alert is of high severity due to the potential impact on sensitive systems and user accounts. The likelihood of malicious activity is significant, given that techniques for credential dumping via network provider modification are often weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection has limitations; attackers might use obfuscation techniques or modify command-line patterns to evade detection. Ensure that the logging configuration captures all relevant network provider activities. Legitimate software installations or updates may also trigger this alert. Consider companion detections around unusual network activity (e.g., remote access tools detected via Event ID 4688) to reinforce malicious behavior context.

