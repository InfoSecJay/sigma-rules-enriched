note: |
  ### Technical Context

  This rule detects attempts to add a new network provider on Windows systems, a behavior often associated with credential dumping techniques. The attacker’s objective is likely to exploit clear text credentials by manipulating network provider settings, similar to the NPPSpy tool methodology, enabling them to harvest sensitive data. This detection aligns with the MITRE ATT&CK tactic of Credential Access (TA1003) and the specific technique of Credential Dumping (T1003). The primary telemetry sources include process creation logs such as Windows Security Event ID 4688 and Sysmon Event ID 1, specifically looking for command line parameters that signal modification of network providers. If successful, this activity can lead to severe security impacts through unauthorized access to sensitive user credentials. However, it should be noted that this detection does NOT confirm that credentials were successfully dumped or that malicious intent is guaranteed without further analysis.

  ---

  ### Investigation Steps

  - **Review recent process creation events**: Check Security Event ID 4688 or Sysmon Event ID 1 for any process with command line arguments containing `\System\CurrentControlSet\Services\` and `\NetworkProvider`. Look for the `Image` field to identify the executable path and `CommandLine` field for specific arguments.

  - **Identify legitimate network provider activity**: Determine if the affected system has previously used known network providers (e.g., WebClient or LanmanWorkstation). This can be seen in the System Event Log or through a review of installed services; expected legitimate commands would not contain suspicious arguments related to unauthorized network providers.

  - **Examine parent process details**: Utilize Sysmon Event ID 1/2 to find parent process IDs. Analyze the parent process to see if it is recognized as legitimate software (e.g., services like `explorer.exe` or `powershell.exe`); anything unusual could warrant further scrutiny.

  - **Correlate with user activity**: Review user login sessions and activity within the Event Viewer. Check for any abnormal patterns or spikes in administrative activities, especially on critical assets like domain controllers or sensitive servers.

  - **Check for credential dumping tools**: Investigate the presence of known credential dumping tools within the filesystem, such as NPPSpy or similar executables across endpoints. Validate any newly created files that could indicate active credential dumping attempts.

  - **Monitor for external command line connection attempts**: If applicable, analyze outbound connection attempts relating to suspicious command lines that include network provider manipulation. Look for indicators in network logs that connect unusual hosts or IPs associated with credential harvesting campaigns.

  ---

  ### Prioritization

  The alert warrants a high priority due to its potential impact on sensitive accounts and the likelihood of malicious intent when network provider modifications are observed. Credential dumping techniques are common in lateral movement strategies, making it imperative to respond promptly to any indications of this behavior.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from variations in legitimate software behavior that also interacts with network providers, potentially triggering false positives. Continuous log collection from all Windows systems and thorough monitoring of versioned event logs are essential for reliable detection. Additionally, tools used for testing or development purposes could inadvertently activate this alert. Complementary detections, such as monitoring for abnormal network traffic patterns or excessive account lockouts, can enhance coverage and context for responding to potential credential dumping cases.

