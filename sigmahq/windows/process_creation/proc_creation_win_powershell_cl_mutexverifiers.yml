title: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
status: test
description: Detects the use of the Microsoft signed script "CL_mutexverifiers" 
  to proxy the execution of additional PowerShell script commands
references:
- https://lolbas-project.github.io/lolbas/Scripts/CL_mutexverifiers/
author: Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia 
  Shornikova, frack113
date: 2022-05-21
modified: 2023-08-17
tags:
- attack.stealth
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh:
    ParentImage|endswith:
            # Note: to avoid potential FPs we assume the script was launched from powershell. But in theory it can be launched by any Powershell like process
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith: '\powershell.exe'
    CommandLine|contains: ' -nologo -windowstyle minimized -file '
  selection_temp:
        # Note: Since the function uses "env:temp" the value will change depending on the context of exec
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - '\Windows\Temp\'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the signed PowerShell script "CL_mutexverifiers" being used as a proxy to run additional PowerShell commands. An attacker may utilize this technique to obfuscate the true intent of their scripts, enabling further malicious actions in an environment while avoiding detection. The relevant MITRE ATT&CK tactic is Execution (TA0002), specifically the technique for PowerShell (T1059.001). The primary telemetry source is Process Creation logs, specifically Windows Event ID 4688, which logs command line execution details.

  If this behavior is malicious, it potentially indicates a step in further exploitation, lateral movement, or data exfiltration. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate scripted automation tasks may employ similar patterns.

  ### Investigation Steps

  - **Verify Command Line Arguments**: Check the command line arguments in Event ID 4688 for the PowerShell process. Look for segments such as ‘-nologo -windowstyle minimized -file’, which are indicative of potentially scripted malicious activity. If these arguments are present without context, raise the priority of the alert.

  - **Review Parent Process Association**: Assess the parent process from which PowerShell was launched (Event ID 4688: ParentImage). If it originates from legitimate applications (e.g., task scheduler or automated scripts), it may indicate expected behavior.

  - **Investigate File Creation in Temp Directories**: Monitor the environment variable locations under Temp and LocalTemp (e.g., '\AppData\Local\Temp\' and '\Windows\Temp\') for new script files created around the same timestamp as the alert. Check for abnormal scripts or file naming conventions that may indicate malicious activity.

  - **Correlate with User Activity**: Analyze associated user accounts and their recent activity (Security Event ID 4624) for unauthorized access patterns. If user behavior does not align with the system's function (e.g., an admin performing unusual script executions), it may signal concern.

  - **Identify Known Bad Indicators**: Cross-reference the observed script and process signatures with threat intelligence feeds for known bad hashes or associated threat actors utilizing the CL_mutexverifiers script in prior incidents.

  ### Prioritization

  The severity of this alert is medium due to the potential for significant impact on system integrity and the likelihood of malicious abuse. While the behavior may sometimes be legitimate, the specific use of proxy execution through CL_mutexverifiers is commonly associated with advanced evasion strategies that adversaries employ in focused attacks.

  ### Blind Spots and Assumptions

  This detection may be bypassed if the attacker uses obfuscation techniques or executes through other, non-standard scripting environments. It requires reliable logging from both PowerShell and Windows Event logs to maintain coverage. Legitimate scheduled tasks or administrative automation may trigger the alert, complicating investigations. A companion detection could be looking for unusual PowerShell script execution patterns that do not correlate with established baseline behaviors.

