title: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
status: test
description: Detects the use of the Microsoft signed script "CL_mutexverifiers" 
  to proxy the execution of additional PowerShell script commands
references:
- https://lolbas-project.github.io/lolbas/Scripts/CL_mutexverifiers/
author: Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia 
  Shornikova, frack113
date: 2022-05-21
modified: 2023-08-17
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh:
    ParentImage|endswith:
            # Note: to avoid potential FPs we assume the script was launched from powershell. But in theory it can be launched by any Powershell like process
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith: '\powershell.exe'
    CommandLine|contains: ' -nologo -windowstyle minimized -file '
  selection_temp:
        # Note: Since the function uses "env:temp" the value will change depending on the context of exec
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - '\Windows\Temp\'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Microsoft signed script "CL_mutexverifiers.ps1" via a PowerShell process, specifically looking for instances where it proxies the execution of additional PowerShell commands. The likely objective of an attacker using this technique is to evade detection mechanisms while running malicious scripts under the guise of a legitimate, signed Microsoft script, facilitating initial access or lateral movement within the environment. This activity falls under the MITRE ATT&CK framework tactic of "Defense Evasion" (TA0042) with technique "User Execution" (T1203).

  Primary telemetry sources for detection include Windows Process Creation logs (Security Event ID 4688) and Sysmon Event ID 1, which provide information on command-line arguments and the execution context. If malicious, this behavior can significantly impact the organization by allowing unauthorized execution of potentially harmful scripts. However, it is critical to understand that this detection alone does not confirm malicious intent; legitimate uses of CL_mutexverifiers.ps1 may occur in standard operations.

  ### Investigation Steps

  - **Review process creation logs for suspicious activity:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where PowerShell processes are invoked with the command line containing `-nologo -windowstyle minimized -file`. Look for known benign execution contexts, such as Background Jobs, scheduled tasks, or specific known administrative scripts.

  - **Analyze command line arguments:** Specifically, inspect instances where the command line includes references to `\AppData\Local\Temp\` or `\Windows\Temp\`. If the script is being executed from these temporary directories without a valid, business-relevant reason, it may indicate malicious exploitation.

  - **Confirm legitimate usage context:** Identify any legitimate uses of the CL_mutexverifiers script by correlating with intended administrative applications or legitimate automated tasks that should reference it. Assess whether the execution pattern aligns with established operational procedures.

  - **Check for additional PowerShell activity:** Track if there are further PowerShell commands executed following the detection. Review Security Event ID 4104 for unusual script block logging that indicates obfuscated or suspicious commands meant to execute post-CL_mutexverifiers invocation.

  - **Identify high-confidence malicious indicators:** Look for patterns of unusual execution times (e.g., outside standard business hours) and any associated entries that lead to attempts of network communication (e.g., invoking cmdlets for outbound connections). Common PowerShell commands to review include `Invoke-WebRequest` or `Invoke-Expression`.

  ### Prioritization

  The alert is considered medium severity due to the potential for significant impact if the affected system is compromised. The likelihood of malicious abuse is moderate, as this technique is useful for evading detection and tightly aligns with known attacker tactics. While usage of this script in itself isn't alarming, it may signal an ongoing compromise if coupled with subsequent suspicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions or policies that restrict logging of certain actions. Adversaries might evade detection by using modified execution policies or utilizing masking techniques. It's essential to ensure proper logging is configured, particularly on PowerShell processes. Legitimate activities that may trigger confusion include software installations or legitimate administrative tasks invoking scripts with this method. A related detection to consider strengthening coverage is monitoring for unusual outbound PowerShell network traffic, which might indicate underlying malicious activity.

