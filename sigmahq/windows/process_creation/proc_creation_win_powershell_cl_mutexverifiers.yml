title: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
status: test
description: Detects the use of the Microsoft signed script "CL_mutexverifiers" to
  proxy the execution of additional PowerShell script commands
references:
- https://lolbas-project.github.io/lolbas/Scripts/CL_mutexverifiers/
author: Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia Shornikova,
  frack113
date: 2022-05-21
modified: 2023-08-17
tags:
- attack.defense-evasion
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh:
    ParentImage|endswith:
            # Note: to avoid potential FPs we assume the script was launched from powershell. But in theory it can be launched by any Powershell like process
    - '\powershell.exe'
    - '\pwsh.exe'
    Image|endswith: '\powershell.exe'
    CommandLine|contains: ' -nologo -windowstyle minimized -file '
  selection_temp:
        # Note: Since the function uses "env:temp" the value will change depending on the context of exec
    CommandLine|contains:
    - '\AppData\Local\Temp\'
    - '\Windows\Temp\'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the Microsoft-signed PowerShell script "CL_mutexverifiers," which is utilized as a proxy to execute additional PowerShell commands. The primary threat scenario involves an attacker leveraging this script to bypass security restrictions and execute potentially malicious commands without raising suspicion, which can lead to further exploitation within the environment. The script’s use may indicate an attacker aiming to execute payloads or manipulate system configurations stealthily.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (T1203): This refers to the use of tools and techniques to avoid detection by security monitoring solutions.
  - **Indicator Removal on Host** (T1070): Attackers often seek to cover their tracks by removing indicators of compromise.

  Primary data sources for this detection include:
  - **Process Creation events**: which log PowerShell executions, their parent processes, and command-line arguments. This is crucial for determining if the script is being run in a suspicious context, such as from legitimate tools with atypical arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of `powershell.exe` or `pwsh.exe` launching the "CL_mutexverifiers" script. Pay particular attention to command-line arguments that are executed alongside it.

  - **Examine Command-Line Arguments**: Analyze the presence of `-nologo -windowstyle minimized -file` in the process execution. This can indicate attempts to obscure the script's execution from view.

  - **Check Temporary File Locations**: Investigate any usage of files located in `\AppData\Local\Temp\` or `\Windows\Temp\`, as these folders are commonly used to store and execute scripts in a less monitored fashion.

  - **Cross-Reference with Known Threats**: Validate execution against threat intelligence for signatures of known malicious behavior linked to the use of the "CL_mutexverifiers" script or similar proxy techniques.

  ### Prioritization
  This alert should be treated with medium severity due to the potential for significant impact if successfully exploited, as attackers can leverage this method to execute further malicious actions undetected. The likelihood of encountering such tactics in an enterprise environment is moderate but should be considered given the prevalence of PowerShell abuse in attacks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the script is executed outside regular PowerShell environments or if command-line obfuscation techniques are employed. The detection logic assumes that the script is launched from a typical PowerShell context and relies on standard logging practices being in place. If process creation logging is not configured correctly or if logs are not retained sufficiently, the detection will not function effectively. Additionally, there may be false positives when legitimate administrative tasks utilize the script, necessitating context reviews for alert validation.

