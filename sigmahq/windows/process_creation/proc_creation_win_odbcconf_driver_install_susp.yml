note: |
  ### Technical Context

  This rule detects the execution of `odbcconf.exe` with the `INSTALLDRIVER` action when the driver being installed lacks a `.dll` extension. This behavior typically signifies an attempt to install a potentially malicious or non-standard driver, which could be part of a defense evasion strategy employed by attackers. The key MITRE ATT&CK tactic involved is "Execution" and the related technique is T1218.008 (Signed Binary Proxy Execution). The primary telemetry sources include Windows process creation logs and event IDs related to command line initiation.

  If malicious, this behavior could allow an adversary to introduce unauthorized drivers into the environment, potentially enabling remote access or system control. Importantly, this detection does NOT prove that an attack is occurring on its own; further context and investigation are necessary to determine intent and impact.

  ### Investigation Steps

  - **Check process creation logs**: Review Process Creation logs for Security Event ID 4688 that detail executions of `odbcconf.exe`. Look for unusual command line parameters, especially the presence of "INSTALLDRIVER ".

  - **Validate command line syntax**: Assess CommandLine entries for `odbcconf.exe` and determine if they include a driver file that lacks a `.dll` extension. This suggests possible malicious activity while legitimate operations typically reference valid drivers.

  - **Correlate with system changes**: Query for any associated driver changes within the Windows Driver Store (Event ID 0004 from the SetupAPI) following the execution of `odbcconf.exe`, as successful driver installations should reflect in this log.

  - **Review alternative log sources**: Analyze Sysmon Event ID 1 logs for additional context around `odbcconf.exe` execution, including parent processes and any associated child process creation, identifying potential abnormal workflows.

  - **Identify tampered system components**: Look for any unusual or custom drivers installed under C:\Windows\System32 or C:\Windows\SysWOW64 following the execution of this command, which could indicate a backdoor presence.

  - **Assess known benign uses**: Be aware that legitimate applications might utilize `odbcconf.exe` for database connections; ensure these entries correlate with expected business applications or user actions.

  ### Prioritization

  Given the potential impact of unauthorized driver installations, this alert signifies a high severity within enterprises, especially on critical systems. The likelihood of malicious exploitation is notable, as the behavior aligns with known evasion techniques for maintaining persistence or obtaining elevated privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by false negatives if logging for process creation events is not adequately configured or preserved in the environment. Additionally, legitimate applications may also invoke `odbcconf.exe` for standard operations, leading to potential false positives. A companion detection, such as monitoring for unusual driver installations through Windows Driver Events, would enhance coverage against this tactic.

