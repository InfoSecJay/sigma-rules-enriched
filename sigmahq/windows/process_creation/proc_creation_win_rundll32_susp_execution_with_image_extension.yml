note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` with arguments that suggest it is facilitating the loading of DLL files disguised as common image file formats (e.g., `.bmp`, `.jpg`). This behavior is often indicative of an adversary attempting to exploit Windows' presentation of DLLs as legitimate image files to evade detection mechanisms. The likely objective of the attacker is to execute malicious code or perform lateral movement within the network using a seemingly non-suspicious process.

  The relevant MITRE ATT&CK tactic for this detection is **Defense Evasion** (TA0005), with the technique specifically being **Rundll32** (T1218.011). The primary telemetry sources for this detection are Windows process creation logs, particularly **Security Event ID 4688** for new processes and potentially **Sysmon Event ID 1** for more detailed tracking of command-line arguments. If exploited, this behavior can lead to significant security compromises, such as unauthorized access or further malware deployment. It is vital to note that this detection alone does not confirm malicious activity; it merely points out suspicious usage patterns that require further investigation.

  ### Investigation Steps

  - **Verify the command line arguments**: Check for the presence of known image extensions in the command line for processes matching `rundll32.exe`. Use Security Event ID 4688 and look specifically at `CommandLine` fields to ensure the arguments contain extensions like `.jpg` or `.png`.

  - **Examine parent-child process relationships**: Investigate the parent process of `rundll32.exe` to identify how this process was initiated. Look for unusual parent processes that typically do not spawn `rundll32.exe`, such as less commonly used applications or scripts (Event ID 4688 `ParentProcessId` field).

  - **Identify file existence and type**: Check for the associated DLL files and their locations to see if they follow unusual naming conventions or are located in unexpected directories like temporary folders. Use file system logs or directly query the file system to establish if such files exist.

  - **Cross-reference with YARA or antivirus alerts**: Utilize YARA rules or existing antivirus logs to check if the DLLs being called by `rundll32.exe` have been flagged as malicious in previous engagements. Look for alerts that match the `FileHash` field of those DLLs.

  - **Review historical behavior of `rundll32.exe`**: Validate if `rundll32.exe` executions are part of established, legitimate operational processes or if they are isolated incidents. This can involve checking prior execution records in Sysmon to gather context on frequency and pattern.

  - **Identify legitimate use cases**: Cross-check with known applications within the enterprise environment that legitimately use `rundll32.exe` and document scenarios where this process is used with harmless image files, thus establishing context for genuine behavior.

  ### Prioritization

  This alert has a high severity due to the potential for significant security breaches if `rundll32.exe` is leveraged in a malicious context. Given that attackers often use this technique to sidestep detection, the likelihood of malicious abuse is considerable, reinforcing the urgency for a thorough investigation.

  ### Blind Spots and Assumptions

  The detection might not catch obfuscated or renamed executables that perform similar malicious actions, which could evade analysis by using various file and process manipulation techniques. It relies on having the correct logging configurations enabled for process creation. Legitimate activities, such as specialized imaging software routines calling `rundll32.exe`, could trigger the alert. A related detection rule that strengthens coverage would be monitoring for anomalous DLL file creation events within trusted directories.

