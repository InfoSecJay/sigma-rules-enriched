logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\DumpMinitool.exe'
    - '\DumpMinitool.x86.exe'
    - '\DumpMinitool.arm64.exe'
  - OriginalFileName:
    - 'DumpMinitool.exe'
    - 'DumpMinitool.x86.exe'
    - 'DumpMinitool.arm64.exe'
  selection_cli:
    CommandLine|contains:
    - ' Full'
    - ' Mini'
    - ' WithHeap'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of "DumpMinitool," a tool used to create memory dumps of processes in Windows. This behavior is often leveraged by attackers for credential harvesting (e.g., extracting sensitive information such as passwords) or for reconnaissance purposes. The relevant MITRE ATT&CK tactics are Credential Access (T1003) and Defense Evasion (T1036). The primary telemetry sources include process creation logs (Windows Security Event ID 4688 or Sysmon Event ID 1) specifically capturing the execution of executable files, alongside command line arguments. If executed maliciously, this behavior can lead to sensitive data exposure and increase the risk of broader system compromise. However, this detection alone does not confirm malicious intent; legitimate use of the tool may occur in research or debugging scenarios.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for the appearance of "DumpMinitool.exe" in the process creation logs. Ensure to note the parent process ID, which can illuminate its origin.

  - **Analyze Command-Line Arguments:** Confirm that the command line contains keywords like 'Full', 'Mini', or 'WithHeap' within the process creation logs. Legitimate use cases generally do not include all these parameters combined.

  - **Evaluate Parent Process Context:** Identify the parent process of "DumpMinitool.exe" to determine the context of its execution. If it was initiated by a known system process, this may indicate benign activity.

  - **Correlate with Other Alerts:** Cross-check any corresponding alerts from EDR or antivirus solutions that may flag similar behavior to reinforce your investigation and identify potential compromised systems.

  - **Assess Asset Criticality:** Evaluate the system on which "DumpMinitool.exe" was executed for criticality (e.g., a domain controller vs. a user workstation). Malicious activity on critical assets is of greater concern.

  - **Review User Activity Logs:** Investigate the user account associated with the process execution for any unusual activity or patterns, especially logins from unfamiliar locations or times.

  ### Prioritization

  This alert should be treated with medium severity due to the potential compromise of sensitive information and the risk it poses to enterprise security. While the tool can be misused by attackers, legitimate use is possible, thus requiring further investigation rather than immediate escalation.

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker renames the executable or uses an obfuscated method for execution. Reliable detection requires ensuring that security telemetry is correctly configured to capture process creation events. Legitimate applications, particularly in debugging or profiling scenarios, might trigger this alert. Complementary detections related to unauthorized process injections or known credential dumping utilities can bolster overall monitoring effectiveness.

