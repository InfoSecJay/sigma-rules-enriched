detection:
  selection_img:
  - Image|endswith:
    - '\DumpMinitool.exe'
    - '\DumpMinitool.x86.exe'
    - '\DumpMinitool.arm64.exe'
  - OriginalFileName:
    - 'DumpMinitool.exe'
