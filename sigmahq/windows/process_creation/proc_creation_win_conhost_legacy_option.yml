  ---

  ### Technical Context

  This rule detects processes created with a high integrity level that invoke "conhost.exe" using the "-ForceV1" argument, indicating a potential misuse of administrative privileges. The objective for an attacker might include executing code with elevated privileges to manipulate or retrieve sensitive information directly from kernel space. This behavior aligns with the MITRE ATT&CK technique "Execution with High Integrity" (T1202).

  The primary telemetry sources for this detection are Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. If the behavior is malicious, it could allow the attacker to execute arbitrary code, potentially leading to system compromise or data exfiltration. However, this detection alone does not confirm malicious intent, as legitimate applications may also trigger it in normal operational contexts.

  ---

  ### Investigation Steps

  - **Check the process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for the `conhost.exe` instance. Look for the associated user and process ID to identify the parent process which initiated the high integrity execution.

  - **Validate command-line arguments:** Examine the command line associated with the detected process. Look specifically for the presence of `-ForceV1` and `0xffffffff`. A process lacking these parameters is likely benign.

  - **Correlate with normal behavior:** Determine if the user account associated with the alert typically executes similar command line utilities and whether they are engaged in legitimate administrative actions, such as running a command prompt with elevated privileges.

  - **Identify high-confidence malicious indicators:** Check for common indicators of compromise—such as unusual child processes spawned from `conhost.exe`, especially those attempting external network connections. Use network logs for outbound requests associated with this process.

  - **Assess system criticality:** Consider the role of the host (e.g., domain controller vs. standard workstation). High integrity-level processes on critical assets should be treated with heightened scrutiny due to the potential impact of a breach.

  - **Monitor for related activities:**  Track any subsequent actions taken by the high integrity process, such as alterations in system configurations or access to sensitive files, to provide context about potential malicious activity.

  ---

  ### Prioritization

  This alert should be treated with medium to high severity due to the potential for significant impact on systems with elevated privileges. The likelihood of malicious abuse is concerning, given that this behavior could be leveraged for lateral movement or persistence. While such behaviors may also arise from legitimate user actions, they warrant further investigation due to the inherent risks.

  ---

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative tasks that intentionally use the high integrity processes. Specific log sources, such as detailed process accounting or network logs, may be necessary for comprehensive visibility and could be limited if not properly configured. Additionally, tasks involving tools like PowerShell or other scripting languages may also generate similar signals. Related detections to consider include monitoring for anomalous process creation patterns or known malicious command execution scenarios to improve overall detection coverage.

