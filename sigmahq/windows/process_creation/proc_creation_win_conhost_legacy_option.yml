note: |
  ### Technical Context

  This rule detects instances where a process associated with `conhost.exe` is launched with a high integrity level using the `-ForceV1` argument, indicating that the process is attempting to interact with kernel-level components. This behavior may suggest an adversary attempting to escalate privileges or execute code in a sensitive context. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA1202), which encompasses techniques that facilitate the evasion of security controls.

  The primary telemetry source is Windows process creation logs, specifically those capturing the command line arguments and integrity levels of processes. A malicious use case could involve an attacker leveraging this technique to bypass security measures or gain control over system resources. It is crucial to note that while this detection indicates potentially suspicious activity, it does NOT confirm malicious intent by itself; legitimate administrative actions can trigger similar alerts.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 logs for entries related to `conhost.exe`, especially those with CommandLine containing `-ForceV1` and `IntegrityLevel` set to "High" (S-1-16-12288).

  - **Identify high-confidence malicious indicators:** Look for additional suspicious command-line arguments associated with `conhost.exe`, such as unusual scripts or known malicious patterns, which could indicate exploitation attempts.

  - **Validate legitimate activities:** Check for expected usage of `conhost.exe` by legitimate administrative tasks, such as Sysinternals tools or normal administrative command prompts run with high privileges. Compare user context and timing as indicators of regular behavior.

  - **Correlate with endpoint logs:** Review Windows Event Logs for Event ID 7045, which indicates service installation or modification, to locate any services that may have been created or altered around the same time as the suspicious `conhost.exe` launch.

  - **Analyze process tree:** Investigate parent process IDs in conjunction with the detected `conhost.exe` to discover the process that initiated it, thereby establishing context which may reveal benign or malicious behavior.

  ### Prioritization

  Given that this alert indicates elevated privileges may be leveraged for potentially malicious purposes, it should be treated with moderate priority. Systems with high integrity levels are often critical and can be targets for exploitation, making it essential to assess the context and intended actions accurately.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques where attackers disguise their actions through obfuscation or by using altered process paths. Reliable detection requires complete capturing of Windows process creation logs and configurations to include all command line arguments. Legitimate administrative actions, such as routine system maintenance or software installations, may inadvertently trigger this alert. To strengthen coverage, complement this detection with monitoring for unusual process spawning behaviors using Sysmon Event ID 10 (Process Access) and ID 11 (Process Termination).

