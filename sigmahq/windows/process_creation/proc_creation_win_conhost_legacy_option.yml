note: |
  ### Technical Context
  This rule detects suspicious instances of the `conhost.exe` process that are executed with high integrity levels while utilizing the legacy `-ForceV1` option. `conhost.exe` (Console Host) is primarily responsible for handling console windows in Windows operating systems. When combined with a high integrity level, it raises concerns about potential misuse by an attacker with elevated privileges. The `-ForceV1` option is generally associated with direct kernel space inquiries, which could be misused for malicious activities, such as creating persistence mechanisms or executing commands with elevated permissions.

  In a threat scenario, an attacker may leverage this technique to execute malicious scripts or commands while evading detection by appearing as legitimate system processes. The ability to run commands with high integrity levels can facilitate privilege escalation and the execution of payloads that further compromise the target environment. This activity is closely aligned with the MITRE ATT&CK tactics of **Defense Evasion** and techniques such as **Process Injection (T1202)**, where attackers manipulate legitimate processes to execute code undetected.

  The primary data sources for detecting these activities include **process creation events** from Windows event logs. These logs provide insights into the execution context of processes, including their command-line arguments and integrity levels, crucial for identifying potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events in Windows logs to identify instances of `conhost.exe` executed with a high integrity level, focusing on the associated command line for suspicious flags like `-ForceV1`.

  - **Correlate with User Activity:** Examine user account activity around the time of the detected event to determine if the process execution was initiated by a legitimate user or if it may be related to a potential compromise.

  - **Check for Parent Processes:** Investigate the parent processes of the suspicious `conhost.exe` instance to identify the context in which it was launched, looking for any unusual or unauthorized applications initiating the execution.

  - **Inspect for Additional Indicators:** Look for other related events in the environment that may suggest malicious activity, such as unusual network connections, file modifications, or other indicators of compromise in conjunction with the high IntegrityLevel instances.

  ### Prioritization
  This alert should be considered a high priority in an enterprise environment due to the potential for privilege escalation and malicious activity that could seriously compromise system integrity and confidentiality.

  ### Blind Spots and Assumptions
  This detection logic assumes that all instances of `conhost.exe` with high integrity levels are suspect, which may yield false positives in scenarios where legitimate administrative tasks are performed. The requirement for the process creation logs to be enabled and collected is critical for the alert to function effectively. Organizations may also need to be aware of potential gaps in their logging configurations that could overlook similar suspicious activities if they are not captured in the process creation logs.

