  ### Technical Context

  This Sigma rule detects the execution of the "Mouse Lock" software, which has been associated with both credential access and information collection in security incidents, based on findings from Kaspersky's 2020 Incident Response Analyst Report. The likely objective of an adversary using this tool is to capture user interactions or credentials surreptitiously. This behavior is relevant to MITRE ATT&CK technique T1056.002 (Input Capture: Keylogging).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on process execution details such as command line arguments and product information. If used maliciously, this tool enables unauthorized access to sensitive information, leading to significant security risks. Importantly, this detection does NOT confirm that malicious activity has occurred on its own, as the tool can also be utilized legitimately.

  ### Investigation Steps

  - **Validate process execution:** Review Windows Security Event ID 4688 logs for process creation entries where the Image Name or CommandLine contains "Mouse Lock." Check for details indicating the initiating user and process tree to ascertain if it’s related to legitimate business activities.

  - **Assess company context:** Check for incidents involving "Misc314" as part of the CommandLine field in process creation events to determine if the software usage is consistent with expected applications within your organization, such as legitimate remote access tools.

  - **Examine user interactions:** Investigate recent user behavior logs (e.g., access logs, user activity logs) for anomalous patterns correlating with the execution times of "Mouse Lock". Compare these with the typical behavior of users to establish whether the execution aligns with normal operational procedures.

  - **Identify high-confidence malicious indicators:** Look for abnormal network activities tied to the user involved with "Mouse Lock" execution. For example, inspect network logs for any unusual outbound connections or data exfiltration activities occurring from the system executing the tool, which may indicate credential theft efforts.

  - **Check legitimate software usage:** Review the documentation or communication regarding legitimate instances of "Mouse Lock" use within the organization. This helps to differentiate between benign uses and potential misuse.

  - **Assess asset criticality:** Ensure that the machine running "Mouse Lock" is not a critical system or contains high-value data. Systems that handle sensitive information should have additional scrutiny if running this tool.

  ### Prioritization

  The alert's severity is medium due to the potential for misuse in credential access or information collection. The likelihood of malicious use is moderate because the software can easily be weaponized for nefarious purposes, especially in a targeted attack. Furthermore, malicious actors often capitalize on lesser-known tools to evade detection.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate uses of Mouse Lock, which may trigger false positives. Effective detection relies on having complete logging of process creation events with sufficient context about software deployments. Common legitimate activities that may trigger this alert include remote support sessions or employee training that utilize "Mouse Lock". A related detection to consider is monitoring for abnormal keystroke activities (T1056) that would reinforce the context of process execution.

