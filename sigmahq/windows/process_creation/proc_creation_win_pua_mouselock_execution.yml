  ---

  ### Technical Context

  This Sigma rule detects the execution of the "Mouse Lock" application, which has been linked to both credential access and data collection during security incidents. Attackers may leverage this software to lock user sessions or capture keystrokes in order to access sensitive information.

  The rule aligns with the MITRE ATT&CK framework under the tactics of Credential Access (TA0006) and Collection (TA0013), specifically technique T1056.002: Input Capture. Primary telemetry sources for detection include Windows process creation logs that capture executable command lines and associated metadata.

  If malicious, the use of Mouse Lock indicates potential unauthorized session control or data harvesting, posing a significant threat to the confidentiality and integrity of sensitive information. However, this detection does not confirm malicious intent without additional context, as legitimate use of the software can occur.

  ---

  ### Investigation Steps

  - **Verify process creation events:** Check for process creation events corresponding to Mouse Lock using Windows Security Event ID 4688 or Sysmon Event ID 1. Note the User and CommandLine fields to assess legitimacy.

  - **Analyze command line arguments:** Evaluate the CommandLine field for execution parameters containing "Mouse Lock_." Malicious usage typically features unusual user accounts or unexpected contexts, while legitimate usage may appear in known segments of user behavior.

  - **Identify analogous tool usage:** Compare the detected execution with historical data of known legitimate uses of Mouse Lock within the organization. Determine asset role and user behavior to clarify context.

  - **Assess user accounts:** Review the user account associated with the Mouse Lock execution. A non-privileged user executing the application during anomalous hours may indicate malicious activity, especially if usage doesn't align with user roles.

  - **Investigate recent system changes or anomalies:** Correlate the detection with recent user activity logs or system changes that may imply misuse, such as access to sensitive directories or files directly after execution.

  ---

  ### Prioritization

  In an enterprise context, the alert severity is medium due to the potential impact on sensitive data if Mouse Lock is utilized maliciously. Given the risk associated with credential access and data collection, and the application's association with both legitimate and nefarious activities, it warrants close scrutiny. This behavior, while not among the most commonly weaponized, poses credible threats when correlated with other anomalous activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of Mouse Lock by authorized personnel. Additionally, visibility into all process creation logs is essential for reliable detection; configurations that omit this telemetry can lead to undetected activity. Common legitimate activities that may trigger this alert include authorized IT support or remote access scenarios. A related detection to augment coverage could involve monitoring for unusual patterns of keystroke capture or session locking software in environments where such actions are rare.

