  ### Technical Context
  This detection rule identifies the execution of the legitimate tool "Mouse Lock," which has been documented in Kaspersky's 2020 Incident Response Analyst Report as being associated with credential access and collection activities during security incidents. Attackers may deploy Mouse Lock to disrupt user activity or capture credentials through mouse interference while users unknowingly provide sensitive information. The use of this software poses a risk since it can be utilized by attackers to facilitate unauthorized access or data exfiltration.

  This rule is related to the MITRE ATT&CK framework, specifically the tactics of Credential Access and Collection, corresponding to techniques T1056.002 (Input Capture: GUI Input Capture). Under this context, an organization may face concerns if "Mouse Lock" is discovered in use, as it could indicate an attempt by a threat actor to engage in malicious activities such as intercepting credentials or obtaining sensitive data through deceptive means.

  The primary data sources for detecting this activity include process creation events, where application names and command-line arguments are recorded. Monitoring these logs can help identify instances where the "Mouse Lock" tool has been executed.

  ### Investigation Steps
  - **Review Process Creation Events:** Collect process creation logs to identify any instances of "Mouse Lock" being executed. Pay close attention to the `Company` field for entries containing "Misc314," as this could indicate legitimate or suspicious use of the software.

  - **Analyze Command-Line Arguments:** Examine command-line inputs associated with the "Mouse Lock" process to determine if any unusual or suspicious parameters are being employed. Look for anomalies that could indicate malicious intent.

  - **Check User Activity Logs:** Assess user behavior and activity during the time "Mouse Lock" was active. Look for signs of unusual credential input or any unauthorized access attempts that correlate with "Mouse Lock" execution.

  - **Correlate with Known Threat Intelligence:** Compare identified instances of "Mouse Lock" usage with threat intelligence feeds to understand if there are known malicious campaigns leveraging this tool. Verify if the software version in use aligns with legitimate distributions.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of credential access and sensitive data collection associated with the use of "Mouse Lock." While the tool itself can have legitimate applications, any unauthorized execution raises significant concerns about potential malicious activities.

  ### Blind Spots and Assumptions
  The detection logic assumes that any execution of the "Mouse Lock" software is potentially malicious, but it may capture legitimate uses that should be investigated separately. There may be gaps in detection coverage if process creation logs are not properly configured to include all executed commands or if software installations are absent from relevant monitoring systems. For the alert to function effectively, it's essential that process creation logs are enabled across all relevant endpoints, and that rules for highlighting suspicious activity are established and regularly updated.

