note: |
  ### Technical Context

  This Sigma rule detects the invocation of the PowerShell cmdlet `Add-WindowsCapability`, which is commonly used to enable additional Windows features such as OpenSSH. Attackers may leverage this cmdlet to install unauthorized capabilities on a compromised system, potentially allowing for remote access or lateral movement. The relevant MITRE ATT&CK tactic for this behavior is "Execution" (T1203), specifically the technique of "Command and Scripting Interpreter" (T1059).

  Primary telemetry sources include Windows Process Creation events (Event ID 4688) alongside command-line arguments captured from the PowerShell or pwsh execution. If used maliciously, the installation of capabilities like OpenSSH can significantly increase the risk of unauthorized access and data exfiltration. It is critical to note that the detection of this cmdlet does NOT inherently confirm malicious activity, as it may also arise from legitimate administrative processes.

  ### Investigation Steps

  - **Identify the source of the command:** Review Security Event ID 4688 logs to confirm the user context running `powershell.exe` or `pwsh.exe`. Check if the context aligns with known administrative roles or legitimate automation practices.

  - **Examine command-line arguments:** Validate the command line from Event ID 4688 for `Add-WindowsCapability` and check for associated capabilities like `OpenSSH.Server` or `OpenSSH.Client`. Installation of these capabilities should be treated with suspicion unless explicitly authorized.

  - **Look for signs of a benign environment:** Determine whether this PowerShell cmdlet is used regularly for legitimate processes in the organization, such as routine feature installation by IT staff. Consult internal documentation on typically used capabilities.

  - **Correlate with additional logs:** Analyze Sysmon Event ID 1 and PowerShell logs for additional abnormal activity patterns or execution of commands preceding or following the detection of `Add-WindowsCapability`. Indicators of compromise may include concurrent suspicious processes or unauthorized file modifications.

  - **Check execution context:** Identify if the command was executed from a standard user account or a non-administrative context. Unauthorized execution from a non-privileged account can indicate potential malicious activity.

  - **Review PowerShell logging configuration:** Ensure that PowerShell logging is set up to capture detailed logs and that relevant event retention policies meet organizational standards for incident response.

  ### Prioritization

  This alert carries a medium severity due to the potential impact of unauthorized features being enabled on critical systems. The likelihood of exploitation is significant, especially with commonly weaponized tools like OpenSSH. Such usage can indicate a broader compromise or escalation attempt.

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logging is not adequately configured or if the cmdlet is commonly used in routine administrative tasks. Legitimate activities may include system administrators installing necessary Windows features for operational requirements. Companion detections that enhance security coverage include monitoring for unauthorized modifications to Windows features via Group Policy or other configuration management tools.

