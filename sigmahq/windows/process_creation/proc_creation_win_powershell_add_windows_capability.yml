logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cmdlet:
    CommandLine|contains: 'Add-WindowsCapability'
  selection_capa:
    CommandLine|contains: 'OpenSSH.'     # For both "OpenSSH.Server" and "OpenSSH.Client"
  condition: all of selection_*
falsepositives:
- Legitimate usage of the capabilities by administrators or users. Add additional
  filters accordingly.
level: medium
note: |
  ### Technical Context
  This detection rule monitors the utilization of the PowerShell cmdlet `Add-WindowsCapability`, which enables the addition of features or components to Windows installations. Notable components that can be added via this cmdlet include the OpenSSH capabilities, which, if misused, could facilitate unauthorized remote access or lateral movement within an organization's environment. An attacker may exploit this cmdlet to install specific features that can further aid in their malicious activities, such as establishing backdoors or exfiltrating data.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), focusing specifically on techniques such as **Command and Scripting Interpreter** (T1059), and potentially **PowerShell** (T1059.001). These techniques indicate that attackers may leverage PowerShell scripting as part of their exploitation strategy to execute malicious commands or enhance their capabilities on compromised systems.

  Primary data sources for this detection include **process creation events** that capture command-line arguments associated with PowerShell execution. These logs are crucial for identifying the specific commands executed during session activity.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine the Windows PowerShell logs for entries involving the `Add-WindowsCapability` cmdlet to identify when and by whom the command was executed.
  - **Analyze Command-Line Arguments**: Focus on the command line details to check if the `OpenSSH` capability was requested or if any other suspicious capabilities were added that could facilitate inappropriate access.
  - **Correlate with User Activity**: Investigate the user account associated with the event to determine if the activity is legitimate or if the account has been compromised or misused. Compare recent Logon events and any existing risk indicators associated with the user.
  - **Check for Related Alerts**: Look for complementary alerts related to suspicious account behavior, privilege escalation attempts, and unauthorized installations that may correlate with the usage of this cmdlet.

  ### Prioritization
  The medium severity of this alert indicates a moderate risk level in an enterprise environment, primarily due to the potential for misuse by an attacker seeking to enhance their capabilities or establish persistence within the network. Given the impact that misconfigurations or unauthorized installations can have on security postures, timely investigation is critical.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the reliance on comprehensive logging configurations for PowerShell activities, as environments without full audit logging may miss important events. The detection logic assumes that command-line arguments will be fully captured in the logs, and does not filter for legitimate administrative actions, which could lead to false positives. Ensuring proper logging settings and adjusting for known legitimate administrative practices may be necessary to improve the efficacy of this detection rule.

