title: Suspicious Script Execution From Temp Folder
id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
status: test
description: Detects a suspicious script executions from temporary folder
references:
- https://www.microsoft.com/security/blog/2021/07/13/microsoft-discovers-threat-actor-targeting-solarwinds-serv-u-software-with-0-day-exploit/
author: Florian Roth (Nextron Systems), Max Altgelt (Nextron Systems), Tim 
  Shelton
date: 2021-07-14
modified: 2022-10-05
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\mshta.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    CommandLine|contains:
    - '\Windows\Temp'
    - '\Temporary Internet'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\Temp'
    - '%TEMP%'
    - '%TMP%'
    - '%LocalAppData%\Temp'
  filter:
    CommandLine|contains:
    - ' >'
    - 'Out-File'
    - 'ConvertTo-Json'
    - '-WindowStyle hidden -Verb runAs'          # VSCode behaviour if file cannot be written as current user
    - '\Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\'         # EC2 AWS
  condition: selection and not filter
falsepositives:
- Administrative scripts
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious script executions originating from known temporary directories on Windows systems, specifically those associated with PowerShell, WScript, CScript, and related executable files. The likely attacker objective includes executing malicious payloads or performing reconnaissance activities by leveraging temporary file structures that may not be closely monitored. This behavior aligns with the MITRE ATT&CK technique "Command and Scripting Interpreter" (T1059). The primary telemetry sources include Windows Process Creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments and process origins.

  If confirmed malicious, this behavior could lead to data exfiltration, unauthorized access, or lateral movement. However, this detection does not confirm malicious intent on its own, as legitimate administrative scripts or applications may also execute in these directories.

  ### Investigation Steps

  - **Review Process Creation Events**: Analyze Security Event ID 4688 and Sysmon Event ID 1 for the executing process. Check if the process originates from `\Windows\Temp`, `\AppData\Local\Temp`, or `%TEMP%`. Compare command-line arguments for anomalies against known administrative tools.

  - **Identify Command-Line Patterns**: Focus on command-line arguments containing redirection operators (e.g., ' >'), or suspicious commands like 'Out-File' or 'ConvertTo-Json'. These can indicate an attempt to create or manipulate files unnoticed.

  - **Examine Contextual Indicators**: Look for the presence of expected scripts or command usage within legitimate files. Administrative scripts may legitimately run from temp folders, particularly those associated with software updates; validate through script path or hash comparison.

  - **Correlate with Security Events**: Cross-reference with any prior or subsequent security events (Event IDs 4624 for logon, 5156 for Windows Filtering Platform events) to evaluate if this script execution is part of a suspicious pattern or series of actions on the host.

  - **Quantify Potential Impact**: Assess which host is impacted (e.g., critical servers vs. user endpoints) and evaluate risk based on asset classification. Higher risk is associated with sensitive environments like domain controllers or servers hosting critical applications.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems and the likelihood of malicious abuse. Script executions from temporary directories are common tactics used in attacks, particularly in lateral movement or privilege escalation scenarios, raising the urgency for thorough investigation.

  ### Blind Spots and Assumptions

  The detection may be limited by benign administrative scripts that execute from temp directories, potentially yielding false positives. Reliable detection requires consistent log configurations; ensure Sysmon is enabled to capture process creation events comprehensively. Certain legitimate applications may trigger similar behavior when performing updates or maintenance. A related detection to consider is excessive script executions in a short time span, which could indicate scripted attacks or automation in use.

