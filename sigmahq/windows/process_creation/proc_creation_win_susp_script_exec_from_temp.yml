title: Suspicious Script Execution From Temp Folder
id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
status: test
description: Detects a suspicious script executions from temporary folder
references:
- https://www.microsoft.com/security/blog/2021/07/13/microsoft-discovers-threat-actor-targeting-solarwinds-serv-u-software-with-0-day-exploit/
author: Florian Roth (Nextron Systems), Max Altgelt (Nextron Systems), Tim Shelton
date: 2021-07-14
modified: 2022-10-05
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\mshta.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    CommandLine|contains:
    - '\Windows\Temp'
    - '\Temporary Internet'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\Temp'
    - '%TEMP%'
    - '%TMP%'
    - '%LocalAppData%\Temp'
  filter:
    CommandLine|contains:
    - ' >'
    - 'Out-File'
    - 'ConvertTo-Json'
    - '-WindowStyle hidden -Verb runAs'          # VSCode behaviour if file cannot be written as current user
    - '\Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\'         # EC2 AWS
  condition: selection and not filter
falsepositives:
- Administrative scripts
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious script execution originating from common temporary file locations, such as Windows Temp directories. Such behavior often indicates a potential malicious activity where threat actors utilize scripting tools to execute harmful commands without detection. Attackers frequently exploit temporary directories to deliver malware or execute payloads hidden from standard security measures. The primary objective behind this technique is typically to gain unauthorized access to sensitive data, maintain persistence within the environment, or conduct lateral movement.

  This behavior aligns with several MITRE ATT&CK tactics and techniques, particularly with the **Execution** tactic (TA0002) and the **Command-Line Interface** technique (T1059). By leveraging tools like PowerShell, WScript, or MSHTA, attackers can execute scripts stealthily and manipulate system processes. The primary data sources needed to support this detection include process creation events that log the execution details of scripts alongside relevant command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Begin by examining the logs for process creation to identify instances of `powershell.exe`, `pwsh.exe`, `mshta.exe`, `wscript.exe`, or `cscript.exe` executing commands from the specified temporary directories.

  - **Analyze Command-Line Arguments:** Focus on command-line arguments associated with detected scripts, especially those leading to redirection (` >`), file output (`Out-File`), or attempts to execute scripts with elevated privileges (`-WindowStyle hidden -Verb runAs`).

  - **Check for Anomalies in Temp File Usage:** Investigate unusual or unexpected files in the `C:\Windows\Temp` and user-specific temp directories, especially for file extensions like `.ps1`, `.vbs`, or other script types that typically aren't present in those locations under normal operations.

  - **Correlate with Other Security Events:** Look for additional indicators of compromise (IoCs), such as related network connections or suspicious behavior patterns occurring around the same timeframe as the detected script execution.

  ### Prioritization
  Given the high potential for malicious intent behind scripts executed from temporary folders, this alert should be prioritized as high severity in an enterprise environment. The likelihood of threat actors employing these tactics for various malicious activities, including data exfiltration or system compromise, necessitates immediate attention.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage pertaining to non-standard script execution methods or scripts located in non-temporary directories. The rule assumes that potentially malicious scripts will be executed through commonly used tools such as PowerShell or WScript. Furthermore, if logging configurations do not capture all relevant command-line executions or process creation events, this alert may lead to missed detections. Ensuring comprehensive logging for process creations and associated command-line arguments across the environment is essential for this alert’s effectiveness.

