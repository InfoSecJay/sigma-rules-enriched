note: |
  ### Technical Context

  This rule detects the creation of a Delegated Managed Service Account (DMSA) using the `New-ADServiceAccount` PowerShell cmdlet in specific Organizational Units (OUs). Such behavior is indicative of an adversary exploiting the BadSuccessor vulnerability, which can lead to privilege escalation within Active Directory (ID T1078.002). The primary telemetry source required is Windows process creation logs (Event ID 4688) capturing PowerShell command executions. If this activity is malicious, it opens up unauthorized access paths and escalated privileges, undermining the integrity of the AD environment. It's key to note that this detection alone does not confirm malicious intent without additional contextual information regarding the user executing the command.

  ### Investigation Steps

  - **Review event logs for new DMSA creation events:** Search for Security Event ID 4688 with the `New-ADServiceAccount` command in the command line field. Check the User field for unusual accounts, as only authorized administrators should perform this action under expected administrative practices.

  - **Identify the user executing the command:** Validate the legitimacy of the user account against your organization’s records. The presence of a non-administrative user or a low-privilege account initiating DMSA creation raises suspicion.

  - **Evaluate the OU where the account was created:** Confirm if the OU is one typically used for service accounts. Creation in sensitive OUs (e.g., those associated with critical infrastructure) is particularly concerning.

  - **Check for additional indicators of compromise:** Look for subsequent activities linked to this new DMSA, such as unusual authentication patterns, access to sensitive systems, or commands run by the account. This should involve reviewing logs from domain controllers and lateral movement observations.

  - **Assess changes to group memberships:** Query Active Directory for changes in group memberships for the user account that created the DMSA. Any unauthorized elevation of privileges or addition to critical groups is a strong indicator of malicious intent.

  ### Prioritization

  This alert has a medium severity level. The creation of a DMSA can indicate a significant security risk, especially if done by unauthorized users. Given the critical nature of privileged accounts, the likelihood of malicious activity using this tactic is high, making it important for prompt investigation.

  ### Blind Spots and Assumptions

  The detection is limited as it can be evaded through PowerShell script obfuscation or executing commands through legitimate administrator accounts. Accurate detection requires full logging enabled for PowerShell, including script block logging. Legitimate service account provisioning processes may inadvertently trigger this alert, particularly in environments transitioning to newer Windows Server versions. Monitoring for related detections, such as suspicious changes in Active Directory group memberships (MITRE ID T1098), will reinforce coverage and help identify potential abuse scenarios.

