note: |
  ### Technical Context

  This rule detects the creation of a delegated managed service account (dMSA) using the `New-ADServiceAccount` PowerShell cmdlet in specific organizational units (OUs). This behavior can indicate an attempt by an attacker to exploit the BadSuccessor privilege escalation vulnerability in Windows Server 2025, allowing unauthorized users to gain elevated privileges within an Active Directory environment. The relevant MITRE ATT&CK techniques are Privilege Escalation (T1078.002) and Persistence (T1098).

  The primary telemetry sources for this detection include Windows Security logs and PowerShell execution logs, specifically focusing on command-line activity within PowerShell. If exploited, malicious activity could lead to significant security impacts, such as unauthorized access to sensitive systems and data manipulation. Importantly, this detection does NOT confirm a breach on its own; further investigation is required to establish the context of the account creation.

  ### Investigation Steps

  - **Review account creation logs**: Check Windows Security Event ID 4720 to verify if the account creation aligns with the alert. Look specifically for any unusual attributes (e.g., account created by a non-admin user).

  - **Inspect PowerShell activity**: Collect and analyze PowerShell logs (Event ID 4104) to view the executed command line. Confirm if the `New-ADServiceAccount` cmdlet was executed with suspicious parameters or from unexpected user accounts.

  - **Identify account ownership**: Cross-reference the creating user’s ID against legitimate administrators in your environment. Note any accounts that do not normally manage service accounts or have administrative privileges.

  - **Check OU permissions**: Validate the permissions for the specific OUs where the dMSA was created. Legitimate changes should correlate with expected administrative actions in those OUs.

  - **Assess host roles and asset criticality**: Determine if the creation event occurred on a critical server or within a sensitive OU. Higher impact and risk should be prioritized for immediate investigation.

  - **Look for previous malicious indicators**: Review for any prior suspicious activity tied to the same user or system, especially around the time the dMSA was created, to identify patterns or repeat incidents.

  ### Prioritization

  This alert should be treated with medium severity as it involves the creation of an account that could potentially escalate privileges if exploited. The likelihood of malicious abuse is elevated, given the context of the creation occurring in a manner indicative of the BadSuccessor vulnerability exploitation. This behavior is not common in standard administrative operations.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrators coordinating normal service account creation, which could trigger false positives. This detection relies on comprehensive PowerShell audit logging and accurate user permissions in Active Directory. Additionally, legitimate administrative scripts or tools using `New-ADServiceAccount` within authorized contexts may inadvertently trigger alerts. A related detection to consider is any non-standard use of PowerShell cmdlets or scripts that modify Active Directory objects, which strengthens coverage against other potential privilege escalation techniques.

