logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: 'reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_delete:
    CommandLine|contains: ' delete '
  selection_key:
        # Add specific services if you would like the rule to be more specific
    CommandLine|contains: '\SYSTEM\CurrentControlSet\services\'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of `reg.exe` commands that include the "delete" flag targeting service registry keys in a Windows environment. Such activity is often indicative of an attacker attempting to disable or remove security controls, such as antivirus services, to evade detection and maintain persistence within a compromised system. Understanding the execution of these commands is critical for identifying potential threats aiming to manipulate Windows services.

  The key tactics being observed here are **Defense Evasion** (T1562) and specifically the technique **Impair Defenses: Disable or Modify Tools** (T1562.001). Attackers often leverage system utilities like `reg.exe` to carry out their objectives without raising immediate suspicion or triggering security alarms.

  The primary data source for this detection is process creation events, which record the command lines used to execute processes on Windows machines. This information helps in identifying not only the use of `reg.exe` but also any associated parameters that could suggest malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for `reg.exe` executions, focusing on the command line arguments used to identify any patterns or suspicious usage with the "delete" flag.

  - **Correlate with Service Changes**: Cross-reference detected deletions with service status logs to ascertain if any critical services, especially security products, have been removed or disabled, which could indicate a larger compromise.

  - **Analyze Execution Context**: Investigate the user context under which `reg.exe` was executed. Look for anomalies, such as administrative privileges being used by non-administrative accounts or execution from unusual locations.

  - **Check for Related Logs**: Gather logs from endpoint protection platforms and Windows Event Logs to find any other unusual activity occurring around the same timeframe as the detected command, looking for additional indicators of compromise.

  ### Prioritization
  The alert is classified as high severity due to the critical nature of potentially removing security tools from endpoints, which significantly increases the risk of further compromise and malware persistence in an enterprise environment.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility that an attacker could use other methods or tooling to achieve similar outcomes without triggering this specific detection rule. It also assumes that all relevant process creation logs are enabled and accessible; if logging is incomplete or misconfigured, detections may be missed. Additionally, if `reg.exe` is executed in a way that is obfuscated or manipulated to avoid detection, such actions may not be captured by this rule.

