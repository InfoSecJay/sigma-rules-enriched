logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: 'reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_delete:
    CommandLine|contains: ' delete '
  selection_key:
        # Add specific services if you would like the rule to be more specific
    CommandLine|contains: '\SYSTEM\CurrentControlSet\services\'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of **reg.exe** commands that include the "delete" flag targeting Windows service registry keys. This behavior is often utilized by attackers to disable or uninstall security software services, which aligns with **MITRE ATT&CK technique**: **T1562.001: Disabling Security Tools**. The primary telemetry source for this detection is process creation logs, specifically focusing on command-line arguments passed to the reg.exe utility. If malicious, this action can significantly reduce the security posture of the affected system by rendering endpoint protection inoperative. It is important to note that this detection does NOT confirm that an attack has occurred on its own; it only indicates an attempt to alter system services.

  ### Investigation Steps

  - **Check Command Line Arguments:** Review the process creation logs for **Event ID 4688** or **Sysmon Event ID 1** to confirm command line arguments for **reg.exe**. Look specifically for strings such as " delete " and any registry key references ending with "\SYSTEM\CurrentControlSet\services\".

  - **Identify Legitimate Use Cases:** Assess whether **reg.exe** commands are typically used in the environment. Document any expected processes that may invoke deletions on service registry keys, particularly during software updates or uninstallation procedures.

  - **Correlate with Service Status:** Cross-reference the deleted service with service status logs (e.g., **PowerShell Get-Service** output or Windows Event ID 7045 for service creation). Check if the service was indeed running prior to the deletion event to verify potential malicious activity.

  - **Look for Related Security Breach Indicators:** Review surrounding logs for suspicious activities, such as unauthorized access attempts or executables running from unexpected directories that executed before the delete command.

  - **Investigate Host Role and Environment:** Consider the role of the affected host. If it is an endpoint with critical functions (e.g., a gateway or server running security services), prioritize the investigation as higher risk.

  - **Validate File Integrity:** Check for file creation or modification logs in the relevant directories (e.g., **Event ID 4663** for access to registry keys) to identify any unexpected changes to service executables that align with the deletion of registry entries.

  ### Prioritization

  This alert has a **high severity** due to its potential impact on the organization’s cybersecurity posture. The likelihood of malicious abuse is significant as attackers often aim to disable security tools. Furthermore, this behavior is commonly weaponized in targeted attacks, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if logging policies do not capture detailed command line arguments or if reg.exe is executed from non-standard locations. Evasion techniques such as using PowerShell to modify services directly may trigger similar behaviors without engaging reg.exe. Legitimate administrative actions, such as service installations or updates, might also lead to this alert being triggered. A related detection to consider is service creation events (e.g., **Event ID 7045**) that can provide context around the creation or alteration of services post-deletion.

