logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: 'reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_delete:
    CommandLine|contains: ' delete '
  selection_key:
        # Add specific services if you would like the rule to be more specific
    CommandLine|contains: '\SYSTEM\CurrentControlSet\services\'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `reg.exe` command with the "delete" flag specifically targeting Windows service registry keys, a common technique used by attackers to disable security software or suppress service functionality. The likely attacker objective is to impair the defenses of the target system by removing critical service entries, making the environment more susceptible to further attacks. This behavior relates to the MITRE ATT&CK tactic of Defense Evasion (T10885).

  The primary telemetry source for this detection is Windows process creation logs, specifically leveraging Security Event ID 4688 or Sysmon Event ID 1, which captures command line execution details. If this action is malicious, it could lead to significant compromise of the affected system, especially if an antivirus or endpoint detection service is disabled. However, it is important to note that this detection alone does not confirm that a compromise has occurred; it merely indicates the execution of potentially harmful commands.

  ### Investigation Steps

  - **Examine the command line arguments:** Review the command line associated with this event (Event ID 4688/Sysmon ID 1). Look for `CommandLine` containing `‘delete’` and `\SYSTEM\CurrentControlSet\services\`. Confirm whether the service being targeted is a known security product.

  - **Identify the originating process:** Determine the parent process of the `reg.exe` command. A parent process coming from a legitimate application (like `cmd.exe`) or a known admin tool may indicate benign behavior; otherwise, it could suggest malicious intent.

  - **Check associated user account activity:** Review the Security logs for the user account executing `reg.exe`. If the account has recently exhibited unusual behavior, like multiple failed logins (Event ID 4625) or excessive privilege escalations (Event ID 4672), it may signify a compromised environment.

  - **Validate the affected service:** Investigate the specific service(s) mentioned in the action. Check if legitimate maintenance or troubleshooting has recently occurred or if an automated task managing services happened around the same time, particularly on critical systems.

  - **Research file paths and hashes:** If applicable, analyze any recently created files or changes made to services. Checking the exact file path and calculating its hash against known file repositories (e.g., VirusTotal) can provide insights into whether the execution of `reg.exe` is associated with known malware.

  ### Prioritization

  This alert should be prioritized as high severity, particularly on systems critical for enterprise operations, such as domain controllers or endpoint security solutions. Given the potential for an attacker to disable defenses using this technique, there is a high likelihood that this behavior is indicative of malicious activity.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques where attackers use alternative methods to modify registry values, such as PowerShell scripts, or use elevated privileges to modify services without using `reg.exe`. Reliable detection requires proper logging settings in place, including Sysmon and auditing of process creation events. Legitimate administrative tasks or software updates may also trigger alerts, potentially causing false positives. Strengthening detection with companion rules for unusual PowerShell activities (e.g., T1059.001) can help provide broader coverage against similar threats.

