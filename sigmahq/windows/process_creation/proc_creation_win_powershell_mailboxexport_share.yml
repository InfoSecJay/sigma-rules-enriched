title: Suspicious PowerShell Mailbox Export to Share
id: 889719ef-dd62-43df-86c3-768fb08dc7c0
status: test
description: Detects usage of the powerShell New-MailboxExportRequest Cmdlet to exports
  a mailbox to a remote or local share, as used in ProxyShell exploitations
references:
- https://youtu.be/5mqid-7zp8k?t=2481
- https://blog.orange.tw/2021/08/proxylogon-a-new-attack-surface-on-ms-exchange-part-1.html
- https://peterjson.medium.com/reproducing-the-proxyshell-pwn2own-exploit-49743a4ea9a1
- https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/
author: Florian Roth (Nextron Systems)
date: 2021-08-07
modified: 2022-10-26
tags:
- attack.exfiltration
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'New-MailboxExportRequest'
    - ' -Mailbox '
    - ' -FilePath \\\\'
  condition: selection
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies the usage of the PowerShell cmdlet `New-MailboxExportRequest`, particularly when it is invoked to export mailbox data to a local or remote network share. This activity is significant because it may indicate the exfiltration of sensitive data, often exploited in attacks targeting Microsoft Exchange Server, such as the ProxyShell exploits noted in various security incidents. Attackers may use this cmdlet to gather and export email communications that can contain sensitive information for further exploitation or disclosure.

  The primary objective of such activities by threat actors aligns with data exfiltration, making this a serious concern in any enterprise environment. The exploitation of the `New-MailboxExportRequest` cmdlet may signal an attempt to exploit underlying vulnerabilities within Exchange Server configurations or to leverage compromised credentials for unauthorized data access. Relevant MITRE ATT&CK tactics/techniques linked to this rule include:
  - **Exfiltration** (TA0010)
  - **Exfiltration Over Command and Control Channel** (T1041)
  - **Data Staged** (T1074)

  For effective detection of this behavior, primary data sources to analyze include process creation logs, which will reveal command-line arguments and contexts in which these cmdlets were executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate recent process creation logs for instances of PowerShell executing `New-MailboxExportRequest` commands, specifically looking for unusual or unauthorized sources of command execution.

  - **Analyze Command-Line Arguments**: Focus on the command-line arguments used in `New-MailboxExportRequest`, particularly any entries that include `-Mailbox` and `-FilePath \\\\`, paying attention to the document paths and destination shares for anomalies.

  - **Inspect Permissions and Roles**: Assess user account permissions and roles, ensuring that only authorized users can perform mailbox exports. This may involve checking the configurations of Exchange Server for proper role assignments.

  - **Correlate with Network Activity**: Cross-reference the process creation data with network activity logs to see if there were any data transfers to the described remote file shares, which may further indicate an ongoing exfiltration attempt.

  ### Prioritization
  This alert is classified as critical due to the potential impact of unauthorized mailbox access and the high likelihood of data leakage. The misuse of mailbox export functionality can lead to significant data breaches, especially if sensitive organizational communications are involved.

  ### Blind Spots and Assumptions
  This detection rule may have gaps related to account compromise where an authorized user legitimately performs mailbox export requests. It assumes that the activity will be logged effectively and that all relevant processes will capture command-line arguments appropriately. Required logs for optimal detection include comprehensive PowerShell logging configurations in PowerShell's module settings and monitoring capabilities, which must be enabled for the rule to function effectively.

