note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell command `New-MailboxExportRequest`, which is used to export mailboxes to a specified file path, particularly to remote shares. The behavior typically indicates data exfiltration efforts, specifically targeting Microsoft Exchange environments, which may align with the objectives of an attacker aiming to extract sensitive email data. This behavior is reflective of the "Exfiltration" tactic within the MITRE ATT&CK framework, specifically technique T1041 (Exfiltration Over Command and Control Channel).

  The primary telemetry source for this detection is the Windows process creation logs, specifically monitoring for Event ID 4688, which captures process creation events, including the command line arguments. If this behavior is indeed malicious, it could lead to unauthorized access to sensitive corporate emails and other critical data. However, it is important to note that the detection of this command alone does not confirm malicious intent, as legitimate administrative tasks may also invoke similar command execution.

  ### Investigation Steps

  - **Check Command Line Arguments:** Review Event ID 4688 logs for the presence of `New-MailboxExportRequest` combined with `-Mailbox` and `-FilePath \\\\`. Malicious behavior will show remote paths indicating potential exfiltration, while legitimate use may involve local paths or well-known internal shares.

  - **Identify User Context:** Cross-reference the user executing the command against known admin accounts. Malicious indicators may include non-privileged users initiating `New-MailboxExportRequest`, especially if this user does not typically conduct mailbox exports.

  - **Assess the Targeted Share:** Analyze the `-FilePath` in the command execution logs. Exporting to unusual or external shares (e.g., starting with `\\\\` pointing to an offsite location) is a strong indicator of potential exfiltration.

  - **Review Historical Activity:** Investigate past mailbox export requests by querying Exchange logs (Event ID 6000 for mailbox exports). Frequent exports by the same user or to the same external share may indicate a pattern consistent with malicious behavior.

  - **Validate Anti-Virus and Logging Capabilities:** Confirm that endpoint protection is active and logs for PowerShell execution commands are enabled. Gaps in these logs could allow malicious activity to go unnoticed.

  ### Prioritization

  This alert should be treated with critical priority due to the potential impact on sensitive data contained in mailboxes and the high likelihood of abuse resulting in data exfiltration. The specific nature of the command makes it a known vector for exploitation as seen in recent attack campaigns like ProxyShell, increasing its importance for immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker uses obfuscation techniques within the PowerShell command or employs alternative means to access mailbox data, such as leveraging legitimate administrative actions falsely. Logs from Exchange and Windows event sources must be properly configured and monitored for this detection to be effective. It is important to consider that legitimate administrative tasks for data migrations or audits may also trigger this rule. A related detection could involve monitoring for abnormal PowerShell usage patterns, such as extensive script executions via Windows Event ID 4104, reinforcing coverage and further investigation techniques.

