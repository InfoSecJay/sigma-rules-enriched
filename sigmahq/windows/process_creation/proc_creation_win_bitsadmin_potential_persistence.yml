logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\bitsadmin.exe'
  - OriginalFileName: 'bitsadmin.exe'
  selection_cli_notify_1:
    CommandLine|contains: '/SetNotifyCmdLine'
  selection_cli_notify_2:
    CommandLine|contains:
    - '%COMSPEC%'
    - 'cmd.exe'
    - 'regsvr32.exe'
  selection_cli_add_1:
    CommandLine|contains: '/Addfile'
  selection_cli_add_2:
    CommandLine|contains:
    - 'http:'
    - 'https:'
    - 'ftp:'
    - 'ftps:'
  condition: selection_img and (all of selection_cli_notify_* or all of 
    selection_cli_add_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the scheduling of malicious commands via the Background Intelligent Transfer Service (BITS), specifically identifying the use of `bitsadmin.exe` to create jobs that can execute arbitrary commands after downloading files. Attackers leverage BITS to maintain persistence and execute malware in a stealthy manner, ideally after successfully downloading malicious payloads.

  This activity falls under the MITRE ATT&CK tactics of Persistence (T1197) and Execution, indicating a targeted attempt by adversaries to maintain control over compromised systems. The primary telemetry source is Windows process creation logs, particularly monitoring Event ID 4688 for the execution of `bitsadmin.exe` with specific command line arguments. If left unchecked, these behaviors can lead to malware installation, subsequent data exfiltration, or lateral movement within the environment. Notably, detection of this behavior alone does not confirm a breach; it only indicates a possible misuse of BITS.

  ### Investigation Steps

  - **Review process creation logs**: Check for Event ID 4688 indicating the execution of `bitsadmin.exe`. Log sources should include Security logs with fields for NewProcessName and CommandLine to identify the exact command used.

  - **Analyze command line arguments**: Specifically, look for combinations of `/SetNotifyCmdLine` with executing commands like `cmd.exe` or `regsvr32.exe` in the CommandLine field. If observed together, this may signify an adversarial use of BITS.

  - **Verify BITS job details**: Utilize the command `bitsadmin /list` on the affected host to enumerate active BITS jobs, which reveals job names and their statuses. Identify any jobs that are set to execute suspicious commands post-download.

  - **Determine expected BITS usage**: Check for legitimate BITS activities that typically involve scheduled downloads from trusted URLs or Workstation-related operations (e.g., updates). Confirm that the command does not call for malicious domains or executable formats like `.exe` or `.dll`.

  - **Identify malicious indicators**: Look for patterns in command lines containing `http:` / `https:` or `ftp:` directives that lead to known compromised IPs or URLs. This can flag a high-confidence indication of malicious behavior if matched.

  - **Assess related scheduled tasks**: Investigate for any new Windows Scheduled Tasks that depend on the BITS jobs identified. Legitimate BITS activities would not create additional tasks that execute non-system commands.

  ### Prioritization

  This alert has medium severity due to its potential impact on system integrity if a malicious command is executed, and the technique is known for evading traditional detection methods. While BITS is a legitimate service, its misuse for dead drop or persistence strategies raises the likelihood of malicious abuse significantly.

  ### Blind Spots and Assumptions

  Detection may be limited by the users’ permissions and legitimate administrative use of BITS for downloads. Some common evasion techniques include the manipulation of BITS jobs without triggering alarms through non-intrusive command executions. This alert could be falsely triggered by legitimate administrative workflow management that uses BITS for updates or installations. A complementary detection rule focusing on abnormal file download behaviors from non-standard endpoints would enhance coverage against false negatives.

