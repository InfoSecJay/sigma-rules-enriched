logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\bitsadmin.exe'
  - OriginalFileName: 'bitsadmin.exe'
  selection_cli_notify_1:
    CommandLine|contains: '/SetNotifyCmdLine'
  selection_cli_notify_2:
    CommandLine|contains:
    - '%COMSPEC%'
    - 'cmd.exe'
    - 'regsvr32.exe'
  selection_cli_add_1:
    CommandLine|contains: '/Addfile'
  selection_cli_add_2:
    CommandLine|contains:
    - 'http:'
    - 'https:'
    - 'ftp:'
    - 'ftps:'
  condition: selection_img and (all of selection_cli_notify_* or all of 
    selection_cli_add_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious use of the Background Intelligent Transfer Service (BITS) to create persistence mechanisms on Windows systems. It identifies when an attacker schedules a job using BITS that includes commands capable of executing binaries after a successful download, which could facilitate further compromise. The likely attacker objective is to maintain long-term access to a system without raising alarm through traditional vectors.

  The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), and the technique is **BITS Jobs** (T1197). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line execution involving BITS. If this detection indicates malicious activity, it could lead to severe security incidents such as data breaches or system takeovers. However, this detection does NOT confirm that a successful exploit or further malicious activity has taken place on its own.

  ### Investigation Steps

  - **Review recent BITS jobs created:** Check for Event ID 4688 or Sysmon Event ID 1 related to `bitsadmin.exe`. Look specifically for command lines containing `/SetNotifyCmdLine` and `/AddFile`. Compare against the last successful job run times to see if they align with suspicious activity.

  - **Analyze the command line for potential indicators:** Search for command lines that include known malicious patterns such as `cmd.exe` or `regsvr32.exe`. Malicious activity may include unusual scheduling times or command arguments that appear abnormal for typical BITS usage.

  - **Correlate with normal operations:** Confirm legitimate usage of BITS jobs by referencing corporate scripts or deployment procedures that may utilize `/SetNotifyCmdLine`. Understanding organizational context can help in distinguishing benign activity from malicious attempts.

  - **Check for download sources:** Review logs for any URLs in BITS jobs that begin with `http:`, `https:`, `ftp:`, or `ftps:`. High confidence in malicious intent may arise if these links point to suspicious domains or are known to be associated with malware distribution.

  - **Validate malware execution artifacts:** Look for the execution of binary files as per the scheduled command in BITS jobs. Tracking file creation timestamps, such as via the New or Modified fields in the file system logs, can indicate whether further payloads have been executed after download.

  - **Review system criticality and historical activity:** Identify the affected system's role within the environment (e.g., domain controller, financial server) and check for any prior alerts or anomalies related to the system’s use of BITS, as this may indicate an ongoing attack pattern.

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact if exploited on critical systems. The likelihood of malicious abuse is moderate, as BITS can be weaponized by adversaries for stealth and persistence, which has been observed in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate processes to trigger this rule during normal operations, such as scheduled software updates or system maintenance that rely on BITS. Ensuring reliable detection requires comprehensive logging configurations, including enabling Sysmon to capture more detailed process information. Common evasion techniques may involve using custom binaries or manipulating BITS commands to avoid detection. A companion detection to consider is monitoring Windows Task Scheduler for abnormal job creations (related technique T1060).

