title: Monitoring For Persistence Via BITS
id: b9cbbc17-d00d-4e3d-a827-b06d03d2380d
status: test
description: |
  BITS will allow you to schedule a command to execute after a successful download to notify you that the job is finished.
  When the job runs on the system the command specified in the BITS job will be executed.
  This can be abused by actors to create a backdoor within the system and for persistence.
  It will be chained in a BITS job to schedule the download of malware/additional binaries and execute the program after being downloaded.
references:
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
- http://0xthem.blogspot.com/2014/03/t-emporal-persistence-with-and-schtasks.html
- https://isc.sans.edu/diary/Wipe+the+drive+Stealthy+Malware+Persistence+Mechanism+-+Part+1/15394
author: Sreeman
date: 2020-10-29
modified: 2024-01-25
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1197
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\bitsadmin.exe'
  - OriginalFileName: 'bitsadmin.exe'
  selection_cli_notify_1:
    CommandLine|contains: '/SetNotifyCmdLine'
  selection_cli_notify_2:
    CommandLine|contains:
    - '%COMSPEC%'
    - 'cmd.exe'
    - 'regsvr32.exe'
  selection_cli_add_1:
    CommandLine|contains: '/Addfile'
  selection_cli_add_2:
    CommandLine|contains:
    - 'http:'
    - 'https:'
    - 'ftp:'
    - 'ftps:'
  condition: selection_img and (all of selection_cli_notify_* or all of selection_cli_add_*)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors for potential abuse of the Background Intelligent Transfer Service (BITS) on Windows systems. BITS can be exploited by malicious actors to schedule commands after the download of malware or other unauthorized binaries, allowing for persistence within a target environment. This type of behavior is indicative of advanced threat actors attempting to establish backdoors or maintain access after an initial compromise. The detected command line arguments, particularly those involving `SetNotifyCmdLine` and `/AddFile`, suggest the malicious installation of payloads that may execute stealthy or automated tasks without user interaction.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence**: Establishment of a backdoor through the utilization of BITS jobs (T1197).
  - **Defense Evasion**: Use of legitimate services and features to mask malicious activity and behavior.

  The primary sources of telemetry for this detection include process creation logs from Windows, which will capture detailed information about processes and their command-line arguments, providing insight into any potentially malicious use of BITS.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for `bitsadmin.exe` process creations and examine the associated command lines for suspicious patterns, such as `/SetNotifyCmdLine` or `/AddFile` with URLs indicating potential malicious downloads.
  - **Correlate with Recent Downloads**: Investigate any corresponding BITS jobs and associate download activities to determine if any files downloaded correspond to known malicious artifacts or unusual binaries.
  - **Check for Scheduled Tasks or Services**: Look for any related scheduled tasks or services set to execute following the completion of a BITS job to further uncover persistence mechanisms utilized by the attacker.
  - **Identify Relevant Network Traffic**: Evaluate network traffic for connections to external URLs involved in BITS jobs that may suggest data exfiltration or additional downloads of potentially malicious content.

  ### Prioritization
  This alert should be considered medium priority due to its potential impact on system integrity and the likelihood of being used as a persistence mechanism for malware. The exploitation of a legitimate Windows feature by an attacker poses significant risks, making it essential to investigate promptly.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if BITS jobs are created without involving `bitsadmin.exe` or if other legitimate processes are leveraged for similar behaviors. The detection logic assumes that malicious actors will utilize common command-line flags, which may not always be the case. To effectively leverage this alert, ensuring that logging for process creation is enabled and properly configured on all endpoints is crucial for capturing relevant activity.

