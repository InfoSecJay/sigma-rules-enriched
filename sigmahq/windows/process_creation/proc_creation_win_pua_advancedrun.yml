note: |
  ### Technical Context
  This detection rule is designed to identify the execution of the AdvancedRun utility, which is often utilized by attackers to execute programs with elevated privileges using the LocalSystem account. This behavior may serve dual purposes: legitimate system administration tasks and malicious activities, such as executing payloads with high privileges to bypass security controls. Attackers leveraging AdvancedRun could aim to maintain persistence, execute harmful software, or evade detection.

  Relevant MITRE ATT&CK techniques associated with this detection include:
  - **T1564.003: Dll Search Order Hijacking** - Using AdvancedRun to load malicious DLLs.
  - **T1134.002: Access Token Manipulation** - Facilitating the execution of programs with altered privileges.
  - **T1059.003: Windows Command Shell** - Executing commands via the command shell with elevated privileges.

  The primary data sources for effective detection include process creation logs from Windows systems, which reveal suspect command line arguments, as well as context around the invocation of the AdvancedRun executable.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine process creation logs for instances where `AdvancedRun.exe` was executed. Pay special attention to the command line arguments for signs of privilege escalation or abnormal usage patterns.
  - **Analyze Command Line Parameters:** Look for command line parameters that involve `/RunAs`, `/Run`, and `/EXEFilename`, which may indicate potential misuse of the tool for executing malicious payloads.
  - **Check System and Security Logs:** Investigate Windows Event Logs for related events, particularly security logs that might correlate with privilege escalation attempts around the same time `AdvancedRun.exe` was initiated.
  - **Assess Additional Contextual Information:** Gather details about user accounts associated with the execution of AdvancedRun, including their roles and whether any recent privilege changes or unusual behaviors were observed.

  ### Prioritization
  The alert is considered medium severity due to the potential for significant impact if the tool is misused to facilitate malicious actions, alongside the increased likelihood of advanced threats leveraging system utilities for evasion and privilege escalation in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if AdvancedRun is executed with legitimate arguments that do not trigger the detection conditions. Additionally, the detection logic assumes that all occurrences of the utility’s execution linked to questionable behavior are malicious, which may lead to false positives. Adequate logging configurations must be established to capture all relevant process creation events for successful alerting on this detection.

