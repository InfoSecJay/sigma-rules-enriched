note: |
  ### Technical Context

  This rule detects the execution of the AdvancedRun utility, a tool often leveraged to execute commands with elevated privileges under different user contexts, specifically the LocalSystem account. The likely objective of an attacker using AdvancedRun is to execute malicious payloads or commands without triggering typical security controls associated with standard user sessions. This behavior aligns with the MITRE ATT&CK tactic for Execution (TA0002) and the technique for Command and Scripting Interpreter (T1059.003) focused on platform-specific commands.

  The primary telemetry source for this detection is Windows process creation logs, specifically Event ID 4688. If malicious, the use of AdvancedRun could facilitate unauthorized access or manipulation of system resources, potentially leading to a larger compromise. Importantly, this detection does NOT confirm malicious intent on its own; AdvancedRun can also be used for legitimate administrative tasks.

  ### Investigation Steps

  - **Verify process execution**: Check for Event ID 4688 where the `New Process Name` is `AdvancedRun.exe`. Note any associated `Parent Process ID` to identify the initiating process.

  - **Examine command-line arguments**: Review the command line in the Event ID 4688 logs for the presence of `/EXEFilename`, `/Run`, `/RunAs`, and `/CommandLine`. Malicious executions will often include unusual or obfuscated commands.

  - **Assess the user context**: Determine if the execution is tied to a user account with administrative privileges. Legitimate usage typically includes system administrators executing scripts for maintenance, which involves a clearer command structure and context.

  - **Identify high-confidence malicious indicators**: Look for instances where AdvancedRun is executed with suspicious command-line options, such as the `/WindowState 0` option, which may indicate attempts to hide the process.

  - **Review additional context**: Evaluate surrounding process activity—especially any processes spawned by AdvancedRun. This can reveal potential follow-on actions indicative of malicious behavior.

  - **Confirm related artifacts**: Validate if any potentially malicious files were created or modified around the same time as the execution. Check file creation timestamps in file system logs to confirm potential exfiltration or malicious downloads.

  ### Prioritization

  This alert is of medium severity as it may indicate an attacker attempting to escalate privileges or execute payloads stealthily on a critical system. The likelihood of malicious use is moderate, as AdvancedRun can be weaponized in compromised environments, especially those lacking robust monitoring over administrative tools.

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of legitimate administrative activities that could trigger the alert, such as routine maintenance tasks. Additionally, if logging settings are not properly configured to capture all relevant process creations, this may lead to overlooked incidents. It’s also important to consider that attackers may attempt to use other similar utilities for obfuscation. Related detections to enhance coverage include monitoring for `PsExec` or similar tools under the same execution context.

