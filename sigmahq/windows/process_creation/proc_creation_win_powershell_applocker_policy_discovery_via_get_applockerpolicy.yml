level: low
note: |
  ### Technical Context

  This Sigma rule detects attempts to enumerate AppLocker policies using PowerShell's `Get-AppLockerPolicy` cmdlet, specifically targeting effective, LDAP, or local policy scopes. Determining the configuration of AppLocker policies can assist attackers in bypassing application control and enhancing their privileges on compromised systems. This behavior aligns with the MITRE ATT&CK technique for Policy Discovery (T1518.001).

  Primary telemetry sources include Windows event logs related to process creation, specifically Event ID 4688 (Process Creation) or Sysmon Event ID 1. If malicious activity is confirmed, it could lead to increased unauthorized access or lateral movement within the network. However, this detection does NOT confirm actual exploitation or malicious intent on its own, as legitimate administrative actions may trigger the alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for `powershell.exe` or `pwsh.exe`. Look for command lines containing `Get-AppLockerPolicy` and parameters like `-Effective`, `-LDAP`, or `-Local`. Verify whether the originating user account has a history of administrative tasks.

  - **Identify expected administrator behavior:** Cross-reference the timestamp of the alert with administrative maintenance tasks. Typically, legitimate AppLocker audits occur during scheduled maintenance windows by authorized accounts.

  - **Review user account activity:** Investigate the user account launching the PowerShell command. Check for previous activity related to AppLocker policy management, including assignments, modifications, or intended troubleshooting sessions.

  - **Validate command output:** If possible, retrieve the output of `Get-AppLockerPolicy` invoked by the process in question. Legitimate output should reflect standard policies without anomalies or unusual parameters suggestive of malicious intent.

  - **Examine recent policy changes:** Investigate Windows logs related to AppLocker policy modifications (e.g., Group Policy events). Look for significant changes in policy that may correlate with the alert timing.

  - **Assess host criticality and environment context:** Determine the role of the affected host (e.g., server, endpoint) and its risk based on existing security policy reviews. Compromise of critical infrastructure can heighten the severity of identified threats.

  ### Prioritization

  This alert carries a low severity within an enterprise context due to the likelihood of benign administrative operations triggering it. However, given that policy enumeration is a common precursor to further exploitation or lateral movement, attention is warranted, particularly on critical assets.

  ### Blind Spots and Assumptions

  Detection may fail in environments with disabled logging or absent event collection configurations; ensuring detailed logging is essential for reliable detection. The alert might also trigger from legitimate administrative tasks, such as periodic policy reviews or troubleshooting. A related detection is script execution monitoring focusing on `PowerShell` activities, which may help strengthen overall coverage of suspicious PowerShell use.

