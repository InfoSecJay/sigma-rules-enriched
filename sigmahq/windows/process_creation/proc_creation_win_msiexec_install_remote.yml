logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  selection_remote:
    CommandLine|contains:
    - 'http'
    - '\\\\'
  filter_optional_openoffice:
    CommandLine|contains|all:
    - '\AppData\Local\Temp\OpenOffice'
    - 'Installation Files\openoffice'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of `msiexec.exe` to conduct silent installations of software packages from remote locations, which is a behavior often associated with malicious activity. The attacker's objective may include deploying malware or unauthorized software onto target machines without user consent or awareness, facilitating further exploitation or pre-ransomware activities, as seen in incidents like the Raspberry Robin worm.

  This behavior aligns with the MITRE ATT&CK framework under the tactic "Execution" and technique "Windows Installer Abuse" (T1218.007). The primary telemetry source is Windows process creation logs, specifically looking for `Event ID 4688` and any logs that denote command-line arguments describing the use of `msiexec.exe`. If malicious, such installations may compromise system integrity and confidentiality. Importantly, this detection does NOT confirm that an installation was successful or that the user did not initiate a legitimate installation process.

  ### Investigation Steps

  - **Review the command line parameters:** Check Windows Security Event ID 4688 for the process creation log related to `msiexec.exe`. Look for indicators like `-q`, `-i`, or `-package` combined with remote URLs (`http` or UNC paths). Malicious installations will typically show command lines that do not align with normal user behavior.

  - **Inspect recently installed applications:** Use PowerShell or Windows Event Viewer to review the last installed packages in `Event ID 11724`. Confirm if the installed packages match known baselines or if they are unexpected. Legitimate installations often come from signed executables or recognizable software vendors.

  - **Validate the source of the installation:** If command lines show remote paths, cross-reference with network logs or Web Proxy logs for sources of downloads. Check for common indicators of compromise, like known bad URLs or IPs associated with malware distribution.

  - **Check for persistence mechanisms:** Review scheduled tasks or services on affected systems for entries that may indicate attempts to establish persistence post-installation, particularly those created or modified around the time of the process execution.

  - **Assess user context and account activity:** Determine the user account that initiated the `msiexec.exe` process. Cross-reference with User Logon Events (Event ID 4624) to assess if legitimate users were executing the installation, or if accounts might have been compromised.

  ### Prioritization

  This alert is deemed medium severity within the enterprise context. Its impact is significant if a critical system is compromised, and the likelihood of abuse is heightened given the stealthy nature of remote installations where user awareness is minimal. While this behavior can indicate malicious activity, not all instances are inherently bad, necessitating careful analysis.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete or timely process creation logs, or by evasion techniques where malware masquerades its actions through legitimate-looking command lines. Legitimate situations, such as IT management performing remote software installations, may trigger alerts. Companion detections like monitoring for unusual outbound traffic or unauthorized changes in the application installation logs (e.g., Event ID 11724) can strengthen coverage and validate alerts.

