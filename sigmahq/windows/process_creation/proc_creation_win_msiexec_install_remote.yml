logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  selection_remote:
    CommandLine|contains:
    - 'http'
    - '\\\\'
  filter_optional_openoffice:
    CommandLine|contains|all:
    - '\AppData\Local\Temp\OpenOffice'
    - 'Installation Files\openoffice'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of Msiexec.exe for remote package installation without user interaction, characterized by the presence of specific command-line arguments. The likely attacker objective could involve deploying malware or leveraging vulnerable software in an attempt to pivot within an environment, often seen in pre-ransomware activity. The relevant MITRE ATT&CK techniques include Defense Evasion (T1218.007) for disguising malicious installations and Initial Access (T1071.001) related to the use of external URLs for downloading payloads. The key telemetry sources are Windows Process Creation logs (Event ID 4688) and Sysmon logs for detailed command-line execution context.

  If this behavior is confirmed as malicious, the potential impact includes malware installation, unauthorized software deployment, or even lateral movement within the network. However, this detection does NOT outright confirm that a compromise occurred, as benign applications could also be utilizing similar methods for legitimate purposes.

  ### Investigation Steps

  - **Examine process creation events:** Review Security Event ID 4688 for Msiexec.exe; check for the command line arguments `-i`, `-q`, and any remote URLs present. Filter for instances that do not originate from known internal repositories.

  - **Verify command-line intentions:** Validate command line arguments contained within logs (Sysmon Event ID 1 or Security Event ID 4688). Look specifically for quiet installation flags (`-q`) in conjunction with remote links, which indicate suspicious behavior.

  - **Identify known good applications:** Confirm if the software being installed correlates with known legitimate enterprise applications. Cross-reference the URLs or file paths with the inventory of approved installations.

  - **Look for unauthorized remote URLs:** In any detected command lines, pay particular attention to instances where the installation source is set as an HTTP(S) or UNC path. Legitimate installations typically occur from internal file shares or verified online sources.

  - **Check for repeated occurrences:** Analyze if the alert is part of a broader pattern using historical process creation logs, particularly focusing on related timestamps, as multiple occurrences may indicate a targeting campaign.

  - **Investigate relevant logs for ancillary activities:** Search for lateral movement or privilege escalation indicators (e.g., logins from the machines affected). Look for unusual authentication logs (Event ID 4624) in conjunction with the Msiexec execution to identify behavior that deviates from baseline user activity.

  ### Prioritization

  This alert has medium severity due to the potential for malicious exploitation in environments where Msiexec is used improperly. Given its capacity to automate installations, it could be weaponized for mass deployments of malware. Analysis of remote installation behavior should be prioritized, focusing particularly on critical assets or sensitive roles within the organization.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate third-party software installs, which could trigger similar patterns and lead to false positives. Reliable detection necessitates comprehensive logging from both process creation and Sysmon. IT administrative activities may intentionally trigger this alert, hence clear policies around software deployment are vital. Companion detections such as abnormal network requests (for example, unusual outbound HTTP(S) traffic) can strengthen coverage and provide context around the installation behavior elicited by this rule.

