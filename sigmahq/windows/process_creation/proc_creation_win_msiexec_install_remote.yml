detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  selection_remote:
    CommandLine|contains:
    - 'http'
    - '\\\\'
  filter_optional_openoffice:
    CommandLine|contains|all:
    - '\AppData\Local\Temp\OpenOffice'
    - 'Installation Files\openoffice'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of the Msiexec.exe utility for installing packages from remote locations without user interaction, indicated by quiet installation flags and remote paths. The likely attacker objective is to deploy malicious software through social engineering or exploitation of aftercare vulnerabilities in the affected system, aiming for persistence or further exploitation. This behavior aligns with the MITRE ATT&CK technique T1218.007 (Signed Binary Proxy Execution: Msiexec).

  Key telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which record process executions and their command-line arguments. The security impact is substantial if malicious, as it could lead to unauthorized software installs, exposing sensitive data or creating backdoors. However, this detection does NOT confirm that a malicious installation occurred without additional context, such as the legitimacy of the MSI package installed.

  ---

  ### Investigation Steps

  - **Review process creation logs: ** Analyze Security Event ID 4688 and Sysmon Event ID 1 for instances of Msiexec.exe installation commands. Look for command lines containing both '-i' and '-q' flags along with remote locations (e.g., 'http', '\\\\').

  - **Identify high-confidence malicious indicators: ** Check command lines for the presence of suspicious URLs or UNC paths. For example, installations originating from 'http://malicious.com' or '\\malicious-server\path' are strong indicators of malicious intent.

  - **Examine legitimate usage: ** Compare the command lines against known legitimate MSI installations initiated by system administrators or trusted applications, which typically do not complete quiet installations from remote sources without user interaction.

  - **Cross-reference with application logs: ** Check for application logs (e.g., MSI logs) that might additionally show the context of the installation to ascertain if it's benign or linked with known software systems.

  - **Inspect file system changes: ** Validate any created or modified files in the installation path (e.g., %TEMP%\Installation Files) for backdoor indicators or unwanted applications. Focus on file artifacts linked to the MSI package.

  ---

  ### Prioritization

  This alert carries a medium severity due to the potential for serious impacts if misused, particularly on critical systems vulnerable to exploitation via remote installations. The likelihood of malicious abuse is significant given the prevalence of such tactics in intrusion attempts and ransomware distributions.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by adversary techniques that use legitimate-looking installations or obfuscate the command line arguments. Reliable detection relies on enabling comprehensive logging via Group Policy to capture all necessary telemetry. Legitimate administrative activities, such as scheduled software updates or managed installations, may trigger this alert and need careful differentiation from malicious instances. A companion detection, such as monitoring for suspicious downloads or execution of client-side scripts, could provide additional context and strengthen coverage.

