logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\msiexec.exe'
  - OriginalFileName: 'msiexec.exe'
  selection_cli:
        # Note that there is no space before and after the arguments because it's possible to write a commandline as such
        # Example: msiexec -q/i [MSI Package]
    CommandLine|contains|windash:
    - '-i'
    - '-package'
    - '-a'
    - '-j'
  selection_quiet:
    CommandLine|contains|windash: '-q'
  selection_remote:
    CommandLine|contains:
    - 'http'
    - '\\\\'
  filter_optional_openoffice:
    CommandLine|contains|all:
    - '\AppData\Local\Temp\OpenOffice'
    - 'Installation Files\openoffice'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving the use of Msiexec.exe for quiet installations from remote locations. Specifically, it targets instances where the command line arguments indicate a silent installation of an MSI package that is sourced from an external URL or UNC path. Attackers may leverage this technique to deploy malware or execute rogue software without the user's consent, aiming to maintain stealth while establishing persistence or compromise a system.

  The likely motivations behind such behavior can stem from various threat actors aiming to execute pre-ransomware attacks, facilitate lateral movement, or establish C2 (command and control) communications. This technique falls under the MITRE ATT&CK framework, specifically under the **Execution** tactic using the technique **T1218.007: Signed Binary Proxy Execution**. The detection focuses on identifying unusual installations that bypass typical user interaction or notification processes.

  To effectively monitor such activities, the primary data source is process creation events on Windows systems, which provide crucial insights into command-line arguments and executable behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of `msiexec.exe` being invoked with command-line arguments that include silent installation flags like `-q` or `-i` combined with remote sources (e.g., URLs or UNC paths).
  - **Investigate Command-Line Parameters**: Identify the full command line presented at the time of execution, especially focusing on any suspicious parameters that may indicate anomalous installation behavior or the inclusion of potentially malicious packages.
  - **Check for Unusual Network Activity**: Examine network logs for outbound connections to the remote URLs or UNC paths indicated in the installation commands to determine if connections to known threat infrastructure were established.
  - **Correlate with User Context**: Investigate the user account context under which the installation occurred, looking for signs of privilege abuse or anomalous behavior, particularly if the execution originated from non-standard user accounts or automated processes.

  ### Prioritization
  This alert warrants medium severity due to its potential for enabling stealthy malware deployment, which could lead to significant compromise if left unremediated. Given the ease with which attackers can use Msiexec.exe for malicious purposes, proactive investigation is critical.

  ### Blind Spots and Assumptions
  The detection logic assumes that all instances of Msiexec.exe involving silent installations from a remote source could indicate malicious activity; however, legitimate administrative tasks might also use similar parameters. Additionally, this rule may not cover scenarios where malware might employ other methods of installation not involving Msiexec.exe. Successful detection relies on properly configured logging for process creation events, and missed logs could result in undetected malicious behavior.

