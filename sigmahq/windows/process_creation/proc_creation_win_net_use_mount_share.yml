note: |
  ### Technical Context
  This detection rule identifies instances where a Windows share is mounted using the `net.exe` utility, indicating potential lateral movement or unauthorized access to network shares. Attackers often leverage this tool to connect to shared resources and exploit sensitive data on other systems within the network. The primary objective of such behavior is to gain unauthorized access to shared directories for data exfiltration or further lateral movement within a compromised environment.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Lateral Movement** (TA0011)
  - **Windows Admin Shares** (T1021.002)

  The primary data sources for this detection include process creation logs from Windows, which can provide insight into command-line executions, including the use of `net.exe`. Additionally, network share access logs may offer supporting evidence of connections made using the specified utility.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate process creation events for instances of `net.exe` or `net1.exe` to confirm suspicious usage patterns and the specific timing of the commands.
  - **Analyze Command-Line Parameters**: Examine the command-line arguments associated with the `net.exe` executions, specifically looking for patterns that indicate unauthorized access, such as the use of the `use` command or references to UNC paths.
  - **Inspect Share Access Logs**: Check for any corresponding logs that document attempts to access Windows shares, focusing on unusual permissions or access from unexpected user accounts.
  - **Correlate with User Behavior**: Assess the user accounts executing the `net.exe` commands and verify their legitimacy. Look for accounts that have not historically accessed shares or have low user activity.

  ### Prioritization
  Given that this detection rule identifies potentially unauthorized access methods via `net.exe`, the severity of the alerts should be considered medium. The likelihood of exploitation and the criticality of information stored on network shares necessitate prompt investigation and potential remediation efforts.

  ### Blind Spots and Assumptions
  One key blind spot in this detection logic is the potential for legitimate administrative activity, which could result in false positives when system administrators or scripts perform authorized actions using `net.exe`. The detection assumes that all instances of `net.exe` usage outside of a predefined whitelist of accounts are suspicious; however, further context from user behavior analytics and access logs is necessary. Required logs include comprehensive process creation logs with command-line details enabled to facilitate effective detection and analysis.

