  ---

  ### Technical Context

  This rule detects the behavior of mounting a Windows share using the “net.exe” utility, specifically looking for command-line activities that include network share references. The likely attacker objective is lateral movement within the network, often aiming to access or exfiltrate sensitive data residing on shared drives. This attack aligns with the MITRE ATT&CK tactic: Lateral Movement (TA.LateralMovement) and technique: Windows Admin Shares (T1021.002).

  The primary telemetry source for this detection is process creation logs from Windows systems, particularly focused on Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it may indicate an unauthorized attempt to access network resources. Importantly, this detection does NOT confirm that the access was indeed malicious; legitimate administrative actions or scripted tasks could exhibit similar behavior.

  ---

  ### Investigation Steps

  - **Check process logs for net.exe execution:** Review Security Event ID 4688 or Sysmon Event ID 1 for any occurrences of `\net.exe` or `\net1.exe`. Focus on the CommandLine field for any use of `use` or UNC paths (`\\`), marking them as potentially suspicious.

  - **Identify command origin:** Investigate the User field associated with the net.exe execution to determine if a known administrator account initiated the command. Legitimate administrative activity will often originate from these accounts.

  - **Assess timeline and frequency:** Examine the execution timestamps of the detected command against usual patterns for your environment. Frequent or unusual late-night usage may indicate suspicious activity.

  - **Correlate with file shares accessed:** Use relevant data sources such as SMB logs or Windows Event Logs to verify which shares were accessed. Look for unusual shares or shares typically not accessed by the user or group.

  - **Look for subsequent activities:** After detecting the net.exe execution, assess for other lateral movement indicators or unusual file access patterns that may follow the share mounting, such as file creation events (e.g., Security Event ID 4663).

  ---

  ### Prioritization

  This alert carries a low severity in a mature enterprise context, as the impacted system's role and the likelihood of legitimate administrative actions are high. However, rare or unexpected access patterns make it a noteworthy activity that warrants further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to the utility’s legitimate use by administrators and automated scripts. If necessary logs (e.g., SMB events) are not enabled, the detection could miss critical indicators of compromise related to unauthorized access. Potential evasion tactics include altering command invocations or using alternative tools for file sharing. Monitoring tools that capture process creation alongside user activity could serve as a companion detection for improved visibility on lateral movement activities.

