note: |
  ### Technical Context

  This Sigma rule detects the deletion of scheduled tasks, specifically those related to critical system functions such as BitLocker, Windows Defender, and System Restore. Attackers may disable or delete these tasks to hinder system defenses and perform malicious activities undetected. This behavior aligns with the MITRE ATT&CK tactic of "Impact" (TA-1489), indicating the adversary's objective to disrupt or alter the regular functioning of the system.

  The primary telemetry source for this detection is the Windows Event Log related to process creation, specifically focusing on the `schtasks.exe` command line operations. If this behavior is initiated by an unauthorized user or process, it could lead to significant security impacts, such as data loss or system integrity compromise. However, this detection alone does not confirm successful exploitation or an ongoing attack; it indicates a potential clear and present danger that requires further investigation.

  ### Investigation Steps

  - **Review Recent Task Deletions**: Check Windows Event Log for Security (Event ID 4688) or Sysmon Event ID 1 for schtasks.exe executions. Look for CommandLine values containing "/delete /tn" along with any critical task names (e.g., `\Windows\Defender`).

  - **Validate Task Existence**: Use PowerShell (`Get-ScheduledTask`) or Task Scheduler to confirm whether the deleted tasks truly exist prior to deletion. Lack of legitimate tasks indicates a potential security incident.

  - **Analyze Execution Context**: Check the event logs to determine the user account that initiated the schtasks.exe command, especially looking for non-administrative accounts or unusual service accounts. Legitimate task modifications typically involve admin accounts.

  - **Correlate with Other Alerts**: Check for related alerts in the last 72 hours that involve the same user account or process, especially any alerts from antivirus or intrusion detection systems indicating suspicious activity.

  - **Monitor System Impact**: Evaluate the functional state of the affected system. If essential tasks like Windows Defender were deleted, assess the system for vulnerabilities or compromised integrity, such as checking for unusual network connections or file alterations.

  ### Prioritization

  Given that the behavior involves the deletion of important scheduled tasks, which could disable critical security measures, the alert is of high severity. The likelihood of this activity being malicious is significant, as the specific tasks targeted are critical to system security and functionality, making them frequent targets for adversarial activities.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative actions or system maintenance by IT staff, which could also trigger this alert. Successful detection relies on the availability of Windows Event Logs and proper logging configurations for process creation. Legitimate scheduled tasks that may be deleted include software update processes or periodic system maintenance tasks. A related detection for monitoring unusual process creations by administrative accounts would strengthen the coverage against this potential adversary workflow.

