detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - '/delete'
    - '/tn'
    CommandLine|contains:
            # Add more important tasks
    - '\Windows\BitLocker'
    - '\Windows\ExploitGuard'
    - '\Windows\SystemRestore\SR'
    - '\Windows\UpdateOrchestrator\'
    - '\Windows\Windows Defender\'
    - '\Windows\WindowsBackup\'
    - '\Windows\WindowsUpdate\'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activities involving the deletion of important scheduled tasks on Windows systems. Schedule tasks are integral to managing automated processes; thus, adversaries may delete them to disrupt system functionality, erase traces of their activity, or prevent key security processes from executing. The primary objective is often to enable further exploitation or data destruction without being detected.

  The likely threat scenario involves an attacker, possibly leveraging tools for lateral movement or persistence, targeting specific scheduled tasks related to critical services like BitLocker, Exploit Guard, or Windows Defender. By manipulating these tasks, the adversary aims to create openings for additional malicious actions, including data exfiltration or the installation of backdoors.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Impact** (TA0040): Adversaries aim to manipulate system functionality to cause harm.
  - **Data Destruction** (T1489): Directly relates to the deletion of scheduled tasks that could hinder recovery or system integrity.

  Primary data sources for this detection include process creation events, which reveal the execution of the `schtasks.exe` utility along with its command line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events filtered for `schtasks.exe` executions, specifically focusing on command lines containing `/delete` and task names indicative of critical Windows functions.

  - **Correlate with Scheduled Task Logs**: Access logs from Task Scheduler to identify any scheduled tasks that were recently deleted, paying close attention to any critical tasks associated with security and system maintenance.

  - **Check System Integrity**: Validate the integrity of the system by checking for the absence of critical tasks in the Task Scheduler, and consider reviewing system event logs for unexpected changes to task configurations.

  - **Investigate User Context**: Determine the user context under which the deletion command was executed. Look for any signs of credential compromise or unauthorized user activity that may have facilitated the action.

  ### Prioritization
  The alert has been deemed high severity due to the critical nature of scheduled tasks in maintaining system functionality and security. Deletion of such tasks can directly aid an attacker in achieving their goals of disruption and concealment, posing significant risk to enterprise environments.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where scheduled tasks are frequently modified for legitimate operational purposes, potentially resulting in false negatives. The detection logic assumes that appropriate logging for process creation events is enabled and sufficiently captures detailed command line arguments. Additionally, the rule requires that any important scheduled tasks be appropriately defined within the detection criteria to ensure comprehensive monitoring.

