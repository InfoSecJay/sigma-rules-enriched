note: |
  ### Technical Context

  This Sigma rule detects the deletion of scheduled tasks relating to essential Windows services and processes, specifically through the execution of `schtasks.exe` with a delete command. The behavior indicates that an adversary may be attempting to halt important security or recovery tasks to facilitate data loss or system manipulation. The relevant MITRE ATT&CK technique associated with this behavior is Impact (T1489).

  The primary telemetry sources required include Windows Process Creation events, especially Security Event ID 4688 and Sysmon Event ID 1, which capture the execution and arguments of processes. Malicious activities may result in the deletion of critical tasks linked to system operations like BitLocker or Windows Update, decreasing system recovery capabilities or compromising security. However, this detection does NOT confirm that the activity was indeed malicious on its own, as legitimate administrative actions could lead to similar command executions.

  ### Investigation Steps

  - **Review Process Creation Events**: Check Security Event ID 4688 or Sysmon Event ID 1 for `schtasks.exe` execution. Look specifically for CommandLine containing `/delete`, indicating potential task deletion.

  - **Examine Task Deletion Targets**: Identify which scheduled tasks were deleted from the CommandLine arguments. Focus on critical services such as those related to `\Windows\BitLocker` or `\Windows\Windows Defender`, as deletion of these would likely indicate malicious intent.

  - **Correlate with Administrative Actions**: Identify any legitimate administrative activities or maintenance events during the same timeframe, using Event ID 4624 and consulting audit logs. Administrators might also be managing tasks related to system updates or backups.

  - **Look for Unusual Timing or Frequency**: Analyze the timestamps of the alerts for repetitive task deletion activities. Multiple deletions in a short period may suggest automated scripts used by an adversary rather than typical administrative behavior.

  - **Identify Malicious Indicators**: Search for unusual IP addresses or user accounts associated with the command execution. Elevated privileges or accounts with a history of suspicious activity can suggest malicious intent.

  - **Check for Artifact Creation**: Look for evidence of data reduction or system changes post-task deletion, such as file creation or network activity indicative of file exfiltration. This could be tracked via Sysmon Event ID 11 or network monitoring solutions.

  ### Prioritization

  This alert should be categorized as high severity due to its potential impact on critical system tasks, such as security functions and data integrity. The likelihood of malicious abuse is significant, particularly as task deletions are a common technique utilized by attackers to undermine system defenses.

  ### Blind Spots and Assumptions

  This detection may miss attempts to delete scheduled tasks through alternate mechanisms, such as PowerShell or other administrative tools. It requires proper logging configuration on endpoints to capture necessary events reliably. Legitimate maintenance activities, like scheduled task administration, may trigger this alert, necessitating thorough contextual review. A companion detection, monitoring for abnormal process execution patterns, could provide additional assurance against false positives and broaden coverage.

