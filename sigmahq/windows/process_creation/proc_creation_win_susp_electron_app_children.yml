title: Suspicious Electron Application Child Processes
id: f26eb764-fd89-464b-85e2-dc4a8e6e77b8
related:
- id: 378a05d8-963c-46c9-bcce-13c7657eac99
  type: similar
status: test
description: |
  Detects suspicious child processes of electron apps (teams, discord, slack, etc.). This could be a potential sign of ".asar" file tampering (See reference section for more information) or binary execution proxy through specific CLI arguments (see related rule)
references:
- https://taggart-tech.com/quasar-electron/
- https://github.com/mttaggart/quasar
- https://positive.security/blog/ms-officecmd-rce
- https://lolbas-project.github.io/lolbas/Binaries/Msedge/
- https://lolbas-project.github.io/lolbas/Binaries/Teams/
- https://lolbas-project.github.io/lolbas/Binaries/msedgewebview2/
- https://medium.com/@MalFuzzer/one-electron-to-rule-them-all-dc2e9b263daf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-21
modified: 2024-07-12
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
            # Add more electron based app to the list
    - '\chrome.exe'         # Might require additional tuning
    - '\discord.exe'
    - '\GitHubDesktop.exe'
    - '\keybase.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\msteams.exe'
    - '\slack.exe'
    - '\teams.exe'
            # - '\code.exe' # Prone to a lot of FPs. Requires an additional baseline
  selection_child_image:
    Image|endswith:
            # Add more suspicious/unexpected paths
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\whoami.exe'
    - '\wscript.exe'
  selection_child_paths:
    Image|contains:
            # Add more suspicious/unexpected paths
    - ':\ProgramData\'
    - ':\Temp\'
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  filter_optional_discord:
    ParentImage|endswith: '\Discord.exe'
    Image|endswith: '\cmd.exe'
    CommandLine|contains: '\NVSMI\nvidia-smi.exe'
  condition: selection_parent and 1 of selection_child_* and not 1 of filter_optional_*
falsepositives:
- Unknown
# Increase the level once FP rate is reduced (see status)
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious child processes spawned by Electron-based applications, such as Microsoft Teams, Discord, and Slack. The rule is built to catch potentially malicious actions involving tampering with `.asar` files, which are commonly used by Electron applications to bundle resources. Attackers might leverage such tampering to execute arbitrary commands or achieve persistence covertly through these widely-used applications, aligning with tactics aimed at bypassing defensive mechanisms such as application whitelisting.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), as the detected behavior revolves around executing unwanted commands or scripts. Techniques such as **Command and Scripting Interpreter** (T1059) and **User Execution** (T1204) may also be at play if the attacker is exploiting user interactions with these Electron apps. Primary data sources for this detection include Windows process creation events, which provide insights into parent-child process relationships, as well as command-line arguments that may highlight unusual execution patterns or scripts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs to identify instances where suspicious child processes were spawned by targeted Electron applications. Pay attention to unusual parent-child relationships.

  - **Examine Command-Line Arguments**: Inspect the command-line arguments of the identified processes for any indicators of malicious activity, such as the use of scripting tools (e.g., cmd.exe, PowerShell) in settings where they are not expected.

  - **Check for File Tampering**: Investigate the integrity of the `.asar` files used by the Electron apps in question to see if they have been modified, which could indicate tampering or exploitation attempts.

  - **Monitor Network Activity**: While examining the processes, correlate them with network activity to detect any unusual outbound connections or behavior, which may reveal the presence of command and control (C2) communications.

  ### Prioritization
  The severity of this alert is medium, as while the involvement of commonly used applications like Discord and Teams in potentially malicious activities is concerning, the prevalence and possible benign usage of these applications in enterprise environments may lead to false positives.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly related to environments where Electron applications are heavily customized or used in non-standard ways, which may not trigger the detection logic. The rule assumes that logging for process creation events is configured correctly, and the environments monitored contain standard installations of these Electron applications. Additional configurations may be required to optimize the detection and reduce false positives further, particularly for legitimate use cases involving command execution within these applications.

