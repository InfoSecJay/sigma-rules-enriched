title: Suspicious Electron Application Child Processes
id: f26eb764-fd89-464b-85e2-dc4a8e6e77b8
related:
- id: 378a05d8-963c-46c9-bcce-13c7657eac99
  type: similar
status: test
description: |
  Detects suspicious child processes of electron apps (teams, discord, slack, etc.). This could be a potential sign of ".asar" file tampering (See reference section for more information) or binary execution proxy through specific CLI arguments (see related rule)
references:
- https://taggart-tech.com/quasar-electron/
- https://github.com/mttaggart/quasar
- https://positive.security/blog/ms-officecmd-rce
- https://lolbas-project.github.io/lolbas/Binaries/Msedge/
- https://lolbas-project.github.io/lolbas/Binaries/Teams/
- https://lolbas-project.github.io/lolbas/Binaries/msedgewebview2/
- https://medium.com/@MalFuzzer/one-electron-to-rule-them-all-dc2e9b263daf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-21
modified: 2024-07-12
tags:
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
            # Add more electron based app to the list
    - '\chrome.exe'         # Might require additional tuning
    - '\discord.exe'
    - '\GitHubDesktop.exe'
    - '\keybase.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\msteams.exe'
    - '\slack.exe'
    - '\teams.exe'
            # - '\code.exe' # Prone to a lot of FPs. Requires an additional baseline
  selection_child_image:
    Image|endswith:
            # Add more suspicious/unexpected paths
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\whoami.exe'
    - '\wscript.exe'
  selection_child_paths:
    Image|contains:
            # Add more suspicious/unexpected paths
    - ':\ProgramData\'
    - ':\Temp\'
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
  filter_optional_discord:
    ParentImage|endswith: '\Discord.exe'
    Image|endswith: '\cmd.exe'
    CommandLine|contains: '\NVSMI\nvidia-smi.exe'
  condition: selection_parent and 1 of selection_child_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
# Increase the level once FP rate is reduced (see status)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of suspicious child processes spawned by Electron-based applications (such as Microsoft Teams, Discord, and Slack). The likely attacker objective is to exploit these trusted applications to execute malicious commands or scripts (e.g., using command-line interpreters like `cmd.exe` or `powershell.exe`) in order to evade detection and maintain persistence. This behavior can be associated with the MITRE ATT&CK technique for Execution (T1203), specifically leveraging trusted software for command execution.

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If observed, malicious activity could lead to unauthorized access or exploitation of corporate environments. It’s important to note that this detection does NOT confirm that an attack is occurring—further analysis is necessary to determine context and intent.

  ### Investigation Steps

  - **Investigate parent-child relationships**: Analyze process creation events (Event ID 4688) to identify instances where Electron-based applications (e.g., `Discord.exe`, `slack.exe`) are spawning processes such as `cmd.exe`, `powershell.exe`, or `wscript.exe`. Focus on the paths of the child processes for anomalies.

  - **Check command line arguments**: Review the CommandLine field in process creation logs to identify suspicious or unexpected arguments passed to these child processes. Legitimate commands typically do not attempt to execute system tools from arbitrary locations.

  - **Review recent updates to Electron apps**: Check the update history of the identified Electron applications (e.g., Teams, Discord) for any recent changes that could affect functionality. Use application logs or configuration management tools to verify this information.

  - **Look for evasion tactics**: Search for known indicators of compromise (IOCs) related to `.asar` file tampering linked to Electron apps. Inspect the path for any anomalies, especially within the `\AppData\Local\Temp\` or `\ProgramData\` directories.

  - **Identify legitimate usage patterns**: Validate the usage history of these Electron applications by looking at user activity logs or connection statistics. Legitimate work-related activities generally involve interaction with predefined commands (e.g., messaging, using built-in plugins).

  - **Determine system impact evaluation**: Assess the role of the impacted system within the environment (e.g., workstations vs. servers) and consider asset criticality. If the application serves critical business functions, elevate response priority.

  ### Prioritization

  This alert is rated medium severity due to its potential impact if an Electron application is compromised, especially in highly collaborative environments where these applications are essential. The likelihood of abuse is significantly heightened, as adversaries often utilize trusted software to evade detection. This behavior is increasingly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may fail if logs are not configured to capture detailed command-line arguments or if process creation events are not monitored completely, creating a blind spot. Legitimate activities, such as using Electron apps for automation or system management, may trigger the alerts. A companion detection related to suspicious PowerShell activity (e.g., querying system information or invoking scripts) would enhance coverage and reduce false positives.

