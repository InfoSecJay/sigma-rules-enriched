title: Suspicious Powercfg Execution To Change Lock Screen Timeout
id: f8d6a15e-4bc8-4c27-8e5d-2b10f0b73e5b
status: test
description: Detects suspicious execution of 'Powercfg.exe' to change lock 
  screen timeout
references:
- https://blogs.vmware.com/security/2022/11/batloader-the-evasive-downloader-malware.html
- https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options
author: frack113
date: 2022-11-18
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection_power:
  - Image|endswith: '\powercfg.exe'
  - OriginalFileName: 'PowerCfg.exe'
  selection_standby:
        # powercfg.exe /SETACVALUEINDEX SCHEME_CURRENT SUB_VIDEO VIDEOCONLOCK
  - CommandLine|contains|all:
    - '/setacvalueindex '
    - 'SCHEME_CURRENT'
    - 'SUB_VIDEO'
    - 'VIDEOCONLOCK'
        # powercfg -change -standby-timeout-dc 3000
        # powercfg -change -standby-timeout-ac 3000
  - CommandLine|contains|all:
    - '-change '
    - '-standby-timeout-'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious executions of `Powercfg.exe`, specifically targeting command-line arguments that alter lock screen timeout settings. Attackers may attempt to adjust these parameters to circumvent lock mechanisms, thereby facilitating further malicious activity on a compromised system. This behavior aligns with the MITRE ATT&CK technique "Modify Existing Service" (T1031) under the tactic of Defense Evasion.

  The primary telemetry sources for this detection are process creation logs, specifically looking for Event ID 4688 in Windows Security logs or Sysmon Event ID 1. If malicious, this activity can lead to unauthorized access or persistence on the affected system. However, this detection does NOT confirm malicious intent by itself, as legitimate administrative actions could produce similar command-line behaviors.

  ### Investigation Steps

  - **Review event logs for process creation:** Check Security Event ID 4688 or Sysmon Event ID 1 for `Powercfg.exe` execution. Look for unusual parent processes or execution paths that do not align with typical administrative tasks.

  - **Analyze command-line arguments:** Specifically look for command-line arguments containing `/setacvalueindex` or `-change -standby-timeout-`. If these commands are present in conjunction with suspicious parent processes, this may indicate malicious intent.

  - **Identify high-confidence malicious indicators:** Cross-reference execution history with known malicious behaviors or malware toolkits that employ similar tactics. Check for previous alerts or incidents associated with `Powercfg.exe`.

  - **Determine legitimate usage patterns:** Investigate typical usage of `Powercfg.exe` within your environment. For instance, IT staff may use it to modify power settings. Compare user history with normal activity during the time of alert.

  - **Assess file creation or modification:** Validate if any unusual file creation or modification coincides with `Powercfg.exe` execution. Look for files in the user profile or system directories that might indicate exploitation or persistence efforts.

  ### Prioritization

  This alert should be treated with medium severity due to potential impacts on endpoint security and the likelihood of being exploited by threat actors to maintain access. The behavior is not commonly weaponized but warrants close examination, especially in sensitive or critical systems where unauthorized access could lead to significant risks.

  ### Blind Spots and Assumptions

  This detection may miss instances where command-line arguments are obfuscated or modified to avoid detection. Reliable detection requires appropriate configuration for capturing all process creation logs. Legitimate activities, such as administrative changes to power settings by IT staff, could trigger the alert. A companion detection could include monitoring for Windows Management Instrumentation (WMI) calls that involve process management, which could provide additional context around the behavior.

