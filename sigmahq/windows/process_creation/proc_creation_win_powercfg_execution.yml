title: Suspicious Powercfg Execution To Change Lock Screen Timeout
id: f8d6a15e-4bc8-4c27-8e5d-2b10f0b73e5b
status: test
description: Detects suspicious execution of 'Powercfg.exe' to change lock screen
  timeout
references:
- https://blogs.vmware.com/security/2022/11/batloader-the-evasive-downloader-malware.html
- https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options
author: frack113
date: 2022-11-18
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_power:
  - Image|endswith: '\powercfg.exe'
  - OriginalFileName: 'PowerCfg.exe'
  selection_standby:
        # powercfg.exe /SETACVALUEINDEX SCHEME_CURRENT SUB_VIDEO VIDEOCONLOCK
  - CommandLine|contains|all:
    - '/setacvalueindex '
    - 'SCHEME_CURRENT'
    - 'SUB_VIDEO'
    - 'VIDEOCONLOCK'
        # powercfg -change -standby-timeout-dc 3000
        # powercfg -change -standby-timeout-ac 3000
  - CommandLine|contains|all:
    - '-change '
    - '-standby-timeout-'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the suspicious execution of `Powercfg.exe` to change the lock screen timeout on Windows systems. The `Powercfg` utility is a legitimate command-line tool used to configure power settings, but attackers may leverage it to alter system behavior or persistence mechanisms in an evasive manner. This technique could be part of a broader tactic involving modifications to system settings to avoid detection or maintain access.

  The likely attacker objective is to manipulate the system’s power settings to facilitate unauthorized access or reduce user security awareness, potentially indicating a phase of the attack where they aim to maintain foothold or evade security mechanisms. Relevant MITRE ATT&CK tactics associated with this behavior include Defense Evasion (T1203) through command line interface manipulation and potentially Initial Access (T1071) if used to hide the installation of malicious payloads.

  Primary data sources for investigation include process creation events, which provide insights into command executions, and command line arguments that reveal the context of use when `Powercfg.exe` is invoked.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for instances of `Powercfg.exe` being executed, focusing on the associated command line arguments to identify any occurrences related to changing lock screen timeout settings.

  - **Analyze Command Line Arguments:** Look for suspicious patterns in the command line that include `-change` or `-setacvalueindex`, which may indicate manipulative use of the power configuration tool.

  - **Correlate with User Activity:** Check user account activity within a close timeframe of the detected execution. Investigate the context (e.g., user behaviors that may suggest exploitation or anomalies).

  - **Evaluate System Configuration Settings:** Assess current power settings and their changes. Cross-reference with standard operational behavior norms to identify anomalies potentially linked to suspicious activities.

  ### Prioritization
  The severity of this alert is medium; while changing lock screen timeouts may not appear immediately harmful, it can serve as an indicator of malicious intent and could compromise user session integrity, lowering overall security posture.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for other potential power management command executions that do not fit the identified patterns but could still signify malicious behavior. The detection logic assumes that the `Powercfg.exe` executions will include specific command line flags indicative of misuse. It requires a properly configured process creation logging mechanism to function effectively; without comprehensive logging, subtle indications of misuse may be missed.

