  ---

  ### Technical Context

  This Sigma rule detects the execution of `Powercfg.exe` specifically used to change the lock screen timeout settings. Attackers may aim to prevent user sessions from locking or to maintain access without interruption, which can facilitate further exploitations or unauthorized access to the system. This behavior fits under the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and the technique of **Modify System Image** (T1203).

  The primary telemetry sources include Windows Security Event ID 4688, which logs process creations, and potentially Sysmon Event ID 1 for more detailed command line arguments. If this detection is valid, the security impact could involve unauthorized data exposure or persistent access by an attacker, which underscores the need for immediate investigation. It is important to note that this detection does NOT confirm malicious intent solely on its own; legitimate administrative actions could also trigger this alert.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for the process `Powercfg.exe`. Check `NewProcessName` and `CommandLine` fields to confirm arguments used in execution. Look specifically for parameters related to modifying standby timeouts.

  - **Identify high-confidence malicious indicators:** Verify if the detected execution has unusual command line parameters like `/setacvalueindex` or `-change -standby-timeout`. These would be suspicious if run on systems where such changes are atypical and not aligned with the organization’s usage policies.

  - **Check for scheduled tasks or scripts:** Use PowerShell to search for scheduled tasks or scripts that may invoke `Powercfg.exe` actions repeatedly. Review `Task Scheduler` logs for any non-standard behavior, especially on critical systems.

  - **Analyze user context and system role:** Determine the user account that executed the command and the host role (e.g., endpoints, servers). Since administrative users could legitimately change settings, correlate the execution with normal usage patterns for that user.

  - **Compare against baseline configurations:** Validate current power settings with expected baseline configurations. PowerShell command `Get-CimInstance Win32_PowerPlan | Select-Object -Property InstanceID, Name, Description` can help identify any discrepancies showing unauthorized changes.

  - **Review related alerts or activities:** Check for other alerts related to unauthorized access or privilege escalation around the same time frame as the `Powercfg.exe` invocation. Look for combinations with other offensive techniques.

  ---

  ### Prioritization

  This alert has a medium severity level due to potential impacts on user session security, increasing the likelihood of unauthorized access. While changing lock screen settings can be a benign administrative task, it is also commonly exploited in attack scenarios to evade detection and maintain persistence.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential bypass if logs are not collected or if users possess legitimate operational contexts for making changes. This may also include evasion if attackers employ tools to hide their command-line executions. Legitimate IT management activities, such as a system administrator adjusting power settings, could trigger this alert. As a related detection, monitoring for abnormal command line execution involving `PowerShell` could further enhance coverage.

