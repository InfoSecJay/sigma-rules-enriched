detection:
  selection_power:
  - Image|endswith: '\powercfg.exe'
  - OriginalFileName: 'PowerCfg.exe'
  selection_standby:
        # powercfg.exe /SETACVALUEINDEX SCHEME_CURRENT SUB_VIDEO VIDEOCONLOCK
  - CommandLine|contains|all:
    - '/setacvalueindex '
    - 'SCHEME_CURRENT'
    - 'SUB_VIDEO'
    - 'VIDEOCONLOCK'
        # powercfg -change -standby-timeout-dc 3000
        # powercfg -change -standby-timeout-ac 3000
  - CommandLine|contains|all:
    - '-change '
    - '-standby-timeout-'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious executions of `Powercfg.exe`, specifically when commands related to changing the lock screen timeout are invoked. The likely objective of an attacker using this command may be to maintain access by preventing the screen from locking, thereby allowing unauthorized users prolonged interaction with the system without interruption. The relevant MITRE ATT&CK tactic here is **Defense Evasion** (TA0005), specifically technique **T1070 - Indicator Removal on Host**.

  Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID **4688** or Sysmon Event ID **1**, which would capture details of the executed process, including command line arguments. If malicious, this behavior can lead to unauthorized access and data exfiltration. Importantly, this detection does NOT confirm any malicious activity on its own, as legitimate administrative tasks may use similar commands.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID **4688** or Sysmon Event ID **1** for `Powercfg.exe` instances. Verify the command line used; if it includes parameters like `-change -standby-timeout`, consider this indicative of suspicious activity.

  - **Identify user context**: Assess the user context under which `Powercfg.exe` was executed. Administrators performing legitimate activities, such as adjusting power settings, may be less concerning than unexpected executions by standard users who do not typically modify power settings.

  - **Validate command line parameters**: Correlate the executed command line with known benign usage. Legitimate commands typically do not alter the lock screen timeout. Commands that modify timeout settings should raise a flag.

  - **Review system logs for unusual access**: Check for other indicators of compromise around the same time frame as the detected command. Look for any atypical user activity or additional process creations linked to the same user or session.

  - **Cross-reference with threat intelligence**: Compare the execution with any internal or external threat intelligence. If the command aligns with known malicious behavior or patterns as indicated in reports (e.g., BatLoader), this serves as a high-confidence malicious indicator.

  ### Prioritization

  This alert is medium-severity due to its potential impact on system security and its likelihood of being abused in the context of evading defenses and maintaining unauthorized access. While the direct modification of the lock screen timeout may not be a widely weaponized technique, the behavior suggests underlying malicious activity that warrants timely investigation.

  ### Blind Spots and Assumptions

  The detection may miss evasion techniques such as renaming the executable or using PowerShell to invoke `Powercfg` indirectly. Reliable detection requires both **Process Creation** and **Sysmon** logging enabled with proper configuration. Additionally, legitimate administrative tasks may occasionally trigger this alert. A related detection to enhance coverage would be monitoring for unusual task scheduler entries or scripts that invoke `Powercfg.exe`, which may indicate automated or scripted attempts to alter system settings.

