logsource:
  category: process_creation
  product: windows
detection:
  selection_only_tunnel:
    OriginalFileName:
    CommandLine|endswith: '.exe tunnel'
  selection_tunnel_args:
    CommandLine|contains|all:
    - '.exe tunnel'
    - '--accept-server-license-terms'
  selection_parent_tunnel:
    ParentCommandLine|endswith: ' tunnel'
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/d /c '
    - '\servers\Stable-'
    - 'code-server.cmd'
  condition: 1 of selection_*
falsepositives:
- Legitimate use of Visual Studio Code tunnel
level: medium
note: |
  ### Technical Context
  This rule detects the execution of Visual Studio Code (VS Code) tunnels, a feature that can be exploited by attackers to establish covert Command and Control (C2) channels. In a scenario where a compromised entity uses VS Code's tunneling capabilities, attackers might aim to interact with the internal network without raising alarms. Their objectives could involve data exfiltration, lateral movement, or remotely accessing services behind a firewall.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Command and Control** (TA0011)
    - **Application Layer Protocol** (T1071.001) - Using tunneling for C2.
  - **Exploitation of Remote Services** (TA0050)
    - **Remote Administration Tools** (T1219) - Abusing legitimate tools to facilitate attacks.

  Primary data sources for this detection are process creation logs that can provide insights into how a malicious actor is utilizing VS Code tunnels, including command-line arguments and parent processes involved in the execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any instances of process creation that indicate a VS Code tunnel command being executed. Pay attention to command-line arguments for suspicious patterns or unusual parameters.
  - **Analyze Parent Process**: Investigate the parent process of any detected VS Code tunnel execution to determine if it originated from a legitimate command prompt or if it has suspicious characteristics indicating potential exploitation.
  - **Correlate with Network Traffic**: Monitor outbound network connections to identify any unusual C2 traffic patterns, particularly those originating from the machine executing a VS Code tunnel.
  - **Examine Historical Usage**: Compare current detection results against historical usage patterns of VS Code in your environment to identify any anomalies that deviate from typical activity.

  ### Prioritization
  This alert is classified as medium severity due to the risk posed by potential command-and-control activity that can lead to significant impacts like unauthorized access or data breaches. Given the growing usage of VS Code in development environments, distinguishing between legitimate and malicious use is crucial for effective response.

  ### Blind Spots and Assumptions
  The detection may miss some cases where the function is legitimately used by authorized users, leading to potential false positives. It assumes that logs are correctly configured to capture the necessary process creation events, and it may not account for malicious actions taking place outside of the defined patterns. Ensuring process creation logging is enabled across all endpoints where VS Code is installed is essential for the effectiveness of this alert.

