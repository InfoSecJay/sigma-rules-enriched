title: Visual Studio Code Tunnel Execution
id: 90d6bd71-dffb-4989-8d86-a827fedd6624
status: test
description: Detects Visual Studio Code tunnel execution. Attackers can abuse 
  this functionality to establish a C2 channel
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
- https://code.visualstudio.com/docs/remote/tunnels
author: Nasreddine Bencherchali (Nextron Systems), citron_ninja
date: 2023-10-25
modified: 2025-10-29
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_only_tunnel:
    OriginalFileName:
    CommandLine|endswith: '.exe tunnel'
  selection_tunnel_args:
    CommandLine|contains|all:
    - '.exe tunnel'
    - '--accept-server-license-terms'
  selection_parent_tunnel:
    ParentCommandLine|endswith: ' tunnel'
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/d /c '
    - '\servers\Stable-'
    - 'code-server.cmd'
  condition: 1 of selection_*
falsepositives:
- Legitimate use of Visual Studio Code tunnel
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Visual Studio Code (VSCode) tunneling, a feature that can be misused by adversaries to establish command and control (C2) channels within a compromised network. The likely attacker objective is to access the internal network or remote resources while evading detection. This behavior aligns with the MITRE ATT&CK technique of "Application Layer Protocol: Web Service" (T1071.001) and "User Execution" (T1219).

  The primary telemetry source is Windows process creation logs, specifically Event ID 4688, which captures information regarding the creation of processes, including command line arguments and parent processes. If this activity is malicious, it can lead to unauthorized access to sensitive systems or data exfiltration. However, this detection does not confirm that the activity is malicious without further context, as legitimate users can also exploit this tunneling feature for remote development.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 for processes where the `CommandLine` contains '.exe tunnel'. Note the user context of execution, as legitimate users may utilize this for valid testing or development purposes.

  - **Analyze parent process relationships**: Look for parent processes in Event ID 4688 where the `ParentCommandLine` ends with 'tunnel' and the image is `\cmd.exe`. This can indicate a scripted or automated attack method.

  - **Confirm command line arguments**: Verify logs for execution of commands that include '--accept-server-license-terms'. Legitimate usage would typically exclude this argument or differ significantly in other parameters used.

  - **Identify execution context**: Determine the role of the host where the tunneling command was executed. If it is a non-development server or a sensitive system, assess the alert with higher scrutiny.

  - **Check for network connections**: Validate any new outbound connections originating from the affected host during the time of the alert, especially if they are directed towards suspicious or uncommon external IP addresses.

  - **Examine for known indicators of compromise**: Correlate the execution timestamps and users against threat intelligence sources to identify any high-confidence malicious indicators associated with VSCode tunneling exploits.

  ### Prioritization

  This alert should be treated with medium severity. The potential impact on sensitive systems can be high if exploited for malicious purposes, and since tunneling is a legitimate feature that can be weaponized by attackers, scrutiny is warranted in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate use cases for VSCode tunneling, causing potential false positives. Proper logging configurations for process creation and command line arguments in Windows are essential for reliable detection. Legitimate activities, such as routine development tasks by authorized personnel using VSCode, may trigger this alert. Companion detections, such as identifying unusual outbound network traffic or concurrent execution of known scripting tools, can strengthen overall coverage against this behavior.

