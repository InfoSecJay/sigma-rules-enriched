detection:
  selection_only_tunnel:
    OriginalFileName:
    CommandLine|endswith: '.exe tunnel'
  selection_tunnel_args:
    CommandLine|contains|all:
    - '.exe tunnel'
    - '--accept-server-license-terms'
  selection_parent_tunnel:
    ParentCommandLine|endswith: ' tunnel'
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - '/d /c '
    - '\servers\Stable-'
    - 'code-server.cmd'
  condition: 1 of selection_*
falsepositives:
- Legitimate use of Visual Studio Code tunnel
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of Visual Studio Code (VS Code) tunnels, which can be abused by adversaries to establish a Command and Control (C2) channel. Attackers may leverage this functionality to connect back to compromised environments, facilitating further actions like data exfiltration or additional malware deployment. The relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071.001) and Remote Services (T1219).

  Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creations and their command lines. If malicious, the use of VS Code tunnels may indicate that an attacker is attempting to gain persistent access or exfiltrate sensitive information from the environment. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate usage of VS Code tunnels exists.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1. Look for processes where the command line contains '.exe tunnel', specifically with parameters like '--accept-server-license-terms', indicating possible abuse.

  - **Identify parent process behavior:** Examine the ParentCommandLine field for the presence of 'cmd.exe' ending with ' tunnel'. Benign instances may come from a known and trusted user executing development tasks in a controlled environment.

  - **Check for unusual network connections:** Use firewall logs or network monitoring tools to identify any unexpected outbound traffic to unusual IPs or domains shortly after the detection. Malicious indicators include connections to known C2 infrastructure.

  - **Analyze the executed command line:** Log entries reflecting command lines containing '\servers\Stable-' and 'code-server.cmd' suggest malicious activity. Verify if these parameters align with legitimate development activities or if they resemble known exploitation patterns.

  - **Investigate host activity context:** Confirm if the host is a development environment or if it holds sensitive data. Critical assets such as production servers should receive higher scrutiny if they trigger this alert.

  - **Validate changes in file creation or exfiltration:** Look at the created file logs, focusing on directories associated with development environments. Unexpected file types or unusual modifications may indicate exfiltration efforts.

  ---

  ### Prioritization

  This alert has medium severity due to the potential security impact on development environments, which may lead to data breaches or further compromise. The likelihood of malicious abuse exists, particularly if the behavior coincides with other suspicious activities or if the infrastructure is critical to business operations. Given that VS Code tunnels are a known attack vector, prioritizing these alerts for deeper review is essential.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited in environments where legitimate development activities frequently use Visual Studio Code tunnels, leading to potential false positives. Furthermore, the effectiveness relies on accurate logging configurations for process creation and command line interpretation. Legitimate activities such as development work may trigger this alert, especially in environments utilizing remote development workflows. A related detection could include monitoring for connections from known development tools to suspicious external endpoints, enhancing coverage against misuse.

