note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that modify the Access Control List (ACL) of files or directories using the `Set-Acl` cmdlet. Attackers often aim to manipulate permissions to obscure malicious activities, prevent detection, or facilitate unauthorized access to sensitive data, particularly during lateral movement or data exfiltration stages in the attack lifecycle. The relevant MITRE ATT&CK tactics are **Defense Evasion** (T1071.001) and **Permissions Escalation** (T1068).

  The primary telemetry sources include Windows process creation logs (Event ID 4688) and PowerShell logs (Event ID 4104). If malicious, this behavior can significantly impact system integrity and data security, allowing unauthorized modifications and potential data breaches. Importantly, this detection alone does not confirm malicious intent; legitimate administrative tasks may also perform similar actions.

  ### Investigation Steps

  - **Review Process Creation Events:** Check for Event ID 4688 in Windows logs for the execution of `powershell.exe` or `pwsh.exe`. Look for unusual parent processes, such as `cmd.exe`, that may indicate scripted or automated execution rather than manual invocation.

  - **Analyze Command Line Arguments:** Inspect the command line arguments of the PowerShell execution for occurrences of `Set-Acl`, `-AclObject`, and `-Path`. Confirm that the target file or directory is associated with legitimate administrative tasks. Malicious indicators often include atypical or sensitive file paths.

  - **Correlate with PowerShell Logs:** Examine PowerShell logs (Event ID 4104) to gather additional context on the scripts being executed. Verify if PowerShell scripts employing `Set-Acl` are aligned with expected administrative behavior.

  - **Document Legitimate Administrator Actions:** Identify known operational activities performed by admins, such as scheduled script executions or group policy updates, that would utilize the `Set-Acl` cmdlet. Compare these against the alert context.

  - **Identify Malicious Indicators:** Look for known malicious indicators such as the targeting of system files, key directories (`C:\Windows`, `C:\Program Files`), or use of encoded command arguments, which may suggest obfuscation efforts by an attacker.

  - **Check for Evasion Techniques:** Investigate if there are modifications or controls in place that may suppress or bypass logs related to PowerShell execution, such as changes in logging levels or execution policies that obscure malicious behavior.

  ### Prioritization

  This alert has high severity due to the potential impact on system security and data integrity if an attacker is modifying file permissions for malicious purposes. The likelihood of abuse is significant, as permission changes are a common tactic in various attack scenarios, particularly for evading detection during lateral movements.

  ### Blind Spots and Assumptions

  Detection limitations may include scenarios where PowerShell logging is disabled or insufficiently configured, allowing attackers to perform `Set-Acl` actions without triggering alerts. Legitimate activities that may trigger this rule include routine permissions changes by administrators in maintenance windows. A related detection for comprehensive coverage could involve monitoring for other PowerShell cmdlets associated with privilege escalation or access modifications, such as `Get-Acl` (T1061).

