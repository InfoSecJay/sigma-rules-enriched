note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell commands that modify the Access Control List (ACL) of files or folders using the `Set-Acl` cmdlet. The `Set-Acl` cmdlet is a powerful tool that can be misused by attackers to alter permissions and gain unauthorized access to sensitive information or resources. By changing the permissions, an attacker might prevent legitimate users from accessing certain files or enable unauthorized users to gain access, aligning with various malicious objectives including data exfiltration, persistence, or evasion of detection.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Defense Evasion** (TA0005) and **Access Control Manipulation** (T1505.005). The ability to manipulate ACLs can allow adversaries to obfuscate their activities and maintain access to compromised environments undetected.

  Primary data sources for this detection include **process creation logs**, which can capture the execution details of PowerShell commands, including the command line arguments employed. Monitoring these logs enables security teams to identify suspicious activities and respond accordingly.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for detected instances of PowerShell execution with `Set-Acl`. Focus on the command line used, looking for unexpected or unusual paths and parameters.
  - **Correlate with User Activity**: Cross-reference the PowerShell execution events with active user sessions to identify if the command was run by an authorized user and in the correct context.
  - **Inspect ACL Changes**: Investigate the ACL changes made as a result of the `Set-Acl` command. Identify which files or folders were affected and determine if these changes align with legitimate administrative actions.
  - **Identify Associated Network Activity**: Check for any unusual network connections or file access patterns that may correlate with the timing of the PowerShell execution, as these could provide insight into potential data exfiltration or lateral movement.

  ### Prioritization
  This alert is classified as high severity due to the potential impact on data integrity and confidentiality within the enterprise. Unauthorized ACL changes can lead to significant security breaches, making it crucial for SOC teams to investigate promptly.

  ### Blind Spots and Assumptions
  The detection coverage may be limited by the logging configurations in place. If process creation logs are not being collected or if PowerShell command logging is disabled, the detection may fail to capture relevant activities when the command is executed. Additionally, the rule assumes that any use of `Set-Acl` in PowerShell is likely suspicious, which may not account for all legitimate administrative use cases. Proper logging of PowerShell activities and adequate monitoring of ACL configurations are essential for the effectiveness of this rule.

