note: |
  ### Technical Context

  This rule detects the execution of PowerShell scripts that configure file or folder Access Control Lists (ACLs) using the `Set-Acl` command, indicating potential privilege escalation or obfuscation attempts by an attacker. The attacker may aim to manipulate permissions to prevent detection, alter access for sensitive files, or maintain persistence. This behavior aligns with the MITRE ATT&CK technique "Modify Existing Service" (T1505.005).

  The primary telemetry sources for this detection are process creation events from Windows, specifically Security Event ID 4688, which logs process initiation, and may include Sysmon Event ID 1. If the behavior is malicious, it could lead to unauthorized access or data manipulation. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate administration tasks may also invoke similar commands.

  ### Investigation Steps

  - **Verify Command Line Arguments:** Review the process creation logs for Security Event ID 4688 where `CommandLine` includes `Set-Acl`, `-AclObject`, and `-Path`. Malicious indicators would show these arguments targeting sensitive files or directories, such as system paths (`C:\Windows\System32`).

  - **Check Recent ACL Changes:** Correlate PowerShell execution with Security Event ID 5145 (File Share Object Access) to detect any changes in ACL settings that align with the command execution timestamp. Investigate any changes to high-risk files normally accessed only by admin users.

  - **Review Host Role and Context:** Assess the executing host's role. If the command originates from a non-administrative account on a sensitive server (e.g., Domain Controller), this could indicate malicious intent. Compare with expected behavior of legitimate user activity for similar hosts.

  - **Examine Process Parentage:** Analyze parent processes of the PowerShell execution in Sysmon Event ID 1. Legitimate commands typically stem from well-known administration tools, while suspicious parent processes (e.g., unusual scripts or command shells) may indicate compromise.

  - **Query PowerShell Script Logs:** Investigate PowerShell logs (Event IDs 4103, 4104) for historical executions of scripts with `Set-Acl`. Frequent or unauthorized use can enhance the suspicion of misuse for privilege elevation.

  - **Confirm File Manipulation Artifacts:** For file exfiltration validation, ensure no unexpected file modifications occurred post-command execution, especially files that could indicate persistence mechanisms (e.g., `C:\Windows\System32\config\`).

  ### Prioritization

  This alert is of **high severity** due to the critical nature of file permission changes that can compromise system integrity. The likelihood of abuse is elevated as this technique is weaponized for both evasion and privilege escalation. The context of the affected system further increases the risk, especially when targeting high-value assets.

  ### Blind Spots and Assumptions

  Detection limitations include scenarios where the script runs from benign administrative scripts that also call `Set-Acl`, leading to false positives. Ensure configuration of Windows Event Forwarding or similar log aggregation for comprehensive coverage. For companion detections, monitoring for unusual PowerShell execution or file permission changes via network shares (Security Event ID 5140) can enhance context and coverage against these behaviors.

