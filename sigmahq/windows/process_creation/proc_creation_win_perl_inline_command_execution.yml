note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of Perl scripts using the "-e" or "-E" flags, which allow for inline commands to be executed directly from the command line. This behavior is often leveraged by attackers to execute arbitrary commands, including establishing a reverse shell or downloading malicious payloads. The relevant MITRE ATT&CK techniques include Execution (T1203) and Command and Scripting Interpreter (T1059). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, capturing the command line arguments and process details. If malicious, the impact could be system compromise and data exfiltration. This detection does NOT confirm malicious intent on its own, as legitimate system maintenance or administrative tasks may also use Perl with these flags.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1 for any entries involving `perl.exe`. Pay particular attention to command line arguments that include '-e' or '-E'.

  - **Identify legitimate usage patterns:** Verify if the observed Perl command usage aligns with known administrative workflows, such as scripting by IT staff. Legitimate commands may not include suspicious payloads or network-related activity.

  - **Analyze the command line arguments:** Isolate any command lines containing '-e' or '-E' and investigate for sensitive operations like network connections or file manipulations. Look for keywords indicative of malicious behavior, such as 'connect', 'cmd', or 'wget'.

  - **Check for associated network activity:** Review network logs for outbound connections initiated by the user executing Perl, especially to uncommon or external IPs. Look for unusual TCP connections or DNS queries that follow the timing of the command execution.

  - **Evaluate host role and asset criticality:** Determine the role of the host where the alert was triggered (e.g., server vs. workstation). If the asset is critical (e.g., a domain controller), escalate the investigation due to higher potential impact.

  - **Confirm file artifacts:** Validate if the execution of the Perl command resulted in file creation or modification by checking relevant file system logs or using tools that capture file events. Search for any unusual scripts or executables created in directories typically used by attackers.

  ---

  ### Prioritization

  This alert should be treated with medium priority due to the potential for malicious abuse, particularly on critical systems where Perl is not typically employed. Inline command execution via Perl is a known technique frequently weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include obfuscating Perl scripts or using different scripting languages to avoid detection. Ensure all operational logs, including security event logs and Sysmon data, are properly configured; inadequate logging may lead to missed detections. Legitimate activities that may trigger this alert include the use of Perl for benign automation scripts. Related detections, such as unusual network connections initiated by local processes, can help strengthen investigative coverage.

