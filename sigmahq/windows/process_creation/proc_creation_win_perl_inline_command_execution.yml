title: Perl Inline Command Execution
id: f426547a-e0f7-441a-b63e-854ac5bdf54d
status: test
description: Detects execution of perl using the "-e"/"-E" flags. This is could 
  be used as a way to launch a reverse shell or execute live perl code.
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\perl.exe'
  - OriginalFileName: 'perl.exe'       # Also covers perlX.XX.exe
  selection_cli:
    CommandLine|contains: ' -e'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Perl interpreter when invoked with the `-e` or `-E` command-line flags. This usage may indicate an adversary's attempt to execute arbitrary commands or launch a reverse shell from a host, which could facilitate unauthorized access or data exfiltration. The relevant MITRE ATT&CK Technique that applies here is **Command and Scripting Interpreter: Perl** (T1059.5).

  The primary telemetry sources for this detection are Windows process creation logs, specifically looking for Event ID 4688, which captures the creation of new processes, and includes command line details. If malicious, the execution can lead to significant risks, including unauthorized system control or data leakage. However, it is crucial to note that this detection alone does not confirm malicious intent; legitimate administration or automated scripts may also utilize this syntax.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Security Event ID 4688 logs for the process creation of `perl.exe` with the command line containing `-e` or `-E`. High confidence malicious indicators include unusual parent process origins, e.g., executed by `cmd.exe` or through a suspicious automation script.

  - **Analyze Command Line Parameters:** Investigate the exact command line arguments passed to `perl.exe`. If the command contains suspicious payloads or attempts to connect to external IP addresses, this raises the likelihood of malicious intent.

  - **Review Parent Processes:** Identify the parent process (Field: `NewProcessId` and `ProcessId` in Event ID 4688). Legitimate uses may involve known system processes like PowerShell or scheduled tasks, while suspicious parents like `schtasks` or `wscript` warrant deeper investigation.

  - **Cross-Reference with Network Traffic:** Correlate findings with network logs (Firewall or Network IDS/IPS logs) for any unusual outbound connections initiated by the host running `perl.exe`. Look for access to uncommon endpoints or IPs following the execution.

  - **Evaluate System/User Context:** Determine if the execution occurred under administrative privileges or by a user account with known elevated privileges. Malicious actions are more concerning when executed by privileged users or on critical assets.

  ### Prioritization

  This alert should be treated with medium severity due to its impact on systems potentially allowing shell access or execution of arbitrary code. While the chance of abuse is significant, especially on hosts exposed to the internet, such behavior can also be indicative of legitimate administrative or scripted actions.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as obfuscating Perl processes with alternative command calls or utilizing encoded payloads. Reliable detection relies on comprehensive logging of process creation events across all endpoints. Legitimate activities that might trigger the alert include internal scripts using Perl for automation tasks. A related detection to consider is monitoring for suspicious outbound connection attempts (e.g., `malicious IP addresses` or `reverse shells` triggered by the Perl execution).

