title: Perl Inline Command Execution
id: f426547a-e0f7-441a-b63e-854ac5bdf54d
status: test
description: Detects execution of perl using the "-e"/"-E" flags. This is could be
  used as a way to launch a reverse shell or execute live perl code.
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\perl.exe'
  - OriginalFileName: 'perl.exe'       # Also covers perlX.XX.exe
  selection_cli:
    CommandLine|contains: ' -e'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying the execution of the Perl scripting language through command-line flags `-e` or `-E`. This behavior can indicate that an attacker is utilizing Perl to run potentially malicious code, such as spawning a reverse shell or executing ad-hoc scripts without leaving a clear signature. Given Perl's capabilities, it’s a common choice for adversaries seeking to maintain a foothold in a system by executing code remotely.

  The primary threat scenario involves a malicious actor leveraging Perl to execute code in an environment where traditional detection mechanisms may overlook such activity. The adversary's objectives could range from data exfiltration to establishing persistence in the network. This activity corresponds with the MITRE ATT&CK tactic of Execution and the technique ID T1059, which describes the execution of scripts in various languages, including Perl.

  The most relevant telemetry for this detection includes process creation events, where command-line arguments associated with Perl executions can be analyzed for suspicious flags and commands. This includes monitoring Windows event logs that reflect a detailed account of all process creation activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs around the timestamp of the alert to identify any suspicious instances of `perl.exe` execution with the `-e` or `-E` flags. Highlight any unusual command-line arguments that may indicate malicious intent.

  - **Correlate with Network Traffic:** Analyze outbound network connections to determine if the Perl command executed relates to any reverse shell connections. Look for unusual patterns, such as connections to unknown IP addresses or domain names initiated shortly after the Perl execution.

  - **Validate Known Good Behavior:** Identify legitimate uses of Perl within your organization by consulting with development teams or reviewing existing scripts. Document this legitimate usage to differentiate between benign and malicious activity effectively.

  - **Monitor User Context:** Check the user context under which the Perl script was run. Investigate accounts with unusual privilege levels for executing scripts and analyze any related account activity to ensure no credentials have been compromised.

  ### Prioritization
  This alert has a medium severity because although the use of Perl is not inherently malicious, the specific execution with the `-e` or `-E` flags is often associated with malicious activity, especially when combined with other suspicious behaviors such as outbound connections to unfamiliar hosts.

  ### Blind Spots and Assumptions
  The main blind spot in this detection is the potential for false positives, particularly in environments where Perl is legitimately utilized for scripting or development purposes. The detection logic assumes that an alert will trigger solely based on command-line arguments without additional context, which could lead to misinterpretation of legitimate activity. Required logs for this detection include detailed process creation logs with command-line arguments, which must be enabled in Windows logging configurations for effective monitoring.

