note: |
  ### Technical Context

  This rule detects the creation of symbolic links to Volume Shadow Copies using the `mklink` command on Windows systems. Such behavior is often associated with credential dumping techniques where an attacker may aim to access sensitive data stored in shadow copies, ultimately facilitating lateral movement or data exfiltration. This activity aligns with the MITRE ATT&CK tactics of **Credential Access** (TA0006) and techniques **Credential Dumping: Volume Shadow Copy Copies** (T1003.002) and **Credential Dumping: Files from Web Browsers** (T1003.003).

  The primary telemetry for this detection comes from process creation logs, specifically Windows Security Event ID 4688, indicating the execution of the `mklink` command with parameters targeting shadow volumes. The security impact can be significant, as unauthorized access to shadow copies could expose sensitive information. However, this detection does NOT confirm that malicious activity has occurred without additional context, as legitimate administrative actions involving shadow copies for backup purposes may trigger this rule.

  ### Investigation Steps

  - **Review the command line:** Check Security Event ID 4688 for the presence of `mklink` targeting `HarddiskVolumeShadowCopy`. Malicious indicators may show unusual timestamps or user accounts not typically associated with administrative actions.

  - **Identify the user context:** Determine if the command was executed by a high-privileged user or service account. Legitimate administrative users performing shadow copy operations should match expected roles and typical time frames.

  - **Analyze associated process creation events:** Investigate Sysmon Event ID 1 for the creation of processes that followed `mklink`. Look for correlated processes or commands leading to suspicious activities.

  - **Look for additional indicators of compromise:** Cross-reference with known indicators of compromise (IOCs) within the environment, such as unexpected parent processes or network activity, to ascertain if the presence of the symbolic link correlates with known malicious behaviors.

  - **Validate shadow copy content:** If applicable, use tools to access the contents of the volume shadow copies impacted. Determine if sensitive data is accessible that should not be available under the current account's context.

  - **Assess audit logs for patterns:** Review backup logs for instances where legitimate `mklink` commands were issued in the last 30 days to delineate between benign administrative tasks and potential malicious actions.

  ### Prioritization

  This alert carries a **high** severity level due to the potential for serious security impact if exploited, given that shadow copies may contain sensitive data. The likelihood of malicious abuse is significant, especially within threat scenarios involving credential harvesting, which are commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive process creation logs, as some configurations may not capture all instances of `mklink` usage. Legitimate administrative tasks can frequently trigger this alert, leading to potential false positives. Companion detections, such as monitoring for specific user behavior patterns when accessing shadow copies, can enhance coverage against credential dumping activities.

