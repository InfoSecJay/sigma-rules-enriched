  ### Technical Context

  This rule detects the creation of symbolic links to Volume Shadow Copies using the Windows `mklink` command. The likely attacker objective is to gain access to backups or other sensitive data that reside within shadow copies, which can be used for credential dumping or data exfiltration. This behavior falls under the MITRE ATT&CK tactic of Credential Access, specifically techniques T1003.002 (Credential Dumping: Local Credential Dumping) and T1003.003 (Credential Dumping: Cloud Credential Dumping). The primary telemetry source is Windows process creation logs, specifically monitoring for `CommandLine` entries associated with `mklink` and shadow copy references. If malicious, this activity can lead to significant security impacts by exposing sensitive information. This detection does NOT confirm that data has been accessed or exfiltrated but indicates potentially malicious intent.

  ### Investigation Steps

  - **Review creation of symbolic links:** Inspect process creation logs for Event ID 4688, focusing on the `CommandLine` field to identify instances where `mklink` is employed with `HarddiskVolumeShadowCopy`. Confirm if the command's usage is legitimate.

  - **Identify context of execution:** Determine the user account under which the command ran. If executed by a non-administrator or a user not typically associated with backup or administration tasks, this may indicate malicious behavior.

  - **Check for altered permissions:** Verify the file system permissions on the affected shadow copies. Look for unexpected changes to access levels that could indicate an attempt to cover up malicious activity.

  - **Assess recent user activity:** Review relevant logs to check if the user account has been associated with suspicious activity prior to the creation of the symbolic link, such as failed logins or accessing sensitive directories (consider Security Event ID 4625).

  - **Observe legitimate use cases:** Document and compare expected behavior, such as legitimate administrators creating shadow links for backed-up data or performing maintenance tasks. This provides context for evaluating anomalies.

  ### Prioritization

  This alert holds high severity due to the potential impact on sensitive data. The likelihood of malicious abuse is significant, particularly since adversaries often exploit volume shadow copies to obtain credentials and other valuable assets. Such techniques are frequently weaponized in targeted attacks, making investigation critical.

  ### Blind Spots and Assumptions

  Detection limitations include potential bypass techniques like using alternate command-line arguments or executing `mklink` through scripts that may not be recorded. Reliable detection depends on the accurate and complete configuration of Windows process creation logs. Legitimate administrative actions, such as backing up data, may inadvertently trigger this alert if not properly filtered. A related detection to consider is monitoring for direct access attempts to shadow copy files, which can provide additional validation of suspicious behavior.

