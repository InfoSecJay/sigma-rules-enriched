note: |
  ### Technical Context

  This Sigma rule detects the execution of child processes from the SysAidServer parent process, specifically those spawned by Java executables (java.exe or javaw.exe). The typical attacker objective is to perform lateral movement and potentially establish persistence or execute malicious code within environments that utilize SysAid, as evidenced by past intrusions attributed to the MERCURY threat actor. This behavior aligns with the MITRE ATT&CK tactic of Lateral Movement (TA0024), specifically technique T1210 (Exploitation of Remote Services).

  The primary telemetry sources are Windows process creation logs (Security Event ID 4688 and/or Sysmon Event ID 1). If the activity is malicious, it may lead to unauthorized access or control over sensitive systems leveraging the SysAidServer's functionalities. It is important to note that this detection does NOT confirm that the observed behavior is inherently malicious; further investigation is required to establish intent and context.

  ### Investigation Steps

  - **Review parent-child process relationships**: Check Security Event ID 4688 and Sysmon Event ID 1 for child processes created by SysAidServer to identify the full command line arguments and parameters used. Malicious indicators to consider include unusual parameters or known malware signatures.

  - **Investigate execution context**: Analyze the execution context of SysAidServer and its child processes by reviewing Event ID 4688 fields such as NewProcessName, ProcessId, and CreateTime. Legitimate activity typically involves standard SysAid functions, whereas anomalies may indicate malicious intent.

  - **Correlate with additional telemetry**: Cross-reference findings with Sysmon Event ID 10 (ProcessAccess) logs to observe if there were any suspicious accesses or modifications to files by the Java child processes. Look for access to sensitive files like configs or credential stores that seem out of place.

  - **Assess environment-specific baselines**: Compare the behavior and frequency of SysAidServer usage against established baselines within your organization’s environment. High deviations could signify a security incident.

  - **Check for lateral movement indicators**: Review network logs and Event IDs that indicate remote access or lateral movement, such as Event ID 5140 (Network Share Object Access) and Event ID 4624 (Logon), to see if there’s a correlation with the detected process behavior.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems running SysAid, which may contain sensitive organizational data. The likelihood of malicious exploitation is moderate, as the MERCURY threat actor has historically targeted SysAid. Although lateral movement is a common strategy for adversaries, not all instances of this behavior result in an actual security incident.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging for legitimate SysAid child processes, which could lead to false positives. To ensure reliable detection, the logging level for Sysmon should be appropriately configured, including full command line logging. Legitimate activities could include administrative tasks or service management performed by authorized users. A related detection to strengthen coverage could be monitoring for anomalous access patterns to SysAid-related network shares or services.

