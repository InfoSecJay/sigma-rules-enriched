note: |
  ### Technical Context
  This detection rule identifies the use of `WSReset.exe` to bypass User Account Control (UAC) on Windows operating systems. Adversaries exploit this technique to execute processes with elevated privileges without user consent, potentially leading to the execution of malicious payloads. The use of `WSReset.exe` is particularly concerning because it is a legitimate Windows utility that resets the Windows Store without requiring administrative privileges; however, its misuse can grant attackers escalated access.

  The relevant MITRE ATT&CK tactics for this rule include **Privilege Escalation** (TA0004) through the **Bypass User Account Control** technique (T1548.002). Attackers may use this method to escalate privileges post-compromise, helping them achieve their objectives of maintaining persistence, executing payloads, or further compromising the network. Primary log sources for this detection include process creation events from Windows logs, which will provide insights into process invocations and parent-child relationships.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Obtain logs from the Windows event source that detail process creation, specifically looking for instances where `WSReset.exe` is the parent process.
  - **Analyze Parent-Child Process Relationships**: Review the relationships between processes, focusing on instances where `conhost.exe` is a child of `WSReset.exe`, as this indicates potential misuse of the legitimate tool.
  - **Check Event Logs for Anomalies**: Look for unusual event IDs related to UAC prompts and privilege elevation around the time `WSReset.exe` was executed, which might indicate unauthorized actions.
  - **Correlate with User Activity**: Investigate surrounding user activity, including login times, account privileges, and other potentially suspicious behaviors that could indicate a larger compromise.

  ### Prioritization
  This alert is considered high severity due to the significant risk that unauthorized elevation of privileges poses in an enterprise environment. Successful exploitation can lead to extensive damage, including data breaches or the installation of malicious software.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage against legitimate use cases of `WSReset.exe`, as not all usage is malicious. The detection logic assumes that `conhost.exe` is an indicator of compromise when spawned by `WSReset.exe`, which may not always hold true in every organizational context. Additionally, necessary logging configurations, such as enabling detailed process creation logging in Windows, must be in place for the detection rule to function effectively.

