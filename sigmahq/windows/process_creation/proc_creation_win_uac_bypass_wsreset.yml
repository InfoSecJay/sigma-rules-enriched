note: |
  ### Technical Context

  This Sigma rule detects the invocation of `WSReset.exe` used as a method to bypass User Account Control (UAC) protections. Attackers aim to gain elevated privileges and execute malicious code without user consent. The relevant MITRE ATT&CK tactics and technique are “Privilege Escalation” (TA0004) and “Bypass User Account Control” (T1548.002). The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688, which captures the creation of processes. If the behavior is indeed malicious, it can lead to unauthorized access and potential compromise of sensitive systems. This detection does NOT confirm that privilege escalation has successfully occurred without further context and investigation.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `WSReset.exe` being executed, along with details such as the user context and command-line arguments used.

  - **Analyze parent-child process relationships:** Identify any parent processes that spawned `WSReset.exe` by cross-referencing with Event ID 4688. Legitimate execution typically comes from a user-initiated action; however, unexpected parent processes like `conhost.exe` can indicate possible evasion techniques.

  - **Review original file details:** Validate the `OriginalFileName` of the `conhost.exe` process. If it matches `CONHOST.EXE`, this points towards potential misuse; a legitimate instance should originate from well-known system processes.

  - **Investigate related file activity:** Check for concurrent activities that result from `WSReset.exe`, such as modifications to critical system files or registry keys. Log artifacts from Windows Event ID 4663 (file access) can reveal suspicious changes.

  - **Identify indicators of compromise:** Look for specific command-line arguments or unusual user accounts executing the `WSReset.exe`. Use Event ID 4697 to track service creation or modifications that may pair with this alert.

  - **Establish baseline for normal behavior:** Review past activity logs to define expected operational behavior of `WSReset.exe`. Understand typical usage patterns to aid in distinguishing between benign and suspicious invocation.

  ### Prioritization

  The alert is of high severity due to its potential to enable unauthorized privilege escalation on systems that could lead to widespread security breaches. The likelihood of this behavior being malicious is significant, as it is a commonly weaponized technique in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if `WSReset.exe` uses legitimate arguments or is executed in contexts that don't raise alarms. Successful detection relies on comprehensive coverage of Windows process creation events; if logging is misconfigured or incomplete, instances may be missed. Legitimate use cases, such as user-initiated resets after applying updates, may trigger this alert. Companion detections for process injection techniques or abnormal process trees would strengthen coverage against evasions related to this behavior.

