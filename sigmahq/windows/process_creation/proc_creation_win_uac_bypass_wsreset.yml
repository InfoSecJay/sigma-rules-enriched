detection:
  selection:
    ParentImage|endswith: '\wsreset.exe'
  filter:
  - Image|endswith: '\conhost.exe'
  - OriginalFileName: 'CONHOST.EXE'
  condition: selection and not filter
falsepositives:
- Unknown sub processes of Wsreset.exe
level: high
note: |
  ### Technical Context

  The rule detects the execution of `conhost.exe` as a child process of `wsreset.exe`, indicating a potential bypass of User Account Control (UAC). Attackers leverage this technique to run privileged processes without proper user consent, often aiming to escalate privileges on the system. This behavior maps to the MITRE ATT&CK tactic of Privilege Escalation, specifically technique T1548.002 (Bypass User Account Control).

  The primary telemetry source is process creation logs, particularly Windows Event ID 4688, which captures the creation of processes and their parent-child relationships. If malicious, this behavior can facilitate unauthorized access to sensitive system functions or data. Importantly, this detection does NOT prove that malicious activity occurred; it merely indicates a potential UAC bypass attempt.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 for occurrences where `wsreset.exe` is the parent process and `conhost.exe` is the child. Note the timestamps and user context.

  - **Correlate with other events**: Look for related events from this time frame in Windows Security logs, especially where privileged actions were attempted (Event ID 4672 for User Account Logon with special privileges).

  - **Identify legitimate use cases**: Note that valid instances of `wsreset.exe` are often executed by system processes or user-initiated via command line for resetting the Windows Store cache. Compare the execution context against expected activity.

  - **Look for AV/EDR alerts**: Verify if the system's endpoint protection flagged any suspicious activity around the execution of `wsreset.exe` or `conhost.exe`. This may help verify if a known malicious pattern was involved.

  - **Examine user actions prior to execution**: Check logs for commands run in Powershell or CMD that may have invoked `wsreset.exe`. Focus on user account activity leading up to the alert (Event IDs 4688 for process creation, 4624 for account logon).

  - **Validate any file or registry changes**: Investigate for any modifications made by `conhost.exe` post-execution, particularly in sensitive areas like system config or user folder (check for suspicious file changes in the Windows logs).

  ### Prioritization

  This alert carries a high severity due to the potential impact on sensitive systems and the likelihood of malicious abuse through UAC bypass techniques. This behavior can be indicative of common attack methods used by adversaries to escalate privileges, making it critical to triage promptly.

  ### Blind Spots and Assumptions

  Detection may be limited if `wsreset.exe` is used legitimately, as it is a built-in Windows tool. Additionally, the alert may be triggered by benign applications or scripts relying on `wsreset.exe`. Ensure process creation logging is enabled with detailed levels for full coverage. A related detection to consider is monitoring for abnormal command line arguments passed to `conhost.exe` during creation, which could further enhance visibility into potential misuse.

