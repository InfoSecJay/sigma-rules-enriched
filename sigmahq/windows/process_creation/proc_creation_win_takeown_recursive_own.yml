note: |
  ### Technical Context

  This Sigma rule detects the execution of the `takeown.exe` command-line utility, specifically when it is used with the `/f` (file) and `/r` (recursive) flags, which enables an attacker to take ownership of files and directories. The likely objective of the attacker is to gain higher permissions on targeted resources, possibly to manipulate sensitive data or disable security controls. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1222.001 (Application Layer Protocol: Process Command-Line Interface).

  The primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688, which captures process creation events. Should this command be executed maliciously, unauthorized access to critical files could lead to significant security impacts, such as breach of data confidentiality or integrity. It is important to note that this detection does NOT confirm that an attack is occurring on its own—administrators and developers might use this command legitimately during file management activities.

  ### Investigation Steps

  - **Identify process creation event:** Review Security Event ID 4688 logs for `takeown.exe` executions. Confirm that the command line includes `/f` and `/r` flags for clarity on intent.

  - **Correlate user activity:** Check the account used to execute this command. Logins from unrecognized or high-risk users may suggest malicious intent. Use Event ID 4624 to review login records and correlate with the command execution.

  - **Examine file ownership changes:** Investigate the ownership of files or folders affected by the `takeown.exe` command. Use PowerShell or file auditing tools to check for unauthorized ownership changes and identify sensitive files involved.

  - **Establish normal administrative behavior:** Identify expected uses of `takeown.exe` by reviewing the baseline administrative activities in your environment. Document common cases (e.g., system updates) where legitimate ownership changes occur.

  - **Look for high-confidence indicators of compromise:** Verify any associated malware or suspicious activity on the asset through EDR telemetry or reference network logs (such as unusual outbound connections) that coincide with the time of the `takeown.exe` execution.

  ### Prioritization

  This alert has a medium severity due to the potential for significant impact if critical system files or data are compromised by unauthorized users. The likelihood of malicious use is moderate since common administrative operations can trigger this detection, but the recursive use of `takeown.exe` is a behavior typically associated with privilege escalation tactics.

  ### Blind Spots and Assumptions

  Legitimate administrative functions may trigger this alert, leading to false positives, especially in environments where file permissions are frequently modified. Detection may be limited if logs for process creation are not fully enabled or if logging levels are insufficient. Adversaries may also use other means to evade detection, such as utilizing custom scripts or alternative utilities for similar operations. Related detections could include monitoring access control list (ACL) changes or file permission modifications to strengthen the coverage of unauthorized privilege elevation attempts.

