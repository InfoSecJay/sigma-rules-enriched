note: |
  ### Technical Context

  This Sigma rule detects changes to the "NoLMHash" registry value on Windows systems, specifically when it is set to "0" (DWORD). This configuration allows the operating system to store LAN Manager (LM) hashes of user passwords, which significantly weakens password security. The likely attacker objective is to enable LM hash storage to conduct offline password cracking or to utilize these weaker hashes for unauthorized access.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Tactic: Persistence
  - Technique: Account Manipulation (T1112)

  The primary telemetry sources include Windows process creation logs, specifically monitoring registry modifications through Event ID 4688 and Sysmon Event ID 1. If this change is made maliciously, it opens an enterprise to password cracking attacks, thus increasing the risk of unauthorized access and credential theft. This detection does NOT confirm that an attack has occurred, only that potentially dangerous modifications to authentication methods have been made.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for process creation events around the time of the alert. Look for any PowerShell or command-line activities that reference registry paths related to LSA configuration. Benign activity may include administrators making legitimate security configurations.

  - **Examine command-line arguments:** Focus on entries that contain "\System\CurrentControlSet\Control\Lsa" and "NoLMHash" set to "0" within the command-line arguments of the corresponding process IDs. Look for known administrative tools and their typical command structures to differentiate benign from malicious actions.

  - **Identify recent registry modifications:** Query the Windows Registry (specifically under `HKLM\SYSTEM\CurrentControlSet\Control\Lsa`) for recent changes. Legitimate administrative changes should follow standard maintenance schedules and IT policy, while unauthorized changes may occur outside of expected hours.

  - **Correlate alerts with user accounts:** Cross-reference the alert with active user sessions or recent login attempts using Security Event ID 4624. Pay attention to privileged accounts; unauthorized changes to the "NoLMHash" setting by non-administrative users could indicate a compromise.

  - **Monitor impact assessment:** Assess the affected system's role within the organization (e.g., domain controller vs. standard workstation). Changes on a domain controller are far more critical, increasing the urgency of follow-up investigations regarding privilege escalation.

  - **Validate associated indicators:** Check for any unusual network traffic or authentication attempts that correlate with the registry change time frame, such as failed login attempts or access to administrative shares that might indicate exploitation efforts.

  ### Prioritization

  This alert should be treated as high severity due to the potential for serious compromise involving weak password storage practices. The presence of modified LM hash settings increases the likelihood of adversaries utilizing these weaker hashes for malicious purposes, making this behavior a common tactic in credential manipulation attacks.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative actions, particularly in organizations undergoing routine security policy updates. Evasion techniques could include re-enabling LM hash storage as part of broader credential theft strategies. Reliable detections require enabled audit logging for registry changes and process creations. Related detections, such as monitoring for unauthorized use of administrative tools (PowerShell or C), can help strengthen coverage against these attacks.

