  ---

  ### Technical Context

  This rule detects changes to the "NoLMHash" registry value within the Windows operating system. When this value is set to "0", Windows will allow the storage of LAN Manager (LM) hashes of passwords. The primary attacker objective for manipulating this setting is to enable weaker password storage, facilitating password cracking and compromise of user credentials. This behavior aligns with the MITRE ATT&CK technique for Credential Dumping (T1112).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on modifications to the registry (Event ID 4657 in conjunction with Event ID 4688 for command line activity). If exploited maliciously, this could lead to the exposure and misuse of user credentials, making accounts vulnerable to further attacks. However, this detection does NOT confirm that an attacker has gained access or successfully exploited the system; it merely indicates a potential risk.

  ---

  ### Investigation Steps

  - **Review the registry modification command:** Examine the command line associated with the detected process creation. Look for Event ID 4688 and verify that it includes '\System\CurrentControlSet\Control\Lsa' with 'NoLMHash' set to '0'.

  - **Identify the initiating user:** Check the Security Event ID 4624 for the user account that made the registry change. Compare this account's behavior against typical activities for a standard user versus administrative actions.

  - **Evaluate system context:** Analyze the host role (e.g., domain controller vs. endpoint) and asset criticality. Setting this registry key is particularly concerning on privileged accounts or critical infrastructure.

  - **Confirm legitimate administrative actions:** Determine if this change is part of an approved configuration or a policy update. Review relevant change management logs or notifications for signs of legitimate alterations.

  - **Look for additional suspicious behaviors:** Cross-reference related Event ID 4657 entries against known baselines for changes to other security settings. Investigate any unusual command lines or patterns that coincide with the registry modification.

  ---

  ### Prioritization

  This alert has a high severity due to its potential impact on credential security in a Windows environment. The likelihood of adversarial abuse is considerable, as enabling LM hash storage is a common tactic for credential exploitation. This behavior is recognized as a security risk and can lead to further compromise of the network.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of information on user intent or legitimate administrative context that justifies the change. Adversaries may opt to modify registry settings through various legitimate tools that evade detection. Activities such as system updates or configuration scripts could inadvertently trigger this alert without malicious intent. A related detection to consider is unauthorized access attempts (e.g., Event ID 4625) in conjunction with registry changes, reinforcing the investigation context.

