note: |
  ### Technical Context

  This Sigma rule detects changes to the "NoLMHash" registry value, specifically when it is set to "0," allowing Windows to store LAN Manager (LM) hashes of user passwords. The likely attacker objective behind this behavior is to weaken password security in a Windows environment, making it easier to crack credentials and escalate privileges, especially in scenarios involving lateral movement. This behavior falls under the MITRE ATT&CK technique "Enable LM Hash Storage" (T1112), which is used for persistence and defense evasion.

  The primary telemetry source is Windows process creation logs, specifically monitoring registry modifications through Event ID 4657, which captures changes to critical registry keys. If this change is made maliciously, it significantly increases the risk of credential theft and unauthorized access. It is important to note that this detection does NOT confirm that a compromise has occurred; it only indicates a potentially insecure configuration change.

  ---

  ### Investigation Steps

  - **Review the event log for registry changes:**
     - Check for Windows Security Event ID 4657. Look for the specific change to the 'NoLMHash' key and confirm whether its value was set to "0."

  - **Identify the process creating the registry modification:**
     - Use Sysmon Event ID 1 to trace back the process that made the registry change. Look for command lines including paths to 'Lsa' and identify whether it was initiated by a legitimate system process or an unexpected application.

  - **Assess the asset’s role within the environment:**
     - Determine whether the affected system is a domain controller or a regular workstation. Changes on domain controllers are more critical and should escalate investigation urgency.

  - **Check for legitimate administrative activities:**
     - Validate if the change was made during an approved configuration change or maintenance window. Document times of change and correlate with scheduled IT maintenance activities.

  - **Correlate other suspicious activities:**
     - Review for accompanying signs of compromise or abuse, such as abnormal user behavior or DNS queries related to credential dumping tools, to see if this behavior aligns with malicious activities.

  - **Identify low-confidence benign indicators:**
     - Investigate if there are known applications or automated processes in your environment that modify registry settings related to password storage for compliance purposes (e.g., legacy applications requiring LM hash).

  ---

  ### Prioritization

  This alert should be classified as high severity due to the critical impact on system security, specifically related to credential storage practices. The likelihood of malicious abuse is considerable since attackers often seek to leverage weak configurations to facilitate unauthorized access, making this behavior a common target in cyberattacks.

  ---

  ### Blind Spots and Assumptions

  Detection can be limited by lack of monitoring on all relevant logs or misconfigurations that prevent capturing registry changes reliably. Legitimate administrative activities, particularly in environments upgrading or maintaining systems, may unintentionally trigger this alert. Companion detections, such as monitoring for accounts with privilege escalation (e.g., modifications to user rights or group memberships), can complement the analysis of this alert.

