note: |
  ### Technical Context
  This rule detects attempts to enable the storage of LAN Manager (LM) password hashes on Windows systems by modifying the "NoLMHash" registry value. When set to "0," the system allows LM hashes to be stored in Active Directory and local Security Accounts Manager (SAM) databases, which can significantly weaken password security. Attackers may exploit this setting to facilitate easier credential harvesting through techniques that target weaker hashes, especially on legacy systems or within environments where multi-factor authentication is not enforced.

  The primary threat scenario involves attackers seeking to compromise user accounts or elevate privileges by capturing LM hashes. This modification may be part of a broader persistence strategy or evasion technique, in alignment with the MITRE ATT&CK framework. Relevant tactics include **Persistence (T1547)** and **Defense Evasion (T1112)**, highlighting the potential for attackers to maintain a foothold while avoiding detection mechanisms.

  The primary data sources for detection in this context include process creation events that can show commands executed to modify the registry, as well as logs from Windows Event Log that track changes to system configurations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation events to identify any commands involving modifications to the "NoLMHash" registry value. Look for suspicious command-line activities that could indicate unauthorized changes.

  - **Examine Registry Change Events**: Collect and inspect event logs that show changes to the registry, particularly focusing on the "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\LSA" path for any alterations to the "NoLMHash" value.

  - **Check Active Directory Accounts**: Investigate the accounts that are most often subjected to LM hash storage. Identify any accounts that have exhibited unusual activities or privilege escalations resulting from potential misuse of stored hashes.

  - **Identify Related Credential Theft Tools**: Review for any indicators of tools or techniques known to exploit LM hashes, such as those associated with credential dumping. This may include looking for commands or files related to known credential theft frameworks.

  ### Prioritization
  This alert has a high severity due to the significant threat it poses to an enterprise environment. Enabling LM hash storage can lead to increased vulnerability to credential theft and unauthorized access, thereby compromising sensitive data and systems.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logging is not consistently enabled across all endpoints or if there are gaps in registry monitoring. The detection logic assumes that attackers will directly modify the "NoLMHash" value; however, sophisticated actors may deploy other methods to achieve their goals without setting this specific registry key. Additionally, the alert relies heavily on the availability of Windows process and registry logs that may require specific configurations to capture effectively.

