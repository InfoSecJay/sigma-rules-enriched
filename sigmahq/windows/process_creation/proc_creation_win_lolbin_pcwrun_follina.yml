  ### Technical Context

  This Sigma rule detects the execution of the Program Compatibility Assistant's `pcwrun.exe` process, specifically targeting cases where the command line includes directory traversal patterns such as `../`. This behavior suggests an attempt to exploit the Follina vulnerability (CVE-2022-30190) via indirect command execution, indicating a likely attacker objective of escalating privileges or executing arbitrary code on the target system. The relevant MITRE ATT&CK tactic is "Execution" (TA0002) and technique is "Run Command" (T1218).

  Primary telemetry sources include Windows Process Creation events, specifically Security Event ID 4688, which logs all process creation activity. If malicious, the security impact could be severe, potentially leading to unauthorized access or control over the affected systems. Importantly, the detection of this behavior does NOT confirm successful exploitation or data compromise by itself.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for instances where `pcwrun.exe` is launched. Pay attention to the CommandLine field for any occurrences of `../`. Example benign behavior should have standard command lines without suspicious traversal patterns.

  - **Correlate with recent document access**: Look for any Office document transactions or downloads that occurred prior to the alert, as the Follina exploit often starts with a malicious Office document. Review logs from relevant applications or file access events.

  - **Validate with Sysmon logs**: Cross-reference Sysmon Event ID 1 for all process creation activity around the time of the alert to spot any unusual parent-child process relationships or command line arguments related to `pcwrun.exe` execution.

  - **Check for additional indicators of compromise**: Investigate network connections (Windows Firewall logs or DNS logs) initiated by the machine that executed `pcwrun.exe` to confirm if there were any outbound calls to known malicious IPs or domains at that time.

  - **Assess the host role**: Determine the criticality of the affected system. If it is a server or a system with sensitive data, escalate the investigation priority due to the potential high impact.

  - **Identify high-confidence malicious indicators**: Look for any unauthorized modifications or file creations in typically sensitive folders such as `C:\Users\<username>\AppData` or execution of processes with suspicious names that appear immediately following the detected event.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact on business functions if the affected system is exploited. The execution of `pcwrun.exe` in conjunction with directory traversal patterns is a known tactic leveraged by adversaries, and the likelihood of malicious abuse is elevated given the nature of the vulnerability being exploited.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as renaming `pcwrun.exe` or using alternative execution methods that bypass traditional monitoring. Reliable detection requires proper logging configurations to capture process creation events comprehensively. Legitimate activities that may trigger this alert encompass standard system compatibility features; however, they rarely invoke `pcwrun.exe` with `../` in the command line. A companion detection to strengthen coverage would involve monitoring Windows Script Host execution (T1059.004) for signs of related malicious activities during the same timeframe.

