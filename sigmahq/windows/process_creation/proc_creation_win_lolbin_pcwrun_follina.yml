note: |
  ### Technical Context

  This rule detects the use of `pcwrun.exe` to indirectly execute commands, specifically leveraging the Follina vulnerability (CVE-2022-30190). Attackers may use this technique to bypass conventional security measures, executing malicious payloads hidden within legitimate processes. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Defense Evasion (T1218).

  The primary telemetry sources involved are Windows process creation events (Event ID 4688) and command line arguments, particularly for the execution of `pcwrun.exe`. If malicious, this may lead to unauthorized execution of code, potentially compromising the system or network. However, this detection alone does not confirm that a breach has occurred, as numerous factors can lead to this behavior.

  ### Investigation Steps

  - **Check for Process Creation:** Review Windows Security Event ID 4688 logs to confirm instances of `pcwrun.exe` executed with a suspicious command line containing `../`. Malicious indicators include the presence of unexpected file paths or URLs.

  - **Analyze Command Line Arguments:** Investigate the command line arguments associated with `pcwrun.exe` instances. Look specifically for any unusual or unfamiliar commands. Legitimate usage typically does not include traversal patterns.

  - **Confirm Parent Process:** Validate the parent process of `pcwrun.exe` using Event ID 4688 logs. If launched by known benign processes (like `explorer.exe`), further scrutiny may be required; however, processes like `powershell.exe` or `cmd.exe` may suggest malicious activity.

  - **Evaluate System Context:** Identify the host role where `pcwrun.exe` was executed. If it's a critical system (e.g., domain controllers or file servers), treat the alert with higher urgency due to potential greater impact.

  - **Cross-reference with VirusTotal:** Utilize a service like VirusTotal by checking the hash of any file executed via `pcwrun.exe`. Documents connected to Follina (CVE-2022-30190) are frequently flagged, providing high-confidence malicious indicators.

  ### Prioritization

  This alert indicates high severity since the use of `pcwrun.exe` could compromise critical systems, especially when targeting privilege escalation or lateral movement. The likelihood of this technique being weaponized is significant as it falls under a recently exploited vulnerability.

  ### Blind Spots and Assumptions

  Detection may be limited by system configurations that do not log process creation events adequately. Legitimate activities such as software compatibility processes may also trigger this alert, necessitating careful review. Companion detections could include monitoring for unusual PowerShell activity (T1086) that often accompanies such exploit attempts, enhancing coverage against multifaceted attacks.

