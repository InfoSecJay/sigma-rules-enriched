  ---

  ### Technical Context

  This rule detects the execution of `pcwrun.exe` with command line arguments that include `../`, which is often exploited to bypass restrictions and execute malicious commands leveraging the Follina vulnerability (CVE-2022-30190). The likely attacker objective is to execute arbitrary code in the context of the current user, which can lead to system compromise. This behavior is categorized under the MITRE ATT&CK tactics of "Execution" (TA0002) and "Defense Evasion" (TA0005) through the technique "Non-Standard Application Layer Protocol" (T1218).

  The primary telemetry source is the Windows process creation event logs (particularly Event ID 4688 or Sysmon Event ID 1) which provide information about process execution. If this behavior is malicious, it can result in unauthorized access, data exfiltration, or full system compromise. Importantly, this detection does NOT confirm that the command executed successfully or that malicious activity definitively occurred without further context.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Event ID 4688 and/or Sysmon Event ID 1 for instances where `Image` ends with `\pcwrun.exe` and `CommandLine` contains `../`. Look for unusual execution patterns, especially those initiated from unexpected parent processes.

  - **Identify parent processes**: Determine the parent process of the detected `pcwrun.exe` instance. A common benign parent might be `explorer.exe`, whereas involvement of scripts or malware processes could raise suspicion.

  - **Validate command line arguments**: Analyze the complete `CommandLine` for signs of obfuscation or suspicious behavior. Legitimate uses of `pcwrun.exe` typically do not include `../` patterns, which target directory traversal.

  - **Search for related artifacts**: Check for associated file creations or modifications (Event ID 4663) that occur in the timeframe of the alert. Look for any unfamiliar executables or scripts that could indicate lateral movement or payload delivery.

  - **Review system logs for anomalies**: Investigate recent Windows Security Event logs for any failed or suspicious authentication attempts around the same time frame. This can indicate that an attacker is attempting to gain unauthorized access.

  - **Consider asset criticality**: Assess the severity of the system affected by the alert. If it is a domain controller or serves sensitive data, prioritize the response as critical.

  ---

  ### Prioritization

  This alert has a high severity due to the potential impact on sensitive systems if real exploitation occurs. The exploitation of the Follina vulnerability is actively weaponized, increasing the likelihood of malicious abuse. Therefore, immediate investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of necessary logging configurations or telemetry sources which may obscure the detection of parent processes or execution context. Legitimate administrative tasks or software installs can trigger this alert if they utilize similar command strings. An effective companion detection would include monitoring for unexpected behavior in commonly legitimate applications that execute scripts, improving the validity of context during investigations.

