title: Share And Session Enumeration Using Net.EXE
id: 62510e69-616b-4078-b371-847da438cc03
status: stable
description: Detects attempts to enumerate file shares, printer shares and sessions
  using "net.exe" with the "view" flag.
references:
- https://eqllib.readthedocs.io/en/latest/analytics/b8a94d2f-dc75-4630-9d73-1edc6bd26fff.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1018/T1018.md
author: Endgame, JHasenbusch (ported for oscd.community)
date: 2018-10-30
modified: 2023-02-21
tags:
- attack.discovery
- attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains: 'view'
  filter:
    CommandLine|contains: '\\\\'
  condition: all of selection_* and not filter
falsepositives:
- Legitimate use of net.exe utility by legitimate user
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the `net.exe` utility to enumerate file shares, printer shares, and sessions by monitoring command-line arguments that involve the "view" flag. Attackers often use this command as part of their reconnaissance phase to gather information about available shared resources on a network, aiding them in fields like lateral movement or privilege escalation. By reviewing shared resources, attackers can identify potential targets for exploitation or data exfiltration.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Discovery** (TA0007)
    - **Network Share Discovery** (T1018)

  The primary data sources for detecting this behavior include process creation events on Windows systems. By analyzing logs that capture process executions, especially those involving `net.exe` or `net1.exe`, security analysts can detect instances of unauthorized enumeration attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of `net.exe` or `net1.exe` being executed, focusing on the command-line arguments to confirm the use of the "view" flag.

  - **Analyze Command-Line Arguments**: Look specifically for command lines that include the "view" flag alongside network paths (e.g., `\\servername\share`) to identify potential unauthorized enumeration.

  - **Check User Context**: Validate the user context under which the command was executed. Ensure that users performing share enumeration activities have legitimate reasons and permissions.

  - **Correlate with Other Logs**: Cross-reference findings with network logs or authentication logs to assess whether there are any related activities that indicate suspicious user behavior or lateral movement.

  ### Prioritization
  This alert should be considered low severity since it may often result from legitimate administrative tasks. However, it can still indicate potential reconnaissance activity by a threat actor, warranting further investigation to ensure no malicious intent.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logging is not enabled for all relevant process creation events or if users have legitimate reasons to consistently use `net.exe`. The detection logic assumes that all use of `net.exe` with the "view" flag is malicious unless proven otherwise. Proper configurations must be in place to capture all `process_creation` logs for this detection to function effectively.

