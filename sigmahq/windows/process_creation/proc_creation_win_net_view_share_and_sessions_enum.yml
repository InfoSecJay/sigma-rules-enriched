title: Share And Session Enumeration Using Net.EXE
id: 62510e69-616b-4078-b371-847da438cc03
status: stable
description: Detects attempts to enumerate file shares, printer shares and 
  sessions using "net.exe" with the "view" flag.
references:
- https://eqllib.readthedocs.io/en/latest/analytics/b8a94d2f-dc75-4630-9d73-1edc6bd26fff.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1018/T1018.md
author: Endgame, JHasenbusch (ported for oscd.community)
date: 2018-10-30
modified: 2023-02-21
tags:
- attack.discovery
- attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains: 'view'
  filter:
    CommandLine|contains: '\\\\'
  condition: all of selection_* and not filter
falsepositives:
- Legitimate use of net.exe utility by legitimate user
level: low
note: |
  ### Technical Context

  This rule detects the enumeration of file shares, printer shares, and active sessions using the Windows command-line utility `net.exe` with the "view" flag. The likely attacker objective is to gather information about shares available on the network, which could lead to further exploitation through lateral movement. This behavior maps to the MITRE ATT&CK technique "Network Share Discovery" (T1018).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688. If the activity is malicious, it could indicate preparatory steps for unauthorized access or lateral movement within the network, thereby increasing the risk of data exposure or system compromise. This detection does NOT confirm that an incident occurred on its own; it simply indicates potential reconnaissance behavior that may require further investigation.

  ### Investigation Steps

  - **Review event details for process creation:** Examine Windows Security Event ID 4688 for suspicious process creation of `net.exe` or `net1.exe` and check the command line for "view". Look for instances on hosts outside of the IT department or management where such actions are uncommon.

  - **Check for shared resources:** Confirm legitimate share configurations by checking the network shares on the system using `net share` command outputs; look for expected shares. Anomalies could include unusual shares or excessive permissions.

  - **Correlate user activity:** Identify the user account associated with the `net.exe` command execution. If the user is a service account, verify the legitimacy of their access compared to expected behavior. For example, a helpdesk user executing this command is suspicious.

  - **Identify frequent or automated use:** Investigate if `net.exe` commands are returned frequently within a short time frame, suggesting automation or scripted behavior. Such patterns may indicate a scripted reconnaissance activity.

  - **Assess network segmentation and asset importance:** Determine the asset’s criticality that is being queried for share information; processes running on servers or sensitive internal systems warrant a higher priority response compared to non-critical environments.

  ### Prioritization

  This alert is classified as low severity in the enterprise context, as it indicates a potential scanning behavior rather than direct malicious activity. However, reconnaissance actions are often the precursors to more impactful attacks, and repeated occurrences should raise concerns about possible exploitation intentions.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate uses of `net.exe` for maintenance tasks by administrators or automated scripts, which could also trigger the alert. Ensuring logging is enabled for all relevant process creation events is essential for reliable detection. Activities such as the use of PowerShell or other enumeration commands for similar purposes may also bypass detection; companion detections for tools like `PowerShell` scripts (e.g., T1047) can provide a more holistic view of potential reconnaissance activities.

