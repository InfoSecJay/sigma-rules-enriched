title: WebDav Client Execution Via Rundll32.EXE
id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
status: test
description: |
  Detects "svchost.exe" spawning "rundll32.exe" with command arguments like "C:\windows\system32\davclnt.dll,DavSetCookie".
  This could be an indicator of exfiltration or use of WebDav to launch code (hosted on a WebDav server).
references:
- https://github.com/OTRF/detection-hackathon-apt29/issues/17
- https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/7.B.4_C10730EA-6345-4934-AA0F-B0EFCA0C4BA6.md
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-05-02
modified: 2023-09-18
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\svchost.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains: 'C:\windows\system32\davclnt.dll,DavSetCookie'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potentially malicious use of the `rundll32.exe` utility when spawned from `svchost.exe` with a command line that includes the `davclnt.dll` library. This behavior may signal an attacker’s attempt to exfiltrate data or execute code from a WebDav server, as this method of execution can be used to bypass security detections by leveraging legitimate system binaries. Attackers often utilize such techniques to carry out further malicious activities, like establishing persistent access or exfiltrating sensitive data from compromised systems.

  The relevant MITRE ATT&CK techniques identified for this detection include:
  - **T1048.003: Exfiltration Over Web Service** – Implies the use of WebDav for data exfiltration.

  Primary data sources for this detection include process creation events that track the execution of `rundll32.exe` and `svchost.exe`, as these logs will provide information on arguments passed during execution and the parent-child relationships between processes.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine logs for instances of `svchost.exe` launching `rundll32.exe`. Pay special attention to the `CommandLine` field and any uncommon parameters used.
  - **Analyze Network Traffic**: Check for outbound connections to known or suspicious WebDav URLs during the time period of the detected event. Look for file transfers or unusual traffic patterns that may indicate data exfiltration.
  - **Inspect System Event Logs**: Evaluate Windows Event logs for security events during the same timeframe, looking for failed login attempts or changes to sensitive directories that may indicate prior compromise.
  - **Assess User Activity**: Review user activity logs for the affected account to identify any anomalies, such as unexpected access to sensitive files or unusual application usage nearby the time of the detection.

  ### Prioritization
  This alert is of medium severity due to the potential risk of data exfiltration and unauthorized execution of code, which could lead to significant data breaches or system compromises if left unchecked.

  ### Blind Spots and Assumptions
  Detection may miss instances where the parameters being executed do not explicitly include `davclnt.dll` or similar indicators of compromise; this could limit coverage against more sophisticated or customized exploits. The rule assumes that logging for process creation events is enabled and correctly configured within the environment to capture necessary details. Additionally, be aware that legitimate applications using WebDav could potentially trigger false positives, necessitating careful analysis by investigators.

