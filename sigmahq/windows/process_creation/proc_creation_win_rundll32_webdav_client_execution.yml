title: WebDav Client Execution Via Rundll32.EXE
id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
status: test
description: |
  Detects "svchost.exe" spawning "rundll32.exe" with command arguments like "C:\windows\system32\davclnt.dll,DavSetCookie".
  This could be an indicator of exfiltration or use of WebDav to launch code (hosted on a WebDav server).
references:
- https://github.com/OTRF/detection-hackathon-apt29/issues/17
- https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/7.B.4_C10730EA-6345-4934-AA0F-B0EFCA0C4BA6.md
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-05-02
modified: 2023-09-18
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\svchost.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains: 'C:\windows\system32\davclnt.dll,DavSetCookie'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where `svchost.exe` spawns `rundll32.exe` with a command line that references `C:\windows\system32\davclnt.dll,DavSetCookie`. This behavior is indicative of a potential exfiltration attempt or the use of WebDAV for executing malicious payloads. The attacker seeks to leverage trusted system processes to execute code surreptitiously, which can facilitate data exfiltration or lateral movement within the network.

  Relevant MITRE ATT&CK techniques include **Exfiltration Over Web Services (T1048.003)**. The primary telemetry sources include Windows process creation logs, specifically looking for Event ID 4688 and Sysmon Event ID 1. If confirmed as malicious, this behavior can lead to significant data loss and a compromise of sensitive information. Importantly, this detection does NOT confirm malicious intent by itself; legitimate applications may also invoke similar behaviors.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Windows Event ID 4688 and Sysmon Event ID 1 for instances where `rundll32.exe` is spawned by `svchost.exe`. Identify the `CommandLine` parameter for the aforementioned `davclnt.dll` reference.

  - **Examine Related Network Activity:** Analyze firewall or proxy logs (e.g., Web Proxy logs) for outbound traffic targeting known WebDAV servers or unusual HTTP methods (PUT/DELETE) related to the timestamp of the alert. A confirmed PUT request to a suspicious domain could indicate malicious exfiltration.

  - **Review Legitimate Use Cases:** Validate if any legitimate processes on the affected host use WebDAV for normal operations, especially if the host runs applications that interact with SharePoint or other collaborative platforms to ensure context is accurately assessed.

  - **Identify Malicious Indicators:** Cross-reference the alert with any known indicators of compromise (IOCs) in threat intelligence feeds or vendor solutions to determine if the execution context aligns with known threat actor behavior.

  - **Evaluate Impacted Asset Role:** Determine the role of the host system. Critical servers (e.g., domain controllers, database servers) should be prioritized for immediate investigation due to the higher security impact of a compromise compared to less critical endpoints.

  ---

  ### Prioritization

  The severity of this alert is medium. Given that the behavior involves a potentially covert method of executing code, it poses a notable risk, especially in enterprise environments with sensitive data. However, the likelihood of legitimate use is also plausible, necessitating further investigation to confirm malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via process obfuscation techniques, where attackers might manipulate legitimate applications to conceal their actions. Ensure that Sysmon is consistently configured to log process creations and command lines. Legitimate administrative tasks or scripts utilizing WebDAV may trigger this alert. Companion detections, like monitoring for unusual network traffic targeting WebDAV services, can provide additional context and strengthen overall detection capabilities.

