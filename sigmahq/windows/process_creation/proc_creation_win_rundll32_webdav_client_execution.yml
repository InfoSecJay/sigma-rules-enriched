title: WebDav Client Execution Via Rundll32.EXE
id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
status: test
description: |
  Detects "svchost.exe" spawning "rundll32.exe" with command arguments like "C:\windows\system32\davclnt.dll,DavSetCookie".
  This could be an indicator of exfiltration or use of WebDav to launch code (hosted on a WebDav server).
references:
- https://github.com/OTRF/detection-hackathon-apt29/issues/17
- https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/7.B.4_C10730EA-6345-4934-AA0F-B0EFCA0C4BA6.md
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-05-02
modified: 2023-09-18
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\svchost.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains: 'C:\windows\system32\davclnt.dll,DavSetCookie'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of `rundll32.exe` spawned by `svchost.exe` with command arguments involving `davclnt.dll` and `DavSetCookie`. Such behavior suggests potential interaction with a WebDav service, possibly for the purpose of exfiltrating sensitive information or executing remote code. The likely attacker objective is to leverage the WebDav protocol for covert operations and persistence.

  This activity corresponds to the MITRE ATT&CK tactic for Exfiltration (T1048.003). Primary telemetry sources include Windows process creation logs, specifically monitoring Event ID 4688 for process lifecycle events. If malicious, this behavior could lead to unauthorized data access and compromise of sensitive information. Importantly, this detection alone does not confirm that exfiltration has occurred; further analysis of the context and broader activities is necessary.

  ---

  ### Investigation Steps

  - **Review process creation logs: **Look for Event ID 4688 with `ParentImage` equal to `C:\Windows\System32\svchost.exe`, highlighting process relationships.

  - **Examine command line arguments:** Verify if the `CommandLine` contains `C:\windows\system32\davclnt.dll,DavSetCookie`. Legitimate applications should not commonly use this specific invocation pattern.

  - **Identify host activity:** Assess the role of the affected system. If it hosts sensitive data or critical infrastructure, the severity of the investigation increases significantly.

  - **Check for further evidence of compromise:** Investigate for other suspicious active connections or logs around the time of the alert. Look at network flow logs (e.g., NetFlow or Windows Firewall logs) for unusual outbound connections.

  - **Cross-reference similar detections:** Look for other detections involving `rundll32.exe` or `davclnt.dll` in the environment. This may indicate a larger compromise.

  - **Validate legitimate use cases:** Determine if `davclnt.dll` is normally accessed by users or applications on the network. If regular employee use is observed, this may reduce the incident severity.

  ---

  ### Prioritization

  This alert holds medium severity. If triggered on a high-value asset or critical server, the likelihood of malicious intent increases significantly. Although the specific behavior is not commonly weaponized, its normalcy in benign operations makes careful triage necessary.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques such as process renaming or obfuscation of command-line arguments. Reliable detection requires complete visibility of process creation logs and accurate configurations of Event ID 4688. Legitimate activities, such as automated backup processes utilizing WebDav, might trigger these alerts. A companion detection rule for unauthorized `rundll32.exe` invocations can enhance coverage against similar threats.

