title: Gpscript Execution
id: 1e59c230-6670-45bf-83b0-98903780607e
status: test
description: Detects the execution of the LOLBIN gpscript, which executes logon 
  or startup scripts configured in Group Policy
references:
- https://oddvar.moe/2018/04/27/gpscript-exe-another-lolbin-to-the-list/
- https://lolbas-project.github.io/lolbas/Binaries/Gpscript/
author: frack113
date: 2022-05-16
modified: 2023-06-14
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\gpscript.exe'
  - OriginalFileName: 'GPSCRIPT.EXE'
  selection_cli:
    CommandLine|contains:
    - ' /logon'
    - ' /startup'
  filter_main_svchost:
    ParentCommandLine: 'C:\windows\system32\svchost.exe -k netsvcs -p -s gpsvc'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate uses of logon scripts distributed via group policy
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the legitimate binary `gpscript.exe`, a Windows utility that processes Group Policy scripts for logon and startup purposes. Attackers may exploit this process to execute malicious scripts under the guise of legitimate logon activities, intending to gain persistence or execute payloads within a user context. This behavior is categorized within the MITRE ATT&CK framework under the tactic "Execution" (TA0002) and the technique "Command and Scripting Interpreter" (T1218).

  The primary telemetry source for this detection is Windows process creation logs, specifically utilizing Security Event ID 4688 or Sysmon Event ID 1. If executed maliciously, this activity could lead to unauthorized system access or malware execution during system startup and user logins. It is important to note that this detection alone does not confirm malicious activity, as legitimate uses of `gpscript.exe` for Group Policy can trigger false positives.

  ### Investigation Steps

  - **Review process execution history**: Check Security Event ID 4688 or Sysmon Event ID 1 for instances of `gpscript.exe` being executed. Look for the associated `ParentProcessId` and `ParentCommandLine` to verify the execution context.

  - **Validate command-line parameters**: Inspect the command-line parameters under the 'CommandLine' field for Event ID 4688. Legitimate instances typically use `/logon` or `/startup`. Check if the execution aligns with the expected parameters or contains additional suspicious arguments.

  - **Analyze parent process context**: Confirm that `gpscript.exe` was spawned by the legitimate service `svchost.exe` with the corresponding arguments (e.g., `C:\windows\system32\svchost.exe -k netsvcs -p -s gpsvc`). Execution that does not align with this context may suggest the use of a hijacked or alternative parent process.

  - **Identify known malicious indicators**: Investigate any instances of `gpscript.exe` referred from unusual paths or with modified timestamps. Pay special attention to associated file hashes against known malware signatures for heightened confidence of malicious intent.

  - **Identify asset criticality**: If the host is a critical system, escalate the investigation. Look for corresponding user activity and network communications originating from the device during the time of the script execution to rule out exfiltration or lateral movement scenarios.

  - **Correlate with Group Policy changes**: Review Group Policy change logs (Event ID 4702) to assess if recent updates introduced new scripts. Unexpected alterations in GPOs may indicate a malicious motive behind the execution of `gpscript.exe`.

  ### Prioritization

  This alert is of medium severity due to the potential for exploitation of `gpscript.exe` in an enterprise environment. It may facilitate unauthorized executions during user logons, greatly impacting system integrity. While the likelihood of abuse exists, the behavior can also be part of legitimate administrative practices, necessitating further analysis.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate usage in environments that actively utilize Group Policy Logon scripts, potentially masking malicious activity. Ensure Sysmon is deployed for enhanced visibility into process creation. Review Group Policy auditing practices as they may either restrict or allow usage that aligns with this detection. A related detection for command-line execution activities (such as those capturing the use of PowerShell or WMI calls) would further strengthen coverage against evasion techniques.

