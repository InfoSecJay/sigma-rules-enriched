title: Gpscript Execution
id: 1e59c230-6670-45bf-83b0-98903780607e
status: test
description: Detects the execution of the LOLBIN gpscript, which executes logon or
  startup scripts configured in Group Policy
references:
- https://oddvar.moe/2018/04/27/gpscript-exe-another-lolbin-to-the-list/
- https://lolbas-project.github.io/lolbas/Binaries/Gpscript/
author: frack113
date: 2022-05-16
modified: 2023-06-14
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\gpscript.exe'
  - OriginalFileName: 'GPSCRIPT.EXE'
  selection_cli:
    CommandLine|contains:
    - ' /logon'
    - ' /startup'
  filter_main_svchost:
    ParentCommandLine: 'C:\windows\system32\svchost.exe -k netsvcs -p -s gpsvc'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate uses of logon scripts distributed via group policy
level: medium
note: |
  ### Technical Context
  This rule detects the execution of `gpscript.exe`, a legitimate Windows binary that runs logon or startup scripts defined in Group Policy. However, it has been flagged as a Living Off the Land Binary (LOLBIN) commonly abused by attackers to execute arbitrary scripts without triggering traditional security alarms. The detection of this execution is crucial as it indicates potential misuse, possibly for malicious activities like unauthorized remote access, privilege escalation, or malware deployment.

  The likely attacker objectives could involve manipulating the Group Policy to introduce or leverage malicious scripts to gain persistence or execute payloads on client systems. Attackers may aim for stealthy operations that blend in with normal administrative activities within the Windows environment. The relevant MITRE ATT&CK techniques associated with this behavior include Defense Evasion (T1218 - Using System Binaries for Execution) and potentially Execution (T1059 - Command and Scripting Interpreter), given that it can invoke script files during its execution.

  Primary data sources for investigating this detection rule include process creation events that detail applications launched on Windows systems and command-line arguments that specify how those applications are invoked. These logs will help analysts identify not only the execution of `gpscript.exe` but also its parameters, providing context on whether it was used legitimately or as part of a malicious action.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine the process creation logs for instances of `gpscript.exe` execution, focusing on both the initiating parent process and command-line arguments to identify suspicious activity.
  - **Analyze Command-Line Parameters**: Inspect the command line used with `gpscript.exe` for the presence of `/logon` or `/startup` switches, as these are indicators of its intended use. Look for any unusual scripts or paths referenced beyond usual organizational scripts.
  - **Check Parent Process**: Investigate the parent process of `gpscript.exe`. If it is not initiated by `svchost.exe -k netsvcs -p -s gpsvc`, this could indicate deceptive behavior. Make note of any atypical parent processes initiating this execution.
  - **Correlate with Active Directory Logs**: Collect and review Group Policy logs that might reveal schedule changes or new scripts deployed via Group Policy Objects (GPOs) that could signal malicious tampering.

  ### Prioritization
  The severity of this alert is medium due to the potential for abuse in enterprise environments, where adversaries may achieve persistence or execute harmful actions under the guise of legitimate administrative functions. Given the nature of `gpscript.exe`, alerts should be prioritized for investigation to prevent possible exploitation of administrative privileges.

  ### Blind Spots and Assumptions
  A significant blind spot in the detection logic is its reliance on recognizing `gpscript.exe` without filtering for known legitimate usages, which may lead to false positives when legitimate scripts are run by authorized personnel. Furthermore, the detection assumes that all executed instances will adhere to patterns established in the rule; any obfuscation or alterations could evade detection. Required logs for accurate alerts must include comprehensive process creation events and detailed command-line arguments, necessitating appropriate logging configurations within the Windows environment to ensure complete visibility.

