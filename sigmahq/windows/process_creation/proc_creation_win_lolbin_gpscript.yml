logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\gpscript.exe'
  - OriginalFileName: 'GPSCRIPT.EXE'
  selection_cli:
    CommandLine|contains:
    - ' /logon'
    - ' /startup'
  filter_main_svchost:
    ParentCommandLine: 'C:\windows\system32\svchost.exe -k netsvcs -p -s gpsvc'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate uses of logon scripts distributed via group policy
level: medium
note: |
  ### Technical Context

  The Sigma rule detects the execution of `gpscript.exe`, a legitimate Windows utility often used to run logon or startup scripts defined in Group Policy. Attackers may leverage this tool to execute malicious scripts stealthily as part of their infiltration or persistence strategy, utilizing the normal Windows environment to evade detection. This behavior aligns with the MITRE ATT&CK tactic for Defense Evasion and the specific technique ID T1218 (Signed Binary Proxy Execution).

  The primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688 for process creation events. If malicious, the execution of `gpscript.exe` can lead to unauthorized actions initiated through these scripts. However, this detection does NOT confirm malicious intent by itself, as it can also result from legitimate administrative actions regarding Group Policy.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for `gpscript.exe` execution instances. Note the parent process; legitimate executions typically originate from `svchost.exe` with the command line containing the `/logon` or `/startup` arguments.

  - **Analyze command line arguments:** Investigate if the command line arguments contain suspicious paths or script names. Malicious use may involve non-standard or obfuscated script paths.

  - **Identify the user context:** Verify the user account under which `gpscript.exe` was executed. Legitimate administrator accounts running logon scripts are expected, while executions from local SYSTEM or non-administrative accounts may warrant further scrutiny.

  - **Correlate with Group Policy changes:** Cross-reference with Group Policy Object (GPO) logs to identify if a recent change corresponding to the execution of `gpscript.exe` has been made, which might indicate either a legitimate update or malicious tampering.

  - **Inspect script content:** If possible, extract and examine the script executed by `gpscript.exe`. Look for any signs of malicious payloads or commands that deviate from normal administrative scripts.

  ### Prioritization

  This alert has medium severity due to the potential impact if the execution of `gpscript.exe` is aligned with malicious script execution. Given that this tool is often misused for evasion techniques, the likelihood of abuse is moderate, especially in environments where GPO modifications are frequent or laxly monitored.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate usage of `gpscript.exe` for administrative tasks, potentially leading to false positives. Reliable detection requires comprehensive logging configurations to monitor process commands and relevant group policy changes. Legitimate activities like setting up new logon scripts might trigger the alert as well. A companion detection for file creation or modification in script paths could enhance overall detection capability for potential malicious activity.

