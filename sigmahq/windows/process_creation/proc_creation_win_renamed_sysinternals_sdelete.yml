  ---

  ### Technical Context

  This rule detects the execution of the Sysinternals tool Sdelete with a renamed executable. Renaming critical system tools like Sdelete can indicate an attempt to obscure malicious activity, such as securely deleting traces of other malware or unauthorized changes. The likely attacker objective is to eliminate forensic evidence post-compromise. This behavior aligns with the MITRE ATT&CK tactic of **Impact** and the technique **Data Destruction** (T1485). Primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1, which record process creation events. If this behavior is malicious, it could significantly hinder forensic investigations post-incident. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative activities may also trigger the alert.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for instances where Sdelete (or renamed versions) was executed. Note the parent process to identify the context of execution.

  - **Identify executable path:** Ensure that the command line arguments of the detected process match those typical of usage for this tool. Legitimate use often includes explicit paths and flags; any unusual flags could indicate malicious usage.

  - **Review system modification dates:** Investigate file modification timestamps in directories where Sdelete was executed. Rapid or abnormal file deletions right after execution can indicate potential cover-up actions by an adversary.

  - **Validate user context:** Determine the user account that executed the command. Activity executed by non-administrators in sensitive areas (i.e., `C:\Windows\System32\`) is suspicious, while admin account usage may be expected.

  - **Analyze other related activity:** Correlate your findings with other recent alerts or activities involving data deletion or modification. For example, check for any significant file deletions or changes (Security Event ID 4663) occurring around the same time.

  - **Check for known legitimate paths:** Recognize that legitimate Sdelete usage may occur in scripts or by system administrators, often utilizing known paths like `C:\Program Files\Sysinternals\`. Verify for such patterns.

  ---

  ### Prioritization

  The alert is considered high severity due to the critical nature of the actions associated with Sdelete, particularly in enterprise environments where data integrity and retention are paramount. The likelihood of malicious abuse is significant, as attackers frequently use such tools to sanitize traces of their activity, making it a notable target for detection.

  ---

  ### Blind Spots and Assumptions

  This detection strategy may have limitations as attackers can rename files or use alternative tools to bypass detection. Ensuring Sysmon is deployed and configured correctly is crucial for full visibility. Legitimate administrative actions, including maintenance scripts, may trigger alerts and should be carefully evaluated. One related detection enhancing coverage is monitoring for unusual command lines associated with data erasure activities (e.g., using PowerShell scripts to delete files system-wide).

