title: Renamed Sysinternals Sdelete Execution
id: c1d867fe-8d95-4487-aab4-e53f2d339f90
status: test
description: Detects the use of a renamed SysInternals Sdelete, which is something
  an administrator shouldn't do (the renaming)
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/sdelete
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1485/T1485.md
author: Florian Roth (Nextron Systems)
date: 2022-09-06
modified: 2023-02-03
tags:
- attack.impact
- attack.t1485
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName: 'sdelete.exe'
  filter:
    Image|endswith:
    - '\sdelete.exe'
    - '\sdelete64.exe'
  condition: selection and not filter
falsepositives:
- System administrator usage
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of a renamed version of Sysinternals Sdelete, which is a tool commonly used for securely deleting files. The concern around the use of a renamed Sdelete stems from the potential for an attacker to misuse this legitimate utility to delete evidence of malicious activity, thereby covering their tracks after an intrusion. Attackers may rename this tool to avoid detection while executing it during their operational phase.

  The relevant MITRE ATT&CK tactics include "Impact" (T1499 - Endpoint Denial of Service) and the technique T1485, which specifically addresses "Data Destruction." The capability to delete files, especially when using a tool that is not commonly detected under its original name, poses a risk as it can hinder forensic analysis and investigative efforts following a security incident.

  Primary data sources for this detection include Windows process creation events, which can show when and how executables—including renamed tools—are launched. This information is crucial for detecting the anomalous usage of administration tools that could indicate a security compromise.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for any instances of process creation events related to Sdelete, particularly those with modified or unusual file names. Attention should be given to the execution context, including the parent process.

  - **Correlate with User Activity:** Investigate the user or system account that executed the renamed Sdelete. Cross-reference this with recent user activities and any anomalous behavior that could suggest an unauthorized access attempt.

  - **Examine File Deletion Patterns:** Investigate the file system for any recent deletions, particularly focusing on sensitive or critical data that coincides with the execution of the renamed Sdelete. Review the timestamps to identify the sequence of events.

  - **Assess System Administration Practices:** Validate whether the usage of Sdelete aligns with established administrative protocols. Determine if the tool was renamed for legitimate administrative purposes or if it strays from expected norms.

  ### Prioritization
  This alert is classified as high severity due to the potential implications of data destruction by unauthorized users. The likelihood of misuse increases in environments where privileged accounts are compromised, significantly impacting data integrity and forensic investigation capabilities.

  ### Blind Spots and Assumptions
  This detection rule may not capture cases where Sdelete is executed without renaming or where the tool is used legitimately by authorized system administrators. The detection assumes that misnamed tool usage is an indicator of malicious intent but does not account for potential legitimate administrative tasks. Proper logging configurations for process creation events are essential to enable this detection, and any misconfiguration in logging settings could lead to gaps in coverage.

