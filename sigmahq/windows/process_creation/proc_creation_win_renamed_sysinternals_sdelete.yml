  ---

  ### Technical Context

  This Sigma rule detects the execution of a renamed version of the Sysinternals tool SDelete, specifically monitoring instances where the original filename is preserved while the executable has been renamed. The likely attacker objective in using a renamed SDelete could be to obscure the activity of securely deleting files or wiping data to hinder forensic investigations. Relevant MITRE ATT&CK tactics and techniques for this behavior include "Impact" (T1485 - Data Destruction).

  Primary telemetry sources for this detection are process creation logs, particularly Windows Event ID 4688, and Sysmon Event ID 1. If malicious, executing a renamed SDelete could indicate an attempt to remove evidence of compromise or sensitive data. Importantly, detecting the renaming of SDelete does NOT confirm malicious intent on its own, as legitimate administrative actions may also involve this tool.

  ---

  ### Investigation Steps

  - **Review process creation events**: Investigate Windows Security Event ID 4688 for any occurrences of 'sdelete.exe' or 'sdelete64.exe'. Look for user accounts that initiated these processes, as administrative accounts may indicate benign activity whereas non-admin accounts are suspect.

  - **Check file integrity and origin**: Validate the file hash of the detected executable against known hashes from Sysinternals. Legitimate SDelete binaries should match the hash values found in the [official repository](https://learn.microsoft.com/en-us/sysinternals/downloads/sdelete).

  - **Analyze command-line arguments**: Examine the command-line arguments used during execution in Event ID 4688. Check for evidence of atypical or suspicious parameters that may reveal intentional data deletion, such as omission of prompts or the inclusion of sensitive directory paths.

  - **Assess timestamps and frequency**: Look for unusual frequency of SDelete executions. Legitimate uses typically coincide with scheduled tasks or maintenance windows. Multiple rapid executions in a short time frame may indicate an automated, malicious activity.

  - **Correlate with system logs**: Cross-reference your findings with application and system logs to identify any preceding logs indicating abnormal behavior or unauthorized access, especially from non-standard accounts that may suggest privilege escalation tactics.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact of data destruction on critical systems and the heightened likelihood of malicious use in post-compromise scenarios. The use of renamed SDelete is uncommon and potentially indicative of an adversary attempting to evade detection while executing destructive commands.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging or misconfigurations in the environment; Sysmon may be necessary for complete visibility. Evasion techniques could include altering file extensions or leveraging alternative data destruction utilities. Furthermore, legitimate administrative actions, such as system maintenance or data cleanup processes, could trigger this alert. A companion detection related to File System Activity Monitoring could further enhance threat visibility when combined with this alert.

