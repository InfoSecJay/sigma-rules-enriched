logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName: 'sdelete.exe'
  filter:
    Image|endswith:
    - '\sdelete.exe'
    - '\sdelete64.exe'
    - '\sdelete64a.exe'
  condition: selection and not filter
falsepositives:
- System administrator usage
level: high
note: |
  ### Technical Context

  This rule detects the execution of Sysinternals Sdelete with a renamed file name, which is atypical behavior for system administrators. The likely objective of an attacker using this tool is to securely delete files or wipe free disk space to eliminate traces of their activities. This behavior correlates with the MITRE ATT&CK technique T1485 (Data Destruction), which aims to compromise data integrity.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide details on process executions. If executed maliciously, this could lead to critical data loss and compromise of forensic evidence. Importantly, detecting this behavior does NOT confirm malicious intent, as legitimate administrators may also perform this action under specific scenarios.

  ### Investigation Steps

  - **Check process logs for Sdelete execution:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of 'sdelete.exe' or its variations. Search for the 'New_Process_Name' field for suspicious paths that deviate from usual administrative tools.

  - **Correlate user activity:** Investigate the account associated with the execution by checking 'SubjectUserName' in the Event logs. Confirm if this account has a history of administrative tasks related to data management (e.g., deleting files) to assess legitimacy.

  - **Identify file deletion patterns:** Examine the system for changes in file integrity or file deletion activity (e.g., Event ID 4663). Look for unusual patterns, such as large numbers of files being deleted in a short time frame, which may indicate misuse of the tool.

  - **Confirm expected usage:** Check for legitimate administrative activity using Sdelete by correlating with scheduled maintenance windows or change management records. Look for documentation indicating the need for secure deletion in the context of recent system updates.

  - **Analyze system logs for data access prior to execution:** Review Windows Event IDs 4663 and 4660 for file access logs that indicate what files were targeted for deletion, which may help understand the intent behind the execution.

  - **Identify high-confidence malicious indicators:** Look for a combination of renaming a legitimate tool and executing it after hours or from a non-standard administrative account. For instance, the execution on a system not known to have a maintenance task scheduled could indicate suspicious behavior.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on sensitive data integrity and the critical role of the affected systems. The likelihood of malicious abuse is significant since the use of tools like Sdelete can be weaponized by adversaries to erase evidence of their presence. Thus, quick investigation is warranted.

  ### Blind Spots and Assumptions

  This detection might miss cases where attackers use obfuscation techniques, such as modifying the file signature or using other tools for similar actions. Reliable detection requires proper logging configurations, especially for process creation. Legitimate activities may occur where system administrators use Sdelete for compliance reasons, particularly during system cleanups. A companion detection to consider is monitoring for unusual file modification patterns linked to heightened privilege account usage, providing broader context for investigation.

