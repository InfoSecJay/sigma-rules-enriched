note: |
  ### Technical Context

  This detection identifies the invocation of the PowerShell cmdlet `Set-Service` with a specific Security Descriptor (SDDL) that enables a service to be hidden from standard service management tools such as `sc.exe` and `Get-Service`. The likely attacker objective is to establish persistent access on a compromised system while concealing malicious services from detection by defenders. This activity squares with the MITRE ATT&CK tactic of **Persistence** and the technique **T1574.011: Service Registry Abuse**.

  The primary telemetry source is PowerShell process creation logs, specifically `Event ID 4688` or `Sysmon Event ID 1`, as well as command line arguments that capture the attempt to manipulate service visibility. If malicious, this behavior significantly diminishes the visibility of potentially harmful services, enabling attackers to maintain a foothold without detection. However, this rule does NOT confirm malicious intent on its own, as legitimate use cases for service modifications can occur.

  ### Investigation Steps

  - **Confirm PowerShell Version:** Check the version of PowerShell being used by reviewing process creation logs (`Event ID 4688`), specifically for `pwsh.exe`. Legitimate environments may use PowerShell 7.x, while older versions and command-line anomalies may signify potential exploitation.

  - **Analyze Command Line Arguments:** Review command line input of the PowerShell process (`CommandLine` field) for the presence of `Set-Service`, `-SecurityDescriptorSddl`, and `-sd`. Verify that the SDDL structure contains `DCLCWPDTSD`, indicating attempts to modify service visibility. Legitimate use for hidden services is rare; malformed commands suggest malicious intent.

  - **Cross-reference Service Status:** Use `Get-Service` to track the status of services on the host post-event. Examine if any services were modified to be hidden directly after the detection event, specifically checking for services that are set to `Status: Stopped` but are not listed.

  - **Evaluate Suspicious Service Entries:** Investigate services that are no longer visible outside of the specific PowerShell execution context. Document any entries that appear abnormal, such as services that do not match expected naming conventions for legitimate software or services.

  - **Identify Malicious Indicators:** Look for unusual service installation patterns, especially those occurring under high-privilege accounts or during off-hours. Utilize Security Event Logs (`Event ID 7045` for service creation).

  - **Check Related Alerts:** Review other alerts or anomalies around the same timeframe, focusing on privilege escalation or unusual logins. Related activities may confirm a coordinated attack and indicate a broader exploitation strategy.

  ### Prioritization

  The severity of this alert is high due to its direct implications on system integrity and the likelihood that services are being obscured to facilitate continued access by an adversary. Such behavior is commonly seen in advanced persistent threats (APTs) seeking long-term footholds in enterprise environments.

  ### Blind Spots and Assumptions

  This detection may suffer from evasion techniques such as legitimate administrative uses for hidden services, potentially leading to false positives. Additionally, a properly configured environment must ensure comprehensive logging of `pwsh.exe` commands to capture such activities reliably. Legitimate administrative tasks, like the scheduled maintenance of non-critical services, may inadvertently trigger alerts. A related detection worth monitoring includes configurations for unusual service installation or modifications detected via `Event ID 7045`.

