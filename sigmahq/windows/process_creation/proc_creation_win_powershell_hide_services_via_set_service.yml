logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\pwsh.exe'
  - OriginalFileName: 'pwsh.dll'
  selection_sddl:
        # Example would be: "D:(D;;DCLCWPDTSD;;;IU)(D;;DCLCWPDTSD;;;SU)(D;;DCLCWPDTSD;;;BA)(A;;CCLCSWLOCRRC;;;IU)(A;;CCLCSWLOCRRC;;;SU)(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)S:(AU;FA;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;WD)"
    CommandLine|contains|all:
    - 'Set-Service '
    - 'DCLCWPDTSD'
  selection_cmdlet:
    CommandLine|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  condition: all of selection_*
falsepositives:
- Rare intended use of hidden services
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `Set-Service` PowerShell cmdlet with a specified security descriptor to hide services from standard utilities like `sc.exe` or `Get-Service`. The likely attacker objective is to obfuscate malicious services from detection, thereby maintaining persistence within the environment. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1568.011). The primary telemetry sources include event logs related to process creation (e.g., Security Event ID 4688 or Sysmon Event ID 1) capturing the execution of PowerShell with specific command-line arguments.

  If this detection is confirmed malicious, the potential security impact is significant, as it indicates an attempt to conceal malicious activity, enhance persistence, or bypass security measures. However, it is crucial to note that this detection does NOT confirm malicious intent by itself, as there may be rare legitimate use cases for hiding services.

  ### Investigation Steps

  - **Review Process Creation Events:**
    Locate Security Event ID 4688 or Sysmon Event ID 1 to determine context and origin of `pwsh.exe` execution, focusing on the `CommandLine` field for evidence of the `Set-Service` usage.

  - **Identify Parameters Used:**
    Check for specific command-line parameters in Event Log data. Look for 'Set-Service ' and the presence of 'DCLCWPDTSD', which indicates the installation of specific permissions that may denote malicious intent.

  - **Check for Known Legitimate Services:**
    Compare the services list against standard service operations within the organization to determine if any common services have been hidden erroneously or maliciously.

  - **Correlate with Other Security Controls:**
    Investigate endpoint protection logs (e.g., EDR solutions) for suspicious activity around processes, files, or registry changes that relate to the same user session or timeframe.

  - **Search for Lateral Movement:**
    Look for additional indicators of lateral movement or privilege escalation in related logs, such as failed login attempts or administrative tasks executed around the same time to provide context to the service manipulation.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on system integrity and security. The ability to hide services is a well-known technique for evading security controls, and thus these techniques are commonly weaponized by advanced adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative actions to trigger this alert, which might lead to false positives. The rule depends on the accurate logging of PowerShell commands and the presence of necessary event sources, such as Sysmon, to capture these actions reliably. A related detection involves monitoring for abnormal service creation or modification events, which can provide additional context and coverage against potential threats.

