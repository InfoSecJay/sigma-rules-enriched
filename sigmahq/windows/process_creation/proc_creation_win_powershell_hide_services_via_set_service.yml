note: |
  ---

  ### Technical Context

  This detection seeks to identify the use of the `Set-Service` PowerShell cmdlet, specifically aimed at modifying service security descriptors to hide services from management tools like `sc.exe` and `Get-Service`. The likely objective of an attacker using this technique is to maintain persistence and evade detection by obscuring malicious services from standard monitoring practices. This behavior aligns with the MITRE ATT&CK technique T1574.011 - "Hide Services".

  The primary telemetry sources include Windows Process Creation logs (Event ID 4688) and potentially Sysmon Event ID 1 logs. The security impact of a successful attack could be severe, allowing an adversary to embed their presence in a way that is difficult to detect, potentially leading to prolonged unauthorized access. Importantly, this detection does not confirm full compromise or malicious intent on its own—legitimate administrators may also use this cmdlet under certain circumstances.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Event ID 4688 logs for the execution of `pwsh.exe`. Focus on the CommandLine field for strings containing `Set-Service` and `DCLCWPDTSD` to find high-confidence indicators of malicious activity.

  - **Examine the command line arguments:** Analyze the CommandLine field in Event ID 4688 for the `Set-Service` usage, particularly looking for `-SecurityDescriptorSddl` or `-sd`. Malicious instances will likely display complex SDDL strings, indicating attempts to obscure service visibility.

  - **Identify legitimate usage patterns:** Review the system for expected administrative usage of `Set-Service`. Legitimate administrators may use it infrequently and for valid service management tasks, contrasting with suspicious and frequent, complex arguments typical of adversarial behavior.

  - **Correlate with service configuration data:** Check services using `Get-Service` or equivalent management utilities to compare the visibility of services against the expected output. Look for discrepancies where services should be visible but are not.

  - **Assess event logs for related activities:** Look for Event ID 4698 logs which may indicate the creation of new scheduled tasks that could relate to the usage of hidden services, potentially indicating broader persistence strategies.

  - **Verify integrity of affected systems:** Conduct a deeper examination of affected hosts for possible file system or network indicators that may signal exfiltration or misuse of hidden services, including monitoring for any unexpected outbound connections.

  ---

  ### Prioritization

  This alert should be treated as high priority due to its implication of potential persistence mechanisms employed by adversaries. The capability to hide services is frequently weaponized by advanced threat actors to avoid detection. Systems with critical roles in the organization or exposed to sensitive data must be prioritized for investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of PowerShell commands by administrators who occasionally need to hide services for valid reasons. Ensure that the logging configuration includes both process creation and PowerShell usage, as incomplete logging may reduce the effectiveness of the detection. Related detections that might enhance visibility include monitoring for suspicious PowerShell execution patterns or unusual service activity, such as T1053 for scheduled tasks, as they can relate back to the same threat actor’s attempts to persist on the network.

