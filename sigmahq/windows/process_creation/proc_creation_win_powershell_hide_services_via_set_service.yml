note: |
  ### Technical Context
  This detection rule identifies the misuse of the `Set-Service` PowerShell cmdlet to alter the Security Descriptor of a Windows service, effectively allowing it to be hidden from standard service utilities like `sc.exe` and `Get-Service`. Such behavior is typically associated with an attacker’s objective to conceal malicious services on a compromised host, thereby evading detection from both automated monitoring solutions and human administrators. This technique is indicative of persistence and defense evasion strategies employed by threat actors.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003) - Establishing a foothold that outlives system reboots.
  - **Defense Evasion** (TA0005) - Manipulating tools to evade detection, specifically through the use of command-line tools to obfuscate noxious behavior.
  - **Privilege Escalation** (TA0004) - Misusing elevated permissions granted through service management to enhance control over a compromised environment.
  - **T1574.011 - Service Registry Permissions Weakness** - Exploiting service registry permissions to manipulate how the service appears or operates.

  Primary data sources for this detection include process creation events that capture PowerShell command execution, as well as system logs detailing service configuration changes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `pwsh.exe` executing with the `Set-Service` cmdlet. Look for command lines that include the `-SecurityDescriptorSddl` parameter as this indicates the modification of the service's security permissions.

  - **Analyze Service Configuration**: Use tools (e.g., PowerShell or the GUI) to investigate the properties of services on the affected host. Pay careful attention to any services that do not appear in default queries or have atypical security descriptors.

  - **Inspect Related Event Logs**: Check Windows Event Logs, particularly the Security Event Log for Event IDs that may correlate with service modifications or access attempts around the time of detection.

  - **Correlate with User Activity**: Determine the user context under which the PowerShell command was executed. Analyze user permissions and recent activity for any anomalies that may indicate compromise.

  ### Prioritization
  Given the severity of hiding malicious services from system administrators and automated detection systems, this alert is categorized as high priority. The potential impact of such an action is substantial as it can lead to prolonged presence of threats in the environment, facilitating further attacks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate uses of hidden services, which can result in false positives. The logic assumes that PowerShell 7 is employed for executing such commands, possibly missing detections from earlier versions or other script execution contexts. Additionally, proper logging configurations must be in place for both PowerShell command execution and service changes to ensure the successful functioning of this alert.

