title: Cmd Launched with Hidden Start Flags to Suspicious Targets
id: 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d
status: experimental
description: |
  Detects cmd.exe executing commands with the "start" utility using "/b" (no window) or "/min" (minimized) flags.
  To reduce false positives from standard background tasks, detection is restricted to scenarios where the target is a known script extension or located in suspicious temporary/public directories.
  This technique was observed in Chaos, DarkSide, and Emotet malware campaigns.
references:
- https://www.fortinet.com/blog/threat-research/evolution-of-chaos-ransomware-faster-smarter-and-more-dangerous
- https://www.fortinet.com/blog/threat-research/newly-discovered-function-in-darkside-ransomware-variant-targets-disk-partitions
- https://www.fortinet.com/blog/threat-research/ms-office-files-involved-in-emotet-trojan-campaign-pt-one
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/start
tags:
- attack.stealth
- attack.t1564.003
author: Vladan Sekulic, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cmd_hidden_start_1:
    CommandLine|contains|windash:
    - 'start '
    - 'start/b'
    - 'start/min'
  selection_cmd_hidden_start_2:
    CommandLine|contains|windash:
    - '/b '
    - '/b"'
    - '/min '
    - '/min"'
  selection_cli_uncommon_location:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Windows\Temp\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\'
    - '\Music\'
    - '\Photos\'
    - '\Temporary Internet\'
    - '\Users\Public\'
    - '\Videos\'
  selection_cli_susp_extension:
    CommandLine|contains:
    - '.bat'
    - '.cmd'
    - '.cpl'
    - '.hta'
    - '.js'
    - '.ps1'
    - '.scr'
    - '.vbe'
    - '.vbs'
  selection_cli_susp_pattern:
    CommandLine|contains:
    - ' -nop '
    - ' -sta '
    - '.downloadfile('         # PowerShell download command
    - '.downloadstring('         # PowerShell download command
    - '-noni '
    - '-w hidden '
  condition: all of selection_cmd_* and 1 of selection_cli_*
falsepositives:
- Legitimate administrative scripts running from temporary folders.
- Niche software updaters utilizing hidden batch files in ProgramData.
level: medium # Can be increased after an initial baseline and tuning
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_cmd_launched_with_hidden_start_flag/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `cmd.exe` commands that utilize the "start" utility with flags indicating no window or minimized execution, specifically targeting scripts executed from suspicious directories or with unusual extensions. The likely attacker objective is to execute commands stealthily, which can facilitate lateral movement, execution of malicious scripts, or payload delivery without drawing attention. This maps to the MITRE ATT&CK technique **Stealthy Execution (T1564.003)**.

  The primary telemetry sources for this detection are process creation logs (Windows Event ID 4688 or Sysmon Event ID 1), focusing on command line arguments. If the behavior is malicious, it may lead to unauthorized system access or data exfiltration. However, this detection does NOT confirm malicious intent on its own; legitimate administrative scripts or software updates may produce similar command line execution patterns.

  ### Investigation Steps

  - **Identify Process Creation Events:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 to find evidence of `cmd.exe` execution. Pay special attention to the command line for "start /b" or "start /min" flags.

  - **Examine Command Line Arguments:** Validate the command line using relevant fields to check for usage of suspicious extensions (.vbs, .ps1, .bat, etc.) in directories like `C:\Temp`, `C:\Users\Public`, or `C:\Windows\Temp`.

  - **Assess Target Directory Context:** Recognize benign behavior where scheduled tasks or administrative scripts may run from `C:\Perflogs\` or `C:\ProgramData`. Contrast this against unexpected execution of scripts from public/temp directories indicative of malicious activity.

  - **Look for Known Indicators:** Search for common patterns such as `-nop`, `-sta`, or the usage of `.downloadfile(` in the command line arguments that indicate PowerShell might be leveraged in conjunction with cmd, which is frequently associated with malicious activity.

  - **Monitor User Behavior and Activity:** Investigate the user context under which the command was executed. Established and known administrative users operating in permission-granted environments may suggest benign behavior whereas unfamiliar accounts executing commands in this manner should be flagged for further scrutiny.

  ### Prioritization

  This alert carries medium severity due to its association with known malware tactics and the potential for significant impacts, especially if executed from critical systems. The combination of hidden command execution in suspicious directories combined with the use of potentially harmful script file types increases the likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging in certain environments, leading to incomplete visibility into user activities. Additionally, legitimate administrative tasks and software updates may unintentionally trigger this alert. It is also essential to monitor PowerShell activities, as complementary detections for PowerShell-based script execution could provide additional insights into the risk context of such alerts.

