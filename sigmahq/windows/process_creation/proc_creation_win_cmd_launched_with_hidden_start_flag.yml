title: Cmd Launched with Hidden Start Flags to Suspicious Targets
id: 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d
status: experimental
description: |
  Detects cmd.exe executing commands with the "start" utility using "/b" (no window) or "/min" (minimized) flags.
  To reduce false positives from standard background tasks, detection is restricted to scenarios where the target is a known script extension or located in suspicious temporary/public directories.
  This technique was observed in Chaos, DarkSide, and Emotet malware campaigns.
references:
- https://www.fortinet.com/blog/threat-research/evolution-of-chaos-ransomware-faster-smarter-and-more-dangerous
- https://www.fortinet.com/blog/threat-research/newly-discovered-function-in-darkside-ransomware-variant-targets-disk-partitions
- https://www.fortinet.com/blog/threat-research/ms-office-files-involved-in-emotet-trojan-campaign-pt-one
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/start
tags:
- attack.defense-evasion
- attack.t1564.003
author: Vladan Sekulic, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cmd_hidden_start_1:
    CommandLine|contains|windash:
    - 'start '
    - 'start/b'
    - 'start/min'
  selection_cmd_hidden_start_2:
    CommandLine|contains|windash:
    - '/b '
    - '/b"'
    - '/min '
    - '/min"'
  selection_cli_uncommon_location:
    CommandLine|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Windows\Temp\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\'
    - '\Music\'
    - '\Photos\'
    - '\Temporary Internet\'
    - '\Users\Public\'
    - '\Videos\'
  selection_cli_susp_extension:
    CommandLine|contains:
    - '.bat'
    - '.cmd'
    - '.cpl'
    - '.hta'
    - '.js'
    - '.ps1'
    - '.scr'
    - '.vbe'
    - '.vbs'
  selection_cli_susp_pattern:
    CommandLine|contains:
    - ' -nop '
    - ' -sta '
    - '.downloadfile('         # PowerShell download command
    - '.downloadstring('         # PowerShell download command
    - '-noni '
    - '-w hidden '
  condition: all of selection_cmd_* and 1 of selection_cli_*
falsepositives:
- Legitimate administrative scripts running from temporary folders.
- Niche software updaters utilizing hidden batch files in ProgramData.
level: medium # Can be increased after an initial baseline and tuning
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_cmd_launched_with_hidden_start_flag/info.yml
note: |
  ### Technical Context

  This rule detects the execution of `cmd.exe` with the "start" utility utilizing "/b" or "/min" flags, indicating attempts to run commands without a visible console window. This behavior aligns with adversaries attempting to conceal malicious activities such as executing scripts or command line tools silently. The likely attacker objective is to evade detection while carrying out actions like downloading additional malware or executing payloads in a stealthy manner. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1564.003 (Hide Command and Control Communication). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If successful, the security impact could lead to data theft, unauthorized access, or further payload execution. However, it is important to note that this detection does NOT confirm that the activity is malicious on its own; legitimate administrative operations could trigger this alert.

  ### Investigation Steps

  - **Review Process Creation Logs**: Look for Windows Security Event ID 4688 or Sysmon Event ID 1 related to `cmd.exe` execution. Check the `CommandLine` field for the presence of "start /b" or "start /min". Legitimate scripts may contain parameters but are less likely to involve hidden execution through these flags.

  - **Identify Execution Path Locations**: Investigate the `CommandLine` field for execution from high-risk directories such as `C:\Temp\`, `C:\Users\Public\`, `C:\Users\Default\`, or any common script extensions like `.bat`, `.ps1`, or `.js`. Malicious execution is more likely from these paths.

  - **Search for Malicious Command Patterns**: Examine the `CommandLine` for patterns such as `-nop`, `-sta`, or PowerShell download commands (e.g., `.downloadfile(`) which indicate malicious activity. These characteristics are high-confidence indicators of potential malware behavior.

  - **Assess Recent Script Changes**: Validate if recent modifications were made to scripts in sensitive directories. Use file auditing tools to check for unexpected changes over the past week that may correlate with the detected behavior.

  - **Contextualize User Context**: Determine which user executed the `cmd.exe` process by reviewing the `NewProcessId` and `SubjectUserName` fields in Event ID 4688. If the user has no administrative role or the activity is outside normal business hours, it may warrant further investigation.

  - **Contrast with Legitimate Activities**: Identify legitimate administrative scripts that may run from temporary locations, checking their creation and modification timestamps. If they align with typical operations, note this for context during incident response.

  ### Prioritization

  This alert is moderate in severity due to the impact it can have on enterprise security, particularly if malicious activity is confirmed. The likelihood of malicious abuse is heightened given the tactics described in active ransomware campaigns such as Chaos and DarkSide, which commonly utilize these techniques for stealth execution. Such behavior is increasingly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may miss cases where similar command executions occur from legitimate applications with visible windows or through scheduled tasks. A full suite of logs from Sysmon, along with a baseline of normal user activity, is crucial to avoid false positives. Legitimate administrative scripts running from temporary folders or background tasks may trigger this alert; however, monitoring for unusual patterns in execution context remains essential. Related detections to consider include monitoring for PowerShell or WMI executions (MITRE ATT&CK T1059.001) which are often used in conjunction with these cmd calls to achieve further compromise.

