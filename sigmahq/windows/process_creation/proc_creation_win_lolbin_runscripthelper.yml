  ---

  ### Technical Context

  This rule detects the execution of PowerShell scripts through `Runscripthelper.exe`, specifically when the command line contains the term `surfacecheck`. This behavior may indicate an adversary using this legitimate tool for executing scripts in a covert manner, potentially for reconnaissance or persistence objectives. The relevant MITRE ATT&CK tactics and techniques are **Execution (TA0002)** and **Command and Scripting Interpreter: PowerShell (T1059.001)**.

  Primary telemetry sources include Windows process creation logs (specifically, Security Event ID 4688 and/or Sysmon Event ID 1) that provide details on process execution, along with CommandLine arguments. If malicious, this action can facilitate further exploitation or lateral movement within the environment. This detection, however, does NOT confirm that `Runscripthelper.exe` is malicious on its own, as it may also be used by legitimate administrative processes.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for details on the execution of `Runscripthelper.exe`. Look specifically at the CommandLine field for occurrences of `surfacecheck`.

  - **Correlate with known administrator activities:** Investigate if prior authorized administrative actions frequent the execution of `Runscripthelper.exe` alongside the indicator. A legitimate command may typically not include `surfacecheck`.

  - **Analyze user context:** Verify the user account that executed the process. If it’s a standard user account without administrative privileges, it raises suspicion.

  - **Review the file path:** Confirm that `Runscripthelper.exe` originates from legitimate locations, such as `C:\Windows\System32`. Any variations may indicate malicious tampering.

  - **Examine child processes:** Investigate any child processes spawned by `Runscripthelper.exe` to identify additional suspicious activities, focusing on potentially harmful PowerShell scripts or execution of unauthorized commands.

  - **Identify previous alerts:** Check if previous alerts triggered by the same process or user account correlating with apprehended PowerShell misuse were logged, indicating a pattern of malicious behavior.

  ---

  ### Prioritization

  Considering the enterprise context, an alert generated by this rule should be treated with medium severity. The execution of potentially malicious scripts through `Runscripthelper.exe` on critical systems indicates a plausible risk of compromise. While this method is less commonly weaponized, the association with PowerShell usage necessitates timely investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may encounter limitations through obfuscation techniques where command line arguments are manipulated, bypassing caught patterns. Accurate detection relies on comprehensive logging configurations for Windows process creation events. Additionally, legitimate administrative tasks may trigger the alert if they also utilize `Runscripthelper.exe`. Related detections to consider include alerts for PowerShell command executions that can complement the oversight of suspicious Script helper activity.

