note: |
  ### Technical Context

  This Sigma rule detects the execution of `Runscripthelper.exe`, particularly instances where the command line includes the term `surfacecheck`. This behavior typically indicates an attempt to execute PowerShell scripts in a less direct manner, potentially aiming to bypass detection mechanisms that monitor conventional PowerShell execution. The likely attacker objective is to leverage running scripts to achieve code execution and maintain persistence or perform reconnaissance.

  Relevant MITRE ATT&CK techniques include Execution (T1059) and User Execution (T1202). The primary telemetry sources are process creation logs from Windows, specifically leveraging Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to unauthorized access or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is necessary to establish context and confirm wrongdoing.

  ### Investigation Steps

  - **Check process creation details**: Review Windows Security Event ID 4688 for instances where `Runscripthelper.exe` was executed. Pay attention to the user account involved and the parent process to assess if it's a legitimate administrative action.

  - **Analyze command line arguments**: Look for instances where the CommandLine field contains `surfacecheck`. Note that benign command line usage typically does not involve this term.

  - **Verify user and asset role**: Cross-check the user account executing the command against your organization's user roles. An execution by a standard user versus a systems administrator could indicate a differentiation between benign and malicious behaviors.

  - **Review Sysmon logs for anomalies**: Check Sysmon Event ID 1 logs for additional context related to `Runscripthelper.exe`, specifically noting any unusual child processes spawned that may suggest an ongoing exploit.

  - **Identify indicators of compromise**: Look for known malicious indicators such as execution paths or hashes associated with other techniques that leverage `Runscripthelper.exe`, which could validate malicious intent.

  - **Correlate with threat intelligence**: Assess against any active threat intelligence related to `Runscripthelper.exe` being abused in the wild. Cross-reference with current adversary groups known to use similar techniques for malicious purposes.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems and data integrity. The likelihood of malicious abuse is moderate as the behavior can be indicative of an attempt to obfuscate script execution. While not all instances are nefarious, they are commonly associated with stealthy execution techniques that seek to evade typical defenses.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of valid administrative scripts using `Runscripthelper.exe` for legitimate purposes. If telemetry sources are misconfigured or not aggregated, this rule may fail to capture all relevant executions. Additionally, legitimate applications might inadvertently invoke the command, prompting the alert. Strengthening coverage could involve monitoring for suspicious command line arguments within general PowerShell executions, thus providing a more comprehensive picture of potential exploit activity.

