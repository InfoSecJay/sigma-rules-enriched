note: |
  ### Technical Context
  This rule detects suspicious executions of `Runscripthelper.exe`, a utility that can be misused by attackers to execute PowerShell scripts without being easily identified. The main threat scenario involves attackers using this tool to run malicious scripts that could lead to further system compromise, data exfiltration, or lateral movement within an enterprise environment. By leveraging such utilities, attackers may aim to bypass standard security detection mechanisms.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002) - specifically **Command and Scripting Interpreter** (T1059)
  - **Defense Evasion** (TA0005) - specifically **Exploitation of Remote Services** (T1202)

  The primary data sources that can provide evidence include **process creation events** from Windows systems. These events capture information about application launches and command-line arguments, allowing analysts to identify unusual behaviors or command executions associated with the detected executable.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs to identify instances of `Runscripthelper.exe` execution, specifically focusing on the command line used during the execution.
  - **Analyze Command-Line Usage:** Check for command-line arguments that contain 'surfacecheck' or other suspicious patterns that could indicate the execution of potentially harmful scripts.
  - **Correlate with Security Alerts:** Cross-reference the findings with other security alerts from SIEM/EDR platforms, looking for concurrent suspicious activities that could indicate a broader attack campaign.
  - **Investigate Related User Activity:** Assess the user account associated with the execution for any anomalies, such as atypical login locations, times, or patterns of behavior leading up to the execution event.

  ### Prioritization
  This alert is categorized with medium severity due to the potential impact of malicious script execution, which can lead to significant breaches of security, data loss, and system integrity. The likelihood of detection may vary based on the existing security posture and controls in place.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of malicious PowerShell usage, particularly if attackers utilize obfuscation tactics or alternative methods to execute their scripts. Additionally, it assumes that `Runscripthelper.exe` is present and under monitored conditions on systems where such actions would be unusual. Required logs include detailed process creation events configured to capture command lines, which must be enabled to allow comprehensive visibility.

