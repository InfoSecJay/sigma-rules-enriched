  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts utilized via the `Runscripthelper.exe` binary, particularly when the command line contains the string 'surfacecheck'. The behavior indicates a potential use of this tool for executing scripts in a misleading manner, likely aimed at evading detection mechanisms. The primary adversary objective could be to run malicious scripts without triggering suspicious activity alerts.

  The relevant MITRE ATT&CK technique for this detection is Execution (T1059), focusing specifically on the Windows PowerShell (T1059.001) sub-technique. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation and Sysmon Event ID 1 that details command line arguments. If malicious, this behavior can indicate an attacker leveraging an indirect method for script execution, thus compromising the targeted environment. However, detection of `Runscripthelper.exe` alone does not confirm malicious intent nor does it provide context on the script's nature or purpose.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 for instances of `Runscripthelper.exe`. Check the command line for the presence of 'surfacecheck'; if found, proceed with further analysis.

  - **Identify originating process:** Cross-reference with Sysmon Event ID 1 to ascertain the parent process of `Runscripthelper.exe`. A legitimate process like a scheduled task or automation script may indicate benign behavior, whereas unexpected parent processes may indicate malicious intent.

  - **Analyze script content:** If within your environment you can capture script content or URL, assess the PowerShell script invoked by `Runscripthelper.exe`. Look for suspicious commands or payloads that may indicate exploitation or lateral movement.

  - **Check for related artifacts:** Look for file access or creation events stemming from `Runscripthelper.exe` execution, specifically in locations like `%TEMP%` or user profile directories. This can indicate the download or persistence of malicious files associated with the execution.

  - **Evaluate endpoint behavior:** Use endpoint detection and response (EDR) tools to assess behavioral anomalies on affected systems post-execution. Focus on other processes triggered by `Runscripthelper.exe`. Frequent and unexpected network connections or registry changes post-execution may indicate malicious intent.

  ### Prioritization

  This alert should be considered medium severity, as it pertains to potential exploitation using a commonly abused technique, especially in environments where administrative tasks often utilize PowerShell. The likelihood of malicious behavior is notable due to the obscured method of execution, which is often leveraged by adversaries for defense evasion.

  ### Blind Spots and Assumptions

  Detection may face limitations such as administrators using `Runscripthelper.exe` for legitimate automation tasks, which could trigger false positives. Reliability hinges on comprehensive logging of process creation events and potentially the indirect invocation of PowerShell. Additionally, legitimate activities like system maintenance scripts may also activate this rule. Companion detections monitoring for unauthorized PowerShell execution or unusual script activity can augment detection coverage.

