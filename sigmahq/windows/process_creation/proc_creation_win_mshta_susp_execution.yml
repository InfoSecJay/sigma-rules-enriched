            # - '.exe'
  condition: all of selection_*
falsepositives:
- False positives depend on scripts and administrative tools used in the monitored
  environment
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the Windows utility `mshta.exe` is executed with suspicious file extensions that typically do not align with HTML Application (HTA) content. Attackers often exploit `mshta.exe` to execute malicious scripts embedded in files with misleading extensions (like `.png`, `.jpg`, `.zip`, or `.pdf`) to bypass security measures. This behavior is associated with various tactics in adversarial techniques, particularly in evading detection and executing payloads.

  The suspected threat family includes various malware using `mshta.exe` for executing hidden payloads as part of their attack strategy, often aiming to establish persistence, execute remote commands, or perform lateral movement within the environment. Relevant MITRE ATT&CK tactics include:
  - **Execution** (TA0002): Utilizing legitimate tools to execute scripts and commands.
  - **Defense Evasion** (TA0005): Obfuscating malicious activity through benign-looking file extensions to bypass detection mechanisms.
  - **User Execution** (T1203): Relying on user interaction to trigger malicious scripts disguised as non-executable file types.

  Primary data sources for corroborating this behavior include **process creation events**, which record all instances of program executions, and can provide insights into command-line arguments. Additionally, **Sysmon logs** can enhance visibility by capturing the entire command-line context, while **Windows Event Logs** related to application execution can offer further evidence.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for any `mshta.exe` executions, particularly focusing on command-line arguments that include suspicious file extensions that do not commonly represent HTA content.

  - **Inspect Command-Line Arguments**: Identify and scrutinize the specific file extensions used in command-line arguments. Pay close attention to file types like `.zip`, `.jpeg`, `.pdf`, etc., that are often utilized to obscure malicious payloads.

  - **Cross-Reference with Threat Intelligence**: Utilize threat intelligence feeds to verify if the executed scripts or any associated files are linked to known malicious campaigns or families.

  - **Analyze Related Network Traffic**: Investigate any outbound connections initiated by the process, especially those that may indicate data exfiltration or command-and-control (C2) communication attempts.

  ### Prioritization
  Given the high potential for `mshta.exe` to be misused for executing malicious scripts, this alert is prioritized as high severity. The capability of attackers to leverage benign utilities for nefarious purposes poses significant risks to enterprise security, demanding prompt investigation and response.

  ### Blind Spots and Assumptions
  The primary gap in detection coverage may arise from environments where legitimate use of `mshta.exe` is common and not closely monitored, which can lead to false positives. The detection logic assumes that any use of `mshta.exe` with unusual file extensions is suspicious, but this might not hold true for all enterprises. Therefore, comprehensive knowledge of specific applications and usage patterns within the network is crucial. Also, the effectiveness of this detection relies on the availability of detailed **process creation logs** and **Sysmon configuration** to capture command-line arguments accurately. If these logs are not retained or monitored, detection may falter.

