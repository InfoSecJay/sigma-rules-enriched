logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\mshta.exe'
  - OriginalFileName: 'mshta.exe'
  selection_cli:
    CommandLine|contains:
    - '.7z'
    - '.avi'
    - '.bat'
    - '.bmp'
    - '.conf'
    - '.csv'
    - '.dll'
    - '.doc'
    - '.gif'
    - '.gz'
    - '.ini'
    - '.jpe'
    - '.jpg'
    - '.json'
    - '.lnk'
    - '.log'
    - '.mkv'
    - '.mp3'
    - '.mp4'
    - '.pdf'
    - '.png'
    - '.ppt'
    - '.rar'
    - '.rtf'
    - '.svg'
    - '.tar'
    - '.tmp'
    - '.txt'
    - '.xls'
    - '.xml'
    - '.yaml'
    - '.yml'
    - '.zip'
    - 'vbscript'
            # - '.chm'  # could be prone to false positives
            # - '.exe'
  condition: all of selection_*
falsepositives:
- False positives depend on scripts and administrative tools used in the 
  monitored environment
level: high
note: |
  ### Technical Context

  This rule detects the execution of `mshta.exe` with file extensions that do not typically represent HTML Application content, such as `.png`, `.zip`, and `.pdf`. It recognizes an attacker objective of using `mshta.exe`, a legitimate Windows utility, to execute malicious scripts masquerading as benign file types to bypass security measures. This behavior aligns with the MITRE ATT&CK technique T1218.005 (Signed Binary Proxy Execution: mshta.exe). The primary telemetry sources include Windows process creation logs, particularly Event ID 4688 and potentially Sysmon Event ID 1, as these contain details about the executed command lines. If malicious, this behavior could lead to unauthorized execution of scripts, data exfiltration, or remote code execution. It is essential to note that this detection does not inherently confirm malicious intent—further investigation is needed to understand the context.

  ### Investigation Steps

  - **Review command line arguments:**
    Analyze the command line associated with the `mshta.exe` process (Event ID 4688, fields: `CommandLine`). Look for suspicious file types like `.zip`, `.pdf`, or `.jpg`, which are not typical for HTA files, indicating potential abuse.

  - **Check parent process context:**
    Investigate the parent process (Field: `ParentProcessId`) associated with `mshta.exe` to determine its origin. Legitimate use may involve system processes or user-initiated applications, while suspicious activity might originate from known malicious executables or scripts.

  - **Validate file creation:**
    If the alert is triggered, verify if any files were created or modified in the same timeframe (e.g., look in file creation logs or use Sysmon Event ID 11). Check for exfiltration attempts or drops of files with misleading extensions.

  - **Assess the host role:**
    Determine the role of the host executing `mshta.exe`. Identify if it is a server (e.g., application or file server) or client workstation. Unusual `mshta.exe` execution on critical servers (like domain controllers) warrants immediate attention.

  - **Look for known malicious indicators:**
    Cross-reference the command line arguments or file hashes against threat intelligence feeds for known malicious activity associated with the detected hashes. For example, using VirusTotal or internal threat intelligence databases.

  - **Monitor for user activity anomalies:**
    Review user access logs (Event ID 4624) for unusual login patterns preceding this execution. Identify if the user account has abnormal privileges or has undergone recent changes, indicating potential compromise.

  ### Prioritization

  This alert is of high severity due to the potential for malicious exploitation of a commonly abused Windows utility. The execution of `mshta.exe` with misleading file types significantly increases the likelihood of malicious use, as this behavior is frequently observed in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited in environments utilizing legitimate automation, scripts, or administrative processes that also leverage `mshta.exe`. A reliance on consistent log configuration for Event ID 4688 and Sysmon is necessary for reliable detection. Legitimate activities may include software updates or automation tools executing HTA files. Companion detections to consider include direct monitoring of process creation using other potentially abused utilities, such as `PowerShell` (T1059.001) or `wscript.exe` (T1218.001), to strengthen overall detection capabilities.

