detection:
  selection_img:
  - Image|endswith: '\mshta.exe'
  - OriginalFileName: 'mshta.exe'
  selection_cli:
    CommandLine|contains:
    - '.7z'
    - '.avi'
    - '.bat'
    - '.bmp'
    - '.conf'
    - '.csv'
    - '.dll'
    - '.doc'
    - '.gif'
    - '.gz'
    - '.ini'
    - '.jpe'
    - '.jpg'
    - '.json'
    - '.lnk'
    - '.log'
    - '.mkv'
    - '.mp3'
    - '.mp4'
    - '.pdf'
    - '.png'
    - '.ppt'
    - '.rar'
    - '.rtf'
    - '.svg'
    - '.tar'
    - '.tmp'
    - '.txt'
    - '.xls'
    - '.xml'
    - '.yaml'
    - '.yml'
    - '.zip'
    - 'vbscript'
