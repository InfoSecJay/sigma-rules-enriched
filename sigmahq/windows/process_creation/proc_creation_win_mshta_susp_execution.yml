            # - '.exe'
  condition: all of selection_*
falsepositives:
- False positives depend on scripts and administrative tools used in the 
  monitored environment
level: high
note: |
  ### Technical Context

  This rule detects the execution of `mshta.exe` with file extensions that are atypical for HTML Applications (HTA), including extensions like `.png`, `.jpg`, `.zip`, and others. Attackers may exploit `mshta.exe` to execute malicious scripts disguised as seemingly harmless files, typically as part of phishing campaigns or other social engineering tactics. This behavior is indicative of an adversary attempting to evade security controls while executing potentially harmful actions on a user's system.

  The relevant MITRE ATT&CK tactics and techniques are Execution (TA0002) and User Execution (T1204.002). The primary telemetry source for this detection is Windows process creation logs, specifically examining command line arguments. If the execution is malicious, it could lead to unauthorized access, data exfiltration, or lateral movement within the network. This detection, however, does NOT confirm malicious intent on its own; legitimate administrative tasks or scripted processes could trigger similar alerts.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `mshta.exe`. Examine the CommandLine field for unusual extensions like `.png`, `.jpg`, or `.zip` which could indicate malicious intent.

  - **Validate file source:** Identify the origin of the file being executed. Verify if it has been downloaded from untrusted or suspicious domains through URL investigation or network logs.

  - **Analyze command execution context:** Assess the user account under which `mshta.exe` is executed. Determine if it is a highly privileged account that could denote an escalation or misuse of administrative rights.

  - **Correlate with known legitimate behavior:** Confirm if other credible users or scheduled tasks have legitimate usages of `mshta.exe` with expected HTA file extensions (like `.hta` or `.html`). This helps distinguish benign from malicious activity.

  - **Identify high-confidence malicious indicators:** Look for patterns where `mshta.exe` is used with multiple suspicious extensions concurrently or alongside known malicious scripts in the CommandLine.

  - **Check for persistence mechanisms:** Search for evidence of changes to startup processes or scheduled tasks that may utilize `mshta.exe` for re-execution. Monitor for artifacts in locations like the Registry (e.g., Run keys) or Task Scheduler logs (Event IDs 106 and 200).

  ### Prioritization

  This alert should generally be treated with high priority due to the potential impact of the affected systems, which may include critical infrastructure or endpoints handling sensitive information. The likelihood of malicious use is significant, as this tactic is commonly weaponized in real-world attacks, especially those surrounding phishing and social engineering.

  ### Blind Spots and Assumptions

  Detection might be limited by legitimate administrative activities that utilize `mshta.exe` in ways that appear similar to malicious use, especially if the organization's configurations or scripts involve these file extensions. Ensure comprehensive logging is enabled for process creation and monitor necessary endpoints for reliable detection. A complementary detection could include monitoring other process creations associated with malicious file types or unusual behavior around PowerShell execution (T1059.001) that could indicate an escalation strategy by the same adversary.

