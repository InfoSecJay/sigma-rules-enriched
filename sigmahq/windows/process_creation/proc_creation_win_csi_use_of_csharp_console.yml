note: |
  ### Technical Context

  This Sigma rule detects the execution of the CSharp Interactive Console (csi.exe) when it is initiated through PowerShell or similar command line tools. The likely objective of an attacker using this tool is to leverage the .NET framework for running arbitrary C# code in-memory, which may be used for payload execution or post-exploitation activities without leaving significant traces. This behavior aligns with the MITRE ATT&CK technique for Execution (T1127).

  Relevant telemetry sources include process creation logs from Windows (e.g., Security Event ID 4688 and Sysmon Event ID 1). The security impact of detecting this execution may indicate an active exploitation attempt or lateral movement within the network. However, it should be emphasized that this detection does NOT confirm that malicious activity has occurred, as legitimate users may also utilize the CSharp Interactive Console for valid development tasks.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for instances of csi.exe being executed. Look at the `NewProcessName` field to confirm the presence of `csi.exe`. Legitimate uses may include known development tasks with established timelines and user accounts.

  - **Analyze parent process behavior:** Investigate the `ParentImage` field tied to the csi.exe execution. Instances stemming from `powershell.exe`, `pwsh.exe`, or `powershell_ise.exe` should be scrutinized closely. Verify that legitimate PowerShell scripts or commands align with expected usage patterns.

  - **Examine command line arguments:** Utilize Sysmon Event ID 1 or PowerShell logs to inspect the command line used for the execution of csi.exe. Malicious indicators might include unusual or obfuscated arguments consistent with exploitation techniques.

  - **Look for network activity:** Monitor related network connections, especially if csi.exe initiates outbound traffic. Correlate any connections made during the time of execution with known malicious IP addresses or domains.

  - **Evaluate system context:** Determine if the invoked execution is originating from high-value assets (e.g., domain controllers, financial databases). Higher risk associated with these actions warrants immediate attention.

  - **Correlate with file creations:** Check for new file artifacts created in the temporary directories (e.g., C:\Windows\Temp) after the csi.exe execution. Malicious activities often leave suspicious files, such as scripts or binaries that can be indicative of post-exploitation behavior.

  ### Prioritization

  This alert represents a high severity concern due to the potential abuse of the .NET framework for malicious purposes. Since csi.exe is often used in development environments, the likelihood of malicious activity hinges on context — if found on production servers without expected usage, the alert increases in urgency. This behavior is not commonly invested in legitimate workflows, raising the flag for potential exploitation attempts.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging or if process creation events are manipulated. Legitimate usage could include development teams running interactive C# scripts, which should be documented to avoid false positives. Additional detections worth monitoring include unusual parent-child process executions or other command-line execution patterns (e.g., the use of PowerShell to execute scripts).

