note: |
  ### Technical Context

  This Sigma rule detects the execution of the CSharp Interactive (CSI) console, as initiated by PowerShell or other scripting environments. Attackers may leverage this console to execute .NET code in a stealthy manner, aiming to manipulate system configurations, execute payloads, or download further malicious components. The relevant MITRE ATT&CK tactic is Execution (TA0002) and the technique is Application Layer Protocol (T1127). The primary telemetry sources are Windows process creation logs, specifically focused on Event ID 4688 or Sysmon Event ID 1.

  If the CSharp Interactive console is used maliciously, it can lead to unauthorized system changes, data exfiltration, or the deployment of further attacks. It is important to note that this detection alone does not confirm malicious intent without corroborating evidence of harmful actions or context around the process execution.

  ### Investigation Steps

  - **Check process details:** Review Security Event ID 4688 to identify CSI execution, noting the command line used for execution. Look for unusual arguments that could indicate malicious intent (e.g., unusual .NET commands).

  - **Correlate parent process activity:** Verify the parent process listed in Event ID 4688, specifically looking for PowerShell (Event ID 4688 or Sysmon ID 1) as it is a common legitimate process. Benign activity may indicate script automation, whereas malicious execution tends to involve direct command executions without standard script usage.

  - **Investigate network connections:** Analyze network activity logged by the firewall or Windows Event ID 5156 to see if the initiated CSI process is attempting to reach out to external addresses. Confirm if connections made coincide with known malicious IPs or unusual outbound behaviors.

  - **Evaluate user context:** Identify the user account that executed the CSI process via Event ID 4688. If the execution occurred under a high-privilege account during unusual hours, this could signify malicious activity compared to expected behavior from standard user accounts.

  - **Review system integrity:** Consider looking for file creation or modification artifacts indicative of payload delivery or persistence, focusing on any changes in directories like Temp or AppData that could link back to the execution of CSI.

  ### Prioritization

  This alert has a high severity due to the potential impact on sensitive systems, particularly if the execution is tied to administrative accounts. The likelihood of malicious abuse is moderate to high, as the CSharp Interactive console is often employed for adversarial techniques related to .NET exploitation. This behavior is less common in standard operations, making it a crucial focus for triage efforts.

  ### Blind Spots and Assumptions

  There are limitations in detecting this behavior due to potential evasion methods like renaming the executable or using secured channels that mask network activity. The rule requires proper logging of process creation via Windows Event Logs or Sysmon for effective detection. Legitimate activities triggering this alert may include benign development or testing activities by developers using the .NET framework. A companion detection that enhances coverage would be monitoring for unusual PowerShell execution patterns (e.g., command execution across multiple processes).

