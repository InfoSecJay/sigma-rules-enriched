note: |
  ### Technical Context

  This rule detects the invocation of the `DllUnregisterServer` function through `msiexec.exe`, which is typically used for Windows Installer operations. An attacker may use this technique to deregister malicious DLLs, potentially removing critical detection mechanisms or preparing the environment for further payload execution or persistence. The relevant MITRE ATT&CK technique is T1218.007 (Signed Binary Proxy Execution).

  The primary telemetry source is Windows process creation logs, specifically Monitoring Security Event ID 4688 and Sysmon Event ID 1 for `msiexec.exe` calls. If the activity is malicious, it can lead to unauthorized changes in system configuration or application behavior. Importantly, this detection does not confirm malware presence or execution on its own—it indicates suspicious behavior that requires further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `msiexec.exe` launching with command line arguments that include `-z` and a `.dll` file. Note that legitimate use might involve software installations or updates without these specific flags.

  - **Analyze the command line arguments:** Confirm that the CommandLine parameter includes both `-z` and a file path ending with `.dll`. Malicious indicators would show abnormal or inconsistent paths that do not match standard application directories.

  - **Check for high-risk DLLs:** Cross-reference the DLL name being deregistered against known malicious DLLs or software in your organization's whitelist. Non-standard, unfamiliar DLLs can indicate malicious intent.

  - **Validate application whitelisting:** Compare the triggering event to your application whitelisting solution. Legitimate enterprise applications initiating `msiexec.exe` should match established configurations and paths.

  - **Evaluate recent changes to systems:** Investigate system changes made around the time of the alert, looking for patch installations, software updates, or administrative actions that could explain the behavior.

  - **Check for concurrent suspicious activity:** Look for other alerts or anomalous activity (e.g., unauthorized configurations or privilege escalations) occurring near the same time, which may suggest broader malicious behavior in the environment.

  ### Prioritization

  This alert is of medium severity; while the affected system may contain critical applications, the likelihood of malicious abuse through this technique is moderate. Disabling DLLs can be a precursor to more devastating actions, making it an area of concern for SOC analysts.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by user account control (UAC) settings or if `msiexec.exe` is executing as a trusted process. Legitimate software installers could trigger this alert. Additional detection logic could strengthen coverage—consider monitoring for abnormal command executions of installed software or changes made through administrative powers, such as PowerShell command activity related to DLL manipulations.

