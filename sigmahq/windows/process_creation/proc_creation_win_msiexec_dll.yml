note: |
  ### Technical Context
  This detection rule identifies instances where the `MsiExec.exe` executable is invoked to load a Dynamic Link Library (DLL) and subsequently calls the `DllUnregisterServer` function. This activity is often indicative of attempts by malicious actors to manipulate or unregister malicious DLLs on a target system, aligning with broader tactics aimed at evading detection and maintaining persistence. The objective may include executing payloads or removing DLLs related to security controls, thereby weakening the defensive posture of the system.

  This detection falls under the MITRE ATT&CK framework's Defense Evasion tactic, specifically the technique T1218.007, which relates to the use of `Msiexec` to obtain code execution, often abused to circumvent traditional security mechanisms. The telemetry best suited for capturing this activity includes process creation logs from the Windows OS component, which provide insights into the command-line executions and image paths associated with `MsiExec.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze logs for instances of `MsiExec.exe` execution. Look specifically for anomalies in the command-line arguments that include the `-z` switch and any DLL file paths listed.

  - **Examine DLL Events:** Investigate any recent changes to DLL files in the environment, especially those that were registered or unregistered. This can help identify if there’s been any unauthorized manipulation of critical system files.

  - **Monitor for Related System Changes:** Check for changes to registry keys associated with DLL registration. This includes keys under `HKEY_CLASSES_ROOT\CLSID`, which may provide additional context about modifications or unusual activities related to COM objects.

  - **Identify Contextual Anomalies:** Correlate process creation events with user activity. Identify if the invocation of `MsiExec.exe` occurred under unusual contexts, such as during non-business hours or from unexpected user accounts.

  ### Prioritization
  The alert carries medium severity due to the potential for compromise related to DLL manipulation in a corporate environment. Given that attackers may leverage this technique to disable security features or deploy malicious payloads, timely investigation is crucial to prevent escalation.

  ### Blind Spots and Assumptions
  This detection strategy assumes that the necessary logging features are enabled and configured properly on Windows systems to capture process creation activities. There may be gaps in detection if users have elevated privileges that allow them to execute benign instances of `MsiExec.exe` without triggering alerts. The current detection logic might miss malicious behaviors if attackers utilize alternative methods to execute similar functionality without relying on `MsiExec.exe` or its typical command-line patterns.

