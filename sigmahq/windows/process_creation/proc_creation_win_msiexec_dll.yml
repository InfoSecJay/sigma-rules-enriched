note: |
  ### Technical Context

  This rule detects the invocation of the `DllUnregisterServer` function via `msiexec.exe`, which is commonly used to remove information about a DLL registered with the Windows registry. This behavior may indicate an attacker attempting to execute scripts that unregister malicious or unwanted DLLs, potentially to evade detection or alter system behavior. The relevant MITRE ATT&CK technique is "Scripting" (T1218.007).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on `msiexec.exe` being called with indicators that it is attempting to unregister a DLL. If this behavior is deemed malicious, it may lead to unauthorized changes to critical system configurations or the removal of protective components. However, the detection does NOT confirm intent or successful execution of malicious actions on its own.

  ### Investigation Steps

  - **Examine Process Creation Logs:** Review Security Event ID 4688 and/or Sysmon Event ID 1 for instances where `msiexec.exe` is executed. Check the `CommandLine` for the presence of ` -z` to confirm potential misuse.

  - **Identify DLLs Targeted:** Look for `.dll` references in the `CommandLine` arguments associated with the `msiexec.exe` process. Compare these DLLs against known legitimate applications. If the DLL is commonly found in enterprise software, consider marking it as benign.

  - **Validate Execution Context:** Check the user identity executing the `msiexec.exe` command. Ensure that it aligns with expected behavior—administrative accounts may invoke such actions during software updates or repairs.

  - **Cross-reference with Historical Logs:** Investigate past executions of `msiexec.exe` to identify any patterns or previous instances of DLL unregistration. Review if this behavior has been logged in similar scenarios to establish a baseline.

  - **Monitor for Suspicious Activity:** Investigate network activities related to the process, such as unusual outbound connections post-execution of `msiexec.exe`, which might indicate further malicious objectives, like exfiltration.

  ### Prioritization

  This alert should be treated with medium priority. The impact is significant if critical system DLLs are unregistered, as this can lead to system instability or loss of functionality. The likelihood of malicious abuse is moderate, as this technique can be weaponized by adversaries looking to disrupt security configurations or perform lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited if `msiexec.exe` is configured not to log certain execution details. Attackers may obfuscate command-line arguments to bypass detection. Additionally, legitimate administrative tasks often run `msiexec.exe`, such as software installs or configurations. A related detection would be monitoring for suspicious command-line parameters used with `msiexec.exe`, which could reinforce the coverage of potential threats.

