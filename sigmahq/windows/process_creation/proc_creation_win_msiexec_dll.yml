note: |
  ### Technical Context

  This Sigma rule detects the use of the `msiexec.exe` process calling the `DllUnregisterServer` function on DLL files. Typically, this behavior indicates an attacker attempting to unregister a malicious or legitimate DLL, possibly as part of software installation clean-up or to prevent associated functionalities from executing. The likely attacker objective here is to manipulate or disable certain applications or services by removing their DLLs.

  This behavior corresponds to the MITRE ATT&CK techniques of **“DLL Search Order Hijacking” (T1218.007)**. The primary telemetry sources for this detection are Windows process creation logs, specifically **Event ID 4688** for process creation details, which includes the command line used. If confirmed malicious, this activity could lead to disabling security features or persistence mechanisms on the system. Importantly, this detection does NOT confirm the intent behind the action—I.e., whether it is part of legitimate software maintenance or an attempt to disable a security measure.

  ### Investigation Steps

  - **Examine the command line arguments**: Review **Event ID 4688** for the associated `msiexec.exe` process creation. Look for command lines containing `-z` and a `.dll` extension to identify potentially malicious actions.

  - **Validate the DLL file**: Check the path in the command line for the DLL being unregistered. A benign example might include system DLLs located in `C:\Windows\System32`. Malicious indicators could include unusual paths like `C:\Users\Public\Downloads\malicious.dll`.

  - **Confirm execution context**: Determine whether `msiexec.exe` is running in a context that suggests a normal update or installation, such as initiated by a known installer. Legitimate activities might include recognized software installation logs or updates from publishing sources.

  - **Assess the affected system's criticality**: Identify if the system is a server or endpoint. Critical systems, if compromised, could have severe implications for data security and operations. Prioritize investigating alerts from servers or sensitive workstations.

  - **Inspect for persistence mechanisms**: Review other log sources, such as **Event ID 4672** (Special privileges assigned) or **Event ID 7045** (New service installed), to identify any created registry keys or services related to the DLL that might indicate persistence attempts.

  ### Prioritization

  The alert has medium severity. The potential impact on critical systems is high, as unregistered DLLs can lead to application failures or security vulnerabilities. The likelihood of malicious abuse is moderate, given that the behavior could indicate software tampering or removal of security functionality.

  ### Blind Spots and Assumptions

  This detection may not capture cases where `msiexec` is invoked with benign intentions, such as during legitimate application updates or maintenance. The effectiveness of detection relies on the availability of process creation logs (**Event ID 4688**) and appropriate configurations for capturing these events. Legitimate software installers may trigger this alert when they clean up unused components, which could lead to false positives. Implementing companion detections for changes to system services or unauthorized file modifications may provide better context for analysis.

