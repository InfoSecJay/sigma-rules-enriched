note: |
  ### Technical Context

  This rule detects the execution of the `msiexec.exe` process with specific command-line arguments indicating a `DllUnregisterServer` function call on a DLL file, typically an indicator of potential malware behavior. The likely attacker objective is to unregister a DLL to disable its functionality, potentially as a precursor to malware installation or modification of legitimate software. This behavior is categorized under the MITRE ATT&CK technique T1218.007 (Signed Binary Proxy Execution).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing process execution details and command line arguments. If malicious, this can lead to unauthorized software manipulation or removal of essential functionality, impacting the integrity and availability of systems. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate system maintenance processes may also invoke similar DLL operations.

  ### Investigation Steps

  - **Examine the command line arguments**: Review Process Creation logs (Event ID 4688) for `msiexec.exe` where the CommandLine contains `-z` and `.dll`. Focus on atypical paths or filenames for DLL files, which may indicate malicious behavior.

  - **Identify known legitimate DLLs**: Compare the detected DLL paths against known benign software inventories. For example, legitimate `MsiHandler.dll` files are part of system management. Unrecognized or uncommon DLLs warrant further scrutiny.

  - **Correlate with process execution time**: Check the execution timeline. Investigate if `msiexec.exe` was executed when unusual system activity was logged around the same time (e.g., Event ID 4697 indicates a service installation).

  - **Check for prior `DllRegisterServer` attempts**: Search for any prior execution of DLL registration processes associated with the detected DLL. Any previous calls may signify a continuing effort to manipulate the DLL's registration state.

  - **Review the host's role and criticality**: If the `msiexec.exe` is executing on a critical system (such as a domain controller or database server), escalate the investigation due to higher potential impact.

  - **Validate DLL presence post-execution**: After noting the flagged process, check for any file system changes or newly created artifacts under the DLL path using Sysinternals tools or Windows Security logs. Unexpected file deletions or modifications should be treated seriously.

  ### Prioritization

  The alert severity is medium, as while it indicates suspicious usage of `msiexec.exe`, its potential to reconfigure or disable crucial software services could lead to significant impacts if exploited. The likelihood of malicious abuse is moderate, considering attackers may leverage this technique to destroy functionality in targeted attacks, though legitimate uses do exist.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive monitoring for process arguments, allowing malicious actors to evade detection by varying their command-line syntax. Reliably capturing this activity requires proper logging configurations, especially enabling detailed process creation events. Additionally, legitimate administrative actions such as software updates might trigger similar alerts. A related detection that strengthens coverage would be tracking the creation and deletion of DLL files themselves, providing further context to the use of `msiexec.exe`.

