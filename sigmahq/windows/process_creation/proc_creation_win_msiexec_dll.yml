note: |
  ### Technical Context

  This detection identifies the execution of `msiexec.exe` that calls the `DllUnregisterServer` function, typically used to unregister DLLs from the system. Attackers may utilize this method to disable security controls or remove malicious artifacts. This behavior aligns with the MITRE ATT&CK framework under the tactic "Defense Evasion" and the technique "Component Object Model Hijacking" (T1218.007). The primary telemetry source for this detection is process creation logs, specifically capturing events where `msiexec.exe` is invoked with specific command line parameters. If identified as malicious, the impact could include persistent access, unauthorized changes to system configurations, or malicious software removal. However, this detection does NOT confirm whether the action is inherently malicious; legitimate administrative tasks may invoke similar behaviors.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 for `msiexec.exe` invocation. Identify if it contains the `CommandLine` parameters indicating DllUnregisterServer execution.

  - **Analyze command-line arguments**: Verify the full command-line of the `msiexec.exe` process to check for unusual flags such as `-z` or references to `.dll` files. Legitimate uses typically do not include these parameters.

  - **Identify parent process**: Examine the parent process of `msiexec.exe` using Event ID 4688. Suspicious parental processes, such as scripts or unusual executables launching `msiexec.exe`, can indicate malicious workflows.

  - **Review DLL modification timestamps**: Check the modification timestamps of the DLLs involved using file system logs. Unusual or recent modifications preceding the execution could indicate tampering, suggesting malicious behavior.

  - **Correlate with endpoint security logs**: Investigate logs from endpoint detection and response (EDR) systems to identify potential alerts generated in parallel, indicating a broader malicious event.

  ### Prioritization

  The alert is medium-severity due to potential significant impacts on system integrity if allowed to proceed. Malicious actors could commonly exploit this technique to disable defenses or erase traces of their activities, indicating a moderate likelihood of misuse in the wild.

  ### Blind Spots and Assumptions

  The detection may be evaded if an attacker uses other legitimate administrative tools or custom scripts to unregister DLLs without invoking `msiexec.exe`. Reliable detection requires proper logging settings to capture all process creation events for `msiexec.exe`. Additionally, routine operations by IT staff performing software maintenance may trigger this alert, warranting thorough investigation. A companion detection that enhances coverage could be monitoring for modifications in Windows Service configurations (T1543), as they often indicate simultaneous malicious activity.

