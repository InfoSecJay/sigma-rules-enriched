title: Copy From VolumeShadowCopy Via Cmd.EXE
id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
status: test
description: Detects the execution of the builtin "copy" command that targets a 
  shadow copy (sometimes used to copy registry hives that are in use)
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
date: 2021-08-09
modified: 2023-03-07
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # cmd /c copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\System32\config\SYSTEM\
        # There is an additional "\" to escape the special "?"
    CommandLine|contains|all:
    - 'copy '
    - '\\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy'
  condition: selection
falsepositives:
- Backup scenarios using the commandline
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `copy` command in the Windows command line (cmd.exe) targeting shadow copies, specifically using paths that indicate copying from a Volume Shadow Copy. This behavior is typically associated with an attacker's objective to extract sensitive information, such as registry hives or files that are normally locked or in use. The relevant MITRE ATT&CK tactic is **Impact** (TA0040) and the technique is **T1490: Inhibit System Recovery**.

  The primary telemetry source is process creation logs, particularly focusing on command line arguments captured in Windows Security Event ID 4688. If malicious, this activity can lead to data exfiltration or privilege escalation by allowing attackers to access sensitive system information undetected. Importantly, this detection does NOT confirm that the activity is malicious on its own; legitimate administrative actions, such as backups using the command line, can also trigger this alert.

  ### Investigation Steps

  - **Check the command line execution: ** Review Security Event ID 4688 and extract the command line used. Look for instances of `cmd.exe` running commands with `copy` and `\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy`, indicating potential shadow copy access.

  - **Identify malicious indicators: ** Look for the presence of the command `copy \\?\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy` combined with unusual user accounts or processes. This could denote credential theft operations or privilege escalation attempts.

  - **Validate typical benign behavior: ** Cross-reference user activity logs and system backup schedules to confirm if legitimate backup processes occurred that utilized the command line for moving shadow copies. If commands lack context or expected timing, raise suspicion.

  - **Examine related process activity: ** Verify any child processes spawned from `cmd.exe` associated with this command execution (e.g., `powershell.exe`, `wscript.exe`) which may suggest more sophisticated methods of data exfiltration or further actions by the attacker.

  - **Monitor for laterally spread commands: ** Look for other instances of the `copy` command targeting shadow copies across the network, particularly from non-administrative endpoints, to gauge the breadth of potential compromise.

  ### Prioritization

  This alert is of high importance in an enterprise context due to the potential impact of extracting sensitive data from shadow copies, which could lead to significant data breaches. The likelihood of malicious use is considerable, as such techniques are frequently weaponized in cybercriminal activity to access and exfiltrate sensitive information.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for legitimate activities, like backup operations, to trigger this alert, leading to false positives. If not configured to monitor specific command line executions, IT operations using the command for benign purposes might not be recorded. The presence of indirectly related tracked activities, such as additional SIGMA rules monitoring system recovery indicators, should be established to strengthen detection capabilities for related malicious actions.

