title: Copy From VolumeShadowCopy Via Cmd.EXE
id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
status: test
description: Detects the execution of the builtin "copy" command that targets a shadow
  copy (sometimes used to copy registry hives that are in use)
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
date: 2021-08-09
modified: 2023-03-07
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # cmd /c copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\System32\config\SYSTEM\
        # There is an additional "\" to escape the special "?"
    CommandLine|contains|all:
    - 'copy '
    - '\\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy'
  condition: selection
falsepositives:
- Backup scenarios using the commandline
level: high
note: |
  ### Technical Context
  This detection rule targets the execution of the Windows Command Prompt (cmd.exe) where the built-in "copy" command is utilized to access and copy files from a Volume Shadow Copy. Specifically, it focuses on scenarios where an attacker may attempt to copy sensitive data, such as registry hives, which can contain crucial information about users and passwords in the system. The primary intent of using volume shadow copies is often to evade traditional detection mechanisms, as they allow attackers to extract live data without impacting system performance or triggering alerts associated with direct access methods.

  The relevant MITRE ATT&CK tactics for this detection include **Impact (TA0040)**, which pertains to actions aimed at disrupting or degrading the integrity of systems, and more specifically, **Data Manipulation (T1490)**, which describes methods attackers might use to manipulate data with the goal of gaining unauthorized access or disrupting system operations. The most pertinent data source for evidence collection is process creation logs, which will capture command-line executions and facilitate the identification of malicious copying activities targeting shadow copies.

  ### Investigation Steps
  - **Review Process Creation Logs**: Start by analyzing logs for cmd.exe executions, specifically looking for instances where the command line contains 'copy' and references volume shadow copy paths. Pay attention to the context of these executions.

  - **Correlate with User Behavior**: Investigate the user accounts that executed these commands. Look for anomalous patterns, such as unexpected administrative use or activity from users who typically do not perform backup operations.

  - **Check for Concurrent Activities**: Look for any simultaneous activities, such as file transfers or other unusual system modifications, that may indicate coordinated malicious activity while the copy commands were used.

  - **Evaluate Backup Processes**: Since legitimate backup or recovery operations could trigger this alert, verify known backup schedules and processes to rule out false positives.

  ### Prioritization
  The alert is classified as high severity due to its potential impact; unauthorized access and copy of sensitive data can lead to credential theft and escalation of privilege. The likelihood of such activity indicative of a compromise also underscores the critical nature of this detection within an enterprise environment.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if logging is not adequately configured to capture all command-line arguments for process creation. The detection logic assumes attackers will use the cmd.exe method to access shadow copies directly; however, they could alternatively employ other methods or tools that may not generate the same command-line signatures. For this alert to function optimally, it is crucial that process creation logging is enabled and configured to capture detailed command-line arguments in the environment.

