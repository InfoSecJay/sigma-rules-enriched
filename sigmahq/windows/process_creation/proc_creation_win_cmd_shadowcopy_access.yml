title: Copy From VolumeShadowCopy Via Cmd.EXE
id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
status: test
description: Detects the execution of the builtin "copy" command that targets a 
  shadow copy (sometimes used to copy registry hives that are in use)
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
date: 2021-08-09
modified: 2023-03-07
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection:
        # cmd /c copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\System32\config\SYSTEM\
        # There is an additional "\" to escape the special "?"
    CommandLine|contains|all:
    - 'copy '
    - '\\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy'
  condition: selection
falsepositives:
- Backup scenarios using the commandline
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_cmd_shadowcopy_access/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `copy` command targeting a shadow copy in Windows environments. This behavior is often linked to adversaries attempting to exfiltrate sensitive data, such as registry hives or password hashes. The relevant MITRE ATT&CK tactic is **Impact (T1490)**, specifically around data destruction or extraction. The primary telemetry source is Windows process creation logs, specifically from Security Event ID 4688 and Sysmon Event ID 1.

  If the behavior is confirmed as malicious, it could lead to unauthorized access to sensitive information, warranting immediate investigation. However, it is important to note that this detection alone does not confirm malicious intent, as there are legitimate circumstances in which this command might be executed, such as scheduled backups.

  ### Investigation Steps

  - **Review command execution context:** Check Security Event ID 4688 for the process creation log tied to the `cmd.exe` execution. Look for parent processes to identify any unusual command chains or administrative tools that could indicate malicious activity.

  - **Analyze command line parameters:** Inspect the command line (`CommandLine`) in the same Security Event for indicators such as the presence of `\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy` to ascertain if it targets shadow copies. Legitimate commands may include standard backup syntax without shadow copy references.

  - **Correlate with user activity:** Validate the user context associated with the command. If the command was executed by a known administrative user during unauthorized hours, it may indicate a higher likelihood of malicious behavior.

  - **Check for recent shadow copy creation:** Utilize VSS (Volume Shadow Copy Service) event logs or relevant PowerShell commands to determine if any shadow copies were created shortly before the `copy` command was executed. This can highlight potential preparatory actions by adversaries.

  - **Identify known benign activities:** Document any organizational practices or automated scripts using similar commands for backups that could trigger this alert. Ensure that such activities are recorded and understood to minimize investigation overhead.

  - **Look for file creation indicators:** If there is exfiltration activity, check for newly created files or unusual log activity linked to extracted data in common storage directories (`C:\Windows\Temp`, `C:\Users\Public`) that coincide with the execution time of the command.

  ### Prioritization

  This alert has a high severity level due to the potential impact of unauthorized data access. The likelihood of use by adversaries is significant, given the common weaponization of similar techniques for data exfiltration. Systems targeted are often critical, containing sensitive and valuable data for both personal and organizational security.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of shadow copies in backup operations, which can produce false positives. Ensure that process creation logging is enabled across endpoints for reliable detection. Additionally, command execution from automated administrative scripts can generate alerts. Related detections for heightened coverage include monitoring for abnormal PowerShell commands targeting VSS or user activity associated with known backup software.

