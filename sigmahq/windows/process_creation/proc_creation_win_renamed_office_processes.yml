logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName:
    - 'Excel.exe'
    - 'MSACCESS.EXE'
    - 'MSPUB.EXE'
    - 'OneNote.exe'
    - 'OneNoteM.exe'
    - 'OUTLOOK.EXE'
    - 'POWERPNT.EXE'
    - 'WinWord.exe'
    - 'Olk.exe'
  - Description:
    - 'Microsoft Access'
    - 'Microsoft Excel'
    - 'Microsoft OneNote'
    - 'Microsoft Outlook'
    - 'Microsoft PowerPoint'
    - 'Microsoft Publisher'
    - 'Microsoft Word'
    - 'Sent to OneNote Tool'
  filter_main_legit_names:
    Image|endswith:
    - '\EXCEL.exe'
    - '\excelcnv.exe'
    - '\MSACCESS.exe'
    - '\MSPUB.EXE'
    - '\ONENOTE.EXE'
    - '\ONENOTEM.EXE'
    - '\OUTLOOK.EXE'
    - '\POWERPNT.EXE'
    - '\WINWORD.exe'
    - '\OLK.EXE'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of renamed Microsoft Office binaries, which is indicative of potential ransomware or other malicious activity seeking to bypass security measures. Attackers may rename these binaries to obfuscate their actions, allowing them to deliver payloads or execute malicious scripts while masquerading as legitimate Office applications. This behavior aligns with the MITRE ATT&CK technique "Masquerading" (T1036.003) and can be categorized under the "Defense Evasion" tactic.

  Primary telemetry sources for this behavior include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details about process spawning events. If malicious, successful execution could lead to data theft, system compromise, or lateral movement within the network. However, it is critical to note that this detection does NOT confirm that the activity is inherently malicious; it may also result from legitimate software behavior or administrative actions.

  ### Investigation Steps

  - **Check the process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for the execution of processes where the `OriginalFileName` indicates a legitimate Office binary (e.g., Excel.exe, WinWord.exe). Confirm that the `Image` path reflects a renamed or uncommon location, which may indicate malicious intent.

  - **Identify unusual file paths**: If the `Image` field shows execution from non-standard directories (e.g., `%TEMP%`, user directories, or unusual application folders), this is a high-confidence indicator of potential malicious activity.

  - **Correlate with network activity**: Analyze outbound connections related to the identified Office processes using firewall or proxy logs (e.g., URLs, HTTP methods). Identify any suspicious connections, particularly to known malicious IPs or domains.

  - **Review legitimate activities**: Cross-reference with legitimate use cases, such as scheduled tasks or known scripts that utilize Office applications for reporting. Check for common names and expected execution paths that confirm acceptable usage.

  - **Evaluate detection context**: Consider the criticality of the host system; if the compromised process runs on an endpoint that handles sensitive information (e.g., finance or HR systems), prioritize the investigation accordingly.

  - **Check for other signs of compromise**: Review additional Sysmon logs for unusual process injection (Event ID 8) or network anomalies (Event ID 3) that correlate with the execution of these renamed binaries for a more comprehensive threat assessment.

  ### Prioritization

  This alert should be considered high priority due to the potential impact of compromised Office applications, which can facilitate extensive data exfiltration or malware deployment. The likelihood of malicious abuse is significant, as attackers commonly utilize this technique to evade detection while executing harmful payloads.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by renamed files that remain undetected if not properly logged or filtered. Evasive attackers might employ further obfuscation techniques or use legitimate file names in unexpected contexts. This alert may be triggered by benign activities, such as legitimate administrative scripts or automated systems utilizing Office macros. Companion detections, such as monitoring unusual command-line arguments (e.g., command line execution via macros), can enhance overall coverage and strengthen incident response.

