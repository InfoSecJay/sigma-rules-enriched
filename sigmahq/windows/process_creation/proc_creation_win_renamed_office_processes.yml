title: Renamed Office Binary Execution
id: 0b0cd537-fc77-4e6e-a973-e53495c1083d
status: test
description: Detects the execution of a renamed office binary
references:
- https://infosec.exchange/@sbousseaden/109542254124022664
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-20
modified: 2025-12-09
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName:
    - 'Excel.exe'
    - 'MSACCESS.EXE'
    - 'MSPUB.EXE'
    - 'OneNote.exe'
    - 'OneNoteM.exe'
    - 'OUTLOOK.EXE'
    - 'POWERPNT.EXE'
    - 'WinWord.exe'
    - 'Olk.exe'
  - Description:
    - 'Microsoft Access'
    - 'Microsoft Excel'
    - 'Microsoft OneNote'
    - 'Microsoft Outlook'
    - 'Microsoft PowerPoint'
    - 'Microsoft Publisher'
    - 'Microsoft Word'
    - 'Sent to OneNote Tool'
  filter_main_legit_names:
    Image|endswith:
    - '\EXCEL.exe'
    - '\excelcnv.exe'
    - '\MSACCESS.exe'
    - '\MSPUB.EXE'
    - '\ONENOTE.EXE'
    - '\ONENOTEM.EXE'
    - '\OUTLOOK.EXE'
    - '\POWERPNT.EXE'
    - '\WINWORD.exe'
    - '\OLK.EXE'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of Microsoft Office binaries that have been renamed, which may indicate an evasion technique used by malicious actors to disguise their activities. Attackers often rename legitimate binaries to deliver malware or exploit vulnerabilities without being detected. The primary goal is to execute malicious scripts or payloads while appearing as legitimate Office applications, potentially leading to data exfiltration, credential theft, or further lateral movement within the network.

  The detection aligns with the MITRE ATT&CK framework under the tactic of Defense Evasion, specifically technique T1036.003, which addresses the obfuscation of file names or paths. This behavior can be indicative of threat families using custom or repurposed tools designed to evade detection by security solutions.

  Key telemetry sources for this detection include process creation events, which will provide insights into the execution of applications along with their associated attributes such as the original file name and description.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze recent process creation events for the listed Office applications. Focus on entries where the `Image` path differs from expected legitimate names.

  - **Identify Renamed Binaries:** Look for any surprises in the `OriginalFileName` and `Description` fields that seem abnormal or inconsistent with standard Office application behavior.

  - **Correlate with Other Data Sources:** Cross-reference findings with threat intelligence feeds and endpoint detection logs to ascertain if the renamed binaries are linked with known malicious activities or actors.

  - **Inspect Network Activity:** Check network logs for unusual outbound connections initiated by the detected processes, which may indicate exfiltration attempts or command-and-control communications.

  ### Prioritization
  The severity of this alert is high due to the potential impact of renamed Office binaries facilitating malicious activities, combined with the likelihood of evasion techniques being successful in bypassing traditional security measures in enterprise environments.

  ### Blind Spots and Assumptions
  The detection coverage may be limited by the environment's logging configuration; if detailed process creation logs are not retained or if they do not include enough metadata, the detection may miss critical events. This logic assumes that all necessary monitoring solutions are correctly configured to capture process creation events on Windows endpoints. There may also be legitimate scenarios where Office applications are renamed for valid reasons, potentially leading to false positives.

