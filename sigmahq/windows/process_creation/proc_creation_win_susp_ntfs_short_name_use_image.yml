title: Use NTFS Short Name in Image
id: 3ef5605c-9eb9-47b0-9a71-b727e6aa5c3b
related:
- id: dd6b39d9-d9be-4a3b-8fe0-fe3c6a5c1795
  type: similar
status: test
description: Detect use of the Windows 8.3 short name. Which could be used as a method
  to avoid Image based detection
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/jonasLyk/status/1555914501802921984
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-06
modified: 2023-07-20
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '~1.bat'
    - '~1.dll'
    - '~1.exe'
    - '~1.hta'
    - '~1.js'
    - '~1.msi'
    - '~1.ps1'
    - '~1.tmp'
    - '~1.vbe'
    - '~1.vbs'
    - '~2.bat'
    - '~2.dll'
    - '~2.exe'
    - '~2.hta'
    - '~2.js'
    - '~2.msi'
    - '~2.ps1'
    - '~2.tmp'
    - '~2.vbe'
    - '~2.vbs'
  filter_main_generic_parent:
    ParentImage: 'C:\Windows\explorer.exe'
  filter_optional_webex:
    ParentImage|endswith: '\WebEx\WebexHost.exe'
  filter_optional_thor:
    ParentImage|endswith: '\thor\thor64.exe'
  filter_optional_winzip:
    Image: 'C:\PROGRA~1\WinZip\WZPREL~1.EXE'
  filter_optional_vcred:
    Image|endswith: '\VCREDI~1.EXE'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Software Installers
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of Windows 8.3 short file names (also known as short names or DOS names) in processes. Attackers may utilize short names to bypass security measures that rely on file name analysis, as these filenames may evade traditional detection mechanisms that don't explicitly account for them. The primary threat scenario involves attackers attempting to mask malicious activity, such as executing scripts or binaries, under benign-looking short names with the intent to avoid detection by security solutions.

  The rule aligns with the MITRE ATT&CK framework, specifically addressing tactics such as **Defense Evasion** (T1070) and techniques like **Indicator Removal on Host** (T1564.004). The use of short names can facilitate evasion tactics, making it harder for traditional security solutions to recognize the nature of the executed files. The primary data source for these detections will come from process creation events on Windows systems, which log the executed image files and their respective paths.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze process creation events from the Windows Event Logs (Event ID 4688) to identify instances of processes that invoke short names, focusing on the `Image` field for any mentions of names containing "~1" or "~2".

  - **Analyze Parent Process Relationships**: Investigate the parent processes of identified suspicious activity. Look specifically for instances where the parent process is `explorer.exe`, `WebexHost.exe`, `thor64.exe`, or `WZPREL~1.EXE`, as these could indicate common contexts in which legitimate processes may be misusing short names.

  - **Correlate with Known Good Software**: Cross-reference identified short name usages with a whitelist of known and trusted software to rule out false positives, specifically focusing on potential software installers known to utilize short names.

  - **Examine Network Activities**: If relevant, assess network logs (e.g., firewall or proxy logs) to see if there are anomalous connections or activities that correspond with the identified process executions. This could help reveal if these activities are part of a larger suspicious operation.

  ### Prioritization
  The medium severity of this alert is justified due to the potential for attackers to leverage short names for evasion tactics, which could lead to successful exploitation or data exfiltration if not addressed promptly. The likelihood of encountering this type of evasion tactic in an enterprise environment is moderate, given the range of applications that may use short names.

  ### Blind Spots and Assumptions
  The detection rule may miss malicious activities that do not use short names at all or may not account for variations in legitimate software processes that could employ short names benignly. It assumes that users will not frequently manipulate files in ways that leverage short names for valid operational purposes, which could lead to noise in the alerting. Additionally, this detection logic requires that process creation events are consistently logged and retained, emphasizing the necessity of appropriate logging configurations on all endpoints.

