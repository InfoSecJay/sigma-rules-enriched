title: Use NTFS Short Name in Image
id: 3ef5605c-9eb9-47b0-9a71-b727e6aa5c3b
related:
- id: dd6b39d9-d9be-4a3b-8fe0-fe3c6a5c1795
  type: similar
status: test
description: Detect use of the Windows 8.3 short name. Which could be used as a 
  method to avoid Image based detection
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/jonasLyk/status/1555914501802921984
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-06
modified: 2023-07-20
tags:
- attack.stealth
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '~1.bat'
    - '~1.dll'
    - '~1.exe'
    - '~1.hta'
    - '~1.js'
    - '~1.msi'
    - '~1.ps1'
    - '~1.tmp'
    - '~1.vbe'
    - '~1.vbs'
    - '~2.bat'
    - '~2.dll'
    - '~2.exe'
    - '~2.hta'
    - '~2.js'
    - '~2.msi'
    - '~2.ps1'
    - '~2.tmp'
    - '~2.vbe'
    - '~2.vbs'
  filter_main_generic_parent:
    ParentImage: 'C:\Windows\explorer.exe'
  filter_optional_webex:
    ParentImage|endswith: '\WebEx\WebexHost.exe'
  filter_optional_thor:
    ParentImage|endswith: '\thor\thor64.exe'
  filter_optional_winzip:
    Image: 'C:\PROGRA~1\WinZip\WZPREL~1.EXE'
  filter_optional_vcred:
    Image|endswith: '\VCREDI~1.EXE'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Software Installers
level: medium
note: |
  ### Technical Context

  This rule detects the use of NTFS short file names (Windows 8.3 format), a technique often used by attackers to obfuscate malicious files and bypass security detections. The likely objective is to evade standard file-based defenses while executing scripts or binaries, which may contain malicious payloads. This behavior is associated with the MITRE ATT&CK technique T1564.004: Hidden Files and Directories. The primary sources of telemetry for this detection include Windows process creation logs, particularly Security Event ID 4688 or Sysmon Event ID 1. If malicious, this behavior can lead to executing undetected malware or scripts, making it critical to investigate. It is important to note that this detection does not confirm that malware is present, only that a potentially obfuscated or suspicious execution attempt has been made.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for the specific process that triggered the alert. Look for short names like `~1.bat`, `~1.exe`, etc.

  - **Identify parent process:** Investigate the parent process of the detected short name execution to verify if it is legitimate. Typical benign parents are `C:\Windows\explorer.exe` or known software installers.

  - **Examine command line arguments:** Analyze the command line of the process to identify any suspicious or unusual arguments that might indicate malicious activity, especially if the command line contains multiple instances of short names.

  - **Look for known benign behavior:** Validate if the execution is linked to legitimate software that may have a history of using short names (e.g., certain installers). Confirm the software's signature and version to rule it out as benign.

  - **Assess for high-confidence malicious activity:** Check for additional indicators of compromise, such as execution of common malware tools or scripts from less reputable sources, particularly if executed from unusual directories or locations.

  - **Log your findings:** Document all indicators reviewed, noting decisions about whether the detected activity maps to a known legitimate use case, thus aiding future investigations.

  ### Prioritization

  This alert has medium severity due to the potential impact of the affected system, particularly if short filenames are indicative of a broader evasion tactic by an adversary. Given that the use of such techniques is common in various malicious activities, including malware execution and lateral movement, prompt analysis is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate software behavior that also uses short names for file execution, potentially triggering false positives. Proper logging of process creation events is essential for this detection to be reliable. Additionally, the alert may miss cases where directories are hidden or manipulated without the use of NTFS short names. A related detection could be monitoring for unusual patterns in script execution (e.g., via PowerShell) that do not leverage short filenames but may indicate similar evasion techniques.

