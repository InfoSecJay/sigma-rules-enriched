title: Use NTFS Short Name in Image
id: 3ef5605c-9eb9-47b0-9a71-b727e6aa5c3b
related:
- id: dd6b39d9-d9be-4a3b-8fe0-fe3c6a5c1795
  type: similar
status: test
description: Detect use of the Windows 8.3 short name. Which could be used as a 
  method to avoid Image based detection
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/jonasLyk/status/1555914501802921984
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-06
modified: 2023-07-20
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '~1.bat'
    - '~1.dll'
    - '~1.exe'
    - '~1.hta'
    - '~1.js'
    - '~1.msi'
    - '~1.ps1'
    - '~1.tmp'
    - '~1.vbe'
    - '~1.vbs'
    - '~2.bat'
    - '~2.dll'
    - '~2.exe'
    - '~2.hta'
    - '~2.js'
    - '~2.msi'
    - '~2.ps1'
    - '~2.tmp'
    - '~2.vbe'
    - '~2.vbs'
  filter_main_generic_parent:
    ParentImage: 'C:\Windows\explorer.exe'
  filter_optional_webex:
    ParentImage|endswith: '\WebEx\WebexHost.exe'
  filter_optional_thor:
    ParentImage|endswith: '\thor\thor64.exe'
  filter_optional_winzip:
    Image: 'C:\PROGRA~1\WinZip\WZPREL~1.EXE'
  filter_optional_vcred:
    Image|endswith: '\VCREDI~1.EXE'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Software Installers
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of files with NTFS short names, commonly represented using the tilde (~) character, indicative of potential evasion tactics employed by adversaries. The likely attacker objective is to bypass image-based detection systems that might not recognize these alternative file names, facilitating malicious activity such as executing scripts or binaries without generating alerts. This detection aligns with the MITRE ATT&CK framework under the **Defense Evasion** tactic (T1564.004).

  The primary telemetry source is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, focusing on the `Image` field. If the behavior is malicious, it may indicate attempts to execute payloads stealthily. Importantly, this detection alone does NOT confirm that an attack is occurring, as legitimate software installers may also use short names.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Investigate Security Event ID 4688 and Sysmon Event ID 1 for recent events displaying image names containing `~1` or `~2`. Analyze image paths for unusual or non-standard executables.

  - **Assess parent process details**: Verify the `ParentImage` field of the detected events. If the parent process is not `C:\Windows\explorer.exe`, `C:\PROGRA~1\WinZip\WZPREL~1.EXE`, or a whitelist process, this could indicate a higher risk of malicious activity.

  - **Identify known good applications**: Compare detected images against a list of legitimate software that may utilize short names, such as installers or backup software. If the detected process is not recognized, flag it for further investigation.

  - **Correlate with user behavior**: Check logs for legitimate user actions in the same timeframe, such as software installation or administrative activities. Look for events that typically accompany legitimate short name use, such as installation events or updates.

  - **Look for high-confidence indicators**: Specifically monitor for any instances of `~1.bat`, `~1.exe`, or files with unusual extensions (e.g., `.ps1`, `.hta`) executed from atypical paths (e.g., temporary directories). These could suggest scripted or malicious execution.

  ---

  ### Prioritization

  The alert is of **medium severity** as it indicates behavior that could represent an underlying attack vector, particularly on critical systems where defense evasion tactics are likely to be weaponized. However, frequent benign occurrences related to software installations can dilute overall threat context.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion tactics, such as legitimate processes being packaged to masquerade under short names. Reliable detection is contingent upon proper log sourcing and configurations for process creation events. Activities such as software installations may regularly trigger this alert. Companion detections could include process injection techniques or abnormal command-line arguments to enhance the overall threat landscape visibility.

