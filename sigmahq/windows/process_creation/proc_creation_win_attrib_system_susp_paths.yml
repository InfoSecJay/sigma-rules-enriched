logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\attrib.exe'
  - OriginalFileName: 'ATTRIB.EXE'
  selection_cli:
    CommandLine|contains: ' +s'
  selection_paths:
    CommandLine|contains:
    - ' %'         # Custom Environment variable
    - '\Users\Public\'
    - '\AppData\Local\'
    - '\ProgramData\'
    - '\Downloads\'
    - '\Windows\Temp\'
  selection_ext:
    CommandLine|contains:
    - '.bat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.ps1'
    - '.vbe'
    - '.vbs'
  filter_optional_installer:
    CommandLine|contains|all:
    - '\Windows\TEMP\'
    - '.exe'
  condition: all of selection* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the `attrib.exe` command with the `+s` (system) attribute option applied to executable and script files located in specific directories, such as user folders and temporary directories. The likely attacker objective is to conceal malicious files from casual view or deletion while using standard user permissions. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" and technique "T1564.001 - Hide Artifacts."

  The primary telemetry source for this alert is Windows process creation logs, specifically focusing on Event ID 4688. If malicious, this behavior could facilitate persistent malware operation by preventing users and security tools from easily detecting or removing unwanted files. Importantly, this detection alone does NOT confirm malicious intent; the use of `attrib.exe` may also occur in benign administrative scenarios.

  ### Investigation Steps

  - **Review process creation events:** Check for Windows Security Event ID 4688 that correlates with `attrib.exe` executions. Verify command line parameters for the presence of `+s` and paths involving `C:\Users\Public\` or `C:\Windows\Temp\`.

  - **Identify high-confidence malicious indicators:** Look for specific file extensions associated with known malicious activity (e.g., `.bat`, `.exe`, `.hta`, `.vbs`) in command line arguments. Compare against threat intelligence sources for any recently reported usage.

  - **Examine the context of usage:** Determine the user and system context that executed the command. Legitimate administrative activity may include setting system files for application functionality; assess whether this matches the user's expected behavior.

  - **Correlate with other log sources:** Validate execution intent by checking application logs and file creation timestamps in targeted directories. Focus on files with creation dates that align with the `attrib.exe` execution timestamp.

  - **Investigate files for suspicious activity:** Use antivirus or EDR solutions to scan and analyze the files altered by `attrib.exe`. Look for signs of compromise, such as unusual file size, unknown publisher signatures, or recent modifications.

  - **Document any findings and context:** Ensure that all observations are logged, particularly any discrepancies or benign explanations regarding the use of `attrib.exe` and the files affected, so that further investigative actions can be taken if required.

  ### Prioritization

  This alert carries high severity due to the potential impact of a compromised system becoming a persistent threat through hidden malware. The ease of abusing the `attrib.exe` command to obscure malicious files makes this behavior a common tactic employed by adversaries to maintain persistence.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate users leveraging `attrib.exe` for benign purposes, such as system administrators managing files. It's crucial to have comprehensive logging enabled for process creation (Windows Event ID 4688) to ensure reliable detection. Furthermore, file hiding techniques can be complemented by additional detections like anomalous file access patterns or unexpected network activity to bolster detection coverage.

