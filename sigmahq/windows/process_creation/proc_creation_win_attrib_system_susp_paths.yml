author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-28
modified: 2023-03-14
tags:
- attack.defense-evasion
- attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\attrib.exe'
  - OriginalFileName: 'ATTRIB.EXE'
  selection_cli:
    CommandLine|contains: ' +s'
  selection_paths:
    CommandLine|contains:
    - ' %'         # Custom Environment variable
    - '\Users\Public\'
    - '\AppData\Local\'
    - '\ProgramData\'
    - '\Downloads\'
    - '\Windows\Temp\'
  selection_ext:
    CommandLine|contains:
    - '.bat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.ps1'
    - '.vbe'
    - '.vbs'
  filter_optional_installer:
    CommandLine|contains|all:
    - '\Windows\TEMP\'
    - '.exe'
  condition: all of selection* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the usage of the `attrib.exe` command to alter file attributes, specifically the addition of the "system" flag (`+s`) for potentially malicious files located in sensitive directories. Attackers often employ this technique to conceal their malware from standard user views and common administrative procedures. By marking files as system files, they make it difficult for users or security tools to detect or delete them, thereby maintaining persistence and evading detection.

  The primary threat scenario involves an attacker using malware that has capabilities to create or modify scripts or executables in directories such as `%ProgramData%`, `%AppData%`, and other commonly accessed locations. The likely objective is to install malware while avoiding the notice of security tools and analysts. In the context of the MITRE ATT&CK framework, this behavior aligns with the tactics and techniques for Defense Evasion, specifically T1564.001 (Hide Artifacts).

  Relevant data sources for detection include process creation events from endpoint detection and response (EDR) systems that log when executables are run, capturing command-line arguments and associated paths.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for process creations where `attrib.exe` is utilized, focusing on command line parameters indicating the addition of the `+s` flag, particularly in specified directories.
  - **Analyze Command-Line Arguments**: Investigate the full command-line used during the invocation of `attrib.exe`, noting any presence of suspicious file paths or extensions (e.g., `.exe`, `.dll`, `.bat`).
  - **Correlate with File System Changes**: Check for recent modifications in the filesystem under monitored locations. Look for newly created or altered files with system attributes set and validate their legitimacy.
  - **Investigate Associated Malware Artifacts**: Cross-reference any files found with known malware signatures or behaviors, especially those identified in recent threat intelligence reports regarding known campaigns or malware described in references linked to this detection rule.

  ### Prioritization
  This alert carries a high severity due to the potential risk of malware hiding within critical file pathways, significantly impacting system integrity and security posture. The likelihood of misuse in enterprise environments increases, especially with automated tools often employed to execute such commands.

  ### Blind Spots and Assumptions
  Detection may be limited if logging for process creation events is not enabled or if file system access is restricted in a way that prevents visibility into changes made by `attrib.exe`. The detection logic assumes that suspicious files will be processed by `attrib.exe` in typical locations without benign justification. It is essential that the environment is configured to capture verbose command-line details, as this is critical for effective alerting and investigation.

