logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\attrib.exe'
  - OriginalFileName: 'ATTRIB.EXE'
  selection_cli:
    CommandLine|contains: ' +s'
  selection_paths:
    CommandLine|contains:
    - ' %'         # Custom Environment variable
    - '\Users\Public\'
    - '\AppData\Local\'
    - '\ProgramData\'
    - '\Downloads\'
    - '\Windows\Temp\'
  selection_ext:
    CommandLine|contains:
    - '.bat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.ps1'
    - '.vbe'
    - '.vbs'
  filter_optional_installer:
    CommandLine|contains|all:
    - '\Windows\TEMP\'
    - '.exe'
  condition: all of selection* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of the `attrib.exe` command with the `+s` option, which is used to set files as system files. This behavior is indicative of potential obfuscation techniques used by malicious actors to hide scripts or executables in directories that are commonly overlooked, rendering them less visible to users and security mechanisms. The likely attacker objective is to ensure persistence and concealment of their artifacts to evade detection upon a system breach.

  This detection relates to the MITRE ATT&CK technique "Hidden files and folders" (T1564.001). The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688, which captures process creations and command line arguments. If malicious, the security impact includes unauthorized access, potential data breaches, or further exploitation leveraging hidden malware. Importantly, this detection does NOT confirm that any file is inherently malicious, nor does it indicate that it is executing successfully.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of `attrib.exe` being executed with parameters including `+s`. Look for anomalies in command line arguments indicating suspicious behavior.

  - **Identify specific utility paths:** Validate whether the execution of `attrib.exe` occurred in atypical paths, such as `\Users\Public\`, `\AppData\Local\`, or `\ProgramData\`, which may indicate malicious behavior.

  - **Analyze file extensions involved:** Focus on command lines that include file extensions such as `.bat`, `.dll`, `.exe`, `.hta`, `.ps1`, `.vbe`, or `.vbs`. Malicious behavior often involves these types of files which may indicate scripting or executable code hiding.

  - **Confirm benign usage scenarios:** Assess historical and recent practices around `attrib.exe` usage in your environment. Legitimate administrative tasks might include setting files for software updates or system maintenance, thus should not trigger alerts in known situations.

  - **Check for high-confidence indicators:** Investigate whether any flagged instance of `attrib.exe` setting files as system files corresponds with other malicious indicators, such as the creation of files in `\Windows\TEMP\` alongside specific executable extensions.

  - **Examine for evidence of file tampering:** Review changes in file attributes for suspicious files, confirming if any recent file modifications correlate with the timing of the detected `attrib.exe` usage. Inspect created or modified timestamps for anomalies that may suggest illegitimate activity.

  ### Prioritization

  This alert carries a high severity level due to the possibility of an adversary employing obfuscation techniques to hide malicious files on critical systems. The likelihood of malicious behavior is elevated given that this tactic is frequently weaponized by attackers aiming to maintain persistent access while avoiding detection.

  ### Blind Spots and Assumptions

  Detection relies heavily on accurate process creation logs, necessitating proper logging configurations to ensure all executions are captured. Common evasion techniques involve running `attrib.exe` within legitimate user sessions or using commonly approved tools, which can mask malicious activity. Expected legitimate use may include setting attributes for device management or administrative activities by IT personnel. A related detection that strengthens coverage could involve monitoring for unusual file creation in the same directories, supplemented by direct file access logs.

