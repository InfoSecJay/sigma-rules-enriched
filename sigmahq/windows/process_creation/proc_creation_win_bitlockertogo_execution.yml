note: |
  ### Technical Context

  This Sigma rule detects the execution of the "BitLockerToGo.EXE" process, which is employed for encryption of removable drives using Microsoft's BitLocker technology. The likely attacker objective behind executing this process is to hide or secure malicious data on portable devices, potentially in an attempt to exfiltrate sensitive information while circumventing alert mechanisms. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1218).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details about the creation of processes on Windows systems. If this behavior is malicious, it could enable an attacker to encrypt stolen data or store malware on removable devices for later exfiltration. Importantly, this detection does NOT confirm that the execution is malicious on its own; legitimate use cases do exist.

  ### Investigation Steps

  - **Review process execution logs:** Check Security Event ID 4688 for entries where the "Image" ends with `\BitLockerToGo.exe`. Cross-reference the user context against known users and their roles. Legitimate use may involve IT personnel or authorized users encrypting portable media.

  - **Examine parent processes:** Investigate the parent processes leading to the execution of BitLockerToGo.EXE using `ProcessId` and `ParentProcessId` fields in Sysmon Event ID 1 logs. Anomalous or unexpected parent processes could indicate malicious usage, such as process hollowing by malware.

  - **Identify network activity:** Review outbound network logs (e.g., firewall or proxy logs) around the same time frame as the execution. Look for unusual connections, especially involving network shares or cloud storage that may indicate data exfiltration attempts.

  - **Check for USB device connections:** Review Windows Event Logs for Event ID 20001 (or similar) related to USB device connections. Assess whether the USB drives were introduced in a manner consistent with organizational policies. Suspicious or unknown devices should be flagged.

  - **Retrieve application usage patterns:** Compare the execution count of BitLockerToGo.EXE against historical usage data. Extremely low usage patterns prior to the incident may suggest malicious intent, especially if closely associated with other alerts.

  ### Prioritization

  This alert has a low severity level as BitLockerToGo.EXE may be legitimately used for encryption of portable drives. However, given its rare use in a typical enterprise environment and its association with stealthy data exfiltration techniques, it warrants investigation. The likelihood of malicious abuse increases if observed alongside other suspicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by the establishment of a baseline for legitimate usage; frequent, authorized usage may dilute the effectiveness of the rule. Additionally, if logging configurations do not capture process creation events or are misconfigured, detection may fail. Legitimate administrative actions, such as encryption activities by IT staff, may trigger this rule. A related detection that strengthens coverage includes monitoring for unusual USB device connections that can be related to process initiation events.

