note: |
  ### Technical Context

  This rule detects the execution of BitLockerToGo.EXE, a Windows tool used for encrypting removable drives. Attackers may leverage this tool for malicious activities such as data exfiltration or through process hollowing techniques for malware execution. The relevant MITRE ATT&CK technique is T1218: Signed Binary Proxy Execution.

  The primary telemetry sources include Windows Security Event ID 4688 (process creation) and Sysmon Event ID 1. If executed maliciously, this behavior could indicate an attempt to exfiltrate data securely or obfuscate unauthorized access to data. It is critical to note that the detection of this process does NOT confirm malicious intent without additional context or corroborating evidence.

  ### Investigation Steps

  - **Check process creation logs for BitLockerToGo.EXE:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for the creation of BitLockerToGo.EXE. Specific fields to evaluate include Process Name and Parent Process ID to identify potential malicious lineage.

  - **Assess the context of execution:** Investigate the execution time and user account associated with this action. Legitimate usage by administrators typically occurs during scheduled maintenance activities or IT support tasks; abnormal times may indicate malicious behavior.

  - **Identify associated network activity:** Examine logs for unusual outbound connections (e.g., Windows Firewall logs) correlating to the timing of BitLockerToGo.EXE execution, specifically looking for data transfers to external IPs.

  - **Correlate with recent USB device usage:** Review Windows Event ID 2102 (removable storage events) to check if a USB device was recently connected. Encrypted drives may indicate an attempt to secure sensitive data before exfiltration.

  - **Review anti-malware triggers:** Check logs from endpoint protection solutions for alerts related to BitLockerToGo.EXE. High-confidence malicious indicators include alerts for known malware signatures linked to this executable, such as those associated with Lumma stealer.

  ### Prioritization

  The alert has low severity due to the potential for both benign and malicious contexts. While the affected systems can have critical data, legitimate administrative use of BitLockerToGo.EXE is not uncommon. However, since the tool is rarely employed, any execution should still be scrutinized.

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker employs other less common methods to encrypt data without triggering this rule. Ensure that logging for process creation and removable storage events is enabled to maintain reliable detection capabilities. Legitimate administrative actions, especially in IT departments, may trigger this alert. Complementary detections include monitoring for unusual file modification access patterns, particularly on sensitive files or folders during the time frame of this alert.

