note: |
  ### Technical Context
  This rule detects the execution of the `BitLockerToGo.EXE` application, which is utilized for encrypting removable storage devices such as USB drives and external hard disks in Windows environments. While this software is legitimate and serves a critical function in data protection, its usage is relatively uncommon in standard operational settings, making any execution noteworthy. Attackers may exploit this legitimate process as a cover for malicious activities, such as using it in conjunction with process hollowing techniques as seen in malware like Lumma Stealer, which aims to manipulate system processes to evade detection.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (TA0005)** and **Process Injection (T1218)**. These categories highlight how adversaries can leverage legitimate applications to obscure their malicious actions from security solutions and threat detection systems. It is essential to monitor the execution of rarely used applications like `BitLockerToGo.EXE` closely due to their potential association with unauthorized encryption activities or data exfiltration attempts.

  The primary data sources that will provide visibility into this activity are **process creation events** logged by Windows Event Log. Monitoring these logs will help identify unexpected executions of the application, enabling timely investigation of potential misuse.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation logs for instances of `BitLockerToGo.EXE`, noting details such as the user account that executed the process and the parent process involved, to determine if the execution is legitimate or suspicious.

  - **Correlate with User Activity:** Cross-reference the execution logs with user activity and system policies to determine if the usage aligns with organizational practices. Investigate any unauthorized attempts to access removable drives.

  - **Investigate Anomalous Behavior:** Look for additional indicators of compromise surrounding the execution, such as unexpected file modifications or abnormal network activity occurring immediately before or after the execution of `BitLockerToGo.EXE`.

  - **Collect Artifact Evidence:** If available, gather forensic artifacts from systems where `BitLockerToGo.EXE` was executed. This includes memory dumps, file metadata for authored files, or any related logs from security tools to establish the context of the execution.

  ### Prioritization
  This alert is considered low severity due to the legitimate use case for `BitLockerToGo.EXE`, but it warrants investigation because unauthorized execution could indicate an attempt to encrypt sensitive data or hide malicious files. The low frequency of this application's usage further emphasizes the need for scrutiny when detected.

  ### Blind Spots and Assumptions
  The detection logic relies on the premise that `BitLockerToGo.EXE` is seldom utilized within the enterprise environment, which may not hold true in every organization, especially those that handle sensitive data frequently. There might be detection gaps related to other legitimate processes that perform encryption functions but are not monitored under this rule. To enable this detection, it is crucial that process creation logging is properly configured on all Windows systems, and adherence to organizational policies for removable media is enforced.

