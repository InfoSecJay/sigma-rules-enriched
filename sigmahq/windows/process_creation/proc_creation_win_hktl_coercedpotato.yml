note: |
  ### Technical Context

  This detection rule identifies the execution of CoercedPotato, a tool often employed for privilege escalation within Windows environments. The primary objective for an attacker utilizing this tool is to gain unauthorized elevated access to system resources, which may lead to further compromise or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic for privilege escalation (T1068) and technique for exploitation of a vulnerability (T1055).

  The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which logs all process creation events, and potentially Sysmon Event ID 1 for more granular visibility. If malicious, the impact on affected systems could be severe, including unauthorized data access, system control, and further intrusion opportunities. It's important to note that this detection does NOT confirm that a compromise has occurred—it only indicates potential usage of a known exploitation tool.

  ### Investigation Steps

  - **Check Security Event Logs for Process Creation:** Review Windows Security Event ID 4688 and filter for process names containing 'CoercedPotato.exe'. Note the user context under which the process ran. Legitimate usage typically does not involve this executable being run by standard user accounts.

  - **Examine Command Line Arguments:** Investigate the command line arguments associated with the executed processes in Event ID 4688. Focus on entries containing '--exploitId'. Legitimate processes usually do not include this pattern.

  - **Analyze Sysmon Logs for Process Activity:** If deployed, review Sysmon Event ID 1 for any processes that reference 'CoercedPotato.exe'. Compare the parent process IDs; malicious instances often have suspicious parent processes, like cmd.exe or PowerShell.

  - **Cross-reference File Hashes:** Verify the image hashes in the security logs against known good signatures. High-confidence malicious indicators include hashes IMPRHASH=A75D7669DB6B2E107A44C4057FF7F7D6 or F91624350E2C678C5DCBE5E1F24E22C9 as part of event logs from Event ID 4688 or Sysmon Event ID 1.

  - **Identify Asset Criticality:** Determine the role of the affected system. A successful CoercedPotato execution on a domain controller poses a higher risk than on a standard workstation, warranting a fast-tracked response.

  ### Prioritization

  This alert is of high severity due to the elevated privileges potentially gained through the execution of CoercedPotato. The likelihood of malicious abuse is significant, as this tool is commonly utilized in real-world attacks for privilege escalation. The prevalence of this behavior in attacks makes rapid identification and response critical.

  ### Blind Spots and Assumptions

  This detection may have limitations against evasion techniques, such as the use of process hollowing or execution from within legitimate software. Comprehensive detection requires Sysmon to be properly configured; without it, visibility may be limited. Legitimate administrative activities and troubleshooting tools could incidentally trigger the alert. A related detection to strengthen coverage would involve monitoring for unexpected process execution within PowerShell or other scripting environments.

