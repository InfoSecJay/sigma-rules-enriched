note: |
  ### Technical Context
  This rule is designed to detect the execution of CoercedPotato, a known privilege escalation tool used by attackers to gain elevated permissions on Windows environments. CoercedPotato exploits vulnerabilities in the Windows authentication protocol to impersonate users, enabling attackers to gain unauthorized access to critical systems and data. The typical attack scenario may involve an adversary who has already compromised a lower-privileged account and seeks to escalate their privileges to perform further malicious actions, such as lateral movement, data exfiltration, or maintaining persistence.

  The relevant MITRE ATT&CK techniques related to this detection include **T1068: Exploitation of Vulnerability** and **T1055: Process Injection**. The execution of CoercedPotato could occur in a variety of contexts within an organization, underscoring the need for vigilant monitoring. To effectively detect this behavior, telemetry from process creation events will be critical, specifically focusing on logs indicating the launching of executables such as `CoercedPotato.exe` with specific command line parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `CoercedPotato.exe` execution. Pay close attention to the command line parameters for signs of exploit attempts (e.g., `--exploitId`).

  - **Examine Security Alerts**: Correlate alerts from security tools to identify any patterns or previous activities associated with accounts that may have triggered the CoercedPotato execution.

  - **Check for Anomalous Behavior**: Investigate any unusual user account activities, such as rapid privilege escalation attempts or access to sensitive resources immediately following the execution of the tool.

  - **Gather Contextual Information**: Collect additional context from both internal and external sources, including device logs, user behavior analytics, and threat intelligence feeds to understand the potential threat landscape associated with CoercedPotato.

  ### Prioritization
  The alert's severity is high due to the critical nature of privilege escalation in enterprise environments. Successful execution of CoercedPotato can lead to unauthorized access and significant data exposure, making it crucial for rapid response and mitigation efforts.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the organization does not log process creation events comprehensively or if endpoint security solutions are not effectively monitoring for executable file activity. The detection logic assumes that the executable is invoked with the specified command line patterns and timestamps are accurately captured. It is essential to ensure that logging for process creation (e.g., Windows Event Log ID 4688) is enabled and appropriately configured to support this rule.

