note: |
  ### Technical Context

  This Sigma rule detects the execution of CoercedPotato, a tool commonly used for privilege escalation on Windows systems. The primary objective of the attacker using this tool is to exploit vulnerabilities in Windows authentication mechanisms, allowing them to gain elevated privileges on the target machine. This activity aligns with the MITRE ATT&CK technique for Process Injection (T1055) and falls within the Defense Evasion (T1070) tactics.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, the use of CoercedPotato could lead to unauthorized access and control over sensitive systems. It is important to note that this detection does NOT confirm successful privilege escalation or malicious intent on its own; it merely indicates the execution of a potentially harmful tool.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 to identify instances of `CoercedPotato.exe` being executed. Look for abnormal parent processes, which could indicate exploitation (e.g., being spawned from a suspicious command shell or other unauthorized processes).

  - **Examine command line arguments:** Analyze the CommandLine field in the logs for any occurrences of `--exploitId`. This would indicate specific exploit vectors being attempted, which can help determine the attack vector and target system.

  - **Verify imphash for known CoercedPotato binaries:** Cross-reference the imphash values in the logs against known hashes (`A75D7669DB6B2E107A44C4057FF7F7D6`, `F91624350E2C678C5DCBE5E1F24E22C9`, `14C81850A079A87E83D50CA41C709A15`). An exact match should raise immediate concern for malicious intent.

  - **Identify legitimate use cases:** Consider whether `CoercedPotato.exe` might be present due to legitimate administrative activities, such as testing or research. Verify roles of the executing user and if they align with expected behavior.

  - **Monitor for extractable artifacts:** Observe filesystem changes in the vicinity of the CoercedPotato execution, such as creation or modification of sensitive files that could indicate successful privilege escalation attempts or data exfiltration.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical infrastructure if successful privilege escalation occurs. The likelihood of abuse is elevated given the tool's association with known attack scenarios. Since CoercedPotato is often weaponized in targeted attacks, swift follow-up is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logging or if local monitoring policies are not correctly configured. Adversaries may use obfuscation techniques to alter command line parameters, making detection more challenging. The alert could also trigger from legitimate administrative tools that utilize similar executable calls without malicious intent. A companion detection to consider is the monitoring of PowerShell logs for suspicious script execution that might prelude or follow the use of CoercedPotato.

