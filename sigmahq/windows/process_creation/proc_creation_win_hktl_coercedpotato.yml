  ### Technical Context

  The Sigma rule detects the execution of CoercedPotato, a tool commonly used for privilege escalation in Windows environments. The likely objective of an attacker using this tool is to gain elevated privileges on a compromised system, enabling further exploitation or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique T1055 (Process Injection) under the tactic of Privilege Escalation.

  The primary telemetry source required for detection is Windows process creation logs, particularly Security Event ID 4688, which captures new process invocations. The security impact of such behavior can be severe as it signifies an attempt to exploit system weaknesses and escalate privileges maliciously. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is necessary to assess the context, such as user behavior or system integrity.

  ---

  ### Investigation Steps

  - **Check for process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances where the image path ends with `\CoercedPotato.exe`. Confirm that the command line includes `--exploitId`.

  - **Identify user context:** Determine the user account under which CoercedPotato was executed. If the account is a service account or a user with administrative privileges, assess whether this aligns with expected usage patterns.

  - **Validate command line arguments:** Look for legitimate usages of privilege escalation tools within the environment. Compare against normal command line usage of expected applications and identify any anomalies.

  - **Cross-reference process hashes:** Match the running instance of CoercedPotato against known good or expected IMPHASH values (`A75D7669DB6B2E107A44C4057FF7F7D6`, `F91624350E2C678C5DCBE5E1F24E22C9`, `14C81850A079A87E83D50CA41C709A15`). Any matches should raise suspicion.

  - **Review system integrity:** Check for additional suspicious activity around the time of execution, such as changes to user privileges or unexpected administration-level actions.

  - **Monitor for lateral movement indicators:** After identifying a malicious instance of CoercedPotato, look for lateral movement activity, such as unreputable remote desktop connections or unusual access to administrative shares, particularly on critical assets.

  ---

  ### Prioritization

  The alert should be prioritized as high severity due to the potential for significant impact if a privileged escalation occurs on sensitive infrastructure. The likelihood of abuse in enterprise environments is heightened, as tools like CoercedPotato present clear pathways for attackers to escalate privileges. Additionally, such behavior is commonly weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise due to obfuscation techniques or the use of alternative execution methods by attackers. Reliable detection requires comprehensive logging configurations, ensuring all relevant process creation events are captured. Legitimate administrative actions or maintenance scripts could potentially trigger this alert. To enhance detection coverage, consider companion detections for lateral movement techniques, such as unusual PowerShell or Windows Remote Management (WinRM) activities.

