note: |
  ### Technical Context

  This rule detects the execution of Fast Reverse Proxy (FRP) applications, specifically `frpc.exe` or `frps.exe`, which are often utilized to bypass NAT or firewall restrictions to expose internal services to the internet. Adversaries may use these tools to establish command and control (C2) channels or to facilitate data exfiltration, allowing access to internal resources from external locations. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1090).

  The primary telemetry source for detection includes process creation events (Windows Event ID 4688 or Sysmon Event ID 1) that capture the execution of the FRP binaries or the use of related configuration files (`frpc.ini`). If malicious, this detection could indicate an exposed service within the network that can be exploited by the attacker. However, this detection alone does not confirm malicious intent, as FRP may be used for legitimate purposes within network configurations.

  ### Investigation Steps

  - **Check for process creation:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for process creation events where the image name ends with `frpc.exe` or `frps.exe`. Confirm whether legitimate IT infrastructure purposes justify this execution.

  - **Analyze command line arguments:** Inspect the command line logs for any occurrences of `frpc.ini` in the CommandLine field. Malicious usage may involve suspicious parameters or connections to unauthorized external IP addresses.

  - **Validate hash values:** Confirm the file hashes against known compromised signatures. Focus on the provided malicious hashes (`MD5=7D9C233B8C9E3F0EA290D2B84593C842`, `SHA1=06DDC9280E1F1810677935A2477012960905942F`, and `SHA256=57B0936B8D336D8E981C169466A15A5FD21A7D5A2C7DAF62D5E142EE860E387C`). Any matches may indicate a high-confidence malicious sample.

  - **Look for unusual network connections:** Cross-reference detected process executions with network traffic logs, checking for outbound connections that coincide with `frpc.exe` execution. Legitimate traffic typically involves known internal services, while external connections may indicate exfiltration attempts.

  - **Examine host role and context:** Assess the criticality of the affected host and its standard operational configurations. Review asset management records to identify if this host is expected to run FRP software, which may indicate benign usage.

  - **Identify co-occurring suspicious activity:** Look for other alerts that coincide with the execution of FRP, such as external IP connections or abnormal user activity patterns. This consolidates findings and helps confirm malicious behavior.

  ### Prioritization

  This alert is considered high priority due to its potential for exposing sensitive internal services and creating avenues for attackers. The likelihood of malicious abuse is significant, as tools like FRP are often weaponized to establish C2 channels and facilitate data exfiltration. Such behaviors can severely impact organizational security posture.

  ### Blind Spots and Assumptions

  Detection may miss executions of FRP under different parameters or evasion techniques like renaming executables or using anomalies in command line syntax. Proper log collection for process execution and command line parameters is essential for reliable detection. Legitimate service exposure via FRP may occur in various IT scenarios, potentially leading to false positives. Companion detections to consider include monitoring for suspicious network activities associated with the same execution context.

