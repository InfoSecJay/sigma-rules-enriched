note: |
  ### Technical Context
  This detection rule is focused on identifying the execution of Fast Reverse Proxy (frp), a tool that enables users to expose local servers behind NAT or firewall configurations to the internet. While frp serves legitimate networking purposes, it can also be exploited by attackers to establish command-and-control channels, potentially allowing unauthorized external access to internal resources. The detection logic monitors for specific process executions, command-line arguments, and hash values associated with frp's executable files.

  Attackers leveraging frp are typically looking to create stealthy communication paths that bypass firewalls, circumventing security controls to maintain persistence or exfiltrate data from compromised environments. This activity falls under the MITRE ATT&CK framework's tactics, specifically "Command and Control" (T1070: Application Layer Protocol) and possibly utilizing other methods to obscure their activities. The primary data sources for this detection are process creation logs on Windows systems, which will record instances of frpc.exe and frps.exe being executed with corresponding command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of frpc.exe or frps.exe being executed. Note the execution context, including user accounts associated with the process to assess whether their behavior aligns with legitimate usage.
  - **Examine Command-Line Arguments**: Analyze command-line parameters to identify any unusual configurations or flags being used, particularly any references to configuration file pathways (e.g., frpc.ini).
  - **Correlate with Network Traffic**: Investigate outgoing network connections associated with the executing processes. Look for unusual ports or external IP addresses that may indicate unauthorized communication with a remote server.
  - **Assess System and User Behavior**: Consider the broader context of the user or system activity leading up to the alert. Review any recent changes in privileges, accesses to sensitive resources, or suspicious authentication attempts.

  ### Prioritization
  This alert is categorized as high severity given the potential impact of unauthorized access facilitated by the frp tool. The likelihood of exploitation in a misconfigured environment is notable; thus, it requires immediate attention from security analysts.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage concerning legitimate uses of frp for business purposes, which may lead to false positives. The detection logic assumes that frp will only run under typical file names and command-line parameters, which could be altered by an attacker. Furthermore, the detection relies on adequate logging configurations; if process creation logging is not enabled or is obscured by other system processes, alerts may be missed.

