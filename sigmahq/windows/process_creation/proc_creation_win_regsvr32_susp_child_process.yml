note: |
  ### Technical Context

  This rule detects potentially suspicious child processes spawned by "regsvr32.exe," a legitimate Windows utility for registering and unregistering COM components. Attackers often misuse this utility to load malicious DLLs, aiming primarily to execute code stealthily. The relevant MITRE ATT&CK technique is "Exploitation for Client Execution" (T1218.010). The primary telemetry sources required for this detection are Windows process creation logs, including Security Event ID 4688 and Sysmon Event ID 1.

  If malicious, the impact could range from unauthorized code execution to full system compromise. However, this detection does **not** confirm that a malicious action has occurred, nor does it indicate intent without further context.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1 detailing "regsvr32.exe" as the ParentImage, noting the spawned child process (e.g., `powershell.exe`).
  - **Inspect command lines:** Analyze command line arguments of the child processes, particularly for `powershell.exe` and `cscript.exe`, looking for unusual flags or suspicious content indicating obfuscation or remote execution.
  - **Identify legitimate usage patterns:** Recognize that legitimate child processes, such as standard system maintenance scripts run by IT, should commonly appear as siblings of "regsvr32.exe." These typically have straightforward command lines.
  - **Check for known malicious indicators:** Look for child images ending with known malicious executables or those commonly abused by attackers (like `powershell.exe` with base64 encoded scripts).
  - **Validate recent changes to the environment:** Investigate recent installations or updates that may correlate with the execution timing of "regsvr32.exe," focusing on evidence of unusual COM component registration.
  - **Evaluate User Rights and Context:** Ensure that the parent process is being executed under a privileged user context that matches potential common attack patterns.

  ### Prioritization

  This alert is high-severity due to the potential impact on sensitive systems and the likelihood of exploitation. The misuse of "regsvr32.exe" is a well-known technique in the attacker arsenal, making this behavior a notable risk in an enterprise environment.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate IT activities that could trigger similar patterns, like system updates employing "regsvr32.exe" with child processes for maintenance tasks. It's vital to ensure logging is correctly configured across the environment, especially for process creation events. Related detections include monitoring for unusual DLL registration activities, which could enhance overall visibility into potential exploitation tactics.

