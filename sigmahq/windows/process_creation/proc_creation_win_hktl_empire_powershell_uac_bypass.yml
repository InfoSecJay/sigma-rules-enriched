note: |
  ### Technical Context
  This rule detects specific methods used by the Empire framework to bypass User Account Control (UAC) on Windows systems employing PowerShell commands. It targets the scenarios where attackers utilize these bypass techniques to escalate privileges on a target system, typically aimed at gaining administrative rights without user consent or knowledge. The likely objectives of such attacks involve installing malware, exfiltrating data, or moving laterally within the network to compromise additional systems.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **T1078: Valid Accounts** – used to maintain access and escalate privileges through legitimate credentials.
  - **T1548.002: Elevation of Privileges via Bypass User Account Control** – focuses specifically on methods to bypass UAC controls in Windows environments.

  The primary data source for this detection is *process creation logs* that capture command line execution details, allowing analysts to identify suspicious execution patterns indicative of UAC bypass attempts.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine Windows process creation logs for instances of PowerShell commands that include the specific flags and command line parameters identified in the detection logic, particularly those related to UAC bypass.

  - **Correlate with User Sessions**: Analyze the context of these process creations against active user sessions to determine if a known and legitimate user initiated these commands or if they appear anomalous.

  - **Investigate Event Logs**: Look into Windows Security event logs and other related logs for additional activities that occurred around the same time, such as failed or successful login attempts or other privilege escalation indicators.

  - **Monitor Subsequent Actions**: If any UAC bypass attempts are confirmed, assess for further actions taken by the process, such as the creation of new accounts, installation of services, or unusual network connections that might indicate further exploitation efforts.

  ### Prioritization
  The alert's severity is critical due to the high impact potential of UAC bypass techniques, which can provide attackers with administrative privileges that enable them to conduct extensive malicious activities within an enterprise environment. Given the likelihood of exploitation through tools like Empire, this detection should be treated with urgency.

  ### Blind Spots and Assumptions
  This detection relies on the presence of detailed process creation logs and may miss attempts where logs are not generated or written over due to log retention policies. The detection logic assumes that the specific command patterns outlined are indicative of malicious activity; variations or new command patterns could bypass detection. Additionally, agents or systems not logging PowerShell executions, or improperly configured logging, may limit the effectiveness of this rule in identifying suspicious behavior.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
