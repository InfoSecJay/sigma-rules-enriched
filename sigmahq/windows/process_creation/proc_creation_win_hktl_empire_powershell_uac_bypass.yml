note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands associated with User Account Control (UAC) bypass techniques, specifically leveraging Empire's capabilities. The likely attacker objective is to escalate privileges or execute malicious commands without proper administrator authentication, which may allow unauthorized system access or lateral movement within the network. This behavior targets the MITRE ATT&CK tactic of Privilege Escalation and the technique T1548.002 (Bypass User Account Control).

  The primary telemetry sources for this detection include Windows Process Creation logs, specifically looking at Security Event ID 4688 and Sysmon Event ID 1. If successful, a malicious actor could gain higher privileges, making it easier to deploy further threats. However, this detection alone does NOT confirm that malicious activity has occurred, as legitimate applications may utilize similar PowerShell commands without nefarious intentions.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 or Sysmon Event ID 1 for any instances of PowerShell executing commands that include `-NoP -NonI -w Hidden` or similar flags. Look for unexpected parent processes to assess legitimacy.

  - **Check command-line activity:** Validate if the command line contains references to registry keys like `HKCU:Software\Microsoft\Windows Update`. Legitimate updates typically won't involve this method; unusual occurrences may indicate malicious intent.

  - **Identify high-confidence malicious indicators:** Look for evidence of lateral movement or persistence through unusual parent processes or execution contexts, where PowerShell triggers from non-standard applications (e.g., not from `powershell.exe` directly).

  - **Analyze host information:** Confirm the role of the affected host, noting its criticality. For example, if the host is a domain controller or has sensitive data, prioritize the investigation.

  - **Compare against baseline behavior:** Gather context on expected enterprise PowerShell use. Legitimate administrative scripts rarely utilize such UAC bypass techniques; deviations may suggest potential compromise.

  - **Inspect for file creation or exfiltration:** Review any recent file modifications or creation events associated with the PowerShell process (e.g., Event ID 4663 for file access) to identify possible malware or data dumping.

  ### Prioritization

  The alert is critical due to the potential for significant impact on system integrity and security. The likelihood of malicious abuse is high, as UAC bypass techniques are often weaponized to facilitate unauthorized access. Systems identified in these alerts should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative scripting that mimics these command structures, potentially leading to false positives. Ensure logs for PowerShell execution are properly configured to capture the necessary details for continued visibility. Additionally, monitoring related detections, such as Process Injection (T1055), may help correlate and confirm established threats stemming from UAC bypass attempts.

