  ---

  ### Technical Context

  This rule detects the use of PowerShell commands that are indicative of attempts to bypass User Account Control (UAC). The likely objective of an attacker using these commands is to execute further malicious code with elevated privileges, facilitating actions such as privilege escalation or persistence on the compromised system. This behavior is associated with the MITRE ATT&CK technique for UAC Bypass (T1548.002) as part of the larger tactic of Defense Evasion.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing command-line arguments that represent these bypass attempts. If malicious, this behavior could lead to unauthorized system changes or data exfiltration, increasing the attack surface significantly. Importantly, the detection of these command-line patterns alone does not confirm that an attack is underway, as they might be invoked by legitimate administrative tasks or scripting activities.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for PowerShell execution. Look for command lines containing `-NoP -NonI -w Hidden -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update)` or `-NoP -NonI -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update);`.

  - **Identify high-confidence malicious indicators:** Look for unexpected PowerShell parent process relationships. For instance, if PowerShell is launched by a non-administrative application without prior administrative execution, categorize it as suspicious.

  - **Establish expected behavior:** Validate whether the PowerShell commands are initiated by known administrative users or legitimate tools (like SCCM or Windows Update). Confirm typical user activities that may call upon regular PowerShell functionalities without UAC bypass.

  - **Assess system impact:** Identify the role of the affected asset. For instance, compromising a Domain Controller is more critical than a standard user workstation, with a wider impact assessment on the network.

  - **Monitor for subsequent activity:** After identifying the PowerShell execution, check for additional actions, such as file creation or alterations in the Windows Update directory or Registry related to unauthorized changes.

  ---

  ### Prioritization

  This alert is classified as critical due to the potential for significant impact on elevated privileges, placing enterprise systems at risk if exploited. The likelihood of malicious use is heightened, as UAC bypass is a common vector in adversarial tactics to escalate privileges within Windows environments.

  ---

  ### Blind Spots and Assumptions

  Detection can be bypassed if attackers employ obfuscation techniques or alternative scripting languages that do not invoke direct PowerShell commands. Ensure Windows audit policies are properly configured to capture process creation events to maintain coverage. Legitimate administrative activities (e.g., Group Policy updates) may occasionally trigger the alert. Consider companion detections for standard PowerShell usage patterns to improve context and reduce false positives, focusing on T1059 (Command and Scripting Interpreter).

