note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands commonly associated with UAC (User Account Control) bypass techniques, specifically leveraging the Windows Update registry to execute scripts in a hidden manner. The likely objective of the attacker is to gain elevated privileges on a compromised system without raising user awareness, often to deploy further malicious payloads or access sensitive information.

  The relevant MITRE ATT&CK tactics are **Defense Evasion (T1563)** and **Privilege Escalation (T1548.002)**. The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, which capture command lines of executed processes. If malicious, the impact is significant as it can lead to full system compromise and unauthorized access to sensitive information. This detection does NOT, on its own, confirm that an adversary has successfully escalated privileges or executed malicious code, as it may also be the result of benign activity.

  ### Investigation Steps

  - **Examine the command line used for execution:** Look at Security Event ID 4688 or Sysmon Event ID 1 for processes that contain `-NoP -NonI -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update)` or similar patterns. A benign action would typically use standard command lines without hidden flags.

  - **Evaluate the parent process:** Review the parent process of any detected PowerShell execution to identify its origin. Legitimate PowerShell usage often originates from trusted applications (like Task Scheduler); abnormal parent processes may signal malicious intent.

  - **Check for process execution timestamps:** Determine if the execution time aligns with any known legitimate maintenance windows or user activity. Unauthorized execution during off-hours may indicate compromise.

  - **Identify sensitive processes running concurrently:** Cross-reference running processes against critical services and applications on the host. If processes associated with high-value targets are present alongside the alerting behavior, it raises suspicion.

  - **Monitor for creation of new files or network activity:** Explore the output logs for file creation events around the time of execution (e.g., detecting new files in user temp directories). Malicious use often aims to stage malware payloads.

  ### Prioritization

  This alert is critical due to the potential for privilege escalation on sensitive systems, which can enable further malicious activity if exploited. Given the established use of these PowerShell commands for UAC bypass, the likelihood of malicious abuse is high.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of obfuscated command lines or legitimate scheduled tasks that may fall outside of detection thresholds. Reliable detection requires comprehensive logging configurations, including Sysmon and enhanced process auditing. Legitimate administrative scripts that attempt to update or configure system settings may trigger this alert. A related detection is the monitoring of changes in the registry that could signify attempts to manipulate UAC settings, which would provide additional context for the detected behavior.

