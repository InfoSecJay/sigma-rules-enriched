title: Registry Manipulation via WMI Stdregprov
id: c453ab7a-1f5c-4716-a3b4-dea8135fb43a
status: experimental
description: |
  Detects the usage of wmic.exe to manipulate Windows registry via the WMI StdRegProv class.
  This behaviour could be potentially suspicious because it uses an alternative method to modify registry keys instead of legitimate registry tools like reg.exe or regedit.exe.
  Attackers specifically choose this technique to evade detection and bypass security monitoring focused on traditional registry modification commands.
references:
- https://www.bitdefender.com/en-us/blog/businessinsights/shrinklocker-decryptor-from-friend-to-foe-and-back-again
- https://trustedsec.com/blog/command-line-underdog-wmic-in-action
- https://trustedsec.com/blog/wmi-for-script-kiddies
author: Daniel Koifman (KoifSec)
date: 2025-07-30
tags:
- attack.persistence
- attack.execution
- attack.defense-evasion
- attack.discovery
- attack.t1047
- attack.t1112
- attack.t1012
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  WMIC  /NameSpace:\\root\default Class StdRegProv Call CreateKey sSubKeyName=""SOFTWARE\Policies\DeleteMe""
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'call'
    - 'stdregprov'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of `wmic.exe` to manipulate the Windows registry through the WMI `StdRegProv` class. Such behavior is unusual and potentially indicative of malicious activity, where an attacker opts for `wmic.exe` as an alternative to traditional tools like `reg.exe` or `regedit.exe`. The use of WMI for registry manipulation can be a tactic utilized by attackers to circumvent security monitoring that focuses on more conventional approaches to registry edits.

  The primary objectives behind manipulating the Windows registry via WMI may include establishing persistence through the modification of startup keys, altering system configurations for evasion, or facilitating further exploitation. Relevant MITRE ATT&CK tactics and techniques include **Persistence (T1547)** and **Defense Evasion (T1145)**, as attackers often leverage such methods to embed themselves deeper within compromised environments while minimizing detection.

  To capture this activity effectively, organizations should focus on telemetry from **process creation events**, particularly those logging command line arguments related to `wmic.exe`. This can include monitoring for specific command patterns that indicate potential misuse of the command within the context of registry manipulation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the logs for instances of `wmic.exe` running, particularly focusing on command line arguments containing 'call' and 'StdRegProv'. Analyze the context of each occurrence to assess legitimacy.
  - **Correlate with Other Security Events**: Look for any accompanying alerts in your SIEM or EDR that might indicate malicious behavior, including unusual user sessions or access patterns that could coincide with the registry manipulation.
  - **Analyze Registry Changes**: Compare recent registry modifications with standard baselines to identify any unauthorized changes. Focus on keys related to persistence and security settings to assess the impact of the detected activity.
  - **Consult User Activity Logs**: Investigate user-level activity surrounding the time of the observed command execution. This may involve examining logs for any unrecognized users or accounts that have executed administrative commands.

  ### Prioritization
  The alert's medium priority reflects the serious implications of potential persistence and evasion tactics linked to registry manipulation. Given the high stakes of maintaining system integrity and security, early detection and analysis can prevent more significant issues down the line.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage if logging configurations do not capture all command line execution or if `wmic.exe` is employed in environments where legitimate administrative activities frequently occur. The detection logic assumes that the analysis of command lines will sufficiently reveal malicious intent, which may not be the case for advanced persistent threats that employ similar tools for legitimate purposes. Additionally, to ensure accurate detection, Windows logging must be configured to capture detailed process creation events effectively.

