logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  WMIC  /NameSpace:\\root\default Class StdRegProv Call CreateKey sSubKeyName=""SOFTWARE\Policies\DeleteMe""
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'call'
    - 'stdregprov'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of `wmic.exe` to manipulate the Windows registry through the WMI StdRegProv class. The likely attacker objective is to modify or create registry keys without drawing attention by using less monitored tools compared to standard methods like `reg.exe` or `regedit.exe`. This behavior aligns with the MITRE ATT&CK techniques for Persistence (T1047), Execution (T1112), and Defense Evasion (T1012). Primary telemetry sources include process creation logs with relevant Event IDs (e.g., Windows Event ID 4688) capturing command line arguments. If malicious, this could provide an attacker with persistence on the host or allow for configuration changes that aid in further exploitation. Notably, this detection does NOT confirm that all `wmic.exe` usage is malicious, as legitimate administrative activities may employ similar commands.

  ### Investigation Steps

  - **Review process creation logs**: Check for Windows Event ID 4688 related to `wmic.exe` execution with command line containing `call` and `stdregprov`. Focus on the creation or modification of specific registry keys indicating potential impersonation of legitimate activity.

  - **Correlate user accounts**: Validate the user account executing the command against any known administrative or system accounts. Legitimate administrative access is common; genuine actions often involve known administrative accounts (e.g., DOMAIN\admin).

  - **Analyze command arguments**: Look closely at the command line arguments for malicious indicators such as unusual registry paths or keys. Example: `sSubKeyName="SOFTWARE\Policies\DeleteMe"` is a strong indicator for further investigation.

  - **Check for related events**: Investigate connections or other events around the same time in the Security Event log (Event ID 4624 for logins, Event ID 4672 for special privileges). Successful logins from anomalous locations (e.g., outside corporate network) may denote compromised credentials.

  - **Look for persistence indicators**: Identify any registry changes made as a result of the command, specifically unauthorized keys in locations like `SOFTWARE\Microsoft\Windows\CurrentVersion\Run`. This could signify persistence efforts on the host.

  - **Monitor for additional anomalous behavior**: Be on the lookout for other signs of malicious activity on the host, such as unexpected process spawning (e.g., from known benign services, Event ID 4688) or outbound network connections.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems if a malicious actor is able to establish persistence. The likelihood of adversaries using this method is moderate, as it's a common method to evade more traditional detection mechanisms, although not universally weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of `wmic.exe`, which can trigger false positives. Ensuring that logs for process creation and command execution are adequately configured is necessary for reliable detection. Additionally, legitimate administrative activities could inadvertently trigger this alert when using scripting or automation tools for registry modifications. A related detection could include monitoring for command-line usage patterns indicative of scripting abuse, which provides complementary coverage against broader WMI exploitation techniques (T1047).

