logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  WMIC  /NameSpace:\\root\default Class StdRegProv Call CreateKey sSubKeyName=""SOFTWARE\Policies\DeleteMe""
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'call'
    - 'stdregprov'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context

  This rule detects the use of `wmic.exe` to manipulate the Windows registry through the WMI StdRegProv class. This behavior indicates an attempt to modify registry keys using a method not typically monitored, enabling potential evasion of standard detection mechanisms that focus on native tools like `reg.exe` or `regedit.exe`. The likely attacker objective is to alter system settings, potentially persisting malicious control, hiding activities, or disabling security mechanisms.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003): Techniques for maintaining access to systems.
  - **Execution** (TA0002): Techniques that allow an attacker to run their code or commands.
  - **Discovery** (TA0007): Techniques used for gathering information about the system or network.
  - **Defense Evasion** (TA0005): Techniques aimed at evading detection and mitigating defenses.

  The primary telemetry source for this detection is Windows process creation event logs (Event ID 4688) that include specific command line arguments associated with `wmic.exe`. If malicious, actions could lead to unauthorized changes to critical system configurations or user environments. Notably, this detection does NOT confirm that malicious activity occurred; it merely indicates that an alternative registry manipulation method was used.

  ### Investigation Steps

  - **Review `wmic.exe` execution context**: Look for Event ID 4688 for `wmic.exe`. Validate whether the command line contains terms like `call` and `stdregprov` to assess if abnormal registry interactions were attempted.

  - **Check user context of the command**: Examine the `SubjectUserName` in the process creation logs. Anomalous activity from non-admin users could indicate malicious intent, whereas expected administrative user activity may be benign.

  - **Analyze registry changes**: Monitor Windows Registry for any changes associated with the subkeys that were potentially altered, particularly under `HKEY_LOCAL_MACHINE` or `HKEY_CURRENT_USER`. Compare the timestamps with the execution time of the `wmic.exe`.

  - **Identify associated processes**: Correlate the behavior with other processes spawned before or after the incident. Look for any unusual processes that may indicate a follow-up action or other malicious activity (e.g., Event ID 4688 for potential child processes).

  - **Check for known evasion attempts**: Investigate historical logs for similar usage of WMI and `wmic.exe` in the environment. If such usage deviates from established baselines, it strengthens the case for malicious action.

  - **Validate legitimate usage**: Identify known administrative scripts and processes that utilize `wmic.exe` for legitimate purposes. Examples may include automated management tasks in enterprise environments; document their use cases to aid in differentiating benign from malicious activities.

  ### Prioritization

  This alert is considered medium severity because the potential for system compromise through unauthorized registry manipulation exists. The likelihood of this behavior being abused is moderate, as attackers may leverage `wmic.exe` to conduct stealthy modifications. Though not common as a standalone tactic, this method can assist in broader exploitation efforts.

  ### Blind Spots and Assumptions

  One limitation is that attackers may employ obfuscation techniques or variations that could evade this detection, such as renaming `wmic.exe` or using other scripting languages. Successful detection relies on having appropriate logging configurations in place, especially for process creation. Moreover, legitimate administrative activities, such as system housekeeping or configuration management using WMI, may also trigger this alert. A companion detection to strengthen coverage would be to monitor for scheduled tasks or scripts that invoke `wmic.exe` in a usual administrative context.

