  product: windows
detection:
  selection_img:     # Example command simulated:  WMIC  /NameSpace:\\root\default Class StdRegProv Call CreateKey sSubKeyName=""SOFTWARE\Policies\DeleteMe""
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'call'
    - 'stdregprov'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the usage of `wmic.exe` to manipulate Windows registry settings via the WMI `StdRegProv` class. Attackers may utilize this method to evade detection from traditional registry manipulation tools such as `reg.exe` or `regedit.exe`, aiming to persist malware or change system configurations without raising alarms. This behavior aligns with the MITRE ATT&CK techniques for Persistence (T1547), Execution (T1059), and Defense Evasion (T1218).

  The primary telemetry source is process creation logs from Windows, capturing specific command-line arguments used with `wmic.exe`. If malicious, this behavior can lead to unauthorized changes to system settings or registry keys, undermining system integrity. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative tasks might also invoke `wmic.exe`.

  ---

  ### Investigation Steps

  - **Identify the executing command:** Review Security Event ID 4688 to find the command line for `wmic.exe`. Look for instances where the command line contains “call” and “StdRegProv” to identify potential malicious activity.

  - **Check the user context:** Validate the user account executing the command. Compare against known administrative accounts; anomalies suggest potential compromise. Legitimate administrative tasks will often involve system administrators or specific service accounts.

  - **Assess modified registry keys:** Use `reg query` to inspect the relevant registry keys mentioned in the command (`SOFTWARE\Policies\DeleteMe`). Monitor for recent changes to verify legitimacy or malicious behavior.

  - **Examine Windows Event Logs:** Review System and Security Event Logs for associated event IDs (e.g., 4657 for changes to registry keys) around the time the `wmic.exe` command was executed. This will help in establishing a timeline of changes.

  - **Investigate associated processes:** Check for any unusual child processes spawned by `wmic.exe` using Sysmon Event ID 1. Legitimate usage typically does not involve complex chains of execution or the spawning of additional processes.

  - **Review application and network logs:** Monitor for any outbound connections or interactions with unusual applications around the same time. Use network logs to identify any exfiltration attempts related to the registry modification.

  ---

  ### Prioritization

  This alert should be considered of medium severity due to the potential for significant impact on system stability and security if the modifications are part of an unauthorized persistence mechanism. The likelihood of exploitation is moderate, as attackers frequently employ alternate command-line tools to manipulate the registry in an evasive manner.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use other tools or scripts to manipulate the registry in similarly stealthy manners, potentially leading to false negatives. The effectiveness relies on the presence of process creation logs; if logging settings are misconfigured or logs are missing, legitimate activities could be overlooked. Additionally, legitimate administrators performing automated tasks via scripts may trigger the alert, necessitating contextual analysis. A related detection worth considering is monitoring for unusual WMI queries under the `T1047` technique for comprehensive coverage.

