note: |
  ### Technical Context

  This Sigma rule detects the usage of `wmic.exe` to modify the Windows registry utilizing the WMI StdRegProv class, specifically through methods such as CreateKey, DeleteKey, and SetStringValue. The likely attacker objective is to manipulate registry settings for persistence or to evade detection, as these actions may remain unnoticed by traditional monitoring tools that focus on `reg.exe` or `regedit.exe`. Relevant MITRE ATT&CK tactics include Execution (T1047) and Persistence (T1112). The primary telemetry sources include process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1 that capture `wmic.exe` execution and command-line usage.

  If such manipulation is malicious, it could lead to persistence methods that allow continued access to the compromised system, potentially altering its configuration for further exploitation. However, this detection does NOT confirm malicious intent on its own; legitimate administrative activities could use similar methods for valid purposes.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances where `wmic.exe` is executed. Look for unusual command lines invoking StdRegProv functions such as CreateKey or DeleteKey. Legitimate use will typically involve standard administrative or system maintenance tasks.

  - **Analyze command-line parameters:** Specifically examine the CommandLine field for the presence of `stdregprov` and registry alteration commands (e.g., CreateKey, SetStringValue). A high-confidence malicious indicator is the sequential use of multiple registry modification calls without proper administrative context.

  - **Investigate parent processes:** Identify the parent process of `wmic.exe` execution to determine its legitimacy. Common administrative processes (e.g., `powershell.exe`, `cmd.exe`) can indicate benign usage, while unknown or unexpected parent processes may suggest malicious intent.

  - **Check for recent registry modifications:** Validate altered registry keys using tools like `reg.exe` or reviewing the Registry logs. Investigate whether the modifications align with known malicious behavior or if they are part of an authorized configuration change.

  - **Correlate with user activity logs:** Review user activity logs to determine if the user associated with the `wmic.exe` execution was performing legitimate administrative actions or if there were signs of unauthorized access.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact if registry modifications are exploited for persistence or evasion. While the likelihood of malicious abuse exists, it is essential to note that this method can also be used in legitimate administrative contexts, making careful investigation critical. The behavior detected is commonly weaponized in sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection limitations exist as attackers could obfuscate commands or use alternative methods to modify the registry that would not trigger this rule. Reliable detection requires configuration of Windows process creation logs (Event ID 4688 or Sysmon Event ID 1), ensuring logging is enabled. Legitimate administrative scripts that use `wmic.exe` for registry modifications may trigger the alert. A related detection would be monitoring unauthorized registry reads (e.g., Registry Enumeration via WMI StdRegProv) to enhance coverage and context surrounding potentially malicious activities.

