note: |
  ### Technical Context

  This Sigma rule detects the execution of Process Hacker, a tool commonly used for viewing and manipulating system processes. Attackers leverage Process Hacker, particularly older vulnerable versions, to interact with processes in a way that can aid in privilege escalation and evasion of detection mechanisms. The relevant MITRE ATT&CK tactics are **Defense Evasion (T1564)** and **Discovery (T1123)**, reflecting the tool's ability to manipulate system operations stealthily.

  The primary telemetry source is Windows process creation logs, specifically from Sysmon (Event ID 1) or Security Event ID 4688. If the alert denotes malicious activity, it indicates potential unauthorized access attempts or modifications to critical system functions. However, this detection alone does not confirm malicious intent, as Process Hacker can be used legitimately by system administrators for troubleshooting and maintenance tasks.

  ### Investigation Steps

  - **Identify the process origin:** Verify the execution path of `ProcessHacker.exe` in the logs (Sysmon Event ID 1 and Security Event ID 4688). Normal instances typically originate from `C:\Program Files\Process Hacker\` or user profiles rather than system directories.

  - **Check the file hash values:** Match the executed file's hash against known good hashes (e.g., MD5 and SHA family from the rule). Hashes such as `MD5=68F9B52895F4D34E74112F3129B3B00D` and `SHA256=D4A0FE56316A2C45B9BA9AC1005363309A3EDC7ACF9E4DF64D326A0FF273E80F` should be flagged as potentially malicious if seen on endpoints not intended for legitimate administrative use.

  - **Review parent process ID:** Look at the parent process from the logs (Security Event ID 4688 or Sysmon Event ID 1) to determine if Process Hacker was spawned by a legitimate process (e.g., a user-initiated application) or a suspicious one (such as `cmd.exe` or `powershell.exe`).

  - **Examine associated network activity:** Check for outbound connections in your network logs around the same time as the execution to detect any data exfiltration attempts or command and control (C2) communications.

  - **Assess user context:** Identify the user account initiating Process Hacker. Determine if the user has administrative permissions and if this behavior is typical for their role.

  - **Flag concurrent events:** Investigate other events, such as changes in critical configuration files or administrative actions performed around the same time, to assess if this execution is part of a broader attack.

  ### Prioritization

  This alert carries medium severity, as the affected systems could serve critical roles within the enterprise environment. While the execution of Process Hacker is often associated with adversarial behavior, there are legitimate administrative use cases; thus, context is essential. The tool is frequently weaponized for privilege escalation and stealthy process manipulation, underscoring its significance.

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate administrative activity, which can trigger the alert without malicious intent. Without proper logging configurations, such as Sysmon or detailed event auditing, detection efficacy may diminish. Additionally, threats could utilize alternative process manipulation tools that are less visible. Complementary detections, such as monitoring for processes interacting with services or registry modifications, can strengthen coverage against misuse.

