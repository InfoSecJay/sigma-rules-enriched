note: |
  ### Technical Context
  This detection rule identifies the execution of Process Hacker, a powerful tool used for viewing and manipulating system processes, often exploited by threat actors to bypass security controls, escalate privileges, and maintain persistence. By monitoring the execution of this specific binary through its metadata, we can detect potential misuse in environments where such tools are not sanctioned.

  Threat actors often leverage tools like Process Hacker to manipulate processes and services, exploit vulnerabilities in system components, and engage in behaviors that fall under the criteria of privilege escalation, defense evasion, and reconnaissance. This activity might be indicative of more complex attack scenarios, such as lateral movement or persistence strategies following an initial compromise.

  The relevant MITRE ATT&CK techniques for this detection include:
  - **T1543**: Create or Modify System Process
  - **T1564**: Hide Artifacts
  - **T1622**: Impair Defense
  Additionally, the overarching tactics of **Defense Evasion** and **Privilege Escalation** apply here. Primary data sources to consider for further investigation include process creation event logs, file access logs, and security logs from endpoint detection solutions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate recent entries in process creation logs for executions of Process Hacker, focusing on user accounts and descriptions to determine legitimacy.
  - **Analyze File Metadata**: Collect and analyze file metadata for the executed binary, searching for known hashes and properties that correlate to malicious versions of Process Hacker.
  - **Check User Activity**: Correlate the execution of Process Hacker with user activity logs to identify whether the action aligns with administrative duties or if it appears anomalous.
  - **Investigate System Changes**: Look for any changes or manipulations in system processes or configurations that coincide with the execution of Process Hacker, as these could signal malicious intent.

  ### Prioritization
  This alert is considered medium severity due to Process Hacker's dual nature as both a legitimate administrative tool and a favorite among malicious actors for system manipulation. The likelihood of exploitation in environments with vulnerable systems elevates the importance of thorough investigation.

  ### Blind Spots and Assumptions
  The detection logic may not capture all legitimate use cases of Process Hacker, as it can be employed by system administrators for valid purposes. Additionally, the detection relies heavily on the availability of comprehensive process creation logs. If logging is disabled or if this tool is allowed under certain circumstances without adequate oversight, the effectiveness of this detection could be significantly limited. It’s crucial to ensure that the security posture allows monitoring for this tool while distinguishing between valid and suspicious uses.

