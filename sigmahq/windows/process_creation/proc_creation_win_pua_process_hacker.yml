note: |
  ### Technical Context

  This Sigma rule detects the execution of Process Hacker, a tool often utilized for viewing and manipulating system processes. Attackers employ Process Hacker to obscure malicious activity by directly interfacing with system processes and kernel options, facilitating privilege escalation and persistence. The relevant MITRE ATT&CK techniques include *Process Injection* (T1055) and *Masquerading* (T1036), as the tool can be used to hide the presence of other malicious software.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing detailed information about process executions. If executed with malicious intent, Process Hacker can significantly undermine system integrity by allowing unauthorized access to sensitive processes. This detection alone does NOT confirm malicious intent; legitimate administrators may also use Process Hacker under appropriate circumstances.

  ### Investigation Steps

  - **Check process creation details:** Review Security Event ID 4688 logs for instances where Process Hacker is invoked. Focus on the **New Process Name** field for '\ProcessHacker.exe' or similar patterns. Correlate timestamps with other suspicious activities.

  - **Analyze the command line arguments:** Confirm if the command line used with Process Hacker includes any unusual flags or options that indicate malicious functionality (Event ID 4688, **CommandLine** field). Look for flags typically associated with exploitation or credential dumping.

  - **Identify related process activity:** Examine parent-child process relationships in Sysmon Event ID 1. Malicious use may involve spawning from unexpected parent processes such as **powershell.exe** or **cmd.exe**, indicating potential exploitation patterns.

  - **Correlate with high-confidence malicious indicators:** Check for known hash values of suspicious or older versions of Process Hacker against your endpoint logs (such as MD5 and SHA256 from the rule’s hash list). These hashes can indicate known malicious instances of the software.

  - **Determine user context and asset criticality:** Assess the user account that executed the process. Higher privileging accounts interacting with Process Hacker should be investigated thoroughly, especially on critical assets like domain controllers or sensitive server roles.

  - **Review legitimate use cases:** Document any previously authorized instances of Process Hacker execution. Compare execution timestamps against change control logs or IT requests to validate necessary administrative use.

  ### Prioritization

  The severity of this alert is medium due to the capability of Process Hacker to manipulate sensitive system processes, which could lead to unauthorized privilege escalation or data exfiltration. Given its history of abuse by threat actors, the risk of malicious intent is significant, especially in environments with limited visibility.

  ### Blind Spots and Assumptions

  Detection may have limitations if logs are not configured to capture all relevant process creation events, as missing Security Event ID 4688 or Sysmon Event ID 1 could obscure activity. Additionally, legitimate administrative tasks may trigger this alert, such as troubleshooting or process management by authorized personnel. A companion detection to complement this rule would be monitoring for unusual parent-child process hierarchies, which may indicate lateral movement or suspicious execution patterns.

