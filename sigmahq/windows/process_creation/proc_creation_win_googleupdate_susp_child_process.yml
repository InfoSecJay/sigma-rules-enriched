detection:
  selection:
    ParentImage|endswith: '\GoogleUpdate.exe'
  filter_main_known_legit:
        # Some other legit child process might exist. It's better to make a baseline before running this in production
  - Image|contains: '\Google'       # Example: GoogleUpdate.exe, GoogleCrashHandler.exe, GoogleUpdateComRegisterShell64.exe
  - Image|endswith:
    - '\setup.exe'
    - 'chrome_updater.exe'
    - 'chrome_installer.exe'
  filter_main_image_null:
    Image:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious child processes initiated by `GoogleUpdate.exe`, which is commonly associated with legitimate Google software update processes. However, attackers may exploit this process to run malicious payloads, aiming to compromise systems via stealthy techniques. The relevant MITRE ATT&CK tactic is **Defense Evasion**, specifically technique **T1140: Deobfuscate/Decode Files or Information**.

  The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688. The potential security impact of malicious activity could include unauthorized code execution or installation of malware, providing attackers with persistent access. It is crucial to note that this detection does NOT confirm malicious intent on its own; further investigation is necessary to establish context.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for processes created with `ParentImage` set to `GoogleUpdate.exe`. Look for unexpected child processes which may indicate malicious activity.

  - **Validate legitimate parent-child relationships:** Confirm that child processes such as `chrome_updater.exe` or `chrome_installer.exe` are normal for your environment. Investigate any appearances of `setup.exe` that don't align with expected software installations.

  - **Review process command-line arguments:** Examine the command line of child processes for any suspicious flags or arguments (e.g., obfuscated or encoded parameters) that may indicate malicious behavior. Use Sysinternals tools or Windows Event ID 4688 command-line logging.

  - **Monitor abnormal API calls:** Look for unusual API calls associated with the child processes, particularly those accessing network resources or making file system modifications. This can provide insights on potential data exfiltration attempts.

  - **Identify high-confidence indicators:** Any detection of child processes created with `Image` paths not containing `\Google\` are strongly indicative of potential malicious behavior. Focus analysis on these processes as priority.

  ### Prioritization

  Given that `GoogleUpdate.exe` typically runs on many enterprise systems, alerts generated by this rule should be prioritized based on the criticality of the affected system. The likelihood of abuse is elevated as attackers intentionally use trusted processes to evade detection, making this behavior concerning and warranting immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using legitimate Google processes to run their payloads, meaning false negatives are possible. It relies on complete and accurate logging for process creation events; if these logs are not configured correctly or are disabled, the detection may be ineffective. Legitimate software updates for Google applications can trigger this alert, potentially causing false positives. A related detection to consider is monitoring for unusual network connections made by these child processes, which strengthens overall detection coverage.

