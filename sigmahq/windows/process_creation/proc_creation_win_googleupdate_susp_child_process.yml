logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\GoogleUpdate.exe'
  filter_main_known_legit:
        # Some other legit child process might exist. It's better to make a baseline before running this in production
  - Image|contains: '\Google'       # Example: GoogleUpdate.exe, GoogleCrashHandler.exe, GoogleUpdateComRegisterShell64.exe
  - Image|endswith:
    - '\setup.exe'
    - 'chrome_updater.exe'
    - 'chrome_installer.exe'
  filter_main_image_null:
    Image:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious child processes that are spawned by "GoogleUpdate.exe". The rule is important because attackers may leverage legitimate processes as a method of evasion, allowing them to execute malicious commands or binaries while appearing benign. This can lead to unauthorized access and data exfiltration, often with the objective of maintaining persistence on a compromised system while avoiding traditional detection mechanisms.

  Relevant MITRE ATT&CK techniques include:
  - **T1070.001** - Indicator Removal on Host: File Deletion
  - **T1203** - Exploitation for Client Execution
  - **T1548.002** - Abuse Elevation Control Mechanism: Bypass User Access Control

  The primary data sources that will provide evidence for this detection are process creation logs, which detail parent-child relationships between processes, allowing analysts to observe unusual behavior stemming from legitimate executables.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check logs for process creation events where "GoogleUpdate.exe" is the parent process and examine its child processes for any unauthorized or unusual executable files and arguments.

  - **Analyze Child Process Behavior:** Inspect the behavior of any identified child processes to determine if they exhibit signs of malicious activity, such as attempts to access sensitive data or system files.

  - **Correlate with Other Endpoint Data:** Cross-reference findings with other telemetry sources, such as EDR logs or network traffic data, to identify any related suspicious activities or known indicators of compromise.

  - **Establish a Change Baseline:** Create a baseline of legitimate child processes to differentiate between normal and suspicious activity; this may involve documenting known good child processes and their typical behaviors under various scenarios.

  ### Prioritization
  Due to the potential for bypassing security measures and the risk associated with executing malicious payloads under the guise of a trusted process, this alert is classified as high severity in an enterprise environment. The use of a legitimate process can significantly increase the likelihood of compromise going undetected.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage related to variations in process names or specific child processes that could similarly evade detection. The rule assumes that "GoogleUpdate.exe" will always function as a legitimate parent process and that malicious actors will not employ other equally innocuous processes. Required logs for optimal detection include comprehensive process creation logs; if these logs are not properly configured or if the system is using software that alters standard process behavior, the detection may fail to trigger.

