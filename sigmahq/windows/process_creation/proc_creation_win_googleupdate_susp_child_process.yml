logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\GoogleUpdate.exe'
  filter_main_known_legit:
        # Some other legit child process might exist. It's better to make a baseline before running this in production
  - Image|contains: '\Google'       # Example: GoogleUpdate.exe, GoogleCrashHandler.exe, GoogleUpdateComRegisterShell64.exe
  - Image|endswith:
    - '\setup.exe'
    - 'chrome_updater.exe'
    - 'chrome_installer.exe'
  filter_main_image_null:
    Image:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potentially suspicious child processes launched by "GoogleUpdate.exe," frequently used in malware scenarios to execute malicious payloads. The likely attacker objective is to abuse the legitimate Google Update process to bypass security controls and run unauthorized executables. This behavior aligns with the MITRE ATT&CK technique for Process Injection (T1055) and Defense Evasion (T1218).

  Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1, which capture process creation events with relevant command line parameters. If malicious, this can lead to system compromise or data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation is required to determine intent and context.

  ### Investigation Steps

  - **Identify the parent process:** Examine the Security Event ID 4688 and Sysmon Event ID 1 logs for processes with "ParentImage" equal to "GoogleUpdate.exe." This indicates a potential misuse of the Google Update process.

  - **Review child processes for legitimacy:** Check the "Image" field for known legitimate child processes like "chrome_installer.exe" or "chrome_updater.exe." If one of these legitimate images is running, consider it benign activity.

  - **Assess command line arguments:** Check for suspicious command line parameters in the "CommandLine" field of Event ID 4688. Malicious commands or unusual arguments can indicate abnormal behavior, even if the child process is legitimate.

  - **Analyze historical behavior of the parent process:** Compare past logs for "GoogleUpdate.exe" to establish a behavioral baseline. Regular occurrences of similar child processes may indicate legitimate activity; anomalous increases warrant deeper investigation.

  - **Inspect for high-confidence indicators of compromise:** Search the process tree for any suspicious executable names that do not match known Google products, paying particular attention to names like "setup.exe" that can be easily abused.

  ### Prioritization

  This alert should be considered high priority due to the potential for malicious use of a trusted process (GoogleUpdate.exe) to execute unauthorized code. The likelihood of abuse is significant, as malware frequently leverages legitimate processes to evade detection. This tactic is commonly weaponized, particularly in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper logging configurations; ensure Sysmon and Windows security logs are enabled for comprehensive visibility. Attackers may use process hollowing techniques to bypass detection, and legitimate software updates or configurations could trigger the alert. A related detection, such as monitoring for abnormal parent-child process relationships (e.g., arbitrary executables spawned by "svchost.exe"), can provide stronger coverage against process abuse tactics.

