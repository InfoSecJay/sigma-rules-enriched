note: |
  ### Technical Context

  This Sigma rule detects suspicious executions of the `Invoke-WebRequest` PowerShell cmdlet where the output file is directed to potentially malicious locations such as `%AppData%`, `%Temp%`, or `%Public%`. Such behavior suggests that an attacker might be attempting to download malicious payloads or scripts to execute on the compromised system. The likely objective is to establish persistence or facilitate further exploitation through file downloads.

  This behavior corresponds to the MITRE ATT&CK tactic “Command and Control” (TA0011) and specifically to technique “Application Layer Protocol” (T1105). The primary telemetry source is Windows process creation events, particularly those logged as Security Event ID 4688 or Sysmon Event ID 1. If confirmed malicious, this activity could lead to malware execution or unauthorized access. However, this detection does NOT confirm the execution of malicious code on its own; it merely identifies a potentially suspicious activity pattern.

  ### Investigation Steps

  - **Validate the telemetry source:** Check Security Event ID 4688 or Sysmon Event ID 1 for the `CommandLine` field to confirm the execution of PowerShell commands involving `Invoke-WebRequest`, `curl`, or `wget`.

  - **Examine output location:** Look for downloaded files in suspicious directories like `%AppData%`, `%Temp%`, and `%Public%`. Files here may indicate malicious intent, especially if they are executable scripts or binaries.

  - **Identify high-confidence malicious indicators:** Look for command lines that include flags such as `-ur` or `-o` in conjunction with downloads to unusual locations, as they are often associated with malicious payload delivery.

  - **Assess legitimate use cases:** Cross-reference the `Invoke-WebRequest` execution with known scheduled tasks or administrative scripts that utilize PowerShell for legitimate administrative purposes. Ensure they execute in expected contexts.

  - **Correlate with companion detections:** Identify any processes initiated from known malicious parent processes (use Event ID 4688's `ParentProcessId` field) to link this activity to other potential stages of compromise.

  - **Check for persistence mechanisms:** Review the execution context to see if scripts downloaded from `Invoke-WebRequest` are subsequently scheduled to run or executed directly after download, which could imply establishment of persistence.

  ### Prioritization

  This alert is considered high severity due to the critical impact of the affected systems, as PowerShell is a commonly used tool by attackers for execution of malware. The likelihood of malicious abuse is significant, particularly given the prevalence of weaponized PowerShell commands in modern attacks.

  ### Blind Spots and Assumptions

  There are limitations to detection surrounding obfuscation techniques that attackers might use to bypass this alert, such as using encoded commands. Reliable detection requires proper logging configurations for PowerShell commands and process executions. Legitimate activities that could trigger this alert include routine use of `Invoke-WebRequest` in administrative tasks or automated scripts. A related detection to strengthen coverage is monitoring for abnormal PowerShell script executions or alerts based on file creation events in commonly used directories.

