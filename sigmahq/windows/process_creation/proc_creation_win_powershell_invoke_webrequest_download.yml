logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'powershell_ise.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_commands:
    CommandLine|contains:
            # These are all aliases of Invoke-WebRequest
    - 'curl '
    - 'Invoke-WebRequest'
    - 'iwr '
    - 'wget '
  selection_flags:
    CommandLine|contains:
    - ' -ur'
    - ' -o'
  selection_susp_locations:
    CommandLine|contains:
    - '\AppData\'
    - '\Desktop\'
    - '\Temp\'
    - '\Users\Public\'
    - '%AppData%'
    - '%Public%'
    - '%Temp%'
    - '%tmp%'
    - ':\Windows\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious executions of the Invoke-WebRequest cmdlet, particularly when the output is directed to insecure or atypical file locations, such as AppData or Temp directories. This type of command execution is often associated with downloading or executing malicious payloads, potentially indicative of an attacker exploiting PowerShell’s capabilities to retrieve malware. The act of launching such requests can be part of a larger strategy aimed at establishing a command-and-control (C2) channel, executing remote commands, or downloading additional tools like Cobalt Strike, commonly used in post-exploitation activities.

  The relevant MITRE ATT&CK tactics involved in this scenario include **Command and Control (TA0011)** and **Exploitation for Client Execution (T1203)**, as attackers may leverage PowerShell commands to facilitate exploitation and maintain persistence by downloading malicious files from external sources. The techniques specifically aligned with this rule are **Command-Line Interface (T1059.001)**, which covers the use of PowerShell, and **Remote File Copy (T1105)**, which encompasses the act of transferring files remotely for malicious usage.

  Primary data sources for this detection include **process creation events** that capture the execution of PowerShell commands, alongside their command-line arguments, which provide insight into the exact commands and parameters used, aiding in the identification of potentially harmful actions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances where PowerShell, PowerShell ISE, or pwsh is invoked, paying particular attention to the command-line arguments used during execution.

  - **Examine Suspicious File Outputs**: Check file system locations for unusual downloads, focusing on the directories specified in the detection logic (e.g., AppData, Desktop, Temp), to identify any files that may have been downloaded through the Invoke-WebRequest command.

  - **Correlate with Network Traffic**: Investigate network logs to track external connections initiated by the identified PowerShell commands, looking for unusual outbound traffic to potentially malicious hosts or IP addresses.

  - **Contextualize with User Behavior**: Gather additional context on the user executing the command, reviewing their recent activities to determine if the use of PowerShell for such commands aligns with typical behavior or if it appears anomalous.

  ### Prioritization
  This alert has been assigned a high severity due to the potential impact of downloaded malicious payloads and the likelihood of subsequent actions that could compromise systems or networks. The ability for attackers to establish a foothold through seemingly innocuous PowerShell commands raises significant concerns in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection may have gaps in identifying indirect usages of malicious commands if they occur in more benign contexts or if security measures are bypassed. The logic assumes that malicious PowerShell executions will point to predictable output locations, which may not always be the case if attackers use obfuscation techniques. Additionally, this detection requires comprehensive logging of process creation events, which must be adequately configured on all systems to ensure complete coverage and effectiveness.

