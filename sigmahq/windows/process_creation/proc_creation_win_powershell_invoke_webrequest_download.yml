note: |
  ### Technical Context

  This Sigma rule detects suspicious execution of the Invoke-WebRequest cmdlet (or its aliases such as curl or wget) when the output is directed to commonly abused locations like AppData or Temp. The likely attacker objective is to download and execute malicious payloads, potentially leading to remote code execution or command-and-control (C2) activities. This behavior fits into the MITRE ATT&CK framework under the tactic of Command and Control (TA0011) and specifically the technique of Application Layer Protocol (T1105).

  Primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688, and Sysmon Event ID 1 that capture command line arguments used during process execution. If successfully malicious, this can lead to significant security risks, including unauthorized access and data loss. However, this detection does NOT confirm that the activity is malicious on its own; further investigation is required to understand the context and intent behind the command.

  ### Investigation Steps

  - **Check command-line arguments:** Review Security Event ID 4688 and Sysmon Event ID 1 for any instances of `Invoke-WebRequest`, `curl`, or `wget` targeting suspicious directories, particularly those that include `\AppData\`, `\Temp\`, or `%Public%`. Malicious examples typically contain flags like `-ur` or `-o`.

  - **Analyze user context:** Verify the user account associated with the suspicious command. Determine if the account is an administrative user or operating under suspicious conditions (e.g., executing from an unfamiliar device). Legitimate use might be from well-known system administrators.

  - **Inspect download outputs:** For identified commands, check the specified output file locations for newly created files. Use File Properties to confirm file hashes against known good or bad repositories (e.g., VirusTotal) for any indicators of compromise.

  - **Identify associated parent processes:** In the process creation logs, trace back the parent process for the suspicious command to identify the legitimate or malicious workflow. Typical benign activity might include system utilities but malicious ones may stem from other malicious executables or scripts.

  - **Review endpoint protection logs:** Correlate the detection with EDR alerts for related malicious activity, ensuring that there are no blocks or detections for the downloaded content.

  ### Prioritization

  This alert should be considered high severity due to the potential for remote code execution and the common weaponization of the techniques involved. Systems affected, especially endpoint devices with elevated privileges, pose a greater risk if compromised. The likelihood of exploitation is heightened given the prevalent use of similar tactics in live threat scenarios.

  ### Blind Spots and Assumptions

  Common evasion techniques include legitimate use of the cmdlets for normal administrative tasks, which can result in false positives. The detection relies on accurate logging settings for the process creation events (Event ID 4688 and Sysmon). This alert may also trigger legitimate use cases, particularly in environments where administrative scripts download files regularly. For broader detection, companion rules focusing on downloaded file behaviors and persistence mechanisms should be in place to enhance threat visibility.

