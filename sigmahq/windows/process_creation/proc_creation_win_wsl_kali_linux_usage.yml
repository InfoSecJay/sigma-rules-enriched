title: WSL Kali-Linux Usage
id: 6f1a11aa-4b8a-4b7f-9e13-4d3e4ff0e0d4
status: experimental
description: Detects the use of Kali Linux through Windows Subsystem for Linux
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-10
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_appdata:
  - Image|contains|all:
    - ':\Users\'
    - '\AppData\Local\packages\KaliLinux'
  - Image|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\WindowsApps\kali.exe'
  selection_img_windowsapps:
    Image|contains: ':\Program Files\WindowsApps\KaliLinux.'
    Image|endswith: '\kali.exe'
  selection_kali_wsl_parent:
    ParentImage|endswith:
    - '\wsl.exe'
    - '\wslhost.exe'
  selection_kali_wsl_child:
  - Image|contains:
    - '\kali.exe'
    - '\KaliLinux'
  - CommandLine|contains:
    - 'Kali.exe'
    - 'Kali-linux'
    - 'kalilinux'
  filter_main_install_uninstall:
    CommandLine|contains:
    - ' -i '
    - ' --install '
    - ' --unregister '
  condition: 1 of selection_img_* or all of selection_kali_* and not 1 of 
    filter_main_*
falsepositives:
- Legitimate installation or usage of Kali Linux WSL by administrators or 
  security teams
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Kali Linux via the Windows Subsystem for Linux (WSL) on Windows systems. The likely attacker objective is to leverage Kali Linux tools for penetration testing or malicious activities, such as network reconnaissance or exploitation efforts. This behavior maps to the MITRE ATT&CK technique **Execution: Command-Line Interface** (T1059).

  The primary telemetry sources include Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1. If malicious, this behavior could lead to unauthorized access, data exfiltration, or system compromise. However, this detection does NOT confirm malicious intent without further context; legitimate user activity may resemble the triggered alert.

  ### Investigation Steps

  - **Verify the user account running Kali Linux:** Check Windows Event ID 4672 (Special Privileges Assigned to New Logon) and identify the user account. Legitimate users may include administrators or security teams, but suspicious accounts should be escalated.

  - **Review the command line arguments for kali.exe:** Collect Sysmon Event ID 1 logs to analyze the CommandLine field. Look for common Kali Linux tools (e.g., Nmap, Metasploit) being invoked; these may indicate suspicious activity.

  - **Confirm the parent process for the WSL execution:** Analyze Security Event ID 4688 and ensure the ParentImage is wsl.exe or wslhost.exe. Execution from unexpected parents, particularly those relating to non-administrative processes, should raise concern.

  - **Compare against known good behavior:** Check the history of the user and system through Windows logs for previous instances of legitimate WSL use or Kali Linux installations. Frequent or unusual execution may indicate misuse.

  - **Investigate file creation/exfiltration:** Search for file system activity related to the usage of Kali Linux (Sysmon Event ID 11) to identify unusual write operations or files being created in unexpected directories, such as system-critical paths.

  ### Prioritization

  This alert has a high severity due to the potential impact on sensitive systems if exploited by an attacker. Kali Linux is commonly used in malicious operations, increasing the likelihood of abuse in a business environment.

  ### Blind Spots and Assumptions

  Detection may be limited by users installing legitimate WSL distributions without malicious intent, potentially leading to false positives. Ensure WSL-related logs are enabled and properly configured for accurate detection. Additionally, normal activities could include legitimate tool usage by security teams, which may trigger this alert, highlighting the need for contextual understanding. Companion detections could include alerts for unauthorized user account creation or lateral movement attempts (e.g., T1075 - Pass the Hash).

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
