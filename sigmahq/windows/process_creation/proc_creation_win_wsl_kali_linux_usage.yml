title: WSL Kali-Linux Usage
id: 6f1a11aa-4b8a-4b7f-9e13-4d3e4ff0e0d4
status: experimental
description: Detects the use of Kali Linux through Windows Subsystem for Linux
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-10
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_appdata:
  - Image|contains|all:
    - ':\Users\'
    - '\AppData\Local\packages\KaliLinux'
  - Image|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\WindowsApps\kali.exe'
  selection_img_windowsapps:
    Image|contains: ':\Program Files\WindowsApps\KaliLinux.'
    Image|endswith: '\kali.exe'
  selection_kali_wsl_parent:
    ParentImage|endswith:
    - '\wsl.exe'
    - '\wslhost.exe'
  selection_kali_wsl_child:
  - Image|contains:
    - '\kali.exe'
    - '\KaliLinux'
  - CommandLine|contains:
    - 'Kali.exe'
    - 'Kali-linux'
    - 'kalilinux'
  filter_main_install_uninstall:
    CommandLine|contains:
    - ' -i '
    - ' --install '
    - ' --unregister '
  condition: 1 of selection_img_* or all of selection_kali_* and not 1 of filter_main_*
falsepositives:
- Legitimate installation or usage of Kali Linux WSL by administrators or security
  teams
level: high
note: |
  ### Technical Context
  This detection rule identifies the usage of Kali Linux through the Windows Subsystem for Linux (WSL) on Windows machines. The utilization of Kali Linux, a popular penetration testing distribution, by unauthorized users within an enterprise environment poses significant risks. An attacker may use this tool to execute reconnaissance, exploitation, and other potentially malicious activities that could compromise sensitive data or disrupt operations. Monitoring for this usage is crucial in identifying adversaries attempting to leverage legitimate administrative tools for malicious purposes.

  This detection focuses on potential abuse aligned with the MITRE ATT&CK tactics of **Defense Evasion** (TA0005) and **Execution** (TA0002), particularly involving the use of tools that facilitate lower-level access to the operating system and may remain undetected by traditional monitoring mechanisms. The associated techniques include **T1202 - Command and Scripting Interpreter** and **T1203 - Exploitation for Client Execution**. Evidence of concern can be drawn from process creation events, specifically focusing on logs related to WSL and any activities originating from Kali Linux.

  Primary data sources for effective monitoring include **process creation logs**, which detail the execution of processes along with their command lines and parent processes. Additionally, logs related to WSL usage will offer insight into any suspicious commands or actions taken within this environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of processes initiated from WSL or those containing `kali.exe` in their execution path. Look for unusual command-line arguments that could indicate malicious usage.

  - **Analyze Parent Process Relationships**: Examine the parent processes associated with any identified Kali Linux executions to determine the context of their usage, specifically those that originated from `wsl.exe` or `wslhost.exe`.

  - **Investigate User Account Activity**: Correlate the use of Kali Linux in WSL with user account activities. Verify whether the accounts executing these actions have the proper justification for using such tools, especially focusing on any unauthorized access patterns.

  - **Check for Installation and Configuration Anomalies**: Investigate logs that detail the installation or configuration changes relating to WSL and Kali Linux. Look for unusual patterns or commands indicative of unauthorized installations or modifications.

  ### Prioritization
  This alert is considered high severity in an enterprise environment as the utilization of Kali Linux can facilitate various attack vectors, including privilege escalation and data exfiltration, especially if leveraged by a malicious actor seeking to exploit vulnerabilities unnoticed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios where legitimate administrative users utilize Kali Linux for valid security assessments or testing. The detection logic assumes that any execution of Kali Linux without proper context indicates potential misuse. This rule requires that process creation logs are collected in real-time and sufficiently detailed to include command-line parameters. Additionally, configurations ensuring the appropriate visibility of WSL-related activities must be in place for effective detection.

