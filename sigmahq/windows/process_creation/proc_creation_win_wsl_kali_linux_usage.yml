title: WSL Kali-Linux Usage
id: 6f1a11aa-4b8a-4b7f-9e13-4d3e4ff0e0d4
status: experimental
description: Detects the use of Kali Linux through Windows Subsystem for Linux
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-10
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_appdata:
  - Image|contains|all:
    - ':\Users\'
    - '\AppData\Local\packages\KaliLinux'
  - Image|contains|all:
    - ':\Users\'
    - '\AppData\Local\Microsoft\WindowsApps\kali.exe'
  selection_img_windowsapps:
    Image|contains: ':\Program Files\WindowsApps\KaliLinux.'
    Image|endswith: '\kali.exe'
  selection_kali_wsl_parent:
    ParentImage|endswith:
    - '\wsl.exe'
    - '\wslhost.exe'
  selection_kali_wsl_child:
  - Image|contains:
    - '\kali.exe'
    - '\KaliLinux'
  - CommandLine|contains:
    - 'Kali.exe'
    - 'Kali-linux'
    - 'kalilinux'
  filter_main_install_uninstall:
    CommandLine|contains:
    - ' -i '
    - ' --install '
    - ' --unregister '
  condition: 1 of selection_img_* or all of selection_kali_* and not 1 of 
    filter_main_*
falsepositives:
- Legitimate installation or usage of Kali Linux WSL by administrators or 
  security teams
level: high
note: |
  ### Technical Context

  This detection rule identifies the execution of Kali Linux via Windows Subsystem for Linux (WSL), which may indicate attempts to leverage Kali's penetration testing tools in an environment where such activity is not expected. The likely adversary objective could be data exfiltration, lateral movement, or system exploitation. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), specifically utilizing **Windows Subsystem for Linux** as a means to disguise malicious activities (T1202).

  The primary telemetry sources for this detection include process creation logs from Windows Event ID 4688 or Sysmon Event ID 1, capturing details about executed processes and their command line arguments. If triggered by malicious activity, the security impact could be significant, leading to unauthorized access or compromise of sensitive information. However, this detection does NOT confirm that the activity is malicious on its own; legitimate administrative usage of Kali Linux is possible.

  ### Investigation Steps

  - **Review process creation events:** Analyze Windows Event ID 4688 or Sysmon Event ID 1 for the path and name of the process. Look for the presence of `kali.exe` or subprocesses showing usage from `C:\Windows\System32\wsl.exe`.

  - **Inspect command line parameters:** Check the `CommandLine` field of the identified process for any arguments that deviate from standard usage. Malicious indicators may include unusual execution flags or attempts to run scripts immediately after launch, such as `kali.exe -i <script>`.

  - **Monitor parent child relationships:** Verify the ParentImage field; `wsl.exe` or `wslhost.exe` as a parent of `kali.exe` can confirm a WSL environment. Legitimate usage typically stems from IT or security teams running expected Linux tools.

  - **Check for installation commands:** Look for recorded command line execution that contains the phrases `--install` or `--unregister`, which could indicate an attempt to manipulate the WSL environment rather than legitimate usage.

  - **Correlate with user accounts:** Investigate the user account associated with the process execution. Low-privilege or unusual accounts triggering this behavior may indicate malicious intent, whereas known administrative or security roles using Kali for legitimate testing may be benign.

  - **Identify network activity:** Validate if there are concurrent network connections from the executed `kali.exe` process to external hosts. Querying associated outbound connections may reveal data exfiltration attempts or C2 communications.

  ### Prioritization

  This alert is rated as high severity due to the potential impact on critical systems and the likelihood of abuse by adversaries seeking to exploit tools available in Kali Linux. The behavior is not commonly weaponized in common user activities, indicating a targeted interest that warrants immediate attention.

  ### Blind Spots and Assumptions

  Detection may be limited if WSL is configured to not log certain activities, leading to possible evasion. There may also be legitimate scenarios where administrators might use Kali Linux for testing or educational purposes. A related detection worth considering is monitoring for installation or uninstall events of WSL components, which could indicate prior changes to the environment that facilitate such behaviors.

