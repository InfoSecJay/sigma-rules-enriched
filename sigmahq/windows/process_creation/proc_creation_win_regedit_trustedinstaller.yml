note: |
  ### Technical Context
  This detection rule identifies instances where the Windows Registry Editor (`regedit.exe`) is executed with either 'TrustedInstaller' or 'ProcessHacker' as the parent process. This behavior is suspicious because the TrustedInstaller service is a powerful system component that has elevated privileges, and malicious actors may leverage it to conduct unauthorized changes to the registry or evade security controls. Similarly, ProcessHacker is a legitimate tool often misused for process manipulation, making its association with regedit alarming.

  The primary objective of an attacker utilizing this technique may include escalating privileges, modifying critical registry values to maintain persistence or evade detection systems. This activity aligns with the **MITRE ATT&CK** techniques for defense evasion, specifically **T1548 (Abuse Elevation Control Mechanism)** and is indicative of potential privilege escalation activities.

  To effectively monitor for this behavior, organizations should focus on process creation logs from Windows endpoints, which detail the processes that have been initiated, alongside their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine detailed process creation logs for instances of `regedit.exe` launched by `TrustedInstaller.exe` or `ProcessHacker.exe`. Pay close attention to the command-line arguments to identify unusual patterns.

  - **Correlate with User Activity**: Analyze user activity logs around the time of the detected event to understand if the execution was legitimate or aligned with known usage patterns.

  - **Investigate Registry Changes**: Check the Windows registry for recent changes made around the time of the alert, particularly to critical paths that may indicate tampering or persistence mechanisms.

  - **Evaluate Remote Tools**: Investigate any recent usage of remote management tools or scripts that may have facilitated the use of `ProcessHacker`, potentially revealing a broader compromise or illicit activity.

  ### Prioritization
  Given the potential for significant impact through unauthorized privilege escalation and system manipulation, this alert is classified as high severity. The likelihood of encountering this behavior indicates it warrants prompt investigation to prevent possible exploitation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage lies in environments where logs may not capture all process creation events due to policy misconfigurations or resource constraints. The detection rule assumes that logs from both regedit executions and their parent processes are properly configured and retained. Additionally, if malicious actors use different or less common processes for similar techniques, those instances could evade detection. It is critical for organizations to ensure that process creation logging is enabled and that there are no limitations on capturing parent-child relationships in the logging configuration.

