  ### Technical Context

  This Sigma rule detects when the Windows Registry Editor (regedit.exe) is launched with elevated privileges, specifically under the parent processes of TrustedInstaller.exe or ProcessHacker.exe. The likely attacker objective is privilege escalation, as attackers may use this method to make unauthorized changes to the registry that require administrative rights. This behavior is classified under the MITRE ATT&CK framework as "Privilege Escalation" (TA-1548), specifically associated with the technique of "Abuse Elevation Control Mechanism."

  The primary telemetry source for this activity is process creation logs from Windows, with the essential log types being Security Event ID 4688 or Sysmon Event ID 1. If malicious, this action could allow an attacker to modify important system settings, disable security features, or install persistent malware. It is crucial to note that this detection does not confirm malicious intent on its own; legitimate administrative activities may trigger similar alerts, particularly involving authorized users making changes for valid reasons.

  ### Investigation Steps

  - **Review Process Creation Details:** Examine Security Event ID 4688 or Sysmon Event ID 1 for instances of regedit.exe being spawned. Look for ParentImage field values of either TrustedInstaller.exe or ProcessHacker.exe. Malicious processes often appear anomalous, with unusual time stamps or originating from non-standard directories.

  - **Correlate with User Activity:** Check whether the triggering user account has recently performed administrative tasks. Logins on systems managed by IT typically show related activity; unexpected regedit usage by non-admin users is suspicious.

  - **Identify Unusual Parent Processes:** Investigate the context of the ParentImage processes. If ProcessHacker.exe is associated with a non-administrative user, this raises suspicion. Track the execution paths and hashes of both regedit.exe and the parent processes for verification against known benign outcomes.

  - **Analyze for Registry Modifications:** Review registry logs or Sysmon Event ID 13 (Registry) to confirm if any critical registry keys were modified after the regedit execution. Changes to keys related to system services or security settings indicate potential malicious activity.

  - **Validate Host Integrity:** Check asset criticality; if the affected host is a domain controller or critical application server, escalate the investigation promptly. Look for signs of additional persistence mechanisms employed by the threat actor.

  - **Document Legitimate Scenarios:** Record instances of authorized IT personnel using regedit for system maintenance tasks. Such documentation can assist in refining future alerts and minimizing false positives.

  ### Prioritization

  Given the high level of privilege associated with this behavior and the likelihood of malicious use for privilege escalation, this alert should be treated with high severity. If the affected system is sensitive or critical (e.g., a server handling protected data), immediate investigation is warranted due to the risk of significant security impact.

  ### Blind Spots and Assumptions

  This detection may encounter evasion techniques such as process disguise or modifications that don't utilize regedit directly. Reliable detection requires real-time logging from process creation events, including configurations for Sysmon collection. Additionally, legitimate administrative operations may trigger the alert; thus, context is essential for appropriate triage. A related detection entails monitoring for changes in administrative group memberships or unauthorized alterations to UAC settings, enhancing overall monitoring of potential privilege escalation attempts.

