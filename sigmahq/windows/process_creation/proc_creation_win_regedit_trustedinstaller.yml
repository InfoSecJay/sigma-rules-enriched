note: |
  ### Technical Context

  This Sigma rule detects instances where `regedit.exe` (the Windows Registry Editor) is launched with elevated privileges, specifically as a child process of `TrustedInstaller.exe` or `ProcessHacker.exe`. The likely objective of this behavior is to manipulate system registry keys and values, which can result in privilege escalation or system compromise. Relevant MITRE ATT&CK techniques include Privilege Escalation (T1548).

  Primary telemetry sources include Windows Security Event ID 4688 (process creation events) and Sysmon Event ID 1, which captures detailed execution information. If this behavior is malicious, it could allow an attacker to gain control over critical system configurations or create persistence mechanisms. However, this detection does NOT confirm that the action was malicious; there may be legitimate administrative tasks performed by IT personnel that trigger the rule.

  ### Investigation Steps

  - **Verify process creation logs:** Check for Windows Security Event ID 4688 and Sysmon Event ID 1. Look for `regedit.exe` being spawned by `TrustedInstaller.exe` or `ProcessHacker.exe`. Legitimate administrative tasks may include privileged changes to system settings using `regedit.exe`, usually spawned by trusted processes.

  - **Analyze command line arguments:** Look for command line arguments related to `regedit.exe` under Event ID 4688. Malicious usage might include attempts to modify sensitive registry keys that are generally indicative of system compromise.

  - **Assess parent process legitimacy:** Examine the ParentImage field in the logs. If the parent process is `ProcessHacker.exe`, investigate its use on the system, as this tool is commonly utilized in malicious scenarios for privilege escalation.

  - **Identify the affected registry keys:** Review any changes made to sensitive registry paths (e.g., `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services`). Malicious modifications can often target service configurations to enable persistence.

  - **Conduct asset criticality review:** Determine if the affected system has critical roles (e.g., domain controllers, application servers). Malicious changes here would have a higher impact and may warrant immediate action.

  ### Prioritization

  The alert severity is high due to the potential impact on systems critical for enterprise operations and the likelihood of malicious exploitation in the form of privilege escalation techniques. This behavior is commonly exploited by attackers to gain elevated access to the system.

  ### Blind Spots and Assumptions

  Detection may have limitations if logging configurations are not enabled for all required event IDs (e.g., missing Sysmon logs), potentially leading to gaps in visibility. Legitimate administrative activities or system updates that involve `regedit.exe` might trigger this alert, complicating the investigation. Companion detections related to abnormal use of `ProcessHacker.exe` or other process manipulation tools can strengthen overall threat coverage.

