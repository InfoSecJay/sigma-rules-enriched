title: Suspicious Child Process Of Manage Engine ServiceDesk
id: cea2b7ea-792b-405f-95a1-b903ea06458f
status: test
description: Detects suspicious child processes of the "Manage Engine ServiceDesk
  Plus" Java web service
references:
- https://www.horizon3.ai/manageengine-cve-2022-47966-technical-deep-dive/
- https://github.com/horizon3ai/CVE-2022-47966/blob/3a51c6b72ebbd87392babd955a8fbeaee2090b35/CVE-2022-47966.py
- https://blog.viettelcybersecurity.com/saml-show-stopper/
author: Florian Roth (Nextron Systems)
date: 2023-01-18
modified: 2023-08-29
tags:
- attack.command-and-control
- attack.t1102
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|contains|all:
    - '\ManageEngine\ServiceDesk\'
    - '\java.exe'
    Image|endswith:
    - '\AppVLP.exe'
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\calc.exe'
    - '\certutil.exe'
    - '\cscript.exe'
    - '\curl.exe'
    - '\forfiles.exe'
    - '\mftrace.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\notepad.exe'          # Often used in POCs
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\query.exe'
    - '\reg.exe'
    - '\schtasks.exe'
    - '\scrcons.exe'
    - '\sh.exe'
    - '\systeminfo.exe'
    - '\whoami.exe'          # Often used in POCs
    - '\wmic.exe'
    - '\wscript.exe'
            # - '\hh.exe'
            # - '\regsvr32.exe'
            # - '\rundll32.exe'
            # - '\scriptrunner.exe'
  filter_main_net:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
    CommandLine|contains: ' stop'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate sub processes started by Manage Engine ServiceDesk Pro
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious child processes spawned by the "Manage Engine ServiceDesk Plus" Java web service. The rule specifically flags processes that are commonly used by attackers for execution of malicious payloads or lateral movement, such as `powershell.exe`, `curl.exe`, or `bitsadmin.exe`. An attacker exploiting vulnerabilities, like CVE-2022-47966, in the ManageEngine ServiceDesk application could leverage these child processes to carry out command and control activities or to execute payloads within the system.

  The likely objective of such attacks includes systematic compromise of the organization's infrastructure, exfiltration of sensitive data, or lateral movement to gain higher privileges. This detection ties into the MITRE ATT&CK framework, particularly focusing on the Command and Control tactic (TA0011) and the specific techniques employed, including `Command-Line Interface` (T1059) and `Execution through API` (T1102).

  Primary data sources relevant for this detection are process creation logs, which include important details about parent-child process relationships, as well as command-line argument logs that reveal the exact commands executed by processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation events for the Manage Engine ServiceDesk Plus service and its child processes to identify any unusual or unauthorized executions.

  - **Examine Command-Line Arguments:** Look for suspicious command-line arguments associated with flagged child processes like `curl.exe` or `powershell.exe` which may indicate an exploit attempt or malicious activity.

  - **Correlate with Network Activity:** Investigate any outbound network connections initiated by the suspicious child processes, focusing on communication with known malicious IP addresses or domains.

  - **Check for Abuse of Scheduled Tasks:** Given the potential for attackers to execute commands at scheduled intervals, investigate system task scheduling logs for unusual tasks that may have been created using `schtasks.exe`.

  ### Prioritization
  The alert is marked high severity as suspicious processes originating from a critical IT management tool can indicate a potential compromise. Given the access and controls typically associated with ServiceDesk Plus, this could allow an attacker to manipulate a wide range of systems.

  ### Blind Spots and Assumptions
  A potential blind spot includes environments where process logging is not configured adequately, leading to gaps in visibility. The detection logic assumes that all critical processes are monitored and that such instances are truly malicious, without false positives from legitimate application behavior. Additionally, this alert relies on comprehensive logging from the Windows operating system, particularly focusing on process creation events, which must be enabled to detect the outlined behaviors effectively.

