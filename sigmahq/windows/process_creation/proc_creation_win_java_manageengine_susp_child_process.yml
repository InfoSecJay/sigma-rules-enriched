title: Suspicious Child Process Of Manage Engine ServiceDesk
id: cea2b7ea-792b-405f-95a1-b903ea06458f
status: test
description: Detects suspicious child processes of the "Manage Engine 
  ServiceDesk Plus" Java web service
references:
- https://www.horizon3.ai/manageengine-cve-2022-47966-technical-deep-dive/
- https://github.com/horizon3ai/CVE-2022-47966/blob/3a51c6b72ebbd87392babd955a8fbeaee2090b35/CVE-2022-47966.py
- https://blog.viettelcybersecurity.com/saml-show-stopper/
author: Florian Roth (Nextron Systems)
date: 2023-01-18
modified: 2023-08-29
tags:
- attack.command-and-control
- attack.t1102
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|contains|all:
    - '\ManageEngine\ServiceDesk\'
    - '\java.exe'
    Image|endswith:
    - '\AppVLP.exe'
    - '\bash.exe'
    - '\bitsadmin.exe'
    - '\calc.exe'
    - '\certutil.exe'
    - '\cscript.exe'
    - '\curl.exe'
    - '\forfiles.exe'
    - '\mftrace.exe'
    - '\mshta.exe'
    - '\net.exe'
    - '\net1.exe'
    - '\notepad.exe'          # Often used in POCs
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\query.exe'
    - '\reg.exe'
    - '\schtasks.exe'
    - '\scrcons.exe'
    - '\sh.exe'
    - '\systeminfo.exe'
    - '\whoami.exe'          # Often used in POCs
    - '\wmic.exe'
    - '\wscript.exe'
            # - '\hh.exe'
            # - '\regsvr32.exe'
            # - '\rundll32.exe'
            # - '\scriptrunner.exe'
  filter_main_net:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
    CommandLine|contains: ' stop'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate sub processes started by Manage Engine ServiceDesk Pro
level: high
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious child processes initiated by the Manage Engine ServiceDesk Plus Java web service. Attackers may exploit vulnerabilities in this service to execute arbitrary commands or deploy malware, aiming to establish persistence, exfiltrate data, or compromise further system integrity. This behavior corresponds to the MITRE ATT&CK technique for Command and Control (T1071.001) and process injection (T1055).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing detailed information about process invocations, parent-child relationships, and command-line arguments. If malicious, this could lead to severe security impacts, including data breaches or unauthorized control over system resources. Importantly, this detection does NOT confirm actual compromise without further context or supporting evidence.

  ### Investigation Steps

  - **Review the parent process:** Check event logs for Security Event ID 4688 or Sysmon Event ID 1 where the ParentImage contains "ManageEngine\ServiceDesk" or "java.exe". Verify if the parent process is legitimate by confirming its HASH and file path against known good baselines.

  - **Analyze child process command lines:** Examine the command lines of the detected child processes (like `\powershell.exe`, `\curl.exe`, etc.). Look for suspicious or unusual parameters that deviate from normal operational patterns, which may suggest malicious intent.

  - **Assess for known malicious indicators:** Look for the presence of common filenames or commands usually used in exploitation attempts, such as `calc.exe` or `whoami.exe`, particularly in unexpected environments (e.g., server roles).

  - **Monitor legitimate behavior:** Understand that legitimate usage of ServiceDesk could involve valid child processes. Confirm normal activities related to service operations by reviewing recent change logs or application event logs within Manage Engine.

  - **Investigate network activity:** Cross-reference against network logs for any outbound connections initiated by `net.exe` or other detected binaries, particularly focusing on unusual external IP addresses or domain names that may suggest Command and Control communication.

  ### Prioritization

  The alert carries a high severity level due to the critical role of the Manage Engine ServiceDesk in managing enterprise IT infrastructure and the likelihood that any malicious exploitation could lead to significant data loss or system compromise. The use of specific binaries can indicate a known pattern of abuse, thus heightening the alert's importance for immediate response.

  ### Blind Spots and Assumptions

  Detection may fail in scenarios where logs are missing or where the Manage Engine service is heavily customized, altering process behaviors and command lines. Legitimate administrative actions, such as updates to the service, may inadvertently trigger this alert. For improved detection, ensure that Sysmon is correctly configured to capture detailed process creation logs, and consider companion detections for any suspicious network traffic or known malware signatures associated with the identified binaries.

