title: Unmount Share Via Net.EXE
id: cb7c4a03-2871-43c0-9bbb-18bbdb079896
status: test
description: Detects when when a mounted share is removed. Adversaries may 
  remove share connections that are no longer useful in order to clean up traces
  of their operation
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md
author: oscd.community, @redcanary, Zach Stanford @svch0st
date: 2020-10-08
modified: 2023-02-21
tags:
- attack.defense-evasion
- attack.t1070.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'share'
    - '/delete'
  condition: all of selection*
falsepositives:
- Administrators or Power users may remove their shares via cmd line
level: low
note: |
  ### Technical Context

  This rule detects the unmounting of network shares through the use of the `net.exe` or `net1.exe` commands with the `/delete` parameter. Such behavior may indicate an adversary's attempt to remove traces of unauthorized network access after an operation is complete, which aligns with the objective of maintaining stealth during malicious activities. The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1070.005)**, which focuses explicitly on the removal of artifacts that could hint at prior activities on the system.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID **4688** and Sysmon Event ID **1**, capturing process creation events and associated command line arguments. If an adversary were to successfully execute this command, it could facilitate lateral movement or data theft, thereby impacting network security. However, it's important to note that this detection alone does NOT confirm malicious intent, as legitimate administrators may execute similar commands for routine maintenance.

  ### Investigation Steps

  - **Validate process creation events**: Check for Security Event ID **4688** or Sysmon Event ID **1** for the creation of `net.exe` or `net1.exe`. Focus on the `CommandLine` field for `/delete` and `share` keywords to identify potential misuse.

  - **Assess context of command execution**: Look at the user account executing the command. Legitimate activity typically comes from administrator accounts performing maintenance tasks. Check the `SubjectUserName` and `AccountDomain` fields in the logs.

  - **Correlate to network share activity**: Investigate prior events related to network share creation (e.g., Event ID **5140** in Security logs) to establish if this unmounting is part of a legitimate workflow or indicates an attempt to conceal previous access.

  - **Identify non-standard behavior**: Note any occurrences of this command being run outside of business hours or from unusual geographic locations. Such indicators may signal malicious activity, enhancing the confidence of findings.

  - **Examine for related artifacts**: Look for any file or process artifacts created during share interaction. Investigate for file access or modification events subsequent to the share being mounted/unmounted, particularly around potential exfiltration via other processes.

  ### Prioritization

  This alert should be prioritized as **low** severity in most enterprise contexts, as the likelihood of malicious abuse, while plausible, is relatively low. However, the security impact could be significant if the behavior allows attackers to erase traces of their network activity, necessitating thorough investigation, especially on high-value assets or sensitive systems.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative users may inadvertently trigger this alert during routine operations. Ensure comprehensive log collection from all endpoints to avoid gaps in monitoring. Adversaries may employ alternative methods or legitimate tools for similar unmounting operations to evade detection. A related detection to enhance coverage could involve monitoring for unusual file share access or creation events, assisting in identifying unwanted lateral movement patterns.

