title: Unmount Share Via Net.EXE
id: cb7c4a03-2871-43c0-9bbb-18bbdb079896
status: test
description: Detects when when a mounted share is removed. Adversaries may remove
  share connections that are no longer useful in order to clean up traces of their
  operation
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md
author: oscd.community, @redcanary, Zach Stanford @svch0st
date: 2020-10-08
modified: 2023-02-21
tags:
- attack.defense-evasion
- attack.t1070.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'share'
    - '/delete'
  condition: all of selection*
falsepositives:
- Administrators or Power users may remove their shares via cmd line
level: low
note: |
  ### Technical Context
  This detection rule identifies instances where the Windows command-line utility `net.exe` (or its variant, `net1.exe`) is used to unmount or delete a shared network connection. This activity could indicate an attempt by adversaries to erase traces of their presence within a network environment by removing shared resources that may have been leveraged during their operations. Attackers often seek to maintain low visibility while executing operations, and the removal of unnecessary network shares is a common tactic to clean up after malicious activities.

  The behavior aligns with the MITRE ATT&CK technique T1070.005, which focuses on "Indicator Removal on Host," where adversaries may modify or remove logs and other evidence of their activities. In this scenario, the objective may also involve maintaining persistence and erasing footprints to avoid detection by security monitoring tools or personnel.

  Primary data sources for this detection include process creation events that log commands executed in the environment, which will show when and how `net.exe` or `net1.exe` is invoked. Additionally, network share logs can be examined to identify any anomalous unmounting of shares.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events to identify instances where `net.exe` or `net1.exe` was executed. Pay attention to the timestamp, user account, and command-line arguments used during invocation.

  - **Analyze Command Line Arguments:** Investigate command line arguments within the process logs specifically looking for instances of `share` and `/delete`. This will provide context on whether shares were unmounted and identify the shares involved.

  - **Check Network Share Activity:** Look at the network share logs to determine whether there was a legitimate reasoning for unmounting the shares, such as administrative maintenance. Compare against user activity logs to ensure the actions correlate to expected behavior.

  - **Assess User Account Behavior:** Conduct an analysis of user behavior around the time of the incident to identify any anomalous activities or users executing these commands, especially focusing on accounts without typical administrative rights.

  ### Prioritization
  This alert is marked low in severity; however, it is essential as it could indicate a potential clean-up action by an adversary leveraging network shares for malicious purposes. While the likelihood of false positives exists, given that legitimate administrative users may also perform delete operations, remaining vigilant is crucial.

  ### Blind Spots and Assumptions
  One blind spot in this detection rule is its reliance on the availability of process creation logs, which may not capture all execution contexts (e.g., execution via scheduled tasks or in memory). Additionally, the detection logic assumes that all administrators abide by proper protocols and will not utilize this command for malicious intent. For the alert to function correctly, the logging of process creation events must be properly configured and enabled within the enterprise environment.

