title: Unmount Share Via Net.EXE
id: cb7c4a03-2871-43c0-9bbb-18bbdb079896
status: test
description: Detects when when a mounted share is removed. Adversaries may 
  remove share connections that are no longer useful in order to clean up traces
  of their operation
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.005/T1070.005.md
author: oscd.community, @redcanary, Zach Stanford @svch0st
date: 2020-10-08
modified: 2023-02-21
tags:
- attack.stealth
- attack.t1070.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'share'
    - '/delete'
  condition: all of selection*
falsepositives:
- Administrators or Power users may remove their shares via cmd line
level: low
note: |
  ### Technical Context

  This rule detects the execution of the `net.exe` or `net1.exe` commands specifically related to the removal of mounted shares using the parameters that indicate deletion. Attackers may use this technique to clean up traces of their malicious activities after accessing remote resources. This behavior aligns with the MITRE ATT&CK tactic for stealth, specifically technique **T1070.005: Indicator Removal on Host**. The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID **4688** and Sysmon Event ID **1**, which track command executions.

  If executed by a malicious actor, this behavior can signal an effort to obfuscate their actions and maintain persistence while preventing the discovery of malicious activity. It is important to note that this detection alone does not prove malicious activity; it may also represent legitimate administrative actions by system administrators or automated scripts.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID **4688** and Sysmon Event ID **1** for process creation events involving `net.exe` or `net1.exe` with the command line containing `share` and `/delete`. Confirm the contextual use of the command.

  - **Identify user context**: Establish who executed the command by checking the `SubjectUserName` and `SubjectDomainName` fields in the event logs. A legitimate admin user might indicate normal activity, whereas anomalous accounts could signal potential abuse.

  - **Assess command-line arguments**: Look for specific command line arguments in the logs to confirm evidence of malicious intent, such as `cmd.exe /c net share <share_name> /delete`. The presence of actions that do not pertain to documented administrative tasks indicates possible malicious exploitation.

  - **Validate legitimate share usage**: Review the expected share connections on the host using the `net share` command. Check if the share being deleted was indeed established before and if it corresponds with documented administrative activities or business functions.

  - **Monitor for related artifacts**: Validate the absence of anomalies in file system activity, particularly around share files or configurations in relevant directories. Also, ensure no unexpected file creations or deletions correlate with the execution event.

  - **Examine user behavior patterns**: Look for recent activity involving unusual or suspicious access patterns to the shares prior to the removal command. Follow up on any odd timelines or sequences that diverge from regular operational behavior.

  ### Prioritization

  The alert is considered low severity due to its potential for benign administrative actions but should be investigated due to the risk of adversarial behavior aimed at obscuring data access. If the affected system handles sensitive data or critical infrastructure, the likelihood of malicious activity increases, warranting further examination.

  ### Blind Spots and Assumptions

  Detection may be limited by the misconfiguration of logging settings, resulting in inability to capture all relevant command executions. Legitimate administrative actions can often trigger this alert, especially in environments where network shares are routinely managed. It is recommended to monitor related detections, such as **T1070.001 - File and Directory Permissions Modification**, to provide additional context around the actions taken on the shares and validate the nature of the changes made.

