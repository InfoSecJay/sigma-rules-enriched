title: Start Windows Service Via Net.EXE
id: 2a072a96-a086-49fa-bcb5-15cc5a619093
status: test
description: Detects the usage of the "net.exe" command to start a service using
  the "start" flag
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1569.002/T1569.002.md
author: Timur Zinniatullin, Daniil Yugoslavskiy, oscd.community
date: 2019-10-21
modified: 2023-03-05
tags:
- attack.execution
- attack.t1569.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains: ' start '         # space character after the 'start' keyword indicates that a service name follows, in contrast to `net start` discovery expression
  condition: all of selection_*
falsepositives:
- Legitimate administrator or user executes a service for legitimate reasons.
level: low
note: |
  ### Technical Context

  This detection captures the invocation of the `net.exe` command with the "start" flag, indicating an attempt to start a Windows service. The likely attacker objective is to initiate a service that may facilitate further actions such as persistence, privilege escalation, or lateral movement. This behavior corresponds to the MITRE ATT&CK framework, specifically under the tactic of Execution and the technique T1569.002 (Service Execution). The primary telemetry sources involved include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1.

  If malicious, the security impact can be significant, as attackers commonly use services to maintain persistence and evade detection. This detection does NOT confirm that the activity is malicious on its own, as legitimate administrative actions may also trigger the alert.

  ### Investigation Steps

  - **Check process creation events:** Analyze Windows Security Event ID 4688 and Sysmon Event ID 1 to gather context on the execution of `net.exe`, focusing on the CommandLine field for parameters used. Look for unusual locations or parameters that do not align with standard administrative practices.

  - **Identify the service name:** Validate the service name being started within the CommandLine. If the service initiated is a known or system service such as "wuauserv" (Windows Update) or any critical service, further investigation may be warranted. Malicious activity often involves starting non-standard services.

  - **Review user context:** Cross-reference the Username field in the process creation logs with organizational user roles. If the command was executed by non-administrative accounts or in unexpected user contexts, this raises the likelihood of an attack.

  - **Evaluate historical activity:** Investigate recent changes to the service associated with the alert. Look for unusual service configurations (e.g., services set to start automatically without prior evidence of user-triggered actions) using tools like `Get-Service` in PowerShell.

  - **Monitor related network activity:** Look for outbound connections or API calls that coincide with the time of service start, which may indicate communication with a command and control (C2) server.

  - **Document legitimate usage:** Determine if similar commands have been executed by valid administrative users previously, establishing a baseline of normal operations to differentiate between benign and malicious activities.

  ### Prioritization

  This alert is categorized as low severity primarily due to the potential for legitimate administrative use. However, the risk of unauthorized service execution by attackers makes it relevant for further scrutiny, particularly when unusual user or service behavior is observed.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of alternative methods for starting services, such as PowerShell or leveraging scheduled tasks. Required log sources must include both Security and Sysmon logs to capture comprehensive context. Legitimate activities, such as system maintenance or configuration changes executed by administrators, may trigger the alert. A related detection, such as monitoring for PowerShell execution (e.g., `powershell.exe` with service-related commands), could bolster coverage and improve response efficacy.

