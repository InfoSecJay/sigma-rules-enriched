title: Start Windows Service Via Net.EXE
id: 2a072a96-a086-49fa-bcb5-15cc5a619093
status: test
description: Detects the usage of the "net.exe" command to start a service using the
  "start" flag
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1569.002/T1569.002.md
author: Timur Zinniatullin, Daniil Yugoslavskiy, oscd.community
date: 2019-10-21
modified: 2023-03-05
tags:
- attack.execution
- attack.t1569.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\net.exe'
    - '\net1.exe'
  - OriginalFileName:
    - 'net.exe'
    - 'net1.exe'
  selection_cli:
    CommandLine|contains: ' start '         # space character after the 'start' keyword indicates that a service name follows, in contrast to `net start` discovery expression
  condition: all of selection_*
falsepositives:
- Legitimate administrator or user executes a service for legitimate reasons.
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of the `net.exe` command to start a Windows service, specifically when it uses the "start" flag. Attackers may leverage this command as part of post-compromise activities to gain persistence or control over systems by starting malicious services. The typical objective for such behavior might include maintaining access to an environment or establishing a foothold for further attacks.

  In terms of MITRE ATT&CK, this activity relates specifically to the technique T1569.002: "Service Execution." This technique falls under the Execution tactic, where an attacker executes processes to achieve their aims within a compromised environment. The primary telemetry source for this detection consists of process creation logs, which provide vital information about commands executed on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate process creation logs to identify instances where `net.exe` or `net1.exe` has been executed with the "start" command-line option. Pay attention to the command line arguments provided during execution.
  - **Identify Service Changes**: Check for any newly created or modified services around the same time as the `net.exe` execution. Validate whether these services are legitimate or potentially malicious.
  - **Correlate User and Session Activity**: Examine the user account and session from which the command was executed. Look for any known indicators of compromise associated with that user and determine if there are any anomalous behavior patterns.
  - **Audit for Anomalous Network Activity**: Analyze network traffic logs around the same time to see if there has been any unusual communication that might indicate malicious actions following the service start.

  ### Prioritization
  This alert is considered low severity due to the potential for false positives from legitimate administrative activities. However, it should still be investigated promptly, as unauthorized use of the `net.exe` command to start services can indicate an active compromise or misuse of system resources.

  ### Blind Spots and Assumptions
  Detection logic may miss instances where attackers use alternative methods or tools other than `net.exe` to start services, such as PowerShell or WMI. It also assumes that process creation logs are enabled and available for analysis; without these logs, detection and subsequent investigation efforts would be significantly limited. Additionally, the logic may not distinguish between legitimate administrative actions and malicious ones, leading to potential noise in alerts.

