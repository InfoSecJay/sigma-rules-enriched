detection:
  selection_chromium_based:
        # Covers: --remote-debugging-address, --remote-debugging-port, --remote-debugging-socket-name, --remote-debugging-pipe....etc
    CommandLine|contains: ' --remote-debugging-'
  selection_firefox:
    Image|endswith: '\firefox.exe'
    CommandLine|contains: ' -start-debugger-server'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects browsers starting with remote debugging flags, specifically for Chromium-based browsers and Firefox. The likely attacker objective is to perform browser injection attacks, allowing unauthorized access to browser sessions, execution of arbitrary code, or data exfiltration. This behavior aligns with the MITRE ATT&CK technique T1185 (Browser Extension Abuse).

  The primary telemetry sources involved are process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1. If malicious, the security impact could include credential theft and unauthorized access to sensitive information. This detection does NOT confirm an active compromise; it may also reflect legitimate debugging or development activities.

  ### Investigation Steps

  - **Check process creation events**: Review Windows Security Event ID 4688 for browser process creation. Look for entries where the command line includes `--remote-debugging-` or `-start-debugger-server` for Firefox.

  - **Validate command line arguments**: Analyze the command line details to ensure only expected behaviors are present. Remote debugging flags in legitimate development environments may include `--disable-extensions` for controlled usage.

  - **Identify high-confidence malicious indicators**: Look for processes launched from unusual directories (e.g., non-default installation paths) that still include the remote debugging flags. Investigate any command lines that have URL access patterns or additional suspicious flags.

  - **Determine asset criticality**: Ascertain the sensitivity of affected systems. Browsers running on workstations with access to sensitive data require swift attention compared to non-critical assets.

  - **Consult documentation for known tools**: Review any existing standard company practices regarding remote debugging usage to ascertain if this process initiation aligns with department policies or expected development activities.

  ### Prioritization

  This alert has medium severity due to the potential impact of compromising sensitive browser sessions, which can be exploited for credential theft. The likelihood of malicious abuse is significant given that remote debugging is not a common state for browsers during normal usage. This behavior is frequently weaponized in attacks targeting credential access and data collection.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured logging, specifically if Sysmon is not deployed effectively across the environment. Legitimate developers may trigger this alert while debugging applications, which could result in false positives. Comparing with related detections, such as unauthorized remote access tools or suspicious remote connections, can enhance incident response capabilities in addressing browser security threats.

