detection:
  selection_chromium_based:
        # Covers: --remote-debugging-address, --remote-debugging-port, --remote-debugging-socket-name, --remote-debugging-pipe....etc
    CommandLine|contains: ' --remote-debugging-'
  selection_firefox:
    Image|endswith: '\firefox.exe'
    CommandLine|contains: ' -start-debugger-server'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects instances where a web browser, specifically Chromium-based browsers or Firefox, is started with remote debugging flags. Remote debugging functionality can be exploited by attackers to inject malicious scripts, manipulate sessions, or capture sensitive information from the user's web session. As such, the presence of these flags in a browser startup sequence may indicate an attempt to conduct browser injection attacks, which threaten the confidentiality and integrity of user data.

  Attackers leveraging this technique typically aim to gain unauthorized access to web sessions, manipulate user actions, or exfiltrate sensitive information. This action aligns with the MITRE ATT&CK framework's tactics for Credential Access (T1185) and Collection (T1119). Thus, detecting the use of remote debugging in web browsers serves as a crucial indicator of potential malicious activities that may compromise sensitive data or facilitate further exploitation.

  The primary data sources for this detection will be process creation events, specifically looking at command line parameters used to start browsers. Key telemetry to monitor includes logs that capture the process creation details for Chromium-based browsers and Firefox, which can often provide insights into potentially malicious configurations.

  ### Investigation Steps
  - **Review Process Creation Logs:** Identify the process creation events for Chromium-based browsers and Firefox. Look for instances where the command line arguments contain flags related to remote debugging, such as `--remote-debugging-` for Chromium and `-start-debugger-server` for Firefox.

  - **Correlate with User Activity:** Determine if the browser was started by a user or as a result of a scheduled task or malware. Correlate process creation timestamps with user activity logs to understand the context of the execution.

  - **Examine Network Traffic:** If possible, analyze network traffic to see if there are unusual outgoing connections that may suggest data exfiltration or interaction with potentially malicious remote servers following the use of remote debugging.

  - **Check for Additional Indicators:** Explore whether there are other signs of malicious behavior on the system, such as the presence of unusual extensions in the browser or other processes running alongside it that could indicate a browser compromise.

  ### Prioritization
  This alert warrants medium severity in an enterprise environment due to the potential for significant impact from successful browser injection attacks. Given the ease with which remote debugging can be exploited, the likelihood of encountering this behavior in the wild necessitates prompt investigation.

  ### Blind Spots and Assumptions
  Detection of this behavior relies heavily on the presence of comprehensive process creation logs that include command line details. Potential blind spots include environments where logging is not properly configured or where privacy settings obscure command line arguments. Additionally, the detection logic assumes that no legitimate administrative or debugging actions will use remote debugging flags, which may not always be valid. Ensuring that logging of command line parameters is enabled is crucial for this detection to function effectively.

