title: Suspicious Eventlog Clearing or Configuration Change Activity
id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
status: stable
description: |
  Detects the clearing or configuration tampering of EventLog using utilities such as "wevtutil", "powershell" and "wmic".
  This technique were seen used by threat actors and ransomware strains in order to evade defenses.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.001/T1070.001.md
- https://eqllib.readthedocs.io/en/latest/analytics/5b223758-07d6-4100-9e11-238cfdd0fe97.html
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
- https://gist.github.com/fovtran/ac0624983c7722e80a8f5a4babb170ee
- https://jdhnet.wordpress.com/2017/12/19/changing-the-location-of-the-windows-event-logs/
- https://www.linkedin.com/posts/huntress-labs_when-a-sketchy-incident-hits-your-network-activity-7304940371078238208-Th_l/?utm_source=share&utm_medium=member_desktop&rcm=ACoAAAJTlRcB28IaUtg03HUU-IdliwzoAL1flGc
- https://stackoverflow.com/questions/66011412/how-to-clear-a-event-log-in-powershell-7
- https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.eventing.reader.eventlogsession.clearlog?view=windowsdesktop-9.0&viewFallbackFrom=dotnet-plat-ext-5.0#System_Diagnostics_Eventing_Reader_EventLogSession_ClearLog_System_String_
- https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.eventlog.clear
author: Ecco, Daniil Yugoslavskiy, oscd.community, D3F7A5105, Swachchhanda 
  Shrawan Poudel (Nextron Systems)
date: 2019-09-26
modified: 2025-03-12
tags:
- attack.defense-impairment
- attack.t1685.005
- attack.t1685.001
- car.2016-04-002
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil_img:
  - Image|endswith: '\wevtutil.exe'
  - OriginalFileName: 'wevtutil.exe'
  selection_wevtutil_cmd:
    CommandLine|contains:
    - 'clear-log '                  # clears specified log
    - ' cl '                        # short version of 'clear-log'
    - 'set-log '                    # modifies config of specified log. could be uset to set it to a tiny size
    - ' sl '                        # short version of 'set-log'
    - 'lfn:'                        # change log file location and name
  selection_other_ps_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
  selection_other_ps_cmd:
  - CommandLine|contains:
    - 'Clear-EventLog '
    - 'Remove-EventLog '
    - 'Limit-EventLog '
    - 'Clear-WinEvent '
  - CommandLine|contains|all:
    - 'Eventing.Reader.EventLogSession'           # [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)
    - 'ClearLog'
  - CommandLine|contains|all:
    - 'Diagnostics.EventLog'
    - 'Clear'
  selection_other_wmi:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\wmic.exe'
    CommandLine|contains: 'ClearEventLog'
  filter_main_msiexec:
        # Example seen during office update/installation:
        #   ParentImage: C:\Windows\SysWOW64\msiexec.exe
        #   CommandLine: "C:\WINDOWS\system32\wevtutil.exe" sl Microsoft-RMS-MSIPC/Debug /q:true /e:true /l:4 /rt:false
    ParentImage:
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\msiexec.exe'
    CommandLine|contains: ' sl '
  condition: (all of selection_wevtutil_*) or (all of selection_other_ps_*) or 
    (selection_other_wmi) and not 1 of filter_main_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
- Maintenance activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to clear or tamper with Windows Event Logs using tools like `wevtutil`, PowerShell, or WMI, which are commonly employed by adversaries to obscure their actions and evade detection. The attacker’s objective is generally to erase traces of malicious activities or to alter logging settings, reducing visibility into their actions. This behavior relates to the MITRE ATT&CK tactics of **Defense Evasion** (T1070.001) as well as **Exploitation for Client Execution** (T1685.001).

  The primary telemetry sources include Windows process creation events, such as Security Event ID 4688 or Sysmon Event ID 1, and analysis of command line activity. Malicious activity poses a significant risk, as it can indicate an ongoing compromise or execution of further malicious tasks undetected. Importantly, this detection alone does NOT confirm malicious intent, as legitimate administrative actions may also trigger similar alerts.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Security Event ID 4688 (Windows Security log) or Sysmon Event ID 1 for processes like `wevtutil.exe`, `powershell.exe`, or `wmic.exe`. Look for unusual execution context, such as processes starting from temporary directories or files not associated with administrative tasks.

  - **Inspect Command Line Arguments**: Examine command line fields (CommandLine) for flags like `clear-log`, `set-log`, or `Clear-EventLog`. See if these commands are run in a context that is usual for administrative tasks, such as being launched by `services.exe` or `wuauserv`.

  - **Identify Benign Administrative Behavior**: Determine if similar log clearing actions were conducted during legitimate maintenance windows, as this may indicate expected behavior. Cross-reference system change logs or ticketing records related to administrative maintenance.

  - **Look for Anomalies in Time and Frequency**: Identify the timing of the commands. Frequent log clearing attempts or those occurring outside normal business hours could indicate malicious activity. Make note of repeated commands which might indicate an ongoing campaign.

  - **Correlate with Other Alerts or Incidents**: Review additional telemetry from endpoint detection tools or SIEM (e.g., anomalous Kerberos ticket requests, internal network scanning) that occurred around the time of the event. This context is vital for confirming or refuting the nature of the activity.

  - **Evaluate Asset Criticality**: Consider the role of the affected system. If the logs were cleared on critical infrastructure or high-value targets, escalate the finding due to the high potential impact on the organization.

  ### Prioritization

  This alert is high severity due to the potential for significant impact on system integrity and the likelihood of malicious abuse. Attackers often employ log tampering techniques in attacks to maintain persistence and avoid detection, making this behavior common in targeted incidents.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations are not robust or if event logs are not retained for a sufficient duration. Attackers may employ encryption or obfuscation techniques to avoid detection through legitimate administrative activities, which can also trigger similar alerts. Related detections such as monitoring for anomalous administrative command behaviors or changes in system file integrity can strengthen overall security coverage and incident response capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
