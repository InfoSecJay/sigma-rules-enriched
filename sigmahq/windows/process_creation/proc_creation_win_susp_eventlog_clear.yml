title: Suspicious Eventlog Clearing or Configuration Change Activity
id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
status: stable
description: |
  Detects the clearing or configuration tampering of EventLog using utilities such as "wevtutil", "powershell" and "wmic".
  This technique were seen used by threat actors and ransomware strains in order to evade defenses.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.001/T1070.001.md
- https://eqllib.readthedocs.io/en/latest/analytics/5b223758-07d6-4100-9e11-238cfdd0fe97.html
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
- https://gist.github.com/fovtran/ac0624983c7722e80a8f5a4babb170ee
- https://jdhnet.wordpress.com/2017/12/19/changing-the-location-of-the-windows-event-logs/
- https://www.linkedin.com/posts/huntress-labs_when-a-sketchy-incident-hits-your-network-activity-7304940371078238208-Th_l/?utm_source=share&utm_medium=member_desktop&rcm=ACoAAAJTlRcB28IaUtg03HUU-IdliwzoAL1flGc
- https://stackoverflow.com/questions/66011412/how-to-clear-a-event-log-in-powershell-7
- https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.eventing.reader.eventlogsession.clearlog?view=windowsdesktop-9.0&viewFallbackFrom=dotnet-plat-ext-5.0#System_Diagnostics_Eventing_Reader_EventLogSession_ClearLog_System_String_
- https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.eventlog.clear
author: Ecco, Daniil Yugoslavskiy, oscd.community, D3F7A5105, Swachchhanda 
  Shrawan Poudel (Nextron Systems)
date: 2019-09-26
modified: 2026-06-01
tags:
- attack.defense-impairment
- attack.t1685.005
- attack.t1685.001
- car.2016-04-002
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil_img:
  - Image|endswith: '\wevtutil.exe'
  - OriginalFileName: 'wevtutil.exe'
  selection_wevtutil_cmd:
    CommandLine|contains:
    - 'clear-log '                  # clears specified log
    - ' cl '                        # short version of 'clear-log'
    - 'set-log '                    # modifies config of specified log. could be used to set it to a tiny size
    - ' sl '                        # short version of 'set-log'
    - 'lfn:'                        # change log file location and name
  selection_other_ps_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
  selection_other_ps_cmd:
  - CommandLine|contains:
    - 'Clear-EventLog '
    - 'Remove-EventLog '
    - 'Limit-EventLog '
    - 'Clear-WinEvent '
  - CommandLine|contains|all:
    - 'Eventing.Reader.EventLogSession'           # [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)
    - 'ClearLog'
  - CommandLine|contains|all:
    - 'Diagnostics.EventLog'
    - 'Clear'
  selection_other_wmi:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    - '\wmic.exe'
    CommandLine|contains: 'ClearEventLog'
  filter_main_msiexec:
        # Example seen during office update/installation:
        #   ParentImage: C:\Windows\SysWOW64\msiexec.exe
        #   CommandLine: "C:\WINDOWS\system32\wevtutil.exe" sl Microsoft-RMS-MSIPC/Debug /q:true /e:true /l:4 /rt:false
    ParentImage:
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\msiexec.exe'
    CommandLine|contains: ' sl '
  condition: ((all of selection_wevtutil_*) or (all of selection_other_ps_*) or 
    selection_other_wmi) and not 1 of filter_main_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
- Maintenance activity
level: high
note: |
  ### Technical Context

  This rule detects the clearing or tampering of Windows Event Logs using utilities like "wevtutil", "PowerShell", and "WMIC". Such behavior is typically aimed at erasing evidence of malicious activities after an intrusion, suggesting an attacker’s objective to maintain stealth and persistence. This aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) specifically using techniques like Indicator Removal on Host (T1070.001).

  The primary telemetry sources include Windows process creation logs (Event ID 4688), PowerShell logs, and WMI logs, focusing on commands that manipulate event logs. If malicious, this activity could significantly impair detection capabilities, allowing attackers to cover their tracks. Notably, this detection does not confirm malicious intent on its own, as legitimate administrative tasks can trigger similar alerts.

  ### Investigation Steps

  - **Review recent process creations**: Analyze Security Event ID 4688 for instances involving `wevtutil.exe`, `powershell.exe`, or `wmic.exe` around the alert time. Identify unexpected usage patterns, such as execution by a non-administrative account.

  - **Examine command line arguments**: Specifically, check the CommandLine field for instances containing "clear-log", "Clear-EventLog", "Remove-EventLog", or similar scripts. Malicious commands may have unusual or unexpected log names being accessed.

  - **Look for parent-child relationships**: Investigate any parent processes leading to the alert. For example, legitimizing a process tied to `msiexec.exe` can clarify whether the event log modification was part of routine updates or potentially suspicious behavior.

  - **Identify anomalies in event logs**: Cross-reference the logs being manipulated. If key system logs (e.g., Security or Application logs) have been cleared recently and the timestamps correlate with suspicious process activity, this strengthens the case for malicious behavior.

  - **Determine normal administrative practices**: Identify regular maintenance windows or activities in your environment where event log clearance might occur. Focus on activities involving high-privileged accounts in system management.

  - **Correlate with other security telemetry**: Check for additional signs of compromise within endpoint detection solutions or SIEM systems like unauthorized account logins, lateral movement, or other alert types that might indicate ongoing malicious activity.

  ### Prioritization

  The alert is of high severity due to its potential impact on incident detection and response. Systems with critical functions or sensitive information are particularly vulnerable. This behavior is often weaponized by sophisticated threats aiming to cover their tracks after compromising a system or executing a ransomware attack.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques employed by attackers, including legitimate administrative actions that can trigger similar alerts. While capable of detecting unauthorized log clearance, the effectiveness hinges on complete logging configurations and monitoring of administrative activities. Companion detections for suspicious PowerShell activity (e.g., script execution or unauthorized cmdlets) can provide a more comprehensive view of potential threats.

