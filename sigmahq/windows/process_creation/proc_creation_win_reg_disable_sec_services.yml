logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_add:
    CommandLine|contains|all:
    - 'reg'
    - 'add'
  selection_cli_reg_start:
    CommandLine|contains|all:
    - 'd 4'
    - 'v Start'
    CommandLine|contains:
    - '\AppIDSvc'
    - '\MsMpSvc'
    - '\NisSrv'
    - '\SecurityHealthService'
    - '\Sense'
    - '\UsoSvc'
    - '\WdBoot'
    - '\WdFilter'
    - '\WdNisDrv'
    - '\WdNisSvc'
    - '\WinDefend'
    - '\wscsvc'
    - '\wuauserv'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the use of the `reg.exe` command-line utility to disable critical Windows security services, such as Windows Defender, by adding registry keys that alter their startup behavior. Attackers often aim to disable endpoint protection mechanisms to create an environment conducive to malware execution or unauthorized access without detection. By doing so, they can implant additional malicious tools or move laterally within the network, thereby augmenting their control.

  Relevant MITRE ATT&CK tactics/techniques include **Defense Evasion (T1562)**, specifically **T1562.001: Disable or Modify Tools**. This reflects actions taken by adversaries to impair the effectiveness of security measures that would normally detect their presence or prevent their actions.

  The primary data sources for evidence in this detection encompass **process creation events**, which will log the execution of `reg.exe`, along with detailed command-line parameters indicating the target services. Windows event logs related to system changes may also provide necessary context.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for process creation events, specifically focusing on instances where `reg.exe` was executed with a command line that includes `add` along with relevant parameters indicating the alteration of security service startup values.

  - **Correlate with Security Logs:** Check security logs for subsequent alerts regarding attempts to disable services like Windows Defender or other relevant antivirus services. Establish a timeline of events leading to the detected command execution.

  - **Inspect Registry Changes:** Collect and analyze recent registry changes associated with the key paths targeted by the `reg.exe` command. Focus on keys associated with Windows Defender and related services to verify if any have been altered or disabled.

  - **Conduct a Threat Hunt:** Perform a broader threat hunt for lateral movement or persistence mechanisms associated with the discovery of this suppression of security tools, looking for other indicators of compromise that might align with malware activities.

  ### Prioritization
  Given the potential for significant impact on an enterprise’s security posture through the disabling of endpoint protections, this alert should be treated with high severity. An attacker succeeding in this strategy may lead to undetected breaches, data exfiltration, or system compromise.

  ### Blind Spots and Assumptions
  This detection rule may have gaps, particularly if `reg.exe` is replaced by alternative methods of achieving the same result, such as direct registry manipulations by scripts or other tools. The rule assumes that logging for process creation is enabled and comprehensive, as well as that the command line details are preserved. It also presumes there are no legitimate administrative tasks executed that follow similar command patterns, which could lead to false positives if proper context is not taken into account.

