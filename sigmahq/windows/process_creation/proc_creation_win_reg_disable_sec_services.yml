detection:
  selection_reg_add:
    CommandLine|contains|all:
    - 'reg'
    - 'add'
  selection_cli_reg_start:
    CommandLine|contains|all:
    - 'd 4'
    - 'v Start'
    CommandLine|contains:
    - '\AppIDSvc'
    - '\MsMpSvc'
    - '\NisSrv'
    - '\SecurityHealthService'
    - '\Sense'
    - '\UsoSvc'
    - '\WdBoot'
    - '\WdFilter'
    - '\WdNisDrv'
    - '\WdNisSvc'
    - '\WinDefend'
    - '\wscsvc'
    - '\wuauserv'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the `reg.exe` command-line tool to alter the registry, specifically aiming to disable critical security services like Windows Defender. The likely objective of an attacker is to lower the security posture of the compromised system, making it easier for malware to operate undetected. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (TA0005) and Impact (TA0011), particularly technique T1685, which focuses on disabling security controls.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which document command-line executions. If successful, an attack could enable further malicious activities, leaving the system vulnerable to infections and exploits. Importantly, this detection does not confirm that an actual compromise has occurred—administrative users may validly manipulate these services for maintenance purposes.

  ### Investigation Steps

  - **Review the command-line arguments in the process creation logs:** Check for Event ID 4688 detailing `reg.exe` execution with parameters indicative of modifying service startup settings, specifically looking for events containing `reg add * Start` targeting services like `MsMpSvc` or `WD*`.

  - **Identify high-confidence malicious indicators:** Correlate the detected `reg.exe` modifications to services typically targeted by malicious actors, such as `MsMpSvc` and `WdFilter`. Confirm any alteration to `Start` values as a clear indicator of potential adversarial activity.

  - **Examine recent service state changes:** Use the Service Control Manager logs (Event ID 7036) to verify if any relevant Windows Defender services change to a 'Stopped' state shortly after the `reg.exe` command was executed, indicating a successful disablement.

  - **Determine expected legitimate activity:** Investigate if the execution coincides with administrative tasks by reputable software or IT maintenance, typically involving user accounts with elevated privileges and their intended purposes.

  - **Cross-check user account activity:** Review user account logs (Event ID 4624) to identify if the execution coincided with non-privileged accounts or anomalous access patterns that might suggest unauthorized tampering.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact of disabling security services critical to endpoint protection. The likelihood of malicious abuse is substantial, as this behavior is commonly weaponized in attacks aimed at evading detection. Addressing it promptly is essential to maintaining the security integrity of affected systems.

  ### Blind Spots and Assumptions

  Detection limitations include potential manipulation of execution logs by sophisticated adversaries, who might employ obfuscation tactics. Required log sources include a comprehensive audit policy to ensure process creation events and service state changes are logged accurately. Legitimate activities that may trigger the alert can include authorized maintenance scripts or administrative functions. Companion detections, such as alerts for suspicious PowerShell commands (e.g., T1059.001), strengthen coverage against broader attack vectors.

