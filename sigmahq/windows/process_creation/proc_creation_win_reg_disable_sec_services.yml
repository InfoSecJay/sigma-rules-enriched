note: |
  ### Technical Context

  This Sigma rule detects the execution of `reg.exe` with specific command line arguments that indicate an attempt to disable critical Windows security services, such as Windows Defender. The likely attacker objective is to evade detection and protect their activities during malicious operations, typically as part of an initial access or lateral movement phase in the attack lifecycle. This behavior aligns with the MITRE ATT&CK technique T1562.001: Disable or Modify Tools.

  The primary telemetry sources are process creation logs, particularly Windows Security Event ID 4688, which records the details of process executions, as well as Sysmon Event ID 1 for more granular insights. If successful, this activity can significantly reduce the system's security posture, allowing for undetected adversary actions. However, this detection does NOT confirm that the system is compromised, as legitimate administrative tasks may also invoke `reg.exe` for service adjustments.

  ### Investigation Steps

  - **Review process creation logs:** Query Security Event ID 4688 or Sysmon Event ID 1 for the process `reg.exe`. Check the `CommandLine` field for arguments containing `add` alongside security service identifiers like `MsMpSvc` and `WdFilter`.

  - **Identify high-confidence malicious indicators:** Look for command lines specifically invoking parameters that set service values to `4` (disabled) for services such as `MsMpSvc` and `WinDefend`. Presence of these terms in combination with `reg add` in the logs typically indicates malicious activity.

  - **Check for legitimate usage:** Validate any recent changes to security services or group policy that align with organizational practices. Legitimate activities may include system maintenance tasks or updates where service modifications are documented and authorized.

  - **Assess asset criticality:** Determine if the affected host is a critical server, endpoint, or workstation. High-risk systems should trigger an immediate follow-up investigation, especially if they handle sensitive data or operational control.

  - **Evaluate related log sources:** Investigate correlated logs, including Windows Event Logs for Service Control Manager (Event ID 7036) to detect unexpected service status changes shortly after the `reg.exe` execution, enhancing context and insight.

  ### Prioritization

  This alert has a high severity in an enterprise context due to the potential for an adversary to disable essential security controls, which greatly increases the likelihood of malicious actions going undetected. The ability to modify or disable security services is a common tactic among attackers seeking sustained access and should be treated with high urgency.

  ### Blind Spots and Assumptions

  The detection may be bypassed through various evasion techniques, such as renaming the `reg.exe` executable or utilizing alternate methods to disable services. Reliable detection requires that process creation logging is enabled and properly configured on all endpoints. Additionally, benign administrative activities, such as legitimate maintenance or updates performed by IT staff, could unintentionally trigger this alert. A related detection for abnormal service stop/start events would strengthen the coverage against this type of activity.

