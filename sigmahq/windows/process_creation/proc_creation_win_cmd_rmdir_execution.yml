note: |
  ### Technical Context

  This Sigma rule detects the execution of the built-in Windows command `rmdir` used to remove directories, including specific flag usage (e.g., `/s`, `/q`). The likely attacker objective is to delete files or directories that may contain evidence of their activities, thus reducing their operational footprint on the compromised system. This behavior corresponds to the MITRE ATT&CK tactic of **Defense Evasion** (ID: T1070.004) where adversaries remove traces of their presence. The primary telemetry source is Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, capturing command execution. If malicious, this behavior could indicate a cover-up during or after a breach, but alone, it does not confirm compromise without additional context or evidence of suspicious activities prior to the command being issued.

  ### Investigation Steps

  - **Review the command execution context:** Examine Security Event ID 4688 and/or Sysmon Event ID 1 for processes that executed `cmd.exe` with the command line containing `rmdir`, particularly focusing on the parameters used (`/s` and `/q`). Identify the user and context of execution to establish legitimacy.

  - **Check for pre-existing conditions:** Look for log entries indicating the creation of directories or files that were subsequently deleted (Event ID 4663), linking them to the command execution for potential malicious intent.

  - **Identify frequent uses of `rmdir`:** Evaluate the frequency of `rmdir` commands executed by the user account over a certain timeframe to establish a baseline. Frequent, unexpected usage may suggest malicious behavior.

  - **Review legitimate administrative tasks:** Identify any administrative activities, such as routine system maintenance or cleanup scripts, that may also utilize the `rmdir` command. Assess correlating logs to determine if expected justification exists.

  - **Correlate with other indicators of compromise:** Cross-reference with other security alerts and log sources (e.g., network logs for unusual outbound traffic, file creation timestamps) to establish a timeline of activities that might indicate early signs of compromise or malicious behavior.

  ### Prioritization

  The severity of this alert is relatively low, primarily because the execution of `rmdir` can be a common administrative function. However, if the affected system is critical and the command usage is tied to suspicious activities, the potential impact could indicate a higher threat level. The likelihood of malicious abuse is moderate, as attackers frequently employ directory removal to clear traces of their actions.

  ### Blind Spots and Assumptions

  Detection can be evaded if an attacker modifies the command-line parameters or utilizes alternative methods to delete files (e.g., using third-party tools). Reliable detection requires accurate logging of process creation events; potential gaps may exist if logging is misconfigured or incomplete. Legitimate tasks like batch cleanup of temporary directories can also trigger this alert. Related detections for enhanced coverage can include logs indicating file creation or modification (Event ID 4663) to assess whether deleted directories were suspiciously modified beforehand.

