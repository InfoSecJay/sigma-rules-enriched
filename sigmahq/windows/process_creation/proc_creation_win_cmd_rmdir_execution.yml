note: |
  ### Technical Context

  This detection rule identifies the execution of the built-in "rmdir" command, specifically when invoked via `cmd.exe` to remove directories. The likely intent behind this behavior is to eliminate traces of tools, files, or artifacts associated with an adversary's activity within the environment, aligning with a post-intrusion cleanup phase. This activity relates to the MITRE ATT&CK technique T1070.004 (Indicator Removal on Host: File Deletion).

  Primary telemetry sources for this rule include Windows process creation logs, specifically Security Event ID 4688, which captures command execution details. If malicious, this behavior suggests an attempt to obscure previous actions and reduces the likelihood of detection. However, this detection does NOT confirm that the activity is inherently malicious without additional context.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for `cmd.exe` executions that include `rmdir`. Look for elevated privileges (e.g., SYSTEM or Administrator) that might indicate malicious intent.

  - **Review command line arguments:** Analyze the command line for patterns using parameters `/s` (to remove directories and their contents) and `/q` (to suppress confirmation prompts). These flags could indicate an attempt to remove data quietly and thoroughly.

  - **Identify legitimate usage patterns:** Confirm if the command was executed in a known context, such as by system maintenance tasks or administrative scripts. Verifying timestamps against expected administrative activity can provide additional context.

  - **Corroborate with file system changes:** Check for file system changes in the directories intended for deletion. Use Windows File Auditing logs (Event ID 4663) to see if sensitive or unusual files were recently modified or accessed before the deletion.

  - **Assess potential lateral movement indicators:** Investigate if the command execution correlates with other suspicious network activity, such as unusual outbound connections to external addresses or access attempts to sensitive data.

  - **Look for related alerts:** Check for previous alerts or logged events indicating suspicious file creation or malware behavior in the same timeframe as the `rmdir` command execution to establish a more comprehensive timeline of the incident.

  ### Prioritization

  This alert should be classified as low severity due to its potential impact on a system's integrity without a direct indication of ongoing exploitation. However, the low probability of benign usage allows reasonable suspicion, particularly if associated with prior alerts signaling adversarial activity related to lateral movement or data exfiltration.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques like disabling command logging or using alternative scripting methods. Reliable detection requires appropriate auditing configurations for process creation and file access. Legitimate maintenance activities, such as system cleanups or scheduled tasks, may occasionally trigger this alert. A companion detection rule targeting file creation or modification events can enhance overall visibility into potential malicious activities.

