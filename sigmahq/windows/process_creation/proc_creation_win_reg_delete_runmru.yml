note: |
  ### Technical Context

  This rule detects the deletion of the RunMRU registry key, which logs commands executed through the Windows Run dialog. Adversaries often manipulate this key after executing malicious commands to evade detection, indicating an effort to hide their activity. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1070.003 (Indicator Removal on Host). The primary telemetry source is the Windows Registry change logs, with a focus on activities reflecting registry manipulation, specifically through the `reg.exe` utility.

  If the detected behavior is malicious, it signifies a proactive effort by an attacker to erase their tracks after executing potentially harmful commands. However, this detection alone does not confirm that the system has been compromised; it merely indicates an attempt to alter persistence mechanisms or conceal prior actions.

  ### Investigation Steps

  - **Examine recent registry modifications:** Check Windows Registry logs for changes to the `RunMRU` key (Path: `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`) to confirm if deletions were unauthorized.

  - **Review process creation events:** Look at Security Event ID 4688 and/or Sysmon Event ID 1 for instances of `reg.exe` with CommandLine containing "del" and pointing to the RunMRU path. Validate legitimacy by checking against expected administrative usage.

  - **Identify legitimate use cases:** Confirm if any authorized personnel executed commands via the Run dialog that would warrant deletion of the RunMRU key. Review usernames and timestamps associated with recent `reg.exe` activity.

  - **Assess environmental context and criticality:** Investigate whether the affected system has administrative roles; systems handling sensitive tasks should be prioritized for deeper analysis.

  - **Look for high-confidence malicious activity:** Check for other indicators of compromise (IOCs) such as abnormal command line patterns or simultaneous events related to credential access or lateral movement.

  - **Validate removal and execution artifacts:** Monitor for any signs of file execution linked to the command run post-registry deletion, including searching for external scripts or binaries that may have been executed around the same time.

  ### Prioritization

  The severity of this alert is high as it may indicate an attempt to cover malicious activity on a potentially critical system. Deleting the RunMRU key is a common tactic observed in post-exploitation activities designed to obscure the attacker's footprint, increasing the risk of a successful breach.

  ### Blind Spots and Assumptions

  This detection method may be evaded if an attacker utilizes alternative methods for execution that do not involve `reg.exe`. Additionally, administrative practices in the environment may trigger this alert, such as legitimate users deleting their command history for privacy reasons. It's essential to have comprehensive logging strategies in place, including enabling Windows Event log collection and Sysmon configurations. A related detection to reinforce coverage would be tracking unauthorized modifications to other critical registry keys related to user activity and persistence.

