note: |
  ### Technical Context
  This rule detects the deletion of the RunMRU registry key, which maintains a history of commands executed via the Windows Run dialog. Attackers often exploit this feature to execute commands using phishing lures that prompt users to open the Run dialog (using Win + R) and run malicious code. Deleting the RunMRU key can be a tactic employed by adversaries to obfuscate their actions and eliminate traces of malicious commands executed on the compromised machine.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), specifically technique **Indicator Removal on Host** (T1070.003). This technique encompasses methods adversaries use to remove signs of their activity, such as deleting logs or keys that track executed commands, thereby complicating incident response efforts.

  Primary data sources for this detection rule include **process creation logs** that capture command execution details, including which executable was run (in this case, `reg.exe`) and any command-line arguments used during execution.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine recent process creation logs for entries involving `reg.exe` to identify the context of the registry manipulation, including the user and process that initiated the command.

  - **Analyze Command Line Parameters:** Focus on instances where the command line includes 'del' and targets the `RunMRU` registry key. This command-line specificity can reveal intentional deletions by unauthorized users or processes.

  - **Correlate User Activity:** Identify any correlations between the execution of commands that delete the RunMRU key and user activity in other logs, such as login events or suspicious application behavior, to determine if the context suggests malicious intent.

  - **Check Registry Audit Logs:** If available, review registry change logs to gather additional context on any alterations to the `RunMRU` key, including timing and associated user accounts.

  ### Prioritization
  This alert is considered **high severity** due to its implications for potential malicious activity and the sophisticated measures adversaries may take to cover their tracks. The likelihood of this behavior indicating an active threat is significant, especially within environments where users have been targeted by phishing campaigns.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if auditing of command line executions is not comprehensively enabled or if registry access auditing is lacking. This detection logic assumes that the command to delete the registry key is performed using `reg.exe` and that standard registry access permissions are in place. Without these logs, the rule may fail to trigger in cases where adversaries employ alternative methods to achieve the same goal.

