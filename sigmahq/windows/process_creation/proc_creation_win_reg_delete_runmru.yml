note: |
  ### Technical Context

  This rule detects the deletion of the RunMRU registry key, which maintains a history of commands executed via the Windows Run dialog. This behavior is indicative of an attacker attempting to cover their digital tracks after executing potentially malicious commands, thereby obscuring evidence of their activities. The relevant MITRE ATT&CK technique is **T1070.003: Indicator Removal on Host**.

  The primary telemetry source is Windows registry monitoring, specifically the deletion events associated with `reg.exe` operations. If this deletion is carried out maliciously, it can impair an organization's ability to investigate subsequent incidents effectively. It is critical to note that this detection alone does not confirm malicious intent—it may also arise from legitimate administrative actions.

  ### Investigation Steps

  - **Check for registry deletion events:** Review Security Event ID 4657, which logs registry key modifications, to confirm the deletion of `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`. Cross-reference timestamps with other suspicious activity.

  - **Investigate process creation:** Examine Sysmon Event ID 1 for the use of `reg.exe`. Look specifically for entries where the CommandLine includes "del" and references the RunMRU key, indicating potential malicious behavior.

  - **Identify legitimate vs. malicious behavior:** Compare detected deletion events with normal administrative activities. Legitimate system maintenance activities may include routine registry cleanups or policy updates that do not target the RunMRU key.

  - **Review related process activity:** Examine other related Event IDs (such as 4688 or 4689) to detect if unusual processes are being spawned before or after the registry deletion that may suggest further malicious activity.

  - **Correlate with user activity logs:** Analyze relevant user action logs to see if there is a pattern of Run dialog usage, especially involving ‘Win + R’ commands leading up to the registry deletion, as this may indicate an attack path was utilized.

  - **Assess system criticality:** Determine the importance of the affected system in your operational environment. If it hosts sensitive data or critical applications, escalate the findings accordingly.

  ### Prioritization

  This alert is of high severity due to its potential to indicate malicious track-covering activities by an adversary. Given the sensitivity of the RunMRU key to user activity visibility, successful exploitation may lead to a significant operational compromise. Furthermore, deleting this registry entry is a common tactic used by attackers during post-exploitation phases.

  ### Blind Spots and Assumptions

  Detection may be limited by proper audit policy configurations; if registry auditing is not enabled, this deletion could go unnoticed. Legitimate activities, such as system cleanups or administrative scripts, may inadvertently trigger this alert. It's crucial to maintain companion detection mechanisms, such as monitoring for unusual command-line interactions (related detection: `T1086: PowerShell` usage), which could strengthen comprehensive coverage of suspicious behaviors.

