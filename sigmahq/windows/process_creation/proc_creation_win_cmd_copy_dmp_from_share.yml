title: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
id: 044ba588-dff4-4918-9808-3f95e8160606
status: test
description: Detects usage of the copy builtin cmd command to copy files with the
  ".dmp"/".dump" extension from a remote share
references:
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-27
modified: 2023-09-12
tags:
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
    # Example: copy \\<host>\\<folder>\\process.dmp C:\Users\process.dmp
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
    CommandLine|contains|all:
    - 'copy '
    - ' \\\\'
    CommandLine|contains:
    - '.dmp'
    - '.dump'
    - '.hdmp'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the use of the `copy` command in `cmd.exe` to transfer files with `.dmp` or `.dump` extensions from a remote share. These operations can be indicative of malicious activities, particularly in environments where attackers seek to exfiltrate sensitive data, such as memory dumps containing sensitive information like credentials and Active Directory session details. Attackers may leverage this technique to gather information that aids in furthering their objectives, potentially leading to credential access or lateral movement within the network.

  Relevant MITRE ATT&CK tactics for this detection include **Credential Access** (TA-0006) through techniques such as **Credential Dumping** (T1003). The use of memory dump files can provide attackers with valuable data to facilitate further exploits against user accounts or system credentials.

  Primary data sources for monitoring these activities include process creation event logs, which can capture when `cmd.exe` is invoked and what commands are executed, as well as potential network logs that may show suspicious outbound connections to a remote share.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for instances where `cmd.exe` was executed, examining the command line arguments used. Look specifically for the presence of the `copy` command and file extensions like `.dmp` or `.dump`.
  - **Analyze Network Share Access:** Investigate logs from network file shares to identify any abnormal `copy` command executions. Determine if the shares accessed were legitimate and if there were any exfiltration patterns.
  - **Investigate User Activity:** Correlate the command execution with user accounts involved in the activity. Look for unusual access patterns or accounts that should not typically have access to remote shares.
  - **Check for Other Signs of Compromise:** Beyond the file copy command, assess for any other suspicious activities on the endpoint, such as unusual process injections or connections to unknown domains.

  ### Prioritization
  Due to the high impact of exfiltrating sensitive information like memory dumps and the likelihood of it being exploited for credential harvesting, this alert is classified as high severity. Rapid response is crucial to mitigate potential breaches.

  ### Blind Spots and Assumptions
  The detection logic primarily relies on command line analysis and may not capture all instances of file copying, especially if alternative methods or tools are employed. Additionally, the detection assumes that file transfers over remote shares are typically unauthorized; if the environment's operational context allows such transfers, false positives may occur. Effective logging of process creation events must be configured accurately to ensure coverage for this alert to function effectively.

