title: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
id: 044ba588-dff4-4918-9808-3f95e8160606
status: test
description: Detects usage of the copy builtin cmd command to copy files with 
  the ".dmp"/".dump" extension from a remote share
references:
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-27
modified: 2023-09-12
tags:
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
    # Example: copy \\<host>\\<folder>\\process.dmp C:\Users\process.dmp
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
    CommandLine|contains|all:
    - 'copy '
    - ' \\\\'
    CommandLine|contains:
    - '.dmp'
    - '.dump'
    - '.hdmp'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the `copy` command within `cmd.exe` to transfer files with `.dmp` or `.dump` extensions from a remote share. The behavior suggests that an adversary may be attempting to extract sensitive memory dumps that could contain credentials or other sensitive information from compromised hosts. This activity aligns with the MITRE ATT&CK technique for Credential Access (T1003).

  Primary telemetry sources for this detection include Windows Process Creation events, specifically Security Event ID 4688, and relevant Sysmon Event ID 1 logs. If malicious, the security impact could be significant, as extracted memory dumps may provide attackers with exploitable information, leading to further compromise. It is important to note that this detection alone does not confirm malicious intent; benign usages of `copy` for legitimate maintenance or troubleshooting purposes may trigger it.

  ### Investigation Steps

  - **Examine the command line used**: Investigate the Security Event ID 4688 and Sysmon Event ID 1 logs for the exact `CommandLine` string used. Look for `copy \\<host>\\<folder>\\*.dmp` indicating an actual attempt to copy potentially sensitive files.

  - **Identify the source of the command**: Check the `User` and `Logon ID` fields in the event logs to determine which user executed the command. Analyze whether this user has a legitimate reason to access the remote location, especially if they do not typically work with such files.

  - **Review network connections**: Confirm any outbound connections to remote shares via Windows Security logs or Windows Firewall logs. Look for SMB traffic towards unusual IPs that may indicate lateral movement or data exfiltration.

  - **Validate legitimate usage**: Investigate instances when the `copy` command was used to ensure it aligns with documented IT practices. This can include regular system maintenance, supported by ticketing systems confirming user activities related to the copied files.

  - **Check for unusual patterns**: Look for repetitive or scripted execution of commands involving `copy` across multiple machines, particularly hosted on critical systems. Anomaly detection or behavioral analysis tools may help identify such patterns, indicating potential malicious automation.

  ### Prioritization

  This alert is of high severity due to the potential risk associated with accessing sensitive memory dumps that can contain critical credentials or data. The likelihood of malicious abuse increases given that copying memory dumps remotely is less common for routine operations, thus warranting thorough investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the absence of event logging for all command executions or by misconfigured logging policies, potentially leading to missed alerts. Legitimate administrative functions, particularly related to debugging or support, may also trigger this alert. Related detections, like those for abnormal process creation patterns around `cmd.exe` or PowerShell executing file operations, can strengthen coverage and help in identifying potential pivots in adversarial behavior.

