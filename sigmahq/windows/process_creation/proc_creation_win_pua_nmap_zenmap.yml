note: |
  ### Technical Context

  This rule detects the execution of Nmap and Zenmap, tools used for network discovery and security auditing. An attacker may utilize these tools to enumerate services on remote hosts, identifying potential vulnerabilities for exploitation. This behavior is categorized under the MITRE ATT&CK tactic of "Discovery" (TA0007) and the technique "Network Service Discovery" (T1046).

  The primary telemetry sources are Windows process creation logs, specifically the Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, Nmap or Zenmap can lead to further attacks through the identification of unpatched systems or services. However, this detection does NOT confirm an active attack on its own, as these tools may also be used legitimately by administrators for network assessments.

  ### Investigation Steps

  - **Review process execution logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 to identify the execution of `nmap.exe` or `zennmap.exe`. Validate that the command line parameters align with known reconnaissance techniques.

  - **Assess the user context**: Determine the user account that executed the tools. Legitimate administrators usually run such tools from administrative accounts or specific management servers.

  - **Correlate with network traffic**: Analyze network logs for signs of scanning activity, such as numerous SYN packets targeting multiple hosts. Look for patterns indicating port scanning rather than typical traffic behavior.

  - **Identify recent network changes**: Review logs for any major changes in the environment (e.g., network configuration adjustments). These might justify legitimate scans initiated by IT personnel.

  - **Check for lateral movement attempts**: Investigate any subsequent network connections made after the scans, looking for unusual access from the scanning host to sensitive systems.

  - **Review false positive scenarios**: Identify any known legitimate use cases or scheduled tasks involving these tools. Documentation or IT tickets may support such activities, distinguishing benign from malicious intent.

  ### Prioritization

  This alert is medium severity. While the systems affected may not be critical, the likelihood of malicious abuse is notable due to the common utility of these tools for reconnaissance by attackers. Such behavior can be a precursor to space for further exploitation if vulnerabilities are found.

  ### Blind Spots and Assumptions

  Detection may have limitations if process creation auditing is misconfigured or disabled entirely. Nmap-like scanning could arise from legitimate security assessments or automated tools, causing potential false positives. Related detections, such as unusual connection attempts to external IPs following Nmap execution, could provide better coverage of potential malicious behavior.

