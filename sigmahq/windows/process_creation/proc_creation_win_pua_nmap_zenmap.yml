note: |
  ### Technical Context
  This detection rule targets the execution of Nmap and Zenmap, two widely used network scanning tools. Attackers may utilize these tools to discover hosts and services within a network, which is a critical step for identifying potential weak points for further exploitation. The overview of scanning includes probing for open ports, services running on those ports, and potentially vulnerable applications, thereby allowing adversaries to establish footholds or escalate privileges within the environment.

  The associated MITRE ATT&CK tactics include **Discovery** (TA0007), with the relevant technique being **Network Service Scanning** (T1046). By harvesting information about the network's configuration, an adversary can tailor their attacks to exploit identified vulnerabilities, making this a significant precursor to more severe compromise activities.

  For detection, the primary data source will be **process creation events** on Windows systems. Monitoring these logs will provide insight into potentially malicious network scanning activity, particularly when tied to known attack tools such as Nmap.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation logs for entries related to `nmap.exe` or `zenmap.exe` that may indicate unauthorized scanning activity.
  - **Analyze Network Traffic**: Inspect network traffic logs, especially inbound/outbound connections corresponding to the execution time, to identify any suspicious scanning patterns or unusually high traffic to specific IP addresses.
  - **Assess User Context**: Determine the user context under which Nmap or Zenmap was executed. Investigate if the process was initiated by accounts that should not typically engage in network reconnaissance.
  - **Correlate with Vulnerability Scans**: Cross-reference any identified scans with vulnerability management processes or scanning schedules to differentiate between legitimate administrative actions and potential malicious activity.

  ### Prioritization
  This alert is rated as medium severity because while the execution of Nmap or Zenmap could indicate legitimate administrative activities, its presence often signifies reconnaissance efforts that can precede attacks. Depending on the organization's exposure and asset criticality, the likelihood of exploitation increases.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where process creation logging is not enabled or where legitimate users frequently employ these tools for valid purposes, potentially resulting in false positives. The rule assumes that no legitimate scanning processes by authorized personnel will be included in the detection logic. For this alert to function effectively, it is essential to ensure that process creation logs are consistently captured and analyzed across all relevant systems.

