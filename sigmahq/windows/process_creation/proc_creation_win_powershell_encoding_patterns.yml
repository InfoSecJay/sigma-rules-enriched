logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_to_1:
    CommandLine|contains:
    - 'ToInt'
    - 'ToDecimal'
    - 'ToByte'
    - 'ToUint'
    - 'ToSingle'
    - 'ToSByte'
  selection_to_2:
    CommandLine|contains:
    - 'ToChar'
    - 'ToString'
    - 'String'
  selection_gen_1:
    CommandLine|contains|all:
    - 'char'
    - 'join'
  selection_gen_2:
    CommandLine|contains|all:
    - 'split'
    - 'join'
  condition: selection_img and (all of selection_to_* or 1 of selection_gen_*)
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects PowerShell commands utilizing specific encoding methods through combinations of function names often associated with obfuscation techniques, such as `ToInt`, `ToString`, and various string manipulation functions. The likely objective of an attacker is to conceal malicious activity during execution and to evade detection mechanisms by making the commands less human-readable.

  This behavior fits within the MITRE ATT&CK tactics of **Execution (T1203)** and **Obfuscated Files or Information (T1027)**. Primary telemetry sources include Windows process creation logs, specifically Security Event IDs 4688 and Sysmon Event ID 1, capturing the command-line arguments used in executing PowerShell. If malicious, this behavior could indicate unauthorized script execution or malware delivery. Importantly, this detection does NOT confirm malicious intent without further contextual investigation, as legitimate PowerShell scripts may utilize similar function calls in common administrative tasks.

  ### Investigation Steps

  - **Check for related PowerShell activity:** Review Security Event ID 4688 for `powershell.exe` or `pwsh.exe` execution events with similar command-line patterns. Look for any prior or ongoing processes to identify potentially scripted behavior.

  - **Analyze command-line parameters:** Investigate the CommandLine field for occurrences of functions like `ToInt`, `ToString`, or any combined usage with `char` and `join`. An unknown or unexpected combination of these functions may suggest malicious intent.

  - **Correlate with other security events:** Look for additional Event IDs (e.g., 4104 for PowerShell script block logging) to see the context of the command execution. This aids in distinguishing between automated tasks and potentially harmful execution.

  - **Identify benign use cases:** Understand regular usage of PowerShell in your environment. Document typical legitimate commands used for administrative purposes and compare them against detected commands.

  - **Validate file creation or downloading:** If the command involves downloading scripts or executing commands that could stage files, verify if new files were created (using File System Event IDs, e.g., 4663). Look for suspicious file types or unexpected paths.

  ### Prioritization

  This alert should be treated with moderate severity due to its potential impact if it indicates malicious behavior, especially in environments with high administrative privilege systems. The likelihood of exploitation increases if found in high-value assets or critical systems, and while this specific technique may not always be weaponized, the underlying patterns align with known obfuscation tactics.

  ### Blind Spots and Assumptions

  This detection may have limitations as skilled adversaries often employ techniques to evade such detections, like using different encoding methods or legitimate tools. The reliability of detection hinges on ensuring comprehensive logging from PowerShell executions and proper logging configurations. Legitimate administrative activities, such as script execution for automation, may inadvertently trigger this alert. Companion detections such as PowerShell script block logging (Event ID 4104) could enhance monitoring effectiveness for obfuscated execution tactics.

