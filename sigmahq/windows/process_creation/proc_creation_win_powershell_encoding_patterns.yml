title: Potential Encoded PowerShell Patterns In CommandLine
id: cdf05894-89e7-4ead-b2b0-0a5f97a90f2f
related:
- id: 5b572dcf-254b-425c-a8c5-d9af6bea35a6
  type: similar
status: test
description: Detects specific combinations of encoding methods in PowerShell via the
  commandline
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=65
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
date: 2020-10-11
modified: 2023-01-26
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_to_1:
    CommandLine|contains:
    - 'ToInt'
    - 'ToDecimal'
    - 'ToByte'
    - 'ToUint'
    - 'ToSingle'
    - 'ToSByte'
  selection_to_2:
    CommandLine|contains:
    - 'ToChar'
    - 'ToString'
    - 'String'
  selection_gen_1:
    CommandLine|contains|all:
    - 'char'
    - 'join'
  selection_gen_2:
    CommandLine|contains|all:
    - 'split'
    - 'join'
  condition: selection_img and (all of selection_to_* or 1 of selection_gen_*)
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies potential obfuscation techniques in PowerShell command lines. It specifically looks for the usage of encoding methods like `ToInt`, `ToDecimal`, and other functions that could indicate an attacker is attempting to hide malicious behavior from standard monitoring tools. PowerShell is frequently exploited by threat actors to execute unauthorized operations within a compromised environment, leveraging its scripting capabilities to perform actions that may not be immediately evident in system logs.

  The threat scenario revolves around an attacker who aims to execute malicious scripts while evading detection through command line obfuscation. This could involve executing payloads for data exfiltration, lateral movement, or other nefarious activities. Notable MITRE ATT&CK techniques relevant here include:
  - **T1027** - Obfuscated Files or Information: Attackers often encode or obfuscate their scripts to bypass security measures.
  - **T1059.001** - PowerShell: This directly relates to the execution of PowerShell commands and scripts as part of the attack vector.

  Key telemetry sources that provide evidence for this detection include process creation events, which capture the command lines issued by PowerShell, as they provide insights into the parameters and arguments being executed.

  ### Investigation Steps
  - **Review Process Creation Events**: Collect logs of process creation events specifically looking at PowerShell processes triggered with suspicious command line arguments.
  - **Analyze Command Line Arguments**: Investigate the full command lines for running PowerShell instances that contain encoding functions or manipulations (e.g., `ToInt`, `ToString`).
  - **Cross-reference Execution Context**: Correlate the identified PowerShell executions with user accounts and machine context to determine if these actions were executed under legitimate circumstances.
  - **Conduct Anomaly Detection**: Look for patterns of usage that deviate from typical behavior, such as usage during unusual hours or from accounts with limited permissions.

  ### Prioritization
  The severity of this alert is considered low due to the possibility of benign use of PowerShell with encoded commands; however, vigilant analysis is necessary because such patterns can indicate attempts to conceal malicious activities, warranting investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by missing or misconfigured process creation logging, which could fail to capture PowerShell execution details. Additionally, the analysis assumes that the command line patterns being monitored are sufficiently indicative of malicious intent, without accounting for the variance in legitimate use cases of PowerShell in an enterprise environment. Proper logging configuration and retention policies must be ensured for this alert to function effectively.

