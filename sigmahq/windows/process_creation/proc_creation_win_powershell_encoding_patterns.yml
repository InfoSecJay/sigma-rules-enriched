logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_to_1:
    CommandLine|contains:
    - 'ToInt'
    - 'ToDecimal'
    - 'ToByte'
    - 'ToUint'
    - 'ToSingle'
    - 'ToSByte'
  selection_to_2:
    CommandLine|contains:
    - 'ToChar'
    - 'ToString'
    - 'String'
  selection_gen_1:
    CommandLine|contains|all:
    - 'char'
    - 'join'
  selection_gen_2:
    CommandLine|contains|all:
    - 'split'
    - 'join'
  condition: selection_img and (all of selection_to_* or 1 of selection_gen_*)
falsepositives:
- Unknown
level: low
note: |
  ---

  ### Technical Context

  This rule detects potentially encoded PowerShell patterns in the command line used for executing PowerShell scripts (powershell.exe or pwsh.exe). Attackers utilize these encoded patterns to obfuscate commands that may execute malicious actions such as data exfiltration or file downloads. The relevant MITRE ATT&CK tactics and techniques are **Defense Evasion (T1027)** and **Execution (T1059.001)**. The primary telemetry source is Windows process creation logs (Event ID 4688), which capture command-line arguments used in process launches.

  If malicious, this behavior could indicate an attempt to bypass security controls and execute payloads stealthily. However, this detection does NOT independently confirm malicious activity as legitimate processes may also exhibit similar command-line patterns for legitimate automation or administrative tasks.

  ---

  ### Investigation Steps

  - **Check Command Line Arguments:** Review the command line arguments for Event ID 4688 to identify the presence of specific terms such as `ToInt`, `ToByte`, `char`, `join`, etc. Look for malicious command structures or unexpected usage patterns.

  - **Validate Process Origin:** Confirm the legitimacy of the PowerShell process by examining the ParentProcessId field of Event ID 4688. A PowerShell instance spawned from an unusual parent process may indicate suspicious activity.

  - **Analyze Process Creation Source:** Inspect the source of the PowerShell execution. For example, commands originating from known administrative scripts or scheduled tasks are typically legitimate, while those launched from uncommon users may warrant further investigation.

  - **Identify High-Confidence Malicious Indicators:** Pay special attention to command lines that contain both encoded string operations (like `split` and `join`) in combination; such patterns are often indicative of data manipulation or command obfuscation.

  - **Document Expected Legitimate Use:** Reference internal documentation to distinguish valid PowerShell automation use. For instance, IT teams may routinely execute scripts with specific parameters for system updates, which can help contextualize the alert.

  - **Monitor for Execution Frequency:** Analyze the frequency and timing of these PowerShell command executions over time. Unusual spikes or occurrences outside of established schedules may indicate an attempted breach.

  ---

  ### Prioritization

  This alert should be considered low severity in a mature enterprise context as the direct impact primarily concerns potential evasive actions rather than immediate system compromise. However, given that PowerShell is commonly weaponized for attacks, the likelihood of malicious abuse remains significant and warrants timely investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of PowerShell, which can inadvertently trigger this rule. It's vital to ensure all necessary process creation logging is enabled to capture accurate command-line inputs. Additionally, encoded PowerShell commands might be used in benign contexts, such as automated scripts. A companion rule monitoring for PowerShell execution without expected codification patterns can augment detection capabilities.

