logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_to_1:
    CommandLine|contains:
    - 'ToInt'
    - 'ToDecimal'
    - 'ToByte'
    - 'ToUint'
    - 'ToSingle'
    - 'ToSByte'
  selection_to_2:
    CommandLine|contains:
    - 'ToChar'
    - 'ToString'
    - 'String'
  selection_gen_1:
    CommandLine|contains|all:
    - 'char'
    - 'join'
  selection_gen_2:
    CommandLine|contains|all:
    - 'split'
    - 'join'
  condition: selection_img and (all of selection_to_* or 1 of selection_gen_*)
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that include specific combinations of encoding functions, indicating potential obfuscation techniques commonly used in malicious scripts. The likely attacker objective is to execute payloads or commands while avoiding detection by signature-based systems. This behavior primarily aligns with the MITRE ATT&CK techniques for defense evasion (T1027) and command and control (T1059.001).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on PowerShell execution via Event ID 4688 or Sysmon Event ID 1. If malicious, such activities can lead to unauthorized access, data exfiltration, or further compromise of systems. However, this detection does NOT confirm that the behavior is malicious on its own; further context is necessary to determine intent.

  ### Investigation Steps

  - **Check for PowerShell process execution:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances where 'powershell.exe' or 'pwsh.exe' is the image name. Look for unusual execution patterns or arguments that are not typical for your environment.

  - **Analyze command line arguments:** Investigate the CommandLine field associated with the detected process. Note any occurrences of encoding functions like 'ToInt', 'ToDecimal', or 'ToString'. Benign usage is often associated with system maintenance or scripting tasks, while frequent or unexplained usage may indicate malicious intent.

  - **Correlate with known baselines:** Compare the detected command behavior against legitimate PowerShell usage patterns in your organization, including standard scripts and administrative tasks. Identify differences that might suggest unauthorized behavior.

  - **Identify high-confidence indicators.** Check for incomplete or often-used command-patterns that involve 'char', 'join', 'split', etc. that are combined with obfuscation techniques. Legitimate commands typically refrain from excessive string manipulations without clear intent.

  - **Validate against the asset role:** Ensure that the source host is justified for executing PowerShell commands with the detected patterns. For high-privilege systems, any such invocation should be thoroughly validated.

  - **Monitor for related artifacts:** Search for file creation or modification events that could indicate secondary payload drops (e.g., Event ID 4608). Ensure you correlate these with the timing of PowerShell execution to identify potential file-based malware following the command execution.

  ### Prioritization

  This alert should be treated with moderate severity in a mature enterprise context. While the presence of suspicious encoding patterns in PowerShell commands suggests an increased likelihood of malicious abuse, further investigation is needed to determine if the actions are part of a wider threat campaign. This behavior is known to be leveraged by adversaries for post-exploitation activities.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from legitimate administrative scripting and automated maintenance tasks that might use similar encoding. Required log sources, specifically Sysmon and Security Event logs, must be accurately configured for effective monitoring. Legitimate administrative PowerShell activity could trigger this alert if the command uses similar encoding functions for benign purposes. A related detection to strengthen coverage would be monitoring for unusual file modifications in conjunction with PowerShell command execution, which could proactively catch file droppers or secondary payloads.

