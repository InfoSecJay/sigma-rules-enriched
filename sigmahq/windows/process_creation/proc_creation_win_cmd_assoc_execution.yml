note: |
  ### Technical Context

  This rule detects the use of the built-in `assoc` command to change file associations via Windows command line. Attackers may use this behavior to associate file extensions with malicious executables, potentially allowing malware to run when a user opens a seemingly benign file type. The relevant MITRE ATT&CK technique is **T1546.001: Event Triggered Execution: Default File Association Hijacking**.

  The primary telemetry source is process creation logs, specifically monitoring Windows Event ID 4688 and Sysmon Event ID 1. If executed maliciously, this action could lead to unauthorized code execution or persistence mechanisms being established. It is important to note that this detection does not confirm malicious intent on its own—administrative users may legitimately modify file associations.

  ### Investigation Steps

  - **Review process creation logs:** Search for Windows Event ID 4688 and Sysmon Event ID 1 for processes initialized by `cmd.exe` where the CommandLine contains `assoc`. Look for unusual timestamps or unexpected users.

  - **Validate user context:** Determine if the user executing the command has administrative privileges. Legitimate administrative tasks that may use `assoc` typically align with scheduled system maintenance or user support activities.

  - **Correlate with registry changes:** Investigate changes to file association settings in the Windows Registry at `HKEY_CLASSES_ROOT` or `HKEY_CURRENT_USER\Software\Microsoft\Windows\Shell\Associations\UrlAssociations`. Check for recent modifications that correspond with the `assoc` command execution.

  - **Identify malicious indicators:** Look for command lines that involve associating file types typically tied to executables or scripts (e.g., `.exe`, `.bat`, `.vbs`) with unexpected programs. For example, `assoc .exe=malicious_executable`.

  - **Assess asset criticality:** Consider the role of the affected host within the organization. For example, file association changes on a web server or endpoint with high user privileges pose a higher risk than on low-tier assets.

  ### Prioritization

  The alert severity is low due to the potential for benign administrative activity; however, any change to file associations warrants investigation to rule out malicious intent. Given that association changes can be weaponized, particularly in persistence scenarios, this behavior should still be monitored closely.

  ### Blind Spots and Assumptions

  This detection could be evaded by PowerShell scripts or other methods to modify file associations without generating the expected logs, such as direct registry edits. Reliable detection requires that process creation logging is enabled and properly configured to capture `cmd.exe`. Legitimate administrative actions, such as creating user training environments, might unearth similar behaviors. A related detection for command-line initiated PowerShell scripts (e.g., detecting `powershell.exe` modifications to file associations) could strengthen coverage in this context.

