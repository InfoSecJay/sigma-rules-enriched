title: Direct Autorun Keys Modification
id: 24357373-078f-44ed-9ac4-6d334a668a11
status: test
description: Detects direct modification of autostart extensibility point (ASEP) in
  registry using reg.exe.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: Victor Sergeev, Daniil Yugoslavskiy, oscd.community, Swachchhanda Shrawan
  Poudel (Nextron Systems)
date: 2019-10-25
modified: 2026-01-05
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_cli_add:
    CommandLine|contains: 'add'         # to avoid intersection with discovery tactic rules
  selection_cli_keys:
    CommandLine|contains:               # need to improve this list, there are plenty of ASEP reg keys
    - '\software\Microsoft\Windows\CurrentVersion\Run'         # Also covers the strings "RunOnce", "RunOnceEx", "RunServices", "RunServicesOnce"
    - '\software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
    - '\software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit'
    - '\software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell'
    - '\software\Microsoft\Windows NT\CurrentVersion\Windows'
    - '\system\CurrentControlSet\Control\SafeBoot\AlternateShell'
  condition: all of selection_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reasons.
- Legitimate administrator sets up autorun keys for legitimate reasons.
- Discord
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications made to autostart extensibility points (ASEPs) in the Windows registry through the use of `reg.exe`. By monitoring the execution of `reg.exe` with command-line parameters indicating the addition of keys associated with autorun functionality, the rule aims to catch potential attempts by attackers to establish persistence on compromised systems. One common tactic employed by malicious actors involves altering these registry keys to ensure that malicious code runs automatically upon system startup or user login.

  Attackers often modify ASEPs to maintain access to a system even after reboots or user logouts, thereby facilitating longer-term control over the environment. Understanding the context of such changes is critical, as they are frequently layered into broader attack campaigns, including lateral movement and privilege escalation strategies. This rule aligns with the MITRE ATT&CK framework, particularly under the tactics of *Persistence* (TA0003) and *Privilege Escalation* (TA0004), specifically targeting technique T1547.001, which relates to the modification of autorun entries.

  Primary data sources for this alert include process creation logs capturing the execution of `reg.exe`, with details on command-line arguments that reveal suspicious activities, and potentially system event logs that facilitate broader context for changes made in the Windows registry.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs for instances of `reg.exe` being executed with command-line arguments indicating modifications to autorun keys. Pay particular attention to the context in which these commands were run (e.g., user accounts, times).

  - **Examine Registry Modifications**: Confirm and audit the actual changes to the relevant registry keys identified in the rule. Focus on keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` and similar paths, checking for unexpected or unauthorized entries.

  - **Correlate with User Activity**: Look into user activity logs to determine if the modifications correlate with legitimate administrative tasks or if they align with unauthorized access or anomalies in user behavior.

  - **Check for Automation Tools**: Investigate the environment for any software or scripts that may legitimately modify autorun settings. Ensure there is a clear distinction between authorized changes and potential malicious attempts.

  ### Prioritization
  This alert is considered of medium severity due to the potential impact of persistence mechanisms on compromised systems. While not all AutoRun modifications are malicious, the act of using `reg.exe` in this way raises the likelihood of an attacker attempting to establish footholds within the environment, warranting timely investigation.

  ### Blind Spots and Assumptions
  This rule may miss detection if legitimate software or administrative actions modify autorun keys without generating alerts. Additionally, the detection logic assumes a certain knowledge of the commands and patterns indicative of malicious use of `reg.exe`. Effective operation of this alert relies on comprehensive logging of process creation events and detailed command-line arguments; environments lacking thorough monitoring or registry auditing may not provide sufficient evidence for alerts to trigger consistently.

