title: Direct Autorun Keys Modification
id: 24357373-078f-44ed-9ac4-6d334a668a11
status: test
description: Detects direct modification of autostart extensibility point (ASEP)
  in registry using reg.exe.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: Victor Sergeev, Daniil Yugoslavskiy, oscd.community, Swachchhanda 
  Shrawan Poudel (Nextron Systems)
date: 2019-10-25
modified: 2026-01-05
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_cli_add:
    CommandLine|contains: 'add'         # to avoid intersection with discovery tactic rules
  selection_cli_keys:
    CommandLine|contains:               # need to improve this list, there are plenty of ASEP reg keys
    - '\software\Microsoft\Windows\CurrentVersion\Run'         # Also covers the strings "RunOnce", "RunOnceEx", "RunServices", "RunServicesOnce"
    - '\software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
    - '\software\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit'
    - '\software\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell'
    - '\software\Microsoft\Windows NT\CurrentVersion\Windows'
    - '\system\CurrentControlSet\Control\SafeBoot\AlternateShell'
  condition: all of selection_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reasons.
- Legitimate administrator sets up autorun keys for legitimate reasons.
- Discord
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized modifications to autostart extensibility points (ASEPs) in the Windows registry, specifically through the execution of `reg.exe` with commands indicating the addition of new autorun keys. Attackers may exploit this method to establish persistence on the system, allowing malware to execute at startup without user intervention. The MITRE ATT&CK Tactic associated with this behavior is **Persistence (TA0003)**, using the technique **Create or Modify System Processes (T1547.001)**. Primary telemetry sources for this detection include Windows process creation logs (Event ID 4688 and Sysmon Event ID 1) showing the execution of `reg.exe` with specific command-line parameters. If malicious, this behavior could allow an adversary to maintain control of the compromised system. However, it is important to note that this detection does NOT confirm malicious intent on its own as legitimate software installations or administrator actions can also trigger these events.

  ### Investigation Steps

  - **Review process creation logs:** Investigate Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `reg.exe` being executed. Focus on the `CommandLine` field for signs of unexpected modifications to autorun keys.

  - **Correlate with registry changes:** Examine the Windows registry (HKEY_CURRENT_USER and HKEY_LOCAL_MACHINE) under the identified paths (e.g., `\software\Microsoft\Windows\CurrentVersion\Run`) to identify any recently added autorun entries that correspond to the alert's execution.

  - **Check for high-confidence malicious indicators:** Look for known malicious keys that have previously been associated with malware persistence, such as entries that point to suspicious executables or files in unusual directories.

  - **Identify legitimate behaviors:** Investigate if any recent modifications to autorun keys were made by authorized applications, like legitimate software updating or installation processes, to determine whether to escalate or dismiss the alert.

  - **Validate asset criticality:** Assess the role of the affected host within the environment. If it is a critical server hosting sensitive applications, prioritize this alert for immediate investigation.

  - **Monitor for repeat behaviors:** Check if there are multiple instances of similar autorun key modifications within a short time frame, as this could indicate an automated persistence mechanism by an adversary.

  ### Prioritization

  The alert's severity is medium due to potential impacts on critical systems if exploited for persistence. Given that the modification of autorun keys is a common technique used by adversaries for maintaining access, the likelihood of malicious abuse is significant, warranting careful investigation.

  ### Blind Spots and Assumptions

  This rule may have limitations, as attackers can employ evasion techniques such as modifying less common ASEPs or using different legitimate tools to create autorun entries. Ensure that logging for process creation and registry changes are enabled and properly configured to capture all relevant actions. Legitimate activities, such as software installations by system administrators, may also trigger this alert. A companion detection to consider is monitoring scripted activity (e.g., PowerShell scripts) that could also modify registry keys, enhancing overall detection capability for persistent threats.

