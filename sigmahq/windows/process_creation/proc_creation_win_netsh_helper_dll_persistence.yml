note: |
  ### Technical Context

  This rule detects the execution of `netsh.exe` with the "add helper" flag, which is used to add a custom helper DLL. This behavior is associated with malware persistence mechanisms, allowing adversaries to load malicious DLLs each time `netsh.exe` is invoked, effectively ensuring continued access to the system. The likely attacker objective is to establish persistence on the host and potentially escalate privileges by leveraging the helper DLL functionality.

  Relevant MITRE ATT&CK tactics and techniques include **Persistence (T1546.007)** and **Privilege Escalation (S0108)**. Primary telemetry sources include process creation logs from Windows, specifically looking at Event ID 4688 (Security) and Windows Sysmon Event ID 1. If malicious, this activity can lead to ongoing unauthorized access and manipulation of network configurations. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative tasks might warrant similar command usage.

  ### Investigation Steps

  - **Check command execution context**: Review Event ID 4688 logs for `netsh.exe` execution details. Check the `SubjectUserName` and ensure it corresponds to an expected or authorized admin account. Legitimate usage will typically involve expected commands executing in a valid administrative context rather than unusual or undocumented patterns.

  - **Analyze command-line arguments**: Verify the command-line parameters by examining the `CommandLine` field in Event ID 4688 or Sysmon Event ID 1 logs. Look for the presence of `add helper` which indicates a possible malicious intent as this is not typical for standard `netsh.exe` usage.

  - **Investigate loaded DLLs**: Use Sysmon Event ID 7 logs to check for DLL loads matching the helper DLL's name that was introduced via `netsh.exe`. Observe suspicious or unrecognized DLLs that could indicate malware. Validate that the DLL is signed and from a trusted source.

  - **Review parent process relationships**: Assess the parent process of the `netsh.exe` execution by querying the `ParentProcessId` field in the logs. Legitimate executions will typically be spawned by known administrative tools (e.g., Powershell, CMD). Suspicious parent processes may indicate malicious workflows.

  - **Monitor for subsequent execution**: Ensure no further invocations of `netsh.exe` occur that include references to the added helper DLL, as this may suggest established persistence. Check the system for scheduled tasks or other execution patterns related to the helper DLL across the environment.

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on the system's security posture through unauthorized persistence. The likelihood of malicious abuse is moderate, as this technique is weaponized by adversaries in sophisticated intrusions. While less common than direct exploitation methods, the execution of `netsh` in this manner can indicate a significant risk to network integrity and confidentiality.

  ### Blind Spots and Assumptions

  Detection may miss certain evasion techniques, such as the use of benign-sounding command-line arguments or privileged user activity performed by legitimate admins installing network configurations. Reliable detection requires proper configurations of process creation logging at the Windows security audit level, as well as Sysmon for advanced visibility. Legitimate software installations or administrative changes may trigger this alert. A related detection is monitoring for unusual PowerShell commands (MITRE ID T1059.001), which may indicate an initial compromise that led to this persistence technique.

