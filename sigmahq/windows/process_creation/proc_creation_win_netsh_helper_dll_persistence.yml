note: |
  ### Technical Context
  This rule detects the execution of the Windows command-line utility `netsh` when it is invoked with the "add helper" flag, which is commonly indicative of an attacker adding a malicious DLL for persistence purposes. Attackers may leverage this method to create a custom helper DLL that is automatically invoked whenever `netsh.exe` is executed, allowing them to maintain a foothold in the environment and potentially execute arbitrary code. The objectives of the attacker in this scenario typically involve gaining persistent access to the system and enabling further malicious activities such as exfiltration of data or lateral movement.

  The relevant MITRE ATT&CK tactics for this behavior include **Persistence** (TA0003) through the technique **Trusted Developer Utilities** (T1546.007). Additionally, the method may also involve *Privilege Escalation* (TA0004), depending on the context in which the attacker gains elevated privileges via the malicious DLL.

  The primary data sources that will contain valuable evidence for this rule are **process creation events** in Windows, which log the execution of processes along with their command line arguments. Analyzing these logs can reveal unusual or suspicious command executions that might indicate an attempt to exploit this persistence technique.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate logs for `netsh.exe` executions and examine the complete command line arguments used. Look specifically for occurrences of "add helper" to understand if malicious intent is present.

  - **Identify DLL Modifications**: Check the system for any newly added or modified DLLs in the directories associated with network configurations. This can help to confirm if a malicious DLL was registered with `netsh`.

  - **Correlate with User Activity**: Cross-reference the execution of `netsh.exe` with user activity logs to identify if the command was run by a known user or if it seems anomalous, potentially indicating an unauthorized access attempt.

  - **Monitor for Related Behavioral Indicators**: Keep an eye on subsequent `netsh` executions after the initial detection, as attackers might attempt to use the established persistence mechanism for further malicious actions.

  ### Prioritization
  This alert should be considered medium severity as it indicates a potential persistence mechanism that could be leveraged by an attacker to maintain access to the environment. The impact could escalate significantly if not addressed, especially considering the ability to execute arbitrary code.

  ### Blind Spots and Assumptions
  One gap in detection coverage could arise from environments where logging is not configured to capture process creation events adequately, leading to missed indicators of misuse. The detection logic assumes that the use of `netsh` with "add helper" flag represents malicious activity, which may not always be the case for legitimate administrative tasks. Proper logging configurations and monitoring practices should be ensured to capture the relevant process creation events for effective detection.

