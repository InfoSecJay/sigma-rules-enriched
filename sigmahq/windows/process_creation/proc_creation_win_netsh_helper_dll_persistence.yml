  ---

  ### Technical Context

  This Sigma rule detects the execution of the Windows command `netsh` with the `add helper` flag, which is used to add a custom DLL for netsh to load. Attackers exploit this capability to establish persistence on compromised hosts by introducing malicious helper DLLs that execute when netsh is run. This behavior aligns with the MITRE ATT&CK technique **T1546.007 (Event Triggered Execution: Dynamic Link Library [DLL] Side-Loading)**. The primary telemetry source for this detection is process creation logs, specifically those that indicate the execution of `netsh.exe` with a command line containing both the `add` and `helper` parameters.

  If the activity is confirmed as malicious, it poses a substantial risk to the integrity and security of the host system by allowing an attacker to maintain operational control. This detection does NOT, by itself, confirm malicious intent, as the legitimate use of netsh to configure networking settings can include adding helper DLLs.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 for the execution of `netsh.exe`. Ensure the command line contains both `add` and `helper` parameters to confirm potential malicious activity.

  - **Identify Malicious DLLs:** Search the file system for DLLs registered as helpers in the registry under `HKLM\SYSTEM\CurrentControlSet\Services\Netcfg\Parameters` and cross-check any unrecognized or unusual DLLs with known malware hashes.

  - **Inspect for Previous Executions:** Analyze Sysmon Event ID 1 for detailed process trees leading to the execution of `netsh.exe`. Look for suspicious parent processes or services that executed `netsh`.

  - **Review Legitimate Use Cases:** Validate instances of `netsh` usage within your environment. Legitimate configurations should log typical network changes, not unusual DLL insertions. Document expected command line patterns.

  - **Monitor for Follow-On Activities:** Investigate subsequent executions of `netsh.exe` and other processes that utilize the added helper DLL. Look for unusual outbound connections via tools like firewall logs or network analysis.

  - **Assess Host Roles:** Evaluate the criticality of the affected system (e.g., domain controllers, endpoints handling sensitive data) and the potential impact of a compromise in that context.

  ---

  ### Prioritization

  The alert is of medium severity due to the elevated privilege required to execute this command. While the likelihood of exploitation is moderate, the use of `netsh` for establishing persistence is a known technique among adversaries and warrants prompt investigation. The potential impact of a successful attack on critical assets can be significant.

  ---

  ### Blind Spots and Assumptions

  This rule may miss detections if the logs for process creation are not configured properly or if the execution of `netsh` is obscured by valid administrative tasks. Legitimate activities, such as network configuration updates by system administrators, may trigger this alert. Related detection rules, such as those detecting unusual DLL registrations or file modifications on system directories, can provide additional context to strengthen coverage.

