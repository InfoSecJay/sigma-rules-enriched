title: Potentially Suspicious Powershell Script Execution From Temp Folder
id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
status: test
description: Detects a potentially suspicious powershell script executions from 
  temporary folder
references:
- https://www.microsoft.com/security/blog/2021/07/13/microsoft-discovers-threat-actor-targeting-solarwinds-serv-u-software-with-0-day-exploit/
author: Florian Roth (Nextron Systems), Max Altgelt (Nextron Systems), Tim 
  Shelton
date: 2021-07-14
modified: 2026-02-17
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    CommandLine|contains:
    - '\Windows\Temp'
    - '\Temporary Internet'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming\Temp'
    - '%TEMP%'
    - '%TMP%'
    - '%LocalAppData%\Temp'
  filter_optional_vscode:
    CommandLine|contains: '-WindowStyle hidden -Verb runAs'
  filter_optional_amazon_ec2:
    CommandLine|contains: '\Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\'
  filter_optional_generic:
    CommandLine|contains:
    - ' >'
    - 'Out-File'
    - 'ConvertTo-Json'
  filter_optional_chocolatey_installer:
    ParentImage:
    - 'C:\Windows\System32\Msiexec.exe'
    - 'C:\Windows\SysWOW64\Msiexec.exe'
    Image|endswith: '\powershell.exe'
    CommandLine|contains|all:
    - '-NoProfile -ExecutionPolicy Bypass -Command'
    - 'AppData\Local\Temp\'
    - 'Install-Chocolatey.ps1'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Administrative scripts
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_script_exec_from_temp_folder/info.yml
note: |
  ### Technical Context

  This Sigma rule detects suspicious execution of PowerShell scripts run from temporary folders, which are often associated with malicious activity, such as script-based exploits or malware deployment. The likely attacker objective is to execute commands in a way that evades detection by executing them from locations typically used for transient files. The relevant MITRE ATT&CK tactic is Execution (TA0002) and technique is Command and Scripting Interpreter: PowerShell (T1059.001). Primary telemetry sources include process creation logs, particularly Windows Event ID 4688, and Sysmon Event ID 1, capturing command-line arguments and parent process information. If malicious, this behavior could lead to system compromise or data exfiltration. This detection does NOT confirm malicious intent by itself, as it can result from legitimate administrative activities.

  ### Investigation Steps

  - **Review process creation events**: Check for Event ID 4688 and Sysmon Event ID 1 with CommandLine containing paths to temporary directories like `C:\Windows\Temp` or `%TEMP%`. Look for any unusual or unexpected command syntax that deviates from normal operations.

  - **Assess command-line specifics**: Identify instances where PowerShell is invoked with parameters like `-WindowStyle hidden -Verb runAs`. These indicators suggest attempts to run scripts without user interaction, raising the likelihood of malicious intent.

  - **Check parent processes**: For instances of PowerShell execution from `C:\Windows\System32\Msiexec.exe`, verify that the associated command line includes `Install-Chocolatey.ps1` and had the arguments `-NoProfile -ExecutionPolicy Bypass`. This could indicate suspicious installation activity rather than standard application usage.

  - **Identify benign use cases**: Legitimate actions may include administrative scripts or maintenance tasks executed by SAAS management tools, often logging their actions in dedicated folders or using manifest files for reference.

  - **Correlate with other activity**: If there are lateral movement or credential dumping activities (e.g., logs showing RDP usage), correlate these events with the PowerShell execution to assess attacker behavior and intentions.

  ### Prioritization

  This alert should be treated with medium severity given the contained impact primarily on user systems. While malicious abuse is likely if the behavior is unsolicited, it is also commonplace for legitimate administrative operations. However, attackers commonly exploit this technique, making it critical to investigate promptly.

  ### Blind Spots and Assumptions

  Detection is limited by potential use of obfuscation techniques in the command line, which can mask malicious intent. Required log sources include Sysmon for complete visibility of process executions, especially when PowerShell is involved. Legitimate administrative scripts often lead to similar command patterns and could trigger this alert. A companion detection rule around unusual PowerShell module imports would enhance coverage and help identify related malicious activities effectively.

