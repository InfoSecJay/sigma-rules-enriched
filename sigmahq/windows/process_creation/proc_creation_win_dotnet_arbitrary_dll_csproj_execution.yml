title: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
status: test
description: Detects execution of arbitrary DLLs or unsigned code via a 
  ".csproj" files via Dotnet.EXE.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dotnet/
- https://twitter.com/_felamos/status/1204705548668555264
- https://bohops.com/2019/08/19/dotnet-core-a-vector-for-awl-bypass-defense-evasion/
author: Beyu Denis, oscd.community
date: 2020-10-18
modified: 2025-10-08
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\dotnet.exe'
  - OriginalFileName: '.NET Host'
  selection_cli:
    CommandLine|endswith:
    - '.csproj'
    - '.csproj"'
    - '.dll'
    - '.dll"'
    - ".csproj'"
    - ".dll'"
  filter_optional_notepadplus_plus:
    ParentImage:
    - 'C:\Program Files (x86)\Notepad++\notepad++.exe'
    - 'C:\Program Files\Notepad++\notepad++.exe'
    CommandLine|contains|all:
    - 'C:\ProgramData\CSScriptNpp\'
    - '-cscs_path:'
    - '\cs-script\cscs.dll'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administrator usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of arbitrary DLLs or unsigned code via `.csproj` files using `dotnet.exe`. Attackers may leverage this behavior to execute malicious scripts or payloads without detection, typically aiming to take control of the system, deploy additional malware, or exfiltrate data. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005), specifically the technique for Executing CLI Commands (T1218).

  The primary telemetry source is Windows process creation events, particularly Event ID 4688 from the Security log, as well as Sysmon Event ID 1. If malicious, successful execution may lead to deeper persistence or lateral movement within the environment. Notably, this detection does NOT confirm malicious intent on its own; legitimate use of `dotnet.exe` for valid applications or developer work may trigger the rule.

  ### Investigation Steps

  - **Check process creation details**: Review Security Event ID 4688 and Sysmon Event ID 1 for the `dotnet.exe` process creation. Look for command lines that end in `.csproj` or `.dll`, indicating possible malicious execution.

  - **Identify suspicious parent processes**: Examine the ParentImage field in Event ID 4688. Legitimate executions may originate from known development environments (e.g., Visual Studio). Anomalous parent processes should be treated as a red flag.

  - **Scrutinize command line arguments**: Investigate any command lines containing `'-cscs_path:'` or paths leading to unusual directories such as `C:\ProgramData\CSScriptNpp\`. Malicious usage often involves obscure paths or unfamiliar DLLs.

  - **Review potential signatures of compromise**: High-confidence malicious indicators include unusual parent processes spawning `dotnet.exe` with this command line syntax or paths not normally utilized within corporate environments (e.g., temp directories).

  - **Validate expected behavior**: Cross-reference with known legitimate usage, such as software development or scripts run by authorized personnel. Authorized development activity will typically involve recognized script headers or established project paths.

  - **Analyze file creation/execution artifacts**: Look for file creation events or modifications in directories involved (e.g., the directory where the script DLL resides). Check for unusual file timestamps or unexpected file types created by the execution.

  ### Prioritization

  The alert carries medium severity due to potential impacts on critical systems, especially when execution occurs in sensitive environments like production servers. The likelihood of abuse is moderate, given that unauthorized DLL executions are a common tactic for malicious actors.

  ### Blind Spots and Assumptions

  This detection may have limitations around false positives from legitimate administrative or development activities targeting `.csproj` files. Reliable detection requires complete process creation logs, as incomplete logging may miss relevant events. Common legitimate activities such as routine software development or updates may trigger this alert, which should be easily distinguishable from unauthorized executions. A companion detection rule for monitoring unauthorized use of `powershell.exe` could strengthen coverage against execution paths leveraged during attacks.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
