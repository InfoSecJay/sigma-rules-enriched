title: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
status: test
description: Detects execution of arbitrary DLLs or unsigned code via a ".csproj"
  files via Dotnet.EXE.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dotnet/
- https://twitter.com/_felamos/status/1204705548668555264
- https://bohops.com/2019/08/19/dotnet-core-a-vector-for-awl-bypass-defense-evasion/
author: Beyu Denis, oscd.community
date: 2020-10-18
modified: 2025-10-08
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\dotnet.exe'
  - OriginalFileName: '.NET Host'
  selection_cli:
    CommandLine|endswith:
    - '.csproj'
    - '.csproj"'
    - '.dll'
    - '.dll"'
    - ".csproj'"
    - ".dll'"
  filter_optional_notepadplus_plus:
    ParentImage:
    - 'C:\Program Files (x86)\Notepad++\notepad++.exe'
    - 'C:\Program Files\Notepad++\notepad++.exe'
    CommandLine|contains|all:
    - 'C:\ProgramData\CSScriptNpp\'
    - '-cscs_path:'
    - '\cs-script\cscs.dll'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administrator usage
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious behavior involving the execution of arbitrary Dynamic Link Libraries (DLLs) or unsigned code via `.csproj` (C Sharp Project) files using the `dotnet.exe` utility. Attackers may exploit this vector to execute code in an effort to bypass security controls and achieve their objectives, such as installing backdoors, executing payloads, or leveraging remote access tools. The rule aims to recognize instances where `dotnet.exe` is used in ways that deviate from typical administrative practices, particularly when associated with project files and libraries that may not have been properly vetted.

  Relevant MITRE ATT&CK tactics and techniques involved include:
  - **Defense Evasion (TA0005)**: Techniques aimed at avoiding detection by security solutions.
  - **Command and Scripting Interpreter (T1059)**: Specifically using `dotnet` as a command line interface for executing scripts or programs.

  The primary data sources for evidence collection include:
  - **Process Creation Events**: Monitoring processes initiated on Windows systems where `dotnet.exe` is invoked.
  - **CommandLine Arguments**: Analysis of command line arguments passed to `dotnet.exe` during execution to identify potentially harmful invocations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation logs for `dotnet.exe` executions, paying close attention to command line arguments that include `.csproj` or `.dll` extensions.
  - **Analyze Command Line Arguments**: Scrutinize the command line arguments for any unusual patterns or unexpected file paths that may indicate malicious intent, especially focusing on paths that are not common for legitimate enterprise applications.
  - **Investigate Parent Processes**: Trace the parent processes associated with `dotnet.exe` to determine if they originate from known trusted applications or if they are initiated by suspicious or unexpected software.
  - **Correlate with System Changes**: Look for related changes to the file system or registry that coincide with the execution of the identified commands, which may provide additional context or indicators of compromise.

  ### Prioritization
  The medium severity assessment of this alert is justified, as arbitrary DLL execution can circumvent traditional security mechanisms. While it is less common in typical enterprise operations, successful exploitation can lead to significant security breaches and thus warrants prompt investigation.

  ### Blind Spots and Assumptions
  There are potential detection gaps, particularly concerning legitimate administrative usage of `dotnet.exe` during regular software development or maintenance tasks. The detection logic assumes that all instances of `dotnet.exe` tied to `.csproj` or `.dll` outputs are suspicious unless they originate from recognized sources. Completion of this detection rule also requires that process creation and command line logs are adequately captured and aggregated within the environment to facilitate timely and accurate alerts.

