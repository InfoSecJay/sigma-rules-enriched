title: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
status: test
description: Detects execution of arbitrary DLLs or unsigned code via a 
  ".csproj" files via Dotnet.EXE.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dotnet/
- https://twitter.com/_felamos/status/1204705548668555264
- https://bohops.com/2019/08/19/dotnet-core-a-vector-for-awl-bypass-defense-evasion/
author: Beyu Denis, oscd.community
date: 2020-10-18
modified: 2025-10-08
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\dotnet.exe'
  - OriginalFileName: '.NET Host'
  selection_cli:
    CommandLine|endswith:
    - '.csproj'
    - '.csproj"'
    - '.dll'
    - '.dll"'
    - ".csproj'"
    - ".dll'"
  filter_optional_notepadplus_plus:
    ParentImage:
    - 'C:\Program Files (x86)\Notepad++\notepad++.exe'
    - 'C:\Program Files\Notepad++\notepad++.exe'
    CommandLine|contains|all:
    - 'C:\ProgramData\CSScriptNpp\'
    - '-cscs_path:'
    - '\cs-script\cscs.dll'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administrator usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects executions of arbitrary DLLs or unsigned code initiated by `dotnet.exe` using `.csproj` projects or DLL files. The likely attacker objective is to execute malicious code under the guise of a legitimate .NET application, commonly used for bypassing security controls. The relevant MITRE ATT&CK technique is "Executable File Execution" (T1203) and "Code Signing" (T1218). The primary telemetry sources include Windows process creation logs with particular significance on Event ID 4688 and Sysmon Event ID 1, while the detection focuses on command line parameters tied to `.csproj` and `.dll` files. Malicious success could lead to system compromise or lateral movement within the environment. This detection does not confirm malicious activity on its own; further investigation is required to understand the context of the execution.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for executions of `dotnet.exe` containing ".csproj" or ".dll" in the CommandLine field. Behavior outside expected patterns may indicate malicious use.

  - **Identify parent process**: Inspect the ParentImage field for the presence of `notepad++.exe` in conjunction with CommandLine arguments. Legitimate executions may include administrative tasks but should not include unexpected DLL paths.

  - **Analyze associated file creation**: Look for file creation or modification events related to the command executed (e.g., DLLs in `C:\ProgramData\CSScriptNpp\`). Verify timestamps and file integrity to check for unauthorized changes.

  - **Correlate with user activity**: Match the execution time with user activity logs. Legitimate usage typically may occur during scheduled tasks or development activities. Look for overlaps with known administrative operations.

  - **Check the integrity of DLLs**: Verify signatures and hashes of executed DLLs. High-confidence malicious indicators include unsigned DLLs or those coming from untrusted sources.

  ### Prioritization

  This alert is of medium severity due to the potential impact on compromised systems, especially those with administrative privileges. While this behavior can be used maliciously, it may also arise from legitimate administrative tasks, warranting careful review. Such execution methods are increasingly being weaponized, making detection vital.

  ### Blind Spots and Assumptions

  This detection may miss exploits that utilize legitimate .NET frameworks or signed code, which could evade this rule. It requires accurate logging of process creations and appropriate filtering to avoid false positives from legitimate administrators using dotnet for development purposes. Common legitimate activities that may trigger this alert include coded app deployment or testing scenarios. A related detection to consider would be one focusing on direct invocation of .NET API calls that could signal an attempt to execute shell commands or manipulate the environment.

