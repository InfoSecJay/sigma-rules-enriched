note: |
  ### Technical Context

  This rule detects the use of the `winget` command-line tool to add an insecure HTTP download source. This behavior may indicate an attempt by an attacker to introduce a non-verified software repository to facilitate the installation of malicious software. The relevant MITRE ATT&CK tactic is Execution (TA0002), specifically the technique Command and Scripting Interpreter (T1059). The primary telemetry source is process creation logs from Windows, specifically monitoring activity related to `winget.exe`. If successful, this could allow an attacker to install malware or unwanted applications that bypass security controls. This detection alone does not confirm malicious intent; it could be the result of misconfiguration or ignorance of security practices by legitimate users.

  ### Investigation Steps

  - **Check the source of the command:** Review Security Event ID 4688 logs for the `winget.exe` process creation. Look for `CommandLine` values containing `source add http://`. Ensure the process is initiated from legitimate user accounts and authorized devices.

  - **Identify the timing and context:** Analyze the time of the event in relation to other user activities using Windows Event Log (Event ID 4624). Look for anomalous access patterns or unusual user behavior before and after the command was executed.

  - **Correlate with installed sources:** Verify the existing sources configured in `winget` using the command `winget source list`. Compare these sources against known safe repositories. Benign activity typically involves sources from reputable, HTTPS-secured locations.

  - **Assess permissions and roles:** Determine the user role of the individual executing the command. Unauthorized users or those with minimal access attempting to make this change can indicate potentially malicious behavior.

  - **Look for high-confidence indicators of compromise (IOC):** Identify if the addition of the new source was followed by installations of unexpected software via winget. Check process creation logs (Event ID 4688) for any installations from this source and specifically examine for any elevated privileges or suspicious executables.

  ### Prioritization

  This alert is of high severity. The potential impact involves exposure to malicious software installation, which could compromise the system's integrity. Insecure sources are a known vehicle for delivering malware, thus increasing the likelihood of exploitation if misused.

  ### Blind Spots and Assumptions

  Detection may be limited by user awareness and habits; legitimate users may inadvertently trigger this alert without malicious intent. It requires monitoring of process creation logs from Windows. Additionally, an analysis of local group policies around `winget` usage may help clarify legitimate versus illegitimate changes, while related detections, such as monitoring for software installations from suspicious sources, can enhance coverage against exploitation via software repositories.

