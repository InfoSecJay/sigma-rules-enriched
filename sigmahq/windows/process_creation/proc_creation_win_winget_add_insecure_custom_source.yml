note: |
  ### Technical Context

  This Sigma rule detects the addition of an insecure download source (HTTP) using the Windows Package Manager (winget). This behavior indicates possible unauthorized attempts to leverage winget for downloading malicious software packages, as winget is designed to disallow insecure sources. The likely objective of such an action is to circumvent security controls and deploy potentially harmful applications.

  This aligns with the MITRE ATT&CK technique "Command-Line Interface" (T1059). The primary telemetry source involves process creation logs, specifically monitoring the execution of winget.exe. If malicious, the security impact could include the unintentional installation of software with vulnerabilities, which can lead to system compromise or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate users may accidentally attempt to add an insecure source.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of winget.exe being executed with a CommandLine that includes "source add http://". Cross-reference with user roles to assess legitimacy.

  - **Correlate with user behavior:** Identify whether the user regularly uses winget. If not, this makes the activity more suspicious. Look for Event ID 4624 (logon events) to confirm typical user patterns.

  - **Analyze administrative actions:** Evaluate the logs for privileged account access. If a non-admin account issues the command to add an insecure source, it elevates the alert's severity. Check Logon Type in Event ID 4624.

  - **Review related alerts:** Cross-check for related detection rules (like the similar alert with ID 05ebafc8-7aa2-4bcd-a269-2aec93f9e842) that may identify additional unauthorized software installations or configurations.

  - **Validate benign scenarios:** Confirm expected behavior by checking if users expressly require adding an insecure source for their tasks, such as using a specific legacy application that may not support HTTPS.

  - **Correlate suspicious installations:** Look for any unusually named packages installed via winget that emanate from insecure sources by reviewing Event IDs 4688 and 4104 (for script execution) in conjunction.

  ### Prioritization

  This alert carries a high severity level, as it involves potential exploitation of winget which can lead to unauthorized software installations. Given that insecure sources are commonly used by threat actors to distribute malware, timely investigation is crucial to prevent potential breaches.

  ### Blind Spots and Assumptions

  Detection may be limited in environments with custom configurations or if users access winget from secured networks. Legitimate administrative actions, such as configuration updates from development environments, may inadvertently trigger this alert. A related detection to strengthen coverage is to monitor for any changes to App Installer policies which govern software source configurations.

