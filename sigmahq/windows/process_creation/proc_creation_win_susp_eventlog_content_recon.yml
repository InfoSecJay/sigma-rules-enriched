logsource:
  category: process_creation
  product: windows
detection:
  selection_wmi:
    CommandLine|contains|all:
    - 'Select'
    - 'Win32_NTLogEvent'
  selection_wevtutil_img:
  - Image|endswith: '\wevtutil.exe'
  - OriginalFileName: 'wevtutil.exe'
  selection_wevtutil_cli:
    CommandLine|contains:
    - ' qe '
    - ' query-events '
  selection_wmic_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_wmic_cli:
    CommandLine|contains: ' ntevent'
  selection_cmdlet:
    CommandLine|contains:
    - 'Get-WinEvent '
    - 'get-eventlog '
  selection_logs_name:
    CommandLine|contains:
            # Note: Add more event log channels that are interesting for attackers
    - 'Microsoft-Windows-PowerShell'
    - 'Microsoft-Windows-Security-Auditing'
    - 'Microsoft-Windows-TerminalServices-LocalSessionManager'
    - 'Microsoft-Windows-TerminalServices-RemoteConnectionManager'
    - 'Microsoft-Windows-Windows Defender'
    - 'PowerShellCore'
    - 'Security'
    - 'Windows PowerShell'
  selection_logs_eid:
    CommandLine|contains:
            # Note: We use the "?" to account for both a single and a double quote
            # Note: Please add additional interesting event IDs
            # Note: As this only focuses on EIDs and we know EIDs are not unique across providers. Rare FPs might occur with legit queries to EIDs from different providers.
            # This covers EID 4624 and 4628 from Security Log
    - '-InstanceId 462?'
    - '.eventid -eq 462?'
    - '.ID -eq 462?'
    - 'EventCode=?462?'
    - 'EventIdentifier=?462?'
    - 'System[EventID=462?]'
            # This covers EID 4778 from Security Log
    - '-InstanceId 4778'
    - '.eventid -eq 4778'
    - '.ID -eq 4778'
    - 'EventCode=?4778?'
    - 'EventIdentifier=?4778?'
    - 'System[EventID=4778]'
            # This covers EID 25 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 25'
    - '.eventid -eq 25'
    - '.ID -eq 25'
    - 'EventCode=?25?'
    - 'EventIdentifier=?25?'
    - 'System[EventID=25]'
            # This covers EID 1149 from Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational log
    - '-InstanceId 1149'
    - '.eventid -eq 1149'
    - '.ID -eq 1149'
    - 'EventCode=?1149?'
    - 'EventIdentifier=?1149?'
    - 'System[EventID=1149]'
            # This covers EID 21 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 21'
    - '.eventid -eq 21'
    - '.ID -eq 21'
    - 'EventCode=?21?'
    - 'EventIdentifier=?21?'
    - 'System[EventID=21]'
            # This covers EID 22 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 22'
    - '.eventid -eq 22'
    - '.ID -eq 22'
    - 'EventCode=?22?'
    - 'EventIdentifier=?22?'
    - 'System[EventID=22]'
  condition: 1 of selection_logs_* and (selection_wmi or all of selection_wevtutil_*
    or all of selection_wmic_* or selection_cmdlet)
falsepositives:
- Legitimate usage of the utility by administrators to query the event log
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_eventlog_content_recon/info.yml
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of log query utilities designed to extract data from Windows event logs, such as `wevtutil`, `wmic`, and PowerShell commands like `Get-WinEvent`. The likely attacker objective is to uncover sensitive information—like usernames or IP addresses—by querying specific event IDs that may provide insights into user activity or system configurations, fitting within the MITRE ATT&CK tactics of Credential Access (TA-0006) and Discovery (TA-0007). The primary telemetry sources are Windows process creation logs (Event ID 4688) that detail command-line arguments and associated process images. If malicious, this behavior can lead to account impersonation, further lateral movement, or privilege escalation. However, this detection does NOT confirm that the activity is malicious without considering the context and behavior surrounding the command execution.

  ---

  ### Investigation Steps

  - **Review the command context:** Analyze the command line associated with the detected process creation (Event ID 4688). Look for suspicious references to event logs, especially involving event IDs like 4624 (Logon) or 4778 (Session reconnect) that may indicate unauthorized reconnaissance attempts.

  - **Check the user permissions:** Correlate the account executing the queries against the organization's list of privileged users. Legitimate administrative users occasionally query logs using the detected utilities. Confirm if the user has the proper justification and need for such activities.

  - **Identify persistence in querying patterns:** Look for repeated or automated querying behavior (such as execution from scripts) within a short timeframe, especially for particularly sensitive log channels like 'Microsoft-Windows-Security-Auditing' or 'Windows PowerShell.' This can indicate a scripted tactic from an adversary.

  - **Validate process origins:** Verify the origin of the executing utility. For instance, confirm that `wevtutil.exe` is located in the expected directory (`C:\Windows\System32`) and check that the hash matches known good values.

  - **Check for related log events:** Investigate any correlating events during the same timeframe, especially failed logon attempts (Event ID 4625) or unusual user session behavior, that might enhance the context surrounding the detected activity.

  ---

  ### Prioritization

  This alert should be considered medium priority due to its potential to indicate reconnaissance or preparation for further malicious activities. The affected systems are commonly critical components within the enterprise (e.g., domain controllers), and the behavior could easily be weaponized to facilitate account takeovers or lateral movement.

  ---

  ### Blind Spots and Assumptions

  Detection may be circumvented by legitimate administrative tasks that utilize log querying commands, leading to false positives. Furthermore, it relies on the proper logging configuration and retention settings to capture necessary telemetry over time. Routine administrative activities, especially around event log maintenance, may trigger this alert. An effective companion detection would be monitoring for unusual access patterns to critical systems (e.g., unauthorized remote access alerts) which can validate or contest the legitimacy of log querying attempts.

