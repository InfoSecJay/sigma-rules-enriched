modified: 2025-12-02
tags:
- attack.credential-access
- attack.discovery
- attack.t1552
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_wmi:
    CommandLine|contains|all:
    - 'Select'
    - 'Win32_NTLogEvent'
  selection_wevtutil_img:
  - Image|endswith: '\wevtutil.exe'
  - OriginalFileName: 'wevtutil.exe'
  selection_wevtutil_cli:
    CommandLine|contains:
    - ' qe '
    - ' query-events '
  selection_wmic_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_wmic_cli:
    CommandLine|contains: ' ntevent'
  selection_cmdlet:
    CommandLine|contains:
    - 'Get-WinEvent '
    - 'get-eventlog '
  selection_logs_name:
    CommandLine|contains:
            # Note: Add more event log channels that are interesting for attackers
    - 'Microsoft-Windows-PowerShell'
    - 'Microsoft-Windows-Security-Auditing'
    - 'Microsoft-Windows-TerminalServices-LocalSessionManager'
    - 'Microsoft-Windows-TerminalServices-RemoteConnectionManager'
    - 'Microsoft-Windows-Windows Defender'
    - 'PowerShellCore'
    - 'Security'
    - 'Windows PowerShell'
  selection_logs_eid:
    CommandLine|contains:
            # Note: We use the "?" to account for both a single and a double quote
            # Note: Please add additional interesting event IDs
            # Note: As this only focuses on EIDs and we know EIDs are not unique across providers. Rare FPs might occur with legit queries to EIDs from different providers.
            # This covers EID 4624 and 4628 from Security Log
    - '-InstanceId 462?'
    - '.eventid -eq 462?'
    - '.ID -eq 462?'
    - 'EventCode=?462?'
    - 'EventIdentifier=?462?'
    - 'System[EventID=462?]'
            # This covers EID 4778 from Security Log
    - '-InstanceId 4778'
    - '.eventid -eq 4778'
    - '.ID -eq 4778'
    - 'EventCode=?4778?'
    - 'EventIdentifier=?4778?'
    - 'System[EventID=4778]'
            # This covers EID 25 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 25'
    - '.eventid -eq 25'
    - '.ID -eq 25'
    - 'EventCode=?25?'
    - 'EventIdentifier=?25?'
    - 'System[EventID=25]'
            # This covers EID 1149 from Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational log
    - '-InstanceId 1149'
    - '.eventid -eq 1149'
    - '.ID -eq 1149'
    - 'EventCode=?1149?'
    - 'EventIdentifier=?1149?'
    - 'System[EventID=1149]'
            # This covers EID 21 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 21'
    - '.eventid -eq 21'
    - '.ID -eq 21'
    - 'EventCode=?21?'
    - 'EventIdentifier=?21?'
    - 'System[EventID=21]'
            # This covers EID 22 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 22'
    - '.eventid -eq 22'
    - '.ID -eq 22'
    - 'EventCode=?22?'
    - 'EventIdentifier=?22?'
    - 'System[EventID=22]'
  condition: 1 of selection_logs_* and (selection_wmi or all of selection_wevtutil_*
    or all of selection_wmic_* or selection_cmdlet)
falsepositives:
- Legitimate usage of the utility by administrators to query the event log
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_eventlog_content_recon/info.yml
note: |
  ### Technical Context
  This rule detects potentially suspicious activities involving the use of command-line utilities that query Windows event logs. Specifically, it identifies the execution of commands from tools such as `wevtutil`, `wmic`, and PowerShell cmdlets that seek to extract log data, including sensitive information like usernames and IP addresses. Attackers may leverage these utilities to perform reconnaissance and target specific event IDs that may reveal detailed user behaviors and system interactions, thereby enhancing their ability to compromise credentials or understand the security posture of the environment.

  The likely attack scenarios involve threat actors performing credential access and discovery efforts, aligning with specific MITRE ATT&CK tactics and techniques, particularly:
  - **Credential Access** (TA-1552): Techniques used to acquire credentials or other sensitive information.
  - **Discovery** (TA-1087): Techniques aimed at gathering information about the system and network resources.

  Primary data sources that will contain the evidence necessary for this rule include process creation logs that capture command-line arguments and the execution of specific log query utilities.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Review process creation logs to identify instances of `wevtutil`, `wmic`, and PowerShell queries that reference event logs, particularly focusing on commands that include the keyword "Select" or specific event IDs.

  - **Analyze Command-Line Arguments**: Investigate the command-line arguments surrounding the execution of these tools for any unusual patterns, such as targeted event IDs or log types that are typically irrelevant for administrative tasks.

  - **Correlate with Other Logs**: Cross-reference the detected queries with relevant security logs (such as Security Event IDs 4624, 4628, and others) to understand the context of what information the attacker might have been attempting to access.

  - **Monitor User Behavior**: Assess user accounts that executed these log queries to determine if the actions were in line with normal user behavior or indicative of compromised credentials or other malicious intent.

  ### Prioritization
  The severity of this alert is rated medium due to the potential impact on sensitive data exposure and the likelihood that threat actors can effectively utilize log querying to advance their objectives. Given that legitimate administrative users may sometimes trigger this alert, it warrants further investigation to differentiate between benign and malicious activities.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments without adequate monitoring of all command-line activities, particularly if logging configurations are not capturing all relevant process creation events. The detection logic assumes that command-line arguments will contain recognizable patterns indicative of malicious intent, which may not always be the case. Additionally, alerting mechanisms rely on the existence of process creation logs, which should be configured to be comprehensive across all systems in the environment.

