tags:
- attack.credential-access
- attack.discovery
- attack.t1552
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_wmi:
    CommandLine|contains|all:
    - 'Select'
    - 'Win32_NTLogEvent'
  selection_wevtutil_img:
  - Image|endswith: '\wevtutil.exe'
  - OriginalFileName: 'wevtutil.exe'
  selection_wevtutil_cli:
    CommandLine|contains:
    - ' qe '
    - ' query-events '
  selection_wmic_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_wmic_cli:
    CommandLine|contains: ' ntevent'
  selection_cmdlet:
    CommandLine|contains:
    - 'Get-WinEvent '
    - 'get-eventlog '
  selection_logs_name:
    CommandLine|contains:
            # Note: Add more event log channels that are interesting for attackers
    - 'Microsoft-Windows-PowerShell'
    - 'Microsoft-Windows-Security-Auditing'
    - 'Microsoft-Windows-TerminalServices-LocalSessionManager'
    - 'Microsoft-Windows-TerminalServices-RemoteConnectionManager'
    - 'Microsoft-Windows-Windows Defender'
    - 'PowerShellCore'
    - 'Security'
    - 'Windows PowerShell'
  selection_logs_eid:
    CommandLine|contains:
            # Note: We use the "?" to account for both a single and a double quote
            # Note: Please add additional interesting event IDs
            # Note: As this only focuses on EIDs and we know EIDs are not unique across providers. Rare FPs might occur with legit queries to EIDs from different providers.
            # This covers EID 4624 and 4628 from Security Log
    - '-InstanceId 462?'
    - '.eventid -eq 462?'
    - '.ID -eq 462?'
    - 'EventCode=?462?'
    - 'EventIdentifier=?462?'
    - 'System[EventID=462?]'
            # This covers EID 4778 from Security Log
    - '-InstanceId 4778'
    - '.eventid -eq 4778'
    - '.ID -eq 4778'
    - 'EventCode=?4778?'
    - 'EventIdentifier=?4778?'
    - 'System[EventID=4778]'
            # This covers EID 25 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 25'
    - '.eventid -eq 25'
    - '.ID -eq 25'
    - 'EventCode=?25?'
    - 'EventIdentifier=?25?'
    - 'System[EventID=25]'
            # This covers EID 1149 from Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational log
    - '-InstanceId 1149'
    - '.eventid -eq 1149'
    - '.ID -eq 1149'
    - 'EventCode=?1149?'
    - 'EventIdentifier=?1149?'
    - 'System[EventID=1149]'
            # This covers EID 21 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 21'
    - '.eventid -eq 21'
    - '.ID -eq 21'
    - 'EventCode=?21?'
    - 'EventIdentifier=?21?'
    - 'System[EventID=21]'
            # This covers EID 22 from Microsoft-Windows-TerminalServices-LocalSessionManager/Operational log
    - '-InstanceId 22'
    - '.eventid -eq 22'
    - '.ID -eq 22'
    - 'EventCode=?22?'
    - 'EventIdentifier=?22?'
    - 'System[EventID=22]'
  condition: 1 of selection_logs_* and (selection_wmi or all of 
    selection_wevtutil_* or all of selection_wmic_* or selection_cmdlet)
falsepositives:
- Legitimate usage of the utility by administrators to query the event log
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_eventlog_content_recon/info.yml
note: |
  ### Technical Context

  This rule detects the execution of command-line utilities and PowerShell cmdlets used to query and extract information from Windows event logs. Attackers may use such techniques to gather sensitive data like usernames and session information to plan further actions or maintain persistence. The relevant MITRE ATT&CK techniques include *Credential Access (T1552)* and *Discovery (T1087)*. Primary telemetry sources for this detection are process creation logs from Windows (Event ID 4688), as well as command-line arguments within the logs related to 'wevtutil.exe' and other querying utilities.

  If malicious, the security impact could be significant, leading to unauthorized access to sensitive account information or logs, potentially facilitating further attacks or lateral movement. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger the same events.

  ### Investigation Steps

  - **Check Event Creation**: Review Windows Security Event ID **4688** to identify process creation incidents for `wevtutil.exe`, `wmic.exe`, and relevant PowerShell commands. Confirm if the commands have the context of querying sensitive event logs.

  - **Analyze Command Line Arguments**: Analyze the command line arguments for suspicious patterns such as usage of `-InstanceId` or `EventCode` against sensitive logs like **Security** and **Windows PowerShell**. Malicious queries commonly reference event IDs including **4624** (Logon), or **4778** (Session reconnected).

  - **Identify Misuse of Legitimate Tools**: Investigate instances where administrative tools are invoked outside of standard usage patterns. Expected benign behavior includes querying logs to verify health or troubleshoot issues, typically involving `wevtutil` or `Get-WinEvent` with logs specific to a user’s tasks.

  - **Correlate with Logon Events**: Cross-reference the suspicious event with Security Event IDs **4624** (successful logon) and **4768** (Kerberos TGT requested) to ascertain whether the querying corresponds with unusual user activity, such as logins at odd hours or from unfamiliar locations.

  - **Verify Against Anomaly Thresholds**: Assess if the detected queries are part of a higher than normal volume for logs in your environment, thus indicating potential reconnaissance activity against Dominion Accounts or high-privilege users.

  - **Look for Exfiltration Attempts**: If applicable, check for file creation or modified timestamps that may suggest skills to capture logs (e.g., log timestamps, or exports via `wevtutil`), which can indicate the movement of data out of the environment.

  ### Prioritization

  The alert has a **medium severity** due to the potential impact on sensitive accounts and the likelihood of information gathering by adversaries. Given that attackers often utilize these techniques to facilitate further unauthorized access, the alert merits swift analyst review.

  ### Blind Spots and Assumptions

  This detection is limited by the ability to execute legitimate processes, which may be misclassified due to benign administrative actions. Ensuring complete logging from Windows Event logs is essential for reliable detection. Legitimate use cases such as security audits or investigations by IT staff may also generate alerts. A related detection to consider is monitoring for suspicious account logins (Event ID **4624**) that may coincide with the event log queries, enhancing context for the flagged behavior.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
