detection:
  selection_generic_1:
    CommandLine|endswith: 'cmd.exe /C whoami'
    ParentImage|startswith: 'C:\Temp\'
  selection_generic_2:
    ParentImage|endswith:
    - '\runonce.exe'
    - '\dllhost.exe'
    CommandLine|contains|all:
    - 'cmd.exe /c echo'
    - '> \\\\.\\pipe'
  selection_conhost_1:
    ParentCommandLine|contains|all:
    - 'cmd.exe /C echo'
    - ' > \\\\.\\pipe'
    CommandLine|endswith: 'conhost.exe 0xffffffff -ForceV1'
  selection_conhost_2:
    ParentCommandLine|endswith: '/C whoami'
    CommandLine|endswith: 'conhost.exe 0xffffffff -ForceV1'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects process creation patterns indicative of Cobalt Strike beacon activity, particularly focusing on command line executions that involve the Windows command interpreter (cmd.exe) and interaction with named pipes. The likely attacker objective is to establish command and control (C2) communication and exfiltrate information or execute additional malicious payloads. Relevant MITRE ATT&CK techniques include Remote Access Tools (T1219) and Command and Scripting Interpreter (T1059).

  Primary telemetry sources include Windows process creation logs with event IDs 4688 (Process Creation) and relevant Sysmon logs (Event ID 1). If malicious, this activity can lead to unauthorized remote access, data exfiltration, and lateral movement within the network. However, this detection does NOT confirm that all detected instances are malicious, as legitimate administrative tasks or scripts may trigger similar command patterns.

  ---

  ### Investigation Steps

  - **Verify recent process creation logs:** Check Security Event ID 4688 for processes starting with `C:\Temp\` and involving `cmd.exe` with arguments typical of beacon activity (e.g., `cmd.exe /C whoami`). Look for timestamps and correlate against known legitimate administrative tasks.

  - **Inspect parent process relationships:** Analyze the `ParentImage` field in logs for entries ending with `runonce.exe` or `dllhost.exe`, and check for command line patterns containing `echo` and `> \\\\.\\pipe`. Malicious indicators could include patterns indicative of creating named pipes for C2 communication.

  - **Correlate with Sysmon logs:** Review Sysmon Event ID 1 for processes containing `conhost.exe` with parameters like `0xffffffff -ForceV1`. Cross-reference with the parent command line to establish if activity resembles Cobalt Strike’s operational signature.

  - **Identify legitimate process behavior:** Look for typical administrative commands or scripts using `cmd.exe`. Common benign activities may include system updates or user notifications that do not create connections through named pipes.

  - **Assess network activity:** Investigate any outbound connections made by the associated processes using the network logs (e.g., Firewall Event IDs or EDR telemetry). Pay attention to unusual inbound/outbound requests towards non-standard ports or external IPs.

  ---

  ### Prioritization

  This alert is categorized as high severity due to its potential impact on critical systems being exploited or compromised. The likelihood of malicious abuse is significant, as these command and control patterns are commonly weaponized in Cobalt Strike attacks. Quick identification is essential to prevent further exploitation or lateral movement.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques where attackers modify command line parameters to mimic benign usage or use alternative processes. Reliable detection requires comprehensive logging enabled for process creation and command-line arguments. Legitimate administrative tools may trigger similar alerts, so context is crucial. Related detections, such as abnormal outlier network connection patterns (e.g., unusual DNS queries or abnormal outbound traffic), can strengthen overall monitoring capabilities.

