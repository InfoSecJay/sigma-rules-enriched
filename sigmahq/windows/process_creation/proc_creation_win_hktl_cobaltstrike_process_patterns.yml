detection:
  selection_generic_1:
    CommandLine|endswith: 'cmd.exe /C whoami'
    ParentImage|startswith: 'C:\Temp\'
  selection_generic_2:
    ParentImage|endswith:
    - '\runonce.exe'
    - '\dllhost.exe'
    CommandLine|contains|all:
    - 'cmd.exe /c echo'
    - '> \\\\.\\pipe'
  selection_conhost_1:
    ParentCommandLine|contains|all:
    - 'cmd.exe /C echo'
    - ' > \\\\.\\pipe'
    CommandLine|endswith: 'conhost.exe 0xffffffff -ForceV1'
  selection_conhost_2:
    ParentCommandLine|endswith: '/C whoami'
    CommandLine|endswith: 'conhost.exe 0xffffffff -ForceV1'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential process patterns associated with Cobalt Strike beacon activity, particularly focusing on command executions involving `cmd.exe` that communicate with named pipes. The likely attacker objective is to establish command and control (C2) communication, exfiltrate data, or gather system information covertly. Relevant MITRE ATT&CK tactics include Execution (T1203), with techniques such as Command-Line Interface (T1059).

  Primary telemetry sources consist of Windows process creation events, notably Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to unauthorized data access or lateral movement within the network. However, it is crucial to note that this detection does NOT confirm successful exploitation or the presence of a compromise alone; further investigation is required.

  ### Investigation Steps

  - **Review process creation events**: Check Security Event ID 4688 and Sysmon Event ID 1 for processes spawned with command lines ending in `cmd.exe /C whoami` and parent images from `C:\Temp\`. Legitimate processes usually do not emulate this pattern as benign activity typically uses established paths.

  - **Analyze established processes**: Investigate any instances of `runonce.exe` or `dllhost.exe` as parent images in conjunction with command lines that contain `cmd.exe /c echo` and involve `> \\\\.\\pipe`. Malicious instances will show irregular paths or additional unusual command parameters.

  - **Examine conhost.exe activities**: Look at command line arguments for `conhost.exe` specifically ending with `-ForceV1` and containing `cmd.exe /C echo` or `cmd.exe /C whoami`. Unfiltered use of this process for these commands is a high-confidence malicious indicator.

  - **Check for persistence mechanisms**: Validate log entries for automated executions that may be used to reinstate Cobalt Strike beacons. Indicator of a persistent threat would be repeated command line patterns or evidence of scheduled tasks invoking similar commands.

  - **Evaluate pipe communication**: Investigate any IPC (Inter-process communication) activity via named pipes such as `\\.\pipe`. Legitimate applications usually utilize standard APIs without launching CMD to IO operations indicated here.

  ### Prioritization

  This alert is of high severity given that it targets a potential C2 pattern from Cobalt Strike, which is commonly weaponized. The presence of these behaviors could indicate active compromise, especially on critical or sensitive systems, raising the risk of significant data breaches.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of processes commonly used for legitimate purposes; benign applications may also generate similar command patterns under certain conditions. Required log sources must include security event logs and Sysmon configurations for comprehensive coverage. It's essential to recognize that legitimate administrative scripts may trigger these alerts, particularly in DevOps or automated environments. Related detections, such as those tracking unusual PowerShell signatures (T1059.001), strengthen overall coverage against similar threat vectors.

