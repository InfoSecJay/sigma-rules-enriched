logsource:
  category: process_creation
  product: windows
detection:
  selection_generic_1:
    CommandLine|endswith: 'cmd.exe /C whoami'
    ParentImage|startswith: 'C:\Temp\'
  selection_generic_2:
    ParentImage|endswith:
    - '\runonce.exe'
    - '\dllhost.exe'
    CommandLine|contains|all:
    - 'cmd.exe /c echo'
    - '> \\\\.\\pipe'
  selection_conhost_1:
    ParentCommandLine|contains|all:
    - 'cmd.exe /C echo'
    - ' > \\\\.\\pipe'
    CommandLine|endswith: 'conhost.exe 0xffffffff -ForceV1'
  selection_conhost_2:
    ParentCommandLine|endswith: '/C whoami'
    CommandLine|endswith: 'conhost.exe 0xffffffff -ForceV1'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potential process patterns indicative of Cobalt Strike beacon activity, a common tool used by threat actors for command and control (C2) purposes. Cobalt Strike can execute a variety of tasks, including privilege escalation, lateral movement, and data exfiltration, aiming to maintain persistence and control within a compromised environment. The observed behaviors include unusual command executions, particularly those involving `cmd.exe` and `conhost.exe` initiated from suspicious parent processes, which are often characteristic of Cobalt Strike's operation.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - Execution (T1203): Cobalt Strike often exploits this to execute payloads on compromised machines.
  - Command and Control (T1071): Once a system is compromised, Cobalt Strike establishes persistent communication with the attacker using various protocols to relay commands.

  Primary data sources for this detection include:
  - Process creation event logs, which can record command-line arguments and parent-child process relationships.
  - Event logs from Windows, particularly those related to application and system activities, provide insights into system behavior during potential Cobalt Strike activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation logs for instances where `cmd.exe` is executed with unusual command lines, particularly those terminating with `/C whoami` and sourced from temporary directories.

  - **Check Parent Process Activity**: Investigate the parent processes of detected `cmd.exe` instances; specifically, look for instances where the parent was `runonce.exe` or `dllhost.exe`, as these could indicate a manipulative invocation of Cobalt Strike.

  - **Analyze Pipe Communication**: Determine if any process is communicating with named pipes, especially examining instances where command lines include `> \\\\.\\pipe` and confirm if these usage patterns align with known Cobalt Strike behaviors.

  - **Correlate with Network Traffic**: If Cobalt Strike activity is suspected, cross-reference the process creation events with network detection logs for anomalous connections or data exfiltration patterns that coincide with the timing of these process activities.

  ### Prioritization
  Due to Cobalt Strike's lethal potential for conducting post-exploitation activities, any alerts generated from this detection should be treated as high severity. The likelihood of a serious threat is significant, given the ongoing prevalence of Cobalt Strike in targeted attacks across various industries.

  ### Blind Spots and Assumptions
  This detection rule may not capture all Cobalt Strike variants due to the tool's versatility and frequent updates, leading to potential gaps in detection coverage. The assumptions underlying the logic include the necessity for process creation telemetry to be enabled and properly configured, as well as the reliance on standard naming conventions and command usage patterns commonly associated with Cobalt Strike. Without comprehensive logging configurations and a robust understanding of normal process behavior, some malicious activity may go undetected.

