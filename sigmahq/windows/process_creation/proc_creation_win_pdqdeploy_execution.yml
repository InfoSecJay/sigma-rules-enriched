  ### Technical Context

  This Sigma rule detects the execution of the PDQ Deploy Console, a remote administration tool commonly used for deploying software across Windows systems. The likely attacker objective is to use this tool for lateral movement within a network or to execute unauthorized deployments, thereby compromising systems or facilitating further attacks. This behavior is associated with the MITRE ATT&CK technique T1072: Application Layer Protocol and Tactics: Execution and Lateral Movement.

  The primary telemetry sources are process creation logs, specifically Windows Event ID 4688 or Sysmon Event ID 1, which record new process creation events. If malicious, the security impact includes unauthorized software deployment, which can lead to malware installation or data exfiltration. It is important to note that this detection does NOT confirm malicious intent solely on its own; legitimate administrative use of PDQ Deploy can trigger this alert.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check for Event ID 4688 in the Security logs or Sysmon Event ID 1 for the process 'PDQDeployConsole.exe'. Look for correlated event timestamps and user context for any irregularities, such as execution outside of normal business hours or by non-admin users.

  - **Correlate users with expected behavior:** Identify if the user account executing PDQ Deploy is legitimate for administrative tasks. Check logs for common user workflows and determine if PDQ Deploy usage aligns with their role, especially in relation to asset criticality.

  - **Inspect deployment logs in PDQ Deploy:** Look for recent deployments or job activity logs within PDQ Deploy. Verify whether the deployed applications or changes match the expected software management practices. Legitimate usage typically involves deploying updates or approved software.

  - **Identify high-confidence malicious indicators:** Look for unusual command-line arguments associated with 'PDQDeployConsole.exe' that do not correspond to typical administrative tasks. For example, an unexpected deployment to numerous machines in a short time frame may indicate malicious use.

  - **Check Sysmon network activity:** Monitor Sysmon Event ID 3 for outbound network connections initiated by 'PDQDeployConsole.exe'. Any suspicious connections to unrecognized external IPs or domains should be flagged for further analysis.

  - **Validate file creation and access:** If PDQ Deploy has recently executed a deployment, verify the presence of newly created files or modified timestamps on target systems to ensure no unauthorized changes occurred.

  ---

  ### Prioritization

  The alert has medium severity due to the potential risk of an attacker using legitimate administrative tools for malicious purposes. The likelihood of malicious abuse is notable since lateral movement tools like PDQ Deploy are commonly weaponized for unauthorized access to systems. The impact could escalate if the affected systems hold sensitive data or critical infrastructure components.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist since legitimate administrative actions may also trigger this alert, leading to potential false positives. Additionally, the detection relies on the correct configuration of process creation logs; absence of Sysmon or logging mechanisms could lead to missed events. Legitimate activities could include routine software deployments during system maintenance. A related detection to consider involves monitoring for unusual PowerShell scripts, as these may also indicate lateral movement activities following PDQ Deploy use.

