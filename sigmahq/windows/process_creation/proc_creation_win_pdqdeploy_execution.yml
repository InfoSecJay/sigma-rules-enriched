  ### Technical Context
  This detection rule identifies the execution of the PDQ Deploy remote administration tool, which is commonly used for deploying software across Windows environments. The primary objective of an attacker utilizing PDQ Deploy may be to execute unauthorized commands or malware on multiple endpoints simultaneously, which can facilitate lateral movement within a network. Threat actors may leverage this tool to distribute malicious payloads while masquerading as legitimate administrative activity.

  In terms of the MITRE ATT&CK framework, this detection relates to the following tactics and techniques: Execution (T1203), where the malware is executed, and Lateral Movement (T1072), as attackers can use PDQ Deploy to move through the network post-compromise. The primary data source for this detection is process creation logs, which provide insight into applications running on endpoints and potential unauthorized executions of administrative tools like PDQ Deploy.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze process creation event logs to identify any instances of `PDQDeployConsole.exe` execution, focusing on timestamps, executing user accounts, and parent processes.
  - **Examine Network Traffic**: Investigate any outbound network connections initiated from the endpoint running PDQ Deploy to detect suspicious communication patterns that may suggest exfiltration or command and control (C2) activity.
  - **Check Access Control Lists**: Evaluate Active Directory (AD) access rights and permissions to determine whether the user account executing PDQ Deploy has been granted proper administrative access and whether any privilege escalation has occurred.
  - **Monitor Subsequent Actions**: After detecting PDQ Deploy use, track subsequent process activity and file changes on the target devices to identify potential deployment of unauthorized software or unexpected behavior.

  ### Prioritization
  The severity of this alert is medium due to the dual capabilities of PDQ Deploy as legitimate software and a potential vector for attackers to gain control. Given the impact of unauthorized software deployment and lateral movement risks in an enterprise environment, quick investigation and response are essential.

  ### Blind Spots and Assumptions
  This detection may miss instances of PDQ Deploy being used legitimately for benign administrative tasks, leading to potential false positives. It assumes that the necessary logging configurations are enabled to capture process creation events on Windows endpoints effectively. Additionally, if PDQ Deploy is used within a tightly-controlled IT environment, it may result in gaps in detection coverage for legitimate administrative actions versus malicious usage. Required logs include detailed process creation logs and network traffic logs for a comprehensive audit trail.

