note: |
  ### Technical Context
  This detection rule identifies the execution of a process that has been renamed from its original name, `BrowserCore.exe`, a file commonly associated with Azure token extraction activities. Attackers may rename legitimate processes to evade detection while carrying out credential theft or privilege escalation. The potential attacker objectives involve gaining unauthorized access to sensitive Azure resources through token acquisition, allowing for further exploitation within the environment.

  The relevant MITRE ATT&CK tactics include Credential Access (TA-0006), specifically focusing on technique T1528 (Extracting Application Credentials) and Defenses Evasion (TA-0005), particularly T1036.003 (Masquerading: Rename System Utilities). These techniques highlight the strategies attackers use to blend in with legitimate operational behaviors while carrying out malicious actions.

  Primary data sources for effective detection include Windows process creation logs, which provide insights into the execution of processes and any renaming activities, as well as endpoint detection and response (EDR) solutions that track process behaviors and its associated parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for any instances of `BrowserCore.exe` being launched. Note the parent process and check for any anomalies leading up to its execution.
  - **Examine File Integrity:** Use endpoint detection tools to verify the integrity of the file in question. Investigate if there are multiple instances of `BrowserCore.exe`, especially those with altered timestamps or unexpected file locations.
  - **Monitor Azure Access Logs:** Check Azure logs for any unusual token requests made around the time of the execution. Look for patterns or requests from unexpected IP addresses or geographic locations.
  - **Identify Process Parentage:** Investigate the tree of process execution to assess if `BrowserCore.exe` emerged from a suspicious parent process, which may provide context to the execution and its purpose.

  ### Prioritization
  This alert carries a high severity because the execution of renamed `BrowserCore.exe` may indicate an active threat actor attempting to harvest credentials or manipulate access to Azure services, which could have significant implications for data security and integrity within an enterprise environment.

  ### Blind Spots and Assumptions
  One gap in detection coverage includes the potential for attackers to use different renaming techniques or legitimate process names to evade detection. The detection logic assumes that logs will accurately reflect process creation events with sufficient detail to flag renamed executables. It also relies on the availability of Windows process creation logs and accurate time synchronization across devices to establish the context of the alert effectively.

