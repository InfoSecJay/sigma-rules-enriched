  ---

  ### Technical Context

  This rule detects the execution of a renamed instance of BrowserCore.exe, a legitimate process used to interact with Azure services, which is often exploited by attackers to extract tokens for unauthorized access to cloud resources. The likely objective of an attacker executing this process is to gain elevated privileges or access sensitive data within the Azure environment by mimicking the original application to avoid detection. This behavior aligns with the MITRE ATT&CK tactics of Credential Access (TA-0006, T1528 - Extract Token) and Defense Evasion (TA-0005, T1036.003 - Masquerading).

  Primary telemetry sources for this rule include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact could be significant, potentially leading to unauthorized access to sensitive cloud resources and data. However, it's important to note that this detection alone does not confirm malicious intent, as legitimate applications could be misconfigured or renamed for benign reasons.

  ---

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for the creation of BrowserCore.exe, paying close attention to the parent process and user context in which it was executed.
  - **Confirm original file name:** Validate that the OriginalFileName parameter within the log entries indicates "BrowserCore.exe" to ensure this detection is relevant, as legitimate applications may have similar names.
  - **Investigate parent-child process relationships:** Analyze the parent process to determine if it is a legitimate Azure client or an unexpected process that may indicate malicious activity. Focus on Event ID 4688's ParentImage field.
  - **Observe for token extraction activity:** If BrowserCore.exe is executed, monitor for Azure token extraction using Azure AD logs (e.g., Sign-ins and Audit logs) to detect any suspicious access patterns or anomalies.
  - **Document legitimate use cases:** Identify known legitimate uses of BrowserCore.exe within your environment. For instance, configurations by trusted applications executing under expected service accounts should not trigger alarms.
  - **Look for anomalies in execution frequency:** Compare the execution frequency of renamed instances against the historical baseline for your assets. Frequent execution in a short period may indicate malicious attempts as opposed to normal operational behavior.

  ---

  ### Prioritization

  This alert is considered high severity due to the significant potential impact on sensitive Azure resources if exploited. The likelihood of malicious abuse is elevated, given the common tactics employed by attackers to extract tokens from cloud environments. It is crucial to prioritize this alert since the behavior detected can closely mirror legitimate activity.

  ---

  ### Blind Spots and Assumptions

  The detection may be circumvented via obfuscation techniques by attackers renaming the executable or manipulating the process parent-child relationship. Reliable detection requires the collection of both process creation logs and Azure AD logs for comprehensive investigation. Legitimate application behavior, like standard updates or system maintenance by Azure clients, may trigger these alerts, thus requiring context. A related detection to enhance coverage includes monitoring for unusual network requests by BrowserCore.exe that could indicate token abuse or unauthorized data exfiltration.

