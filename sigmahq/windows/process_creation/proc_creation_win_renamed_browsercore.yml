note: |
  ### Technical Context

  This Sigma rule detects the execution of a process named `BrowserCore.exe` that has been renamed, a technique commonly used by adversaries to obfuscate their activities while attempting to extract sensitive information, such as Azure tokens. The likely attacker objective is to gain unauthorized access to cloud services by leveraging authentication tokens extracted from legitimate processes running on compromised systems. This behavior is associated with the MITRE ATT&CK techniques: Credential Access (T1528) and Defense Evasion (T1036.003).

  The primary telemetry source is Windows process creation logs, specifically focusing on event IDs 4688 for process creation. If malicious, the impact could lead to unauthorized access to sensitive cloud resources, making it a critical threat. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate process renaming or execution may occur in a normal operational context.

  ### Investigation Steps

  - **Identify the process creation event:** Review Windows Security Event ID 4688 for the creation of `BrowserCore.exe`. Validate the image path; legitimate processes typically run from expected directories like `C:\Program Files\`.

  - **Inspect command-line arguments:** Check the command-line arguments associated with the process creation event in the security logs. Malicious executions are often executed with unusual flags or arguments for data extraction; legitimate uses typically do not have such arguments.

  - **Analyze parent-child relationships:** Determine the parent process of the renamed `BrowserCore.exe` through event ID 4688. Analyze if the parent process (if potentially malicious) is known for malicious behavior or not. Legitimate instances typically have benign parent processes like browsers (e.g., `chrome.exe`).

  - **Check for concurrent Azure token requests:** Investigate Azure Audit logs related to token requests around the same timestamp as the process execution. Legitimate activity should not show unusual or unexpected token requests at that time, while malicious activity may correlate with abnormal authentication attempts.

  - **Review for additional file system interactions:** Validate any file system changes associated with the process using Sysmon Event ID 10 (FileCreate) to see if `BrowserCore.exe` tries to create or modify files. Malicious processes may try to manipulate sensitive files or create new potentially harmful artifacts.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on cloud resources and the likelihood of significant malicious abuse. The rename of legitimate executable files is a tactic often weaponized in credential theft scenarios, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  The detection may face limitations if `BrowserCore.exe` is never renamed in logs due to suspicious naming conventions. Ensure that telemetry from Windows Event Logs and Sysmon are configured and operational for robust detection. Legitimate activities such as software updates or testing could inadvertently trigger the alert. A related detection to consider is any alerts tied to anomalous Azure logins (e.g., from new or suspicious IP addresses) to strengthen coverage against this technique.

