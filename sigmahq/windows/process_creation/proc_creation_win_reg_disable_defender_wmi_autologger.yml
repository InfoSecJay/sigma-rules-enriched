logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_path:
    CommandLine|contains:
    - '\Control\WMI\Autologger\DefenderApiLogger\Start'
    - '\Control\WMI\Autologger\DefenderAuditLogger\Start'
  selection_reg_add:
    CommandLine|contains|all:
    - 'add'
    - '0'
  filter_main_enable:
    CommandLine|contains: '0x00000001'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Highly unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of `reg.exe` to disable Windows Defender's WMI Autologger sessions for Defender API and Audit events. The likely attacker objective is to evade security monitoring by stopping the logging of critical security events, thus obfuscating their malicious activities. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically the technique of Event Triggering (T1685).

  The primary telemetry source is process creation logs, specifically looking for `Image` and `CommandLine` fields that indicate the invocation of the `reg.exe` utility to manipulate WMI autologger sessions. If exploited successfully, this could lead to undetected malicious behavior, undermining the effectiveness of the enterprise’s security posture. It is essential to note that this detection does NOT confirm malicious activity on its own; it may be a legitimate administrative action if performed in the context of authorized system configurations.

  ### Investigation Steps

  - **Review Process Creation Events:** Check for Event ID 4688 (Windows Security) or Sysmon Event ID 1 related to `reg.exe`, looking specifically at the `CommandLine` field for the presence of path `\Control\WMI\Autologger\DefenderApiLogger\Start`.

  - **Identify Malicious CommandLine Use:** Analyze commands containing both `add` and `0` in the `CommandLine`. This indicates an attempt to disable logging, which is a strong indicator of malicious intent when seen in conjunction with the other context.

  - **Assess Host Role:** Understand the affected host's role—if it's a production server or part of the SOC, prioritize investigation due to the heightened risk of critical system evasion.

  - **Compare to Legitimate Behaviors:** Investigate recent administrative tasks on the system. Legitimate configurations might include enabling or managing logging settings; verify if recent `reg.exe` usage aligns with authorized administrative actions by checking user accounts and timestamps.

  - **Confirm Logging Configuration:** Ensure that WMI logging configurations are correctly set, including expected autologger session states. Missing logs can indicate a more significant issue.

  - **Investigate Compromise Indicators:** Check for other signs of compromise on the host, such as unusual network traffic or processes. High confidence indicators such as known malware hashes or connections to suspicious IP addresses should be prioritized.

  ### Prioritization

  This alert is rated as high severity due to its potential impact on monitoring capabilities and incident response. The disabling of logging mechanisms can often be weaponized by attackers to evade detection during malicious activities. Given the sensitivity of the affected systems, swift verification and remediation actions are crucial.

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate administrative activities that might also disable logging for maintenance purposes. Ensure that WMI event logging is correctly configured to detect similar attempts reliably. Additionally, a companion detection might include monitoring for WMI event queries to catch potentially malicious filtering or other modifications to WMI processes.

