logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_path:
    CommandLine|contains:
    - '\Control\WMI\Autologger\DefenderApiLogger\Start'
    - '\Control\WMI\Autologger\DefenderAuditLogger\Start'
  selection_reg_add:
    CommandLine|contains|all:
    - 'add'
    - '0'
  filter_main_enable:
    CommandLine|contains: '0x00000001'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Highly unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where an attacker uses the `reg.exe` command to disable the Event Tracing for Windows (ETW) Autologger sessions for Windows Defender API and Audit events. By manipulating the `Start` value of the `DefenderApiLogger` or `DefenderAuditLogger` sessions to '0', an attacker can effectively prevent critical security-related events from being logged. This action is emblematic of a sophisticated defense evasion technique, aimed at reducing the visibility of malicious activities within enterprise environments.

  In this context, the suspected threat actor's objective may include evading detection by security monitoring tools, thereby facilitating further malicious activities such as data exfiltration, lateral movement, or persistence without raising alarms. This malicious behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically under technique **T1562.001: Disable or Modify Tools**. The primary data sources pertinent to this detection include process creation events from Windows, which log instances of command execution along with their parameters, allowing for a comprehensive review of potentially harmful command-line actions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate logs for process creation events where `reg.exe` was executed. Focus on command lines containing the paths to `DefenderApiLogger` or `DefenderAuditLogger` sessions, particularly those modifying the 'Start' value.
  - **Analyze Command Line Arguments**: Look for command lines that include terms like `add` and `0` within the context of modifying registry keys. Specific attention should be paid to full command-line syntax to identify any potentially malicious activities.
  - **Cross-Reference With Other Logs**: Check related security logs, such as EDR alerts and Windows Event Logs, for any simultaneous suspicious activities occurring around the same timeframe, which may indicate an attacker’s presence or other attempts at evading detection.
  - **Investigate ETW Configuration**: Assess the configuration of ETW sessions within the environment to confirm that the necessary sessions are active and that any unexpected deactivations align with legitimate administrative activities, ruling out potential false positives.

  ### Prioritization
  The high severity of this alert is justified due to the potential impact of disabling critical logging mechanisms by an adversary. This behavior facilitates ongoing malicious activity and compromises the effectiveness of the organization's security posture, increasing the likelihood of a successful breach or undetected compromise.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage related to the timing and context of registry changes that may not be fully captured in standard logs. The detection logic assumes that all relevant registry changes will be logged through process creation events; however, discrepancies or limitations in logging configurations might hinder complete visibility. Additionally, the detection relies on the correct installation and configuration of the registry logging capabilities on the affected systems to function optimally.

