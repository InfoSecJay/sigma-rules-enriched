title: Disabling Windows Defender WMI Autologger Session via Reg.exe
id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
related:
- id: f37b4bce-49d0-4087-9f5b-58bffda77316
  type: similar
status: experimental
description: |
  Detects the use of reg.exe to disable the Event Tracing for Windows (ETW) Autologger session for Windows Defender API and Audit events.
  By setting the 'Start' value to '0' for the 'DefenderApiLogger' or 'DefenderAuditLogger' session, an attacker can prevent these critical security events
  from being logged, effectively blinding monitoring tools that rely on this data. This is a powerful defense evasion technique.
references:
- https://research.splunk.com/endpoint/76406a0f-f5e0-4167-8e1f-337fdc0f1b0c/
- https://docs.microsoft.com/en-us/windows/win32/etw/configuring-and-starting-an-autologger-session
- https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
- https://blog.malwarebytes.com/malwarebytes-news/2021/02/lazyscripter-from-empire-to-double-rat/
- https://www.binarly.io/blog/design-issues-of-modern-edrs-bypassing-etw-based-solutions
author: Matt Anderson (Huntress)
date: 2025-07-09
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_reg_path:
    CommandLine|contains:
    - '\Control\WMI\Autologger\DefenderApiLogger\Start'
    - '\Control\WMI\Autologger\DefenderAuditLogger\Start'
  selection_reg_add:
    CommandLine|contains|all:
    - 'add'
    - '0'
  filter_main_enable:
    CommandLine|contains: '0x00000001'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Highly unlikely
level: high
note: |
  ### Technical Context

  This rule detects the disabling of the Windows Defender Event Tracing for Windows (ETW) Autologger sessions via `reg.exe`. An adversary may use this technique to stop logging crucial security events, which facilitates their ability to execute malicious activities undetected. This behavior fits into the MITRE ATT&CK framework under the tactic "Defense Evasion" and the technique ID T1562.001 (Disable or Modify Tools).

  The primary telemetry source for this rule is process creation logs from Windows, particularly tracking commands invoking `reg.exe` with specific parameters. If this activity is indeed malicious, it indicates a significant risk to system integrity and security monitoring capabilities. It is essential to note that this detection alone does not confirm malicious intent, as there could be legitimate administrative or configuration changes that lead to similar command usage.

  ### Investigation Steps

  - **Identify the process creation event:** Check for Security Event ID 4688 (process creation) or Sysmon Event ID 1 to locate instances where `reg.exe` was executed. Review the `CommandLine` field for any suspicious arguments.

  - **Review command arguments:** Look for the exact command-line arguments used, specifically those targeting the paths `\Control\WMI\Autologger\DefenderApiLogger\Start` or `\Control\WMI\Autologger\DefenderAuditLogger\Start`. Malicious indicators would include `add` with a value of '0' indicating that the logging is disabled.

  - **Compare against legitimate usage:** Assess if this command execution correlates with legitimate system maintenance tasks. Common benign activities would be associated with automated updates or expected configuration changes by IT staff.

  - **Examine supplementary logs:** Investigate Windows Event Logs (specifically the System logs for ETW events) for any related entries surrounding the time this command was executed. Look for indications of alterations to Windows Defender settings or unusual service behavior.

  - **Cross-reference with other detections:** Verify if related detections in your SIEM (such as those identifying unauthorized modifications to security logging features) have triggered around the same time for a more comprehensive investigation.

  ### Prioritization

  This alert is considered high severity due to the criticality of the affected system – Windows Defender serves as a primary line of defense on endpoints. The likelihood of a malicious actor using this disabling technique is high, particularly in sophisticated attack scenarios where stealth is required. Disabling security logging is a known tactic among adversaries looking to evade detection.

  ### Blind Spots and Assumptions

  Detection is limited in scenarios where `reg.exe` is executed in a legitimate context by authorized administrators, potentially leading to false positives. Comprehensive log source configurations are required, ensuring both process creation and relevant ETW logs are enabled for effective detection. Additionally, administrative tools or scripts may trigger similar commands that are legitimate, which highlights the need for context in investigation. Companion detections, such as monitoring of ETW modifications or changes in Windows Defender settings, can bolster detection coverage in this area.

