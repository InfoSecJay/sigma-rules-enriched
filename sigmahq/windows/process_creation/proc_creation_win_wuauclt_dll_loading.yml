detection:
  selection_img:
  - Image|endswith: '\wuauclt.exe'
  - OriginalFileName: 'wuauclt.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'UpdateDeploymentProvider'
    - 'RunHandlerComServer'
  filter_main_generic:
        # Note: Please enhance this if you find the full path
    CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
  filter_main_wuaueng:
        # Note: Please enhance this if you find the full path
    CommandLine|contains: ' wuaueng.dll '
  filter_main_uus:
    CommandLine|contains:
    - ':\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId'
    - ':\Windows\UUS\amd64\UpdateDeploy.dll /ClassId'
  filter_main_winsxs:
    CommandLine|contains|all:
    - ':\Windows\WinSxS\'
    - '\UpdateDeploy.dll /ClassId '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential misuse of the Windows Update Client binary (wuauclt.exe) for proxy execution, which can indicate malicious activity often associated with advanced persistent threat (APT) groups like Lazarus. Attackers may exploit the Windows Update Client to execute payloads remotely, facilitating command and control (C2) operations while hiding their activities within legitimate system processes. By leveraging legitimate binaries, attackers can evade detection mechanisms, steering clear of traditional security measures.

  The relevant MITRE ATT&CK tactics/techniques for this detection include:
  - **Tactic: Defense Evasion** (TA0005)
  - **Technique: Scheduled Task/Job** (T1053)
  - **Technique: Command and Scripting Interpreter** (T1059)
  - **Technique: Execution through API** (T1218)

  The primary data sources that will provide the best evidence for this threat include process creation events within Windows systems logs, specifically focusing on the usage of `wuauclt.exe`, along with associated command line inputs that could reveal unusual activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs for instances of `wuauclt.exe` being executed. Check for unusual parent processes or execution patterns that deviate from baseline behavior.

  - **Analyze Command Line Arguments:** Investigate the command line parameters used with `wuauclt.exe`. Pay particular attention to any that involve `UpdateDeploymentProvider` or the loading of any suspicious DLLs such as `UpdateDeploy.dll`, as these can indicate abnormal usage.

  - **Check for Associated Network Activity:** Monitor outbound connections from the host running `wuauclt.exe`. Look for unusual or unexpected communications that may align with suspected command and control traffic, potentially tying back to the observed process.

  - **Correlate with Other Security Tools:** Use EDR/NDR logs to correlate any identified suspicious activity with alerts from antivirus, firewall logs, or suspicious behaviors logged by other security instruments to provide a more holistic view of the threat landscape.

  ### Prioritization
  The severity of this alert is classified as high due to the potential impact on the organization's security posture. Exploitation of legitimate tools for malicious purposes poses a significant risk, leading to unauthorized access and data breaches.

  ### Blind Spots and Assumptions
  There are potential blind spots regarding detection of obfuscated or modified invocations of `wuauclt.exe` if attackers employ sophisticated evasion techniques that do not trigger the detection logic. The detection assumes that process creation logs are enabled and available for all Windows endpoints in the environment, and relies on the presence of common command line arguments used by legitimate applications. Adjustments to logging configurations, particularly for command-line auditing, may be necessary to ensure comprehensive monitoring capabilities.

