detection:
  selection_img:
  - Image|endswith: '\wuauclt.exe'
  - OriginalFileName: 'wuauclt.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'UpdateDeploymentProvider'
    - 'RunHandlerComServer'
  filter_main_generic:
        # Note: Please enhance this if you find the full path
    CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
  filter_main_wuaueng:
        # Note: Please enhance this if you find the full path
    CommandLine|contains: ' wuaueng.dll '
  filter_main_uus:
    CommandLine|contains:
    - ':\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId'
    - ':\Windows\UUS\amd64\UpdateDeploy.dll /ClassId'
  filter_main_winsxs:
    CommandLine|contains|all:
    - ':\Windows\WinSxS\'
    - '\UpdateDeploy.dll /ClassId '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows Update Client (wuauclt.exe) when used for proxy execution, particularly when specific command lines are employed that are indicative of unauthorized operations. The behavior suggests an attempt by an attacker to execute code remotely or perform actions that are typically restricted or monitored. The likely attacker objective may involve evading detection while executing payloads or establishing footholds within the environment.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection are: **Execution (T1203) and Defense Evasion (T1218)**. The primary telemetry sources include Windows Process Creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1, which capture process-related activities along with command-line parameters. If malicious, such behavior could lead to significant security impacts, including unauthorized access to systems and data exfiltration.

  However, this detection does NOT confirm compromise on its own; legitimate uses of wuauclt.exe exist in normal system operations, which may result in false positives.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Security Event ID 4688 and Sysmon Event ID 1 for instances of wuauclt.exe running with suspicious command-line arguments, such as those containing 'UpdateDeploymentProvider' and 'RunHandlerComServer'.

  - **Identify the originating user context:** Check the user or service account that executed the wuauclt.exe process. Active directories or managed service accounts showing anomalies in execution times could be benign while enterprise admins or system accounts executing this at odd hours warrant further investigation.

  - **Correlate with event logs from related activities:** Query for events in Windows Event Logs (Event ID 4101) to see if there’s a pattern of additional network activities from the source machine, particularly outbound connections to unusual IP addresses or domains shortly after the execution of wuauclt.exe.

  - **Validate legitimate usage patterns:** Confirm whether wuauclt.exe execution is aligned with Windows update behavior (e.g., Windows updates scheduled or initiated by administrative tasks) by examining system update history through Windows Update logs for corresponding timestamps.

  - **Check for unusual file creations or deletions:** Look for significant changes in the following directories post-execution: `C:\Windows\System32\` or `C:\Windows\UUS\Packages\`. Any DLL changes or anomalously timed file operations may indicate malicious activities.

  - **Assess for Command-Line Arguments Related Indicators:** Identify any command-line arguments that include paths to UpdateDeploy.dll or similar terms in the output of Process Creation events, as they are linked to potentially abusive behaviors.

  ### Prioritization

  The alert severity is high due to the sensitive nature of the affected system being capable of managing updates and configurations. The likelihood of malicious abuse is significant; adversaries often exploit processes like wuauclt.exe to circumvent security controls and remain undetected. This method has been weaponized in targeted campaigns, indicating a clear risk to enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as obfuscation of command-line arguments or misuse of legitimate administrative tools. Reliable detection depends on the availability and correct configuration of Windows Process Creation and Sysmon logs. Legitimate update processes initiated by IT staff or scheduled tasks may trigger this alert, thus requiring context to clarify the situation. Complementary detections related to unusual network connections (e.g., unusual outbound traffic from the same host) can strengthen coverage and reduce false positive rates.

