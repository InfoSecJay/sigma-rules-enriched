description: Detects the use of the Windows Update Client binary (wuauclt.exe) 
  for proxy execution.
references:
- https://dtm.uk/wuauclt/
- https://blog.malwarebytes.com/threat-intelligence/2022/01/north-koreas-lazarus-apt-leverages-windows-update-client-github-in-latest-campaign/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), Florian 
  Roth (Nextron Systems), Sreeman, FPT.EagleEye Team
date: 2020-10-12
modified: 2023-11-11
tags:
- attack.stealth
- attack.t1218
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wuauclt.exe'
  - OriginalFileName: 'wuauclt.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'UpdateDeploymentProvider'
    - 'RunHandlerComServer'
  filter_main_generic:
        # Note: Please enhance this if you find the full path
    CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
  filter_main_wuaueng:
        # Note: Please enhance this if you find the full path
    CommandLine|contains: ' wuaueng.dll '
  filter_main_uus:
    CommandLine|contains:
    - ':\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId'
    - ':\Windows\UUS\amd64\UpdateDeploy.dll /ClassId'
  filter_main_winsxs:
    CommandLine|contains|all:
    - ':\Windows\WinSxS\'
    - '\UpdateDeploy.dll /ClassId '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the use of `wuauclt.exe`, the Windows Update Client, to facilitate proxy execution for potentially malicious payloads. The likely attacker objective is to exploit legitimate Windows functionality to execute commands or deliver malicious content covertly, often with the intent of maintaining persistence or conducting further exploitation. This behavior aligns with the MITRE ATT&CK technique **T1218 - Signed Binary Proxy Execution**. Primary telemetry sources include process creation events from Windows Security Event ID 4688 or Sysmon Event ID 1, capturing command execution details. If malicious, successful exploitation could lead to data exfiltration or lateral movement within the network. However, detection of this rule does NOT confirm malicious activity on its own, as the activity may also be triggered by legitimate updates or administrative tasks.

  ### Investigation Steps

  - **Review process creation details:** Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for the `wuauclt.exe` process. Verify the command line arguments for indications of unusual activity (e.g., `UpdateDeploymentProvider` and `RunHandlerComServer`).

  - **Analyze command line execution:** Look for command line parameters containing `UpdateDeploymentProvider.dll` or paths including `\Windows\UUS\Packages\Preview\` to identify potential proxies being used for execution.

  - **Baseline expected behavior:** Identify legitimate instances of `wuauclt.exe` executions within the environment (typically running without suspicious command line flags), comparing against newly detected instances to discern anomalies.

  - **Cross-reference application whitelisting:** Check if `wuauclt.exe` is included in an application whitelisting solution. If it is not, this could indicate abnormal usage, especially if coupled with suspicious command line arguments.

  - **Confirm file creation or modification:** Investigate file changes in directories related to `wuauclt.exe`, such as `C:\Windows\System32\`, for recent modifications to associated DLLs or any unexpected file creations or deletions.

  - **Assess network traffic patterns (if applicable):** Monitor network logs for outbound connections initiated by `wuauclt.exe` to unusual IP addresses or ports, which may indicate data exfiltration or command and control communication linked to the malicious use of the binary.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on critical systems if exploitative behavior is confirmed. The misuse of `wuauclt.exe` can often facilitate stealthy and persistent access to affected systems, making it a common target for adversary tactics.

  ### Blind Spots and Assumptions

  Detection can be evaded through the use of alternative executable names or by exploiting less monitored processes. The effectiveness of this detection relies on proper logging configurations for process creation and may be limited in environments with stringent application whitelisting. Legitimate activities such as scheduled updates or administrative scripts might trigger this alert, necessitating careful contextual analysis. Related detections, such as those monitoring for unexpected DLL injection across processes, can enhance overall coverage and response capabilities.

