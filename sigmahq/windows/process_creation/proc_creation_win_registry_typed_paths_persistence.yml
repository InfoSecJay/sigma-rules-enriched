  ---

  ### Technical Context

  This rule detects modifications to the 'TypedPaths' registry key, typically manipulated via command line, indicating a potential persistence mechanism being employed by an adversary. The likely objective of the attacker is to establish persistence so that their malicious code or command can be executed each time a user accesses the Windows Explorer interface. This behavior is relevant to the MITRE ATT&CK framework under the tactic of Persistence, specifically technique T1548.001 (Registry Run Keys / Startup Folder).

  The primary telemetry source for this detection is Windows process creation logs, specifically targeting entries where the CommandLine contains references to the 'TypedPaths' registry key located at \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths. If malicious, this could compromise the integrity of user sessions and security configurations. Crucially, this detection does NOT confirm that malicious activity has occurred, as legitimate applications can also modify registry entries.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Check for command lines that contain ‘\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths’ in Security Event ID 4688 or Sysmon Event ID 1. Look for unusual executables or scripts not commonly associated with registry modifications.

  - **Compare with known benign processes:** Cross-reference the user context and process hashes against a whitelist of known applications. Legitimate modifications often stem from system utilities and trusted applications that can be associated with typical user interaction.

  - **Assess user permissions:** Investigate whether the user account making the change has the appropriate administrative privileges. Unprivileged accounts modifying this registry key may indicate unauthorized activity.

  - **Examine associated user activity:** Check for recent user activity or scheduled tasks that coincide with the registry modification. Look for signs of unusual behavior patterns (e.g., unusual login times) recorded in the Windows Security log (Event ID 4624).

  - **Validate persistence mechanisms:** Look for other persistence mechanisms alongside the 'TypedPaths' modification such as the Registry's Run key (HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run) in Security Event ID 4688. This can confirm if multiple persistence attempts are being made.

  - **Monitor for evidence of exploitation:** Identify any potential indicators of compromise, including the creation of files or processes that run on system startup or user logon, which may indicate further malicious intent or actions taken post-initial compromise.

  ---

  ### Prioritization

  The alert severity is medium, as the modification of the 'TypedPaths' can facilitate malicious persistence. While the likelihood of malicious use is notable, legitimate system tools may also trigger this alert. Hence, further context is necessary to assess its impact.

  ---

  ### Blind Spots and Assumptions

  This detection may miss modifications conducted through alternate means or scripts that do not utilize command line interface. It relies on the collection of process creation logs, which must be properly configured on all endpoints for comprehensive visibility. Legitimate software installations or configurations may also modify registry entries. To strengthen coverage, combine this detection with alerts on registry modifications (e.g., directly monitoring changes within the registry via Sysmon Event ID 13).

