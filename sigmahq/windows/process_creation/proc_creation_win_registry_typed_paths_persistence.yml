note: |
  ### Technical Context
  This detection rule identifies potential persistence mechanisms leveraged by attackers through modifications to the `TypedPaths` registry key in Windows, which can store previously accessed file paths. By monitoring command line operations that add or modify this specific registry entry, the rule aims to uncover instances where an attacker may be attempting to achieve persistence on a compromised system. This behavior may be indicative of post-exploitation activities where attackers seek to maintain access or reinstate malicious operations after reboots.

  The attacker’s objective might include ensuring continuity of control over a target system by leveraging the `TypedPaths` registry, allowing them to execute programs or scripts on system startup or user login. This tactic aligns with the MITRE ATT&CK framework under T1547.001 – "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder". Monitoring for registry modifications through command lines can reveal proactive efforts by adversaries to embed their presence within a system's configuration.

  Primary data sources that provide the best evidence for this detection include:
  - Process creation events that capture command line inputs.
  - Registry access logs, particularly focused on user and administrative registry interactions.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine recent process creation events where the command line parameters contain entries related to `TypedPaths`. Identify any unusual processes or commands executed around the same time.

  - **Analyze Registry Changes:** Investigate the corresponding registry entries under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths` and `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths` for recent modifications.

  - **Correlate User Activity:** Correlate the identified suspicious process creation with user activities to determine if the user operates under normal behavioral patterns or if there are any discrepancies.

  - **Check for Other Persistence Mechanisms:** Look for other indicators of persistence that might accompany these modifications in the registry, such as scheduled tasks, startup items, or modifications to other registry keys.

  ### Prioritization
  The medium severity of this alert is justified due to its potential implications for unauthorized persistence within an enterprise environment, indicating a possible compromise and the need for immediate investigation to mitigate further risks.

  ### Blind Spots and Assumptions
  This detection may overlook legitimate user behavior that involves modifications to the `TypedPaths` registry key, leading to false positives. It assumes that sufficient logging is enabled to capture command line input for process creation and that the environment includes standard registry access logging. Additionally, this detection may not catch modifications made through GUI, scripts, or by actors with elevated privileges that bypass system-level logging mechanisms.

