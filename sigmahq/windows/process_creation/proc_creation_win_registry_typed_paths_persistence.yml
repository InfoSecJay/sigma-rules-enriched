  ### Technical Context

  This Sigma rule detects modifications to the 'TypedPaths' registry key via command line execution on Windows systems. This behavior is often indicative of an attacker attempting to establish persistence, allowing them to execute malicious code each time a user accesses the file explorer. This detection is aligned with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique Registry Run Keys / Startup Folder (T1547.001). The primary telemetry sources include process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, capturing command line details.

  If this activity is malicious, the attacker could maintain a foothold within the environment, moving laterally or escalating privileges unnoticed. However, this detection does NOT confirm malicious intent on its own; legitimate applications or scripts may also modify these paths.

  ### Investigation Steps

  - **Check command line details:**
    Investigate Windows Event ID 4688 or Sysmon Event ID 1 to review the specific command lines used. Look for entries containing registry modification commands targeting the path `\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths`.

  - **Identify user context:**
    Review the user account associated with the event logs. If the modification is made by a non-administrative user in a critical system context (e.g., a domain controller), this indicates potential malicious activity.

  - **Search for other registry modifications:**
    Examine the Windows Registry for recent changes to the 'TypedPaths' key alongside other persistence-related keys (e.g., Run, RunOnce). Use PowerShell or a Registry comparison tool to highlight discrepancies.

  - **Document legitimate activity:**
    Investigate if the ‘TypedPaths’ modification corresponds to legitimate user actions, such as software installation or updates, where documented user workflows or change logs may explain the registry change.

  - **Correlate with additional telemetry:**
    Cross-reference findings with recent file access logs (Windows Security Event ID 4663), looking for patterns that demonstrate suspicious behavior after the registry change, such as unusual file access or execution of unknown applications.

  - **Evaluate potential for evasion:**
    Consider whether the system has appropriate logging enabled, ensuring all process creation events are captured. Review if existing EDR solutions are configured to monitor for command line activity for additional visibility.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of persistent threat actors. While not all modifications are malicious, the likelihood of misuse in a corporate environment makes it a noteworthy alert, especially against critical assets or during unusual activity patterns.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log all command line parameters adequately. Legitimate administrative tasks may also trigger this alert, such as clearing history or configuring user settings. It is beneficial to have companion detections for other registry modifications relating to persistence to enhance overall security posture and visibility.

