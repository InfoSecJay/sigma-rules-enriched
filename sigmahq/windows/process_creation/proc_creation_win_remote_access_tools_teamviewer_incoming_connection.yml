  ---

  ### Technical Context

  This detection identifies the execution of TeamViewer sessions initiated on a Windows host. The likely attacker objective is to gain unauthorized remote access to the target system, potentially leading to data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK framework under the tactic "Persistence" and the technique "External Remote Services" (T1133).

  The primary telemetry source for this alert comes from Windows process creation logs, specifically monitoring Event ID 4688. If malicious, this activity could compromise sensitive data or control over critical systems within the environment. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate TeamViewer usage may trigger the same alert.

  ---

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 for the creation of TeamViewer_Desktop.exe with associated command-line arguments, noting the user, time, and system involved.

  - **Identify incoming connection log**: Navigate to the TeamViewer directory on the endpoint and examine the "incoming_connections.txt" file to review details of the connection, including timestamps and originating IP addresses.

  - **Assess legitimate use cases**: Compare the alert’s timestamp against a known schedule or policy for remote support sessions. Document recent IT support activities that align with the TeamViewer startup.

  - **Investigate network connections**: Use network monitoring tools to identify any unusual outbound connections initiated by TeamViewer, focusing on IP addresses or domains not recognized as legitimate.

  - **Look for multiple sessions**: Determine if there are multiple, consecutive TeamViewer sessions initiated from the same host within a short timeframe, which may indicate suspicious behavior.

  - **Evaluate user roles**: If the session involves a privileged user or a sensitive asset, escalate the investigation due to the heightened risk associated with potential unauthorized access.

  ---

  ### Prioritization

  This alert is deemed low severity primarily because it reflects a legitimate remote access tool often used for support purposes. However, if combined with other indicators of compromise, especially on critical systems or users, it could suggest malicious activity needing immediate attention.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the use of legitimate remote access tools under various company policies, creating potential false positives. Ensuring logging for Event ID 4688 and incoming connection logs from TeamViewer is crucial for reliable detection. Additionally, non-malicious remote support sessions may trigger false alerts. Consider complementary detections, such as monitoring outbound connections for unusual external access patterns, to strengthen coverage against unauthorized remote access attempts.

