  ---

  ### Technical Context

  This rule detects the execution of TeamViewer on a Windows host, specifically when a remote session begins. The primary aim of an attacker using TeamViewer would be to establish persistent access to the compromised system for data exfiltration or further exploitation. This behavior aligns with the MITRE ATT&CK tactic of "Persistence" (TA0003) and the technique "External Remote Services" (T1133).

  The primary telemetry source is Windows Process Creation logs, specifically focusing on process execution details captured in Security Event ID 4688. The potential security impact is significant, as unauthorized use of TeamViewer can lead to data breaches or unauthorized control of systems. Importantly, this detection does not prove malicious intent on its own; legitimate TeamViewer usage may also trigger this alert.

  ---

  ### Investigation Steps

  - **Check process creation log details:** Review Security Event ID 4688 for the execution of `TeamViewer_Desktop.exe` with the expected command line `--IPCport 5939 --Module 1`. Confirm the ParentImage is `TeamViewer_Service.exe`. Malicious indicators include unfamiliar user accounts or unusual execution times.

  - **Validate the connection log:** Inspect the `incoming_connections.txt` file located in the TeamViewer directory. Verify the IP address and usernames present against expected remote endpoints. Legitimate sessions usually originate from known, trusted locations.

  - **Review user behavior history:** Examine logged user activities (via Event ID 4624) on the subject host to identify normal usage patterns for the TeamViewer application. Any discrepancies might indicate unauthorized use.

  - **Correlate with existing alerts:** Check if there are any recent alerts related to remote access tools or unusual outbound network traffic (e.g., on ports 5938, 5939). Such alerts can indicate reconnaissance or exploitation activities.

  - **Assess asset criticality:** Determine if the affected host is critical to business operations or contains sensitive data. Increased scrutiny may be required if the host is part of a higher-value environment.

  ---

  ### Prioritization

  This alert has a low severity level in an enterprise context, as TeamViewer can be used legitimately. However, the likelihood of abuse exists, especially if unauthorized users gain access. The behavior can be weaponized in targeted attacks, warranting appropriate follow-up.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by proper configuration of the logging settings in Windows; any missed logs can obscure detection efforts. Legitimate remote support operations may cause false positives if TeamViewer is widely employed within the organization. Related detections, such as capturing unusual outbound firewall logs during TeamViewer usage, would enhance coverage and context.

