title: Potential SSH Tunnel Persistence Install Using A Scheduled Task
id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
status: experimental
description: Detects the creation of new scheduled tasks via commandline, using Schtasks.exe.
  This rule detects tasks creating that call OpenSSH, which may indicate the creation
  of reverse SSH tunnel to the attacker's server.
references:
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://www.kroll.com/en/insights/publications/cyber/cactus-ransomware-prickly-new-variant-evades-detection
author: Rory Duncan
date: 2025-07-14
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
- attack.command-and-control
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_sshd:
    CommandLine|contains|all:
    - ' /create '
    - 'sshd.exe'
    - '-f'
  selection_cli_ssh:
    CommandLine|contains|all:
    - ' /create '
    - 'ssh.exe'
    - '-i'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks using `schtasks.exe`, specifically targeting command lines that involve `sshd.exe` or `ssh.exe`, indicating potential reverse SSH tunnels. The likely objective of the attacker is to establish persistent remote access to the compromised environment, facilitating command and control operations. This behavior falls under the MITRE ATT&CK Tactic: Persistence (TA0003) and Technique: Scheduled Tasks (T1053.005).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details on process execution. If malicious, this could lead to unauthorized access and control over critical systems, effectively compromising the integrity of the environment. Importantly, this detection does not confirm whether the created task was activated or used for malicious purposes on its own.

  ---

  ### Investigation Steps

  - **Identify the creation of scheduled tasks:** Review Security Event ID 4688 and Sysmon Event ID 1 for processes originating from `schtasks.exe`. Look for command lines containing `/create`, `sshd.exe`, or `ssh.exe` as primary indicators of potential malicious activity.

  - **Assess the task's execution status:** Check Task Scheduler on affected systems for newly created tasks. Look for any tasks associated with `sshd.exe` or `ssh.exe` that indicate persistence mechanisms. Expected behavior may include standard administrative tasks created by known software.

  - **Validate benign activities:** Cross-reference any alerts with legitimate administrative procedures. Scheduled tasks created for scheduled software updates or backup processes could include `sshd.exe` for legitimate purposes; verify with system documentation.

  - **Review additional logging sources:** Examine Windows Event Logs, specifically Task Scheduler logs (Event ID 106), to capture details of task creation and execution. Identify anomalies in task attributes or unexpected command line options.

  - **Check for unauthorized access attempts:** Evaluate logins to the system before and after the task was created (Windows Security Event ID 4624) to identify any suspicious user accounts or timings that align with the task’s creation.

  - **Correlate with threat intelligence:** Search for indicators from threat intelligence sources that may link `sshd.exe` or `ssh.exe` usage to known attack patterns or reported incidents in similar settings.

  ---

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems if malicious access is established through persistent reverse SSH tunnels. This behavior is a commonly utilized technique for maintaining a foothold within an environment, highlighting a significant likelihood of malicious intent.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of specific logging configurations, particularly if process creation logs are not fully enabled. Additionally, legitimate system administration activities, such as automated backups or remote management events, could trigger this alert. Companion detections related to unusual outbound SSH traffic (e.g., monitoring network traffic for known external IPs associated with SSH tunneling) could enhance coverage and improve threat detection capabilities.

