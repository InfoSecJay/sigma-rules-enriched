title: Potential SSH Tunnel Persistence Install Using A Scheduled Task
id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
status: experimental
description: Detects the creation of new scheduled tasks via commandline, using Schtasks.exe.
  This rule detects tasks creating that call OpenSSH, which may indicate the creation
  of reverse SSH tunnel to the attacker's server.
references:
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://www.kroll.com/en/insights/publications/cyber/cactus-ransomware-prickly-new-variant-evades-detection
author: Rory Duncan
date: 2025-07-14
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
- attack.command-and-control
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_sshd:
    CommandLine|contains|all:
    - ' /create '
    - 'sshd.exe'
    - '-f'
  selection_cli_ssh:
    CommandLine|contains|all:
    - ' /create '
    - 'ssh.exe'
    - '-i'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks via the command line that involve OpenSSH components, such as `ssh.exe` and `sshd.exe`. This activity could signify an attacker establishing a reverse SSH tunnel, a technique used for maintaining persistence and remote access to a compromised environment. The use of scheduled tasks in this context often indicates an effort to automate malicious actions, enabling the attacker to regain access even after initial compromise.

  The potential threat scenario here includes attackers leveraging tools like Cobalt Strike or custom malware that utilize SSH for command and control (C2). By creating scheduled tasks that rely on SSH, the adversary aims to create a backdoor that facilitates communication with their C2 infrastructure. This behavior falls under several MITRE ATT&CK tactics and techniques: Persistence (T1053.005), Execution (T1059.001), and Command and Control (T1071.001).

  Primary data sources that would yield evidence for this detection include process creation logs, which capture command-line arguments and application details associated with scheduled task creation. Additionally, monitoring PowerShell logs, execution logs from Windows Task Scheduler, and SSH connection logs might provide further insight into the attack.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs for any instances of `schtasks.exe` being executed along with command lines that include 'sshd.exe' or 'ssh.exe' to trace planned persistence activities.

  - **Analyze Task Scheduler History:** Look for newly created or modified scheduled tasks within Windows Task Scheduler. Pay close attention to task triggers and action configurations that involve launching SSH-related executables.

  - **Inspect Network Traffic:** Validate any outbound SSH connections that correspond with the timestamps of the detected task creation. This may help identify potential command and control communications initiated by the scheduled tasks.

  - **Check for Indicators of Compromise (IOCs):** Utilize threat intelligence to correlate against known IOCs associated with SSH tunneling or the specific threat campaigns referenced in the provided links. Ensure that any detected artifacts match the profiles of documented attack tools.

  ### Prioritization
  This alert should be prioritized as high severity due to the potential impact of reverse SSH tunnels, which can lead to ongoing unauthorized access and data exfiltration. The likelihood of this tactic being used by advanced persistent threat (APT) groups or skilled malware authors makes it a significant concern in enterprise environments.

  ### Blind Spots and Assumptions
  Detection may be limited by the availability of process creation logs or insufficient monitoring of scheduled task activities. Assumptions made by this detection logic include that the adversary will utilize standard command-line arguments while executing SSH tasks. Additionally, the accuracy of detection hinges on comprehensive logging configurations for Windows processes and task scheduling, which must be fully enabled for the rule to trigger effectively.

