title: Potential SSH Tunnel Persistence Install Using A Scheduled Task
id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
status: experimental
description: Detects the creation of new scheduled tasks via commandline, using 
  Schtasks.exe. This rule detects tasks creating that call OpenSSH, which may 
  indicate the creation of reverse SSH tunnel to the attacker's server.
references:
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://www.kroll.com/en/insights/publications/cyber/cactus-ransomware-prickly-new-variant-evades-detection
author: Rory Duncan
date: 2025-07-14
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
- attack.command-and-control
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli_sshd:
    CommandLine|contains|all:
    - ' /create '
    - 'sshd.exe'
    - '-f'
  selection_cli_ssh:
    CommandLine|contains|all:
    - ' /create '
    - 'ssh.exe'
    - '-i'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of scheduled tasks using `schtasks.exe` that invoke OpenSSH (`sshd.exe` or `ssh.exe`). This behavior is indicative of a potential adversary attempting to establish a reverse SSH tunnel for persistent access to an exploited system. The relevant MITRE ATT&CK tactics involved are Persistence (T1053.005) and Command and Control (T1071.001). The primary telemetry comes from Windows process creation events, particularly using Security Event ID 4688 which records command line arguments and executable paths.

  If the detected activity is malicious, the impact could be significant, as it may lead to unauthorized remote access, data exfiltration, or lateral movement within the network. However, it is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative tasks may utilize similar command patterns.

  ### Investigation Steps

  - **Examine scheduled task creation events**: Review all Security Event ID 4688 logs from the host to identify the creation of new scheduled tasks with command lines matching `sshd.exe` or `ssh.exe`. Focus on the `CommandLine` field for indicators of reverse tunneling.

  - **Identify the originating user context**: Check the `TargetUserName` field in Event ID 4688 for the user account that executed the command. Determine if it aligns with known administrative or automated tasks; unexpected accounts may indicate malicious activity.

  - **Cross-reference scheduled task settings**: Investigate Task Scheduler to list all tasks scheduled on the affected system. Look for unusual schedule times or commands that deviate from normal operational tasks, as benign tasks typically follow a predictable schedule.

  - **Verify presence of SSH artifacts**: Search for the creation of SSH keys or configuration files in `C:\Users\<username>\.ssh\` or other common locations. Artifact creation or manipulation may provide additional evidence supporting the initial alert.

  - **Check for network connections**: Utilize tools like `netstat` to ascertain active connections from the host. Look for connections to unusual or suspicious external IP addresses that may indicate established SSH tunnel usage.

  - **Consult recent system changes**: Review system logs for any recent installations, updates, or configuration changes that may correlate with the creation of the suspicious scheduled task. Identify if any user-initiated or system-initiated activities could create legitimate context.

  ### Prioritization

  This alert is of high severity, as the creation of a scheduled task to facilitate a reverse SSH tunnel can enable a persistent foothold for an attacker. The likelihood of abuse for malicious intents is significant, especially as this behavior has been linked to advanced persistent threats in ongoing investigations.

  ### Blind Spots and Assumptions

  Detection may be circumvented if the attacker uses disguised or obfuscated command lines to create tasks, or if scheduled tasks are created using alternate methods. The required log sources include detailed process creation logging from all domain-joined systems. Legitimate remote administration tools or scripts may trigger similar alerts. A companion detection could be monitoring for unusual outbound SSH connections or the execution of unusual scripts that use `wsus`, which can help correlate activity.

