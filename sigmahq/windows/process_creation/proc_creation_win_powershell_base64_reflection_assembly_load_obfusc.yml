note: |
  ### Technical Context

  This rule detects suspicious behavior involving Base64 encoded strings and obfuscated calls to the .NET `AppDomain.Load` functionality, which can indicate attempts to execute malicious code hidden within otherwise benign applications. The likely objective of an adversary leveraging this technique is to load and execute a payload in a stealthy manner, evading detection by security solutions. This behavior aligns with MITRE ATT&CK tactics, specifically Execution (T1203: Exploitation for Client Execution) and Stealth (T1027: Obfuscation).

  The primary telemetry source is Windows process creation logs, specifically focusing on command line arguments that contain encoded references to "load." If successful, this method can allow an attacker to run arbitrary code with the privileges of the compromised application. It is critical to note that this detection alone does not confirm malicious activity; legitimate applications may utilize similar patterns under specific contexts.

  ### Investigation Steps

  - **Examine Command Line Arguments:** Review process creation events for the detected command lines using Security Event ID 4688. Look for `CommandLine` containing Base64 encoded strings that reference “load” in suspicious contexts.

  - **Verify Process Context:** Identify the parent process of the suspicious command line invocation. Legitimate behavior may include known system processes or well-defined applications (e.g., Microsoft Office). Security Event ID 4688 will provide the `ParentProcessId` field to assist in this analysis.

  - **Assess Execution Context:** Investigate the user context under which the suspicious command ran. Analyze Event ID 4624 (Successful Logon) for the user account that executed the command. Comparisons with historical activity can differentiate between normal user behavior and potential misuse.

  - **Identifying Malicious Artifacts:** Review for any newly created or modified files in the application directory corresponding to the executing process. Check for unusual file creation timestamps and names that could indicate malicious payloads, correlating with Sysmon Event ID 11 (File Creation Time).

  - **Correlate with Threat Intelligence:** Reference threat intelligence sources to identify any known malicious activities involving encoded calls to `AppDomain.Load`. This may reveal broader patterns or campaign intelligence related to encoded payloads.

  ### Prioritization

  This alert should be treated with high priority due to the potential for significant impact if an attacker is able to successfully execute obfuscated code on a critical system. The obfuscation techniques used in this detection are not only commonly weaponized but also can lead to further compromise within the network, if left unchecked.

  ### Blind Spots and Assumptions

  Detection may be limited by adversary evasion techniques, such as further obfuscation or usage of alternative methods to invoke code execution that may not be captured by this rule. It relies heavily on monitoring for specific command line patterns, which may overlook legitimate obfuscation in benign applications. It is advisable to cross-reference with companion detections, such as anomalous network traffic or suspicious file downloads, to strengthen overall coverage and detection confidence.

