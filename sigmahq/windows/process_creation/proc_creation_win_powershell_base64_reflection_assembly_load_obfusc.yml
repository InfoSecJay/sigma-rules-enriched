  ---

  ### Technical Context

  This rule detects suspicious behavior involving the use of encoded and obfuscated commands specifically targeting the .NET `Reflection.Assembly.Load` function. Attackers may use this to load assemblies dynamically while bypassing traditional security controls, facilitating further exploitation. The primary objective is to execute malicious code in a stealthy manner, often as part of a larger attack campaign.

  Relevant MITRE ATT&CK tactics include Execution (T1059.001) and Defense Evasion (T1027). The primary telemetry source for this detection is Windows process creation logs (Event ID 4688 and Sysmon Event ID 1), specifically focusing on command line arguments that contain obfuscated function calls. If successful, such actions could enable malware to operate unhindered, escalate privileges, or even establish persistence. However, this detection does NOT confirm that any code executed is malicious on its own, as legitimate software may also employ similar techniques.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Event ID 4688 or Sysmon Event ID 1 for commands that include obfuscated references to `Load`. Look for strings like `OgA6ACgAIgBMACIAKwAiAG8AYQBkACIAKQ` to confirm the presence of encoded commands.

  - **Identify overall context of execution:** Cross-reference the time of alert with other logs such as Authentication logs (Event ID 4624) or Sysmon Event ID 10 (process create). Identify if the executing user account has a history of executing potentially malicious commands.

  - **Check associated parent processes:** Look for anomalies in the parent process using Sysmon Event ID 3, specifically if the parent process is a rare or known malicious application indicating an unusual execution chain.

  - **Validate legitimate software activity:** Compare the identified command against expected behavior patterns of authorized applications. Legitimate .NET applications might use reflection, but their command lines are generally more human-readable and do not utilize extensive obfuscation.

  - **Search for indicators of compromise (IoC):** Investigate if the detected malicious command is linked to known malware (e.g., use antivirus or EDR tools for file hash checks). Searching public threat intelligence repositories or internal cases for similar activities can help validate the malicious nature of the actions undertaken.

  - **Evaluate asset criticality:** Confirm the security level of the involved host system, focusing on if it's a critical server or workstation. Higher criticality systems may require immediate escalation if malicious behavior is confirmed.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on enterprise systems. The use of obfuscated commands suggests likely malicious intent, and this technique is commonly leveraged by adversaries to bypass detection mechanisms. Given its capability to execute arbitrary code, swift response is warranted.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to use similar techniques, which could generate false positives. Required log sources are essential, and without process creation logs being sufficiently collected and retained, detection effectiveness could diminish. Legitimate activities that may trigger the alert include benign applications making legitimate use of reflection for loading assemblies. A related detection to consider is monitoring for unusual access patterns via Network connections (e.g., unusual HTTP/S requests or unexpected DNS resolutions), which could correlate with malicious assembly loading.

