title: XBAP Execution From Uncommon Locations Via PresentationHost.EXE
id: d22e2925-cfd8-463f-96f6-89cec9d9bc5f
status: test
description: |
  Detects the execution of ".xbap" (Browser Applications) files via PresentationHost.EXE from an uncommon location. These files can be abused to run malicious ".xbap" files any bypass AWL
references:
- https://lolbas-project.github.io/lolbas/Binaries/Presentationhost/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-01
modified: 2023-11-09
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\presentationhost.exe'
  - OriginalFileName: 'PresentationHost.exe'
  selection_cli:
    CommandLine|contains: '.xbap'
  filter_main_generic:
    CommandLine|contains:     # Filter out legitimate locations if you find them
    - ' C:\Windows\'
    - ' C:\Program Files'
  condition: all of selection* and not 1 of filter_main_*
falsepositives:
- Legitimate ".xbap" being executed via "PresentationHost"
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of ".xbap" (XML-Based Application) files via `PresentationHost.EXE` from uncommon locations in the file system. XBAP files can be leveraged by threat actors to run unauthorized web applications, potentially leading to security incidents such as data exfiltration or system compromise. Attackers may exploit this functionality to execute malicious scripts in environments where standard executable files may be restricted, thus employing evasion techniques against traditional security controls.

  The relevant MITRE ATT&CK techniques for this rule are:
  - **Execution**: T1203 (Exploitation for Client Execution)
  - **Defense Evasion**: T1218 (Signed Binary Proxy Execution)

  Primary data sources for this detection include:
  - Process creation event logs that capture details of executed commands.
  - File system monitoring to track the locations from which executable files are run.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation logs for `PresentationHost.EXE` executions, particularly focusing on the command line to identify any instances involving ".xbap" files.
  - **Analyze File Locations**: Verify the paths from which `PresentationHost.EXE` is being executed. Investigate any uncommon or suspicious directories outside standard application paths (e.g., C:\Windows\, C:\Program Files).
  - **Inspect Command Line Arguments**: Carefully analyze the command line arguments for executed instances of `PresentationHost.EXE`. Look for abnormal or unexpected parameters that may indicate malicious intent.
  - **Cross-reference with Known Threats**: Compare findings against a database of known malicious XBAP files or related threats. Investigate any matches or suspicious patterns with the command lines used.

  ### Prioritization
  This alert is deemed medium severity due to the potential for exploitation by adversaries using XBAP files to evade security controls, as well as the risk posed to the integrity of enterprise systems if successful. The likelihood of exploitation hinges on the environment's exposure to untrusted applications.

  ### Blind Spots and Assumptions
  This detection may miss legitimate uses of `.xbap` files executed from uncommon locations, leading to potential false positives. The logic assumes that there are well-defined paths for legitimate use cases and that all relevant execution contexts have been defined. Additionally, proper logging across all endpoints is necessary for effective detection; if process creation logging is disabled or incomplete, gaps in visibility may occur.

