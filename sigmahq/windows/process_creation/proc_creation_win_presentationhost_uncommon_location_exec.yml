title: XBAP Execution From Uncommon Locations Via PresentationHost.EXE
id: d22e2925-cfd8-463f-96f6-89cec9d9bc5f
status: test
description: |
  Detects the execution of ".xbap" (Browser Applications) files via PresentationHost.EXE from an uncommon location. These files can be abused to run malicious ".xbap" files any bypass AWL
references:
- https://lolbas-project.github.io/lolbas/Binaries/Presentationhost/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-01
modified: 2023-11-09
tags:
- attack.execution
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\presentationhost.exe'
  - OriginalFileName: 'PresentationHost.exe'
  selection_cli:
    CommandLine|contains: '.xbap'
  filter_main_generic:
    CommandLine|contains:     # Filter out legitimate locations if you find them
    - ' C:\Windows\'
    - ' C:\Program Files'
  condition: all of selection* and not 1 of filter_main_*
falsepositives:
- Legitimate ".xbap" being executed via "PresentationHost"
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of ".xbap" files using `PresentationHost.EXE` from uncommon locations, which can indicate malicious activity. Attackers may leverage this technique to execute harmful browser applications while evading security measures. The relevant MITRE ATT&CK techniques include Execution (T1203) and Stealth (T1218), as the execution of these files often bypasses traditional detection mechanisms.

  The primary telemetry source for this detection is the Windows process creation logs, specifically Event ID 4688 or Sysmon Event ID 1, which capture process execution details such as command lines and image paths. If this activity is malicious, it may lead to unauthorized access, data exfiltration, or system compromise. Importantly, this detection does NOT confirm malicious intent on its own; legitimate executions of ".xbap" files can occur in standard environments.

  ### Investigation Steps

  - **Identify execution path:**
    Check the `NewProcessName` field from Event ID 4688 (or Sysmon Event ID 1) to confirm the location of `PresentationHost.EXE`. Legitimate usage typically occurs from `C:\Windows\` or `C:\Program Files`.

  - **Review command line arguments:**
    Examine the `CommandLine` field for the presence of ".xbap". If the command line references uncommon paths (e.g., user directories, temporary folders), note this as a malicious indicator.

  - **Cross-check process parentage:**
    Investigate the `ParentProcessName` field in the relevant event to determine if `PresentationHost.EXE` was spawned from a legitimate process (e.g., `iexplore.exe`, `chrome.exe`). Abnormal parent processes may indicate malware activity.

  - **Correlate with network activity:**
    Validate any related network connections in the timeframe of the alert using Process Explorer or Sysmon logs. Look for HTTP/S requests to unfamiliar domains post-execution as potential exfiltration attempts.

  - **Analyze file creation timestamps:**
    If applicable, review the file creation time of the ".xbap" file in the Windows filesystem to see if it correlates with the alert timestamp. Newly created files in uncommon locations around the time of execution can indicate a breach.

  - **Document known good instances:**
    Create a reference list of known legitimate ".xbap" applications executed with `PresentationHost.EXE` in your environment to help identify false positives in future investigations.

  ### Prioritization

  This alert carries a medium severity due to the potential impact on enterprise systems, especially if executed from user directories that are likely less monitored. The technique of exploiting `.xbap` from uncommon locations is increasingly weaponized by attackers to evade traditional security controls, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion if attackers use obfuscation techniques or alternate file types. Reliable detection requires configured Windows process creation logging (Event ID 4688 or Sysmon). Legitimate activities, such as trusted internal applications using `.xbap`, may unintentionally trigger alerts. Additionally, companion detections involving unusual network activity or access to unknown file locations could enhance coverage and context for suspicious behavior.

