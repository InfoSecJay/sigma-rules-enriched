title: XBAP Execution From Uncommon Locations Via PresentationHost.EXE
id: d22e2925-cfd8-463f-96f6-89cec9d9bc5f
status: test
description: |
  Detects the execution of ".xbap" (Browser Applications) files via PresentationHost.EXE from an uncommon location. These files can be abused to run malicious ".xbap" files any bypass AWL
references:
- https://lolbas-project.github.io/lolbas/Binaries/Presentationhost/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-01
modified: 2023-11-09
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\presentationhost.exe'
  - OriginalFileName: 'PresentationHost.exe'
  selection_cli:
    CommandLine|contains: '.xbap'
  filter_main_generic:
    CommandLine|contains:     # Filter out legitimate locations if you find them
    - ' C:\Windows\'
    - ' C:\Program Files'
  condition: all of selection* and not 1 of filter_main_*
falsepositives:
- Legitimate ".xbap" being executed via "PresentationHost"
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of ".xbap" files through PresentationHost.EXE when launched from uncommon directories. This behavior often indicates potential abuse of the Windows Presentation Foundation (WPF) browser application format to execute malicious payloads. The likely attacker objective is to leverage this file type to execute unauthorized code with the privileges of the user running the application, enabling both persistence and potential lateral movement within the network.

  This detection aligns with the MITRE ATT&CK framework, specifically under the "Execution" tactic (TA0002) and the "Malicious File" technique (T1218). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and relevant Sysmon Event ID 1. If confirmed malicious, it poses a medium-to-high risk, as it could lead to unauthorized system control or data exfiltration. Importantly, this detection alone does not confirm malicious activity without additional context regarding the file's origin or the executed command.

  ---

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 for processes initiated from uncommon directories (e.g., paths that do not include 'C:\Windows\' or 'C:\Program Files'). Compare the specific directory against known good lists to establish legitimacy.

  - **Analyze command line parameters**: Inspect the CommandLine field for Event ID 4688 or Sysmon Event ID 1 to confirm that it contains the ".xbap" extension. Identify any unusual parameters that deviate from expected use cases for legitimate applications.

  - **Validate PresentationHost.exe origin**: Confirm that the Image field references 'PresentationHost.exe' and check the OriginalFileName to ensure it matches expected characteristics. If the executable is sourced from a non-standard location, flag it for further scrutiny.

  - **Identify legitimate usage patterns**: Review previous activity timelines or usage logs for regular users of the system. Determine if any recent '.xbap' executions align with legitimate company processes or recent system/application updates that could explain the activity.

  - **Look for malicious indicators**: Analyze for indicators such as unusual outbound traffic patterns or file modifications coinciding with the execution of '.xbap' files. Check for any created files or processes that have not been seen previously on the host.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on systems where malicious execution of '.xbap' files can lead to escalation of privileges or lateral movement. The likelihood of this behavior being abused by adversaries is moderate, particularly as it leverages a native Windows feature that is commonly used but can also be weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not adequately configured to capture all process creation events or if there are evasion techniques used, such as renaming malicious files to blend in with legitimate traffic. Legitimate uses of '.xbap' files may trigger the alert, particularly during application updates or internal testing. A complementary detection includes monitoring for anomalous behavior associated with PowerShell scripts (T1059.001) that may be called subsequently after executing an '.xbap' to further assess intent.

