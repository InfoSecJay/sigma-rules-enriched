note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks on Windows systems that are configured to run once at midnight (00:00) using the `schtasks.exe` tool. The detection focuses on command line arguments and the conditions surrounding the task creation, examining for evasion techniques commonly used by threat actors to persist on systems without drawing attention. The scenarios typically involve attackers attempting to establish a foothold, escalate privileges, or execute malicious scripts covertly.

  Attackers leveraging this technique may be aiming to execute scripts that launch payloads during off-hours when users are less likely to be active, thus avoiding immediate detection by security personnel. This behavior could also correlate with known ransomware operations or other forms of malware that rely on scheduled tasks for execution, aligning with their tactics and objectives. Relevant MITRE ATT&CK tactics include **Execution (TA0002)**, **Persistence (TA0003)**, and **Privilege Escalation (TA0004)**, specifically technique **T1053.005: Scheduled Task/Job: Scheduled Task Creation**.

  Primary data sources for verifying these suspicious activities include process creation events that track executables and commands issued on systems, particularly focusing on logs that detail the initiation of `schtasks.exe` or related scripts.

  ### Investigation Steps
  - **Review Scheduled Task Logs:** Examine Windows Event Logs for scheduled task creation events, particularly entries that correspond to the execution time set for 00:00.
  - **Analyze Command Line Arguments:** Assess the command line inputs for any suspicious elements, particularly those invoking scripting engines such as `wscript`, `vbscript`, or `powershell`, as these may indicate malicious intent.
  - **Correlate with Other Events:** Look for correlated events in EDR logs or other telemetry sources—such as unusual process creation or access attempts to sensitive directories (e.g., `AppData`)—that may support a broader context of malicious activity.
  - **Examine User Context:** Investigate the user account that created the task, looking for any misuse of administrative credentials or activity that deviates from normal user behavior patterns.

  ### Prioritization
  This alert is assigned a high severity due to the potential impact of detected activity, which may indicate an active compromise or preparation for a ransomware attack, especially if combined with other anomalous behaviors.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the availability of Windows Event Logs and configurations related to auditing scheduled tasks. The alert assumes that sufficient logging is enabled to capture detailed process creation events. Additionally, false positives could arise from legitimate software installations or administrative tasks conducted around the scheduled time. If logging levels are not adequately set, or if certain administrator privileges are extended to less secure entities, key indicators of malicious activity might go undetected.

