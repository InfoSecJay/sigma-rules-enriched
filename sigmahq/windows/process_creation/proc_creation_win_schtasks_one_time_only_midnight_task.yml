detection:
  selection_img:
  - Image|contains: '\schtasks.exe'
  - OriginalFileName: 'schtasks.exe'
  selection_cli:
    CommandLine|contains:
    - 'wscript'
    - 'vbscript'
    - 'cscript'
    - 'wmic '
    - 'wmic.exe'
    - 'regsvr32.exe'
    - 'powershell'
