note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks that are executed once at midnight (00:00), specifically focusing on tasks invoking potentially malicious scripts or programs such as VBScript or PowerShell. The likely objective of an attacker using this technique is to maintain persistence, execute payloads, or automate actions at a time when user activity is low. Relevant MITRE ATT&CK tactics include Execution (T1059, scripting) and Persistence (T1053.005, Scheduled Task/Job).

  Primary telemetry sources include Windows Process Creation events (Event ID 4688) that capture details about the command-line activities of applications. The security impact could be significant if these tasks are used by an attacker to deploy malware, especially during hours of reduced monitoring. However, this detection does not confirm malicious intent on its own, as legitimate software installations or administrative tasks may also trigger similar patterns.

  ### Investigation Steps

  - **Review scheduled task details:** Check for new scheduled tasks via Task Scheduler or query the Windows Event Log for Event ID 4698. Confirm the task is scheduled to run once at 00:00 with a logical name indicating its purpose (e.g., "SystemUpdate"), indicating benign behavior.

  - **Analyze the command line parameters:** Look for scheduled tasks invoking "schtasks.exe" containing terms such as 'wscript', 'vbscript', or 'powershell'. Malicious usage typically includes obfuscated scripts or unexpected paths (e.g., pointing to scripts in "C:\Users\<user>\AppData\").

  - **Check for parent process relationships:** Correlate Event ID 4688 entries related to the scheduled tasks with prior events to determine their parent process. Tasks spawned by legitimate processes (e.g., "Explorer.exe") are more likely to be benign than those started by unrecognized executables.

  - **Evaluate system context:** Assess which user account created the scheduled task by analyzing Event ID 4698 for the subject user information. Tasks created by non-admin accounts on critical systems (e.g., Domain Controllers) should be treated with higher suspicion.

  - **Look for abnormal execution patterns:** Review Windows Event ID 46832 (Task Scheduler) for execution logs. If the task executed and the expected output (logs, file creation, etc.) was absent, it may indicate a failed execution or attempted misdirection.

  ### Prioritization

  This alert has a high severity level given that an authorized user creating such a scheduled task could indicate a compromise—especially if the task runs scripts or binaries that are not regularly used in the environment. The specific technical behavior is often weaponized to maintain persistence following initial access.

  ### Blind Spots and Assumptions

  This detection may be evaded through various techniques, including disabling Task Scheduler logging or employing legitimate administrative tasks to clutter alerts. Reliable detection requires consistent Event ID 4688 and 4698 logging. Legitimate administrative activity, such as routine updates or maintenance tasks scheduled for system patches, may also trigger this alert. A companion detection to consider is monitoring for abnormal PowerShell commands (T1059.001), which could indicate initial execution of a payload related to the scheduled task.

