title: Potential Download/Upload Activity Using Type Command
id: aa0b3a82-eacc-4ec3-9150-b5a9a3e3f82f
status: test
description: Detects usage of the "type" command to download/upload data from WebDAV
  server
references:
- https://mr0range.com/a-new-lolbin-using-the-windows-type-command-to-upload-download-files-81d7b6179e22
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-14
tags:
- attack.command-and-control
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
    # Note that since built in CMD commands do not trigger a process creation. This would be detected only if used in a "/c" command
  selection_upload:
    CommandLine|contains|all:
    - 'type '
    - ' > \\\\'
  selection_download:
    CommandLine|contains|all:
    - 'type \\\\'
    - ' > '         # Space are added to increase atom length and speed up matching. If your backend can handle this remove the space
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the "type" command in Windows environments to interact with external WebDAV servers for potentially unauthorized uploading or downloading of files. Attackers may exploit this built-in command for simple data exfiltration or to introduce data into a target environment while avoiding detection through more traditional tools. Such behavior typically aligns with actions taken during the **Command and Control (C2)** phase of an attack, where the attacker seeks to establish persistence or exfiltrate sensitive data without alerting security controls.

  Relevant MITRE ATT&CK tactics and techniques applicable to this detection include **Command and Control (TA0011)** and **Data Exfiltration Over Command and Control Channel (T1041)**. The primary source of telemetry for this detection comes from Windows process creation logs which can capture command line arguments issued during command executions.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine processed logs for instances of the "type" command executed with unusual command line arguments. Pay particular attention to entries that indicate interactions with network paths (e.g., those beginning with '\\').
  - **Analyze Network Traffic:** Evaluate network logs for connections made to WebDAV servers during the time of suspected command execution. Look for files being transferred that could indicate malicious activity.
  - **Check File Access Logs:** If available, inspect logs that track file access or changes to files in the target environment to identify if there were unauthorized uploads or downloads.
  - **Investigate User Context:** Identify the user account that initiated the command to assess potential insider threats or compromised accounts. Verify whether their file access aligns with their job role.

  ### Prioritization
  This alert has a medium severity due to the potential impact of unauthorized data movement, which may lead to data breaches or loss of sensitive information. Given the inherent capability of exploiting built-in commands, the likelihood of this behavior occurring during an active breach is notable.

  ### Blind Spots and Assumptions
  This detection for the "type" command usage may not provide complete visibility over all data exfiltration methods, especially if other commands or techniques (e.g., PowerShell or encrypted channels) are employed. The detection logic assumes that such commands will be executed within a command line directive using "/c", and thus may not capture scenarios where the commands are run in a way that does not create a tangible process entry. Ensuring that process creation logging is configured correctly on Windows endpoints is essential for this detection rule to function effectively.

