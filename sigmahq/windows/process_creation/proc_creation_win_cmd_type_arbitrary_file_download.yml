title: Potential Download/Upload Activity Using Type Command
id: aa0b3a82-eacc-4ec3-9150-b5a9a3e3f82f
status: test
description: Detects usage of the "type" command to download/upload data from 
  WebDAV server
references:
- https://mr0range.com/a-new-lolbin-using-the-windows-type-command-to-upload-download-files-81d7b6179e22
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-14
tags:
- attack.command-and-control
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
    # Note that since built in CMD commands do not trigger a process creation. This would be detected only if used in a "/c" command
  selection_upload:
    CommandLine|contains|all:
    - 'type '
    - ' > \\\\'
  selection_download:
    CommandLine|contains|all:
    - 'type \\\\'
    - ' > '         # Space are added to increase atom length and speed up matching. If your backend can handle this remove the space
  condition: 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the usage of the `type` command in Windows to facilitate uploading or downloading files from a WebDAV server, which can signify command-and-control (C2) activities by an attacker. The likely objective is to exfiltrate sensitive data or to retrieve malicious payloads. The relevant MITRE ATT&CK tactic is Command and Control, specifically technique T1105 (Ingress Tool Transfer).

  The primary telemetry source is Windows process creation logs, particularly capturing events generated when command-line instructions are executed. Specifically, the relevant log types include Windows Security Event ID 4688. If this activity is malicious, it could indicate an active compromise, allowing attackers to establish or expand their foothold in the environment. Importantly, this detection does NOT confirm whether the files involved are indeed harmful or if the command is not part of benign administrative scripts.

  ### Investigation Steps

  - **Analyze process creation logs:** Examine Windows Security Event ID 4688 logs. Look for command lines containing `type ` followed by ` > \\\\` or `type \\\\` with redirects, indicating file upload or download actions towards a remote server.

  - **Identify legitimate use cases:** Validate typical `type` command usage within the organization, such as internal testing or administrative scripts. Confirm any authorized use of WebDAV in benign contexts related to file sharing among teams.

  - **Correlate with network traffic:** Review network logs (e.g., proxy or firewall logs) for connections to WebDAV servers around the same time as the process creation logs showing the `type` command. Look specifically for HTTP/S requests made to these WebDAV URLs.

  - **Highlight high-confidence indicators:** Prioritize alerts where the command line explicitly shows `type ` being redirected to a WebDAV path indicating either uploading data (` > \\\\`) or downloading it (`type \\\\` >). Focus on patterns indicating automated or repetitive requests.

  - **Check for anomalies:** Evaluate the host system's role and criticality, especially if the command originates from sensitive or administrative systems. Investigate unusual `type` command use in context, particularly during after-hours or abnormal use patterns.

  ### Prioritization

  This alert should be considered medium severity due to the potential for significant impact on sensitive data if the command is maliciously employed. Given that the use of standard command-line utilities like `type` can facilitate covert data movements, the likelihood of malicious abuse is moderate, especially in environments where WebDAV is not regularly employed.

  ### Blind Spots and Assumptions

  Detection may be limited by inability to capture certain command-line executions or non-standard logging configurations. Legitimate activities might include repetitive file transfers in testing environments, potentially leading to false positives. A related detection to consider includes monitoring for unusual file creation or modification events (using Sysmon or event ID 4663) alongside file transfer activities, which could provide holistic visibility on the nature of these command executions.

