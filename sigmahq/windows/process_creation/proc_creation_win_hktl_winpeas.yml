title: HackTool - winPEAS Execution
id: 98b53e78-ebaf-46f8-be06-421aafd176d9
status: test
description: WinPEAS is a script that search for possible paths to escalate privileges
  on Windows hosts. The checks are explained on book.hacktricks.xyz
references:
- https://github.com/carlospolop/PEASS-ng
- https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation
author: Georg Lauenstein (sure[secure])
date: 2022-09-19
modified: 2023-03-23
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1082
- attack.t1087
- attack.t1046
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'winPEAS.exe'
  - Image|endswith:
    - '\winPEASany_ofs.exe'
    - '\winPEASany.exe'
    - '\winPEASx64_ofs.exe'
    - '\winPEASx64.exe'
    - '\winPEASx86_ofs.exe'
    - '\winPEASx86.exe'
  selection_cli_option:
    CommandLine|contains:
    - ' applicationsinfo'         # Search installed applications information
    - ' browserinfo'         # Search browser information
    - ' eventsinfo'         # Display interesting events information
    - ' fileanalysis'         # Search specific files that can contains credentials and for regexes inside files
    - ' filesinfo'         # Search generic files that can contains credentials
    - ' processinfo'         # Search processes information
    - ' servicesinfo'         # Search services information
    - ' windowscreds'         # Search windows credentials
  selection_cli_dl:
    CommandLine|contains: 'https://github.com/carlospolop/PEASS-ng/releases/latest/download/'
  selection_cli_specific:
  - ParentCommandLine|endswith: ' -linpeas'
  - CommandLine|endswith: ' -linpeas'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of the tool WinPEAS (Windows Privilege Escalation Awesome Script), which is commonly used by attackers to identify potential privilege escalation pathways on Windows systems. Attackers leverage this tool to automate the discovery of weaknesses and gather sensitive information, such as credentials and configuration settings, which may facilitate unauthorized access or lateral movement within a network.

  The relevant MITRE ATT&CK tactics for this rule include **Privilege Escalation (TA0004)** and **Discovery (TA0007)**, focusing on techniques like **T1082 - System Information Discovery**, **T1087 - Account Discovery**, and **T1046 - Network Service Discovery**. This rule captures indicators of suspicious activity associated with unauthorized privilege escalation attempts, primarily when the WinPEAS script is executed with specific command-line parameters indicative of its function.

  Primary data sources for effective detection include **process creation events**, which log the execution of applications on Windows systems. Analyzing these logs can reveal when WinPEAS is employed, alongside the command-line arguments used, providing critical insight into the purpose of its execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances where WinPEAS or its variations are executed. Pay close attention to the command-line arguments to understand the specific actions attempted by the tool.

  - **Correlate User Accounts**: Determine whether the account executing WinPEAS has appropriate permissions. Look for anomalous user behavior or unexpected executions, particularly if the account does not typically engage in security assessments.

  - **Inspect for Lateral Movement**: Examine network traffic or lateral movement patterns originating from the host where WinPEAS was executed. Investigate any connections to internal devices or sensitive systems that align with the execution timeline.

  - **Analyze Forensic Artifacts**: Gather and analyze any forensic artifacts that may contain leftovers from the execution of WinPEAS, including temporary files or logs, which may provide additional context regarding the potential impact or intentions behind the execution.

  ### Prioritization
  Given the potential for WinPEAS to unveil critical vulnerabilities and sensitive credentials, this alert is classified as high severity. The likelihood of its use in malicious contexts—especially within compromised environments—underscores a significant threat to enterprise security.

  ### Blind Spots and Assumptions
  This detection rule may overlook benign instances of WinPEAS executed by authorized personnel for legitimate security assessments, such as in penetration testing scenarios. The logic assumes that command-line parameters used are indicative of malicious intent, which may not always be accurate. For the alert to function optimally, process creation logging must be enabled on Windows hosts, and logs should be forwarded to a centralized logging solution. Additionally, it is essential to maintain an updated threat intelligence feed to stay informed on legitimate tools commonly misused in attacks.

