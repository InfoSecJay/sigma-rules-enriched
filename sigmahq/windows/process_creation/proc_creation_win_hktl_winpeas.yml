title: HackTool - winPEAS Execution
id: 98b53e78-ebaf-46f8-be06-421aafd176d9
status: test
description: WinPEAS is a script that search for possible paths to escalate 
  privileges on Windows hosts. The checks are explained on book.hacktricks.xyz
references:
- https://github.com/carlospolop/PEASS-ng
- https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation
author: Georg Lauenstein (sure[secure])
date: 2022-09-19
modified: 2023-03-23
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1082
- attack.t1087
- attack.t1046
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'winPEAS.exe'
  - Image|endswith:
    - '\winPEASany_ofs.exe'
    - '\winPEASany.exe'
    - '\winPEASx64_ofs.exe'
    - '\winPEASx64.exe'
    - '\winPEASx86_ofs.exe'
    - '\winPEASx86.exe'
  selection_cli_option:
    CommandLine|contains:
    - ' applicationsinfo'         # Search installed applications information
    - ' browserinfo'         # Search browser information
    - ' eventsinfo'         # Display interesting events information
    - ' fileanalysis'         # Search specific files that can contains credentials and for regexes inside files
    - ' filesinfo'         # Search generic files that can contains credentials
    - ' processinfo'         # Search processes information
    - ' servicesinfo'         # Search services information
    - ' windowscreds'         # Search windows credentials
  selection_cli_dl:
    CommandLine|contains: 'https://github.com/carlospolop/PEASS-ng/releases/latest/download/'
  selection_cli_specific:
  - ParentCommandLine|endswith: ' -linpeas'
  - CommandLine|endswith: ' -linpeas'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of WinPEAS, a privilege escalation auditing tool commonly used by attackers to identify vulnerabilities for privilege escalation on Windows hosts. The likely attacker objective is to gather detailed system information to exploit potential vectors for privilege elevation. This behavior maps to the MITRE ATT&CK techniques: Privilege Escalation (T1068) and Discovery (T1082). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture detailed information about executed processes. If malicious, the security impact is significant, as it may enable an attacker to gain unauthorized elevated access to system functions. However, this detection does NOT confirm malicious intent or successful exploitation on its own; it merely indicates that the tool was executed.

  ### Investigation Steps

  - **Check for security event logs:** Review Security Event ID 4688 (process creation) for process paths indicating WinPEAS execution, specifically looking for paths ending with 'winPEAS.exe' or variations like 'winPEASx64.exe'. A legitimate execution might originate from an administrator's terminal or a controlled environment.

  - **Analyze command-line parameters:** Examine the 'CommandLine' field for parameters indicative of privilege escalation checks, such as 'applicationsinfo', 'browserinfo', or 'windowscreds'. Legitimate use would often reveal normal administrative tasks, while suspicious command-line options may indicate information gathering by an adversary.

  - **Investigate network connections:** If available, analyze network logs (e.g., NetSec, Firewall) for outbound connections to 'https://github.com/carlospolop/PEASS-ng/releases/latest/download/', which may indicate that WinPEAS was downloaded as part of the execution process. Malicious activity would typically show unusual network behavior, especially in sensitive environments.

  - **Review parent process information:** Confirm the 'ParentCommandLine' field in event logs; a legitimate process may originate from administrative tools or scripted automation. If the parent process is suspicious (e.g., unknown or user-initiated PowerShell), it warrants further investigation.

  - **Validate host assets:** Identify the role of the host executing WinPEAS (e.g., server vs. workstation) and its criticality within the environment. A higher priority would be systems with administrative functions or sensitive data, which increase the impact if compromised.

  ### Prioritization

  The alert severity is high due to the potential for an attacker to exploit critical vulnerability information on systems that could lead to unauthorized access and privilege escalation. The execution of tools like WinPEAS is commonly weaponized in attacks, making the likelihood of malicious abuse significant.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may rename WinPEAS or use its features in legitimate administrative contexts. Reliable detection requires comprehensive logging from host activity and process creation logs configured correctly. Legitimate activities that may trigger this alert include system audits or authorized pen-testing by security teams. A related detection to bolster coverage would be analyzing for unusual PowerShell execution patterns (e.g., T1059.001) that could indicate earlier reconnaissance efforts leading to WinPEAS execution.

