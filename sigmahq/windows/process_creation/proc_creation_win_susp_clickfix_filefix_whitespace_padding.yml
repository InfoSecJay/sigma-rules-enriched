logsource:
  category: process_creation
  product: windows
detection:
  selection_explorer:
    ParentImage|endswith: '\explorer.exe'
    CommandLine|contains: '#'
  selection_space_variation:
    CommandLine|contains:
    - '            '         # En Quad (U+2000)
    - '            '         # Em Quad (U+2001)
    - '            '         # En Space (U+2002)
    - '            '         # Em Space (U+2003)
    - '            '         # Three-Per-Em Space (U+2004)
    - '            '         # Four-Per-Em Space (U+2005)
    - '            '         # Six-Per-Em Space (U+2006)
    - '            '         # Figure Space (U+2007)
    - '            '         # Punctuation Space (U+2008)
    - '            '         # Thin Space (U+2009)
    - '            '         # Hair Space (U+200A)
    - '            '         # No-Break Space (U+00A0)
    - '            '         # Normal space (0x20)
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects process execution where the command line includes spaces, followed by a '#' character, indicative of potential ClickFix or FileFix techniques. These techniques aim to obfuscate malicious commands, often by inserting whitespace padding to prevent immediate visibility. The likely attacker objective is to execute hidden commands that compromise systems or exfiltrate data while evading detection during a social engineering attack.

  The relevant MITRE ATT&CK techniques are Execution (T1204.004) and Stealth (T1027.010). Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688, which captures CommandLine arguments and ParentImage information. If the command is malicious, it poses a significant security risk, potentially leading to unauthorized access or data leakage. However, this detection does NOT confirm whether the activity is definitively malicious without further context and correlation.

  ### Investigation Steps

  - **Verify the command line for suspicious whitespace:**
    Look for unusual whitespace characters within the CommandLine of the detected process creation (Event ID 4688). This should include characters like En Quad (U+2000) or No-Break Space (U+00A0) followed by a '#'.

  - **Check the ParentImage for legitimacy:**
    Confirm that the ParentImage for the process is indeed `explorer.exe`. Any deviation may indicate a suspicious process or another manipulation.

  - **Examine the user context:**
    Identify the user account associated with the process creation. Legitimate actions by privileged users in sensitive environments should be scrutinized, especially if command line arguments contain unusual padding.

  - **Cross-reference with previous alerts:**
    Investigate if there are prior similar alerts related to the same user account or similar command patterns. Any consistent occurrence may indicate a recurring threat or session compromise.

  - **Inspect system behavior and network activity:**
    Conduct a review of the processes running at the same time and check for outbound connections from the system. Look for connections going to known malicious IP addresses or domains.

  - **Evaluate normal user activities:**
    Determine if there are any legitimate use cases for users executing commands with extensive whitespace patterns. For example, investigation into legitimate scripts or applications that may use such formatting for valid reasons.

  ### Prioritization

  This alert is high priority due to the potential impact on enterprise systems, as compromised hosts can lead to significant security breaches. The likelihood of malicious abuse is high, given the stealthy nature of ClickFix/FileFix tactics, which are known to be employed in various attacks. Such obfuscation techniques are often weaponized in social engineering attacks targeting untrained users.

  ### Blind Spots and Assumptions

  Detection limitations may arise from the possibility of legitimate applications utilizing whitespace padding in command lines for non-malicious purposes. Ensure that Windows Process Creation logs are enabled and correctly configured to capture all necessary command line arguments. Normal user activities, such as script execution or commands with legitimate Unicode spaces, could inadvertently trigger alerts. A related detection rule, such as one monitoring for abnormal command execution based on known malicious patterns (e.g., PowerShell commands), could enhance overall detection coverage.

