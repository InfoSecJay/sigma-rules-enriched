logsource:
  category: process_creation
  product: windows
detection:
  selection_explorer:
    ParentImage|endswith: '\explorer.exe'
    CommandLine|contains: '#'
  selection_space_variation:
    CommandLine|contains:
    - '            '         # En Quad (U+2000)
    - '            '         # Em Quad (U+2001)
    - '            '         # En Space (U+2002)
    - '            '         # Em Space (U+2003)
    - '            '         # Three-Per-Em Space (U+2004)
    - '            '         # Four-Per-Em Space (U+2005)
    - '            '         # Six-Per-Em Space (U+2006)
    - '            '         # Figure Space (U+2007)
    - '            '         # Punctuation Space (U+2008)
    - '            '         # Thin Space (U+2009)
    - '            '         # Hair Space (U+200A)
    - '            '         # No-Break Space (U+00A0)
    - '            '         # Normal space (0x20)
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of processes with suspicious command line arguments that contain excessive whitespace padding, specifically where a '#' character follows these spaces. This behavior is associated with the ClickFix and FileFix techniques, commonly employed in social engineering attacks. Attackers use these methods to disguise malicious commands in such a way that they are less noticeable to the target, deceiving victims into executing harmful commands from their clipboard.

  The attacker’s objective is to execute covert commands by exploiting user trust and interactions facilitated through benign-looking documents or links. By leveraging command line arguments that include extensive Unicode whitespace, the actual malicious payload is pushed out of immediate sight, thereby evading detection efforts. This tactic falls under the MITRE ATT&CK framework, particularly under the Execution tactic (T1204.004 - User Execution) and Defense Evasion techniques (T1027.010 - Obfuscated Files or Information) which deal with disguising the intent of executing malicious code.

  The primary data source relevant for this detection includes process creation logs from Windows, which capture command lines executed by processes and their associated parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events for entries where the parent process is `explorer.exe` and the command line contains a '#' character alongside suspicious whitespace padding.

  - **Analyze Command Context:** Investigate the context of the command using additional process logs to understand the user’s activity prior to the execution. Look for any indications of phishing attempts or user interactions with unsolicited files.

  - **Correlate with User Behavior:** Cross-reference the affected user’s activity with other telemetry sources (e.g., email logs, web proxy logs) to identify potential phishing emails or malicious links that may have led to the execution of the command.

  - **Investigate Unicode Usage:** Look specifically for the use of different Unicode whitespace characters in command lines for both suspicious processes and any other processes to identify patterns or commonalities that may suggest malicious intent.

  ### Prioritization
  This alert should be considered high severity due to the potential for significant impact on user systems through targeted social engineering attacks. The likelihood of these tactics being exploited in enterprise environments is high, given the common usage of user-execution techniques.

  ### Blind Spots and Assumptions
  The detection logic assumes that sufficient logging of process creation events is enabled and that command line arguments are recorded accurately. There may be blind spots if the logged command lines do not capture Unicode characters correctly or if the organization has specific configurations that limit visibility into process creation events. Additionally, this detection may yield false positives due to legitimate applications utilizing similar command structures, thus requiring further validation by analysts to discern intent accurately.

