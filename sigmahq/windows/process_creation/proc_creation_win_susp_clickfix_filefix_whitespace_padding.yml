detection:
  selection_explorer:
    ParentImage|endswith: '\explorer.exe'
    CommandLine|contains: '#'
  selection_space_variation:
    CommandLine|contains:
    - '            '         # En Quad (U+2000)
    - '            '         # Em Quad (U+2001)
    - '            '         # En Space (U+2002)
    - '            '         # Em Space (U+2003)
    - '            '         # Three-Per-Em Space (U+2004)
    - '            '         # Four-Per-Em Space (U+2005)
    - '            '         # Six-Per-Em Space (U+2006)
    - '            '         # Figure Space (U+2007)
    - '            '         # Punctuation Space (U+2008)
    - '            '         # Thin Space (U+2009)
    - '            '         # Hair Space (U+200A)
    - '            '         # No-Break Space (U+00A0)
    - '            '         # Normal space (0x20)
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of processes initiated by Explorer.exe that utilize whitespace padding and end with a '#' character in their command line. The behavior suggests an attempt to conceal a malicious command by obscuring it from immediate visual inspection and is commonly associated with ClickFix and FileFix techniques.

  The likely attacker objective includes executing hidden commands in a way that bypasses initial scrutiny by users or security analysts, indicative of an execution tactic (MITRE ATT&CK Tactic: Execution, Technique ID: T1204.004) and a defense evasion technique (MITRE ATT&CK Technique ID: T1027.010). The primary telemetry sources include Windows security logs (Event ID 4688) for process creation details, specifically the CommandLine field utilized during the execution.

  If malicious, this behavior could enable unauthorized command execution and system compromise without detection. However, this detection does NOT confirm malicious activity on its own, as legitimate commands may also incorporate unconventional formatting or whitespace.

  ### Investigation Steps

  - **Check process command line arguments**: Examine the command line used for the new process (Event ID 4688, Security logs). Look for extensive whitespace padded with Unicode spaces alongside a '#' character. Legitimate usage typically does not involve excessive Unicode whitespace.

  - **Validate parent process relationship**: Confirm the parent process ID to ensure it is linked to Explorer.exe (Field: ParentImage). An unexpected parent process may indicate malicious behavior, especially if coming from non-Explorer processes.

  - **Review recent user activity**: Check for user logs or application event logs (e.g., Event ID 4624 or 4634) to correlate recent suspicious actions. Compare recent command line patterns against common user behavior to identify potential misuses.

  - **Identify known benign processes**: Reference a list of authorized software and remote commands for your environment. Determine if this command syntax has been used in legitimate scripts or as part of internal processes (fields: Executable name and CommandLine).

  - **Analyze for additional indicators of compromise**: Look for subsequent suspicious activity in logs (e.g., Event ID 4688 for created child processes) that may suggest further malicious actions initiated by the discovered process, such as file creation or network connections.

  ### Prioritization

  This alert is considered high severity due to its potential impact on system integrity and the likelihood of abuse by adversaries. The command execution method detected is known to be weaponized in social engineering attacks. If leading to system compromise, immediate containment actions are necessary.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of event logging—specifically, if process creation events are not being captured consistently. Adversaries might apply similar whitespace in legitimate applications or benign scripts, resulting in false positives. Additionally, legitimate user actions that involve creative scripting might also trigger this alert. Related detections include tracking unusual powershell executions or obfuscated command lines, which can provide complementary visibility into malicious activity.

