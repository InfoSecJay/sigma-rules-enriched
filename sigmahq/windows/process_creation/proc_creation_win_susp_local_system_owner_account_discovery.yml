logsource:
  category: process_creation
  product: windows
detection:
  selection_other_img:
  - Image|endswith:
    - '\whoami.exe'
    - '\quser.exe'
    - '\qwinsta.exe'
  - OriginalFileName:
    - 'whoami.exe'
    - 'quser.exe'
    - 'qwinsta.exe'
  selection_other_wmi:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
    - 'useraccount'
    - 'get'
  selection_other_cmdkey:
    Image|endswith: '\cmdkey.exe'
    CommandLine|contains: ' /l'
  selection_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - ' /c'
    - 'dir '
    - '\Users\'
  filter_cmd:
    CommandLine|contains: ' rmdir '     # don't match on 'dir'   "C:\Windows\System32\cmd.exe" /q /c rmdir /s /q "C:\Users\XX\AppData\Local\Microsoft\OneDrive\19.232.1124.0005"
  selection_net:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
    CommandLine|contains: 'user'
  filter_net:
    CommandLine|contains:
    - '/domain'               # local account discovery only
    - '/add'                  # discovery only
    - '/delete'               # discovery only
    - '/active'               # discovery only
    - '/expires'              # discovery only
    - '/passwordreq'          # discovery only
    - '/scriptpath'           # discovery only
    - '/times'                # discovery only
    - '/workstations'         # discovery only
  condition: (selection_cmd and not filter_cmd) or (selection_net and not 
    filter_net) or 1 of selection_other_*
falsepositives:
- Legitimate administrator or user enumerates local users for legitimate reason
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of local account discovery commands on Windows systems, such as `whoami.exe`, `quser.exe`, `net.exe`, and `wmic.exe`. The likely objective is to gather information on user accounts present on the system, which can aid in lateral movement and privilege escalation during an attack. The relevant MITRE ATT&CK tactics are Discovery and Credential Access, specifically techniques T1033 (System Owner/User Discovery) and T1087.001 (Account Discovery: Local Account).

  Primary telemetry sources include process creation logs (Security Event ID 4688 and Sysmon Event ID 1). A successful malicious activity could lead to unauthorized access to accounts and systems. However, this detection does NOT confirm malicious intent on its own, as legitimate administrators might execute these commands for valid purposes.

  ### Investigation Steps

  - **Review process creation logs**: Check for Windows Security Event ID 4688 or Sysmon Event ID 1 to identify the context behind command execution. Look for command lines involving `whoami`, `quser`, or `wmic` executing typically in contexts such as interactive user sessions versus scheduled tasks.

  - **Validate command context**: Analyze the command line arguments for any instances of `net.exe` or `wmic.exe` indicating local account enumeration (e.g. `CommandLine contains 'useraccount'`). Compare against known benign patterns where admins enumerate accounts.

  - **Identify anomalous user behavior**: Look at the user context that executed the commands. If it’s a service account or a non-administrative user executing these commands unexpectedly, this may indicate potential malicious activity.

  - **Analyze associated logins**: Cross-reference the execution timestamps with authentication logs (Security Event ID 4624) to determine if these enumerations correlate with unexpected or unauthorized access attempts. Noteworthy logins might indicate an adversary exploring the environment.

  - **Inspect for indicators of lateral movement**: Look for subsequent commands following this discovery, which might include network connections or remote access tools being established. Malicious indicators may involve the use of protocols or tools like RDP or PsExec shortly after local account discovery.

  ### Prioritization

  Given that local account discovery could indicate preparations for further exploitation and can occur in both benign and malicious contexts, alert prioritization is low. However, the severity should be elevated if the behavior originates from critical assets or if unusual account access patterns are observed.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use overly customized or non-standard tools for account enumeration. Additionally, reliance on comprehensive log collection, such as enabling process creation logging, is critical for effective detection. Expected legitimate activity, like system maintenance or troubleshooting by IT staff, can also trigger this alert. A related detection to consider is the monitoring for suspicious logon patterns (e.g., unusual times or locations), which strengthens the overall coverage against potential reconnaissance and lateral movement.

