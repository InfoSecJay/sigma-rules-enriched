logsource:
  category: process_creation
  product: windows
detection:
  selection_other_img:
  - Image|endswith:
    - '\whoami.exe'
    - '\quser.exe'
    - '\qwinsta.exe'
  - OriginalFileName:
    - 'whoami.exe'
    - 'quser.exe'
    - 'qwinsta.exe'
  selection_other_wmi:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
    - 'useraccount'
    - 'get'
  selection_other_cmdkey:
    Image|endswith: '\cmdkey.exe'
    CommandLine|contains: ' /l'
  selection_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - ' /c'
    - 'dir '
    - '\Users\'
  filter_cmd:
    CommandLine|contains: ' rmdir '     # don't match on 'dir'   "C:\Windows\System32\cmd.exe" /q /c rmdir /s /q "C:\Users\XX\AppData\Local\Microsoft\OneDrive\19.232.1124.0005"
  selection_net:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
    CommandLine|contains: 'user'
  filter_net:
    CommandLine|contains:
    - '/domain'               # local account discovery only
    - '/add'                  # discovery only
    - '/delete'               # discovery only
    - '/active'               # discovery only
    - '/expires'              # discovery only
    - '/passwordreq'          # discovery only
    - '/scriptpath'           # discovery only
    - '/times'                # discovery only
    - '/workstations'         # discovery only
  condition: (selection_cmd and not filter_cmd) or (selection_net and not filter_net)
    or 1 of selection_other_*
falsepositives:
- Legitimate administrator or user enumerates local users for legitimate reason
level: low
note: |
  ### Technical Context
  This detection rule identifies potential discovery activities related to local accounts on Windows systems. Attackers often use utilities such as `whoami`, `quser`, `wmic`, `net.exe`, and `cmd.exe` to enumerate local user accounts as part of their reconnaissance phase. By discovering local accounts, attackers aim to gather information on user privileges and potentially identify weak accounts for further exploitation. This behavior could indicate preparation for lateral movement or privilege escalation, as misconfigured or weak accounts can provide easy access points for attackers.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Discovery (TA0007)** through **Account Discovery (T1087)** and **System Owner/User Discovery (T1033)**. These techniques highlight attackers' efforts to understand the environment and the accounts within it. Primary data sources for detection include Process Creation events, which log executed commands, and the command-line arguments used, allowing security analysts to identify potentially malicious account enumeration activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for the execution of suspicious commands and utilities associated with local account discovery, such as `whoami`, `quser`, `wmic`, `net.exe`, and `cmd.exe`.
  - **Analyze Command-Line Arguments:** Focus on command-line arguments of these executed processes to look for patterns consistent with account enumeration, especially those involving local user queries.
  - **Cross-reference User Activity:** Correlate detected account discovery commands with user roles and activities to identify legitimate vs. suspicious access. Check against known legitimate administrative actions.
  - **Monitor for Anomalous Behavior:** Investigate any unusual timing or frequency of account enumeration commands, particularly during odd hours or from atypical hosts.

  ### Prioritization
  Alerts generated by this rule have a low severity level due to the possibility of legitimate administrative activities. However, it remains important to prioritize these alerts as they could indicate preparatory steps for a more significant attack, especially if corroborated with other suspicious behaviors or indicators.

  ### Blind Spots and Assumptions
  Detection coverage might be limited due to the reliance on process creation logs, which can be altered or deleted by skilled attackers. The detection logic assumes that the alerts will primarily capture malicious enumeration activities and may miss legitimate administrative actions that are common in enterprise environments. Additionally, this rule’s effectiveness depends on capturing complete command-line arguments; therefore, logging settings must be appropriately configured to ensure visibility into command execution details.

