logsource:
  category: process_creation
  product: windows
detection:
  selection_other_img:
  - Image|endswith:
    - '\whoami.exe'
    - '\quser.exe'
    - '\qwinsta.exe'
  - OriginalFileName:
    - 'whoami.exe'
    - 'quser.exe'
    - 'qwinsta.exe'
  selection_other_wmi:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
    - 'useraccount'
    - 'get'
  selection_other_cmdkey:
    Image|endswith: '\cmdkey.exe'
    CommandLine|contains: ' /l'
  selection_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
    - ' /c'
    - 'dir '
    - '\Users\'
  filter_cmd:
    CommandLine|contains: ' rmdir '     # don't match on 'dir'   "C:\Windows\System32\cmd.exe" /q /c rmdir /s /q "C:\Users\XX\AppData\Local\Microsoft\OneDrive\19.232.1124.0005"
  selection_net:
    Image|endswith:
    - '\net.exe'
    - '\net1.exe'
    CommandLine|contains: 'user'
  filter_net:
    CommandLine|contains:
    - '/domain'               # local account discovery only
    - '/add'                  # discovery only
    - '/delete'               # discovery only
    - '/active'               # discovery only
    - '/expires'              # discovery only
    - '/passwordreq'          # discovery only
    - '/scriptpath'           # discovery only
    - '/times'                # discovery only
    - '/workstations'         # discovery only
  condition: (selection_cmd and not filter_cmd) or (selection_net and not filter_net)
    or 1 of selection_other_*
falsepositives:
- Legitimate administrator or user enumerates local users for legitimate reason
level: low
note: |
  ---

  ### Technical Context

  This rule detects the enumeration of local user accounts on Windows systems using various command-line utilities, such as `whoami.exe`, `net.exe`, and other system commands. The goal of an attacker engaging in this activity is typically to gather information about existing users, which may assist in escalating privileges or planning further attacks within the environment. This detection is aligned with the MITRE ATT&CK tactic of Discovery (ID: TA0007) and the techniques User Discovery (T1087.001) and Account Discovery (T1033).

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 (Process Created) and Sysmon Event ID 1 (Process Creation). If the activity is indeed malicious, it could lead to account compromise or unauthorized access. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks may cause similar activity.

  ---

  ### Investigation Steps

  - **Identify Process Creation Events**: Review Security Event ID 4688 and Sysmon Event ID 1 that correspond to `whoami.exe`, `quser.exe`, `qwinsta.exe`, or `wmic.exe` to locate unauthorized account discovery attempts.

  - **Examine Command Line Arguments**: For detected events, inspect the `CommandLine` field for keywords such as "useraccount", "get", and any execution of `cmd.exe` with "dir" targeting `C:\Users\`, which are indicative of local account scanning.

  - **Determine Source and Context**: Validate the user account and host role associated with the process creation events. Check if the user performing the activity is an administrator or part of a helpdesk team known to enumerate accounts as part of their job.

  - **Look for Evasion Indicators**: Investigate if the command contains any parameters indicating a domain request (e.g., '/domain') that can be considered benign for local account discovery or correlates to common administrative usage.

  - **Filter out Legitimate Activity**: Note any script execution or scheduled task running by trusted users that typically interacts with local accounts, reducing false positive confidence. Common legitimate script paths may include automation tools or administrative scripts.

  - **Confirm Malicious Usage**: Pay attention to any unusual patterns or high-frequency requests for local account enumeration that coincide with other suspicious activities, such as failed login attempts on the same system or network activity indicative of lateral movement.

  ---

  ### Prioritization

  This alert has low severity due to the relatively low impact of local account discovery on its own. While it may indicate potential reconnaissance activities, it is not uncommon for authorized users or administrators to perform these commands in the course of their work. However, if identified in conjunction with other suspicious behaviors, it warrants closer scrutiny.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of log sources; for instance, if Sysmon is not deployed for process creation event logging, potential malicious activity may go undetected. Legitimate tools or scripts used for system maintenance can trigger this alert. Additionally, a related detection to consider is the monitoring of the `net.exe` command for network share discovery (T1135), which could complement local account discovery efforts and enhance coverage.

