note: |
  ### Technical Context

  This Sigma rule detects the execution of several Windows utilities that can be used to enumerate local user accounts within an operating system. Attackers may use this behavior to gather intelligence about a target environment and identify potential accounts to exploit, especially in preparation for lateral movement or privilege escalation. This behavior aligns with the following MITRE ATT&CK techniques: **Account Discovery (T1087.001)** and **System Owner/User Discovery (T1033)**.

  The primary telemetry sources are Windows process creation logs, specifically captured by Security Event ID 4688. If this behavior is malicious, it could indicate reconnaissance activities that expose sensitive user information, potentially leading to unauthorized access. Importantly, this detection alone does not confirm malicious intent, as legitimate system administrators may occasionally run similar commands for policy enforcement or auditing purposes.

  ### Investigation Steps

  - **Identify the executed command:** Check Windows Security Event ID 4688 for newly created processes, specifically looking for `whoami.exe`, `quser.exe`, `qwinsta.exe`, `wmic.exe`, `net.exe`, and `cmd.exe` with relevant command line flags indicating user discovery.

  - **Review the command line arguments:** Investigate the exact command line used in Event ID 4688. Malicious commands will typically include parameters like `useraccount` or `/c dir \\Users\\`, signaling an attempt to enumerate user accounts versus a benign context.

  - **Correlate with user roles:** Determine whether the executing user has administrative permissions or typical user roles. Legitimate enumeration often comes from elevated contexts during system maintenance, while unexpected executions from non-admins may indicate malicious intent.

  - **Check for execution time and frequency:** Look for the timing of the execution in relation to other suspicious activities or alerts, such as failed logins or unusual network connections. Frequent execution might suggest ongoing reconnaissance efforts.

  - **Validate known benign usage:** Cross-reference with normal operational behavior in your environment to identify legitimate scenarios where account enumeration may occur, such as routine audits or system updates by IT personnel.

  ### Prioritization

  This alert is considered low severity in a mature enterprise context, primarily because legitimate administrative tasks can trigger it. However, the likelihood of malicious use is present, especially in environments where user account misconfiguration could be exploited. The risk is moderate, as this technique is frequently weaponized in initial access phases.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logged activity for benign account enumeration and the potential for administrative tools to be misused without adequate logging. Ensure that Windows process auditing is comprehensively configured to capture lifecycle events needed for reliable detection. Legitimate workflows, such as scheduled maintenance scripts run by IT, may inadvertently trigger this alert. A related detection to strengthen coverage could focus on lateral movement activities, using **Pass the Hash (T1550.002)** as an additional context for investigation.

