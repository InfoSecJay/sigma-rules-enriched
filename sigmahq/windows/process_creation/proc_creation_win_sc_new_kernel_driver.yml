title: New Kernel Driver Via SC.EXE
id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
status: test
description: Detects creation of a new service (kernel driver) with the type 
  "kernel"
references:
- https://www.aon.com/cyber-solutions/aon_cyber_labs/yours-truly-signed-av-driver-weaponizing-an-antivirus-driver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-14
modified: 2025-10-07
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
    - 'create'
    - 'config'
    CommandLine|contains|all:
    - 'binPath'
    - 'type'
    - 'kernel'
  filter_optional_avira_driver:
  - CommandLine|contains|all:
    - 'create netprotection_network_filter'
    - 'type= kernel start= '
    - 'binPath= System32\drivers\netprotection_network_filter'
    - 'DisplayName= netprotection_network_filter'
    - 'group= PNP_TDI tag= yes'
  - CommandLine|contains|all:
    - 'create avelam binpath=C:\Windows\system32\drivers\avelam.sys'
    - 'type=kernel start=boot error=critical group=Early-Launch'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Rare legitimate installation of kernel drivers via sc.exe
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a new kernel driver using the `sc.exe` command, specifically targeting instances where the driver type is identified as "kernel." Kernel drivers operate at a high privilege level within the operating system, often used by attackers to execute code with increased permissions. The likely attacker objective is to install a persistence mechanism or privilege escalation tool to maintain control over a compromised system. This behavior matches the MITRE ATT&CK tactics of Persistence (TA0003) and Privilege Escalation (TA0004), specifically technique T1543.003 (Create or Modify System Process: Windows Service).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688, which provides insights into the command line arguments and image paths being executed. If malicious in nature, this could facilitate data theft, system manipulation, or escalated privileges. However, this detection does NOT confirm that the kernel driver is malicious on its own; legitimate drivers may be created under certain circumstances, albeit infrequently.

  ### Investigation Steps

  - **Review Security Event ID 4688 for `sc.exe` usage**: Look for process creation events where `Image` ends with `\sc.exe` and `CommandLine` contains keywords like `create`, `config`, `binPath`, and `type=kernel`.

  - **Verify high-confidence malicious indicators**: Specifically, look for instances where `CommandLine` includes `binPath` pointing to unusual driver locations (e.g., `C:\Windows\system32\drivers\`) without legitimate vendor references.

  - **Identify legitimate kernel driver installations**: Review recent installations of drivers from known software vendors or operating system updates. Commonly, legitimate drivers will not have unusual command line parameters or paths that differ from standard deployment methods.

  - **Cross-reference with Sysmon logs**: Check for Sysmon Event ID 1 (Process Creation) for detailed command lines, parent processes, and hashes of the newly created driver; compare these against existing baseline data to establish legitimacy.

  - **Assess the affected asset's role**: Determine the role and criticality of the system where this alert triggered. Kernel driver modifications on sensitive servers may require higher urgency for investigation.

  - **Check for related artifacts**: Investigate for any recent file creations or modifications in `C:\Windows\System32\drivers\` that might correlate with the kernel driver in question and check for unusual file signatures or timestamps.

  ### Prioritization

  The alert severity is medium given that kernel drivers possess high privileges and exploit potential exists if malicious behavior is confirmed. However, the likelihood of misuse depends on the specific environmental context and the typical behaviors seen within the organization's baseline, as legitimate installations via `sc.exe` can occur but are rare.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as renaming legitimate drivers or using alternative methods for driver installation that do not invoke `sc.exe`. High-confidence detection is contingent upon the presence of relevant log sources such as Sysmon and Windows Event logs, accurately configured to capture all process creations. Legitimate activities, such as rare driver updates performed by system administrators, can trigger this alert. A related detection to consider is the monitoring of the installation of services via Group Policy (GPO) changes which may provide additional context on system configuration and changes.

