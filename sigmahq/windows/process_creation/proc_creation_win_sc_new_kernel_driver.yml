title: New Kernel Driver Via SC.EXE
id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
status: test
description: Detects creation of a new service (kernel driver) with the type "kernel"
references:
- https://www.aon.com/cyber-solutions/aon_cyber_labs/yours-truly-signed-av-driver-weaponizing-an-antivirus-driver/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-14
modified: 2025-10-07
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
    - 'create'
    - 'config'
    CommandLine|contains|all:
    - 'binPath'
    - 'type'
    - 'kernel'
  filter_optional_avira_driver:
  - CommandLine|contains|all:
    - 'create netprotection_network_filter'
    - 'type= kernel start= '
    - 'binPath= System32\drivers\netprotection_network_filter'
    - 'DisplayName= netprotection_network_filter'
    - 'group= PNP_TDI tag= yes'
  - CommandLine|contains|all:
    - 'create avelam binpath=C:\Windows\system32\drivers\avelam.sys'
    - 'type=kernel start=boot error=critical group=Early-Launch'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Rare legitimate installation of kernel drivers via sc.exe
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the Windows Service Control (sc.exe) command to create a new kernel driver service. Kernel drivers are often targeted by attackers to gain stealthy and persistent access to the system, potentially allowing them to escalate privileges, bypass security controls, or conduct malicious operations without detection. Attackers may leverage this method to implant rootkits or other forms of malware that operate at the kernel level, making them particularly difficult to detect and remove.

  The relevant MITRE ATT&CK tactics involved include:
  - **Persistence** (TA0003): The creation of kernel drivers can enable persistent access to a compromised system.
  - **Privilege Escalation** (TA0004): Malicious kernel drivers may help attackers elevate their privileges.
  - **T1543.003 - Create or Modify System Process: Windows Service**: This technique encompasses creating malicious services using sc.exe.

  Primary data sources that provide the best evidence for this detection include process creation events on Windows systems, specifically logs detailing command line parameters executed by sc.exe, which could reveal suspicious activities related to kernel driver installations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs from the Windows Event Viewer to identify any instances of sc.exe being executed, particularly those with command lines containing 'create', 'config', 'binPath', and 'type=kernel'.
  - **Analyze Command Line Parameters**: Pay close attention to the specific command line arguments being used. Look for suspicious or unexpected values, especially those that do not correspond to legitimate kernel drivers.
  - **Investigate Driver Files**: If a suspect kernel driver is identified, check the path and the digital signature (if any) of the resulting driver file. Investigate its origin and whether it has known associations with malicious activity.
  - **Cross-Reference with Installed Services**: Verify the creation of any newly listed services against a known baseline of legitimate services in the environment to determine if they are suspected of being malicious.

  ### Prioritization
  This alert should be treated with medium severity due to the potential for severe impacts that a malicious kernel driver could have on system integrity and confidentiality. Given the nature of such drivers, their presence could indicate an advanced persistent threat (APT) or significant compromise.

  ### Blind Spots and Assumptions
  Detection logic assumes that sc.exe is being used to create malicious kernel drivers, which might not always align with legitimate use cases, such as rare installations of necessary drivers. If sc.exe is executed without accompanying telemetry for command line arguments, the detection may fail. Additionally, this detection requires historical command line logging to be enabled, as well as a proper configuration of security event logging on Windows systems to capture process creation events effectively.

