detection:
  selection:
    CommandLine|contains:
    - '^^'
    - '^|^'
    - ',;,'
    - ';;;;'
    - ';; ;;'
    - '(,(,'
    - '%COMSPEC:~'
    - ' c^m^d'
    - '^c^m^d'
    - ' c^md'
    - ' cm^d'
    - '^cm^d'
    - ' s^et '
    - ' s^e^t '
    - ' se^t '
            # - '%%'
            # - '&&'
            # - '""'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential obfuscation techniques in command-line executions, commonly employed by attackers to conceal their malicious intent or payload. The likely objective of the attacker is to execute commands that are less recognizable to security monitoring tools. This behavior aligns with the MITRE ATT&CK technique T1059 (Command and Scripting Interpreter).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which captures process creation events along with their command-line arguments. If maliciously employed, this could lead to unauthorized system access, data exfiltration, or lateral movement within the network. Notably, this detection does NOT confirm that a malicious act has occurred; it merely indicates that obfuscation techniques have been observed.

  ### Investigation Steps

  - **Review command-line arguments**: Examine the `CommandLine` field within Security Event ID 4688 logs for suspicious patterns, specifically looking for obfuscation indicators like `^^`, `^|^`, or `%COMSPEC:~`.

  - **Correlate process creation timing**: Validate process creation timestamps against expected operational hours; legitimate admin tasks typically occur during business hours, while malicious activities may surface unexpectedly.

  - **Track parent-child process relationships**: Analyze the `ParentProcessId` field in Security Event ID 4688 to identify if the observed process was spawned by a legitimate process (e.g., `powershell.exe` for routine scripts) or if there's a suspicious parent process linked to it, such as an unknown executable.

  - **Check for known obfuscation tools**: Look for additional evidence or related file creations or commands being executed, particularly from tools like `Invoke-DOSfuscation`, which could indicate a higher confidence in malicious intent.

  - **Identify legitimate baseline behavior**: Establish a baseline for approved scripts and command-line usage within your environment. Alerts from known administrative activities or scheduled tasks that use similar obfuscation would be benign.

  ### Prioritization

  This alert carries medium severity due to its potential impact; malicious obfuscation could facilitate advanced attacks. The likelihood of abuse is moderate, as such obfuscation techniques are increasingly utilized in real-world scenarios. This behavior is weaponized by various threat actors aiming for stealth during execution.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative actions that use obfuscation for customization, potentially resulting in false positives. It requires comprehensive logging configurations to ensure visibility into command-line activities. Additionally, a companion detection rule for traditional PowerShell execution (e.g., PowerShell logs) would reinforce monitoring effectiveness against these tactics.

