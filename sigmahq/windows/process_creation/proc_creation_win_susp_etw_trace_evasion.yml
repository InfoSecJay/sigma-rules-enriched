title: ETW Trace Evasion Activity
id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
status: test
description: |
  Detects command line activity that tries to clear or disable any ETW trace log which could be a sign of logging evasion.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
- https://abuse.io/lockergoga.txt
- https://medium.com/palantir/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
author: '@neu5ron, Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community'
date: 2019-03-22
modified: 2022-06-28
tags:
- attack.defense-evasion
- attack.t1070
- attack.t1562.006
- car.2016-04-002
logsource:
  category: process_creation
  product: windows
detection:
  selection_clear_1:
    CommandLine|contains|all:
    - 'cl'
    - '/Trace'
  selection_clear_2:
    CommandLine|contains|all:
    - 'clear-log'
    - '/Trace'
  selection_disable_1:
    CommandLine|contains|all:
    - 'sl'
    - '/e:false'
  selection_disable_2:
    CommandLine|contains|all:
    - 'set-log'
    - '/e:false'
  selection_disable_3:     # ETW provider removal from a trace session
    CommandLine|contains|all:
    - 'logman'
    - 'update'
    - 'trace'
    - '--p'
    - '-ets'
  selection_pwsh_remove:     # Autologger provider removal
    CommandLine|contains: 'Remove-EtwTraceProvider'
  selection_pwsh_set:     # Provider “Enable” property modification
    CommandLine|contains|all:
    - 'Set-EtwTraceProvider'
    - '0x11'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies command line activities that attempt to clear or disable Event Tracing for Windows (ETW) logs, which may signify an attacker’s efforts to evade detection and maintain persistence within a compromised system. The ability to manipulate ETW traces represents a sophisticated tactic often employed by advanced threat actors aiming to obscure their malicious activities from monitoring tools and security teams.

  The relevant MITRE ATT&CK tactics involved include **Defense Evasion (T1562)**, which encompasses methods used by attackers to avoid detection or evade defenses, and **Indicator Removal on Host (T1070)**, which specifically addresses techniques related to the deletion or modification of logs. The attacker’s objectives could span from hiding their tracks post-compromise to maintaining control over a system without being detected.

  Primary data sources for this rule include **process creation events** that log command line executions. The evaluation of command line arguments is critical, as the specifics of each command can indicate attempts to manipulate ETW logging features.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for any command line entries that match the criteria specified in this rule, focusing on any instances of log clearing or ETW manipulation commands.
  - **Analyze Command Line Arguments:** Pay special attention to command lines that contain phrases like "clear-log", "Remove-EtwTraceProvider", or "Set-EtwTraceProvider", indicating potential attempts at evasion.
  - **Cross-Reference User Activity:** Investigate the context of the user or process initiating the command. Identify whether the activity is consistent with typical usage patterns and check for recent security incidents related to that user.
  - **Aggregate ETW Logs (if available):** If your environment collects ETW logs, analyze them for any gaps or interruptions coinciding with the alert timeframe, which might indicate successful evasion tactics.

  ### Prioritization
  This alert should be treated with high severity due to the potential impact of successful logging evasion, which may allow persistent access for attackers and significantly hinder incident response efforts. The likelihood of such activities indicates a more advanced threat level, placing this alert on a priority list for immediate investigation.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage if logging for process creation events is not enabled or configured properly in certain environments. The detection logic assumes that any attempts to manipulate ETW traces are inherently malicious; however, there may be legitimate use cases for certain commands. Adequate collection of logs is necessary for this alert to function correctly, including the retention of detailed process creation logs with command line parameters.

