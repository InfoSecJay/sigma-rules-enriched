title: ETW Trace Evasion Activity
id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
status: test
description: |
  Detects command line activity that tries to clear or disable any ETW trace log which could be a sign of logging evasion.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
- https://abuse.io/lockergoga.txt
- https://medium.com/palantir/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
author: '@neu5ron, Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community'
date: 2019-03-22
modified: 2022-06-28
tags:
- attack.defense-evasion
- attack.t1070
- attack.t1562.006
- car.2016-04-002
logsource:
  category: process_creation
  product: windows
detection:
  selection_clear_1:
    CommandLine|contains|all:
    - 'cl'
    - '/Trace'
  selection_clear_2:
    CommandLine|contains|all:
    - 'clear-log'
    - '/Trace'
  selection_disable_1:
    CommandLine|contains|all:
    - 'sl'
    - '/e:false'
  selection_disable_2:
    CommandLine|contains|all:
    - 'set-log'
    - '/e:false'
  selection_disable_3:     # ETW provider removal from a trace session
    CommandLine|contains|all:
    - 'logman'
    - 'update'
    - 'trace'
    - '--p'
    - '-ets'
  selection_pwsh_remove:     # Autologger provider removal
    CommandLine|contains: 'Remove-EtwTraceProvider'
  selection_pwsh_set:     # Provider “Enable” property modification
    CommandLine|contains|all:
    - 'Set-EtwTraceProvider'
    - '0x11'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects command line activities that attempt to clear or disable Event Tracing for Windows (ETW) logs, which may indicate evasion tactics by attackers. The likely objective of the attacker is to hinder detection by preventing forensic tools from recording events related to their activities. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1070) and specifically relates to techniques that involve clearing or modifying logs (T1562.006). Primary telemetry sources include Windows Process Creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, capturing command line arguments used by processes.

  If malicious, this behavior could significantly impact security monitoring capabilities, leaving the organization vulnerable to undetected intrusions or malicious activities. Importantly, this detection does not confirm that an attacker has successfully compromised the system; it merely indicates the use of potentially malicious command-line arguments aimed at evasion.

  ### Investigation Steps

  - **Review command line execution details:** Examine Security Event ID 4688 for `CommandLine` containing "cl /Trace," "clear-log /Trace," or any of the other phrases specified in the rule. Malicious activity would involve the use of these commands, while benign activity may show legitimate administrative functions or troubleshooting.

  - **Correlate with process parent information:** Check for the parent process IDs in Windows Process Creation logs (Event ID 4688). Processes created by known monitoring tools or legitimate administrative tools may indicate benign behavior, whereas execution from unknown or suspicious processes suggests potential evasion attempts.

  - **Investigate recent changes to ETW settings:** Review logs for events indicating changes to ETW settings, particularly logs created by `logman` or PowerShell cmdlets (like `Remove-EtwTraceProvider` or `Set-EtwTraceProvider`). Malicious indicators may reveal unknown user accounts invoking these commands.

  - **Monitor system integrity post-detection:** Validate that no critical logs or ETW traces are missing on affected hosts. Use tools to compare the current event tracing output with historical data to identify any potential data loss.

  - **Identify legitimate use cases for command:** If the investigated command appears in logs, ensure to check documentation or consult with responsible teams to verify if the execution aligns with known maintenance or optimization activities.

  ### Prioritization

  This alert carries a high severity level due to the potential impact on system logging and monitoring capabilities. The behavior is indicative of known evasion tactics used by threat actors and is often weaponized to conceal malicious activities within a network.

  ### Blind Spots and Assumptions

  Detection may be limited if necessary log sources for process creation are not being collected or adequately configured, potentially leading to missed evasion attempts. Evasion techniques may also include the legitimate use of these commands during routine maintenance or troubleshooting. A related detection for tracking abnormal PowerShell activity could enhance visibility and coverage of potential malicious intents alongside this rule.

