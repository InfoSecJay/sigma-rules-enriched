title: ETW Trace Evasion Activity
id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
status: test
description: |
  Detects command line activity that tries to clear or disable any ETW trace log which could be a sign of logging evasion.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
- https://abuse.io/lockergoga.txt
- https://medium.com/palantir/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
author: '@neu5ron, Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community'
date: 2019-03-22
modified: 2022-06-28
tags:
- attack.stealth
- attack.defense-impairment
- attack.t1070
- attack.t1685
- car.2016-04-002
logsource:
  category: process_creation
  product: windows
detection:
  selection_clear_1:
    CommandLine|contains|all:
    - 'cl'
    - '/Trace'
  selection_clear_2:
    CommandLine|contains|all:
    - 'clear-log'
    - '/Trace'
  selection_disable_1:
    CommandLine|contains|all:
    - 'sl'
    - '/e:false'
  selection_disable_2:
    CommandLine|contains|all:
    - 'set-log'
    - '/e:false'
  selection_disable_3:     # ETW provider removal from a trace session
    CommandLine|contains|all:
    - 'logman'
    - 'update'
    - 'trace'
    - '--p'
    - '-ets'
  selection_pwsh_remove:     # Autologger provider removal
    CommandLine|contains: 'Remove-EtwTraceProvider'
  selection_pwsh_set:     # Provider “Enable” property modification
    CommandLine|contains|all:
    - 'Set-EtwTraceProvider'
    - '0x11'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects command line activity indicative of attempts to clear or disable Event Tracing for Windows (ETW) logs, which may signal a malicious actor's effort to evade detection by altering logging mechanisms. The adversary may aim to manipulate logs to hide their actions during lateral movement or data exfiltration, obstructing forensic analysis. This behavior is categorized under MITRE ATT&CK tactics "Defense Evasion" (TA0005) and techniques "Indicator Removal on Host" (T1070) and "Tainting Logs" (T1685).

  The primary telemetry sources include Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1, which capture command line arguments utilized for executing processes. The security impact of this behavior can be significant; successful evasion undermines incident response efforts and can facilitate ongoing compromise. Notably, this detection does NOT confirm whether the host is genuinely compromised or if the command was executed in a context that indicates malicious intent.

  ### Investigation Steps

  - **Check process creation logs for suspicious commands:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 logs for command line strings containing terms like `cl /Trace`, `clear-log /Trace`, and `Remove-EtwTraceProvider`. Valid commands associated with ETW management should not include these patterns.

  - **Identify the user context of the command:** Investigate the account or service that executed the command. A legitimate administrator performing ETW tasks may show a typical user account on systems with specific administrative privileges. Malicious execution may arise from unexpected or non-administrative accounts.

  - **Analyze command execution context:** Review logs for the process parent-child relationships surrounding the command. Commands initiated from known legitimate processes (e.g., cmd.exe) with standard administrative execution context may be benign; however, unusual parent processes could indicate malicious activity.

  - **Look for patterns indicating exfiltration or lateral movement:** Validate if the system is part of a scheduled task or concurrent with other suspicious behaviors. Correlate with known exponential commands that follow ETW tampering, such as `Invoke-WebRequest` or anomalous remote commands.

  - **Check for related log management alterations:** Review configurations and modifications to the ETW settings in the Windows Event Log using Event ID 1102. Seeing frequent adjustments to logging levels or retention policies could indicate an attempt to obscure malicious activity or misconfigure logging.

  ### Prioritization

  The alert severity is high due to the critical nature of the system's logging integrity, directly impacting the organization's ability to detect and respond to threats. The likelihood of malicious abuse is elevated, given that evasion techniques are often employed during attacks to hinder security visibility. Such behavior is frequently weaponized in targeted intrusions.

  ### Blind Spots and Assumptions

  Detection limitations include methods to bypass traditional monitoring, such as running commands through scripts that obfuscate activity. Reliable detection requires consistent logging configuration for process creation and should not rely solely on standard logs; appropriate permissions must be maintained for robust log generation. Legitimate activities may include valid administrative tasks performed under emergency circumstances or legitimate ETW modifications. Companion detections include monitoring for unusual PowerShell command line activity, which is often associated with similar malicious intents and can enhance overall visibility into potential attacks.

