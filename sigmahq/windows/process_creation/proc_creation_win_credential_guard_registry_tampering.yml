note: |
  ### Technical Context
  This detection rule identifies attempts to tamper with Windows Credential Guard settings by modifying registry keys through command line tools like `Reg.exe` or PowerShell. Windows Credential Guard utilizes virtualization-based security to safeguard sensitive credential information, such as NTLM hashes and Kerberos tickets. If attackers disable or manipulate Credential Guard, it may expose these credentials, thereby enabling lateral movement and privilege escalation within the network.

  The primary tactics and techniques associated with this behavior are categorized under the MITRE ATT&CK framework, particularly focusing on **Defense Evasion (TA0005)** and **Bypass User Account Control (T1548)**, and more specifically **T1562.001 - Disable or Modify Tools**. The malicious activity detected by this rule typically targets critical registry paths related to Device Guard and LSA, specifically settings such as `EnableVirtualizationBasedSecurity`, `RequirePlatformSecurityFeatures`, and `LsaCfgFlags`.

  Primary data sources for this detection include logs from process creation events that capture command line activities, providing insight into any unauthorized attempts to alter security configurations.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check logs for any instances of `PowerShell.exe`, `pwsh.exe`, and `reg.exe` that include suspicious command lines targeting registry keys associated with Credential Guard.

  - **Analyze Command Line Arguments:** Focus on command lines that contain keywords like `add`, `delete`, `New-ItemProperty`, `Set-ItemProperty`, and specific registry keys or values (`EnableVirtualizationBasedSecurity`, `RequirePlatformSecurityFeatures`, `LsaCfgFlags`).

  - **Evaluate User Context:** Identify the user or system context under which these commands were executed to assess whether they have legitimate permissions for making such changes, looking for potential privilege escalation attempts.

  - **Correlate with Other Security Events:** Search for related security events in your SIEM, such as suspicious account logins or unauthorized access to security configuration settings, to provide broader context around the detected activity.

  ### Prioritization
  The severity of this alert is high due to the critical role that Credential Guard plays in protecting sensitive credentials and the potential for significant compromise if it is disabled. The probability of threat actors employing this tactic for lateral movement or privilege escalation within an enterprise is considerable, increasing the urgency for investigation.

  ### Blind Spots and Assumptions
  This detection may not cover all possible vectors for tampering with Credential Guard, such as physical access to machines or attempts via alternative scripting methods that do not invoke `PowerShell.exe` or `reg.exe`. The detection logic assumes that the command line is being logged effectively without any configurations limiting visibility. For accurate detection, it is essential to ensure that process creation logs are enabled and configured to capture full command line arguments for all relevant tools.

