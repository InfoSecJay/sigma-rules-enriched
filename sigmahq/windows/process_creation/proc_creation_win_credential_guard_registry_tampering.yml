status: experimental
description: |
  Detects attempts to add, modify, or delete Windows Credential Guard related registry keys or values via command line tools such as Reg.exe or PowerShell.
  Credential Guard uses virtualization-based security to isolate secrets so that only privileged system software can access them.
  Adversaries may disable Credential Guard to gain access to sensitive credentials stored in the system, such as NTLM hashes and Kerberos tickets, which can be used for lateral movement and privilege escalation.
  The rule matches suspicious command lines that target DeviceGuard or LSA registry paths and manipulate keys like EnableVirtualizationBasedSecurity, RequirePlatformSecurityFeatures, or LsaCfgFlags.
  Such activity may indicate an attempt to disable or tamper with Credential Guard, potentially exposing sensitive credentials for misuse.
references:
- https://woshub.com/disable-credential-guard-windows/
- https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-deviceguard
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-12-26
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_cli:
    CommandLine|contains:
            # add/modify
    - 'add '
    - 'New-ItemProperty '
    - 'Set-ItemProperty '
    - 'si '          # SetItem Alias
            # delete
    - 'delete '
    - 'del '
    - 'Remove-ItemProperty '
    - 'rp '
  selection_key_base:
    CommandLine|contains:
    - '\Control\DeviceGuard'
    - '\Control\LSA'
    - 'Software\Policies\Microsoft\Windows\DeviceGuard'
  selection_key_specific:
    CommandLine|contains:
    - 'EnableVirtualizationBasedSecurity'
    - 'RequirePlatformSecurityFeatures'
    - 'LsaCfgFlags'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_credential_guard_registry_tampering/info.yml
note: |
  ### Technical Context

  This Sigma rule detects attempts to add, modify, or delete specific Windows Registry keys related to Windows Credential Guard using command line tools, primarily `reg.exe` or PowerShell. The primary goal for an attacker is to disable Credential Guard to access sensitive credentials, such as NTLM hashes or Kerberos tickets, which can be exploited for lateral movement and privilege escalation. This behavior aligns with the MITRE ATT&CK technique for defense evasion, specifically T1562.001 (Disable or Modify Tools). Primary telemetry sources include process creation logs (Windows Event ID 4688) and the command line arguments used during execution. If malicious, the security impact can be significant, potentially compromising credential protections within the environment. It is important to note that this detection does not confirm an adversary's success in disabling Credential Guard but rather indicates an attempt to manipulate relevant registry settings.

  ### Investigation Steps

  - **Identify the Process Executing the Command:** Check Windows Event ID 4688 for process creation details. Look for entries with `Image` paths containing `reg.exe`, `powershell.exe`, or `pwsh.exe`. This can validate the context of the alert.

  - **Review Command Line Arguments:** Inspect the `CommandLine` field in the Event 4688 logs, focusing on instances containing registry paths `\Control\DeviceGuard` or `\Control\LSA`, and keywords like `add`, `delete`, or specific keys such as `EnableVirtualizationBasedSecurity`. Match these against suspicious execution patterns.

  - **Correlate with User Context:** Identify the user context under which the command was executed. If a non-administrative user or a service account is executing these commands, it may indicate malicious intent. Check `Security Event ID 4634` for user logon activities around the same timeframe.

  - **Analyze Legitimate Use Cases:** Review the asset's baseline activity. Document expected commands that may trigger similar alerts, such as legitimate administrative changes to Credential Guard settings during system maintenance or updates.

  - **Identify High-Risk Indicators:** Look for high-confidence malicious indicators such as the direct manipulation of keys like `LsaCfgFlags` via an elevated command prompt, indicated by specific command line patterns that correlate with the Sigma rule criteria.

  - **Investigate for Exfiltration or Further Actions:** If possible, examine other logs (e.g., Sysmon Event ID 10 for registry events) to see if the command led to further commands or actions that could indicate data exfiltration or malicious persistence.

  ### Prioritization

  This alert is of high severity because it involves the potential alteration of a critical security feature on Windows systems, which protects sensitive credentials. The likelihood of exploitation is significant, as this technique is commonly weaponized by adversaries seeking to bypass security mechanisms to facilitate lateral movement.

  ### Blind Spots and Assumptions

  There are limitations in detection since command line activities can be obscured by legitimate administrative actions, and skilled attackers may use different tools or techniques to evade detection. Ensure that logging for command line activity is configured correctly across relevant hosts to capture these events. Activities such as routine updates to system configurations by system administrators may trigger this alert but should be validated through context. Companion detections such as monitoring for changes in group policy settings (e.g., through Sysmon or Directory Service logs) can strengthen overall coverage against threats targeting Credential Guard.

