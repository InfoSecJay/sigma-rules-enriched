  type: similar
status: experimental
description: |
  Detects attempts to add, modify, or delete Windows Credential Guard related registry keys or values via command line tools such as Reg.exe or PowerShell.
  Credential Guard uses virtualization-based security to isolate secrets so that only privileged system software can access them.
  Adversaries may disable Credential Guard to gain access to sensitive credentials stored in the system, such as NTLM hashes and Kerberos tickets, which can be used for lateral movement and privilege escalation.
  The rule matches suspicious command lines that target DeviceGuard or LSA registry paths and manipulate keys like EnableVirtualizationBasedSecurity, RequirePlatformSecurityFeatures, or LsaCfgFlags.
  Such activity may indicate an attempt to disable or tamper with Credential Guard, potentially exposing sensitive credentials for misuse.
references:
- https://woshub.com/disable-credential-guard-windows/
- https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-deviceguard
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-12-26
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_cli:
    CommandLine|contains:
            # add/modify
    - 'add '
    - 'New-ItemProperty '
    - 'Set-ItemProperty '
    - 'si '          # SetItem Alias
            # delete
    - 'delete '
    - 'del '
    - 'Remove-ItemProperty '
    - 'rp '
  selection_key_base:
    CommandLine|contains:
    - '\Control\DeviceGuard'
    - '\Control\LSA'
    - 'Software\Policies\Microsoft\Windows\DeviceGuard'
  selection_key_specific:
    CommandLine|contains:
    - 'EnableVirtualizationBasedSecurity'
    - 'RequirePlatformSecurityFeatures'
    - 'LsaCfgFlags'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_credential_guard_registry_tampering/info.yml
note: |
  ### Technical Context

  This Sigma rule detects attempts to manipulate registry keys associated with Windows Credential Guard through command-line interfaces, specifically targeting keys related to virtualization-based security settings. The likely objective of an attacker triggering this rule is to disable or tamper with Credential Guard to gain unauthorized access to sensitive system credentials, such as NTLM hashes and Kerberos tickets, facilitating lateral movement and privilege escalation in the network. This behavior corresponds to the MITRE ATT&CK technique T1685 - Improper Input Validation.

  The primary telemetry sources are Windows process creation logs, specifically those that capture events related to PowerShell and Reg.exe usage. The security impact of malicious activity in this context is severe, as it undermines the integrity of the Credential Guard mechanism that protects sensitive information. However, it is essential to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also alter these keys.

  ### Investigation Steps

  - **Identify the process creating the alert**: Check Windows Security Event ID 4688 logs to identify the process details (e.g., ParentProcessId, ProcessName, CommandLine) that initiated the suspicious command. Look for any known administrative scripts or processes that would typically modify these registry values.

  - **Analyze the command line for specific keywords**: Review the CommandLine field of the detected instance for keywords such as 'add ', 'delete ', 'New-ItemProperty ', or 'Remove-ItemProperty ' paired with DeviceGuard or LSA registry paths. Malicious indicators include unauthorized changes to 'EnableVirtualizationBasedSecurity' or 'LsaCfgFlags'.

  - **Review registry change history**: Search the system's Security Event ID 4663 (Access to an object) to confirm if registry keys in 'HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\DeviceGuard' or 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\DeviceGuard' were modified recently, indicating unauthorized tampering.

  - **Correlate with expected legitimate activity**: Compare the context of the command (e.g., system administrative tasks, patch updates) against the logs captured around the alert time, noting any regular maintenance scripts or automated tools used by your organization that may involve alterations to Credential Guard settings.

  - **Check for multiple attempts**: Identify if there are repeated or scheduled attempts to modify these keys by reviewing the logs for similar command executions within a short timeframe. This can indicate a potential malicious effort to disrupt security configurations.

  - **Assess the criticality of affected systems**: Determine if the system or user account involved in the alert is deemed high-value or sensitive. Analyze asset attributes such as role (e.g., Domain Controller, File Server) and assess potential risk if compromised, especially in environments where Credential Guard is critical for security posture.

  ### Prioritization

  This alert should be considered high priority due to the security ramifications of impacting systems that utilize Credential Guard, especially in high-value environments. The behavior detected is often indicative of malicious intent and can lead to significant lateral movement opportunities if successful. Tampering with such security controls is a common tactic among adversaries and should be addressed immediately.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging configurations or environments where registry access does not generate security events. Legitimate administrative activities, such as system updates or policy deployments, could also trigger this alert. It is also possible for adversaries to use alternative methods, such as using direct API calls or non-existent command-line parameters that could evade detection. Related detections include monitoring for unusual access patterns to sensitive registry locations or abnormal use of administrative tools that could indicate malicious actions.

