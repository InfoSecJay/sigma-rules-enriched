detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\reg.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
    - 'reg.exe'
  selection_cli:
    CommandLine|contains:
            # add/modify
    - 'add '
    - 'New-ItemProperty '
    - 'Set-ItemProperty '
    - 'si '          # SetItem Alias
            # delete
    - 'delete '
    - 'del '
    - 'Remove-ItemProperty '
    - 'rp '
  selection_key_base:
    CommandLine|contains:
    - '\Control\DeviceGuard'
    - '\Control\LSA'
    - 'Software\Policies\Microsoft\Windows\DeviceGuard'
  selection_key_specific:
    CommandLine|contains:
    - 'EnableVirtualizationBasedSecurity'
    - 'RequirePlatformSecurityFeatures'
    - 'LsaCfgFlags'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
