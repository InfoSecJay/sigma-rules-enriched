title: Always Install Elevated MSI Spawned Cmd And Powershell
id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
status: test
description: Detects Windows Installer service (msiexec.exe) spawning "cmd" or "powershell"
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-50-638.jpg
author: Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community
date: 2020-10-13
modified: 2022-10-20
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_parent:
    ParentImage|contains|all:
    - '\Windows\Installer\'
    - 'msi'
    ParentImage|endswith: 'tmp'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the Windows Installer service (`msiexec.exe`) spawns either a command prompt (`cmd.exe`) or PowerShell (`powershell.exe`). Such behavior is often indicative of attempts to execute arbitrary commands or scripts in the context of an installation process, which could signify malicious activity like privilege escalation or code execution. Attackers may exploit the installation service to gain elevated privileges and execute unauthorized commands, allowing for greater control over compromised systems.

  The relevant MITRE ATT&CK tactics and techniques this rule pertains to include:
  - **Privilege Escalation** (T1068): Exploiting vulnerabilities to gain higher permissions.
  - **Defense Evasion** (T1548.002): Utilizing attributes of legitimate processes to evade detection while executing unexpected commands.

  The primary telemetry sources for validating this detection include process creation logs detailing which processes were spawned, alongside their parent-child relationships, specifically monitoring for instances where `msiexec.exe` is the parent process.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check logs for instances where `msiexec.exe` is the parent process of `cmd.exe` or `powershell.exe`. Focus on the exact timestamps of alerts to correlate with the user activity.
  - **Analyze Installation Activity**: Examine the specific installation logs (MSI logs) around the time of the alerts to understand the context and legitimacy of the installation that triggered this behavior.
  - **Inspect User Permissions**: Verify the permissions of the user account associated with the activity to determine if it aligns with expected roles and identify any unauthorized access attempts.
  - **Correlate with Anti-Virus and EDR Alerts**: Cross-reference this activity with any alerts raised by endpoint protection products which may indicate known malicious behaviors or tools being executed during this time.

  ### Prioritization
  The medium severity of this alert indicates that while the behavior could be part of normal operations in some environments, its presence is concerning and warrants further investigation, especially in enterprise settings where unauthorized privilege escalation can lead to severe security implications.

  ### Blind Spots and Assumptions
  The detection logic assumes that all instances of the required parent-child process relationships are indicative of malicious activity, which may lead to false positives in legitimate installation scenarios. If logging is not properly configured for process creation events or if the logging level is insufficient, this rule may miss relevant activities. Additionally, the detection relies on the presence of standard system processes (`msiexec.exe`, `cmd.exe`, and `powershell.exe`), and discrepancies in user behavior patterns might not be fully captured if additional monitoring tools are not deployed.

