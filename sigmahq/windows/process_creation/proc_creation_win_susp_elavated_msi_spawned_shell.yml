title: Always Install Elevated MSI Spawned Cmd And Powershell
id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
status: test
description: Detects Windows Installer service (msiexec.exe) spawning "cmd" or 
  "powershell"
references:
- https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-50-638.jpg
author: Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community
date: 2020-10-13
modified: 2022-10-20
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_parent:
    ParentImage|contains|all:
    - '\Windows\Installer\'
    - 'msi'
    ParentImage|endswith: 'tmp'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects instances where the Windows Installer service (msiexec.exe) spawns command-line interpreter processes (cmd.exe or powershell.exe). This behavior is often associated with techniques for privilege escalation where an attacker may leverage legitimate system processes to execute malicious scripts or commands. The likely objective is to gain elevated privileges within the system, potentially leading to further exploitation of the environment.

  Relevant MITRE ATT&CK tactic and technique for this detection include **Privilege Escalation** (T1548.002). Primary telemetry sources involve Windows process creation logs captured via Security Event ID 4688 and Sysmon Event ID 1, where creation of new processes is logged. If this activity is malicious, it can compromise system integrity, provide unauthorized access, or facilitate lateral movement. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is required to understand the context and legitimacy of the command execution.

  ### Investigation Steps

  - **Identify the spawning parent process:** Review Security Event ID 4688 or Sysmon Event ID 1 for the process creation log. Look for an entry where `NewProcessName` includes `cmd.exe` or `powershell.exe` and the `ParentImage` is msiexec.exe. This indicates a potential misuse of the installer process.

  - **Examine command-line arguments:** Check the command-line arguments in the creation logs for `cmd.exe` or `powershell.exe`. Malicious indicators may include obfuscated scripts or commands that attempt to hide their intent. Legitimate use may include common administrative tasks like deployment scripts.

  - **Correlate with installation logs:** Review installation logs (located at `%temp%` or `%systemroot%\Logs\WindowsInstaller`) corresponding to the timing of the detected process creation. Check for anomalies such as unexpected installations or modifications, which may indicate backdoor setups.

  - **Analyze host behavior prior to the alert:** Look for legitimate activities such as standard software installations that may precede the alert. For example, a scheduled software upgrade might warrant cmd or powershell usage through msiexec.exe.

  - **Check for Process Injection attempts:** Investigate if the detected cmd or powershell processes are spawning other processes, typically associated with malware behavior, such as unusual or unauthorized executables.

  - **Validate asset criticality and impact:** Consider the role of the host where the alert was generated. Are there sensitive functions or data on this system that could be targeted? Higher criticality assets warrant a more thorough and immediate investigation response.

  ### Prioritization

  The alert is evaluated as medium severity due to the potential impact of privilege escalation if malicious. The likelihood of abuse is moderate, as such behavior may be weaponized in various attack scenarios, especially in environments where msiexec is regularly used for legitimate software installations.

  ### Blind Spots and Assumptions

  Detection limits include potential evasion techniques like renaming executables or disguising malicious commands under legitimate processes, which may not be captured. Consistent log collection from Windows Security (Event ID 4688) and Sysmon (Event ID 1) is critical for reliable detection. Additionally, legitimate administrative activities, such as software installs or system updates, may trigger this alert, requiring context for accurate interpretation. A related detection to consider is monitoring for direct command execution via PowerShell scripts or cmd.exe outside of installer contexts, enhancing overall coverage against privilege escalation attacks.

