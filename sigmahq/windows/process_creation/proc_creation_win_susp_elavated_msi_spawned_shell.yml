logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'Cmd.Exe'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_parent:
    ParentImage|contains|all:
    - '\Windows\Installer\'
    - 'msi'
    ParentImage|endswith: 'tmp'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  The Sigma rule detects instances where the Windows Installer service (msiexec.exe) spawns a command shell (cmd.exe) or PowerShell (pwsh.exe). This behavior typically indicates a privilege escalation attempt as adversaries often leverage MSI installations to execute arbitrary commands, achieving escalation in the context of an administrative user. Relevant MITRE ATT&CK tactics include **Privilege Escalation (TA0004)** and the specific technique **Abuse Elevation Control Mechanism (T1548.002)**.

  Primary telemetry sources are process creation logs from the Windows Security Event Log (Event ID 4688) and Sysmon Event ID 1, which capture process execution details. If malicious, this behavior may grant attackers elevated privileges and access to sensitive information or critical infrastructure. However, this detection does NOT independently confirm malicious intent, as legitimate MSI installations may also spawn these processes.

  ### Investigation Steps

  - **Review creation logs:** Examine Security Event ID 4688 for msiexec.exe spawning cmd.exe or pwsh.exe. Confirm fields such as `Image` and `ParentImage`. Legitimate examples often include administrative tool usage, not unexpected process creation.

  - **Identify elevated privileges:** Check if the invocation of cmd.exe or PowerShell occurred under a user account with administrative rights. Look for Event ID 4648 that details logons with elevated privileges.

  - **Analyze command execution:** Investigate the command line arguments associated with cmd.exe or PowerShell processes. Malicious indicators may include usage of commands like `Invoke-WebRequest` or downloads from suspicious URLs.

  - **Examine process parentage:** Verify the parent process of the invoked command or PowerShell instance. If sourced from `C:\Windows\Installer\`, it is suspicious. Look for commands in the `CommandLine` field of Sysmon Event ID 1 for signs of redirection or obfuscation.

  - **Determine legitimate use cases:** Check for ongoing installations or updates within enterprise software management tools or configurations that would trigger msiexec.exe without malicious intent.

  - **Correlate with other detections:** Look for related alerts involving process creation or command execution from the same entity (e.g., Event ID 4624 for logons or Event ID 7045 for service installations) to strengthen the investigation context.

  ### Prioritization

  This alert is medium severity due to the potential for privilege escalation within critical systems. The likelihood of abusive use is moderate, as this behavior can be weaponized by sophisticated attackers exploiting the MSI installation process.

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion techniques that may obscure command execution, such as alternate command syntax or encoding. Reliable detection requires configuration for Sysmon or enhanced logging settings to ensure full visibility. Legitimate software installation and update processes frequently trigger these alerts, complicating triage. A related detection alerting on suspicious command execution from PowerShell should be implemented to provide comprehensive coverage.

