    - 'lsassdump'
    - 'lsassdmp'
  - CommandLine|contains|all:
    - 'lsass'
    - '.dmp'
  - CommandLine|contains|all:
    - 'SQLDmpr'
    - '.mdmp'
  - CommandLine|contains|all:
    - 'nanodump'
    - '.dmp'
