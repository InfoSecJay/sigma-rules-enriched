note: |
  ### Technical Context

  This detection identifies command line arguments containing the keywords "lsass" and ".dmp", which are indicative of attempts to dump the Local Security Authority Subsystem Service (LSASS) process. LSASS is critical for handling security policy and storing password hashes; thus, obtaining a memory dump can enable attackers to extract sensitive credentials. This activity aligns with the MITRE ATT&CK technique for Credential Dumping (T1003.001).

  Primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process initiation with command line arguments. The security impact is significant as successful credential dumping can lead to unauthorized access and lateral movement within the network. However, it is important to note that this detection does NOT confirm malicious intent without further context; legitimate applications can also invoke LSASS dumps for troubleshooting or analysis.

  ### Investigation Steps

  - **Review command line arguments:** Check for instances of 'lsass' and '.dmp' in Security Event ID 4688 or Sysmon Event ID 1 logs. Legitimate processes usually won’t contain both terms; note any occurrences alongside other suspicious parameters.

  - **Identify high-confidence malicious software:** Look for known tools associated with LSASS dumping such as ProcDump, Mimikatz, or NanoDump in the command line. Cross-reference process instances with the tool’s known hashes or signatures.

  - **Correlate with user behavior:** Investigate the account associated with the command. Look for anomalies like administrative accounts executing this command without prior warning (e.g., Event ID 4624, logon type).

  - **Monitor file creation:** Check for the presence of output files named 'lsass.dmp', 'nanodump.dmp', or similar in directories where process dumps typically would not occur (e.g., C:\Users\<username>\Documents\ or Temp folders). Use File System logs or Sysmon Event ID 11 to track file creation.

  - **Assess host criticality:** Establish if the host running the command is critical (e.g., domain controllers). Malicious activity on these systems carries a higher risk of breach.

  - **Determine context of usage:** Investigate whether this command was run as part of legitimate IT or security operations, such as when a known, authorized administrator is attempting to analyze system behavior.

  ### Prioritization

  This alert holds a high severity in an enterprise context due to the potential compromise of credential information from a critical system (i.e., domain controller). The likelihood of abuse is elevated due to frequent exploitation of the LSASS process in attack scenarios involving credential dumping. Moreover, such malicious behavior is commonly weaponized in active attacks.

  ### Blind Spots and Assumptions

  Detection may miss attempts to obfuscate execution by using unconventional file names or paths to dump LSASS, as well as variants of commands that achieve the same goal without specified keywords. Reliable detection requires comprehensive logging configurations for process creation and should include necessary access to security event logs. Legitimate debugging and forensics activities could trigger these alerts when performed by system administrators or security teams. A related detection rule that enhances coverage would be monitoring for anomalous file writes associated with process creation in high-privilege environments.

