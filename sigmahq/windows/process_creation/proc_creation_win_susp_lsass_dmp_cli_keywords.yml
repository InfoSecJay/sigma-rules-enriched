logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|contains:
    - 'lsass.dmp'
    - 'lsass.zip'
    - 'lsass.rar'
    - 'Andrew.dmp'
    - 'Coredump.dmp'
    - 'NotLSASS.zip'            # https://github.com/CCob/MirrorDump
    - 'lsass_2'            # default format of procdump v9.0 is lsass_YYMMDD_HHmmss.dmp
    - 'lsassdump'
    - 'lsassdmp'
  - CommandLine|contains|all:
    - 'lsass'
    - '.dmp'
  - CommandLine|contains|all:
    - 'SQLDmpr'
    - '.mdmp'
  - CommandLine|contains|all:
    - 'nanodump'
    - '.dmp'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential attempts to dump the Local Security Authority Subsystem Service (LSASS) process by monitoring command-line arguments that include both "lsass" and file extensions typically associated with memory dumps, such as ".dmp". Unauthorized access to LSASS is a critical concern in security environments, as it can allow attackers to extract sensitive credentials and authentication tokens.

  In this scenario, an attacker may leverage tools like Mimikatz or NanoDump to capture credentials from LSASS memory, thereby gaining illicit access to systems or networks. The primary objective is often to escalate privileges or move laterally within an enterprise, positioning the attacker to execute further malicious activities. This behavior aligns with MITRE ATT&CK techniques, particularly T1003.001 (Credential Dumping: LSASS Memory).

  The most relevant data sources for this detection are process creation events, which provide visibility into command-line activity. Additional context may be gleaned from logs associated with security events, such as Access Token Manipulation or Process Injection logs.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for processes related to "lsass" or commands executing with ".dmp" to confirm the legitimacy of the command-line arguments and identify any unauthorized activity.
  - **Examine User Context:** Determine the user context under which suspicious commands were executed. Look for any anomalies in user behavior, such as administrative accounts or service accounts invoking suspicious memory dump tools.
  - **Correlate with Security Events:** Check for corresponding security events indicating privilege escalation or abnormal login patterns. Validate whether the process execution aligns with legitimate administrative tasks.
  - **Collect Additional Artifacts:** Gather evidence from memory dumps or process snapshots around the time of the suspicious command execution for forensic analysis, focusing on potential credential access.

  ### Prioritization
  This alert is categorized as high severity due to the critical nature of LSASS as a target for credential theft, the potential impact of unauthorized credential access, and the likelihood of further exploitation within the enterprise environment.

  ### Blind Spots and Assumptions
  Potential blind spots include insufficient coverage of processes that may not trigger standard logging on endpoints, limiting detection capabilities to only those systems with comprehensive logging enabled. The detection logic assumes that a successful command line will always include "lsass" and ".dmp", which may not capture all variants used by sophisticated attackers. Required configurations include ensuring detailed command-line logging is enabled across all Windows devices in the enterprise for effective monitoring.

