detection:
  selection:
  - CommandLine|contains:
    - 'lsass.dmp'
    - 'lsass.zip'
    - 'lsass.rar'
    - 'Andrew.dmp'
    - 'Coredump.dmp'
    - 'NotLSASS.zip'            # https://github.com/CCob/MirrorDump
    - 'lsass_2'            # default format of procdump v9.0 is lsass_YYMMDD_HHmmss.dmp
    - 'lsassdump'
    - 'lsassdmp'
  - CommandLine|contains|all:
    - 'lsass'
    - '.dmp'
  - CommandLine|contains|all:
    - 'SQLDmpr'
    - '.mdmp'
  - CommandLine|contains|all:
    - 'nanodump'
    - '.dmp'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects command line arguments containing keywords indicating a potential attempt to dump or create dumps of the LSASS (Local Security Authority Subsystem Service) process. The primary objective of an attacker using this technique is to extract sensitive credential data, such as NTLM hashes or password information, which can be leveraged for further lateral movement within the network. This activity aligns with the MITRE ATT&CK framework under the tactic 'Credential Access' and the technique 'OS Credential Dumping' (T1003.001).

  The primary telemetry source for this detection is Windows Process Creation logs, specifically capturing command line arguments used during process execution. If successfully executed, this behavior can lead to unauthorized access and compromise of user credentials, posing a significant security risk. Importantly, this detection does NOT confirm that credential dumping was successful, only that there was an attempted operation indicative of such behavior.

  ### Investigation Steps

  - **Check Windows Security Event ID 4688**: Review security logs for Event ID 4688 to confirm that the process creation event corresponds to the detected command line containing 'lsass' and '.dmp'. Look for instances wherein the process name matches known credential dumping tools.

  - **Validate Operations on LSASS**: Analyze system performance counters and memory dump locations to identify if any LSASS-related activities were intended for legitimate application debugging rather than malicious intent. Legitimate processes typically do not reference the LSASS process or file formats such as '.dmp'.

  - **Correlate with Sysmon Event ID 1**: Cross-reference Sysmon Event ID 1 logs to pinpoint the parent process that initiated the command line in question. Investigate if it originates from a legitimate application or if it appears suspicious based on the parent-child process relationships.

  - **Examine User Context and Asset Criticality**: Identify the user context executing the command and the role of the affected asset. Privileged accounts (e.g., domain admins) engaging in LSASS dumping tactics are considered a higher risk due to their ability to access sensitive resources.

  - **Verify File Creation**: Check for the creation of suspicious dump files in directories frequented by credential dumping tools (e.g., C:\Windows\Temp\). Look specifically for files named 'lsass*.dmp' to determine if this activity is substantiated by actual file artifacts.

  ### Prioritization

  This alert is considered **High Severity** due to the direct threat to credential security and potential escalation of privileges in the environment. Given that LSASS dumping techniques are commonly weaponized by adversaries in advanced persistent threat (APT) scenarios, the risk of malicious abuse is significant.

  ### Blind Spots and Assumptions

  Detection limitations include the risk of evasion techniques such as the use of file-less attacks or manipulation of legitimate tools which may not trigger standard logging. Reliable detection requires that process creation logging is correctly configured on all endpoints. Legitimate maintenance operations, such as security audits or debugging applications, may inadvertently trigger this alert. Companioned detections include monitoring for known credential dumping tools or artifacts in memory (e.g., additional Sigma rules for abnormal processes interacting with LSASS).

