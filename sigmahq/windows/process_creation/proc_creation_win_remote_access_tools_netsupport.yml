note: |
  ### Technical Context

  This Sigma rule detects the execution of the NetSupport Remote Control application, specifically the NetSupport Client Configurator (PCICFGUI.EXE). Adversaries may leverage this remote access tool (RAT) to establish control over compromised systems, using it to execute commands or move laterally across a network. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique identified as Remote Access Software (T1219.002).

  The primary telemetry source is Windows process creation events, particularly looking for Event ID 4688 from Windows Security Logs. If malicious, this activity could allow further exploitation, data leakage, or other nefarious actions within the environment. Importantly, the detection of this rule does NOT confirm malicious intent on its own, as legitimate use of remote access tools can occur.

  ### Investigation Steps

  - **Check process execution details:** Review Windows Security Event ID 4688 logs for process creation events involving PCICFGUI.EXE and associated parent processes. Look for anomalous parent-child relationships that might suggest evasion tactics. Legitimate execution is often initiated by known system processes or administrative tools.

  - **Analyze user activity:** Investigate the user account associated with the execution of PCICFGUI.EXE to ascertain if it aligns with expected behavior. Verify if the account was authorized to use remote access tools or if it shows signs of credential compromise.

  - **Review application control logs:** If application whitelisting is implemented, check the logs for entries that permit PCICFGUI.EXE execution. Note if similar tools were flagged or blocked previously, indicating a deviation from normal usage.

  - **Inspect network traffic:** Look for unusual outbound connections via proxy logs or firewall logs related to the IP addresses associated with NetSupport. This could indicate potential data exfiltration or command and control communications.

  - **Validate installation and configuration:** Check for the original file path and installation integrity of NetSupport applications on the Windows system. Compare hashes of the executable against known good sources to identify potential tampering.

  ### Prioritization

  This alert warrants medium priority due to the potential impact of the affected system and the likelihood of malicious abuse, as remote access tools are commonly weaponized for unauthorized access. The presence of a legitimate tool does not inherently indicate safe usage, making it essential for analysts to assess the context thoroughly.

  ### Blind Spots and Assumptions

  Successful detection may be limited by users employing similar legitimate remote access tools or configurations that are whitelisted, potentially leading to false positives. Logs must be correctly configured to capture all necessary process creation events for reliable detection. Common legitimate activities that may trigger this alert include remote IT support sessions or legitimate software maintenance tasks. A related detection to strengthen coverage would be the identification of credential dumping activities (T1003), as they often precede the deployment of such remote access tools.

