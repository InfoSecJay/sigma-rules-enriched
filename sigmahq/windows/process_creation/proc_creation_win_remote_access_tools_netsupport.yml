note: |
  ### Technical Context
  This rule detects the execution of the NetSupport Remote Control application, which may indicate that an adversary is using this legitimate remote access tool to establish an unauthorized command and control (C2) channel within a target organization. Attackers often favor such tools because they can blend in with acceptable use policies, making detection challenging. The intent behind utilizing applications like NetSupport could range from data exfiltration to gaining persistent access to the network for further attack stages.

  The relevant MITRE ATT&CK tactics for this rule include **Command and Control** (TA0011) and the technique **Application Layer Protocol** (T1219.002), which highlights the use of legitimate software for remote access. The primary data source for this detection is process creation events on Windows systems, which log the launch of executables and can reveal potentially malicious activity if unusual applications are invoked.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate Windows process creation events around the time of the alert to identify the invocation of the NetSupport Remote Control or related executables. Pay particular attention to parent processes that may indicate how the tool was launched.
  - **Analyze Network Connections**: Examine network traffic logs or firewall logs to track any outbound connections initiated by the NetSupport application, looking for unusual contact with external IPs or domains that are not typically associated with legitimate remote support activities.
  - **Check Application Control Policies**: Validate whether the use of NetSupport is authorized in your organization. This includes checking against approved application whitelists to understand the potential for legitimate usage versus malicious exploitation.
  - **Assess User Activity**: Investigate the user account associated with the execution of the NetSupport application. Look for signs of credential compromise or unusual access patterns that may indicate that the account has been compromised.

  ### Prioritization
  The alert's severity is medium due to the potential risk associated with adversaries leveraging legitimate remote access tools, which can facilitate unauthorized access and control over target systems, particularly in sensitive environments.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of remote access tools, as many legitimate software applications could be used similarly without triggering this alert. Additionally, the logic assumes that NetSupport is not an authorized tool in usage; thus, environments that intentionally use it for remote support could generate false positives. Effective implementation of this alert requires proper logging of process creation events and the inclusion of relevant remote software in application control policies for effective monitoring.

