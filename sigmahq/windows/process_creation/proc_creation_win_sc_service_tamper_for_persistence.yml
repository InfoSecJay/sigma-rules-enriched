title: Potential Persistence Attempt Via Existing Service Tampering
id: 38879043-7e1e-47a9-8d46-6bec88e201df
status: test
description: Detects the modification of an existing service in order to execute an
  arbitrary payload when the service is started or killed as a potential method for
  persistence.
references:
- https://pentestlab.blog/2020/01/22/persistence-modify-existing-service/
author: Sreeman
date: 2020-09-29
modified: 2023-02-04
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1543.003
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
  - CommandLine|contains|all:
    - 'sc '
    - 'config '
    - 'binpath='
  - CommandLine|contains|all:
    - 'sc '
    - 'failure'
    - 'command='
  selection_reg_img:
  - CommandLine|contains|all:
    - 'reg '
    - 'add '
    - 'FailureCommand'
  - CommandLine|contains|all:
    - 'reg '
    - 'add '
    - 'ImagePath'
  selection_reg_ext:
    CommandLine|contains:
    - '.sh'
    - '.exe'
    - '.dll'
    - '.bin$'
    - '.bat'
    - '.cmd'
    - '.js'
    - '.msh$'
    - '.reg$'
    - '.scr'
    - '.ps'
    - '.vb'
    - '.jar'
    - '.pl'
  condition: selection_sc or all of selection_reg_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects attempts to tamper with existing Windows services, which could indicate a potential persistence mechanism employed by an attacker. By modifying an existing service's configuration—most notably through commands that alter the service's binary path or failure command—an attacker can create a pathway to execute arbitrary code when the service starts or is interrupted. This technique may be leveraged following initial access to maintain persistence on a compromised system or to execute further malicious activities.

  The relevant MITRE ATT&CK tactics include **Persistence (T1543.003)**, where attackers manipulate services to create or modify logically equivalent services, and **Defense Evasion (T1574.011)**, where they disguise their payloads or activities by utilizing legitimate service mechanisms. The detection approach can successfully catch these nefarious modifications before they progress to exploitation.

  Primary data sources include **process creation logs** from Windows Event Logs, which will capture when and how services are modified or created. Additionally, logs from service management commands can provide insight into what actions are taken by users or processes on a system.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances of commands such as `sc config` or `reg add` related to services. Pay close attention to anomalous timing and the user accounts associated with these actions.
  - **Correlate with Service Configuration**: Cross-reference the identified service modification commands against the current service configurations (using `Get-Service` or similar commands) to establish if any services have recently had their properties altered.
  - **Assess Related Monitoring Alerts**: Investigate associated alerts for privilege escalation attempts, unusual service behaviors, or configurations that deviate from established baselines, helping to contextualize the tampering action.
  - **Conduct File and Binary Verification**: Identify the binaries or scripts set as service paths. Verify their integrity and authenticity, looking for known malicious signatures or behaviors, particularly scripts that resemble or include executable extensions.

  ### Prioritization
  The severity of this alert is medium due to the criticality of Windows services as integral components of system functionality. As modifications can lead to the execution of unauthorized code, the likelihood of significant impact if left unchecked necessitates timely investigation and response in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may overlook more sophisticated evasion techniques employed by advanced persistent threats (APTs) that utilize less common service configurations or encryption methods for malicious payloads. The logic depends on well-formed command patterns for detection; any obfuscation or atypical command structures may bypass this rule. Additionally, appropriate logging (including process creation events) must be enabled and configured correctly on all monitored systems to facilitate this detection.

