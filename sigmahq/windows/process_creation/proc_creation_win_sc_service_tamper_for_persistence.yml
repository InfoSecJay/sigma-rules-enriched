title: Potential Persistence Attempt Via Existing Service Tampering
id: 38879043-7e1e-47a9-8d46-6bec88e201df
status: test
description: Detects the modification of an existing service in order to execute
  an arbitrary payload when the service is started or killed as a potential 
  method for persistence.
references:
- https://pentestlab.blog/2020/01/22/persistence-modify-existing-service/
author: Sreeman
date: 2020-09-29
modified: 2023-02-04
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1543.003
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
  - CommandLine|contains|all:
    - 'sc '
    - 'config '
    - 'binpath='
  - CommandLine|contains|all:
    - 'sc '
    - 'failure'
    - 'command='
  selection_reg_img:
  - CommandLine|contains|all:
    - 'reg '
    - 'add '
    - 'FailureCommand'
  - CommandLine|contains|all:
    - 'reg '
    - 'add '
    - 'ImagePath'
  selection_reg_ext:
    CommandLine|contains:
    - '.sh'
    - '.exe'
    - '.dll'
    - '.bin$'
    - '.bat'
    - '.cmd'
    - '.js'
    - '.msh$'
    - '.reg$'
    - '.scr'
    - '.ps'
    - '.vb'
    - '.jar'
    - '.pl'
  condition: selection_sc or all of selection_reg_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects attempts to modify existing Windows services, which could allow an attacker to execute arbitrary code when the service is started or fails. The objective likely involves establishing persistence on a compromised system, enabling the adversary to maintain access across reboots or service restarts. This detection aligns with the MITRE ATT&CK tactic of Persistence (TA0040) using the technique T1543.003 (Create or Modify System Process: Windows Service). The primary telemetry sources include Windows process creation events (Security Event ID 4688) and command-line operations via the Service Control Manager (sc.exe) and Registry modifications (Windows Registry logs for keys related to services). A successful modification could allow an attacker to execute malicious payloads, significantly impacting system integrity and confidentiality. However, the detection does NOT confirm that malicious activity is taking place without further context and supporting evidence.

  ### Investigation Steps

  - **Check for relevant process creation events:** Review Security Event ID 4688 logs for command lines containing `sc config`, `sc failure`, or `reg add` related to the service. Validate the command line to identify potential tampering with existing services.

  - **Examine service configuration adjustments:** Retrieve service configuration via PowerShell (`Get-Service`) or Windows Management Instrumentation (WMI) to confirm if the `binpath` or `FailureCommand` has unusual values leading to suspicious executable paths.

  - **Correlate with scheduled tasks:** Cross-reference any discovered service changes with tasks scheduled in Task Scheduler (Event ID 4698) to identify a common thread indicating automation of malicious actions.

  - **Identify legitimate service modification:** Typical administrative changes to services should come from known system administrators or automated maintenance scripts, maintaining original `binpath` settings. Look for changes not aligned with business processes.

  - **Look for high-confidence malicious indicators:** Focus on `binpath` pointing to files in temporary or user profile directories or any command line containing execution artifacts like `.exe`, `.bat`, or `.ps1` patterns.

  ### Prioritization

  Alerts generated by this rule should be treated with a medium priority in an enterprise context. While the impact can be significant, depending on the system's role (e.g., critical infrastructure versus a non-essential client machine), the likelihood of malicious exploitation is moderate. Similar methods are commonly used for persistence in various attacks, indicating a heightened need for inspection.

  ### Blind Spots and Assumptions

  Detection may have limitations if certain logs are not captured or if attackers utilize legitimate tools for abuse. Essential telemetry includes Event IDs for process creations and Registry modifications tailored to service configuration. Legitimate activities such as administrative service modifications can produce false positives, potentially leading to misinterpretation of detected events. A companion detection rule could focus on changes in scheduled tasks (T1053) to further capture broader persistence techniques used in conjunction with service tampering.

