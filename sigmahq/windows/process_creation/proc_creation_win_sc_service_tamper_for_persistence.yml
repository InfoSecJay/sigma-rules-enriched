title: Potential Persistence Attempt Via Existing Service Tampering
id: 38879043-7e1e-47a9-8d46-6bec88e201df
status: test
description: Detects the modification of an existing service in order to execute
  an arbitrary payload when the service is started or killed as a potential 
  method for persistence.
references:
- https://pentestlab.blog/2020/01/22/persistence-modify-existing-service/
author: Sreeman
date: 2020-09-29
modified: 2023-02-04
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1543.003
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
  - CommandLine|contains|all:
    - 'sc '
    - 'config '
    - 'binpath='
  - CommandLine|contains|all:
    - 'sc '
    - 'failure'
    - 'command='
  selection_reg_img:
  - CommandLine|contains|all:
    - 'reg '
    - 'add '
    - 'FailureCommand'
  - CommandLine|contains|all:
    - 'reg '
    - 'add '
    - 'ImagePath'
  selection_reg_ext:
    CommandLine|contains:
    - '.sh'
    - '.exe'
    - '.dll'
    - '.bin$'
    - '.bat'
    - '.cmd'
    - '.js'
    - '.msh$'
    - '.reg$'
    - '.scr'
    - '.ps'
    - '.vb'
    - '.jar'
    - '.pl'
  condition: selection_sc or all of selection_reg_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies attempts to modify existing Windows services to execute arbitrary payloads upon service start or failure, signaling a potential persistence mechanism. The attacker may be trying to gain and maintain access to a system by injecting malicious commands into the service configuration. This behavior is linked to the MITRE ATT&CK tactics of Persistence (T1543.003) and Execution (T1574.011).

  The primary telemetry source for this rule involves process creation logs, specifically those capturing command-line arguments used in service configuration modifications, such as `sc` or `reg add`. If malicious, the security impact could be severe, potentially allowing an attacker to maintain control over a compromised system persistently. However, this detection does NOT confirm that the execution of a payload has occurred or that malicious activity is confirmed without further context.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 entries associated with `sc config` or `reg add`. Look for command lines containing suspicious or uncommon executable paths that differ from legitimate service accounts.

  - **Identify legitimate service modifications:** Determine if the changes were related to known administrative activities such as service updates or maintenance. A typical benign command might involve Windows services with paths pointing to system executables (e.g., `C:\Windows\System32\svchost.exe`).

  - **Examine command line arguments for evasion:** Look for unusual file extensions or paths in command lines, especially those ending in `.exe`, `.dll`, `.bat`, or `.ps`. Pay special attention to paths in the `binpath=` and `FailureCommand=` arguments for known malicious signatures.

  - **Cross-reference user account modifications:** Investigate the user who executed these commands. Unexpected administrative commands from non-privileged accounts or unexpected times could indicate malicious intent. Check relevant logs for user role and recent access patterns.

  - **Validate service configuration against known baselines:** Use system baseline information to compare existing service configurations against expected values. Any deviations may warrant further monitoring or investigation.

  ### Prioritization

  This alert should be considered medium severity. The affected system’s impact depends on its role in the environment (e.g., critical infrastructure may warrant high prioritization). The likelihood of malicious abuse is notable as this technique is commonly employed in persistence strategies by threat actors.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through legitimate administrative tools and scripting. Ensuring adequate logging configuration is critical; without Sysmon or sufficient security auditing, detection efficacy may drop. Legitimate activities such as administrative service updates or configuration changes may trigger this alert. A related detection to consider is monitoring for new service installations (T1543.004), which might complement this rule and enhance overall coverage against persistence attempts.

