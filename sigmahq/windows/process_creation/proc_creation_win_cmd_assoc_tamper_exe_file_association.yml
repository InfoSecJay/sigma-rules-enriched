detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
    CommandLine|contains|all:
    - 'assoc '
    - 'exefile'
  filter:
    CommandLine|contains: '.exe=exefile'
  condition: all of selection_* and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to change the default file association for any file extension to an executable, specifically targeting changes made using the `assoc` command. The likely attacker objective is to modify file associations in order to execute malicious payloads when a user opens files of a certain type, which may lead to privilege escalation and persistence on the system. This behavior maps to the MITRE ATT&CK technique for persistence and privilege escalation: **T1546.001 - Event Triggered Execution: User Execution**.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide information about the command line invoked. If successful, this behavior can facilitate malicious actions such as executing malware disguised as legitimate files. It is important to note that this detection alone does not confirm malicious intent as legitimate applications can change file associations as part of their functionality.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for process creation entries involving `cmd.exe` where the `CommandLine` contains `assoc` and `.exe=exefile`. Look for timestamps aligning with the alert generation.

  - **Identify Malicious Command Patterns:** Focus on finding `CommandLine` entries that explicitly include `assoc` with parameters that change associations to `.exe`, indicating potential malicious intent. For instance, a command line such as `assoc .txt=exefile` warrants further scrutiny.

  - **Validate User Context:** Determine the user account under which the command was executed. If executed by non-privileged or suspicious user accounts at unusual hours, this may indicate illegitimate activity.

  - **Assess Legitimate Activity:** Record typical applications in the environment that legitimately alter file associations and compare their command lines to those in the logs. Example: Antivirus or system maintenance applications which might use similar commands for valid reasons.

  - **Check for Related Artifacts:** Search for attempted or successful changes to the Windows Registry related to file associations, particularly under `HKEY_CLASSES_ROOT`. Generate logs for any modifications (e.g., values modified in `.ext` registry keys).

  - **Investigate Further Correlation:** Look for other related alerts or processes triggered around the same time as this rule detection. Events tied to lateral movement or execution of known malware should be explored in tandem, utilizing companion detections like file creation and execution logs.

  ### Prioritization

  This alert should be treated with high severity as it targets a crucial change in the Windows environment that could lead to an executable hijacking user files. Given that changing file associations can be a tactic employed by many malware families, the likelihood of this behavior being weaponized is significant, especially if combined with other suspicious activity.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion tactics where attackers might use different commands or obfuscate execution methods to alter file associations. Ensure complete logging configurations are in place for process creation events; missing event logs may lead to undetected malicious behavior. Additionally, legitimate administrators performing maintenance or updates might trigger this alert; hence careful review against known workflows is essential. Companion detections focused on process injection or unusual script execution can enhance the overall detection capabilities in such scenarios.

