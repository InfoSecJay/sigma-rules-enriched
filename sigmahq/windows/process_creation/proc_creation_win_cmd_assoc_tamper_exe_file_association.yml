detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
    CommandLine|contains|all:
    - 'assoc '
    - 'exefile'
  filter:
    CommandLine|contains: '.exe=exefile'
  condition: all of selection_* and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the modification of file associations in Windows when a program changes the default file handler to an executable. The change occurs through a command-line interface, typically using the `assoc` command, which can be leveraged by attackers to ensure malicious executables are run whenever a specific file type is opened. This behavior can be indicative of persistence techniques used by threat actors aiming to maintain access or escalate privileges within the compromised system.

  The likely attacker objective with this behavior is to disguise malicious executables as harmless file types, which can lead to an increase in the attack vector's chances of execution. Attackers commonly employ this tactic during post-exploitation phases to ensure their malware remains persistent, while also evading detection by users or security tools.

  Relevant MITRE ATT&CK tactics/techniques include:
  - **Persistence (T1546.001)**: Changing file associations allows malware to persist on a system.
  - **Privilege Escalation (T1068)**: Certain file associations may enable escalated access to sensitive resources if improperly configured.

  The primary data sources to monitor for this detection include process creation logs that will capture when executables are run with command-line parameters indicating the modification of file associations.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs for instances where `cmd.exe` is executed with the `assoc` command and modifiers indicating file association changes.
  - **Inspect Command-Line Parameters**: Pay close attention to the command-line parameters passed to `cmd.exe`, looking specifically for the presence of `assoc` and file extensions leading to executables (`.exe=exefile`).
  - **Correlate with Registry Access Logs**: If available, correlate findings with Windows Registry access logs to identify any written changes to file associations, which should ideally be monitored for unusual activities.
  - **Assess Other Persistence Mechanisms**: Look for other associated signs of persistence, such as startup folder configurations and scheduled tasks that might indicate an attacker is attempting to maintain long-term access.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of a malicious actor gaining persistence on a compromised host, leveraging modified file associations to execute arbitrary code at user interaction points.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logging for certain user actions or PowerShell executions is not adequately configured. Additionally, the detection logic assumes that all instances where `assoc` is used with altered file associations are malicious; however, legitimate administrative tasks could also trigger this. Proper logging of both process creation and registry modifications is essential for this detection to function effectively.

