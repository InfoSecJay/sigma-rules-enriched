note: |
  ### Technical Context

  This Sigma rule detects the usage of the `curl` command-line tool to upload files to known file-sharing domains, which may indicate potential data exfiltration attempts by malicious actors. The likely objective of an attacker using this technique is to transfer sensitive data out of the organization without detection. This behavior aligns with the MITRE ATT&CK tactic **Exfiltration** (TA0010) and the technique **Exfiltration Over Web Services** (T1567.002).

  The primary telemetry sources include process creation logs from Windows (Event ID 4688 or Sysmon Event ID 1) that specifically capture command-line arguments and process image names. If malicious, these actions can lead to unauthorized data loss and compliance violations. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate uploads by approved personnel or automated processes could also trigger the alerts.

  ### Investigation Steps

  - **Review process creation events for suspicious `curl` commands:** Check Windows Event ID 4688 or Sysmon Event ID 1 for new process creation events where the Image ends with `curl.exe` and matches the criteria for command-line arguments indicative of file uploads.

  - **Analyze command-line arguments:** Identify instances of command-line arguments such as `--form`, `--upload-file`, or `--data` in parameters. If found with known file-sharing domains like `wetransfer.com` or `transfer.sh`, further investigation is warranted.

  - **Identify expected legitimate behavior:** Look for documented cases of `curl` usage by developers or administrators that are approved for file uploads. Compare such legitimate usages against the alert to determine context.

  - **Verify correlated logs against user behavior:** Cross-reference the implicated process creation event with user activity logs. Investigate the user identity, their role, and past behavior related to file uploads to assess whether the action is typical for them.

  - **Check for high-confidence malicious indicators:** Look for cases where the command line includes excessive retries or redirections, notably flags like `-sT`, indicating attempts to bypass restrictions in unusual ways, suggesting malicious intent.

  - **Confirm potential data exfiltration:** Review outbound network traffic logs (NetFlow, firewall logs) to confirm successful connections to the flagged file-sharing domains following the identified `curl` events. Look for large data transfers that match the timing of the flagged uploads.

  ### Prioritization

  The alert severity is high due to the potential impact of sensitive data being exfiltrated from critical systems. The likelihood of malicious activity is plausible, given common patterns of exfiltration being weaponized through file-sharing services. Organizations must prioritize these alerts for immediate investigation to avoid data breaches.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate activities, such as administrators uploading files to share for collaboration, can trigger the alert. There may also be evasion techniques such as using tunneling software to obscure the upload destination. Continuous logging from endpoint processes (Sysmon and Windows Security logs) and proper configuration are necessary for reliable detection. Companion detections to consider include suspicious network connection alerts to external services during off-hours or non-standard usage patterns.

