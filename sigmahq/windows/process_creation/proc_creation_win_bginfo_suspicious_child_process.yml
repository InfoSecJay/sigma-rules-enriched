note: |
  ### Technical Context

  This Sigma rule detects the spawning of certain child processes (e.g., `calc.exe`, `cmd.exe`, `powershell.exe`) by `BgInfo.exe`, which may indicate misuse of the BgInfo binary to execute potentially malicious scripts or commands. The primary objective of an attacker using this technique is to leverage a commonly trusted process to execute code that is hidden from standard monitoring, allowing them to perform actions like downloading payloads or executing arbitrary commands. This behavior aligns with the MITRE ATT&CK tactics of Execution (T1203) and Defense Evasion (T1218).

  The detection relies on Windows process creation logs, specifically looking for parent-child relationships (Event ID 4688). If this behavior is malicious, it can lead to systems being compromised, potentially giving attackers unauthorized access to sensitive data or control over the machine. However, this detection does NOT confirm that the activity is malicious by itself; further investigation is necessary to establish intent.

  ### Investigation Steps

  - **Verify parent-child process relationships**: Check the process creation logs (Event ID 4688) for instances where `BgInfo.exe` (found in `C:\Program Files` or `C:\Windows`) spawned processes like `powershell.exe` or `cmd.exe`. Ensure that the process originates from a legitimate execution path.

  - **Assess process creation arguments**: Review the command line arguments used by the child processes (found in Event ID 4688). Pay attention to unusual flags or scripts that are not typically associated with benign executions of `BgInfo.exe`.

  - **Identify execution context and timing**: Look for the timestamps associated with the event and the environment in which it occurred. Legitimate runs of `BgInfo.exe` typically do not spawn these child processes, especially in a short time frame upon system startup.

  - **Search for known malicious indicators**: Use threat intelligence to check for reported hashes or indicators associated with `BgInfo.exe` misuse or any scripts launched by child processes that may connect to known malicious IPs or domains.

  - **Cross-reference with known benign activity**: Review historical logs to capture the normal behavior of `BgInfo.exe` in the environment. Observe legitimate child processes like `notepad.exe` when `BgInfo.exe` runs as part of system maintenance tasks.

  - **Examine logs for lateral movement indications**: Check for outbound network connections made by the child processes to suspicious destinations, especially if they are spawned from unusual locations (`AppData\`, `Temp\`). Such connections could indicate command and control (C2) activities.

  ### Prioritization

  This alert should be considered high priority in an enterprise context due to the potential impact of the affected systems; if compromised, an attacker could gain elevated access and conduct further malicious activities. The use of trusted binaries like `BgInfo.exe` to disguise malicious actions is a recognized technique among adversaries, making this behavior commonly weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that legitimate administrative scripts could also invoke child processes from `BgInfo.exe`, potentially leading to false positives. Reliable detection requires comprehensive logging of process creations (Event ID 4688) and could benefit from monitoring changes in system directories where `BgInfo.exe` is allowed to execute. Related detections, such as unusual PowerShell activity (T1059.001), enhance coverage against this attack vector.

