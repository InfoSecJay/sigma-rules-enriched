note: |
  ### Technical Context
  This detection rule is designed to identify potentially malicious behavior associated with the execution of child processes spawned by the legitimate Windows utility, BgInfo.exe. BgInfo is commonly used to display system information on the desktop, but it has been noted that attackers may abuse this binary to execute other malicious scripts or commands. The rule focuses on detecting instances where BgInfo.exe is used as a parent process for suspicious child processes, which might indicate exploitation or evasion tactics.

  The threat scenario often involves adversaries leveraging BgInfo.exe to execute tools such as PowerShell, Windows Script Host (cscript or wscript), and command line utilities like cmd.exe. This behavior may serve various purposes, including establishing persistence, initiating lateral movement, or bypassing application whitelisting mechanisms.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002)**: Leveraging legitimate tools for malicious execution.
  - **Command and Scripting Interpreter: Windows Command Shell (T1059.003)**: Utilizing cmd.exe to execute commands.
  - **Command and Scripting Interpreter: PowerShell (T1059.001)**: Running PowerShell scripts from BgInfo.
  - **Defense Evasion (TA0005)**: Enabling attackers to conceal their activities and evade detection.
  - **Signed Binary Proxy Execution (T1218)**: Utilizing signed executables to run malicious payloads without detection.

  Primary data sources for this detection include Windows process creation event logs, specifically the command line arguments and parent-child process relationships, which capture the execution context of BgInfo.exe and any child processes it launches.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation event logs to identify instances of BgInfo.exe launching any suspicious child processes. Look for unusual command-line arguments or execution paths associated with these processes.

  - **Identify Parent-Child Relationships**: Investigate the parent-child relationships in the process tree to confirm that BgInfo.exe is indeed the parent of the suspicious child processes. This can provide context on how the initial execution occurred.

  - **Examine File Locations**: Check the file paths of any launched child processes for anomalies, focusing on those originating from common user directories (e.g., AppData, Temp) or non-standard locations that may indicate malicious activity.

  - **Conduct Threat Analysis on Child Processes**: For any detected child processes, assess their reputation and behavior based on known indicators of compromise. Utilize threat intelligence sources to establish whether these processes are linked to malicious activity.

  ### Prioritization
  The alert's severity is set to high due to the potential for significant impact on the security posture of the organization. The use of a trusted system utility like BgInfo to execute potentially harmful commands suggests a serious risk of compromise that requires immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule primarily focuses on the behavior associated with BgInfo.exe and its child processes, which may lead to gaps in detection if attackers use alternative approved tools or methods for command execution. The assumption is that BgInfo.exe is being misused in a manner consistent with observed attacker techniques, and thus any legitimate use of BgInfo could potentially trigger false positives. For this alert to function correctly, it is crucial that detailed process creation logs are maintained and accessible, capturing all relevant process interactions and command-line contexts.

