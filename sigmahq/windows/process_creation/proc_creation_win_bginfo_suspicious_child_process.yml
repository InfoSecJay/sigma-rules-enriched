note: |
  ### Technical Context

  This detection rule identifies suspicious child processes spawned from `BgInfo.exe`, a legitimate Microsoft utility. Attackers may abuse `BgInfo.exe` to execute malicious payloads without raising suspicion, leveraging it as a proxy for executing other binaries such as PowerShell, command prompt, or scripting engines, aiming to execute further malicious actions on a compromised system. This behavior aligns with the MITRE ATT&CK technique T1059.005 (Command and Scripting Interpreter: Visual Basic) and T1218 (Signed Binary Proxy Execution).

  The primary telemetry sources for this detection are process creation logs, specifically Windows Event ID 4688, as well as Sysmon Event ID 1. If executed as intended by an attacker, this could lead to unauthorized remote access or data exfiltration, significantly impacting system integrity. It is important to note that this detection alone does not confirm an infection or compromise—it indicates potentially inappropriate use of a legitimate binary.

  ### Investigation Steps

  - **Review process creation logs:** Inspect Windows Event ID 4688 or Sysmon Event ID 1 for instances where `BgInfo.exe` is the parent process. Focus on records showing child processes such as `powershell.exe` or `cmd.exe`.

  - **Identify expected legitimate behavior:** Validate if `BgInfo.exe` is running with expected command-line arguments or in recognized directories (e.g., `C:\Program Files\`) on assets where it is a common utility.

  - **Check for malicious indicators:** Look for child process creation from `BgInfo.exe` that involves unexpected paths, such as those under `AppData\Local\`, `Temp\`, or `PerfLogs\`. Any execution of `wscript.exe` or `mshta.exe` as child processes is particularly concerning.

  - **Correlate with other telemetry:** Review network logs for unusual outbound connections or data exfiltration attempts shortly after the process creation alerts. Investigate for Event ID 5156 firewall logs indicating unexpected network traffic from these processes.

  - **Examine the execution context:** Confirm the user account running `BgInfo.exe`, looking for unauthorized or non-standard user accounts which may indicate misuse of legitimate tools.

  ### Prioritization

  This alert should be considered high severity as it indicates possible exploitation of a legitimate system utility to execute unauthorized processes, which is a common tactic used by adversaries. The likelihood of abuse is significant, especially in environments where users may inadvertently execute malicious scripts or binaries due to social engineering or phishing attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if `BgInfo.exe` is whitelisted within application control solutions, as its usage might go unmonitored. This rule may produce false positives during legitimate administrative activities, especially in environments where `BgInfo` is commonly used for host information display. A related detection to enhance coverage could involve monitoring for uncommon parent-child process relationships across other legitimate binaries that could also be exploited for similar proxy execution.

