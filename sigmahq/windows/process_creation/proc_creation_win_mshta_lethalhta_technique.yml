note: |
  ### Technical Context

  This Sigma rule detects when the `mshta.exe` process is spawned by a parent process `svchost.exe`, which is indicative of potential execution of the LethalHTA technique. The likely attacker objective involves executing HTML Application (HTA) files to facilitate malicious actions, including payload delivery or command execution. This behavior correlates with the MITRE ATT&CK technique T1218.005: "Signed Binary Proxy Execution." The primary telemetry source is the process creation event logs, notably Windows Security Event ID 4688 and Sysmon Event ID 1, which capture detailed information on process execution and parent-child relationships.

  If this activity is confirmed as malicious, it could lead to unauthorized execution of malicious payloads or data exfiltration. However, this detection does NOT confirm that an attack is ongoing or that the process in question is malicious on its own, as `mshta.exe` can be used legitimately for benign tasks.

  ### Investigation Steps

  - **Check the parent process details:** Inspect Event ID 4688 for the triggering `svchost.exe` process. Investigate its command line for any unusual arguments that indicate malicious intent, such as references to suspicious URLs or scripts.

  - **Analyze the `mshta.exe` invocation:** Review the process creation logs for Event ID 4688 or Sysmon ID 1 where `mshta.exe` is the image name. Check for common indicators like command line switches or URLs that are associated with known malware campaigns.

  - **Review historical activity:** Look for previous executions of `mshta.exe` on the affected host in the past 24 hours. Legitimate usage typically involves browser-based functionality and should not be invoking scripts from remote sources.

  - **Identify environment context:** Determine if the affected system is a critical asset such as a server hosting sensitive data or a workstation. Higher-value targets increase the urgency of the investigation.

  - **Correlate with network logs:** Analyze outbound network traffic logs (e.g., firewall or proxy logs) for connections initiated by `mshta.exe` during its execution time. Look for indicators like unusual IP addresses or uncommon ports.

  ### Prioritization

  This alert is classified as high severity due to the capability of `mshta.exe` to run arbitrary code, which can lead to significant security breaches if executed by a malicious actor. The behavior is often weaponized in attacks exploiting social engineering or script-based exploits to bypass security controls.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as the use of alternative parent processes or renaming of executables, which could bypass the rule. Reliable detection requires that both process creation and Sysmon configurations are enabled to capture the necessary logs. Additionally, legitimate administrative actions may legitimately trigger this alert, such as system maintenance scripts using HTAs. A companion detection that strengthens coverage would be monitoring for unusual parent-child process relationships involving `cmd.exe` as a potentially orchestrating process.

