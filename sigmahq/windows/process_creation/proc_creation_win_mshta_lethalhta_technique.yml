note: |
  ### Technical Context
  This detection rule is designed to identify instances where the `mshta.exe` process is spawned by `svchost.exe`, a behavior often indicative of the LethalHTA technique. This technique is commonly leveraged by threat actors to execute malware or command and control (C2) operations covertly. Attackers may exploit this method to process HTML applications (HTA) in a stealthy manner, potentially leading to various malicious actions such as data exfiltration or system compromise.

  The overarching objective of using LethalHTA is to bypass traditional security measures and achieve remote access, execute commands, or deploy additional malware. By hijacking a legitimate system process like `svchost.exe`, attackers seek to blend their activities with normal system operations, making detection significantly more challenging.

  Relevant MITRE ATT&CK tactics include:
  - **Tactic:** Defense Evasion
  - **Technique:** T1218.005 (Signed Binary Proxy Execution: mshta.exe)

  Primary data sources for investigation include process creation logs from endpoints, which will provide critical visibility into the spawned processes and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs to identify instances of `mshta.exe` being spawned by `svchost.exe`. Pay close attention to the timestamp and user context under which this activity occurs.

  - **Correlate with Other Activities:** Check for other unusual activity on the host around the same timeframe, such as unexpected outbound network connections or changes in filesystem behavior that may indicate further malicious actions.

  - **Analyze Event Logs on Affected Hosts:** Look for additional related events, such as Windows Event Logs (Event ID 4688 for process creation) that could provide insight into the context of the running processes and identify any further anomalies.

  - **Investigate Network Traffic:** If applicable, examine network logs for suspicious requests associated with the execution of `mshta.exe`, particularly those that may indicate connections to known malicious IPs or domains.

  ### Prioritization
  The alert is classified as high severity due to the high likelihood that this behavior indicates a potential compromise. The use of `mshta.exe` facilitated by `svchost.exe` is a common tactic employed by advanced threat actors, making rapid response crucial to mitigate potential impacts.

  ### Blind Spots and Assumptions
  This detection logic may not catch all malicious activity that hides under other parent processes or utilizes different techniques to launch `mshta.exe`. Additionally, there may be legitimate applications that perform similar operations, leading to potential false positives. The rule assumes that process creation logs are being collected consistently and that no misconfigurations in logging could prevent detection. It's essential to ensure that endpoint logging is enabled and thoroughly configured to enable effective monitoring for this activity.

