  ### Technical Context

  This detection rule identifies the execution of `mshta.exe` spawned by `svchost.exe`, indicative of potential exploitation of the LethalHTA technique. The primary attacker objective is to execute malicious HTA files that can run command code, leading to potential credential theft, data exfiltration, or lateral movement within a network. This behavior correlates with the MITRE ATT&CK tactic of Defense Evasion (ID: T1218.005).

  The primary telemetry source comes from Windows process creation events, particularly focusing on Security Event ID 4688 or Sysmon Event ID 1. If this behavior were malicious, it could lead to significant security breaches, including unauthorized access to sensitive data or systems. However, this detection does NOT confirm that a compromise has occurred; it merely indicates suspicious activity and should be further investigated.

  ### Investigation Steps

  - **Review process lineage:** Check for the parent-child process relationship by examining Security Event ID 4688 or Sysmon Event ID 1. Confirm that `svchost.exe` initiated `mshta.exe.` Benign activity may show `mshta.exe` executed directly or via trusted processes.

  - **Inspect command line arguments:** Analyze the command line used to launch `mshta.exe`. Look for unexpected URLs or file paths that may indicate malicious intent; legitimate instances typically do not use external URLs.

  - **Check for unusual parent processes:** Evaluate the context of `svchost.exe` to determine if it is executing from a standard location and with common parameters. Legitimate system functions often utilize `svchost.exe` but in a clear context without malicious behavior.

  - **Examine endpoint behavior post-execution:** Investigate any outbound connections or file modifications made by `mshta.exe` using network logs or file system monitoring. High-confidence malicious indicators include connections to known malicious IPs or creation of unexpected files.

  - **Validate against threat intelligence:** Cross-reference the behavior with threat intelligence services to identify if the observed activity aligns with known patterns of LethalHTA attacks, which can guide the assessment of risk.

  ### Prioritization

  Given the high impact of potentially compromised systems and the likelihood that adversaries can weaponize LethalHTA techniques, this alert should be treated with high urgency. Systems running `svchost.exe` in a sensitive environment may face severe risks if the behavior is confirmed malicious.

  ### Blind Spots and Assumptions

  Detection may be limited if logging isn’t properly configured to capture all process creation events. Highly privileged processes could evade detection if legitimate system services are misused. Additionally, benign HTA functionality might trigger this alert during regular administrative tasks. Companion detections that could strengthen coverage include monitoring for unusual outbound traffic following `mshta.exe` execution, which often indicates further malicious actions.

