title: Firewall Rule Update Via Netsh.EXE
id: a70dcb37-3bee-453a-99df-d0c683151be6
status: test
description: Detects execution of netsh with the "advfirewall" and the "set" 
  option in order to set new values for properties of a existing rule
references:
- https://ss64.com/nt/netsh.html
author: X__Junior (Nextron Systems)
date: 2023-07-18
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
            # Example 1: netsh advfirewall firewall set rule "group=\"Network Discovery\" " new enable=Yes"
            # Example 2: netsh advfirewall firewall set rule "group=\"File and Printer Sharing\" " new enable=Yes"
    - ' firewall '
    - ' set '
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
- Software installations and removal
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `netsh.exe` tool with commands targeting the Windows Firewall, specifically leveraging the "advfirewall" component to modify existing firewall rules. The likely attacker objective is to enable, disable, or modify firewall rules to facilitate unauthorized access or lateral movement within the network. This action corresponds to the MITRE ATT&CK technique "Modify Existing Authorized Permissions" (T1075).

  The primary telemetry source is process creation events originating from Windows, specifically looking for Event ID 4688, which logs the creation of processes. If the activity is malicious, it may lead to a compromised security posture where an attacker can exploit the modified firewall settings. It is important to note that this detection does NOT confirm malicious intent solely based on the execution of `netsh.exe`; legitimate administration activities could trigger this alert as well.

  ### Investigation Steps

  - **Check Event ID 4688:** Review process creation logs for Event ID 4688 on the affected host. Confirm the command line contains `netsh advfirewall firewall set rule` to validate if it's a potentially malicious alteration of firewall rules. Marking this action with a high concern if the command is used in conjunction with suspicious timing or from an untrusted user account.

  - **Correlate with user account activity:** Inspect associated user accounts involved in command execution. If the command is run by non-administrative users or during non-business hours, flag this as a suspicious indicator.

  - **Analyze Firewall Rule Changes:** Use Windows Firewall logs (Event ID 2004 or related) to check for changes corresponding to the timing of the `netsh` command execution. Compare before-and-after states of affected firewall rules to identify unauthorized modifications.

  - **Identify legitimate activity patterns:** Identify legitimate activities previously executed on the system, including routine administrative tasks, software configuration, or system updates, to establish a baseline. Document expected `netsh` command usage from system administrators.

  - **Evaluate additional logged indicators:** Look for unusual network activity or connections on the host in conjunction with the modified firewall rules. Use Windows Network logs to check for outbound connections that might indicate exploitation.

  ### Prioritization

  This alert has medium severity in an enterprise context as it indicates changes to firewall rules that could potentially expose systems to unauthorized access. The likelihood of malicious abuse is moderate, considering that attackers often manipulate firewall settings to evade detection and should be promptly reviewed to assess any ongoing threats.

  ### Blind Spots and Assumptions

  Detection may be limited if the organization does not log all relevant process creation events or if netsh is invoked in an obfuscated manner. False positives may arise from legitimate administrative tasks or system updates. A related detection to strengthen coverage could be monitoring for "Windows Firewall Rule Deletion" actions, which could complement alerts around rule modifications.

