title: Firewall Rule Update Via Netsh.EXE
id: a70dcb37-3bee-453a-99df-d0c683151be6
status: test
description: Detects execution of netsh with the "advfirewall" and the "set" 
  option in order to set new values for properties of a existing rule
references:
- https://ss64.com/nt/netsh.html
author: X__Junior (Nextron Systems)
date: 2023-07-18
tags:
- attack.defense-impairment
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
            # Example 1: netsh advfirewall firewall set rule "group=\"Network Discovery\" " new enable=Yes"
            # Example 2: netsh advfirewall firewall set rule "group=\"File and Printer Sharing\" " new enable=Yes"
    - ' firewall '
    - ' set '
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
- Software installations and removal
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the Netsh command-line utility with parameters indicating an attempt to modify firewall rules in Windows via "advfirewall" and "set." Such behavior is typically aligned with an attacker’s objective to disable or alter firewall settings, potentially allowing unauthorized access to the system. This activity falls under the MITRE ATT&CK framework's "Defense Evasion" tactic, specifically technique T1562.001 (Impair Defenses: Disable or Modify Tools).

  The primary telemetry source for this detection is Windows process creation logs; specifically, Security Event ID 4688 and Sysmon Event ID 1, which record process execution details and command line arguments. If malicious, this action could lead to heightened risk by allowing threats to bypass security controls. Importantly, this detection does NOT confirm if the action was executed maliciously; legitimate administrative activities could trigger similar alerts.

  ### Investigation Steps

  - **Review process execution details:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for `netsh.exe` execution. Look for command line arguments containing "advfirewall" and "set." If these parameters are present without any indication of legitimate administrative activity, this may suggest malicious intent.

  - **Verify user context:** Identify the user account that executed the command by reviewing the `NewProcessId` and `SubjectUserName` fields in Event ID 4688. Alerts from unfamiliar accounts or those lacking administrative roles may indicate potential compromise.

  - **Check modification timestamps:** Analyze change timestamps for Windows Firewall rules via Event ID 2004 (Windows Firewall log) around the same timeframe as the detected execution. Unplanned or unexpected modifications may indicate malicious activity.

  - **Identify benign administrative activity:** Cross-reference execution with known maintenance windows or scheduled tasks. Administrators executing firewall changes during authorized maintenance should be documented in change management systems for validation.

  - **Examine related event logs:** Investigate if any event logs, such as Event ID 2002 (firewall blocked) or Event ID 2004 (firewall allowed), correlate with the execution of `netsh.exe`. This can provide context on the impact of the rule changes.

  - **Look for other process escalations:** Determine if this execution coincides with other suspicious processes. Cross-check for behavior patterns that may indicate privilege escalation or additional attempts to compromise the system.

  ### Prioritization

  This alert is of medium severity due to the potential impact on the enterprise’s security posture if firewall rules are altered. The likelihood of malicious abuse is moderate, given that attackers often seek to manipulate firewall settings as part of an intrusion strategy. However, legitimate administrative actions are common, which could lead to false positives if not carefully investigated.

  ### Blind Spots and Assumptions

  Evasion techniques include the use of alternate command execution methods (e.g., PowerShell or direct API calls) to alter firewall settings without triggering this detection. Reliable detection requires proper logging configurations for both process creation and Windows Firewall changes. Legitimate administrative activities, especially in environments with frequent firewall rule adjustments, can generate alerts. Companion detections, such as monitoring PowerShell execution (T1059.001), can strengthen coverage against alternative exploitation methods.

