title: Firewall Rule Update Via Netsh.EXE
id: a70dcb37-3bee-453a-99df-d0c683151be6
status: test
description: Detects execution of netsh with the "advfirewall" and the "set" option
  in order to set new values for properties of a existing rule
references:
- https://ss64.com/nt/netsh.html
author: X__Junior (Nextron Systems)
date: 2023-07-18
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\netsh.exe'
  - OriginalFileName: 'netsh.exe'
  selection_cli:
    CommandLine|contains|all:
            # Example 1: netsh advfirewall firewall set rule "group=\"Network Discovery\" " new enable=Yes"
            # Example 2: netsh advfirewall firewall set rule "group=\"File and Printer Sharing\" " new enable=Yes"
    - ' firewall '
    - ' set '
  condition: all of selection_*
falsepositives:
- Legitimate administration activity
- Software installations and removal
level: medium
note: |
  ### Technical Context
  This rule detects instances where the Windows command-line utility `netsh.exe` is used to modify Windows Firewall rules, specifically targeting the "advfirewall" and "set" options. The execution of this command may indicate attempts by malicious actors to alter firewall settings, potentially allowing unauthorized access or data exfiltration. Attackers may leverage this technique as part of a broader strategy to facilitate lateral movement, establish persistence, or evade detection mechanisms.

  In this context, the likely attacker objectives are to disable existing firewall defenses or add new rules that could facilitate further malicious activity within the environment. The expected MITRE ATT&CK tactics involved include **Defense Evasion (T1562)**, which involves altering configurations to circumvent security controls, and possibly **Privilege Escalation (T1068)**, if the command is executed with escalated privileges.

  The primary data sources to substantiate such detections include **process creation logs** that capture command-line arguments, indicating how the Netsh command was executed and for what purpose.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation events to identify instances of `netsh.exe` execution. Pay close attention to the `CommandLine` arguments to confirm any modifications made to the firewall rules.

  - **Correlate with User Activity**: Investigate the user account under which the `netsh.exe` command was executed. Determine if the user has legitimate administrative privileges or if the behavior is anomalous for that account.

  - **Inspect Firewall Configuration**: Check the current Windows Firewall rules and settings using PowerShell or the firewall graphical interface to identify any unauthorized changes that may have been made.

  - **Analyze Event Logs**: Review security event logs for any related system events around the time of `netsh.exe` execution, especially those indicating privilege escalation or unusual account behavior.

  ### Prioritization
  The severity of this alert is medium due to the potential impact on network security; unauthorized alterations to firewall rules could allow attackers to bypass defenses and jeopardize sensitive data. The likelihood of occurrence can be considered moderate, given that legitimate administrative actions may trigger similar behavior.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the missed detection of legitimate administrative activities, which can also utilize `netsh.exe` for valid purposes. The detection logic assumes that the presence of both command-line parameters is indicative of malicious intent rather than standard protocol. Additionally, this alert relies on the availability of process creation logs and their proper configuration to ensure that command-line arguments are captured accurately. If auditing is not enacted, vital context may be lost.

