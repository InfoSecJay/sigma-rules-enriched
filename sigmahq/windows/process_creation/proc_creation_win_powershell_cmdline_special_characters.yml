title: Potential PowerShell Command Line Obfuscation
id: d7bcd677-645d-4691-a8d4-7a5602b780d1
status: test
description: Detects the PowerShell command lines with special characters
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=64
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
  (fp)
date: 2020-10-15
modified: 2024-04-15
tags:
- attack.execution
- attack.defense-evasion
- attack.t1027
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_re:
        # TODO: Optimize for PySIGMA
  - CommandLine|re: '\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+'
  - CommandLine|re: '\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{'
  - CommandLine|re: '\^.*\^.*\^.*\^.*\^'
  - CommandLine|re: '`.*`.*`.*`.*`'
  filter_optional_amazonSSM:
    ParentImage: C:\Program Files\Amazon\SSM\ssm-document-worker.exe
  filter_optional_defender_atp:
    CommandLine|contains:
    - 'new EventSource("Microsoft.Windows.Sense.Client.Management"'
    - 'public static extern bool InstallELAMCertificateInfo(SafeFileHandle handle);'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Amazon SSM Document Worker
- Windows Defender ATP
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects potentially malicious obfuscation attempts within PowerShell command lines, characterized by the presence of special characters used to evade standard detection mechanisms. The likely attacker objective is to execute arbitrary commands on Windows systems while avoiding detection by security monitoring tools. This behavior aligns with the MITRE ATT&CK techniques for Execution (T1059.001: PowerShell) and Defense Evasion (T1027: Obfuscated Files or Information).

  The primary telemetry source for this detection is Windows process creation logs, specifically targeting PowerShell execution (Event ID 4688, Sysmon Event ID 1). If confirmed as malicious, this activity could lead to unauthorized data access, system compromise, or lateral movement within the network. Importantly, this detection alone does not confirm malicious activity; legitimate PowerShell use may involve complex command structures for automation or management tasks.

  ---

  ### Investigation Steps

  - **Review command line arguments**: Analyze PowerShell command lines captured in Event ID 4688 or Sysmon Event ID 1. Look for excessive use of special characters (`+`, `{`, `^`, `` ` ``) which indicates potential evasion tactics. Normal usage typically shows simpler, more straightforward command structures.

  - **Check process parentage**: Determine the parent process of the suspicious PowerShell instances. If the parent process is `C:\Program Files\Amazon\SSM\ssm-document-worker.exe`, it may indicate benign execution related to Amazon SSM.

  - **Validate system context**: Confirm the legitimacy of the system generating the alert by checking asset criticality. If the alert originates from a non-administrative or non-sensitive system, consider the risk level lower.

  - **Assess for known indicators of compromise (IoCs)**: Cross-reference the detected command line against a threat intelligence database to identify any known malicious patterns associated with PowerShell obfuscation.

  - **Examine related security logs**: Investigate Windows Defender logs to see if this PowerShell execution correlates with suspicious actions, such as external network connections or other potentially malicious behaviors.

  ---

  ### Prioritization

  This alert is of high severity because it could indicate an active exploitation attempt on critical systems. The use of obfuscated commands in PowerShell is a common tactic employed by attackers, making it likely that this behavior is malicious in nature.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the normalization and logging configurations of the monitored systems. Legitimate activities, such as automated scripts or maintenance tasks using complex commands in PowerShell, can inadvertently trigger this alert. The presence of monitoring solutions like Amazon SSM or Windows Defender ATP may obscure true malicious behaviors, serving as potential false positives. A related detection worth monitoring is the identification of unusual outbound network connections from the same system to correlate potential command and control activities.

  ---

