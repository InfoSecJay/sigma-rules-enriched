title: Potential PowerShell Command Line Obfuscation
id: d7bcd677-645d-4691-a8d4-7a5602b780d1
status: test
description: Detects the PowerShell command lines with special characters
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=64
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
  (fp)
date: 2020-10-15
modified: 2024-04-15
tags:
- attack.execution
- attack.defense-evasion
- attack.t1027
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_re:
        # TODO: Optimize for PySIGMA
  - CommandLine|re: '\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+'
  - CommandLine|re: '\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{'
  - CommandLine|re: '\^.*\^.*\^.*\^.*\^'
  - CommandLine|re: '`.*`.*`.*`.*`'
  filter_optional_amazonSSM:
    ParentImage: C:\Program Files\Amazon\SSM\ssm-document-worker.exe
  filter_optional_defender_atp:
    CommandLine|contains:
    - 'new EventSource("Microsoft.Windows.Sense.Client.Management"'
    - 'public static extern bool InstallELAMCertificateInfo(SafeFileHandle handle);'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Amazon SSM Document Worker
- Windows Defender ATP
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially obfuscated PowerShell command lines that utilize special characters. Attackers often use obfuscation techniques to evade detection while executing malicious PowerShell scripts. The typical scenario involves threat actors executing scripts that may manipulate system processes, exfiltrate data, or create a foothold within a compromised environment. By detecting these unusual command patterns, security teams can identify potential exploitation or lateral movement occurring via PowerShell.

  The relevant MITRE ATT&CK tactics for this rule include **Execution (TA0002)**, highlighting malicious script execution, and **Defense Evasion (TA0005)**, as attackers attempt to avoid detection through obfuscation techniques. The associated techniques include **T1027 - Obfuscated Files or Information** and **T1059.001 - PowerShell**. Critical data sources for this detection involve **process creation logs** from Windows systems, specifically capturing execution details of PowerShell and pwsh processes.

  ### Investigation Steps
  - **Review Process Creation Events**: Collect logs from process creation events on Windows systems to identify instances of PowerShell or pwsh being executed with obfuscated command lines.
  - **Analyze Command Line Arguments**: Examine the command line arguments associated with the PowerShell processes to identify the use of special characters and patterns that signify potential obfuscation.
  - **Correlate with Normal Behavior**: Compare the detected command lines with baseline data to identify any deviations from expected PowerShell usage that could indicate malicious activity.
  - **Investigate Parent Processes**: Determine the parent processes of the identified PowerShell executions to assess whether they are initiated by legitimate applications or scripts, especially checking for common indicators of compromise (IOCs).

  ### Prioritization
  The severity of this alert is high, as PowerShell is frequently used in enterprises for legitimate administrative tasks, but its exploitation for malicious purposes can lead to serious compromise events, data breaches, or lateral movement within the network.

  ### Blind Spots and Assumptions
  The detection may not cover all obfuscation methods used by advanced attackers, especially if they employ entirely novel techniques outside the defined regex patterns. There is an assumption that process creation logs are being collected and that the PowerShell execution context is preserved. Organizations must ensure that logging is enabled for process creation on Windows systems to facilitate this detection.

