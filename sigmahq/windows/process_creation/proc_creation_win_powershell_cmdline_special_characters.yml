title: Potential PowerShell Command Line Obfuscation
id: d7bcd677-645d-4691-a8d4-7a5602b780d1
status: test
description: Detects the PowerShell command lines with special characters
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=64
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim 
  Shelton (fp)
date: 2020-10-15
modified: 2024-04-15
tags:
- attack.execution
- attack.stealth
- attack.t1027
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_re:
        # TODO: Optimize for PySIGMA
  - CommandLine|re: '\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+'
  - CommandLine|re: '\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{'
  - CommandLine|re: '\^.*\^.*\^.*\^.*\^'
  - CommandLine|re: '`.*`.*`.*`.*`'
  filter_optional_amazonSSM:
    ParentImage: C:\Program Files\Amazon\SSM\ssm-document-worker.exe
  filter_optional_defender_atp:
    CommandLine|contains:
    - 'new EventSource("Microsoft.Windows.Sense.Client.Management"'
    - 'public static extern bool InstallELAMCertificateInfo(SafeFileHandle handle);'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Amazon SSM Document Worker
- Windows Defender ATP
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_cmdline_special_characters/info.yml
note: |
  ### Technical Context

  This rule detects PowerShell command lines utilizing excessive special characters, indicating potential obfuscation often used in malicious scripts. The likely attacker objective is to execute harmful commands while evading detection mechanisms. This behavior falls under the MITRE ATT&CK tactics of Execution (T1203) and Defense Evasion (T1027). The primary telemetry source is Windows process creation logs, specifically looking for event IDs associated with PowerShell (Event ID 4688) that detail command line activities. If malicious, this activity could compromise system integrity, facilitate data exfiltration, or enable lateral movement within the network. Importantly, this detection does NOT confirm malicious intent solely based on the presence of special characters, as it may also occur in legitimate scripts.

  ### Investigation Steps

  - **Verify the parent process: ** Check if the PowerShell process is spawned by known benign processes. For example, the presence of `ssm-document-worker.exe` (Amazon SSM) indicates legitimate activity, while invocation from suspicious processes could signify malicious intent.

  - **Examine the command line: ** Analyze the command line arguments from Security Event ID 4688 for excessive special characters. Look for patterns such as `\+.*\+` or `\{.*\{`, which typically signify obfuscation attempts.

  - **Correlate with threat intelligence: ** Cross-reference the command line with threat intelligence sources to identify known malicious scripts or frameworks that employ similar obfuscation methods.

  - **Review execution outcomes: ** Check for any recent file creation or modification activities (look for FileCreationTime and FileModificationTime fields) that could correlate with the obfuscated command execution. Excessive outgoing network traffic or connections initiated could also indicate evidence of exfiltration or malicious activity.

  - **Identify legitimate use cases: ** Document any legitimate PowerShell scripts executed by systems like automation tools or maintenance scripts to baseline expected command line formats.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive systems. PowerShell is often weaponized in cyberattacks, and obfuscation techniques are commonly employed to evade detection, increasing the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments with legitimate heavy PowerShell usage, such as automation tools, which could trigger false positives. Reliable detection requires comprehensive logging of PowerShell activities, including command execution and associated context. Additionally, related detections, such as monitoring for unusual PowerShell module imports, can enhance threat coverage and response capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
