title: Potential PowerShell Command Line Obfuscation
id: d7bcd677-645d-4691-a8d4-7a5602b780d1
status: test
description: Detects the PowerShell command lines with special characters
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=64
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim 
  Shelton (fp)
date: 2020-10-15
modified: 2024-04-15
tags:
- attack.execution
- attack.defense-evasion
- attack.t1027
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_re:
        # TODO: Optimize for PySIGMA
  - CommandLine|re: '\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+'
  - CommandLine|re: '\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{'
  - CommandLine|re: '\^.*\^.*\^.*\^.*\^'
  - CommandLine|re: '`.*`.*`.*`.*`'
  filter_optional_amazonSSM:
    ParentImage: C:\Program Files\Amazon\SSM\ssm-document-worker.exe
  filter_optional_defender_atp:
    CommandLine|contains:
    - 'new EventSource("Microsoft.Windows.Sense.Client.Management"'
    - 'public static extern bool InstallELAMCertificateInfo(SafeFileHandle handle);'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Amazon SSM Document Worker
- Windows Defender ATP
level: high
note: |
  ### Technical Context

  This Sigma rule detects obfuscated PowerShell command lines that use special characters, which are commonly employed by attackers to evade security detection while executing malicious scripts. The likely objective of such attacker behavior is to compromise systems or exfiltrate data while bypassing security mechanisms. This detection aligns with the MITRE ATT&CK techniques of Execution (T1059.001) and Defense Evasion (T1027). The primary telemetry sources include process creation logs from Windows, specifically monitoring command line arguments, which are essential for identifying potentially malicious activity. A successful malicious execution of obfuscated PowerShell commands could lead to unauthorized access and data compromise. However, this detection alone does not confirm malicious intent; it merely indicates the presence of potentially obfuscated commands.

  ### Investigation Steps

  - **Check for command line arguments**: Review Process Creation events (Windows Security Event ID 4688) for PowerShell (powershell.exe or pwsh.exe) command lines that match the regex patterns in the rule. Look for sequences such as `+...+`, `{...{`, or backticks, indicating potential obfuscation.

  - **Compare against known benign behavior**: Validate that the detected obfuscated command line does not correspond to legitimate system scripts or administrative functions, especially those associated with AWS Systems Manager or Windows Defender ATP.

  - **Identify high-confidence malicious indicators**: Look for command lines that invoke indicators of compromise, such as downloading scripts from known malicious URLs or executing encoded commands (e.g., using base64 encoding in the command line).

  - **Analyze parent-child process relationships**: Check for suspicious parent processes, particularly if the PowerShell execution originates from unusual sources or has no legitimate administrative context. Use Security Event ID 4688 to identify the parent process ID.

  - **Review asset criticality**: Assess the criticality of the affected host. If it’s a server or high-stakes asset, prioritize investigation due to the potential impact of a successful malicious action.

  - **Look for file creation artifacts**: Check for any new or altered files in the system associated with the timestamp of the obfuscated command execution, such as scripts or executables created around the same time, to validate against malicious artifacts.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems. The likelihood of malicious abuse is significant as obfuscation techniques are commonly weaponized in attack scenarios. The presence of obfuscated PowerShell commands could indicate a concerted effort to perform malicious activities, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that benign PowerShell commands may use similar obfuscation techniques during legitimate administration tasks. Ensuring complete coverage requires validation of relevant log sources from all endpoints, including any configurations that may omit logging for PowerShell command execution. Additionally, legitimate activities, such as AWS SSM operations or scripts used for automation, could trigger this alert. Companion detections, such as anomalous access patterns or privilege escalation attempts (e.g., T1068: Exploitation for Client Execution), can strengthen overall protective measures.

