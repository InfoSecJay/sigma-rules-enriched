title: Potential PowerShell Command Line Obfuscation
id: d7bcd677-645d-4691-a8d4-7a5602b780d1
status: test
description: Detects the PowerShell command lines with special characters
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=64
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim 
  Shelton (fp)
date: 2020-10-15
modified: 2024-04-15
tags:
- attack.execution
- attack.stealth
- attack.t1027
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_re:
        # TODO: Optimize for PySIGMA
  - CommandLine|re: '\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+.*\+'
  - CommandLine|re: '\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{.*\{'
  - CommandLine|re: '\^.*\^.*\^.*\^.*\^'
  - CommandLine|re: '`.*`.*`.*`.*`'
  filter_optional_amazonSSM:
    ParentImage: C:\Program Files\Amazon\SSM\ssm-document-worker.exe
  filter_optional_defender_atp:
    CommandLine|contains:
    - 'new EventSource("Microsoft.Windows.Sense.Client.Management"'
    - 'public static extern bool InstallELAMCertificateInfo(SafeFileHandle handle);'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Amazon SSM Document Worker
- Windows Defender ATP
level: high
note: |
  ### Technical Context

  This Sigma rule detects PowerShell command lines that exhibit obfuscation through the use of special characters such as “+”, “{”, “^”, and “`”. The behavior being monitored is indicative of attempts to conceal command execution from security tools and analysts, suggesting a potential malicious objective of executing hidden or harmful scripts. This aligns with the MITRE ATT&CK techniques T1027 (Obfuscated Files or Information) and T1059.001 (Command and Scripting Interpreter: PowerShell).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688, which captures details about processes initiated on the system. If malicious, successful execution of such obfuscated commands could lead to unauthorized actions, data compromise, or lateral movement within the environment. However, it is important to note that this detection does not confirm the execution of malicious actions on its own, as legitimate administrative activities may also use similar command structures.

  ### Investigation Steps

  - **Verify the command line details:** Review Security Event ID 4688 to identify the full command line associated with the detected PowerShell execution. Look for occurrences of special characters as indicated in the detection rule.

  - **Check the process parentage:** Analyze the parent process ID associated with the detected instance. Legitimate PowerShell scripts often originate from trusted applications like `explorer.exe`, while malicious executions may have unusual parent processes.

  - **Evaluate system context:** Determine the role of the system where the alert was triggered (e.g., whether it is a server, workstation, or security appliance) to assess the criticality of potential malicious activity.

  - **Identify known legitimate applications:** Cross-reference the alert with known legitimate applications that may cause similar behaviors, such as Amazon SSM Document Worker or Windows Defender ATP, particularly if the command line includes identifiable elements of those tools.

  - **Review associated network activity:** Examine outbound connections or data transfers from the affected host using firewall logs or network traffic telemetry. Look for unexpected or suspicious destinations correlating with the command execution timeframe.

  - **Search for high-confidence indicators:** Look for the presence of malicious or suspicious executables executed immediately before or after the PowerShell command. Such indicators could include commonly exploited tools or known malware variants.

  ### Prioritization

  The alert severity is high due to the potential impact of PowerShell obfuscation typically associated with malicious activities like lateral movement or data exfiltration. The likelihood of exploitation is significant, as these techniques are commonly used by adversaries, especially in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may miss obfuscated commands with different patterns or formats not covered in the rule. Accurate coverage relies on comprehensive process creation logging configured correctly. Legitimate PowerShell usage by system administrators or automated tasks can also trigger this alert. Companion detections that enhance coverage include monitoring for suspicious PowerShell module import events or analyzing script block logging to track remote script execution.

