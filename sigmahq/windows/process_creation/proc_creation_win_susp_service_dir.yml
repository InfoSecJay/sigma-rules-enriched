logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '\Users\Public\'
    - '\$Recycle.bin'
    - '\Users\All Users\'
    - '\Users\Default\'
    - '\Users\Contacts\'
    - '\Users\Searches\'
    - 'C:\Perflogs\'
    - '\config\systemprofile\'
    - '\Windows\Fonts\'
    - '\Windows\IME\'
    - '\Windows\addins\'
    ParentImage|endswith:
    - '\services.exe'
    - '\svchost.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects Windows services running from suspicious directories that are not typical for service binaries. Such directories may be used by attackers to hide malicious payloads meant to persist on the system while misleading analysts during investigations. The likely attacker objective is to establish persistence and maintain control over the compromised system. Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1202)**.

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event IDs 4688 (process creation) and Sysmon Event ID 1. If malicious, this behavior could lead to unauthorized access, data exfiltration, and lateral movement within the network. It is essential to note that this detection does NOT prove malicious activity without further context and investigation.

  ### Investigation Steps

  - **Review process creation event details:** Examine Event ID 4688 and Sysmon Event ID 1 for any service binaries running from paths such as `C:\Users\Public\`, `$Recycle.bin`, or other specified suspicious directories. Check the `Image` and `ParentImage` fields for indicators of compromise.

  - **Identify parent processes:** Confirm that the suspicious binary was initiated by a known Windows service host (`services.exe` or `svchost.exe`). Legitimate services typically run from `C:\Windows\System32\`. Look for connections to suspicious binaries from legitimate services.

  - **Audit for related services:** Check if multiple services are running from the same suspicious directory. Use PowerShell commands (e.g., `Get-Service`) to list all running services and validate their paths against common paths for legitimate services.

  - **Analyze for persistence mechanisms:** Investigate any scheduled tasks or startup items that may initiate the service. Search for Event ID 4697 (service installation) or scheduled tasks in `C:\Windows\System32\Tasks` related to the suspicious service.

  - **Collect additional forensic artifacts:** Validate if any suspicious files were created or modified around the same time, particularly in the specified directories, using file creation timestamps. Look for any anomalies in file hashes, especially against files expected (whitelisted) on the system.

  ### Prioritization

  This alert is of **high severity** due to the potential for an attacker to establish persistence via a service running from a non-standard directory. The likelihood of malicious abuse is high, as adversaries commonly utilize such tactics to evade detection and maintain access once an initial breach has occurred.

  ### Blind Spots and Assumptions

  There are limitations in detection due to potential evasion techniques such as renaming or obfuscating malicious binaries. Reliable detection relies on thorough logging configurations for process creation, specifically ensuring that Sysmon and Windows event logging are properly set up. Legitimate applications may also run from similar directories, thus introducing noise to the alert. A companion detection to strengthen coverage would include monitoring service installations through Event ID 4697, which could highlight newly created services and assist in validating findings.

