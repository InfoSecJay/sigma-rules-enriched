title: Suspicious Service Binary Directory
id: 883faa95-175a-4e22-8181-e5761aeb373c
status: test
description: Detects a service binary running in a suspicious directory
references:
- https://blog.truesec.com/2021/03/07/exchange-zero-day-proxylogon-and-hafnium/
author: Florian Roth (Nextron Systems)
date: 2021-03-09
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '\Users\Public\'
    - '\$Recycle.bin'
    - '\Users\All Users\'
    - '\Users\Default\'
    - '\Users\Contacts\'
    - '\Users\Searches\'
    - 'C:\Perflogs\'
    - '\config\systemprofile\'
    - '\Windows\Fonts\'
    - '\Windows\IME\'
    - '\Windows\addins\'
    ParentImage|endswith:
    - '\services.exe'
    - '\svchost.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious service binaries that are executed from non-standard directories typically used for legitimate user data. Attackers often exploit these unconventional service paths to evade detection while executing malicious payloads. The presence of a service binary originating from directories such as `C:\Users\Public\` or `C:\$Recycle.bin\` may indicate an unauthorized attempt to maintain persistence, conduct espionage, or facilitate lateral movement within the network.

  The potential threat actors behind this activity are likely to be exploiting vulnerabilities related to service misconfigurations and using techniques associated with the Defense Evasion tactic in the MITRE ATT&CK framework. Specifically, this rule relates to the technique T1202 (Indirect Command Execution), which describes how executables may be placed in deceptive paths to execute without raising immediate suspicion.

  Key data sources for this detection include process creation logs from Windows Event Logging, which record the commencement of new processes along with their associated paths and parent processes. These logs help in assessing whether the origins of service binaries are legitimate.

  ### Investigation Steps
  - **Review Process Creation Logs:** Look into the Windows process creation logs for instances of services executing from the specified suspicious directories. Verify the details of the binaries and their parent processes to confirm potential malicious behavior.
  - **Analyze Service Configurations:** Check the configuration of any services that were found in the suspicious paths. Look for unusual start types or binaries that do not match expected applications, as these may indicate tampering.
  - **Correlate with User Activity:** Investigate user accounts that may have been active around the time of the detection. Determine if there are anomalous logins or account activities that coincide with the execution of the service binary, as this could suggest lateral movement.
  - **Inspect Network Connections:** Monitor outbound connections initiated by the identified services. Suspicious destination IPs or unusual patterns could further indicate malicious activity, especially if the traffic appears to be communicating with known indicators of compromise.

  ### Prioritization
  The alert is categorized as high severity due to the potential for critical compromise within enterprise environments. Malicious services can lead to unauthorized access, data exfiltration, or other detrimental impacts on the organization's operations and security posture.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection logic is the assumption that all malicious activity will necessarily result in services executing from unusual directories. Legitimate applications may also utilize these paths under certain configurations. Additionally, the effectiveness of this detection depends on comprehensive logging configurations for Windows process creation events. If process creation logging is not enabled or properly configured, this detection may fail to trigger, allowing malicious actors to operate undetected.

