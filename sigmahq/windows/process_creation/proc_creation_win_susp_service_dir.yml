title: Suspicious Service Binary Directory
id: 883faa95-175a-4e22-8181-e5761aeb373c
status: test
description: Detects a service binary running in a suspicious directory
references:
- https://blog.truesec.com/2021/03/07/exchange-zero-day-proxylogon-and-hafnium/
author: Florian Roth (Nextron Systems)
date: 2021-03-09
modified: 2022-10-09
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - '\Users\Public\'
    - '\$Recycle.bin'
    - '\Users\All Users\'
    - '\Users\Default\'
    - '\Users\Contacts\'
    - '\Users\Searches\'
    - 'C:\Perflogs\'
    - '\config\systemprofile\'
    - '\Windows\Fonts\'
    - '\Windows\IME\'
    - '\Windows\addins\'
    ParentImage|endswith:
    - '\services.exe'
    - '\svchost.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of service binaries that originate from suspicious directories typically used by attackers to disguise malicious activity. The likely attacker objective is to establish persistence and carry out further actions on the compromised system, such as exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of "Persistence" (T1547) and the technique "Create or Modify System Process" (T1547.001) as attackers may use services to maintain control over a system.

  The primary telemetry sources for this detection include process creation events from Windows Security Event ID 4688, Sysmon Event ID 1, and potentially Windows Event logs capturing service activity. If malicious, executing service binaries from these paths may enable hidden persistence mechanisms while evading traditional security solutions. It is essential to note that this detection does NOT confirm that a system is compromised on its own, as benign services may also execute from these directories.

  ### Investigation Steps

  - **Review Process Creation Events**: Examine Windows Security Event ID 4688 and Sysmon Event ID 1 to identify if the suspicious binary corresponds with legitimate system services or unusual service creation patterns.

  - **Verify Binary Path**: Check the file path of the executing service binary against the suspicious directories listed in the Sigma rule. If found in `C:\Users\Public\` or `C:\$Recycle.bin`, flag it as a potential malicious indicator.

  - **Investigate Parent Process**: Analyze the `ParentImage` field in the relevant telemetry. If `ParentImage` ends with `\services.exe` or `\svchost.exe`, this corroborates potential malicious behavior as legitimate services should not normally spawn processes from these directories.

  - **Identify Normal System Behavior**: Establish a baseline of typical service binaries and their paths within the environment to differentiate legitimate service functionality from potentially malicious behavior.

  - **Cross-reference with Other Alerts**: Check for related detections linked to suspicious process execution or use of unusual paths. This may include alerts for known malware signatures or other indicators of compromise that appear around the same timestamp.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical systems and the likelihood that these directories are being abused for malicious purposes. Malicious binaries in these paths can indicate an attempted compromise, with behavior that is frequently weaponized in real-world attack scenarios.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques such as attackers utilizing encryption or unconventional paths to execute their services. Reliable detection requires thorough logging of process creation events; ensure proper configurations are in place. Additionally, benign system processes might trigger similar alerts, requiring context to differentiate between true positives and false positives. Companion detections involving unusual network traffic or file modifications would strengthen coverage and aid in confirming potential malicious activity.

