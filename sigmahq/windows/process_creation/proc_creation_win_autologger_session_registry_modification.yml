note: |
  ### Technical Context

  This rule detects modifications to Windows EventLog autologger sessions through registry changes via command line tools like `reg.exe`, PowerShell, or its aliases. The likely attacker objective is to disable logging capabilities in order to evade detection mechanisms during system startup or when interacting with sensitive components. This behavior correlates with the MITRE ATT&CK tactic of Defense Evasion and the technique T1562.001, which specifically addresses disabling security features.

  The primary telemetry sources required for this detection are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If this alert is validated as malicious, it could significantly impede the ability to monitor critical system events, leaving a gap in incident response and investigation capabilities. However, this detection alone does not confirm malicious intent without further context or indicators.

  ### Investigation Steps

  - **Review command line arguments:** Analyze Security Event ID 4688 for instances of `reg.exe` or PowerShell that include paths indicating registry modification under `\Control\WMI\Autologger\`. Look for command line parameters like `add`, `Set-ItemProperty`, or `Start` which could indicate an attempt to disable logging.

  - **Check registry key statuses:** Query the registry state for the keys related to autologger sessions, especially `Start` and `Enabled`, to verify if they align with expected values (`0` for enabled applications). This can be checked via `Reg query HKLM\Control\WMI\Autologger\` in a command prompt with administrative rights.

  - **Identify known benign activities:** Compare recent changes to the autologger registry keys against documented or scheduled maintenance activities, updates, or legitimate administrative tasks performed by system administrators, such as regular system tune-ups which might also access the registry but do not disable logging.

  - **Correlate with other security logs:** Cross-reference logs from Security Event ID 5145 (File Share Access) or Sysmon Event ID 10 (ProcessAccess) for any associated access to system logging files around the same time as the registry changes were made. This can help identify potential malicious behavior.

  - **Validate file creation artifacts:** Examine if any suspicious new files or extensions were created around the time of registry modification that could suggest exfiltration or malicious payload delivery. Use Sysmon Event ID 11 for this purpose.

  ### Prioritization

  The severity of this alert is high due to the critical nature of autologger functions in maintaining security visibility during boot processes. Malicious actors often exploit such techniques to suppress logging, which is a common defensive evasion method seen in various attack campaigns.

  ### Blind Spots and Assumptions

  This detection may be circumvented if an adversary uses tools or methods not captured by the specific process monitoring logs or if logging levels are insufficiently coupled with user permissions. Additionally, legitimate administrative activities might inadvertently trigger this alert in well-maintained environments. Related detections, such as registry modifications for other critical system settings, should continuously be monitored to strengthen the overall detection coverage for defense evasion tactics.

