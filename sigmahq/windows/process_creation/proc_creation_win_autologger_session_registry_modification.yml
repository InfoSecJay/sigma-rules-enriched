note: |
  ### Technical Context

  This Sigma rule detects attempts to modify registry settings that control Windows EventLog autologging sessions using tools like `reg.exe` or PowerShell. This behavior is indicative of an attacker aiming to disable event logging, which can hide malicious activities during system startup and operation. The relevant MITRE ATT&CK tactics are Defense Evasion (T1562) and the technique specifically is T1562.002, which pertains to disabling or manipulating logging mechanisms to evade detection. Primary telemetry sources include Windows Security Event logs (Event ID 4657 for registry modification) and Sysmon logs (Event ID 10 for registry operations). If malicious, the impact is significant as it allows adversaries to conduct activities without being logged, making detection and response challenging. It is important to note that detecting this activity does not in itself confirm malicious intent; legitimate administrative changes may also trigger this alert.

  ### Investigation Steps

  - **Check the CommandLine Arguments**: Review logs for processes like `reg.exe` or `powershell.exe` (Security Event ID 4688, Sysmon Event ID 1) with CommandLine containing `add`, `Set-ItemProperty`, or `New-ItemProperty` targeting `\Control\WMI\Autologger\`. Confirm if arguments reference `Start` or `Enabled`.

  - **Identify Registry Modification Details**: Look for Event ID 4657 in Security logs indicating registry changes, specifically targeting keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\WMI\Autologger`. Benign modifications may include legitimate server management tasks.

  - **Corresponding Security Events**: Correlate any identified registry changes with preceding relevant security events, such as process creation and network connections (Event IDs 4688 and 5156) to establish context. Look for unusual communication patterns or indicators of compromise.

  - **Review Host Role and Criticality**: Assess the asset where the modification occurred. If the host is critical (e.g., domain controllers, servers hosting sensitive applications), prioritize the investigation due to higher potential risks.

  - **Validate Original Autologger Properties**: Check the expected settings for autologger sessions. According to the usual configuration, legitimate modifications do not typically alter the `Enabled` status from `1` to `0`.

  ### Prioritization

  The alert is of high severity due to the potential impact of disabling critical logging mechanisms on systems that could store sensitive or crucial operational logs. The likelihood of malicious abuse is significant, as this technique is often weaponized by attackers to obscure their tracks. Immediate investigation is warranted when such behavior is detected.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain event log collections or configurations that are required for holistic visibility. Adversaries may employ techniques such as process masquerading or using alternative methods to modify registry settings to avoid detection. Additionally, legitimate administrative activities (such as system updates or configuration changes) could generate similar alerts. A related detection to consider is monitoring for abnormal command line activities associated with process creation (e.g., unusual PowerShell usage).

