note: |
  ### Technical Context

  This Sigma rule detects PowerShell executions that incorporate suspicious or obfuscated parameter substrings associated with evasion techniques. The likely attacker objective is to hide malicious activities (e.g., executing payloads, lateral movement) and avoid detection by using unconventional command-line arguments. This detection aligns with the MITRE ATT&CK technique `T1059.001: Command and Scripting Interpreter: PowerShell`.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If invoked by an adversary, it could facilitate malicious PowerShell scripts that, among other things, manipulate or interact with the system for nefarious purposes. However, it is essential to note that this detection does NOT confirm that the execution is malicious on its own; further context is required.

  ### Investigation Steps

  - **Examine Process Creation Logs**: Query Security Event ID 4688 or Sysmon Event ID 1 for instances where `Image` ends with 'powershell.exe' or 'pwsh.exe'. Look for command lines containing the suspicious parameters listed in the rule.

  - **Identify Malicious Indicators**: Assess if the command line includes highly obfuscated parameters such as `-NoPro`, `-execution bypass`, or similar substrings. Parameters indicating obfuscation suggest a higher likelihood of malicious intent.

  - **Review User Context**: Check the user account associated with the PowerShell execution. If the process is initiated by a non-administrative account or an unusual user context, this could indicate suspicious activity.

  - **Benchmark Legitimate Activities**: Validate expected PowerShell usage patterns within your environment. If PowerShell is commonly used for automation or administrative tasks, check for documented processes that use benign command-line parameters.

  - **Evaluate Critical Assets**: Determine if the affected system is a critical server or endpoint in your organization. Execute a risk assessment based on asset criticality and the potential impact of a compromise.

  - **Correlate with Other Alerts**: Cross-reference with other detection rules highlighting suspicious file creations or network traffic following this PowerShell execution. Look for related security alerts that could indicate an ongoing campaign or attack.

  ### Prioritization

  This alert should be considered high priority due to the potential impact it may have on critical systems and the likelihood of adversaries leveraging PowerShell for post-exploitation activities. Suspicious PowerShell activity is a common tactic used by threat actors, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as using encoded commands that do not appear in this substring analysis. Ensure that all necessary logging for process creation and scripts execution is configured correctly for reliable detection. Legitimate administrative scripts, particularly during maintenance or deployment, may trigger this alert. A companion detection to consider is monitoring for unusual outbound network connections that could result from subsequent payload execution.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
