detection:
  selection:
    CommandLine|contains|windash: ' -c '
    CommandLine|contains|all:
    - 'curl '
    - 'http'
    - '-o'
    - '&'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify instances where the `curl` command is utilized to download and execute malicious payloads on Windows systems, particularly from command line interfaces. Adversaries often leverage common utilities like `curl`—which is pre-installed on Windows 10 build 17063 and later—to bypass more traditional security measures that may not monitor such benign-looking commands. The primary objective of using `curl` in this context is to retrieve executable content from a remote server and run it, which could lead to the compromise of the system.

  Relevant MITRE ATT&CK tactics and techniques that apply to this rule include:
  - **Command and Control (T1105)**: Adversaries use this technique to transfer files from a remote location to a compromised machine.
  - **Defense Evasion (T1218)**: Utilizing a built-in tool like `curl` to avoid detection by traditional security solutions that may flag less common executables.

  The primary sources of telemetry for this detection include Windows process creation events, which capture command line executions. The presence of specific flags and parameters—such as `-c`, `-o`, and the combination of `curl` with HTTP requests—provides substantial evidence of potentially malicious behavior.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Review process creation logs to identify instances of the `curl` command along with any suspicious parameters, focusing on commands that include remote URLs leading to executable files.

  - **Analyze Command Line Arguments**: Examine the command line arguments for executed processes that incorporate `curl`. Pay particular attention to instances where `-o` flags are used, as these indicate the potential downloading of files.

  - **Review Firewall/Network Traffic Logs**: Conduct an analysis of firewall or network logs to track outgoing connections made by the system during the timeframe of the suspicious `curl` command execution. Look for unusual external IP addresses that may correlate with known malicious servers.

  - **Correlate with Antivirus Logs**: Check antivirus logs or endpoint detection response (EDR) systems for alerts triggered by any files downloaded via `curl`, as EDR solutions might detect behaviors indicative of malware execution.

  ### Prioritization
  This alert is classified as high severity due to the significant risk posed by execution of potentially malicious payloads on enterprise systems. The likelihood of exploitation through commonly available tools like `curl` further heightens the urgency for investigation and response.

  ### Blind Spots and Assumptions
  There are potential blind spots in detection, such as instances where attackers might utilize alternative methods to execute scripts without `curl`, which would not trigger this rule. The detection logic assumes that the command line arguments and the use of specific flags are indicative of malicious intent, which might not account for legitimate administrative use. Additionally, comprehensive process creation logging must be enabled to ensure this alert functions effectively, as lack of detailed command line logging could lead to missed detections.

