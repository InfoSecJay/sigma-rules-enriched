detection:
  selection:
    CommandLine|contains|windash: ' -c '
    CommandLine|contains|all:
    - 'curl '
    - 'http'
    - '-o'
    - '&'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the use of the `curl` command to download files from the internet and execute them on Windows systems. Typically, the attacker aims to deploy a malicious payload by leveraging common command-line tools to evade detection mechanisms. The relevant MITRE ATT&CK techniques include Command-Line Interface (T1059) and Remote File Copy (T1105). The primary telemetry source involved is process creation logs, specifically targeting CommandLine fields within Windows Security Event ID 4688. If exploited, this behavior could lead to system compromise, data exfiltration, or lateral movement within the network. This detection does NOT confirm unauthorized access or malicious intent on its own, as legitimate administrative functions may also use `curl`.

  ### Investigation Steps

  - **Examine the command line arguments:** Validate whether the process creation logs (Event ID 4688) show `curl` commands that include parameters like `-o` and `http`. Look for the presence of `-c` and `&` in command lines, which suggest an attempt to execute additional commands.

  - **Identify execution context:** Cross-reference the process creation logs against user accounts and system roles. Check if `curl` was run by expected users (administrators or systems) versus unusual accounts that may indicate malicious behavior.

  - **Review the source of downloads:** Inspect any URLs listed in the `curl` command. Legitimate activities typically involve standard internal URLs or known software repositories, while suspicious downloads may come from unfamiliar or untrusted domains.

  - **Monitor subsequent actions:** Track any processes spawned after using `curl` that could indicate execution of downloaded payloads (Event ID 4688). Look for signs of unusual or unauthorized scripts running, particularly scripts that start immediately after the `curl` execution.

  - **Verify impacted asset criticality:** Assess the system's role within the enterprise. If the affected system is a critical server or part of the perimeter defenses, prioritize for further investigation due to higher potential impact.

  - **Check for indicator of compromise (IoC):** Investigate whether any files downloaded via `curl` were malicious. Look in the temporary directory for newly created executable or script files, correlating timestamps with the `curl` execution time.

  ### Prioritization

  This alert has a high severity level due to its implication of potential direct exploitation, especially on higher-value assets such as servers or endpoints handling sensitive data. The likelihood of malicious exploitation is elevated, given that `curl` is frequently used by attackers for downloading payloads, a behavior often associated with post-exploitation activities.

  ### Blind Spots and Assumptions

  This detection rule faces limitations in identifying the nature of the downloaded content, which may evade recognition if it’s packaged in a non-executable format (e.g., scripts). It requires accurate process creation logging; if the logging is not enabled or configured properly, coverage is weakened. Additionally, legitimate software updates or downloads may trigger this alert, such as using `curl` to fetch updates from trusted internal repositories. A related detection would involve monitoring unusual PowerShell commands (MITRE T1059.001), as attackers may switch tactics to avoid detection.

