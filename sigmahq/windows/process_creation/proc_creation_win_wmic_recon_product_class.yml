title: Potential Product Class Reconnaissance Via Wmic.EXE
id: e568650b-5dcd-4658-8f34-ded0b1e13992
status: test
description: |
  Detects the execution of WMIC in order to get a list of firewall, antivirus and antispywware products.
  Adversaries often enumerate security products installed on a system to identify security controls and potential ways to evade detection or disable protection mechanisms.
  This information helps them plan their next attack steps and choose appropriate techniques to bypass security measures.
references:
- https://github.com/albertzsigovits/malware-notes/blob/c820c7fea76cf76a861b28ebc77e06100e20ec29/Ransomware/Maze.md
- https://www.hybrid-analysis.com/sample/4be06ecd234e2110bd615649fe4a6fa95403979acf889d7e45a78985eb50acf9?environmentId=1
- https://www.trendmicro.com/en_us/research/25/c/socgholishs-intrusion-techniques-facilitate-distribution-of-rans.html
author: Michael Haag, Florian Roth (Nextron Systems), juju4, oscd.community, Swachchhanda
  Shrawan Poudel (Nextron Systems)
date: 2023-02-14
modified: 2025-03-17
tags:
- attack.execution
- attack.t1047
- attack.discovery
- attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
        # Example: wmic.exe /Namespace:\\root\SecurityCenter2 Path AntiVirusProduct Get displayName /Format:List
    CommandLine|contains:
    - 'AntiVirusProduct'
    - 'AntiSpywareProduct'
    - 'FirewallProduct'
  condition: all of selection_*
falsepositives:
- Legitimate use of wmic.exe for reconnaissance of firewall, antivirus and antispywware
  products.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of `wmic.exe` with commands targeting security product enumerations, specifically for firewall, antivirus, and antispyware settings. The likely attacker objective is to gather intelligence on security controls present on the target system, potentially to devise strategies for avoiding detection or compromising security defenses. This activity corresponds to the MITRE ATT&CK techniques of Discovery (T1082) and Command and Control (T1047). The primary telemetry source is the Windows process creation logs, specifically logs detailing command execution of `wmic.exe`. If confirmed malicious, this behavior could indicate reconnaissance facilitating further attacks. Importantly, this detection does NOT confirm malicious intent on its own, as `wmic.exe` may be used legitimately for administrative purposes.

  ---

  ### Investigation Steps

  - **Check process creation logs for WMIC:** Review Security Event ID 4688 for instances where `wmic.exe` is executed, filtering for the `CommandLine` field containing either “AntiVirusProduct,” “AntiSpywareProduct,” or “FirewallProduct.”

  - **Analyze command-line arguments used:** Validate if the command line indicates an intent to enumerate security products. A benign example would show legitimate administrative queries rather than targeting security products.

  - **Identify the system context:** Confirm the role of the affected host (e.g., workstation vs. server) and assess its criticality. Legitimate use in a non-critical host might be less concerning than in a critical server environment.

  - **Correlate with user activity:** Examine associated logs (e.g., Event ID 4624 with LogonType 2 or 10) to identify the user who executed the command. Check if they have a history of legitimate administrative actions or unusual behavior patterns.

  - **Look for other suspicious processes:** Investigate for unusual parent-child relationships in process creation (e.g., unusual executables calling WMIC) and cross-reference with known malicious activity or behaviors observed in previous incidents.

  - **Assess for additional logging:** Validate that Windows Management Instrumentation (WMI) logs are enabled as WMI could also provide insights into any additional reconnaissance efforts or tool usage typically employed in the attack lifecycle.

  ---

  ### Prioritization

  The alert severity is medium due to the potential implications of gathering information about security controls, which could facilitate a future breach. While the activity itself may not indicate an immediate threat, it aligns with methodologies commonly used by adversaries to exploit vulnerabilities.

  ---

  ### Blind Spots and Assumptions

  Adversaries may employ obfuscation techniques or use alternative command executions to avoid detection, limiting the efficacy of this rule. It is essential to ensure that process creation logs are fully enabled to capture relevant events effectively. Legitimate administrative tools or scripts may also generate similar WMIC usage, exemplifying the need for additional context. A related detection to monitor would be for any use of PowerShell scripts that interact with WMI, as this can enhance coverage of potential malicious behaviors related to reconnaissance activities.

