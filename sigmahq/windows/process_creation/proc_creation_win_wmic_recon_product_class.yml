logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
        # Example: wmic.exe /Namespace:\\root\SecurityCenter2 Path AntiVirusProduct Get displayName /Format:List
    CommandLine|contains:
    - 'AntiVirusProduct'
    - 'AntiSpywareProduct'
    - 'FirewallProduct'
  condition: all of selection_*
falsepositives:
- Legitimate use of wmic.exe for reconnaissance of firewall, antivirus and antispywware
  products.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `wmic.exe`, a command-line utility used for Windows Management Instrumentation (WMI), that conducts reconnaissance on installed security products like firewalls and antivirus/antispyware solutions. Adversaries often utilize this tactic to enumerate the security controls present on a system, enabling them to understand the potential defenses in place. By identifying and analyzing these security mechanisms, attackers can tailor their attack strategies to evade detection or disable protective measures, ultimately facilitating further malicious activities.

  The detection logic maps to several relevant MITRE ATT&CK tactics and techniques, specifically:
  - **T1082: System Information Discovery** - where an attacker gathers information about system settings and configurations.
  - **T1047: Windows Management Instrumentation** - due to the use of WMI for software querying.
  - **T1602: API Spoofing/Bypassing** - as knowledge of security software may assist in bypassing these defenses.

  To effectively capture this activity, primary data sources include process creation events, which log the execution of `wmic.exe`, and command line arguments detailing what specific security products were queried.

  ### Investigation Steps
  - **Examine Process Creation Logs:** Review logs for instances of `wmic.exe` execution. Look for suspicious command line arguments that denote reconnaissance queries for security software.
  - **Analyze Command Line Details:** Scrutinize the command line parameters associated with `wmic.exe`. Specific queries targeting `AntiVirusProduct`, `AntiSpywareProduct`, and `FirewallProduct` highlight potential malicious intent.
  - **Correlate with Security Product Logs:** Cross-reference findings with firewall, antivirus, and other endpoint security solution logs. Check for anomalies or unexpected queries that align with the detected `wmic.exe` instances.
  - **Identify User Context:** Investigate the user context under which the `wmic.exe` commands were executed. Determine if it corresponds to a high-risk account or an unexpected source, warranting further scrutiny.

  ### Prioritization
  This alert is deemed medium severity, as it indicates potential reconnaissance by an adversary seeking to assess security measures. Although it does not confirm an active attack, the intent behind gathering such information poses a significant risk to the organization's overall security posture.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by legitimate administrative use of `wmic.exe`, which can result in false positives if not carefully evaluated. The detection logic assumes that logging for command line arguments is enabled and retained in the process creation logs. Additionally, if adverse actors utilize methods to obfuscate their command line parameters or conduct these queries through scripts, detection efficacy may be reduced. Ensuring comprehensive logging of process execution and command line arguments is crucial for this alert to function effectively.

