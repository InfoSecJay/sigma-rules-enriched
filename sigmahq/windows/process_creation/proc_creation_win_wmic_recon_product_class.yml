logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  selection_cli:
        # Example: wmic.exe /Namespace:\\root\SecurityCenter2 Path AntiVirusProduct Get displayName /Format:List
    CommandLine|contains:
    - 'AntiVirusProduct'
    - 'AntiSpywareProduct'
    - 'FirewallProduct'
  condition: all of selection_*
falsepositives:
- Legitimate use of wmic.exe for reconnaissance of firewall, antivirus and 
  antispywware products.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of WMIC (Windows Management Instrumentation Command-line), specifically when it queries for firewall, antivirus, and antispyware products installed on a system. The likely objective of an attacker using WMIC in this manner is to enumerate installed security controls, potentially identifying weaknesses that could be exploited later in a cyber attack. The relevant MITRE ATT&CK tactic here is "Discovery" (TA0007) and the technique is specifically "System Information Discovery" (T1082).

  Primary telemetry sources include process creation logs, specifically tracking the execution of WMIC (e.g., Windows Event ID 4688 or Sysmon Event ID 1). If this behavior is malicious, it could lead to further exploitation of security controls or facilitate unauthorized access. However, this detection does NOT prove that a successful compromise has occurred on its own; it merely indicates reconnaissance activity.

  ### Investigation Steps

  - **Identify WMIC execution details:** Check for process creation logs (Windows Event ID 4688 or Sysmon Event ID 1) that show execution of WMIC with CommandLine arguments containing 'AntiVirusProduct', 'AntiSpywareProduct', or 'FirewallProduct'.

  - **Assess the context of execution:** Determine the user initiating the WMIC execution. Verify if it comes from an expected account (e.g., IT admin) or a historically suspicious account typically avoided for such tasks.

  - **Correlate with other security controls:** Look for recent usage of legitimate administrative scripts or tasks that may have used WMIC appropriately for system maintenance on the host. Validate if this usage aligns with normal operational patterns.

  - **High-confidence malicious indicators:** Check for any associated Event ID 4697 (Service Installation) or 7045 (Service Added) occurring shortly after WMIC usage, indicating potential follow-up malicious activity (e.g., malicious services installed).

  - **Monitoring asset criticality:** Determine the criticality of the affected asset. Higher priority should be placed on WMIC executions on Domain Controllers or servers with sensitive data compared to standard endpoints.

  - **File creation and exfiltration checks:** Look for unusual file creation events around the same time as WMIC execution. Examine any outbound network connections or file transfer logs that might indicate potential data exfiltration following the reconnaissance.

  ### Prioritization

  Alerts triggered by this detection are classified as medium severity due to the potential security impact if an adversary maps out and exploits vulnerabilities in security products. The likelihood of malicious abuse is moderate, as product detection can be a preliminary step to further exploit a system; this behavior is sometimes weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate users executing WMIC for benign purposes, which can lead to false positives. Organizations must ensure that detailed logging is enabled for process creation to detect WMIC commands reliably. Other legitimate activities that might trigger this alert include administrative troubleshooting or maintenance scripts that access security product information. A related detection is monitoring for "Suspicious WMI Activity" (T1047) to enhance coverage around scripts and commands that utilize WMI methods.

