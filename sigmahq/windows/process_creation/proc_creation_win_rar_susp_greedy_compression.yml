title: Suspicious Greedy Compression Using Rar.EXE
id: afe52666-401e-4a02-b4ff-5d128990b8cb
status: test
description: Detects RAR usage that creates an archive from a suspicious folder, either
  a system folder or one of the folders often used by attackers for staging purposes
references:
- https://decoded.avast.io/martinchlumecky/png-steganography
author: X__Junior (Nextron Systems), Florian Roth (Nextron Systems)
date: 2022-12-15
modified: 2024-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
    # Example : rar.exe a -m5 -r -y -ta20210204000000 -hp1qazxcde32ws -v2560k Asia1Dpt-PC-c.rar c:\\*.doc c:\\*.docx c:\\*.xls c:\\*.xlsx c:\\*.pdf c:\\*.ppt c:\\*.pptx c:\\*.jpg c:\\*.txt >nul
  selection_opt_1:
  - Image|endswith: '\rar.exe'
  - Description: 'Command line RAR'
  selection_opt_2:
    CommandLine|contains:
    - '.exe a '
    - ' a -m'
  selection_cli_flags:
    CommandLine|contains|all:
    - ' -hp'         # password
    - ' -r '         # recursive
  selection_cli_folders:
    CommandLine|contains:
    - ' ?:\\\*.'
    - ' ?:\\\\\*.'
    - ' ?:\$Recycle.bin\'
    - ' ?:\PerfLogs\'
    - ' ?:\Temp'
    - ' ?:\Users\Public\'
    - ' ?:\Windows\'
    - ' %public%'
  condition: 1 of selection_opt_* and all of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the execution of `rar.exe` to create archives from suspicious system directories or folders commonly used for staging malicious payloads. The likely attacker objective is to obfuscate malicious files or exfiltrate data by compressing it into an archive format that can be easily transported. This behavior aligns with the MITRE ATT&CK technique for command-and-control (T1059 - Command-Line Interface), as attackers often use command-line tools for malicious activities.

  Primary telemetry sources include Windows process creation logs, specifically looking at fields such as `Image` and `CommandLine`. If malicious, this behavior could enable an attacker to covertly access sensitive data or establish persistence. Importantly, this detection does NOT confirm malicious intent on its own; legitimate users could also use these commands for benign purposes.

  ---

  ### Investigation Steps

  - **Review Process Creation Events:** Search for Windows Security Event ID 4688 where `Image` ends with `\rar.exe`. Verify if the process is executed from a known system path or a suspicious location.

  - **Examine Command Line Arguments:** Inspect the `CommandLine` field for indicators such as `-hp` (indicating password protection) and `-r` (indicating recursive operation). Malicious activity will likely use both flags, while benign uses may not.

  - **Identify Suspicious Source Paths:** Check if the archives are being created from directories like `$Recycle.bin\`, `PerfLogs\`, `Temp`, or `Windows\`. Legitimate applications generally use specific, non-system directories for archiving.

  - **Look for High-Confidence Malicious Indicators:** Review archived file patterns—files created with the extensions `.exe`, `.dll`, or `.bat` from the targeted suspicious folders can be strong indicators of malicious behavior. Compare the timestamps of the archive creation with prior known malicious activities.

  - **Correlation with User Activity:** Cross-reference user accounts associated with the process. Legitimate users may typically execute `rar.exe` for personal file compression; however, analyze if the user has execution history in high-privileged system directories, suggesting circumstantial abuse.

  - **Validate Exfiltration Artifacts:** Check for recent file modifications or creations in the directories involved. Use monitoring tools to track any potentially unwanted archiving of sensitive data.

  ---

  ### Prioritization

  The alert severity is high due to the potential impact on sensitive systems and the likelihood of misuse by adversaries. Given the common use of `rar.exe` in data obfuscation and exfiltration scenarios, this behavior can be weaponized by attackers, necessitating immediate triage.

  ---

  ### Blind Spots and Assumptions

  Detecting this behavior may be limited by configurations that do not log command-line arguments or process creation events consistently. Legitimate usage of `rar.exe` for file archiving within normal operational procedures may trigger this alert. A related detection to consider is monitoring for unusual archival patterns of large file sizes from the same suspicious directories for heightened visibility.

