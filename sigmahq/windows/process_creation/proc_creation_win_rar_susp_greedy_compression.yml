title: Suspicious Greedy Compression Using Rar.EXE
id: afe52666-401e-4a02-b4ff-5d128990b8cb
status: test
description: Detects RAR usage that creates an archive from a suspicious folder,
  either a system folder or one of the folders often used by attackers for 
  staging purposes
references:
- https://decoded.avast.io/martinchlumecky/png-steganography
author: X__Junior (Nextron Systems), Florian Roth (Nextron Systems)
date: 2022-12-15
modified: 2024-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
    # Example : rar.exe a -m5 -r -y -ta20210204000000 -hp1qazxcde32ws -v2560k Asia1Dpt-PC-c.rar c:\\*.doc c:\\*.docx c:\\*.xls c:\\*.xlsx c:\\*.pdf c:\\*.ppt c:\\*.pptx c:\\*.jpg c:\\*.txt >nul
  selection_opt_1:
  - Image|endswith: '\rar.exe'
  - Description: 'Command line RAR'
  selection_opt_2:
    CommandLine|contains:
    - '.exe a '
    - ' a -m'
  selection_cli_flags:
    CommandLine|contains|all:
    - ' -hp'         # password
    - ' -r '         # recursive
  selection_cli_folders:
    CommandLine|contains:
    - ' ?:\\\*.'
    - ' ?:\\\\\*.'
    - ' ?:\$Recycle.bin\'
    - ' ?:\PerfLogs\'
    - ' ?:\Temp'
    - ' ?:\Users\Public\'
    - ' ?:\Windows\'
    - ' %public%'
  condition: 1 of selection_opt_* and all of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of RAR.EXE to create archives from suspicious directories, specifically targeting system folders or known staging areas used by attackers. The likely attacker objective is data exfiltration or obfuscating files to bypass security mechanisms before transferring data. The relevant MITRE ATT&CK tactics include Execution (TA0002) and Command and Scripting Interpreter (T1059). Primary telemetry sources include Windows process creation logs, specifically looking at Event ID 4688 for process start events and the corresponding command line arguments. If malicious, this behavior can lead to data exfiltration or obstruction of incident response efforts. This detection does NOT confirm malicious intent on its own; further context and analysis are required.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 for any RAR.EXE instances. Investigate the command line arguments associated with the process, focusing on keys such as `-hp` (password) and `-r` (recursive).

  - **Identify Suspicious Folders:** Confirm whether the command references typical attacker staging folders, such as `$Recycle.bin`, `PerfLogs`, `Temp`, or any other system directories that are unusual for legitimate RAR usage.

  - **Look for High-Confidence Indicators:** An instance of RAR.EXE executed with `-hp` alongside suspicious folder parameters strongly indicates potential malicious activity. Such behavior deviates from normal use cases for the tool.

  - **Validate Legitimate Usage:** Compare the observed execution against known legitimate uses of RAR.EXE in your environment. Authorized or expected behavioral patterns often include archiving user documents from known user folders rather than system or temporary folders.

  - **Cross-reference with Data Transport Logs:** If available, check logs for File Transfer Protocol (FTP), HTTP, or other data exfiltration methods immediately following the RAR.EXE command execution. Look for signs of compressed file transfers.

  ### Prioritization

  This alert carries high severity as it indicates potential data staging for exfiltration from potentially critical systems. The behavior detected is commonly weaponized by attackers wanting to obscure file content before transferring it, increasing the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection limitations include evasion by using legitimate software or command-line options that do not appear suspicious. Reliant on accurate logging of process creation events, the SOC must ensure that logs are correctly configured and monitored. Legitimate administrative tasks may trigger the alert, especially in enterprise environments with varied software use. Related detections include monitoring for file transfer activities or unusual network traffic patterns to further contextualize the alert.

