title: Suspicious Greedy Compression Using Rar.EXE
id: afe52666-401e-4a02-b4ff-5d128990b8cb
status: test
description: Detects RAR usage that creates an archive from a suspicious folder, either
  a system folder or one of the folders often used by attackers for staging purposes
references:
- https://decoded.avast.io/martinchlumecky/png-steganography
author: X__Junior (Nextron Systems), Florian Roth (Nextron Systems)
date: 2022-12-15
modified: 2024-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
    # Example : rar.exe a -m5 -r -y -ta20210204000000 -hp1qazxcde32ws -v2560k Asia1Dpt-PC-c.rar c:\\*.doc c:\\*.docx c:\\*.xls c:\\*.xlsx c:\\*.pdf c:\\*.ppt c:\\*.pptx c:\\*.jpg c:\\*.txt >nul
  selection_opt_1:
  - Image|endswith: '\rar.exe'
  - Description: 'Command line RAR'
  selection_opt_2:
    CommandLine|contains:
    - '.exe a '
    - ' a -m'
  selection_cli_flags:
    CommandLine|contains|all:
    - ' -hp'         # password
    - ' -r '         # recursive
  selection_cli_folders:
    CommandLine|contains:
    - ' ?:\\\*.'
    - ' ?:\\\\\*.'
    - ' ?:\$Recycle.bin\'
    - ' ?:\PerfLogs\'
    - ' ?:\Temp'
    - ' ?:\Users\Public\'
    - ' ?:\Windows\'
    - ' %public%'
  condition: 1 of selection_opt_* and all of selection_cli_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious usage of the RAR compression tool, particularly when it creates archives from folders associated with system files or those commonly exploited by attackers for staging files. The objective of such behavior is often to exfiltrate sensitive data in a compressed format or to obfuscate malicious payloads before transmission. By recognizing the specific command-line arguments and file locations associated with this activity, security analysts can identify potentially malicious actions taking place within the environment.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), specifically technique **Command and Scripting Interpreter** (T1059), which encompasses any execution of scripts or command-line utilities that can be leveraged by adversaries during an attack. This rule focuses on the execution of commands using `rar.exe`, indicating potential reconnaissance or data exfiltration actions like packing up sensitive data to facilitate its transfer outside of the network. The primary data sources for this detection include **process creation logs** on Windows systems, which detail command-line usage and can reveal suspicious patterns indicating the misuse of standard utilities like RAR.

  ### Investigation Steps
  - **Collect Process Creation Logs:** Gather logs from the Windows process creation events to identify instances of `rar.exe` being invoked with suspicious command-line parameters and from unusual directories.
  - **Review Command-Line Arguments:** Analyze the command-line arguments used with the `rar.exe` execution, looking for the presence of flags indicating recursion (`-r`) and password protection (`-hp`), which may indicate an attempt to secure an archive.
  - **Assess File Access Patterns:** Investigate the source folders targeted in the RAR command line, especially known critical or sensitive directories, to determine if any unauthorized access or manipulation has taken place.
  - **Identify Related User Activity:** Cross-reference the user or account executing the RAR command with user activity logs to identify anomalies, such as unusual authentication times or accessing organizational data outside of typical business hours.

  ### Prioritization
  This alert is of high severity due to the potential data exfiltration implications inherent in using tools like RAR in an unauthorized manner, especially when targeting sensitive or system directories. The likelihood of an attacker utilizing such techniques for data theft or obfuscation significantly raises this alert's priority in an enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic assumes that `rar.exe` will be executed with specific parameters that signify potentially harmful activity, which means legitimate uses of RAR that don't fit these patterns could be missed. Additionally, environments with custom scripts or tools that use RAR could generate false positives, as well as environments where logging configurations are insufficient to capture necessary process creation events. Ensuring comprehensive logging for all process creation activities is vital for this alert to function effectively and minimize blind spots.

