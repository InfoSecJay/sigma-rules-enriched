  ---

  ### Technical Context

  This Sigma rule detects instances of the `dllhost.exe` process being executed without any command-line arguments. Such behavior is highly atypical as `dllhost.exe` usually operates with specific parameters and is integral in handling COM objects and ActiveX controls. The likely attacker objective could be to exploit a process injection technique or to mask malware operations by mimicking legitimate system processes. Relevant MITRE ATT&CK tactics include Privilege Escalation (TA0004) and Defense Evasion (TA0005), particularly focusing on the technique “Process Injection” (T1055).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture detailed information regarding process initiation. If malicious, this behavior could lead to unauthorized elevation of privileges or execution of code in the context of a trusted process, posing a significant security risk. Importantly, this detection does NOT confirm that the activity is malicious on its own; further investigation is necessary to establish intent.

  ---

  ### Investigation Steps

  - **Examine Process Tree: ** Review the parent process of `dllhost.exe` using Process Explorer or similar tool. High-confidence malicious indicators include a parent process like `powershell.exe` or `cmd.exe` spawning `dllhost.exe` without arguments, which is atypical and should raise suspicion.

  - **Analyze Event Logs: ** Check Security Event ID 4688 for `dllhost.exe`. Confirm that the `CommandLine` field is empty. If other suspicious command-line arguments are present in the same log entry, this could indicate an attack.

  - **Validate Host Role: ** Assess the role of the host where the event occurred. If it's a critical server or a system not typically running `dllhost.exe`, prioritize the investigation as high-risk.

  - **Identify Normal Behavior: ** Document typical usages of `dllhost.exe` within your environment by reviewing known applications that legitimately utilize it. This contextual understanding can aid in distinguishing between benign and malicious instances.

  - **Collect Network Activity: ** Check for associated network connections during the time of the `dllhost.exe` execution. Review any outbound connections, particularly to unusual or unrecognized domains or IPs that may relate to attack infrastructure.

  - **Check for Binary Modifications: ** Use Sysmon logs (Event ID 11) to determine if `dllhost.exe` has been modified or replaced. Any non-original binaries could be a strong indicator of a compromise.

  ---

  ### Prioritization

  Given that `dllhost.exe` is a critical system process and its execution without command-line arguments is uncommon, the alert is high-severity. The likelihood of abuse is moderate to high, particularly if accompanied by anomalous behavior patterns, making this behavior a potential indicator of an emerging attack or compromised system.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the absence of requisite logging configurations or the potential for evasion techniques such as malware using legitimate executables under different contexts. Legitimate activities, such as certain application updates or automation scripts, may also inadvertently trigger this alert. A complementary detection to consider is monitoring for direct calls to the Windows API functions related to process injection, enhancing overall coverage against these tactics.

