logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\dllhost.exe'
    CommandLine:
    - 'dllhost.exe'
    - 'dllhost'
  filter_main_null:
    CommandLine:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule targets the execution of the "dllhost.exe" process without any command-line arguments, which is an anomalous event that could indicate suspicious activities such as process injection or the execution of malware masquerading as legitimate system processes. Typically, "dllhost.exe" is used by Windows to host Dynamic Link Library (DLL) files, and legitimate instances of this process usually come with specific command-line arguments indicating their purpose.

  In a threat landscape, attackers may aim to exploit "dllhost.exe" to execute malicious payloads while attempting to evade detection by mimicking legitimate behavior. Thus, the absence of command-line arguments is noteworthy and can signify an attempt to subvert security mechanisms or execute payloads silently. This behavior is associated with MITRE ATT&CK techniques such as Privilege Escalation (T1068), Defense Evasion (T1203), and Process Injection (T1055).

  Primary data sources for this detection would include process creation logs from Windows environments, which can capture the execution of processes and any accompanying arguments. Monitoring these logs can help identify unusual behavior patterns linked to malware or attacker activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect logs related to the "dllhost.exe" process creation. Look for any instances where the command line is absent and verify the parent processes associated with those executions for any anomalies.

  - **Examine Parent Process Relationships:** Analyze parent-child relationships of the suspicious "dllhost.exe" instances. Identify any unexpected or unauthorized parent processes that could suggest malicious intent.

  - **Correlate Behavioral Artifacts:** Look for additional indicators of compromise, such as other associated processes or unusual network activity originating from the host running the anomalous "dllhost.exe".

  - **Check for Known Threat Signatures:** Utilize threat intelligence feeds to match the executed process against known threats linked to "dllhost.exe" abuse, including malware signatures or process behavior indicative of exploitation.

  ### Prioritization
  This alert is classified as high severity due to the potential for undetected malware activity or exploit attempts leveraging a critical Windows process. The risk of an attacker gaining elevated privileges or executing malicious code can have serious implications on an enterprise environment’s security posture.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if process creation logs are not being recorded consistently or if the logging policy does not include sufficient details about command-line arguments. The detection logic assumes that "dllhost.exe" will typically be executed with command-line arguments; any variations in legitimate administrative tasks that might lead to such executions could result in false negatives. Ensuring proper log configurations for all events related to process creation is vital for this alert to function effectively.

