note: |
  ### Technical Context

  This rule detects instances of the `dllhost.exe` process being spawned without any command-line arguments, which is an unusual behavior that may indicate process injection attempts or malicious activity mimicking legitimate system processes. The likely attacker objective is to execute malicious code in memory without revealing itself, aligning with tactics such as privilege escalation or evasion of detection. This behavior correlates with the MITRE ATT&CK technique T1055 (Process Injection). Primary telemetry sources include Windows Security Event ID 4688 for process creation, and Sysmon Event ID 1, specifically examining the CommandLine and Image fields. If malicious, this could lead to unauthorized system control or data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own, as benign software may also exhibit similar behaviors under specific circumstances.

  ### Investigation Steps

  - **Examine process creation logs**: Query Security Event ID 4688 or Sysmon Event ID 1 for `dllhost.exe` creation. Check if there are additional parent processes executing it; valid cases typically show a known system application as the parent (e.g., `explorer.exe`).

  - **Analyze command-line arguments**: Validate that the CommandLine field is indeed null (or empty). Legitimate instances should usually include parameters for COM Object execution, while a null command line is suspicious.

  - **Investigate execution context**: Verify the user account/context under which `dllhost.exe` was spawned. Malicious activity often involves local or SYSTEM accounts rather than standard user accounts. Events logged under Service Control Manager (Event ID 7045) may indicate service manipulation.

  - **Cross-check against known bad indicators**: Search for any recent threat intelligence reports or baselines on dllhost activity - if the process creation coincides with other known malicious indicators, such as previously identified hashes or IP addresses related to malware campaigns, elevate severity.

  - **Correlate with network activity**: Check for outbound connections or unusual network activity initiated around the same timestamp from the host running `dllhost.exe`. Tools like NetFlow or firewalls can provide visibility here.

  - **Understand benign scenarios**: Familiarize with legitimate applications that may invoke `dllhost.exe` in benign ways (e.g., software installations or system updates). Review the system's application and installation logs for recent changes around the time of the alert.

  ### Prioritization

  The alert should be given high priority in an enterprise context, particularly if triggered on critical systems or servers. The likelihood of misuse is notable, given that process injection techniques are commonly weaponized in attacks. Anomalies such as this in `dllhost.exe` demand prompt investigation to mitigate potential compromise.

  ### Blind Spots and Assumptions

  This detection could be evaded if an adversary uses obfuscation or renames malware to mimic legitimate processes. Required logging sources must be properly configured to capture relevant details — including enabling Sysmon for process creation events and ensuring that local audit policies for process tracking are enabled. Legitimate activities that could inadvertently trigger this alert include application software patches or non-malicious service installations. A related detection to enhance coverage would be monitoring for known process injection methods or behaviors across other potentially affected system processes.

