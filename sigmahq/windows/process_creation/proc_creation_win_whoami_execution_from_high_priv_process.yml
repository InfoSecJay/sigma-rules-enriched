note: |
  ### Technical Context
  This detection rule identifies instances where the `whoami.exe` utility is executed by privileged accounts, which is commonly exploited by threat actors during reconnaissance or privilege escalation activities. The execution of `whoami.exe` can provide insights into the permissions associated with the running user account, making it a practical tool for a malicious actor to map out their access within a system and develop further exploitation plans.

  The suspected threat scenario involves attackers who gain access to privileged accounts and execute `whoami.exe` to gather information about their privileges or system context. This aligns with the MITRE ATT&CK techniques of **Privilege Escalation (T1068)** and **Discovery (T1033)**, as adversaries may seek to leverage such information to elevate their access or move laterally within the network.

  Primary data sources for this detection include **process creation events**, which capture the execution of command-line interfaces, and the attributes of the processes such as the user context under which they were executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of `whoami.exe` being executed. Pay special attention to entries showing execution from privileged accounts such as `SYSTEM`, `Administrator`, or other high-privilege user groups.

  - **Correlate with User Activity**: Cross-reference the execution with user activity logs to identify any unusual or unauthorized actions taken by the accounts. This includes checking the timestamps to see if the activity coincided with any known breaches or suspicious behaviors.

  - **Investigate Account Privileges**: Assess the privileges associated with the accounts that executed `whoami.exe`. Investigate the context and reason for their elevated permissions, ensuring they align with expected operational practices.

  - **Scan for Lateral Movement Indicators**: Check for additional signs of lateral movement or reconnaissance activities that may signal a broader compromise, such as unusual authentication attempts across different systems within the network.

  ### Prioritization
  This alert is marked as high severity due to the potential critical nature of privilege escalation activities within an enterprise environment. The likelihood of exploitation increases if privileged credentials are misused, and the consequences of such actions can lead to significant breaches of sensitive data and systems.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes environments where security logs may be insufficiently detailed or improperly configured, leading to unrecorded instances of `whoami.exe` execution. The detection assumes that the privileged accounts observed in the logs are indeed legitimate users; however, they could also be accounts created by attackers. Effective logging of process execution and user activities is essential for this alert to function correctly. If logs are missing or "whoami.exe" is invoked in a non-traditional manner (e.g., through scripts or malware obfuscation), detection may be compromised.

