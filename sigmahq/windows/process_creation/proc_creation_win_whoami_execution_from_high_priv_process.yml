note: |
  ### Technical Context

  This Sigma rule detects the execution of `whoami.exe`, a command-line utility used to identify the current user or permissions, when run by privileged accounts such as 'AUTHORI', 'AUTORI', or 'TrustedInstaller'. The behavior indicates a potential reconnaissance phase or privilege escalation attempt by an attacker within a Windows environment. This activity correlates with the MITRE ATT&CK tactic of Discovery (TA0007) and the technique of User Discovery (T1033).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, detailing process execution and associated user identities. If malicious, this behavior could facilitate an attacker in confirming account privileges or identifying configurations for further exploitation. However, this detection alone does not confirm malicious intent; legitimate administrative tasks may execute similar commands.

  ### Investigation Steps

  - **Review process creation logs for `whoami.exe`:** Check Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 for occurrences of `whoami.exe` executed by the specified privileged accounts. Filter logs to show details like User, Process ID, and Command Line arguments.

  - **Check process execution timing:** Analyze timestamps of `whoami.exe` execution against standard operating hours for administrative accounts. Legitimate usage often occurs during routine account audits or system maintenance.

  - **Correlate with recent privilege escalation attempts:** Investigate other events prior to `whoami.exe` execution that could suggest privilege escalation. Look for Event IDs indicating service or user token manipulation, such as Event ID 4672 (Special Privileges Assigned).

  - **Identify configuration management or dev workflows:** Look for legitimate processes that may invoke `whoami.exe`, such as automated scripts or frameworks. This can include checking for tied solutions like PowerShell scripts, SCCM tasks, or RMM tools.

  - **Correlate with alert history for false positive validation:** Analyze historical logs for similar executions by the same accounts. If occurrences are infrequent outside of maintenance windows, this can be a sign of potential misuse rather than typical behavior.

  ### Prioritization

  This alert should be considered high severity due to the involvement of privileged accounts, which, if compromised, pose a significant risk to enterprise security. The execution of `whoami.exe` in this context suggests reconnaissance that may be part of a broader attack campaign. Although not universally weaponized, it is commonly leveraged by threat actors during privilege escalation.

  ### Blind Spots and Assumptions

  Detection is limited by potential legitimate uses of `whoami.exe` by administrators as part of normal operations, which can lead to false positives. Required log sources must be correctly configured for reliable detection, ensuring Sysmon and appropriate Windows security logs are active. This detection rule pairs well with monitoring for abnormal privilege escalations or user account changes to bolster coverage against misuse related to unauthorized access.

