note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the AdvancedRun utility, commonly used in Windows environments. Attackers may leverage this tool to execute processes with elevated privileges under accounts such as TrustedInstaller, SYSTEM, Local Service, or Network Service, potentially aiming for privilege escalation or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Privilege Escalation (T1134.002) and Defense Evasion (T1140).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688. If malicious, the execution of AdvancedRun under these system accounts could allow an adversary to perform unauthorized actions and manipulate system integrity. The detection of AdvancedRun execution does NOT confirm that malicious intent exists; legitimate administrative tasks may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review the process creation logs for AdvancedRun execution:** Look for Security Event ID 4688 indicating the creation of a process with 'AdvancedRun' in the CommandLine field. Focus on instances where it is executed under SYSTEM, Local Service, or Network Service accounts.

  - **Analyze CommandLine parameters:** Check if the CommandLine field contains '/EXEFilename', '/CommandLine', or includes ' /RunAs 8 ', ' /RunAs 4 ', ' /RunAs 10 ', or ' /RunAs 11 '. Malicious indicators typically show unusual patterns or unrecognized external executables.

  - **Identify any parent processes:** Determine the parent process that initiated the AdvancedRun execution. Legitimate use often occurs from trusted management tools or scripts. Malicious activity may have unusual parent processes like cmd.exe or powershell.exe.

  - **Cross-reference user accounts:** Investigate the user associated with the process creation. Any activity from system accounts without clear justification may indicate malicious intent. Regular administrative tasks should originate from known administrators.

  - **Check for subsequent process executions:** Follow the execution path for any processes spawned from AdvancedRun. Look specifically for unexpected behavior such as executables with unusual names or from unexpected directories.

  - **Monitor system modifications:** Assess sysmon logs for related changes that could indicate post-exploitation activity (e.g., file modifications, registry changes). Particularly confirm any unusual file creation or deletion actions after AdvancedRun execution.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the sensitive nature of the accounts involved (SYSTEM, Local Service, Network Service) and the potential for privilege escalation. The likelihood of malicious abuse is heightened, given that AdvancedRun is not typically used in benign scenarios. This behavior is also a common technique employed in sophisticated attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of process obfuscation techniques or command-line arguments being modified to evade detection. Required log sources must include complete logging for Windows Event ID 4688, and assumptions about benign use must be validated against known system administration practices. Companion detections for PowerShell usage (T1086) can help enhance coverage and provide additional context around potential malicious execution chains.

