note: |
  ### Technical Context
  This detection rule identifies the execution of the AdvancedRun utility under highly privileged system accounts, such as TrustedInstaller, SYSTEM, Local Service, or Network Service. The functionality of AdvancedRun allows an attacker or malicious insider to execute programs with various user privileges, potentially evading security mechanisms and executing unauthorized commands or scripts. This pattern may be indicative of tactics used in privilege escalation or defense evasion, particularly in environments where attackers seek to manipulate system processes for malicious purposes.

  The relevant MITRE ATT&CK tactics that apply to this detection include **Privilege Escalation** (TA-0040) and **Defense Evasion** (TA-0043), specifically techniques for running processes with elevated privileges (T1134.002). Adversaries may use this utility to gain additional access within a compromised system, allowing for further exploitation or lateral movement across the network.

  Primary data sources for this detection include process creation events from Windows event logs. These logs will provide evidence of the command lines used during the execution of processes, which is key in verifying the nature of the actions taken by the user account in question.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze process creation events for any suspicious command lines associated with AdvancedRun, particularly those executed under SYSTEM or similar accounts.
  - **Analyze Command Line Parameters:** Look for the presence of parameters like '/EXEFilename' and '/RunAs' followed by values indicative of privilege escalation (8, 4, 10, 11). Scrutinize the context in which these commands were executed.
  - **Correlation with User Activities:** Investigate whether the processes were executed in response to legitimate administrative actions or if they appear anomalous. Review recent changes to system configurations or user permissions that may have led to this execution.
  - **Check for Artifacts of Potential Exploitation:** Determine if any additional evidence of malicious activity exists, such as manipulation of system files, scheduled tasks, or the presence of known malware payloads executed in conjunction with the identified AdvancedRun activity.

  ### Prioritization
  This alert should be treated with high priority due to the significant risk of privilege escalation and potential system compromise an adversary may achieve using the AdvancedRun tool. The likelihood of misuse in enterprise environments increases in systems that may deploy advanced administrative tasks.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on process creation logs, which may not capture all instances of AdvancedRun execution if they do not generate a new process or if logging is misconfigured. The detection logic assumes that the presence of specific command-line arguments indicates malicious intent, which may not be universally applicable, especially in environments with legitimate use cases for the AdvancedRun utility. For effective alert functionality, it is crucial that Windows event logging is enabled and configured to capture all relevant process creation events.

