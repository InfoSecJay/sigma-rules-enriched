note: |
  ### Technical Context

  This Sigma rule detects the execution of the AdvancedRun utility under high-privilege accounts such as TrustedInstaller, SYSTEM, Local Service, or Network Service. The primary objective of an attacker utilizing this behavior is to execute malicious commands or scripts with escalated privileges to bypass security controls. This activity fits within the MITRE ATT&CK framework under the Privilege Escalation tactic (T1075) and the technique for running applications with elevated privileges (T1134.002).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, detailing process command lines and user context. If this behavior is malicious, it poses significant risk, as it may indicate a compromise of high-privilege accounts and an attempt to execute unwanted programs on critical systems. However, this detection does NOT confirm whether the executed command was actually malicious, as legitimate administrative tasks may also trigger this alert.

  ### Investigation Steps

  - **Inspect Command Line Arguments**: Review Security Event ID 4688 or Sysmon Event ID 1 for command lines containing `/EXEFilename` or `/CommandLine`. Benign entries typically originate from administrative tasks or maintenance scripts, while suspicious entries may have unusual or unknown executable paths.

  - **Identify User Context**: Confirm the account used for execution. Command lines run under SYSTEM or high-privileged accounts (e.g., TrustedInstaller) warrant higher scrutiny, especially if executed from non-standard paths like user profiles or temporary folders.

  - **Check Process Parentage**: Investigate the parent process of the AdvancedRun execution. Typical benign scenarios may show system or administrative tools as the parent, while malicious contexts might obscure their origins through process injection or execution from unexpected processes.

  - **Evaluate Frequency of Execution**: Assess the frequency and timing of the alerts. Multiple executions in a short timeframe, especially outside normal business hours, can indicate malicious behavior.

  - **Review Installed Applications**: Verify whether AdvancedRun is legitimately installed and used within the organization. If it is not part of standard tooling, further investigation into its purpose and origin is necessary.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact of privilege escalation on critical systems. The likelihood of malicious usage is significant, as AdvancedRun is often utilized for executing commands with elevated privileges, a common tactic among attackers seeking access to sensitive environments.

  ### Blind Spots and Assumptions

  Detection may be limited if AdvancedRun is executed with command-line arguments that do not match specified patterns, allowing adversaries to obfuscate their actions. Ensure logging for Windows process creation is configured correctly to capture all relevant events. Legitimate administrative tools, processes performing system updates, or management tasks may also trigger this alert. Related detections include anomalous usage patterns of PowerShell (T1086), which can reinforce the identification of malicious activity.

