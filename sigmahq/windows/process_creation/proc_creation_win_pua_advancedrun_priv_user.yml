note: |
  ### Technical Context

  This Sigma rule detects the execution of the AdvancedRun utility, particularly when invoked under high-privilege accounts such as TrustedInstaller, SYSTEM, Local Service, or Network Service. Attackers may use this utility to execute malicious commands in a privileged context, often aiming to bypass standard user restrictions or to execute payloads that require elevated permissions.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** and **Privilege Escalation** (Tactic: TA0005, Technique: T1134.002). The primary telemetry source is Windows process creation logs, specifically looking at CommandLine arguments to identify suspicious patterns. If this behavior is malicious, it may result in unauthorized access, system compromise, or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is required to establish context.

  ### Investigation Steps

  - **Review event details in process creation logs**: Check for Windows Security Event ID 4688 or Sysmon Event ID 1 that details the execution of AdvancedRun, along with the associated command line arguments.

  - **Identify high-privilege accounts**: Analyze the user account executing AdvancedRun. Commands executed under SYSTEM, TrustedInstaller, or Service accounts should raise suspicion; determine if these accounts typically execute such commands in your environment.

  - **Cross-reference command-line arguments**: Validate the command-line input, specifically for keywords like '/EXEFilename' and '/RunAs' followed by values such as '8', '4', '10', or '11'. Legitimate entries typically do not invoke AdvancedRun with these parameters, especially from high-privileged accounts.

  - **Investigate related scheduled tasks**: Check for any suspicious scheduled tasks created recently that may indicate persistence mechanisms. Use the Task Scheduler logs (Event ID 4698) to identify unexpected task creation linked to AdvancedRun.

  - **Assess recent administrative activity**: Review activity logs from administrative actions (e.g., Event ID 4670 - Permissions on an object), which could indicate recent privilege escalations or purposely initiated script executions.

  - **Document legitimate usage patterns**: If you identify any valid usage of AdvancedRun from a legitimate administrator or automated process, ensure this is documented to avoid false positives in future detections.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems and the high likelihood of malicious intent. The nature of invoking processes with elevated privileges makes this tactic a common target for attackers aiming at executing malicious payloads or altering system configurations.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to the legitimate use of AdvancedRun for administrative purposes, potentially leading to false positives. Additionally, if log sources for process creation are not properly configured, the detection may miss critical events. Common legitimate triggers for this alert include system maintenance scripts or trusted administrative applications. A companion detection that strengthens coverage would be monitoring for any sudden changes in the execution status of privileged accounts or service processes.

