level: medium
note: |
  ### Technical Context

  This rule detects the execution of `cmdl32.exe` with the command line parameters `'/vpn'` and `'/lan'`, which indicates potentially malicious behavior involving arbitrary file downloads using a configuration file. Attackers may exploit this utility to download files covertly as part of lateral movement or data exfiltration efforts. The relevant MITRE ATT&CK tactics are **Execution (TA0002)** and **Command-Line Interface (T1218)**.

  The primary telemetry source for this rule is Windows Process Creation logs, notably Event ID 4688. If malicious, the impact could be severe, potentially leading to unauthorized access to sensitive files or exfiltration of critical data. This detection does NOT confirm whether the downloaded files are malicious or if the command was executed for legitimate purposes.

  ### Investigation Steps

  - **Inspect process creation logs:** Review Security Event ID 4688 for instances of `cmdl32.exe` execution. Look for the specific command line containing `'/vpn'` and `'/lan'`.

  - **Analyze the configuration file**: Check the path and content of the configuration file used with `cmdl32.exe`. Look for unexpected or suspicious file extensions or any known malicious URLs.

  - **Verify legitimate usage patterns:** Confirm if `cmdl32.exe` is used in your environment by authorized applications or users. Legitimate usage may include documented business processes related to VPN configurations.

  - **Check process tree:** Investigate parent processes of `cmdl32.exe` to identify unusual process hierarchies that may indicate malicious activity. Look for unusual parent processes like `powershell.exe` or `cmd.exe`.

  - **Identify high-confidence malicious indicators:** Look for downloads originating from uncommon or blacklisted domains in the process command line or configuration files.

  - **Evaluate asset criticality:** Determine if the affected assets are critical infrastructure or contain sensitive data. This could influence response prioritization.

  ### Prioritization

  This alert should be treated with medium severity. While the affected `cmdl32.exe` execution might not inherently indicate compromise, its misuse for arbitrary file download represents a significant risk, especially if executed from critical systems or in sensitive environments. The likelihood of this behavior being weaponized is moderate, given the stealthy nature of this utility.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of log sources. If process creation logs are not properly collected, detections could be missed. Legitimate activities, such as regular software updates or administrative tasks involving `cmdl32.exe`, may trigger this alert. A companion detection related to file downloads or network activity (e.g., `Network Traffic Analysis` for unusual outbound connections) can strengthen overall coverage and context for the alert.

