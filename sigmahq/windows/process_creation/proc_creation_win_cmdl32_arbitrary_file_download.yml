logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\cmdl32.exe'
  - OriginalFileName: CMDL32.EXE
  selection_cli:
    CommandLine|contains|all:
    - '/vpn'
    - '/lan'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the **cmdl32.exe** utility with the specific command line arguments **/vpn** and **/lan**. Attackers may leverage cmdl32.exe, which is a legitimate tool, to download arbitrary files using a configuration file. By abusing this functionality, adversaries can potentially exfiltrate sensitive data or introduce malicious payloads into the environment. The goal of such an attack is usually to maintain persistence, conduct data theft, or execute further commands on compromised systems.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002) as the primary tactic due to the execution of cmdl32.exe, and **Defense Evasion** (TA0005) since attackers are utilizing built-in tools to obfuscate malicious activities. Specifically, technique **T1218** (Signed Binary Proxy Execution) is applicable, indicating the execution of a trusted executable in a potentially malicious context. The main data source for this detection is **process creation logs** from Windows systems, which capture details about the execution of applications along with their command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events to confirm the execution of cmdl32.exe with the specified arguments. Pay attention to the timestamp, user, and parent process ID for comprehensive context.
  - **Inspect Download Configuration**: Validate the command line to locate the configuration file associated with the download operation. Investigate its source and inspect its contents to determine if it has potentially harmful payloads or commands.
  - **Monitor File Behavior**: If the configuration indicates any file downloads, monitor the associated network traffic or file access logs to see if the files are being retrieved from unusual or blacklisted locations.
  - **Analyze User Context**: Evaluate the user account that executed cmdl32.exe. Determine if this user has legitimate reasons to run this command, considering their typical role and behavior within the organization.

  ### Prioritization
  This alert is of **medium severity** because while cmdl32.exe is a common and legitimate tool, its misuse can indicate potential compromise or lateral movement within the environment. The likelihood of abuse combined with its possible impact on data security necessitates prompt investigation.

  ### Blind Spots and Assumptions
  The primary blind spot is the reliance on the accurate logging of process creation events; if logging is disabled or improperly configured, this detection may fail to trigger. The assumption is that cmdl32.exe will not be run with these specific flags in a legitimate context, making any such execution suspicious by default. Proper logging configurations for process creation must be enabled to ensure effective detection, including both command-line parameters and the image path for cmdl32.exe.

