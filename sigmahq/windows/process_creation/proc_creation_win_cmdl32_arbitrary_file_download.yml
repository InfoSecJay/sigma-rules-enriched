detection:
  selection_img:
  - Image|endswith: '\cmdl32.exe'
  - OriginalFileName: CMDL32.EXE
  selection_cli:
    CommandLine|contains|all:
    - '/vpn'
    - '/lan'
  condition: all of selection_*
falsepositives:
