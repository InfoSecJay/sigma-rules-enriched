note: |
  ### Technical Context

  This Sigma rule detects the usage of `bitsadmin.exe` to download files from URLs that directly reference an IP address. The primary objective of an attacker using this technique may be to exfiltrate sensitive data or deploy malware without triggering traditional security measures, as direct IP downloads can bypass domain-based filtering. This behavior is associated with the MITRE ATT&CK techniques **T1197 - Spear Phishing via Service** and **T1036.003 - Masquerading: Match Legitimate Name or Location**. The primary telemetry sources are process creation logs from Windows, specifically focusing on the `CommandLine`, `Image`, and `OriginalFileName` fields. If malicious, this behavior could allow unauthorized data transfer or system compromise. Importantly, this detection alone does not confirm an intrusion; it may also signal legitimate use if it is consistent with organizational practices.

  ### Investigation Steps

  - **Check process creation logs for bitsadmin activity:** Review Security Event ID 4688 or Sysmon Event ID 1 entries for any invocation of `bitsadmin.exe`. Look for command lines containing ` /transfer `, ` /create `, or ` /addfile ` along with direct IP addresses.

  - **Identify suspicious command lines:** Focus on command lines that contain IP addresses in the format `://1`, `://2`, etc. Legitimate usage typically involves URLs with domain names, so flag any command line following this pattern.

  - **Review file transfer times:** Analyze the timestamps of the bitsadmin activity against normal operational hours. Unexpected file transfers outside of typical hours may suggest malicious intent.

  - **Correlate against user activity:** Investigate the user account associated with the bitsadmin invocation to identify any recent anomalies or elevated permissions for that account. Cross-reference Event ID 4624 (logon events) and check if the user has a history of similar behavior.

  - **Examine network traffic logs:** Leverage network monitoring tools to check for any outbound connections to the detected IP address. Validate if the link is associated with known benign services or if it corresponds to malicious indicators, such as known C2 addresses.

  - **Assess for persistence:** If the bitsadmin utility was used in conjunction with other persistence techniques, review for additional malicious indicators, such as unusual registry changes or scheduled tasks (using Event ID 4698).

  ### Prioritization

  This alert has a high severity level due to the potential impact of the affected system, especially if critical assets are involved. Directly downloading files via IP can be an indicator of living-off-the-land techniques commonly employed by attackers, thereby increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Limitations include potential evasion via using legitimate endpoints or misconfigured security settings that may allow benign activities to trigger the alert. Reliable detection necessitates proper logging of process creation and command line parameters on endpoints. Legitimate activities, such as internal applications downloading updates from IP addresses, can cause false positives. Related alerts for entire file downloads via unauthorized scripts or user actions would enhance detection coverage against this behavior.

