logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  - Hashes|contains:        # Sysmon field hashes contains all types
    - 'IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E'
    - 'IMPHASH=37777A96245A3C74EB217308F3546F4C'
    - 'IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206'
    - 'IMPHASH=B12619881D79C3ACADF45E752A58554A'
    - 'IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00'
  selection_cmd:
    CommandLine|contains|windash: '-format:'         # wmic process list -FORMAT /? or wmic process list /FORMAT /?
  filter_main_known_format:
    CommandLine|contains:
    - 'Format:List'
    - 'Format:htable'
    - 'Format:hform'
    - 'Format:table'
    - 'Format:mof'
    - 'Format:value'
    - 'Format:rawxml'
    - 'Format:xml'
    - 'Format:csv'
  filter_main_remote_operation:   # Covered by 8d63dadf-b91b-4187-87b6-34a1114577ea
    CommandLine|contains:
    - '://'
    - '\\\\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- WMIC.exe FP depend on scripts and administrative methods used in the monitored
  environment.
- Static format arguments - https://petri.com/command-line-wmi-part-3
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of WMIC.EXE with the "format" flag, which can be misused by attackers to execute local XSL files and potentially bypass application whitelisting defenses. The likely attacker objective is to execute arbitrary code that can manipulate system data or extract sensitive information. This behavior aligns with the MITRE ATT&CK techniques T1047 (Windows Management Instrumentation) and T1220 (XSL Script Execution).

  The detection relies on Windows process creation telemetry, specifically looking for specific command line arguments and signature hashes associated with WMIC.EXE. If malicious, this activity could lead to system compromise, information theft, or lateral movement within the network. However, it is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative tasks may trigger similar WMIC executions.

  ### Investigation Steps

  - **Identify the process creation event:** Check Security Event ID 4688 or Sysmon Event ID 1 for the instance of WMIC.EXE with the command line parameters that include "-format:" and are executed with known suspicious hashes.

  - **Examine command line arguments:** Look for command line arguments containing "Format" types such as "List," "htable," or "xml." This can include reviewing the CommandLine field in event logs to differentiate between benign WMIC usage and potential attacks.

  - **Review related processes:** Investigate any parent processes that initiated the WMIC.EXE execution by checking Event ID 4688 for the Process ID (PID) of the parent process. Malicious instances may often be spawned by scripts or processes that are atypical for your environment.

  - **Validate legitimate usage:** Confirm whether WMIC.EXE is being called as part of expected IT administrative scripts or monitoring tools. This may include checking documentation of scheduled tasks or legitimate scripts used by your operations teams.

  - **Investigate for exfiltration artifacts:** In case of malicious intent, check for any file created or modified that are associated with the XSL execution context. Look for common Windows temp directories to validate if any files were written or downloaded during the execution.

  ### Prioritization

  This alert should be treated with medium severity. If the affected system is critical, such as a domain controller or file server, the potential impact increases significantly. The likelihood of malicious abuse is moderate, as adversaries commonly use WMIC for lateral movement or execution of payloads in a compromised environment.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through the use of obfuscation or alternate command line flags that are not captured by this rule. The required logs for reliable detection include both Sysmon and Windows Event logs focused on process creation. Legitimate administrative tasks, particularly those involving WMI for system management, may regularly trigger this alert. Companion detections to consider include those that monitor for unusual WMI queries or remote executions that strengthen coverage against lateral movement tactics.

