logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  - Hashes|contains:        # Sysmon field hashes contains all types
    - 'IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E'
    - 'IMPHASH=37777A96245A3C74EB217308F3546F4C'
    - 'IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206'
    - 'IMPHASH=B12619881D79C3ACADF45E752A58554A'
    - 'IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00'
  selection_cmd:
    CommandLine|contains|windash: '-format:'         # wmic process list -FORMAT /? or wmic process list /FORMAT /?
  filter_main_known_format:
    CommandLine|contains:
    - 'Format:List'
    - 'Format:htable'
    - 'Format:hform'
    - 'Format:table'
    - 'Format:mof'
    - 'Format:value'
    - 'Format:rawxml'
    - 'Format:xml'
    - 'Format:csv'
  filter_main_remote_operation:   # Covered by 8d63dadf-b91b-4187-87b6-34a1114577ea
    CommandLine|contains:
    - '://'
    - '\\\\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- WMIC.exe FP depend on scripts and administrative methods used in the monitored
  environment.
- Static format arguments - https://petri.com/command-line-wmi-part-3
level: medium
note: |
  ### Technical Context

  This rule detects the execution of WMIC (Windows Management Instrumentation Command-line) with the "format" flag, indicating that the system is processing local XSL files, potentially for malicious purposes. Attackers may use this method to execute arbitrary scripts or bypass application whitelisting mechanisms. The relevant MITRE ATT&CK tactics and techniques associated with this behavior are "Command and Control" (TA0011) and "Process Injection" (T1059.005).

  The primary telemetry sources for this detection are process creation logs, specifically looking at execution details from Windows event logs (Event ID 4688) and Sysmon logs (Event ID 1). If malicious, this behavior poses a significant risk as it can facilitate arbitrary code execution. Importantly, this detection does not prove malicious intent on its own; legitimate administrative activities may also generate similar WMIC commands.

  ### Investigation Steps

  - **Examine process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of "wmic.exe" in the command line. Look for execution details including the use of the “-format” argument.

  - **Check command line arguments:** Identify WMIC commands that include any of the following format arguments: "List", "htable", "hform", "table", "mof", "value", "rawxml", "xml", or "csv." Malicious executions may have unusual arguments that are not typically used.

  - **Identify unauthorized XSL file execution:** Investigate the presence of local XSL files or any alterations in expected file locations. Legitimate administrative tasks would typically reference well-known and trusted XSL files.

  - **Correlate with other alerts:** Review for any related alerts or logs indicating suspicious activities around the same time, especially looking for network connections that suggest data exfiltration or command-and-control communications.

  - **Validate host role and expected usage:** Confirm the role of the affected host. If it is not a workstation used for administration or scripting, and it executes WMIC with format, this could indicate a higher confidence in malicious activity.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of arbitrary code execution on critical systems. The likelihood of malicious abuse is moderate, as WMIC use is common in legitimate administrative tasks, but it can also be weaponized by attackers. Given the context, understanding the role of the host is crucial to assessing the urgency of this alert.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that utilize WMIC, potentially leading to false positives. Evasion techniques could include obfuscation of command line arguments or the use of different scripting methodologies that do not trigger this rule. Reliable detection requires that all relevant logging sources (such as Sysmon and Windows Security logs) are properly configured. A companion detection for "WMIC with network activity" could enhance coverage of potential misuse of this command.

