description: |
  Detects the execution of WMIC with the "format" flag to potentially load local XSL files.
  Adversaries abuse this functionality to execute arbitrary files while potentially bypassing application whitelisting defenses.
  Extensible Stylesheet Language (XSL) files are commonly used to describe the processing and rendering of data within XML files.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1220/T1220.md
author: Timur Zinniatullin, oscd.community, Swachchhanda Shrawan Poudel
date: 2019-10-21
modified: 2026-01-24
tags:
- attack.defense-evasion
- attack.t1047
- attack.t1220
- attack.execution
- attack.t1059.005
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\wmic.exe'
  - OriginalFileName: 'wmic.exe'
  - Hashes|contains:        # Sysmon field hashes contains all types
    - 'IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E'
    - 'IMPHASH=37777A96245A3C74EB217308F3546F4C'
    - 'IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206'
    - 'IMPHASH=B12619881D79C3ACADF45E752A58554A'
    - 'IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00'
  selection_cmd:
    CommandLine|contains|windash: '-format:'         # wmic process list -FORMAT /? or wmic process list /FORMAT /?
  filter_main_known_format:
    CommandLine|contains:
    - 'Format:List'
    - 'Format:htable'
    - 'Format:hform'
    - 'Format:table'
    - 'Format:mof'
    - 'Format:value'
    - 'Format:rawxml'
    - 'Format:xml'
    - 'Format:csv'
  filter_main_remote_operation:   # Covered by 8d63dadf-b91b-4187-87b6-34a1114577ea
    CommandLine|contains:
    - '://'
    - '\\\\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- WMIC.exe FP depend on scripts and administrative methods used in the monitored environment.
- Static format arguments - https://petri.com/command-line-wmi-part-3
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of WMIC (Windows Management Instrumentation Command-line) with the "format" flag, which may indicate an adversary's attempt to execute arbitrary files using local XSL (Extensible Stylesheet Language) files. This technique allows attackers to bypass application whitelisting defenses and execute malicious payloads by utilizing legitimate tools within a Windows environment. Attackers can leverage WMIC to manipulate system settings or gather information while remaining under the radar.

  The likely attacker objectives include data exfiltration, persistence, or lateral movement within the network. By executing scripts through WMIC, adversaries can establish command and control channels or manipulate sensitive data. This behavior aligns with several relevant MITRE ATT&CK techniques, such as "Command-Line Interface" (T1059) and "WMI" (T1047), as well as "Execution through Command-Line Interface" (T1059.007). The primary data sources for detecting this behavior are process creation events that capture command-line arguments, including those generated by WMIC executions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze process creation logs to identify instances of `wmic.exe` execution, specifically focusing on command-line parameters that contain `-format:` indicating potential XSL file executions.

  - **Examine Command-Line Arguments:** Investigate the command line for signs of unusual activity, including the presence of local file paths or XSL file types. This may help identify potentially malicious patterns or payloads being executed.

  - **Correlate with Known Bad Hashes:** Match the file hashes against known malicious WMIC hashes as specified in the detection logic. This step is important for validating the legitimacy of the executed WMIC file.

  - **Assess System Integrity and Logs:** Determine if the behavior aligns with legitimate administrative activities. Review logs from EDR or other monitoring solutions for any additional suspicious activities occurring around the time of the WMIC execution.

  ### Prioritization
  This alert should be considered medium severity due to its potential for serious impact and likelihood. Executing arbitrary files using WMIC can lead to unauthorized access, data breaches, and persistence mechanisms that enable further compromise of the environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if WMIC executions are obscured by administrative scripts or other legitimate usage patterns, potentially leading to false positives. Additionally, the detection logic assumes that relevant logs from process creation events and command-line arguments are available and properly collected in the environment. It is crucial for organizations to ensure that their logging configurations capture sufficient detail to support this detection rule effectively.

