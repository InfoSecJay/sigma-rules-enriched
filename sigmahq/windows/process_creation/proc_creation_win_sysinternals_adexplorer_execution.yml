note: |
  ### Technical Context

  This Sigma rule detects the execution of Sysinternals ADExplorer with the "-snapshot" flag, which captures a local copy of the Active Directory (AD) database. Attackers may use this capability to extract sensitive data such as usernames, domain structures, and comments potentially containing passwords, which could facilitate password spraying or social engineering attacks. This detection is relevant to the MITRE ATT&CK techniques of Discovery (T1087.002) and Credential Dumping (T1482).

  The primary telemetry source is process creation events from Windows systems. The required log types include Security Event ID 4688 (process creation) and Sysmon Event ID 1 (process creation details). If malicious, the impact could range from unauthorized data exfiltration to further compromise of the AD environment. This detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also invoke this behavior.

  ### Investigation Steps

  - **Verify recent executions of ADExplorer:** Check Security Event ID 4688 logs for instances of `ADExp.exe` or `ADExplorer.exe` being executed. Look for unusual execution times or from non-standard user accounts.

  - **Inspect command-line arguments:** Focus on the command line for instances containing the `-snapshot` flag, which indicates an attempt to capture the AD database. Legitimate usage may not typically include this flag.

  - **Cross-reference user activity:** Check for user accounts with administrative roles. Determine if the actions align with expected administrative duties. Legitimate use is typically documented in IT workflows.

  - **Analyze event log details:** Review Sysmon Event ID 1 for ADExplorer processes, noting the path and environment variables. Confirm any anomalies or irregular paths that deviate from standard installation locations.

  - **Look for suspicious file creation:** Validate if any AD snapshot files have been created in unusual directories, particularly those accessible to non-administrative users. Check for files with names or extensions that are uncommon for standard AD snapshots.

  - **Assess associated alerts:** If this alert is triggered, investigate related detection rules that flag suspicious PowerShell or similar tools (e.g., AD enumeration techniques). Correlate these alerts to improve the context around potential malicious activity.

  ### Prioritization

  This alert is rated medium severity because while it indicates a potential security threat involving sensitive AD data, the risk level depends on the affected asset's role and whether the executer is authorized. Common adversaries leverage this technique, making timely investigations critical.

  ### Blind Spots and Assumptions

  Detection may be limited if log sources are not configured correctly or if users commonly perform similar actions legitimately. Some administrators may run ADExplorer for maintenance without malicious intent, which could lead to false positives. A companion detection that strengthens coverage could include monitoring LDAP access (TLDAP) to identify enumeration attempts that may occur in conjunction with this behavior.

