note: |
  ### Technical Context
  This detection rule identifies the execution of the Sysinternals tool, ADExplorer, specifically when it is invoked with the "-snapshot" flag. The capability to take a snapshot of the Active Directory database can be exploited by attackers for various malicious purposes, including extracting user information for compliance with password spraying attacks, collecting data for BloodHound analysis, or gathering metadata useful for social engineering schemes. Although the snapshot does not capture password hashes, it is possible that sensitive information, such as passwords in comment fields, could still be present.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Discovery** (ID: TA0007)
  - **Account Discovery** (ID: T1087.002)
  - **System Information Discovery** (ID: T1069.002)
  - **Data from Information Repositories** (ID: T1482)

  Primary data sources for this detection primarily involve Windows process creation logs which can capture the execution details of the ADExplorer tool, including the command line parameters used, as well as the original file name and product information.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for instances of ADExplorer being executed with the "-snapshot" flag, focusing on logs that record the command line arguments for context.
  - **Correlate User Activity:** Investigate the user account associated with the snapshot command to determine if there were any unusual or unauthorized access patterns before or after execution.
  - **Analyze Active Directory Logs:** Look into any related Active Directory logs for suspicious account activity, such as repeated enumeration commands or access attempts from unrecognized clients.
  - **Inspect File and Access Permissions:** Examine the access permissions of the Active Directory snapshots and any files generated by ADExplorer to understand the exposure of sensitive data.

  ### Prioritization
  This alert is of medium severity due to the potential risks associated with improper use of ADExplorer, which can lead to data leakage and subsequent exploitation of AD information. Given the critical role of Active Directory in managing user credentials and permissions, any unauthorized access attempts warrant prompt investigation.

  ### Blind Spots and Assumptions
  One notable blind spot in this detection rule is the reliance on process creation logs, which may not capture all instances of tool execution, particularly if the attacker employs obfuscation techniques to hide such activities. Assumptions made by the detection logic include that all legitimate uses of ADExplorer are accounted for, despite the tool being frequently used by system administrators for legitimate purposes. For the alert to function effectively, it requires comprehensive logging configurations on all relevant endpoint devices and the proper capturing of command-line arguments in process creation logs.

