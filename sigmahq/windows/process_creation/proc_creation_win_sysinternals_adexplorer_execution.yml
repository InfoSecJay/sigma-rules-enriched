note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of Sysinternals ADExplorer with the "-snapshot" flag, indicating an attempt to create a local copy of the Active Directory (AD) database. The likely objective for an attacker could be to extract user information for follow-up attacks, such as password spraying or social engineering tactics. The relevant MITRE ATT&CK tactics include Discovery (TA0007) and the technique Active Directory Enumeration (T1087.002).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 for process creation or Sysmon Event ID 1. If malicious, the security impact could be significant as obtaining directory enumeration can aid in further exploitation. This detection does NOT confirm that the individual has malicious intent; legitimate administrative tasks could also trigger this alert.

  ---

  ### Investigation Steps

  - **Review process creation events:** Inspect Windows Security Event ID 4688 or Sysmon Event ID 1 for any instances of process creation involving `ADExplorer.exe` with the command line containing "-snapshot". Check for user accounts consistently executing this command.

  - **Analyze command line arguments:** Ensure that the presence of "snapshot" in the command line of executed processes aligns with known administrative usage patterns. Normal usage typically does NOT call for the snapshot flag in standard operations.

  - **Cross-reference user accounts:** Identify the executing user account of the detected process and assess its role. Accounts belonging to IT staff or valid AD administrators are less suspicious; however, non-privileged accounts using this tool could indicate malicious behavior.

  - **Check against policy or operational procedures:** Validate if there are documented permissions or operational procedures for using ADExplorer for snapshot creation. Lack of authorization may indicate misuse.

  - **Correlate with related detection:** Look for related logs or alerts focused on directory traversal activity or previous reconnaissance attempts by the same user or device. This could strengthen the case for potential malicious intent.

  - **Inspect for subsequent suspicious activity:** Check for any attempts to access, download, or exfiltrate data after the execution of ADExplorer. Artifacts such as unexpected file creations related to AD data should be flagged as high-confidence malicious indicators.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for data extraction that can lead to further attacks within the environment. The likelihood of malicious abuse is moderate, as while ADExplorer is a valid tool, its use with the "-snapshot" flag is generally uncommon and can be weaponized by adversaries for reconnaissance purposes.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logs from process creation are not collected or if users have legitimate reasons to execute ADExplorer with the snapshot flag. Events from low-privileged accounts performing this action may also be overlooked as benign. It's important to be aware of legitimate administrative activities that involve AD data manipulation. Related detections such as suspicious LDAP queries (MITRE ID TLDAP) can enhance context by indicating other types of reconnaissance activity.

