  ---

  ### Technical Context

  This rule detects the execution of `whoami.exe` with the `/all` flag, a command that retrieves detailed information about the user account and groups associated with the current user. The likely attacker objective is to gather extensive information about the system and user privileges, aiding in lateral movement or privilege escalation in an environment.

  This behavior aligns with the MITRE ATT&CK technique for Discovery T1033 (System Owner/User Discovery). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing process execution details. If malicious, this behavior may expose sensitive information, potentially leading to unauthorized access or further exploitation of the network. However, this detection alone does not confirm malicious intent, as `whoami.exe` can be legitimately used in administrative and troubleshooting tasks.

  ---

  ### Investigation Steps

  - **Check event log for process execution**: Review Security Event ID 4688 logs or Sysmon Event ID 1 to confirm `whoami.exe` was executed with the command line containing `/all`. Filter for fields `NewProcessName`, `CommandLine`, and `User` to understand who executed it and under what context.

  - **Analyze user privileges**: Review the user account associated with the command execution. Legitimate activity typically involves service or administrator accounts executing `whoami.exe` for system diagnostics, while execution by low-privileged user accounts may be more suspicious.

  - **Identify related suspicious activities**: Cross-reference the timestamp of the `whoami.exe` execution with other security alerts or logs, such as logins (like Security Event ID 4624) or privilege escalations (Event ID 4672), to identify sequences that suggest hostile intent.

  - **Evaluate system roles and asset criticality**: Determine if the system where `whoami.exe` was executed is critical (e.g., a domain controller or a sensitive server). Elevated risks are associated with execution on high-value assets.

  - **Look for additional reconnaissance tools**: Check for any other command-line tools (e.g., `net user`, `net localgroup`) executed around the same time that could indicate a broader reconnaissance effort.

  - **Record high-confidence indicators**: If `whoami.exe` is identified running with `/all`, confirm the command line specifically includes `-all` without space issues, as legitimate benign usage typically does not utilize this flag in interactive user sessions.

  ---

  ### Prioritization

  The severity of this alert is medium given that while it does not indicate immediate risk, the execution of `whoami.exe /all` could indicate pre-attack reconnaissance behavior. The potential impact of exploitation can be significant, as understanding user and group privileges can enable adversaries to plan further attacks effectively.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion, such as renaming tools or executing commands in a way that does not trigger this specific detection. Ensure proper logging is enforced, especially for event IDs relevant to process creation. Legitimate administrative activities, such as troubleshooting or user management tasks, can trigger this alert. Companion detections that signal unusual privilege escalations or lateral movements (e.g., T1078: Valid Accounts) would enhance contextual awareness and coverage.

