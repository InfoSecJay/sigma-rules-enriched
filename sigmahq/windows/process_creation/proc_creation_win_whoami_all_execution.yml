note: |
  ### Technical Context
  This detection rule focuses on identifying the execution of the Windows utility `whoami.exe` with the `/all` flag. The `whoami` command is often used by both legitimate users for troubleshooting and by attackers for reconnaissance purposes. By executing `whoami.exe /all`, an attacker can gather comprehensive information about the current user’s identity, group memberships, privileges, and other security-related settings that could assist in further compromising the system or lateral movement within the network.

  In this threat scenario, an attacker may leverage this command to understand the environment they have infiltrated better and identify potential targets for escalation or lateral movement. This behavior is typically associated with reconnaissance activities under the MITRE ATT&CK framework, specifically the Discovery tactic (TA0007) with the use of `Account Discovery` (T1033). The aim is to collect as much information as possible to plan subsequent actions effectively.

  The primary data sources for this detection will be process creation logs, which capture details about running processes, including the command line arguments used. Such logs are instrumental in identifying suspicious behavior patterns and understanding potential malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check all recent entries for the `whoami.exe` process execution with the `/all` flag. Note the user account associated with the execution, as well as the time and context in which it occurred.

  - **Analyze Account Privileges**: Investigate the privileges of the user account that executed the command. Look for unusual privilege levels, particularly in accounts that should not have administrative credentials or other elevated access.

  - **Cross-Reference with User Activity**: Correlate the command execution with other logged activities by the user. Verify whether this aligns with legitimate administrative tasks or indicates potential unauthorized reconnaissance.

  - **Monitor for Lateral Movement**: If the command is being executed in conjunction with other suspicious activities, such as unusual network connections or access to sensitive files, consider the possibility of lateral movement within your network.

  ### Prioritization
  Given the potential for `whoami.exe /all` to be employed in a reconnaissance phase of an attack, this alert should be treated with medium severity. It can indicate that an unauthorized user is gathering intelligence on the environment, which may lead to further exploitation attempts.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that legitimate system administrators may also use the `whoami.exe /all` command for valid troubleshooting purposes, which could lead to false positives. The detection logic assumes that there are reasonable baseline behaviors for user commands; excessive deviations from these baselines should be flagged for closer scrutiny. Additionally, the effectiveness of this detection relies on the availability and retention of process creation logs configured correctly on all endpoints within the organization.

