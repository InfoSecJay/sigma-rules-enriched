note: |
  ### Technical Context

  This Sigma rule detects the execution of `whoami.exe` with the `/all` flag, which is often used by attackers to gather extensive details about user privileges and group memberships on a compromised system. The likely objective of an attacker executing this command is to assess the security context within which they are operating, allowing them to exploit further privileges or gather information for lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Discovery, specifically Technique T1033: System Owner/User Discovery.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation) that capture the command-line arguments used during execution. If this behavior is malicious, it could indicate a step in a broader compromise, facilitating further attacks. Importantly, executing this command alone does not confirm malicious intent; legitimate users may execute it for administrative purposes.

  ### Investigation Steps

  - **Check for event logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `whoami.exe` execution. Look for command lines containing `/all` as a critical indicator of interest.

  - **Validate the context of execution:** Determine the user account that executed the command. If it is an admin or service account with elevated privileges, this increases suspicion. Compare with typical user behaviors to identify anomalies.

  - **Review historical usage:** Investigate if `whoami.exe /all` is commonly used by the user or process. Frequent legitimate usage may indicate benign activity, while rare usage can signify potential malicious intent.

  - **Analyze process lineage:** Identify the parent process for the `whoami.exe` execution. Malicious executions may be spawned from unusual or non-interactive processes like scripts or scheduled tasks.

  - **Look for subsequent actions:** Monitor for subsequent suspicious activities following the use of `whoami.exe`, such as credential dumping or lateral movement commands. Indicators of further compromise may include attempts to access sensitive resources or additional command execution.

  - **Assess asset role:** If the affected system is a critical asset (e.g., Domain Controller, sensitive application server), escalate the investigation priority due to potential higher impact from a successful compromise.

  ### Prioritization

  The severity of this alert is medium. The impact of the affected system and the type of user executing the command affects the alert's urgency. Since this behavior can be a precursor to further malicious activities, early detection and investigation are essential to prevent potential escalation.

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate administrative usage of `whoami.exe`, which could lead to false positives. The effectiveness of this detection relies on configured logging of process creation events across endpoints. Additionally, an adversary might execute similar commands using other tools or methods that are less detectable. Implementing companion detections for privilege escalation attempts (e.g., T1068: Exploitation of Elevation Control Mechanism) can enhance overall visibility into potential malicious activities.

