detection:
  selection:
    ParentImage|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    Image|endswith: '\regsvr32.exe'
  filter_main_rpcproxy:
    ParentImage: C:\Windows\System32\cmd.exe
    CommandLine|endswith: ' /s C:\Windows\System32\RpcProxy\RpcProxy.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate ".bat", ".hta", ".ps1" or ".vbs" scripts leverage legitimately 
  often. Apply additional filter and exclusions as necessary
- Some legitimate Windows services
level: medium # Can be reduced to low if you experience a ton of FP
note: |
  ### Technical Context

  This rule detects instances where command-line or scripting processes, such as PowerShell or CMD, spawn the "regsvr32.exe" process with untrusted or suspicious command-line arguments. Malicious actors often use regsvr32 as a means to load and execute malicious Dynamic Link Library (DLL) files in a stealthy manner. This behavior typically aligns with the MITRE ATT&CK technique **"Scripting" (T1218.010)**, which encompasses various scripting engines to execute potentially harmful scripts or commands.

  Primary telemetry sources include Windows process creation logs (particularly Security Event ID 4688) and Sysmon Event ID 1 that capture process creation events. If malicious, this behavior could lead to unauthorized code execution or system compromise. However, this detection does NOT confirm that a compromise has occurred; further context and investigation are needed to ascertain the legitimacy of the regsvr32 invocation.

  ### Investigation Steps

  - **Review process creation logs**: Investigate Security Event ID 4688 and Sysmon Event ID 1 for the command-line details of 'regsvr32.exe'. Look for suspicious arguments such as '/s C:\Windows\System32\RpcProxy\RpcProxy.dll'.

  - **Analyze parent process attributes**: Confirm the parent process for regsvr32. Legitimate instances often originate from trusted binaries such as 'powershell.exe', 'cmd.exe', or 'wscript.exe'. Identify any anomalous parent process associations.

  - **Inspect the command-line**: Check for unusual or non-default parameters being passed to regsvr32. Malicious activity often utilizes uncommon DLLs or sets arguments that appear obfuscated.

  - **Correlate with endpoint activity**: Look for other correlated suspicious activities on the host (e.g., failed logins, unusual web requests) around the same timestamp. For instance, check for any recent PowerShell commands that might suggest an attack vector.

  - **Validate the DLL path**: Determine if the loaded DLL (in this example, RpcProxy.dll) is legitimate. Use checksum validation or threat intelligence sources to assess its reputation.

  - **Identify any known benign scripts**: Review recent execution logs of typical scripts that could invoke regsvr32 legitimately. Determine if any operational or user-driven tasks correspond with the regsvr32 call in question.

  ### Prioritization

  This alert should be considered medium severity. The potential for significant impact exists if regsvr32 is used to execute malicious code, as it can lead to exploitation of the affected system. The likelihood of adversaries employing this tactic is high due to its stealthy nature, making it a commonly weaponized behavior.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the absence of comprehensive logging configurations for process creation events. Legitimate scripting activities (e.g., automation by sysadmins) can trigger the alert, necessitating thorough contextual reviews. A related detection to enhance coverage could include monitoring for the creation/modification of known malicious DLL files in high-risk directories.

