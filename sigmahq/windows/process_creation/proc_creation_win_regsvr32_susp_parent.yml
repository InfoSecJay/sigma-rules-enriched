logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    Image|endswith: '\regsvr32.exe'
  filter_main_rpcproxy:
    ParentImage: C:\Windows\System32\cmd.exe
    CommandLine|endswith: ' /s C:\Windows\System32\RpcProxy\RpcProxy.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate ".bat", ".hta", ".ps1" or ".vbs" scripts leverage legitimately 
  often. Apply additional filter and exclusions as necessary
- Some legitimate Windows services
level: medium # Can be reduced to low if you experience a ton of FP
note: |
  ### Technical Context

  This rule detects instances where command line or scripting engines such as `cmd.exe`, `PowerShell`, or `Wscript` spawn `regsvr32.exe`, a Windows utility used for registering and unregistering OLE controls. This behavior is often exploited by attackers to load malicious DLLs while evading application whitelisting mechanisms or executing payloads in a stealthy manner. The likely attacker objective is to execute malicious code by triggering the registration of a rogue DLL, facilitating persistence or further exploitation.

  This activity is mapped to the MITRE ATT&CK technique T1218.010: "Signed Binary Proxy Execution". The primary telemetry sources include process creation logs (Windows Event ID 4688), which capture information about process invocations and their parent-child relationships. If malicious, this behavior can lead to full system compromise and lateral movement within an organization. However, this detection does NOT confirm that a compromise has occurred without additional context or verification, as legitimate uses of `regsvr32.exe` also exist.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 to analyze the command line of the `regsvr32.exe` process. Look for user accounts and execution paths to assess if they deviate from known norms or show signs of compromise.

  - **Evaluate parent process**: Validate the parent process that invoked `regsvr32.exe`. A legitimate parent process such as `powershell.exe` or `cmd.exe` may be benign, but unexpected or unknown parent processes should raise suspicion.

  - **Inspect command line arguments**: Analyze the command line arguments used with the `regsvr32.exe` invocation. Malicious commands often include specific flags or references to anomalous DLL paths, particularly those attempting to load `RpcProxy.dll`.

  - **Identify high-confidence malicious indicators**: Observe any command line entries that contain path patterns such as `C:\Windows\System32\RpcProxy\RpcProxy.dll`, especially when combined with unusual parent processes or suspicious user accounts.

  - **Determine expected behavior**: Compare against known legitimate usage scenarios, such as trusted scripts explicitly invoking `regsvr32.exe`. If the invocation aligns with expected legitimate operations, it may lessen the alert's urgency.

  - **Assess asset criticality**: If `regsvr32.exe` is spawned on critical assets such as domain controllers or servers hosting sensitive applications, escalate the investigation promptly as the risk is significantly higher.

  ### Prioritization

  This alert should be considered medium priority, particularly if observed on critical systems. The likelihood of malicious exploitation is elevated due to the nature of `regsvr32.exe`, which is frequently weaponized by adversaries to execute DLLs stealthily. However, common scenarios may result in false positives, hence the need for careful analysis.

  ### Blind Spots and Assumptions

  This detection may miss instances where `regsvr32.exe` is invoked without well-known parent processes or in environments where logging is not robust. Not all legitimate command/script executions are covered, so some benign automation may trigger this alert. Additionally, adversaries may employ other signed binaries for similar exploits, such as `mshta.exe`. A companion detection for analyzing `mshta.exe` behavior enhances overall detection coverage against similar techniques.

