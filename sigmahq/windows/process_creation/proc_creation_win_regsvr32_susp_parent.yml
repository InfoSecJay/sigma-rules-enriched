logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    Image|endswith: '\regsvr32.exe'
  filter_main_rpcproxy:
    ParentImage: C:\Windows\System32\cmd.exe
    CommandLine|endswith: ' /s C:\Windows\System32\RpcProxy\RpcProxy.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate ".bat", ".hta", ".ps1" or ".vbs" scripts leverage legitimately often.
  Apply additional filter and exclusions as necessary
- Some legitimate Windows services
level: medium # Can be reduced to low if you experience a ton of FP
note: |
  ### Technical Context
  This detection rule identifies instances where command-line interfaces or scripting engines, such as PowerShell or WScript, initiate a process for `regsvr32.exe`. `Regsvr32` is a legitimate Microsoft utility used to register and unregister COM components. However, attackers may exploit `regsvr32` to execute malicious code or to bypass application whitelisting mechanisms. By spawning `regsvr32` through a script or command-line interface, adversaries can obfuscate their actions and evade security controls.

  The potential threat scenarios include an attacker using this method to load a malicious DLL or perform other malicious actions under the guise of a legitimate process. The primary objective is often to gain persistence or escalate privileges within the target environment. This behavior aligns with the MITRE ATT&CK framework, particularly with the tactics of **Defense Evasion** (TA0005) and the technique of **System Script Proxy Execution** (T1218.010).

  Key data sources for this detection include process creation logs that detail the command-line arguments used to spawn processes, as these logs provide insight into both parent and child processes and their interactions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation logs to find instances of `regsvr32.exe` that were spawned by unusual parent processes. Focus on command-line arguments for any red flags.

  - **Examine Command-Line Arguments:** Pay particular attention to the command-line arguments used with `regsvr32.exe`. Look for suspicious DLL file paths or options that may indicate malicious intent (e.g., `/s C:\Windows\System32\RpcProxy\RpcProxy.dll`).

  - **Analyze Source Scripts:** Identify any scripts (such as `.bat`, `.ps1`, or `.vbs`) that may have triggered this activity. Verify the legitimacy and source of these scripts to assess whether they have been tampered with or are being misused.

  - **Correlate with Other Events:** Check for related log events that may indicate broader malicious behavior, such as unusual network connections, privilege escalation attempts, or other process anomalies that coincide with the detection time frame.

  ### Prioritization
  This alert should be considered medium risk due to the potential for significant impact if `regsvr32` is leveraged for malicious purposes. The likelihood of encountering such techniques is moderate, especially in environments where application whitelisting is either poorly implemented or absent.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where legitimate use of scripting engines and `regsvr32` is prevalent, leading to false positives. The detection logic assumes that suspicious script executions are not normal operating procedures within the organization. Required logs include detailed process creation events with command-line information; if such logs are not collected or have insufficient retention, the detection may not function effectively.

