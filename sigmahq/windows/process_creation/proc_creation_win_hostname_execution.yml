  ### Technical Context

  This rule detects the execution of the `hostname.exe` command, a built-in Windows utility that returns the hostname of the machine. The behavior typically indicates an attempt by an adversary to gather system information, which can be part of the initial reconnaissance phase. The likely attacker objective is to understand the topology of the environment, which aligns with the MITRE ATT&CK technique T1082 (System Information Discovery).

  Primary telemetry for this detection includes Windows Process Creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing process execution events. If executed maliciously, this can indicate a reconnaissance effort by an attacker who may be trying to identify and target specific systems within the network. This detection does NOT confirm malicious intent on its own; it merely indicates that the command was executed.

  ### Investigation Steps

  - **Check process execution details:** Review Event ID 4688 logs for execution of `hostname.exe`, specifically checking the `New Process Name` and `Command Line` fields for unusual parameters or context.

  - **Identify user account context:** Verify the user account that executed `hostname.exe` by examining the `Subject User Name` field in the Event ID logs. Look for accounts with elevated privileges or context that is inconsistent with standard operations.

  - **Review recent system changes:** Investigate the time of execution against recent changes in the system, such as software installs or updates, noted in the System event logs (Event IDs 6005, 6006) to identify any correlations.

  - **Validate expected application behavior:** Confirm that `hostname.exe` was executed in a standard operational manner (e.g., by administrative accounts during scheduled maintenance). Legitimate usages are typically part of batch scripts or administrative tasks.

  - **Check for command line arguments:** If present, examine arguments passed to `hostname.exe` in the command line. Unusual or complex arguments, especially those initiating other commands or tools, could indicate malicious behavior.

  - **Correlate with other reconnaissance activity:** Investigate other logs (e.g., security logs or network logs) to see if there were concurrent attempts of system information gathering, such as `net commands` or `ipconfig`.

  ### Prioritization

  The alert severity is low; while it signals potential reconnaissance activity, `hostname.exe` can also be legitimately executed by administrative processes. The likelihood of malicious abuse exists but is generally not high, as this command is commonly used in normal administrative functions.

  ### Blind Spots and Assumptions

  Detection may be limited if process logging is not configured appropriately, particularly if using Sysmon. Legitimate administrative tasks or automated scripts could trigger this alert. A related detection, such as monitoring for the use of command-line tools or other discovery utilities (like `ipconfig` or `netstat`), could enhance reconnaissance detection coverage.

