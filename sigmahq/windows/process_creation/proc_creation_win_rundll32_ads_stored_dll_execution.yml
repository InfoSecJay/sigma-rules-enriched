title: Potential Rundll32 Execution With DLL Stored In ADS
id: 9248c7e1-2bf3-4661-a22c-600a8040b446
status: test
description: Detects execution of rundll32 where the DLL being called is stored 
  in an Alternate Data Stream (ADS).
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rundll32
author: Harjot Singh, '@cyb3rjy0t'
date: 2023-01-21
modified: 2026-03-16
tags:
- attack.stealth
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
        # Example:
        #   rundll32 "C:\ads\file.txt:ADSDLL.dll",DllMain
        # Note: This doesn't cover the use case where a full path for the DLL isn't used. As it requires a more expensive regex
    CommandLine|re: '[Rr][Uu][Nn][Dd][Ll][Ll]32(?:\.[Ee][Xx][Ee])? \S+?\w:\S+?:'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` where the DLL being invoked is stored in an Alternate Data Stream (ADS). Such behavior is often leveraged by attackers to hide malicious payloads, thereby evading traditional detection mechanisms and maintaining persistence. The likely attacker objective is to execute malicious code discreetly, circumventing security controls that might monitor standard file execution paths.

  This detection correlates to the MITRE ATT&CK technique **"Hidden Files and Directories" (T1564.004)** under the tactic of **"Defense Evasion."** The primary telemetry source is Windows process creation logs, specifically monitoring event IDs 4688 (Security Event), which captures process execution details.

  While alerts from this detection indicate the potential for malicious activity, they do not confirm that the execution was indeed malicious, as legitimate applications may also invoke `rundll32` with DLLs stored in ADS for valid purposes.

  ### Investigation Steps

  - **Examine the process creation log**: Review Security Event ID 4688 for process details, including the `CommandLine` field. Look specifically for command lines containing `rundll32` and references to paths with `:` indicating ADS usage, such as `C:\ads\file.txt:ADSDLL.dll`.

  - **Identify the DLL path**: Verify the source of the DLL in the command line. If it points to a non-standard location or is an unknown file (e.g., not part of a known application), this could indicate malicious activity.

  - **Check file properties**: Utilize Sysinternals tools like `streams.exe` or PowerShell to inspect the ADS of the file specified in the command line. Legitimate ADS usage is rare; a file with an ADS should be scrutinized for malicious code or unusual behaviors.

  - **Validate against known software**: Assess if the `rundll32.exe` command ties back to legitimate software. Cross-reference the file’s hash against reputable sources or antivirus databases to look for any known malicious signatures.

  - **Audit host behavior**: Investigate other processes initiated within a short time frame before or after the `rundll32` invocation. Evaluate for unusual network connections (Event ID 5156 for Windows Filtering Platform), especially to external IP addresses, which may signal data exfiltration or command-and-control communications.

  ### Prioritization

  This alert should be treated with high severity due to the potential security impact on the host system and the likelihood of exploitation. `Rundll32.exe` is a commonly abused tool by adversaries for evasion, making this behavior a critical area for investigation in a mature enterprise environment.

  ### Blind Spots and Assumptions

  The detection capabilities are limited by the logging configuration of the relevant systems; a lack of adequate process creation logging could hinder visibility. Legitimate applications may use `rundll32` with ADS for benign purposes, such as loading configurations or plugins, complicating investigation. A companion detection rule monitoring other suspicious behaviors around the same timeframe, such as file modification or network anomalies, would enhance overall detection efficacy.

