logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
        # Example:
        #   rundll32 "C:\ads\file.txt:ADSDLL.dll",DllMain
        # Note: This doesn't cover the use case where a full path for the DLL isn't used. As it requires a more expensive regex
    CommandLine|re: '[Rr][Uu][Nn][Dd][Ll][Ll]32(\.[Ee][Xx][Ee])? \S+?\w:\S+?:'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of `rundll32.exe` with a dynamic link library (DLL) that is stored in an Alternate Data Stream (ADS). This behavior is often associated with tactics employed to evade detection, as using ADS can hide malicious files from standard file system searches. The likely objective of the attacker is to execute code in a way that circumvents traditional security measures, potentially leading to privilege escalation or lateral movement within the environment.

  The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1564.004) and Execution (T1203). Primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events. If confirmed malicious, this activity could lead to a significant compromise of the affected system. It’s crucial to note that this detection alone does not confirm a security breach; it merely indicates unusual execution patterns that warrant further investigation.

  ### Investigation Steps

  - **Check Event IDs for process creation:** Review Security Event ID 4688 and Sysmon Event ID 1 to identify any executions of `rundll32.exe` with the command line indicating the presence of an ADS (e.g., "rundll32 'C:\ads\file.txt:ADSDLL.dll',DllMain").

  - **Review command line arguments:** Look for command lines that follow the pattern `"[Rr][Uu][Nn][Dd][Ll][Ll]32(\.[Ee][Xx][Ee])? \S+?\w:\S+?:". Investigate further if the command includes unusual DLL names or paths.

  - **Identify high-confidence malicious indicators:** Cross-reference the identified DLL call with known malicious DLL signatures or hashes from threat intelligence feeds. Investigate further if the DLL is unrecognized or comes from a suspicious path.

  - **Validate legitimate behavior:** Ensure no business-critical applications use `rundll32.exe` with ADS during your investigation. Typical benign use includes administrative scripts or applications invoking legitimate system functions.

  - **Examine for additional artifacts:** Look for file creation events in the same ADS path using Windows file system logs. Track any `file.txt:ADSDLL.dll` creation or modification that suggests malicious intent.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems. The use of ADS for executing code with `rundll32.exe` is a known tactic among threat actors, marking this behavior as a significant risk. As such, it should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not properly configured to capture command line arguments or if ADS usage is legitimate in the environment. Additionally, some administrative tools may use similar techniques, leading to false positives. Monitoring for companion detections, such as file access patterns in directories related to ADS, can strengthen coverage against these attacks.

