title: Potential Rundll32 Execution With DLL Stored In ADS
id: 9248c7e1-2bf3-4661-a22c-600a8040b446
status: test
description: Detects execution of rundll32 where the DLL being called is stored in
  an Alternate Data Stream (ADS).
references:
- https://lolbas-project.github.io/lolbas/Binaries/Rundll32
author: Harjot Singh, '@cyb3rjy0t'
date: 2023-01-21
modified: 2023-02-08
tags:
- attack.defense-evasion
- attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
        # Example:
        #   rundll32 "C:\ads\file.txt:ADSDLL.dll",DllMain
        # Note: This doesn't cover the use case where a full path for the DLL isn't used. As it requires a more expensive regex
    CommandLine|re: '[Rr][Uu][Nn][Dd][Ll][Ll]32(\.[Ee][Xx][Ee])? \S+?\w:\S+?:'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of `rundll32.exe` where the Dynamic-Link Library (DLL) being called is located in an Alternate Data Stream (ADS). ADS is a feature of the NTFS file system that allows files to contain additional streams of data, which can be exploited by adversaries to conceal malicious payloads. In this context, an attacker may use `rundll32.exe` to execute malicious code hidden in ADS, evading traditional security measures and potentially maintaining persistence on a compromised system.

  The suspected threat scenario involves an attacker aiming to obfuscate their actions by storing DLLs in ADS and using `rundll32.exe` to execute the code without direct visibility in common directory listings. It is a technique associated with the MITRE ATT&CK framework under the tactic of Defense Evasion, specifically technique T1564.004, which highlights the use of alternate data streams for malicious purposes. The telemetry needed to effectively detect this activity resides in process creation logs that capture details on commands executed, enabling further investigation of suspicious executions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs for entries where `rundll32.exe` is invoked. Pay close attention to the `CommandLine` field for any unusual parameters that might indicate ADS usage.
  - **Analyze Command-Line Arguments:** Specifically filter for command-line arguments that reference file paths ending with a colon (e.g., "C:\path:filename.dll"). This may suggest the presence of an ADS being executed, providing vital context for further action.
  - **Correlate with File System Auditing:** Check file system logs to identify any newly created or modified files in NTFS ADS format. Cross-reference these with the timestamps of `rundll32.exe` executions to pinpoint any potentially malicious activity.
  - **Investigate Suspicious DLLs:** Any detected DLL references should be investigated by checking their hashes against threat intelligence databases. Validate if they are known malicious files or if they exhibit any unusual behaviors.

  ### Prioritization
  The alert is categorized as high severity due to the potential impact of executing arbitrary code on endpoints, which could lead to data breaches, lateral movement, or initial access to an enterprise network. Given the stealthy nature of ADS, the likelihood of missed detections increases, necessitating immediate attention.

  ### Blind Spots and Assumptions
  This detection logic may miss instances where the full path to the DLL is not utilized, as the regex pattern designed to capture command lines may not cover those cases comprehensively. Additionally, it assumes that process creation events are adequately logged and that ADS activity is being monitored. If the auditing level is not set correctly, relevant logs may be inaccessible, leading to gaps in detection capability.

