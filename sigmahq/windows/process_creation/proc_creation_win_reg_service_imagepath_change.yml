logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
    - 'add '
    - 'SYSTEM\CurrentControlSet\Services\'
    - ' ImagePath '
  selection_value:
    CommandLine|contains|windash: ' -d '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects changes to the `ImagePath` value of Windows services via the `reg.exe` command-line utility. This behavior is typically associated with adversaries attempting to execute malicious payloads by hijacking legitimate service configurations, allowing their code to run at service start. The attacker likely aims to establish persistence or elevate privileges by running unauthorized binaries instead of legitimate service executables.

  Relevant MITRE ATT&CK tactics include **Persistence** and **Privilege Escalation** with the technique ID **T1574.011** (Patch System Image). The primary telemetry source is process creation logs, particularly Windows Security Event ID **4688** and Sysmon Event ID **1** for monitoring command executions. If malicious, this activity could lead to unauthorized access and control over the system. Importantly, this detection does NOT confirm that malicious activity was successful, only that a potentially suspicious change has occurred.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID **4688** for `reg.exe` invocations. Look for command line arguments that contain `add` with the path `SYSTEM\CurrentControlSet\Services\` and `ImagePath`. Malicious indicators would show unusual executable paths unrelated to known service binaries.

  - **Validate legitimate activity:** Cross-reference service configuration changes against administrative change records or a known baseline. Legitimate changes typically come from authorized users or scheduled maintenance activities, not from unexpected or unauthorized command executions.

  - **Correlate with Sysmon logs:** Analyze Sysmon Event ID **1** for detailed command-line information and parent processes. Multiple initiations of `reg.exe` from non-administrative users could indicate a malicious attempt and is a high-confidence indicator.

  - **Inspect related services:** Use `sc query` to list services and confirm if any have been altered. Check the `ImagePath` values against the original configurations to identify unauthorized tampering.

  - **Examine registry access permissions:** Look at the registry permissions for relevant paths (`HKLM\SYSTEM\CurrentControlSet\Services`) using `regedit` or PowerShell to determine if the access control settings allow for tampering by non-administrative accounts.

  ### Prioritization

  This alert is medium severity due to the potential impact on critical Windows services. Its likelihood of malicious exploitation is moderate since service hijacking is a known technique among adversaries. While this behavior may not directly cause harm, it serves as a precursor to later exploitations.

  ### Blind Spots and Assumptions

  Detection relies heavily on accurate logging configurations for Windows Event IDs and Sysmon events. Adversaries might attempt to evade detection through alternate methods for modifying service configurations or by using scripting to manipulate registry values instead of `reg.exe`. Additionally, legitimate administrative actions or service updates could trigger this alert, requiring careful context to differentiate true threats. Related detections such as unexpected or unusual service start events (e.g., suspicious services initiating from non-standard locations) will enhance coverage.

