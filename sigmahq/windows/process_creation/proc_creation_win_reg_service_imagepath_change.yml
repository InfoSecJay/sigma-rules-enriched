logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
    - 'add '
    - 'SYSTEM\CurrentControlSet\Services\'
    - ' ImagePath '
  selection_value:
    CommandLine|contains|windash: ' -d '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts by adversaries to alter the `ImagePath` of Windows services using the `reg.exe` command-line tool. Such modifications are typically aimed at executing malicious payloads by redirecting service execution to an adversary-controlled file at startup. The relevant MITRE ATT&CK tactics are **Persistence** and **Privilege Escalation** (T1574.011). Primary telemetry sources include Windows process creation logs specifically monitoring command-line executions involving `reg.exe` and the registry. If successful, such modifications can grant an attacker sustained control over a system and facilitate further exploitation. Importantly, this detection does NOT confirm that the behavior is unequivocally malicious; further investigation is needed to establish context.

  ### Investigation Steps

  - **Review process creation logs for reg.exe usage:** Investigate Security Event ID 4688 or Sysmon Event ID 1 for instances of `reg.exe` with a command line containing `add` and `ImagePath`. Look for unusual service names or paths that are not typical for the environment.

  - **Identify high-confidence malicious indicators:** Check for instances where the `ImagePath` value points to an unusual or non-standard executable, especially those located outside of known application directories (e.g., `C:\Program Files`, `C:\Windows`).

  - **Analyze legitimate service modifications:** Consider whether there are known maintenance windows or admin-approved changes involving service reg modifications. Normal administrative commands typically relate to application updates or configurations.

  - **Examine registry permissions and recent changes:** Access the registry at `HKLM\SYSTEM\CurrentControlSet\Services` to review recent modifications. Note any changes made to `ImagePath` that deviate from established service parameters or have not been thoroughly documented.

  - **Correlate with user activity logs:** Cross-verify the timestamps of the `reg.exe` command execution with user activity logs (like login/logout events) through Event IDs 4624 and 4625 to identify if an unexpected or malicious user triggered the command.

  ### Prioritization

  The alert is rated as medium severity due to the potential impact on the affected system if a malicious payload is executed as a service. The likelihood of malicious exploitation is moderate given that service image manipulations are a known tactic among attackers. This behavior is often weaponized in targeted attacks, especially for persistence.

  ### Blind Spots and Assumptions

  This detection may miss modified `ImagePath` changes made through other means (like PowerShell or third-party scripts), highlighting a limitation in solely relying on `reg.exe`. Required log sources need to be consistently available; thus, ensure auditing for process creation is enabled across endpoints. Legitimate software updates or automated deployment tools may trigger similar activities, hence requiring contextual awareness. A companion detection to consider is monitoring PowerShell command executions that may also manipulate service configurations to provide enhanced visibility and coverage.

