title: Changing Existing Service ImagePath Value Via Reg.EXE
id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
status: test
description: |
  Adversaries may execute their own malicious payloads by hijacking the Registry entries used by services.
  Adversaries may use flaws in the permissions for registry to redirect from the originally specified executable to one that they control, in order to launch their own code at Service start.
  Windows stores local service configuration information in the Registry under HKLM\SYSTEM\CurrentControlSet\Services
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.011/T1574.011.md#atomic-test-2---service-imagepath-change-with-regexe
author: frack113
date: 2021-12-30
modified: 2024-03-13
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains|all:
    - 'add '
    - 'SYSTEM\CurrentControlSet\Services\'
    - ' ImagePath '
  selection_value:
    CommandLine|contains|windash: ' -d '
  condition: all of selection*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts by adversaries to alter the ImagePath value of Windows services using the `reg.exe` command-line utility. Attackers often manipulate this registry entry to redirect service execution from the legitimate service executable to a malicious payload under their control. This tactic allows them to execute arbitrary code with system privileges when the compromised service starts, facilitating persistence on the affected system.

  The likely scenario could involve an attacker gaining initial access to a system and subsequently escalating their privileges or maintaining persistence through unauthorized alterations to service configurations. This technique aligns with the MITRE ATT&CK framework, specifically under the Persistence tactic, where it is mapped to technique T1574.011 (Registry Run Keys / Startup Folder) and may also fall under Defense Evasion and Privilege Escalation categories.

  Primary data sources for this detection include process creation events that log command-line activity, particularly those involving registry modifications. Monitoring from EDR solutions will yield vital insights into process creations associated with `reg.exe` and its usage in potentially malicious contexts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events for instances where `reg.exe` is executed with command-line arguments indicating a change to the ImagePath value within the `HKLM\SYSTEM\CurrentControlSet\Services` location. Focus on understanding the context and user under which these commands were executed.
  - **Inspect Registry Changes:** Utilize registry auditing tools or manual logging to check for recent changes to service registry keys, specifically the `ImagePath` values, to identify unauthorized modifications and the timeline of these changes.
  - **Check for Unusual Service Activity:** Look for signs of abnormal behavior or unexpected restarts of services that may have had their ImagePath values modified, which could suggest that a malicious payload is being executed on service startup.
  - **Correlate with Other Threat Intelligence:** Cross-reference findings with existing threat intelligence data to identify known malicious patterns or indicators related to alterations in service ImagePath configurations.

  ### Prioritization
  Given the potential for escalated privileges and persistence enabled by modifying service configurations, alerts generated by this rule should be considered medium to high priority. The impact of successful execution can compromise system integrity and security posture, making prompt investigation essential.

  ### Blind Spots and Assumptions
  This detection rule may not capture all methods of service hijacking, especially if adversaries utilize alternative tools or methods to manipulate service configurations. The detection logic assumes that command-line activity for `reg.exe` will be logged; thus, any environment not capturing this level of detail in process creation logs could be at risk. Moreover, the rule presumes that the registry permissions are not properly hardened, which might create false negatives in environments with stringent access controls. Properly configured logging for process creation and registry changes is crucial for effective detection.

