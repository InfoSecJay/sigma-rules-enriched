title: PUA - Kernel Driver Utility (KDU) Execution
id: e76ca062-4de0-4d79-8d90-160a0d335eca
status: experimental
description: |
  Detects execution of the Kernel Driver Utility (KDU) tool.
  KDU can be used to bypass driver signature enforcement and load unsigned or malicious drivers into the Windows kernel.
  Potentially allowing for privilege escalation, persistence, or evasion of security controls.
references:
- https://github.com/h4rmy/KDU
- https://huntress.com/blog/esxi-vm-escape-exploit
author: Matt Anderson, Dray Agha, Anna Pham (Huntress)
date: 2026-01-02
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\kdu.exe'
    - '\hamakaze.exe'
  - OriginalFileName: 'hamakaze.exe'
  selection_cli_suspicious:
    CommandLine|contains:
    - '-map '         # map driver to the kernel and execute it entry point
    - '-prv '         # optional, select vulnerability driver provider
    - '-dse '         # write user defined value to the system DSE state flags; dse=0(disable),dse=1(enable)
    - '-ps '         #  modify process object of given ProcessID;
  condition: all of selection_*
falsepositives:
- Legitimate driver development, testing, or administrative troubleshooting 
  (e.g., enabling/disabling hardware)
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_pua_kdu_driver_tool/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Kernel Driver Utility (KDU), a tool commonly used to load unsigned drivers into the Windows kernel, bypassing driver signature enforcement. The likely objective of an attacker using KDU is to escalate privileges, establish persistence, or evade existing security controls, thereby compromising system integrity and confidentiality. This behavior aligns with the MITRE ATT&CK framework, specifically under the tactics of Persistence and Privilege Escalation (TA0003, TA0004) and the technique T1543.003 (Create or Modify System Process: Windows Service).

  The primary telemetry sources required for this detection are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact could range from unauthorized access to systems to full control over sensitive data and services. Importantly, this detection does NOT indicate that malicious activity has occurred; legitimate uses for KDU may include development or administrative troubleshooting.

  ### Investigation Steps

  - **Check process creation logs for KDU execution:** Review Security Event ID 4688 logs for KDU-related process creation. Look for the image name ending with `kdu.exe` or `hamakaze.exe`. A legitimate context typically includes system administrator actions within designated maintenance windows.

  - **Analyze command-line arguments:** Inspect the CommandLine parameter in Sysmon Event ID 1 logs for suspicious arguments like `-map`, `-prv`, `-dse`, or `-ps`. The presence of these flags, especially `-dse`, may indicate intent to change the Device Security Enforcement state, which is highly indicative of malicious behavior.

  - **Investigate related file locations:** Validate the file paths from which `kdu.exe` or `hamakaze.exe` was executed. Execute path checks against known safe directories, as execution from non-standard paths (e.g., user directories) significantly raises the threat level.

  - **Correlate with other telemetry sources:** Cross-reference with Windows Event Logs for system changes such as driver installations (Event ID 20001). Unexpected modifications or installations could point to a malicious attempt to leverage KDU for persistence.

  - **Review user and system account information:** Investigate the context in which KDU was executed by checking the user account associated with the process. Privileged or unexpected accounts executing KDU enhance suspicion of malicious intent.

  ### Prioritization

  This alert has a high severity due to the critical nature of kernel-level modifications and potential privilege escalation involved in executing KDU. Given that KDU attempts to bypass security controls, successful exploitation could lead to significant impact across the enterprise, alongside being a commonly weaponized tool in attacks.

  ### Blind Spots and Assumptions

  Possible evasion techniques include execution of KDU from legitimate-looking paths or under legitimate user accounts, which can obscure intent. Detection relies upon proper logging configurations for process creation and Sysmon Event tracking. Legitimate administrative activities sometimes trigger this alert, emphasizing the need for contextual awareness in investigations. A related detection to consider is monitoring for unauthorized driver installations, which can complement visibility into malicious KDU use and driver manipulation activities.

