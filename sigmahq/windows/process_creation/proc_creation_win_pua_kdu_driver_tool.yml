title: PUA - Kernel Driver Utility (KDU) Execution
id: e76ca062-4de0-4d79-8d90-160a0d335eca
status: experimental
description: |
  Detects execution of the Kernel Driver Utility (KDU) tool.
  KDU can be used to bypass driver signature enforcement and load unsigned or malicious drivers into the Windows kernel.
  Potentially allowing for privilege escalation, persistence, or evasion of security controls.
references:
- https://github.com/h4rmy/KDU
- https://huntress.com/blog/esxi-vm-escape-exploit
author: Matt Anderson, Dray Agha, Anna Pham (Huntress)
date: 2026-01-02
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\kdu.exe'
    - '\hamakaze.exe'
  - OriginalFileName: 'hamakaze.exe'
  selection_cli_suspicious:
    CommandLine|contains:
    - '-map '         # map driver to the kernel and execute it entry point
    - '-prv '         # optional, select vulnerability driver provider
    - '-dse '         # write user defined value to the system DSE state flags; dse=0(disable),dse=1(enable)
    - '-ps '         #  modify process object of given ProcessID;
  condition: all of selection_*
falsepositives:
- Legitimate driver development, testing, or administrative troubleshooting (e.g.,
  enabling/disabling hardware)
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_pua_kdu_driver_tool/info.yml
note: |
  ### Technical Context
  This detection rule targets the execution of the Kernel Driver Utility (KDU), a tool that can manipulate Windows kernel driver behavior. KDU allows attackers to bypass driver signature enforcement, enabling the loading of unsigned or malicious drivers into the operating system. This capability poses significant risks, including privilege escalation, persistence mechanisms, and evasion of security controls, thereby facilitating further exploitation of compromised systems.

  The primary threat scenario includes an adversary attempting to gain unauthorized access to sensitive resources, leveraging KDU to install malicious drivers that grant backdoor access, alter system integrity, or maintain a foothold in the environment. The likely attacker objectives revolve around privilege escalation to the kernel level and maintaining long-term persistence, which can lead to severe impacts on organizational security posture.

  The applicable MITRE ATT&CK tactics for this detection include:
  - **Persistence** (TA0003)
  - **Privilege Escalation** (TA0004)
  - **T1543.003 - Create or Modify System Process: Windows Service)

  The main data source for this detection is process creation events on Windows systems, which will capture when KDU or similarly suspicious binaries are executed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for entries showing execution of `kdu.exe` or `hamakaze.exe`. Pay special attention to the original file names and the paths from which these executables are launched.
  - **Analyze Command Line Arguments:** Look for process initiation involving KDU with suspicious command line arguments such as `-map`, `-prv`, `-dse`, or `-ps`. These parameters indicate potentially malicious activities aimed at altering kernel driver functionalities.
  - **Inspect Driver Installation Events:** Assess whether any unsigned or malicious drivers were loaded around the same time as the KDU execution. Check the Windows Event Logs for any events that indicate changes to the driver state or installation.
  - **Coordinate with Endpoint Detection:** Engage with EDR solutions to analyze any alerts related to abnormal driver behavior. Explore automated responses to any detected kernel-level manipulations, especially those involving unauthorized drivers.

  ### Prioritization
  Given that the detection of KDU execution can indicate a significant compromise of the system's integrity with potential for privilege escalation, this alert is assigned a high severity level. The likelihood of exploitation through kernel driver manipulation in an enterprise environment is critical and warrants immediate investigation.

  ### Blind Spots and Assumptions
  A notable gap in detection coverage may include systems where KDU and its execution are legitimately used, such as in driver development or testing environments, which can lead to false positives. The detection logic assumes that KDU will always be executed with specific command line arguments, which may not cover all operational use cases. Additionally, for this alert to function effectively, full process creation logs must be retained and monitored, necessitating proper logging configurations on Windows systems.

