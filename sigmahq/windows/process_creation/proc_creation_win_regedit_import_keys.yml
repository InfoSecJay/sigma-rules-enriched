logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\regedit.exe'
  - OriginalFileName: 'REGEDIT.EXE'
  selection_cli:
    CommandLine|contains:
    - ' /i '
    - ' /s '
    - '.reg'
  filter_1:
    CommandLine|contains|windash:
    - ' -e '
    - ' -a '
    - ' -c '
  filter_2:
    CommandLine|re: ':[^ \\]'         # to avoid intersection with ADS rule
  condition: all of selection_* and not all of filter_*
falsepositives:
- Legitimate import of keys
- Evernote
level: medium
note: |
  ### Technical Context

  This rule detects the use of `regedit.exe` to import a registry key from a file, typically via command line switches that specify registry files (e.g., `.reg`). Attackers may aim to alter system configuration, evade detection, or maintain persistence through this method. This behavior aligns with the MITRE ATT&CK technique for "Modify Registry" (T1112).

  Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688, which captures process activity along with command-line parameters. If the activity is malicious, it could introduce backdoors or alter security settings, compromising system integrity. Importantly, this detection does NOT alone confirm malicious intent, as legitimate administrative tasks may also trigger this alert.

  ### Investigation Steps

  - **Review process creation events:**
    Check Windows Security Event ID 4688 for instances of `regedit.exe` with command line parameters that include `/i` or `/s` and `.reg`. Look for unusual parent processes like scripts or unknown applications.

  - **Correlate with recent registry changes:**
    Monitor for any changes made to the registry following the execution of `regedit.exe`. Focus on the Impact of the keys modified; legitimate administrative tasks will typically record expected keys related to configuration changes.

  - **Identify notable command line arguments:**
    Investigate command lines that contain suspicious arguments like `-e`, `-a`, or `-c`, which may indicate less common usage patterns following imports, suggesting potential misuse.

  - **Validate against legitimate activity:**
    Compare against known benign instances of `regedit.exe` imports executed by trusted admin accounts or services (e.g., Evernote). Look for typical patterns where no manipulation of critical system keys occurs.

  - **Assess for high-confidence indicators:**
    Identify any command lines importing unusual or sensitive registry keys (e.g., security configurations, persistence keys). Document these instances and correlate them with endpoint telemetry indicating unusual behavior.

  ### Prioritization

  The severity of this alert is medium due to the potential risk of persistence and manipulation of system settings. The likelihood of abuse exists, especially in environments where admin privileges are misused. While this method is not the most common attack vector, it can be weaponized during advanced persistence threats.

  ### Blind Spots and Assumptions

  This detection may miss obfuscated command lines or process execution from unauthorized scripts that use `regedit` to import keys. Additionally, if logs for process creation are not configured correctly across all endpoints, detection capabilities will be limited. Legitimate tasks, such as authorized configuration management, may also trigger the alert. Companion detections like monitoring for registry access modifications can enhance overall coverage and context on actions taken.

