detection:
  selection_img:
  - Image|endswith: '\regedit.exe'
  - OriginalFileName: 'REGEDIT.EXE'
  selection_cli:
    CommandLine|contains:
    - ' /i '
    - ' /s '
    - '.reg'
  filter_1:
    CommandLine|contains|windash:
    - ' -e '
    - ' -a '
    - ' -c '
  filter_2:
    CommandLine|re: ':[^ \\]'         # to avoid intersection with ADS rule
  condition: all of selection_* and not all of filter_*
falsepositives:
- Legitimate import of keys
- Evernote
level: medium
note: |
  ### Technical Context
  This rule detects the importation of registry keys using `regedit.exe`, specifically when an attacker attempts to persist malicious changes to the Windows registry. The ability to manipulate the registry can enable various attack objectives, such as establishing persistence, evading detection, or altering system behavior to the attacker's advantage. An attacker might employ this technique to install a persistence mechanism that automatically re-establishes their presence after system reboots or to modify security settings.

  Relevant MITRE ATT&CK tactics include **Persistence (T1547)** and **Defense Evasion (T1112)**, which encompass methods used by malicious actors to maintain access and obfuscate their activities. Attackers may exploit registry manipulations to evade detection by security solutions, making it critical to monitor these activities closely. Primary data sources for detecting these actions include process creation logs that capture command-line arguments used by applications, which can provide insight into unauthorized or suspicious registry modifications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for instances of `regedit.exe` executed with unusual command-line arguments, particularly those involving `.reg` files, `/i`, or `/s` switches.
  - **Correlate with User Activity**: Investigate the user context under which the registry modifications were made. Look for anomalies such as unfamiliar user accounts or usage patterns outside of expected administrative tasks.
  - **Analyze Registry Changes**: If possible, pull and analyze the registry snapshots before and after the event to identify what keys were modified or added. Pay attention to sensitive areas like `HKLM` and `HKCU`.
  - **Check for Known Malicious Patterns**: Use threat intel feeds to compare the registry changes against known malicious indicators, looking for signatures associated with common malware behaviors.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of unauthorized registry changes, which can enable further exploitation of the environment. However, legitimate administrative actions could also trigger this alert, making it essential for analysts to validate the context before escalating.

  ### Blind Spots and Assumptions
  This detection logic may not cover all methods of registry manipulation, especially those not using `regedit.exe` (e.g., PowerShell commands, custom scripts). It assumes that process creation logs capturing command-line arguments are enabled and appropriately configured across Windows systems. Additionally, it does not account for benign uses of registry imports, which could lead to false positives. Ensuring comprehensive logging and monitoring around endpoint activities is necessary for effective detection.

