title: Potential Adplus.EXE Abuse
id: 2f869d59-7f6a-4931-992c-cce556ff2d53
status: test
description: Detects execution of "AdPlus.exe", a binary that is part of the 
  Windows SDK that can be used as a LOLBIN in order to dump process memory and 
  execute arbitrary commands.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Adplus/
- https://twitter.com/nas_bench/status/1534916659676422152
- https://twitter.com/nas_bench/status/1534915321856917506
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-09
modified: 2023-06-23
tags:
- attack.execution
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\adplus.exe'
  - OriginalFileName: 'Adplus.exe'
  selection_cli:
    CommandLine|contains:
            # Dump process memory
    - ' -hang '
    - ' -pn '
    - ' -pmn '
    - ' -p '
    - ' -po '
            # Using a config file
    - ' -c '
            # Execute commands inline
    - ' -sc '
  condition: all of selection_*
falsepositives:
- Legitimate usage of Adplus for debugging purposes
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of AdPlus.exe, a legitimate Windows SDK tool that can be misused as a living-off-the-land binary (LOLBIN) to dump process memory, execute commands, and conceal malicious activity. The primary attacker objective includes either collecting sensitive data from running processes or executing malicious commands on a compromised system. This detection aligns with the MITRE ATT&CK framework, specifically under the tactic **Execution** (TA0040) and technique **Process Injection** (T1003.001).

  Key telemetry sources include Windows Security Event ID 4688 for process creation events and Sysmon Event ID 1, which tracks detailed process creation parameters. If malicious in nature, the use of AdPlus.exe can facilitate data exfiltration and elevated command execution, leading to significant security impacts. However, this detection does not confirm malicious intent on its own, as AdPlus.exe may also be used legitimately by developers and administrators for debugging.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for entries where the process name ends with ‘\adplus.exe’. Note the parent process ID and command line arguments to establish context.

  - **Analyze command line arguments:** Look for specific parameters in the command line (e.g., `-hang`, `-pn`, `-pmn`, `-p`, `-po`, `-c`, `-sc`). Legitimate usage typically demonstrates standard debugging patterns without extensive or unusual command options.

  - **Determine the parent process:** Identify the parent process of AdPlus.exe from the telemetry logs. Common benign parents include development tools like Visual Studio; however, anomalies with less trusted contexts should raise flags.

  - **Cross-reference with user behavior:** Verify if the executing user account’s behavior matches the expected patterns. Administrators and developers may legitimately invoke AdPlus.exe, whereas a standard user executing it could indicate malicious use.

  - **Check for related indicators of compromise:** Investigate for Sysmon Event ID 10 (Process Access) following the execution of AdPlus.exe. Look for any memory dump actions directed toward sensitive processes or any unusual file manipulation activities in conjunction with its execution.

  - **Correlate with EDR data for file artifacts:** Validate if any file creation or network exfiltration occurred post-execution through EDR or SIEM logs. Look for related file write events or suspicious outbound network traffic from the machine running the command.

  ### Prioritization

  The alert severity is high due to the potential impact of the affected system. The likelihood of malicious abuse is significant since AdPlus.exe is frequently weaponized in targeted attacks to extract sensitive information. Its legitimate use is limited to a small set of users, making its detection critical.

  ### Blind Spots and Assumptions

  Detection might be limited by the absence of detailed logging configurations, particularly if Sysmon is not in place. Users with legitimate debugging tasks may trigger the alert inadvertently. There may be false positives in environments where AdPlus.exe is regularly employed for development purposes. A related detection to consider includes monitoring for unusual command-line executions of other LOLBINs to strengthen overall coverage.

