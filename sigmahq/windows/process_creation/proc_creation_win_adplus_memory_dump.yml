title: Potential Adplus.EXE Abuse
id: 2f869d59-7f6a-4931-992c-cce556ff2d53
status: test
description: Detects execution of "AdPlus.exe", a binary that is part of the 
  Windows SDK that can be used as a LOLBIN in order to dump process memory and 
  execute arbitrary commands.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Adplus/
- https://twitter.com/nas_bench/status/1534916659676422152
- https://twitter.com/nas_bench/status/1534915321856917506
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-09
modified: 2023-06-23
tags:
- attack.defense-evasion
- attack.execution
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\adplus.exe'
  - OriginalFileName: 'Adplus.exe'
  selection_cli:
    CommandLine|contains:
            # Dump process memory
    - ' -hang '
    - ' -pn '
    - ' -pmn '
    - ' -p '
    - ' -po '
            # Using a config file
    - ' -c '
            # Execute commands inline
    - ' -sc '
  condition: all of selection_*
falsepositives:
- Legitimate usage of Adplus for debugging purposes
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of "AdPlus.exe", a legitimate Windows debugging utility that can be potentially exploited by adversaries as a living-off-the-land binary (LOLBIN) to dump process memory or execute arbitrary commands. Attackers may use AdPlus.exe to evade detection mechanisms by leveraging a trusted system application for malicious activities such as credential dumping or memory analysis. The relevant MITRE ATT&CK technique associated with this detection is **Credential Dumping (T1003.001)**.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID **4688** for process creation and potentially Sysmon Event ID **1** for detailed command line arguments. If malicious, this behavior could lead to unauthorized data access or extraction. It is important to note that the detection of AdPlus.exe does NOT inherently confirm malicious intent, as it may be used legitimately for debugging processes.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID **4688** to identify AdPlus.exe execution. Pay attention to the user context; legitimate usage typically involves SYSTEM or administrator accounts during debugging sessions.

  - **Analyze command lines for malicious patterns**: Investigate the parameters provided with AdPlus.exe. High-confidence malicious indicators include the presence of flags like `-hang`, `-pn`, `-pmn`, `-p`, or `-po` indicating memory dumps, as well as `-sc` which executes commands inline.

  - **Validate user intent**: Cross-reference the execution with the established business processes. Legitimate instances usually originate from a known administrator or specific IT roles; any anomaly might suggest potential abuse.

  - **Correlate with historical usage**: Research past instances of AdPlus.exe usage in the environment. If the execution occurs during known IT maintenance or troubleshooting tasks, it is likely benign; otherwise, escalate for further analysis.

  - **Look for related process activity**: Review Sysmon Event ID **1** for additional processes that might have launched AdPlus.exe, indicating potential thread injection or other suspicious behavior nearby.

  ### Prioritization

  This alert is classified as high severity due to the potential impact of compromising sensitive data through credential dumping on critical systems. The likelihood of malicious abuse is heightened as AdPlus.exe is often weaponized in environments where attackers aim to leverage trusted binaries for stealthy exploitation.

  ### Blind Spots and Assumptions

  Detection may miss instances where AdPlus.exe executes without associated suspicious command-line parameters, thus requiring context about legitimate use cases. Reliable detection also necessitates comprehensive logging configurations, specifically enabling process creation logs for all critical assets. Furthermore, legitimate debugging by system administrators could trigger the alert, making contextual awareness essential. Companion detections involving abnormal usage of other LOLBINs or unauthorized command executions should be considered to strengthen coverage and reduce false positives.

