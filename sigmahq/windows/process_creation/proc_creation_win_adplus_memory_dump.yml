title: Potential Adplus.EXE Abuse
id: 2f869d59-7f6a-4931-992c-cce556ff2d53
status: test
description: Detects execution of "AdPlus.exe", a binary that is part of the Windows
  SDK that can be used as a LOLBIN in order to dump process memory and execute arbitrary
  commands.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Adplus/
- https://twitter.com/nas_bench/status/1534916659676422152
- https://twitter.com/nas_bench/status/1534915321856917506
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-09
modified: 2023-06-23
tags:
- attack.defense-evasion
- attack.execution
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\adplus.exe'
  - OriginalFileName: 'Adplus.exe'
  selection_cli:
    CommandLine|contains:
            # Dump process memory
    - ' -hang '
    - ' -pn '
    - ' -pmn '
    - ' -p '
    - ' -po '
            # Using a config file
    - ' -c '
            # Execute commands inline
    - ' -sc '
  condition: all of selection_*
falsepositives:
- Legitimate usage of Adplus for debugging purposes
level: high
note: |
  ### Technical Context
  This rule detects the execution of "AdPlus.exe," a tool commonly found in the Windows Software Development Kit (SDK). AdPlus.exe is frequently exploited as a Living Off The Land Binary (LOLBIN) to dump process memory, enabling attackers to extract sensitive information and execute arbitrary commands. This can be especially concerning when used by a malicious actor aiming to escalate privileges, maintain persistence, or exfiltrate credentials from targeted processes.

  In threat scenarios, an attacker may use AdPlus.exe to gather secrets from sensitive processes, facilitating further intrusion into a network. This behavior aligns with several tactics and techniques in the MITRE ATT&CK framework, specifically:
  - Defense Evasion (T1573.001): Leveraging trusted binaries for nefarious purposes.
  - Execution (T1203): Executing commands on the host without invoking malware.
  - Credential Access (T1003.001): Memory scraping to obtain stored credentials from processes.

  Primary data sources for detecting this activity include process creation logs, which provide insight into the execution of binaries like AdPlus.exe, and command line invocation logs, which can detail how the tool is being used.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for any instances of AdPlus.exe being executed. Investigate the associated user accounts and parent processes to understand the context of the execution.

  - **Analyze Command Line Arguments:** Examine the command line arguments passed to AdPlus.exe. Look for suspicious flags indicative of memory dumping operations (e.g., `-hang`, `-pn`, `-p`), which may suggest exploitation attempts.

  - **Correlate with Other Security Events:** Cross-reference the timings and source of AdPlus.exe executions with other security events in logs to identify any associated suspicious activity, such as lateral movement or unauthorized access attempts.

  - **Assess User Behavior and Context:** Investigate the user and system context under which AdPlus.exe was executed. Evaluate whether the user had legitimate reasons to run the tool and if there are other anomalies in their behavior around the time of execution.

  ### Prioritization
  This alert is rated high severity due to the potential impact of credential theft and unauthorized access it represents. The likelihood of exploitation through known LOLBIN usage, such as AdPlus.exe, makes it a critical focus in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where logs are not aggregated or where process execution details are poorly monitored. The detection logic assumes that the execution of AdPlus.exe is suspicious unless justified by legitimate debugging activities. Required logs include comprehensive process creation events and command line arguments, along with proper configurations to capture this telemetry effectively.

