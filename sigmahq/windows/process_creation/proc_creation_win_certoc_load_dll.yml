note: |
  ### Technical Context

  This rule detects the loading of DLL files via the `CertOC.exe` utility, which is often used for certificate management. Attackers may leverage this behavior to execute malicious code by disguising it as legitimate certificate operations, thereby maintaining persistence or evading detection. The relevant MITRE ATT&CK tactic is **Defense Evasion**, specifically the technique **T1218: Signed Binary Proxy Execution**.

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Event ID 4688 (Process Creation) which captures details about process executions. If the process is initiated with suspicious command line arguments, it may indicate an attempt to load a malicious DLL, highlighting a significant security concern if executed by an unauthorized user. However, this detection does NOT confirm malicious intent or guarantee that the loaded DLL is inherently harmful.

  ### Investigation Steps

  - **Verify process execution context**: Check the process creation log for CertOC.exe using Event ID 4688. Look for the "Creator Process ID" and "User" fields to identify if the process was initiated by an authorized user or legitimate process (e.g., SYSTEM or administrators) versus unauthorized user accounts.

  - **Analyze command line arguments**: Examine the command line used when CertOC.exe was executed for the presence of the `-LoadDLL` argument. An unexpected or unknown DLL path significantly elevates suspicion, especially if it is not a known system library.

  - **Inspect DLL path and signature**: Cross-reference the loaded DLL's file path (if applicable) and check file properties to confirm digital signatures. Legitimate system DLLs typically reside in system directories (e.g., C:\Windows\System32). Any occurrence outside of these paths warrants further scrutiny.

  - **Correlate with recent changes**: Review system and application event logs around the same time as the alert (Event ID 5145 for File Share Access, for example) to see if any unauthorized changes or potential indicators of compromise occurred, such as file creations or alterations.

  - **Identify remediation actions**: If the investigation confirms malicious behavior, document the process ID and command line, and check for any network activity (Event ID 5156 for Windows Filtering Platform) that correlates with the time of DLL loading, which may indicate exfiltration or lateral movement.

  - **Baseline expected behavior**: In normal operations, CertOC.exe is typically not used directly by users but rather by automated systems or scripts. Any direct invocation under a standard user account should be considered suspicious and not typical in enterprise contexts.

  ### Prioritization

  This alert should be prioritized as medium severity. While the direct impact may vary, the potential for abuse exists as attackers commonly exploit legitimate system tools like CertOC.exe to execute code covertly. The likelihood of being weaponized is moderate, particularly in environments with lower security postures or insufficient logging configurations.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use alternate legitimate tools for similar DLL loading actions or where CertOC.exe is run with different benign parameters. Continuous monitoring and ensuring comprehensive logging (including process creation and file access logs) are vital for reliable detection. Legitimate certificate management operations performed by administrators can trigger this alert. A related detection could include monitoring for unauthorized executions of `signtool.exe`, which also may initiate certificate-related processes without appropriate oversight.

