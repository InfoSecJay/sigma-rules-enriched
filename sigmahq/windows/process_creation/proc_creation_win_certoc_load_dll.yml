note: |
  ### Technical Context

  This Sigma rule detects instances where the CertOC.exe tool is used to load a Dynamic Link Library (DLL) file, indicative of an attempt to install a certificate. This behavior may be leveraged by an adversary aiming to establish persistence or to execute malicious code without raising immediate suspicion. The relevant MITRE ATT&CK tactic is **Execution** (T1203) and the technique is **User Execution** (T1203).

  The primary telemetry sources required for this detection include Windows process creation logs, specifically looking for Security Event ID 4688 and Sysmon Event ID 1, which capture the execution of processes along with their command-line arguments. If malicious, this behavior can lead to unauthorized changes in system trust and potentially allows an attacker to circumvent security protocols. It is important to note that this detection does NOT independently confirm malicious intent, as legitimate administrative actions may invoke the same command.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances where CertOC.exe is executed. Note the time and user context to establish if the execution ties to typical administrative tasks or unusual behavior.

  - **Validate command line arguments:** Look for the command-line argument **-LoadDLL** in the recorded events. A log entry like `CertOC.exe -LoadDLL <suspicious DLL file>` is a strong indicator of potential abuse.

  - **Identify loaded DLLs:** If possible, cross-check the DLLs loaded by CertOC.exe using Sysinternals tools like Sysmon or Process Explorer to analyze if any loaded DLLs are known to be malicious or unusual.

  - **Analyze user behavior:** Review the user account that executed CertOC.exe. If it is a standard user without administrative privileges, this might indicate malicious activity. Compare against typical behavior for that user account.

  - **Look for precedent activities:** Search for other related alerts or logs where CertOC.exe is executed or DLLs were loaded by different means around the same time. This may indicate a broader attack campaign.

  - **Assess legitimate usage:** Validate if the execution of CertOC.exe aligns with known trusted administrative activities or if the environment has any known policies for legitimate use of this tool.

  ### Prioritization

  This alert is of medium severity because it indicates a potential compromise on systems with administrative access, which could lead to deeper infiltration. The likelihood of malicious abuse is moderate, as attackers often use benign-looking tools like CertOC.exe for nefarious purposes, though legitimate uses do occur.

  ### Blind Spots and Assumptions

  Detection may be limited if logs for process creation are not enabled or if Sysmon is not configured properly. Additionally, an adversary may attempt to evade detection by using other legitimate command-line tools that could mimic this behavior. Legitimate software installations or administrative tasks involving certificate management may also inadvertently trigger this alert. A related detection to strengthen coverage would be monitoring for unusual registry modifications (e.g., registry keys associated with certificate stores) after CertOC.exe is invoked, connecting this behavior with potential persistence mechanisms.

