logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
    CommandLine|contains|all:
    - 'mklink'
    - '\osk.exe'
    - '\cmd.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
