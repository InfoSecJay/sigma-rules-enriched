note: |
  ---

  ### Technical Context

  This rule detects the creation of a symbolic link using the `mklink` command that connects `cmd.exe` to `osk.exe`, effectively allowing unauthorized elevation of command prompt access during the Windows login screen. This technique can be exploited by an attacker to manipulate the login process and gain unauthorized administrative privileges.

  The relevant MITRE ATT&CK tactic is **Privilege Escalation**, specifically technique **T1546.008** (Dynamic Link Library Hijacking). The primary telemetry sources involved are Windows Event IDs related to process creation, notably Event ID **4688** and Sysmon Event ID **1**. If executed maliciously, this action poses a significant security risk, as it can lead to the compromise of the system's integrity and confidentiality. It is essential to note that this detection does NOT confirm that the link was used for malicious purposes on its own; further investigation is needed.

  ---

  ### Investigation Steps

  - **Review recent process creation events**: Look for Windows Security Event ID **4688** and Sysmon Event ID **1**. Specifically, check for the creation of `cmd.exe` with a command line containing `mklink`, `\osk.exe`, and `\cmd.exe`. Confirm that the command was executed in unusual contexts, such as during the login screen.

  - **Check for unusual command line patterns**: Focus on command line parameters in Event IDs **4688** and **1** for signs of the mklink syntax. Legitimate usage often does not involve these flags together.

  - **Identify the user context**: Investigate the user account associated with the flagged events. Malicious activity is more concerning if the command was executed by a low-privileged user account at the login screen, whereas legitimate use is less likely.

  - **Correlate with other logs**: Inspect system logs for events related to abnormal activities, such as failed login attempts (Event ID **4625**) or account lockouts (Event ID **4740**), occurring around the time of the symbolic link creation.

  - **Assess system environment**: Determine if any critical assets or sensitive data are situated on affected systems. Mitigating the impact may require immediate action if persistence is compromised via this technique.

  ---

  ### Prioritization

  This alert carries a **high severity** as it could lead to significant unauthorized access on vulnerable systems potentially used in sensitive business operations. The likelihood of malicious abuse is considerable, given the technique's prevalence in the attack landscape, especially for initial access or lateral movement.

  ---

  ### Blind Spots and Assumptions

  The detection is limited by the requirement for accurate logging configurations; if Windows event logs are not enabled, actions may go undetected. Users with valid access may legitimately create symbolic links for system maintenance, potentially triggering false positives. Companion detections, such as monitoring unusual DLL hijacking attempts, would strengthen overall coverage against similar evasion techniques.

