logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cli:
    CommandLine|contains|all:
    - 'mklink'
    - '\osk.exe'
    - '\cmd.exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_cmd_mklink_osk_cmd/info.yml
note: |
  ### Technical Context
  This rule detects a potential privilege escalation attempt whereby an attacker creates a symbolic link between `cmd.exe` and the on-screen keyboard binary (`osk.exe`) using the `mklink` command. This malicious action can allow an attacker to access an elevated command prompt from the Windows login screen, bypassing typical authentication requirements. The attacker’s objective is likely to gain elevated privileges on the system without physically logging in, facilitating further malicious activities such as data exfiltration or system compromise.

  The relevant MITRE ATT&CK tactics and techniques include **Privilege Escalation** (TA0004), specifically the technique **Symlink (T1546.008)**. This reflects the method of manipulation exploiting symlink permissions to redirect program execution and can be utilized to gain unauthorized elevation of privileges.

  Primary data sources for this detection include **process creation events**, which will provide evidence of commands executed on the system, and log records relating to the use of the `mklink` command.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation events for instances of `cmd.exe` being executed, focusing on timestamps coinciding with user login activities.
  - **Inspect Command Line Arguments**: Analyze the command line parameters passed to `cmd.exe` to identify any usage of `mklink` with paths referencing both `osk.exe` and `cmd.exe`.
  - **Correlate with User Access Logs**: Cross-reference the identified events with user login logs to determine if the context of the command execution aligns with authenticated user sessions or if it occurred from the lock screen.
  - **Check for Suspicious Symlinks**: Manually inspect the file system for any unusual symbolic links, specifically those linking to critical system binaries like `cmd.exe`, and verify their legitimacy.

  ### Prioritization
  Given the high severity of this alert in an enterprise context, this potential privilege escalation technique signifies a serious threat. It indicates that an attacker could gain unauthorized access and execute commands with elevated privileges, posing significant risks to system integrity and data security.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are not adequately configured to capture all command executions, especially during boot or lock screen scenarios. The detection logic assumes that `mklink` is specifically used to create the problematic symlink in the presence of both targeted binaries. Additionally, it relies on the operational environment having logging enabled for process creation events to function effectively.

