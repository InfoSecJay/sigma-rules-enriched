note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows Management Instrumentation Command-line (WMIC) tool on a remote system, specifically when querying information via the `/node:` parameter. The likely attacker objective is to gather system information or enumerate services on targeted hosts, which could be a precursor to further exploitation or lateral movement within the network. The relevant MITRE ATT&CK technique is Remote System Execution (T1047).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688) and potentially Sysmon Event ID 1 for detailed command line arguments. If malicious, this activity could indicate an active compromise attempting reconnaissance for further exploitation. Importantly, this detection does NOT confirm adversary activity on its own without additional context or corroborating evidence of malicious intent.

  ### Investigation Steps

  - **Review alert details:** Check the CommandLine field for `/node:` usage. Look specifically for suspicious IP addresses or hostnames that are not part of regular admin tasks.
  - **Correlate process creation:** Identify the process creation event (Security Event ID 4688) for `WMIC.exe` and review the ParentProcessId to trace back to the initiating process, noting if it's associated with administrative tools.
  - **Assess legitimate usage:** Verify if the detected execution aligns with known administrative workflows. Common administrative tasks using WMIC may involve local queries to manage system configurations without the `/node:` flag.
  - **Identify high-confidence malicious indicators:** Look for anomalous user accounts or sessions initiating `WMIC.exe`, especially from non-administrative roles or from endpoints not typically engaged in system management.
  - **Check associated network traffic:** Analyze firewall logs for outbound connections from the concerned host, checking for unusual attempts to communicate with external or uncommon IP addresses during the WMIC execution timeframe.
  - **Investigate for file modifications:** Use Sysmon to check for events indicating file modifications or deletions by the Windows Management Instrumentation service, as these may suggest lateral movement or cleanup efforts by an actor.

  ### Prioritization

  This alert should be considered medium severity due to the potential for reconnaissance activities that can lead to lateral movement within the enterprise. The risk is heightened if the affected system is critical to business operations or housing sensitive data, as attackers could exploit the reconnaissance for malicious purposes.

  ### Blind Spots and Assumptions

  Detection may be limited by user privileges or logging configurations, particularly if the WMIC command is executed by local administrative accounts during legitimate activities. Additionally, legitimate service management or automated scripts may trigger this rule, necessitating manual review. A related detection to enhance coverage is monitoring for abnormal remote command executions via PowerShell (T1059.001), which can help identify lateral movement tactics.

