note: |
  ### Technical Context

  This rule detects the execution of Windows Management Instrumentation Command-line (WMIC) remotely, specifically when querying systems other than localhost or 127.0.0.1. This behavior may indicate an attacker attempting to gather information about a target system, which could facilitate further exploitation. The relevant MITRE ATT&CK tactic is **Execution** (T1203), specifically technique **Remote Command Execution** (T1047).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture command line activity. If malicious, this activity could lead to unauthorized data access or system manipulation. However, this detection alone does NOT confirm malicious intent, as legitimate administrators may also use WMIC for remote system management.

  ### Investigation Steps

  - **Check the command line arguments:** Review process creation logs (Security Event ID 4688) for any WMIC commands containing `/node:` targeting external addresses. Malicious use will typically target remote systems, unlike benign usage that may include local scripts or commands.

  - **Correlate with user account activity:** Validate user identities in the logs; check for anomalies such as service accounts or non-admin users executing WMIC commands. Legitimate activities often involve known administrative accounts executing commands on expected systems.

  - **Identify high-risk target systems:** Assess any affected systems for their role (e.g., domain controllers, financial servers) to prioritize investigation. If WMIC is executed against critical infrastructure, treat the alert as higher priority due to potential security ramifications.

  - **Review event logs for related suspicious activity:** Look for other indicators of compromise such as failed login attempts or unusual traffic patterns in the surrounding timeframe (Sysmon Event IDs 3, 10 for network connections).

  - **Monitor for process anomalies:** Investigate other processes spawned from WMIC or command shells that may indicate further exploitation post-execution. Excessive degradation of performance or unknown backdoor processes discovered during this timeframe could signal malicious activity.

  - **Look for accompanying red flags:** Identify if WMIC was executed shortly after other malicious indicators, such as the presence of known malware signatures or patterns relevant to remote command execution.

  ### Prioritization

  This alert has a medium severity level in an enterprise context due to the critical nature of the systems that may be targeted. The likelihood of malicious abuse is moderate, particularly if combined with other suspicious activities. WMIC can be weaponized by attackers to execute malicious commands, thus warrants prompt analysis.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion if attackers use encrypted channels or legitimate WMIC usage by authorized administrators. Ensure audit logging for WMIC actions is enabled and maintained properly across all critical systems to capture relevant data. Legitimate administrative tasks, such as system audits or reporting, may trigger this alert but should be consistent with organizational policies. A related detection is monitoring for WMI events indicative of lateral movement (MITRE ID T1021), which can provide correlation points for comprehensive investigations.

