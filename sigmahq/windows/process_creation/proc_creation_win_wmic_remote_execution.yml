note: |
  ### Technical Context
  This rule detects the remote execution of WMIC (Windows Management Instrumentation Command-line) to gather information from other systems. Attackers often exploit WMIC for legitimate administrative tasks, but it can also be misused to execute commands on remote machines, leading to information leakage or unauthorized actions within an environment. The primary threat scenario involves lateral movement within a network, where an intruder may access and gather sensitive configurations, user details, or other system information by leveraging WMIC's capabilities.

  Relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002) and **Command and Control** (TA0011), with specific emphasis on technique **WMIC** (T1047). The primary data sources for this detection include process creation events, which log command-line activity and tracking the execution of WMIC on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of `wmic.exe` being executed, filtering for command-line arguments that indicate remote querying using the `/node:` parameter and ensuring no local queries (localhost or 127.0.0.1) are present.
  - **Analyze Network Traffic:** If possible, inspect network traces for unusual outbound connections from the querying system to other devices, especially following WMIC executions, to identify unauthorized data access.
  - **Correlate with User Activity:** Cross-reference the WMIC execution logs with user activity logs to identify whether the command was executed by a legitimate administrative user or a potentially compromised account.
  - **Check for Privilege Escalation:** Investigate any related accounts or sessions that may indicate privilege escalation or lateral movement activities correlating with the WMIC executions.

  ### Prioritization
  The alert is classified as medium severity due to the potential risk of information exfiltration and unauthorized command execution in an enterprise environment, especially if it indicates lateral movement by an attacker or misuse of administrative tools by an insider.

  ### Blind Spots and Assumptions
  This detection may miss legitimate administrative activity if it is conducted by trusted users with appropriate privileges, leading to potential false positives. The detection logic assumes availability of thorough process creation logs, as well as proper logging configurations that capture command-line arguments. If WMIC commands are executed in a non-standard way or if logging is not adequately set up to capture such actions, it may result in increased blind spots for malicious activities.

