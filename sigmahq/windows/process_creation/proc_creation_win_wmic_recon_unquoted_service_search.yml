note: |
  ### Technical Context
  This detection rule identifies attempts to execute the Windows Management Instrumentation Command-line (WMIC) tool with specific commands that query for unquoted service paths. Attackers commonly use this technique to enumerate services on a target machine, particularly targeting unquoted service paths, which can lead to privilege escalation if exploited. By identifying the execution of WMIC with commands containing "service get" and specific parameters, the detection seeks to flag suspicious reconnaissance activities that could precede a more complex attack.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic:** Execution
  - **Technique:** WMIC (T1047)

  The primary data sources for this detection are process creation events from Windows logs. This telemetry will provide insights into command-line activity and the execution of the WMIC tool, enabling security analysts to identify potential reconnaissance that may indicate preparation for lateral movement or privilege escalation.

  ### Investigation Steps
  - **Identify Process Creation Events:** Review process creation logs for entries related to `wmic.exe`, focusing on those that match the specified command line patterns indicating reconnaissance behavior.
  - **Analyze Command Line Arguments:** Examine the full command-line arguments of the WMIC executions to confirm whether they contain the terms "service get", "name, displayname, pathname, startmode" as specified in the detection logic.
  - **Correlate with Network Activity:** Investigate any associated network traffic or malicious connections that occurred around the same timestamp to contextualize the WMIC execution within potential broader attack activity.
  - **Review Related Artifacts:** Check for other system and security logs, such as Event Viewer logs, for indications of potential exploitation or enumeration activity surrounding service paths, especially in conjunction with administrative processes.

  ### Prioritization
  This alert should be considered medium severity as it indicates possible reconnaissance behavior that could lead to more serious attack vectors, such as privilege escalation. Awareness of this tactic helps prioritize responses to potentially prevent escalatory actions.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are not sufficiently detailed or if they are filtered out by log retention policies. The detection logic assumes that WMIC is used in its standard form, meaning that obfuscated commands or custom scripts that replicate this behavior could evade detection. It is essential for environments to capture comprehensive event logs, including detailed command-line information, for effective monitoring of such activities.

