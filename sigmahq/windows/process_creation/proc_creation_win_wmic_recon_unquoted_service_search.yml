note: |
  ### Technical Context

  This Sigma rule detects reconnaissance activity targeting unquoted service paths using the `wmic.exe` command-line interface. Attackers often use this technique to identify vulnerable services on a target machine, which may lead to privilege escalation. This behavior corresponds to the MITRE ATT&CK technique: **Execution: T1047 - Windows Management Instrumentation (WMI)**.

  The primary telemetry source for this detection is process creation logs from Windows systems, specifically capturing the execution of `wmic.exe` with distinct command-line parameters. If exploited, this could allow attackers to execute code with elevated privileges, undermining system security. It is essential to note that this detection alone does not confirm malicious intent; legitimate administrative tasks may also trigger this rule.

  ### Investigation Steps

  - **Check process creation logs for wmic.exe execution:** Review Windows Event ID 4688 for instances where `wmic.exe` has been executed. Look for specific CommandLine arguments, especially those containing "service get" with associated parameters: `name,displayname,pathname,startmode`.

  - **Review context of CommandLine arguments:** If the CommandLine includes common administrative tasks, such as checking service configurations (however, avoid benign contexts), this may indicate legitimate activity. Compare timestamps with known maintenance schedules or user activities.

  - **Look for unusual execution patterns:** Identify if `wmic.exe` is executed by non-administrative accounts or from non-standard parent processes, which can indicate malicious intent. Legitimate administrative tasks typically require context that aligns with regular system management.

  - **Examine associated user accounts and privileges:** Authenticate the account executing the command using Windows Event ID 4624. Check if it's a typical administrative account or unusual user that may suggest a potential compromise.

  - **Identify previously reported vulnerabilities or exploits:** Cross-reference the identified service paths with known unquoted service path vulnerabilities. Use resource databases like NVD or CVE to assess if any services are part of the known threat landscape.

  - **Validate unauthorized file creation or alteration:** Investigate potential file manipulations or unauthorized permissions changes tied to the services revealed by `wmic`. Look for creation timestamps or unexpected modifications in Windows Event ID  audited logs (Event ID 4663).

  ### Prioritization

  The alert severity is medium, given that it targets reconnaissance methods which may lead to privilege escalation. The impact is significant if critical systems are involved, yet the likelihood of false positives exists due to potential legitimate administrative tasks. This behavior is known to be weaponized by adversaries performing targeted attacks.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers utilize alternative tools or obfuscation techniques, such as PowerShell, to conduct similar recon without triggering this specific alert. It also relies on proper logging configurations in Windows to ensure process creation events are captured. Legitimate administrative scripts may trigger the rule if they run `wmic` for routine management. Companion detections such as PowerShell recon activities (e.g., T1059.001) can provide a more comprehensive view of potential attacker behavior.

