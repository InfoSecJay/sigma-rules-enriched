note: |
  ### Technical Context

  This Sigma rule detects the execution of the Windows Management Instrumentation Command-line (WMIC) tool used to query for service properties, particularly unquoted service paths. The likely attacker objective is to identify services with unquoted paths, which can be leveraged for privilege escalation. This behavior aligns with the MITRE ATT&CK technique T1047 (Windows Management Instrumentation).

  The primary telemetry source includes process creation events from Windows systems, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, successful exploitation can lead to compromised systems and elevated privileges. This detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Identify WMIC execution:** Review process creation logs for Security Event ID 4688 and Sysmon Event ID 1. Look for `Image` containing `\WMIC.exe` and a `CommandLine` that includes `service get name,displayname,pathname,startmode`.

  - **Analyze command line arguments:** Check for the string `' service get '` in the command line. Understand the context of the command and compare it against typical usage patterns in the organization; legitimate admin tasks may also include similar queries but usually do not invoke WMIC for service enumeration.

  - **Correlate with user accounts:** Cross-reference the User field in the logs with known administrative accounts. Determine if the user executing the command has a history of performing legitimate administrative tasks or if the account appears anomalous.

  - **Review for common tool usage:** Investigate system logs or previously detected malicious scripts (e.g., the ones noted in the references) for correlation. Such scripts often programmatically invoke WMIC for reconnaissance tasks, revealing a higher likelihood of malicious intent.

  - **Check for other suspicious behaviors:** Validate if there are additional concurrent alerts related to privilege escalation (e.g., anomalous process injections or unauthorized access attempts) from the same host or user account to strengthen the context for this alert.

  - **Document legitimate activities:** Note common scenarios in which WMIC is used legitimately within your environment, such as routine service monitoring by system administrators, to help differentiate between benign and malicious usage patterns.

  ### Prioritization

  This alert should be treated with medium severity due to its potential link to privilege escalation and reconnaissance efforts. The impact can be significant if unquoted service paths are exploited. While WMIC is a legitimate administrative tool, its misuse is often weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if WMIC execution is masked or obscured via evasion techniques, such as renaming the executable or invoking it indirectly. Ensure that auditing for process creations is enabled across all critical systems to reliably detect this behavior. Legitimate service management and administrative scripts may trigger this alert. A related detection to consider is monitoring for PowerShell scripts that could generate similar reconnaissance activities (e.g., the Cybersecurity tool referenced in the Sigma rule).

