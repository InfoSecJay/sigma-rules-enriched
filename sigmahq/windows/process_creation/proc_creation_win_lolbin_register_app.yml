note: |
  ### Technical Context
  This rule detects the execution of the legitimate Microsoft signed script `REGISTER_APP.VBS` used to register a Volume Shadow Copy Service (VSS) or Virtual Disk Service (VDS) provider as a COM+ application. Attackers may exploit this script to facilitate persistence or evade detection mechanisms while attempting to manipulate system snapshots and backups. By registering malicious providers, they can potentially intercept or modify backup operations, allowing for further attacks or data exfiltration.

  The relevant MITRE ATT&CK tactics and techniques related to this detection include **Defense Evasion (T1203)**, as the use of a legitimate script to perform potentially malicious actions can circumvent standard security measures. Another relevant technique is **Command and Scripting Interpreter (T1218)**, which encompasses the use of scripts like VBS to execute commands on a system.

  Primary data sources for this detection will be process creation logs, which document the commands and arguments used to launch processes, providing insight into suspicious command-line activities associated with script execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `REGISTER_APP.VBS` usage, focusing on the command line arguments to determine if there are any unusual or unexpected flags or operations.
  - **Correlate with Execution Context:** Check for user accounts executing the script and assess whether they have legitimate reasons to perform this action. Look for anomalies in the user's behavior or credentials.
  - **Examine Recent Changes to COM+ Applications:** Investigate any recent modifications or registrations added to COM+ applications that correlate with the execution of the `REGISTER_APP.VBS` script, noting any potential unauthorized applications.
  - **Assess VSS/VDS Provider Activity:** If the script has been used, review logs for Volume Shadow Copy operations and any alterations to backup processes or configurations that may indicate malicious modifications.

  ### Prioritization
  The alert has a medium severity due to the potential for significant impact if malicious actors gain control over backup processes, but it may also trigger from legitimate administrative tasks. Detection of this activity requires thorough investigation to rule out false positives from authorized script usage.

  ### Blind Spots and Assumptions
  This detection logic may have gaps regarding legitimate administrative activity, as normal use of `REGISTER_APP.VBS` by system administrators can generate alerts that may not denote malicious intent. The detection assumes that all executions of the script should be validated, which can lead to missed detections if the script is employed in critical administrative functions. Furthermore, completeness of telemetry may depend on adequate logging configurations in place for process creation events, affecting the overall effectiveness of the alert.

