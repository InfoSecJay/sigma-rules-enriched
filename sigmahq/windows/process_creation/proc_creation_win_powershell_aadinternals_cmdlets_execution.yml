- Legitimate use of the library for administrative activity
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of AADInternals PowerShell cmdlets, a set of tools designed for administering Azure Active Directory (Azure AD) and Office 365 environments. While these cmdlets have legitimate use cases, threat actors can exploit them to perform reconnaissance, manipulate privileges, and impact Azure AD or Office 365 environments. The typical attacker objectives may include gathering sensitive information, escalating privileges, or pivoting within cloud infrastructures.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (TA0002)**: The act of running malicious code by utilizing legitimate tools like PowerShell.
  - **Credential Access (TA0006)**: Exploiting the cmdlets to access or retrieve user credentials or tokens.
  - **Discovery (TA0007)**: Using the cmdlets to gather information about the Azure AD environment, users, and permissions.

  Primary data sources that will provide crucial evidence include Windows process creation logs, which capture details about the commands executed and their sources, as well as any logs related to the PowerShell execution policies that could help in verifying legitimate versus malicious use.

  ### Investigation Steps
  - **Review PowerShell Logs:** Examine Windows event logs for PowerShell execution records related to AADInternals cmdlets, specifically looking for unusual or unauthorized command executions.
  - **Analyze Command Line Arguments:** Inspect the command line parameters of PowerShell processes for the presence of AADInternals cmdlets. Focus on command strings that include “-AADInt” to determine if the context appears legitimate or malicious.
  - **Correlate Activity with User Accounts:** Identify the user accounts executing the cmdlets and assess their privileges. Look for any accounts that do not typically perform administrative actions.
  - **Audit Azure AD Logs:** Review Azure AD logs for unusual access patterns or modifications to sensitive resources that align with the use of AADInternals cmdlets, especially for accounts with elevated permissions.

  ### Prioritization
  This alert is categorized as high severity due to the potential for significant impact on the enterprise’s Azure AD and Office 365 security posture. Unauthorized or malicious use of administrative cmdlets can lead to extensive damage including data exfiltration, unauthorized access, and disruption of services.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the legitimate use of AADInternals for administrative activities, which could lead to false positives if not properly contextualized. The detection logic assumes that any execution of the specified cmdlets is suspect; however, it may overlook scenarios where appropriate permissions are held. The rule relies on having comprehensive process creation logs enabled and accessible in the environment, as well as effective logging of PowerShell execution to capture relevant command line details.

