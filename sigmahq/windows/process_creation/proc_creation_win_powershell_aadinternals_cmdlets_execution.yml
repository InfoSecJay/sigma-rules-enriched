detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.Exe'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
            # Since most of the cmdlets use a unique enough string which is "-AADInt" we only used that portion. For a complete list please check the references linked above
    - 'Add-AADInt'
    - 'ConvertTo-AADInt'
    - 'Disable-AADInt'
    - 'Enable-AADInt'
    - 'Export-AADInt'
    - 'Find-AADInt'
    - 'Get-AADInt'
    - 'Grant-AADInt'
    - 'Initialize-AADInt'
    - 'Install-AADInt'
    - 'Invoke-AADInt'
    - 'Join-AADInt'
    - 'New-AADInt'
    - 'Open-AADInt'
    - 'Read-AADInt'
    - 'Register-AADInt'
    - 'Remove-AADInt'
    - 'Reset-AADInt'
    - 'Resolve-AADInt'
    - 'Restore-AADInt'
    - 'Save-AADInt'
    - 'Search-AADInt'
    - 'Send-AADInt'
    - 'Set-AADInt'
    - 'Start-AADInt'
    - 'Unprotect-AADInt'
    - 'Update-AADInt'
  condition: all of selection_*
falsepositives:
- Legitimate use of the library for administrative activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of AADInternals PowerShell cmdlets, which are specific commands used to manage Azure Active Directory (AAD) and Office 365. Attackers may leverage these cmdlets to perform reconnaissance, harvest credentials, or manipulate AAD properties, potentially leading to unauthorized access or data breaches. The relevant MITRE ATT&CK tactics and techniques are Execution (T1203) and Credential Access (T1081).

  The primary telemetry sources are Windows process creation logs (e.g., Event ID 4688 for process creation and Sysmon Event ID 1), which capture details about processes launched on a system. If malicious, the impact can be significant, leading to full compromise of AAD environments. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative activities may result in similar cmdlet executions.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances where PowerShell or pwsh.exe initiates processes containing AADInternals cmdlets. Focus on the CommandLine field to identify malicious indicators.

  - **Verify command origins:** For any identified AADInternals cmdlet executions, validate the source of the process. Legitimate commands should originate from well-known administrative accounts or expected environments. Look for anomalous user accounts or patterns indicating misuse.

  - **Inspect account credentials:** If a cmdlet execution is flagged, investigate the user account performing the action. Collect and analyze logs from Azure AD Sign-Ins to confirm the legitimacy of the account and check for prior suspicious activities.

  - **Check associated network activity:** Review network logs to track any outbound connections following the cmdlet execution. Look for unexpected API calls or data exfiltration attempts that may suggest malicious intents.

  - **Cross-reference with known legitimate use cases:** Identify if the cmdlets were executed within expected operational contexts, such as routine administrative tasks. Analyze logs for similar legitimate CommandLine arguments executed by trusted personnel to differentiate between benign and malicious uses.

  ### Prioritization

  This alert should be considered high priority due to the elevated privileges often associated with AADInternals usage and the potential compromising impact on the Azure AD or Office 365 environments. The likelihood of malicious abuse is significant, given that these cmdlets can facilitate lateral movement and credential theft, making them attractive to threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging of legitimate administrative actions, leading to potential false positives from authorized users performing expected tasks. Administrators must ensure that logging configurations capture sufficient details around process creation and command line arguments for reliable detection. Additionally, legitimate administrative activities such as routine updates or audits could trigger this alert. A companion detection such as monitoring failed Azure AD sign-ins (T1075) can provide further insight into questionable behaviors surrounding AADInternals cmdlet usage.

