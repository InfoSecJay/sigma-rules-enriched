    - 'Disable-AADInt'
    - 'Enable-AADInt'
    - 'Export-AADInt'
    - 'Find-AADInt'
    - 'Get-AADInt'
    - 'Grant-AADInt'
    - 'Initialize-AADInt'
    - 'Install-AADInt'
    - 'Invoke-AADInt'
    - 'Join-AADInt'
    - 'New-AADInt'
    - 'Open-AADInt'
    - 'Read-AADInt'
    - 'Register-AADInt'
    - 'Remove-AADInt'
    - 'Reset-AADInt'
    - 'Resolve-AADInt'
    - 'Restore-AADInt'
