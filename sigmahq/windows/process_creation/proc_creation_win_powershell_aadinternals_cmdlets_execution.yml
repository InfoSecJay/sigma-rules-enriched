note: |
  ---

  ### Technical Context

  This rule detects the execution of AADInternals PowerShell cmdlets, which are tools used for managing Azure Active Directory and Office 365 environments. Malicious actors can misuse these cmdlets to gather information, compromise user accounts, and escalate privileges within a target organization's cloud services. The relevant MITRE ATT&CK tactic is **Execution (T1203)**, with techniques such as **PowerShell (T1059.001)** and **Account Manipulation (T1098)**. The primary telemetry source is Windows process creation logs, specifically focusing on PowerShell executions that include specific cmdlet command-line arguments.

  If detected activity is indeed malicious, it could result in unauthorized access to critical cloud resources and sensitive data exfiltration. However, this detection does NOT confirm malicious intent on its own; the context of the execution must be assessed, including user roles and expected administrative tasks.

  ---

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Security Event ID 4688 for new process creation events related to `powershell.exe`, `powershell_ise.exe`, or `pwsh.exe`. Focus on unusual command-line inputs involving `-AADInt` cmdlets.

  - **Identify User Context**: Determine the user account associated with the process. Verify whether the account has legitimate administrative privileges or if it is an unusual user context attempting to leverage PowerShell for AADInternals.

  - **Review Commander Line Arguments**: Inspect the CommandLine field for events matching the signature; malicious execution typically contains specific AADInternals cmdlet identifiers (e.g., `-Get-AADInt`, `-Remove-AADInt`).

  - **Normal Administrative Activity**: Compare the command-line execution against a baseline of legitimate activity. Review expected administrative tasks involving Azure AD and Office 365 and determine if any legitimately scheduled tasks exist.

  - **Correlate with Other Log Sources**: Investigate Azure AD logs for unusual login attempts, changes to user roles, or adjustments to security settings post-Execution as potential indicators of a compromised account.

  - **Identify High-Confidence Malicious Indicators**: Focus on identifying remote execution of the cmdlets or connections to external IPs that are suspicious (e.g., known malicious actors), correlating with actual data exfiltration attempts or exploitation.

  ---

  ### Prioritization

  This alert is of **high severity** as it involves potentially critical cloud infrastructure and access. The risk of abuse is notable since AADInternals can be weaponized for privilege escalation or data theft. Given the ease of access to PowerShell in many enterprise environments, this behavior is commonly exploited by attackers.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that also execute these cmdlets, potentially leading to false positives. It’s essential to ensure that process creation logs for PowerShell and broader logging configurations (e.g., Azure AD audit logs) are in place for reliable detection. Employ additional detections such as anomalous login behavior or changes to sensitive Azure AD configurations to enhance coverage against this attack vector.

