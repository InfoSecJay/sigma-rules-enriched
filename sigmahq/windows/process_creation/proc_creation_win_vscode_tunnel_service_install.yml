note: |
  ### Technical Context

  This rule detects the installation of the Visual Studio Code tunnel service (`code-tunnel`). This behavior indicates that an attacker may be attempting to establish a reverse proxy or tunnel to facilitate unauthorized access to internal systems. The likely objective is to configure a C2 (command and control) channel under the guise of a legitimate application, which corresponds to the MITRE ATT&CK tactic of Command and Control (T1071.001) using application layer protocols.

  The primary telemetry sources for this detection are Windows process creation logs, with specific attention to CommandLine arguments. If successfully malicious, this behavior could imply an imminent compromise, allowing attackers to bypass traditional network defenses. However, it is critical to note that this detection alone does not conclusively indicate malicious activity, as the legitimate installation of code-tunnel as a service may trigger similar alerts.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for the specific creation of the code-tunnel service. Focus on whether the CommandLine includes keywords like 'tunnel ', 'service', and 'internal-run'.

  - **Validate the service configuration**: Inspect registered services on the host using `Get-Service` or similar commands to confirm if the `code-tunnel` service is running. If present and not expected, this could indicate malicious activity.

  - **Analyze network connections**: Look for outbound connections on unusual ports or to suspicious IP addresses using logs from Windows Firewall or network monitoring tools. Malicious behavior often correlates with connections to known C2 infrastructure.

  - **Identify legitimate use cases**: Cross-reference the presence of the `code-tunnel` service with known business use cases in your organization. Legitimate tools may be documented and authorized, differing from suspicious activity typically observed in enterprise environments.

  - **Search for additional indicators of compromise**: Use EDR tools or SIEM to search for additional event logs that may indicate lateral movement or data exfiltration actions (such as modification of files or unusual data flow).

  - **Include asset classification in the investigation**: Evaluate the host where the rule was triggered based on its criticality. Servers or endpoints with sensitive data must be prioritized for immediate investigation compared to less critical assets.

  ### Prioritization

  This alert carries medium severity due to the potential risk of enabling unauthorized access to sensitive environments. The likelihood of malicious activity is significant, particularly if the environment lacks a legitimate business need for using the code-tunnel service, which is commonly weaponized by attackers for C2 purposes.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to capture all process creation events. Attackers may use alternative methods or legitimate applications to obscure their activities, leading to false negatives. Legitimate installations of code-tunnel can trigger this alert, especially for development teams utilizing the service for remote development. A related detection could include monitoring for unusual service modifications or failed connections that typically precede or follow the establishment of a C2 channel.

