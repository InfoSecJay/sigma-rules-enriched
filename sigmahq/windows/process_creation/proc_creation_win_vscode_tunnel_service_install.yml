note: |
  ### Technical Context
  This detection rule identifies the installation of the Visual Studio Code (VsCode) Tunnel Service, which is a tool often exploited for Command and Control (C2) purposes. Attackers may utilize this service to create a tunnel for remote access, allowing them to bypass network security measures and establish covert communication channels with compromised hosts. The objective of the attacker typically involves maintaining persistence within an environment and facilitating unauthorized access to internal systems.

  The rule corresponds to the MITRE ATT&CK framework, specifically under the tactics of Command and Control (TA0011) and the technique Remote Services (T1071.001). The use of tunneling services can be indicative of a broader compromise strategy, including lateral movement and data exfiltration. Analysts should focus on monitoring process creation events that might indicate the unauthorized installation of such services.

  Primary data sources that will provide the most pertinent evidence for this detection include:
  - Windows process creation logs
  - Security event logs related to service installations
  - Network traffic logs that may show unusual connections originating from the tunneled service

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs to identify instances where the command line used indicates the installation of the VsCode Tunnel Service, paying particular attention to keywords like 'tunnel', 'service', and 'internal-run'.
  - **Investigate Service Installation Events:** Check Windows event logs for service installation records that coincide with the process creation events, verifying whether the service is legitimate or potentially malicious.
  - **Correlate with Network Activity:** Monitor network traffic to identify any unusual outbound connections associated with the tunnel service, looking for patterns that deviate from standard operational behavior.
  - **Assess System Security Posture:** Conduct a risk assessment of the involved systems, focusing on user privileges and network configurations to determine if any vulnerabilities were exploited for the service installation.

  ### Prioritization
  This alert is deemed medium severity due to the potential for significant threat impact if the VsCode Tunnel Service is being utilized for malicious purposes. The likelihood of this alert indicating a compromise is heightened in environments with known vulnerabilities, making immediate investigation necessary.

  ### Blind Spots and Assumptions
  This detection logic relies on the presence and accuracy of process creation logs and may not capture instances where attackers use obfuscation techniques to hide the service installation. There's an assumption that all benign installations of VsCode services are documented properly, which may not always be the case. Additionally, without properly configured logging settings and monitoring, there may be instances where the alert fails to trigger even if suspicious activity occurs.

