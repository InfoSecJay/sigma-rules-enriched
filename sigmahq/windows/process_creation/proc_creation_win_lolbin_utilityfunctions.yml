note: |
  ### Technical Context
  This detection rule identifies the execution of a PowerShell script known as `UtilityFunctions.ps1`, which can be used by attackers to execute a managed DLL. This behavior is often employed to bypass security controls and execute malicious code in a stealthy manner. The likely threat scenario involves an adversary seeking to leverage legitimate system tools for nefarious purposes, thereby evading detection while potentially compromising system integrity and confidentiality.

  The identified MITRE ATT&CK techniques relevant to this rule are **Defense Evasion** (T1216: `Script Interpreter Appeals`), as the use of signed scripts can mislead defenses into believing the operation is legitimate. Attackers may utilize such scripts to download additional payloads, manipulate system settings, or perform other tasks that facilitate their objectives while remaining under the radar.

  The primary data source for detection is **process creation events** on Windows systems, which will provide insights into command invocation and associated arguments. This data is crucial for identifying attempts to run the script in question and analyzing its command line for unusual patterns or associations.

  ### Investigation Steps
  - **Review Process Creation Events**: Check the process creation logs to identify instances of `UtilityFunctions.ps1` being executed. Look for associated parent processes that appear anomalous or suspicious.
  - **Analyze Command Line Arguments**: For detected instances, scrutinize the command line arguments for any unusual parameters or behavior that may indicate the script is being used for malicious purposes.
  - **Correlate with Other Security Logs**: Examine logs from other security tools (e.g., EDR, AV) for associated alerts or suspicious activities that may correlate with the execution of `UtilityFunctions.ps1`.
  - **Identify Unusual DLL Activity**: Investigate the managed DLL that is executed alongside the script. Check for any unusual paths, signatures, or known vulnerabilities that may suggest malicious intent.

  ### Prioritization
  The alert's severity is deemed medium due to the potential for legitimate administrative tasks to be confused with malicious activity. However, the risk of using a signed PowerShell script for exploitative purposes is significant in an enterprise environment, warranting prompt investigation.

  ### Blind Spots and Assumptions
  This detection rule may miss cases where the script is obfuscated or renamed, or when it is executed without the specific command line recognized in the condition. The detection logic assumes that process creation logs are being captured and that 'UtilityFunctions.ps1' remains identifiable in the command line. Additionally, if the script is invoked in a non-standard manner or is part of a greater chain of obfuscation, the detection may fail. Required configurations may include ensuring comprehensive logging of PowerShell script execution and appropriate filtering of legitimate administrative activities to minimize false positives.

