  ---

  ### Technical Context

  This Sigma rule detects the invocation of the `WMIC.exe` tool to terminate processes using the `call terminate` command. Attackers often use this to disrupt security controls, terminate critical applications, or interfere with standard operations during an intrusion. The relevant MITRE ATT&CK tactic is Execution (T1203) and the technique is Windows Management Instrumentation (WMI) (T1047).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688) and application activity logs that specifically note `WMIC.exe` usage. If malicious, this behavior could lead to critical application downtime or the disabling of endpoint security measures. However, this detection does not, on its own, confirm malicious intent; benign use of `WMIC.exe` can also occur in legitimate administrative scenarios.

  ---

  ### Investigation Steps

  - **Check process invocation details**: Review Security Event ID 4688 logs for the creation of `WMIC.exe`. Confirm the parent process context to differentiate between standard administrative use and potential abuse.

  - **Analyze command line arguments**: Inspect the command line parameters associated with the `WMIC.exe` process. Look for calls to `terminate` that identify which processes were targeted. Legitimate usage typically includes administrative commands without destructive operations.

  - **Identify associated user accounts**: Cross-reference the user account executing this command with known administrative roles. Non-standard or anomalous account usage may indicate malicious activity.

  - **Scrutinize process termination logs**: Check if the terminated application is one critical to security operations (e.g., antivirus or monitoring services). The termination of such processes may point to an adversarial approach to disable defenses.

  - **Correlate with historical data**: Validate if there are multiple or repetitive occurrences of this action in a short timeframe, which may suggest automation or scripted exploitation techniques.

  - **Evaluate endpoint impact**: Confirm if any other alerts or abnormal logs from this endpoint correlate with the process termination activity. This includes additional logs from the same timeframe which might show prior lateral movement or exploitation activities.

  ---

  ### Prioritization

  This alert should be treated with medium priority as it indicates potential disruption of critical applications. The likelihood of malicious abuse can be significant if it leads to termination of security processes, making this behavior a common tactic in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers leverage other legitimate process manipulation tools with similar capabilities. It is essential to ensure logging for Windows Management Instrumentation is properly configured for comprehensive coverage. Legitimate administrative tasks can trigger this alert, particularly during maintenance. A related detection to consider is `Uninstall Security Products (ID: 847d5ff3-8a31-4737-a970-aeae8fe21765)`, which further strengthens the coverage of security process interruption behaviors.

