title: Private Keys Reconnaissance Via CommandLine Tools
id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
status: test
description: Adversaries may search for private key certificate files on 
  compromised systems for insecurely stored credential
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.004/T1552.004.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2021-07-20
modified: 2023-03-06
tags:
- attack.credential-access
- attack.t1552.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cmd_cli:
    CommandLine|contains: 'dir '
  selection_pwsh_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains: 'Get-ChildItem '
  selection_findstr:
  - Image|endswith: '\findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_ext:
    CommandLine|contains:
    - '.key'
    - '.pgp'
    - '.gpg'
    - '.ppk'
    - '.p12'
    - '.pem'
    - '.pfx'
    - '.cer'
    - '.p7b'
    - '.asc'
  condition: selection_ext and (all of selection_cmd_* or all of 
    selection_pwsh_* or selection_findstr)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts by an adversary to search for private key certificate files within a system using command-line tools like `cmd.exe`, `powershell.exe`, and `findstr.exe`. The likely objective is to identify insecurely stored credential files that could grant unauthorized access to the system or network resources. The relevant MITRE ATT&CK tactic affected is Credential Access, specifically through `T1552.004 - Credentials from Password Managers`.

  Primary telemetry sources include Windows process creation logs, particularly focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to credential theft or escalated privileges within the environment. It's crucial to note that this detection does NOT confirm malicious activity on its own; legitimate users might also access these files for valid administrative purposes.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Security Event ID 4688 logs for instances where `cmd.exe`, `powershell.exe`, or `findstr.exe` are executed. Pay close attention to the parent process; suspicious instances may have a non-standard parent, indicating potential misuse.

  - **Analyze Command Lines for Sensitive File Extensions**: Focus on logs that show command lines containing file extensions indicative of private keys (.key, .pgp, .gpg, .ppk, .p12, .pem, .pfx, .cer, .p7b, .asc). Client queries with these extensions suggest intent to locate sensitive files.

  - **Cross-reference with Legitimate Activity**: Investigate expected behavior related to system administration tasks. For instance, querying for certificate files may be legitimate if associated with authorized IT tasks, especially in environments handling cryptographic materials.

  - **Identify High-Confidence Malicious Indicators**: Look for command line strings that exhibit possibly malicious intent, such as `dir *.* | findstr /i ".key .pem .gpg"`, particularly in unexpected contexts or by unauthorized users.

  - **Examine User Context**: Identify the user account initiating these commands. Reports of anomalies or unauthorized access patterns from high-privilege accounts should be prioritized for further investigation.

  - **Validate for Potential Data Exfiltration**: Check for subsequent actions that might indicate further action after locating private key files, such as file transfers or modifications (e.g., Security Event ID 4663 for file access), which could signify malicious intent.

  ### Prioritization

  This alert has a medium severity level due to the potential risk associated with compromised systems where adversaries search for sensitive files. The likelihood of abuse is significant, as credential theft through improperly secured private keys is a common tactic by attackers. The behavior described in the logs is often weaponized in reconnaissance phases of attacks.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques such as encoded command execution or usage of non-standard scripts to access files. Reliable detection necessitates comprehensive logging of process creations and command line executions across all systems. Legitimate administrative practices, such as routine audits, might also trigger this alert. Related detections, such as file access patterns or network transfer events, can enhance coverage and provide context surrounding credential access attempts.

