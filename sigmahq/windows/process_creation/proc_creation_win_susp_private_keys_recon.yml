title: Private Keys Reconnaissance Via CommandLine Tools
id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
status: test
description: Adversaries may search for private key certificate files on compromised
  systems for insecurely stored credential
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.004/T1552.004.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2021-07-20
modified: 2023-03-06
tags:
- attack.credential-access
- attack.t1552.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cmd_cli:
    CommandLine|contains: 'dir '
  selection_pwsh_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains: 'Get-ChildItem '
  selection_findstr:
  - Image|endswith: '\findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_ext:
    CommandLine|contains:
    - '.key'
    - '.pgp'
    - '.gpg'
    - '.ppk'
    - '.p12'
    - '.pem'
    - '.pfx'
    - '.cer'
    - '.p7b'
    - '.asc'
  condition: selection_ext and (all of selection_cmd_* or all of selection_pwsh_*
    or selection_findstr)
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential reconnaissance activities conducted by adversaries seeking private key certificate files on Windows systems. Attackers may exploit insecurely stored credentials, which could lead to unauthorized access or further exploitation within a network. The rule looks for the use of command-line tools like `cmd.exe`, `PowerShell`, and `findstr` to search for file types associated with cryptographic keys and certificates, which are crucial in establishing secure communications and authenticating users or systems.

  The relevant MITRE ATT&CK tactics include **Credential Access (TA0006)**, specifically the technique **"Credential Dumping: Private Keys" (T1552.004)**. The underlying assumption here is that malicious actors may utilize these command-line tools to enumerate sensitive files within the directory structure, indicating a strategic step in their broader attack objectives, such as lateral movement or data exfiltration.

  The primary data sources for this detection include **process creation events** generated by the Windows operating system, which document the execution of commands alongside their associated command-line arguments. These logs will provide crucial insight into potentially malicious activities targeting private key files.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation events for instances of `cmd.exe`, `powershell.exe`, and `findstr.exe` running in conjunction with patterns indicative of searching for private key files (e.g., command lines including `.key`, `.pgp`, etc.).

  - **Correlate with File Access Logs:** Check file access logs for reads/writes of identified private key file types around the time of the command-line activity to establish whether the commands were successful in locating sensitive files.

  - **Investigate User Context:** Identify the user account associated with the suspicious command-line activity to determine whether it is a legitimate administrator performing maintenance or a compromised account executing reconnaissance.

  - **Examine System and Security Logs:** Look into other system and security logs for any further malicious behaviors, such as unauthorized access attempts or processes that could indicate lateral movement following the reconnaissance.

  ### Prioritization
  The alert should be considered medium priority due to the significant risk posed by an attacker seeking private key files, which may enable broader access or elevated privileges. The presence of such command-line activity raises concerns about potential exploitation and data compromise.

  ### Blind Spots and Assumptions
  This detection logic assumes that the target system's command-line tools are used in a predictable manner, and it may miss cases where file searches are conducted using alternative scripts or tools not covered in this rule. Additionally, if process creation logging is not enabled or properly configured, instances of this behavior may not be captured. There may also be legitimate uses of these command-line patterns that could be falsely flagged, thus emphasizing the need for thorough context-based analysis prior to action.

