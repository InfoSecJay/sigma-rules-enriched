title: Private Keys Reconnaissance Via CommandLine Tools
id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
status: test
description: Adversaries may search for private key certificate files on 
  compromised systems for insecurely stored credential
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.004/T1552.004.md
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2021-07-20
modified: 2023-03-06
tags:
- attack.credential-access
- attack.t1552.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_img:
  - Image|endswith: '\cmd.exe'
  - OriginalFileName: 'Cmd.Exe'
  selection_cmd_cli:
    CommandLine|contains: 'dir '
  selection_pwsh_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_pwsh_cli:
    CommandLine|contains: 'Get-ChildItem '
  selection_findstr:
  - Image|endswith: '\findstr.exe'
  - OriginalFileName: 'FINDSTR.EXE'
  selection_ext:
    CommandLine|contains:
    - '.key'
    - '.pgp'
    - '.gpg'
    - '.ppk'
    - '.p12'
    - '.pem'
    - '.pfx'
    - '.cer'
    - '.p7b'
    - '.asc'
  condition: selection_ext and (all of selection_cmd_* or all of 
    selection_pwsh_* or selection_findstr)
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_private_keys_recon/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the usage of Windows command-line tools (like cmd.exe, PowerShell, and findstr.exe) to search for files associated with private cryptographic keys. The likely objective of an attacker triggering this rule is to identify insecurely stored credentials that could be exploited for further lateral movement or unauthorized access. The applicable MITRE ATT&CK tactic is Credential Access, specifically technique T1552.004 (Stored Keys).

  Primary telemetry sources include process creation logs such as Windows Security Event ID 4688 and Sysmon Event ID 1, focusing on command-line argument values. If malicious, this behavior can lead to credential theft and compromised security posture. However, this detection does NOT definitively prove that the files are being accessed or exfiltrated; it merely indicates search activity in the vicinity of sensitive key files.

  ### Investigation Steps

  - **Examine process creation events:**
    Review Security Event ID 4688 or Sysmon Event ID 1, filtered for command lines containing keywords like “dir”, “Get-ChildItem”, or “findstr” combined with extensions like “.key”, “.pem”, etc. Note any unusual usage or automation in a non-administrative context.

  - **Identify high-confidence malicious behavior:**
    Look for executions of cmd.exe or PowerShell with command lines that recursively search for sensitive files, such as `cmd /c dir /s *.key` or `powershell Get-ChildItem -Recurse *.pfx`. Cross-reference process parent-child relationships to identify if this was invoked by unusual parent processes.

  - **Validate legitimate behavior:**
    Assess documented tasks or scheduled jobs that may legitimately invoke commands searching for these file types, especially by known administrative accounts. Authorized scans often exhibit clear command patterns that are proportional to system administration workloads.

  - **Correlate additional telemetry:**
    Cross-reference with Windows Event ID 4663 (access to an object) to see if similar processes show attempts to read or manipulate identified private key files during the alert timeframe, enhancing context around the detected command-line activity.

  - **Check for alternative legitimate commands:**
    Document legitimate usage patterns involving command-line tools where similar commands may be employed for maintenance or backup, helping to distinguish potential false positives.

  ### Prioritization

  The severity of this alert is medium due to its potential impact on credential security within the environment. Given that files associated with private keys can directly enable unauthorized access, this behavior indicates a likelihood of malicious intent, particularly if executed by non-administrative or unknown accounts. Such search commands are commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging settings or other tools that monitor file access; if logs of process activity are missing, true impacts are hard to gauge. Legitimate activities could include authorized IT support querying key files during maintenance. Related detections, such as those for suspicious file access patterns (T1083: File and Directory Discovery), can strengthen coverage by providing additional context on reconnaissance activity.

