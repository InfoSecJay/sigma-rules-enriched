logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ntdsutil.exe'
  - OriginalFileName: 'ntdsutil.exe'
  selection_cli:
  - CommandLine|contains|all:
    - 'snapshot'
    - 'mount '           # mounts a specific snapshot - Ex: ntdsutil snapshot "mount c2b3e2c6-1ffb-4625-ba8e-3503c27a9fcb" quit quit
  - CommandLine|contains|all:
              # This offers more coverage to the "selection_oneliner_1" case in rule 8bc64091-6875-4881-aaf9-7bd25b5dda08
              # The shorest form of "activate" can "ac". But "act", "acti"...etc are also valid forms
              # Same case with the "instance" flag
    - 'ac'
    - ' i'
    - ' ntds'
  condition: all of selection_*
falsepositives:
- Legitimate usage to restore snapshots
- Legitimate admin activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `ntdsutil.exe`, a powerful and legitimate Active Directory (AD) diagnostic tool. While it is often used by administrators for tasks such as restoring snapshots of the AD database or managing domain controllers, malicious actors may also exploit it to manipulate AD data or escalate privileges. The presence of this command in logs may indicate suspicious behavior, especially when it involves actions like mounting snapshots that could be leveraged for unauthorized access or privilege escalation.

  The likely objectives of an attacker employing this tool would include unauthorized changes to AD, the extraction of sensitive information, or the execution of lateral movement tactics. The relevant MITRE ATT&CK tactics involved here are "Credential Access" (TA0006) and the specific technique "Credential Dumping: NTDS" (T1003.003). These tactics and techniques illustrate how attackers may seek to compromise credentials through legitimate administrative tools to gain footholds in an environment.

  Primary data sources for this detection would be Windows process creation logs, which capture command executions. Additionally, examination of system logs and monitoring for any unusual AD activities, as well as the associated access rights of the user executing the command, will provide critical insights during an investigation.

  ### Investigation Steps
  - **Review Process Creation Logs:** Inspect the process creation logs for instances of `ntdsutil.exe` execution. Pay close attention to the command line arguments used and the context in which the tool was invoked.

  - **Analyze User Context:** Identify the user account executing the command. Determine if this user has legitimate administrative permissions and if their actions align with expected activities.

  - **Inspect AD Activity Logs:** Investigate Active Directory logs for any unusual modifications or queries that coincide with the usage of `ntdsutil.exe`, particularly those involving snapshot management or data retrieval.

  - **Validate Snapshot Activity:** If snapshots were mounted, ensure their corresponding creation logs and any subsequent modifications are reviewed to ascertain if unauthorized changes were made to AD data.

  ### Prioritization
  The alert's severity is set to medium, as the execution of `ntdsutil.exe` can have serious implications for security, particularly if used maliciously. Since this tool is critical for managing AD but also susceptible to misuse, any alerts warrant a timely response to avoid potential credential breaches or escalated privileges.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage lies in benign administrative use, which could lead to false positives when legitimate administrators execute `ntdsutil.exe` for acceptable purposes, such as routine maintenance. The detection logic assumes that all instances of the tool's execution are inherently suspicious, without considering context like user role or operational necessity. For effective alert functionality, it is essential to ensure that process creation logs are enabled and collected across all relevant systems where `ntdsutil.exe` might be executed.

