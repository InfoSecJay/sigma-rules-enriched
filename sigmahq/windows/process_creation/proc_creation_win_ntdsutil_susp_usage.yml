title: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
id: a58353df-af43-4753-bad0-cd83ef35eef5
related:
- id: 2afafd61-6aae-4df4-baed-139fa1f4c345
  type: derived
status: test
description: Detects execution of ntdsutil.exe to perform different actions such
  as restoring snapshots...etc.
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731620(v=ws.11)
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/espionage-asia-governments
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-14
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\ntdsutil.exe'
  - OriginalFileName: 'ntdsutil.exe'
  selection_cli:
  - CommandLine|contains|all:
    - 'snapshot'
    - 'mount '           # mounts a specific snapshot - Ex: ntdsutil snapshot "mount c2b3e2c6-1ffb-4625-ba8e-3503c27a9fcb" quit quit
  - CommandLine|contains|all:
              # This offers more coverage to the "selection_oneliner_1" case in rule 8bc64091-6875-4881-aaf9-7bd25b5dda08
              # The shorest form of "activate" can "ac". But "act", "acti"...etc are also valid forms
              # Same case with the "instance" flag
    - 'ac'
    - ' i'
    - ' ntds'
  condition: all of selection_*
falsepositives:
- Legitimate usage to restore snapshots
- Legitimate admin activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Active Directory diagnostic tool `ntdsutil.exe`, particularly when it is used to perform snapshot-related operations, which could indicate an attempt to manipulate Active Directory data or perform unauthorized data extraction. The likely attacker objective is to exploit snapshot capabilities to gain access to sensitive directory information or to create unauthorized backups of Active Directory (AD) objects. This behavior corresponds with the MITRE ATT&CK tactic "Credential Access" (TA0006) and technique "Credentials from Password Stores" (T1003.003).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for new process creation and Sysmon Event ID 1, which provides detailed information on the command line arguments used. If executed maliciously, the impact could range from unauthorized access to sensitive AD data to significant disruptions in directory services. Importantly, this detection does NOT confirm malicious activity on its own without corroborative context and additional evidence.

  ### Investigation Steps

  - **Review event logs for process creation:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for `ntdsutil.exe` execution. Look for unusual command line arguments that include "snapshot" and "mount". Malicious instances typically have complex command line structures that deviate from normal administrative use.

  - **Identify legitimate usage patterns:** Compare command line use against established baseline behavior. Legitimate executions by administrators will typically lack complex commands. For example, a typical admin might execute `ntdsutil.exe` with no more than basic parameters, signaling normal operational activities.

  - **Correlate with user account activity:** Cross-reference the execution with administrative account activity in Security Event ID 4624 (logon), particularly focusing on anomalous account behavior leading up to or following the execution of `ntdsutil.exe`.

  - **Check for related log artifacts:** Validate the presence of snapshot files or mount activities within the `C:\Windows\NTDS\` directory that correlate with the timestamps of detected executions, indicating unauthorized data access attempts.

  - **Evaluate access to critical assets:** Determine if the execution occurred on critical domain controllers or other sensitive systems within your environment. Exposure of these systems elevates the security risk.

  - **Review for known malicious indicators:** Check for reported malicious indicators associated with `ntdsutil.exe`, such as unusual user-defined scripts or sample hashes, to validate potential misuse.

  ### Prioritization

  This alert is considered medium severity due to the potential for high-impact actions against Active Directory. While `ntdsutil.exe` is a legitimate administrative tool, its misuse by an unauthorized actor can lead to critical security breaches, especially if related to credential harvesting or directory manipulation. This behavior is increasingly weaponized by adversaries targeting Active Directory environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed command line logging if Sysmon or appropriate event logging is not configured correctly. Legitimate administrative activities may trigger this alert, particularly in complex, multi-step admin tasks that use snapshots. A related detection, such as monitoring for unauthorized access to AD objects (via LDAP queries), would strengthen coverage against potential misuse of Active Directory management tools.

