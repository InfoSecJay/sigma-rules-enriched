title: Windows Shell/Scripting Processes Spawning Suspicious Programs
id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
status: test
description: Detects suspicious child processes of a Windows shell and scripting processes
  such as wscript, rundll32, powershell, mshta...etc.
references:
- https://mgreen27.github.io/posts/2018/04/02/DownloadCradle.html
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2018-04-06
modified: 2023-05-23
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.005
- attack.t1059.001
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
            # - '\cmd.exe'  # too many false positives
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\wmiprvse.exe'
    - '\regsvr32.exe'
    Image|endswith:
    - '\schtasks.exe'
    - '\nslookup.exe'
    - '\certutil.exe'
    - '\bitsadmin.exe'
    - '\mshta.exe'
  filter_ccmcache:
    CurrentDirectory|contains: '\ccmcache\'
  filter_amazon:
    ParentCommandLine|contains:
            # FP - Amazon Workspaces
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\setup-scheduledtask.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\set-selfhealing.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\check-workspacehealth.ps1'
    - '\nessus_'         # Tenable/Nessus VA Scanner
  filter_nessus:
    CommandLine|contains: '\nessus_'     # Tenable/Nessus VA Scanner
  filter_sccm_install:
    ParentImage|endswith: '\mshta.exe'
    Image|endswith: '\mshta.exe'
    ParentCommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\splash.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
    CommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\SMSSETUP\BIN\'
    - '\autorun.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
  condition: selection and not 1 of filter_*
falsepositives:
- Administrative scripts
- Microsoft SCCM
level: high
note: |
  ---

  ### Technical Context

  This rule detects the spawning of potentially malicious child processes from various Windows shell and scripting processes, such as PowerShell, MSHTA, and WScript. The likely objective of an attacker utilizing these processes is to execute arbitrary code or lateral movement within the network, often employing techniques that evade traditional detection methods. Related MITRE ATT&CK techniques include Execution through command-line interface (T1059.001) and scripting (T1059.005), which represent common avenues for executing commands on target systems.

  The primary telemetry sources for this detection are Windows process creation logs, specifically looking at Event ID 4688 (Process Creation) or Sysmon Event ID 1. If malicious, these actions could lead to unauthorized access or manipulation of system processes. However, this detection alone does NOT confirm malicious intent; benign scripts and administrative tasks may trigger similar behaviors.

  ---

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Security Event ID 4688 and/or Sysmon Event ID 1 logs for suspicious parent-child process relationships; investigate instances where child processes like "schtasks.exe" or "certutil.exe" are spawned from "powershell.exe" or "mshta.exe".

  - **Assess command-line arguments:** Analyze the CommandLine field for indicators of typical malicious usage; for example, look for unexpected parameters or obfuscated commands that are not common in legitimate administrative tasks.

  - **Verify existing administrative scripts:** Check for known administrative scripts or scheduled tasks that run under allowed directories such as “\MEM_Configmgr_” or "\Program Files\Amazon\WorkSpacesConfig\Scripts\" to identify legitimate workflow—any reference to these paths without the expected command structure should be further investigated.

  - **Cross-reference with endpoint behavior:** Confirm whether any observed behavior coincides with legitimate operational windows on crucial assets (e.g., servers running SCCM) and compare to typical execution patterns seen in your environment.

  - **Identify high-confidence malicious indicators:** Look for execution of restricted or sensitive tools such as “certutil.exe” or “bitsadmin.exe” that create network connections or download files without appropriate logging or documentation.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential impact on critical systems and infrastructure. The likelihood of malicious abuse is considerable given that the conflicts with common administrative activities can indicate exploitation techniques. Such behaviors are frequently weaponized by attackers, especially leveraging scripting for evasion.

  ---

  ### Blind Spots and Assumptions

  Detection may limit visibility into legitimate administrative processes that use similar child-parent relationships, leading to false positives from benign scripts or tools. Reliable detection requires full auditing of Windows process creation and can be impacted by configuration gaps in Sysmon or Windows event log policies. Additionally, related detections include monitoring for unusual script executions via process command lines or PowerShell logging to strengthen overall coverage.

