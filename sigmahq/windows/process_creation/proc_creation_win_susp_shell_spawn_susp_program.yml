title: Windows Shell/Scripting Processes Spawning Suspicious Programs
id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
status: test
description: Detects suspicious child processes of a Windows shell and scripting
  processes such as wscript, rundll32, powershell, mshta...etc.
references:
- https://mgreen27.github.io/posts/2018/04/02/DownloadCradle.html
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2018-04-06
modified: 2023-05-23
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.005
- attack.t1059.001
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
            # - '\cmd.exe'  # too many false positives
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\wmiprvse.exe'
    - '\regsvr32.exe'
    Image|endswith:
    - '\schtasks.exe'
    - '\nslookup.exe'
    - '\certutil.exe'
    - '\bitsadmin.exe'
    - '\mshta.exe'
  filter_ccmcache:
    CurrentDirectory|contains: '\ccmcache\'
  filter_amazon:
    ParentCommandLine|contains:
            # FP - Amazon Workspaces
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\setup-scheduledtask.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\set-selfhealing.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\check-workspacehealth.ps1'
    - '\nessus_'         # Tenable/Nessus VA Scanner
  filter_nessus:
    CommandLine|contains: '\nessus_'     # Tenable/Nessus VA Scanner
  filter_sccm_install:
    ParentImage|endswith: '\mshta.exe'
    Image|endswith: '\mshta.exe'
    ParentCommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\splash.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
    CommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\SMSSETUP\BIN\'
    - '\autorun.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
  condition: selection and not 1 of filter_*
falsepositives:
- Administrative scripts
- Microsoft SCCM
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious child processes from Windows shell and scripting processes, such as `mshta.exe`, `powershell.exe`, and `wscript.exe`. The attacker objective may involve executing malicious scripts or payloads through these common scripting hosts to achieve execution without raising immediate flags. This behavior aligns with the MITRE ATT&CK framework, specifically the tactics of Execution (TA0002) and Defense Evasion (TA0005), utilizing techniques like Command-Line Interface (T1059.001) and PowerShell (T1059.005).

  Primary telemetry sources include process creation logs from Windows Event ID 4688 and Sysmon Event ID 1. If associated with malicious activity, this could allow attackers to execute unwanted actions, potentially leading to data exfiltration or system compromise. However, this detection does NOT confirm malicious intent on its own; it requires corroboration with additional context and investigative steps.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for parent process and child process relationships. Look for child processes spawned from `mshta.exe`, `powershell.exe`, `wscript.exe`, etc.

  - **Identify Malicious Command Lines:** Focus on any instances where `powershell.exe` or `mshta.exe` spawn `schtasks.exe`, `certutil.exe`, or `bitsadmin.exe`. Search for malicious command line patterns (e.g., PowerShell scripts invoking encoded commands or unusual flags).

  - **Assess Current Directory Context:** Validate if the `CurrentDirectory` for suspicious processes includes `\ccmcache\`, as this may indicate legitimate SCCM activity rather than potential misuse.

  - **Check for Known False Positives:** Be aware of administrative scripts or Microsoft SCCM activities that might trigger this alert. Review the parent command lines for common paths, such as `C:\MEM_Configmgr_`, which indicates legitimate SCCM operations.

  - **Evaluate Automated Response Actions:** If this activity is part of a larger investigation, correlate with alerts related to other techniques typically used in integrated attacks, such as lateral movement activities or credential theft.

  - **Inspect Artifact Creation:** If the detection occurred shortly after suspicious process activation, verify if files related to potential exfiltration were created or modified, focusing on powershell scripts or other script-related artifacts in temporary directories.

  ### Prioritization

  This alert has a high severity due to the potential for exploitation via misused scripting hosts that are commonly weaponized by attackers to perform malicious actions. The affected systems may hold critical data or resources, increasing the risk of a significant security incident if compromised.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative tasks that routinely use the affected processes, which can create noise around this alert. Reliable detection requires configuration of Sysmon for detailed process logging; otherwise, significant process-related information may be missed. Legitimate activities, such as approved system maintenance or software installation, may trigger false positives. Companion detections through PowerShell logging (e.g., PowerShell command logs) can provide additional context and support broader threat detection efforts.

