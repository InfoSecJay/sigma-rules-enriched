title: Windows Shell/Scripting Processes Spawning Suspicious Programs
id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
status: test
description: Detects suspicious child processes of a Windows shell and scripting
  processes such as wscript, rundll32, powershell, mshta...etc.
references:
- https://mgreen27.github.io/posts/2018/04/02/DownloadCradle.html
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2018-04-06
modified: 2023-05-23
tags:
- attack.execution
- attack.stealth
- attack.t1059.005
- attack.t1059.001
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
            # - '\cmd.exe'  # too many false positives
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\wmiprvse.exe'
    - '\regsvr32.exe'
    Image|endswith:
    - '\schtasks.exe'
    - '\nslookup.exe'
    - '\certutil.exe'
    - '\bitsadmin.exe'
    - '\mshta.exe'
  filter_ccmcache:
    CurrentDirectory|contains: '\ccmcache\'
  filter_amazon:
    ParentCommandLine|contains:
            # FP - Amazon Workspaces
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\setup-scheduledtask.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\set-selfhealing.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\check-workspacehealth.ps1'
    - '\nessus_'         # Tenable/Nessus VA Scanner
  filter_nessus:
    CommandLine|contains: '\nessus_'     # Tenable/Nessus VA Scanner
  filter_sccm_install:
    ParentImage|endswith: '\mshta.exe'
    Image|endswith: '\mshta.exe'
    ParentCommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\splash.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
    CommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\SMSSETUP\BIN\'
    - '\autorun.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
  condition: selection and not 1 of filter_*
falsepositives:
- Administrative scripts
- Microsoft SCCM
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious child processes spawned by Windows shell and scripting utilities, specifically looking for patterns where tools like `mshta.exe`, `powershell.exe`, and `rundll32.exe` spawn or execute other processes such as `schtasks.exe` or `certutil.exe`. Attackers often use these tools to orchestrate malicious activities, such as executing payloads or establishing persistence mechanisms. The relevant MITRE ATT&CK techniques involved are Execution (T1059) and Stealth (T1218).

  The primary telemetry source is Windows process creation events tracked by Event ID 4688, which captures the details of newly created processes including their parent process. If malicious, this could lead to unauthorized access, lateral movement, or data exfiltration. Importantly, this detection does not independently confirm malicious intent or activity; further contextual investigation is needed.

  ### Investigation Steps

  - **Check parent process details:** Review Event ID 4688 logs for processes with ParentImage showing `mshta.exe`, `powershell.exe`, or `rundll32.exe`. Look for suspicious command lines directing execution of `schtasks.exe`, `certutil.exe`, or similar known utilities.

  - **Identify the full command line used:** Inspect the CommandLine field in Event ID 4688 logs to determine the arguments passed to suspicious processes. Malicious command lines may include unusual flags or scripts not typical in organizational operational tasks.

  - **Review historical activity of the parent process:** Correlate the process creation with historical logs for the parent processes to analyze typical patterns. If `powershell.exe` is frequently seen executing benign activity (like telemetries or updates), this may indicate legitimate usage.

  - **Look for indicators of lateral movement:** Search for network connections or further process creations linked to `schtasks.exe` and `certutil.exe`, which may indicate attempts to establish persistence or exfiltrate data. Use Process Explorer or Sysinternals to compile details on network connections made by the processes.

  - **Consider asset criticality:** Determine if the affected asset is a critical server or a standard workstation. Greater scrutiny is warranted for critical hosts, considering they may be prime targets for attacks.

  - **Validate against known administrative use cases:** Cross-reference the command line or behavior against your documentation on SCCM and administrative scripts to identify known benign usages. If the command includes references to `MEM_Configmgr`, it may relate to legitimate administrative tasks.

  ### Prioritization

  This alert should be treated with high priority, especially in environments where Windows-based administrative utilities are commonly exploited by attackers. These behaviors are frequent in both malware campaigns and targeted attacks, indicating potential malicious involvement that warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environment misconfigurations or lack of comprehensive logging, especially in managed IT environments where legitimate administrative activities might trigger the alert. This rule may also yield false positives due to administrative scripts or SCCM activities, necessitating a thorough contextual review. Companion detections, such as monitoring network connections by these processes for unusual outbound traffic, can provide additional context and improve detection confidence.

