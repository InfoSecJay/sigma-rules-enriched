title: Windows Shell/Scripting Processes Spawning Suspicious Programs
id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
status: test
description: Detects suspicious child processes of a Windows shell and scripting
  processes such as wscript, rundll32, powershell, mshta...etc.
references:
- https://mgreen27.github.io/posts/2018/04/02/DownloadCradle.html
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2018-04-06
modified: 2023-05-23
tags:
- attack.execution
- attack.stealth
- attack.t1059.005
- attack.t1059.001
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
            # - '\cmd.exe'  # too many false positives
    - '\rundll32.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\wmiprvse.exe'
    - '\regsvr32.exe'
    Image|endswith:
    - '\schtasks.exe'
    - '\nslookup.exe'
    - '\certutil.exe'
    - '\bitsadmin.exe'
    - '\mshta.exe'
  filter_ccmcache:
    CurrentDirectory|contains: '\ccmcache\'
  filter_amazon:
    ParentCommandLine|contains:
            # FP - Amazon Workspaces
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\setup-scheduledtask.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\set-selfhealing.ps1'
    - '\Program Files\Amazon\WorkSpacesConfig\Scripts\check-workspacehealth.ps1'
    - '\nessus_'         # Tenable/Nessus VA Scanner
  filter_nessus:
    CommandLine|contains: '\nessus_'     # Tenable/Nessus VA Scanner
  filter_sccm_install:
    ParentImage|endswith: '\mshta.exe'
    Image|endswith: '\mshta.exe'
    ParentCommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\splash.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
    CommandLine|contains|all:
    - 'C:\MEM_Configmgr_'
    - '\SMSSETUP\BIN\'
    - '\autorun.hta'
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
  condition: selection and not 1 of filter_*
falsepositives:
- Administrative scripts
- Microsoft SCCM
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_shell_spawn_susp_program/info.yml
note: |
  ### Technical Context

  This Sigma rule detects suspicious behaviors where processes commonly associated with Windows shell and scripting tools (e.g., mshta.exe, PowerShell) spawn other binaries or scripts that could indicate malicious activity. The behavior can align with attacker objectives such as executing payloads, establishing persistence, or downloading additional malware. Relevant MITRE ATT&CK tactics include Execution (T1203, T1059) and Stealth (T1218). Primary telemetry sources include process creation events, specifically Windows Event ID 4688 and Sysmon Event ID 1, focused on parent-child process relationships. If malicious, such behavior could escalate privileges or lead to data breaches. This detection does NOT confirm the intent of the action; legitimate administrative scripts may trigger the rule.

  ### Investigation Steps

  - **Check parent-child process relationships:** Examine Windows Event ID 4688 for process creation events where ParentImage is one of the specified scripting processes (e.g., mshta.exe), looking for unusual Image values (e.g., schtasks.exe) that may indicate malicious activity.
  - **Review command line arguments:** Pay close attention to the CommandLine field in Event ID 4688 for parameters that may indicate misuse, such as downloading executables or executing scripts, especially from temp directories or other unusual paths. Look for high-confidence indicators like `-ExecutionPolicy Bypass`.
  - **Identify legitimate administrative usage:** Compare detected processes against known administrative or operational tasks in your organization. Validate against scripts run through SCCM or from trusted sources that use mshta or PowerShell in a controlled manner.
  - **Investigate CurrentDirectory for signs of malware:** Check the CurrentDirectory field for directories such as `\ccmcache\` which may indicate legitimate SCCM operations versus suspicious directories indicative of malware staging.
  - **Correlate with security monitoring tools:** If using an EDR or similar tools, check for any endpoint alerts related to the indicated processes occurring around the same time, which could provide context or additional details surrounding the suspicious activity.

  ### Prioritization

  The alert should be considered high priority due to the potential for system compromise through execution of malicious scripts. Given that many types of malware leverage common Windows utilities like PowerShell, the likelihood of abuse is substantial. Such behaviors are frequently observed in real-world attack scenarios.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques such as obfuscated scripts or legitimate administrative actions executed under unusual circumstances. Reliable detection requires comprehensive logging of process creation, ensuring both Event ID 4688 and Sysmon logs are enabled and properly configured. Legitimate operations, such as those executed by SCCM, may trigger the alert, necessitating additional context for accurate assessment. A complementary detection rule related to unusual outbound network connections initiated by the same process can strengthen coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
