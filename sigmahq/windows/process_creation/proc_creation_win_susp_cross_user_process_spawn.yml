title: Suspicious Cross-User Process Spawn
id: d2b7a134-9c3e-4f8a-b56d-e0c1f8a29b47
status: experimental
description: |
  Detects suspicious spawning of a process under a different user context than the parent process.
  Processes such as notepad.exe, calculator etc. are generally spawned under the same user context and
  also they are often targeted as sacrificial process or decoy process to check successful privilege escalation.
references:
- https://github.com/MSNightmare/LegacyHive
- https://git.projectnightcrawler.dev/NightmareEclipse/LegacyHive
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-07-23
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
- attack.t1134
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\notepad.exe'
    - '\calc.exe'
    - '\mspaint.exe'
    - '\wordpad.exe'
    - '\write.exe'
  filter_main_same_user:
    User|fieldref: ParentUser
  filter_optional_user_null:
    User:
  filter_optional_parent_null:
    ParentUser:
  filter_optional_empty_user:
  - ParentUser:
    - ''
    - '-'
  - User:
    - ''
    - '-'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- RunAs usage spawning one of the listed binaries under a different account
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_susp_cross_user_process_spawn/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the spawning of specific processes (e.g., notepad.exe, calc.exe) under a different user context than their parent processes. The likely attacker objective is to test for successful privilege escalation by using common applications as decoy processes, which could indicate lateral movement or exploitation attempts. This behavior aligns with the MITRE ATT&CK techniques for Privilege Escalation (T1068) and Multiple Processes (T1055).

  The primary telemetry source is Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could indicate an attempted bypass of security controls or unauthorized access to a higher privilege user context. However, it is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate tools (like RunAs) may also prompt similar behavior.

  ### Investigation Steps

  - **Review process creation logs**: Check Event ID 4688 and Sysmon Event ID 1 for details on the spawned process and parent process relationships, focusing on the 'Image' and 'User' fields.

  - **Identify legitimate process spawning cases**: Confirm whether the observed process was executed under expected circumstances, such as a scheduled task or specific user actions, where the parent process and child process share the same user context.

  - **Look for high-confidence malicious indicators**: Check for known malicious command lines or unusual parent-child relationships, such as notepad.exe being spawned by a system-level process under a different user context.

  - **Validate user account behavior**: Investigate the User and ParentUser fields to ensure that the spawning activity aligns with the expected roles of the users involved, especially focusing on any unfamiliar user accounts.

  - **Cross-reference logged events**: Use associated alerting mechanisms to see if there are any related suspicious activities in the environment around the same timeframe, including logins to the affected systems, which could signify lateral movement or access attempts.

  ### Prioritization

  The alert has medium severity due to the potential for significant security impacts on critical systems, particularly if coupled with other indicators of compromise. The likelihood of malicious use is moderate, as adversaries commonly exploit such decoy processes to mask their actions during attacks.

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques where an attacker may use legitimate tools to spawn processes without raising flags. Required log sources must be configured to capture comprehensive process creation data (both Event ID 4688 and Sysmon Event ID 1) for reliable detection. Legitimate administrative activities using tools such as RunAs may trigger this alert. A related detection to bolster coverage could involve monitoring for unexpected use of process injection techniques (MITRE T1055) in tandem with cross-user process spawning.

