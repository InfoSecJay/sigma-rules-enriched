title: LSA PPL Protection Setting Modification via CommandLine
id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
status: test
description: |
  Detects modification of LSA PPL protection settings via CommandLine.
  It may indicate an attempt to disable protection and enable credential dumping tools to access LSASS process memory.
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
- https://github.com/shoober420/windows11-scripts/blob/38d83331738cd713ccb42f2c4557d17a27aefd98/Windows11Tweaks.bat#L1825
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron 
  Systems)
date: 2022-03-22
modified: 2026-03-13
tags:
- attack.defense-evasion
- attack.t1562.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\reg.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'reg.exe'
    - 'powershell.exe'
    - 'pwsh.dll'
  selection_cli_action:
    CommandLine|contains|all:
    - 'ControlSet'
    - '\Control\Lsa'
    CommandLine|contains:
    - 'Set-ItemProperty'
    - 'New-ItemProperty'
    - ' add '
  selection_key:
    CommandLine|contains:
    - 'IsPplAutoEnabled'
    - 'RunAsPPL'
    - 'RunAsPPLBoot'
  condition: all of selection_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Local Security Authority (LSA) Protected Process Light (PPL) settings via command-line utilities such as `reg.exe` and PowerShell. The behavior typically indicates an actor's intention to disable essential protections, potentially enabling unauthorized access to sensitive data in memory, particularly targeting the LSASS (Local Security Authority Subsystem Service) process for credential dumping.

  The detection relates to the MITRE ATT&CK technique for **Defense Evasion** (T1562.010). The primary sources for telemetry include Windows process creation events, specifically Security Event ID 4688 for process creation history along with Sysmon Event ID 1 for more granular command-line detail. If the changes are indeed malicious, they can lead to significant security compromise, allowing adversaries to extract credentials. However, this detection does not confirm malicious intent by itself, as legitimate administrative actions may invoke similar modifications.

  ### Investigation Steps

  - **Review the command-line parameters:** Check Security Event ID 4688 or Sysmon Event ID 1 for entries involving `reg.exe` or `powershell.exe` that contain `Set-ItemProperty`, `New-ItemProperty`, or other keywords related to LSA such as `IsPplAutoEnabled`. Cross-reference with expected administrative changes to identify inconsistencies.

  - **Contextualize asset criticality:** Identify the system from which the alert originated. An alert from a Domain Controller would require immediate attention, whereas a non-critical endpoint may warrant further investigation before escalation.

  - **Correlate with existing policies:** Review group policy settings and documentation to determine if the modifications align with enterprise security standards. Legitimate changes would typically be documented for validation.

  - **Identify common malicious indicators:** Look for command-line arguments and modifications specifically aimed at disabling LSA protections, including entries reflecting unusual or unauthorized access to sensitive registry keys (e.g., `RunAsPPL` or `RunAsPPLBoot`).

  - **Analyze process creation timelines:** Check for any suspicious process executions corresponding to the detected command, particularly around the same time frame. For instance, protracted execution of `powershell.exe` with command-line modifications could indicate scripted activity.

  - **Validate the persistence of changes:** Investigate related registry modifications through `reg.exe` or PowerShell logs for any follow-up changes post-alert. This might reveal persistent malicious actions or comfort with benign changes.

  ### Prioritization

  This alert warrants high priority in enterprise operations due to its potential impact on critical systems like Domain Controllers and the likelihood of malicious abuse by threat actors aimed at credential theft. The straightforward nature of weaponizing LSA protections makes it a common tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection is limited by legitimate administrative activities that may trigger similar command-line patterns, such as approved system hardening scripts. Ensure that log sources (particularly Security Event ID 4688 and Sysmon logs) are correctly configured for full coverage. Additionally, the same command-line parameters may also arise from automated system scripts not associated with malicious intent, highlighting the need for context in investigations. Consider employing companion detections for credential dumping attempts (e.g., targeting LSASS directly).

