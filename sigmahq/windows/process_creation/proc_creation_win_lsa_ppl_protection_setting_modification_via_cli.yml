title: LSA PPL Protection Setting Modification via CommandLine
id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
status: test
description: |
  Detects modification of LSA PPL protection settings via CommandLine.
  It may indicate an attempt to disable protection and enable credential dumping tools to access LSASS process memory.
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
- https://github.com/shoober420/windows11-scripts/blob/38d83331738cd713ccb42f2c4557d17a27aefd98/Windows11Tweaks.bat#L1825
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron 
  Systems)
date: 2022-03-22
modified: 2026-03-13
tags:
- attack.defense-impairment
- attack.t1689
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\reg.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'reg.exe'
    - 'powershell.exe'
    - 'pwsh.dll'
  selection_cli_action:
    CommandLine|contains|all:
    - 'ControlSet'
    - '\Control\Lsa'
    CommandLine|contains:
    - 'Set-ItemProperty'
    - 'New-ItemProperty'
    - ' add '
  selection_key:
    CommandLine|contains:
    - 'IsPplAutoEnabled'
    - 'RunAsPPL'
    - 'RunAsPPLBoot'
  condition: all of selection_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to LSA (Local Security Authority) Protected Process Light (PPL) settings using command line tools. Such behaviors may suggest an attempt to disable security protections and facilitate credential dumping from the LSASS (Local Security Authority Subsystem Service) memory, allowing attackers to exfiltrate sensitive credentials. The relevant MITRE ATT&CK tactic is Defense Evasion, specifically technique T1689 (Lateral Movement: LSA Protection).

  Primary telemetry sources include Windows process creation logs available via Security Event ID 4688 and Sysmon Event ID 1. If successful and malicious, these modifications can lead to account compromise and unauthorized access to secure resources. This detection does NOT confirm that a compromise has occurred; it only indicates potentially malicious intent or behavior related to changing critical security settings.

  ### Investigation Steps

  - **Check command-line arguments:** Review Security Event ID 4688 for processes like `reg.exe`, `powershell.exe`, or `pwsh.exe`. Look for command lines containing 'ControlSet', 'Set-ItemProperty', or 'New-ItemProperty' which indicate attempts to modify LSA settings.

  - **Identify high-confidence malicious indicators:** Validate if any command lines contain 'IsPplAutoEnabled', 'RunAsPPL', or 'RunAsPPLBoot' along with indications of attempt to add or modify these properties. These are strong signs of malicious activity aimed at disabling LSA protections.

  - **Review process creation history:** Analyze Sysmon Event ID 1 for the timing and frequency of the detected event. A sudden spike in registry modification attempts, especially during unusual hours for system administration tasks, could indicate malicious activity.

  - **Correlate with legitimate activities:** Determine whether the detected command line reflects expected administrative actions or legitimate security configuration changes, comparing against your organization’s baseline configuration management practices.

  - **Assess the asset's role:** Identify the host's criticality and role in your environment. Modifications on domain controllers or high-privilege endpoints require a higher urgency in response than those on less critical systems.

  ### Prioritization

  This alert has medium-severity in an enterprise context due to the potential impact on credential security and overall system integrity. Although the frequency of such modifications may vary, attackers commonly utilize this technique as part of broader credential theft strategies, warranting timely investigation.

  ### Blind Spots and Assumptions

  There are limitations to this detection as legitimate administrative tools might legitimately perform similar modifications during regular operations or updates. Ensure that real-time logging of process creation, particularly from systems managing sensitive data, is enabled. Also, consider related detections for credential dumping attempts, such as monitoring for abnormal LSASS access patterns or specific credential dumping tools, to strengthen detection coverage.

