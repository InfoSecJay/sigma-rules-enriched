title: Suspicious Execution of Powershell with Base64
id: fb843269-508c-4b76-8b8d-88679db22ce7
status: test
description: Commandline to launch powershell with a base64 payload
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-20---powershell-invoke-known-malicious-cmdlets
- https://unit42.paloaltonetworks.com/unit42-pulling-back-the-curtains-on-encodedcommand-powershell-attacks/
- https://mikefrobbins.com/2017/06/15/simple-obfuscation-with-powershell-using-base64-encoding/
author: frack113
date: 2022-01-02
modified: 2023-01-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -e '
    - ' -en '
    - ' -enc '
    - ' -enco'
    - ' -ec '
  filter_encoding:
    CommandLine|contains: ' -Encoding '
  filter_azure:
    ParentImage|contains:
    - 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
    - '\gc_worker.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of PowerShell using encoded commands, specifically commands that include Base64-encoded payloads. The likely objective of an attacker using this technique is to execute malicious scripts while evading detection mechanisms that monitor plaintext command lines. This behavior correlates with the MITRE ATT&CK technique T1059.001 (Command and Scripting Interpreter: PowerShell).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1 for detailed command line arguments. If malicious, this behavior poses a significant security risk as Base64 encoding may be employed to disguise the true nature of the executed command, potentially leading to data exfiltration or system compromise. Importantly, this detection does NOT confirm that the encoded command is malicious or resulted in successful exploitation without corroborating evidence from other telemetry sources.

  ### Investigation Steps

  - **Review triggered alerts:** Correlate Security Event ID 4688 entries related to PowerShell execution. Pay attention to the CommandLine field for signs of encoded payloads (e.g., `-e`, `-enc`).

  - **Analyze command context:** Identify the parent process of the PowerShell instance. Process trees may reveal legitimate administrative actions (e.g., from `C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe`), which could indicate benign usage.

  - **Check execution history:** Use Sysmon Event ID 1 to track details on previously executed commands. Look for repetitive patterns of encoded PowerShell execution that indicate consistent malicious behavior.

  - **Identify Base64 decoded commands:** Decode the Base64 string found in the command line. Use tools or scripts to check for clear indications of malicious actions, such as network calls or file manipulations.

  - **Search for exfiltration artifacts:** Review relevant logs for file creation or downloads initiated by the PowerShell command. Specifically, check for any suspicious file types or network connections made to unusual endpoints.

  - **Investigate historical data:** Look at past Security and Sysmon events involving PowerShell on this system. Determine if this encoded execution pattern exists elsewhere, suggesting potential lateral movement.

  ### Prioritization

  The alert is assessed as medium severity due to the potential impact on enterprise systems, especially if involving critical infrastructure. Encoded PowerShell commands are frequently associated with malicious actors who seek to bypass detection, thus the likelihood of malicious abuse is high.

  ### Blind Spots and Assumptions

  Evasion techniques include the use of various encoding methods or alternative command shells, which may not trigger this specific rule. Reliable detection requires configuration of Sysmon and Security Event logs to capture detailed process creation data. Legitimate activities that may trigger this alert include administrative scripts for routine maintenance tasks. A related detection to consider is monitoring direct Base64 encoding commands in logs prior to execution, which can provide early warning of potential misuse.

