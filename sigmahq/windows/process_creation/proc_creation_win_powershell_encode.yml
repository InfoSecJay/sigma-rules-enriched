title: Suspicious Execution of Powershell with Base64
id: fb843269-508c-4b76-8b8d-88679db22ce7
status: test
description: Commandline to launch powershell with a base64 payload
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-20---powershell-invoke-known-malicious-cmdlets
- https://unit42.paloaltonetworks.com/unit42-pulling-back-the-curtains-on-encodedcommand-powershell-attacks/
- https://mikefrobbins.com/2017/06/15/simple-obfuscation-with-powershell-using-base64-encoding/
author: frack113
date: 2022-01-02
modified: 2023-01-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -e '
    - ' -en '
    - ' -enc '
    - ' -enco'
    - ' -ec '
  filter_encoding:
    CommandLine|contains: ' -Encoding '
  filter_azure:
    ParentImage|contains:
    - 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
    - '\gc_worker.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious executions of PowerShell where the command line includes a Base64 encoded payload. Attackers often use encoded PowerShell commands to obfuscate their activities, making it difficult for traditional defenses to detect malicious behavior. The primary objective of such attacks typically involves executing malware, establishing persistence, or performing reconnaissance within the target environment.

  Relevant MITRE ATT&CK tactics include **Execution (TA0002)** and techniques such as **PowerShell (T1059.001)**, which highlights how attackers exploit PowerShell's capabilities to run scripts and commands. The successful execution of Base64 encoded commands may indicate attempts to bypass security controls and avoid detection by security monitoring tools.

  Primary data sources for collecting evidence related to this detection include **process creation logs**, which provide detailed information about commands executed on systems following the PowerShell executable, and **event logs** that capture anomalies in command line arguments.

  ### Investigation Steps
  - **Collect Process Creation Events**: Review the process creation logs for instances of `powershell.exe` or `pwsh.exe` where the command line arguments contain encoding flags such as `-e`, `-en`, or `-enc`.
  - **Analyze Command Line Arguments**: Investigate the full command lines for unusual patterns or integration with external sites, which may indicate the retrieval of malicious payloads.
  - **Review Parent Process Information**: Check the parent process of the PowerShell execution to determine if it originated from a legitimate application or was spawned by untrusted processes, particularly looking for instances involving `gc_worker.exe` or `GuestConfiguration`.
  - **Assess System Context**: Determine the user and system context of the execution to evaluate if it aligns with typical behavior or indicates possible credential misuse or privilege escalation.

  ### Prioritization
  This alert is categorized with medium severity due to the potential threat posed by encoded PowerShell commands, which can serve as a prelude to more severe attacks, such as data exfiltration or lateral movement within the network.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage when script execution occurs through obfuscated methods that do not utilize Base64 encoding or those that involve alternative PowerShell instances or command execution tools. The logic assumes that abnormal command lines are malicious, but legitimate uses of PowerShell may also utilize encoded commands. To ensure effective detection, comprehensive logging of command line executions and process creation events must be enabled on Windows hosts.

