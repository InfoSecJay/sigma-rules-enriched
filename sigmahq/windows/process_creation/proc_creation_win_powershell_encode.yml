title: Suspicious Execution of Powershell with Base64
id: fb843269-508c-4b76-8b8d-88679db22ce7
status: test
description: Commandline to launch powershell with a base64 payload
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-20---powershell-invoke-known-malicious-cmdlets
- https://unit42.paloaltonetworks.com/unit42-pulling-back-the-curtains-on-encodedcommand-powershell-attacks/
- https://mikefrobbins.com/2017/06/15/simple-obfuscation-with-powershell-using-base64-encoding/
author: frack113
date: 2022-01-02
modified: 2023-01-05
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -e '
    - ' -en '
    - ' -enc '
    - ' -enco'
    - ' -ec '
  filter_encoding:
    CommandLine|contains: ' -Encoding '
  filter_azure:
    ParentImage|contains:
    - 'C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\'
    - '\gc_worker.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_powershell_encode/info.yml
note: |
  ### Technical Context

  This rule detects the execution of PowerShell (both pwsh.exe and powershell.exe) with command-line arguments that include Base64 encoded strings, which are often indicative of attempts to obfuscate malicious commands. The likely attacker objective is to execute scripts or commands without revealing their content in plain text, thereby evading detection mechanisms. This behavior maps to the MITRE ATT&CK tactic of Execution, specifically the technique T1059.001 (Command and Scripting Interpreter: PowerShell).

  The primary telemetry source for this detection is Windows process creation logs, specifically monitoring command-line arguments associated with the PowerShell executables. If the malicious activity is confirmed, it could lead to unauthorized access, data exfiltration, or lateral movement within the network. However, it is important to note that this detection does NOT confirm that a malicious action was successfully executed; it merely indicates that a PowerShell instance was executed with suspicious parameters.

  ### Investigation Steps

  - **Review Process Creation Logs**: Examine Windows Security Event ID 4688 logs for PowerShell executions. Filter on CommandLine for any instances with “-e” or “-enc” to identify potentially suspicious command lines.

  - **Identify Legitimate Activity**: Compare the captured command line with known legitimate scripts or management tasks that employ Base64 encoding for PowerShell, such as those executed by system administration automation tools.

  - **Assess Parent Process**: Check the ParentImage field in Event ID 4688 logs. If the parent process is associated with legitimate system processes or tools (e.g., system maintenance tasks), rank the severity lower.

  - **Correlate with Other Alerts**: Look for related alerts such as unusual network activity or modifications to sensitive files that may indicate a broader compromise, especially those involving scripts capable of data exfiltration.

  - **Search for Encoded Payloads**: If a suspicious PowerShell execution is identified, extract Base64 encoded strings from the CommandLine field for decoding. Use a Base64 decoder to analyze the output for any confirmation of malicious payload indicators.

  - **Document Asset Criticality**: Determine the role of the affected host; a PowerShell execution on critical infrastructure (e.g., domain controllers, file servers) should be prioritized over non-critical hosts.

  ### Prioritization

  This alert is classified as medium severity due to its potential for significant impact if malicious, particularly if targeting sensitive systems. The likelihood of abuse is higher given that encoded PowerShell execution is a common technique employed by various sophisticated threat actors.

  ### Blind Spots and Assumptions

  Evasion techniques such as using different command line switches, alternative script execution methods, or executing payloads from different locations can bypass this detection. Reliable detection requires comprehensive logging of process executions, including enabling process command-line logging in the Windows security policy. Legitimate activities such as automated script execution in managed environments can also trigger this alert, underscoring the need for context-aware investigations. A companion detection to consider is monitoring for high-frequency PowerShell script executions indicative of lateral movement activity.

