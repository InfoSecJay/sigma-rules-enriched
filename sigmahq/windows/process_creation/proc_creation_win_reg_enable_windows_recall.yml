description: |
  Detects the enabling of the Windows Recall feature via registry manipulation.
  Windows Recall can be enabled by deleting the existing "DisableAIDataAnalysis" value, or setting it to 0.
  Adversaries may enable Windows Recall as part of post-exploitation discovery and collection activities.
  This rule assumes that Recall is already explicitly disabled on the host, and subsequently enabled by the adversary.
references:
- https://learn.microsoft.com/en-us/windows/client-management/manage-recall
- https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis
author: Sajid Nawaz Khan
date: 2024-06-02
tags:
- attack.collection
- attack.t1113
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_value:
        # HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis
        # HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis
    CommandLine|contains|all:
    - 'Microsoft\Windows\WindowsAI'
    - 'DisableAIDataAnalysis'
  selection_action_add:
    CommandLine|contains:
    - 'add'
    - '0'
  selection_action_delete:
    CommandLine|contains: 'delete'
  condition: selection_img and selection_value and 1 of selection_action_*
falsepositives:
- Legitimate use/activation of Windows Recall
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the enabling of the Windows Recall feature through registry manipulation via the `reg.exe` command, specifically targeting the modification of the `DisableAIDataAnalysis` registry value. The likely objective of an attacker triggering this rule is to leverage the Recall feature for enhanced data collection and analysis during post-exploitation phases. This aligns with the MITRE ATT&CK tactic of "Collection" (TA0010) and technique "Data Manipulation" (T1113).

  The primary telemetry sources for this detection are Windows process creation logs (Security Event ID 4688) and command line arguments captured by Sysmon Event ID 1. If malicious, enabling Windows Recall can facilitate the unauthorized collection and transmission of sensitive data. It is crucial to note that this detection does NOT confirm that an attack has occurred on its own; further investigation is required to assess intent and impact.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for `reg.exe` processes. Look for timeline timestamps matching the alert and analyze the `NewProcessName` and `CommandLine` fields. Legitimate commands will usually not target the `DisableAIDataAnalysis` registry key.

  - **Examine registry changes:** Utilize PowerShell or other tools to query the registry paths:
    - `HKCU\Software\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis`
    - `HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis`
    Determine if the key's value was changed to 0 or deleted recently, indicating potential manipulation.

  - **Identify command line arguments:** Analyze the `CommandLine` field in Sysmon Event ID 1 for the appearance of `add 0` or `delete` patterns in the execution of `reg.exe`. A command reflecting an addition, especially targeted at disabling AI data analysis, is a strong indicator of malicious intent.

  - **Consider host roles:** Assess whether the affected host runs critical applications or services that would warrant a thorough review of the recall feature's impact on data handling, especially in corporate environments dealing with sensitive information.

  - **Apply context of legitimate usage:** Document instances of expected use cases for Windows Recall within your organization. Correlate recent legitimate IT management activities that may have triggered this alert to potentially validate benign behavior.

  ---

  ### Prioritization

  This alert is of medium severity due to the possibility of data retrieval and analysis capabilities being exploited by an adversary. The impact is heightened if the affected system contains sensitive information or is critical to business operations. While the behavior can be weaponized, it may also occur through legitimate administrative actions.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by system configurations where registry logging is not enabled, potentially leading to unrecorded changes. Legitimate administrative actions, such as IT configuration changes or updates involving data analysis tools, could inadvertently trigger the alert. Related detections such as monitoring of `reg.exe` activity in conjunction with telemetry from Windows Event ID 4657 (Registry value modified) can provide enhanced context and support validation.

