status: test
description: |
  Detects the enabling of the Windows Recall feature via registry manipulation.
  Windows Recall can be enabled by deleting the existing "DisableAIDataAnalysis" value, or setting it to 0.
  Adversaries may enable Windows Recall as part of post-exploitation discovery and collection activities.
  This rule assumes that Recall is already explicitly disabled on the host, and subsequently enabled by the adversary.
references:
- https://learn.microsoft.com/en-us/windows/client-management/manage-recall
- https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis
author: Sajid Nawaz Khan
date: 2024-06-02
tags:
- attack.collection
- attack.t1113
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_value:
        # HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis
        # HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis
    CommandLine|contains|all:
    - 'Microsoft\Windows\WindowsAI'
    - 'DisableAIDataAnalysis'
  selection_action_add:
    CommandLine|contains:
    - 'add'
    - '0'
  selection_action_delete:
    CommandLine|contains: 'delete'
  condition: selection_img and selection_value and 1 of selection_action_*
falsepositives:
- Legitimate use/activation of Windows Recall
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the invocation of `reg.exe` to manipulate the Windows Registry, specifically targeting the 'DisableAIDataAnalysis' value. The likely objective of an attacker would be to enable the Windows Recall feature, which could facilitate post-exploitation activities by allowing the collection and analysis of machine data. This behavior aligns with the MITRE ATT&CK Technique T1113: Screen Capture, as attackers may leverage the recall functionality to gather insights into system usage and information.

  The primary telemetry source is Windows process creation logs (Event ID 4688), specifically looking for `reg.exe` invocations and relevant command-line parameters. If malicious, enabling Windows Recall could allow an adversary to collect sensitive user activity; however, this detection does NOT confirm that malicious activity is occurring on its own. It merely indicates a change in Registry settings which may also be the result of legitimate administrative actions.

  ### Investigation Steps

  - **Review command-line arguments for `reg.exe`:** Check for Event ID 4688 where `Image` ends with `\reg.exe`. Focus on `CommandLine` for the presence of `Microsoft\Windows\WindowsAI` and `DisableAIDataAnalysis`. Confirm if `add 0` or `delete` actions are present indicating modification intent.

  - **Identify previous settings of 'DisableAIDataAnalysis':** Investigate Registry changes under both `HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI` and `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsAI`. Look for prior entries to understand if it was legitimately set to disabled.

  - **Authenticate the initiating user account:** Cross-reference the Event ID 4688 logs with Event ID 4624 security logs to validate the user account that executed the command. Identify if it is an administrative account, which could support benign use.

  - **Check for correlated logs that indicate subsequent behavior:** Look for additional process creation events (Event ID 4688) for applications typically used for collection or reconnaissance after enabling the recall feature. Malicious indicators include unexpected process names or unusual command-line arguments.

  - **Validate legitimate use cases for enabling Windows Recall:** Note any concurrent administrative activities, such as configuration changes or legitimate security training. Compare timestamps to assess if the event aligns with other expected legitimate modifications.

  - **Assess system criticality and asset context:** Evaluate the importance of the system in question. If it is a sensitive or high-value asset (e.g., a domain controller or application server), prioritize the investigation higher compared to lower-risk systems.

  ### Prioritization

  This alert's severity is medium, as enabling a feature like Windows Recall on sensitive systems can facilitate adversary collection efforts. The likelihood of misuse is relatively high, considering that attackers may exploit post-exploitation phases to gather intelligence. However, legitimate administrative actions can also trigger this alert, necessitating careful review.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as adversaries using alternative scripting methods that do not invoke `reg.exe`. Reliable detection requires proper logging of process creation and registry access, which might not be enabled on all devices. Legitimate administrative actions, such as configuring AI data analysis settings, can trigger this rule. A related detection to strengthen coverage includes monitoring for suspicious remote access tools that could be invoked following changes made by `reg.exe`.

