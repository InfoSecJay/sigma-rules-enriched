description: |
  Detects the enabling of the Windows Recall feature via registry manipulation.
  Windows Recall can be enabled by deleting the existing "DisableAIDataAnalysis" value, or setting it to 0.
  Adversaries may enable Windows Recall as part of post-exploitation discovery and collection activities.
  This rule assumes that Recall is already explicitly disabled on the host, and subsequently enabled by the adversary.
references:
- https://learn.microsoft.com/en-us/windows/client-management/manage-recall
- https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis
author: Sajid Nawaz Khan
date: 2024-06-02
tags:
- attack.collection
- attack.t1113
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\reg.exe'
  - OriginalFileName: 'reg.exe'
  selection_value:
        # HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis
        # HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis
    CommandLine|contains|all:
    - 'Microsoft\Windows\WindowsAI'
    - 'DisableAIDataAnalysis'
  selection_action_add:
    CommandLine|contains:
    - 'add'
    - '0'
  selection_action_delete:
    CommandLine|contains: 'delete'
  condition: selection_img and selection_value and 1 of selection_action_*
falsepositives:
- Legitimate use/activation of Windows Recall
level: medium
note: |
  ### Technical Context
  This detection rule targets the manipulation of the Windows Recall feature through registry changes using `reg.exe`. Specifically, it identifies when an adversary attempts to enable the Recall feature by either deleting or altering the "DisableAIDataAnalysis" registry value. This activity is indicative of post-exploitation behavior, where attackers seek to leverage enabled features for data collection and analysis on compromised systems, potentially extracting sensitive information or improving their subsequent operations.

  The suspected behavior aligns with the MITRE ATT&CK tactics of **Collection** (TA0009) and specifically the technique **Data from Information Repositories** (T1113). Understanding the enabling of Windows Recall can provide insights into an attacker’s operational methods and objectives, especially in environments where this feature is expected to remain disabled for security reasons.

  Primary data sources that will provide the necessary evidence include **process creation events**, especially those that log registry modifications through `reg.exe`. Monitoring such commands is critical to identifying unauthorized changes made to system configurations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent `process creation` logs to identify instances of `reg.exe` being invoked with command lines that attempt to delete or modify the "DisableAIDataAnalysis" registry entry.

  - **Examine Registry Changes**: Check the registry paths for `DisableAIDataAnalysis` in both `HKEY_CURRENT_USER` and `HKEY_LOCAL_MACHINE` to confirm if any unauthorized changes have occurred, especially focusing on the value change to `0`.

  - **Investigate Post-Exploitation Indicators**: Look for other potential indicators of compromise on the affected host, including unusual network traffic, suspicious file access, or the presence of known malware signatures that might indicate broader exploitation attempts.

  - **Cross-Reference with Alerting Systems**: Utilize alerts from endpoint detection solutions to correlate registry changes with potential malicious activities, such as unexpected account logins or lateral movement attempts by unauthorized users.

  ### Prioritization
  The alert carries a medium severity due to the potential impact of enabling Windows Recall, which could allow adversaries to collect sensitive information. The likelihood of occurrence is elevated in environments where organization policies may not consistently monitor or restrict registry modifications.

  ### Blind Spots and Assumptions
  This detection may overlook legitimate scenarios where organizational changes or software updates necessitate enabling Windows Recall. The detection logic assumes that if the feature was previously disabled, its subsequent activation is malicious. There may be gaps in detection if logging for `reg.exe` is disabled or incomplete. Ensuring comprehensive logging for process creation is essential for this rule’s effectiveness to function properly.

