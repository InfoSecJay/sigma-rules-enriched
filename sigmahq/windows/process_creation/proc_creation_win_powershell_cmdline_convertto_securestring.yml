title: ConvertTo-SecureString Cmdlet Usage Via CommandLine
id: 74403157-20f5-415d-89a7-c505779585cf
status: test
description: Detects usage of the "ConvertTo-SecureString" cmdlet via the commandline.
  Which is fairly uncommon and could indicate potential suspicious activity
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=65
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/convertto-securestring?view=powershell-7.3#examples
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
date: 2020-10-11
modified: 2023-02-01
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains: 'ConvertTo-SecureString'
  condition: all of selection_*
falsepositives:
- Legitimate use to pass password to different powershell commands
level: medium
note: |
  ### Technical Context
  This rule detects the invocation of the `ConvertTo-SecureString` cmdlet via the command line, which is considered uncommon and could signify suspicious activity within an environment. Attackers may leverage this cmdlet to obfuscate credentials or other sensitive data during a PowerShell session, especially when preparing for credential theft or lateral movement within a network. The use of this cmdlet in unexpected contexts raises flags for potential misuse of PowerShell, an inherent capability in Windows environments that adversaries often exploit.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Defense Evasion (T1562)**: Manipulating the execution flow to bypass security measures.
  - **Execution (T1059.001)**: Executing commands through scripting languages like PowerShell.

  Primary data sources for this detection rule would include process creation logs, specifically those that log command-line arguments for PowerShell processes, which reveal how cmdlets, including potentially malicious ones, are being executed in the environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any process creation events involving `powershell.exe` or `pwsh.exe`, focusing on the command line for occurrences of `ConvertTo-SecureString`.
  - **Correlate with User Behavior**: Assess the legitimacy of the user account executing the command. Determine if the account has a history of using PowerShell for typical administrative tasks, or if it appears anomalous.
  - **Analyze Recent Actions**: Investigate other command-line arguments or scripts executed before and after the `ConvertTo-SecureString` usage to understand the context and intent behind its invocation.
  - **Check for Lateral Movement Indicators**: Look for other signs of lateral movement or credential theft, such as unusual access to sensitive files, authentication attempts, or usage of other PowerShell cmdlets related to credential management.

  ### Prioritization
  The medium severity of this alert reflects a potential insider threat or an external attacker using trusted tools inappropriately, as leveraging PowerShell in unintended ways can pose significant risks to sensitive information and overall network security.

  ### Blind Spots and Assumptions
  Detection coverage may be limited to PowerShell activities logged under standard process creation policies, potentially missing instances where command-line logging is not enabled or where obfuscation techniques are employed to disguise the command's intent. The detection logic assumes that any invocation of `ConvertTo-SecureString` is suspicious unless it can be corroborated by a legitimate use case. Without proper logging configurations, including detailed command-line argument logging, detection may be incomplete or ineffective.

