title: ConvertTo-SecureString Cmdlet Usage Via CommandLine
id: 74403157-20f5-415d-89a7-c505779585cf
status: test
description: Detects usage of the "ConvertTo-SecureString" cmdlet via the 
  commandline. Which is fairly uncommon and could indicate potential suspicious 
  activity
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=65
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/convertto-securestring?view=powershell-7.3#examples
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim 
  Shelton
date: 2020-10-11
modified: 2023-02-01
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains: 'ConvertTo-SecureString'
  condition: all of selection_*
falsepositives:
- Legitimate use to pass password to different powershell commands
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the "ConvertTo-SecureString" cmdlet via PowerShell command-line executions. The behavior is uncommon and suggests the potential for malicious activity, such as credential harvesting or manipulation by an attacker who may be trying to hide sensitive data. This action aligns with the MITRE ATT&CK techniques for T1027 (Obfuscated Files or Information) and T1059.001 (PowerShell). The primary telemetry sources are process creation logs, specifically Windows Event ID 4688 for process creation and Sysmon Event ID 1 for detailed process events. If this behavior is malicious, it may lead to unauthorized access or elevation of privileges within the environment. This detection does NOT confirm that an attack is occurring without further context or indicators of compromise.

  ### Investigation Steps

  - **Review Command-Line Arguments:** Check for instances of 'ConvertTo-SecureString' in CommandLine arguments from Windows Event ID 4688 or Sysmon Event ID 1. Look for obfuscation or unusual arguments which may indicate malicious intent.

  - **Validate Parent Process Relationships:** Analyze the parent process of the PowerShell execution (Event ID 4688, ProcessId, ParentProcessId). Legitimate users typically invoke PowerShell in clear scripts; unusual parent processes like cmd.exe may indicate suspicious behavior.

  - **Correlate with Execution Context:** Determine the user and system context under which the command was executed (e.g., UserName, UserDomain, and LogonType fields). Legitimate PowerShell usage often occurs through administrative accounts for specific tasks, so watch for unusual user accounts or times of execution.

  - **Identify Known Malicious Indicators:** Look for known patterns related to recent threat actor behaviors or indicators associated with the misuse of ConvertTo-SecureString, such as specific strings or hashes that have been flagged in past incidents.

  - **Cross-Referencing with Artifact Creation:** If applicable, investigate if any sensitive files were created or accessed following the execution of this command. Look for unusual file creation timestamps or sensitive data uploads (e.g., through Event ID 5145 for file access).

  ### Prioritization

  The alert has medium severity due to the potential impact on system integrity if the command is used maliciously to handle credentials or sensitive data. Given the likelihood of misuse, especially in environments with higher levels of attack activity, this behavior warrants immediate investigation. It is a less common PowerShell command that could indicate an escalating attack vector.

  ### Blind Spots and Assumptions

  Detection may be limited by potential legitimate usage in automated scripts, which can produce false positives. Ensure that logging for process creation is thoroughly configured to capture comprehensive details. Evasion techniques could include running commands under different user privileges or obfuscating the command syntax. A related detection for additional coverage could involve monitoring for other PowerShell command executions that manipulate secure strings or access sensitive files.

