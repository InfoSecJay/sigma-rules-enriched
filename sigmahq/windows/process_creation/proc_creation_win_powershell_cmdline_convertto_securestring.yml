title: ConvertTo-SecureString Cmdlet Usage Via CommandLine
id: 74403157-20f5-415d-89a7-c505779585cf
status: test
description: Detects usage of the "ConvertTo-SecureString" cmdlet via the 
  commandline. Which is fairly uncommon and could indicate potential suspicious 
  activity
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=65
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/convertto-securestring?view=powershell-7.3#examples
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim 
  Shelton
date: 2020-10-11
modified: 2023-02-01
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains: 'ConvertTo-SecureString'
  condition: all of selection_*
falsepositives:
- Legitimate use to pass password to different powershell commands
level: medium
note: |
  ### Technical Context

  This detection identifies the use of the `ConvertTo-SecureString` PowerShell cmdlet via the command line, which is not a common practice and may indicate potential suspicious activity. Attackers may utilize this cmdlet to manipulate sensitive information, such as passwords, in an encrypted format, thereby obfuscating their actions from standard monitoring processes. The relevant MITRE ATT&CK tactics are Defense Evasion (ID T1027) and Execution (ID T1059.001).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on PowerShell execution events. If this behavior is malicious, it could lead to the exposure of sensitive credentials or automated attacks leveraging these credentials. It’s important to note that the detection of this command does not definitively indicate malicious activity; it may reflect legitimate administrative tasks or automation workflows.

  ### Investigation Steps

  - **Review Process Creation Events:** Check Security Event ID 4688 or Sysmon Event ID 1 for PowerShell execution with the `ConvertTo-SecureString` cmdlet in the command line. Look for unusual parent processes (e.g., `cmd.exe` or scripts that are not commonly used).

  - **Assess Command Context:** Determine if the command was part of a larger routine or script by examining the full command line (e.g., Data fields in Windows logs). Entries with suspicious arguments or unrelated commands may indicate malicious behavior.

  - **Validate User Context:** Cross-reference the user account invoking the cmdlet. Legitimate usage typically comes from privileged accounts executing typical administration tasks. Unusual accounts, especially from non-IT users, increase suspicion.

  - **Investigate the Origin:** Identify the source of the PowerShell execution by reviewing Event ID 4688 for its execution path (e.g., whether it's launched from a known script directory or a user profile). Malicious activity may originate from unexpected locations.

  - **Check for Other Indicators:** Search for related suspicious activities within the same timeframe, such as changes in user permissions or new process creations that correlate with the PowerShell activity. This can be especially relevant if the cmdlet alters sensitive credentials.

  ### Prioritization

  This alert carries medium severity due to its context. The affected system may handle sensitive data, and the use of this cmdlet can facilitate credential theft or lateral movement if exploited by an attacker. While relatively uncommon in benign environments, it is an increasingly weaponized tactic in malicious campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the capability to analyze all PowerShell invocations since legitimate administrative tasks can also generate similar events, leading to potential false positives. The system must be correctly configured to capture all relevant process creation events, particularly those associated with PowerShell. Be aware that authorized IT staff may trigger this alert when using automation scripts; thus, context is critical. A companion detection to consider is monitoring for spurious PowerShell access patterns or unusual script executions that precede or follow this cmdlet usage, enhancing overall detection efficacy.

