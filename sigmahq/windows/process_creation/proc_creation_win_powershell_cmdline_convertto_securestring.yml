note: |
  ### Technical Context

  This rule detects the usage of the `ConvertTo-SecureString` cmdlet in PowerShell via the command line, which is an atypical behavior that may indicate attempts to manipulate sensitive data or obfuscate password handling. Attackers may use this technique to create secure strings from plaintext passwords, potentially leading to credential theft or unauthorized access.

  Relevant MITRE ATT&CK techniques include:
  - T1027: Obfuscated Files or Information
  - T1059.001: PowerShell

  Primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Event ID 4688. If malicious, the use of this cmdlet can facilitate further exploitation or lateral movement within the environment. However, this detection alone does not confirm that the activity is malicious; context around the execution and additional evidence is required.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Event ID 4688 for instances of `powershell.exe` or `pwsh.exe` with command line arguments containing `ConvertTo-SecureString`. Look for unexpected or unauthorized user accounts executing this command.

  - **Validate command context:** Compare the execution time, user context, and system criticality against a baseline of legitimate administrative activities and user behavior to determine if this usage aligns with expected practices.

  - **Check for sensitive data handling:** Look for related logs (e.g., Event ID 4648 for logon) that may indicate the cmdlet is being used to process sensitive information, such as passwords from configuration files or user agreements, that would justify its execution.

  - **Identify past legitimate usage:** Gather information on historical usage patterns of `ConvertTo-SecureString` within the environment. Document known benign use cases related to automated scripts or scheduled tasks that might invoke the function.

  - **Investigate for subsequent actions:** Look for any follow-up commands or further PowerShell processes initiated by the same user after the `ConvertTo-SecureString` command is executed, which may indicate scripted attacks or malicious automation. Check Event ID 4688 for subsequent command line executions.

  ### Prioritization

  This alert is considered medium severity due to the potential for sensitive data manipulation on critical systems. While this cmdlet can be used legitimately by administrators, its uncommon usage pattern could signal potential malicious activity, especially when combined with other suspicious indicators. The technique is recognized among adversaries for obfuscating credentials in exploits.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of `ConvertTo-SecureString` in normal administrative workflows, leading to potential false positives. For comprehensive coverage, ensure logging of all relevant PowerShell execution activities is enabled, including script block logging and transcription. Related detections, such as monitoring for unusual PowerShell command sequences (e.g., scripts with `Invoke-Expression`), can provide additional insight into potential misuse of PowerShell capabilities.

