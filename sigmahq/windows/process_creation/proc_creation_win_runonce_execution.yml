detection:
  selection_img:
  - Image|endswith: '\runonce.exe'
  - Description: 'Run Once Wrapper'
  selection_cli:
  - CommandLine|contains: '/AlternateShellStartup'
  - CommandLine|endswith: '/r'
  condition: all of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the execution of tasks using the `runonce.exe` executable, which is often leveraged by attackers to achieve persistence within a system. By modifying registry entries to include a command for `runonce.exe`, adversaries can ensure that malicious payloads are executed during user logon. The relevant MITRE ATT&CK technique is Persistence (T1112: Modify Existing Service), where attackers aim to re-establish access to a compromised system after reboots or user logins.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation, and Sysmon Event ID 1 for detailed process execution data. If malicious, this behavior can indicate an ongoing compromise that poses a significant risk to data integrity and system security. However, this detection does NOT confirm whether the execution was malicious or benign on its own, as legitimate system maintenance tasks may invoke similar behavior.

  ### Investigation Steps

  - **Verify process execution details:** Review Security Event ID 4688 and Sysmon Event ID 1 logs for `runonce.exe` execution. Look for unusual parent processes or command-line arguments, such as those ending with `/r` or containing `/AlternateShellStartup`.

  - **Check the execution context:** Determine which user account triggered the `runonce.exe` by correlating with User ID fields in the logs. If executed by a non-admin user without a clear business justification, this may indicate suspicious activity.

  - **Analyze command-line arguments:** Review specific command-line arguments used with `runonce.exe`. Legitimate administrative actions should not commonly include `/r` or other atypical flags.

  - **Identify related registry modifications:** Investigate the Windows registry for entries under `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce` or `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce`. Look for unfamiliar or suspicious entries that may associate with the process execution.

  - **Collect additional telemetry:** If available, check EDR or AV logs for any detections related to the executed tasks. Confirm whether the action created or modified files on the system, particularly in user profile folders (e.g., AppData), which could indicate malicious intent.

  ### Prioritization

  The alert severity is low, as the behavior may frequently relate to benign system processes or administrative maintenance tasks. However, given the potential for abuse by adversaries to establish persistence mechanisms, it warrants investigation, particularly on critical systems.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative actions that utilize `runonce.exe`, which may trigger false positives. Ensuring complete logging of registry modifications is crucial for accurate assessment. Additionally, consider companion detections, such as monitoring for scheduled task creations (MITRE ATT&CK T1053) which can also indicate persistence mechanisms.

