note: |
  ### Technical Context

  This rule detects instances where "Run Once" tasks are executed via the registry on Windows systems, specifically monitoring for the `runonce.exe` process and its command line arguments. The likely objective of an attacker leveraging this technique is to maintain persistence on a compromised system, often executing payloads during user logon without direct user interaction. This behavior correlates with the MITRE ATT&CK framework under the tactics of Persistence (TA0010) and Defense Evasion (TA0005) using the technique "Systemd Service" (T1112).

  The primary telemetry sources for this detection include Windows Security Event ID 4688 (Process Creation), which captures event logs related to process instantiation. If an alert triggers from this rule, it raises concerns about potential malicious behavior, such as the installation of malware, which would allow an adversary to regain access to the compromised system. However, this detection alone does not confirm the nature or intent of the execution; benign applications may also leverage similar methods.

  ### Investigation Steps

  - **Check Process Execution:**
    Review upcoming process creation logs for Event ID 4688. Look specifically for `runonce.exe` in the "New Process Name" field. Validate if the parent process is legitimate (e.g., `explorer.exe`), as this can indicate expected user behavior or malicious escalation.

  - **Analyze Command Line Arguments:**
    Verify the "CommandLine" field for specific command line arguments (e.g., `/AlternateShellStartup` or `/r`). Legitimate user applications might utilize similar arguments, but variations deviating from expected user patterns should heighten scrutiny.

  - **Review Scheduling Info:**
    Check for any registry keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce`. Look for entries that include unusual or unknown applications. Malicious entries might disguise themselves with generic names.

  - **Identify Malicious Indicators:**
    Confirm if the execution correlates with known malware signatures. Use threat intelligence feeds to validate any associated hashes of files executed through `runonce.exe` during the identified timeframe.

  - **Evaluate User Activity:**
    Investigate the user context under which this rule was triggered. Cross-reference with user login events (Event ID 4624) to determine if the execution followed irregular login patterns or occured under unexpected user conditions (e.g., logins at unusual hours).

  - **Confirm MITRE Coverage:**
    Enhance detection capabilities by mapping to related techniques in the MITRE ATT&CK framework, such as "Registry Run Keys / Startup Folder" (T1060), reinforcing persistent threat detection across potential attack paths.

  ### Prioritization

  The severity of this alert is low in most contexts due to the potential for benign executions of `runonce.exe`. However, if an organization has been compromised or is under targeted attack, this behavior could signify critical persistence mechanisms. Attackers typically utilize these methods to fortify their foothold within the environment, making it essential to investigate anomalous triggers despite the low rating.

  ### Blind Spots and Assumptions

  Detection may be limited by various evasion techniques, as attackers can use renamed or modified instances of `runonce.exe` to bypass detection. Reliable identification depends on comprehensive log settings for process creation and registry modifications. Legitimate software updates and user-scheduled tasks may inadvertently trigger this alert. Additionally, companion detections focusing on abnormal registry access or other scheduled tasks may augment overall detection efficiency, reducing false positive rates.

