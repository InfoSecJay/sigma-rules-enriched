level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of tasks through the Windows registry's "Run Once" functionality, specifically focusing on the use of the `runonce.exe` binary. Attackers may exploit this feature to ensure that malicious payloads execute each time the system starts or a user logs in, allowing for persistence on compromised systems. The usage of `Run Once` is often indicative of malicious behaviors like maintaining access, executing malware, or conducting lateral movements within an environment.

  ### MITRE ATT&CK Tactics and Techniques
  - **Tactics**:
    - Persistence (TA0003)
    - Defense Evasion (TA0005)
  - **Techniques**:
    - Run Arrays/Tools: Run Once (T1112)

  The primary telemetry source for this detection is the process creation event logs on Windows systems, which capture instances of executable files being run.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect Windows process creation logs for instances of `runonce.exe` being invoked. Pay particular attention to the command line arguments passed to it.
  - **Analyze Command Line Arguments**: Look for specific patterns in the command line that indicate unusual usage, such as the presence of `/AlternateShellStartup` or irrelevant arguments that may suggest evasion attempts.
  - **Correlate with System Activity**: Match the timing of the `runonce.exe` execution with other relevant system events (e.g., user logons, application installations) to determine if it aligns with legitimate activity or if it appears suspicious.
  - **Investigate Related Artifacts**: Check system logs and scripts that may modify the `Run Once` registry keys or even consider looking into Group Policies that may affect the execution context of this process.

  ### Prioritization
  The alert is categorized with low severity due to the possibility of benign uses of `Run Once` tasks, though its presence should still prompt further investigation, especially in environments where such usage is uncommon or unexpected.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate uses of `runonce.exe`, and false positives may occur from authorized scripts or applications. The detection logic assumes that the presence of certain command line arguments indicates malicious activity; however, valid administrative tasks may also use similar methods. Ensuring comprehensive logging configurations and capturing process creation events are crucial for the effectiveness of this rule.

