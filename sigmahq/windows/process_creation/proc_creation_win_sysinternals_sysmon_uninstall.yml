note: |
  ### Technical Context

  This rule detects the uninstallation of Sysinternals Sysmon, which typically indicates a potential attempt at defense evasion by an attacker. The likely objective of the attacker is to disable a crucial visibility tool that collects detailed logs of system activity, thereby hindering monitoring efforts and reducing the likelihood of detection. This behavior fits within the MITRE ATT&CK framework under the Defense Evasion tactic (T1562.001: Disable Security Tools).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on the execution of Sysmon-related binaries. If an attacker successfully uninstalls Sysmon, this could significantly impact the organization’s ability to detect malicious activity, as valuable logging and telemetry data would be removed. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrators may uninstall Sysmon for debugging or maintenance reasons.

  ### Investigation Steps

  - **Review Process Creation Events:**
    Check Windows Security Event ID 4688 for any instances where a process name ends with `Sysmon.exe`, `Sysmon64.exe`, or `Sysmon64a.exe`. Cross-reference this with the user context to distinguish between legitimate administrative actions and potential malicious activity.

  - **Examine Command Line Arguments:**
    Query for Windows Security Event ID 4688 where the CommandLine contains `-u`, indicating an uninstall operation. Pay attention to the user account executing this command to determine if it aligns with normal administrative practices.

  - **Assess User Account Activity:**
    Investigate the account associated with the uninstallation action. If the account is not recognized as an administrator or has had recent changes in privileges, this may suggest potential malicious behavior. Refer to User Account logs for role validation.

  - **Identify Uninstallation Timing:**
    Correlate the time of the uninstallation with other system activity logs (e.g., Windows Event ID 4616 - System Time Changed) to identify possible related suspicious events that may indicate a deliberate attempt to disrupt monitoring capabilities.

  - **Identify Legitimate Use Cases:**
    Verify if any known admin personnel had a scheduled maintenance window involving Sysmon uninstallation, ensuring this action falls within expected operational procedures.

  - **Check for File Creation or Deletion Events:**
    Use Sysmon Event ID 10 to identify if the Sysmon executable was deleted. Look for any indication of log purging or executable alterations around the same time to assess the breadth of potential malicious activity.

  ### Prioritization

  This alert is high severity due to its significant impact on security monitoring, especially if Sysmon is uninstalled from critical systems. The likelihood of malicious abuse is high, as attackers often disable security tools to evade detection. This behavior is commonly used in the early stages of a compromise or during post-exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that could trigger the alert, leading to potential false positives. Key log sources include Windows Security logs and Sysmon logs; ensure both are configured and retained for thorough analysis. Common evasion techniques may involve using alternate administrative accounts or automating the uninstallation to avoid detection. A related detection to reinforce coverage is monitoring for the reinstallation of Sysmon (potentially using the “Sysmon installed” detection).

