note: |
  ### Technical Context

  This Sigma rule detects the uninstallation of Sysinternals Sysmon, which is used for monitoring and logging system activity on Windows hosts. The likely attacker objective is to evade detection by security systems, as removing Sysmon could hinder the visibility of malicious activities. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (ID T1562.001) and technique "Impair Defenses" (ID T1685). The primary telemetry sources for this detection are Windows process creation logs (Event ID 4688), specifically looking for processes related to Sysmon and indications of command line arguments used for uninstallation. If malicious, the security impact is significant as it may allow adversaries to operate undetected on compromised systems. It is important to note that while this detection indicates that Sysmon has been removed, it does NOT confirm malicious intent on its own; legitimate administrative actions may also result in the uninstallation.

  ### Investigation Steps

  - **Review process execution details:** Check Security Event ID 4688 for the creation of processes named "Sysmon.exe" or "Sysmon64.exe." Look for the associated User and Process GUID fields to identify the executing user context and evaluate if it aligns with normal administrative behavior.

  - **Examine command line arguments:** Analyze the CommandLine field for any instances containing " -u." Document when Sysmon was uninstalled and determine if this usage is consistent with administrative practices.

  - **Assess recent administrative changes:** Check the System logs (Event ID 4697) for any modifications to installed services or processes, focusing on new entries around the same time as the Sysmon uninstallation.

  - **Identify typical usage:** Understand that legitimate administrators often uninstall Sysmon for updates or debugging. They typically use a GUI or tools like PowerShell for such tasks. Compare the timing and method of uninstallation against known IT maintenance schedules.

  - **Look for system integrity checks:** Confirm there are no active Sysmon processes running post-uninstallation. Use Sysmon or other monitoring tools to verify if the uninstallation aligns with expected behavior of any standard IT practices in the organization.

  - **Correlate with other alerts:** Check for concurrent alerts indicating lateral movement (e.g., SMB or RDP usage) or remote access, as these can indicate potential malicious activity related to the uninstallation of Sysmon.

  ### Prioritization

  This alert is high priority since it can indicate potential malicious activity undermining security measures on critical systems. The likelihood of exploitation is moderate, as attackers commonly seek to disable monitoring tools in a compromised environment to facilitate further actions without detection.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as process hiding or using administrative tools that do not generate standard logs. Reliable detection requires logging of process creation events, but if such logs are not retained or secured, visibility may be compromised. Legitimate scenarios include IT staff uninstalling Sysmon for troubleshooting or reconfiguration. A related detection would be monitoring for the reinstallation of Sysmon, which can indicate a restoration attempt by the security team after a removal event.

