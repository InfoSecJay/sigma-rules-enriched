note: |
  ### Technical Context

  This rule detects the uninstallation of Sysinternals Sysmon, a tool widely used for monitoring and logging system activities. The likely attacker objective is to evade detection by disabling an essential security monitoring agent, thereby facilitating further malicious actions without triggering alerts. This behavior aligns with the MITRE ATT&CK framework under Tactic: Defense Evasion, Technique: Indicator Removal on Host (T1562.001).

  The primary telemetry source for this detection is Windows process creation logs that capture the execution of process commands related to Sysmon uninstallation. If malicious, this could allow adversaries to operate without oversight, increasing the likelihood of successful exploitation. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may also lead to Sysmon being uninstalled.

  ### Investigation Steps

  - **Verify process creation logs**: Check for Windows Security Event ID 4688 or Sysmon Event ID 1 that logs the execution of `Sysmon.exe` or `Sysmon64.exe`. Look for the uninstallation command involving `-u`.

  - **Examine command line arguments**: Identify instances where the command line includes `-u` within Event ID 4688 logs. This indicates an attempt to uninstall Sysmon, which is a high-confidence indicator of potential malicious intent.

  - **Review audit logs for user accounts**: Assess who executed the command. Legitimate administrators might conduct this action; ensure the user account has administrative privileges and is expected to perform such tasks in your environment.

  - **Check for Sysmon service status**: Validate if the Sysmon service is actively running post-event by inspecting the Service Control Manager logs (Event ID 7045) to note if the service was stopped or removed recently.

  - **Monitor for recurrent patterns**: If multiple uninstallation incidents were observed within a short time span, correlate with other security logs (such as MTR triggers) to identify a pattern that suggests malicious behavior rather than legitimate administrative maintenance.

  - **Look for related security activities**: Determine if any alerts regarding other defense evasion techniques like process hollowing or service tampering were triggered around the same timeframe, indicating further depth of the attack attempt.

  ### Prioritization

  This alert should be treated with high severity due to its impact on system monitoring and incident response capabilities. The likelihood of malicious abuse is high, especially in environments where Sysmon has been deployed extensively for security. Uninstalling security tools like Sysmon is often weaponized by adversaries seeking to cover their tracks.

  ### Blind Spots and Assumptions

  This detection may miss attempts to disable Sysmon through legitimate processes, such as scheduled scripts or group policy updates. There are required configurations for continuous Sysmon logging to ensure full coverage. Additionally, legitimate administrative troubleshooting may cause false positives; therefore, a context-based review of user actions is critical. Related detections such as changes to audit policies (Windows Event ID 4902) can offer complementary insights to the uninstallation of Sysmon.

