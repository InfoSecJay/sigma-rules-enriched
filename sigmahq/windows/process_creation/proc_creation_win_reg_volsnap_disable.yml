note: |
  ### Technical Context
  This detection rule identifies commands that are used to disable Volume Shadow Copy Service (VSS) snapshots on Windows systems. Disabling VSS can be a tactic employed by adversaries to prevent backup systems from capturing malicious changes made to the file system, particularly after the deployment of ransomware or other file-altering techniques. Attackers may aim to impact business continuity by rendering previous recoverable states (i.e., snapshots) unusable.

  The relevant MITRE ATT&CK tactics and techniques for this rule include **Defense Evasion** (TA0005), particularly **Indicator Removal on Host** (T1562.001). By disabling volume snapshots, an attacker may hide their intrusion persistence or mitigate the chance of successful recovery from backups. The primary data source for this detection is process creation logs that capture command-line arguments used when processes are initiated, especially focusing on the VSS command-line utilities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for any instances of commands containing `\Services\VSS\Diag` and `/d Disabled` to confirm whether VSS has been disabled on any systems.
  - **Check System Recovery Options:** Evaluate the system's recovery settings and current volume snapshot configurations to assess the potential impact and whether legitimate administrative actions contributed to the change.
  - **Analyze User Behavior:** Investigate the origin of the commands and the associated user account to determine if the command was executed by known administrative users or accounts exhibiting suspicious behavior.
  - **Correlate with Other Alerts:** Cross-reference this finding with other security alerts or logs that may indicate unauthorized access or previous indications of compromise to build a more comprehensive picture of potential adversarial activity.

  ### Prioritization
  The alert's severity is high due to the significant impact that disabling VSS can have on the organization's data recovery capabilities. It indicates potential malicious activity aimed at evading detection or preparing for further exploitation, which warrants immediate investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage includes legitimate administrative activities, as the command to disable snapshots could be employed for routine maintenance by authorized personnel, leading to false positives. The detection logic assumes that any execution of the specified command is malicious, overlooking the context of user behavior and current operational requirements. Additionally, proper logging configuration for process creation events with command-line arguments is essential for this alert to function effectively, and any lack of such logging may hinder detection capabilities.

