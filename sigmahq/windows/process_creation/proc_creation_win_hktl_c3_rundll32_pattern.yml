  ### Investigation Steps

  - **Review command line arguments:** Check for Security Event ID 4688 or Sysmon Event ID 1 to identify processes executing `rundll32.exe`. Look for command line content resembling `rundll32.exe [path]\your.dll StartNodeRelay`. Malicious executions often have unusual paths or parameters.

  - **Validate the source of the DLL file:** Investigate the file path of the DLL associated with Rundll32 execution. Legitimate applications usually reside in system directories like `C:\Windows\System32\`. Any suspicious or unexpected locations, such as user directories or temporary folders, should be regarded as high-risk.

  - **Monitor network activity:** Use network telemetry (e.g., firewall logs, IDS/IPS events) to correlate whether the executed process initiated any unusual outbound connections (e.g., to external IPs or domains) shortly after the detections, which is a high-confidence malicious indicator.

  - **Check for parent process context:** Review the parent process of the `rundll32.exe` execution via Security Event ID 4688 or Sysmon Event ID 1. Legitimate usage tends to originate from known system processes (e.g., `explorer.exe`). An unexpected parent process may indicate an attacker launching this command to bypass defenses.

  - **Evaluate the frequency of execution:** If `rundll32.exe` with `StartNodeRelay` is observed executing many times within a short timeframe, correlate this with user behavior and application logs. This behavior could indicate automated malicious activity rather than normal use.

  - **Assess asset sensitivity:** Consider the criticality of the affected asset. If `rundll32.exe` is executing on a sensitive system (e.g., server or domain controller), prioritize investigating the alert immediately compared to non-critical endpoints.

