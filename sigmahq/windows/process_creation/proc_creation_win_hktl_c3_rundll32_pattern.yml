  ### Technical Context

  This Sigma rule detects the execution of Rundll32, specifically targeting the invocation of DLLs that contain the `StartNodeRelay` function associated with the F-Secure C3 tool. This behavior is often indicative of malicious software attempting to use legitimate Windows components for evasion and obfuscation. The likely attacker objective is to establish remote control or conduct further malicious activities while bypassing traditional security mechanisms.

  The relevant MITRE ATT&CK technique for this activity is "Malicious Use of Built-In Windows Tools" (T1218.011), highlighting the tactic of defense evasion. The primary telemetry source is process execution logs, specifically those resulting in Windows Security Event ID 4688 or Sysmon Event ID 1, detailing command line activity. If successful, this type of execution could lead to significant security impacts, such as establishing reverse shells or data exfiltration. It is crucial to note that this detection does NOT confirm that a malicious action was undertaken; false positives can occur, as legitimate software may also invoke similar commands.

