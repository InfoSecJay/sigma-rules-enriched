note: |
  ### Technical Context

  This rule detects the execution of a DLL using `rundll32.exe`, specifically targeting the `StartNodeRelay` function from F-Secure's C3 tool. The behavior suggests an attempt to relay network traffic or execute remote commands, which is often indicative of post-exploitation activities. This aligns with the MITRE ATT&CK technique T1218.011, which covers the abuse of legitimate system tools to conceal malicious activities. The primary telemetry sources needed for this detection are Windows process creation logs, specifically Event ID 4688. If malicious, this behavior can lead to unauthorized network access and potential data exfiltration. Importantly, the detection alone does not confirm malicious activity without additional context, as `rundll32.exe` can be used for legitimate processes.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for process creation entries resembling `rundll32.exe` with command line arguments containing `.dll` and `StartNodeRelay`. Compare with known good processes for context.

  - **Examine command line arguments:** Identify any additional parameters surrounding the `StartNodeRelay` function. Malicious executions will often include non-standard or unexpected arguments not typical in legitimate scenarios.

  - **Assess the file origin:** Locate the DLL file associated with the process. Check its path and creation date for legitimacy; DLLs in unusual directories (e.g., user profiles or temporary folders) are suspicious.

  - **Identify source host behavior:** Determine if the host has any legitimate use cases for tools like F-Secure C3. If the host typically does not use network relay functions, this execution may indicate compromise.

  - **Check for lateral movement indicators:** Investigate any network connections initiated by the process. Look for unusual traffic patterns or connection attempts to external addresses that may indicate data exfiltration or command-and-control communications.

  - **Cross-reference with threat intelligence:** Utilize threat intelligence sources to confirm if the detected behavior has prior associations with known adversaries or threat groups that use F-Secure C3 in their operations.

  ### Prioritization

  The alert is marked as critical due to the potential high impact of network exploitation and data exposure, especially if critical systems are involved. The behavior is of significant concern as it leverages legitimate tools in a malicious context, which is a common tactic among attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as renaming the `rundll32.exe` executable or using alternative processes for DLL loading. Ensure comprehensive logging is enabled for process creation (Event ID 4688) and that any anti-virus or endpoint detection technologies are configured properly for accurate detection. Legitimate uses of `rundll32.exe` for automation scripts may trigger similar alerts, and companion detections like monitoring unusual outbound network connections can strengthen overall coverage against these potentially malicious activities.

