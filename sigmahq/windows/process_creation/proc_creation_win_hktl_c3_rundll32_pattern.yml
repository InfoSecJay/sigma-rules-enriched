note: |
  ### Technical Context
  This detection rule identifies the use of `rundll32.exe` to execute a DLL associated with F-Secure's C3 framework. The presence of the `StartNodeRelay` function being called suggests a possible attempt by an attacker to leverage this tool for malicious purposes, such as establishing command and control (C2) channels or performing lateral movement within a network.

  Attackers utilizing the F-Secure C3 tool are primarily looking to execute stealthy commands while blending in with legitimate Windows processes. This can facilitate activities like system reconnaissance or data exfiltration. The tactic being exploited falls under **Defense Evasion** (TA0005) and the technique of **Application Layer Protocol** (T1218.011) in the MITRE ATT&CK framework.

  The relevant data sources for this detection include process creation events, specifically those capturing command-line arguments. Monitoring these logs will help identify the unusual invocation of `rundll32.exe` with specific DLL calls that are not typical in a standard operating environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the logs for entries that include `rundll32.exe` with the arguments containing `.dll` and `StartNodeRelay`. Investigate the parent process ID to determine which process initiated the command.
  - **Examine Network Activity**: Look for any outbound connections to external IPs initiated shortly after the `rundll32.exe` execution. Correlate network activity with user and system behavior to identify anomalies.
  - **Search for DLL File Path**: Locate the DLL file associated with the `StartNodeRelay` function. Analyze its origin and verify if its presence on the system is legitimate or if it shows signs of manipulation.
  - **Investigate User Context**: Identify the user account that initiated the process and determine if it has previously engaged in suspicious behavior. Validate the legitimacy of this account's activities during the time around the detection.

  ### Prioritization
  This alert is deemed critical due to the potential implications of an attacker utilizing a known hacking tool to gain unauthorized access to systems. The combination of targeted execution and command and control capabilities presents a significant threat to enterprise integrity and security.

  ### Blind Spots and Assumptions
  The detection may not cover scenarios where attackers obfuscate their use of `rundll32.exe` or utilize alternative methods for executing DLLs, such as directly invoking other legitimate binaries. There is an assumption that logs for process creation events are enabled and properly configured across the entire environment. Inadequate logging or misconfigured monitoring could lead to missed alerts and a lack of visibility into malicious activity.

