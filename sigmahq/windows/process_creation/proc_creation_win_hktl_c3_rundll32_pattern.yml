note: |
  ### Technical Context

  This rule detects the execution of the `rundll32.exe` process with command-line arguments indicative of the F-Secure C3 payload, specifically targeting the `StartNodeRelay` function. The behavior suggests an attempt to establish a covert communication channel, likely for data exfiltration or command and control (C2) purposes.

  The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011) with the technique "Application Layer Protocol" (T1218.011). The primary telemetry source is Windows process creation logs, specifically focusing on Security Event ID 4688 or Sysmon Event ID 1. If malicious, the security impact could include unauthorized remote access, data theft, or lateral movement. Importantly, this detection does NOT confirm that an actual compromise has occurred, as `rundll32.exe` can also be used for benign purposes.

  ### Investigation Steps

  - **Check Process Creation Logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the instance of `rundll32.exe` associated with the alert. Look for the command line containing `.dll` and `StartNodeRelay`. If the command line doesn’t contain both keywords, this could indicate a false positive.

  - **Examine Parent Process:** Investigate the parent process of `rundll32.exe` to determine how it was initiated. A benign parent process like `explorer.exe` might indicate legitimate use, while initiation from suspicious processes like `powershell.exe` or `cmd.exe` is more concerning.

  - **Validate DLL Presence:** Search for unusual DLLs in the system directories (C:\Windows\System32) using the created timestamp or file size of the DLL being called. The presence of any new DLLs, especially those related to C3 or with a creation time close to the alert, is a strong indicator of compromise.

  - **Monitor Network Connections:** Use network logs to correlate with the alert, checking for any connections to suspicious external IPs or domains initiated by `rundll32.exe`. Genuine internal processes usually do not initiate outbound connections unexpectedly.

  - **Investigate Asset Criticality:** Assess the role of the host on which the alert triggered. If it’s a critical system (e.g., domain controllers, servers hosting sensitive data), prioritize immediate containment actions based on the identified behavior.

  - **Identify Evasion Attempts:** Be aware of possible evasion techniques such as manipulation of the command line or targeting legitimate DLLs. Review logs for possible prior executions of `rundll32.exe` that do not match legitimate or expected command lines.

  ### Prioritization

  This alert should be treated as critical due to the potential for significant impact on sensitive systems. The likelihood of malicious abuse is high, considering the weaponization of this technique in C2 scenarios. Given the capabilities of F-Secure C3, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection is limited by the visibility of process creation logs; insufficient logging may lead to missed instances of `rundll32.exe` being invoked. Legitimate use cases, such as system updates or IT tools using `rundll32.exe`, could trigger false positives. A related detection that enhances coverage includes monitoring for other Sysinternals utilities that may invoke DLLs, such as `powershell.exe` or `wscript.exe`, which can be used for similar objectives.

