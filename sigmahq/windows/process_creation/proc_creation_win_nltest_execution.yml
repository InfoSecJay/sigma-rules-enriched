  ---

  ### Technical Context

  This Sigma rule detects the execution of `nltest.exe`, a Windows utility often used for network and domain services testing, which can be employed by attackers for information discovery. Such commands might allow an adversary to enumerate trusted domains, query domain controller details, and assess network configurations, thereby facilitating further lateral movement or privilege escalation.

  The relevant MITRE ATT&CK tactics are **Discovery** (ID: TA0007), with techniques including **Domain Trust Discovery** (T1016) and **Network Service Scanning** (T1018). The primary telemetry source for this detection is the process creation log from Windows (Security Event ID 4688 and Sysmon Event ID 1) capturing command execution data. If the `nltest.exe` execution is malicious, it could lead to unauthorized access to sensitive network information, drastically increasing an attacker's foothold within the environment. However, the detection does NOT confirm malicious intent on its own, as legitimate administrative activities could trigger this alert.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 for `nltest.exe` execution. Look for unusual execution context, such as running from atypical locations (e.g., temp directories).

  - **Identify execution parameters:** Look for command-line arguments recorded in the process creation logs. Legitimate uses typically involve parameters like `/domain` or `/scresetpwd`, while flags indicating domain enumeration may be more suspicious.

  - **Review recent account activities:** Investigate if any privileged accounts executed `nltest.exe`. Anomalous activity by non-administrative accounts (e.g., service accounts) could indicate malicious intent.

  - **Correlate with network reconnaissance:** Check for additional behavior indicative of reconnaissance, such as failed logins, unusual queries in DNS logs, or any related output from `nltest`, like domain controllers or trusts being queried.

  - **Assess the host's role and security posture:** Identify if the hosts running `nltest.exe` have higher criticality (e.g., domain controllers or administration workstations). Monitor for any unauthorized changes to trust relationships or domain configurations following execution.

  - **Analyze event logs for correlation:** Cross-reference other logs like Windows Firewall logs or Active Directory logs to see if suspicious outbound connections are initiated alongside `nltest.exe`. Look for high-confidence indicators such as unusual SIDs or changes in domain trust configurations.

  ---

  ### Prioritization

  This alert is prioritized as low severity because `nltest.exe` can be utilized for legitimate administrative tasks; however, its execution in a non-administrative context or unusual timing could signal reconnaissance activity. The likelihood of abuse is moderate, particularly in environments with weak segmentation, and network discovery techniques are commonly weaponized in lateral movement scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection could be limited by legacy systems where logs are not consistently generated or collected. Attackers might obfuscate or modify the way they run `nltest.exe` to bypass detection. Legitimate activities include routine administration tasks and troubleshooting network issues. A related detection to consider is the monitoring of unusual network requests or excessive domain queries that accompany `nltest.exe` activity, enhancing overall detection capability for reconnaissance behaviors.

