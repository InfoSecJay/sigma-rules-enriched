title: NodeJS Execution of JavaScript File
id: ba3874b9-0fae-465f-836c-eb5d071a1789
status: experimental
description: |
  Detects execution of JavaScript or JSC files using NodeJs binary node.exe, that could be potentially suspicious.
  Node.js is a popular open-source JavaScript runtime that runs code outside browsers and is widely used for both frontend and backend development.
  Adversaries have been observed abusing Node.js to disguise malware as legitimate processes, evade security defenses, and maintain persistence within target systems.
  Because Node.js is commonly used, this rule may generate false positives in some environments. However, if such activity is unusual in your environment, it is highly suspicious and warrants immediate investigation.
references:
- https://www.microsoft.com/en-us/security/blog/2025/04/15/threat-actors-misuse-node-js-to-deliver-malware-and-other-malicious-payloads/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-04-21
tags:
- attack.execution
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\node.exe'
  - OriginalFileName: 'node.exe'
  - Product: 'Node.js'
  selection_cmd:
    CommandLine|contains: '.js'
  condition: all of selection_*
falsepositives:
- Legitimate use of node.exe to execute JavaScript or JSC files on your 
  environment
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of JavaScript or JSC files by the Node.js runtime binary (node.exe), potentially indicating malicious activity. Attackers may leverage Node.js to run arbitrary code, disguising their actions as legitimate processes to evade detection and maintain persistence within the targeted environment. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1059.007 (JavaScript). The primary telemetry sources for this detection are Windows process creation events, specifically focusing on Event ID 4688, which captures process creation details.

  If the detected activity is indeed malicious, it could lead to unauthorized access, data theft, or lateral movement within the network. Importantly, this detection by itself does not confirm malicious intent, as Node.js is commonly used in various legitimate applications; thus, the context surrounding the execution must be thoroughly evaluated.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 logs, looking for instances of node.exe execution. Note the CommandLine field for any suspicious flags or file paths (e.g., C:\path\to\suspicious.js).

  - **Check for unusual execution context:** Identify the parent process of node.exe to determine if it was initiated by unexpected applications (e.g., cmd.exe, PowerShell). This can indicate script-based exploitation.

  - **Verify the legitimacy of the JavaScript file:** Inspect the file referenced in the CommandLine field by checking its hash against known-good hashes. If the hash does not match safe software releases, suspect malicious activity.

  - **Assess typical usage in your environment:** Establish a baseline of legitimate Node.js activity in your environment. For example, if node.exe is typically used for backend applications during business hours, execution outside these parameters may warrant further scrutiny.

  - **Identify additional suspicious artifacts:** Look for recent file creation or modifications associated with the scripts being executed. Check for data exfiltration indicators, such as unexpected network connections made during or after the execution of the JavaScript file.

  - **Cross-reference with other detections:** Review other security alerts related to abnormal user behavior, process spawning, or unusual network activity around the same time node.exe was executed to build a comprehensive view.

  ### Prioritization

  This alert is of low severity; however, any execution of node.exe should be prioritized if it occurs on critical systems or in unusual contexts. Malicious use of Node.js is recognized but is less common; consequently, it requires careful evaluation of both the execution environment and user behavior.

  ### Blind Spots and Assumptions

  Detection may be limited by the prevalence of legitimate Node.js applications, which could lead to false positives. Reliable detection depends on the availability of process creation logs and the proper configuration of logging for server environments. Additionally, legitimate automated scripts may trigger this alert, necessitating a robust assessment of context. Companion detections, such as those capturing PowerShell execution (T1059.001) or unusual outbound connections, can enhance coverage and provide supporting evidence for a more thorough investigation.

