title: NodeJS Execution of JavaScript File
id: ba3874b9-0fae-465f-836c-eb5d071a1789
status: experimental
description: |
  Detects execution of JavaScript or JSC files using NodeJs binary node.exe, that could be potentially suspicious.
  Node.js is a popular open-source JavaScript runtime that runs code outside browsers and is widely used for both frontend and backend development.
  Adversaries have been observed abusing Node.js to disguise malware as legitimate processes, evade security defenses, and maintain persistence within target systems.
  Because Node.js is commonly used, this rule may generate false positives in some environments. However, if such activity is unusual in your environment, it is highly suspicious and warrants immediate investigation.
references:
- https://www.microsoft.com/en-us/security/blog/2025/04/15/threat-actors-misuse-node-js-to-deliver-malware-and-other-malicious-payloads/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-04-21
tags:
- attack.execution
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\node.exe'
  - OriginalFileName: 'node.exe'
  - Product: 'Node.js'
  selection_cmd:
    CommandLine|contains: '.js'
  condition: all of selection_*
falsepositives:
- Legitimate use of node.exe to execute JavaScript or JSC files on your environment
level: low
note: |
  ### Technical Context
  This rule is designed to detect the execution of JavaScript or JSC files using the Node.js binary (`node.exe`). Node.js is a widely utilized JavaScript runtime environment that allows developers to run JavaScript on the server side. While it has legitimate uses in application development, threat actors have been known to exploit Node.js to run malicious scripts, disguise their actions as legitimate processes, and evade detection mechanisms. The goal of such malicious activities typically includes maintaining persistence on compromised systems or executing payloads that may lead to data exfiltration or further network compromise.

  Relevant MITRE ATT&CK tactics and techniques that apply include:
  - Execution (TA0002): This rule falls under the Execution tactic as it detects the execution of potentially malicious code.
  - User Execution (T1203): Although primarily related to user interactions, it can also encompass instances where malicious scripts are executed in ways that may not require user action due to automation or background processes.
  - Command-Line Interface (T1059.007): Specifically, the detection of executed files containing `.js` indicates potential misuse of Node.js for running JavaScript in a harmful context.

  Primary data sources for this detection include process creation events that log the commands and images executed on Windows systems. These logs provide insights into what processes are initiated and any parameters passed along with them.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events to identify instances of `node.exe` being executed, paying close attention to the command line arguments used to understand the context of execution.
  - **Correlate with Execution Context:** Determine the normal use case for Node.js in your environment. Look for baseline behavior to compare against unusual or unauthorized executions of JavaScript files.
  - **Check for Unusual File Locations:** Investigate the directory from which `node.exe` is executed. If it is running from a non-standard location (e.g., user temp folders), this warrants further scrutiny.
  - **Monitor Ongoing Activity:** After identifying suspicious executions, observe subsequent actions taken by the process, such as network connections and file modifications, to assess the potential impact and intention of the executed code.

  ### Prioritization
  Alerts generated by this rule should be prioritized as moderate severity, particularly in environments where legitimate use of Node.js is minimal or strictly governed. The likelihood of threat actors utilizing this methodology to execute malicious payloads necessitates prompt investigation to mitigate risks.

  ### Blind Spots and Assumptions
  This detection rule may encounter gaps in coverage, particularly in environments with high legitimate use of Node.js, leading to potential false positives. Additionally, the detection logic assumes that the command line will include `.js` file extensions; therefore, variations in scripting or naming conventions may bypass detection. Proper logging configurations for process creation and command line parameters are essential for accurate alerting; if these logs are not enabled or sufficiently detailed, the rule may not function as intended.

