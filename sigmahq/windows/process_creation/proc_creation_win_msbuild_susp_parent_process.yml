title: Suspicious Msbuild Execution By Uncommon Parent Process
id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
status: test
description: Detects suspicious execution of 'Msbuild.exe' by a uncommon parent process
references:
- https://app.any.run/tasks/abdf586e-df0c-4d39-89a7-06bf24913401/
- https://www.echotrail.io/insights/search/msbuild.exe
author: frack113
date: 2022-11-17
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\MSBuild.exe'
  - OriginalFileName: 'MSBuild.exe'
  filter_parent:
    ParentImage|endswith:
    - '\devenv.exe'
    - '\cmd.exe'
    - '\msbuild.exe'
    - '\python.exe'
    - '\explorer.exe'
    - '\nuget.exe'
  condition: selection and not filter_parent
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `Msbuild.exe` by uncommon parent processes, which may indicate suspicious or malicious activity. The use of `Msbuild.exe` is often legitimate for building applications, but when initiated by unusual parent processes, it can signal potential attempts to leverage this tool for evading defenses or executing malicious code. The primary objective of an attacker using this method may be to conduct actions such as malware distribution, persistence installation, or lateral movement within the environment.

  The applicable MITRE ATT&CK tactics include **Defense Evasion** (TA0005), as attackers may try to obfuscate their activities by executing legitimate tools in unexpected contexts. The specific techniques that map to this detection include **Masquerading** (T1036), where attackers disguise their malicious payloads as legitimate processes, and possibly **Execution through Flash Object** (T1203), should a malicious function be executed through MSBuild.

  Relevant telemetry sources that contain essential evidence for this detection include **process creation events** from the Windows operating system, which log the execution of processes along with their parent processes. This information is critical for correlating suspicious `Msbuild.exe` executions with their origins.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify instances of `Msbuild.exe` execution. Focus on correlating timestamps with any unusual parent processes listed in the alert.

  - **Analyze Parent Process Activities:** Investigate the behavior of the identified parent processes (e.g., `cmd.exe`, `devenv.exe`, etc.) to determine their legitimacy by checking for unusual command-line arguments or execution patterns that may indicate malicious intent.

  - **Correlate with User Context:** Determine the user context under which `Msbuild.exe` was executed. Check for any unauthorized account activity or unusual access rights that might indicate a compromised account is being used to run the process.

  - **Scan for Related Artifacts:** Conduct searches on the local system and network for other suspicious artifacts, such as scripts or secondary tools that may accompany the `Msbuild.exe` execution, including any command-line operations or downloads triggered by the suspect parent process.

  ### Prioritization
  The severity of this alert is medium, as it highlights potentially malicious behavior that could lead to broader security incidents. Because `Msbuild.exe` could be exploited by an attacker to carry out harmful actions while masquerading as a legitimate application, timely investigation is crucial to prevent potential data breaches or system compromises.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage regarding legitimate development activities, particularly in environments with frequent SDK or build tool usage. It assumes that unusual parent processes indicate malicious intent; however, there may be legitimate scenarios where such executions occur. Critical to the effectiveness of this alert is the availability of comprehensive process creation logs, which must be properly configured on all critical systems to ensure accurate detection and reporting.

