detection:
  selection:
  - Image|endswith: '\MSBuild.exe'
  - OriginalFileName: 'MSBuild.exe'
  filter_parent:
    ParentImage|endswith:
    - '\devenv.exe'
    - '\cmd.exe'
    - '\msbuild.exe'
    - '\python.exe'
    - '\explorer.exe'
    - '\nuget.exe'
  condition: selection and not filter_parent
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `Msbuild.exe` initiated by uncommon parent processes not typically associated with standard development workflows. Likely attacker objectives may involve building or executing malicious payloads embedded within a .NET application, leveraging the legitimate development tool to evade detection. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005), with the associated technique being T1218.011, which refers to the abuse of `Msbuild.exe`.

  The primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing the process creation events, parent-child relationships, and command-line arguments. If this behavior is indeed malicious, it could indicate a serious compromise, allowing an attacker to execute unauthorized code. Importantly, this detection alone does NOT confirm malicious intent; it may reflect legitimate use cases within software development environments.

  ### Investigation Steps

  - **Review Parent Process Details**: Check the `ParentImage` field from Security Event ID 4688 or Sysmon Event ID 1. If the parent process is among common development tools (e.g., `devenv.exe`, `cmd.exe`), the activity may be benign. If the parent process is unusual, this may warrant further investigation.

  - **Inspect Command Line Arguments**: Analyze command-line arguments associated with `Msbuild.exe`. Pay attention to suspicious flags or paths that could indicate the execution of unauthorized scripts or payloads.

  - **Identify File Creation Artifacts**: Look for new file creation events or modifications in directories commonly used for builds (e.g., temporary folders or web root directories). Monitor for any attempts to create executables or any unusual file types.

  - **Cross-Reference User Context**: Correlate the execution of `Msbuild.exe` with the user context initiating the process. Check if the user accounts involved have legitimate development roles. Unusual accounts executing these scripts may signify compromise.

  - **Evaluate Network Activity**: For endpoints showing suspicious `Msbuild.exe` execution, check for outbound network connections at the time of the alert using Firewall logs or Endpoint Detection and Response (EDR) telemetry. Unusual destinations or patterns could indicate data exfiltration or command-and-control activities.

  ### Prioritization

  The alert severity is medium due to the potential impact of executing code on systems involved in development or production. The likelihood of malicious abuse increases if `Msbuild.exe` is executed by uncommon parent processes within sensitive environments, often exploited by attackers for lateral movement or data exfiltration. This behavior is sometimes weaponized in targeted attacks but may also result from improper configuration or developer mistakes.

  ### Blind Spots and Assumptions

  Detection limitations exist if the logging level is insufficient; ensuring detailed process creation logs are enabled is crucial. Legitimate software builds by automated processes or continuous integration tools may trigger the alert, necessitating careful contextual analysis. Additionally, companion detections such as monitoring for file modifications or unusual network traffic post-execution can help strengthen incident coverage and mitigate false positives.

