title: Suspicious Msbuild Execution By Uncommon Parent Process
id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
status: test
description: Detects suspicious execution of 'Msbuild.exe' by a uncommon parent 
  process
references:
- https://app.any.run/tasks/abdf586e-df0c-4d39-89a7-06bf24913401/
- https://www.echotrail.io/insights/search/msbuild.exe
author: frack113
date: 2022-11-17
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\MSBuild.exe'
  - OriginalFileName: 'MSBuild.exe'
  filter_parent:
    ParentImage|endswith:
    - '\devenv.exe'
    - '\cmd.exe'
    - '\msbuild.exe'
    - '\python.exe'
    - '\explorer.exe'
    - '\nuget.exe'
  condition: selection and not filter_parent
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `MSBuild.exe` by uncommon parent processes, which can indicate potential misuse for executing malicious payloads. Attackers may leverage MSBuild as a means to execute scripts or binaries without raising immediate suspicion, particularly when using parent processes not commonly associated with MSBuild. The relevant MITRE ATT&CK tactics and techniques are Execution (TA0002) and Command and Scripting Interpreter (T1059).

  Primary telemetry sources include Windows process creation logs, specifically focused on Event ID 4688. The security impact could involve compromise of system integrity and potential lateral movement within the network if malicious use is confirmed. However, this detection alone does not confirm malicious intent; further investigation is required to establish the context of the parent process and its legitimacy.

  ### Investigation Steps

  - **Identify the parent process**: Check the ParentImage field in Event ID 4688 logs. Look for uncommon parent processes that initiated the `MSBuild.exe` execution, such as `powershell.exe` or `wscript.exe`. Legitimate executions often originate from `devenv.exe` or `cmd.exe`.

  - **Review command line arguments**: Inspect the CommandLine field of the same Event ID (4688). Malicious activity may involve argument patterns that include scripts or remote URLs (e.g., `http://` or `https://`). Compare against expected configurations for legitimate builds.

  - **Check process creation time**: Look at the CreationTime of the process in relation to user activity. Unusual activity times, especially during non-business hours or when user accounts are inactive, may indicate suspicious behavior.

  - **Cross-reference with security tools**: Validate against endpoint security logs such as Windows Defender ATP for alerts related to `MSBuild.exe` activity. An observed malware signature or flagged behavior tied to this activity enhances suspicion of malicious intent.

  - **Assess file creation and access**: Investigate related file system activity, specifically monitoring for the creation of new files in system directories (%Temp% or %AppData%) during the process execution, which may suggest payload obfuscation or staging.

  ### Prioritization

  The alert's severity is medium based on the potential impact caused by a compromised system executing malicious scripts. Given MSBuild's common use in development environments, unusual parent processes that invoke it heighten the likelihood of malicious intent. This behavior is a known tactic among attackers, making it necessary to review with urgency.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if security tools disable telemetry from certain processes. Legitimate build activities involving automation scripts or development tools may inadvertently trigger the alert. Related detections include monitoring for abnormal execution patterns of PowerShell scripts (T1059.001), which often coincide with misused MSBuild for malicious purposes and can provide additional context for investigation.

