note: |
  ### Technical Context

  This rule detects the execution of JavaScript code via `mshta.exe`, a Windows application that runs HTML applications (HTA files). It indicates that an attacker could be attempting to execute malicious scripts, potentially for post-exploitation activities like data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique T1218.005 (Signed Binary Proxy Execution: mshta.exe).

  Primary telemetry sources include process creation events from Windows Security Event ID 4688 and Sysmon Event ID 1, capturing command line arguments and images. If malicious, this action can provide attackers with a means to execute payloads in a stealthy manner. However, this detection does NOT confirm that the execution was malicious, as legitimate applications may also leverage `mshta.exe`.

  ### Investigation Steps

  - **Check the command line usage**: Review Security Event ID 4688 or Sysmon Event ID 1 for command lines containing 'javascript'. Look for non-standard scripts or obfuscated code which may indicate malicious activity.

  - **Review the parent process**: Identify the parent process for `mshta.exe` in the logs. Legitimate activity often has processes like Internet Explorer or Explorer.exe as the parent. An unusual parent, like a suspicious executable or script, may indicate compromise.

  - **Verify the file origins**: Investigate the file path of `mshta.exe`. Ensure it resides in its expected location (`C:\Windows\System32\mshta.exe`). A modified or uncommon path can suggest tampering.

  - **Cross-reference with known indicators**: Utilize threat intelligence to compare the JavaScript executed against known malicious hashes or signatures. Look for references to known malware like Cobalt Strike or other delivery vectors.

  - **Assess system's function**: Consider the role of the affected host. If it serves a critical function (e.g., a web server), heightened scrutiny is necessary, and containment actions may be needed for potential exploitation.

  - **Identify potential exfiltration attempts**: If logs after the incident show network activity correlating with the execution (e.g., unusual outbound traffic), it may indicate data exfiltration efforts post-execution.

  ### Prioritization

  This alert is high severity given that it involves execution of scripts, which can lead to system compromise and data breaches. The likelihood of malicious abuse is high, as this method is a known technique for executing payloads. This behavior is frequently weaponized in attack scenarios.

  ### Blind Spots and Assumptions

  This detection may miss obfuscation techniques where legitimate scripts are employed, or if another process mimics `mshta.exe`. Reliable detection requires enabled process creation logging. Legitimate use cases include system administration tasks, which may generate similar logging. Companion detections include monitoring for unusual network connections following `mshta.exe` execution to enhance incident response capabilities.

