note: |
  ### Technical Context

  This rule detects the execution of JavaScript using the `mshta.exe` command line interface on Windows systems. Attackers may use `mshta.exe` with JavaScript to execute malicious scripts, often bypassing security controls due to it being a legitimate Windows utility. This activity is typically related to the MITRE ATT&CK tactic of Execution and specifically the technique T1218.005 (Signed Binary Proxy Execution). The primary source of telemetry for this detection is process creation logs, specifically monitoring Event ID 4688 or Sysmon Event ID 1.

  If executed with malicious intent, it can lead to unauthorized actions within the environment, such as dropping malware or executing payloads. It is important to note that this detection does NOT confirm malicious activity on its own; rather, it indicates suspicious behavior that requires further investigation.

  ### Investigation Steps

  - **Check the Process Command Line:** Review the command line for `mshta.exe` in Event ID 4688 or Sysmon Event ID 1. Look for the presence of "javascript". Benign activity may include typical usage patterns like `mshta.exe vbscript:...`, while suspicious may show unusual URLs or payloads.

  - **Identify Parent Process:** Examine the parent process of `mshta.exe`. Legitimate execution is typically initiated by trusted applications or users, while malicious execution often stems from suspicious software like PowerShell or untrusted scripts.

  - **Verify the OriginalFileName:** In the same log entries, confirm `OriginalFileName` is `MSHTA.EXE`. Any deviation (e.g., modifications or renamed files) is an indicator of potential adversary activities.

  - **Inspect Recent Changes:** Investigate recent changes to the system (Event ID 5145 for File Share Access) to identify if there was unusual file creation or scripts executed right before the `mshta.exe` invocation.

  - **Review User Activity:** Query logs for user account activity around the time of the alert. Look for unusual logs in Event ID 4624 showing logons, especially from service accounts or remote users.

  ### Prioritization

  This alert is categorized as high severity. It indicates potentially malicious activity in a critical environment as `mshta.exe` can be exploited to execute arbitrary scripts. This behavior is often weaponized in social engineering attacks and malware deployment phases.

  ### Blind Spots and Assumptions

  Potential evasion techniques include renaming `mshta.exe` or using similar legitimate utilities to execute JavaScript. Reliable detection necessitates comprehensive logging configurations for process creation and command-line monitoring. Legitimate use cases could involve administrative tasks using `mshta.exe` for scripting. Monitoring for additional related behavior, such as suspicious PowerShell executions (T1059.001), can enhance detection capabilities.

