note: |
  ### Technical Context

  This rule detects execution of JavaScript code via `mshta.exe`, a system utility that can process HTA (HTML Application) files. Attackers often leverage this mechanism to execute malicious scripts for various objectives, including data exfiltration, system compromise, and establishing persistence. The relevant MITRE ATT&CK tactics and techniques are: Execution (T1203) and User Execution (T1203.005).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on process creation events for `mshta.exe`. If this behavior is malicious, it could lead to the execution of arbitrary code that compromises the system's integrity. Importantly, while this detection identifies suspicious executions of `mshta.exe`, it does NOT confirm that the behavior is malicious on its own, as there are valid uses for this application.

  ### Investigation Steps

  - **Check process creation logs for `mshta.exe`:** Review Windows Security Event ID 4688 for new process creation involving `mshta.exe`. Look for anomalous parent processes or unexpected command-line arguments.

  - **Validate command line arguments:** Examine the CommandLine field in the logs for Event ID 4688. Legitimate uses typically do not include JavaScript commands. Malicious commands often contain syntax related to remote access or data manipulation.

  - **Correlate with file drops or changes:** Review file system activity for the time frame surrounding the `mshta.exe` execution. Look for any newly created files or modifications, particularly in known directories like `%TEMP%`. This could indicate initial access or payload delivery.

  - **Assess network activity:** Investigate outbound connections made by processes spawned by `mshta.exe`. Analyze logs from firewalls or network monitoring tools for anomalous connections or data transfers (e.g., unusual IP address, high volume of outbound traffic).

  - **Evaluate involved host role:** Determine the role of the affected system. If it’s a server or critical workstation, escalate the investigation promptly, as exploitation could lead to more severe compromises.

  - **Look for indicators of compromise (IoCs):** Reference known IoCs from threat intelligence regarding `mshta.exe` misuse. Indicators such as unexpected GUIDs, command-and-control IPs, or hashes associated with malicious scripts should be precisely matched against findings.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive data and systems. The likelihood of malicious use is significant, as `mshta.exe` is often weaponized in various attacks, including phishing campaigns and malware execution. Prompt investigation is critical to prevent further exploitation.

  ### Blind Spots and Assumptions

  Detection may miss attempts to obfuscate the command line or utilize legitimate tools without JavaScript payloads. Reliable detection requires enabling process creation logging at the appropriate level to capture command lines. Legitimate administrative activities may trigger this alert when using `mshta.exe` for benign purposes. A related detection to consider is monitoring for suspicious HTA files created in user directories, which can enhance visibility into potential threats.

