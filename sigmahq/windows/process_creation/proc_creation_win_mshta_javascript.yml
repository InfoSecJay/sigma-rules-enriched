note: |
  ### Technical Context
  This detection rule identifies the execution of JavaScript code via the Mshta.exe utility on Windows systems. Attackers may leverage Mshta.exe to execute malicious scripts without triggering traditional security alerts, utilizing its capabilities to run code silently. The use of Mshta.exe for this purpose typically indicates attempts to evade detection mechanisms, as this executable is often found in enterprise environments and can be used for both legitimate and malicious actions.

  The primary threat scenario involves attackers aiming to execute payloads that could facilitate further exploitation, data exfiltration, or lateral movement within a network. By executing JavaScript through Mshta.exe, adversaries are often attempting to leverage Windows Script Host or remote script execution techniques.

  Relevant MITRE ATT&CK techniques include:
  - Execution: T1218.005 (Signed Binary Proxy Execution: Mshta.exe)
  - Defense Evasion: T1140 (Deobfuscate/Decode Files or Information)

  For this detection, the most useful data sources include process creation events, which can provide insights into the execution context of Mshta.exe, including command line arguments and the initiating user account.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for process creation involving Mshta.exe. Look for any unusual command line arguments, especially those containing 'javascript', and note the parent process that initiated the mshta.exe call.
  - **Analyze User Context:** Investigate the user account that initiated the mshta.exe execution. Check if the account has a legitimate business need for running such scripts, or if there are signs of compromise (e.g., unfamiliar login locations or times).
  - **Inspect File System Activity:** Look for any file creation or modification events in directories commonly exploited during execution (e.g., TEMP folder) around the same time as the mshta.exe activity. Identify if any suspicious JavaScript files were created or run.
  - **Cross-reference with Known Threat Indicators:** Use threat intelligence to compare recent execution patterns against known malicious activity involving JavaScript and Mshta.exe. Look for similarities with documented attacks or malware signatures.

  ### Prioritization
  This alert is classified as high severity due to the significant potential impact of JavaScript being executed via Mshta.exe, which can lead to unauthorized access, data breaches, or lateral movement within the enterprise environment. The likelihood of such an attack occurring is elevated given the common use of Mshta.exe in both legitimate and malicious activities.

  ### Blind Spots and Assumptions
  The detection logic assumes that all instances of mshta.exe execution involving JavaScript are suspicious, which may not always be the case. There could be legitimate administrative actions or automation processes that use this functionality. Additionally, the rule may not capture obfuscation techniques used by advanced threat actors, such as alternate command lines or hiding the execution context. For optimal functionality, process creation logging must be enabled and configured to capture sufficient detail, which may not be the case in all environments.

