note: |
  ### Technical Context
  This rule is designed to detect the execution of child processes spawned by the PSEXESVC service running as the LOCAL SYSTEM account on Windows machines. PsExec, a tool from Sysinternals, facilitates the remote execution of commands on systems, often employed by system administrators for legitimate purposes. However, threat actors can misuse it to execute commands with elevated privileges, thereby potentially gaining unauthorized access to critical systems.

  In a typical attack scenario, an adversary may leverage PsExec to perform lateral movement within a network, executing malicious payloads or commands that can compromise sensitive data and system integrity. Such activities suggest an objective to conduct reconnaissance, escalate privileges, or install further malware.

  The relevant MITRE ATT&CK tactics include **Execution** (T1203 - Exploitation for Client Execution) and potentially **Privilege Escalation** (T1068 - Exploitation for Elevation of Privilege). The primary data sources for this detection include process creation events, specifically logs from Windows Event ID 4688, which capture details of all processes created on the system.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for Windows Event ID 4688 to identify the creation of processes with PSEXESVC as their parent process and running as LOCAL SYSTEM.
  - **Analyze Network Traffic:** Inspect firewall and proxy logs for any unusual outbound connections initiated shortly after the execution of the child process, which may indicate command and control communications.
  - **Correlate User Activity:** Investigate user accounts involved in the execution to determine if they are legitimate administrative users or anomalous accounts that might have been compromised.
  - **Examine System Changes:** Look for related changes in system configuration, such as unexpected installations, modifications to executables, or new scheduled tasks that may imply malicious activities post-execution.

  ### Prioritization
  This alert is of high severity due to the potential impact of unauthorized elevated command execution, which can lead to significant data breaches and compromise of critical infrastructure. Given the likelihood of malicious misuse of PsExec, prompt investigation and response are crucial.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging for process creation is not enabled or configured correctly on all endpoints. The detection logic assumes that legitimate administrative use is well understood and documented; therefore, false positives might occur during legitimate IT support activities, such as debugging issues with management tools like Microsoft Intune. Effective detection relies on proper configuration of Windows auditing policies to capture the necessary process creation events consistently.

