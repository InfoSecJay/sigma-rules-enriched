note: |
  ### Technical Context

  This Sigma rule detects the execution of a child process under the PsExec service (PSEXESVC.exe) running with the LOCAL_SYSTEM account privileges, indicating that a process was initiated remotely with elevated permissions. The likely attacker objective is to execute arbitrary commands or deploy malicious code on a target system without the need for local access. This behavior maps to the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Command and Scripting Interpreter" (T1059).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation and Sysmon Event ID 1. If this behavior is malicious, it could facilitate further intrusions, lateral movement, or data exfiltration, posing significant threats to system integrity and confidentiality. It's crucial to note that this detection does not confirm malicious intent on its own; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Verify process hierarchy:** Investigate the parent process using Security Event ID 4688. PsExec should be the parent. Look for **ParentImage**: `C:\Windows\PSEXESVC.exe`. Benign usage may include IT administrative tasks, while unusual source systems should raise suspicion.

  - **Check user account:** Review the user associated with the process creation. Look for **User** containing variations of 'AUTHORI.' Legitimate activity may come from known administrator accounts or designated maintenance accounts.

  - **Examine service status:** Confirm the current status of the PSEXESVC service on the affected host. Use `Get-Service PSEXESVC` in PowerShell to assess if it was started unusually, as legitimate activity may have different invocation patterns.

  - **Investigate command-line arguments:** If available, gather command-line parameters associated with the child process using Sysmon Event ID 1. Look for unusual execution arguments that aren’t standard administrative commands, indicating potential malicious activity.

  - **Assess host role and criticality:** Consider the role of the affected host (e.g., a domain controller versus a user's workstation). Malicious activity on critical systems should be prioritized higher due to potential widespread impact and damage.

  - **Validate service account activity:** Check if the LOCAL_SYSTEM account was utilized for expected service operations or update tasks. Look at the service's historical context to differentiate expected behavior from anomalous patterns that could indicate exploitation.

  ### Prioritization

  This alert should be treated as high severity due to the potential exploitation of elevated privileges on critical systems. The ability for unauthorized users to execute commands with SYSTEM-level access significantly increases the likelihood of successful lateral movement and data compromise.

  ### Blind Spots and Assumptions

  Evasion techniques may include disabling Sysmon or halting associated logs. Accurate detection relies on having proper Sysmon configuration and Windows Event Logging enabled for critical processes. Legitimate activities may include approved troubleshooting or administrative tasks via Intune, which could generate false positives. A companion detection related to unusual network connections initiated by the local SYSTEM user could enhance coverage and provide context for the detected behavior.

