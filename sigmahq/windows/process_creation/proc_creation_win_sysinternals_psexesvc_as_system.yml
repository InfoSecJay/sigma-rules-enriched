note: |
  ### Technical Context

  This rule detects the invocation of the PSEXESVC service via PsExec, a tool often used for remote execution of commands, where the child process is run as LOCAL_SYSTEM. The likely objective is unauthorized command execution with elevated privileges, potentially indicative of lateral movement or exploitation of a compromised system. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and specifically technique T1569.002 (Remote Services: PsExec). Primary telemetry sources include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this could allow an adversary to gain full control over the affected host. Importantly, this detection does not confirm whether the process execution was harmful or authorized without further contextual analysis.

  ### Investigation Steps

  - **Check for process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for the command line and parent process. Look for the indicator "C:\Windows\PSEXESVC.exe" with a child process running as LOCAL_SYSTEM. Malicious indicators include unexpected remote execution commands, especially from unauthorized users.

  - **Validate execution context:** Inspect the "User" field in the process creation logs. An unusual or unauthorized account executing PsExec should raise suspicion. Legitimate usage often comes from known IT internal accounts or during specific maintenance protocols.

  - **Review command line arguments:** Analyze the command line of the created process. Legitimate use often includes clear maintenance or troubleshooting commands. Malicious commands may include attempts to deploy additional payloads or scripts silently.

  - **Assess asset criticality:** Identify if the affected host is part of a critical infrastructure or contains sensitive data. Higher impact systems warrant more immediate investigation.

  - **Correlate alerts with network traffic:** If possible, review additional logs for outbound connections or suspicious network activity around the time of process creation (e.g., via NetFlow or firewall logs). This can indicate data exfiltration or further exploitation attempts.

  ### Prioritization

  This alert should be treated as high severity in an enterprise context, especially on critical assets, given the potential for an adversary to execute malicious commands with elevated privileges. The use of PsExec in such circumstances is commonly associated with lateral movement and exploitation tactics.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logging or misconfigured logging levels, which could hide traces of malicious activity. Legitimate activities include administrative tasks or automated script deployments by trusted IT personnel using PsExec as part of approved operations. A related detection, such as monitoring for abnormal network connections from the affected host (e.g., through firewall logs), can help provide context to the alert and strengthen overall coverage against lateral movement.

