note: |
  ### Technical Context
  This detection rule identifies potentially suspicious execution of Regasm and Regsvcs utilities from uncommon or temporary directories on Windows systems. These utilities are legitimate components of the .NET framework used to register assemblies, but their misuse can indicate malicious behaviors such as executing unauthorized scripts or malware installation. Attackers may exploit these tools to load .NET assemblies that conduct further malicious operations, often attempting to evade detection by running from less monitored locations like temporary folders or user-specific directories.

  The relevant MITRE ATT&CK tactics highlighted by this rule include **Defense Evasion** (ID: T1218.009), as attackers may utilize Regasm and Regsvcs to obfuscate their activities while executing payloads. The detection primarily focuses on process creation events governed by the Windows operating system, where the execution of these binaries from unusual paths may not be typical of regular application behavior.

  Primary data sources for this detection include process creation logs that capture command-line execution details. This telemetry will provide essential insights into the context surrounding Regasm and Regsvcs launches, enabling security teams to identify potentially nefarious activity that deviates from established norms.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze the process creation logs for instances of Regasm.exe and Regsvcs.exe being executed, paying close attention to the command-line arguments and the directory paths from which they are launched.
  - **Correlate with User Activity:** Check user account activity to determine if the execution of these utilities aligns with legitimate user actions or if it appears anomalous based on typical user behavior patterns.
  - **Conduct Directory Review:** Inspect the directories identified in the detection logic for additional artifacts or files that appear suspicious or inconsistent with expected usage patterns.
  - **Monitor System Changes:** Investigate any associated changes to system configurations or additional process spawning that may indicate further exploitation attempts or system compromise.

  ### Prioritization
  The severity of this alert is considered medium due to the potential for both legitimate and malicious uses of Regasm and Regsvcs. However, the likelihood of an attacker leveraging these utilities from uncommon locations poses a tangible risk to enterprise environments, warranting prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the specific directories listed in the rule; attackers could execute these utilities from alternative, less common locations that aren't included in the current logic. This rule assumes that logs for process creation and command-line details are properly configured and retained. without these configurations in place, detection may fail to trigger or provide incomplete data for investigation. Additionally, variations of the utilities or benign uses could generate false positives if not properly validated.

