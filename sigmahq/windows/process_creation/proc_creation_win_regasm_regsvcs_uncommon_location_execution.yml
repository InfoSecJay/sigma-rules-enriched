note: |
  ### Technical Context

  This rule detects the execution of Regasm.exe or Regsvcs.exe from uncommon or potentially suspicious locations, suggesting atypical usage of these utilities often associated with .NET assemblies. The likely objective for an attacker is to leverage these legitimate tools for malicious purposes, such as executing untrusted code or establishing persistence. Relevant MITRE ATT&CK tactics include "Execution" (TA0002) and techniques "Signed Binary Proxy Execution" (T1218.009). The primary telemetry sources are Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1, capturing detailed information about process behaviors. If malicious, this could lead to unauthorized access or code execution within the environment. Crucially, this detection alone does not confirm malicious intent without correlating evidence of anomalous behavior or context.

  ### Investigation Steps

  - **Review process creation logs:** Look at Security Event ID 4688 or Sysmon Event ID 1 for instances of Regasm.exe or Regsvcs.exe. Check the ParentProcessName and CommandLine fields for any unusual parent processes or parameters indicating potential misuse.

  - **Verify execution paths:** Analyze the file path of the executed instances. Legitimate corporate usage typically sees these applications running from standard locations (like C:\Windows\Microsoft.NET), unlike the suspicious directories (e.g., \AppData\Local\Temp\) which are flagged.

  - **Check for lateral movement indicators:** Investigate any recent network connections or abnormal inbound/outbound traffic associated with the user or system executing the detected command. Look for unusual IP addresses or traffic volumes in network logs.

  - **Identify persistent execution vectors:** Examine the Startup folder and registry entries that might indicate malicious persistence mechanisms set up by the execution of these binaries. Look for added entries under HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run.

  - **Correlate additional malicious artifacts:** Search for potentially related events, specifically those concerning DLL hijacking or unusual modifications to .NET assemblies following the execution of Regasm/Regsvcs.

  ### Prioritization

  This alert should be treated with medium priority, especially on critical systems or servers where .NET applications are deployed. The likelihood of abuse is moderate due to the tools' legitimate use in software development; however, the execution from abnormal locations raises concern for possible exploitation by an adversary.

  ### Blind Spots and Assumptions

  Detecting Regasm or Regsvcs executions from uncommon locations may miss events in strict execution environments where application whitelisting is employed. Additionally, reliance on standard telemetry means without proper logging configurations could lead to gaps. Legitimate usage may occur during software installation or maintenance, particularly in developer environments. Complementary detection strategies, such as monitoring for abnormal command line arguments or behaviors post-exploitation, can bolster coverage against potential evasion techniques.

