note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious execution of Regasm.exe and Regsvcs.exe from uncommon directories, indicating possible misuse of these legitimate Windows utilities for malicious purposes. Adversaries may aim to exploit these tools to register .NET assemblies or execute malicious code without raising immediate attention, often as part of a post-exploitation phase. Relevant MITRE ATT&CK techniques include Defense Evasion (T1218.009) and potentially Persistence methods.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. Malicious execution of these binaries from unusual locations could facilitate attacks such as persistence or remote code execution. It is crucial to note that this detection alone does not confirm malicious intent; further investigation into the context of execution is required.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances of Regasm.exe or Regsvcs.exe running from suspicious directories (e.g., `C:\Users\<username>\AppData\Local\Temp\` or `C:\Windows\Temp\`). Focus on the `NewProcessName` field to confirm the location.

  - **Verify command line usage**: Analyze the CommandLine field in the process creation logs. Legitimate uses of Regasm and Regsvcs typically involve .NET assembly paths. Look for unusual flags or paths that may indicate misuse.

  - **Assess the execution environment**: Identify the host role or asset criticality; production servers or domain controllers executing these binaries from uncommon locations are more concerning than non-critical systems.

  - **Investigate associated artifacts**: Check for file creation activities related to the execution. Look for new DLLs or executables in `C:\Users\<username>\AppData\Local\Temp\` that correlate with the time of execution to identify potential malicious payloads.

  - **Identify known benign usage patterns**: Review past activity logs to determine if Regasm.exe and Regsvcs.exe have been executed previously in expected cases, such as during regular application deployments or updates.

  ### Prioritization

  This alert is medium severity due to its potential impact on system integrity, especially if the execution occurs on critical infrastructure. While the behavior is less common, the tools involved are often weaponized in targeted attacks. Analysts should prioritize further investigation based on the context and history of the executing systems.

  ### Blind Spots and Assumptions

  Detection is limited by the absence of comprehensive logging or misconfigured log retention. Evasion techniques may involve legitimate execution within expected directories or timing obfuscation. Legitimate activities like application deployment or administrative tasks may also trigger this alert. A companion detection to strengthen coverage includes monitoring for unusual file creations or modifications within the aforementioned uncommon directories following process execution (e.g., tracking file activities via Windows Event ID 4663).

