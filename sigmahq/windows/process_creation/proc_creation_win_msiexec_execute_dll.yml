title: Suspicious Msiexec Execute Arbitrary DLL
id: 6f4191bb-912b-48a8-9ce7-682769541e6d
status: test
description: |
  Adversaries may abuse msiexec.exe to proxy execution of malicious payloads.
  Msiexec.exe is the command-line utility for the Windows Installer and is thus commonly associated with executing installation packages (.msi)
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
- https://twitter.com/_st0pp3r_/status/1583914515996897281
author: frack113
date: 2022-01-16
modified: 2026-01-09
tags:
- attack.defense-evasion
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains|windash: ' /Y'
  filter_main_legit_path:
    CommandLine|contains:
    - '\MsiExec.exe" /Y "C:\Program Files\'
    - '\MsiExec.exe" /Y "C:\Program Files (x86)\'
    - '\MsiExec.exe" /Y "C:\Windows\System32\'
    - '\MsiExec.exe" /Y "C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msiexec.exe` with a command line that contains "/Y" and is not associated with standard installation directories. The likely attacker objective is to leverage the Windows Installer to execute a malicious payload disguised as a legitimate installation, thus facilitating the execution of unauthorized code without raising suspicion. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (ID: T1218.007).

  The primary telemetry sources are Windows process creation events and command line arguments associated with `msiexec.exe`. Security impact can include unauthorized system modifications, breaches of sensitive data, and installation of malware. Importantly, this detection does NOT confirm malicious intent by itself; legitimate scripts may also use `msiexec.exe` with similar command line patterns.

  ### Investigation Steps

  - **Review process creation events**: Investigate Security Event ID 4688 and Sysmon Event ID 1 for the execution of `msiexec.exe`. Focus on the command line arguments to identify any suspicious usage or parameters that deviate from standard installation behaviors.

  - **Analyze command line arguments**: Examine the command line for the presence of "/Y" and verify against known legitimate paths. Legitimate installations typically reference paths like `C:\Program Files\` or `C:\Windows\` without obscure parameters or references to non-standard DLLs.

  - **Identify high-confidence malicious indicators**: Specifically look for command lines that include unexpected DLLs or arguments that do not align with traditional software installation. Detections might show custom scripts or abhorrent paths, indicating potential exploitation.

  - **Cross-reference with application logs**: Validate against relevant application logs such as Windows Installer logs or relevant MSI package logs in Event Viewer to cross-check the legitimacy of the installation process occurring at the time of the alert.

  - **Perform asset criticality assessment**: Determine the role of the host where the alert was triggered. If it involves critical infrastructure, escalate the alert due to increased risk.

  ### Prioritization

  The severity of this alert is medium due to the capability of `msiexec.exe` to execute potentially harmful code, especially in a critical asset or server context. While this behavior is not uncommon, its usage for malicious intent is increasingly weaponized in various attack vectors, thus necessitating prompt analysis.

  ### Blind Spots and Assumptions

  This detection can be evaded if an adversary uses obfuscation techniques, such as altering paths or parameters that do not trigger the alert. Full coverage requires comprehensive logging from both process creation and MSI installation processes. Legitimate administrative tasks, such as software deployments or updates initiated via scripts, can inadvertently trigger this alert. A related detection rule focusing on unusual command line patterns in `powershell.exe` or `cmd.exe` could bolster coverage against similar evasion strategies.

