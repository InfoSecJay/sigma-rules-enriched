logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains|windash: ' /Y'
  filter_main_legit_path:
    CommandLine|contains:
    - '\MsiExec.exe" /Y "C:\Program Files\'
    - '\MsiExec.exe" /Y "C:\Program Files (x86)\'
    - '\MsiExec.exe" /Y "C:\Windows\System32\'
    - '\MsiExec.exe" /Y "C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate script
level: medium
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_msiexec_execute_dll/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msiexec.exe` with a command line that contains the `/Y` option, which is typically used for suppressing prompts when installing MSI packages. Attackers may exploit `msiexec.exe` to execute arbitrary malicious DLLs as part of their payload delivery method, often aiming to bypass security controls and install malware silently. This behavior aligns with the MITRE ATT&CK technique T1218.007, "Signed Binary Proxy Execution".

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing details about process execution and command line arguments. If this behavior is malicious, it can lead to unauthorized software installation and potential system compromise. However, this detection does NOT confirm that the executed payload is indeed malicious; further investigation is required to ascertain the intent.

  ### Investigation Steps

  - **Analyze the command line arguments**: Check the command line of the `msiexec.exe` execution captured in Security Event ID 4688. Look for unusual paths or arguments that are not part of standard installations. Expected behavior typically includes paths like `C:\Program Files\`, `C:\Windows\System32\`, or `C:\Windows\SysWOW64\`.

  - **Correlate with other activity logs**: Review Sysmon Event ID 6 to see if there are associated file creation or modification events that correspond to the execution time of `msiexec.exe`. Look for suspicious DLL files or modifications to known legitimate software.

  - **Identify high-confidence malicious indicators**: Compare the detected PID with active processes around the execution time in Sysmon Event ID 10 (Process ID). If the associated process has a high entropy or is located outside the expected directories for legitimate uses of `msiexec.exe`, consider it a strong indicator of malicious activity.

  - **Monitor for further system changes**: Check for network connections initiated by the process (Sysmon Event ID 3) to identify potential command and control communications. Verify if network activity corresponds with known malicious IPs or domains.

  - **Assess asset criticality**: Determine the role of the affected host (e.g., domain controller, file server) to prioritize investigation based on the criticality of the asset. Elevated privileges may increase the urgency of the alert.

  - **Review false positive triggers**: Validate whether legitimate software installation scripts were running at the time of the alert. In many deployments, installers may utilize `msiexec.exe` with the `/Y` switch for automated installations.

  ### Prioritization

  This alert should be considered medium severity in an enterprise context. The potential impact on sensitive systems can be significant, especially if the installation of malware occurs. Given that abuse of `msiexec.exe` is a known tactic among attackers, particularly in phishing or exploitation scenarios, the likelihood of malicious use is moderate, warranting timely investigation.

  ### Blind Spots and Assumptions

  This detection can be evaded if attackers use legitimate command lines that conform to expected paths or if they disguise malicious payloads as legitimate installations. Reliability hinges on proper logging configurations for both Process Creation and Process Termination events. Benign activities, such as legitimate software installations or updates triggered by system administrators, may trigger this alert. A related detection to strengthen coverage is monitoring for unauthorized administrative access or anomalous privilege escalations around the time `msiexec.exe` is executed.

