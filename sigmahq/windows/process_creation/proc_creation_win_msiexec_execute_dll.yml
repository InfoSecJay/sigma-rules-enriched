title: Suspicious Msiexec Execute Arbitrary DLL
id: 6f4191bb-912b-48a8-9ce7-682769541e6d
status: test
description: |
  Adversaries may abuse msiexec.exe to proxy execution of malicious payloads.
  Msiexec.exe is the command-line utility for the Windows Installer and is thus commonly associated with executing installation packages (.msi)
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
- https://twitter.com/_st0pp3r_/status/1583914515996897281
author: frack113
date: 2022-01-16
modified: 2024-03-13
tags:
- attack.defense-evasion
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains|windash: ' -y'
  filter_apple:
    CommandLine|contains:
    - '\MsiExec.exe" /Y "C:\Program Files\Bonjour\mdnsNSP.dll'
    - '\MsiExec.exe" /Y "C:\Program Files (x86)\Bonjour\mdnsNSP.dll'
    - '\MsiExec.exe" /Y "C:\Program Files (x86)\Apple Software Update\ScriptingObjectModel.dll'
    - '\MsiExec.exe" /Y "C:\Program Files (x86)\Apple Software Update\SoftwareUpdateAdmin.dll'
    - '\MsiExec.exe" /Y "C:\Windows\CCM\'
    - '\MsiExec.exe" /Y C:\Windows\CCM\'         # also need non-quoted execution
    - '\MsiExec.exe" -Y "C:\Program Files\Bonjour\mdnsNSP.dll'
    - '\MsiExec.exe" -Y "C:\Program Files (x86)\Bonjour\mdnsNSP.dll'
    - '\MsiExec.exe" -Y "C:\Program Files (x86)\Apple Software Update\ScriptingObjectModel.dll'
    - '\MsiExec.exe" -Y "C:\Program Files (x86)\Apple Software Update\SoftwareUpdateAdmin.dll'
    - '\MsiExec.exe" -Y "C:\Windows\CCM\'
    - '\MsiExec.exe" -Y C:\Windows\CCM\'         # also need non-quoted execution
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msiexec.exe` with specific command line arguments that indicate potential misuse to run arbitrary DLL files. The objective behind this behavior is typically to execute malicious payloads under the guise of legitimate software installation processes. This is related to the MITRE ATT&CK tactic of Defense Evasion (T1218.007). The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide critical information about executable processes and their command line parameters. If malicious, this behavior can lead to the execution of unauthorized software, potentially resulting in data breaches or system compromises. Importantly, this detection alone does not confirm that a malicious action has occurred; it only indicates potentially suspicious behavior that requires further investigation.

  ### Investigation Steps

  - **Check the command line for unusual DLL paths:** Review the command line arguments for instances of `msiexec.exe` using CommandLine logs (Event ID 4688) to identify any occurrences where the command line includes paths to unusual or unexpected DLLs such as `C:\Program Files\Bonjour\mdnsNSP.dll` or `C:\Windows\CCM\`.
  - **Identify the parent process:** Investigate the parent process of the `msiexec.exe` instance. If the parent process is suspicious (e.g., a script or another process known for misuse), raise the priority of the alert.
  - **Review execution context:** Examine the context in which the `msiexec.exe` was executed. Look for any indicators of administrative-level execution, as legitimate installations usually occur at lower privilege levels or are initiated by legitimate system tools.
  - **Assess file change indicators:** Check for recent file or registry changes associated with the DLL being executed (use log artifacts from FileSystem or Registry logs). Review paths related to system updates or known legitimate software to distinguish between benign behavior and potential compromise.
  - **Identify legitimate use cases:** Document instances where `msiexec.exe` is used within acceptable scopes for software installations, e.g., vendor-specific installations like Apple Software Update or legitimate updates for Bonjour. Compare behavior against baseline patterns for your environment.
  - **Monitor for associated artifacts:** Look for evidence of the file creation or modification associated with executed DLLs within the same time frame, to validate the execution context (e.g., check for logs indicating `.dll` file changes using Sysmon Event ID 11).

  ### Prioritization

  The severity of this alert is medium due to the potential impact on system integrity and the likelihood of abuse by malicious actors. `msiexec.exe` is frequently abused for executing malware, but its legitimate usage is common in enterprise environments, therefore requiring careful analysis of the context to avoid false positives.

  ### Blind Spots and Assumptions

  This detection may miss instances where adversaries have modified the command line syntax or employed obfuscation techniques to evade detection. Additionally, specific configurations or logging settings must be enabled to capture all necessary data; for example, Sysmon must be configured correctly for comprehensive coverage. Legitimate software deployments by IT staff using `msiexec.exe` could trigger false alerts. A related detection rule for monitoring unusual PowerShell invocation (which may call `msiexec.exe`) can provide complementary visibility into potentially harmful activities.

