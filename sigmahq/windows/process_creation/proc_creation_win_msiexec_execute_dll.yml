logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains|windash: ' /Y'
  filter_main_legit_path:
    CommandLine|contains:
    - '\MsiExec.exe" /Y "C:\Program Files\'
    - '\MsiExec.exe" /Y "C:\Program Files (x86)\'
    - '\MsiExec.exe" /Y "C:\Windows\System32\'
    - '\MsiExec.exe" /Y "C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `msiexec.exe` in a potentially malicious context, particularly when it attempts to load arbitrary DLLs using specific command-line arguments, indicative of lateral movement or payload delivery. The attacker’s objective may involve executing malicious scripts or granting persistence through the misuse of legitimate installer tools. This behavior is associated with MITRE ATT&CK tactic: **Execution** (TA0002) and technique: **Masquerading: Targeted Execution** (T1218.007).

  The primary telemetry sources consist of Windows process creation logs, specifically looking for Security Event ID 4688 or Sysmon Event ID 1. If this execution is malicious, it can lead to unauthorized access, data theft, or further compromise of the network. Importantly, this detection alone does NOT confirm malicious intent, as legitimate processes could exhibit similar behaviors under normal operations.

  ### Investigation Steps

  - **Check event logs for suspicious execution details**: Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `msiexec.exe` being executed. Pay attention to unusual command-line arguments that deviate from standard installation paths.

  - **Identify the command-line arguments used**: Analyze the CommandLine field in the logs for patterns like `msiexec.exe /Y`. If the command line shows other non-standard paths or DLLs, escalate for deeper analysis as that may indicate an attack.

  - **Correlate with installation history**: Investigate if the executed `msiexec.exe` was running in conjunction with legitimate software installations. Check for record of recent installation events (Windows Installer logs) or if it matches known software deployment processes.

  - **Look for Discordant Parent Processes**: Identify if the parent process of `msiexec.exe` is unusual, such as being launched by PowerShell or other scripts that do not typically invoke the Windows installer. This could Be indicative of a malicious attempt.

  - **Assess the target system's role and criticality**: Determine if the affected system is a sensitive asset, such as a domain controller or database server, which would elevate the importance of the investigation.

  - **Evaluate previous incidents or patterns**: Cross-reference this alert with any historical incidents involving `msiexec.exe` to identify if this behavior has been previously noted or correlated with confirmed compromises.

  ### Prioritization

  This alert should be considered medium priority in an enterprise context due to its potential impact on sensitive systems and moderate likelihood of being exploited by adversaries to execute payloads. Such behaviors are not uncommon in attack scenarios, and misuses of `msiexec.exe` are historically weaponized in various frameworks and threat actor methodologies.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like modifying command-line strings to mask intent, or the use of standard installations that may trigger this alert. Reliable detection requires comprehensive logging configurations to capture all relevant process creation events. Legitimate activities, such as automated software deployment or updates, could also trigger this alert. A related detection for improved coverage would be monitoring for **PowerShell script execution** (TA0002, T1086), as it can serve as a precursor to suspicious activity involving `msiexec.exe`.

