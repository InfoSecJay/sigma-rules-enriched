logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|base64offset|contains: '::FromBase64String'
        # UTF-16 LE
  - CommandLine|contains:
    - 'OgA6AEYAcgBvAG0AQgBhAHMAZQA2ADQAUwB0AHIAaQBuAGcA'
    - 'oAOgBGAHIAbwBtAEIAYQBzAGUANgA0AFMAdAByAGkAbgBnA'
    - '6ADoARgByAG8AbQBCAGEAcwBlADYANABTAHQAcgBpAG4AZw'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the usage of the PowerShell command `FromBase64String`, which is typically employed to decode Base64 encoded strings. This technique can be indicative of an attacker attempting to obfuscate malicious scripts or commands to evade detection, potentially leading to further exploitation of systems or lateral movement within networks. By encoding – and subsequently decoding – payloads, attackers can hide their actions from traditional security measures.

  The relevant MITRE ATT&CK techniques that this rule targets include **Execution via PowerShell (T1059.001)** and **Obfuscated Files or Information (T1140)**. In environments encouraging or allowing the use of PowerShell for system administration, these techniques may be particularly attractive to attackers seeking to evade defenses without triggering alarms. The primary telemetry for this rule comes from **process creation events** that can be monitored through various Windows event logs, which capture command-line arguments of executing processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for any commands containing `FromBase64String` and look for unusual or suspicious parent processes that may indicate exploitation.
  - **Analyze High-Risk User Activity:** Investigate any recent activities by users with elevated privileges or those that exhibit unusual behavior, especially around the execution of PowerShell commands, to identify potential abuse or compromise.
  - **Inspect Base64 Encoded Payloads:** Decode any detected Base64 strings to ascertain their content, noting any indicators of compromise or further payloads that could pose a threat to the environment.
  - **Query PowerShell Audit Logs:** Check PowerShell logs for additional context on the commands executed, including the full command history, and look for patterns or repeated use of encoded strings related to `FromBase64String`.

  ### Prioritization
  The high severity of this alert stems from the potential for significant impact, as the ability to execute obfuscated PowerShell commands can lead to full system compromise or unauthorized access to sensitive data, particularly in environments where PowerShell is extensively used.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of malicious activity, especially if attackers utilize techniques to avoid PowerShell or obfuscate their commands differently. The detection logic assumes that the presence of `FromBase64String` signifies potentially malicious intent. Additionally, it requires that process creation logging is enabled and properly configured to capture detailed command-line arguments, which may not be consistently maintained in all enterprise environments.

