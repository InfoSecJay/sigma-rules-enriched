detection:
  selection:
  - CommandLine|base64offset|contains: '::FromBase64String'
        # UTF-16 LE
  - CommandLine|contains:
    - 'OgA6AEYAcgBvAG0AQgBhAHMAZQA2ADQAUwB0AHIAaQBuAGcA'
    - 'oAOgBGAHIAbwBtAEIAYQBzAGUANgA0AFMAdAByAGkAbgBnA'
    - '6ADoARgByAG8AbQBCAGEAcwBlADYANABTAHQAcgBpAG4AZw'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the usage of the PowerShell cmdlet `FromBase64String` with base64-encoded strings in the command line of a process. This behavior is often employed by adversaries for executing obfuscated payloads, as it allows them to hide malicious scripts or executables from direct visibility. The probable attacker objective is the execution of payloads that could lead to compromise, lateral movement, or data exfiltration.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the **Execution** technique **PowerShell** (T1059.001), which highlights the use of PowerShell for running malicious commands. The primary telemetry source for detection is Windows Process Creation logs, specifically looking for Event ID 4688. If malicious, this behavior could significantly impact security, as it may indicate an active attack or compromise. However, this detection does NOT confirm that an attack is definitely occurring; legitimate administrative tasks may also invoke similar commands.

  ### Investigation Steps

  - **Review the command line arguments:** Check Process Creation logs (Event ID 4688) for command lines that include `FromBase64String`. Look for unusual or unexpected command line arguments that may indicate malicious intent.

  - **Identify suspicious base64 patterns:** Decode any base64 strings found in the command line. Use online tools or scripts to determine if the decoded output is executable code or a PowerShell script that might be malicious.

  - **Correlate with user behavior:** Examine other logs (such as Windows Event Log or Sysmon event logs) to identify whether the user executing the command has a history of suspicious activity. Legitimate administrative usage often happens during specific maintenance windows or under certain accounts.

  - **Check associated parent processes:** Determine the parent process of the detected command line via Event ID 4688. Valid sources may include system maintenance scripts or known management tools, while unusual parents may indicate lateral movement attempts.

  - **Validate execution context:** Check for the user context under which the command was executed. Administrators executing similar commands during legitimate activities can be benign, while unexpected users executing these commands during non-business hours may be malicious indicators.

  ### Prioritization

  This alert is of high severity, primarily due to its association with potential malicious activity utilizing PowerShell, which is a common tool for adversaries. The likelihood of malicious use is high since obfuscation techniques like these are frequently weaponized for delivery and execution of payloads in corporate environments.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where PowerShell logging is not enabled or where command line arguments are not fully captured. Legitimate administrative tasks may occasionally trigger this alert, such as scripted deployments or legitimate obfuscation methods. An additional detection that strengthens coverage is monitoring for raw base64 command executions along with the identification of unusual outbound network connections that may follow this activity.

