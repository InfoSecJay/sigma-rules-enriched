detection:
  selection:
  - CommandLine|base64offset|contains: '::FromBase64String'
        # UTF-16 LE
  - CommandLine|contains:
    - 'OgA6AEYAcgBvAG0AQgBhAHMAZQA2ADQAUwB0AHIAaQBuAGcA'
    - 'oAOgBGAHIAbwBtAEIAYQBzAGUANgA0AFMAdAByAGkAbgBnA'
    - '6ADoARgByAG8AbQBCAGEAcwBlADYANABTAHQAcgBpAG4AZw'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell cmdlet `FromBase64String`, which is often used by attackers to decode and execute malicious scripts. The primary objective of such behavior is to obfuscate the delivery and execution of malware, command and control (C2) communications, or other malicious payloads. This activity fits within the MITRE ATT&CK framework under the tactic of Execution (T1203) and the technique of Command-Line Interface (T1059.001).

  Primary telemetry sources for this detection are Windows Process Creation logs, specifically focusing on Event ID 4688, which captures details of process creation, including the command line arguments used. If indeed malicious, this behavior can lead to possible code execution on the compromised machine, enabling further exploitation or lateral movement within the network. It is crucial to note that this detection does NOT confirm that the command line execution was malicious; it merely indicates the use of a potentially suspicious cmdlet.

  ### Investigation Steps

  - **Check for relevant process details:** Review Event ID 4688 logs for the specific process creating the command line with `FromBase64String`. Look for the user context and process hierarchy for suspicious users or processes (e.g., system processes or administrative accounts).

  - **Identify known good command patterns:**  Examine the command lines for `FromBase64String` usage that includes common benign activities, such as legitimate administrative PowerShell scripts or configurations, to discern expected vs. unusual behavior.

  - **Look for decoded payloads:** If the command includes `FromBase64String`, decode the base64 string to analyze the resulting PowerShell commands. Investigate any decoded content for malicious functions like downloading, executing files, or connecting to external IPs.

  - **Correlate network activity:** Check for outbound connections in Proxy or Firewall logs (e.g., Windows Firewall Event ID 5156) following the process execution. Look for unusual external domains or IP addresses contacted shortly after the execution, indicating potential C2 activity.

  - **Review for evasion indicators:** Since legitimate administrative tasks may utilize similar cmdlets, focus on command lines with suspicious patterns, repetitive executions, or timing anomalies (e.g., executing outside business hours).

  ### Prioritization

  This alert warrants high priority due to the potential impact of unauthorized process execution on critical systems, especially if it leads to system compromise or data exfiltration. The behavior detected is frequently weaponized by threat actors in phishing and covert attack scenarios, thus requiring timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative tasks triggering this alert if they use the same cmdlet. Reliable detection requires comprehensive monitoring configurations, including Process Creation logs and potentially PowerShell logging (Event IDs 4104, 4103). Legitimate activities such as automated backup scripts or software deployment processes may also invoke the usage of the cmdlet. A companion detection that strengthens coverage could involve monitoring for other PowerShell obfuscation techniques or monitoring the execution of scripts encoded with `base64`.

