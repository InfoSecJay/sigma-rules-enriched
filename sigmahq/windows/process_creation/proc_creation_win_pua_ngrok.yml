author: Florian Roth (Nextron Systems)
date: 2021-05-14
modified: 2023-02-21
tags:
- attack.command-and-control
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains:
    - ' tcp 139'
    - ' tcp 445'
    - ' tcp 3389'
    - ' tcp 5985'
    - ' tcp 5986'
  selection2:
    CommandLine|contains|all:
    - ' start '
    - '--all'
    - '--config'
    - '.yml'
  selection3:
    Image|endswith: 'ngrok.exe'
    CommandLine|contains:
    - ' tcp '
    - ' http '
    - ' authtoken '
  selection4:
    CommandLine|contains:
    - '.exe authtoken '
    - '.exe start --all'
  condition: 1 of selection*
falsepositives:
- Another tool that uses the command line switches of Ngrok
- Ngrok http 3978 
  (https://learn.microsoft.com/en-us/azure/bot-service/bot-service-debug-channel-ngrok?view=azure-bot-service-4.0)
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Ngrok, a tool often used by threat actors to expose internal services to the internet, thus facilitating command-and-control (C2) communications and creating backdoors. The likely adversarial objective includes bypassing network defenses to establish remote access to targeted systems or assist in data exfiltration. This behavior maps to the MITRE ATT&CK technique T1572 - "Application Layer Protocol" within the C2 tactic.

  The primary telemetry source for this behavior includes Windows process creation logs, specifically monitoring for executable files launched with specific command-line arguments. Security implications could be significant, as it allows attackers to access sensitive internal services. However, this detection does NOT confirm malicious intent on its own; it requires further context to ascertain legitimacy.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 for creation of the `ngrok.exe` process. Confirm if the command line includes `tcp` connections on commonly abused ports (e.g., 3389 for RDP, 445 for SMB).

  - **Analyze command line arguments:** Investigate command-line parameters for indications of remote access. Look for terms such as `authtoken` or `start --all` which are typical for malicious use. Event ID 4688 will detail these.

  - **Identify legitimate use cases:** Consider examining the asset's role and legitimate applications. For instance, Ngrok may be legitimately used for development purposes (e.g., `ngrok http 3978`) in Azure Bot Services.

  - **Look for network traffic associated with Ngrok:** Check network logs (e.g., firewall or IDS logs) for connections to `*.ngrok.io` domains. Evaluate the frequency and source IP to establish if there are unexpected outbound connections associated with this tool.

  - **Validate external access attempts:** Investigate any reported incidents of unauthorized access related to the asset involved. Cross-reference with user activity logs to determine if there were any abnormal access patterns or user credentials compromised.

  ### Prioritization

  This alert carries high severity as it indicates potential risky behavior on critical enterprise assets. Given that Ngrok is commonly abused by attackers to exfiltrate data and create unauthorized access points, quick validation is necessary to protect assets from compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of Ngrok by developers or tools that utilize similar command-line arguments, potentially resulting in false positives. Proper log configurations are necessary to ensure comprehensive monitoring; ensuring process creation logs and network traffic logs are adequately collected and analyzed is essential for reliable detection. Related detections, such as those identifying abnormal outbound traffic behavior or unusual port activity (e.g., T1043 – Port Knocking), can enhance coverage against these tactics.

