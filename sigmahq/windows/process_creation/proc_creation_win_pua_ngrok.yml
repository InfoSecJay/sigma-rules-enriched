title: PUA - Ngrok Execution
id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
status: test
description: |
  Detects the use of Ngrok, a utility used for port forwarding and tunneling, often used by threat actors to make local protected services publicly available.
  Involved domains are bin.equinox.io for download and *.ngrok.io for connections.
references:
- https://ngrok.com/docs
- https://www.fireeye.com/blog/threat-research/2021/05/shining-a-light-on-darkside-ransomware-operations.html
- https://stackoverflow.com/questions/42442320/ssh-tunnel-to-ngrok-and-initiate-rdp
- https://www.virustotal.com/gui/file/58d21840d915aaf4040ceb89522396124c82f325282f805d1085527e1e2ccfa1/detection
- https://cybleinc.com/2021/02/15/ngrok-platform-abused-by-hackers-to-deliver-a-new-wave-of-phishing-attacks/
- https://twitter.com/xorJosh/status/1598646907802451969
- https://www.softwaretestinghelp.com/how-to-use-ngrok/
author: Florian Roth (Nextron Systems)
date: 2021-05-14
modified: 2023-02-21
tags:
- attack.command-and-control
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains:
    - ' tcp 139'
    - ' tcp 445'
    - ' tcp 3389'
    - ' tcp 5985'
    - ' tcp 5986'
  selection2:
    CommandLine|contains|all:
    - ' start '
    - '--all'
    - '--config'
    - '.yml'
  selection3:
    Image|endswith: 'ngrok.exe'
    CommandLine|contains:
    - ' tcp '
    - ' http '
    - ' authtoken '
  selection4:
    CommandLine|contains:
    - '.exe authtoken '
    - '.exe start --all'
  condition: 1 of selection*
falsepositives:
- Another tool that uses the command line switches of Ngrok
- Ngrok http 3978 
  (https://learn.microsoft.com/en-us/azure/bot-service/bot-service-debug-channel-ngrok?view=azure-bot-service-4.0)
level: high
note: |
  ### Technical Context
  This rule detects the execution of Ngrok, a tool commonly used for creating secure tunnels to localhost, which can inadvertently expose local applications to the internet. While Ngrok can be employed for legitimate development and debugging purposes, it is often abused by threat actors to bypass network defenses and establish command-and-control (C2) channels. By exploiting Ngrok’s services, attackers can make internal services accessible externally, which can facilitate data exfiltration, malicious activity, or further exploitation of the network.

  The primary objectives of attackers utilizing Ngrok typically include maintaining persistence, bypassing firewalls, and enabling remote access to compromised systems. Such behavior aligns with the MITRE ATT&CK framework under the "Command and Control" tactic (TA0011), specifically the "Application Layer Protocol" technique (T1572), indicating that attackers are trying to implement covert communication channels.

  The most relevant telemetry sources for detecting Ngrok execution include process creation logs that can capture command-line arguments, which reveal when and how Ngrok is being executed on the system. Monitoring network connections to Ngrok domains or IPs can also provide context for determining whether an unexpected service has been exposed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of `ngrok.exe` along with any suspicious command-line arguments, specifically looking for patterns indicative of port forwarding to common services (e.g., RDP, SMB).

  - **Correlate Network Connections**: Check network connection logs for outgoing traffic to Ngrok domains (e.g., `*.ngrok.io`), which can help identify unauthorized traffic that may indicate an active Ngrok session.

  - **Validate Legitimate Usage**: Investigate the workflow around the detected Ngrok executions to determine if there are any legitimate business-related applications requiring Ngrok. Cross-reference users and systems involved to understand the context of usage.

  - **Identify Recent Changes**: Examine any recent changes to system configurations or application deployments that could correlate with the Ngrok activity. Additionally, consider if any new applications or services have been introduced that would utilize tunneling technology.

  ### Prioritization
  This alert should be prioritized as high in an enterprise environment because Ngrok’s ability to bypass security measures and expose protected services can lead to significant security incidents, including data breaches or further network compromise.

  ### Blind Spots and Assumptions
  The primary blind spot within this detection rule is the possibility that legitimate applications or services may also use Ngrok or similar tunneling tools, which can generate false positives. The detection logic assumes that administrative oversight or user training is about recognizing the appropriate use cases for Ngrok, which may not always be firmly established. Additionally, the detection relies on complete process creation logs and may fail if these logs are not configured correctly or if logging is incomplete or disabled. Comprehensive logging capabilities must be enabled to effectively utilize this detection rule.

