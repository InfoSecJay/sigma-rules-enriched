detection:
  selection:
    Image|endswith: '\rar.exe'
    CommandLine|contains: ' a '
  condition: selection
falsepositives:
- Highly likely if rar is a default archiver in the monitored environment.
level: low
note: |
  ### Technical Context

  This rule detects the execution of `rar.exe` for the purpose of adding files to an archive, indicating possible data compression before exfiltration. Attackers may use this method to consolidate sensitive data, such as documents or credentials, to minimize data transfer size and improve stealth during exfiltration efforts. This behavior aligns with the MITRE ATT&CK technique "Archive Collected Data" (T1560.001).

  The primary telemetry source for this detection is process creation logs, specifically the Windows Security Event ID 4688 and Sysmon Event ID 1, which track the execution of processes and their command-line arguments. If malicious, the impact may involve unauthorized data exfiltration of sensitive information. However, this detection does NOT confirm that data exfiltration has occurred, as legitimate use of `rar.exe` for archiving purposes can trigger this alert.

  ### Investigation Steps

  - **Check command-line arguments:** Review the command line associated with the process creation (Event ID 4688 or Sysmon ID 1). Look for ' a ' indicating files are being added to an archive. Legitimate uses may involve backup or archiving by authorized users with standard data paths.

  - **Analyze the file paths:** Examine the paths of files being archived, focusing on sensitive directories (e.g., user document folders, network shares). Malicious indicators include archiving of files from unusual or sensitive locations without a clear business justification.

  - **Identify user context:** Determine which user executed `rar.exe` and if they have a justified need for compression tasks. User accounts that lack a business need for data compression in sensitive areas may trigger further suspicion.

  - **Correlate with network activity:** Investigate network traffic to see if any compressed archives were transferred outside the organization immediately after being created. Relevant logs could be firewall logs indicating outbound traffic patterns that follow shortly after the process' execution.

  - **Check for recent downloads:** Look for any recent file download activities (Event ID 4656) that occur prior to the rar.exe execution to establish if files being archived were potentially exfiltrated after being downloaded.

  ### Prioritization

  This alert is considered low to moderate in severity, depending on the context of the affected system. While `rar.exe` is commonly used in benign scenarios, its potential for data compression before exfiltration increases the risk of abuse. Monitoring should be heightened in sensitive environments where data exfiltration poses significant business risk.

  ### Blind Spots and Assumptions

  Detection may be limited by reliance on process creation logs alone, as attackers could use other compression tools or rename `rar.exe` to evade detection. Ensure that logs include detailed process arguments and that sysmon is configured to capture all relevant events. Legitimate archiving by users, especially in environments where `rar.exe` is standard, could lead to false positives. Companion detections may include monitoring for file transfers after compression (T1041 - Exfiltration Over Command and Control Channel) to strengthen overall coverage against data exfiltration attempts.

