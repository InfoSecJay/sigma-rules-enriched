detection:
  selection:
    Image|endswith: '\rar.exe'
    CommandLine|contains: ' a '
  condition: selection
falsepositives:
- Highly likely if rar is a default archiver in the monitored environment.
level: low
note: |
  ### Technical Context
  This detection rule targets the usage of **rar.exe** for adding files to an archive, which is a common method used by attackers to compress sensitive data before exfiltration. By compressing data, adversaries can reduce bandwidth during data transfer and potentially evade detection mechanisms that monitor outbound traffic for large file transfers. Essentially, this activity may indicate preparatory steps taken by an attacker to exfiltrate data undetected.

  The suspected threat scenario involves an adversary utilizing **RAR compression** to package data they have compromised, such as sensitive documents, proprietary information, or login credentials, prior to exfiltration. The typical objective of an attacker in this context is to steal sensitive information while minimizing the footprint of their actions and potentially bypassing security measures in place.

  This detection aligns with the **MITRE ATT&CK framework**, specifically the **Collection** tactic (ID: T1560, with sub-technique T1560.001 for Archival Data). Primary data sources for detecting this behavior include **process creation events**, where the execution of rar.exe can be traced, alongside monitoring of relevant command-line arguments that indicate archiving actions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances where `rar.exe` was executed. Pay special attention to the command-line arguments used, particularly those containing `a`, which indicates file addition to an archive.

  - **Analyze Suspicious File Activity**: Investigate any unusual file compression activities around sensitive directories or unusual hours that may suggest adversarial behavior. Check for patterns of file access leading to archiving events.

  - **Correlate with Network Traffic**: If potential exfiltration is suspected, correlate the process creation events with outbound network traffic. Look for compressed files being uploaded or sent to external IPs, which may not typically be used for legitimate business purposes.

  - **Assess User Roles and Privileges**: Verify the user accounts responsible for initiating the rar.exe processes. Investigate whether the account has the necessary permissions to access sensitive data and if the actions align with their typical behavior or role within the organization.

  ### Prioritization
  The severity of this alert is categorized as **low** due to the potential for benign use of rar.exe within environments where it is a standard tool for archiving. However, its presence in non-standard contexts or accompanied by other suspicious indicators warrants further investigation, as it could indicate malicious activity.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where rar.exe is a commonly used tool, leading to a high likelihood of false positives. The detection logic assumes that rar.exe will be invoked in a context not typical for regular user activity. Additionally, this rule requires comprehensive process creation logging to function effectively, which must be enabled across all relevant systems in the monitored environment to capture the necessary data.

