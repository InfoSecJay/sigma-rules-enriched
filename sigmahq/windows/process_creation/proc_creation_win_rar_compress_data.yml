  ---

  ### Technical Context

  This rule detects the invocation of `rar.exe` to add files to an archive, indicating potential data compression by an adversary. The likely objective is to prepare sensitive documents for exfiltration by making them portable and reducing the network load. This behavior maps to the MITRE ATT&CK technique **Data Compressed** (T1560.001).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 related to the execution of `rar.exe`. If the activity is malicious, it may lead to unauthorized data exfiltration or information theft. Importantly, this detection does NOT necessarily confirm malicious intent on its own, as legitimate use of `rar.exe` can occur for non-malicious archiving purposes.

  ---

  ### Investigation Steps

  - **Check event details:**
    Review Security Event ID 4688 for instances of `rar.exe`. Look for the CommandLine parameter containing ' a ' which indicates files are being added. Assess the user context; if the command is run by a non-administrative user on a critical system, that raises suspicion.

  - **Examine the command line arguments:**
    Inspect the specific file paths added to the archive in the CommandLine logs. Malicious activity may involve adding sensitive files like `*.docx`, `*.xlsx`, or `*.pdf` from user directories or sensitive folders. Legitimate activity might involve archiving system logs or application backups, which generally do not contain sensitive user data.

  - **Identify archive creation details:**
    Investigate the time and user associated with the archive creation. Contextual user behavior is key — if `rar.exe` is invoked at unusual hours or by users who typically do not use this tool, it is a red flag.

  - **Audit for subsequent network activity:**
    Review for any immediate `network outbound` events to correlate with compressed files being sent. Look for specific Event IDs related to outbound traffic that follow the time of `rar.exe` execution; clear indicators include `Sysmon Event ID 3` for network connections from the host.

  - **Validate file system changes:**
    Check for the presence of newly created archive files (`*.rar`). Validate the size and contents of the archive against expected norms. Unauthorized large or unusual file sizes can be indicative of malicious archiving prior to exfiltration.

  ---

  ### Prioritization

  This alert has low severity primarily because it may result from legitimate uses of `rar.exe`, particularly in environments where it is routinely utilized for archiving. However, it requires further investigation due to the potential for malicious abuse, especially when sensitive or confidential data is involved that could illustrate a prelude to exfiltration.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited in environments utilizing `rar.exe` as a legitimate archiving tool, leading to false positives. Effective monitoring requires adequate logging levels for process creation events. Furthermore, legitimate users may occasionally archive sensitive files for administrative tasks, which can inadvertently trigger this alert. A companion detection such as monitoring for outbound data transfers post-archiving can provide additional context to strengthen coverage against potential data breaches.

