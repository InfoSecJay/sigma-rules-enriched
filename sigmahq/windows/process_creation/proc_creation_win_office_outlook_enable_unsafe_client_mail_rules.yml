note: |
  ### Technical Context

  This rule detects attempts to enable the Outlook setting “EnableUnsafeClientMailRules,” which permits the execution of macros and running applications from email rules. Attackers may exploit this setting to execute malicious operations, such as delivering malware or maintaining persistence through automated tasks. This behavior aligns with the MITRE ATT&CK tactic of Execution, specifically technique T1059 (Command and Script Execution) and T1202 (Exploitation for Client Execution).

  The primary telemetry source is Windows process creation logs, specifically focusing on CommandLine arguments. If an attacker successfully enables this setting, it may result in malicious macros executing when users follow rules tied to incoming emails, leading to system compromise. Importantly, this detection alone does not confirm malicious intent, as legitimate users may trigger this setting for acceptable use-cases.

  ### Investigation Steps

  - **Verify CommandLine Argument:** Examine the process creation logs (Windows Event ID 4688) for entries where CommandLine contains 'Outlook\Security\EnableUnsafeClientMailRules'. Look for entries from unusual user accounts or from non-standard systems to assess risk.

  - **Identify User Activity:** Review related user activity in the last 24 hours by checking recent logons or process executions (Event IDs 4624, 4688) by the relevant user account. Determine if the user typically modifies Outlook settings legitimately.

  - **Inspect Process Parentage:** Analyze the parent process of the detected command (hint: could be associated to Outlook or a shell process). If the parent process is uncommon (e.g., a command prompt or unusual application), consider it a higher confidence indicator of malicious activity.

  - **Review Existing Outlook Rules:** Check the Outlook rules on impacted systems to identify existing unsafe rules (via Outlook application or Exchange logs) that could utilize the enabled setting for unauthorized actions.

  - **Confirm Threat Intelligence:** Research recent threat intelligence reports or alerts related to this specific behavior to gauge if it correlates with known adversary techniques or campaigns, enhancing awareness of ongoing threats.

  ### Prioritization

  This alert is of high severity due to its potential to lead to severe impacts on the organization's security posture, enabling actions like malware execution or data exfiltration. The likelihood of abuse is high, as this technique is commonly leveraged by attackers for automation of malicious tasks, particularly in targeted phishing attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by user behavior; legitimate users might enable this setting for valid reasons. Ensure Windows process creation logs are appropriately configured and monitored, as missing these could cause delays in detection. Expect that legitimate corporate activities, such as automated email handling, could trigger similar alerts. A related detection to reinforce coverage might involve monitoring changes to Outlook rules more broadly (related detection ID: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08).

