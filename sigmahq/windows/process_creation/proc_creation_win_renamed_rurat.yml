note: |
  ### Technical Context
  This detection rule identifies instances where the Remote Utilities Remote Access Trojan (RURAT) is executed when the product name indicates a renamed version of the legitimate software. Attackers often rename software to evade detection; therefore, this rule targets potential misuse of RURAT. As an unauthorized remote access tool, RURAT can facilitate various malicious activities, including unauthorized data access, system control, and lateral movement within targeted networks.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1070 - Indicators of Compromise), **Command and Control** (T1071 - Application Layer Protocol), and **Discovery** (T1087 - Account Discovery). The primary data source for this detection is **process creation events** from Windows systems, which provide insights into what processes are launched and their associated attributes, including the Product field in their PE headers.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation events around the detection time to identify the instances of `rutserv.exe` and `rfusclient.exe` being executed. Look for anomalies in the product name that might indicate renaming.

  - **Correlate with Network Traffic**: Examine network traffic logs for any outbound connections initiated by RURAT-related processes to assess if they are establishing a command-and-control channel.

  - **Assess User Behavior**: Investigate the user account associated with the execution of RURAT processes to determine if it aligns with normal user behavior patterns and whether any account compromise has occurred.

  - **Investigate Installed Applications**: Conduct a thorough review of installed applications and running services on the host to identify unauthorized installations of RURAT or any other suspicious software.

  ### Prioritization
  The medium severity of this alert is warranted due to the potential for RURAT to facilitate various forms of cyber intrusion, including data theft and system manipulation. Given the ease with which attackers can modify software attributes for evasion, early detection is essential to mitigate risks.

  ### Blind Spots and Assumptions
  This detection rule may not capture instances where the malware is not executed directly (e.g., launched via other means such as scripts or external commands). Additionally, it assumes that there are no legitimate uses for Remote Utilities in the environment. Required logs must include detailed process creation events with complete Windows PE header information to ensure accurate detection, necessitating proper configuration of logging settings within the Windows environment.

