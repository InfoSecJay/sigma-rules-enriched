logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: '\wbem\WmiPrvSE.exe'
  selection_children_1:
        # TODO: Add more LOLBINs or suspicious processes that make sens in your environment
    Image|endswith:
    - '\certutil.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\msiexec.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\verclsid.exe'
    - '\wscript.exe'
  selection_children_2:
        # This is in a separate selection due to the nature of FP generated with CMD
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
    - 'cscript'
    - 'mshta'
    - 'powershell'
    - 'pwsh'
    - 'regsvr32'
    - 'rundll32'
    - 'wscript'
  filter_main_werfault:
    Image|endswith: '\WerFault.exe'
  filter_main_wmiprvse:
    Image|endswith: '\WmiPrvSE.exe'     # In some legitimate case WmiPrvSE was seen spawning itself
  filter_main_msiexec:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains: '/i '
  condition: selection_parent and 1 of selection_children_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of suspicious child processes by the `WmiPrvSE.exe` service host, which often signifies attempts to exploitWindows Management Instrumentation (WMI) for malicious purposes. Adversaries may aim to execute payloads or commands using legitimate tools, maintaining a low profile while utilizing system-backed operations. Relevant MITRE ATT&CK tactics for this behavior include Execution (T1204.002) and Defense Evasion (T1047).

  Key telemetry sources include process creation logs from Windows (such as Security Event ID 4688 and Sysmon Event ID 1). If malicious, this behavior can indicate an ongoing or attempted compromise that leverages WMI to bypass security controls, potentially leading to data breaches or ransomware deployment. It is important to note that detection alone does not confirm malicious intent; legitimate administrative tasks may use similar process invocations.

  ### Investigation Steps

  - **Examine parent process details:** Check the process creation logs (Event ID 4688) for `WmiPrvSE.exe` as the parent process. Verify the child processes generated and their corresponding command lines for unusual arguments or parameters which deviate from standard operations.

  - **Identify high-confidence malicious indicators:** Focus on any child processes ending with `\mshta.exe`, `\cscript.exe`, or `\powershell.exe` as these are commonly utilized for malicious activity, particularly if they appear immediately after `WmiPrvSE.exe`.

  - **Assess legitimate behavior patterns:** Review typical WMI usage in your environment. For instance, legitimate `WmiPrvSE.exe` activity may include child processes like `\msiexec.exe` with standard installation parameters (e.g., `/i`) or administrative scripts running expected maintenance tasks.

  - **Investigate abnormal command-line executions:** If any child processes exhibit command-line arguments that include `cscript`, `regsvr32`, or `powershell`, capture their full command line details from the logs to evaluate potential abuse cases.

  - **Cross-verify associated events:** Look for related log entries, such as abnormal user activity or other process creation events within a few seconds of the alert. This can provide context on a possible coordinated attack or lateral movement.

  - **Check event correlation for known threats:** Utilize threat intelligence databases to validate if any known malware signatures relate to the detected child processes. For instance, compare activity patterns against reported indicators from frameworks like MITRE or established threat reports.

  ### Prioritization

  This alert should be prioritized as high severity due to potential impacts on critical systems where WMI is often exploited for lateral movement or command execution. Given the propensity of these behaviors in known attack vectors, there is a heightened likelihood of malicious abuse, particularly in environments facing advanced threat actors.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the use of legitimate tools that resemble malicious behavior, leading to possible false positives. Ensure that logging configurations capture the necessary detailed process creation events to maintain detection integrity. Common legitimate activities include administrative tasks utilizing WMI but should be part of established workflows. A related detection to consider is monitoring for unusual registry modifications or script execution that often accompany such process creations.

