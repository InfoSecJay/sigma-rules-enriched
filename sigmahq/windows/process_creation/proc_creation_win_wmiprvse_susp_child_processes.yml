logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: '\wbem\WmiPrvSE.exe'
  selection_children_1:
        # TODO: Add more LOLBINs or suspicious processes that make sens in your environment
    Image|endswith:
    - '\certutil.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\msiexec.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\verclsid.exe'
    - '\wscript.exe'
  selection_children_2:
        # This is in a separate selection due to the nature of FP generated with CMD
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
    - 'cscript'
    - 'mshta'
    - 'powershell'
    - 'pwsh'
    - 'regsvr32'
    - 'rundll32'
    - 'wscript'
  filter_main_werfault:
    Image|endswith: '\WerFault.exe'
  filter_main_wmiprvse:
    Image|endswith: '\WmiPrvSE.exe'     # In some legitimate case WmiPrvSE was seen spawning itself
  filter_main_msiexec:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains: '/i '
  condition: selection_parent and 1 of selection_children_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious child processes spawned by the Windows Management Instrumentation Provider Service (WmiPrvSE.exe), which can indicate potential malicious activity. Attackers may utilize WmiPrvSE to blend in with legitimate Windows functionality and execute payloads through commonly abused binaries. The likely attacker objective is code execution, with the aim of delivering malware or establishing persistence. This detection maps to the MITRE ATT&CK techniques: **Execution (T1204.002)** for use of malicious scripts or executables and **Stealth (T1047)** for leveraging legitimate tools to avoid detection. The primary telemetry sources include Windows process creation events (Security Event ID 4688) and Sysmon Event ID 1 for detailed process information. If malicious, the impact could range from data exfiltration to complete system compromise. Note that this detection does NOT confirm an attack on its own, as false positives can arise from legitimate administrative tasks.

  ### Investigation Steps

  - **Review spawning process details:** Check the parent process using Security Event ID 4688 or Sysmon Event ID 1. Look for `WmiPrvSE.exe` as the parent and note any child processes, especially those indicated in the detection (e.g., `cscript.exe`, `mshta.exe`).

  - **Analyze command-line arguments:** For child processes like `cmd.exe`, examine the CommandLine field for suspicious execution patterns. Legitimate usage often doesn’t contain parameters indicating script execution (e.g., `cscript` or `powershell`).

  - **Check process execution paths:** Validate that the child processes originate from expected locations; for instance, `C:\Windows\System32\mshta.exe` is standard, while abnormal paths could indicate compromise.

  - **Correlate with known benign instances:** Identify known legitimate operations in your environment. For example, legitimate maintenance scripts might use `WmiPrvSE.exe` with `msiexec.exe` for installations; these should not include unusual command-line options.

  - **Flag high-confidence malicious indicators:** Watch for child processes executing known LOLBINs such as `regsvr32.exe` or `powershell.exe` without clear, legitimate reasons. Cross-reference with threat intelligence to confirm recent malicious activity related to detected processes.

  - **Validate file creation or exfiltration:** In tandem with this rule, monitor for file creation events (e.g., `Event ID 4663`) or unusual outbound connections, which may indicate successful delivery of malware.

  ### Prioritization

  This alert is of **high severity** given that it involves a process commonly employed in sophisticated initial access or lateral movement techniques. The likelihood of malicious abuse is significant due to its usage in prevalent attack frameworks, like ransomware and advanced persistent threats.

  ### Blind Spots and Assumptions

  Detections may be circumvented by attackers using legitimate administrative tools to match expected behavior, making detection more challenging. Proper configurations for logging, specifically enabling Sysmon and ensuring detailed process creation logs are captured, are crucial for reliable detection. Legitimate activities, such as IT maintenance tasks or software installation, can trigger this alert. Monitoring companion detections for other execution techniques (such as **PowerShell activities (T1059.001)**) can enhance detection coverage.

