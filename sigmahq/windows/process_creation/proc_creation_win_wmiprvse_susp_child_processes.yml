logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: '\wbem\WmiPrvSE.exe'
  selection_children_1:
        # TODO: Add more LOLBINs or suspicious processes that make sens in your environment
    Image|endswith:
    - '\certutil.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\msiexec.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\verclsid.exe'
    - '\wscript.exe'
  selection_children_2:
        # This is in a separate selection due to the nature of FP generated with CMD
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
    - 'cscript'
    - 'mshta'
    - 'powershell'
    - 'pwsh'
    - 'regsvr32'
    - 'rundll32'
    - 'wscript'
  filter_main_werfault:
    Image|endswith: '\WerFault.exe'
  filter_main_wmiprvse:
    Image|endswith: '\WmiPrvSE.exe'     # In some legitimate case WmiPrvSE was seen spawning itself
  filter_main_msiexec:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains: '/i '
  condition: selection_parent and 1 of selection_children_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of uncommon child processes originating from the Windows Management Instrumentation (WMI) provider service, WmiPrvSE.exe. Malicious actors often exploit WMI to execute commands or payloads on victim systems, as it can bypass traditional security controls. The detection is primarily based on observing unusual process behavior, suggesting possible misuse of systems to execute scripts or download malware using familiar tools.

  The threat scenario revolves around the exploitation of WMI by attackers to gain initial access or maintain persistence within a target environment. Attackers, such as those from the Sodinokibi/REvil ransomware group, may use similar techniques to execute malicious scripts that can facilitate lateral movement or deploy additional payloads. The MITRE ATT&CK tactics relevant to this detection include **Execution** (T1204.002 - User Execution: Malicious File), and **Defense Evasion** (T1047 - Windows Management Instrumentation).

  The primary data source for this rule is the process creation events on Windows endpoints, which provide insights into parent-child process relationships and command lines executed, allowing for detection of these suspicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs to find instances of WmiPrvSE.exe spawning processes like certutil.exe, cscript.exe, or other listed executables. Look for unusual command-line arguments associated with these processes.

  - **Analyze Parent-Child Relationships:** Investigate the parent-child relationship in the process tree to ascertain the legitimacy of processes spawned by WmiPrvSE.exe. Focus on identifying any other unexpected parent processes that might indicate compromise.

  - **Correlate with Alerting Tools:** Use SIEM or EDR platforms to correlate alerts related to WmiPrvSE.exe with known malicious indicators or behaviors. Determine if similar findings have been observed across other systems within the network.

  - **Check User Context:** Validate the user context under which the suspicious processes were executed. Identifying if these operations were initiated by high-privilege users or service accounts can provide additional insights into potential malicious intent.

  ### Prioritization
  The alert is considered high severity due to the potential for significant impact on the organization, including data exfiltration, network compromise, or complete system takeover. The likelihood is elevated, as malicious use of WMI for executing scripts is a common technique employed by advanced persistent threats and ransomware groups.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of legitimate use of WMI, particularly in environments where WMI is heavily utilized for automation or management tasks. The detection logic assumes that processes commonly abused (such as those listed) will not be used legitimately in conjunction with WmiPrvSE.exe. Required logs include detailed process creation events, and configurations must ensure that such logs are enabled and appropriately retained for analysis.

