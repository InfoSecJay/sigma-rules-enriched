note: |
  ### Technical Context

  This Sigma rule detects the use of 7-Zip, specifically when it is used to compress and encrypt files, potentially as a precursor to data exfiltration. The typical attacker objective is to bundle sensitive information securely before transferring it outside the organization, which aligns with the MITRE ATT&CK tactic of "Collection" (T1560.001). The primary telemetry sources include Windows process creation logs, specifically Event IDs 4688 (for process creation) and potentially Sysmon Event ID 1 (for detailed process monitoring). If this behavior is malicious, it could indicate a significant data breach or leakage of sensitive information. However, this detection does NOT confirm that data exfiltration is occurring, as legitimate uses of file compression with password protection are common in many environments.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Event ID 4688 or Sysmon Event ID 1 for process creation logs involving '7z.exe', '7zr.exe', or '7za.exe' under the user account in question. Look for entries where the command line includes ' -p' indicating password protection.

  - **Analyze command line parameters**: Investigate the command line arguments associated with the process. If it includes ' a ' (add archive) or ' u ' (update archive), this could indicate potential malicious activity.

  - **Identify legitimate use cases**: Determine if the user has a known need for using file compression tools. Typical benign usage values should not include sensitive data being packed or transmitted externally, such as C:\Users\[Username]\Documents\** containing work files.

  - **Search for unusual file creation activity**: Look for .zip or .7z files being created in unusual locations, particularly outside of standard directories or on external drives. Check for unexpected timestamps indicative of out-of-hours data compression activity.

  - **Cross-verify user roles**: If the user is not typically involved in data management or administrative tasks, this behavior may warrant escalation. Cross-check the user’s role against their activity to identify potential anomalies.

  - **Capture data transfer artifacts**: Validate if there are any corresponding network logs (e.g., firewall logs) showing traffic to external IP addresses immediately following the triggering event for additional evidence of potential exfiltration.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive data being compressed and prepared for exfiltration. While not every instance of 7-Zip usage is malicious, the behavior is commonly leveraged by attackers in exfiltration scenarios, warranting closer examination in a mature enterprise SOC environment.

  ### Blind Spots and Assumptions

  Evasion techniques such as using renamed binaries or utilizing alternative compression tools may bypass this detection. Reliable detection relies on having comprehensive logging configurations, including Sysmon and Windows Event Logging. Additionally, legitimate activities like routine file backups may trigger alerts, requiring context to differentiate from malicious behavior. Companion detections could include monitoring for abnormal outbound network traffic in conjunction with this rule to enhance coverage and provide context.

