logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Description|contains: '7-Zip'
  - Image|endswith:
    - '\7z.exe'
    - '\7zr.exe'
    - '\7za.exe'
  - OriginalFileName:
    - '7z.exe'
    - '7za.exe'
  selection_password:
    CommandLine|contains: ' -p'
  selection_action:
    CommandLine|contains:
    - ' a '
    - ' u '
  condition: all of selection_*
falsepositives:
- Legitimate activity is expected since compressing files with a password is common.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential data exfiltration attempts wherein an adversary compresses and encrypts sensitive information using the 7-ZIP utility before transferring it outside the organization. Attackers often leverage such tools to obfuscate data, making it harder to detect during the exfiltration process. The primary objective of this behavior may involve stealing intellectual property, sensitive personal data, or system configurations to establish persistence or conduct further malicious actions.

  Relevant MITRE ATT&CK tactics include **Collection** (TA0009) and the specific technique **Data from Local System** (T1560.001), which focuses on the gathering of data that is subsequently prepared for exfiltration. The main data sources that should be monitored for evidence of this activity are process creation events from Windows systems, capturing the use of specific command-line arguments and executable signatures associated with 7-ZIP.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check logs for the execution of `7z.exe`, `7zr.exe`, or `7za.exe`. Analyze the timestamps, parent processes, and user accounts to assess legitimacy.

  - **Analyze Command-Line Arguments:** Inspect the command-line arguments associated with the detected 7-ZIP executions. Look for unusual flag usage, especially `-p`, which denotes password protection and indicates possible encryption for exfiltration purposes.

  - **Correlate with Network Traffic:** If applicable, evaluate outbound network traffic for any large file transfers that coincide with the timing of the detected process executions. Check for unusual external IP addresses or protocols that may signify data exfiltration.

  - **Investigate File Artifacts:** Determine if there are newly created, compressed files in directories commonly targeted by adversaries. Check for unusual locations or naming conventions that may signal malicious activity.

  ### Prioritization
  The severity of this alert is moderate in an enterprise environment since the compression and password protection of files is common practice but can indicate a significant risk if associated with exfiltration activities. Detection of this behavior should warrant further investigation to ensure sensitive data is not being compromised.

  ### Blind Spots and Assumptions
  This detection rule may miss exfiltration attempts that utilize legitimate compression tools other than 7-ZIP or variations in command usage that do not match the established patterns. It assumes that logging for process creation is enabled and captures sufficient details of command-line arguments. Additionally, while legitimate use of compression tools is noted, any related activity may signify routine operations, requiring context-based analysis to differentiate between benign and malicious actions.

