note: |
  ### Technical Context

  This Sigma rule detects the use of 7-Zip, a popular compression and archiving tool, when it is invoked with commands to compress or update files while also setting a password. The likely objective of an attacker using this method would be to obfuscate sensitive data during the exfiltration process, aiming to evade detection by security controls. This behavior falls under the MITRE ATT&CK tactic of Collection (T1560.001).

  The primary telemetry source for this detection is Windows process creation events, specifically those generated by Security Event ID 4688 or Sysmon Event ID 1. If this behavior is malicious, there is a significant risk of data exfiltration, particularly if sensitive business data is being compressed and encrypted without authorization. However, this detection does not confirm malicious intent on its own, as legitimate users or automated processes may also use 7-Zip for valid purposes.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Security Event ID 4688 and Sysmon Event ID 1 for process creation of `7z.exe`, `7za.exe`, or `7zr.exe`. Analyze processes for parent-child relationships to assess if the invocation appears suspicious.

  - **Examine Command Line Arguments:** Look specifically at the `CommandLine` field for entries containing ` -p`, which indicates a password is being set. Investigate the context of this command to evaluate the legitimacy of the action.

  - **Validate File Operations:** Identify any file operations associated with the command. Check for log entries showing compression of sensitive directories (like user profiles or sensitive data repositories), which may suggest malicious behavior.

  - **Review Scheduled Tasks or Scripts:** Inspect for scheduled tasks or automated scripts that may routinely execute 7-Zip commands. Document any legitimate usage, focusing on IT operations and admin roles to understand expected behavior.

  - **Identify Exfiltration Attempts:** Look for network connections or file transfers initiated post-compression that correlate with the time of the 7-Zip command execution. Log sources may include Windows Firewall logs and network IDS or proxy logs.

  - **Assess Asset Criticality:** Prioritize review of 7-Zip usage on high-value assets, especially servers storing sensitive data. Usage by non-administrative personnel may warrant escalated investigation.

  ### Prioritization

  This alert has medium severity due to the potential risk of sensitive information being captured and exfiltrated using compression. While 7-Zip could be used legitimately, its use with password protection is notable, making this behavior a common tactic for data exfiltration by adversaries.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use alternative compression tools or techniques that do not trigger this specific rule. It requires reliable monitoring of process creation events and may also generate false positives from legitimate use cases in data management. Other related detections include generic exfiltration alerts based on unusual outbound traffic volumes to reinforce coverage against potential data theft activities.

