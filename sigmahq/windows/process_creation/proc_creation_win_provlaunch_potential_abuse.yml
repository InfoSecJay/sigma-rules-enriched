  - Image|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\AppData\Temp\'
    - '\Windows\System32\Tasks\'
    - '\Windows\Tasks\'
    - '\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
