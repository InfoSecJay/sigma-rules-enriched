detection:
  selection:
    ParentImage|endswith: '\provlaunch.exe'
  filter_main_covered_children:
        # Note: this filter is here to avoid duplicate alerting by f9999590-1f94-4a34-a91e-951e47bedefd
  - Image|endswith:
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\notepad.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - Image|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\AppData\Temp\'
    - '\Windows\System32\Tasks\'
    - '\Windows\Tasks\'
    - '\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects child processes spawned by `provlaunch.exe`, which can indicate potential abuse for executing scripts or executables in a stealthy manner. The likely attacker objective is to launch malicious payloads or scripts under the guise of legitimate system processes, thereby bypassing detection mechanisms. Relevant MITRE ATT&CK tactic is "Execution" (TA0002) and technique "User Execution" (T1203) or "Malicious File Execution" (T1218).

  The primary telemetry source for this detection is process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it can compromise system integrity, leading to data exfiltration, system manipulation, or lateral movement. It is important to note that this detection does NOT confirm that the child processes are malicious on their own; further investigation is required to validate intent and context.

  ### Investigation Steps

  - **Identify process creation details:** Analyze Event ID 4688 or Sysmon Event ID 1 to gather information on the parent process (`provlaunch.exe`) and child processes that were executed. Look for high-risk child processes like `powershell.exe`, `cmd.exe`, or `mshta.exe`, which can indicate malicious intent.

  - **Check file paths for indicators:** Review the file paths of the child processes spawned. Legitimate child processes typically originate from known directories (e.g., `C:\Windows\`, `C:\Program Files\`). Any child process originating from `C:\Temp\` or `C:\Users\Public\` may indicate suspicious activity.

  - **Examine command line arguments:** Check the command line arguments associated with the child processes from Event ID 4688. Any unusual flags or obfuscation techniques may suggest malicious usage. E.g., launching PowerShell scripts with encoded commands.

  - **Cross-reference with baseline activity:** Compare the identified processes against a known good baseline for the environment. If `provlaunch.exe` is used legitimately within specific workflows (e.g., initialization of applications), document expected behaviors and ensure alerts for those scenarios are evaluated appropriately.

  - **Look for alternate indicators of compromise:** Investigate if there were any unusual network connections or file creations around the time the alert was triggered. Malicious executions often lead to unexpected outbound connections or file modifications in sensitive directories.

  ### Prioritization

  Alerts of this nature should be assessed with medium priority due to the potential impact on system integrity and the likelihood of exploitation by adversaries utilizing living-off-the-land techniques. Given that the leveraged binaries can execute scripts or commands that are often weaponized, timely triage is crucial to prevent further compromise.

  ### Blind Spots and Assumptions

  Detection is limited as attackers may rename or obfuscate malicious executables, making them resemble valid processes, bypassing detection. Log sources need to be correctly configured to capture all relevant process creation events; absence of Sysmon logs may reduce visibility. Legitimate applications may consume `provlaunch.exe` spawnings for internal processes, such as management tools. A related detection is the monitoring of direct executions of `calc.exe`, `cmd.exe`, or `powershell.exe`, which can increase the contextual understanding of executed commands and help identify potential abuse patterns.

