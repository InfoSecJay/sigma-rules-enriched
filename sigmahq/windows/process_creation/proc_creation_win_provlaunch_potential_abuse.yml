detection:
  selection:
    ParentImage|endswith: '\provlaunch.exe'
  filter_main_covered_children:
        # Note: this filter is here to avoid duplicate alerting by f9999590-1f94-4a34-a91e-951e47bedefd
  - Image|endswith:
    - '\calc.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\notepad.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - Image|contains:
    - ':\PerfLogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\AppData\Temp\'
    - '\Windows\System32\Tasks\'
    - '\Windows\Tasks\'
    - '\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of processes that are spawned as children of "provlaunch.exe," which may indicate potential abuse for proxy execution or circumvention of security controls. The likely objective of an attacker employing this technique is to evade detection by utilizing trusted system binaries to execute malicious payloads. This behavior correlates with the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the detected behavior is malicious, it could lead to system compromise, data exfiltration, or lateral movement within the network. This detection does not confirm malicious intent or behavior on its own; further investigation is required to establish context.

  ---

  ### Investigation Steps

  - **Validate the parent process:** Check for Security Event ID 4688 or Sysmon Event ID 1, specifically identifying "provlaunch.exe" as the parent process. Determine the child processes initiated—malicious indicators include unexpected processes like "cmd.exe" or "powershell.exe."

  - **Analyze command line arguments:** Review the command line arguments associated with child processes (accessible via Event ID 4688 or Sysmon Event ID 1). Legitimate behavior shows standard system utility usage without obfuscation.

  - **Assess process paths:** Examine the file paths of the child processes. Malicious activities frequently involve paths like "\AppData\Temp\" or "\Windows\Temp\, whereas legitimate tasks typically originate from well-known directories such as "\System32\".

  - **Check for scheduled tasks:** Look for related scheduled tasks using Windows Task Scheduler logs. Malicious execution may set or utilize tasks in unexpected directories that deviate from normal operational patterns.

  - **Identify artifacts on disk:** Confirm whether any temporary files were created or modified in suspicious locations specified in the detection filter (like "\Temp\", "\PerfLogs\"). Use file system monitoring via Sysinternals or endpoint detection tools to locate any newly generated files that could indicate malware delivery or command execution.

  ---

  ### Prioritization

  This alert holds medium severity, given the potential impact on systems executing trusted binaries being exploited for malicious purposes. The likelihood of adverse actions taken via proxy execution is reasonable, considering many attack vectors leverage this technique. However, it is somewhat less commonly weaponized compared to direct execution methods.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist, primarily around the potential for legitimate applications that may use "provlaunch.exe" for valid operations, leading to false positives. Successful detection requires proper logging configuration for process creation events through GPO or Sysmon deployment. Additionally, routine administrative tasks may trigger similar alerts, necessitating contextual investigation. A companion detection for process injection or command line abuse can provide better coverage and strengthen validation of indicators.

