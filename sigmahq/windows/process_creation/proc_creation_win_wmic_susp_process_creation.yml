note: |
  ### Technical Context

  This rule detects the execution of suspicious processes using WMIC (Windows Management Instrumentation Command-line) with specific commands that may indicate adversarial behavior, such as calling potentially harmful executables like `rundll32`, `regsvr32`, and others. The likely attacker objective is to execute payloads or perform registry manipulations while attempting to avoid detection via traditional methods. This aligns with the MITRE ATT&CK techniques T1047 (Windows Management Instrumentation) and T1059 (Command and Scripting Interpreter).

  The primary telemetry sources include process creation logs (e.g., Windows Event ID 4688, Sysmon Event ID 1). If malicious, this behavior can lead to execution of arbitrary code, data theft, or system compromise. However, this detection alone does not confirm that a compromise is occurring as legitimate administrative actions could also trigger similar processes.

  ### Investigation Steps

  - **Check Event ID 4688 for Process Creation**: Review Windows Security Event ID 4688 logs for WMIC command execution. Look for CommandLine values containing `process call create` alongside suspicious process names and paths such as `rundll32`, `regsvr32`, or `cmd.exe`.

  - **Identify High-Confidence Malicious Indicators**: Look for the combination of WMIC invoking `cmd` with parameters (e.g., `/c`, `/k`) and suspicious paths like `%temp%` or `\Windows\Temp\`. Any instance where these parameters are included signals a higher likelihood of malicious activity.

  - **Correlate with Sysmon Logs**: Cross-reference with Sysmon Event ID 1 to obtain additional context on the process creation. Assess the parent-child process relationships to observe if the detected WMIC command was spawned by a known malicious parent process.

  - **Review Legitimate Usage Patterns**: Validate that your environment typically uses WMIC for legitimate administrative tasks. Look for timestamps and processes initiated by trusted admin accounts, ensuring no unauthorized users executed WMIC commands recently.

  - **Check Service and Scheduled Task Modifications**: Monitor for any recent changes to services or scheduled tasks through the Windows Event Logs (Event ID 4697 for service creation, Event ID 4698 for scheduled tasks) since these can often result from WMIC activity.

  - **Assess Criticality of Affected Host**: Determine the role of the host that triggered the alert. Particularly, if it is an asset hosting sensitive data or critical applications, escalation may be warranted due to the heightened security risk.

  ### Prioritization

  This alert should be treated as high-severity, particularly if the affected host is critical to business operations or contains sensitive data. The behavior reflects a common tactic among adversaries, particularly in post-exploitation scenarios, making it a likely avenue for malicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of obfuscation techniques, such as command-line encoding or the use of different tools or methods to achieve similar outcomes. Ensure that all relevant event logging is enabled, notably for process creation via Sysmon and Windows Security. Legitimate administrative operations, such as system configuration changes by IT staff, may trigger this alert. Companion detections, such as monitoring PowerShell usage (T1059.001), strengthen coverage by identifying other attack vectors often utilized in conjunction with WMIC commands.

