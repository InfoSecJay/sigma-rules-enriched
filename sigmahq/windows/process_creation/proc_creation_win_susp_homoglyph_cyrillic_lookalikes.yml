level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of homoglyph characters, which are Unicode symbols that closely resemble standard ASCII characters. Attackers often use these homographs to obfuscate commands and filenames in a tactic known as "masquerading." For example, a malicious actor might use the Cyrillic letter "а" instead of the Latin "a" in command-line inputs to mislead security defenses and impersonate trusted processes. The ultimate goal of this technique is to bypass security measures by disguising illicit activity, making it appear benign.

  The associated MITRE ATT&CK techniques are **T1036 (Masquerading)**, specifically the subtype **T1036.003 (Masquerading by Using Homoglyphs)**. This categorization highlights the evasive nature of such attacks, which seeks to exploit human and system trust in known commands or file names. Primary data sources for this detection include **process creation logs** from Windows operating systems, as these logs will capture command-line arguments and allow for the identification of any disguised commands.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for suspicious process launches, specifically looking at command-line arguments that contain homoglyph characters. Focus on any unusual or unexpected executions.

  - **Cross-reference Known Processes:** Compare detected commands against a list of legitimate applications and processes. Look for discrepancies in spelling and formatting that might indicate an attempt to disguise malicious actions.

  - **Audit User Behavior:** Examine the context in which the suspicious commands were executed. Review user activity for any unauthorized access attempts or anomalies around the time of the event.

  - **Utilize Threat Intelligence:** Check against current threat intelligence sources for any known usage of homoglyph attacks linked to active threat actors. Understanding the wider context may reveal potential targeting or ongoing campaigns.

  ### Prioritization
  Given the potential impact of successful homoglyph attacks in compromising systems and exfiltrating data, this alert is classified as medium severity. The likelihood of attackers employing such techniques increases in environments where employees may inadvertently invoke commands that appear legitimate.

  ### Blind Spots and Assumptions
  This detection logic assumes that homoglyph usage points to malicious intent, which may not hold true in environments where legitimate uses of non-ASCII characters are common, such as in multilingual contexts. There may be blind spots if security logging is not appropriately configured to capture detailed command-line data. Additionally, environments that have not implemented strict logging policies for process creation may lack the required telemetry to fully support this detection rule.

