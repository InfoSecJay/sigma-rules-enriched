    - "Х"              # Х/X
    - "Ѕ"              # Ѕ/S
    - "І"              # І/I
    - "Ј"              # Ј/J
    - "Ү"              # Ү/Y
    - "Ӏ"              # Ӏ/I
    - "Ԍ"              # Ԍ/G
    - "Ԛ"              # Ԛ/Q
    - "Ԝ"              # Ԝ/W
    - "Α"              # Α/A
    - "Β"              # Β/B
    - "Ε"              # Ε/E
