    - "Τ"              # Τ/T
    - "Υ"              # Υ/Y
    - "Χ"              # Χ/X
  selection_lower:
    CommandLine|contains:
    - "а"              # а/a
    - "е"              # е/e
    - "о"              # о/o
    - "р"              # р/p
    - "с"              # с/c
