note: |
  ### Technical Context

  The Sigma rule detects the use of homoglyph characters—Unicode characters visually similar to ASCII letters—in command-line inputs. These homoglyphs exploit visual similarities to obfuscate actions, which may be part of a masquerading technique employed by an attacker to disguise malicious activity. The likely objective of such an attack is to trick users or security systems into believing that legitimate processes are being executed.

  This behavior aligns with the MITRE ATT&CK technique "Masquerading" (T1036) and its sub-technique "Masquerading as a Process" (T1036.003). The primary telemetry source for this rule comes from process creation events, specifically monitoring for command-line arguments containing homoglyphs. If this behavior is malicious, it poses a significant security risk, as it can facilitate unauthorized access or execution of harmful payloads. However, this detection does NOT confirm malicious intent on its own; further investigation is necessary to determine the legitimacy of the activity.

  ### Investigation Steps

  - **Review the command line details:**
    Check the process creation logs (Event ID 4688) for the specifics of the command line that triggered the alert. Identify if the command execution appears to be legitimate (e.g., part of a known application) or has suspicious intent.

  - **Examine surrounding process context:**
    Investigate the process's parent process ID (PID) to assess its origin. Use Sysmon Event ID 1 to correlate with other line attributes and determine if spawned processes have legitimate associations or if they are invoked in unusual contexts.

  - **Check for user context anomalies:**
    Review the user account under which the command was executed. Analyze Active Directory logs for recent user behavior that might suggest compromise (e.g., unusual logon locations or times).

  - **Identify logged events of known malicious activity:**
    Cross-reference the event with threat intelligence on similar attacks or known malicious indicators linked to homoglyphs. Look for previously recorded commands, files created, or network traffic anomalies in relevant logs.

  - **Assess benign usage patterns:**
    Determine if there are legitimate reasons for the appearance of these characters in command lines, such as localized applications or users typing in Cyrillic. Documentation from user training can help clarify acceptable usage.

  - **Monitor system for file artifacts:**
    Investigate any associated file creation or modification events (e.g., using Sysmon Event ID 11) that coincide with the command execution. Validate if these files align with known good behavior or show signs of exploit usage.

  ### Prioritization

  This alert holds medium severity due to its potential impact on critical systems where trust relationships and user actions are pivotal. The obfuscation methods employed in homoglyph attacks are increasingly weaponized, making them of high concern, especially in environments with frequent phishing and credential theft incidents.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of legitimate Cyrillic text, resulting in potential false positives. Reliable detection requires comprehensive logging configurations, ensuring process creation events are consistently captured, particularly in environments with diverse language inputs. Legitimate actions that may trigger the alert include usage of localization or internationalization features by applications. Strengthening coverage could involve companion detections for PowerShell commands that include potentially obfuscated input, amplifying the response effort against similar attack patterns.

