    - "А"              # А/A
    - "В"              # В/B
    - "Е"              # Е/E
    - "К"              # К/K
    - "М"              # М/M
    - "Н"              # Н/H
    - "О"              # О/O
    - "Р"              # Р/P
    - "С"              # С/C
