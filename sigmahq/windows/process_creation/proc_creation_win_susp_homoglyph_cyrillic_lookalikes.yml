note: |
  ### Technical Context

  This Sigma rule detects the use of homoglyph characters in command line arguments, specifically characters that visually resemble ASCII letters but are distinct Unicode characters. Attackers may utilize homoglyphs as an obfuscation technique to masquerade malicious commands, making it harder for analysts and security tools to identify potentially harmful activities. The rule is relevant to the MITRE ATT&CK tactic for Defense Evasion (TA0005) and the technique for Obfuscated Files or Information (T1036) along with the variant T1036.003.

  The primary telemetry source for this detection is Windows process creation events, particularly focused on command lines (Security Event ID 4688 and Sysmon Event ID 1). If malicious, the impact includes the potential for command execution evasion, delivery of malware, or unauthorized administrative actions. This detection does NOT confirm that an attack is happening on its own; it merely highlights the use of potentially insecure or suspicious command line entries.

  ### Investigation Steps

  - **Review command line arguments:** Check process creation logs (Event ID 4688 / Sysmon ID 1) for the presence of homoglyph characters as listed in the Sigma rule. Look for variations in the command that might indicate obfuscation.
  - **Validate the legitimacy of the process:** Identify the parent process and the user context (e.g., are these commands being run by legitimate services or known administrative accounts?). Common benign usage may include software that requires multilingual support, especially in regions with Cyrillic scripts.
  - **Identify high-confidence malicious indicators:** Look for known malicious processes or executable names associated with the command lines that utilize homoglyphs. Regularly compare against threat intelligence databases for known indicators of compromise.
  - **Examine related processes:** Cross-reference recent process creation events with the same session ID to detect concurrent suspicious activities (Event ID 4688). Look for patterns such as unusual network connections or file operations tied to the suspect processes.
  - **Assess command usage frequency:** Determine how often these commands with homoglyphs are executed within a given time frame. Frequent execution in short intervals may signal an automated attack script.

  ### Prioritization

  This alert is of medium severity due to the potential for evasion tactics commonly utilized by adversaries. The likelihood of malicious intent is moderately high, as homoglyphs are often weaponized to conceal payload delivery or commands. Depending on the system's role (e.g., if it’s part of a critical infrastructure), this alert may warrant higher prioritization for investigation.

  ### Blind Spots and Assumptions

  Detection may have limitations since legitimate software usage can trigger this alert, particularly in regions where Cyrillic characters are common. If logging configurations are not set to capture complete command line arguments, or if the system does not process Unicode effectively, detection may fail. Additionally, continuous evaluation against evolving obfuscation techniques is necessary. A related detection to strengthen coverage could include monitoring for command line arguments using other forms of obfuscation beyond just homoglyphs.

