level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of users to the local administrators group via command-line utilities like `net.exe` and `Add-LocalGroupMember`. These actions are often part of an attacker's objective to elevate privileges on a compromised system. By gaining local admin rights, adversaries can execute arbitrary code, deploy further malware, or steal sensitive data. It aligns with the MITRE ATT&CK tactic of Persistence (T1078) and Privilege Escalation (T1068).

  The primary telemetry sources include Windows Security Event ID 4728 (Member Added to a Group) and process creation logs indicating the use of `net.exe` or `powershell.exe`. The security impact of this activity can be significant, leading to unauthorized access and control over critical systems. However, it's important to note that this detection alone does not confirm malicious intent, as legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Review Security Event IDs 4728 and 4732**: Check for any instances where users are added to the Administrators group. Look for timestamps aligning with unusual account activity, or access from non-standard IP addresses.

  - **Analyze Process Creation Logs**: Examine logs for Event ID 4688 showing `net.exe` or `powershell.exe` usage. Confirm that the command line includes parameters like `localgroup` and `/add` to validate the action being taken.

  - **Identify Authorized Administrative Actions**: Verify legitimate administrative changes within the organization. Administrative users should typically follow documented procedures for group modifications. If the change was expected, validate against internal records.

  - **Correlate with User Behavior Analytics**: Assess user behavior for any anomalies preceding the addition to the local admin group. Look for failed logins or unusual access patterns from the affected user account.

  - **Check for Malicious Payload Indicators**: Look for signs of malware presence or lateral movement, particularly if the local admin addition coincides with the execution of suspicious scripts or executables. Review for file creation or unexpected service installations.

  - **Evaluate Host Role and Asset Criticality**: Determine the role of the affected system (server, workstation, etc.). Higher criticality systems warrant faster escalations and more in-depth investigations due to potential impact on overall security posture.

  ### Prioritization

  This alert holds medium severity as gaining local admin access can enable broader system control and potential lateral movement within the network. The likelihood of malicious actions is high, particularly if combined with other suspicious activities. Elevating privileges in this manner is a common technique used by adversaries.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative actions if not coupled with context from change management practices. Evasion techniques include using alternate command-line tools or scripting languages not detected by the rule. Legitimate use cases may include scheduled IT maintenance or support operations. Companion detections such as monitoring for modifications in other privileged groups (e.g., Remote Desktop Users) can enhance overall visibility into potential privilege escalation events.

