logsource:
  category: process_creation
  product: windows
detection:
  selection_main:
  - CommandLine|contains|all:
              # net.exe
    - 'localgroup '
    - ' /add'
  - CommandLine|contains|all:
              # powershell.exe
    - 'Add-LocalGroupMember '
    - ' -Group '
  selection_group:
    CommandLine|contains:
    - ' administrators '
    - ' administrateur'         # Typo without an 'S' so we catch both
  condition: all of selection_*
falsepositives:
- Administrative activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where a user is added to the local administrators group on Windows machines, specifically through the use of commands like `net localgroup` and `Add-LocalGroupMember`. This behavior is often associated with privilege escalation, where an attacker seeks to gain elevated permissions on a compromised system, allowing for more extensive control and potential lateral movement within the environment. The objective of adding users to the local administrators group may be to install malicious software, exfiltrate sensitive data, or maintain persistence within the network.

  Relevant MITRE ATT&CK techniques include:
  - Privilege Escalation (T1068): Gaining elevated access to resources.
  - Persistence (T1098): Ensuring continued access, often through backdoor accounts or services.

  The primary data sources for detecting this activity include process creation events from Windows systems that log command execution, ideally correlated with user activity logs and monitoring solutions that track administrative events.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of `net.exe` and `powershell.exe` being executed with arguments indicating local group modifications, specifically looking for additions to the administrators group.
  - **Check User Membership Changes:** Investigate Active Directory and local machine logs to understand context surrounding the user additions, including who executed the command and the accounts that were modified.
  - **Analyze Security Events:** Look into Windows Security Event logs (Event ID 4728) for indications of changes within the local group memberships, particularly those linked to the Local Administrators group.
  - **Identify Contextual Use:** Correlate the detected commands with user account activity to identify any unusual patterns, especially if an atypical user is being administratively elevated.

  ### Prioritization
  The medium-severity level of this alert reflects the significant risk associated with unauthorized administrative access, which can lead to severe consequences if exploited. Privilege escalation attempts are common in targeted attacks, making this behavior a notable red flag in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may not capture all methods of privilege escalation or group modifications, particularly if threats utilize alternate command-line interfaces or scripts not covered by this logic. It also assumes that process creation events are being adequately logged and that necessary auditing settings are configured on target systems to capture detailed command line information. If proper logging is disabled or misconfigured, this detection may fail to trigger, allowing malicious actions to go unnoticed.

