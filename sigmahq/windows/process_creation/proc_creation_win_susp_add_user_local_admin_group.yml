detection:
  selection_main:
  - CommandLine|contains|all:
              # net.exe
    - 'localgroup '
    - ' /add'
  - CommandLine|contains|all:
              # powershell.exe
    - 'Add-LocalGroupMember '
    - ' -Group '
  selection_group:
    CommandLine|contains:
    - ' administrators '
    - ' administrateur'         # Typo without an 'S' so we catch both
  condition: all of selection_*
falsepositives:
