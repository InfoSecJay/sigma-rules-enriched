note: |
  ### Technical Context

  This Sigma rule detects the execution of "Ilasm.EXE," which is a Microsoft intermediate language compiler used to generate executable (EXE) or dynamic link library (DLL) files from Microsoft Intermediate Language (IL) code. The behavior identified can indicate an attacker attempting to compile or obfuscate malicious C# code into a runnable format, potentially for execution as a part of a larger payload.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005) and the technique is **Compile and Execute (T1127)**. The primary telemetry sources include Windows process creation logs, specifically the Event ID 4688 for process creation or Sysmon Event ID 1. If a malicious incident is confirmed, this could lead to unauthorized execution of potentially harmful software on the system.

  This detection does NOT confirm that the activity is malicious on its own, as legitimate use may involve developers or system administrators compiling code for valid purposes.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for any invocation of "ilasm.exe." Pay particular attention to the CommandLine arguments, specifically if they contain " /dll" or " /exe" which are indicative of the compilation outcomes.

  - **Analyze the parent process:** Identify the parent process of the "ilasm.exe" execution to understand the context of its launch. Look for suspicious or unusual parent processes that may indicate exploitation or misuse.

  - **Check compilation output locations:** Determine where the compiled executable or DLL is being placed. Malicious artifacts could appear in unusual directories, such as temporary folders or user profile paths that are not part of normal development practices.

  - **Identify legitimate usage patterns:** Validate if members of the development team or IT administrators commonly use "ilasm.exe." If this is a normal activity, context will help differentiate between benign and malicious indicators.

  - **Correlate with other alerts:** Look for any related events or alerts, such as unusual network connections or subsequent execution of the compiled binaries. Cross-reference with additional detections around network behavior or further deployment of the generated executables.

  - **Evaluate system roles and criticality:** Assess the host's role and criticality within the environment. If the affected system is a server or a critical asset, the alert requires higher priority due to its potential impact on overall security posture.

  ### Prioritization

  This alert is medium severity due to the potential for malicious use of "ilasm.exe" in compiling and deploying vulnerable or malicious C# code. The likelihood of exploitation exists, considering that such behavior is commonly employed in various attack vectors, particularly in post-compromise scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as code obfuscation, where attackers may use alternate methods to achieve similar goals without invoking "ilasm.exe" directly. Reliable detection necessitates comprehensive logging of all process creation events across managed endpoints and may require elevated logging configurations in Windows for thorough visibility. Legitimate software development activities, such as application updates or legitimate debugging processes, may also inadvertently trigger the alert. A related detection that could enhance coverage is monitoring for unusual outbound network connections following the compilation, which could indicate lateral movement or data exfiltration resulting from the compiled code.

