logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\ilasm.exe'
  - OriginalFileName: 'ilasm.exe'
  selection_cli:
    CommandLine|contains:
    - ' /dll'
    - ' /exe'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of `Ilasm.EXE`, a tool that compiles Intermediate Language (IL) code into executable (EXE) or dynamic link library (DLL) files. This detection is significant because `Ilasm.EXE` is often used for legitimate software development but can also be exploited by threat actors to obfuscate malicious payloads or to execute unauthorized C# code in a targeted environment. Thus, the detection serves to identify potential instances of code compilation that may indicate malicious intent.

  The likely threat scenario involves attackers attempting to deploy malware or backdoors in a Windows environment by utilizing compiled C# code. By leveraging `Ilasm.EXE`, they can generate executable files in memory or on disk to evade conventional security measures, ultimately aiming to establish persistence or conduct further reconnaissance within a network. This behavior is relevant to the following MITRE ATT&CK techniques:
  - **Defense Evasion (T1203)**: Exploiting user execution flaws through compiled scripts.
  - **Scripting (T1127)**: Using scripting languages to execute malicious code.

  Primary sources of telemetry for this detection include **process creation events**, which capture details about executed binaries and their command-line parameters, along with system logs that track file executions and modifications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation events to identify instances of `Ilasm.EXE` execution. Pay special attention to the command-line arguments to determine whether the tool was used to compile DLLs or EXEs.

  - **Inspect Command-Line Usage**: Look for the presence of suspicious command-line flags such as ` /dll` or ` /exe`. This can help differentiate between legitimate use cases and potential exploit activity.

  - **Check for Unusual Patterns**: Examine if `Ilasm.EXE` was executed from uncommon or temporary directories, which may indicate attempts to obscure malicious activity.

  - **Correlate with Other Events**: Cross-reference detected instances of `Ilasm.EXE` use with other suspicious events in your environment, such as unusual network connections or additional process executions that could indicate lateral movement or command and control activity.

  ### Prioritization
  The alert is categorized as medium severity due to the potential impact of malicious use of software compilation, which can lead to unauthorized application execution in enterprise environments. While the likelihood of such events is relatively lower, the consequences can be severe if a successful compromise occurs.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the absence of visibility into legitimate development activities, which may generate false positives. The detection logic assumes that any invocation of `Ilasm.EXE`, especially with specified command-line arguments, could indicate potential misuse without consideration of context. It is crucial to ensure that process creation logging is enabled and that logs are retained for a sufficient duration to facilitate thorough investigation. Additionally, proper context for ordinary development processes should be documented to differentiate between benign and malicious use.

