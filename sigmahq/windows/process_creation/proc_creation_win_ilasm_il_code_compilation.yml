note: |
  ### Technical Context

  This Sigma rule detects the execution of `Ilasm.EXE`, a tool used to compile C# intermediate language (IL) code into executable (EXE) or dynamically linked library (DLL) files. An attacker may leverage this functionality to create malicious payloads that could execute on a victim's machine, facilitating further intrusion steps, lateral movement, or data exfiltration. This behavior fits into the MITRE ATT&CK framework under the tactic "Execution" and technique "Compile to Executable" (T1127).

  The primary telemetry source for this detection is process creation logs from Windows, specifically those capturing Event ID 4688 for logs detailing process startups. If malicious, the execution of Ilasm may indicate an attempt to create and execute untrusted or adversarially crafted binaries. Importantly, this detection does NOT confirm that the generated file is malicious on its own, as Ilasm can also be used for benign purposes in valid software development.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 logs for any instances where Ilasm.EXE was executed. Look for the `CommandLine` field containing ` /dll` or ` /exe`, indicating potentially malicious intent.

  - **Identify the parent process:** Investigate the parent process of Ilasm.EXE by examining the `ProcessId` and `NewProcessId` fields in the Security Event 4688 logs. A parent process associated with development environments (like Visual Studio) may indicate legitimate behavior.

  - **Analyze generated artifacts:** After Ilasm.EXE execution, confirm file creation in the target directory. Look for the appearance of .EXE or .DLL files created around the same timestamp, focusing on file paths typically associated with temporary execution (e.g., `C:\Users\<User>\AppData\Local\Temp`).

  - **Review command line parameters:** Validate the specific command line parameters used with Ilasm.EXE. Legitimate developers usually specify a project file or certain options, while generic commands may indicate malicious use.

  - **Inspect for scheduled tasks:** Search for any scheduled tasks created or modified around the same timeframe that reference the newly created .EXE or .DLL, as these can indicate further automation of malicious behavior post-execution.

  ### Prioritization

  This alert should be considered medium severity due to the potential for malicious abuse within the enterprise. Given that Ilasm.EXE is a legitimate binary but can be used nefariously to create harmful payloads, the likelihood of malicious use exists especially if combined with anomalous parent process activity.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where Ilasm.EXE is executed from non-standard locations, which could evade detection. Reliable detection requires that process creation logs are properly configured to capture all instances of executable runs. Additionally, while legitimate C# development could trigger this rule, understanding organizational development practices is crucial. A related detection could involve monitoring for the execution of any compiled binaries immediately following Ilasm.EXE execution, which would strengthen context around potential malicious activity.

