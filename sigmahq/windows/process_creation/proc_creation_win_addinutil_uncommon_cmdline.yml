title: Uncommon AddinUtil.EXE CommandLine Execution
id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
status: test
description: |
  Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with uncommon Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  selection_cli:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  filter_main_addinroot:
    CommandLine|contains:
    - '-AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of AddInUtil.exe with atypical command-line arguments for the AddInRoot and PipelineRoot parameters. Such behavior may indicate an attacker attempting to utilize this legitimate tool to load or execute a malicious payload from a non-standard path, circumventing security measures. The attacker’s objective may include the deployment of a malicious add-in or remote code execution, leveraging a commonly permitted system utility for nefarious purposes. This activity corresponds to MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Masquerading" (T1218).

  The primary telemetry source for this detection is process creation logs, specifically Windows Event ID 4688 or Sysmon Event ID 1, which provide insights into command-line arguments used during the execution of processes. Should this alert be validated as malicious, the security impact could involve unauthorized access to sensitive data or further compromise of the system. This detection does NOT confirm that an attack is actively occurring; it only highlights a potentially suspicious execution pattern that requires further investigation.

  ### Investigation Steps

  - **Confirm the execution context:** Review Windows Event ID 4688 or Sysmon Event ID 1 logs to identify the user and system context in which AddInUtil.exe was executed. Benign usage typically occurs under the context of application installation or legitimate updates, not under SYSTEM or unusual user accounts.

  - **Inspect command-line arguments:** Check for command-line parameters using the "CommandLine" field. Look for any instances of unusual paths outside standard locations (e.g., paths other than "C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA") as malicious indicators.

  - **Cross-reference user activity:** Investigate user behavior through authentication logs (Event ID 4624) or relevant application logs to determine if the user has legitimate reasons for invoking AddInUtil.exe with uncommon parameters.

  - **Evaluate the host for signs of compromise:** Execute a file enumeration using Sysinternals tools or PowerShell to check for unusual files or executables in the locations where the AddInRoot and PipelineRoot paths point. Any executable files in those directories not associated with known software could indicate malintent.

  - **Collect security software logs:** Review logs from endpoint protection solutions for any alerts that may correlate with the execution of AddInUtil.exe, especially alerts indicating malware behavior or unauthorized access attempts.

  ### Prioritization

  This alert is of medium severity due to its potential association with an exploitation technique commonly leveraged by adversaries. The affected system’s criticality should inform urgency, particularly if it is part of the organization's sensitive infrastructure or handles sensitive data. While uncommon, the use of AddInUtil.exe in this way has been documented in attacks, presenting a tangible risk if confirmed as malicious.

  ### Blind Spots and Assumptions

  This detection may miss legitimate usage of AddInUtil.exe that includes custom or specialized add-ins outside of the standardized paths. Adequate logging and monitoring configurations must be in place to capture these command-line executions reliably. Additionally, some organizations may employ custom scripts or procedures that might trigger this alert. A companion detection worth monitoring would be suspicious PowerShell activity (e.g., command execution logs or remote access telemetry) that may suggest broader compromising actions.

