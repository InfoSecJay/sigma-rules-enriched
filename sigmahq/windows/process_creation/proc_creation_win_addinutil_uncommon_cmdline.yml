title: Uncommon AddinUtil.EXE CommandLine Execution
id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
status: test
description: |
  Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with uncommon Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  selection_cli:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  filter_main_addinroot:
    CommandLine|contains:
    - '-AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of `AddInUtil.exe` with atypical command-line parameters pointing to non-standard `AddInRoot` or `PipelineRoot` paths. Such behavior is indicative of a potential adversary using this legitimate tool to run malicious add-ins or payloads, deviating from expected usage scenarios. The likely objective is to compromise the application framework through malicious Office add-ins, thereby facilitating lateral movement or data exfiltration.

  The relevant MITRE ATT&CK tactic and technique are Defense Evasion and T1218 (Signed Binary Proxy Execution). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If executed with malicious intent, this behavior can undermine system integrity and allow for further exploitation. It’s important to note that this detection does NOT confirm an intrusion on its own; legitimate applications may utilize `AddInUtil.exe` for benign purposes.

  ---

  ### Investigation Steps

  - **Assess process execution details:** Review Security Event ID 4688 logs for the execution of `AddInUtil.exe`. Check the `CommandLine` field for atypical paths, specifically looking for arguments that contain `-AddInRoot:` or `-PipelineRoot:` that do not align with expected directories.

  - **Identify known legitimate usage:** Confirm typical command-line executions of `AddInUtil.exe`, which commonly include paths such as `C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA`. Document any discrepancies from usual behavior for further analysis.

  - **Validate the context of execution:** Analyze the user account used for execution. If it was initiated by a standard user or a service account with limited privileges, document this. Evaluate whether the executing user had scheduled tasks or software installations that would justify such usage.

  - **Correlate with additional telemetry:** Examine Sysmon Event ID 1 logs for related events, paying particular attention to parent-child process relationships. Uncommon parent processes initiating `AddInUtil.exe` may indicate suspicious behavior that warrants deeper investigation.

  - **Look for artifacts of malicious use:** Search for any files or payloads created or modified during this execution, especially in the `%TEMP%` or application data folders. Validate that no unexpected scripts or executable files were generated concurrently.

  - **Cross-reference similar alerts:** Review for any alerts or detections related to the use of other LOLBins or similar tools reported recently, particularly focusing on patterns indicating broader exploitation techniques across the network.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the possibility of misuse of a legitimate utility. The likelihood of malicious activity is moderate, especially when combined with other factors such as non-standard file paths and unusual user accounts. Given that this method is weaponized by some adversaries, it is crucial to investigate promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases, as some users may legitimately need to invoke `AddInUtil.exe` with custom parameters. Ensure comprehensive logging configurations are enabled for both Sysmon and event logging to capture the necessary telemetry. Other benign applications could trigger similar behavior, which could lead to false positives. Monitoring related detection rules focusing on PowerShell execution or other applications manipulating Office add-ins can enhance overall security coverage.

