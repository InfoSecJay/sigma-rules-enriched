title: Uncommon AddinUtil.EXE CommandLine Execution
id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
status: test
description: |
  Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with uncommon Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  selection_cli:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  filter_main_addinroot:
    CommandLine|contains:
    - '-AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `AddInUtil.exe`, particularly focusing on command-line parameters that use uncommon paths for the AddInroot or Pipelineroot. Attackers may leverage this utility, which is often considered a "living-off-the-land" binary (LOLBin), to install malicious payloads or execute remote code. In this context, they might use paths that lead to adversary-controlled locations, masking their techniques by using a legitimate Windows utility.

  The likely threat scenario involves adversaries using `AddInUtil.exe` to manipulate the Add-in deployment cache to facilitate their malicious actions, such as executing payloads from non-standard locations. This behavior could fall under the MITRE ATT&CK framework tactics of **Defense Evasion** (TA0005) and the technique **Executable and DLL Search Order Hijacking** (T1218), highlighting the method of utilizing legitimate software to evade detection and achieve their objectives.

  Primary data sources for investigating this alert include process creation events from endpoint security tools (EDR) that capture command-line arguments, as well as alerts from SIEM platforms that can index Windows event logs.

  ### Investigation Steps
  - **Review Process Creation Logs:** Verify instances of `AddInUtil.exe` execution, paying particular attention to the command-line arguments used. Look for unusual or non-standard paths specified in the `-AddInRoot` and `-PipelineRoot` parameters.

  - **Analyze Source and Target Paths:** Assess the directories specified in the command-line arguments. Check if they lead to any known malicious locations or are associated with suspicious applications that could indicate a compromise.

  - **Inspect User Context of Executions:** Trace back the user accounts that triggered `AddInUtil.exe`. Determine if these accounts have the appropriate permissions and whether their behavior aligns with typical usage patterns.

  - **Correlation with Other Alerts:** Cross-reference any instances of `AddInUtil.exe` usage with other alerts in the environment, such as unexpected network connections or other process executions, to identify potential coordinated attack activity.

  ### Prioritization
  This alert has a medium severity due to the potential for malicious activity being masked within a legitimate process. The likelihood of occurrence is elevated in environments where users commonly utilize various Microsoft tools, creating a risk for exploitation by threat actors.

  ### Blind Spots and Assumptions
  This detection may miss other legitimate uses of `AddInUtil.exe`, especially if users invoke it from expected paths. The detection logic assumes that adversaries will not use the commonly known paths for `AddInRoot` and `PipelineRoot` parameters. Furthermore, the alert relies on complete coverage of process creation logs, which must be enabled and monitored accurately across all endpoints for effective detection.

