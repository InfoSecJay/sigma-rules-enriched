title: Uncommon AddinUtil.EXE CommandLine Execution
id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
status: test
description: |
  Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with uncommon Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  selection_cli:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  filter_main_addinroot:
    CommandLine|contains:
    - '-AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
    - '-PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the AddinUtil.exe utility with command-line arguments that include uncommon paths for AddInRoot or PipelineRoot. Typically, AddinUtil.exe is used for deploying Visual Studio Tools for Office add-ins; however, it can be exploited by adversaries to load malicious payloads from non-standard locations. The likely attacker objective here is to execute a payload on a compromised system under the guise of a legitimate process, leveraging the utility to bypass detection mechanisms. This behavior aligns with the **Defense Evasion** tactic, specifically the **Masquerading** technique (T1218). The primary telemetry source for this detection comes from Windows process creation logs, specifically focusing on **Event ID 4688** and **Sysmon Event ID 1**. If the execution is determined to be malicious, it may lead to the installation of persistent malware or data exfiltration. It is important to note that this detection alone does not confirm malicious activity without correlating evidence.

  ### Investigation Steps

  - **Examine the command line arguments:** Query Windows Security Event ID 4688. Look for command lines containing ‘-AddInRoot:’ and ‘-PipelineRoot:’. Review associated paths for known good locations versus uncommon or suspicious paths.

  - **Identify process parentage:** Use Sysmon Event ID 1 to trace the parent PID of AddinUtil.exe executions. Malicious instances may originate from unusual parent processes (e.g., those without a clear business context, such as cmd.exe or powershell.exe).

  - **Monitor for persisted artifacts:** Check for any files created or modified around the time of AddinUtil.exe execution. Look for unusual files located in or related to paths indicating user home directories or temp folders (e.g., `%TEMP%`).

  - **Review legitimate usage patterns:** Identify expected usage of AddinUtil.exe within your environment, usually involving VSTO deployments from standard locations. Compare against baseline authorization requirements for end-users who utilize Visual Studio add-ins.

  - **Correlate with other alerts:** If applicable, analyze for other defense evasion tactics or lateral movement alerts around the same timeframe. This could provide context to aggregate suspicious behavior.

  - **Assess asset criticality:** Evaluate the host’s role within the organization. If it is a critical asset (server, domain controller, etc.), prioritize further investigation due to the higher potential impact of observed activities.

  ### Prioritization

  This alert is of medium severity in an enterprise context, as the impacted systems may be critical to operations. While the activity could indicate malicious intent, it is not always weaponized in environments where AddinUtil.exe is legitimately used for software deployment. However, the likelihood of abuse increases in high-value targets.

  ### Blind Spots and Assumptions

  Detection limitations may arise from the legitimate execution of AddinUtil.exe in regular operational processes, which can mask malicious activity. Comprehensive logging of process creation events is essential for reliable detection. Additionally, benign activities can include standard VSTO installations. A companion detection that may strengthen coverage includes monitoring for suspicious command-line activity with PowerShell (T1059.001) as these are common methods to also deliver payloads.

