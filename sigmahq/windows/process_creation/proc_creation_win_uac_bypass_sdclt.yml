note: |
  ### Technical Context

  This Sigma rule detects the execution of `sdclt.exe` (the Windows Backup Program) at a high integrity level, which could signal an attempt to bypass User Account Control (UAC). An attacker may exploit `sdclt.exe` to elevate privileges by launching malicious payloads with administrative rights while evading detection protocols associated with more typical escalation behaviors. This detection is relevant to the MITRE ATT&CK framework under the tactic of Privilege Escalation, specifically Technique T1548.002 (Bypass User Account Control).

  Primary telemetry sources include process creation logs from Windows Event ID 4688 and Sysmon Event ID 1, which capture details on process execution, including the integrity level. If malicious, this activity could allow unauthorized access to critical system resources or data. Importantly, this alert does not confirm that a compromise has occurred on its own; it merely indicates a potentially suspicious execution of an application at high privilege.

  ### Investigation Steps

  - **Check process execution details: ** Review Windows Event ID 4688 for `sdclt.exe` executions. Look for fields such as `NewProcessName`, `UserName`, and `IntegrityLevel`. An integrity level of 'High' (S-1-16-12288) is abnormal for this process.

  - **Verify expected behavior:** Determine if `sdclt.exe` is being invoked legitimately. Check IT change logs or user agent activity around backup operations. Legitimate usage would typically execute without high integrity unless interacting with system-level backups.

  - **Search for common indicators of compromise:** Look for command line arguments associated with `sdclt.exe`, such as `/embed`, which may indicate misuse. Examine the `CommandLine` field in Event ID 4688 for suspicious parameters.

  - **Correlate with other telemetry:** Use Sysmon Event ID 1 to identify parent processes spawning `sdclt.exe`. Investigate any suspicious parent processes that have lower integrity levels, indicating possible abuse for privilege escalation.

  - **Identify known good processes:** Cross-reference execution timestamps of `sdclt.exe` with known good metrics or logs from system maintenance schedules. Any discrepancies may indicate malicious activity.

  - **Assess the environment:** Identify if the affected system is an admin workstation or sensitive server. Elevated privileges on sensitive systems pose a greater risk, warranting deeper investigation.

  ### Prioritization

  This alert warrants medium severity; while the impact could be significant if an attacker gains elevated privileges, such behavior may also originate from legitimate administrative tasks in high-privilege environments. However, given the historical use of UAC bypass techniques, careful triage is essential.

  ### Blind Spots and Assumptions

  Detection may miss legitimate applications or scripts utilizing `sdclt.exe` for valid configurations, which could lead to false positives. The effectiveness of this rule depends on the logging level configured; Security and Sysmon logs must be comprehensive. Additionally, an attacker could leverage other processes with similar attributes for UAC bypass, making it critical to monitor other high-risk processes for anomalous behavior to enhance detection.

