note: |
  ### Technical Context

  This Sigma rule detects instances where the Windows tool `sdclt.exe` (Windows Backup) is executed with elevated permissions (Integrity Level: High). This behavior may indicate an attempt by an attacker to bypass User Account Control (UAC), potentially allowing them to execute malicious actions with administrative privileges. The relevant MITRE ATT&CK tactic for this detection is Privilege Escalation, specifically the technique T1548.002, which relates to bypassing UAC protections.

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 from the Windows Security log. The security impact of this behavior is significant; if it is indeed a malicious action, it could lead to unauthorized control over the system. However, this detection does not confirm malicious intent on its own, as `sdclt.exe` can be legitimately invoked for normal backup operations.

  ### Investigation Steps

  - **Verify process creation details**: Check for Event ID 4688 in the Windows Security log. Look for the `New Process Name` field indicating `sdclt.exe`. Note the user context; a non-admin initiating this process could be suspicious.

  - **Assess integrity level**: Validate the `IntegrityLevel` in the Event log corresponding to `sdclt.exe`. Reports of 'High' or 'S-1-16-12288' integrity for non-administrative users should raise alarms.

  - **Correlate with user activity**: Investigate the user’s recent logon events (Event ID 4624) for any unusual activity that may suggest account compromise. Legitimate backups would typically be initiated by system accounts or users with specific backup permissions.

  - **Analyze command line arguments**: If available, review the command line used to execute `sdclt.exe` (via Sysmon Event ID 1). Look for suspicious flags or unexpected parameters, as legitimate use generally wouldn’t include uncommon switches.

  - **Identify associated parent processes**: Use Event ID 4688 to trace the parent process that spawned `sdclt.exe`. Malicious instances often originate from other scripts or executables that are indicative of a compromise, such as PowerShell or cmd.exe.

  - **Evaluate file artifacts and networking**: Search for any file creation events in associated directories (e.g., C:\Windows\System32) or unusual outbound connections that follow the execution of `sdclt.exe`, indicating potential data exfiltration.

  ### Prioritization

  This alert has medium severity due to the criticality of the affected system and the potential for privilege escalation. The likelihood of malicious abuse is moderate, as attackers frequently employ UAC bypass techniques, but not all instances of `sdclt.exe` execution are nefarious, thus requiring careful analysis.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is misconfigured and lacks details on parent processes or command line arguments. Adversaries may utilize legitimate applications like `sdclt.exe` for evasion. Furthermore, legitimate scheduled backups or administrative maintenance can trigger this alert. A related detection to strengthen coverage would be monitoring for abnormal `schtasks` executions or any unexpected changes to scheduled tasks that may relate to backup processes.

