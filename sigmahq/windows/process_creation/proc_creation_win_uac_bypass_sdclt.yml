  ---

  ### Technical Context

  This Sigma rule detects instances where the Windows process "sdclt.exe" is spawned with a high integrity level, potentially indicating a bypass of User Account Control (UAC). Attackers may utilize this behavior to escalate privileges and execute malicious payloads with elevated permissions. The relevant MITRE ATT&CK technique is "Bypass User Account Control" (T1548.002), which focuses on methods to execute code without standard user consent.

  The primary telemetry source for this detection is Windows process creation events, particularly Security Event ID 4688 and Sysmon Event ID 1, which log process creation along with various attributes including the executable path and integrity level. If this behavior is malicious, it could lead to unauthorized access or control over systems, allowing attackers to perform actions that bypass normal security constraints. However, it is important to note that this detection alone does not confirm malicious intent, as "sdclt.exe" can be legitimately invoked by system processes or authorized users.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 (Windows) and Sysmon Event ID 1 for instances of "sdclt.exe" being spawned. Look specifically for the integrity level field indicating "High" (value: S-1-16-12288).

  - **Verify parent process:** Identify the parent process that spawned "sdclt.exe" from the process creation logs. Legitimate usage often involves user-initiated actions from trusted applications (e.g., Control Panel or system maintenance tasks).

  - **Investigate user context:** Determine the user account executing "sdclt.exe." Analyze if it is a non-privileged user or a known administrative account. Suspicious executions by non-privileged users should be prioritized for further investigation.

  - **Cross-reference timestamps:** Correlate the execution timestamp of "sdclt.exe" with other security logs, such as abnormal logins or other suspicious process creations, to establish context for this activity.

  - **Inspect the command line:** If available, examine the command line used for the "sdclt.exe" execution via Sysmon Event ID 1 or relevant process logs. Check for unusual parameters or chained commands often seen in automation or attack scenarios.

  - **Verify file integrity:** Confirm the integrity of "sdclt.exe" by checking its digital signature and comparing it to the expected attributes for legitimate system files. The absence of a valid signature or modified file properties may indicate tampering.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of privilege escalation on sensitive systems, particularly if it involves critical assets such as domain controllers or financial systems. The likelihood of malicious abuse is significant, as UAC bypass techniques are common in targeted attacks. However, it's important to evaluate the context of the alert to determine its overall risk.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by variations in how "sdclt.exe" is invoked—attackers could utilize alternative methods to bypass UAC or use legitimate tools in an unauthorized manner. Required log sources include Sysmon, which must be correctly configured for comprehensive monitoring. Legitimate administrative tasks may trigger this alert, such as scheduled backups or system restore operations. A companion detection includes monitoring for abnormal command line parameters in process creation events linked to other UAC bypass tools, enhancing visibility into possible attack scenarios.

