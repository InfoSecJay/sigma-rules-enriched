title: AddinUtil.EXE Execution From Uncommon Directory
id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
status: test
description: Detects execution of the Add-In deployment cache updating utility 
  (AddInutil.exe) from a non-standard directory.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
modified: 2025-02-24
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  filter_main_legit_location:
    Image|contains:
    - ':\Windows\Microsoft.NET\Framework\'
    - ':\Windows\Microsoft.NET\Framework64\'
    - ':\Windows\Microsoft.NET\FrameworkArm\'
    - ':\Windows\Microsoft.NET\FrameworkArm64\'
    - ':\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `AddInUtil.exe` from non-standard directories, as this executable is typically housed within specific, legitimate system paths. The behavior indicates a potential misuse of a legitimate Windows utility often leveraged by attackers to execute commands stealthily while using "Living off the Land" (LOL) tactics. This is associated with the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Execution via Application Layer Protocol" (T1218).

  Primary telemetry sources include process creation logs (Windows Security Event ID 4688 and Sysmon Event ID 1), capturing command-line invocations and image paths. If malicious, the execution could lead to further exploitation, including the deployment of payloads or manipulation of system behaviors. This detection does NOT confirm that all instances of `AddInUtil.exe` execution are malicious; legitimate software updates or maintenance scripts may cause such activity.

  ### Investigation Steps

  - **Verify process creation details:** Review Security Event ID 4688 or Sysmon Event ID 1 for the image path of `AddInUtil.exe`. Assess if the path deviates from standard directories (e.g., `C:\Windows\Microsoft.NET\Framework`), noting any unusual or user-provided paths as potential malicious indicators.

  - **Inspect command-line arguments:** Evaluate the command line logged under Event ID 4688 for unusual flags or parameters that are not typically associated with `AddInUtil.exe`, which may indicate a misuse of the utility.

  - **Compare timestamp and context:** Check the execution timestamp against other changes or updates on the system to identify possible malicious contexts. Investigate activities around the same time frame for significant deviations from regular user behavior.

  - **Identify expected legitimate activity:** Monitor for normal execution of `AddInUtil.exe` that typically occurs during application updates or legitimate administrative tasks, ensuring such activity originates from standard file paths.

  - **Assess user account activity:** Cross-reference the user account triggering this execution against typical usage patterns. Any deviations, such as execution by a non-admin account late at night, could indicate malicious activity.

  - **Validate file integrity:** Check for the presence of `AddInUtil.exe` or its invocation in non-standard folders. Validate whether the file has been modified recently, indicating potential tampering or malicious execution.

  ### Prioritization

  Given the nature of `AddInUtil.exe`, this alert carries medium severity in an enterprise context. Systems executing from unexpected paths pose a reasonable risk for adversaries leveraging LOLBAS techniques to avoid detection. The behavior can often lead to malicious outcomes, however, benign uses exist which necessitate careful analysis.

  ### Blind Spots and Assumptions

  Detection may miss legitimate use cases where `AddInUtil.exe` is correctly executed from non-standard locations by internal automation tools. The reliability of detection requires comprehensive logging for process creation across all machines. Potential evasion tactics include modification of executable paths or renaming legitimate binaries. Related detections should include monitoring for unusual command-line activity associated with other LOLBAS entries, enhancing coverage against evasive techniques.

