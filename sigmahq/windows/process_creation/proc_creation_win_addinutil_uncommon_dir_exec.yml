title: AddinUtil.EXE Execution From Uncommon Directory
id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
status: test
description: Detects execution of the Add-In deployment cache updating utility (AddInutil.exe)
  from a non-standard directory.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
modified: 2025-02-24
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  filter_main_legit_location:
    Image|contains:
    - ':\Windows\Microsoft.NET\Framework\'
    - ':\Windows\Microsoft.NET\Framework64\'
    - ':\Windows\Microsoft.NET\FrameworkArm\'
    - ':\Windows\Microsoft.NET\FrameworkArm64\'
    - ':\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the AddInUtil.exe utility from a non-standard directory. Attackers may leverage this tool to facilitate malicious actions, such as deploying payloads or further evading detection by utilizing legitimate system binaries in unexpected locations. The relevant MITRE ATT&CK tactic is **Defense Evasion**, specifically the technique **Use of Valid Accounts (T1078)** and **Signed Binary Proxy Execution (T1218)**.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation events. If malicious, this behavior may enable unauthorized access or persistence on the system. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate applications may also trigger this rule.

  ---

  ### Investigation Steps

  - **Review the process creation logs:** Check Security Event ID 4688 for instances of AddInUtil.exe execution. Review the `Image` field to ensure it shows a complete path indicating the execution from an uncommon directory.

  - **Validate the directory from which AddInUtil.exe was executed:** Investigate the path referenced in the `Image` field. Compare it against legitimate locations (`C:\Windows\Microsoft.NET\...`) to identify malicious execution from unusual or non-standard paths.

  - **Analyze associated parent process:** In Event ID 4688, look for the `ParentImage` field to identify the process that initiated AddInUtil.exe. If the parent process is benign, such as a known application or service, document this for contextual understanding.

  - **Check for unusual command line arguments:** Review the `CommandLine` field for the AddInUtil.exe execution. Legitimate usage typically has no or minimal arguments. Presence of obfuscation techniques or suspicious arguments may indicate malicious intent.

  - **Correlate with known malicious indicators:** Cross-reference the execution with threat intelligence databases to identify if the path or use of AddInUtil.exe has been reported in connection with malware or offensive toolkits.

  - **Assess host role and asset criticality:** Identify if the host is critical to organizational operations or houses sensitive data. Prioritize investigations based on asset importance, focusing on systems that are more likely to be targeted by adversaries.

  ---

  ### Prioritization

  This alert has a medium severity based on the likelihood of abuse, as AddInUtil.exe is a legitimate Windows binary often exploited by adversaries for malicious activities. The impact is contingent upon the criticality of the system where it is executed, particularly if it resides on endpoints involved in sensitive operations.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include moving AddInUtil.exe to uncommon directories to bypass detection, as well as renaming or altering its execution context. Reliable detection requires correct configuration and retention of Windows process creation logs. Legitimate activities that may trigger the alert include legitimate software updates by system administrators or automated scripts. Related detections such as unusual PowerShell activity (e.g. T1059.001 - Command and Scripting Interpreter: PowerShell) can enhance overall security posture by providing more context around the behavior.

