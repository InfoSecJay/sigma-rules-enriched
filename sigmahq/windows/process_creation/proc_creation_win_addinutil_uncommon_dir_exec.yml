title: AddinUtil.EXE Execution From Uncommon Directory
id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
status: test
description: Detects execution of the Add-In deployment cache updating utility (AddInutil.exe)
  from a non-standard directory.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
modified: 2025-02-24
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  filter_main_legit_location:
    Image|contains:
    - ':\Windows\Microsoft.NET\Framework\'
    - ':\Windows\Microsoft.NET\Framework64\'
    - ':\Windows\Microsoft.NET\FrameworkArm\'
    - ':\Windows\Microsoft.NET\FrameworkArm64\'
    - ':\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of `AddInUtil.exe`, a legitimate utility used for updating add-in deployment caches, from atypical directories on Windows systems. Attackers may leverage this tool to evade detection, as it is not commonly associated with malicious activity. The execution of `AddInUtil.exe` from an uncommon location could signify an attempt to manipulate Office add-ins or execute unwanted commands without raising alarms on security systems.

  In the context of the MITRE ATT&CK framework, this detection relates to the tactic of **Defense Evasion** (ID: TA0005), particularly leveraging **Masquerading** (ID: T1036) techniques, where a legitimate tool is executed from a non-standard path to deceive security monitoring. The primary sources of evidence for this detection will be **process creation events** that log executable paths, as these logs capture when binary files like `AddInUtil.exe` are run and from where.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze recent process creation logs to identify instances of `AddInUtil.exe` running from directories that are not the expected Microsoft locations. Look for execution paths that deviate from the established normal baseline.

  - **Correlate with User Activity:** Investigate the user accounts that executed the command. Check if these accounts have any history of suspicious activities or unusual privilege levels that may warrant deeper inspection.

  - **Check for Command-Line Arguments:** Analyze the command-line arguments used during the execution of `AddInUtil.exe`. Note any suspicious flags or parameters that could indicate nefarious intent, especially those impacting Office applications or external connectivity.

  - **Investigate Parent Process Relationships:** Examine the parent processes that initiated `AddInUtil.exe` executions. Look for any anomalous parent processes that could indicate a potential compromise or a staging behavior for later attacks.

  ### Prioritization
  This alert is rated as medium severity because while the execution of `AddInUtil.exe` from uncommon locations could indicate malicious activity, it can also result from legitimate use cases that require investigation to confirm intent. Distinguishing between benign and malicious use in enterprise environments is critical for effective response.

  ### Blind Spots and Assumptions
  The detection may not capture scenarios where the tool is executed from the legitimate directories or through obfuscated paths that do not match `AddInUtil.exe`. Furthermore, the rule assumes that process creation events are being logged and that no endpoint protection mechanisms are suppressing the logs. It also presumes that no other legitimate applications are using `AddInUtil.exe` in non-standard areas, which could lead to false positives without proper context and investigation.

