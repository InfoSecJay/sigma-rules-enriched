title: AddinUtil.EXE Execution From Uncommon Directory
id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
status: test
description: Detects execution of the Add-In deployment cache updating utility 
  (AddInutil.exe) from a non-standard directory.
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
date: 2023-09-18
modified: 2025-02-24
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\addinutil.exe'
  - OriginalFileName: 'AddInUtil.exe'
  filter_main_legit_location:
    Image|contains:
    - ':\Windows\Microsoft.NET\Framework\'
    - ':\Windows\Microsoft.NET\Framework64\'
    - ':\Windows\Microsoft.NET\FrameworkArm\'
    - ':\Windows\Microsoft.NET\FrameworkArm64\'
    - ':\Windows\WinSxS\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of AddInUtil.exe, a legitimate Microsoft utility for updating add-in deployment caches, when it runs from an uncommon directory. Attackers may exploit this executable (often referred to as a "living off the land" binary) to perform malicious activities while avoiding detection. The likely attacker objective could involve maintaining persistence or modifying application settings post-compromise.

  The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1218) as the behavior aims to blend into legitimate processes. Primary telemetry sources include Windows Security Event ID 4688, indicating process creation, alongside Sysmon Event ID 1 for detailed process information, including the image name and its path. If this activity is malicious, it poses a risk of system compromise and lateral movement within the network. Importantly, this detection does NOT confirm that the execution is malicious by itself; further investigation into context and additional logs is necessary.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances of AddInUtil.exe being executed. Validate the execution path; if it appears in common paths like `C:\Windows\Microsoft.NET\Framework\`, classify as benign.

  - **Review Sysmon logs**: Examine Sysmon Event ID 1 for additional context about the process execution, including parent process information and command-line arguments. Malicious instances may have suspicious parent processes or unusual arguments.

  - **Investigate command-line usage:** Look for command-line arguments associated with the AddInUtil.exe instance in Event ID 4688 or Sysmon Event ID 1. Legitimate arguments will typically not include unusual parameters or flags implying modifications.

  - **Identify abnormal directories:** Note the execution path of AddInUtil.exe. Malicious executions from directories like user profiles or temporary folders (e.g., `C:\Users\Public\` or `C:\Temp\`) should be flagged for further investigation.

  - **Check for persistence mechanisms:** Monitor for additional artifacts related to this behavior, such as registry modifications (e.g., HKCU or HKLM\...\Run keys), indicative of efforts to persist or establish malware behavior on the system.

  ### Prioritization

  This alert has medium severity due to potential impacts on compromised systems, particularly if AddInUtil.exe is employed as a vector for persistence or configuration changes. The likelihood of malicious abuse is moderate, given its use in many legitimate scenarios but is weaponized by attackers looking to evade detection using built-in Windows utilities.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate business processes that invoke AddInUtil.exe from non-standard paths due to custom software or unusual configurations. Reliable detection requires proper logging settings for Windows Security and Sysmon, particularly ensuring that Execution Output Logging is configured. A related detection to consider is unauthorized execution of other living-off-the-land binaries, which can provide broader coverage of attempts to bypass traditional security measures.

