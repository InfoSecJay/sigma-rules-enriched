title: Whoami.EXE Execution Anomaly
id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
status: test
description: Detects the execution of whoami.exe with suspicious parent processes.
references:
- https://brica.de/alerts/alert/public/1247926/agent-tesla-keylogger-delivered-inside-a-power-iso-daa-archive/
- https://app.any.run/tasks/7eaba74e-c1ea-400f-9c17-5e30eee89906/
- https://www.youtube.com/watch?v=DsJ9ByX84o4&t=6s
author: Florian Roth (Nextron Systems)
date: 2021-08-12
modified: 2025-03-06
tags:
- attack.discovery
- attack.t1033
- car.2016-03-001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  filter_main_known_parents:
        # This list can be any legitimate shell or application that you expect whoami to run from
    ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  filter_optional_ms_monitoring_agent:
    ParentImage|endswith: ':\Program Files\Microsoft Monitoring Agent\Agent\MonitoringHost.exe'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - ''
    - '-'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
- Monitoring activity
level: medium
note: |
  ### Technical Context
  This rule detects the execution of the `whoami.exe` utility when triggered by suspicious parent processes not typically associated with its legitimate use. `whoami.exe` is a command-line tool that displays the current user's identity and is often exploited by attackers to gather information about their environment after gaining access. The execution of this command under an atypical parent can indicate reconnaissance activities by adversaries, particularly as they seek to establish their presence within a compromised system.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) as it encompasses techniques that aim to gather information about systems and networks. In particular, Technique T1033 (System Owner/User Discovery) applies here since an attacker may use `whoami.exe` to identify the current user account, potentially leading to further exploits. Primary telemetry sources for this detection include **process creation logs**, which monitor execution context for applications on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation events that captured the execution of `whoami.exe`, paying close attention to the associated parent process IDs and their paths to determine if they are typically considered benign.

  - **Identify Unusual Parent Processes**: Investigate the parent processes that initiated `whoami.exe`. Look for anomalies, such as low-reputation applications or scripts not commonly associated with standard administrative tasks.

  - **Correlate User Context**: Cross-reference the user account executing the `whoami.exe` command with user behavior analytics to identify any suspicious account activity or unauthorized access that may indicate a compromised environment.

  - **Document Anomalous Behavior**: If unusual execution patterns are detected, document the findings and escalate them for further investigation, including possible tracking of lateral movements or malicious intentions.

  ### Prioritization
  This alert carries a medium severity rating due to the potential risk associated with unauthorized reconnaissance activities. If confirmed, the execution of `whoami.exe` could indicate initial stages of lateral movement or an attacker's footprint within the network.

  ### Blind Spots and Assumptions
  Gaps in detection coverage include scenarios where legitimate administrative scripts or functions unintentionally trigger the rule, which may lead to false positives. The detection logic assumes that `whoami.exe` will not be executed under common administrative processes and requires complete and accurate process creation logs to function. It may not detect stealth techniques or if the command is executed in a non-standard manner (e.g., through obfuscation or scripting). Additionally, environments heavily utilizing PowerShell or other automation frameworks may not be fully captured by this rule.

