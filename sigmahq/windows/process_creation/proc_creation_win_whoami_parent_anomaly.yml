title: Whoami.EXE Execution Anomaly
id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
status: test
description: Detects the execution of whoami.exe with suspicious parent 
  processes.
references:
- https://brica.de/alerts/alert/public/1247926/agent-tesla-keylogger-delivered-inside-a-power-iso-daa-archive/
- https://app.any.run/tasks/7eaba74e-c1ea-400f-9c17-5e30eee89906/
- https://www.youtube.com/watch?v=DsJ9ByX84o4&t=6s
author: Florian Roth (Nextron Systems)
date: 2021-08-12
modified: 2025-03-06
tags:
- attack.discovery
- attack.t1033
- car.2016-03-001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  filter_main_known_parents:
        # This list can be any legitimate shell or application that you expect whoami to run from
    ParentImage|endswith:
    - '\cmd.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  filter_optional_ms_monitoring_agent:
    ParentImage|endswith: ':\Program Files\Microsoft Monitoring Agent\Agent\MonitoringHost.exe'
  filter_main_parent_null:
    ParentImage:
  filter_main_parent_empty:
    ParentImage:
    - ''
    - '-'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
- Monitoring activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects executed instances of `whoami.exe` that are launched with unexpected parent processes, indicating potential misuse. A likely attacker objective could be the reconnaissance of user privileges or environment context in preparation for further exploitation. The relevant MITRE ATT&CK tactic is "Discovery" (ID: TA0007), specifically technique "Account Discovery" (ID: T1033).

  Primary telemetry sources include Windows process creation logs, specifically relevant fields from Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, the execution of `whoami.exe` in this context may facilitate adversarial actions such as privilege escalation or lateral movement. This detection does NOT confirm malicious activity on its own; legitimate administrative actions or scripts may also generate similar behavior.

  ### Investigation Steps

  - **Check process lineage:** Review the parent process of the `whoami.exe` execution using Windows Security Event ID 4688. Malicious patterns may involve execution from uncommon sources such as browsers or unusual scripts, unlike normal execution from cmd.exe or PowerShell.

  - **Correlate with user context:** Identify the user account associated with the execution. If the account has low or no privileges and attempts to execute `whoami.exe`, this raises suspicion for potential exploitation.

  - **Review for known benign contexts:** Validate that `whoami.exe` is triggered from expected administrative processes (cmd.exe or PowerShell). Legitimate administrative tasks will typically show no unusual behavior in the preceding commands.

  - **Examine command line arguments:** Check if any unusual command line parameters are passed with `whoami.exe` (e.g., arguments that request elevated detail or information about remote systems). This can be identified in the CommandLine field of the Sysmon Event ID 1.

  - **Scan for recent changes in environment:** Look into recent changes in user roles, group memberships, or permissions that may indicate a legitimate need for account discovery. This is important to discern potential abuse from regular audit activities.

  ### Prioritization

  The severity of this alert is medium, as it identifies potential reconnaissance behavior that can lead to further exploitation if acted upon by a malicious actor. The likelihood of malicious use is moderate, though it is often overshadowed by the frequency of legitimate administrative usage in environments where `whoami.exe` is commonly employed for system checks.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers running `whoami.exe` through legitimate administrative shells or obfuscating their execution context to mislead analysis. Reliable detection requires adequate logging configurations, specifically enabling process creation logs for Windows Security and Sysmon. Legitimate activities such as administrative scripts or authorized monitoring tools may also result in alerts. A companion detection to strengthen coverage could be monitoring for other suspicious command-line executions following `whoami.exe`, such as subsequent attempts to access sensitive files or network resources.

