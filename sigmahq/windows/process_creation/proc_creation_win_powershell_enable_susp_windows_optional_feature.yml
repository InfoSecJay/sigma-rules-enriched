title: Potential Suspicious Windows Feature Enabled - ProcCreation
id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
related:
- id: 55c925c1-7195-426b-a136-a9396800e29b
  type: similar
status: test
description: |
  Detects usage of the built-in PowerShell cmdlet "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
- https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
- https://learn.microsoft.com/en-us/windows/wsl/install-on-server
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-29
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    CommandLine|contains|all:
    - 'Enable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any insecure/unusual windows features that you don't use in your environment
    CommandLine|contains:
    - 'TelnetServer'
    - 'Internet-Explorer-Optional-amd64'
    - 'TFTP'
    - 'SMB1Protocol'
    - 'Client-ProjFS'
    - 'Microsoft-Windows-Subsystem-Linux'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the features listed in the rule.
level: medium
note: |
  ### Technical Context
  This rule detects the use of the PowerShell cmdlet `Enable-WindowsOptionalFeature`, which allows users to enable specific Windows features. The cmdlet can be legitimate when used by administrators to configure systems, but it could also be exploited by attackers to enable features that assist in evasion or lateral movement, such as enabling legacy protocols or unwanted subsystems. The primary threat scenario involves an adversary with sufficient privileges attempting to manipulate the Windows environment to facilitate further attacks, potentially using features that may not be authorized in a secure enterprise setting.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1562), where an adversary might attempt to bypass detection mechanisms or use built-in tools to modify the operating system behavior for their advantage. Techniques of concern include **Enable Windows Optional Feature** (T1562.001) associated with the misuse of PowerShell commands to change system properties beyond their intended use.

  Primary data sources for this rule include **process creation logs** from the Windows Event Log, which detail command-line arguments used when processes are initiated. This data is critical to identifying suspicious usage of administrative tools that might be indicative of malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows Event Logs (Event ID 4688) to find instances of the `Enable-WindowsOptionalFeature` cmdlet being executed. Pay attention to the specific features being enabled, particularly those that are not standard for your environment.

  - **Assess Command-Line Arguments:** Look for command-line parameters being passed with the `Enable-WindowsOptionalFeature` command. Identify any suspicious feature names that may not be traditionally used in your organization, such as `TelnetServer` or `SMB1Protocol`.

  - **Correlate User Activity:** Investigate the user context under which the command was executed. Verify whether the action was taken by known administrative users or if it originated from anomalous accounts that could indicate a compromised host.

  - **Review Security Policies:** Ensure that security policies prevent the enabling of unwanted features or subsystems as part of your organization's baseline security configuration, limiting attack vectors available to potential adversaries.

  ### Prioritization
  The severity of this alert is medium, as the detection of suspicious feature enabling can indicate an ongoing attack or a misconfiguration. While legitimate administrative activities could trigger this alert, the presence of certain features being enabled without proper justification poses a risk to system integrity and security.

  ### Blind Spots and Assumptions
  There are potential gaps regarding detection coverage for scenarios in which the `Enable-WindowsOptionalFeature` cmdlet is invoked in a legitimate context by authorized administrators. This alert assumes that all enabled features are documented and approved within the enterprise. Additionally, required logs from the Windows Event Log must be configured and retained to ensure that process creation events are captured effectively; without these logs, detection capabilities may be limited.

