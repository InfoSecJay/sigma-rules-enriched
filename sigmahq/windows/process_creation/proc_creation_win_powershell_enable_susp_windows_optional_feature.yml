title: Potential Suspicious Windows Feature Enabled - ProcCreation
id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
related:
- id: 55c925c1-7195-426b-a136-a9396800e29b
  type: similar
status: test
description: |
  Detects usage of the built-in PowerShell cmdlet "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
- https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
- https://learn.microsoft.com/en-us/windows/wsl/install-on-server
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-29
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    CommandLine|contains|all:
    - 'Enable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any insecure/unusual windows features that you don't use in your environment
    CommandLine|contains:
    - 'TelnetServer'
    - 'Internet-Explorer-Optional-amd64'
    - 'TFTP'
    - 'SMB1Protocol'
    - 'Client-ProjFS'
    - 'Microsoft-Windows-Subsystem-Linux'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the features listed in the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the PowerShell cmdlet `Enable-WindowsOptionalFeature` with specific feature names typically associated with potential security risks, such as legacy protocols and services that could be exploited by attackers. The likely attacker objective is to enable deprecated or vulnerable features on Windows systems to facilitate lateral movement, persistence, or exploitability of security weaknesses.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and techniques such as **Indicator Removal on Host** (T1070) and **Modify System Image** (T1601). Primary telemetry sources include Windows process creation logs and PowerShell logs, specifically the fields related to the `CommandLine` arguments used. If malicious, the enabling of these features could expose the system to various attacks. It’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can trigger it.

  ### Investigation Steps

  - **Review process creation logs for the PowerShell command:** Check Event ID 4688 or Sysmon Event ID 1 for instances of `Enable-WindowsOptionalFeature` being executed. Look for the full command line in the `CommandLine` field. This command can indicate potential malicious activity if used on unauthorized systems.

  - **Validate specific feature names being enabled:** Cross-reference the command execution with known benign features in your environment. If `TelnetServer`, `Internet-Explorer-Optional-amd64`, or `SMB1Protocol` is present in the command line, assess the appropriateness of enabling these features as these are generally unnecessary and insecure.

  - **Identify the context of execution:** Determine which user executed the command by analyzing the `UserName` field in the process creation logs. A non-admin user executing these commands may indicate suspicious behavior, while a legitimate admin performing regular maintenance might be benign.

  - **Check for concurrent suspicious activities:** Investigate other processes that ran around the same time, especially those that could have leveraged the newly enabled features, such as network connections related to `telnet` or `SMB`. Review Event ID 5156 in Windows Firewall logs as an adjunct step.

  - **Document legitimate organizational contexts:** Gather evidence from IT or operations teams regarding expected usage of the detected features to establish normal baseline activity. Use this information to differentiate between benign and malicious uses of the command.

  - **Assess asset criticality:** Consider the role of the system in your environment (e.g., production, test, or development) and the sensitivity of data it handles. Systems in a production environment enabling insecure features represent higher risk than testing environments.

  ### Prioritization

  This alert is of medium severity as enabling high-risk features on critical systems increases the likelihood of successful exploitation by adversaries. The potential for malicious abuse is elevated when these features are activated by unauthorized personnel or on sensitive systems. The common weaponization of deprecated protocols like SMB1 enhances the urgency of review.

  ### Blind Spots and Assumptions

  Detection is limited by the absence of comprehensive auditing of PowerShell execution, particularly if logging settings are misconfigured. There may be legitimate scenarios, such as systems administration or application deployment, that trigger this alert. Companions detections like those for unusual network traffic (e.g., SMB or Telnet activity) can provide additional context to strengthen coverage against potential exploitation following this behavior.

