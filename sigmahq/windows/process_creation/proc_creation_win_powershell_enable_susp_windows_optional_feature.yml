title: Potential Suspicious Windows Feature Enabled - ProcCreation
id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
related:
- id: 55c925c1-7195-426b-a136-a9396800e29b
  type: similar
status: test
description: |
  Detects usage of the built-in PowerShell cmdlet "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and Management tool.
  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images
references:
- https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
- https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
- https://learn.microsoft.com/en-us/windows/wsl/install-on-server
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-29
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    CommandLine|contains|all:
    - 'Enable-WindowsOptionalFeature'
    - '-Online'
    - '-FeatureName'
  selection_feature:
        # Add any insecure/unusual windows features that you don't use in your environment
    CommandLine|contains:
    - 'TelnetServer'
    - 'Internet-Explorer-Optional-amd64'
    - 'TFTP'
    - 'SMB1Protocol'
    - 'Client-ProjFS'
    - 'Microsoft-Windows-Subsystem-Linux'
  condition: all of selection_*
falsepositives:
- Legitimate usage of the features listed in the rule.
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the PowerShell cmdlet `Enable-WindowsOptionalFeature`, which is often used to configure Windows features, including potentially insecure features like Telnet or SMBv1. Attackers may utilize this cmdlet to enable unwanted features that can create backdoors or weaken system security as part of their lateral movement tactics. This behavior aligns with MITRE ATT&CK technique "T1491: Kernel Object Manipulation".

  The primary telemetry sources include Windows Security logs (Event ID 4688 for process creation) and PowerShell logs documenting command execution. If exploited, enabling certain features could lead to unauthorized access or disclosure of sensitive information. This detection does NOT confirm the malicious intent; legitimate administrative actions could trigger this alert.

  ### Investigation Steps

  - **Review execution context: Investigate Event ID 4688** for the process creation of the PowerShell cmdlet. Look for the specific command line: `Enable-WindowsOptionalFeature -Online -FeatureName <feature>`. Ensure the user context is appropriate for your environment.

  - **Correlate with PowerShell logs** to examine additional command activity. Focus on command IDs that include `Enable-WindowsOptionalFeature`. Look for patterns typical in malware, such as unusual feature names or excessive feature modifications.

  - **Identify known legitimate uses** of Windows features in your organization. Document legitimate use cases, like enabling WSL, and compare against recent alerting events to assess whether the employed feature is common in your environment.

  - **Check for signs of malicious intent** by reviewing the CommandLine for suspicious or insecure feature names like 'TelnetServer' or 'SMB1Protocol'. Any recent commands executing these features could indicate a security risk.

  - **Validate file creation or modification artifacts** by checking the directory for file changes associated with the enabled features. For example, searching for logs or binaries under the Windows feature directories that correspond with the feature name in the command line.

  ### Prioritization

  The alert severity is medium, primarily due to the potential security implications on critical systems that could be exploited via insecure features. The likelihood of malicious abuse exists, especially if attackers seek to establish persistence or facilitate further attacks. While this usage is not typically weaponized, its context within a larger attack can increase urgency.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete logging configurations; specifically, if PowerShell script block logging is not enabled, some commands may evade detection. Legitimate administrative activity, such as server maintenance or feature testing, could also trigger this alert. A related detection includes monitoring for subsequent abnormal network connections or processes stemming from any enabled features, providing broader coverage of potential exploit paths.

