note: |
  ### Technical Context

  This rule detects the use of the `findstr` or `find.exe` processes to identify and execute `.lnk` files, which are commonly used in HHS redirect attacks to spread malware. The likely attacker objective is to execute potentially malicious payloads linked through shortcut files, taking advantage of benign-looking command-line tools to obfuscate their actions. This behavior aligns with the MITRE ATT&CK techniques for Obfuscated Files or Information (T1027.003) and Execution through Command and Scripting Interpreter (T1202).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, such behavior could lead to unauthorized command execution and the subsequent compromise of the system. It is important to note that this detection does NOT confirm an actual compromise; it only indicates the execution of a command that may warrant further investigation.

  ### Investigation Steps

  - **Review the process creation events**: Check Security Event ID 4688 or Sysmon Event ID 1 for the `findstr.exe` or `find.exe` processes launched. Look for unusual parent processes or command lines that include ".lnk" files, as these could indicate malicious intent.

  - **Analyze the command line arguments**: Examine the `CommandLine` field in the process creation logs. Legitimate uses of `findstr` typically involve searching text, and command lines ending with `.lnk` should be investigated for context, as they often indicate potentially malicious behavior.

  - **Correlate with endpoint security alerts**: Look for additional alerts from endpoint detection and response solutions related to the execution of malicious software around the time of the event. Cross-reference with known indicators of compromise (IoCs) linked to malware distribution.

  - **Validate legitimate activity**: Identify any known usage of `.lnk` files in your environment. Check if any scripts or applications that use shortcut files trigger the rule. Documenting expected behaviors can help clarify whether the activity is benign.

  - **Identify high-confidence malicious indicators**: Look for previously identified malicious `.lnk` file samples in your environment or on systems where this alert triggered. Investigate known threat actor tactics that commonly exploit `.lnk` files to execute malware.

  - **Check for lateral movement indicators**: Review logs for any attempts to execute `.lnk` files across multiple machines, particularly if the originating system is critical or has elevated permissions, as this could signify a larger compromise.

  ### Prioritization

  This alert is of medium severity as it indicates potential misuse of a native Windows feature to execute commands via `.lnk` files. The likelihood of misuse is moderate, especially given the targeted nature of attacks that exploit such vectors, particularly in an environment where users might be tricked into clicking malicious shortcuts.

  ### Blind Spots and Assumptions

  Detection may be limited by users running legitimate `findstr` commands as part of normal operational tasks, potentially leading to false positives. Proper logging configurations must be in place to capture all relevant process creation events. Additionally, tools that aggregate command-line execution logs can assist in correlating this behavior with lateral movement indicators. A related detection that can enhance coverage is monitoring for the creation or modification of `.lnk` files in sensitive directories, which can pair well with this alert.

