note: |
  ### Technical Context
  This rule detects the execution of `.lnk` (Windows shortcut) files using the `findstr` or `find` command-line utilities. This behavior is associated with the HHS redirect attack, where attackers utilize seemingly benign utilities to execute malicious shortcuts that may lead to further exploitation of the system or network. The primary objective of such attacks is typically to obfuscate malicious actions and establish initial access or persistence within a targeted environment.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), as these techniques are designed to bypass security mechanisms, and the following techniques:
  - **T1036: Masquerading** - when attackers mimic legitimate processes or commands.
  - **T1202: Indirect Command Execution** - using scripts or command line arguments to execute commands through a different method.
  - **T1027.003: Obfuscated Files or Information** - leveraging file shortcuts to obscure their true nature or intent.

  The primary data sources for detection include Windows process creation events that log the execution of commands alongside their parameters, such as command-line arguments for utilities like `findstr` and `find`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `findstr.exe` or `find.exe` being invoked, focusing on their associated command-line arguments, particularly those ending in `.lnk`.
  - **Correlate Command Usage:** Determine if the detected command promotes any suspicious behaviors, such as unusual file paths or the presence of known malicious `.lnk` files.
  - **Inspect File Behavior:** Evaluate the properties and execution context of the `.lnk` files. Check for any unusual associations, target paths, or indicators of malicious activity.
  - **Monitor Network Activity:** If applicable, observe network connections initiated by processes linked to the shortcut execution, looking for anomalies such as connections to known malicious servers or unexpected outbound traffic.

  ### Prioritization
  This alert should be treated with medium severity due to the potential for exploitation originating from seemingly benign commands. Given the tactic's effectiveness in bypassing security controls, timely investigation can prevent lateral movement and data compromise.

  ### Blind Spots and Assumptions
  Detection will be limited if command-line logging is not enabled or if process creation events are not thoroughly monitored. Additionally, there is an assumption that the `.lnk` files processed by `findstr` or `find` are not legitimate or required for normal operations within the organization. Enabling detailed logging for process creation events is crucial for accurate detection of these activities.

