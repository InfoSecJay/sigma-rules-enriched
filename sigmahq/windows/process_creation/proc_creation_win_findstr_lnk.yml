note: |
  ### Technical Context

  This rule detects the use of `findstr` to launch a `.lnk` file, which is atypical for legitimate processes and indicates potential malicious activity tied to the HHS redirect attack, wherein attackers use misleading shortcuts for malware delivery. The likely attacker objective is to execute a malicious payload indirectly through a scriptable command that bypasses some security controls. This behavior primarily corresponds to MITRE ATT&CK techniques: **T1036 – Masquerading** and **T1202 – Indirect Command Execution**.

  The primary telemetry source is process creation logs from Windows environments, specifically focusing on Event ID 4688. If the behavior is malicious, the impact could range from system compromise to unauthorized data access and exfiltration. It is important to note that this detection does NOT confirm that the `.lnk` file is inherently malicious, as there might be legitimate usages of such command combinations.

  ### Investigation Steps

  - **Review process creation logs**: Examine Security Event ID 4688 for process creation involving `findstr.exe` or `find.exe`, focusing on CommandLine details. Look for entries using `.lnk` file extensions. Benign usage will often include common tools or scripts not related to malware execution.

  - **Analyze the command line arguments**: Check for unusual patterns or arguments in the command line. Malicious variants may include obfuscated or unexpected parameters following `.lnk`, indicating potential attempts to evade detection.

  - **Correlate with recent alerts**: Identify and review other logged events or alerts that occurred around the same timeframe (e.g., lateral movement or suspicious PowerShell activity). Monitor for signs of exploitation or abnormal user behavior in User ID fields.

  - **Identify legitimate activities**: Cross-reference typical usage scenarios for `findstr` in your environment that could account for this activity, particularly automated scripts or scheduled tasks invoking `.lnk` files for legitimate purposes.

  - **Check for known malicious indicators**: Research the specific `.lnk` files being executed for any that have been flagged or reported in threat intelligence feeds. Confirm if any previously known malicious hashes or similar characteristics apply.

  - **Verify file creation events**: Investigate the creation or modification of potentially associated `.lnk` files, using Sysmon logs (Event ID  creation timestamps) to establish if these were produced in a legitimate context or as a part of malware deployment.

  ### Prioritization

  The alert severity is medium due to the exploitative nature of the technique, which can lead to significant impacts if it results in malware execution, especially as this technique has been weaponized in various campaigns. The likelihood of abuse is heightened, given the context of the HHS redirect attack and the use of `.lnk` files to deliver payloads.

  ### Blind Spots and Assumptions

  Detection may miss variations in command line syntax or alternate tools used instead of `findstr.exe`, as attackers can easily switch to other methods for executing `.lnk` files. Full coverage requires ensuring appropriate logging configurations for process creation events are enabled across all endpoints. Legitimate development or administrative activities could sometimes generate similar alerts, particularly during the use of automation scripts. A related detection rule focusing on `.lnk` file preparation could enhance coverage on this potential attack vector.

