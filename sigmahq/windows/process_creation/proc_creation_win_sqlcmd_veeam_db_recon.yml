title: Veeam Backup Database Suspicious Query
id: 696bfb54-227e-4602-ac5b-30d9d2053312
status: test
description: Detects potentially suspicious SQL queries using SQLCmd targeting the
  Veeam backup databases in order to steal information.
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-04
tags:
- attack.collection
- attack.t1005
logsource:
  category: process_creation
  product: windows
detection:
  selection_sql:
    Image|endswith: '\sqlcmd.exe'
    CommandLine|contains|all:
    - 'VeeamBackup'
    - 'From '
  selection_db:
    CommandLine|contains:
    - 'BackupRepositories'
    - 'Backups'
    - 'Credentials'
    - 'HostCreds'
    - 'SmbFileShares'
    - 'Ssh_creds'
    - 'VSphereInfo'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potentially suspicious SQL queries made with SQLCmd targeting Veeam backup databases. The activity may indicate attempts by an attacker to extract sensitive information from backup repositories, potentially aiming to exfiltrate credentials, backups, or exploitable data. The focus on SQL queries related to Veeam systems suggests a threat actor may be specifically targeting backups to disrupt business operations or facilitate unauthorized data access.

  The relevant MITRE ATT&CK techniques applicable to this scenario include **Collection (T1005)**, which involves the aggregation of sensitive information from enterprise assets. Attackers may leverage this technique to harvest credentials and sensitive data stored within Veeam backups, increasing their ability to pivot and manipulate the infrastructure. The primary data sources for detecting such activities will come from process creation events, particularly focusing on SQL command executions and the associated parameters passed during those executions.

  ### Investigation Steps
  - **Review Process Creation Events**: Check for instances of `sqlcmd.exe` execution, and note the full command lines for context on the operation being performed. Pay special attention to commands that include keywords like “VeeamBackup,” “BackupRepositories,” and “Credentials.”

  - **Analyze SQL Query Logs**: If available, inspect SQL query logs to identify the exact SQL commands executed. Look for unusual patterns that might indicate data extraction or manipulation efforts targeting backup databases.

  - **Investigate User Account Activity**: Confirm the identity of the user executing the queries. Validate their role and the necessity of their actions to ensure they align with expected administrative practices concerning backup management.

  - **Cross-reference with Access Logs**: Examine relevant access logs to see if there are any related remote access attempts that coincide with the suspicious queries, especially through tools like VPNs or cloud management platforms.

  ### Prioritization
  The alert is categorized as medium severity due to the potential impact of a data breach involving backup repositories, which could lead to significant operational disruptions and data integrity issues. Given the increasing sophistication of attackers, such queries could signify early reconnaissance or exploitation attempts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage concerning other potential utilities or scripts that could achieve similar malicious outcomes without using `sqlcmd.exe`. The detection logic assumes that any invocation of `sqlcmd.exe` related to backup queries is malicious; however, legitimate administrative tasks may lead to false positives. Proper logging configurations on Veeam databases and the context of administrative access rights are essential for the effectiveness of this alert.

