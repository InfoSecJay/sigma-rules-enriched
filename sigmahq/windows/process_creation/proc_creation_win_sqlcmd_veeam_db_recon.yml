title: Veeam Backup Database Suspicious Query
id: 696bfb54-227e-4602-ac5b-30d9d2053312
status: test
description: Detects potentially suspicious SQL queries using SQLCmd targeting 
  the Veeam backup databases in order to steal information.
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-04
tags:
- attack.collection
- attack.t1005
logsource:
  category: process_creation
  product: windows
detection:
  selection_sql:
    Image|endswith: '\sqlcmd.exe'
    CommandLine|contains|all:
    - 'VeeamBackup'
    - 'From '
  selection_db:
    CommandLine|contains:
    - 'BackupRepositories'
    - 'Backups'
    - 'Credentials'
    - 'HostCreds'
    - 'SmbFileShares'
    - 'Ssh_creds'
    - 'VSphereInfo'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious SQL queries executed using `sqlcmd.exe` targeting Veeam backup databases, indicating an attacker may be attempting to extract sensitive information. The likely objective of a malicious actor is to access and exfiltrate backup data, which can include credentials and sensitive configurations, potentially leading to further compromise. This behavior aligns with the MITRE ATT&CK framework's Collection tactic (TA-1005), where attackers gather information for malicious purposes.

  The primary telemetry sources include Windows process creation logs, specifically Event ID 4688 that logs instance of process creation and Sysmon Event ID 1 for enhanced visibility on command-line arguments and image paths. If malicious, this activity poses a significant risk as it can indicate data exfiltration or reconnaissance activities targeting critical assets. It is important to note that this detection does NOT confirm that malicious data exfiltration has occurred on its own; further investigation is always necessary to validate intent and consequence.

  ### Investigation Steps

  - **Verify the command line usage:** Check for `CommandLine` in Event ID 4688 containing keywords like 'VeeamBackup', 'From', and any listed suspicious terms associated with backups (e.g., 'BackupRepositories', 'HostCreds'). This indicates potential unauthorized queries against critical backup infrastructure.

  - **Identify host context:** Assess which system initiated the process, focusing on the role of the asset (e.g., Veeam Backup server). Elevated privileges can indicate malicious intent, especially if unexpected for that asset's role.

  - **Review process lineage:** Use Sysmon or Windows Event Logs to trace parent-child process relationships. Look for scripts or tools that initiated `sqlcmd.exe`. Suspicious parent processes like PowerShell or command shells should raise flags.

  - **Evaluate legitimization properties:** Research typical usage of `sqlcmd.exe` with the Veeam Backup system, including expected SQL command structures. Compare findings against current activity to discern whether actions align with scheduled backup tasks or operational procedures.

  - **Identify potential data leak signals:** Review backup logs for unusual activity, such as unexpected changes within databases (e.g., unusual queries logged or external connections established). Look for indicators of data being copied or unauthorized access attempts.

  ### Prioritization

  The severity of this alert is classified as medium due to its potential impact on sensitive backup data. The likelihood of malicious abuse is realistic, given the tempting nature of backup databases containing valuable information. While SQL queries can be used for legitimate purposes, the specific context in this detection raises significant concern and warranting further investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by misconfigurations or a lack of visibility into certain backup processes that do not generate logs in the specified forms. Legitimate administrative tasks or maintenance activities may trigger this alert, indicating a need for contextual understanding of normal operational behavior. Companion detections, such as those monitoring network connections or file access logs related to backup databases, can provide stronger coverage against potential exfiltration efforts.

