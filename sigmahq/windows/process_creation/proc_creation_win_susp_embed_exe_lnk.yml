title: Hidden Powershell in Link File Pattern
id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
status: test
description: Detects events that appear when a user click on a link file with a 
  powershell command in it
references:
- https://www.x86matthew.com/view_post?id=embed_exe_lnk
author: frack113
date: 2022-02-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage: C:\Windows\explorer.exe
    Image: C:\Windows\System32\cmd.exe
    CommandLine|contains|all:
    - 'powershell'
    - '.lnk'
  condition: selection
falsepositives:
- Legitimate commands in .lnk files
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Windows command prompt (`cmd.exe`) initiated by Windows Explorer (`explorer.exe`) when invoked via a link file (.lnk) that contains a PowerShell command. This behavior is indicative of potential malicious activity where adversaries may use link files to execute scripts without user awareness, which can align with lateral movement or initial access objectives.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and technique **Command and Scripting Interpreter: Windows Command Shell** (T1059.001). The primary telemetry sources include Windows Security Event ID 4688 for process creation and Sysmon Event ID 1, which captures command line details. If executed with malicious intent, this activity can compromise host integrity or lead to further exploits. It is important to note that this detection does NOT confirm that the execution is malicious on its own; benign use of link files to execute PowerShell commands also exists.

  ### Investigation Steps

  - **Verify the parent process:** Check for Security Event ID 4688 related to the process creation for `cmd.exe`, ensuring the ParentImage is `C:\Windows\explorer.exe`. Legitimate user actions will typically show explorer as the parent, but also require additional context on the command executed.

  - **Review command line arguments:** Inspect the CommandLine field in the event logs for indications of malicious intent, specifically for `powershell` and `.lnk` within the command. Malicious command lines may use obfuscation or unusual parameters.

  - **Assess file attributes:** Identify the originating .lnk file path and analyze its properties (creation date, modified date, etc.). Benign .lnk files generally correspond to user-generated processes or applications frequently used in the environment.

  - **Check for related PowerShell activity:** Correlate with Microsoft-Windows-PowerShell/Operational logs (Event ID 4104) to see if there were any preceding PowerShell commands executed. A large number of commands following each `.lnk` may indicate malicious activity.

  - **Examine the host role:** Understand the asset's criticality. Execution on a high-value target or domain controller increases concern, warranting immediate escalation and further analysis.

  ### Prioritization

  This alert carries medium severity due to the potential impact on security when link files are utilized to execute concealed PowerShell commands. The likelihood of malicious abuse is moderate, given the sophistication of evasion techniques utilized by attackers. This method of execution is a common tactic in exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be circumvented if attackers use alternative command execution techniques or proper user permissions, allowing legitimate use to appear malicious. Reliable detection depends on complete logging of PowerShell and command shell activities, which should be verified in the environment. Legitimate activities may involve administrative scripts or user-initiated commands that would trigger this alert. A related detection to consider for enhanced coverage would be monitoring for unusual PowerShell execution patterns outside of typical business processes.

