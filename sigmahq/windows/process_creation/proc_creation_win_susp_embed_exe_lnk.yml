title: Hidden Powershell in Link File Pattern
id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
status: test
description: Detects events that appear when a user click on a link file with a powershell
  command in it
references:
- https://www.x86matthew.com/view_post?id=embed_exe_lnk
author: frack113
date: 2022-02-06
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage: C:\Windows\explorer.exe
    Image: C:\Windows\System32\cmd.exe
    CommandLine|contains|all:
    - 'powershell'
    - '.lnk'
  condition: selection
falsepositives:
- Legitimate commands in .lnk files
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of PowerShell commands initiated through link files (with a `.lnk` extension) when a user interacts with them, typically by clicking. Attackers may use this method to execute malicious PowerShell scripts hidden within seemingly benign shortcut files, often aiming to execute code without drawing user or administrative attention. The technique leverages both the capabilities of PowerShell for executing scripts and the stealth of link files that can be disguised as innocuous files, thereby enhancing the chances of successful exploitation.

  This behavior aligns with the MITRE ATT&CK framework, particularly under the **Execution** tactic and the technique **Command and Scripting Interpreter: Windows PowerShell (T1059.001)**. Malicious actors may aim to bypass security defenses by exploiting the trust placed in link files, potentially leading to further system compromises, data theft, or lateral movement within the network.

  The primary data source for monitoring this activity is **process creation logs** on Windows systems. By analyzing these logs, security teams can capture detailed information regarding the parent and child processes linked to the execution of the PowerShell commands triggered by link files.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs for instances where `cmd.exe` was spawned by `explorer.exe` with a command line containing both 'powershell' and '.lnk'. This will help confirm the execution of potentially malicious PowerShell commands.

  - **Inspect Associated Log Files**: Collect and examine logs related to link file interactions from systems identified in the alerts. Check the timestamps and user actions related to these link files to understand the context in which they were executed.

  - **Analyze PowerShell Activity**: Investigate any related PowerShell logs or transcripts for abnormal commands or scripts that may have been executed following the link file interaction. This includes looking for unusual cmdlets or parameters that are not typically employed in your environment.

  - **Correlate User Activity**: Verify the user activity around the time of the alert. Check if the user has a valid reason for interacting with the link files in question. This can assist in distinguishing between legitimate usage and malicious intent.

  ### Prioritization
  The alert carries a medium severity due to the significant risk associated with PowerShell being executed through link files—a common technique used in various attack scenarios. While some interactions may be benign, the likelihood of such behavior being indicative of malicious activity warrants prompt investigation.

  ### Blind Spots and Assumptions
  This detection logic may overlook scenarios where attackers use other commands or scripting languages not involving PowerShell or if legitimate administrative scripts are executed from link files. Assumptions include that the logs must capture all relevant process creation events and that users' operations with link files can be tied back to malicious intentions. Proper configuration and retention of Windows process creation logs are crucial for ensuring detection effectiveness; without comprehensive logging, the alerts may yield incomplete visibility into potential threats.

