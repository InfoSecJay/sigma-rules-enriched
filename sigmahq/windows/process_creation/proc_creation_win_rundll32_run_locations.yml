logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|contains:
    - ':\RECYCLER\'
    - ':\SystemVolumeInformation\'
  - Image|startswith:
    - 'C:\Windows\Tasks\'
    - 'C:\Windows\debug\'
    - 'C:\Windows\fonts\'
    - 'C:\Windows\help\'
    - 'C:\Windows\drivers\'
    - 'C:\Windows\addins\'
    - 'C:\Windows\cursors\'
    - 'C:\Windows\system32\tasks\'
  condition: selection
falsepositives:
- False positives depend on scripts and administrative tools used in the 
  monitored environment
level: medium
note: |
  ### Technical Context

  This rule detects processes that are executed from atypical or suspicious locations in a Windows environment, such as the RECYCLER or System Volume Information folders, as well as specific directories within the C:\Windows path that are generally not used for legitimate process execution. The likely attacker objective is to execute malicious code while evading detection, often attempting to hide their activity in less monitored or obscure directories. This behavior aligns with the MITRE ATT&CK technique T1036 (Masquerading).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 and Sysmon Event ID 1), which will capture information about the execution of processes, including their paths. If the processes are indeed malicious, they could lead to system compromise or data exfiltration. Importantly, this detection does not confirm whether a detected process is malicious; it only indicates that it originated from a suspicious location.

  ### Investigation Steps

  - **Confirm the source of the alert**: Review Security Event ID 4688 or Sysmon Event ID 1 logs to identify the process path and command line arguments that triggered the alert.
  - **Identify benign processes**: Compare the alerted paths against known legitimate administrative tools or scripts used in the organization. If the path is common for those processes, it may indicate legitimate behavior.
  - **Check execution context**: Inspect the user account that initiated the process. If it is a low-privilege user account executing a process from a suspicious location, this could indicate malicious intent (e.g., Event ID 4657 for modifications).
  - **Look for associated artifacts in file system**: Search for any files created in those suspicious locations (e.g., RECYCLER or C:\Windows\Tasks) around the same time as the alert to potentially identify payloads or scripts.
  - **Evaluate system impact**: Determine if the host is a critical asset (e.g., a server or domain controller) that could elevate the risk of compromise, warranting prioritized investigation.
  - **Correlate with network activity**: Review relevant traffic logs to see if the indicated process has initiated unusual outbound connections or data transfers that may suggest exfiltration attempts.

  ### Prioritization

  This alert holds medium severity due to the potential impact on systems residing in sensitive roles; however, the likelihood of malicious actors executing processes from these paths suggests it requires immediate analyst review. Such suspicious process behavior is often weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  The detection may miss clever attempts by adversaries to execute from more frequently used or overlooked legitimate directories. Ensuring comprehensive logging configurations for process creation can help increase detection reliability. Legitimate administrative scripts may cause false positives, necessitating careful review. Companion detections focusing on related suspicious behavior, such as lateral movement techniques (e.g., T1075), can strengthen overall monitoring effectiveness.

