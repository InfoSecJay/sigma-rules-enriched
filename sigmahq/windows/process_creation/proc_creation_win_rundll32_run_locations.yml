logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|contains:
    - ':\RECYCLER\'
    - ':\SystemVolumeInformation\'
  - Image|startswith:
    - 'C:\Windows\Tasks\'
    - 'C:\Windows\debug\'
    - 'C:\Windows\fonts\'
    - 'C:\Windows\help\'
    - 'C:\Windows\drivers\'
    - 'C:\Windows\addins\'
    - 'C:\Windows\cursors\'
    - 'C:\Windows\system32\tasks\'
  condition: selection
falsepositives:
- False positives depend on scripts and administrative tools used in the monitored
  environment
level: medium
note: |
  ### Technical Context
  This detection rule identifies processes that are initiated from non-standard locations within the Windows file system, which may indicate potential malicious activity. Attackers often deploy tactics such as executing malware or other harmful scripts from directories intended for system use, like the `C:\Windows` directory, or from hidden system locations such as `:\RECYCLER\` and `:\SystemVolumeInformation\`. The objective behind this behavior is typically to evade detection by running malicious code from locations that are less likely to be scrutinized by security software and system administrators.

  This rule is associated with the MITRE ATT&CK techniques T1036 (Masquerading), which involves disguising malicious processes or files as legitimate to mislead users or security tools. The detection relies primarily on process creation logs from Windows, which offer visibility into the origins of running processes.

  The primary data sources for effective detection include:
  - Process creation event logs from Windows
  - Endpoint Detection and Response (EDR) logs for processes and their paths

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for any entries that show the execution of applications from suspicious paths as defined in the detection rule.
  - **Analyze Parent Process Relationships:** Investigate the parent processes of suspicious executions to determine if they originate from trusted applications or legitimate administrative activities.
  - **Cross-Reference with Known Tools:** Look for associations with known tools or scripts that might legitimately use these paths; assess whether the context aligns with normal operational behavior.
  - **Conduct User Activity Review:** Verify the user accounts linked to the suspicious process executions to understand if a privileged account was misused or if user account behavior appears anomalous.

  ### Prioritization
  The medium severity level of this alert reflects a notable threat potential, as processes launched from uncommon directories often signify attempts at evading detection by leveraging legitimate system processes. Such activities warrant prompt investigation, especially in an enterprise setting where the impact of undetected malicious actions can be substantial.

  ### Blind Spots and Assumptions
  This detection may miss certain legitimate processes if administrative tools or scripts are commonly used within the environment that operate from these paths. The detection logic assumes that processes originating from the specified locations are inherently suspicious, but this may not hold true for every organizational context. To ensure this alert functions effectively, the environment should have comprehensive logging enabled for all process creation events and ideally configured to capture process parameters and parent process details for complete context.

