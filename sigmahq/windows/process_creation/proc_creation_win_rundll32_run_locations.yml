detection:
  selection:
  - Image|contains:
    - ':\RECYCLER\'
    - ':\SystemVolumeInformation\'
  - Image|startswith:
    - 'C:\Windows\Tasks\'
    - 'C:\Windows\debug\'
    - 'C:\Windows\fonts\'
    - 'C:\Windows\help\'
    - 'C:\Windows\drivers\'
    - 'C:\Windows\addins\'
    - 'C:\Windows\cursors\'
    - 'C:\Windows\system32\tasks\'
  condition: selection
falsepositives:
- False positives depend on scripts and administrative tools used in the 
  monitored environment
level: medium
note: |
  ### Technical Context

  This rule detects processes executed from suspicious locations on Windows systems, including the RECYCLER folder, System Volume Information, and various hidden directories within Windows. Attackers may leverage these uncommon directories to hide malicious executables and ensure persistence on compromised systems. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically through the technique of "Masquerading" (T1036).

  Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. If malicious, this behavior could indicate an adversary attempting to evade detection while running malware from unconventional locations. Importantly, this alert does NOT confirm malicious intent solely by itself, as legitimate administrative and system operations can also execute processes from these directories.

  ### Investigation Steps

  - **Review process creation logs:**
    Check Security Event ID 4688 and Sysmon Event ID 1 logs for any processes originating from paths like `C:\RECYCLER\`, `C:\SystemVolumeInformation\`, or others listed in the rule. Look for inconsistencies with typical process origins on this host.

  - **Identify common applications:**
    Validate the file names and hash values of processes executing from suspicious paths against known legitimate applications or admin tools. This includes checking public databases like VirusTotal.

  - **Check for recent changes:**
    Investigate any recent changes to file attributes or permissions in the suspicious directories. An unusual access pattern may indicate malicious adjustments made during a breach.

  - **Examine scheduled tasks:**
    Review contents of `C:\Windows\Tasks\`, as legitimate scheduled tasks typically run from this directory. Identify any unfamiliar entries, especially those launching processes from suspicious locations.

  - **Assess host role and criticality:**
    Determine the role of the affected endpoint (e.g., server, workstation, etc.) and its criticality to business operations. Higher criticality assets should prioritize deeper investigations.

  - **Trace activity to user behavior:**
    Correlate the timestamps of the process creation with user activity logs to establish whether the execution could align with legitimate user actions or warrant further suspicion.

  ### Prioritization

  This alert carries medium severity due to the potential impact of detected malicious activity, especially on critical systems. The likelihood of abuse is moderate, as attackers frequently employ evasion techniques involving unusual execution paths, making this behavior a common tactic in their arsenal.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate administrative tools executing processes from these paths; thus, context is crucial. Reliable detection requires that logging for both Security Event ID 4688 and Sysmon Event ID 1 is properly configured. False positives may arise from legitimate scripts. A companion detection strategy related to process injection or execution from startup folders (T1547) could strengthen coverage against evasions.

