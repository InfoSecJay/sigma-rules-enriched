logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\System32\control.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter:
    CommandLine|contains: 'Shell32.dll'
  condition: all of selection_* and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving the misuse of the Windows Control Panel (control.exe) to load DLL files via Rundll32.exe. The technique is associated with advanced persistent threat (APT) groups like the Equation Group and various exploit kits, which may leverage this method as a means to execute malicious payloads or perform other nefarious activities while maintaining a low profile. Attackers often target the system's built-in utilities to evade detection, aiming to blend in with legitimate processes and operations on the system.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), as the technique seeks to avoid detection by utilizing trusted system processes for execution. The specific technique in this context is **Rundll32** (T1218.011), which describes the exploitation of the Rundll32 executable to run DLLs without the usual visibility associated with executable files. This can allow attackers to execute malicious code in a manner that is not easily detected through standard monitoring.

  To effectively detect this behavior, primary data sources include **process creation logs** which detail instances of `control.exe` spawning `rundll32.exe`, as well as the command line arguments used during execution. This data can provide crucial evidence of potentially malicious activities being carried out on the system.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for instances where `control.exe` is the parent process for `rundll32.exe`. Look for unusual command line parameters, particularly those indicating the use of `Shell32.dll`.

  - **Analyze Command Line Arguments:** Focus on analyzing command line arguments associated with `rundll32.exe`. Unusual or unexpected arguments could indicate an attempt to execute malicious code.

  - **Check for Related DLLs:** Investigate the presence of DLLs being loaded by `rundll32.exe`, particularly those not commonly associated with legitimate operations or those known to be exploited by malware.

  - **Correlate with Other Logs:** Cross-reference findings with other telemetry sources such as EDR logs, system event logs, or network traffic to detect any further anomaly or confirm malicious intent.

  ### Prioritization
  Given the high severity of this alert, it is crucial to address it promptly as it indicates possible exploitation techniques that could lead to further compromise of the environment. The potential for lateral movement and data exfiltration elevates the risk and requires immediate investigation.

  ### Blind Spots and Assumptions
  The detection logic may not capture all instances of abuse, particularly if attackers utilize other legitimate processes or if they modify their command lines to evade detection. There is an assumption that process creation logs capture all relevant execution events, which may not be the case should logging configurations be incomplete or disabled. Adequate logging must be ensured across all relevant endpoints to facilitate the accuracy and reliability of this alert.

