logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\System32\control.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter:
    CommandLine|contains: 'Shell32.dll'
  condition: all of selection_* and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious executions of `rundll32.exe`, specifically when it is initiated by `control.exe` with commands involving `Shell32.dll`. Such activity indicates an attacker attempting to leverage system utilities to run potentially malicious code, particularly in exploits related to the Equation Group and various exploit kits.

  The relevant MITRE ATT&CK tactics include Defense Evasion (ID: TA0005) and the technique for Software Deployment (ID: T1218.011). Primary telemetry sources involve Windows process creation logs, such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior can lead to the execution of unauthorized code, compromising system integrity. However, this detection does NOT confirm the execution was malicious without further analysis.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 to identify the `control.exe` and `rundll32.exe` process creation events, noting the command line used.

  - **Analyze command line arguments:** Investigate the command line of the `rundll32.exe` execution for keywords or parameters that are uncommon or unexpected, especially any direct references to `Shell32.dll`.

  - **Review parent-child process relationships:** Ensure that the relationship between `control.exe` and `rundll32.exe` is legitimate; identify commonly used legitimate processes that may interact with control panel items and their associated DLLs.

  - **Identify benign behavior patterns:** Look for legitimate administrative tasks or software updates that typically use `control.exe` without invoking `rundll32.exe`, such as system configuration changes or user-initiated control panel access.

  - **Correlate with threat intelligence:** Search for the specific command line patterns or ParentImage/ChildImage pairs in your threat intelligence feeds to identify if any known malicious indicators have been documented.

  - **Evaluate system impact:** Prioritize investigation on high-value assets (such as domain controllers or critical servers) where such behavior could lead to significant disruptions if exploited.

  ### Prioritization

  This alert is considered high severity due to the potential for abuse by adversaries targeting critical enterprise systems. The execution of `rundll32.exe` via `control.exe` is not typical and indicates potentially weaponized techniques in use, warranting urgent investigation.

  ### Blind Spots and Assumptions

  This detection may be bypassed by adversaries using alternative execution methods or direct invocations without `control.exe` as a parent. Ensure that all relevant logs from Sysmon and Security Event Logs are enabled and properly configured for full visibility. Legitimate administrative tools or system updates could trigger this alert. Complementary detections include monitoring for anomalous `rundll32.exe` executions from processes other than `control.exe` or through network activity associated with known exploit kits.

