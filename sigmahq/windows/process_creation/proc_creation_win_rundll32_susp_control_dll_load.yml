detection:
  selection_parent:
    ParentImage|endswith: '\System32\control.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  filter:
    CommandLine|contains: 'Shell32.dll'
  condition: all of selection_* and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` that is initiated by `control.exe` with a command line argument containing `Shell32.dll`. This behavior is commonly associated with the delivery of malicious payloads by attackers, particularly when leveraging techniques such as DLL sideloading used by advanced persistent threats (APTs) like the Equation Group. The relevant MITRE ATT&CK tactics and techniques are Execution (T1203.001) and Stealth (T1218.011).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 which captures detailed information on process launches. If identified as malicious, this behavior could lead to full system compromise or unauthorized data access. However, this detection does *not* confirm that the execution is malicious on its own; further investigation is necessary to establish intent and context.

  ### Investigation Steps

  - **Examine process creation events:** Review Security Event ID 4688 for instances where `rundll32.exe` is launched by `control.exe`. Note the specific command line that includes `Shell32.dll`, as this strongly indicates a potentially malicious operation.

  - **Check for additional suspicious DLLs:** Investigate associated activity in Event ID 4688 for any other command line arguments that reference strange or non-standard DLLs. Legitimate usage typically does not involve unusual or unexpected DLLs.

  - **Review process parent-child relationships:** Utilize Sysinternals tools like Process Explorer to analyze the relationship between `control.exe` and `rundll32.exe`. Investigate whether any other processes are involved in the execution chain that may indicate a deeper compromise.

  - **Look for high-confidence malicious indicators:** Cross-reference the behavior and command line with known malicious indicators from threat intelligence feeds, especially those associated with the Equation Group. Hashes or file names linked to specific campaigns may provide context.

  - **Audit the system and network logs:** Analyze network traffic logs such as Windows Firewall logs or proxy logs for attempts to connect to external C2 servers following the execution. Note any connections initiated by the affected machine to external IPs that are categorized as suspicious.

  - **Identify legitimate Control Panel usage:** Recognize that `control.exe` is used for legitimate administrative GUI tasks in Windows. Document any expected use cases in contexts like software installations or updates that might leverage `shell32.dll` legitimately and compare this to the alert context.

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on critical systems and its association with known attacker techniques. The chances of malicious exploitation are significant as this behavior can indicate advanced tactics used in targeted attacks, making it a high-risk indicator in the enterprise environment.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming malicious DLLs or using legitimate process chains. Detection relies on accurate logging of process creation events, which may be limited by insufficient syslog configurations or logging policies. Legitimate administrative actions, such as debugging or system maintenance, could potentially trigger similar alerts. A companion detection would involve monitoring for suspicious scheduled tasks or registry modifications often used to maintain persistence following such DLL executions.

