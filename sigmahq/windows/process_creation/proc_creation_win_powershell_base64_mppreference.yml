  ---

  ### Technical Context

  This rule detects the execution of base64 encoded PowerShell commands that utilize the `Add-MpPreference` and `Set-MpPreference` cmdlets, which are designed to modify Windows Defender Antivirus settings. The likely attacker objective is to disable or alter the antivirus functionalities to evade detection and maintain persistence within the environment. The relevant MITRE ATT&CK tactics and techniques are **Defense Evasion** and **Process Injection** (T1562.001). Primary telemetry sources include Windows process creation logs (Event ID 4688) and PowerShell logs (Event ID 400, 410, or 4768). If malicious, this behavior poses significant risks by potentially allowing malware to operate undetected. This detection does NOT confirm malicious activity on its own, as legitimate administrative actions may perform similar commands under certain circumstances.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for recent PowerShell process executions. Look for instances with command lines that contain `Add-MpPreference` or `Set-MpPreference`. Capture the `NewProcessName` and `CommandLine` fields for analysis.

  - **Extract base64 arguments from commands:** Identify PowerShell execution that contains base64 encoded arguments. Decrypt any found base64 strings (e.g., `QQBkAGQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA`) to see if they relate to changes in Windows Defender settings.

  - **Investigate user and process context:** Determine the user context under which the command executed. Check if the user is a known administrator or if any unusual accounts are involved. Look at the `SubjectUserName`, `NewProcessName`, and `ProcessId` fields.

  - **Identify expected legitimate usage patterns:** Document expected legitimate PowerShell usage, such as administrative scripts that configure antivirus settings. If observed execution matches an approved process or script, it may be benign.

  - **Cross-reference system changes:** Investigate if any recent exclusions or modifications to Windows Defender settings are logged in the Windows Defender event logs (Event IDs 5007 and 5008). Verify that these changes match the command executions detected.

  - **Check for additional telemetry:** Review related logs such as Sysmon events (Event ID 1) for abnormal network connections or file creations associated with the PowerShell process. Look for filenames or indicators that suggest an illicit payload could have been delivered.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact on the environment, particularly if it affects critical systems where antivirus integrity is paramount. The likelihood of malicious abuse is significant, as these cmdlets can facilitate malware evasion strategies. Such behavior is weaponized in various attack scenarios, warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if PowerShell logging is not enabled or if base64 encoded commands are frequently used for legitimate administrative functions. Valid exclusions configured in Windows Defender may also trigger this alert. Companion detections that may strengthen coverage include monitoring for suspicious behavioral patterns in PowerShell scripts (e.g., frequent use of base64 encoding without a legitimate purpose or context).

