note: |
  ### Technical Context
  This detection rule identifies the use of base64 encoded PowerShell cmdlets, specifically "Add-MpPreference" and "Set-MpPreference", which are employed to modify settings in Microsoft Defender Antivirus. Attackers often leverage these commands to disable antivirus protections, allowing them to operate without detection during malicious activities. By utilizing base64 encoding, attackers can obscure their intentions, making it challenging for standard monitoring tools to flag the malicious commands as suspicious.

  The associated MITRE ATT&CK techniques include *T1562.001 - Disable or Modify Security Tools* and *T1059.001 - PowerShell*, highlighting a common tactic used by attackers to evade defenses by tampering with security settings on targeted systems. This type of behavior raises significant security concerns, particularly in enterprise environments where maintaining robust defenses against malware and intrusion is critical.

  Relevant data sources for effective detection include process creation logs from Windows systems, which can capture the command-line arguments used during the execution of unauthorized PowerShell commands.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for any PowerShell command line that includes base64 encoded strings associated with "Add-MpPreference" or "Set-MpPreference". Look for patterns that indicate obfuscation.
  - **Inspect Antivirus Logs**: Check Microsoft Defender logs to see if there are any recent changes made to the preferences or exclusions that coincide with the detected PowerShell commands.
  - **Correlate with User Activity**: Investigate user account activity to identify any unusual behavior or anomalous access times regarding the execution of these commands, especially from accounts without administrative privileges.
  - **Conduct Anomaly Detection**: Use threat intelligence and historical data to identify baseline behavior for PowerShell usage within the organization, noting deviations that could signal malicious intent.

  ### Prioritization
  Given the potential for an attacker to disable crucial security defenses, this alert should be treated with high severity. The impact on the enterprise's security posture can be substantial, increasing the risk of sustained malicious activity and compromise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by systems not utilizing PowerShell logging or by instances where the PowerShell execution policy is modified to bypass standard logging mechanisms. The detection logic assumes that base64 encoding will be present, which may not always be the case if other obfuscation techniques are employed. Additionally, the rule requires proper configurations to capture process creation logs effectively for accurate detection.

