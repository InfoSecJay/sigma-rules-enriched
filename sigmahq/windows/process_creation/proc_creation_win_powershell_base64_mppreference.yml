note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that use the "MpPreference" cmdlet with base64 encoding. The behavior indicates a potential attempt to modify or bypass Microsoft Defender Antivirus (Defender AV) settings, which is a common tactic employed by malicious actors seeking to disable security protections. The relevant MITRE ATT&CK tactics include **Defense Evasion** and the technique **T1562.001: Impair Defenses**. Primary telemetry sources include Windows process creation logs, specifically monitoring CommandLine parameters for recurring usage of "Add-MpPreference" and "Set-MpPreference", along with base64 encoded variants.

  If executed by an adversary, it could allow malware to evade detection by disabling key security features of Defender AV, potentially leading to further exploitation on the network. However, this detection does NOT confirm an active compromise as legitimate administrative tasks or benign scripts may invoke similar commands under specific scenarios.

  ### Investigation Steps

  - **Review the process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for any recent executions of PowerShell that include "Add-MpPreference" or "Set-MpPreference" in the CommandLine field to identify potential malicious activity.

  - **Look for base64 encoding patterns:** Search for base64 encoded strings in the CommandLine that may trigger the alert (e.g., 'QQBkAGQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA') and decode them to understand the intent behind their execution.

  - **Validate expected administrative actions:** Investigate instances of legitimate usage by referencing established administrative workflows involving PowerShell and Defender AV to discern between benign and malicious command usage.

  - **Cross-reference with other security telemetry:** Retrieve relevant data from Windows Defender logs for any alerts that correspond to the same timeframe and user context to confirm whether the command was executed as part of a known administrative function or an unauthorized action.

  - **Check user and asset roles:** Assess the user account executing the command and the context of the system (e.g., server vs. endpoint) to evaluate the criticality of the affected asset and whether the user had legitimate authority to modify Defender AV settings.

  ### Prioritization

  This alert is classified as high severity due to the potential compromise of critical endpoint security configurations. The likelihood of malicious activity is significant given that altering Defender AV settings is a commonly weaponized behavior during an attack lifecycle, especially in environments with strict security postures.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative scripts that utilize these PowerShell cmdlets for benign purposes, potentially leading to false positives. Ensure that logging is configured to capture comprehensive PowerShell command execution details, including the complete CommandLine. It is also relevant to cross-reference with companion detections like other script execution alerts (e.g., detection of encoded PowerShell scripts) that would enhance overall security monitoring of potentially harmful activities.

