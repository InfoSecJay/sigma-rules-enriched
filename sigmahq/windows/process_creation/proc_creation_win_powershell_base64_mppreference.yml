note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell commands that modify Windows Defender settings using the `Add-MpPreference` or `Set-MpPreference` cmdlets, especially when the command is obfuscated using Base64 encoding. The likely objective of an attacker utilizing this behavior is to disable or alter antivirus protections, thereby facilitating malware execution without interference. This behavior is aligned with the MITRE ATT&CK technique **T1562.001: Impair Defenses**. The primary telemetry source is Windows process creation logs, specifically observing Security Event IDs 4688 and Sysmon Event ID 1 that capture command line arguments. If executed maliciously, these modifications can leave systems vulnerable to further exploitation or data breaches. Importantly, this detection alone does not confirm malicious intent; legitimate administrative actions to modify Defender settings could trigger the same alerts.

  ### Investigation Steps

  - **Review security event logs for process creation**: Check Security Event ID 4688 and Sysmon Event ID 1 for processes executing PowerShell with `Add-MpPreference` or `Set-MpPreference` in the command line. Record the user context and originating host. Observations of legitimate administrative tools running similar commands may indicate benign activity.

  - **Analyze command line arguments for Base64 patterns**: Look for specific Base64 strings indicative of malicious usage of cmdlets related to Windows Defender. Strings such as 'EAZABkAC0ATQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA' should be closely examined for the use of decoded commands that could modify security settings.

  - **Cross-reference user activity**: Verify the user account executing the command against normal operational behavior patterns. If the command was executed by a domain administrator or automated service account that usually manages Defender settings, it may be considered legitimate.

  - **Check file modification logs**: Investigate the Windows Defender configuration files in the directory C:\ProgramData\Microsoft\Windows Defender\Configuration\ for unusual modification timestamps that correlate with the alert. Adjustments outside of expected operational hours may indicate suspicious activity.

  - **Identify recently installed PowerShell modules**: Review recently installed or updated modules on the host using `Get-Module -ListAvailable` to identify any modules that could facilitate malicious activity or script obfuscation. Legitimate modules are typically related to administration or system enhancements.

  ### Prioritization

  This alert is high priority due to the critical role of Windows Defender in an enterprise environment. Misconfiguration or tampering can lead to serious vulnerabilities, increasing the risk of successful attacks. Additionally, hindering antivirus operations is a common tactic used by adversaries to install and operate malware.

  ### Blind Spots and Assumptions

  Common evasion techniques include renaming scripts, utilizing less detectable command execution methods, or running commands from a highly privileged account that circumvents alerting. Reliable detection requires consistent logging configurations, particularly for process creation and PowerShell execution. Legitimate administrative scripts may also trigger this alert, particularly during maintenance or configuration changes. A companion detection such as monitoring for unusual PowerShell module installations (e.g., using Sysmon Event ID 10) can provide broader visibility into potentially malicious activities.

