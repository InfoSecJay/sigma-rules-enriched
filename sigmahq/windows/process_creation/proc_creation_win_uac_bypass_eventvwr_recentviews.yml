note: |
  ### Technical Context

  This rule detects a method of bypassing User Account Control (UAC) by utilizing the Windows Event Viewer’s RecentViews functionality to execute arbitrary commands. The likely attacker objective is to gain elevated privileges on a compromised system without triggering standard security measures. This behavior relates to the MITRE ATT&CK tactics of **Privilege Escalation (TA0004)** and the technique **Bypass User Account Control (T1088)**.

  The primary telemetry sources for this alert are Windows process creation logs, specifically **Security Event ID 4688** and **Sysmon Event ID 1**, capturing command line usage. If the malicious behavior is confirmed, it could lead to significant unauthorized system access, allowing attackers to execute sensitive operations or escalate privileges further. Importantly, this detection does NOT confirm actual privilege escalation; it merely indicates an attempt to execute a UAC bypass method.

  ### Investigation Steps

  - **Check Process Creation Logs for Anomalies:** Review Security Event ID 4688 and Sysmon Event ID 1 for processes that executed commands containing `\Event Viewer\RecentViews` or `\EventV~1\RecentViews`. Look for unusual parent-child relationships, such as Event Viewer launching immediately after a process that normally shouldn't use it.

  - **Identify Command Redirection Indicators:** Look for command lines containing `>`, which may indicate output redirection. This could be a sign of the attacker attempting to manipulate the execution flow or hide their actions. Malicious examples might include unexpected command combinations not typical for user activity.

  - **Validate Legitimate Use Cases:** Assess if the user or administrative actions would reasonably trigger the event. Common legitimate activities include system administration tasks that involve querying event logs or updating system settings in Event Viewer.

  - **Correlate with Other Security Events:** Check for alerts or logs closely related to privilege escalation activities or unusual login patterns. This might help identify a broader exploitation attempt, looking for past events involving high-risk user accounts.

  - **Review for Known Compromise Indicators:** Investigate the presence of processes or commands known from malware or exploitation frameworks that utilize UAC Bypass. This includes studying the command history and file modifications in `C:\Users\<username>\AppData\Local\Microsoft\EventV~1\RecentViews`.

  - **Examine Host Context:** Determine whether the systems involved are critical assets that may be targeted for higher-value operations. Analyze the environment to ascertain if additional protections are necessary for sensitive hosts.

  ### Prioritization

  This alert is of **high severity** due to the potential for privilege escalation on critical systems. The likelihood of malicious behavior is significant, especially since UAC bypass techniques are commonly weaponized in real-world attack scenarios targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection may be limited by user activity that legitimately modifies `RecentViews` or legitimate use of redirection commands in scripts. Comprehensive coverage requires monitoring of all relevant Windows process creation events; ensure that Sysmon is properly configured. Legitimate administrative workflows, such as troubleshooting with Event Viewer, may trigger this alert. Companion detections should include alerts for other privilege escalation techniques like process injection or DLL sideloading for a more comprehensive view of potential threats.

