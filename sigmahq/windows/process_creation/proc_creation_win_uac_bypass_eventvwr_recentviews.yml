note: |
  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) by exploiting the Event Viewer’s RecentViews feature. Likely attacker objectives include escalating privileges or executing unauthorized operations at a higher privilege level using methods that obfuscate the original process invocation. This activity aligns with the MITRE ATT&CK framework under the tactic of **Defense Evasion** (T1203) and privilege escalation techniques (T1068).

  Primary telemetry sources for this rule include Windows process creation logs, specifically Event ID 4688 (for process creation) and Sysmon Event ID 1 (for detailed process invocation). If malicious, this behavior could lead to unauthorized system access with elevated privileges, potentially compromising sensitive data or system integrity. However, this detection on its own does not confirm a successful UAC bypass; further investigation is required to establish intent and outcome.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for instances where command lines contain either `\Event Viewer\RecentViews` or `\EventV~1\RecentViews`. Look for unusual parent processes that differ from typical user workflow (e.g., explorer.exe).

  - **Check command line arguments:** Identify instances with `>` in the command line, indicating output redirection; cross-reference with known application behavior. If the command is executed by administrative tools like PowerShell or CMD, this could suggest malicious intent.

  - **Assess normal user activity:** Compare logs against known legitimate usage patterns of Event Viewer. Typical behavior should not involve redirection commands or manipulation of the RecentViews feature for executing non-administrative tools.

  - **Identify known malicious indicators:** Look for the presence of processes that utilize the Event Viewer path without a valid user context or legitimate purpose, especially those initiated by uncommon users or system accounts.

  - **Cross-reference similar alerts:** Investigate companion detection alert ID **63e4f530-65dc-49cc-8f80-ccfa95c69d43**, which may also highlight UAC bypass techniques or other privilege escalation activities that leverage similar artifact manipulation.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical systems where UAC is bypassed. The likelihood of abuse is significant because malicious actors commonly utilize such techniques to escalate privileges stealthily and remain undetected.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logging on systems or environments where Sysmon is not deployed. Legitimate operations, such as administrative tasks involving Event Viewer by system administrators, may trigger this alert. A related detection for further coverage could include monitoring for unusual usage of PowerShell commands that manipulate system files and directories, which can indicate similar evasive tactics.

