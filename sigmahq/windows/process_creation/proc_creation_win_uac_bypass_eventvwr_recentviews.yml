note: |
  ### Technical Context
  This detection rule identifies attempts to bypass User Account Control (UAC) by leveraging the `Event Viewer` RecentViews functionality in Windows. UAC is a crucial security feature that mitigates unauthorized privilege escalation by prompting users for consent when applications attempt to perform actions requiring elevated permissions. Attackers often seek to evade these prompts to gain higher-level access to systems, which can lead to further compromise or persistence within an environment.

  The threat scenario typically involves an adversary using a technique to execute unauthorized commands or scripts without user consent, thereby escalating privileges. This behavior is associated with evasive tactics that are often seen during targeted attacks. The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1203) and **Privilege Escalation** (T1068), highlighting their intent to navigate around security mechanisms and increase access to system resources.

  To effectively capture this detection, the primary data source required is **process creation events**, which include information about command lines executed on the system. Other potential sources include auditing logs that track file access in the Event Viewer and any anomalies in user account permissions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look at the process creation logs for instances of `eventvwr.exe` executing the command line that references `RecentViews`. Pay close attention to the parameters and context in which these commands were run.
  - **Examine RecentViews Files**: Investigate the RecentViews files located in `%LOCALAPPDATA%\Microsoft\EventV~1\` for any unusual or unauthorized entries that could indicate malicious activity or commands executed by compromised accounts.
  - **Assess User Accounts and Roles**: Check if the users executing these actions hold any elevated privileges and review their recent activity for anomalies. Compare with baseline user behavior to identify any deviations.
  - **Audit Security and Access Logs**: Collect and analyze related security and access logs that might indicate attempts to circumvent UAC or unauthorized access to sensitive areas of the system.

  ### Prioritization
  This alert is deemed **high severity** due to its potential to indicate an active attempt to escalate privileges undetected. Such activities not only threaten system integrity but can lead to significant data breaches or prolonged unauthorized access if not addressed swiftly.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if logging is not properly configured, as certain process creation events, particularly from less monitored systems, might not be captured. Additionally, the logic assumes that the command line usage of `RecentViews` is indicative of malicious intent, which might not always be the case—legitimate administrative tasks could also trigger similar command lines. To ensure effective detection, proper logging must be enabled for process creation events and command line details must be captured.

