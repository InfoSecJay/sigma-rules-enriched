title: Whoami.EXE Execution With Output Option
id: c30fb093-1109-4dc8-88a8-b30d11c95a5d
status: test
description: Detects the execution of "whoami.exe" with the "/FO" flag to choose CSV
  as output format or with redirection options to export the results to a file for
  later use.
references:
- https://brica.de/alerts/alert/public/1247926/agent-tesla-keylogger-delivered-inside-a-power-iso-daa-archive/
- https://app.any.run/tasks/7eaba74e-c1ea-400f-9c17-5e30eee89906/
- https://www.youtube.com/watch?v=DsJ9ByX84o4&t=6s
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-28
modified: 2023-12-04
tags:
- attack.discovery
- attack.t1033
- car.2016-03-001
logsource:
  category: process_creation
  product: windows
detection:
  selection_main_img:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  selection_main_cli:
    CommandLine|contains:
    - ' /FO CSV'
    - ' -FO CSV'
  selection_special:
    CommandLine|contains: 'whoami*>'
  condition: all of selection_main_* or selection_special
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of `whoami.exe`, particularly when run with the `/FO CSV` flag, which specifies the output format as CSV, or with redirection options to save the results to a file. This behavior is significant as it can indicate an attacker’s attempt to gather user information, including privileges, group memberships, and other environment details that could facilitate further exploitation of the system. The output of such a command provides valuable insights into the local environment, which is often a precursor to lateral movement or privilege escalation attacks.

  The suspected threat relates broadly to reconnaissance activities that can be associated with both targeted and opportunistic attacks. Attackers often aim to collect system and user information before executing further malicious actions. This behavior maps to several tactics and techniques from the MITRE ATT&CK framework, particularly:

  - **Tactic: Discovery**
    - **Technique: System Information Discovery (T1082)**
    - **Technique: User and Group Discovery (T1033)**

  The main data sources for this detection will come from Windows process creation logs, which provide insights into command-line arguments used during execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for instances of `whoami.exe` being executed, focusing on the command-line arguments to identify any use of `/FO CSV` or redirection operators.

  - **Check for Unusual File Outputs:** Investigate any files created or modified in the system around the time of the execution. Look for files that were created using redirection operators (e.g., `>`).

  - **Correlation with Other Data Sources:** If possible, correlate findings with other telemetry such as user activity, access logs, or privilege escalation events that may provide context or additional indicators of malicious activity.

  - **Analyze User Context:** Determine the user account that executed the command. Investigate if that user typically performs such commands or if it appears anomalous in the context of their activity.

  ### Prioritization
  Alerting on this activity is classified as medium severity due to the potential for information disclosure through user enumeration, which could lead to further malicious activities if correlating data is observed in the environment.

  ### Blind Spots and Assumptions
  This alert may not cover scenarios where `whoami.exe` is run without the specific flags detected or in environments with strict logging policies that do not capture detailed process creation data. The detection logic assumes that `whoami.exe` runs within user contexts that typically would not perform such actions. Ensuring process creation logging is fully enabled in Windows Event logs (especially ID 4688) is essential for this detection to function as intended.

