title: Whoami.EXE Execution With Output Option
id: c30fb093-1109-4dc8-88a8-b30d11c95a5d
status: test
description: Detects the execution of "whoami.exe" with the "/FO" flag to choose
  CSV as output format or with redirection options to export the results to a 
  file for later use.
references:
- https://brica.de/alerts/alert/public/1247926/agent-tesla-keylogger-delivered-inside-a-power-iso-daa-archive/
- https://app.any.run/tasks/7eaba74e-c1ea-400f-9c17-5e30eee89906/
- https://www.youtube.com/watch?v=DsJ9ByX84o4&t=6s
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2023-02-28
modified: 2023-12-04
tags:
- attack.discovery
- attack.t1033
- car.2016-03-001
logsource:
  category: process_creation
  product: windows
detection:
  selection_main_img:
  - Image|endswith: '\whoami.exe'
  - OriginalFileName: 'whoami.exe'
  selection_main_cli:
    CommandLine|contains:
    - ' /FO CSV'
    - ' -FO CSV'
  selection_special:
    CommandLine|contains: 'whoami*>'
  condition: all of selection_main_* or selection_special
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of "whoami.exe" with the "/FO CSV" flag or output redirection, indicating potential data collection or intelligence-gathering activities by an attacker. The objective here is typically to extract user privileges and group memberships in a format suitable for later processing or exfiltration. Relevant MITRE ATT&CK techniques include **Discovery: Account Discovery (T1087)** and **Discovery: System Information Discovery (T1082)**.

  Primary telemetry sources include Windows Process Creation logs (Security Event ID 4688) and Sysmon Event ID 1 for process creation details. If malicious, this activity can indicate preparation for privilege escalation or lateral movement by providing an attacker with critical user information. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative or troubleshooting behavior may trigger this rule.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Windows Security Event ID 4688 for the execution of "whoami.exe". Look for CommandLine arguments that include "/FO CSV" or the presence of output redirection (">", ">>"). Legitimate execution might typically use "whoami" without these flags.

  - **Identify Unusual Usage Patterns:** Compare the usage of "whoami.exe" within your environment. Assess the frequency and context of execution. Look for execution on endpoints or users who do not typically perform such actions.

  - **Evaluate User Context and Source:** Verify the user context of the process. Use Event ID 4634 (Logoff) and Event ID 4624 (Logon) to ascertain whether the responsible user has legitimate access to perform such actions or if they have suspicious login patterns.

  - **Correlate with Other Discovery Activities:** Check for other related Windows discovery events in the same time frame (Event IDs 4688, 4663). Look for multiple reconnaissance tools being executed sequentially that could suggest malicious intent.

  - **Review File Output Locations:** If file redirection is indicated (e.g., "whoami*>"), investigate the directory specified. Examine for unauthorized file creations or access patterns that might indicate data exfiltration or preparation (Sysmon Event ID 11 for file creation).

  ### Prioritization

  This alert is categorized as medium severity. The impact depends on the role of the affected system; if it is a critical server or admin workstation, the risk is higher. Given potential malicious user activity leveraging tools in an automated way to gather sensitive information, there is a noteworthy likelihood of abuse. This behavior is recognized as common in the reconnaissance phase of an attack.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as renaming "whoami.exe" or executing it from non-standard directories. If logging is not correctly configured for process creation events (especially on endpoints), this detection may be missed. Legitimate administrative tasks may invoke this command without malicious intent, especially in troubleshooting or script automation scenarios. Companion detections include monitoring for suspicious PowerShell or CMD executions that gather system information, which could reinforce threat detection.

