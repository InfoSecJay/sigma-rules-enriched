title: Uncommon FileSystem Load Attempt By Format.com
id: 9fb6b26e-7f9e-4517-a48b-8cac4a1b6c60
status: test
description: |
  Detects the execution of format.com with an uncommon filesystem selection that could indicate a defense evasion activity in which "format.com" is used to load malicious DLL files or other programs.
references:
- https://twitter.com/0gtweet/status/1477925112561209344
- https://twitter.com/wdormann/status/1478011052130459653?s=20
author: Florian Roth (Nextron Systems)
date: 2022-01-04
modified: 2024-05-13
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\format.com'
    CommandLine|contains: '/fs:'
  filter_main_known_fs:
    CommandLine|contains:
    - '/fs:exFAT'
    - '/fs:FAT'
    - '/fs:NTFS'
    - '/fs:ReFS'
    - '/fs:UDF'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of `format.com` with atypical filesystem parameters, which may indicate an attempt to utilize the tool in a malicious context. Attackers may leverage `format.com` not only to format drives but also to load and execute malicious DLLs, potentially as an evasion tactic against endpoint protection measures. This behavior is classified under the MITRE ATT&CK tactic of Defense Evasion (T1562) with a specific focus on malicious usage of system binaries.

  The primary telemetry source is the Windows process creation logs, particularly focusing on Security Event ID 4688, which records process creation events including command-line arguments. If exploited for malicious purposes, this behavior could result in data loss or compromise of integrity across critical systems. Importantly, this detection does not confirm malicious activity on its own; further investigation is required to ascertain intent and context.

  ### Investigation Steps

  - **Review process creation logs for format.com executions**: Check Security Event ID 4688 for instances where `Image` ends with `\format.com` and note the `CommandLine` arguments. Analyze details for unusual filesystem options that fall outside common types (e.g., exFAT, FAT, NTFS).

  - **Identify system integrity changes**: Examine File System events (e.g., Event ID 4663 or 5145) on the affected system to see if `format.com` usage correlates with modifications to drive contents or system configuration changes that could indicate unauthorized access or data manipulation.

  - **Investigate command-line arguments**: Assess the `CommandLine` parameters utilized during `format.com` execution. If `/fs:` arguments include non-standard formats like those not part of the filter (e.g., `/fs:`, without known formats), flag these executions for review.

  - **Correlate with legitimate administrative activities**: Determine if similar commands were executed for maintenance or expected administrative tasks. For example, using `format.com` for legitimate drive formatting (with common filesystem types) should be documented and can be corroborated with change management records.

  - **Identify suspicious concurrent activities**: Look for simultaneous execution of other suspicious processes or abnormal user activity (like Event ID 4672 for privileged access logs) that may suggest coordinated malicious efforts, such as privilege escalation or unauthorized access.

  - **Verify any related file activities**: Inspect for file creation logs or exfiltration artifacts resulting from the `format.com` command, such as unexpected new files or alterations to system-critical files that could suggest data manipulation rather than legitimate operations.

  ### Prioritization

  The alert severity is high due to potential impacts on critical systems, as unauthorized use of `format.com` could lead to significant data integrity issues. The likelihood of malicious abuse is elevated, given its association with defense evasion tactics in compromises. This behavior is known to be leveraged in their toolsets by adversaries aiming to manipulate or destroy data covertly.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not configured to capture all relevant process creation events or if the execution details are obfuscated. Legitimate administrative actions, such as scheduled maintenance or firmware updates, might unintentionally trigger alerts. A companion detection such as monitoring for anomalous PowerShell scripts (T1059.001) related to command execution could enhance overall coverage against similar threats.

