title: Uncommon FileSystem Load Attempt By Format.com
id: 9fb6b26e-7f9e-4517-a48b-8cac4a1b6c60
status: test
description: |
  Detects the execution of format.com with an uncommon filesystem selection that could indicate a defense evasion activity in which "format.com" is used to load malicious DLL files or other programs.
references:
- https://twitter.com/0gtweet/status/1477925112561209344
- https://twitter.com/wdormann/status/1478011052130459653?s=20
author: Florian Roth (Nextron Systems)
date: 2022-01-04
modified: 2024-05-13
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\format.com'
    CommandLine|contains: '/fs:'
  filter_main_known_fs:
    CommandLine|contains:
    - '/fs:exFAT'
    - '/fs:FAT'
    - '/fs:NTFS'
    - '/fs:ReFS'
    - '/fs:UDF'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to execute `format.com` with an uncommon filesystem option, which may indicate a defense evasion tactic used by attackers to hide malicious activity. Attackers may utilize `format.com` to load unauthorized DLL files or execute other malicious programs while obscuring their intentions. The use of atypical filesystem formats suggests a sophisticated approach to evade traditional detections and gain unauthorized access or persistence on a system.

  The relevant MITRE ATT&CK tactics here include **Defense Evasion (T1562)** and potentially **Execution (T1203)** if an attacker is using this method to dynamically execute malicious code. Notably, the execution of `format.com` with unusual filesystem options is not a standard operation typically observed in normal business environments, which raises red flags for security teams.

  Primary data sources that will provide the necessary evidence include **process creation logs** from Windows systems, which capture command-line arguments, and potentially **Windows Event Logs** that might document file execution events. Analyzing this telemetry can reveal not only the command executed but also the context in which it was run, helping analysts to differentiate between benign and malicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check logs for any instances of `format.com` execution. Focus on the command-line arguments and look for unusual filesystem options that are not commonly used in your environment.

  - **Analyze File System Modification Activity**: Investigate recent changes to file systems or unusual modifications that coincide with the execution of `format.com`. Look for any odd file or directory creations.

  - **Correlate with User Activity**: Examine the user or service account associated with the execution of `format.com`. Determine if the account's behavior aligns with expected patterns or if it presents anomalies indicative of compromise.

  - **Check for Additional Indicators of Compromise**: Look for other related processes or DLLs that may have been executed around the same time as `format.com`. Indicators may include unexpected network connections or unusual file access patterns.

  ### Prioritization
  This alert carries a high severity due to the potential implications of executing `format.com` in a non-standard manner. The likelihood that this indicates an active attempt to bypass security measures and deploy malicious payloads makes it critical for prompt investigation and action.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the possibility of attackers utilizing alternative tools or commands to execute similar tactics, which wouldn't be captured by this specific rule. The detection logic assumes that any use of `format.com` with non-standard filesystem types is fundamentally malicious, which may not encompass all valid cases, such as administrative tasks performed by legitimate users. Ensuring that logs for all process creations are captured and configured properly is essential for the effectiveness of this alert.

