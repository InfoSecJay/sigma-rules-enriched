logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\format.com'
    CommandLine|contains: '/fs:'
  filter_main_known_fs:
    CommandLine|contains:
    - '/fs:exFAT'
    - '/fs:FAT'
    - '/fs:NTFS'
    - '/fs:ReFS'
    - '/fs:UDF'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to execute `format.com` with an uncommon filesystem parameter. The behavior suggests a possible defense evasion technique where adversaries may use this command to format drives and potentially load malicious DLLs or binary payloads. The likely objective is to obscure or alter the system environment to facilitate further malicious actions, such as data exfiltration or persistence. This detection pertains to the MITRE ATT&CK tactic of "Defense Evasion" (T1203) and "Command-Line Interface" (T1059.001).

  The primary telemetry sources are process creation logs, specifically Windows Security Event ID 4688 for process creation details, and potentially Sysmon Event ID 1 for more extensive command line arguments. If this behavior is malicious, it can compromise the integrity and availability of systems by altering or corrupting files. It is crucial to note that this detection does NOT confirm that the action was successfully performed or that it led to a malicious outcome, as legitimate use of `format.com` may occur.

  ### Investigation Steps

  - **Check the command line usage:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 logs for instances where `Image` ends with `\format.com` and `CommandLine` contains `/fs:`. Look for irregular filesystems not commonly used in standard operations.

  - **Identify known legitimate uses:** Cross-reference with a list of approved operational processes to discern whether the command-line arguments used (`/fs:...`) correlate with legitimate system maintenance operations. Common filesystem arguments include `/fs:NTFS`, `/fs:exFAT`, etc.

  - **Validate the execution context:** Check the parent process ID in Event ID 4688 logs to determine the context of the process launch. If launched from a non-administrative context, this might suggest malicious intent.

  - **Correlate with additional telemetry:** Assess Windows Event ID 4104 or PowerShell logs, especially if the command was executed as part of any script or automation. Look for unusual or unauthorized script executions preceding the command.

  - **Identify high-confidence indicators:** Look for evidence of DLLs or executables modified around the time of the command execution. Indicator fields to check include `TargetImage`, `NewFile` and `OriginalFile` in logs.

  - **Assess system impact:** Evaluate the affected asset. If the asset is critical (e.g., a domain controller), prioritize this alert for immediate investigation due to the potential catastrophic impact.

  ### Prioritization

  These alerts should be considered high severity, as the execution of a formatting action can severely disrupt user operations and data integrity, particularly on critical systems. The likelihood of abuse is significant given that attackers often exploit filesystem tools for evasion. Such techniques are known to be weaponized.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative practices that might trigger similar alerts, such as routine disk formatting. It is also essential to ensure that PowerShell and Sysmon logging are properly configured for effective detection. Legitimate software installations or drive management tasks may inadvertently activate this rule. A related detection to strengthen coverage could be monitoring for unusual process creation activities around system utilities, particularly those creating or modifying removable media.

