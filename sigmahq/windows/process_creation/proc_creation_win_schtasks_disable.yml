note: |
  ### Technical Context

  This Sigma rule detects the disabling of scheduled tasks using the `schtasks.exe` executable, particularly targeting critical tasks associated with system integrity, security features, and data protection processes. The likely attacker objective is to hinder protective mechanisms, potentially as a precursor to data destruction or further malicious activity, fitting within the MITRE ATT&CK framework under the tactic of Impact (T1490). Primary telemetry sources include Windows process creation logs, specifically Event ID 4688, which captures command-line execution details.

  If a malicious actor successfully disables these scheduled tasks, they may create vulnerabilities for subsequent actions such as ransomware deployment or other destructive measures. It is crucial to note that this detection does not confirm malicious intent on its own; benign administrative activities or maintenance operations may also result in similar command execution patterns.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `schtasks.exe` being executed. Look specifically for command lines including `'/Change'`, `'/TN'`, and `'/disable'`.

  - **Correlate with System Context:** Identify the asset role and criticality. For example, tasks affecting Windows Defender or System Restore on a file server should raise immediate concern compared to less critical systems.

  - **Analyze Targeted Task Names:** Look for specific references in the command line such as `\Windows\BitLocker`, `\Windows\ExploitGuard`, and `\Windows\SystemRestore\SR`. If these are present, prioritize the alert as potentially malicious.

  - **Assess User Context:** Investigate the user or service account initiating the task change. Administrative tasks performed by non-administrative users may indicate malicious behavior.

  - **Identify Legitimate Operations:** Confirm whether the disabling of tasks aligns with expected maintenance processes. Scheduled task updates or corporate policy changes may lead to similar command outputs without malicious intent.

  - **Check for Previous Alerts:** Look for correlating alerts or activities around the same timeframe that may indicate an ongoing malicious campaign or trend.

  ### Prioritization

  This alert is of high severity due to the critical nature of the affected scheduled tasks, which are integral to system security and stability. The likelihood of exploitation is high, especially given the recent trend of initial access leading to impact through disabling security measures. Such behavior is increasingly weaponized in modern attacks, including ransomware campaigns.

  ### Blind Spots and Assumptions

  Detection of this activity may be limited by logged events configurations; ensuring that Sysmon is properly configured can enhance visibility. Additionally, legitimate administrative operations, including policy changes or system maintenance, could inadvertently trigger this alert. Related detections, such as monitoring for unauthorized Elevation of Privilege attempts (T1068), can provide complementary coverage and context for a fuller understanding of the attack landscape.

