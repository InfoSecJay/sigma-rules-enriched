detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - '/Change'
    - '/TN'
    - '/disable'
    CommandLine|contains:
            # Add more important tasks
    - '\Windows\BitLocker'
    - '\Windows\ExploitGuard'
    - '\Windows\ExploitGuard\ExploitGuard MDM policy Refresh'
    - '\Windows\SystemRestore\SR'
    - '\Windows\UpdateOrchestrator\'
    - '\Windows\Windows Defender\'
    - '\Windows\WindowsBackup\'
    - '\Windows\WindowsUpdate\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify attempts by adversaries to disable important scheduled tasks on Windows systems. The specific actions targeted by this rule involve the execution of the `schtasks.exe` command-line utility with parameters that aim to change the state of critical tasks—particularly, those involved in system recovery, security monitoring, and updates. Attackers often employ such tactics to facilitate data destruction or mask their activities by rendering key recovery and protection mechanisms inactive.

  The threat scenario typically involves adversaries attempting to execute ransomware or destructive malware that seeks to impair the victim's ability to recover from an attack. The disabling of tasks related to system restore points, Windows Defender, and backup processes enhances the impact of such malicious actions by minimizing the possibility for recovery. This behavior aligns with the MITRE ATT&CK techniques such as "Impact" (TA0040) and specifically "Data Destruction" (T1489), where attackers aim to delete or render inaccessible data or tools necessary for incident recovery.

  Key data sources for effective detection include process creation logs, where invocation of `schtasks.exe` can be monitored for suspicious command-line usage. Logs captured from Windows Security Auditing can also provide valuable context in understanding attempts to manipulate system tasks, particularly in identifying the specific tasks or processes being targeted by the command.

  ### Investigation Steps
  - **Review Scheduled Task Log:** Investigate the `schtasks.exe` command invocation in process creation logs to confirm the presence of the alteration parameters (`/Change`, `/TN`, `/disable`) related to critical tasks like BitLocker, Windows Defender, or System Restore.
  - **Validate Task Status:** Use PowerShell or Task Scheduler UI to confirm the current status of the scheduled tasks identified in the alert. Check if the tasks are indeed disabled and note the last modified date.
  - **Examine User Context:** Analyze the user account under which the `schtasks.exe` command was executed. Determine if this account possesses the necessary permissions to disable these tasks and whether it aligns with typical operational patterns.
  - **Assess Event Log Correlation:** Cross-reference findings with Windows Event Logs, particularly focusing on Event ID 4697 (a service was installed) or 4698 (a scheduled task was created) to determine the context around the changes made to the scheduled tasks.

  ### Prioritization
  This alert is classified as high severity due to the significant impact of disabling critical scheduled tasks, which can cripple incident response capabilities and allow malicious activities to persist undetected. The likelihood of occurrence is also elevated, given the prevalence of ransomware and other impactful threats targeting enterprise environments.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may arise if `schtasks.exe` is invoked in benign contexts that do not match the specified command-line patterns, leading to false negatives. The detection logic assumes that the scheduled tasks listed are significant enough to warrant monitoring. Additionally, if the logs from process creation events are not configured to be collected or retained adequately, this detection may not function as intended. Proper logging and configuration of Windows Security Auditing are necessary to ensure comprehensive visibility over task manipulations.

