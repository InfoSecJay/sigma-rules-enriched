note: |
  ### Technical Context

  This detection identifies attempts to disable scheduled tasks on Windows using the `schtasks.exe` utility. Attackers may target critical tasks to disrupt operations, such as Windows Defender or system recovery, with the objective of enabling data loss, malware persistence, or evading defenses. This behavior aligns with the MITRE ATT&CK framework, particularly with the tactic of Impact (ID: T1490). The primary telemetry source for this detection comes from process creation events, specifically Windows Security Event ID 4688, which logs command line activity and the execution of processes. If malicious, disabling these tasks could lead to undetected breaches, extended malware presence, and significant data integrity risks. It is vital to note that this detection does NOT confirm that an attack has occurred; it indicates potential malicious intent that requires further investigation.

  ### Investigation Steps

  - **Review command line arguments:** Check Windows Security Event ID 4688 for the execution of `schtasks.exe` with the `/disable` argument. Look for command lines that directly mention disabling Windows critical tasks like `\Windows\Defender\` or `\Windows\SystemRestore\`.

  - **Examine task status:** Query Task Scheduler (`Get-ScheduledTask`) to confirm the status of the tasks that were allegedly disabled. Identify any unauthorized changes to the status of critical system tasks, which could indicate malicious action.

  - **Identify recent changes:** Review the Windows Event Log (Event ID 4697) to identify any recent modifications to system services or scheduled tasks. Check for ASR (Attack Surface Reduction) task entries to see if critical security services were targeted.

  - **Validate legitimate activity:** Compare the alert with routine maintenance or administrative activity. Scheduled tasks can be legitimately disabled during system updates or maintenance windows. Ensure that authorized personnel are associated with the changes to the task statuses in the event logs.

  - **Look for related artifacts:** Investigate other processes initiated around the same timestamp. Check for patterns of malicious behavior, such as the execution of known malware or unauthorized scripts around the time of the `schtasks` command execution.

  - **Review alert history:** Cross-reference this alert against similar instances (related alert ID: 7595ba94-cf3b-4471-aa03-4f6baa9e5fad) to identify trends or common systems being targeted, which may indicate a coordinated attack or vulnerability exploitation.

  ### Prioritization

  This alert carries a high severity due to the potential direct impact on critical system functionalities, such as security mechanisms and data recovery options. The likelihood of malicious intention is significant, particularly given the common use of task disabling as a precursor to more severe actions, including ransomware deployment and data destruction.

  ### Blind Spots and Assumptions

  This detection may miss attacks that use alternate methods to disable tasks or manipulate command line arguments to conceal their actions. The reliability of detection heavily relies on proper configurations of Windows Event Logging. Legitimate administrative tasks may trigger this alert, particularly during system maintenance activities. A companion detection, such as monitoring for modifications to scheduled tasks (similar to Event ID 4697), would enhance coverage against these attacks.

