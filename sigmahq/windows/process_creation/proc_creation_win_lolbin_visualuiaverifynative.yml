note: |
  ### Technical Context
  This detection rule identifies the execution of `VisualUiaVerifyNative.exe`, a component of the Windows Software Development Kit (SDK). Attackers may leverage this tool for Application Whitelisting (AWL) bypass techniques, making it possible to execute malicious payloads that would otherwise be blocked. The use of such legitimate tools inappropriately can suggest an adversary operating under the radar, purposely trying to exploit trust in native Windows binaries.

  The likely objective of using `VisualUiaVerifyNative.exe` is to execute unwanted applications while evading contemporary security mechanisms such as Windows Defender Application Control (WDAC). By leveraging approved binaries for illicit purposes, attackers can enhance their initial foothold or conduct post-exploitation activities without drawing attention. This activity aligns with the MITRE ATT&CK techniques of `T1218: Signed Binary Proxy Execution`, emphasizing the importance of vigilance against such tactics.

  The primary data sources relevant for this detection include:
  - Process creation events, which provide insight into the execution of software on endpoints.
  - Security logs that detail the integrity and trust of the binaries being executed.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigate process creation logs to identify instances of `VisualUiaVerifyNative.exe` executing, focusing on timestamps and parent process relationships that could indicate suspicious activity.
  - **Analyze Original File Name Attributes:** Check the properties of `VisualUiaVerifyNative.exe` to confirm its OriginalFileName and ensure it matches expected values, looking for anomalies that may suggest tampering or misuse.
  - **Correlate with Other Security Logs:** Collect data from other security tools (like EDR or AV) that might flag unusual behaviors associated with the execution of this executable, such as unexpected network communications or file writes.
  - **Evaluate Contextual Usage:** Consider the context in which the binary was executed. Identify the user and machine involved, and assess whether the execution aligns with legitimate administrative tasks or application testing.

  ### Prioritization
  This alert holds a medium severity in an enterprise environment as it highlights a potential evasion tactic commonly employed by attackers. Given its capability to undermine application security controls, any detection of this activity warrants prompt investigation to assess the scope and impact.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are incomplete or disabled on endpoints where this executable is run. The logic assumes that `VisualUiaVerifyNative.exe` would be executed in contexts that can be monitored effectively; however, sophisticated attackers might obfuscate their usage patterns. Additionally, complete logging configurations are necessary, and missing or misconfigured security products can jeopardize the effectiveness of this alert.

