  ### Technical Context

  This Sigma rule detects the execution of the `adidnsdump` utility via Python, which is typically used to enumerate DNS records from Active Directory integrated DNS zones. An attacker leveraging this tool likely aims to gather reconnaissance information about network infrastructure, specifically targeting information related to DNS records that can be utilized for further exploitation. This behavior aligns with the MITRE ATT&CK technique T1018 (Remote System Discovery) under the Discovery tactic.

  The primary telemetry source is process creation logs, specifically Windows Event ID 4688, where the creation of a new process can be tracked. If this activity is found to be malicious, it could lead to the exposure of sensitive network configurations or facilitate lateral movement. It’s important to note that the detection of this activity does NOT automatically confirm malicious intent, as legitimate administrators might use similar tools for DNS management purposes.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Event ID 4688 for process creation events that show `python.exe` running with command line arguments containing `adidnsdump`. Look for unusual use of this tool on non-administrator systems.

  - **Analyze command line arguments:** Inspect the complete command line used during the process creation. Legitimate invocations may include specific queries to legitimate DNS zones, unlike malicious attempts that could be broad or indiscriminate.

  - **Review associated network activity:** Assess network logs to identify any suspicious DNS queries made after the execution of `adidnsdump`. Look at logs for unusual patterns or queries from Event ID DNS-Query Activity logs related to potentially sensitive or unauthorized zones.

  - **Identify host and user context:** Determine if the execution was performed by a privileged user account or on a critical host typically involved in DNS management. Higher privileges increase the risk of malicious intent.

  - **Correlate with other detections:** Check for any concurrent alerts related to lateral movement or privilege escalation (e.g., alerts for Event ID 4624 for account logons) that could indicate broader compromise efforts.

  - **Audit recent changes in DNS records:** Investigate any modifications made to DNS records through the DNS management logs (Event ID 5136) to assess if the event corresponds with unauthorized changes to the DNS structure.

  ---

  ### Prioritization

  This alert should be prioritized as low severity, given its detection of potential reconnaissance activity. While DNS enumeration can indicate intent to perform further attacks, it is not a direct indicator of compromise. The likelihood of malicious use of this tool is lower compared to more aggressive exploitation techniques.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging configurations on non-domain controller environments where `adidnsdump` could be used. Furthermore, legitimate administrative tasks may trigger this alert, such as routine DNS audits. Companion detections related to abnormal DNS query patterns or unauthorized changes in DNS records should be considered to provide stronger coverage against malicious use of this tool.

