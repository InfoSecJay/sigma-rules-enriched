note: |
  ### Technical Context

  This detection captures the execution of `aspnet_compiler.exe` from atypical locations associated with ASP.NET compilation, particularly paths like `C:\Users\Public\`, `C:\AppData\Local\Temp\`, and others. Such behavior may indicate an adversary's attempt to exploit the ASP.NET framework for malicious purposes, possibly aiming to deploy web shells or other forms of web-based payloads.

  The relevant MITRE ATT&CK tactic is Execution (TA0002), specifically the technique T1127, which involves running a trusted process as a means to execute malicious code. The primary telemetry sources include process creation logs from Windows, specifically Event ID 4688 and Sysmon Event ID 1, capturing both the command being executed and its source path.

  If malicious, this behavior could lead to unauthorized application deployment or remote access. However, this detection does NOT confirm that the activity is inherently malicious; it merely indicates potential misuse of a legitimate tool.

  ### Investigation Steps

  - **Check the process creation logs:** Review Windows Event ID 4688 or Sysmon Event ID 1 for instances of `aspnet_compiler.exe`, specifically filtering for the command line that includes paths such as `C:\Users\Public\`, `C:\AppData\Local\Temp\`, and others mentioned in the detection.

  - **Inspect command line arguments:** Analyze arguments used with `aspnet_compiler.exe` in the command line to identify suspicious flags or targets. Legitimate usage often specifies valid project locations under trusted directories, unlike the suspected paths which may indicate evasion techniques.

  - **Cross-reference process parentage:** Investigate the parent process of `aspnet_compiler.exe`. If it was spawned by a script or a process like `cmd.exe` that is rarely used for ASP.NET compilations, it may suggest malicious intent.

  - **Validate the execution context:** Examine the user account under which `aspnet_compiler.exe` was executed. Alerting activity from non-administrative or less-trusted accounts can indicate potentially malicious behavior, especially if the execution location is atypical for ASP.NET operations.

  - **Look for subsequent file creations:** Check for any files created in temporary directories or web application directories immediately following the execution of `aspnet_compiler.exe`. Malicious indicators could include files with extensions typically used for web applications that were not previously part of the deployment.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on web application integrity and data confidentiality. Given the specific nature of the behavior, it poses a significant risk for exploitation if used maliciously. Moreover, the execution of `aspnet_compiler.exe` from non-standard paths is not typical and is commonly associated with weaponization attempts in environments lacking stringent controls.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate uses of `aspnet_compiler.exe` from atypical paths, such as development scenarios or troubleshooting efforts by administrators. For reliable detection, ensure logging of all process creation events is enabled across the environment. Legitimate automated scripts or CI/CD pipelines might trigger this alert if not correctly configured. A good companion detection would be monitoring the creation or modification of files in the application directories following these executions to capture broader exploitation patterns.

