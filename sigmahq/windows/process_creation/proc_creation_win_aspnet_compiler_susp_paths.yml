detection:
  selection:
    Image|contains:
    - ':\Windows\Microsoft.NET\Framework\'
    - ':\Windows\Microsoft.NET\Framework64\'
    - ':\Windows\Microsoft.NET\FrameworkArm\'
    - ':\Windows\Microsoft.NET\FrameworkArm64\'
    Image|endswith: '\aspnet_compiler.exe'
    CommandLine|contains:
            # Note: add other potential suspicious paths
    - '\Users\Public\'
    - '\AppData\Local\Temp\'
    - '\AppData\Local\Roaming\'
    - ':\Temp\'
    - ':\Windows\Temp\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the execution of `aspnet_compiler.exe` when invoked from potentially suspicious paths, such as temporary directories or user-profile folders. Attackers may leverage this tool to compile malicious ASP.NET applications into assemblies, thereby obfuscating their actions or facilitating deployment of web shells. This behavior relates to the MITRE ATT&CK technique "Compile Application" (T1127), which demonstrates a phase where an adversary prepares a malicious payload to deploy for execution.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688. If malicious, successful execution may lead to unauthorized code deployment, exfiltration, or lateral movement within the environment. It’s important to note that this detection does not confirm malicious intent on its own; legitimate use, especially in development contexts, may trigger the alert without further malicious behavior being present.

  ### Investigation Steps

  - **Review process creation logs**: Inspect Windows Event ID 4688 logs for any instances of `aspnet_compiler.exe`. Filter for the specific Image path to assess for anomalies not normally associated with application development, such as invocation from `C:\Users\Public\` or `C:\Windows\Temp\`.

  - **Examine command line arguments**: Analyze the CommandLine field for ancillary suspicious parameters or paths. Legitimate compilations typically reference project paths and build directories, while malicious ones may contain indicators of obfuscation or external URLs.

  - **Check parent process relationships**: Investigate the parent process ID to determine if `aspnet_compiler.exe` was executed from an unusual context. For instance, a parent process originating from a user application rather than a System or Management context could indicate potential abuse.

  - **Assess host role and criticality**: Ensure the flagged instance is running on a critical asset, such as a web server or application server. Higher criticality assets must have heightened scrutiny due to their exposure to the internet and potential targeting by adversaries.

  - **Validate file and network activity**: Look for temporary files created in response to the execution in folders such as `C:\AppData\Local\Temp\`. If files exhibit malicious naming patterns (e.g., obfuscation, unusual extensions) or unusual network activity is detected post-execution, this could reinforce malicious intent.

  ### Prioritization

  This alert is high severity due to the possibility of backend web exploitation or unauthorized application deployment that could lead to significant data breaches or system compromise. The risk is heightened because the exploitation of ASP.NET vulnerabilities is a known tactic employed by various threat actors.

  ### Blind Spots and Assumptions

  This detection may miss cases where legitimate applications use `aspnet_compiler.exe` from expected development directories. It assumes that critical paths and processes are appropriately monitored, which might not be the case in all environments. Log sources must be correctly configured to capture process creation telemetry consistently. Companion detections, such as monitoring file execution in known script interpreters or web server logs for abnormal traffic patterns following `aspnet_compiler.exe` execution, can enhance detection efforts.

