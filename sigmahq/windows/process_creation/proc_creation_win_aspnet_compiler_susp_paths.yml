  ---

  ### Technical Context

  This Sigma rule detects the execution of `aspnet_compiler.exe` when invoked with potentially suspicious paths, typically indicative of malicious activity involving ASP.NET applications. An attacker may use this behavior to execute malicious code or deploy web shells within a compromised system, facilitating further intrusion or persistence. It falls under the MITRE ATT&CK tactic of "Defense Evasion" (T1203) and involves technique "Exploitation for Client Execution" (T1127).

  The primary telemetry source is the Windows process creation logs, namely Security Event ID 4688. If exploited, this detection can lead to unauthorized modifications or deployment of malicious ASP.NET applications, greatly impacting application integrity and server security. However, this detection does NOT confirm that the activity is malicious on its own; legitimate ASP.NET applications may also invoke `aspnet_compiler.exe` under similar conditions.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Identify Security Event ID 4688 for the `aspnet_compiler.exe` process. Check the execution path and command line arguments for any suspicious indicators such as paths leading to `C:\Users\Public\` or `C:\Temp\`.

  - **Analyze command line parameters**: Examine the `CommandLine` field to identify any unusual switches or arguments that could suggest nefarious behavior. Look for patterns suggesting exploitation, such as encoded scripts or commands.

  - **Validate file creation**: Check for any temporary files created in `C:\Users\Public\` or `C:\Windows\Temp\` during the execution. Investigate any files with `.aspx` or `.ashx` extensions that may have been created at the same time.

  - **Correlate with user behavior**: Identify normal operational patterns for `aspnet_compiler.exe` in your environment. If this process execution is typically limited to authorized administrators, any occurrences by non-admin users may require further scrutiny.

  - **Inspect associated scheduled tasks**: Review the Windows Task Scheduler for recently created or modified tasks in `C:\Windows\System32\Tasks\`. Suspicious task execution may indicate persistence mechanisms employed by adversaries.

  - **Identify potential indicators of compromise (IoCs)**: Look for system logs related to web server anomalies or unexpected activity on web applications post-compilation. Additional context may be gathered by reviewing web server access logs for abnormal requests targeting newly compiled files.

  ---

  ### Prioritization

  This alert is high priority due to its potential impact on web application security. The execution of `aspnet_compiler.exe` from suspicious paths is a common tactic in web application exploitation, indicating an elevated likelihood of malicious intent. Given that this behavior can be weaponized to deploy web shells, the alert warrants immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited in environments where legitimate usage of `aspnet_compiler.exe` occurs frequently. Misconfigurations or lack of appropriate logging may hinder reliable detection. Additionally, benign activities, such as development operations, could trigger the alert when developers compile ASP.NET applications. A related detection to strengthen coverage is monitoring for unusual .NET assembly-loading events, which may indicate further exploitation attempts.

