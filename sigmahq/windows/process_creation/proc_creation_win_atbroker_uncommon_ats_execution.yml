title: Uncommon  Assistive Technology Applications Execution Via AtBroker.EXE
id: f24bcaea-0cd1-11eb-adc1-0242ac120002
status: test
description: Detects the start of a non built-in assistive technology 
  applications via "Atbroker.EXE".
references:
- http://www.hexacorn.com/blog/2016/07/22/beyond-good-ol-run-key-part-42/
- https://lolbas-project.github.io/lolbas/Binaries/Atbroker/
author: Mateusz Wydra, oscd.community
date: 2020-10-12
modified: 2024-03-06
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AtBroker.exe'
  - OriginalFileName: 'AtBroker.exe'
  selection_cli:
    CommandLine|contains: 'start'
  filter_main_builtin:
    CommandLine|contains:
    - 'animations'
    - 'audiodescription'
    - 'caretbrowsing'
    - 'caretwidth'
    - 'colorfiltering'
    - 'cursorindicator'
    - 'cursorscheme'
    - 'filterkeys'
    - 'focusborderheight'
    - 'focusborderwidth'
    - 'highcontrast'
    - 'keyboardcues'
    - 'keyboardpref'
    - 'livecaptions'
    - 'magnifierpane'
    - 'messageduration'
    - 'minimumhitradius'
    - 'mousekeys'
    - 'Narrator'
    - 'osk'
    - 'overlappedcontent'
    - 'showsounds'
    - 'soundsentry'
    - 'speechreco'
    - 'stickykeys'
    - 'togglekeys'
    - 'voiceaccess'
    - 'windowarranging'
    - 'windowtracking'
    - 'windowtrackingtimeout'
    - 'windowtrackingzorder'
  filter_optional_java:
    CommandLine|contains: 'Oracle_JavaAccessBridge'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate, non-default assistive technology applications execution
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of uncommon assistive technology applications via the `AtBroker.exe` process in Windows environments. Malicious actors may attempt to leverage assistive technologies to run unauthorized applications that can facilitate lateral movement, data exfiltration, or other malicious activities while blending in with legitimate system processes. Relevant MITRE ATT&CK tactics include **Defense Evasion (TA0005)** and the technique **Assistive Technology (T1218)**. The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688, which provides details about newly created processes.

  If malicious, the security impact could include unauthorized access to sensitive data or system functionality, achieving a foothold for further exploitation. Importantly, detection of this behavior does NOT confirm malicious intent on its own, as it could also represent legitimate usage of assistive technology tools.

  ### Investigation Steps

  - **Check process creation logs:** Query Windows Security Event ID 4688 to identify instances of `AtBroker.exe` executing. Look for unexpected command line arguments indicative of potential misuse.

  - **Analyze command line arguments:** Inspect the command line field for `AtBroker.exe` executions. Commands containing unusual parameters (not listed in the benign filters) are a strong indicator of malicious behavior.

  - **Identify typical benign activity:** Determine whether the environment uses known assistive technologies. Consult with stakeholders to understand what applications may use `AtBroker.exe` legitimately, cross-referencing with the known benign filters.

  - **Review related processes:** Use Sysmon Event ID 1 to correlate any child processes spawned from `AtBroker.exe`. Look for unusual behaviors or processes that are commonly associated with malware.

  - **Search for known file paths:** Validate the original file path of `AtBroker.exe`. Legitimate instances should originate from `%System32%\AtBroker.exe`; any deviations from this path could indicate tampering or misuse.

  - **Check for user context execution:** Assess the user account running `AtBroker.exe`. Elevated or system accounts executing this process unexpectedly can be a sign of misuse or compromise.

  ### Prioritization

  This alert has medium severity due to the potential for high-impact malicious activities, such as unauthorized application execution or privilege escalation. While exploits using assistive technology are less common, the likelihood of abuse exists, particularly in environments with valuable data or where attackers are evading detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate assistive technologies that could generate similar alerts, leading to false positives. Successful detection also requires that Windows process creation logging is properly configured and that the relevant Event IDs are monitored in real-time. Legitimate applications invoking `AtBroker.exe` with specific command line arguments could trigger this alert. related detections include monitoring for unusual Windows API calls that indicate interaction with accessibility features, enhancing overall detection efficacy.

