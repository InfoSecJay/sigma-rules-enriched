title: Uncommon  Assistive Technology Applications Execution Via AtBroker.EXE
id: f24bcaea-0cd1-11eb-adc1-0242ac120002
status: test
description: Detects the start of a non built-in assistive technology 
  applications via "Atbroker.EXE".
references:
- http://www.hexacorn.com/blog/2016/07/22/beyond-good-ol-run-key-part-42/
- https://lolbas-project.github.io/lolbas/Binaries/Atbroker/
author: Mateusz Wydra, oscd.community
date: 2020-10-12
modified: 2024-03-06
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AtBroker.exe'
  - OriginalFileName: 'AtBroker.exe'
  selection_cli:
    CommandLine|contains: 'start'
  filter_main_builtin:
    CommandLine|contains:
    - 'animations'
    - 'audiodescription'
    - 'caretbrowsing'
    - 'caretwidth'
    - 'colorfiltering'
    - 'cursorindicator'
    - 'cursorscheme'
    - 'filterkeys'
    - 'focusborderheight'
    - 'focusborderwidth'
    - 'highcontrast'
    - 'keyboardcues'
    - 'keyboardpref'
    - 'livecaptions'
    - 'magnifierpane'
    - 'messageduration'
    - 'minimumhitradius'
    - 'mousekeys'
    - 'Narrator'
    - 'osk'
    - 'overlappedcontent'
    - 'showsounds'
    - 'soundsentry'
    - 'speechreco'
    - 'stickykeys'
    - 'togglekeys'
    - 'voiceaccess'
    - 'windowarranging'
    - 'windowtracking'
    - 'windowtrackingtimeout'
    - 'windowtrackingzorder'
  filter_optional_java:
    CommandLine|contains: 'Oracle_JavaAccessBridge'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate, non-default assistive technology applications execution
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of non-standard assistive technology applications through the Windows `AtBroker.exe` process. Attackers may leverage this to run malicious assistive utilities to obscure their activities or manipulate user inputs. This behavior aligns with the MITRE ATT&CK tactic of **Execution** (T1203) through the technique of **User Execution** (T1218). The primary telemetry sources are Windows Process Creation logs, specifically targeting Event ID 4688, which logs process creation events including command line arguments. If the behavior is malicious, it may allow attackers an advantage in compromising user environments and evading detection strategies. This detection does NOT confirm malicious activity on its own; it only indicates that a non-standard assistive application has been invoked.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for `AtBroker.exe` execution. Confirm whether the command line invoked contains atypical arguments not related to built-in accessibility features.

  - **Verify command line arguments:** Look for command line parameters containing assistance technology features. Legitimate examples should include `Narrator`, `magnifierpane`, or similar standard items. Malicious variants will lack these.

  - **Correlate with user context:** Identify the user account associated with the `AtBroker.exe` execution to ensure it matches expected usage patterns on business-critical systems. Any unexpected user initiations should be flagged.

  - **Examine high-confidence indicators:** Look for added suspicious command line strings not contained in the allowed list (e.g., containing `powershell`, `cmd`, or other known exploitation tools).

  - **Check policy settings:** Review local group policies or Active Directory policies governing assistive technology usage if suspicious behavior is confirmed. Misconfigurations may level up the risk.

  - **Assess asset criticality:** Consider the role of the affected host (e.g., workstations vs. servers) when evaluating the impact of the detected activity and the urgency of response.

  ### Prioritization

  The severity of this alert is medium due to the risk it poses to critical systems where assistive applications are uncommon. The likelihood of malicious abuse is moderate as attackers may exploit these methods to hide their activities. While such behaviors can be weaponized, they are often less common than other exploitation techniques.

  ### Blind Spots and Assumptions

  This detection may miss edge cases where attackers utilize legitimate assistive technology tools without nefarious intent. It is reliant on detailed process creation logs, and any gaps in logging (due to misconfigurations or disabled logging) could hinder detection effectiveness. Legitimate activities, such as an accessibility software update, might trigger this alert. Companion detections involving abnormal user account behavior or unusual network activity can help confirm malicious intent and enhance coverage.

