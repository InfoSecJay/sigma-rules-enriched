title: Uncommon  Assistive Technology Applications Execution Via AtBroker.EXE
id: f24bcaea-0cd1-11eb-adc1-0242ac120002
status: test
description: Detects the start of a non built-in assistive technology applications
  via "Atbroker.EXE".
references:
- http://www.hexacorn.com/blog/2016/07/22/beyond-good-ol-run-key-part-42/
- https://lolbas-project.github.io/lolbas/Binaries/Atbroker/
author: Mateusz Wydra, oscd.community
date: 2020-10-12
modified: 2024-03-06
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: '\AtBroker.exe'
  - OriginalFileName: 'AtBroker.exe'
  selection_cli:
    CommandLine|contains: 'start'
  filter_main_builtin:
    CommandLine|contains:
    - 'animations'
    - 'audiodescription'
    - 'caretbrowsing'
    - 'caretwidth'
    - 'colorfiltering'
    - 'cursorindicator'
    - 'cursorscheme'
    - 'filterkeys'
    - 'focusborderheight'
    - 'focusborderwidth'
    - 'highcontrast'
    - 'keyboardcues'
    - 'keyboardpref'
    - 'livecaptions'
    - 'magnifierpane'
    - 'messageduration'
    - 'minimumhitradius'
    - 'mousekeys'
    - 'Narrator'
    - 'osk'
    - 'overlappedcontent'
    - 'showsounds'
    - 'soundsentry'
    - 'speechreco'
    - 'stickykeys'
    - 'togglekeys'
    - 'voiceaccess'
    - 'windowarranging'
    - 'windowtracking'
    - 'windowtrackingtimeout'
    - 'windowtrackingzorder'
  filter_optional_java:
    CommandLine|contains: 'Oracle_JavaAccessBridge'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate, non-default assistive technology applications execution
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of non-standard assistive technology applications through the AtBroker.EXE process. The AtBroker service, typically part of the Windows OS, is responsible for facilitating assistive technologies, such as screen readers and other accessibility tools. Attackers may exploit this service to execute malicious assistive technology applications to evade defenses by masquerading as legitimate processes. The primary intent could be data exfiltration, privilege escalation, or lateral movement within the environment.

  Relevant MITRE ATT&CK tactics for this rule include **Defense Evasion** (TA0005) and **Execution** (TA0002), specifically focusing on the technique **Malicious Use of Accessibility Features** (T1218). This can enable adversaries to perform actions without detection, leveraging the AtBroker service, which is generally trusted.

  The primary data source for this detection is **process creation events** on Windows systems. These logs will contain information about executed processes, including command lines and originating files, allowing responders to identify any suspicious execution patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify instances of AtBroker.EXE being executed with unusual command lines that do not align with built-in assistive technology parameters.

  - **Validate Command Line Parameters:** Cross-reference the command line arguments used in the AtBroker.EXE execution against known legitimate options. Look for anomalies or unknown assistive technology applications that may indicate an unauthorized tool.

  - **Check for Unauthorized Tools:** Investigate if any non-standard assistive technology applications (not included in the built-in filter) were executed, particularly those that could facilitate reconnaissance or lateral movement.

  - **Correlate with User Behavior:** Examine the context around the process execution, including the user account used and any related activity that occurred prior or post the execution to establish whether it aligns with normal user behavior.

  ### Prioritization
  This alert is classified with a medium severity due to the potential risk associated with unauthorized execution of assistive technology applications, which can indicate an attempt to circumvent security measures and manipulate systems for malicious purposes.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, as legitimate non-default assistive technology applications may execute without being flagged by this rule. Additionally, the rule assumes that the execution context, such as user privileges and command line inputs, will be adequately logged across all endpoints. Environments that do not maintain comprehensive process creation logs or certain Windows configurations may not capture this activity effectively. For reliable detection, ensure that Windows event logging is properly configured to capture relevant process creation events.

