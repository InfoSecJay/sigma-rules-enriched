title: Windows Recovery Environment Disabled Via Reagentc
id: db1c21e4-cd66-4b4e-85ca-590f0780529c
status: experimental
description: |
  Detects attempts to disable windows recovery environment using Reagentc.
  ReAgentc.exe is a command-line tool in Windows used to manage the Windows Recovery Environment (WinRE).
  It allows users to enable, disable, and configure WinRE, which is used for troubleshooting and repairing common boot issues.
references:
- https://www.elastic.co/security-labs/maas-appeal-an-infostealer-rises-from-the-ashes
- https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/reagentc-command-line-options?view=windows-11
author: Daniel Koifman (KoifSec), Michael Vilshin
date: 2025-07-31
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  reagentc /disable
  - Image|endswith: '\reagentc.exe'
  - OriginalFileName: 'reagentc.exe'
  selection_cli:
    CommandLine|contains|windash: '/disable'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to disable the Windows Recovery Environment (WinRE) via the command-line tool Reagentc.exe. WinRE is a critical feature in Windows, providing essential recovery capabilities for boot issues and system troubleshooting. Attackers may target this feature to hinder remediation efforts after exploiting systems, making it easier to maintain persistence or cover their tracks. The suspected threat could relate to advanced persistent threat (APT) actors or militants who are trying to disable recovery options after delivering malware or conducting system compromises.

  The primary MITRE ATT&CK tactics relevant to this detection include **Impact** (TA0040) and the technique that specifically addresses the disabling of recovery or backup processes, namely **Disable or Modify Tools** (T1490). Detecting this behavior quickly is essential, as it indicates potential malicious intent that could escalate into a full-blown compromise.

  The most effective data sources for detecting these actions are process creation logs, particularly those that provide detailed command line arguments executed on Windows systems. Monitoring logs for command line invocations of Reagentc.exe will be crucial for establishing the contexts in which this command is run.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events specifically focusing on the execution of `reagentc.exe`. Pay particular attention to the command line parameters to confirm the use of `/disable`.

  - **Correlate with User Context:** Identify the user or account initiating the command. Legitimate administrative tasks should be evaluated against baseline behaviors to filter out false positives.

  - **Check for Related Events:** Investigate any related events around the time of the command execution, such as unauthorized changes to system settings or other actions indicative of system manipulation.

  - **Assess System Recovery Status:** Verify the current status of the Windows Recovery Environment on affected machines. Look for changes in recovery options that could signify tampering or deliberate disabling of OS recovery features.

  ### Prioritization
  This alert is categorized as medium severity due to its potential impact on system recoverability. If attackers disable the Windows Recovery Environment, they may impede recovery efforts, increasing the chances of data loss or complicating incident response.

  ### Blind Spots and Assumptions
  This detection may not fully cover legitimate administrative activities where users may legitimately disable the Recovery Environment for troubleshooting or operational reasons. The detection assumes that logs for process creation are comprehensive and that logging is configured correctly on the endpoints. If logging for command-line arguments is not enabled, this rule may miss critical events, leading to gaps in detection coverage. Moreover, mechanisms that leverage alternative methods to disable WinRE outside of Reagentc.exe may not be detected by this rule.

