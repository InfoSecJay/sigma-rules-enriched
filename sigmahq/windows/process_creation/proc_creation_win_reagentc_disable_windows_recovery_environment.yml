title: Windows Recovery Environment Disabled Via Reagentc
id: db1c21e4-cd66-4b4e-85ca-590f0780529c
status: experimental
description: |
  Detects attempts to disable windows recovery environment using Reagentc.
  ReAgentc.exe is a command-line tool in Windows used to manage the Windows Recovery Environment (WinRE).
  It allows users to enable, disable, and configure WinRE, which is used for troubleshooting and repairing common boot issues.
references:
- https://www.elastic.co/security-labs/maas-appeal-an-infostealer-rises-from-the-ashes
- https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/reagentc-command-line-options?view=windows-11
author: Daniel Koifman (KoifSec), Michael Vilshin
date: 2025-07-31
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:     # Example command simulated:  reagentc /disable
  - Image|endswith: '\reagentc.exe'
  - OriginalFileName: 'reagentc.exe'
  selection_cli:
    CommandLine|contains|windash: '/disable'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context

  This rule detects the disabling of the Windows Recovery Environment (WinRE) using the command-line tool Reagentc.exe, particularly when the command line includes the parameter `/disable`. The primary objective of an attacker in this context is to reduce recovery options for the victim's system, potentially hindering incident response and forensic analysis after a compromise. This behavior aligns with the MITRE ATT&CK technique T1490 (Inhibit System Recovery).

  The main telemetry source for this detection is process creation logs from Windows. This includes capturing event IDs such as 4688, which logs the creation of a new process, and assuring that the command line is reviewed properly. If malicious, this activity could prevent recovery tooling from functioning correctly, which would complicate remediation efforts. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative users may also execute this command for valid purposes.

  ### Investigation Steps

  - **Verify the command line usage:** Check for Event ID 4688 in the Security Event logs. Look for `CommandLine` entries containing `/disable` alongside `Image` matching `reagentc.exe`. Benign instances frequently originate from system maintenance scripts or IT administrative logs.

  - **Cross-reference the user account:** Analyze the user account that executed the command. Accounts outside of established administrative roles, such as `SYSTEM` or typical IT staff, should raise suspicion. Check `SubjectUserName` in Event ID 4688.

  - **Examine recent changes to recovery settings:** Query the System logs for Event ID 1001 or check Windows recovery logs. Any prior modifications to recovery settings can indicate an ongoing attempt to avoid detection or recovery.

  - **Monitor for other suspicious behavior:** Investigate for any related malicious indicators by reviewing other logs for signs of persistence or privilege escalation, such as Event ID 4672 (Special privileges assigned to new logon).

  - **Identify legitimate commands:** Document normal administrative tasks that utilize Reagentc.exe for re-enabling WinRE after maintenance. Such context can help differentiate between benign and malicious commands.

  - **Check for system health impacts:** Evaluate the system for any abnormal boot behavior or capability degradation, indicating that WinRE's disabling may have been utilized for more destructive purposes.

  ### Prioritization

  This alert represents a medium severity due to the potential impact on recovery options for critical systems, reducing the organization's ability to respond effectively to incidents. While this command can be used legitimately, its association with adversarial tactics amplifies the urgency to investigate.

  ### Blind Spots and Assumptions

  Evasion methods include legitimate administrative users executing the command intentionally, leading to false positives. Comprehensive logging configurations must be enabled to capture relevant command-line arguments; otherwise, detection will be incomplete. Additionally, legitimate maintenance activity might trigger the alert, as administrators may disable WinRE during system preparations. A related detection worth monitoring is any unexpected re-enabling of WinRE with checks for the `/enable` parameter in command lines.

