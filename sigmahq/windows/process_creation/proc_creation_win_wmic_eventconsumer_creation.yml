note: |
  ### Technical Context

  This detection rule identifies the creation of an `ActiveScriptEventConsumer` using `WMIC.EXE`, a method often employed by attackers to establish persistence. The likely attacker objective is to enable unauthorized scripts to execute in response to system events, allowing them to maintain access after an initial compromise. This behavior maps to the MITRE ATT&CK technique `T1546.003 - Event Triggered Execution`. The primary telemetry source is Windows process creation events, focusing on event types related to WMIC executions. If successful, this action can lead to significant security implications, such as continuous unauthorized access and data exfiltration. Importantly, this detection does NOT confirm that the event consumer created is malicious, as legitimate applications may also use similar mechanisms.

  ### Investigation Steps

  - **Review WMIC command execution: ** Check for Event ID 4688 for processes running `WMIC.EXE`. Validate the command line arguments to confirm if `ActiveScriptEventConsumer` and `CREATE` are present.

  - **Identify anomalous parent processes: ** Look at the parent process for the `WMIC.EXE` instance. Legitimate instances typically originate from trusted applications or administrators, while suspicious ones may have unexpected origins (e.g., cmd.exe or PowerShell).

  - **Correlate with script execution history: ** Examine logs for Event ID 4688 or Event ID 4104 (PowerShell) for any corresponding script executions triggered by the newly created event consumer, focusing on unusual timeframes and scripts that are not standard operational tasks.

  - **Check for user privileges: ** Ensure that the user executing `WMIC.EXE` possesses valid administrative rights. This action may only be benign if performed by trusted personnel; otherwise, it may indicate escalation activities.

  - **Assess for persistence mechanisms: ** Investigate the Windows registry for any new entries under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall` or specific script execution locations related to the event consumer to confirm ongoing persistence strategies.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact on system security through unauthorized persistence. The likelihood of malicious abuse is elevated, as the creation of an `ActiveScriptEventConsumer` is not common in typical enterprise environments. This technique is often weaponized for ongoing access in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be circumvented if attackers employ obfuscation techniques or use non-standard utilities that do not trigger standard process creation logs. Reliable detection requires that Windows Management Instrumentation (WMI) logging be enabled to capture all relevant events. Legitimate software that creates event consumers in response to user interactions may generate false positives, and at least one companion detection, such as monitoring for suspicious tasks created via Task Scheduler (part of `T1053`), could enhance overall coverage against persistence mechanisms.

