note: |
  ### Technical Context
  This rule detects the creation of an ActiveScriptEventConsumer via the Windows Management Instrumentation Command-line (WMIC) utility, which is a technique commonly used by attackers to establish persistence on compromised systems. An ActiveScriptEventConsumer allows scripts to run in response to specific system events, presenting a pathway for malicious actors to maintain control over targets even after reboots or user logins. The typical attacker objective may include establishing frameworks for data exfiltration, deploying malicious payloads, or executing unauthorized commands in the system.

  This behavior aligns with various MITRE ATT&CK tactics, primarily classified under **Persistence (T1546.003)** and **Privilege Escalation (T1546)**. These tactics describe methods by which attackers persist within a system to ensure prolonged access without detection, further indicating the severity of such an alert in an enterprise environment. Primary data sources crucial for detecting this activity include process creation events that log command-line execution, as they provide direct evidence of the WMIC commands being run.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation logs for any instances of WMIC.EXE being executed with the 'ActiveScriptEventConsumer' command. Look for unusual timestamps or associated commands.
  - **Analyze Command-Line Arguments**: Examine the command-line arguments associated with WMIC executions to identify any potential indicators of malicious intent, especially in contexts where WMIC is not commonly utilized.
  - **Correlate with System Events**: Identify any recent system events that may have triggered the execution of such WMIC commands. Cross-reference these with user activity logs to detect any anomalies.
  - **Check for Unauthorized Scripts**: Investigate the script files that may have been created or modified as a result of the ActiveScriptEventConsumer. Look for suspicious script languages or content that doesn't correlate with legitimate operations.

  ### Prioritization
  This alert is deemed high severity due to the potential for establishing malicious persistence on critical systems, which can lead to further compromise, data leakage, or wider network attacks. The likelihood of exploitation increases given that WMIC is a legitimate and frequently used tool in both administrative and malicious contexts.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots regarding legitimate software that could create script event consumers for benign purposes, generating false positives. It assumes that logs for process creations, particularly command-line arguments, are enabled and adequately configured in the environment. Furthermore, the rule relies on the effectiveness of the logging format to capture all relevant WMIC activities, which may not always be comprehensive, especially in environments with restrictive logging practices.

