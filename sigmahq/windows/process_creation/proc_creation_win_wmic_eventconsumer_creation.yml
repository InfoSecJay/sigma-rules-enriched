title: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
id: ebef4391-1a81-4761-a40a-1db446c0e625
status: test
description: |
  Detects the attempt to create an ActiveScriptEventConsumer via WMIC.EXE.
  An ActiveScriptEventConsumer is a built-in Windows Management Instrumentation (WMI) class that
  automatically executes a predefined script (in VBScript or JScript) whenever a specific system event occurs.
  Adversaries often abuse ActiveScriptEventConsumer to maintain persistence on a compromised host by executing a malicious script whenever a specific event occurs.
references:
- https://twitter.com/johnlatwc/status/1408062131321270282?s=12
- https://www.fireeye.com/content/dam/fireeye-www/global/en/current-threats/pdfs/wp-windows-management-instrumentation.pdf
author: Florian Roth (Nextron Systems)
date: 2021-06-25
modified: 2026-06-19
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: 'wmic.exe'
  - Image|endswith: '\WMIC.exe'
  selection_cli:
    CommandLine|contains|all:
    - 'ActiveScriptEventConsumer'
    - ' CREATE '
  condition: all of selection_*
falsepositives:
- Legitimate software creating script event consumers
level: high
note: |
  ### Technical Context

  This rule detects attempts to create an ActiveScriptEventConsumer using WMIC.EXE, a common method for adversaries to establish persistence on a compromised system. The likely objective of the attacker is to execute a malicious script automatically in response to specific system events, thereby maintaining control over the target environment after initial access. This behavior maps to the MITRE ATT&CK tactic for Privilege Escalation (TA0004) and the technique for Using Windows Management Instrumentation (WMI) for Persistence (T1546.003).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, indicating process lifecycle events. If successful, the creation of such a consumer could lead to automatic execution of malicious scripts. This detection does NOT confirm that the created consumer is malicious on its own; it merely indicates that an attempt was made via WMIC.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 and Sysmon Event ID 1 for processes where `OriginalFileName` is `wmic.exe` and `CommandLine` contains `ActiveScriptEventConsumer` and `CREATE`. Look for unusual execution contexts.

  - **Analyze command line arguments**: Investigate the full command line used with WMIC.EXE. A legitimate use case might not include invoking `ActiveScriptEventConsumer` in relation to expected administrative tasks, which typically involve querying rather than creating consumers.

  - **Correlate with existing scripts**: Look for existing ActiveScriptEventConsumers using `Get-WmiObject -Class ActiveScriptEventConsumer`. Investigate any that may have been modified or created around the same timestamp as the alert.

  - **Identify victim host role**: Determine if the affected system has a critical role (e.g., domain controller, file server). The impact of persistence on critical systems warrants a more urgent response.

  - **Check for known indicators**: Look for behavior commonly noted in malicious activity, such as execution of scripts that perform unusual file operations (e.g., unexpected file creation or modifications) or network connections outside of normal patterns.

  - **Filter legitimate software**: Identify any previously approved applications or system processes that typically create script event consumers. If a known and vetted application is responsible, this might indicate a false positive.

  ### Prioritization

  This alert is high severity due to the potential for an attacker to sustain access and execute arbitrary code on a critical system. Given that this technique is frequently weaponized by adversaries for persistence, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may miss events if legitimate processes create ActiveScriptEventConsumers without generating alerts. It relies heavily on comprehensive logging from the Windows environment; ensure Sysmon is configured appropriately. Legitimate administrative actions or software installations can trigger this alert. Complementary detections, such as monitoring for unusual WMI queries (e.g., Event ID 4688 related to `Get-WmiObject` commands), can enhance coverage against misuse.

