note: |
  ### Technical Context
  This rule detects the execution of a renamed version of the BOINC (Berkeley Open Infrastructure for Network Computing) client. Renaming legitimate executables is a common evasion tactic used by attackers to disguise malicious activity, making this detection particularly important for identifying potential threats. The BOINC client allows users to volunteer their computer's processing power for scientific research, but it has been misused in certain attack scenarios to conduct unauthorized computing tasks, potentially leading to resource exploitation or cryptocurrency mining.

  The relevant MITRE ATT&CK tactics for this rule include **Defense Evasion** (TA0005) and **Executable File Execution** (T1553). Attackers may seek to evade detection by using legitimate software in a compromised state, altering its original binary name to sidestep traditional security measures.

  The primary data sources for this detection include **process creation events** on Windows systems. These logs provide insights into application executions, helping analysts spot any instances of the BOINC client being run with an altered name.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs to identify instances where the BOINC executable is being run. Focus on logs that indicate the full command line to determine if any parameters or changes indicate malicious intent.

  - **Check for Renaming Patterns**: Investigate the naming pattern of the executed files. Look for instances where the original file name 'BOINC.exe' has been altered. This could indicate an attempt to obscure malicious activity.

  - **Correlate with Other Metrics**: Cross-reference the detected executions with resource consumption metrics and network activity. Unusual spikes in CPU usage or outbound connections could signal that the renamed executable is performing unauthorized tasks.

  - **Examine User Context**: Assess the user account under which the BOINC binary was executed. Executions by non-administrative accounts during unusual hours or from unexpected locations should be treated as suspicious.

  ### Prioritization
  This alert is of medium severity in an enterprise environment, as the presence of a renamed BOINC client could indicate an ongoing malicious campaign that seeks to leverage enterprise resources for unauthorized computing tasks or other nefarious objectives. Quick response is warranted to mitigate potential impacts.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise if the renamed BOINC executable is run from paths that are not monitored or logged. The detection logic assumes that the only original filename of concern is 'BOINC.exe'; malicious actors can adopt different tactics to further obfuscate their activity. For this alert to function effectively, comprehensive logging of process creation events must be properly configured and enabled across all endpoint systems.

