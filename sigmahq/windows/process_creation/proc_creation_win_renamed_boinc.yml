  ---

  ### Technical Context

  This Sigma rule detects the execution of a renamed BOINC client, which can indicate an attempt by an adversary to conceal malicious activity by renaming the legitimate BOINC application. The likely attacker objective could involve leveraging the computing resources of the target environment for cryptocurrency mining or other unauthorized computations. This behavior correlates with the MITRE ATT&CK tactic "Defense Evasion" (ID T1553), where adversaries try to obscure their actions to avoid detection. The primary telemetry source is Windows process creation logs, specifically installation and execution events related to the process, including Event ID 4688 and Sysmon Event ID 1. If detected maliciously, such an event could lead to unauthorized resource usage and data breaches. However, this detection does NOT confirm that the activity is malicious on its own; it requires further investigation to determine the context of the activity.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for the execution details of the detected BOINC process, specifically looking at the Account Name, Image, and Parent Image fields. Benign instances may show legitimate user accounts and known parent processes.

  - **Validate file legitimacy:** Investigate the file properties of the identified BOINC executable. Confirm that the file’s original name is ‘BOINC.exe’ and that it has not been modified or renamed. Expected benign behavior will show the original file name from a legitimate source.

  - **Analyze network activity:** Inspect firewall or IDS logs for outbound connections from the renamed BOINC executable. Malicious indicators would include connections to suspicious IPs or domains not associated with legitimate BOINC operations, especially if connections are made to known command-and-control servers.

  - **Review task scheduler and startup locations:** Check Windows Task Scheduler and startup locations (e.g., HKCU\Software\Microsoft\Windows\CurrentVersion\Run) for entries related to the renamed BOINC executable. Legitimate BOINC installations should have their tasks listed with expected parameters.

  - **Investigate resource utilization:** Monitor CPU and bandwidth usage metrics from systems running the renamed BOINC client. Elevated CPU usage over an extended period without obvious user activity may indicate malicious use of system resources.

  - **Correlate with user behavior:** Analyze the user activity associated with the execution of BOINC. Authentic usage will typically align with times the user is known to be active, while irregular execution times (e.g., during off-hours) may suggest illicit usage.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact on performance and resource allocation, especially if the affected systems are critical infrastructure or high-value assets. There is a likelihood of malicious abuse given the common use of renamed binaries for evasion tactics, and while non-malicious use of BOINC exists, its misuse is frequently weaponized.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where adversaries use other legitimate applications renamed for similar purposes. Reliable detection requires monitoring of all process creations, and any filtering on common applications could lead to false negatives. Additionally, benign activities may arise from legitimate BOINC projects in environments where such software is permitted. A related detection that could strengthen coverage includes monitoring for unusual behavior associated with processes or checking for signs of known malicious versions of the BOINC client.

