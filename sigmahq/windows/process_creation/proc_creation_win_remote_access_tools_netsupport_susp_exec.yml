level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the NetSupport Remote Administration Tool (RAT), specifically the client32.exe executable, from an atypical directory outside of the standard installation paths (C:\Program Files or C:\Program Files (x86)). This behavior typically indicates a potential compromise where an attacker uses a known RAT to gain unauthorized access or control over a system. The likely attacker objective is remote access to the target environment for purposes such as data exfiltration or lateral movement.

  The relevant MITRE ATT&CK tactic for this detection is "Initial Access" (TA0001), specifically technique "Exploitation of Remote Services" (T1210). The primary telemetry sources include Windows process creation logs (Event ID 4688 and Sysmon Event ID 1) that can provide details about the execution context of processes. If the execution was indeed malicious, it could enable significant unauthorized access or manipulation of the system. However, this detection does NOT confirm actual unauthorized use of the tool, as legitimate instances of NetSupport may exist within a network.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 logs for the instantiation of client32.exe to confirm the process is being executed outside of expected directories.

  - **Analyze execution context:** Validate the parent process ID (PID) associated with client32.exe execution to identify its origin; legitimate executions should originate from typically allowed processes, such as a legitimate remote access session.

  - **Identify unusual parent processes:** Look for signs of abuse by correlating parent processes with Event ID 4688; if parent processes are unknown or suspicious, it raises concern for malicious activity.

  - **Assess system roles:** Verify the asset on which client32.exe is running; if it's a sensitive or critical system (e.g., Domain Controllers, servers), the alert is more severe than if it is on a non-critical user workstation.

  - **Confirm file integrity and path:** Check if client32.exe was executed from a known malicious path or temporary folder (e.g., %TEMP%). Legitimate installations should reside strictly in the defined directories.

  - **Review prior alerts or logs:** Cross-reference existing event logs and alerts for any correlated suspicious behaviors (e.g., repeated execution or failed logins) that could suggest an ongoing attack.

  ### Prioritization

  This alert is of medium severity, as the execution of a known RAT from unconventional directories could indicate an active intrusion. While not all instances are malware-related, successful exploitation is common, which increases the potential risk to the organization if confirmed malicious.

  ### Blind Spots and Assumptions

  This detection may have limitations due to various legitimate uses of NetSupport, such as authorized IT support tasks. The analysis depends heavily on the presence and integrity of execution logs, such as Windows Event IDs and Sysmon data. Other remote access tools may also trigger similar alerts, possibly reducing specificity. Companion detections could include filtering for known indicators of compromise (IoCs) related to remote access tool usage or unusual network connections.

