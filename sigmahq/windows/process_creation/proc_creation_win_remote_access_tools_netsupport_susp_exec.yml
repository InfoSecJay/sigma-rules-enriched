title: Remote Access Tool - NetSupport Execution From Unusual Location
id: 37e8d358-6408-4853-82f4-98333fca7014
status: test
description: Detects execution of client32.exe (NetSupport RAT) from an unusual location
  (outside of 'C:\Program Files')
references:
- https://redcanary.com/blog/misbehaving-rats/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-19
modified: 2024-11-23
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: '\client32.exe'
  - Product|contains: 'NetSupport Remote Control'
  - OriginalFileName|contains: 'client32.exe'
  - Hashes|contains: IMPHASH=a9d50692e95b79723f3e76fcf70d023e
  filter:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of `client32.exe`, which is associated with the NetSupport Remote Access Tool (RAT), from an unusual location that is not typically associated with standard program installation directories such as `C:\Program Files` or `C:\Program Files (x86)`. The detection is significant as it implies a risky behavior where a remote access tool might be exploited by attackers from non-standard locations, potentially indicating lateral movement within the network or unauthorized access to systems.

  In this threat scenario, an adversary leveraging a remote access tool like NetSupport could aim to establish persistence, exfiltrate sensitive data, or maintain control over compromised environments. Such tools are often utilized in penetration testing but can easily be misused by malicious actors for illicit purposes. The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1083) as the attacker attempts to obfuscate their actions by executing the tool from atypical directories.

  The primary data source will be Windows process creation events, which track when executable files are run on systems. Specifically, looking into the process logs can provide insights into the execution path and determine whether the remote access tool is being run from an authorized or suspicious location.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze windows process creation events around the time of the alert. Pay special attention to the process execution path and any related user accounts that initiated the `client32.exe` process.

  - **Collect System Information**: Gather details of the system that executed the `client32.exe`. Check for recent software installations, scheduled tasks, and services that may indicate the presence of other unauthorized software or remote access tools.

  - **Check Network Connections**: Investigate outbound network connections associated with `client32.exe`. Look for unusual connections to external IP addresses or domains that could indicate communication with a remote command-and-control server.

  - **Analyze User Activity**: Determine the user context under which `client32.exe` was executed. If it is run by an account that does not typically leverage remote access tools, highlight this anomaly for further investigation into potential compromise.

  ### Prioritization
  The severity of this alert is medium due to the potential implications of unauthorized remote access in an enterprise environment. While not every execution of `client32.exe` indicates malicious activity, its presence from an unusual location warrants further investigation, given the rising concerns around remote access tool misuse.

  ### Blind Spots and Assumptions
  This detection logic may have gaps related to environments where `client32.exe` might be legitimately used from unconventional paths, leading to potential false negatives if not covered in the filter logic. The rule assumes that the logging of process creation events is enabled and properly configured on all endpoints. Any lack of visibility into system installations, particularly in shadow IT scenarios, could limit detection accuracy. Furthermore, if the hash of `client32.exe` changes or if there is a new variant of the tool, this detection might not function as intended.

