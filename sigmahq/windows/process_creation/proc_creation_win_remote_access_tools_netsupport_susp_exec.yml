note: |
  ### Technical Context

  This Sigma rule detects the execution of `client32.exe`, associated with the NetSupport Remote Access Tool (RAT), from a location outside the standard installation directories (`C:\Program Files\` or `C:\Program Files (x86)\`). The behavior indicated can imply malicious activity, as it suggests the tool is being run from an unusual or suspicious directory, potentially indicating a compromise or misuse of remote access capabilities.

  The likely attacker objective here is unauthorized remote access to a target system, aligning with the MITRE ATT&CK tactic "Initial Access" and the technique "Remote Access Software" (T1219). The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688. If malicious, the impact could range from unauthorized data access to remote control of systems, enabling further attacks or data exfiltration. Importantly, this detection does not confirm the presence of a compromise on its own, as legitimate deployments of NetSupport could generate similar alerts.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Event ID 4688 for instances of `client32.exe` execution. Check the `New Process Name` field for paths that do not align with standard installation directories.

  - **Verify the file location:** Investigate the file path from which `client32.exe` is executed. Legitimate execution typically occurs from `C:\Program Files\NetSupport\` or a similar expected path; anything outside these directories warrants further scrutiny.

  - **Check process parentage:** Look at the `Parent Process ID` from Event ID 4688 to identify how `client32.exe` was launched. If it's initiated by a common system process (e.g., `explorer.exe`), it might be benign; however, if launched by uncommon executables, this is more suspicious.

  - **Analyze hash values:** Verify the computed hash of the executable against known signatures. The specific hash `a9d50692e95b79723f3e76fcf70d023e` should be flagged. If this does not match what is expected, consider it a high-confidence malicious indicator.

  - **Investigate for persistence mechanisms:** Look for additional artifacts such as scheduled tasks or startup entries that might indicate persistence of the remote access tool. Review `Task Scheduler` event logs (e.g., Event ID 106) or registry keys like `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`.

  ### Prioritization

  This alert should be treated with medium severity. While execution from an unusual location may indicate potential malicious use of a remote access tool, the actual impact depends on the criticality of the affected system and whether legitimate use cases exist for the NetSupport software in the environment. The likelihood of malicious abuse is moderate, especially if this behavior diverges from established baselines.

  ### Blind Spots and Assumptions

  Detection may be limited by systems where remote access tools are legitimately used for support functions, leading to false positives. Required logs include Windows process creation events (Event ID 4688), and without these, the detection may miss pertinent executions. Legitimate administrative activities (such as IT support personnel using the tool) could trigger alerts. A related detection could involve monitoring for unusual network connections originating from endpoints executing `client32.exe`, enhancing the context around potential remote access incidents.

