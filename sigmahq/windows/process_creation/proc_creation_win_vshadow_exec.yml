title: Proxy Execution via Vshadow
id: d7c75059-2901-4578-b209-8837fd31c6a8
status: experimental
description: |
  Detects the invocation of vshadow.exe with the -exec parameter that executes a specified script or command after the shadow copies are created but before the VShadow tool exits.
  VShadow is a command-line tool that you can use to create and manage volume shadow copies. While legitimate backup or administrative scripts may use this flag,
  attackers can leverage this parameter to proxy the execution of malware.
author: David Faiss
date: 2025-05-26
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vshadow/
- https://learn.microsoft.com/en-us/windows/win32/vss/vshadow-tool-and-sample
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\vshadow.exe'
  - OriginalFileName: 'vshadow.exe'
  selection_cli:
    CommandLine|contains: '-exec'
  condition: all of selection_*
falsepositives:
- System backup or administrator tools
- Legitimate administrative scripts
level: medium
note: |
  ### Technical Context

  This rule detects the execution of `vshadow.exe` with the `-exec` parameter, which suggests that an attacker is attempting to run a script or command after creating a volume shadow copy. The likely objective of the attacker is to leverage this often-overlooked mechanism to execute malware or perform unauthorized actions discreetly. This behavior is relevant to the MITRE ATT&CK framework under the tactic of Defense Evasion (T1202).

  The primary telemetry sources for this detection include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1, capturing process creation events with command line parameters. If malicious, this behavior could lead to unauthorized actions on sensitive data or systems. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks can also use the `vshadow.exe -exec` command.

  ### Investigation Steps

  - **Identify the process origin:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for `vshadow.exe`. Check the `ParentProcessName` and `ProcessCreationTime` for unusual execution patterns. Benign usage will often originate from known administrative accounts or backup scripts.

  - **Analyze command line parameters:** Examine the `CommandLine` field in the process logs for specific scripts or commands being executed after `-exec`. Look for suspicious or unexpected file paths indicating potential malware execution. Legitimate activities typically use common paths and scripts related to backup operations.

  - **Check system context:** Validate the host running `vshadow.exe`. High-risk systems, such as domain controllers or servers containing sensitive data, warrant more scrutiny. Confirm the role of the host to assess the severity of actions undertaken via `vshadow`.

  - **Identify shadow copy creation activity:** Review Windows Event ID 7045 in the System log for service start events, particularly those related to volume shadow copies creation. Ensure that this aligns with known backup schedules to distinguish between benign and malicious activities.

  - **Correlate incoming alerts:** Cross-reference this detection with alerts from other security tools, such as antivirus or EDR solutions, focusing on known malicious indicators or behavior. Look for connections to previous alerts involving command execution or lateral movement.

  ### Prioritization

  The alert is of medium priority due to the potential for significant security impact if exploited on critical systems. The likelihood of malicious abuse is moderate, particularly if the event is logged on sensitive machines where attackers may try to evade detection by leveraging existing administrative commands. The use of `vshadow.exe` with `-exec` is not commonly weaponized, making contextual analysis essential.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging for administrative actions in the environment. Attackers could use legitimate backup scripts to mask malicious behavior, representing a potential evasion technique. It is important to ensure logging for `vshadow.exe` is fully enabled and configured for reliable detection. Companion detections focusing on `vssadmin.exe` can help provide stronger coverage against volume shadow copy-related exploits.

