title: Proxy Execution via Vshadow
id: d7c75059-2901-4578-b209-8837fd31c6a8
status: experimental
description: |
  Detects the invocation of vshadow.exe with the -exec parameter that executes a specified script or command after the shadow copies are created but before the VShadow tool exits.
  VShadow is a command-line tool that you can use to create and manage volume shadow copies. While legitimate backup or administrative scripts may use this flag,
  attackers can leverage this parameter to proxy the execution of malware.
author: David Faiss
date: 2025-05-26
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vshadow/
- https://learn.microsoft.com/en-us/windows/win32/vss/vshadow-tool-and-sample
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\vshadow.exe'
  - OriginalFileName: 'vshadow.exe'
  selection_cli:
    CommandLine|contains: '-exec'
  condition: all of selection_*
falsepositives:
- System backup or administrator tools
- Legitimate administrative scripts
level: medium
note: |
  ### Technical Context
  This rule detects the execution of the `vshadow.exe` command-line tool with the `-exec` parameter. The `-exec` parameter allows an attacker to execute a specified script or command immediately after the creation of volume shadow copies. While this tool is primarily used for legitimate administrative tasks, attackers can leverage it to execute malware or other illicit commands in a stealthy manner, taking advantage of the legitimate activity to avoid detection.

  In a typical attack scenario, an adversary may use `vshadow.exe` to create shadow copies of the filesystem and execute a malicious script during the same operation, potentially facilitating data exfiltration or persistence in the environment. Such behavior falls under the MITRE ATT&CK tactics of **Defense Evasion** (ID: T1202). This method allows attackers to obscure their actions among legitimate backup processes and poses a significant risk within an enterprise environment.

  Key data sources for detection include Windows process creation logs, which provide insights into command-line arguments for processes, thereby allowing analysts to identify suspicious usages of the `vshadow.exe` tool.

  ### Investigation Steps
  - **Review Process Creation Events**: Collect logs related to process creation detailing instances of `vshadow.exe`, focusing specifically on command-line arguments that include `-exec`.
  - **Analyze Command Context**: Investigate the command that was executed with `-exec`, checking for known malicious scripts or unusual commands that could indicate malicious intent.
  - **Assess Source of Execution**: Determine the user and context under which `vshadow.exe` was executed to identify any unauthorized users or processes that may indicate compromise.
  - **Check for Associated Files**: Examine the file system for newly created or modified files corresponding to the execution context of the detected command, which may include malware or script files.

  ### Prioritization
  This alert is considered medium severity due to the potential for serious impacts if an attacker successfully leverages this tool to execute unauthorized scripts or commands. The likelihood of encountering such behavior is heightened by the tool's legitimate use in backup operations, making it crucial to investigate anomalies promptly.

  ### Blind Spots and Assumptions
  The detection coverage may not capture all instances of malicious use if the `vshadow.exe` tool is invoked without the `-exec` parameter or if other methods of execution are employed. The detection logic assumes that all instances of `vshadow.exe` executed with `-exec` are suspicious, which may not account for legitimate administrative use. The ability to detect this behavior relies on having comprehensive process creation logs enabled and accessible in the Windows environment.

