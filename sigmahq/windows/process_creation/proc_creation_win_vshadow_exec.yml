title: Proxy Execution via Vshadow
id: d7c75059-2901-4578-b209-8837fd31c6a8
status: experimental
description: |
  Detects the invocation of vshadow.exe with the -exec parameter that executes a specified script or command after the shadow copies are created but before the VShadow tool exits.
  VShadow is a command-line tool that you can use to create and manage volume shadow copies. While legitimate backup or administrative scripts may use this flag,
  attackers can leverage this parameter to proxy the execution of malware.
author: David Faiss
date: 2025-05-26
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vshadow/
- https://learn.microsoft.com/en-us/windows/win32/vss/vshadow-tool-and-sample
tags:
- attack.stealth
- attack.t1202
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '\vshadow.exe'
  - OriginalFileName: 'vshadow.exe'
  selection_cli:
    CommandLine|contains: '-exec'
  condition: all of selection_*
falsepositives:
- System backup or administrator tools
- Legitimate administrative scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `vshadow.exe` command-line tool with the `-exec` parameter, which allows for the execution of scripts or commands after creating volume shadow copies. The attacker's objective is to execute malicious payloads or scripts in a stealthy manner, leveraging the native Windows functionality to bypass detection. This behavior fits within the MITRE ATT&CK framework, specifically under the "Execution" tactic (TA0002) and the "Command and Scripting Interpreter" technique (T1059).

  Primary telemetry sources include Windows Security Event ID 4688, which logs process creation details, and Sysmon Event ID 1. If malicious, this activity can lead to significant security impacts, such as data exfiltration or unauthorized access. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate maintenance scripts may utilize this functionality.

  ### Investigation Steps

  - **Review process creation events:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 for `vshadow.exe`. Look for command-line arguments containing `-exec` to determine if the action was executed legitimately or in a suspicious context.

  - **Examine parent process relationships:** Investigate the parent process from which `vshadow.exe` was launched. Suspicious parents include command prompts or automated scripting engines, indicating possible malicious intent. An expected flow is from legitimate backups or administrative tools.

  - **Analyze command-line arguments:** Validate the specific command or script being executed after `-exec`. Malicious payloads may have obfuscated names, unusual paths, or inappropriate file extensions (e.g., `.exe` or `.bat`).

  - **Check for recent shadow copy activity:** Review Volume Shadow Copy Service logs for any unusual or unauthorized shadow copy creation timestamps that align with the suspected execution time, indicating potential misuse.

  - **Verify host role criticality:** Check the asset's role within the environment. For example, if `vshadow.exe` is running on a domain controller or critical database server, prioritize further investigation due to the potential impact.

  ### Prioritization

  This alert should be treated as medium severity due to the potential for high-impact exploits against sensitive systems. The likelihood of malicious abuse is moderate; while legitimate usages exist, the functionality can be weaponized easily by attackers. Execution of commands through `vshadow.exe` is less common but is known to be a tactic used for privileged escalation or executing malware.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative scripts triggering the alert, leading to false positives. It requires the Security Event logs (Event ID 4688) and Sysmon logs (Event ID 1) being correctly configured and ingested for reliable detection. Additionally, legitimate backup activities may utilize `vshadow.exe` with `-exec`, which is common in administrative workflows. A related detection to consider is the monitoring of suspicious PowerShell commands or abnormal user account activities that may correlate with this use case.

