note: |
  ### Technical Context
  This detection rule identifies the execution of Sysinternals ADExplorer with the "-snapshot" flag, enabling attackers to create a local copy of the Active Directory (AD) database for nefarious activities. The command can be leveraged by threat actors to exfiltrate sensitive information, such as usernames for password spraying attacks or to collect metadata for social engineering purposes. Although the snapshot does not include password hashes, it may still contain sensitive information if administrators misuse fields like comments, possibly leading to additional risks.

  This activity correlates with several MITRE ATT&CK techniques, including **T1087.002 - Account Discovery: Domain Accounts**, which involves gathering user account information, and **T1069.002 - Permission Groups Discovery**, as attackers aim to uncover the privilege settings of AD users. Additionally, this behavior could be linked to **T1482 - Domain Trust Discovery**, where attackers may seek to identify trust relationships within the domain.

  The primary data source for this detection is Windows process creation logs, which provide insights into executed commands, paths, and file names associated with the utilization of ADExplorer.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect logs related to process creation events that indicate the execution of ADExplorer. Pay particular attention to the command line arguments and paths used in the execution.

  - **Analyze Command Line Arguments**: Investigate any command line containing the "-snapshot" flag and cross-reference paths that may be associated with unusual directories (e.g., Downloads, Public, AppData, Windows Temp).

  - **Inspect File Creation Events**: Check for new files created in suspicious directories, especially those that could indicate an AD snapshot is being saved. Look for file names that may indicate AD data or logs.

  - **Assess User Activity**: Evaluate the user accounts that executed ADExplorer. Determine if these accounts have legitimate roles for running such a tool, and investigate any abnormal usage patterns.

  ### Prioritization
  Given the potential for sensitive data exfiltration and elevated privileges gained through this behavior, this alert should be considered high severity. The ability to take a snapshot of Active Directory can significantly impact enterprise security if exploited for malicious actions.

  ### Blind Spots and Assumptions
  This detection rule may not cover all potential avenues of attack, especially if the "-snapshot" flag is modified or if ADExplorer is executed via alternative methods not detected by this logic. The assumption is made that the logs for process creation and command line arguments are properly configured and collected. Additionally, if ADExplorer is executed with obfuscation or in an environment where logging is minimal, detection may be ineffective. Proper configurations must ensure that all relevant logs are available for accurate alerting.

