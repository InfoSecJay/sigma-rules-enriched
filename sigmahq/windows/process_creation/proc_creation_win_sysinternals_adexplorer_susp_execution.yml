note: |
  ### Technical Context

  This Sigma rule detects the execution of Sysinternals ADExplorer with the command line flag "-snapshot," indicating that an attempt has been made to create a local snapshot of the Active Directory database. The likely attacker objective is to extract useful information such as usernames or administrative metadata, which can be utilized for further attacks, including password spraying or social engineering. This behavior maps primarily to the MITRE ATT&CK techniques T1087.002 (Account Discovery: Active Directory) and T1482 (Execution through API), given its focus on directory enumeration and information gathering.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Event IDs 4688 (Process Creation) and Sysmon Event ID 1. If malicious, the security impact includes potential unauthorized access to sensitive user account information, thereby compromising the organization's security posture. Importantly, this detection does not confirm whether the extracted information was used maliciously or merely accessed for legitimate administrative purposes.

  ### Investigation Steps

  - **Verify Process Creation:** Check for Sysmon Event ID 1 or Security Event ID 4688 for the process creation of `ADExplorer.exe` or any of its variants. Look specifically for the command line containing `-snapshot`.

  - **Inspect Command Line Arguments:** Review the command line in the logs for the use of the `-snapshot` flag. Look for saved snapshots in locations like `C:\Users\Public\` or `C:\Windows\Temp\`.

  - **Cross-reference Users Running the Tool:** Determine which user executed the command. Legitimate administrative users may run this tool for valid purposes, so evaluate user roles and recent administrative tasks.

  - **Identify Unusual File Storage Locations:** Investigate any snapshots stored in suspicious directories (e.g., `C:\Downloads\`). Files in these areas are more likely to indicate suspicious behavior rather than standard operating procedures.

  - **Analyze Additional Artifacts:** Check for file creation metrics corresponding to snapshot files, focusing on timestamps and file size in locations noted earlier. Compare these against expected administrative activities.

  - **Evaluate User Comments in AD:** In some Active Directory setups, administrative users might inadvertently include passwords in attribute comment fields. Investigate recent comments made by high-privilege users surrounding the timestamp of the alert.

  ### Prioritization

  This alert carries a high severity due to its potential impact on critical systems and sensitive data. The likelihood of malicious abuse is significant, given that the attack technique is commonly weaponized in information-gathering phases of targeted attacks, especially against organizations relying heavily on Active Directory.

  ### Blind Spots and Assumptions

  Detection could be evaded by the legitimate use of ADExplorer for routine database management by administrators. Ensuring comprehensive logging configurations for process creation is essential for reliable detection. Legitimate activities may include routine checks by IT staff for which user information is necessary and should not automatically trigger alerts without context. A companion detection such as monitoring LDAP queries could bolster coverage and provide context to user enumeration actions.

