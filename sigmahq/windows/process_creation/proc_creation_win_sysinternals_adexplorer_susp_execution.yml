description: Detects the execution of Sysinternals ADExplorer with the 
  "-snapshot" flag in order to save a local copy of the active directory 
  database to a suspicious directory. This can be used by attackers to extract 
  data for Bloodhound, usernames for password spraying or use the meta data for 
  social engineering. The snapshot doesn't contain password hashes but there 
  have been cases, where administrators put passwords in the comment field.
