note: |
  ### Technical Context

  This Sigma rule detects specific command line patterns commonly associated with Sliver command and control (C2) implants operating on Windows systems. The behavior signifies an attempt to establish a remote management session that could enable further exploitation or data exfiltration. The likely attacker objective is to maintain persistence and control over compromised systems while evading detection.

  The relevant MITRE ATT&CK tactic for this activity is **Execution** (TA0002), with the technique being **Command-Line Interface** (T1059). The primary telemetry source for detection includes process creation logs, specifically focusing on command lines associated with Windows execution. If the activity is malicious, the security impact could range from data breaches to full system takeovers. However, this detection does NOT confirm malicious intent on its own, as legitimate scripts or administrative tasks could generate similar command lines.

  ### Investigation Steps

  - **Extract process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for instances where the command line contains '-NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8'. Identify the process name and parent process for context.

  - **Correlate with user actions**: Check for legitimate administrative tasks or user activity that could justify this command line usage. Consider normal operations for the affected user or service account over the past 72 hours for added context.

  - **Assess impacted assets**: Identify the asset's role within the network (e.g., endpoint, server) and its criticality. Determine if it handles sensitive data or applications that would attract adversaries.

  - **Identify unique identifiers**: Look for unusual command parameters or other command line flags that deviate from standard operations. A significant deviation or unfamiliar parameters can indicate malicious activity.

  - **Review network traffic**: Check for outbound connections to known malicious IPs or domains associated with Sliver C2 infrastructure. Use network logs to correlate with process execution timestamps for a complete picture.

  ### Prioritization

  The alert is of critical severity due to the potential for severe security risks on key assets. If malicious, this behavior is likely indicative of a serious intruder attempting to establish ongoing control over systems, which is a common technique used by advanced threat groups.

  ### Blind Spots and Assumptions

  Detection is limited by the ability to identify legitimate uses of similar command line patterns, which may result in false negatives. There may also be reliance on comprehensive logging configurations, specifically ensuring both Security (Event ID 4688) and Sysmon logs are enabled. Legitimate administrative scripts may trigger the alert, complicating investigations. Companion detections such as network communication to known C2 servers would bolster analysis and assist in confirming or mitigating potential threats.

