note: |
  ### Technical Context
  This rule detects specific command-line patterns characteristic of Sliver, a modern command and control (C2) framework often used by adversaries to maintain persistence and execute remote commands on compromised systems. The detection focuses on identifying the use of certain parameters, such as `-NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8`, during process creation, which may indicate that an attacker is executing scripts or commands through a Sliver implant on the victimized host.

  In a typical attack scenario, an adversary utilizing the Sliver C2 framework may aim to establish control over a target system, exfiltrate data, or pivot further into the network. Their objectives may include data theft, lateral movement, or the deployment of additional malicious payloads. The MITRE ATT&CK techniques relevant to this detection include **Command and Scripting Interpreter (T1059)**, which encompasses the use of scripting languages to execute commands on the compromised system, often with the intent to manipulate or access sensitive data.

  The primary data sources for this detection include **process creation events** from the Windows operating system, which provide insights into executed commands and their parameters. Collecting these logs will help analysts identify any suspicious behaviors associated with the Sliver C2 framework.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation events for instances where the command line contains '-NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8'. Determine if these commands originate from expected administrative or legitimate user activities.

  - **Correlate with Network Traffic:** Analyze outbound network traffic from identified processes to verify if connections are made to known or suspected C2 servers linked to Sliver. Look for unusual outbound connections that align with the identified command-line patterns.

  - **Assess User Account Activities:** Investigate any user accounts associated with the process creation events for anomalies, such as unusual logins or access to sensitive resources around the time of the detection. Additionally, evaluate if any privileged accounts have been compromised.

  - **Collect Additional Artifacts:** Gather relevant system artifacts such as memory dumps, logging from EDR solutions, and Windows Event Logs to conduct deeper analysis on the context surrounding the identified process activities.

  ### Prioritization
  This alert is marked as critical due to the high impact and likelihood associated with the use of a sophisticated C2 framework like Sliver. Effective adversary control over compromised systems can lead to significant data breaches and disruptions within an enterprise environment, underscoring the need for immediate investigation and response.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where process creation logging is not enabled or is misconfigured, which would prevent the detection from functioning correctly. Another assumption made by the detection logic is that the specific command line syntax of the Sliver implant will not change, potentially leading to missed detections if attackers modify their techniques. Ensuring that the appropriate logging configurations are in place and monitoring for variants of command line patterns is essential for comprehensive detection coverage.

