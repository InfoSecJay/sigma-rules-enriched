title: Potentially Suspicious Execution From Parent Process In Public Folder
id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
status: test
description: |
  Detects a potentially suspicious execution of a parent process located in the "\Users\Public" folder executing a child process containing references to shell or scripting binaries and commandlines.
references:
- https://redcanary.com/blog/blackbyte-ransomware/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-02-25
modified: 2024-07-12
tags:
- attack.defense-evasion
- attack.execution
- attack.t1564
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains: ':\Users\Public\'
  selection_child:
  - Image|endswith:
    - '\bitsadmin.exe'
    - '\certutil.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - CommandLine|contains:
    - 'bitsadmin'
    - 'certutil'
    - 'cscript'
    - 'mshta'
    - 'powershell'
    - 'regsvr32'
    - 'rundll32'
    - 'wscript'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects executions of child processes initiated by a parent process located in the `C:\Users\Public` folder, specifically when the child process is a known script or command-line utility often used in malicious activities. The likely objective of an attacker is to execute scripts or commands via common Windows utilities to facilitate tasks such as file transfer, executing payloads, or establishing persistence. The relevant MITRE ATT&CK tactics and techniques are Execution (TA0002) and the Defense Evasion technique T1564 (Hide Artifacts).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creation events and their attributes. If this behavior is malicious, it poses significant security risks, potentially leading to unauthorized access or compromise of systems. However, this detection does NOT confirm malicious intent solely based on a parent-child process relationship, as legitimate applications may also exhibit similar patterns.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for the indicated parent process. Ensure that the parent path is indeed `C:\Users\Public\` and note the timestamp and user account executing the process.

  - **Verify command-line arguments**: Analyze the CommandLine field of the involved child processes for suspicious parameters. For example, look for commands containing 'powershell', 'bitsadmin', or 'cscript' that do not belong to known legitimate operational scripts.

  - **Identify known benign behavior**: Determine if the child processes are being used for regular maintenance or legitimate administrative tasks. Legitimate executions may involve common administrative scripts running from the Public folder by system or authenticated users.

  - **Analyze user account activity**: Assess the user account from which the parent process was executed. Suspicious activity may be indicated if the account has a low activity history, especially in context to executing scripts or command-line binaries from the Public folder.

  - **Check for persistence artifacts**: Investigate for unusual file creations or modifications in `C:\Users\Public`, particularly executable files or scripts saved alongside common executables, as this could indicate an attempt to maintain persistence.

  - **Correlate with reconnaissance phases**: If multiple alerts are triggered in a short time frame, consider an active malicious campaign. Factor in related detections like abnormal file access patterns in User folders, which may indicate pre-attack reconnaissance or privilege escalation attempts.

  ### Prioritization

  This alert carries high severity due to the potential impact on critical systems if malicious. The execution of known scripting binaries from a common user-accessible folder can indicate exploitation or lateral movement within the network. The utility of common scripting tools suggests a high likelihood of adversarial use in this context.

  ### Blind Spots and Assumptions

  The detection may be limited by the existence of logs; if logging for process creations is not configured correctly, detections could be missed. The alert may be triggered by legitimate scripts or applications used by IT personnel. Evasion techniques include executing scripts from non-public folders or using less common binaries. Related detections, such as unusual PowerShell activity tracked via Sysmon Event ID 4104, can bolster coverage of this kind of attack behavior.

