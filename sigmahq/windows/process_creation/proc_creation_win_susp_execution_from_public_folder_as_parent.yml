title: Potentially Suspicious Execution From Parent Process In Public Folder
id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
status: test
description: |
  Detects a potentially suspicious execution of a parent process located in the "\Users\Public" folder executing a child process containing references to shell or scripting binaries and commandlines.
references:
- https://redcanary.com/blog/blackbyte-ransomware/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2022-02-25
modified: 2024-07-12
tags:
- attack.execution
- attack.stealth
- attack.t1564
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains: ':\Users\Public\'
  selection_child:
  - Image|endswith:
    - '\bitsadmin.exe'
    - '\certutil.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - CommandLine|contains:
    - 'bitsadmin'
    - 'certutil'
    - 'cscript'
    - 'mshta'
    - 'powershell'
    - 'regsvr32'
    - 'rundll32'
    - 'wscript'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where a child process, known for potential abuse, is spawned from an executable located in the public user directory. The specific binaries targeted include scripting tools and command-line utilities often leveraged by attackers to execute malicious payloads or scripts. The likely objective of the attacker is to perform actions such as data exfiltration, persistence, or payload delivery, often associated with initial access or execution phases in the attack lifecycle.

  Relevant MITRE ATT&CK tactics include Execution (T1203) and Command and Scripting Interpreter (T1059), with specific techniques addressing the use of public or shared folders for running scripts and potentially executing malicious commands. The primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688, that capture command-line arguments and parent-child process relationships. If confirmed malicious, this activity could lead to significant risks such as data loss, compromise of system integrity, or lateral movement. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications can behave similarly.

  ### Investigation Steps

  - **Review Windows Process Creation logs**: Check Event ID 4688 to analyze the child process execution, focusing on the ParentImage path (look for 'C:\Users\Public\') and the CommandLine arguments used.

  - **Identify malicious indicators**: Look for child processes such as `powershell.exe`, `bitsadmin.exe`, or `mshta.exe`. Pay attention to unusual command-line arguments indicating possible obfuscation or malicious intentions, e.g., base64 encoded commands.

  - **Cross-reference with file access logs**: Validate the presence of the parent process in the public directory by examining File Access logs. Check for creation times, user accounts, and whether the process executed aligns with typical user behavior in that directory.

  - **Determine legitimate use cases**: Review expected behavior from users who may legitimately initiate processes from the Public directory (e.g., shared scripts for IT tasks). Note typical command-line patterns and processes utilized for legitimate operations, and compare with the alert findings.

  - **Assess system context**: Evaluate the impacted host's role within the environment (e.g., a server versus a user workstation). This context can add weight to the potential severity of the detection.

  - **Check for persistence mechanisms**: Investigate any related logs or events indicating the potential for lateral movement or persistence, such as creation of scheduled tasks (Event ID 4698) or modifications to startup folders.

  ### Prioritization

  This alert is high severity due to its implication on sensitive systems within the enterprise. The public folder's usage typically indicates shared or less secured environments, making it more vulnerable to exploitation. The behaviors detected are also commonly weaponized in various ransomware schemes and exploits, warranting prompt investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative actions or benign software use, which can also invoke similar processes. Effective detection relies on having comprehensive logging enabled, particularly process creation (Event ID 4688). Legitimate activity may include organizational scripts or batch files modified to run from the Public directory. A related detection to strengthen coverage is monitoring for RDP sessions from non-administrative accounts that could initiate these processes.

