title: Potentially Suspicious Execution From Parent Process In Public Folder
id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
status: test
description: |
  Detects a potentially suspicious execution of a parent process located in the "\Users\Public" folder executing a child process containing references to shell or scripting binaries and commandlines.
references:
- https://redcanary.com/blog/blackbyte-ransomware/
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-02-25
modified: 2024-07-12
tags:
- attack.defense-evasion
- attack.execution
- attack.t1564
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains: ':\Users\Public\'
  selection_child:
  - Image|endswith:
    - '\bitsadmin.exe'
    - '\certutil.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  - CommandLine|contains:
    - 'bitsadmin'
    - 'certutil'
    - 'cscript'
    - 'mshta'
    - 'powershell'
    - 'regsvr32'
    - 'rundll32'
    - 'wscript'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious executions originating from processes located in the public directory (specifically `C:\Users\Public`). The primary focus is on parent processes that execute child processes associated with common scripting and command-line tools, such as PowerShell, bitsadmin, and cmd.exe. The scenario often indicates an attacker leveraging these tools to execute malicious actions, especially in the context of ransomware or malware deployment, as outlined in various threat research, like the BlackByte ransomware.

  The potential threat actors are typically seeking to evade defenses by executing their scripts from shared or public access directories, which are often overlooked by security measures. When successfully executed, such scripts can facilitate further exploitation, data exfiltration, or lateral movement within the environment.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Execution**: T1203 (Exploitation for Client Execution)
  - **Defense Evasion**: T1564 (Hide Artifacts)

  The main sources of telemetry for this detection will come from Windows process creation logs, which log every instance of process creation and termination, including the associated parameters and parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs to identify instances where child processes were spawned from parent processes located in `C:\Users\Public`. Look for any execution of the specified scripting binaries and tools.

  - **Inspect CommandLine Arguments**: Examine the command-line arguments of the detected child processes for suspicious patterns or parameters that could indicate malicious intentions, such as obfuscation or attempts to leverage administrative commands.

  - **Correlate with User Activities**: Check the user account context under which the processes were initiated. Determine if the actions were initiated by legitimate users or if they appear anomalous based on historical behavior.

  - **Investigate Network Connections**: Look for any outbound network connections established by the detected processes. Analyze these connections for any unusual or unauthorized access to external systems, indicating potential exfiltration or command and control (C2) communication.

  ### Prioritization
  The severity of this alert is high due to the potential for high-impact actions, such as ransomware deployment or unauthorized system manipulation. The likelihood of execution from public folders being malicious is significant, warranting immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage when legitimate scripts are run from shared folders or if there are misconfigurations that do not log all process creation events. The detection logic assumes that any process execution from this directory is suspicious, which may lead to false positives, especially in environments that utilize common administrative scripts stored in shared spaces. Proper logging and monitoring of Windows event IDs related to process creation (e.g., ID 4688) are essential for this alert to trigger accurately.

