note: |
  ### Technical Context
  This detection rule identifies the execution of the **Msxsl.exe** utility, which is a component of Microsoft's XML transformation toolkit. Although designed to process Extensible Stylesheet Language (XSL) files to transform XML data, attackers may leverage Msxsl.exe to execute arbitrary code by manipulating XSL files. This behavior can potentially bypass application whitelisting controls, leading to unauthorized activity and compromise of the host system.

  The threat scenario may involve adversaries who are attempting to exploit legitimate tools for nefarious purposes, such as executing malware or exfiltrating sensitive data through transformed outputs. This tactic aligns primarily with **MITRE ATT&CK Technique T1220: XSL Script Processing** under the **Defense Evasion** tactic, indicating that the execution of Msxsl.exe can be used to circumvent traditional security measures.

  Key log sources for gathering relevant evidence include **process creation event logs** from Windows systems, which will provide insights into when and how Msxsl.exe is being executed, along with additional contextual information from system event logs.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify instances of Msxsl.exe execution. Pay special attention to parent processes that initiated Msxsl.exe, as this could provide context on the legitimacy of the execution.

  - **Examine XSL Files Used:** Investigate the XSL files that were executed, including their source and content. Look for any anomalies or indications that these files contain malicious commands intended to manipulate system processes.

  - **Check for Whitelisting Bypasses:** Assess the application whitelisting configurations in place. Note if Msxsl.exe execution is listed as an exception and determine if the execution was intentional or malicious.

  - **Investigate System Integrity:** Consider running integrity checks on the systems from which Msxsl.exe was executed, looking for unusual modifications to files or settings that may indicate a broader compromise.

  ### Prioritization
  Given that Msxsl.exe is not a common application on standard Windows installations and can be abused for executing arbitrary code, this alert should be considered medium severity. The unexpected execution of this utility could indicate potential security risks that need immediate investigation to mitigate further exploitation.

  ### Blind Spots and Assumptions
  There is a reliance on process creation logs for detecting executions of Msxsl.exe, which may not capture all use cases, as some execution instances could be masked or obfuscated by malicious actors. This detection assumes that Msxsl.exe is not commonly used within the environment, and thus any execution can be treated with suspicion. Proper log configuration is essential for effective detection; if process creation logging is not enabled or configured correctly, these events may be missed.

