level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of **msxsl.exe**, a utility designed for processing Extensible Stylesheet Language (XSL) files, which may be misused by adversaries to execute arbitrary commands while evading standard application whitelisting mechanisms. The primary attacker objective is to leverage this execution to manipulate and access sensitive data or perform unauthorized actions on the system.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1220). The primary telemetry source is Windows process creation logs, specifically focusing on the `Image` field for instances where the value ends with `\msxsl.exe`. If executed maliciously, this behavior can compromise system integrity and breach data confidentiality. It is important to note that the detection of msxsl.exe execution does **not confirm** malicious intent on its own, as legitimate usage may occur in specific scenarios.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID **4688** and/or Sysmon Event ID **1** for `Image` paths that end with `\msxsl.exe`. Ensure to log the **ParentProcessName** to assess whether this execution was originated from a legitimate application.

  - **Assess execution context:** Verify user account details in the process logs. Identify if the user is an administrator or a service account, as this can indicate higher potential for malicious activity versus normal user operations.

  - **Review command line arguments:** Investigate the **CommandLine** field associated with the msxsl.exe execution to determine what specific XSL files were processed, as unexpected or obfuscated arguments indicate potential misuse.

  - **Examine file system changes:** Look for files created or modified around the same time as msxsl.exe execution, particularly in sensitive directories, using Windows Event ID **4663**. Malicious indicators include unexpected creations of executable or script files (e.g., `.cmd`, `.bat`, `.exe`).

  - **Identify legitimate use cases:** Confirm typical applications that may utilize msxsl.exe, such as legacy applications relying on XML processing features, to distinguish benign executions from malicious attempts.

  - **Correlate with other suspicious activities:** Identify concurrent alerts for related behaviors, such as unusual file access or command shell activity, which can imply a coordinated attack and increase the likelihood of this occurring in a malicious context.

  ### Prioritization

  The alert has medium severity due to the potential impact on sensitive data and system integrity. While msxsl.exe is not common on many systems, its use in executing arbitrary files could likely be leveraged by skilled adversaries, especially in environments lacking robust application whitelisting measures. This behavior, while less frequently weaponized, can still pose significant risks if misused.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate usage of msxsl.exe occurs, leading to potential false positives. Ensuring comprehensive logging configurations for process creation and command line arguments is necessary for reliable detection. Additionally, legitimate administrative tasks could invoke msxsl.exe, which may lead to alerts. Companion detections that strengthen coverage include monitoring for **Windows script host executions** and **PowerShell command logs**, which could indicate a broader attempt at evasion or exploitation.

