detection:
  selection:
    Image|endswith: '\msxsl.exe'
  condition: selection
falsepositives:
- Msxsl is not installed by default and is deprecated, so unlikely on most 
  systems.
# Note: If you levreage this utility please consider adding additional filters. As this is looking for "any" type of execition
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the **MSXSL.EXE** utility, a component used for processing Extensible Stylesheet Language (XSL) files, which can convert XML data into other formats. Attackers may leverage MSXSL.EXE to execute arbitrary scripts or binaries, potentially circumventing application whitelisting mechanisms. This behavior relates to the **MITRE ATT&CK** tactic **Execution** (T1200), specifically under the technique **Execution through API** (T1220). The primary telemetry sources include Windows **Process Creation** events, particularly looking for Event ID **4688** where the command line arguments may indicate a misuse of this utility. If utilized maliciously, this could enable command execution and data manipulation. Importantly, this detection does NOT alone confirm malicious intent; it indicates only that MSXSL.EXE was executed, necessitating further investigation.

  ### Investigation Steps

  - **Confirm process origin:** Check for Event ID **4688** for the process creation of `msxsl.exe` and its parent processes to determine how it was invoked. Be wary of unexplained parent processes that do not correlate with normal user activity.

  - **Review command-line arguments:** Analyze the command line in process creation logs for suspicious patterns or arguments. Valid usages typically involve benign XSL transformations; flags like `-output` or paths to unknown scripts may indicate malicious intent.

  - **Assess system role:** Identify if the system executing MSXSL.EXE is a critical asset (e.g., a server hosting sensitive data). Execution here raises the stakes for potential data compromise.

  - **Check for associated behaviors:** Investigate if the execution of MSXSL.EXE coincides with other unusual activities, such as unexpected file creations or modifications within the system (e.g., use of Event ID **4663** for file system access).

  - **Assess the environment:** Determine if MSXSL.EXE has been whitelisted in any enterprise applications or if it is on known benign application lists. This tool is usually not present in environments where it's not actively deployed.

  ### Prioritization

  The severity of alerts generated by MSXSL.EXE execution is **medium**. While this tool is deprecated and not usually found in most enterprise environments, if executed on critical systems, it could indicate an attempt to exploit vulnerabilities. This behavior could be weaponized by adversaries, particularly in targeted attacks where camouflage is required against strict application controls.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if systems are inaccurately configured or if logs do not capture all process creation events. Legitimate workflow processes involving XML transformation may trigger this alert, particularly among developers or during scheduled tasks. Compounding detection, consider correlation with logins from unusual sources to strengthen context around the alert, such as monitoring **User Logon** events (Event ID **4624**) that may coincide with the execution instance.

