title: Renamed Schtasks Execution
id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
status: experimental
description: |
  Detects the execution of renamed schtasks.exe binary, which is a legitimate Windows utility used for scheduling tasks.
  One of the very common persistence techniques is schedule malicious tasks using schtasks.exe.
  Since, it is heavily abused, it is also heavily monitored by security products. To evade detection, threat actors may rename the schtasks.exe binary to schedule their malicious tasks.
references:
- https://x.com/JangPr0/status/1932034543026065833
- https://ss64.com/nt/schtasks.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.stealth
- attack.t1036.003
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_operation:
    CommandLine|contains|windash:
    - ' /create '
    - ' /delete '
    - ' /query '
    - ' /change '
    - ' /run '
    - ' /end '
  selection_cmd_flags:
    CommandLine|contains|windash:
    - ' /tn '
    - ' /tr '
    - ' /sc '
    - ' /st '
    - ' /ru '
    - ' /fo '
  selection_pe:
    OriginalFileName: 'schtasks.exe'
  filter_main_cmd:
    CommandLine|contains: 'schtasks'
  filter_main_img:
    Image|endswith: '\schtasks.exe'
  condition: (all of selection_cmd_* and not filter_main_cmd) or (selection_pe 
    and not filter_main_img)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed version of the schtasks.exe binary, a legitimate Windows utility for scheduling tasks. Attackers may rename this binary to obscure its use, allowing them to schedule malicious tasks or maintain persistence on compromised systems. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0040), specifically technique T1036.003 (Masquerading) and T1053.005 (Scheduled Task/Job).

  The primary telemetry source is process creation logs, specifically from Windows Event ID 4688. If malicious, this behavior may facilitate unauthorized actions on endpoints, leading to data exfiltration or further compromise of the environment. Importantly, this detection does NOT confirm that malicious activity is occurring by itself; it only indicates potential misuse of the legitimate scheduling functionality.

  ### Investigation Steps

  - **Validate process execution:** Check Windows Event ID 4688 logs for the creation of processes with renamed schtasks.exe. Look for unusual command line arguments, such as ' /tn' or ' /tr', that could indicate scheduled tasks pertinent to adversarial objectives.

  - **Inspect command line arguments:** Identify and analyze the command line fields tied to the renamed schtasks.exe to ascertain its intent. Legitimate use typically involves straight task scheduling without obfuscation. Command lines containing 'windash' alongside scheduling flags may point towards suspicious activity.

  - **Monitor for persistence techniques:** Review the Windows Task Scheduler (Event ID 106) to identify any new or modified tasks associated with the renamed schtasks.exe. Legitimate task entries generally apply standard naming and parameters, while anomalies or unexpected changes could indicate malicious persistence.

  - **Identify high-confidence malicious indicators:** Look for known malicious file hashes or references to command lines that correlate to historical threat actor profiles. For instance, any execution of schtasks.exe where the file path or hash deviates from common paths warrants attention.

  - **Review user context:** Verify the user context under which schtasks.exe was executed. Execution by non-privileged accounts, especially those without a clear need for task scheduling, should be treated with high suspicion.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems and the likelihood of abuse for malicious purposes. Executions with renamed binaries have been frequently weaponized by threat actors to bypass security controls, making immediate investigation essential.

  ### Blind Spots and Assumptions

  One limitation of this detection is that legitimate software updates or management tasks could inadvertently rename binaries, leading to false positives. Reliable detection requires proper logging configuration for process creation activities, specifically monitoring for deviations in command lines. Additionally, theft of credentials or misuse of legitimate administrative tools can also trigger alerts for schtasks usage legitimately, necessitating comprehensive context for each alert. A complementary detection is monitoring for anomalous task scheduling patterns that do not align with standard operational procedures.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
