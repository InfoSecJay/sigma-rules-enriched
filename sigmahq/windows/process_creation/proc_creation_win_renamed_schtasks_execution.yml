title: Renamed Schtasks Execution
id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
status: experimental
description: |
  Detects the execution of renamed schtasks.exe binary, which is a legitimate Windows utility used for scheduling tasks.
  One of the very common persistence techniques is schedule malicious tasks using schtasks.exe.
  Since, it is heavily abused, it is also heavily monitored by security products. To evade detection, threat actors may rename the schtasks.exe binary to schedule their malicious tasks.
references:
- https://x.com/JangPr0/status/1932034543026065833
- https://ss64.com/nt/schtasks.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.defense-evasion
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1036.003
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_operation:
    CommandLine|contains|windash:
    - ' /create '
    - ' /delete '
    - ' /query '
    - ' /change '
    - ' /run '
    - ' /end '
  selection_cmd_flags:
    CommandLine|contains|windash:
    - ' /tn '
    - ' /tr '
    - ' /sc '
    - ' /st '
    - ' /ru '
    - ' /fo '
  selection_pe:
    OriginalFileName: 'schtasks.exe'
  filter_main_cmd:
    CommandLine|contains: 'schtasks'
  filter_main_img:
    Image|endswith: '\schtasks.exe'
  condition: (all of selection_cmd_* and not filter_main_cmd) or (selection_pe and
    not filter_main_img)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects instances where the legitimate Windows utility `schtasks.exe` has been renamed and misused to create, delete, or manipulate scheduled tasks on a Windows system. Threat actors may employ this technique as part of a persistence strategy, allowing them to maintain control over compromised systems while evading detection by security tools that may monitor the actual `schtasks.exe` executable. By renaming the executable, an attacker aims to obscure their actions and is therefore more likely to go unnoticed in environments where the legitimate use of `schtasks` is common.

  The attack scenario typically involves the adversary gaining initial access to a system and subsequently using the renamed `schtasks.exe` to schedule malicious tasks, which may execute payloads, harvest credentials, or perform lateral movement. Relevant MITRE ATT&CK techniques for this behavior include **T1053.005 (Scheduled Task/Job: Windows Task Scheduler)** and **T1036.003 (Masquerading: Rename System Utilities)**. The primary data sources for detection include Windows process creation events that provide insights into command line arguments and executable image names.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs for any instances of a renamed `schtasks.exe` appearing alongside command line parameters that indicate task scheduling activities (e.g., `/create`, `/delete`, `/run`).
  - **Inspect Command Line Arguments**: Focus on the command lines of any invocation of `schtasks` that do not reference the original `schtasks.exe`. Look for unusual task names that may indicate malicious intent.
  - **Correlate with Task Scheduler Events**: Check the Windows Task Scheduler event logs for any new tasks created or modified that correspond with the identified process creations for suspicious scheduled tasks.
  - **Analyze Scheduled Task Configuration**: For any identified tasks, review their configurations, particularly any unusual execution paths or credentials used that may suggest compromise or suspicious behavior.

  ### Prioritization
  This alert is deemed high severity due to the potential impact of malicious persistence mechanisms on the enterprise environment. The likelihood of such techniques being employed by attackers is significant, especially given common threats aimed at sustaining access after an initial compromise.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of using alternate scheduling executables or methods, which may bypass this specific detection rule. Additionally, the rule assumes that the renaming of the executable is conducted in a manner that aligns with the logic defined in the detection criteria. For the alert to function as intended, it requires that process creation logs are appropriately collected and retained, and that the relevant command line arguments are available in the telemetry.

