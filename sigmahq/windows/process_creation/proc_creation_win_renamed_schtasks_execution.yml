title: Renamed Schtasks Execution
id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
status: experimental
description: |
  Detects the execution of renamed schtasks.exe binary, which is a legitimate Windows utility used for scheduling tasks.
  One of the very common persistence techniques is schedule malicious tasks using schtasks.exe.
  Since, it is heavily abused, it is also heavily monitored by security products. To evade detection, threat actors may rename the schtasks.exe binary to schedule their malicious tasks.
references:
- https://x.com/JangPr0/status/1932034543026065833
- https://ss64.com/nt/schtasks.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.defense-evasion
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1036.003
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_operation:
    CommandLine|contains|windash:
    - ' /create '
    - ' /delete '
    - ' /query '
    - ' /change '
    - ' /run '
    - ' /end '
  selection_cmd_flags:
    CommandLine|contains|windash:
    - ' /tn '
    - ' /tr '
    - ' /sc '
    - ' /st '
    - ' /ru '
    - ' /fo '
  selection_pe:
    OriginalFileName: 'schtasks.exe'
  filter_main_cmd:
    CommandLine|contains: 'schtasks'
  filter_main_img:
    Image|endswith: '\schtasks.exe'
  condition: (all of selection_cmd_* and not filter_main_cmd) or (selection_pe and
    not filter_main_img)
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of a renamed `schtasks.exe` binary, a legitimate Windows executable for scheduling tasks. Attackers may rename this utility to disguise malicious activity, leveraging it for persistence, privilege escalation, or execution of additional payloads. This behavior is related to the MITRE ATT&CK technique for "Masquerading: Rename System Utilities" (T1036.003) and "Scheduled Task/Job: Schedule a Task" (T1053.005).

  The primary telemetry source consists of Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1 that provide detailed command-line invocation data. If the execution is malicious, it could enable sustained access to the system or execution of unwanted tasks. This detection does not confirm that a malicious action was taken unless paired with additional context indicating unauthorized activity.

  ---

  ### Investigation Steps

  - **Verify the command line execution:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances where the `CommandLine` contains `schtasks` but does not include the legitimate `schtasks.exe`. Look for command-line parameters such as `/create`, `/delete`, or `/run`, which are suspicious when associated with a renamed executable.

  - **Assess subprocess creation:** Determine if `schtasks.exe` is being spawned by a parent process that could suggest malicious intent, such as a PowerShell script or an executable known for evasion tactics (e.g., using `cmd.exe`). Focus on the `ParentImage` field in the event logs to identify context.

  - **Identify unusual task scheduling:** Review the scheduled tasks in Task Scheduler (`taskschd.msc`) that match the name targeted by the command line (using `/tn`). Legitimate tasks should follow organizational naming conventions and schedules, indicating they were created or modified by expected administrators.

  - **Check file details:** Validate the characteristics of the file running the commands. Look for deviations in the `OriginalFileName` field from expected `schtasks.exe` values. Any unusual hash values or file signatures should be flagged.

  - **Evaluate asset criticality:** Prioritize systems where the alert occurs, especially if they are critical infrastructure or contain sensitive data. Analyze the impact of a potential compromise on these systems.

  - **Monitor for related activity:** Keep an eye on other alerts suggesting lateral movement or system changes following the `schtasks` execution. Abnormal behaviors such as unexpected remote access or privilege escalation attempts can provide context for confirming malicious activity.

  ---

  ### Prioritization

  Given the potential for abuse of the `schtasks` utility to maintain unauthorized access or execute harmful operations, this alert should be treated with high priority. The likelihood of attacks utilizing this method is significant, as it is a commonly weaponized technique among adversaries.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker uses alternative methods for task creation or if the renaming is not correctly identified. Required log sources include detailed process creation logs, which must be enabled and correctly configured. Legitimate administrative tasks and scheduled jobs may trigger this alert, particularly during system maintenance activities. A related detection could include monitoring for the use of PowerShell scripts attempting to execute similar malicious scheduling commands.

