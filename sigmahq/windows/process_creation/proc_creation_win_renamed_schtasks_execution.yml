title: Renamed Schtasks Execution
id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
status: experimental
description: |
  Detects the execution of renamed schtasks.exe binary, which is a legitimate Windows utility used for scheduling tasks.
  One of the very common persistence techniques is schedule malicious tasks using schtasks.exe.
  Since, it is heavily abused, it is also heavily monitored by security products. To evade detection, threat actors may rename the schtasks.exe binary to schedule their malicious tasks.
references:
- https://x.com/JangPr0/status/1932034543026065833
- https://ss64.com/nt/schtasks.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
modified: 2026-10-02
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.stealth
- attack.t1036.003
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_operation:
    CommandLine|contains|windash:
    - ' /create '
    - ' /delete '
    - ' /query '
    - ' /change '
    - ' /run '
    - ' /end '
  selection_cmd_flags:
    CommandLine|contains|windash:
    - ' /tn '
    - ' /tr '
    - ' /sc '
    - ' /st '
    - ' /ru '
    - ' /fo '
  selection_pe:
    OriginalFileName: 'schtasks.exe'
  filter_main_cmd:
    CommandLine|contains: 'schtasks'
  filter_main_img:
    Image|endswith: '\schtasks.exe'
  filter_optional_cmd_openfiles:
    CommandLine|contains|all:
    - 'openfiles'
    - ' /query '
    - ' /fo'
  condition: (all of selection_cmd_* and not filter_main_cmd and not 
    filter_optional_cmd_openfiles) or (selection_pe and not filter_main_img)
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/process_creation/proc_creation_win_renamed_schtasks_execution/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed instance of the legitimate Windows utility `schtasks.exe`, which is utilized for scheduling various tasks. The likely attacker objective is to establish persistence by scheduling malicious tasks while evading detection, as the legitimate `schtasks.exe` utility is commonly monitored by security tools. The relevant MITRE ATT&CK tactics and techniques are Persistence (T1053.005) and Tactics (T1036.003) focusing on masquerading.

  Primary telemetry sources come from process creation events in Windows, particularly Security Event ID 4688 and Sysmon Event ID 1, which capture command execution details. If malicious, this behavior may lead to unauthorized task scheduling and execution of malware. Importantly, this detection does NOT confirm that the activity is malicious on its own; legitimate administrative tasks could also trigger this rule.

  ### Investigation Steps

  - **Examine process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for command line arguments associated with renamed `schtasks.exe`. Focus on non-standard file paths or modifications to the process name.

  - **Identify renamed binaries**: Check the `Image` field in process creation logs for instances of `schtasks.exe` being executed from unusual directories, which typically would not be used for system binaries (e.g., C:\Users\<user>\AppData\Local\Temp).

  - **Analyze command line arguments**: Investigate specific command line arguments used (e.g., `/create`, `/delete`, `/run`). Look for suspicious entries not commonly associated with system administration tasks.

  - **Correlate with other logs**: Verify against Windows Task Scheduler logs (Event ID 106), ensuring that no legitimate scheduled tasks align with suspect execution patterns. Legitimate usage might show common parameters within defined organizational task schedules.

  - **Review historical data**: Cross-reference with previous instances of `schtasks.exe` in system logs to determine if this is an isolated incident or part of a broader pattern indicative of compromise.

  ### Prioritization

  This alert has a high severity due to the potential impact of the affected system, as unauthorized scheduling of tasks can lead to malware deployment. Given that attackers frequently weaponize `schtasks.exe` by renaming it, there is a high likelihood of malicious abuse, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative tasks triggering this rule, potentially leading to false positives. Furthermore, if logging is insufficient or misconfigured, it could prevent capturing all necessary processes. Possible evasion techniques include using other task scheduling methods or renaming other legitimate utilities. A related detection rule to consider would be monitoring for unusual task creation patterns in Windows Task Scheduler (e.g., scheduled task execution from non-standard execution contexts).

