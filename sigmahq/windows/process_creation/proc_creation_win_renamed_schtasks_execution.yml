title: Renamed Schtasks Execution
id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
status: experimental
description: |
  Detects the execution of renamed schtasks.exe binary, which is a legitimate Windows utility used for scheduling tasks.
  One of the very common persistence techniques is schedule malicious tasks using schtasks.exe.
  Since, it is heavily abused, it is also heavily monitored by security products. To evade detection, threat actors may rename the schtasks.exe binary to schedule their malicious tasks.
references:
- https://x.com/JangPr0/status/1932034543026065833
- https://ss64.com/nt/schtasks.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.defense-evasion
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1036.003
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd_operation:
    CommandLine|contains|windash:
    - ' /create '
    - ' /delete '
    - ' /query '
    - ' /change '
    - ' /run '
    - ' /end '
  selection_cmd_flags:
    CommandLine|contains|windash:
    - ' /tn '
    - ' /tr '
    - ' /sc '
    - ' /st '
    - ' /ru '
    - ' /fo '
  selection_pe:
    OriginalFileName: 'schtasks.exe'
  filter_main_cmd:
    CommandLine|contains: 'schtasks'
  filter_main_img:
    Image|endswith: '\schtasks.exe'
  condition: (all of selection_cmd_* and not filter_main_cmd) or (selection_pe 
    and not filter_main_img)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the renamed `schtasks.exe` binary, a legitimate Windows utility for task scheduling, which has been manipulated by threat actors to maintain persistence and execute malicious tasks. Attackers aim to leverage this utility to create, modify, or delete scheduled tasks that can serve as a foothold in a target environment, potentially leading to further compromise. This behavior falls under the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and the technique **Masquerading: Renaming** (T1036.003) as well as **Scheduled Task/Job** (T1053.005).

  The primary telemetry sources include Windows process creation logs, specifically Windows Event ID 4688 (for process creation) and Sysmon Event ID 1. If a malicious instance of `schtasks.exe` is executed, it will have significant security implications, including unauthorized task execution and potential data exfiltration or manipulation. However, it’s important to note that this detection does NOT definitively confirm malicious activity on its own; further investigation is necessary to contextualize the behavior.

  ### Investigation Steps

  - **Review command line arguments used:** Examine CommandLine field in Event ID 4688 for `schtasks.exe` related operations such as `/create`, `/delete`, `/query`, or `/run`. Malicious indicators would involve unusual task names or commands targeting sensitive systems or data.

  - **Check the image path for discrepancies:** Look at Image field for `schtasks.exe` in the same Event ID; if it does not end with `\schtasks.exe`, this indicates possible tampering.

  - **Verify unusual task configurations:** Utilize PowerShell or task scheduler management tools to query existing scheduled tasks using the command `Get-ScheduledTask` and cross-reference with the log. Legitimate installations should be recognized and frequently monitored.

  - **Identify newly created tasks:** Check the Windows Task Scheduler (using `Get-ScheduledTask`) for newly established tasks that coincide with the alert; timestamps of tasks created during the alert timeframe should be correlated with the log for context.

  - **Correlate against known behavior patterns:** Compare findings against a baseline of normal scheduled tasks, focusing on any unexpected task triggers set to run on startup or during user login, which can point to potential adversarial activity.

  ### Prioritization

  This alert carries a **high severity** rating due to the potential for system compromise and task execution without user consent. The likelihood of adversarial abuse is significant, as renaming legitimate binaries for task scheduling is a common evasion technique. Given the prevalence of this tactic in past incidents, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may have limitations, such as the use of alternate methods to invoke `schtasks` or masquerade through other legitimate binaries. Ensure Windows Event Log retention settings are configured to capture process creation events for an adequate investigation timeline. Legitimate activities, such as system maintenance or updates, may also utilize these commands, potentially triggering the alert. It's recommended to complement this detection with behavioral analytics that capture abnormal task creation patterns or excessive use of administrative commands to strengthen overall security posture.

