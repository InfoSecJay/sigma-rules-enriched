logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
    - 'join*split'
            # Line 343ff
    - '( $ShellId[1]+$ShellId[13]+''x'')'
    - '( $PSHome[*]+$PSHOME[*]+'
    - '( $env:Public[13]+$env:Public[5]+''x'')'
    - '( $env:ComSpec[4,*,25]-Join'''')'
    - '[1,3]+''x''-Join'''')'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PowerShell scripts that utilize specific obfuscation techniques associated with the CrackMapExec framework. The behaviors include PowerShell commands that leverage string manipulation functions, indicating an attempt to hide malicious intent. The likely objective of an attacker using CrackMapExec is to enumerate and exploit Active Directory environments, or to deploy further payloads once they gain access.

  Relevant MITRE ATT&CK tactics include Execution (TA0002) and Defense Evasion (TA0005), with the specific techniques of Command and Scripting Interpreter (T1059.001) and Obfuscated Files or Information (T1027.005). Primary telemetry sources include process creation logs, particularly those that capture Event ID 4688 from Windows Security and Sysmon Event ID 1. If detected behavior is indeed malicious, it could enable unauthorized access to sensitive systems and data.

  This detection does NOT confirm actual exploitation or compromise on its own; it merely highlights the use of potentially suspicious obfuscation techniques.

  ### Investigation Steps

  - **Verify process creation logs**: Check Windows Security Event ID 4688 or Sysmon Event ID 1 for PowerShell process creation with applicable command lines containing obfuscation scripts. Look for `powershell.exe` or `pwsh.exe` in the Image field and confirm usage of commands with suspicious patterns.

  - **Analyze command-line arguments**: Inspect the CommandLine field for dynamic string manipulations or obfuscation patterns including 'join*split', or references to environmental variables like `$env:Public` or `$ShellId`. Malicious examples will contain segments that are unintelligible or overly complex.

  - **Validate the origin of PowerShell script**: Cross-reference the OriginalFileName field to ensure it is derived from legitimate sources. Anomalous OriginalFileName values that deviate from standard PowerShell installations could indicate tampering.

  - **Confirm known benign patterns**: Identify legitimate PowerShell scripts executed by authorized users or scheduled tasks. Commands employed for routine administration tasks (such as system monitoring or updates) should not exhibit similar obfuscation patterns.

  - **Identify anomalous network activity**: Review firewall and proxy logs for outbound connections initiated immediately following the execution of detected PowerShell commands. Look for unusual domains or IP addresses related to known C2 servers associated with CrackMapExec.

  - **Assess host criticality and role**: Determine if the affected system handles sensitive functions such as user credential storage or domain administration. Systems in these roles require elevated scrutiny due to their potential impact if compromised.

  ### Prioritization

  This alert has high severity due to the criticality of systems commonly targeted by CrackMapExec and the likelihood of malicious exploitation. As the behavior detected is characteristic of known adversary tools used in lateral movement, prioritizing this investigation is essential to prevent unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate PowerShell scripts that occasionally use similar obfuscation techniques, potentially leading to false positives. Ensure adequate logging sources are enabled, as missing Sysmon or Security logs may hinder detection capture. Additionally, some security tools may block or render obfuscated scripts harmless; thus, reviewing companion detections such as lateral movement attempts can enhance threat visibility and context.

