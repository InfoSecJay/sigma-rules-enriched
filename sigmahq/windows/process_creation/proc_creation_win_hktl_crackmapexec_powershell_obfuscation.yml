logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
    - 'join*split'
            # Line 343ff
    - '( $ShellId[1]+$ShellId[13]+''x'')'
    - '( $PSHome[*]+$PSHOME[*]+'
    - '( $env:Public[13]+$env:Public[5]+''x'')'
    - '( $env:ComSpec[4,*,25]-Join'''')'
    - '[1,3]+''x''-Join'''')'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of PowerShell commands that utilize specific obfuscation techniques characteristic of the CrackMapExec pentesting tool. The typical objective of an attacker using these techniques is to perform reconnaissance or lateral movement within a network while evading detection mechanisms. This behavior aligns with the MITRE ATT&CK tactic for Execution (TA0002) and the technique for Command and Scripting Interpreter: PowerShell (T1059.001) and Obfuscated Files or Information (T1027.005).

  The primary telemetry source is the process creation logs from Windows, specifically monitoring for events related to PowerShell (`powershell.exe` or `pwsh.exe`). If malicious, this behavior could facilitate unauthorized access or manipulation of resources across systems in a network. However, this detection does NOT confirm that a successful compromise has occurred, as obfuscation techniques can be employed in legitimate scenarios.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and/or Sysmon Event ID 1 for PowerShell executions. Look for `Image` paths ending with `\powershell.exe` or `\pwsh.exe`. If these paths are legitimate and part of known administrative tasks, they can indicate benign activity.

  - **Analyze command-line arguments:** Review the `CommandLine` field for evidence of obfuscation patterns, such as `join*split` or instances of `$ShellId` manipulations. Confirm if these patterns appear in context, or if they are atypical for the user executing the command.

  - **Validate execution context:** Determine the user and host context of the PowerShell execution. Check for similarities to known administrative scripts run by the account, helping distinguish between legitimate administrative activities and potential malicious actions.

  - **Correlate with network telemetry:** Look at related network connections during the time of the PowerShell execution. Use net log information to see if there are unusual outbound connections that coincide with the suspicious command-line activity.

  - **Cross-reference with threat intelligence:** Use intelligence feeds or threat databases to see if the detected command line or execution pattern matches documented incidents of malicious activity associated with CrackMapExec or similar tools.

  - **Inspect for file creation or modification:** Utilize the File System and Security logs to find any recent file changes or creations in conjunction with the PowerShell execution, especially in sensitive directories. Good indicators of benign behavior include known management tasks that save logs or reports in expected locations.

  ### Prioritization

  This alert is of high severity as it involves potential exploitation techniques commonly used by adversaries for lateral movement and exploitation. The impact is significant if the affected system holds critical assets or sensitive information, increasing the urgency for prompt investigation.

  ### Blind Spots and Assumptions

  The detection may be evaded through legitimate PowerShell obfuscation practices by authorized users, as benign PowerShell scripts can also utilize similar techniques for functionality. Reliable detection requires comprehensive monitoring, including ensuring that Sysmon is correctly configured along with other log sources like PowerShell script block logging. Legitimate administrative activities, such as scripted system maintenance or updates, may trigger this alert. Companion detections, such as monitoring for abnormal network connections following PowerShell executions, can help strengthen overall threat coverage.

