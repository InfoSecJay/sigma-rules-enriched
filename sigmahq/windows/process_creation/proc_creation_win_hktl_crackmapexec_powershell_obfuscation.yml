title: HackTool - CrackMapExec PowerShell Obfuscation
id: 6f8b3439-a203-45dc-a88b-abf57ea15ccf
status: test
description: The CrachMapExec pentesting framework implements a PowerShell obfuscation
  with some static strings detected by this rule.
references:
- https://github.com/byt3bl33d3r/CrackMapExec
- https://github.com/byt3bl33d3r/CrackMapExec/blob/0a49f75347b625e81ee6aa8c33d3970b5515ea9e/cme/helpers/powershell.py#L242
author: Thomas Patzke
date: 2020-05-22
modified: 2023-02-21
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1027.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  - OriginalFileName:
    - 'PowerShell.EXE'
    - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
    - 'join*split'
            # Line 343ff
    - '( $ShellId[1]+$ShellId[13]+''x'')'
    - '( $PSHome[*]+$PSHOME[*]+'
    - '( $env:Public[13]+$env:Public[5]+''x'')'
    - '( $env:ComSpec[4,*,25]-Join'''')'
    - '[1,3]+''x''-Join'''')'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of PowerShell obfuscation techniques employed by the CrackMapExec tool, which is often utilized by adversaries for lateral movement and privilege escalation within networks. The primary objective of such activities is to evade detection while executing malicious commands or accessing sensitive resources in an organization. Attackers leveraging CrackMapExec may be attempting to exploit credentials or enumerating network resources to facilitate further attacks.

  Relevant MITRE ATT&CK techniques associated with this behavior include:
  - **Execution - PowerShell (T1059.001)**: This points to the execution of PowerShell scripts, which may be obfuscated to avoid detection.
  - **Defense Evasion - Obfuscated Files or Information (T1027.005)**: This involves the use of obfuscation techniques to hide the execution of malicious scripts.

  The primary data sources for detecting this activity include Windows process creation logs, which record details about newly started processes, including PowerShell executions with their associated command lines.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs for instances of `powershell.exe` or `pwsh.exe` being executed with suspicious command line arguments or unusual patterns indicative of obfuscation.
  - **Inspect Command Line Arguments**: Focus on command lines containing strings like 'join*split' or other identified patterns from the detection logic to identify potential exploitation attempts.
  - **Check for Anomalous Powershell Usage**: Look for any recent changes in usage patterns of PowerShell on the endpoints, especially if they coincide with known unauthorized access or lateral movement activities.
  - **Cross-Reference with Known Tools**: Correlate findings with established threat intelligence about CrackMapExec and other similar tools to identify if they are being utilized in conjunction with the detected obfuscated PowerShell commands.

  ### Prioritization
  This alert should be considered high priority due to the high likelihood of impact on enterprise environments; the use of obfuscated PowerShell commands commonly indicates attempts to carry out malicious activities, such as lateral movement and exploitation of sensitive assets.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if PowerShell logging is not appropriately configured across all endpoints. The detection logic assumes that the obfuscation patterns remain constant; however, adversaries may evolve their techniques to circumvent detection. Additionally, the alert relies on the availability of process creation logs, so any gaps in log management or retention policies may hinder proper detection and investigation efforts.

