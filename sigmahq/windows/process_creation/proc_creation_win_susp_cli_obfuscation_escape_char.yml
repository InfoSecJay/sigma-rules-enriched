detection:
  selection:
    CommandLine|contains:
            # - <TAB>   # no TAB modifier in sigmac yet, so this matches <TAB> (or TAB in elasticsearch backends without DSL queries)
    - 'h^t^t^p'
    - 'h"t"t"p'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential command line obfuscation techniques by identifying specific escape characters within command parameters. Attackers may use such obfuscation to disguise malicious commands, often attempting to evade security mechanisms during execution. The likely objectives include executing payloads or conducting network communication under the radar. This aligns with the MITRE ATT&CK technique for Obfuscated Files or Information (T1140). The primary telemetry source is Windows process creation logs, specifically looking for command line arguments that contain escape sequences indicative of obfuscation. If malicious, successful exploitation can lead to unauthorized access or command execution on sensitive systems. It is important to note that this detection alone does not confirm malicious intent; legitimate users may utilize similar command line arguments.

  ### Investigation Steps

  - **Review Command Line Arguments:** Analyze the command line associated with the process using Security Event ID 4688. Look for known escape character patterns like `h^t^t^p` or `h"t"t"p`. Malicious examples typically involve these escape sequences in network-related commands, while legitimate usage often presents straightforward command lines.

  - **Correlate with Parent Process:** Check the parent process ID in Event ID 4688 to determine the originating process. Malicious indicators include unexpected parent processes (e.g., cmd.exe spawning unusual executables), whereas legitimate usage may show expected parent-child relationships.

  - **Cross-reference Execution Timing:** Investigate the execution time against other alerts or system logs. Rapid repetitive execution of similar command lines could indicate automation or exploitation attempts. Legitimate activities usually have consistent execution patterns based on user interactions.

  - **Check Process Integrity and Path:** Verify the file path of the spawned process. Malicious commands often reference files from unusual directories (e.g., temporary folders) or are executed from a non-standard location. Normal applications run from recognized directories, such as `C:\Program Files`.

  - **Assess System and User Context:** Determine the user account running the command and the host system's role. Actions from administrative accounts or critical infrastructure may warrant higher scrutiny compared to standard user actions.

  - **Examine Historical Command Line Data:** Utilize logs to explore past command executions involving similar patterns or commands. This helps establish a baseline and identify persistent threats.

  ### Prioritization

  This alert is of medium severity due to its potential to uncover command-line based attacks that might enable further exploitation. If the affected system is critical or part of the administrative domain, the risk escalates. While obfuscation is a common evasion tactic, the context of the command and behavior is crucial for determining malicious intent.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by both sophisticated command-line obfuscation techniques and environment configurations that do not log detailed command line arguments. Legitimate software development or scripting activities might trigger these alerts due to the use of escape characters in command construction. For improved coverage, companion detections include monitoring for unusual process creation events or network activity (e.g., suspicious outbound connections).

