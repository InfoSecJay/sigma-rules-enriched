note: |
  ---

  ### Technical Context

  The rule detects the execution of the `cloudflared` tool with the `tunnel cleanup` command, which is typically used to terminate or clean up existing tunnel connections. Attackers may utilize this functionality to obscure their command and control (C2) infrastructure, facilitating stealth during persistence efforts or during the removal of traces from prior activities. The relevant MITRE ATT&CK tactics and techniques are Command and Control (TA0011) and Application Layer Protocol (T1090). Primary telemetry sources include Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details. If malicious, the impact may include unauthorized external connectivity bypassing security controls. Notably, this detection does not confirm whether the command was executed with benign intent, as legitimate users may also run this command for maintenance.

  ---

  ### Investigation Steps

  - **Verify Command Line Arguments:**
    Review the process command line for `cloudflared` using Security Event ID 4688 or Sysmon Event ID 1, focusing on the presence of `tunnel` and `cleanup` flags along with `-config` or `-connector-id`. Benign executions typically involve legitimate configurations and are expected to match known usage patterns.

  - **Identify Associated Processes:**
    Check for parent-child process relationships by examining the `ParentProcessId` field in Sysmon Event ID 1. Legitimate instances usually stem from administrative tools (e.g., PowerShell, cmd.exe).

  - **Correlate with Network Activity:**
    Investigate network connection logs to check for outbound connections on non-standard ports linked to the execution time of `cloudflared`. Malicious indicators include unexpected connections to external C2 addresses.

  - **Audit User Account Context:**
    Review the user context under which the command was executed by examining the `SecurityUserID` field in Event ID 4688. Executions by unprivileged accounts or unexpected user accounts may indicate malicious activity.

  - **Check for Cleanup Activity Frequency:**
    Look for repeated or scheduled executions of the `cloudflared` cleanup command within a short timeframe, potentially indicating automated malicious behavior rather than legitimate system maintenance.

  ---

  ### Prioritization

  This alert warrants medium severity due to the potential for misuse of the `cloudflared` tool, posing risks to trusted network boundaries. The likelihood of malicious usage could increase in environments where there is frequent unauthorized outbound activity. Given the rising trend in leveraging legitimate cloud tools for nefarious activities, such behaviors should receive prompt attention.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logs relating to process creation are not properly configured or if there are attempts to obfuscate command line arguments. Legitimate administrative tasks may inadvertently trigger this alert, particularly in environments using Cloudflare for web applications. A related detection to consider is monitoring for unexpected cloud service account activity, which may correlate with tunnel operations, improving contextual understanding of potential intrusions.

