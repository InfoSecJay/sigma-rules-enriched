title: Cloudflared Tunnel Connections Cleanup
id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
status: test
description: Detects execution of the "cloudflared" tool with the tunnel 
  "cleanup" flag in order to cleanup tunnel connections.
references:
- https://github.com/cloudflare/cloudflared
- https://developers.cloudflare.com/cloudflare-one/connections/connect-apps
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-17
modified: 2023-12-21
tags:
- attack.command-and-control
- attack.t1102
- attack.t1090
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - ' tunnel '
    - 'cleanup '
    CommandLine|contains:
    - '-config '
    - '-connector-id '
  condition: selection
falsepositives:
- Legitimate usage of Cloudflared.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "cloudflared" tool with the "tunnel cleanup" flag, typically used to clean up tunnel connections established by various applications. The likely attacker objective is to remove traces of unauthorized tunnel connections that could signal command and control communications or facilitate data exfiltration.

  This activity is relevant to the following MITRE ATT&CK tactics and techniques: Command and Control (T1071) for application-layer protocols and Tunneling (T1090) for establishing covert channels. The primary telemetry source includes Windows process creation logs (Event ID 4688) to monitor instances where cloudflared is executed with specific command-line arguments. If this behavior is malicious, it could indicate an attempt to obscure ongoing malicious activities; however, it does NOT confirm that any malicious activity has occurred on its own without further context.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for cloudflared execution, filtering for command lines containing 'tunnel' and 'cleanup'. Look for unusual parent processes, which may indicate malicious intent.

  - **Identify benign cloudflared usage:** Validate the context of the command execution by checking for known operational environments or scheduled tasks that legitimately use cloudflared. Expected behavior typically involves standard configurations without obfuscated parameters.

  - **Validate recent tunnel connections:** Analyze logs for cloudflared tunnel connections via Event ID 5156 (Windows Filtering Platform) to confirm whether previous connections were established or terminated around the same time.

  - **Cross-reference with network activities:** Review network flow logs or firewall logs to identify connections to suspicious IP ranges or domains initiated by the cloudflared process. Look for anomalies in expected traffic patterns post-cleanup execution.

  - **Seek indicators of compromise (IoCs):** Investigate for high-confidence malicious indicators, such as cloudflared execution by unusual user accounts or within unexpected timeframes. Document any irregularities related to the cleanup command.

  ### Prioritization

  This alert should be taken seriously due to the potential impact on secure communication channels within the environment. The likelihood of abuse is moderate, as attackers often leverage tunneling for data exfiltration and maintaining persistence, making this behavior a common tactic in advanced attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate cloudflared use is common, leading to false positives. Ensure logging is enabled for process creation and relevant network activities to maintain visibility. Legitimate system administrators might invoke cleanup commands as part of maintenance, potentially triggering this rule. A related detection, monitoring for unexpected outbound connections initiated by cloudflared, would strengthen overall coverage against tunneling-based command and control flows.

