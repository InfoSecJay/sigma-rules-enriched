title: Cloudflared Tunnel Connections Cleanup
id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
status: test
description: Detects execution of the "cloudflared" tool with the tunnel "cleanup"
  flag in order to cleanup tunnel connections.
references:
- https://github.com/cloudflare/cloudflared
- https://developers.cloudflare.com/cloudflare-one/connections/connect-apps
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-17
modified: 2023-12-21
tags:
- attack.command-and-control
- attack.t1102
- attack.t1090
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - ' tunnel '
    - 'cleanup '
    CommandLine|contains:
    - '-config '
    - '-connector-id '
  condition: selection
falsepositives:
- Legitimate usage of Cloudflared.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the "cloudflared" tool with the "cleanup" flag, which is typically used to terminate and remove any active tunnel connections. The presence of tunnel cleanup commands can indicate potential misuse or abuse of the Cloudflare tool in an organization, which might be leveraged by attackers to conceal their activity or maintain access after initial compromise. Attackers may aim to evade detection, clean up malicious tunnels created for Command and Control (C2) purposes, or manage their network connections stealthily.

  Relevant MITRE ATT&CK tactics include **Command and Control (T1102)**, where attackers communicate with compromised systems, and **Exfiltration Over Alternative Protocol (T1090)**, which describes the methods used to transfer sensitive data through non-standard channels. The technique **Application Layer Protocol (T1572)** is also applicable, as it encompasses the use of different protocols to transport malicious communications.

  The primary data sources for this detection include **process creation events** that provide logs of command executions, capturing the specific command lines used by applications on Windows systems to identify any suspicious or unauthorized use of tools like Cloudflared.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events to pinpoint any executions of the "cloudflared" tool, especially those containing the "cleanup" flag alongside flags like "-config" and "-connector-id".
  - **Examine Network Connections:** Inspect network logs for any unusual outbound traffic that correlates with the timestamps of the detected "cloudflared" executions, focusing on connections made to external Cloudflare IPs.
  - **Identify User Context:** Determine the user account that initiated the "cloudflared" cleanup command; check for accounts with administrative privileges or other unusual access levels.
  - **Audit Configuration Files:** Investigate any associated configuration files for the "cloudflared" execution that may contain identifiers or settings that reveal potential misuse. Ensure compliance with organizational policies regarding unauthorised software use.

  ### Prioritization
  The alert is considered **medium severity** due to the potential impact of misconfiguration or unauthorized usage of cloud connection tools. The likelihood is elevated in environments where Cloudflare solutions are implemented, making it a pertinent threat to monitor closely.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where the "cloudflared" tool is executed without the specific command flags or under alternate contexts, such as automated scripts or legitimate administrative use in service management. There is an assumption that logging for process creation is adequately configured and that malicious actors will not obfuscate their command line. Ensuring that process creation logs are retained and analyzed is crucial for the effectiveness of this detection logic.

