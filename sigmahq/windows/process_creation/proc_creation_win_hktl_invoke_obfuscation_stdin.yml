  ---

  ### Technical Context

  This Sigma rule detects the obfuscated execution of PowerShell commands through the command prompt (CMD) using standard input (stdin). The likely attacker objective is to execute malicious PowerShell scripts, often to evade detection mechanisms. This behavior aligns with the MITRE ATT&CK tactics for Defense Evasion (T1027) and Execution (T1059.001).

  The primary telemetry source is process creation events on Windows systems, specifically looking for suspicious command line inputs. If the detection is confirmed malicious, it may indicate a successful exploitation attempt or lateral movement within the environment. Importantly, this detection does NOT confirm that the PowerShell execution was indeed malicious; further analysis is required to establish intent.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for recent cmd.exe process creations. Look for unusual parent-child relationships, particularly if PowerShell (Event ID 4688) is used as a target process.

  - **Analyze command line arguments:** Focus on command line arguments related to cmd.exe. Look for patterns that include "Invoke-Expression" or "DownloadString" within a larger obfuscated command. These can be found in Event ID 4688, specifically in the `NewProcessName` and `CommandLine` fields.

  - **Identify legitimate process execution:** Standard execution of cmd.exe may include routine administrative tasks like running scripts or batch files. Identify expected command patterns in the context of known scheduled tasks or administrative procedures.

  - **Correlate with network activity:** Check for simultaneous suspicious outbound network connections using logs from your firewall or proxy servers. Look for requests to known malicious domains or IPs, which could indicate the downloading of payloads via the identified command.

  - **Evaluate historical execution context:** For any identified instances of suspicious command line activity, examine the user context and history (via Windows Event Log) to confirm whether this execution aligns with known administrative behavior or legitimate user actions.

  ---

  ### Prioritization

  The alert should be classified as high severity due to the potential impact of malicious PowerShell execution on the affected system and its capability to facilitate further lateral movement or data exfiltration. Since obfuscated command execution is a commonly weaponized method among attackers, swift action is recommended.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as the use of alternative scripting languages or non-standard PowerShell execution methods. This rule requires accurate logging configurations for Security Event IDs 4688 and 4689 to enrich detection reliability. Legitimate activities that could trigger the rule include authorized administration scripts that intentionally use obfuscation for secure command execution. A companion detection to consider is monitoring for unusual PowerShell usage patterns (Event ID 4104), which can further enhance detection capabilities.

