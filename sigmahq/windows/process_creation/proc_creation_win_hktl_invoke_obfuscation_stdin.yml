note: |
  ### Technical Context

  This Sigma rule detects the obfuscated use of `cmd.exe` to execute PowerShell commands via standard input. The typical behavior involves a command line that invokes PowerShell in a way that obscures the actual execution intent, often using `Invoke-Expression` to execute remotely hosted scripts. The likely attacker objective is to execute malicious scripts while evading detection tools by obfuscating their command line inputs.

  Relevant MITRE ATT&CK tactics and techniques include Execution (T1059.001 - PowerShell) and Obfuscated Files or Information (T1027). Primary telemetry sources are process creation logs, specifically Windows Security Event ID 4688, Sysmon Event ID 1, or other process monitoring methods that log command line arguments. A successful execution of these commands could lead to unauthorized access, data exfiltration, or deployment of additional malware. This detection does NOT confirm that PowerShell was successfully executed or that the executed commands were malicious without further validation.

  ### Investigation Steps

  - **Examine Command Line and Parameters:** Review Security Event ID 4688 (or Sysmon Event ID 1) for processes matching the regex pattern in the command line. Verify if the command involves `cmd.exe /c` invoking `powershell` with obfuscated arguments.

  - **Identify Legitimate Use Cases:** Check for legitimate command line patterns used by authorized software, such as maintenance scripts or end-user scripts. Compare with policies to determine if the observed behavior fits authorized use.

  - **Correlate with Network Activity:** Inspect Windows Firewall or proxy logs for outbound connections to known malicious domains or IP addresses (DNS queries or HTTP requests made by `powershell.exe`). Successful connections post-execution may indicate malicious behavior.

  - **Check User Context and Asset Value:** Confirm the user context under which the command was executed. A high-risk user context (e.g., administrators or critical service accounts) executing such obfuscated commands should be prioritized for deeper investigation.

  - **Validate File Creation and Exfiltration Artifacts:** Look for temporary files in common script execution directory locations (e.g., %TEMP% or %APPDATA%) during the time frame of suspicious activity. Any unusual PowerShell script file downloads can be a high-confidence malicious indicator.

  ### Prioritization

  The severity of this alert is high because it targets potential malicious activity in critical enterprise environments, where compromised PowerShell execution can lead to a severe security incident. Additionally, the obfuscation of legitimate command usage indicates a higher likelihood of exploitation tactics commonly used by advanced adversaries.

  ### Blind Spots and Assumptions

  Detection is limited by the effectiveness of command line logging; if logs are not configured correctly, the detection may miss obfuscation attempts. Evasion techniques may include altering the command payload structure, using native Windows tools or trusted software to invoke PowerShell indirectly. Legitimate activities, such as scheduled IT task scripts or legitimate applications, may trigger this alert. Complementary detections to consider include monitoring for unusual PowerShell module imports or base64 command executions, which can help strengthen overall coverage.

