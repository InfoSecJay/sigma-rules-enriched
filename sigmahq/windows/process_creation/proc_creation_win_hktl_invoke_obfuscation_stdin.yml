note: |
  ### Technical Context
  This detection rule is designed to identify obfuscated attempts to execute PowerShell commands through the command line, specifically using `cmd.exe` with the `powershell` command invoked via `stdin`. Attackers may utilize such techniques to bypass security measures, leveraging obfuscation to mask malicious activity. The objective is typically to execute payloads, download malware, or perform system exploitation without raising alarms in security monitoring solutions.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), specifically under technique **PowerShell** (T1059.001), and **Defense Evasion** (TA0005) with regard to **Obfuscated Files or Information** (T1027). Both tactics demonstrate common strategies attackers use to execute code discreetly while trying to evade detection.

  The primary telemetry sources needed to effectively pull this off include process creation logs, which detail command line arguments and the processes that are initiated, as well as potential network logs during the execution that can indicate connections to external malicious resources.

  ### Investigation Steps
  - **Review Process Creation Logs:** Confirm instances of `cmd.exe` being invoked with PowerShell commands in the command line arguments. Look specifically for unusual encoding or obfuscation patterns.
  - **Analyze Command Line Arguments:** Investigate the full command line used for execution. Focus on identifying obfuscated characters, strings, or unusual syntax that might indicate an attempt to obscure the actual intent.
  - **Check Network Connections:** Assess any outbound connections made by the processes involved. Look for communications to suspicious or known malicious IP addresses or domains during the time of execution.
  - **Correlate with User Activity:** Determine if the executing user account has a legitimate use case for invoking commands in this manner. Investigate any suspicious activity around the time of the incident, including any lateral movement or privilege escalation attempts.

  ### Prioritization
  This alert carries a high severity classification due to its potential for enabling significant harm, such as data exfiltration or persistent malware installation, particularly when PowerShell is leveraged for command execution. Given the ease with which such a technique can be abused, quick response is crucial to mitigating the risks involved.

  ### Blind Spots and Assumptions
  One potential gap in this detection logic is the variability of command obfuscation techniques that attackers may use, which might not be captured by the regex pattern provided. Additionally, the detection relies on complete and correctly configured process creation logging to be effective; if logging is insufficient or disabled, the alert may fail to trigger. Furthermore, false positives can occur if legitimate administrative scripts or applications utilize similar command patterns without malicious intent, making it important for analysts to contextualize findings within user behavior and system activity.

