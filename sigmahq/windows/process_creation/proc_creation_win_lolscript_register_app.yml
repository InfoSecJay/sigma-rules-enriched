logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\cscript.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'cscript.exe'
    - 'wscript.exe'
  selection_cli:
    CommandLine|contains: '.vbs -register '     # register_app.vbs
  condition: all of selection*
falsepositives:
- Other VB scripts that leverage the same starting command line flags
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential misuse of the "register_app.vbs" script from the Windows SDK, specifically targeting how attackers may utilize this script for malicious purposes. The script's function is to register new Volume Shadow Copy Service (VSS) or Virtual Disk Service (VDS) providers as COM+ applications. In a threat scenario, attackers could abuse this functionality to install malicious DLLs that establish persistence mechanisms or facilitate unauthorized execution of code.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (TA0005)** and **Scripting (T1218)**. By exploiting legitimate scripts, adversaries can enhance their stealth and reduce the likelihood of detection. The primary data sources to monitor for this activity include process creation events for cscript.exe and wscript.exe, which would record instances where the register_app.vbs script is executed with specific command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any instances of cscript.exe or wscript.exe being executed. Focus on the OriginalFileName attribute to confirm that the script used is legitimate.

  - **Analyze Command-Line Arguments**: Investigate the command-line parameters associated with execution. Look for instances where the argument includes ‘.vbs -register’, indicating that the register_app.vbs script might be used improperly.

  - **Correlate with Run History**: Check the execution history of scripts on affected endpoints and correlate with known good usage patterns for the register_app.vbs script, noting deviations that hint at potential abuse.

  - **Identify Related File Activity**: Look for file creation or modification events related to malicious DLLs around the time the vbs script was executed. This can help identify any persistence mechanisms established by the attacker.

  ### Prioritization
  This alert has medium severity due to the potential impact of an attacker gaining persistence through the misuse of a legitimate Windows script. While the likelihood of this specific abuse may vary, the consequences of successful exploitation could significantly compromise enterprise security.

  ### Blind Spots and Assumptions
  One blind spot in this detection logic is the potential for legitimate administrative tasks to be misclassified as malicious activity, leading to false positives if other VB scripts leverage similar command-line flags. The detection assumes that the typical usage pattern of the register_app.vbs script is known and understood. Required logs include comprehensive process creation logs, and it is critical that logging is configured to capture detailed command-line arguments to ensure accurate detection.

