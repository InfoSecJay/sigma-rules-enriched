logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\cscript.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'cscript.exe'
    - 'wscript.exe'
  selection_cli:
    CommandLine|contains: '.vbs -register '     # register_app.vbs
  condition: all of selection*
falsepositives:
- Other VB scripts that leverage the same starting command line flags
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of VBScript files via Windows scripting engines (cscript.exe or wscript.exe) with command line parameters indicating the potential registration of a new volume shadow copy or disk shadow service (VSS/VDS) provider. The likely objective of an attacker leveraging this technique is to establish persistence by registering malicious DLLs as COM+ applications through the use of "register_app.vbs." This behavior fits within the MITRE ATT&CK framework under the Tactic: Execution; Technique: Scripting (T1218). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, highlighting process execution details. If malicious, the impact could be significant as it enables potential undetected persistence mechanisms within the system. It is important to note that this detection does not confirm malicious intent on its own, as legitimate administrative scripts may utilize similar commands.

  ### Investigation Steps

  - **Check the command line arguments**: Review the command line for process executions associated with cscript.exe or wscript.exe (Event ID 4688 or Sysmon Event ID 1). Look for entries containing ".vbs -register". Legitimate administrative tasks may use cscript or wscript for various functions, but be wary if seen on endpoints where such scripts are uncommonly executed.

  - **Inspect the originating script**: Locate the script file execution path and content for any instances of "register_app.vbs." Valid scripts will typically reside in development environments or known locations; check the hash against known benign scripts or the GitHub repository provided in the reference.

  - **Monitor for suspicious file creation**: Use file system logs to identify any newly created DLL files (e.g., Event ID 4663 for file creation) in conjunction with the execution of potentially malicious VBS scripts. Look for abnormal file names or locations outside of trusted directories.

  - **Cross-reference user context**: Analyze user information associated with the executed command (Event ID 4688) to determine if the process was initiated by a system account, administrator, or a compromised user account. Malicious activity may often involve standard user accounts executing administrative-like scripts.

  - **Assess impact of affected systems**: Evaluate the criticality of the host systems where the alert is triggered. Assets with high sensitivity or critical business functions should receive heightened scrutiny to ensure there is no ongoing malicious operation.

  - **Investigate historical usage**: Compare against logs of previous executions of the same VBS script by the same processes. If seen without a legitimate context earlier, it raises the likelihood of illegitimate intent.

  ### Prioritization

  This alert carries medium severity due to the operational impact on critical systems that could be exploited for persistence. The likelihood of malicious abuse is moderate, given that attackers often exploit such administrative scripts for stealthy persistence mechanisms. The technique is not uncommon among adversaries, suggesting a cautious approach to triage.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include attackers executing similar scripts with altered command-line arguments, minimizing detection. Proper log configurations must be ensured for process creation on endpoints; without them, detection becomes unreliable. Legitimate administrative activities, such as system backups or maintenance scripts, can trigger this alert. A related detection to consider is abnormal scheduling of task runs via Task Scheduler logs (Event ID 106), which may complement the coverage against persistence techniques.

