logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - '\cscript.exe'
    - '\wscript.exe'
  - OriginalFileName:
    - 'cscript.exe'
    - 'wscript.exe'
  selection_cli:
    CommandLine|contains: '.vbs -register '     # register_app.vbs
  condition: all of selection*
falsepositives:
- Other VB scripts that leverage the same starting command line flags
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the `register_app.vbs` script, which is part of the Windows SDK and can be used to register new VSS/VDS Providers as COM+ applications. Attackers may exploit this functionality to install malicious DLLs, facilitating persistence and execution of their payloads on the system. The relevant MITRE ATT&CK techniques are Defense Evasion (T1218) as adversaries attempt to bypass detection mechanisms.

  The primary telemetry sources for this detection are process creation events, specifically looking for instances of `cscript.exe` or `wscript.exe` along with command line parameters that contain `.vbs -register`. If malicious, this activity can lead to significant impacts, including unauthorized data access and system compromise. Importantly, this detection does NOT confirm malicious activity on its own, as it could be part of regular administrative functions or legitimate script execution.

  ### Investigation Steps

  - **Identify the process responsible for the alert**: Check for Security Event ID 4688 or Sysmon Event ID 1 to detect the execution of `cscript.exe` or `wscript.exe`. Validate whether the process was initiated with command line arguments indicating the use of `register_app.vbs`.

  - **Review the command line arguments**: Look for CommandLine entries containing `.vbs -register` in events related to the identified process. Compare this against known benign scripts used in configuration management.

  - **Correlate with system activity**: Examine related logs in the same time frame (Event ID 5145 for file access logs) for any changes made to system files or registration of new COM+ applications, focusing on the specific DLLs associated with `register_app.vbs`.

  - **Check for benign script usage**: Investigate instances of legitimate usage by confirming if the executed script is part of a known administrative task and correlating it with approved change control records.

  - **Identify high-confidence indicators**: Look for unusual DLL registrations that result from executing the script, using Windows Event ID 7045 to identify the addition of new service or DLL entries that are not documented.

  - **Validate for file persistence**: Check if new files were created or existing files modified in directories associated with application execution (`C:\Windows\System32\`) during the time of the event. Use file system logs to monitor for newly registered DLLs.

  ### Prioritization

  This alert is of medium severity due to the potential impact on affected systems that could allow adversaries to establish persistence. While the likelihood of such a method being malicious is moderate, it is notable that attackers commonly weaponize script-based solutions for lateral movement and exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through legitimate use of the script by administrators for benign purposes. Reliable detection requires complete logging of process creation events and command line usage. Legitimate activities that may trigger this alert include authorized system updates or administrative script runs. A related detection to enhance coverage is monitoring for abnormal COM+ registrations or changes utilizing Event ID 7001 from the Event Viewer under Component Services.

