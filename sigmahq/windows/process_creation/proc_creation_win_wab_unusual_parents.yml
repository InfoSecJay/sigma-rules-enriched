            # Add more if known
    - \WmiPrvSE.exe
    - \svchost.exe
    - \dllhost.exe
    Image|endswith:
    - '\wab.exe'
    - '\wabmig.exe'         # (Microsoft Address Book Import Tool)
  selection_child:
        # You can add specific suspicious child processes (such as cmd, powershell...) to increase the accuracy
    ParentImage|endswith:
    - '\wab.exe'
    - '\wabmig.exe'         # (Microsoft Address Book Import Tool)
  condition: 1 of selection_*
falsepositives:
- Unknown
