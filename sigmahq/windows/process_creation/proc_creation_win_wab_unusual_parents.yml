logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
            # Add more if known
    - \WmiPrvSE.exe
    - \svchost.exe
    - \dllhost.exe
    Image|endswith:
    - '\wab.exe'
    - '\wabmig.exe'         # (Microsoft Address Book Import Tool)
  selection_child:
        # You can add specific suspicious child processes (such as cmd, powershell...) to increase the accuracy
    ParentImage|endswith:
    - '\wab.exe'
    - '\wabmig.exe'         # (Microsoft Address Book Import Tool)
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies unusual process relationships involving `wab.exe` (Windows Contacts) and `wabmig.exe` (Microsoft Address Book Import Tool). These processes have been noted in connections with Bumblebee activity, which is a type of malicious loader that facilitates the execution of other payloads within compromised environments. Specifically, Bumblebee has been associated with delivering follow-on payloads after initial access, with a focus on exploiting the Windows environment to gain higher privileges and move laterally.

  The likely attacker objectives here include establishing persistence, lateral movement, and data exfiltration. By leveraging benign-looking processes like `wab.exe` and `wabmig.exe`, attackers aim to blend with legitimate activity and avoid detection. This detection rule aligns with multiple MITRE ATT&CK tactics, particularly **Execution (TA0002)** utilizing techniques such as **Process Injection (T1055)** and **Masquerading (T1036)**. The primary data sources for this rule are **Windows process creation event logs**, which provide insights into parent/child process relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for `wab.exe` and `wabmig.exe`, focusing on unusual parent processes, such as `WmiPrvSE.exe`, `svchost.exe`, or `dllhost.exe`.
  - **Analyze Recent Activity**: Investigate the timing and context of the process executions to determine if they align with previous suspicious network or user behavior.
  - **Correlate with User Activity**: Check for unusual user activity or changes to account privileges around the time these processes were executed, which may indicate lateral movement or privilege escalation attempts.
  - **Check Network Connections**: Look for any outbound connections initiated by `wab.exe` or `wabmig.exe`, which may reveal communication with known command and control servers linked to Bumblebee or other associated malware.

  ### Prioritization
  The alert is classified as high severity due to the potential impact of successful loader execution, which could lead to significant data breaches or system compromises. The likelihood of this threat is heightened by the frequency of malicious activity leveraging benign processes in enterprise environments.

  ### Blind Spots and Assumptions
  Detection may miss instances where attackers utilize different parent processes or leverage custom tooling that does not rely on `wab.exe` or `wabmig.exe`. The detection logic assumes that these processes will be invoked in common attack scenarios, but variations in attacker techniques could bypass this rule. Proper logging of process creation events is essential for effective detection; if such logs are not enabled or retained for sufficient duration, the alert may not function as intended.

