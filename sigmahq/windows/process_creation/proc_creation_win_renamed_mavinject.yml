note: |
  ### Technical Context

  This Sigma rule detects the execution of renamed instances of "Mavinject.exe," a tool commonly used for process injection. The attacker often aims to escalate privileges or maintain persistence by injecting malicious code into existing processes. This behavior is associated with the MITRE ATT&CK techniques T1218.013 (Signed Binary Proxy Execution) and T1055.001 (Process Injection).

  The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. If malicious, it could lead to unauthorized process manipulation, allowing adversaries to execute malicious activities covertly. However, this detection does NOT confirm that the executed process is malicious without additional context.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for instances where `mavinject32.exe` or `mavinject64.exe` was recently executed. Look for unusual parent processes indicating potential abuse.

  - **Analyze command line arguments:** Validate the presence of the `/INJECTRUNNING` flag in the command line of the process. Legitimate usage generally lacks this flag, while its presence indicates high confidence in potentially malicious activity.

  - **Identify parent process behavior:** Determine if the parent process of the `mavinject` execution is a known legitimate application (such as antivirus or system maintenance tools). Legitimate applications rarely invoke Mavinject.

  - **Correlate with network activity:** Examine outbound connections in firewall logs (e.g., Event ID 5156) initiated around the same time as `mavinject` execution. Look for unexpected or suspicious connections to external IPs, especially those associated with known malicious activity.

  - **Search for file presence:** Validate the existence of files created or modified at the time of `mavinject` execution by checking file system logs. Suspicious file creation may indicate an attempt at lateral movement or data exfiltration.

  ### Prioritization

  This alert has high severity due to the potential impact of process injection on critical systems. It is a common attack method utilized by adversaries, increasing the likelihood of malicious abuse. Additionally, the execution of a renamed Mavinject process raises severe security concerns, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may miss renamed versions of Mavinject or if the process is bundled into benign applications. Reliable detection requires proper logging configuration for process creation events, which could be circumvented if logging is disabled. Legitimate use cases might include trusted development or testing environments where Mavinject is employed for benign purposes. Related detections to monitor include unusual behaviors associated with the parent processes or network patterns indicative of command and control communications.

