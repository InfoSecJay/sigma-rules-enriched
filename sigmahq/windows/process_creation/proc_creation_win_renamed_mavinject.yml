note: |
  ### Technical Context

  This Sigma rule detects the execution of the renamed Mavinject executable (mavinject32.exe or mavinject64.exe), which can be used for process injection using the "/INJECTRUNNING" flag. The likely attacker objective is to inject code into a legitimate process to avoid detection and maintain persistence or achieve privilege escalation. Relevant MITRE ATT&CK tactics include "Privilege Escalation" (TA0004) and "Execution" (TA0002), specifically technique T1218.013 (Signed Binary Proxy Execution) and T1055.001 (Process Injection: DLL Injection).

  The primary telemetry sources for this detection include process creation logs from Windows, typically identified by Security Event ID 4688 and Sysmon Event ID 1. If the behavior is malicious, it could lead to unauthorized access and control over a system. However, this detection alone does not confirm malicious intent or success; it merely indicates that a renamed Mavinject executable was executed.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for the occurrence of the renamed Mavinject executables. Look for entries with the Image field containing 'mavinject32.exe' or 'mavinject64.exe'.

  - **Examine execution context:** Validate the command-line arguments used with the process execution. Specifically, assess the use of any flags like "/INJECTRUNNING" in the CommandLine field, as their presence can indicate malicious intent.

  - **Correlate with known environment:** Identify if the executing process aligns with expected operations on the asset in question. If the process was executed by a known user or system account performing legitimate functions, it may be benign.

  - **Identify parent process:** Analyze the ParentProcessId in the event log to determine which process initiated the Mavinject execution. Common legitimate process parents would include system utilities or administrative functions, while suspicious parents could be less common binaries.

  - **Inspect file properties:** Verify the file properties and hash of the executed Mavinject instance against known indicators. Significant deviations from expected SHA256 hashes or digital signatures could indicate malicious manipulation.

  - **Audit network activity:** Review network logs for any outbound connections initiated by the process around the time of execution. Unexpected traffic could point to an attempt at data exfiltration or establishing command and control.

  ### Prioritization

  This alert is considered high severity due to the significant risk associated with process injection capabilities, which can lead to privilege escalation and unauthorized actions within an enterprise environment. The likelihood of malicious use is high given the specific context of Mavinject, a tool often leveraged by adversaries for evasion and malicious control.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of process creation logs if Sysmon or appropriate auditing is not enabled. Legitimate activities such as software updates or specific administrative scripts may inadvertently trigger the alert. A related detection to enhance coverage would include monitoring for unusual parent-child process relationships, which can help to identify suspicious process creation contexts.

