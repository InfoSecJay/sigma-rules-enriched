title: Potentially Suspicious Rundll32.EXE Execution of UDL File
id: 0ea52357-cd59-4340-9981-c46c7e900428
status: test
description: |
  Detects the execution of rundll32.exe with the oledb32.dll library to open a UDL file.
  Threat actors can abuse this technique as a phishing vector to capture authentication credentials or other sensitive data.
references:
- https://trustedsec.com/blog/oops-i-udld-it-again
author: '@kostastsale'
date: 2024-08-16
tags:
- attack.defense-evasion
- attack.execution
- attack.command-and-control
- attack.t1218.011
- attack.t1071
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\explorer.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'oledb32.dll'
    - ',OpenDSLFile '
    - '\\Users\\*\\Downloads\\'         # Note: You can adjust the path to the download directory or other directories according to your environment.
    CommandLine|endswith: '.udl'
  condition: all of selection_*
falsepositives:
- UDL files serve as a convenient and flexible tool for managing and testing 
  database connections in various development and administrative scenarios.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of `rundll32.exe` utilizing the `oledb32.dll` library to open a User Defined Link (UDL) file. Such behavior is potentially indicative of an attacker attempting to exploit a legitimate Windows component for malicious purposes, often as a method for phishing to collect sensitive information.

  The relevant MITRE ATT&CK techniques involved are Execution (T1203) and Defense Evasion (T1218.011). The primary telemetry source is Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1 to capture process activity and command-line arguments related to `rundll32.exe`.

  If executed in a malicious context, this behavior can allow an attacker to interact with the user’s credentials or other sensitive data. Importantly, while this detection flags suspicious activity, it does NOT confirm that the activity is malicious on its own; legitimate administrative actions could also trigger the rule.

  ### Investigation Steps

  - **Review command-line arguments:** Inspect the command line of the detected process using Security Event ID 4688. Check for `oledb32.dll` and ensure it contains `,OpenDSLFile ` followed by `.udl`. Legitimate usage may involve valid database connections; malicious activity typically exploits unusual or unexpected parameters.

  - **Check parent process:** Identify the parent process of `rundll32.exe` via Sysmon Event ID 1. If the parent is `explorer.exe`, correlate with user activity. Unusual context or timing may indicate malicious intent, while normal user actions may suggest benign activity.

  - **Examine download directory:** Verify the presence of the UDL file in the `\Users\*\\Downloads\\` directory indicated in the command line. Validate its origin and content. Malicious UDL files may contain credentials harvesting scripts.

  - **Analyze process behavior:** Use Sysmon Event ID 10 to track the execution tree and network activity associated with the `rundll32.exe` process, focusing on outbound connections. Unexpected connections or access attempts can signal malicious behavior.

  - **Cross-reference recent alerts:** Check for other related alerts involving `rundll32.exe` or UDL files. Repeated instances could indicate a pattern, strengthening the case for potential malicious activity.

  ### Prioritization

  This alert holds medium severity due to the potential for information theft impacting users or the organization. The behavior is not frequently weaponized but represents a legitimate tactic for credential harvesting, thus warranting thorough investigation.

  ### Blind Spots and Assumptions

  The detection may miss obfuscation techniques where attackers modify command-line arguments or use alternate execution methods to avoid detection. Reliable detection requires comprehensive logging (Sysmon and Windows event logs). Legitimate scenarios, such as troubleshooting or development tasks, may trigger the alert, resulting in false positives. Companion detections involving abnormal command-line activities or unexpected network connections would help enhance security posture against this threat vector.

