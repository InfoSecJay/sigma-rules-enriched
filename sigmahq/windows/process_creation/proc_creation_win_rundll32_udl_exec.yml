title: Potentially Suspicious Rundll32.EXE Execution of UDL File
id: 0ea52357-cd59-4340-9981-c46c7e900428
status: test
description: |
  Detects the execution of rundll32.exe with the oledb32.dll library to open a UDL file.
  Threat actors can abuse this technique as a phishing vector to capture authentication credentials or other sensitive data.
references:
- https://trustedsec.com/blog/oops-i-udld-it-again
author: '@kostastsale'
date: 2024-08-16
tags:
- attack.defense-evasion
- attack.execution
- attack.command-and-control
- attack.t1218.011
- attack.t1071
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\explorer.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'oledb32.dll'
    - ',OpenDSLFile '
    - '\\Users\\*\\Downloads\\'         # Note: You can adjust the path to the download directory or other directories according to your environment.
    CommandLine|endswith: '.udl'
  condition: all of selection_*
falsepositives:
- UDL files serve as a convenient and flexible tool for managing and testing database
  connections in various development and administrative scenarios.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity involving the execution of `rundll32.exe` with the `oledb32.dll` dynamic-link library (DLL) to access a Universal Data Link (UDL) file. Attackers may exploit this technique to execute code that can capture authentication credentials or sensitive information, typically as part of a phishing attack or as a means to obfuscate malicious actions within a Windows environment. By leveraging the properties of `rundll32.exe`, which is a legitimate Windows process, adversaries can evade detection while conducting their activities.

  The relevant MITRE ATT&CK techniques include:
  - **Execution: Command and Scripting Interpreter** (T1218.011) - Using `rundll32.exe` to execute commands.
  - **Defense Evasion: Obfuscated Files or Information** (T1027) - Using UDL files to bypass typical security controls by disguising malicious scripts within a legitimate context.
  - **Command and Control: Application Layer Protocol** (T1071) - Possible exfiltration of data or commands via application-layer protocols after the UDL file is processed.

  The primary data sources for this detection include **process creation logs**, which provide insight into executable actions on a system, particularly the command-line arguments used, and the **parent-child process relationships** that shed light on how legitimate processes are being leveraged for execution.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for instances of `rundll32.exe` that match the detection rule criteria, particularly focusing on command-line arguments referencing `oledb32.dll` and `.udl` file extensions.
  - **Examine Parent Process Relationships:** Investigate parent processes, specifically processes that lead to `rundll32.exe`, such as `explorer.exe`. This can help confirm whether a legitimate context or a suspicious activity was involved in the execution chain.
  - **Analyze UDL File Content:** If a UDL file was accessed, examine its contents for any indications of malicious connections or unusual data sources that may suggest credential harvesting or data exfiltration attempts.
  - **Correlate with User Behavior:** Check user behavior logs or access patterns around the time of the execution to identify any anomalous activities, particularly focusing on users who downloaded the UDL files.

  ### Prioritization
  The alert is classified with medium severity due to the potential risk it represents in terms of unauthorized access to sensitive information and the likelihood of being used in a broader attack vector. The combination of `rundll32.exe` and UDL files presents a sophisticated method for attackers to maintain stealth while executing harmful commands.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of abuse, particularly if threat actors utilize other vectors or they employ different DLLs or processes that do not involve `rundll32.exe`. An assumption is made that administrative or development access levels are not being exploited for legitimate UDL use cases. Proper configuration and capture of process creation events, including full command-line logging, are essential for this alert to function correctly. The absence of these logs could lead to blind spots where potential malicious activities go undetected.

