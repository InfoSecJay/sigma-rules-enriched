title: Potentially Suspicious Rundll32.EXE Execution of UDL File
id: 0ea52357-cd59-4340-9981-c46c7e900428
status: test
description: |
  Detects the execution of rundll32.exe with the oledb32.dll library to open a UDL file.
  Threat actors can abuse this technique as a phishing vector to capture authentication credentials or other sensitive data.
references:
- https://trustedsec.com/blog/oops-i-udld-it-again
author: '@kostastsale'
date: 2024-08-16
tags:
- attack.execution
- attack.command-and-control
- attack.stealth
- attack.t1218.011
- attack.t1071
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\explorer.exe'
  selection_img:
  - Image|endswith: '\rundll32.exe'
  - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli:
    CommandLine|contains|all:
    - 'oledb32.dll'
    - ',OpenDSLFile '
    - '\\Users\\*\\Downloads\\'         # Note: You can adjust the path to the download directory or other directories according to your environment.
    CommandLine|endswith: '.udl'
  condition: all of selection_*
falsepositives:
- UDL files serve as a convenient and flexible tool for managing and testing 
  database connections in various development and administrative scenarios.
level: medium
note: |
  ### Technical Context

  This rule detects executions of `rundll32.exe` with the `oledb32.dll` library specifically used to open `.udl` files. This behavior is often exploited by attackers as a phishing vector to execute embedded scripts or capture sensitive data such as authentication credentials. The relevant MITRE ATT&CK techniques are Execution (T1218.011) and Command and Control (T1071). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 for process creation and Sysmon Event ID 1. If the execution is malicious, it could compromise user credentials and lead to further unauthorized access or data exfiltration. However, this detection does not alone confirm malicious intent, as legitimate applications may also use `rundll32.exe` to manage database connections.

  ### Investigation Steps

  - **Check the process creation logs**: Review Windows Security Event ID 4688 or Sysmon Event ID 1 for the creation of `rundll32.exe`. Look for ProcessID, CommandLine, and ParentImage fields. If the ParentImage is `explorer.exe`, it may indicate user-initiated behavior.

  - **Examine the command line parameters**: Analyze the CommandLine field for indicators such as inclusion of `oledb32.dll` and the ending of the command line with `.udl`. Legitimate parameter use will often resemble database connection tests, such as specifying valid paths rather than suspicious ones.

  - **Assess the UDL file path**: Validate the file paths referenced in the CommandLine field. Potentially malicious activity will typically involve paths pointing to user folders (e.g., `\\Users\\*\\Downloads\\`). Confirm that the downloaded `.udl` files are from known and trusted sources.

  - **Collect and review EDR telemetry**: Examine endpoint detection and response (EDR) logs for the presence of other suspicious activities following the execution of `rundll32.exe`. Identify any unusual network connections or additional processes spawned by `rundll32.exe`.

  - **Identify high-confidence malicious indicators**: Look for historical data on the specific UDL file being accessed. If it has been flagged in previous incidents or matches known artifacts related to phishing attacks, consider it a high-confidence indicator of compromise.

  - **Review legitimate user activity**: If the execution appears benign, check for standard operating procedures involving database connectivity tests or administrative tasks that typically utilize `.udl` files within your environment.

  ### Prioritization

  This alert should be prioritized as medium severity due to the critical nature of the systems involved and the potential for credential harvesting through phishing tactics. While such behavior is not common as a primary attack vector, it has been weaponized in certain contexts and should be investigated promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by user behavior and systems configuring logging appropriately for process creation events; lack of Sysmon or incomplete log collection can inhibit visibility. Legitimate developers or administrators may trigger this alert while testing database connections via UDL files. Related alerts, such as those detecting anomalous `rundll32.exe` behavior (e.g., invoking other DLLs or suspicious command line arguments), can enhance overall detection coverage and context.

