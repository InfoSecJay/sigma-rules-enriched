title: Uncommon Child Process Spawned From XBootMgrSleep.EXE
id: 74697c29-1b30-4e1f-a517-33574061821d
status: experimental
description: |
  Detects a process other than XBootMgr.exe spawned by XBootMgrSleep.exe.
  XBootMgrSleep.exe is a Microsoft-signed Windows Performance Toolkit binary that can execute an arbitrary executable after a delay.
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/XBootMgrSleep/
- https://learn.microsoft.com/en-us/previous-versions/windows/desktop/xperf/reference
author: Diablo Research
date: 2026-09-27
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\xbootmgrsleep.exe'
  filter_main_xbootmgr:
    Image: 'C:\Program Files (x86)\Windows Kits\10\Windows Performance Toolkit\xbootmgr.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Custom Windows Performance Toolkit automation that intentionally launches 
  another executable through XBootMgrSleep.exe
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where any process other than `XBootMgr.exe` is spawned from `XBootMgrSleep.exe`, a legitimate Microsoft binary part of the Windows Performance Toolkit. The likely attacker objective is to use `XBootMgrSleep.exe` as a sleeper service to execute malware or other unauthorized applications while evading detection. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (T1202).

  Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 indicating process creation and potentially Sysmon Event ID 1 for detailed process activity. If malicious, this behavior could lead to the execution of harmful payloads or backdoors on system assets. Importantly, this detection does not confirm malicious activity by itself, as it may also result from benign automation or testing procedures involving the Windows Performance Toolkit.

  ### Investigation Steps

  - **Check process creation logs:** Examine Security Event ID 4688 for instances of process creation where `ParentImage` is `XBootMgrSleep.exe`. Look for the `NewProcessName` and ensure it does not match `XBootMgr.exe`.

  - **Validate the process signature:** Review Sysmon Event ID 1 to check the image signature of the spawned process. A valid Microsoft signature indicates benign activity, while an unsigned or suspiciously signed executable could indicate malicious intent.

  - **Cross-reference execution context:** Assess whether the machine where the alert triggered is a known testing or performance environment. Legitimate usage would typically involve only performance monitoring and `xbootmgr.exe` as the child process.

  - **Identify recent changes:** Investigate any recent changes to the execution of the Windows Performance Toolkit on the asset, including upgrades or new scripts that might intentionally spawn processes through `XBootMgrSleep.exe`.

  - **Look for other indicators of compromise:** Review other related alerts or telemetry on the same asset that may indicate potentially harmful activities, such as network connections or file creation related to the suspicious process.

  - **Consider asset criticality:** If the alert is triggered on a critical server or system, escalate accordingly, as unauthorized use of `XBootMgrSleep.exe` could lead to severe security breaches.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems and the likelihood of malicious activity being initiated through a legitimate Windows process. While not common, the behavior can be weaponized, especially in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations exist as attackers may use alternate, similarly benign processes to spawn malicious executables, making this rule potentially easier to evade. Required log sources include proper configuration of Sysmon for enhanced visibility into process creation events. Legitimate automation scripts might also trigger this alert. A related detection that strengthens coverage is monitoring unusual or unauthorized powershell commands following the execution of `XBootMgrSleep.exe`.

