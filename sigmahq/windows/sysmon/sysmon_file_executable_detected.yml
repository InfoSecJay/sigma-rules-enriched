  ---

  ### Technical Context

  This detection identifies events where a Portable Executable (PE) file is created in system memory, as indicated by Sysmon's "FileExecutableDetected" event (Event ID 29). Typically, attackers may leverage this behavior to deploy malware or execute malicious payloads directly in memory, avoiding more traditional file presence detection. The relevant MITRE ATT&CK tactic is "Defense Evasion" (T1562), specifically under the technique "Indicator Removal on Host" (T1070).

  The primary telemetry source is Sysmon logs, specifically looking for Event ID 29, which provides critical visibility into the creation of executable files. If malicious, this behavior poses a significant risk, as it may indicate an attempt to inject malicious code into running processes or to evade detection by obfuscating the malware's presence. However, this alert does NOT indicate whether the executed file is malicious without further context and analysis.

  ---

  ### Investigation Steps

  - **Review Sysmon Event 29 logs:** Search Sysmon logs for Event ID 29 with the creation time and process IDs. Look for anomalies related to user accounts and system processes that typically do not create executable files. Confirm event signature against known legitimate software installation procedures.

  - **Identify the parent process:** Examine the `ParentImage` field in the Event ID 29 logs. A legitimate parent process is typically `explorer.exe` or other known installation software (e.g., Windows Installer). Any unexpected parent processes (e.g., `cmd.exe`, PowerShell) should raise further suspicion.

  - **Check the file path and name:** Review the `FileName` and `FilePath` fields in Event ID 29 for unusual directory structures or file names that closely resemble known malware naming conventions (e.g., random strings, or names mimicking system files).

  - **Look for memory injection attempts:** If the executable is marked as suspicious, further validate by checking for simultaneous Event ID 1 (Process Created) entries for processes that were spawned immediately after the execution. Analyze `Image` and `CommandLine` fields for indicators of malicious PowerShell commands or other suspicious activity.

  - **Assess asset criticality:** If the alert corresponds to core systems (e.g., domain controllers, financial systems), prioritize investigation as these systems are critical to organizational security and operations, and may indicate a more severe compromise.

  - **Validate against defender tools:** Cross-reference findings with endpoint protection tools (e.g., EDR solutions) to identify known false positives or legitimate software that may trigger this rule without any evidence of malicious intent.

  ---

  ### Prioritization

  This alert is of medium severity; while the creation of executable files can be a legitimate action during software installation and updates, it can also indicate attempts to deploy malware. The likelihood of malicious abuse is moderate, particularly on critical systems where such activity is less common. Given the frequency of exploitation techniques that leverage executable creation, this should be investigated promptly.

  ---

  ### Blind Spots and Assumptions

  This detection may miss attempts using alternative methods for process execution, such as JavaScript or .NET executables that could bypass traditional detection mechanisms. Reliable detection requires proper Sysmon configuration; ensure hierarchical logging from all critical endpoints is enabled for robust monitoring. Additionally, legitimate activities such as updates from trusted software sources may trigger this alert; cross-reference with a companion detection, such as PowerShell command execution (Event ID 4104), to strengthen validation of suspicious activities.

