note: |
  ### Technical Context

  This rule detects the creation of executable files on Windows systems, as indicated by Sysmon Event ID 29 (FileExecutableDetected). The behavior highlights potential adversary objectives such as deploying malware, backdoors, or any unauthorized software to establish persistence or further compromise a system. This detection relates to the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Indicator Removal on Host (T1560).

  Primary telemetry sources include Sysmon logs and Windows Event Logs containing Event ID 29 details. Malicious activity can significantly impact system integrity and user data, often leading to data breaches or system compromise if detected early. However, this detection does NOT confirm whether the file is actively being executed or used maliciously; it merely indicates that an executable file was created.

  ### Investigation Steps

  - **Verify the Sysmon log entry:** Check Sysmon Event ID 29 logs for the specific executable created. Look for fields like `Image`, `User`, and `ProcessId` to understand the context. Identify if the executable path is in a benign directory (e.g., `C:\Program Files`, `C:\Windows`) versus suspicious locations like `C:\Users\<User>\AppData\Local\Temp`.

  - **Assess parent process behavior:** Investigate the parent process associated with the executable creation by examining the `ParentProcessId` and `ParentImage` fields in the Sysmon log. A legitimate installer (e.g., `msiexec.exe`, `setup.exe`) may indicate normal activity, while uncommon sources may imply potential malware execution.

  - **Correlate with file reputation:** Conduct a file reputation check on the specific executable using services like VirusTotal. Analyze the results for any known malicious signatures; new or unrecognized executables lacking historical context should raise suspicion.

  - **Review recent system changes:** Assess the timeline of changes on the host machine, using Windows Event Logs (Event IDs 4688 for process creations and 4689 for process terminations) to determine if there are connections or anomalies in process chains leading to the alert point.

  - **Identify scheduled tasks and scripts:** Investigate for any scheduled tasks or scripts running in conjunction with the time of the Sysmon alert. Use PowerShell or Task Scheduler logs to see if malicious scripts are leveraging these schedules to automate executable launches.

  - **Look for persistence mechanisms:** Check for any registry changes related to the created executable. Review entries in `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` or the system startup folder for signs of persistence mechanisms that may accompany unauthorized executable creation.

  ### Prioritization

  This alert is of medium severity due to the noteworthy impact of detecting potential malware capable of persistence on important systems. Executable creation can be indicative of malicious behavior, particularly if it originates from atypical parent processes. The detection can be tied to frequently weaponized techniques in the cyber threat landscape.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Sysmon; if it is not fully deployed or lacks the appropriate schema, critical events may be missed. Additionally, legitimate software updates or installations might trigger these alerts, leading to false positives. It's vital to have comprehensive log sources enabled, including Sysmon for file execution events, to achieve reliable detection. Companion detections such as monitoring for unusual network connections (e.g., DNS queries or HTTP traffic from newly created executables) can enhance visibility and context around the incident.

