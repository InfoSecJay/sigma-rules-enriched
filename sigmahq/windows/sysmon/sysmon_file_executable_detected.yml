note: |
  ### Technical Context

  This Sigma rule detects the creation of executable files by monitoring Sysmon events where a PE (Portable Executable) file is created, specifically Event ID 29 (FileExecutableDetected). The likely objective of the attacker is to execute malicious code by dropping a payload onto the filesystem, potentially leading to further exploitation or lateral movement within the network. This activity falls under the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and the technique "Executable File Creation" (T1203).

  The primary telemetry sources are Sysmon logs configured to track file creation activities. This detection indicates the creation of executable files, which can be a precursor to malicious activity. However, this detection does NOT confirm that the executable is malicious or that it has been executed; it merely indicates that a file creation event has taken place.

  ### Investigation Steps

  - **Review Sysmon Event ID 29:** Investigate Sysmon logs for Event ID 29 details, focusing on fields such as `FileName`, `FilePath`, and `User`, to determine who created the executable and where it was created. A legitimate process may include entries from known software installations in common directories (e.g., `C:\Program Files\`).

  - **Identify suspicious file paths:** Check if the created file is located in unusual directories (e.g., `C:\Windows\Temp\`, user profile directories) or has suspicious filenames (e.g., impersonating legitimate executables). Compare with baseline data of normal application installations.

  - **Verify Parent Process:** Examine the `Image` and `ParentImage` fields in the Sysmon log entry to identify if a suspicious process initiated the executable creation. A parent process from known administrative tools (e.g., Powershell, cmd.exe) could indicate potential misuse.

  - **Analyze file hashes:** If available, retrieve the hash (MD5, SHA1, SHA256) of the created executable and check it against threat intelligence sources or internal blacklists. High-confidence malicious indicators may include hashes known for malware signatures.

  - **Check for execution context:** Investigate whether the newly created executable has been executed (indicated by Sysmon Event ID 1, Process Create) and note the context of execution (e.g., executed by a non-admin user). Legitimate activities typically involve installation processes by system administrators.

  - **Evaluate system role and criticality:** Assess the host system's role (e.g., server vs. workstation) and asset criticality. Malicious activity on critical assets warrants increased urgency in response.

  ### Prioritization

  This alert is of medium severity, particularly if it involves a critical system or server, as the creation of executable files can indicate an initial breach or lateral movement. The likelihood of malicious abuse is moderate since the creation of executables is a common technique used by attackers to deploy malware. While sometimes legitimate, unusual file creation patterns in sensitive folders should be investigated closely.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Sysmon, as not all environments have it deployed or logging specific events thoroughly. Legitimate activities like software installations or updates can trigger this alert, leading to potential false positives. A related detection to consider includes File Modification events (Sysmon Event ID 11) to monitor changes made to executables, strengthening overall visibility into potentially malicious behavior.

