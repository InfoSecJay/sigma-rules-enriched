title: Sysmon File Executable Creation Detected
id: 693a44e9-7f26-4cb6-b787-214867672d3a
status: test
description: |
  Detects Portable Executable (PE) files creation events logged by Sysmon in paths monitored by the used Sysmon configuration.
  This is a high-value detection for catching unauthorized or suspicious executable drops.
  Alert volume and scope depend entirely on which paths or files are monitored in the Sysmon config.
  A high noise level or hits from known-legitimate software are a strong signal that the Sysmon configuration is too permissive, not that the detection itself is wrong and probably needs to be tuned to a more restrictive set of paths or files.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
- https://medium.com/@olafhartong/sysmon-15-0-file-executable-detected-40fd64349f36
author: frack113
date: 2023-07-20
tags:
- attack.defense-impairment
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 29      # this is fine, we want to match any FileExecutableDetected event
  condition: selection
falsepositives:
- Legitimate software writing executables to monitored paths - if this occurs, 
  narrow the Sysmon configuration to more sensitive paths rather than 
  suppressing this rule
level: medium
regression_tests_path: 
  regression_data/rules/windows/sysmon/sysmon_file_executable_detected/info.yml
note: |
  ### Technical Context

  This rule detects the creation of Portable Executable (PE) files logged by Sysmon, particularly focusing on paths specified in the Sysmon configuration. The behavior indicates potential unauthorized executable drops, which may align with tactics used by adversaries to establish persistence or deploy malware within an environment. The relevant MITRE ATT&CK tactic is Defense Evasion (T1203) and the technique is "Exploitation for Client Execution" (T1203). The primary telemetry source is Sysmon logs, specifically Event ID 29. If malicious, the creation of executables in unexpected locations can permit code execution and system compromise. However, this detection alone does not confirm malicious intent; legitimate software may also create executables.

  ### Investigation Steps

  - **Identify the executing path: **Review the path from which the executable was created using Sysmon Event ID 29 fields `Image` and `FileName`. Valid paths for executables in a standard environment are usually `C:\Program Files` or `C:\Windows\System32`. Anything else may require further scrutiny.

  - **Check for parent process: **Examine the `ParentImage` field in Sysmon Event ID 29 to determine if the executable was spawned by a known legitimate process. A legitimate parent, such as `powershell.exe` or `cmd.exe`, may indicate benign activity depending on the context.

  - **Analyze file creation timestamp: **Cross-reference creation timestamps from Event ID 29 with other system logs (e.g., Windows Event ID 4663) to identify any unusual activity at that time. Legitimate software typically follows installation protocols rather than direct file creation during odd hours.

  - **Inspect file hash: **Calculate the file hash of the created executable (`FileName` field) and compare it against known hashes in threat intelligence databases (like VirusTotal). A hash with a high baddie score or that flags as malware constitutes strong evidence of malicious intent.

  - **Review the Sysmon configuration: **Evaluate the Sysmon configuration settings to ensure that only critical paths are monitored. Broad configurations can lead to excessive alerts from legitimate applications creating executables.

  ### Prioritization

  Alert severity is medium due to the potential impact on critical systems if a malicious executable is being created. The likelihood of abuse is moderate as this behavior is often a tactic employed by attackers to deploy malware, yet it could also stem from legitimate processes. This particular activity is not commonly weaponized alone, making context essential for proper evaluation.

  ### Blind Spots and Assumptions

  Detection may be limited by possible evasion techniques, such as legitimate applications creating executables in monitored paths, leading to false positives. Successful detection relies on proper Sysmon configuration to limit monitored paths appropriately. Legitimate software installers may trigger this alert if they create executables, indicating the need for ongoing tuning of Sysmon paths. Companion detections, such as monitoring for abnormal outbound connections following executable creation, would enhance overall security posture.

