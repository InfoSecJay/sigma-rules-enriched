note: |
  ### Technical Context
  This rule detects the creation of executable files on Windows systems as indicated by Sysmon's "FileExecutableDetected" event (Event ID 29). This event is logged whenever a Portable Executable (PE) file is created, providing critical insight into potentially malicious behavior such as the deployment of malware or unauthorized software. Attackers may create executables to establish persistence, facilitate lateral movement, or perform other malicious operations, making this detection rule vital for identifying suspicious activity in the environment.

  The suspected threat scenarios related to this detection may involve attackers using various tools and techniques for defense evasion, as they attempt to execute unauthorized binaries while avoiding detection by security controls. Relevant MITRE ATT&CK tactics that apply include **Defense Evasion** (TA0005) through techniques such as **Indicator Removal on Host** (T1070) and potential usage of **Malicious File Creation** (T1203) to deploy compromised software. The primary data sources that will contain the best evidence for this detection are Sysmon logs, specifically those that capture executable creation events, alongside process creation events to correlate the execution of the detected file.

  ### Investigation Steps
  - **Review Sysmon Logs**: Examine Sysmon logs for Event ID 29 (“FileExecutableDetected”). Look for unusual file paths or naming conventions that may indicate suspicious activity.
  - **Analyze Process Creation Events**: Correlate the executable creation events with process creation logs (Event ID 4688) to determine if the newly created file was executed. Note any parent processes that are suspicious or unexpected.
  - **Investigate Suspicious File Hashes**: Utilize threat intelligence sources to check the hashes of the created executables against known malware signatures and track any associations with malicious behavior.
  - **Scan Network and Endpoint Activity**: Look for signs of data exfiltration or lateral movement related to the executables detected. Review network traffic logs to identify unusual connections that may correlate with the creation and execution of these PE files.

  ### Prioritization
  The severity of this alert is considered medium due to the potential for significant impact on enterprise environments. While the creation of an executable file alone does not confirm an attack, it increases the likelihood of malicious activity, especially when correlated with other suspicious behaviors.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of malicious executable creation, particularly if an attacker employs tools that generate executables without triggering Sysmon events. The detection logic assumes that Sysmon is properly configured and that Event ID 29 is enabled and logged. Gaps in coverage may arise if the impact of unmonitored environments or shadow IT exists, leading to potential threats going unnoticed. Proper security controls and log collection configuration are required for effective detection, including continuous monitoring of Sysmon and related process creation logs.

