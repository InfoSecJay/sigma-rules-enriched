title: Sysmon Configuration Error
id: 815cd91b-7dbc-4247-841a-d7dd1392b0a8
status: test
description: Detects when an adversary is trying to hide it's action from Sysmon logging
  based on error messages
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
- https://talesfrominfosec.blogspot.com/2017/12/killing-sysmon-silently.html
author: frack113
date: 2021-06-04
modified: 2022-07-07
tags:
- attack.defense-evasion
- attack.t1564
logsource:
  product: windows
  category: sysmon_error
detection:
  selection_error:
    Description|contains:
    - 'Failed to open service configuration with error'
    - 'Failed to connect to the driver to update configuration'
  filter_generic_english:
    Description|contains|all:
    - 'Failed to open service configuration with error'
    - 'Last error: The media is write protected.'
  filter_by_errorcode:
    Description|contains:
    - 'Failed to open service configuration with error 19'
    - 'Failed to open service configuration with error 93'
  condition: selection_error and not 1 of filter*
falsepositives:
- Legitimate administrative action
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts by adversaries to manipulate or disable Sysmon logging on Windows systems, often as part of broader defense evasion strategies. When an attacker seeks to conceal their actions, they may target Sysmon logs to avoid detection, thereby enabling undetected persistence or lateral movement within a network. Successful manipulation can hinder forensic analysis, complicating incident response efforts.

  In terms of MITRE ATT&CK, this behavior is associated with the tactic of **Defense Evasion**. Specific techniques include:
  - **T1564.001: Hide Artifacts** — Manipulating application logs to obscure malicious activity.

  Primary data sources for this detection will be Sysmon error logs, specifically those that capture anomalies related to service configurations or connectively issues. Monitoring these logs enables detection of abnormal conditions reported by Sysmon that an attacker might exploit.

  ### Investigation Steps
  - **Review Sysmon Logs:** Examine Sysmon error logs for anomalies, particularly entries that indicate failures related to service configuration, such as "Failed to open service configuration with error" or similar messages.
  - **Analyze Related Process Creation Events:** Identify linked process creation events around the timeframe of the detected anomaly to understand if any suspicious processes were initiated that correlate with the manipulation attempts.
  - **Check for Known Error Codes:** Focus on specific error codes like 19 and 93 mentioned in the detection rule to determine if they occur during legitimate user actions or correlatively with unauthorized access attempts.
  - **Investigate User Activity:** Correlate the identified events with user accounts and assess if there were any administrative actions or access that are out of the ordinary, potentially aligning with the observed behavior.

  ### Prioritization
  The severity of this alert is high due to its implication in the evasion of security measures, potentially indicating an ongoing intrusion or preparation for further nefarious activities within the enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may miss malicious behaviors that do not generate explicit Sysmon error messages or logs if Sysmon is not configured, enabled, or sufficiently comprehensive. Additionally, this rule assumes that the environment is adequately logging Sysmon events and that the logs are not being manipulated or deleted by attackers in a more sophisticated manner. Consistent Sysmon configuration and monitoring practices are essential for this rule to provide effective coverage.

