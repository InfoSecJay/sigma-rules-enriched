note: |
  ### Technical Context

  This rule detects changes in the state of Sysmon, specifically when the service is stopped or when its configuration is altered from a running state to a stopped state. The likely attacker objective is to disable Sysmon for evading detection during malicious activities, particularly during lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK technique T1562.001: Impair Defenses. The primary telemetry source for this detection is Sysmon log data, specifically focusing on the "sysmon_status" log category or relevant Windows Event ID 113 and 21 for state changes. If malicious, this activity greatly reduces visibility into ongoing threats, allowing adversaries to operate with increased stealth. It is important to clarify that this detection does NOT confirm that an intrusion occurred; it only indicates an attempt to hinder monitoring capabilities.

  ### Investigation Steps

  - **Check Sysmon status changes:** Review Sysmon logs for "State: Stopped" entries (Event ID 21) to find the exact timestamps of service stoppage.

  - **Analyze previous configuration state:** Look for preceding entries indicating "Sysmon config state changed" (Event ID 113) to confirm if legitimate modifications were possibly made before the stop event.

  - **Identify legitimate administrative actions:** Cross-reference the log against known administrative activities, such as scheduled maintenance or updates, showing expected SYSMon interactions.

  - **Determine malicious indicators:** Look for unauthorized user accounts or service account activity surrounding the stop event, especially if those accounts are not typically associated with security posture management.

  - **Evaluate timeline correlation:** Assess whether the timing of Sysmon being stopped correlates with any incident reports or indicators of compromise in the environment to gauge potential malicious intent.

  - **Review host role context:** Confirm Sysmon is expected to be running on the asset (e.g., endpoints with sensitive data) and document its criticality to operations; this can influence prioritization of the alert.

  ### Prioritization

  This alert is of high severity, as it indicates an attempt to impair detection capabilities on critical assets. Given the likelihood of malicious behavior exploiting this technique, it is crucial to investigate swiftly. The behavior is commonly weaponized by advanced adversaries aiming to avoid detection during their operations.

  ### Blind Spots and Assumptions

  There are limitations in detecting evasion attempts, as legitimate administrative tasks can also trigger this alert. It's essential to ensure all relevant logging is configured correctly, including enabling detailed Sysmon logging. Additionally, note that legitimate users may disable Sysmon during troubleshooting or system updates, which could create noise in the alerting system. Complementary detection strategies should include monitoring for unusual service terminations across critical systems.

