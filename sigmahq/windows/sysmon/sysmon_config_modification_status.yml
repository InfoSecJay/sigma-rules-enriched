note: |
  ### Technical Context

  This Sigma rule detects modifications to Sysmon's running state, specifically when it is stopped or its configuration is changed to a state that would hinder visibility into system activities. The likely attacker objective is to avoid detection of malicious behaviors, such as process creation or network connections, that would typically be logged by Sysmon. This aligns with the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and the technique "Indicator Removal on Host" (T1564). The primary telemetry sources are Windows Security Event logs (Event ID 7045 - Service Installation) and Sysmon Event Logs, especially focusing on Event ID 13 (Process Termination) and Event ID 22 (Service State Change). If malicious, this behavior may allow attackers to persist on a system undetected by disabling critical logging features. However, this detection alone does not confirm malicious activity without additional context regarding the actor's intent or timing.

  ### Investigation Steps

  - **Review Sysmon and Security Event Logs**: Check for Event ID 13 and Event ID 22 in Sysmon logs or Event ID 7045 in Security logs around the time of the alert. A legitimate configuration change should have an appropriate administrative context and not coincide with suspicious activity or known incidents.

  - **Inspect User Account Activity**: Examine user account permissions and privileges associated with the Sysmon configuration changes. Look for anomalous accounts performing administrative tasks, particularly any non-admin accounts.

  - **Check for Service Status Changes**: Review Security Event ID 7036 or Sysmon Event ID 22 to verify if Sysmon was intentionally stopped. If there are multiple unexpected stoppages, this may indicate an adversary's attempt to evade detection.

  - **Correlate with Other Security Alerts**: Cross-reference this event with other logs, such as EDR alerts or network traffic logs, to identify if there are ongoing suspicious activities correlating with Sysmon being stopped or reconfigured.

  - **Analyze System Integrity Post-Change**: Validate system integrity by checking for unexpected changes in critical files or services that typically indicate post-exploitation behaviors. Documenting timestamps and configurations before and after the Sysmon change can help identify potential tampering.

  ### Prioritization

  This alert is considered high severity due to the potential impact on affected systems, particularly if Sysmon was tracking critical processes or events. The likelihood of malicious use is significant, as attackers frequently disable or manipulate security tools. This behavior is weaponized in many attack scenarios, particularly during persistent intrusions.

  ### Blind Spots and Assumptions

  Detection may be limited by logged user activities that include legitimate administrative changes. If logs from critical systems or endpoints are not captured accurately, this may lead to false negatives. Additionally, legitimate administrative functions might trigger this alert, such as proactive disabling by IT teams. Related detections, such as alerts on failed attempts to restart Sysmon or modifications of associated services, can reinforce overall coverage of this detection capability.

