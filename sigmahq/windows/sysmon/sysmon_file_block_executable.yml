note: |
  ### Technical Context
  This detection rule identifies any Sysmon "FileBlockExecutable" events, which signify that an executable has been blocked due to a violation of the organization's configured blocking policy. Such events typically occur when an attacker attempts to deploy malware or an unauthorized executable on a protected system, potentially signifying malicious intent. Attackers may use various techniques to bypass security controls, and a blocked executable can indicate either misconfigured policies or active attempts at evasion.

  The relevant MITRE ATT&CK techniques here include:
  - **T1070.001 - Indicator Removal on Host: File and Directory Permissions Modification** — Attackers may try to modify file execution permissions to circumvent security controls.
  - **T1203 - Exploitation for Client Execution** — This demonstrates that the attacker may have attempted to execute a malicious file which was stopped by a policy.
  - **T1211 - Exploitation for Remote Code Execution** — Indicates attempts to run unauthorized executables for remote exploitation.

  The primary data sources for effective investigation include:
  - Sysmon logs, specifically monitoring EventID 27 for blocked executable attempts.
  - File integrity monitoring logs to detect changes in file execution permissions.
  - Endpoint Detection and Response (EDR) telemetry showing blocked and attempted process executions.

  ### Investigation Steps
  - **Review Sysmon Logs:** Check for EventID 27 across Sysmon logs to identify specific instances of blocked executables, noting the source, time, and user context of the attempted execution.
  - **Analyze Process Creation Events:** Look for related process creation events around the time of the blocked executable attempt to understand if there were any other suspicious activities or patterns that may point to malicious behavior.
  - **Inspect File Permissions:** Conduct an audit of the file permissions for the executable in question to identify whether legitimate processes could have been manipulated or if there are unapproved changes that may have facilitated the block policy violation.
  - **Correlate with Other Telemetry Sources:** Examine other logs such as EDR, Anti-Virus, and firewall logs for any related alerts or activities that might provide context to the blocking event and indicate greater risk or a potential breach.

  ### Prioritization
  This alert is assigned high severity due to the potential impact on operational security and the likelihood of an active threat attempting to deploy malicious software. Blocked executables are a significant indicator of an adversary's presence attempting to manipulate or bypass security measures.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Sysmon is not consistently deployed or if its logging is misconfigured, leading to missed events. This detection logic assumes that the organization has enforced executable block policies and that any violations are not due to legitimate operational needs. Additionally, for the alert to function effectively, appropriate logging configurations for Sysmon are required to ensure all relevant events are captured and retained for analysis.

