  ### Technical Context
  This detection rule targets Sysmon's "FileBlockShredding" event (EventID 28), which signifies a violation of a configured file shredding policy. The rule is designed to identify potential malicious activities where an attacker or insider attempts to bypass file shredding controls, perhaps to conceal their tracks after unauthorized file modifications or deletions. Such activities may indicate an effort to perform data exfiltration or to remove evidence of malicious actions.

  The threat scenario could involve various actors, including insiders looking to erase their digital footprints or external threat actors who have gained sufficient access to manipulate files within the host environment. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (T1218), specifically the technique of **Indicator Removal on Host** (T1070), which includes strategies to hide or eliminate traces of malicious actions.

  The primary data sources for this detection are Sysmon logs, specifically focusing on the events related to file operations that would be logged during shredding policy violations. Analyzing these logs can provide crucial insight into the legitimacy of the actions taken on sensitive files.

  ### Investigation Steps
  - **Review Sysmon Logs**: Check the Sysmon "FileBlockShredding" events (EventID 28) that triggered the alert for additional context, including the timestamp, user account, and affected files, to understand the scope of the action.
  - **Correlate with Other Logs**: Investigate additional logs from EDR solutions, Windows Event Logs, or file access logs that may provide context around the user activity, particularly any logs focusing on file access/modification near the time of the shredding event.
  - **Assess User Behavior**: Identify the user(s) associated with the event to determine their role and proper authorization for the action. Look for patterns of unusual behavior, such as sudden increases in data deletion or file access rights.
  - **Check for Related Processes**: Analyze related processes that may have been running in conjunction with the file shredding event. Consider whether any known tools or scripts were used that could suggest sophisticated data manipulation techniques.

  ### Prioritization
  Given that the rule flags a high-severity event related to potential data concealment efforts, it is critical to address these alerts promptly. The likelihood of a breach or insider threat is elevated when file shredding is detected, making this a high-priority investigation task for the SOC.

  ### Blind Spots and Assumptions
  This detection may miss legitimate uses of file shredding when adequately authorized and justified, leading to false positives in organizations with a robust file handling policy. The detection logic assumes that Sysmon is properly configured to log all relevant events, including the FileBlockShredding event. A gap in detection coverage may arise if Sysmon logs are not consistently collected or if the shredding policy itself is misconfigured, potentially allowing unauthorized activities to go unnoticed. Ensuring comprehensive logging and clear policy definitions and enforcement is essential for the alert's effectiveness.

