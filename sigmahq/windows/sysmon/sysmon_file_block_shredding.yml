note: |
  ### Technical Context

  This rule detects Sysmon Event ID 28, specifically indicating a blocked file shredding operation. This behavior typically signals an attempt by an attacker to erase or obfuscate traces of malicious actions or compromised data, which aligns with the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and the technique "File Shredding" (T1024). The primary telemetry source is Sysmon logs, particularly the "FileBlockShredding" events that document attempts to overwrite files to make them unrecoverable. The security impact, if malicious, can be significant, as it may indicate an active attempt to hide unauthorized data access or exfiltration. Importantly, this detection does NOT confirm the malicious intent on its own; additional context is needed to assess the overall threat.

  ### Investigation Steps

  - **Review Sysmon Event 28 logs**: Check for occurrences of Event ID 28 in Sysmon logs. Focus on timestamps and source processes attempting to execute file shredding. Look for abnormal process names or user accounts typically not associated with file shredding activities.

  - **Identify related file access events**: Cross-reference with Sysmon Event ID 11 (FileCreate) or Event ID 22 (FileCreateStreamHash) to see if there is prior or subsequent legitimate file access by the same process or user right before the blocked shredding event.

  - **Check for known process behavior**: Validate if the triggering process is a recognized application performing legitimate shredding tasks. Tools like file shredders have identifiable signatures; document their expected behavior for comparison.

  - **Evaluate User Context**: Assess the user account performing the action. If it belongs to a common administrative or software service account conducting background clean-up operations, this may indicate benign activity. In contrast, unfamiliar accounts performing such actions could suggest malicious intent.

  - **Examine file retention or deletion policies**: Investigate organizational policies regarding file retention and deletion procedures. Compare these policies against the timing and rationale for shredding activity detected.

  - **Collect forensics from affected files**: If malicious intent is suspected, temporarily preserve any affected files using disk imaging tools or check for evidence of data exfiltration (e.g., unexpected network traffic to unknown destinations).

  ### Prioritization

  This alert is high-severity due to the potential impact on sensitive data integrity and the likelihood of abuse. The behavior of blocking file shredding indicates a deliberate attempt to conceal malicious activity, which is commonly employed in cyber threats, warranting immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate applications may trigger this alert when executing policies consistent with data retention or user-initiated file deletion tasks. Reliable detection depends on proper Sysmon configuration to capture comprehensive logs. False positives can arise in environments where regular file-cleaning processes are employed by trusted applications. A companion detection could be alerts on suspicious file creations or abnormal process behaviors related to data manipulation to strengthen overall coverage of potential data exfiltration attempts.

