note: |
  ### Technical Context

  This Sigma rule detects attempts to overwrite or delete files using file shredding techniques, indicated by Sysmon Event ID 28 ("FileBlockShredding"). The likely attacker objective is to erase traces of malicious activity or sensitive information before exfiltration or during lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1565.001). The primary telemetry source for this detection is Sysmon, specifically monitoring Event ID 28 logs reflecting policy violations against configured file shredding rules. If the behavior is confirmed malicious, it could indicate an effort to obscure evidence of compromise or unauthorized actions. Importantly, this detection does NOT confirm actual data compromise or confirm that files were successfully deleted; it merely indicates an attempt to bypass shredding safeguards.

  ### Investigation Steps

  - **Review Sysmon Events:** Check for Event ID 28 in Sysmon logs. Look for fields indicating the file name and path, process ID, and user account associated with the attempt. Legitimate file modifications usually do not involve shredding processes.

  - **Identify User Context:** Verify the user account executing the shredding action. Cross-reference the user with known privileged roles; elevated accounts engaging in file shredding may require additional scrutiny, especially if such actions are not part of their normal behavior.

  - **Analyze Process Creation Events:** Correlate with Security Event ID 4688 (process creation). Identify the parent process and other relevant details, focusing on processes that initiated the shredding attempt. Legitimate users often use file deletion in common productivity software, not dedicated shredding tools.

  - **Evaluate File Access History:** Review logs related to file access (e.g., NTFS audit logs for Event ID 4663). Look for recent read or write access to the target files preceding the shredding attempt, which might indicate prior malicious manipulation.

  - **Confirm Shredding Policy Configuration:** Validate the configured shredding policies in Sysmon to ensure they reflect expected operational requirements. Misconfigured policies may inadvertently lead to false positives.

  ### Prioritization

  This alert is of high severity due to the potential impact on data integrity and the obscuring of malicious activity. The likelihood of this behavior being initiated by an adversary is high, particularly as file shredding is a common technique used to evade detection after unauthorized file access.

  ### Blind Spots and Assumptions

  Possible evasion techniques include legitimate usage of file management software that may trigger similar events, leading to false positives. Reliable detection requires that Sysmon is correctly configured to monitor these specific events. Additionally, consider legitimate scenarios such as IT security personnel conducting file destruction as part of data lifecycle management, which could inadvertently trigger these alerts. A companion detection to strengthen coverage could be monitoring for unauthorized file access patterns preceding any shredding attempts, as it helps establish context around the file manipulation events.

