  ### Technical Context

  This Sigma rule detects Sysmon Event ID 28, specifically related to "FileBlockShredding", which alerts when there is an attempt to shred files that violate a configured shredding policy. The likely attacker objective behind this action may be to cover tracks by permanently erasing sensitive or incriminating files, thereby hindering forensic investigation efforts post-compromise. This behavior is aligned with the MITRE ATT&CK framework under the tactic of Defense Evasion, specifically technique T1070.003: File and Registry Permissions Modification.

  Primary telemetry sources include Sysmon logs specifically capturing Event ID 28, which indicates incidents related to file shredding policy violations. If malicious, the security impact can be significant, as this activity may lead to data loss and the ability for an attacker to hide their tracks effectively. However, this detection does NOT confirm that malicious activity is taking place; legitimate administrative actions could also trigger this rule, warranting further investigation.

  ---

  ### Investigation Steps

  - **Verify Sysmon Event ID 28 details:** Review the Sysmon log for Event ID 28. Look for fields indicating the user account initiating the action, file paths, and the outcome of the shredding attempt to discern intent.

  - **Examine file access patterns:** Check other Sysmon logs (Event IDs 41 and 46) for file creation/access preceding the blocked file shredding attempt. Legitimate applications may create temporary files that could be misidentified as suspicious.

  - **Correlate with user activity:** Assess the user's recent activity through Windows Event IDs 4624 (logon events) and 4688 (process creations) to determine if the user was performing legitimate tasks or if the context indicates malicious behavior.

  - **Identify high-confidence malicious indicators:** Look for patterns where shredding attempts align with known indicators of compromise from threat intelligence sources, especially if followed by unauthorized data access or extraction events.

  - **Review relevant policies and configurations:** Inspect the shredding policy configurations (which may require administrative access) to understand if the action was expected based on internal security compliance standards.

  - **Coordinate with asset criticality assessments:** Determine if the affected file and its shredding policy are relevant to critical assets, thereby prioritizing the review of systems with high-security importance.

  ---

  ### Prioritization

  This alert is high severity due to the risk posed to sensitive data and the likelihood of malicious behavior aimed at evading detection. The ability to permanently delete files can be weaponized by attackers, especially in environments where data compliance is essential.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations regarding true positive rates if legitimate file management practices trigger the alert. Required log sources include appropriately configured Sysmon and Windows Security logs to ensure comprehensive coverage. Legitimate activities, such as routine administrative maintenance, may cause false positives. A companion detection via unauthorized data exfiltration (e.g., unusual network traffic patterns around file access) may provide additional context and confidence in investigative conclusions.

