logsource:
  product: windows
  category: wmi_event
detection:
  selection_destination:
  - Destination|contains|all:
    - 'new-object'
    - 'net.webclient'
    - '.downloadstring'
  - Destination|contains|all:
    - 'new-object'
    - 'net.webclient'
    - '.downloadfile'
  - Destination|contains:
    - ' iex('
    - ' -nop '
    - ' -noprofile '
    - ' -decode '
    - ' -enc '
    - 'WScript.Shell'
    - 'System.Security.Cryptography.FromBase64Transform'
  condition: selection_destination
falsepositives:
- Legitimate administrative scripts
level: high
note: |
  ### Technical Context
  This rule detects suspicious scripting activity within Windows Management Instrumentation (WMI) Event Consumers. Specifically, it identifies potentially malicious PowerShell or other scripting commands being executed via WMI, which may indicate an attacker's attempt to maintain persistence or execute payloads covertly. Attackers frequently use WMI for executing scripts without notice to evade detection, especially in environments where security monitoring may be more focused on other forms of execution.

  The threat scenario involves an attacker leveraging WMI to establish or retain control over compromised systems. This could be part of a broader attack strategy involving lateral movement, such as utilizing WMI Event Consumers to execute malicious scripts that facilitate further exploitation of the network. The relevant MITRE ATT&CK tactics include Execution (TA0002) through automated script execution and the technique T1059.005, which specifically concerns PowerShell scripting.

  The primary data sources for detecting this activity are Windows WMI event logs. These logs capture events related to WMI operations and can reveal suspicious script executions, especially when unusual methods or commands are employed.

  ### Investigation Steps
  - **Review WMI Event Logs:** Examine WMI event logs for any entries that match the defined suspicious commands, focusing on logs containing "new-object" and "net.webclient" references, as well as any PowerShell command strings that show signs of obfuscation or complexity.

  - **Correlate with Process Creation Events:** Look for corresponding process creation events that indicate the actual execution of the scripts. Check for any command-line arguments that include PowerShell with the flags `-nop`, `-noprofile`, or encoded command strings.

  - **Analyze Scheduled Tasks and Services:** Check for any scheduled tasks or services that may leverage WMI Event Consumers as a triggering mechanism. These components might provide insight into potentially malicious persistence mechanisms.

  - **Investigate User Accounts:** Identify the user accounts associated with the suspicious WMI script executions. Determine whether these accounts exhibit unusual behavior or have recently been granted elevated privileges.

  ### Prioritization
  This alert carries a high severity in an enterprise environment due to the potential for WMI to facilitate covert script execution, which can lead to unauthorized data access, lateral movement, or further compromise of systems. The likelihood is heightened as attackers increasingly rely on such methods to remain undetected.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on the correct configuration of WMI event logging, which may not capture all relevant activity if improperly configured. Additionally, the detection logic assumes that the suspicious commands are not part of legitimate administrative tasks, which may lead to false positives. Effective detection also requires comprehensive access to all relevant Windows WMI logs; any omitted logs may hinder the ability to fully understand the context of suspicious activities.

