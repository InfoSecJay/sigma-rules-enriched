logsource:
  product: windows
  category: wmi_event
detection:
  selection_destination:
  - Destination|contains|all:
    - 'new-object'
    - 'net.webclient'
    - '.downloadstring'
  - Destination|contains|all:
    - 'new-object'
    - 'net.webclient'
    - '.downloadfile'
  - Destination|contains:
    - ' iex('
    - ' -nop '
    - ' -noprofile '
    - ' -decode '
    - ' -enc '
    - 'WScript.Shell'
    - 'System.Security.Cryptography.FromBase64Transform'
  condition: selection_destination
falsepositives:
- Legitimate administrative scripts
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious script execution patterns via Windows Management Instrumentation (WMI) event consumers, specifically looking for the use of PowerShell commands and .NET web client methods that could indicate an attempt to download or execute code from external sources. The likely objective of an attacker triggering this rule is to establish persistence or execute malicious instructions on the target system, potentially as part of a broader exploit or lateral movement tactic. This behavior aligns with the MITRE ATT&CK technique for PowerShell (T1059.005).

  Primary telemetry sources include Windows WMI event logs, specifically those capturing WMI event consumer activities. The detection indicates a potential security risk if confirmed as malicious, as it can enable stealthy persistence and execution of unauthorized scripts. However, this detection does NOT confirm malicious activity on its own since legitimate administrative scripts may resemble these patterns.

  ### Investigation Steps

  - **Review specific WMI events**: Check for WMI event subscriptions related to Event ID 5858 and 5860, which log WMI consumer activity, to identify the source of the suspicious commands.

  - **Analyze PowerShell history**: Inspect the PowerShell command history (Event ID 4104) for any executed commands containing indicators like 'iex(' or invocation of 'WScript.Shell', as these can be clear indicators of malicious intent. Focus for Base64-encoded commands as critical indicators.

  - **Compare against known scripts**: Validate the commands against your organization's legitimate administrative scripts. Ensure that any detected execution of download strings (like 'System.Net.WebClient') is either documented as benign or has an associated user justification.

  - **Examine network connections**: Check outbound connections corresponding to the timestamps found in WMI logs using tools like netstat, or review firewall logs for unusually established connections that may align with the suspicious script execution.

  - **Identify high-confidence malicious indicators**: Look for conjunctions of downloadstring or downloadfile functionality alongside a significant increase in network traffic to unfamiliar IP addresses or domains that do not match your established whitelist.

  - **Investigate asset roles**: Evaluate if the source system playing host to these actions has elevated privileges or is critical within the network (e.g., domain controllers or servers) where malicious usage could pose a higher risk.

  ### Prioritization

  Given that the alert indicates a potential script execution involving WMI consumers, the severity should be rated high. The affected system can be central to the network's operations, and behaviors exhibited by this rule are commonly weaponized in post-exploitation scenarios to facilitate persistence and further compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of detailed logging enabled for WMI consumer activities or potential obfuscation techniques employed by attackers to disguise script execution patterns. Legitimate administrative tasks may occasionally trigger this alert, such as system monitoring or updates. Companion detections related to PowerShell script execution logs or network traffic monitoring can help strengthen overall coverage and confirm this type of activity effectively.

