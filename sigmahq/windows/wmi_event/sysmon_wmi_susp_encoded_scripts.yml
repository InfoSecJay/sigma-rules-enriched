note: |
  ### Technical Context

  This rule detects the presence of suspicious encoded scripts executed within Windows Management Instrumentation (WMI) Event Consumers, specifically targeting instances where encoded payloads are used to run malicious processes. The likely attacker objective is to execute payloads for either execution or persistence on a compromised system, leveraging WMI to circumvent traditional detection measures. This behavior relates to the MITRE ATT&CK techniques T1047 (Windows Management Instrumentation) and T1546.003 (WMI Event Subscription).

  The primary telemetry sources are WMI event logs, specifically detailing events related to encoded payloads and the usage of memory manipulation functions like `WriteProcessMemory`. The security impact is significant, as successful execution may lead to system compromise or unauthorized access. It is essential to note that this detection does NOT confirm that a system has been compromised without additional contextual evidence supporting malicious intent.

  ### Investigation Steps

  - **Identify the WMI Event Consumer:** Review `Microsoft-Windows-WMI-Activity/Operational` logs for Event ID 5861. Look for event entries related to the execution of WMI scripts containing suspicious payloads, particularly those indicating `WriteProcessMemory`.

  - **Analyze the Script Payload:** Examine the decoded payload using a tool such as Base64 decoder or string analysis. Verify its contents for known malicious commands or behaviors. Malicious content may include references to known malware patterns or the execution of non-standard binaries.

  - **Check for Execution Context:** Review related Windows Event logs (Security Event ID 4688) to find the process creation associated with the decoded WMI script. Compare the parent processes to identify unusual execution patterns. Genuine administrative or system tasks must be contextualized to differentiate from potential attack indicators.

  - **Investigate Scheduled Tasks or Services:** Search for any WMI-based scheduled tasks or services employing `schtasks` or similar commands through `Microsoft-Windows-TaskScheduler/Operational` logs. Unexpected entries may indicate persistence mechanisms typically used by attackers.

  - **Containment and Incident Response Actions:** If a confirmed malicious WMI consumer is found, consult with Incident Response Teams for containment measures. Validate the existence of artifacts, such as any recently created files or unusual network connections that could relate to the encoded payload.

  ### Prioritization

  This alert holds a high severity due to the potential impact on critical systems if the WMI consumer is used for malicious persistence or execution. The likelihood of exploitation is elevated, as these techniques are commonly weaponized by attackers to maintain footholds in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by variations in WMI configurations or poorly configured logging settings. Additionally, legitimate administrative actions that utilize encoded scripts for automated tasks might trigger this alert, necessitating a contextual investigation. A related detection that strengthens coverage would be monitoring for anomalous `Sysmon Event ID 10` (ProcessAccess) to identify abnormal process interactions involving WMI-related actions.

