note: |
  ### Technical Context

  This rule detects the creation of Windows Management Instrumentation (WMI) event subscriptions, which often serve as a persistence mechanism for attackers. The likely objective of an adversary using WMI event subscriptions is to maintain access to compromised systems even after reboots or user logouts. This behavior falls under the MITRE ATT&CK techniques T1546.003 (WMI Event Subscription) within the persistence tactic.

  Key telemetry sources include Sysmon logs, specifically Event IDs 19, 20, and 21, which provide information on WMI event filters and consumers. If these events are malicious, an attacker may execute code when specified events occur. However, this detection does not automatically indicate malicious intent; legitimate administrative use of WMI subscriptions can trigger these alerts.

  ### Investigation Steps

  - **Check for Event Filter Creation (ID 19):** Review Sysmon Event ID 19 logs for recent event filter creations, noting suspicious parameters or unusual filter names that differ from standard operational practices.

  - **Review Event Consumer Entries (ID 20):** Inspect Sysmon Event ID 20 logs to identify any new WMI event consumers—look for automation scripts or tools that might trigger execution upon specific system events.

  - **Identify WMI Subscriptions (ID 21):** Analyze Sysmon Event ID 21 for WMI event consumer-to-filter associations. Look for unique or unfamiliar components or configurations that might indicate misuse.

  - **Cross-reference Legitimate Usage:** Validate against known legitimate WMI event subscriptions used in your environment. Document what legitimate WMI subscriptions look like to differentiate between benign and malicious indicators.

  - **Analyze the Risk Profile of Affected Systems:** Note the role and criticality of the affected system(s)—high-value systems such as domain controllers or critical servers may require immediate escalation if anomalous WMI entries are detected.

  - **Monitor for Script or Command Execution:** Look for correlated events where a script or executable was triggered by the detected WMI subscription. This could indicate a higher confidence in malicious activity, especially if combined with unusual file access patterns.

  ### Prioritization

  This alert should be treated with medium severity, particularly if it involves critical systems where persistence methods are likely to lead to significant security impacts. The likelihood of a malicious WMI event subscription is higher, given that this technique is commonly weaponized in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection can be limited by the presence of legitimate WMI usage, which may cause false positives if not properly vetted. Ensure that you have comprehensive logging enabled for Sysmon to avoid gaps. Additionally, legitimate administrative tasks, especially those involved in automated monitoring or management, could inadvertently trigger this alert. Related detection strategies may include monitoring for unusual process creation events that correlate with WMI activity.

