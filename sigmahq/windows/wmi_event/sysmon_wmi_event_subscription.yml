  ### Technical Context
  This detection rule identifies the creation of Windows Management Instrumentation (WMI) event subscriptions, which can be used by attackers as a persistence mechanism. The rule focuses on specific Event IDs (19, 20, and 21), which capture relevant activities concerning WMI event filters and consumers. An attacker may leverage WMI event subscriptions to execute malicious code based on specific triggers, allowing them to maintain persistence within a system even after an initial infection is mitigated.

  The suspected threat scenario involves a sophisticated attacker attempting to evade detection while establishing a backdoor through persistent mechanisms. Their primary objective is to maintain access to compromised systems for future exploitation or data exfiltration. The associated MITRE ATT&CK techniques include **T1546.003: WMI Events** for persistence and **T1071.001: Application Layer Protocol: Web Protocols** if they use WMI to communicate with command and control (C2) servers. The primary data sources for this detection include Windows event logs related to WMI activities and security-related logs from SIEM solutions.

  ### Investigation Steps
  - **Review WMI Event Logs:** Examine Windows Event Logs for Event IDs 19, 20, and 21 to identify any unauthorized or suspicious WMI event subscriptions created within your environment.
  - **Analyze Filter and Consumer Details:** Investigate the specific attributes of the WMI filters and consumers to discern if they align with known legitimate usage or exhibit anomalous configuration that may indicate malicious intent.
  - **Cross-reference with Known Good Tools:** Compare detected WMI subscriptions against a known baseline or inventory of legitimate applications that utilize WMI functionalities to identify potential outliers.
  - **Monitor System Behavior:** Check for unusual processes or network activity resulting from the suspicious WMI subscriptions, including connections to external servers or execution of unknown executables.

  ### Prioritization
  The alert is categorized as medium severity due to its implications for persistence and potential privilege escalation in an enterprise environment. If left unchecked, WMI event subscriptions can enable attackers to maintain ongoing access and escalate their privileges.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage due to legitimate WMI use cases that are common in enterprise systems which could generate false positives. The detection logic assumes that unauthorized use will be differentiated from legitimate subscriptions through analysis of specific event attributes. For the alert to function effectively, comprehensive logging of WMI actions must be enabled, and security teams should have visibility into both security and system event logs.

