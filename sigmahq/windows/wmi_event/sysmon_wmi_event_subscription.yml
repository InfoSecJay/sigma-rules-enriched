note: |
  ### Technical Context

  This rule detects the creation of Windows Management Instrumentation (WMI) event subscriptions, which can be utilized by attackers to establish persistence on compromised systems. The objective behind this behavior is often to maintain access and execute malicious payloads or commands at specified events, making it a stealthy persistence method. Relevant MITRE ATT&CK techniques include "WMI Event Subscription" (T1546.003) under the tactics of Persistence and Privilege Escalation. The primary telemetry sources are Windows Event logs, specifically focusing on Event IDs 19 (WMI Event Filter activity detected), 20 (WMI Event Consumer activity detected), and 21 (WMI Event Consumer to Filter activity detected). If this behavior is malicious, it could lead to unauthorized access or control over the targeted system.

  However, this detection does NOT confirm the intent behind the creation of WMI subscriptions; legitimate administrative actions could also trigger these alerts.

  ### Investigation Steps

  - **Review WMI Event Logs**: Query for Event IDs 19, 20, and 21 in the Security logs (Event Viewer > Applications and Services Logs > Microsoft > Windows > WMI-Activity) to identify recent event subscriptions set up on the host.

  - **Examine Subscription Details for Anomalies**: Investigate event details for unusual or unexpected filters or consumers, such as those targeting sensitive or system-critical processes. Look for unusual actions in the event data (e.g., external scripts).

  - **Identify Legitimate Usage**: Determine if WMI subscriptions have been legitimately created by authorized personnel. Check recent changes or deployments that would necessitate such subscriptions; comparison with historical entries can help establish normal behavior.

  - **Assess the Asset's Role**: Consider the host’s role in your environment. Critical servers should not have unapproved or unexpected WMI subscriptions. Assets with legitimate need for WMI should have documented use.

  - **Look for High-Confidence Malicious Indicators**: Investigate associated processes triggered by the WMI Event Consumers. For example, hunting for suspicious command-line arguments in related Event ID logs can help identify malicious activity (potentially seen in Event ID 4688 for process creation).

  ### Prioritization

  This alert has medium severity due to the potential impact of persistence mechanisms on critical systems. The likelihood of abuse is moderate, particularly in environments where WMI is used widely, but it can be weaponized based on observed attacker tactics.

  ### Blind Spots and Assumptions

  Evasion techniques include the use of legitimate administrative tools that create WMI subscriptions, making it essential to correlate WMI events with other telemetry for accurate context. Ensure all relevant WMI logs are enabled and monitored to capture this activity reliably. Legitimate software installations and administrative scripts might also trigger this alert, potentially leading to false positives. A related detection to strengthen coverage could involve monitoring for unusual process creation patterns (Event ID 4688) associated with new WMI consumers.

