  ---

  ### Technical Context

  This rule detects the execution of a script interpreter (Wscript or Cscript) that initiates a network connection to a local IP address, typically for the purpose of downloading or executing a script from a shared folder. The likely attacker objective is to leverage legitimate scripting capabilities for malicious actions, such as executing scripts that could perform reconnaissance, lateral movement, or data exfiltration. This behavior fits within the MITRE ATT&CK framework under the tactic of Command and Control, specifically the technique T1105 (Ingress Tool Transfer).

  The primary telemetry sources for this detection are Windows network connection logs, specifically focusing on properties related to the script interpreter's execution. If this behavior is malicious, the security impact could include unauthorized use of system resources or access to sensitive data. Importantly, this detection does NOT confirm that a malicious action occurred on its own, as legitimate scripting activities can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review process creation events**: Check for Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 to confirm the invocation of Wscript.exe or Cscript.exe around the same time as the detected network connection.

  - **Identify network connection details**: Analyze the relevant connection logs for the initiated network action, focusing on fields such as DestinationIp, SourceIp, and Timestamp to verify if the destination aligns with known internal structured addresses.

  - **Correlate with legitimate activity**: Determine if the script was executed as part of a scheduled task or a legitimate system management operation. Typical benign activity may involve administrative scripts in a controlled environment with appropriate logging.

  - **Check for known malicious indicators**: Identify if the destination IP is communicating with known malicious endpoints or if the script being executed has a hash value correlating with known malware samples.

  - **Assess script content and behavior**: If possible, retrieve the contents of the script executed. Review it for obfuscated commands or unusual network requests that indicate malicious behavior.

  - **Document asset criticality**: Understand the role of the host system where the detection originated (e.g., a domain controller vs. a regular workstation) to ascertain the potential impact of malicious activity.

  ---

  ### Prioritization

  This alert is medium priority due to the growing threat landscape where attackers utilize legitimate tools, such as script interpreters, for malicious purposes. Such behaviors have been weaponized, especially in lateral movement and malware deployment strategies, making swift investigation essential.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed scripting context or incomplete logging configurations that fail to capture all process creation events. Legitimate administrative scripts can trigger this alert, leading to potential false positives. Companion detection rules such as remote execution activities (e.g., RDP or SMB connections) can enhance coverage by providing additional context around potential lateral movement.

