note: |
  ### Technical Context

  This Sigma rule detects when a script interpreter (Wscript or Cscript) initiates a local network connection, likely aiming to download or execute scripts from a shared folder. The likely attacker objective is to use malicious scripts for lateral movement or initial payload execution in a compromised environment. This activity is aligned with the MITRE ATT&CK tactic of Command and Control (T1071) under the technique T1105 (Ingress Tool Transfer).

  The primary telemetry sources for this detection are Windows network connection logs that capture events regarding script interpreter executions. If malicious, this behavior can indicate unauthorized access to files and systems on the local network, potentially leading to further exploitation. It is important to note that while this detection indicates unusual script-driven network activity, it does NOT confirm the intent behind the connection or that any malicious content was actually downloaded or executed.

  ### Investigation Steps

  - **Verify script execution source:** Examine the process creation logs (Windows Event ID 4688 or Sysmon Event ID 1) to identify the original location of the Wscript or Cscript process. Benign usage typically includes scripts for administrative tasks originating from well-known directories (e.g., `C:\Scripts`).

  - **Identify network connection details:** Check network connection logs (Windows Event ID 5156) for the respective destination IP addresses (e.g., local subnet ranges like 192.168.x.x). Look for unusual destination hosts, especially if multiple connections are initiated in a short timeframe.

  - **Correlate with shared folder activity:** Review file access logs (Windows Security Event ID 4663) to see if the script accessed shared resources or executed files. Investigate if any file transfer or execution aligns with known malicious files or scripts.

  - **Look for known malicious indicators:** Validate if the invoked scripts contain known signatures or hashes linked to malicious activity. Utilize threat intelligence feeds to correlate against the script's behavior or hosting location.

  - **Eliminate legitimate activity:** Determine if the detected activity can be traced back to authorized users performing legitimate tasks, such as automated system updates or batch processing scripts.

  - **Check for suspicious lateral movement:** Review other security logs (e.g., Event IDs for remote desktop logins) for potential lateral movement where the script could indicate an attempt to spread malware within the network.

  ### Prioritization

  This alert has a medium severity level because it pertains to local connections which could be leveraged by an attacker for lateral movement or data exfiltration within the internal network. The likelihood of malicious abuse is significant due to the common use of scripts by attackers to facilitate nefarious activities, though not all script usage is inherently malicious.

  ### Blind Spots and Assumptions

  Detection may be limited if logs from Windows Firewall or network devices are not properly configured to capture all relevant traffic. Attackers may employ evasion techniques such as obfuscating scripts or using trusted scripts to blend in with legitimate activity. This alert may also be triggered by legitimate administrative tasks; thus, corroborating evidence from other logs is essential. A related detection rule for monitoring script execution anomalies would complement this coverage effectively, bolstering overall visibility into script-related activities.

