level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where a Windows script interpreter, such as Wscript or Cscript, initiates a network connection to access a script likely hosted on a shared folder. This activity can indicate a potential command-and-control (C2) scenario, where an adversary uses a script to execute malicious payloads or download further malware. The threat may involve various attack vectors, including automated exploitation of local resources in the environment.

  The primary objective of attackers utilizing this technique aligns with lateral movement or data exfiltration, as they may be attempting to execute scripts that facilitate further compromise within the network or access sensitive information. Relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Application Layer Protocol" (T1105), which involve executing scripts or commands to household resources for malicious purposes.

  The best evidence for detecting such activities can be found in network connection logs. Specific sources include logs from Windows event logging, which capture process creation events, enabling tracking of when and how network connections are initiated by script interpreters.

  ### Investigation Steps
  - **Review Process Logs:** Examine process creation and termination logs to identify activity related to Wscript and Cscript. Look for patterns indicating unusual or unauthorized script execution.
  - **Analyze Network Connection Logs:** Investigate network logs to confirm the details of the initiated connection. Focus on external and internal IP addresses that deviate from normal traffic patterns.
  - **Check Share Access Logs:** Inspect logs from file shares and access audits to identify unauthorized access to scripts. This can help to determine if the script being executed is indeed malicious or part of legitimate operations.
  - **Identify Related Alerts:** Correlate findings with other security alerts or indicators of compromise that may provide additional context about the potential threat landscape and confirm if the script is associated with known malware or attack campaigns.

  ### Prioritization
  This alert should be treated with medium severity in an enterprise environment due to the potential for malicious activities associated with script execution, especially if the source is not well-documented or if the behavior is inconsistent with typical operations.

  ### Blind Spots and Assumptions
  Detection logic may miss legitimate use cases where scripts are executed for business purposes, leading to false positives. Assumptions include that tailored scripts are not part of routine administrative tasks and that any use of script interpreters for initiating network connections is suspicious. Required logs include detailed process creation events and network connection logs; without comprehensive logging of script executions, detection may be ineffective.

