note: |
  ### Technical Context

  This Sigma rule detects when a script interpreter (Wscript or Cscript) initiates a local network connection, potentially to download or execute a script from a shared folder. The likely objective of an attacker utilizing this behavior could involve executing malicious scripts or exfiltrating sensitive data through local connections, aligning with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique T1105 (Ingress Tool Transfer). The primary telemetry source is the Windows network connection logs capturing initiated connections, particularly the process and destination IP addresses. If malicious, this behavior could indicate unauthorized data transfer or the execution of scripts that may compromise system integrity. This detection does NOT confirm that the script itself is malicious without additional context such as the content of the script or its source.

  ### Investigation Steps

  - **Analyze Process Creation Events:** Examine Windows Security Event ID 4688 or Sysmon Event ID 1 to identify when Wscript or Cscript was executed, including arguments. Determine if the script path points to a suspicious location or unknown script.

  - **Investigate Network Connection Details:** Check network connection logs (e.g., Windows Firewall or relevant Sysmon logs) for Event ID 3, focusing on the `DestinationIp` and `Initiated` fields to see if the connection is made to an internal, unexpected IP address or domain.

  - **Review Script Content:** If possible, retrieve the script being executed at the identified process. Analyze its content for common indicators of maliciousness, such as base64 encoding or suspicious commands.

  - **Verify Legitimate Operations:** Confirm whether the execution of Wscript or Cscript is common for internal processes (e.g., legitimate software deployments or scheduled tasks) without malicious indicators, ensuring the process aligns with expected organizational behavior.

  - **Identify Malicious Indicators:** Look for additional telemetry indicating lateral movement or data exfiltration attempts post-initiation. For instance, subsequent SMB or HTTP requests following the script execution should be scrutinized.

  - **Assess Asset Role and Impact:** Evaluate the criticality of the host from which the connection originated. Scripts running on sensitive systems (e.g., domain controllers or database servers) warrant higher priority and immediate response.

  ### Prioritization

  This alert indicates potential misuse of scripting environments that could lead to unauthorized data transfer or system compromise. The impact level is medium due to the possibility of attackers leveraging local network connections for lateral movement. While less common, leveraging scripting interpreters for local connections is a recognized technique in exploitation scenarios.

  ### Blind Spots and Assumptions

  Evasion techniques include using legitimate scripting tools and scheduled tasks to obscure malicious intent. Detection requires clear logging from network connections and process creations, ensuring logs are enabled for relevant system activities. Legitimate administrative scripts may trigger this alert, and companion detections, such as monitoring for unusual file access in shared folders (e.g., T1081 - Credentials in Files), can strengthen coverage.

