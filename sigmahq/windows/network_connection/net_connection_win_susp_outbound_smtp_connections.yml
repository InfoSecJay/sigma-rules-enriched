title: Suspicious Outbound SMTP Connections
id: 9976fa64-2804-423c-8a5b-646ade840773
status: test
description: |
  Adversaries may steal data by exfiltrating it over an un-encrypted network protocol other than that of the existing command and control channel.
  The data may also be sent to an alternate network location from the main command and control server.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1048.003/T1048.003.md#atomic-test-5---exfiltration-over-alternative-protocol---smtp
- https://www.ietf.org/rfc/rfc2821.txt
author: frack113
date: 2022-01-07
modified: 2022-09-21
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort:
    - 25
    - 587
    - 465
    - 2525
    Initiated: 'true'
  filter_clients:
    Image|endswith:
    - \thunderbird.exe
    - \outlook.exe
  filter_mailserver:
    Image|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
  filter_outlook:
    Image|startswith: 'C:\Program Files\WindowsApps\microsoft.windowscommunicationsapps_'
    Image|endswith: '\HxTsr.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Other SMTP tools
level: medium
note: |
  ### Technical Context

  This rule detects anomalous outbound SMTP connections involving unencrypted protocols on typical SMTP ports (25, 587, 465, 2525). Attackers may leverage these connections to exfiltrate sensitive data to alternative destinations, evading primary command and control channels. The relevant MITRE ATT&CK technique is T1048.003 (Exfiltration Over Alternative Protocol: SMTP). Primary telemetry sources include network connection logs capturing outbound traffic, specifically telemetry indicating connections initiated from non-legitimate email clients (e.g., unauthorized instances of Thunderbird or Outlook). If malicious, this behavior could allow adversaries to siphon critical data from the organization. Notably, this detection alone does not confirm malicious intent; benign SMTP activity may exist under certain parameters.

  ### Investigation Steps

  - **Review outbound SMTP connections:** Check for Event IDs relevant to network connections (e.g., Windows Event ID 5156 for Windows Filtering Platform), focusing on connections initiated to ports 25, 587, 465, and 2525.

  - **Identify legitimate email client behavior:** Validate typical SMTP traffic originating from recognized business applications, such as Microsoft Exchange or approved versions of Outlook and Thunderbird. Confirm if these applications are running on expected endpoints.

  - **Examine app execution logs:** Cross-reference alerts with process creation logs (e.g., Sysmon Event ID 1) to verify if suspicious outbound connections were initiated by unauthorized applications or processes.

  - **Investigate auxiliary data:** Check for signs of data exfiltration, such as large volumes of outbound email traffic linked to identified threads. Focus on email headers and attachments for sensitive data types (e.g., *.docx, *.xlsx).

  - **Analyze destination behavior:** Validate the destination IPs or domains of detected outbound connections. Use threat intelligence feeds to assess if they are associated with known malicious entities.

  ### Prioritization

  This alert has medium severity due to the potential risk of data exfiltration via common SMTP protocols. The likelihood of malicious use is elevated, particularly in environments where sensitive data is prevalent. Such behavior is often weaponized in targeted attacks and should be treated with appropriate urgency.

  ### Blind Spots and Assumptions

  The detection can have limitations due to the presence of legitimate SMTP tools that may trigger similar alerts, necessitating comprehensive log configurations (including firewall and application logs). It assumes rigorous monitoring of outbound SMTP traffic and may not capture encrypted connections. Related detections include anomalous DNS queries or bulk outbound traffic that could signify data loss or exfiltration activities, thereby enhancing overall visibility into potential malicious behavior.

