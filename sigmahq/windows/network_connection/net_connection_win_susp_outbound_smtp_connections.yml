title: Suspicious Outbound SMTP Connections
id: 9976fa64-2804-423c-8a5b-646ade840773
status: test
description: |
  Adversaries may steal data by exfiltrating it over an un-encrypted network protocol other than that of the existing command and control channel.
  The data may also be sent to an alternate network location from the main command and control server.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1048.003/T1048.003.md#atomic-test-5---exfiltration-over-alternative-protocol---smtp
- https://www.ietf.org/rfc/rfc2821.txt
author: frack113
date: 2022-01-07
modified: 2022-09-21
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort:
    - 25
    - 587
    - 465
    - 2525
    Initiated: 'true'
  filter_clients:
    Image|endswith:
    - \thunderbird.exe
    - \outlook.exe
  filter_mailserver:
    Image|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
  filter_outlook:
    Image|startswith: 'C:\Program Files\WindowsApps\microsoft.windowscommunicationsapps_'
    Image|endswith: '\HxTsr.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Other SMTP tools
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious outbound SMTP connections from enterprise systems. The focus is on monitoring unauthorized or unusual SMTP communications that might be associated with data exfiltration or malicious activities. Adversaries often leverage common email clients to obfuscate their malicious actions, using standard email ports to exfiltrate sensitive data outside the network.

  The likely attacker objective in this scenario is to steal confidential data without detection, leveraging SMTP due to its prevalence and the potential for avoiding traditional security inspections. Attackers may aim to minimize their footprint by using legitimate tools for data transport, which complicates detection and increases the risk of data breach incidents.

  This detection aligns with several MITRE ATT&CK tactics and techniques, specifically:
  - **Exfiltration** (TA0010)
  - **Exfiltration Over Alternative Protocol** (T1048.003)

  Primary data sources that provide the best evidence for detection include network connection logs, which document the initiation of such SMTP connections, including details about the destination port and the client applications used in these communications.

  ### Investigation Steps
  - **Review SMTP Logs**: Analyze outbound SMTP connection logs for unusual patterns, specifically connections over ports 25, 587, 465, or 2525, particularly from systems not typically associated with outbound email activity.

  - **Examine Client Applications**: Check the endpoints that initiated the connections and identify the applications in use. Examine if the connections were made by extraordinary applications like Thunderbird or Outlook, but rule out established email servers like Microsoft Exchange.

  - **Identify Unusual Destination Domains**: Investigate the domain names used for outbound SMTP connections. Look for unfamiliar or internally untrusted domains that may indicate potential exfiltration targets.

  - **Cross-Reference with Endpoint Activity**: Compare the identified outbound connections with endpoint detection logs to identify any preceding suspicious activity such as file access patterns or data compression that could support the exfiltration hypothesis.

  ### Prioritization
  The alert is categorized with medium severity due to its potential impact on sensitive data loss if successful, coupled with the likelihood of detection evasion by attackers using common applications for communication. Given the critical nature of data exfiltration events, any alert of this type should be promptly investigated.

  ### Blind Spots and Assumptions
  Detection coverage may be limited for environments using non-standard configurations or alternate SMTP tools that could lead to false negatives. The effectiveness of this rule assumes that outbound SMTP traffic is monitored sufficiently and that logs from network devices are appropriately configured to capture this traffic. If organizations use legitimate tools for SMTP communication, additional context may be needed to distinguish between benign and malicious events effectively.

