title: Suspicious Network Connection Binary No CommandLine
id: 20384606-a124-4fec-acbb-8bd373728613
status: test
description: Detects suspicious network connections made by a well-known Windows
  binary run with no command line parameters
references:
- https://redcanary.com/blog/raspberry-robin/
author: Florian Roth (Nextron Systems)
date: 2022-07-03
tags:
- attack.defense-evasion
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith:
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\dllhost.exe'
    CommandLine|endswith:
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\dllhost.exe'
  filter_no_cmdline:
    CommandLine: ''
  filter_null:   # e.g. Sysmon has no CommandLine field in network events with ID 3
    CommandLine:
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious network connections initiated by specific Windows binaries (regsvr32.exe, rundll32.exe, dllhost.exe) when no command-line parameters are present. The likely objective of the attacker is to leverage these legitimate binaries for malicious purposes, such as executing payloads or establishing connections without typical indicators of compromise. In the context of the MITRE ATT&CK framework, this behavior aligns with the technique **Process Injection (T1055)** and **Defense Evasion (T1560)**.

  The primary telemetry sources are network connection logs from endpoints, particularly looking for Windows event logs that indicate network activities associated with the specified binaries, notably with an empty or null command line. If malicious, this activity could lead to data exfiltration, lateral movement, or the establishment of command-and-control channels. Importantly, it is crucial to note that this detection does NOT confirm malicious activity on its own, as benign operations may also exhibit similar characteristics.

  ### Investigation Steps

  - **Examine network connection logs:** Review logs corresponding to Event ID 5156 from Windows Security logs to inspect the remote IP addresses and ports used by the identified binaries. Look for connections that are unusual for the normal operations of the host.

  - **Check command line usage:** Verify if the command line fields for the same process are indeed empty or null in Sysmon Event ID 3 logs. Legitimate instances may include non-interactive uses of these binaries, whereas unexpected empty command lines suggest possible misuse.

  - **Correlate with process activity:** Cross-reference these network connection events with process creation logs (Event ID 4688 or Sysmon Event ID 1) to identify when and how these processes were started. Look for signs such as unusual parent processes or pathways not typical for organizational use.

  - **Identify malicious indicators:** Investigate any recorded remote IP addresses against threat intelligence sources to discern known malicious entities. A high-confidence indicator would be connections to backlisted IPs, especially if these connections are infrequent within usual network patterns.

  - **Review host roles and expected behavior:** Analyze the asset's criticality and role. For highly sensitive servers, connections from these binaries might be more worrisome, especially if they deviate from baseline connection patterns. Evaluate normal operations to contextualize the suspicious behavior.

  ### Prioritization

  This alert warrants high priority due to the potential compromise of critical systems, especially considering that Windows binaries are commonly abused by threat actors. The likelihood of abuse is elevated given the stealthy nature of these processes, which are routinely weaponized in malware campaigns to evade detection.

  ### Blind Spots and Assumptions

  This detection may suffer from evasion techniques such as using command-line obfuscation or employing surgical timing to avoid detection. Reliable detection is contingent upon having complete logging enabled, particularly Sysmon for process creation and command line parameter events. Legitimate administrative tasks or system updates may sometimes trigger this alert. A related detection includes monitoring for abnormal parent-child relationships in process creation logs to strengthen coverage on potential execution chains.

