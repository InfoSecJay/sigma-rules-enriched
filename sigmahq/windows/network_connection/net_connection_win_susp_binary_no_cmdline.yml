title: Suspicious Network Connection Binary No CommandLine
id: 20384606-a124-4fec-acbb-8bd373728613
status: test
description: Detects suspicious network connections made by a well-known Windows binary
  run with no command line parameters
references:
- https://redcanary.com/blog/raspberry-robin/
author: Florian Roth (Nextron Systems)
date: 2022-07-03
tags:
- attack.defense-evasion
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith:
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\dllhost.exe'
    CommandLine|endswith:
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\dllhost.exe'
  filter_no_cmdline:
    CommandLine: ''
  filter_null:   # e.g. Sysmon has no CommandLine field in network events with ID 3
    CommandLine:
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious network connections initiated by specific Windows binaries—namely, `regsvr32.exe`, `rundll32.exe`, and `dllhost.exe`—when they are executed without any command line parameters. The absence of command line arguments is unusual for these binaries, which are commonly used for legitimate purposes in administrative tasks or application execution. However, threat actors frequently exploit these binaries as part of their toolkit, leveraging the legitimate appearance of these processes to bypass security controls and execute malicious code or access sensitive systems.

  The detected behavior is associated with tactics such as Defense Evasion (TA0005) and Execution (TA0002) within the MITRE ATT&CK framework. The use of these binaries without command line arguments often indicates an attempt to obscure true intentions, potentially leading to information exfiltration or lateral movement within an enterprise network.

  Primary sources of relevant telemetry include network connection logs generated by Windows devices, specifically examining the attributes associated with process executions and command line arguments. These logs can provide insight into the legitimacy of the observed behaviors and help in the identification of the execution context of these binaries.

  ### Investigation Steps
  - **Review Network Connection Logs**: Analyze network connection logs for records associated with `regsvr32.exe`, `rundll32.exe`, and `dllhost.exe`. Look for connections initiated without command line parameters, paying attention to the destination IP addresses and ports being accessed.

  - **Correlate with Process Creation Events**: Cross-reference the network connection logs with process creation events. Identify if the binaries were launched from unusual paths or by unexpected parent processes, which may indicate suspicious activity.

  - **Check for Additional Artifacts**: Investigate other system logs, such as Sysmon logs, to identify any related activity around the time of the network connection. This includes checking for file creation or modification events related to these binaries.

  - **Assess Recent Changes in Environment**: Inquire about any recent changes in the network environment, including new software deployments or security updates. Understanding the context may help discern whether the behavior could be tied to legitimate administrative activity or not.

  ### Prioritization
  This alert should be considered high severity in an enterprise environment due to the potential for malicious activity leveraging commonly trusted tools. The likelihood of a successful attack is elevated, particularly if these network connections align with other indicative behaviors or if they originate from sensitive systems.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage; for instance, if command line arguments are present but appear non-malicious, they may not trigger this rule. Additionally, the detection logic assumes that suspicious behavior will manifest through the specified binaries, possibly overlooking other tools that attackers could leverage in the same manner. Effective log collection sets must be in place from both networking devices and endpoint processes; without adequate logging configuration, such as Sysmon installation and proper network telemetry capture, the detection may fail to generate alerts as intended.

