title: Suspicious Network Connection Binary No CommandLine
id: 20384606-a124-4fec-acbb-8bd373728613
status: test
description: Detects suspicious network connections made by a well-known Windows
  binary run with no command line parameters
references:
- https://redcanary.com/blog/raspberry-robin/
author: Florian Roth (Nextron Systems)
date: 2022-07-03
tags:
- attack.stealth
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith:
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\dllhost.exe'
    CommandLine|endswith:
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\dllhost.exe'
  filter_no_cmdline:
    CommandLine: ''
  filter_null:   # e.g. Sysmon has no CommandLine field in network events with ID 3
    CommandLine:
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies suspicious network connections initiated by known Windows binaries (`regsvr32.exe`, `rundll32.exe`, `dllhost.exe`) that lack an accompanying command line. Attackers often use these binaries in stealthy ways to execute malicious code without drawing attention, aiming to infiltrate a network, exfiltrate data, or establish persistence. This behavior aligns with the MITRE ATT&CK tactic of **Execution (TA0002)**, particularly technique **Windows Command Shell (T1059.003)** for stealthy executions via trusted binaries.

  The primary telemetry sources required for this detection are network traffic logs capturing connection initiation events, notably those from Sysmon (Event ID 3) or Windows Firewall logs. Malicious activity could pose significant risks, including data theft, system compromise, or lateral movement. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate software behavior may also trigger the same alert.

  ### Investigation Steps

  - **Check Process Initiation Context:**
    Look at Sysmon Event ID 1 for process creation details. Verify if the initiating processes (`regsvr32.exe`, `rundll32.exe`, or `dllhost.exe`) were invoked by a suspicious parent process (e.g., powershell.exe or cmd.exe). Legitimate processes should have clear intended parent processes.

  - **Review Network Connection Details:**
    Examine Sysmon Event ID 3 for outgoing connection logs. Focus on the destination IP, port, and whether the connection matches known or expected behavior for the actively running services or applications.

  - **Analyze Command Line Parameters:**
    Investigate the absence of command line parameters in the alert. Legitimate executions will typically include a command line, whereas this behavior suggests potential exploitation tactics.

  - **Identify Anomalous Traffic Patterns:**
    Analyze network flow logs (e.g., from your network monitoring tool) for unusual outbound traffic corresponding to the detected source. Look for high-volume data transfers or previously uncommunicated external IP addresses.

  - **Correlate with Threat Intelligence:**
    Validate any involved IP addresses or domains against threat intelligence sources for prior malicious activity related to this binary execution context.

  - **Assess Asset Criticality:**
    Consider the role of the asset initiating the connection. If it’s a sensitive server or a high-value endpoint, prioritize the investigation due to increased potential impact from detected behavior.

  ### Prioritization

  This alert has high severity due to the potential for critical systems to be compromised through common Windows binaries. The likelihood of malicious misuse is notable given the stealthy nature of these binaries and their frequent use in exploit chains. This behavior is often weaponized in attacks aiming for initial access or lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by systems not forwarding the necessary logs or instances where legitimate software relies on `regsvr32.exe`, `rundll32.exe`, or `dllhost.exe` without command line inputs. False positives may arise in controlled environments where these binaries perform permissible tasks. Companion detections, such as monitoring for parent-child process relationships in Sysmon or correlating with known malicious execution patterns, can enhance coverage and context.

