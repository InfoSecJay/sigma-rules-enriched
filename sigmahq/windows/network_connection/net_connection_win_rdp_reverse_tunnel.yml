  ### Technical Context

  This Sigma rule detects instances where the Windows service host process (svchost.exe) is initiating a Remote Desktop Protocol (RDP) connection on TCP port 3389 to the loopback address (127.0.0.1). This behavior is atypical as legitimate RDP connections usually occur from external sources. The likely attacker objective is to establish a reverse shell or a tunnel for further remote command execution or lateral movement within the network, consistent with MITRE ATT&CK techniques T1572 (Protocol Tunneling) and T1021.001 (Remote Services: RDP).

  The primary source of telemetry for this detection is network connection logs from Windows, specifically monitoring process activity associated with svchost.exe. If this behavior is malicious, it can allow an attacker to bypass network defenses and maintain persistence within the environment. It is essential to clarify that this detection does NOT confirm malicious intent on its own; it indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Check Process Details:** Review process creation logs (Security Event ID 4688) to determine who/what initiated svchost.exe. Look for unusual parent processes or associated command line arguments indicating potential misuse.

  - **Examine Network Connections:** Analyze network connection logs indicating svchost.exe communications (Event ID 5156 in Windows Filtering Platform logs). Confirm whether the source of the connection is legitimate, particularly focusing on entries involving TCP port 3389.

  - **Identify Benign Usage:** Document any legitimate use cases of RDP over loopback addresses in your environment. For example, internal administrative scripts might run RDP sessions for testing-related functions.

  - **Review User Activity Logs:** Check logon events (Security Event IDs 4624 and 4634) for user activity corresponding with the time of the detected RDP connection. Look for unusual login patterns or failed login attempts that preceded the alert.

  - **Cross-reference with Known Adversary Behaviors:** Compare the event with threat intelligence sources for known indicators against T1572 and T1021.001 behaviors, ensuring to highlight any previously identified activities linked to the alert.

  - **Validate RDP Session Artefacts:** Check RDP session logs (Event ID 4624, specifying logon type 3) for session initiation on the server with timestamps matching the alert data. Investigate for any concurrent VPN or SSH activity that could suggest a more complex attack strategy.

  ### Prioritization

  This alert is of high severity due to the potential for significant security impact if exploited, given that affected systems could serve as a backdoor for attackers. The likelihood of malicious abuse is moderate, particularly in environments where RDP is tightly controlled or monitored. Such behavior is not commonly weaponized in the typical attack lifecycle, emphasizing the need for a thorough review.

  ### Blind Spots and Assumptions

  Potential limitations include the possibility of legitimate use cases for internal RDP access not being identified in the investigation. Reliable detection requires comprehensive logging configurations, particularly for both process creation events and network connection logs. Additionally, automated administrative tasks may trigger this alert legitimately, which necessitates clarity around accepted usage in your environment. Companion detections, such as monitoring for unexpected usage of administrative tools or processes (e.g., PowerShell scripts utilizing RDP connections), could enhance coverage and contextual understanding.

