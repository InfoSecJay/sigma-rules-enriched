detection:
  selection:
    Image|endswith: '\certutil.exe'
    Initiated: 'true'
    DestinationPort:
    - 80
    - 135
    - 443
    - 445
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where `certutil.exe`, a legitimate Windows utility often used for managing certificates, initiates a network connection. Attackers can exploit `certutil.exe` to download malware or other malicious payloads, aligning with the tactic of Command and Control (T1060). The relevant MITRE ATT&CK technique is T1105 - "Ingress Tool Transfer." Primary telemetry sources include Windows network connection logs, specifically monitoring the process image `certutil.exe`, and the initiated connection details capturing destination ports (80, 135, 443, 445). If malicious, this activity may indicate a system compromise. However, the detection does NOT confirm that malicious payload transfer is occurring, only that a network initiation from `certutil.exe` has taken place.

  ### Investigation Steps

  - **Check the process initiator:** Review the process creation logs (Security Event ID 4688 or Sysmon Event ID 1) for `certutil.exe`. Verify the parent process; legitimate usage typically appears under trusted processes like `explorer.exe` or `powershell.exe`.

  - **Examine network connection details:** Investigate logs from the Windows Firewall or network monitoring tools for connection attempts from `certutil.exe` (DestinationPorts: 80, 135, 443, 445). Look for unusual external IP addresses or unexpected domains.

  - **Validate contrived command lines:** Search for specific command line arguments used with `certutil.exe` through security logs. For example, presence of `-url` or `-get` parameters can indicate malicious behavior rather than typical certificate management.

  - **Assess system context:** Determine asset roles; connections from servers or critical infrastructure to external IPs initiated by `certutil.exe` are more concerning than those from standard workstations.

  - **Investigate for payload presence:** Check for file creation or downloads related to `certutil.exe` operations by reviewing download paths or temporary files (Windows Event ID 4663 related to file access). Look for accompanying artifacts like suspicious executables in the temp directory.

  ### Prioritization

  This alert is high-severity, especially if originated from critical systems, as it indicates potential command-and-control activity. The likelihood of abuse is significant due to the benign nature of the tool being exploited, making it a common target for malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by environmental constraints; if logging for process creation or network connections is not enabled, the alert may miss events. Legitimate activities such as certificate updates or testing in controlled environments might generate similar alerts. A companion detection to consider is monitoring for abnormal network behavior, such as unexpected data exfiltration patterns from the same host.

