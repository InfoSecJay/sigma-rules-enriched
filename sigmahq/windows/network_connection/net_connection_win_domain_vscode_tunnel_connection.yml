note: |
  ### Technical Context
  This rule detects attempts to establish network connections to Visual Studio Code Tunnel domains initiated by processes running on Windows systems. Attackers may exploit Visual Studio Code's tunnel feature, which is designed for legitimate remote development, to create reverse shells or maintain persistence by communicating with external C2 (command and control) servers. The threat scenario often involves unauthorized access or lateral movement within corporate networks, aiming to exfiltrate data or leverage system resources for further attacks.

  Relevant MITRE ATT&CK tactics include **Exfiltration (TA0010)** and **Command and Control (TA0011)**, with associated techniques such as **T1567: Exfiltration Over Web Service** and **T1572: Protocol Tunneling**. These tactics emphasize the risk of misuse associated with network tunneling functionalities, particularly when they originate from trusted applications like Visual Studio Code, which could otherwise signify normal operations.

  Primary data sources for evidence collection include network connection logs, specifically those capturing endpoints and destination hostnames, which can demonstrate unusual outbound communications. Monitoring DNS queries resolved to Visual Studio Code tunnel addresses and correlating them with running processes can provide additional insights into possible exploitative behavior.

  ### Investigation Steps
  - **Review Network Logs:** Examine network connection logs for instances of initiated connections to `*.tunnels.api.visualstudio.com`. Ensure to note the originating process and user context that initiated the connection.

  - **Analyze Process Activity:** Look into the associated process and its parent processes that made the network connection. Investigate any unexpected processes or unusual command line arguments that could indicate malicious intent.

  - **Correlate with DNS Queries:** Check DNS logs for any resolution requests for `tunnels.api.visualstudio.com` around the same time as the network connection. This will help ascertain if there was a corresponding attempt to utilize the tunnel service.

  - **Assess for Indicators of Compromise:** Investigate other related logs (e.g., EDR logs) for signs of initial compromise, privilege escalation, or anomalous activity that could explain how the attacker gained access to utilize the Visual Studio Code tunnels.

  ### Prioritization
  The alert is considered medium severity due to the potential risk associated with unauthorized remote access tools that can lead to further exploitation or exfiltration of sensitive data. The likelihood of exploitation is heightened in environments where unsecured network traffic is permitted.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if network configurations permit legitimate use of Visual Studio Code tunnels without appropriate monitoring controls in place. The detection logic assumes that malicious actors will initiate connections from uncommon processes or under environments where the configuration falls outside standard operational practices. Additionally, accurate and timely logging of network connections and process activity is required for this alert to function effectively, highlighting the need for comprehensive monitoring of endpoint behaviors and network traffic.

