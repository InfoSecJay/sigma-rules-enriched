note: |
  ### Technical Context

  This detection captures network connections initiated to Visual Studio Code tunnel domains, specifically targeting connections that end with '.tunnels.api.visualstudio.com'. Attackers may exploit this feature to establish reverse shells or maintain persistence on compromised machines using Visual Studio Code's tunneling capabilities for command and control (C2) operations. This activity aligns with the MITRE ATT&CK tactic of Exfiltration (TA0010), particularly the technique for Application Layer Protocol (T1572).

  The primary telemetry source is network connection logs from Windows devices, specifically monitoring for outbound connections. A successful exploit using this tunneling feature could allow attackers to exfiltrate data or issue commands remotely. Importantly, this detection alone does not confirm malicious intent, as legitimate users may utilize Visual Studio Code tunneling without malicious activities.

  ### Investigation Steps

  - **Examine the source process: **Identify the originating process for the outbound connection using Event ID 4688 (Process Creation) or Sysmon Event ID 1. Compare legitimate Visual Studio Code installation paths (e.g., C:\Program Files\Microsoft VS Code\) against suspicious or unusual paths that may indicate malicious use.

  - **Review the destination details: **Validate the destination hostname against known Visual Studio Code tunnel domains. Legitimate operations will show connections to *.tunnels.api.visualstudio.com. Connections to unfamiliar or newly registered domains should raise suspicion.

  - **Check for unusual network activity: **Analyze network traffic logs (such as Windows Firewall log Event ID 5156) for other abnormal outbound connections around the same time. Look for multiple instances of tunnel domain connections occurring in a short time span, which could signal an active C2 session.

  - **Identify legitimate use cases: **Determine if there are any scheduled tasks or standard operating procedures of your development team that involve Visual Studio Code tunneling. Consult internal documentation for expected usage patterns or legitimate environment setups.

  - **Cross-reference with host-based logs: **Investigate Sysmon logs for Event ID 22 (DNS Query) to identify DNS requests to the tunnel domain. If there’s a high volume of DNS Traffic correlating with unusual outbound connection attempts, it’s indicative of potential malicious activity.

  - **Assess user context: **Evaluate the user account ownership of the concerned process. If the user has privileged access but is not in a development function (e.g., operations personnel), this may indicate potentially malicious behavior.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on data exfiltration and persistent access. While many occurrences may be benign, the nature of the tunneling feature makes it attractive for exploitation, and such behavior, if further corroborated, can lead to severe security incidents.

  ### Blind Spots and Assumptions

  Detection may yield false positives due to legitimate use of Visual Studio Code tunneling by developers. It's crucial to ensure that logging is configured to capture related network connections effectively and that all relevant outbound connection logs are available. Additionally, benign applications or development environments may trigger this alert. A related detection to monitor could involve logging outbound DNS queries for insights into suspicious activity around domain resolution, thus strengthening overall coverage.

