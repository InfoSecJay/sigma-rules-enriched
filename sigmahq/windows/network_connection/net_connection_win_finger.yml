note: |
  ### Technical Context

  This rule detects instances of network connections initiated by "finger.exe," a command commonly associated with retrieving remote user information but rarely used in modern Windows environments. The likely objective behind this behavior is to establish a command-and-control (C2) channel for receiving malicious instructions, leveraging the finger protocol, as seen in the ClickFix malware campaign. This activity fits within the MITRE ATT&CK framework under the tactics of Command and Control (T1071.004) and Execution (T1059.003).

  The primary telemetry sources include network connection logs specifically for Windows, indicating outbound calls initiated by "finger.exe." If malicious, the impact can be significant, potentially allowing an adversary to perform unauthorized actions on a compromised system. Importantly, this detection does NOT confirm that the activity is malicious on its own; further investigation is required to correlate with other findings.

  ### Investigation Steps

  - **Identify process invocation:** Check Security Event ID 4688 for any instances of "finger.exe" creation. Confirm details such as the user context and parent process. If created by a legitimate application, this may indicate benign behavior.

  - **Examine network artifacts:** Look for Network Event Logs (Windows) corresponding to the "finger.exe" connections. Note the destination IP/hostname and port. Legitimate usage would typically involve known internal or well-reputed external domains.

  - **Correlate C2 indicators:** Analyze if the external IP addresses contacted by "finger.exe" have been seen in other threat intelligence feeds as malicious. Refer to recent threat reports to gauge historical abuse.

  - **Check for persistence mechanisms:** Review Windows Registry (Event ID 4657) for startup entries linked to "finger.exe." Malicious persistence can indicate an infection vector or additional malicious behavior.

  - **Monitor user activity:** Review user behavior preceding the alert from related User Event Logs (e.g., Event ID 4624 for logins) to identify any unusual access patterns or times, which may indicate a compromised user account.

  - **Identify benign activities:** Compare connection requests from unaffected systems or user profiles that typically utilize "finger.exe" for legitimate reasons (e.g., network admins using legacy tools). These may provide context around the alert’s legitimacy.

  ### Prioritization

  This alert carries a high severity level due to the use of a rarely exploited tool for C2 communications, which can indicate advanced adversary tactics. The affected system's criticality, especially if it has access to sensitive data or administrative privileges, raises concern regarding potential data breach and operational disruption.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate usage of "finger.exe" from trusted administrative scripts or legacy applications, which could trigger false positives. Required log sources include SIEM rules configured to capture detailed network connection logs, complemented by thorough monitoring of outbound traffic. Related detections, such as those identifying unusual outbound network activity (e.g., Event ID 5156 from Windows Filtering Platform), can help corroborate potential malicious intent behind the finger.exe usage.

