note: |
  ### Technical Context
  This detection rule identifies network connections initiated by the `finger.exe` utility, which is a command-line tool historically used for user query and information retrieval. Threat actors have misused this utility in some campaigns, such as the ClickFix malware incident, to execute remote commands on compromised Windows devices. Given that `finger.exe` is seldom utilized in contemporary enterprise environments, any instance of its use, particularly in establishing outbound network connections, raises significant suspicion about potential malicious activities.

  The primary objective of an attacker utilizing `finger.exe` is to establish command-and-control (C2) communications, allowing them to remotely issue commands or extract information from compromised systems. The relevant MITRE ATT&CK tactics and techniques include:
  - **Command and Control (T1071.004)**: Application Layer Protocol: Remote Desktop Protocol and other application layer protocols can facilitate C2.
  - **Execution (T1059.003)**: Command-Line Interface, as `finger.exe` is executed through the command line to initiate connections.

  The best evidence for this detection can be drawn from network connection logs, specifically those detailing outbound traffic from Windows devices to untrusted or unusual hosts.

  ### Investigation Steps
  - **Review Network Connection Logs**: Check logs for any outbound connections initiated by `finger.exe`, particularly noting the destination IP addresses and domains to identify any suspicious or known malicious infrastructure.

  - **Analyze Process Creation Events**: Investigate Windows process creation logs to identify any unusual command-line arguments used with `finger.exe` that could indicate scripted or automated attacks.

  - **Correlate with User Activity**: Evaluate user account activity associated with the system. Determine if the user was authorized to run `finger.exe`, or if there were anomalies in user permissions or roles.

  - **Check Firewall Logs**: Inspect logs from Next-Generation Firewalls (NGFW) for any abnormal traffic patterns related to the `finger.exe` network connections, helping to verify if they are reaching known malicious endpoints or unusual geolocations.

  ### Prioritization
  This alert should be prioritized as high severity because the misuse of a rarely used utility like `finger.exe` to establish network connections can indicate a sophisticated attacker leveraging old techniques to bypass modern defenses. The combination of command execution capabilities and atypical traffic behavior heightens the risk to enterprise environments.

  ### Blind Spots and Assumptions
  This detection may not cover scenarios where indicators of compromise are obfuscated or where threat actors use similarly less common utilities or legitimate networking tools. The detection logic assumes that `finger.exe` will generate outbound network connections in a recognizable format. Additionally, proper logging and monitoring configurations must be enabled for network connections and process creation events for this alert to function effectively.

