note: |
  ### Technical Context

  This rule detects network connections initiated by the process `regsvr32.exe`, which is commonly used for registering and unregistering ActiveX controls or DLLs. Attackers may exploit `regsvr32.exe` to bypass security controls, execute malicious payloads, or communicate with command and control (C2) servers. This behavior typically pertains to the MITRE ATT&CK framework techniques: **T1559.001 - Dynamic Resolution (Regsvr32)** and **T1218.010 - Executable Content in Office Documents**.

  Primary telemetry sources include Windows event logs related to network connections and process creation. Specifically, Event ID 5156 from Windows Firewall logs will capture the outbound connection details. The security impact may involve data exfiltration or remote code execution if initiated maliciously. This detection does NOT confirm that a security incident has occurred on its own; it requires further context from additional data sources.

  ### Investigation Steps

  - **Review network connection logs**: Check Windows Firewall logs for Event ID 5156 where `Source Process Name` equals `C:\Windows\System32\regsvr32.exe`. Look for unusual external IP addresses or ports that do not match the organization's standard operational profile.

  - **Analyze process creation events**: Review Security Event ID 4688 to confirm `regsvr32.exe` was spawned with unusual command line parameters. Legitimate uses typically involve standard parameters related to ActiveX controls or DLL registration.

  - **Check for hierarchical exploitation**: Use Sysmon (Event ID 1) to trace parent-child relationships of `regsvr32.exe`. A legitimate parent process would be a known application like `explorer.exe`, whereas uncommon parents (e.g., `cmd.exe` or `powershell.exe`) may indicate suspicious behavior.

  - **Examine for known malicious indicators**: Cross-reference outbound connection attempts against threat intelligence feeds. Look for documented malicious IPs or domains associated with `regsvr32.exe` exploitation. Also validate if the process contacts known C2 infrastructure.

  - **Evaluate host risk**: Identify the role and criticality of the affected host. Servers or endpoints with elevated privileges that exhibit this behavior require immediate investigation due to the increased risk associated with potential exploitation.

  - **Look for file creation or modification**: Check for Event ID 4663 to identify if any file operations are executed in conjunction with `regsvr32.exe`. Suspicious file creations or changes may indicate additional malicious activity, such as payload execution or script modifications.

  ### Prioritization

  This alert carries a medium severity due to the potential for significant impact if `regsvr32.exe` is exploited for malicious network connections, especially on critical systems. Given the tool’s capability to register malicious DLLs, there is a heightened risk of exploitation in the enterprise. Network executions of this nature are not uncommon and warrant a thorough review.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers obscuring their actions with routine uses of `regsvr32.exe` and legitimate applications initiating the process. Effective detection relies on robust logging configurations for Windows event IDs mentioned, as inadequate logging may result in blind spots. Additionally, legitimate business activities, such as software installations or updates, might trigger this alert. Companion detections like monitoring for unusual processes creating outbound traffic (e.g., PowerShell or cmd.exe) can provide enhanced coverage against similar tactics.

