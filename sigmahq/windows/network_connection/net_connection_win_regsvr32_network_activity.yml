  ### Technical Context

  This Sigma rule detects instances where the Windows utility "Regsvr32.exe" initiates a network connection. Such behavior is often exploited by attackers to execute malicious scripts or download payloads while evading standard detection methods. The likely attacker objective may include lateral movement, command & control communication, or data exfiltration. This activity aligns with the MITRE ATT&CK techniques: **Execution (T1203)** and **Application Layer Protocol Abuse (T1559.001)**.

  The primary telemetry source for this detection involves Windows network connection logs, particularly focusing on the process creation logs linked to Regsvr32.exe. The security impact could be significant, as it may indicate an attacker using a trusted Windows process to execute malicious actions. It is important to note that this detection does not confirm malicious activity by itself; further investigation is required to establish intent and context.

  ### Investigation Steps

  - **Identify network connection details:** Check the network connection logs (Windows Event ID 5156) for outbound connections initiated by Regsvr32.exe. Focus on destination IPs, ports, and connection timestamps.

  - **Correlate process creation logs:** Review Windows Security Event ID 4688 for process creation involving Regsvr32.exe. Note the parent process to assess whether it was triggered by a legitimate user action or a suspicious script.

  - **Evaluate known good usage:** Inquire whether Regsvr32.exe has legitimate purposes in the environment (e.g., registering new COM objects). Check with system/application documentation or development teams for expected usage patterns.

  - **Examine parent-child relationship:** Check for unusual parent process behavior. If the parent process is cmd.exe or powershell.exe (Event ID 4688), it may indicate potential troubleshooting or malicious activity. Validate the command-line arguments used.

  - **Inspect DNS queries:** Review DNS logs for any requests made by the Regsvr32.exe process during its network activity. Look for queries to known malicious domains or domains related to C2 infrastructure.

  - **Look for file creation indicators:** Validate if any suspicious files were created in the temp directories or system directories correlating with Regsvr32.exe activity. This includes examining for the presence of scripts or configuration files that might indicate lateral movement action.

  ### Prioritization

  This alert has medium severity as it indicates a potential misuse of a legitimate Windows utility to initiate network connections, which can often lead to malicious activities. The likelihood of these types of connections being weaponized is moderate, especially if tied to other anomalies or external traffic to malicious domains.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that have allowed Regsvr32.exe as part of normal operations, potentially leading to false positives. The necessary log sources (such as network connection and process creation logs) must be enabled and properly configured for reliable detection. Legitimate software installation or registration processes may also trigger this alert. A related detection for file creation or script execution would supplement coverage by confirming whether malicious files or downloads occurred in tandem with this behavior.

