note: |
  ### Technical Context

  This rule detects outbound network connections initiated by a binary to "api.mega.co.nz", a domain associated with the cloud storage and file sharing service MEGA. Attackers may leverage platforms like MEGA to upload or download malicious payloads, often for the purpose of exfiltration or command and control. The relevant MITRE ATT&CK tactic is Exfiltration (TA0010) and the technique is "Exfiltration to Cloud Storage" (T1567.002). The primary telemetry source is network connection logs, specifically indicating outgoing connections with relevant fields for destination hostname and connection initiation.

  If malicious, this behavior could indicate that sensitive data is being exfiltrated or that malware is interacting with a command and control server hosted on a file sharing service. Importantly, this detection does NOT confirm malicious action on its own; legitimate applications may use MEGA for benign purposes, including authorized file transfers.

  ### Investigation Steps

  - **Identify connection details**: Review network connection logs (Windows Event ID: 5156) to confirm the process responsible for initiating the connection to "api.mega.co.nz". Look for fields such as SourceProcessName and DestinationPort.

  - **Correlate with process activity**: Check for the associated process (from the previous step) in the process creation logs (Sysmon Event ID 1). Validate if the process is known and benign (e.g., legitimate MEGA application) or potentially malicious.

  - **Evaluate historical connections**: Investigate if previous legitimate connections to MEGA domains exist from the same source machine. Use network logs to identify any anomalous patterns, such as multiple connections occurring within a short timeframe.

  - **Review file creation events**: Search for file creation events in the last hour on the affected host (Windows Event ID: 4663) to detect if the process downloaded or uploaded suspicious files. Look for unusual file names or extensions.

  - **Check for known benign applications**: Cross-reference the list of applications that are authorized to use MEGA within your organization to evaluate the legitimacy of the connection. Exclude hosts identified as using MEGA for legitimate business purposes.

  ### Prioritization

  This alert is rated low severity given the potential for legitimate MEGA usage in the environment. However, the risk of exfiltration exists, particularly if the affected system has access to sensitive data. This behavior is not commonly weaponized, but it warrants further analysis due to the nature of the network destination.

  ### Blind Spots and Assumptions

  Detection may be evaded if attackers use alternative communication methods or domains that do not match the detection criteria. Reliable detection requires comprehensive logging of outbound network traffic, specifically for services like MEGA. Legitimate activities might trigger this alert if there are employees using MEGA for business purposes. A related detection could focus on uploads to other cloud services (e.g., Google Drive, Dropbox) which would help in identifying broader exfiltration attempts.

