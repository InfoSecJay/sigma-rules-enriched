falsepositives:
- Legitimate MEGA installers and utilities are expected to communicate with this domain.
  Exclude hosts that are known to be allowed to use this tool.
level: low
note: |
  ### Technical Context
  This detection rule identifies network connections initiated from a binary to the domain "api.mega.co.nz." This behavior is often associated with attackers using cloud storage and file-sharing services like MEGA.nz for the upload and download of malicious payloads, such as exfiltrating sensitive data or transferring malware. Attackers may leverage these platforms to bypass traditional security controls, disguising their activity within seemingly benign traffic.

  The relevant MITRE ATT&CK tactics associated with this detection include **Exfiltration** (T1041) and specifically **Exfiltration Over Web Service** (T1567.002), where attackers utilize web-based services for data exfiltration. The primary data sources useful for investigating this detection will include network connection logs, which can reveal unusual outbound traffic patterns, as well as application logs from the endpoint that may provide insights into the specific binaries initiating these connections.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine logs from network devices for all outgoing connections to "api.mega.co.nz" or "mega.nz." Identify the source IP addresses, ports used, and connection times to establish the context of the traffic.
  - **Analyze Process Activity**: Investigate the binary or process that initiated the connection. Check for unusual process names or parents that could indicate malicious behavior, focusing on the time of connection initiation.
  - **Correlate with EDR Data**: Use endpoint detection response (EDR) tools to review behaviors and events associated with the processes making these network connections. Look for signs of privilege escalation or lateral movement.
  - **Check for Historical Patterns**: Compare current findings with historical data to identify patterns of connections to MEGA.nz-based services. Determine if the endpoints making these connections have a legitimate business reason for their activity.

  ### Prioritization
  The severity of this alert should be considered low; however, any detected connections to MEGA.nz could indicate potential data exfiltration or payload delivery, warranting further analysis, especially if the originating binary is unfamiliar or not normally used within the enterprise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by legitimate use cases where authorized products connect to MEGA.nz, leading to potential false positives. The detection logic assumes that connections from legitimate applications can be excluded based on host reputation or prior authorization. It also relies on comprehensive logging of network connections; if logs are not being captured or analyzed correctly, the effectiveness of this detection would be compromised.

