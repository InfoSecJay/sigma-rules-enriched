title: Potential Remote PowerShell Session Initiated
id: c539afac-c12a-46ed-b1bd-5a5567c9f045
status: test
description: |
  Detects a process that initiated a network connection over ports 5985 or 5986 from a non-network service account.
  This could potentially indicates a remote PowerShell connection.
references:
- https://threathunterplaybook.com/hunts/windows/190511-RemotePwshExecution/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-09-12
modified: 2024-02-02
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.006
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort:
    - 5985
    - 5986
    Initiated: 'true'     # only matches of the initiating system can be evaluated
    SourceIsIpv6: 'false'
  filter_main_service_users:
  - User|contains:       # covers many language settings for Network Service. Please expand
    - 'NETWORK SERVICE'
    - 'NETZWERKDIENST'
    - 'SERVICIO DE RED'
    - 'SERVIZIO DI RETE'
  - User|contains|all:
    - 'SERVICE R'
    - 'SEAU'
  filter_main_localhost:
    SourceIp:
    - '::1'
    - '127.0.0.1'
    DestinationIp:
    - '::1'
    - '127.0.0.1'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\AvastSvc.exe'
    - 'C:\Program Files (x86)\Avast Software\Avast\AvastSvc.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate usage of remote PowerShell, e.g. remote administration and monitoring.
- Network Service user name of a not-covered localization
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify potentially unauthorized remote PowerShell sessions initiated from non-network service accounts on a Windows system. By monitoring network connections specifically over ports 5985 (Windows Remote Management) and 5986 (HTTPS), the rule seeks to catch instances where remote PowerShell is misused for lateral movement or other malicious activities within the network. Attackers often leverage PowerShell for executing commands across systems, making it essential to monitor its usage closely.

  The likely attacker objectives include accessing sensitive data, executing unauthorized commands, or moving laterally within the network. Such actions are indicative of sophisticated threats that can lead to data breaches or system compromises. The relevant MITRE ATT&CK tactics for this rule include **Execution** (ID: T1059.001), which focuses on script execution via PowerShell, and **Lateral Movement** (ID: T1021.006), which encompasses techniques to navigate through a network.

  Primary data sources to effectively leverage this detection include network connection logs and Windows event logs that detail process creation and network activity. Monitoring these data points allows for the identification of suspicious behavior indicative of potential exploitation.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze logs for outbound connections on ports 5985 and 5986, noting any initiations from user accounts that are not classified as network service accounts.

  - **Examine Process Creation Events:** Investigate any new processes being initiated around the same time as the suspicious network connection to determine if PowerShell was invoked through an unusual user context.

  - **Check User Account Activity:** Cross-reference the user account initiating the connection against known legitimate service accounts and user roles within the organization to assess legitimacy.

  - **Correlate with System Events:** Look for any related Windows Event IDs that indicate remote PowerShell usage, such as Event ID 400 for PowerShell scripts execution, as well as logs that reflect commands run through remote sessions.

  ### Prioritization
  The alert's severity is considered high due to the critical nature of remote PowerShell capabilities, which can be exploited by attackers to execute malicious commands and facilitate lateral movement. The likelihood of misuse in enterprise environments is significant, given the prevalence of remote management tools.

  ### Blind Spots and Assumptions
  One potential blind spot is the detection of localized service account names that may not be covered in the rule's filter conditions. Additionally, the assumption is made that initiating connections over the specified ports strictly come from user accounts that should not have such capabilities, potentially overlooking legitimate administrative usage. It is critical for logs related to remote PowerShell sessions and associated user account activities to be properly configured and retained for effective detection.

