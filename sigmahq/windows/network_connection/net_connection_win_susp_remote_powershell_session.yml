title: Potential Remote PowerShell Session Initiated
id: c539afac-c12a-46ed-b1bd-5a5567c9f045
status: test
description: |
  Detects a process that initiated a network connection over ports 5985 or 5986 from a non-network service account.
  This could potentially indicates a remote PowerShell connection.
references:
- https://threathunterplaybook.com/hunts/windows/190511-RemotePwshExecution/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-09-12
modified: 2024-02-02
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.006
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort:
    - 5985
    - 5986
    Initiated: 'true'     # only matches of the initiating system can be evaluated
    SourceIsIpv6: 'false'
  filter_main_service_users:
  - User|contains:       # covers many language settings for Network Service. Please expand
    - 'NETWORK SERVICE'
    - 'NETZWERKDIENST'
    - 'SERVICIO DE RED'
    - 'SERVIZIO DI RETE'
  - User|contains|all:
    - 'SERVICE R'
    - 'SEAU'
  filter_main_localhost:
    SourceIp:
    - '::1'
    - '127.0.0.1'
    DestinationIp:
    - '::1'
    - '127.0.0.1'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\AvastSvc.exe'
    - 'C:\Program Files (x86)\Avast Software\Avast\AvastSvc.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate usage of remote PowerShell, e.g. remote administration and 
  monitoring.
- Network Service user name of a not-covered localization
level: high
regression_tests_path: 
  regression_data/rules/windows/network_connection/net_connection_win_susp_remote_powershell_session/info.yml
note: |
  ### Technical Context

  This rule detects remote PowerShell sessions initiated over TCP ports 5985 (WS-Man) and 5986 (HTTPS) from non-network service accounts. Attackers may use this technique to execute commands remotely, often as part of lateral movement to compromise additional systems or escalate privileges. This behavior falls under the MITRE ATT&CK techniques for Execution (T1059.001) and Lateral Movement (T1021.006).

  The primary telemetry sources include network connection logs, specifically looking for connections originating from non-standard user accounts. If successful, this detection indicates a potential compromise of the remote system, allowing attackers to execute commands or deploy further threats. However, this detection does NOT confirm that an attack is occurring; legitimate administrative activities over PowerShell can generate similar alerts.

  ### Investigation Steps

  - **Check source user account:** Review the user account associated with the alert. Non-standard accounts initiating PowerShell connections are suspicious; legitimate activity would typically be from known administrative users or service accounts with specific purposes (e.g., IT management).

  - **Identify network activity:** Examine network logs for Event ID 5156 (Windows Filtering Platform) focusing on Event Filter: 'INTEGRATED Rule' for connections on ports 5985 and 5986. Look for outbound requests to known external IP addresses that raise suspicion.

  - **Cross-reference remote session logs:** Access Windows Event ID 4624 (Logon) to identify the logon type and check if it corresponds to a RemoteInteractive (Logon Type 2) or Service (Logon Type 3) to further assess context around the session initiation.

  - **Validate process creation:** Investigate Sysmon Event ID 1 (Process Creation) for any PowerShell or wscript.exe executions on the originating IP. If present, correlate with the timestamp of the network connection event.

  - **Review endpoint configuration:** Ensure that systems involved are not actively being used for legitimate remote management tasks that require PowerShell remoting. Expected behavior may include actively logged IT personnel or scheduled tasks programmed for admin purposes.

  - **Identify high-confidence indicators:** Look for signs of attack, such as PowerShell command obfuscation or execution of commands that interact with known malware repositories or C2 servers. Any unusual PowerShell command execution at the time of the alert can indicate malicious activity.

  ### Prioritization

  This alert is high priority due to the potential impact on critical systems if an attacker gains unauthorized access through remote PowerShell. The likelihood of exploitation is elevated, as remote PowerShell sessions are common vectors for lateral movement and executable command execution in an enterprise environment.

  ### Blind Spots and Assumptions

  This detection may miss activities performed by legitimate service accounts that do not follow standard naming conventions. The absence of complete logging across systems could inhibit detection accuracy; ensure full event log capture is configured. Additionally, legitimate remote administration tasks may trigger the alert, particularly during maintenance windows. Companion detections that focus on unauthorized PowerShell command execution can enhance overall coverage.

