title: Potential Remote PowerShell Session Initiated
id: c539afac-c12a-46ed-b1bd-5a5567c9f045
status: test
description: |
  Detects a process that initiated a network connection over ports 5985 or 5986 from a non-network service account.
  This could potentially indicates a remote PowerShell connection.
references:
- https://threathunterplaybook.com/hunts/windows/190511-RemotePwshExecution/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g
date: 2019-09-12
modified: 2024-02-02
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.006
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort:
    - 5985
    - 5986
    Initiated: 'true'     # only matches of the initiating system can be evaluated
    SourceIsIpv6: 'false'
  filter_main_service_users:
  - User|contains:       # covers many language settings for Network Service. Please expand
    - 'NETWORK SERVICE'
    - 'NETZWERKDIENST'
    - 'SERVICIO DE RED'
    - 'SERVIZIO DI RETE'
  - User|contains|all:
    - 'SERVICE R'
    - 'SEAU'
  filter_main_localhost:
    SourceIp:
    - '::1'
    - '127.0.0.1'
    DestinationIp:
    - '::1'
    - '127.0.0.1'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\AvastSvc.exe'
    - 'C:\Program Files (x86)\Avast Software\Avast\AvastSvc.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate usage of remote PowerShell, e.g. remote administration and 
  monitoring.
- Network Service user name of a not-covered localization
level: high
note: |
  ### Technical Context

  This Sigma rule detects the initiation of a network connection over ports 5985 (WSMan) or 5986 (HTTPS WSMan) by processes that do not run under a standard service account, which could indicate unauthorized or suspicious remote PowerShell sessions. The likely attacker objective is to leverage remote PowerShell to execute commands on a remote system, often for lateral movement within the network. Relevant MITRE ATT&CK techniques include remote command execution (T1059.001) and lateral movement via remote services (T1021.006). The primary telemetry sources include Windows network connection logs, specifically focusing on the event types that capture outgoing connection attempts.

  If malicious, this behavior can lead to system compromise, data exfiltration, or further network penetration. It’s important to note that this detection does NOT confirm malicious intent; legitimate system maintenance activities may also trigger this alert.

  ### Investigation Steps

  - **Analyze process details: ** Review the process initiating the network connection using Event ID 4688 (Process Creation). Look for unusual executables (e.g., not commonly used applications) running as users outside of standard service accounts.

  - **Examine source user and connections: ** Check the username associated with the connection. If it is associated with 'NETWORK SERVICE' or other known service accounts without specific non-default localizations, this may indicate benign activity.

  - **Inspect network logs: ** Verify network connection logs for other suspicious activities during the same timeframe, such as Event ID 5156 (Windows Filtering Platform) for any other unauthorized outbound connections to atypical destinations.

  - **Evaluate expected legitimate usage: ** Document and confirm any known legitimate usages of remote PowerShell, like administrative scripts or scheduled tasks, that may utilize these ports. Ensure consistent operational patterns.

  - **Identify malicious indicators: ** Look for a correlation between the initiated connection and known malicious IP addresses or domain names tied to recent threats. Reference threat intelligence feeds if available.

  - **Check application configurations: ** Validate if there’s legitimate use of services like Windows Management Framework in the environment and identify any misconfigurations that might lead to unnecessary exposure for remote attacks.

  ### Prioritization

  Alerts triggered by this detection are of high severity given that they indicate potential exploitation of remote management features, which are frequently targeted by attackers for lateral movement. The nature of the detected activity, coupled with its ability to be weaponized easily, necessitates immediate attention from analysts.

  ### Blind Spots and Assumptions

  This detection may be limited if logs are not adequately configured to capture all necessary network events. Tools and configurations allowing for legitimate remote PowerShell use (like administrative automation) could generate false positives while not accounting for local security policies. An additional relevant detection would be monitoring for unusual PowerShell command-line arguments (T1059.001), enhancing visibility around usage patterns.

