note: |
  ### Technical Context

  This Sigma rule detects initiated network connections to known cryptocurrency mining pools, which are often utilized by malicious actors to leverage compromised systems for mining illicit cryptocurrency. The probable attacker objective involves gaining unauthorized access to resources, primarily for generating financial gain through cryptocurrency mining without the affected user's consent. This behavior is associated with the MITRE ATT&CK technique "Cryptomining" (T1496).

  The primary telemetry sources for this detection include network connection logs from Windows hosts that detail incoming and outgoing traffic. The significant risk is that if malicious, systems may suffer from resource exhaustion, increased operational costs, and potential data breaches. Importantly, this detection does not confirm that the system is compromised; it merely identifies a suspicious network connection attempt.

  ### Investigation Steps

  - **Identify the source of the connection:** Review Windows Security Event ID 5156 (Windows Filtering Platform) to pinpoint the originating process and user. Check the Process Name and User fields for any anomalous or unexpected entries.

  - **Verify connection destination:** Cross-reference the DestinationHostname from the log against the list of known malicious mining pool domains specified in the rule. Connections to these domains are strong indicators of potential compromise.

  - **Assess host resource usage:** Monitor the host in question for CPU and memory usage spikes. Although legitimate cloud instances may connect to mining pools, unusual resource utilization can indicate unauthorized mining activities.

  - **Examine scheduled tasks or startup items:** Look for suspected mining software in the Task Scheduler (Task Scheduler Event ID 4698) or startup locations (like HKLM\Software\Microsoft\Windows\CurrentVersion\Run). Legitimate activities may include scheduled updates or maintenance tasks.

  - **Check user behavior:** Investigate the account that initiated the connection for any unusual login patterns, such as logins at odd hours or from unusual locations. This may indicate credential exposure or lateral movement by an attacker.

  ### Prioritization

  The severity of this alert is high due to the potential impact on system performance, security, and resource costs if malicious mining activity is confirmed. The likelihood of this behavior being abused by adversaries who frequently employ crypto-mining tactics further underscores its threat level.

  ### Blind Spots and Assumptions

  Detection limitations include encrypted connections or domain fronting that could obscure the actual destination, making it difficult to pinpoint malicious activity. Ensuring comprehensive logging of all relevant network connections is critical to consistent detection. Legitimate activities may include corporate approved mining with proper security measures; hence careful context examination is essential. A companion detection to strengthen coverage would be monitoring for known malicious process creation events linked to crypto-mining software, utilizing Windows Event ID 4688 for process creation.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
