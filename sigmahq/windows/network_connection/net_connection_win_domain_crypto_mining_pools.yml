note: |
  ### Technical Context
  This detection rule identifies network connections initiated towards known crypto mining pools, which are commonly utilized in unauthorized cryptocurrency mining activities. Attackers may exploit corporate resources to mine cryptocurrencies like Monero, potentially leading to resource exhaustion, increased electricity costs, and degradation of system performance. The objectives of such attackers are primarily financial gain by leveraging the victim's infrastructure without their consent.

  In terms of MITRE ATT&CK framework, this activity correlates with the *Impact* tactic (T1496), specifically targeting unauthorized resource usage for cryptocurrency mining. By establishing connections to suspicious mining pool domains, the rule aims to pinpoint potential abuse of network resources, which might indicate compromise or malicious insider activity.

  Data from network connections is integral to this detection, as logs sourced from network traffic analysis (NDR) will log the attributes of outbound communications. Specifically, telemetry from firewalls, proxies, or other network monitoring solutions should yield the most pertinent evidence.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine logs for outbound connections to the specified crypto mining pool domains listed in the detection rule. Look for unusual destination hostnames that don't match typical business traffic patterns.

  - **Correlate with Device Processes**: Use EDR solutions to check if any processes on endpoints correspond to crypto mining applications or libraries. Investigate any anomalies in CPU usage or suspicious process creation tied to connections identified in the previous step.

  - **Conduct Threat Intelligence Lookups**: Research hashes, IP addresses, or domain names related to the detected outbound connections using threat intelligence resources. Utilize sites like VirusTotal to gain insights into known malicious activities associated with these entities.

  - **Monitor for User Account Activity**: Check for any user account anomalies, such as unexpected logins or spikes in administrative actions, that might align with unauthorized crypto mining activities or potential insider threats.

  ### Prioritization
  Given the high potential impact of unauthorized resource utilization and its likelihood in scenarios of compromise or insider threats, this alert is assigned a high severity level. The costs associated with such activities can escalate quickly, affecting system performance and incurring financial repercussions.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if the mining activities occur over encrypted channels or utilize non-standard ports that bypass usual monitoring. The detection logic assumes that the organization has proper logging and visibility of outbound network communications. Logs from firewalls, proxy servers, and network monitoring systems must be properly configured to ensure effective detection of this activity and are critical for the alert to function correctly.

