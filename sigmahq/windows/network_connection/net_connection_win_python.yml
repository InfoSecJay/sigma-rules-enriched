title: Python Initiated Connection
id: bef0bc5a-b9ae-425d-85c6-7b2d705980c6
status: test
description: Detects a Python process initiating a network connection. While 
  this often relates to package installation, it can also indicate a potential 
  malicious script communicating with a C&C server.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md#atomic-test-4---port-scan-using-python
- https://pypi.org/project/scapy/
author: frack113
date: 2021-12-10
modified: 2025-03-05
tags:
- attack.discovery
- attack.t1046
logsource:
  category: network_connection
  product: windows
  definition: 'Requirements: Field enrichment is required for the filters to work.
    As field such as CommandLine and ParentImage are not available by default on this
    event type'
detection:
  selection:
    Initiated: 'true'
    Image|contains|all:
    - '\python'
    - '.exe'
  filter_optional_conda:
        # Related to anaconda updates. Command example: "conda update conda"
        # This filter will only work with aurora agent enriched data as Sysmon EID 3 doesn't contain CommandLine nor ParentImage
    ParentImage: C:\ProgramData\Anaconda3\Scripts\conda.exe
    CommandLine|contains|all:
    - ':\ProgramData\Anaconda3\Scripts\conda-script.py'
    - 'update'
  filter_optional_conda_jupyter_notebook:
        # Related to anaconda opening an instance of Jupyter Notebook
        # This filter will only work with aurora agent enriched data as Sysmon EID 3 doesn't contain CommandLine nor ParentImage
    ParentImage: C:\ProgramData\Anaconda3\python.exe
    CommandLine|contains: 'C:\ProgramData\Anaconda3\Scripts\jupyter-notebook-script.py'
  filter_main_local_communication:
        # This could be caused when launching an instance of Jupyter Notebook locally for example but can also be caused by other instances of python opening sockets locally etc. So comment this out if you want to monitor for those instances
    DestinationIp: 127.0.0.1
    SourceIp: 127.0.0.1
  filter_main_pip:
    CommandLine|contains|all:
    - 'pip.exe'
    - 'install'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate python scripts using the socket library or similar will trigger 
  this. Apply additional filters and perform an initial baseline before 
  deploying.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where a Python process initiates a network connection. The behavior might indicate legitimate usage such as package installations (e.g., using pip) or opening a local instance of Jupyter Notebook. However, it also raises the potential for malicious activity, particularly if an attacker is using a Python script to exfiltrate data or communicate with a command and control (C&C) server. This activity aligns with the MITRE ATT&CK tactic of Discovery (TA0011) and the technique of Application Layer Protocol (T1046). Primary telemetry sources include Windows network connection logs, specifically Event ID 5156 or equivalent enriched logs. If this behavior is malicious, it can lead to data exfiltration or further compromise of the system. Importantly, this detection does not confirm malicious intent on its own; it merely indicates that Python initiated a network connection.

  ### Investigation Steps

  - **Check Windows event logs:** Review Security Event ID 5156 for allowed connections involving Python processes. Investigate the destination IP and port to determine if they are associated with known malicious commands or C&C servers.

  - **Confirm command line arguments:** Examine the command line of the initiating Python process by correlating Sysmon Event ID 1, looking for suspicious usage patterns (e.g., absence of legitimate pip or conda commands).

  - **Identify expected behaviors:** Recognize that legitimate activities may involve connections to localhost (127.0.0.1) for Jupyter Notebooks or package management. Note command line patterns related to 'pip install' or 'conda update' to clarify benign versus malicious indications.

  - **Assess source image integrity:** Validate the `ParentImage` field of the process. Legitimate calls to system Python installations (e.g., `C:\Anaconda3\python.exe`) should be expected; deviations may signal malicious tampering or rogue installations.

  - **Evaluate network communication destinations:** Highlight unusual external IP connections. Malicious indicators include patterns where the source is a Python process initiating connections to unrecognized or suspicious external IP addresses.

  ### Prioritization

  This alert has medium severity given its potential impact; an affected system might be serving critical applications or sensitive data. The likelihood of abuse is moderate as attackers commonly use scripting languages for automation in exploitation. Python, due to its versatility, is a widely weaponized tool in the attack landscape.

  ### Blind Spots and Assumptions

  This detection may miss Python scripts that are obfuscated or not invoking standard connection methods, allowing for potential evasion. Reliable detection also requires enhanced logging configurations to capture command line arguments and parent processes. Legitimate behavior, such as scripted local data processing, could trigger this alert. A companion detection rule for unusual outbound traffic or command execution (e.g., monitoring Event ID 4688 for suspicious command lines) can provide additional coverage and context.

