note: |
  ### Technical Context

  This rule detects network connections from a local process to domains ending with ".btunnel.co.in". The behavior suggests an attacker may be attempting to establish a reverse shell or maintain persistence on the compromised system through a Command and Control (C2) channel. The relevant MITRE ATT&CK tactics and techniques include Exfiltration (T1567) and Command and Control (T1572). The primary telemetry sources involved are network connection logs, specifically Windows event logs capturing outbound connection attempts.

  If confirmed malicious, this activity could result in unauthorized access to sensitive data, potential lateral movement within the network, or further exploitation of connected systems. It is important to note that this detection alone does not confirm malicious intent, as legitimate use of BTunnels services may also trigger this alert.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows event logs (Event ID 5156) for any outgoing connections to ".btunnel.co.in" domains, noting the source process name and user context involved.

  - **Inspect the initiating process:** Identify the process executing the network connection using Sysmon Event ID 3. Look for known legitimate processes (e.g., system services) vs. suspicious ones (e.g., uncommon executables or scripts).

  - **Analyze DNS queries:** Query logs for any DNS resolution requests for ".btunnel.co.in". Events may show common patterns or prior resolutions that could indicate benign or malicious use.

  - **Validate the host role:** Determine the asset’s role in your environment (e.g., server, workstation). Non-critical systems initiating connections to these domains could warrant further investigation, while critical assets trigger higher urgency.

  - **Correlate with firewall logs:** Review firewall logs for allowed outbound traffic towards BTunnels domains. Focus on unusual or unexplained connection paths, especially from non-administrative users.

  - **Identify previous behavior:** Check for any recent user activity or system changes leading up to the connection. Legitimate processes may include known applications used for authorized remote administration, whereas unexpected software installations or updates could indicate prior compromise.

  ### Prioritization

  The alert carries medium severity due to the potential use of BTunnel services for malicious activities. Systems making these connections may be under active compromise and could facilitate data exfiltration or further attacks. The likelihood of abuse is elevated, as this behavior is commonly associated with various exploitation techniques.

  ### Blind Spots and Assumptions

  Detection efficacy is limited by the inherent use of BTunnel services for both legitimate and malicious traffic, potentially resulting in false positives. Required log sources include comprehensive network connection logs, DNS query logs, and firewall configurations to capture pertinent communications. Legitimate activities, such as authorized remote support or tool use, may inadvertently trigger this alert, making context around the user and process critical. Companion detections around unusual process creation or privilege escalation could enhance overall coverage for identifying malicious activity.

