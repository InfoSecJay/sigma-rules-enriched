note: |
  ### Technical Context
  This Sigma rule detects network connections initiated by processes on a system to domains affiliated with Cloudflared tunnels, specifically tailored for tunneling traffic through Cloudflare's infrastructure. Attackers leverage Cloudflared to create reverse shells or maintain persistence within compromised systems, allowing them to evade traditional network security measures. Given that these tunnels can obscure traffic and bypass firewalls, detection is critical for identifying potentially malicious activities.

  The relevant MITRE ATT&CK tactics include **Command and Control** (TA0011), where attackers establish a channel for remote control, and **Exfiltration** (TA0010), as they may use these tunnels to extract sensitive data. Techniques associated with this behavior are **T1567: Exfiltration Over Web Service** and **T1572: Application Layer Protocol**. Primary data sources include network connection logs, which can capture outbound requests and indicate suspicious activity towards these specific tunnel domains.

  ### Investigation Steps
  - **Review Outbound Network Traffic:** Analyze logs for any outbound connections initiated towards the identified Cloudflared domains. Look for anomalies, such as unexpected sources or the timing of these connections.
  - **Correlate Process Information:** Identify the processes associated with these connections. Check whether known applications or unexpected executables are responsible for initiating network communication with the suspect domains.
  - **Examine System Logs:** Look into Windows Event logs to find any events related to process creation that coincide with the timing of the network connections. This may reveal whether the connections are initiated by legitimate applications or potentially malicious activities.
  - **Assess the Environment:** Evaluate the overall use of Cloudflare tunnels within your organization. Identify legitimate use cases and determine if there are any exceptions or unusual patterns that require further investigation.

  ### Prioritization
  This alert carries medium severity due to the potential impact of an attacker establishing a foothold on the system via reverse shells. Given the rise in misuse of tunneling services like Cloudflared, the likelihood of encountering such threats is significant, warranting prompt investigation.

  ### Blind Spots and Assumptions
  There is a possibility of false positives, as legitimate activities utilizing Cloudflared tunnels will also trigger this alert. The detection logic assumes that all outbound connections to the specified domains could indicate malicious activity, which may not always be the case. Additionally, for effective detection, it is crucial that network connection logs are enabled and properly configured within the environment to capture this traffic and provide sufficient detail for investigation.

