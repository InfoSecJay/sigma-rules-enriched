title: Network Connection Initiated Via Notepad.EXE
id: e81528db-fc02-45e8-8e98-4e84aba1f10b
status: test
description: |
  Detects a network connection that is initiated by the "notepad.exe" process.
  This might be a sign of process injection from a beacon process or something similar.
  Notepad rarely initiates a network communication except when printing documents for example.
references:
- https://web.archive.org/web/20200219102749/https://www.sans.org/cyber-security-summit/archives/file/summit-archive-1492186586.pdf
- https://www.cobaltstrike.com/blog/why-is-notepad-exe-connecting-to-the-internet
author: EagleEye Team
date: 2020-05-14
modified: 2024-02-02
tags:
- attack.privilege-escalation
- attack.command-and-control
- attack.execution
- attack.stealth
- attack.t1055
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith: '\notepad.exe'
  filter_optional_printing:
    DestinationPort: 9100
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Printing documents via notepad might cause communication with the printer via 
  port 9100 or similar.
level: high
note: |
  ### Technical Context

  This rule detects attempts to initiate network connections via the `notepad.exe` process, a behavior that is atypical for this application, which primarily serves text editing tasks. The likely objective of an attacker would be to use `notepad.exe` as a means of command and control (C2) communication or to mask more malicious activities under an innocent-looking process. This behavior aligns with MITRE ATT&CK technique T1055: Process Injection, indicating an attempt to leverage a trusted process for malicious operations.

  The primary telemetry sources for this detection would be Windows network connection logs, specifically focusing on outbound connections initiated by `notepad.exe`. If malicious, this behavior could signal that an adversary is executing scripts or payloads that communicate with an external server. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use cases—such as printing documents—may also cause `notepad.exe` to connect to a printer on network ports like 9100.

  ### Investigation Steps

  - **Verify involved process: ** Check the process tree for `notepad.exe`: Utilize Sysmon Event ID  Processes (ID 1) to confirm the parent process and see if it indicates possible process injection or unusual spawning.

  - **Identify network connection details: ** Review Windows Firewall logs (Event ID 5156) or network connection logs for the source IP and destination port. Typically, legitimate outbound connections from `notepad.exe` would target local printers on port 9100.

  - **Check for unusual remote IP addresses: ** Investigate the destination IP addresses connected to by `notepad.exe`. Any connections to external addresses, especially on non-standard ports, are higher-risk indicators of compromise.

  - **Compare against normal usage: ** Determine if `notepad.exe` is frequently used on the affected system (check user activity logs). Normally, it should not routinely establish outbound network connections; consistent connection attempts may indicate a compromise.

  - **Analyze for persistence methods: ** Look for related artifacts or scheduled tasks (Event ID 4698) that may indicate persistence mechanisms utilizing `notepad.exe`, providing insights into the attacker’s strategy.

  ### Prioritization

  This alert is of high severity due to the potential for `notepad.exe`, a benign application, to be misused for network communication, often indicative of a more serious compromise. Systems where critical applications or sensitive data resides should be prioritized, as this behavior may serve as an access point for further exploitation or data exfiltration.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as renaming malicious executables to `notepad.exe`, which can bypass static analysis. Additionally, successful detection relies on adequate logging configurations for Windows network connection events; without comprehensive logging in place, critical events may be missed. Legitimate activities, like networked printing, could inadvertently trigger this alert. A companion detection rule for monitoring unusual process creation (e.g., process spawning from non-standard parent processes) could enhance coverage and context regarding threats leveraging `notepad.exe`.

