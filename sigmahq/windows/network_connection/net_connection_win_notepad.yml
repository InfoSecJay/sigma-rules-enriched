title: Network Connection Initiated Via Notepad.EXE
id: e81528db-fc02-45e8-8e98-4e84aba1f10b
status: test
description: |
  Detects a network connection that is initiated by the "notepad.exe" process.
  This might be a sign of process injection from a beacon process or something similar.
  Notepad rarely initiates a network communication except when printing documents for example.
references:
- https://web.archive.org/web/20200219102749/https://www.sans.org/cyber-security-summit/archives/file/summit-archive-1492186586.pdf
- https://www.cobaltstrike.com/blog/why-is-notepad-exe-connecting-to-the-internet
author: EagleEye Team
date: 2020-05-14
modified: 2024-02-02
tags:
- attack.privilege-escalation
- attack.command-and-control
- attack.execution
- attack.defense-evasion
- attack.t1055
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith: '\notepad.exe'
  filter_optional_printing:
    DestinationPort: 9100
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Printing documents via notepad might cause communication with the printer via 
  port 9100 or similar.
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where the Notepad application (`notepad.exe`) initiates a network connection, which is an unusual behavior for this application. The likely objective of the attacker would be to use Notepad as a means to obfuscate malicious communications, potentially as part of a command-and-control (C2) operation. This activity relates to the MITRE ATT&CK techniques for process injection (T1055) and command-and-control (T1071).

  The primary telemetry source for this detection comprises Windows network connection logs, particularly focusing on details about the processes initiating outbound connections. If malicious, this activity could signify that an adversary is using a benign-looking process to communicate with external systems, circumventing common security checks. Notably, this detection does not confirm that the activity is malicious on its own; legitimate instances of Notepad communicating with a printer on port 9100 also exist.

  ### Investigation Steps

  - **Identify the process details**: Review Windows Security Event ID 4688 to analyze the creation of `notepad.exe`, alongside Sysmon Event ID 1, to gather additional context about the parent process and command line arguments.

  - **Check communication port**: Verify if the communication is over the expected port (9100) for legitimate printing activities. If not, further analysis is warranted.

  - **Assess network connection logs**: Investigate the network connection logs (Windows Event ID 5156) to confirm the destination IP and port being contacted, comparing these against a known list of legitimate systems and services.

  - **Analyze for prior executions**: Look for previous instances of `notepad.exe` via Sysmon Event ID 1. Determine if this is a recurring behavior or an anomaly, especially checking for unusual command line arguments that could suggest malicious use.

  - **Review legitimate use cases**: Confirm whether recent activities involving Notepad included printing tasks. The existence of network traffic involving port 9100 near print job events could indicate benign activity.

  - **Identify high-confidence malicious indicators**: Look for unusual DNS requests or external IP addresses that differ significantly from standard enterprise traffic when `notepad.exe` initiates a connection, signaling potential C2 communications.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact of outbound connections from a widely trusted application like Notepad. The likelihood of this behavior being exploited is credible, as attackers often leverage legitimate applications to bypass detection mechanisms. Such tactics are commonly weaponized in real-world attacks, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of benign network connections initiated by `notepad.exe`, particularly during printing tasks. Log sources such as Windows Firewall logs and Sysmon must be correctly configured and enabled to capture relevant data comprehensively. Legitimate software installations or local print servers could also generate similar alerts. Related detections, such as abnormal outbound connections from a command-line interface (e.g., `cmd.exe`) or PowerShell scripts, can strengthen overall visibility and context for detection efforts.

