title: Network Connection Initiated Via Notepad.EXE
id: e81528db-fc02-45e8-8e98-4e84aba1f10b
status: test
description: |
  Detects a network connection that is initiated by the "notepad.exe" process.
  This might be a sign of process injection from a beacon process or something similar.
  Notepad rarely initiates a network communication except when printing documents for example.
references:
- https://web.archive.org/web/20200219102749/https://www.sans.org/cyber-security-summit/archives/file/summit-archive-1492186586.pdf
- https://www.cobaltstrike.com/blog/why-is-notepad-exe-connecting-to-the-internet
author: EagleEye Team
date: 2020-05-14
modified: 2024-02-02
tags:
- attack.privilege-escalation
- attack.command-and-control
- attack.execution
- attack.defense-evasion
- attack.t1055
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith: '\notepad.exe'
  filter_optional_printing:
    DestinationPort: 9100
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Printing documents via notepad might cause communication with the printer via port
  9100 or similar.
level: high
note: |
  ### Technical Context
  This rule detects instances in which the process `notepad.exe` initiates a network connection, which is atypical behavior for this application. Normally, `notepad.exe` is utilized for editing text files and does not engage in network communications except under specific scenarios, such as printing to networked printers. The involvement of `notepad.exe` in a network connection could indicate malicious behavior, such as process injection or the execution of a remote command and control (C2) operation. Attackers may leverage benign-looking processes to hide their activities and evade detection, which makes this behavior suspicious.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Execution (TA0002):** The use of existing processes to run malicious payloads.
  - **Command and Control (TA0011):** The establishment of outbound connections to communicate with a remote server.
  - **Defense Evasion (TA0005):** Exploiting legitimate processes to avoid detection by security mechanisms.
  - **Privilege Escalation (TA0004):** Potential exploitation of vulnerabilities or weaknesses in the Windows environment through trusted applications.

  Data sources that are particularly useful for this detection include network connection logs generated by Windows systems, which record outgoing communications and their originating processes. Process creation logs may also provide context to confirm that `notepad.exe` is the source of the network activity.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine the logs to identify all network connections initiated by `notepad.exe`, noting the destination IP addresses and ports used to understand the nature of the communication.
  - **Analyze Process Creation Events:** Investigate the timeline of process creation logs to confirm that `notepad.exe` was launched under suspicious conditions (e.g., unusual parent processes or execution paths).
  - **Cross-Reference with Other Logs:** Check Windows Event Logs and EDR telemetry for any related alerts or anomalies around the time of the detected network connection.
  - **Interview Users or Incident Report:** If applicable, consult with users or review incident reports to identify any legitimate uses of `notepad.exe` (such as printing) to rule out false positives before pursuing further investigative actions.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to use legitimate applications like `notepad.exe` for malicious purposes, such as establishing C2 channels. This behavior significantly raises the risk of compromise, as it can facilitate unauthorized access or data exfiltration within an enterprise environment.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage may arise if attackers utilize a similar legitimate process or employ techniques to obfuscate their activities. Further, this detection presumes that all instances of `notepad.exe` should behave in a contextually normal manner regarding network connections. Organizations must ensure that proper logging configurations are enabled on Windows systems to capture network connections and process creation events effectively. If either data source is unavailable or misconfigured, the detection may not function as intended.

