title: Suspicious Wordpad Outbound Connections
id: 786cdae8-fefb-4eb2-9227-04e34060db01
status: test
description: |
  Detects a network connection initiated by "wordpad.exe" over uncommon destination ports.
  This might indicate potential process injection activity from a beacon or similar mechanisms.
references:
- https://blogs.blackberry.com/en/2023/07/romcom-targets-ukraine-nato-membership-talks-at-nato-summit
author: X__Junior (Nextron Systems)
date: 2023-07-12
modified: 2023-12-15
tags:
- attack.defense-evasion
- attack.command-and-control
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith: '\wordpad.exe'
  filter_main_ports:
    DestinationPort:
    - 80
    - 139
    - 443
    - 445
    - 465
    - 587
    - 993
    - 995
  condition: selection and not 1 of filter_main_*
falsepositives:
- Other ports can be used, apply additional filters accordingly
level: medium
note: |
  ### Technical Context
  This rule detects outbound network connections initiated by the `wordpad.exe` process that occur on uncommon destination ports. Such behavior raises suspicion as it may indicate that the process is being misused to establish command-and-control (C2) communication, potentially as part of an evasion tactic by an attacker. The use of legitimate software like WordPad for executing malicious actions exemplifies how attackers may employ stealthy techniques to blend in with normal operations while exfiltrating data or maintaining persistence.

  The potential scenario involves an attacker who has compromised a host and injected a malicious payload into the legitimate WordPad process. By doing so, they can avoid detection from traditional security measures. The objective could be data exfiltration or remote control over the compromised system. This detection logic aligns with several MITRE ATT&CK techniques, notably **Command and Control (T1071)**, as well as **Defense Evasion (T1203)**, reflecting a use-case focused on evading detection while establishing C2 channels.

  Relevant data sources for detecting such activities include network connection logs or telemetry derived from a Network Detection and Response (NDR) solution. These will capture outbound traffic and allow for analysis of the processes generating the connections.

  ### Investigation Steps
  - **Review Network Logs:** Analyze recent outbound connection logs related to `wordpad.exe`. Focus on destination ports outside the commonly used ranges for legitimate traffic, particularly those indicated by the alert.
  - **Examine Process Activity:** Investigate the process tree and execution context of `wordpad.exe` around the time of the suspicious connection to identify any unusual parent or child processes that may indicate injection or misuse.
  - **Check for Anomalous Behavior:** Look for other indicators of compromise on the device, such as unusual command-line arguments or the presence of newly created processes that are not typical for a WordPad workflow.
  - **Correlate with Threat Intelligence:** Reference external threat intelligence to determine if the detected behavior aligns with known tactics used by malicious actors, specifically those targeting Command and Control activities.

  ### Prioritization
  The alert is rated as medium severity due to the potential for high impact on enterprise security if an attacker successfully establishes a persistent connection for data exfiltration or remote control, combined with the moderate likelihood of occurrence in environments where WordPad is commonly used.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the outbound connections utilize common ports that are frequently used for legitimate applications, and the inherent use of `wordpad.exe` as a trusted process may lead to false negatives. The assumption is that most outbound connections through uncommon ports are suspicious; however, legitimate applications may also need access to these ports under certain circumstances. It is crucial that detailed network logs are enabled and monitored, as well as ensuring that the SIEM is properly configured to capture and analyze these events effectively.

