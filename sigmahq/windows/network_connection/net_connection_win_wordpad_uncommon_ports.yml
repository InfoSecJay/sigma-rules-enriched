logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith: '\wordpad.exe'
  filter_main_ports:
    DestinationPort:
    - 80
    - 139
    - 443
    - 445
    - 465
    - 587
    - 993
    - 995
  condition: selection and not 1 of filter_main_*
falsepositives:
- Other ports can be used, apply additional filters accordingly
level: medium
note: |
  ### Technical Context

  This rule detects outbound network connections initiated by the `wordpad.exe` process over uncommon destination ports, which are typically not associated with standard web traffic or common application behavior. Such behavior may indicate an adversary's objective of command-and-control (C2) communication or process injection tactics, potentially signaling an active compromise. The relevant MITRE ATT&CK tactic is "Command and Control" (T1071) with techniques including "Application Layer Protocol" (T1071.001).

  The primary telemetry source is network connection logs that capture process-level information and the associated destination ports. If malicious, the impact could involve data exfiltration or further compromise of the system, revealing a serious threat to the enterprise's security posture. It is crucial to note that this detection alone does not confirm malicious behavior; the alert could also be triggered by benign application usage or misconfigured software.

  ### Investigation Steps

  - **Verify active connections:** Examine network connection logs for `wordpad.exe` using Windows Firewall or Sysmon logs (Event ID 3 for network connections) to identify the destination ports being used.

  - **Correlate with endpoint activity:** Check process creation logs (Security Event ID 4688) for patterns surrounding `wordpad.exe` execution, ensuring it aligns with typical user behavior or scheduled tasks.

  - **Identify non-standard ports:** Analyze connections on uncommon ports (e.g., those not listed in the main ports filter such as 25, 21, or others) as high-confidence indicators of malicious activity within the network logs.

  - **Review legitimate usage:** Consider the context of the user environment and confirm if `wordpad.exe` is used in routine tasks (e.g., document editing) and if these tasks normally involve network activities.

  - **Monitor for lateral movement:** Investigate any signs of unusual access patterns or connections to high-value assets following the outbound connection, as this may suggest escalation of privileges or lateral movement.

  ### Prioritization

  This alert should be prioritized as medium severity. The affected system's role influences its risk; if `wordpad.exe` is running on a critical server or influential workstation, the likelihood of malicious abuse increases. This behavior is not commonly weaponized but is indicative of possible encapsulated malicious actions.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited by the reliability of network logs and potential evasion techniques like port hopping or tunneling through encrypted channels. Additionally, legitimate applications could trigger this alert when using non-standard ports for updating or cloud interactions. A related detection to consider is monitoring unusual DLL injections or process spawning by `wordpad.exe`, which would further strengthen the understanding of potential threat activities.

