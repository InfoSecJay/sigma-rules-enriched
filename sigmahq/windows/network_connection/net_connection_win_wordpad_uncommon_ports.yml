title: Suspicious Wordpad Outbound Connections
id: 786cdae8-fefb-4eb2-9227-04e34060db01
status: test
description: |
  Detects a network connection initiated by "wordpad.exe" over uncommon destination ports.
  This might indicate potential process injection activity from a beacon or similar mechanisms.
references:
- https://blogs.blackberry.com/en/2023/07/romcom-targets-ukraine-nato-membership-talks-at-nato-summit
author: X__Junior (Nextron Systems)
date: 2023-07-12
modified: 2023-12-15
tags:
- attack.command-and-control
- attack.stealth
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith: '\wordpad.exe'
  filter_main_ports:
    DestinationPort:
    - 80
    - 139
    - 443
    - 445
    - 465
    - 587
    - 993
    - 995
  condition: selection and not 1 of filter_main_*
falsepositives:
- Other ports can be used, apply additional filters accordingly
level: medium
note: |
  ### Technical Context

  This Sigma rule detects outbound network connections initiated by `wordpad.exe` over uncommon destination ports. This behavior is unusual for a text editing application and may indicate that the process is being used as a mechanism for command and control (C2) or data exfiltration, potentially due to process injection or other malicious activities. The likely attacker objective is to establish a covert and persistent connection to a remote server, potentially to exfiltrate data or receive further instructions.

  The relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Application Layer Protocol" (T1071). Primary telemetry sources include Windows network connection logs that detail outgoing connections, with a specific focus on `wordpad.exe`. If malicious, this activity can lead to unauthorized data access or system compromise. Importantly, this detection does NOT confirm that `wordpad.exe` is malicious by itself; further investigation is required to establish intent.

  ### Investigation Steps

  - **Review outbound connection logs:** Examine network connection records (e.g., Windows Event ID 5156 for filtered connection events) for connections initiated by `wordpad.exe`. Note the destination IP and port to establish if the connection is to a known or suspicious domain.

  - **Identify uncommon destination ports:** Validate that the connection is made to non-standard ports (e.g., ports not typically utilized by `wordpad.exe`). Common legitimate ports are 80, 443, and 587; connections to ports like 139 or 445 should be scrutinized for suspicion.

  - **Check for process anomalies:** Use Sysmon Event ID 1 to identify the creation of `wordpad.exe` and validate its parent process. Legitimate execution usually follows user interactions, whereas unexpected spawn chains might indicate abuse.

  - **Cross-reference with threat intelligence:** Run the destination IP against threat intelligence sources for known malicious behavior or indicators of compromise (IOCs) that may suggest active exploitation.

  - **Examine network traffic for beacons:** Look for patterns of regular outbound connections, particularly repeated requests to the same IP address over time, which may indicate beaconing behavior typically associated with C2 communications.

  - **Assess endpoint security logs:** Review EDR or Antivirus logs for any related detections or alerts involving `wordpad.exe` to assess overall system integrity and confirm whether the application behaves as expected.

  ### Prioritization

  The alert has medium severity due to the potential impact on sensitive systems if compromised and the likelihood of malicious abuse by adversaries leveraging application-level communication methods. Connection initiated by a commonly trusted application like `wordpad.exe` is an atypical behavior and could indicate a serious security incident if confirmed malicious.

  ### Blind Spots and Assumptions

  The detection may miss attempts to obfuscate the traffic, such as connections to legitimate services often used as proxies. It's essential to ensure that proper logging configurations for outbound traffic are in place to capture necessary details. Additionally, benign activities such as software installations or updates might lead to similar alerts. A companion detection to consider would be monitoring for unusual command-line arguments used with `wordpad.exe`, which can provide context to its behavior.

