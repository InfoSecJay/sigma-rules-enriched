note: |
  ### Technical Context

  This Sigma rule detects outbound network connections initiated by executables to the portmap.io domain, which is often associated with Command and Control (C2) communication or data exfiltration by malicious actors. The probable attacker objective is to establish a persistent communication channel for receiving commands or transferring sensitive information. This behavior aligns with MITRE ATT&CK techniques T1041 (Exfiltration Over Command and Control Channel) and T1090.002 (External Remote Services).

  Primary telemetry sources include network logs indicating connection attempts, specifically focusing on outbound connection events to the specified domain. If malicious, these connections could allow attackers to maintain control over compromised systems or steal data. However, this detection does NOT confirm that the communication is malicious on its own; legitimate use of portmap.io by approved applications could also trigger this alert.

  ### Investigation Steps

  - **Verify outbound connections to portmap.io:** Review network logs for Event ID 5156 (Windows Filtering Platform) to confirm the process initiating the connection and the exact destination hostname. Look for processes with atypical behavior, indicating potential malice.

  - **Identify the initiating process:** Use Sysmon Event ID 3 to find the executable that initiated the connection. Investigate the parent process and any associated command-line arguments to determine if it aligns with known legitimate use cases.

  - **Check for historical activity:** Analyze a timeline of previous network connections from the same host. A pattern of repeated connections to portmap.io without a legitimate business need may indicate a higher likelihood of malicious intent.

  - **Determine legitimate application behavior:** Review documentation or asset inventory to confirm if any sanctioned applications intentionally access portmap.io. Note legitimate use cases and expected process behaviors.

  - **Monitor for abnormal DNS queries:** Inspect DNS logs for queries resolving ports related to portmap.io. High volumes of DNS requests to this domain without corresponding legitimate context may suggest malicious activity.

  - **Validate data exfiltration artifacts:** If files were recently created, look for output files or unusual outbound transfer protocols (e.g., FTP, HTTP POST) connected to the detected process. Pay attention to signs of unauthorized data transfer out of the environment.

  ### Prioritization

  The alert is classified as medium severity due to the potential impact on sensitive data and operational integrity. The likelihood of malicious abuse is moderate given that the portmap.io domain has known ties to blacklisted activities. This behavior, while not the most common method of attack, can serve as a vector for more covert operations.

  ### Blind Spots and Assumptions

  This detection may be bypassed through tunneling techniques or encrypted traffic, limiting effectiveness against sophisticated adversaries. Reliable detection requires ongoing monitoring and logging of DNS queries and outbound connections. Legitimate services, such as cloud-based applications or VPNs, might also trigger this alert, necessitating context awareness. A related detection that can strengthen coverage is tracking abnormal outbound connection patterns or anomalies in network traffic behavior, which could offer additional insights into compromised hosts.

