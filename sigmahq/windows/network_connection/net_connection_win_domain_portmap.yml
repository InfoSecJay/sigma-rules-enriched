note: |
  ### Technical Context
  This rule detects network communication attempts to the domain `portmap.io`, which is often associated with command-and-control (C2) infrastructures utilized by malicious actors. The presence of an executable accessing this domain could indicate unauthorized data exfiltration attempts or interactions with a compromised system controlled by an attacker. The detection logic indicates that the source may be potentially malicious, leading to a compromised environment.

  The primary tactic relevant to this detection is **Command-and-Control (T1071)**, which covers the use of application layer protocols for establishing C2 communication. Additionally, this could relate to **Exfiltration Over Command and Control Channel (T1041)** as it might signify an attempt to exfiltrate data. The detection focuses closely on network connection logs that reveal attempts to communicate with this domain.

  The primary data sources that contain valuable evidence for this detection include **network connection logs** from network devices or endpoints, which can provide insights into outgoing connection attempts, including destination hosts and ports.

  ### Investigation Steps
  - **Collect Network Logs:** Gather network connection logs specifically to identify any outbound traffic directed to `portmap.io`. Focus on the destination hostname and any associated timestamps.
  - **Examine Executable Context:** Analyze the context and behavior of the executable initiating the connection. Review the process creation events to identify the parent process, executable path, and associated user accounts.
  - **Assess Traffic Patterns:** Investigate the traffic patterns around the time of the detected connection to `portmap.io`. Look for unusual spikes in data flow or other unusual domains being contacted by the same host.
  - **Review Endpoint Security Logs:** Consult endpoint detection and response (EDR) logs for alerts or indicators of compromise that correspond with the timeline of the outbound connection to identify potential malware or manipulation.

  ### Prioritization
  This alert is classified as medium severity due to the potential ramifications of C2 communications and data exfiltration activities. Given the increasing sophistication of threats and the notable use of `portmap.io` in illicit operations, such connections warrant immediate investigation.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage if legitimate business operations utilize `portmap.io` for non-malicious purposes, leading to false positives. The detection logic assumes the executable accessing the domain is malicious; however, the context must be thoroughly evaluated to confirm intent. Comprehensive logging of network activity is crucial for effective detection, and configurations should ensure that all outbound connections are captured for accurate analysis.

