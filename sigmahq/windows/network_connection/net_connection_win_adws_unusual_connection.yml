title: Uncommon Connection to Active Directory Web Services
id: b3ad3c0f-c949-47a1-a30e-b0491ccae876
status: test
description: |
  Detects uncommon network connections to the Active Directory Web Services (ADWS) from processes not typically associated with ADWS management.
references:
- https://medium.com/falconforce/soaphound-tool-to-collect-active-directory-data-via-adws-165aca78288c
- https://github.com/FalconForceTeam/FalconFriday/blob/a9219dfcfd89836f34660223f47d766982bdce46/Discovery/ADWS_Connection_from_Unexpected_Binary-Win.md
author: '@kostastsale'
date: 2024-01-26
tags:
- attack.discovery
- attack.t1087
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: true
    DestinationPort: 9389
  filter_main_dsac:
    Image: 'C:\Windows\system32\dsac.exe'
  filter_main_ms_monitoring_agent:
    Image: 'C:\Program Files\Microsoft Monitoring Agent\'
  filter_main_powershell:
    Image|startswith:
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Program Files\PowerShell\7-preview\pwsh.ex'
    - 'C:\Windows\System32\WindowsPowerShell\'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- ADWS is used by a number of legitimate applications that need to interact with Active
  Directory. These applications should be added to the allow-listing to avoid false
  positives.
level: medium
note: |
  ### Technical Context
  This detection rule identifies unusual network connections to Active Directory Web Services (ADWS) from processes that are not traditionally involved in managing ADWS. ADWS operates on TCP port 9389 and serves as a critical component for Active Directory operations. An attacker may leverage tools that make unexpected connections to ADWS for reconnaissance purposes or to exfiltrate sensitive directory information, potentially indicating a compromise.

  The suspected threat behaviors mainly target the Discovery phase of an attack lifecycle, specifically utilizing techniques such as `T1087: Account Discovery` from the MITRE ATT&CK framework. By connecting to ADWS from non-standard processes, an attacker may gain insights into Active Directory structures or user accounts without triggering typical security measures.

  Primary data sources for this detection include network connection logs that can capture outbound connections to TCP port 9389. Enhanced visibility into the processes initiating these connections will provide critical evidence for identifying malicious activity.

  ### Investigation Steps
  - **Review Network Connection Logs**: Analyze logs for connections to TCP port 9389 and identify the initiating processes. Look for anomalies, particularly connections from unexpected applications.
  - **Inspect Process Creation Events**: Correlate any identified unusual network connections with process creation events to determine the legitimacy of the originating processes.
  - **Examine ADWS Usage Patterns**: Investigate recent usage of ADWS by legitimate applications in your environment to understand legitimate connections versus suspicious ones.
  - **Correlate with User Behavior**: Check for any unusual account activity around the time of the detected connections, particularly if the connections were made using administrative accounts or by processes that typically do not interact with ADWS.

  ### Prioritization
  The severity of this alert is medium, as the presence of uncommon connections to ADWS could indicate preparation for a data breach or reconnaissance phase, which is significant but may often involve false positives related to legitimate applications.

  ### Blind Spots and Assumptions
  This detection logic may miss connections made by legitimate applications that also utilize ADWS, depending on their implemented process paths. There is an assumption that the log sources for network connections register the correct process information, and that any legitimate applications requiring access to ADWS are properly allow-listed to minimize false positives. To ensure effectiveness, monitoring must include comprehensive logging of both network connections and process creation events associated with the detected activities.

