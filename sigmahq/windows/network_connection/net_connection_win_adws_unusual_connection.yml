level: medium
note: |
  ### Technical Context

  This Sigma rule detects uncommon network connections to Active Directory Web Services (ADWS) on TCP port 9389 from processes that are not typically associated with ADWS management. The likely attacker objective is to perform reconnaissance or data extraction from Active Directory by leveraging ADWS, which can expose sensitive information about user accounts, groups, and permissions. This behavior correlates with the MITRE ATT&CK technique for Credential Dumping (T1087).

  Primary telemetry sources include network connection logs that capture process initiation, including the application and destination port. If exploited maliciously, this could lead to unauthorized access to sensitive AD data, with broader implications for overall network security. It is crucial to note that this detection does NOT confirm malicious intent or activity on its own; further contextual investigation is necessary.

  ### Investigation Steps

  - **Examine process origins:** Check for the process ID and path of the initiating executable using Security Event ID 4688 or Sysmon Event ID 1. Look for non-standard applications making connections to ADWS (C:\Windows\system32\dsac.exe, etc.) which would be considered suspicious.

  - **Verify network connections:** Review network connection logs (e.g., Windows Firewall logs or Sysmon Event ID 3) for unusual source IPs or destination ports related to ADWS. Confirm whether these connections originate from unexpected hosts or services.

  - **Identify expected behaviors:** Legitimate applications typically connecting to ADWS include domain controllers and specific management tools. Ensure that known-good applications (e.g., Microsoft Monitoring Agent) are documented in the allow-list to mitigate false positives.

  - **Correlate with user activity:** Cross-reference the alerts with user activities during the time of observation to identify any anomalous behavior, such as unauthorized access attempts or the execution of unusual scripts.

  - **Check for high-confidence indicators:** Validate whether unusual command-line parameters were used with PowerShell when connecting to ADWS, utilizing Sysmon Event ID 1 or Security Event ID 4688. Specific command-line arguments may lead to a higher suspicion of malicious activity.

  - **Assess asset criticality:** Understand whether the affected systems have critical roles in the network. Connections from sensitive systems to ADWS should be closely monitored due to their potential impact on overall network security.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive data availability and integrity within Active Directory. The likelihood of malicious abuse is moderate as attackers often use uncommon processes to blend in and avoid detection. Given that querying ADWS is explicitly utilized in credential dumping techniques, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  Limitations include the possibility of legitimate administrative tools or scripts generating these actions, which could evade detection if they fall within allow-listed applications. Reliable detection requires proper logging configuration, particularly for network connection events and process creation. Common benign activities may involve automated administrative tasks that invoke ADWS inadvertently. Related detections, such as those for unauthorized use of PowerShell (T1059.001), can strengthen coverage and provide additional context during investigations.

