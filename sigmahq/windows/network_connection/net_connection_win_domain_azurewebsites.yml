  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies network connections initiated by non-browser processes to the domain "azurewebsites.net". This domain is often leveraged by threat actors for malicious activities, including hosting malware and exfiltrating data. The detection aims to highlight potential command and control (C2) communications or data exfiltration attempts originating from malicious applications masquerading as legitimate processes.

  The likely attacker objectives include stealthy data theft or lateral movement within the environment, potentially providing threat actors with access to sensitive information or further exploitation opportunities. The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Command and Control (TA0011)** and **Application Layer Protocol (T1071)**, specifically the techniques for **Application Layer Protocol (T1071.001)** and **Web Service (T1102)**.

  The primary data sources for this detection rule involve network connection logs from Windows systems, which can capture instances of outbound connections initiated by various processes. Monitoring these connections, especially when facilitated by non-browser applications, can provide vital insights into potentially compromised environments.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine the logs for initiated connections to "azurewebsites.net" to determine the originating process and evaluate its legitimacy within the environment.
  - **Correlate Process Details**: Investigate the process invoking the connection. Validate if the executable is part of known legitimate software or if it resembles common malware signatures or behaviors.
  - **Analyze Execution Context**: Check the execution context of the non-browser process. Look for signs of compromise, such as unusual parent processes or discrepancies in digital signatures that could indicate tampering.
  - **Explore Related Artifacts**: Collect and analyze artifacts like EDR telemetry or process creation events to see if there are further connections, unusual command-line arguments, or other processes created in relation to the identified connection.

  ### Prioritization
  This alert carries medium severity due to the potential risk associated with connections to known malware-hosting sites. The likelihood of attackers using non-browser processes for C2 communications underscores the need for prompt investigation to mitigate potential data breaches or compromised environments.

  ### Blind Spots and Assumptions
  This detection logic assumes that the process attempting the connection is not a standard or whitelisted application outside of common web browsers, which could result in false negatives. There may also be limitations if security logging is not adequately configured or if the network connection logs are not comprehensive. Additionally, processes not explicitly covered in the filters may still pose a risk, highlighting the need for tuning and adjustments based on enterprise-specific applications. Enhanced logging or monitoring of unconventional applications may be required for more effective detection coverage.

