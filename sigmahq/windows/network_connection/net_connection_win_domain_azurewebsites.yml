note: |
  ---

  ### Technical Context

  This Sigma rule detects network connections initiated to "azurewebsites.net" by processes that are not recognized as web browsers. This behavior is often associated with malicious activities such as data exfiltration, Command and Control (C2) communication, or malware calling back to its command center. The likely attacker objective is to leverage cloud services to obfuscate malicious activity or to host malware payloads.

  This detection aligns with the MITRE ATT&CK framework techniques, specifically T1102 (Web Service) and T1102.001 (Web Service Direct) under the command-and-control tactic. The primary telemetry source is Windows network connection logs, identifying initiated connections, thus requiring log types that include connection information along with process image names. If malicious, this behavior can lead to data breaches or system compromises. However, this detection does NOT alone confirm that the connection is malicious, as legitimate applications may also use similar connections.

  ---

  ### Investigation Steps

  - **Review Process Image: ** Check the `Image` field to identify the process that initiated the connection. Malicious processes may not be typical system applications. Look for unusual paths or names, such as executables in non-standard directories (Event ID 5156).

  - **Examine Network Connection Protocol:** Analyze connection logs for the `DestinationHostname` to ensure the process is communicating with `azurewebsites.net`. Confirm that a non-browser process is making this connection (Windows Firewall log: Event ID 5156).

  - **Identify Legitimate Applications:** Verify any benign processes known to initiate connections to cloud services for valid operational reasons, such as backup software or legitimate DevOps tools targeting Azure services.

  - **Check for Malicious Indicators:** Look for known malicious hashes or signatures associated with the initiating processes. Validate against threat intelligence sources for any flagged connections to `azurewebsites.net`.

  - **Analyze Timing and Frequency:** Review the frequency and timing of the connection attempts. Multiple rapid connections from the same non-browser process may indicate malicious behavior rather than standard application usage patterns.

  - **Validate User Context:** Investigate which user account initiated the connection. Determine whether it aligns with legitimate use or if the account has been compromised, looking particularly at administrative and service accounts.

  ---

  ### Prioritization

  This alert has a medium severity in an enterprise context. Connections to `azurewebsites.net` by non-browser processes could indicate potential compromises or exfiltration attempts, particularly if the host is critical to operations or houses sensitive data. However, the likelihood of malicious abuse depends on the legitimacy of the processes initiating the connections.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness is limited if proper logging is not enabled, particularly the recording of process management events. Legitimate activities, such as cloud services or third-party applications utilizing Azure infrastructure for benign purposes, may inadvertently trigger this alert. Companion detections that strengthen coverage include monitoring suspicious outbound traffic patterns or additional Sigma rules focused on known C2 domains.

