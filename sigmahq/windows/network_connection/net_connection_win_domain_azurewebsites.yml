level: medium
note: |
  ### Technical Context

  This Sigma rule detects initiated network connections to "azurewebsites.net" from processes that are not legitimate web browsers. Since "azurewebsites.net" is often used by threat actors for malware hosting or data exfiltration, the behavior indicates potential command-and-control (C2) activity or data theft. This detection aligns with the MITRE ATT&CK tactics of Command and Control (TA0011) and Exfiltration (TA0010), specifically targeting the "Application Layer Protocol" (T1102) technique. The primary telemetry sources include Windows network connection logs, focusing on fields that denote the destination hostname and the initiating process image.

  If the detected activity is malicious, it may represent an active compromise, with the potential for data loss or unauthorized access to sensitive information. However, this rule does NOT confirm that all traffic to "azurewebsites.net" is malicious, as there could be legitimate use cases or connections initiated by benign applications.

  ### Investigation Steps

  - **Review process image and command line:** Check for suspicious or uncommon process names initiating the connection to "azurewebsites.net." Look for Event ID 4688 (Process Creation) showing the EventType, ImageName, and CommandLine fields to determine the legitimacy of the process.

  - **Assess network traffic patterns:** Analyze network logs (Windows Firewall Events, Event ID 5156) for unusual outbound traffic to "azurewebsites.net." Look for connections from non-browser applications versus expected browser traffic.

  - **Identify benign processes:** Cross-reference the detected process with known legitimate applications in your environment. This includes checking telemetry for common corporate applications that may use cloud services in an expected manner.

  - **Check for previous alerts or related incidents:** Investigate the incident history for any previous alerts related to the detected process. Cross-reference with Event ID 1102 (TCP/IP connections) to assess similar activities.

  - **Validate for file creation or exfiltration events:** Review system event logs, such as Event ID 5145 (File Share Access) or Event ID 4663 (File Access), to determine if the detected process engaged in file manipulation or transfer activity prior to the connection.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of compromised systems initiated by a non-standard application. Given the likelihood of attackers using Azure-hosted resources, the risk of malicious abuse is elevated. However, this behavior may also reflect legitimate applications communicating within the corporate network.

  ### Blind Spots and Assumptions

  The detection may miss certain evasion techniques, such as application whitelisting bypasses or usage of trusted applications for malicious purposes. Required log sources include detailed network connection logs and process creation events. Legitimate applications may also trigger this alert if they communicate with Azure services, necessitating further context for accurate triage. A related detection to consider for enhanced coverage is monitoring for unauthorized configuration changes in Windows Firewall settings (Event ID 2004).

