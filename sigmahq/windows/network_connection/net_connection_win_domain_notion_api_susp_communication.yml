title: Potentially Suspicious Network Connection To Notion API
id: 7e9cf7b6-e827-11ed-a05b-15959c120003
status: test
description: Detects a non-browser process communicating with the Notion API. This
  could indicate potential use of a covert C2 channel such as "OffensiveNotion C2"
references:
- https://github.com/mttaggart/OffensiveNotion
- https://medium.com/@huskyhacks.mk/we-put-a-c2-in-your-notetaking-app-offensivenotion-3e933bace332
author: Gavin Knapp
date: 2023-05-03
tags:
- attack.command-and-control
- attack.t1102
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationHostname|contains: 'api.notion.com'
  filter_main_notion:
    Image|endswith: '\AppData\Local\Programs\Notion\Notion.exe'
  filter_main_brave:
    Image|endswith: '\brave.exe'
  filter_main_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_main_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_main_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_main_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_main_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_main_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_main_opera:
    Image|endswith: '\opera.exe'
  filter_main_safari:
    Image|endswith: '\safari.exe'
  filter_main_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_main_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_main_whale:
    Image|endswith: '\whale.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications communicating with the "api.notion.com" endpoint that are
  not already in the exclusion list. The desktop and browser applications do not appear
  to be using the API by default unless integrations are configured.
level: low
note: |
  ### Technical Context
  This detection rule aims to identify potentially suspicious network connections made by non-browser processes to the Notion API, which could indicate the use of covert command-and-control (C2) channels, specifically targeting the OffensiveNotion tool. OffensiveNotion leverages the Notion application’s API to establish a communication channel that can be used for malicious activities, including data exfiltration and remote control of compromised systems. The intended attacker objective is to evade detection by masquerading within a commonly used productivity application.

  Relevant MITRE ATT&CK tactics include:
  - **Command and Control** (TA0011) - The use of the Notion API for C2 demonstrates an attempt to maintain communication with compromised endpoints while avoiding the scrutiny typically directed at known malicious infrastructure.
  - **Application Layer Protocol** (T1102) - Utilizing standard application protocols to communicate with potentially malicious endpoints allows attackers to blend their activities into normal network traffic.

  The primary data sources for this detection include network connection logs, specifically those that capture outgoing requests and categorize processes by their executable paths, enabling analysts to distinguish between legitimate and suspicious activity associated with Notion.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine the logs for any outbound connections made by non-browser processes to the "api.notion.com" endpoint, paying close attention to the process name and the user account associated with these connections.
  - **Analyze Process Executables:** Investigate the file path of the executable making the network request. Ensure it is not one of the legitimate browser applications or productivity tools by looking for discrepancies or unusual locations.
  - **Cross-Reference with Response Teams:** Engage with endpoint detection and response (EDR) teams to ascertain whether the identified process shows any other indicators of compromise (IoCs) associated with known threat behaviors or additional malicious artifacts.
  - **Monitor for Additional Command and Control Indicators:** Keep an eye out for related network activity that might indicate a broader C2 framework, such as connections to other unusual or known malicious endpoints, abnormal data transfer sizes, or patterns that correlate with known malware operations.

  ### Prioritization
  This alert has a low severity level primarily because it may indicate the use of a legitimate application (Notion) for communication purposes. However, given the rise of tools like OffensiveNotion leveraging such channels, it is essential to investigate further to confirm or rule out any malicious intent.

  ### Blind Spots and Assumptions
  This detection logic may miss instances where legitimate applications are improperly configured or utilized in unexpected ways, leading to false positives. The rule assumes that network connections to the Notion API by browser processes are benign and excludes them from checks. It also relies on correctly configured telemetry that monitors all outbound network activity, which may not capture encrypted traffic or might lack visibility into all process creation events if logging policies are not sufficiently advanced.

