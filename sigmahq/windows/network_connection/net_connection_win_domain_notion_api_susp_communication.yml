title: Potentially Suspicious Network Connection To Notion API
id: 7e9cf7b6-e827-11ed-a05b-15959c120003
status: test
description: Detects a non-browser process communicating with the Notion API. 
  This could indicate potential use of a covert C2 channel such as 
  "OffensiveNotion C2"
references:
- https://github.com/mttaggart/OffensiveNotion
- https://medium.com/@huskyhacks.mk/we-put-a-c2-in-your-notetaking-app-offensivenotion-3e933bace332
author: Gavin Knapp
date: 2023-05-03
tags:
- attack.command-and-control
- attack.t1102
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationHostname|contains: 'api.notion.com'
  filter_main_notion:
    Image|endswith: '\AppData\Local\Programs\Notion\Notion.exe'
  filter_main_brave:
    Image|endswith: '\brave.exe'
  filter_main_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_main_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_main_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_main_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_main_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_main_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_main_opera:
    Image|endswith: '\opera.exe'
  filter_main_safari:
    Image|endswith: '\safari.exe'
  filter_main_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_main_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_main_whale:
    Image|endswith: '\whale.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications communicating with the "api.notion.com" endpoint that 
  are not already in the exclusion list. The desktop and browser applications do
  not appear to be using the API by default unless integrations are configured.
level: low
note: |
  ### Technical Context

  This rule detects potentially suspicious network connections being made to the Notion API by non-browser processes, which may indicate the use of a covert command and control (C2) channel, such as those implemented by tools like "OffensiveNotion." The primary attacker objective could be to establish a persistent and evasive communication channel to exfiltrate data or receive commands. This behavior corresponds with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique Application Layer Protocol (T1102).

  The primary telemetry sources involved are Windows network connection logs. Specifically, logs must capture outgoing connections to the Notion API endpoint (`api.notion.com`). If malicious, this type of connection could facilitate unauthorized data access or the execution of remote commands, compromising confidentiality and integrity. Importantly, this detection does NOT confirm malicious intent without further contextual investigation.

  ### Investigation Steps

  - **Verify the originating process:** Check process activity using Sysmon Event ID 1 to identify the initiating process for the connection to `api.notion.com`. Look for processes not typically performing HTTP requests, especially those outside of standard user applications.

  - **Assess connection behavior:** Review network logs (Windows Event ID 5156 or firewall logs) for detailed connection timing and frequency. Malicious indicators could include repeated connections or unusual timing patterns (e.g., during off-hours) indicating potential C2 activity.

  - **Cross-reference installed applications:** Identify all legitimate applications installed on the host using WMI queries (e.g., `Get-WmiObject -Class Win32_Product`). Validation should confirm that known applications using `api.notion.com` are indeed listed and expected.

  - **Analyze Windows Defender logs:** Examine Windows logs (Windows Defender Event ID 1116) for any alerts related to Notion or unusual behavior associated with the detected process. A lack of alerts or previous knowledge of legitimate use can indicate suspicious activity.

  - **Identify normal usage patterns:** Document expected behavior for Notion API access, primarily used by the official Notion application. Confirm if any functions were being actively utilized by legitimate users in the organization.

  - **Review system access privileges:** Check the access rights of the identified process using tools like `whoami /priv`. Inappropriate privileges or unexpected access levels may indicate that a compromised process is being misused.

  ### Prioritization

  The alert should be classified as low severity in an enterprise context due to the minimal immediate impact on the infrastructure. However, the likelihood of malicious use exists, especially if the communication indicates a known C2 method. Network traffic to uncommon destinations from non-browser applications generally aligns with potential exploitation attempts, warranting careful review but not immediate escalation.

  ### Blind Spots and Assumptions

  Common evasion techniques include disguising C2 traffic within legitimate application communications, making detection reliant on proper log source configurations. Ensuring comprehensive logging of all outgoing web traffic can mitigate exposure. Legitimate activities that could trigger this alert include automation tools or integrations that use Notion for valid business operations. A related detection, monitoring for unusual outbound traffic patterns from Microsoft Office applications, could strengthen coverage and indicate other potential exploited vectors.

