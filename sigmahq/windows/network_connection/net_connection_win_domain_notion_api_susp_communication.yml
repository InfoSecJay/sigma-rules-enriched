title: Potentially Suspicious Network Connection To Notion API
id: 7e9cf7b6-e827-11ed-a05b-15959c120003
status: test
description: Detects a non-browser process communicating with the Notion API. This
  could indicate potential use of a covert C2 channel such as "OffensiveNotion C2"
references:
- https://github.com/mttaggart/OffensiveNotion
- https://medium.com/@huskyhacks.mk/we-put-a-c2-in-your-notetaking-app-offensivenotion-3e933bace332
author: Gavin Knapp
date: 2023-05-03
tags:
- attack.command-and-control
- attack.t1102
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationHostname|contains: 'api.notion.com'
  filter_main_notion:
    Image|endswith: '\AppData\Local\Programs\Notion\Notion.exe'
  filter_main_brave:
    Image|endswith: '\brave.exe'
  filter_main_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_main_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_main_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_main_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_main_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_main_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_main_opera:
    Image|endswith: '\opera.exe'
  filter_main_safari:
    Image|endswith: '\safari.exe'
  filter_main_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_main_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_main_whale:
    Image|endswith: '\whale.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications communicating with the "api.notion.com" endpoint that are
  not already in the exclusion list. The desktop and browser applications do not appear
  to be using the API by default unless integrations are configured.
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects non-browser processes making network connections to the Notion API (api.notion.com). The likely objective of an adversary utilizing this behavior could be to set up a covert command and control (C2) channel, specifically through tools like "OffensiveNotion," which exploits legitimate applications for unauthorized communication. This activity aligns with the MITRE ATT&CK tactic of Command and Control (T1102).

  The primary telemetry sources include Windows network connection logs. The security impact is significant if malicious, as it may indicate a breach and unauthorized remote access to the system. Notably, this detection does NOT prove a malicious intent on its own, as legitimate applications may also use the Notion API if configured properly.

  ---

  ### Investigation Steps

  - **Check the process making the connection**: Investigate the process name and path. Expect non-browser applications unrelated to Notion usage, which could indicate malicious activity. Use Windows Event ID 5156 from Windows Firewall logs to identify the originating process.

  - **Review network connection details**: Validate the connection details for the session to api.notion.com. Compare the process ID (PID) against your internal records to assess if it corresponds to a known benign application or a suspicious one.

  - **Look for unusual process instances**: Search for instances of the Notion executable (Notion.exe) within non-standard directories that deviate from C:\Users\<username>\AppData\Local\Programs\Notion\. An instance outside this path may be an indicator of compromise.

  - **Evaluate active integrations**: Identify whether the legitimate Notion application or integrations with external services have been configured. If they are set up, this could explain the behavior and indicate a false positive.

  - **Check for recent changes in the environment**: Use Sysmon Event ID 23 to determine if any recent software installations or configuration changes have occurred that would cause the Notion client to behave differently.

  - **Investigate similar telemetry**: Analyze related alerts for other unauthorized connections to known C2 destinations or unusual outbound network traffic patterns from the same host to better understand the context of the potential compromise.

  ---

  ### Prioritization

  The alert is of **low severity** in a mature enterprise context, given that the source application may often be used legitimately. However, the risk remains due to the potential for malicious exploitation of legitimate tools to establish C2 communication, which is not uncommon in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations if legitimate applications communicate with the Notion API due to integration or configuration settings. Reliance on specific network logs for complete visibility is crucial, highlighting the need for comprehensive monitoring of application behavior. Evasion techniques might involve modifying the process paths or utilizing alternative applications for C2 purposes. A companion detection could include alerts for known C2 domains or IP addresses to enhance overall threat visibility.

