note: |
  ### Technical Context

  This Sigma rule detects network connections initiated by processes on Windows systems to domains ending in `.devtunnels.ms`, which are associated with Microsoft's DevTunnels feature. Attackers may exploit this service to create reverse shells or maintain persistence on compromised systems. The relevant MITRE ATT&CK tactics are Command and Control (T1071) and Exfiltration (T1567.001). The primary telemetry source is network connection logs, specifically focusing on events capturing initiated connections to suspicious domains.

  If detected, this activity can indicate an attempt to exfiltrate data or establish unauthorized remote access, which poses a security risk to the organization. However, it is crucial to emphasize that this detection alone does not confirm malicious intent; legitimate usage of DevTunnels can trigger the same alerts.

  ---

  ### Investigation Steps

  - **Identify the initiating process:** Check for Event ID 4688 (Process Creation) and Sysmon Event ID 1 to find the process that initiated the connection to the DevTunnels domain. Analyze the command line arguments for signs of suspicious activity.

  - **Review network connection details:** Look at the network connection logs to identify the timestamp, source IP, and DNS resolution results. Focus on a destination hostname ending with `.devtunnels.ms` and note any unusual source IP addresses that do not match known organizational assets.

  - **Correlate with user activity:** Check for user activity around the time of the connection in Azure AD sign-in logs to identify any associated accounts. Block suspicious user accounts if necessary based on this behavior.

  - **Determine legitimate use cases:** Identify and document any approved instances of DevTunnels usage within the organization. Ensure that the process initiating the connection is part of known development or deployment workflows.

  - **Identify malicious indicators:** Validate against known malicious IP addresses associated with DevTunnels misuse. Cross-reference the source IP and hostname with threat intelligence feeds to flag any high-confidence malicious activity.

  - **Validate exfiltration artifacts:** If file transfers or uploads are observed coinciding with the connection, validate using file system logs (Windows Event ID 4663) for any unauthorized file access or changes around the same timeframe.

  ---

  ### Prioritization

  This alert carries a medium severity level due to the potential impact on sensitive data and system integrity if exploited. The likelihood of malicious use is high, given that attackers often use such configurations for command and control or exfiltration purposes, making this behavior notably weaponized.

  ---

  ### Blind Spots and Assumptions

  This detection could be evaded through encryption or legitimate use cases not adequately documented, leading to false positives. Reliable detection requires comprehensive logging of network connections and processes. Activities involving legitimate DevTunnels usage by developers could also trigger this alert. A related detection for enhanced coverage could be monitoring for anomalous command-line arguments associated with process creation linked to DevTunnels.

