note: |
  ### Technical Context
  This detection rule identifies network connections initiated by processes on a system to domains ending in `.devtunnels.ms`, which are associated with Microsoft's Dev Tunnels. Attackers may exploit this feature to create reverse shells or establish persistence within an environment, typically to facilitate command and control (C2) operations. By monitoring these connections, security teams can identify potentially malicious activity that leverages legitimate cloud service features for nefarious purposes.

  The relevant MITRE ATT&CK tactics triggered by this rule include:
  - **Exfiltration (TA0010)**: Utilizing network connections to transmit data to external locations.
  - **Command and Control (TA0011)**: Establishing a C2 channel through which attackers can control compromised systems.
  - **Application Layer Protocol (T1572)**: Using application layer protocols to tunnel through network defenses.

  Primary data sources for this detection include:
  - Network connection logs from Windows systems, which capture outbound connections and the associated processes.

  ### Investigation Steps
  - **Review Network Connection Logs**: Analyze connections to any `.devtunnels.ms` domain and identify the originating process. Look for unusual process names or unexpected execution paths.
  - **Correlate with Process Creation Events**: Check process creation logs for the timeframe when the connection was initiated to determine if the process is known or if it shows suspicious behavior (e.g., recently created or elevated privileges).
  - **Examine DNS Query Logs**: Investigate DNS query logs for any related lookups to `.devtunnels.ms` or other anomalous domains that could indicate broader malicious intent.
  - **Assess System Footprints**: Evaluate system users and their activity leading up to the connection. Identify if there were unusual privilege escalations or changes to user accounts that coincide with the detected connection.

  ### Prioritization
  This alert should be treated with medium severity due to the potential impact of unauthorized remote access and command and control activity. Given the rising adoption of cloud services, the likelihood of such attacks also increases, heightening the need for close scrutiny.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for other similar tunneling services not specifically tied to Dev Tunnels, which could enable similar malicious behavior without triggering this alert. The detection logic assumes that any connection to a `.devtunnels.ms` domain is suspicious, which may lead to false positives from legitimate use. Required logs include detailed network connection records and appropriate settings to capture all outbound traffic from systems under observation.

