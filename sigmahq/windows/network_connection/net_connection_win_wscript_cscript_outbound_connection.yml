  ---

  ### Technical Context

  This Sigma rule detects outbound network connections initiated by Windows script interpreters (wscript.exe or cscript.exe) that don’t involve local IP addresses. Such behavior could indicate an attacker’s objective to use scripts to download malicious payloads or communicate with a command and control (C2) server. This detection aligns with the MITRE ATT&CK framework technique T1105 (Ingress Tool Transfer), which is part of the Command and Control tactic.

  The primary telemetry sources for this rule are Windows network connection logs, specifically focusing on events that capture process activity and their network connections. If malicious, this activity may compromise system integrity or facilitate data exfiltration. However, this alert alone does not confirm malicious intent; legitimate scripts may perform similar actions during automated or administrative tasks.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Validate outbound connections related to wscript.exe or cscript.exe. Look for Event ID 5156 in Windows Firewall logs, focusing on connections to external IPs outside of local address ranges.

  - **Analyze script execution:** Verify the script content or command line used for execution. For Event ID 4688 (Process Creation), inspect the fields for the original command line and the path of the script. Legitimate administrative scripts may regularly connect to external resources during software updates or automated tasks.

  - **Identify common external IPs:** Check whether the destination IP is a known service (e.g., public update servers) by cross-referencing with established IP whitelists. Be aware that legitimate organizational traffic may also flow to such IPs.

  - **Check for suspicious payloads:** Look for additional artifacts such as file downloads or unusual HTTP requests by querying Event ID 4104 (PowerShell) or HTTP proxy logs. Malicious connections often result in subsequent payload downloads.

  - **Assess frequency and patterns:** Determine if the behavior is part of a larger pattern of unusual activity on the host. Continuous or repetitive external connections may indicate automated malicious interactions, while sporadic connections could be benign.

  ---

  ### Prioritization

  The alert is classified as high severity due to the potential impact on sensitive systems and data. The likelihood of abuse is significant because adversaries often utilize script interpreters to facilitate command and control interactions, making this behavior commonly weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate administrative or automated scripts can trigger this alert, potentially leading to false positives. Reliable detection requires comprehensive logging of both network and script execution events, and failure to inspect outgoing traffic could overlook malicious intent. An effective companion detection would involve monitoring unusual PowerShell activities given its overlap with scripting behavior and external communications.

