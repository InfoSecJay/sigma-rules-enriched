detection:
  selection:
    Initiated: 'true'
    Image|endswith:
    - '\wscript.exe'
    - '\cscript.exe'
  filter_main_local_ranges:
    DestinationIp|cidr:
    - '127.0.0.0/8'
    - '10.0.0.0/8'
