status: test
description: Detects a script interpreter wscript/cscript opening a network 
  connection to a non-local network. Adversaries may use script to download 
  malicious payloads.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/28d190330fe44de6ff4767fc400cc10fa7cd6540/atomics/T1105/T1105.md
