logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationHostname|endswith:
    - '.localto.net'
    - '.localtonet.com'
    Initiated: 'true'
  condition: selection
falsepositives:
- Legitimate use of the LocaltoNet service.
level: high
note: |
  ### Technical Context

  This Sigma rule detects executable processes that establish network connections to "LocaltoNet" tunneling sub-domains, such as ".localto.net" or ".localtonet.com." This behavior is commonly associated with an attacker’s attempt to use LocaltoNet as a reverse proxy for command and control (C2) activities, allowing them to bypass multi-factor authentication (MFA) and bypass perimeter defenses to access internal services.

  The relevant MITRE ATT&CK tactics affected include Command and Control (TA0011) and the techniques T1572 (Protocol Tunneling) and T1090 (Connection Proxy). The primary telemetry sources are Windows network connection logs, specifically focusing on logs indicating outbound connections to these tunneling services. If malicious, this activity could allow an adversary to maintain persistent control over compromised systems and execute additional malicious actions unnoticed.

  It's important to note that this detection alone does not confirm malicious activity; legitimate usage of LocaltoNet services by authorized users can trigger this rule. Contextual analysis is critical to ascertain intent accurately.

  ### Investigation Steps

  - **Identify the process initiating the connection:** Check Windows Event ID 4688 for process creation logs, focusing on entries where the created process connects to "*.localto.net". Look for unusual process names or paths (e.g., executables in user temp directories).

  - **Review the network connections:** Analyze the netstat output or equivalent network information showing active connections, specifically looking for entries connecting to LocaltoNet domains. Malicious indicators include connections without appropriate enterprise context (e.g., no known legitimate business use).

  - **Correlate with user behavior:** Cross-reference the initiating user account with authentication logs (Security Event ID 4624) to verify if the account had recently accessed the service or related resources legitimately. Note any suspicious logins or access patterns.

  - **Check for previous alerts or incidents:** Investigate recent alerts in the SIEM for any associated or prior incidents linked to the affected endpoint or user account. A pattern of behavior linked to multiple alerts could indicate a persistent threat.

  - **Validate expected behavior:** Confirm if legitimate applications commonly utilized in your enterprise may use LocaltoNet, such as development tools. Document normal usage patterns and the specific users typically involved.

  ### Prioritization

  This alert is considered high severity due to its potential impact; compromising an internal service through tunneling could enable persistent access for an attacker. The likelihood of this behavior being abused by adversaries is elevated given its use in documented C2 scenarios. Such tunneling approaches are increasingly weaponized, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses encrypted tunnels or legitimate services misconfigured to communicate with LocaltoNet. Successful detection relies on accurate and complete Windows network logs, which must be preserved and monitored. Legitimate development and remote support activities could trigger this alert. Strengthening coverage could be achieved with companion detections focused on anomalous outbound connections or related C2 detection tactics in use across the infrastructure.

