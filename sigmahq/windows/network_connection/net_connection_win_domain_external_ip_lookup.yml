level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious external network connections initiated by non-browser processes to various IP lookup service APIs, such as "api.ipify.org". The detection focuses on the potential misuse of these services in a post-compromise scenario, where an attacker may seek to determine the external IP address of the infected host. This behavior could indicate an attempt to establish communication with command and control (C2) servers or to exfiltrate data.

  In a typical threat scenario, an attacker could leverage these IP lookup services to assess the current network environment after successfully breaching a system. The objective may be to gather information useful for lateral movement or further exploitation of the internal network. The MITRE ATT&CK techniques associated with this rule include "T1016: System Network Configuration Discovery," relevant to reconnaissance activities used by attackers to gain intelligence about the network.

  Primary data sources for evidence collection include network connection logs from firewalls or EDR solutions that log external communications, particularly focusing on outbound traffic to the specified IP lookup service domains.

  ### Investigation Steps
  - **Review Network Logs:** Check the network connection logs for outbound traffic to the detected IP lookup services. Focus on analyzing the source process and user context to determine if the connection is legitimate or suspicious.

  - **Correlate with EDR Data:** Use EDR telemetry to examine process creation events and determine which non-browser processes initiated the connections. Investigate any unusual or unauthorized applications running during the same timeframe.

  - **Investigate User Activity:** Look into user activity logs to assess whether the actions leading to the external connections were executed by legitimate users or if there are signs of compromised user accounts.

  - **Analyze Related Incidents:** If similar alerts have been triggered in the past, review those incidents for patterns or connections that may suggest a broader attack campaign or the presence of a threat actor within the environment.

  ### Prioritization
  This alert is considered medium severity due to its potential association with post-compromise activities, which can lead to further exploitation or data exfiltration. Though such connections can sometimes be legitimate for troubleshooting, the context in which they occur often indicates malicious intent.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from encrypted traffic to these IP lookup services, as it could hinder the visibility of non-browser processes making connections. The detection logic assumes that legitimate network monitoring tools or troubleshooting by users will not typically trigger the alert. Required logs include detailed network connection records from the firewall or other network devices capable of capturing outbound requests, ensuring that the IP whitelisting for legitimate tools is carefully managed to minimize false positives.

