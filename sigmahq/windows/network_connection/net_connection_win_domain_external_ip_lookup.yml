note: |
  ### Technical Context

  This Sigma rule detects non-browser processes making network connections to known external IP lookup services such as "api.ipify.org". This behavior may indicate malicious activity, typically associated with post-compromise reconnaissance efforts where an attacker seeks to identify the public IP address of the compromised machine in order to establish command and control (C2) channels. Relevant MITRE ATT&CK techniques include Discovery (T1016: System Network Connections Discovery). The primary telemetry sources include network connection logs from Windows systems, specifically relevant log types that capture outbound connections.

  If this behavior is confirmed as malicious, it could facilitate broader attack vectors such as data exfiltration or lateral movement, thereby compromising the entire network’s integrity. However, it is important to note that this detection does NOT confirm an active compromise on its own; benign use of these APIs for troubleshooting or monitoring can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review network logs for connections:** Check the Windows network connection logs (Event ID 5156) for outbound connections to the listed IP lookup service domains. Identify the process responsible for the connection and note the time of occurrence.

  - **Identify the process making the connection:** Cross-reference the process ID (PID) from the network logs with Windows event logs (Event ID 4688) to determine how the process was initiated. Legitimate applications typically include browsers; any unusual executables (e.g., scripts or background services) require further investigation.

  - **Analyze process behavior:** Use Sysinternals tools (such as Sysmon with Event ID 1) to inspect the behavior of the process making the network connection. Look for unusual command-line arguments or execution paths that deviate from normal operational behavior.

  - **Correlate with other alerts:** Review for other security events around the same time frame that may indicate related malicious behavior, such as abnormal logins (Event IDs 4624/4625) or privilege escalations (Event ID 4672).

  - **Assess asset criticality:** Consider the role and criticality of the asset that triggered the alert. Endpoints performing sensitive functions (e.g., domain controllers, databases) are prioritized over workstations.

  - **Validate expected activity:** Confirm if the identified process communicates with these external APIs as part of legitimate troubleshooting or monitoring. If so, document this for future reference and consider whitelisting known, trustworthy tools.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential risk if the affected endpoint is part of a critical infrastructure and the likelihood of IP lookup services being abused by attackers. Given that this behavior is often associated with post-exploitation reconnaissance, it warrants prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by instances where the outbound connection is obscured or encrypted, complicating analysis. Depending on the network configuration, outbound traffic to these domains can also arise from legitimate applications, such as troubleshooting tools by network engineers. A companion detection strategy can include monitoring process creation events (e.g., Event ID 4688) to strengthen context around potentially malicious process behavior.

