  ### Technical Context

  This Sigma rule detects network connections initiated by the Equation Editor process, `eqnedt32.exe`, which is often exploited in malicious document (maldoc) attacks. The objective typically involves establishing outbound connections to command-and-control (C2) servers to execute further instructions or exfiltrate data. This behavior aligns with the MITRE ATT&CK tactic of Execution and the technique T1203 (Exploitation for Client Execution).

  Primary telemetry sources include Windows Security Event ID 5156 (Windows Filtering Platform) and network logs that capture connection details. If malicious, the impact can range from data theft to deeper system compromise. It is important to note that this detection does NOT confirm malicious activity on its own; it only indicates that a potentially dangerous process is attempting to establish a network connection.

  ### Investigation Steps

  - **Review event logs for eqnedt32.exe:**
     Check Windows Event ID 4688 (Process Creation) for instances of eqnedt32.exe spawning. Look for command-line arguments that may indicate malicious use, such as the inclusion of unusual network flags or parameters.

  - **Analyze network connection details:**
     Inspect Windows Filtering Platform Event ID 5156 to identify the destination IP addresses and ports being accessed by eqnedt32.exe. Compare against known malicious IP addresses or threat intelligence feeds.

  - **Identify baseline legitimate activity:**
     Establish what legitimate use of the Equation Editor looks like within your environment (e.g., specific users initiating eqnedt32.exe for document review). Any connection attempts during unusual hours or by non-typical users may indicate a red flag.

  - **Check for suspicious behavioral patterns:**
     Look for patterns such as multiple instances of eqnedt32.exe connecting to different external IPs in a short time frame, which does not align with normal usage.

  - **Validate any related file creation:**
     Monitor for any file creation events linked to eqnedt32.exe or other connected suspicious processes, such as suspicious executable downloads (Monitor Event ID 4663 for file access).

  - **Cross-reference with antivirus alerts:**
     Verify if any antivirus or EDR solutions have flagged eqnedt32.exe or the observed connections as part of a known threat campaign, reinforcing the need for urgency in investigation.

  ### Prioritization

  The severity of this alert is high due to the potential for data exfiltration and system compromise via a commonly weaponized attack vector leveraging benign-looking processes. The likelihood of malicious abuse is significant, particularly in environments where document-based exploitation is prevalent.

  ### Blind Spots and Assumptions

  Evasion may occur if the malicious actor uses obfuscated command arguments or executes eqnedt32.exe from a legitimate file path, making detection challenging. Reliable detection requires comprehensive logging, including both process creation and outbound network activity. Legitimate activities may include the use of Equation Editor for normal document processing. Related detections, such as monitoring for RTF exploitation attempts or unusual Office applications initiating network connections, can strengthen coverage against such threats.

