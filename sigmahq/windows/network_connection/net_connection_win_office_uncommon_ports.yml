title: Office Application Initiated Network Connection Over Uncommon Ports
id: 3b5ba899-9842-4bc2-acc2-12308498bf42
status: test
description: Detects an office suit application (Word, Excel, PowerPoint, 
  Outlook) communicating to target systems over uncommon ports.
references:
- https://blogs.blackberry.com/en/2023/07/romcom-targets-ukraine-nato-membership-talks-at-nato-summit
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-12
modified: 2025-10-17
tags:
- attack.command-and-control
- attack.stealth
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith:
    - '\excel.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    - '\wordview.exe'
  filter_main_common_ports:
    DestinationPort:
    - 53         # DNS
    - 80         # HTTP
    - 139         # NETBIOS
    - 389         # LDAP
    - 443         # HTTPS
    - 445         # SMB
    - 3268         # MSFT-GC
  filter_main_outlook_ports:
    Image|contains: ':\Program Files\Microsoft Office\'
    Image|endswith: '\OUTLOOK.EXE'
    DestinationPort:
    - 143
    - 465         # SMTP
    - 587         # SMTP
    - 993         # IMAP
    - 995         # POP3
  condition: selection and not 1 of filter_main_*
falsepositives:
- Other ports can be used, apply additional filters accordingly
level: medium
note: |
  ### Technical Context

  This Sigma rule detects network connections initiated by Microsoft Office applications (Word, Excel, PowerPoint, Outlook) over uncommon ports, which may indicate command-and-control (C2) activity or data exfiltration. The likely attacker objective is to communicate with a remote server to execute malicious commands or transfer data while evading detection by using non-standard ports. This behavior fits the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1071).

  The primary telemetry sources include Windows network connection logs, specifically monitoring for initiated connections and the corresponding process information. If malicious, this behavior could lead to significant data loss or system compromise. However, this detection does NOT confirm the malicious intent of the activity on its own, as legitimate Office operations may also use uncommon ports.

  ### Investigation Steps

  - **Verify the source of the connection:** Review Windows Security Event ID 5156 for filtering associated with the originating application (e.g., `excel.exe`, `outlook.exe`). Confirm if the connections are indeed initiated from these sources.

  - **Check destination ports and IP addresses:** Analyze the network connection's destination ports against the common port list. If connections are made to high-risk ports (e.g., 143, 465, 587, 993, 995), further scrutiny is warranted. Validate against known benign activities.

  - **Investigate the process command line:** Examine process creation logs (e.g., Sysmon Event ID 1) for parameters passed to `winword.exe`, `excel.exe`, or `outlook.exe`. Look for unusual command-line arguments that suggest potential malicious payload delivery or data access.

  - **Identify user context:** Review Active Directory logs to assess the user account associated with the initiated connection. Validate if the account has been flagged for unusual behavior or if it falls within a typical usage pattern for the organization.

  - **Correlate with other logs:** Cross-reference findings with firewall logs for blocked or allowed connections over these uncommon ports. Document any unexpected patterns that align with known attack scenarios.

  - **Monitor legitimate behavior:** Assess regular Office application usage by normal users to understand baseline traffic. Determine if the identified port use stems from typical business operations (e.g., mails, updates) or if it diverges from expected activity.

  ### Prioritization

  This alert holds a medium severity due to the potential threat of data exfiltration or system manipulation if the detected connections are indeed malicious. Uncommon port usage often correlates with sophisticated attacks, making it essential for timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive network logging or if firewall rules incorrectly allow unexpected port traffic. Legitimate scenarios may trigger this alert, particularly involving legitimate software updates or genuine email protocols being routed over unusual ports. Implementing additional detections around unusual outbound traffic or specific regex patterns within command lines can complement this rule and improve detection fidelity.

