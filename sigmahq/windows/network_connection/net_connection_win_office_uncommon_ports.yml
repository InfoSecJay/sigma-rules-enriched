title: Office Application Initiated Network Connection Over Uncommon Ports
id: 3b5ba899-9842-4bc2-acc2-12308498bf42
status: test
description: Detects an office suit application (Word, Excel, PowerPoint, Outlook)
  communicating to target systems over uncommon ports.
references:
- https://blogs.blackberry.com/en/2023/07/romcom-targets-ukraine-nato-membership-talks-at-nato-summit
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-12
modified: 2025-10-17
tags:
- attack.defense-evasion
- attack.command-and-control
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith:
    - '\excel.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    - '\wordview.exe'
  filter_main_common_ports:
    DestinationPort:
    - 53         # DNS
    - 80         # HTTP
    - 139         # NETBIOS
    - 389         # LDAP
    - 443         # HTTPS
    - 445         # SMB
    - 3268         # MSFT-GC
  filter_main_outlook_ports:
    Image|contains: ':\Program Files\Microsoft Office\'
    Image|endswith: '\OUTLOOK.EXE'
    DestinationPort:
    - 143
    - 465         # SMTP
    - 587         # SMTP
    - 993         # IMAP
    - 995         # POP3
  condition: selection and not 1 of filter_main_*
falsepositives:
- Other ports can be used, apply additional filters accordingly
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where Microsoft Office applications (Word, Excel, PowerPoint, and Outlook) establish network connections over uncommon ports. These applications typically interact with well-known ports for standard operations, such as HTTP (80) or HTTPS (443). However, malicious actors often exploit these legitimate applications to establish command-and-control (C2) channels or to exfiltrate data. The use of uncommon ports for such communication raises a red flag and indicates potential malicious activity, commonly associated with techniques such as data exfiltration and command-and-control traffic.

  The main threat actors that may utilize this technique belong to various threat families that engage in advanced persistent threats (APTs) or cyber espionage. Their objectives may include stealthy data theft, system compromise, or maintaining persistent access to networks by obfuscating their communications within trusted applications. This behavior is particularly relevant to the MITRE ATT&CK framework under the tactics of **Command and Control (TA0011)** and **Defense Evasion (TA0005)**, particularly focusing on techniques such as **Application Layer Protocol (T1071)** and **Port Knocking (T1392)**.

  The primary data sources for this rule include network connection logs that capture outbound communications from Windows machines running Office applications. Monitoring this data is crucial for identifying anomalies and potential breaches in network security.

  ### Investigation Steps
  - **Review Network Logs:** Examine network connection logs for communications initiated by Office applications to identify any use of uncommon ports that deviate from established baselines.

  - **Analyze Application Behavior:** Investigate the behavior of the Office applications involved, particularly focusing on their network traffic patterns and the destination IP addresses being contacted.

  - **Correlate with User Activity:** Check if the users of the affected Office applications have legitimate business reasons for the observed network activity, ensuring there are no signs of credential misuse or unauthorized access.

  - **Cross-Reference with Threat Intelligence:** Utilize threat intelligence feeds to determine if the observed domein names/IPs correspond with known malicious actors or are associated with previous incident reports.

  ### Prioritization
  The alert is prioritized as medium due to the potential severity of the threat it represents; uncommon port communications may indicate an attempt to bypass security measures, but this activity may also arise from legitimate usage of applications. Given the commonality of phishing attacks and the misuse of trusted applications, the likelihood of a real threat requiring investigation is significant.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if the outbound network traffic is encrypted (e.g., HTTPS), which can obscure the details of the communication. Additionally, the detection logic assumes that the use of Office applications over uncommon ports is malicious, neglecting benign scenarios where users may configure applications to use alternative ports for legitimate reasons. Required logs include complete network connection records from firewalls or network monitoring systems, making it essential to ensure that these logs are collected and retained properly.

