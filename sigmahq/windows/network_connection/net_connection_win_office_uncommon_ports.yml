title: Office Application Initiated Network Connection Over Uncommon Ports
id: 3b5ba899-9842-4bc2-acc2-12308498bf42
status: test
description: Detects an office suit application (Word, Excel, PowerPoint, 
  Outlook) communicating to target systems over uncommon ports.
references:
- https://blogs.blackberry.com/en/2023/07/romcom-targets-ukraine-nato-membership-talks-at-nato-summit
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-12
modified: 2025-10-17
tags:
- attack.defense-evasion
- attack.command-and-control
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|endswith:
    - '\excel.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    - '\wordview.exe'
  filter_main_common_ports:
    DestinationPort:
    - 53         # DNS
    - 80         # HTTP
    - 139         # NETBIOS
    - 389         # LDAP
    - 443         # HTTPS
    - 445         # SMB
    - 3268         # MSFT-GC
  filter_main_outlook_ports:
    Image|contains: ':\Program Files\Microsoft Office\'
    Image|endswith: '\OUTLOOK.EXE'
    DestinationPort:
    - 143
    - 465         # SMTP
    - 587         # SMTP
    - 993         # IMAP
    - 995         # POP3
  condition: selection and not 1 of filter_main_*
falsepositives:
- Other ports can be used, apply additional filters accordingly
level: medium
note: |
  ### Technical Context

  This rule detects when Microsoft Office applications (e.g., Word, Excel, Outlook, PowerPoint) initiate network connections using uncommon ports, which may indicate potential command-and-control (C2) or exfiltration activity. Attackers may use these applications to covertly communicate with malicious infrastructure, leveraging them as a mechanism to bypass traditional security controls. This behavior aligns with the MITRE ATT&CK framework under the tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1071).

  Primary telemetry sources include network connection logs, particularly focusing on Windows log types that record outbound traffic. If this activity is malicious, there is a significant risk of data exfiltration or remote control of the system. It's important to note that this detection does not confirm malicious intent on its own; legitimate applications may use uncommon ports for valid purposes.

  ---

  ### Investigation Steps

  - **Identify the Office application in use:** Check network logs for connections initiated by known Office applications (e.g., Security Event ID 4688 for process creation or Sysmon Event ID 1). Review the `Image` field to confirm it corresponds to the expected Office executable.

  - **Examine network destination details:** Look at the `DestinationPort` field in the network logs to determine the ports being used. Legitimate traffic typically utilizes common ports such as 443 or 80. Investigate any connections to uncommon ports (e.g., 143, 465, 587, 993, 995) indicating potential misuse.

  - **Review contextual information for user behavior:** Analyze user activity around the time of the alert. If the process was invoked by a user performing reasonable tasks—like sending emails or collaborating on documents—it may indicate benign behavior.

  - **Check for known malicious indicators:** Validate if the destination IP is associated with known malicious campaigns or C2 infrastructure using threat intelligence feeds or reputation services.

  - **Validate against legitimate activity:** Document and review instances where Office applications connect to uncommon ports in legitimate environments. Comparatively assess the behavior against the active alert to differentiate between benign and malicious activities.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity. The involved systems likely hold sensitive information, and the possibility of malicious exploitation (such as data exfiltration or malicious command execution) is a significant concern. The use of Office applications for such communications is increasingly observed in real-world adversarial tactics.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of alternative tools or protocols not covered in this rule, and attackers may employ encryption or tunneling techniques. Ensure logs for outbound connections are properly configured for comprehensive coverage. Legitimate activities such as email syncs using uncommon ports could trigger these alerts, necessitating careful context assessment. A companion detection rule focusing on email traffic for unusual attachment behaviors (e.g., SMTP traffic generically) may help provide a fuller picture of such responses.

