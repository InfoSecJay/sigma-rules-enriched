note: |
  ### Technical Context
  This rule detects a potentially malicious behavior where the Windows Service Host (svchost.exe) is using Remote Desktop Protocol (RDP) to communicate over non-standard ports, specifically TCP ports 80 or 443, which are typically reserved for HTTP and HTTPS traffic. Attackers may use this tactic to bypass network restrictions, creating covert tunnels that allow for unauthorized remote access to systems. The objective may be to maintain persistence, exfiltrate data, or perform lateral movement within the network.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - Command and Control (T1071.001) - Application Layer Protocol: Web Protocols
  - Lateral Movement (T1021.001) - Remote Desktop Protocol

  The primary data source for this detection will be network connection logs from Windows, which should capture detailed information about connections initiated by svchost.exe, including source and destination IP addresses and ports.

  ### Investigation Steps
  - **Review Network Logs:** Check Windows network connection logs for instances of svchost.exe initiating connections to TCP ports 80 or 443, especially originating from 3389. Investigate the destination IPs and whether they correspond to known or legitimate external services.
  - **Analyze Process Behavior:** Investigate the process tree and parent-child relationships around svchost.exe instances to determine their legitimacy. Review running processes for unusual parent processes or signs of compromise.
  - **Correlate with User Activity:** Look at user activity related to RDP access. Verify if the user account associated with the svchost.exe instance had an administrator or unauthorized privilege that allows for RDP connections.
  - **Check Firewall and Proxy Logs:** Review logs for unusual outbound traffic to external URLs associated with HTTP/HTTPS requests initiated from internal systems. Assess if any legitimate business needs exist for such activity.

  ### Prioritization
  The alert's severity is considered high in an enterprise environment due to the potential for significant impact by enabling unauthorized access and data exfiltration through non-standard, obfuscated channels.

  ### Blind Spots and Assumptions
  This detection logic may miss instances of legitimate remote management activities that utilize RDP on standard ports. An assumption is that network configurations do not categorize port 80 or 443 traffic as suspicious under normal conditions, thus potentially overlooking certain legitimate uses. It requires proper logging and monitoring configurations of Windows network connections to function effectively, specifically ensuring that logs differentiate between various process activities and connection types.

