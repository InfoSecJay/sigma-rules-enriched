note: |
  ### Technical Context

  This Sigma rule detects instances where the Windows process `svchost.exe`, associated with a Remote Desktop Protocol (RDP) service, initiates communication to target systems over HTTP (port 80) or HTTPS (port 443). The likely attacker objective is to establish a covert communication channel or tunnel for command and control (C2) traffic, bypassing network security controls. This behavior aligns with MITRE ATT&CK tactics for Command and Control (T1071) and T1021.001 (Remote Service Session).

  The primary telemetry source is network connection logs, specifically capturing events where `svchost.exe` is involved in outbound connections. If malicious, this activity can lead to unauthorized access or control over targeted systems. However, detection alone does not confirm nefarious intent; legitimate services may exhibit similar behavior.

  ---

  ### Investigation Steps

  - **Verify the process initiating the connection**: Cross-reference the `svchost.exe` process with Security Event ID 4688 (Process Creation) to ensure it is executing in a legitimate context on a Windows host. Check the command line parameters for atypical behaviors.

  - **Inspect Destination IP/Domain**: Look up the destination IP or hostname in network logs for known malicious indicators or categorize them using threat intelligence feeds to assess risk. Compare against benign domains associated with business applications.

  - **Monitor for unusual outgoing traffic**: Use network monitoring tools to analyze bandwidth usage associated with the specific time the alert triggered. Legitimate RDP shadows or service communications often have predictable patterns, unlike malicious tunnels.

  - **Check network appliance logs**: Review firewall or proxy logs for any rules or alerts triggered around the time of the event (look for Event ID 5156 from Windows Filtering Platform logs). Confirm if the traffic was indeed allowed on your network.

  - **Identify logged user activity**: Review Event ID 4624 (Logon) and correlate with the time frame leading up to the outbound connection. Document any unusual logins, particularly if the account has administrative privileges.

  - **Assess host role**: Determine if the host running the RDP session is critical in your environment (e.g. a member of the domain controller or application server). Malicious actions from these hosts could pose a higher risk than from less critical systems.

  ---

  ### Prioritization

  This alert should be treated with high severity as it could indicate active exploitation of RDP services for malicious purposes. Given that RDP is frequently targeted for lateral movement and command and control by adversaries, the presence of this activity warrants immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be blind to legitimate RDP usage that requires outbound HTTP/HTTPS traffic for legitimate software or updates. If logging is not comprehensive or restrictive firewall settings are not configured to log, detection could be less reliable. Common scenarios, such as users accessing cloud web services or software updates through RDP, may trigger this alert. Implementing detections for lateral movement techniques on the same endpoints (e.g., T1021.002 - Remote Services: SMB/Windows Admin Shares) will bolster overall security coverage.

