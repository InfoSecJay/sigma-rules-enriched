title: Suspicious Non-Browser Network Communication With Telegram API
id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
status: test
description: Detects an a non-browser process interacting with the Telegram API which
  could indicate use of a covert C2
references:
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/small-sieve/NCSC-MAR-Small-Sieve.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-19
tags:
- attack.command-and-control
- attack.exfiltration
- attack.t1102
- attack.t1567
- attack.t1105
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationHostname|contains: 'api.telegram.org'
    # Other browsers or apps known to use telegram should be added
    # TODO: Add full paths for default install locations
  filter_main_brave:
    Image|endswith: '\brave.exe'
  filter_main_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_main_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_main_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_main_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_main_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_main_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_main_opera:
    Image|endswith: '\opera.exe'
  filter_main_safari:
    Image|endswith: '\safari.exe'
  filter_main_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_main_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_main_whale:
    Image|endswith: '\whale.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications communicating with the Telegram API e.g. web browsers not
  in the exclusion list, app with an RSS  etc.
level: medium
note: |
  ### Technical Context
  This rule detects non-browser processes that communicate with the Telegram API, a behavior indicative of potential command-and-control (C2) activity by threat actors. Attackers often leverage such discreet communication channels to maintain persistence, exfiltrate data, or control compromised systems without relying on conventional remote access tools that might trigger alarms. The primary objective of these actions is to evade detection while executing malicious activities, including data theft or lateral movement within a network.

  Relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) and **Exfiltration** (TA0020). Techniques of concern include **Application Layer Protocol** (T1102), where adversaries use widely accepted applications for covert communications, and **Exfiltration Over Command and Control Channel** (T1567), indicating that the attacker might be using Telegram for both receiving commands and sending sensitive data out of the network. The primary data sources to monitor for these interactions include Windows network connection logs that capture process-level communications.

  ### Investigation Steps
  - **Collect Network Connection Logs:** Gather logs from Windows network connections to identify any processes attempting to connect to `api.telegram.org`. Pay attention to the source process and its parent hierarchy to determine the context of the communication.

  - **Review Process Creation Events:** Analyze process creation logs to identify any unusual or non-standard executables initiating outbound connections to the Telegram API. Focus on the paths and arguments used during execution.

  - **Examine User Activity Logs:** Investigate user activity around the times of detected suspicious connections. Cross-reference with normal user behaviors to identify any anomalies that could indicate unauthorized use of applications.

  - **Correlate with Endpoint Detection Alerts:** Look for any associated alerts from endpoint detection and response (EDR) tools that may point to previous malware behavior or known exploits related to the process in question.

  ### Prioritization
  This alert holds medium severity due to the potential impact of unauthorized C2 communication, which may facilitate data exfiltration or lateral movement within the enterprise network. The likelihood of encountering such communication increases with the prevalence of malware aiming to leverage common APIs for covert operations.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage is the potential for legitimate applications, such as those using Telegram's API for harmless purposes, which might be falsely flagged by this rule. Additionally, the detection assumes proper logging is enabled on network connections, and the specific non-browser processes of interest must be identified in advance. If processes that communicate through Telegram are not in the exclusion list, false positives may occur, indicating a need for continuous tuning of the detection logic.

