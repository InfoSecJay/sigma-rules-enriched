title: Suspicious Non-Browser Network Communication With Telegram API
id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
status: test
description: Detects an a non-browser process interacting with the Telegram API 
  which could indicate use of a covert C2
references:
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/small-sieve/NCSC-MAR-Small-Sieve.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-19
tags:
- attack.command-and-control
- attack.exfiltration
- attack.t1102
- attack.t1567
- attack.t1105
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationHostname|contains: 'api.telegram.org'
    # Other browsers or apps known to use telegram should be added
    # TODO: Add full paths for default install locations
  filter_main_brave:
    Image|endswith: '\brave.exe'
  filter_main_chrome:
    Image:
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_main_firefox:
    Image:
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_main_ie:
    Image:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Program Files\Internet Explorer\iexplore.exe'
  filter_main_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_main_edge_1:
  - Image|startswith: 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith: '\WindowsApps\MicrosoftEdge.exe'
  - Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  filter_main_edge_2:
    Image|startswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeCore\'
    - 'C:\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_main_opera:
    Image|endswith: '\opera.exe'
  filter_main_safari:
    Image|endswith: '\safari.exe'
  filter_main_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_main_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_main_whale:
    Image|endswith: '\whale.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate applications communicating with the Telegram API e.g. web browsers 
  not in the exclusion list, app with an RSS  etc.
level: medium
note: |
  ### Technical Context

  This rule detects non-browser processes attempting to interact with the Telegram API, which could indicate potential command-and-control (C2) activity or data exfiltration attempts. The likely attacker objective is to leverage Telegram's API for secure communications or to send stolen data, taking advantage of its end-to-end encryption and user-friendly interface. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1102) and Exfiltration Over C2 Channel (T1567).

  The primary telemetry source is Windows network connection logs, specifically looking for connections made to `api.telegram.org`. If malicious, this behavior poses a significant risk to the organization by potentially facilitating unauthorized data access and information leakage. Importantly, this detection does not confirm malicious action on its own, as legitimate applications may also contact the Telegram API.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to `api.telegram.org`. Validate if the process initiating the connection is non-browser (e.g., `myapp.exe` rather than `chrome.exe`).

  - **Identify the source process:** Examine the process name and path associated with the network connection. High-confidence malicious indicators include unusual or unauthorized applications initiating connections to the Telegram API, especially from non-standard directories.

  - **Investigate process parentage:** Use Sysmon Event ID 1 to trace the parent process. Legitimate processes will typically have system or user-initiated origins; suspicious processes may have unusual parentage indicating potential masquerading.

  - **Correlate with known behaviors:** Compare the findings with typical user behaviors in the environment. For instance, if there are no typical use cases for the application involved, this raises the risk of malicious activity.

  - **Monitor for data exfiltration:** Analyze any file operations around the time of the connection in Windows Event ID 4663. Look for unexpected file access operations involving sensitive data before the connection to the Telegram API.

  ### Prioritization

  This alert should be treated as medium severity due to its potential impact on sensitive data and command-and-control operations. Given that communication with Telegram can be leveraged for malicious purposes and is not widely utilized in common enterprise applications, it's crucial to evaluate such alerts carefully.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that authentically interact with the Telegram API, such as development tools or RSS readers. Ensuring comprehensive logging from all possible network connection sources is necessary for reliable detection. Additionally, be aware that established software or internal tools may trigger this alert under normal operating conditions. A companion detection rule targeting anomalous process creation (e.g., `Sysmon Event ID 1 related to suspicious execution patterns`) would strengthen overall coverage and response efforts.

