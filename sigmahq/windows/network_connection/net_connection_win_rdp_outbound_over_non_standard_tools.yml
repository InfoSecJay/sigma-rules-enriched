title: Outbound RDP Connections Over Non-Standard Tools
id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
status: test
description: |
  Detects Non-Standard tools initiating a connection over port 3389 indicating possible lateral movement.
  An initial baseline is required before using this utility to exclude third party RDP tooling that you might use.
references:
- https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2019-0708
author: Markus Neis
date: 2019-05-15
modified: 2024-02-09
tags:
- attack.lateral-movement
- attack.t1021.001
- car.2013-07-002
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort: 3389
    Initiated: 'true'
  filter_main_mstsc:
    Image:
    - 'C:\Windows\System32\mstsc.exe'
    - 'C:\Windows\SysWOW64\mstsc.exe'
  filter_optional_dns:
        # Note: https://github.com/SigmaHQ/sigma/pull/2249
    Image: 'C:\Windows\System32\dns.exe'
    SourcePort: 53
    Protocol: 'udp'
  filter_optional_avast:
    Image|endswith:
    - '\Avast Software\Avast\AvastSvc.exe'
    - '\Avast\AvastSvc.exe'
  filter_optional_sysinternals_rdcman:
    Image|endswith: '\RDCMan.exe'
  filter_optional_chrome:
    Image: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_third_party:
    Image|endswith:
    - '\FSAssessment.exe'
    - '\FSDiscovery.exe'
    - '\MobaRTE.exe'
    - '\mRemote.exe'
    - '\mRemoteNG.exe'
    - '\Passwordstate.exe'
    - '\RemoteDesktopManager.exe'
    - '\RemoteDesktopManager64.exe'
    - '\RemoteDesktopManagerFree.exe'
    - '\RSSensor.exe'
    - '\RTS2App.exe'
    - '\RTSApp.exe'
    - '\spiceworks-finder.exe'
    - '\Terminals.exe'
    - '\ws_TunnelService.exe'
  filter_optional_thor:
    Image|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  filter_optional_splunk:
    Image|startswith: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_optional_sentinel_one:
    Image|endswith: '\Ranger\SentinelRanger.exe'
  filter_optional_firefox:
    Image: 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_tsplus:    # Some RAS
    Image:
    - 'C:\Program Files\TSplus\Java\bin\HTML5service.exe'
    - 'C:\Program Files (x86)\TSplus\Java\bin\HTML5service.exe'
  filter_optional_null:
    Image:
  filter_optional_empty:
    Image: ''
  filter_optional_unknown:
    Image: '<unknown process>'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Third party RDP tools
level: high
regression_tests_path: 
  regression_data/rules/windows/network_connection/net_connection_win_rdp_outbound_over_non_standard_tools/info.yml
note: |
  ### Technical Context

  This Sigma rule detects outbound Remote Desktop Protocol (RDP) connections initiated by non-standard tools on port 3389. The likely attacker objective is to conduct lateral movement within the network by connecting to an internal machine using unauthorized methods. This behavior aligns with the MITRE ATT&CK technique for Remote Services: RDP (T1021.001).

  The primary telemetry source for this detection includes network connection logs, specifically identifying the initiated outbound connections on port 3389 across Windows hosts. If detected as malicious, this behavior can indicate potential compromise or unauthorized access attempts. However, it is crucial to note that this detection does NOT confirm an attack or compromise on its own; legitimate administrative tasks might also generate similar outbound RDP traffic.

  ### Investigation Steps

  - **Review connection logs for unusual outbound activity**: Check network connection logs (Event ID 5156 for Windows Firewall) for outbound connections to port 3389 from hosts that typically do not utilize RDP connections.

  - **Identify the process initiating the connection**: Examine the `Image` field in the network connection logs to verify if the process is a known RDP client (e.g., `mstsc.exe`). Benign connections should show standard processes, while deviations may indicate potential malicious activity.

  - **Check for historical baseline**: Compare current event data with previous records of RDP connections from the targeted host. A sudden spike in non-standard RDP usage could signal possible lateral movement executed by an attacker.

  - **Validate against third-party RDP tools**: Investigate connections initiated by known third-party RDP clients (e.g., `MobaRTE.exe`, `RemoteDesktopManager.exe`). Confirm whether this software is authorized for use in the environment.

  - **Identify failed authentication attempts**: Review security logs (Event ID 4625) to identify any failed RDP login attempts from accounts that may corroborate a malicious lateral movement attempt.

  - **Monitor for file creation or modifications**: If applicable, look for file IO events associated with suspicious processes creating or modifying files (e.g., through Sysmon Event ID 11) to assess whether files were staged for potential data exfiltration after RDP access.

  ### Prioritization

  This alert should be treated with high severity. The impact on affected systems could be significant due to unauthorized access, especially if critical internal systems are targeted. The likelihood of malicious abuse is elevated, given the inherent risks associated with RDP access, which is frequently exploited in lateral movement tactics.

  ### Blind Spots and Assumptions

  There are limitations in detection if legitimate third-party RDP tools are not baseline-excluded, as these can trigger the same alerts and potentially lead to false positives. Required sources for reliable detection include complete Windows event logs and firewall connectivity logs. Legitimate administrative activities, such as IT personnel using non-standard RDP tools for troubleshooting, may trigger this alert. Related detections that strengthen coverage include monitoring for new user logins on high-value systems (Event ID 4672) across the network.

