title: Outbound RDP Connections Over Non-Standard Tools
id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
status: test
description: |
  Detects Non-Standard tools initiating a connection over port 3389 indicating possible lateral movement.
  An initial baseline is required before using this utility to exclude third party RDP tooling that you might use.
references:
- https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2019-0708
author: Markus Neis
date: 2019-05-15
modified: 2024-02-09
tags:
- attack.lateral-movement
- attack.t1021.001
- car.2013-07-002
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort: 3389
    Initiated: 'true'
  filter_main_mstsc:
    Image:
    - 'C:\Windows\System32\mstsc.exe'
    - 'C:\Windows\SysWOW64\mstsc.exe'
  filter_optional_dns:
        # Note: https://github.com/SigmaHQ/sigma/pull/2249
    Image: 'C:\Windows\System32\dns.exe'
    SourcePort: 53
    Protocol: 'udp'
  filter_optional_avast:
    Image|endswith:
    - '\Avast Software\Avast\AvastSvc.exe'
    - '\Avast\AvastSvc.exe'
  filter_optional_sysinternals_rdcman:
    Image|endswith: '\RDCMan.exe'
  filter_optional_chrome:
    Image: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_third_party:
    Image|endswith:
    - '\FSAssessment.exe'
    - '\FSDiscovery.exe'
    - '\MobaRTE.exe'
    - '\mRemote.exe'
    - '\mRemoteNG.exe'
    - '\Passwordstate.exe'
    - '\RemoteDesktopManager.exe'
    - '\RemoteDesktopManager64.exe'
    - '\RemoteDesktopManagerFree.exe'
    - '\RSSensor.exe'
    - '\RTS2App.exe'
    - '\RTSApp.exe'
    - '\spiceworks-finder.exe'
    - '\Terminals.exe'
    - '\ws_TunnelService.exe'
  filter_optional_thor:
    Image|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  filter_optional_splunk:
    Image|startswith: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_optional_sentinel_one:
    Image|endswith: '\Ranger\SentinelRanger.exe'
  filter_optional_firefox:
    Image: 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_tsplus:    # Some RAS
    Image:
    - 'C:\Program Files\TSplus\Java\bin\HTML5service.exe'
    - 'C:\Program Files (x86)\TSplus\Java\bin\HTML5service.exe'
  filter_optional_null:
    Image:
  filter_optional_empty:
    Image: ''
  filter_optional_unknown:
    Image: '<unknown process>'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Third party RDP tools
level: high
note: |
  ### Technical Context
  This detection rule identifies potential lateral movement activity by looking for outbound Remote Desktop Protocol (RDP) connections initiated by non-standard tools over port 3389. Standard RDP connections typically utilize `mstsc.exe`, the Microsoft Terminal Services Client. Anomalies in RDP connections, particularly from atypical executables, can signify unauthorized access attempts or breaches aimed at moving within the enterprise network to compromise additional systems.

  The primary threat scenario relates to attackers using non-standard RDP clients as a method to spawn RDP sessions. The objectives may range from unauthorized access to critical systems, data exfiltration, or even deploying further malware within the environment. Such behavior corresponds to the MITRE ATT&CK tactics of Lateral Movement (TA0008) and specifically the technique of Remote Desktop Protocol (T1021.001).

  For effective detection, the rule leverages telemetry from network connection logs, enabling the identification of unusual outbound connections on TCP port 3389 that are not initiated by the known legitimate processes.

  ### Investigation Steps
  - **Review Network Logs**: Analyze outbound connection logs for any traffic on TCP port 3389 from hosts and note the source IPs, timestamps, and associated process information. Cross-reference with known legitimate RDP tools to identify anomalies.

  - **Inspect Process Activity**: Check process creation logs to see which applications initiated these RDP connections. Look for any entries not matching the known good executables listed in the detection rule.

  - **Analyze User Behavior**: Gather user activity reports to determine if the individuals associated with the outbound connections had previously established patterns of use with RDP. Look for unscheduled connections or connections made at odd hours.

  - **Validate Endpoint Security**: Ensure endpoint monitoring tools and antivirus solutions are correctly configured and up-to-date to catch these types of activities. Discrepancies in security software signatures or configurations could indicate potential gaps in protection.

  ### Prioritization
  The severity of this alert is categorized as high due to the potential impact of unauthorized lateral movement in the enterprise environment. The likelihood of exploitation is further heightened by the use of non-standard tools, which may evade traditional security measures.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if third-party RDP tools are prevalent in the organization and not included in the filter logic. The assumption here is that users operate only sanctioned applications for RDP connections, which may not hold true. Additionally, accurate detection depends on the availability of robust logging configurations that capture all outbound network connections on the relevant ports.

