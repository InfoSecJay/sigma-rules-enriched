title: Outbound RDP Connections Over Non-Standard Tools
id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
status: test
description: |
  Detects Non-Standard tools initiating a connection over port 3389 indicating possible lateral movement.
  An initial baseline is required before using this utility to exclude third party RDP tooling that you might use.
references:
- https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2019-0708
author: Markus Neis
date: 2019-05-15
modified: 2024-02-09
tags:
- attack.lateral-movement
- attack.t1021.001
- car.2013-07-002
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort: 3389
    Initiated: 'true'
  filter_main_mstsc:
    Image:
    - 'C:\Windows\System32\mstsc.exe'
    - 'C:\Windows\SysWOW64\mstsc.exe'
  filter_optional_dns:
        # Note: https://github.com/SigmaHQ/sigma/pull/2249
    Image: 'C:\Windows\System32\dns.exe'
    SourcePort: 53
    Protocol: 'udp'
  filter_optional_avast:
    Image|endswith:
    - '\Avast Software\Avast\AvastSvc.exe'
    - '\Avast\AvastSvc.exe'
  filter_optional_sysinternals_rdcman:
    Image|endswith: '\RDCMan.exe'
  filter_optional_chrome:
    Image: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_third_party:
    Image|endswith:
    - '\FSAssessment.exe'
    - '\FSDiscovery.exe'
    - '\MobaRTE.exe'
    - '\mRemote.exe'
    - '\mRemoteNG.exe'
    - '\Passwordstate.exe'
    - '\RemoteDesktopManager.exe'
    - '\RemoteDesktopManager64.exe'
    - '\RemoteDesktopManagerFree.exe'
    - '\RSSensor.exe'
    - '\RTS2App.exe'
    - '\RTSApp.exe'
    - '\spiceworks-finder.exe'
    - '\Terminals.exe'
    - '\ws_TunnelService.exe'
  filter_optional_thor:
    Image|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  filter_optional_splunk:
    Image|startswith: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_optional_sentinel_one:
    Image|endswith: '\Ranger\SentinelRanger.exe'
  filter_optional_firefox:
    Image: 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_tsplus:    # Some RAS
    Image:
    - 'C:\Program Files\TSplus\Java\bin\HTML5service.exe'
    - 'C:\Program Files (x86)\TSplus\Java\bin\HTML5service.exe'
  filter_optional_null:
    Image:
  filter_optional_empty:
    Image: ''
  filter_optional_unknown:
    Image: '<unknown process>'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Third party RDP tools
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where non-standard tools are initiating outbound connections over the RDP (Remote Desktop Protocol) default port 3389, potentially indicating lateral movement within the network. The likely attacker objective could be to gain unauthorized access to a remote machine, facilitating further exploration or compromise of the environment. The relevant MITRE ATT&CK technique here is Lateral Movement (T1021.001).

  Primary telemetry sources include Windows network connection logs able to capture outbound RDP sessions (DestinationPort 3389) and corresponding images of processes initiating these connections. If successful, this behavior poses a significant security risk, as it suggests possible internal reconnaissance or exploitation. It's important to note that this detection does NOT confirm malicious activity on its own, as legitimate non-standard RDP tools may also trigger the alert.

  ### Investigation Steps

  - **Review outbound connection logs:** Check Windows Event ID 5156 or corresponding firewall logs for connections on DestinationPort 3389. Identify the Source IP and the executing process. Malicious indicators would include processes not on the approved list.

  - **Validate the executing application:** Cross-reference the `Image` field of the connection attempt with known non-standard RDP applications. Confirm if the process initiating the connection is a recognized and legitimate application (e.g., mestsc.exe, valid third-party tools). If the image is not recognized, suspect potential malicious activity.

  - **Investigate active sessions:** Look for concurrent or prior connections by the same Source IP in the organization's logs to determine if this port has been consistently used by unauthorized applications. Multiple unique connections may indicate possible lateral movement.

  - **Confirm baseline for legitimate activities:** Identify standard applications used in your organization for RDP access. These may include approved third-party tools that should be documented. Ensure those processes are whitelisted in your security controls.

  - **Examine alert context:** Analyze timestamps and source/destination pairings to uncover patterns. Frequent attempts from one source to various hosts or multiple attempts over a short timeframe may signify an attack path.

  - **Assess for known evasion techniques:** Determine if the behavior aligns with previous evasion tactics used by adversaries, such as using tunneling methods or legitimate software misuses (e.g., applications not commonly associated with RDP).

  ### Prioritization

  This alert has a high severity, as it can indicate potential lateral movement within a critical system or network segment. The likelihood of malicious abuse is significant, especially if the Source IP corresponds with untrusted or unusual traffic patterns. Non-standard RDP connections are commonly exploited in attacks, increasing the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection can be limited by the use of legitimate RDP applications that may trigger false positives, thus necessitating a carefully maintained whitelist. It’s crucial to ensure that logging configurations are comprehensive, particularly around network events. Legitimate activities may include authorized personnel using company-standard remote access tools. A related detection that can strengthen coverage includes a log of failed RDP login attempts (e.g., Security Event ID 4625), providing context around reconnaissance or brute-force attempts.

