title: Outbound RDP Connections Over Non-Standard Tools
id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
status: test
description: |
  Detects Non-Standard tools initiating a connection over port 3389 indicating possible lateral movement.
  An initial baseline is required before using this utility to exclude third party RDP tooling that you might use.
references:
- https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2019-0708
author: Markus Neis
date: 2019-05-15
modified: 2024-02-09
tags:
- attack.lateral-movement
- attack.t1021.001
- car.2013-07-002
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort: 3389
    Initiated: 'true'
  filter_main_mstsc:
    Image:
    - 'C:\Windows\System32\mstsc.exe'
    - 'C:\Windows\SysWOW64\mstsc.exe'
  filter_optional_dns:
        # Note: https://github.com/SigmaHQ/sigma/pull/2249
    Image: 'C:\Windows\System32\dns.exe'
    SourcePort: 53
    Protocol: 'udp'
  filter_optional_avast:
    Image|endswith:
    - '\Avast Software\Avast\AvastSvc.exe'
    - '\Avast\AvastSvc.exe'
  filter_optional_sysinternals_rdcman:
    Image|endswith: '\RDCMan.exe'
  filter_optional_chrome:
    Image: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_third_party:
    Image|endswith:
    - '\FSAssessment.exe'
    - '\FSDiscovery.exe'
    - '\MobaRTE.exe'
    - '\mRemote.exe'
    - '\mRemoteNG.exe'
    - '\Passwordstate.exe'
    - '\RemoteDesktopManager.exe'
    - '\RemoteDesktopManager64.exe'
    - '\RemoteDesktopManagerFree.exe'
    - '\RSSensor.exe'
    - '\RTS2App.exe'
    - '\RTSApp.exe'
    - '\spiceworks-finder.exe'
    - '\Terminals.exe'
    - '\ws_TunnelService.exe'
  filter_optional_thor:
    Image|endswith:
    - '\thor.exe'
    - '\thor64.exe'
  filter_optional_splunk:
    Image|startswith: 'C:\Program Files\SplunkUniversalForwarder\bin\'
  filter_optional_sentinel_one:
    Image|endswith: '\Ranger\SentinelRanger.exe'
  filter_optional_firefox:
    Image: 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_tsplus:    # Some RAS
    Image:
    - 'C:\Program Files\TSplus\Java\bin\HTML5service.exe'
    - 'C:\Program Files (x86)\TSplus\Java\bin\HTML5service.exe'
  filter_optional_null:
    Image:
  filter_optional_empty:
    Image: ''
  filter_optional_unknown:
    Image: '<unknown process>'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Third party RDP tools
level: high
note: |
  ---

  ### Technical Context

  This rule detects outbound Remote Desktop Protocol (RDP) connections initiated by non-standard tools on port 3389, which is typically associated with potential lateral movement within a network. Attackers may seek to exploit RDP to gain unauthorized access to systems, move laterally across the environment, and establish persistence. This behavior aligns with the MITRE ATT&CK tactic of Lateral Movement (TA0008) and specifically targets the technique of Remote Desktop Protocol (T1021.001).

  Primary telemetry sources include network connection logs on Windows systems, specifically looking for connections on port 3389. The security impact of this detection is significant; if malicious, it could indicate the successful movement of an attacker within the network, potentially leading to data exfiltration or further compromise. Importantly, this detection does not confirm malicious intent on its own, as legitimate uses of non-standard RDP tools may exist.

  ---

  ### Investigation Steps

  - **Review outbound connections on port 3389**: Inspect network connection logs (Windows Event ID 5156) for processes initiated that are not whitelisted by the Sigma rule. Focus on connections that match the selection criteria but do not belong to standard RDP tools like `mstsc.exe`.

  - **Identify process details**: For suspicious connections, extract process information including the Image field, Process ID, User, and Parent Process information from Sysmon Event ID 1 (Process Creation) to understand the context of the executed command.

  - **Validate legitimate alternative usage**: Review prior established baselines for RDP usage within the organization. Confirm if any internal third-party tools like `RemoteDesktopManager` or `mRemoteNG` are accounted for, as these may trigger the alert without being malicious.

  - **Assess the asset criticality**: Determine the role of the affected system within your environment. If the alert pertains to critical servers or systems that should not utilize non-standard RDP tools, prioritize follow-up investigation.

  - **Investigate unusually high frequency of connections**: Analyze traffic patterns over time. Malicious indicators may include repeated attempts from the same source IP to establish RDP connections within short time frames.

  - **Correlate with endpoint protection logs**: If present, cross-reference alerts from endpoint protection solutions (e.g., EDR logs) that detect known exploit methodologies or lateral movement behaviors occurring alongside the outbound RDP connections.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant impact on the affected systems, especially when considering unmonitored lateral movement behaviors. The likelihood of abuse is also elevated, as attackers frequently exploit RDP during breaches. This behavior is notably weaponized in various attack frameworks.

  ---

  ### Blind Spots and Assumptions

  Benign uses of non-standard RDP tools may trigger this alert, leading to false positives. Evasion techniques could include altering common RDP client binaries or using encrypted tunnels to mask traffic. To enhance detection reliability, ensure network logging for all system connections is enabled, covering both standard and non-standard tools. A related detection to strengthen coverage would be monitoring anomalous authentication events, correlating failed logins or user account usage alongside outgoing RDP connection attempts.

