note: |
  ### Technical Context

  This Sigma rule detects network connections initiated by processes running from suspicious or uncommon file system locations, such as temporary folders or system folders that are not typically used for executable files. The likely attacker objective is to establish command and control (C2) channels or exfiltrate data using tools that are executed from these non-standard locations, which may be indicative of malware or unauthorized applications. Relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Execution (T1203).

  The primary telemetry source is network connection logs on Windows systems, specifically looking for Event IDs related to process creation and network initiation. The security impact can be significant if malicious; processes utilizing unusual folder paths may evade traditional security measures, indicating potential compromise. Importantly, this detection does NOT confirm malicious activity on its own, as benign applications may also originate connections from these paths under certain circumstances.

  ### Investigation Steps

  - **Review Process Creation Events:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 to identify the process that initiated the connection. Validate the command line and parent process to see if they align with known benign applications.

  - **Identify Network Connection Details:** Examine network logs for Event ID 5156 or relevant Sysmon network events to identify the destination IP and port, as well as the user account under which the process is running. Look for any high-risk connections to known malicious domains not appearing in the filter (DNS resolution).

  - **Correlate with Known Bad Indicators:** Cross-reference any detected IP addresses or domain names against threat intelligence feeds to establish if they are associated with malicious activity. High-confidence indicators would include connections to domains known for malware distribution.

  - **Examine the File Path and Source:** Verify the file path of the initiating process. Legitimate applications generally reside in standard folders such as "C:\Program Files\" or "C:\Windows\". Any execution from paths like "C:\Users\Public\" or "C:\Temp\" should raise suspicion.

  - **Assess Impact on Critical Assets:** If the process is running on critical infrastructure or servers, prioritize investigation due to potential impacts. Consider whether additional security controls (like application whitelisting) are in place on these systems.

  - **Check for Supporting Artifacts:** Investigate for any created or modified executables, scripts, or temporary files associated with the detected network connection. This includes validating the presence of files in unusual locations such as "C:\$Recycle.bin\" or "C:\Windows\addins\".

  ### Prioritization

  This alert should be considered high priority due to the likelihood of malicious abuse given the nature of the locations from which processes are running. Connections from uncommon locations can indicate an immediate threat if tied to a compromised system or software deployment. The technique is often weaponized in real-world attacks, emphasizing the need for rapid response.

  ### Blind Spots and Assumptions

  Detection limitations may arise from processes that employ disguise techniques or legitimate software executing in non-standard locations. Required log sources include both network connection logs and event logs for process creation; without these, detection could be incomplete. Common legitimate activities, such as authorized automated scripts running from temp directories, could also trigger alerts. A related detection rule addressing parent-child process correlation can enhance coverage and reduce false positives.

