title: Network Connection Initiated From Process Located In Potentially Suspicious
  Or Uncommon Location
id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
status: test
description: |
  Detects a network connection initiated by programs or processes running from suspicious or uncommon files system locations.
references:
- https://docs.google.com/spreadsheets/d/17pSTDNpa0sf6pHeRhusvWG6rThciE8CsXTSlDUAZDyo
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2017-03-19
modified: 2025-12-10
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    Image|contains:
    - ':\$Recycle.bin'
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Users\Public\'
    - ':\Windows\Fonts\'
    - ':\Windows\IME\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - '\config\systemprofile\'
    - '\Contacts\'
    - '\Favorites\'
    - '\Favourites\'
    - '\Music\'
    - '\Pictures\'
    - '\Videos\'
    - '\Windows\addins\'
  filter_main_domains:
        # Note: We exclude these domains to avoid duplicate filtering from e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
    DestinationHostname|endswith:
    - '.githubusercontent.com'               # Includes both gists and github repositories / Michael Haag (idea)
    - 'anonfiles.com'
    - 'cdn.discordapp.com'
    - 'ddns.net'
    - 'dl.dropboxusercontent.com'
    - 'ghostbin.co'
    - 'github.com'
    - 'glitch.me'
    - 'gofile.io'
    - 'hastebin.com'
    - 'mediafire.com'
    - 'mega.co.nz'
    - 'mega.nz'
    - 'onrender.com'
    - 'pages.dev'
    - 'paste.ee'
    - 'pastebin.com'
    - 'pastebin.pl'
    - 'pastetext.net'
    - 'portmap.io'          # https://pro.twitter.com/JaromirHorejsi/status/1795001037746761892/photo/2
    - 'privatlab.com'
    - 'privatlab.net'
    - 'send.exploit.in'
    - 'sendspace.com'
    - 'storage.googleapis.com'
    - 'storjshare.io'
    - 'supabase.co'
    - 'temp.sh'
    - 'transfer.sh'
    - 'trycloudflare.com'
    - 'ufile.io'
    - 'w3spaces.com'
    - 'workers.dev'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies network connections initiated by processes operating from locations that are often associated with suspicious activities or the hiding of malware. These locations, such as the Windows Recycle Bin, temporary files directories, or user profile folders, are typically not designated for legitimate application execution. Attackers often utilize unconventional file paths to evade detection, making this rule crucial for uncovering potential malicious behavior.

  In terms of threat scenarios, this rule can indicate various attacker objectives, including command and control (C2) communication, data exfiltration, or lateral movement within the network. Attackers sometimes leverage benign-looking files executed from unusual locations to mask their actions, allowing them to blend in with normal system operations.

  The relevant MITRE ATT&CK tactics for this detection include **Command and Control (TA0011)**, representing the attackers' efforts to maintain communication with compromised systems, utilizing techniques such as **Application Layer Protocol (T1071)**. The primary data sources for this detection will be logs from network connections, particularly focusing on process creation events that detail where executables are running from and established outbound network connections.

  ### Investigation Steps
  - **Review Recent Network Connections:** Investigate recent network connection logs that triggered this alert, paying close attention to the originating processes and their execution paths to determine if they originate from suspicious locations.

  - **Analyze Process Creation Logs:** Examine process creation events to correlate with the network connections. Identify any unusual command line arguments or parent-child process relationships indicative of suspicious behavior.

  - **Inspect File Path Locations:** Verify the legitimacy of the file paths indicated in the alert. Investigate the context and purpose of files running from locations commonly associated with irregular activities, such as `\Temp\` or `\$Recycle.bin`.

  - **Check Domain Reputation:** For connections to domains flagged by the alert (e.g., `pastebin.com` or `githubusercontent.com`), perform a domain reputation check to assess if they are linked to known malicious activities or tools that could suggest data exfiltration or C2 infrastructure.

  ### Prioritization
  This alert is categorized as high severity because the detection of network connections from unusual file locations is often indicative of malicious activity. The potential for data loss or unauthorized access is significant, warranting immediate investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly concerning environments where logging for process execution and network connections may not be adequately configured. The detection logic assumes that malicious processes will run from identifiable uncommon locations, which may not always be the case if attackers use techniques to obfuscate their presence. Additionally, the alert's effectiveness relies on comprehensive logging across the network and endpoint systems, aligning SIEM, EDR, and other security tools to capture and forward the relevant events for analysis.

