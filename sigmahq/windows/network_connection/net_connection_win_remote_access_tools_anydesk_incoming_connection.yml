level: medium
note: |
  ### Technical Context

  This rule detects incoming network connections to AnyDesk, a remote access tool, which may indicate unauthorized remote access attempts by an adversary. The primary attacker objective is to establish a foothold for remote control over the compromised system, potentially facilitating further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for using Remote Access Tools (T1219) and its sub-technique T1219.002.

  The primary telemetry sources are Windows network connection logs, specifically tracking process execution for AnyDesk. The security impact of this activity can be severe, as it allows an attacker to manipulate the system as if they were physically present. It is crucial to understand that this detection alone does not confirm malicious intent; legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Check process initiation**: Review network connection logs for Event ID 5156 (Windows Filtering Platform) to confirm that connections were initiated with AnyDesk.exe or AnyDeskMSI.exe and verify that the "Initiated" field is set to 'false'.

  - **Assess user context**: Identify the user account associated with the incoming connection by examining fields in the network connection logs. Legitimate accounts performing scheduled maintenance should match expected patterns, whereas unknown or high-privilege users may indicate illicit activity.

  - **Inspect connection details**: Analyze the remote IP address attempting to connect to AnyDesk. Compare it against a list of known safe administrative IPs within your environment; connections from addresses not fitting the established profile should be treated as suspicious.

  - **Evaluate additional processes**: Utilize Sysmon Event ID 1 to monitor if AnyDesk is being executed concurrently with other suspicious behavioral indicators (e.g., unusual command line arguments or known malicious processes).

  - **Identify retention of artifacts**: Validate if AnyDesk created or modified service entries in Windows; check for logs pertaining to service file creation or alteration that suggests unauthorized installations or configurations.

  ### Prioritization

  This alert is medium severity due to the potential for significant security breaches via remote access. The risk is amplified if the affected system houses sensitive data or critical applications. Given the ease with which remote access tools can be weaponized, analysts should prioritize this investigation particularly on endpoints with elevated user privileges.

  ### Blind Spots and Assumptions

  Detection limitations include adversaries using encrypted connections or obfuscating their use of legitimate tools, making the incoming connections harder to identify. Accurate detection requires enabling relevant Windows Filtering Platform (WFP) logging configurations. Legitimate remote access by system administrators can also trigger this alert, highlighting the need for thorough contextual verification. A related detection for enhanced coverage would be monitoring for outgoing connections from AnyDesk, ensuring both incoming and outgoing activities are scrutinized effectively.

