note: |
  ### Technical Context

  The rule detects network connections initiated by the "AddInUtil.exe" process, which is typically a benign utility for managing Microsoft Office add-ins. An attacker might leverage this utility as a living-off-the-land binary (LOLBin) to communicate with command and control servers, often bypassing traditional defenses by masquerading as legitimate application behavior. This aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1203).

  The primary telemetry source for this detection is network connection logs that capture process-level events. Relevant log types include Windows Event ID 4688 (process creation) and network traffic logs showing outbound connections. A malicious use of AddInUtil.exe could potentially allow an adversary to maintain persistence and control over compromised networks. However, this detection alone does not confirm that the activity is malicious; further context and behavior analysis are required.

  ### Investigation Steps

  - **Review the process origin:** Confirm the path of "AddInUtil.exe". Verify it should exist in C:\Program Files\Microsoft Office\root\OfficeXX\ (replace XX with the relevant Office version). Any instances outside of this location are suspicious.

  - **Check the destination IP address:** Investigate the external IP contact associated with the connection. Use threat intelligence to identify if the destination is known for malicious activity or fits typical benign domains related to Microsoft services.

  - **Cross-reference user context:** Examine the user account associated with the process. Anomalous user accounts initiating this process (like service accounts or guests) may suggest compromise.

  - **Assess network logs:** Look for any other unusual outbound connections in the same timeframe. Use log types such as Firewall logs (Event ID 5156) or Proxy logs to identify patterns against legitimate activity, such as frequent connections to similar IPs by other processes.

  - **Validate expected behavior:** Confirm that the execution of "AddInUtil.exe" aligns with normal business processes, such as scheduled updates or user-driven configurations for add-ins. If no legitimate updates are scheduled, this could indicate abuse.

  ### Prioritization

  This alert warrants high severity due to the potential for widespread impact across affected systems if exploited. The likelihood of adversaries abusing legitimate tools like AddInUtil.exe for command and control operations is well-established, making this behavior a high priority for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where AddInUtil.exe genuinely executes legitimate updates, which could trigger false positives. To ensure reliable detection, the appropriate logging for process execution and outbound network connections must be enabled. Other legitimate activities, such as routine Microsoft Office updates or network scans by authorized tools, may trigger this alert. Companion detections such as abnormal process behaviors or outbound connections to non-typical ports may enhance the analysis.

