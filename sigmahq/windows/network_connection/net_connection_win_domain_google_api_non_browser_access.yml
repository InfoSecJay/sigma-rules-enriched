title: Suspicious Non-Browser Network Communication With Google API
id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
status: experimental
description: |
  Detects a non-browser process interacting with the Google API which could indicate the use of a covert C2 such as Google Sheet C2 (GC2-sheet)
references:
- https://github.com/looCiprian/GC2-sheet
- https://youtu.be/n2dFlSaBBKo
- https://services.google.com/fh/files/blogs/gcat_threathorizons_full_apr2023.pdf
- https://www.tanium.com/blog/apt41-deploys-google-gc2-for-attacks-cyber-threat-intelligence-roundup/
- https://www.bleepingcomputer.com/news/security/hackers-abuse-google-command-and-control-red-team-tool-in-attacks/
author: Gavin Knapp
date: 2023-05-01
modified: 2025-02-22
tags:
- attack.command-and-control
- attack.t1102
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationHostname|contains:
            # Note: Please add additional google API related domains that might be abused.
    - 'drive.googleapis.com'
    - 'oauth2.googleapis.com'
    - 'sheets.googleapis.com'
    - 'www.googleapis.com'
  filter_optional_brave:
    Image|endswith: '\brave.exe'
  filter_optional_chrome:
    Image|endswith:
    - ':\Program Files\Google\Chrome\Application\chrome.exe'
    - ':\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_optional_google_drive:
    Image|contains: ':\Program Files\Google\Drive File Stream\'
    Image|endswith: '\GoogleDriveFS.exe'
  filter_optional_firefox:
    Image|endswith:
    - ':\Program Files\Mozilla Firefox\firefox.exe'
    - ':\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_optional_ie:
    Image|endswith:
    - ':\Program Files (x86)\Internet Explorer\iexplore.exe'
    - ':\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_optional_edge_1:
  - Image|contains: ':\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith:
    - ':\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - ':\Program Files\Microsoft\Edge\Application\msedge.exe'
    - '\WindowsApps\MicrosoftEdge.exe'
  filter_optional_edge_2:
    Image|contains:
    - ':\Program Files (x86)\Microsoft\EdgeCore\'
    - ':\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_opera:
    Image|endswith: '\opera.exe'
  filter_optional_safari:
    Image|endswith: '\safari.exe'
  filter_optional_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_optional_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_optional_whale:
    Image|endswith: '\whale.exe'
  filter_optional_googleupdate:
    Image|endswith: '\GoogleUpdate.exe'
  filter_optional_outlook_exe:
    Image|endswith: '\outlook.exe'
  filter_main_null:
    Image:
  filter_main_empty:
    Image: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate applications communicating with the "googleapis.com" endpoints that are
  not already in the exclusion list. This is environmental dependent and requires
  further testing and tuning.
level: medium
note: |
  ### Technical Context
  This rule detects suspicious network communications originating from non-browser processes that interact with Google API endpoints, specifically targeting services such as Google Drive and Google Sheets. Such behavior may indicate the use of covert command-and-control (C2) mechanisms, where attackers leverage Google’s infrastructure to conceal malicious activities. One prominent example is the Google C2 (GC2-sheet) method, where threat actors utilize Google Sheets as a remote control panel to issue commands and receive exfiltrated data.

  The potential threat scenario involves attackers employing these non-browser processes to execute unauthorized commands or exfiltrate sensitive information while blending in with legitimate traffic patterns. This could lead to data breaches or ongoing access to compromised systems, posing significant risks to organizational integrity. Techniques that align with this behavior include Command and Control (T1102) within the MITRE ATT&CK framework, particularly leveraging Google APIs as a means of external communication to avoid detection.

  To effectively identify this behavior, the primary data sources include network connection logs, which capture outbound traffic from all processes, highlighting any anomalies in communications with Google domains outside of standard browser usage.

  ### Investigation Steps
  - **Review Network Logs**: Analyze network connection logs for any outgoing requests to Google API endpoints (e.g., drive.googleapis.com, oauth2.googleapis.com) that originate from non-browser processes. Look for atypical patterns or unexpected processes initiating these connections.

  - **Identify Process Behavior**: Examine process execution logs to identify which non-browser applications are connecting to the Google APIs. Focus on applications not generally associated with web browsing, such as custom scripts, scheduled tasks, or less common software.

  - **Investigate Anomalous User Activity**: Evaluate user and system activities leading up to the detection. Investigate for any signs of privilege escalation or unauthorized access that might facilitate malicious network activity.

  - **Adjust Exclusion Lists**: Update exclusion lists continually to account for legitimate applications communicating with Google API endpoints based on contextual understanding. Ensure to document any legitimate activity to reduce false positives while maintaining vigilant monitoring.

  ### Prioritization
  This alert carries medium severity due to the potential for significant impacts like data loss or ongoing compromise through hidden C2 channels. The likelihood of such behavior, especially in organizations using cloud services, necessitates prompt investigation to mitigate risks associated with advanced persistent threats.

  ### Blind Spots and Assumptions
  Detection may be limited in environments where legitimate non-browser applications frequently communicate with Google API endpoints, leading to potential false positives. The detection logic assumes that such communications predominantly originate from browsers or well-known cloud applications. Additionally, comprehensive monitoring may require accurate configuration of network logs and filtering exclusions; without these, there may be gaps in detection for atypical yet legitimate network traffic.

