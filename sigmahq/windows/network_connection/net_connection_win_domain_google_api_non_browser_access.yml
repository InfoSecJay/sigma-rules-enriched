title: Suspicious Non-Browser Network Communication With Google API
id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
status: experimental
description: |
  Detects a non-browser process interacting with the Google API which could indicate the use of a covert C2 such as Google Sheet C2 (GC2-sheet)
references:
- https://github.com/looCiprian/GC2-sheet
- https://youtu.be/n2dFlSaBBKo
- https://services.google.com/fh/files/blogs/gcat_threathorizons_full_apr2023.pdf
- https://www.tanium.com/blog/apt41-deploys-google-gc2-for-attacks-cyber-threat-intelligence-roundup/
- https://www.bleepingcomputer.com/news/security/hackers-abuse-google-command-and-control-red-team-tool-in-attacks/
author: Gavin Knapp
date: 2023-05-01
modified: 2025-02-22
tags:
- attack.command-and-control
- attack.t1102
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationHostname|contains:
            # Note: Please add additional google API related domains that might be abused.
    - 'drive.googleapis.com'
    - 'oauth2.googleapis.com'
    - 'sheets.googleapis.com'
    - 'www.googleapis.com'
  filter_optional_brave:
    Image|endswith: '\brave.exe'
  filter_optional_chrome:
    Image|endswith:
    - ':\Program Files\Google\Chrome\Application\chrome.exe'
    - ':\Program Files (x86)\Google\Chrome\Application\chrome.exe'
  filter_optional_google_drive:
    Image|contains: ':\Program Files\Google\Drive File Stream\'
    Image|endswith: '\GoogleDriveFS.exe'
  filter_optional_firefox:
    Image|endswith:
    - ':\Program Files\Mozilla Firefox\firefox.exe'
    - ':\Program Files (x86)\Mozilla Firefox\firefox.exe'
  filter_optional_ie:
    Image|endswith:
    - ':\Program Files (x86)\Internet Explorer\iexplore.exe'
    - ':\Program Files\Internet Explorer\iexplore.exe'
  filter_optional_maxthon:
    Image|endswith: '\maxthon.exe'
  filter_optional_edge_1:
  - Image|contains: ':\Program Files (x86)\Microsoft\EdgeWebView\Application\'
  - Image|endswith:
    - ':\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - ':\Program Files\Microsoft\Edge\Application\msedge.exe'
    - '\WindowsApps\MicrosoftEdge.exe'
  filter_optional_edge_2:
    Image|contains:
    - ':\Program Files (x86)\Microsoft\EdgeCore\'
    - ':\Program Files\Microsoft\EdgeCore\'
    Image|endswith:
    - '\msedge.exe'
    - '\msedgewebview2.exe'
  filter_optional_opera:
    Image|endswith: '\opera.exe'
  filter_optional_safari:
    Image|endswith: '\safari.exe'
  filter_optional_seamonkey:
    Image|endswith: '\seamonkey.exe'
  filter_optional_vivaldi:
    Image|endswith: '\vivaldi.exe'
  filter_optional_whale:
    Image|endswith: '\whale.exe'
  filter_optional_googleupdate:
    Image|endswith: '\GoogleUpdate.exe'
  filter_optional_outlook_exe:
    Image|endswith: '\outlook.exe'
  filter_main_null:
    Image:
  filter_main_empty:
    Image: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate applications communicating with the "googleapis.com" endpoints that
  are not already in the exclusion list. This is environmental dependent and 
  requires further testing and tuning.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious network communications initiated by non-browser processes to Google API endpoints, suggesting potential abuse of Google services as a command and control (C2) mechanism (e.g., Google Sheets C2). The likely objective of an attacker employing this method is to evade traditional detection systems while maintaining communication with compromised systems. This behavior aligns with the MITRE ATT&CK framework, specifically under the tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1102). The primary telemetry source involves Windows event logs that capture network connection activities.

  If malicious, this detection could indicate an advanced threat actor leveraging seemingly legitimate services for nefarious purposes, allowing for data exfiltration or remote control of infected hosts. However, it is essential to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also interact with these APIs.

  ### Investigation Steps

  - **Confirm the application context**: Review the process that triggered the alert. Focus on the `Image` field in network connection logs (Event ID 5156) to determine what application initiated the connection.
  - **Identify malicious indicators**: Check for unusual connections using the Google API (.e.g, `drive.googleapis.com`, `sheets.googleapis.com`). Look for processes that do not match normal patterns (e.g., any process aside from common web browsers or legitimate apps).
  - **Validate benign activity**: For known good applications (like Google Drive or Sheets), confirm that they are registered and functioning as expected through standard operation logs. Ensure they match legitimate versions and locations (e.g., installed within their typical Program Files directory).
  - **Examine process creation events**: Analyze Security Event ID 4688 for process creation events to see if the associated process has a history of similar network activity or shows signs of suspicious behavior (e.g., executing after a recent file modification at odd hours).
  - **Cross-reference user behavior**: Review user activity logs or prompt interaction logs associated with the affected system to assess if normal user actions correlate with the detected event (e.g., accessing Google services during typical work hours).
  - **Check for rapid reconnections**: Monitor for repeated connections to multiple Google API endpoints in a short time frame, which could imply underlying malicious scripts automating these requests.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on data confidentiality and system integrity if exploited. The likelihood of malicious abuse is moderate; while Google services are common, misuse by threat actors leveraging these APIs for C2 is increasingly observed and weaponized.

  ### Blind Spots and Assumptions

  This detection may have limitations in identifying all legitimate applications that communicate with Google APIs, especially as new software emerges. Accurate detection relies on comprehensive logging configurations across endpoints to capture relevant events. Additionally, routine processes, such as scheduled backups or integrations with other tools, may trigger false positives. A companion detection to consider is monitoring webhook activity for suspicious patterns, which may provide complementary visibility into potential C2 channels.

