note: |
  ### Technical Context

  This rule detects uncommon outbound Kerberos network connections, specifically over the default port (88). Such activity may indicate a lateral movement attempt or privilege escalation via delegation, where an attacker impersonates another user in the network. The likely attacker objectives include accessing sensitive systems or data by leveraging stolen credentials or exploiting misconfigurations in Kerberos authentication.

  The relevant MITRE ATT&CK tactics include **Credential Access** (T1558) and **Lateral Movement** (T1550.003). Primary telemetry sources include Windows network connection logs, specifically focusing on outbound connections initiated by processes other than the protected lsass.exe and common web browsers. If malicious, this activity could enable an adversary to gain unauthorized access to other systems within the network. Importantly, while this detection indicates anomalous behavior, it does not confirm malicious activity on its own without further context.

  ### Investigation Steps

  - **Check outbound connections: **Review Windows network connection logs (e.g., Event ID 5156) for outbound attempts to port 88, specifically noting the source IP and process creating the connection.

  - **Identify unusual processes: **List processes initiating outbound connections on port 88. Look for processes other than lsass.exe or known benign applications (e.g., `C:\Windows\System32\lsass.exe`, `chrome.exe`, `firefox.exe`). Validate any unfamiliar executable names.

  - **Evaluate source system role: **Determine the role of the host making the outbound connection. Critical servers like domain controllers, application servers, or file shares should be scrutinized more closely. Analyze logs for connections that do not align with their expected behaviors.

  - **Correlate with user activity: **Review recent logins (Event ID 4624) and access logs that might explain user activity linked to the process making the outbound connection. Validate against known user access patterns.

  - **Investigate successful Kerberos authentication: **Review Kerberos ticket-granting ticket (TGT) requests in the Security logs (Event ID 4768) for the same time window as the outbound connection. Look for any anomalous ticket requests associated with compromised accounts.

  ### Prioritization

  The severity of this alert is medium-high due to the potential impact on the security of critical systems within the enterprise. Uncommon outbound Kerberos activity is a realistic indication of lateral movement attempts, which adversaries frequently employ. Systems targeted by such behavior often have sensitive data or administrative access, raising the importance of a thorough investigation.

  ### Blind Spots and Assumptions

  Detection of outbound Kerberos connections may be limited in environments with diverse applications using Kerberos for connectivity, necessitating a well-defined baseline of expected behaviors. If logging for critical applications is not configured correctly, it could lead to missed alerts. Legitimate user actions, such as authorized application communication during authentication or administrative tasks, may trigger this alert. A companion detection to consider is monitoring for unusual Kerberos authentication patterns (Event ID 4768) to enhance coverage during investigations.

