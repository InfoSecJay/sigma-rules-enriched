note: |
  ### Technical Context

  This Sigma rule detects outgoing network connections to the Kerberos default port (88) that are initiated by processes other than trusted system processes like `lsass.exe`, or common web browsers. It indicates potential lateral movement or privilege escalation activity. The likely attacker objective could involve using unauthorized Kerberos tickets to access system resources or credentials. This behavior maps to the MITRE ATT&CK tactic of Credential Access (T1558) and Lateral Movement (T1550.003).

  The primary telemetry source required is Windows network connection logs, focusing on outbound connections. If confirmed malicious, this activity could indicate an unauthorized attempt to exploit Kerberos authentication in an attempt to gain further access within the system. Importantly, this detection alone does not confirm that a compromise has occurred; further investigation is necessary to establish intent.

  ### Investigation Steps

  - **Check the outbound connection details**: Review Windows Event ID 5156 (Windows Filtering Platform) for anomalies, specifically looking for connections with DestinationPort 88. Identify the process and user initiating the connection.

  - **Query for recent Kerberos ticket activity**: Investigate Event ID 4769 (A Kerberos service ticket was requested) for recent service ticket requests associated with the same user or system. Benign ticket requests typically originate from `lsass.exe` and match known services.

  - **Validate process legitimacy**: Confirm that the initiating process is not one of the established Windows processes, such as `lsass.exe`, and verify that it is not a typical web browser (e.g., Chrome, Firefox). Unexpected executables could indicate a potential compromise.

  - **Assess other system behaviors**: Utilize Sysmon Event ID 1 (Process Creation) to look for other unusual processes spawning around the same time, focusing on those that exhibit atypical parent-child relationships or are initiated by unrecognized user accounts.

  - **Monitor for tool usage**: Investigate for potential use of tools like Rubeus, which is often leveraged for Kerberos ticket manipulation. Track file paths common to such tools and correlate against current processes.

  ### Prioritization

  This alert is of medium severity. The affected systems are typically integral within the enterprise environment, and lateral movement or exploitation of Kerberos tickets is a common tactic employed by adversaries. While this behavior can be indicative of malicious activity, legitimate processes can also trigger similar alerts, necessitating additional context for accurate prioritization.

  ### Blind Spots and Assumptions

  The detection may not capture sophisticated evasion techniques, such as an attacker using a compromised web browser to initiate Kerberos connections. Reliable coverage requires that network connection logs are properly configured and collected. Legitimate activities, such as authorized Kerberos ticket requests from service accounts, may inadvertently trigger alerts. Implementing companion detections for user behavior analysis, like anomalous logon attempts, can enhance visibility into potential malicious activity.

