falsepositives:
- You may have to tune certain domains out that Excel may call out to, such as microsoft
  or other business use case domains.
- Office documents commonly have templates that refer to external addresses, like
  "sharepoint.ourcompany.com" may have to be tuned.
- It is highly recommended to baseline your activity and tune out common business
  use cases.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects instances where Microsoft Office applications (Word, Excel, PowerPoint) establish network connections to non-private IP addresses. The primary behavior being flagged is potentially unauthorized data exfiltration or command-and-control (C2) communication that may result from exploiting vulnerabilities, like CVE-2021-42292. Attackers may utilize malicious Office documents to initiate outbound network connections for retrieving payloads or sending sensitive information to external servers.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002), specifically the technique **Malicious File** (T1203). Primary telemetry sources include network logs from firewalls or intrusion detection systems monitoring outbound connections. If confirmed malicious, this behavior can lead to data theft or system compromise, significantly impacting both data integrity and confidentiality. It is crucial to note that detection through this rule does NOT confirm that the connection was malicious on its own since legitimate business processes may trigger similar behavior.

  ---

  ### Investigation Steps

  - **Check recent network connections:** Review network connection logs for Event ID 5156 (Windows Filtering Platform) or equivalent logs that capture outbound connections initiated by Office applications (e.g., Excel, Word). Look for connections to non-local IP addresses away from the corporate network.

  - **Identify the process and user context:** Correlate this log with the user who initiated the connection by reviewing the Event ID 4688 (Process Creation). Ensure that the processes belong to authorized applications and are being run by expected user accounts.

  - **Review email activity:** Examine recent email activity for the user linked to the alert. Look for any malicious attachments or links that may have triggered the Office application execution. Use telemetry sources from Exchange logs or Security (Audit) logs.

  - **Confirm allowed domains:** Cross-reference the destination IPs against known safe domains (e.g., Microsoft updates, internal SharePoint sites). Identify any domain-specific traffic that is standard for business operations to help tune false positives.

  - **Validate network behavior:** Look for patterns aligning with known exploitation techniques, such as connections to suspicious IPs or domains (e.g., ending in '.deploy.static.akamaitechnologies.com') on standard ports like 80 and 443.

  - **Conduct a baseline review:** Establish a baseline of typical Office application behaviors in your environment to discern unusual traffic. Explore common legitimate use cases that have historically initiated similar connections for tuning purposes.

  ---

  ### Prioritization

  The alert severity is medium as it indicates potentially risky behavior with applications that have access to sensitive data. There is a likelihood of malicious exploitation, especially given the related vulnerability. However, this behavior can also be exhibited by legitimate applications connected to external resources, necessitating thorough investigation before escalation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss outbound connections if relevant log sources aren't collected or if local policy suppresses these events. Additionally, legitimate activities like automated updates and legitimate document sharing can trigger the alert. It's essential to tune the rule to filter out trusted domains frequently accessed by business applications. Related detections might include anomalous file access logs in conjunction with external connections to further strengthen coverage against data exfiltration.

  ---

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
