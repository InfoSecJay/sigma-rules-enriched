falsepositives:
- You may have to tune certain domains out that Excel may call out to, such as 
  microsoft or other business use case domains.
- Office documents commonly have templates that refer to external addresses, 
  like "sharepoint.ourcompany.com" may have to be tuned.
- It is highly recommended to baseline your activity and tune out common 
  business use cases.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where Microsoft Office applications (e.g., Word, Excel, PowerPoint) initiate network connections to non-local, non-private IP addresses, which can indicate suspicious or malicious behavior. The primary objective of an attacker in this scenario may be to exploit vulnerabilities within these applications to execute code, exfiltrate data, or achieve remote control over a compromised system, particularly as seen in exploits like CVE-2021-42292. This behavior aligns with the MITRE ATT&CK tactic of "Execution" (T1203) via user-assisted techniques.

  The primary telemetry sources include Windows network connection logs, specifically looking for Security Event ID 4656 or Sysmon Event ID 3, which detail network connections made by processes. If malicious, such activity could lead to significant data compromise or unauthorized access within the enterprise environment. However, it is crucial to note that this detection alone does not confirm malicious intent; legitimate applications may similarly initiate connections under normal circumstances.

  ### Investigation Steps

  - **Identify the initiating application:** Check for Event ID 4688 to identify which Office application (Word, Excel, etc.) initiated the network connection. Compare the process path to established baselines for legitimate activity.

  - **Review destination IP and port:** Examine the destination IP address and port against known legitimate ranges (e.g., Office 365 services). Connections to IP addresses outside the defined business ranges (like 127.0.0.0/8 or common Microsoft services) should raise suspicion.

  - **Examine process integrity:** Investigate the integrity of the application initiating the network connection through the file hash and digital signature, ensuring it is signed by Microsoft. Unsigned or modified versions could indicate tampering.

  - **Analyze the connection logs:** Utilize Windows Firewall logs (Event ID 5156) to cross-check the connection attempts and confirm if any unauthorized access or unusual traffic patterns emerge from the specific user/process involved.

  - **Evaluate baseline network behavior:** Compare the connection attempt against the established baseline for the specific user and application. Legitimate behavior often involves connections to internal resources or known business-related services, which should be distinguished from suspicious external requests.

  - **Verify user context:** Investigate the timing and user context surrounding the alert (Event ID 4624 for logins). If the user was engaged in typical business functions around the same time as the connection attempt, it could be considered benign.

  ### Prioritization

  This alert should be considered medium severity, primarily due to its potential impact on sensitive data and the likelihood of exploitation by adversaries leveraging Office application vulnerabilities. The method of utilizing Office applications for execution is commonly weaponized by attackers to facilitate credential theft and data exfiltration.

  ### Blind Spots and Assumptions

  Evasion techniques could include using legitimate Office templates or macros that initiate similar connections, making it necessary to closely tune detection rules based on legitimate business cases. Reliable detection requires comprehensive logging configurations, such as enabling Sysmon and ensuring that all network connections are properly logged. Legitimate activities like office applications accessing external resources (e.g., SharePoint or cloud document stores) may trigger similar alerts. Related detections, such as those monitoring abnormal macro executions in Office documents (T1203.001), should be implemented to strengthen overall security coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
