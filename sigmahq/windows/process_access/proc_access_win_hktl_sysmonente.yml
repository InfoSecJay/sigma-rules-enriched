logsource:
  category: process_access
  product: windows
detection:
  selection_sysmon:
    TargetImage|contains:
    - ':\Windows\Sysmon.exe'
    - ':\Windows\Sysmon64.exe'
    GrantedAccess: '0x1400'
  selection_calltrace:
    CallTrace: 'Ente'
  filter_main_generic:
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  filter_main_msdefender:
    SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender\Platform\'
    SourceImage|endswith: '\MsMpEng.exe'
  condition: ( selection_sysmon and not 1 of filter_main_* ) or 
    selection_calltrace
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of SysmonEnte, a tool designed to manipulate or disable Sysmon's logging capabilities. The likely attacker objective is to obfuscate their activities by impairing the integrity of logs generated by Sysmon, making it harder for security teams to detect malicious behaviors. This corresponds to the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and the technique "Modify Existing Service" (T1569.001).

  The primary telemetry sources necessary for this detection are Windows event logs, specifically focusing on process creation and access events, particularly Security Event ID 4688 (process creation) and Sysmon Event ID 1 (process creation). If malicious, the security impact can include undetected lateral movement, data exfiltration, or prolonged exposure to the network by threat actors. This detection does NOT confirm the success of the operation or that any actual malicious activity has occurred beyond the potential tampering of the Sysmon tool itself.

  ### Investigation Steps

  - **Check Process Creation Logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for any execution of `Sysmon.exe` or `Sysmon64.exe`. Look for the `GrantedAccess` field to be set to `0x1400`, which indicates access for `PROCESS_SET_INFORMATION` and `PROCESS_TERMINATE`.

  - **Analyze Caller Context**: Investigate the `CallTrace` field for any entries that contain 'Ente'. This indicates direct usage of the SysmonEnte tool, linking it to potential malicious activity.

  - **Identify Legitimate Software Behavior**: Compare the execution patterns with known legitimate use of Sysmon. Typical entries from system defenders or security administration tasks should not include `Ente` in the call trace or unusual access to Sysmon executable paths.

  - **Correlate with Other Security Events**: Identify any related events around the same timeframe, such as unusual logins (Event ID 4624) or changes in security settings (Event ID 4670). High-frequency changes associated with known user accounts could indicate automated attacks.

  - **Inspect Malicious Indicators**: Confirm the presence of `SysmonEnte` within the `SourceImage` field for processes originating from non-standard paths such as those outside of `C:\Program Files`, `C:\Windows\System32`, or their equivalents. These paths indicate potential unauthorized software execution.

  ### Prioritization

  This alert is considered high priority due to the potential impact on system integrity and the likelihood of its use by advanced adversaries to evade defenses. Malicious alterations to Sysmon can severely hinder an organization's ability to detect subsequent attacks, increasing the urgency for effective mitigation actions.

  ### Blind Spots and Assumptions

  This detection may have limitations as sophisticated adversaries can leverage similar legitimate binaries to execute their attacks or use obfuscation techniques—such as renaming executables. It assumes that necessary log sources, like Sysmon and appropriate Windows logging, are properly configured and actively collecting data. Legitimate administrative tasks or troubleshooting processes may occasionally trigger this alert if they accidentally interact with Sysmon's execution. A companion detection such as monitoring registry keys and system configurations related to Sysmon behavior can strengthen overall coverage against such evasion attempts.

