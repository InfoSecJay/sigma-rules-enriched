title: HackTool - SysmonEnte Execution
id: d29ada0f-af45-4f27-8f32-f7b77c3dbc4e
status: test
description: Detects the use of SysmonEnte, a tool to attack the integrity of 
  Sysmon
references:
- https://codewhitesec.blogspot.com/2022/09/attacks-on-sysmon-revisited-sysmonente.html
- https://github.com/codewhitesec/SysmonEnte/
- https://github.com/codewhitesec/SysmonEnte/blob/fe267690fcc799fbda15398243615a30451d9099/screens/1.png
author: Florian Roth (Nextron Systems)
date: 2022-09-07
modified: 2023-11-28
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: process_access
  product: windows
detection:
  selection_sysmon:
    TargetImage|contains:
    - ':\Windows\Sysmon.exe'
    - ':\Windows\Sysmon64.exe'
    GrantedAccess: '0x1400'
  selection_calltrace:
    CallTrace: 'Ente'
  filter_main_generic:
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  filter_main_msdefender:
    SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender\Platform\'
    SourceImage|endswith: '\MsMpEng.exe'
  condition: ( selection_sysmon and not 1 of filter_main_* ) or 
    selection_calltrace
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects interactions with Sysmon.exe or Sysmon64.exe where an attacker is attempting to manipulate or disable Sysmon logging functionality, specifically targeting process access with the intent to evade detection (MITRE ATT&CK T1562.002). The likely objective is to conduct reconnaissance or payload execution without leaving typical traces, thereby maintaining persistence and reducing the likelihood of detection by security monitoring.

  The primary telemetry source is Windows process access logs, particularly focusing on Security Event ID 4663, which captures file or object access events. If malicious, actions detected can lead to complete evasion of monitoring channels and facilitate further exploitation or lateral movement within the environment. This detection does NOT confirm that malicious activity has taken place on its own; further context and investigation into related activities must be assessed.

  ### Investigation Steps

  - **Review event IDs for process access:** Check Security Event ID 4663 for any entries corresponding to Sysmon.exe or Sysmon64.exe (TargetImage). Look for unusually large volumes of access in a short period, indicative of potential abuse.

  - **Examine granted access levels:** Investigate the GrantedAccess field in process access logs. Look for access level ‘0x1400’, which signifies permission to delete or alter the Sysmon process. Detecting this on legitimate hosts is rare.

  - **Analyze call traces:** Review the call traces for instances containing 'Ente' as noted in the rule. This indicates the use of malicious tools specifically interacting with Sysmon. Correlate with other telemetry to assess malicious intent.

  - **Identify legitimate process behavior:** Confirm expected behaviors around Sysmon processes. Regular access by administrative users may include routine updates or configuration changes, which should be validated against internal change management records.

  - **Look for unusual SourceImage paths:** Identify instances where the SourceImage path does not align with the common Windows directories (e.g., ‘C:\Program Files (x86)\’, ‘C:\Windows\System32\’). Uncommon paths may indicate an attempt to obscure malicious activity.

  - **Validate user account context:** Check the User field associated with the process access events. If Sysmon.exe is accessed by non-administrative or unexpected accounts, this raises suspicions of potential exploitation or manipulation.

  ### Prioritization

  This alert is high severity due to the potential impact on system integrity and monitoring capabilities. The behavior observed is indicative of common adversary tactics for evading intrusion detection mechanisms, which increases the likelihood of malicious abuse, especially if Sysmon functionality is compromised.

  ### Blind Spots and Assumptions

  Detection may be limited by noisy legitimate administrative workflows that interact with Sysmon. Organizations need to ensure adequate logging configurations are in place for consistent coverage. False positives may arise from legitimate security configurations or troubleshooting efforts. A companion detection option includes monitoring for modifications to Sysmon configuration files which could provide additional context to ongoing investigations.

