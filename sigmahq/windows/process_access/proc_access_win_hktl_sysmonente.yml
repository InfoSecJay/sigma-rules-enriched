detection:
  selection_sysmon:
    TargetImage|contains:
    - ':\Windows\Sysmon.exe'
    - ':\Windows\Sysmon64.exe'
    GrantedAccess: '0x1400'
  selection_calltrace:
    CallTrace: 'Ente'
  filter_main_generic:
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  filter_main_msdefender:
    SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender\Platform\'
    SourceImage|endswith: '\MsMpEng.exe'
  condition: ( selection_sysmon and not 1 of filter_main_* ) or selection_calltrace
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects attempts to manipulate Sysmon, specifically by using the tool SysmonEnte, which is designed to alter Sysmon’s integrity and functionality. The likely attacker objective is to evade detection mechanisms that rely on Sysmon logs, thereby achieving persistence or stealthy execution of malicious activities. The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (TA0005) and specifically the application of Tool Manipulation (T1562.002).

  Primary telemetry sources for this detection include Windows event logs for process access (Event ID 10 from Sysmon) and process creation events (Event ID 4688). If the malicious activity goes undetected, it could severely compromise the security posture of the enterprise by allowing adversaries to hide their actions. This detection alone does NOT confirm successful malicious activity; it merely indicates an attempt to manipulate a critical system monitoring tool.

  ---

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Security Event ID 4688 for the creation of Sysmon.exe or Sysmon64.exe. Look for unexpected parent processes or anomalous command-line arguments indicative of abnormal usage.

  - **Analyze Sysmon logs for access attempts:** Query Sysmon Event ID 10 records where TargetImage is Sysmon.exe. Check for high GrantedAccess values (0x1400) from untrusted or unexpected source images.

  - **Identify call trace signatures:** Review Sysmon logs specifically for the presence of the CallTrace field containing "Ente." This indicates potential tampering or unusual usage of Sysmon processes.

  - **Validate legitimate Sysmon usage:** Compare the process with known good configurations. Legitimate Sysmon operations should originate from standard paths like C:\Program Files\Sysinternals\ and have authorized access. Any instances outside these parameters warrant further review.

  - **Check for security tool interactions:** Investigate logs for Event ID 10 where the SourceImage contains 'MsMpEng.exe' to identify possible conflicts with Microsoft Defender that may indicate legitimate tool usage rather than attack attempts.

  - **Assess asset criticality and documentation:** Note the role of the affected systems (e.g., domain controllers vs. workstations) and confirm any recent changes or updates in monitoring tools, as legitimate security measures could trigger this alert.

  ---

  ### Prioritization

  This alert should be considered high priority due to the potential impact on integrity and observability of critical endpoint monitoring capabilities. The likelihood of malicious exploitation is significant, as tools like SysmonEnte are often weaponized to bypass defenses and maintain hidden access in enterprise environments.

  ---

  ### Blind Spots and Assumptions

  Detection may face limitations due to possible evasion techniques, such as renaming or disguising the use of SysmonEnte and other similar tools. Ensure that logging configurations include necessary details from Sysmon and process creation events for reliable detection. It should be noted that legitimate administrative activities, such as routine updates or misconfigurations in Sysmon, may also trigger this alert. A related detection that strengthens coverage could include monitoring for unexpected process terminations of Sysmon itself, indicating an additional layer of evasion tactics.

