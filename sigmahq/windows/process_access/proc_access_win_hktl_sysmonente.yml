logsource:
  category: process_access
  product: windows
detection:
  selection_sysmon:
    TargetImage|contains:
    - ':\Windows\Sysmon.exe'
    - ':\Windows\Sysmon64.exe'
    - ':\Windows\Sysmon64a.exe'
    GrantedAccess: '0x1400'
  selection_calltrace:
    CallTrace: 'Ente'
  filter_main_generic:
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  filter_main_msdefender:
    SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender\Platform\'
    SourceImage|endswith: '\MsMpEng.exe'
  condition: ( selection_sysmon and not 1 of filter_main_* ) or 
    selection_calltrace
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule specifically detects the execution of SysmonEnte, a tool designed to manipulate and potentially compromise the integrity of Sysmon. The primary objective of an attacker utilizing SysmonEnte is to evade detection and persist in the environment by tampering with system logs generated by Sysmon, which is critical for visibility into system activities. The relevant MITRE ATT&CK tactic is **Defense Evasion (TA0005)**, specifically technique **T1685.001 - Sysmon Configuration Manipulation**.

  The primary telemetry sources include Windows process creation logs with Event ID **4688** and Sysmon logs that capture process access attempts. If malicious, the impact could include successful evasion of endpoint detection capabilities, leading to unmonitored malicious activities. This detection alone does not confirm a compromise; legitimate tools or processes could mimic similar behavior.

  ### Investigation Steps

  - **Identify process creation logs:** Review Security Event ID **4688** for processes related to SysmonEnte. Look for process names such as `Sysmon.exe`, `Sysmon64.exe`, and `Sysmon64a.exe` that are executed with `GrantedAccess` set to `0x1400`, indicating potential manipulation.

  - **Examine Sysmon logs:** Analyze Sysmon logs for Event ID **1** to determine the process creation details, specifically focusing on **CallTrace** containing `Ente`, which is indicative of the SysmonEnte detection.

  - **Validate legitimate usage:** Check for instances of legitimate Sysmon activity. Valid execution paths typically originate from `C:\Windows\` or `C:\Program Files\`, unlike suspicious instances that may appear in unexpected directories.

  - **Assess file activity:** Investigate for any file creation or modification events that may correspond with the execution of SysmonEnte. Check for related artifacts under `%TEMP%` or suspicious temporary directories used for evasion.

  - **Correlate with Windows Defender logs:** Inspect logs under **ProgramData\Microsoft\Windows Defender\Platform** for discrepancies or interference with the `MsMpEng.exe` process, which may reveal a defensive measure being bypassed.

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on the security posture of the organization, particularly in critical systems running Sysmon. The likelihood of malicious abuse is high, as Sysmon integrity tampering is a known tactic of sophisticated adversaries. This behavior is not only weaponized but is a clear indicator of an attempt to hide malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as the use of similar legitimate tools that could trigger false positives. Ensure logging is appropriately configured for **Sysmon** and Windows Event logs to capture necessary activities reliably. Legitimate audits or maintenance routines may inadvertently trigger this alert, such as authorized Sysmon configuration updates. A companion detection to reinforce this coverage would involve monitoring for unexpected changes in Sysmon configuration settings through Event ID **12291**.

