logsource:
  category: process_access
  product: windows
detection:
  selection_sysmon:
    TargetImage|contains:
    - ':\Windows\Sysmon.exe'
    - ':\Windows\Sysmon64.exe'
    GrantedAccess: '0x1400'
  selection_calltrace:
    CallTrace: 'Ente'
  filter_main_generic:
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  filter_main_msdefender:
    SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender\Platform\'
    SourceImage|endswith: '\MsMpEng.exe'
  condition: ( selection_sysmon and not 1 of filter_main_* ) or selection_calltrace
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of SysmonEnte, a tool designed to manipulate and attack the integrity of Sysmon, which is a system monitoring tool used in Windows environments. The suspected threat involves an attacker seeking to evade detection by making unauthorized changes to Sysmon’s behavior, potentially allowing them to hide malicious activities from security monitoring tools. The attacker’s objectives may include maintaining persistence, exfiltrating data, or traversing network resources undetected.

  The relevant MITRE ATT&CK tactics and techniques associated with this activity include **Defense Evasion** (TA0005) and **Subvert Trust Controls** (T1562.002). The attacker's modification of Sysmon could significantly reduce the efficacy of endpoint monitoring, providing a foothold for further malicious actions.

  Primary data sources for detecting this behavior include Windows process creation events, particularly looking at Sysmon logs and process access logs, which can provide insight into the execution of SysmonEnte and modifications to Sysmon’s functionality.

  ### Investigation Steps
  - **Review Sysmon Logs**: Analyze Sysmon logs for suspicious process creation events related to Sysmon.exe or Sysmon64.exe, particularly those with an access mask of `0x1400`, which indicates an attempt to modify the Sysmon process.
  - **Check Call Trace Details**: Examine call traces for indications of `Ente`, which is likely an identifier used by SysmonEnte during execution. Look for anomalies or unexpected calls related to Sysmon processes.
  - **Inspect File Paths**: Investigate the execution paths of related processes, especially those originating from standard directories like `C:\Program Files`, `C:\Windows\System32`, or `C:\ProgramData`. Filter out known benign processes (like MsMpEng.exe) that could generate false positives.
  - **Correlate with Other Security Tools**: Utilize data from EDR and AV tools to cross-reference alerts or detections related to Sysmon modifications, focusing on identifying patterns that correlate with SysmonEnte's usage.

  ### Prioritization
  The alert is categorized as high severity because the ability to manipulate Sysmon is a critical threat to enterprise security posture, as it can effectively blind security teams to ongoing malicious activities within the network.

  ### Blind Spots and Assumptions
  Potential gaps in detection include environments where Sysmon is not deployed or fully configured, as well as instances where logs are not retained long enough for analysis. The detection logic assumes that the typical benign processes can be filtered out without overlooking critical alerts. Required logs include detailed process access events and Sysmon logs, which must be properly configured to capture relevant data for this detection rule to function effectively.

