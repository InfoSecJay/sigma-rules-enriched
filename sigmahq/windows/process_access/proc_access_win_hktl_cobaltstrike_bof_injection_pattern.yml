note: |
  ### Technical Context
  This detection rule is designed to identify a common behavior associated with Cobalt Strike's beacon Object File (BOF) injection techniques, which are often used by attackers to execute malicious payloads within the process memory space of legitimate Windows binaries. Cobalt Strike is a versatile penetration-testing and adversary simulation tool frequently abused by threat actors to gain and maintain persistence in compromised environments. By injecting code into existing processes, attackers can evade traditional security measures and perform actions like data exfiltration or lateral movement with reduced visibility.

  The relevant MITRE ATT&CK tactics associated with this detection include **Execution** (TA0002) and **Defense Evasion** (TA0005), with specific techniques such as **Process Injection** (T1055) and **Process Injection: Reflective DLL Injection** (T1106). In typical scenarios, attackers seek to execute malicious code without alerting security, making this detection crucial for spotting potentially harmful activities early in the attack lifecycle.

  Key data sources for this detection rule include **Windows process access logs**, which capture events related to process creation and manipulation, providing insights into unauthorized or suspicious access patterns that might indicate the use of Cobalt Strike or similar tools.

  ### Investigation Steps
  - **Review Process Access Logs**: Examine the Windows process access logs to identify any entries that match the specified call trace and access rights indicative of a BOF injection pattern.

  - **Analyze Process Creation Events**: Look for unusual parent-child relationships in the process creation logs. Compare the creation times and command lines of both processes involved to discern legitimate user actions from potential malicious behavior.

  - **Correlate with EDR Data**: Utilize EDR tools to gather additional context around the noted process interactions. Pay particular attention to process trees and any alerts generated during the time of the suspicious activity.

  - **Check for Known Indicators**: Investigate against a list of known Cobalt Strike indicators, including hashes of binaries, network connections to known Cobalt Strike servers, and unusual file paths where related operations are commonly observed.

  ### Prioritization
  This alert is deemed **high severity** due to the impactful nature of process injection techniques often employed by advanced threat actors that can lead to significant breaches of security. The likelihood of encountering Cobalt Strike in targeted environments, particularly those undergoing active threat campaigns, necessitates prompt attention to this detection.

  ### Blind Spots and Assumptions
  Potential gaps in this detection include the inability to capture certain obfuscation techniques or scenarios where injection occurs in non-Windows systems, limiting the overall breadth of detection. The detection logic assumes that the monitored environment is properly configured to log process access events comprehensively, including both successful and unsuccessful injection attempts. Additionally, any deployment of process monitoring tools that do not adhere to these logging practices may result in missed detections.

