note: |
  ### Technical Context

  This Sigma rule detects process injection attempts characteristic of Cobalt Strike, specifically through its use of certain system DLLs (ntdll.dll and KERNELBASE.dll) to inject into other processes. The likely attacker objective is to execute malicious payloads within the context of legitimate processes, facilitating evasion of security controls and persistence within the environment. This behavior corresponds to MITRE ATT&CK tactics: Execution (T1106) and Defense Evasion (T1685).

  The primary telemetry source is Windows process access logs, specifically monitoring the CallTrace of process injection activities along with access control rights. If malicious, such behavior poses significant security risks, including potential data exfiltration or lateral movement within the network. Importantly, this detection does NOT prove the presence of a Cobalt Strike incident on its own; it merely indicates that suspicious process access behavior has occurred.

  ### Investigation Steps

  - **Check recent process activities:** Review Security Event ID 4688 for processes created around the time of the alert. Identify any processes that exhibit unusual parent-child relationships or untrusted executables. Look for processes created by known system processes (e.g., svchost.exe).

  - **Validate CallTrace details:** Inspect the CallTrace logs for entries matching the patterns defined in the rule. Specifically, look for any calls to `ntdll.dll` or `KERNELBASE.dll` with GrantedAccess values of `0x1028` or `0x1fffff`, which indicate high levels of privilege.

  - **Identify high-confidence malicious indicators:** Look for interplay with Cobalt Strike related artifacts, such as the loading of known Cobalt Strike DLLs or shellcode patterns documented in sources like the provided GitHub links. This would indicate potentially malicious activity linked to known threat actors.

  - **Review system activity pre- and post-alert:** Examine System Event logs (Event ID 5156 for Windows Filtering Platform) to assess if there are abnormal network connections made by the process in question following the injection attempt.

  - **Establish baseline for expected behavior:** Document typical business applications running on the affected systems to assess what legitimate process injection behavior may look like. For example, legitimate software update processes might interact with system DLLs without necessarily indicating malicious intent.

  - **Correlate with threat intelligence feeds:** Cross-reference the affected host behavior against threat intelligence sources to identify if the related IPs, domains, or file hashes are linked to known Cobalt Strike campaigns.

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems and the likelihood that this behavior is part of a broader malicious campaign. Given the common usage of Cobalt Strike in penetration tests and real-world attacks, timely response is required to assess and mitigate potential threats.

  ### Blind Spots and Assumptions

  False positives may arise from legitimate software or configuration changes that involve injection techniques. Effective detection relies on comprehensive process access logs and ensuring that real-time monitoring is enabled. Additionally, benign administrative activities or internal testing scenarios may unintentionally trigger this alert. Companion detections based on abnormal file modification patterns may further enhance coverage against this threat vector.

