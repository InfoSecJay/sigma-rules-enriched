note: |
  ### Technical Context

  This Sigma rule detects the injection of Cobalt Strike's beacon payload, specifically monitoring for calls to Windows system libraries (ntdll.dll and KERNELBASE.dll) that exhibit patterns consistent with process injection techniques commonly used by adversaries. The primary attacker objective is to gain persistence or execute arbitrary code within the context of another process, aiding in further exploitation or lateral movement.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and **Defense Evasion** (TA0005), particularly techniques **T1106: Execution through API** and **T1562.001: Impair Defenses via Process Injection**. Primary telemetry sources include event logs related to process access, particularly leveraging Event ID 4672 (Special Privileges Assigned to New Logon) in conjunction with execution traces for injection activity. If confirmed malicious, this behavior can allow significant unauthorized control over targeted systems. However, this detection does NOT confirm that an attack is in progress; it merely indicates suspicious process interactions.

  ### Investigation Steps

  - **Verify process injection patterns:** Examine the CallTrace in the logs for any calls that match the regex pattern `^C:\\Windows\\SYSTEM32\\ntdll\.dll\+[a-z0-9]{4,6}\|C:\\Windows\\System32\\KERNELBASE\.dll\+[a-z0-9]{4,6}` in process_access logs. Look for transferred control between ntdll.dll and KERNELBASE.dll indicating attempted injection.

  - **Check granted access levels:** Review the `GrantedAccess` field for values such as `0x1028` or `0x1fffff`, which indicate elevated privileges typically required for injecting into other processes, especially against high-value targets.

  - **Identify legitimate process behaviors:** Observe standard application behaviors where similar process calls might occur without injection attempts. For instance, legitimate software updates or security scanning applications may trigger similar logs.

  - **Monitor for high-confidence malicious indicators:** Investigate related process activity where parent processes exhibit suspicious behavior, such as spawning from uncommon executables or utilizing command-line arguments indicative of a Cobalt Strike beacon.

  - **Cross-reference with threat intelligence:** Utilize external threat intelligence resources matching the identified patterns against known Cobalt Strike indicators, validating if there are any continuous communications to known malicious IPs or domains.

  - **Confirm system criticality and risks:** Assess the asset's role in the organization. If the affected host is part of critical infrastructure or a high-value asset, escalate the investigation immediately due to the potential for significant impact.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems and the likelihood of successful exploitation by adversaries, particularly since process injection techniques are frequently utilized for further attacks. This behavior is a fundamental component of certain APT tactics and should be treated with urgency.

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques such as anti-virus or security software that can obfuscate malicious behavior or legitimate applications that might use similar process interactions. Reliable detection requires comprehensive logging enabled for process access, particularly with Sysmon or equivalent tools. Whitelist scenarios, such as development environments or software debugging operations, may also generate similar alerts, potentially causing false positives. Companion detections involving outbound network traffic to Cobalt Strike command and control servers would further enhance overall security posture.

