title: Potential Direct Syscall of NtOpenProcess
id: 3f3f3506-1895-401b-9cc3-e86b16e630d0
status: test
description: Detects potential calls to NtOpenProcess directly from NTDLL.
references:
- https://medium.com/falconforce/falconfriday-direct-system-calls-and-cobalt-strike-bofs-0xff14-741fa8e1bdd6
author: Christian Burkard (Nextron Systems), Tim Shelton (FP)
date: 2021-07-28
modified: 2023-12-13
tags:
- attack.execution
- attack.t1106
logsource:
  category: process_access
  product: windows
detection:
  selection:
    CallTrace|startswith: 'UNKNOWN'
  filter_main_vcredist:
    TargetImage|endswith: 'vcredist_x64.exe'
    SourceImage|endswith: 'vcredist_x64.exe'
  filter_main_generic:
        # Examples include "systeminfo", "backgroundTaskHost", "AUDIODG"
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
    TargetImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  filter_main_kerneltrace_edge:
        # Cases in which the CallTrace is just e.g. 'UNKNOWN(19290435374)' from Microsoft-Windows-Kernel-Audit-API-Calls provider
    Provider_Name: 'Microsoft-Windows-Kernel-Audit-API-Calls'
  filter_optional_vmware:
    TargetImage|endswith: ':\Windows\system32\systeminfo.exe'
    SourceImage|endswith: 'setup64.exe'     # vmware
  filter_optional_cylance:
    SourceImage|endswith: ':\Windows\Explorer.EXE'
    TargetImage|endswith: ':\Program Files\Cylance\Desktop\CylanceUI.exe'
  filter_optional_amazon:
    SourceImage|endswith: 'AmazonSSMAgentSetup.exe'
    TargetImage|endswith: 'AmazonSSMAgentSetup.exe'
  filter_optional_vscode:   # VsCode
    SourceImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
    TargetImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
  filter_optional_teams:   # MS Teams
    TargetImage|endswith: '\AppData\Local\Microsoft\Teams\current\Teams.exe'
    SourceImage|endswith: '\AppData\Local\Microsoft\Teams\current\Teams.exe'
  filter_optional_discord:   # Discord
    TargetImage|contains: '\AppData\Local\Discord\'
    TargetImage|endswith: '\Discord.exe'
  filter_optional_yammer:
    SourceImage|contains: '\AppData\Local\yammerdesktop\app-'
    SourceImage|endswith: '\Yammer.exe'
    TargetImage|contains: '\AppData\Local\yammerdesktop\app-'
    TargetImage|endswith: '\Yammer.exe'
    GrantedAccess: '0x1000'
  filter_optional_evernote:
    TargetImage|endswith: '\Evernote\Evernote.exe'
  filter_optional_adobe_acrobat:
    SourceImage|contains: ':\Program Files\Adobe\Acrobat DC\Acrobat\'
    SourceImage|endswith: '\AcroCEF.exe'
    TargetImage|contains: ':\Program Files\Adobe\Acrobat DC\Acrobat\'
    TargetImage|endswith: '\AcroCEF.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This detection identifies potential direct syscalls to `NtOpenProcess` originating from NTDLL, which is atypical for legitimate processes. Direct syscall invocation can suggest advanced techniques employed by threat actors, likely aiming to manipulate or hijack processes for malicious activities, such as privilege escalation or to achieve persistence. This behavior is associated with the MITRE ATT&CK technique T1106 (Native API).

  Primary telemetry sources include Windows kernel audit logs, specifically looking for syscall traces that commence with 'UNKNOWN.' The security impact of this behavior is significant, as it may indicate an advanced persistent threat or malware attempting to control targeted processes. Importantly, this detection does not prove malicious intent alone; further investigation is required to contextualize the activity.

  ---

  ### Investigation Steps

  - **Verify the calling process:** Determine the `SourceImage` of the syscall alongside the `TargetImage`. Events should be examined for entries like Event ID 4656 (Handle Access) or syscall traces. Benign usage can include system tools or commonly trusted applications under standard conditions.

  - **Check for known benign applications:** Identify if the source or target images correlate with commonly used software like `vcredist_x64.exe` or `systeminfo.exe`. Legitimate processes typically exhibit known behaviors and are executed in recognized paths.

  - **Audit access levels:** Investigate the `GrantedAccess` field to ensure it aligns with expected usage. A `GrantedAccess` value of `0x1000` specifically could indicate process manipulation, which is unusual for general application behavior and warrants further scrutiny.

  - **Examine related process trees:** Utilize Sysinternals tools (like Process Explorer) to inspect the process tree and confirm if the calling process has legitimate parent-child relationships. Any anomalies in the hierarchy may indicate malicious activity.

  - **Monitor for associated artifacts:** Validate the presence of any suspicious file operations or network connections initiated by the `TargetImage`. Look for the creation of unusual files or outbound connections using `netstat` or similar commands.

  - **Review recent security alerts:** Check if there are accompanying alerts related to the observed behavior from threat intelligence feeds or intrusion detection systems. This could indicate broader exploitation patterns requiring immediate attention.

  ---

  ### Prioritization

  This alert should be considered medium priority due to the potential security risks associated with direct syscall manipulation. Systems involved may have critical roles, depending on the application context, and the likelihood of exploitation through this technique is moderate but concerning since it is commonly weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete logging configurations or situations where legitimate applications use direct syscalls, potentially leading to false positives. Required log sources include comprehensive kernel auditing settings enabled to capture syscall activities accurately. Additionally, benign applications, such as system utilities, may trigger this alert under specific operational scenarios. Related detections such as those monitoring abnormal Windows API calls (e.g., `NtReadVirtualMemory`) could enhance holistic detection capabilities.

