title: Potential Direct Syscall of NtOpenProcess
id: 3f3f3506-1895-401b-9cc3-e86b16e630d0
status: test
description: Detects potential calls to NtOpenProcess directly from NTDLL.
references:
- https://medium.com/falconforce/falconfriday-direct-system-calls-and-cobalt-strike-bofs-0xff14-741fa8e1bdd6
author: Christian Burkard (Nextron Systems), Tim Shelton (FP)
date: 2021-07-28
modified: 2023-12-13
tags:
- attack.execution
- attack.t1106
logsource:
  category: process_access
  product: windows
detection:
  selection:
    CallTrace|startswith: 'UNKNOWN'
  filter_main_vcredist:
    TargetImage|endswith: 'vcredist_x64.exe'
    SourceImage|endswith: 'vcredist_x64.exe'
  filter_main_generic:
        # Examples include "systeminfo", "backgroundTaskHost", "AUDIODG"
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
    TargetImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  filter_main_kerneltrace_edge:
        # Cases in which the CallTrace is just e.g. 'UNKNOWN(19290435374)' from Microsoft-Windows-Kernel-Audit-API-Calls provider
    Provider_Name: 'Microsoft-Windows-Kernel-Audit-API-Calls'
  filter_optional_vmware:
    TargetImage|endswith: ':\Windows\system32\systeminfo.exe'
    SourceImage|endswith: 'setup64.exe'     # vmware
  filter_optional_cylance:
    SourceImage|endswith: ':\Windows\Explorer.EXE'
    TargetImage|endswith: ':\Program Files\Cylance\Desktop\CylanceUI.exe'
  filter_optional_amazon:
    SourceImage|endswith: 'AmazonSSMAgentSetup.exe'
    TargetImage|endswith: 'AmazonSSMAgentSetup.exe'
  filter_optional_vscode:   # VsCode
    SourceImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
    TargetImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
  filter_optional_teams:   # MS Teams
    TargetImage|endswith: '\AppData\Local\Microsoft\Teams\current\Teams.exe'
    SourceImage|endswith: '\AppData\Local\Microsoft\Teams\current\Teams.exe'
  filter_optional_discord:   # Discord
    TargetImage|contains: '\AppData\Local\Discord\'
    TargetImage|endswith: '\Discord.exe'
  filter_optional_yammer:
    SourceImage|contains: '\AppData\Local\yammerdesktop\app-'
    SourceImage|endswith: '\Yammer.exe'
    TargetImage|contains: '\AppData\Local\yammerdesktop\app-'
    TargetImage|endswith: '\Yammer.exe'
    GrantedAccess: '0x1000'
  filter_optional_evernote:
    TargetImage|endswith: '\Evernote\Evernote.exe'
  filter_optional_adobe_acrobat:
    SourceImage|contains: ':\Program Files\Adobe\Acrobat DC\Acrobat\'
    SourceImage|endswith: '\AcroCEF.exe'
    TargetImage|contains: ':\Program Files\Adobe\Acrobat DC\Acrobat\'
    TargetImage|endswith: '\AcroCEF.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  The rule titled "Potential Direct Syscall of NtOpenProcess" detects potential direct calls to the `NtOpenProcess` function from the NTDLL library, which could indicate suspicious behavior commonly associated with advanced malware, such as Cobalt Strike. Attackers may use techniques like these to gain unauthorized access to other processes, often as part of a broader tactic to execute payloads or perform additional actions on a compromised machine. The primary objective in this context would be to manipulate or exfiltrate data from running processes without detection.

  This detection aligns with the MITRE ATT&CK framework's Execution tactic (ID: TA0002), specifically the technique "Indirect Command Execution" (ID: T1106). The use of direct system calls can indicate that an attacker is attempting to bypass typical security controls and makes it crucial to monitor such activities closely.

  The most valuable telemetry for this detection comes from process access logs (for instance, from the Windows Kernel), which can track system calls, along with other process-related events such as creation and termination logs.

  ### Investigation Steps
  - **Review Process Access Logs**: Examine the process access logs for any instances of `NtOpenProcess` being called directly from NTDLL, specifically looking for unknown or suspicious process names in the call traces.
  - **Analyze Parent-Child Relationships**: Look into `ProcessCreation` events to determine the parent and child process relationships around the suspicious calls. This can help identify how processes are being invoked and if there are signs of exploitation attempts.
  - **Cross-reference with Baselines**: Compare the identified processes and their expected behavior against baseline activity to detect any anomalies or deviations that may signify malicious activity.
  - **Check for Known Indicators**: Search your threat intelligence feeds and internal databases for known malicious binaries or behaviors associated with the processes detected. This may include well-documented tools like Cobalt Strike or other known malware.

  ### Prioritization
  The alert has been assigned a medium severity level due to the potential impact of process manipulation by malware. Given that direct syscalls can be indicative of more sophisticated infiltration methods, timely investigation is critical in an enterprise environment to mitigate further risks.

  ### Blind Spots and Assumptions
  This rule may have gaps in detection coverage if certain logs are not collected or if syscalls are obfuscated or minimized by advanced malware, limiting visibility into malicious behavior. Additionally, the detection logic assumes that the calls will not be obscured by known software, which may lead to false negatives. Required logs include comprehensive process access records and configurations that enable detailed syscall tracking, which may necessitate the activation of specific auditing features within Windows systems.

