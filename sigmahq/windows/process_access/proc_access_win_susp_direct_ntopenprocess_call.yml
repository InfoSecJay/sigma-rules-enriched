title: Potential Direct Syscall of NtOpenProcess
id: 3f3f3506-1895-401b-9cc3-e86b16e630d0
status: test
description: Detects potential calls to NtOpenProcess directly from NTDLL.
references:
- https://medium.com/falconforce/falconfriday-direct-system-calls-and-cobalt-strike-bofs-0xff14-741fa8e1bdd6
author: Christian Burkard (Nextron Systems), Tim Shelton (FP)
date: 2021-07-28
modified: 2023-12-13
tags:
- attack.execution
- attack.t1106
logsource:
  category: process_access
  product: windows
detection:
  selection:
    CallTrace|startswith: 'UNKNOWN'
  filter_main_vcredist:
    TargetImage|endswith: 'vcredist_x64.exe'
    SourceImage|endswith: 'vcredist_x64.exe'
  filter_main_generic:
        # Examples include "systeminfo", "backgroundTaskHost", "AUDIODG"
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
    TargetImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
  filter_main_kerneltrace_edge:
        # Cases in which the CallTrace is just e.g. 'UNKNOWN(19290435374)' from Microsoft-Windows-Kernel-Audit-API-Calls provider
    Provider_Name: 'Microsoft-Windows-Kernel-Audit-API-Calls'
  filter_optional_vmware:
    TargetImage|endswith: ':\Windows\system32\systeminfo.exe'
    SourceImage|endswith: 'setup64.exe'     # vmware
  filter_optional_cylance:
    SourceImage|endswith: ':\Windows\Explorer.EXE'
    TargetImage|endswith: ':\Program Files\Cylance\Desktop\CylanceUI.exe'
  filter_optional_amazon:
    SourceImage|endswith: 'AmazonSSMAgentSetup.exe'
    TargetImage|endswith: 'AmazonSSMAgentSetup.exe'
  filter_optional_vscode:   # VsCode
    SourceImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
    TargetImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
  filter_optional_teams:   # MS Teams
    TargetImage|endswith: '\AppData\Local\Microsoft\Teams\current\Teams.exe'
    SourceImage|endswith: '\AppData\Local\Microsoft\Teams\current\Teams.exe'
  filter_optional_discord:   # Discord
    TargetImage|contains: '\AppData\Local\Discord\'
    TargetImage|endswith: '\Discord.exe'
  filter_optional_yammer:
    SourceImage|contains: '\AppData\Local\yammerdesktop\app-'
    SourceImage|endswith: '\Yammer.exe'
    TargetImage|contains: '\AppData\Local\yammerdesktop\app-'
    TargetImage|endswith: '\Yammer.exe'
    GrantedAccess: '0x1000'
  filter_optional_evernote:
    TargetImage|endswith: '\Evernote\Evernote.exe'
  filter_optional_adobe_acrobat:
    SourceImage|contains: ':\Program Files\Adobe\Acrobat DC\Acrobat\'
    SourceImage|endswith: '\AcroCEF.exe'
    TargetImage|contains: ':\Program Files\Adobe\Acrobat DC\Acrobat\'
    TargetImage|endswith: '\AcroCEF.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential direct system calls to `NtOpenProcess`, which may indicate an attempt by an adversary to manipulate or gather information about running processes on a Windows system. The likely objective of such behavior is to compromise process integrity or gather data on the state of the machine, often in preparation for further malicious activities. This primarily corresponds to the MITRE ATT&CK technique for "Direct Syscalls" (T1106).

  The primary telemetry sources for this detection include Windows Process Access logs, particularly through the `Microsoft-Windows-Kernel-Audit-API-Calls` provider. If malicious, this behavior could facilitate process injection, privilege escalation, or reconnaissance activities. Importantly, this detection does NOT prove that a compromise is occurring; it merely identifies an interaction that may warrant further investigation.

  ### Investigation Steps

  - **Identify event details:** Review the event logs for Security Event ID 4688 or Sysmon Event ID 1 focusing on `CommandLine` containing `NtOpenProcess` and check `CallTrace` for any entries starting with 'UNKNOWN'. This can indicate potential misuse of the syscall.

  - **Determine process origins:** Verify the `SourceImage` and `TargetImage` fields. Legitimate usage will often involve known system processes such as `vcredist_x64.exe`, `systeminfo.exe`, or `explorer.exe`. Look for anomalies in their context such as unexpected parent-child process relationships.

  - **Assess access rights:** Check the `GrantedAccess` field values. For `NtOpenProcess` calls, a typical value is `0x1000` (PROCESS_QUERY_INFORMATION). Uncommon values may indicate malicious intent.

  - **Correlate with baseline behavior:** Compare the observed behavior against known legitimate activities on the affected system. Unusual patterns, such as repeated or unusual access patterns from a single process, or attempts to access multiple processes rapidly, could be indicative of malicious activity.

  - **Check for known artifacts:** Investigate if the alert correlates with indicators of compromise related to known malicious tools or prior incidents. Look for associated artifacts in the user's profile directory, such as logs or executables that should not be there.

  - **Consider host role:** Evaluate the criticality of the host affected by this alert. Servers or endpoints with sensitive applications must be prioritized, especially if this behavior is detected on systems not typically executing processes like `systeminfo.exe`.

  ### Prioritization

  This alert should be considered of medium severity given the potential high impact if the process manipulation is malicious. While the existence of direct syscall activity can indicate an attempt to perform malicious actions, the commonality of some benign tools using `NtOpenProcess` means further validation is necessary.

  ### Blind Spots and Assumptions

  Detection limitations exist due to potential evasion techniques such as the use of obfuscated commands or alternative APIs to achieve process access without triggering alerts. Comprehensive logging configurations must be ensured for the relevant kernel API calls to maintain reliable detection capabilities. Additionally, common benign applications may trigger similar alerts, such as system diagnostics. A related detection to consider is the monitoring of unauthorized process creation (e.g., via Sysmon or Windows Security logs), which can provide complementary visibility into suspicious activities surrounding process manipulation.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
