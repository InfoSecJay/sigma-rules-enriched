logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
  - GrantedAccess|endswith:
              # - '10'  # covered in rule 678dfc63-fefb-47a5-a04c-26bcf8cc9f65
    - '30'
    - '50'
    - '70'
    - '90'
    - 'B0'
    - 'D0'
    - 'F0'
    - '18'
    - '38'
    - '58'
    - '78'
    - '98'
    - 'B8'
    - 'D8'
    - 'F8'
    - '1A'
    - '3A'
    - '5A'
    - '7A'
    - '9A'
    - 'BA'
    - 'DA'
    - 'FA'
    - '0x14C2'            # https://github.com/b4rtik/ATPMiniDump/blob/76304f93b390af3bb66e4f451ca16562a479bdc9/ATPMiniDump/ATPMiniDump.c
  - GrantedAccess|startswith:
              # - '0x100000'  # SYNCHRONIZE - cannot be used for credential dumping; high FP rate from AV/EDR agents synchronizing on LSASS
    - '0x1418'              # car.2019-04-004
    - '0x1438'              # car.2019-04-004
    - '0x143a'              # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
    - '0x40'
              # - '0x1000'  # minimum access requirements to query basic info from service
              # - '0x1010'    # car.2019-04-004
              # - '0x1400'
              # - '0x1410'    # car.2019-04-004 # Covered by 678dfc63-fefb-47a5-a04c-26bcf8cc9f65
  filter_main_generic:
        # When using this rule. Remove this filter and replace it by the path of the specific AV you use
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  filter_optional_malwarebytes:
    SourceImage|endswith: ':\ProgramData\MALWAREBYTES\MBAMSERVICE\ctlrupdate\mbupdatr.exe'
  filter_optional_vscode:
    SourceImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
  filter_main_windefend_1:
    SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender\'
    SourceImage|endswith: '\MsMpEng.exe'
  filter_main_windefend_2:
    CallTrace|contains|all:
    - '|?:\ProgramData\Microsoft\Windows Defender\Definition Updates\{'
    - '}\mpengine.dll+'
    GrantedAccess: '0x1418'
  filter_main_windefend_3:
    CallTrace|contains:
    - '|c:\program files\windows defender\mprtp.dll'
    - '|c:\program files\windows defender\MpClient.dll'
  filter_optional_vmwaretools:
    SourceImage|contains: ':\ProgramData\VMware\VMware Tools\'
    SourceImage|endswith: '\vmtoolsd.exe'
  filter_optional_sysinternals_process_explorer:
    SourceImage|endswith:
    - '\PROCEXP64.EXE'
    - '\PROCEXP.EXE'
    GrantedAccess: '0x40'
  filter_optional_mbami:
    SourceImage|endswith: '\MBAMInstallerService.exe'
    GrantedAccess: '0x40'
  filter_optional_nextron:
    SourceImage|endswith:
    - '\aurora-agent-64.exe'
    - '\aurora-agent.exe'
    - '\thor.exe'
    - '\thor64.exe'
    GrantedAccess: '0x40'
  filter_main_explorer:
    SourceImage|endswith: '\explorer.exe'
    GrantedAccess: '0x401'
  filter_optional_sysinternals_handle:
    SourceImage|endswith:
    - '\handle.exe'
    - '\handle64.exe'
    - '\handle64a.exe'
    GrantedAccess: '0x40'
  filter_optional_webex:
    SourceImage|endswith: '\AppData\Local\WebEx\WebexHost.exe'
    GrantedAccess: '0x401'
  filter_optional_steam_apps:
    SourceImage|contains: '\SteamLibrary\steamapps\'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software such as AV and EDR
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized access attempts to the LSASS (Local Security Authority Subsystem Service) process utilizing suspicious granted access flags. The primary attacker objective is likely credential dumping, where an adversary attempts to extract sensitive information such as user credentials or authentication tokens from LSASS. This behavior aligns with the MITRE ATT&CK tactics of Credential Access (TA0006) and the specific technique of Credential Dumping - LSASS (T1003.001).

  The detection is primarily sourced from process access telemetry on Windows, specifically through Security Event ID 4663 and Sysmon Event ID 10 (ProcessAccess), which log process access attempts. If successful, the malicious action can lead to significant security impacts, including unauthorized access to accounts and elevated privileges. However, this detection does NOT confirm an actual credential dump occurred on its own, as it captures access attempts rather than confirming data extraction.

  ### Investigation Steps

  - **Identify the process access attempt**: Review Security Event ID 4663 or Sysmon Event ID 10 in the logs. Check the `TargetImage` field for access to `lsass.exe` and the `GrantedAccess` flags against the suspicious values listed in the detection rule.

  - **Correlate source processes**: Analyze the `SourceImage` field to identify the originating process that attempted access. Verify if it matches known legitimate processes or if it deviates from expected behavior (e.g., built-in Windows services vs. uncommon executables).

  - **Compare access flags**: Cross-reference the `GrantedAccess` field against typical baseline values. Malicious attempts often involve flags like '0x1f0fff', while legitimate processes might show values like '0x40' for read access.

  - **Assess use of known software**: Examine the execution path of the initiating process. For example, `SourceImage` should not match paths of trusted security software (e.g., Windows Defender) that might access LSASS legitimately.

  - **Look for evidence of further exploitation**: Check for subsequent process creation events (Event ID 4688) that might indicate a follow-up action after the access attempt, such as running credential-dumping tools.

  - **Contextualize system criticality**: Review the asset from which this alert originated, especially if it is a server or domain controller. Credible threats in high-value assets require immediate remediation action.

  ### Prioritization

  This alert is of medium severity given its potential impact on systems that manage user credentials and authentication processes. The likelihood of malicious abuse is significant, as credential dumping is a common tactic employed in lateral movement and privilege escalation. Therefore, timely review and action are critical to prevent potential account compromise.

  ### Blind Spots and Assumptions

  Evasion techniques might include the use of replacing legitimate processes or utilizing stealthy, system-hiding execution paths, making detection challenging. Reliable detection relies heavily on configurations allowing the correct logging levels for both process access and Sysmon events. Legitimate software such as endpoint protection services may occasionally trigger this alert due to their interactions with LSASS. A companion detection to strengthen coverage could include monitoring for abnormal `lsass.exe` parent processes, such as unexpected executables attempting direct access, further indicating potential compromise.

