logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
  - GrantedAccess|endswith:
              # - '10'  # covered in rule 678dfc63-fefb-47a5-a04c-26bcf8cc9f65
    - '30'
    - '50'
    - '70'
    - '90'
    - 'B0'
    - 'D0'
    - 'F0'
    - '18'
    - '38'
    - '58'
    - '78'
    - '98'
    - 'B8'
    - 'D8'
    - 'F8'
    - '1A'
    - '3A'
    - '5A'
    - '7A'
    - '9A'
    - 'BA'
    - 'DA'
    - 'FA'
    - '0x14C2'            # https://github.com/b4rtik/ATPMiniDump/blob/76304f93b390af3bb66e4f451ca16562a479bdc9/ATPMiniDump/ATPMiniDump.c
  - GrantedAccess|startswith:
    - '0x100000'
    - '0x1418'              # car.2019-04-004
    - '0x1438'              # car.2019-04-004
    - '0x143a'              # car.2019-04-004
    - '0x1f0fff'
    - '0x1f1fff'
    - '0x1f2fff'
    - '0x1f3fff'
    - '0x40'
              # - '0x1000'  # minimum access requirements to query basic info from service
              # - '0x1010'    # car.2019-04-004
              # - '0x1400'
              # - '0x1410'    # car.2019-04-004 # Covered by 678dfc63-fefb-47a5-a04c-26bcf8cc9f65
  filter_main_generic:
        # When using this rule. Remove this filter and replace it by the path of the specific AV you use
    SourceImage|contains:
    - ':\Program Files (x86)\'
    - ':\Program Files\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  filter_optional_malwarebytes:
    SourceImage|endswith: ':\ProgramData\MALWAREBYTES\MBAMSERVICE\ctlrupdate\mbupdatr.exe'
  filter_optional_vscode:
    SourceImage|endswith: '\AppData\Local\Programs\Microsoft VS Code\Code.exe'
  filter_main_windefend_1:
    SourceImage|contains: ':\ProgramData\Microsoft\Windows Defender\'
    SourceImage|endswith: '\MsMpEng.exe'
  filter_main_windefend_2:
    CallTrace|contains|all:
    - '|?:\ProgramData\Microsoft\Windows Defender\Definition Updates\{'
    - '}\mpengine.dll+'
    GrantedAccess: '0x1418'
  filter_main_windefend_3:
    CallTrace|contains:
    - '|c:\program files\windows defender\mprtp.dll'
    - '|c:\program files\windows defender\MpClient.dll'
  filter_optional_vmwaretools:
    SourceImage|contains: ':\ProgramData\VMware\VMware Tools\'
    SourceImage|endswith: '\vmtoolsd.exe'
  filter_optional_sysinternals_process_explorer:
    SourceImage|endswith:
    - '\PROCEXP64.EXE'
    - '\PROCEXP.EXE'
    GrantedAccess: '0x40'
  filter_optional_mbami:
    SourceImage|endswith: '\MBAMInstallerService.exe'
    GrantedAccess: '0x40'
  filter_optional_nextron:
    SourceImage|endswith:
    - '\aurora-agent-64.exe'
    - '\aurora-agent.exe'
    - '\thor.exe'
    - '\thor64.exe'
    GrantedAccess: '0x40'
  filter_main_explorer:
    SourceImage|endswith: '\explorer.exe'
    GrantedAccess: '0x401'
  filter_optional_sysinternals_handle:
    SourceImage|endswith:
    - '\handle.exe'
    - '\handle64.exe'
    GrantedAccess: '0x40'
  filter_optional_webex:
    SourceImage|endswith: '\AppData\Local\WebEx\WebexHost.exe'
    GrantedAccess: '0x401'
  filter_optional_steam_apps:
    SourceImage|contains: '\SteamLibrary\steamapps\'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software such as AV and EDR
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potentially suspicious access requests to the Local Security Authority Subsystem Service (LSASS) process on Windows systems. The behavior indicates an attempt by an attacker to obtain sensitive information, such as credentials. The likely objective of an attacker triggering this rule is credential dumping, which falls under the MITRE ATT&CK tactic of Credential Access (T1003) and specifically the technique Credential Dumping: LSASS Memory (T1003.001). The primary telemetry sources for this detection include Windows process access logs, particularly focusing on the GrantedAccess flags utilized in access requests to "C:\Windows\System32\lsass.exe". If malicious, this behavior could lead to serious security breaches due to exposure of credentials and elevation of privileges.

  This detection does NOT confirm that an actual credential theft has occurred without additional corroborating evidence. The mere act of accessing LSASS with certain flags may also be part of benign activities conducted by legitimate applications.

  ### Investigation Steps

  - **Review process access logs:** Investigate Security Event IDs related to process access requests, specifically those targeting `lsass.exe`. Look for Event ID 4663 to find granted access flags and correlate with system sources or processes.

  - **Check for high-confidence malicious behavior:** Identify GrantedAccess values from the logs associated with LSASS access using the hexadecimal values specified in the rule (e.g., '30', '50', '70', etc.). Any suspicious access that corresponds with these values should prompt further scrutiny.

  - **Validate legitimate applications:** Confirm expected behavior by checking for legitimate software interacting with LSASS. Common benign processes might include trusted endpoints like `explorer.exe`. If these processes have access flags that match the selection criteria, they may warrant a lower priority for investigation.

  - **Scrutinize source application paths:** Look into the `SourceImage` field of the access request logs to examine the application making the access request. Ensure that the initiating process isn’t associated with known benign software to rule out false positives.

  - **Correlate with user behavior analytics:** Review the user context of the process initiating the access. Look for unusual user behaviors or suspicious login patterns leading up to the alert, which could indicate a compromised account.

  ### Prioritization

  This alert is of medium severity due to the critical role of LSASS in Windows security and its common targeting by malicious actors for credential theft. The likelihood of abuse is heightened as it aligns with common tactics used in credential dumping attacks, making it crucial to investigate quickly but with consideration of environmental context.

  ### Blind Spots and Assumptions

  Detection is limited by the accuracy of logs capturing access requests and may miss instances where logging settings are misconfigured. Legitimate administrative tasks or authorized security software may also generate false positives by accessing LSASS. A related detection rule that enhances coverage is one that detects unusual access patterns to other critical processes in memory, further corroborating any suspicion raised by this rule.

