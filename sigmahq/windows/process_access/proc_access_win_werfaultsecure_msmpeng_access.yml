note: |
  ### Technical Context

  This Sigma rule detects instances where `WerFaultSecure.exe` accesses `MsMpEng.exe` (the Microsoft Malware Protection Engine) with a debugger call trace, specifically looking for references to `dbgcore.dll` or `dbghelp.dll`. This behavior is indicative of potential EDR (Endpoint Detection and Response) freeze techniques, where an adversary may take advantage of the Protected Process Light (PPL) capability to interrupt or bypass security controls during malicious operations.

  The attack fits within the MITRE ATT&CK framework under the tactic "Defense Evasion" and specifically the technique "Indicator Removal on Host" (T1592). The primary telemetry source involves Windows Sysmon Event ID 10, which captures process access events when CallTrace is enabled. If the activity is malicious, it could lead to an attacker effectively disabling or evading security monitoring capabilities. Importantly, this detection does NOT confirm a successful compromise; it merely highlights suspicious interactions that warrant further investigation.

  ### Investigation Steps

  - **Review Sysmon Event ID 10 logs:** Check for entries where `SourceImage` is `WerFaultSecure.exe` and `TargetImage` is `MsMpEng.exe` with `CallTrace` containing either `dbgcore.dll` or `dbghelp.dll`. This is a high-confidence indicator of potential EDR circumvention techniques.

  - **Analyze process behavior:** Evaluate the process creation timeline and behavior leading up to the event. Legitimate operations involving `WerFaultSecure.exe` will typically not access `MsMpEng.exe` in this manner; examine parent processes for anomalies.

  - **Check for anomalous parent processes:** Look for unusual parent process IDs that initiated `WerFaultSecure.exe`. Legitimate use cases usually involve user-initiated actions or standard error reporting workflows; deviations may indicate malicious intent.

  - **Correlate with additional telemetry:** Identify any related security alerts, unusual network activity, or file manipulations that could coincide with this event, leveraging logs from firewalls or EDR solutions for corroborating evidence.

  - **Review associated window interaction:** Inspect user session logs to determine if there were any UI interactions corresponding to the WerFault process, as legitimate error reporting would typically involve user-visible elements and user actions.

  - **Cross-reference telemetry for context enrichment:** Look for other Sysmon logs (e.g., Event IDs 1, 3, and 5) from the affected host to gather more insights on process creation, network connections, and file creations that may help establish a clearer picture of context and intent.

  ### Prioritization

  The alert is classified as high severity due to the potential impact on critical endpoint security mechanisms. The likelihood of malicious abuse is significant because EDR freeze techniques are commonly weaponized by adversaries to evade detection during attacks. Systems running critical security processes like `MsMpEng.exe` hold high importance, making this activity particularly concerning.

  ### Blind Spots and Assumptions

  Detection relies on the proper configuration of Sysmon to capture Process Access events with CallTrace enabled; without these logs, suspicious behavior may go undetected. Evasion techniques may include legitimate processes leveraging similar functionality, complicating identification. Normal Windows Error Reporting functions may also create similar access events, which should be distinguished from malicious acts. Related detection rules regarding process injection or credential access (e.g., `T1055` for DLL injection) can strengthen overall coverage and awareness of potential threats.

