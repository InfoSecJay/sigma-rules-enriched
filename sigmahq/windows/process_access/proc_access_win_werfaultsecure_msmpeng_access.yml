note: |
  ### Technical Context
  This detection rule focuses on suspicious access events initiated by the `WerFaultSecure.exe` process to the `MsMpEng.exe` executable, particularly when certain debugger-related DLLs (`dbgcore.dll` or `dbghelp.dll`) are present in the call trace. This behavior suggests an attacker employing EDR (Endpoint Detection and Response) evasion techniques known as "EDR freeze" methods. The possible tactic behind such activity is to temporarily suspend security processes of EDR or antivirus solutions, allowing malicious code to execute unmonitored during this period.

  Attackers typically use `WerFaultSecure.exe`, which operates as a Protected Process Light (PPL), under the Windows operating system's security architecture. Their objective is to manipulate or interact with security measures to create opportunities for further compromise or exploitation. The relevant MITRE ATT&CK tactics include **Defense Evasion** (Tactic ID: TA0005) and specifically the technique of **Process Injection: EDR Freeze** (T1562.001).

  To effectively monitor this behavior, primary sources of telemetry include Sysmon Event ID 10 (Process Access) which must have the Call Trace feature enabled. This event captures detailed interactions between processes on Windows systems, providing crucial forensic data to identify and analyze potential threats.

  ### Investigation Steps
  - **Review Sysmon Logs**: Gather Sysmon Event ID 10 logs where `WerFaultSecure.exe` is the source image and `MsMpEng.exe` is the target. Look specifically for entries that include `dbgcore.dll` or `dbghelp.dll` in the call trace.

  - **Analyze Process Trees**: Investigate the process tree surrounding these events to understand the context and potential chain of attacks. Focus on parent-child relationships and check for any known malicious processes.

  - **Verify Anti-Virus and EDR Status**: Check the status and operational logs of any EDR or antivirus solutions on the affected systems during the timeframe of the access event. Take note of any instances of process suspension or unusual behavior that aligns with the detected event.

  - **Identify Anomalous Behavior**: Look for instances of legitimate `WerFaultSecure.exe` activities that deviate from normal operation patterns. Determine whether any recent changes in system configuration occurred, which could provide further context.

  ### Prioritization
  This alert is marked as high severity due to the potential impact on system security and the likelihood of successful evasion of security controls. The ability of an attacker to manipulate EDR or antivirus processes poses significant risks, as it may facilitate further attacks or compromise sensitive data.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Sysmon is not deployed consistently across all endpoints or if configurations do not enable the capturing of Call Trace data. The detection logic assumes that `WerFaultSecure.exe` accessing `MsMpEng.exe` with the specified DLLs indicates malicious intent, which may overlook legitimate Windows error reporting scenarios. These assumptions necessitate thorough deployment and configuration of Sysmon across the enterprise to ensure comprehensive logging and detection capabilities.

