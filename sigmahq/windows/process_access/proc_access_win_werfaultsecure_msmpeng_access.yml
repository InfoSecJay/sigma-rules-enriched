note: |
  ### Technical Context

  This rule detects instances where the process WerFaultSecure.exe accesses the Microsoft Malware Protection Engine (MsMpEng.exe) while utilizing debugging libraries (dbgcore.dll or dbghelp.dll) in its call trace. This type of behavior is indicative of an attempt to freeze or manipulate endpoint detection and response (EDR) solutions, typically to evade detection during malicious activities. The likely attacker objective is to suspend security processes, allowing malware to operate undetected.

  This detection aligns with the MITRE ATT&CK framework under the tactic of Defense Evasion and specifically technique T1562.001 (Impair Defenses). The primary telemetry source required for this detection includes Sysmon logs, specifically Event ID 10 (Process Access) with CallTrace enabled. If malicious, this activity has significant security implications, as it may enable persistent unauthorized access or execution of malware. It is important to note that this alert does NOT confirm malicious intent on its own, as legitimate system processes could cause similar events.

  ### Investigation Steps

  - **Check Sysmon Event ID 10 for Process Access:** Review Sysmon logs for Event ID 10 where SourceImage is 'WerFaultSecure.exe' accessing 'MsMpEng.exe'. Look for CallTrace entries containing 'dbgcore.dll' or 'dbghelp.dll' to confirm suspicious activity.

  - **Assess Process Execution Context:** Validate the parent process of ‘WerFaultSecure.exe’ using Sysmon Event ID 1 (Process Creation) to determine if it was initiated by a known legitimate process (e.g., system updates) or something unusual, which could indicate potential compromise.

  - **Verify Call Trace for Debugging Libraries:** Confirm that the CallTrace in the relevant Sysmon log entries includes 'dbgcore.dll' or 'dbghelp.dll'. Legitimate access usually does not employ these debugging libraries.

  - **Correlate Incident with Other Logs:** Look at Windows Event ID 4688 (Process Creation) for additional context around the invocation of 'WerFaultSecure.exe' to identify if it was preceded by unusual or suspicious activities from other applications.

  - **Review Process Protection Status:** Check if 'MsMpEng.exe' was running in a Protected Process Light (PPL) status at the time of the access. Legitimate instances typically wouldn't have this status manipulated by user-level processes.

  - **Investigate Recent Malware Incidents:** Search for any reported incidents involving EDR bypass techniques or similar behaviors in the environment to ascertain if this activity is consistent with known attack patterns.

  ### Prioritization

  This alert carries a high severity due to the critical role of MsMpEng.exe in endpoint protection and the sophisticated nature of the evasion technique employed. The likelihood of malicious abuse is significant, as adversaries actively seek ways to disable security solutions, making this behavior a concerning red flag within the enterprise.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of CallTrace in Sysmon logs, which can impede visibility into process interactions. Legitimate Windows Error Reporting operations can inadvertently trigger this alert, creating potential noise. Another related detection is monitoring for process memory modifications or process termination events, which can provide additional context to confirm or deny malicious activity in conjunction with this alert.

