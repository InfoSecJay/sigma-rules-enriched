note: |
  ### Technical Context
  This detection rule identifies attempts by adversaries to extract sensitive data from the Local Security Authority Subsystem Service (LSASS) process using the `MiniDump` function of the `comsvcs.dll` library via the `rundll32.exe` executable. By dumping LSASS memory, attackers can potentially harvest credential information, including password hashes and Kerberos tickets, which can then be used for lateral movement or privilege escalation within the network.

  The rule specifically targets behavior associated with credential access, indicative of a sophisticated threat actor exploiting Windows functionality to extract sensitive information. The primary objectives are typically to gain unauthorized access, maintain persistence, or facilitate further attacks within the environment.

  Relevant MITRE ATT&CK tactics and techniques for this activity include:
  - **Credential Access** (TA0006)
  - **OS Credential Dumping: LSASS Memory** (T1003.001)

  The necessary telemetry sources for detecting this behavior include process creation logs, process access logs, and potentially event logs that capture sensitive operations involving LSASS and rundll32 interactions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of `rundll32.exe` launching with parameters that indicate the use of `comsvcs.dll`, focusing on timestamps correlating with alerts to identify unauthorized access attempts.
  - **Analyze Process Access Logs:** Search for entries showing access to the `lsass.exe` process by `rundll32.exe`, specifically looking for the use of `MiniDump` calls to confirm if a memory dump was executed.
  - **Inspect Event Logs:** Look into Windows Security and System event logs for any odd behavior or failure events that might indicate exploitation attempts, particularly around user account logins or privilege escalations that coincide with the process activity.
  - **Collect Memory Dumps for Analysis:** If a memory dump is confirmed, ensure to collect it for further analysis with tools like Volatility or Rekall to investigate and confirm any credential harvesting activities.

  ### Prioritization
  This alert carries a high severity due to its potential impact on the organization’s security posture; successful memory dumps from LSASS can provide attackers with critical credentials that may lead to significant breaches and unauthorized access.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage if logging levels are insufficient or if necessary telemetry, such as detailed process access logs, is not enabled. This rule assumes that the environment is properly configured to capture the actions of common Windows processes like `rundll32.exe`, and that privilege elevation events or other potentially related activities are monitored and logged correctly. If logs are missing or configurations are improperly set, the detection may fail to trigger appropriately.

