note: |
  ### Technical Context

  This Sigma rule detects the misuse of the `MiniDump` export function from `comsvcs.dll` through `rundll32.exe` to perform a memory dump of the Local Security Authority Subsystem Service (LSASS). The likely objective of an attacker executing this behavior is to obtain sensitive credential information from memory, which may lead to unauthorized access or further exploitation within the network. This behavior maps to the MITRE ATT&CK technique "Credential Dumping" (T1003.001).

  The primary telemetry sources include process creation logs (Event ID 4688) and potentially Sysmon logs if deployed (Sysmon Event ID 1). If successful, this technique can greatly compromise system security by extracting sensitive information from memory. It is important to note that this detection alone does not confirm malicious intent, as legitimate processes may occasionally utilize similar mechanisms under specific contexts.

  ### Investigation Steps

  - **Verify the process creation logs**: Check for Windows Security Event ID 4688 and Sysmon Event ID 1 for `rundll32.exe` spawning `lsass.exe`. Look for the full command line usage to confirm if it includes `comsvcs.dll` for an unauthorized memory dump.

  - **Identify high-confidence malicious indicators**: Examine the process tree to see if `rundll32.exe` is being invoked by unexpected parent processes (e.g., PowerShell, cmd.exe). A command line containing `MiniDumpWriteDump` linked to `comsvcs.dll` is a strong indicator of credential dumping activity.

  - **Assess the LSASS access**: Cross-reference detected activities with the default behavior of LSASS, which should not typically be accessed by non-system processes. Legitimate access usually involves system components or specific authorized service accounts.

  - **Confirm logging configurations**: Ensure that Sysmon is deployed with comprehensive logging, particularly monitoring for Event ID 1 (process creation) and Event ID 10 (process accesses) to track unauthorized attempts to read LSASS memory.

  - **Review endpoint protection**: Validate whether endpoint protection/EDR solutions are configured to block or alert on manipulation of LSASS processes, including the use of `rundll32.exe` in this context.

  ### Prioritization

  This alert is of high severity due to the potential impact on credential security that can lead to widespread network compromise. The likelihood of this behavior being used maliciously is significant, as attackers frequently leverage such techniques to obtain sensitive information. Credential dumping via LSASS is a well-established method in the attack lifecycle.

  ### Blind Spots and Assumptions

  This detection may be evaded by using alternative methods to dump LSASS memory or by executing malicious code within trusted processes that do not utilize `rundll32.exe`. It assumes that the appropriate Windows logging (Event ID 4688, Sysmon Event ID 1) is configured and operational; lack of such logs can lead to gaps in detection. Legitimate administrative tasks or security tools may occasionally trigger similar alerts. A related detection could focus on PowerShell obfuscation techniques that lead to credential dumping, enhancing overall coverage against such workflows.

