note: |
  ### Technical Context
  This detection rule identifies potentially malicious attempts to access the Local Security Authority Subsystem Service (LSASS) process memory using processes that are typically white-listed, such as `TrolleyExpress.exe`, `ProcessDump.exe`, or `dump64.exe`. Attackers may leverage white-listed applications to perform credential dumping, thereby evading detection mechanisms like Microsoft Defender. The primary objective of such activity is to capture sensitive information, including user credentials, to facilitate lateral movement within a network or escalate privileges.

  The relevant MITRE ATT&CK tactics include Credential Access (TA0006) and specifically the technique for Credential Dumping from LSASS (T1003.001). This rule revolves around monitoring access events to the LSASS process, targeting applications that would typically have legitimate reasons to run in an enterprise environment. The primary data sources for effective detection include process access logs or telemetry from Windows operating system components that can provide visibility into process interactions and access levels.

  ### Investigation Steps
  - **Review Process Access Logs**: Collect and analyze logs related to process access, focusing on those that highlight interactions with `lsass.exe`. Pay particular attention to the `SourceImage` field for any instances of `TrolleyExpress.exe`, `ProcessDump.exe`, or similar applications.

  - **Analyze Permission Levels**: Investigate the `GrantedAccess` values associated with any detected attempts. High `GrantedAccess` values (like 0x10, 0x30, 0x50) are indicators of processes attempting to perform memory dumps, which are significant in credential harvesting attacks.

  - **Cross-Reference Whitelisted Applications**: Validate the legitimate use of any processes flagged by this detection against your organization’s application inventory. If an application is white-listed but is observed accessing LSASS, further scrutiny may be needed to determine if it's being exploited.

  - **Investigate User Behavior and Context**: Assess the user context in which the suspicious access occurred. Look for unusual patterns or discrepancies, such as access attempts made by service accounts at odd hours or from atypical locations.

  ### Prioritization
  This alert carries a high severity level due to the significant risk posed by credential dumping activities. Successful credential access not only compromises individual accounts but can also lead to broader network breaches, escalating the potential impact on systems and data integrity across the enterprise.

  ### Blind Spots and Assumptions
  The detection rule assumes that white-listed processes will be used maliciously and does not account for strict controls around legitimate usage, which may create false positives. Coverage gaps may exist if processes not typically associated with LSASS access are exploited. Additionally, the rule relies on the availability of comprehensive process access logs and accurate `GrantedAccess` values being reported by the logging configuration. If relevant logging is disabled or misconfigured, the detection may fail.

