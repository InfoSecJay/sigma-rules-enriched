note: |
  ### Technical Context

  This rule detects suspicious access to the LSASS process from potentially whitelisted applications, such as TrolleyExpress.exe, which are commonly used for legitimate activities. The likely attacker objective is to extract sensitive information, such as credentials, by dumping the LSASS memory. This behavior corresponds to the MITRE ATT&CK technique for Credential Dumping (T1003.001). The primary telemetry source is Windows process access logs, specifically focusing on events pertaining to process interactions with LSASS (lsass.exe). A successful memory dump can have serious security implications, including unauthorized access to user credentials and elevated privileges. It is important to note that the detection does NOT confirm malicious intent without further context—it may also capture legitimate processes engaged in normal operations.

  ### Investigation Steps

  - **Review process details:** Check for Event ID 4688 (Process Creation) to gather information on the SourceImage (e.g., TrolleyExpress.exe) involved in accessing lsass.exe. Verify if the creation follows expected patterns for authorized application behavior.

  - **Validate access permissions:** Investigate Event ID 4672 (Special Privileges Assigned to New Logon) to ensure the account used to execute TrolleyExpress.exe has legitimate access rights that align with corporate policies.

  - **Assess granted access levels:** Analyze the GrantedAccess values in the process access event. For high-confidence malicious indicators, focus on access flags associated with read and execute permissions (e.g., hexadecimal values such as '10', '30', '50'). Determine if these align with legitimate use cases.

  - **Correlate with user activity:** Check user activity logs around the time of the event (Security Event ID 4624, Logon) to assess the legitimacy of the account using TrolleyExpress.exe. Compare timestamps to identify anomalies or unexpected behavior.

  - **Identify legitimate usage patterns:** Review documented uses of TrolleyExpress.exe in your environment. If this executable is known to operate in a specific manner without accessing LSASS, note its normal operational context.

  - **Investigate related file activities:** If applicable, use Sysmon Event ID 11 (File Create) to verify any associated file creation activities during the same time frame. Look for unusual file actions that may indicate potential data exfiltration or usage of dumping tools.

  ### Prioritization

  Given the impact on credential security, this alert should be treated as high severity. The likelihood of malicious abuse is significant, as attackers often use other processes to hide their activities from detection mechanisms. Dumping LSASS is a well-known method for obtaining credentials and is frequently used in advanced attacks.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where different non-whitelisted tools or processes are utilized for credential dumping. Reliable detection requires proper logging configurations for process access events and approval of listed whitelisted processes. Legitimate administrative tools may trigger this alert. A related detection to strengthen coverage would include monitoring for unauthorized or atypical process creation events targeting lsass.exe from unrecognized applications.

