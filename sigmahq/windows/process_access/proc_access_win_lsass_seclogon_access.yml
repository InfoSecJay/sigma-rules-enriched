logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    SourceImage|endswith: '\svchost.exe'
    GrantedAccess: '0x14c0'
    CallTrace|contains: 'seclogon.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious access to the Local Security Authority Subsystem Service (LSASS) executable through a call trace that includes the "seclogon.dll" library. Attackers leveraging this method may attempt to extract sensitive information such as passwords or authentication tokens by manipulating LSASS, a crucial component of Windows security involved in authentication and security policy enforcement. The likely objective is to gain unauthorized access and escalate privileges within the targeted environment to facilitate further attacks.

  The primary MITRE ATT&CK tactics involved here are **Credential Access** (TA0006) and the specific technique **Credential Dumping: LSASS Memory** (T1003.001). This technique highlights how adversaries can exploit LSASS to obtain credentials. Effective detection of this activity hinges upon specific telemetry data, primarily **process access logs** that capture interactions with sensitive processes on Windows systems.

  ### Investigation Steps
  - **Review Process Access Logs**: Examine process access logs to identify any instances of svchost.exe attempting to access LSASS with granted access rights indicative of credential dumping, such as 0x14c0.

  - **Analyze Call Trace Data**: Investigate the call traces correlated with the detected events, specifically looking for any references to "seclogon.dll," which may suggest an attempt to manipulate LSASS via unauthorized means.

  - **Inspect Network Connections**: Check for suspicious network connections initiated by svchost.exe, particularly towards known attacker infrastructure or other internal endpoints that could be indicative of lateral movement.

  - **Assess User Activity and Context**: Validate the context of the user account performing the action, ensuring it aligns with expected behavior. Look for anomalies in user activity around the time of the detection, such as unusual logon times or access to sensitive systems.

  ### Prioritization
  This alert should be treated with high severity in an enterprise environment due to the significant risk posed by credential dumping activities. The potential impact of compromised credentials can lead to unauthorized access to critical systems, data breaches, and extensive lateral movement within the network.

  ### Blind Spots and Assumptions
  Detection of suspicious LSASS access via MalSecLogon may have gaps if specific logging features are not enabled within the Windows environment, particularly those capturing detailed process access logs. This detection logic assumes that the svchost.exe process genuinely behaves as a benign service host, and any deviations are potentially malicious. Additionally, an absence of comprehensive process auditing configurations could hinder the ability to effectively detect and respond to incidents of this nature.

