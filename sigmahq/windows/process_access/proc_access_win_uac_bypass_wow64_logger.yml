  ### Technical Context
  This detection rule targets a specific method of Privilege Escalation known as User Account Control (UAC) Bypass using a Windows-on-Windows 64-bit (WoW64) logger DLL hijack. The technique exploits the DLL search order to load a malicious DLL that executes with elevated privileges, potentially allowing attackers to run arbitrary code with higher-level permissions. This behavior is indicative of sophisticated attacks aiming to bypass system protections and gain unauthorized access to sensitive resources.

  The associated MITRE ATT&CK techniques include:
  - **T1548.002: Abuse Elevation Control Mechanism - Bypass UAC**
  - **T1086: PowerShell** may be used in conjunction with malformed DLL embeds, depending on how the attacker implements their command execution.

  Primary data sources required for effective detection include process access logs to unveil the access requests and any DLL interactions, which can highlight unusually high access grants associated with compromised processes. Additionally, monitoring for anomalies in system calls and tracing DLL loads within the SysWOW64 directory can reveal potential malicious activities linked to this tactic.

  ### Investigation Steps
  - **Review Process Access Logs**: Examine the logs filtering by the 'SourceImage' path that contains `C:\Windows\SysWOW64\`. Look for processes that have an elevated 'GrantedAccess' value of `0x1fffff`, indicating high-level permissions.

  - **Analyze Call Traces**: Validate the integrity of CallTrace logs for any recent entries starting with the pattern `UNKNOWN(0000000000000000)|UNKNOWN(0000000000000000)|`, as these can suggest overridden calls that are not standard and may indicate malicious activity.

  - **Correlate with Other Security Logs**: Cross-reference the findings with other telemetry sources, such as EDR alerts or Windows Event logs, to trace the execution patterns of the source image that attempted the UAC bypass.

  - **Identify Related Processes**: Investigate any parent-child relationships in the process tree around the time of the access requests; specifically, analyze if any legitimate applications were leveraged to execute the malicious payload.

  ### Prioritization
  Given the severity of privilege escalation vulnerabilities and the potential impact of UAC bypass methods on an organization's security posture, alerts generated from this rule should be treated with high priority. The ability to gain elevated privileges can lead to significant data breaches if exploited.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the logging mechanisms are not properly configured to capture all necessary process access events or if the DLL hijack occurs with legitimate processes that are hard to distinguish from normal behavior. The detection logic assumes that elevated access requests will trigger subsequent logging, and if logs are missing or configuration settings are insufficient, the detection rule may fail. Therefore, robust logging for process access and thorough monitoring of DLL interactions are essential for this alert to function effectively.

