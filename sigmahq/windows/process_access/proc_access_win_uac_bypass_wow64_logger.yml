  ### Technical Context

  This rule detects the use of a Windows DLL hijack specifically targeting the SysWOW64 directory, which is employed to bypass User Account Control (UAC) protections. The likely attacker objective is to escalate privileges on a compromised system by exploiting vulnerabilities in the way Windows processes are managed. This behavior aligns with the MITRE ATT&CK technique **T1548.002: Abuse Elevation Control Mechanism: Bypass User Account Control**. The primary telemetry sources include process access logs that capture events like process creation and access attempts related to DLLs in the SysWOW64 directory.

  If successful, this attack leads to elevated permissions that allow adversaries to execute malicious activities with higher privilege. It is important to note that this detection does NOT confirm a compromise on its own; further investigation is required to establish the malicious intent behind the detected behavior.

  ### Investigation Steps

  - **Review process access logs**: Examine logs for Security Event ID 4656 (Handle Access) and Event ID 4688 (Process Creation) to locate the use of DLLs specifically in the SysWOW64 path. Look for any unexpected processes attempting access at the high privilege level typically reserved for administrative tasks.

  - **Identify malicious CallTrace patterns**: Inspect for entries where the CallTrace starts with "UNKNOWN(0000000000000000)|UNKNOWN(0000000000000000)|." This high-confidence indicator strongly suggests the manipulation of process behaviors, pointing toward nefarious activity.

  - **Establish baseline behaviors**: Identify legitimate applications that may utilize the SysWOW64 directory for DLL access during typical system functions, e.g., mapping of 32-bit applications on a 64-bit OS. Document these to differentiate between expected and anomalous activity.

  - **Audit UAC settings and history**: Check for any recent changes to UAC settings or history in the Event Viewer, under Windows Logs -> Security. Look for Event ID 4608 (Windows is starting up) or other related logs that indicate changes in privilege elevation control settings.

  - **Analyze process lineage**: Utilize Sysmon Event ID 1 (Process Creation) to trace the parent-child relationship of processes. Confirm whether a known application parent-process initiated the questionable child-process, which could indicate a benign or malicious action.

  ### Prioritization

  Given the high impact on the affected system due to potential privilege escalation and the likelihood of this method being weaponized by adversaries, this alert is considered high severity. The ability to bypass UAC can facilitate further compromise and lateral movement within the network.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications using DLLs in the SysWOW64 directory, which can lead to false positives. The detection relies heavily on process access logs; therefore, adequate logging configuration in place is crucial for effective monitoring. Additionally, certain security applications might utilize similar behaviors for legitimate purposes, which can trigger the alert. Related detections, such as monitoring for unauthorized process creation (e.g., Event ID 4688) or the use of direct administrative commands, can provide complementary insights into potential privilege escalation activities.

