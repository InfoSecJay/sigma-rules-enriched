  ### Technical Context

  This Sigma rule detects the use of a DLL hijack within the WOW64 environment to bypass User Account Control (UAC) in Windows. Attackers may employ this technique to escalate privileges on the system without triggering standard security mechanisms, often aiming to execute payloads with higher privileges under the guise of trusted processes. The relevant MITRE ATT&CK tactic is Defense Evasion (ID: T1548.002) and it also relates to Privilege Escalation.

  The primary telemetry sources required include Windows Event Logs, specifically Process Creation events (Security Event ID 4688) and Sysmon events related to process access and DLL loading. If this behavior is malicious, it can lead to significant security impacts, including unauthorized access to sensitive data or full system compromise. However, this detection does not confirm that the action is malicious on its own, as legitimate applications may potentially exhibit similar behavior.

  ### Investigation Steps

  - **Verify Process Creation Activity**: Check for Security Event ID 4688 logs related to the process of interest. Look for user processes spawned from `C:\Windows\SysWOW64\` as this indicates potential privilege escalation attempts.

  - **Identify Granted Access Levels**: Review logs for the GrantedAccess field, specifically look for entries with value `0x1fffff`, which indicates full access rights that are unlikely for standard user applications. This can suggest malicious intentions.

  - **Examine Call Trace Patterns**: Investigate Sysmon Event ID 10 logs for processes that have an associated CallTrace starting with `UNKNOWN(0000000000000000)|UNKNOWN(0000000000000000)|`. Legitimate applications should not typically generate such behavior.

  - **Correlate with Asset Role**: Confirm if the affected host is a critical system (e.g., Domain Controller, Database Server). Privilege escalation attempts are more concerning on higher-value targets.

  - **Review Installed Applications**: Cross-reference installed software against known benign applications that may trigger similar patterns (e.g., legitimate installers or maintenance tools). Document any expected behavior related to these applications.

  - **Look for Unusual Network Activity**: Investigate any outbound connections correlating with the detected process access, particularly involving the use of unusual or malicious command and control (C2) servers.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems if exploited. The likelihood of malicious abuse is elevated, as UAC bypass techniques are commonly targeted by attackers. This behavior is often weaponized in advanced attacks seeking privilege escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs from certain administrative actions or processes running under different user accounts. Legitimate software updates or administrative tools might trigger this alert under certain conditions. Companion detections such as monitoring for unusual command-line arguments in Security Event ID 4688 logs can enhance coverage by revealing more sophisticated usage patterns.

