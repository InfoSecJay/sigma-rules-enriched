title: Potential Credential Dumping Activity Via LSASS
id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
status: test
description: |
  Detects process access requests to the LSASS process with specific call trace calls and access masks.
  This behaviour is expressed by many credential dumping tools such as Mimikatz, NanoDump, Invoke-Mimikatz, Procdump and even the Taskmgr dumping feature.
references:
- https://web.archive.org/web/20230329170326/https://blog.menasec.net/2019/02/threat-hunting-21-procdump-or-taskmgr.html
- https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.001/T1003.001.md
- https://research.splunk.com/endpoint/windows_possible_credential_dumping/
author: Samir Bousseaden, Michael Haag
date: 2019-04-03
modified: 2026-06-29
tags:
- attack.credential-access
- attack.t1003.001
- attack.s0002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
    - '0x1038'
    - '0x1438'
    - '0x143a'
    - '0x1fffff'         # Too many false positives
            # - '0x01000'  # Too many false positives
            # - '0x1010'   # Too many false positives
            # - '0x1400'  # Too many false positives
            # - '0x1410' # Too many false positives
            # - '0x40'   # Too many false positives
    CallTrace|contains:
    - 'dbgcore.dll'
    - 'dbghelp.dll'
    - 'kernel32.dll'
    - 'kernelbase.dll'
    - 'ntdll.dll'
  filter_main_system_user:
    SourceUser|contains:     # Covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_optional_thor:
    CallTrace|contains|all:
    - ':\Windows\Temp\asgard2-agent\'
    - '\thor\thor64.exe+'
    - '|UNKNOWN('
    GrantedAccess: '0x103800'
  filter_optional_sysmon:
    SourceImage|endswith:
    - ':\Windows\Sysmon64.exe'
    - ':\Windows\Sysmon64a.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized access requests to the LSASS process, which often indicates attempts at credential dumping. Attackers aim to extract sensitive account credentials to facilitate lateral movement within a network. This behavior aligns with MITRE ATT&CK tactic "Credential Access" (TA0006) and technique "Credential Dumping" (T1003.001). The primary telemetry source is process access logs from Windows, specifically targeting events related to LSASS (Local Security Authority Subsystem Service). If malicious, successful credential dumping can lead to unauthorized access to accounts and critical systems. It is important to note that this detection alone does not confirm that credential dumping has occurred; it only indicates potential attempts.

  ### Investigation Steps

  - **Review process access events**: Check for specific Event ID 4663 (Access attempt) or Sysmon Event ID 10 (Process Access) related to `lsass.exe`. Look for access masks indicating dump operations (e.g., `0x1038`, `0x1438`).

  - **Identify call traces**: Review the call trace for the same events to see if they include known libraries like `dbgcore.dll` or `kernel32.dll`, as these are commonly utilized in credential dumping activities.

  - **Cross-reference source user**: Investigate the user context; any access attempts from sources that include "AUTHORI" or "AUTORI" may be legitimate actions, especially in non-English environments.

  - **Check legitimate process behaviors**: Identify any expected behaviors, such as legitimate administrative tools accessing LSASS, including process names like `Taskmgr.exe` or `powershell.exe`, typically with lower access masks.

  - **Highlight high-confidence indicators**: Access requests showing multiple high-value access masks (e.g., `0x1fffff`) occurring in short succession should be flagged as potentially malicious.

  - **Examine additional logs**: Look for related process creation events (Event ID 4688) for any suspicious binaries that may lead to LSASS access attempts. Correlate this against threat intelligence or known exploit usage.

  ### Prioritization

  The severity of this alert is medium. The impact is significant when the affected system is a domain controller or a critical server. The likelihood of malicious actions is high due to the prevalence of credential dumping techniques being weaponized by attackers, and tools like Mimikatz are widely used to exploit these vulnerabilities.

  ### Blind Spots and Assumptions

  Detection relies on accurate and complete logging from Windows Process Access and may miss attempts if logs are misconfigured or if the attacker uses logging evasion techniques (e.g., clearing logs). Legitimate activities, such as system maintenance tasks or security assessments using admin tools, may trigger this alert. A companion detection to consider is monitoring for unusual user account behavior post-access attempts, such as unexpected logins or new administrative actions.

