title: Potential Credential Dumping Activity Via LSASS
id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
status: test
description: |
  Detects process access requests to the LSASS process with specific call trace calls and access masks.
  This behaviour is expressed by many credential dumping tools such as Mimikatz, NanoDump, Invoke-Mimikatz, Procdump and even the Taskmgr dumping feature.
references:
- https://web.archive.org/web/20230329170326/https://blog.menasec.net/2019/02/threat-hunting-21-procdump-or-taskmgr.html
- https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.001/T1003.001.md
- https://research.splunk.com/endpoint/windows_possible_credential_dumping/
author: Samir Bousseaden, Michael Haag
date: 2019-04-03
modified: 2024-03-02
tags:
- attack.credential-access
- attack.t1003.001
- attack.s0002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
    - '0x1038'
    - '0x1438'
    - '0x143a'
    - '0x1fffff'         # Too many false positives
            # - '0x01000'  # Too many false positives
            # - '0x1010'   # Too many false positives
            # - '0x1400'  # Too many false positives
            # - '0x1410' # Too many false positives
            # - '0x40'   # Too many false positives
    CallTrace|contains:
    - 'dbgcore.dll'
    - 'dbghelp.dll'
    - 'kernel32.dll'
    - 'kernelbase.dll'
    - 'ntdll.dll'
  filter_main_system_user:
    SourceUser|contains:     # Covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_optional_thor:
    CallTrace|contains|all:
    - ':\Windows\Temp\asgard2-agent\'
    - '\thor\thor64.exe+'
    - '|UNKNOWN('
    GrantedAccess: '0x103800'
  filter_optional_sysmon:
    SourceImage|endswith: ':\Windows\Sysmon64.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects access requests to the LSASS process, particularly monitoring for specific access masks and call traces associated with credential dumping activities. The likely attacker objective is to extract sensitive credentials from LSASS, which is commonly targeted by tools like Mimikatz during a post-exploitation phase. This behavior correlates with the MITRE ATT&CK technique T1003.001 (Credential Dumping: LSASS Memory), which is part of the broader credential access tactic.

  Primary telemetry sources include Windows process access logs, specifically focusing on Event ID 4663 (Access to an Object) and relevant security log entries that indicate process interactions with LSASS. If executed maliciously, successful credential dumping could lead to lateral movement or access to sensitive accounts. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate processes might access LSASS for valid administrative purposes.

  ### Investigation Steps

  - **Review process access logs:** Analyze Security Event ID 4663 for access to `lsass.exe`. Look for increased access masks indicative of credential dumping (e.g., 0x1038, 0x1438). Review timestamps and user accounts involved for unusual patterns.

  - **Identify suspicious call traces:** Examine the `CallTrace` field for associated DLLs like `dbgcore.dll` and `ntdll.dll`. Access traces indicating these libraries alongside the LSASS access could suggest malicious payload execution.

  - **Verify user legitimacy:** Check the `SourceUser` field to confirm if the access was made by common system accounts (local service, system) or an unusual user account. Legitimate access would typically include system or administrative users, whereas unusual accounts might indicate a compromised system.

  - **Cross-reference tools execution:** Investigate if any known credential dumping tools (e.g., Mimikatz, NanoDump) are running on the same asset. Check for execution logs or parent-child process relationships via Sysinternals or Sysmon logs (Event ID 1).

  - **Evaluate system security posture:** Determine the role of the affected asset (e.g., domain controller, file server). High-value targets may warrant higher scrutiny and immediate action if signs of dumping are detected.

  - **Assess for artifacts of data extraction:** Look for unusual file creation events in temporary directories, commonly constructed by tools performing dumps (e.g., `C:\Windows\Temp\`). Validate if any dumps or logs appear that could signify data exfiltration attempts.

  ### Prioritization

  This alert carries medium severity due to its potential impact on sensitive credential access, especially in high-value environments like domain controllers. The likelihood of malicious exploitation is significant, as credential dumping techniques are often automated and routinely weaponized during attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by user actions that legitimately access LSASS for admin purposes, such as legitimate debugging activities. A requirement for reliable detection is correctly configured process access logging on the endpoint. This activity could also be a false positive generated by legitimate security tools (e.g., Sysinternals task manager). Companion detections could include monitoring for unusual LSASS memory access timings or privilege escalation attempts following access.

