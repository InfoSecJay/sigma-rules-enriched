title: Suspicious Svchost Process Access
id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
status: test
description: Detects suspicious access to the "svchost" process such as that 
  used by Invoke-Phantom to kill the thread of the Windows event logging 
  service.
references:
- https://github.com/hlldz/Invoke-Phant0m
- https://twitter.com/timbmsft/status/900724491076214784
author: Tim Burrell
date: 2020-01-02
modified: 2023-01-30
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: ':\Windows\System32\svchost.exe'
    GrantedAccess: '0x1F3FFF'
    CallTrace|contains: 'UNKNOWN'
  filter_main_msbuild:
    SourceImage|contains: ':\Program Files\Microsoft Visual Studio\'
    SourceImage|endswith: '\MSBuild\Current\Bin\MSBuild.exe'
        # Just to make sure it's "really" .NET :)
    CallTrace|contains:
    - 'Microsoft.Build.ni.dll'
    - 'System.ni.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects excessive access requests to the `svchost.exe` process, particularly those that may be indicative of attempts to manipulate or terminate essential Windows services, such as the event logging service. The primary attacker objective is likely to disable logging or cover their tracks by killing critical services that facilitate forensic analysis. Relevant MITRE ATT&CK tactics include Defense Evasion (TA0005) and specifically the technique T1562.002 (Impair Defense Mechanism).

  The primary telemetry source for this detection is the Windows process access logs, specifically anything tracking access requests to `svchost.exe`. Malicious interactions may allow an attacker to disrupt services or obfuscate their activity, creating an increased risk for lateral movement or persistence. Importantly, this detection does NOT confirm that a compromise has occurred or that the observed activity is inherently malicious; further investigation is necessary.

  ### Investigation Steps

  - **Check process access logs:** Review Security Event ID 4672 and Sysmon Event ID 3 for any access attempts to `svchost.exe` (typically found at `C:\Windows\System32\svchost.exe`). Identify if the granted access level is `0x1F3FFF`, indicating high-level access permissions potentially used for malicious intent.

  - **Evaluate the caller process:** Examine the `SourceImage` field related to access attempts. Legitimate calls should typically originate from trusted Microsoft processes (e.g., Visual Studio MSBuild) and not from unexpected or suspicious applications.

  - **Review CallTrace details:** Inspect the `CallTrace` for the presence of `UNKNOWN` entries. Determine what processes or services were attempting access to `svchost.exe`, noting any inaccuracies that point to possible evasion.

  - **Identify historical service status:** Use the Windows event logs to check the status of Windows services, particularly the event logging service. Relevant Event ID 1102 indicates when the audit log was cleared, which may coincide with `svchost.exe` accesses. Compare timings to find suspicious patterns.

  - **Correlate with other alerts:** Look for any companion detections regarding abnormal service terminations (e.g., Event ID 7036) or similar access patterns. Such correlations can provide context on whether access behaviors have been repeated or are part of wider suspicious activities.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on critical system functions and security logging mechanisms. The likelihood of malicious abuse is significant, as attackers often target `svchost.exe` to impair system defenses. This behavior aligns closely with known adversary techniques used for evasion in real-world attacks.

  ### Blind Spots and Assumptions

  Limitations of this detection may arise from legitimate administrative actions or valid software development activities that necessitate high-level access to services. Ensuring comprehensive logging configurations, including Sysmon, is essential for reliable detection. Additionally, legitimate applications may trigger this alert if they improperly interact with `svchost.exe`. A related detection, such as monitoring for abnormal service status changes, could enhance coverage and context during investigations.

