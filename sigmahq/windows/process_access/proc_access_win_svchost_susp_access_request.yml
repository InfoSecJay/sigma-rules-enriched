title: Suspicious Svchost Process Access
id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
status: test
description: Detects suspicious access to the "svchost" process such as that used
  by Invoke-Phantom to kill the thread of the Windows event logging service.
references:
- https://github.com/hlldz/Invoke-Phant0m
- https://twitter.com/timbmsft/status/900724491076214784
author: Tim Burrell
date: 2020-01-02
modified: 2023-01-30
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: ':\Windows\System32\svchost.exe'
    GrantedAccess: '0x1F3FFF'
    CallTrace|contains: 'UNKNOWN'
  filter_main_msbuild:
    SourceImage|contains: ':\Program Files\Microsoft Visual Studio\'
    SourceImage|endswith: '\MSBuild\Current\Bin\MSBuild.exe'
        # Just to make sure it's "really" .NET :)
    CallTrace|contains:
    - 'Microsoft.Build.ni.dll'
    - 'System.ni.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects suspicious access to the `svchost.exe` process on Windows systems, particularly focusing on activities that may indicate misuse, such as those employed by the Invoke-Phantom tool. Invoke-Phantom is known for executing stealthy actions, including terminating the Windows event logging service threads, which is indicative of an attacker attempting to evade detection by preventing log generation. The primary threat scenario involves attackers leveraging this technique to obscure malicious activities and maintain persistence while avoiding security oversight.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), specifically technique **Process Injection** (T1055) and its sub-technique **Process Hollowing** (T1562.002). Attackers may seek to manipulate legitimate processes to run their code, thereby bypassing traditional security mechanisms. The primary telemetry for identifying such threats includes **process access logs**, which provide insights into the interactions with system processes, and **event logging**, which is crucial for understanding the actions taken prior to the evasion attempt.

  ### Investigation Steps
  - **Review Process Access Logs:** Examine logs for suspicious access attempts to `svchost.exe` that match the specified granted access rights. Look for anomalous patterns or unexpected source processes.
  - **Analyze Call Trace Data:** Investigate the call trace to identify any suspicious modules or unexpected behavior that could indicate malicious manipulation of `svchost.exe`.
  - **Correlate with Event Logs:** Cross-reference investigations with Windows Event Logs to determine if there were any abnormal logs that were prematurely terminated or missed, particularly around the time of the suspicious process access.
  - **Check for Invoke-Phantom Artifacts:** If known indicators of compromise (IOCs) related to Invoke-Phantom are discovered, further analyze the system for other signs of intrusion or lateral movement within the network.

  ### Prioritization
  This alert is prioritized as high severity due to the significant potential impact of successfully evading detection mechanisms using techniques like those executed by Invoke-Phantom. The likelihood of such an event occurring increases in environments where sophisticated threat actors are active, making it critical for immediate investigation.

  ### Blind Spots and Assumptions
  This detection logic may not cover all forms of process manipulation or injection techniques, presenting a gap in detecting varied suspicious behaviors. It assumes that logging mechanisms are active and correctly configured to capture process access events and related call trace data. Environments without comprehensive process monitoring or those with restrictive log retention policies could miss signs of potential compromises, limiting the effectiveness of this rule.

