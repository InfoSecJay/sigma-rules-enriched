title: Suspicious Svchost Process Access
id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
status: test
description: Detects suspicious access to the "svchost" process such as that used
  by Invoke-Phantom to kill the thread of the Windows event logging service.
references:
- https://github.com/hlldz/Invoke-Phant0m
- https://twitter.com/timbmsft/status/900724491076214784
author: Tim Burrell
date: 2020-01-02
modified: 2023-01-30
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: ':\Windows\System32\svchost.exe'
    GrantedAccess: '0x1F3FFF'
    CallTrace|contains: 'UNKNOWN'
  filter_main_msbuild:
    SourceImage|contains: ':\Program Files\Microsoft Visual Studio\'
    SourceImage|endswith: '\MSBuild\Current\Bin\MSBuild.exe'
        # Just to make sure it's "really" .NET :)
    CallTrace|contains:
    - 'Microsoft.Build.ni.dll'
    - 'System.ni.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious access to the "svchost.exe" process, indicating potential abuse of this legitimate Windows service host process. The likely attacker objective is to disrupt logging mechanisms or escalate privileges by targeting critical system processes. This behavior aligns with the MITRE ATT&CK technique for "Process Injection" (T1055) and "Indicator Removal on Host" (T1562.002). Primary telemetry sources include Windows Security Event IDs 4688 (process creation) and 4657 (registry value modified), and Sysmon Event ID 10 (process access). If malicious, this activity can allow an adversary to conceal traces of their actions and manipulate system processes directly. Importantly, this detection does NOT confirm malicious behavior on its own, as there are legitimate use cases for accessing svchost.exe.

  ---

  ### Investigation Steps

  - **Correlate with Process Creation Events:** Review Security Event ID 4688 logs for the creation of svchost.exe. Check the parent process ID and source image to identify any anomalous behavior associated with this process.

  - **Examine Granted Access Rights:** Validate the specifics of the access rights by examining the process access logs. Specifically, look for logs indicating "GrantedAccess: '0x1F3FFF'" to determine if elevated privileges are being sought.

  - **Identify Anomalous Call Traces:** Check Sysmon Event ID 10 for processes that contain 'UNKNOWN' in the CallTrace field to highlight any unexpected access patterns. Look for legitimate process identifiers that do not correlate with known trusted applications.

  - **Review Legitimate Use Cases:** Establish an understanding of expected behavior by identifying applications that commonly interact with svchost.exe, such as Windows Update or security software, to differentiate known good from potentially malicious activity.

  - **Cross-reference with MSBuild Usage:** If MSBuild.exe (found in 'Program Files\Microsoft Visual Studio\MSBuild\Current\Bin') is present as the source image, investigate the context of its execution to confirm that it correlates with legitimate development activities without suspicious access patterns.

  - **Check for Anti-Forensic Moments:** Assess for any signs of altered logging or modified system files that could indicate an adversary trying to evade detection. Validate any recent changes or anomalies around logging mechanisms that would be indicative of attempts to remove indicators of compromise.

  ---

  ### Prioritization

  This alert has high severity due to its potential impact on critical system processes and the likelihood of malicious activity targeting process manipulation for stealth or privilege escalation. Such behaviors are often weaponized in advanced persistent threat (APT) scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for evasion tactics, such as legitimate tools being used maliciously (e.g., scheduled tasks). Comprehensive logging configurations are necessary for reliable detection; absence of Sysmon logs may lead to undetected malicious actions. Legitimate Windows services and trusted applications might trigger this alert, necessitating thorough contextual investigation. A related detection to strengthen coverage includes monitoring for anomalous service creation or modification events (e.g., Event ID 7045).

