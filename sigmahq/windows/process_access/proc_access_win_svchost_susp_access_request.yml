title: Suspicious Svchost Process Access
id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
status: test
description: Detects suspicious access to the "svchost" process such as that 
  used by Invoke-Phantom to kill the thread of the Windows event logging 
  service.
references:
- https://github.com/hlldz/Invoke-Phant0m
- https://twitter.com/timbmsft/status/900724491076214784
author: Tim Burrell
date: 2020-01-02
modified: 2023-01-30
tags:
- attack.defense-impairment
- attack.t1685.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: ':\Windows\System32\svchost.exe'
    GrantedAccess: '0x1F3FFF'
    CallTrace|contains: 'UNKNOWN'
  filter_main_msbuild:
    SourceImage|contains: ':\Program Files\Microsoft Visual Studio\'
    SourceImage|endswith: '\MSBuild\Current\Bin\MSBuild.exe'
        # Just to make sure it's "really" .NET :)
    CallTrace|contains:
    - 'Microsoft.Build.ni.dll'
    - 'System.ni.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized access attempts to the `svchost.exe` process on Windows systems, particularly focusing on high-risk access rights (i.e., `0x1F3FFF`), which can indicate attempts to manipulate or terminate critical Windows services like the event logging service. This behavior generally aligns with an adversary's objective of evading detection and maintaining persistence by disrupting logging mechanisms. The relevant MITRE ATT&CK technique is T1685.001: **Defensive Evasion: Service Stop**.

  Primary telemetry sources include Windows Process Access logs, specifically focusing on access to the process ID of `svchost.exe`. Should this activity be malicious, it could result in decreased visibility into system events and logs, potentially assisting an attacker in their operations. Importantly, this detection does NOT confirm that a successful attack has occurred; it merely indicates potentially malicious access attempts.

  ### Investigation Steps

  - **Check process access logs:** Review Security Event ID 4656 for access to `C:\Windows\System32\svchost.exe`. Benign behavior typically shows standard access patterns from system services or legitimately installed software.
  - **Analyze granted access rights:** Identify if `GrantedAccess` equals `0x1F3FFF`. This specific access level is concerning and could indicate an attempt to gain full control over the svchost process.
  - **Examine the CallTrace context:** Verify if `CallTrace` contains 'UNKNOWN'. Legitimate use cases, like the expected workload of system maintenance, will have identifiable call parameters indicating normal operational behavior.
  - **Evaluate source of the access attempt:** Review the `SourceImage` field for involvement of `MSBuild.exe` from `C:\Program Files\Microsoft Visual Studio\`. If this is confirmed, look for anomalies in the expected usage of MSBuild.
  - **Correlate with other activity:** Check for concurrent activity involving process creation (e.g., Event ID 4688) that might indicate the launching of suspicious executables or scripts in close temporal proximity.
  - **Determine asset criticality:** If the affected `svchost` process is on a critical server (e.g., Domain Controllers, Database servers), escalate the findings accordingly due to higher risk implications.

  ### Prioritization

  This alert is considered high severity due to its implications on the security posture of the environment. Any malicious activity targeting svchost processes can jeopardize foundational services and might indicate an active adversary attempting to impair defenses. The likelihood of exploitation in the wild is significant, especially in environments lacking robust monitoring.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques such as directly interfacing with the Windows API without invoking normal process access pathways. Additionally, for effective detection, Windows auditing must be correctly configured to capture Process Access events. Legitimate applications may trigger this alert during debugging or benign service manipulations, particularly during software development using Visual Studio. A related detection to consider is monitoring abnormal service stop events (e.g., Event ID 7036) which could further bolster alert validation in these contexts.

