title: Uncommon Process Access Rights For Target Image
id: a24e5861-c6ca-4fde-a93c-ba9256feddf0
status: test
description: |
  Detects process access request to uncommon target images with a "PROCESS_ALL_ACCESS" access mask.
references:
- https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2024-05-27
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055.011
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith:
            # Note: Add additional uncommon targets to increase coverage.
    - '\calc.exe'
    - '\calculator.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\ping.exe'
    - '\wordpad.exe'
    - '\write.exe'
    GrantedAccess: '0x1FFFFF'     # PROCESS_ALL_ACCESS - All possible access rights for a process object.
  condition: selection
falsepositives:
- Unknown
# Note: please upgrade to a higher level after an initial test/tuning.
level: low
note: |
  ### Technical Context

  This Sigma rule detects attempts to access processes (specifically common user applications) with excessive permissions, indicated by the "PROCESS_ALL_ACCESS" flag. The likely objective of an adversary triggering this alert is to escalate privileges or manipulate these processes for malicious purposes, such as injecting code or altering behavior. This detection maps to the MITRE ATT&CK framework under the tactic of Privilege Escalation (TA0004) and the technique of Process Injection (T1055.011).

  The primary telemetry sources are Windows process access logs, specifically looking at Event ID 4656 ("A handle to an object was requested") and potentially Sysmon Event ID 10 ("ProcessAccess"). A successful malicious access could allow an attacker to manipulate or evade detection by interacting with high-privilege processes. However, it is important to note that this detection does NOT confirm malicious intent on its own; it merely indicates that an uncommon access attempt has occurred.

  ### Investigation Steps

  - **Check Event IDs 4656 and 10:** Review Windows Security logs (Event ID 4656) for access requests to identified target images. Look for matches with "GrantedAccess" value '0x1FFFFF' and assess the requester's user account and the process ID involved.

  - **Identify the Source Process:** On the affected system, determine which process initiated the access request by cross-referencing with Event ID 4688 ("A new process has been created"). Investigate if the source process is legitimate or known for malicious activity.

  - **Correlate Access Timing:** Examine the time of the access request against other relevant logs, such as user logon events (Event ID 4624) and process creation logs (Event ID 4688) to understand the context of the activity during that period. Legitimate user activity should align with known working hours and application usage.

  - **Assess User Account Anomalies:** Review user account activity for the account initiating the request. Identify any abnormal behavior, such as access outside of normal hours or a lack of user-to-application correlation, indicating possible credential theft or lateral movement attempts.

  - **Validate Process Integrity:** Check for known benign instances of the identified target images running on the system. If these processes are running with excess privileges alongside unusual parent-child relationships, this could indicate potential exploitation or misuse.

  - **Review File System Changes:** Investigate for any simultaneous changes or temptations in sensitive directories where the target processes reside, such as Program Files or AppData. Look for artifacts that indicate file tampering or binary replacement.

  ### Prioritization

  The alert is categorized as low severity due to the common use of these target processes in legitimate settings; however, the high permissions requested raise concerns for potential abuse. Since the behavior detected is consistent with common exploit techniques, continued investigation is advised, especially in persistent actors or high-privilege targets.

  ### Blind Spots and Assumptions

  This detection may bypass legitimate administrative actions, like system monitoring tools that require such access for functionality. It relies on the availability of relevant logs; therefore, proper Windows auditing configurations must be enforced to capture all process access events. Furthermore, legitimate automation scripts could inadvertently trigger this alert. To strengthen coverage, consider companion detections that monitor for anomalous user activity or process creation events that may correlate with this suspicious access.

