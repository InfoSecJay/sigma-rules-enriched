title: Uncommon Process Access Rights For Target Image
id: a24e5861-c6ca-4fde-a93c-ba9256feddf0
status: test
description: |
  Detects process access request to uncommon target images with a "PROCESS_ALL_ACCESS" access mask.
references:
- https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2024-05-27
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055.011
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith:
            # Note: Add additional uncommon targets to increase coverage.
    - '\calc.exe'
    - '\calculator.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\ping.exe'
    - '\wordpad.exe'
    - '\write.exe'
    GrantedAccess: '0x1FFFFF'     # PROCESS_ALL_ACCESS - All possible access rights for a process object.
  condition: selection
falsepositives:
- Unknown
# Note: please upgrade to a higher level after an initial test/tuning.
level: low
note: |
  ### Technical Context

  This Sigma rule detects process access requests to common Windows applications (e.g., calc.exe, mspaint.exe) where the requesting process is attempting to obtain `PROCESS_ALL_ACCESS` privileges. This behavior is indicative of potential privilege escalation or malicious activity by an adversary attempting to manipulate or interact with benign processes for malicious objectives such as persistence, credential harvesting, or executing further attacks.

  The relevant MITRE ATT&CK tactic is **Privilege Escalation** (TA0004), with the technique being **Access Token Manipulation** (T1055.011). The primary telemetry source for this detection is process access logs from Windows Event IDs, specifically looking at process access attempts. If the rule triggers, it suggests significant security implications as an unauthorized entity may be attempting to gain elevated permissions on a system.

  However, this detection does NOT confirm malicious activity on its own. It should be contextualized with additional investigation to determine the intent behind the access request.

  ### Investigation Steps

  - **Verify the requesting process:** Examine Event ID 4656 or Sysmon Event ID 10 logs to identify the process attempting access. Look for known benign processes; legitimate user applications should not request such extensive rights on unintended targets.

  - **Check the user context:** Review the user account associated with the access request in Event ID 4672 logs. If the initiator is a non-admin user account performing actions on system processes, it raises suspicion.

  - **Correlate access pattern with common legitimate use cases:** Identify normal user behavior by reviewing typical user interaction logs for the target image (e.g., Event ID 4688 for process creation), which should show expected applications being used without privileged requests.

  - **Analyze process privilege levels:** Compare the requested access level (PROCESS_ALL_ACCESS) using Sysmon Event ID 10. If the access level is disproportionately high for the process context, it may indicate an attempted escalation.

  - **Seek out exploit indicators:** Look for additional artifacts such as malware signatures or known attacks targeting the identified processes by matching hashes against threat intelligence feeds.

  - **Evaluate system criticality:** Assess whether the affected system runs security-sensitive applications or holds critical data. Systems with higher criticality may warrant a more cautious and expedited investigation.

  ### Prioritization

  The severity of this alert should be treated as moderate. The presence of `PROCESS_ALL_ACCESS` requests against common applications can indicate privilege escalation attempts, which are often leveraged by adversaries. While this behavior can be benign in certain contexts, the potential impact on sensitive systems increases the urgency of investigation.

  ### Blind Spots and Assumptions

  This detection might miss cases where attackers use less common access methods or legitimate tools that mimic benign processes. Reliable detection requires logging of all process access attempts, including Event ID 4656, to ensure comprehensive coverage. Common legitimate activities, such as software updates or administrative change management, may trigger alerts. A related detection to strengthen coverage would be monitoring for anomalous process creation (Sysmon Event ID 1), offering additional context to potential privilege escalation attempts.

