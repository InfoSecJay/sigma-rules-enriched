  ---

  ### Technical Context

  This Sigma rule detects requests for access to uncommon target images (such as calculator or paint applications) with a "PROCESS_ALL_ACCESS" access mask, indicating a potential attempt to escalate privileges or manipulate processes that are typically benign. The likely attacker objective could involve gaining control over processes to conduct further malicious activities, including injection or local privilege escalation. This detection aligns with MITRE ATT&CK technique T1055.011 (Process Injection).

  The primary telemetry sources include Windows process access logs. Specific log types include Security Event ID 4663, which records process access events, detailing the target image and access permissions granted. If malicious, this activity can lead to unauthorized actions against critical processes. However, this detection does NOT confirm that access attempts were successful or provided a foothold in the environment.

  ---

  ### Investigation Steps

  - **Review relevant access logs:** Check Security Event Log for Event ID 4663 to identify process access attempts involving 'calc.exe', 'mspaint.exe', etc. Look for access masks indicating '0x1FFFFF' (PROCESS_ALL_ACCESS).

  - **Correlate with known benign activity:** Cross-reference the detection with typical user behavior. For example, standard user tasks involving these applications should show access requests with limited permissions rather than PROCESS_ALL_ACCESS.

  - **Analyze associated process IDs:** Investigate the parent process IDs (PPIDs) in the access logs. Determine if the parent processes are legitimate (e.g., a user-initiated application) or indicative of potential malicious workflows.

  - **Assess user context:** Identify the user account associated with the access requests and check for any anomalous behavior or previously flagged accounts with a history of unauthorized actions.

  - **Check for creation of suspicious artifacts:** Look into temporary files or memory artifacts created during the access request period. Validation can be done via Sysmon Event ID 10 for file creation if the target image was involved in script execution.

  - **Identify high-confidence malicious indicators:** Look for evidence of repeated access attempts to these uncommon target images from non-interactive sessions (e.g., service accounts or automated scripts). This can indicate automated attempts to escalate privileges.

  ---

  ### Prioritization

  The severity of this alert is moderate. While the affected processes are typically benign, the use of PROCESS_ALL_ACCESS indicates a high likelihood of malicious activity, especially in enterprise contexts where normal users do not require such extensive access to these applications. This behavior is not commonly weaponized, but it can indicate preparatory steps for attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of noisy legitimate activity involving these applications; users could unintentionally trigger the alert while performing standard tasks. Additionally, the absence of detailed logging configurations may lead to missed detections. Legitimate software upgrades or administrative actions could also initiate such access requests. A related detection for actual process injection attempts (e.g., T1055) could bolster coverage and context for further investigations.

