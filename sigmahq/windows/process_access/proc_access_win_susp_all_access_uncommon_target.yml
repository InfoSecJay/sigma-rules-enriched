title: Uncommon Process Access Rights For Target Image
id: a24e5861-c6ca-4fde-a93c-ba9256feddf0
status: test
description: |
  Detects process access request to uncommon target images with a "PROCESS_ALL_ACCESS" access mask.
references:
- https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2024-05-27
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055.011
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith:
            # Note: Add additional uncommon targets to increase coverage.
    - '\calc.exe'
    - '\calculator.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\ping.exe'
    - '\wordpad.exe'
    - '\write.exe'
    GrantedAccess: '0x1FFFFF'     # PROCESS_ALL_ACCESS - All possible access rights for a process object.
  condition: selection
falsepositives:
- Unknown
# Note: please upgrade to a higher level after an initial test/tuning.
level: low
note: |
  ### Technical Context
  This detection rule identifies attempts to access specific uncommon processes while requesting all possible access rights (PROCESS_ALL_ACCESS). The processes monitored include non-administrative utilities such as `calc.exe`, `notepad.exe`, and `mspaint.exe`. These processes are normally not targeted by legitimate users for administrative tasks, which raises the suspicion of potential malicious activity. Attackers may leverage such behavior to either escalate their privileges or disguise their actions as benign operations, masking their true intent.

  In the context of MITRE ATT&CK, this detection aligns with the following tactics and techniques:
  - **Defense Evasion** (T1565) - By manipulating access to common, benign applications, an attacker may try to avoid detection while performing malicious activities.
  - **Privilege Escalation** (T1055.011) - The use of PROCESS_ALL_ACCESS can indicate an attempt to gain elevated privileges or perform actions typically restricted to higher privilege levels.

  The primary data sources for this detection include process access logs from Windows security events, which capture attempts to access processes and the associated access rights requested.

  ### Investigation Steps
  - **Review Process Access Logs:** Examine the logs for instances of "PROCESS_ALL_ACCESS" requests to the uncommon target images identified in the rule. Look for patterns or repeated access attempts that deviate from normal user behavior.
  - **Identify User Context:** For any suspicious access attempts, analyze the user accounts involved. Determine if these accounts have been previously associated with normal behavior or if any anomalous login patterns exist.
  - **Inspect Related System Events:** Correlate the identified process access attempts with other system events, such as process creation or modification logs, to provide context about what actions may have occurred around the same time.
  - **Check for Additional Indicators:** Investigate if other malicious behaviors accompany these access requests, such as attempts to load or execute scripts related to known malware or unexpected network connections.

  ### Prioritization
  This alert has a low severity level but should still be treated with caution. While uncommon process access does not guarantee malicious activity, the potential for privilege escalation and evasion tactics raises the threat level significantly in a sensitive enterprise environment, particularly if the observed behavior is tied to privileged user accounts.

  ### Blind Spots and Assumptions
  The detection logic may not cover all potential process access scenarios, especially if uncommon target images are not included in the list of monitored processes. It assumes that typical user behavior does not include accessing these specific applications with high-level permissions. Additionally, the efficacy of this rule relies on the availability of adequate logging from Windows process access events, which must be properly configured to capture these types of interactions.

