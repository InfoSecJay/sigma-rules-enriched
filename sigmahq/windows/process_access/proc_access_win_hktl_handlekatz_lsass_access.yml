title: HackTool - HandleKatz Duplicating LSASS Handle
id: b1bd3a59-c1fd-4860-9f40-4dd161a7d1f5
status: test
description: Detects HandleKatz opening LSASS to duplicate its handle to later 
  dump the memory without opening any new handles
references:
- https://github.com/codewhitesec/HandleKatz
author: Bhabesh Raj (rule), @thefLinkk
date: 2022-06-27
modified: 2023-11-28
tags:
- attack.execution
- attack.t1106
- attack.defense-evasion
- attack.t1003.001
- attack.credential-access
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'     # Theoretically, can be any benign process holding handle to LSASS
    GrantedAccess: '0x1440'     # Only PROCESS_DUP_HANDLE, PROCESS_QUERY_LIMITED_INFORMATION, PROCESS_QUERY_INFORMATION
        # Example: C:\Windows\SYSTEM32\ntdll.dll+9d234\|UNKNOWN(00000000001C119B)
    CallTrace|startswith: 'C:\Windows\System32\ntdll.dll+'
    CallTrace|contains: '|UNKNOWN('
    CallTrace|endswith: ')'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the usage of the HandleKatz tool, which opens a handle to the Local Security Authority Subsystem Service (LSASS) process to duplicate its handle. The likely attacker objective is to extract sensitive credentials stored in memory without creating new handles, making detection difficult. This activity falls under the MITRE ATT&CK framework technique **T1003.001: Credential Dumping - LSASS Memory** and the associated tactic **Execution (TA0002)**. The primary telemetry sources are Windows process access logs, particularly looking for Event IDs related to process handle duplication. If detected, this behavior could indicate a severe breach, compromising user credentials and potentially leading to further lateral movement. This detection does NOT confirm that credentials have been successfully extracted but indicates an attempt to access sensitive data.

  ### Investigation Steps

  - **Check process access logs:** Review Windows Security Event ID 4663 and Sysmon Event ID 10 for access attempts on `lsass.exe` with `GrantedAccess` containing `0x1440`, indicating a handle duplication attempt.

  - **Analyze the CallTrace:** Examine the CallTrace in process access logs for all events involving `lsass.exe`. Look for patterns starting with `C:\Windows\System32\ntdll.dll+`, confirming the use of code paths typical of handle duplication techniques.

  - **Identify benign activities:** Verify whether legitimate administrative tools (e.g., Windows Credential Manager) were used in proximity to the alert timing. Likely benign behavior would involve processes like `taskmgr.exe` or `mspmsnsv.exe` querying `lsass.exe` handles with `GrantedAccess` values indicating limited information queries.

  - **Look for high-confidence malicious indicators:** Confirm any process showing abnormal access patterns to `lsass.exe` combined with an unusual user account performing the action that is not typically associated with such privileged activities.

  - **Assess host-level impact:** Identify if the detection occurred on a critical asset such as a Domain Controller. Any alert on these hosts should be treated with higher urgency due to the elevated risk of credential compromise.

  - **Monitor for file creation:** Examine for the presence of any new files in temporary directories or unexpected outputs created by the potential execution of HandleKatz, looking specifically for patterns indicative of credential dumping tools.

  ### Prioritization

  The alert severity is high due to the criticality of the LSASS process in maintaining system security and user credential protection. Given the specific behavior exhibited by HandleKatz, it indicates a strong likelihood of malicious intent attempting to extract sensitive information. This technique is commonly weaponized in credential theft campaigns, emphasizing the need for immediate investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for attackers to use legitimate administrative tools or permissions, and there may be evasion techniques such as using alternative credential harvesting methods that do not trigger this rule. Reliable detection requires a complete and properly configured logging setup that captures detailed process access events. Activities like legitimate remote support tools or administrative scripts accessing `lsass.exe` may accidentally trigger this alert. Companion detections could include monitoring for suspicious PowerShell commands or interactions with credential management APIs, enhancing overall detection coverage.

