logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'     # Theoretically, can be any benign process holding handle to LSASS
    GrantedAccess: '0x1440'     # Only PROCESS_DUP_HANDLE, PROCESS_QUERY_LIMITED_INFORMATION, PROCESS_QUERY_INFORMATION
        # Example: C:\Windows\SYSTEM32\ntdll.dll+9d234\|UNKNOWN(00000000001C119B)
    CallTrace|startswith: 'C:\Windows\System32\ntdll.dll+'
    CallTrace|contains: '|UNKNOWN('
    CallTrace|endswith: ')'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  The Sigma rule detects instances where an application attempts to duplicate a handle of the Local Security Authority Subsystem Service (LSASS) process, which is a common technique used by attackers to facilitate credential harvesting. The likely attacker objective is to gain unauthorized access to sensitive information, such as passwords, stored in LSASS memory without triggering security alerts associated with traditional methods of memory dumping. This behavior aligns with the MITRE ATT&CK framework under the technique "Process Injection" (T1106) and "Credential Dumping: LSASS Memory" (T1003.001). The primary telemetry sources include Windows process access logs, specifically focusing on Event ID 10 that captures handle operations and other relevant fields that indicate access to LSASS.

  If successful, this action could severely impact security by allowing attackers to obtain sensitive credentials that can lead to further compromise of the environment. Importantly, this detection does not confirm that the memory was successfully dumped or that the attacker has actually acquired credentials; it merely indicates that an attempt was made to duplicate the LSASS handle.

  ### Investigation Steps

  - **Check Event ID 10 Logs for Handle Duplication:** Search for Windows Event ID 10 logs that correspond to handle duplication attempts specifically targeting `lsass.exe`. Look for logs with `GrantedAccess` equal to `0x1440`, indicating permission for duplicating the handle.

  - **Analyze Call Trace for Anomalies:** Review the `CallTrace` field in the process access logs for entries that start with `C:\Windows\System32\ntdll.dll+` and contain `|UNKNOWN(`. Validate if the call seems to originate from unexpected or non-standard processes.

  - **Identify Expected Behavior from Known Processes:** Confirm expected behavior by cross-referencing other processes that may legitimately access LSASS (e.g., system utilities or admin tools). Document the typical access patterns and process trees for benchmarking.

  - **Correlate with Memory Dump Activity:** Investigate if there were any follow-up events indicating memory dumping activities, such as `Event ID 4697`, which records the creation of new services that could indicate that a credential dump tool was initiated.

  - **Review Remote Access Tools:** Check for the execution of known Remote Access Tools (RATs) or post-exploitation frameworks that can leverage LSASS handle duplication, searching for specific hashes or file paths associated with tools like Mimikatz or other credential dumping utilities.

  - **Assess for Clean-up Indicators:** Examine logs for any signs of process termination or clean-up actions post-handle duplication, which can be a hallmark of an attacker attempting to erase their tracks, indicating potential malicious behavior.

  ### Prioritization

  Given the high security impact of LSASS handle duplication, the severity of this alert is classified as high. The likelihood of malicious abuse is elevated due to the common use of this technique in credential theft. This behavior is frequently weaponized by attackers, making rapid investigation essential.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate administrative tools that also duplicate handles to LSASS out of necessity. Reliable detection requires comprehensive logging configurations, particularly for process access and handle duplication events. Legitimate activities, such as system maintenance or authorized password recovery by admins, may trigger this alert. Companion detections, such as monitoring for direct memory access attempts or unusual service creation events following this handle duplication, can enhance overall coverage against credential dumping activities.

