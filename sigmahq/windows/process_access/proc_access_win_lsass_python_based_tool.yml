note: |
  ### Technical Context

  This Sigma rule detects unauthorized access to the LSASS process using Python-based tools, commonly associated with credential dumping. The likely attacker objective is to retrieve sensitive information such as usernames and passwords from memory, facilitating account takeover or lateral movement. This behavior falls under the MITRE ATT&CK framework's "Credential Access" tactic, specifically technique T1003.001 (Credential Dumping: LSASS Memory).

  The primary telemetry source is Windows process access logs, particularly those capturing process interactions with LSASS (Local Security Authority Subsystem Service). If malicious, this activity can lead to compromised credentials, enabling further unauthorized access to systems and data. Importantly, this detection does NOT confirm that credential dumping has occurred without further corroborating evidence.

  ### Investigation Steps

  - **Examine process access logs:** Search for a process access event (Process ID or Event ID) where the target image is `lsass.exe` and `GrantedAccess` equals `0x1FFFFF` for potential unauthorized access.

  - **Review call traces for indicators of compromise:** Check logs for CallTrace entries containing `python27.dll+` or `python3*.dll+`, indicating the use of Python-based tools. Compare with legitimate software installations to identify anomalies.

  - **Identify expected LSASS interactions:** Legitimate system processes often access LSASS under normal operations (like system updates). Look for known software behavior or system processes that can correlate with expected LSASS access, such as Microsoft services.

  - **Evaluate authorization contexts:** Confirm whether the user or process attempting access has the necessary permissions. Look for unexpected or unauthorized accounts attempting access.

  - **Correlate with remote access logs:** Investigate whether the system has had recent remote access sessions, particularly from unknown hosts. Check authentication logs (Event ID 4624) for unusual logins preceding the alert.

  ### Prioritization

  This alert is of high severity due to potential impact on sensitive systems and the likelihood of malicious abuse, as credential dumping is a common technique used in lateral movement attacks. The use of Python-based tools for this purpose suggests sophistication in the attack method.

  ### Blind Spots and Assumptions

  Detection may miss credential dumping attempts using different programming languages or methods that do not involve Python and LSASS access. Accurate detection requires proper auditing settings on endpoints to capture all relevant process access logs. The alert could also be triggered by legitimate administrative tools or scripts performing necessary functions on the LSASS process. Companion alerts for suspicious remote access or unusual account behavior can improve coverage.

