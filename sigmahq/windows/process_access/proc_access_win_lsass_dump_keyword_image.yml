    - 'FF'
  condition: selection
falsepositives:
- Rare programs that contain the word dump in their name and access lsass
level: high
note: |
  ### Technical Context
  This detection rule identifies unauthorized access to the LSASS (Local Security Authority Subsystem Service) process by tools that have "dump" included in their image names. Attackers often target the LSASS process to extract sensitive authentication information, including user credentials, which can be exploited for lateral movement or privilege escalation within a Windows environment. By monitoring for processes attempting to access LSASS with the intent to perform credential dumping, security teams can swiftly mitigate potential credential theft.

  The primary threat scenario involves attackers utilizing various tools, sometimes purposely named to evade detection (e.g., including the word "dump"), to gain access to sensitive credentials held in memory. Given the critical role of LSASS in the security framework of Windows, any unauthorized attempts to interact with it may indicate an ongoing credential harvesting operation. This aligns with several MITRE ATT&CK tactics, specifically the Credential Access tactic (TA0006) and its associated technique T1003.001, which details the method of credential dumping from LSASS.

  Relevant data sources for this detection include process access logs, which record all access attempts to processes, especially LSASS. These logs can provide vital insights into the source processes trying to access LSASS and their corresponding permissions.

  ### Investigation Steps
  - **Review Process Access Logs:** Analyze process access logs focusing on access attempts to `lsass.exe`. Identify source processes that contain the keyword "dump" in their names and note any unusual access patterns.

  - **Validate Source Image Behavior:** Correlate the source process name with known legitimate software to ascertain if it is commonly benign or potentially malicious. Research any unknown or uncommon processes that accessed LSASS.

  - **Assess Granted Access Levels:** Investigate the levels of access granted to the source processes. Focus on those that possess high privilege levels associated with memory access, as indicated by specific hexadecimal values in the logs.

  - **Check for Other Indicators of Compromise:** Look for additional signs or behaviors in the environment that may corroborate credential dumping attempts, such as unusual account logins, spikes in failed access attempts, or other suspicious process interactions.

  ### Prioritization
  The alert is classified as high severity due to the critical nature of LSASS in maintaining system security. The ability to dump credentials from this process significantly raises the likelihood of successful unauthorized access, leading to potential lateral movements and escalated attacks against the enterprise network.

  ### Blind Spots and Assumptions
  This detection may have gaps where malicious tools could evade detection by using names or techniques that do not include "dump" in their names, thus requiring analysts to consider variations of credential dumping methods. The detection logic assumes that targeted processes will indeed have "dump" in their source image names, overlooking custom or renamed malware. Proper logging configurations are essential for capturing detailed process access events, which may not be enabled by default in all environments.

