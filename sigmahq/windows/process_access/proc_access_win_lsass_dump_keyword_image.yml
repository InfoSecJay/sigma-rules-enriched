level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized access attempts to the LSASS (Local Security Authority Subsystem Service) process by any executable that contains the word "dump" in its image name. This behavior is indicative of an attacker attempting to extract sensitive credentials from LSASS to elevate privileges or perform lateral movement within the network. The relevant MITRE ATT&CK technique is Credential Dumping (T1003.001).

  Primary telemetry sources include Windows process access logs, specifically Security Event ID 4656 (Handle Access) and Event ID 4688 (Process Creation). If malicious, this behavior can lead to credential theft and significant security compromise across the enterprise. Importantly, this detection does not confirm that any credentials were successfully dumped or exploited; it only indicates an access attempt.

  ### Investigation Steps

  - **Check the source process name:** Review Security Event ID 4688 for any process that includes "dump" in its image name. Compare this against known benign software that might trigger false positives, such as legitimate backup or data recovery tools.

  - **Review process access logs:** Examine Security Event ID 4656 entries where the TargetImage is `lsass.exe`. Focus on the `GrantedAccess` field to identify legitimate access levels (e.g., normal user processes typically won't have high access rights).

  - **Identify related process activity:** Correlate with Sysmon Event ID 1 to track behavior surrounding the process in question. Look for adjacent suspicious activities like CMD or PowerShell executions that might indicate an ongoing attack.

  - **Benchmark with known good behavior:** Determine if a legitimate application accessed `lsass.exe` by analyzing the behavior of common administrative tools that might legitimately access LSASS for required functions.

  - **Isolate any suspicious executable paths:** Verify the file paths of the image names triggering the alert against repositories of known malicious tools (e.g., Mimikatz, other credential dumping utilities).

  - **Collect evidence of malicious activity:** If high-confidence indicators are confirmed (e.g., execution of a known credential dumping tool), gather all available logs to understand the extent of system compromise and potential data exfiltration.

  ### Prioritization

  The alert is of high severity due to the critical nature of the LSASS process in credential management and potential lateral movement within the environment. The access attempt by any process with "dump" in its name indicates a high likelihood of malicious behavior, as such tools are frequently weaponized for credential theft.

  ### Blind Spots and Assumptions

  Detection may be bypassed by tools designed to obfuscate their activity or by legitimate applications that inadvertently access LSASS, resulting in false positives. Reliable detection requires complete and properly configured logging for process access events and may not detect every credential-dumping scenario. A companion detection rule for monitoring suspicious PowerShell commands (T1059.001) would enhance the overall coverage against credential dumping attempts.

