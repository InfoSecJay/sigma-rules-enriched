  ### Technical Context

  This Sigma rule detects process injection techniques specifically targeting Microsoft Word (winword.exe) executed by a document generated using the LittleCorporal framework. The attacker’s objective is likely to execute malicious code within the context of a trusted application, enabling further compromise without detection. This behavior aligns with the MITRE ATT&CK techniques T1204.002 (Malicious File) and T1055.003 (Process Injection).

  The primary telemetry source is process access logs from Windows, particularly focusing on Event IDs related to process creation, injection activities, and call trace events. If successful, the injection could allow an attacker deeper access into the system, leading to privilege escalation or lateral movement. However, it is important to note that this detection does NOT confirm that the activity is malicious on its own; it requires further investigation and corroboration with additional data sources.

  ### Investigation Steps

  - **Check Event IDs related to winword.exe execution**: Review Windows Security Event ID 4688 logs for the creation of winword.exe. Verify expected users and process parameters for legitimate execution. Look for unusual command line arguments or execution contexts.

  - **Analyze Call Trace logs**: Inspect Sysmon Event ID 8 logs to identify any processes that include call traces with `UNKNOWN` and `v2.` patterns. Note any new or unexpected processes that may indicate an injection attempt.

  - **Verify legitimate activity**: Confirm legitimate use of Microsoft Word, such as document editing or collaboration, by cross-referencing with user activity logs or known document activities. Check for any other Office applications running concurrently, which may indicate regular operations.

  - **Identify malicious indicators**: Look for processes that have a parent-child relationship with winword.exe where `CallTrace` indicates injection patterns, especially the presence of `UNKNOWN`. This is a strong indicator of malicious activity.

  - **Review system criticality**: Consider the role and permissions of the affected system or user. Workstations used for high-level data access (e.g., finance or HR) pose greater risks if an injection is confirmed.

  - **Validate file creation or exfiltration**: Check for unusual file creations or modifications in temporary directories associated with Microsoft Office, particularly under `%TEMP%`. Investigate any exported documents or suspicious file types being created.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems where Microsoft Word is frequently used. The likelihood of malicious abuse is high, especially as this technique is commonly leveraged by adversaries for initial access and persistence. Given the use of a known exploitation tool (LittleCorporal), the behavior is notably weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of specific logging configurations required for complete coverage of process access. Evasion techniques could include the use of process disguises or legitimate document use (e.g., non-malicious macros). Certain legitimate actions, like automated document processing or user coordination for everyday tasks, may trigger this alert without indicating malicious intent. A related detection to consider is monitoring for the execution of known malware frameworks to complement process injection alerts and enhance overall coverage.

