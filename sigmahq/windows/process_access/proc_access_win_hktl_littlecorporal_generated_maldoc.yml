note: |
  ### Technical Context
  This detection rule identifies attempts to inject a LittleCorporal-generated malicious document (maldoc) into the Microsoft Word application (winword.exe). This technique typically involves an adversary leveraging maliciously crafted documents that exploit vulnerabilities in Microsoft Office applications, potentially leading to code execution on the target system. Once the maldoc is executed, attackers can exhibit behaviors aligned with various MITRE ATT&CK techniques, often aiming to establish persistence, exfiltrate data, or escalate privileges.

  The relevant MITRE ATT&CK tactics and techniques that apply here include:
  - **Execution (T1204.002)**: Malicious file execution through user interaction with Office files.
  - **Defense Evasion (T1055.003)**: Process Injection, as the rule aims to detect unauthorized processes attempting to manipulate the Word process for evasion of detection.
  - **Privilege Escalation (Multiple Techniques)**: By leveraging injected code, an attacker may attempt to gain higher privileges in the system.

  Primary data sources for this detection rule include:
  - Process creation events that can capture the execution of Microsoft Word and any combined process injections.
  - API call traces that identify specific functions or patterns indicative of injection behavior.

  ### Investigation Steps
  - **Review Process Access Logs**: Identify any instances of `winword.exe` using an endpoint detection and response (EDR) tool to check for unusual parent-child process relationships or unexpected behavior.

  - **Analyze Call Trace Details**: Examine logs for specific call traces showing injection patterns such as references to `C:\Windows\Microsoft.NET\Framework64\v2.` or entries flagged as `UNKNOWN`, which could indicate the code's attempt to inject.

  - **Correlate with User Activity**: Investigate the timeline of user interactions with documents prior to the execution of the detected processes. Look for anomalous behaviors or irregular file accesses.

  - **Check for Anomalous Network Activity**: Monitor network logs for outbound connections initiated by the `winword.exe` process, which may indicate that the malicious document attempted to exfiltrate data or download additional payloads.

  ### Prioritization
  This alert is considered high severity due to the potential for significant impact on systems and data if the injection is successfully executed. The low likelihood of legitimate business processes generating these call traces ensures that the threat is treated with urgency.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage where similar process injection techniques utilize legitimate applications or tools not monitored by the current logic. This rule assumes that sufficient logs are available to capture both process activity and associated call traces. If integrated logging of all process injections and corresponding actions is not present or configured correctly, it may lead to blind spots. Analysts should ensure that process access and EDR logging are enabled and properly configured for comprehensive visibility.

