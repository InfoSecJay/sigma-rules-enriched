  ### Technical Context

  This rule detects process injection activities associated with a LittleCorporal-generated malicious document (maldoc) leveraging Word's executable process (winword.exe). The likely attacker objective is to execute payloads subtly within a trusted application to evade detection, often leading to privilege escalation or further exploitation. This behavior aligns with the MITRE ATT&CK tactics of Execution (T1204.002) and Privilege Escalation (T1055.003).

  The primary telemetry sources include Windows event logs related to process creation and access events, specifically monitoring the execution of winword.exe and its associated call traces. If this detection proves malicious, it can lead to significant security incidents, potentially compromising sensitive data and user credentials. However, this detection does NOT confirm that the activity is malicious without further investigation.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 for any execution of winword.exe around the timestamp of the alert. Compare with legitimate business operations to ascertain if the process was expected for user tasks (e.g., document editing).

  - **Examine call trace details:** Investigate Windows Sysmon Event ID 10 for the specific call traces indicated. Look for traces containing 'UNKNOWN', which suggest abnormal behavior potentially used for malware injection.

  - **Identify suspicious command-line arguments:** Assess the command-line parameters associated with winword.exe to identify any anomalous or unexpected arguments that could indicate malicious usage.

  - **Cross-reference with known benign entries:** Compare the detected process against a list of approved or regularly used software within the environment to validate legitimacy, focusing on user roles that typically utilize Word, like HR or legal teams.

  - **Monitor for associated artifacts:** Search for newly created files or scripts in common directories (e.g., C:\Users\<username>\AppData\Local\Temp) that correspond to the timing of the detected injection, which may indicate persistence mechanisms being established.

  - **Review user activity logs:** Check for past user activity in Office applications leading up to the detection, such as opening suspicious files or accessing external links that may have triggered the malware delivery.

  ### Prioritization

  Due to the high impact of winword.exe being exploited in an enterprise environment, this alert should be taken seriously. The likelihood of malicious abuse is substantial as process injection techniques are commonly weaponized by adversaries aiming to bypass security controls.

  ### Blind Spots and Assumptions

  This detection may have limitations, such as false positives triggered by legitimate automation tools or processes using Office applications. It requires accurate logging configurations, including Sysmon and Windows Security Event logs, for reliable detection. Legitimate activities may involve automated document processing tools that also utilize winword.exe. A related detection to strengthen coverage would involve monitoring for unusual file creation patterns from Office applications, highlighting possible exfiltration attempts or other malicious behaviors.

