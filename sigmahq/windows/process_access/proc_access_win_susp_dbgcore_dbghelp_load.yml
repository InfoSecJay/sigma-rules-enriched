title: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
related:
- id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
  type: similar
status: experimental
description: |
  Detects suspicious process access to LSASS.exe from processes located in uncommon locations with dbgcore.dll or dbghelp.dll in the call trace.
  These DLLs contain functions like MiniDumpWriteDump that can be abused for credential dumping purposes. While modern tools like Mimikatz have moved to using ntdll.dll,
  dbgcore.dll and dbghelp.dll are still used by basic credential dumping utilities and legacy tools for LSASS memory access and process suspension techniques.
references:
- https://www.splunk.com/en_us/blog/security/you-bet-your-lsass-hunting-lsass-access.html
- https://docs.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpwritedump
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.credential-access
- attack.t1003.001
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_access
  product: windows
detection:
  selection_lsass_calltrace:
    TargetImage|endswith: '\lsass.exe'
    CallTrace|contains:
    - 'dbgcore.dll'
    - 'dbghelp.dll'
    # The following selection is commented out and not enabled by default because any access to LSASS with dbgcore.dll or dbghelp.dll in the call trace from uncommon locations is assumed to be suspicious,
    # but it may reduce false positives if the rule is too noisy. These GrantedAccess bits are commonly used for dumping LSASS memory.
    # Uncomment if you observe false positives with the default rule.
    # selection_granted_access:
    #     GrantedAccess|contains:
    #         - '0x1fffff'
    #         - '0x10'
    #         - '0x1010'
    #         - '0x1410'
    #         - '0x1438'
  selection_susp_location:
    SourceImage|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
    - '\Windows\Temp\'
  condition: all of selection_*
falsepositives:
- Possibly during software installation or update processes
level: high
regression_tests_path: 
  regression_data/rules/windows/process_access/proc_access_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ### Technical Context

  This Sigma rule detects suspicious access to the LSASS.exe process from unusual sources utilizing the dbgcore.dll or dbghelp.dll libraries. The presence of these DLLs indicates potential credential dumping activities, as they are associated with functions capable of extracting sensitive information from the LSASS memory space. The likely attacker objective is to obtain user credentials for lateral movement or privilege escalation. This detection aligns with the MITRE ATT&CK techniques: Credential Access (T1003.001) and Defense Evasion (T1562.001).

  Primary telemetry sources include Windows process access logs, specifically focusing on Event IDs related to process creation and memory access. If malicious, the action may lead to unauthorized access to sensitive user credentials stored in LSASS. Importantly, this detection does NOT confirm malicious intent on its own; legitimate activities such as software installations may trigger similar alerts.

  ### Investigation Steps

  - **Review Call Trace:** Check for Event ID 4688 (Process Creation) to analyze the CallTrace field for `dbgcore.dll` or `dbghelp.dll` in conjunction with accessing `lsass.exe`. Malicious indicators include abnormal source paths accessing LSASS.

  - **Examine Source Path:** Validate the SourceImage file path against known benign locations. If the source is located in directories like `C:\Users\Public` or `C:\Temp`, this may indicate malicious activity, while `C:\Windows\System32` would be considered normal.

  - **Check for Granted Access Rights:** If access logs indicate a GrantedAccess value of '0x1fffff,' '0x10,' '0x1010,' '0x1410,' or '0x1438,' it is indicative of high-risk actions like memory dumping. Use Sysmon Event ID 10 (ProcessAccess) where possible.

  - **Investigate Integrated Security Tools:** Determine whether legitimate applications (e.g., antivirus or monitoring tools) running from unusual locations are responsible for accessing LSASS. If legitimate processes invoke LSASS, note the context around how they do so.

  - **Note Historical Context:** Cross-reference the event timeline with recent password changes or user access requests. Unexpected access attempts coinciding with these events may warrant further scrutiny for malicious intent.

  - **Correlate with Network Traffic:** Use network monitoring tools to look for unusual outbound traffic or connections following the LSASS access. High-confidence malicious activity may align with unusual data exfiltration patterns.

  ### Prioritization

  This alert carries a high severity due to the sensitive nature of LSASS and the potential for credential theft. The impact on systems where credential access occurs can lead to significant breaches and unauthorized access. The likelihood of malicious abuse is elevated as tools leveraging these DLLs are commonly observed in cyber attacks targeting credential harvesting.

  ### Blind Spots and Assumptions

  Detection limitations stem from the likelihood of false positives during legitimate software updates or installations, which may also access LSASS. Required logs include process access and creation events, which must be configured correctly to ensure comprehensive monitoring. Legitimate usage scenarios, especially from administrative tools or during system maintenance, may inadvertently trigger alerts. A related detection covering direct memory access attempts (using tools like Mimikatz) should be monitored to enhance overall security coverage.

