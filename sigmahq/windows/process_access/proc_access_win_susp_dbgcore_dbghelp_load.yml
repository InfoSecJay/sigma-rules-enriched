title: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
related:
- id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
  type: similar
status: experimental
description: |
  Detects suspicious process access to LSASS.exe from processes located in uncommon locations with dbgcore.dll or dbghelp.dll in the call trace.
  These DLLs contain functions like MiniDumpWriteDump that can be abused for credential dumping purposes. While modern tools like Mimikatz have moved to using ntdll.dll,
  dbgcore.dll and dbghelp.dll are still used by basic credential dumping utilities and legacy tools for LSASS memory access and process suspension techniques.
references:
- https://www.splunk.com/en_us/blog/security/you-bet-your-lsass-hunting-lsass-access.html
- https://docs.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpwritedump
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-27
tags:
- attack.credential-access
- attack.t1003.001
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_access
  product: windows
detection:
  selection_lsass_calltrace:
    TargetImage|endswith: '\lsass.exe'
    CallTrace|contains:
    - 'dbgcore.dll'
    - 'dbghelp.dll'
    # The following selection is commented out and not enabled by default because any access to LSASS with dbgcore.dll or dbghelp.dll in the call trace from uncommon locations is assumed to be suspicious,
    # but it may reduce false positives if the rule is too noisy. These GrantedAccess bits are commonly used for dumping LSASS memory.
    # Uncomment if you observe false positives with the default rule.
    # selection_granted_access:
    #     GrantedAccess|contains:
    #         - '0x1fffff'
    #         - '0x10'
    #         - '0x1010'
    #         - '0x1410'
    #         - '0x1438'
  selection_susp_location:
    SourceImage|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
    - '\Windows\Temp\'
  condition: all of selection_*
falsepositives:
- Possibly during software installation or update processes
level: high
regression_tests_path: 
  regression_data/rules/windows/process_access/proc_access_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ### Technical Context
  This rule detects suspicious access to the Local Security Authority Subsystem Service (LSASS.exe) by processes that use the `dbgcore.dll` or `dbghelp.dll` libraries and originate from uncommon file paths. These libraries are known to be utilized not only by legitimate applications but also by various credential dumping tools. Attackers targeting LSASS may seek to extract sensitive information such as user credentials to escalate privileges or move laterally within a network.

  The likely threat scenario involves an attacker leveraging tools designed for credential dumping, using these specific DLLs as part of their methodology. `dbgcore.dll` and `dbghelp.dll` allow processes to interact with LSASS memory for purposes aligned with exploitation techniques. The relevant MITRE ATT&CK tactics include Credential Access (TA0006), specifically Technique T1003.001 (Credential Dumping: LSASS Memory), and Defense Evasion (TA0005) with respect to the use of techniques that obscure the real purpose of the access attempts (T1562.001).

  Primary data sources that provide evidence for this type of behavior include Windows process access logs, which can capture process calls and their associated DLL usage, along with file system logs that identify the location of the accessing processes.

  ### Investigation Steps
  - **Review Process Access Logs**: Collect logs that detail process access to LSASS.exe and check for instances involving `dbgcore.dll` or `dbghelp.dll` in the call trace. Identify any processes coming from unusual or unexpected directories.

  - **Analyze Caller Process Locations**: Investigate the source of the accessing process. Look for processes that originate from uncommon directories such as `C:\Users\Public`, `C:\Temp`, or others listed in the detection logic. Pay attention to any patterns of behavior indicating persistence or command execution.

  - **Correlate with User Activity**: Examine user activity logs for the accounts associated with the processes accessing LSASS. Determine if there are any indications of unusual login times, geographic locations, or device changes that correlate with the alerts.

  - **Explore Memory Dumping Tools**: Cross-reference the process names captured in the logs with known credential dumping tools, particularly those that utilize `dbgcore.dll` or `dbghelp.dll`. Conduct further investigations into tools like Mimikatz if detected and assess the potential impact on the environment.

  ### Prioritization
  The alert is deemed high severity because unauthorized access to LSASS can result in the theft of sensitive credentials, leading to significant threats such as privilege escalation and lateral movement within the enterprise network. Given the critical nature of LSASS in a Windows environment, any signs of suspicious access warrant immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule assumes that processes attempting to access LSASS with the specified DLLs from uncommon locations are indeed malicious, which may not account for all legitimate software activities that may trigger such alerts. There is a potential for false positives, especially during software updates or installations. Required logs for the detection to function effectively include detailed process access logs and adequate configurations on logging settings to capture DLL call traces from the operating system.

