logsource:
  category: process_access
  product: windows
detection:
  selection_lsass_calltrace:
    TargetImage|endswith: '\lsass.exe'
    CallTrace|contains:
    - 'dbgcore.dll'
    - 'dbghelp.dll'
    # The following selection is commented out and not enabled by default because any access to LSASS with dbgcore.dll or dbghelp.dll in the call trace from uncommon locations is assumed to be suspicious,
    # but it may reduce false positives if the rule is too noisy. These GrantedAccess bits are commonly used for dumping LSASS memory.
    # Uncomment if you observe false positives with the default rule.
    # selection_granted_access:
    #     GrantedAccess|contains:
    #         - '0x1fffff'
    #         - '0x10'
    #         - '0x1010'
    #         - '0x1410'
    #         - '0x1438'
  selection_susp_location:
    SourceImage|contains:
    - ':\Perflogs\'
    - ':\Temp\'
    - ':\Users\Public\'
    - '\$Recycle.Bin\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Documents\'
    - '\Downloads\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
    - '\Windows\Temp\'
  condition: all of selection_*
falsepositives:
- Possibly during software installation or update processes
level: high
regression_tests_path: 
  regression_data/rules/windows/process_access/proc_access_win_susp_dbgcore_dbghelp_load/info.yml
note: |
  ### Technical Context

  This Sigma rule detects suspicious access to the Local Security Authority Subsystem Service (LSASS) process by examining the call trace of processes using `dbgcore.dll` or `dbghelp.dll`. Attackers often use these DLLs for credential dumping, targeting LSASS to extract sensitive information such as user credentials. The relevant MITRE ATT&CK techniques include Credential Dumping (T1003.001) and Process Injection (T1685).

  The primary telemetry sources include Windows Process Access logs that capture events related to process interactions, specifically Event ID 4656 (Access Attempt) and Event ID 4688 (Process Creation). If this behavior is malicious, it could compromise user credentials and lead to further lateral movement or privilege escalation. Importantly, this detection does not confirm malicious activity on its own, as there may be legitimate processes that access LSASS under certain conditions.

  ### Investigation Steps

  - **Review Process Access Logs**: Check Windows Security Event ID 4656 and 4688. Look for access attempts to `lsass.exe` from processes located in uncommon directories, particularly those using `dbgcore.dll` or `dbghelp.dll`.

  - **Identify Uncommon Process Locations**: Examine the `SourceImage` field in the logs. Legitimate access typically occurs from expected system directories (e.g., `C:\Windows\System32`). Any access from paths like `C:\Temp\`, `C:\Users\Public\`, or `C:\AppData\Roaming\` is suspicious.

  - **Analyze Call Traces**: Use Sysmon (if available) to obtain detailed call trace information. Investigate whether the `CallTrace` field includes `dbgcore.dll` or `dbghelp.dll`. Legitimate use cases rarely invoke these DLLs for LSASS access.

  - **Correlate with Recent Activity**: Cross-reference the timing of the alert with known software installations or updates that may generate false positives. Ensure no recent installations required legitimate LSASS access under these conditions.

  - **Assess Granted Access Levels**: Although this selection is commented out in the rule, if enabled, inspect `GrantedAccess` fields for suspicious values (e.g., `0x1fffff`) typically used for dumping LSASS memory, indicating potential malicious intent.

  ### Prioritization

  This alert is high-severity due to the potential impact on the integrity and confidentiality of system credentials. The likelihood of malicious abuse is significant, as credential dumping is a common technique employed by attackers to gain unauthorized access. Given that tools employing `dbgcore.dll` and `dbghelp.dll` for malicious purposes have historical precedence, prompt investigation is critical.

  ### Blind Spots and Assumptions

  The detection may be evaded if attackers implement techniques to camouflage their operations, such as using alternative methods for credential access. Accurate detection relies on the availability and configuration of Windows Process Access logging. Legitimate software installation and updating processes may trigger this alert, necessitating contextual awareness. A related detection rule monitoring for process injection techniques (such as those using `ntdll.dll`) can enhance overall detection coverage.

