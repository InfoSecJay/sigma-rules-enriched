title: Credential Dumping Attempt Via Svchost
id: 174afcfa-6e40-4ae9-af64-496546389294
status: test
description: Detects when a process tries to access the memory of svchost to 
  potentially dump credentials.
references:
- Internal Research
author: Florent Labouyrie
date: 2021-04-30
modified: 2022-10-09
tags:
- attack.privilege-escalation
- attack.t1548
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\svchost.exe'
    GrantedAccess: '0x143a'
  filter_main_known_processes:
    SourceImage|endswith:
    - '\services.exe'
    - '\msiexec.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts by a process to access the memory of `svchost.exe` with a specific access mask (0x143A), which indicates potential credential dumping behavior. Attackers may exploit this behavior to extract sensitive information, such as credentials, from the process's memory to escalate privileges or maintain persistence within the environment. This behavior aligns with the MITRE ATT&CK technique T1548 (Abuse Elevation Control Mechanism).

  Primary telemetry sources include Windows Event IDs related to process access, specifically leveraging the process access logs. The security impact can be significant, as unauthorized access to `svchost.exe` could indicate a compromised system and potential lateral movement or data breach. Importantly, this detection does NOT confirm that a successful credential dump has occurred; it only indicates a suspicious access attempt.

  ### Investigation Steps

  - **Identify the source process: ** Review the process access logs (e.g., Security Event ID 4663) for the source image attempting to access `svchost.exe`. Ensure it does not match legitimate services like `services.exe` or `msiexec.exe`.

  - **Check the access mask:** Validate that the `GrantedAccess` field shows '0x143A' for the offending process. This specific value indicates attempts to read/process memory, which is commonly associated with credential dumping.

  - **Review process lineage:** Analyze the parent-child process relationships using process creation logs (Windows Event ID 4688 or Sysmon Event ID 1) to ensure that the source process was started by a legitimate or expected parent process.

  - **Assess recent system activity:** Look for any recent installations or updates in the system that could explain legitimate memory accesses to `svchost.exe`. Patterns of running from non-standard paths or high-frequency access could indicate malicious attempts.

  - **Investigate alternate indicators:** Search for any creation or modification events for sensitive files (such as credential database files) that may coincide with the alert across the system, validating if there’s a correlation with the suspicious access attempt.

  ### Prioritization

  This alert is critical due to the potential impact on compromised systems where credential dumping may lead to further unauthorized access. The likelihood of this attack being used by adversaries is high, as credential access attacks are well-known and commonly weaponized in various threat scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if process access logs are not enabled or monitored comprehensively. Potential evasion techniques include attackers manipulating or hiding their access attempts through legitimate processes. Additionally, legitimate applications or services may trigger this alert if not properly whitelisted. Monitoring for related detection rules (e.g., account enumeration or unauthorized access to sensitive data) can enhance security coverage and provide context for investigation.

