note: |
  ### Technical Context

  This Sigma rule detects remote access to the Local Security Authority Subsystem Service (LSASS) process through Windows Remote Management (WinRM), which is often indicative of a credential dumping attempt using tools like Mimikatz. The likely attacker objective is to extract sensitive credentials from LSASS to facilitate lateral movement or unauthorized access within the environment. This behavior is associated with the MITRE ATT&CK tactics of Credential Access (T1003.001) and Lateral Movement (T1021.006).

  The primary telemetry source for this detection includes Windows Security Event logs, specifically focusing on process access events (Event ID 4663) and process creation events (Event ID 4688) related to the wsmprovhost.exe and lsass.exe executables. If malicious, this behavior could lead to significant compromise of user credentials and system security. It's important to note that this detection does not prove that credential dumping has occurred; it only indicates that a remote access attempt to LSASS has taken place.

  ### Investigation Steps

  - **Confirm telemetry availability: Check for Event ID 4663 logs**: Query Security event logs for Event ID 4663 where the `ObjectType` is `Process` and `ObjectName` corresponds to `C:\Windows\System32\lsass.exe`. Verify that the `AccessMask` contains `0x80000000`, indicating an attempt to read access to the process.

  - **Identify the source process responsible: Retrieve Event ID 4688 logs**: Review Security event logs for Event ID 4688 showing the creation of `wsmprovhost.exe`. Pay attention to the `CommandLine` field, which may include suspicious arguments indicating unauthorized access attempts.

  - **Evaluate remote access patterns: Analyze WinRM logs**: Look into WinRM logs for unusual or unauthorized remote connections. Check for multiple connections originating from non-standard hosts, or connections occurring during unusual hours versus regular operational patterns.

  - **Assess legitimate behavior**: Familiarize yourself with the normal WinRM operational behavior in your environment, such as approved remote management setups or scripts that utilize wsmprovhost.exe for legitimate administrative tasks. Document and compare any alerts against these baselines.

  - **Confirm high-confidence malicious indicators**: Look for instances where `wsmprovhost.exe` is executed alongside commands relevant to credential dumping, such as Mimikatz or similar tools. Check the process's parent-child relationships indicating it might be spawned by another suspicious process.

  ### Prioritization

  This alert is of high severity due to the potential compromise of sensitive credentials, which could lead to further exploitation or lateral movement within the enterprise environment. The likelihood of abuse is significant, as the technique is commonly weaponized by adversaries engaged in credential dumping and account takeovers.

  ### Blind Spots and Assumptions

  The main limitation of this detection is the potential for legitimate administrative activities to trigger similar alerts, as system administrators also utilize WinRM for remote management. Reliable detection requires ensuring comprehensive logging of both process events and WinRM activities. Legitimate use may include routine automated scripts run for system maintenance. A related detection that strengthens coverage could be monitoring for unexpected commands executed via WinRM, especially those targeting critical system processes.

