detection:
  selection:
    SourceImage|endswith: '\WerFault.exe'
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess: '0x1FFFFF'
  condition: selection
falsepositives:
- Actual failures in lsass.exe that trigger a crash dump (unlikely)
- Unknown cases in which WerFault accesses lsass.exe
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to dump the memory of the Local Security Authority Subsystem Service (LSASS) process using the WerFault.exe process. Attackers often aim to extract sensitive credentials stored in LSASS for lateral movement or privilege escalation. This behavior fits within the MITRE ATT&CK framework under the tactic of Credential Access (T1003.001 - Credential Dumping via LSASS). Primary telemetry sources include Windows Event IDs related to process creation (4688) and Sysmon logs for process access events. If malicious, this activity can lead to unauthorized access to user credentials, posing a significant security threat. This detection does NOT confirm that the process is malicious by itself, as legitimate crashes of LSASS can also result in similar behavior.

  ### Investigation Steps

  - **Check process creation activity:** Review Windows Security Event ID 4688 for instances of WerFault.exe launching. Verify the parent process; if it originates from a user application rather than an automated task or script, it may be benign.

  - **Analyze Sysmon logs for process access:** Investigate Sysmon Event ID 10, focusing on process access events where WerFault.exe accesses lsass.exe. Look for granted access values of '0x1FFFFF' to indicate full control, which is suspicious.

  - **Identify known malicious indicators:** If the WerFault.exe process is invoked with parameters typically used by Mimikatz or Procdump, such as memory address manipulation, flag this instance as high-confidence malicious activity.

  - **Examine crash dump files, if available:** Validate the creation of dump files, specifically those with timestamps concurrent to the alert. Check for unusual file paths or security-scoped directory access which diverges from normal operations.

  - **Review legitimate cases of LSASS access:** Confirm if user-driven applications are compliant with the expected access patterns for WerFault.exe. Typical legitimate behavior includes user crashes with error reporting, while attack vectors will often involve automated or script-driven access.

  - **Correlate with other detections:** Look for related detections, such as network traffic to known C2 servers or prior alerts related to credential dumping. Such correlations strengthen the confidence level that the alert is linked to malicious activity.

  ### Prioritization

  This alert is high-severity as it potentially indicates active credential dumping, which can lead to significant data breaches and unauthorized access. The likelihood of adversary abuse is substantial, given the frequency of credential harvesting in exploitation campaigns.

  ### Blind Spots and Assumptions

  Detection may falter if logging settings are insufficient, as proper Sysmon configurations are necessary for comprehensive insights. Legitimate activities, such as system crash reporting or debugging, could also trigger the alert and may not inherently indicate malicious intent. A combined detection of unusual network activity from the affected host and other process creation logs can provide deeper insight into this behavior and mitigate false positives.

