title: Credential Dumping Attempt Via WerFault
id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
status: test
description: Detects process LSASS memory dump using Mimikatz, NanoDump, Invoke-Mimikatz,
  Procdump or Taskmgr based on the CallTrace pointing to ntdll.dll, dbghelp.dll or
  dbgcore.dll for win10, server2016 and up.
references:
- https://github.com/helpsystems/nanodump/commit/578116faea3d278d53d70ea932e2bbfe42569507
author: Florian Roth (Nextron Systems)
date: 2012-06-27
modified: 2023-11-29
tags:
- attack.credential-access
- attack.t1003.001
- attack.s0002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    SourceImage|endswith: '\WerFault.exe'
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess: '0x1FFFFF'
  condition: selection
falsepositives:
- Actual failures in lsass.exe that trigger a crash dump (unlikely)
- Unknown cases in which WerFault accesses lsass.exe
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to dump credentials from the LSASS (Local Security Authority Subsystem Service) process by monitoring actions where the WerFault.exe process interacts with lsass.exe. Attackers often utilize tools like Mimikatz, NanoDump, and others to extract sensitive authentication tokens from LSASS memory. The main objective of this threat activity is to harvest credentials for lateral movement within the network, allowing attackers to escalate their privileges or impersonate users.

  This detection aligns with the MITRE ATT&CK framework, specifically targeting the tactics and techniques related to Credential Access (TA0006) and Credential Dumping (T1003.001). By monitoring for specific API calls linked to debugging and memory access patterns associated with LSASS, organizations can better defend against these types of attacks.

  Primary data sources for effective detection include Windows process access logs that provide insights into inter-process communication and memory access, as well as logs from security tools monitoring application behaviors and system performance.

  ### Investigation Steps
  - **Review Process Access Logs:** Examine logs that capture access to the LSASS process, focusing on entries involving the WerFault.exe source to identify any unexpected interactions.
  - **Analyze Call Trace Events:** Investigate any detected call traces pointing to the ntdll.dll, dbghelp.dll, or dbgcore.dll to confirm the legitimacy of the process actions and rule out benign scenarios.
  - **Correlate with User Activity:** Cross-reference the activity with user actions within the environment to identify any unauthorized access attempts or legitimate user behavior that could be misinterpreted as malicious.
  - **Check for Known Tools Usage:** Look for indicators of the identified credential dumping tools (Mimikatz, NanoDump) in the environment, alongside the corresponding timestamps of related process activities.

  ### Prioritization
  The severity of this alert is high because a successful credential dumping attempt can compromise user accounts, leading to potential lateral movement and extensive system access in the enterprise environment. Given the significant impact such breaches can have on security posture and data integrity, prompt investigation and response are imperative.

  ### Blind Spots and Assumptions
  There may be gaps in detection if logging for process access events is misconfigured or if certain processes are not properly monitored. The detection logic assumes that WerFault.exe will only initiate memory dumps to manage crashes and not for legitimate problem-solving. Required logs include comprehensive process access data, and configurations must ensure that detailed logging is enabled for all process interactions, especially those involving LSASS and critical system processes.

