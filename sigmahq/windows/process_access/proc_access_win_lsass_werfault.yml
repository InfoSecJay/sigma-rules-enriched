title: Credential Dumping Attempt Via WerFault
id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
status: test
description: Detects process LSASS memory dump using Mimikatz, NanoDump, 
  Invoke-Mimikatz, Procdump or Taskmgr based on the CallTrace pointing to 
  ntdll.dll, dbghelp.dll or dbgcore.dll for win10, server2016 and up.
references:
- https://github.com/helpsystems/nanodump/commit/578116faea3d278d53d70ea932e2bbfe42569507
author: Florian Roth (Nextron Systems)
date: 2022-06-27
modified: 2023-11-29
tags:
- attack.credential-access
- attack.t1003.001
- attack.s0002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    SourceImage|endswith: '\WerFault.exe'
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess: '0x1FFFFF'
  condition: selection
falsepositives:
- Actual failures in lsass.exe that trigger a crash dump (unlikely)
- Unknown cases in which WerFault accesses lsass.exe
level: high
note: |
  ### Technical Context

  This rule detects attempts to dump the memory of the LSASS process using tools like Mimikatz or similar techniques when executed via the Windows Error Reporting (WerFault.exe) process. The likely objective of an attacker is to extract credentials stored in LSASS, which could facilitate unauthorized access to systems and sensitive data. This behavior aligns with the MITRE ATT&CK technique for credential dumping, specifically T1003.001 (Credential Dumping: LSASS Memory).

  The primary telemetry source is process access logs from Windows, specifically targeting Event IDs that track process creations and access to LSASS. If successful, this behavior can result in major security breaches as attackers gain access to sensitive credentials. However, this detection does NOT confirm that credentials were successfully dumped or that the activity was indeed malicious, as legitimate system malfunctions involving WerFault can also trigger similar activity.

  ### Investigation Steps

  - **Identify the process initiating the access:**
    Check for Event ID 4688 (Process Creation) to see if WerFault.exe is the parent process of the lsass.exe access attempt. If another process was responsible, further investigation is required.

  - **Review Granted Access level:**
    Look for logs showing GrantedAccess of '0x1FFFFF' associated with WerFault.exe accessing lsass.exe. High access levels here are indicative of malicious behavior.

  - **Analyze CallTrace details:**
    Examine the syscall stack traces in related logs to confirm if they point to ntdll.dll, dbghelp.dll, or dbgcore.dll. This would indicate the use of techniques common to memory dumping.

  - **Correlate with known tools:**
    Cross-reference this incident with reported incidents involving Mimikatz, NanoDump, or similar tools. Any related telemetry should be flagged as high-confidence malicious.

  - **Determine normal LSASS crash behavior:**
    Document expected legitimate actions that might trigger WerFault.exe, such as application crashes that are common in managed environments (e.g., software updates or automated maintenance).

  - **Check for prior alerts:**
    Review previous alerts or logs for similar behavior around the same timestamp. Patterns in multiple alerts could suggest a coordinated attack.

  ### Prioritization

  This alert should be treated as high severity due to the potential for credential theft from LSASS, a critical system process. The likelihood of malicious abuse is significant, as the techniques captured by this rule are commonly employed in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by inadequate logging configurations; for example, if process access logs are not enabled or not collecting adequate detail. Legitimate activities that may trigger this alert include system crashes or other normal operations that involve WerFault.exe accessing LSASS. A related detection that strengthens coverage would be monitoring for unusual user access patterns or elevation of privileges using Mimikatz, which can help correlate events related to credential dumping attempts.

