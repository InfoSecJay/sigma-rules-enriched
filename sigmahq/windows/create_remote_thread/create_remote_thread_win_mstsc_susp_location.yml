title: Remote Thread Creation In Mstsc.Exe From Suspicious Location
id: c0aac16a-b1e7-4330-bab0-3c27bb4987c7
status: test
description: |
  Detects remote thread creation in the "mstsc.exe" process by a process located in a potentially suspicious location.
  This technique is often used by attackers in order to hook some APIs used by DLLs loaded by "mstsc.exe" during RDP authentications in order to steal credentials.
references:
- https://github.com/S12cybersecurity/RDPCredentialStealer/blob/1b8947cdd065a06c1b62e80967d3c7af895fcfed/APIHookInjectorBin/APIHookInjectorBin/Inject.h#L25
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-28
modified: 2024-01-22
tags:
- attack.credential-access
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    TargetImage|endswith: '\mstsc.exe'
    SourceImage|contains:
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\PerfLogs\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  The rule detects remote thread creation within the "mstsc.exe" process initiated by executables originating from potentially suspicious locations, such as Temporary directories. This technique is commonly employed by attackers to inject malicious code into legitimate processes, specifically targeting Remote Desktop Protocol (RDP) sessions. The likely attacker objective is to hook APIs used during RDP authentication, which can lead to credential theft, potentially compromising user accounts and establishing unauthorized access.

  This behavior is classified under the MITRE ATT&CK framework with the following tactics and techniques: Credential Access (TA0006) and Process Injection (T1055). The primary telemetry sources include Windows Event ID 4672 (Special Privileges Assigned to New Logon) and process creation logs. If malicious, this behavior can have a significant impact, compromising sensitive credentials and granting persistent access to the enterprise network. Importantly, this detection does NOT confirm an active attack on its own; further analysis is required to assess the context of the activity.

  ### Investigation Steps

  - **Review remote thread creation details:**
    Check for Event ID 4688 for the creation of "mstsc.exe" and identify the SourceImage path (ensure it’s from legitimate processes). Look for indications of execution from the directories listed in the rule (e.g., Temp directories).

  - **Identify the initiating process:**
    Examine the SourceImage path for any processes originating from uncommon or suspicious locations such as "\Users\Public\" or "\Windows\PerfLogs\". This can provide context about potential malicious activity.

  - **Analyze API interaction:**
    Use Sysinternals tools (e.g., Process Explorer) to examine handles and threads associated with "mstsc.exe". Ensure no unusual DLLs are loaded that may indicate code injection, particularly from suspicious sources.

  - **Determine typical behavior patterns:**
    Observe normal user RDP connections and identify paths and sources for the "mstsc.exe" process – legitimate activity typically originates from system directories or user profiles, not Temp folders.

  - **Check for high-confidence malicious indicators:**
    Look for known malicious process signatures or hashes originating from the suspicious locations noted in the rule. Such indicators can include known malware hashes consistent with credential-stealing tools.

  ### Prioritization

  This alert should be considered high severity due to the critical nature of RDP access within enterprise environments, where the potential for credential theft can lead to widespread compromise. The likelihood of malicious abuse is significant, as this technique is frequently weaponized by adversaries targeting RDP sessions.

  ### Blind Spots and Assumptions

  The detection may have limitations if necessary log sources, such as process creation logs (Event ID 4688) or Sysmon logs, are not thoroughly configured or collected. Legitimate applications or scripts that utilize RDP can inadvertently trigger this alert, leading to false positives. A related detection for monitoring suspicious RDP login attempts (e.g., Event ID 4624) can complement this rule and provide a broader understanding of potential attack vectors.

