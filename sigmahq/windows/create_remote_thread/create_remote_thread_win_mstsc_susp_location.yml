tags:
- attack.credential-access
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    TargetImage|endswith: '\mstsc.exe'
    SourceImage|contains:
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\PerfLogs\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of remote threads in the "mstsc.exe" process from executables located in suspicious directories, such as Temp or Public folders. Attackers may leverage this behavior to inject malicious code into the Remote Desktop Protocol (RDP) client, aiming to capture credentials or establish persistent access to a system. The relevant MITRE ATT&CK tactics and techniques are Credential Access (TA0006) and Remote Thread Injection (T1203).

  Primary telemetry sources include Windows System Event logs and the creation of remote thread activity, which captures Event ID 592 or Sysmon Event ID 8. If such behavior is confirmed to be malicious, it can lead to credential theft and unauthorized remote access, significantly compromising sensitive assets. Importantly, this detection does not confirm malicious intent on its own; further investigation is needed to establish the context of the behavior.

  ---

  ### Investigation Steps

  - **Examine source and target processes:** Check Event ID 592 or Sysmon Event ID 8 for `TargetImage: mstsc.exe` and note the `SourceImage`. Look for known benign processes that may be executing remote thread creations, such as legitimate remote management tools.

  - **Verify the execution path:** Investigate the `SourceImage` path for suspicious locations (e.g., `C:\Temp\`, `C:\Users\Public\`). Legitimate applications typically do not reside in these directories. Path anomalies increase suspicion.

  - **Identify high-confidence malicious indicators:** Look for process creation logs (Security Event ID 4688) connected to the same execution path as the suspicious `SourceImage`. If this process is linked to known malware or suspicious behaviors, it could indicate compromise.

  - **Audit RDP login attempts:** Review Windows Security Event ID 4624 to confirm whether RDP attempts coincide with the thread creation. If the timestamps align and unusual user accounts are involved, this could indicate a successful credential theft attempt.

  - **Check for additional network connections:** Use network logs (e.g., Windows Firewall logs) to identify any anomalous outbound connections made immediately following the suspicious thread creation. This may reveal attempts to exfiltrate credentials or access command and control (C2) servers.

  - **Validate expected usage patterns:** Establish baseline behavior for the use of `mstsc.exe` in your environment. If an increase in use correlates with the detection, it could suggest legitimate business activity versus potential malicious activity.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on credential theft and unauthorized access to systems, particularly on devices with elevated privileges. The likelihood of malicious activity is significant, given that such injection techniques are weaponized methods for attackers aiming to exploit RDP sessions.

  ---

  ### Blind Spots and Assumptions

  Detection may be circumvented by legitimate applications using similar remote thread creation methods without malicious intent or by attackers employing code obfuscation techniques. Additionally, reliance on standard logging configurations is necessary; missing logs could result in incomplete investigations. Legitimate automated processes or scheduled tasks may trigger this alert, making further context essential. Related detection to consider includes monitoring for failed RDP login attempts (Event ID 4625) which can supplement findings on unauthorized access attempts.

