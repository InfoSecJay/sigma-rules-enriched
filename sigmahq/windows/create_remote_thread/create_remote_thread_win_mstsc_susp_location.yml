title: Remote Thread Creation In Mstsc.Exe From Suspicious Location
id: c0aac16a-b1e7-4330-bab0-3c27bb4987c7
status: test
description: |
  Detects remote thread creation in the "mstsc.exe" process by a process located in a potentially suspicious location.
  This technique is often used by attackers in order to hook some APIs used by DLLs loaded by "mstsc.exe" during RDP authentications in order to steal credentials.
references:
- https://github.com/S12cybersecurity/RDPCredentialStealer/blob/1b8947cdd065a06c1b62e80967d3c7af895fcfed/APIHookInjectorBin/APIHookInjectorBin/Inject.h#L25
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-28
modified: 2024-01-22
tags:
- attack.credential-access
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    TargetImage|endswith: '\mstsc.exe'
    SourceImage|contains:
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\PerfLogs\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets remote thread creation in the `mstsc.exe` (Microsoft Terminal Services Client) process when initiated by a process located in suspicious directories. Such behavior is indicative of an attack strategy where adversaries may attempt to hook APIs within `mstsc.exe`, potentially to steal credentials during Remote Desktop Protocol (RDP) sessions. Attackers often choose to manipulate this process to compromise the confidentiality of user credentials, enabling lateral movement within the network.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006), specifically under the **Credential Dumping** technique (T1003). Attackers utilizing techniques to manipulate legitimate processes such as `mstsc.exe` represent a significant threat as they can gain unauthorized access to sensitive systems and data through stolen credentials.

  The primary data sources for this detection rule are Windows process creation events, specifically focusing on logs pertaining to remote thread creation. Additionally, process images that originate from directories commonly misused by malware serve as key indicators of malicious activity.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine recent process creation logs to identify instances of `mstsc.exe` being invoked alongside processes that originate from suspicious locations.
  - **Analyze Remote Thread Creation:** Investigate any remote thread creation activities linked to `mstsc.exe` to ascertain the legitimacy of the source process and its behavior.
  - **Correlate with RDP Sessions:** Check related RDP session logs to see if the connections initiated or affected by `mstsc.exe` align with typical user activity or signal anomalous access patterns.
  - **Check File Integrity:** Validate the integrity and source of any processes in the suspicious directories (e.g., Temp, Public, etc.) to see if they are part of known software installations or present indicators of compromise.

  ### Prioritization
  This alert should be considered high priority due to the potential for significant impact on the organization’s security posture; unauthorized access to RDP sessions can lead to widespread credential exfiltration and potential lateral movement within the network.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage if certain known good processes are executed from the specified suspicious directories without proper context, potentially leading to false negatives. The detection logic assumes that any process creating a thread in `mstsc.exe` from dubious locations is malicious, which may not always hold true for all environments. Additionally, proper logging configurations for process creation events must be enabled on the Windows hosts for this rule to function effectively.

