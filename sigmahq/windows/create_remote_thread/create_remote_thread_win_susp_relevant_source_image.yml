logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    SourceImage|endswith:
    - '\bash.exe'
    - '\cscript.exe'
    - '\cvtres.exe'
    - '\defrag.exe'
    - '\dialer.exe'
    - '\dnx.exe'
    - '\esentutl.exe'
    - '\excel.exe'
    - '\expand.exe'
    - '\find.exe'
    - '\findstr.exe'
    - '\forfiles.exe'
    - '\gpupdate.exe'
    - '\hh.exe'
    - '\installutil.exe'
    - '\lync.exe'
    - '\makecab.exe'
    - '\mDNSResponder.exe'
    - '\monitoringhost.exe'         # Loads .NET CLR by default and thus a favorite for process injection for .NET in-memory offensive tools.
    - '\msbuild.exe'
    - '\mshta.exe'
    - '\mspaint.exe'
    - '\outlook.exe'
    - '\ping.exe'
    - '\provtool.exe'
    - '\python.exe'
    - '\regsvr32.exe'
    - '\robocopy.exe'
    - '\runonce.exe'
    - '\sapcimc.exe'
    - '\smartscreen.exe'
    - '\spoolsv.exe'
    - '\tstheme.exe'
    - '\userinit.exe'
    - '\vssadmin.exe'
    - '\vssvc.exe'
    - '\w3wp.exe'
    - '\winscp.exe'
    - '\winword.exe'
    - '\wmic.exe'
    - '\wscript.exe'
  filter_main_conhost:
    SourceImage:
    - 'C:\Windows\System32\Defrag.exe'
    - 'C:\Windows\System32\makecab.exe'
    TargetImage: 'C:\Windows\System32\conhost.exe'
  filter_main_provtol_svchost:
    SourceImage: 'C:\Windows\System32\provtool.exe'
    TargetImage: 'C:\Windows\System32\svchost.exe'
  filter_main_provtool_system:
    SourceImage: 'C:\Windows\System32\provtool.exe'
    TargetImage: 'System'
  filter_main_userinit:
    SourceImage: 'C:\Windows\System32\userinit.exe'
    TargetImage: 'C:\Windows\explorer.exe'
  filter_main_winword:
    SourceImage|endswith: '\WINWORD.EXE'
    TargetImage|startswith:
    - 'C:\Program Files (x86)\'         # C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
    - 'C:\Program Files\'         # C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\Office16\AI\ai.exe
  filter_main_ms_office:
        # Raised by following issue: https://github.com/SigmaHQ/sigma/issues/5529
    SourceImage|startswith:
    - 'C:\Program Files\Microsoft Office\'
    - 'C:\Program Files (x86)\Microsoft Office\'
    TargetImage: 'System'
  filter_optional_explorer_vmtools:
    SourceImage|endswith: '\SysWOW64\explorer.exe'
    TargetImage:
    - 'C:\Program Files (x86)\VMware\VMware Tools\vmtoolsd.exe'
    - 'C:\Program Files\VMware\VMware Tools\vmtoolsd.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- This rule is best put in testing first in order to create a baseline that 
  reflects the data in your environment.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of remote threads by uncommon source processes, which is a behavior often associated with malware and advanced persistent threats (APTs) seeking privilege escalation or lateral movements within the environment. The likely objective of an attacker utilizing remote thread creation is to execute arbitrary code in the context of another process, thereby evading defenses and maintaining persistence.

  The relevant MITRE ATT&CK tactic and technique for this behavior are: **Execution** (TA0040) and **Remote Thread Injection** (T1055). The primary telemetry sources are Windows event logs related to process creation (Event ID 4688) and Sysmon logs (Event ID 1) that capture detailed process execution information. If this behavior is confirmed as malicious, it could allow attackers to manipulate processes, exfiltrate sensitive data, or create backdoors.

  It is important to note that this detection does NOT confirm malicious activity on its own; legitimate applications may also create remote threads under certain conditions.

  ### Investigation Steps

  - **Validate the source process:** Cross-reference the event with Event ID 4688 (Process Creation). Check the `NewProcessName` field to confirm the triggering application is one of the uncommon executables listed (e.g., `winword.exe`, `python.exe`, etc.). Legitimate activity may involve known administrator tools or scheduled tasks that utilize these processes properly.

  - **Examine thread creation details:** Review the Sysmon Event ID 1 (Process Creation) logs for the same timestamp, focusing on the `SourceImage` and `TargetImage` fields to identify both the originating and target processes of the thread creation. Malicious indicators include unusual or unexpected combinations, such as `conhost.exe` being targeted by `powershell.exe`.

  - **Identify the context of target processes:** Use the Process Explorer or a similar tool to analyze the target processes involved in thread creation. If `explorer.exe` is the target by an unusual source process, it's potentially suspicious, indicating an attacker may be attempting to exploit trusted processes.

  - **Check for signs of evasion:** Analyze telemetry for possible attempts to camouflage the execution context, such as if the known system processes (`svchost.exe`, `explorer.exe`) are involved. Review logs for any surrounding activities that look like privilege escalation moves or lateral movements after triggering the alert.

  - **Scrutinize related activities:** Check for other alerts, particularly for Remote Thread Injection (T1055) or any previous abnormal behavior involving the same source process. Correlate logs from different telemetry sources (such as EDR solutions or firewall logs) for further context.

  ### Prioritization

  The alert should be considered high severity due to its association with potential privilege escalation tactics. The affected systems' criticality increases risk if remote thread creation is exploited, enabling lateral movement and deeper infiltration. This behavior, while not uncommon in benign scenarios, is frequently weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations may include legitimate tool usage by system administrators or scheduled tasks triggering this alert. Proper configurations for logging are crucial; ensure full coverage of Sysmon and Windows Security Event logs for reliable detection. A related detection to consider is the use of abnormal DLL injection techniques (T1055.001) for a holistic security posture against remote thread creation tactics.

