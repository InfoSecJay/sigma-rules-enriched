title: Rare Remote Thread Creation By Uncommon Source Image
id: 02d1d718-dd13-41af-989d-ea85c7fab93f
related:
- id: 66d31e5f-52d6-40a4-9615-002d3789a119
  type: derived
status: test
description: Detects uncommon processes creating remote threads.
references:
- Personal research, statistical analysis
- https://lolbas-project.github.io
author: Perez Diego (@darkquassar), oscd.community
date: 2019-10-27
modified: 2025-12-08
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1055
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    SourceImage|endswith:
    - '\bash.exe'
    - '\cscript.exe'
    - '\cvtres.exe'
    - '\defrag.exe'
    - '\dialer.exe'
    - '\dnx.exe'
    - '\esentutl.exe'
    - '\excel.exe'
    - '\expand.exe'
    - '\find.exe'
    - '\findstr.exe'
    - '\forfiles.exe'
    - '\gpupdate.exe'
    - '\hh.exe'
    - '\installutil.exe'
    - '\lync.exe'
    - '\makecab.exe'
    - '\mDNSResponder.exe'
    - '\monitoringhost.exe'         # Loads .NET CLR by default and thus a favorite for process injection for .NET in-memory offensive tools.
    - '\msbuild.exe'
    - '\mshta.exe'
    - '\mspaint.exe'
    - '\outlook.exe'
    - '\ping.exe'
    - '\provtool.exe'
    - '\python.exe'
    - '\regsvr32.exe'
    - '\robocopy.exe'
    - '\runonce.exe'
    - '\sapcimc.exe'
    - '\smartscreen.exe'
    - '\spoolsv.exe'
    - '\tstheme.exe'
    - '\userinit.exe'
    - '\vssadmin.exe'
    - '\vssvc.exe'
    - '\w3wp.exe'
    - '\winscp.exe'
    - '\winword.exe'
    - '\wmic.exe'
    - '\wscript.exe'
  filter_main_conhost:
    SourceImage:
    - 'C:\Windows\System32\Defrag.exe'
    - 'C:\Windows\System32\makecab.exe'
    TargetImage: 'C:\Windows\System32\conhost.exe'
  filter_main_provtol_svchost:
    SourceImage: 'C:\Windows\System32\provtool.exe'
    TargetImage: 'C:\Windows\System32\svchost.exe'
  filter_main_provtool_system:
    SourceImage: 'C:\Windows\System32\provtool.exe'
    TargetImage: 'System'
  filter_main_userinit:
    SourceImage: 'C:\Windows\System32\userinit.exe'
    TargetImage: 'C:\Windows\explorer.exe'
  filter_main_winword:
    SourceImage|endswith: '\WINWORD.EXE'
    TargetImage|startswith:
    - 'C:\Program Files (x86)\'         # C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
    - 'C:\Program Files\'         # C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\Office16\AI\ai.exe
  filter_main_ms_office:
        # Raised by following issue: https://github.com/SigmaHQ/sigma/issues/5529
    SourceImage|startswith:
    - 'C:\Program Files\Microsoft Office\'
    - 'C:\Program Files (x86)\Microsoft Office\'
    TargetImage: 'System'
  filter_optional_explorer_vmtools:
    SourceImage|endswith: '\SysWOW64\explorer.exe'
    TargetImage:
    - 'C:\Program Files (x86)\VMware\VMware Tools\vmtoolsd.exe'
    - 'C:\Program Files\VMware\VMware Tools\vmtoolsd.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- This rule is best put in testing first in order to create a baseline that reflects
  the data in your environment.
level: high
note: |
  ### Technical Context
  This rule detects anomalous processes that create remote threads from less common source images. Remote thread creation is often leveraged by attackers to inject malicious code into legitimate processes, facilitating persistence and evasion of detection mechanisms. By targeting unusual source images, such as those typically not associated with legitimate administrative tasks, the detection aims to identify potential misuse of system components by structured threats or tools that execute remote code.

  The threat scenario typically involves an attacker who may be conducting privilege escalation, using tactics that involve executing payloads in-memory to evade traditional file-based defenses. Notable tools and techniques may include Cobalt Strike, which can utilize such methods for remote access and control, or other in-memory execution frameworks. Associated MITRE ATT&CK tactics include **Privilege Escalation** (TA0004) and **Defense Evasion** (TA0005), with techniques like **Process Injection** (T1055) specifically relevant to the detection.

  Primary data sources for this detection include process creation logs that track the execution of programs on Windows systems, particularly those related to remote thread creation as logged by the Windows operating system.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for the identified unusual source images and account for any processes that have spawned remote threads. Focus on entries around the time of the alert for detailed correlation.

  - **Examine Thread Creation Patterns**: Investigate the thread creation patterns in the processes flagged by the alert. Look for signs of thread injection behaviors, which can be indicative of suspicious activity.

  - **Correlate With Other Security Telemetry**: Look for correlations in other security logs (e.g., EDR alerts, firewall logs) that coincide with the suspicious process actions. This can help pinpoint the attack vector utilized and determine if the behavior aligns with known attack profiles.

  - **Assess Normal Baselines**: Compare the findings against baseline behavior for your environment to identify any configurations or applications that may have led to false positives. Adjust monitoring and alert settings accordingly after validation.

  ### Prioritization
  Given the high likelihood of misuse for privilege escalation and evasion of defenses through remote thread creation, this alert is deemed high severity. Any instance of such behavior indicates a potential compromise that requires immediate investigation to mitigate risk to enterprise assets.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for rare or legitimate uses of certain tools or processes that could generate similar alerts, leading to potential false positives. This detection rule assumes that all necessary logging for process creation and remote thread activities is enabled and correctly configured on monitored endpoints. Adjustments may be needed based on environmental baselines to reduce noise and enhance detection accuracy.

