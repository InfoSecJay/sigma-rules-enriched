logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    SourceImage|endswith:
    - '\bash.exe'
    - '\cscript.exe'
    - '\cvtres.exe'
    - '\defrag.exe'
    - '\dialer.exe'
    - '\dnx.exe'
    - '\esentutl.exe'
    - '\excel.exe'
    - '\expand.exe'
    - '\find.exe'
    - '\findstr.exe'
    - '\forfiles.exe'
    - '\gpupdate.exe'
    - '\hh.exe'
    - '\installutil.exe'
    - '\lync.exe'
    - '\makecab.exe'
    - '\mDNSResponder.exe'
    - '\monitoringhost.exe'         # Loads .NET CLR by default and thus a favorite for process injection for .NET in-memory offensive tools.
    - '\msbuild.exe'
    - '\mshta.exe'
    - '\mspaint.exe'
    - '\outlook.exe'
    - '\ping.exe'
    - '\provtool.exe'
    - '\python.exe'
    - '\regsvr32.exe'
    - '\robocopy.exe'
    - '\runonce.exe'
    - '\sapcimc.exe'
    - '\smartscreen.exe'
    - '\spoolsv.exe'
    - '\tstheme.exe'
    - '\userinit.exe'
    - '\vssadmin.exe'
    - '\vssvc.exe'
    - '\w3wp.exe'
    - '\winscp.exe'
    - '\winword.exe'
    - '\wmic.exe'
    - '\wscript.exe'
  filter_main_conhost:
    SourceImage:
    - 'C:\Windows\System32\Defrag.exe'
    - 'C:\Windows\System32\makecab.exe'
    TargetImage: 'C:\Windows\System32\conhost.exe'
  filter_main_provtol_svchost:
    SourceImage: 'C:\Windows\System32\provtool.exe'
    TargetImage: 'C:\Windows\System32\svchost.exe'
  filter_main_provtool_system:
    SourceImage: 'C:\Windows\System32\provtool.exe'
    TargetImage: 'System'
  filter_main_userinit:
    SourceImage: 'C:\Windows\System32\userinit.exe'
    TargetImage: 'C:\Windows\explorer.exe'
  filter_main_winword:
    SourceImage|endswith: '\WINWORD.EXE'
    TargetImage|startswith:
    - 'C:\Program Files (x86)\'         # C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
    - 'C:\Program Files\'         # C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\Office16\AI\ai.exe
  filter_main_ms_office:
        # Raised by following issue: https://github.com/SigmaHQ/sigma/issues/5529
    SourceImage|startswith:
    - 'C:\Program Files\Microsoft Office\'
    - 'C:\Program Files (x86)\Microsoft Office\'
    TargetImage: 'System'
  filter_optional_explorer_vmtools:
    SourceImage|endswith: '\SysWOW64\explorer.exe'
    TargetImage:
    - 'C:\Program Files (x86)\VMware\VMware Tools\vmtoolsd.exe'
    - 'C:\Program Files\VMware\VMware Tools\vmtoolsd.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- This rule is best put in testing first in order to create a baseline that 
  reflects the data in your environment.
level: high
note: |
  ### Technical Context

  This Sigma rule detects uncommon processes creating remote threads, a behavior frequently exploited by attackers for privilege escalation and process injection. The likely attacker objective includes executing malicious payloads or manipulating legitimate processes to evade detection and maintain persistence. This behavior fits within the MITRE ATT&CK framework under the tactic **Privilege Escalation** (TA0004) and the technique **Thread Injection** (T1055).

  The primary telemetry source is Windows process creation events, particularly focused on remote thread creation captured through Windows Event ID 4688 and Sysmon Event ID 1. The security impact, if malicious, could lead to a compromised system, escalated privileges for unauthorized users, and further exploitation of the network. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications may exhibit similar behavior under certain conditions.

  ### Investigation Steps

  - **Check process creation records**: Review Windows Event ID 4688 and Sysmon Event ID 1 logs for the detected remote thread creation event. Focus on the `SourceImage` and `TargetImage` fields to identify uncommon behavior. Examine if the source process is a known application or service; common administrative tasks may trigger similar actions.

  - **Identify legitimate software behavior**: Consider whether the triggering process is a standard utility typically used in your environment (e.g., `powershell.exe`, `winword.exe`). Legitimate remote thread creations usually originate from well-known executables engaged in their standard functionalities.

  - **Correlate with known malicious indicators**: Investigate if the `SourceImage` correlates with known malicious tools or techniques. Check threat intelligence sources or repositories like the LOLBAS project to identify if the executable is commonly associated with abuse.

  - **Analyze parent-child process relationships**: Using Sysmon Event ID 1, examine the `ParentImage` of the detected process to evaluate the context in which the process was created. A suspicious parent process could indicate malicious intent.

  - **Examine network activity**: Look at related network connection logs (e.g., Windows Firewall logs, DNS queries) to identify unusual outbound connections from the involved process. This can suggest data exfiltration or C2 (command and control) communication.

  - **Review baseline metrics**: Compare the identified events against a pre-established baseline for your environment to identify anomalies. If these detections are a known occurrence within routine tasks, document them to minimize false positives in future investigations.

  ### Prioritization

  This alert is of **high severity** as it highlights a potentially serious security issue involving privilege escalation or remote code execution. The affected processes are commonly weaponized by attackers. Given their legitimate uses, invasive investigation is warranted to discern intent.

  ### Blind Spots and Assumptions

  Detection may be limited if Sysmon is not properly configured or if the telemetry collection is incomplete. Malicious actors may use process names to masquerade as legitimate applications to bypass detection. Legitimate administrative integrations that utilize remote threads may also trigger false alerts. A related detection for additional context is monitoring for **suspicious process creation** (MITRE ID T1055) which can provide wider coverage of injection techniques used in tandem with this rule.

