note: |
  ### Technical Context
  This detection rule identifies the creation of remote threads by the CACTUSTORCH tool, a known Windows post-exploitation tool used by attackers. CACTUSTORCH utilizes legitimate Windows executables, such as `cscript.exe`, `wscript.exe`, `mshta.exe`, `winword.exe`, and `excel.exe`, to execute malicious payloads in a stealthy manner. The primary intentions behind using this technique include establishing persistence, evading detection, and executing commands remotely on compromised systems.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Execution** (TA0002): By leveraging everyday applications to execute malicious commands.
  - **Privilege Escalation** (TA0004): Gaining higher access rights through manipulation of system processes.
  - **Defense Evasion** (TA0005): Using legitimate tools to disguise malicious activity.

  Primary data sources for this detection include Windows event logs that capture remote thread creation activities, particularly focusing on process creation events from trusted binaries that may be misused in an attack scenario.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows Event Logs for unusual instances of remote thread creation pertaining to the identified legitimate applications (`cscript.exe`, `wscript.exe`, etc.) being used for potentially malicious purposes.

  - **Analyze Target Image**: Investigate any `TargetImage` values that contain `\SysWOW64\`, as this could signal the execution of malicious code in a 32-bit subsystem, hinting at possible exploitation.

  - **Evaluate Source Module**: If the detection indicates a `null` `StartModule`, ensure to check the parent processes to understand how the execution context was initially established, as this could reveal further malicious behaviors.

  - **Correlate with Other Alerts**: Look for other suspicious activities or alerts correlated with this event, including abnormal network connections or elevated privileges, to determine if this is part of a larger attack vector.

  ### Prioritization
  The severity of this alert is considered high due to the potential implications of remote thread creation, which can lead to privilege escalation and the execution of malware without drawing attention. Timely response is crucial to mitigate risks associated with persistent threats in the environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the logging level does not capture all process creation events or if the legitimate applications are silenced via whitelisting, leading to false negatives. The detection logic assumes that attackers will use these standard utilities to create remote threads, and that corresponding telemetry is fully enabled in the Windows environment. Proper configuration of logging, especially for process creation events, is essential for the accuracy of this alert.

