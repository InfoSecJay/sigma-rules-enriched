title: Remote Thread Creation By Uncommon Source Image
id: 66d31e5f-52d6-40a4-9615-002d3789a119
related:
- id: 02d1d718-dd13-41af-989d-ea85c7fab93f
  type: derived
status: test
description: Detects uncommon processes creating remote threads.
references:
- Personal research, statistical analysis
- https://lolbas-project.github.io
author: Perez Diego (@darkquassar), oscd.community
date: 2019-10-27
modified: 2025-07-08
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    SourceImage|endswith:
    - '\explorer.exe'
    - '\iexplore.exe'
    - '\msiexec.exe'
    - '\powerpnt.exe'
    - '\schtasks.exe'
    - '\winlogon.exe'
  filter_main_winlogon_1:
    SourceImage: 'C:\Windows\System32\winlogon.exe'
    TargetImage:
    - 'C:\Windows\System32\services.exe'         # happens on Windows 7
    - 'C:\Windows\System32\wininit.exe'         # happens on Windows 7
    - 'C:\Windows\System32\csrss.exe'         # multiple OS
    - 'C:\Windows\System32\LogonUI.exe'         # multiple OS
    - 'C:\Windows\System32\wlrmdr.exe'
    - 'C:\Windows\System32\AtBroker.exe'
    - 'C:\Windows\System32\dwm.exe'
    - 'C:\Windows\System32\fontdrvhost.exe'
    - 'C:\Windows\System32\userinit.exe'
  filter_main_winlogon_2:
    SourceImage: 'C:\Windows\System32\winlogon.exe'
    TargetParentProcessId: 4
  filter_main_schtasks_conhost:
    SourceImage:
    - 'C:\Windows\System32\schtasks.exe'
    - 'C:\Windows\SysWOW64\schtasks.exe'
    TargetImage: 'C:\Windows\System32\conhost.exe'
  filter_main_explorer:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_system:
    TargetImage: 'System'
  filter_main_msiexec_1:
        # Note: MSI installers will trigger this
    SourceImage|endswith: '\msiexec.exe'
    TargetImage|contains:
    - '\AppData\Local\'
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\Microsoft.NET\Framework64\'         # C:\Windows\Microsoft.NET\Framework\v4.0.30319\ngen.exe
  filter_main_msiexec_2:
    SourceImage|endswith: '\msiexec.exe'
    TargetImage:
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
  filter_main_iexplore:
    SourceImage: 'C:\Program Files\Internet Explorer\iexplore.exe'
    TargetImage:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Windows\System32\rundll32.exe'
  filter_main_powerpnt:
    SourceImage|endswith: '\POWERPNT.EXE'
    TargetImage|contains:
    - 'C:\Program Files\Microsoft Office\'         # C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\Office16\AI\ai.exe
    - 'C:\Program Files (x86)\Microsoft Office\'
  filter_optional_aurora_smartconsole1:
    SourceImage: 'C:\Program Files\internet explorer\iexplore.exe'
    SourceCommandLine|contains|all:
    - 'https://'
    - '.checkpoint.com/documents/'
    - 'SmartConsole_OLH/'
    - 'default.htm#cshid='
  filter_optional_aurora_smartconsole2:
    SourceImage: 'C:\Program Files\internet explorer\iexplore.exe'
    SourceParentImage|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    SourceParentImage|contains|all:
    - '\CheckPoint\SmartConsole\'
    - '\SmartConsole.exe'
  filter_optional_powerpnt:
        # Raised by the following issue: https://github.com/SigmaHQ/sigma/issues/2479
    SourceImage|contains: '\Microsoft Office\'
    SourceImage|endswith: '\POWERPNT.EXE'
    TargetImage: 'C:\Windows\System32\csrss.exe'
  filter_main_null:
    TargetImage:
  filter_main_empty:
    TargetImage: ''
  filter_optional_onedrive:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|endswith: '\AppData\Local\Microsoft\OneDrive\OneDrive.exe'
  filter_optional_aurora:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|endswith: '\aurora-dashboard.exe'
  filter_optional_officesetup:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|endswith: '\OfficeSetup.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- This rule is best put in testing first in order to create a baseline that 
  reflects the data in your environment.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of remote threads by common but potentially misused processes such as `explorer.exe`, `iexplore.exe`, and `msiexec.exe`. The likely objective of an attacker utilizing this technique is privilege escalation or stealthy execution of arbitrary code, taking advantage of benign processes to evade detection. The relevant MITRE ATT&CK tactic is "Privilege Escalation" and the technique is T1055 (Process Injection). The primary telemetry comes from Windows event logs related to process creation, specifically targeting events related to remote thread creation.

  If the detected behavior is malicious, it could signify an ongoing compromise, potentially leading to further exploitation of the system. However, it is crucial to note that this detection alone does not confirm malicious intent, as legitimate applications may create remote threads in normal operations.

  ### Investigation Steps

  - **Check process details**: Review the Security Event ID 4688 logs to confirm the details of the process creation event. Verify the `SourceImage`, `CommandLine`, and `User` fields for anomalies, noting that malicious activity often accompanies unusual source processes or command-line parameters.

  - **Correlate with known behaviors**: Identify baseline behavior for the common processes listed in the Sigma rule. For example, normal operations for `iexplore.exe` and `explorer.exe` typically involve basic user navigation, not remote thread creation.

  - **Identify peculiar siblings**: Investigate the parent-child process relationships in the process creation logs. Look for unexpected child processes spawned by high-risk source images. For instance, remote thread creation targeting `csrss.exe` or `LogonUI.exe` from `explorer.exe` is highly suspicious.

  - **Examine network activity**: Analyze firewall or network logs for unusual outbound connections that coincide with the detected event timestamps. Pay special attention to communications initiated by the processes flagged in the rule, as high-risk indicators may suggest exfiltration attempts or command and control (C2) communication.

  - **Review legitimate application execution**: Scope out known legitimate uses of the detected processes by checking the deployment and usage context within your organization (e.g., application versions and update cycles). Reference process documentation for `msiexec.exe` or Office applications that may trigger similar threads under expected conditions.

  ### Prioritization

  This alert should be classified as medium severity due to the potential impact on systems, particularly if processes with high privileges are involved. The likelihood of abuse exists as these methods are common in exploitation scenarios, often seen in targeted attacks aiming for further escalation or stealthy persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential of evasion techniques such as process hollowing or using legitimate software in unexpected ways. Ensure logging for process creation is enabled and configured correctly, including capturing command lines and parent-child relationships. Legitimate activities, such as updates via `msiexec.exe` or scripts run through `powershell.exe`, may trigger the alert. A related detection that enhances this coverage is the monitoring of command execution logs, such as Windows PowerShell logs (Event ID 4104).

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
