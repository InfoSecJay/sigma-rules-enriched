title: Remote Thread Creation By Uncommon Source Image
id: 66d31e5f-52d6-40a4-9615-002d3789a119
related:
- id: 02d1d718-dd13-41af-989d-ea85c7fab93f
  type: derived
status: test
description: Detects uncommon processes creating remote threads.
references:
- Personal research, statistical analysis
- https://lolbas-project.github.io
author: Perez Diego (@darkquassar), oscd.community
date: 2019-10-27
modified: 2025-07-08
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1055
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    SourceImage|endswith:
    - '\explorer.exe'
    - '\iexplore.exe'
    - '\msiexec.exe'
    - '\powerpnt.exe'
    - '\schtasks.exe'
    - '\winlogon.exe'
  filter_main_winlogon_1:
    SourceImage: 'C:\Windows\System32\winlogon.exe'
    TargetImage:
    - 'C:\Windows\System32\services.exe'         # happens on Windows 7
    - 'C:\Windows\System32\wininit.exe'         # happens on Windows 7
    - 'C:\Windows\System32\csrss.exe'         # multiple OS
    - 'C:\Windows\System32\LogonUI.exe'         # multiple OS
    - 'C:\Windows\System32\wlrmdr.exe'
    - 'C:\Windows\System32\AtBroker.exe'
    - 'C:\Windows\System32\dwm.exe'
    - 'C:\Windows\System32\fontdrvhost.exe'
    - 'C:\Windows\System32\userinit.exe'
  filter_main_winlogon_2:
    SourceImage: 'C:\Windows\System32\winlogon.exe'
    TargetParentProcessId: 4
  filter_main_schtasks_conhost:
    SourceImage:
    - 'C:\Windows\System32\schtasks.exe'
    - 'C:\Windows\SysWOW64\schtasks.exe'
    TargetImage: 'C:\Windows\System32\conhost.exe'
  filter_main_explorer:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_system:
    TargetImage: 'System'
  filter_main_msiexec_1:
        # Note: MSI installers will trigger this
    SourceImage|endswith: '\msiexec.exe'
    TargetImage|contains:
    - '\AppData\Local\'
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\Microsoft.NET\Framework64\'         # C:\Windows\Microsoft.NET\Framework\v4.0.30319\ngen.exe
  filter_main_msiexec_2:
    SourceImage|endswith: '\msiexec.exe'
    TargetImage:
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
  filter_main_iexplore:
    SourceImage: 'C:\Program Files\Internet Explorer\iexplore.exe'
    TargetImage:
    - 'C:\Program Files (x86)\Internet Explorer\iexplore.exe'
    - 'C:\Windows\System32\rundll32.exe'
  filter_main_powerpnt:
    SourceImage|endswith: '\POWERPNT.EXE'
    TargetImage|contains:
    - 'C:\Program Files\Microsoft Office\'         # C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\Office16\AI\ai.exe
    - 'C:\Program Files (x86)\Microsoft Office\'
  filter_optional_aurora_smartconsole1:
    SourceImage: 'C:\Program Files\internet explorer\iexplore.exe'
    SourceCommandLine|contains|all:
    - 'https://'
    - '.checkpoint.com/documents/'
    - 'SmartConsole_OLH/'
    - 'default.htm#cshid='
  filter_optional_aurora_smartconsole2:
    SourceImage: 'C:\Program Files\internet explorer\iexplore.exe'
    SourceParentImage|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    SourceParentImage|contains|all:
    - '\CheckPoint\SmartConsole\'
    - '\SmartConsole.exe'
  filter_optional_powerpnt:
        # Raised by the following issue: https://github.com/SigmaHQ/sigma/issues/2479
    SourceImage|contains: '\Microsoft Office\'
    SourceImage|endswith: '\POWERPNT.EXE'
    TargetImage: 'C:\Windows\System32\csrss.exe'
  filter_main_null:
    TargetImage:
  filter_main_empty:
    TargetImage: ''
  filter_optional_onedrive:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|endswith: '\AppData\Local\Microsoft\OneDrive\OneDrive.exe'
  filter_optional_aurora:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|endswith: '\aurora-dashboard.exe'
  filter_optional_officesetup:
    SourceImage: 'C:\Windows\explorer.exe'
    TargetImage|endswith: '\OfficeSetup.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- This rule is best put in testing first in order to create a baseline that 
  reflects the data in your environment.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of remote threads by common but potentially dangerous Windows processes, such as `explorer.exe` or `msiexec.exe`. The likely attacker objective is to leverage these processes to gain higher privileges or execute code in the context of a trusted process, facilitating further malicious activities like malware installation or persistence. The relevant MITRE ATT&CK techniques include Privilege Escalation (T1055) and Defense Evasion.

  The primary telemetry sources for this detection are Windows Event logs and Sysmon logs, specifically focusing on event IDs related to process creation (e.g., Event ID 4688) and remote thread creation activities. If the behavior is indeed malicious, it may allow attackers to manipulate critical system processes. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may occasionally trigger similar activity under controlled conditions.

  ### Investigation Steps

  - **Check event logs for remote thread creation**: Review Sysmon Event ID 8 (CreateRemoteThread) and correlate with Process Creation logs (Event ID 4688). Look specifically for processes creating threads with unusual parent-child relationships.

  - **Identify the invoking process**: Investigate the `SourceImage` field in triggered alerts to pinpoint which common process initiated the remote thread creation. Document processes like `iexplore.exe` or `msiexec.exe` in unusual scenarios where they invoke critical system processes unexpectedly.

  - **Validate against known benign behavior**: Contrast the invoking process' command line arguments with typical usage. For example, `iexplore.exe` usually accesses web resources but shouldn’t attempt to create threads in `csrss.exe` or other core system processes.

  - **Review parent process information**: For alerts involving `winlogon.exe`, confirm the `TargetParentProcessId` aligns with PID 4 (System). Any deviations may suggest suspicious activity.

  - **Capture additional telemetry**: If the alert concerns `explorer.exe` creating threads for executables in user directories (e.g., `AppData\Local\`), collect file creation artifacts from those paths and review for unusual timestamps or file sizes.

  - **Examine historical context**: Assess whether similar alerts have been observed in the past and confirm the response to those incidents to identify trends or unresolved issues that require additional scrutiny.

  ### Prioritization

  This alert has medium severity due to the potential impact on system integrity if malicious activity is confirmed. The likelihood of exploitation is moderate, as common processes are often exploited in privilege escalation attacks. This technique is somewhat weaponized as attackers frequently use it to create persistence mechanisms.

  ### Blind Spots and Assumptions

  Evasion techniques include renaming and obfuscating executing binaries to avoid detection by common security mechanisms. Reliable detection depends on proper Sysmon configurations and active logging of relevant event IDs. Legitimate software installations or updates, such as software management tools initiating from `msiexec.exe`, could trigger these alerts. Related detections focusing on process injection techniques (T1055) bolster coverage and investigative thoroughness.

