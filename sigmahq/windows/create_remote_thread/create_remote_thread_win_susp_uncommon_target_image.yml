logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    TargetImage|endswith:
    - '\calc.exe'
    - '\calculator.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\ping.exe'
    - '\sethc.exe'
    - '\spoolsv.exe'
    - '\wordpad.exe'
    - '\write.exe'
  filter_main_csrss:
    SourceImage: 'C:\Windows\System32\csrss.exe'
  filter_main_notepad:
    SourceImage:
    - 'C:\Windows\System32\explorer.exe'
    - 'C:\Windows\System32\OpenWith.exe'
    TargetImage: 'C:\Windows\System32\notepad.exe'
  filter_main_sethc:
    SourceImage: 'C:\Windows\System32\AtBroker.exe'
    TargetImage: 'C:\Windows\System32\Sethc.exe'
  filter_optional_aurora_1:
    StartFunction: 'EtwpNotificationThread'
  filter_optional_aurora_2:
    SourceImage|contains: 'unknown process'
  filter_optional_vmtoolsd:
    SourceImage: 'C:\Program Files\VMware\VMware Tools\vmtoolsd.exe'
    StartFunction: 'GetCommandLineW'
    TargetImage:
    - 'C:\Windows\System32\notepad.exe'
    - 'C:\Windows\System32\spoolsv.exe'
  filter_optional_xerox_pjems:
    SourceImage: 'C:\Program Files\Xerox\XeroxPrintExperience\CommonFiles\XeroxPrintJobEventManagerService.exe'
    StartFunction: 'LoadLibraryW'
    TargetImage: 'C:\Windows\System32\spoolsv.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of remote threads in uncommon target processes such as `calc.exe`, `notepad.exe`, and others that typically do not initiate threads remotely. The likely attacker objective is to leverage these benign applications as a means to execute malicious code without arising suspicion, potentially gaining unauthorized access or escalated privileges. Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1562) and **Privilege Escalation** (T1055.003). The primary telemetry sources are Windows Security Event Logs focusing on the process creation events (Event ID 4688) and potentially Sysmon logs for detailed process activity.

  If the behavior is malicious, it can lead to unauthorized remote control of the system, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that the observed activity is definitively malicious; further investigation is required to establish intent and context.

  ---

  ### Investigation Steps

  - **Identify the creating process:** Review Security Event ID 4688 logs for the user who initiated the remote thread creation. Focus on the `ProcessId` and `NewProcessName` fields to check which application is being targeted and verify if the source aligns with known legitimate use cases (like an authorized user running benign applications).

  - **Examine command-line arguments:** Investigate the command line of the source process (Event ID 4688, `CommandLine` field) to determine if the execution context appears unusual or malicious. Legitimate activity will show common arguments, whereas anomalies might reveal potential malicious intent.

  - **Validate the thread context:** For any alerts involving `csrss.exe`, compare against expected behavior for this essential Windows process. Malicious indicators include attempts to create threads in unusual contexts or processes not typically used for remote thread execution, which may indicate an attack.

  - **Cross-reference with Sysmon logs:** Check Sysmon Event ID 8 (CreateRemoteThread) for a holistic view of thread creation patterns, including the `SourceImage`, `TargetImage`, and `StartFunction`. Look for unexpected function calls and processes that indicate an anomaly, particularly those involving known benign applications or irrelevant ones.

  - **Review for known benign exceptions:** Confirm if the activity stems from authorized uses of applications such as remote desktop tools or corporate scripts that legitimately utilize processes like `notepad.exe` or `calc.exe`. Document any legitimate cases noted during the investigation.

  - **Assess for evasion techniques:** Investigate if the source processes (like `vmtoolsd.exe` or `pjems.exe`) attempt to hide malicious activities during the remote thread creation. Note if the source is leveraging DLL injection or known evasion techniques, which can point to potential security risks.

  ---

  ### Prioritization

  This alert is of medium severity as it could indicate an attempt at privilege escalation or evasion in your environment. The impact on a compromised system can be significant, as it may lead to unauthorized access across an enterprise network. However, while the behavior is suspicious, it does not inherently confirm a breach without context.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate use of these applications that could trigger false positives. Reliable detection requires proper logging configurations for Sysmon and Windows event logs; absence of these could lead to undetected malicious activities. There's also a chance that benign automation leveraging legitimate applications may generate similar alerts, making it essential to understand typical operational patterns. A related rule focusing on Injections (like T1055) can provide additional context to strengthen overall detection coverage.

