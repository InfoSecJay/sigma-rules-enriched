detection:
  selection:
    TargetImage|endswith:
    - '\calc.exe'
    - '\calculator.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\ping.exe'
    - '\sethc.exe'
    - '\spoolsv.exe'
    - '\wordpad.exe'
    - '\write.exe'
  filter_main_csrss:
    SourceImage: 'C:\Windows\System32\csrss.exe'
  filter_main_notepad:
    SourceImage:
    - 'C:\Windows\System32\explorer.exe'
    - 'C:\Windows\System32\OpenWith.exe'
    TargetImage: 'C:\Windows\System32\notepad.exe'
  filter_main_sethc:
    SourceImage: 'C:\Windows\System32\AtBroker.exe'
    TargetImage: 'C:\Windows\System32\Sethc.exe'
  filter_optional_aurora_1:
    StartFunction: 'EtwpNotificationThread'
  filter_optional_aurora_2:
    SourceImage|contains: 'unknown process'
  filter_optional_vmtoolsd:
    SourceImage: 'C:\Program Files\VMware\VMware Tools\vmtoolsd.exe'
    StartFunction: 'GetCommandLineW'
    TargetImage:
    - 'C:\Windows\System32\notepad.exe'
    - 'C:\Windows\System32\spoolsv.exe'
  filter_optional_xerox_pjems:
    SourceImage: 'C:\Program Files\Xerox\XeroxPrintExperience\CommonFiles\XeroxPrintJobEventManagerService.exe'
    StartFunction: 'LoadLibraryW'
    TargetImage: 'C:\Windows\System32\spoolsv.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects remote thread creation in processes that are not commonly targeted, such as `calc.exe` and `notepad.exe`. An attacker may use this technique to inject malicious code into these benign-looking processes for stealthy execution or to bypass detection mechanisms. Relevant MITRE ATT&CK techniques include Privilege Escalation via Process Injection (T1055.003). The primary telemetry source is Windows process creation events, specifically those generated by the Windows API for remote thread creation. If confirmed malicious, this could potentially lead to system compromise, unauthorized access, or data exfiltration. Importantly, this detection does NOT confirm an active compromise without additional corroborating evidence.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for the suspicious target process names (e.g., `calc.exe`, `notepad.exe`). Pay particular attention to unusual parent processes, which may indicate malicious behavior.

  - **Identify command line arguments:** Examine the command line used during the process creation (Sysmon Event ID 1, `CommandLine` field). Malicious indicators may include arguments that reflect obfuscation or are atypical for the benign processes listed.

  - **Correlate with known malicious behavior:** Search for previous incidents or IOCs involving `calc.exe` or other target images. Cross-reference with the threat intelligence database to determine if this behavior is associated with recognized attacks.

  - **Determine asset criticality:** Assess the affected host's role (e.g., user workstation vs. sensitive server) to prioritize investigation. If it’s a critical server, escalate to Tier 3 without delay.

  - **Examine legitimate usage patterns:** For benign activity, assess typical usage of `calc.exe` or `notepad.exe` within your environment. This may include common file processing by known applications or authorized users.

  - **Investigate remote execution capabilities:** Check for known remote access tools or scripts that interact with these processes. Look at API calls in telemetry logs that show unusual usage patterns indicative of an attack.

  ---

  ### Prioritization

  This alert warrants medium priority due to the potential impact of the affected systems and the likelihood that attackers may attempt to exploit benign processes. Such behavior is not commonly weaponized in mainstream attacks, but the uniqueness of the process targets may indicate evasive tactics worthy of further investigation.

  ---

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate applications to spawn threads in these processes, which could inadvertently trigger the alert. Reliable detection requires accurate logging configurations for Sysmon and Windows event logs. Activities such as automated software updates or legitimate user actions (e.g., using `calc.exe` during a training session) may also set off the alert. A related detection for broader process injection techniques (e.g., T1055) strengthens overall detection coverage.

