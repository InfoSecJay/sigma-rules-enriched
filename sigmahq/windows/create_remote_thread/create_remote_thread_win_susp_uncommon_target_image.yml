logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    TargetImage|endswith:
    - '\calc.exe'
    - '\calculator.exe'
    - '\mspaint.exe'
    - '\notepad.exe'
    - '\ping.exe'
    - '\sethc.exe'
    - '\spoolsv.exe'
    - '\wordpad.exe'
    - '\write.exe'
  filter_main_csrss:
    SourceImage: 'C:\Windows\System32\csrss.exe'
  filter_main_notepad:
    SourceImage:
    - 'C:\Windows\System32\explorer.exe'
    - 'C:\Windows\System32\OpenWith.exe'
    TargetImage: 'C:\Windows\System32\notepad.exe'
  filter_main_sethc:
    SourceImage: 'C:\Windows\System32\AtBroker.exe'
    TargetImage: 'C:\Windows\System32\Sethc.exe'
  filter_optional_aurora_1:
    StartFunction: 'EtwpNotificationThread'
  filter_optional_aurora_2:
    SourceImage|contains: 'unknown process'
  filter_optional_vmtoolsd:
    SourceImage: 'C:\Program Files\VMware\VMware Tools\vmtoolsd.exe'
    StartFunction: 'GetCommandLineW'
    TargetImage:
    - 'C:\Windows\System32\notepad.exe'
    - 'C:\Windows\System32\spoolsv.exe'
  filter_optional_xerox_pjems:
    SourceImage: 'C:\Program Files\Xerox\XeroxPrintExperience\CommonFiles\XeroxPrintJobEventManagerService.exe'
    StartFunction: 'LoadLibraryW'
    TargetImage: 'C:\Windows\System32\spoolsv.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of remote threads in uncommon target processes, which may indicate malicious activity such as privilege escalation, evasion, or exploitation. Specifically, attackers may aim to execute arbitrary code in benign processes to bypass security mechanisms and maintain persistence. It aligns with the MITRE ATT&CK technique T1055.003 (Process Injection: Thread Injection).

  The primary telemetry source is Windows Event Logs related to process creation (Event ID 4688) and potentially Sysmon logs (Event ID 1) that track process creation events, enabling detailed identification of the source and target images involved. If this behavior is malicious, it may allow the adversary to run malicious payloads in trusted processes, leading to significant security breaches. Importantly, this detection does NOT confirm that an attack is occurring; it only highlights potentially suspicious behavior requiring further investigation.

  ### Investigation Steps

  - **Check Event ID 4688 for remote threads:** Review Windows Security Event ID 4688 logs to identify the creation of remote threads in processes like `notepad.exe` or `calc.exe`. Ensure the SourceImage corresponds to `csrss.exe` or other known legitimate processes.

  - **Examine Sysmon logs for process injection:** Look for Sysmon Event ID 1 to analyze processes that created remote threads. Pay attention to `TargetImage` and `SourceImage` fields. Confirm if the source image appears legitimate.

  - **Identify high-confidence malicious indicators:** Analyze the thread creation events where the `SourceImage` matches `csrss.exe` and the `TargetImage` is one of the uncommon processes listed. These events should be flagged for further analysis as they may indicate stealthy injection attempts.

  - **Evaluate for legitimate behavior:** Confirm that expected behavior includes common applications being launched normally by user actions. For example, `notepad.exe` launched directly by a user’s action (user context) is expected behavior, while remote thread creation should come from trusted sources only.

  - **Review application logs for known good sources:** Collect logs from `vmtoolsd.exe` and `XeroxPrintJobEventManagerService.exe` and check for normal operations that might trigger legitimate remote thread creation to rule out false positives.

  - **Correlate with network activity:** If available, analyze network logs for connections initiated by these processes (e.g., suspicious outbound traffic). Use tools like Sysmon to correlate anomaly detection with network behavior.

  ### Prioritization

  This alert is of medium severity due to the potential impact on system integrity, especially if targeting critical systems. The likelihood of malicious abuse is moderate, given that process injection techniques are often weaponized. Investigation is warranted to determine whether this behavior is part of a broader attack.

  ### Blind Spots and Assumptions

  Detection may be limited if logs from `csrss.exe` or other critical processes are not thoroughly monitored, as these processes could be misused in benign contexts. Legitimate software utilizing remote thread creation may trigger false positives. Companion detections, such as monitoring for the execution of atypical command-line arguments or unusual parent-child process relationships, strengthen overall coverage against evasion techniques.

