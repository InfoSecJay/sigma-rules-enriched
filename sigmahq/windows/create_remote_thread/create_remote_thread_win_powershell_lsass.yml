note: |
  ### Technical Context

  This detection identifies attempts at credential dumping by monitoring PowerShell processes that create remote threads into the `lsass.exe` process, which handles security accounts and credentials in Windows systems. The likely objective of an attacker using this technique is to extract sensitive credentials from the Local Security Authority Subsystem Service (LSASS) in order to escalate privileges or further infiltrate the environment. This behavior is associated with the MITRE ATT&CK technique **Credential Dumping (T1003.001)**.

  The primary telemetry source for this detection is Windows event logging capturing process creation events, specifically targeting `create_remote_thread` activities involving PowerShell. If successful and malicious, such actions could lead to the compromise of user credentials and unauthorized access to critical systems. However, this detection alone does NOT confirm that a credential dump has occurred; it merely indicates that suspicious threading activities involving PowerShell and LSASS have been initiated.

  ### Investigation Steps

  - **Check for PowerShell execution evidence**: Review Security Event ID 4688 for the process creation of `powershell.exe` or `pwsh.exe`. Validate the command line parameters for any suspicious flags, such as `-NoProfile` or obfuscated scripts, which may indicate malicious use.

  - **Verify remote thread creation events**: Look at Windows Event Logs under `Microsoft-Windows-Sysmon/Operational` for Sysmon Event ID 8 reflecting remote thread creation targeting `lsass.exe`. Note the `SourceImage` and `TargetImage` fields for potential malicious indicators.

  - **Inspect LSASS process handles**: Use tools like Sysinternals Process Explorer or PowerShell scripts to analyze active handles on `lsass.exe`. Legitimate applications will typically not interact with LSASS in this manner.

  - **Evaluate account behavior**: Check Account Logon Event IDs (4624) to identify any abnormal login patterns or logins from unusual geographic locations or devices within the timeframe of the alert.

  - **Identify related suspicious activity**: If multiple alerts involving process injection patterns are triggered, this may indicate coordinated action by an attacker. Look for other process injection reports either from Sysmon or standard Windows Event Logs.

  - **Assess system role and access**: Determine the host's criticality and role. A server holding sensitive data or acting as a domain controller should be prioritized for immediate deeper analysis compared to a standard workstation.

  ### Prioritization

  This alert is of high severity due to the potential impact on credential security and system integrity. Since credential dumping techniques are commonly weaponized by attackers during breaches, a quick response is warranted, particularly for systems with critical roles in account management and authentication.

  ### Blind Spots and Assumptions

  Detection might miss legitimate tool use such as administrative maintenance scripts that also create threads in `lsass.exe`. Ensure that relevant Windows Event Logs (including Sysmon) are correctly configured to capture remote thread creations. It's important to consider that legitimate activities, such as debugging or system diagnostics by authorized personnel, may trigger this alert. A companion detection to strengthen coverage is monitoring for Sysmon Event ID 1 for process creation alongside this rule for context on parent processes.

