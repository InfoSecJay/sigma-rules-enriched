  ### Technical Context
  This detection rule targets potentially malicious activities where a PowerShell process creates a remote thread in the `lsass.exe` process. This behavior is often exploited by attackers to dump credentials from the Local Security Authority Subsystem Service (LSASS), which is responsible for enforcing security policy on Windows systems. By injecting code into the `lsass.exe` process, an attacker can extract stored passwords and authentication tokens, compromising user accounts and network resources.

  The likely attacker objectives may include gaining unauthorized access to sensitive areas of the network or escalating privileges to execute further malicious activities. This type of credential theft is associated with various threat actors and tools that leverage PowerShell for post-exploitation activities. Specifically, relevant MITRE ATT&CK tactics and techniques include Credential Access (TA0006) and the technique T1003.001 (Credential Dumping via LSASS).

  The primary data sources for detecting this activity would include process creation logs that capture remote thread creations, particularly focusing on instances where `powershell.exe` or `pwsh.exe` is involved with `lsass.exe`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events to identify instances where `powershell.exe` or `pwsh.exe` has created remote threads targeting `lsass.exe`. Look for unusual parent-child relationships that may indicate malicious activity.
  - **Check for Side-Loading Techniques:** Investigate any anomalies in PowerShell command-line arguments that might be indicative of attempts to load potentially malicious modules or scripts designed to interface with LSASS.
  - **Analyze User Context:** Determine the user context in which the PowerShell process is running. Check if the execution environment corresponds to expected administrative tasks or if there are indications of compromised accounts.
  - **Examine Related Network Activity:** Correlate network traffic logs for unusual outbound communications that may coincide with the timing of the detected remote thread creation. Look for communications to potentially malicious IP addresses or domains.

  ### Prioritization
  The alert is classified as high severity due to the critical nature of LSASS in maintaining security on Windows systems. The ability to dump credentials poses a significant threat to the integrity of user accounts and the overall security posture of the enterprise.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the use of alternative methods or tools for credential dumping that do not rely on PowerShell or that utilize less common pathways to access LSASS. The detection logic assumes that the appropriate logging level for remote thread creation events is enabled, which may not always be the case. Ensuring that logging is properly configured on all endpoint devices is essential for this alert to function effectively.

