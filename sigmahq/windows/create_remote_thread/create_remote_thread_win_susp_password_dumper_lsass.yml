title: Password Dumper Remote Thread in LSASS
id: f239b326-2f41-4d6b-9dfa-c846a60ef505
status: stable
description: |
  Detects password dumper activity by monitoring remote thread creation EventID 8 in combination with the lsass.exe process as TargetImage.
  The process in field Process is the malicious program. A single execution can lead to hundreds of events.
references:
- https://jpcertcc.github.io/ToolAnalysisResultSheet/details/WCE.htm
author: Thomas Patzke
date: 2017-02-19
modified: 2021-06-21
tags:
- attack.credential-access
- attack.s0005
- attack.t1003.001
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    StartModule: ''
  condition: selection
falsepositives:
- Antivirus products
level: high
note: |
  ### Technical Context
  This detection rule monitors for suspicious activity related to password dumping attacks targeting the Local Security Authority Subsystem Service (LSASS) process on Windows systems. Specifically, it looks for the creation of remote threads in `lsass.exe`, which is a common technique used by attackers to extract sensitive information such as credentials from memory. The intent behind this behavior often aligns with credential theft operations, which may facilitate lateral movement, privilege escalation, or further compromise of targeted systems.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Credential Access** (TA0006) and the specific technique **Credential Dumping: LSASS Memory** (T1003.001). Attackers often employ tools like Mimikatz or WCE (Windows Credential Editor) to perform these actions, which can lead to the unauthorized retrieval of credentials, making it critical to detect and respond to this behavior promptly.

  The primary data source for this detection is the creation of remote thread events on Windows systems, particularly those that designate `lsass.exe` as the target. Monitoring Event ID 8 (CreateRemoteThread) will provide the necessary telemetry to identify potentially malicious processes attempting to exploit LSASS.

  ### Investigation Steps
  - **Review Remote Thread Creation Events:** Examine Event ID 8 in the Windows security logs to identify any recent remote thread creation activities targeting `lsass.exe`. Pay attention to the processes that initiate these actions.

  - **Analyze Associated Process Behavior:** Investigate the parent process of any flagged remote threads. Determine if the initiating process is known for password dumping or other suspicious activities by consulting threat intelligence repositories.

  - **Correlate with Credential Access Logs:** Cross-reference findings with other logs that may indicate credential access, such as Windows Event ID 4624 (logon events) or relevant EDR alerts indicating unusual behavior.

  - **Identify Anomalous Command Execution:** Check for signs of anomalous command execution that could correlate with the time of the thread creation event, including unusual binary execution or script usage that may have led to the exploitation of LSASS.

  ### Prioritization
  This alert is classified as high severity due to the significant risks associated with credential dumping activities, which can lead to full domain compromise if sensitive credentials are successfully harvested. The likelihood of an attacker using these tactics in modern enterprise environments remains high, making it imperative to respond quickly to such alerts.

  ### Blind Spots and Assumptions
  There may be detection gaps in environments where logging is insufficiently configured to capture all relevant remote thread creation events or where security controls might interfere with legitimate tool use (e.g., antivirus software labeling the detection as a false positive). This rule assumes that logging for Event ID 8 is enabled and properly configured across all relevant systems for accurate detection and response capabilities. It is also possible that legitimate administrative actions could trigger this alert, thus necessitating a nuanced review of the context.

