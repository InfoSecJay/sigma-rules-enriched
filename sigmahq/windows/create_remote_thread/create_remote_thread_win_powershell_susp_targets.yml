note: |
  ### Technical Context

  This rule detects the creation of a remote thread via a PowerShell process targeting uncommon processes like `rundll32.exe` and `regsvr32.exe`. Such behavior is typical of advanced persistent threats (APTs) utilizing PowerShell for abuse, aiming to execute malicious payloads in a seemingly benign context. This detection correlates with the MITRE ATT&CK techniques: Execution via `PowerShell` (T1059.001) and Defense Evasion through process injection techniques (T1218.011).

  The primary telemetry source is Windows event logs, specifically focusing on event data that captures process creation and remote thread activities. If perpetrated maliciously, this could lead to system compromise, lateral movement, or deployment of additional payloads. However, detection alone does not confirm a breach, as legitimate scripts or administrative tasks may also invoke similar behaviors.

  ### Investigation Steps

  - **Check the process tree**: Use Sysinternals Process Explorer to identify parent-child relationships for `powershell.exe` and `rundll32.exe`. Benign sequences typically show common administrative tasks versus unexpected or suspicious paths (e.g., C:\Windows\System32).

  - **Review Security Event ID 4688**: Investigate logs for process creation events involving `powershell.exe`. Look for unusual command-line arguments or parent processes that do not match normal operations within your environment.

  - **Analyze Sysmon Event ID 8**: Verify the presence of remote thread creation logs. Confirm whether `powershell.exe` initiated threads in processes like `rundll32.exe`; this behavior is uncommon in legitimate scenarios, especially if the command line does not reference known scripts or admin tasks.

  - **Correlate with related detections**: Look for alerts indicating anomalies around typical PowerShell usage times and patterns. For instance, evaluate if any related alerts from companion detection mechanisms, such as T1059 or T1218, are present that can indicate a broader campaign.

  - **Examine the timestamps and user context**: Identify the user context under which the PowerShell command was executed (via Event ID 4672). Legitimate administrative actions typically occur during regular business hours, whereas malicious activity may align with off-hours or unusual user activity.

  - **Check for persistence mechanisms**: Assess for newly created files or services as a result of this activity. Validate any unusual binary creations in `C:\ProgramData\`, `C:\Users\<username>\AppData\`, or equivalent directories that can suggest backdoor setups.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical assets if malicious. The likelihood of abuse is moderate, particularly among targeted attacks utilizing PowerShell, which is commonly weaponized for lateral movement and persistence. Analysts should prioritize reviews based on asset criticality and threat intelligence.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as disabling event logging or employing signed binaries. Required sources include comprehensive logging configurations for PowerShell activity and process creations. Legitimate administrative use of PowerShell may trigger this rule, particularly in environments where system administrators frequently utilize service or application deployments. Related detection for thread injection through non-PowerShell means (like C/C++ applications invoking `CreateRemoteThread`) can strengthen overall coverage.

