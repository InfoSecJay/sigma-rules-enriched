note: |
  ### Technical Context

  This rule detects the creation of a remote thread in a commonly abused target process (like rundll32.exe or regsvr32.exe) initiated by PowerShell (powershell.exe or pwsh.exe). This behavior may indicate an attacker attempting to execute malicious code via a trusted scripting tool, often to bypass security measures. The objective could include establishing persistence, allowing code execution in a sensitive context, or performing lateral movement.

  The relevant MITRE ATT&CK tactics are "Execution" (TA0002) and "Stealth" (TA0005), specifically the techniques for PowerShell (T1059.001) and Remote Thread Injection (T1218.011). Primary telemetry sources include Windows Security Event ID 4688 for new process creation and potentially Sysmon Event ID 1, which provides detailed process information. Maliciously exploiting this behavior could lead to severe impacts, such as unauthorized access to sensitive systems or data exfiltration. However, this detection does NOT confirm that an attack is in progress or successful execution of malicious payloads.

  ### Investigation Steps

  - **Review Process Creation Events**: Check Windows Security Event ID 4688 for processes created by PowerShell (powershell.exe or pwsh.exe) with the image path of rundll32.exe or regsvr32.exe. Look specifically for command lines that contain unusual or suspicious arguments, suggesting manipulation.

  - **Analyze Sysmon Logs**: Query Sysmon Event ID 1 for a remote thread creation initiated by PowerShell. Verify if the target processes (rundll32.exe or regsvr32.exe) have unusual parent relationships (e.g., Check if PowerShell is the direct parent).

  - **Identify Expected Legitimate Use**: Legitimate PowerShell scripts often invoke standard system processes with benign commands, such as system updates or configuration changes. The presence of common administrative tasks (e.g., “Set-ExecutionPolicy” or “Get-Service”) can indicate acceptable behavior.

  - **Look for High-Confidence Malicious Indicators**: Confirm details regarding the PowerShell script in use by checking the Security Event Logs. Compare hash values of the involved binaries against known bad signatures or known threat intelligence databases for evidence of malicious behavior.

  - **Evaluate Context of Execution**: Assess the asset's role (e.g., whether it's a server or workstation) and its criticality to operations to prioritize the alert. An alert from a critical server demands immediate investigation due to potential impact on overall business operations.

  - **Correlate with Companion Detections**: Investigate any alerts associated with process injection or unusual network activity from the same host. Companion detections might include those that capture unusual network communications initiated by these processes (e.g., anomalous outbound connections from rundll32.exe).

  ### Prioritization

  Given that the alert involves the execution of PowerShell targeting common system processes, its severity is medium. The affected systems’ criticality affects urgency, as exploiting this behavior could facilitate malicious actions. The likelihood of this behavior being weaponized by attackers in real-world scenarios is significant, making timely response essential.

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate administrative uses of PowerShell that might trigger the alert, such as automated scripts for updates or maintenance. Required log sources include Windows Security logs and Sysmon logs configured to capture detailed process creation events. Assumptions include the necessity of monitoring uncommon behaviors in reputation-verified software, as well as correlating alerts regarding other execution techniques, such as direct DLL injection methods, for broader coverage.

