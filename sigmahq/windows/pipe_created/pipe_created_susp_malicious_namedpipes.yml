note: |
  ### Technical Context
  This detection rule identifies the creation of named pipes that have been linked to known advanced persistent threats (APTs) and malware, such as SolarWinds SUNBURST and Project Sauron. Named pipes are often employed by attackers to facilitate communication between processes, particularly in scenarios involving privilege escalation or command-and-control (C2) operations. By monitoring these events, analysts can gain valuable insights into potential malicious activities and preemptively respond to threats.

  The likely attacker objectives include maintaining persistence within a network, establishing a foothold for data exfiltration, or executing further malicious actions on compromised systems. Relevant MITRE ATT&CK tactics include **Defense Evasion** (T1562), as the use of named pipes can obscure malicious activity, and **Privilege Escalation** (T1068) when attackers exploit vulnerabilities to gain elevated access. The techniques specifically tied to this rule include **T1055 - Process Injection**, which is a common method used by various malware families to inject code into other processes via named pipes.

  Primary data sources for gathering evidence include **Sysmon Event Logs** that capture named pipe events (Event IDs 17 and 18), Windows process creation events, and possibly endpoint detection and response (EDR) tool logs that monitor for anomalous process behavior.

  ### Investigation Steps
  - **Review Sysmon Configuration:** Ensure that Sysmon is properly configured to log named pipe events (Event IDs 17 and 18). This is critical for detecting any named pipe creation events and can be validated using popular Sysmon configurations.

  - **Collect Named Pipe Logs:** Analyze Sysmon logs for specific named pipes identified in the detection logic. Pay particular attention to any unusual or uncommon pipe names that may indicate suspicious activity.

  - **Correlate Process Creation Events:** Investigate related process creation events around the time the named pipe was created to establish context. Look for any processes that are known to be related to toolsets commonly used by APTs.

  - **Examine Network Traffic:** If possible, analyze outbound network traffic to detect potential communications with C2 servers that may coincide with the named pipe activity, which can indicate a larger compromise.

  ### Prioritization
  Given the critical severity level of this alert, it is imperative to treat it with high priority. Named pipes that are associated with known APTs or malware can indicate ongoing malicious activities with significant potential impact on sensitive data and overall network integrity.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on proper Sysmon configuration, as organizations may not have logging enabled for named pipe events by default. Additionally, there may be false negatives if attackers use less common naming conventions for their pipes. The detection logic assumes that named pipe activity is inherently malicious, which may not always be the case; thus, contextual investigation is essential. To ensure the alert functions effectively, Sysmon’s logging for named pipe events must be properly configured and monitored consistently.

