  ---

  ### Technical Context

  This Sigma rule detects the creation of named pipes associated with known APT malware and tools. Named pipes are often used for inter-process communication on Windows, but malicious actors exploit them for command and control (C2) and lateral movement. The likely attacker objective is to establish a covert communication channel within compromised environments.

  Relevant MITRE ATT&CK tactic and technique: **Defense Evasion (T1070), Remote Services (T1021)**. The primary telemetry source for this detection is Windows Sysmon, specifically Event IDs 17 (named pipe created) and 18 (named pipe deleted). If an alert is triggered, it indicates a potential security incident, suggesting that an adversarial actor may have established unauthorized communication on the system.

  However, it should be noted that this detection does NOT confirm malicious intent on its own. Named pipes may be created by legitimate applications for various purposes.

  ---

  ### Investigation Steps

  - **Identify event details of named pipe creation:** Review Sysmon Event ID 17 logs for the pipe name and associated process ID. Look specifically for named pipes matching those indicated in the rule (e.g., `\46a676ab7f179e511e30dd2dc41bd388`). Malicious indicators include known names associated with APT activity.

  - **Examine parent process relationships:** Look at Sysmon Event ID 1 (Process Creation) to trace back the process that created the named pipe. Check for unusual or unexpected parent processes, such as unusual command-line parameters or tool execution (e.g., powershell.exe, cmd.exe), pointing to potential malicious activity.

  - **Review execution context and privileges:** Determine whether the process creating the named pipe is running with elevated privileges. Check for high-value system processes (e.g., SYSTEM or Administrator) that generally should not communicate over these named pipes without valid reasons.

  - **Check for recent anomalous behavior:** Utilize Windows Security Event ID 4688 to identify any recent execution of scripts or executables that might relate to the named pipe usage. Look for timing correlations between pipe creation alerts and other relevant prior alerts or suspicious actions.

  - **Assess legitimate software behavior:** Investigate known applications installed on the system that may create named pipes for benign purposes. Validate their expected behavior against the pipe names and assess whether any legitimate programs could trigger this rule.

  - **Correlate with known threat intel:** Cross-reference the detected named pipe names with threat intelligence databases for any recent activity involving those specific identifiers, particularly in relation to the APT groups noted in the Sigma rule documentation.

  ---

  ### Prioritization

  This alert is critical due to the potential for significant security breaches if an APT or malicious actor is leveraging named pipes for C2. The likelihood of malicious usage is high, given that the detected behaviors are common tactics employed by well-known adversaries, making it essential for prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications creating named pipes that could trigger false positives. Reliability of detection relies on proper Sysmon configuration for capturing Event IDs 17 and 18. Legitimate administrative activities, such as running scripts that use these named pipes for updates or management tasks, may inadvertently activate the rule. Companion detections to consider could involve monitoring for unusual command-line arguments or behaviors in processes frequently paired with named pipe activity.

