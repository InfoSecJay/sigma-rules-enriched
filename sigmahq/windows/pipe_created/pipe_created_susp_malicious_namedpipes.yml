note: |
  ---

  ### Technical Context

  This detection rule identifies the creation of named pipes associated with various advanced persistent threats (APTs) and malware. Named pipes are inter-process communication mechanisms in Windows that can be leveraged by attackers for process injection, data exfiltration, or command and control (C2) channels. The likely attacker objective is to establish covert communication or escalate privileges within the target environment.

  The relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)** and **Privilege Escalation (T1055)**. The primary telemetry source is Sysmon with specific focus on Event ID 17 (named pipe created) and Event ID 18 (named pipe connected). If detected in a malicious context, the use of named pipes can lead to unauthorized access or data breaches. However, this detection does NOT confirm malicious intent on its own; further investigation is required to establish context.

  ---

  ### Investigation Steps

  - **Verify Sysmon Configuration:** Review Sysmon logs for Event IDs 17 and 18. Ensure the logging is configured correctly to capture named pipe activities, as this is critical to validate detection reliability.

  - **Analyze the Pipe Name:** Investigate the created named pipe against a known list of malicious names. Significant matches include `\lsassw`, `\svcctl`, or any pipe patterned after the listed malicious examples such as `\isapi_dg`. Malicious indicators can warrant immediate escalation.

  - **Examine Process Parentage:** Check for the parent process creating the named pipe by correlating with Event ID 4688 (Process Creation) in Windows logs. Legitimate administrative tools may create named pipes (e.g., PowerShell, WinRM), but unusual parent processes could indicate malicious activity.

  - **Review Associated Network Traffic:** Investigate network logs for unusual outbound connections or traffic patterns originating from the host associated with the named pipe creation. A pattern of outbound connections probably corresponds with command and control activities.

  - **Assess System and User Context:** Verify the user account and system role executing the named pipe creation. Administrators may use named pipes for legitimate purposes during system maintenance, while lower-privileged users creating unknown named pipes is suspicious.

  - **Check for Anomalous Activities:** Look for any events surrounding the time of the named pipe creation that involve abnormal behaviors, such as mass file modifications or privilege escalation attempts within the same timeframe.

  ---

  ### Prioritization

  This alert is critical, especially if triggered on sensitive or high-value systems, as it poses a high potential for unauthorized access and exploitation. Named pipes are frequently used by sophisticated attackers to persist within environments, making any detection a potential precursor to significant malicious activity.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations if Sysmon is not properly configured, leading to missed events. Evasion techniques could include using legitimate tools to create named pipes for benign purposes, potentially generating false positives. Activities such as legitimate internal applications using named pipes may trigger this alert. Related detections, such as monitoring for unusual process creation patterns or network activity, can enhance overall visibility into potentially malicious behaviors.

