logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular You can also use other repo, e.g.
    https://github.com/Neo23x0/sysmon-config, https://github.com/olafhartong/sysmon-modular.
    How to test detection? You can always use Cobalt Strike, but also you can check
    powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection_malleable_profile_generic:
  - PipeName|startswith:
    - '\DserNamePipe'
    - '\f4c3'
    - '\f53f'
    - '\fullduplex_'
    - '\mojo.5688.8052.183894939787088877'
    - '\mojo.5688.8052.35780273329370473'
    - '\MsFteWds'
    - '\msrpc_'
    - '\mypipe-f'
    - '\mypipe-h'
    - '\ntsvcs'
    - '\PGMessagePipe'
    - '\rpc_'
    - '\scerpc'
    - '\SearchTextHarvester'
    - '\spoolss'
    - '\win_svc'
    - '\win\msrpc_'
    - '\windows.update.manager'
    - '\wkssvc'
  - PipeName:
    - '\demoagent_11'
    - '\demoagent_22'
  selection_malleable_profile_catalog_change_listener:
    PipeName|startswith: '\Winsock2\CatalogChangeListener-'
    PipeName|endswith: '-0,'
  filter_main_generic:
    PipeName:
    - '\wkssvc'
    - '\spoolss'
    - '\scerpc'
    - '\ntsvcs'
    - '\SearchTextHarvester'
    - '\PGMessagePipe'
    - '\MsFteWds'
  filter_optional_websense:
    Image|contains:
    - ':\Program Files\Websense\'
    - ':\Program Files (x86)\Websense\'
    PipeName|startswith:
    - '\DserNamePipeR'
    - '\DserNamePipeW'
  condition: 1 of selection_malleable_profile_* and not 1 of filter_main_* and 
    not 1 of filter_optional_*
falsepositives:
- Chrome instances using the exact same pipe name "mojo.xxx"
- Websense Endpoint using the pipe name "DserNamePipe(R|W)\d{1,5}"
- Some applications may just coincidentally use the pipe names which contain the
  same prefix as the ones used by CobaltStrike, e.g. "f4c3"
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes that match specific patterns commonly associated with Cobalt Strike, a popular penetration testing tool often used by adversaries for command-and-control (C2) operations. The likely attacker objective is to establish covert communication channels for remote control within compromised systems. This detection relates to the MITRE ATT&CK framework under the tactic "Privilege Escalation" (TA0004) and technique "Use of Named Pipes" (T1055).

  Primary telemetry sources include Sysmon logs, specifically Event ID 17 (Named Pipe Created) and Event ID 18 (Named Pipe Closed). If exploited maliciously, such behavior could lead to unauthorized access or lateral movement within the network. Importantly, this detection does NOT confirm actual malicious intent on its own; further context is required to understand the user's actions and environment.

  ### Investigation Steps

  - **Check Sysmon Event IDs 17 and 18**: Examine logs for Event ID 17 for named pipes created containing patterns like `\DserNamePipe` or `\mojo.*`. Look for unusual activity around these events to correlate with known malicious usage patterns.

  - **Identify associated processes**: Review the `Image` field in the same Event IDs to identify the parent process that created the named pipe. Suspect processes typically include those not commonly found on the system or legitimate processes that have been compromised.

  - **Validate against expected behavior**: Compare the observed named pipe usage to known legitimate applications. For example, Chrome can create pipes with names like `mojo.xxx`, which may trigger false positives. Confirm whether the context in which this named pipe creation occurs aligns with normal operational profiles.

  - **Correlate timeframes with other alerts**: Analyze logs for other concurrent anomalies or alerts within the same timeframe (e.g., unexpected authentication attempts, network traffic anomalies) to assess if they suggest malicious behavior.

  - **Cross-reference filters**: Ensure that any named pipes created do NOT match known benign filters, such as expected Websense processes or generic system ones like `\spoolss`, which could indicate normal operations instead of adversarial tactics.

  ### Prioritization

  The alert indicates a high severity due to the potential for significant impact on the affected system, especially if the named pipe is used for unauthorized C2 activity. Cobalt Strike is a frequently weaponized toolkit in active threat environments, further elevating the urgency of investigating this detection.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques where adversaries may select benign pipe names or utilize less common patterns to bypass detection. Reliable detection requires proper Sysmon configuration and log collection, especially enabling named pipe events. Legitimate activities that may trigger this alert include applications that inadvertently use similar named pipes, such as Chrome instances. A related detection that strengthens coverage is monitoring for unusual outbound connections from processes creating these named pipes, providing additional context on potential malicious usage.

