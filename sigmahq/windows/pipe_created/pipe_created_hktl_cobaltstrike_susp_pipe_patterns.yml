logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular You can also use other repo, e.g.
    https://github.com/Neo23x0/sysmon-config, https://github.com/olafhartong/sysmon-modular.
    How to test detection? You can always use Cobalt Strike, but also you can check
    powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection_malleable_profile_generic:
  - PipeName|startswith:
    - '\DserNamePipe'
    - '\f4c3'
    - '\f53f'
    - '\fullduplex_'
    - '\mojo.5688.8052.183894939787088877'
    - '\mojo.5688.8052.35780273329370473'
    - '\MsFteWds'
    - '\msrpc_'
    - '\mypipe-f'
    - '\mypipe-h'
    - '\ntsvcs'
    - '\PGMessagePipe'
    - '\rpc_'
    - '\scerpc'
    - '\SearchTextHarvester'
    - '\spoolss'
    - '\win_svc'
    - '\win\msrpc_'
    - '\windows.update.manager'
    - '\wkssvc'
  - PipeName:
    - '\demoagent_11'
    - '\demoagent_22'
  selection_malleable_profile_catalog_change_listener:
    PipeName|startswith: '\Winsock2\CatalogChangeListener-'
    PipeName|endswith: '-0,'
  filter_main_generic:
    PipeName:
    - '\wkssvc'
    - '\spoolss'
    - '\scerpc'
    - '\ntsvcs'
    - '\SearchTextHarvester'
    - '\PGMessagePipe'
    - '\MsFteWds'
  filter_optional_websense:
    Image|contains:
    - ':\Program Files\Websense\'
    - ':\Program Files (x86)\Websense\'
    PipeName|startswith:
    - '\DserNamePipeR'
    - '\DserNamePipeW'
  condition: 1 of selection_malleable_profile_* and not 1 of filter_main_* and 
    not 1 of filter_optional_*
falsepositives:
- Chrome instances using the exact same pipe name "mojo.xxx"
- Websense Endpoint using the pipe name "DserNamePipe(R|W)\d{1,5}"
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes that match patterns associated with Cobalt Strike's malleable command-and-control (C2) profiles. Adversaries may leverage named pipes for inter-process communication to evade detection and maintain persistence in Windows environments. This behavior aligns with the MITRE ATT&CK technique "Application Layer Protocol" (T1071) and "Application Layer Protocol" (T1055), as adversaries may manipulate legitimate protocols for malicious purposes. The primary telemetry source required for detection includes Sysmon logs, specifically Event IDs 17 and 18, which capture named pipe creation events.

  If the detected behavior is malicious, it can indicate a compromised host being used for lateral movement or command execution. It is essential to note that the detection of named pipe creation does NOT confirm malicious intent on its own, as legitimate applications may also use similar named pipe patterns.

  ### Investigation Steps

  - **Verify Sysmon configuration**: Confirm that Sysmon is configured to log named pipe events (Event IDs 17 and 18). Check the Sysmon configuration file against popular Sysmon configurations to ensure proper logging of named pipe events is enabled.

  - **Analyze generated logs for suspicious pipe names**: Search the logs for Event ID 17 or 18 in Sysmon with fields containing `PipeName`. Look for patterns matching known Cobalt Strike named pipes, such as `\DserNamePipe`, `\mojo.5688.8052.*`, or any random variations that could be generated.

  - **Cross-reference legitimate applications**: Identify any known legitimate applications with expected named pipe behavior. For example, instances of Chrome may use named pipe `mojo.xxx`, and Websense may use `DserNamePipe(R|W)\d{1,5}`. Dismiss alerts from these applications as benign.

  - **Identify high-confidence malicious indicators**: Pay special attention to any logs referencing pipe names like `\mojo.5688.8052.183894939787088877` or `\rpc_` and ensure that these are not associated with known legitimate processes. If found alongside unusual process executions (Event ID 4688) from non-standard processes, classify as potentially malicious.

  - **Assess host role and criticality**: Determine the role of the host where the alert originated. A detection on a critical server or domain controller should be prioritized higher compared to a non-critical workstation, which may reduce the impact of a potential compromise.

  - **Investigate for exfiltration activity**: Validate whether any relevant file creations or movements have occurred by checking for rar or zip file events around the same timeframe. Monitor especially around pipe usage to see if there's data flow that appears suspicious.

  ### Prioritization

  This alert should be considered high severity due to the potential for significant impact on enterprise security. The use of named pipes in this context is often associated with advanced threats, and their exploitation for command-and-control purposes is a common tactic among sophisticated adversaries like threat actors using Cobalt Strike.

  ### Blind Spots and Assumptions

  Detection may be limited by the configurations of Sysmon on the endpoint, as not all environments will have comprehensive logging enabled for named pipes. Legitimate software may generate alerts based on similar naming conventions, for instance, Websense products. It is also critical to incorporate detection strategies that extend beyond named pipe activity, such as monitoring for unexpected process creations or unusual network traffic patterns, to strengthen overall security coverage.

