logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular You can also use other repo, e.g.
    https://github.com/Neo23x0/sysmon-config, https://github.com/olafhartong/sysmon-modular.
    How to test detection? You can always use Cobalt Strike, but also you can check
    powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection_malleable_profile_generic:
  - PipeName|startswith:
    - '\DserNamePipe'
    - '\f4c3'
    - '\f53f'
    - '\fullduplex_'
    - '\mojo.5688.8052.183894939787088877'
    - '\mojo.5688.8052.35780273329370473'
    - '\MsFteWds'
    - '\msrpc_'
    - '\mypipe-f'
    - '\mypipe-h'
    - '\ntsvcs'
    - '\PGMessagePipe'
    - '\rpc_'
    - '\scerpc'
    - '\SearchTextHarvester'
    - '\spoolss'
    - '\win_svc'
    - '\win\msrpc_'
    - '\windows.update.manager'
    - '\wkssvc'
  - PipeName:
    - '\demoagent_11'
    - '\demoagent_22'
  selection_malleable_profile_catalog_change_listener:
    PipeName|startswith: '\Winsock2\CatalogChangeListener-'
    PipeName|endswith: '-0,'
  filter_main_generic:
    PipeName:
    - '\wkssvc'
    - '\spoolss'
    - '\scerpc'
    - '\ntsvcs'
    - '\SearchTextHarvester'
    - '\PGMessagePipe'
    - '\MsFteWds'
  filter_optional_websense:
    Image|contains:
    - ':\Program Files\Websense\'
    - ':\Program Files (x86)\Websense\'
    PipeName|startswith:
    - '\DserNamePipeR'
    - '\DserNamePipeW'
  condition: 1 of selection_malleable_profile_* and not 1 of filter_main_* and not
    1 of filter_optional_*
falsepositives:
- Chrome instances using the exact same pipe name "mojo.xxx"
- Websense Endpoint using the pipe name "DserNamePipe(R|W)\d{1,5}"
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of named pipes that follow specific patterns associated with Cobalt Strike's malleable command and control (C2) profiles. Named pipes are a method of inter-process communication that can be leveraged by attackers to establish communication channels between compromised hosts or to communicate with their C2 infrastructure. In this scenario, an attacker using Cobalt Strike aims to maintain persistence, exfiltrate data, or execute additional payloads while evading detection by utilizing these named pipes.

  The relevant MITRE ATT&CK tactics include **Command and Control (TA0011)**, where named pipes serve as a channel for C2 communication, and **Defense Evasion (TA0005)**, as the use of named pipes may help attackers avoid traditional network monitoring techniques by transferring data through legitimate operating system functionalities. Techniques such as **T1055 - Process Injection** and other C2 techniques are also pertinent here, as utilizing named pipes can help attackers inject malicious processes or communicate discreetly with their infrastructure.

  Key data sources for this detection include **Sysmon logs** specifically configured to capture Named Pipe creation events (Event ID 17 and Event ID 18). This ensures that the telemetry required for effective monitoring of these suspicious behaviors has been configured properly.

  ### Investigation Steps
  - **Check Named Pipe Creation Logs**: Review Sysmon logs for event IDs 17 and 18 related to named pipe creation. Focus on entries with pipe names that match the identified patterns in the Cobalt Strike profiles.

  - **Analyze Process Execution**: Investigate the processes that created the named pipes to determine their legitimacy. Look for any unusual parent-child process relationships that may indicate malicious activity.

  - **Correlate with Behavioral Indicators**: Identify any additional telemetry that indicates Cobalt Strike behavior, such as unusual outbound connections, process injections, or lateral movement patterns that coincide with the named pipe creation events.

  - **Review Existing Exceptions**: Examine whether the identified pipe names are legitimate in your environment, checking against known software that may use similar named pipes, like Websense, to reduce false positive rates and focus on genuinely suspicious activity.

  ### Prioritization
  This alert has a high severity, reflecting the potential impact of Cobalt Strike in an enterprise environment. Its ability to facilitate command and control operations means that successful exploitation could lead to significant financial loss, data breaches, or operational disruptions.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if Sysmon is not properly configured to capture named pipe events, as the rule relies on these logs for effective monitoring. Additionally, the detection logic assumes that named pipes are not used legitimately by known software in the environment; therefore, thorough inventory management of all applications is crucial. False positives may arise from benign applications using similar pipe names, particularly those associated with Chrome or Websense. For the detection rule to function correctly, it is essential to ensure that Sysmon logging is correctly set up, particularly for Event ID 17 and Event ID 18.

