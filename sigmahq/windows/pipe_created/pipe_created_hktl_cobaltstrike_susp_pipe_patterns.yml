logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular You can also use other repo, e.g.
    https://github.com/Neo23x0/sysmon-config, https://github.com/olafhartong/sysmon-modular.
    How to test detection? You can always use Cobalt Strike, but also you can check
    powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection_malleable_profile_generic:
  - PipeName|startswith:
    - '\DserNamePipe'
    - '\f4c3'
    - '\f53f'
    - '\fullduplex_'
    - '\mojo.5688.8052.183894939787088877'
    - '\mojo.5688.8052.35780273329370473'
    - '\MsFteWds'
    - '\msrpc_'
    - '\mypipe-f'
    - '\mypipe-h'
    - '\ntsvcs'
    - '\PGMessagePipe'
    - '\rpc_'
    - '\scerpc'
    - '\SearchTextHarvester'
    - '\spoolss'
    - '\win_svc'
    - '\win\msrpc_'
    - '\windows.update.manager'
    - '\wkssvc'
  - PipeName:
    - '\demoagent_11'
    - '\demoagent_22'
  selection_malleable_profile_catalog_change_listener:
    PipeName|startswith: '\Winsock2\CatalogChangeListener-'
    PipeName|endswith: '-0,'
  filter_main_generic:
    PipeName:
    - '\wkssvc'
    - '\spoolss'
    - '\scerpc'
    - '\ntsvcs'
    - '\SearchTextHarvester'
    - '\PGMessagePipe'
    - '\MsFteWds'
  filter_optional_websense:
    Image|contains:
    - ':\Program Files\Websense\'
    - ':\Program Files (x86)\Websense\'
    PipeName|startswith:
    - '\DserNamePipeR'
    - '\DserNamePipeW'
  condition: 1 of selection_malleable_profile_* and not 1 of filter_main_* and 
    not 1 of filter_optional_*
falsepositives:
- Chrome instances using the exact same pipe name "mojo.xxx"
- Websense Endpoint using the pipe name "DserNamePipe(R|W)\d{1,5}"
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes with specific naming patterns associated with Cobalt Strike, a tool often used for post-exploitation activities. The likely attacker objective is to establish covert communication channels for command and control (C2) operations, leveraging named pipes as a persistent stealth mechanism. This behavior aligns with the MITRE ATT&CK tactic for Privilege Escalation (TA0004) and the technique of Communication Through Named Pipes (T1055).

  The primary telemetry sources are Sysmon logs, specifically Event ID 17 (Named Pipe Created) and Event ID 18 (Named Pipe Closed). If malicious, the security impact could involve unauthorized access, data exfiltration, or lateral movement within the network. It’s crucial to note that this detection does NOT confirm malicious intent on its own; further investigation must validate the context and purpose of the named pipe usage.

  ### Investigation Steps

  - **Review Sysmon Event ID 17 logs:** Check for named pipe creation with patterns matching Cobalt Strike, particularly `\DserNamePipe`, `\mojo.*`, or `\f4c3`. Focus on the timestamp and associated process to gauge the context.

  - **Identify the originating process:** Determine the parent process from the Sysmon Event ID 17 logs. Malicious indicators include known malware processes or unusual binaries, while benign examples may include legitimate application paths such as those from trusted vendor software.

  - **Assess named pipe activity frequency:** Look for patterns of repeated access or creation of named pipes over a brief period. Legitimate software may occasionally use specific pipes, but frequent alterations could indicate malicious activity.

  - **Correlate with other telemetry data:** Cross-reference the event with Windows Security Event ID 4688 for process creation, particularly for processes creating or communicating via the named pipe. High-confidence malicious indicators include suspicious executables with unusual command-line arguments.

  - **Examine system roles and expected behaviors:** For servers running legitimate applications such as Websense, note that expected pipe names may include `DserNamePipeR` or `DserNamePipeW`. Validate that such activity is consistent with normal operation for the system role and user accounts involved.

  - **Check for potential evasion attempts:** Investigate any usage of similar pipe names that may indicate an attempt to mimic benign applications or native Windows operations, as attackers may use common names to evade detection.

  ### Prioritization

  This alert is considered high severity due to the critical nature of potential C2 communication channels being established. The high likelihood of malicious abuse through named pipes, given their use in agile post-exploitation scenarios, further supports the need for immediate investigation. Such behaviors are also commonly weaponized in modern attack vectors.

  ### Blind Spots and Assumptions

  The detection may have limitations due to potential evasion techniques, such as using benign-looking pipe names to mask malicious activities. Additionally, the requirement for comprehensive log settings in Sysmon is crucial for reliable detection; without these, the potential for missing key indicators increases. Legitimate activities, such as internal software functionality or maintenance scripts, may occasionally trigger this alert. A related detection to strengthen coverage would be monitoring process creations (Event ID 4688) that spawn from named pipe activities, enhancing the ability to discern genuine activity from potential attacks.

