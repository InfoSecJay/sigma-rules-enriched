note: |
  ### Technical Context
  This rule detects the creation of new PowerShell instances through named pipes that begin with "PSHost." The presence of such PowerShell instances can indicate suspicious activity, including potential lateral movement or the use of PowerShell by an attacker to execute malicious commands or scripts. Attackers often leverage PowerShell due to its powerful scripting capabilities, which can be used for both legitimate administrative tasks and nefarious activities, making it a double-edged sword in a security context.

  In a typical threat scenario, an attacker may use techniques such as executing code on a remote machine or using PowerShell for tasks like data exfiltration or lateral movement across the network. Given this behavior aligns with the MITRE ATT&CK framework, it falls under the techniques of T1059.001 (Command and Scripting Interpreter: PowerShell) and T1046 (Network Service Scanning), as the creation of a named pipe is a method to facilitate communication that could involve service discovery or command execution.

  The primary data sources for monitoring this activity include Sysmon logs, specifically Event ID 17 (Named Pipe created) and Event ID 18 (Named Pipe closed). This logging needs to be properly configured in the Sysmon configuration files to ensure comprehensive coverage of PowerShell execution through named pipes.

  ### Investigation Steps
  - **Review Sysmon Logs:** Analyze the Sysmon Event ID 17 logs for named pipes starting with "PSHost." Identify any instances of unusual PowerShell activity linked to these named pipes.
  - **Monitor Process Creation Events:** Examine the process creation logs (e.g., from Windows Event Logs or EDR solutions) to correlate any new PowerShell instances with the named pipe creation. Look for unusual parent processes or command line arguments.
  - **Check for Lateral Movement:** Investigate any related network activity that might indicate lateral movement. Look for connections or attempts to access remote resources that coincide with the PowerShell activity observed.
  - **Validate PowerShell Configurations:** Ensure PowerShell logging is enabled (for example, by checking the execution policy and script block logging) to help identify legitimate versus malicious use of PowerShell across the environment.

  ### Prioritization
  The alert is considered informational, but it should not be dismissed entirely; regular monitoring is essential because while not all PowerShell executions are malicious, the use of named pipes for process communication can signal advanced threat tactics or lateral movement attempts that require further investigation.

  ### Blind Spots and Assumptions
  Detection may be limited if the Sysmon logging configuration is not correctly set up or if named pipe events are not being captured at all. This rule assumes that all relevant PowerShell executions propagate through named pipes and that sufficient logging is in place for detection. There is a possibility for false positives, as legitimate applications may use similar techniques. Regular tuning of the detection logic may be required to minimize such occurrences while retaining vigilance against actual threats.

