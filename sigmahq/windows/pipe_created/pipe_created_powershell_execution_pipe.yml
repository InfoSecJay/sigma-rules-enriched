note: |
  ### Technical Context

  This Sigma rule detects the creation of a PowerShell instance through the establishment of a named pipe that starts with "PSHost." This behavior typically indicates the execution of PowerShell, which is a commonly used tool by attackers for executing scripts, payloads, and potentially malicious commands. The likely objective is to execute arbitrary code remotely or gather sensitive information from the victim system.

  This detection aligns with the MITRE ATT&CK technique **Execution: PowerShell (T1059.001)**. The primary telemetry source is Sysmon, specifically monitoring named pipe creation events (Event ID 17). If malicious, this behavior could indicate an adversary trying to maintain persistence or execute lateral movement. Importantly, this detection does NOT confirm an attack on its own, as legitimate applications may also utilize PowerShell and named pipes for valid purposes.

  ### Investigation Steps

  - **Identify the event source:** Check Sysmon logs for Event ID 17 indicating named pipe creation, specifically looking for entries where `PipeName` starts with `\PSHost`.

  - **Correlate user activity:** Review the timesignatures and user context associated with the PowerShell execution. Check the fields `UserID` and `ProcessID` against known patterns of legitimate PowerShell usage during that time, such as regular administrative scripts or system updates.

  - **Analyze PowerShell command execution:** Investigate directly related PowerShell logs (if available) in conjunction with Event ID 4688 (Process Creation) to identify what commands were executed under the detected PowerShell process. Focus on any commands that might indicate malicious activity (e.g., network connections, file access).

  - **Evaluate environmental context:** Note the role of the host running the detected PowerShell instance. Servers with sensitive data or role-based access should be prioritized for detailed review, as execution of PowerShell in such environments poses higher risks.

  - **Look for common adversary patterns:** Search for other indicators of compromise in the same timeframe, such as anomalous outbound connections or file creation events that may correlate with Windows event logs (Event ID 5156 for network connections).

  ### Prioritization

  This alert is considered informational but may indicate potential malicious activity depending on the context. The likelihood of abuse is medium, as PowerShell is widely used for both legitimate administrative tasks and adversarial exploits. Given the role of PowerShell in many attacks, any instance in critical asset environments warrants further scrutiny.

  ### Blind Spots and Assumptions

  The primary limitation of this detection is its potential for false positives due to legitimate usage of PowerShell for administrative scripts or internal applications. Reliable detection depends on properly configured Sysmon logging for named pipes (Event IDs 17 and 18). Other benign activities triggering this alert may include developers running scripts or automated deployments. A related detection to consider is monitoring outbound network connections initiated by the PowerShell process, which could strengthen overall adversarial tracking efforts.

