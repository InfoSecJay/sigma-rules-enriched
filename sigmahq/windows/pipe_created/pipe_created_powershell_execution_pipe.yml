note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of named pipes that begin with the prefix `PSHost`, which is associated with PowerShell instances. An attacker may use this technique to execute PowerShell commands covertly or interact with other components in a lateral movement scenario. The relevant MITRE ATT&CK technique is **Command and Scripting Interpreter: PowerShell (T1059.001)**. The primary telemetry source is Sysmon, specifically focusing on Event IDs 17 (Named Pipe Created) and 18 (Named Pipe Closed).

  If the behavior is confirmed as malicious, it may indicate an active compromise where the attacker executes PowerShell scripts for post-exploitation tasks or payload delivery. However, this detection does NOT on its own confirm malicious intent, as legitimate applications may also create named pipes that fit this criteria.

  ---

  ### Investigation Steps

  - **Check Sysmon Named Pipe Events:** Review Sysmon Event IDs 17 and 18 for the specific pipe name starting with `\PSHost`. This will confirm whether the alert was triggered by PowerShell activity.

  - **Identify the Source Process:** Examine the `Image` field in Event ID 17 to determine the parent process spawning the PowerShell instance. Indicators of malicious activity include processes that are typically not associated with PowerShell execution, such as uncommon executables.

  - **Review Execution Context:** Investigate the `User` field in the same Sysmon events to determine the executing user's context. Admin or SYSTEM accounts executing PowerShell without prior user interaction may indicate potential maliciousness.

  - **Compare Broader PowerShell Activity:** Assess other PowerShell-related activities in the last hour (e.g., Event IDs 4103 for PowerShell Script Block Logging) to identify patterns or anomalies, such as encoded commands or suspicious modules being loaded.

  - **Document Legitimate Use Cases:** Gather information about known legitimate applications or scripts that operate using named pipes for PowerShell, and document expected behaviors within your environment to assist in contextual analysis.

  - **Cross-Reference with Related Alerts:** Utilize logs from companion detections regarding lateral movement or other suspicious network activities that could validate or cast doubt on the legitimacy of the PowerShell invocation.

  ---

  ### Prioritization

  This alert is of moderate severity due to the potential for abuse, especially on critical systems where PowerShell is commonly weaponized by attackers. The likelihood that benign applications trigger this activity is notable, but continuous monitoring and contextual awareness of the environment is necessary to assess true risk.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the necessary configuration of Sysmon for named pipe logging; if not enabled, this indicator may go unnoticed. Legitimate applications creating these named pipes could generate false positives, requiring careful validation of context. A related detection, such as monitoring for unusual PowerShell command activity tied to User Access Token manipulation (T1134), would strengthen overall visibility and assurance of threat detection.

