  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    always use Cobalt Strike, but also you can check powershell script from this site
    https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection_MSSE:
    PipeName|contains|all:
    - '\MSSE-'
    - '-server'
  selection_postex:
    PipeName|startswith: '\postex_'     # Also include the pipe "\postex_ssh_"
  selection_status:
    PipeName|startswith: '\status_'
  selection_msagent:
    PipeName|startswith: '\msagent_'
  selection_mojo:
    PipeName|startswith: '\mojo_'
  selection_interprocess:
    PipeName|startswith: '\interprocess_'
  selection_samr:
    PipeName|startswith: '\samr_'
  selection_netlogon:
    PipeName|startswith: '\netlogon_'
  selection_srvsvc:
    PipeName|startswith: '\srvsvc_'
  selection_lsarpc:
    PipeName|startswith: '\lsarpc_'
  selection_wkssvc:
    PipeName|startswith: '\wkssvc_'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes commonly associated with Cobalt Strike, a popular post-exploitation tool widely used by attackers for lateral movement and command-and-control activities. The primary intent behind using named pipes in this context is to facilitate communication between compromised systems while evading traditional security measures. The relevant MITRE ATT&CK techniques are "T1055: Process Injection" and "T1203: Exploitation for Client Execution," indicating the attacker is executing further payloads or establishing a communication channel.

  The primary telemetry source for this detection is Windows Sysmon logs, specifically Event ID 17 (named pipe creation) and Event ID 18 (named pipe deletion). If malicious, the creation of these named pipes could indicate unauthorized access or privilege escalation. It is important to note that the detection of named pipe creation does not automatically confirm malicious activity; it could also indicate legitimate application behavior.

  ### Investigation Steps

  - **Check Sysmon Event ID 17 for named pipe creations:** Review Sysmon logs for Event ID 17, filter for pipe names containing `\MSSE-`, `\postex_`, `\status_`, or similar patterns. Note that legitimate applications may also create named pipes, so further analysis is required.

  - **Correlate with process creation logs:** Examine Security Event ID 4688 for process creation events that correspond to the timestamp of the named pipe creation. Identify any associated parent processes that may indicate malicious intent, such as unexpected command-line parameters or unknown applications.

  - **Investigate associated network activity:** Look for outbound connections (Event ID 5156 for Windows Firewall) originating from the processes associated with the detected named pipe. Malicious indicators include connections to known command-and-control servers or unusual ports.

  - **Assess the environment for legitimate activities:** Identify whether any authorized applications in your environment, like administrative tools or third-party software, might utilize named pipes. Document standard behaviors and patterns as a baseline for analysis.

  - **Identify patterns of known malicious usage:** Review past incidents involving Cobalt Strike within the organization or industry. If similar named pipes are involved, escalate the alert for immediate investigation.

  - **Validate persistence methods:** Look for additional Sysmon Event IDs that indicate changes to execution paths or injected code related to the processes making named pipe calls, signaling attempts at persistence or elevation of privileges.

  ### Prioritization

  Given the criticality level of this alert, it should be treated with high priority, especially if originating from systems with sensitive data or access. The likelihood of malicious usage is elevated due to the association with Cobalt Strike, a well-known tool used by adversaries. Early detection of such behavior is crucial in preventing potential data breaches.

  ### Blind Spots and Assumptions

  This detection may be limited by the potential for evasion techniques, such as renaming or obscuring pipe names to avoid detection. Accurate detection relies on properly configured Sysmon for capturing named pipe events; without it, detection may be incomplete. Additionally, legitimate application behaviors, such as those from custom software or well-known services, may inadvertently trigger the alert. A related detection is monitoring for unusual persistence mechanisms that may indicate follow-up actions by attackers post-penetration.

