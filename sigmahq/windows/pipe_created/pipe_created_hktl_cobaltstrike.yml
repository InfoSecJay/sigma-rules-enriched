logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    always use Cobalt Strike, but also you can check powershell script from this site
    https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection_MSSE:
    PipeName|contains|all:
    - '\MSSE-'
    - '-server'
  selection_postex:
    PipeName|startswith: '\postex_'     # Also include the pipe "\postex_ssh_"
  selection_status:
    PipeName|startswith: '\status_'
  selection_msagent:
    PipeName|startswith: '\msagent_'
  selection_mojo:
    PipeName|startswith: '\mojo_'
  selection_interprocess:
    PipeName|startswith: '\interprocess_'
  selection_samr:
    PipeName|startswith: '\samr_'
  selection_netlogon:
    PipeName|startswith: '\netlogon_'
  selection_srvsvc:
    PipeName|startswith: '\srvsvc_'
  selection_lsarpc:
    PipeName|startswith: '\lsarpc_'
  selection_wkssvc:
    PipeName|startswith: '\wkssvc_'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies the creation of named pipes commonly associated with the Cobalt Strike post-exploitation framework. Named pipes are a method of inter-process communication on Windows systems, and attackers using Cobalt Strike frequently create them to facilitate command and control operations. Such activities may indicate an intrusion into the environment where an attacker is leveraging Cobalt Strike to maintain persistence, escalate privileges, or exfiltrate data.

  The primary objectives of an attacker utilizing Cobalt Strike include gaining remote access to systems, conducting lateral movement, and executing malicious payloads without detection. Devices compromised with Cobalt Strike may exhibit unusual named pipe activity as the threat actors utilize them for communication between various components of their toolkit and command infrastructure.

  Relevant tactics and techniques from the MITRE ATT&CK framework include:
  - **Defense Evasion (T1203)**: by obfuscating communication channels.
  - **Privilege Escalation (T1055)**: through the abuse of Windows inter-process communication mechanisms.

  Primary data sources for detecting this behavior include Sysmon logs that capture named pipe events (Event IDs 17 and 18), which detail the creation and usage of named pipes on Windows systems.

  ### Investigation Steps
  - **Review Sysmon Logs**: Examine Event ID 17 and 18 from Sysmon for any suspicious named pipe creations that match known patterns indicative of Cobalt Strike usage.
  - **Analyze Process Communication**: Look into the logs of processes that created the named pipes, focusing on whether they are executing any commands or accessing sensitive information.
  - **Check for Lateral Movement**: Investigate any associated network traffic or logs from endpoint detection tools that could indicate lateral movement using Cobalt Strike named pipes.
  - **Correlate with Other Alerts**: Cross-reference findings with other alerts within the SIEM that may suggest concurrent malicious activity to better understand the full scope of the incident.

  ### Prioritization
  The alert for named pipe creation linked to Cobalt Strike is critical, as such activity typically indicates an active compromise within an enterprise environment. The potential impact of a successful exploitation, including data breaches and systems being leveraged for further attacks, reinforces the need for immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection concerning other tools that also use named pipes, potentially resulting in false positives if not fine-tuned. The detection logic assumes the presence of Sysmon logging configured to capture named pipe events; without this setup, alerts may not trigger. Additionally, the coverage primarily targets specific Cobalt Strike pipe patterns and may miss other tactics or techniques that do not employ the same naming conventions. System administrators must ensure that Sysmon is correctly configured to log named pipe events for effective monitoring.

