detection:
  selection_MSSE:
    PipeName|contains|all:
    - '\MSSE-'
    - '-server'
  selection_postex:
    PipeName|startswith: '\postex_'     # Also include the pipe "\postex_ssh_"
  selection_status:
    PipeName|startswith: '\status_'
  selection_msagent:
    PipeName|startswith: '\msagent_'
  selection_mojo:
    PipeName|startswith: '\mojo_'
  selection_interprocess:
    PipeName|startswith: '\interprocess_'
  selection_samr:
    PipeName|startswith: '\samr_'
  selection_netlogon:
    PipeName|startswith: '\netlogon_'
  selection_srvsvc:
    PipeName|startswith: '\srvsvc_'
  selection_lsarpc:
    PipeName|startswith: '\lsarpc_'
  selection_wkssvc:
    PipeName|startswith: '\wkssvc_'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes commonly used by Cobalt Strike, a prevalent post-exploitation framework. Named pipes enable communication between processes and can be exploited by adversaries for various malicious purposes, including command and control communication or lateral movement. The relevant MITRE ATT&CK tactics involved are "Privilege Escalation" (TA0004) and "Stealth" (TA0005), specifically targeting Technique T1055 (Process Injection).

  Primary telemetry sources include Sysmon logs, specifically Event IDs 17 (Named Pipe Creation) and 18 (Named Pipe Duplication). The security impact of this detection is significant, as it may indicate the presence of Cobalt Strike or similar tools aiming to maintain persistence or escalate privileges. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may also create named pipes.

  ### Investigation Steps

  - **Review Sysmon named pipe events**: Check Sysmon Event ID 17 for pipe creation entries containing the following names: `\MSSE-`, `\postex_`, `\status_`, `\msagent_`, etc. Focus on those with timestamps correlating with the alert.

  - **Analyze process relationships**: Use Windows Event ID 4688 to investigate the parent-child process relationships of the creating process. Look for patterns indicating unexpected executables creating named pipes, which can suggest an active Cobalt Strike session.

  - **Check for Cobalt Strike artifacts**: Validate the presence of specific pipe names used by Cobalt Strike, such as `\postex_ssh_`, in recent named pipe creation logs. Documenting their occurrence does indicate high-confidence malicious activity.

  - **Identify expected behavior**: Compare with known legitimate processes that typically create named pipes for service communication. Document any instances that align with expected pipe names and patterns consistent with normal enterprise application behavior.

  - **Correlate network activity**: Review network logs for any anomalous traffic patterns, particularly those related to command and control endpoints associated with Cobalt Strike. Focus on traffic coinciding with the timestamp of pipe creation.

  - **Assess endpoint criticality**: Determine the criticality of the affected asset, evaluating whether the host is part of vital infrastructure. Higher impact may require immediate containment measures.

  ### Prioritization

  This alert is critical due to the potential for widespread impact if Cobalt Strike is actively being used in the environment. The likelihood of adversaries leveraging named pipes for lateral movement or data exfiltration raises the severity. As this behavior is commonly weaponized, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  The detection may be limited by environments where Sysmon logging is not configured correctly or where named pipes are not monitored adequately. Legitimate applications may create named pipes that trigger this alert, leading to false positives. Additionally, evasive techniques such as using obfuscated or alternate pipe names might bypass detection. A related detection to strengthen coverage would be monitoring for unusual process injection activities connected to native Windows processes that interact with named pipes.

