note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes with the substring `\coerced\`, which is indicative of the use of the CoercedPotato tool by adversaries to escalate privileges in Windows environments. The likely objective of using CoercedPotato is to bypass security mechanisms and gain unauthorized access to system resources by exploiting local security tokens. This behavior aligns with the MITRE ATT&CK tactic for Privilege Escalation, specifically technique T1055 (Process Injection).

  Primary telemetry sources include Sysmon event logs, specifically Event ID 17 (Named Pipe Creation) and Event ID 18 (Named Pipe Delete). If malicious, this behavior enables attackers to manipulate security tokens, potentially leading to unauthorized actions on systems with elevated privileges. Notably, this detection does NOT confirm an active compromise on its own; further investigation is necessary to ascertain the context and intent behind the pipe creation.

  ### Investigation Steps

  - **Verify Sysmon Configuration:** Ensure Sysmon is configured to log named pipe events (Event ID 17 and Event ID 18). Check the Sysmon configuration for completeness, referencing configurations available at popular repositories like SwiftOnSecurity.

  - **Examine Named Pipe Creation Logs:** Review Sysmon Event ID 17 logs for any processes creating named pipes containing the substring `\coerced\`. Identify the parent process and associated command line arguments.

  - **Check Process Anomalies:** Investigate the processes creating the named pipes. Look for suspicious executables or unfamiliar processes that may have parent-child relationships with legitimate processes. A common benign pipeline might involve known system services or administrative tools.

  - **Identify High-Confidence Malicious Indicators:** Look for connections between the named pipe creation and known malicious IPs or domains, or correlate with other indicators (e.g., the process creating the named pipe being executed from Temporary folders or being digitally signed by untrusted entities).

  - **Analyze Historical Data:** Review historical logs to determine if the named pipe creation is part of a recurrent pattern or a one-off occurrence, indicating potential automation or a targeted attack.

  - **Assess Host Role:** Consider the criticality of the affected asset; if the host is a domain controller or a critical infrastructure system, prioritize this investigation given the potential impact of privilege escalation.

  ### Prioritization

  This alert holds high severity as it suggests potential privilege escalation in hosts that are critical to enterprise infrastructure. The likelihood of effective exploitation using tools like CoercedPotato is high, and this technique is increasingly weaponized in targeted attacks, emphasizing the need for timely investigation.

  ### Blind Spots and Assumptions

  Detection can be thwarted if the Sysmon logging for named pipes is misconfigured or disabled. Legitimate activities, such as those performed by certain administrative scripts or applications, may also trigger this alert. It is important to reference related detection techniques, like monitoring for other named pipe patterns (e.g., those indicative of Cobalt Strike), to provide comprehensive coverage against potential abuse of named pipes in the environment.

