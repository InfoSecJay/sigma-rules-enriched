note: |
  ### Technical Context

  This rule detects the creation of named pipes with the specific naming pattern associated with the CoercedPotato tool, which is commonly utilized for privilege escalation within Windows environments. The objective of an attacker using CoercedPotato is typically to gain higher privileges on a compromised system by impersonating users or services leveraging named pipes. This behavior fits into the MITRE ATT&CK framework under the tactic of Privilege Escalation (TA0004) and the technique of Abuse Elevation Control Mechanism (T1055).

  The primary telemetry sources include Sysmon logs specifically focusing on named pipe creation events (Event ID 17 and Event ID 18). If malicious, the creation of such pipes can signify an adversary is attempting to interact with system processes in unauthorized ways. It’s important to note that this detection does NOT confirm that an attack is in progress but indicates potential malicious tool usage that warrants further investigation.

  ### Investigation Steps

  - **Review Named Pipe Creation Events**: Check Sysmon Event IDs 17 and 18 for any pipe names containing `\coerced\`. Assess the timestamp, source IP, and executing user context to identify anomalous behavior.

  - **Identify Executable Paths**: Cross-reference with Event ID 4688 for process creation logs to determine which process initiated the named pipe. Look for known malicious executables or suspicious command-line arguments.

  - **Evaluate User Context and System Roles**: Determine if the user account involved has necessary privileges for the action. Legitimate services or users may create named pipes, typically related to service interaction, but user accounts performing such actions outside of standard business applications should be scrutinized further.

  - **Check for Unusual Network Traffic**: Use network monitoring tools to verify if the process associated with the pipe creation exhibits unusual outbound connections or communication patterns indicative of data exfiltration.

  - **Correlate with Other Activity**: Investigate adjacent events, such as authentication logs (Event ID 4624) to see if there were recent privilege escalations or administrative logins that coincide with the named pipe creation.

  - **Validate Effective Logging Configuration**: Ensure Sysmon is configured correctly to log named pipe events and confirm that sufficient visibility is available in the environment for monitoring such activities.

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on critical systems, as named pipe manipulation can facilitate privilege escalation. The likelihood of malicious abuse is significant, given the use of CoercedPotato in various attack scenarios, particularly where lateral movement or privilege escalation is achieved through exploitation of named pipes.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured Sysmon logging or the absence of comprehensive monitoring of important events. Attackers can employ evasion techniques such as modifying pipe names or using other tools to achieve similar objectives undetected. Legitimate activities that may trigger this alert include common administrative tasks or system updates involving named pipe communications. Companion detections, such as those monitoring for other established privilege escalation tools (e.g., Mimikatz), can bolster coverage and improve insight into potential threat activities.

