note: |
  ### Technical Context
  This rule is designed to detect the creation of named pipes that include the term "coerced," specifically targeting the behavior indicative of the tool CoercedPotato. This tool is commonly used by attackers to exploit various Windows privilege escalation techniques through Windows Named Pipes, ultimately enabling them to execute arbitrary code with elevated privileges. The threat scenario typically involves a compromised host where an adversary seeks to gain or enhance control over user privileges, potentially leading to further exploitation in the enterprise environment.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (TA0005)** and **Privilege Escalation (TA0004)**, with specific techniques such as **"Process Injection" (T1055)**. The primary source of data for this detection comes from Windows logs, particularly Sysmon event logs related to named pipe creation, which must be properly configured to capture these events.

  ### Investigation Steps
  - **Review Named Pipe Logs**: Analyze Sysmon logs for Event IDs 17 and 18 that capture named pipe creation events. Look specifically for any entries where the pipe name contains "\coerced\".

  - **Correlate with Process Activity**: Cross-reference the named pipe creation events with process creation events in Sysmon (Event ID 4688) to determine which process initiated the creation of the named pipe. This can help identify any potentially malicious behavior.

  - **Assess User Context**: Validate the account context in which the named pipe was created. Investigate if the user has appropriate privileges or if there are any signs of credential theft or misuse.

  - **Identify Related Network Activity**: Monitor related network traffic that might indicate lateral movement or command-and-control communications linked to the suspected behavior.

  ### Prioritization
  The severity of this alert is high due to the potential impact of privilege escalation that can allow attackers to gain unauthorized access to sensitive systems and data within the enterprise environment. The likelihood of exploitation using tools like CoercedPotato increases with the prevalence of compromised credentials.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of the attack occurring without logging enabled for named pipe events, which requires specific Sysmon configuration for thorough monitoring. The detection logic assumes that malicious activity will consistently use the "coerced" naming convention for Named Pipes; variations or creative deviations in naming may evade this detection. Proper logging configurations across endpoints are necessary for effective detection and must be validated to ensure coverage.

