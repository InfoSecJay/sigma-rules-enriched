note: |
  ### Technical Context
  This detection rule identifies the creation of a named pipe by the WMI Event Consumer service (scrcons.exe), which is often utilized in more sophisticated attacks like Cobalt Strike. WMI (Windows Management Instrumentation) provides attackers with a means to execute commands and deploy payloads while remaining under the radar. By monitoring for the creation of named pipes in this context, security teams can detect potential malicious behavior designed to facilitate command and control (C2) communications or lateral movement within a network.

  Attackers leveraging tools like Cobalt Strike often aim to establish persistence or maintain a foothold in a compromised environment. The creation of named pipes can indicate attempts to communicate with other components of the attack infrastructure or exfiltrate data. The relevant MITRE ATT&CK tactics for this detection include **Execution (T1059)** and **Command and Control (T1047)**, where the latter specifically identifies methods of communication that can evade traditional monitoring mechanisms.

  Primary data sources that would be beneficial for this detection include:
  - Named Pipe Event logs from Sysmon (Event ID 17 and Event ID 18)
  - Windows Process creation events to observe the context in which scrcons.exe is executed
  - Any additional telemetry that captures WMI activity

  ### Investigation Steps
  - **Review Named Pipe Logs**: Analyze Sysmon logs for Event IDs 17 and 18 that correspond to named pipe creation events attributed to scrcons.exe. Pay attention to the parameters associated with these events for any anomalies.
  - **Investigate Process Activity**: Look for the execution context of scrcons.exe by correlating process creation events. This might involve tracing back to parent processes and identifying any unusual command-line arguments.
  - **Check Network Traffic**: Use EDR or network monitoring solutions to check for outbound connections or unusual internal communications associated with the named pipes created by scrcons.exe.
  - **Examine WMI Logs**: Review WMI logs for unusual queries or event triggers that could indicate the improper use of WMI for unauthorized activities. This includes filtering for any unexpected use of the WMI Event Consumer service.

  ### Prioritization
  This alert is categorized as medium severity because the creation of named pipes by scrcons.exe suggests possible malicious intent. Given the potential for sophisticated attacks to use WMI for lateral movement and persistence, timely investigation is essential to mitigate risks.

  ### Blind Spots and Assumptions
  The detection relies on having proper Sysmon logging configured for named pipe events. If Sysmon is not deployed or configured appropriately, the alerts may not trigger. Additionally, the detection may miss legitimate uses of scrcons.exe that are part of regular system operations, which introduces a potential for false positives. Assumptions also include that the attacker is using the named pipe mechanism, which may not be the case if they opt for different evasion techniques. Continuous validation of log configurations is crucial to ensure coverage remains effective.

