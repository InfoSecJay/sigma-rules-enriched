note: |
  ### Technical Context

  This rule detects the creation of a named pipe by the WMI Event Consumer service (`scrcons.exe`), which is often utilized by attackers as part of lateral movement or persistence mechanisms, particularly when leveraging tools like Cobalt Strike. The likely objective is to establish a communication channel for malicious payloads or commands, facilitating remote control over compromised systems. This behavior aligns with the MITRE ATT&CK technique for "Lateral Movement" (T1047).

  The primary telemetry sources include Sysmon logs configured to capture Named Pipe events (Event ID 17 for named pipe creation), alongside Security Event IDs that may provide context about the user and process hierarchy. The security impact is significant since successful exploitation can lead to unauthorized access and control, enabling further attacks within the network. Importantly, this detection does NOT confirm that a malicious action has occurred on its own; further investigation is required to establish intent and context.

  ### Investigation Steps

  - **Check Sysmon logs for Event ID 17 and 18**: Review Sysmon named pipe creation logs to confirm pipe access events. Look for entries related to `scrcons.exe` and confirm the associated user and command line arguments.

  - **Identify the parent process**: Examine the parent process of `scrcons.exe` using Sysmon Event ID 1 (Process Creation). Determine if it was spawned by a legitimate process (e.g., `svchost.exe`) or an identified indicator of compromise.

  - **Analyze named pipe metadata**: When reviewing the named pipe creation, check for specific names or patterns commonly associated with malicious activity (e.g., those used in Cobalt Strike). Legitimate applications typically do not create unusual or suspiciously named pipes.

  - **Review system role and context**: Validate if the action originated from a critical asset such as a domain controller or administrative workstation, as this behavior on these systems should raise additional scrutiny.

  - **Correlate with other telemetry**: Examine other event logs (like Windows Security logs) for concurrent suspicious actions (e.g., unauthorized logins or other lateral movement activities), giving broader context to the alert.

  - **Identify external command and control connections**: Use network logs to check whether the communicating processes have established connections to external IP addresses associated with known malware or command and control servers.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential of exploited systems for lateral movement within the network. Given that the event involves `scrcons.exe`, which is often associated with malicious frameworks, the likelihood of abuse is moderate and requires timely investigation to determine if further actions are needed.

  ### Blind Spots and Assumptions

  Detection may be limited due to users disabling Sysmon or failing to configure it adequately for pipe event logging. Legitimate applications may temporarily trigger this alert under typical usage scenarios involving WMI event subscriptions. A companion detection for this behavior is monitoring other Sysmon events related to unusual network connections initiated by `scrcons.exe`, providing a more comprehensive view of potential malicious activity.

