- attack.t1055
logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|contains:
    - '\pipe\'
    - '\pipe\srvsvc'          # more specific version (use only this one if the other causes too many false positives)
  filter_optional_ctx:
    PipeName|contains: '\CtxShare'
  filter_optional_default:
    PipeName|startswith: '\pipe\'     # excludes pipes that start with \pipe\*
  condition: selection and not 1 of filter_optional_*
falsepositives:
- \pipe\LOCAL\Monitorian     # https://github.com/emoacht/Monitorian
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes that match specific patterns associated with the EfsPotato tool, which is used for privilege escalation via exploitation of the Windows Cryptographic API. A likely attacker objective is to gain higher privileges by leveraging the vulnerability in the RPC service. This detection relates to the MITRE ATT&CK technique T1055 (Process Injection) and T1068 (Exploitation for Privilege Escalation).

  The primary telemetry source for this detection comes from Sysmon, specifically Event ID 17 (Named Pipe Created). If this activity is malicious, it can lead to unauthorized access to sensitive data or systems. It is important to note that this detection does not confirm actual exploitation or successful privilege escalation on its own; it merely signifies the creation of the named pipe which could be legitimate under certain circumstances.

  ### Investigation Steps

  - **Check for Sysmon Event ID 17:**
    Review Sysmon logs for Event ID 17 entries where the PipeName contains `\pipe\srvsvc`. Analyze the process associated with the pipe creation for signs of malicious intent.

  - **Identify process origin:**
    Examine the parent process of the named pipe creation. Legitimate activity may involve system processes, while unexpected entries from user applications (e.g., Powershell, cmd.exe) indicate potential malicious use.

  - **Validate against known benign actors:**
    Cross-reference the detected PipeName against logs for known benign applications, such as those from the Monitorian application (`\pipe\LOCAL\Monitorian`). Confirm whether these applications were recently invoked.

  - **Investigate additional Sysmon Events:**
    Review Sysmon logs for related events, such as Event ID 1 (Process Created) and Event ID 8 (CreateFile), to determine if the named pipe was part of a malicious workflow that included process injection or file manipulation.

  - **Analyze network and user activity:**
    Check for corresponding network connections or user session activities that coincide with the timing of the pipe creation, potentially revealing lateral movement attempts or exploitation.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and the likelihood of privilege escalation attacks being weaponized. Systems critical for administrative functions or containing sensitive data are especially vulnerable. Given the nature of EfsPotato, the likelihood of malicious abuse is elevated in environments with elevated privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon logging if not properly configured, which would require enforcement of Sysmon’s named pipe event logging (Event ID 17). Legitimate applications might trigger this alert, particularly those using named pipes for IPC. A companion detection to consider is monitoring for the `CreateFile` API calls associated with IPC to improve visibility on potential misuse of named pipes during exploitation attempts.

