title: HackTool - EfsPotato Named Pipe Creation
id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
status: test
description: Detects the pattern of a pipe name as used by the hack tool 
  EfsPotato
references:
- https://twitter.com/SBousseaden/status/1429530155291193354?s=20
- https://github.com/zcgonvh/EfsPotato
author: Florian Roth (Nextron Systems)
date: 2021-08-23
modified: 2023-12-21
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|contains:
    - '\pipe\'
    - '\pipe\srvsvc'          # more specific version (use only this one if the other causes too many false positives)
  filter_optional_ctx:
    PipeName|contains: '\CtxShare'
  filter_optional_default:
    PipeName|startswith: '\pipe\'     # excludes pipes that start with \pipe\*
  condition: selection and not 1 of filter_optional_*
falsepositives:
- \pipe\LOCAL\Monitorian     # https://github.com/emoacht/Monitorian
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes that match the patterns used by the EfsPotato hack tool, specifically looking for `\pipe\srvsvc`. It aims to identify potential privilege escalation attempts by an attacker leveraging the named pipe for unauthorized access to system resources. This behavior aligns with the MITRE ATT&CK framework under the tactic of Privilege Escalation (TA0004) and the technique of Use of Named Pipes (T1055).

  The primary telemetry source for this detection is Sysmon, specifically Event ID 17 for named pipe creation. If exploited, this could allow an adversary to gain elevated privileges, leading to potential data breaches or further network infiltration. Importantly, the detection does not confirm that malicious activity is occurring without additional correlating evidence or context.

  ### Investigation Steps

  - **Check Sysmon Event IDs 17 and 18:** Review Sysmon logs for Event ID 17. Look specifically for entries with `PipeName` containing `\pipe\srvsvc`. Confirm the presence of this named pipe creation correlates with suspicious user activity or anomalies.

  - **Review user and process activity:** Analyze the process that created the named pipe. Use Process Explorer or similar tools to cross-reference the user and processes involved at the time of the Event ID 17. Identify if the process is legitimate or associated with known malware.

  - **Analyze recent administrative actions:** Investigate any changes made by users with administrative privileges prior to the alert. Look for unusual credentialed access or command execution that may precede named pipe creation, such as any Event ID 4672 (Special privileges assigned to new logon) logs.

  - **Identify benign named pipe creations:** Validate `\pipe\LOCAL\Monitorian` among other known benign applications that may create named pipes, which can be evaluated against the alert for false positives.

  - **Correlate with network activity:** Check for network logs that may indicate lateral movement or privilege escalation attempts around the same timeline (e.g., RDP connections or SMB traffic).

  ### Prioritization

  This alert has a high severity level due to the potential impact on the system, particularly if a critical asset is involved. The likelihood of malicious abuse is elevated since tools like EfsPotato are commonly weaponized for privilege escalation tactics in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations; Sysmon must be correctly set up to capture named pipe events, or else relevant data may be lost. Legitimate activities, including certain administrative applications, might trigger this alert, leading to possible false positives. Companion detections, such as monitoring for unusual command-line argument usage or other named pipe creation events, will help strengthen coverage against this attack vector.

