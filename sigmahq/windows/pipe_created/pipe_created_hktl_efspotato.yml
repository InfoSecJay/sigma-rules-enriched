title: HackTool - EfsPotato Named Pipe Creation
id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
status: test
description: Detects the pattern of a pipe name as used by the hack tool EfsPotato
references:
- https://twitter.com/SBousseaden/status/1429530155291193354?s=20
- https://github.com/zcgonvh/EfsPotato
author: Florian Roth (Nextron Systems)
date: 2021-08-23
modified: 2023-12-21
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|contains:
    - '\pipe\'
    - '\pipe\srvsvc'          # more specific version (use only this one if the other causes too many false positives)
  filter_optional_ctx:
    PipeName|contains: '\CtxShare'
  filter_optional_default:
    PipeName|startswith: '\pipe\'     # excludes pipes that start with \pipe\*
  condition: selection and not 1 of filter_optional_*
falsepositives:
- \pipe\LOCAL\Monitorian     # https://github.com/emoacht/Monitorian
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of named pipes associated with the hack tool EfsPotato, which utilizes this mechanism to manipulate processes and escalate privileges on Windows systems. By creating named pipes with specific patterns, EfsPotato can interface with processes and gain elevated permissions, potentially allowing an adversary to carry out further exploitation of the affected system. The likely attacker objectives include privilege escalation and maintaining persistence, as attackers often leverage such tools to manipulate local security mechanisms and access sensitive data.

  The relevant MITRE ATT&CK tactics are **Defense Evasion** (T1203) and **Privilege Escalation** (T1068), specifically utilizing the technique **Process Injection** (T1055). Named pipes are a legitimate inter-process communication mechanism in Windows; therefore, their misuse for nefarious purposes requires monitoring and swift detection to mitigate potential attacks. Primary data sources for this detection include Sysmon event logs, specifically Event ID 17 (Named Pipe Created) and Event ID 18 (Named Pipe Associated), which need to be configured in the Sysmon logs to capture the necessary details.

  ### Investigation Steps
  - **Review Pipe Creation Logs:** Examine Sysmon Event ID 17 and Event ID 18 for instances of named pipes with the pattern `\pipe\srvsvc` or similar. Look for unusual or unexpected processes associated with these named pipes.
  - **Correlate with Process Activity:** Identify any processes that created or utilized the suspicious named pipes. Check for links to known malicious activity or tools, such as EfsPotato or similar privilege escalation exploits.
  - **Analyze User Context:** Determine the context of the user account that initiated the pipe creation. Investigate any administrative accounts that may have been compromised or are being used inappropriately.
  - **Review Related Network Activity:** Analyze network logs for any outgoing connections or suspicious data transfers that may correlate with the timing of the pipe creation. This may indicate exfiltration attempts or lateral movement.

  ### Prioritization
  The alert's severity is high because the creation of named pipes by tools like EfsPotato can indicate imminent and serious threats to the integrity of systems and networks. Given the likelihood of successful privilege escalation, swift response is crucial to prevent further exploitation.

  ### Blind Spots and Assumptions
  Detection coverage for this rule is dependent on correct Sysmon configuration for logging named events, which may not be implemented in all environments. Assumptions made include that named pipes are being monitored adequately and that benign named pipe activity (e.g., trusted applications) will not produce excessive false positives. Analysts must ensure that Sysmon is configured properly to capture the relevant Event IDs for effective detection of EfsPotato usage.

