note: |
  ### Technical Context
  This detection rule identifies the creation of default named pipes associated with RemCom, a remote command execution tool commonly used in penetration testing and malicious operations. Threat actors may leverage RemCom to establish remote access and execute commands on compromised systems, making it essential to detect its usage as it can signify unauthorized lateral movement or command execution. The intent behind deploying such tools typically aligns with objectives such as data exfiltration, network reconnaissance, or further compromise of trusted systems.

  The relevant MITRE ATT&CK tactics and techniques addressed by this detection include:
  - **Lateral Movement** (TA_0008)
  - **Remote Services: Remote Command Execution** (T1021.002)
  - **Execution** (TA_0002)
  - **System Services: Windows Services** (T1569.002)

  The primary data sources for this detection include Windows event logs related to named pipe creations, specifically Sysmon events that track pipe creation (Event ID 17) and pipe connections (Event ID 18). Ensuring that the Sysmon logging is correctly configured to capture these events is critical for effective detection.

  ### Investigation Steps
  - **Review Sysmon Logs**: Examine Sysmon Event ID 17 and Event ID 18 logs for instances of named pipes containing '\RemCom'. Look for unusual creation times or occurrences outside of typical administrative activity.
  - **Correlate with Process Activity**: Investigate the processes that interacted with the named pipes. Identify any unusual parent-child relationships or unexpected command-line arguments that may suggest malicious intent.
  - **Check User Context**: Determine the user accounts associated with the named pipe creations. Pay close attention to service accounts or users executing administrative functions that are not part of standard operations.
  - **Audit Network Traffic**: Analyze network logs for any connections to external addresses using common ports associated with remote command execution tools. This can help confirm whether the behavior was initiated from a recognized internal asset or represents suspicious network activity.

  ### Prioritization
  This alert is of medium severity due to the potential for its use in nefarious activities. While RemCom may have legitimate applications in managed environments, its detection indicates possible unauthorized remote access, warranting further investigation to confirm the legitimacy of the activity or ongoing compromises.

  ### Blind Spots and Assumptions
  Blind spots may include environments where Sysmon is not deployed or where named pipe logging is not configured correctly. The detection logic assumes that any creation of named pipes containing '\RemCom' is suspicious, potentially leading to false positives, particularly from legitimate administrative activities. Continuous validation of logging configurations and the adaptation of detection logic may be necessary to minimize misclassifications. Additionally, the analysis requires access to complete Sysmon logs to function correctly, which may not be present in all environments.

