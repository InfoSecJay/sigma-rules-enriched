note: |
  ### Technical Context

  This rule detects the creation of named pipes with the specified format commonly associated with RemCom, a remote command execution tool often used by attackers for lateral movement. The likely adversary objective is to maintain a covert channel for executing commands on target systems. This behavior aligns with the MITRE ATT&CK tactics of Lateral Movement (TA LAN-010) and Remote Services (T1021.002).

  The primary telemetry source is Windows Sysmon logs, specifically Event ID 17 (Named Pipe Events) and Event ID 18 (Pipe Created). If an organization is compromised, the creation of default RemCom named pipes could facilitate unauthorized access and command execution. However, this detection does not confirm malicious intent on its own, as similar named pipes can be created through legitimate administrative actions.

  ### Investigation Steps

  - **Review Sysmon logs for Event ID 17 or 18:** Correlate events with the suspicious pipe name containing "\RemCom" in time proximity to other anomalous activities.
  - **Identify associated process IDs:** Check if the process creating the named pipe is a known system process or user application. Look for unusual parent-child relationships in Event ID 4688 (Process Creation).
  - **Verify legitimate usage:** Confirm whether the system administrator intended to create the named pipe for acceptable maintenance or script execution; legitimate examples might include known administrative scripts lacking suspicious parameters.
  - **Examine network activity:** Review network traffic logs for unexpected outbound connections originating from the host associated with the named pipe. Check for established connections to external IPs or unusual domains.
  - **Assess the execution context:** Cross-reference the user account associated with the pipe creation against a list of administrators or automated scripts. Alerts involving service accounts may have higher legitimacy.
  - **Look for co-occurring alerts:** Cross-check with other detections in the environment, such as remote service attempts (T1021), to identify patterns indicative of active compromise.

  ### Prioritization

  This alert should be prioritized as medium severity. The impact can be high if an attacker leverages this technique successfully, potentially compromising multiple systems. The likelihood of malicious usage is concerning, given the association with tools designed for stealthy lateral movement, although not all occurrences are necessarily malicious.

  ### Blind Spots and Assumptions

  The detection might be evaded by malware that generates non-standard pipe names or obfuscates execution commands. Reliability requires ensuring that Sysmon logging is correctly configured to capture named pipe events; failure to do this will result in no logs being generated. Additionally, legitimate administrative activities might trigger this alert when using tools like PowerShell or remote management utilities. A related detection to consider is monitoring PowerShell command execution (T1059.001), which enhances visibility into potentially malicious intentions.

