note: |
  ### Technical Context

  This rule detects the creation of a default Named Pipe associated with RemCom, a remote command execution tool often used for lateral movement post-exploitation. An attacker using RemCom typically aims to execute commands on remote systems within a network to maintain access or escalate privileges. The relevant MITRE ATT&CK tactics include Lateral Movement (T1021.002) and Remote Services (T1569.002).

  The primary telemetry source for this detection is Sysmon logs, specifically Event IDs 17 (Named Pipe created) and 18 (Named Pipe connected). If malicious, this activity may indicate an unauthorized command execution attempt, potentially leading to system compromise or data exfiltration. This detection does NOT confirm that malicious activity has occurred on its own, as benign administrative tasks may also generate similar alerts.

  ### Investigation Steps

  - **Examine Sysmon Event ID 17 entries:** Look for Named Pipe creation events with PipeName containing '\RemCom'. Pay attention to timestamp and source user details which can indicate whether it matches legitimate administrative activity or an anomalous pattern.

  - **Cross-reference Event ID 18 for connection attempts:** Investigate Sysmon Event ID 18 to check for connections to the RemCom Named Pipe. A high-confidence malicious indicator is if the connecting user is anomalous or belongs to an unauthorized group.

  - **Validate source process details:** Check the "Image" field in Event ID 17 to determine which process initiated the Named Pipe. Unrecognized processes or those typically not associated with administrative tasks should raise suspicion.

  - **Identify legitimate usage patterns:** Confirm if activities from well-known administrative tools (e.g., PowerShell, PsExec) are presenting in your environment. Typical commands that utilize Named Pipes without anomalous privilege escalation should be noted.

  - **Review user account activity:** Look at audit logs for unusual user account activity around the time of Named Pipe events. Accounts that do not typically perform administrative tasks but display this behavior could indicate misuse.

  - **Assess impact significance based on asset criticality:** Evaluate the role of the host where alerts triggered. High-value targets (e.g., domain controllers, databases) that show these RemCom activities warrant immediate escalated response.

  ### Prioritization

  This alert carries medium severity due to potential lateral movement attempts indicating a compromise. The impact on critical systems can be significant if RemCom is used maliciously. While not prevalent in common enterprise environments, the behavior is known to be exploited by various threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Sysmon logging; if not properly set, some Named Pipe events may not be captured. Legitimate administrative tools may trigger this alert, especially in environments with frequent remote administration. Related detections include command execution logs (e.g. PowerShell logs or audit logs of remote service utilization), which can provide additional context to ascertain whether the activity is part of legitimate operations or a security incident.

