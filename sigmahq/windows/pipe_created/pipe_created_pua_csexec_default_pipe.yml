note: |
  ### Technical Context

  This Sigma rule detects the creation of a Named Pipe associated with the default CSExec service (`\csexecsvc`). Such behavior is indicative of lateral movement or remote code execution attempts typically associated with tools like Cobalt Strike, which attackers use to execute commands on remote systems under their control. The relevant MITRE ATT&CK tactics and techniques include Lateral Movement (T1021.002) and Execution (T1569.002).

  The primary telemetry sources are Sysmon logs, specifically Event ID 17 (Named Pipe Created) and Event ID 18 (Named Pipe Closed), and these must be configured appropriately to capture Named Pipe events. If confirmed as malicious, the creation of such a Named Pipe presents a significant security risk, indicating potential unauthorized access and command execution. Importantly, this detection does NOT confirm that the activity was indeed malicious, as legitimate administrative tasks may also create Named Pipes.

  ### Investigation Steps

  - **Examine Event ID 17 and 18 logs:** Review Sysmon logs for Event ID 17 (Pipe Created) related to `\csexecsvc`. Look for unusual process IDs or parent processes initiating the pipe creation. Compare against known good baselines of administrative activity.

  - **Identify the parent process:** Check which process is creating the Named Pipe. Use Sysmon Event ID 4688 (Process Creation) to investigate the command line used and any associated user accounts, focusing on processes initiated by non-administrative users.

  - **Validate the user context:** Cross-reference the user account associated with the Named Pipe creation in your SIEM. Legitimate admin activity typically uses accounts like `DOMAIN\Administrator` or specific service accounts. Anomalous accounts may indicate compromise.

  - **Look for additional malicious indicators:** Search for subsequent command execution via `PowerShell` or `cmd.exe` initiated from the Named Pipe, specifically looking for Event ID 4104 in PowerShell logs, which may indicate script execution via `Invoke-Expression`.

  - **Assess the system's role:** Identify the asset where the Named Pipe was created. If the system is critical (e.g., domain controller or application server), prioritize investigation, as these assets could be targets for widespread lateral movement.

  - **Review for potential evasion attempts:** Check for logs indicating attempts to disable Sysmon or clear event logs around the same time the Named Pipe was created. Look for unusual or anomalous log activity using Windows Event Viewer logs.

  ### Prioritization

  The severity of this alert should be considered medium, as the creation of a CSExec Named Pipe can indicate lateral movement by an attacker. The likelihood of malicious abuse is high due to the weaponized nature of tools like Cobalt Strike, especially when combined with other suspicious indicators.

  ### Blind Spots and Assumptions

  Detection may be limited if Sysmon is not properly configured to log Named Pipe events, leading to potential gaps in visibility. Legitimate administrative tasks could trigger the alert, especially in environments where admins frequently use scripts for maintenance. A related detection involves monitoring for unusual process invocation patterns to complement this rule, which can bolster the efficacy of monitoring for malicious activity.

