note: |
  ### Technical Context
  This detection rule identifies the creation of default named pipes associated with **CSExec**, a subcomponent of **Cobalt Strike**, which is a penetration testing tool often used by threat actors for lateral movement and command execution in compromised environments. The rule is particularly aimed at identifying signs of malicious activity where attackers utilize CSExec to execute commands on remote systems, leveraging named pipes as a communication medium. The goal of the adversary in this scenario may include gaining unauthorized access, executing payloads, or further compromising additional systems.

  The relevant MITRE ATT&CK tactics include **Lateral Movement** (attack.lateral-movement) and **Execution** (attack.execution), specifically through techniques T1021.002 (Remote Services: SMB/Windows Admin Shares) and T1569.002 (Remote Services: Command and Control via Named Pipes).

  The primary data sources used for this detection are Windows Sysmon logs, particularly event IDs 17 and 18, which log named pipe creation and connection events. Ensuring these logs are correctly configured is critical for the detection rule's efficacy.

  ### Investigation Steps
  - **Review Named Pipe Creation Logs**: Examine Sysmon Event IDs 17 and 18 for instances where pipes containing '\csexecsvc' are created, as these may indicate potential malicious use of Cobalt Strike.

  - **Assess User Permissions and Context**: Investigate the user account associated with the pipe creation for any signs of compromise or unusual behavior, such as unexpected administrative actions or privileges.

  - **Analyze Network Traffic**: Use NDR (Network Detection and Response) tools to inspect traffic patterns to and from the affected systems, focusing on any interruptions or malicious communications that may suggest lateral movement.

  - **Correlate with Other Security Alerts**: Check if there are any associated alerts from EDR or AV tools that may provide additional context regarding the behavior of processes linked to the named pipe activity.

  ### Prioritization
  This alert is considered medium severity as it indicates a possible use of sophisticated tools for lateral movement in the environment. Given that Cobalt Strike is commonly used by threat actors, a rapid response may prevent further exploitation or additional compromise.

  ### Blind Spots and Assumptions
  This detection relies on the correct configuration of Sysmon to capture named pipe events (Event IDs 17 and 18). If logging is not enabled, or if there are other legitimate applications that create similar named pipes, the detection may generate false positives. The detection logic assumes that any pipe creation with the specific name is suspicious, which may not account for legitimate administrative activities. Regular reviews and tuning of alerts will be necessary to minimize noise while ensuring the detection of actual threats.

