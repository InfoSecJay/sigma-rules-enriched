detection:
  selection:
    PipeName: '\PSEXESVC'
    Image|contains:     # Add or remove locations depending on how and if you execute Psexec in your env
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
  condition: selection
falsepositives:
- Rare legitimate use of psexec from the locations mentioned above. This will 
  require initial tuning based on your environment.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes by the PsExec service, specifically when executed from suspicious locations such as public folders or temp directories. The likely attacker objective is to achieve remote code execution or lateral movement within a network using PsExec, a tool commonly misused in post-exploitation scenarios. This detection aligns with the MITRE ATT&CK technique for Remote Services and Tactics Execution (T1569.002, TA0002).

  The primary telemetry sources required are Sysmon logs, specifically Event IDs 17 (Named Pipe Created) and 18 (Named Pipe Deleted) to track PsExec’s activity. If malicious, this behavior can indicate the presence of unauthorized access or an attacker moving laterally within the environment. Importantly, this detection alone does not confirm that an attack is in progress; it may also capture legitimate administrative activities.

  ### Investigation Steps

  - **Verify Sysmon Logging Configuration:** Ensure Sysmon event logging is configured to capture named pipe events (Event IDs 17 and 18). Use logs filtered by the 'PipeName' field to identify any suspicious executions.

  - **Analyze Pipe Creation Logs:** Look for PsExec executions with the PipeName equal to `\PSEXESVC` and examine the `Image` field for entries containing paths like `C:\Users\Public\`, `C:\Windows\Temp\`, or `C:\Users\<User>\AppData\Local\Temp\`. Compare these findings against known legitimate process executions.

  - **Identify High-Confidence Malicious Indicators:** Cross-reference any identified processes with a known malicious hashing database, particularly those associated with Cobalt Strike or other malicious usage of PsExec.

  - **Assess the Source of Execution:** Investigate the user and processes that initiated the PsExec command. Look for correlated event logs (e.g., Windows Security Event ID 4688) that show process creation, including the user context under which PsExec was executed.

  - **Recognize Legitimate Use Cases:** Document any business-related usage of PsExec from the detected locations which may provide context—such as system maintenance or patching across multiple systems that aligns with the organization's policies.

  - **Validate Network Traffic:** If possible, check for network activity related to the execution of PsExec. Filter through firewall logs or network behavior logs to identify any unusual outbound connections initiated shortly after the PsExec execution.

  ### Prioritization

  The alert's severity is medium because the affected system's criticality can vary; however, PsExec's typical usage strongly indicates potential malicious activity. The likelihood of abuse is notable, as tools like PsExec are frequently weaponized in breaches, particularly for lateral movement and privilege escalation.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives generated by rare yet legitimate administrative use of PsExec from suspicious paths, necessitating thorough context validation. The requirement for proper Sysmon configuration impacts detection reliability, and alerts may arise from benign automated deployment scenarios. A related detection worth implementing is monitoring for abnormal process spawning activities (e.g., PowerShell or CMD launching PsExec) for enhanced coverage.

