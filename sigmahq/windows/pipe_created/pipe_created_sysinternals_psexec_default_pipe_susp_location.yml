logsource:
  category: pipe_created
  product: windows
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName: '\PSEXESVC'
    Image|contains:     # Add or remove locations depending on how and if you execute Psexec in your env
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\Desktop\'
    - '\Downloads\'
  condition: selection
falsepositives:
- Rare legitimate use of psexec from the locations mentioned above. This will require
  initial tuning based on your environment.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of PsExec, a Microsoft Sysinternals tool used for executing processes on remote systems, particularly when initiated from suspicious file locations such as the Temp or Public directories. The presence of PsExec could indicate malicious activities like lateral movement or remote code execution by an adversary. Attackers may utilize PsExec to establish remote command execution capabilities after gaining initial access to the network, facilitating further attacks such as data exfiltration or ransomware deployment.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Execution (TA0002)**: The act of running malicious or unauthorized programs.
  - **Remote Services (T1569.002)**: Utilizing tools like PsExec to execute commands remotely.
  - **Command and Control (T1071)**: If PsExec is leveraged to communicate with an external control server.

  Primary data sources for this detection include Sysmon event logs documenting named pipe creations, particularly Event IDs 17 (Named Pipe) and 18 (Named Pipe Server), which provide insight into the actual invocation and execution contexts of PsExec.

  ### Investigation Steps
  - **Review Named Pipe Logs**: Check Sysmon logs for Event ID 17 and Event ID 18 to identify instances where named pipes have been created, specifically the `\PSEXESVC` pipe. Look for unusual source and destination processes.
  - **Analyze Execution Context**: Validate the file paths of executed images, investigating any running instances of PsExec originating from suspicious directories such as 'C:\Users\Public\' or 'C:\Windows\Temp\'.
  - **Correlate User Activity**: Cross-reference the execution events with user activity logs (e.g., login times, administrative actions) to determine if the activity aligns with legitimate user behavior.
  - **Investigate Process Hierarchy**: Utilize process tree analysis to trace parent-child relationships between processes that may indicate the initial point of compromise or further lateral movement.

  ### Prioritization
  Alerts generated by this detection rule should be considered medium priority due to the potential severity of unauthorized remote execution on enterprise networks. While there may be legitimate uses for PsExec, frequent occurrences from unusual locations indicate a higher likelihood of malicious intent.

  ### Blind Spots and Assumptions
  This detection may not cover legitimate instances of PsExec used within its expected context, especially if users utilize it from standard paths. The detection logic assumes that all instances of PsExec from the defined suspicious locations are malicious, which may lead to false positives. Successful detection requires proper logging configurations in Sysmon, specifically enabling Event IDs 17 and 18 for named pipes; without these logs, detection will not function as intended.

