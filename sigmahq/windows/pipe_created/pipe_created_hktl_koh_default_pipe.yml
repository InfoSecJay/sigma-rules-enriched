note: |
  ### Technical Context
  This detection rule identifies the creation of specific named pipes associated with the Koh tool, a post-exploitation framework. Designed for privilege escalation or lateral movement, named pipes serve as communication channels within the Windows operating system, and malicious actors exploit them for covert operations. When an attacker uses the Koh tool, they may aim to escalate privileges, execute shellcode, or maintain persistence on compromised hosts.

  The suspected behavior could involve the creation of named pipes like `\imposecost` and `\imposingcost`, which are indicative of Koh's operational tactics. Attackers utilizing this framework could be aligning their actions with MITRE ATT&CK techniques, notably:
  - **T1528 - Steal application access token**: Using the named pipes to communicate and gain unauthorized access to credentials.
  - **T1134.001 - Access Token Manipulation: Token Impersonation/Theft**: Named pipes can facilitate the impersonation of legitimate tokens for privilege escalation.

  The primary data sources for detecting this activity include Windows event logs generated by Sysmon, specifically Event IDs 17 and 18, which log the creation of named pipes. Ensuring proper logging configuration is crucial for effective detection.

  ### Investigation Steps
  - **Review Sysmon Logs**: Examine Sysmon Event IDs 17 and 18 for entries that indicate the creation of named pipes containing `\imposecost` or `\imposingcost`.
  - **Analyze Process Creation**: Investigate the parent and child processes associated with the named pipe creations. Look for any unfamiliar or suspicious processes that may indicate the presence of the Koh tool.
  - **Check User Activity**: Monitor user activity related to the accounts that created the named pipes. Pay special attention to unusual logins or actions, especially if they coincide with the timing of named pipe creation.
  - **Correlate with Other Data Sources**: Cross-reference findings with other telemetry like EDR alerts or network traffic logs. Look for anomalies that could suggest the presence of malicious tools or compromised hosts.

  ### Prioritization
  Given the critical nature of this alert and the potential for attackers to leverage named pipes for privilege escalation or credential theft, this rule should be treated as a high-priority incident in an enterprise environment. The likelihood of exploitation and the impact on organizational security underscore the need for immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection if Sysmon logging for named pipe events is not properly configured or enabled across all systems. The detection logic assumes that the targeted named pipes are being used in a malicious context, which may not account for legitimate applications that also utilize similar naming conventions. For effective detection, it is essential to ensure that Sysmon is appropriately configured, and relevant Event IDs are being logged consistently across endpoints.

