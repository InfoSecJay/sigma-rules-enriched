note: |
  ### Technical Context

  This detection identifies the creation of named pipes commonly used by the Koh tool, which is associated with privilege escalation and credential access. The primary objective of the attacker using this tool is to gain unauthorized access or elevate privileges within the targeted environment. This activity relates to the MITRE ATT&CK techniques T1528 (Application Layer Protocol) and T1134.001 (Access Token Theft).

  The primary telemetry sources include Sysmon Event ID 17 and Event ID 18, which log named pipe creation events. If malicious, the impact includes potential unauthorized access to sensitive information or control over the affected system. Importantly, this detection does NOT confirm that malicious activity is occurring without corroborating evidence from additional logs or actions.

  ### Investigation Steps

  - **Check Sysmon logs for Event ID 17 and Event ID 18**: Verify the creation of named pipes. Look for entries where PipeName contains `\imposecost` or `\imposingcost`. Malicious indicators include these names without associated legitimate process activity.

  - **Review process creation logs (Event ID 4688)**: Assess processes associated with the identified named pipe entries. Specifically, check the `ParentProcessId` and `Image` fields to correlate with known malicious or unexpected executables.

  - **Investigate the user account associated with the named pipe creation**: Identify if the user has a legitimate reason for creating these pipes. Check for actions typical of system administrators versus normal user activity.

  - **Monitor for signs of privilege escalation**: Examine if the named pipe activity coincides with Event ID 4672 (Special privileges assigned to new logon) or any other known privilege escalation behaviors.

  - **Look for file creation or alteration events**: Confirm if any new files were created in conjunction with the named pipe usage. Check for files marked with suspicious timestamps in the Windows Event ID 4663 logs (Access attempts).

  ### Prioritization

  This alert is critical due to the high-impact nature of the affected systems, especially if they hold sensitive data or mission-critical applications. The likelihood of malicious use is concerning since the Koh tool and named pipes are commonly exploited in advanced adversary techniques for lateral movement and credential theft.

  ### Blind Spots and Assumptions

  Detection may be hindered by ineffective Sysmon configurations that do not log named pipe events. Attackers may employ methods to evade detection, such as using legitimate process names or benign-looking parameters. Additionally, legitimate applications might also generate similar named pipes, so context is crucial. A related detection could include monitoring for unusual parent-child process relationships alongside named pipe activity to strengthen coverage.

