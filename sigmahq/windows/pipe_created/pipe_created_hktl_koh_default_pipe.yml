note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes associated with the Koh hacking tool, specifically those containing the identifiers '\imposecost' or '\imposingcost'. Attackers using Koh may leverage these named pipes for covert communication or to escalate privileges within a compromised environment, aiming for credential access or control over targeted systems. The relevant MITRE ATT&CK techniques are: **Credential Access (T1528)** and **Privilege Escalation (T1134.001)**.

  Primary telemetry sources include Windows Sysmon logs, specifically Event ID 17 (named pipe created) and Event ID 18 (named pipe connected). If malicious, the creation of these pipes could indicate an active compromise or escalated access during a post-exploitation phase. Importantly, this detection does NOT confirm malicious activity on its own; further analysis is required to determine the intent behind the named pipe creation.

  ### Investigation Steps

  - **Check Sysmon event logs for named pipe creations:** Review Sysmon Event ID 17 and 18 for any entries containing the strings '\imposecost' or '\imposingcost'. Note the timestamps and associated process IDs (PIDs) for further analysis.

  - **Verify the parent process:** For identified Sysmon Event ID 17 logs, correlate the created pipe with the parent process using Event ID 4688 (process creation) to see if it relates to known malicious activity or recognized tools.

  - **Assess recent changes in environment:** Evaluate any recent changes to the system, such as unauthorized software installations or policy changes that might have occurred around the timestamps of the detected events.

  - **Identify legitimate usage of named pipes:** Investigate whether named pipes were legitimately created by internal applications. Search for other named pipes similar to those created and their typical use cases within your environment.

  - **Cross-reference with threat intelligence:** Use threat intelligence sources to identify whether known indicators for Koh or similar tools have been reported in your network or other organizations.

  - **Check for file creation and data transfer:** Validate any files created or transferred around the same time as the named pipe creation, particularly if they relate to `.exe`, `.dll`, or other executable formats that may assist in the escalation attempt.

  ### Prioritization

  This alert should be considered critical due to the potential impact on sensitive systems and the high likelihood of a real intrusion attempt when default named pipes associated with the Koh tool are created. Such behavior is directly weaponized for privilege escalation and credential harvesting.

  ### Blind Spots and Assumptions

  Detection is limited by the need for Sysmon configuration, specifically for Named Pipe Events (Event ID 17 and 18). Inadequate or absent logging will result in detection failures. Legitimate applications may create similar named pipes for valid purposes, leading to potential false positives. Companion detections that could strengthen coverage include monitoring for abnormal process executions or network activity associated with known threat actor tools in addition to detecting anomalous named pipe activity.

