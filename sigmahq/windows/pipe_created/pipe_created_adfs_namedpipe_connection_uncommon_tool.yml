title: ADFS Database Named Pipe Connection By Uncommon Tool
id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
status: test
description: |
  Detects suspicious local connections via a named pipe to the AD FS configuration database (Windows Internal Database).
  Used to access information such as the AD FS configuration settings which contains sensitive information used to sign SAML tokens.
references:
- https://github.com/Azure/Azure-Sentinel/blob/f99542b94afe0ad2f19a82cc08262e7ac8e1428e/Detections/SecurityEvent/ADFSDBNamedPipeConnection.yaml
- https://o365blog.com/post/adfs/
- https://github.com/Azure/SimuLand
author: Roberto Rodriguez @Cyb3rWard0g
date: 2021-10-08
modified: 2023-11-30
tags:
- attack.collection
- attack.t1005
logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName: '\MICROSOFT##WID\tsql\query'
  filter_main_generic:
    Image|endswith:
    - ':\Windows\System32\mmc.exe'
    - ':\Windows\system32\svchost.exe'
    - ':\Windows\System32\wsmprovhost.exe'
    - ':\Windows\SysWOW64\mmc.exe'
    - ':\Windows\SysWOW64\wsmprovhost.exe'
    - ':\Windows\WID\Binn\sqlwriter.exe'
    - '\AzureADConnect.exe'
    - '\Microsoft.Identity.Health.Adfs.PshSurrogate.exe'
    - '\Microsoft.IdentityServer.ServiceHost.exe'
    - '\Microsoft.Tri.Sensor.exe'
    - '\sqlservr.exe'
    - '\tssdis.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify suspicious local connections made to the AD FS (Active Directory Federation Services) configuration database via named pipes. Specifically, it captures events where tools not typically associated with the management of AD FS, like certain instances of `mmc.exe` or `svchost.exe`, connect to the database. Such suspicious connections may indicate an unauthorized attempt to access sensitive information about AD FS configurations, which are critical for signing SAML tokens used in federated identity scenarios. Attackers may seek to exploit this data for identity theft, account compromise, or unauthorized access to services.

  The relevant MITRE ATT&CK techniques for this detection include **Credential Dumping (T1005)** and **Command and Scripting Interpreter (T1059)** when attackers leverage scripts or commands to manipulate or interact with AD FS databases without proper authorization. The detection leverages Sysmon events specifically targeting named pipe creation logs, which provide insight into inter-process communication in Windows environments.

  Primary data sources for this detection include:
  - Sysmon logs configured to capture named pipe events (Event ID 17 and Event ID 18).
  - Security event logs that monitor connections to sensitive database components.

  ### Investigation Steps
  - **Review Named Pipe Events:** Analyze Sysmon logs for Event ID 17 and Event ID 18 to identify any unexpected connections to `\\MICROSOFT##WID\tsql\query`. Look for processes that engaged in these connections and verify their legitimacy.

  - **Validate Process Origins:** Cross-reference the observed processes (e.g., `mmc.exe`, `svchost.exe`) with known allowed applications interacting with the AD FS database. Flag any inconsistencies or use of uncommon tools.

  - **Assess User Activity:** Investigate the user accounts associated with the identified processes. Determine if they have the necessary permissions for accessing the AD FS configuration database. Look for any anomalies such as elevated privileges or unusual login patterns.

  - **Correlate with Other Logs:** Expand the investigation by correlating findings with other sources such as EDR logs, network traffic to the AD FS service, and authentication logs. This provides a broader context of potential lateral movement or data exfiltration efforts.

  ### Prioritization
  The alert is marked as medium severity due to the potential impact of unauthorized access to sensitive AD FS configurations, which could lead to significant security compromises. Given the specialized nature of the tools and processes involved, the likelihood of exploitation by skilled attackers warrants timely investigation.

  ### Blind Spots and Assumptions
  Gaps in detection may exist if Sysmon logging for named pipes is not appropriately configured or enabled in the enterprise environment. The detection assumes that any named pipe connection initiated outside of baseline normal process behavior could indicate malicious intent. Furthermore, if a legitimate application is identified as communicating with the AD FS database through named pipes without appropriate monitoring, this could lead to false negatives. Adequate configuration and continuous monitoring of Sysmon settings are essential for the alert's efficacy to function correctly.

