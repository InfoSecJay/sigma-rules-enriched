detection:
  selection:
    PipeName: '\MICROSOFT##WID\tsql\query'
  filter_main_generic:
    Image|endswith:
    - ':\Windows\System32\mmc.exe'
    - ':\Windows\system32\svchost.exe'
    - ':\Windows\System32\wsmprovhost.exe'
    - ':\Windows\SysWOW64\mmc.exe'
    - ':\Windows\SysWOW64\wsmprovhost.exe'
    - ':\Windows\WID\Binn\sqlwriter.exe'
    - '\AzureADConnect.exe'
    - '\Microsoft.Identity.Health.Adfs.PshSurrogate.exe'
    - '\Microsoft.IdentityServer.ServiceHost.exe'
    - '\Microsoft.Tri.Sensor.exe'
    - '\sqlservr.exe'
    - '\tssdis.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious local connections to the Active Directory Federation Services (ADFS) configuration database via named pipes. The detected behavior is indicative of an attempt to access sensitive configuration settings related to SAML token signing. An attacker may aim to gather or exfiltrate sensitive data stored within the ADFS configuration, potentially leading to unauthorized access to federated services.

  This detection maps to the MITRE ATT&CK technique "Data from Information Repositories" (T1005). Primary telemetry sources include Windows Sysmon logs capturing named pipe creations (Event ID 17 and Event ID 18), which require specific configuration to ensure accurate monitoring. The security impact of malicious activity here is significant, as it could compromise the integrity of authentication mechanisms. However, this detection does NOT confirm malicious intent on its own, as legitimate processes may also interact with these named pipes under normal operations.

  ---

  ### Investigation Steps

  - **Check Sysmon logs for relevant events:** Review Sysmon Event ID 17 and Event ID 18 for connections to the named pipe `\\MICROSOFT##WID\tsql\query`. Focus on the `ProcessId` and `Image` fields. Look for unexpected processes that are not part of standard administrative or management activities.

  - **Identify process legitimacy:** Investigate the parent process of the detected connection. Legitimate connections typically come from `mmc.exe`, `svchost.exe`, or other known system scripts. If the parent process is unknown or associated with uncommon tools, consider marking it as suspicious.

  - **Analyze account behavior:** Review user account activity associated with the detected connection in Active Directory logs. Check for logins to the system or use of administrative tools by accounts that do not typically engage with ADFS configuration tasks.

  - **Cross-reference with known good configurations:** Verify whether the detected named pipe connections align with normal operational baselines in your environment. Use historical logs to identify typical access patterns to ADFS.

  - **Investigate outbound connections:** If a connection to the named pipe is correlated with outbound network connections (e.g., to uncommon external IP addresses), analyze those logs from your next-gen firewall or proxy solutions for potential data exfiltration.

  - **Assess the environment for common tools:** Look for known tooling used for ADFS interactions, such as `AzureADConnect.exe` or `Microsoft.IdentityServer.ServiceHost.exe`. However, be cautious of these being used in unauthorized manners or from non-standard locations.

  ---

  ### Prioritization

  The alert holds a medium priority in an enterprise context, particularly for systems managing federated services. The potential for compromised authentication flows increases the severity, especially if the behavior deviates from known benign processes. This activity is not commonly weaponized but can be indicative of preliminary steps in a broader attack strategy targeting authentication mechanisms.

  ---

  ### Blind Spots and Assumptions

  The detection capability can be limited if Sysmon is not correctly configured to log named pipe events (Event IDs 17 and 18). Evasion techniques could include using legitimate processes disguised under different contexts or utilizing custom scripts to interact with the ADFS database without triggering alerts. Legitimate administrative activities, such as configuration changes to ADFS, might also generate similar alerts. A companion detection that enhances coverage would involve monitoring access to ADFS logs and database directly for anomalous queries or operations.

