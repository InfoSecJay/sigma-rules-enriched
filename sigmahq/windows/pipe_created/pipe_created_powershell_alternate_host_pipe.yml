  type: derived
status: test
description: Detects alternate PowerShell hosts potentially bypassing detections looking
  for powershell.exe
references:
- https://threathunterplaybook.com/hunts/windows/190610-PwshAlternateHosts/notebook.html
- https://threathunterplaybook.com/hunts/windows/190410-LocalPwshExecution/notebook.html
author: Roberto Rodriguez @Cyb3rWard0g, Tim Shelton
date: 2019-09-12
modified: 2025-10-07
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|startswith: '\PSHost'
  filter_main_generic:
  - Image|contains:
    - ':\Program Files\PowerShell\7-preview\pwsh.exe'           # Powershell 7
    - ':\Program Files\PowerShell\7\pwsh.exe'           # Powershell 7
    - ':\Windows\system32\dsac.exe'
    - ':\Windows\system32\inetsrv\w3wp.exe'             # this is sad :,( but it triggers FPs on Exchange servers
    - ':\Windows\System32\sdiagnhost.exe'
    - ':\Windows\system32\ServerManager.exe'
    - ':\Windows\system32\wbem\wmiprvse.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - ':\Windows\System32\wsmprovhost.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  - Image|contains|all:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\pwsh.exe'
  - Image|contains|all:
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    - '\pwsh.exe'
  filter_optional_sqlserver:   # Microsoft SQL Server\130\Tools\
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    Image|contains: '\Microsoft SQL Server\'
    Image|endswith: '\Tools\Binn\SQLPS.exe'
  filter_optional_azure_connected_machine_agent:
        # Azure Connected Machine Agent (https://devblogs.microsoft.com/powershell/azure-policy-guest-configuration-client/)
    Image|startswith: 'C:\Program Files\AzureConnectedMachineAgent\GCArcService'
    Image|endswith: '\GC\gc_worker.exe'
  filter_optional_citrix:
    Image|startswith: 'C:\Program Files\Citrix\'
  filter_optional_exchange:
    Image|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
  filter_main_null:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Programs using PowerShell directly without invocation of a dedicated interpreter.
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where alternate PowerShell hosts are being used to create named pipes, which could potentially circumvent traditional detection mechanisms that typically look for the standard `powershell.exe` process. Attackers commonly utilize named pipes as a method to establish communication between processes, which can facilitate various nefarious activities such as command execution or malware deployment without arousing immediate suspicion.

  The threat scenario entails an attacker operating within a network, leveraging PowerShell's capabilities through less common execution methods. The likely objective for the attacker is to conduct reconnaissance, execute malicious scripts, or deploy tools like Cobalt Strike while avoiding detection by security controls. By hiding their actions behind legitimate system processes or less monitored PowerShell hosts, attackers can escalate privileges, maintain persistence, or exfiltrate data without drawing attention.

  The relevant MITRE ATT&CK tactics include **Execution (TA0002)** with the technique **Command and Scripting Interpreter: Windows PowerShell (T1059.001)**. Primary data sources for capturing these activities include **Sysmon logs** for named pipe creation events (Event ID 17 and Event ID 18), which provide insight into inter-process communications that may be malicious but are not always logged through standard security solutions.

  ### Investigation Steps
  - **Collect Sysmon Logs:** Gather Sysmon event logs for named pipe creation (Event ID 17 and Event ID 18) to identify any suspicious instances where non-standard PowerShell hosts are creating named pipes.
  - **Review Process Creation Events:** Analyze process creation logs to determine the parent and child process relationships surrounding the instances of named pipe creation to uncover any anomalous command execution paths.
  - **Examine Network Traffic:** Inspect any related network traffic that may correlate with the identified process instances, particularly looking for unusual outbound connections that could indicate data exfiltration or command and control communication.
  - **Check for Known Malicious Activities:** Use threat intelligence feeds to check whether any identified process images or pipe names are associated with known malicious tools or techniques, including references to Cobalt Strike or similar frameworks.

  ### Prioritization
  This alert is of medium severity due to its potential to indicate sophisticated attack techniques used by adversaries to evade detection. Given the critical role of PowerShell in both administrative and malicious activities, incidents detected by this rule warrant prompt investigation to prevent possible exploitation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Sysmon is not configured correctly to log named pipe events, as the rule relies heavily on these logs to function effectively. Furthermore, the detection logic assumes that typical PowerShell command usage has already been accounted for; thus, it may generate false positives from legitimate applications that use PowerShell for valid operations. Proper logging configurations and thorough monitoring of named pipe events are crucial for the alert's effectiveness.

