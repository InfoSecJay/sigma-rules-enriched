logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|startswith: '\PSHost'
  filter_main_generic:
  - Image|contains:
    - ':\Program Files\PowerShell\7-preview\pwsh.exe'           # Powershell 7
    - ':\Program Files\PowerShell\7\pwsh.exe'           # Powershell 7
    - ':\Windows\system32\dsac.exe'
    - ':\Windows\system32\inetsrv\w3wp.exe'             # this is sad :,( but it triggers FPs on Exchange servers
    - ':\Windows\System32\sdiagnhost.exe'
    - ':\Windows\system32\ServerManager.exe'
    - ':\Windows\system32\wbem\wmiprvse.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - ':\Windows\System32\wsmprovhost.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  - Image|contains|all:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\pwsh.exe'
  - Image|contains|all:
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    - '\pwsh.exe'
  filter_optional_sqlserver:   # Microsoft SQL Server\130\Tools\
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    Image|contains: '\Microsoft SQL Server\'
    Image|endswith: '\Tools\Binn\SQLPS.exe'
  filter_optional_azure_connected_machine_agent:
        # Azure Connected Machine Agent (https://devblogs.microsoft.com/powershell/azure-policy-guest-configuration-client/)
    Image|startswith: 'C:\Program Files\AzureConnectedMachineAgent\GCArcService'
    Image|endswith: '\GC\gc_worker.exe'
  filter_optional_citrix:
    Image|startswith: 'C:\Program Files\Citrix\'
  filter_optional_exchange:
    Image|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
  filter_main_null:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Programs using PowerShell directly without invocation of a dedicated 
  interpreter.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of named pipes that start with `\PSHost`, indicative of alternate PowerShell hosts. Attackers often utilize this technique to circumvent traditional detection methods that focus on the `powershell.exe` process itself. The likely objective is to execute malicious scripts or commands without being flagged by standard security measures. This behavior correlates with the MITRE ATT&CK tactic ‘Execution’ and technique ‘Command-Line Interface’ (T1059.001).

  The primary telemetry sources are Sysmon logs, specifically Event ID 17 (named pipe created) and Event ID 18 (named pipe connected). If the activity is malicious, it may signal a compromised system where an adversary is attempting to execute code or establish communication with a command and control (C2) server. This detection does NOT confirm that the activity is inherently malicious; legitimate administrative tasks using PowerShell may also trigger it.

  ### Investigation Steps

  - **Check created named pipes and processes**: Review Sysmon Event ID 17 for pipe creation. Look specifically for `PipeName` starting with `\PSHost` and evaluate the associated `Image` field. Search for processes not on the exclusion list (e.g., common PowerShell paths). Malicious indicators include unexpected pipe names or unknown processes.

  - **Validate legitimate PowerShell usage**: Look for cases where `powershell.exe` or `pwsh.exe` is invoked with common administrative commands. Expected behavior might include scripted automation or system diagnostics, especially from systems managed by IT admins.

  - **Identify unusual parent-child relationships**: Analyze Event ID 1 (process creation) in Sysmon to see the parent process of the detected named pipe creation. Look for anomalous parent processes that could indicate process injection or execution from unexpected sources.

  - **Correlate with other telemetry**: Check Windows Security Event ID 4688 for any prior execution of the hosting PowerShell instances, specifically those invoking scripts or commands. A clear sign of malicious intent would be unusual command-line arguments or execution paths leading from unexpected parent processes.

  - **Investigate pipe connections**: Review Sysmon Event ID 18 for connections to the named pipes to assess the traffic. Determine if the connecting process is known or expected. Suspicious connections that originate from untrusted locations or appear to execute unexpected payloads should be flagged for deeper analysis.

  ### Prioritization

  This alert is medium severity due to the potential for significant security implications if an adversary successfully executes malicious commands via an alternate PowerShell host. The likelihood of misuse is moderate, as the technique is increasingly weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the configurations of Sysmon, requiring proper logging for Events ID 17 and 18 to trigger alerts effectively. Legitimate applications or administrative scripts that create named pipes may trigger false positives, potentially obscuring true malicious activity. A related detection to consider is monitoring for any use of `Invoke-WebRequest`, as successful downloads often precede attempts to utilize these alternate hosts.

