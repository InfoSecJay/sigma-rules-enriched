logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|startswith: '\PSHost'
  filter_main_generic:
  - Image|contains:
    - ':\Program Files\PowerShell\7-preview\pwsh.exe'           # Powershell 7
    - ':\Program Files\PowerShell\7\pwsh.exe'           # Powershell 7
    - ':\Windows\system32\dsac.exe'
    - ':\Windows\system32\inetsrv\w3wp.exe'             # this is sad :,( but it triggers FPs on Exchange servers
    - ':\Windows\System32\sdiagnhost.exe'
    - ':\Windows\system32\ServerManager.exe'
    - ':\Windows\system32\wbem\wmiprvse.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - ':\Windows\System32\wsmprovhost.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  - Image|contains|all:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\pwsh.exe'
  - Image|contains|all:
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    - '\pwsh.exe'
  filter_optional_sqlserver:   # Microsoft SQL Server\130\Tools\
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    Image|contains: '\Microsoft SQL Server\'
    Image|endswith: '\Tools\Binn\SQLPS.exe'
  filter_optional_azure_connected_machine_agent:
        # Azure Connected Machine Agent (https://devblogs.microsoft.com/powershell/azure-policy-guest-configuration-client/)
    Image|startswith: 'C:\Program Files\AzureConnectedMachineAgent\GCArcService'
    Image|endswith: '\GC\gc_worker.exe'
  filter_optional_citrix:
    Image|startswith: 'C:\Program Files\Citrix\'
  filter_optional_exchange:
    Image|startswith: 'C:\Program Files\Microsoft\Exchange Server\'
  filter_main_null:
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Programs using PowerShell directly without invocation of a dedicated interpreter.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects instances of PowerShell being executed via alternate hosts that are using named pipes, potentially bypassing traditional detection methods focused on the `powershell.exe` process. The attacker may be attempting to leverage PowerShell's capabilities to execute malicious scripts or payloads using less common invocation methods, increasing the chances of evading detection by security solutions. This behavior aligns with MITRE ATT&CK techniques such as Execution (T1059.001) — specifically targeting PowerShell.

  The primary telemetry source relevant to this detection is Sysmon logging for Named Pipe Events, particularly Event ID 17 (Named Pipe Created) and Event ID 18 (Named Pipe Closed). If the activities are malicious, they may enable attackers to run commands stealthily on a compromised host. However, it's crucial to note that this detection does NOT confirm that malicious activity has occurred on its own; legitimate applications may also utilize similar PowerShell invocation methods.

  ---

  ### Investigation Steps

  - **Review Sysmon logs for Named Pipe Events:** Check Sysmon Event ID 17 and 18 for created pipes starting with `\PSHost` indicating PowerShell execution. Look for processes like `pwsh.exe`, focusing on the command line and parent process to identify the execution context.

  - **Cross-reference legitimate applications:** Verify if the detected processes match known legitimate applications (e.g., SQL Server, Azure agents, Microsoft Exchange). Compare the file paths and hashes against trusted sources or company baseline applications to rule out false positives.

  - **Investigate suspicious parent processes:** Identify the parent process of the PowerShell execution. Investigate if it is running from an uncommon location or has been recently modified, which may indicate exploitation.

  - **Identify high-confidence malicious indicators:** Check for common PowerShell command patterns or specific script executions associated with known malware behaviors (e.g., command manipulation, obfuscated scripts). Pay special attention to unusual execution paths that are out of compliance with standard practices.

  - **Compare against compromised asset profiles:** Understand the asset's role and criticality. Cross-verify how often PowerShell is typically invoked on this host and baseline expected behaviors for power-user accounts or service accounts that might invoke it legitimately.

  - **Assess for exfiltration artifacts:** Check for file creation or transfer events that may accompany PowerShell executions. Look for unusual network activity patterns or external communication, especially with unexpected IP addresses or domains.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of compromise on systems where PowerShell is utilized extensively for automation and administrative tasks. The likelihood of being targeted by malicious actors using alternate methods is significant, as such techniques are commonly weaponized in attacks to evade detection.

  ---

  ### Blind Spots and Assumptions

  This detection may miss certain evasion techniques like direct use of WMI or scripts executed entirely in memory, which do not produce named pipe events. Ensure that Sysmon logging is properly configured; without it, the detection will be ineffective. Legitimate enterprise applications may also cause false positives when executing through PowerShell. A companion detection to consider is monitoring for anomalous outbound network connections that may arise from these PowerShell executions, providing a more comprehensive view of suspicious activity.

