note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes that start with "\PAExec," which is characteristic of the PAExec tool commonly used for remote command execution. The likely attacker objective is to leverage PAExec for lateral movement within a network, allowing them to execute commands on remote machines without requiring standard remote access methods. This behavior fits within the MITRE ATT&CK framework under the Execution tactic, specifically technique T1569.002 (Remote Command Execution).

  The primary telemetry source for this detection comes from Sysmon logs, specifically Event ID 17 (Named Pipe Created) and Event ID 18 (Named Pipe Closed). If malicious, the security impact could include unauthorized execution of commands across networked systems, leading to potential breaches of sensitive data or system integrity. This detection does NOT confirm malicious activity on its own, as legitimate applications may also use named pipes that start with "\PAExec."

  ### Investigation Steps

  - **Check for Sysmon Event IDs 17 and 18:** Review corresponding Sysmon logs for Event ID 17, filtering for PipeName starting with "\PAExec." Observe the UserName and InitiatingProcessID fields for unusual or unexpected accounts running this process.

  - **Validate the Process Executable:** Confirm the parent process associated with the named pipe creation using Event ID 4688 (Process Creation). Ensure the process initiating the named pipe is not commonly benign or system-level tasks, especially ones executed by users without administrative roles.

  - **Assess Network Communication:** Investigate any correlated network activity around the alert time. Check for unusual outbound connections (using logs from firewalls or SIEM data), particularly those leading to unfamiliar IP addresses or command-and-control servers.

  - **Identify Legitimate Usage Patterns:** Compare this alert against baseline behavior in typical network operations. For example, PAExec might be commonly used by IT staff during maintenance tasks. Record the frequency and typical users to help establish normal patterns of behavior.

  - **Look for Other Indicators of Compromise:** Cross-reference with other detections, such as unauthorized changes to Group Policy Objects (GPOs) or unusual authentication attempts. These can often indicate lateral movement tactics are being executed in conjunction with PAExec.

  ### Prioritization

  This alert has medium severity due to the potential for lateral movement and execution of commands across affected systems. Given that tools like PAExec are commonly weaponized by adversaries, this behavior warrants immediate investigation, particularly if seen on sensitive or critical systems.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications or administrative tasks triggering this alert. Accurate detection also relies on Sysmon being properly configured to log named pipe events. Additionally, benign activities, such as IT maintenance or scripted automation using PAExec, can generate similar logs. A related detection to consider is the monitoring of remote desktop connections (T1135), which can enhance visibility into potentially malicious lateral movement attempts through remote command execution tools.

