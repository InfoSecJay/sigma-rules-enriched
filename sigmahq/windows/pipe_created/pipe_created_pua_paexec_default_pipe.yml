note: |
  ### Technical Context
  This detection rule identifies the creation of named pipes by PAExec, a tool often used for remote command execution on Windows systems. Named pipes are a method of inter-process communication that can be exploited by attackers for command and control activities. By detecting the use of PAExec's default named pipe, the rule aims to uncover potential unauthorized or malicious use of the tool, which may be leveraged during lateral movement or to execute arbitrary code in target systems.

  Attackers utilizing PAExec may have objectives such as establishing a foothold in the network, exfiltrating data, or executing further exploits. The detection relates to the MITRE ATT&CK framework, specifically under the tactics of Execution and Persistence. The relevant techniques include T1569.002 (Remote Services: Windows Management Instrumentation) which encompasses the use of remote tools, potentially indicating malicious activity.

  The primary data sources necessary for effective detection include Sysmon logs configured to capture named pipe events (Event ID 17 and Event ID 18). It is crucial that logging is appropriately set up to detect these events, as they provide visibility into processes attempting to create named pipes and their associated activities.

  ### Investigation Steps
  - **Review Named Pipe Events:** Look for Sysmon Event ID 17 and Event ID 18 logs indicating the creation of named pipes, specifically those starting with '\PAExec'. Analyze the timestamp, source process, and any associated network connections.

  - **Correlate with Process Creation Logs:** Examine process creation events to identify any instances where PAExec is being invoked. Pay attention to parent-child relationships that may indicate how the command was initiated.

  - **Inspect Lateral Movement Patterns:** Investigate any lateral movement indications by checking for commands executed on remote machines using PAExec. Look for unusual account activity or administrative commands executed in short succession.

  - **Assess User Behavior:** Analyze user account activity to identify any anomalies, such as privileged accounts executing PAExec without a clear business justification. Determine if there are any patterns consistent with compromise.

  ### Prioritization
  This alert is rated medium severity because unauthorized use of remote execution tools like PAExec can indicate serious security incidents, potentially leading to data breaches or system compromises. The likelihood is moderate given the prevalence of such tools in both legitimate admin actions and malicious exploitation.

  ### Blind Spots and Assumptions
  This detection may miss instances where named pipe logging is not enabled or configured incorrectly, leading to gaps in coverage. The logic assumes that any named pipe prefixed with '\PAExec' is necessarily malicious, which may not always be the case if legitimate administrative tasks use this tool. Ensuring comprehensive logging and proper configurations are critical for the alert to function correctly, as any absence may result in both false negatives and misinterpretation of legitimate activity.

