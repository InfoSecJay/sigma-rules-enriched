logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|contains:
    - '\cachedump'
    - '\lsadump'
    - '\wceservicepipe'
  condition: selection
falsepositives:
- Legitimate Administrator using tool for password recovery
level: critical
note: |
  ### Technical Context

  This rule detects the creation of specific named pipes associated with well-known credential dumping tools, such as `\cachedump`, `\lsadump`, and `\wceservicepipe`. These behaviors typically indicate an attacker's attempt to extract sensitive credential information from a system. The likely attacker objective is to gain further access to resources by leveraging stolen credentials. This behavior aligns with the MITRE ATT&CK tactics of Credential Access (TA0006) and relevant techniques, specifically Credential Dumping (T1003.001, T1003.002, T1003.004, T1003.005).

  The primary telemetry sources required for this detection are Windows Sysmon logs, specifically Event IDs 17 (named pipe created) and 18 (named pipe deleted). If malicious, the security impact can be severe, potentially leading to unauthorized access to accounts and sensitive data exfiltration. It is important to note that this detection does not confirm successful credential dumping on its own; it indicates potential malicious activity that requires further investigation.

  ### Investigation Steps

  - **Check for relevant Sysmon logs:** Query for Sysmon Event IDs 17 and 18 within the timeframe of the alert (e.g., `Event ID: 17`, `EventMessage: "Created Named Pipe"`). Focus on pipes named `\cachedump`, `\lsadump`, or `\wceservicepipe`.

  - **Analyze the parent process:** Identify the parent process associated with the named pipe creation. Look for suspicious process creation events, especially from known executable files associated with credential dumping tools (e.g., Mimikatz).

  - **Validate against expected behavior:** Review the context of the alert by checking for legitimate uses of similar names (e.g., legitimate administrative actions) via process logs. Tools like password recovery software may generate similar names but are typically uncommon in standard enterprise environments.

  - **Correlate with user activity:** Investigate relevant user activity within Event ID 4672 (Special privileges assigned to new logon) and verify if the user accounts involved in the alert have a history of legitimate administrative roles.

  - **Access recent system modifications:** Review the Windows Security Event logs for any recent changes related to credential management, such as Event ID 4663 indicating attempts to access objects with privileges. This can show whether suspicious actions coincided with the alert.

  - **Look for exfiltration attempts:** Check for any post-event network traffic using tools like Wireshark or firewalls logs to identify unusual outbound connections related to the times of named pipe activities.

  ### Prioritization

  This alert is classified as critical due to the high impact potential of credential dumping on sensitive systems. The likelihood of malicious abuse is significant, as credential dumping is a commonly weaponized technique among adversaries, often forming a critical part of their attack strategy.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through custom named pipes that do not conform to known patterns or legitimate uses of credential dumping tools by administrators for recovery purposes. Effective detection requires Sysmon configured correctly to log named pipe events, and absence of these logs can lead to missed alerts. Common legitimate activities might include administrative tasks involving user account management. To strengthen coverage, consider monitoring for related events such as abnormal process creations or AWS CloudTrail logs related to IAM actions.

