logsource:
  product: windows
  category: pipe_created
  definition: 'Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575'
detection:
  selection:
    PipeName|contains:
    - '\cachedump'
    - '\lsadump'
    - '\wceservicepipe'
  condition: selection
falsepositives:
- Legitimate Administrator using tool for password recovery
level: critical
note: |
  ### Technical Context
  This detection rule identifies the creation of named pipes associated with well-known credential dumping tools on Windows systems. Credential dumping is a technique used by attackers to extract stored credentials from a system's memory or local storage, thereby allowing them to gain unauthorized access to sensitive systems or information. The creation of named pipes, in this case, suggests that an attacker may be utilizing tools like Mimikatz or other variants to perform this action silently.

  The attacker’s likely objective is to harvest credentials for lateral movement within the network or to escalate privileges. Credential dumping directly supports various phases of an attack lifecycle, such as credential access and initial access, making this behavior critical to identify. Relevant MITRE ATT&CK techniques include T1003.001 (Credential Dumping: LSASS Memory), T1003.002 (Credential Dumping: Security Account Manager), T1003.004 (Credential Dumping: DCOM), and T1003.005 (Credential Dumping: Credentials from Web Browsers).

  The primary data source for detecting this activity is Windows Sysmon logs specifically capturing named pipe creation events (Event IDs 17 and 18). To effectively utilize this detection, Sysmon must be configured correctly to ensure all relevant logs are collected.

  ### Investigation Steps
  - **Review Sysmon Logs**: Check the Sysmon logs for Event ID 17 and 18 to investigate named pipe creation events. Filter for specific pipe names indicating possible credential dumping activities, such as `\cachedump`, `\lsadump`, or `\wceservicepipe`.

  - **Analyze Process Creation Events**: Correlate any identified named pipe creation events with process creation logs to identify any suspicious processes that may have created these pipes. Look for known credential dumping tools like Mimikatz or others in the command line arguments.

  - **Check User Accounts**: Review the user context under which the named pipes were created to determine if a legitimate user or a potentially malicious actor initiated the process. Look out for anomalous account activity.

  - **Investigate Network Traffic**: Examine network logs for any connections or activity related to the identified named pipes. This may include unusual outbound traffic corresponding to times when credential dumping tools are suspected to have executed.

  ### Prioritization
  This alert is of **critical** severity due to the high impact of potential credential theft and lateral movement opportunities it presents to attackers within an enterprise environment. Credential dumping is often a precursor to further attacks and accounts for a significant risk to overall security posture.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Sysmon is not configured to capture named pipe events, leading to potential missed detections of legitimate attacks. The detection logic assumes that the presence of specific pipe names indicates malicious intent, which could result in false positives from legitimate administrative activities. Robust logging configurations are necessary to ensure that all relevant named pipe events are captured and that the associated security event logging is enabled for accurate and timely detection.

