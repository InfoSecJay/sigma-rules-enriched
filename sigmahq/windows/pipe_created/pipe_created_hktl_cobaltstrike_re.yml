detection:
  selection:
  - PipeName|re: '\\mojo\.5688\.8052\.(?:183894939787088877|35780273329370473)[0-9a-f]{2}'
  - PipeName|re: '\\wkssvc_?[0-9a-f]{2}'
  - PipeName|re: '\\ntsvcs[0-9a-f]{2}'
  - PipeName|re: '\\DserNamePipe[0-9a-f]{2}'
  - PipeName|re: '\\SearchTextHarvester[0-9a-f]{2}'
  - PipeName|re: '\\mypipe-(?:f|h)[0-9a-f]{2}'
  - PipeName|re: '\\windows\.update\.manager[0-9a-f]{2,3}'
  - PipeName|re: '\\ntsvcs_[0-9a-f]{2}'
  - PipeName|re: '\\scerpc_?[0-9a-f]{2}'
  - PipeName|re: '\\PGMessagePipe[0-9a-f]{2}'
  - PipeName|re: '\\MsFteWds[0-9a-f]{2}'
  - PipeName|re: '\\f4c3[0-9a-f]{2}'
  - PipeName|re: '\\fullduplex_[0-9a-f]{2}'
  - PipeName|re: '\\msrpc_[0-9a-f]{4}'
  - PipeName|re: '\\win\\msrpc_[0-9a-f]{2}'
  - PipeName|re: '\\f53f[0-9a-f]{2}'
  - PipeName|re: '\\rpc_[0-9a-f]{2}'
  - PipeName|re: '\\spoolss_[0-9a-f]{2}'
  - PipeName|re: '\\Winsock2\\CatalogChangeListener-[0-9a-f]{3}-0,'
  condition: selection
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  The rule detects the creation of named pipes that match specific patterns commonly associated with Cobalt Strike's Malleable C2 profiles. These patterns may indicate efforts by attackers to establish covert communication channels for command and control or other malicious purposes. The primary MITRE ATT&CK technique relevant here is T1055 (Process Injection), utilized by adversaries to inject malicious code into legitimate processes.

  The primary telemetry source for this detection is Sysmon's Named Pipe Event logs (Event ID 17 for creation and Event ID 18 for deletion). If an alert is triggered, the presence of these specific named pipes may signal abnormally elevated privilege escalation attempts or stealthy operations that compromise the integrity of the affected systems. However, it's crucial to clarify that detection of these named pipes alone does not automatically indicate malicious activity; further context is required to confirm the intent.

  ### Investigation Steps

  - **Verify Sysmon configuration for logging:** Ensure Sysmon is properly configured to capture Named Pipe Events (Event ID 17 and 18). This is critical as the rule relies on accurate logging to detect potentially malicious activity.

  - **Examine the named pipe creation events:** Check Sysmon logs for Event ID 17 that show the creation of pipes matching the detection patterns (e.g., `\\mojo\.5688\.8052\.`). Compare them against known Cobalt Strike profiles from resources like the provided Medium article.

  - **Assess associated processes:** Investigate the parent process of the event by examining Sysmon Event ID 1 (Process Create). Look for known malicious executables or PowerShell scripts responsible for invoking these named pipes to identify high-confidence malicious indicators.

  - **Identify legitimate usage patterns:** Review typical application logs that may legitimately create named pipes, such as service installations. Systems with legitimate software, like Windows services, may show expected behavior around named pipes that do not match the identified patterns in the rule.

  - **Map affected systems for criticality:** Confirm the role of the host where the event originated. High-value assets (e.g., domain controllers) warrant immediate escalation due to increased impact potential.

  - **Evaluate network communications diagrams:** Cross-reference any outgoing connections from the identified processes. Exfiltration or unusual outbound traffic associated with the detected process may indicate a compromised system.

  ### Prioritization

  This alert is of critical severity given that it could indicate an adversary operating undetected within the network, particularly if it involves high-value targets. The likelihood of malicious abuse is significant, as Cobalt Strike is a commonly used tool by attackers for establishing persistent command and control infrastructures.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of Sysmon’s configuration; without proper logging, relevant events may go unnoticed. Evasion techniques could include altering the named pipe patterns to avoid detection. Legitimate activities could also inadvertently trigger this alert, particularly custom applications that utilize named pipes. Another detection rule for process injection techniques (e.g., T1055) could enhance overall coverage against related threats.

