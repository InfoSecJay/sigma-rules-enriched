detection:
  selection:
  - PipeName|re: '\\mojo\.5688\.8052\.(?:183894939787088877|35780273329370473)[0-9a-f]{2}'
  - PipeName|re: '\\wkssvc_?[0-9a-f]{2}'
  - PipeName|re: '\\ntsvcs[0-9a-f]{2}'
  - PipeName|re: '\\DserNamePipe[0-9a-f]{2}'
  - PipeName|re: '\\SearchTextHarvester[0-9a-f]{2}'
  - PipeName|re: '\\mypipe-(?:f|h)[0-9a-f]{2}'
  - PipeName|re: '\\windows\.update\.manager[0-9a-f]{2,3}'
  - PipeName|re: '\\ntsvcs_[0-9a-f]{2}'
  - PipeName|re: '\\scerpc_?[0-9a-f]{2}'
  - PipeName|re: '\\PGMessagePipe[0-9a-f]{2}'
  - PipeName|re: '\\MsFteWds[0-9a-f]{2}'
  - PipeName|re: '\\f4c3[0-9a-f]{2}'
  - PipeName|re: '\\fullduplex_[0-9a-f]{2}'
  - PipeName|re: '\\msrpc_[0-9a-f]{4}'
  - PipeName|re: '\\win\\msrpc_[0-9a-f]{2}'
  - PipeName|re: '\\f53f[0-9a-f]{2}$'        # https://docs.limacharlie.io/3-detection-response/unit-tests/#example
  - PipeName|re: '\\rpc_[0-9a-f]{2}'
  - PipeName|re: '\\spoolss_[0-9a-f]{2}'
  - PipeName|re: '\\Winsock2\\CatalogChangeListener-[0-9a-f]{3}-0,'
  condition: selection
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes that match patterns typically associated with the Cobalt Strike framework, specifically its Malleable Command and Control (C2) profiles. The primary objective for the attacker is to establish a covert communication channel for command execution or exfiltration of data. This activity aligns with the MITRE ATT&CK tactic **Command and Control** (ID: T1055), specifically leveraging named pipes as a technique for maintaining persistence and communication.

  The primary telemetry source for this detection is Sysmon, specifically Event ID 17 and Event ID 18, which log named pipe creation events. If malicious, such behavior could result in unauthorized code execution or data exfiltration. Importantly, this detection does NOT confirm active malicious activity on its own; it requires context from additional telemetry to ascertain intent.

  ### Investigation Steps

  - **Review Sysmon Event Logs for Named Pipes:** Check Sysmon Event ID 17 for creation events. Look for PipeName matching the regex patterns specified in the Sigma rule. Verify any unusual pipe names created, particularly those following "mojo" or "DserNamePipe."

  - **Validate the Service Context of the Creation:** Examine the associated Event ID 21 (Process Connect) in Sysmon to determine which process created the named pipe. Common benign processes that may create named pipes include `svchost.exe`. Check for unusual parent-child process relationships that could indicate malicious behavior.

  - **Identify Process Command Lines:** For the processes that created the named pipes (based on Event ID 17), gather command line arguments from Sysmon Event ID 4697. Look for obfuscation or unusual parameters that indicate potential exploitation or lateral movement.

  - **Correlate with Network Activity:** If named pipes are found, review network logs for any associated outbound or suspicious internal connections. Events such as those logged by the Windows Filtering Platform or firewall rules can illuminate potential lateral movement or command and control traffic.

  - **Contextualize with User Activity:** Review user activity logs (e.g., Event IDs 4624 and 4634) during the time of the named pipe creation. Establish a timeline to assess whether actions taken align with legitimate administrative tasks or if they appear unauthorized.

  - **Examine Known Legitimacy for the Environment:** Benchmark the pipe creation against known legitimate applications or scripts used within your organization. Identifying typical patterns can assist in ruling out false positives and sharpening focus on anomalous entries.

  ### Prioritization

  Given that the behavior detected targets named pipes commonly used for command and control, the alert severity is critical. The potential exploitation of these pipes poses a significant risk, as attackers frequently leverage this technique for persistence and lateral movement within networks. Furthermore, the covert nature of named pipe communication increases the likelihood of malicious activity.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques where attackers may use generic named pipes, thereby reducing the effectiveness of regex-based detection. Additionally, Sysmon must be properly configured to capture named pipe events (Event IDs 17 and 18); missing this data may lead to undetected malicious actions. Legitimate activities, such as interaction with Windows services, may inadvertently trigger the alert. A companion detection to consider is monitoring for API calls associated with named pipes, which provides further insights into process interactions.

