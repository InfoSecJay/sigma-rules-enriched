detection:
  selection:
  - PipeName|re: '\\mojo\.5688\.8052\.(?:183894939787088877|35780273329370473)[0-9a-f]{2}'
  - PipeName|re: '\\wkssvc_?[0-9a-f]{2}'
  - PipeName|re: '\\ntsvcs[0-9a-f]{2}'
  - PipeName|re: '\\DserNamePipe[0-9a-f]{2}'
  - PipeName|re: '\\SearchTextHarvester[0-9a-f]{2}'
  - PipeName|re: '\\mypipe-(?:f|h)[0-9a-f]{2}'
  - PipeName|re: '\\windows\.update\.manager[0-9a-f]{2,3}'
  - PipeName|re: '\\ntsvcs_[0-9a-f]{2}'
  - PipeName|re: '\\scerpc_?[0-9a-f]{2}'
  - PipeName|re: '\\PGMessagePipe[0-9a-f]{2}'
  - PipeName|re: '\\MsFteWds[0-9a-f]{2}'
  - PipeName|re: '\\f4c3[0-9a-f]{2}'
  - PipeName|re: '\\fullduplex_[0-9a-f]{2}'
  - PipeName|re: '\\msrpc_[0-9a-f]{4}'
  - PipeName|re: '\\win\\msrpc_[0-9a-f]{2}'
  - PipeName|re: '\\f53f[0-9a-f]{2}'
  - PipeName|re: '\\rpc_[0-9a-f]{2}'
  - PipeName|re: '\\spoolss_[0-9a-f]{2}'
  - PipeName|re: '\\Winsock2\\CatalogChangeListener-[0-9a-f]{3}-0,'
  condition: selection
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This rule detects the creation of named pipes that match specific regex patterns associated with Cobalt Strike's Malleable Command and Control (C2) profiles. Named pipes are inter-process communication mechanisms in Windows that can be exploited for malicious activities, particularly in the context of establishing covert channels for communication during attacks. Attackers using Cobalt Strike may leverage these patterns to avoid detection and maintain persistence within a compromised environment.

  The likely threat scenario involves an attacker using Cobalt Strike to control compromised machines, leveraging named pipes for data exfiltration or command execution. Targets may include sensitive data repositories or administration tools, with objectives such as lateral movement, privilege escalation, or reconnaissance within the environment. Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (TA0005)**: Utilizing named pipes to evade detection by traditional security measures.
  - **Privilege Escalation (TA0004)**: Gaining elevated access through improper permissions associated with named pipes.
  - **Communication through Named Pipes (T1055)**: Using named pipes as a method to establish contact without raising alarms.

  Primary data sources to monitor for this detection include Windows named pipe event logs, which can be captured using Sysmon’s logging capabilities, specifically Event ID 17 (Pipe Created) and Event ID 18 (Pipe Deleted).

  ### Investigation Steps
  - **Review Named Pipe Logs**: Collect and analyze Sysmon logs that capture named pipe creation events (Event ID 17), specifically looking for entries that match the specified regex patterns.
  - **Correlate with Process Activity**: Investigate related process creation events around the same timestamp to identify any potentially malicious processes that could be creating these named pipes.
  - **Check Network Connections**: Analyze the network behavior and connections initiated by the processes that created named pipes to identify any outbound connections to known malicious IP addresses or unusual ports.
  - **Consult Security Playbooks**: Leverage existing incident response playbooks for Cobalt Strike or similar threats to determine the proper response steps, including potential containment efforts and further asset analysis.

  ### Prioritization
  This alert is classified as critical due to the high impact and likelihood of sophisticated adversaries using Cobalt Strike for post-exploitation activities, making it imperative to respond promptly to mitigate risks to the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection if named pipe logging is not enabled or properly configured within Sysmon, as certain configurations may miss relevant events. The detection logic assumes that the specified regex patterns will accurately capture legitimate threats without generating excessive false positives. Additionally, continuous monitoring must occur to ensure the appropriate logs are retained for incident investigations; otherwise, valuable context may be lost.

