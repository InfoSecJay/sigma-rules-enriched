detection:
  selection:
  - PipeName|re: '\\mojo\.5688\.8052\.(?:183894939787088877|35780273329370473)[0-9a-f]{2}'
  - PipeName|re: '\\wkssvc_?[0-9a-f]{2}'
  - PipeName|re: '\\ntsvcs[0-9a-f]{2}'
  - PipeName|re: '\\DserNamePipe[0-9a-f]{2}'
  - PipeName|re: '\\SearchTextHarvester[0-9a-f]{2}'
  - PipeName|re: '\\mypipe-(?:f|h)[0-9a-f]{2}'
  - PipeName|re: '\\windows\.update\.manager[0-9a-f]{2,3}'
  - PipeName|re: '\\ntsvcs_[0-9a-f]{2}'
  - PipeName|re: '\\scerpc_?[0-9a-f]{2}'
  - PipeName|re: '\\PGMessagePipe[0-9a-f]{2}'
  - PipeName|re: '\\MsFteWds[0-9a-f]{2}'
  - PipeName|re: '\\f4c3[0-9a-f]{2}'
  - PipeName|re: '\\fullduplex_[0-9a-f]{2}'
  - PipeName|re: '\\msrpc_[0-9a-f]{4}'
  - PipeName|re: '\\win\\msrpc_[0-9a-f]{2}'
  - PipeName|re: '\\f53f[0-9a-f]{2}'
  - PipeName|re: '\\rpc_[0-9a-f]{2}'
  - PipeName|re: '\\spoolss_[0-9a-f]{2}'
  - PipeName|re: '\\Winsock2\\CatalogChangeListener-[0-9a-f]{3}-0,'
  condition: selection
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This rule detects the creation of named pipes that match specific patterns commonly used by Cobalt Strike's Malleable C2 profiles. The likely attacker objective is to establish covert communications for command and control (C2) operations, often as a precursor to data exfiltration or further exploitation of compromised systems. This behavior aligns with the MITRE ATT&CK techniques T1055 (Process Injection) and T1563 (Remote Services – Application Layer Protocol).

  The primary telemetry sources required for detection include Sysmon logs, specifically Event ID 17 (named pipe created) and Event ID 18 (named pipe connected). If this behavior is malicious, it could result in compromised credentials, unauthorized access to critical data, and significant disruption to business operations. However, detection of these named pipe patterns alone does NOT confirm malicious activity without supplementary context such as process details, user activities, and overall system behavior.

  ### Investigation Steps

  - **Check Sysmon Event IDs 17 & 18**: Retrieve Sysmon logs for Event ID 17 (named pipe created) and Event ID 18 (named pipe connected). Look for any pipe names that match the regex patterns defined in the Sigma rule. High-confidence malicious indicators include named pipes like `\\mojo.5688.8052` or `\\DserNamePipe[0-9a-f]{2}`.

  - **Identify associated processes**: Cross-reference the Sysmon logs with the process ID (PID) from Event ID 17 to identify the parent process that created the named pipe. Pay attention to any processes known to be associated with Cobalt Strike, such as `powershell.exe` or any unusual binary executables.

  - **Verify legitimate usage**: Assess whether the creation of the named pipe is associated with expected application behavior. For example, legitimate services like Microsoft Update may create named pipes, but they will typically not match the signature patterns seen in Cobalt Strike. Document any expected behaviors based on known application roles (e.g., SQL server activities).

  - **Review user context**: Analyze the user context under which the named pipe was created. If the creation correlates with non-administrative users spawning processes that create these named pipes, this is suspicious. Check for abnormal execution paths from the user’s Account Name field in the logs.

  - **Check for previous instances**: Investigate historical logs for repeat occurrences of similar named pipes being created on the same system. This could signify ongoing malicious activity or persistence mechanisms in place.

  - **Correlate with network activity**: If available, analyze network logs for correlating traffic to known Cobalt Strike servers or suspicious remote connections from the same endpoint shortly after the named pipe creation. Look for unusual outbound connections or connections to non-standard ports.

  ### Prioritization

  This alert is deemed critical due to the potential impact on sensitive data and system integrity if the named pipe activity is indeed malicious. The likelihood of malicious abuse is significant, given Cobalt Strike is a widely used tool by adversaries for establishing control in compromised environments. Furthermore, the specific patterns identified are indicative of weaponized behavior.

  ### Blind Spots and Assumptions

  Named pipe activity may occur due to legitimate applications or internal services that are not accounted for in the current detection strategy, potentially leading to false positives. To ensure reliable detection, Sysmon must be correctly configured to log named pipe events (Event ID 17 and 18). Regular application behaviors might inadvertently trigger these alerts, such as legitimate updates or administrative tasks. As a companion detection, correlate named pipe events with process injection attempts (T1055) to enhance context around detected behaviors.

