note: |
  ### Technical Context

  This rule detects the creation of a default named pipe associated with the DiagTrackEoP proof of concept, which exploits the "SeImpersonate" privilege for privilege escalation attacks. The likely attacker objective is to gain elevated access to the system and potentially execute malicious activities with higher privileges. This behavior fits within the MITRE ATT&CK framework under the "Privilege Escalation" tactic (T1068).

  Primary telemetry sources for this detection are Windows Sysmon logs, specifically Event ID 17 (Named Pipe Created) and Event ID 18 (Named Pipe Connected). If malicious, this behavior could significantly compromise the security posture of the affected system by enabling unauthorized access. However, this detection alone does not confirm an active intrusion; it indicates the presence of a named pipe creation event, which could also potentially stem from benign applications if further analyzed.

  ### Investigation Steps

  - **Review named pipe creation events:** Check Sysmon Event ID 17 for logs that have `PipeName` containing 'thisispipe'. This event should show the creation of the named pipe, confirming if the alert is triggered.

  - **Analyze connected processes:** Investigate related Sysmon Event ID 18 to identify which process is connecting to the named pipe. Validate if the process is known and legitimate (e.g., Windows services or trusted applications).

  - **Correlate with user access logs:** Review Security Event ID 4672 (Special Logon) for any recent logins or privilege assignments that match the timespan of the named pipe creation. Look for suspicious, non-administrative accounts gaining elevated permissions.

  - **Identify legitimate usage scenarios:** Document any known legitimate applications that may use similar named pipe conventions, and observe if their behavior aligns with expected patterns. For example, Windows Update or monitoring services might implement similar pipe usage.

  - **Validate with threat intelligence:** Cross-check the process and event information against threat intelligence sources to determine if the specific tool or technique has been reported in the wild. This step helps ascertain the likelihood of the event being malicious.

  ### Prioritization

  This alert is classified as critical due to its association with a proven privilege escalation technique. The likelihood of malicious abuse is significant, as the named pipe functionality is often weaponized in attacks to gain unauthorized access. The elevated risk to enterprise systems necessitates prompt investigation.

  ### Blind Spots and Assumptions

  Limitations include potential evasion by legitimate applications that might utilize similarly named pipes, as well as the need for correctly configured Sysmon logs to capture relevant events. Log sources must be correctly set up to monitor named pipe events consistently. Legitimate admin tools or enterprise applications may trigger this alert, requiring careful correlation against known baselines. A related detection that strengthens coverage could include monitoring for instances of abnormal privilege escalation or instances where users log in with elevated privileges without a known reason.

