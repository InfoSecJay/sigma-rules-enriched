title: Potential Defense Evasion Via Raw Disk Access By Uncommon Tools
id: db809f10-56ce-4420-8c86-d6a7d793c79c
status: test
description: Detects raw disk access using uncommon tools or tools that are 
  located in suspicious locations (heavy filtering is required), which could 
  indicate possible defense evasion attempts
references:
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
author: Teymur Kheirkhabarov, oscd.community
date: 2019-10-22
modified: 2025-12-03
tags:
- attack.stealth
- attack.t1006
logsource:
  product: windows
  category: raw_access_thread
detection:
  filter_main_floppy:
    Device|contains: floppy
  filter_main_generic:
    Image|startswith:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\CCM\'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\servicing\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SystemApps\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\uus\'
    - 'C:\Windows\WinSxS\'
  filter_main_system_images:
    Image:
    - 'Registry'
    - 'System'
  filter_main_windefender:
    Image|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    Image|endswith:
    - '\MsMpEng.exe'
    - '\MpDefenderCoreService.exe'
  filter_main_microsoft_appdata:
    Image|startswith: 'C:\Users\'
    Image|contains|all:
    - '\AppData\'
    - '\Microsoft\'
  filter_main_ssd_nvme:
    Image|startswith: 'C:\Windows\Temp\'
    Image|endswith:
    - '\Executables\SSDUpdate.exe'
    - '\HostMetadata\NVMEHostmetadata.exe'
  filter_main_null:
    Image:
  filter_main_systemsettings:
    Image: 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  filter_main_update:
    Image|startswith: 'C:\$WinREAgent\Scratch\'
  filter_optional_github_desktop:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\GitHubDesktop\app-'
    Image|endswith: '\resources\app\git\mingw64\bin\git.exe'
  filter_optional_nextron:
    Image|startswith: 'C:\Windows\Temp\asgard2-agent\'
    Image|endswith: '\thor.exe'
  filter_optional_Keybase:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Keybase\upd.exe'
  condition: not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely
level: low
note: |
  ### Technical Context

  This Sigma rule detects attempts at raw disk access utilizing uncommon tools or applications located in suspicious directories, which may indicate potential defense evasion by an adversary. The likely attacker objective is to manipulate or extract data from the disk, bypassing standard logging or security mechanisms. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (ID: T1006). Primary telemetry sources include Windows raw access threads, particularly focusing on process creation and access patterns to disks. A security impact could involve unauthorized data access or manipulation, leading to compromised systems. However, this detection alone does not confirm malicious intent; legitimate applications might trigger similar raw access behaviors.

  ### Investigation Steps

  - **Examine Process Creation Events:** Check for raw disk access using Sysmon Event ID 1 (Process Creation) and Security Event ID 4688. Look for processes that are not part of normal system operations, particularly those that deviate from established baselines (e.g., unknown executables in System32).

  - **Verify File Locations:** Investigate the parent paths of detected processes, focusing on any that originate from directories like `C:\Windows\Temp\` or `C:\Users\...`. Legitimate activities typically generate traffic from established applications, not from suspicious directories.

  - **Identify High-Confidence Malicious Indicators:** Look for processes that fall under the filters for uncommon tools (e.g., `C:\Windows\Temp\asgard2-agent\thor.exe`). These are not typical system processes and could indicate malicious activity.

  - **Review Disk Access Patterns:** Analyze raw access event logs to understand the nature of the operations performed (e.g., read/write counts, affected sectors). Frequent or unusual access patterns could indicate exploitation attempts.

  - **Correlate with Other Security Events:** Cross-reference the raw disk access with other security logs (e.g., MDM installations or firmware updates). Normal maintenance activities should not coincide with irregular raw access patterns.

  ### Prioritization

  Given the potential impact on system integrity and data confidentiality, this alert should be treated with moderate urgency. While uncommon tools are less frequently employed in attacks, the severity of potentially unauthorized data manipulation warrants careful investigation. This behavior could be weaponized, especially if associated with known exploits or malware.

  ### Blind Spots and Assumptions

  The detection may be evaded by using legitimate tools or processes with similar file paths, leading to potential false positives. Reliable detection requires comprehensive logging configurations, particularly with Sysmon and Windows Event logs to capture all necessary telemetry. Legitimate activities such as system updates or maintenance tasks could trigger similar alerts, complicating interpretation. Companion detections include monitoring for abnormal process creation activities that could accompany raw disk access events.

