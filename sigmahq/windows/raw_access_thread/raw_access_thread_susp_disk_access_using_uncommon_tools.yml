title: Potential Defense Evasion Via Raw Disk Access By Uncommon Tools
id: db809f10-56ce-4420-8c86-d6a7d793c79c
status: test
description: Detects raw disk access using uncommon tools or tools that are located
  in suspicious locations (heavy filtering is required), which could indicate possible
  defense evasion attempts
references:
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
author: Teymur Kheirkhabarov, oscd.community
date: 2019-10-22
modified: 2025-12-03
tags:
- attack.defense-evasion
- attack.t1006
logsource:
  product: windows
  category: raw_access_thread
detection:
  filter_main_floppy:
    Device|contains: floppy
  filter_main_generic:
    Image|startswith:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\CCM\'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\servicing\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SystemApps\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\uus\'
    - 'C:\Windows\WinSxS\'
  filter_main_system_images:
    Image:
    - 'Registry'
    - 'System'
  filter_main_windefender:
    Image|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    Image|endswith:
    - '\MsMpEng.exe'
    - '\MpDefenderCoreService.exe'
  filter_main_microsoft_appdata:
    Image|startswith: 'C:\Users\'
    Image|contains|all:
    - '\AppData\'
    - '\Microsoft\'
  filter_main_ssd_nvme:
    Image|startswith: 'C:\Windows\Temp\'
    Image|endswith:
    - '\Executables\SSDUpdate.exe'
    - '\HostMetadata\NVMEHostmetadata.exe'
  filter_main_null:
    Image:
  filter_main_systemsettings:
    Image: 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  filter_main_update:
    Image|startswith: 'C:\$WinREAgent\Scratch\'
  filter_optional_github_desktop:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\GitHubDesktop\app-'
    Image|endswith: '\resources\app\git\mingw64\bin\git.exe'
  filter_optional_nextron:
    Image|startswith: 'C:\Windows\Temp\asgard2-agent\'
    Image|endswith: '\thor.exe'
  filter_optional_Keybase:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Keybase\upd.exe'
  condition: not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely
level: low
note: |
  ### Technical Context
  This detection rule identifies instances of raw disk access performed by uncommon tools or tools situated in suspicious directories on Windows systems. Such behavior may suggest attempts at defense evasion by adversaries, particularly those seeking to manipulate or bypass standard security measures. These tools may include less recognized applications or scripts that can manipulate disk content, potentially allowing attackers to conceal malicious activity or exfiltrate sensitive information.

  The threat scenario revolves around an attacker using raw disk access methods to covertly read or write to the disk outside traditional operating system controls. Such actions aim to evade detection by security mechanisms such as antivirus programs and file integrity monitoring systems. The relevant MITRE ATT&CK techniques include **T1006: BitLocker Brute Force** and **TA0042: Defense Evasion**, as raw disk access is often intended to evade detection and manipulate crucial data on the compromised host.

  Primary data sources for this detection include:
  - Raw access thread logs that capture instances of disk access at a low-level,
  - Process creation logs that can reveal the execution of uncommon or suspicious applications,
  - Windows Event Logs, particularly security logs, which might indicate unusual access to sensitive areas of the file system.

  ### Investigation Steps
  - **Review Raw Access Logs**: Investigate raw access thread logs for any entries indicating access attempts by uncommon tools or those associated with suspicious directories.

  - **Analyze Process Creation Events**: Check process creation logs for instances of unusual applications engaging in disk access. Look for tools not commonly found in standard environments, especially those originating from temporary directories.

  - **Examine Windows Event Logs**: Correlate findings with Windows Event Logs to verify if there are any failed login attempts or abnormal access patterns that coincide with the timestamps of the detected disk access behavior.

  - **Cross-Reference Known Tools**: Cross-check identified tools against threat intelligence feeds or APIM (Application Program Interface Management) systems to assess their legitimacy and any known associations with adversarial activity.

  ### Prioritization
  The alert should be treated with medium priority due to the potential impact of successful defense evasion techniques on system integrity, data confidentiality, and overall network security. While the likelihood of malicious activity occurring via these means may vary, the presence of unusual tools warrants immediate investigation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include the inability to identify specially crafted tools that may not trigger the defined filters or rare usage of legitimate tools in a manner that mimics malicious behavior. The detection logic assumes that any process executing raw disk access not covered by the included filters is suspicious; however, this may lead to false positives from benign applications. Comprehensive logging of all process executions and raw access attempts is required for accurate detection, and any configurations excluding relevant logs might result in missed detections.

