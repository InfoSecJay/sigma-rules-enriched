title: Potential Defense Evasion Via Raw Disk Access By Uncommon Tools
id: db809f10-56ce-4420-8c86-d6a7d793c79c
status: test
description: Detects raw disk access using uncommon tools or tools that are 
  located in suspicious locations (heavy filtering is required), which could 
  indicate possible defense evasion attempts
references:
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
author: Teymur Kheirkhabarov, oscd.community
date: 2019-10-22
modified: 2025-12-03
tags:
- attack.defense-evasion
- attack.t1006
logsource:
  product: windows
  category: raw_access_thread
detection:
  filter_main_floppy:
    Device|contains: floppy
  filter_main_generic:
    Image|startswith:
    - 'C:\$WINDOWS.~BT\'
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\CCM\'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\servicing\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SystemApps\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\uus\'
    - 'C:\Windows\WinSxS\'
  filter_main_system_images:
    Image:
    - 'Registry'
    - 'System'
  filter_main_windefender:
    Image|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    Image|endswith:
    - '\MsMpEng.exe'
    - '\MpDefenderCoreService.exe'
  filter_main_microsoft_appdata:
    Image|startswith: 'C:\Users\'
    Image|contains|all:
    - '\AppData\'
    - '\Microsoft\'
  filter_main_ssd_nvme:
    Image|startswith: 'C:\Windows\Temp\'
    Image|endswith:
    - '\Executables\SSDUpdate.exe'
    - '\HostMetadata\NVMEHostmetadata.exe'
  filter_main_null:
    Image:
  filter_main_systemsettings:
    Image: 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
  filter_main_update:
    Image|startswith: 'C:\$WinREAgent\Scratch\'
  filter_optional_github_desktop:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\GitHubDesktop\app-'
    Image|endswith: '\resources\app\git\mingw64\bin\git.exe'
  filter_optional_nextron:
    Image|startswith: 'C:\Windows\Temp\asgard2-agent\'
    Image|endswith: '\thor.exe'
  filter_optional_Keybase:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Keybase\upd.exe'
  condition: not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects raw disk access operations that are executed by uncommon tools or tools located in suspicious directories. Such behavior can indicate an adversary attempting to evade defenses by manipulating or reading disk content directly, rather than using traditional file system APIs. The likely objective is to create, modify, or delete disk images or manipulated files to conceal malicious activities or maintain persistence.

  This detection maps to the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically the technique of Indicator Removal on Host (T1006). The primary telemetry source involves Windows raw access thread logs, with the desired log types being system event logs capturing the disk access activity. If successful, this activity can compromise the integrity of the host system and expose sensitive data. Importantly, this detection does NOT confirm malicious intent on its own; it only indicates that raw disk access has been invoked by tools that do not ordinarily engage in this behavior.

  ---

  ### Investigation Steps

  - **Check for process details:** Review the process associated with the raw disk access. Look for unusual executables through Security Event ID 4688 (process creation) that are not typically associated with disk accesses, especially those that originate from unexpected directory paths such as `C:\Users\[username]\AppData\Local`, or those that do not match known system processes.

  - **Examine access context:** Analyze the telemetry for the source of the raw disk access. Investigate if the access was initiated by user accounts with high privileges or from an account that typically does not engage in system-level operations. Legitimate access should generally originate from system services or users performing maintenance tasks.

  - **Identify unusual execution paths:** Cross-check the process execution paths against known safe directories. Legitimate applications typically reside in `C:\Windows`, `C:\Program Files`, or `C:\ProgramData`. Access from paths like `C:\Windows\Temp`, or user directories with tooling applications should raise suspicion.

  - **Look for common malicious indicators:** Focus on specific executable names. For instance, `\thor.exe` from `C:\Windows\Temp\asgard2-agent\` or `\upd.exe` from `C:\Users\[username]\AppData\Local\Keybase\` should be treated as high-confidence indicators of malicious activity if they show raw disk access.

  - **Review historical disk access:** Utilize the volume shadow copy service and similar tools to check for significant changes or anomalies in the disk structure or content. These might indicate unauthorized modifications made through raw access methods.

  - **Document legitimate tasks:** Take note of any current or recent scheduled tasks or legitimate administrative updates that could explain raw disk accesses. Common system maintenance tasks might regularly read from disk areas but should align with known good behavior.

  ---

  ### Prioritization

  The alert should be considered low severity, as raw disk access does not always indicate malicious intent and may occur during normal operations. However, given that such behavior is often associated with advanced adversaries, its detection should not be dismissed. The risk increases if the affected system has critical data or roles, especially in environments with known vulnerabilities.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of tools that are benign in nature but can also perform raw disk accesses (e.g., legitimate forensic tools). Additionally, configurations that do not log raw access operations can lead to missed detections. Legitimate activities like administrative scripts or maintenance tasks may also trigger this alert. A companion detection, such as monitoring file creation events (Security Event ID 4663) in system32 or critical directories, can improve coverage for evasion strategies.

