detection:
  selection:
  - Signature|startswith:
    - 'ASP.'
    - 'IIS/BackDoor'
    - 'JAVA/Backdoor'
    - 'JSP.'
    - 'Perl.'
    - 'PHP.'
    - 'Troj/ASP'
    - 'Troj/JSP'
    - 'Troj/PHP'
    - 'VBS/Uxor'           # looking for 'VBS/' would also find downloader's and droppers meant for desktops
  - Signature|contains:
    - 'ASP_'           # looking for 'VBS_' would also find downloader's and droppers meant for desktops
    - 'ASP:'
    - 'ASP.Agent'
    - 'ASP/'
              # - 'ASP/Agent'
    - 'Aspdoor'
    - 'ASPXSpy'
    - 'Backdoor.ASP'
    - 'Backdoor.Java'
    - 'Backdoor.JSP'
    - 'Backdoor.PHP'
    - 'Backdoor.VBS'
    - 'Backdoor/ASP'
    - 'Backdoor/Java'
    - 'Backdoor/JSP'
    - 'Backdoor/PHP'
    - 'Backdoor/VBS'
    - 'C99shell'
    - 'Chopper'
    - 'filebrowser'
    - 'JSP_'
    - 'JSP:'
    - 'JSP.Agent'
    - 'JSP/'
              # - 'JSP/Agent'
    - 'Perl:'
    - 'Perl/'
    - 'PHP_'
    - 'PHP:'
    - 'PHP.Agent'
    - 'PHP/'
              # - 'PHP/Agent'
