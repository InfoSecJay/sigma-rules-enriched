    - 'VBS/Agent'
    - 'Webshell'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule aims to identify alerts generated by antivirus solutions when they detect web shells, which are a common vector for attackers to maintain persistence on compromised web servers. Web shells allow adversaries to execute commands remotely, upload or modify files, and even pivot deeper into the network. This detection is crucial as it helps organizations recognize potential breaches before further damage can occur.

  The primary threat actors using web shells typically have objectives such as remote access facilitation, data exfiltration, or web application attacks. The detection correlates with the MITRE ATT&CK Tactic of Persistence, specifically Technique T1505.003 (Web Shell), which describes strategies used to maintain access to a compromised system. The anticipated primary data sources for this detection include antivirus logs, which would contain signatures of known web shell scripts and any related indicators of compromise.

  ### Investigation Steps
  - **Review Antivirus Alerts:** Examine the specific antivirus alerts that triggered this rule. Focus on the signatures and the context of the alert to understand what type of web shell was detected and which files were involved.
  - **Analyze Network Traffic:** Inspect recent network traffic for unusual outbound connections that may be associated with the web shell's command and control (C2) communication. Look for connections to unfamiliar IP addresses or domains.
  - **Evaluate Server Logs:** Check web server logs for any unauthorized or suspicious requests that align with web shell use, such as uploads to uncommon paths or unexpected command executions.
  - **Correlate with Other Security Tools:** Utilize EDR and NDR solutions to identify any lateral movements or additional suspicious activities related to the alert. This includes reviewing process creation logs and identifying any abnormal behaviors on the affected host.

  ### Prioritization
  The alert carries a high severity due to the potential impact of a web shell presence on a web server, which can lead to further exploitation, data breaches, or significant disruptions. Given the ease with which attackers can leverage web shells, immediate investigation is essential to mitigate potential risks.

  ### Blind Spots and Assumptions
  One gap in detection coverage may include custom or less common web shell implementations that do not match known signatures, potentially leading to missed detections. The detection logic assumes that the antivirus solution is correctly configured to log all relevant findings and that the alerts are monitored closely. For effective operation of this rule, continuous updates to antivirus signatures and the configuration of log collection systems are necessary to ensure no critical alerts are overlooked.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
