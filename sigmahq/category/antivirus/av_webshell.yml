note: |
  ### Technical Context

  This Sigma rule detects the presence of web shells on compromised hosts, specifically through antivirus signatures associated with various web scripting languages, such as ASP, PHP, JSP, and Perl. The likely attacker objective is to maintain unauthorized access to a web server or application by exploiting vulnerable code paths, enabling them to execute arbitrary commands and potentially pivot to other systems. This behavior aligns with the MITRE ATT&CK framework under the tactic of Persistence (T1505.003).

  Primary telemetry sources include antivirus logs that generate alerts for detected threats, specifically looking for keywords indicating web shells. The security impact is significant, as the presence of a web shell could lead to data exfiltration, system compromise, or lateral movement within the network. However, detection of a web shell does NOT confirm active exploitation or an ongoing threat; it indicates a need for further investigation into how the web shell was deployed.

  ### Investigation Steps

  - **Verify Antivirus Alerts**: Check antivirus logs (e.g., Windows Event ID 1116 for Windows Defender, or similar alerts from third-party AV solutions) for signatures matching 'Webshell' and examine the related file path to confirm its location and context.

  - **Correlate Logins and Access**: Review web server access logs (e.g., IIS logs, Apache access logs) for suspicious access patterns or unusual user agents around the same time as the antivirus alert, noting occurrences of potentially malicious requests targeting PHP, ASP, or JSP files.

  - **Investigate File System Changes**: Examine file creation events (Windows Security Event ID 4663 or Sysmon Event ID 11) in the directories of your web-root for recent additions or modifications to executable files or scripts that match known web shell indicators such as 'C99shell' or 'PHPShell'.

  - **Analyze Persistence Mechanisms**: Identify any unusual startup entries by checking Task Scheduler (Windows Event ID 4698) or Startup folders to see if the web shell or associated payload registers a persistent mechanism post-infection.

  - **Identify Legitimate Usage**: Review for legitimate software or web applications (like content management systems) known to utilize the detected scripting languages. Confirm if the detected signatures could be tied to known benign applications in authorized directories, which can reduce false positives.

  - **Check for Outbound Connections**: Confirm any outbound network connections (data exfiltration) from the host to suspicious IP addresses or domains by analyzing firewall logs and network traffic flows (NetFlow logs), focusing on connections that occurred after the antivirus alert.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems, especially web servers, which may be exploited for both data theft and further internal attacks. The likelihood of malicious use is significant, as web shells are commonly weaponized to gain and maintain access.

  ### Blind Spots and Assumptions

  Detection may be limited by false negatives where web shells are obfuscated or use uncommon signatures not represented in current AV definitions. Required log sources include comprehensive antivirus logs and web server access logs, which must be properly configured to capture relevant events. Legitimate web-based applications can trigger these alerts if they utilize scripts matching the detected signatures. A companion detection such as monitoring for abnormal network traffic patterns can strengthen overall threat detection, providing contextual awareness alongside alerting mechanisms.

