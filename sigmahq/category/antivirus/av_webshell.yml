note: |
  ### Technical Context

  This detection identifies alerts from antivirus software reporting the presence of web shells, which are malicious scripts that allow attackers remote access to a web server. The typical attacker objective is to maintain persistence, execute arbitrary commands, or exfiltrate data from compromised environments. The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1505.003)**.

  The primary telemetry source for this rule is antivirus logs, specifically those indicating detected signatures associated with web shells in web server environments. A successful detection may indicate that an attacker has leveraged a vulnerable web application or misconfiguration to deploy a web shell, which poses a significant security risk due to the possibility of data compromise, lateral movement, and further exploitation.

  It's important to note that this detection does NOT confirm that the web shell is currently active or that it has been exploited successfully; it only indicates that the antivirus solution has flagged suspicious signatures.

  ### Investigation Steps

  - **Review antivirus alert details:** Check the antivirus alert (Event ID X) for the specific signature detected, such as 'C99shell' or 'PHPShell.' Determine if any unusual activity preceded the detection, indicating exploitation.

  - **Analyze web server logs:** Inspect web server logs (e.g., IIS logs or Apache access logs) for suspicious requests matched to the time of the antivirus alert. Look for high-frequency access to files like `webshell.php` or other scripts triggered by the detected signature.

  - **Validate the presence of malicious artifacts:** Use file system monitoring tools to check for file creations or modifications that correspond to known web shell file paths or characteristics (e.g., Event ID 4104 for PowerShell logs showing script execution).

  - **Identify benign activities:** Compare the detected alert against expected baseline activity for your web server. Legitimate administrative tasks might involve regular access logs to scripts or management panels that wouldn’t typically raise flags.

  - **Perform a threat hunting exercise:** Assess for lateral movement or additional compromised web applications by conducting a search for common indicators of compromise across your network. Utilize Threat Intel sources on noted web shells to cross-reference.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems—especially if it involves a web server hosting sensitive data. The likelihood of malicious abuse is significant, given that web shells are commonly weaponized techniques by adversaries for establishing and maintaining persistence in a network.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as using obfuscated or renamed web shells that may not trigger antivirus signatures. Reliable detection is contingent on maintaining up-to-date antivirus signatures and configurations, which are essential for identifying newer or modified web shell variants. Legitimate activities, such as web application updates or administrative scripts, can unintentionally trigger this alert. A related companion detection includes monitoring configuration changes or failed access attempts to web management interfaces that could indicate further exploitation attempts.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
