note: |
  ---

  ### Technical Context

  This rule detects alerts raised by antivirus software indicating the presence of a web shell, which is a type of malicious script that allows remote attackers to control a compromised web server. The likely objective of an attacker employing a web shell is to gain persistent access to a server, enabling them to further exploit vulnerabilities, exfiltrate data, or use the server as a launch point for additional attacks. This behavior corresponds to the MITRE ATT&CK tactic of **Persistence** (TA0003) and specifically the technique **Exploitation for Client Execution** (T1505.003).

  The primary telemetry source for this detection is antivirus logs that capture signature alerts. Such logs typically include fields for the detected signature, file path, and action taken by the antivirus (e.g., blocked, quarantined). If successful, a web shell's presence may allow an attacker to execute arbitrary commands and access sensitive data, posing a significant security breach. It is important to note that this detection alone does not confirm successful exploitation or active lateral movement within the environment; it solely indicates the detection of a web shell signature.

  ---

  ### Investigation Steps

  - **Review antivirus logs for signatures**: Check recent antivirus logs (Event ID relevant to the specific AV solution) for matches on signatures indicative of web shells, such as "C99shell," "PHPShell," or "Backdoor.PHP". Document the time and affected asset.

  - **Correlate timestamp with other logs**: Examine additional logs, such as web server access logs (e.g., Apache or IIS), to identify any unusual access patterns that may correlate with the time the web shell was detected, checking for abnormal requests (e.g., POST requests with suspicious parameters).

  - **Analyze file system changes**: Investigate the file system, particularly in web directories, for any unauthorized file uploads or modifications around the same time as the AV alert. Look for newly created files or changes to existing web scripts.

  - **Assess legitimate usage**: Determine if the web application has any authorized processes, such as legitimate web development activities, that correspond with the detection. This may involve reviewing user activity logs to identify expected file uploads or changes.

  - **Identify known malicious indicators**: Use threat intelligence platforms (e.g., VirusTotal) to validate any flagged file hashes or URLs against known malicious signatures and attackers' methodologies.

  - **Check for lateral movement logs**: Monitor internal network activity for lateral movement attempts from the affected asset, focusing on logs such as Windows Event ID 4688 for new process creations that may be spawned from the web shell.

  ---

  ### Prioritization

  Given the high impact on potential data integrity and confidentiality risks, this alert is prioritized as high severity. Web shells are frequently weaponized in attacks to maintain persistent control over exploited systems, increasing the likelihood of malicious abuse. The presence of a web shell in an environment demands immediate and thorough investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if antivirus signatures are outdated or improperly configured, potentially allowing legitimate web shell variations to go undetected. It is essential that antivirus solutions have comprehensive coverage of all web applications hosted in the environment. Furthermore, legitimate activities such as web application testing or deployments may generate false positives, requiring context-sensitive analysis. Companion detections, such as monitoring for unusual outbound traffic or command-and-control indicators, can enhance detection capabilities.

