note: |
  ### Technical Context
  This rule detects malicious SQL queries indicative of reconnaissance, data exfiltration, or potentially destructive activities. Attackers often utilize such queries to manipulate database states, extract sensitive information, or perform unauthorized changes to database schemas. Keywords such as "drop," "truncate," "dump," and "select *" are commonly employed in various attack stages, from performing initial access to sustaining persistence within a compromised environment.

  In a typical threat scenario, an attacker might leverage SQL injection vulnerabilities to gain unauthorized access to a database. They may then use destructive commands to erase crucial data or exploit wildcard selections to harvest sensitive data, which aligns with objectives surrounding information theft and privilege escalation. This behavior corresponds to several MITRE ATT&CK tactics and techniques, particularly **Initial Access (T1190)** and **Exploitation of Remote Services** and **Exfiltration Over Command and Control Channel (T1505.001)**.

  The primary data source for this detection is database logging, particularly logs that record SQL query execution. Ensuring proper logging is enabled on database servers is essential for capturing potential threats.

  ### Investigation Steps
  - **Review SQL Query Logs:** Check the database logs for any instances of the detected keywords ("drop," "truncate," "dump," "select *") and note the context in which they were executed, such as user accounts and timestamps.

  - **Analyze User Behavior:** Investigate the activity of the users associated with the suspicious queries. Look for abnormal patterns in their SQL usage, signs of privilege escalation, or deviations from typical behavior patterns.

  - **Correlate with Other Logs:** Combine findings from database logs with application logs or web server logs to identify any correlation with web traffic that might indicate SQL injection attempts or other reconnaissance activities.

  - **Evaluate System and User Roles:** Assess whether the users executing these queries have appropriate permissions and roles, looking for any accounts that should not possess such capabilities, which may signify lateral movement or compromise.

  ### Prioritization
  The alert is marked as medium severity due to the potential impact of unauthorized data manipulation or exfiltration, coupled with the likelihood of an attacker using these techniques to achieve their objectives in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule relies heavily on the presence and integrity of database logging configurations. A potential blind spot lies in the logging being disabled or improperly configured, which could lead to undetected activity. Furthermore, the detection logic assumes that all suspicious SQL activity is nefarious, overlooking legitimate applications, automated processes, or vulnerability scanning tools that might generate similar queries. There may be gaps in coverage if logs do not capture SQL query context or user identification correctly, impeding full visibility into potential threats.

