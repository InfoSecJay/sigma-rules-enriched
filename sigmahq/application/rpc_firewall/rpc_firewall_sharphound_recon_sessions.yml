  ### Technical Context

  This rule detects remote RPC (Remote Procedure Call) calls made by the SharpHound tool, which is commonly used for Active Directory enumeration and reconnoitering in a target environment. The likely attacker objective is to map out user and group relationships, identify potential attack vectors, and gain insights into permissions and privileges within the network. The relevant MITRE ATT&CK tactic is Discovery, specifically technique T1033 (System Owner/User Discovery).

  The primary telemetry sources are logs from the RPC Firewall, specifically Event ID 3 that captures events related to RPC calls. If malicious, this behavior can lead to unauthorized access or lateral movement within the network. Importantly, this detection does not confirm that an attacker successfully exfiltrated data or executed a follow-up attack; it merely indicates an attempted reconnaissance activity.

  ### Investigation Steps

  - **Review RPC Firewall Logs for Event ID 3**: Check `RPC Firewall` logs for `Event ID 3`, filtering for `InterfaceUuid` (`4b324fc8-1670-01d3-1278-5a47bf6ee188`) and `OpNum` (`12`). Look for connections from unexpected or suspicious IP addresses to identify potential malicious activity.

  - **Identify Source of RPC Calls**: Analyze the source of the RPC calls by checking the `Event Log` under the relevant time frame. Cross-reference user or host names with the allowed entity lists to determine if the request aligns with known operations or configuration.

  - **Baseline Legitimate RPC Usage**: Establish a baseline of expected legitimate RPC calls in your environment. Review normal operational behavior, such as regular admin tasks performed by known hosts or users, to differentiate between benign and suspicious activities.

  - **Correlate with Active Directory Logs**: Examine Active Directory logs to see if the detected activity corresponds with unauthorized attempts to enumerate users, groups, or permissions. Look for event IDs like `4624` (successful logons) or `4740` (account lockouts) around the same time for context.

  - **Check for Other Indicators of Lateral Movement**: Look for other signs of lateral movement in the network, such as unusual remote desktop sessions or file access logs that coincide with the detected RPC activity. This might include monitoring for logon events from unusual locations or accounts.

  ### Prioritization

  This alert should be considered high priority, especially in environments where sensitive data is managed or where lateral movement could lead to significant security impacts. The likelihood of malicious abuse is high, as tools like SharpHound are explicitly designed for gathering critical information that aids in further exploitation. The behavior detected here is common in adversarial reconnaissance, making it a critical indicator to investigate.

  ### Blind Spots and Assumptions

  One limitation of this detection includes the potential for legitimate RPC calls from trusted processes or users that could trigger the alert, especially if users have elevated privileges or are performing administrative duties. The requirement for the RPC Firewall to be properly configured and monitoring relevant events is essential for reliable detection. Common legitimate activities that may inadvertently trigger this alert include system administrative tasks or network scans performed by internal security tools. A related detection that strengthens coverage could include monitoring for abnormal authentication events in conjunction with RPC calls.

