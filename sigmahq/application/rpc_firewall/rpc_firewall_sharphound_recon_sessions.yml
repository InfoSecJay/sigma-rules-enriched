  ### Technical Context
  This rule detects remote RPC calls initiated by SharpHound, a tool used for gathering information about Active Directory (AD) environments. By leveraging these RPC calls, an attacker can enumerate network connections, user accounts, and local group memberships, which aids in reconnaissance and later stages of lateral movement within a victim's environment. The primary objective of employment of SharpHound is to build a comprehensive map of the AD structure to inform further attacks such as privilege escalation or data exfiltration.

  The detected activity aligns with the MITRE ATT&CK tactics of **Discovery** and relates specifically to techniques like **Remote Service Session Hijacking (T1033)**, which involves leveraging remote services for enumeration purposes. Relevant telemetry can be gathered through the implementation of an RPC Firewall, which specifically monitors RPC activity, including binding requests and method calls necessary for mapping out AD configurations. Effective detection will primarily rely on logs from the RPC Firewall that track suspicious RPC calls.

  ### Investigation Steps
  - **Review RPC Firewall Logs:** Examine logs generated by the RPC Firewall for Event ID 3, specifically filtering for Interface UUID `4b324fc8-1670-01d3-1278-5a47bf6ee188` and Operation Number 12 to identify instances of SharpHound-generated RPC calls.
  - **Analyze Network Connections:** Investigate network traffic and connections from the hosts involved in detected sharp RPC calls to identify potential command-and-control (C2) traffic or unauthorized lateral movement attempts.
  - **Inspect User Behavior:** Look into user account activity across the domain, particularly those with elevated privileges, to ascertain if there have been any recent, unauthorized changes to group memberships or roles in Active Directory.
  - **Audit Active Directory Permissions:** Conduct a review of Active Directory permissions and group policies to validate that no unauthorized access or privilege grants have occurred in conjunction with the detected RPC activity.

  ### Prioritization
  The alert is categorized as high severity due to the sensitive nature of the reconnaissance tactics employed by SharpHound, which can lead to significant compromise if left unchecked. Given the high likelihood of attackers utilizing such methods to exploit user permissions and lateral movement pathways, prompt investigation is crucial to safeguarding the network.

  ### Blind Spots and Assumptions
  There may be detection gaps due to insufficient coverage in environments where the RPC Firewall is not universally applied or where other methods of enumeration are utilized that do not generate the logs being monitored. The detection logic assumes that all relevant systems are running procedures to log RPC activity correctly. Additionally, if there are any modifications to the RPC infrastructure or if logs are excessively rotated or mishandled, this could hinder effective identification of SharpHound activities.

