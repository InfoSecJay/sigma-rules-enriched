  ---

  ### Technical Context

  This Sigma rule detects remote procedure calls (RPCs) that perform remote DCOM operations, indicating potential lateral movement attempts via DCOM or Windows Management Instrumentation (WMI). The likely attacker objective is to execute malicious commands or scripts on a remote system without physical access. This behavior maps to the MITRE ATT&CK tactics of Lateral Movement (TA-0008) and Execution (TA-0002), specifically techniques T1021.003 (Remote Services) and T1047 (Windows Management Instrumentation). Key telemetry sources include RPC Firewall logs, particularly Event ID 3, which logs remote call activities and associated interface UUIDs. If these operations are malicious, they can compromise the target system, giving adversaries control and access to sensitive data. However, this detection does NOT confirm that an attack is in progress on its own, as some benign administrative tasks may also trigger similar RPC calls.

  ---

  ### Investigation Steps

  - **Review RPC Firewall logs for Event ID 3:** Examine logs from the RPC Firewall to identify any suspicious remote DCOM calls. Check the `EventLog` field for RPCFW and ensure the `EventID` is 3.

  - **Check for unusual interface UUIDs:** Investigate the `InterfaceUuid` fields in the detected events. If they match well-known UUIDs (e.g., for legitimate administrative tools) or are not commonly associated with your environment, it increases suspicion of malicious activity.

  - **Validate expected behavior for administrative tasks:** Compare logs against a baseline of legitimate administrative actions. Typical values for `InterfaceUuid` related to authorized DCOM/WMI tasks should be documented, and any deviations should be scrutinized.

  - **Identify the source and destination of RPC calls:** Look for signs of lateral movement by examining the `source IP` and `destination IP` in the logs. If the source IP is not a known administrative host or the destination is an uncommon system, consider it a malicious indicator.

  - **Cross-reference with other security alerts:** Correlate findings from relevant detection mechanisms, such as incident responses from antivirus software or EDR solutions. Alerts related to unauthorized access or the presence of known malware on the same assets can strengthen findings.

  ---

  ### Prioritization

  This alert is considered high severity due to its potential impact on critical systems through unauthorized lateral movement. The likelihood of malicious abuse is significant, given that such DCOM/WMI calls are commonly utilized in lateral movement attacks. Since DCOM and WMI entries can be weaponized by various threat actors, addressing these alerts promptly is critical.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environmental configurations; if the RPC Firewall is not deployed adequately across all endpoints, malicious actions may go unnoticed. Additionally, legitimate administrative activities, such as system updates or maintenance tasks, can trigger this alert, potentially leading to false positives. Companion detections involving suspicious logins or process execution from unusual workstations should be closely monitored to enhance overall detection capabilities.

