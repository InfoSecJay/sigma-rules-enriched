note: |
  ### Technical Context
  This detection rule identifies unusual remote procedure calls (RPC) that perform Distributed Component Object Model (DCOM) operations, which could signify potential lateral movement attempts within the network. Attackers may leverage DCOM or Windows Management Instrumentation (WMI) to connect to and execute commands on remote systems without needing to establish a traditional remote desktop session. The primary objectives of such tactics are often to move laterally within a network and to execute malicious payloads on target machines, increasing the attacker's foothold and enabling further exploitation.

  Relevant MITRE ATT&CK tactics for this detection include **Lateral Movement** (TA0301) where attackers try to escalate their positioning within the environment, and **Execution** (TA0045), indicating actions taken in order to run arbitrary code on local or remote systems. Associated techniques are **Lateral Movement using WMI** (T1021.003) and **Remote Services** (T1047), which encompass methods used to facilitate DCOM interactions for these purposes. The primary data sources for this detection include RPC Firewall event logs, which record the attempts of remote procedure calls and contribute valuable insight into potentially anomalous behavior.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Examine the RPC Firewall event logs for Event ID 3, focusing on logs originating from unusual source hosts attempting to access critical infrastructure or sensitive systems.

  - **Analyze Network Traffic**: Look for suspicious RPC or WMI traffic patterns, examining the endpoints involved and the context of the communications to ascertain whether they align with normal administrative activities.

  - **Inspect System Event Logs**: Correlate any identified RPC calls with local system event logs (e.g., security and application logs) to check for unexpected remote executions or created processes.

  - **Evaluate Administrative Activity Logs**: Since some administrative tasks may generate false positives, specifically review logs related to expected system administration schedules to discern legitimate access attempts from malicious behavior.

  ### Prioritization
  This alert warrants high severity in an enterprise environment due to the potential for lateral movement, which could lead to significant data breaches or system compromises. The likelihood of an attacker exploiting DCOM for unauthorized lateral movement underscores the critical nature of this detection.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage related to non-audited RPC calls, as well as assumptions that all administrative tasks can be clearly distinguished from attacker behavior. Log settings must be configured correctly and the RPC firewall should be installed and actively auditing DCOM traffic to generate the necessary logs for this detection to function effectively. Additionally, there might be benign uses of DCOM that could trigger alerts, such as legitimate administrative tasks, which could lead to alert fatigue if not properly contextualized.

