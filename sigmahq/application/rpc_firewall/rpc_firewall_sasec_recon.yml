  ### Technical Context

  This Sigma rule detects remote procedure call (RPC) attempts targeting the retrieval of scheduled task information via the SASec (Scheduled Tasks Security) interface. The likely attacker objective is to enumerate scheduled tasks on a target system, which could reveal sensitive operational details and facilitate further exploitation. The relevant MITRE ATT&CK tactic is Discovery and the technique is Remote System Discovery (T1087). Primary telemetry sources include RPC Firewall logs, specifically looking at Event ID 3, which indicate blocked RPC calls.

  The security impact of such behavior can be significant, as successful enumeration could lead to privilege escalation, lateral movement, or the discovery of sensitive tasks that could be leveraged for further attacks. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative tools may also generate similar RPC queries.

  ---

  ### Investigation Steps

  - **Check RPC Firewall logs for Event ID 3:** Review the RPC Firewall logs for entries with Event ID 3 (EventLog: RPCFW) that contain the Interface UUID of `378e52b0-c0a9-11cf-822d-00aa0051e40f`, which indicates blocked attempts to query scheduled tasks.

  - **Identify high-confidence malicious activity:** Look for multiple blocked RPC calls originating from a single source IP or hostname, especially if they occur in a short time window or are repeated attempts targeting various endpoints.

  - **Verify legitimate administrative operations:** Assess if there were known administrative tasks scheduled or recent changes made to the environment during the time of the detections. Scheduled task queries performed by authorized users (e.g., IT staff) typically happen during office hours.

  - **Correlate with user activity logs:** Cross-reference the target system's user activity logs for other suspicious behavior around the time of the RPC calls. Look for logins from unusual accounts or attempts to access sensitive systems.

  - **Review for external IPs or unusual source addresses:** Investigate if the source IP addresses are outside the organizational network or have no history of legitimate access, indicating possible external reconnaissance attempts.

  - **Examine additional RPC configuration events:** Check related RPC configuration logs for changes that might indicate repeated attempts were made, such as alterations in access permissions or allowed RPC calls.

  ---

  ### Prioritization

  This alert holds a high severity due to the potential impact on critical systems involved in task scheduling. The likelihood of malicious use is elevated, especially in scenarios where adversaries conduct reconnaissance to prepare for lateral movement. The ability to enumerate scheduled tasks is a known vector exploited in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection might be limited by configurations that do not appropriately log all RPC-related activities. An attacker could use various techniques to mask their reconnaissance, such as employing legitimate administrative tooling or operating from trusted IP addresses. Legitimate administrative users querying scheduled tasks may inadvertently trigger this alert, necessitating careful context examination. Consider implementing companion detections that include monitoring user logins and unusual access patterns to bolster overall coverage.

