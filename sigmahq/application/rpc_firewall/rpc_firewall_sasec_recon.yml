note: |
  ### Technical Context
  This detection rule identifies suspicious remote procedure call (RPC) activities targeting scheduled tasks on systems where SASec (Secure Application Services) is deployed. Specifically, it captures unauthorized requests to read information about scheduled tasks using a designated UUID linked to RPC calls. The primary threat scenario involves an attacker attempting to gather information about scheduled tasks on a compromised host, which can facilitate further lateral movement or reconnaissance within the network.

  The objective of this activity is often aligned with the MITRE ATT&CK tactic of "Discovery," where the attacker seeks to identify potential attack paths or valuable targets within the environment. Relevant techniques include "Query Registry" (T1012), which refers to accessing system settings and configurations, and "Enumerate Local Groups" (T enumeration) used to fetch group memberships of local accounts. These actions can reveal insight into system configurations and setup, enabling the attacker to plan their next move effectively.

  The primary data sources for this detection include RPC firewall logs, specifically noting events related to RPC calls and their associated parameters. These logs provide valuable evidence of attempted reconnaissance actions that could lead to potential exploit scenarios.

  ### Investigation Steps
  - **Review RPC Firewall Logs:** Analyze the logs from the RPC firewall to identify EventID 3 entries. Focus on those originating from suspicious or anomalous source IP addresses to detect possible unauthorized access attempts.
  - **Correlate with Other Activity Logs:** Cross-reference any detected RPC calls with system event logs, especially those indicating process creation or removal, to identify any unusual patterns or behaviors during the same time frame.
  - **Examine Scheduled Tasks:** Investigate scheduled tasks configured on affected systems, looking for unusual schedules or tasks that may not align with standard operating practices, as these may indicate malicious intentions or impact post-compromise.
  - **Conduct Network Traffic Analysis:** Monitor for any unexpected outbound queries or commands that could indicate attempted data exfiltration or lateral movement in conjunction with the detected RPC activities.

  ### Prioritization
  Given the potential for an attacker to gain insights into system configurations and server tasks, this alert is considered high severity in an enterprise environment. The likelihood of exploitation based on reconnaissance activities is significant, especially if multiple systems display similar patterns.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if the RPC firewall is not uniformly deployed across all endpoints within the environment, potentially leaving some systems unmonitored. There is also an assumption that the standard configuration for RPC calls is not altered by legitimate applications or processes, which might generate false positives. Additionally, correct logging and configuration of the RPC firewall are essential for the rule to function effectively; any absence of these logs will hinder detection capabilities.

