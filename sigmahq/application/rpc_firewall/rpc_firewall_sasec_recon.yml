note: |
  ### Technical Context

  This detection identifies remote procedure calls (RPC) that are attempting to access information about scheduled tasks through the SASec (Secure API Security) interface. An attacker may leverage this technique to gather information about tasks that could be exploited for lateral movement or privilege escalation within an organization. This behavior correlates with the MITRE ATT&CK framework under the tactic of **Discovery** and the technique **Scheduled Task Discovery** (T1053). The primary telemetry source is the RPC firewall, specifically looking for events logged under `EventLog: RPCFW` and `EventID: 3`. If these RPC calls are malicious, they can reveal critical operational information and facilitate further attacks. Importantly, this detection alone does not confirm that an attack is occurring; it merely highlights suspicious activity that warrants further investigation.

  ### Investigation Steps

  - **Review RPC call details**: Check for relevant RPC log entries, specifically `EventLog: RPCFW` with `EventID: 3` and `InterfaceUuid: 378e52b0-c0a9-11cf-822d-00aa0051e40f` to confirm the calling address and activity type.

  - **Analyze source IP**: Identify the source IP of the remote RPC call. Compare against known internal addresses and assess whether the source is authorized to query scheduled tasks.

  - **Correlate with process activity**: Look for associated events related to process creation, specifically `Security Event ID 4688` or `Sysmon Event ID 1` that may indicate the launch of scripts or tools commonly used for reconnaissance.

  - **Understand benign usage**: Document any legitimate services or applications that might naturally perform RPC calls to scheduled tasks. Monitor the frequency and timing patterns of these legitimate calls to differentiate from suspicious behavior.

  - **Identify high-confidence malicious indicators**: Look for repeated or unusual RPC calls where the `OpNum` is `0` or `1`, particularly if accompanied by failed access attempts or abnormal return codes.

  - **Check for lateral movement attempts**: Investigate if the detected RPC calls are followed by any other suspicious activities, such as creation or modification of scheduled tasks (`Event ID 4698` for task creation) that may signify an attempt to implant persistence mechanisms.

  ### Prioritization

  This alert has a high severity level due to its potential impact on the environment's security posture. The ability to read information about scheduled tasks could enable unauthorized users to plan further attacks, making this behavior a common tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of RPC firewalls or the logging capabilities of the hosts. Certain legitimate administrative tasks or software updates could trigger this alert if they involve accessing scheduled task information. Companion detections, such as monitoring for abnormal task creation (`Event ID 4698`), can enhance coverage and provide a more comprehensive context for assessing the impact of detected RPC activities.

