note: |
  ### Technical Context
  This detection rule targets potential DCSync or DCShadow attacks, which are sophisticated techniques used by attackers to manipulate Active Directory (AD). Specifically, the rule identifies suspicious remote Remote Procedure Call (RPC) calls to the MS-DRSR interface from non-domain controller (DC) hosts. DCSync allows attackers to mimic the behavior of a domain controller and retrieve password hashes, while DCShadow enables them to inject changes into AD to create backdoors or manipulate group memberships.

  The insights gleaned from monitoring these RPC calls are crucial, as they suggest abnormal activity that could lead to a compromise of domain credentials and unauthorized changes to the AD environment. The relevant MITRE ATT&CK tactics include **Credential Access (T1003)** and **Discovery (T1087)**, with specific techniques such as DCSync (T1003.006) for DCSync operations and other discovery techniques related to credential access.

  Key data sources for detecting these malicious actions will primarily include logs from an RPC firewall that track the usage of specific interface UUIDs associated with MS-DRSR, as well as monitoring and analyzing related event logs generated during the RPC calls.

  ### Investigation Steps
  - **Review RPC Logs**: Analyze the RPC firewall logs, specifically filtering for EventID 3, to identify any RPC calls made to the MS-DRSR interface from non-DC hosts. Pay attention to timestamps and the originating IP addresses.

  - **Cross-reference Active Directory Changes**: Check for recent changes made in Active Directory corresponding to the suspicious RPC calls. Look for unusual modifications to user accounts, group memberships, or password resets.

  - **Audit Non-DC Host Behavior**: Investigate the source systems that initiated the RPC calls. Examine their network behavior and look for signs of lateral movement or previous privilege escalation attempts indicative of a potential compromise.

  - **Validate Trusted Sources**: Ensure that the communication is orchestrated only from trusted sources. An analysis of the configured rules in the RPC firewall is necessary to confirm that only authorized IPs (e.g., domain controllers) are allowed to engage in these RPC calls.

  ### Prioritization
  The alert is considered high severity due to the critical nature of AD in enterprise environments. DCSync attacks can lead to the complete compromisation of user credentials, potentially allowing attackers full access to network resources and sensitive data.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the RPC firewall is not properly configured on all relevant endpoints. The detection logic assumes that the RPC firewall is operational and correctly filtering RPC calls based on established trust relationships. Additionally, any logs from systems that do not utilize the RPC firewall may not provide full visibility into these activities. Continuous logging and monitoring must be enforced for timely detection and response to potential threats.

