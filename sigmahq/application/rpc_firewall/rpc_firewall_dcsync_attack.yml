note: |
  ### Technical Context

  This rule detects remote RPC calls to the MS-DRSR interface from non-domain controller hosts, which may indicate potential DCSync or DCShadow attacks. The likely objective of an attacker is to replicate or modify Active Directory data, potentially allowing them to impersonate accounts or make unauthorized changes to directory objects. This activity falls under the MITRE ATT&CK technique T1033 - "Credential Dumping" and more specifically relates to Tactic ID TA0006 - "Credential Access".

  The primary telemetry source required for this detection is the RPC Firewall's event logs, specifically EventLog entries captured under the RPCFW category with EventID 3. If the behavior is malicious, the impact could be severe, leading to unauthorized access, privilege escalation, or data manipulation within Active Directory. It is important to note that this detection does NOT confirm malicious intent on its own; further context is needed to ascertain whether the RPC calls are legitimate or suspicious.

  ### Investigation Steps

  - **Review RPC Firewall Event Logs:** Check EventLog: RPCFW for EventID 3. Look for calls from non-DC hosts targeting the DRSR UUID (e3514235-4b06-11d1-ab04-00c04fc2dcd2). Legitimate RPC calls typically originate from domain controllers.

  - **Identify Source IP Addresses:** Verify the source IP of the RPC call. Compare it against known trusted IPs. Malicious activity often involves unexpected or unauthorized hosts attempting access.

  - **Examine OpCode Values:** Analyze the OpNum values in EventID 3. Only 0, 1, and 12 are benign. Any other OpNum indicates potentially dangerous operations that warrant further investigation.

  - **Correlate User Activity:** Utilize directory service logs (e.g., Security Event ID 4661 for object access) to correlate user actions with the RPC calls. Unusual patterns or non-administrative user accounts triggering RPC calls could indicate malicious activity.

  - **Investigate High-Confidence Malicious Indicators:** Look for anomalous login attempts associated with the source IP addresses around the same timeframe as the RPC calls. Suspicious login activity, such as logins from outside normal business hours or atypical locations, can signify an ongoing attack.

  - **Assess Host Roles:** Determine the role of the hosts making the RPC calls and the criticality of these assets. Non-trusted systems accessing directory services can pose significant security risks.

  ### Prioritization

  This alert is high-severity as it involves potentially unauthorized access attempts to critical directory services, which may lead to credential theft and privilege escalation. The likelihood of malicious abuse is significant, given that DCSync and DCShadow attacks are commonly weaponized techniques in credential-related attacks on Active Directory.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured firewall rules or if the RPC Firewall is not adequately deployed across all relevant assets. Legitimate administrative tools or service accounts may trigger alerts if improperly configured or allowed to perform RPC calls from non-standard locations. A related detection to complement this investigation could focus on monitoring for abnormal Active Directory changes (e.g., Security Event ID 5136).

