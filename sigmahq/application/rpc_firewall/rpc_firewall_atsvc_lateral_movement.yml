  ---

  ### Technical Context

  This rule detects remote Procedure Call (RPC) interactions aimed at creating or executing scheduled tasks via the ATSvc (Task Scheduler) service on a target machine. The likely attacker objective is to facilitate lateral movement within the network, enabling them to execute arbitrary commands or maintain persistence on compromised endpoints. This behavior aligns with the MITRE ATT&CK technique T1053.002 (Scheduled Task/Job: Scheduled Task) under the tactics of Persistence, Execution, and Lateral Movement.

  The primary telemetry sources for this detection are RPC logs captured by the RPC Firewall, specifically looking for Event ID 3 with a corresponding interface UUID of `1ff70682-0a51-30e8-076d-740be8cee98b`. If malicious, this behavior could lead to unauthorized system access or control over the target machine. It’s important to note that this detection does NOT confirm malicious behavior on its own but indicates possible unauthorized attempts to manipulate scheduled tasks.

  ---

  ### Investigation Steps

  - **Review RPC logs for Event ID 3:** Check for logs indicating remote procedure calls for the ATSvc with the specified `InterfaceUuid` and `OpNum` (0 or 1). Focus on unexpected source addresses within your environment.

  - **Verify the legitimacy of the source:** Correlate the originating IP address with asset records. If the source is unexpected or from outside expected network segments (e.g., internal management workstations), this could indicate malicious intent.

  - **Inspect process creation events:** Look for associated Windows Security Event ID 4688 (Process Creation) on the target machine to identify what process initiated the RPC call. Legitimate operations will typically involve system maintenance or administrative tasks.

  - **Assess Scheduled Task definitions:** Use PowerShell commands (e.g., `Get-ScheduledTask`) on the target system to verify if any new tasks have been created or modified around the same time as the detected RPC calls. Look for unusual tasks that lack administrative oversight.

  - **Identify known trusted hosts:** Journal legitimate admin access patterns, focusing on approved workstations used for system management. Cross-reference the logs to understand if the RPC call aligns with established administrative behaviors.

  - **Validate file activity:** If an associated task is found, check for file creation or modification timestamps using the Windows Security Event ID 4663 (File Access). Unusual file paths or sudden changes could indicate compromise or malicious actions stemming from the task execution.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the potential impact of unauthorized scheduled task modifications on critical systems. The likelihood of using this method for lateral movement is significant, as it is a common technique employed by attackers during post-exploitation phases.

  ---

  ### Blind Spots and Assumptions

  This detection may not capture all lateral movement attempts, particularly those using encrypted traffic or alternative methods for task scheduling. Reliable detection requires that the RPC Firewall is configured properly across all endpoints. Legitimate activities, such as remote administrative tasks or service configurations, may inadvertently trigger this alert. A companion detection to consider is monitoring for Event ID 4648 (A login attempt was made using explicit credentials), which can further validate unauthorized access attempts in conjunction with suspicious task executions.

