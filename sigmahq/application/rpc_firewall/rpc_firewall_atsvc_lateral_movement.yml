note: |
  ### Technical Context
  The rule detects remote procedure call (RPC) requests to create or execute scheduled tasks via the Automation Task (ATSvc) service on Windows systems. Specifically, it identifies when an attacker leverages the RPC mechanism for lateral movement, which is often a method used to execute malicious tasks on remote systems without direct access. The likely attacker objectives include gaining unauthorized access, establishing persistence, or executing code within remote environments, all of which facilitate further exploitation of the network.

  This activity maps to several MITRE ATT&CK tactics and techniques, particularly:
  - **Lateral Movement (TA0008)**: the technique of moving through a network from one host to another to access information or resources.
  - **Scheduled Task/Job (T1053)**: creating or modifying a scheduled task to execute commands.
  - **Scheduled Task/Job (Windows) (T1053.002)**: specifically highlights scheduled tasks on Windows environments.

  Primary data sources for this detection include logs from the RPC firewall, which capture events related to RPC calls, specifically focusing on Event Logs indicating task creation or execution attempts via Remote Procedure Calls.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Examine the RPC firewall logs for Event ID 3, specifically looking for any calls to the ATSvc (UUID: 1ff70682-0a51-30e8-076d-740be8cee98b) that indicate the creation or execution of scheduled tasks remotely.
  - **Analyze Suspicious User Activity**: Investigate the source user and host making the remote calls. Look for any anomalies or previous login patterns that suggest unauthorized access.
  - **Correlate with Process Creation Events**: Check the process creation events around the same time as the RPC calls to identify any unauthorized or unexpected processes that may indicate malicious execution.
  - **Inspect Network Traffic**: Review NDR (Network Detection and Response) logs for any unusual communication patterns or traffic spikes related to the RPC services indicating lateral movement activity.

  ### Prioritization
  This alert is classified as high severity as successful exploitation can lead to significant data breaches, unauthorized access, and potential compromise of critical systems within an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to systems that do not have the RPC firewall installed or improperly configured environments that do not log RPC interactions. The detection logic assumes that the RPC firewall is properly implemented and that relevant logs are being generated consistently. Additionally, if attackers use alternative methods to execute tasks (not utilizing ATSvc), this rule may not detect such activities, highlighting the need for a robust multi-faceted detection strategy.

