  ### Technical Context

  This Sigma rule detects unauthorized remote procedure call (RPC) attempts to invoke the Microsoft Encrypting File System Remote Protocol (MS-EFSR) interface. The objective of an attacker in this context would be to exploit vulnerability CVE-2021-36942, potentially allowing unauthorized access to encrypted files or manipulation of encryption keys. This behavior primarily aligns with the MITRE ATT&CK tactic of Lateral Movement (T1021) using techniques for Remote Services (T1021.001).

  The primary telemetry source for this detection is the RPC Firewall logs, specifically looking for Event ID 3 that identifies blocked RPC calls targeting the relevant UUIDs for the MS-EFSR services. If malicious, this activity can lead to significant data breaches by compromising file integrity and confidentiality. This detection, however, does NOT confirm whether an exploitation attempt was successful; it only indicates an attempt to abuse a remote encryption service.

  ---

  ### Investigation Steps

  - **Review RPC Firewall Event ID 3 logs:** Look for entries that specifically mention the UUID df1941c5-fe89-4e79-bf10-463657acf44d or c681d488-d850-11d0-8c52-00c04fd90f7e. Identify the source IP and account initiating the RPC call for context.

  - **Correlate blocked RPC calls with active sessions:** Check the Remote Desktop Protocol (RDP) logs (Event ID 4624) on the affected systems to see if there are unusual or recent logins that correspond to the timing of the alerts.

  - **Identify legitimate uses of MS-EFSR:** Document legitimate activities that commonly use this protocol, such as internal management of encrypted files, to differentiate between benign activities and actual attack attempts.

  - **Check for known indicators of compromise (IoCs):** Investigate the originating host for any known malicious actors or IPs that may be attempting to exploit vulnerabilities related to the MS-EFSR protocol.

  - **Validate system roles and configurations:** Ensure that the affected machines have the RPC Firewall correctly configured and that the MS-EFSR service is appropriately accessed by authorized personnel only.

  - **Examine file access logs:** Review the system's file access logs (Event IDs 4663 for detailed file access) to look for any unauthorized access or changes to encrypted files, particularly following blocked RPC calls for deeper threat hunting.

  ---

  ### Prioritization

  This alert should be considered high priority given the potential risk of data loss and system integrity compromise associated with file encryption exploits. The likelihood of such RPC-based attacks being weaponized is significant due to their complexity and the high stakes involved in accessing secret cryptographic keys.

  ---

  ### Blind Spots and Assumptions

  This detection may miss modified or benign RPC calls if legitimate software uses the service inadvertently. It is crucial to ensure comprehensive logging for RPC and maintain RPC Firewall configurations to reduce false positives. Legitimate activities, such as IT maintenance tasks involving file encryption, might trigger similar alerts. Companion detections, such as monitoring for unusual logins (Event ID 4624) or unauthorized file modifications, could provide enhanced context and coverage against potential abuse.

