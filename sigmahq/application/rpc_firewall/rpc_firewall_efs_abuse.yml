  ### Technical Context

  This Sigma rule detects remote procedure calls (RPC) targeting the Microsoft Encrypting File System Remote (MS-EFSR) service, which may indicate an attempt to exploit the remote encryption functionalities in a malicious manner. The likely objective of an attacker using this technique is to encrypt files on a target system to either disrupt operations or extort the organization through ransom demands. This behavior is relevant to the MITRE ATT&CK framework, specifically the tactic "Lateral Movement" with the technique ID T1021.005 (Remote Services: Remote Procedure Call).

  The primary telemetry source for this detection comes from the RPC firewall, which logs RPC activity to ensure that unauthorized attempts to use the EFSR service are identified. If the behavior is malicious, it could lead to widespread data encryption across systems and significant operational impact. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate remote file encryption operations may also trigger these alerts.

  ### Investigation Steps

  - **Check RPC Firewall Logs for Event ID 3**: Review RPC firewall logs for Event ID 3, filtering for the InterfaceUUIDs `df1941c5-fe89-4e79-bf10-463657acf44d` and `c681d488-d850-11d0-8c52-00c04fd90f7e`, to identify any remote encryption attempts.

  - **Identify Source IP and User Accounts**: Determine the source IP address and user account associated with the RPC call. Legitimate remote access typically originates from known internal subnet ranges, while external or unexpected sources may indicate malicious activity.

  - **Cross-reference with File Access Logs**: Review file access logs on the affected system for unusual access patterns, focusing on operations like encryption (Event ID 4663 – An attempt was made to access an object). Look for events that correlate with the timing of the RPC calls.

  - **Review Active Sessions and Processes**: Examine the active user sessions and running processes on the target machine to identify any unauthorized or suspicious activity, especially during the times when RPC calls were logged.

  - **Assess the Impact of Affected System**: Evaluate the criticality of the affected system—if it hosts sensitive data or critical business functions, it elevates the urgency of response.

  - **Validate against Known Legitimate Use Cases**: Investigate if there are any known maintenance or administrative activities planned that may involve legitimate use of remote encryption services to rule out false positives.

  ### Prioritization

  This alert is considered high severity because it indicates potential lateral movement within the network that could result in data encryption and operational disruptions. Given the context of the behavior targeting remote encryption services, it poses a high likelihood of being weaponized by adversaries, particularly in ransomware attacks.

  ### Blind Spots and Assumptions

  Detection relies solely on the RPC firewall logs, which may be misconfigured or not universally applied across all systems, potentially leading to missed attempts. Additionally, certain legitimate services may generate alerts, such as routine file encryption operations by administrative personnel. A companion detection to consider is tracking unusual authentication patterns (e.g., multiple failed logins) to further assess possible malicious access efforts prior to the encryption attempts.

