  ### Technical Context

  This rule detects remote procedure calls (RPC) aimed at retrieving information about scheduled tasks through the ITaskSchedulerService interface. The likely objective of an attacker is to enumerate existing scheduled tasks on a remote system, which can provide insight into processes that could be leveraged for persistence or lateral movement. This detection aligns with the MITRE ATT&CK technique **Discovery: Scheduled Task/Job Discovery (T1053)**.

  The primary telemetry source is the RPC Firewall, which logs events indicating remote RPC operations. If these remote calls are malicious, they may indicate a reconnaissance phase in an attack lifecycle, allowing an adversary to identify how tasks are set to execute, potentially leading to further compromise. Importantly, this detection alone does not confirm a successful attack or unauthorized access; it solely indicates a query about scheduled tasks occurred.

  ### Investigation Steps

  - **Review RPC Firewall logs for Event ID 3:** Check for entries under the `EventLog` label with Event ID `3`. Look for any unusual source IP addresses targeting critical systems that may not typically be queried for scheduled tasks.

  - **Identify benign RPC queries:** Correlate the detected RPC calls with legitimate administrative activities. For instance, scheduled task queries by known administrative users from trusted IPs should be reviewed and marked as expected behavior.

  - **Evaluate details of the RPC call:** Analyze the `InterfaceUuid` field to confirm it logs activity specifically related to `86d35949-83c9-4044-b424-db363231fd0c`. Any unexpected interaction with this UUID should raise further investigation.

  - **Investigate for high-confidence malicious indicators:** Assess if the detected RPC calls are from lateral movement tools or known exploits. Correlate logs with threat intelligence to identify any patterns linked to malicious actors.

  - **Validate against typical scheduled task patterns:** Use Windows Event ID 4698 to check for legitimate task creation and ensure that the tasks queried align with normal enterprise task schedules, looking for discrepancies in ownership or execution times.

  ### Prioritization

  This alert is of high severity given that it may indicate an attacker probing for critical system details, often a precursor to further exploitation. This behavior could be exploited against high-value targets within the environment. The likelihood of malicious use is significant, as credentialed access provides a pathway to deeper system compromise.

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate administrative tools can also produce similar RPC traffic, potentially causing false positives. Comprehensive telemetry from the RPC Firewall is required for reliable detection; inadequate configurations may miss relevant calls. Activities such as centralized systems administration or maintenance tasks performed by trusted users can trigger this alert. For enhanced coverage, correlate this detection with **T1046: Network Service Scanning**, to look for additional reconnaissance efforts on the network.

