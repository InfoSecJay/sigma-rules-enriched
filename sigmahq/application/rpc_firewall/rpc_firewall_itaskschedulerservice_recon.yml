note: |
  ### Technical Context
  This detection rule identifies unauthorized remote procedure call (RPC) activity that queries scheduled tasks on a Windows system via the ITaskSchedulerService interface. This behavior may be indicative of an attacker attempting to enumerate scheduled tasks, which can reveal critical information such as persistence mechanisms or elevated privileges tied to specific tasks. By exploiting scheduled tasks, an adversary may plan for more complex actions, such as lateral movement or maintaining control over compromised systems.

  Relevant MITRE ATT&CK techniques for this detection include:
  - **T1012: Query Registry** - Adversaries may query for registry settings including scheduled tasks.
  - **T1610: Abuse Elevation Control Mechanism** - The use of scheduled tasks directly can act as a mechanism for privilege escalation.
  - **T1082: System Information Discovery** - Gathering information about system configuration via scheduled tasks falls under discovery techniques.

  Primary data sources for this detection include application logs from the RPC Firewall, which specifically track RPC calls to the ITaskSchedulerService. These logs will preserve evidence of any unauthorized attempts to enumerate and access scheduled tasks remotely.

  ### Investigation Steps
  - **Review RPC Firewall Logs:** Examine logs generated by the RPC Firewall for any Event Logs with Event ID 3 specifically related to the ITaskSchedulerService (UUID: 86d35949-83c9-4044-b424-db363231fd0c) that could indicate unauthorized access attempts.
  - **Analyze RPC Call Operations:** Identify the operation numbers logged (OpNums) to evaluate which specific task-related queries were made. Focus on operations like querying for scheduled task information or modifying them without appropriate authorization.
  - **Identify Source of RPC Calls:** Trace the source of the RPC calls to determine the system or user attempting to access the scheduled task information. Look for anomalies in IP addresses or user accounts that should not be making such requests.
  - **Cross-reference with Task Schedules:** Cross-check the identified scheduled tasks with the normal operational tasks to discern if there is any unexpected or unauthorized task activity, especially those that may reflect an attacker's objectives.

  ### Prioritization
  Alerts generated by this detection rule should be treated with high severity due to the potential for sensitive information exposure and the risk of lateral movement. The likelihood of an attacker using this method to further their objectives necessitates swift investigation and remediation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the need for the RPC Firewall to be properly implemented and logging configured on all relevant systems. The assumption here is that the lack of logs could indicate no malicious activity; however, it could also imply that the RPC Firewall is not enforced or active on certain hosts. Moreover, this detection logic requires that event logging must be enabled for detailed monitoring of RPC interactions; without this, the rule may not function as intended.

