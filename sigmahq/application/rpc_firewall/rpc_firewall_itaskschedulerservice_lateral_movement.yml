  ---

  ### Technical Context

  This Sigma rule detects remote procedure call (RPC) actions that create or execute scheduled tasks on a target system via the ITaskSchedulerService. The likely attacker objective is to move laterally across systems to establish persistence or escalate privileges within the network. This behavior corresponds with the MITRE ATT&CK tactics of **Execution** (TA0002) and **Persistence** (TA0003), specifically the technique **Schedule Task/Job** (T1053.002).

  The primary telemetry source is RPC Firewall logs, specifically monitoring for Event ID 3 related to specific operation numbers targeting the task scheduler interface. If malicious, successful exploitation could lead to unauthorized task execution, allowing the adversary to tip the balance of control over the environment significantly. Importantly, this detection does NOT confirm that a malicious action occurred without further context; benign scheduled task creation or execution may trigger this alert.

  ---

  ### Investigation Steps

  - **Check the RPC Firewall logs:** Review Event IDs that correspond to RPCFW category records, particularly Event ID 3. Look for traces involving InterfaceUuid `86d35949-83c9-4044-b424-db363231fd0c` and operation numbers of 1, 3, 4, 10-15 to validate the alert context.

  - **Identify high-confidence indicators:** Look for suspicious source IPs or accounts in the logs that are not normally associated with task scheduling. The absence of administrative accounts typically used for such actions is a strong indicator of lateral movement.

  - **Confirm legitimate task usage:** Verify if any known administrative accounts or service accounts used legitimate scheduled task actions from the source IP in the recent time frame. This can reduce false positive rates due to automated task scheduling.

  - **Investigate the target system:** Check for new or modified scheduled tasks on the target machine. Use Windows Event ID 4698 to confirm task creation events that align with the capture timeframe of the alerts.

  - **Look for additional context:** Gather information on any preceding events that may indicate an attacker foothold. Network logs showing external IP connections or unusual account activity within the same timeframe can provide additional insights into malicious intent.

  ---

  ### Prioritization

  This alert is categorized as high priority due to the potential impact on critical systems and the likelihood of exploitation by adversaries employing lateral movement techniques. The RPC-based scheduled task manipulation is a commonly weaponized tactic during post-exploitation phases and should be thoroughly investigated to mitigate risks.

  ---

  ### Blind Spots and Assumptions

  Detection is limited as legitimate automated task scheduling could trigger the same alert, particularly in environments running non-standard task jobs. Ensure that RPC Firewall is correctly configured and logs are comprehensive for detection to be reliable. Routine administrative work, such as legitimate patching or maintenance scripts, may also generate similar RPC calls, necessitating careful assessment. A related detection to strengthen coverage includes monitoring for abnormal account usage or failed remote RPC authentications in addition to this rule.

