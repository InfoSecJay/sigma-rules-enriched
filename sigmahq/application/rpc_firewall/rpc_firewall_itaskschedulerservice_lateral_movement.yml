note: |
  ### Technical Context
  This detection rule identifies potential unauthorized lateral movement within an enterprise by monitoring remote Procedure Call (RPC) interactions that involve the Windows Task Scheduler service. Specifically, it tracks attempts to create or execute scheduled tasks on remote systems, a technique commonly exploited by attackers to gain persistence or execute commands across the network without triggering typical defenses. The threat scenario suggests that an adversary may be leveraging this functionality to deploy malware, maintain backdoor access, or manipulate system configurations across multiple endpoints.

  In terms of the MITRE ATT&CK framework, this activity aligns with the following tactics and techniques:
  - **Lateral Movement**: T1021 (Remote Services)
  - **Privilege Escalation**: T1053 (Scheduled Task/Job)
  - **Execution**: T1053.002 (Scheduled Task)

  The primary data sources for this rule include logs generated by an RPC firewall that document RPC calls, specifically focusing on the EventLog category and Event ID 3, which highlights interactions with the Task Scheduler service.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Analyze the logs from the RPC Firewall to identify all instances of Event ID 3 where a scheduled task was created or executed remotely. Pay close attention to the Interface UUID and the operational numbers associated with these events.
  - **Examine Process Activity**: Investigate the processes that were associated with the remote RPC calls to determine if any suspicious or unknown executables were involved in the scheduled task creation or execution.
  - **Check for Unusual Tasks**: Use tools to enumerate scheduled tasks across affected systems and compare them to compliance baselines. Look for tasks with unusual names, command arguments, or execution times that deviate from the norm.
  - **Monitor User Activities**: Analyze user logins and account usage patterns around the time of the detected activity. This can help identify if compromised credentials were used to initiate the RPC calls.

  ### Prioritization
  This alert is categorized as high severity because the ability to remotely create or execute scheduled tasks poses a significant risk, potentially allowing attackers to maintain long-term access to affected systems and execute malicious activities without detection.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on the RPC firewall and its specific configurations; if the firewall is not properly enforced across all endpoints or if it is misconfigured, this detection might be ineffective. The detection logic assumes that all relevant logs are enabled and accessible, particularly those related to RPC calls. If log retention policies do not cover the timeframe of interest, critical evidence may be lost. Additionally, the ability of attackers to use legitimate scheduled tasks could lead to false positives if authorized users also initiate such actions.

