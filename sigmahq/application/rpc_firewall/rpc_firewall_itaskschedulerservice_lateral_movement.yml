note: |
  ### Technical Context

  This Sigma rule detects remote Procedure Call (RPC) activities that involve creating or executing scheduled tasks on one machine from another, specifically targeting the ITaskSchedulerService. The likely attacker objective is to maintain persistence and execute commands remotely on compromised systems, a tactic commonly used for lateral movement within the network. Relevant MITRE ATT&CK tactics include **Persistence (T1053)** and **Lateral Movement (T1053.002)**. The primary telemetry sources include RPC logs, particularly those generated by an RPC firewall designed to audit and block such activities.

  If successful, this behavior could allow an attacker to execute malware or scripts across systems, escalating their control over the environment. It is crucial to note that this detection alone does not confirm malicious intent; legitimate administrative actions may also trigger similar RPC calls.

  ### Investigation Steps

  - **Validate Event Logs from RPC Firewall**: Check RPC Firewall logs for Event ID 3 with Interface UUID `86d35949-83c9-4044-b424-db363231fd0c`. These logs will indicate remote calls related to task scheduling.

  - **Look for unusual OpNum values**: Review the OpNum field in the logs for values 1, 3, 4, 10-15 which signify task creation or execution. A consistent pattern may indicate malicious behavior.

  - **Identify user context of RPC calls**: Examine the initiating user’s context in the RPC logs. Unexpected accounts or service accounts initiating these calls may reflect suspicious activity.

  - **Cross-reference scheduled tasks on target systems**: Use tools like PowerShell to list scheduled tasks on the target system (e.g., `Get-ScheduledTask`). Look for tasks created around the same time as suspicious RPC calls. Legitimate IT operations will exhibit standard patterns without abnormal task execution requests.

  - **Review source IP addresses**: Analyze the originating IP addresses of the RPC calls to determine if they correlate with known internal administrative systems or if there are anomalies (e.g., access from anomalous segments of the network).

  - **Assess criticality of impacted hosts**: Evaluate the role of the host where the scheduled tasks were created. Systems with high criticality require immediate attention due to increased potential impact.

  ### Prioritization

  This alert is considered **high severity** as it indicates a possible lateral movement attempt by an adversary aiming to establish persistence or control over critical systems. The nature of RPC calls used for scheduled tasks is commonly weaponized, making this behavior both suspicious and pertinent to network security.

  ### Blind Spots and Assumptions

  Detection may be limited if the RPC firewall is not uniformly deployed or configured, potentially allowing malicious traffic to bypass logging. Legitimate scheduled tasks triggered by systems management tools may also produce false positives. A related detection could involve monitoring for actual changes in system scheduled tasks following an RPC alert, providing additional context for the potential malicious activity.

