note: |
  ### Technical Context

  This Sigma rule detects unauthorized remote procedure calls (RPC) aimed at collecting information from the Windows Registry, using operations that typically query data or modify configurations. The likely attacker objective is reconnaissance or lateral movement, as adversaries exploit sloppy administrative practices to profile systems or escalate privileges. This behavior aligns with the MITRE ATT&CK tactic of Discovery (TA0007) and techniques such as Remote System Discovery (T1018).

  The primary telemetry source is the RPC Firewall logs, specifically Event ID 3, which captures blocked calls that interact with the Registry through defined UUIDs. If malicious, this activity may indicate an attacker probing for sensitive information or seeking to manipulate system settings remotely. Importantly, this detection does not confirm whether the action resulted in data exfiltration, nor does it assess intent without further context.

  ### Investigation Steps

  - **Review RPC Firewall logs for Event ID 3**: Check RPCFW logs for blocked calls matching the specified InterfaceUuid (338cd001-2244-31f1-aaaa-900038001003). Filter by OpNum to identify anomalies, such as operations typical in reconnaissance (e.g., querying system configurations).

  - **Identify the source of the calls**: Correlate Event ID 3 with network logs or endpoint logs to determine the originating IP address or user account attempting the RPC. Investigate if the source matches expected administrative hosts or user behavior.

  - **Determine legitimate activity context**: Assess if the legitimate administrative tasks are being conducted, such as remote registry editing by trusted system administrators. Analyze timestamps and user accounts to verify expected usage patterns.

  - **Cross-reference with other event logs**: Look at Security Event ID 4624 (logon events) or Sysmon Event ID 1 (process creation) around the same timestamp to identify any potential unauthorized access or processes that may be linked to the RPC calls.

  - **Validate high-confidence malicious indicators**: Investigate unauthorized user accounts attempting RPC calls, particularly those outside normal operational hours or originating from unusual locations. Review previous activity associated with the user or host.

  ### Prioritization

  This alert is considered high severity due to the potential for unauthorized access to sensitive registry information. Given the typical use of registry queries in lateral movement tactics, any RPC calls that trigger this detection should prompt immediate investigation, particularly on high-value assets.

  ### Blind Spots and Assumptions

  Detection may be limited by environmental factors, including misconfigured or unmonitored RPC Firewall settings that fail to capture all relevant RPC activity. Legitimate remote management tools may trigger this alert, requiring analysts to differentiate between authorized support actions and suspicious behavior. Companion detections, such as monitoring for unusual logon behavior (e.g., atypical account usage or failed login attempts), can supplement data integrity and improve context for investigations.

