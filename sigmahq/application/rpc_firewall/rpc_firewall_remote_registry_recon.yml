  ### Technical Context
  This rule detects unauthorized remote procedure calls (RPC) aimed at the Windows Registry. The primary focus is on identifying potential reconnaissance activity where attackers may be attempting to gather sensitive information about system configurations or user accounts. The exploitation of RPC calls can facilitate lateral movement and provide attackers insights into the system environment, which may be leveraged for further attacks, such as privilege escalation or data exfiltration.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **T1071.001: Application Layer Protocol: Web Protocols**, which covers the use of well-known application protocols for communication.
  - **T1087.001: Account Discovery: Local Account** which involves obtaining information about local accounts via various methods, including RPC.
  - **T1012: Query Registry**, as the actions observed could involve querying registry keys to collect system information.

  Primary data sources for this detection include RPC firewall logs that capture events related to remote access attempts, specifically focusing on EventID 3 where notable operations against the registry are logged.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Examine the RPC firewall logs for EventID 3 with the specified InterfaceUuid (338cd001-2244-31f1-aaaa-900038001003) to identify any unauthorized remote registry access attempts.
  - **Analyze Operation Numbers**: Check logs for specific OpNum values (such as 6, 7, or 22) that may indicate probing or enumeration behavior, and ensure that they are not coming from legitimate administrative processes.
  - **Cross-Reference User Activity**: Correlate the timestamps of detected RPC calls with administrative events and user activity logs to determine if the calls were legitimate or part of a suspicious pattern.
  - **Assess Network Connections**: Investigate any unusual outbound or lateral connections during the times of detection, particularly focusing on RPC-related traffic, to trace potential attacker actions.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of unauthorized access to registry information, which could allow attackers to gain insights into the environment and execute further attacks, increasing the likelihood of a successful breach.

  ### Blind Spots and Assumptions
  Potential gaps exist in detecting all methods of lateral movement, particularly if attackers use processes outside of the monitored RPC calls. The detection logic assumes that legitimate remote registry administration is infrequent and may incorrectly flag valid administrative actions. It requires that all systems utilize the RPC Firewall configured to capture and block these events adequately, ensuring that appropriate logging is in place to facilitate this detection.

