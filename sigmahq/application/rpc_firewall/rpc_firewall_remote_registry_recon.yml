  ---

  ### Technical Context

  This rule detects unauthorized remote procedure calls (RPC) targeting the Windows Registry through specific RPC operation numbers associated with information gathering, such as querying system configurations or user account details. The likely attacker objective is to gather data that could facilitate further exploitation, lateral movement, or privilege escalation within the target environment. This behavior aligns with the MITRE ATT&CK framework under the Discovery tactic (TA0007), specifically the Remote System Discovery technique (T1016).

  The primary telemetry source is RPC Firewall logs, particularly Event ID 3 from the RPCFW application, which captures blocked RPC calls aimed at registry interfaces identified by the UUID `338cd001-2244-31f1-aaaa-900038001003`. If successful, this could allow an adversary to compile sensitive system information. Importantly, this detection alone does not confirm malicious activity since legitimate remote administration might trigger similar alerts.

  ---

  ### Investigation Steps

  - **Identify blocked RPC calls:**
    Review RPCFW logs (Event ID 3) for blocked RPC calls using InterfaceUuid `338cd001-2244-31f1-aaaa-900038001003`. Look for OpNum values indicating registry queries (6, 7, 8, etc.).

  - **Correlate with known administrative activities:**
    Cross-reference timestamps of blocked calls with legitimate maintenance schedules or documented remote administration tasks. Verify if the source IP or account is authorized.

  - **Assess the source of the RPC call:**
    Investigate the originating device or user account generating the requests. Use logon events (Security Event ID 4624) to validate if the account is typically associated with administrative tasks.

  - **Review session-based activity:**
    Check for concurrent or past events in logs (e.g., Process Creation logs - Security Event ID 4688 or Sysmon Event ID 1) to identify if these RPC calls are part of a broader malicious activity, such as executing unauthorized scripts.

  - **Look for indicators of compromise:**
    Identify patterns of unauthorized access or unusual account behavior. Search for evidence of unauthorized accounts or known malicious IPs that may have attempted these RPC calls.

  ---

  ### Prioritization

  This alert is high severity due to the potential for sensitive information to be accessed, which may facilitate further malicious actions within the network. The likelihood of this behavior being exploited by attackers is high, especially in environments where lateral movement is prevalent. These RPC calls can be strategically weaponized as part of reconnaissance efforts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured RPC Firewalls leading to false negatives, as legitimate remote administration activities can also trigger alerts. Administrators using tools such as PowerShell may inadvertently generate similar RPC calls during legitimate tasks. To strengthen detection coverage, implement log analysis for other discovery tactics, such as network scanning (T1046) or remote file access (T1105).

