note: |
  ### Technical Context

  This rule detects remote Procedure Call (RPC) activity indicative of SharpHound’s use for reconnaissance, specifically targeting remote connections and local group memberships within an Active Directory environment. The likely objective of an attacker using SharpHound is to map the relationships and permissions of users and machines, facilitating lateral movement and privilege escalation (MITRE ATT&CK: Discovery - Account Discovery, T1087). The primary telemetry source is the RPC Firewall, which logs specific RPC call attempts based on predefined UUIDs and operation numbers. If malicious, this behavior could allow an attacker to compile sensitive information about the network's structure, potentially leading to further exploitation. Importantly, this detection does not confirm malicious intent on its own; it only indicates that a suspected reconnaissance action has occurred.

  ### Investigation Steps

  - **Review RPC event logs:** Access RPC Firewall logs (Event ID 3) for entries matching `InterfaceUuid` 6bffd098-a112-3610-9833-46c3f87e345a and `OpNum` 2. Identify the initiating source and the targeted hosts.

  - **Confirm the legitimacy of the initiating entity:** Check if the source IP is a known asset within your network. Use inventory records to verify if it's authorized to perform RPC calls.

  - **Analyze event timestamps and frequencies:** Look for patterns in the event logs, such as repeated calls within a short time window, which could indicate automated scanning or aggressive discovery attempts.

  - **Identify user accounts and privileges involved:** Investigate which user account initiated the RPC request and correlate with Active Directory logs for any prior suspicious activities (check Security Event IDs 4624/4625).

  - **Verify expected behavior for application context:** Determine if there are legitimate uses of RPC by internal tools or scheduled tasks during the alert timeframe. Compare inbound and outbound network traffic for known service communications.

  - **Cross-reference with other detection mechanisms:** Review the output of security tools such as SIEM or EDR solutions to check for any lateral movement detection or alert instances around the same time as the RPC event.

  ### Prioritization

  This alert is high-severity due to the potential impact on sensitive resources and the high likelihood that such behaviors are used in lateral movement by adversaries. SharpHound is commonly weaponized by attackers for enumeration purposes, making this detection critical for immediate investigation.

  ### Blind Spots and Assumptions

  Limitations include the possibility of legitimate admins using RPC for necessary tasks, which may trigger this rule. Reliable detection requires proper configuration of the RPC Firewall's logging capabilities to capture the relevant events. Another legitimate activity might include system updates or automated administrative scripts utilizing RPC calls. Companion detections around lateral movement or unusual account logins (e.g., T1075 - Pass the Hash) will help validate malicious behavior in conjunction with this alert.

