note: |
  ### Technical Context
  This rule detects the usage of remote RPC (Remote Procedure Call) calls commonly associated with the SharpHound tool, which is used for reconnaissance within Windows Active Directory environments. SharpHound gathers information on group memberships and network connections between machines, aiding attackers in mapping the target environment to facilitate further exploitation. The primary objectives of an attacker utilizing SharpHound are to uncover privileged users, sensitive systems, and lateral movement paths that could be exploited to escalate access or conduct further attacks.

  In terms of the MITRE ATT&CK framework, this rule aligns with the **Discovery** tactic (T1087) and is specifically related to the technique of **Account Discovery** (T1087). By monitoring for specific RPC calls, this detection can highlight potentially malicious reconnaissance activities initiated by adversaries within the network.

  The primary data sources to support this detection include logs from an RPC firewall configured to capture and analyze remote procedure calls, specifically focusing on Event ID 3, which indicates activity relevant to the SharpHound tool's attempts to probe accounts and their group memberships.

  ### Investigation Steps
  - **Review RPC Logs:** Examine the RPC firewall logs for Event ID 3 related to Interface UUID `6bffd098-a112-3610-9833-46c3f87e345a` to identify potential reconnaissance activity originating from SharpHound.

  - **Analyze Source IPs:** Investigate the source IP addresses associated with the detected RPC calls to determine if they belong to legitimate user devices or potential unauthorized users.

  - **Check Active Directory Activity:** Review any recent changes in Active Directory, focusing on group memberships and user accounts that may indicate exploitation of discovered information.

  - **Evaluate Lateral Movement:** Look for abnormal traffic patterns or signs of lateral movement within the network associated with the users or devices identified in the RPC log analysis.

  ### Prioritization
  The alert has been deemed high severity due to the potential impact of reconnaissance activities on an enterprise environment. Successful mapping of Active Directory could lead to significant security breaches if attackers leverage the information for privilege escalation or lateral movement.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage may arise from environments that do not utilize the RPC firewall; this rule relies on having it installed and configured correctly to capture the relevant logs. Additionally, the detection logic assumes that all RPC calls should be blocked, except those explicitly whitelisted, and any deviations from standard configurations may lead to false negatives in detection. Lastly, proper log retention and collection of RPC-related events are necessary for this alert to function effectively; without these logs, the detection may not properly trigger on actual reconnaissance activities.

