  ### Technical Context

  This Sigma rule detects remote procedure calls (RPC) to read information about scheduled tasks, specifically targeting the AtScv interface. These RPC calls can indicate an attacker attempting to discover scheduled tasks on a target system to gather information for further exploitation or lateral movement. The relevant MITRE ATT&CK tactic is **Discovery**, with the technique identified as **Scheduled Task Discovery (T1053)**.

  The primary telemetry source is the RPC Firewall logs, specifically looking for Event ID 3 associated with the given Interface UUID. If these RPC calls are executed by an unauthorized user or from an unusual location, it can signify malicious intent, posing risks such as data exfiltration or initial access. However, it is important to note that this detection does not confirm that an attacker successfully exploited a vulnerability or executed a subsequent action.

  ---

  ### Investigation Steps

  - **Review RPCFW logs for Event ID 3:** Check for logs from the RPC Firewall indicating RPC calls broken down by source IP, user account, and timestamp. Pay attention to unexpected source IPs or accounts which could indicate malicious reconnaissance.

  - **Identify the source IP and user account:** Look for anomalous IP addresses that do not belong to your internal network or known administrative accounts. Legitimate scheduled task inquiries typically come from management systems, not external IPs.

  - **Cross-reference scheduled tasks on the target system:** Use PowerShell or Task Scheduler to list scheduled tasks (`Get-ScheduledTask`) and verify if expected management activities align with the log entries. Expect legitimate queries to stem from known administrative tasks.

  - **Correlate with other logs for lateral movement:** Check for other suspicious activities, such as unauthorized access attempts in Security Event ID 4625 (failed logins) or unusual process creation (Event ID 4688 or Sysmon Event ID 1) that coincide with the timing of the RPC call.

  - **Verify legitimate activity patterns:** Confirm that management tools or administrative hosts regularly query scheduled tasks. Genuine admin account activity will be routine and identifiable; deviations may indicate misconfigurations or fishing attempts.

  ---

  ### Prioritization

  This alert should be considered high priority due to the potential for discovery activities leading to further exploitation. The impact is significant, especially if the targeted system hosts critical applications or sensitive data. Since this method of reconnaissance is often used as a precursor to more intrusive attacks, timely investigation is essential.

  ---

  ### Blind Spots and Assumptions

  The detection may miss certain evasion techniques such as using alternate RPC interfaces or tunneling through trusted channels. Reliable detection necessitates appropriate configurations for the RPC Firewall, and if misconfigured, it could lead to unmonitored RPC traffic. Legitimate scheduled task queries from automated scripts or tools may trigger this alert, requiring careful analysis. Additionally, companion detections, such as monitoring for abnormal task creation events or unexpected administrative activity, can improve coverage against these tactics.

