note: |
  ### Technical Context
  This detection rule identifies attempted remote reconnaissance activities targeting scheduled tasks within the Windows environment via RPC calls. Specifically, it monitors for Remote Procedure Call (RPC) requests made to the `AtScv` interface to retrieve information on scheduled tasks. Attackers may utilize this method to enumerate scheduled tasks on remote systems, aiming to create a detailed understanding of the operational environment and potential vulnerabilities to exploit.

  When adversaries leverage techniques such as these, they often seek to gather intelligence about a system's configuration and installed applications to plan further actions, such as persistent access or lateral movement. This behavior aligns with MITRE ATT&CK tactics, specifically "Discovery" (TA0007) and techniques like "Scheduled Task Discovery" (T1053), which highlight the importance of understanding scheduled tasks for exploitation strategies.

  Primary data sources for this detection include RPC firewall logs that capture events related to rejected RPC calls, particularly those involving scheduled tasks. This can be critical for identifying early indicators of reconnaissance or scanning before an actual compromise occurs.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Check logs from the RPC firewall for EventID 3 to identify any failed requests that may indicate unauthorized attempts to access scheduled task information.
  - **Correlate with Process Activity**: Analyze related process creation events to identify if any processes were executing potentially malicious behavior during the time of the detected RPC calls. Look for known tools or scripts common to reconnaissance activities.
  - **Examine User Accounts**: Investigate the user accounts associated with the RPC requests. Assess whether these accounts have legitimate access privileges or if they may have been compromised.
  - **Check Scheduled Tasks**: Explore the scheduled tasks on the affected systems to determine their legitimacy and relevance. Look for any tasks that were recently added or modified, which may correlate with the detected reconnaissance activity.

  ### Prioritization
  This alert is of high severity in an enterprise environment due to its potential indication of reconnaissance activities carried out by an attacker. The ability to enumerate scheduled tasks can provide valuable insights into a network's configuration and vulnerabilities, setting the stage for further exploitation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if the RPC firewall is not installed or configured correctly on all relevant systems, which could lead to undetected reconnaissance activities. The detection logic assumes that RPC calls to the `AtScv` interface are indicative of malicious behavior, but benign applications or administrative actions may also trigger these events. Additionally, successful logging and collection of RPC firewall data are necessary for this alert to function effectively, requiring proper configurations to ensure all relevant events are recorded.

