note: |
  ### Technical Context

  This Sigma rule detects unauthorized remote procedure calls (RPC) made to access details of scheduled tasks on Windows systems using the Automation Task Scheduler (AtScv) interface. This behavior is often indicative of an attacker attempting to gather information about scheduled tasks, which may be leveraged for lateral movement or persistence strategies. The likely attacker objective is reconnaissance, gathering insight into existing scheduled tasks that may contain credentials or scripts serving as entry points for further attacks.

  The relevant MITRE ATT&CK techniques are **Discovery - T1083: File and Directory Discovery**. The primary telemetry source for this detection is derived from logs generated by the RPC Firewall and consists of Event ID 3, which indicates RPC calls. If malicious, this behavior can allow an adversary to escalate their attack or facilitate a lateral movement within the network. However, this detection does NOT confirm whether an actual malicious act followed the reconnaissance; it merely highlights potential unauthorized access attempts.

  ### Investigation Steps

  - **Review RPC Firewall Logs:** Examine logs with Event ID 3 from the RPC Firewall. Look for entries with `InterfaceUuid: 1ff70682-0a51-30e8-076d-740be8cee98b`, which indicates RPC calls related to the task scheduler.

  - **Identify Malicious Patterns:** Check for anomalous operation numbers (OpNum 0 or 1) that deviate from normal task management behavior. Legitimate operations are typically event-driven and come from known system processes whereas deviations may indicate reconnaissance or exploitation attempts.

  - **Determine Source of RPC Call:** Cross-reference the source IP and user account making the RPC request. Unrecognized users or devices, especially external IPs, should be considered high-risk indicators.

  - **Validate Legitimate Activity:** In a normal operational environment, scheduled task accesses are typically initiated by system administrators or during patching activities. Compare timestamps and source IDs against known schedules or maintenance windows to identify expected behavior.

  - **Assess Target System Role:** Evaluate the role of the affected system (e.g., domain controller vs. endpoint) as an attacker may prioritize sensitive systems for information on scheduled tasks for lateral movement.

  - **Monitor for Further Commands:** If there are subsequent RPC calls or other suspicious activity from the same source after this detection, escalate to a more comprehensive investigation, as repeated access attempts may indicate an ongoing compromise.

  ### Prioritization

  This alert is high priority due to the potential impact on sensitive systems containing vital scheduled tasks. The likelihood of malicious abuse is significant, as attackers often employ reconnaissance techniques to facilitate lateral movement or privilege escalation within networks. The ability to query scheduled tasks could directly lead to compromising critical infrastructure.

  ### Blind Spots and Assumptions

  Detection is limited as attackers could potentially evade this by using different RPC methods or scripting tools to query tasks without triggering this specific rule. The RPC Firewall must be properly configured and deployed across all relevant endpoints for consistent coverage. Legitimate administrative tasks or software management tools may trigger this alert, especially in environments where such tools access task schedules. Companion detections include monitoring for unauthorized task creation or modification events, which can further help correlate malicious intents.

