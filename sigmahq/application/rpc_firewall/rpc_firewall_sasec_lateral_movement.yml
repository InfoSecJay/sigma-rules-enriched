note: |
  ### Technical Context

  This Sigma rule detects unauthorized remote procedure calls (RPCs) used to create or execute scheduled tasks via the SASec interface, which is commonly exploited by attackers for lateral movement and persistence in a compromised environment. The likely objective of the adversary is to leverage scheduled tasks for executing malicious code on remote systems, thereby maintaining control or facilitating further attacks. This behavior aligns with the MITRE ATT&CK techniques T1053 (Scheduled Task/Job) and T1053.002 (Windows Task Scheduler), pertinent for escalation and lateral movement activities.

  The primary telemetry sources include RPC Firewall logs, specifically looking for EventID 3 with the target Interface UUID related to the task scheduling service. If malicious, this could enable an attacker to remotely execute commands without direct interaction, significantly compromising system integrity. It is essential to note that this detection does NOT confirm an active attack without corroborating evidence, as legitimate RPC calls can trigger the same alert.

  ### Investigation Steps

  - **Check for unauthorized RPC calls:** Query logs for EventID 3 from RPC Firewall (log type: RPCFW) that reference Interface UUID 378e52b0-c0a9-11cf-822d-00aa0051e40f. Look for multiple entries indicating potential automated attempts; such activity may indicate lateral movement attempts.

  - **Identify remote systems involved:** Analyze the originating and destination IP addresses or hostnames in the logs to pinpoint affected systems and assess their criticality. Systems with sensitive data or elevated privileges warrant higher scrutiny.

  - **Corroborate with scheduled task execution:** Review Windows Event Log Security Event ID 4698 for any scheduled task creation associated with the Alert. Compare timestamps to the RPC log entries to establish whether rogue tasks were initiated directly following suspicious RPC calls.

  - **Review legitimate usage patterns:** Establish a baseline of normal scheduled task creation activity in your environment, including regular IT maintenance tasks or software updates, identifying expected users or accounts initiating such tasks.

  - **Examine process execution:** For any identified malign task, monitor Windows Event ID 4688 (Process Creation) for related process execution and check command-line arguments to recognize any misuse of legitimate tools or scripted commands that appear unusual.

  - **Validate against remote management solutions:** If systems utilize legitimate remote management tools (like SCCM or WSUS), ensure that alerts correlate with known operational workflows. This context can help rule out false positives from standard administrative operations.

  ### Prioritization

  This alert is high-severity due to its potential impact on compromised systems within the enterprise. The likelihood of malicious abuse is substantial since such behaviors are frequently observed in advanced attacks, particularly those aiming at lateral movement and persistence establishment. The activity described is a known tactic employed by threat actors, making it critical to address quickly.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, where attackers utilize various methods to disguise RPC calls or employ legitimate admins to run the tasks. Reliable detection requires the RPC Firewall to be implemented and correctly configured across all critical systems. Common legitimate activities include scheduled tasks created for system updates or maintenance, which may generate alerts similarly to malicious attempts. Companion detections, such as monitoring Windows Event ID 4688, can strengthen the ability to identify and respond swiftly to unauthorized access or untrusted operations.

