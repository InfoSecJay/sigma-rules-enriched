note: |
  ### Technical Context
  This detection rule identifies remote procedure call (RPC) attempts aimed at creating or executing scheduled tasks via the SASec service. Such behavior is commonly associated with lateral movement techniques employed by attackers to escalate privileges and maintain persistence within an environment. By leveraging scheduled tasks, attackers can maintain control over compromised systems, ensuring that their malicious payloads are executed at specified intervals or system events.

  The primary motivation for this type of attack is to gain unauthorized access to additional systems within a network, escalate privileges, and establish a foothold that may remain undetected. This aligns with various MITRE ATT&CK tactics and techniques, particularly:
  - **Lateral Movement (TA-0028)**: The attacker seeks to move across systems within a network.
  - **Privilege Escalation (TA-0024)**: The use of scheduled tasks may allow the attacker to execute code with elevated privileges.
  - **Execution (TA-0011)**: The execution of malicious code through scheduled tasks exemplifies how attackers can use built-in system functionalities to run their scripts or binaries.
  - **Persistence (TA-0030)**: Creating scheduled tasks helps attackers maintain their access over time.

  The best data sources for detecting this activity are their RPC logs, particularly focusing on events generated by the RPC Firewall related to task scheduling events.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Examine the RPCFW event logs for Event ID 3 entries that correspond to attempts to create or execute scheduled tasks. Pay close attention to the Interface UUID and OpNum values.
  - **Analyze Scheduled Task Configuration**: Investigate the configuration of scheduled tasks on target systems to assess whether any unauthorized tasks have been created or altered during the timeframe of concern.
  - **Correlate with User Activity**: Cross-reference user activity and access logs to identify any anomalous logins or behaviors that coincide with the RPC events logged. Check for accounts with elevated privileges.
  - **Monitor for Additional Lateral Movement Techniques**: Look for signs of other lateral movement techniques, such as PSExec or WMI activity, which may indicate coordinated efforts to compromise multiple systems.

  ### Prioritization
  This alert is classified as high priority due to the significant risk associated with unauthorized lateral movement within an enterprise environment. The capability to create scheduled tasks can lead to extended system compromise and potential data exfiltration, making timely response crucial.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include environments where the RPC Firewall is not deployed or configured, leading to potential blind spots in monitoring RPC-based interactions. The detection logic assumes that logging is enabled and that there are no gaps in the RPC firewall deployment across all systems. Additionally, the effectiveness of this rule relies on the integrity and maintenance of the logs generated by the RPC Firewall, which must be actively managed and monitored.

