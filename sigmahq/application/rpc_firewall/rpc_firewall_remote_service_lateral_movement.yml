  ---

  ### Technical Context

  This detection identifies the misuse of remote calls to the Microsoft Remote Procedure Call (RPC) interface, specifically targeting the Microsoft Encrypted File System Remote Protocol (MS-EFSR). The likely attacker objective is to facilitate lateral movement within an enterprise environment by unauthorized communication with encrypted data services, which can lead to data exfiltration or further system compromise. This detection aligns with the MITRE ATT&CK technique for Lateral Movement (T1569.002).

  The primary telemetry source is the RPC Firewall application, monitoring for specific Event IDs associated with RPC communication. If the detected behavior is malicious, there’s a significant security impact as it may indicate an attacker moving laterally to exploit encrypted resources. However, this detection does NOT confirm the malicious intent on its own, as legitimate administrative activities may also trigger the same alert.

  ---

  ### Investigation Steps

  - **Review RPC Firewall Logs:**
    Check for EventLog entries with EventID: 3 in the RPCFW logs. Note attributes such as Source IP and Target Host; legitimate administrative actions may originate from known management workstations.

  - **Identify the RPC Call Context:**
    Inspect the InterfaceUuid field for calls to 367abb81-9844-35f1-ad32-98f038001003. Confirm whether the source is a non-admin context or an unusual endpoint which could indicate a threat actor's presence.

  - **Correlate with Network Traffic:**
    Examine associated network logs for RPC traffic anomalies. Look for unusual source-destination pairings or heavy usage of RPC, suggesting enumeration or lateral movement attempts.

  - **Cross-Reference User Activities:**
    Validate the source user account against normal behavior patterns. Identify any deviations, such as using multiple systems in rapid succession without legitimate administrative needs.

  - **Assess Endpoint Role:**
    Determine the role of the affected endpoint; if it's a sensitive system (e.g., a domain controller), prioritize investigation into any detected RPC anomalies for potential compromise.

  - **Look for EFSR Configuration Changes:**
    Investigate MSPFs (MSRPC protocol functions) to determine if there were alterations in encryption settings or policies. Unexpected changes could point towards an ongoing attack.

  ---

  ### Prioritization

  This alert is of high severity because it concerns potential lateral movement techniques that target critical systems, which can lead to severe data breaches. The likelihood of malicious abuse is notable, as the misuse of RPC calls is a known tactic in sophisticated attacks. Furthermore, the behavior is often weaponized in targeted environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to reliance on the RPC Firewall’s configuration, and a lack of comprehensive logging could result in undetected abuses. Administrative actions, such as legitimate server management, could generate false positives. Monitoring logs from related processes or services, such as SMB shares or RDP sessions, can enhance detection and provide a broader context of network activities associated with lateral movement attempts.

