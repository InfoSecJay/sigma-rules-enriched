note: |
  ### Technical Context

  This rule detects the abuse of the Remote Procedure Call (RPC) mechanism to potentially exploit the Microsoft Encrypted File System Remote (MS-EFSR) service. The likely attacker objective is to perform lateral movement within a network by invoking RPC calls to access or manipulate encrypted data on remote servers. This behavior is associated with the MITRE ATT&CK techniques for Lateral Movement (T1569.002) and Execution.

  The primary telemetry source for this detection is the RPC Firewall, specifically focusing on Event Log entries related to RPC calls, particularly Event ID 3. If this behavior is malicious, it can lead to unauthorized access to sensitive data and further compromise of network resources. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks may also generate similar alerts.

  ### Investigation Steps

  - **Check RPC Firewall Logs:** Review RPC Firewall logs for Event ID 3 entries from the log source `rpc_firewall`. Look for high-frequency or unusual patterns of remote RPC calls, indicating potential lateral movement.

  - **Identify Legitimate Use Cases:** Verify the context of the RPC calls by cross-referencing user account activity and the corresponding timestamps. Administrative tasks performed during normal business hours can indicate benign activity.

  - **Examine Source and Destination Systems:** Look at the source and destination IP addresses associated with the RPC calls. Identify whether the source is a known administrative host or an unexpected system.

  - **Evaluate Related Processes:** Investigate processes associated with the RPC calls using any installed process monitoring tools (e.g., Sysmon). Identify unusual parent-child process relationships to determine if the calls are initiated by known good processes.

  - **Correlate with User Accounts and Roles:** Determine if the account initiating the RPC calls has administrative privileges. Malicious lateral movement typically involves accounts with elevated privileges accessing sensitive resources.

  - **Verify EFSR Service Status:** Check the status of the Microsoft EFSR service on target systems. Legitimate service operations will show expected activity patterns, while anomalous RPC calls may indicate exploitation attempts.

  ### Prioritization

  This alert should be prioritized as high due to its potential impact on sensitive data access and the likelihood of exploitation by attackers. The misuse of RPC for lateral movement is a common tactic during network breaches, warranting immediate analyst attention to prevent further compromise.

  ### Blind Spots and Assumptions

  Detection may be limited if the RPC Firewall is not installed or improperly configured on critical systems. Evasion techniques such as valid administrative workflows can trigger this alert. Legitimate activities may involve system administrators performing necessary remote tasks. A related detection for completeness includes monitoring for unusual user logons or access attempts following RPC calls, enhancing visibility of possible lateral movement activities.

