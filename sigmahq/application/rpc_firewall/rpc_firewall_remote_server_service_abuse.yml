  ### Technical Context

  This Sigma rule detects potentially malicious remote procedure calls (RPC) targeting the Microsoft Server Service (MS-SRVS), which could indicate attempts to abuse remote encryption services. The likely attacker objective is to exploit the RPC interface to execute unauthorized commands or access sensitive resources on targeted systems. This behavior aligns with the MITRE ATT&CK tactic of Lateral Movement (TA0008) and specifically the technique of Remote Procedure Call (RPC) (T1210).

  Primary telemetry sources include RPC Firewall logs, specifically looking for Event ID 3, along with the defined InterfaceUUID for MS-SRVS. If malicious, such activities can compromise system integrity, leading to unauthorized data access or lateral movement within the network. However, this detection alone does not confirm the intent behind the RPC calls, as legitimate activities can also trigger the same events.

  ### Investigation Steps

  - **Review RPC Firewall logs for Event ID 3:** Check RPC Firewall logs for occurrences of Event ID 3, filtering by InterfaceUUID 4b324fc8-1670-01d3-1278-5a47bf6ee188 to focus on MS-SRVS calls. Identify the source IP addresses and user accounts involved in the requests.

  - **Correlate with known benign activities:** Look for patterns of legitimate remote share creation in your environment. Document typical source IPs and accounts that legitimately initiate RPC calls to ensure you can distinguish from potentially malicious activity.

  - **Identify high-confidence malicious indicators:** Look for anomalous activity like RPC calls originating from unexpected or high-risk systems (e.g., a non-admin user on a workstation making RPC calls to domain controllers). Note the source process names in these instances, as they may indicate malicious tools.

  - **Check for abnormal destination services:** Validate if the RPC calls are targeting unexpected or sensitive systems that do not typically see RPC traffic from the originating IP. Use network logs to trace unusual destination patterns.

  - **Assess associated user behavior:** Review user activity around the time of the alert for signs of credential misuse or privilege escalation. Check for recent account creations, privilege changes, or unusual login times.

  - **Confirm active connections and data transfer:** For detected suspicious activity, verify ongoing connections and any data transfer logs. Use Netstat or similar commands on the affected hosts to confirm persistent connections to the RPC service.

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on sensitive systems and the likelihood of malicious use of the RPC service for lateral movement. RPC abuses exploit a widely known vulnerability, making this behavior a common method for attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of correctly configured RPC Firewall logs or in environments lacking adequate logging policies. This alert may also trigger from legitimate administrative activities, such as group policy updates. A related detection to strengthen coverage would be monitoring for unusual access patterns tied to account management events or failed login attempts, further indicating potential account compromise or lateral movement.

