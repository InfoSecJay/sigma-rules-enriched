note: |
  ### Technical Context
  This rule detects potentially malicious remote procedure calls (RPC) aimed at modifying registry keys on systems, a behavior indicative of lateral movement by attackers. By executing RPC commands designed to alter the registry, an attacker may gain persistence or execute additional payloads across the network. The objective of this technique is often to escalate privileges or maintain access to compromised systems by manipulating system settings or configurations.

  The relevant MITRE ATT&CK tactics and techniques are:
  - **Lateral Movement** (TA0008)
    - **Remote Services** (T1021)
    - **Internal Spearphishing** (T1203)
    - **Exploitation of Remote Services** (T1210)
  - **Persistence** (TA0003)
    - **Registry Run Keys / Startup Folder** (T1060)

  Primary data sources for this rule include logs from the RPC firewall, specifically those that monitor RPC calls, which will detail the types of RPC operations being executed and their associated Event IDs.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Analyze the RPCFW EventLogs for EventID 3 related to suspicious RPC calls targeting the registry. Check for interface UUID 338cd001-2244-31f1-aaaa-900038001003 to identify specific operations that were executed.
  - **Examine Source and Destination IPs**: Investigate the source and destination IP addresses initiating these RPC calls to determine if they align with known administrative tools or are indicative of unauthorized access attempts.
  - **Cross-reference with Active Directory Logs**: Look for anomalies in Active Directory logs that may indicate lateral movement or privilege escalation attempts correlating with the detected RPC activity.
  - **Correlate with Other Logs**: If available, correlate findings with logs from EDR, SIEM, and process creation events to detect any subsequent suspicious activity or processes spawned as a result of the detected RPC calls.

  ### Prioritization
  This alert is classified as high severity due to the potential for undetected lateral movement and persistence mechanisms the attacker could establish through unauthorized registry modifications, which significantly increase the risk exposure of the enterprise network.

  ### Blind Spots and Assumptions
  There may be detection gaps arising from legitimate administrative tasks that utilize the RPC calls detected by this rule, potentially leading to false positives. The detection relies on the operation of the RPC firewall and the consistent collection of relevant logs; if the firewall is not deployed across all relevant systems or if logs are not adequately retained, the rule may fail to detect actual malicious activity. Assumptions include that attackers will utilize the specific interface UUID monitored and that RPC sessions will not be obfuscated or encrypted in a manner that evades detection.

