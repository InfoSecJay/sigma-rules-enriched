note: |
  ### Technical Context

  This Sigma rule detects remote procedure calls (RPC) that modify the Windows registry, which is often used by attackers for lateral movement (MITRE ATT&CK Tactic: Lateral Movement, Technique: T1112). The likely attacker objective includes executing arbitrary code on a remote system by modifying registry settings, potentially establishing persistence or controlling victims' systems. The primary telemetry source is the RPC Firewall logging specific Event IDs, particularly Event ID 3, which logs RPC calls to the registry associated with the given UUID and operation numbers.

  If malicious, attackers can exploit this behavior to gain unauthorized access, leading to compromised systems or networks. It is crucial to note that this detection does NOT confirm successful exploitation or malicious intent on its own, as legitimate administrative actions may trigger the detection.

  ### Investigation Steps

  - **Identify the source of the RPC call**: Review RPCFW logs for Event ID 3. Check the source IP and hostname against your organization's asset inventory to determine if it's a legitimate administrator or a rogue system.

  - **Correlate with process execution**: Cross-reference any noted Event ID 3 entries with process creation logs (Security Event ID 4688 or Sysmon Event ID 1) to identify suspicious executable names or paths correlated with the remote registry modifications.

  - **Review recent administrative activities**: Investigate registry access patterns around the time of the detected RPC calls for known legitimate actions (e.g., software updates or configuration changes) based on administrative schedules documented in your Change Management system.

  - **Analyze specific operation numbers**: Focus on the operation numbers associated with the log entries (e.g., 6, 7, 18) to determine their intent; higher risk operations may indicate malicious activity, while common operations (like 13 - setting a value) could be benign.

  - **Check for high-confidence malicious indicators**: Look for patterns where Event ID 3 entries occur from accounts with no previous legitimate access to the target registry paths or are linked to known compromised accounts.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on critical systems. The likelihood of malicious use in modern attacks is significant, especially with tools commonly available that leverage remote registry modifications for lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the need for the RPC Firewall to be properly installed and configured on all endpoints, which may not always occur. Legitimate activities such as standard remote administration tasks can trigger this alert, leading to potential false positives. Additionally, monitoring endpoints without the RPC Firewall may miss critical indicators of lateral movement. Related detections, such as network connections from known command-and-control servers immediately following registry modifications, can enhance coverage of lateral movement attempts.

