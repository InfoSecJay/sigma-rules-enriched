note: |
  ### Technical Context

  This Sigma rule detects remote procedure call (RPC) events related to registry modifications that suggest potential lateral movement within the network. Specifically, it targets operations associated with malicious registry access, which is often leveraged by attackers to establish persistence or execute arbitrary code on remote machines. The likely attacker objective is to gain unauthorized access to or manipulate system configurations to facilitate further exploitation.

  This detection is associated with the MITRE ATT&CK tactics of Lateral Movement (TA0008) and Defense Evasion (TA0005) via the Remote Procedure Call method (T1112). Primary telemetry sources include the RPC Firewall application logs, specifically Event ID 3, which records denied outgoing or suspicious RPC requests. If malicious, this action could allow attackers to modify vital system configurations or deploy additional malware. Importantly, this detection does not independently confirm malicious intent—it could be triggered by legitimate remote administration tasks.

  ### Investigation Steps

  - **Check RPCFW logs for Event ID 3:** Review the RPC Firewall logs for Event ID 3 that records blocked RPC calls to registry actions (OpNum: 6, 7, 8, etc.). Identify the source IP and user account to assess if they are known administrative users.

  - **Correlate with system activity:** Look for correlated activity across host logs, such as Security Event ID 4688 (process creation) around the same time as the detected RPC calls. Legitimate administrative actions will show tools like `regedit.exe` or PowerShell commands initiated from a trusted administrative account.

  - **Identify source of RPC calls:** Validate the legitimacy of the source machines making the RPC requests. Check for any unauthorized or anomalous machines (e.g., unrecognized server IPs) communicating with multiple endpoints in a short time.

  - **Examine command execution:** Cross-reference blocked RPC requests with process creation logs (Sysmon Event ID 1) to identify if there was an attempt to execute a suspicious process locally as a follow-up to the RPC call.

  - **Investigate remote administration tools:** Confirm if any remote administration tools (e.g., PsExec, PowerShell Remoting, RDP sessions) are in use by checking for their log artifacts or prior activities that might indicate expected behavior.

  - **Analyze registry changes:** If possible, locate changes made to the registry through Event ID 4657 (registry value modified) or events indicating registry read/write actions that align with normal administrative maintenance versus unexpected alterations.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems if an attacker is manipulating registry settings. The likelihood of malicious abuse is significant, as lateral movement via RPC is a commonly weaponized technique in various attack scenarios. Given the sensitivity of registry keys and the secrets they may store, any unauthorized access poses a serious risk to enterprise security.

  ### Blind Spots and Assumptions

  Detection may be limited by properly configured RPC firewall rules or environments where logging is not adequately capturing RPC traffic. Legitimate activities, such as approved IT management tasks or updates, may trigger this alert. Additionally, relying solely on this detection may miss broader lateral movement behaviors—consider complementary detections targeting process creation and network traffic to strengthen overall detection capabilities.

