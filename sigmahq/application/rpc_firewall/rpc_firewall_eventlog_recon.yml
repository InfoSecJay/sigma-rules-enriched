  ### Technical Context
  This rule detects unauthorized remote procedure call (RPC) requests to access event log information on Windows systems. Specifically, it targets requests using the EVEN and EVEN6 UUIDs which are typically associated with logging and monitoring functionalities. Attackers may leverage this capability to perform reconnaissance on target systems, gaining insights into event logs that could reveal sensitive information about user activity, system configurations, or security controls that can be exploited further.

  The primary threat scenario includes threat actors conducting reconnaissance to gather information about systems and accounts within a network, which is a common precursor to lateral movement or privilege escalation attacks. By looking into event logs, attackers can identify user behaviors, find vulnerabilities, or locate credentials that are managed within the event logging framework. This detection aligns with several MITRE ATT&CK tactics, particularly under **Discovery** (TA0007) and its techniques such as **Local System Discovery** (T1083), which covers gathering system information via legitimate means.

  The best evidence for this detection will typically be found in logs generated by the RPC firewall, specifically those logs that record blocked RPC calls on target systems.

  ### Investigation Steps
  - **Review RPC Firewall Logs**: Analyze logs generated by the RPC firewall for EventID 3 to identify any suspicious remote RPC calls attempting to access event log data.
  - **Correlate with System Logs**: Examine Windows security event logs to identify legitimate administrative activities that may correspond with detected RPC calls, focusing on known administrative accounts and recent system changes.
  - **Identify Anomalous Patterns**: Look for unusual patterns or sources of RPC calls, specifically from IP addresses or accounts that are not typically involved in event log management.
  - **Audit Related Systems**: Investigate adjacent systems or accounts that may have been involved in the reconnaissance activity to ensure comprehensive coverage of the threat, assessing any changes or access attempts.

  ### Prioritization
  The severity of this alert is high due to the potential impact of remote reconnaissance on security posture; unauthorized access to event logs can reveal critical system information useful for further exploitation and lateral movement within the enterprise network.

  ### Blind Spots and Assumptions
  The detection logic may not account for legitimate administrative RPC calls that could trigger the same alerts, leading to false positives. It assumes that the RPC firewall and its logging functionality are correctly implemented across all endpoints. Additionally, without broad coverage of RPC logging on all relevant systems, there may be gaps in detection, particularly if the firewall is not applied uniformly or if certain logs are not collected or retained.

