note: |
  ### Technical Context

  This rule detects remote calls to access Windows Event Log information using Remote Procedure Calls (RPC) via specific GUIDs. Attackers typically aim to gather information about event logs to identify potential weaknesses, misconfigurations, or sensitive information that can aid further exploitation. This behavior falls under the MITRE ATT&CK tactic **Discovery** (TA0007), specifically the technique **Remote System Discovery** (T1219).

  The primary telemetry sources required for detection are RPC Firewall logs that register event events triggered by specified Event IDs (in this case, Event ID 3) when accessing Windows event logs remotely. If malicious, this activity could signal a preliminary stage of lateral movement or reconnaissance efforts against your environment. Importantly, the detection alone does NOT confirm that an actual breach has occurred but rather indicates reconnaissance attempts.

  ### Investigation Steps

  - **Review RPC Firewall logs:** Check for Event ID 3 entries in RPC Firewall logs. Look for remote access attempts associated with Interfaces UUIDs `82273fdc-e32a-18c3-3f78-827929dc23ea` and `f6beaff7-1e19-4fbb-9f8f-b89e2018337c`. Assess the source IPs for known internal vs. external sources.

  - **Identify benign administrative tasks:** Cross-reference the source IPs with authorized administrative workstations. Determine if these IPs align with legitimate administrative access patterns, such as scheduled maintenance or legitimate remote management tasks.

  - **Check for repeated attempts:** Look for patterns indicating repeated failed or successful access to event logs from the same device or user accounts, indicating potential malicious interest. This can be identified by correlating timestamps in Event ID 3 logs.

  - **Validate host activity:** If telemetry indicates access from critical servers (e.g., domain controllers), examine their recent event logs (Security Event ID 4688, Sysmon Event ID 1) for any related suspicious process creation or manipulation that might complement the observed RPC calls.

  - **Correlate with other logs:** Review Windows Security logs for Event ID 4624 (successful logons) near the time frame of RPC Firewall alerts. Look for abnormal login activities, especially from foreign or highly privileged accounts.

  - **Asses high-confidence malicious indicators:** Identify any recorded failed RPC calls exceeding normal thresholds, indicating possible scanning efforts by adversaries, or any anomalously timed requests that lack an administrative context.

  ### Prioritization

  This alert carries a high severity due to the impact of the affected systems, typically domain controllers or other critical servers. The likelihood of malicious abuse is significant, as RPC methods are common in lateral movement strategies. This reconnaissance behavior can be an early indicator of an escalating attack.

  ### Blind Spots and Assumptions

  The detection may be limited by inadequate coverage of all remote access logs if systems are not uniformly monitored or if logging configurations are missing. Legitimate administrative activities, such as maintenance from trusted IT teams, can potentially trigger this alert. It’s advisable to implement companion detections for lateral movement attempts (e.g., suspicious logon events across multiple systems) to strengthen coverage and correlate incidents more effectively.

