note: |
  ### Technical Context

  This Sigma rule detects changes made to the global SSH configuration settings in Bitbucket, which could indicate an adversary's attempt to establish unauthorized access or control over Git repositories. The primary attacker objective is likely to manipulate SSH settings to gain persistent access to sensitive code repositories or to facilitate lateral movement within the network. This behavior falls under the MITRE ATT&CK tactic of "Lateral Movement" (TA0008) and specifically relates to the technique "SSH Hijacking" (T1562.001).

  The primary telemetry source for this detection is Bitbucket's audit logs, specifically those configured at the "Advance" log level to capture critical audit events. If malicious, unauthorized changes to SSH settings could result in compromised access controls, enabling escalated privileges and data exfiltration. However, this detection does not confirm an actual breach or malicious intent without further context; legitimate user activities can also trigger this alert.

  ### Investigation Steps

  - **Verify event timestamp and user identity**: Cross-reference the timestamp of the detected SSH setting change (auditType.action) with user activity logs (Event IDs from Bitbucket audit logs) to ensure the action corresponds with the time a legitimate authorized user was active.

  - **Correlate with user permissions**: Assess the user role performing the change. Review user account permissions in the audit logs (user ID, role fields) to determine if they have the rights to modify global SSH settings. Changes by users lacking appropriate access permissions are considered high-risk.

  - **Check for recent unauthorized activity**: Investigate for any previous alerts or logs indicating suspicious behavior leading up to the change, such as failed authentication attempts or unusual access patterns detected in the Bitbucket logs.

  - **Monitor for simultaneous SSH access requests**: Look for SSH access connections (log fields indicating SSH connection attempts) occurring around the same time as the configuration change. Unexpected simultaneous requests could suggest exploitative activity rather than legitimate usage.

  - **Identify related security measures**: Ensure that two-factor authentication or other access controls are in place for the user who made the changes. Documentation of these measures should exist in relevant Bitbucket security configuration logs.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on sensitive source code management systems. The severity is heightened by the likelihood that an adversary could manipulate SSH settings for malicious access, yet it requires contextual analysis to determine intent. Such behavior is not uncommon in targeted attacks aiming to pivot within an organization.

  ### Blind Spots and Assumptions

  The detection might be bypassed if users have legitimate reasons to modify SSH settings frequently, leading to potential false positives. It's essential to configure the audit logging at an "Advance" level to capture these events reliably. Common benign activities that may trigger this alert include administrative updates by DevOps teams or automated deployment processes. Companion detections could include monitoring for lateral movement attempts following SSH configuration changes, as observed in techniques like "Remote Service Session Hijacking" (T1021.004).

