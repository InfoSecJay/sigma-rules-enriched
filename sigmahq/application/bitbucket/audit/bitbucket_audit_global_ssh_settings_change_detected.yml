note: |
  ### Technical Context
  This detection rule identifies changes to the global SSH access settings in Bitbucket Server, which can indicate potential unauthorized configuration changes by malicious actors. Attackers might aim to gain unauthorized access to repositories, manipulate code, or exfiltrate sensitive information. Adjusting SSH settings can facilitate lateral movement within the organization or evade existing defenses by leveraging SSH for covert communication.

  Relevant MITRE ATT&CK tactics include **Lateral Movement (TA0008)** and **Defense Evasion (TA0005)**, specifically techniques such as **T1021.004 (Remote Services: SSH)**, which describes the use of SSH connections to execute commands on remote machines. Additionally, the rule reflects on **T1562.001 (Implicit Certificate Authorization)** which could be leveraged when making configuration adjustments to avoid detection.

  The primary data source for this rule is the Bitbucket audit logs. These logs must be set to "Advance" log level to capture SSH configuration changes adequately. By monitoring these events, security teams can detect suspicious activities related to SSH access management and follow up on potential compromises.

  ### Investigation Steps
  - **Review Bitbucket Audit Logs:** Collect and analyze Bitbucket audit logs to identify the specific changes made to the SSH settings, noting the user and timestamp associated with the modification.
  - **Cross-Reference User Activity:** Verify the user account that initiated the SSH settings change. Check for any unauthorized or unusual user behavior preceding the change, including failed login attempts or access from unusual IP addresses.
  - **Assess Permission Changes:** Investigate if the global SSH settings change was accompanied by changes in repository permissions or access control lists (ACLs) which can indicate a broader compromise.
  - **Monitor for Unusual SSH Usage:** Look for unusual SSH connection patterns, such as connections from unexpected geographic locations or attempts to access systems using SSH that haven't been reached previously.

  ### Prioritization
  The severity of this alert is medium as changes to SSH settings can significantly impact security posture, enabling unauthorized access to critical repositories. The likelihood of exploitation depends on the user accounts with administrative privileges and their activity patterns.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage if the Bitbucket Server audit logs are not configured to the required "Advance" level, potentially omitting relevant events. It assumes that configuration changes are logged effectively and that only legitimate administrators are allowed to make such changes. Additionally, potential false positives may arise from legitimate user activity within the organization, reflecting authorized changes by system administrators.

