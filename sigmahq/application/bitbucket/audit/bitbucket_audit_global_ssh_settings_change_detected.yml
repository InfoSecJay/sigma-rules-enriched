note: |
  ### Technical Context

  This Sigma rule detects changes to global SSH access configurations in Bitbucket, specifically when the SSH settings are modified. An attacker may manipulate these settings to facilitate unauthorized access or lateral movement within the environment. This behavior primarily aligns with the MITRE ATT&CK tactics of lateral movement (TA0008) and defense evasion (TA0005), specifically techniques T1685 (Application Layer Protocol) and T1021.004 (Remote Services: SSH).

  The primary telemetry source for this detection is the Bitbucket audit log, requiring the "Advance" log level to capture relevant events. If malicious, such changes could lead to unmonitored access to repositories, potentially resulting in data loss or intellectual property theft. Notably, this detection does NOT confirm that any unauthorized access has occurred; it merely indicates that a change was made to SSH settings.

  ### Investigation Steps

  - **Review audit logs for SSH changes:**
    Examine Bitbucket audit logs (auditType.category: 'Global administration', auditType.action: 'SSH settings changed') to identify the user who executed the change. Look for unusual accounts or service accounts that shouldn't perform this action.

  - **Validate legitimate configuration changes:**
    Cross-reference the timestamp of the log entry with known maintenance plans or user activity to establish whether the change was planned or authorized. Look for associated communication (e.g., JIRA tickets) that may indicate legitimate actions.

  - **Identify high-risk accounts:**
    Check the user role associated with the change in audit logs. Admin changes from non-standard users or accounts with unusual access patterns (e.g., infrequent logins) are strong indicators of potential misuse.

  - **Monitor for related suspicious activities:**
    Assess recent SSH connection attempts recorded in Bitbucket logs to determine if modifications correlate with unexpected access patterns, indicating potential lateral movement (Event IDs related to SSH connections).

  - **Assess repository permissions:**
    Review any repository access settings immediately following the changes. Any elevation of privileges or unexpected access rights granted to user accounts should be flagged for further investigation.

  - **Investigate linked systems:**
    If SSH settings allow external access, perform checks on related systems for indicators of compromise, including unusual logins or data exfiltration artifacts (e.g., files created, modified, or transferred out).

  ### Prioritization

  This alert should be considered medium severity. The impact is heightened in environments where Bitbucket houses critical code repositories. The likelihood of malicious abuse is moderate, as altering SSH settings can facilitate easier unauthorized access. Such behavior is known to be weaponized by attackers to maintain persistence or perform lateral movement.

  ### Blind Spots and Assumptions

  This detection may be circumvented by sophisticated attackers who possess the necessary permissions for modification, highlighting a limitation in access control monitoring. Dependencies on complete audit logging settings must be met, specifically requiring the "Advance" log level. Legitimate activities, such as scheduled maintenance or organizational policy updates, could also trigger this alert. Companion detections include abnormal SSH activity or failed connection attempts that complement oversight on SSH configuration changes.

