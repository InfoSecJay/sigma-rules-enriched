  ---

  ### Technical Context

  This rule detects changes to global permissions within Bitbucket, including granting, removing, or requesting such permissions. The likely attacker objective is to escalate privileges or manipulate access controls to sensitive repositories, which could lead to unauthorized data exposure or further malicious activities. This behavior is classified under the MITRE ATT&CK tactic of Privilege Escalation (T1068) and Persistence (T1098).

  The primary telemetry source is the Bitbucket audit logs, capturing events related to permission changes. If malicious, this activity could lead to significant security impacts, such as unauthorized access to critical assets or repositories within the version control system. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative activities may trigger these alerts.

  ---

  ### Investigation Steps

  - **Verify the source of permission changes:** Review the Bitbucket audit logs for Event IDs related to permission changes (e.g., action types: 'Global permission granted,' 'Global permission removed'). Cross-reference with the user accounts that executed these actions.

  - **Assess user roles and permissions:** Check if the user performing the permission change is an administrator or a legitimate user. Look for expected behavior patterns, such as scheduled maintenance supervisors or regular permissions requests during business hours.

  - **Identify likely attack patterns:** Search the audit logs for multiple rapid permission changes from a single user or IP address, which may indicate an exploitative behavior. Pay attention to any associated actions prior to the changes, such as login events (Audit Type: 'Login').

  - **Evaluate system impact:** Determine the criticality of the repositories affected by the permission changes. Use Bitbucket settings to identify whether these repositories contain sensitive information (e.g., intellectual property, proprietary code).

  - **Check for related suspicious activities:** Look for correlated anomalous actions in the audit log around the same timeframe, such as unusual login locations or times (Audit Type: 'Login') that may indicate an account compromise.

  ---

  ### Prioritization

  This alert has medium severity due to its potential impact on sensitive data managed within Bitbucket. While the likelihood of abuse is moderate, privilege changes could lead to serious security breaches if exploited. Privilege escalation tactics are commonly weaponized in advanced persistent threats.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative changes to trigger this alert, which can lead to false positives. Accurate logging configurations are required to capture all relevant audit events; ensure "Advance" log level is enabled in Bitbucket settings for complete visibility. Additionally, legitimate operational activities such as scheduled permissions reviews could also initiate these alerts. A related detection to improve coverage is monitoring for unauthorized changes to repository access settings, which may complement the privilege change detection.

