note: |
  ### Technical Context
  This detection rule identifies changes to global permissions within a Bitbucket instance. Specifically, it monitors for audit log entries recording requests to change global permissions, including granting, removing, or requesting permissions. Such activity is critical as it can indicate unauthorized attempts by an attacker to escalate privileges, potentially leading to unauthorized access to sensitive repositories or project configurations.

  The primary threat scenario involves an insider threat or an external attacker gaining access credentials to a Bitbucket server. Their likely objective is to manipulate permissions to facilitate lateral movement within the organization, compromise additional systems, or exfiltrate sensitive data.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003) - Establishing persistence through modified permissions.
  - **Privilege Escalation** (TA0004) - Utilizing altered global permissions to gain elevated rights.
  - **T1098: Account Manipulation** - Changing permissions affecting account access.

  The primary data sources for this detection include Bitbucket audit logs, specifically examining events related to permission changes.

  ### Investigation Steps
  - **Review Audit Logs:** Analyze the Bitbucket audit logs for entries related to global permission changes. Focus on the "Global permission remove request", "Global permission removed", "Global permission granted", and "Global permission requested" actions.

  - **Identify User Context:** Determine the user or service account initiating the permission changes. Investigate whether this activity aligns with their role and expected behavior.

  - **Cross-Reference with Access Reviews:** Verify if the permission changes correspond to legitimate access control reviews or if they raise anomalies. Consult related data sources, such as your identity management system or incident response notifications.

  - **Assess Impact and Follow-Up:** Assess the impact of the changes made. Identify any potential unauthorized access or risk exposure resulting from these permissions, and ensure follow-up actions are documented in incident response records.

  ### Prioritization
  The severity of this alert is medium due to the potential impact on the organization's security posture. Unauthorized global permission changes could allow attackers to escalate privileges, compromising sensitive repositories and data integrity.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on users to initiate permission changes through the UI; automated scripts or other means may bypass this logging mechanism. The detection logic assumes that all legitimate users have appropriate authority to request permission changes and that the log level is set to "Advance" to capture these events. Without this logging configuration, the alert may miss critical events that indicate unauthorized access attempts.

