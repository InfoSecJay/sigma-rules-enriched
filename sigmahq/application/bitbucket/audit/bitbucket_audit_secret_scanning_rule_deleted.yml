note: |
  ### Technical Context

  This rule detects the deletion of secret scanning rules in Bitbucket for projects or repositories. The likely attacker objective is to disable security features that prevent sensitive information from being exposed in version control, which could allow unauthorized access to secrets. This behavior aligns with MITRE ATT&CK ADvanced techniques, specifically Defense Evasion (T1562.001).

  The primary telemetry source for this detection is Bitbucket audit logs, specifically events related to project and repository actions. If malicious, this action reduces the security posture of the repository, potentially leading to sensitive data leaks. Importantly, this detection does NOT confirm that secrets are present or that any exfiltration has occurred on its own.

  ### Investigation Steps

  - **Review audit logs for deleted rules**: Check Bitbucket audit logs for Event types 'Project secret scanning rule deleted' or 'Repository secret scanning rule deleted.' Identify the user triggering the deletion and the timestamp to establish context.

  - **Correlate with user activity**: Determine if the user has a legitimate reason for deleting the rule. Review user permissions and recent activities to establish whether their actions align with expected behaviors in the project or repository.

  - **Identify potential proxies or past suspicious actions**: Cross-reference this deletion with previous audit logs for any suspicious actions by the user in the same timeframe, such as unauthorized access or suspicious repository changes that might indicate preparatory work for a data breach.

  - **Validate the existence of sensitive data**: Perform a check for existing secrets within the project's repository before the rule was deleted by examining “auditType.action” for “Project secret scanning rule created” or similar entries. This aids in confirming if the deleted rule was essential for security.

  - **Assess impact of affected repository**: Evaluate the criticality of the project or repository from which the rule was deleted. High-criticality assets should be prioritized higher for further investigation, especially if they contain sensitive information or are publicly accessible.

  ### Prioritization

  This alert has a low severity level based on the immediate impact on the system, as it involves the deletion of a scan rule rather than direct malicious activity. However, the likelihood of malicious use against critical repositories makes it a noteworthy observation that warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection of this activity may be evaded by legitimate users with elevated privileges acting within normal usage patterns. There is a dependency on basic logging configurations to capture these audit events effectively. Additionally, routine administrative actions, such as rule maintenance or updates, could trigger the alert without any malicious intent. A related detection to consider is the monitoring of project and repository permission changes, which may indicate a broader attempt to bypass security controls.

