note: |
  ### Technical Context

  This Sigma rule detects the deletion of secret scanning rules in Bitbucket projects or repositories, where an attacker may aim to reduce automated detection of hardcoded secrets or sensitive information. The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1560), and the primary technique involved is **Delete Local Files** (ID: T1117). The essential telemetry sources are Bitbucket audit logs, specifically those categorized under auditType.category for 'Projects' and 'Repositories', along with the actions mentioning the deletion of secret scanning rules. The security impact is significant if a malicious actor removes these rules to prevent detection of secrets that could lead to further compromise, such as credential theft. It's crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate users may also perform this action.

  ### Investigation Steps

  - **Assess the affected user:** Review the Bitbucket audit log for the user identification (e.g., user ID or email) associated with the deletion (Bitbucket audit log entries - fields: `actor`, `timestamp`). Check for patterns in their activity that indicate potentially unauthorized behavior.

  - **Identify the timing and context of deletion:** Look for the timestamp of the deletion action and correlate it with other audit events around that time (event type: 'Project secret scanning rule deleted' or 'Repository secret scanning rule deleted'). Assess user actions leading up to the deletion to determine if they were unusual or out of the ordinary.

  - **Correlate with recent changes:** Investigate other related actions taken by the same user or related users that might indicate an escalation or change of permissions, such as 'Project permission modified' or 'Repository permissions changed' (Bitbucket audit log entries). This context helps determine user legitimacy and intent.

  - **Review legitimate usage patterns:** Identify typical workflows around the management of secret scanning rules, including when and why legitimate users might remove these rules, based on your organization's practices or recent changes in project needs. This insight can help distinguish between authorized and unauthorized deletions.

  - **Identify high-confidence indicators of malicious activity:** Look for repeated deletions or modifications to secret scanning rules from unusual or unauthorized accounts, especially those not aligned with the project or repository's business function (e.g., non-developing users).

  ### Prioritization

  This alert has low severity due to the potential for legitimate activity but necessitates scrutiny based on the context of the affected systems. While malicious abuse is possible, especially if it aligns with suspicious user behavior, the act of deleting secret scanning rules by itself does not imply compromise. However, the behavior can be a precursor to an attack if exploited strategically.

  ### Blind Spots and Assumptions

  The detection may be limited by user permissions, as individuals with high access levels could perform deletions without triggering alarms in other monitoring systems. If the audit log level is not set to "Basic," this detection may not capture all relevant events. Legitimate administrative actions, such as project restructuring or updates to security policies, may also trigger this alert. A related detection to strengthen coverage is monitoring for unauthorized access attempts or privilege escalations that could indicate a compromise leading to secret scanning rule modifications.

