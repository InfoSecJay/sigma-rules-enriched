note: |
  ### Technical Context
  This detection rule monitors for the deletion of secret scanning rules within Bitbucket projects or repositories. Such rules are crucial for identifying and mitigating the exposure of sensitive information like API keys, passwords, and other credentials in source code. The objective behind deleting these rules often aligns with an attacker’s intent to disable critical security controls, potentially facilitating unauthorized access or data exfiltration without being detected.

  The relevant MITRE ATT&CK tactics for this rule include **Defense Evasion** (TA0060), particularly the technique **Indicator Removal on Host** (T1562.001), where attackers may attempt to disable or modify security measures to avoid detection. The primary data source for this detection is the audit logs generated by Bitbucket, which must be configured to the "Basic" log level to capture the necessary events.

  ### Investigation Steps
  - **Review Audit Logs**: Investigate the Bitbucket audit logs for entries related to "Project secret scanning rule deleted" or "Repository secret scanning rule deleted". Validate the context of these deletions, including the user who performed the action and the time it occurred.
  - **Analyze User Permissions**: Check if the user who deleted the rule had appropriate permissions or if there are anomalies in their access rights that could suggest compromise.
  - **Assess Recent Activity**: Review recent changes or alterations to the project/repository settings to identify any irregularities or suspicious actions leading up to the deletion event.
  - **Cross-Reference with Security Policies**: Compare the detected deletion with organizational security policies to determine if this action aligns with legitimate administrative procedures or if it raises concerns about unauthorized access.

  ### Prioritization
  This alert is categorized as low severity because, while the deletion of secret scanning rules can indicate potentially malicious activity, it may also result from legitimate user actions. However, in an enterprise environment where security posture is paramount, such a change should be carefully monitored, especially if it follows unusual behavior.

  ### Blind Spots and Assumptions
  The detection logic assumes that the necessary audit logging is configured and enabled to capture relevant events. If organizations have not set their Bitbucket logging to "Basic" level, they will miss critical indicators of potentially harmful deletions. Additionally, there may be gaps in visibility if users perform deletion actions through APIs or during maintenance windows, which might not be recorded in the audit logs. It also assumes all deletions of secret scanning rules are indicative of a risk, ignoring legitimate administrative practices that could lead to such changes.

