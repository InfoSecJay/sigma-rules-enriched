note: |
  ### Technical Context

  This Sigma rule detects attempts to export user permissions data within Bitbucket, specifically actions related to user details export. The likely attacker objective is to harvest information about user access rights, which could lead to unauthorized access or more extensive reconnaissance activities, fitting within the MITRE ATT&CK techniques for discovery (T1082) and collection (T1213). The primary telemetry source is Bitbucket’s audit log, specifically focusing on events related to user and group management.

  If malicious, this behavior reflects a potential breach of security protocols, enabling an attacker to compile sensitive user permissions data. However, it is critical to note that this detection does NOT confirm malicious activity on its own—legitimate users may perform similar export operations under certain circumstances.

  ### Investigation Steps

  - **Review audit logs for export events:** Check Bitbucket audit logs for Event types "User details export started," "User details export failed," or "User details exported." Note the timestamps and user accounts involved for any anomalies.

  - **Validate user roles and permissions:** Investigate the user account that triggered the export. Verify if this user has legitimate reasons (e.g., admin roles) to export permissions, or if the account is unauthorized or unusual.

  - **Cross-reference with recent account activity:** Look for any unusual login patterns (Event ID indicating logins) that correspond to the time of the export actions. Investigate if there were multiple failed login attempts or suspicious access locations.

  - **Examine related network activity:** If possible, review network traffic logs during the time of the export. Look for outbound connections that correspond to the Bitbucket exports, which may indicate data exfiltration.

  - **Identify benign behavior patterns:** Note legitimate user activity for large-scale exports, such as an administrator running permission audits for compliance. Contextualize alerts based on expected frequency of such actions within your organization's workflow.

  ### Prioritization

  This alert is considered medium severity due to its potential impact on security, especially if it involves sensitive user role information. The likelihood of malicious abuse is moderate, particularly if tied to recently compromised accounts. Although data export attempts are not overwhelmingly common, they can be indicative of deeper reconnaissance or preparation for an attack.

  ### Blind Spots and Assumptions

  Detection may miss legitimate export attempts by authorized users who could trigger this alert during routine audits. Required log sources include properly configured Bitbucket audit logging at the "Advance" level, which may not capture all user actions. Additionally, accounts with high-level privileges might perform export operations for legitimate business reasons, leading to potential false positives. Companion detections include monitoring unusual changes in user roles or permissions (T1591.004) to bolster context around these export activities.

