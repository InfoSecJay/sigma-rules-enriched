note: |
  ### Technical Context

  This rule detects changes made to the Bitbucket audit log configuration, specifically instances where the audit log settings are modified. The likely attacker objective could be to disable or alter logging capabilities to conceal malicious actions within the Bitbucket environment, impacting the ability to track user actions effectively. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), with the technique being **Audit Log Manipulation** (T1685).

  Primary telemetry sources include Bitbucket server audit logs, capturing events related to audit log configuration changes. If malicious, this behavior undermines security monitoring efforts, potentially hiding unauthorized access or changes to code repositories. Importantly, this detection does not confirm malicious intent on its own; it merely indicates a configuration change which could be benign.

  ### Investigation Steps

  - **Review audit logs for recent configuration changes:** Investigate the Bitbucket audit logs for Audit Log Configuration Updated events (payload fields: `auditType.category`, `auditType.action`). Check for any entries that show a change in the log level or other key settings, noting timestamps and user accounts.

  - **Identify user account and role involved in the change:** Determine if the user who performed the configuration update has administrative privileges, and review their activity history. Legitimate changes should reflect expected administrative actions in line with organizational policy.

  - **Evaluate for unauthorized access attempts:** Analyze the Bitbucket logs for any unusual account activity or failed login attempts (Event ID: related API access logs). Look for patterns, such as multiple fails from the same IP address, indicating a potential attack vector.

  - **Compare configuration change timings to other incidents:** Correlate the timing of the configuration update with other significant security events (e.g., code deployment or user access requests). This can help prioritize the alert based on any suspicious concurrent activities.

  - **Check for log retention settings:** Verify the current audit log retention policy in conjunction with this modification. If the settings were altered to reduce retention time significantly, it may indicate an intent to evade detection.

  ### Prioritization

  This alert is of medium severity as it denotes a potential attempt to disrupt logging capabilities on critical source code management systems. The likelihood of malicious activity is moderate, especially if associated with other suspicious behaviors, indicating this tactic can be weaponized by threat actors aiming to evade detection.

  ### Blind Spots and Assumptions

  This detection may be limited by the availability of comprehensive audit logs; if log storage configurations are suboptimal, vital evidence may be lost. Legitimate activities, such as routine administrative changes or updates performed during maintenance windows, may trigger this alert. A related detection, such as monitoring for user account privilege escalations in Bitbucket, could provide additional context and strengthen overall security coverage.

