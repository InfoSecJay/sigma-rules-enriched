note: |
  ### Technical Context
  This detection rule identifies attempts to export user details from Bitbucket, which could indicate unauthorized or suspicious behavior. In a scenario where an attacker gains access to a Bitbucket instance, they may attempt to export user accounts to gather information for further attacks, such as credential harvesting or lateral movement within an organization. The attacker’s objectives are likely reconnaissance-based, aiming to understand user permissions and access levels within the repository.

  Related techniques from the MITRE ATT&CK framework include:
  - **T1213: Data from Cloud Storage Object**
  - **T1082: System Information Discovery**
  - **T1591.004: Gather Victim Information from Cloud Services**

  The primary data source for this detection is Bitbucket's audit logs. These logs provide information about user activities, including attempts to export user permissions and account details, which are key to identifying potentially malicious behavior.

  ### Investigation Steps
  - **Review Bitbucket Audit Logs**: Investigate the audit logs for the specific actions related to user details exports, such as 'User permissions export started' and 'User permissions exported'.
  - **Identify Source IPs**: Check the source IPs associated with the export attempts to see if they match known internal addresses or if they originate from suspicious external locations.
  - **Analyze User Roles and Permissions**: Verify the roles of the users attempting the export. Determine if these users have the appropriate privileges and whether the export request is consistent with their expected behavior.
  - **Correlate with User Activity Logs**: Cross-reference the time of the export actions with logs from other tools (like VPN or EDR) to identify any unusual access patterns or behaviors around the time of the export attempts.

  ### Prioritization
  Given that unauthorized user detail exports can lead to significant data breaches or credential theft, this alert should be treated with medium severity. The likelihood of a successful attack using this method is moderate, especially in environments where user permissions are closely monitored.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of user export activities if audit logs are not set to "Advance" log level; thus, if logging is misconfigured or disabled, detection will fail. The assumption underlying this rule is that attacking users will trigger the logged events specified in the detection logic; however, legitimate users may also trigger these logs when performing routine tasks. As such, continuous tuning and investigation into false positives are necessary to enhance detection accuracy.

