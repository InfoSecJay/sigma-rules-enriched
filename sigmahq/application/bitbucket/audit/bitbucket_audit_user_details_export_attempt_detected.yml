note: |
  ### Technical Context

  This Sigma rule detects attempts to export user data from Bitbucket, specifically actions related to exporting user permissions. The likely attacker objective is to collect sensitive user information, which could facilitate further reconnaissance or preparation for exploitation. This detection aligns with the MITRE ATT&CK tactics of **Collection (T1589)**, **Reconnaissance (T1591)**, and **Discovery (T1082)**. The primary telemetry source is Bitbucket's audit logs, particularly events related to user and group management. If malicious, this behavior may lead to unauthorized access or data breaches. Importantly, this detection does NOT confirm unauthorized access or that a security incident has occurred without further corroborating evidence.

  ---

  ### Investigation Steps

  - **Check Bitbucket audit logs for export events:** Review audit logs (log level set to "Advanced") for Event IDs corresponding to `'User permissions export failed'`, `'User permissions export started'`, or `'User permissions exported'`. Look for timestamps and user accounts involved.

  - **Identify the exporting user account:** Determine whether the user account performing the export has legitimate permissions and a valid business need for this activity. Compare user roles against expected usage patterns.

  - **Monitor for abnormal user activity:** Analyze the user’s previous actions using log types related to user access patterns and API calls. This may include Event IDs for successful logins or activities performed within Bitbucket over the past week.

  - **Correlate with other security events:** Check if there are accompanying alerts or logs in associated systems, such as failed login attempts (Security Event ID 4625) or unusual API queries. This helps establish a context for potential malicious behavior.

  - **Evaluate role or asset criticality:** Report the exporting activity based on the asset (e.g., critical servers or repositories) designation to identify potential business impact if the action is found to be malicious.

  - **Look for external data transmission:** Investigate any file transfers or external communications post-export that could demonstrate exfiltration, especially through monitoring tools that log outgoing web requests.

  ---

  ### Prioritization

  The alert has a medium severity because it involves potential exposure of sensitive user information. The likelihood of abuse is moderate, especially if compromised accounts or insiders are involved. This behavior can be weaponized for targeted attacks and insider threats, making prompt investigation critical.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate user activity to trigger the alert if users are permitted to export data under normal operations. The accuracy of detection relies on the "Advanced" log level configuration being enabled. Valid business processes, such as large team integrations or migrations, might initiate exports. A related detection to strengthen coverage could include API access logs that track unexpected access patterns or permissions changes (e.g., Event IDs related to user permission modifications).

