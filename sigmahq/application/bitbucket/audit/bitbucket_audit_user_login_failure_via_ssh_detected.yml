note: |
  ### Technical Context

  This rule detects failed SSH login attempts to Bitbucket, indicating potential credential abuse or unauthorized access attempts. The likely attacker objective could be to gain unauthorized access to source code repositories or to exploit repositories for further lateral movement within the environment. This fits into the MITRE ATT&CK framework under the tactics of Credential Access (TA0006) and Lateral Movement (TA0008), specifically techniques T1021.004 (SSH).

  Primary telemetry sources include Bitbucket audit logs, specifically for authentication events where the log level is set to "Advance" to capture these entries. If malicious, this behavior could lead to account compromise or unauthorized access to sensitive source code. It is important to note that this detection does NOT confirm malicious intent on its own, as it may be triggered by legitimate users making repeated unsuccessful login attempts.

  ### Investigation Steps

  - **Review the audit logs for SSH login failures:** Examine Bitbucket audit logs (AuditType: Authentication, Action: User login failed(SSH)) around the time of the alert (e.g., Event ID: 1001). Look for patterns, such as multiple login failures from a single IP address.

  - **Identify the username involved:** Check the "author.name" field in the Bitbucket audit log entries. If the user is known and has a valid reason for logging in, such as ongoing development work, this may indicate benign behavior.

  - **Examine the source IP address of the login attempts:** Analyze the originating IP addresses for the failed attempts. Compare them against your organization's list of known IPs and check for any matches with external or suspicious IP addresses.

  - **Cross-reference user activity:** Investigate if the affected user has had a history of failed logins and check for recent successful logins that match their usage pattern. Assess the "user-agent" string for any anomalies.

  - **Monitor for brute force attack indicators:** Look for a rapid increase in failed login attempts over a short period. This may suggest an automated attempt to gain access using stolen credentials.

  - **Validate successful login attempts:** Cross-check if there are subsequent successful login events from the same user shortly after the failures (AuditType: Authentication, Action: User login success). This may indicate that the user was locked out after several failed attempts.

  ### Prioritization

  The alert severity is considered medium due to the potential impact on source code integrity and repository security. While it indicates suspicious behavior that could lead to credential abuse, it may also result from legitimate users entering incorrect credentials. The technique is commonly weaponized by adversaries attempting to gain access through credential stuffing or brute force attacks.

  ### Blind Spots and Assumptions

  This detection may have limitations if audit logging is not appropriately configured at the "Advance" level, leading to potential missed events. Legitimate activities, such as users inputting incorrect passwords due to typos or forgotten credentials, can also trigger this alert. A companion detection to strengthen coverage would involve monitoring for successful logins following multiple failed attempts, highlighting potential credential compromise or exploitation.

