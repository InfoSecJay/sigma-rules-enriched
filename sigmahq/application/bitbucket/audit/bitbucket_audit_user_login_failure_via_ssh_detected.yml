note: |
  ### Technical Context
  This detection rule aims to identify failed login attempts via SSH in a Bitbucket server environment. The primary focus is on monitoring authentication attempts that were unsuccessful, as these can indicate potential unauthorized access attempts or brute-force attacks targeting user accounts. Attackers may look to exploit user credentials to gain access to source code or sensitive information stored in repositories, thus compromising both data integrity and confidentiality.

  This situation aligns with the MITRE ATT&CK framework, particularly under the tactics of "Credential Access" (TA0006) and "Lateral Movement" (TA0008). Techniques such as "SSH Tunneling" (T1021.004) and "Brute Force" (T1110) are particularly pertinent as they describe methods attackers could use to gain entry to a target system by attempting various SSH credentials.

  The best sources of telemetry for this rule come from Bitbucket audit logs, specifically under the "Authentication" category, which tracks all login attempts, successful or otherwise. It is essential to ensure that the audit log level is set to "Advance" so that these events are properly captured.

  ### Investigation Steps
  - **Review Audit Logs:** Collect and examine Bitbucket's authentication audit logs for entries related to failed SSH login attempts to identify patterns or repeated attempts by specific users.

  - **Correlate User Activity:** Investigate the "author.name" field associated with the failed attempts to check for correlations with legitimate user actions, distinguishing between genuine errors like incorrect passwords and potential attacks.

  - **Monitor for Brute Force Patterns:** Analyze the frequency and timing of the login failures, looking for behaviors typical of brute-force attacks, such as multiple attempts in a short time frame or from the same IP address.

  - **Assess User Account Security:** Determine whether the accounts experiencing failed login attempts have any security measures (such as MFA) in place and consider rotating credentials for compromised accounts to mitigate any risk.

  ### Prioritization
  Alerts for failed SSH login attempts are assigned a medium severity level due to the risk they pose. While a single failed login could indicate a legitimate user error, a pattern of such failures may suggest a concerted effort to breach accounts, warranting prompt investigation due to the potential for more serious security incidents.

  ### Blind Spots and Assumptions
  This detection logic may not fully cover all attack vectors, as it only focuses on failed SSH login attempts without correlating with other authentication methods or behaviors. The effectiveness of this detection relies on the assumption that legitimate users are not frequently misentering their credentials. Additionally, for the rule to function correctly, the Bitbucket audit logs must be configured to "Advance" log level to capture the necessary details surrounding authentication failures, which may not be a standard setting in all environments.

