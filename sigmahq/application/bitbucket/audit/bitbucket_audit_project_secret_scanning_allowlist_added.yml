note: |
  ### Technical Context

  This rule detects when a new secret scanning allowlist rule is added for a project in Bitbucket, which may indicate an attacker attempting to evade detection by specifying which secrets should be ignored during scans. The likely objective of this behavior is to facilitate unauthorized access or exfiltration of sensitive data by preventing automated tools from flagging potentially exposed secrets. This aligns with the MITRE ATT&CK tactic of Defense Evasion (T1564), specifically the technique of Whitelisting (T1685).

  The primary telemetry source for this detection is Bitbucket’s audit logs, specifically under the 'Projects' audit category, where the action 'Project secret scanning allowlist rule added' is recorded. If malicious, this activity can hinder the detection of compromised credentials or other sensitive information within the code base, increasing the risk of data breaches. However, this detection alone does NOT confirm malicious intent; legitimate users may also modify allowlist configurations as required by project needs.

  ### Investigation Steps

  - **Initial review of audit logs**: Check Bitbucket audit logs for Event Type: 'Project secret scanning allowlist rule added' with fields including 'username', 'project key', and 'timestamp'. Verify if the modifying user has appropriate access rights and understand the context of the change.

  - **Cross-reference user activity**: Investigate recent activity by the modifying user (e.g., API calls or other project changes) within the same audit logs to identify any suspicious behavior or patterns that could indicate malicious intentions.

  - **Analyze project configuration**: Review the configuration of the project where the allowlist was added, specifically looking for what secrets are exempt from scans. Confirm that the listed secrets are legitimate (related to known and expected services).

  - **Review for anomalous patterns**: Compare recent allowlist modifications against historical patterns in the project. Note any unusual frequency of changes or modifications made by users not typically involved in project administration.

  - **Expected behavior validation**: Confirm expected or legitimate activities around project maintenance, such as regular auditing practices, development sprints, or other changes that might justify the modification of the allowlist.

  - **Search for unusual commit patterns**: Look for recent commits or pull requests that coincide with the addition of the allowlist, especially any that involve sensitive information (like API keys or passwords) that may have influenced this configuration change.

  ### Prioritization

  The severity of this alert is considered low but is context-dependent based on the criticality of the affected Bitbucket project. Since the addition of a secret scanning allowlist can impede the detection of compromised data, it poses a moderate risk if associated with other suspicious activities, particularly if done by users lacking proper administrative oversight or in unexpected contexts.

  ### Blind Spots and Assumptions

  This detection may miss subtle evasion techniques, such as modified timestamps or actions taken by legitimate users with insider knowledge. It relies on audit logging being set to "Basic" level; without this configuration, relevant activities may not be captured. Legitimate activities like user-configured project adjustments or necessary maintenance could trigger the alert. Consider correlating this alert with detections around unusual access to Bitbucket repositories or modifications to secrets in other environments to enhance overall monitoring capability.

