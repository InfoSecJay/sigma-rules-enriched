note: |
  ### Technical Context

  This rule detects when a secret scanning allowlist rule is added within Bitbucket projects. An attacker may aim to bypass secret scanning mechanisms by adding specific patterns or rules that prevent sensitive data from being flagged during scans. This behavior fits within the MITRE ATT&CK framework's evade detection tactics (T1562.001).

  The primary telemetry source is Bitbucket's audit logs, specifically events related to project actions. If this action is executed maliciously, it could lead to the undetected storage or use of sensitive information. It is crucial to emphasize that this detection does NOT, on its own, confirm malicious intent; it could result from legitimate users configuring project settings.

  ### Investigation Steps

  - **Check recent audit logs for modification events:** Review Bitbucket audit logs (e.g., Event ID **X-X-X** for secret scanning allowlist changes) within the time frame surrounding the alert. Look for unusual user accounts making modifications, which may indicate unauthorized access.

  - **Identify user roles and permissions:** Verify the user account that executed the allowlist addition against its role (Admin, Developer, etc.). Admin-level changes by non-privileged users could signify a security concern.

  - **Review project settings for usual patterns:** Compare the newly added allowlist rules against typical project configurations. Legitimate activity would generally reflect known and necessary patterns, while unusual patterns may warrant further investigation.

  - **Look for correlating activities in Bitbucket:** Cross-reference with other Bitbucket audit events, such as suspicious repository access or configuration changes (Event ID **Y-Y-Y**), to identify if there is a broader context indicating a compromised account.

  - **Audit other recent security configurations:** Search for additional modifications in project or organization-wide security settings (e.g., Event IDs indicating changes from the same user or modification of other scanning tools), which may reveal a pattern of malicious behavior.

  ### Prioritization

  This alert is considered low severity due to the possibility of legitimate administrative activities. However, the potential for misuse makes it worth monitoring, especially if it reflects a pattern of behavior. Since this action can be weaponized to evade detection mechanisms, maintaining vigilance is crucial.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of an insider threat or legitimate user making changes that may not present immediate risk, thus potentially leading to false positives. Consistent logging and monitoring of comprehensive Bitbucket audit logs at the recommended "Basic" log level are essential for reliable detection. Legitimate users configuring allowlists for various purposes may inadvertently trigger this alert. A related detection to consider involves monitoring for unusual repository access patterns paired with secret scanning changes to strengthen coverage.

