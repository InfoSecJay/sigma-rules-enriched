note: |
  ### Technical Context
  This rule detects failed login attempts to Bitbucket accounts, specifically focusing on authentication failure events. An increase in failed logins may indicate a brute force attack, where an unauthorized user tries to gain access to accounts by repeatedly entering different passwords. Attackers may aim to compromise user credentials to gain unauthorized access to repositories, thereby potentially leading to data exfiltration or destruction of code.

  The relevant MITRE ATT&CK tactics/techniques for this behavior include **Initial Access (TA0001)**, specifically **Valid Accounts (T1078.004)**, where attackers utilize stolen credentials to gain access. Additionally, this scenario can involve **Credential Access (TA0006)** techniques, like brute force password attempts (T1110). Primary data sources for detecting this activity would be the audit logs from Bitbucket's logging service, specifically focusing on events under the "Advance" log level that capture failed authentication actions.

  ### Investigation Steps
  - **Review Audit Logs:** Examine Bitbucket audit logs for the `User login failed` events, paying particular attention to the timestamps, usernames, and associated IP addresses to identify patterns or sources of repeated failures.
  - **Correlate with User Activity:** Cross-reference the login failures with user activity logs to determine if the users were engaging in legitimate actions at those times or if the activity seems suspicious.
  - **Analyze Source IPs:** Investigate the originating IP addresses of the failed login attempts for known malicious IPs or unusual geographic locations compared to the user's normal access patterns.
  - **Check User Accounts:** Assess if the affected user accounts have any recent changes in permissions or if there are any indicators of compromise that might explain the increased failure rate.

  ### Prioritization
  The severity of this alert is medium due to the potential risk associated with failed login attempts that could indicate an intrusion attempt. If successful, such activities could lead to sensitive data exposure or malicious alterations of code within Bitbucket repositories.

  ### Blind Spots and Assumptions
  This detection rule may not capture all malicious login attempts, especially if attackers use valid credentials or if they target accounts with complex, non-guessable passwords that result in legitimate failures. The assumption is that all failed login attempts are not part of legitimate user activity; however, this can lead to false positives, such as users simply mistyping their credentials. The rule requires the "Advance" log level to be enabled in Bitbucket, and without this configuration, relevant events may not be logged, resulting in missed detection opportunities.

