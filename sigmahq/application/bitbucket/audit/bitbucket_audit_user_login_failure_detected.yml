note: |
  ### Technical Context

  This rule detects failed user login attempts to Bitbucket, specifically targeting authentication-related events. Such behavior is often indicative of password guessing, unauthorized access attempts, or credential stuffing, aligning with an adversary's objectives to gain access to source code repositories or sensitive information. The MITRE ATT&CK techniques relevant to this detection include **Credential Dumping (T1003)** and **Valid Accounts (T1078.004)**.

  The primary telemetry source for this detection is the Bitbucket Audit Log, specifically events related to user authentication failures. A high volume of these failed attempts may signal a greater risk of compromise, potentially resulting in unauthorized access to repositories, which can severely impact an organization's security posture. Importantly, this detection does not confirm an active compromise on its own; multiple failed login attempts can result from legitimate users mistyping credentials.

  ### Investigation Steps

  - **Review failed login attempts: **Check for multiple failed login entries in the Bitbucket Audit Log (auditType.category: 'Authentication', auditType.action: 'User login failed'). This can provide insight into whether the failures are isolated or part of a broader attack pattern.

  - **Identify frequency and patterns: **Examine the frequency of the failures. A high number in a short period (e.g., 10+ in 5 minutes from the same IP) can be a strong indicator of malicious intent.

  - **Correlate with successful logins: **Look for any matching successful login events (auditType.action: 'User login successful'). Anomalies such as a failed login followed by a successful login from the same user or IP should be scrutinized.

  - **Check user context: **Investigate the user accounts associated with the failed attempts. Confirm whether those accounts are legitimate users or stale accounts often exploited for credential stuffing.

  - **Assess legitimate usage patterns: **Note that occasional incorrect password attempts are normal; analyze the activity surrounding expected users, particularly during working hours, to differentiate between legitimate behavior and potential attacks.

  - **Examine geolocation and access patterns: **Review the source IP addresses for alignment with expected user geolocation and access patterns. Access attempts from unusual or blacklisted IPs may warrant further investigation or immediate action.

  ### Prioritization

  Given that this detection pertains to authentication failures, it is of medium priority. The affected system, such as a source code repository, is critical in a dev-ops context, making unauthorized access attempts significant. Since attackers commonly exploit valid accounts to bypass security measures, the likelihood of malicious abuse remains high.

  ### Blind Spots and Assumptions

  This detection may produce false positives from legitimate user behaviors, such as forgotten passwords or temporary access issues. Evasion techniques may involve rapid attempts from a wide range of IP addresses to avoid detection. Proper log configurations, specifically setting the audit log level to "Advance," are crucial for reliable detection. Companion detections, such as unauthorized account creation or changes to user roles, would enhance overall security visibility and response capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
