note: |
  ### Technical Context

  This Sigma rule detects failed user login attempts to Bitbucket, indicating potential unauthorized access attempts. The likely attacker objective is to gain access to Bitbucket repositories, which could allow data exfiltration or malicious code injection. This behavior aligns with the MITRE ATT&CK technique for Valid Accounts (T1078.004) and Credential Dumping (T1110).

  The primary telemetry source is the Bitbucket audit log, specifically events categorized under "Authentication" for failed login actions. If malicious, it could signify an ongoing brute-force attack or an attempt to exploit compromised credentials. It is important to note that this detection does NOT confirm any successful access to the system on its own.

  ### Investigation Steps

  - **Review audit log details:** Check Bitbucket audit logs (Event type: Authentication, Action: User login failed) for user account details (fields: `author.name`, `auditType.action`). Identify if failed attempts come from suspicious IP addresses or show patterns of redundancy.

  - **Identify legitimate users:** Confirm if the login attempts are from recognized team members. Analyze if the `author.name` corresponds to a legitimate user or an unexpected account that should be investigated further.

  - **Check frequency of failed attempts:** Assess the time interval between failed login events. Legitimate behavior usually features occasional, spaced-out failures, while malicious attempts may show rapid, successive failures.

  - **Correlate with other security events:** Look for accompanying security alerts such as account lockouts or increased access requests from the same account. These can indicate a compromised account or a more serious attack.

  - **Monitor source IP addresses:** Validate IP addresses against known threat intelligence feeds. High-risk IPs, especially those flagged for brute-force attacks, can signify malicious intent behind the login failures.

  ### Prioritization

  This alert should be treated as medium severity. While the system's impact is limited to Bitbucket repositories, multiple repeated failures could indicate a potential compromise attempt. Although credential stuffing attacks are not uncommon, they are often motivated by targeting sensitive source code and could lead to more severe breaches if not addressed.

  ### Blind Spots and Assumptions

  Detection may miss attacks if logs do not capture all failed attempts, particularly if audit logging is not properly configured. Evasion techniques may include rapid changes to the source IPs to circumvent detection. Legitimate scenarios that could trigger this alert include users forgetting passwords or entering incorrect credentials during multi-factor authentication processes. A companion detection to consider is monitoring for account lockout events, which can provide additional context for analyzing failed attempts.

