note: |
  ### Technical Context

  This Sigma rule detects unauthorized attempts to perform a full data export within Bitbucket, indicating possible data exfiltration or malicious intent by an unauthorized user. The likely objective of the attacker would be to access sensitive code repositories or confidential data for later exploitation. This detection aligns with the MITRE ATT&CK tactic of Collection (TA0009) and the techniques of Data from Information Repositories (T1213.003) and Exfiltration Over Web Service (T1586). The primary telemetry source is Bitbucket's audit logs, specifically events related to unauthorized actions in data handling.

  If this behavior is malicious, it can lead to significant security impacts, including loss of intellectual property, compromised source code, and potential regulatory violations. However, this detection does NOT confirm that the data was successfully exported or exfiltrated; it only indicates that an unauthorized attempt was made.

  ### Investigation Steps

  - **Review audit logs for unauthorized events**: Check Bitbucket audit logs (Audit Type: Data pipeline) for events matching "Unauthorized full data export triggered" to confirm the alert details (Event Type: 5715).

  - **Identify user permissions**: Cross-reference the user account attempting the export against your access control lists to verify if they should have permission to perform data exports. Look for fields like `actor.username` and `actor.permissions`.

  - **Compare activity with baseline behavior**: Analyze normal operational patterns for data exports in the Bitbucket environment. Understand what lawful export requests look like, including typical user accounts, timing, and frequency.

  - **Look for abnormal user behavior**: Investigate the account associated with the alert for any other suspicious activities such as failed login attempts or unusual repository accesses (Event IDs related: 5713, 5714).

  - **Correlate with network logs**: If applicable, check for external API calls or unusual network traffic patterns related to the export attempt. Look in firewall or proxy logs for unusual data transfer attempts (focus on URLs or methods used).

  ### Prioritization

  This alert should be considered critical due to the potential impact on sensitive systems, especially if the Bitbucket instance houses proprietary code or key infrastructure components. The likelihood of malicious abuse is high for unauthorized export attempts, as these actions can lead to significant data breaches, and this behavior is often weaponized by attackers.

  ### Blind Spots and Assumptions

  The detection could miss legitimate actions if a known user is misconfigured with permissions to perform data exports, potentially leading to false negatives. For effective detection, ensure that audit logging is set to "Advanced" to capture all necessary events. This alert may also trigger during legitimate automated processes or API calls, particularly from CI/CD pipelines. A companion detection to strengthen coverage could involve monitoring unusual modification patterns or access attempts to sensitive repositories.

