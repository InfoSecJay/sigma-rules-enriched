note: |
  ### Technical Context
  This detection rule identifies unauthorized attempts to trigger a full data export in Bitbucket, a popular platform for version control and collaborative software development. The primary threat scenario involves an adversary seeking to exfiltrate sensitive code, configuration files, or other intellectual property from a Bitbucket repository without proper authorization. By targeting Bitbucket, attackers might aim to disrupt development processes, gather competitive intelligence, or employ the stolen data for further malicious activities.

  The relevant MITRE ATT&CK tactics for this detection include **Collection** (TA0009) as the rule focuses on capturing attempts to gather data, and **Resource Development** (TA0042), which highlights the potential establishment of capabilities or tools that assist in the unauthorized export of data (attack techniques T1213.003 and T1586). The primary data source for this alert is the Bitbucket audit log, which documents activities within the platform, including user actions related to data processing and exports.

  ### Investigation Steps
  - **Verify User Permissions:** Review the user account attempting the unauthorized export to check their permission levels and role assignments within Bitbucket. Ensure they should not have access to perform full data exports.

  - **Examine Audit Logs:** Analyze Bitbucket audit logs for entries related to the unauthorized export attempt. Specifically, look for timestamps, involved user IDs, and any related events preceding the export to understand the context.

  - **Review Export Details:** Investigate the specifics of the full data export request, including what data was targeted and the export format. This will help assess the potential impact of the export.

  - **Correlate with Network Traffic:** If applicable, correlate the logged events with network traffic data to identify any unusual connections or suspicious patterns that coincide with the unauthorized export attempt.

  ### Prioritization
  This alert is categorized as critical due to the severe impact unauthorized data exports can have on an organization, potentially leading to intellectual property theft or data breaches. The likelihood of such activities occurring can increase during a compromised account scenario, warranting swift investigation and response.

  ### Blind Spots and Assumptions
  There may be detection gaps if the Bitbucket audit logs are not set at the "Advance" log level, as required for capturing these events. The detection logic assumes that unauthorized users will attempt to perform data exports which may not always be evident unless proper access controls are in place. Additional configurations may be required to ensure comprehensive logging of all user activities related to data exports, including sufficient retention of audit logs for analysis.

