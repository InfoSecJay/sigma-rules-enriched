note: |
  ### Technical Context

  This rule detects the event of a full data export being initiated within Bitbucket, indicating a potential attempt to extract a significant volume of sensitive data. The likely attacker objective is data exfiltration for the purpose of intellectual property theft or sabotage, especially if targeting proprietary code repositories. This behavior corresponds with the MITRE ATT&CK technique “Data from Information Repositories” (T1213.003). The primary telemetry source for this detection is Bitbucket's audit logs with specific attention to audit events under the category of “Data pipeline.” If malicious, this action poses a substantial security risk, as it may lead to unauthorized access to and extraction of proprietary code and project documentation. It is important to note that this detection alone does not confirm that the export is malicious, as legitimate users may initiate full data exports for valid purposes.

  ---

  ### Investigation Steps

  - **Review audit log entry details**: Check Bitbucket audit logs for Event type "Full data export triggered" (Event ID specifics may vary). Validate who initiated the export and when. Look for any exports conducted during unusual hours or from non-standard accounts, which may indicate malicious activity.

  - **Query user access levels and permissions**: Verify the user account that triggered the export. Confirm whether the user has the appropriate permissions for exporting data and whether this aligns with their usual role and activities. Benign indicators include a user with a standard developer role conducting a data export.

  - **Examine historical export frequency**: Look for patterns in previous full data export actions by the user in question. If this is a first-time action for a user or the frequency is significantly increased, it may warrant further investigation. Benign indicators include regular usage patterns consistent with project backups.

  - **Validate network behavior**: Check network logs or outbound traffic for large data transfers correlating with the timing of the export. Use firewalls or network monitoring tools to identify any substantial data flows leaving the network in conjunction with the export. High-confidence malicious indicators include unusual data volumes being sent to external IP addresses.

  - **Inspect for accompanying user actions**: Review the user’s activity in Bitbucket leading up to the export. Look for actions such as the creation of new access tokens or changes in repository visibility. This can highlight preparatory steps often taken by threat actors.

  - **Cross-reference with related alerts**: Check for concurrent alerts related to the user’s account that may indicate suspicious behavior, such as unauthorized access attempts or privilege escalation alerts to establish a broader context of the user’s actions.

  ---

  ### Prioritization

  The alert is of high severity due to the potential impact of unauthorized data access and exfiltration from critical code repositories. The likelihood of this behavior being exploited by adversaries is significant, as data export functionalities are often targeted in attacks. Such behavior is increasingly weaponized by threat actors aiming to compromise sensitive intellectual property.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by users’ legitimate roles that require data exports, therefore producing false positives, especially if not all activities are logged appropriately. Organizations must ensure that Bitbucket's "Advance" logging level is enabled to capture the necessary audit events. Additionally, the alert may trigger benign activities like scheduled backups or migrations. Companion detections, such as the monitoring of access to sensitive repositories or changes to user permissions, can strengthen the overall coverage and context for identifying malicious behavior.

