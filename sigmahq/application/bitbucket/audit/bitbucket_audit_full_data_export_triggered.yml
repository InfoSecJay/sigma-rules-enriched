note: |
  ### Technical Context
  This rule detects when a full data export is initiated in Bitbucket, a popular version control system used for software development. The trigger for this alert could suggest potentially malicious activity, such as an insider threat or an unauthorized external actor attempting to exfiltrate sensitive repository data. Attackers often target data repositories to obtain valuable information, including source code, documentation, and project metadata, which can be used for espionage, sabotage, or other malicious intents.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior primarily include **Collection** (TA0009) and specifically **Data from Information Repositories** (T1213.003). These categories emphasize the importance of understanding how data can be targeted and harvested from systems. Detecting anomalies in data export actions is crucial for maintaining the confidentiality and integrity of the organization's intellectual property.

  To support this detection, the primary data sources include Bitbucket audit logs that capture events related to user actions, specifically those logged at the "Advance" log level. This level of logging is essential to ensure that events related to data exports are recorded and available for monitoring.

  ### Investigation Steps
  - **Review Audit Logs**: Check the Bitbucket audit logs for the timestamp associated with the export action. Confirm who initiated the export, their role, and whether this is a typical activity for them.

  - **Identify Unusual Patterns**: Evaluate recent user activity leading up to the data export. Look for unusual patterns, such as failed login attempts, escalated privileges, or exports occurring outside of normal business hours.

  - **Assess Data Sensitivity**: Determine what data was included in the export. This may involve cross-referencing the specific repositories or branches targeted with the organization's data classification policies.

  - **Verify User Intent**: If a legitimate user triggered the export, consult with them to ensure that the data export aligns with company policy and their current projects, especially if it includes sensitive or proprietary information.

  ### Prioritization
  The severity of this alert is high due to the potential risk of sensitive data exposure and the likelihood of misuse, making it critical to assess and respond promptly to prevent unauthorized access or data loss.

  ### Blind Spots and Assumptions
  This detection rule relies heavily on the availability of "Advanced" log level settings in Bitbucket to capture important audit events. There may be gaps in coverage if this logging level is not implemented across all Bitbucket instances or if user permissions allow for data exports without appropriate oversight. Additionally, the detection logic assumes that all data exports will be logged as intended; any failures in logging could lead to undetected malicious activity. Organizations must ensure proper configuration and monitoring of audit logs to maintain effective detection capabilities.

