  ---

  ### Technical Context

  This Sigma rule detects when a full data export from Bitbucket is initiated. Typically, this export can be exploited by an adversary to exfiltrate repository contents and associated metadata, potentially compromising sensitive code and project information. The attacker objective may involve collecting proprietary data or intelligence on internal projects and personnel, aligning with the MITRE ATT&CK tactic of "Collection" (TA0040) and technique "Data from Information Repositories" (T1213.003).

  Primary telemetry sources are Bitbucket's audit logs, specifically events generated during full data export actions. If the export is unauthorized, it could lead to significant exposure of intellectual property or sensitive information, raising both security and compliance concerns. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate users can also trigger such exports.

  ---

  ### Investigation Steps

  - **Verify the user identity:**
    Check the user account associated with the export in the Bitbucket audit logs (Log Type: Audit Logs, Fields: `user.username`, `auditType.action`), confirming whether they have legitimate access permissions for exporting data.

  - **Review the context of the request:**
    Cross-reference the timestamp of the data export with other user activity in the Bitbucket logs. Look for unusual prior actions such as repository access or unusual repository configurations.

  - **Check for historical behavior:**
    Investigate the audit logs for prior data export events linked to the same user. Frequent or unusual exports from the same account may suggest malicious intent (Audit Log: `auditType.action`).

  - **Correlate with other security events:**
    Review the SIEM for related alerts within a 24-hour window prior to the export event. Look for signs of privilege escalation or unauthorized access (e.g., Event ID 4624 for logon events).

  - **Identify benign activity patterns:**
    Legitimate data export requests are typically performed by DevOps roles or during scheduled maintenance windows. Review asset inventory and roles assigned to users performing the export.

  - **Confirm file creation or data staging:**
    Look for any subsequent file creation or storage events in cloud storage or local servers that could host the exported data, indicating potential exfiltration (Log Type: File Creation Events, Fields: `file.name`, `action`).

  ---

  ### Prioritization

  This alert should be treated with high priority due to the potential for significant data loss from critical systems, especially if an unauthorized user is involved. The likelihood of malicious use is high, as exfiltration of code and project details are common objectives for attackers looking to compromise organizational assets.

  ---

  ### Blind Spots and Assumptions

  There are limitations with this detection, particularly if logging configurations are not set correctly to capture all relevant events at advanced log levels. Legitimate activities, such as administrative tasks by DevOps teams or migrations, may trigger this alert, causing false positives. A related detection such as unauthorized access to Bitbucket repositories would complement this rule, enhancing overall coverage for potential malicious behavior.

