note: |
  ### Technical Context

  This rule detects the addition of a repository to the exempt list for secret scanning within Bitbucket. This behavior may indicate either an effort to bypass security protocols that scan for sensitive information or a legitimate configuration change. Notably, attackers may seek to exploit exempted repositories to store or transmit secret tokens or credentials without detection. This relates to the MITRE ATT&CK technique "Exploitation for Client Execution" (T1562.001) as it reflects a potential evasion tactic.

  The primary telemetry source for this rule is the Bitbucket audit logs, specifically logging events related to repository actions. The security impact is significant if malicious, as exempting a repository from secret scanning can facilitate data breaches or unauthorized access. Importantly, this detection does NOT confirm malicious intent on its own; legitimate users may also modify repository settings for valid reasons.

  ### Investigation Steps

  - **Review audit logs for recent changes:** Check Bitbucket audit logs for Event IDs related to repository changes (e.g., `auditType.category: 'Repositories'`, `auditType.action: 'Secret scanning exempt repository added'`). Focus on timestamps around the alert to filter relevant entries.

  - **Identify user identity and behavior:** Look for the username associated with the exempt addition. Determine if this user typically performs such actions or if their role necessitates changes that could require exemptions, indicating benign behavior.

  - **Cross-reference repository history:** Analyze the repository’s history for any sensitive data exposures (e.g., accidental commits of secrets). Use Git history to identify if sensitive files were previously committed and assess if the exemption aligns with prior security guidelines.

  - **Check for related alerts or settings changes:** Investigate if any other security settings, like access control changes, have been modified concurrently. Look in audit logs for related actions or alerts that could indicate a pattern of intent (e.g., other exemptions or permission adjustments).

  - **Consider asset risk:** Evaluate the criticality of the affected repository (e.g., does it contain sensitive projects or code?). High-value repositories should be treated with greater scrutiny due to their potential consequences on operations if compromised.

  ### Prioritization

  This alert holds a high severity in an enterprise context due to the possible implications of exempting repositories from secret scanning. The likelihood of malicious abuse is concerning, especially if it aligns with known tactics and techniques used in prior data theft incidents. This behavior can be weaponized to bypass security controls systematically.

  ### Blind Spots and Assumptions

  Detection limitations exist since users may legitimately exempt repositories for various reasons, potentially leading to false positives. Ensuring proper configurations for logging (e.g., basic log level for audit events) is essential to maintain reliable detection. Additionally, legitimate development practices might lead to similar changes, such as a developer exempting a repository for significant updates. A related detection to strengthen coverage is tracking unauthorized permission changes in repositories, which can help identify potentially malicious intent associated with the exemption.

