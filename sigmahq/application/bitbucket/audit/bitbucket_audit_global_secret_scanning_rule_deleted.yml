note: |
  ### Technical Context
  This detection rule focuses on identifying the deletion of global secret scanning rules in Bitbucket. Such activity is critical as these rules are designed to detect and prevent the unintentional exposure of sensitive information, like API keys and passwords, through version control systems. The unauthorized deletion of these rules could indicate a compromise, where an attacker seeks to disable security measures to enable data exfiltration or other malicious activities.

  The threat scenario typically involves an adversary gaining inappropriate access to the Bitbucket repository infrastructure, often through techniques aligned with the MITRE ATT&CK tactics of **Defense Evasion** (T1562.001: Impair Defenses). By removing or altering security configurations, the attacker aims to facilitate their actions unnoticed, leading to potential data breaches or leakage of sensitive information.

  The primary data source for this detection includes the Bitbucket audit logs, specifically events logged under the "Global administration" category. It is crucial to have the audit logs set to at least the "Basic" log level to capture these deletion events effectively.

  ### Investigation Steps
  - **Review Audit Logs**: Check Bitbucket audit logs for entries related to “Global secret scanning rule deleted”. Look for the user initiating this action and the timestamp to correlate the activity with other events.

  - **Assess User Permissions**: Investigate the user account that performed the deletion. Verify if they have legitimate reasons and appropriate permissions for making such changes. Review any recent privilege escalations that may have occurred.

  - **Correlate Other Events**: Look for related user activities around the same timeframe, such as unusual repository access patterns or modifications in security settings, to establish a context for the deletion.

  - **Examine Environmental Changes**: Check for any recent policy changes or updates in your Bitbucket configuration that may have impacted the global secret scanning rules to differentiate between legitimate administrative actions and potential attacks.

  ### Prioritization
  The alert is classified with medium severity due to the potential risk it poses; unauthorized deletions of security controls can lead to significant vulnerabilities and data exposure within the enterprise, especially if the environment relies heavily on Bitbucket for source code management.

  ### Blind Spots and Assumptions
  One potential blind spot includes the failure to capture offensive actions if the necessary audit logging is not enabled or misconfigured, particularly if the logs have been set to a lower sensitivity than "Basic". The detection logic assumes that all deletions of global secret scanning rules indicate malicious intent, which might not account for legitimate administrative actions conducted by authorized users. Proper configurations and access controls must be validated to ensure the alert functions effectively.

