  ### Technical Context

  This rule detects the deletion of global secret scanning rules within Bitbucket. An attacker could aim to disable security measures to hide sensitive data exposure or further their objectives with minimal detection. This behavior correlates with the MITRE ATT&CK tactic "Defense Evasion" and the technique ID T1562.001 (Disable or Modify Security Tools). The primary telemetry source consists of Bitbucket audit logs, specifically looking for events related to rule deletions. If malicious, this could have a significant security impact by allowing an attacker to bypass detection of exposed secrets. Importantly, this detection alone does not confirm malicious intent; legitimate users may also delete rules during normal operations.

  ### Investigation Steps

  - **Verify audit log entries:** Check Bitbucket audit logs for telemetry entries related to the deletion of global secret scanning rules (action: 'Global secret scanning rule deleted'). Look at the timestamp and user responsible.

  - **Identify user roles:** Determine whether the user who deleted the rule has a legitimate role capable of such actions (e.g., administrator). Consult the user management logs (Event ID not specified, refer to Audit logs) to confirm role assignments.

  - **Check for recent configurations:** Review changes made to configurations in the Bitbucket repository around the same time. Look for other audit log entries indicating potential malicious behavior, such as unauthorized changes to repository settings.

  - **Assess deletion frequency:** Analyze patterns of global secret scanning rule deletions. Frequent deletions may signify malicious intent, whereas isolated incidents may indicate legitimate updates or admin housekeeping.

  - **Cross-reference with ongoing incidents:** Correlate the deletion with other alerts in your incident response system. Look for indicators of compromise (IoCs) that might hint at a broader attack or exploitation scenario.

  ### Prioritization

  This alert should be treated with medium severity due to the sensitive nature of secret scanning functionality in Bitbucket, impacting code security. The likelihood of malicious abuse exists, especially in environments with active threat actors or improper access controls. While this activity may not be common, its potential weaponization makes it significant.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative activities, particularly if users are empowered with broad privileges. The accuracy of this detection relies on correct logging configurations at the "Basic" log level to capture relevant events. Additionally, legitimate activity such as routine maintenance by privileged users may trigger this alert. A related detection could involve monitoring for the creation of global secret scanning rules, providing insight into whether deliberate operational security measures are being established or dismantled.

