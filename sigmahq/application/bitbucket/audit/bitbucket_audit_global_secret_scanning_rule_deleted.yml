note: |
  ### Technical Context

  This Sigma rule detects the deletion of global secret scanning rules in Bitbucket, a crucial security measure that helps identify sensitive data within repositories. The likely attacker objective is to disable the scanning mechanism, thereby evading detection of sensitive information such as API keys, passwords, or other secrets. This behavior fits within the MITRE ATT&CK framework under the tactic of Defense Evasion (TA0005), specifically Technique T1685: Deletion of Event Data.

  The primary telemetry source is the Bitbucket audit log, specifically events categorized under 'Global administration' with actions related to the deletion of secret scanning rules. If malicious, this could signify an attempt to undermine the organization's security posture by silencing detection mechanisms for sensitive data. Importantly, this detection does not confirm whether the deletion was performed maliciously; it merely indicates that such an action occurred.

  ### Investigation Steps

  - **Identify the user responsible for the action:** Review the Bitbucket audit log for `auditType.action: 'Global secret scanning rule deleted'`. Confirm the user account performing the deletion and validate its activity history for any indications of compromise or unusual behavior.

  - **Evaluate the timing and frequency of deletions:** Cross-reference the timeframe of the deletion with other audit log entries to identify any patterns or related actions, such as multiple deletions occurring in a short time frame, which may indicate malicious intent.

  - **Confirm expected behavior:** Investigate whether the deletion matches standard operational practices by verifying with the responsible team if the removal was authorized and documented. Legitimate use cases may include updates for compliance or operational changes.

  - **Check for lateral movement indicators:** Search for related audit log events around the same time, focusing on higher-risk actions such as multiple logins (e.g., `auditType.action: 'User logged in'`) from the same account, which could indicate further malicious activity.

  - **Assess for other associated activity:** Look for any changes to repository access controls or other security-related settings in the audit logs around the same date as the deletion event, signaling potentially coordinated malicious actions.

  ### Prioritization

  This alert is medium severity due to the potential impact of disabling secret scanning in an enterprise context, which could lead to unmonitored exposure of sensitive data. The likelihood of malicious abuse is moderate as evading detection is a common tactic among adversaries. While not universally weaponized, it is critical to be vigilant as this behavior indicates possible breach attempts.

  ### Blind Spots and Assumptions

  Detection may be limited by the ability to log all necessary audit events; inadequate logging settings (e.g., not set to "Basic" level) could lead to missed detections. Legitimate administrative actions, such as routine security policy updates, may trigger this alert, complicating triage efforts. A companion detection, such as tracking access changes to repositories (e.g., global permissions modifications), could strengthen overall coverage and provide context for the deletion behavior.

