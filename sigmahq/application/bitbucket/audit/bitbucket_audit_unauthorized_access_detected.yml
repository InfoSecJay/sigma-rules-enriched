note: |
  ### Technical Context

  This Sigma rule detects unauthorized access attempts to Bitbucket resources, indicating that an entity is trying to access a repository or resource without proper permissions. The likely attacker objective is to gain access to sensitive code or project artifacts, potentially for data exfiltration or sabotage. This behavior aligns with the MITRE ATT&CK tactic "Credential Access" (T1586) and technique "Account Discovery" (T1087).

  The primary telemetry sources for this detection are Bitbucket audit logs, specifically focusing on events where the auditType category is marked as 'Security' and the action is categorized as 'Unauthorized access to a resource'. If malicious, this access attempt could indicate a compromised account or insider threat. It is important to note that this detection does NOT confirm a successful breach; it only indicates that there was an unauthorized attempt.

  ### Investigation Steps

  - **Review Bitbucket Audit Logs for Unauthorized Access Events**: Check auditType.category for 'Security' and auditType.action for 'Unauthorized access to a resource' in Bitbucket audit logs (Event ID specific to unauthorized access events). Look for the 'author.name' field; if it's marked as "Anonymous," further investigation may be needed.

  - **Verify Legitimate User Activity**: Look for recent activity from legitimate users with the appropriate permissions to access the resource in question. Cross-reference timestamps and resource names with expected project workflows to ensure that known users are behaving as anticipated.

  - **Correlate with Access Control Changes**: Investigate any recent changes to repository or project permissions that may coincide with the unauthorized access attempts. Check for changes in user roles or access rights through Bitbucket audit logs reflecting 'Security' category modifications.

  - **Identify High-Confidence Malicious Indicators**: Check sourcetyping for unusual IP addresses or geolocation in connection with the access attempt. A consistent pattern of unauthorized attempts from the same IP, especially from foreign regions not typically associated with business operations, may indicate malicious intent.

  - **Assess Impact on Critical Assets**: Identify if the unauthorized access attempt targets sensitive repositories or critical infrastructure. For instance, the risk is higher if the attempts are against production repositories rather than development or testing branches.

  - **Ensure Logging Configuration**: Confirm that the Bitbucket server's logging configuration is set to "Advance" to capture detailed audit events. If the required audit log level is not enabled, while analyzing alerts may yield false negatives.

  ### Prioritization

  The severity of this alert is critical due to the potential impact of unauthorized access to sensitive code repositories, which may lead to data breaches or operational disruptions. The likelihood of malicious abuse is high, as unauthorized access is a common precursor to further exploitation in software development environments.

  ### Blind Spots and Assumptions

  One limitation of this detection is that it may be bypassed if attackers use legitimate credentials through social engineering or insider threats. Ensuring the proper configuration of audit logs is essential for consistent detection; without the "Advance" log level, some attempts may go undetected. Legitimate activities, such as automated scripts or CI/CD processes, may also trigger this alert if not adequately accounted for. A related detection for account compromise attempts or unusual login patterns would strengthen detection coverage and provide a clearer threat context.

