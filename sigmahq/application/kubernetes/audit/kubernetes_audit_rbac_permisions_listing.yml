title: RBAC Permission Enumeration Attempt
id: 84b777bd-c946-4d17-aa2e-c39f5a454325
status: test
description: |
  Detects identities attempting to enumerate their Kubernetes RBAC permissions.
  In the early stages of a breach, attackers will aim to list the permissions they have within the compromised environment.
  In a Kubernetes cluster, this can be achieved by interacting with the API server, and querying the SelfSubjectAccessReview API via e.g. a "kubectl auth can-i --list" command.
  This will enumerate the Role-Based Access Controls (RBAC) rules defining the compromised user's authorization.
references:
- https://www.elastic.co/guide/en/security/current/kubernetes-suspicious-self-subject-review.html
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1069.003
- attack.t1087.004
- attack.discovery
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    apiGroup: 'authorization.k8s.io'
    objectRef.resource: 'selfsubjectrulesreviews'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ---

  ### Technical Context

  This rule detects attempts to enumerate Kubernetes RBAC permissions using the SelfSubjectAccessReview API, typically via commands like `kubectl auth can-i --list`. The likely attacker objective is to gather intelligence on user privileges within the cluster as part of the reconnaissance phase of an attack. This behavior maps to the MITRE ATT&CK technique ID T1069.003 (Permission Groups Discovery) and T1087.004 (Account Discovery). The primary telemetry sources for this detection are Kubernetes audit logs, specifically the events tied to the `create` verb on the `selfsubjectrulesreviews` resource within the `authorization.k8s.io` API group. If this detection indicates malicious activity, it can lead to privilege escalation or lateral movement within the Kubernetes environment. Importantly, this detection does NOT confirm that an unauthorized action has taken place on its own, as legitimate users may perform the same actions.

  ---

  ### Investigation Steps

  - **Review audit logs for SelfSubjectAccessReview events**: Check Kubernetes audit logs (e.g., `kube-audit-*` or specific file locations) for events with `verb: create` and `objectRef.resource: selfsubjectrulesreviews`. Compare timestamps and user IDs to identify unusual activity.

  - **Identify the user initiating the request**: Examine the `user.userInfo` field in the audit log to determine who executed the enumeration attempt. Validate if this user typically performs this action or has legitimate access.

  - **Correlate with legitimate usage patterns**: Confirm if the user and their role typically perform `kubectl auth can-i` commands. Consider the context—recall that developers may need to verify permissions, while an unexpected user performing this action may be indicative of malicious intent.

  - **Check for concurrent suspicious activities**: Review other relevant logs for the same user around the same time (e.g., `kubectl` commands executed or changes to RBAC roles) to identify if this is part of a broader suspicious pattern.

  - **Investigate the cluster's security posture**: Ensure that RBAC is appropriately configured and assess if there are recently modified roles or cluster policies that could indicate prior attempts at privilege escalation or unauthorized access.

  - **Look for high-confidence malicious indicators**: Inspect for known malicious actors or Service Accounts linked to this enumeration attempt. Flag any anomalies or frequent API calls that do not align with typical user behavior.

  ---

  ### Prioritization

  This alert is of low severity; however, it warrants investigation due to its potential to indicate a reconnaissance effort leading to privilege escalation. While this behavior can be part of routine operations in Kubernetes, attempts by unauthorized users significantly increase the risk of compromise. Attackers have weaponized similar enumeration techniques in the past.

  ---

  ### Blind Spots and Assumptions

  Detection may miss attempts made by unauthorized identities that do not trigger the audit logs due to misconfiguration or insufficient log verbosity settings. Relying solely on audit logs may lead to underreporting legitimate user activities, such as developers checking their permissions. It’s vital to complement this rule with detections for other discovery techniques (e.g., T1087.001 Account Discovery via enumeration of user credentials) to strengthen coverage. Proper logging configurations are critical to ensure comprehensive visibility in Kubernetes environments.

