title: RBAC Permission Enumeration Attempt
id: 84b777bd-c946-4d17-aa2e-c39f5a454325
status: test
description: |
  Detects identities attempting to enumerate their Kubernetes RBAC permissions.
  In the early stages of a breach, attackers will aim to list the permissions they have within the compromised environment.
  In a Kubernetes cluster, this can be achieved by interacting with the API server, and querying the SelfSubjectAccessReview API via e.g. a "kubectl auth can-i --list" command.
  This will enumerate the Role-Based Access Controls (RBAC) rules defining the compromised user's authorization.
references:
- https://www.elastic.co/guide/en/security/current/kubernetes-suspicious-self-subject-review.html
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1069.003
- attack.t1087.004
- attack.discovery
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    apiGroup: 'authorization.k8s.io'
    objectRef.resource: 'selfsubjectrulesreviews'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies attempts to enumerate Kubernetes Role-Based Access Control (RBAC) permissions using the SelfSubjectAccessReview API. When a potential attacker gains access to a Kubernetes cluster, one of their primary objectives is to understand the permissions associated with their identity. By running commands such as "kubectl auth can-i --list", they query the API server to retrieve information about what actions they can perform, effectively mapping their privileges within the environment.

  The relevant tactics and techniques from the MITRE ATT&CK framework include **Discovery (TA0007)** and more specifically, **Account Discovery (T1087.004)**, which focuses on understanding user identities and their permissions. Another important technique is **Permission Management (T1069.003)**, which pertains to the assessment and evaluation of permissions granted to users. The primary data sources that will provide evidence of these activities include Kubernetes audit logs, which log API server interactions, specifically for operations related to RBAC permissions.

  ### Investigation Steps
  - **Review Kubernetes Audit Logs:** Examine audit logs for any ‘create’ request to the `/apis/authorization.k8s.io/v1/selfsubjectaccessreviews` endpoint, specifically for commands involving RBAC enumeration.
  - **Analyze User Activity:** Check the identity and associated actions of the user making the requests. Look for patterns indicating reconnaissance or suspicious behavior within the context of the Kubernetes environment.
  - **Correlate with Access Patterns:** Identify if the enumeration attempts align with recent changes to the cluster's RBAC policies or sudden changes in a user's behavior, such as elevated privileges or access paths.
  - **Evaluate Cluster Configuration:** Ensure Kubernetes audit logging is properly configured to capture necessary API requests for ongoing monitoring of user actions and potential malicious behavior.

  ### Prioritization
  The alert has a low severity level due to the inherent risks associated with routine RBAC enumeration; however, it could indicate initial reconnaissance activities preceding a potential escalation or lateral movement within the Kubernetes environment. Continuous monitoring is essential to detect when this behavior is indicative of an actual compromise.

  ### Blind Spots and Assumptions
  This detection rule may miss enumeration attempts made through unauthorized third-party tools or scripts that do not utilize the Kubernetes API in a detectable manner. It assumes that audit logging is enabled and correctly captures API interactions, which is not always guaranteed in all deployments. Additionally, it does not account for legitimate users performing routine permission assessments, leading to potential false positives without sufficient context.

