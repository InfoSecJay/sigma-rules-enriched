- attack.t1087.004
- attack.discovery
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    apiGroup: 'authorization.k8s.io'
    objectRef.resource: 'selfsubjectrulesreviews'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects attempts to enumerate RBAC (Role-Based Access Control) permissions in a Kubernetes cluster via the `SelfSubjectAccessReview` API. Attackers may use this to assess their level of access and to plan further actions within a compromised environment. The relevant MITRE ATT&CK techniques for this behavior include Discovery of Permissions (T1069.003) and Software Discovery (T1087.004).

  Primary telemetry sources include Kubernetes audit logs that capture requests made to the API server, specifically events where the verb is 'create' and the `objectRef.resource` corresponds to `selfsubjectrulesreviews`. If the activity is malicious, it may indicate an attempt to exploit access for unauthorized actions. This detection does NOT confirm successful exploitation or unauthorized access on its own but serves as an indicator of potential reconnaissance activity.

  ### Investigation Steps

  - **Check Kubernetes audit logs:** Review Kubernetes audit logs for Event type `create` for `authorization.k8s.io/selfsubjectrulesreviews` (Event ID specific to Kubernetes audit logging). Look for the initiating user or service account to establish if the access is appropriate.

  - **Validate the user or service account:** Identify the user or service account issuing the request and confirm if their access aligns with expected roles. Legitimate roles should typically have limited permissions unless justified.

  - **Analyze cluster role bindings:** Lookup existing RBAC role bindings for the user using `kubectl get rolebindings --all-namespaces` command. Compare the retrieved roles against organizational policies for anomalies.

  - **Identify any high-confidence malicious indicators:** Look for patterns of repeated API requests or unexpected requests from accounts that are not typically involved in administrative actions.

  - **Investigate surrounding activity:** Correlate access review events with other audit logs (e.g., job executions or resource creation) around the same time for suspicious activity patterns that may indicate escalation attempts.

  - **Benchmark against legitimate behavior:** Review normal RBAC request patterns from trusted users or automated services that regularly audit permissions. Document differences from flagged activities.

  ### Prioritization

  This alert is classified as low severity due to its nature of information gathering rather than immediate threat. However, the impact could escalate if adversaries possess additional capabilities to exploit discovered permissions. Given the frequency of exploitation attempts via permission enumeration, this behavior warrants attention in a mature SOC environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Kubernetes audit logging; ensure all relevant events are being captured and retained. Legitimate interactions, such as automated tools performing access checks for maintenance, may trigger this alert. A complementary detection could involve monitoring for unauthorized changes to RBAC configurations, which would strengthen overall security postures against privilege escalation.

