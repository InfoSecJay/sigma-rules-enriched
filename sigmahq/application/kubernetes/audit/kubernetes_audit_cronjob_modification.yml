detection:
  selection:
    objectRef.apiGroup: 'batch'
    objectRef.resource:
    - 'cronjobs'
    - 'jobs'
    verb:
    - 'create'
    - 'delete'
    - 'patch'
    - 'replace'
    - 'update'
  condition: selection
falsepositives:
- Modifying a Kubernetes Job or CronJob may need to be done by a system 
  administrator.
- Automated processes may need to take these actions and may need to be 
  filtered.
level: medium
note: |
  ### Technical Context

  This rule detects the creation or modification of Kubernetes CronJobs and Jobs, which are essential for scheduling tasks within a cluster. An attacker could leverage these Kubernetes objects to establish persistence by scheduling malicious containers to run at specific intervals. The relevant MITRE ATT&CK techniques are "Persistence via CronJob" (T1543.003) and "Privilege Escalation" (T1601).

  The primary telemetry source is Kubernetes audit logs, specifically focusing on actions related to objects in the "batch" API group, including the "cronjobs" and "jobs" resources. If malicious, the impact can be severe as it can allow unauthorized code execution within the cluster. This detection does NOT confirm that the actions were performed with malicious intent, as benign administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Check Kubernetes audit logs for action details**: Examine the Kubernetes audit log with Event ID or API call details such as `objectRef.resource: cronjobs` or `objectRef.resource: jobs`. Pay attention to the `verb` field for `create`, `delete`, or `update`.

  - **Assess the user context**: Investigate the `user.username` and `user.groups` fields in the audit logs. If the operation was performed by a user with admin privileges without an adequate justification (e.g., no legitimate operational needs), it raises suspicion.

  - **Identify unusual schedule configurations**: Review the `spec.schedule` field in the CronJob definition. Schedules that are set to run at atypical times (e.g., system off-hours) or frequent execution rates (e.g., every minute) could indicate malicious intent.

  - **Examine linked container images**: Check the `spec.template.spec.containers[*].image` field for the images being executed. Verify that these images are from trusted repositories. Unauthorized or suspicious images (e.g., public images with administrative tools) should be flagged.

  - **Review legitimate operational changes**: Understand and document typical operational patterns for CronJob or Job creation/updates by system administrators. Expect specific non-malicious tasks (e.g., backup jobs) to be scheduled at regular intervals to verify against alerts.

  ### Prioritization

  Given that Kubernetes is critical to operational workflows, alerts regarding CronJob and Job modifications warrant medium severity. The likelihood of adversaries manipulating these resources is reasonable, as they can lead to persistence and privilege escalation. This behavior is often weaponized in actual attacks.

  ### Blind Spots and Assumptions

  This rule may have limitations, such as false positives triggered by legitimate administrative activities or automated CI/CD processes. Ensure comprehensive coverage by maintaining Kubernetes audit logs, which might require specific configurations to avoid gaps in logging. Legitimate automated processes that perform these modifications, such as scheduled maintenance tasks or updates, must also be considered. A related detection that strengthens coverage is monitoring for unusual pod activity linked to these jobs (e.g., unexpected pod creation or execution).

