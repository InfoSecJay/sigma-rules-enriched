title: Potential Sidecar Injection Into Running Deployment
id: ad9012a6-e518-4432-9890-f3b82b8fc71f
status: test
description: |
  Detects attempts to inject a sidecar container into a running deployment.
  A sidecar container is an additional container within a pod, that resides alongside the main container.
  One way to add containers to running resources like Deployments/DeamonSets/StatefulSets, is via a "kubectl patch" operation.
  By injecting a new container within a legitimate pod, an attacker can run their code and hide their activity, instead of running their own separated pod in the cluster.
references:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/update-api-object-kubectl-patch
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Sidecar%20Injection/
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1609
- attack.execution
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'patch'
    apiGroup: 'apps'
    objectRef.resource: 'deployments'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious attempts to inject a sidecar container into a running Kubernetes deployment via a `kubectl patch` operation. The sidecar container conceptually enhances the main application container by providing supplementary features, such as logging or monitoring. However, if exploited, an attacker could leverage this behavior to execute arbitrary code within a legitimate pod, thereby obscuring their actions from monitoring tools and remaining undetected for longer.

  Attackers aiming for sidecar injection typically seek to establish persistence, exfiltrate data, or conduct lateral movement without creating new pods that could draw attention. The primary MITRE ATT&CK tactics relevant to this scenario include **Execution** (TA0040) and more specifically the technique of **Container Injection** (T1609). These tactics highlight the malicious exploitation of container orchestration platforms such as Kubernetes, demonstrating the need for robust monitoring of deployment activities.

  Key telemetry sources that provide vital evidence include Kubernetes audit logs, particularly focusing on `kubectl` interactions related to deployment modifications.

  ### Investigation Steps
  - **Review Audit Logs:** Check Kubernetes audit logs for any `kubectl patch` operations against deployments, specifically looking for unexpected changes to existing pod structures.
  - **Analyze Container Configurations:** Inspect the configurations of modified pods to identify any unauthorized or unusual sidecar containers added to legitimate deployments, noting their images and command executions.
  - **Verify User Activity:** Investigate the identity of the user or service account that executed the patch operation. Cross-reference this activity with known permissions and activities to assess legitimacy.
  - **Correlate with Anomalies:** Look for unusual patterns or spikes in deployment and pod modification activities around the time of the detected sidecar injection, considering the context of recent changes or incidents.

  ### Prioritization
  The medium severity of this alert is justified by the potential risk of unauthorized access and control over sensitive applications within a cluster. Given the likelihood of a successful injection leading to serious impacts on data integrity and security, proactive investigation is critical in a cloud-native environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Kubernetes audit logging is not enabled or improperly configured, meaning some injection attempts could be missed. The logic assumes the presence of a legitimate `kubectl patch` operation, and false positives may emerge from legitimate CI/CD processes or administrative actions. It is essential for the Kubernetes cluster to have comprehensive audit logging settings enabled to ensure complete visibility into such changes.

