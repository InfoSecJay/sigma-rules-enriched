title: Potential Sidecar Injection Into Running Deployment
id: ad9012a6-e518-4432-9890-f3b82b8fc71f
status: test
description: |
  Detects attempts to inject a sidecar container into a running deployment.
  A sidecar container is an additional container within a pod, that resides alongside the main container.
  One way to add containers to running resources like Deployments/DeamonSets/StatefulSets, is via a "kubectl patch" operation.
  By injecting a new container within a legitimate pod, an attacker can run their code and hide their activity, instead of running their own separated pod in the cluster.
references:
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/update-api-object-kubectl-patch
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Sidecar%20Injection/
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1609
- attack.execution
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'patch'
    apiGroup: 'apps'
    objectRef.resource: 'deployments'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects attempts to inject a sidecar container into a running Kubernetes deployment using the `kubectl patch` command. The likely objective of an attacker is to run malicious code within the context of a legitimate container, leveraging its permissions and network access to obfuscate their activity. This behavior corresponds to the MITRE ATT&CK technique "Sidecar Injection" (T1609).

  The primary telemetry sources are Kubernetes audit logs, specifically filtering for `verb: 'patch'` and targeting `objectRef.resource: 'deployments'`. If malicious, the security impact can be significant as it opens pathways for lateral movement and the execution of unauthorized code within the cluster. It's important to note that this detection does NOT confirm compromise on its own; legitimate users with appropriate permissions could also issue such commands.

  ### Investigation Steps

  - **Verify the audit log entry:** Cross-reference Kubernetes audit logs for event details, specifically looking for entries with `verb: 'patch'` and `objectRef.resource: 'deployments'` in fields like `resource.namespace` and `user.agent` (e.g., changes made by a user or service account should have identifiable details).

  - **Check user activity context:** Review the identity of the user or service account executing the `kubectl patch` command. Legitimate users will have predefined roles with limited access; check for privileges against Kubernetes RBAC settings.

  - **Identify sidecar specifications:** Analyze the deployment manifest in question to confirm if the injected sidecar was expected. Legitimate deployments generally have a well-defined specification; unrecognized sidecars should raise concern.

  - **Investigate network connections:** Monitor network connections initiated by the newly injected container for unexpected or unauthorized outbound calls. Utilize network flow logs (e.g., from Service Mesh) to analyze communication patterns.

  - **Assess cluster role bindings:** Identify whether the user or service account has elevated privileges (e.g., ClusterRole or ClusterRoleBinding) that enable modifications to deployments. A high-confidence malicious indicator would be if a low-privilege user executes such a command.

  - **Evaluate pod security standards:** Cross-check with existing pod security policies to see if the injected sidecar adheres to established security protocols. Any deviations may signal further compromise.

  ### Prioritization

  This alert is medium priority as it indicates potential unauthorized alteration to a deployment, which can lead to significant security risks if the deployment is critical. The likelihood of malicious activity is moderate, given that sidecar injections can be a common technique for attackers, but they can also occur in legitimate scenarios when changes are made for valid reasons.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Kubernetes audit logs; ensure that auditing is enabled and properly capturing all relevant events. Legitimate application updates or configurations by DevOps personnel can trigger this alert, requiring verification. A related detection would be monitoring for unexpected `kubectl exec` commands within the same deployment to identify potential abuse of the newly injected sidecar.

