title: Container With A hostPath Mount Created
id: 402b955c-8fe0-4a8c-b635-622b4ac5f902
status: test
description: |
  Detects creation of a container with a hostPath mount.
  A hostPath volume mounts a directory or a file from the node to the container.
  Attackers who have permissions to create a new pod in the cluster may create one with a writable hostPath volume and chroot to escape to the underlying node.
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Writable%20hostPath%20mount/
- https://blog.appsecco.com/kubernetes-namespace-breakout-using-insecure-host-path-volume-part-1-b382f2a6e216
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1611
- attack.privilege-escalation
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    hostPath: '*'     # Note: Add the "exists" when it's implemented in SigmaHQ/Aurora
  condition: selection
falsepositives:
- The DaemonSet controller creates pods with hostPath volumes within the 
  kube-system namespace.
level: low
note: |
  ### Technical Context

  This Sigma rule detects the creation of a Kubernetes container with a hostPath mount, which directly links a directory or file from the host node to the container. Attackers may leverage this capability to gain unauthorized access to the underlying file system, potentially leading to privilege escalation or container escape, where they can execute code outside the confines of the container environment. The relevant MITRE ATT&CK tactic is "Privilege Escalation" (TA0004) and the technique is "Container Escape via Host Path" (T1611).

  The primary telemetry source is the Kubernetes audit logs, which document changes to resources within the cluster, specifically logs that capture pod creation events. Malicious use of hostPath mounts can compromise the integrity of the host node and the overall Kubernetes cluster. Notably, this detection does not confirm any malicious intent on its own; legitimate system operations, such as DaemonSet controller activities in the kube-system namespace, can also generate similar events.

  ### Investigation Steps

  - **Review Kubernetes Audit Logs for Creation Events**: Check audit logs for the event of type "create" on pods with the `hostPath` field present (Kubernetes audit log entries). Look for any unusual namespaces or non-standard pod configurations that might indicate malicious intent.

  - **Identify User Permissions**: Investigate the Kubernetes Role-Based Access Control (RBAC) settings for the user who created the pod. Confirm whether they possess permissions to deploy pods with hostPath mounts. Use `kubectl auth can-i create pod --namespace=<namespace>` to validate permissions.

  - **Analyze Namespace Context**: Verify if the pod was created within a standard or restricted namespace. Legitimate workloads often reside in application-specific namespaces, while deviations could indicate an attempted breach.

  - **Check for Malicious Indicators**: Look for indications of a writable `hostPath` mount in the pod specification. If the specification includes hosts with sensitive paths (e.g., `/var/run/`, `/etc/`), this is a high-confidence malicious indicator that warrants further investigation.

  - **Examine Historical Pod Activity**: Review historical pod creations (kubelet or stateful set activities) in the audit logs to establish patterns. Compare recent creations against the expected deployment activities during the timeframe of the alert.

  - **Monitor for Unusual Behavior Post-creation**: After a pod creation alert, investigate subsequent activities for signs of exploitation attempts, such as calls to privileged host paths or attempts to execute commands on the underlying host file system.

  ### Prioritization

  The alert is of low severity but should not be dismissed due to the potential risk of privilege escalation. The likelihood of misuse is moderate, particularly if permissions are inappropriately assigned. This behavior can be weaponized by attackers looking to compromise cluster nodes, making it critical to monitor.

  ### Blind Spots and Assumptions

  Log limitations include the requirement for comprehensive Kubernetes audit logging configurations to capture all necessary events reliably. Detection may miss legitimate activities such as those from DaemonSet controllers that create pods using hostPath, which might lead to false positives. Complementary detections, such as monitoring for privilege escalation attempts following pod creation, can enhance coverage and context for further analysis.

