title: Container With A hostPath Mount Created
id: 402b955c-8fe0-4a8c-b635-622b4ac5f902
status: test
description: |
  Detects creation of a container with a hostPath mount.
  A hostPath volume mounts a directory or a file from the node to the container.
  Attackers who have permissions to create a new pod in the cluster may create one with a writable hostPath volume and chroot to escape to the underlying node.
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Writable%20hostPath%20mount/
- https://blog.appsecco.com/kubernetes-namespace-breakout-using-insecure-host-path-volume-part-1-b382f2a6e216
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1611
- attack.privilege-escalation
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    hostPath: '*'     # Note: Add the "exists" when it's implemented in SigmaHQ/Aurora
  condition: selection
falsepositives:
- The DaemonSet controller creates pods with hostPath volumes within the kube-system
  namespace.
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of a Kubernetes container that uses a hostPath mount, which allows the container to access the underlying node's filesystem directly. This behavior can be exploited by attackers with sufficient permissions to create pods, as it may enable them to escape the container's environment, potentially leading to privilege escalation or unauthorized access to sensitive data on the node. The relevant MITRE ATT&CK technique is “Insecure Host Path Mount” (T1611) under the Privilege Escalation tactic.

  Primary telemetry sources include Kubernetes audit logs that capture events related to resource activities in the cluster, specifically looking for events that include `verb: 'create'` on pods with hostPath mounts. If this activity is malicious, it could lead to significant security incidents, such as data exfiltration or complete system compromise. However, this detection does NOT confirm that the created pod is malicious on its own, as legitimate system processes like DaemonSets may also create pods with hostPath mounts.

  ---

  ### Investigation Steps

  - **Review audit logs for relevant events:** Extract Kubernetes audit logs filtering for `verb: 'create'`, and look for entries where `objectRef.resource: 'pods'` and `hostPath` is present. Key fields to inspect include `user.identity` and `objectRef.namespace` to determine who created the pod and in which namespace.
  - **Identify legitimate pod creation:** Check if the pod creation occurred within the `kube-system` namespace, which often contains DaemonSets using hostPath volumes. Verify if the creator matches expected service accounts (e.g., `kubelet`, `daemonset-controller`).
  - **Assess user permissions and roles:** Analyze the permissions for the user or service account that created the pod. Use `kubectl get clusterroles` and `kubectl get clusterrolebindings` to reveal privileges and ensure they correlate with established security policies.
  - **Check for potential abuse indicators:** Validate if the created pod has a writable hostPath mounted. Analyze field values in the event logs such as `spec.volumes` and confirm mount paths that could introduce risks (e.g., `/etc`, `/var/lib`), indicating possible attempts to manipulate node files.
  - **Correlate with node behavior:** Investigate related node activities and any unusual processes in the host's logs (e.g., system logs or Sysmon Event ID 1) post-pod creation that may indicate chroot or other malicious conduct linked to the created pod.
  - **Determine exposure risk:** Assess the criticality of the affected node or cluster. If a core component of the application is compromised or at risk due to exposed filesystem access, elevate the investigation priority.

  ---

  ### Prioritization

  This alert is considered low severity in an enterprise context due to the potential for legitimate use of hostPath mounts in certain namespaces. However, if exploited by an adversary, it presents a notable risk of privilege escalation. The likelihood of malicious abuse is moderate, as adversaries may leverage this technique in containerized environments.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited if the audit log configuration is not comprehensive, as it relies on capturing all relevant pod creation events. Organized automation tools may create similar pods with hostPath mounts as part of their regular operations, generating false positives. Companion detections such as monitoring changes to cluster role bindings or user permissions will enhance coverage and clarify potential malicious intent.

