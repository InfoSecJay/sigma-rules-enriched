title: Container With A hostPath Mount Created
id: 402b955c-8fe0-4a8c-b635-622b4ac5f902
status: test
description: |
  Detects creation of a container with a hostPath mount.
  A hostPath volume mounts a directory or a file from the node to the container.
  Attackers who have permissions to create a new pod in the cluster may create one with a writable hostPath volume and chroot to escape to the underlying node.
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Writable%20hostPath%20mount/
- https://blog.appsecco.com/kubernetes-namespace-breakout-using-insecure-host-path-volume-part-1-b382f2a6e216
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1611
- attack.privilege-escalation
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    hostPath: '*'     # Note: Add the "exists" when it's implemented in SigmaHQ/Aurora
  condition: selection
falsepositives:
- The DaemonSet controller creates pods with hostPath volumes within the kube-system
  namespace.
level: low
note: |
  ### Technical Context
  This rule detects the creation of Kubernetes containers with a `hostPath` mount, which allows a directory or file from the host node to be mounted into the container. This behavior can be exploited by threat actors who gain permissions to create new pods within the cluster. By mounting a writable `hostPath` volume, attackers may attempt to break out of the container's isolation and access or modify files on the host node, potentially leading to privilege escalation and further system compromise.

  The relevant MITRE ATT&CK tactics and techniques include **Privilege Escalation (T1068)**, which explains how adversaries might exploit misconfigurations to gain higher-level access, and **Container Escape (T1611)**, where attackers escape from a container to the host environment. The detection primarily relies on Kubernetes audit logs, which capture information about API calls related to container management, including pod creation events.

  ### Investigation Steps
  - **Review Kubernetes Audit Logs**: Analyze the Kubernetes audit logs for any `create` events related to pods that include `hostPath` mounts. Look for unusual activity, especially from non-administrative users or accounts.
  - **Identify Anomalous User Activity**: Cross-reference the user accounts that initiated `hostPath` pod creation with legitimate use cases. Scrutinize any accounts with unexpected privileges or usage patterns.
  - **Check for Known DaemonSets**: Determine if the detected pod creation correlates with legitimate DaemonSets that may require `hostPath` volumes. Pods in the `kube-system` namespace for DaemonSets are typically valid; flag any that aren't.
  - **Analyze Filesystem Changes**: Investigate filesystem changes on the host node where the `hostPath` is mounted to identify any suspicious modifications or unauthorized access attempts.

  ### Prioritization
  This alert is classified as low severity because while the creation of a `hostPath` volume is a potential indicator of misuse, its occurrence alone does not confirm malicious intent. However, it warrants investigation as it can indicate an escalating threat in a Kubernetes environment where user privileges are misconfigured.

  ### Blind Spots and Assumptions
  There may be detection coverage gaps for scenarios where an attacker does not create a new pod but instead modifies an existing one to add a `hostPath` volume. The detection logic assumes that all user actions attempting to create pods will be logged and that the appropriate Kubernetes audit logging is enabled. Additionally, environments utilizing certain legitimate Kubernetes practices or specific service accounts may lead to false positives, such as DaemonSets creating pods with `hostPath` volumes within the `kube-system` namespace.

