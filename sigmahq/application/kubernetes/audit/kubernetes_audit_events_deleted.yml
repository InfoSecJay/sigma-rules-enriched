note: |
  ### Technical Context
  This detection rule identifies the deletion of events within a Kubernetes environment. Event deletion may indicate malicious activity, as adversaries can manipulate or erase these logs to hide their presence and actions within the cluster. By deleting Kubernetes events, an attacker aims to evade detection by security monitoring tools, making it more challenging for incident responders to understand what transpired during an attack.

  The relevant MITRE ATT&CK technique associated with this behavior is **T1070: Indicator Removal on Host**, which encompasses actions taken by attackers to obscure their footprints, making detection and investigation efforts difficult. The primary data source necessary for monitoring this activity is the Kubernetes audit logs, which provide insights into changes and actions taken within the cluster.

  ### Investigation Steps
  - **Review Kubernetes Audit Logs:** Examine Kubernetes audit logs for entries related to event deletions, focusing on the user or service account performing the delete operation and the specific timestamps of the actions.
  - **Correlate with Other Activities:** Investigate other activities that occurred around the same time, such as pod creations, modifications, or network policy changes, to identify potential malicious intent or lateral movement within the cluster.
  - **Assess User Permissions:** Check the permissions of the user or service account involved in the deletion to determine if they had appropriate access or if their permissions may indicate a misconfiguration or compromise.
  - **Identify Deletion Patterns:** Look for patterns in event deletions across different namespaces and resources, which could indicate systematic attempts to eliminate evidence of specific attacks.

  ### Prioritization
  The severity of this alert is categorized as medium due to the potential impact of event deletion on the security posture of the Kubernetes environment. The ability to manipulate logs poses a high risk as it complicates incident response and forensics efforts.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the potential for legitimate activity from users or automated processes that may also delete events without malicious intent. Additionally, the detection logic assumes that audit logging is correctly configured to capture all relevant actions, including deletions. If audit logs are misconfigured or not retained for an adequate duration, this alert may miss instances of event deletion entirely, leading to an incomplete view of activity in the environment.

