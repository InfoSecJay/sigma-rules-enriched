note: |
  ### Technical Context

  This rule detects the deletion of Kubernetes events, which could indicate an adversary attempting to cover their tracks or evade detection mechanisms. The likely objective behind this activity is to manipulate logging and monitoring data, thereby hindering the visibility of malicious actions taken within the Kubernetes environment. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the specific technique of Indicator Removal on Host (T1070).

  The primary telemetry source for this detection is Kubernetes audit logs, specifically focusing on entries where the verb is 'delete' and the resource is 'events'. If malicious, this behavior could significantly impact security monitoring capabilities, effectively hiding indicators of compromise. It is important to note that the detection of event deletions alone does not confirm malicious activity; legitimate system administrators may also delete events for maintenance purposes.

  ### Investigation Steps

  - **Examine audit logs for deletion events:** Query Kubernetes audit logs for entries with `verb: "delete"` and `objectRef.resource: "events"`. Check timestamps, user identities, and source IP addresses to determine if the deletions correlate with normal administrative activities.

  - **Identify user roles and permissions:** Investigate the users or service accounts associated with the deletion events. Confirm if the roles of these users typically encompass event deletion. Legitimate actions usually involve administrative roles like cluster-admin or similar.

  - **Check for event patterns:** Analyze the frequency and context of deleted events. Look for unusual spikes in deletion activities; for instance, multiple deletions within a short time frame may suggest malicious intent rather than routine housekeeping.

  - **Correlate with system activity:** Cross-reference deletion events with other system activities, such as deployments or configuration changes. Look for high-confidence malicious indicators like unauthorized changes or actions taken by users with inadequate permissions.

  - **Review role-based access control (RBAC) configurations:** Validate RBAC settings to ensure that users who carried out deletions are granted necessary privileges. Inappropriate access levels can be a key indicator of compromise.

  - **Investigate related detections and alerts:** Analyze if other related detections, such as suspicious pod activity or excessive API calls (see ID: 225d8b09-e714-479c-a0e4-55e6f29adf35), coincide with event deletions, strengthening the overall assessment of potential malicious behavior.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on security monitoring within the Kubernetes environment. While event deletions may be indicative of malicious actions, these occurrences can also arise from legitimate administrative activities. As event manipulation is a known tactic, this type of behavior should be prioritized for further investigation.

  ### Blind Spots and Assumptions

  This detection may miss event deletions performed by users with sufficient privileges who are manipulating logs for legitimate reasons. Additionally, without proper auditing enabled, critical logs may be absent, limiting visibility. Legitimate maintenance activities, such as administrative housekeeping, may inadvertently trigger this alert. A related detection involving unauthorized access or unusual user behavior can provide complementary insights into security posture.

