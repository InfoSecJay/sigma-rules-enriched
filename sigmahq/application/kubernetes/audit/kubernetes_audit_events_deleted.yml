  ### Technical Context

  This rule detects the deletion of Kubernetes events, which could indicate an attempt by a malicious actor to cover their tracks or evade detection mechanisms. The likely attacker objective is to manipulate the Kubernetes environment for nefarious purposes, such as hiding the traces of unauthorized access or configuration changes. This detection relates to the MITRE ATT&CK technique T1070 - Indicator Removal on Host.

  The primary telemetry sources for this rule are Kubernetes audit logs, specifically looking for actions where the verb is 'delete' and the resource targeted is 'events'. If malicious, this behavior can significantly undermine the integrity of Kubernetes logging and monitoring, making it harder to trace potential security incidents. Importantly, this detection does NOT confirm malicious intent on its own; legitimate processes or users can also delete events.

  ---

  ### Investigation Steps

  - **Check Kubernetes audit logs for delete actions:** Review audit logs for Event IDs related to delete actions. Look for entries with `verb: 'delete'` and `objectRef.resource: 'events'`. Note the timestamp and user performing the action.

  - **Validate legitimate use cases for event deletion:** Identify if system accounts or automated services with expected permissions have performed this action during scheduled maintenance or cleanup tasks, checking the context around normal operational hours.

  - **Correlate with changes to Kubernetes resources:** Examine related Kubernetes logs (e.g., `kubectl get events` outputs or namespace resource changes) during the same time frame to identify any coordinated best practices or operational patterns.

  - **Identify source IP and user identity:** Analyze fields like `user.username` and `sourceIPs` in the audit logs to verify the identity and origin of the delete request. Look for anomalous or unexpected identities, especially from administrative accounts.

  - **Assess environment configuration and access controls:** Review Role-Based Access Control (RBAC) settings to determine if the user triggering the delete has the appropriate roles assigned, highlighting any misconfigurations or excessive permissions.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact on security monitoring and incident response capabilities within the Kubernetes environment. While not as commonly weaponized as other tactics, the deliberate deletion of events can indicate a higher risk of a broader compromise or misconfiguration that needs immediate attention.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate event deletions during regular maintenance periods without malicious intent, which can result in false positives. Reliable detection requires properly configured Kubernetes audit logging to ensure comprehensive visibility. Additionally, a companion detection to enhance coverage is monitoring for unauthorized changes to Kubernetes RBAC configurations, which may indicate privilege escalation attempts.

