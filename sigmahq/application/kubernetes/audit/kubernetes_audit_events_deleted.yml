note: |
  ### Technical Context

  This Sigma rule detects the deletion of events within a Kubernetes cluster, which may indicate an adversary's attempt to cover their tracks or evade detection. Deleting events can obscure malicious actions taken within the cluster, hindering forensic analysis. The likely attacker objective is to prevent visibility into their activities, such as unauthorized access or configuration changes.

  This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (ID: T1070). The primary telemetry source is the Kubernetes Audit logs, specifically looking for entries where the verb is 'delete' and the object reference indicates 'events.' If malicious, the impact could range from failed incident response to prolonged unauthorized access. However, this detection does NOT confirm malicious intent on its own, as legitimate workflows may also involve deleting events.

  ### Investigation Steps

  - **Review Kubernetes Audit logs:** Check for `verb: 'delete'` and `objectRef.resource: 'events'` in the Kubernetes audit logs (log type: `kube-audit`). Correlate timestamps against recent deployment or configuration changes.

  - **Identify the user or service account:** Cross-reference the user or service account that deleted the events. If it's a system account performing expected operations, mark as benign; if it's an unexpected user, escalate for further investigation.

  - **Map to related API calls:** Investigate whether there were any preceding API calls involving `create` or `update` actions on significant resources (such as pods or services) that might justify event deletions.

  - **Look for patterns of deletions:** Check if multiple deletions coincide with changes or failures elsewhere in the environment. Frequent deletions within a short timeframe can indicate suspicious activity.

  - **Compare against expected cluster activity:** Verify any scheduled jobs, deployments, or maintenance activities during the deletion timeframe. Legitimate operations may include routine clean-up of unused or completed events associated with these tasks.

  - **Confirm correlation with threat actors:** Match the observed behavior against threat intelligence regarding known Kubernetes attack patterns. Establish contextual understanding around the specific environment to assess risk levels accurately.

  ### Prioritization

  This alert holds medium severity due to its potential implications in an enterprise Kubernetes environment, especially if the affected system houses sensitive workloads. While event deletions can be part of routine maintenance, the likelihood of malicious abuse for cover-up is concerning, particularly given that Kubernetes is a frequent target for sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection may miss instances where legitimate service accounts or automated processes are configured to delete events without oversight. Robust audit logging configurations are required to capture these actions reliably. Common legitimate activities, such as rolling updates or clean-up tasks, may unintentionally trigger this alert. A companion detection, such as monitoring failed login attempts or unauthorized changes (e.g., configuration management), can help strengthen coverage and provide better context around the user activity.

