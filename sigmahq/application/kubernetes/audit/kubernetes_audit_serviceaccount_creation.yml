note: |
  ### Technical Context
  This detection rule is designed to identify the creation of new Kubernetes service accounts within a cluster. The ability to create service accounts can be a critical functionality in Kubernetes, but it can also pose a security risk. Attackers may exploit this capability to establish persistence or gain unauthorized access to resources, effectively allowing them to operate undetected within the cluster. By creating a service account with privileges that can interact with sensitive components, an attacker can potentially expand their control over the Kubernetes environment.

  The relevant MITRE ATT&CK techniques associated with this detection include **Persistence (T1136)**, where the creation of service accounts might signify an attempt to persist an attacker's presence in the Kubernetes ecosystem. Additionally, it falls under tactics that allow attackers to maintain access once a breach has been established, potentially leading to broader attacks on the cluster's applications and services.

  Primary data sources for this detection include Kubernetes audit logs, which provide detailed records of actions performed within the cluster and will specifically log the creation events related to service accounts.

  ### Investigation Steps
  - **Review Audit Logs**: Examine Kubernetes audit logs for entries related to the creation of service accounts. Pay attention to the `verb` fields indicating 'create' and filter for events involving the `objectRef.resource` set to 'serviceaccounts'.

  - **Assess Privileges**: Evaluate the roles and permissions associated with the newly created service account. Determine if it has excessive privileges that could be exploited by an attacker to access sensitive resources within the cluster.

  - **Investigate User Context**: Identify the user or service account that created the new service account. Cross-reference this information with a list of authorized users to spot any anomalies or users that shouldn’t have permission to create service accounts.

  - **Monitor for Subsequent Activity**: After identifying and assessing the newly created service account, monitor for any subsequent API calls or actions performed by the account. This may indicate further attempts to exploit the cluster environment.

  ### Prioritization
  The alert's severity is classified as low primarily because the simple act of creating a service account can be legitimate, especially in a dynamic environment. However, it should not be ignored, as it may serve as an entry point for attackers looking to execute further malicious actions within the Kubernetes cluster.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the monitoring of contextual information surrounding the service account's creation, such as the processes or applications interacting with the service account afterward. The detection logic assumes that the creation of service accounts is predominantly indicative of malicious activity, which may not be accurate in every instance, thus requiring further investigation into each alert. Additionally, to ensure robust detection, Kubernetes audit logging must be properly configured and enabled to capture relevant events without fails.

