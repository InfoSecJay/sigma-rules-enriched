note: |
  ### Technical Context

  This rule detects the creation of new Kubernetes service accounts, a behavior that can indicate an attacker attempting to gain persistence within a Kubernetes cluster. The likely objective is to facilitate unauthorized access to cluster resources by creating accounts that can be used for future malicious activity. The relevant MITRE ATT&CK tactic is Persistence, specifically technique T1136 (Create Account).

  Primary telemetry sources are Kubernetes audit logs, particularly focusing on events where the verb is "create" and the objectRef.resource is "serviceaccounts." If this activity is malicious, it could allow an adversary to maintain a foothold in the environment, enabling further exploitation or lateral movement within the cluster. However, this detection does NOT confirm malicious intent on its own, as legitimate operations may also involve the creation of service accounts for valid applications or services.

  ### Investigation Steps

  - **Retrieve Kubernetes audit logs:** Collect Kubernetes audit logs focusing on events with verb "create" and objectRef.resource "serviceaccounts." Check the timestamp of the event and the user associated with the creation.

  - **Verify the user identity:** Confirm if the user or service account that created the new service account is known and expected. Look for legitimate users or automation tools that may have permission to create service accounts.

  - **Examine permission levels:** Review the RBAC (Role-Based Access Control) settings for the newly created service account to assess the permissions assigned. High privilege access may indicate suspicious activity if it originates from an untrusted user.

  - **Identify legitimate use cases:** Investigate if there was a recent deployment or configuration change that may justify the creation of a new service account, such as an application rollout or upgrade that necessitated new permissions.

  - **Check for anomalous activities:** Look for additional suspicious logs around the time of the service account creation, such as unusual API calls or actions related to deployments, pod modifications, or access to sensitive namespaces.

  - **Assess the cluster's overall health:** Review system event logs or monitoring alerts for any indicators of compromise or unusual behavior in the cluster around the time the service account was created to spot broader security signals.

  ### Prioritization

  This alert holds a low severity in an enterprise context. While the creation of a service account can be benign, it poses a risk if associated with malicious activity. The likelihood of abuse can be high if an adversary has already gained access, and service accounts are often used in lateral movement scenarios.

  ### Blind Spots and Assumptions

  The detection may be limited if Kubernetes audit logging settings are not properly configured to record all necessary events. Legitimate activities, such as automated CI/CD processes, may trigger this alert by creating service accounts as part of deployments. A related detection that strengthens coverage is monitoring for any escalated permissions assigned to service accounts, which can be indicative of abuse or misconfiguration.

