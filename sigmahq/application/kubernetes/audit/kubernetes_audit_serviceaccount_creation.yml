  ### Technical Context

  This rule detects the creation of new Kubernetes service accounts, indicative of potential adversarial attempts to gain persistence or escalate privileges within a Kubernetes cluster. The likely objective of the attacker may involve leveraging the newly created service account to exploit resources or access sensitive data. This behavior corresponds to the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Create Account (T1136).

  The primary telemetry source for this detection is Kubernetes audit logs, specifically capturing "create" actions on the resource type "serviceaccounts." If malicious, the presence of unauthorized service accounts can lead to unauthorized access and lateral movement within the cluster. Importantly, this detection does NOT confirm that malicious activity is occurring, as the creation of service accounts can be part of normal operational procedures by legitimate users.

  ---

  ### Investigation Steps

  - **Review Kubernetes Audit Logs:**
    Examine the audit logs for Event Type "create" with Resource Type "serviceaccounts." Focus on fields such as `user.username` and `user.groups` to establish if legitimate users or service accounts created the account.

  - **Identify Authorized Service Account Creators:**
    Check the cluster's role-based access control (RBAC) policies to confirm that the user or service that created the account has legitimate permissions. Cross-reference with expected roles for service account creation.

  - **Investigate Timeframe and Context:**
    Correlate the creation timestamp of the service account with other significant events in the cluster, such as deployments or configuration changes. Legitimate activity may include routine updates or CI/CD activity.

  - **Check for Anomalous Naming Conventions:**
    Analyze the naming pattern of the created service account. Unusual names or those following a naming convention associated with known vulnerabilities should raise suspicion and indicate potential malicious intent.

  - **Validate Associated Pod Permissions:**
    Determine if the new service account is tied to any running pods by querying the pod specifications. Review permissions granted to the service account; overly broad permissions may suggest malicious intent.

  - **Examine for Subsequent API Calls:**
    Monitor for API calls made with the new service account in subsequent logs. A high-confidence malicious indicator would include unexpected access attempts to sensitive resources or unusual behavior patterns shortly after the account creation.

  ---

  ### Prioritization

  This alert is of low severity within the enterprise context due to the lower likelihood of immediate misuse, especially in environments with regular service account management practices. However, the risk of compromise increases if combined with anomalous patterns of account usage following the creation event.

  ---

  ### Blind Spots and Assumptions

  There may be a limitation on detecting potential script-based or automated account creations that legitimate developers might use. Accuracy of detection relies on comprehensive auditing configurations across all Kubernetes components. Legitimate operations such as cluster provisioning may trigger this alert. Companion detections, such as monitoring Kubernetes Role or ClusterRole changes, can strengthen oversight and provide additional context to the service account creation events.

