note: |
  ### Technical Context

  This Sigma rule detects the creation of privileged containers within a Kubernetes environment, which can indicate attempts by an attacker to escalate privileges and execute potentially harmful actions on the host. The likely objective of creating a privileged container is to gain unrestricted access to the host’s operating system, facilitating actions such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and technique T1611, which involves attacker exploitation through elevated permissions in a containerized environment.

  The primary telemetry sources are Kubernetes audit logs, specifically focusing on events recorded during pod creation. The security impact of a malicious privileged container is significant, as it can enable unauthorized access to sensitive information and system controls. However, this detection does NOT confirm that a malicious action has occurred. It merely indicates that a new privileged container has been deployed, which may also be part of legitimate administrative actions.

  ### Investigation Steps

  - **Review Kubernetes Audit Logs:** Check audit logs for Event IDs indicating pod creation (verb: 'create') in the `kube-apiserver` logs. Examine fields for `objectRef.resource` set to 'pods' and any entries marking `securityContext.privileged` as true.

  - **Assess Context of Container Creation:** Identify if the creation of the privileged container coincided with unusual times, such as outside of regular maintenance windows or during infrequent deployment schedules, which may indicate suspicious activity.

  - **Identify Anomalous Capabilities:** Look for additional Linux capabilities granted to the container beyond default settings, such as `SYS_ADMIN` or `ALL`, and investigate corresponding fields (`capabilities`) in the audit logs that may signal an intent to execute complex attack scenarios.

  - **Correlate with Legitimate Activity:** Cross-reference with normal operational patterns, such as scheduled maintenance or deployment tasks. Legitimate container deployment typically involves minimal or no privileges and should not require `hostNetwork` or `hostPID` configurations.

  - **Determine Affected Host Criticality:** Investigate if the host associated with the privileged container is critical to business operations, as a compromise could lead to broader system impacts. Evaluate the asset’s role in the environment (e.g., production vs. development).

  - **Check for Unrecognized Deployment Patterns:** Validate whether the creation of the privileged pod aligns with known deployment workflows or known users. Look for deviations, such as unfamiliar user accounts or automated scripts initiating the pod creation.

  ### Prioritization

  The severity of this alert is moderate in an enterprise context, given that a compromised host could lead to significant data breaches and infrastructure manipulation. While creating privileged containers can be part of standard operations, the likelihood of malicious usage is high, especially if combined with other suspicious behavior, making it a relevant vector for attackers.

  ### Blind Spots and Assumptions

  This detection may be circumvented by adversaries who place significant scrutiny on container configurations to avoid trigger alerts through privileged container creations. Proper logging configurations should include the complete capture of Kubernetes audit events for reliable detection. Benign activities that could trigger the alert involve DevOps personnel deploying necessary privileges for compliant applications. A companion detection might involve tracking for unusual access patterns or privilege escalation actions within Kubernetes clusters (e.g., via RBAC changes or elevated privileges).

