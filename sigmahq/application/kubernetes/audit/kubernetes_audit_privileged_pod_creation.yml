title: Privileged Container Deployed
id: c5cd1b20-36bb-488d-8c05-486be3d0cb97
status: test
description: |
  Detects the creation of a "privileged" container, an action which could be indicative of a threat actor mounting a container breakout attacks.
  A privileged container is a container that can access the host with all of the root capabilities of the host machine. This allows it to view, interact and modify processes, network operations, IPC calls, the file system, mount points, SELinux configurations etc. as the root user on the host.
  Various versions of "privileged" containers can be specified, e.g. by setting the securityContext.privileged flag in the resource specification, setting non-standard Linux capabilities, or configuring the hostNetwork/hostPID fields
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Privileged%20container/
- https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-kubernetes.html#privilegeescalation-kubernetes-privilegedcontainer
- https://www.elastic.co/guide/en/security/current/kubernetes-pod-created-with-hostnetwork.html
- https://www.elastic.co/guide/en/security/current/kubernetes-container-created-with-excessive-linux-capabilities.html
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.t1611
- attack.privilege-escalation
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    capabilities: '*'     # Note: Add the "exists" when it's implemented in SigmaHQ/Aurora
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the creation of privileged containers within a Kubernetes environment. A privileged container has unrestricted access to the host system, possessing all the capabilities of the root user. This capability can be exploited by threat actors to execute container breakout attacks, allowing them to compromise the host system and access sensitive resources, manipulate processes, or execute arbitrary commands. The ability to create privileged containers can often be a precursor to unauthorized access or data exfiltration, making it a significant security concern.

  In terms of MITRE ATT&CK, this detection aligns with the tactic of **Privilege Escalation (TA0004)**, particularly the technique **Container Escaping (T1611)**. Attackers may utilize privileged containers as a means to escalate their privileges within the infrastructure without sufficient monitoring or oversight. The primary data source for this rule is the Kubernetes audit logs, specifically focusing on events indicating the creation of pods with privileged configurations.

  ### Investigation Steps
  - **Review Kubernetes Audit Logs**: Analyze the Kubernetes audit logs for any events corresponding to the creation of pods with the `privileged` security context. Pay special attention to the verb `create` and the resource type `pods`.

  - **Examine Pod Specifications**: Look into the configurations of the created pods to identify any use of the `securityContext.privileged` option, modifications of Linux capabilities, or settings of `hostNetwork` or `hostPID` fields that deviate from the organization’s best practices.

  - **Check for Unauthorized Access**: Investigate whether any suspicious or unrecognized users or service accounts initiated the creation of the privileged containers. Verify the legitimacy of their access and actions within the cluster.

  - **Assess Historical Changes**: If possible, review the historical configuration and deployment actions within the Kubernetes environment for any prior instances of privileged container deployments, especially from unexpected sources or during unusual hours.

  ### Prioritization
  This alert holds a **low** severity level; however, it should not be ignored as the presence of privileged containers can indicate potential threats to the integrity of the entire Kubernetes environment. Given that such configurations can lead to significant privilege escalation, organizations should monitor for these activities as part of a broader defense strategy.

  ### Blind Spots and Assumptions
  A critical blind spot for this detection is the reliance on exhaustive logging of Kubernetes audit events; if audit logging is misconfigured or disabled, the detection will fail. Additionally, there is an assumption that all deployments adhere to the organization’s established security policies and standards regarding container provisioning. The rule presupposes that access controls are in place to limit who can create privileged containers, a capability that may not be uniformly enforced across the environment. To successfully implement this detection, ensure that Kubernetes audit logs are enabled and properly configured to record all relevant events.

