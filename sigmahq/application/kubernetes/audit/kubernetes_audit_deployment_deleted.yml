note: |
  ### Technical Context
  This detection rule monitors for the deletion of deployments within a Kubernetes cluster. In a typical threat scenario, attackers may aim to disrupt business operations by removing crucial services, effectively causing downtime or impairing system functionality. The potential motives for such activity could include sabotage, disruption of services, or as part of a broader data destruction strategy.

  The relevant MITRE ATT&CK tactics include **Impact** (TA0040) where adversaries aim to hinder availability or integrity of a system. Specifically, technique **Data Destruction** (T1498) is applicable as it involves the deletion of resources, which can severely disrupt operational integrity. Primary data sources for this detection would be Kubernetes audit logs that capture actions performed against the cluster, including the deletion of deployments.

  ### Investigation Steps
  - **Review Kubernetes Audit Logs**: Check the audit logs for entries related to 'delete' operations specifically targeting deployments. Look for any unusual patterns or timestamps that correlate with this activity.
  - **Analyze User and Service Accounts**: Identify who initiated the delete actions by inspecting the user or service account information in the audit logs. Determine if the account has appropriate permissions and review the account activities leading up to the deletion.
  - **Check for Unauthorized Access**: Investigate recent access to the Kubernetes API or CLI that might indicate unauthorized attempts to modify cluster resources. This can include inspecting access logs for unusual IP addresses or failed authentication attempts.
  - **Evaluate Cluster Configuration Changes**: Look for other changes in the Kubernetes cluster configuration that may indicate lateral movement or attempts to create an environment for further malicious activity.

  ### Prioritization
  The alert is assigned a low severity due to the context-specific nature of its impact; however, frequent occurrences should be scrutinized as they may indicate ongoing attempts to disrupt business functionality, affecting availability and operational stability.

  ### Blind Spots and Assumptions
  This detection logic may miss manual deletions that are not recorded in audit logs if Kubernetes auditing is improperly configured or disabled. Additionally, it assumes that the user behavior in deleting deployments is abnormal; however, legitimate administrative tasks may trigger similar logs. Proper configuration of Kubernetes audit logging is essential for this rule to function effectively, ensuring that all relevant operations are captured accurately.

