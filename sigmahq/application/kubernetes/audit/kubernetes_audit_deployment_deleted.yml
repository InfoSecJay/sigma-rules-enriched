note: |
  ### Technical Context

  This rule detects the deletion of a deployment from a Kubernetes cluster, which could indicate an adversarial attempt to disrupt business operations by removing applications or services from production. The likely attacker objective is to cause operational outages, damage reputation, or sabotage environments. This behavior corresponds to the MITRE ATT&CK tactic of Impact and the technique Data Destruction (T1498). Primary telemetry sources include Kubernetes audit logs that capture infrastructure changes, specifically logs where the verb is "delete" and the resource type is "deployments." If the deletion is malicious, it can severely impact the availability of critical applications. However, this detection does NOT confirm that the deletion was unauthorized or performed by an attacker—it could also result from legitimate operational procedures.

  ### Investigation Steps

  - **Verify audit logs for the deletion event:** Check Kubernetes audit logs for entries with `verb: "delete"` and `objectRef.resource: "deployments"`. This will confirm the action taken and provide relevant user information.

  - **Identify the actor performing the deletion:** Look for the `user.username` or `user.groups` fields in the audit logs to determine the responsible account. Unexpected accounts or service accounts with deletion permissions should raise red flags.

  - **Evaluate the timing and context of the deletion:** Inspect timestamps associated with the deletion against known maintenance windows or deployment schedules to identify potential benign activity versus suspicious patterns.

  - **Assess the deployment's status prior to deletion:** Retrieve information on the deleted deployments by cross-referencing them with previous deployment history. A sudden removal of critical deployments without prior planning indicates potential malicious intent.

  - **Cross-check with service dependencies:** Review logs to determine if other related resources (like services or pods) were also modified or deleted around the same time, indicating a coordinated attack or misconfiguration.

  - **Validate rollback policies:** Review how critical services are backed up or managed in the event of a deletion. Make sure proper rollback procedures exist, and that logs show he successful re-deployment of affected applications where applicable.

  ### Prioritization

  This alert is rated low severity as it indicates a potentially disruptive action but recognizes the likelihood of benign administrative activities in Kubernetes environments. Given that deletion of deployments can be a common operation, the risk of malicious abuse is moderate, but understanding the context is essential to assess the true risk level.

  ### Blind Spots and Assumptions

  The detection may miss cases where log configuration is inadequate, or audit log settings are not properly capturing deletion events. Legitimate maintenance activities or automated pipeline processes might trigger this alert without malicious intent. Companion detections like monitoring for unexpected creation or scaling events in conjunction with deletions could provide a more comprehensive view of the environment and strengthen security posture.

