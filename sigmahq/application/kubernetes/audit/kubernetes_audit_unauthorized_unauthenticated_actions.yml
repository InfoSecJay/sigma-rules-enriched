note: |
  ---

  ### Technical Context

  This rule detects unauthorized or unauthenticated access attempts to the Kubernetes API, specifically when requests are rejected with HTTP status codes 401 (Unauthorized) or 403 (Forbidden). The likely objective of an attacker triggering this behavior is to exploit valid credentials or tokens with an intention to escalate privileges or gain unauthorized access to resources within the Kubernetes cluster. This activity is relevant to the MITRE ATT&CK framework under the tactic "Privilege Escalation" (T1068).

  The primary telemetry source for this alert is Kubernetes audit logs, which capture detailed information about interactions with the Kubernetes API, including reasons for failures. If the detected behavior is malicious, it could compromise the security posture of the entire Kubernetes environment. Importantly, while this detection indicates potential malicious intent, it does NOT confirm successful exploitation or access to sensitive resources on its own.

  ---

  ### Investigation Steps

  - **Check audit logs for the specific event:** Review Kubernetes audit logs for Event Type `error` related to the specific request, focusing on `responseStatus.code: 401` or `403`. Identify the user or service account attempting the access.

  - **Analyze the source of the requests:** Investigate the IP addresses and user agents associated with the denied requests in the audit logs. Compare against known internal sources; unexpected or external IPs could indicate malicious activity.

  - **Examine recent changes or anomalies in RBAC policies:** Validate if any recent changes were made to Role-Based Access Control (RBAC) permissions that might have caused valid users to receive unauthorized responses. Document legitimate access patterns to assess deviations.

  - **Identify high-confidence malicious indicators:** Look for repeated failed attempts from a single source within a short timeframe that aligns with automated scanning patterns. Such behavior could reveal brute force or credential stuffing attempts.

  - **Validate expected user behavior:** Cross-reference the timing of the unauthorized attempts with known operational schedules of your administrators or applications. Legitimate users may trigger this alert during token expirations or misconfigurations.

  - **Search for expired tokens:** In the audit logs, identify if there are entries that suggest expired tokens being used. This can help distinguish between simple user errors and potentially malicious credential misuses.

  ---

  ### Prioritization

  The alert is of low severity due to the potential for benign misconfigurations, such as RBAC policy errors or expired tokens. However, active exploitation of stale credentials remains a possibility, necessitating verification. This behavior is not commonly weaponized, making contextual investigation more crucial to assess risk accurately.

  ---

  ### Blind Spots and Assumptions

  Detection may overlook well-crafted evasion techniques, such as an attacker using valid credentials that have not yet expired. Insufficient log retention settings or omissions in audit logging configuration can hinder detection effectiveness. Misconfigured access policies may result in legitimate users often triggering the alert, highlighting the need to consider user behavior history. A related detection to consider is monitoring for repeated successful and failed authentication attempts, which could provide a broader context for user access behaviors.

