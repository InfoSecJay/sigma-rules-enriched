level: low
note: |
  ### Technical Context
  This detection rule targets unauthorized or unauthenticated access attempts to the Kubernetes API, signified by HTTP response statuses indicating a lack of authorization (401) or active denial of resource access (403). Such access attempts could suggest that an attacker is trying to exploit potentially compromised credentials or tokens to gain access to restricted resources within the Kubernetes environment. An active monitoring approach of these incidents helps improve security hygiene by providing insights into possible reconnaissance or brute force attacks against the Kubernetes cluster.

  Relevant MITRE ATT&CK techniques associated with this activity include **T1078 - Valid Accounts**, as it centers around the exploitation of legitimate credentials. Moreover, unauthorized API calls may lead to potential privilege escalation attempts (T1068), depending on the attackers' ultimate objectives, such as retrieving sensitive information or altering the cluster configuration for nefarious purposes.

  The primary data sources for illuminating this activity include Kubernetes API audit logs, which record all interactions with the API server, including the outcome of authorization checks. Additionally, logs from the authentication system used with the Kubernetes cluster (e.g., tokens, certificates) may provide context around invalid credentials or expired tokens being employed in access attempts.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze Kubernetes API audit logs for entries corresponding to 401 and 403 response codes. Focus on the user who attempted access and the specific API endpoints they were targeting to identify potentially malicious intentions.

  - **Check Authentication Token Lifecycles**: Investigate the use of authentication tokens that are expired or misconfigured. Verify how these tokens were obtained and assess if any token refresh mechanisms were flawed, allowing misuse of older credentials.

  - **Evaluate RBAC Permissions**: Inspect the Role-Based Access Control (RBAC) settings for the affected users. Confirm whether the denied operations align with the defined permissions to identify possible misconfigurations or privilege escalation opportunities being exploited.

  - **Monitor Incoming Requests**: Set up additional monitoring for unusual patterns in request frequency to the API server. Implement alerting mechanisms to flag spikes that could indicate automated tools or brute-force attempts targeting credential validation.

  ### Prioritization
  This alert carries a low severity in an enterprise environment as it might reflect benign operational issues such as misconfigurations or legitimate user errors. However, repeated occurrences could indicate potential exploitation attempts, warranting further scrutiny.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments with insufficiently configured audit logging, potentially missing valid access attempts that lead to 401 or 403 responses. The detection logic assumes that a high volume of unauthorized requests indicates malicious activity; however, legitimate users could inadvertently trigger similar alerts due to misconfigurations or expired credentials. Proper configuration of audit logs and RBAC policies is essential to ensure comprehensive monitoring of authentication events and proper context for these alerts.

