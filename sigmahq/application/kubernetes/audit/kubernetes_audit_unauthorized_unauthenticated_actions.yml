title: Kubernetes Unauthorized or Unauthenticated Access
id: 0d933542-1f1f-420d-97d4-21b2c3c492d9
status: test
description: |
  Detects when a request to the Kubernetes API is rejected due to lack of authorization or due to an expired authentication token being used.
  This may indicate an attacker attempting to leverage credentials they have obtained.
references:
- https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/
- https://www.datadoghq.com/blog/monitor-kubernetes-audit-logs/#monitor-api-authentication-issues
author: kelnage
date: 2024-04-12
tags:
- attack.privilege-escalation
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    responseStatus.code:
    - 401         # Unauthorized
    - 403         # Forbidden
  condition: selection
falsepositives:
- A misconfigured RBAC policy, a mistake by a valid user, or a wider issue with 
  authentication tokens can also generate these errors.
level: low
note: |
  ### Technical Context

  This rule detects unauthorized or unauthenticated requests to the Kubernetes API, specifically responses with HTTP status codes 401 (Unauthorized) and 403 (Forbidden). The likely attacker objective is to exploit valid user credentials, possibly utilizing stolen tokens to gain access to sensitive operations within Kubernetes. This behavior aligns with the MITRE ATT&CK tactic of "Privilege Escalation" (TA0004) and the technique "Exploitation for Client Execution" (T1203).

  Primary telemetry sources include Kubernetes Audit Logs, specifically focused on the API server's audit trail. The security impact is significant if malicious access is gained, as attackers could manipulate cluster resources, leading to potential data breaches or service disruption. Note that this detection does NOT confirm successful access or compromise on its own; it only indicates an attempt that was denied.

  ### Investigation Steps

  - **Review Kubernetes Audit Logs:** Check for Event ID entries where `responseStatus.code` = 401 or 403 in the audit logs found under `/var/log/kubernetes/audit.log`. This will provide context on unauthorized access attempts. Look for the source IP and username associated with the request to identify potential attacker patterns.

  - **Identify access patterns:** Cross-reference timestamps of unauthorized access attempts with known legitimate user activities to determine if there are any overlaps. Use `timestamp` and `user` fields in your queries to differentiate.

  - **Examine role-based access control (RBAC) configuration:** Validate whether the user requesting access has appropriate permissions. Check the RBAC settings for discrepancies, specifically around roles assigned to users or service accounts that might lead to expected 403 responses.

  - **Analyze JWT tokens and expiration details:** Capture logs related to authentication tokens by reviewing the `requestObject` field for any expired tokens noted in audit logs, along with their issuance times. Confirm token validity and expiration to rule out configuration issues affecting legitimate users.

  - **Benchmark against legitimate activity:** Compare request structures and timing against normal API access patterns within your environment. For instance, note that legitimate access typically follows a predictable schedule aligned with business hours.

  ### Prioritization

  The alert holds low severity due to the non-intrusive nature of unauthorized requests. While it indicates potential abuse attempts, the likelihood of malicious activity is moderate based on the infrastructure setup. However, this behavior is not uncommon and often occurs due to misconfigured permissions or expired tokens.

  ### Blind Spots and Assumptions

  Detection may miss attempts that are effectively proxied or disguised by a trusted user account. Log sources must include comprehensive Kubernetes Audit Logs with the correct configuration to capture all interaction with the API. Legitimate users may trigger such alerts accidentally due to misconfigurations or token-related issues. A related detection includes monitoring for high volumes of unauthorized requests from a single source, indicating possible brute-force attacks or automated scanning efforts.

