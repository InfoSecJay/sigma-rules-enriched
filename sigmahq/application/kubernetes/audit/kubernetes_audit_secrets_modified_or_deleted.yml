note: |
  ### Technical Context
  This detection rule identifies when Kubernetes Secrets are modified or deleted, which is critical for maintaining the security of sensitive information stored in a Kubernetes environment. Kubernetes Secrets store sensitive data such as passwords, OAuth tokens, and SSH keys, making them attractive targets for attackers. If an adversary gains access to modify or delete these secrets, they could disrupt service, escalate privileges, or exfiltrate sensitive information, aligning with the objectives of data exfiltration or credential access, which are common tactics used by threat actors.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Credential Access (TA0006)**: The act of obtaining and manipulating sensitive data.
  - **Exploitation for Client Execution (T1203)**: Leveraging vulnerabilities in Kubernetes components to access or alter Secrets.

  The primary data source for this detection is Kubernetes audit logs, which record events related to API interactions, including operations on Secrets.

  ### Investigation Steps
  - **Review Audit Logs**: Check Kubernetes audit logs for events involving the `secrets` resource and the verbs `create`, `delete`, `patch`, `replace`, or `update` to identify unauthorized changes.
  - **Analyze User Activity**: Investigate the user or service account associated with the secret modification events for unusual patterns or permissions that exceed normal operational requirements.
  - **Inspect Cluster Roles and Bindings**: Examine the Role-Based Access Control (RBAC) configurations that grant access to Secrets, ensuring that only authorized entities have permission to modify or delete sensitive information.
  - **Correlate with System Changes**: Look for additional events or logs that coincide with the changes, such as deployments, configuration changes, or events from other sources (e.g., CI/CD systems) that might explain the legitimate modification of Secrets.

  ### Prioritization
  This alert holds a medium severity level due to the potential impact of unauthorized access to Secrets, which could lead to compromising the entire Kubernetes environment. The likelihood is heightened given the prevalence of credential theft and manipulation tactics used by modern attackers.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage may arise from legitimate administrative actions or automated processes that modify or delete secrets, potentially leading to false positives. The detection logic assumes all modifications made by users or service accounts should be closely monitored, which may not hold true in every context. Proper configuration of audit logging in Kubernetes is required for this alert to function effectively, and any gaps in audit log retention policies could hinder detection capabilities.

