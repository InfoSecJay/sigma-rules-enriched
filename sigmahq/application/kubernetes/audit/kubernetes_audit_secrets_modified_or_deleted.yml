note: |
  ### Technical Context

  This rule detects actions involving the creation, deletion, or modification of Kubernetes Secrets. Such activities could indicate an attacker attempting to access or manipulate sensitive information, such as API keys or user credentials, to escalate privileges or maintain persistence. The relevant MITRE ATT&CK tactic is **Credential Access (T1003)**, and the technique is **Credentials from Secrets (T1003.003)**.

  Primary telemetry sources include Kubernetes audit logs, specifically logging the object references and verbs associated with Secrets management. If these actions are malicious, they could lead to unauthorized access to critical system components. Notably, this detection does NOT confirm that the action is malicious, as legitimate administrators may also perform these actions for valid reasons.

  ### Investigation Steps

  - **Identify the initiator of the action:** Review Kubernetes audit logs for relevant API requests. Focus on fields such as `user.username` and `source.ip`. Compare against known legitimate admin users and roles to validate or raise suspicion on unauthorized users.

  - **Cross-reference timestamps:** Check the timing of secret modifications or deletions against change management records. Look for discrepancies that indicate unsanctioned access, especially outside of regular maintenance hours.

  - **Inspect for unusual request verbs:** Examine the verbs used in the actions (e.g., `create`, `delete`, `update`) in `objectRef.resource: 'secrets'` from audit logs. Unauthorized `delete` or `update` actions, especially from non-admin users, should be flagged as potential indicators of compromise.

  - **Review affected Secrets for sensitivity:** Identify which Secrets were altered or deleted by matching `objectRef.name` in audit logs against known sensitive secrets. Pay close attention if modifications involve systems storing critical data like API tokens or database credentials.

  - **Normal behavior correlation:** Establish a baseline of legitimate secret management activities by analyzing audit logs over time. Document typical events from system administrators or automated jobs, as benign actions may resemble malicious ones without proper context.

  ### Prioritization

  This alert should be considered medium severity. The impact can be significant if critical secrets are compromised, allowing attackers to exploit vulnerabilities within the environment. While not all modifications or deletions may signify malicious activity, the potential for exploitation makes prompt investigation essential, particularly in environments where secrets are frequently manipulated.

  ### Blind Spots and Assumptions

  Evasion techniques could include token misuse or relying on delegated permissions, making detection of malicious activities challenging. It is vital to ensure comprehensive auditing is enabled on Kubernetes to capture all relevant actions adequately. Legitimate automation scripts may also trigger this alert during routine operations, which could lead to false positives. Companion detection rules on pod creation and network access related to secrets use should be employed to enhance overall monitoring capabilities.

