  ---

  ### Technical Context

  This detection rule identifies modifications or deletions of Kubernetes Secrets, which are sensitive objects used to store confidential data such as API keys and passwords. The likely attacker objective is to manipulate, extract, or delete credentials that allow unauthorized access to services running within a Kubernetes cluster. The relevant MITRE ATT&CK tactic here is Credential Access (TA0006) and the technique is Access Token Manipulation (T1203).

  Primary telemetry sources include Kubernetes audit logs, specifically the resource type `secrets` and actions such as `create`, `delete`, `patch`, `replace`, and `update`. If malicious, this behavior indicates potential credential theft or an attempt to escalate privileges within the cluster. It is crucial to note that this detection does not confirm malicious intent on its own as legitimate system administrators and automation processes may perform these actions.

  ---

  ### Investigation Steps

  - **Review Kubernetes Audit Logs**: Check the audit logs for Kubernetes Secrets modification or deletion events (Event Type: `DELETE`, `UPDATE`, etc.). Look for indication of who performed the action (`user.username`), along with the timestamp and source IP.

  - **Identify the Actor's Privileges**: Verify the user or service account who executed the actions. Use `kubectl get clusterrolebindings` to check the role associated with that account. Privileged accounts manipulating secrets could indicate potential compromise.

  - **Correlate with User Activity**: Examine the surrounding events in the audit logs for common patterns of legitimate access (e.g., deployments with expected secret updates). Look for normal operational patterns, such as scheduled jobs or CI/CD pipeline updates.

  - **Check for Evasive Behavior**: Investigate if the secrets were modified around the time of any known incidents or unauthorized access attempts. Look for multiple secret modifications that could suggest an adversary's attempt to obscure their actions.

  - **Assess the Environment**: Determine if the affected secrets are critical for functioning applications and review asset criticality. Use `kubectl get secrets` to view the impacted secrets and their usage across namespaces to understand potential risk to services.

  - **Look for Pattern in Modifications**: Establish a baseline for expected changes to secrets. Identify if modifications deviate from normal operational behavior by cross-referencing periodic changes noted on the organization’s change management systems.

  ---

  ### Prioritization

  This alert should be regarded with medium severity due to the potential impact of unauthorized access to sensitive environment credentials. The likelihood of malicious abuse is moderate, particularly if system accounts or unknown actors are involved. While modifications to Kubernetes Secrets can be part of legitimate administrative tasks, abnormal or unapproved changes could indicate exploitation attempts.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques may include using system accounts with permissions to modify secrets or automated processes designed to alter these objects. Reliable detection requires the Kubernetes audit logging to be properly configured and enabled; otherwise, the monitoring will be incomplete. Additionally, legitimate CI/CD systems might frequently modify secrets for deployments, which can trigger these alerts. A companion detection to consider is monitoring for unexpected pod creations that reference secrets, indicating where the modified secrets might be in use.

