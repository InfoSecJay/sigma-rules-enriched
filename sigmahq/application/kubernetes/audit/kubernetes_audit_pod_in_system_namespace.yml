title: Creation Of Pod In System Namespace
id: a80d927d-ac6e-443f-a867-e8d6e3897318
status: test
description: |
  Detects deployments of pods within the kube-system namespace, which could be intended to imitate system pods.
  System pods, created by controllers such as Deployments or DaemonSets have random suffixes in their names.
  Attackers can use this fact and name their backdoor pods as if they were created by these controllers to avoid detection.
  Deployment of such a backdoor container e.g. named kube-proxy-bv61v, could be attempted in the kube-system namespace alongside the other administrative containers.
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Pod%20or%20container%20name%20similarily/
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    objectRef.namespace: kube-system
  condition: selection
falsepositives:
- System components such as daemon-set-controller and kube-scheduler also create pods
  in the kube-system namespace
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of pods within the `kube-system` namespace of a Kubernetes cluster. Typically, this namespace is reserved for system pods that manage essential cluster operations, such as networking and scheduling. The rule aims to highlight potentially malicious activity where an attacker deploys unauthorized pods masquerading as legitimate system pods. By naming their backdoor pods in a similar fashion (e.g., `kube-proxy-bv61v`), an attacker can exploit the trust and functionality of the `kube-system` namespace to remain undetected.

  The primary attacker objective in this scenario is to gain ongoing access and control over the Kubernetes environment, potentially leading to further lateral movement or data exfiltration. This aligns with the MITRE ATT&CK technique for "Pod or container name similarity" (T1036.005), where the goal is to create confusion between legitimate and illegitimate pods within the cluster.

  In Kubernetes environments, the best evidence for this behavior can be found in audit logs that monitor API requests. The specific data source enabled for monitoring in this case would be Kubernetes audit logs, providing insight into pod creation events, the calling users, and the attributes of the created pods.

  ### Investigation Steps
  - **Review Audit Logs**: Check Kubernetes audit logs for `create` actions targeting resources in the `kube-system` namespace. Look for unusual pod names that closely resemble legitimate system pod naming conventions.

  - **Analyze Pod Events**: Investigate the events related to recently created pods in the `kube-system` namespace to gather information on the creation time, initiating user, and the specific pod configuration.

  - **Correlate with User Activity**: Assess the activity of users who initiated pod creations. Identify whether they possess administrative access or have been involved in other suspicious activities that may signal compromise.

  - **Identify Historical Changes**: Cross-reference current pod deployments in the `kube-system` namespace with historical records to determine if there are any unauthorized changes or anomalies in pod ownership and lifecycles.

  ### Prioritization
  Alerts from this detection rule should be treated as medium severity due to the potential impact of unauthorized access in Kubernetes environments, where administrative privileges could lead to significant disruptions and data breaches if left unchecked.

  ### Blind Spots and Assumptions
  This detection rule may miss legitimate pod creations from trusted system components, such as the `daemon-set-controller` and `kube-scheduler`, which also operate within the `kube-system` namespace. The detection logic assumes that attackers will attempt to use naming conventions similar to existing system pods; thus, it relies on the consistency of naming schemes in legitimate usage. Correctly configured audit logging at the Kubernetes level is necessary for this alert to function correctly, as any misconfiguration could lead to gaps in visibility or missed detections.

