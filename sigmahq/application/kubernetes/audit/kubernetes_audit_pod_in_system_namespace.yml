title: Creation Of Pod In System Namespace
id: a80d927d-ac6e-443f-a867-e8d6e3897318
status: test
description: |
  Detects deployments of pods within the kube-system namespace, which could be intended to imitate system pods.
  System pods, created by controllers such as Deployments or DaemonSets have random suffixes in their names.
  Attackers can use this fact and name their backdoor pods as if they were created by these controllers to avoid detection.
  Deployment of such a backdoor container e.g. named kube-proxy-bv61v, could be attempted in the kube-system namespace alongside the other administrative containers.
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Pod%20or%20container%20name%20similarily/
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.stealth
- attack.t1036.005
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    objectRef.namespace: kube-system
  condition: selection
falsepositives:
- System components such as daemon-set-controller and kube-scheduler also create
  pods in the kube-system namespace
level: medium
note: |
  ### Technical Context

  This rule detects the creation of pods in the kube-system namespace within a Kubernetes environment. These activities may indicate attempts by an attacker to deploy backdoor containers masquerading as legitimate system pods, thereby blending in with the infrastructure. The likely objective is to maintain persistence or conduct further attacks without detection. This behavior correlates with the MITRE ATT&CK technique "T1036.005 - Masquerading: Name Similarity," which involves using pod names that imitate genuine system components.

  The primary telemetry source is Kubernetes audit logs, specifically focusing on events related to pod creation. The security impact of malicious pod deployments in the kube-system namespace can be significant, resulting in unauthorized access to cluster resources, exploitation of vulnerabilities, or lateral movement within the environment. However, this detection does NOT confirm malicious intent on its own, as legitimate system components may also create pods in this namespace.

  ### Investigation Steps

  - **Review Kubernetes Audit Logs:** Check for events with the verb 'create' in Pod creation relating to the kube-system namespace (Audit log records). Analyze the fields 'objectRef.resource' and 'objectRef.namespace' for suspicious entries.

  - **Identify Suspicious Pod Names:** Look for pod names that have random suffixes similar to legitimate kube-system pods. Compare against known system pod names to find backdoor indicators, such as 'kube-proxy-bv61v.'

  - **Validate Pod Owner References:** Investigate the owner references of the newly created pods within the kube-system namespace (Audit logs, field: 'ownerReferences'). Legitimate pods typically link to DaemonSets or Deployments, while forged names may lack this association.

  - **Examine Deployment Frequency and Patterns:** Analyze when and how often pods are being created in the kube-system namespace (Kubernetes metrics). Malicious activities are likely to show irregular patterns or bursts in pod creation.

  - **Cross-reference with Known Good Configurations:** Compare the created pod specifications against established baseline configurations (Configuration Management Database). Legitimate pods should adhere to predefined configurations without anomalies in resource requests or limits.

  ### Prioritization

  This alert is of medium severity, as it highlights potentially unauthorized pod deployments within a critical namespace that could lead to serious security incidents. The likelihood of malicious abuse is considerable, given the common use of such tactics to create undetected footholds in cluster environments.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging is not fully enabled or if the Kubernetes configuration lacks necessary permissions for comprehensive monitoring. Legitimate activities, such as automated system updates or maintenance tasks, could trigger this alert, causing potential false positives. A related detection might include monitoring changes to role-based access controls within Kubernetes that would further strengthen coverage against lateral movement attempts.

