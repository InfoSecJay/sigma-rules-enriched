title: Creation Of Pod In System Namespace
id: a80d927d-ac6e-443f-a867-e8d6e3897318
status: test
description: |
  Detects deployments of pods within the kube-system namespace, which could be intended to imitate system pods.
  System pods, created by controllers such as Deployments or DaemonSets have random suffixes in their names.
  Attackers can use this fact and name their backdoor pods as if they were created by these controllers to avoid detection.
  Deployment of such a backdoor container e.g. named kube-proxy-bv61v, could be attempted in the kube-system namespace alongside the other administrative containers.
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Pod%20or%20container%20name%20similarily/
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    objectRef.namespace: kube-system
  condition: selection
falsepositives:
- System components such as daemon-set-controller and kube-scheduler also create pods
  in the kube-system namespace
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of pods within the kube-system namespace that may be masquerading as legitimate system pods. Attackers might deploy malicious containers named similarly to system components to blend in, aiming to avoid detection while gaining persistent access or executing malicious actions. This behavior is relevant to MITRE ATT&CK tactic "Defense Evasion" (T1036.005).

  The primary telemetry source is the Kubernetes Audit logs, specifically focusing on create actions for pods within the kube-system namespace. If this behavior is malicious, it could lead to unauthorized persistent access to the cluster, compromising overall system and application integrity. Importantly, this detection alone does not verify the intent behind the pod creation or confirm malicious activity without further context.

  ---

  ### Investigation Steps

  - **Review Kubernetes Audit Logs:** Check audit logs for create events on the kube-system namespace (Event Type: `create`, Resource: `pods`). Focus on entries where the `objectRef.namespace` is set to `kube-system`.

  - **Identify Pod Naming Patterns:** Verify the names of newly created pods. Legitimate system pods have format-specific random suffixes (e.g., kube-proxy-<random-suffix>). Compare anomalous names (like kube-proxy-bv61v) against known naming conventions.

  - **Analyze the Creator of the Pod:** Look for the associated `user.username` fields in the audit logs. Identify if the user creating the pod has legitimate authorization; unexpected users are a red flag.

  - **Check for Pod Labels and Annotations:** Review the labels and annotations of the suspect pods using `kubectl get pods -n kube-system --show-labels`. Malicious pods may lack expected labels or have unusual custom annotations.

  - **Assess Network Connections:** Monitor the network activity of the created pods. Evaluate for unexpected outbound connections or data exfiltration attempts that could indicate malicious behavior.

  - **Cross-Reference with System Component Activities:** Look for concurrent actions from known system components (like daemon-set-controller or kube-scheduler) around the timestamps of suspicious pod creations to accurately distinguish between benign and malicious activities.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact of an attacker deploying a backdoor pod in a critical system namespace. The likelihood of malicious abuse is significant, as this method is a recognized evasion technique. Although not commonly weaponized in isolated incidents, its implications can lead to severe security compromises.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the misconfiguration of Kubernetes Audit logs, as some interactions may not be logged if audit policies are insufficient. Legitimate activities such as routine updates by daemon sets could trigger this alert, necessitating contextual investigation. A companion detection would involve monitoring for unusual behavior in system pod configurations to enhance coverage against similar evasion attempts.

