title: Creation Of Pod In System Namespace
id: a80d927d-ac6e-443f-a867-e8d6e3897318
status: test
description: |
  Detects deployments of pods within the kube-system namespace, which could be intended to imitate system pods.
  System pods, created by controllers such as Deployments or DaemonSets have random suffixes in their names.
  Attackers can use this fact and name their backdoor pods as if they were created by these controllers to avoid detection.
  Deployment of such a backdoor container e.g. named kube-proxy-bv61v, could be attempted in the kube-system namespace alongside the other administrative containers.
references:
- https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Pod%20or%20container%20name%20similarily/
author: Leo Tsaousis (@laripping)
date: 2024-03-26
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    objectRef.namespace: kube-system
  condition: selection
falsepositives:
- System components such as daemon-set-controller and kube-scheduler also create
  pods in the kube-system namespace
level: medium
note: |
  ### Technical Context

  This rule detects the creation of pods in the `kube-system` namespace within a Kubernetes cluster. Malicious actors often deploy backdoor containers disguised with random, system-like suffixes to evade detection by imitating legitimate system pods created by controllers such as Deployments or DaemonSets. The likely attacker objective is to establish persistent access within a critical namespace, leveraging trusted resources to masquerade their presence and facilitate further compromise.

  This detection relates to the MITRE ATT&CK technique for defense evasion (T1036.005: Masquerading). The primary telemetry source for this detection includes Kubernetes audit logs specifically looking for `create` verb actions on pod resources within the `kube-system` namespace. If this behavior is confirmed malicious, it can lead to serious security breaches, unauthorized access, and potential data exfiltration. However, the detection does NOT confirm that the created pods are indeed malicious on its own, as legitimate system components may also operate within this namespace.

  ### Investigation Steps

  - **Check Kubernetes audit logs**: Review the Kubernetes audit logs for Event type `create` where `objectRef.namespace` equals `kube-system`. Look for any pod names that follow a random naming pattern, such as `kube-proxy-xxxxxx`, which could indicate a potential backdoor.

  - **Verify pod owner references**: Examine the owner references of the suspicious pod(s) created in the `kube-system` namespace. Legitimate components should have clear links to recognized controllers (e.g., DaemonSets or Deployments). Use `kubectl get pods -n kube-system -o json` to find owner references.

  - **Correlate with known alert thresholds**: Check against any known baseline for your environment to ascertain normal activity within the `kube-system` namespace. Analyze the frequency of pod deployments and frequency rates against legitimate system behavior.

  - **Identify elevated permissions**: Investigate the user or service account that executed the pod creation. If the creating entity has unnecessary elevated permissions (like cluster-admin), it could indicate potential malicious activity. Use Kubernetes RBAC to determine roles associated with the account.

  - **Examine resource requests and limits**: Assess whether the newly created pods specify resource requests and limits. Legitimate system pods typically define these, while suspicious pods may lack such specifications, indicating a possible malicious intent to remain undetected.

  ### Prioritization

  This alert should be considered medium severity, given that the `kube-system` namespace is critical for Kubernetes operations. While the probability of malicious exploitation exists, the potential impact depends on the actions performed by the pods created. Instances of pod creation in this namespace that appear to mimic legitimate components are common tactics used by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate Kubernetes components that frequently create pods in the `kube-system` namespace, such as `kube-scheduler` and `daemon-set-controller`. Reliable detection requires comprehensive auditing configurations in Kubernetes to ensure all actions are logged. Legitimate activities, such as authorized deployments by DevOps teams for system maintenance, may trigger this alert. A complementary detection would include monitoring container network activity within the `kube-system` namespace to identify unusual outbound connections or data exfiltration attempts.

