note: |
  ### Technical Context

  This rule detects modifications to Kubernetes Rolebindings, including the creation, deletion, patching, or updating of Rolebindings and ClusterRoleBindings within the Kubernetes cluster. The likely attacker objective is to escalate privileges by granting users or service accounts more access than intended, which can facilitate lateral movement or deployment of malicious workloads. This behavior is relevant to the MITRE ATT&CK tactic of Privilege Escalation (T1068) and the technique for Exploitation for Client Execution (T1535).

  The primary telemetry source is the Kubernetes Audit logs, specifically capturing events related to Rolebindings (e.g., `objectRef.apiGroup` indicating `rbac.authorization.k8s.io`). A successful modification could significantly impact security by granting unauthorized access to sensitive resources. Importantly, this detection does NOT confirm malicious intent or activity on its own, as legitimate administrators may perform similar actions as part of routine operations.

  ### Investigation Steps

  - **Verify recent modifications:** Check the Kubernetes Audit logs (Event ID related to Kubernetes events) for recent `create`, `delete`, `patch`, or `update` events on Rolebindings or ClusterRoleBindings. Look for the initiating user, reviewing fields like `user.username` and `user.groups` to assess context.

  - **Identify high-risk changes:** Focus on any Rolebinding modifications granting elevated permissions to users or service accounts, particularly those altering access to critical namespaces or resources. Look for patterns in `objectRef.resource` such as `clusterrolebindings` suggesting significant privilege changes.

  - **Audit admin activity:** Cross-reference the alerts with internal change management logs or ticketing systems to identify if the modifications had prior authorization from legitimate administrative processes. Confirm legitimate admin accounts were involved by reviewing usernames against internal records.

  - **Check surrounding audit logs:** Investigate adjacent or related audit log entries (look within a few minutes of the alert) for indications of suspicious activity or abnormal patterns, such as a series of privilege escalation attempts or the use of unauthorized accounts.

  - **Review known evasion techniques:** Be aware that attackers may use legitimate automated processes or CI/CD pipelines that modify Rolebindings. Validate whether these changes came from expected automated tools or manual execution by authorized personnel.

  - **Determine asset criticality:** Assess whether the affected Rolebinding pertains to a critical namespace or resource within your Kubernetes environment. Higher sensitivity warrants more thorough investigation.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of unauthorized privilege escalations in a Kubernetes environment. While the likelihood of abuse is moderate, these behaviors are commonly leveraged by adversaries actively seeking to increase their access and control in the cluster.

  ### Blind Spots and Assumptions

  Detection may be limited by the granularity and retention of Kubernetes Audit logs, which could miss rapid or automated changes. It is critical to ensure audit log collection is properly configured to encompass all relevant events. Legitimate activities such as updates by automated CI/CD processes may trigger alerts; thus, understanding typical deployments is crucial. Companion detections, such as monitoring for container creation or other related RBAC changes, can provide additional context and improve overall coverage against privilege escalation tactics.

