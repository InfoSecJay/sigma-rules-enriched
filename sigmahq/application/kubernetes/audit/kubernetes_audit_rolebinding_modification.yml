  ### Technical Context

  This rule detects when a Kubernetes Rolebinding is created, modified, or deleted within the environment. Rolebindings in Kubernetes grant permissions to users or groups, and an attacker could exploit this to escalate privileges, manipulate access controls, or disrupt the normal functioning of Kubernetes applications. This behavior aligns with the MITRE ATT&CK technique for privilege escalation (T1068).

  Primary telemetry sources include Kubernetes audit logs, specifically focusing on events with the `objectRef.apiGroup` set to `rbac.authorization.k8s.io` and actions related to `clusterrolebindings` and `rolebindings`. If malicious, this behavior can lead to unauthorized access to sensitive resources, allowing attackers to execute arbitrary commands or gain control over cluster operations. Notably, this detection does not prove malicious intent on its own; legitimate administrative actions may trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review Kubernetes Audit Logs**: Check for events related to Rolebinding activity in the Kubernetes audit logs (`audit.k8s.io`). Specifically, look for Event IDs associated with `create`, `update`, or `delete` verbs for `rolebindings` or `clusterrolebindings`.

  - **Verify the User/Service Account**: Identify the user or service account that triggered the Rolebinding change. Look for `user.username` and `user.groups` fields in the audit logs to determine if the action was performed by a known administrator or through an automated process.

  - **Evaluate the Timing and Frequency of Changes**: Assess the timestamps of the changes against normal operational patterns. Legitimate modifications often occur during scheduled maintenance or well-documented deployments. Changes outside of expected operational hours may warrant further scrutiny.

  - **Identify High-confidence Malicious Indicators**: Look for known malicious usernames or service accounts associated with the modification. Field `user.username` values that match known attacker tactics may indicate compromise.

  - **Document Related Resources Impacted**: Analyze associated resources to understand the implications of the Rolebinding change. Check which Pods, Deployments, or other resources were affected, as this can reveal elevated access.

  - **Review Configuration Management Practices**: Assess how Rolebindings are provisioned and modified by legitimate processes. Understand your deployment automation and infrastructure as code practices to distinguish them from potential unauthorized changes.

  ---

  ### Prioritization

  The severity of this alert is medium, as compromised Rolebinding configurations can lead to significant security risks, including privilege escalation. The likelihood of malicious use is heightened given that modifying Rolebindings is a common tactic for expanding access within Kubernetes environments.

  ---

  ### Blind Spots and Assumptions

  Detection of Rolebinding changes may be limited by audit log configurations; missing audit logs may hinder detection accuracy. Evasion techniques can include using legitimate administrator service accounts to perform changes while masquerading as normal activity. This alert may trigger during standard administrative duties, thus necessitating contextual awareness regarding operational procedures. A related detection covering suspicious user behavior modifications in Kubernetes could strengthen overall monitoring.

