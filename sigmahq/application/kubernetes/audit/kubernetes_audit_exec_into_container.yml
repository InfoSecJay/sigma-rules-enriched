note: |
  ### Technical Context

  This Sigma rule detects attempts to execute remote commands within a Kubernetes pod container using the `kubectl exec` command. The likely attacker objective is to gain shell access to manipulate or extract information from the containerized application, potentially leading to further compromise of the underlying host or cluster. This activity corresponds to the MITRE ATT&CK technique of Remote Command Execution (T1609).

  Primary telemetry sources include Kubernetes audit logs that capture changes in API calls specifically around resource management. The detection indicates that unauthorized or unexpected command execution may be occurring, which can lead to data exfiltration or the deployment of malicious payloads. Importantly, this detection does NOT confirm malicious intent on its own; legitimate debugging activities may also trigger this alert.

  ### Investigation Steps

  - **Review Kubernetes audit logs:** Check for `Event` records with `verb: 'create'` and `objectRef.resource: 'pods'` with `objectRef.subresource: 'exec'`. Focus on user identity for context.

  - **Validate user credentials:** Assess the identity of the user making the request. Confirm if the user has legitimate permissions to execute commands in the targeted pod/container.

  - **Determine execution context:** Confirm the command being executed within the container via audit log entries (e.g., `requestObject.command`). Compare against expected commands for legitimate application support or debugging.

  - **Check for malicious command patterns:** Look for unexpected command executions such as `curl`, `wget`, or other tools commonly used for lateral movement and data exfiltration in the relevant pod/container contexts.

  - **Review pod activity and role:** Verify the role of the affected pods (e.g., production vs. development) and check for any recent changes or unusual activity that could indicate compromise.

  ### Prioritization

  This alert has medium severity due to the potential risk of remote command execution within critical pod environments. The likelihood of malicious abuse increases if the command executed is atypical for the specific application context. Remote execution attempts are commonly weaponized during compromise scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient audit log retention configurations or if `kubectl exec` commands are executed by legitimate users under valid circumstances. Scenarios such as debugging or system monitoring can also trigger this alert. Companion detections, such as monitoring for unusual container networking activity or unauthorized API access, help strengthen threat detection capabilities.

