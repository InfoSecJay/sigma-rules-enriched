  ---

  ### Technical Context

  This rule detects attempts to execute remote commands within a Kubernetes Pod container using the `kubectl exec` command. The behavior indicates an attacker leveraging Kubernetes capabilities to run commands in a compromised container or to gain a foothold within the cluster. The relevant MITRE ATT&CK tactic is **Execution** (T1059.003: Command and Scripting Interpreter - Windows Command Shell).

  Primary telemetry sources include Kubernetes audit logs, specifically looking for events where the `verb` is `create` and the `objectRef.resource` indicates `pods` with a `subresource` of `exec`. If successful, this command execution can lead to unauthorized access and control over the application's environment, potentially facilitating further lateral movement or data exfiltration. It’s important to note that this detection does NOT confirm malicious activity on its own, as legitimate debugging or administrative operations may also trigger similar events.

  ---

  ### Investigation Steps

  - **Review Kubernetes audit logs for suspicious execution attempts**: Look for audit events with `verb: create`, `objectRef.resource: 'pods'`, and `objectRef.subresource: 'exec'` in the Kubernetes audit log. Note the user identity initiating these commands and their role.

  - **Validate user permissions and roles**: Cross-reference the user identity performing the `kubectl exec` command against Kubernetes Role-Based Access Control (RBAC) settings. Confirm whether this user should have the permissions to execute commands in the targeted Pod.

  - **Assess for anomalies in execution history**: Investigate the frequency and patterns of `kubectl exec` commands by the user. Legitimate operations may have a predictable pattern tied to specific workloads. Sudden spikes or execution during odd hours would indicate potential malicious activity.

  - **Check for unusual command activity**: Monitor the specific commands executed via the `kubectl exec` command. Malicious indicators may include attempts to install or launch unauthorized binaries, or network tools (e.g., `curl`, `wget`) being invoked within the Pod.

  - **Examine Pod context and role**: Identify the criticality of the Pod in question by checking its role and expected activity. Executions within production-critical Pods should be treated with higher urgency compared to non-critical development environments.

  - **Capture any output redirection**: Investigate if the output of commands executed via `kubectl exec` is being redirected to external sources, which could indicate data exfiltration activities.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on sensitive systems within the Kubernetes environment. The likelihood of malicious abuse is moderate; while legitimate administrative tasks can trigger this alert, the risk of exploitation through unauthorized command execution poses significant concerns, particularly in production environments.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations due to misconfigured Kubernetes audit logging, where not all execution attempts are captured. Additionally, legitimate debugging activities by authorized users may trigger these alerts, leading to false positives. Organizations should ensure comprehensive RBAC configurations to minimize unnecessary alerts. A companion detection could involve monitoring for unusual network connections originating from Pods, which may indicate further malicious behavior post-command execution.

