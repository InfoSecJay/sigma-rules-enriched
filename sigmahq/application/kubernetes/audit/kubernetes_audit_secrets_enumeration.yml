note: |
  ### Technical Context

  This Sigma rule detects attempts to enumerate Kubernetes secrets, specifically by identifying API requests where the verb is "list" targeting the "secrets" resource. Attackers may aim to gather sensitive credentials or configuration data held within secrets to facilitate further network compromise or lateral movement within the cluster. This behavior aligns with the MITRE ATT&CK framework under the tactic of Credential Access (TA0006), specifically technique T1552.007 (Application Layer Protocol).

  The primary telemetry sources are Kubernetes audit logs, which capture events related to API requests made to the Kubernetes API server. The security impact of successfully exploiting this behavior could result in unauthorized access to sensitive data, potentially leading to privilege escalation or service disruption. However, this detection does NOT confirm successful exfiltration or misuse of the secrets; it merely indicates enumeration activity.

  ### Investigation Steps

  - **Review Kubernetes audit logs**: Search for events with resource type "secrets" and verb "list" in the Kubernetes audit logs (fields: `verb`, `objectRef.resource`). Confirm whether the requests are legitimate through context such as timestamps and source IPs.

  - **Check access patterns**: Investigate prior access patterns for the user or service account making the requests. Legitimate access typically occurs during routine operations by authorized users or services in the Kubernetes ecosystem.

  - **Examine `kubectl` command execution**: Look for command executions via `kubectl` that include the "get" or "list" commands on secrets. Check logs for Event ID indicating shell execution related to Kubernetes client operations (e.g., audit log entries referencing `kubectl`).

  - **Identify unauthorized service accounts**: Filter audit logs for service account tokens or users that do not have expected roles to access secrets. Malicious indicators include service accounts previously not interacting with secrets suddenly generating list events.

  - **Correlate with other security alerts**: Investigate related detections, such as unauthorized access to Kubernetes node logs or abnormal container executions, to build context around the enumeration activity (reference companion detection ID: 7ee0b4aa-d8d4-4088-b661-20efdf41a04c).

  ### Prioritization

  This alert holds low severity in a mature enterprise context due to the typically controlled environment of Kubernetes access. However, the likelihood of malicious abuse exists, primarily for clusters exposed to external threats. Enumeration of secrets, while less aggressive than direct exfiltration, can serve as a precursor to more damaging attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured audit logging settings, which could lead to missed enumeration attempts. Legitimate tools, including monitoring and CI/CD pipelines, may inadvertently trigger the alert when listing secrets. A related detection for unauthorized Kubernetes access could involve failed attempts to retrieve secrets, providing broader coverage of potentially malicious behaviors.

