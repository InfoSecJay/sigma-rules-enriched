note: |
  ### Technical Context

  This rule detects modifications to mutating or validating webhook configurations within a Kubernetes cluster. Such alterations can enable an attacker to establish persistence, intercept traffic, or exfiltrate credentials from pods, thereby compromising the security posture of the environment. The behavior correlates with multiple MITRE ATT&CK techniques, including persistence (T1078), initial access (T1552), and credential access (T1552.007). The primary telemetry source for this detection is Kubernetes audit logs, specifically tracking events related to the `admissionregistration.k8s.io` API group and associated resources.

  If malicious, these modifications could lead to unauthorized access, data leakage, or remote code execution within the cluster. However, it is crucial to note that this detection only indicates a modification action; it does not confirm the intent behind the change or whether it was performed by an authorized user.

  ### Investigation Steps

  - **Verify modified webhook configurations: ** Review Kubernetes Audit Logs (Event Source: `admissionregistration.k8s.io`), focusing on Event Types such as `create`, `update`, `delete`, or `replace` for the `mutatingwebhookconfigurations` and `validatingwebhookconfigurations` resources. Check fields like `objectRef.name` and `user.username` to understand the context of the changes.

  - **Identify legitimate administrative actions:** Confirm if the modification was made by a user with proper administrative credentials. Look for logs in the Kubernetes Audit Store where the user may have performed expected maintenance activities, ideally with their roles and permissions outlined to ensure legitimacy.

  - **Assess user and service account permissions:** Investigate Role-Based Access Control (RBAC) settings to ascertain if the user or service account making changes has the necessary permissions. This can be revealed through `kubectl get clusterroles` and `kubectl get clusterrolebindings` in conjunction with the audit log details.

  - **Cross-reference timestamps for anomalies:** Combine Kubernetes audit logs with logs from the container orchestration platform (e.g., using Docker logs) to check for unusual activity around the same timestamps, particularly any automated processes or deployments that might align with the timeline of the modifications.

  - **Establish potential malicious indicators:** Look for modification events by user accounts or service accounts that are typically associated with attacks or had no previous history of making such changes. Blueprints include service accounts exemplified by names similar to common attack vectors or those observed in recent incidents.

  ### Prioritization

  This alert is rated medium severity. The actions detected can affect critical parts of Kubernetes infrastructure, and the likelihood of exploiting these modifications is high, given that this behavior is weaponized by various attack frameworks. However, benign administrative actions also commonly trigger this rule, necessitating careful validation during triage.

  ### Blind Spots and Assumptions

  There is a risk of evasion if an attacker manages to modify webhook configurations in a way that does not generate audit logs or if logs are insufficiently configured. Additionally, automated processes like CI/CD pipelines may trigger this alert without malicious intent. A related detection rule that strengthens coverage includes monitoring for unusual successful API calls to the Kubernetes API, which could indicate privilege escalation attempts or lateral movement within the cluster.

