note: |
  ### Technical Context

  This Sigma rule detects modifications to Kubernetes webhook configurations, specifically for mutating and validating admission controllers. The attacker may aim to persistently manipulate Kubernetes API requests or exfiltrate sensitive information, such as access credentials, through malicious webhooks. This activity aligns with the MITRE ATT&CK techniques of **Persistence (T1078)** and **Credential Access (T1552.007)**.

  The primary telemetry source for this detection is Kubernetes audit logs, specifically monitoring for events related to the `admissionregistration.k8s.io` API group. The security impact of successful malicious modifications could lead to unauthorized access, unfiltered API requests, and potential data breaches within the Kubernetes environment. However, this detection does NOT confirm actual exploitation or successful credential theft on its own; further investigation is warranted to assess the impact and intent behind the modification.

  ### Investigation Steps

  - **Review audit logs for modifications:** Check Kubernetes audit logs for entries with `objectRef.apiGroup: admissionregistration.k8s.io` indicating modifications (create, delete, patch, replace, update) to mutating and validating webhook configurations (Event Type: `MODIFY`).
  - **Identify user context:** Determine the user or service account making these changes from the audit logs (`user.REQUESTOR` field). Actions performed by high-privileged accounts outside of routine job functions may indicate malicious intent.
  - **Evaluate legitimate use cases:** Verify if the modification falls within expected administrative tasks, such as routine updates for new deployments or infrastructure changes. Check for recent, approved changes by cross-referencing with operational change management.
  - **Check for high-confidence malicious indicators:** Look for specific webhook configurations in the modified entries that appear suspicious, such as URLs pointing to untrusted or external sources, or webhook rules that deviate from standard operational security practices.
  - **Assess frequency of modifications:** Analyze the trend of webhook modifications per time period. A sudden increase in modifications by a specific user or service may indicate malicious activity or automation that should be further scrutinized.
  - **Validate webhook actions:** If webhook modifications are confirmed malicious, investigate if there are corresponding logs indicating unauthorized API requests or data exfiltration associated with the webhook endpoint (e.g., HTTP request logs to these webhook URLs).

  ### Prioritization

  This alert is medium severity as it involves modifications to critical Kubernetes admission controller configurations that could lead to unauthorized access or system compromise. Given that the manipulation of admission controllers is a known tactic for persistence and credential theft, the likelihood of malicious abuse is concerning depending on the context and frequency of such changes.

  ### Blind Spots and Assumptions

  This detection may have limitations regarding legitimate administrative changes, which could produce similar alerts. Continuous monitoring may be required in conjunction with finely-tuned alerting to reduce false positives. It assumes that Kubernetes audit logs are correctly configured and retained, as lacking these logs would prevent effective detection. Related detections, such as monitoring API calls made to webhook endpoints (e.g., `admissionregistration.k8s.io` API calls), will strengthen overall security visibility in the Kubernetes environment.

