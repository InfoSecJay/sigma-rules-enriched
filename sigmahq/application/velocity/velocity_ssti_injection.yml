note: |
  ### Technical Context

  This rule detects exceptions related to template rendering in Apache Velocity, specifically flagging `ParseErrorException`, `VelocityException`, and `TemplateInitException`. The behavior indicates that user input may be improperly handled or malicious input is being processed, potentially leading to Remote Code Execution (RCE). The likely attacker objective is to exploit a vulnerability in the templating engine, causing it to execute arbitrary code in the application context.

  The relevant MITRE ATT&CK tactics are Initial Access (T1190). The primary telemetry source for this detection is application error logs, which must be configured to capture entries with a log level of ERROR and above. If exploited, this can lead to significant security breaches, including unauthorized system access and data compromise. However, this detection does NOT confirm successful exploitation; it merely indicates an error that may stem from a vulnerability.

  ### Investigation Steps

  - **Check application error logs:** Review logs for `ParseErrorException`, `VelocityException`, or `TemplateInitException` entries (Log type: Application Error Logs). Investigate the context of the error for suspicious patterns.

  - **Identify user input sources:** Trace back to where dynamic input is being processed. Inspect logs for user requests containing potentially malicious payloads that conform to template syntax.

  - **Correlate with application context:** Determine if the impacted application is publicly accessible and likely to be targeted. Assess if this application handles user-generated content, increasing risk exposure.

  - **Review web server access logs:** Examine web server logs for any unusual or unexpected requests prior to the error events. Look for indicators such as HTTP methods (POST, GET) and payload patterns that exhibit typical attack signatures.

  - **Confirm application version and patches:** Verify the version of the Velocity framework and any existing security patches applied. Use asset management records to confirm the software's exposure to known vulnerabilities.

  - **Validate legitimate activities:** Cross-reference log entries with expected application behavior, such as common user actions or known features that utilize template rendering. Identify typical usage scenarios to filter out false positives.

  ### Prioritization

  This alert warrants high severity due to the potential impact of RCE if exploited and the likelihood that the vulnerabilities associated with template injection attacks can be weaponized. Systems handling sensitive data or user inputs should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited due to application misconfigurations or incomplete log collections, particularly if errors are not captured properly in the logs. Legitimate bugs or application errors unrelated to user input could trigger the alert, resulting in false positives. Companion detections to consider include monitoring for unusual application behavior or known attack patterns used with RCE attempts to enhance coverage against exploitation.

