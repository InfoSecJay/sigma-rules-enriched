  ### Technical Context

  This Sigma rule detects exceptions in the Velocity template renderer, indicating potential Server-Side Template Injection (SSTI) attacks. The objective of an attacker is to exploit the ability to inject malicious code into a template, potentially leading to Remote Code Execution (RCE). This behavior is associated with the MITRE ATT&CK tactic "Initial Access" (TA0001) and technique "User Execution" (T1190).

  The primary telemetry sources are application error logs from the Velocity rendering engine, specifically logs with LOG_LEVEL set to ERROR and above. If malicious, the impact could be severe as it might allow an attacker to execute arbitrary code on the server. The detection does not confirm successful exploitation on its own; it merely indicates a potential issue in the template rendering process that requires further investigation.

  ---

  ### Investigation Steps

  - **Review error logs for specific exceptions:** Check application error logs for keywords such as `ParseErrorException`, `VelocityException`, or `TemplateInitException`. Record Event IDs or relevant log fields indicating the source and nature of the errors.

  - **Correlate with web application activity:** Identify recent web requests made to the application during the timeframe of the detected exceptions. Review access logs for potentially malicious request patterns that could indicate attempts to manipulate templates.

  - **Validate benign activity against application features:** Confirm legitimate use of dynamic template rendering by identifying features or users that commonly generate dynamic templates in the application. This could include reporting tools or admin functions.

  - **Look for signs of RCE attempts:** Check for unusual process creations or command executions associated with the application server following the log entries. Utilize Security Event ID 4688 or Sysmon Event ID 1 to identify potentially dangerous shell commands executed on the server.

  - **Investigate the presence of unauthorized files:** Look for suspicious file creations or modifications (e.g., unexpected .vm files) in the Velocity template directory during the alert period, indicating possible exploitation attempts or unauthorized changes.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact on the application server and the likelihood of exploitability. Given the criticality of application servers in business operations and the common usage of SSTI in attacks, prompt validation of these alerts is essential.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient application logging configurations that do not capture all error levels. Legitimate activities such as application misconfigurations or developmental processes may trigger this alert, leading to false positives. Related detection could involve monitoring for abnormal outbound connections from the server, which may indicate an active exploitation of an SSTI vulnerability.

