title: Suspicious SQL Error Messages
id: 8a670c6d-7189-4b1c-8017-a417ca84a086
status: test
description: Detects SQL error messages that indicate probing for an injection 
  attack
references:
- http://www.sqlinjection.net/errors
author: Bjoern Kimminich
date: 2017-11-27
modified: 2023-02-12
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: application
  product: sql
  definition: 'Requirements: application error logs must be collected (with LOG_LEVEL
    ERROR and above)'
detection:
  keywords:
        # Oracle
  - quoted string not properly terminated
        # MySQL
  - You have an error in your SQL syntax
        # SQL Server
  - Unclosed quotation mark
        # SQLite
  - 'near "*": syntax error'
  - SELECTs to the left and right of UNION do not have the same number of result
    columns
  condition: keywords
falsepositives:
- A syntax error in MySQL also occurs in non-dynamic (safe) queries if there is 
  an empty in() clause, that may often be the case.
level: high
note: |
  ### Technical Context

  This rule detects SQL error messages that suggest probing for SQL injection vulnerabilities. Attackers typically aim to exploit these vulnerabilities to gain unauthorized access to databases or manipulate data, indicative of the Initial Access phase (MITRE ATT&CK Tactic: Initial Access, Technique: T1190 - Exploit Public-Facing Application). Primary telemetry sources include application error logs, specifically capturing SQL-related error messages, with a focus on logs containing errors categorized as LOG_LEVEL ERROR and above. If malicious, such activities can compromise database integrity and lead to data breaches. However, the detection of these error messages does NOT confirm that a successful SQL injection or any malicious activity has occurred. It may also reflect benign development or diagnostic efforts.

  ### Investigation Steps

  - **Check application error logs for specific messages:** Look for error entries containing phrases like "quoted string not properly terminated," "You have an error in your SQL syntax," or "Unclosed quotation mark" within application logs (Event ID 5001 for SQL Server, application-specific error logs). Malicious indicators include repeated occurrences of these errors from the same IP address in a short timeframe.

  - **Identify source IP and frequency of errors:** Cross-reference the source IP of the log entries with other logs (e.g., web server access logs) to determine if the same IP is generating multiple error messages. High-frequency error messages from a single source may suggest active probing.

  - **Review recent changes in web applications:** Check version control or deployment logs for recent application changes that may relate to error occurrence. Legitimate changes may include query adjustments or updates to input validation, while unusual entries hint at potential misuse or probing.

  - **Analyze related application traffic:** Employ web server logs (e.g., Apache or NGINX access logs) to review the requests leading to the generated error messages. Look for suspicious parameters or unusual access patterns (e.g., URLs with SQL injection characteristics like "1' OR '1'='1").

  - **Examine roles and permissions:** Confirm the roles of the affected application services and data sensitivity handled. Critical applications accessing sensitive data must be under particular scrutiny when errors are detected.

  ### Prioritization

  The alert severity is high due to the potential impact on critical databases and the likelihood that these SQL error messages indicate malicious probing. As SQL injection attacks are well-known and commonly exploited vulnerabilities, this behavior poses significant security risks to the organization.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through crafted inputs that do not trigger standard error messages or when applications have been configured to suppress detailed error outputs. Required log sources and configurations must include comprehensive application error logging. Legitimate activities, such as development testing or automated vulnerability scanning, may incidentally trigger the alert. A companion detection is monitoring for unusual query patterns (e.g., excessive SELECT requests), which can further strengthen coverage against SQL injection attempts.

