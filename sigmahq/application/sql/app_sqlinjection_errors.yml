title: Suspicious SQL Error Messages
id: 8a670c6d-7189-4b1c-8017-a417ca84a086
status: test
description: Detects SQL error messages that indicate probing for an injection attack
references:
- http://www.sqlinjection.net/errors
author: Bjoern Kimminich
date: 2017-11-27
modified: 2023-02-12
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: application
  product: sql
  definition: 'Requirements: application error logs must be collected (with LOG_LEVEL
    ERROR and above)'
detection:
  keywords:
        # Oracle
  - quoted string not properly terminated
        # MySQL
  - You have an error in your SQL syntax
        # SQL Server
  - Unclosed quotation mark
        # SQLite
  - 'near "*": syntax error'
  - SELECTs to the left and right of UNION do not have the same number of result columns
  condition: keywords
falsepositives:
- A syntax error in MySQL also occurs in non-dynamic (safe) queries if there is an
  empty in() clause, that may often be the case.
level: high
note: |
  ### Technical Context
  This rule detects suspicious SQL error messages that may indicate attempts to probe for SQL injection vulnerabilities in an application. Attackers often send malformed SQL queries to a database to gain insight into its structure, identify weaknesses, or even manipulate data. The likelihood of a successful SQL injection could allow for unauthorized data access, alteration, or full compromise of the database management system, which could have severe implications for data integrity and confidentiality.

  The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) and specifically the technique of **SQL Injection** (T1190). These mappings highlight the attacker's intent to enter the system's environment through application vulnerabilities. The primary data sources for this detection are application error logs that capture SQL query processing errors. Ensuring proper logging levels (ERROR and above) will provide the necessary evidence to identify malicious activities.

  ### Investigation Steps
  - **Review SQL Error Logs**: Analyze application error logs for specific SQL error messages that suggest probing attempts, such as "quoted string not properly terminated" or "You have an error in your SQL syntax."

  - **Correlate with Application Behavior**: Identify if the error messages correspond with any unusual application access patterns or request spikes, which may indicate automated probing tools are being used.

  - **Monitor Database Activity**: Inspect the database activity around the time of the detected errors. Look for unusual queries or connection patterns originating from unexpected IP addresses or user accounts.

  - **Identify Vulnerable Endpoints**: Check for web application interfaces that may be misconfigured or use outdated libraries prone to SQL injection attacks, ensuring to validate your application's security posture.

  ### Prioritization
  The severity of this alert is high due to the significant risk posed by SQL injection attacks, which can lead to data breaches or complete database compromise. The likelihood of such attacks is heightened as threat actors continuously seek to exploit known application vulnerabilities.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage if application error logs are not properly configured or if specific error messages are not captured due to logging level settings. The detection logic assumes that legitimate application use will not frequently generate the specified error messages, and therefore, context (such as recent changes in application code or configurations) could lead to both false positives and missed detections. Comprehensive logging and maintenance of security best practices are essential for the effectiveness of this rule.

