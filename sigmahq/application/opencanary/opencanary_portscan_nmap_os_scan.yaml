  ### Technical Context
  This rule detects attempts to perform an OS scan on an OpenCanary node using NMAP, a popular network scanning tool. OpenCanary is a low-interaction honeypot designed to emulate various network services, enticing attackers to engage with it. When an attacker scans the network and interacts with the OpenCanary instance, it potentially reveals their intention to enumerate and exploit networked systems, highlighting reconnaissance activities typical of initial stages of an attack.

  The associated MITRE ATT&CK tactics include **Discovery** (T1087), where adversaries seek to gather information about systems and services. Specifically, this detection relates to the use of **Network Service Scanning** (T1046), as it indicates that the attacker is probing for open ports and service versions, often with the aim of identifying vulnerable systems. The primary data sources for confirming this detection are application logs generated by OpenCanary.

  ### Investigation Steps
  - **Review OpenCanary Logs**: Analyze the OpenCanary application logs for any entries indicative of an NMAP OS scan (logtype: 5002). Look for patterns or signatures that point to repeated or suspicious probe requests.

  - **Correlate IP Addresses**: Cross-reference the source IP addresses identified in the logs with internal records. Determine if the source is expected within the environment or classified as a potential threat.

  - **Network Traffic Analysis**: Utilize network traffic monitoring tools to inspect any relevant connections to the OpenCanary instance during the detected timeframe. Look for anomalous traffic patterns or multiple connection attempts.

  - **Validate Threat Intelligence**: Check against threat intelligence sources to see if any detected IPs are known to be associated with malicious actors or previous reconnaissance scans. This will help assess the potential risk posed by the scanning activity.

  ### Prioritization
  Alerts of this nature are categorized as high severity due to the actionable intelligence they provide regarding potential reconnaissance operations. Such activities can indicate preparatory steps toward a larger attack, warranting immediate investigation.

  ### Blind Spots and Assumptions
  This detection may not capture all potential reconnaissance efforts, as attackers may employ tools or techniques not logged by OpenCanary. Additionally, the detection assumes that OpenCanary is correctly configured to capture relevant logs and is operational within the environment. Without correct logging levels or active OpenCanary instances, this rule may yield false negatives or miss crucial indicators of compromise.

