  ### Technical Context

  This Sigma rule detects when an OpenCanary node has been targeted by an NMAP OS scan, indicated by log type 5002. The likely attacker objective is to discover the operating system and services running on the node, often a precursor to more targeted attacks. This behavior correlates with the MITRE ATT&CK tactic of Discovery, specifically the technique T1046 (Network Service Discovery). Primary telemetry sources include logs generated by OpenCanary, particularly log type 5002. If confirmed malicious, this behavior may facilitate unauthorized access or lateral movement within the network. However, it is important to note that this detection does NOT confirm that exploitation or compromise has occurred.

  ### Investigation Steps

  - **Identify the log entry for OS scan:** Review OpenCanary logs for log type 5002. Check fields for source IP addresses conducting the scan and timestamps to assess the frequency and recurrence of this behavior.

  - **Correlate with known benign behavior:** Validate if the IP triggering the alert is part of internal network operations or known asset discovery activities. Expected behavior may include interactions from internal security assessment tools.

  - **Analyze source IP reputation:** Conduct a lookup for any external IP addresses detected in the log entry to assess if they belong to known malicious actors or are part of legitimate business partner assessment.

  - **Check for repeated or heavy scanning:** Investigate if multiple requests from the same source within a short time frame indicate automated scanning. This could signify intent rather than benign inquiry.

  - **Review other OpenCanary alerts:** Cross-check any additional alerts from OpenCanary around the same timestamp, including logs indicating reverse shell attempts or unexpected service inquiries, to identify correlation and potential for malicious activity.

  - **Evaluate asset criticality:** Assess the role of the affected OpenCanary node within the network. High-valued assets that are being scanned should be prioritized for immediate remediation actions and deeper investigation.

  ### Prioritization

  This alert has high severity given it indicates potential reconnaissance against network assets, which could precede more significant malicious activities. The likelihood of malicious intent is elevated due to the nature of OS scanning being a common tactic used by adversaries to gather intelligence. Due to its commonplace usage in exploitation workflows, this behavior should be taken seriously.

  ### Blind Spots and Assumptions

  Potential limitations in detection include the capacity for IP spoofing by adversaries to evade scrutiny. Reliable detection requires OpenCanary to be properly configured to ensure log types are correctly enabling alerts. Legitimate activities such as routine external penetration tests may trigger this alert. A related detection to enhance coverage could include monitoring for suspicious port scanning activities via firewall logs or IDS alerts.

