  ### Technical Context

  This Sigma rule detects SYN port scans targeting an OpenCanary instance, which simulate a potential adversarial reconnaissance activity aimed at identifying open ports and services. The likely attacker objective is to gather information about the organization's network topology and identify exploitable services. This behavior is classified under the MITRE ATT&CK framework as Discovery (TA0007) and Network Service Scanning (T1046). The primary telemetry source is OpenCanary logs, specifically focused on Log Type 5001 for identifying scan activity.

  If this alert is confirmed as malicious, the security impact could be significant, potentially leading to further exploitation attempts against discovered services. Importantly, this detection does NOT confirm successful exploitation or access to any systems; it merely indicates that a probe has occurred.

  ### Investigation Steps

  - **Check OpenCanary logs:** Review logs with Log Type 5001 for recorded SYN scan attempts, focusing on the timestamps, source IP addresses, and targeted ports.

  - **Identify source IP addresses:** Investigate any external IP addresses identified in the logs. Compare them against threat intelligence sources to determine if they are known malicious actors.

  - **Examine the affected service ports:** Validate if any sensitive services (e.g., SSH, RDP) were targeted in the scan. Legitimate service ports typically receive expected traffic patterns; analyze the frequency and type of access in normal operations.

  - **Correlate with network firewall logs:** Cross-reference the OpenCanary logs with firewall logs (Event ID 5156 for Windows Firewall) to see if traffic was initiated from the same source IP at the same timestamps.

  - **Assess for multiple scan patterns:** Review logs for repeated SYN packets from the same IP, indicating a potential sustained reconnaissance effort. This behavior may suggest a higher likelihood of malicious intent.

  - **Monitor for subsequent activity:** Following the detection, be proactive in monitoring for subsequent alerts or anomalous behaviors in correlated systems, as a SYN scan may precede attempts to exploit discovered vulnerabilities.

  ### Prioritization

  The alert is of high severity given that it targets potentially vulnerable network services, exposing them to increased risk of malicious exploitation. The likelihood of malicious abuse is notable, especially since SYN scans are a common preliminary step in network intrusions. This behavior is often weaponized by attackers seeking to map and breach systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the configurations of OpenCanary and network devices, which could inadvertently filter or obscure scan attempts. Legitimate system administrators may trigger this alert during routine security assessments or network audits, necessitating a review of context. A related detection to strengthen coverage could involve monitoring for increased traffic to services on the affected ports, as this might indicate follow-up activity stemming from the initial reconnaissance.

