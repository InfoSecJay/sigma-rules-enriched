  ### Technical Context

  This Sigma rule detects login attempts to a Telnet service running on an OpenCanary honeypot. The behavior indicates that an attacker may be attempting to gain unauthorized access to a system via Telnet, which is often considered a insecure protocol due to lack of encryption. The likely attacker objective is system infiltration and potential lateral movement within the network. This behavior is relevant to the MITRE ATT&CK technique for Remote Services (T1133) and Valid Accounts (T1078).

  The primary telemetry source is the OpenCanary application logs, specifically filtering for logtype 6001. If successful, malicious actors could use Telnet for persistence or command-and-control purposes, jeopardizing enterprise asset security. However, this detection does NOT confirm that the login attempt was successful or that the attacker achieved any further access.

  ### Investigation Steps

  - **Examine Telnet login logs:** Review OpenCanary logs for logtype 6001 entries. Key fields to investigate include username, source IP address, and timestamp. Look for any login attempts from unusual IPs or known bad actors.

  - **Identify legitimate users:** Verify if the usernames used in the login attempts are associated with legitimate users in your organization. Be cautious with common names or administrative accounts that may be targeted by attackers.

  - **Assess source IP reputation:** Utilize threat intelligence feeds to check the reputation of source IP addresses attempting to access the Telnet service. Identify any IPs linked to malicious activity.

  - **Cross-check user behavior:** Analyze nearby log entries to gauge user activity. Legitimate usage of Telnet should align with expected operational behavior such as administrative tasks during business hours.

  - **Track further actions post-attempt:** If logins are successful, check for subsequent actions in the logs (commands or connections made) to determine if there’s an escalation attempt. Validate against known unauthorized actions.

  ### Prioritization

  This alert should be considered high priority due to the presence of a common attack vector (Telnet) often used in initial access and subsequent malicious activities. The likelihood of abuse is significant because successful Telnet login attempts could lead to exploitation and further penetration into the network.

  ### Blind Spots and Assumptions

  Detection could be hindered by attackers using IP obfuscation techniques or proxy servers, potentially evading the logging capabilities of OpenCanary. The configuration of OpenCanary must ensure it captures all relevant logs for accurate detection. Legitimate activities may involve internal users or administrators connecting to a test or demo environment. Related detections to strengthen coverage could include monitoring for other remote access attempts, such as SSH or RDP logs.

