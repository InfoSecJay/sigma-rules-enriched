  ### Technical Context

  This Sigma rule detects NMAP XMAS scans targeting an OpenCanary instance. The behavior is characterized by probing a system with malformed packets, likely an attempt to discover open or closed ports, which can lead to further exploitation. The attacker objective is reconnaissance, specifically understanding the attack surface of a network or service. This aligns with the MITRE ATT&CK tactic **Reconnaissance** and technique **Network Service Scanning (T1046)**.

  The primary telemetry source is OpenCanary application logs, specifically looking for logtype 5004. If malicious, an XMAS scan may indicate preparatory steps for a future attack, exploiting identified vulnerabilities. Importantly, this detection does NOT confirm that any exploitation or compromise has occurred; it merely indicates probing activity.

  ### Investigation Steps

  - **Identify the specific log entries:** Review OpenCanary logs for entries with logtype 5004 indicating an NMAP XMAS scan. Look for packet headers with FIN, PSH, and URG flags set, signifying a potential scan.

  - **Assess the source IP addresses:** Cross-reference the source IPs against threat intelligence feeds or internal whitelists to determine if the scanning activity is correlated with known malicious actors or legitimate business needs.

  - **Review network activity:** Validate network traffic around the time of the alert using packet capture analysis or similar telemetry (e.g., Zeek logs). Look for sustained or unusual connection requests to multiple ports which would indicate probing behavior.

  - **Investigate context and timing of alerts:** Determine if legitimate scanning activities occur routinely in your environment, such as scheduled vulnerability assessments, based on historical data. Document the timing and nature of any corresponding noise.

  - **Check firewall and intrusion detection system (IDS) logs:** Look for related incidents in firewall logs or IDS alerts to see if there are multiple scanning attempts from the same source, which can indicate a more aggressive probing effort.

  ### Prioritization

  The alert severity is high due to the potential risk of reconnaissance activities leading to targeted attacks on critical infrastructure. The likelihood of malicious abuse is significant, as NMAP scans are widely used by attackers to identify vulnerabilities. Such scanning behaviors are commonly automated and often precede further exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include scenarios where traffic is encrypted or obscured, potentially evading detection by OpenCanary. Reliable detection relies on accurately configuring OpenCanary to log all relevant events. Legitimate activities, such as routine vulnerability scanning by security teams, may trigger alerts. A related detection to consider would be **unusual port access attempts** (e.g., Sysmon Event ID 3), which can enhance visibility into ongoing reconnaissance efforts.

