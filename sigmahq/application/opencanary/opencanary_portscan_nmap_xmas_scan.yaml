  ### Technical Context
  This detection rule identifies attempts to exploit OpenCanary nodes through NMAP XMAS scans, a technique employed to gather information about networked devices and services. NMAP, a popular network scanning tool, sends packets with the FIN, PSH, and URG flags set in the TCP header to probe for open ports and services on a target machine. The suspicious nature of XMAS scans lies in their stealthy approach, allowing attackers to evade detection mechanisms while gathering intelligence about potential targets, which may be a precursor to a more significant intrusion or attack.

  The likely attacker objectives include network reconnaissance, identification of vulnerable services, or mapping out network topology. It’s important to note that while this activity may originate from legitimate administrative tasks, its occurrence on an OpenCanary device, which is purposefully designed to lure attackers, raises alarms. Relevant MITRE ATT&CK tactics/techniques applicable to this rule include Discovery (TA0007) and Network Service Scanning (T1046).

  Primary data sources for this detection include OpenCanary application logs that specifically log network interaction events, particularly those associated with suspicious log types indicating potential probing or scanning activity.

  ### Investigation Steps
  - **Review OpenCanary Logs:** Examine the OpenCanary application logs for log type 5004 entries to determine the details of the detected XMAS scans, including source IP addresses and timestamps.
  - **Correlate with Network Traffic:** Use network traffic analysis tools (e.g., NDR) to correlate the originating IP addresses of the scans with other suspicious activities taking place in the environment, such as brute force attempts or lateral movement.
  - **Identify External Threat Actor Indicators:** Research the source IP addresses against threat intelligence sources to assess if they are known malicious actors or associated with risky behaviors, potentially indicating a targeted scan.
  - **Check for Follow-Up Actions:** Investigate any follow-up actions that may come from the IP addresses identified in the scan, such as connection attempts to other services or unusual data exfiltration attempts.

  ### Prioritization
  The severity of this alert is high due to the risk of network reconnaissance and potential exploitation of vulnerabilities in OpenCanary nodes, which may lead to larger compromises within the network. The likelihood is elevated in environments where these nodes are deployed for intentional deception.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage lies in the inability to capture scans if they are conducted by unauthenticated or non-logged sources, as they might not touch the OpenCanary application logs until a port response is given. The detection logic assumes that OpenCanary is configured correctly to catch all relevant scans; any misconfigurations could result in missed detections. It also requires that logging is enabled and appropriately configured in OpenCanary to capture the log events used in this detection rule.

