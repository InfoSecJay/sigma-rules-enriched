  ### Technical Context

  This rule detects NMAP XMAS scans targeting an OpenCanary node, which represent an attempt to discover open ports on a host using TCP flags that trigger responses from the service. The likely objective of this behavior could be reconnaissance conducted by an attacker to gather intelligence about the network and potential vulnerabilities. This falls under the MITRE ATT&CK tactic of Discovery, specifically technique T1046 (Network Service Scanning).

  The primary telemetry source is OpenCanary application logs, filtered specifically for log type 5004. If malicious, this behavior could lead to further exploitation if the attacker identifies vulnerabilities through the scanning process. This detection does NOT confirm that an exploit occurred or that the host is compromised; it merely indicates that a probing scan took place.

  ---

  ### Investigation Steps

  - **Review OpenCanary logs for log type 5004:** Look for entries indicating an NMAP XMAS scan. Analyze the source IP and the specific ports targeted. Understand if multiple ports were scanned, as this may indicate a more thorough reconnaissance attempt.

  - **Correlate with firewall logs:** Check corresponding entries in the firewall logs (e.g., Security Event ID 5156). Look for matching source IPs and note if any unusual outbound connections occurred after the scanning.

  - **Identify legitimate network activity:** Examine normal operations on the OpenCanary node, such as expected service responses or scheduled vulnerability scans. Legitimate scans may originate from internal IP ranges rather than external sources.

  - **Analyze the threat actor's IP reputation:** Use threat intelligence platforms to assess the reputation of the source IPs associated with the NMAP scans. High-risk IPs should be considered suspicious and warrant further investigation concerning the incident.

  - **Monitor for additional scanning activity:** Keep track of subsequent logs indicating lateral movement, such as multiple scans from varied IPs or repeat scans from the original source, which may indicate ongoing reconnaissance or follow-up attacks.

  ---

  ### Prioritization

  This alert should be categorized as high severity due to the potential impact on network security. Scanning tools like NMAP are frequently weaponized for reconnaissance in the early stages of an attack. The likelihood of malicious abuse is significant, as identifying open ports can lead to exploitation attempts against any vulnerable services.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the API's configuration; if logging is not properly enabled, scans may go undetected. Legitimate vulnerability assessments or security scans from trusted vendors may trigger this alert unintentionally. A companion detection to consider is monitoring for exploit attempts following a reconnaissance scan, providing insight into potential follow-up actions taken by adversaries.

