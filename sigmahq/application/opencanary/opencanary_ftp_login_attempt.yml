  ### Technical Context

  This rule detects unauthorized login attempts to an FTP service running on an OpenCanary honeypot. The likely attacker objective is credential probing or exploitation, which seeks to gain unauthorized access to systems by testing known credentials or brute-forcing access. This activity falls under the MITRE ATT&CK tactic of Initial Access (TA0001) and specifically the technique of Valid Accounts (T1078). The primary telemetry sources are logs generated by the OpenCanary application, specifically entries of log type 2000.

  If malicious, successful exploitation could lead to unauthorized data access and lateral movement within the network. It is important to note that this detection does not confirm that the attacker successfully gained access to the FTP service; it simply indicates an unauthorized login attempt.

  ---

  ### Investigation Steps

  - **Review FTP login attempt details:** Check the OpenCanary logs for log type 2000, focusing on fields like `username`, `password`, `timestamp`, and `source IP`. Note patterns of commonly abused usernames (e.g., "admin", "root"). If this username appears frequently in unrelated logs, it might suggest automated probing.

  - **Verify source IP reputation:** Query threat intelligence sources for the originating IP addresses of login attempts. Known malicious IPs should be flagged as high-risk. Consider that IP addresses from known data centers may represent benign traffic if expected.

  - **Analyze failed and success rate of login attempts:** Look at the ratio of failed login attempts to success within the OpenCanary FTP logs. A high number of failures leading to a single success could indicate potential malicious activity rather than legitimate user behavior.

  - **Correlate with other systems:** Investigate if the same source IP has targeted other network services or systems. Cross-reference logs from additional honeypots or production systems using Security Event ID 4625 (Windows failed logons) or relevant Linux system logs to identify patterns.

  - **Identify legitimate FTP activity:** Confirm whether FTP services are expected on the OpenCanary node, including regular authorized user access. Validate against documented operational procedures for FTP access to avoid false positives.

  - **Examine the duration and frequency of attempts:** Review timestamps in the OpenCanary logs to check how consistently login attempts occur over time. Repeated attempts in a short timeframe may indicate an automated threat actor as opposed to legitimate user behavior.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact of a successful breach through FTP access on enterprise data. The likelihood of malicious abuse is high, especially given the prevalence of FTP protocol vulnerabilities. Moreover, this type of behavior is commonly exploited by adversaries during the initial access phase of an attack.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques such as using legitimate user credentials or IP spoofing to bypass honeypot alerts. Proper log source configuration must be ensured for OpenCanary to capture all relevant login attempts accurately. Legitimate activities like routine credential testing by authorized users may trigger this alert, particularly in assessment scenarios. A related detection could involve monitoring data exfiltration attempts through FTP sessions (T1041), which would strengthen overall detection capabilities.

