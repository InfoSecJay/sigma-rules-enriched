  ### Technical Context

  This Sigma rule detects login attempts to an FTP service running on an OpenCanary node. The attacker’s objective may include probing for accessible services, attempting unauthorized access, or gathering information about the FTP service. This behavior aligns with the MITRE ATT&CK tactic for Initial Access (TA0001) and the techniques for Application Layer Protocol Abuse (T1190) and Remote Services (T1021). The primary telemetry source is OpenCanary’s application logs, specifically logs indicating access attempts (logtype: 2000). If malicious, it poses a threat as it may signal an attempt to exploit the FTP service for further access or data exfiltration. Importantly, this detection does not confirm successful login or exploitation; it only indicates attempted access.

  ### Investigation Steps

  - **Review FTP login attempts:** Check OpenCanary logs for entries indicating failed or successful FTP login attempts (logtype: 2000). Note the timestamp, source IP, and username to assess if they align with expected behavior.

  - **Identify known-good users:** Validate that login attempts are made by legitimate users or from expected IP ranges, looking for anomalies. Legitimate users should access the FTP service according to predetermined schedules without unusual or brute-force behaviors.

  - **Check for repetitive attempts:** Investigate logs for patterns of multiple failed attempts in a short timeframe. Persistent multiple login attempts, especially from the same IP, may indicate malicious brute-force tactics.

  - **Correlate with threat intelligence:** Look for matches between the source IP of the login attempts and known malicious indicators in threat intelligence feeds. High-confidence malicious IPs may have a history of FTP exploitation.

  - **Assess OpenCanary status:** Confirm that OpenCanary is operational and configured correctly. Unauthorized or unusually frequent access could indicate probing or attempts to compromise the node.

  - **Monitor network ingress/egress:** Look for unusual data transfers or uploads following login attempts, indicating potential data exfiltration via FTP. This includes analyzing outbound connections from the OpenCanary node and verifying file transfer logs.

  ### Prioritization

  This alert is of high severity due to its potential impact on exposed systems. FTP services are often targeted by attackers to gain unauthorized access, making this behavior a clear indicator of possible malicious activity. Such attempts are commonly associated with exploitation campaigns, emphasizing the need for prompt investigation.

  ### Blind Spots and Assumptions

  This detection may miss logged-out sessions if the attacker utilizes legitimate credentials after multiple failed attempts. Additionally, OpenCanary’s logs must be configured to capture all relevant events; gaps in logging may reduce detection efficacy. Legitimate automated processes or scripts could trigger this alert, especially if misconfigured. A companion detection of unusual data transfer patterns following an FTP login attempt can enhance overall security posture by identifying possible exploitation events.

