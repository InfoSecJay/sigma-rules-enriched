  ### Technical Context
  This rule detects login attempts to an FTP service on an OpenCanary node, which is a type of honeypot designed to detect unauthorized access attempts. Attackers may target FTP services to exfiltrate sensitive data, deploy malware, or create persistence within a network. By analyzing attempts to connect to the FTP service, defenders can gain insights into potential reconnaissance, credential stuffing, or exploitation of weak configurations.

  The relevant MITRE ATT&CK tactics and techniques applicable here include:
  - **Initial Access (TA0001)** - Potentially indicates attempts by attackers to gain unauthorized access.
  - **Credential Access (TA0006)** - Relates to attempts made to acquire valid credentials through brute force or other means.
  - **Exfiltration (TA0010)** - Could signify efforts to extract data from the network unintentionally scanned by the honeypot.
  - **T1190: Exploit Public-Facing Application** - Reflects attempts made to exploit known vulnerabilities in publicly exposed services.

  Primary data sources relevant for corroborating this activity include logs generated by the OpenCanary application, particularly focusing on the login events for its FTP service. Additional investigation may also include analyzing inbound connection logs, firewall logs, and any associated network traffic that indicates unusual behavior.

  ### Investigation Steps
  - **Review OpenCanary Logs**: Analyze the OpenCanary application logs for entries related to the detected FTP login attempts, noting any anomalous IP addresses and timestamps associated with these attempts.
  - **Correlate with Network Traffic**: Check network flow logs to identify the source of the connection attempts and any patterns associated with the traffic, such as repeated attempts from the same IP.
  - **Inspect FTP Access Patterns**: Look for patterns or trends among the login attempts, such as a spike in activity or access attempts from unusual geographic locations.
  - **Examine Associated Security Events**: Cross-reference with other security alerts or logs (e.g., firewall logs or IDS alerts) to see if there are related or prior suspicious activities that can provide context about the current attempts.

  ### Prioritization
  This alert is deemed high severity due to the potential for the FTP service to be compromised or abused, which could lead to significant data breaches or lateral movement within the network. The frequency of these attacks and their impact underscores the urgency of timely investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the OpenCanary service is misconfigured or not actively monitored, as the effectiveness relies on proper log generation. The detection logic assumes that the FTP service is correctly set up and that login attempts can be accurately logged by OpenCanary. Additionally, if network monitoring is insufficient, legitimate traffic may go undetected. Required configurations include enabling detailed logging within OpenCanary and ensuring that inbound access to the honed service is properly routed to maximize detection effectiveness.

