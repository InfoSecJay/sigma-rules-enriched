  ### Technical Context

  This Sigma rule detects OID (Object Identifier) requests made to an SNMP (Simple Network Management Protocol) service on an OpenCanary node. The behavior signifies potential reconnaissance by an adversary probing for sensitive information on networked devices, potentially to identify exploitable services or configurations. This type of activity maps to the MITRE ATT&CK Tactic of Discovery (T1083) and Lateral Movement (T1021), specifically targeting network information gathering.

  Primary telemetry sources include logs from OpenCanary, specifically log type 13001, which captures SNMP requests and related actions. If an SNMP service is misconfigured or actively monitored for malicious access, the impact could enable an adversary to gain unauthorized access or perform lateral movement within the targeted environment. Importantly, this detection does not confirm malicious intent on its own, as OID requests could be part of legitimate network management activities in certain contexts.

  ### Investigation Steps

  - **Review OID request details:**
     Examine the log data in OpenCanary (log type 13001) to identify the specific OID requested and the source IP address. Analyze whether the OID corresponds to known benign entries used in typical network monitoring or if it indicates suspicious inquiry into sensitive components.

  - **Check frequency and patterns of requests:**
     Observe the frequency of requests from the same IP address over a designated time frame. Frequent or automated OID requests may indicate reconnaissance behavior, while occasional requests may be legitimate.

  - **Identify the requesting IP's reputation:**
     Perform a reputation check on the source IP address. Consult threat intelligence platforms to determine if this IP has previously been linked to malicious activity. A known malicious IP could be a high-confidence indicator of potential threat.

  - **Contextualize against your environment:**
     Determine if the source IP belongs to known or legitimate administrative systems within your organization. If this activity is observed from expected sources, it may lean toward benign behavior.

  - **Monitor for additional malicious indicators:**
     Look for subsequent events following the OID request within related logs, such as unauthorized configuration changes or failed access attempts in the device logs. Connections that follow immediately after an OID request could indicate exploitation attempts.

  ### Prioritization

  The alert's severity is high due to the potential impact on critical systems, particularly if attackers use this information for further exploitation. The likelihood of malicious abuse is notable, as SNMP vulnerabilities are often exploited during the reconnaissance phase of attacks. Additionally, this behavior is frequently associated with lateral movement and system compromise in more extensive network intrusions.

  ### Blind Spots and Assumptions

  Limitations include the potential for evasion if the attacker employs stealthy tactics or if legitimate management traffic generates similar logs. Ensuring OpenCanary is properly configured and integrated into all relevant network segments is essential for reliable detection. Legitimate activity, such as internal audits or network monitoring, may trigger this alert. A related detection to strengthen coverage would be monitoring for login attempts or service access following SNMP inquiries, which could indicate a progression from reconnaissance to active exploitation.

