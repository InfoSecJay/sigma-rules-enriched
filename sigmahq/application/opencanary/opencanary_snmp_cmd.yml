  ### Technical Context
  This detection rule identifies instances where an SNMP (Simple Network Management Protocol) service on an OpenCanary node receives an object identifier (OID) request. OID requests can indicate reconnaissance activity as attackers often use SNMP to gather information about networked devices, services, and configurations within an environment. In particular, unauthorized OID requests may reflect an attempt to map or probe the network to identify viable targets for further exploitation or lateral movement.

  The primary threat scenario involves an attacker leveraging SNMP to glean sensitive information about the network infrastructure and connected devices, which could then facilitate more significant attacks such as privilege escalation or lateral movement within the network. Relevant MITRE ATT&CK tactics include *Discovery* (TA0007) and *Lateral Movement* (TA0008), with techniques specifically identified as *Network Service Discovery* (T1016) and *Remote Services* (T1021).

  The best logs for evidence will be derived from OpenCanary logs, specifically application logs that capture SNMP service interactions, including requests and responses.

  ### Investigation Steps
  - **Analyze OpenCanary Logs:** Review application logs from OpenCanary, specifically focusing on SNMP transaction logs. Look for patterns or repeated OID requests from unexpected sources.
  - **Correlate Network Activity:** Check network traffic logs for unusual SNMP traffic patterns. Identify any external IPs making requests, and assess their reputation and previous behavior within the network.
  - **Review SNMP Configuration:** Examine SNMP configurations on your OpenCanary nodes to ensure they are secured against unauthorized access. Validate community strings and access permissions.
  - **Assess Impact on Environment:** Determine whether any sensitive information was exposed through the SNMP service and review the security posture around devices that might have been queried.

  ### Prioritization
  The alert has been rated as high severity due to the potential for attackers to collect sensitive information through SNMP, leading to greater risks of unauthorized access, exploitation, or data compromise within the network.

  ### Blind Spots and Assumptions
  This detection rule may not capture all malicious SNMP interactions, particularly if an attacker is using obfuscation techniques or targeting devices outside of the OpenCanary nodes. It assumes that the OpenCanary service is appropriately configured and actively monitoring for SNMP requests. Additionally, this rule relies on having relevant application logs enabled and accessible, which may require specific configurations to ensure complete visibility of SNMP activities within the monitored environment.

