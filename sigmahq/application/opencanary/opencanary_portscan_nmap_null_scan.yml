  ### Technical Context

  This rule detects instances where an OpenCanary node has been targeted by a NMAP NULL Scan, a stealthy network reconnaissance technique often employed by attackers to gather information about target systems while evading detection mechanisms. The likely attacker objective is to identify open ports on a network device without triggering alerts that may occur from more verbose scanning methods. This behavior falls under the MITRE ATT&CK tactic of "Discovery" (ID: T1046), specifically the technique of "Network Service Scanning" (ID: T1046).

  The primary telemetry source for this detection is the OpenCanary application log, specifically log type 5003, which indicates an attempted network scan against the OpenCanary node. If the behavior is malicious, it can indicate that an adversary is preparing the environment for further exploitation or gaining intelligence on the network. It is important to note that this detection does NOT confirm successful exploitation or compromise of any systems on its own.

  ### Investigation Steps

  - **Review OpenCanary logs for NMAP NULL Scans:** Check the OpenCanary log (Log Type: 5003) for entries indicating a NULL scan, specifically looking for the presence of TCP packets with no flags set. Ensure to check the `source_ip`, `destination_port`, and `event_timestamp` fields for anomalous activity.

  - **Identify the source of the scan:** Cross-reference the `source_ip` from the NMAP NULL Scan log with threat intelligence databases (e.g., projecthoneypot.org) to establish if the originating IP is associated with known malicious activity.

  - **Examine recent changes in network traffic patterns:** Review network flow logs (e.g., NetFlow logs) for spikes in TCP SYN packets and SYN-ACK responses that coincide with the timing of the NULL scan, indicating potential malicious scanning behavior.

  - **Determine legitimate use cases for OpenCanary:** Verify whether the targeted OpenCanary node is used for legitimate purposes, such as research or training activities, which may account for benign scans. Look at the `hostname` and any associated user activity around the scan time.

  - **Monitor for follow-up scanning or exploitation attempts:** Investigate if there are subsequent logs indicating further scanning (e.g., a series of SYN packets) or actual exploit attempts, such as any alert from intrusion detection systems (IDS) that may indicate further reconnaissance or exploitation corresponding to the NULL scan log.

  ### Prioritization

  Given that this alert is generated from an OpenCanary node used to deceive reconnaissance attempts, the alert is of high severity due to the potential for malicious actors to gather intelligence for future attacks. The likelihood of abuse is significant as the NULL scan is a prevalent technique in adversary toolkits for stealthy discovery, and the behavior is commonly weaponized as part of the initial access phase.

  ### Blind Spots and Assumptions

  Detection limitations may occur if the OpenCanary deployment settings are misconfigured or if log retention does not effectively capture the activity. Legitimate activities, such as benign network troubleshooting by internal teams or automated testing tools, might inadvertently trigger the alert. Moreover, related detections may include alerts for other types of scans (e.g., SYN scans, performed by the same or different scanning tools) which would complement the monitoring of reconnaissance activities on the network.

