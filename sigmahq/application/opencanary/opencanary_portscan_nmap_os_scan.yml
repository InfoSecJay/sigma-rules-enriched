  ### Technical Context

  This Sigma rule detects when an OpenCanary node is targeted by an NMAP OS scan, indicating reconnaissance activity by a potential adversary. The attacker likely seeks to gather details about the operating system and services running on the target network to identify vulnerabilities for later exploitation. This behavior fits within the MITRE ATT&CK framework under the tactic of Discovery (TA0007), specifically the technique of Network Service Scanning (T1046).

  The primary telemetry source is the OpenCanary application, specifically log type 5002, which records instances of service interactions including scanning attempts. If this activity is malicious, it may facilitate further attacks by exposing potential vulnerabilities. It is crucial to note that this detection does NOT confirm a successful breach or exploitation, merely an attempt at reconnaissance.

  ### Investigation Steps

  - **Review OpenCanary logs:** Check for Event ID 5002 in the OpenCanary logs, specifically searching for entries that indicate an NMAP OS scan targeting your environment. Look for patterns that suggest high-frequency probing on network service ports.

  - **Correlate with other data sources:** Cross-reference the OpenCanary detection with firewall logs (like Cisco ASA, Event ID 106023) to see if the suspected IP matches any known malicious addresses or exhibits unusual traffic patterns.

  - **Identify legitimate scanning activity:** Note typical legitimate scanning tools used in your environment (e.g., internal security audits), ensuring they are associated with known internal IPs and scheduled operations. This includes IP addresses of network monitoring tools that scan commonly during maintenance windows.

  - **Examine the originating IP:** Investigate the source of the scan. Identify whether it belongs to an external threat actor (check for geolocation or blacklist status) or if it is an internal, approved testing operation, which would show varying destination ports and protocol usage.

  - **Assess service exposure and risks:** Evaluate the services and ports being scanned and determine their criticality. Ports with sensitive applications (like SSH or RDP) exposed could amplify risk if an attacker moves to exploit them after reconnaissance.

  ### Prioritization

  The alert severity is high due to the potential impact on systems exposed to unauthorized probing. The likelihood of malicious abuse is significant, as NMAP is frequently weaponized for reconnaissance during cyberattacks. Additionally, the nature of this behavior indicates technical sophistication on the part of the potential adversary.

  ### Blind Spots and Assumptions

  Detection may be limited by network configurations that do not adequately log incoming requests. Legitimate activities, such as network performance monitoring or internal audits, may trigger this alert, complicating investigations. Companion detections, like failed login attempts on critical services from newly identified public IPs, can strengthen coverage against potential threats following reconnaissance efforts.

