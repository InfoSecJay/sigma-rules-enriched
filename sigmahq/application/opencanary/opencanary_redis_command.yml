  ### Technical Context

  This rule detects unauthorized action command attempts against a REDIS service running on an OpenCanary honeypot. The likely attacker objective is to exploit the REDIS service, either to collect credentials or execute commands that may lead to further network compromise. This activity aligns with MITRE ATT&CK tactics for Credential Access (TA0006) and Collection (TA0009) under techniques T1003 (Credential Dumping) and T1213 (Data from Information Repositories).

  The primary telemetry sources are OpenCanary application logs, specifically looking for log type 17001. The security impact could be significant as successful exploitation may lead to unauthorized access to sensitive data. Importantly, this detection does NOT confirm a successful command execution or compromise; it only indicates an attempted action command.

  ---

  ### Investigation Steps

  - **Review OpenCanary logs for event type 17001**: Search for log entries related to REDIS commands. Look for suspicious commands (e.g., `CONFIG GET`, `KEYS`, or any potentially harmful command).

  - **Identify malicious command patterns**: Cross-reference the attempted action commands against known malicious REDIS command signatures. An attempt to execute commands such as `FLUSHALL` or `CONFIG` might indicate a malicious intent.

  - **Validate legitimate usage**: Check for internal processes or applications historically interacting with the REDIS service. Ensure expected command patterns align with known application behaviors rather than atypical command requests.

  - **Determine source IP addresses of attempts**: Analyze the logs for unique source IPs initiating commands from non-trusted networks. Identify any known malicious IPs that might trigger the alert to prioritize further scrutiny.

  - **Assess the impact on asset criticality**: Identify the role of the affected OpenCanary node. OpenCanary typically simulates services; however, understanding its deployment context can provide insights on whether a breach may expose additional operational data.

  ---

  ### Prioritization

  This alert warrants high priority due to the potential for credential theft and data collection from manipulated REDIS environments. Given its critical role in simulating and detecting attack methodology, the likelihood of exploitation for nefarious purposes is elevated, as such service breaches are often weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the capability of OpenCanary's logging configuration, as not all attacks may generate clear command logs. Additionally, legitimate usage patterns, like automated testing or misconfiguration attempts, might trigger false positives. Companions for stronger coverage include monitoring for external access attempts against the host or command anomalies via additional log types.

