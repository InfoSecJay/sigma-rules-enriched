  ### Technical Context

  This rule detects attempted action commands on a REDIS service running on an OpenCanary deployed node. This behavior may indicate an attacker attempting to exploit the REDIS server to gain unauthorized access to data or perform credential access operations. The likely attacker objective is to collect sensitive information stored within the REDIS data store or manipulate its content. Relevant MITRE ATT&CK tactics include Credential Access (TA0006) and Collection (TA0009), specifically techniques T1003 (Credential Dumping) and T1213 (Data from Information Repositories).

  The primary telemetry source is OpenCanary logs, specifically the log type identified as 17001, which corresponds to REDIS action command attempts. If the detected behavior is malicious, it could result in unauthorized access to sensitive data or service disruption. It is important to note that this detection does NOT confirm successful exploitation or data exfiltration on its own.

  ### Investigation Steps

  - **Review OpenCanary REDIS Logs:** Examine logs categorized under log type 17001 for suspicious command attempts. Look for commands such as `MONITOR`, `CONFIG`, or unauthorized read/write operations indicating potential malicious activity.

  - **Identify High-Confidence Malicious Indicators:** Check for attempts to execute commands that are not part of normal operations. For example, unexpected execution of `FLUSHALL` or `FLUSHDB` commands can indicate malicious intent to clear data.

  - **Analyze Legitimate User Activity:** Compare the command attempts with legitimate behavior. Typical REDIS usage includes commands like `GET` and `SET` for expected application functionality, while excessive commands or unusual patterns may indicate a threat.

  - **Correlate with Additional Security Events:** Cross-reference the REDIS action command attempts with other logs, such as authentication logs (Event ID 4624 for successful logins), to verify if the command originated from an authorized user or IP address.

  - **Check OpenCanary Configuration:** Validate the deployed OpenCanary configurations to ensure REDIS is suitably isolated and monitor configurations follow best practices. This reduces the risk of exploitation.

  - **Validate Persistence and Impact:** If malicious activity is confirmed, validate potential persistence by checking for any associated files or ongoing connections. Review for external communications or logs indicating data exfiltration.

  ### Prioritization

  This alert is high severity due to the potential impact on sensitive data stored in the REDIS service, coupled with the likelihood of exploitation. REDIS is a common target for attackers seeking to compromise credentials and manipulate data, making such behavior for this service particularly indicative of malicious intent.

  ### Blind Spots and Assumptions

  Detection limitations may arise if log aggregation is improperly configured or if OpenCanary logs are lost due to log rotation. Legitimate activities, such as internal applications using REDIS for caching, may generate similar command attempts and could lead to false positives. A related detection to strengthen coverage includes monitoring for unauthorized connections to REDIS services, which could indicate an ongoing attack or probing activity.

