  ### Technical Context

  This Sigma rule detects connection attempts to a VNC service configured on an OpenCanary node, which is a honeypot designed to identify unauthorized access attempts to a workspace. The likely attacker objective is to establish a remote session for reconnaissance or lateral movement within an environment, potentially enabling more extensive network exploitation. This behavior aligns with the MITRE ATT&CK technique for Lateral Movement (T1021).

  Primary telemetry sources are application logs from OpenCanary, specifically targeted by log type 12001. If malicious, this activity could indicate an attempted breach where attackers are probing for accessible VNC services, which could lead to unauthorized data access or further lateral movement within the enterprise network. Importantly, this detection does NOT confirm that a successful connection or compromise has occurred; it merely indicates an attempted connection to the service.

  ---

  ### Investigation Steps

  - **Check connection timestamps:** Review OpenCanary logs (log type 12001) to identify the exact timestamps of the connection attempts. Compare the timing with known legitimate access patterns to catch anomalies.

  - **Analyze source IP address:** Investigate the IP address attempting the connection using threat intelligence platforms. Check against reputation databases to determine if the source is associated with known malicious activity.

  - **Review the context of the OpenCanary service:** Validate if the VNC service was intentionally enabled for legitimate monitoring purposes. Ensure that the asset should be exposed to the network and consider the role of the host.

  - **Verify failed or successful connections:** Look for indicators of further activity following the VNC connection attempt in the OpenCanary logs, such as additional connection attempts or any hybrid activity patterns that resemble exploit tactics.

  - **Identify high-confidence malicious indicators:** Investigate if the source IP has a history of connection attempts to other honeypots or VNC services, indicating attacker reconnaissance behavior. Consider any connections with enumerated credentials or non-standard protocols.

  - **Confirm legitimate activity patterns:** Refer to past connection logs to ascertain typical, routine access patterns. For example, legitimate internal users may periodically access an internal VNC system, marked by consistent timestamps and IP addresses from internal ranges.

  ---

  ### Prioritization

  The alert severity is high due to the potential impact of unauthorized access through the VNC service. Given that VNC is commonly exploited for remote access by adversaries, the likelihood of malicious abuse is also elevated if the source is unrecognized or contains known threat indicators.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion tactics like IP spoofing or using legitimate administrative credentials to access VNC services without triggering alerts. Reliable detection requires proper configuration of OpenCanary to log all connection attempts accurately. Legitimate activities that may trigger this alert could include internal administrators performing maintenance or support. A related detection to strengthen coverage includes monitoring for unusual outbound connections to remote services from the host where OpenCanary is configured.

