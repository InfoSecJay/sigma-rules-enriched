note: |
  ### Technical Context

  This Sigma rule detects unauthorized login attempts through HTTP POST requests on an OpenCanary node, which simulates vulnerable services to attract malicious actors. The likely objective of an attacker triggering this behavior is to gain unauthorized access to system resources or to enumerate valid credentials. This activity maps to the MITRE ATT&CK tactic **Initial Access** and technique **Application Layer Protocol** (T1190).

  The primary telemetry source is the OpenCanary application logs, specifically looking for log type 3001. If the detected login attempts are malicious, the impact could be significant, potentially compromising the system and leading to further attacks. It’s crucial to note that this detection does NOT confirm a successful login—only the attempt itself.

  ### Investigation Steps

  - **Identify event details:** Review the OpenCanary logs for occurrences of log type 3001, specifically noting the `request_url`, `http_method`, and `payload`. Malicious indicators may include POST requests targeting uncommon endpoints not associated with legitimate service operations.

  - **Analyze the source IP:** Cross-reference the source IP address of the login attempt with threat intelligence feeds to determine if it is associated with known malicious actors or anomalous behavior.

  - **Check for expected behavior:** Validate the normal functioning of your OpenCanary setup. Legitimate users may access specific POST login forms; correlate this against expected patterns to confirm benign activity.

  - **Inspect user-agent strings:** Review the `user_agent` field from the logs. Legitimate services typically use known user agents that align with standard application deployments, while suspicious user agents may suggest automated or scripted attempts.

  - **Correlate timeframes with other alerts:** Examine if the login attempts coincide with other suspicious activities, such as unusual network traffic or unauthorized access attempts, to strengthen the context around the incident.

  - **Document repeat attempts:** Note any repeat attempts from the same IP or account within a short timeframe. Multiple attempts can indicate brute-force attacking behavior, which is a high-confidence malicious indicator.

  ### Prioritization

  This alert is of high severity due to the potential access that unauthorized login attempts could provide to attackers. The impact is notable if critical systems are involved, and such behavior is frequently seen in initial access phases, making it a plausible vector for exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers using valid credentials or spoofing legitimate traffic patterns. Ensure that OpenCanary configuration is correctly set up to log all necessary events to capture these login attempts effectively. Additionally, legitimate automated processes may inadvertently trigger this alert, such as maintenance scripts that use HTTP login. Consider companion detections like unusual outbound traffic from the affected host to further clarify the incident context.

