note: |
  ### Technical Context
  This detection rule identifies instances of unauthorized login attempts via HTTP POST requests on services configured within OpenCanary. OpenCanary acts as a honeypot that simulates real services to attract and log malicious traffic. When attackers target these services, their attempts can reveal their tactics and intentions, thus providing valuable insights into potential vulnerabilities within the network.

  The primary threat scenario involves attackers testing exposed services for valid credentials, which may indicate an attempt to gain unauthorized access to the network. Their likely objectives could include unauthorized data access, lateral movement within the organization, or deploying additional malicious payloads. This behavior is aligned with the MITRE ATT&CK framework's "Initial Access" tactic (TA0001), specifically the "Exploitation of Public-Facing Application" technique (T1190).

  The primary data sources for this detection include application logs from OpenCanary, specifically focusing on HTTP request logs that detail POST actions targeting login forms. Analysts should look for patterns that deviate from normal user behavior, such as repeated failed attempts or consistently targeting specific endpoints.

  ### Investigation Steps
  - **Review OpenCanary Logs:** Analyze the OpenCanary application logs to identify the source IP addresses, user agents, and any payload data submitted during the HTTP POST login attempts.
  - **Correlate with Network Traffic:** Check the network traffic logs (from NDR/IDS tools) for additional context surrounding the detected HTTP POST requests, such as any unusual spikes in traffic or connections from known malicious IPs.
  - **Analyze Failed Attempts:** Investigate the frequency and patterns of failed login attempts. Consider whether the same source is making multiple attempts and if there are any patterns that suggest automated tools are being used.
  - **Check for Vulnerabilities:** Determine if the targeted services have known vulnerabilities that could be exploited. This may involve reviewing CVEs associated with the applications being simulated on the OpenCanary instance.

  ### Prioritization
  This alert should be treated with high priority due to the potential for initial access that could lead to broader network compromise. The likelihood of an attacker successfully leveraging this method becomes critical if there are exposed services within the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if OpenCanary services are not widely deployed or if the configuration does not properly log all relevant HTTP attempts. The detection logic assumes that malicious actors will use HTTP POST methods to attempt logins, potentially overlooking other methods of exploitation or access. It is essential to ensure that the OpenCanary is correctly configured to log all relevant events and that the logging level captures the necessary detail for effective analysis.

