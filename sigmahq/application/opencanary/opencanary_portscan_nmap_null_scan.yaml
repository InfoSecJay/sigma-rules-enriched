  ### Technical Context
  This rule detects instances where an OpenCanary node has been targeted by a NMAP NULL scan. A NULL scan is a stealth technique used by attackers to map open ports on a target system without establishing a full TCP connection. Attackers may employ this method to identify active services on a network, which can serve as a precursor to more invasive attacks, such as exploiting vulnerabilities or gaining unauthorized access. The threat scenario indicates a restructuring of reconnaissance tactics, allowing adversaries to gather information while minimizing the chance of detection.

  The relevant MITRE ATT&CK tactics for this rule are **Reconnaissance** (TA0043) and the associated technique of **Network Service Scanning** (T1046). The detection is primarily based on logs generated by the OpenCanary application, which emulates various services, thereby allowing the identification of unauthorized scans aimed at discovering those services.

  Primary data sources for effective detection include:
  - OpenCanary application logs, specifically those capturing network interactions (logtype: 5003).
  - Network traffic logs may complement insights from OpenCanary to corroborate network behavior around the detected scan events.

  ### Investigation Steps
  - **Review OpenCanary Logs:** Examine recent logs (logtype: 5003) from the OpenCanary instance to identify timestamps and source IPs involved in the NULL scans. Correlate these details with other logs for further context.

  - **Conduct IP Reputation Checks:** Investigate the source IP addresses detected in the scans. Utilize threat intelligence feeds to check for any associated malicious activity or known threat actors.

  - **Analyze Network Traffic:** Utilize NDR logs to monitor any related traffic patterns around the time of the NULL scan alerts. Look for other reconnaissance activities or connections to unused ports that might indicate additional information gathering efforts.

  - **Cross-reference with Other Security Logs:** Check SIEM and firewall logs for any corresponding anomalies, such as spikes in traffic, failed connection attempts, or alerts that may indicate further attempts to probe network defenses.

  ### Prioritization
  This alert is classified as high severity due to the direct threat reconnaissance poses in an enterprise environment. If left unaddressed, it can lead to more severe attacks that exploit the identified vulnerabilities, thereby compromising network integrity and confidentiality.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on OpenCanary being properly configured and actively monitoring the relevant services. If an attacker successfully targets systems that do not pass through the OpenCanary node, those scans would go undetected. Additionally, the detection logic assumes that NULL scans are the primary reconnaissance method being employed, which may not always be the case. Properly configured logging and monitoring on the OpenCanary application are essential for this alert to function effectively, including ensuring that logtype 5003 is correctly set up and retained for analysis.

