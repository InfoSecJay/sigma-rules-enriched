  ### Technical Context

  This rule detects instances where an OpenCanary node has been targeted by an NMAP NULL scan, which is a type of network reconnaissance typically used by attackers to identify open ports on a target system without revealing their own presence. The likely attacker objective is to gather information on running services, which could facilitate further exploitation. This activity falls under the MITRE ATT&CK tactic of "Discovery" (TA0007) and specifically the technique "Network Service Scanning" (T1046).

  The primary telemetry source for this detection comes from OpenCanary logs, specifically log entries with logtype 5003. If malicious, the security impact could include the potential for further network penetration or exploitation of discovered services. Importantly, this detection does NOT confirm that the entire attack lifecycle has been undertaken; it only indicates an initial reconnaissance step.

  ### Investigation Steps

  - **Validate the source of the alert:** Identify the specific OpenCanary node that logged the event. Check the log entries using the OpenCanary's log files for `logtype: 5003` to confirm the occurrence of the NULL scan.

  - **Analyze the network activity:** Review network logs to identify the source IP address of the NULL scan. Cross-reference this with threat intelligence to ascertain if it is known for malicious activity.

  - **Check for additional indicators of compromise:** Look for potential lateral movement or exploitation attempts following the NULL scan by analyzing subsequent logs for unusual API calls or connections to the compromised service.

  - **Identify legitimate behavior:** Assess the context of legitimate network scanning activities, such as scheduled network audits, by checking any corresponding documentation or scheduling tools in use (if available).

  - **Correlate with other security events:** Look for any correlating security events that may indicate further exploitation, such as successful logins or established connections to high-value assets after the NULL scan.

  ### Prioritization

  Given that OpenCanary is deployed to detect potential intrusions, any alert related to a NULL scan should be considered high severity. This is due to the potential for malicious abuse in identifying exploitable services, which is a common precursor to exploitation attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where the logging is not properly configured, or where scans are conducted from trusted internal IP addresses during normal operations. Some legitimate activities, such as system administrators performing security assessments, may also trigger this alert. For improved coverage, consider implementing additional detection for known tools associated with port scanning, such as proactive alerts for NMAP usage across the network.

