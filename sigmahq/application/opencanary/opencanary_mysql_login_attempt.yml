  ### Technical Context

  This rule detects unauthorized login attempts to a MySQL service hosted on an OpenCanary node, a decoy set up to lure attackers. The likely attacker objective is credential theft or reconnaissance under the guise of accessing a common database service. This behavior corresponds with the MITRE ATT&CK technique T1003 (Credential Dumping) and T1213 (Information Gathering). The primary telemetry source is OpenCanary application logs, specifically the log type related to service interactions (logtype: 8001). If the login attempts are confirmed malicious, there’s a significant risk of credential theft, which could lead to broader network compromise. However, this detection alone does not confirm that a breach has occurred or that the attacker succeeded in obtaining valid credentials.

  ---

  ### Investigation Steps

  - **Review the login details:** Check OpenCanary logs for failed login attempts using logtype 8001. Look for unusual user accounts or repeated attempts from the same source IP, which could indicate malicious behavior.

  - **Verify asset role:** Determine if the system running OpenCanary is intended to host MySQL services. Its misconfiguration could lead to false positives.

  - **Analyze source IP reputation:** Lookup the originating IP address in threat intelligence platforms to identify if it’s linked to known malicious activity. Malicious actors often use VPNs or compromised hosts to obscure their location.

  - **Identify legitimate MySQL services:** Understand operational hours of your actual MySQL services. If there are no legitimate operational reasons for the login attempts at the reported times, this could indicate an unauthorized probing activity.

  - **Look for credential sharing or copying:** Cross-reference the login attempts against known user access records to see if there’s a pattern indicating credential theft or sharing.

  - **Correlate with other detections:** Check for additional indicators of compromise across your network, specifically events related to credential dumping (T1003) or reconnaissance actions (T1213) that may align with the timeframe of the detected login attempts.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact if the OpenCanary node is exploited for credential theft, which could lead to further lateral movement within secure areas of the enterprise. The likelihood of malicious abuse is elevated, as targeting decoy environments is a common technique used by attackers to test defenses.

  ---

  ### Blind Spots and Assumptions

  Detection may miss sophisticated attackers using custom tools or encrypted traffic to obscure their actions. Required log sources include properly configured OpenCanary services to ensure comprehensive logging of attempted logins. Legitimate activities may involve application testing or misconfigured third-party applications requesting access; these scenarios should be evaluated closely. A related detection could target suspicious outbound connections from the OpenCanary node, enhancing coverage against potential data exfiltration or command and control callbacks.

