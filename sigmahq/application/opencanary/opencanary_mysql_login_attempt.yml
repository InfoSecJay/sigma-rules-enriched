  ### Technical Context

  This rule detects login attempts to a MySQL service on an OpenCanary instance, which is often used as a honeypot to attract and log malicious activity. Attackers may attempt to gain unauthorized access to databases, seeking sensitive information or to establish a foothold in the network. The relevant MITRE ATT&CK tactics for this detection include Credential Access (TA0006) and Collection (TA0011), specifically techniques T1003 (Credential Dumping) and T1213 (Data from Information Repositories).

  The primary telemetry source is the OpenCanary application log, where these events are recorded under logtype 8001. If malicious, successful intrusions could lead to data exfiltration or adversarial pivoting within the network. It is important to note that this detection does not confirm successful logins or data compromise without further investigation.

  ### Investigation Steps

  - **Review OpenCanary logs for login attempts:** Check logs with the logtype 8001 for the "Login Attempt" events. Look for fields such as "username" and "IP address" to map potential attack origins.

  - **Identify source IP behavior:** Cross-reference the source IP from the login attempt with the organization's threat intelligence to assess if it is known for malicious activity. Look for patterns or frequency of attempts.

  - **Assess legitimate MySQL usage:** Determine if the MySQL service on the OpenCanary instance is expected to receive login attempts. This might include consulting with the development or operations team about any scheduled tasks that may interact with the service.

  - **Inspect login attempt details for anomalies:** Analyze if the usernames used in the attempts are common or known service accounts and if they follow expected patterns. Anomalous or generic usernames might indicate a malicious intent.

  - **Monitor for subsequent activity:** If the login attempt indicates suspicious behavior, continue to monitor the OpenCanary instance for any subsequent access or exploitation attempts logged (i.e., additional callback or command execution logs).

  ### Prioritization

  This alert has a high severity due to the potential impact associated with a MySQL database, which may store sensitive information. The likelihood of malicious behavior is elevated, as login attempts to such services are commonly weaponized to obtain database credentials and data. Continuous monitoring and prompt investigation are essential.

  ### Blind Spots and Assumptions

  Evasion techniques may include attackers using legitimate usernames or IP addresses from trusted sources. Reliable detection depends on consistent logging configurations for OpenCanary; incomplete setups may lead to missed login attempts. Legitimate activities may include authorized service accounts making scheduled updates or queries to the OpenCanary MySQL service. A related detection to strengthen coverage includes monitoring for abnormal patterns of login failures or brute force attempts against the OpenCanary service.

