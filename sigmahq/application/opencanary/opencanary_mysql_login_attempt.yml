  ### Technical Context
  This detection rule monitors for login attempts to a MySQL service running on an OpenCanary node, a honeypot designed to lure attackers into revealing their techniques. By analyzing these login attempts, security teams can gain insights into the behavior of malicious actors who may be attempting credential access or data collection within the environment. The primary threat actors leveraged here may be those performing reconnaissance or exploiting weak credentials to access databases.

  The relevant MITRE ATT&CK tactics include **Credential Access (TA0006)** and **Collection (TA0009)**, specifically focusing on techniques such as **T1003: Credential Dumping** (which can include unauthorized access attempts) and **T1213: Data from Information Repositories** (if successful access is achieved). The primary data source for this detection will be the OpenCanary logs that capture the MySQL login attempts on the designated nodes.

  ### Investigation Steps
  - **Review OpenCanary Logs:** Examine the logs generated by OpenCanary to identify instance login attempts to the MySQL service, noting the time, IP address, and any usernames used.

  - **Correlate with External Threat Intelligence:** Determine if the login attempts originate from known malicious IP addresses or external sources frequently associated with brute-force attacks.

  - **Check for Exploit Patterns:** Analyze the frequency and nature of login attempts. Look for indicators of a systematic brute-force attack, such as repeated attempts with various usernames.

  - **Assess Honeypot Configuration:** Ensure that the OpenCanary MySQL service is configured correctly and review the environment to identify how effective it is in attracting potential unauthorized access attempts.

  ### Prioritization
  Given the high severity level assigned to this rule, timely detection of unauthorized login attempts to MySQL services is crucial. The potential impact of successful credential access could lead to significant data breaches, making this alert critical for immediate investigation in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may not capture all attack vectors, especially if the attacker bypasses the honeypot or if the login attempts originate from internal sources rather than external threats. The logic assumes that any login attempt indicates malicious intent, which may not always be the case, as legitimate users could interact with the honeypot if misconfigured. Ensuring OpenCanary is continuously running and logging is essential for effective detection, so monitoring configurations and log retention settings must be established to empower this detection capability.

