  ### Technical Context

  This Sigma rule detects connection attempts to Remote Desktop Protocol (RDP) services on an OpenCanary node, which serves as a honeypot to lure and trace potentially malicious activity. The likely attacker objective is to gain unauthorized access to systems by exploiting RDP vulnerabilities or misconfigurations. The relevant MITRE ATT&CK tactics and techniques are Initial Access (TA0001), specifically using Exploit Public-Facing Applications (T1190), and Lateral Movement (TA0008) via RDP (T1021.001). The primary telemetry source includes application's log data from OpenCanary, specifically log type 14001, to monitor incoming RDP attempts. The security impact if this behavior is malicious could lead to unauthorized access to the network, potentially enabling further exploitation. It is important to state that this detection does NOT confirm that the attacker successfully accessed the system; it only identifies the connection attempt.

  ### Investigation Steps

  - **Examine connection attempt logs:** Look for OpenCanary logs (log type: 14001) indicating the timestamp, source IP, and username associated with the connection attempt. Focus on unusual IP addresses or geo-locations not typical for your environment.

  - **Identify known malicious IPs:** Correlate the source IP of the connection attempt against threat intelligence feeds to determine if it is recognized as malicious. Use tools like Suricata EVE JSON logs or threat intelligence platforms.

  - **Compare against legitimate access patterns:** Determine if the source IP corresponds to known legitimate users who require remote access, such as IT staff or remote workers. Verify if they typically connect via RDP.

  - **Review RDP settings and policies:** Check the OpenCanary or organizational RDP configuration for settings that secure RDP access, such as network-level authentication, and ensure proper firewall rules are in place.

  - **Investigate post-connection behavior:** If additional logs or telemetry indicate a successful RDP login following the detection, assess event IDs relevant to user logins (e.g., Windows Security Event ID 4624) for any abnormal login activity or lateral movement attempts.

  ### Prioritization

  This alert is high in severity because RDP is commonly targeted by adversaries for initial access or lateral movement. Given the critical function of systems utilizing RDP, any connection attempts warrant immediate investigation. The risk of exploitation is significant, especially if common vulnerabilities or weak credentials are present.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as IP whitelisting or using legitimate user accounts for unauthorized access. Reliable detection requires proper OpenCanary configurations to ensure logs are captured accurately. Legitimate activities may include scheduled maintenance or user support sessions, which could trigger the alert. A companion detection might involve monitoring port scanning activities on the same OpenCanary node to strengthen threat detection coverage.

