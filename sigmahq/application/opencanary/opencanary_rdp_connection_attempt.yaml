  ### Technical Context
  This detection rule identifies attempts to establish a Remote Desktop Protocol (RDP) connection to an OpenCanary node. OpenCanary acts as a honeypot, imitating vulnerable services to lure and record malicious activity on the network. When an attacker tries to access RDP, this indicates potential reconnaissance or exploitation actions, often aimed at gaining unauthorized access to critical systems. The likely attacker objective is to pivot deeper into the network or establish persistent control over compromised machines.

  The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) and **Lateral Movement** (TA0008), with techniques such as **External Remote Services** (T1133) and **Remote Services** (T1021.001). These tactics illustrate the methods attackers use to gain access to environments and subsequently move within the network. Key data sources that provide evidence for this detection include application logs from OpenCanary, specifically configured to capture RDP connection attempts.

  ### Investigation Steps
  - **Review RDP Connection Logs:** Check the OpenCanary logs associated with the connection attempt. Look for the IP address of the source attempting to connect, timestamps, and any associated usernames.

  - **Assess Source Reputation:** Utilize threat intel resources to analyze the reputation of the IP addresses identified in the connection logs. Determine if the source is known for malicious activity.

  - **Monitor for Additional Reconnaissance:** Investigate for any related activity on the network, such as port scanning or other service enumeration attempts that may indicate further probing by the same source.

  - **Evaluate Internal Network Traffic:** Conduct a deeper analysis of any internal connections that could have been made post-RDP attempt by reviewing network flow logs, particularly focusing on unusual traffic to sensitive resources.

  ### Prioritization
  The high severity of this alert is justified in an enterprise environment due to the critical nature of RDP access, which can lead to severe breaches of confidentiality and integrity if exploited. The likelihood of exploitation attempts is notably high, particularly against publicly exposed or configured RDP services.

  ### Blind Spots and Assumptions
  This detection method relies on the assumption that OpenCanary is properly configured and deployed to monitor all attempts on the RDP service effectively. A gap in coverage might occur if other services masquerading as RDP are used or if attackers utilize encrypted or non-standard connection methods. Without proper logging enabled for OpenCanary, attempts may go undetected. It is essential for the detection logic to be supported by comprehensive logging configurations, ensuring all malicious attempts are fully captured for analysis.

