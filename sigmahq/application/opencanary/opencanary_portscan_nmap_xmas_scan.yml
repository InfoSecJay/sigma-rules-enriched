  ### Technical Context

  This Sigma rule detects when an OpenCanary node is subjected to an NMAP XMAS scan, which is characterized by sending TCP packets with the FIN, URG, and PSH flags set. The primary objective of this behavior is typically reconnaissance, where an attacker aims to gather information about open ports, services running on a target, and potential points of exploitation. This detection corresponds to MITRE ATT&CK tactics: **Discovery** (TA0007) and technique **Network Service Scanning** (T1046).

  The primary telemetry source is application logs from OpenCanary, specifically log type 5004. If malicious, successful scans can lead to more targeted attacks on exploited services. This detection alone does not confirm that the system has been compromised; it only indicates an attempted probing activity.

  ### Investigation Steps

  - **Review OpenCanary logs for event type 5004:** Identify the specific source IP address conducting the XMAS scan. Look for repeated requests which may indicate a more persistent reconnaissance effort.

  - **Check for additional scanning activity:** Cross-reference logs from network intrusion detection systems (NIDS) or firewalls to identify patterns or multiple connections from the same IP. Use log sources such as firewall logs (Event ID 3003 for blocked connections).

  - **Evaluate targeting of sensitive assets:** Determine whether the OpenCanary node is functioning in a critical role (e.g., exposed services). Legitimate traffic typically originates from known or internal IP ranges, not random external sources.

  - **Identify known malicious IP addresses:** Utilize threat intelligence databases to cross-check the source IP against known malicious actors. An IP flagged for associated NMAP or penetration testing tools can confirm possible adversarial activity.

  - **Assess response to legitimate scans:** Understand that automated tools may trigger scans. Validate normal operations, such as authorized network scans by internal security teams that would operate within expected business hours and follow prescribed procedures.

  ### Prioritization

  This alert holds a **high severity level** due to the potential exposure of critical services within the enterprise environment and the likelihood of the behavior being a precursor to a malicious campaign. NMAP scans, especially XMAS scans, are a common step taken by attackers to gather intelligence, and their occurrence should prompt immediate review and possible preventative measures.

  ### Blind Spots and Assumptions

  Detection is limited in that it may not capture every scan, particularly if the scanning tool is configured to use stealth techniques (e.g., SYN scans). Successful logging of this event relies on proper OpenCanary configuration and integration into the logging ecosystem. Legitimate activities, such as routine vulnerability assessments or scans conducted by internal teams, may trigger this alert. A related detection that can enhance visibility includes monitoring general network traffic logs for anomalous probing activity indicative of active reconnaissance.

