  ### Technical Context

  This Sigma rule detects instances where an OpenCanary node has been subjected to a NMAP FIN scan, which is used for reconnaissance purposes by actors seeking to identify live hosts and open ports on a network. The likely objective is to probe network defenses undetected and gather information about possible entry points for further exploitation. This activity falls under the MITRE ATT&CK tactic of Discovery (TA0007) and specifically relates to the technique of Network Service Scanning (T1046).

  The primary telemetry source is OpenCanary logs, particularly those generated on port 5005, which track incoming connection attempts. If malicious, successful exploitation could lead to unauthorized access to the network services. However, the detection of a FIN scan does NOT confirm that further malicious activity has occurred; it only indicates potential reconnaissance.

  ### Investigation Steps

  - **Review OpenCanary logs for FIN scan entries**: Check logs for Event ID `5005` which indicates FIN scan attempts. Look for multiple hits from a single IP address within a short timeframe indicative of scanning behavior.

  - **Check source IP reputation**: Use threat intelligence platforms to assess if the IP conducting the FIN scan is known for malicious activities. Legitimate IPs usually belong to well-known entities or internal services.

  - **Correlate scan activity with other logs**: Monitor for other security events around the same timeframe, such as failed authentication attempts (Event ID `4625`) or unexpected process creation from local machines (Event ID `4688`).

  - **Identify typical network behavior**: Understand usual traffic patterns for devices protected by OpenCanary. Significant deviations, such as sudden increase in inbound traffic, may indicate a scanning event.

  - **Analyze service responses on port 5005**: Ensure that legitimate services are responding as expected to corroborate benign activity. If response patterns are unusual, it may indicate an ongoing probing or attack.

  ### Prioritization

  The alert is of high severity, given that it indicates potential pre-attack reconnaissance on a critical asset within the network. The likelihood of malicious use is high as scanning techniques like FIN scans are frequently utilized by adversaries to identify exploitable vulnerabilities. This behavior is often a precursor to more serious attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of deployment of OpenCanary on all critical assets or variations in legitimate traffic that might mimic scanning behavior. If the OpenCanary configurations are not correctly set to log this activity, essential information may be missed. Legitimate network management tools may also generate similar traffic patterns. Consider deploying companion detections for active directory enumeration or unusual outbound connection attempts to enhance security coverage.

