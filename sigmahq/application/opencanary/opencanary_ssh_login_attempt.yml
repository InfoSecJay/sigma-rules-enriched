  ### Technical Context

  This rule detects login attempts targeting the SSH service on an OpenCanary node, which serves as a honeypot for monitoring malicious activity. The likely attacker objective is to exploit unsecured SSH access for remote control or data exfiltration. This behavior falls under the MITRE ATT&CK tactics of Initial Access (TA0001) and Lateral Movement (TA0008), specifically techniques T1078 (Valid Accounts) and T1021 (Remote Services).

  The primary telemetry source is OpenCanary application logs, particularly those classified under logtype 4002. If the login attempts are indeed malicious, it can indicate an unauthorized attempt to gain control over a network resource. However, this detection does NOT confirm whether the attempted login was successful or the intent behind the attempt—it highlights only the activity of attempting to log in.

  ### Investigation Steps

  - **Check SSH login attempt logs**: Review OpenCanary logs with logtype 4002 for fields such as `username`, `ip_address`, and `timestamp`. Look for unusual IPs that do not correlate with known network traffic.

  - **Validate known IP addresses**: Cross-reference the IP address with threat intelligence sources to determine if it is associated with known malicious actors. Look for hits on blocklists or threat data services.

  - **Examine frequency and patterns**: Analyze the logs for multiple attempts from the same IP address within a short timeframe, which may indicate a brute force attack. Document the timestamps and usernames used in these attempts.

  - **Identify legitimate SSH access**: Review your organization's expected SSH access patterns. Legitimate users or automated processes may have regular SSH access during specific hours, while unexpected logins outside of these times could signify an attempted breach.

  - **Assess host role and criticality**: Determine the OpenCanary node's role within the environment. While it may be a low-risk honeypot, correlate the activity with any surrounding infrastructure to identify potential impacts on higher-value assets.

  - **Check for successful login artifacts**: If there are indications of a login success (e.g., subsequent logs or events), investigate further for any file creation or actions taken post-login. Validate with open-file checks or network activity spikes from that node.

  ### Prioritization

  This alert is of high severity due to the potential impact on network integrity if the SSH target is misconfigured or mismanaged. The likelihood of malicious abuse is high, as SSH is a common target for attackers seeking to pivot within a network. This behavior is frequently weaponized, particularly in poorly secured environments.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of successful login attempts not being captured if the logs do not distinguish between authentication attempts and successful logins. Effective detection relies on properly configured OpenCanary logs and appropriate log retention settings. Legitimate activities may include automated scripts or maintenance operations that could trigger similar login attempts. A related detection to consider is monitoring connection attempts from known bad IPs across other services, enhancing the visibility of potential coordinated attacks.

