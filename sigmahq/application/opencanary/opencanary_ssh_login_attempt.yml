  ### Technical Context

  This rule detects unauthorized SSH login attempts against an SSH service hosted on an OpenCanary node, which is often deployed as a honeypot. The likely attacker objective is to test credentials or gain unauthorized access to a system by exploiting weak or default credentials. This behavior correlates with the MITRE ATT&CK tactic of Initial Access (TA0001) and the technique of Valid Accounts (T1078). The primary telemetry source is OpenCanary logs, specifically looking for log type 4002 denoting login attempts. If malicious, this could facilitate further actions such as privilege escalation or lateral movement within an enterprise. Importantly, this detection does NOT confirm successful login or compromise on its own; it merely indicates an attempt.

  ### Investigation Steps

  - **Review OpenCanary logs**: Analyze logs with log type 4002 in OpenCanary telemetry for SSH login attempts. Look for timestamps, source IP addresses, and usernames.
  - **Identify username patterns**: Check if the attempted usernames are known defaults, common user accounts, or clearly suspicious (e.g., admin, user1) as opposed to typical organizational account formats.
  - **Cross-reference with legitimate usage**: Compare the source IP against known good addresses for users accessing SSH services. Legitimate access attempts should come from within the organization's defined IP ranges.
  - **Examine threat actor behavior**: Investigate the source IP for previous malicious activity, using threat intelligence sources to determine if it’s linked to noted adversarial groups or past incidents.
  - **Log Failed Login Attempts**: Check for multiple failed login attempts from a single source within a short period in OpenCanary logs to identify brute force patterns.
  - **Monitor for post-attempt activity**: Ensure that no lateral movement or privilege escalation attempts follow the login attempts. Review for any inbound or outbound connectivity based on subsequent SSH session creation logs.

  ### Prioritization

  This alert holds high severity as it targets SSH services, a common vector for attackers to gain unauthorized access to critical infrastructure. The likelihood of malicious abuse is significant since SSH login attempts using compromised or brute-forced credentials are often weaponized in attack scenarios.

  ### Blind Spots and Assumptions

  The detection may miss attempts from anonymized IPs or perform poorly if logs are not adequately configured. Additionally, legitimate administrative activities might trigger the alert during routine credential testing or maintenance. A companion detection to consider is monitoring SSH logins across all hosts for unusual success rates paired with this alert, which could enhance detection coverage on their effectiveness.

