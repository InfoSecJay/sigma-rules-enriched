note: |
  ### Technical Context
  This detection rule identifies login attempts to an SSH service configured on an OpenCanary node. OpenCanary is a honeypot designed to simulate various services, allowing security teams to detect unauthorized access attempts. Successful compromise of an SSH service could indicate an attacker's attempt to gain control over the network or perform lateral movement, facilitating escalation of privileges or persistence on compromised systems.

  The primary objectives of such attacks may include data exfiltration, deploying malware, or pivoting to more secure systems within the network. Attackers may employ brute-force techniques, credential harvesting, or default credential exploitation to gain access. Relevant MITRE ATT&CK techniques include T1078 (Valid Accounts), T1021 (Remote Services), and T1133 (External Remote Services), which highlight various methods for gaining access to systems via legitimate credentials or protocols.

  The best data sources for detecting these events are application logs from the OpenCanary deployment, specifically the logs corresponding to SSH service access attempts. These logs provide details on the nature of the attempted authentication and associated IP addresses.

  ### Investigation Steps
  - **Review SSH Logs:** Analyze the OpenCanary SSH logs for timestamps, source IP addresses, and usernames associated with the login attempts to identify patterns or repeated failed attempts that may indicate brute-force attacks.
  - **Correlate with External Sources:** Investigate the source IP addresses against threat intelligence feeds to determine if they are known malicious entities associated with credential stuffing or brute-force attacks.
  - **Monitor Network Traffic:** Use network logs or NDR tools to observe any unusual traffic patterns toward the OpenCanary node, which can provide context on potential reconnaissance or exploit attempts.
  - **Check for Related Activities:** Examine other log data, such as authentication logs and failed login attempts across production systems, to identify potential lateral movement or compromise attempts originating from the same source.

  ### Prioritization
  Given the high likelihood of an attacker attempting to gain unauthorized access through SSH, this alert warrants a high severity rating in an enterprise environment. The potential for lateral movement and persistence emphasizes the need for immediate investigation and response.

  ### Blind Spots and Assumptions
  This detection rule predominantly relies on the configuration and operational status of the OpenCanary instance, which must be deployed and running with its SSH service enabled. The coverage is limited to attempts logged by OpenCanary; hence any disabling of logging or misconfiguration will lead to gaps in detection. Assumptions include the reliability of the attempted logins reflecting genuine attack behavior, although legitimate administrative access attempts may be present. Proper logging configurations and network visibility are essential for effective detection and analysis.

