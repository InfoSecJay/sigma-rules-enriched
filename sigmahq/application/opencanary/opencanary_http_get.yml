  ### Technical Context
  This detection rule identifies when an HTTP service hosted on an OpenCanary node receives a GET request. OpenCanary is a honeypot tool designed to mimic various services and listen for incoming traffic, helping organizations understand potential threats by attracting malicious actors. This rule could indicate attempts by threat actors to probe for open services or vulnerabilities, potentially representing an initial access vector into the network.

  Threat actors may be using techniques like service discovery or reconnaissance to gather information about the network environment. HTTP GET requests can reveal the presence of exposed services, which attackers can exploit later. Relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) and **External Remote Services** (T1190), highlighting the potential risks surrounding public-facing applications or services.

  Primary data sources for this detection include logs from OpenCanary, such as application-level logs that capture HTTP requests and responses, providing insights into whether any malicious attempts have been made.

  ### Investigation Steps
  - **Review OpenCanary Logs**: Examine the OpenCanary application logs for details about the GET requests. Look for source IP addresses, request parameters, and user agents which may indicate potential malicious intent.

  - **Correlate Network Traffic**: Utilize network detection and response tools (NDR) to analyze inbound traffic to OpenCanary nodes. Identify patterns or anomalies that coincide with the logged GET requests, potentially indicating coordinated attack behavior.

  - **Assess Exposed Services**: Identify which specific services were impersonated by OpenCanary when the GET requests were received. Check if these services are known to have vulnerabilities and whether they are exposed in your real environment.

  - **Track Follow-Up Actions**: Monitor subsequent actions from the source IPs that generated GET requests, especially if they attempt additional probes or other types of requests. This will help identify whether the GET requests were part of broader reconnaissance or attack activities.

  ### Prioritization
  The severity of this alert is high due to the potential risk posed by unauthorized probing of network services. It indicates that an actor may be actively assessing the environment for vulnerabilities, which could lead to more serious exploitation attempts if not addressed promptly.

  ### Blind Spots and Assumptions
  One possible gap in detection coverage is the limitation of OpenCanary to only log specific request types and volume, which may omit less frequent or non-HTTP-based reconnaissance activities. The detection logic assumes that no legitimate traffic will generate GET requests to the OpenCanary services. Proper configuration of OpenCanary and retention of logs, ensuring that they capture comprehensive request data over time, is required for this alert to function effectively.

