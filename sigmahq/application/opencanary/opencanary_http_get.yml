  ### Technical Context

  This Sigma rule detects HTTP GET requests directed at an OpenCanary node, an intentionally vulnerable honeypot service designed to attract engagement from potential attackers. The likely objective of an adversary would be to test for vulnerabilities in web applications or services, which aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and technique Valid Accounts (T1078). The primary telemetry source is the OpenCanary application logs with a focus on logtype 3000.

  If malicious, this behavior could indicate reconnaissance or exploitation attempts targeting the simulated service. However, this detection does NOT confirm that a system compromise has occurred; rather, it highlights an interaction with a honeypot that could be benign or exploratory.

  ### Investigation Steps

  - **Review the context of the GET request:**
    Inspect the OpenCanary logs (logtype 3000) for the source IP address, user-agent, and timestamps. Legitimate benign behavior may include known IP address ranges or benign user agents (like automated scanning tools).

  - **Identify high-confidence malicious indicators:**
    Check for GET requests originating from known malicious IPs or user agents associated with exploitation tools (e.g., SQLMap). Correlate the IP against threat intelligence sources.

  - **Analyze request paths:**
    Look for unusual or unexpected endpoint access in the OpenCanary logs (logtype 3000). Malicious requests may try to access administrative endpoints or common vulnerabilities (e.g., /admin, /login).

  - **Investigate frequency and volume:**
    Assess the frequency of GET requests from the source IP in the OpenCanary logs. Multiple requests in a short time frame may indicate automated exploitation attempts.

  - **Cross-reference with known vulnerable services:**
    Validate if the OpenCanary node mimics any realistic services on your network. Note that if it matches active services elsewhere in the environment, it may result in legitimate interactions.

  ### Prioritization

  This alert has high severity due to the potential for initial access attempts targeting OpenCanary, which might indicate advanced probing for any vulnerabilities that could be leveraged against other systems. The likelihood of malicious abuse is moderate since attackers often run automated scans against known ports and services.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured OpenCanary environments that do not adequately log all activity or if legitimate service requests generate similar traffic. Additionally, benign scanning from security tools may trigger the alert due to overlaps in behavior. Companion detections, such as monitoring HTTP traffic on production systems, should be in place to correlate against unusual spikes or similar patterns indicative of real attacks.

