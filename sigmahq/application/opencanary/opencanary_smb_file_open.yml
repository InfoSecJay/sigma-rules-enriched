note: |
  ### Technical Context

  This rule detects file open requests on an SMB service within an OpenCanary node, which is a decoy service designed to lure attackers. The behavior may indicate an attempt to lateral movement or reconnaissance on seemingly vulnerable systems, as attackers often probe for shared files or resources to escalate privileges or collect sensitive information. The relevant MITRE ATT&CK tactics include Lateral Movement (TA0008) and Collection (TA0009), specifically techniques T1021 (Remote Services) and T1005 (Data from Local System). The primary telemetry source is the OpenCanary application logs, specifically the log type associated with SMB activity (Logtype 5000). If malicious, the security impact could involve unauthorized access to sensitive files or the deployment of malicious payloads. Importantly, this detection does NOT confirm whether the activity is indeed malicious without further context.

  ### Investigation Steps

  - **Verify the source of the request:** Check OpenCanary logs for Event ID 5000, noting the source IP address attempting to access the SMB service. Malicious sources may be unfamiliar or associated with known threat actors.

  - **Examine file access permissions:** Identify which files were requested in the SMB open request. Legitimate users typically access only files they have permissions for, while attackers might attempt unauthorized file access.

  - **Analyze successful open requests:** Look for patterns of repetitive open requests from the same source in the OpenCanary logs. Multiple requests over a short period can indicate malicious intent, especially if they target sensitive or commonly exploited files.

  - **Contrast with legitimate behavior:** Review standard access patterns to the OpenCanary SMB service. Expected behavior should involve sporadic or no access, as it is a honeypot; any access may be suspicious and require deeper analysis.

  - **Identify potential data exfiltration attempts:** Assess for any subsequent log entries that indicate file transfers or further access attempts following the open request. Look for additional OpenCanary logs indicating file download or copying activities.

  ### Prioritization

  This alert is of high severity due to the potential exposure of sensitive files and the likelihood of lateral movement. The SMB service in a honeypot context is particularly appealing to attackers and is commonly exploited during breaches. Rapid response to these alerts is critical as they may indicate imminent malicious activity.

  ### Blind Spots and Assumptions

  There may be limitations in detection if the OpenCanary service is misconfigured or if logs are not adequately collected. Evasion techniques could include spoofing legitimate IP addresses or automated scripts that access SMB resources. Legitimate activities that may trigger this alert could involve security researchers testing the OpenCanary service itself. Related detections, such as monitoring for command execution (via T1059 - Command-Line Interface), can provide additional context and strengthen the investigative process.

