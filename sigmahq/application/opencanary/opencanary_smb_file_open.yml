  ### Technical Context
  This rule detects instances where a file open request occurs on an SMB service running on an OpenCanary node. OpenCanary is a honeypot that mimics common services to gather intelligence about unauthorized attempts to access systems. By monitoring SMB file open requests, this rule can reveal potential lateral movement or reconnaissance activities by attackers attempting to interact with file shares within your environment.

  The primary threat scenario involves an attacker exploiting an SMB service to gather sensitive information or escalate privileges within the network. By crafting a file open request, the attacker may be testing the defenses of the network or seeking valuable files, potentially indicating malicious intent.

  Relevant MITRE ATT&CK tactics include:
  - **Lateral Movement (TA0008)**, specifically technique **T1021 - Remote Services**: This highlights the method of moving laterally through exploiting remote services like SMB.
  - **Collection (TA0009)**, specifically technique **T1005 - Data from Local System**: This reflects the goal of collecting sensitive files from compromised systems.

  The primary data source for this detection will be OpenCanary logs that record SMB interactions, specifically the log entries related to file access requests.

  ### Investigation Steps
  - **Review OpenCanary Logs**: Check the OpenCanary application logs for entries regarding SMB file open requests. Look for unusual or unauthorized access times and source IPs.
  - **Correlate with Network Traffic**: Analyze network traffic logs, particularly those involving SMB protocol communications to and from the OpenCanary node. Identify any connections from known malicious IP addresses or unfamiliar systems.
  - **Examine User Activity**: Investigate user access patterns for the accounts interacting with the OpenCanary node. Verify if any actions taken by users align with their normal behavior and access rights.
  - **Check for Additional Indicators of Compromise**: Use EDR and SIEM tools to cross-reference for other alerts or activities that might indicate broader compromise or targeting of your network, especially looking for lateral movement.

  ### Prioritization
  This alert is classified as high severity because it indicates potential unauthorized access attempts on network resources, which could lead to data breaches if not promptly addressed. The likelihood of exploitation through SMB is significant, given its prevalence in enterprise environments.

  ### Blind Spots and Assumptions
  The effectiveness of this alert may be limited if the OpenCanary service is not adequately deployed or configured to capture all SMB interactions. A key assumption made by the detection logic is that threat actors will attempt to access SMB shares, which may not always occur if they prefer other methods or tools. Moreover, if logging is not comprehensive or adequately directed within the OpenCanary configuration, valuable data might be missed for this alert to function correctly.

