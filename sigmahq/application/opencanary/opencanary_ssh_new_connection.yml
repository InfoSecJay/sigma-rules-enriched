  ### Technical Context
  This detection rule identifies connection attempts to an SSH service hosted on an OpenCanary instance. OpenCanary is a honeypot designed to simulate various services and detect malicious activity, making it useful for identifying unauthorized access attempts. The rule is triggered whenever an attacker tries to connect to the SSH service, providing insight into potential reconnaissance or lateral movement efforts aimed at gaining unauthorized access to systems.

  The primary threat scenario involves an attacker attempting to exploit SSH for initial access or lateral movement within a network, especially if SSH is commonly used in the environment. The attacker's objective could range from brute-force password attempts to launching further exploitation tools, emphasizing the need for prompt action upon detection. Relevant MITRE ATT&CK tactics include **Initial Access (TA0001)**, **Lateral Movement (TA0008)**, and **Credential Access (TA0006)**, with specific techniques such as **T1078: Valid Accounts** and **T1021: Remote Services**.

  The primary data source for this detection would be the OpenCanary application logs that indicate connection attempts to the simulated SSH service. These logs provide the essential evidence required to investigate unauthorized access attempts.

  ### Investigation Steps
  - **Review OpenCanary Logs:** Check the OpenCanary logs for details on the connection attempts, including the source IP address, timestamp, and any user credentials used in the attempt.
  - **Cross-Reference with Firewall Logs:** Analyze firewall logs to determine if the source IP has engaged in suspicious behavior or has been involved in other login attempts across your infrastructure.
  - **Investigate Source IPs:** Conduct a threat intelligence lookup on the source IP addresses to see if they are associated with known malicious activities or threat actors.
  - **Examine User Account Activities:** Look for any changes or suspicious activities associated with user accounts that were involved in the SSH connection attempts, to assess if there has been any compromise or unauthorized access.

  ### Prioritization
  This alert should be prioritized as high severity due to the implications of SSH connection attempts, which could indicate imminent unauthorized access or exploitation attempts. Given that attackers frequently target SSH services, any connection attempt warrants swift investigation to mitigate potential risks to enterprise systems.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the potential for legitimate users or internal services to connect to the OpenCanary SSH instance, which may lead to false positives. The detection logic assumes that all connection attempts are unauthorized. Additionally, logs from the OpenCanary service must be correctly configured and retained for sufficient time to ensure visibility into SSH connection attempts, as any misconfigurations could result in missed detection of actual threats.

