  ### Technical Context

  This rule detects new connection attempts to an SSH service established by OpenCanary, a honeypot that simulates SSH services to lure and capture malicious activity. Attackers may seek to gain unauthorized access to systems by attempting to connect to exposed SSH ports, with objectives such as establishing footholds in the network or performing lateral movement. This behavior is relevant to the MITRE ATT&CK tactics of Initial Access (TA0001) and Privilege Escalation (TA0004), specifically techniques such as Brute Force (T1110), Remote Service Session Hijacking (T1210), and Valid Accounts (T1078).

  The primary telemetry source is OpenCanary logs that specifically monitor SSH connection attempts (logtype 4000). If this activity is confirmed to be malicious, it may indicate a serious security risk, such as unauthorized access or system compromise. However, this detection does NOT confirm that an attacker successfully executed commands or maintained access within the network.

  ### Investigation Steps

  - **Review connection attempt details:** Inspect OpenCanary logs for entries indicating new SSH connection attempts (logtype 4000), especially looking for connections from unexpected IP addresses not known as trusted sources in your environment.

  - **Check for patterns of behavior:** Identify multiple connection attempts from the same source IP within a short timeframe, which may indicate a brute-force attack. Review timestamps and compare with historical records of legitimate IP activity.

  - **Verify source IP reputation:** Use threat intelligence tools to check the reputation of connecting IP addresses. Known malicious sources or IPs tied to previous incidents could enhance the confidence level of malicious intent.

  - **Identify expected legitimate traffic:** Document legitimate connection attempts, such as regular admin connections from known management IPs. Any deviations from this pattern should raise red flags for potential malicious behavior.

  - **Assess system exposure:** Evaluate any systems running OpenCanary to determine their role and criticality. If the honeypot is on a network segment with high-value assets, this detection may warrant immediate response and escalation.

  - **Look for secondary exploitation actions:** If connection attempts are followed by additional logs indicating session creation or command execution (e.g., Event ID 4688 on Windows), prioritize this investigation as it could signify an active intrusion attempt.

  ### Prioritization

  This alert should be treated with high severity due to both the potential impact on sensitive systems and the likelihood of exploitation. Malicious actors frequently target SSH services in both initial access and lateral movement scenarios, making this behavior a common tactic in their methodologies.

  ### Blind Spots and Assumptions

  Evasion techniques such as IP address rotation or low-and-slow tactics may limit the detection of repeated attempts. Ensure that OpenCanary is properly configured to log all relevant connection attempts in real-time. Legitimate activities, such as internal system administrators connecting to a testing environment, may also trigger this alert. Companion detections, such as monitoring network flows for unusual outbound SSH connections (e.g., from unexpected hosts), can strengthen overall visibility and response readiness.

