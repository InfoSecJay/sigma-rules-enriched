  ### Technical Context

  This rule detects unauthorized access attempts to an SSH service on an OpenCanary node, which simulates a honeypot environment. The likely attacker objective is to explore potential vulnerability in the SSH service, gather system information, or establish a foothold for further exploitation. This behavior aligns with the MITRE ATT&CK tactics of Initial Access (T1078) and Lateral Movement (T1021), particularly focusing on the exploitation of remote services.

  The primary telemetry source for this detection is the OpenCanary application logs, specifically log entries with type 4000. If these connection attempts are malicious, they may lead to unauthorized access to sensitive systems, data exfiltration, or lateral movement within the network. However, this detection does not confirm successful access or compromise; it only indicates an attempt to connect.

  ### Investigation Steps

  - **Review connection attempt logs:** Examine OpenCanary logs (logtype 4000) around the time of the alert for detailed information on the IP address, timestamp, and username associated with the SSH connection attempt.

  - **Assess originating IP address:** Verify if the IP address attempting the connection is known for malicious activity by checking threat intelligence feeds and performing reverse lookups to ascertain its reputation (e.g., known botnets, attackers).

  - **Investigate timing and activity patterns:** Check for patterns in the log regarding the timing of connection attempts, particularly if they align with legitimate maintenance activity or known operational usage hours for your environment.

  - **Validate against expected behavior:** Ensure that the attempted username and behavior conform to legitimate access patterns within your organization. For example, verify if a service account or administrative account commonly uses the SSH connection.

  - **Document high-confidence malicious indicators:** Identify if the SSH connection attempt used common brute force credentials (e.g., "admin:password") by scraping failed authentication logs from the OpenCanary output for anomalies.

  ### Prioritization

  This alert is high severity due to potential exposure of critical systems via SSH. The likelihood of malicious abuse is significant as SSH is a commonly targeted service for exploitation. Attackers frequently scan for open SSH services in their reconnaissance phase, making this behavior commonly weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through IP whitelisting, use of legitimate credentials, or obfuscation techniques. The environment must ensure OpenCanary is properly logging all connection attempts to guarantee reliable detection. Legitimate maintenance activities, such as system updates or admin testing, may trigger similar connection attempts. A companion detection rule monitoring SSH brute force attempts (e.g., multiple failed login attempts) would strengthen overall attack coverage.

