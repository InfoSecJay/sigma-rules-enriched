  ### Technical Context

  This rule detects incoming NMAP FIN scans targeting an OpenCanary node, which is a honeypot designed to mimic vulnerable services. The likely attacker objective is to identify open ports and services running on a system, often as a precursor to exploitation or further reconnaissance. This behavior aligns with the MITRE ATT&CK tactic of reconnaissance (TA0043) using the technique “Port Scanning” (T1046).

  The primary telemetry source for this detection is OpenCanary logs, specifically log type 5005, which captures events related to attempted scans on the node. If the behavior is indeed malicious, it may indicate an attempt to probe for vulnerabilities in the network. Importantly, this detection does NOT confirm that any exploitation occurred or that the attacker had success in compromising the system.

  ---

  ### Investigation Steps

  - **Identify incoming NMAP scan attempts:** Review OpenCanary logs (log type 5005) for entries indicating NMAP FIN scans, noting the source IP address and timestamp. Compare these against known malicious IP lists.

  - **Validate the source IP:** Cross-reference the identified source IPs with threat intelligence platforms or internal logs to assess if they are associated with known malicious actors or campaigns.

  - **Check for legitimate network activity:** Ensure that the scanned OpenCanary node is not running known services that could prompt legitimate port scans from internal security tools or network monitoring solutions.

  - **Determine scan frequency and patterns:** Analyze the log entries for unusual patterns, such as repeated scanning from the same IP over a short period, which may indicate a more aggressive reconnaissance effort.

  - **Document OpenCanary configuration and activity:** Confirm the current services configured on OpenCanary through its configuration logs to understand what an attacker might be probing, as well as to identify legitimate operational context.

  - **Monitor related host behavior:** If possible, analyze surrounding logs (firewall, IDS) for any signs of suspicious outbound connections or follow-up actions originating from the same scanning source.

  ---

  ### Prioritization

  This alert should be considered high priority due to the potential impact on system security as it pertains to reconnaissance tactics. The likelihood of malicious intent from external sources is significant, particularly in environments where OpenCanary is deployed to monitor for threats. NMAP scans are commonly used to prepare for more serious exploitation attempts.

  ---

  ### Blind Spots and Assumptions

  Limitations include the possibility of benign internal scans, particularly from network management or monitoring tools, which could trigger similar alerts. Reliable detection depends on correctly configured OpenCanary logging. Additionally, legitimate activities, such as routine security assessments, may inadvertently cause alerts. A companion detection strategy could include monitoring for subsequent connection attempts or exploitation attempts originating from the same IP addresses that performed the FIN scans.

