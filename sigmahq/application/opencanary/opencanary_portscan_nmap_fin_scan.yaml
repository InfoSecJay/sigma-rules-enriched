  ### Technical Context
  This detection rule identifies NMAP FIN scans targeting an OpenCanary node. A FIN scan is a stealthy port scanning technique used to determine the state of ports without completing the TCP handshake, which can help attackers identify open services on a target system. The suspected threat actor may aim to gather intelligence about the network to discover potential vulnerabilities that could be exploited for further attacks.

  The relevant MITRE ATT&CK techniques include:
  - **T1046: Network Service Discovery**: This technique describes the detection of systems in the environment, which attackers may carry out to assess the network and identify potential targets.

  Primary data sources for this detection include logs generated by OpenCanary, which mimic normal service activity and record attempts to probe those services. These logs provide insight into interaction attempts with the local system, particularly focusing on network behaviors indicative of reconnaissance activities.

  ### Investigation Steps
  - **Review OpenCanary Logs**: Examine the application logs from OpenCanary filtered by log type 5005. Look for entries that indicate FIN scan signatures, which may highlight the specific timeframe and source IP conducting the scan.

  - **Correlate with Network Traffic**: Cross-reference the logs with network flow data to identify additional patterns of behavior from the same IP. This can help determine if the scan is part of broader reconnaissance or attack activity.

  - **Verify Targeted Services**: Identify which services were targeted by the FIN scan. Determine if they are critical systems or less significant honeypots and assess the potential impact of a successful exploit.

  - **Check IP Reputation**: Investigate the source IP of the FIN scan by checking its reputation using threat intelligence feeds. This can help assess the level of threat posed by the scanning activity and inform further response actions.

  ### Prioritization
  This alert is classified as high severity due to the reconnaissance nature of the FIN scan, which suggests that an attacker is actively probing for weaknesses in the network, potentially leading to future intrusions or data breaches.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage lies in false negatives caused by overly cautious firewall configurations that may block scan attempts before they reach OpenCanary. The detection assumes that OpenCanary is properly configured to log and alert on all relevant scanning activities. Additionally, for this alert to function, OpenCanary must be collecting logs at the specified log type and should have adequate visibility into scanning activity on the network.

