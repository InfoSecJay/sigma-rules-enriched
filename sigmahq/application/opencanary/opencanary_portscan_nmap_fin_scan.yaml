  ### Technical Context

  This Sigma rule detects NMAP FIN Scan attempts against an OpenCanary node, which is a honeypot that simulates vulnerable services to lure attackers. The primary attacker objective is to enumerate open ports on a target system to identify potential vulnerabilities for exploitation. This behavior falls under the MITRE ATT&CK tactic of Discovery (TA0007) and technique T1046 (Network Service Scanning).

  The primary telemetry source for this detection is the OpenCanary application logs, specifically looking for log entries indicating port scanning activities through logtype 5005. If malicious, this behavior could lead to reconnaissance ahead of an attack, potentially allowing the adversary to exploit discovered vulnerabilities. Importantly, this detection does NOT confirm a successful exploitation or any subsequent malicious actions on the target system.

  ### Investigation Steps

  - **Review OpenCanary logs for scan activity:** Check logs for entries matching logtype 5005, specifically looking for timestamps and source IP addresses associated with the FIN Scan detection.

  - **Identify the source of the scan:** Cross-reference the source IP address found in the logs with threat intelligence sources to determine if it has a history of malicious activity or is known to be associated with scanning operations.

  - **Determine legitimate usage patterns:** Verify if the OpenCanary node resides in a controlled environment where scanning is expected (e.g., during penetration testing or security assessments) which may explain the detected activity.

  - **Observe network traffic on the OpenCanary node:** Utilize network monitoring tools to capture and analyze the packet flow. Look for SYN or RST flags to confirm the nature of the scanning activity and exclude benign traffic.

  - **Check for repeat scan attempts:** Analyze the frequency of scan events from the same source IP over a given timeframe. Multiple attempts in quick succession may signify an aggressive scanning activity rather than casual probing.

  - **Validate any subsequent malicious indicators:** After detection, monitor for lateral movement or exploitation indicators in proximity to the detected scan, such as abnormal process creations (Event ID 4688) or subsequent HTTP requests that indicate a payload delivery.

  ### Prioritization

  This alert has a high severity due to the potential for reconnaissance leading to targeted attacks against critical infrastructure. The likelihood of abuse is significant, as port scanning is a common precursor to exploitation attempts, and such behaviors are frequently weaponized by adversaries.

  ### Blind Spots and Assumptions

  This detection may miss other scanning techniques or stealthier approaches, such as using fragmented packets or non-FIN scan methods. Reliable detection hinges on configuring OpenCanary to log appropriately and ensuring those logs are ingested by the SIEM. Legitimate activities, like internal vulnerability scans, may trigger this alert. Correlating this alert with other detections, such as unexpected outbound connections (Rule ID: Another rule referencing outbound suspicious activity), can strengthen overall security monitoring.

