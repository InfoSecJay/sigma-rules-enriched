note: |
  ### Technical Context

  This Sigma rule detects login attempts to an MSSQL service using Windows Authentication on an OpenCanary node, a honeypot designed to simulate vulnerable services for malicious actors to interact with. The likely attacker objective is to exploit this vulnerable service for unauthorized access to sensitive data or to expand their control over the compromised environment. This behavior aligns with the MITRE ATT&CK framework under the tactic of Credential Access, specifically technique T1003 (OS Credential Dumping) and T1213 (Data from Information Repositories).

  The primary telemetry source for this detection is the OpenCanary logs, particularly the application logs capturing MSSQL connection attempts (log type 9002). Malicious intent can lead to serious security impacts, such as unauthorized access to database contents or lateral movement within the network. Importantly, this detection does NOT confirm that the login attempt was successful or that malicious activity occurred without further validation.

  ### Investigation Steps

  - **Verify the origin of the login attempt:** Check the OpenCanary logs for Event ID 9002, specifically looking for the "Windows Authentication" method and correlating the source IP address against known assets to identify potential unauthorized access attempts.

  - **Identify patterns of login attempts:** Document the frequency of login attempts within a defined time frame (e.g., 5 or more attempts in 10 minutes) to distinguish between individual user errors and potential brute-force or automated attack attempts.

  - **Review legitimate user activity:** Confirm if the source IP has a legitimate business purpose for accessing the MSSQL service, such as an internal administrator or IT resource, ensuring that typical access behaviors align with corporate policy.

  - **Search for high-confidence malicious indicators:** Look for repeated failed login attempts associated with known SQL injection patterns or suspicious user account activity tied to the source IP, utilizing log fields such as user name (e.g., "admin" or common default accounts) and timestamps.

  - **Inspect for potential exploitation:** Analyze related logs (if available) around the same timestamps from related services (e.g., Windows Security Events Event ID 4625 for failed logins) to identify any corresponding unauthorized activities or lateral movements.

  - **Validate if the environment is updated or configured correctly:** Confirm that OpenCanary is correctly configured to meet the organization's security standards and that notifications for real attacks are well-timed and logged through the appropriate logging channels.

  ### Prioritization

  This alert should be treated with high severity due to the potential for impacting sensitive systems, particularly if the MSSQL service is central to operations within the enterprise. The likelihood of malicious abuse is moderate to high, considering that brute-force attacks and unauthorized access attempts against database services are common tactics used by attackers.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of obfuscated login attempts or exploitation of known vulnerabilities in MSSQL services that do not necessarily trigger logging. Reliable detection requires that OpenCanary logging is properly configured and that relevant log sources are integrated into the monitoring platform. Legitimate administrative tasks or testing may inadvertently trigger this alert, such as service checks by trusted IPs, suggesting the need for contextual understanding. A related detection that could enhance coverage is monitoring for high volumes of SQL queries from a single IP, which may indicate exploitation attempts following successful login events.

