note: |
  ### Technical Context
  This rule detects login attempts to a Microsoft SQL Server (MSSQL) instance on an OpenCanary honeypot using Windows Authentication. OpenCanary is a software that emulates various services to attract and log malicious activities. Attackers may attempt to gain unauthorized access to database services as part of their reconnaissance or exploitation phases. The unauthorized login attempts could indicate attempts to steal sensitive data, deploy ransomware, or create backdoors for further access.

  The primary MITRE ATT&CK tactics related to this detection include Credential Access (T1003) and Collection (T1213), which focus on techniques that adversaries use to gather credentials and extract information from compromised systems. By monitoring Windows Authentication login attempts, organizations can identify unauthorized access attempts early and respond accordingly.

  This detection rule relies primarily on logs generated by OpenCanary, specifically application-level logs that capture attempted logins to the MSSQL service. These logs provide critical insight into potentially malicious actor behavior targeting database services.

  ### Investigation Steps
  - **Review Login Attempts**: Analyze OpenCanary MSSQL logs for any unusual or unauthorized Windows Authentication login attempts. Pay attention to username patterns, timestamps, and frequency of attempts.
  - **Correlate with Network Traffic**: Investigate network traffic to and from the OpenCanary instance to rule out automated scanning tools or legitimate user activity that might be misclassified as suspicious.
  - **Examine External Actors**: Check for external IP addresses making repeated login attempts and assess their threat reputation. Conduct geolocation analysis for any anomalies.
  - **Investigate Adjacent System Events**: Look at related activity within the environment, such as failed logon attempts or other indicators of compromise in nearby systems, which may suggest a coordinated attack.

  ### Prioritization
  The alert's severity is high, as unauthorized MSSQL login attempts via Windows Authentication can indicate a serious compromise attempt, potentially leading to extensive data breaches or system control if successful.

  ### Blind Spots and Assumptions
  This detection may not cover other authentication methods that do not use Windows Authentication, nor does it capture attempts that occur outside of the OpenCanary environment. It assumes adequate logging is enabled in the OpenCanary configuration to capture all relevant events. Depending on the deployment settings, there may be limitations related to the visibility of all database interactions, including legitimate users accessing the MSSQL service for valid purposes.

