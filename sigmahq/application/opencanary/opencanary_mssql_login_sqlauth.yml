  ### Technical Context

  This rule detects login attempts to an MSSQL service running on an OpenCanary node using SQL authentication, indicative of credential access attempts. An adversary's objective is likely to gain unauthorized access to databases to exfiltrate sensitive information or deploy additional payloads. The relevant MITRE ATT&CK tactics and techniques for this behavior include Credential Access (TA-0031) and T1003 (Credential Dumping).

  Primary telemetry sources include OpenCanary logs, specifically looking for logtype 9001, which captures authentication attempts. If malicious, successful logins can lead to significant data theft or compromise. It is crucial to note that this detection does NOT confirm that the login attempt was successful or that the actor is indeed malicious without further investigation.

  ---

  ### Investigation Steps

  - **Review OpenCanary logs for the specific event:** Focus on logs with logtype 9001 for timestamps corresponding to the alert. Look for fields such as `username`, `ip_address`, and `timestamp`. This will provide context on the source of the login attempts.

  - **Identify high-confidence malicious indicators:** Check if the username used in the login attempts is known to be associated with adversarial activity or is commonly used in SQL attacks (e.g., 'sa', 'admin'). Investigate the originating IP address against threat intelligence feeds for any known malicious activity.

  - **Validate legitimate activity:** Determine if the login attempts correspond to known scheduled tasks, maintenance, or approved applications that may interact with the MSSQL service. Confirm with application teams if any expected SQL authentications are in progress.

  - **Correlate with host context:** If the OpenCanary node is part of a critical asset in your environment (e.g., a production database server), escalate accordingly. Analyze for signs of lateral movement or external communication originating from the asset.

  - **Monitor for repeated attempts:** Check for multiple login attempts from the same IP within a short timeframe. Metrics such as rate of login failures (e.g., more than 5 attempts within 10 minutes) may indicate automated attack vectors, further supporting a malicious intent.

  ---

  ### Prioritization

  This alert has a high severity due to the potential for significant impact on data confidentiality and integrity. Given that MSSQL vulnerabilities are frequently targeted by attackers, this behavior has a high likelihood of being weaponized, warranting urgent investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses legitimate credentials or employs stealth techniques to mask their activity. The configuration of OpenCanary and logging settings must be comprehensive to capture all relevant events effectively. Legitimate administrative tasks, such as database migrations or scheduled backups, could also trigger this alert. A related detection that could enhance coverage includes monitoring for abnormal data export patterns from MSSQL services.

