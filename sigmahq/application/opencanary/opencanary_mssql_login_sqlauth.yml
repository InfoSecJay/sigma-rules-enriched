note: |
  ### Technical Context
  This rule detects login attempts to a Microsoft SQL Server (MSSQL) database on an OpenCanary instance using SQL authentication. OpenCanary is a honeypot solution designed to simulate various services to attract and analyze malicious activity. An attacker may attempt unauthorized access to the MSSQL service to gather sensitive data, escalate privileges, or establish persistence within an environment. By leveraging SQL authentication, attackers can exploit weak or leaked credentials, which can lead to further compromise of the database and potentially the broader network.

  This activity aligns with the MITRE ATT&CK tactics, specifically under "Credential Access" (TA0006) using techniques like "Brute Force" (T1110) and "Credential Dumping" (T1003). The primary data source for this detection will be application logs from OpenCanary which record all login attempts to the simulated MSSQL service, including details regarding successful and failed logins.

  ### Investigation Steps
  - **Review Login Attempt Logs:** Examine the OpenCanary application logs for any recorded login attempts to the MSSQL service, noting both successful and failed attempts for anomalous patterns.

  - **Analyze Source IP Addresses:** Investigate the IP addresses associated with the login attempts. Check for any irregularities such as attempts originating from untrusted or unusual geolocations.

  - **Check Timing and Frequency:** Look for login attempts that occur outside of normal operational hours or exhibit unusually high frequency, which could indicate automated attack tools or scripts.

  - **Correlate with Other Logs:** Cross-reference OpenCanary logs with other security telemetry (e.g., VPN, firewall, or network traffic logs) to identify if any known malicious IPs or patterns exist that align with the detected login activity.

  ### Prioritization
  The severity of this alert is high, as unauthorized access attempts to MSSQL can lead to significant data breaches, database corruption, or further escalation of Privileges within the organization’s infrastructure. Continuous attempts may indicate an active attacker trying to gain foothold.

  ### Blind Spots and Assumptions
  This detection may not account for advanced evasion tactics that attackers might use to blend in with normal traffic or privileges. The rule assumes that SQL authentication methods are properly configured and that OpenCanary is operational and correctly set up to log relevant events. If logging is misconfigured or disabled, attempts may go undetected, reducing the effectiveness of this alert. Additionally, it assumes that attackers specifically target OpenCanary nodes rather than other MSSQL databases within the network.

