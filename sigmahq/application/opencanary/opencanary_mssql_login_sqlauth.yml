note: |
  ### Technical Context

  This rule detects login attempts against an MSSQL service on an OpenCanary node using SQL authentication. The likely attacker objective is to gain unauthorized access to the database, potentially to exfiltrate sensitive information or exploit the system further. This detection aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and technique T1003 (Credential Dumping). The primary telemetry source is the OpenCanary application logs, specifically log type 9001. If malicious, this behavior could lead to unauthorized data access or system compromise. Importantly, this detection does NOT confirm successful login or exploitation, only that an attempt was made.

  ### Investigation Steps

  - **Review MSSQL login attempt details:** Examine logs for log type 9001, focusing on fields such as timestamp, source IP, and username. Look for unusual patterns or known bad IP addresses that could indicate malicious intent.

  - **Validate the context of the OpenCanary deployment:** Confirm that this OpenCanary instance is accurately configured within an expected environment. Check for prior legitimate access attempts which may be allowed and authenticated using SQLAuth.

  - **Cross-reference with other authentication logs:** Look at security logs (Event ID 4625) from the host to identify if multiple failures occur from the same source IP and if they correspond to the MSSQL login attempts.

  - **Identify high-confidence malicious indicators:** Track the source IP address against threat intelligence databases or internal logs for previous associations with malicious activities, such as brute-force attempts or data breaches.

  - **Assess asset criticality and potential impact:** Determine the role of the OpenCanary node within the network. If it simulates critical assets or contains sensitive information, heightened monitoring and response coordination may be necessary.

  - **Check for legitimate operational behavior:** Review documentation and previous engagement logs for normal operation of MSSQL on this OpenCanary instance, including regular maintenance access times and expected login patterns.

  ### Prioritization

  This alert should be considered of high severity given that it targets an MSSQL service, which could be critical for data management and integrity. The likelihood of malicious abuse is notable due to historical exploitation attempts against MSSQL servers, making this behavior a common tactic used by attackers.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques, such as spoofing or using legitimate credentials. Reliable detection requires appropriate logging configurations within OpenCanary. Legitimate activities, such as testing or authorized access attempts, may trigger this alert. Companion detections, such as monitoring for failed login events or excessive login attempts from the same source, can further enhance coverage against unauthorized access attempts.

