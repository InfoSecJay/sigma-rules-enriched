  ### Technical Context

  This Sigma rule detects instances of SYN port scans targeting an OpenCanary node. The behavior indicates an attacker may be reconnaissance in nature, attempting to identify open ports and available services on the target system. This aligns with the MITRE ATT&CK tactic of Discovery (TA0007) and specifically the technique Network Service Scanning (T1046).

  The primary telemetry source comes from OpenCanary logs, specifically capturing event types logged when a SYN scan is detected. If malicious, such behavior may indicate an imminent attack, as reconnaissance is often a precursor to exploitation or lateral movement. Importantly, this detection alone does not confirm an active compromise; it simply indicates scanning behavior which could be legitimate in some contexts as well.

  ### Investigation Steps

  - **Check OpenCanary Logs:** Review OpenCanary logs for logtype 5001 events. Look for entries detailing IP addresses and timestamps associated with SYN scan activity to identify the scanning source.

  - **Identify the Origin IP:** Cross-reference the originating IP address from the OpenCanary logs with external threat intelligence sources. Determine if the IP is known for malicious scanning or reconnaissance, denoting a high-confidence malicious indicator.

  - **Review Legitimate Network Traffic:** Validate normal server roles by checking for expected communication patterns within the network. Typically, legitimate services will have established traffic patterns established over time, without rapid successive connection attempts.

  - **Analyze Timestamp Frequency:** Examine the timestamp frequency of the logtype 5001 events to identify whether the detected scanning attempts are clustered or persistent over an extended period. Multiple scans in quick succession are more indicative of malicious intent.

  - **Evaluate firewall and IDS/IPS Logs:** Cross-verify against firewall logs and any IDS/IPS logs for similar scanning behavior. Look for Event IDs communicating SYN packets being blocked or monitored, providing additional context about network security posture.

  ### Prioritization

  This alert has a high severity level due to its potential impact on sensitive systems that might be targeted, and the likelihood of such scanning behavior being malicious is significant. Reconnaissance attempts like SYN scans are frequently leveraged by attackers as a precursor to more serious exploit attempts.

  ### Blind Spots and Assumptions

  There may be evasion techniques in play, such as the use of stealthy scanning tools that can bypass detection. This detection relies on OpenCanary being properly deployed and configured to capture relevant events; otherwise, it may miss legitimate SYN scans performed by internal management tools. Additionally, legitimate troubleshooting or maintenance is a common, non-malicious reason for SYN scans, which could trigger this alert. A related detection to strengthen coverage would be monitoring for anomalous outbound connections made by the same source IP following a detected scan.

