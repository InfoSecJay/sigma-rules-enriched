  ### Technical Context
  This rule detects SYN port scan activities targeting an OpenCanary node, a honeypot tool designed to simulate services and capture malicious activities. Attackers often perform SYN scanning to identify open ports on networked devices, seeking potential vulnerabilities to exploit. The goal of this behavior is typically reconnaissance, allowing adversaries to map out potential targets before launching more sophisticated attacks, such as unauthorized access or data exfiltration.

  The relevant MITRE ATT&CK tactics for this detection include **Discovery** (TA0007) and technique **Network Service Scanning** (T1046). This detection focuses on malicious scanning activity, which may be part of a broader strategy to understand an organization's network configuration and identify exploitable weaknesses.

  The primary data source for this detection is the OpenCanary's application logs, specifically those capturing SYN scan events. By monitoring these logs, security teams can gain insights into probing attempts on systems that may be of interest to attackers.

  ### Investigation Steps
  - **Review OpenCanary Logs:** Examine OpenCanary logs for entries related to SYN scan activities, particularly those tagged with logtype 5001. Look for a pattern of repetitive connection attempts to multiple ports within a short time frame.
  - **Correlate with Network Traffic:** Analyze network traffic logs to identify corresponding SYN packets from the same source IP address. This will help confirm whether the detected scans were deliberate and discern their scope.
  - **Investigate Source IP:** Perform a reputation check on the source IP of the detected scan. Determine if the IP is known for malicious activity or if it's associated with benign operations.
  - **Monitor for Subsequent Actions:** Check for any follow-up activities from the same source, such as attempts to connect to identified open ports or other anomalous behavior that could indicate further malicious intent.

  ### Prioritization
  This alert is marked as high severity due to the potential for serious security implications if an attacker successfully uses the information gained from the port scanning activity. The likelihood of exploitation increases significantly if multiple services are detected as open, making this a critical issue for enterprise environments.

  ### Blind Spots and Assumptions
  The detection logic relies heavily on the capability of OpenCanary to log SYN scan activities accurately; therefore, it assumes the honeypot is properly configured and actively monitoring the environment. There may be gaps in detection if the attacker employs techniques to evade detection, such as slow scanning. Additionally, if logging is not enabled or configured correctly for OpenCanary, relevant data may be missed, impacting the ability to effectively detect and respond to this threat.

