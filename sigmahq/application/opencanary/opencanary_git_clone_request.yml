  ### Technical Context
  This detection rule identifies instances of Git Clone requests made to a GIT service hosted on an OpenCanary node, which is often used as a honeypot for detecting and analyzing various malicious activities. The detection of such requests can indicate that an attacker is attempting to gather information about the environment, exfiltrate source code, or probe application vulnerabilities. This is particularly alarming as it suggests potential reconnaissance or data theft activities aimed at compromising the organization’s assets.

  The suspected threat behaviors align with MITRE ATT&CK techniques that fall under the "Collection" tactic, specifically using **T1213: Data from Information Repositories**, where attackers may gather sensitive information from repositories. The primary data source for this detection will be the OpenCanary application logs, specifically those that capture Git activity and requests.

  ### Investigation Steps
  - **Review OpenCanary Logs:** Examine the OpenCanary application logs for entries related to Git Clone requests. Focus on timestamps, source IP addresses, and requested repository paths to identify suspicious patterns or anomalies.
  - **Identify Source IPs:** Cross-reference the IP addresses associated with the Git Clone requests against known threat intelligence databases or internal blocklists to determine if the source is known for malicious activities.
  - **Assess Changes in Repository Access:** Look for any accompanying changes in repository access patterns or unusual activity around sensitive Git repositories that might indicate a targeted probe for data.
  - **Monitor for Additional Activities:** Keep an eye on related activities such as further data collection or access attempts that follow the initial Git Clone request, which may indicate an escalation in the attack.

  ### Prioritization
  This alert is considered high severity due to the potential for significant data exfiltration or reconnaissance by attackers. Given that Git repositories often contain source code and sensitive information, any unauthorized access attempts warrant immediate investigation to mitigate risk.

  ### Blind Spots and Assumptions
  One potential gap in this detection coverage is the reliance on the OpenCanary service being properly configured and deployed effectively; if the honeypot is not active, these requests will go unnoticed. The detection assumes that all Git Clone requests to the GIT service are unauthorized, which may not always be the case, especially in environments with legitimate users testing or accessing code. Additionally, the rule requires logging to be enabled on the OpenCanary node to capture such activities, without which detection will not be possible.

