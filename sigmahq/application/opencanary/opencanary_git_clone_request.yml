  ### Technical Context

  This Sigma rule detects unauthorized Git clone requests to a Git service hosted on an OpenCanary node, simulating a decoy environment intended to lure attackers. The likely objective of the attacker in this scenario is to exfiltrate source code or sensitive information from a vulnerable repository. This behavior aligns with the MITRE ATT&CK tactic "Collection" (TA0009) and technique "Data from Information Repositories" (T1213). The primary telemetry source for this detection is OpenCanary application logs, specifically identified by log type 16001. If confirmed as malicious, this behavior could indicate an attempted data breach involving intellectual property or proprietary code. Importantly, this detection alone does not confirm that any sensitive data was successfully exfiltrated.

  ---

  ### Investigation Steps

  - **Review OpenCanary log entries:** Look for log type 16001 to identify any Git clone requests. Confirm that the requests are associated with unauthorized IP addresses or users that do not align with typical operational patterns.

  - **Validate source IP and user identity:** Cross-reference the source IP address of the Git clone requests against known inventory. A benign request typically originates from internal or known user accounts, while unknown or external IP addresses may indicate malicious intent.

  - **Examine request timing and frequency:** Analyze the timing of the Git clone requests within the OpenCanary logs. Malicious behavior may exhibit unusual patterns, such as multiple requests in a short period, contrasting with legitimate activity which would typically show sporadic or controlled access.

  - **Investigate potential for data leakage:** If confirmed as malicious, check for any signs of file writes or data exfiltration artifacts. Search for file creation events that could indicate that sensitive data was copied, possibly using other telemetry sources like network logs or file system events.

  - **Identify any related suspicious activity:** Investigate logs for other indicators of compromise that may accompany the Git clone request, such as unusual access attempts to other services or files on OpenCanary or surrounding infrastructure.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on source code integrity and the likelihood of malicious exploitation by an adversary seeking to gain access to sensitive information. Given that this is often a step in the broader context of data breaches or intellectual property theft, prompt investigation is essential.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if log sources for OpenCanary are misconfigured or if the environment is insufficiently monitored. Legitimate activities, such as internal testing or legitimate development work, may also result in Git clone requests. A related detection to consider is monitoring for unusual authentication attempts on the same OpenCanary node to enhance context around potential unauthorized access.

