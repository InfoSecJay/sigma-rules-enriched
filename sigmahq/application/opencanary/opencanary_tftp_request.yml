  ### Technical Context

  This Sigma rule detects TFTP request activity targeting an OpenCanary node. The behavior indicates potential data exfiltration attempts or unauthorized file transfers by an adversary. The likely attacker objective is to transfer files to or from the compromised network using the TFTP protocol, which is often exploited due to its lack of security features. This detection relates to the MITRE ATT&CK technique: Data Exfiltration over Command and Control Channel (T1041).

  The primary telemetry source is OpenCanary logs (specifically, logtype 10001) that track request activity made to the TFTP service. If malicious, this behavior could lead to significant data loss or compromise. This detection does NOT confirm that a successful exfiltration has occurred, as it merely indicates a request was made.

  ---

  ### Investigation Steps

  - **Review OpenCanary logs for TFTP requests:** Specifically look at logtype 10001, focusing on fields such as `request_type`, `filename`, and `client_ip`. Validate if the request is to an executable or sensitive file, which could indicate malicious intent.

  - **Verify request legitimacy by checking IP address:** Investigate the `client_ip` against known internal assets or frequent external sources. Look for unusual or unauthorized IP addresses that may suggest malicious activity.

  - **Understand expected behavior of TFTP service:** Compare the volume and type of TFTP requests with historical data. Legitimate requests usually consist of standard file formats (like configuration files), while requests for executables indicate potential misuse.

  - **Cross-reference with firewall logs:** Look for outbound connections that correspond to the TFTP requests (e.g., Event ID 5156 for Windows Firewall). Verify if any requests align with unusual outbound behavior, such as transfers to unrecognized destinations.

  - **Identify high-confidence indicators of malicious activity:** Look for patterns that deviate from regular usage, such as repeated requests from the same IP within a short time frame, which could signify automated exfiltration attempts.

  ---

  ### Prioritization

  This alert is of high severity as it involves potential data exfiltration through TFTP, which is a commonly exploited vector in attacks. The impact on an affected system can be significant, especially if sensitive data is being transferred out. Given that TFTP lacks security, the likelihood of malicious abuse is high.

  ---

  ### Blind Spots and Assumptions

  Detection relies on accurate OpenCanary configuration and logging for TFTP activity; misconfigurations could lead to missed alerts. Legitimate IT activities, such as system back-ups or updates, could trigger similar TFTP requests. A related detection to consider is any anomalous file uploads or downloads on other services monitored by OpenCanary to strengthen overall coverage against data exfiltration attempts.

