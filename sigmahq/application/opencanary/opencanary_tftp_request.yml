  ### Technical Context
  This detection rule identifies requests made to a Trivial File Transfer Protocol (TFTP) service running on an OpenCanary node. OpenCanary serves as a low-interaction honeypot that emulates various services to detect network-based attacks or unauthorized access attempts. In a typical threat scenario, an attacker may seek to exploit vulnerable services or conduct reconnaissance on the network, potentially using TFTP for data exfiltration or payload delivery.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Exfiltration (TA0010)** and **Data Transfer Size Limits (T1041)**. By intercepting requests to a TFTP service, defenders can investigate potential data exfiltration attempts or unauthorized access. The primary data sources providing evidence for this rule include application logs specifically from OpenCanary configured to monitor TFTP requests.

  ### Investigation Steps
  - **Review OpenCanary Logs**: Examine the logs generated by OpenCanary for any incoming TFTP requests, paying attention to the source IP addresses, timestamps, and the nature of the requests.
  - **Assess Network Traffic**: Analyze network traffic logs to identify any unusual patterns or connections to the OpenCanary TFTP service, including volumes of data being transferred and the frequency of requests.
  - **Identify Host Behavior**: Investigate the behavior of the host machine running OpenCanary. Look for indications of compromise or abnormal processes that may suggest the honeypot is being targeted for an attack.
  - **Cross-reference Suspicious IPs**: Cross-check any source IP addresses identified in the logs against threat intelligence feeds for any known malicious activity or associations with previous incidents.

  ### Prioritization
  The severity of this alert is high due to the implications of unauthorized access and potential data exfiltration via TFTP, which can indicate a significant breach of the enterprise's sensitive information.

  ### Blind Spots and Assumptions
  This detection logic assumes that the TFTP service is properly configured and visibility into OpenCanary logs is maintained. Potential gaps in coverage may arise if the attacker uses encrypted traffic or obfuscates their requests. Additionally, if logs from OpenCanary are not regularly monitored or if the service is configured incorrectly, this rule may not trigger as expected.

