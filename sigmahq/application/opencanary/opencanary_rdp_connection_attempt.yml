  ### Technical Context

  This Sigma rule detects connection attempts to the RDP service running on OpenCanary nodes. The detected behavior may indicate reconnaissance, lateral movement, or exploitation by an adversary attempting to gain unauthorized access to a system. The likely objective would be to establish a foothold in the environment for further exploitation or data exfiltration. This aligns with the MITRE ATT&CK tactics of Initial Access (T1078), Lateral Movement (T1021.001), and Persistence (T1133).

  The primary telemetry source is the OpenCanary application, specifically log type 14001, which tracks RDP connection attempts. If malicious, successful RDP access can lead to significant security impacts, such as unauthorized access to sensitive data and the potential for further network compromise. It is critical to note that this detection does NOT confirm successful access or malicious intent by itself; legitimate users may attempt connections for valid administrative purposes.

  ### Investigation Steps

  - **Review RDP connection logs:** Check OpenCanary logs (log type 14001) for connection attempts. Note the source IP addresses and timestamps to identify if they are from known remote locations or legitimate users.

  - **Identify the source of connection attempts:** Cross-reference the source IPs with a threat intelligence feed to determine if they are associated with known malicious actors.

  - **Examine user behavior:** Verify that the accounts attempting connections are expected to use RDP and have legitimate administrative roles. Use Windows Security Event ID 4624 or Sysmon Event ID 4624 to track successful authentication attempts.

  - **Check for failed login attempts:** Look for repeated connection failures in the log data, which may indicate a brute-force attack or unauthorized access attempts.

  - **Analyze host context:** Determine the role of the affected host. If it’s a critical system (e.g., a domain controller), prioritize the investigation and escalate as necessary.

  - **Monitor ongoing sessions:** If a connection is confirmed, observe for any subsequent actions taken by the connected user account to assess the potential impact and scope of the activity.

  ### Prioritization

  This alert is of high severity due to its potential impact on exposed systems, particularly if the target is critical infrastructure. The likelihood of malicious abuse is substantial, given that RDP is a common attack vector for lateral movement and subsequent compromise. This behavior is frequently weaponized, requiring prompt investigation.

  ### Blind Spots and Assumptions

  There are potential detection limitations, including the reliance on OpenCanary configuration and its visibility into all RDP connection attempts. Evasion techniques might involve encrypted connections or usage of legitimate credentials, which could bypass detection. Legitimate administrative tasks, such as remote maintenance or troubleshooting, may also trigger this alert. A related detection to consider is monitoring for successful authentications via RDP (Windows Event ID 4624), which can help correlate and confirm unauthorized access attempts.

