  ### Technical Context

  This Sigma rule detects SIP (Session Initiation Protocol) requests sent to an OpenCanary node, which simulates a vulnerable service to detect unwanted access attempts. The likely attacker objective is to probe or exploit VoIP services for reconnaissance or to establish communication channels. This behavior aligns with the MITRE ATT&CK framework under the tactic “Collection” and technique “Data from Network Shared Drives” (T1123).

  Primary telemetry sources include OpenCanary application logs specifically looking for log type 15001 that capture SIP requests. If malicious, an attacker could leverage this protocol to set up communication with compromised systems. However, this detection does NOT confirm an active compromise on its own without further exploration of the intent and outcomes of the SIP request.

  ---

  ### Investigation Steps

  - **Review detected SIP request details:** Examine OpenCanary logs for log type 15001. Check entries that include fields such as `source_ip`, `destination_port`, and `timestamp` to identify the origin and nature of the request.

  - **Identify legitimate SIP usage:** Confirm if any known applications or services within your infrastructure legitimately utilize SIP for communications. Compare the detected source IP against expected internal IP ranges or known external partners.

  - **Check for high-risk source IPs:** Cross-reference the `source_ip` with threat intelligence feeds or historical incident data to identify any known malicious actors associated with those IPs, which would indicate a high-confidence malicious indicator.

  - **Correlate with network traffic:** Use network monitoring tools to analyze if any abnormal traffic patterns coincide with the detection timing, such as unusual outbound SIP communication from other internal systems.

  - **Assess system roles:** Analyze the role of the affected OpenCanary node; understand the importance of this system in your architecture. An OpenCanary setup in more critical environments should prompt a higher urgency in investigation efforts.

  - **Verify absence of prior alerts:** Look for additional logs or alerts leading up to the SIP request, ensuring no earlier indicators of compromise occurred that may signify a larger malicious operation in progress.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential for attackers to exploit SIP services for unauthorized access or compromise of VoIP infrastructures. The likelihood of malicious abuse exists, as SIP is frequently targeted in attacks. Additionally, similar behaviors are often weaponized in advanced persistent threat scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities are limited by the reliance on complete and properly configured OpenCanary logs. Adversaries could use obfuscation tactics to disguise their activity, and benign SIP traffic from legitimate services could trigger false positives. A related detection to strengthen coverage would be monitoring for unusual API calls or behaviors in conjunction with any detected SIP requests, enhancing the context around potential reconnaissance activities.

