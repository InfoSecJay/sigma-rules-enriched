note: |
  ### Technical Context

  This rule detects login attempts to the HTTPPROXY service provided by OpenCanary, which is a honeypot designed to lure attackers. The likely attacker objective is to exploit the proxy service for lateral movement or command and control activities. This behavior is associated with the MITRE ATT&CK tactic of Initial Access (TA0001) and technique T1090: Connection Proxy. The primary telemetry source is OpenCanary logs, specifically events logged as logtype 7001. If successful, this activity could lead to deeper system compromise or unauthorized data access. Notably, this detection does NOT confirm that the probing attempt was successful or that any subsequent malicious activity occurred.

  ### Investigation Steps

  - **Review OpenCanary logs for logtype 7001:** Focus on entries that contain failed or successful login attempts. Key fields include timestamp, source IP, and user credentials attempted.

  - **Identify the service behavior:** Validate the expected function of HTTPPROXY, which should only serve authorized traffic. Legitimate use cases may include testing by internal personnel or automated security tools.

  - **Correlate with network traffic:** Check firewall or IDS logs for activities from the same source IP to identify any anomalous patterns. Look for unusual outbound connections shortly after the detected login attempt.

  - **Examine potential exfiltration indicators:** If any files were created or transferred on the OpenCanary node post-login event, identify them through file creation logs or disk activity logs to rule out misuse.

  - **Assess source IP reputation:** Investigate the originating IP address of the login attempt using threat intelligence tools to determine whether it is associated with known malicious activity.

  - **Monitor for subsequent commands:** Identify any follow-up commands or lateral movement attempts from the same host in correlation with the HTTPPROXY login attempt, indicated by unusual process creations or connections.

  ### Prioritization

  This alert has a high severity due to the potential vulnerability of the OpenCanary service, which could be abused for initial access or as a proxy for malicious activities. Given the nature of HTTP proxies, this behavior is commonly weaponized by adversaries for evasion and to establish command and control channels.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques, such as using legitimate credentials or employing proxy services not registered with OpenCanary. It assumes that the OpenCanary is configured correctly and logging all necessary events. False positives may occur from internal testing or maintenance activities that utilize the HTTPPROXY service. Companion detections involving anomalous outbound traffic or suspicious process creation should be considered to enhance overall detection capability.

