  ### Technical Context

  This rule detects attempts to proxy HTTP requests through an HTTPPROXY service on an OpenCanary node, indicating potential reconnaissance or exploitation attempts by an adversary. The likely attacker objective is to obfuscate command-and-control (C2) traffic or explore network services without alerting defensive measures. This detection aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and techniques such as Application Layer Protocol (T1090).

  The primary telemetry source is OpenCanary application logs, specifically looking for logtype 7001 that records proxy activity. If malicious, the security impact could include unauthorized data exfiltration or an adversary establishing a foothold in the network. It is crucial to note that this detection does NOT confirm successful exploitation or persistent access, merely an attempt to probe the environment.

  ---

  ### Investigation Steps

  - **Inspect OpenCanary logs for Event Type 7001:** Examine logs for logtype 7001 in the OpenCanary instance located under `/var/log/opencanary/opencanary.log`. Identify any repetitive or unusual proxy requests from specific source IPs that could indicate malicious activity.

  - **Identify source IP and request patterns:** Check for any requests coming from known malicious IP addresses or unusual geographic locations. Cross-reference this against threat intelligence sources to determine if the source is associated with previous malicious activities.

  - **Review adjacent system logs:** Look for correlated events in host-based logs, such as web server logs (Event ID 4688), that could show if any legitimate users or automated tools accessed the system around the same time.

  - **Validate expected behavior with configured services:** Confirm that typical HTTPPROXY requests are legitimate (e.g., requests from internal monitoring tools or other authorized services). If legitimate proxy requests are observed, document expected headers and endpoints.

  - **Examine for data exfiltration indicators:** Establish if any outgoing connections were made by OpenCanary to unusual domains not consistent with normal traffic patterns, utilizing DNS logging or network traffic analysis if available.

  - **Cross-check with historical alerting trends:** Determine the frequency of similar alerts over a defined period. If there's a recent surge in proxy attempts, additional investigation into network activity and potential compromises should be suggested.

  ---

  ### Prioritization

  The alert is of high severity, given its potential impact on system integrity and the likelihood of being abused for C2 operations. The behavior described is a common tactic among adversaries during the reconnaissance phase and should be treated with urgency.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by instances where legitimate proxies are utilized, such as internal monitoring tools or misconfigured software that may trigger alerts. Ensure OpenCanary is properly configured and integrated with all relevant log sources for comprehensive coverage. Additionally, consider companion detections, such as network flow monitoring for unusual outbound traffic, to strengthen overall situational awareness regarding potential malicious activity.

