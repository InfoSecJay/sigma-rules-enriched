title: Django Framework Exceptions
id: fd435618-981e-4a7c-81f8-f78ce480d616
status: stable
description: Detects suspicious Django web application framework exceptions that could
  indicate exploitation attempts
references:
- https://docs.djangoproject.com/en/1.11/ref/exceptions/
- https://docs.djangoproject.com/en/1.11/topics/logging/#django-security
author: Thomas Patzke
date: 2017-08-05
modified: 2020-09-01
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: application
  product: django
detection:
  keywords:
  - SuspiciousOperation
        # Subclasses of SuspiciousOperation
  - DisallowedHost
  - DisallowedModelAdminLookup
  - DisallowedModelAdminToField
  - DisallowedRedirect
  - InvalidSessionKey
  - RequestDataTooBig
  - SuspiciousFileOperation
  - SuspiciousMultipartForm
  - SuspiciousSession
  - TooManyFieldsSent
        # Further security-related exceptions
  - PermissionDenied
  condition: keywords
falsepositives:
- Application bugs
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential exploitation attempts targeting applications developed using the Django web framework. It focuses on exceptions logged by Django that can signify unsanctioned access, attempts to manipulate data, or malformed requests that are indicative of an attack. An attacker might leverage these exceptions to probe the web application for weaknesses and to potentially gain unauthorized access or escalate privileges.

  The likely threat scenario involves an attacker exploiting application vulnerabilities to affect the integrity and availability of the web application. This could also involve manipulating inputs to generate unexpected behaviors or leaking sensitive information. Relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) via techniques such as **Exploit Public-Facing Application** (T1190). The primary data source for this detection rule will be the Django application logs, particularly focusing on the logs that capture exception events.

  ### Investigation Steps
  - **Review Django Application Logs:** Check for instances of specific exception messages such as "SuspiciousOperation" and its subclasses, which could indicate attempted exploitation or misuse of the application.
  - **Analyze Request Patterns:** Look for unusual patterns in incoming requests that might correlate with the exceptions recorded, paying particular attention to parameters that may indicate a scanning or enumeration attempt.
  - **Assess User Activity:** Investigate the user accounts associated with these logged exceptions, particularly noting any unusual behavior or patterns that deviate from established norms.
  - **Correlate with Network Logs:** Cross-reference the exception logs with relevant network logs or Web Application Firewall (WAF) logs to identify any external IP addresses that are generating suspicious traffic patterns targeting the Django application.

  ### Prioritization
  This alert should be treated with medium priority as it indicates potentially malicious activity on a publicly-facing web application. The severity stems from the possibility of exploitation attempts that could lead to data breaches or service disruptions.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage due to application bugs that could trigger legitimate exceptions, leading to false positives. The detection logic assumes that relevant logging is enabled and properly configured in the Django application to capture all exceptions. Without adequate log retention policies and exception handling, the effectiveness of this detection rule could be diminished.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
