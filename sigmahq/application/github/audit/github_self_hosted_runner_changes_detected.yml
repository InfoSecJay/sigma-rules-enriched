title: Github Self Hosted Runner Changes Detected
id: f8ed0e8f-7438-4b79-85eb-f358ef2fbebd
status: test
description: |
  A self-hosted runner is a system that you deploy and manage to execute jobs from GitHub Actions on GitHub.com.
  This rule detects changes to self-hosted runners configurations in the environment. The self-hosted runner configuration changes once detected,
  it should be validated from GitHub UI because the log entry may not provide full context.
author: Muhammad Faisal (@faisalusuf)
date: 2023-01-27
references:
- https://docs.github.com/en/actions/hosting-your-own-runners/about-self-hosted-runners#about-self-hosted-runners
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#search-based-on-operation
tags:
- attack.impact
- attack.discovery
- attack.collection
- attack.persistence
- attack.privilege-escalation
- attack.initial-access
- attack.stealth
- attack.t1526
- attack.t1213.003
- attack.t1078.004
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'org.remove_self_hosted_runner'
    - 'org.runner_group_created'
    - 'org.runner_group_removed'
    - 'org.runner_group_runner_removed'
    - 'org.runner_group_runners_added'
    - 'org.runner_group_runners_updated'
    - 'org.runner_group_updated'
    - 'repo.register_self_hosted_runner'
    - 'repo.remove_self_hosted_runner'
  condition: selection
falsepositives:
- Allowed self-hosted runners changes in the environment.
- A self-hosted runner is automatically removed from GitHub if it has not 
  connected to GitHub Actions for more than 14 days.
- An ephemeral self-hosted runner is automatically removed from GitHub if it has
  not connected to GitHub Actions for more than 1 day.
level: low
note: |
  ### Technical Context

  This Sigma rule detects changes to self-hosted runners' configurations within GitHub environments, specifically monitoring actions such as adding or removing runners and modifying runner groups. The likely objective of an attacker could be to persist a foothold in the environment, exfiltrate sensitive data, or execute unauthorized workflows using compromised runners. This behavior aligns with the MITRE ATT&CK tactic of **Persistence (TA0003)** and the technique of **Account Manipulation (T1078.004)**.

  The primary telemetry source for this detection is GitHub's audit logs, specifically focusing on actions related to self-hosted runners. If these configuration changes are malicious, the security impact could involve unauthorized execution of code, leading to potential data breaches or disruption of services. However, this detection does NOT confirm intentional malicious activity on its own, as legitimate changes by authorized personnel can also trigger this alert.

  ### Investigation Steps

  - **Confirm action in GitHub UI:** Verify the recent changes by accessing the GitHub organization repository settings to view any entries in the audit log related to the self-hosted runners. Look for changes that align with the logged events from the detection.

  - **Review audit log entries:** Investigate specific Event IDs associated with the changes, such as `org.remove_self_hosted_runner` and `repo.register_self_hosted_runner`, focusing on who made the changes and the timestamps of these actions.

  - **Identify external access attempts:** Look for indications of unauthorized access to the GitHub account or repository, such as unusual login times or unknown IP addresses in the GitHub security logs.

  - **Differentiate legitimate modifications:** Evaluate the user accounts that made the changes—trusted users performing maintenance on the self-hosted runners can indicate benign activity, while changes made by unknown or suspicious accounts should raise flags.

  - **Correlate changes with system risk:** If a self-hosted runner is linked to high-risk repositories or sensitive projects, prioritize investigations of changes to those runners, especially if there are multiple changes in a short timeframe.

  ### Prioritization

  This alert is of **low severity** given its context but should not be ignored. While the configured self-hosted runners can have implications for broader security, the likelihood of abuse is generally lower unless they are exploited in conjunction with other malicious activities. As organizations increasingly use GitHub Actions, any unauthorized modification can be a precursor to further attacks, thus necessitating investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging is not correctly configured or if some actions are missed due to API rate limits. Legitimate activity, such as routine maintenance or automated scripts registering new runners, can trigger this alert. To enhance coverage, correlating this detection with user authentication logs (e.g., failed login attempts, new device registrations) could provide additional context about malicious intent.

