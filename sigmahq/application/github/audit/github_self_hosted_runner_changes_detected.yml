title: Github Self Hosted Runner Changes Detected
id: f8ed0e8f-7438-4b79-85eb-f358ef2fbebd
status: test
description: |
  A self-hosted runner is a system that you deploy and manage to execute jobs from GitHub Actions on GitHub.com.
  This rule detects changes to self-hosted runners configurations in the environment. The self-hosted runner configuration changes once detected,
  it should be validated from GitHub UI because the log entry may not provide full context.
author: Muhammad Faisal (@faisalusuf)
date: 2023-01-27
references:
- https://docs.github.com/en/actions/hosting-your-own-runners/about-self-hosted-runners#about-self-hosted-runners
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#search-based-on-operation
tags:
- attack.impact
- attack.discovery
- attack.collection
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.initial-access
- attack.t1526
- attack.t1213.003
- attack.t1078.004
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'org.remove_self_hosted_runner'
    - 'org.runner_group_created'
    - 'org.runner_group_removed'
    - 'org.runner_group_runner_removed'
    - 'org.runner_group_runners_added'
    - 'org.runner_group_runners_updated'
    - 'org.runner_group_updated'
    - 'repo.register_self_hosted_runner'
    - 'repo.remove_self_hosted_runner'
  condition: selection
falsepositives:
- Allowed self-hosted runners changes in the environment.
- A self-hosted runner is automatically removed from GitHub if it has not connected
  to GitHub Actions for more than 14 days.
- An ephemeral self-hosted runner is automatically removed from GitHub if it has not
  connected to GitHub Actions for more than 1 day.
level: low
note: |
  ### Technical Context
  This detection rule monitors changes to self-hosted runner configurations within GitHub Actions, which can be crucial for maintaining secure CI/CD pipelines. Self-hosted runners are systems managed by organizations to execute jobs triggered from GitHub. Attackers may attempt to alter runner configurations to introduce malicious code execution capabilities or to gain persistent access to the organization’s CI/CD environment. By manipulating self-hosted runners, attackers can execute arbitrary code in the build and deployment process, potentially leading to a code compromise.

  Relevant MITRE ATT&CK tactics/techniques associated with this rule include:
  - **T1546.001** - **Event Triggered Execution:** Malicious changes could be made to runners that trigger the execution of attacker-controlled code.
  - **T1078.004** - **Valid Accounts:** Attackers may create or modify runners to maintain access to resources.

  The primary data source for this detection is the GitHub audit log, which records events related to changes in self-hosted runners and requires audit log streaming to be enabled for full visibility.

  ### Investigation Steps
  - **Review audit logs:** Examine the GitHub audit logs for any recent events related to self-hosted runners, especially focusing on actions such as `org.remove_self_hosted_runner` and `repo.register_self_hosted_runner`.
  - **Validate runner configurations:** Check the GitHub interface to confirm the legitimacy of any changes detected, especially if removal or creation of runners has occurred.
  - **Monitor CI/CD pipeline activities:** Analyze the logs of your CI/CD pipelines to detect any unexpected behaviors or executions that may result from unauthorized runner modifications.
  - **Check for user activity:** Investigate any recent user account activity in GitHub to confirm if the changes correlate with any unauthorized or suspicious logins.

  ### Prioritization
  Despite its low severity rating, any unauthorized changes to self-hosted runners could pose significant risks, particularly if these changes enable an attacker to execute malware in a trusted environment. Therefore, such alerts should be investigated promptly to mitigate potential impact.

  ### Blind Spots and Assumptions
  This detection logic assumes that the audit log streaming for GitHub is properly configured and operational. Gaps in detection may exist if key events are not logged or if there is no visibility into previous changes made to runner configurations prior to enabling log streaming. Additionally, legitimate activities such as scheduled removals of runners due to inactivity could lead to false positives, requiring analysts to distinguish between abnormal and expected behavior effectively.

