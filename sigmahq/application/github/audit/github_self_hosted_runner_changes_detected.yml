title: Github Self Hosted Runner Changes Detected
id: f8ed0e8f-7438-4b79-85eb-f358ef2fbebd
status: test
description: |
  A self-hosted runner is a system that you deploy and manage to execute jobs from GitHub Actions on GitHub.com.
  This rule detects changes to self-hosted runners configurations in the environment. The self-hosted runner configuration changes once detected,
  it should be validated from GitHub UI because the log entry may not provide full context.
author: Muhammad Faisal (@faisalusuf)
date: 2023-01-27
references:
- https://docs.github.com/en/actions/hosting-your-own-runners/about-self-hosted-runners#about-self-hosted-runners
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#search-based-on-operation
tags:
- attack.impact
- attack.discovery
- attack.collection
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.initial-access
- attack.t1526
- attack.t1213.003
- attack.t1078.004
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'org.remove_self_hosted_runner'
    - 'org.runner_group_created'
    - 'org.runner_group_removed'
    - 'org.runner_group_runner_removed'
    - 'org.runner_group_runners_added'
    - 'org.runner_group_runners_updated'
    - 'org.runner_group_updated'
    - 'repo.register_self_hosted_runner'
    - 'repo.remove_self_hosted_runner'
  condition: selection
falsepositives:
- Allowed self-hosted runners changes in the environment.
- A self-hosted runner is automatically removed from GitHub if it has not 
  connected to GitHub Actions for more than 14 days.
- An ephemeral self-hosted runner is automatically removed from GitHub if it has
  not connected to GitHub Actions for more than 1 day.
level: low
note: |
  ### Technical Context

  This rule detects modifications to GitHub Actions self-hosted runners, including removals, updates, and group configurations. Such changes may indicate an adversary attempting to persist in a network by leveraging self-hosted runners for executing unauthorized code or evading detection. Relevant MITRE ATT&CK tactics include Persistence (T1526) and Privilege Escalation (T1078.004). The primary telemetry source is GitHub Audit logs, specifically entries relating to actions on self-hosted runners. If malicious, the security impact can include unauthorized execution of code or data exfiltration. This detection alone does NOT confirm malicious intent; it may indicate legitimate administrative actions.

  ### Investigation Steps

  - **Review audit log entries for changes:** Examine GitHub Audit Log entries related to self-hosted runner actions (event types: `org.remove_self_hosted_runner`, `repo.register_self_hosted_runner`) focusing on the `created_at` and `action` fields to identify the context and timing of changes.

  - **Verify against expected configurations:** Check the GitHub organization or repository settings via the GitHub UI to validate that the detected changes align with approved admin activities or recent development actions.

  - **Identify high-confidence malicious indicators:** Look for recent changes to self-hosted runners that were followed by unusual job executions or workflows triggered unexpectedly from these runners, particularly those using non-standard branches or pull requests.

  - **Assess frequency of changes:** Determine if there are multiple modifications occurring within a short timeframe. Unusual patterns in changes may indicate an adversary's attempt to maintain or modify persistence mechanisms.

  - **Baseline legitimate activities:** Confirm expected self-hosted runner modifications from scheduled maintenance or infrastructure scaling. Changes from known, authorized administrators can mitigate incident response efforts.

  ### Prioritization

  The severity of this alert is moderate due to the potential impact on the environment if a compromised self-hosted runner executes malicious tasks. The likelihood of abuse is significant, as this behavior aligns with common tactics used by adversaries to maintain access. Self-hosted runners are often weaponized for executing code in a trusted environment.

  ### Blind Spots and Assumptions

  The detection may miss configurations changed outside the GitHub interface, such as through APIs if audit logging is not properly configured. Legitimate activities, such as routine admin management or automated runner lifecycle events, may trigger this alert. A related detection might be unauthorized GitHub Actions run executions, further enhancing coverage on potential misuse of self-hosted runners.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
