note: |
  ### Technical Context
  This detection rule identifies potential security risks in GitHub configurations by flagging when critical security features are disabled by users. The rule's primary focus is on configurations that can compromise an organization's security posture, such as disabling OAuth app access restrictions, two-factor authentication requirements, and advanced security features. Attackers may exploit such misconfigurations to conduct unauthorized access or exfiltrate sensitive data, thereby seeking to maintain persistence and evade detection.

  By analyzing changes to these security settings, organizations can quickly respond to potential insider threats or account compromises, which may align with tactics like Credential Access (TA-0006), Defense Evasion (TA-0005), and Persistence (TA-0003). Specifically, techniques T1556 (Credential Dumping) may be leveraged if attackers have gained access to modify configurations. The primary data source for this detection is the GitHub audit log, which documents security-related modifications within the organization.

  ### Investigation Steps
  - **Review Audit Logs:** Examine GitHub audit logs for specific actions related to disabled security features, ensuring to correlate timestamps and affected accounts.
  - **Assess Access Rights:** Check the permissions and roles of the user who performed the disabling action to understand their authority and investigate if unusual access patterns were present.
  - **Confirm Configuration Context:** Analyze the surrounding context of the configuration changes, such as repository activity before and after the changes, to identify any suspicious behavior or anomalies.
  - **Cross-Reference Events:** Validate the detected changes against other telemetry sources (e.g., GitHub webhooks, user activity logs) to assess if they correlate with known malicious behavior or unauthorized attempts to access sensitive repositories.

  ### Prioritization
  This alert carries a high severity due to the significant risks associated with disabling critical security measures within a GitHub organization. The likelihood of exploitation is increased if such configurations are altered without adequate justification or oversight.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise if the audit log streaming feature is not enabled, as specified in the documentation. The rule assumes that all users acting upon the configurations have valid administrative privileges, which may not always hold true in cases of credential compromise. Robust configurations and comprehensive logging across GitHub services are necessary for this alert to function as intended, emphasizing the need for proactive monitoring and review of security settings.

