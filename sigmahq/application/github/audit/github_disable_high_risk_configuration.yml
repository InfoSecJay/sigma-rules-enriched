note: |
  ### Technical Context

  This Sigma rule detects the disabling of critical security features in GitHub, such as Advanced Security, OAuth app access restrictions, and two-factor authentication requirements. The likely attacker objective is to weaken security controls, potentially allowing for unauthorized access or exploitation of vulnerable repositories. This behavior aligns with MITRE ATT&CK tactics, particularly **Credential Access** (T1556) and **Defense Evasion** (T1089).

  The primary telemetry source is GitHub's audit logs, which must be enabled for proper log collection. If malicious, the security impact could include unauthorized access to sensitive code or configuration data. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions by approved users may trigger the alert.

  ### Investigation Steps

  - **Review the audit log entry description**: Identify the specific action that triggered the alert, such as `business_advanced_security.disabled`. This indicates that a security feature was disabled, warranting further investigation into the user initiating the change.

  - **Identify the user responsible for the action**: Check the `actor` field in the audit log for Event ID indicative of the modification (e.g., `org.disable_oauth_app_restrictions`). Compare their role against organizational policies to determine if they have authorization to make this change.

  - **Check for concurrent suspicious activities**: Investigate additional events in the audit log surrounding the same timeframe (e.g., actions like enabling or disabling repository settings) that could suggest malicious intent. Also, review `event_timestamp` and `repository` fields for context on critical assets.

  - **Analyze historical settings against recent changes**: Review the security settings before and after the change using GitHub's API or audit logs. Confirm if security measures were previously enforced, and determine how this change contradicts established security policies.

  - **Evaluate benign configuration activities**: Confirm expected organizational changes, such as a scheduled review or security assessment, by communicating with relevant teams. Established procedures may justify recent changes if adequately documented.

  - **Identify high-confidence indicators of abuse**: Look for patterns of disabling critical security features across multiple repositories or users without prior notice, as this may indicate a coordinated effort to compromise organizational security.

  ### Prioritization

  The severity of this alert is high due to the potential for significant security breaches if critical features are disabled. The likelihood of malicious abuse is considerable, especially if executed by unauthorized users or if the changes coincide with increased suspicious activity in the environment. This behavior is commonly weaponized by adversaries seeking to bypass security controls.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations; GitHub's audit log streaming must be actively enabled to capture these events. Additionally, legitimate administrative actions could inadvertently trigger this alert, particularly during periods of restructuring. A related detection to consider is the monitoring of unusual authentication patterns, such as multiple failed login attempts followed by security feature adjustments, which could enhance overall security coverage.

