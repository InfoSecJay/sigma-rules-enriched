note: |
  ### Technical Context

  This Sigma rule detects the disabling of critical security features within a GitHub organization, such as advanced security settings and OAuth app restrictions. These actions can significantly weaken an organization’s security posture, potentially allowing unauthorized access or manipulation of repositories. The primary MITRE ATT&CK techniques relevant here are "Credential Access" (T1556) and "Defense Evasion" (T1562), as they relate to circumventing established security measures.

  The primary telemetry source is GitHub's audit logs, which must have audit log streaming enabled to capture these actions. If malicious, such alterations could lead to data breaches or unauthorized code changes, dramatically impacting the organization's security. This detection does not confirm malicious intent on its own, as similar actions may be performed by authorized personnel for legitimate reasons.

  ### Investigation Steps

  - **Verify log source availability:** Ensure GitHub audit log streaming is enabled and logs are accessible for analysis (refer to GitHub documentation for enabling streaming).

  - **Identify the user responsible:** Review the audit log entries for user details, timestamp, and actions recorded (check fields like `actor.login`, `action`, and `created_at` for specific events).

  - **Assess the reason for the change:** Check if the user who disabled the security features is an approved administrator or owner. Known legitimate actions might include routine updates or adjustments to security settings tied to specific needs.

  - **Examine the scope of affected features:** Analyze the specific security features disabled (note actions such as `org.disable_two_factor_requirement` or `repo.advanced_security_disabled`) to understand potential security implications.

  - **Correlate with recent user activity:** Look for patterns or recent activities by the user (Event timestamps, commit histories) to identify if this change aligns with atypical behavior indicating potential malicious intent (unusual login times, changes from unapproved IP addresses).

  ### Prioritization

  This alert is of high severity due to the critical nature of the disabled security features, which expose the system to significant risk of credential theft and unauthorized access. The likelihood of exploitation is high, as these features are commonly targeted by adversaries to facilitate further attacks.

  ### Blind Spots and Assumptions

  The detection may not identify instances where legitimate users disable features for approved reasons, leading to potential false positives. Successful detection requires proper configuration of audit log streaming in GitHub. Additionally, routine administrative tasks, such as system maintenance, may also trigger this alert. A companion detection rule focusing on unauthorized user access changes can enhance overall coverage in detecting malicious activities.

