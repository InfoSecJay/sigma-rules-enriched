note: |
  ### Technical Context
  This rule detects the addition or invitation of new members to a GitHub organization, focusing on actions labeled as `org.add_member` and `org.invite_member` in the audit logs. Attackers may exploit access to a GitHub organization to add unauthorized users, potentially facilitating further malicious activities, such as code exfiltration or unauthorized repository modification. As organizations increasingly use GitHub for collaboration and source code management, monitoring changes in organizational membership is essential for maintaining security.

  This detection is relevant to MITRE ATT&CK tactics, particularly under the Persistence tactic (ID: TA0003) and the technique for Adding or Inviting Members to a Group (ID: T1136.003). The primary data source for this detection is the GitHub audit logs, specifically those logs generated when member management actions occur within an organization.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze the GitHub audit logs for recent entries under the actions `org.add_member` or `org.invite_member` to identify any unexpected changes in organization membership.
  - **Validate User Context**: Cross-reference the newly added members against known personnel lists to confirm that these additions are legitimate and sanctioned by the organization.
  - **Check Permissions and Roles**: Investigate the roles assigned to the new members to ensure they do not have excessive permissions which could lead to unauthorized access to sensitive repositories.
  - **Monitor for Subsequent Actions**: After identifying new members, monitor for any subsequent actions these users take, such as accessing sensitive repositories or making significant commits, which could indicate malicious intent.

  ### Prioritization
  Given the potential for malicious exploitation of GitHub organization membership, this alert should be treated with a moderate severity level. Unauthorized access or modifications through newly added members could significantly impact the integrity of source code and other sensitive data.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if audit log streaming is not enabled or if there are delays in log ingestion. The detection logic assumes that any membership change should be scrutinized unless explicitly approved by the organization. Additionally, this rule relies on the complete and timely availability of GitHub audit logs, which requires appropriate configuration on the part of the organization. Analysts should be aware that false positives can occur if the organization regularly adds new members as part of approved onboarding processes.

