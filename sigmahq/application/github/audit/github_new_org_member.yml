  ---

  ### Technical Context

  This Sigma rule detects the addition or invitation of a new member to a GitHub organization, a behavior often indicative of attempts to escalate privileges or maintain persistence in a compromised environment. Attackers may use this tactic to establish control over a repository, especially after gaining access to the organization’s accounts. This aligns with the MITRE ATT&CK tactic "Persistence" and the technique "Add Member to Group" (T1136.003).

  The primary telemetry sources for this detection are GitHub's audit logs, specifically the actions "org.add_member" and "org.invite_member." If this activity is malicious, it can lead to unauthorized access to sensitive repositories or code. Importantly, this detection does NOT confirm malicious intent on its own; benign organizational changes can trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review audit log entries:** Check GitHub audit logs (specifically the Audit Log API) for entries associated with "org.add_member" or "org.invite_member." Note the timestamp, user responsible, and the affected organization.

  - **Identify the source user:** Determine if the user performing the addition or invitation has previously logged in or has a history of involvement with the organization. Analyze their prior activity within GitHub using User API endpoints.

  - **Check for organizational policy compliance:** Investigate if this addition aligns with your organization's policies on role modifications. Legitimate activity often includes pre-approved members added during a formal onboarding process.

  - **Assess the user's permissions:** Utilize GitHub’s API (GET /orgs/{org}/members/{username}/membership) to evaluate the permissions of the newly added member. High privileges for unknown users can indicate malicious activity.

  - **Cross-reference with other alerts:** Look for any other security alerts related to the same user or similar timestamps to identify patterns of suspicious activity. This includes failed attempts to access sensitive data or unusual push events.

  - **Validate invitation procedures:** Ensure that an invitation was properly verified with a secondary user or through external communication channels. Confirm whether potential suspicious invitations were sent without proper approval.

  ---

  ### Prioritization

  This alert indicates potential unauthorized access to a GitHub organization, affecting any critical systems connected to these repositories. Given the ease of abuse and the high value of code repositories, this behavior is often weaponized in targeted attacks. Alerts with this context should be treated with appropriate urgency.

  ---

  ### Blind Spots and Assumptions

  This detection may miss cases where legitimate members are added through automated processes or legitimate administrative actions without corresponding audit entries. Reliance on GitHub’s audit log streaming capability is essential for accurate detection; any misconfiguration can result in missed alerts. Additionally, administrative operations such as automated onboarding systems can trigger similar alerts and should be investigated to differentiate between malicious and benign actions. Related detections include monitoring for unusual repository changes or access patterns to gain fuller context on potential compromises.

