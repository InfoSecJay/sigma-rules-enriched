title: Github Outside Collaborator Detected
id: eaa9ac35-1730-441f-9587-25767bde99d7
status: test
description: |
  Detects when an organization member or an outside collaborator is added to or removed from a project board or has their permission level changed or when an owner removes an outside collaborator from an organization or when two-factor authentication is required in an organization and an outside collaborator does not use 2FA or disables 2FA.
author: Muhammad Faisal (@faisalusuf)
date: 2023-01-20
references:
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-two-factor-authentication-for-your-organization/requiring-two-factor-authentication-in-your-organization
tags:
- attack.privilege-escalation
- attack.persistence
- attack.collection
- attack.t1098.001
- attack.t1098.003
- attack.t1213.003
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'org.remove_outside_collaborator'
    - 'project.update_user_permission'
  condition: selection
falsepositives:
- Validate the actor if permitted to access the repo.
- Validate the Multifactor Authentication changes.
level: medium
note: |
  ### Technical Context

  This rule detects changes to GitHub organization membership, specifically when an outside collaborator is added or removed from a project board, or when their permissions level is altered. Additionally, it identifies instances where an outside collaborator disables two-factor authentication (2FA) or fails to meet 2FA requirements for the organization. The likely attacker objective is gaining unauthorized access or escalated permissions within a repository, potentially leading to data exfiltration or code manipulation.

  This detection maps to the MITRE ATT&CK techniques for Privilege Escalation (T1098), Persistence (T1098.001), and Collection (T1213.003). The primary telemetry source is the GitHub audit log, which requires log streaming to be enabled. If this behavior is malicious, it poses a significant risk, as unauthorized permissions can compromise sensitive repository content. However, this detection does NOT confirm malicious intent or an actual breach on its own, as legitimate changes by authorized users can trigger the alert.

  ### Investigation Steps

  - **Validate the actor's permissions:**
    Review the event details for the actor involved in the permission change by checking the `actor` field in the audit logs (`action`, `actor` details). Cross-reference with your organization's access policies to ensure that changes were intentional and documented.

  - **Check for legitimate role changes:**
    Review the organization's member roles within the GitHub interface and compare the audit log entries. Legitimate activities typically involve clearly documented role assignments or alterations consistent with organizational procedures.

  - **Identify high-confidence malicious indicators:**
    Investigate frequent changes (e.g., multiple outside collaborators added or removed within a short timeframe) which could indicate account compromise. Focus on events such as `org.remove_outside_collaborator` and `project.update_user_permission`.

  - **Monitor for 2FA compliance:**
    Check the log for 2FA status changes of outside collaborators. Events indicating 2FA was disabled or not enabled should be prioritized. Evaluate the `two_factor` field in the log entries for any discrepancies.

  - **Review audit log configuration:**
    Ensure that audit logs are being properly streamed and retained as per organizational policy to aid in detection. Check if the configuration matches documentation on GitHub audit logging.

  ### Prioritization

  The impact of alerts from this detection can be significant, especially if it involves critical repositories or sensitive data. Given the potential for malicious abuse via improper permissions or account management, these alerts should be treated with medium severity. This behavior is weaponized by adversaries attempting to manipulate access to repositories.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users changing their permissions or disabling 2FA without malicious intent, which can lead to false positives. Successful detection requires that the audit log streaming feature is properly configured. Activities such as routine addition of collaborators for temporary projects may inadvertently trigger the alert but should not necessarily raise concern if documented. Companion detections could include monitoring for changes to repository settings or unusual access patterns by users to bolster overall security posture.

