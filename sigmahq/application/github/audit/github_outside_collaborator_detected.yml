title: Github Outside Collaborator Detected
id: eaa9ac35-1730-441f-9587-25767bde99d7
status: test
description: |
  Detects when an organization member or an outside collaborator is added to or removed from a project board or has their permission level changed or when an owner removes an outside collaborator from an organization or when two-factor authentication is required in an organization and an outside collaborator does not use 2FA or disables 2FA.
author: Muhammad Faisal (@faisalusuf)
date: 2023-01-20
references:
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#audit-log-actions
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-two-factor-authentication-for-your-organization/requiring-two-factor-authentication-in-your-organization
tags:
- attack.privilege-escalation
- attack.persistence
- attack.collection
- attack.t1098.001
- attack.t1098.003
- attack.t1213.003
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'org.remove_outside_collaborator'
    - 'project.update_user_permission'
  condition: selection
falsepositives:
- Validate the actor if permitted to access the repo.
- Validate the Multifactor Authentication changes.
level: medium
note: |
  ### Technical Context
  This detection rule identifies significant changes in GitHub project boards that may indicate potential security risks or mismanagement of permissions. Specifically, it tracks when an organization member or an outside collaborator is added to or removed from a project board, or if their permission levels are changed. Additionally, it detects when an owner removes an outside collaborator and when two-factor authentication (2FA) is not used or disabled by an outside collaborator in an organization that requires it.

  In a threat scenario, attackers may attempt to gain unauthorized access to sensitive repositories by exploiting weaknesses in access controls, manipulating collaborator permissions, or bypassing security measures, such as two-factor authentication. The objectives of such actions could range from data exfiltration to disruption of services.

  Relevant MITRE ATT&CK techniques include:
  - **T1098.001**: Account Manipulation - Adding or removing collaborators increases the potential for unauthorized access within a project.
  - **T1098.003**: Permission Changes - Changing user permissions can grant attackers elevated access to sensitive resources.
  - **T1213.003**: Data from Cloud Storage - Unmonitored access or changes to external collaborators could lead to data theft from repositories.

  Primary data sources for this detection are GitHub audit log entries, which capture actions related to project permissions and user management.

  ### Investigation Steps
  - **Review Audit Logs**: Examine the GitHub audit logs to identify any unexpected additions or removals of collaborators or changes in permission levels, focusing particularly on outside collaborators.
  - **Analyze 2FA Status**: Check the status of two-factor authentication for any outside collaborators to ensure compliance with organizational security policies; investigate incidents where 2FA is disabled or not implemented.
  - **Cross-reference User Actions**: Validate the legitimacy of user actions by comparing them against organizational policies and user roles within the project. Look for anomalies related to the timing and frequency of changes made.
  - **Consult with Project Owners**: Reach out to project owners for confirmation on changes involving outside collaborators to verify that appropriate approvals were obtained and that no unauthorized access has occurred.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized access through improper permission handling and the likelihood of such actions occurring if security practices are not upheld.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the audit log streaming feature is not enabled, as the rule relies on logs that document permission changes and collaborator actions. Additionally, the detection logic assumes that any changes made to outside collaborators are inherently suspicious without context; thus, some legitimate administrative actions may trigger false positives. It is also required that proper logging configurations are in place to capture all relevant audit log events for accurate detection functionality.

