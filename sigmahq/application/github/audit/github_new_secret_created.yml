  condition: selection
falsepositives:
- This detection cloud be noisy depending on the environment. It is recommended 
  to keep a check on the new secrets when created and validate the "actor".
level: low
note: |
  ### Technical Context

  This Sigma rule detects the creation of secrets in GitHub, specifically within organizations, environments, codespaces, or repositories. Such behavior may indicate an attacker attempting to collect and store sensitive information, such as access tokens or API keys, thereby elevating their access or maintaining persistence within the environment. This action aligns with the MITRE ATT&CK technique "Account Manipulation" (T1078.004) under the tactics of Persistence and Privilege Escalation.

  The primary telemetry source is GitHub's audit logs, requiring the audit log streaming feature to be enabled. If malicious, the impact could be significant, as it could allow unauthorized access to sensitive resources or facilitate future attacks. However, it is important to note that this detection does NOT confirm malicious intent on its own; legitimate developers may create secrets as part of regular operations.

  ### Investigation Steps

  - **Verify the actor's identity:** Check the `actor` field in the audit log entry (Event ID related to GitHub audit logs) to confirm whether the user creating the secret has legitimate access and a valid reason for this action.

  - **Examine timing and context:** Review the timestamp of the secret creation against recent activity in the repository or organization to identify any unusual patterns or anomalous behaviors that coincide with the event.

  - **Identify secret usage:** Check for subsequent API calls or actions that utilize the secret for operations (such as deploying or performing actions against the repository) to assess if the secret is potentially being leveraged for malicious actions.

  - **Look for benign behavior:** Document and verify common legitimate activities surrounding secrets in your environment, such as planned CI/CD updates or notifications from approved team members regarding the creation of new secrets.

  - **Review other audit log entries:** Cross-reference with other audit log entries (e.g., actions like `repo.create_actions_secret`, `org.create_actions_secret`) on the same day to identify patterns or indicators of a larger attack strategy.

  - **Assess organizational policy compliance:** Check if this secret creation aligns with organizational policies and best practices by reviewing internal guidelines and documentation on the use of secrets in GitHub.

  ### Prioritization

  This alert is low severity due to its context-dependent nature; while it may indicate potential risk, not all secret creations are malicious. The likelihood of abuse is moderate, especially if unusual access patterns or accounts are involved. As secret management is a common practice in CI/CD workflows, proactive monitoring and policy violations should be determined based on additional context.

  ### Blind Spots and Assumptions

  This detection may have limitations since legitimate activities can trigger alerts, such as routine secret rotation in CI/CD workflows. Reliable detection depends on ensuring the audit log streaming feature is enabled and operational. Additionally, a related detection to monitor would be "suspicious API calls" that utilize these secrets, thereby enhancing coverage against accidental or malicious uses of newly created secrets.

