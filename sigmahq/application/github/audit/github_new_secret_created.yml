title: Github New Secret Created
id: f9405037-bc97-4eb7-baba-167dad399b83
status: test
description: Detects when a user creates action secret for the organization, 
  environment, codespaces or repository.
author: Muhammad Faisal (@faisalusuf)
date: 2023-01-20
