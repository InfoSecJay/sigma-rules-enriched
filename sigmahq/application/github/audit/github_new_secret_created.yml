note: |
  ### Technical Context

  This Sigma rule detects the creation of secrets in GitHub repositories, environments, or organizations, which can be leveraged by attackers to gain access to sensitive information or perform unauthorized actions. The likely attacker objective would be to establish persistence through the exploitation of action secrets, facilitating further access or lateral movement. This activity correlates with the MITRE ATT&CK technique for "Application Layer Protocol" (T1078.004) under the tactics of defense evasion, persistence, and privilege escalation.

  Primary telemetry sources include GitHub audit logs, specifically focusing on actions where secrets are created. If this behavior is malicious, it can compromise sensitive data or access tokens, enabling attackers to manipulate workflows or gain unauthorized privileges. It is critical to note that this detection does NOT confirm malicious intent on its own; legitimate developers may create secrets for valid operational reasons.

  ### Investigation Steps

  - **Review audit log details:** Examine GitHub audit logs for the specific actions logged (e.g., `codespaces.create_an_org_secret`, `org.create_actions_secret`, etc.) for Event ID entries. Validate the actor making the change and compare against known users who have legitimate access.

  - **Check for unexpected user activity:** Investigate the actor's recent actions in the audit logs to identify anomalous behavior patterns or deviations from expected workflows. Legitimate users may routinely create secrets while unusual access patterns may indicate compromise.

  - **Correlate with repository activity:** Look at recent commits or changes in the corresponding repository (Audit log type: `repo_events`). Confirm if the secret creation aligns with legitimate repository management or if it coincides with suspicious activities.

  - **Verify secret usage:** Search for instances of the created secrets in workflows or actions that may trigger deployments (e.g., Action log types). Confirm if the secrets are being utilized in operations within authorized scope, as misuse may indicate malicious intent.

  - **Cross-reference with named users:** Identify the organization or repository role of the user creating the secret. Users without expected privileges or new additions to the repository should be scrutinized further.

  ### Prioritization

  This alert is rated low in severity as it may occur frequently without malicious intent. However, if a high-privilege user unexpectedly creates secrets without prior context, it may indicate elevated risk. Such behavior can sometimes be weaponized to facilitate lateral movement or data exfiltration, warranting prompt review.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via legitimate user activity that might trigger the same alerts, leading to false positives. The audit log streaming feature must be enabled for reliable alerting, and without it, detection coverage diminishes. Legitimate secret creations may also happen routinely during development cycles. A related detection to consider is monitoring for secret usage in workflows to catch any unauthorized access attempts leveraging those secrets.

