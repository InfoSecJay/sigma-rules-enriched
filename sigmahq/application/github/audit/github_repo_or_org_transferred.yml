title: Github Repository/Organization Transferred
id: 04ad83ef-1a37-4c10-b57a-81092164bf33
status: test
description: Detects when a repository or an organization is being transferred to
  another location.
references:
- https://docs.github.com/en/repositories/creating-and-managing-repositories/transferring-a-repository
- https://docs.github.com/en/organizations/managing-organization-settings/transferring-organization-ownership
- https://docs.github.com/en/migrations
- https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise#migration
author: Romain Gaillard (@romain-gaillard)
date: 2024-07-29
tags:
- attack.persistence
- attack.exfiltration
- attack.t1020
- attack.t1537
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'migration.create'         # A migration file was created for transferring data from a source location (such as a GitHub.com organization or a GitHub Enterprise Server instance) to a target GitHub Enterprise Server instance.
    - 'org.transfer_outgoing'         # An organization was transferred between enterprise accounts.
    - 'org.transfer'         # An organization was transferred between enterprise accounts.
    - 'repo.transfer_outgoing'         # A repository was transferred to another repository network.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ### Technical Context
  This detection rule identifies when a repository or organization within GitHub is transferred from one location to another. Such transfers can indicate legitimate administrative actions but may also signify malicious activities, such as an attacker attempting to exfiltrate code or other sensitive resources to an external GitHub account. If adversaries gain access to an organization's GitHub environment, they might transfer repositories to evade security measures, hide their actions, or compromise code integrity.

  The relevant MITRE ATT&CK tactics/techniques for this detection include:
  - **Persistence (T1078)**: Gaining and maintaining access through methods such as transferring ownership of repositories.
  - **Exfiltration (T1020)**: Transferring data out of the organization’s control, which could include repository content and intellectual property.

  Primary data sources for this detection will be:
  - GitHub audit logs, specifically indicating actions such as `migration.create`, `org.transfer_outgoing`, and `repo.transfer_outgoing`. Ensure that the audit log streaming feature is enabled to capture these events effectively.

  ### Investigation Steps
  - **Review GitHub Audit Logs**: Investigate the audit logs for entries corresponding to repository or organization migrations, particularly looking for actions such as `org.transfer_outgoing` or `repo.transfer_outgoing`.
  - **Correlate with User Activity**: Check user activity leading up to the transfer for any unauthorized access or suspicious account behavior, such as logins from unusual locations or at odd hours.
  - **Analyze Recent Permissions Changes**: Examine any recent changes to repository or organization permissions, ensuring that only authorized users had the ability to initiate transfers.
  - **Identify Transferred Assets**: Document the specific repositories or organizations that were transferred, and assess the potential impact and relevance of the transferred assets in the context of your organization’s intellectual property.

  ### Prioritization
  The severity of this alert is medium due to the potential impact on organizational security and the likelihood of misuse during unauthorized access scenarios. While legitimate transfers can occur, any unexpected migration should be investigated swiftly to mitigate risks.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage could arise from missed log entries if the audit log streaming feature is not enabled, or if logs are not retained for sufficient durations. The detection logic assumes that all migrations can be captured accurately, but in instances of log deletion or tampering, this may not hold true. Adequate configuration of GitHub audit logs is essential for the alert to function correctly, emphasizing the importance of monitoring and retention policies to capture these events adequately.

