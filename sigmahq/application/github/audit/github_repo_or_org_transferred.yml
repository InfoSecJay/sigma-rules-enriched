title: Github Repository/Organization Transferred
id: 04ad83ef-1a37-4c10-b57a-81092164bf33
status: test
description: Detects when a repository or an organization is being transferred 
  to another location.
references:
- https://docs.github.com/en/repositories/creating-and-managing-repositories/transferring-a-repository
- https://docs.github.com/en/organizations/managing-organization-settings/transferring-organization-ownership
- https://docs.github.com/en/migrations
- https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise#migration
author: Romain Gaillard (@romain-gaillard)
date: 2024-07-29
tags:
- attack.persistence
- attack.exfiltration
- attack.t1020
- attack.t1537
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'migration.create'         # A migration file was created for transferring data from a source location (such as a GitHub.com organization or a GitHub Enterprise Server instance) to a target GitHub Enterprise Server instance.
    - 'org.transfer_outgoing'         # An organization was transferred between enterprise accounts.
    - 'org.transfer'         # An organization was transferred between enterprise accounts.
    - 'repo.transfer_outgoing'         # A repository was transferred to another repository network.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the transfer of GitHub repositories or organizations, specifically tracking actions related to migration and ownership transfer. An attacker may aim to exfiltrate sensitive code, shift control of resources, or hide activities through such transfers. This behavior is linked to the MITRE ATT&CK tactic of Persistence (T1108) and Exfiltration (T1020), leveraging techniques like Manipulation of Data Transfer or Software Deployment.

  The primary telemetry sources include GitHub audit logs, specifically tracking actions associated with repository and organization management (e.g., `migration.create`, `org.transfer`, `repo.transfer_outgoing`). If malicious, the impact could be significant, resulting in the loss of control over proprietary code or sensitive data. Importantly, this detection does not confirm malicious intent on its own; legitimate transfers may occur during administrative activities.

  ### Investigation Steps

  - **Check audit logs for transfer events**: Review GitHub audit logs for event types `migration.create`, `org.transfer`, and `repo.transfer_outgoing`. Verify user and timestamp details to determine if the transfer is legitimate or anomalous.

  - **Identify the user initiating the transfer**: For the detected events, check the `actor` field in the audit log. Compare the initiating user’s normal behavior and roles against expected user activity. Legitimate organizational changes should align with known personnel or scheduled project transitions.

  - **Analyze repository history**: Investigate the repository details linked to the transfer events. Check for recent commits, pull requests, or repository collaborators. Sudden transfers of active or sensitive repositories without documented reasons warrant further examination.

  - **Validate administrative activity**: If the transfer correlates with scheduled administrative actions, confirm this against internal calendars or communication. Legitimate transfers typically involve prior notice and are documented within project management platforms.

  - **Review associated project notifications**: Investigate if there were any preceding administrative announcements about the transfer on communication channels (e.g., Slack, email). Legitimate transfers should come with documented warnings to team members.

  - **Look for related suspicious patterns**: Analyze if the transfer coincides with other suspicious activities, such as unusual access patterns or sudden changes to repository permissions (Event ID tracking). Malicious actors may work to obfuscate their actions, pointing to a need for a multi-faceted review.

  ### Prioritization

  This alert is medium severity due to the potential for significant operational disruption if sensitive repositories are maliciously transferred. The likelihood of this behavior being weaponized is growing, particularly since attackers continuously seek efficient exfiltration strategies for valuable code and configurations.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement of enabled audit log streaming on GitHub. Without this setup, transfer activities may go untracked, creating blind spots. Legitimate activities could also trigger this alert, especially during routine organizational restructuring. A related detection that strengthens coverage involves monitoring for excessive actions from the same user or patterns that indicate privilege escalation attempts alongside transfer events.

