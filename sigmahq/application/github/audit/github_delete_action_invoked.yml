note: |
  ### Technical Context
  This rule detects delete actions recorded in GitHub audit logs, specifically targeting actions associated with codespaces, environments, projects, and repositories. The primary purpose of this detection is to flag potentially unauthorized or malicious deletions that could significantly impact an organization's development and operational capabilities. Attackers may aim to sabotage ongoing projects, exfiltrate sensitive information, or disrupt workflows, particularly in cases where they have obtained unauthorized access to an organization's GitHub environment.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Impact (TA0040)**: The actions detected can lead to negative consequences for the organization by adversely affecting data integrity.
  - **Collection (TA0043)**: Understanding how data is gathered is critical, and deletions can be part of data manipulation efforts.
  - **Data from Information Repositories (T1213.003)**: This technique is applicable as the activity directly involves manipulating repositories within GitHub.

  The primary data source for this detection is the GitHub audit logs, which must have the audit log streaming feature enabled to capture deletion events effectively.

  ### Investigation Steps
  - **Validate Actor Permissions**: Check the "actor" field in the audit logs to confirm that the user who initiated the delete action has legitimate permissions to perform such a deletion. Any abnormal permissions should be investigated further.

  - **Review Audit Logs**: Gather the relevant audit logs which capture the delete actions for codespaces, environments, projects, and repositories to identify the context around the deletion events, including timestamps and the resources affected.

  - **Cross-Reference with Change Management**: Compare detected delete actions against any change management records or scheduled maintenance windows to determine if the deletions were authorized and documented.

  - **Evaluate Impact on Development**: Assess the potential impact of the deletions on current projects and workflows by consulting project documentation and team members responsible for the affected repositories, environments, and codespaces.

  ### Prioritization
  This alert is considered medium severity due to the potential impact on business operations and data integrity. Unauthorized deletions can lead to significant disruptions, loss of critical infrastructure, or data theft, hence warranting prompt investigation.

  ### Blind Spots and Assumptions
  The detection logic assumes that the audit log streaming feature is properly configured and actively capturing deletions within the organization's GitHub environment. There may be gaps in detection if the feature is not enabled or if logs are not properly retained for sufficient durations. Additionally, the rule does not account for legitimate deletion actions conducted by authorized personnel, which might lead to false positives if proper validation procedures are not followed.

