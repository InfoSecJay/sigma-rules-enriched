note: |
  ### Technical Context

  This rule detects the invocation of delete actions in GitHub audit logs, specifically targeting the deletion of Codespaces, environments, projects, and repositories. The likely attacker objective includes sabotage or data exfiltration, potentially aiming to disrupt business operations or erase traces of malicious activity. Relevant MITRE ATT&CK tactics include **Impact** (TA0040) and **Collection** (TA0125) under technique ID T1213.003.

  The primary telemetry source is GitHub audit logs, specifically requiring logs that capture actions such as `codespaces.destroy`, `environment.delete`, `project.delete`, and `repo.destroy`. If malicious, the security impact involves potential data loss, compromised project integrity, or unauthorized alteration of organizational resources. It is important to note that this detection does NOT confirm unauthorized access or malicious intent on its own without additional context regarding the actor conducting the deletion.

  ### Investigation Steps

  - **Identify actor context**: Review the `actor` field in the audit logs (e.g., GitHub Event Log, action: `codespaces.destroy`) to determine the identity of the user or system performing the deletion. Legitimate users should have roles that allow deletion in a controlled manner.

  - **Correlate timestamps**: Cross-reference the event timestamp with user login events in GitHub (Audit Log Event ID for logins) to establish whether the deletion aligns with legitimate user behavior or comes from an unexpected source.

  - **Examine related activity**: Look for other audit log actions from the same actor, such as project creation or modification prior to the delete action, to establish whether the actor had valid reasons for potentially destructive actions.

  - **Review environment configuration**: Validate that proper permissions and access controls are in place for the involved Codespaces, environments, and repositories, ensuring that deletions are initiated by authorized accounts only.

  - **Assess the impact of the deletion**: Analyze which resources (e.g., repositories, projects) were deleted and correlate with business impact assessments or operational criticality to prioritize further investigative actions accordingly.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems, resource availability, and the risk of data manipulation. The likelihood of malicious abuse is moderate, as deletion actions are often weaponized to disrupt or conceal unauthorized access.

  ### Blind Spots and Assumptions

  The main detection limitation involves potential evasion tactics, where an attacker may have access rights to perform legitimate deletions, reducing the effectiveness of this alert. The audit log streaming feature must be enabled for reliable detection of these events; without it, logs will be incomplete. Legitimate activities, like routine maintenance by authorized personnel, may trigger this alert. Companion detections, such as related suspicious login activities (e.g., consecutive logins from different geolocations), may enhance coverage of potential threats.

