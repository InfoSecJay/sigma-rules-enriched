note: |
  ### Technical Context

  This Sigma rule detects delete actions performed in GitHub's audit logs, specifically targeting codespaces, environments, projects, and repositories. The likely objective of an attacker is to remove critical resources, potentially as part of a disruption or information theft effort, which can significantly hinder development and operational capabilities. The relevant MITRE ATT&CK tactic is "Impact" (TA0040) with the technique "Data Manipulation" (T1213.003).

  The primary telemetry sources are GitHub audit logs, particularly focusing on actions that involve deletion across various resources. A successful delete action without proper authorization can lead to significant security impacts, including loss of critical data and disruption of collaborative workflows. Importantly, this detection does NOT confirm malicious intent; authorized personnel may legitimately perform these actions under certain circumstances.

  ### Investigation Steps

  - **Check the actor's permissions**: Review the "actor" field in the audit log entry to determine if the user has the appropriate permissions to perform delete actions. Legitimate activity should come from users with defined roles allowing such actions.

  - **Review the deletion context**: Examine the timestamp, repository, and project details related to the delete action by cross-referencing Event IDs in the audit logs. Confirm whether the deletion is consistent with normal usage patterns.

  - **Identify recent changes**: Investigate recent activity leading up to the delete action, focusing on "codespaces.create," "environment.create," "project.create," or "repo.create" actions within the last 24 hours to confirm if the delete followed a legitimate workflow.

  - **Assess potential data exposure**: Look for any associated file or artifact deletion indicators related to the repo, such as changes to the repository size or contents, checking for unexpected modifications or missing data files that might indicate data exfiltration.

  - **Cross-validate with other audit log entries**: Compare the delete action against other related GitHub audit log entries within the same time frame to identify patterns or anomalies that might suggest a coordinated malicious effort or authorized batch processes.

  ### Prioritization

  This alert has a medium severity rating. The impact is elevated if critical repositories or environments are misused or targeted, as deletion of these can lead to operational downtime and data loss. The likelihood of malicious abuse is medium, as this type of action can be weaponized by adversaries looking to disrupt workflows or erase traces of their activities.

  ### Blind Spots and Assumptions

  There are limitations in detection due to potential evasion techniques, such as insider threats with valid credentials performing malicious deletions. Required configurations include ensuring the audit log streaming feature is enabled for comprehensive monitoring. Legitimate activities, like authorized clean-ups or restructuring by admin users, may trigger this alert. A companion detection could involve monitoring for unauthorized creations, such as "repo.create," to strengthen overall oversight of repository lifecycle events.

