note: |
  ### Technical Context

  This rule detects changes in the archived status of GitHub repositories, specifically when they are archived or unarchived. The likely attacker objective may involve disrupting software development workflows, hiding malicious modifications, or making unauthorized changes to repositories that could affect the overall integrity of codebases. The relevant MITRE ATT&CK tactics are `Persistence` (T1547.001) and `Impact` (T1499), with the technique of `Repository Manipulation` (T1573).

  The primary telemetry source for this detection is GitHub audit logs, specifically events associated with repository status actions. If this activity is malicious, it could lead to loss of critical code, software vulnerabilities, or compromised development processes. Notably, this detection does NOT confirm whether the change was authorized or what subsequent actions, if any, followed the status change.

  ### Investigation Steps

  - **Review GitHub Audit Logs:** Check GitHub audit logs for events with `action: repo.archived` or `action: repo.unarchived`. Focus on the log fields: `repository`, `actor`, and `timestamp` to gather context on who made the change and when.

  - **Verify Actor Identity and Permissions:** Cross-reference the `actor` field in the audit log with the repository's access permissions. Confirm whether the change was made by a legitimate user with appropriate privileges or an unauthorized account.

  - **Assess Recent Repository Activity:** Examine the repository activity leading up to the archiving or unarchiving event. Look for previous commits or file changes (Create/Update events) to evaluate if any suspicious activity occurred prior to the status change.

  - **Identify Potential Malicious Indicators:** Search for additional logs indicating unauthorized access patterns, such as unusual API access tokens, or accounts with suspicious login behavior. Check for indicators like multiple failed login attempts within a short time frame.

  - **Determine Intended Use of Repository:** Understand the legitimate use case for the repository, especially if it's critical to business operations. Confirm with project leads if the archiving/unarchiving is expected based on project status.

  ### Prioritization

  This alert is of low severity in general; however, it requires attention since unauthorized changes can impact critical systems and workflows. The likelihood of malicious abuse is moderate, particularly for repositories handling sensitive or critical code. Attackers may exploit such changes to impair operations or exfiltrate sensitive information.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if GitHub audit logging is not enabled or if there are gaps in permissions auditing. Legitimate archiving or unarchiving can occur as part of routine actions by development teams, which may trigger this alert without malicious intent. Companion detections, such as abnormal login attempts or unauthorized access to repositories, can provide additional context and strengthen overall monitoring coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
