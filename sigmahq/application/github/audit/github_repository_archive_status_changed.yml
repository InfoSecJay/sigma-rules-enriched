note: |
  ### Technical Context

  This Sigma rule detects changes in the archival status of GitHub repositories, specifically when a repository is archived or unarchived. The likely attacker objective may involve hiding malicious code or tampering with a repository by altering its visibility and accessibility. This behavior aligns with the MITRE ATT&CK tactic of Persistence (T1078) and Defense Evasion (T1563). The primary telemetry source is GitHub's audit logs, and specific log types include events related to repository archival status changes.

  If successful, malicious changes could lead to unauthorized access or conceal malicious activities within repositories, impacting the integrity of the codebase and potentially exposing sensitive information. It is important to note that this detection alone does not confirm malicious behavior, as archiving or unarchiving a repository can also be performed as part of legitimate operational processes.

  ### Investigation Steps

  - **Verify archival status change event:**
    Review GitHub audit log entries for the specific action `repo.archived` or `repo.unarchived`. Note the timestamp, user ID, and repository name for context.

  - **Correlate user actions:**
    Check if the user responsible for the archival change has a history of appropriate behavior. Look for their previous GitHub activity using the log fields `actor.dynamic_id` and `actor.login`.

  - **Assess repository criticality:**
    Evaluate the importance of the affected repository. Determine whether it contains proprietary code or sensitive data that could be compromising if altered.

  - **Identify legitimate usage patterns:**
    Compare the current change against typical operational patterns. Document timestamps of past archival actions to establish a baseline of legitimate behavior.

  - **Investigate related changes:**
    Analyze additional GitHub audit log events around the same time, such as changes to repository permissions or configuration settings, to uncover potential coordinated malicious activity.

  - **Ascertain version compromise:**
    Inspect any recent commits before the archival state change, noting whether any suspicious or unintended changes were made in the repository, potentially indicating preparation for hiding malicious code.

  ### Prioritization

  This alert is of low severity due to the typically benign nature of repository archival actions. However, if the affected repository is critical to operations and there's a reasonable likelihood of misuse, it warrants a closer examination to confirm authorization and intent.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate user actions that involve archiving or unarchiving repositories as part of standard practices. Reliable detection requires proper configuration of GitHub audit logs, ensuring that all actions are being logged and accessible. Furthermore, reviewing other alert systems monitoring GitHub activity, such as unauthorized access attempts or permission changes, could strengthen coverage around potential threats.

