note: |
  ### Technical Context
  This detection rule identifies events where the status of a GitHub repository is changed to either archived or unarchived. Such changes can signify unauthorized actions taken by a threat actor aiming to disrupt normal operations, cover their tracks, or exfiltrate sensitive code or configurations. By archiving a repository, attackers might attempt to conceal their activities or remove access to the repository. Conversely, unarchiving could indicate the reactivation of a previously dormant repository for malicious purposes.

  The relevant MITRE ATT&CK tactics associated with this behavior are:
  - **Persistence (T1542)**: Changing the state of a GitHub repository may be part of an attacker’s strategy to maintain unauthorized access.
  - **Defense Evasion (T1070)**: Archiving can be an attempt to obscure traceable activities from defenders.
  - **Impact (T1499)**: Manipulating the status of repositories can lead to data loss or operational downtime.

  The primary data source for this detection is GitHub's audit logs, which record all actions taken on repositories, ensuring a comprehensive view of changes that may indicate malicious behavior.

  ### Investigation Steps
  - **Review Audit Logs**: Examine the GitHub audit logs for the repository in question. Look for entries that show the time, user, and action (archived or unarchived) to understand the context of the change.

  - **Correlate User Activity**: Check for any related actions performed by the user who archived or unarchived the repository. Investigate their previous activities for unusual access patterns or behavior.

  - **Analyze Repository Usage**: Investigate the repository before and after it was archived/unarchived. Look for signs of recent commits, code changes, or downloads that could indicate whether the change was legitimate or a prelude to malicious actions.

  - **Verify User Permissions**: Review the permissions of the user who made the change to ensure they had appropriate and expected rights to perform such actions on the repository.

  ### Prioritization
  While this alert is categorized as low severity, it is critical for enterprise environments to remain vigilant, as unauthorized archiving or unarchiving could facilitate malicious activities or indicate broader compromise efforts.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if audit logs are not enabled or if there are insufficient retention policies to capture relevant events in a timely manner. The logic assumes that all changes to repository status must be justified and authorized; however, legitimate changes (e.g., admin routine management) could lead to false positives. Proper configuration of GitHub audit logging is essential for this rule to function effectively, and timely investigations are necessary to differentiate between benign and malicious activity.

