note: |
  ### Technical Context

  This Sigma rule detects when the GitHub push protection feature is disabled for an organization, enterprise, repositories, or custom patterns. Disabling this feature can empower attackers to inadvertently or deliberately push sensitive information containing secrets or credentials into repositories, leading to potential data breaches or unauthorized access. This behavior fits into the MITRE ATT&CK framework under Tactic: Defense Evasion, specifically Technique T1685 (Pipeline Evasion).

  The primary telemetry source for this detection is the GitHub audit logs, specifically the streamed audit log events related to push protection. If push protection is disabled, it could allow malicious users to overwrite configurations or push sensitive information, which can severely impact the organization’s security posture. Importantly, this detection does not confirm malicious intent on its own. There can be legitimate administrative activities that involve disabling push protection based on the organization’s workflow.

  ### Investigation Steps

  - **Verify recent administrative changes:** Examine GitHub audit logs (Event types: `business_secret_scanning_push_protection.disable` and `org.secret_scanning_push_protection_disable`) for recent modifications to push protection settings within the targeted organization/repositories. Look for user identities conducting these actions to assess whether they align with expected administrative roles.

  - **Identify legitimate configurations:** Check if push protection has been intentionally disabled according to organizational policies. If it was disabled for new repositories or custom patterns, confirm this aligns with approved change management processes.

  - **Assess impacted repositories:** Review the list of repositories where push protection is disabled. Focus on repositories containing critical code or sensitive data and ensure they have alternative security measures (review necessary logs, fields, environment configurations).

  - **Correlate with code push activities:** Monitor GitHub events for pushes to repositories without push protection enabled (Event type: `repository.push`). Evaluate the contents of pushed files for the presence of credentials, tokens, or sensitive information to identify potential exposure.

  - **Check for unusual user activity:** Analyze user activity around the time when push protection was disabled. Use audit logs to look for anomalies, such as an increased number of pushes or changes made by users who typically do not engage with those repositories.

  ### Prioritization

  This alert carries a high severity due to the critical nature of push protection in preventing the leak of sensitive information. If disabled, there is a considerable risk of malicious use, especially considering the prevalence of secret scanning evasion techniques. Organizations should prioritize this alert, particularly in environments that operate under strict compliance or hold sensitive intellectual property.

  ### Blind Spots and Assumptions

  There are detection limitations, such as false positives from legitimate administrative activities, which may include disabling push protection as part of a controlled operation. Reliable detection relies on having audit log streaming enabled, as it is crucial for capturing the necessary telemetry. Legitimate activities such as routine access requests or configurations may trigger this alert. Companion detections, such as monitoring for unauthorized code pushes or changes in repository settings, may strengthen coverage against potential exploitation.

