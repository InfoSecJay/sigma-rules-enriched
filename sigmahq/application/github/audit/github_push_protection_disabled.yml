note: |
  ### Technical Context

  This rule detects instances where GitHub's push protection feature is disabled for an organization or repository, which may expose sensitive information in code pushed to repositories. The likely attacker objective is to evade detection of secrets, such as API keys or tokens, within code. This behavior aligns with MITRE ATT&CK tactics for defense evasion, specifically T1562.001 (Disable or Modify Tools). The primary telemetry source is the GitHub audit logs, specifically events related to push protection status changes. If malicious, the disabling of this feature increases the risk of sensitive information exposure, making systems susceptible to threats such as data breaches or unauthorized access. This detection does NOT confirm whether any sensitive data has actually been pushed or exploited.

  ### Investigation Steps

  - **Assess current push protection status**: Review the GitHub audit logs (Event types: `business_secret_scanning_push_protection.disable`, `business_secret_scanning_custom_pattern_push_protection.disabled`, etc.) to identify when and by whom the push protection feature was disabled.

  - **Identify recent repository activity**: Check for recent push events to repositories that had push protection disabled using GitHub activity logs. Look specifically for push events (Event types: `PushEvent`) around the time of protection being turned off.

  - **Examine user roles and permissions**: Verify the user who disabled the push protection feature. Look for any privileged access (e.g., admin roles) in the organization or repository settings (fields: `actor.login`, `actor.type`), as legitimate changes should be made by appropriate administrative users.

  - **Evaluate impact of disabling**: Determine if the repositories affected are critical to the organization (consider asset criticality). Assess the likelihood of sensitive data being present in pushes to these repositories prior to the change in protection status.

  - **Correlate with known security best practices**: Identify scheduled audits or checks where push protection status was previously confirmed as “enabled.” Documentation or meeting notes may exist that outline the security posture prior to any change.

  - **Analyze for harmful indicators**: Look for any subsequent suspicious activity, such as unauthorized access attempts to sensitive files, after push protection was disabled. Check logs for anomalies in access patterns (Event types: `RepositoryWorkspaceClone`, `ContentsDownload`).

  ### Prioritization

  This alert has a high severity due to the potential for significant impact on sensitive information exposure, especially if critical repositories are affected. The likelihood of malicious abuse is elevated, as disabling push protection is commonly used by adversaries to exploit vulnerabilities in code management practices. Push protection is a defensive measure; its absence increases the risk of security incidents involving leaked secrets.

  ### Blind Spots and Assumptions

  Evasion techniques could include a legitimate user disabling push protection for benign reasons, such as administrative maintenance. Accurate detection depends on the configuration of audit log streaming; organizations must ensure this feature is enabled to capture relevant telemetries. Activities like feature modifications by authorized users in a controlled environment may trigger this alert. Companion detections such as monitoring for unauthorized push activities or secret scanning results can enhance detection capabilities on this vector.

