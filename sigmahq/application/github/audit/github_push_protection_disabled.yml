note: |
  ### Technical Context
  This detection rule identifies instances where the push protection feature on GitHub is disabled for organizations, repositories, or specific custom patterns. Push protection is a security feature that helps prevent sensitive information, such as passwords and API keys, from being pushed inadvertently to repositories. When this feature is disabled, it increases the risk of credential leaks, which attackers can exploit to gain unauthorized access to systems and data.

  The likely threat scenario involves malicious actors aiming to exploit weaknesses in version control systems (VCS) by focusing on improperly secured repositories. By pushing false or malicious code or accessing sensitive information, an attacker can further elevate privileges, deploy malware, or perform data exfiltration. This detection rule aligns with the MITRE ATT&CK tactics of Defense Evasion (TA0005) as it relates to the evasion techniques that attackers might use to conceal their activities or alter security configurations to avoid detection (T1562.001 - Disable or Modify Security Tools).

  Primary data sources for this detection include GitHub audit logs, specifically audit log entries related to the state changes of push protection settings. Proper monitoring of these logs can help teams identify unauthorized or unexpected modifications to security features.

  ### Investigation Steps
  - **Review Audit Logs:** Analyze the GitHub audit logs to identify actions related to push protection settings being disabled. Look for entries consistent with the defined actions in the detection rule.
  - **Verify Legitimate Changes:** Cross-reference the disablement of push protection with documented administrative activities. Confirm that changes align with known workflows to rule out legitimate business operations.
  - **Assess Repository Access Levels:** Audit the permissions and roles assigned to users and service accounts accessing repositories. Ensure that only authorized personnel have privileges to alter security settings.
  - **Evaluate Potential Exposures:** Investigate any committed secrets or sensitive data that may have been pushed prior to the identification of disabled push protection. Utilize secret scanning tools to evaluate the health of code repositories.

  ### Prioritization
  The severity of this alert is high, as the disabling of push protection could lead to severe security incidents such as data breaches or unauthorized access to sensitive information. The attack likelihood increases when repositories are publicly accessible or poorly configured.

  ### Blind Spots and Assumptions
  This detection rule may encounter limitations due to the reliance on specific configurations, such as the requirement for the audit log streaming feature to be enabled for effective monitoring. If organizations do not use push protection for all repositories or specific configurations, the detection could generate false negatives. Additionally, the implementation may assume that all administrative activities are logged and reviewed consistently, potentially overlooking unauthorized changes made by compromised credentials or malicious insiders.

