logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'ssh_certificate_authority.create'         # An SSH certificate authority for an organization or enterprise was created.
    - 'ssh_certificate_requirement.disable'         # The requirement for members to use SSH certificates to access an organization resources was disabled.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ### Technical Context

  This rule detects modifications made to SSH certificate configurations within a GitHub organization. Specifically, it identifies when an SSH certificate authority is created or when SSH certificate requirements are disabled. These actions may indicate an attempt by an attacker to facilitate unauthorized access or to evade existing security measures by simplifying authentication processes.

  The relevant MITRE ATT&CK tactics include Initial Access (TA0001) and Defense Evasion (TA0005), with the technique being Persistence via Valid Accounts (T1078.004). The primary telemetry source for this detection is GitHub's audit log, particularly related to SSH configuration changes. If these actions are malicious, they could significantly impact access controls to critical repositories.

  This detection does not confirm that a compromise has occurred on its own; benign administrative changes may trigger the same alerts.

  ### Investigation Steps

  - **Review recent SSH certificate authority changes:** Investigate the GitHub audit logs for Event IDs related to `ssh_certificate_authority.create` and `ssh_certificate_requirement.disable`. Verify if these changes align with documented administrative procedures.

  - **Cross-check user roles:** Check the user or service account that made the changes against the organization's permission policies. If the user has elevated privileges, this increases the concern level. Look within audit logs for the `actor.login` field to validate permissions.

  - **Evaluate the timing of changes:** Specifically look for the timestamps of configuration changes (e.g., changes made during off-hours or in response to another security incident). Correlate them with other significant events in the organization's logs, such as unusual access patterns in the organization's repositories.

  - **Assess legitimate SSH configuration behavior:** Validate if the organization had scheduled maintenance or planned changes regarding SSH access configurations. If such activities were documented, they might account for the detected changes.

  - **Identify high-confidence malicious indicators:** Search for patterns indicating an expanded attack, such as changes made shortly after unusual activity was detected in the organization, or if an account was previously compromised. This can be inferred by correlating with authentication logs indicating logins from foreign IP addresses.

  ### Prioritization

  The alert carries medium severity as it involves critical infrastructure (SSH access) and could facilitate unauthorized access if exploited. The likelihood of malicious abuse exists, especially if the changes are unaligned with established protocol or happen during abnormal operational hours. Such configurations are common targets for attackers seeking persistent access.

  ### Blind Spots and Assumptions

  Detection can be limited by the need for audit logging to be enabled; without this, the changes will not be recorded. Evasion techniques may include legitimate administrative users making benign changes to cover malicious activity. Legitimate administrative actions, such as onboarding processes that require SSH changes, could inadvertently trigger these alerts. A companion detection to reinforce coverage would include monitoring for unusual patterns in user access attempts following SSH configuration changes.

