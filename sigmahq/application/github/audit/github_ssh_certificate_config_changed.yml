title: Github SSH Certificate Configuration Changed
id: 2f575940-d85e-4ddc-af13-17dad6f1a0ef
status: test
description: Detects when changes are made to the SSH certificate configuration 
  of the organization.
references:
- https://docs.github.com/en/enterprise-cloud@latest/organizations/managing-git-access-to-your-organizations-repositories/about-ssh-certificate-authorities
- https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise#ssh_certificate_authority
author: Romain Gaillard (@romain-gaillard)
date: 2024-07-29
tags:
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
- attack.stealth
- attack.t1078.004
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'ssh_certificate_authority.create'         # An SSH certificate authority for an organization or enterprise was created.
    - 'ssh_certificate_requirement.disable'         # The requirement for members to use SSH certificates to access an organization resources was disabled.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ### Technical Context

  This rule detects changes to the SSH certificate configurations in a GitHub organization, specifically the creation of SSH certificate authorities or the disabling of certificate requirements for accessing resources. The likely attacker objective is to escalate privileges or maintain persistence within the environment, as improper SSH configurations can allow unauthorized access. This behavior maps to the MITRE ATT&CK tactic for Initial Access (TA0001) and Persistence (TA0003), specifically the technique ID T1078.004 (Valid Accounts - SSH).

  Primary telemetry sources include GitHub audit logs, which must have the audit log streaming feature enabled to capture relevant events. If malicious, these changes can lead to unauthorized access to code repositories, weakening overall security posture. However, this detection does NOT confirm that an attacker is present—benign administrative activities can trigger such changes.

  ### Investigation Steps

  - **Identify relevant log artifacts**: Review GitHub audit logs for actions `ssh_certificate_authority.create` and `ssh_certificate_requirement.disable`. Ensure you cross-reference timestamps with other user activity logs to assess legitimacy.

  - **Examine user roles**: Check the user account associated with the change. Valid administrative accounts should apply changes, while anomalous accounts or unexpected administrative roles warrant further review.

  - **Verify legitimate behavior**: Confirm if recent configuration changes coincide with planned administrative updates or scheduled maintenance windows. Document any relevant tickets or communications that explain these changes.

  - **Assess for anomalous activity**: Look for other unusual user actions during the same time frame, such as SSH access logs (Event ID 22) that indicate successful connections using a non-standard account.

  - **Identify high-confidence malicious indicators**: Investigate if the actions were taken by an account known to be exploited or by an account that has not shown prior administrative behavior. This includes remote sessions or command executions via GitHub repositories.

  ### Prioritization

  Given the potential impact on code integrity and access control, this alert should be prioritized as medium severity. The likelihood of abuse is significant since compromised SSH key configurations are commonly weaponized for unauthorized access. Affected systems are often critical in development and deployment pipelines.

  ### Blind Spots and Assumptions

  This detection can be evaded by attackers if they gain legitimate access to accounts or if audit logs are misconfigured or not fully enabled. The need for reliable audit log sources is crucial; without auditing, changes may go unnoticed. Legitimate activities such as organizational restructuring or policy updates could trigger this alert. A companion detection to enhance coverage would be monitoring for unusual authentication attempts or failed logins related to SSH access, which may suggest compromised credentials.

