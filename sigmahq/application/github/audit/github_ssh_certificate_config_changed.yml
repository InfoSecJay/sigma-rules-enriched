title: Github SSH Certificate Configuration Changed
id: 2f575940-d85e-4ddc-af13-17dad6f1a0ef
status: test
description: Detects when changes are made to the SSH certificate configuration of
  the organization.
references:
- https://docs.github.com/en/enterprise-cloud@latest/organizations/managing-git-access-to-your-organizations-repositories/about-ssh-certificate-authorities
- https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise#ssh_certificate_authority
author: Romain Gaillard (@romain-gaillard)
date: 2024-07-29
tags:
- attack.initial-access
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1078.004
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'ssh_certificate_authority.create'         # An SSH certificate authority for an organization or enterprise was created.
    - 'ssh_certificate_requirement.disable'         # The requirement for members to use SSH certificates to access an organization resources was disabled.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ### Technical Context
  This detection rule identifies changes to the SSH certificate configuration within a GitHub organization. Specifically, it flags events where an SSH certificate authority is created or the requirement for SSH certificates is disabled. These actions can indicate potential insider threats or external attackers seeking unauthorized access to repositories or systems within the organization. By altering SSH certificate settings, attackers may aim to replace valid certificates with their own, facilitating unauthorized access to sensitive resources.

  This type of behavior aligns with various MITRE ATT&CK tactics and techniques, predominantly focusing on Initial Access (TA0001), Persistence (TA0003), Defense Evasion (TA0005), and Privilege Escalation (TA0004). The specific technique likely relevant here is `T1078.004 - Valid Accounts: SSH`, which describes the exploitation of legitimate SSH accounts to gain access to systems.

  Primary data sources for this detection rule are audit logs generated by GitHub's activity monitoring features. Organizations must ensure that audit log streaming is enabled to capture relevant events effectively.

  ### Investigation Steps
  - **Review Audit Logs:** Investigate the recent GitHub audit logs for the organization, paying special attention to entries detailing the creation of SSH certificate authorities and changes to requirements regarding SSH certificates.

  - **Analyze User Activity:** Identify users who executed the actions captured by this rule. Assess their typical activities to determine if these actions fall outside normal operational behavior.

  - **Check Repository Access:** Verify the access permissions of repositories associated with the modified SSH certificate settings. Look for unauthorized access attempts or changes following the certificate configuration alteration.

  - **Investigate Configuration Settings:** Review the overall SSH configuration settings in GitHub for the organization to check for any other unauthorized changes or any known vulnerabilities that may have been exploited.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact on the security posture of the organization. Unauthorized changes to SSH certificate configurations can lead to broader access control issues, making it critical to investigate promptly but not as immediately life-threatening as high-severity alerts.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection could be the absence of changes that do not directly create or disable SSH requirements but still manipulate permissions or roles indirectly related to SSH access. Moreover, the detection logic assumes that legitimate administrative activities are the only exceptions, which may not always hold if an insider threat is involved. For this alert to function accurately, audit log streaming must be enabled; otherwise, the essential events will not be logged or detected.

