logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'ssh_certificate_authority.create'         # An SSH certificate authority for an organization or enterprise was created.
    - 'ssh_certificate_requirement.disable'         # The requirement for members to use SSH certificates to access an organization resources was disabled.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects changes made to the SSH certificate configuration of a GitHub organization, specifically actions where either an SSH certificate authority is created or the requirement for members to use SSH certificates is disabled. The likely attacker objective is to weaken authentication mechanisms or facilitate unauthorized access to the organization’s repositories, thus compromising sensitive data or source code. Relevant MITRE ATT&CK tactics and techniques include Initial Access (TA0001) and Valid Accounts (T1078.004). The primary telemetry comes from GitHub audit logs, specifically focusing on actions related to SSH certificate authorities.

  If malicious, this behavior can significantly increase the risk of unauthorized access to repositories. Importantly, this detection does NOT confirm that a successful compromise has occurred; it merely indicates a change in administrative security settings that may warrant further investigation.

  ---

  ### Investigation Steps

  - **Review audit logs for certificate authority changes:** Check GitHub audit logs for entries with actions `ssh_certificate_authority.create` or `ssh_certificate_requirement.disable` (Audit log Event Name). Record the timestamp, user executing the action, and the specific repository configurations changed.

  - **Correlate user roles with changes:** Identify the user making the change and their permissions (e.g., owner vs. collaborator). Ensure the user has legitimate administrative access as outlined in your organization's GitHub access policies.

  - **Evaluate recent SSH activity:** Look for SSH access logs (if available) that include user actions following the change. Focus on Event IDs related to SSH key usage. Anomalous patterns like multiple new users or increased access from unusual IP addresses may indicate malicious intent.

  - **Identify expected configuration behavior:** Cross-reference changes against established organizational policies for managing SSH certificates. Document expected settings and authorized user roles to delineate benign actions from suspicious changes.

  - **Check for follow-up malicious actions:** Investigate whether there have been any attempts to exploit the new settings. This includes unauthorized repository access or data downloads that could stem from the recent disabled requirements.

  ---

  ### Prioritization

  The severity of this alert is medium. Affected systems can hold vital intellectual property or sensitive information, making them high-value targets for adversaries. The likelihood of malicious abuse increases with this configuration change, particularly if SSH certificate usage is vital to the organization's security posture. While such changes can be legitimate, they warrant close scrutiny due to their potential exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential suppression of audit logs if proper logging isn't enabled or configured. Legitimate administrative activities, such as rectifying a policy to facilitate collaboration, may trigger this alert. Accurate detection requires proper configuration of GitHub audit log streaming to ensure full coverage. Related detections include monitoring for unauthorized access attempts post-configuration change, enhancing visibility around potential exploitation attempts.

