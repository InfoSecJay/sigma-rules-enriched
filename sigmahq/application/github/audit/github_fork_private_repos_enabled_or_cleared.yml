title: Github Fork Private Repositories Setting Enabled/Cleared
id: 69b3bd1e-b38a-462f-9a23-fbdbf63d2294
status: test
description: |
  Detects when the policy allowing forks of private and internal repositories is changed (enabled or cleared).
references:
- https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise#private_repository_forking
author: Romain Gaillard (@romain-gaillard)
date: 2024-07-29
tags:
- attack.persistence
- attack.exfiltration
- attack.t1020
- attack.t1537
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'private_repository_forking.clear'         # An enterprise owner cleared the policy setting for allowing forks of private and internal repositories, for a repository, organization or enterprise.
    - 'private_repository_forking.enable'         # An enterprise owner enabled the policy setting for allowing forks of private and internal repositories, for a repository, organization or enterprise. Private and internal repositories are always allowed to be forked.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ### Technical Context
  This detection rule identifies changes to the settings governing the forking of private and internal repositories on GitHub, specifically when an organization or enterprise owner enables or clears this policy. The ability to fork private repositories can significantly impact the security posture of an organization, potentially leading to unauthorized data sharing or intellectual property leaks. Attackers may exploit this setting to exfiltrate sensitive code or confidential information by forking repositories without proper oversight.

  The relevant MITRE ATT&CK tactics for this rule include **Persistence** (T1071) as it relates to establishing ongoing access via forked repositories, and **Exfiltration** (T1020) as it involves potentially transferring data outside of authorized channels. The technique T1537, which covers "Exfiltration Over Alternative Protocol," applies as it may involve novel methods of sharing or extracting data using the forked repositories.

  Primary data sources for this detection include **GitHub audit logs** which record actions taken by organization owners related to repository settings, including policy changes for forking.

  ### Investigation Steps
  - **Review Audit Logs:** Analyze GitHub audit logs for entries related to `private_repository_forking.enable` and `private_repository_forking.clear` actions. Focus on the timestamps, users involved, and affected repositories.
  - **Check User Permissions:** Investigate the permissions of the user or users who made the policy change. Determine if these actions were performed by authorized personnel or if there are signs of compromised accounts.
  - **Assess Forked Repositories:** Identify any existing forks of sensitive repositories that may have been created prior to or after the policy change. Evaluate the content of these forks and their visibility settings.
  - **Monitor for Unusual Activity:** Keep an eye on downstream activity related to the affected repositories, including unusual commits, pull requests, or integrations that could indicate external malicious activity.

  ### Prioritization
  The severity of this alert is considered medium due to the potential risk of unauthorized code or information sharing resulting from the ability to fork private repositories. Organizations must prioritize monitoring such changes to mitigate the risks associated with data exfiltration.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the audit log streaming feature is not enabled, as stated in the requirements. The detection logic assumes that any changes to forking policies reflect either benign administrative action or malicious intent. The absence of adequate logging, misconfigured permissions, or a lack of oversight on repository management can hinder effective monitoring and response.

