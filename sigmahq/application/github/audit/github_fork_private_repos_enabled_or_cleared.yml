title: Github Fork Private Repositories Setting Enabled/Cleared
id: 69b3bd1e-b38a-462f-9a23-fbdbf63d2294
status: test
description: |
  Detects when the policy allowing forks of private and internal repositories is changed (enabled or cleared).
references:
- https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise#private_repository_forking
author: Romain Gaillard (@romain-gaillard)
date: 2024-07-29
tags:
- attack.persistence
- attack.exfiltration
- attack.t1020
- attack.t1537
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - 'private_repository_forking.clear'         # An enterprise owner cleared the policy setting for allowing forks of private and internal repositories, for a repository, organization or enterprise.
    - 'private_repository_forking.enable'         # An enterprise owner enabled the policy setting for allowing forks of private and internal repositories, for a repository, organization or enterprise. Private and internal repositories are always allowed to be forked.
  condition: selection
falsepositives:
- Allowed administrative activities.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes to the policy governing whether private and internal repositories can be forked in GitHub. Such changes may indicate intention to improperly share sensitive code, leading to potential data exfiltration or intellectual property theft. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **Account Manipulation** (T1537). The primary telemetry source is GitHub's audit logs, specifically the events related to forking settings for repositories.

  If malicious, an attacker may utilize this change to fork sensitive repositories, thereby gaining unauthorized access to proprietary code or confidential information. However, this detection does NOT confirm malicious intent, as the activity may also result from legitimate administrative actions by authorized personnel.

  ### Investigation Steps

  - **Review audit log entries**: Check GitHub audit logs (Event Type: `private_repository_forking.clear` or `private_repository_forking.enable`) focusing on timestamps and user accounts involved. Significant changes made by unauthorized users are elaborately concerning.

  - **Identify user role**: Validate the user performing the action by checking their permissions and roles in GitHub (via the GitHub API or UI). Legitimate administrative actions should involve Enterprise Owners, while abnormal actions by standard users should be flagged.

  - **Check for consequent repository activity**: Analyze log entries for any subsequent forking actions associated with the modified settings. Unexpected forks of repositories following a policy change can indicate potential exfiltration attempts.

  - **Investigate the context of the changes**: Review other recent administrative actions in the GitHub audit logs to identify patterns (e.g., multiple settings changes) that indicate broader malicious behaviors or an attack sequence.

  - **Analyze external communications**: Check any integrated third-party tools or services potentially interacting with the repositories affected by these policy changes. This may include viewing API calls made post-policy change to understand data exposure paths.

  ### Prioritization

  This alert holds medium severity due to the potential for exposing sensitive information and code from private repositories. While it indicates a configuration change that could be weaponized by an attacker, the likelihood of abuse depends on the context of the change and the user role making it.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering the alert, especially in organizations where policy changes are routine. Required log sources include enabled audit log streaming; failure to enable this can impede detection. Legitimate activities like periodic policy reviews by administrative users may trigger this alert as well. A companion detection relevant to this behavior is monitoring fork activity (e.g., `repository.fork`) following policy changes, which can strengthen coverage against potential data leakage.

