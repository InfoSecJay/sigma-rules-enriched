  ---

  ### Technical Context

  This Sigma rule detects changes to the fork settings of private and internal repositories on GitHub, specifically when an enterprise owner enables or clears the policy that allows such forks. The likely attacker objective could involve exfiltrating proprietary code or intellectual property by allowing unauthorized access to sensitive source code. This action relates to multiple MITRE ATT&CK techniques, particularly **Persistence (T1078)** and **Exfiltration Over Command and Control Channel (T1041)**.

  Primary telemetry sources include GitHub audit logs, specifically the events logged when configurations related to repository forking are modified. If this behavior is malicious, it could facilitate unauthorized sharing of sensitive data, creating significant security risks. Importantly, this detection does NOT confirm that sensitive data has been accessed or exfiltrated; it merely indicates a change in policy settings that could enable such actions.

  ---

  ### Investigation Steps

  - **Review recent audit logs for changes**: Check GitHub audit logs (Event type: `private_repository_forking`) for recent entries showing who enabled or cleared the forking policy (fields: `actor`, `action`, `repository`, `timestamp`).

  - **Identify the actor's role**: Verify the user who made the change (actor field). Ensure they have valid enterprise owner status; unauthorized role changes can indicate malicious intent.

  - **Correlate with other settings**: Examine related settings in the repository (e.g., visibility changes, collaborator access) through GitHub API or audit log to determine if there are other indicators of suspicious activities.

  - **Establish a baseline of behavior**: Document what legitimate repository management looks like in your environment, such as periodic updates by known enterprise owners. Note the regularity of forking policy changes.

  - **Detect high-confidence indicators**: Look for abnormal patterns in repository access after the setting change, such as unusual cloning or forking actions. Use metrics from GitHub activity logs to flag unexpected behaviors.

  - **Check for external integrations**: Investigate whether new Webhooks, GitHub Actions, or integrations were added surrounding the policy change. These could indicate setups for exfiltrating data if tied to unauthorized users.

  ---

  ### Prioritization

  The severity of this alert is medium, as the impact can be significant if the affected system holds sensitive code. The potential for malicious abuse is high, especially in environments where proprietary technologies are developed. Changes to forking settings can be weaponized for data exfiltration, making this a notable area for scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative activities triggering the alert, which could lead to false positives. Reliable detection requires the audit log streaming feature to be appropriately configured in your GitHub enterprise setup. Be aware that some legitimate activities, such as administrative updates or policy changes conducted by authorized personnel, may trigger this alert. A related detection to consider is monitoring unusual access patterns to repositories post-policy change, as it bolsters detection capabilities around potential exfiltration activities.

