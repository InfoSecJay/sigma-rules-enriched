note: |
  ### Technical Context
  This detection rule identifies when the secret scanning feature is disabled for an enterprise account or a specific repository within GitHub. Secret scanning is a crucial security feature that helps organizations identify accidentally committed secrets, such as API keys and credentials, that could be exploited by malicious actors. When this feature is disabled, it increases the risk of data leakage and unauthorized access, as sensitive information could remain undetected in the codebase.

  The primary objective of an attacker exploiting this situation would be to gain access to sensitive resources or systems using compromised secrets. Disabling secret scanning could facilitate a quieter approach to information gathering, allowing attackers to capitalize on misconfigurations or weak security practices. The relevant MITRE ATT&CK tactic for this detection is Defense Evasion (ID: T1562.001), which encompasses techniques used to evade security measures, including the disabling of detection mechanisms.

  The best data source for this detection is the GitHub audit logs, particularly the entries related to secret scanning settings. These logs must be collected through the audit log streaming feature, which needs to be enabled beforehand, ensuring that relevant actions are logged and analyzed.

  ### Investigation Steps
  - **Review Audit Logs:** Analyze GitHub audit logs for actions indicating the disabling of secret scanning. Look for specific events matching the detection criteria listed in the rule.
  - **Cross-Check Repository Settings:** Investigate the settings of repositories where secret scanning has been disabled. Determine if this aligns with organizational policy or if it represents a deviation from expected configurations.
  - **Identify Administrator Actions:** Establish whether changes were made by authorized personnel through legitimate administrative actions. This may involve verifying recent administrative activities in the context of organizational access control policies.
  - **Assess Impact and Notifications:** Analyze if there have been any subsequent notifications or alerts triggered due to the disabling of secret scanning, such as attempts to access repositories or other suspicious activities that could exploit disabled security features.

  ### Prioritization
  This alert is considered high severity in an enterprise environment due to the potential for significant impact if sensitive credentials are exposed and misused. The likelihood of exploitation rises when proper security measures are circumvented, making prompt investigation and remediation critical.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if organizations do not have the audit log streaming feature enabled, as the logs necessary for this alert will not be available. Additionally, the detection assumes that disabling secret scanning is not part of planned administrative activities, which could lead to false positives if not properly contextualized. Organizations must ensure that comprehensive logging and monitoring configurations are in place to capture all necessary actions reliably.

