note: |
  ### Technical Context

  This Sigma rule detects the disabling of the secret scanning feature in GitHub, a critical security mechanism designed to identify and mitigate the exposure of sensitive data such as API keys and passwords. The likely attacker objective, in this case, could be to exploit the absence of monitoring for secrets within repositories, thereby facilitating unauthorized access or malicious actions without detection. This behavior aligns with the MITRE ATT&CK tactic of defense impairment (T1685).

  The primary telemetry source for this detection is the GitHub audit log, specifically capturing actions indicating the disabling of the secret scanning feature in both organizational and repository settings. Malicious disabling of this feature can significantly increase the risk of exploitation, as it removes a layer of proactive security monitoring. Importantly, this detection does NOT confirm that an exploit has occurred or that sensitive data has been exposed; it simply highlights a change in security posture.

  ### Investigation Steps

  - **Check audit log for disable actions**: Review GitHub audit logs for events indicating secret scanning disabled actions (e.g., `business_secret_scanning.disable`, `repository_secret_scanning.disable`). Look for timestamps and user accounts associated with these actions.

  - **Identify the responsible user**: Look for the user or admin account that performed the disabling action. Assess their role and whether their access aligns with typical administrative duties.

  - **Evaluate previous settings**: Confirm whether the secret scanning feature was previously enabled for the affected repositories or the organization, establishing a baseline for legitimate configurations.

  - **Assess impact based on repository sensitivity**: Cross-reference the affected repositories with an asset criticality matrix. Identify if they contain sensitive data or proprietary information that could be exposed due to lack of secret scanning.

  - **Monitor for unusual activity**: In the days following the disable action, monitor the repository for any unusual commit activity or access patterns. Review push events (e.g., Event ID `push` in GitHub) for unexpected changes.

  ### Prioritization

  Alerts triggered by the disabling of secret scanning features should generally be treated with high severity. The potential impact is significant, particularly if the affected repositories are critical to the organization, and the likelihood of malicious abuse is increased, especially by persistent adversaries looking to exploit unmonitored secrets.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging was not previously configured to capture relevant events, or if the disabling of the feature was executed by legitimate administrators. Legitimate administrative actions, such as feature toggles during maintenance, can trigger this alert. A companion detection includes monitoring for unusual repository access patterns post-disablement, which can help identify if the action has been followed by malicious exploitation attempts.

