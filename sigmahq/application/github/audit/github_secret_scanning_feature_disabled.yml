  ---

  ### Technical Context

  This Sigma rule detects the disabling of the secret scanning feature within a GitHub enterprise or repository. The primary objective of such an action typically aligns with defensive evasion tactics, where an attacker may seek to reduce the visibility of exposed secrets integral for authentication or API access. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (T1562.001), which emphasizes actions taken to evade security controls.

  The primary telemetry source for this detection is GitHub audit logs, specifically monitoring events related to secret scanning actions. If malicious, the disabling of secret scanning can lead to severe security vulnerabilities, exposing sensitive information. It is critical to note that detection of this event does NOT confirm malicious intent without further context; administrative users may disable this feature for legitimate reasons.

  ---

  ### Investigation Steps

  - **Review audit logs for disabling actions:** Check GitHub audit logs (Audit log API or GitHub UI) for events with actions like `business_secret_scanning.disable` (Event IDs will follow a specific format based on logs). Identify timestamps and users involved.

  - **Identify authorized administrative changes:** Compare the disabling event against defined administrative roles within the organization. Confirm if users executing the action are intended admins or have legitimate tasks, as normal operational behavior may justify the action.

  - **Correlate other security controls:** Look for additional logs that may indicate secrets exposure or misuse, such as leaked API keys in repositories or unauthorized access attempts, which could support a malicious analysis.

  - **Confirm enterprise configuration settings:** Validate whether the audit log streaming feature is enabled for your GitHub enterprise, as its absence could lead to incomplete monitoring and gaps in the audit trail.

  - **Cross-reference with threat intelligence:** Investigate recent incidents involving secret scanning in your threat intelligence feeds to assess if disabling this feature aligns with known attacker methodologies or tactics.

  - **Evaluate repository settings for other sensitive features:** Review repository security configurations for any additional disabling of security features that might indicate a broader trend in security misconfiguration or administrative negligence.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on the organization’s security posture. The disabling of secret scanning can significantly increase the likelihood of malicious exploitation of sensitive information. Such behavior is weaponized frequently by adversaries seeking to leverage exposed secrets for further unauthorized actions.

  ---

  ### Blind Spots and Assumptions

  Detection is limited if audit logs are not properly configured or if there is a reliance on manual checks, as legitimate administrative actions may trigger false positives. Some developers may disable this feature for specific troubleshooting or project-relevant scenarios. A companion detection for monitoring repository changes related to API keys and sensitive material can enhance overall security posture and context for the investigation.

