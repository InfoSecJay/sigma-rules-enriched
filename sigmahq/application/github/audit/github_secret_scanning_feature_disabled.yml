note: |
  ### Technical Context

  This Sigma rule detects instances where the secret scanning feature is disabled for a GitHub enterprise account or specific repository. Disabling this feature can allow adversaries to commit sensitive information, such as API keys or credentials, without detection, significantly increasing the risk of data breach or unauthorized access. The behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0030) and specifically the technique of Disable or Modify Security Features (T1562.001).

  Primary telemetry sources include GitHub audit logs, specifically actions related to the modification of the secret scanning feature. If secret scanning is turned off, the potential security impact includes increased exposure to sensitive data leakages due to unmonitored commits. It’s important to note that this detection alone does not confirm malicious activity; it only indicates a configuration change that may open avenues for exploitation.

  ### Investigation Steps

  - **Review Audit Logs for Feature Disabling:** Check GitHub audit logs for events with actions such as `business_secret_scanning.disable` or `repository_secret_scanning.disable`, focusing on Event Type field and timestamps.

  - **Identify Recent Repository Activity:** Examine the commit history in the affected repository for recent changes following the disabling event. Look particularly for commit messages that imply sensitive information handling or injection of secrets.

  - **Assess Organizational Policy Compliance:** Verify whether the disabling of secret scanning aligns with established organizational policies for repository settings. Legitimate businesses might routinely review security features but rarely disable them.

  - **Check for High-Risk Repositories:** Prioritize investigation on repositories containing sensitive data or high-value assets. Validate and cross-reference their secret scanning status with compliance requirements.

  - **Look for Administrative Activity:** Assess the user who executed the disable action. Verify if they have necessary permissions and whether this aligns with their role or activity within the organization, limiting scope for abuse.

  - **Identify Related Security Features:** Look for any concurrent changes to other security features, such as enabling/disabling branch protection rules or code scanning, which could indicate a larger trend of feature adjustments that may warrant further investigation.

  ### Prioritization

  This alert has a high severity due to the potential impact on sensitive data exposure and the likelihood of malicious abuse if secret scanning is disabled, allowing adversaries to exploit any unmonitored secrets in the codebase. The fact that this feature is critical for maintaining security reaffirms the need for immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative activities that disable secret scanning as part of maintenance or configuration changes. Reliable detection requires that GitHub audit log streaming is correctly configured and enabled. Additionally, legitimate workflows, such as team reorganizations or testing phases, may trigger this alert without malicious intent. Monitoring related logs for unauthorized repository access or API key usage can strengthen coverage against potential exploitation.

