note: |
  ### Technical Context
  This detection rule identifies when a GitHub Pages site associated with a repository is set to public. This action is typically part of a legitimate publishing process, allowing users to showcase documentation, portfolios, or project details. However, it also poses a risk by potentially exposing sensitive information or proprietary code to unauthorized parties, either through misuse by insiders or exploitation by external threat actors.

  When an attacker gains unauthorized access to a repository, changing the visibility to public can facilitate data exfiltration or leaking of sensitive information. The attacker may aim to harvest valuable intellectual property or confidential data. The relevant MITRE ATT&CK tactics associated with this behavior include **Collection (TA0011)**, which encompasses techniques such as **Data from Information Repositories (T1567.001)**, highlighting the risks of exposing data stored in repositories.

  The primary data source indicating this behavior is GitHub audit logs, which capture actions taken on repositories, including changes to visibility settings.

  ### Investigation Steps
  - **Review Audit Logs:** Examine the GitHub audit logs for the repository in question, focusing on events related to visibility changes (e.g., `repo.pages_public` actions). Look for any unfamiliar user accounts or unusual timestamps.
  - **Validate User Authorization:** Confirm that the change to public visibility was made by an authorized user. Investigate the user’s recent activities and repository access patterns to determine if their actions align with business processes.
  - **Assess Repository Content:** Analyze the contents of the repository to identify any sensitive information or critical code that should not be publicly accessible. Pay particular attention to sensitive files (e.g., configuration files, credentials).
  - **Monitor for Data Leaks:** Use tools and alerts to monitor for incidents of data scraping or code repositories being indexed by search engines following this visibility change.

  ### Prioritization
  The alert has a low severity due to the potential for legitimate users to publish repository pages publicly; however, it remains critical due to the risk of unauthorized exposure and could lead to significant information leaks if not monitored.

  ### Blind Spots and Assumptions
  Gaps in detection coverage exist if GitHub audit logs are not captured in a centralized logging system or if logs are insufficiently retained. The detection logic assumes that the action of changing the visibility to public is uncommon within the organization and does not consider scenarios where automated or external processes might unintentionally alter repository settings. Proper logging configurations and access controls must be in place for this alert to function effectively.

