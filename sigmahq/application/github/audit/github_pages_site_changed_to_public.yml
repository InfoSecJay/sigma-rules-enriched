note: |
  ### Technical Context

  This Sigma rule detects when a GitHub Pages site associated with a repository is changed to public, which indicates that the site can be accessed by anyone on the internet. An attacker may attempt to change repository settings to expose sensitive information or code as part of an information disclosure strategy. This behavior aligns with the MITRE ATT&CK framework under the tactic "Collection" (TA0009) and the technique "Exploitation of Publicly Accessible Content" (T1567.001). The primary telemetry source for this detection is the GitHub audit logs, specifically monitoring the action of repositories having their Pages sites set to public. If the action is malicious, it could lead to unauthorized data exposure. Importantly, this detection does not confirm malicious intent on its own; legitimate users may also change repository visibility for valid reasons.

  ### Investigation Steps

  - **Verify user and repository context:** Check the GitHub audit logs (`action`) for the user ID and repository affected to confirm if the change was made by an authorized account. Review the `actor` and `repository` fields for legitimacy.

  - **Check previous visibility settings:** Review the prior state of the repository using the audit log entries (`action`) to determine if the Pages site was previously set to private, indicating a potential malicious intent behind the change.

  - **Identify common patterns:** Compare the log (`action`) with typical publishing workflows. Legitimate updates will typically involve a period of development with multiple commit entries and discussions around the repository leading up to the change.

  - **Search for sensitive data exposure:** Conduct a search for any sensitive configurations or sensitive data (e.g., API keys, config files) in the repository that could be exposed. Investigate the contents of the repository specific to the commit history and files present.

  - **Monitor for links or site access:** Check for external references to the newly public GitHub Pages site (e.g., URLs shared on forums or social media) that may indicate exploitation, using external monitoring tools or threat intelligence services.

  - **Check for concurrent suspicious activities:** Look for other simultaneous actions in the GitHub audit logs that may imply malicious behavior (e.g., deletion of sensitive files or unexpected changes in permissions).

  ### Prioritization

  The severity of this alert is moderate due to the potential for sensitive information exposure on an affected public repository. While not immediately indicative of a compromise, the likelihood of abuse is increased if atypical user behavior is observed, especially if the repository contains proprietary or confidential information.

  ### Blind Spots and Assumptions

  This detection may be limited by typical legitimate behaviors, such as authorized users publicly releasing repositories or changes in visibility during planned organizational processes. Reliable detection is contingent upon the comprehensive configuration of GitHub audit logging. Additionally, false positives may arise from benign activities such as community contributors publishing updates. A related detection to consider is monitoring for repository modifications or deletions that may occur alongside visibility changes, as they could indicate malicious activity.

