note: |
  ### Technical Context
  This detection rule identifies potential SpEL (Spring Expression Language) Injection attacks within applications using the Spring Framework. Such injections can lead to remote code execution (RCE), thereby allowing attackers to manipulate applications and access sensitive data. The detection is based on monitoring application error logs for specific exceptions (e.g., `ExpressionException`) that indicate anomalous or malicious input being processed by the Spring Framework's expression language capabilities.

  In this scenario, an attacker may exploit an improperly validated input within a Spring application, aiming to execute arbitrary code or access unauthorized resources. This can occur during the initial access phase of an attack lifecycle, where adversaries attempt to compromise the application to realize their objectives. Relevant MITRE ATT&CK tactics include **Initial Access (TA0040)** and the technique **T1190: Exploit Public-Facing Application**, which emphasizes the exploitation of vulnerabilities in externally accessible systems.

  Primary data sources for this detection include application error logs, specifically those generated at `LOG_LEVEL=ERROR` or higher. Analysts should ensure that the logs capturing error messages from the Spring Framework are appropriately configured and retained.

  ### Investigation Steps
  - **Review Application Error Logs:** Examine the application logs for occurrences of `org.springframework.expression.ExpressionException`. Focus on the context in which the error was raised to identify potentially malicious inputs.

  - **Analyze User Input Patterns:** Investigate the specific requests or inputs leading to the error. Look for patterns commonly associated with injection attacks, such as unexpected characters or payload structures that could indicate attempted exploitation.

  - **Inspect Application Configuration:** Validate the security configurations of the Spring application to ensure proper input validation and sanitization processes are in place to mitigate the risk of SpEL injection.

  - **Correlate with User Activity:** Check for any unusual user activity or access patterns that coincide with the timing of the logged exceptions to identify any potential attackers or compromised accounts.

  ### Prioritization
  Given the high severity level of this alert, it indicates a significant potential risk to enterprise applications. The likelihood of exploitation leading to unauthorized access or RCE makes it critical to address promptly, as such vulnerabilities can have widespread implications across business operations.

  ### Blind Spots and Assumptions
  This detection may miss more complex exploit attempts, especially if the attacker uses obfuscation techniques or if the application logs do not capture all relevant error details. The alert logic assumes that the error message associated with a suspicious expression indicates a targeted attack rather than stemming from benign application bugs. Appropriate setup and configuration are necessary for the application error logging to function effectively, particularly logging settings that retain level-ERROR messages in a comprehensible format.

