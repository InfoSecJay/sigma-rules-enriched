  ### Technical Context

  This Sigma rule detects potential SpEL (Spring Expression Language) Injection attempts in applications using the Spring Framework. An attacker may exploit this vulnerability to execute arbitrary code, potentially leading to Remote Code Execution (RCE) or unauthorized access to sensitive information or system resources. The relevant MITRE ATT&CK technique associated with this detection is Initial Access through Exploit Public-Facing Application (T1190).

  The primary telemetry sources required for this detection are application error logs generated by Spring Framework applications, specifically looking for logs at the ERROR level and above. If confirmed malicious, the impact could be severe, as it may grant attackers control over the application and possibly the underlying system. Importantly, this detection does NOT confirm an actual exploitation, only the presence of a potentially indicative error.

  ### Investigation Steps

  - **Check application error logs:** Look for entries that contain `org.springframework.expression.ExpressionException` indicating a SpEL Injection attempt. Focus on logs containing this error and note the surrounding context for malicious patterns.

  - **Identify source of the request:** Correlate the identified error logs with incoming network traffic to determine the source IP addresses. Review firewall or proxy logs (e.g., DNS and HTTP request logs) for suspicious activity or access patterns.

  - **Review application versions:** Verify the version of the Spring Framework in use by the affected application against known vulnerabilities. Ensure it is updated to mitigate existing vulnerabilities related to SpEL Injection.

  - **Analyze the request payload:** For logs indicating potential injection attempts, review the payload in the request if available. Look for unvalidated user input sent to the application. Legitimate usage typically involves well-formed inputs that match expected data structures.

  - **Check for additional indicators:** Assess if there are other error logs or alerts that indicate a broader pattern of exploitation attempts, such as other exceptions or high volumes of similar error entries over a short time.

  ### Prioritization

  The alert is of high severity due to the potential for RCE if exploitation is successful. Given that this behavior is weaponized and can lead to significant impacts on application integrity and data security, prompt investigation is critical.

  ### Blind Spots and Assumptions

  Detection may be limited by the availability of application error logs, necessitating specific log collection configurations (e.g., ERROR level and above). Legitimate activities could occasionally trigger the alert, such as benign application errors or testing environments that mishandle input. Companion detections, such as monitoring for unusual access patterns or integration with Application Security Testing tools, can enhance the overall coverage against exploitation attempts.

