  ### Technical Context

  This rule detects attempts to exploit SpEL (Spring Expression Language) injection vulnerability within applications using the Spring Framework. Attackers may leverage this vulnerability to manipulate application behavior, potentially achieving Remote Code Execution (RCE). The relevant MITRE ATT&CK tactic is Initial Access, specifically technique T1190 (Exploit Public-Facing Application).

  The primary telemetry source for this detection includes application error logs from Spring Framework instances, specifically those capturing error level logs (LOG_LEVEL=ERROR and above). If exploited maliciously, the attacker could gain unauthorized access or control over the application, compromising the confidentiality, integrity, and availability of sensitive data and services. However, this detection does not confirm successful exploitation; it merely indicates a potential vulnerability.

  ---

  ### Investigation Steps

  - **Review application error logs:** Examine the Spring application logs for entries containing `org.springframework.expression.ExpressionException`. Pay attention to surrounding log entries for context on how frequent and under what conditions the error occurs.

  - **Identify potential triggers:** Analyze recent changes or deployments to the application that may have introduced vulnerabilities. Look for unauthorized changes in the application's codebase or configuration.

  - **Verify legitimate usage patterns:** Cross-check the logs against documented functionality. Legitimate application behavior, such as user-generated inputs that invoke Spring expressions without errors, should not trigger this alert.

  - **Monitor for suspicious user activities:** Investigate user interactions leading up to the error log. High-volume or unusual requests that seem designed to manipulate expression inputs can indicate potential testing for vulnerabilities.

  - **Check server and application asset risk:** Evaluate the criticality of the affected system. Applications handling sensitive data or exposing critical services warrant increased urgency in investigation.

  - **Correlate with network activity logs:** Cross-reference with firewall or proxy logs for unusual traffic patterns or requests directed at the vulnerable application that may align with attempted exploitation.

  ---

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on critical applications if exploited, leading to RCE. The likelihood of malicious abuse is elevated, particularly in industries reliant on the Spring Framework, where known vulnerabilities are often targeted by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by reliance on collected error logs; if logs are improperly configured or not collected, detection will fail. Legitimate activities, such as application debugging or unusual but valid user inputs, may trigger this alert. Companion detections could include monitoring for abnormal patterns in application access logs targeting the same endpoints.

