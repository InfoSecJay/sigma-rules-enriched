note: |
  ### Technical Context

  This Sigma rule detects registry modifications related to the Teramind Remote Monitoring and Management (RMM) tool, specifically targeting keys associated with service configuration. The likely attacker objective is to establish persistent access or remote control over a compromised host, potentially for data exfiltration or system manipulation. The relevant MITRE ATT&CK tactics are Command and Control (TA0011) and Remote Services (T1219).

  Primary telemetry sources include Windows Registry Event logs, specifically focusing on modifications within the registry hive that pertain to the 'tsvchst' service. If the detected modifications are malicious, they could indicate that an adversary is using the Teramind tool for unauthorized monitoring or operations. However, it is important to note that this detection does NOT confirm malicious intent or activity on its own, as legitimate use by the organization's IT or security teams can trigger the same alerts.

  ### Investigation Steps

  - **Review recent registry changes:** Check for Event ID 4663 in Security Event logs for registry modifications. Look for changes to 'HKLM\SYSTEM\CurrentControlSet\Services\tsvchst' and its subkeys. Legitimate changes should correlate with known maintenance windows or administration processes.

  - **Verify service status:** Utilize PowerShell or Windows Management Instrumentation (WMI) to query the status of the 'tsvchst' service. A legitimate service state would be set to "Running" and initiated by known administrators during authorized periods.

  - **Cross-reference timestamps:** Compare the timestamps of detected registry modifications with other logs, such as Event ID 4624 (logon events) in Security logs. Legitimate changes should align with administrative actions, not anomalous times or during off-hours.

  - **Identify abnormal parent processes:** Analyze parent processes of the registry modification actions. Use Sysmon Event ID 1 to identify processes that led to these registry edits; legitimate processes (like 'services.exe') should be involved, whereas unexpected processes may indicate malicious activity.

  - **Check for additional persistence methods:** Investigate other registry paths for persistence indicators, such as 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run'. Events related to these keys can provide insight into whether the system has been compromised further.

  ### Prioritization

  This alert is assigned medium severity due to the potential risk of unauthorized external monitoring or control over critical systems. Given that Teramind is a known RMM tool, the likelihood of malicious use is elevated, especially if found on sensitive assets or during hours of low legitimate activity. The behavior is not uncommon among threat actors looking to gain persistent control.

  ### Blind Spots and Assumptions

  Detection limitations may arise if the registry keys are tampered with or if remote access tools are obfuscated. Proper monitoring requires that Windows Registry auditing is enabled to capture necessary events. Legitimate activities, such as IT support interventions or remote management by authorized personnel, may trigger this alert. Companion detections, such as monitoring for unusual Account Logon events (Event ID 4624), can enhance visibility into the context of the alert.

