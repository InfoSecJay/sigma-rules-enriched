note: |
  ### Technical Context

  This rule detects network connections to Jump Desktop, a remote management tool commonly used for remote desktop sessions. Attackers may leverage this tool to gain unauthorized access to systems, maintain persistence, and remotely control compromised devices, aligning with the MITRE ATT&CK technique for Remote Access Software (T1219). Primary telemetry sources include Windows event logs, particularly network connection events that register connections to specific Jump Desktop domains. If malicious, the impact could involve unauthorized data access and disruption of operations. This detection does NOT confirm compromise on its own, as there are legitimate uses for Jump Desktop in administrative contexts.

  ### Investigation Steps

  - **Check network connection details:** Review Windows network connection logs (Event ID 5156) for connections to Jump Desktop domains (e.g., jumpdesktop.com, jumpto.me). Identify if the process initiating the connection is unusual or unauthorized.

  - **Verify process integrity:** Investigate the process making the network connection by checking Security Event ID 4688 for process creation events. Confirm if the initiating process is a legitimate application or service (e.g., the Jump Desktop service or process). Look for any unusual parent-child process relationships.

  - **Analyze user accounts involved:** Cross-reference event logs to identify which user account initiated the connection to Jump Desktop. Assess if the account has a legitimate reason to use the tool based on user roles and normal operating procedures.

  - **Look for high-confidence indicators of malicious behavior:** Identify any previous records of anomalous behavior, such as other known malicious events or coordination with suspicious external IPs. Correlate this with logs from endpoint detection tools.

  - **Understand expected activity patterns:** Determine the regular usage patterns of Jump Desktop within the organization. Legitimate connections typically occur during standard business hours and are initiated by recognized administrative accounts.

  ### Prioritization

  This alert has medium severity due to the risk associated with remote desktop tools being exploited by threat actors for lateral movement or data exfiltration. The likelihood of malicious abuse is moderate, as Jump Desktop is recognized as a critical RMM tool but is frequently targeted for exploitation.

  ### Blind Spots and Assumptions

  Detection may miss instances where Jump Desktop is used for legitimate purposes or where similar tools mimic it without detection. Reliable detection requires comprehensive logging of Windows network connections and process creation events, which may not always be configured. Activities like remote support for legitimate business processes can trigger the alert, complicating investigations. A companion detection could involve monitoring for abnormal account logins or lateral movement attempts post-connection to stronger verify misuse.

