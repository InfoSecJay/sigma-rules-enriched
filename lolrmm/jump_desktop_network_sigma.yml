note: |
  ### Technical Context

  This rule detects network connections to Jump Desktop, a remote management and support tool that can be exploited for unauthorized access to systems. The likely attacker objective is to establish remote management capabilities, facilitating further exploitation of the compromised network. This activity aligns with the MITRE ATT&CK technique "Remote Management Software" (T1219).

  Primary telemetry sources include Windows network connection logs, specifically filtered for connections to domains associated with Jump Desktop (e.g., `*.jumpdesktop.com`, `*.jumpto.me`). If this activity is malicious, it could enable an attacker to perform actions such as data exfiltration, lateral movement, or system compromise. Importantly, this detection alone does not confirm malicious intent, as the tool can be used legitimately by IT personnel.

  ### Investigation Steps

  - **Review recent network connections:** Examine Windows firewall logs for network connection events (Event ID 5156) to identify outbound connections to `*.jumpdesktop.com` or `*.jumpto.me`. Determine the user and process behind the connection for context.

  - **Correlate user activity:** Look for interactive logon events (Security Event ID 4624) around the same time as the detected connection. Legitimate administrative users may have scheduled or routine remote support tasks that could explain normal use.

  - **Check for authorized usage:** Validate that the organization permits Jump Desktop for remote support activities. Review asset management databases and communication channels for approval records associated with the software.

  - **Identify high-confidence indicators:** Investigate for persistent installations of Jump Desktop by checking for installation logs (e.g., application logs or MSI events). The presence of executable files related to Jump Desktop on endpoints could indicate a legitimate install, whereas unknown installations should raise flags.

  - **Examine the surrounding telemetry:** Analyze other security events, such as unusual process creation (Security Event ID 4688, Sysmon Event ID 1), that occurred concurrently with network activity to detect potential lateral movement.

  ### Prioritization

  This alert should be treated with medium severity as Jump Desktop may pose a significant risk if misused, especially on critical assets. Given its remote management functionality, this type of behavior is potentially weaponized by adversaries for lateral movement. The likelihood of abuse increases particularly if seen on systems that are sensitive or contain accessible user data.

  ### Blind Spots and Assumptions

  Detection may be limited if network traffic is encrypted or if the tool is being used in a legitimate context. Essential log sources like Windows network logs must be correctly configured to ensure visibility; without them, valid connections could go undetected. Legitimate activities might include scheduled remote assistance or troubleshooting sessions. A companion detection worth implementing includes monitoring for suspicious user logon patterns or unusual service configurations using alternate remote access tools.

