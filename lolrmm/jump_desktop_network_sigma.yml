note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Jump Desktop remote management tool, specifically monitoring connections to Jump Desktop's domains. Attackers may utilize Jump Desktop for unauthorized remote access, enabling control over compromised machines and lateral movement within the network. This behavior is aligned with the MITRE ATT&CK technique for Remote Access Tools (RAT) under the Tactic ID TA0011 (Command and Control).

  Primary telemetry sources include Windows network connection logs that detail outbound connections to specific Jump Desktop domains. If malicious, such usage could lead to significant data exfiltration or control over critical systems. However, this detection alone does NOT prove malicious intent, as legitimate administrative activities may also initiate connections to these domains.

  ### Investigation Steps

  - **Review network connections: Identify instances of connection attempts to Jump Desktop domains:** Look for Security Event ID 5156 with `Network connection` logs. Correlate if the process initiating the connection is a known RMM tool. Malicious indicators often include unusual hosts that have not communicated previously.

  - **Validate host role: Determine whether the affected system is an administrative or user workstation:** Systems classified as administrative should have legitimate RMM or remote access tools installed while regular user workstations typically should not. Presence on a user workstation may indicate potential unauthorized access.

  - **Check process creation history: Identify associated processes with abnormal behavior:** Use Sysmon Event ID 1 to retrieve process creation events. A legitimate process could be “Jump Desktop Host,” whereas unexpected executable names or unfamiliar processes initiating connections should be flagged.

  - **Examine User Activity Logs: Identify user logins for the time of the activity:** Review Security Event ID 4624 for successful logon events to determine if the user accessing the system is authorized. Unrecognized user accounts or unusual access times should be investigated further.

  - **Conduct history of domain queries:** Review DNS query logs or application logs for previous queries to Jump Desktop domains. Frequent queries may signal repetitive legitimate use, while odd patterns can hint at malicious behavior.

  ### Prioritization

  This alert holds medium severity due to the potential impact on sensitive systems if Jump Desktop is exploited maliciously. Given that remote management tools can easily facilitate unauthorized access and lateral movement, the likelihood of abuse is moderate. Additionally, this type of behavior has been weaponized in various attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where Jump Desktop is legitimately used for support or administration. Missing logs from Windows Firewall or a lack of detailed network accounting could hinder reliable detection. Additionally, benign activities include IT support sessions using Jump Desktop. A companion detection includes monitoring for other known remote access tool signatures to strengthen coverage against similar threats.

