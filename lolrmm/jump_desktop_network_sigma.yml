note: |
  ### Technical Context

  This detection rule identifies network activities related to the Jump Desktop remote management tool by monitoring outbound connections to specified Jump Desktop domain names. An attacker may utilize this tool for remote access to compromised systems, exfiltration of data, or lateral movement within the network. It aligns with the MITRE ATT&CK tactic of Command and Control (T1071 - Application Layer Protocol).

  The primary telemetry sources for this detection include Windows network connection logs that capture outbound traffic to specific Jump Desktop hostnames. If the detected behavior is malicious, it could indicate an unauthorized remote session potentially leading to data breaches or abuse of system privileges. Note that this detection alone does not confirm malicious activity, as the presence of Jump Desktop connections may also result from legitimate administrative actions.

  ### Investigation Steps

  - **Check network connection logs**: Review Windows network connection logs (Event ID 5156) for any outbound connections to `*.jumpdesktop.com` or `*.jumpto.me`. Connections to these domains should be scrutinized, as they might indicate unauthorized remote access.

  - **Verify source IP and user**: Identify the user and source IP address associated with the outbound connections to the Jump Desktop domains. Legitimate activity may come from known administrative or IT support machines, while unexpected users may indicate a potential compromise.

  - **Investigate process activity**: Check for process creation logs (Event ID 4688 or Sysmon Event ID 1) to see if any known Jump Desktop executables (e.g., `JumpDesktop.exe`) were initiated following the network connection. Unexpected process creation can indicate potential abuse.

  - **Analyze DNS query logs**: Examine DNS logs for resolutions of `jumpdesktop.com` or `jumpto.me` to correlate user or system activity. Frequent queries or resolutions from non-administrative systems could reveal unauthorized attempts to access remote management services.

  - **Assess legitimate usage**: Identify any documented policies or records regarding the use of Jump Desktop within the organization. Confirming that connections align with these policies can help differentiate benign from potentially malicious activity.

  - **Correlate with endpoint security alerts**: Check for alerts from endpoint detection and response (EDR) tools that may highlight suspicious or anomalous behavior occurring on the same hosts during the same time frame as the detected Jump Desktop activity.

  ### Prioritization

  This alert should be classified with medium severity due to its potential impact on sensitive systems, particularly if Jump Desktop is employed without authorization. The likelihood of abuse is moderate as Jump Desktop can facilitate unauthorized access, which is a common tactic used in both exploitation and lateral movement activities.

  ### Blind Spots and Assumptions

  Detection can be circumvented if the Jump Desktop tool is configured to use non-standard ports or obfuscated domain names. Ensuring that DNS logging and Windows firewall logs are enabled will improve detection reliability. Legitimate administrative activities, especially in IT environments, may trigger this alert, necessitating clear policies on remote management tool usage. A companion detection focusing on remote access solutions could enhance monitoring efforts, covering scenarios where different tools are used for similar malicious intents.

