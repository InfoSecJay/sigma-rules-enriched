note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the RemSupp remote monitoring and management (RMM) tool, such as `installer.exe`, `RemSupp.exe`, and `Uninstall RemSupp.exe`. The likely attacker objective includes maintaining persistence, executing commands remotely, and potentially exfiltrating sensitive data or deploying malicious payloads, especially if used without organization permission. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1219).

  The primary telemetry sources include Windows process creation events, specifically Windows Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, the presence of these processes could indicate a compromise, especially if RemSupp is not sanctioned for use. Importantly, this detection does not confirm whether the tool is intended for legitimate or malicious activities on its own; further context is essential.

  ### Investigation Steps

  - **Review process creation logs:** Look for Security Event ID 4688 and Sysmon Event ID 1 to find additional context about the process execution, such as the user account and command line arguments. Verify if execution originates from unusual accounts or unexpected execution paths.

  - **Identify parent process:** Check the ParentImage field in the logs for entries ending in `installer.exe`, `RemSupp.exe`, or `Uninstall RemSupp.exe`. Legitimate installations or updates to RemSupp should typically occur from authorized admin accounts.

  - **Check execution context:** Correlate the user context of the detected processes against known roles. Elevated permissions (e.g., SYSTEM or admin accounts) executing these processes in non-administrative environments could be suspect.

  - **Verify installation legitimacy:** Inspect the installed software list (e.g., via `Get-WmiObject Win32_Product` or equivalent command) for RemSupp entries. Confirm deployment was sanctioned by IT; unauthorized installs are high-confidence indicators of malicious activity.

  - **Assess file changes associated with the detection:** Validate potential file creation or modification in common installation directories. Look for unusually recent timestamps or large changes in size associated with `RemSupp.exe`, which could indicate exfiltration activity.

  ### Prioritization

  This alert is of medium severity. Systems affected by unauthorized RMM tools can lead to significant security risks, potentially allowing adversaries control over the environment. RMM tools are frequently exploited in attacks, making this detection highly relevant in an enterprise security context.

  ### Blind Spots and Assumptions

  This detection may be limited by the use of legitimate RemSupp installations, which could trigger false positives. Ensure that endpoints are configured to log comprehensive process creation events, as incomplete log capture could omit important context. Other legitimate activities, such as routine software updates, may also trigger the alert. A companion detection to consider is monitoring for unusual network connections initiated by RemSupp processes, which can reveal potential malicious command and control communications.

