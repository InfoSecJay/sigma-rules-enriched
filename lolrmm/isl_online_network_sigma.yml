note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the ISL Online remote management tool, which may indicate misuse for unauthorized access or control over systems. Attackers might leverage this tool to maintain persistence or exfiltrate information from compromised devices. Relevant MITRE ATT&CK tactic includes “Execution” and the technique “Remote Desktop Protocol” (T1219).

  The primary telemetry sources are Windows network connection logs, specifically monitoring for outbound connections to domains ending in `*.islonline.com` or `*.islonline.net`. If confirmed malicious, this activity could indicate an attacker gaining unauthorized remote access to systems to execute commands or exfiltrate data. However, it’s important to note that the presence of outbound traffic to these domains does not, on its own, confirm malicious intent; legitimate business use of ISL Online is common and may also trigger this rule.

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 in Windows Security logs. Look for outbound connections to `*.islonline.com` or `*.islonline.net`. Pay attention to the source IP and associated user sessions to identify potential unauthorized use.

  - **Validate user and device behavior:** Confirm that the users associated with the detected connections have documented permission for remote management tasks. Check if the devices are expected to use ISL Online based on their role (e.g., support or IT operations).

  - **Inspect system process creation:** Look for related process creation activity in Sysmon Event ID 1. Confirm if `ISLAlwaysOn.exe` or similar executables were started around the time of the network connection events. Irregular or unexpected executions could indicate misuse.

  - **Correlate with other telemetry sources:** Check for related registry modifications in the Windows Event logs (Event ID 4657) that could reveal installation or configuration changes linked to ISL Online. This may help in understanding the context of the tool's usage.

  - **Identify high-confidence malicious indicators:** If the detected network connections coincide with suspicious processes or unusual outbound traffic volumes, this could imply malicious behavior. Perform a deeper dive into related processes and user sessions using Event ID 4688 for process creation logs.

  ### Prioritization

  The alert is of medium severity due to the potential for significant impact if ISL Online is used maliciously to access sensitive systems. While legitimate use exists, the likelihood of abuse is noteworthy, especially if combined with other suspicious activities. This behavior is occasionally weaponized in targeted attacks against organizational networks.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from legitimate ISL Online usage, especially in support or operational roles. It’s crucial to ensure that outbound connection logs for Windows are correctly configured to capture all relevant telemetry. Additionally, legitimate remote access software behavior may frequently trigger this rule. A related detection to consider for enhanced coverage is monitoring for unusual login attempts or user behavior analytics that may indicate account compromise prior to ISL Online usage.

