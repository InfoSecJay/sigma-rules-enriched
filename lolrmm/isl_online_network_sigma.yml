note: |
  ### Technical Context

  This detection rule identifies network connections to ISL Online Remote Management and Monitoring (RMM) tool domains, suggesting potential remote access activity. The likely attacker objective is to establish communication with a command-and-control server to facilitate remote management or control, potentially after gaining initial access to a system. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1071 - Application Layer Protocol).

  The primary telemetry sources are Windows network connection logs that capture outbound connections from endpoints. If malicious, the security impact could range from unauthorized access to critical infrastructure to full compromise of affected systems. Importantly, this detection does NOT confirm malicious activity on its own; legitimate usages of the ISL Online tool by authorized personnel can trigger this alert.

  ### Investigation Steps

  - **Check network connection logs:** Look for Windows Security Event ID 5156 (Filtering Platform Connection) showing connections to `*.islonline.com` or `*.islonline.net`. Verify the source IP and compare against known locations of your organization's IT support or authorized users.

  - **Identify endpoint activity:** Review Sysmon Event ID 3 (Network Connection) for timestamps and process names related to ISL Online. Legitimate connections may originate from specific IT management tools, while unusual process names indicating unauthorized usage should raise suspicion.

  - **Validate user authentication:** Investigate user account access logs from Azure Active Directory or Active Directory to confirm if the initiating user has permissions for RMM tools. Unfamiliar accounts or unexpected access times can indicate malicious intent.

  - **Correlate with application logs:** Cross-reference any data from Windows Application logs, specifically for ISL Online activity events. Look for free usage versus charged subscriptions, as unauthorized usage typically incurs costs.

  - **Inspect other related connections:** Check for additional outbound connection attempts to other known command and control domains. Multiple or sequential connections to different remote management tools may indicate broader attack patterns.

  ### Prioritization

  This alert should be considered medium severity primarily due to the potential critical impact on systems if misused but varies based on the asset's role. The likelihood of malicious abuse is moderate since unauthorized actors may impersonate IT support personnel. However, ISL Online is also a legitimate tool used for remote support, making careful assessment essential.

  ### Blind Spots and Assumptions

  Detection may have limitations due to logging configurations; ensure that network filtering rules capture all necessary event types. If network traffic is encrypted, further anomalies may be obscured. Legitimate uses—such as remote IT support—will frequently trigger this alert. A companion detection rule monitoring for process creation of the ISL Online executables can strengthen overall coverage.

