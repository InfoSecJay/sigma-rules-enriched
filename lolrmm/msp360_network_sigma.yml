note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the MSP360 Remote Management and Monitoring (RMM) tool, which is commonly used for remote support and backup services. The likely attacker objective when misusing this tool may include unauthorized access to controlled systems, data exfiltration, or lateral movement within a network. This detection aligns with the MITRE ATT&CK technique for Remote Management Software Usage (T1219).

  The primary telemetry source is Windows network connection logs that capture traffic directed to specific domains related to MSP360. If malicious, such network connections can facilitate unauthorized administrative actions, potentially leading to data compromise or system integrity issues. Importantly, this detection does NOT confirm that malicious activity is occurring by itself, as legitimate use of MSP360 for support purposes may also trigger the alert.

  ### Investigation Steps

  - **Review recent network connections:** Check for Security Event ID 5156 (Windows Filtering Platform) logs regarding outbound connections to `*.cloudberrylab.com`, `*.msp360.com`, or `*.mspbackups.com`. Confirm whether the initiating process is a known management tool or service running on the host.

  - **Assess the legitimacy of the executing user:** Identify the user account linked to the network connection attempt. Determine if it is an administrative user or a service account typically associated with authorized MSP360 usage.

  - **Validate expected MSP360 behavior:** Confirm that any detected connections were initiated by the legitimate MSP360 application (check for process name, image path, and associated service). Typical benign behaviors include scheduled backup tasks or remote support sessions.

  - **Identify high-confidence malicious indicators:** Cross-reference the detected connections with known malicious activity or intelligence reports on unauthorized use of MSP360. Check for anomalies such as unusual outbound traffic volume or links to known threat actors.

  - **Evaluate asset context and criticality:** Identify the role of the host initiating the connections (e.g., backup server, endpoint). If the asset is highly sensitive, prioritize further investigation and validation due to the risk of data exposure or administrative abuse.

  ### Prioritization

  This alert is medium severity as it may indicate unauthorized administrative actions on critical systems. The likelihood of malicious abuse is significant, given that the MSP360 tool can be weaponized for remote access by threat actors. However, in some environments, it may also reflect legitimate remote management or backup activities.

  ### Blind Spots and Assumptions

  This detection may miss incidents where the tool is used in a stealthy manner, such as connections to non-standard or temporary domains. Reliable detection requires comprehensive logging of network connection events; ensure Windows Filtering Platform logging is enabled. Legitimate remote support activities might frequently trigger this alert. Companion detections could include monitoring for other remote management tools or remote desktop protocol (RDP) usage to strengthen overall network monitoring capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
