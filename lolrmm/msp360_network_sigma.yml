note: |
  ### Technical Context

  This Sigma rule detects network connection attempts to domains associated with the MSP360 Remote Monitoring and Management (RMM) tool, including msp360.com and its subdomains. The likely objective of an attacker utilizing this tool is to establish remote access or command-and-control (C2) capabilities over compromised systems. This detection aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219).

  The primary telemetry source for this detection involves Windows network connection logs that detail DNS resolutions and outbound connections to specific domains. If this behavior is malicious, it could lead to unauthorized access and control of enterprise systems. It is important to note that this detection alone does not confirm malicious intent; legitimate use cases for MSP360 existence exist, notably in managed service provider (MSP) contexts.

  ### Investigation Steps

  - **Identify legitimate MSP360 activity**: Check for known scheduled maintenance or support actions that might involve MSP360 tool usage. Refer to event logs (e.g., Security Event ID 4688 for process creation) and correlate timestamps with service outages or help desk requests.

  - **Correlate outgoing connection logs**: Review Windows Firewall logs for outgoing connections (Event ID 5156) and focus on instances where the destination matches any of the specified MSP360 domains. Log fields of interest include `DestinationIP` and `DestinationPort`.

  - **Examine user account activity**: Investigate Event IDs related to logon events (e.g., Event ID 4624) during the timeframe of detected activity to determine whether connections were made using typical administrative accounts or if unknown accounts are involved.

  - **Identify abnormal network patterns**: Query DNS logs and network traffic analysis for any unusual spikes in outbound connections or patterns, particularly to MSP360 domains, which may indicate misuse or compromise of the tool.

  - **Assess the risk of targeted systems**: Identify if the affected system is critical (e.g., domain controllers, file servers) based on your asset inventory to determine the potential impact of unauthorized access.

  ### Prioritization

  This alert should be categorized as medium severity given that it involves potential unauthorized remote access tool usage. The likelihood of malicious abuse is moderate, particularly if the domain connections stem from systems not typically associated with MSP operations. Such behavior can often be weaponized by adversaries to maintain control over compromised environments.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if logs from relevant firewall configurations or third-party logging utilities are not adequately collected. Legitimate administrative use of the MSP360 RMM tool can generate similar alerts, thus requiring contextual investigation. Companion detections, such as identifying any subsequent traffic patterns to known C2 infrastructures (e.g., T1071), can enhance detection coverage for potential misuse of MSP360.

