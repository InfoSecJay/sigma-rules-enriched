note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the MSP360 RMM tool, including *.cloudberrylab.com and *.msp360.com. The likely attacker objective is to establish a command-and-control (C2) channel or perform remote management activities, potentially indicating malicious activity, such as lateral movement or exploitation. This behavior maps to MITRE ATT&CK tactics: Command and Control (TA0011) and Remote Services (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically focusing on the destination hostname. If this behavior is malicious, it may allow an adversary to gain remote access to systems or exfiltrate data. Importantly, this detection does NOT confirm that the activity is malicious without further contextual analysis.

  ### Investigation Steps

  - **Check outbound connections**: Review network connection logs (Event ID 5156) for connections to domains like '*.cloudberrylab.com' or '*.msp360.com'. Note the process ID and user context for context.

  - **Identify related process activity**: Examine process creation logs (Sysmon Event ID 1) for processes with a command line that suggests remote management (e.g., includes terms like "msrmm" or "cloudberry"). Verify whether these processes are legitimate.

  - **Review expected behavior**: Validate whether the alert resembles legitimate MSP360 usage, such as scheduled backups or remote access from known management workstations. Analyze the timestamps and user accounts associated.

  - **Monitor for known bad patterns**: Investigate if any connections correlate with previous detections of malicious IPs or indicators of compromise. An absence of benign usage may increase likelihood of maliciousness.

  - **Assess asset criticality**: Determine the role of the affected host. Connections on critical servers (e.g., domain controllers, sensitive data repositories) warrant higher scrutiny vs. non-critical systems.

  ### Prioritization

  This alert holds medium severity as it relates to network traffic from potentially risky remote management tools. The likelihood of malicious abuse is moderate, particularly in environments where legitimate MSP360 usage is not standard or expected. The behavior can be weaponized for lateral movement if misconfigured or inadequately monitored.

  ### Blind Spots and Assumptions

  Detection may miss instances where MSP360 is misconfigured or used alongside legitimate applications. Some organizations might regularly use MSP360, introducing false positives. Ensure that logs from security devices (e.g., firewalls) are collecting DNS query data to validate hostname resolutions. A related detection, such as unauthorized PowerShell use (T1086), could provide complementary coverage by identifying scripts that utilize MSP360 for remote access.

