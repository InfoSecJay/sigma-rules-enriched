note: |
  ### Technical Context

  This rule detects network connections originating from internal systems to the Instant Housecall Remote Management Tool (RMM) domains, which may indicate unauthorized remote access or monitoring. Attackers could utilize Instant Housecall to gain remote administrative control over systems, potentially compromising sensitive data and conducting further malicious activities. This behavior aligns with the MITRE ATT&CK framework under the Command and Control tactic (T1219).

  Primary telemetry sources include Windows network connection logs with a focus on hostname resolutions and outbound connection attempts. If malicious, the detection could indicate a breach of system integrity through unauthorized remote access. However, this alert does NOT confirm malicious activity on its own, as legitimate usage of Instant Housecall exists.

  ### Investigation Steps

  - **Investigate outbound connections:** Review Windows network connection logs for Event ID 5156 to identify connections to the domains: '*.instanthousecall.com', 'secure.instanthousecall.com', '*.instanthousecall.net', 'instanthousecall.com'. Look for multiple connections; legitimate activity is typically single, infrequent access.

  - **Analyze user and process context:** Check the User and Process names associated with Event ID 5156. Confirm if known IT support personnel or processes are initiating these connections. Evidence of mismatch could indicate unauthorized access.

  - **Validate endpoint role:** Identify the role of the affected systems. Connections from servers or sensitive workstations (e.g., AD Controllers, finance systems) can indicate higher risk as opposed to typical support machines.

  - **Cross-reference with known RMM usage:** Validate against asset inventory and authorized RMM tools. Well-documented and approved uses of Instant Housecall should match expected patterns; discrepancies warrant deeper investigation.

  - **Check for lateral movement:** Review Sysmon Event ID 3 (Network Connection) and 1 (Process Creation) to identify any suspicious process creation leading to outbound connections to the Instant Housecall domains. Unauthorized lateral movement may be indicated if unusual commands are executed prior to the connections.

  ### Prioritization

  This alert should be considered of medium severity due to its potential impact on enterprise systems if associated with unauthorized access. The likelihood of malicious exploitation exists given that remote access tools are often used for nefarious purposes by attackers. While some organizations may have legitimate uses for this tool, its detection merits immediate investigation.

  ### Blind Spots and Assumptions

  There are limitations in detecting traffic encrypted via VPN or obfuscation techniques that may mask the RMM tool's indicator characteristics. Consistent logging from firewalls and endpoint protections is essential for reliable detection. Legitimate remote IT support activities can often trigger alerts, requiring additional context. Companion detections relating to unauthorized software installations or process injection (e.g., Process Injection T1055) could strengthen investigation coverage and context.

