  ### Technical Context

  This Sigma rule detects network connections to domains associated with the Instant Housecall Remote Management Tool. Such activity may indicate that an attacker is using this legitimate remote management software to gain unauthorized access to a system, potentially to execute further malicious actions. The relevant MITRE ATT&CK tactic is Execution, with the associated technique being Remote System Management (T1219).

  The primary telemetry source is Windows network connection logs, specifically monitoring outbound connections to specified Instant Housecall domains. If the detected connection is unauthorized, the security impact could be severe, leading to data exfiltration or full system compromise. It is important to note that this detection does NOT confirm malicious behavior on its own, as legitimate use of Instant Housecall may trigger the same alerts.

  ---

  ### Investigation Steps

  - **Identify outbound connections to the tool's domains:** Examine Windows Event ID 5156 (Windows Filtering Platform) for any outbound connection attempts to domains ending with '.instanthousecall.com' or '.instanthousecall.net'. Validate the connection time, user, and destination.

  - **Check for legitimate use cases:** Review the user activity and context around the time of the alert. Document any known legitimate usage of Instant Housecall in the organization, including the user’s role and if their request aligns with expected remote support protocols.

  - **Investigate associated process creation logs:** Look for Security Event ID 4688 or Sysmon Event ID 1 to confirm if Instant Housecall or related executables (e.g., RMM.exe) were instantiated. Verify process execution paths to determine if the processes were initiated from typical directories.

  - **Correlate with recent remote access permissions:** Check for any recent changes in user roles or permissions that may allow authorized use of remote management tools. This can be done via Active Directory audit logs for relevant permission adjustments.

  - **Identify malicious indicators:** Look for anomalies such as multiple connections from unusual hosts or known suspicious IP addresses associated with prior incidents of abuse, such as using geolocation data or threat intelligence feeds. This includes identifying outlier user behaviors that deviate from established baselines.

  ---

  ### Prioritization

  This alert has medium severity based on the potential impact of unauthorized remote access on critical systems. The likelihood of malicious abuse is significant due to the nature of remote management tools being commonly exploited by attackers for persistence and lateral movement. Such behavior is not uncommon and can represent a clear risk if not adequately monitored.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Instant Housecall, which could lead to false positives. Reliable detection depends on proper logging configurations, including Windows Filtering Platform logs. Additionally, benign users such as IT support teams may trigger this alert during routine maintenance. A related detection to consider is the monitoring of increased command-line activities associated with captures from Remote Desktop Protocol (RDP) sessions, which might indicate further exploitation efforts.

