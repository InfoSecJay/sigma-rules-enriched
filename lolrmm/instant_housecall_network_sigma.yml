note: |
  ### Technical Context
  This rule detects potential network activity related to the Instant Housecall Remote Monitoring and Management (RMM) tool. By monitoring connections to specific domains associated with Instant Housecall, this detection aims to identify unauthorized or suspicious use of the tool that could signify a security incident, such as remote access by an attacker or misuse by an insider threat. Attackers may exploit legitimate remote management tools to bypass traditional security mechanisms and gain access to sensitive information or systems.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002): In cases where attackers leverage legitimate software to execute commands or manage systems remotely.
  - **Command and Control** (TA0011): Utilizing the RMM tool for establishing a channel to control target systems.

  Primary data sources for this detection involve:
  - **Network connection logs**: These logs record outbound connections including the destination hostnames, providing insight into connections made by systems within the network.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine logs for outbound connections to the identified Instant Housecall domains. Take note of source IP addresses and timestamps to understand the context of the activity.

  - **Identify Associated Hosts**: Correlate the source IPs with asset inventory to determine if these hosts are meant to use RMM tools legitimately. Verify if any unapproved hosts are making connections.

  - **Check User Activity**: Look for user authentication and activity logs on the implicated systems. Determine if the access aligns with expected roles and responsibilities.

  - **Analyze Process Executions**: Once potential misuse is identified, investigate the running processes on the originating machines to look for the Instant Housecall application and related scripts or commands that might indicate its use.

  ### Prioritization
  The alert's severity is regarded as medium due to the potential risk involved with unauthorized remote access tools, which can lead to data breaches or system compromises. While the Instant Housecall tool has legitimate uses, its detection necessitates further investigation to differentiate between authorized and malicious activity.

  ### Blind Spots and Assumptions
  This detection rule relies on specific domains associated with the Instant Housecall RMM tool; therefore, if attackers leverage variant domains or other remote access tools not covered in this rule, such activities may go undetected. The assumption is also made that all legitimate use of Instant Housecall is approved and appropriately logged; however, insider threats could exploit this tool without proper oversight. To ensure this alert functions effectively, comprehensive logging of outbound network connections must be enabled across all endpoints in the enterprise network.

