note: |
  ### Technical Context

  The Sigma rule detects outbound network connections to domains associated with the Instant Housecall Remote Management Tool (RMM), specifically those ending in `instanthousecall.com` and its variants. This behavior typically indicates an attempt to establish remote access to a system, allowing potential unauthorized control or monitoring. The likely attacker objective is to utilize the RMM software for malicious actions, such as deploying malware, exfiltrating data, or conducting further reconnaissance.

  This detection aligns with the MITRE ATT&CK tactic: **Command and Control (T1071)** and technique: **Application Layer Protocol (T1071.001)**. The primary telemetry sources are Windows network connection logs, specifically monitoring output for network connections (e.g., `Event ID 5156` for Windows Filtering Platform) where the destination hostname matches the specified domains. If successful, the security impact could include unauthorized access to sensitive data or critical systems. It is important to note that this detection alone does NOT confirm malicious activity without correlating with other indicators of compromise, such as anomalous user behavior or privilege escalation.

  ### Investigation Steps

  - **Validate network connection details:** Check Windows Filtering Platform logs for `Event ID 5156` or `Event ID 4656` to identify connections made to domains ending in `instanthousecall.com`. Look for timestamp, source IP address, and process involved to ascertain the context of the activity.

  - **Identify legitimate usage:** Review the asset inventory for any authorized use of Instant Housecall on the affected host. Note that legitimate connections may have documentation or recorded approvals linked to a user account.

  - **Correlate with user activity:** Check for `Event ID 4624` (logon events) around the same timeframe as the network connection. Subsequent administrative or unusual user actions on the host can indicate a higher likelihood of malicious use.

  - **Determine process ownership:** Investigate the process that initiated the network connection using `Sysmon Event ID 1` (process creation events) to check for execution context. Analyze the command line parameters and parent processes to detect abnormal behavior.

  - **Look for other indicators:** Search for recent file modifications or abnormal scheduled tasks using `Event ID 4663` to uncover attempts at installing or running backdoor tools typically associated with RMM usage.

  ### Prioritization

  This alert has medium severity due to the potential access it indicates on critical systems, where such remote tools can be abused. While not the most commonly weaponized technique, improper use of RMM software can often be indicative of unauthorized access and must be investigated promptly, especially if the affected systems hold sensitive data.

  ### Blind Spots and Assumptions

  Detection is limited by the presence of legitimate Instant Housecall RMM usage, which may trigger false positives. Reliable detection requires the monitoring of outbound connections, specifically making sure that network and filtering logs are enabled. Legitimate users connected to Instant Housecall may present as false positives if not reviewed in context. Companion detections, such as monitoring for abnormal file system changes or unexpected systems communicating with known command-and-control nodes, can strengthen overall security posture.

