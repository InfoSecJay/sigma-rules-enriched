note: |
  ### Technical Context

  This rule detects network connections to domains associated with the Instant Housecall Remote Management Tool (RMM). Adversaries may use such tools to maintain persistence or control compromised systems remotely, often after initial exploitation has successfully occurred. The relevant MITRE ATT&CK tactics include Command and Control (T1219).

  Primary telemetry sources include Windows network connection logs that capture DNS requests and network connections. The security impact of this detection could be significant, as unauthorized use of RMM tools can lead to data exfiltration or further compromise of the network environment. It is important to note that this detection does NOT confirm malicious activity on its own, as the use of Instant Housecall can occur legitimately in managed IT environments.

  ### Investigation Steps

  - **Check network connection logs for suspicious activity:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to any of the detected Instant Housecall domains. Highlight suspicious connections from critical assets, such as servers or domain controllers.

  - **Validate user and application legitimacy:** Identify the user account associated with the outbound connection and whether it has authorized access to RMM tools. Look for Windows Event ID 4624 for logon events showing the account is legitimate.

  - **Identify recent installations or use of RMM software:** Check for installations of Instant Housecall by looking for installation logs (Windows Event ID 11707) or the presence of the application in the Program Files directory.

  - **Analyze related DNS queries:** Examine DNS Query logs for requests to the domains specified in the rule. Look for signs of repeated queries from internal hosts that could indicate malicious behavior versus standard operational activity.

  - **Look for upstream connections from known attack infrastructure:** Utilize threat intelligence feeds to correlate connections to confirmed malicious IP addresses or domains that could signal a larger attack campaign involving the RMM tool.

  ### Prioritization

  This alert has medium severity due to the impact of the systems involved, particularly if critical assets are affected. While RMM tools can be used legitimately, their presence can often indicate attempts by adversaries to maintain access, making this behavior potentially exploitable and warranting further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where legitimate use of RMM tools occurs without proper controls or monitoring. Reliable detection relies on consistent logging of network connections and DNS queries across all networked devices. Legitimate IT support activities may trigger these alerts. A related detection, such as tracking abnormal Windows logon patterns (T1078), can complement this detection for enhanced context and coverage.

