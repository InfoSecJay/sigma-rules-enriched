note: |
  ### Technical Context

  This Sigma rule detects network connections made to the Instant Housecall remote management tool, specifically towards domains related to the tool such as `instanthousecall.com`. An attacker may use this tool to gain remote access to systems, allowing for potential exploitation or lateral movement within the network. The relevant MITRE ATT&CK tactic is "Exploitation" (TA0002), with the technique being Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs that record outbound requests made to the specified domains. If malicious, this could lead to unauthorized access, data exfiltration, or system compromise. It's important to note that this detection alone does not confirm malicious intent, as legitimate remote support personnel may also utilize Instant Housecall for authorized tasks.

  ### Investigation Steps

  - **Identify the connection origin:** Review Windows Security Event logs (Event ID 5156) to capture outgoing network connections and filter for any processes initiating connections to `*.instanthousecall.com` or `*.instanthousecall.net`.

  - **Correlate process creation:** Check for any related process creation events (Sysmon Event ID 1) to identify which application initiated the connection, looking for unusual or unauthorized applications that could indicate malicious use.

  - **Examine legitimate activity:** Determine if the network connection coincides with expected behavior, such as scheduled support sessions by known IT personnel. Compare timestamps and IP addresses against known legitimate users or tickets.

  - **Check host security posture:** Evaluate the endpoint's security status for any indicators of previous compromise, such as signs of persistence mechanisms (e.g. unusual services or scheduled tasks) that may also correlate with Instant Housecall usage.

  - **Look for anomalous connections:** Identify concurrent or unusual outbound connections to other suspicious domains or IPs, which may indicate an attacker's use of various tools and techniques.

  ### Prioritization

  This alert should be treated with medium severity. While the affected systems may have critical roles, such as servers or administrative machines, the likelihood of malicious abuse is moderate, given that Instant Housecall is a legitimate tool. This behavior is not excessively common but could indicate active exploitation attempts if used by unauthorized individuals.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion tactics, such as the use of legitimate credentials for authorized users or modified software configurations that disguise the tool's usage. Reliable detection requires fully enabled logging for network connections on Windows hosts, including monitoring of DNS queries. Legitimate activities, such as authorized remote support sessions, may trigger the alert. Related detections, such as monitoring for unusual account logins or failed login attempts could enhance overall coverage and context for investigation.

