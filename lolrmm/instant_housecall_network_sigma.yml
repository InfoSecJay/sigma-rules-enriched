note: |
  ### Technical Context

  This rule detects network connections to domains associated with Instant Housecall, a remote management tool that can be used for both legitimate remote support and malicious purposes. An attacker may use this tool to gain unauthorized access to systems to perform actions such as information theft, lateral movement, or persistent access. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), with techniques such as **Application Layer Protocol** (T1219).

  Primary telemetry sources include network connection logs on Windows systems, specifically looking for DNS requests or connection attempts to the domains specified in the detection logic. If the activity is malicious, it may lead to unauthorized access and compromise system integrity. However, this detection rule does NOT confirm that all connections to these domains are malicious, as legitimate use of Instant Housecall exists.

  ### Investigation Steps

  - **Check recent network activity:**
    Review Windows Event Logs (Event ID 5156) for outbound connections to the domains `*.instanthousecall.com` or `*.instanthousecall.net`. Analyze timestamps to correlate with the alert and identify unauthorized access patterns.

  - **Investigate process execution:**
    Verify if the processes initiating connections to these domains are expected. Check for Suspicious parent processes in Event ID 4688 or Sysmon Event ID 1. Legitimate processes should not frequently spawn unexpected executables tied to Instant Housecall.

  - **Correlate user actions:**
    Review user activity logs to confirm if there is a legitimate business need for remote access using Instant Housecall. Investigate if the initiating user account has appropriate permissions and if it aligns with recent support requests.

  - **Identify malicious indicators:**
    Look for known malicious hashes related to Instant Housecall tools in systems. Use an endpoint detection solution to identify any unauthorized file creations or executions of suspected Instant Housecall binaries (e.g., `instanthousecall.exe`).

  - **Review firewall and proxy logs:**
    Examine firewall logs to confirm outbound traffic to Instant Housecall domains (IP addresses should match the domain). Check for unusual patterns, such as repeated connections from a single internal IP.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on compromised systems and the likelihood of exploitation, as remote management tools like Instant Housecall are commonly abused by attackers. While usage of these tools can be legitimate, frequent or unexpected activity can be a leading indicator of malicious behavior.

  ### Blind Spots and Assumptions

  This detection may miss connections made via non-standard ports or encrypted channels that could hide legitimate uses. It assumes that DNS logs or network connection metadata are adequately captured and monitored. Legitimate remote support activities may cause these alerts to trigger frequently. It is prudent to correlate this alert with detections looking for process anomalies or other C2 indicators to enhance coverage.

