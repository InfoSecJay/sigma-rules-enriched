note: |
  ### Technical Context

  This rule detects network connections to the Instant Housecall Remote Monitoring and Management (RMM) tool, which utilizes specific domains for communication. An attacker may leverage such tools to gain remote access or perform management operations on compromised systems. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) with the technique identified as **Remote Access Tools** (T1219).

  Primary telemetry sources include Windows firewall logs, SMB traffic logs, or network flow logs highlighting connections made to these specific domains. If malicious, the security impact could be significant, allowing attackers to control and manipulate systems remotely. However, this detection does NOT confirm malicious intent or compromise on its own, as legitimate use by IT support teams could trigger the same alerts.

  ### Investigation Steps

  - **Verify the destination:** Check for outbound connection attempts to domains like `*.instanthousecall.com` using network flow logs (e.g., Windows Firewall log Event ID 5156). Legitimate usage typically comes from known IT support systems.

  - **Analyze the source IP:** Identify the originating host for the connection attempt to determine ownership (use Event ID 4688 for process creation detail). Track the running processes to see if there’s a correlation with administrative tools or known legitimate applications.

  - **Cross-reference with user access logs:** Review authentication logs for remote access attempts around the same timeframe using Security Event ID 4624 (logon events). If a user is not authorized to access RMM tools, this raises suspicion.

  - **Evaluate connection frequency:** Identify repeated connection attempts to Instant Housecall domains to assess potential malicious behavior. Continuous attempts over a short time span could indicate automation or misuse.

  - **Assess endpoint roles and criticality:** Focus on alerts coming from high-privilege assets or critical infrastructure. Connections from non-administrative systems may be more indicative of suspicious activity.

  ### Prioritization

  The alert is medium severity due to the potential security risk associated with RMM tools, particularly when used on critical systems. The likelihood of malicious abuse is notable, as attackers frequently utilize such tools for persistent access. The behavior is also weaponized in targeted organizations, warranting further investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of IP spoofing or the use of VPNs that could mask the destination. Ensuring that the necessary Windows firewall logs and network configuration settings are in place is crucial for reliable detection. Legitimate IT support activity might trigger this alert, leading to potential false positives. A companion detection to strengthen coverage could involve monitoring for unusual administrative process activities on endpoints or using an endpoint detection and response (EDR) tool to correlate behavior with known RMM signatures.

