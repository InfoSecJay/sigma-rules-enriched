note: |
  ### Technical Context

  This Sigma rule detects network connections to hosts associated with the Instant Housecall remote management tool, which is commonly used for legitimate remote support. The likely attacker objective is unauthorized remote access or management of target systems, potentially leading to data exfiltration or system compromise. The relevant MITRE ATT&CK tactic is "Execution," and the technique is "Remote Services" (T1219). The primary telemetry sources required are Windows network connection logs, focusing on connection attempts to specific domain names. A malicious impact could involve an attacker gaining control over systems or deploying additional malware. It's important to note that the detection of network activity to these domains does not confirm malicious intent or usage, as legitimate support activities may trigger the alert.

  ### Investigation Steps

  - **Review connection logs for remote access:** Examine the Windows network connection logs for Event ID 5156, specifically looking for connections to the following domains: `*.instanthousecall.com`, `*.instanthousecall.net`, and `secure.instanthousecall.com`. Confirm if the connection was initiated by an authorized user or process.

  - **Identify legitimate usage patterns:** Determine if any recorded connections coincide with known maintenance windows or support requests. Check for records in ticketing systems that may correlate to the usage of Instant Housecall.

  - **Check user account activity:** Look into the Windows Security Event ID 4624 for successful logon attempts to ensure that the account initiating the connection is authorized. Unusual accounts should be flagged for further investigation.

  - **Search for process execution:** Validate process creation for processes related to Instant Housecall using Sysmon Event ID 1. Check which user executed these processes and if they align with known administrative or support staff.

  - **Investigate potential data exfiltration indicators:** Review for unusual outbound traffic volume or destination IPs associated with the Instant Housecall domains, especially if large file transfers or sensitive data flows are detected during the session.

  ### Prioritization

  This alert has medium severity as it involves potential remote management activities that can lead to significant security risks if abused by an attacker. While the legitimate use of Instant Housecall exists, the likelihood of adversarial abuse is notable; attackers often leverage such tools for unauthorized remote access.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of the Instant Housecall tool, which can result in false positives. Ensure Windows firewall and connection logging are properly configured to capture all relevant network activity. Legitimate IT support activities may frequently trigger this alert. A related detection to consider would be monitoring for unusual process behaviors associated with other remote access tools, enhancing the robustness of threat coverage.

