note: |
  ### Technical Context

  This rule detects network connections to domains associated with the Instant Housecall Remote Management Tool (RMM). Adversaries may use RMM tools to remotely access systems, potentially to facilitate unauthorized data access, manipulation, or control of targeted machines. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), and the technique is Application Layer Protocol (T1219). The primary telemetry sources include Windows network connection logs, specifically monitoring destination hostnames.

  If this behavior proves malicious, it could indicate compromised credentials or unauthorized access to managed endpoints. This detection alone does not confirm that a compromise has occurred; legitimate user activity, such as IT support or administrative tasks, may also trigger this alert.

  ### Investigation Steps

  - **Check connection logs:** Review network connection logs (Windows Event ID 5156) for connections to the listed Instant Housecall domains. Look for outbound connections to `*.instanthousecall.com` or `secure.instanthousecall.net` indicating potential remote access activity.

  - **Identify user context:** Determine which user account initiated the connection. Cross-reference with expected user behavior; legitimate use of Instant Housecall typically occurs from administrative accounts under controlled circumstances.

  - **Correlate with endpoint activity:** Use Sysmon Event ID 3 to investigate process creation. Look for processes initiated from the host that connect to Instant Housecall domains, especially unusual or non-standard processes that deviate from typical administrative tasks.

  - **Assess endpoint role:** Verify the role of the affected asset. High-value assets (e.g., servers) responding to RMM activity without prior endorsement indicate higher risk and should be prioritized for deeper investigation.

  - **Look for command and control signatures:** Search for any related log artifacts indicative of command and control behavior, such as unusual data exfiltration attempts or lateral movement logs associated with events from the Same Source IP targeting other endpoints.

  ### Prioritization

  This alert is medium severity due to the potential risk of unauthorized remote access to systems, particularly in environments where Instant Housecall is not explicitly authorized. The likelihood of malicious use is moderate, given that RMM tools can be weaponized by adversaries for illicit access to sensitive systems.

  ### Blind Spots and Assumptions

  The detection may not capture traffic if logging for network connections is misconfigured or missing. Legitimate activities (e.g., IT support using Instant Housecall) may trigger the alert without malicious intent. A related detection to strengthen coverage would be monitoring for high volumes of remote access attempts initiated from unusual user accounts or geolocations, which may indicate potential credential theft or compromised accounts.

