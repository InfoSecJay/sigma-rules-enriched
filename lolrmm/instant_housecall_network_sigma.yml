note: |
  ### Technical Context

  This Sigma rule detects network activity related to the Instant Housecall Remote Monitoring and Management (RMM) tool, which connects to specific domains associated with its operation. Attackers may use this tool for remote access to compromised systems, supporting lateral movement or data exfiltration, achieving objectives aligned with the MITRE ATT&CK tactic of Command and Control (T1102) and technique T1219. The primary telemetry sources include Windows network connection logs, specifically looking for outbound connections to domains ending with `*.instanthousecall.com` or `*.instanthousecall.net`. If malicious, this behavior could facilitate unauthorized remote access or control over sensitive systems. Importantly, this detection does NOT confirm that the tool is being used for malicious purposes, as it may also be legitimately utilized by authorized personnel.

  ### Investigation Steps

  - **Review outbound connections:** Examine Windows Event ID 5156 (Windows Filtering Platform) for any connections to `*.instanthousecall.com`, noting source IP addresses and timestamps. Benign connections may correlate with known IT support operations in your organization.

  - **Correlate with user accounts:** Check user logins (Event ID 4624) around the time of detected connections to associate user accounts with remote access sessions. Look for accounts with legitimate RMM services enabled.

  - **Analyze process execution:** Check for associated processes using Sysmon Event ID 1 to identify if processes like `instantHousecall.exe` are launched alongside network connections. Authentic executions will normally align with known operational hours.

  - **Validate application configuration:** Investigate group policy settings and application whitelists to confirm whether Instant Housecall is an approved tool in the environment. Unauthorized versions or entry may indicate potential misuse.

  - **Monitor for exfiltration activity:** Look for unusual file creation or modification patterns (Sysmon Event ID 11) that may coincide with the detected remote access sessions. Legitimate usage should not involve large data movements or access to sensitive data structures unexpectedly.

  ### Prioritization

  This alert carries a medium severity due to the potential impact on systems where Remote Management access points exist. The likelihood of malicious abuse is significant, particularly in environments where remote support tools are not tightly controlled. Given that RMM tools can be weaponized, swift action is necessary to assess risk.

  ### Blind Spots and Assumptions

  Detection may be limited by the specific configurations of environments, where exceptions or whitelists for legitimate use can lead to false positives. Be aware that legitimate system administration tasks may trigger these alerts, particularly in an organization actively employing remote assistance tools. A companion detection such as unauthorized process creation (e.g., through Sysmon Event ID 1) enhances overall monitoring of potential threats related to RMM tool usage.

