note: |
  ### Technical Context

  This rule detects outbound network connections to the Instant Housecall Remote Management and Monitoring (RMM) tool's domains, indicating potential unauthorized access or management sessions initiated by an attacker. The likely attacker objective is to establish a command-and-control (C2) channel or to remotely administer compromised systems, which aligns with the MITRE ATT&CK tactics for Command and Control (TA0011) and Remote Access Tools (T1219).

  The primary telemetry source consists of Windows network connection logs, specifically focusing on DNS queries or session initiation records that reference Instant Housecall's domains. If the detected activity is malicious, it could indicate a compromised system being exploited for unauthorized remote access. However, this detection alone does NOT confirm the intent behind the connection; legitimate administrative use of Instant Housecall could trigger the alert.

  ### Investigation Steps

  - **Review recent network connections:** Check for Security Event ID 5156 (Windows Filtering Platform) or equivalent network logs for outbound connections to any Instant Housecall domain. Look for anomalies related to user roles, such as unauthorized user accounts making these connections.

  - **Validate legitimate usage:** Confirm whether any user accounts typically utilize Instant Housecall for legitimate remote support. Reference user enablement logs or internal documentation regarding authorized software use.

  - **Assess process initiation:** Scrutinize running processes (Sysmon Event ID 1) on the source host during the timeframe of the network connection. Look for unusual process names or signatures indicative of remote access trojans or scripts.

  - **Monitor for associated logins:** Correlate authentication logs (Event ID 4624) during the period of detected outbound connections to identify any non-standard logins or account anomalies, especially from less common remote access accounts.

  - **Check for file transfers:** If applicable, investigate for file creation or modification events that coincide with network activity (e.g., Sysmon Event ID 11) to determine if sensitive data was exfiltrated or manipulated.

  ### Prioritization

  The alert should be considered medium severity due to the potential for sensitive system exposure through the RMM tool. The risk is elevated if the affected system plays a critical role in infrastructure management. Since RMM tools are frequently weaponized, this raises the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through spoofed DNS or encrypted traffic to the identified domains. Reliance on DNS logs or WFP logs must ensure that comprehensive logging is enabled for complete visibility. Legitimate IT support teams may trigger alerts when using Instant Housecall, necessitating contextual validation. A companion detection to consider is monitoring for process creation events (Sysmon Event ID 1) that may indicate the deployment of unauthorized RMM tools or exfiltration attempts.

