note: |
  ### Technical Context

  This rule detects potential network connections to the Instant Housecall Remote Management and Monitoring (RMM) tool, which may be indicative of unauthorized remote access attempts or use of a remote access trojan within the network. The likely attacker objective is to gain remote control over compromised systems for data exfiltration, lateral movement, or further exploitation. The relevant MITRE ATT&CK tactic for this detection is "Command and Control" (TA0011), with the technique being "Application Layer Protocol" (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring outbound requests to the domains associated with Instant Housecall (e.g., `instanthousecall.com` and its variations). The security impact of a successful malicious connection may include unauthorized access to sensitive systems and data. This detection does NOT confirm a successful remote access event on its own, as legitimate usage of Instant Housecall is possible.

  ### Investigation Steps

  - **Check outbound connections to known domains:** Review Windows Firewall logs or network connection logs for Event ID 5156 to identify connections to `*.instanthousecall.com`. Note connections from unexpected hosts, especially critical assets.

  - **Identify the process initiating the connection:** Investigate the Windows Security Event ID 4688 to trace the process responsible for the outbound connection to the Instant Housecall domains. Look for known processes such as `rundll32.exe` which may indicate anomalous use.

  - **Review the host’s remote connection history:** Use `Get-EventLog` or equivalent to identify any legitimate use of Instant Housecall in the past. Check timestamps and user accounts associated with previous connections to validate expected behavior.

  - **Evaluate user account activity:** Correlate the Time and User ID from Event ID 4624 (logon) with the connection event to determine if the user was logged in when the connection was made, indicating potential user action or compromise.

  - **Collect additional context for persistent threats:** Identify if the detected behavior correlates with previous alerts for unusual behavior across other tools associated with remote management (e.g., TeamViewer, AnyDesk). Use incident response playbooks to check related detections.

  ### Prioritization

  This alert has medium severity due to the potential for malicious exploitation and the impact of unauthorized access to sensitive systems. The use of RMM tools like Instant Housecall is often weaponized by attackers seeking easy remote access to further compromise an environment. If the alert is triggered from critical assets, it warrants immediate investigation.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate use of Instant Housecall by trusted administrative users, which could lead to false positives. Ensure network logging and monitoring configurations are capturing all outbound connections effectively. Additionally, legitimate administrative use or third-party support could legitimately trigger this alert. Related detections for known remote access tools should be monitored to enhance detection coverage and contextual analysis.

