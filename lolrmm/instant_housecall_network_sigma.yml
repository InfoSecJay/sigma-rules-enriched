note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Instant Housecall Remote Monitoring and Management (RMM) tool. The presence of these connections may indicate unauthorized remote access efforts during an attack. The likely attacker objective is to perform remote administration or exploit remote access capabilities on compromised systems. This behavior aligns with the MITRE ATT&CK technique **Remote Services (T1219)**.

  The primary telemetry source involves Windows network connection logs, specifically looking for events where the **DestinationHostname** matches the defined Instant Housecall domains. If this activity is malicious, it can potentially lead to unauthorized access and system compromise, thereby impacting data integrity and system confidentiality. It is crucial to note that this detection alone does not confirm malicious intent; legitimate use of Instant Housecall for remote support or administration may also trigger this alert.

  ### Investigation Steps

  - **Review outbound connections:** Inspect the network connections from the host using Windows Event ID 5156 (Windows Filtering Platform's “allowed connection” events). Look for connections to `*.instanthousecall.com` and `*.instanthousecall.net`. Note timestamps and user context associated with the connections.

  - **Identify user activity:** Check Windows Event ID 4688 (process creation) to identify the user executing commands or applications related to the Instant Housecall tool. If this is a user-managed service with appropriate authorization, document the activity as benign.

  - **Assess the context:** Correlate the outbound connection timestamps with other logs (e.g., Windows Event ID 4624 for successful logons) to determine if the activity coincides with legitimate user access or is out of hours, indicating potential malicious behavior.

  - **Validate all processes running:** Use Sysmon Event ID 1 logs to capture the process tree and identify any associated processes (e.g., Instant Housecall executables) that may indicate remote control capabilities. Look for processes created by unexpected user accounts or services.

  - **Check for additional artifacts:** Investigate for files or logs created by Instant Housecall that could indicate its operational use, especially in directories like `%ProgramFiles%` or `%LocalAppData%`. Relate their presence to confirmed usage patterns.

  ### Prioritization

  The alert has medium severity due to the impact potential of unauthorized remote access to critical systems. There is a moderate likelihood that malicious actors may exploit such tools for unauthorized access, as RMM tools are commonly weaponized in attacks. This implies that despite legitimate use cases, caution is warranted when reviewing any detected activity.

  ### Blind Spots and Assumptions

  Detection might be circumvented by using alternative remote access tools or through IP whitelisting for legitimate connections. Reliable detection requires well-configured logging for Windows Filtering Platform events and process creation logs. Legitimate use, such as remote support from trusted IT personnel, could trigger this alert. Companion detections for other RMM tools or connection attempts to unknown domains may also enhance security visibility.

