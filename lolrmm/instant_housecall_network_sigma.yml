note: |
  ### Technical Context

  This Sigma rule detects network connections established to or from domains associated with the Instant Housecall remote monitoring and management (RMM) tool. An attacker may use this tool to control devices within a network, potentially gaining unauthorized access to sensitive data or conducting malicious activities, which is often part of a larger command and control (C2) strategy. The relevant MITRE ATT&CK tactics include "Command and Control" (TA0011) and the technique "Remote Access Software" (T1219).

  The primary telemetry source for this detection is the Windows network connection logs, specifically capturing DNS queries and outbound connections. If malicious, the security impact includes potential compromise of endpoint integrity and confidentiality. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate use of the Instant Housecall tool can trigger the alert.

  ### Investigation Steps

  - **Examine network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) to identify connections to `*.instanthousecall.com` or `*.instanthousecall.net`. Note legitimate connections from known IT support staff.

  - **Validate user context:** Check the user account associated with the connection attempt. Legitimate RMM activity may be initiated by support accounts during service sessions; unusual account activity should be flagged.

  - **Review endpoint activity:** Look for Sysmon Event ID 23 (DNS Query) to validate the presence of recent DNS resolutions for "instanthousecall.com" or its subdomains. Compare against historical records to identify abnormalities.

  - **Analyze associated processes:** Investigate for process creation events (Security Event ID 4688) linked to the Instant Housecall executable (e.g., InstantHousecall.exe). Confirm that only authorized processes with recognized user accounts are running this tool.

  - **Check for file transfers:** Review file creation logs or logs for remote session events, specifically looking at Security Event ID 4688 and 5145 (Network Share Object Access) to see if there are uploads or downloads linked to the tool, which would indicate potentially malicious activity.

  ### Prioritization

  This alert should be considered medium severity due to the potential gravity of RMM tools being weaponized by attackers for illicit access. The impact can be significant if sensitive endpoints are compromised, and while usage of this software can be legitimate, unauthorized access typically suggests higher stakes.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of attackers using alternative domains or obfuscating their connections. This rule relies on Windows network logs being configured correctly; insufficient logging could result in missed detections. Legitimate IT support sessions and activity may trigger alerts, so it is crucial to verify user behavior. Companion detections for unauthorized remote access tool installations or related traffic can enhance monitoring efforts.

