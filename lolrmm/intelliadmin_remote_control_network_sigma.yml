note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the IntelliAdmin Remote Control (RMM) tool, which is commonly used for remote desktop management. The rule specifically looks for network connections made to domains related to IntelliAdmin, such as `intelliadmin.com` and `user_managed`. Attackers may misuse RMM tools like IntelliAdmin to establish unauthorized remote access to systems within an enterprise environment, often for data exfiltration or lateral movement.

  The likely attacker objectives include gaining remote control over target machines to manipulate data, deploy additional malware, or exfiltrate sensitive information. Given the increasing prevalence of remote administration tools in cyber attacks, monitoring their usage is critical in preventing unauthorized access and potential data breaches. The relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic:** Execution
  - **Technique:** Remote Services (T1219)

  The primary data sources for this detection include network connection logs that track outbound requests and DNS query logs that may reveal additional details about the intended destinations.

  ### Investigation Steps
  - **Review Network Logs:** Examine network connection logs for outbound connections to `intelliadmin.com`, `user_managed`, or other relevant domains to identify unauthorized usage.
  - **Analyze DNS Logs:** Check DNS query logs for any unusual or unauthorized requests to the specified IntelliAdmin domains, which could indicate potential misuse of the RMM tool.
  - **Correlate with Asset Inventory:** Cross-reference the identified endpoints with asset inventories to ascertain if the connections were made by legitimate administrative tools or by unauthorized users.
  - **Check for User Accounts:** Investigate logins from accounts that interacted with the IntelliAdmin service to ensure they correspond to known administrative users and check for any anomalies in login behavior.

  ### Prioritization
  This alert is considered medium severity due to the potential for unauthorized access and remote management of endpoints within the organization. While legitimate use exists, the likelihood of malicious actors exploiting such tools necessitates careful monitoring.

  ### Blind Spots and Assumptions
  The detection logic assumes that all remote access through IntelliAdmin can be classified as suspicious, which may lead to false positives in environments with legitimate uses of the tool. There could be gaps in detection if the logs from certain network devices or the logging levels are not adequately configured. Additionally, if traffic is encrypted, the rule may not capture all relevant activity, especially in more complex network architectures. Proper configuration of logging across firewalls and endpoints is essential for this rule to function effectively.

