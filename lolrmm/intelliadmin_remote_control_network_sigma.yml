note: |
  ### Technical Context

  This rule detects network activity indicative of the IntelliAdmin Remote Control tool, specifically connecting to hosts associated with IntelliAdmin or designated user-managed systems. The likely attacker objective is unauthorized remote access or system administration, often associated with data exfiltration or system manipulation. This detection aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219). The primary telemetry sources are Windows network events, particularly focusing on outbound connections captured in network connection logs.

  If the activity is malicious, it could enable attackers to control compromised systems remotely. However, this detection alone does not confirm malicious intent as legitimate instances of IntelliAdmin usage exist in many enterprise environments.

  ### Investigation Steps

  - **Review recent network connections:**
    Analyze network connection logs (Event ID 5156) for outbound connections to domains ending in `.intelliadmin.com` or any endpoints labeled as `user_managed`. Look for unusual connection times or source IPs that differ from regular patterns.

  - **Validate installation of IntelliAdmin:**
    Check if IntelliAdmin is installed on the affected hosts by correlating with software inventory (e.g., using PowerShell to query installed programs). Legitimate use will often show consistent and recognized installations across known administrative systems.

  - **Identify unusual user behavior:**
    Assess user activity logs (Event IDs 4624 for logon and 4688 for process creation) on the associated endpoints. Look for unusual logons or process executions by non-administrative users, which may indicate misuse of the tool.

  - **Correlate endpoint activity:**
    Analyze Sysmon logs (Event ID 3) for process creation related to IntelliAdmin executable files. Legitimate behavior would typically show expected process hierarchies with low complexity, while malicious activities might involve unexpected flags, arguments, or parent processes.

  - **Investigate lateral movement attempts:**
    Review logs for failed or successful logon attempts (Event ID 4625 for failed and 4624 for successful) in the vicinity of the detected IntelliAdmin connections. Anomalous login patterns, especially from known external IPs, may indicate active exploitation.

  ### Prioritization

  This alert is of medium severity given that it may indicate a potential backdoor into critical systems, increasing the risk of unauthorized access or data loss. While legitimate administrative uses exist, the likelihood of exploitation through known Remote Management tools is a growing concern in the current threat landscape.

  ### Blind Spots and Assumptions

  Evasion techniques might include the use of legitimate administrative accounts to mask unauthorized access. The detection relies on accurate network logs; any misconfigurations or absence of logging could lead to missed detections. Activities such as legitimate IT departmental support or system maintenance may trigger similar alerts, complicating investigations. Companion detections involving unauthorized user account activity (e.g., T1078 - Valid Accounts) can enhance security posture by correlating with potential misuse of remote access tools.

