note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the IntelliAdmin Remote Control (RMM) tool, typically employed by system administrators for remote management of systems. The likely attacker objective is unauthorized access and control over a target machine, potentially to conduct further malicious actions or exfiltrate sensitive information. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1105), specifically leveraging technique T1219, which pertains to Remote Access Tools.

  The primary telemetry sources are Windows network connection logs, specifically analyzing connections made to domains such as `*.intelliadmin.com` or hostnames ending with `user_managed`. If malicious, this can facilitate unauthorized control of endpoints, leading to significant security impact. However, this detection does NOT confirm malicious intent on its own; legitimate administrative use of IntelAdmin may trigger this alert alongside other benign activity.

  ### Investigation Steps

  - **Validate connection source and destination: **Review Windows Event ID 5156 (Windows Filtering Platform) logs for outbound network connections to `*.intelliadmin.com` or `user_managed`. Check if the source process is authorized (e.g., trusted administrative tools) versus unfamiliar processes.

  - **Identify malicious user activity: **Search for unusually high frequency of connections to the detected hostnames, particularly from non-admin user accounts. Malicious activity often appears as multiple connections initiated without corresponding legitimate administrative actions.

  - **Contextualize endpoint role: **Check the asset criticality of the device generating the alert. If the affected system is a server or high-value target, the severity increases significantly; apply a heightened scrutiny for unusual RMM tool presence.

  - **Review legitimate usage patterns: **Determine if authorized administrators or support personnel have recent tickets or automated scripts for remote management. Legitimate sessions typically originate from known IP addresses and follow a recognized schedule.

  - **Correlate with additional telemetry: **Examine Windows Event ID 4624 (Successful login) for coinciding logins from administrative accounts around the same timestamps. Cross-check against user activity reports to confirm the legitimacy of access.

  ### Prioritization

  This alert indicates medium severity due to the potential for unauthorized control over critical systems. The risk of malicious abuse increases if the affected endpoint is crucial to operations, and remote management tools like IntelliAdmin are common vectors for Remote Access Trojans (RATs).

  ### Blind Spots and Assumptions

  Detection may be limited if filtering rules are not in place for logging outbound connections. Legitimate administrative activities often produce similar alerts, especially in environments with multiple IT support functions. A complementary detection could focus on identifying the execution of unintended scripts or processes that utilize RMM tools, as they reinforce suspicious activities linked to remote management sessions.

