  ---

  ### Technical Context

  This Sigma rule detects potential network activity related to the IntelliAdmin Remote Control (RMM) tool, which can be used for remote administration of systems. The likely attacker objective would be unauthorized remote access to systems, leading to data exfiltration or other malicious activities. Relevant MITRE ATT&CK tactics and techniques include Remote Access (TA0001) and Remote Services (T1219). The primary telemetry sources are Windows network connection logs, specifically monitoring traffic for hostnames associated with IntelliAdmin's remote control services. If used maliciously, this could enable complete control over affected systems. However, this detection does NOT confirm malicious activity by itself, as it may also be triggered by legitimate administrative actions.

  ---

  ### Investigation Steps

  - **Check network connections:** Review network connection logs for Event ID 5156 (Windows Filtering Platform) or Sysmon Event ID 3. Look for connections to destination hostnames ending with ‘user_managed’ or subdomains of ‘intelliadmin.com’. Malicious activity indicators include connections made from unexpected hosts or outside usual business hours.

  - **Identify source process:** Analyze correlated process creation events linked to the detected network connection by checking Event ID 4688 or Sysmon Event ID 1. Malicious indicators may include unusual processes (e.g., cmd.exe or powershell.exe) that initiate connections to ‘intelliadmin.com’, especially if originated from non-administrator accounts.

  - **Review administrative policies:** Validate if the use of IntelliAdmin Remote Control is documented and approved within your organization's policies. Legitimate use typically includes entries in change management records. Lack of documentation can indicate unauthorized access.

  - **Examine user accounts involved:** Investigate the user accounts triggering the alert. High-risk accounts with administrative privileges are more suspect if found initiating RMM activities without prior authorization. Use AD logs for user activity (Event ID 4624) to check recent logon behaviors.

  - **Assess endpoint security measures:** Check for the presence of security solutions (e.g., EDR deployment) on affected systems. Validate whether the systems have the appropriate logging configurations active to capture remote access activities comprehensively.

  ---

  ### Prioritization

  This alert is rated medium severity due to the potential impact of remote control tools on critical systems and the increasing likelihood of their malicious use in exploitation scenarios. Remote access tools are commonly weaponized by threat actors for lateral movement and data breaches in compromised networks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential obfuscation by threat actors who may use similar legitimate tools or rename executables to evade detection. Reliable detection requires logs from Winlogon and Windows Filtering Platform to be enabled, ensuring comprehensive visibility. Legitimate use may occur during authorized IT support operations, which can inadvertently trigger the alert. A related detection to enhance coverage would be monitoring for suspicious credential use alongside any remote access generated alerts.

