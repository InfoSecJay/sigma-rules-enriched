note: |
  ### Technical Context

  This rule detects network activity associated with the IntelliAdmin Remote Control (RMM) tool, specifically when connections are established to hosts ending in "user_managed," "*.intelliadmin.com," or directly to "intelliadmin.com/remote-control." The likely attacker objective is remote management of compromised systems, potentially to install malware or manipulate system configurations. This behavior aligns with the MITRE ATT&CK techniques of Remote Services (T1219).

  Primary telemetry sources include Windows Event Logs capturing network connections, specifically the relevant Network Connection logs that enumerate TCP/UDP traffic. If malicious, the impact could be significant as it may facilitate unauthorized access and control over corporate assets. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of IntelliAdmin may trigger this alert.

  ### Investigation Steps

  - **Examine network connection logs**: Check Windows Event ID 5156 (Windows Filtering Platform) for any outbound connections to the specified IntelliAdmin domains. Look for connections made from sensitive systems, such as servers or critical infrastructure.

  - **Identify high-risk behavior**: Look for concurrent connections from the same IP or unusual activity, such as multiple connections within a short time frame to "intelliadmin.com." This may indicate malicious remote access attempts.

  - **Determine legitimate usage**: Review organizational policies regarding remote management tools. If IntelliAdmin is used, verify the connections align with known schedules or authorized personnel, especially from admin workstations.

  - **Cross-check endpoint activity**: Validate Sysmon Event ID 3 (Network Connection) on the involved endpoint for processes establishing connections to IntelliAdmin servers. Look for known remote management executables, indicating potential misuse.

  - **Monitor for lateral movement**: Investigate other alert logs for unusual user account activity or attempts to access sensitive resources from the endpoint detected connecting to IntelliAdmin, especially if unrecognized external IPs are noted.

  ### Prioritization

  The alert is classified as medium severity due to the potential impact on sensitive systems through unauthorized access via remote management. Given that such behavior can be weaponized, especially if combined with exploit activities, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited by legitimate usage of IntelliAdmin within the organization. The rule relies on accurate logging of network connections; ensure Windows Filtering Platform logs are enabled. Additionally, legitimate activities, like authorized support sessions, might trigger alerts. Complementary detections, such as monitoring for known remote administration tools or unusual user behavior, can enhance coverage and context for investigations.

