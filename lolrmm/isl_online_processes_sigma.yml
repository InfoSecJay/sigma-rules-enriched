note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ISL Online remote management tool, specifically `ISLLight.exe`, `ISLLightClient.exe`, `isllightservice.exe`, and `islalwaysonmonitor.exe`. The likely objective of the attacker leveraging this tool is to establish remote access for command and control (C2) in a targeted environment, facilitating persistence and operations such as data exfiltration or lateral movement. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), and the technique is **Application Layer Protocol: Remote Desktop Protocol** (T1219).

  The primary telemetry sources necessary for this detection are Windows event logs capturing process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, the impact could be significant, enabling unauthorized access to sensitive systems and data. However, it is important to note that this detection does NOT confirm malicious intent on its own, as ISL Online can be used for legitimate remote support purposes.

  ### Investigation Steps

  - **Review Process Creation Logs**: Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `ISLLight.exe` or related processes. Verify the parent process to identify the initiating application; malicious instances usually originate from unexpected contexts.

  - **Analyze User Account Activity**: Check for user accounts or service accounts running these processes. Legitimate usage often involves known support personnel or admin accounts, while anomalous user accounts may indicate compromise.

  - **Inspect Network Traffic**: Validate outbound network connections associated with ISL Online processes. Expected connections may involve known support server IPs, while connections to unfamiliar external IPs should be treated with suspicion.

  - **Correlate with Asset Criticality**: Determine the role of the affected host (e.g., server, endpoint) based on inventory documentation. ISL Online activity on critical infrastructure should trigger escalated response measures.

  - **Validate Legitimate Usage Patterns**: Elicit confirmation from relevant teams (such as IT support) regarding the legitimate use of ISL Online within the environment. Fresh installation times or unusual users operating this software could highlight potential misuse.

  ### Prioritization

  This alert should be treated with medium priority due to the potential high impact of unauthorized access through remote administration tools. The likelihood of malicious abuse is moderate, especially if the use is outside of established support processes. The ISL Online tool is not inherently malicious; however, it can be weaponized during advanced attacks.

  ### Blind Spots and Assumptions

  This rule has limitations in detecting evasion techniques such as process name obfuscation or manipulation by malware. A comprehensive logging strategy is required, including Sysmon configuration to capture detailed process creation events for reliable detection. Legitimate activities such as authorized remote support sessions may inadvertently trigger this alert. A related detection to bolster coverage is monitoring for anomalous user behavior that correlates with process activity, highlighting instances of privilege escalation or lateral movement.

