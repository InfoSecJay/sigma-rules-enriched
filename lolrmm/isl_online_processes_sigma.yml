note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ISL Online remote management tool, specifically identifying instances of ISLLight.exe, ISLLightClient.exe, isllightservice.exe, and islalwaysonmonitor.exe. The likely attacker objective is unauthorized remote access and control of compromised systems, facilitating data exfiltration or further exploitation. This detection corresponds to the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry source is Windows process creation logs, specifically Event ID 4688. If the activity is malicious, it can enable attackers to gain unauthorized administrative privileges, posing a high security risk to the organization. However, this detection does NOT confirm that the activity is malicious on its own, as ISL Online can also be used legitimately by authorized personnel for remote support tasks.

  ### Investigation Steps

  - **Check process parentage:** Review Event ID 4688 logs for the detected process. Analyze the ParentImage field to ensure it corresponds with legitimate user processes or known administrative tools. Malicious processes may have unusual parent images or be initiated by system accounts without interactive sessions.

  - **Identify user accounts:** Extract the SubjectUserName from the alert and verify if the account has legitimate administrative privileges. Legitimate usage of ISL Online will typically involve known support accounts or user IDs in the IT department.

  - **Assess process execution time:** Examine the Timestamp field associated with Event ID 4688. Compare the times of the ISL processes to identify any anomalies, such as execution times coinciding with unusual activity or user access patterns.

  - **Cross-reference with organizational policy:** Validate whether the detected processes are in line with company policies regarding the use of remote access tools. Consult your IT policy documents to determine if ISL Online is permitted, and under what circumstances.

  - **Review firewall and network logs:** Look for outbound connections to unusual IP addresses or domains associated with ISL Online via firewall logs or network monitoring tools, such as the destination IP field in firewall logs. High-confidence malicious indicators include unsolicited traffic to uncommon external entities.

  ### Prioritization

  This alert is of medium severity. The impact of the affected system can be significant, particularly if it involves sensitive data storage or critical infrastructure. The likelihood of malicious abuse is moderate, as remote management tools are frequently targeted by attackers, but they can also be utilized innocuously by authorized users.

  ### Blind Spots and Assumptions

  Detection limitations may occur if logging for process creation is disabled or misconfigured; ensure that Windows Event Forwarding is active for accurate monitoring. Legitimate administrative activities could trigger the alert when authorized staff use ISL Online for remote support. A related detection to strengthen coverage is monitoring for unusual outbound connections (e.g., other remote access software processes or unusual IP addresses).

