note: |
  ### Technical Context

  This Sigma rule detects the execution of ISL Online Remote Management and Monitoring (RMM) tool processes, specifically `ISLLight.exe`, `ISLLightClient.exe`, `isllightservice.exe`, and `islalwaysonmonitor.exe`. The primary objective of an attacker using this tool would be to establish remote access or control over a compromised host while exfiltrating sensitive information or managing further malicious activities covertly. This activity is associated with the MITRE ATT&CK technique T1219 (Remote Access Tools).

  The primary telemetry sources needed for this detection include Windows Process Creation events (Security Event ID 4688) and any relevant application logs that might indicate interactions with the RMM tool. If the RMM tool is used maliciously, it could lead to unauthorized data access or system manipulation. Importantly, this detection does NOT confirm that the activity is indeed malicious; legitimate use of ISL Online can also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for instances where the Image field contains `ISLLight.exe`, `ISLLightClient.exe`, `isllightservice.exe`, or `islalwaysonmonitor.exe`. Record the process ID and user context.
  - **Correlate with parent process**: Identify the ParentImage in the CreationTime of the detected processes to establish the originating legitimate application that might have invoked the RMM tool. This can help discern between benign usage and potential misuse.
  - **Analyze user behavior**: Investigate if the user associated with the process execution has a legitimate business need for remote access tools or if the usage appears unusual based on their role and activities.
  - **Check for unauthorized network connections**: Look for outbound connections to known ISL Online service endpoints within the collected Firewall logs or Proxy logs to identify potential command and control (C2) communications.
  - **Validate additional artifacts**: Examine file creation or modification timestamps for any related ISL tool files to ensure no rogue installations or unexpected configurations are present.
  - **Assess impact on critical assets**: Determine the role of the affected host (e.g., server, endpoint) and evaluate the potential risk associated with the tool's usage, prioritizing high-value assets for immediate inquiry.

  ### Prioritization

  The severity of this alert is medium due to the potential risk that ISL Online poses to critical systems. The likelihood of malicious abuse is moderate, as remote administration tools are common targets for attackers seeking persistent access. This behavior can also be weaponized by threat actors effectively, making it important to assess further.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that sophisticated adversaries could spoof legitimate processes or modify the software to evade detection. Reliable detection requires auditing and monitoring configurations that record process creation events accurately. Additionally, legitimate business operations, such as remote support activities, might frequently trigger this alert. Related detections include monitoring for unusual user account activity (T1078: Valid Accounts) to complement the investigation of RMM tool usage.

