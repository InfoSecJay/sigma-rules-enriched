note: |
  ### Technical Context

  This Sigma rule detects the creation of processes associated with the ISL Online Remote Management and Monitoring (RMM) tool. Attackers may leverage ISL Online for remote access and management of compromised systems, facilitating lateral movement or data exfiltration. The relevant MITRE ATT&CK tactic is Command and Control (TA0011) and the technique is Application Layer Protocol (T1219). The primary telemetry sources for this detection are Windows process creation logs, specifically those related to process invocation.

  If malicious, the ISL Online activity could yield unauthorized access to sensitive systems, enabling attackers to manipulate or steal data indefinitely. It is crucial to note that this detection does NOT confirm malicious intent; the presence of ISL Online processes could also indicate legitimate administrative use.

  ### Investigation Steps

  - **Verify process origin:** Cross-reference the detected processes (ISLLight.exe, ISLLightClient.exe) with the file paths recorded in Security Event ID 4688. Check if they are located in expected directories (e.g., C:\Program Files\ISL Online). Be wary of timestamps that coincide with atypical access times, which may indicate malicious usage.

  - **Assess parent-child relationships:** Analyze the process tree starting from the parent processes (ISLLight.exe, ISLLightClient.exe) via Sysmon Event ID 1. Identify other child processes initiated and describe their behavior. Legitimate usage typically involves known administrative tasks, with associated child processes limited in scope and execution duration.

  - **Examine network connections:** Monitor outbound network connections associated with the process using Windows Firewall logs (Event ID 5156) or Sysmon Event ID 3 connections. Investigate any connections to suspicious domains or IP addresses, especially those not seen in previous legitimate activity.

  - **Check user activity:** Review the user account associated with the process creation in Security Event ID 4624. Identify if the account is standard or if it has been recently created or privileged, which may indicate an attacker trying to use compromised credentials.

  - **Look for established communication protocols:** Investigate if ISL Online communicates via unusual ports (other than typical RMM defaults) using relevant network logs. Abnormal port usage can signal an attempt to obfuscate malicious activity.

  ### Prioritization

  This alert is of medium severity as it involves potential unauthorized remote access to systems that could lead to significant data compromise or infrastructure manipulation. The likelihood of malicious abuse is moderate, considering ISL Online is a legitimate tool, but its use in unexpected contexts raises concerns. The potential for weaponization is evident, especially in threat actor targeting of enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited if the RMM tool is incorrectly configured or if log collection from the endpoint systems is insufficient. Evasion techniques may include renaming ISL Online executables or modifying their signatures. Legitimate administrative activities may inadvertently trigger the alert due to approved use of RMM tools. A related detection to consider is monitoring for High-risk command executions (e.g., PowerShell scripts utilizing RMM tools) to strengthen coverage and correlate activities.

