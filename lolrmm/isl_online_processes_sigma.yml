note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ISL Online Remote Management and Monitoring (RMM) tool. ISL Online can be leveraged by attackers for remote access, leading to unauthorized control over compromised systems. The relevant MITRE ATT&CK tactics include Command and Control (T1071.001) and Application Layer Protocol (T1219). The primary telemetry sources for this detection are Windows process creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which capture process creation events, including parent and child process hierarchies.

  If malicious, the impact could range from data theft to full system compromise, allowing adversaries to manipulate systems remotely undetected. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use of ISL Online for remote support purposes can trigger the alert.

  ### Investigation Steps

  - **Check process creation events:** Look for Windows Event ID 4688 or Sysmon Event ID 1 where the `Image` field ends with `ISLLight.exe`, `ISLLightClient.exe`, `isllightservice.exe`, or `islalwaysonmonitor.exe`. Legitimate instances may include known operational use of ISL Online by IT staff.

  - **Review parent-child process relationships:** Identify the `ParentImage` field in the process creation logs. If the parent processes (especially critical system processes or tools like `explorer.exe` or `powershell.exe`) are not expected for the user, it may indicate malicious activity.

  - **Examine user context:** Determine if the user account executing the process is typical for ISL Online usage. Unusual accounts (like service accounts or generic accounts) running the process can be a strong indicator of potential compromise.

  - **Analyze network activity:** Correlate the identified process with network logs indicating outbound connections to ISL Online servers. High instances of connectivity to the ISL Online service (documented IP ranges) could suggest misuse.

  - **Verify system stability:** Check for any other signs indicating potential compromise, such as unexpected system changes or high CPU usage associated with ISL processes, using Windows Performance Monitoring logs.

  ### Prioritization

  This alert carries medium severity due to its potential impact; ISL Online, if misused, can grant attackers significant access and control over sensitive systems. The likelihood of malicious abuse is moderate, as adversaries often weaponize legitimate tools for illicit purposes. Given that remote access tools are frequently targeted, this behavior warrants timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist if proper logging is not configured, particularly if process creation logging is disabled. Legitimate usage by authorized personnel may frequently trigger the alert, requiring contextual investigation. Companion detections, such as monitoring for unusual outbound network traffic or process injections related to ISL Online processes, can bolster security coverage.

