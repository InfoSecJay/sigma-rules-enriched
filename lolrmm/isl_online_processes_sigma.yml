note: |
  ### Technical Context

  This rule detects the execution of processes associated with the ISL Online remote management tool on Windows systems. The likely attacker objective is to gain unauthorized access, maintain persistence, or conduct remote administration of compromised systems. This behavior aligns with the MITRE ATT&CK technique for Remote Management Software (T1219), which can be exploited by adversaries for lateral movement or exploitation of sensitive data.

  The primary telemetry sources are Windows process creation logs, specifically Event ID 4688 (Process Creation) and/or Sysmon Event ID 1 (Process Creation Events), which provide details on running processes and their parent-child relationships. If malicious, this activity could enable an intruder to control the system remotely, facilitating data exfiltration or further exploitation. This detection does NOT confirm malicious activity on its own, as the use of ISL Online can be legitimate in various administrative contexts.

  ### Investigation Steps

  - **Inspect recent process creations:** Review Windows Event ID 4688 logs for any instances of processes like `ISLLight.exe`, `islalwaysonmonitor.exe`, or related executables. Focus on abnormal execution patterns or presence on servers where remote access is uncommon.

  - **Analyze parent-child relationships:** Examine the parent process of detected ISL Online binaries using the same Event ID, specifically looking at the `ParentImage` field to confirm if they were spawned from recognized administrative tools or legitimate remote management software.

  - **Identify legitimate usage patterns:** Document the environments or users who typically utilize ISL Online RMM tools within your organization. Compare against identified process activities to distinguish between benign and suspicious usage.

  - **Check for abnormal execution locations:** Verify the file path of the detected executables; legitimate installations are typically found in `C:\Program Files\ISL Online\`. Unauthorized installations in unusual directories (e.g., user profiles or temp folders) can indicate potential compromise.

  - **Examine network activity associated with detected processes:** Review network logs for communications initiated by the identified processes. Pay attention to outbound connections to obscure IPs or ports typically associated with remote administration, as well as any DNS requests that reference ISL services.

  - **Correlate with user access rights:** Evaluate the user accounts associated with the detected processes and examine their permissions. Unusual account access, especially privileged or administrative accounts utilizing ISL Online unexpectedly, could indicate a security issue.

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized remote access to systems, which can be exploited for data breaches or system manipulation. The likelihood of malicious abuse is notable, as tools like ISL Online are commonly weaponized for unauthorized remote control; however, legitimate usage must be considered before marking as a confirmed threat.

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques, such as renaming executables or using different remote management tools that don't match the current detection criteria. Reliable detection requires comprehensive logging of process creation events, and any configuration changes that limit this can lead to missed alerts. Furthermore, legitimate administrative access or remote support activities may trigger this alert, so context is critical. A related detection that strengthens coverage would be identification of outbound connections tied to known remote management tool IPs or domains, enhancing threat detection associated with unexpected remote access attempts.

