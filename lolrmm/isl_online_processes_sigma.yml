note: |
  ### Technical Context

  This rule detects the execution of processes associated with the ISL Online Remote Management Tool (RMM), specifically leveraging process creation events of ISLLight.exe, ISLLightClient.exe, isllightservice.exe, and islalwaysonmonitor.exe. An attacker may utilize ISL Online for remote access to a compromised host in order to maintain persistence, exfiltrate data, or conduct further actions undetected. The relevant MITRE ATT&CK technique is **Remote Services - T1219**.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log details about process creation, including the image name and parent image. If detected as malicious, an unauthorized use of ISL Online could lead to significant security impacts such as unauthorized data access or compromise of sensitive systems. However, this detection does NOT confirm malicious activity on its own, as ISL Online can also be used legitimately for remote access by approved personnel.

  ### Investigation Steps

  - **Review Recent Process Creation Logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for processes named "ISLLight.exe", "ISLLightClient.exe", "isllightservice.exe", or "islalwaysonmonitor.exe" on the affected system. Look for execution context and user accounts executing these processes to ascertain legitimacy.

  - **Examine Parent Process Details:** Identify the parent process for the detected ISL Online executables by reviewing the "ParentImage" field in the process creation logs. A legitimate parent could be a valid remote support session, while unusual parent processes might indicate malicious activity.

  - **Identify User and Asset Context:** Validate whether the user running the process is an authorized personnel for the affected system, particularly if the host is critical (e.g., servers handling sensitive information). Check if the recent access aligns with business hours and documented support activities.

  - **Search for Anomalous Network Connections:** Review network logs (e.g., Windows Firewall logs or Sysmon Network events) for unusual outbound connections from the affected host to public IP addresses associated with ISL Online. Malicious instances would typically show outbound traffic to unusual or unrecognized endpoints.

  - **Cross-reference with Endpoint Security Solutions:** Utilize any installed endpoint detection and response solutions to identify previous incidents involving ISL Online on the affected system. This could reveal patterns of previous authorized or malicious uses.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on security if the ISL Online tool is being abused for unauthorized access. The likelihood of malicious exploitation is moderate, as ISL Online is commonly used in legitimate IT operations but can be weaponized by threat actors for remote access after a compromise.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is insufficient; ensuring Sysmon is configured properly and logging for process creation events is essential. Legitimate activities, such as authorized remote support tasks by IT personnel, may trigger the alert. Additionally, there might be other remote access tools (e.g., TeamViewer, AnyDesk) that could have similar behavioral patterns useful for companion detection to enhance security coverage.

