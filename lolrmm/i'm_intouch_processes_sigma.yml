note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the "I'm InTouch" Remote Monitoring and Management (RMM) tool, which may indicate unauthorized remote access activities. Attackers may leverage this tool to gain control over systems, facilitating lateral movement, data exfiltration, or reconnaissance within the network.

  The relevant MITRE ATT&CK tactic here is **Command and Control** (TA0011) and the technique is **Application Layer Protocol** (T1219). The primary telemetry sources include Windows process creation logs, specifically Event ID 4688 or Sysmon Event ID 1, which provide insights into process execution alongside parent-child process relationships. Malicious use of "I'm InTouch" can significantly impact system integrity and confidentiality, especially if utilized for unauthorized remote access.

  This detection does NOT prove malicious activity on its own and must be corroborated with additional context, such as user activity and network communications.

  ### Investigation Steps

  - **Check recent process creation events:** Assess Event ID 4688 or Sysmon Event ID 1 for any executions involving `iit.exe`, `intouch.exe`, or `I''m InTouch Go Installer.exe`. Validate the process hierarchy to identify if these processes were spawned by known benign applications.

  - **Review user account activity:** Investigate the user account related to the process execution. Compare against expected usage patterns and roles. Unauthorized accounts or unusual access times may indicate malicious behavior.

  - **Analyze network traffic:** Use network monitoring tools to check for unusual outbound connections from the affected host associated with the RMM tool's processes. Look for known command and control IP addresses or anomalies in traffic patterns.

  - **Investigate legitimate uses:** Identify if "I'm InTouch" is a sanctioned tool within the organization. Review deployment records and expected operational scopes to differentiate between standard operations and suspicious activity.

  - **Correlate with session logs:** Check Remote Desktop Protocol (RDP) or other remote session logs to determine if remote access was initiated according to business needs. Ensure that remote sessions correlate with the execution of the identified processes.

  ### Prioritization

  The alert severity is medium based on the potential for significant network impact if used maliciously. Given that "I'm InTouch" is often weaponized in attacks for remote access, there is a reasonable likelihood of abuse, particularly in environments where the tool is not strictly controlled or monitored.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where the usage of "I'm InTouch" is legitimate, resulting in false positives. There could also be potential obfuscation tactics to hide the execution of this tool. Required log sources include Windows process creation and relevant security event logs for robust monitoring. Companion detections, such as monitoring for unusual outbound network traffic, can enhance overall visibility on potential misuse of this tool.

