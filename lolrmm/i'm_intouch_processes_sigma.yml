note: |
  ### Technical Context

  This detection identifies process creation activity related to the I'm InTouch Remote Monitoring and Management (RMM) tool, specifically targeting processes that exhibit a parent-child relationship with known I'm InTouch executables. The likely objective of an attacker using this tool is unauthorized remote access for system manipulation or surveillance. This detection aligns with the MITRE ATT&CK tactic "Execution" (T1203) and technique "User Execution" (T1219).

  The primary telemetry source for this rule is Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1, which capture detailed process lifecycle events. If malicious, such activity could facilitate extensive system control or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of the I'm InTouch RMM tool is possible.

  ### Investigation Steps

  - **Review process creation logs:**
    Analyze Windows Security Event ID 4688 or Sysmon Event ID 1 for the creation of any process named "iit.exe", "intouch.exe", or "I'm InTouch Go Installer.exe".

  - **Evaluate parent-child process relationships:**
    Look for parent processes with names commonly associated with remote access tools, specifically focusing on the parent process being one of the identified I'm InTouch executables.

  - **Identify high-confidence malicious activity:**
    Check for creation timestamps that match known incidents of unauthorized access in the organization or anomalous login activity correlating with the process execution.

  - **Determine legitimate usage scenarios:**
    Validate that I'm InTouch has been installed and utilized in the environment with documented business needs—refer to installation history or user engagement records.

  - **Inspect for associated network activity:**
    Cross-check logs for outbound connections on ports typically exploited by RMM tools (e.g., TCP 443) to confirm potential command-and-control communication or unauthorized remote sessions.

  ### Prioritization

  This alert should be prioritized as medium severity. The potential impact is significant if I'm InTouch processes are being abused, particularly on critical assets or servers. Additionally, while this behavior could be benign in legitimate contexts, it is a known method for attackers to establish remote access, making it plausible for misuse.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate use cases for I'm InTouch, leading to false positives. Requires consistent logging from Windows Event Viewer and Sysmon to ensure full visibility into process creation events. Common legitimate activities may include remote support sessions conducted by IT personnel using I'm InTouch, which could inadvertently trigger this alert. A related detection that strengthens coverage is monitoring for unexpected remote access tool installations or unusual network service activity.

