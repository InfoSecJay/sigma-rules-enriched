note: |
  ### Technical Context
  This detection rule identifies potential unauthorized use of the I'm InTouch Remote Management Tool (RMM), which can be misused by attackers for remote access and control over compromised systems. The primary objective of such threats is to maintain access to the environment, exfiltrate sensitive data, or deploy additional malicious payloads. Attackers may leverage tools like I'm InTouch to evade detection while performing lateral movement or data exfiltration.

  Relevant MITRE ATT&CK techniques include:
  - **T1190**: Exploit Public-Facing Application
  - **T1219**: Remote Access Software

  The primary data source for this alert is Windows process creation logs, where the monitoring of new and existing processes can reveal suspicious activity related to remote management tools. By analyzing these logs, security teams can discern patterns indicative of unauthorized usage of legitimate remote management software.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect recent entries in process creation logs specifically looking for instances where the I’m InTouch executables (`iit.exe`, `intouch.exe`, `I'm InTouch Go Installer.exe`) have been launched. Note the user context and parent processes to establish legitimacy.

  - **Assess Network Connections**: Look for anomalous outbound or inbound network connections originating from detected processes. Correlate these with known indicators of compromise and typical usage patterns for remote management tools.

  - **Audit User Activity**: Investigate user accounts associated with potentially unauthorized executions of the detected processes. Determine if the users have legitimate reasons or prior approvals for using remote management tools as part of their operational responsibilities.

  - **Check for Unusual Scheduling**: Examine task scheduler entries for any tasks related to I’m InTouch, especially those set to run without user interaction or during unusual hours, which may indicate malicious intent.

  ### Prioritization
  This alert has a medium severity rating as while the presence of I'm InTouch in the environment can be legitimate, its misuse poses a significant risk to system integrity and confidentiality. The likelihood of misuse in enterprise settings makes this detection critical for maintaining security posture.

  ### Blind Spots and Assumptions
  One gap in detection coverage could be the legitimate use of I'm InTouch by trusted users, which may lead to false positives if not adequately contextualized. The detection logic assumes that any execution of the specified binaries without business justification may indicate malicious activity. For the alert to function optimally, process creation logging must be enabled and properly configured on all endpoints within the monitored environment.

