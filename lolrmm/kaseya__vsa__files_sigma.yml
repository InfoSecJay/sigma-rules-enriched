detection:
  selection:
    TargetFilename|endswith:
    - '*\Kaseya\Log\KaseyaLiveConnect\*'
    - ~/Library/Logs/com.kaseya/KaseyaLiveConnect/*
    - C:\ProgramData\Kaseya\Log\Endpoint\*
    - C:\Program Files*\Kaseya\*\agentmon.log
    - /var/log/system.log
    - ~/opt/kaseya/*/logs*
    - C:\Users\*\AppData\Local\Temp\KASetup.log
    - C:\Windows\Temp\KASetup.log
    - C:\ProgramData\Kaseya\Log\KaseyaEdgeServices\*
    - C:\Kaseya\api\v1.0\logs\
    - C:\Kaseya\api\v1.5\endpoint\logs
    - C:\Kaseya\api\v1.5\endpoints\logs
    - C:\Windows\System32\config\systemprofile\AppData\Local\Kaseya\Log\MakeSelfSignedCert.exe\
    - C:\Kaseya\WebPages\install\makecert.txt
    - C:\ProgramData\Kaseya\Log\Endpoint\Instance_*\KaseyaEndpoint*
    - C:\ProgramData\Kaseya\Log\Endpoint\Instance_*\Session_*
  condition: selection
falsepositives:
- Legitimate use of Kaseya (VSA)
level: medium
note: |
  ### Technical Context
  This detection rule targets suspicious file activity associated with the Kaseya (VSA) Remote Monitoring and Management (RMM) tool. Kaseya VSA is used for managing endpoints in an enterprise environment, but it can also be exploited by attackers to gain unauthorized access to systems and sensitive information, especially in the wake of high-profile incidents involving ransomware attacks targeting Kaseya customers. The detection focuses on file modifications, creation, or access within specific directories associated with Kaseya’s logging and operational files.

  The primary threat scenario involves attackers utilizing Kaseya VSA’s functionalities to deploy malicious payloads or establish persistence on compromised systems, potentially leading to data theft or further lateral movement within the network. By tracking file activity, defenders can identify possible misuse of Kaseya in both legitimate and malicious contexts. The relevant MITRE ATT&CK tactics and techniques include:
  - Execution (TA0002), specifically through user execution of malicious files (T1219).
  - Initial Access (TA0001) if Kaseya is exploited to gain initial foothold on the network.

  Key telemetry sources that provide evidence of this activity include file event logs from Windows systems, as well as logs from the Kaseya application itself, which may include connections and execution events relevant to suspicious activity.

  ### Investigation Steps
  - **Review File Access Logs**: Check file event logs for entries related to Kaseya directories, especially those identified in the detection logic. Pay special attention to unusual timestamps or access patterns outside of standard operational hours.

  - **Analyze Process Creation Events**: Investigate any process creations linked to Kaseya executables or scripts. Look for behaviors such as unexpected parent-child relationships or the execution of log-related files.

  - **Examine Network Activity**: Inspect network traffic for unauthorized connections initiated by Kaseya components or to known malicious command and control (C2) servers. This includes outbound connections originating from Kaseya processes.

  - **Cross-Reference with Threat Intelligence**: Use threat intelligence to determine if any file hashes or behaviors observed correlate with known Kaseya exploitation methods or payloads linked to recent cyber incidents.

  ### Prioritization
  Given the potential for significant risk associated with the misuse of Kaseya VSA tools for lateral movement or data exposure, alerts generated by this rule should be treated with medium priority, especially in environments where Kaseya is implemented and monitored.

  ### Blind Spots and Assumptions
  This rule assumes that the Kaseya tool is properly configured and generating logs in the specified directories, which may not always be the case. Additionally, any malicious activity could be masked by legitimate operations, leading to false positives related to standard Kaseya functionality. Organizations must ensure that comprehensive logging is enabled for the Kaseya application and that file event logging on endpoints is configured correctly to capture these indicators effectively.

