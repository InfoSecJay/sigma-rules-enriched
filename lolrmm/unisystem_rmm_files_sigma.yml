  ### Technical Context

  This Sigma rule detects the creation or modification of files related to the UniSystem Remote Monitoring and Management (RMM) tool, specifically files named 'UniRMM.exe' or 'UniRMM.msi'. Attackers may use such tools for remote access and control over compromised systems, aiming to exfiltrate data, deploy additional malware, or maintain persistence. The relevant MITRE ATT&CK tactic for this detection is **Command and Control (T1071)**, with the specific technique being **Application Layer Protocol (T1219)**.

  Primary telemetry sources include Windows File Event logs, which capture file-related activities on endpoints. The potential security impact is significant, as an adversary using RMM tools can exploit systems to gain more control, leading to data breaches or system compromise. This detection does NOT confirm that the observed file activity is malicious on its own, as legitimate use of the UniSystem RMM tool can occur in administrative contexts.

  ### Investigation Steps

  - **Check event logs for file activity:** Review Windows Security log (Event ID 4663) for access to 'UniRMM.exe' or 'UniRMM.msi', capturing actions like creation or modification, to identify timestamps and user accounts involved.

  - **Validate expected behavior:** For legitimate environments, identify known usage patterns of UniSystem RMM, such as scheduled maintenance scripts or IT support operations, and correlate these with user accounts to establish context.

  - **Investigate the file's properties:** Examine the file creation details, such as the original creation path and file hashes using PowerShell (Get-FileHash), to ensure they match legitimate versions of the software, ensuring no alterations have been made.

  - **Identify anomalies in user behavior:** Analyze user accounts associated with the file activity to determine any known behavior deviations, such as an administrator account performing actions outside of typical operational hours.

  - **Look for high-confidence indicators of compromise:** Search for additional files or artifacts associated with malicious RMM activity, such as .exe or .dll files in uncommon directories, which may suggest malicious use of the tool.

  ### Prioritization

  This alert carries medium severity within an enterprise context, as the presence of RMM tools can enable significant risks if exploited by an adversary. The likelihood of malicious abuse exists, particularly if encountered unexpectedly on critical systems or in unusual contexts. Malicious use of remote management tools is a common vector in cyberattacks.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate use cases that generate similar file activity. Failure to collect all relevant Windows File Event logs due to configuration gaps can hinder detection reliability. Additionally, scripted or automated system management operations may trigger this alert. A companion detection to strengthen coverage could include monitoring for abnormal network connections originating from the same devices, helping identify potential command-and-control communication.

