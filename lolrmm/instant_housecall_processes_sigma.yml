note: |
  ### Technical Context

  This Sigma rule detects potential process activity associated with the Instant Housecall Remote Management Tool (RMM). The likely attacker objective is to gain unauthorized remote access to a system, enabling actions such as data exfiltration, malware deployment, or lateral movement within the network. This behavior corresponds to the MITRE ATT&CK technique "Remote Access Tools" (T1219). Primary telemetry sources are Windows process creation logs, specifically looking for Event ID 4688 or Sysmon Event ID 1, which document process execution events. If malicious, the security impact includes potential unauthorized access and control over the affected systems. It is important to note that this detection does NOT confirm malicious intent on its own, as the Instant Housecall tool can be used legitimately.

  ### Investigation Steps

  - **Identify affected processes:** Review process creation logs (Event ID 4688) for instances of 'hsloader.exe', 'InstantHousecall.exe', or 'ihcserver.exe'. Benign indicators include known legitimate installations on company assets or usage during authorized remote support sessions.

  - **Validate parent process relationships:** Check the parent process of the detected processes using Sysmon Event ID 1. A legitimate parent process typically would be a known administrative tool or script, whereas a suspicious parent could indicate unauthorized execution.

  - **Cross-reference with asset inventory:** Verify if the asset where the execution occurred is authorized for using Instant Housecall. Legitimate assets should have documented permissions and known operational roles tied to remote support.

  - **Review user activity logs:** Consult authentication logs to assess whether the user context launching the Instant Housecall tool is appropriate. Look for unusual times of access or accounts that should not typically utilize remote access tools.

  - **Assess network activity:** Monitor network connections associated with the detected processes for unusual outbound connections. Known benign connections should align with expected remote support operations, while any anomalous or external connections raise red flags.

  ### Prioritization

  This alert carries medium severity due to the potential for unauthorized access and control if exploited by an attacker. Given that legitimate uses of Remote Management tools are common in enterprise environments, there is a moderate likelihood of malicious abuse, especially if observed with suspicious behavior or on critical systems.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as renaming processes or using alternate remote access tools that do not match the specified names. Reliable coverage requires ensuring that Windows process creation logs are enabled and properly configured. Legitimate activities, such as authorized IT support using Instant Housecall, can trigger this alert. A related detection to consider is monitoring for anomalous outbound connections that could suggest unauthorized access attempts.

