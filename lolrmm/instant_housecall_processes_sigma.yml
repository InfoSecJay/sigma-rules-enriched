note: |
  ### Technical Context
  This rule detects potential execution activities associated with the Instant Housecall remote monitoring and management (RMM) tool. By monitoring process creation events, the detection identifies the launching of processes that may indicate unauthorized use of the tool within the enterprise environment. Attackers often leverage remote management tools like Instant Housecall for unauthorized access to systems, potentially leading to data exfiltration or lateral movement. Understanding whether the tool is being used legitimately or maliciously is critical for maintaining the security posture of an organization.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002), which pertains to running malicious code, and **Remote System Control** (T1219), used by attackers to control systems remotely. The focus here is on the potential misuse of legitimate software to conduct malicious activities, which could compromise system integrity and lead to significant operational disruptions.

  Primary data sources for this detection include Windows process creation logs, which provide insight into what processes are being started, along with their parent-child relationships. Analyzing these logs can help determine whether the usage of Instant Housecall aligns with expected behaviors in the enterprise.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation events to identify instances where Instant Housecall executables (hsloader.exe, ihcserver.exe) have been launched. Pay special attention to the parent processes associated with these launches.

  - **Correlate with User Activities**: Check user activities and permissions to ensure that the individuals initiating these processes are authorized to use Instant Housecall. Cross-reference with typical operational patterns or scheduled tasks.

  - **Analyze Network Traffic**: Inspect network connections associated with the detected processes. Look for unusual external communications or established outbound connections that could indicate unauthorized remote access.

  - **Evaluate Alerts from Endpoint Protection**: If using EDR solutions, check for any alerts generated around the same time as the process executions. These could provide additional insights into suspicious behavior linked to the Instant Housecall RMM tool.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of unauthorized remote access on sensitive systems and data. While legitimate usage may occur, the risk associated with misconfigured or exploited RMM tools necessitates prompt investigation to prevent potential security breaches.

  ### Blind Spots and Assumptions
  A significant blind spot in the detection logic is the reliance on the assumption that Instant Housecall is malicious in this context, which may not always be the case, as legitimate uses of RMM software do exist. This detection might miss instances of coordinated usage or variations in naming conventions for executable files. The rule requires comprehensive process creation logs from Windows to function optimally, meaning that misconfigured logging settings could hinder detection accuracy.

