note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Instant Housecall remote management tool, specifically looking for any instances of `hsloader.exe`, `ihcserver.exe`, or `instanthousecall.exe`. An attacker may utilize this tool to gain unauthorized remote access to systems, facilitating activities such as data exfiltration, malware deployment, or lateral movement. The relevant MITRE ATT&CK tactic is **Execution** (ID: T1219).

  Primary telemetry sources include Windows process creation logs, such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, the presence of this tool can indicate potential remote access by an attacker, compromising organizational systems. Importantly, this detection does NOT confirm that malicious activity is occurring; it merely highlights the presence of software that could be misused.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for events where `Image` is `hsloader.exe`, `ihcserver.exe`, or `instanthousecall.exe`. Consider the context of execution.

  - **Validate legitimate use cases:** Identify known instances of Instant Housecall usage within the organization under expected host roles. Look for the associated user account and confirm it aligns with documented remote support activities.

  - **Correlate with Remote Access logs:** Review network or VPN logs to determine if the associated processes are communicating with external IPs. Look for unusual outbound traffic that coincides with process execution time frames.

  - **Assess parent-child process relationships:** Examine the process tree to understand how `hsloader.exe` or similar processes were initiated—look for known benign parent processes versus suspicious ones.

  - **Investigate file creation behavior:** Check for temporary files or artifacts created by Instant Housecall during its execution. Validate paths and timestamps in Security Event ID 4663 for unauthorized file accesses.

  ### Prioritization

  This alert is of medium severity due to the possibility of an attacker leveraging Instant Housecall for unauthorized system access, particularly on high-value or sensitive assets. While remote support software can be legitimate, its misuse is a known exploitation vector, necessitating prompt analysis.

  ### Blind Spots and Assumptions

  Potential evasion techniques include renaming of legitimate binaries or the installation of the tool in non-standard locations to avoid detection. Reliable detection requires proper logging configurations for Windows process events in the environment. Legitimate IT support activities might trigger this alert, especially in organizations using Instant Housecall for authorized support. A related detection to consider includes monitoring for outbound connections from systems running remote access software to untrusted external IPs, enhancing overall detection coverage.

