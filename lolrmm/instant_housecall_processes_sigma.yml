note: |
  ### Technical Context

  This rule detects the execution of the Instant Housecall Remote Management Tool (RMM), which could signify unauthorized remote access to systems. Attackers may leverage such tools to manage, control, and exfiltrate data from compromised endpoints, often with the objective of maintaining persistence or conducting further malicious activities. The relevant MITRE ATT&CK techniques include "Command and Control" (T1071) and "Remote Access Software" (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688, and Sysmon Event ID 1. The security impact is significant since the use of an unauthorized RMM tool may indicate a breach of sensitive data or systems. This detection does NOT confirm malicious intent solely based on the presence of these processes, as legitimate use cases exist.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `hsloader.exe`, `InstantHousecall.exe`, or `ihcserver.exe`. Note if these processes were executed by known legitimate user accounts or system processes.

  - **Identify Parent Process**: Analyze the parent process linked to these executable files. Any instances originating from a suspicious or unknown parent, such as `cmd.exe` or `powershell.exe`, may indicate potential malicious use.

  - **Review User Activity**: Investigate the user associated with the process creation. If the user has no legitimate need for remote management tools, this may signal unauthorized access.

  - **Assess Network Connections**: Check outbound network activity through firewall logs or security appliances for any connections originating from these processes. Look for connections to known malicious IPs or anomalous geographic locations, which would indicate potential command and control communication.

  - **Correlate with Known Safe Usage**: Validate whether Immediate Housecall is listed as an approved software within the organization’s asset management system. Legitimate usage should align with documented management policies.

  ### Prioritization

  This alert is of medium severity due to the potential for unauthorized access to critical systems. Although legitimate use exists within some organizations, the possibility of abuse by an adversary makes timely investigation important, especially given the increasing prevalence of unsanctioned RMM tools in exploitation scenarios.

  ### Blind Spots and Assumptions

  This detection is limited by the occurrence of legitimate uses of Instant Housecall, which may generate false positives. It requires proper logging configurations for process creation, ideally supplemented with Sysmon configurations. Legitimate activity attributed to IT support personnel or remote assistance may trigger this alert. A companion detection, such as monitoring for command and control network traffic (e.g., via EDR solutions or network IDS logs), can strengthen overall coverage and context for investigating alerts of this nature.

