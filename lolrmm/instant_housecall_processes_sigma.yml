note: |
  ### Technical Context

  This Sigma rule detects processes related to the Instant Housecall Remote Management (RMM) tool, specifically when these processes are launched as child processes of known Instant Housecall parent executables, such as `hsloader.exe`, `InstantHousecall.exe`, and `ihcserver.exe`. The likely attacker objective is to establish command and control (C2) over compromised systems, utilize remote access capabilities for data exfiltration, or conduct further malicious actions, thereby maintaining persistence on the target. This activity falls under the MITRE ATT&CK tactic of "Command and Control" (T1071) and the technique "Application Layer Protocol" (T1219).

  The primary telemetry sources for this detection are Windows process creation logs (via Security Event ID 4688 and Sysmon Event ID 1). If malicious, these processes might indicate unauthorized remote access to sensitive systems. Importantly, this detection does *not* confirm malicious intent on its own, as Instant Housecall can also be legitimately used for remote support and may trigger alerts under normal operational conditions.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 and Sysmon Event ID 1 for instances where the image path contains `hsloader.exe`, `InstantHousecall.exe`, or `ihcserver.exe`. Note normal administrative behavior around these applications.

  - **Identify parent-child relationships**: Look for parent processes that correspond to legitimate remote administration tasks. Any unexpected parent processes, or unusual command-line arguments associated with these RMM processes, may indicate malicious usage.

  - **Validate user context**: Extract the user account associated with these processes from Security Event ID 4688. Determine if the user context aligns with known user roles authorized to use remote management tools.

  - **Analyze network activity**: Examine firewall logs or network traffic for outgoing connections related to Instant Housecall during the time of process creation. Connections to known command and control IPs or domain names would be high-confidence indicators of malicious activity.

  - **Review asset criticality**: Assess the role of the affected system (e.g., server, workstation) and its criticality in the environment. Processes on administrator workstations might be more concerning than those on less critical setups.

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized remote access on sensitive systems, particularly if administrative credentials are compromised. The likelihood of malicious abuse is moderate, given the known usage of RMM tools in both benign and malicious contexts. The process activity can be weaponized as part of a broader compromise and persistence strategy.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as renaming the executables or using alternative remote access tools. Required log sources must be configured to ensure full visibility, including Sysmon for process creation events. Legitimate use cases, such as authorized support sessions from IT personnel, could also trigger alerts. A related detection worth implementing is the monitoring of unusual outbound connections which could complement this rule's visibility on unauthorized remote sessions.

