note: |
  ### Technical Context

  This rule detects the execution of specific processes associated with the Instant Housecall remote management tool, which can be exploited by attackers for unauthorized remote access to systems. The likely attacker objective is to use this tool to gain remote control over a compromised device for further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1219). The primary telemetry source is Windows process creation events, specifically focusing on Event ID 4688. If malicious, the security impact includes unauthorized access and potential data breaches. Importantly, this detection does NOT confirm malicious intent on its own, as the use of Instant Housecall can be legitimate in certain contexts.

  ### Investigation Steps

  - **Review process creation events:** Inspect Windows Security Event ID 4688. Look for the creation of processes named `hsloader.exe`, `InstantHousecall.exe`, or `ihcserver.exe` to confirm activity.

  - **Verify parent process relationships:** Identify the parent process of the detected items. If the parent process is a known, legitimate process (e.g., a remote management service), it could indicate benign activity.

  - **Cross-check with known usage patterns:** Look for historical data of the `InstantHousecall` tool's usage in your environment, including expected scheduled tasks or legitimate admin activities that might trigger these processes.

  - **Assess network activity associated with these processes:** Examine network logs for any unusual outbound connections from the host running the tool. Check ports commonly used by Instant Housecall (e.g., TCP 5900 for VNC) for any connections to suspicious IP addresses.

  - **Identify high-confidence malicious indicators:** If `hsloader.exe` or its counterparts are executed outside of approved operational windows or by non-admin users, this could suggest malicious intent.

  ### Prioritization

  This alert has medium severity due to the potential impact of remote control over affected systems. The likelihood of malicious abuse is moderate since these tools can be weaponized for unauthorized access. While legitimate usage exists, awareness of the context is crucial for effective triage.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of Instant Housecall in controlled environments, which could lead to false positives. Ensure relevant process creation logging is enabled and cross-referenced with user activity logs for accurate verification. Additionally, related detections for abnormal outbound connections could enhance surveillance of potential misuse of this RMM tool.

