note: |
  ### Technical Context

  This Sigma rule detects the activity of the Instant Housecall Remote Monitoring and Management (RMM) tool via process creation events. Attackers may use RMM tools like Instant Housecall to establish remote access, enabling data exfiltration or system manipulation, thereby achieving their objectives. This behavior aligns with the MITRE ATT&CK tactic “Command and Control” (ID: T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture detailed information about process starts. If this detection confirms malicious activity, it could signify unauthorized access or control over affected systems. However, it is crucial to note that this detection does not confirm malicious intent on its own since the tool may also be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Identify process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 where the `Image` field ends with either `hsloader.exe`, `InstantHousecall.exe`, or `ihcserver.exe`. Validate the execution context to assess legitimacy.

  - **Check the parent process hierarchy:** Examine the `ParentImage` field in the same logs to determine if the processes were spawned by known legitimate administration tools or suspicious applications. Legitimate entries typically originate from IT management applications.

  - **Verify asset criticality:** If the affected host is a critical system (e.g., domain controllers, database servers), prioritize this investigation due to the potential impact of unauthorized remote access.

  - **Look for unusual user behavior:** Cross-reference the responsible user’s account activity against normal patterns in authentication logs (Windows Event ID 4624) to identify anomalies, such as a user executing RMM tools when they usually don’t.

  - **Capture network activity for further insights:** If the RMM processes are detected, examine network logs (firewall, proxy, or endpoint telemetry) for unusual outbound connections, especially to known malicious IPs or domains.

  - **Document findings on usage legitimacy:** If applicable, record instances where Instant Housecall was used for network administration in your organization, as this legitimate usage can clarify context for future alerts.

  ### Prioritization

  The alert is considered medium severity due to the potential impact on sensitive systems if exploited by attackers. While the tool is not widely weaponized for direct attacks, its legitimate use in the enterprise can easily be misappropriated for malicious means, making it essential to evaluate each instance closely.

  ### Blind Spots and Assumptions

  Detection may be limited if logs from critical systems are not properly configured or forwarded to central logging systems. Adversaries might employ evasion techniques such as renaming legitimate tools or utilizing sleeper agents. Additionally, legitimate administrative actions may trigger alerts, which could lead to false positives if not thoroughly verified. A companion detection to consider is the monitoring of network traffic for connections to known malicious command-and-control infrastructure to enhance overall coverage against potential misuse.

