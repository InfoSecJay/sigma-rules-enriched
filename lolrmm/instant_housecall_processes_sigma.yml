note: |
  ### Technical Context

  This rule detects potential process activity associated with the Instant Housecall Remote Management and Monitoring (RMM) tool, primarily when processes are spawned by specific parent executables. Attackers may exploit RMM tools to gain unauthorized remote access, control systems, or exfiltrate sensitive data. This behavior aligns with the MITRE ATT&CK tactic for Command and Control (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, focusing on fields such as ParentImage and Image. If malicious, the security impact may include unauthorized system access and data breaches. However, this detection alone does not confirm malicious intent as legitimate use of Instant Housecall for remote support may also trigger the alert.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 or Sysmon Event ID 1 for processes spawned by Instant Housecall executables (`hsloader.exe`, `InstantHousecall.exe`, `ihcserver.exe`). Note the ParentImage field to determine context.

  - **Analyze execution paths:** Examine the full execution path of the identified processes. Legitimate usage will typically show the executables launching from known system directories (e.g., C:\Program Files\ or C:\Windows\), whereas malicious instances may originate from temporary or user directories.

  - **Cross-reference user activity:** Identify the user account associated with the process creation. Validate whether it correlates with known IT support personnel or unusual accounts that may indicate unauthorized access.

  - **Investigate network connections:** Check related network activity for outbound connections initiated by Instant Housecall processes. Look for unusual external IPs or traffic on uncommon ports using Windows Firewall logs or other network monitoring solutions.

  - **Identify high-confidence malicious indicators:** Alert if unexpected attempts to use the tool are detected outside of regular business hours or if there are multiple instances of these processes running simultaneously, which deviates from typical usage patterns.

  ### Prioritization

  This alert has medium severity due to the potential for systems to be compromised by unauthorized remote access. The likelihood of malicious abuse is moderate, as RMM tools can be weaponized in instances of insider threats or external attacks. Regular monitoring and review of RMM tool activity is critical to maintaining security posture.

  ### Blind Spots and Assumptions

  Detection may be limited if legitimate use is prevalent; thus, it is essential to have clear baselines for expected activity. False positives could arise from non-malicious IT operations involving the Instant Housecall tool. Companion detections, such as monitoring for unusual network connections or user behavior analysis, can enhance overall alert validity and reduce blind spots.

