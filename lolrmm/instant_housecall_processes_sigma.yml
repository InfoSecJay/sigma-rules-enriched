note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Instant Housecall remote management tool (RMM). The likely attacker objective is to leverage this tool for unauthorized remote access or management of systems, enabling actions like exfiltration or further exploitation. This detection correlates with the MITRE ATT&CK technique "Remote System Control" (T1219). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If these processes are executed by unauthorized users, they can lead to significant security risks, including data breaches or unauthorized control of the targeted systems. Importantly, this detection alone does NOT confirm malicious activity, as Instant Housecall may be used legitimately by support personnel.

  ### Investigation Steps

  - **Verify process origins:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for exact command lines and process paths associated with 'hsloader.exe,' 'ihcserver.exe,' or 'instanthousecall.exe.' Legitimate commands typically originate from known IT support personnel accounts.

  - **Check parent processes:** Investigate the parent processes of the detected instances to confirm if they are spawned by legitimate administration tools or sessions. Look for parent process names that are expected, such as the administrative consoles or known service applications.

  - **Identify user accounts:** Review the user accounts that initiated these processes. Any instances executed under accounts not associated with IT support or management roles should be flagged for further scrutiny.

  - **Review execution frequency:** Assess if the detected processes are executing at unusual intervals or in high volumes that deviate from normal operational patterns for your organization. Unexpected execution patterns are indicative of possible exploitation.

  - **Examine network connections:** Look into outbound connections initiated by the identified processes using tools like Windows Firewall logs or network security tools. Connections to suspicious external IP addresses may indicate malicious use of the tool.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on compromised systems, particularly if the affected systems provide critical infrastructure or sensitive data. Given the common use of remote management tools for legitimate support purposes, however, the likelihood of malicious abuse needs careful context consideration, especially if not used commonly in the organization.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques, such as adversaries renaming legitimate executables or using alternative remote access tools. Reliable detection requires the configuration of Sysmon for detailed logging of process creation. Legitimate administrative activities could trigger this alert, such as scheduled IT support sessions. A related detection to consider is monitoring for unusual remote access patterns or unauthorized remote admin tool use to complement coverage.

