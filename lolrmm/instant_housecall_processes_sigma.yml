note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Instant Housecall Remote Management and Monitoring (RMM) tool, specifically targeting `hsloader.exe`, `InstantHousecall.exe`, and `ihcserver.exe`. The likely attacker objective is to establish remote access to the compromised system, enabling further exploitation or lateral movement within the network. This activity aligns with the MITRE ATT&CK technique for Remote System Control (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If successfully exploited, this could enable unauthorized remote control and data exfiltration. It's essential to note that this detection does NOT confirm malicious activity on its own, as there are legitimate uses for the Instant Housecall tool.

  ### Investigation Steps

  - **Analyze process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for process creation involving `hsloader.exe`, `InstantHousecall.exe`, or `ihcserver.exe`. Look for command line arguments and parent process indications for abnormal usage.

  - **Check parent process relationships:** Investigate parent processes of detected instances, focusing on known legitimate applications or common starting points. Legitimate usage often includes known administrative tasks or specific maintenance actions.

  - **Correlate with user behavior:** Look into user activity logs to validate whether the activity corresponds with typical administrative operations. Cross-reference the user’s role and acknowledge expected usage patterns to determine legitimacy.

  - **Examine network activity:** Analyze outbound network connections from affected systems to identify connections to unusual or unrecognized IP addresses. Malicious indicators may include connections to known bad IPs related to RMM tools or C2 servers.

  - **Monitor installation artifacts:** Validate presence or absence of installation artifacts in standard directories (like Program Files or AppData) that align with the legitimate installation of Instant Housecall. Use file system auditing logs to confirm file creations tied to this software.

  ### Prioritization

  This alert is of medium severity, as successful exploitation can lead to substantial impacts, including unauthorized access to sensitive systems and potential data leakage. The likelihood of malicious actors leveraging this tool is moderate, given its legitimate use but also its capability for abuse in compromised environments.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as renaming executable files or using similar file paths for benign applications. Reliable detection relies on comprehensive logging configurations for both Security Event ID 4688 and Sysmon logs. Legitimate activities may include sanctioned remote support sessions, where analysts must differentiate suspicious executions from authorized uses of the RMM tool. Companion detections for monitoring remote desktop protocols (RDP) or abnormal user behaviors can enhance overall alert context and validity.

