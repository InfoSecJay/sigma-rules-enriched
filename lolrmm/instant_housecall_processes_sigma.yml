note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Instant Housecall Remote Monitoring and Management (RMM) tool. The behavior observed often indicates unauthorized or suspicious remote access, which may be an indication of an attacker attempting to exploit existing access to conduct lateral movement or data exfiltration within the network. Relevant MITRE ATT&CK tactics include Execution (T1203) and Remote Services (T1219).

  Primary telemetry sources will be Windows process creation logs, specifically focusing on Event ID 4688 that details process initiation. If malicious, this activity can lead to severe security incidents such as unauthorized remote control over affected systems. Importantly, this detection does NOT confirm that malicious activity is occurring on its own, as legitimate use of Instant Housecall can also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs for suspicious activity:** Check Windows Security Event ID 4688 logs for any instances of `hsloader.exe`, `ihcserver.exe`, or `instanthousecall.exe` starting outside of expected parameters, particularly during non-business hours or from unusual user accounts.

  - **Verify parent-child process relationships:** Validate the parent process IDs for alerting instances. Instances spawned by known administrative tools should be investigated further while isolated executable files with unknown parents warrant a higher scrutiny.

  - **Cross-reference user accounts:** Analyze the user account associated with the detected processes. Benign instances usually involve valid support personnel or trusted administrators, while unknown or unexpected accounts may indicate potential misuse.

  - **Examine network activity logs:** Look for outbound connections related to suspicious IP addresses or unusual ports in firewall logs or network monitoring tools that correlate with the detected RMM usage. Legitimate usage typically corresponds to well-known IPs of support services.

  - **Assess system role and asset criticality:** Determine the significance of the affected system within the enterprise. High-risk or sensitive systems showing this process activity may necessitate immediate containment measures.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact if unauthorized remote access is confirmed. The likelihood of malicious exploitation is moderate, particularly in environments where remote management tools are not consistently monitored. However, legitimate usage does occur, necessitating careful evaluation.

  ### Blind Spots and Assumptions

  The primary detection limitation arises from the potential for evasion techniques such as process renaming or the use of whitelisted applications by attackers. Reliable detection requires proper configuration of logging for Windows process creation events. Legitimate remote support activities can trigger this alert, necessitating contextual analysis of user behavior. A related detection to consider is monitoring for anomalous network connections stemming from remote access tools, which can corroborate findings from this alert.

