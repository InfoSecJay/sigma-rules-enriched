note: |
  ### Technical Context

  This Sigma rule detects potentially malicious activity related to the execution of the Instant Housecall remote management tool (RMM). The behavior indicates an attacker may be attempting to establish remote access to a system, which could facilitate further exploitation, lateral movement, or data exfiltration. The relevant MITRE ATT&CK tactic is *Execution* (T1203) and the technique is *Remote Access Software* (T1219). The primary telemetry sources required for detection include Windows process creation logs, particularly Security Event ID 4688 or Sysmon Event ID 1.

  If this detection is confirmed malicious, the impact could include unauthorized access to sensitive data or systems, significantly compromising organizational security. It is important to note that this detection alone does not confirm that any malicious actions have occurred; legitimate use of the Instant Housecall tool is common in remote support scenarios.

  ### Investigation Steps

  - **Review the process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for entries related to the execution of *hsloader.exe*, *InstantHousecall.exe*, or *ihcserver.exe*. Look for unusual parent-child process relationships that deviate from normal operations.

  - **Identify unusual parent processes:** Examine the *ParentImage* field in the process creation logs. Legitimate use often shows processes initiated from known management consoles or user interactions. Suspicious behavior may appear when unexpected processes (e.g., command shells) spawn Instant Housecall processes.

  - **Analyze user context and account activity:** Check the *Account Name* field in the process creation logs. Legitimate entries typically come from authorized support personnel accounts. If the user account appears suspicious or is not authorized for remote access, it merits further investigation.

  - **Investigate network connections:** Look for outbound connections made by Instant Housecall processes. Analyze the destination IP addresses, ports, and protocols in network logs (e.g., firewall logs, NetFlow). Legitimate connections should be to recognized support endpoints; any connections to unknown or unexpected IP addresses may be indicative of malicious activity.

  - **Cross-reference with prior activity:** Check for any previous alerts or events related to remote access software in the same time frame. Look in related logs, such as Windows Event ID 4648 for logon events or relevant API calls that signal earlier reconnaissance or exploitation efforts.

  ### Prioritization

  The alert is prioritized as medium severity. Although the system may be an endpoint, the likelihood of malicious abuse is significant given the nature of remote access tools being a common target for attackers aiming to exploit vulnerabilities. Instant Housecall is a legitimate tool, but its misuse is historically weaponized in diverse attack vectors.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of alternate process names or modified tools that circumvent standard detection methods. Reliable detection requires comprehensive logging of process creation events, which should be enabled consistently across endpoints. Legitimate support activities from authorized personnel may trigger this alert, necessitating context for accurate assessment. Companion detections to strengthen coverage include monitoring for anomalous logons (e.g., Event ID 4624) or elevated privilege operations within the same time frame as suspicious process executions.

