  ### Technical Context

  This Sigma rule detects process activity related to the Instant Housecall remote management tool, specifically targeting processes launched from the executable files `hsloader.exe`, `InstantHousecall.exe`, and `ihcserver.exe`. Attackers may use such remote management tools to maintain access to compromised systems or facilitate remote administration, which can lead to unauthorized data access or system manipulation. The relevant MITRE ATT&CK tactics include Command and Control (T1071.001) and Application Layer Protocol (T1219).

  The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, such activity could signal a significant security incident, as unauthorized use of RMM tools can lead to data exfiltration or lateral movement within a network. It is essential to note that this detection does not confirm malicious intent on its own, as legitimate use of the Instant Housecall tool also generates similar process activity.

  ### Investigation Steps

  - **Verify process lineage: ** Check the parent process of the detected instances using Security Event ID 4688 or Sysmon Event ID 1. Legitimate processes often originate from administrative tools, while malicious use may show unexpected parent processes or user accounts.

  - **Assess process properties: ** Review attributes such as the file path and hash of the identified executables (`hsloader.exe`, `InstantHousecall.exe`, `ihcserver.exe`). Legitimate processes should follow expected naming conventions and originate from trusted sources.

  - **Check user activity: ** Investigate the user accounts associated with the detected processes. Administrative users running RMM tools during expected maintenance windows is benign, while anomalous account usage can indicate unauthorized access.

  - **Investigate network connections: ** Review network activity associated with the process, including connections made to potentially malicious IP addresses or domains via Sysmon Event ID 3 with Destination Port 443 (HTTPS). Unusual external communication patterns could indicate malicious exploitation.

  - **Examine logs for related activity: ** Search for other related Event IDs, such as 4688 showing other remote access tools or accounts that interact with these processes, to gauge the broader scope of possible exploitation.

  ### Prioritization

  This alert is of medium severity due to its association with remote management tools that can be exploited in an enterprise. The impact on critical systems could be significant if used maliciously, particularly if the alert corresponds with lateral movement activity. While remote management applications can serve legitimate purposes, they have a reputation for being weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for obfuscation by attackers, as they may rename malicious versions of RMM tools or execute them from unconventional locations. Reliable detection requires robust logging configuration, particularly making sure Sysmon is deployed to capture detailed process information. Additionally, legitimate administrative tasks may trigger these alerts, such as support sessions during routine maintenance. A companion detection to consider includes monitoring for unauthorized administrative actions, like elevated command prompt usage (Event ID 4688).

