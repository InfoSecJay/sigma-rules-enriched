note: |
  ### Technical Context

  This rule detects the invocation of the Instant Housecall RMM tool by identifying processes that are created with parent processes related to Instant Housecall. The likely attacker objective is to gain remote access and control over an enterprise system, allowing for potential data exfiltration, lateral movement, or persistent malware installation. Relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) and the technique of **Application Layer Protocol** (T1219).

  The primary telemetry sources are Windows process creation logs, specifically Security Event IDs 4688 (process creation) and Sysmon Event ID 1. If malicious, the security impact includes unauthorized access and potential data breaches. It is important to note that this detection alone does NOT confirm malicious intent, as legitimate use of the Instant Housecall tool also exists.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1. Look for entries where `Image` ends with `hsloader.exe`, `InstantHousecall.exe`, or `ihcserver.exe`, focusing on the creation time and user context.

  - **Analyze parent-child process relationships:** Confirm that the detected process is indeed being invoked by a parent process ending with the same names. Legitimate calls often stem from named user accounts running remote support tasks.

  - **Validate user account context:** Examine the `SubjectUserName` field from the log. If the user is a non-administrative account without a legitimate reason to run RMM software, this could indicate potential malicious activity.

  - **Identify connectivity patterns:** Look for outbound network connections made by the identified processes in Netflow or firewall logs. Malicious indicators may include unusual IP addresses or frequencies that deviate from expected behaviors.

  - **Assess related activity on the affected asset:** Check for additional process creation events from `hsloader.exe`, `InstantHousecall.exe`, or `ihcserver.exe` within a short time frame to indicate potential multi-step attacks or persistence mechanisms.

  ### Prioritization

  This alert is medium-severity due to the potential impact on the affected system, given that the Instant Housecall tool enables remote control. The likelihood of abuse is moderate, as remote access tools are commonly weaponized in targeted attacks. However, the presence of legitimate use cases necessitates careful review to avoid false positives.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to modify or rename process images to evade detection. Logs must be properly configured to capture all relevant process creation events, as insufficient logging could impair detection capabilities. Additionally, legitimate technical support scenarios may trigger this alert, leading to false positives. Related detections, such as unauthorized remote desktop protocol (RDP) connections, would provide complementary coverage against remote access threats.

