note: |
  ### Technical Context

  This Sigma rule detects registry activity related to the RustDesk remote management tool. Attackers may utilize RustDesk to establish remote access and control over compromised systems, acting as a facilitator for exfiltration or lateral movement within the network. This behavior can be linked to the MITRE ATT&CK technique T1219 (Remote Access Software), which describes the use of legitimate software to achieve unauthorized access.

  The primary telemetry source is Windows registry events, specifically targeting paths indicating service installation or uninstallation of RustDesk. If detected maliciously, attackers can exploit this tool to further their objectives without raising immediate suspicion. However, it is important to note that this detection does NOT prove malicious activity on its own, as the legitimate use of RustDesk for remote assistance exists.

  ### Investigation Steps

  - **Review registry changes:** Examine Windows event logs for Security Event ID 4657 or Sysmon Event ID 13 that may indicate modifications to `HKLM\SYSTEM\CurrentControlSet\Services\RustDesk` and `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\RustDesk`. Look for recent timestamps and user accounts associated with the changes.

  - **Identify legitimate RustDesk usage:** Check if there are known assets within the organization that use RustDesk for authorized support or administration. Review onboarding documentation or asset management records to confirm expected usage.

  - **Correlate with process creation events:** Analyze Sysmon Event ID 1 (process creation) and look for instances where RustDesk or associated executables are initiated by unusual user accounts, especially those with no prior records of remote management activity.

  - **Monitor network connections:** Assess network logs for unusual outbound connections, particularly to IP addresses associated with remote access tools. Focus on any communication initiated by machines that had registry changes relating to RustDesk.

  - **Investigate privileged account activity:** Review audit logs for actions taken by administrative accounts following the detected registry changes. Any modifications made to user privileges or group memberships shortly after RustDesk’s installation may imply malicious exploitation.

  - **Check for persistence mechanisms:** Investigate for any persistence methods used with RustDesk, such as startup entries or scheduled tasks. Verify with event logs (like Application or System) to find entries relevant to new task creations or service registrations.

  ### Prioritization

  The alert severity is medium due to the risk associated with the potential unauthorized use of RustDesk, especially on critical systems. While RustDesk is a legitimate tool, its deployment can indicate malicious intent, particularly if its installation is unexpected. This behavior can be weaponized for remote control, posing a threat to data integrity and confidentiality.

  ### Blind Spots and Assumptions

  This detection may be limited by means of evasion techniques, such as attackers modifying registry keys to conceal their actions or using alternative harmless tools for remote access. Reliable detection relies on having comprehensive Windows registry auditing enabled. Additionally, legitimate remote support activities may trigger the alert without malicious intent. A companion detection worth referencing is monitoring for suspicious network traffic patterns related to known remote management software operations, which can provide context to the registry activity observed.

