note: |
  ### Technical Context

  This rule detects the file activity associated with NVDA (Non-Visual Desktop Access), an open-source remote management tool often used for legitimate remote access but can also be exploited by attackers for unauthorized system control. The likely attacker objective is to gain remote access for data exfiltration, lateral movement, or persistence. This behavior aligns with the MITRE ATT&CK tactic of Execution and the technique T1219: Remote Access Software.

  The primary telemetry sources include Windows file event logs capturing creation, modification, or access to specified NVDA-related files (e.g., `nvda.exe`, `nvda.log`, `nvda.ini`). If detected maliciously, this can lead to significant impacts such as unauthorized access to sensitive data or control over a system. Note that this detection alone does not confirm malicious intent; legitimate use of NVDA for support or accessibility purposes can trigger this alert.

  ### Investigation Steps

  - **Validate NVDA Execution Context**: Check for the presence of `nvda.exe` at the paths `C:\Program Files (x86)\NVDA\nvda.exe` or `C:\Program Files\NVDA\nvda.exe` (Event ID 4663). Legitimate usage typically occurs during known maintenance windows or IT support tasks.

  - **Review Acces Times of Configuration Files**: Query file access logs for `C:\Users\*\AppData\Roaming\nvda\nvda.log` and `nvd.ini` files (Event ID 4663). Benign activity would show access in line with user support activities, while abnormal patterns (e.g., unusual time or frequency) may indicate malicious use.

  - **Analyze User Context**: Check the user account associated with the NVDA execution (PowerShell command `Get-WinEvent -FilterHashtable @{LogName='Security'; ID=4688}`). Suspicious accounts or unfamiliar user activity may indicate malicious intent.

  - **Compare System Behavior**: Review other recent file events on affected systems. Unusual network activity or combined alerts (like a sudden increase in outbound connections) can corroborate malicious usage of NVDA.

  - **Identify File Persistence Tactics**: Investigate if any AppData modifications lead to persistence (e.g., any changes to auto-start locations). Look at Registry paths under `HKCU\Software\` and `HKLM\Software\` that may be related to NVDA setups.

  ### Prioritization

  The alert has medium severity due to the potential impact on sensitive systems by unauthorized remote access. While NVDA is often used legitimately, its known association with remote access exploits raises the likelihood of malicious abuse, making this activity noteworthy for threat assessment.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations not capturing all execution events or malware disguising itself as NVDA processes. Requirement for thorough monitoring of file creation and access logs is essential to ensure consistent detection. Legitimate user support activities may commonly trigger this alert. A related detection to consider is monitoring for remote access connection attempts (e.g., RDP logins) to strengthen overall assessment of potential breaches.

