note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the QQ IM remote assistance tool, which can be used for remote management and control of systems. The likely attacker objective is to maintain persistence or manipulate target systems using this remote assistance platform, often in the context of lateral movement or data exfiltration. This behavior falls under the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1071.001).

  Primary telemetry sources include Windows network connection logs, specifically those capturing outbound traffic to specific domains related to QQ IM. Malicious activity linked to this tool can lead to unauthorized access and control over systems, resulting in data breaches or compromise. It’s important to note that this detection alone does not confirm malicious activity; legitimate users may access these services.

  ### Investigation Steps

  - **Identify outbound connections to QQ domains:** Examine Windows Event ID 5156 (Windows Filtering Platform) and network logs for connections to known QQ-related domain names (e.g., `*.desktop.qq.com`, `*.upload_data.qq.com`).
  - **Analyze process execution context:** Cross-reference the identified IP addresses with Security Event ID 4688 to determine which processes initiated the connections and their parent processes. Legitimate applications typically do not connect to these QQ domains without clear intent.
  - **Check for recent account logins or changes:** Review Security Event ID 4624 (logon events) to verify if the user account accessing the QQ domains has a usage history that aligns with legitimate remote assistance activity.
  - **Inspect DNS query logs:** Correlate DNS queries for QQ domains using DNS Server logs (e.g., Event ID 4013). Look for patterns indicating unexpected high-frequency queries from an asset typically not using QQ services.
  - **Review asset criticality:** Assess the impacted system’s role in the environment. Connections from critical infrastructure or sensitive workstations to QQ domains should be investigated more urgently.
  - **Validate file creation or modifications:** Check for file creations or modifications related to the QQ IM tool. Look in directories commonly associated with application data, such as `%AppData%` or `%ProgramFiles%`, for any newly created folders or executables.

  ### Prioritization

  This alert should be treated as medium priority, given that connections to QQ IM could indicate remote access by an unauthorized actor. However, the likelihood of malicious abuse depends greatly on the context in which the software is being utilized—query for evidence of misuse or legitimate pre-approved deployments.

  ### Blind Spots and Assumptions

  Detection may miss cases where the attacker uses obfuscated domains or employs tunneling techniques to bypass standard rules. Ensure that DNS logging is enabled for complete visibility. Legitimate IT support staff may utilize QQ IM for remote assistance, which could trigger false positives. A related detection to consider is monitoring traffic to known malicious IP addresses in conjunction with outbound connections to QQ domains to enhance coverage.

