note: |
  ### Technical Context

  This rule detects outbound network connections to specific QQ IM-remote assistance domains such as `*.mdt.qq.com` and `*.desktop.qq.com`, indicating potential use of the application for remote access or control. The likely objective for an attacker leveraging this tool is to maintain persistent remote access for operations such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique of Remote Access Tools (T1219).

  The primary telemetry source is Windows network connection logs, capturing outbound connection attempts. A malicious use case could severely compromise network integrity by allowing unauthorized remote access to systems or sensitive data. Importantly, this detection alone does not confirm malicious intent or activity, as legitimate use of QQ IM-remote assistance is possible.

  ### Investigation Steps

  - **Examine recent network connections**: Check Windows Network Connection logs (i.e., Event ID 5156, Windows Filtering Platform) for connections to flagged domains. Identify the source IP and correlate with user activity for context.

  - **Identify initiated processes**: Look for parent processes associated with outbound connections to QQ domains. Use Sysmon Event ID 1 (process creation) to check for processes like `QQ.exe` that may be indicative of remote access tool usage.

  - **Review user behavior**: Investigate the user’s recent activity on the system (login history, file access) to determine if the use of QQ IM-remote assistance aligns with known business use cases. Legitimate connections may occur during remote support sessions.

  - **Check firewall logs**: Analyze Windows Firewall logs for additional connection attempts to QQ domains (Event ID 5152). Multiple, rapid connection attempts may indicate automated activity, warranting further investigation.

  - **Correlate with threat intelligence**: Review threat intelligence feeds for any known associations between QQ IM-remote assistance and malicious actors. Indicators or TTPs associated with previous incidents could further confirm suspicious activities.

  ### Prioritization

  This alert has a medium severity due to the potential security risks posed by unauthorized remote access tools and their common use in attacks for lateral movement and data exfiltration. If the affected system is critical or has access to sensitive data, the likelihood of malicious abuse increases significantly, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  The detection may miss obfuscated remote tool usage, as attackers can use alternative domains or modify hostnames. It relies on accurate logging configurations for Windows network connections and may be triggered by legitimate remote support activities. Companion detections might include monitoring for the execution of other remote access utilities or anomalous user logins that could enhance coverage and context.

