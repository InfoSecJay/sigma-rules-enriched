note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with QQ IM-remote assistance, a remote management tool often utilized for performing remote support and troubleshooting. Attackers may leverage this tool to gain unauthorized remote access to systems within a network, potentially enabling them to execute malicious commands and exfiltrate sensitive data. The objective behind such attacks can vary from espionage to data exfiltration or system manipulation.

  Related to the MITRE ATT&CK framework, this detection aligns with the **Execution** tactic, particularly technique **T1219: Remote Access Software**. Detecting the use of QQ IM-remote assistance is crucial as it may indicate an attacker’s attempt to control a compromised host. The primary data sources that can provide evidence of this kind of activity are **network connection logs**, focusing on outbound and inbound traffic to specific domains associated with QQ IM.

  ### Investigation Steps
  - **Review Network Logs:** Analyze network connection logs for any outbound traffic to domains such as `*.mdt.qq.com`, `*.desktop.qq.com`, and `upload_data.qq.com` to confirm unauthorized use of QQ IM-remote assistance.
  - **Assess User Activity:** Investigate the user accounts that initiated connections to QQ IM domains. Look for unusual patterns of behavior or access from accounts not typically associated with remote management tools.
  - **Validate System Configuration:** Check whether legitimate use of QQ IM-remote assistance is documented and authorized within your organization. Look for any instances where its usage is not accounted for.
  - **Correlate with Host Data:** Utilize endpoint detection and response (EDR) tools to identify if the QQ application or associated processes are running on the hosts that communicated with the QQ domains.

  ### Prioritization
  The alert's severity is medium due to the potential impact of unauthorized remote access through QQ IM-remote assistance, which can lead to significant data breaches or system compromises. The likelihood is moderate, as such tools may be used legitimately but can easily be exploited by malicious actors.

  ### Blind Spots and Assumptions
  There may be detection gaps regarding legitimate use cases of QQ IM-remote assistance, which can lead to false positives. The detection logic assumes the QQ IM tool is not part of the authorized software used within the organization. The effectiveness of the alert relies on having comprehensive network logging in place, capturing all outbound traffic to the specified QQ domains. If traffic to these domains is not logged, the detection will fail to trigger.

