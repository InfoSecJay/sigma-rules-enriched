note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains typically associated with QQ IM remote assistance tools, such as `*.mdt.qq.com`, `*.desktop.qq.com`, and `upload_data.qq.com`. The likely objective of an attacker is to use this remote management tool for command and control (C2) purposes or to facilitate unauthorized remote access to compromised systems. This behavior fits into the MITRE ATT&CK framework under the tactic "Command and Control" (TA0011) and the technique "Remote Access Software" (T1219).

  The primary telemetry source is Windows network connection logs. The necessary log types include Windows Event ID 5156 (Windows Filtering Platform) or network traffic logs recorded by firewalls and intrusion detection systems. If malicious, the security impact could involve unauthorized remote control and potential data exfiltration or manipulation. However, this rule does NOT confirm that malicious activity is occurring without additional context, as legitimate uses of QQ IM remote assistance may trigger the same alerts.

  ### Investigation Steps

  - **Review network connection logs:** Analyze Windows Event ID 5156 for connections to domains like `*.mdt.qq.com`, `*.desktop.qq.com`, and `upload_data.qq.com`. Note timestamps and outbound port numbers.

  - **Check process execution history:** Utilize Sysmon Event ID 1 to find process creation logs correlating with the detected network activity. Look for processes associated with QQ remote assistance. Validate presence in authorized application lists.

  - **Identify unusual user activity:** Review Windows Security Event ID 4624 for successful logon events around the same timeframe. Compare against typical user behavior—frequent logins from familiar locations are benign; anomalous logins may indicate compromise.

  - **Validate file activity:** If persistent behavior is detected, review for file creation or modification events (Sysmon Event ID 11). Check for unusual files in `%TEMP%` or other user directories indicative of downloading components or malware.

  - **Investigate the behavior of the user's machine:** Determine the host role (e.g., workstations, servers) and assess if remote access is permitted. Ensure there are justifiable business reasons for using QQ remote assistance, and check for documented policy exceptions.

  ### Prioritization

  This alert should be considered medium severity due to the potential for unauthorized access to sensitive systems. The likelihood of abuse exists, especially in environments with minimal oversight on remote access tools. Although not as commonly weaponized as other remote access methods, the detection focuses on a known tool with malicious usage potential.

  ### Blind Spots and Assumptions

  This detection might miss traffic encrypted via VPNs or malformed packets not captured in logs. Reliance on Windows event logging may overlook scenarios with misconfigured audit policies, resulting in missed logs. Legitimate activities include authorized use of QQ IM for remote support in recognized incidents. A related detection to consider is monitoring for unusual authentication attempts or file downloads from the same or similar domains, which can strengthen coverage against potential remote access threats.

