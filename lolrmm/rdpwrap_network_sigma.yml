note: |
  ### Technical Context

  This rule detects potential network activity related to the RDP Wrapper (rdpwrap) tool, which allows concurrent Remote Desktop Protocol (RDP) sessions on Windows machines. The likely attacker objective would be to utilize this tool to gain unauthorized remote access or facilitate lateral movement within a network. This detection is associated with the MITRE ATT&CK tactic of Execution and technique T1219 (Remote Desktop Protocol).

  The primary telemetry sources include Windows network connection logs, particularly those that log the destination hostname. If malicious, such usage may indicate unauthorized access attempts using remote management tools. Importantly, this detection does NOT confirm malicious intent on its own, as rdpwrap may be used legitimately in certain environments.

  ### Investigation Steps

  - **Check connection logs for RDP traffic:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound network connections to destinations ending with "user_managed" or "github.com/stascorp/rdpwrap." Malicious indicators may include repeated connections to these domains.

  - **Confirm legitimate uses of RDP wrap:** Investigate whether rdpwrap is authorized for use in your environment. Legitimate configurations may include corporate servers or specific workstations listed in the asset inventory.

  - **Analyze user account activity:** Check for unusual user account activity in conjunction with RDP connections by reviewing Event ID 4624 (Logon) and Event ID 4625 (Failed Logon). Look for a high number of failed attempts or logons by unusual users or accounts.

  - **Inspect recent software changes:** Validate recent changes to system configurations or installed software using logs from Software Distribution Events (Event ID 11707). Unexpected installations or updates related to rdpwrap may indicate malicious intent.

  - **Gather additional network context:** Use network monitoring tools to capture and analyze all outbound connections. Focus on identifying high volumes of traffic to suspicious external hosts as part of the investigation.

  ### Prioritization

  The alert is medium severity due to the potential impact of unauthorized remote access and the likelihood of misuse of RDP tools in targeted attacks. While not commonly weaponized on its own, RDP tools like rdpwrap can enable further malicious activities if exploited.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who may obfuscate or use different names for their RDP tools. Reliable detection requires proper logging configurations to capture outbound network connections. Legitimate uses may include administration tasks but should be validated against the business need. A related detection worth considering is RDP Login Failures (Event ID 4625), which can help confirm anomalous access attempts.

