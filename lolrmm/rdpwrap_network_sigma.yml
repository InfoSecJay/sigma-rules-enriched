note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the RDPWrap Remote Management (RMM) tool, which is often used to facilitate unauthorized remote access. The primary attacker objective is to establish a covert connection to a compromised host, often for maintaining persistence or carrying out additional malicious activities. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071 - Application Layer Protocol), specifically under the technique of Application Layer Protocol (T1219). The primary telemetry source is Windows network connection logs, highlighting anomalies in destination hostnames that end with 'user_managed'. If malicious, the security impact could involve data exfiltration or unauthorized access to sensitive systems. This detection does NOT confirm that the tool is being misused; legitimate administrative activities may also generate similar traffic.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to hostnames ending with "user_managed". Look for unusual external IP addresses or hosts not recognized in your environment.

  - **Correlate with Remote Desktop Protocol (RDP) sessions:** Examine security Event ID 4624 (successful logon) and Event ID 4672 (special privileges assigned) for successful RDP sessions to ensure that authorized users are accessing their systems.

  - **Verify asset roles:** Determine the criticality of the affected host by identifying its role (e.g., server, endpoint) and evaluate whether it should have RDPWrap installed. Use asset management tools to confirm expected configurations.

  - **Identify high-confidence malicious indicators:** Look for patterns of network traffic from known malicious IPs associated with RDPWrap. Use threat intelligence feeds to correlate against the destination IP addresses.

  - **Document legitimate activity:** Gather information on expected use of RDPWrap within your organization. Interview relevant IT staff to understand if there are intended uses that require monitoring.

  ### Prioritization

  Given the medium severity level, this alert warrants attention due to the potential impact on compromised systems, the relatively high likelihood of malicious abuse, and the nature of tools like RDPWrap being commonly weaponized for unauthorized remote access.

  ### Blind Spots and Assumptions

  This detection has limitations due to potential evasion techniques such as encrypted tunnels that could mask RDPWrap’s network activity. Required log sources include thorough Windows Filtering Platform logs. Legitimate IT support activities may trigger this alert, emphasizing the need for context during investigations. Complementary detections, such as monitoring for unusual user logins via Event ID 4776 (authentication), can strengthen coverage.

