note: |
  ### Technical Context

  This rule detects network communications from endpoints to known Monitic RMM tool domains, indicating potential unauthorized remote monitoring or management activity. The likely attacker objective could be to establish persistence, exfiltrate data, or control systems remotely without user consent. This behavior corresponds to MITRE ATT&CK’s Execution tactic, specifically Technique T1219 (Remote Access Software).

  Primary telemetry sources are Windows network connection logs, capturing outbound traffic to identified Monitic domains. If malicious, this activity can lead to data breaches or system manipulation. It is essential to note that this detection alone does NOT confirm compromise; it merely indicates contact with potential RMM infrastructure.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for processes connecting to 'api.monitic.com', 'app.monitic.com', or related domains. Validate unusual outbound connection patterns or unexpected source IPs.

  - **Identify the initiating process:** Cross-reference the connections with Event ID 4688 (Process Creation) to determine which executable is initiating the connection. Look for processes that are not typically expected to initiate RMM connections, such as script interpreters or unexpected binaries.

  - **Review recent software installations:** Investigate if there have been recent installations or configurations of legitimate Monitic software within the last 30 days (e.g., via Event ID 1033 – Group Policy Operational). Ensure that this usage is consistent with existing IT policies and documented use cases.

  - **Analyze associated user accounts:** Identify the user accounts responsible for the actions by examining Event ID 4624 (Successful Logon) logs. Confirm if the users are authorized to use remote management tools, especially if they belong to administrative groups.

  - **Monitor for data exfiltration:** Validate that there are no subsequent suspicious file transfers that may indicate data exfiltration following the initial connection (look for Event ID 4663 – File Access). This may involve checking for unusual outbound network traffic and unauthorized file access prior to or after the detected connection.

  ### Prioritization

  The medium severity of this alert is based on the potential risk associated with unauthorized RMM usage and the criticality of affected assets. If the tool is weaponized, it can facilitate data breaches or system takeovers, making it essential for immediate review.

  ### Blind Spots and Assumptions

  Detection may be evaded through encrypted communications or by utilizing legitimate channels after deploying the Monitic tool. Reliable detection necessitates comprehensive logging presence for Windows Filtering Platform connections and process creation events. Legitimate use cases for Monitic tool activity may trigger alerts, particularly in environments with approved remote management setups. Companion detections include monitoring for unusual process behavior or lateral movement associated with RMM software.

