note: |
  ### Technical Context

  This rule detects network connections involving the Monitic remote monitoring and management (RMM) tool, which may be indicative of unauthorized remote access activities. The likely attacker objective is to establish control over compromised systems for maintenance or exploitation. This detection aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Remote Access Software" (T1219). The primary telemetry sources are Windows network connection logs capturing outbound and inbound traffic. If malicious, its security impact could lead to unauthorized actions on critical systems and potential data breaches. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of the Monitic tool by system administrators or support personnel may trigger it.

  ### Investigation Steps

  - **Review connection logs for Monitic domains**: Analyze network connection logs (Event ID 5156) for outgoing connections to 'api.monitic.com' or any other domains listed in the rule. Investigate frequency and origin of these connections to identify unusual patterns.

  - **Assess user account activity**: Check user activity logs (Event ID 4624) to determine whether the user initiating the connection is authorized to use the Monitic tool, and confirm the associated account's role and typical behaviors.

  - **Identify potentially malicious indicators**: Look for high-confidence flags, such as unusual outbound traffic to Monitic domains from non-admin accounts or devices not typically monitored by RMM tools. Investigate any event sequences that coincide with the connections for signs of exploitation.

  - **Validate legitimate use cases**: Cross-reference the alerts with a known inventory of systems and applications utilizing Monitic. If identified on a management device commonly using RMM software, that may indicate benign activity.

  - **Check for lateral movement**: Monitor for subsequent connections to internal systems from the device making RMM connections. Look for unusual service installations or privilege escalation logs (Event ID 4672) to identify any exploitation attempts.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on environments using Monitic for legitimate administrative purposes. Awareness of common attack vectors using RMM tools makes this behavior a valid concern. However, the frequency of legitimate usage must be closely monitored to avoid false positives.

  ### Blind Spots and Assumptions

  This detection may have limitations as adversaries could use other protocols or tunnels to communicate that do not trigger this rule. Ensure logging configurations for Windows network connections are comprehensive to maintain effective detection capabilities. Furthermore, legitimate administrative activities, such as routine maintenance operations from trusted network segments, may trigger the rule. A companion detection for potentially malicious behavior would include monitoring for unusual login times or failed login attempts related to RMM tool usage.

