note: |
  ### Technical Context

  This Sigma rule detects network activity directed towards Monitic remote monitoring and management (RMM) tool domains. The likely objective is to establish command and control (C2) capabilities for remote administration, data exfiltration, or unauthorized access. The relevant MITRE ATT&CK tactics are **Command and Control** (TA0011) and **Application Layer Protocol** (T1219). Primary telemetry sources include network connection logs from Windows devices. If the activity is malicious, it could enable adversaries to exert control over compromised systems. Importantly, this detection does NOT confirm malicious activity by itself without further context or evidence of exploitation.

  ### Investigation Steps

  - **Verify destination domains**: Check network connection logs for traffic to domains like `*.api.monitic.com` and `*.app.monitic.com` (Windows Event ID 5156). Legitimate use may show connections to these domains from recognized management servers or internal tooling.

  - **Check process origins**: Identify the process responsible for the network connections (Sysmon Event ID 3). Look for known management software associated with legitimate usage. Malicious software might originate from suspicious directories or use unusual names.

  - **Examine user activity**: Review user account activity around the time of the detected connections (Windows Event ID 4624). Benign connections will typically originate from administrative accounts or specific asset users; inspect for unknown or service accounts.

  - **Monitor data exchange volume**: Analyze the volume of data transmitted to and from the detected domains via your firewall or proxy logs. Elevated data exchange during brief intervals could indicate data exfiltration attempts.

  - **Review surrounding network behavior**: Check for other network indicators that might correlate with the alert (e.g., unusual outbound connections). This can indicate coordinated malicious activity.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of remote management and the likelihood of misuse by adversaries. While legitimate use exists, the behavior is often weaponized in various attack scenarios, making prompt investigation necessary.

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited by encrypted traffic; if Monitic connections use HTTPS, visibility into payloads is restricted. Ensure network logs are reviewed regularly and that any proxies are correctly configured to detect these domains. Legitimate actions might include routine maintenance from authorized IT personnel. To enhance coverage, companion detections for unusual outbound traffic patterns to other C2 domains should be established.

