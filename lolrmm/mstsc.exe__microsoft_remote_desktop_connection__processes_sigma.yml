note: |
  ### Technical Context

  This detection captures potential process activity involving `mstsc.exe` (Microsoft Remote Desktop Connection), indicating its use as a remote management tool. Attackers may leverage `mstsc.exe` to gain unauthorized remote access to compromised systems, facilitating further exploitation or lateral movement within a network. Relevant MITRE ATT&CK techniques include Remote Access Software (T1219) under the Command and Control tactic.

  Primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon process activity (Event ID 1). If the activity is malicious, it could lead to unauthorized access, data exfiltration, or further compromise of the environment. However, this detection alone does not confirm malicious intent, as `mstsc.exe` can be legitimately used in many administrative scenarios.

  ### Investigation Steps

  - **Review process creation logs for mstsc.exe:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for entries showing `mstsc.exe` being executed. Look for the command line parameters to see if any suspicious arguments are present.

  - **Check the parent process ID:** Identify the parent process of `mstsc.exe`. Legitimate usage typically involves administrative applications or scripts, while unusual parent processes may indicate malicious intent.

  - **Investigate user accounts associated with the activity:** Verify the user account that initiated the `mstsc.exe`. High privilege accounts might indicate legitimate use, whereas standard users executing it could signal potential misuse.

  - **Examine the session initiation details:** Obtain logs from Remote Desktop Services (Terminal Services) within Event ID 4624 (Logon) to confirm if the session was initiated by a recognized user and from an expected IP address. Anomalous sources or unexpected usage times may indicate compromised access.

  - **Identify network connections and destinations:** Review network logs for connections established as a result of `mstsc.exe` usage. Check for unusual IP addresses or connections to external domains that are not typically accessed by the organization.

  ### Prioritization

  The alert severity is medium, primarily due to the potential impact on security if `mstsc.exe` is exploited for unauthorized remote access. There is a moderate likelihood of misuse since this tool is commonly weaponized in remote access attacks, especially if executed by non-administrative users or from unrecognized machines.

  ### Blind Spots and Assumptions

  Detection may be limited if log sources are misconfigured or if `mstsc.exe` is obfuscated or renamed by an attacker. High-confidence benign usage may occur during authorized administrative sessions. Additionally, user education on remote access protocols could lead to legitimate alerts when staff conduct remote work. Related detections include monitoring for unusual account activity (e.g., Account Logon, Event ID 4624), which can provide context to potential unauthorized usage of `mstsc.exe`.

