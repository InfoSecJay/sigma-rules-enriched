note: |
  ### Technical Context

  This rule detects instances of the `mstsc.exe` process being spawned by itself, which may indicate a potential misuse of Microsoft Remote Desktop Connection as a remote management tool. Attackers can leverage this to maintain persistence or execute commands on compromised systems, aiming for lateral movement or data exfiltration. The associated MITRE ATT&CK tactic is Execution, specifically technique T1219 (Remote Access Software).

  The primary telemetry source required is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this behavior is malicious, it could lead to unauthorized access or control over sensitive systems in the network. Importantly, this detection does NOT confirm that all occurrences of `mstsc.exe` are malicious, as legitimate remote desktop sessions also generate similar events.

  ### Investigation Steps

  - **Review process creation events:** Look for Security Event ID 4688 or Sysmon Event ID 1 entries where `Image` is `mstsc.exe` and `ParentImage` is also `mstsc.exe`. Note the timestamp and user context for context on the activity.

  - **Correlate user activity:** Check if the user account associated with the event exhibits patterns of legitimate remote session usage. Use logon events (Security Event ID 4624) within the timeframe to assess if this user was expected to connect remotely.

  - **Analyze recent login history:** Check Windows Security logs (Event ID 4648) to see if there were any credential usage events leading up to the creation of the process indicating that an account was used to authenticate to the system.

  - **Verify unusual outbound connections:** Inspect network logs, such as firewall logs or proxy logs, to identify connections initiated by `mstsc.exe`. Look for unusual IP addresses or ports that are not typically accessed by the user or organization.

  - **Assess asset criticality:** If the process information indicates a connection from a Domain Controller or an admin workstation, prioritize this alert higher due to the potential impact of unauthorized access.

  - **Check for concurrent sessions:** Determine if there were other RDP sessions active on the system during the same time frame. This may indicate legitimate use versus unauthorized spawning of the `mstsc.exe` process.

  ### Prioritization

  This alert has a medium severity due to the potential for misuse of remote access capabilities. If the affected system is critical or administrative, the risk of malicious use increases significantly. While remote desktop tools are commonly weaponized by adversaries, a thorough investigation is necessary to differentiate between legitimate and malicious activity.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using legitimate remote desktop tools for malicious purposes or through the use of alternative remote access software not covered by this rule. It requires reliable logging configuration of process creation events to capture activity consistently. Legitimate administrative actions may also trigger this alert, particularly in environments where system administrators utilize `mstsc.exe` for routine management. A related detection rule that could enhance coverage is monitoring for unusual external IP addresses in connection logs associated with `mstsc.exe`.

