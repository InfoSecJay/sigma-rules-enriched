note: |
  ### Technical Context

  This rule detects the execution of processes associated with the TigerVNC Remote Management Tool (RMM), commonly used for remote administration and support. The attacker’s objective might involve unauthorized access or control over a compromised system, enabling further actions like data exfiltration or lateral movement. The relevant MITRE ATT&CK tactics and techniques for this behavior include Execution (TA0002) and Remote Services (T1219).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688, Sysmon Event ID 1) that capture process creation events, along with details about the parent and child processes involved. The security impact can be significant if malicious, as it can indicate unauthorized remote access and control over target systems. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Review process execution details:** Examine Security Event ID 4688 for the process creation event related to TigerVNC. Pay close attention to the "Image" field for entries ending with "tigervnc*.exe," "winvnc4.exe," or "tvnserver.exe."

  - **Analyze parent process relationships:** Identify the parent process of the detected TigerVNC instances. Malicious activity may show these processes spawned from suspicious or unexpected parent processes. Use the "ParentImage" field to verify legitimate usage patterns.

  - **Correlate user accounts with activity:** Check the "SubjectUserName" field in the event logs. If the process is initiated by non-administrative user accounts or unexpected accounts, this may indicate misuse.

  - **Verify legitimate usage patterns:** Legitimate uses of TigerVNC will typically have known, documented asset roles and scheduled maintenance windows. Cross-reference with internal policies to confirm authorized usage.

  - **Investigate potential data exfiltration:** For any confirmed malicious instances, look for associated network connections and file manipulation actions (Event ID 4663) that may indicate data being accessed or extracted.

  - **Document system impact and criticality:** Determine the asset’s role and criticality within the environment. Processes running on sensitive systems (e.g., domain controllers, financial databases) should be prioritized for immediate investigation.

  ### Prioritization

  This alert has medium severity due to the potential impact of remote access tools being used maliciously on critical systems. The likelihood of abuse is moderate, given that TigerVNC can be used legitimately; however, it is often weaponized in real-world attacks. Close monitoring and prompt investigation are warranted to assess any unauthorized usage.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate activities, as TigerVNC is commonly used for valid remote support. Make sure appropriate logging is enabled for process creation, including Sysmon, to capture all necessary details. Additionally, legitimate administrative tools or legitimate remote support sessions might trigger this alert; thus, maintaining a window of expected behavior is vital. Related detections such as unauthorized access to file shares or anomalous account logins may help provide a fuller context for investigation and strengthen detection coverage.

