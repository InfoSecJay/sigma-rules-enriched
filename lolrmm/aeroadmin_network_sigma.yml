note: |
  ### Technical Context

  This Sigma rule detects network connections to AeroAdmin, a remote management tool often exploited by threat actors for unauthorized access to systems. The likely objective of an attacker utilizing AeroAdmin is to establish remote persistence or command and control over compromised systems. This behavior aligns with the MITRE ATT&CK tactic of Remote Access (T1219).

  Primary telemetry sources for this detection include Windows event logs capturing network connections, specifically focusing on fields that detail `DestinationHostname`. The security impact of such connections could lead to significant data breaches or system tampering if leveraged maliciously. However, this detection does NOT confirm that the connection is malicious on its own, as AeroAdmin may be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Verify network connection details**: Examine Windows Event ID 5156 (Windows Filtering Platform) to confirm outbound connections to the identified AeroAdmin hostnames. Check the `DestinationIp` for known AeroAdmin IP addresses.

  - **Assess running processes**: Look for the presence of AeroAdmin executable files (e.g., `AeroAdmin.exe`) in process listings via Task Manager or Sysinternals tools like Process Explorer. The legitimate use might show expected versions and source paths while suspicious versions may vary.

  - **Review system logs for recent changes**: Inspect Event ID 4688 (Process Creation) for `AeroAdmin.exe` to ensure proper invocation patterns. Malicious instances may exhibit unusual parent processes or execution contexts not typical of standard administrative operations.

  - **Correlate user activities**: Check user activity logs to see if specific accounts are associated with the AeroAdmin connections. Legitimate use would typically show authorized user activity, whereas unfamiliar users or accounts may indicate a compromise.

  - **Inspect firewall logs**: Review firewall logs for rules allowing outbound traffic to AeroAdmin DNS names. This may indicate firewall rule changes, which should generally be monitored for abnormal patterns.

  ### Prioritization

  This alert has medium severity as it indicates the potential for unauthorized remote access to critical systems. The likelihood of malicious abuse is significant due to the frequent use of remote management tools in attacks, particularly when associated with compromised credentials.

  ### Blind Spots and Assumptions

  Potential evasion techniques include using domain fronting or changing the destination hostname to avoid detection. There must be appropriate logging configurations in place for effective monitoring of outbound network activities. Legitimate administrative use of AeroAdmin can generate similar alerts. Companion detections such as monitoring for anomalous login behaviors or the use of similar remote access tools (e.g., TeamViewer, AnyDesk) can enhance detection efficacy.

