note: |
  ### Technical Context

  This rule detects outbound network connections to AeroAdmin's command and control servers, which may indicate unauthorized remote management tool activity. The likely attacker objective is to gain uncontrolled access to systems for remote management or data exfiltration. This detection aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Remote Access Software" (T1219).

  The primary telemetry sources are Windows network connection logs, specifically monitoring for DNS resolutions or connections to the specified AeroAdmin hostnames. If this interaction is malicious, it could facilitate unauthorized control over a compromised system or data exfiltration. However, this detection does NOT confirm that AeroAdmin usage is malicious; legitimate administrative use could also trigger this alert.

  ### Investigation Steps

  - **Identify network connections:** Review network logs for outbound connections to `auth*.aeroadmin.com` and `aeroadmin.com`. Check Event ID 5156 (Windows Filtering Platform) for connection details, including destination IP and port.

  - **Cross-reference process execution:** Use Sysmon Event ID 1 to identify any processes initiating connections to AeroAdmin domains, looking for unusual parent processes or suspicious command line arguments.

  - **Evaluate user context:** Verify the account performing the connections. Look for legitimate administrative user activity in the last logon events (Security Event ID 4624). Consistent usage patterns can indicate benign behavior.

  - **Check for concurrent suspicious behavior:** Investigate other related security events (e.g., Event ID 4688 for new process creation) around the same time as the AeroAdmin connections to identify potential malware activity attempting to use remote access tools.

  - **Assess asset criticality:** Determine the role of the affected machine (e.g., server vs. workstation), as compromised systems in sensitive environments present a higher risk and should be prioritized for further analysis.

  ### Prioritization

  The alert should be treated with medium severity. While the likelihood of abuse is moderate due to the tool's legitimate administrative use, the impact could be significant if an attacker exploits the remote management capabilities for malicious purposes. Remote access software is frequently weaponized, emphasizing the need for a thorough review.

  ### Blind Spots and Assumptions

  This detection may be evaded through methods such as DNS tunneling or unregistered domains to mask malicious connections. It is crucial to ensure logging is enabled for Windows Filtering Platform to capture relevant data effectively. Legitimate administrative activities, particularly in Managed Service Provider environments, can trigger this alert. A related detection involves monitoring for unusual outbound traffic patterns or anomalies in Remote Desktop Protocol (RDP) usage, which could help enhance detection capabilities.

