  ### Technical Context

  This Sigma rule detects network connections to AeroAdmin Remote Management Tool (RMM) servers, which may indicate unauthorized remote access attempts. The likely attacker objective is to gain persistent control over a victim system, facilitating data exfiltration, system manipulation, or lateral movement within the network. This activity aligns with the MITRE ATT&CK technique for Remote Services, specifically T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows network connection logs, capturing outbound connection attempts. If malicious, the security impact includes unauthorized access and control over internal systems, potentially leading to data breaches or ransomware deployment. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of AeroAdmin is permitted in some environments.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Examine Windows network event logs (Event ID 5156) for outbound connections to domains such as `auth*.aeroadmin.com` or `aeroadmin.com`. Investigate the origin IP and application context to determine if the connection is authorized or suspicious.

  - **Identify running processes:** Check for processes related to AeroAdmin using Sysmon Event ID 1 (Process Creation) and confirm if the process executing the outbound connection matches known benign applications. Analyze command line arguments for signs of exploitation or unusual execution patterns.

  - **Correlate user activity:** Access logs (like Event ID 4624 - Logon) to determine if a user was active on the system at the time of the connection attempt, which could indicate legitimate usage. Look for any discrepancies or unusual patterns in user login behavior.

  - **Examine firewall logs:** Analyze firewall or proxy logs for attempts to reach AeroAdmin servers. Check for frequency and timing of these requests, particularly during off-hours, which may indicate an unauthorized access attempt.

  - **Review asset criticality:** Evaluate the risk based on the role of the affected asset. Identify if the user has administrative privileges or is handling sensitive information, which could escalate the incident's severity.

  - **Check for file artifacts:** Look for unexpected file creation in directories commonly associated with AeroAdmin’s installation and execution (like `C:\Program Files\AeroAdmin`). Validate if there are any files that correspond to unauthorized installations or usage.

  ---

  ### Prioritization

  This alert is medium priority due to the potential security implications of unauthorized remote access tools. If an administrative account is compromised or an asset with sensitive data is involved, the risk increases significantly. Since tools like AeroAdmin are frequently weaponized, prompt investigation is essential.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited due to legitimate AeroAdmin usage by internal teams, which could result in false positives. Reliable detection requires proper monitoring of network logs and DNS resolution, potentially necessitating additional configurations on firewalls and endpoint solutions. Legitimate file sharing or remote assistance activities involving AeroAdmin can trigger the alert. Companion detections include monitoring for unauthorized software installation logs to strengthen coverage against remote access threats.

