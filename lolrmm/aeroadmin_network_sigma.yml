  ### Technical Context

  This Sigma rule detects network connections to AeroAdmin remote management tool endpoints, suggesting potential unauthorized access or administration of systems. Adversaries may leverage AeroAdmin to gain remote control over systems, enabling persistence or lateral movement across the network. This behavior aligns with the MITRE ATT&CK technique for Remote Services (T1219), which describes the use of remote access tools to execute commands and control systems.

  The primary telemetry source is Windows network connection logs, specifically those indicating DNS resolution or outbound connections to AeroAdmin's domains such as `aeroadmin.com` or its subdomains. If malicious, this activity could lead to significant data breaches or unauthorized system control. However, this detection does not confirm whether the activity is indeed malicious, as legitimate use of AeroAdmin for remote support may trigger the same alert.

  ---

  ### Investigation Steps

  - **Verify network connection logs: ** Check Windows Security Event ID 5156 (Windows Filtering Platform) for connections to `auth*.aeroadmin.com` or `aeroadmin.com`. Assess both source and destination addresses to identify unexpected remote access attempts.

  - **Examine user ownership: ** Review logins associated with the connection using Event ID 4624. Confirm if the user has legitimate authorization to use AeroAdmin for remote support tasks.

  - **Identify legitimate AeroAdmin usage: ** Cross-reference connections against a list of known support personnel using AeroAdmin to ensure legitimate use cases. Look for expected timestamps or specific user accounts associated with those connections.

  - **Look for malicious patterns in connections: ** Investigate sudden spikes in connections to AeroAdmin domains or recurrences from unusual geographical locations or IPs, suggesting potential compromise.

  - **Review system changes post-connection: ** Analyze log files for recent alterations in Active Directory (Event ID 4672) or local group memberships which might indicate privilege escalation attempts post-connection.

  - **Check for related file activities: ** Evaluate file transfer logs or local file changes through Sysmon Event ID 11 (FileCreate) to determine if sensitive data was exfiltrated using this tool.

  ---

  ### Prioritization

  Alerts generated by this detection should be treated as medium priority due to the potential impact of unauthorized remote access on critical systems. Adversaries commonly exploit remote management tools for lateral movement, which increases the likelihood of malicious abuse in environments where AeroAdmin is not officially sanctioned.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the variant usage of AeroAdmin, as legitimate administrative tasks can lead to similar alerts. It requires comprehensive logging configurations to ensure all outbound network activity is captured reliably. Additionally, administrators utilizing AeroAdmin for remote troubleshooting may trigger these alerts, necessitating contextual investigations. A related detection for unauthorized Powershell Remote Management sessions (T1028) may enhance coverage and help validate the suspicious activity further.

