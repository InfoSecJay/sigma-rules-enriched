note: |
  ### Technical Context
  This rule detects potential network activity associated with the AeroAdmin Remote Management and Monitoring (RMM) tool, which may indicate unauthorized remote access or abusage of administrative capabilities. The suspect tool facilitates remote desktop connections, allowing attackers to control victim machines, steal data, or deploy additional malware. Attackers leveraging AeroAdmin may aim to establish persistent access to compromised systems or conduct further reconnaissance within the network.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and the technique **Remote Services** (T1219), which encompasses using remote management tools to execute malicious activities. Both tactics underline the necessity of monitoring legitimate administrative tools that can also be misused for malicious purposes.

  The primary data sources for this detection rule include **Windows network connection logs**, which provide visibility into outbound connections made by processes on the system. Monitoring for unexpected connections to known AeroAdmin domains can highlight potential encroachments by threat actors.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine the Windows network connection logs for connections initiated towards `auth*.aeroadmin.com` and `aeroadmin.com`, identifying any unusual activity or patterns associated with these destinations.
  - **Analyze Process Activity:** Investigate processes that have established connections to AeroAdmin domains. Check for any processes that are not commonly associated with legitimate administrative tasks, or that exhibit suspicious behaviors such as running from unusual directories.
  - **Check for Unauthorized Installations:** Conduct a review of installed software on systems within your environment to determine if AeroAdmin is present. Verify the legitimacy of installations and assess any deviations from expected software applications used for remote desktop management.
  - **Validate User Accounts and Access Logs:** Scrutinize user account activity around times of suspected AeroAdmin usage. Look for any accounts that demonstrate unusual access patterns, such as previously inactive accounts or non-administrative account types that appear to initiate connections.

  ### Prioritization
  The alert is deemed of **medium severity** due to the potential for significant impacts on data confidentiality, integrity, and availability if exploited by attackers. While legitimate uses exist for AeroAdmin, its detectability and common association with malicious activities necessitate timely investigation to uphold security posture.

  ### Blind Spots and Assumptions
  Detection coverage may be limited due to the possibility of attackers employing obfuscation techniques or using alternative infrastructure for remote control, which may evade detection by standard monitoring. The rule assumes that **network connection logs** are enabled and configured to capture adequate detail. Additionally, legitimate use cases for AeroAdmin may lead to false positives; thus, contextual validation is crucial to distinguish between malicious and benign activity.

