note: |
  ### Technical Context

  This detection rule identifies process creation activities associated with the LabTeach (Connectwise Automate) RMM tool, specifically when processes originate from `ltsvc.exe`. Attackers may use RMM tools to maintain persistence, deploy payloads, or remotely control compromised systems. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique for Remote Access Software (T1219). The primary telemetry source is Windows process creation logs, particularly focusing on Security Event ID 4688. If malicious, the security impact includes unauthorized remote access and potential lateral movement across the network. This detection does NOT confirm that the activity is malicious as it can also represent legitimate use of the tool in an administrative capacity.

  ### Investigation Steps

  - **Examine parent process:** Review Security Event ID 4688 for process creation logs where `ParentImage` ends with `\\ltsvc.exe`. Identify processes spawned directly by this parent for further correlation.

  - **Identify legitimate behavior:** Look for expected processes initiated by authorized personnel using the LabTeach tool. Legitimate activity may include process names associated with scheduled tasks or known administrative operations related to network monitoring.

  - **Check for high-confidence malicious indicators:** If processes created by `\\ltsvc.exe` interact with sensitive application data, such as accessing credential stores or executing command line arguments with `-r`, this raises suspicion for malicious use.

  - **Validate RMM context:** Review authorized service accounts and roles involved in using LabTeach. Ensure that logged activities align with documented maintenance windows or scheduled tasks as per organizational policy.

  - **Monitor network traffic:** Use network telemetry to check for outbound connections that correspond with RMM activities. Look for unusual spikes in traffic or connections to unfamiliar IPs or domains commonly associated with C2 infrastructure.

  - **Assess asset criticality:** Focus on endpoints that handle sensitive data or critical systems where RMM tools would be most impactful. Elevate investigation priority based on the criticality of affected assets.

  ### Prioritization

  This alert is of medium severity due to the potential for unauthorized remote access on critical systems. While RMM tools can be manipulated to facilitate malicious actions, their usage is also common in legitimate administrative tasks. Proper context and correlations are essential to distinguishing between benign and malicious activities.

  ### Blind Spots and Assumptions

  A limitation of this detection is the reliance on proper logging configurations for process creation which may be disabled in certain environments. Legitimate administrative activities, such as scheduled maintenance by IT staff using LabTeach, may trigger the alert. Companion detections, such as monitoring for unusual outbound network connections from systems running RMM tools, can provide additional context and stronger coverage against misuse.

