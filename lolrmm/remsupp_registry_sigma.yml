note: |
  ### Technical Context

  This Sigma rule detects registry activity related to the RemSupp RMM tool, specifically targeting certain registry keys commonly associated with its installation and operation. The likely attacker objective may involve remote management or exploitation of systems using this tool, as it can be leveraged for command-and-control (C2) purposes. The relevant MITRE ATT&CK technique is T1219 - Remote Access Software.

  The primary telemetry sources required are Windows Registry events, particularly focusing on registry modification logs. If the detected registry activity is indeed malicious, this could allow an attacker to gain persistent access to systems. However, it's crucial to note that this detection alone does not confirm malicious behavior; it may also indicate legitimate use of the RemSupp tool.

  ### Investigation Steps

  - **Identify registry modifications:** Review Windows Event ID 4657 for changes to specific registry paths: `HKCU\Software\99ac595d-36d0-5122-a860-22a3443073cb` and `HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\99ac595d-36d0-5122-a860-22a3443073cb`. Look for timestamps and the user account making these changes to assess context.

  - **Review process creation logs:** Analyze Security Event ID 4688 or Sysmon Event ID 1 to check if there are any processes spawned that may correspond to the RemSupp tool, such as executables or scripts running immediately after the registry changes.

  - **Check for known benign usage:** Validate if the affected systems have documented installations or legitimate use of RemSupp by checking installation logs and software inventories. This may include correlated entries from inventory systems or endpoint protection logs.

  - **Correlate network connections:** Investigate outbound network connections on the affected host using Firewall logs or Sysmon Event ID 3. Check for unusual or unauthorized IP addresses that may indicate malicious C2 communications associated with RemSupp usage.

  - **Assess user account behavior:** Examine the behavior of the user account associated with the registry modifications for abnormal activity such as unusual login patterns or access to sensitive data, using Active Directory logs for context.

  ### Prioritization

  This alert has medium severity given its potential impact on affected systems that could be exploited for unauthorized access. The likelihood of malicious abuse is notable since remote management tools are commonly weaponized by attackers. Organizations should treat these detections seriously, especially in sensitive environments.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers might change registry keys or use legitimate tools to mask malicious actions. Accurate detection requires adequate logging settings for registry changes and continuous monitoring of activity around these keys. Legitimate administrative activities may also trigger this alert, such as authorized installation or configuration of RMM tools. To improve coverage, consider companion detections focusing on further malicious indicators associated with remote access software (such as unusual remote login attempts or file transfers).

