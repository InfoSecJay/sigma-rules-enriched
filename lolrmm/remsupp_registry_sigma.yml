note: |
  ### Technical Context

  This Sigma rule detects unauthorized access or modification of specific registry keys associated with the RemSupp Remote Monitoring and Management (RMM) tool. The likely attacker objective could be to establish persistence, leveraging RemSupp for remote administration or exfiltration purposes after an initial compromise. The relevant MITRE ATT&CK tactic is "Execution," specifically technique T1219 (Remote Access Software). The primary telemetry sources involve Windows registry event logs, particularly any activity targeted at the identified registry paths.

  If malicious, this activity can lead to unauthorized remote control of systems, compromising data integrity and confidentiality. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate uses of RemSupp may trigger these alerts.

  ### Investigation Steps

  - **Examine registry event logs**: Review Windows Security Event ID 4657 (Registry value modified) for changes made to 'HKCU\Software\99ac595d-36d0-5122-a860-22a3443073cb' or the uninstall registry keys. Compare timestamps against user activity.

  - **Look for application installations**: Check Windows Event ID 11724 (MsiInstaller) for any recent application installations or modifications, especially those related to RemSupp, to validate if the registry changes align with legitimate usage patterns.

  - **Review system process history**: Analyze Sysmon Event ID 1 (Process Creation) for the execution of any processes associated with RemSupp to identify if a new process correlated with the registry activity was initiated.

  - **Determine asset criticality**: Identify if the affected host is critical to business operations. Focus additional scrutiny on sensitive systems and check for patterns of anomalous remote connections.

  - **Identify high-confidence malicious indicators**: Search for any related network activity logs (e.g., firewall or proxy logs) showing outbound connections to unusual IP addresses after the registry access, indicating possible data exfiltration or command and control contacts.

  - **Evaluate user permissions**: Verify the user accounts that made changes to the registry. Compare these against normal user behavior and permissions for the affected systems to identify any unauthorized actions.

  ### Prioritization

  This alert is of medium severity due to the potential for critical system compromise via remote control mechanisms. The presence of indicators relating to the RemSupp tool raises the likelihood of malicious abuse, particularly if unauthorized processes are identified. While the behavior is not uncommon for legitimate IT administration, it can be weaponized by attackers following initial access.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in registry auditing or if this activity occurs during legitimate administrative tasks, leading to false positives. Ensure auditing is enabled for the relevant registry paths to maintain reliable detection. Legitimate usage, such as authorized IT support activities, may trigger the alert. A related detection to consider is monitoring for unusual remote desktop protocol (RDP) sessions or other remote admin tools to provide broader context for any potential abuse of the RemSupp tool.

