note: |
  ### Technical Context

  This rule detects outbound network connections to the HelpBeam RMM tool's associated domains, which may indicate unauthorized remote access or administration attempts within an enterprise environment. The likely attacker objective is to exploit Remote Monitoring and Management (RMM) capabilities to establish control over affected systems, facilitating further exploitation or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1071) and Remote Access Tools (T1219).

  Primary telemetry sources include Windows network connection logs typically captured under Event ID 5156. If malicious, this behavior allows an adversary to compromise systems without detection. However, it is important to note that this detection does NOT confirm malicious intent on its own, as HelpBeam may be legitimately used by system administrators for remote support.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Security Event ID 5156 for outbound connections to HelpBeam domains (e.g., '*.helpbeam.software.informer.com'). Look for timestamps that align with the alert.

  - **Identify legitimate usage:** Confirm whether HelpBeam is listed in organizational procedures for remote support. If legitimate usage is found, document accordingly to reduce false positive rates.

  - **Verify host context:** Determine if the affected system is typically used for administrative tasks or if its role suggests it should not be running RMM tools. High-risk assets should be scrutinized more closely.

  - **Correlate with process creation events:** Look for associated process creation logs (Event ID 4688) that show the execution of HelpBeam executables. Malicious indicators include unusual parent processes or execution from uncommon paths.

  - **Assess account activity:** Review logs related to user accounts or sessions involved in the generated alert to check for newly created or unfamiliar accounts being used to initiate connections. Particularly watch for accounts with unusual access patterns.

  ### Prioritization

  This alert is medium severity due to the potential for severe system compromise through unauthorized RMM activity. The likelihood of malicious abuse is moderate, especially if the impacted systems have not documented legitimate uses of HelpBeam. Such tools are often weaponized by adversaries for post-exploitation activities.

  ### Blind Spots and Assumptions

  This detection may be evaded if an adversary utilizes different remote access tools that are not monitored. Additionally, effective detection relies on the consistent logging of network activity (Event ID 5156); without it, visibility into this behavior diminishes. Legitimate IT administration activities could also trigger the alert, particularly during support tasks. A related detection to strengthen coverage would be monitoring for other known remote access tools or unusual network behavior indicative of Command and Control operations.

