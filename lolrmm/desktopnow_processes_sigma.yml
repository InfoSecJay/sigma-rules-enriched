note: |
  ### Technical Context

  This Sigma rule detects the execution of the DesktopNow remote management tool, commonly utilized for managing systems remotely. The likely attacker objective is to establish persistence and maintain control over compromised devices, potentially for data exfiltration or lateral movement. This behavior correlates with the MITRE ATT&CK tactic for Command and Control (T1071) and the technique for Remote Access Tools (T1219). Primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon Event ID 1, which log details about process initiation. If malicious, the security impact could include unauthorized access to sensitive data, system manipulation, or instigation of additional attacks. Notably, this detection does NOT confirm malicious intent on its own, as DesktopNow can be legitimately used in enterprise environments.

  ### Investigation Steps

  - **Review recent process creation logs:** Check Windows Security Event ID 4688 for instances where the process "desktopnow.exe" was executed, focusing on timestamps and user accounts involved in the activity.

  - **Analyze the parent process:** For any observed instances of "desktopnow.exe", examine the ParentImage field to determine if it was launched by a legitimate application or scripts, indicating potential benign behavior or misuse.

  - **Correlate with user activity:** Check Sysmon Event ID 1 logs for the network connections established by the "desktopnow.exe" process, looking for suspicious external IP addresses or unusual connection patterns that could indicate malicious use.

  - **Identify known legitimate users:** Compare the user accounts associated with the "desktopnow.exe" activity against a list of authorized personnel for remote management tools. Legitimate use typically involves IT or support staff, so unexpected accounts may signal potential compromise.

  - **Inspect access logs for lateral movement:** Review Windows Security Event ID 4624 (Logon) from the same timeframe to affirm whether the user who executed "desktopnow.exe" has been involved in any unusual logins or access to critical systems.

  ### Prioritization

  This alert represents a medium severity due to the risk posed by unauthorized remote access to systems which can lead to significant data breaches or lateral movement within the network. While DesktopNow is weaponized in specific attack scenarios, its presence could indicate a range of legitimate or malicious activities that require further investigation.

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of logs from environments where DesktopNow is used legitimately, hindering the ability to differentiate benign from malicious activity. False positives are likely during regular maintenance or IT administration routines. It’s essential to ensure Sysmon is properly configured to log detailed process information. Companion detections to enhance coverage may include monitoring for unusual outbound connections correlated with the execution of remote management tools.

