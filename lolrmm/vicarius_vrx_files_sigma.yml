note: |
  ### Technical Context

  This Sigma rule detects file access and modifications related to the Vicarius vRx RMM tool, specifically targeting log files and configuration files associated with the application. An attacker may leverage the Vicarius tool to perform unauthorized remote management or control operations on compromised systems, potentially exfiltrating data or altering configurations for malicious purposes. Relevant MITRE ATT&CK tactic is Command and Control (TA0011), with technique ID T1219 (Remote Access Tools).

  Primary telemetry sources include Windows file event logs, specifically monitoring for file activity related to 'TopiaTrace.log', 'Topia.config', 'topiaInstaller.log', and 'topiad.exe'. If this activity is malicious, it could indicate escalated privileges or unauthorized persistence within the environment. Importantly, this detection does NOT confirm the presence of a compromise or malicious activity on its own, as the tool may be used legitimately by administrators.

  ### Investigation Steps

  - **Check file access activity:** Review Windows Security Event ID 4663 for file access attempts on 'C:\Program Files\Vicarius\Topia\*.log' or '*.config' to identify user accounts performing these actions. Compare access times with other activities to establish a timeline.

  - **Identify process execution:** Lookup Windows Security Event ID 4688 or Sysmon Event ID 1 for execution of 'topiad.exe'. Confirm if the process was launched by a legitimate user or application; unexpected execution may indicate a compromised state.

  - **Examine changes to configuration files:** Investigate modifications to 'C:\Program Files\Vicarius\Topia\Topia.config' for unusual entries or changes. Document differences and identify if they correlate with known benign changes made by system administrators.

  - **Review legitimate usage patterns:** Determine if documented organizational use of the Vicarius tool aligns with the observed activity. Confirm expected users, times, and frequency of access operations to distinguish between benign and suspicious activity.

  - **Correlate with network traffic:** Check network logs (e.g., firewall logs) for unusual outbound connections during the times associated with the Vicarius file activity. Look for signs of communication with known malicious IP addresses or domains.

  ### Prioritization

  This alert carries a medium severity level due to the potential risk of unauthorized remote management operations, which could lead to escalated privileges and system compromise. The likelihood of malicious abuse exists as the behavior aligns with common tactics employed by adversaries to maintain presence in the environment. However, legitimate uses of the tool reduce the overall urgency for immediate remediation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of file event logging, which must be enabled for complete visibility. Adversaries may use process obfuscation or alternate methods to hide their tools, potentially circumventing detection. Legitimate administrative tasks by IT personnel using the Vicarius tool may trigger this alert. A related detection to reinforce coverage would be monitoring for unusual process changes via Sysmon, specifically focusing on parent-child relationships and command line arguments to detect unauthorized execution paths.

