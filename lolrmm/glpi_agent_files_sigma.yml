note: |
  ### Technical Context

  This rule detects file activity associated with the GLPI Agent remote monitoring and management (RMM) tool. Malicious actors may utilize GLPI Agent functionality for unauthorized access or persistence on endpoints by manipulating system configuration through the execution of agent files. This activity aligns with the MITRE ATT&CK tactic of "Command and Control" (TA0011) and the technique "Application Layer Protocol" (T1219).

  The primary telemetry source for this detection consists of file event logs from Windows systems, particularly concerning operations involving the GLPI Agent's executables and configuration files. If malicious, this behavior could lead to unauthorized access or leakage of sensitive system information. Importantly, this detection does not verify the intent behind the GLPI Agent activity; legitimate configurations or operations may also trigger the alert.

  ### Investigation Steps

  - **Review file activity logs**: Query Windows file event logs (Event ID 4663) for accesses to GLPI Agent binaries, specifically focusing on 'C:\Program Files\GLPI-Agent\perl\bin\*'. Validate if multiple access attempts correlate with typical operational patterns.

  - **Verify agent configuration**: Check the 'C:\Program Files\GLPI-Agent\etc\agent.cfg' file. Legitimate configurations include pre-defined settings for network communication and service management. Alterations in this file should be assessed for unusual parameters.

  - **Analyze log entries**: Investigate 'C:\Program Files\GLPI-Agent\logs\glpi-agent.log' for unusual entries, such as unexpected source IP addresses or commands that deviate from normal usage patterns.

  - **Correlate with other events**: Look for related events (e.g., PowerShell execution – Event ID 4104) around the same times as the rule's detections, as malicious actors may leverage legit scripts to execute GLPI Agent operations.

  - **Identify common benign usage**: Document expected usage scenarios for GLPI Agent, such as regular inventory tasks or updates. Contrast these against the observed activity to determine potential malicious intent.

  ### Prioritization

  This alert has medium severity in an enterprise context. The impact depends on the system affected; RMM tools accessing sensitive systems could be exploited by adversaries. The likelihood of abuse is significant, especially considering the tool's capabilities in manipulating system configurations and possibly establishing persistence.

  ### Blind Spots and Assumptions

  This detection may miss activity if the GLPI Agent's execution is obfuscated or runs under different contexts (e.g., as a scheduled task). Reliable detection requires proper configuration of the Windows file system audit policy to capture all relevant file events. Legitimate internal IT management might execute the GLPI Agent frequently, resulting in false positives. Complementary detections for unusual PowerShell commands (T1059.001) would enhance coverage of a potential adversary's weaponization efforts.

