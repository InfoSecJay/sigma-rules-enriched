note: |
  ### Technical Context

  This Sigma rule detects potentially malicious file activity related to the GLPI Agent Remote Monitoring and Management (RMM) tool, indicative of unauthorized behavior or exploitation. The attacker may aim to leverage the GLPI Agent to gain persistent access or execute unauthorized commands on targeted systems, which could lead to data exfiltration or lateral movement within the network. The relevant MITRE ATT&CK tactic is Execution, with the technique ID T1219 (Remote Access Software).

  Primary telemetry sources include Windows File Event logs, especially focusing on file creation or modification events within the GLPI Agent directories. Malicious activity could result in significant compromise of IT assets, as the GLPI Agent can facilitate remote control and management of devices. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of the GLPI Agent may trigger similar alerts.

  ### Investigation Steps

  - **Identify unauthorized file activity**: Review Windows Security Event ID 4663 to examine file modification logs for entries targeting `C:\Program Files\GLPI-Agent\*`. Look for unusual user accounts or processes that do not correspond to normal GLPI Agent operations.

  - **Check GLPI Agent service status**: Investigate the status of the GLPI Agent service using `Get-Service` in PowerShell. A legitimate service should show as running and be linked to known service accounts rather than unexpected user accounts.

  - **Review log patterns**: Analyze the log file written to `C:\Program Files\GLPI-Agent\logs\glpi-agent.log` for abnormal patterns or unexpected entries, such as error messages that diverge from normal operational behavior or entries related to unauthorized access attempts.

  - **Correlate with network communications**: Inspect Firewall logs (Event ID 5156) for outbound connections initiated from the GLPI Agent files, particularly unusual protocols or destinations not typical for IT asset management communications.

  - **Validate legitimate GLPI Agent activity**: Compare timestamps of alerts against known scheduled tasks that may invoke legitimate GLPI processes, confirming that expected operations match operational hours and context within the organization.

  - **Identify high-confidence malicious indicators**: Look for processes like the execution of `perl.exe` or `wperl.exe` inside the GLPI Agent folder with unusual command-line arguments indicative of exploitation attempts, such as scripts that introduce persistence or remote execution.

  ### Prioritization

  This alert is rated medium severity due to the potential impact of the GLPI Agent if misused in an enterprise context. While the likelihood of malicious abuse exists, it largely depends on the wider context of GLPI Agent deployment across the organization. Such behavior, although potentially a risk, is less commonly weaponized compared to other attack vectors.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as renaming GLPI Agent executables or executing scripts from legitimate user contexts. Reliable detection requires comprehensive logging from both file events and service manipulations. Legitimate administrative actions, such as scheduled agent updates or maintenance, may trigger false positives. A related detection to consider includes monitoring for unusual outbound network traffic from GLPI Agent file paths to enhance coverage of potential exploitation.

