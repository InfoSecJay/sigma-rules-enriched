note: |
  ### Technical Context

  This rule detects file activity involving the GLPI Agent remote monitoring and management (RMM) tool, which is used for asset management and environment monitoring in enterprise networks. An attacker may leverage this tool’s capabilities to exfiltrate sensitive information or manipulate system configurations for unauthorized access or persistence. The relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Remote System Discovery (T1219).

  Primary telemetry sources include Windows file event logs, specifically targeting the file paths associated with the GLPI Agent executables, configurations, and logs. If malicious, the security impact may involve unauthorized information access or disruptions to service management. This detection does NOT confirm malicious intent on its own, as legitimate use of GLPI Agent can trigger similar alerts.

  ### Investigation Steps

  - **Check file access logs:**
  Review Windows Security Event ID 4663 to identify which users or processes accessed the GLPI Agent files. Look for unusual user accounts or service accounts not typically associated with asset management tasks.

  - **Evaluate service activity:**
  Investigate Security Event ID 7045 for the creation of the GLPI Agent service. A sudden change or creation of this service by unexpected accounts could indicate malicious manipulation.

  - **Analyze GLPI Agent logs:**
  Examine the contents of `C:\Program Files\GLPI-Agent\logs\glpi-agent.log` for suspicious activity or errors that deviate from normal operational behavior, which could indicate tampering or abuse.

  - **Identify legitimate usage patterns:**
  Consider whether the event coincides with expected IT operations, such as the installation of software or scheduled maintenance, particularly from known administrative accounts.

  - **Search for known malicious indicators:**
  Look for specific command-line arguments or any unusual parameters used with the GLPI executables that deviate from normal operation. Check for PowerShell commands or shell scripts being executed alongside the agent.

  - **Assess file modification times:**
  Identify any recent modification times of files within `C:\Program Files\GLPI-Agent\var\` or `C:\Program Files\GLPI-Agent\etc\` using the Windows File Create Time (UTC). Unexpected changes can indicate lateral movement or an exploit attempt.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems managed by the GLPI Agent. While it may indicate malicious usage, benign configurations and legitimate activities can also trigger it. Monitoring for this kind of behavior is essential due to its association with command and control tactics, which could be weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations exist as attackers may use filename obfuscation or modify agent configuration files without triggering immediate alerts. It is important to have comprehensive logging enabled across all endpoints that utilize the GLPI agent for reliable detection. Legitimate administrative activities such as maintenance scripts or software updates can also generate alerts. Related detections include monitoring for unusual network traffic patterns involving GLPI Agent endpoints, which can enhance visibility into potential C2 communications.

