note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the GotoHTTP remote management tool. Attackers may use GotoHTTP in their Command-and-Control (C2) operations to maintain persistence or gather information from compromised systems. The relevant MITRE ATT&CK tactics include Command and Control (T1071) and Remote Desktop Protocol (T1219).

  The primary telemetry sources include Windows network connection event logs. Specifically, this detection relies on network traffic data that indicates connections to domains ending with '*.gotohttp.com'. If malicious, the security impact could include unauthorized access, data exfiltration, or manipulation of systems under the attacker's control. However, this detection alone does NOT confirm malicious activity since GotoHTTP could also be used for legitimate remote administration.

  ### Investigation Steps

  - **Check connection logs:** Review Windows network connection logs (Event ID 5156) for ingress and egress traffic to 'gotohttp.com' or related domains. Confirm the timestamp aligns with the alert.

  - **Identify process owner:** Investigate the process responsible for the connection using the command line (CMD) or PowerShell commands. Check Event ID 4688 logs for process creation events involved around the same time the connection was initiated.

  - **Review application usage:** Validate if the impacted endpoint has documented legitimate use of GotoHTTP for remote management by checking asset inventory or user access policies. Confirm authorized users are accessing the tool.

  - **Assess anomalous behavior:** Look for abnormal outbound traffic patterns, such as unexpected data volumes or unusual protocols used with the connection. This can help differentiate between benign and potentially malicious usage.

  - **Search for follow-on actions:** Check for subsequent connections to known C2 IP addresses or domains after the initial GotoHTTP connection. Monitor for Event ID 5156 logs for any unusual outgoing traffic post-notice.

  - **Cross-reference telemetry:** Utilize threat intelligence feeds to determine if the GotoHTTP connection correlates with known incidents or threat actors. Correlate it with other detections such as unusual administrative access or lateral movement indicators.

  ### Prioritization

  This alert is of medium severity in an enterprise context because GotoHTTP is a legitimate tool that can also be exploited by adversaries. Organizations should prioritize investigations based on the criticality of the affected systems and the presence of other indicators of compromise. This behavior could be weaponized but should be contextualized with owner's intent and associated activity logs.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from legitimate administrative use of GotoHTTP, especially in environments where it is sanctioned for support. Reliable detection requires comprehensive logging of outbound traffic and correlated process activity. Legitimate activities that may trigger this alert involve sysadmins using GotoHTTP for authorized remote access. A related detection that strengthens coverage includes monitoring for abnormal login attempts or remote access sessions that occur after GotoHTTP usage.

