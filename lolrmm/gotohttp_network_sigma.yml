  ---

  ### Technical Context

  This rule detects outbound network connections to GotoHTTP domain, indicative of potential use of the GotoHTTP Remote Management Tool (RMM), which may be leveraged by adversaries for remote access or surveillance. The attacker’s objective is likely to maintain persistence or establish remote control over compromised systems, aligning with the MITRE ATT&CK technique T1219 (Remote Access Software). Primary telemetry sources include Windows network connection logs, specifying the DestinationHostname field. If malicious, this behavior may lead to unauthorized access and operational disruptions. Importantly, this detection does NOT confirm malicious intent without corroborating evidence of unauthorized access or telemetry indicating exploitation phases.

  ---

  ### Investigation Steps

  - **Check for connections to GotoHTTP domains:** Review network connection logs for outbound connections to `gotohttp.com` or subdomains. Look for Event ID 5156 (Windows Filtering Platform) with `DestinationHostname` set to `gotohttp.com` or `*.gotohttp.com`.

  - **Validate process initiation:** Investigate the parent process of the detected connections. Use Security Event ID 4688 or Sysmon Event ID 1 to trace which process established the connection, ensuring it is not a legitimate application like IT management software.

  - **Review known good use cases:** Document legitimate use of GotoHTTP by internal teams. Check for authorized IP ranges or user agents that align with expected behaviors around remote administration tasks to validate bonafide usage.

  - **Identify high-confidence malicious indicators:** Look for abnormal frequency or timing patterns in connections to GotoHTTP servers, especially from non-admin or unexpected hosts. Unusual connections may suggest malicious use, correlating with anomalous behavior or prior alerts.

  - **Assess asset criticality:** Prioritize investigations based on the affected host's role (e.g., domain controllers, file servers) and the potential impact of unauthorized remote access on critical business functions.

  - **Check for additional communication indicators:** Look for related outbound connections to known malicious IPs or domains using threat intelligence feeds for remediation of broader campaign-related activity.

  ---

  ### Prioritization

  This alert holds medium severity based on the likelihood of malicious abuse considering GotoHTTP's use in both legitimate and nefarious contexts. The potential impact increases significantly if the affected system is critical to operations, as unauthorized access through RMM tools can lead to data breaches or operational disruptions.

  ---

  ### Blind Spots and Assumptions

  Detection may miss variations in domain names or IP obfuscation techniques used by adversaries. Reliable detection necessitates comprehensive logging configurations for networking events, endpoint activities, and potential user action on target systems. Legitimate uses of GotoHTTP by internal users may trigger alerts; it's vital to correlate alerts with user activity logs. A companion detection could include monitoring for RDP or other remote access tool activity to provide a more holistic view of remote control attempts.

