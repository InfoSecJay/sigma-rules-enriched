note: |
  ### Technical Context

  This rule detects network connections to the GotoHTTP RMM tool, which is often utilized by adversaries for remote management and control purposes. The likely goal of the attacker is to maintain persistence on compromised systems, gather information, or execute commands remotely. The relevant MITRE ATT&CK tactics involved are Command and Control (TA0011) and the technique T1219 (Remote Access Software). The primary telemetry source is Windows network connection logs, specifically monitoring the `DestinationHostname` field for requests directed at GotoHTTP domains.

  If malicious, the security impact could include unauthorized remote access, data theft, or deployment of additional malicious payloads. However, this detection does NOT confirm that the activity is malicious on its own, as GotoHTTP may also be used for legitimate IT support activities.

  ### Investigation Steps

  - **Verify network connection details**: Review the Windows network connection logs (Event ID 5156) for connections originating from internal IP addresses to `gotohttp.com` domains. Compare source IPs with known asset databases to identify legitimacy.

  - **Identify recent changes**: Check for any recent software installations or updates on affected systems that could justify legitimate use of GotoHTTP (e.g., IT support tickets or asset management records indicating planned usage).

  - **Assess endpoint role**: Determine if the involved asset is a critical system (e.g., web server, database) where unauthorized remote access poses a higher risk. Review endpoint security logs (Event ID 4688, Sysmon Event ID 1) for any recently executed processes that may relate to the GotoHTTP tool.

  - **Look for high-confidence malicious indicators**: Correlate the connection with additional telemetry, such as process creation events from Sysmon (Event ID 1) or firewall logs revealing unusual outbound traffic patterns targeting GotoHTTP domains.

  - **Evaluate user behavior**: Analyze user access logs to see if users have typical remote management processes in place. Look for unusually high volumes of outbound connections that exceed normal usage patterns.

  - **Correlate with other detections**: Validate recent alerts related to anomalous remote access activities that may provide context and support the investigation. Cross-reference with other Command and Control detections to assess the broader threat scope.

  ### Prioritization

  This alert has a medium severity due to the potential impact on critical systems if unauthorized access is confirmed. The likelihood of malicious exploitation is moderate, as GotoHTTP tools are known for their use in remote administration; however, many legitimate entities may also employ them for IT support.

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers utilize customized domains or proxies to mask GotoHTTP traffic. Reliable detection requires continuous logging of outgoing network requests and ensuring configurations capture DNS queries. Legitimate activities, such as IT support teams using GotoHTTP for remote access, may trigger the alert. A related detection could include monitoring for unusual process creation or command execution on endpoints that correspond to this type of remote access.

