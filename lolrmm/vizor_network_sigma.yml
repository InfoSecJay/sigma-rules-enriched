note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the VIZOR Remote Monitoring and Management (RMM) tool, which could indicate a legitimate administrative action or potentially malicious activity. The likely attacker objective would involve leveraging this tool for remote access to compromised systems within an enterprise environment. This behavior correlates with the MITRE ATT&CK framework, specifically under the tactic of Command and Control (T1071.001) and the technique for Remote Access Tools (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, and the required log types feature details such as destination hostnames, timestamps, and possibly user context. If the activity is malicious, it could allow unauthorized access or control over affected systems, leading to data exfiltration or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent on its own, as VIZOR might be in legitimate use by administrative personnel.

  ### Investigation Steps

  - **Review recent outbound connections:** Check Windows Security Event logs (Event ID 5156) to confirm any recent outbound traffic to the domains matching 'vector-networks.com' or 'vizor.cloud.' Look for unusual hosts or patterns outside of typical operational usage.

  - **Identify legitimate VIZOR usage:** Compare the detected activity against known schedules or workflows of IT staff. Verify if authorized personnel have a reason to use VIZOR around the time the alert fired.

  - **Assess user context and privileges:** Review the user accounts associated with the network connections, checking for administrative privileges (Event ID 4672, "Special Logon"). This can help distinguish benign activity by trusted users from potential misuse by compromised accounts.

  - **Inspect additional related telemetry:** If available, search for Sysmon logs (Event ID 3) for process creation events following the network connections. Look for any suspicious processes or command-line arguments that would indicate misuse of the RMM tool.

  - **Correlate with threat intelligence:** Check if the observed connections have been flagged by threat intelligence sources as associated with malicious activities. Look for information on command and control patterns linked with unauthorized uses of the RMM tool.

  ### Prioritization

  This alert should be considered of medium severity due to its potential impact on the security posture of critical systems when remote management tools are misused. The likelihood of malicious abuse is moderate, particularly in environments where administrative access is present. Remote management tools like VIZOR are often weaponized for maintaining persistence in compromised networks.

  ### Blind Spots and Assumptions

  Detection is limited by the reliance on network logs; intentional obfuscation by an adversary (e.g., using VPNs or tunneling) may bypass this detection. Proper logging configurations, including real-time monitoring of all outbound connections, are essential for effective detection. Legitimate usage scenarios include remote IT support sessions or software updates performed by IT administrators. Related detections that could strengthen coverage would involve alerts on unauthorized software installation activities (T1218.011) to capture additional evidence of potential misuse.

