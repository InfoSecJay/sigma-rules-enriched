note: |
  ### Technical Context

  This detection identifies network activity associated with the VIZOR Remote Monitoring and Management (RMM) tool, indicating that a device may be communicating with known VIZOR infrastructure. The primary objective of an attacker using this tool could be to gain remote access or control over compromised systems, potentially leveraging it for reconnaissance or further exploitation. This behavior pertains to the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219).

  The primary telemetry sources include network connection logs, particularly those that capture destination IP addresses and hostnames. If this activity is malicious, it could lead to unauthorized access, data exfiltration, or lateral movement within the network. It's important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of VIZOR RMM by authorized personnel may trigger the alert.

  ### Investigation Steps

  - **Review network connection logs:** Inspect Windows Event ID 5156 for outbound connections to the domains: 'vizor.cloud', 'vector-networks.com', and 'metaquest.com'. Verify if the connections are initiated by legitimate users or services in the environment.

  - **Check for known user permissions:** Confirm if users or systems initiating connections to the identified domains have legitimate access to VIZOR for administrative tasks. Cross-reference against an established list of approved tools and required roles.

  - **Identify high-confidence malicious indicators:** Look for indicators of compromise (IOCs) such as unusual spikes in traffic or connections to these domains outside business hours or from unexpected hosts.

  - **Analyze associated processes:** For any detected connections, review Windows Event ID 4688 (Process Creation) to correlate which processes are initiating the connections. Legitimate usage will typically involve the VIZOR executable or administrative tools (e.g., PsExec) being used appropriately.

  - **Validate account activity:** Review audit logs for user logons and session activity (Event ID 4624) before and after the detected network connection to correlate legitimate account actions with the observed behavior.

  ### Prioritization

  This alert carries a medium severity rating due to the potential for malicious abuse in compromised environments. The impact of affected systems can be significant if VIZOR is misused for unauthorized access or control. While the legitimate use of RMM tools is common, any anomalous usage warrants timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if log sources are misconfigured or if the RMM tool is being used opportunistically within the network to bypass normal security measures. Additionally, legitimate administrative activities may trigger this alert if authorized personnel use VIZOR tools. Consider implementing companion detections around anomalous process behaviors or unusual access times to bolster overall visibility on RMM tool usage.

