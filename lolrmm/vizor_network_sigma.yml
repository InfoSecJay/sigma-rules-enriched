note: |
  ### Technical Context

  This rule detects network connections potentially related to the VIZOR Remote Monitoring and Management (RMM) tool, particularly when targeting specific domains associated with VIZOR functionalities. The likely attacker objective is to gain unauthorized remote control and manage systems within the network, typically part of a post-exploitation phase once a foothold has been established. Relevant MITRE ATT&CK Tactics include **Execution** (TA0002) and Technique **Remote Services** (T1219).

  The primary telemetry sources for this detection are Windows network connection logs, specifically monitoring DNS queries or connection attempts to the specified destination hostnames. If malicious, this behavior could lead to unauthorized access to sensitive systems, data exfiltration, or further compromise of the network's integrity. It is essential to note that this detection does NOT confirm that VIZOR is being used maliciously; it could also indicate legitimate use.

  ### Investigation Steps

  - **Review outbound connections:** Check logs for Security Event ID 5156 (Windows Filtering Platform) to identify outbound connections matching domains like `vizor.cloud`. Note the process names and user accounts making these connections to determine if they are legitimate or potentially malicious.

  - **Identify expected legitimate activity:** Validate if there are documented and authorized use cases for VIZOR RMM within the organization. Analyze timestamps of connections made to the VIZOR domains against known scheduling or maintenance windows.

  - **Analyze connection patterns:** Cross-reference the destination IP addresses from the network logs against threat intelligence sources to identify known malicious infrastructure. Focus on unusual or unexpected destination IPs that deviate from normal usage patterns.

  - **Correlate with process execution:** Look for Process Creation events (Security Event ID 4688) on source endpoints initiating connections to VIZOR domains. Identify if the processes are legitimate (e.g., IT management tools) or potentially indicative of a malicious actor.

  - **Examine user activity:** Investigate the user accounts associated with these network connections for anomalies, such as unauthorized users gaining access to administrator accounts or unusual login times.

  - **Identify remediation measures:** If malicious use is confirmed, document findings and work on isolating affected systems, eliminating unauthorized access, and conducting a wider security assessment as needed.

  ### Prioritization

  This alert is of **medium severity** as it involves potential access to sensitive systems via VIZOR RMM. The likelihood of malicious abuse is moderate since RMM tools can be weaponized for unauthorized control. However, the alert could also flag legitimate administrative tasks, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection is limited to specific destination hostnames; therefore, variations in domain names or IP address obfuscation may evade detection. The rule relies on accurate logging of outbound network traffic, which may be misconfigured or incomplete. Legitimate activities, such as authorized IT support tasks, may trigger this alert. Related detections could include monitoring for other known RMM tools to enhance coverage against unauthorized remote access activities.

