note: |
  ### Technical Context
  This rule detects the execution of processes associated with the SunLogin Remote Management and Monitoring (RMM) tool. SunLogin is a legitimate remote access software that can be misused by threat actors for unauthorized access to systems, data exfiltration, and maintaining persistent access to compromised hosts. The detection is particularly relevant in scenarios where attackers leverage remote access tools typically used in remote support to move laterally within networks or access sensitive information.

  The primary MITRE ATT&CK tactics relevant to this detection are **Execution** (TA0002) and **Remote Access Software** (T1219), as the rule specifically identifies the running of processes known to be associated with remote access capabilities. The main objective of attackers using SunLogin is to establish control over target systems, bypassing traditional security mechanisms to maintain presence undetected.

  The main source of relevant telemetry for this detection includes process creation logs from Windows operating systems, which track when and how processes are initiated and which parent processes are involved.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for instances of `OrayRemoteShell.exe`, `OrayRemoteService.exe`, or any `sunlogin*.exe` files to verify the context in which these processes were started.
  - **Analyze Parent Process Involvement:** Investigate the parent processes associated with the detections to ascertain if they originate from known legitimate software or if illegitimate escalation paths could be involved.
  - **Correlate with User Activity:** Check for unusual user activity logs to understand if the accounts running the detected processes have a legitimate reason for using SunLogin, looking specifically for suspicious or unusual logins.
  - **Assess Network Connections:** Evaluate network logs or firewall records for outbound connections initiated by the detected SunLogin processes to identify potential command and control communications.

  ### Prioritization
  The severity of this alert is considered medium as while the presence of SunLogin in an environment can be legitimate, its use by unauthorized actors poses a significant risk to organizational security. If confirmed, it warrants immediate investigation due to the potential for malicious action.

  ### Blind Spots and Assumptions
  This detection has a known gap in coverage as it may not account for instances where the SunLogin tool is executed with modified file names or moved to different directories, thus evading this detection rule. The detection logic assumes that there are no alternative legitimate uses in the environment; therefore, organizations should ensure that processes known to run under normal operational conditions are documented. Additionally, adequate logging configuration for process creation events on Windows systems is required for this alert to function effectively.

