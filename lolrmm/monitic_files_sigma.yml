note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Monitic RMM (Remote Monitoring and Management) tool, specifically the creation or modification of files indicative of its installation or operation. The likely attacker objective would be to deploy Monitic for unauthorized monitoring or control over a system. This detection aligns with the **Execution** tactic (T1203) within the MITRE ATT&CK framework, as attackers may use such RMM tools to maintain persistence or conduct reconnaissance.

  Relevant telemetry sources include file event logs from Windows, with a focus on event types that capture file creation and modification actions. The security impact of this detection is significant; if malicious, it may indicate unauthorized access or exploitation of administrative capabilities. However, it is essential to note that this detection does not, on its own, confirm malicious intent since Monitic can be used legitimately.

  ### Investigation Steps

  - **Identify File Creation Events**: Check for Windows file event logs (Event ID 4663) related to the following files: `C:\Program Files\Monitic\agent.exe`, `C:\Program Files\Monitic\amon.exe`, and `C:\Program Files\Monitic\conf.json`. Legitimate installations should occur during controlled maintenance windows.

  - **Analyze Execution Context**: Review process creation logs (Sysmon Event ID 1) where the Monitic executables were triggered. Look for unusual parent processes or command-line arguments that may suggest unexpected behavior.

  - **Examine User Accounts**: Verify which user account executed the Monitic installer (e.g., `%USERPROFILE%\Desktop\MoniticInstaller.exe`). Legitimate user accounts within operational departments will typically initiate these actions; anomalies may indicate a compromise.

  - **Cross-reference with Network Activity**: Review network logs for outbound connections made by Monitic executables to known C2 servers or unusual IP addresses. Use firewall logs or network flow data (port/protocol + destination) to spot suspicious behavior.

  - **Verify Related Artifacts**: Check the TEMP directory for the presence of temporary installation scripts or executables (e.g., `%TEMP%\*\agent_installer.bat`). Presence of these artifacts alongside Monitic executables without explicit management actions suggests potential exploitation.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for unauthorized system access and control associated with RMM tools. While the risk of exploitation is tangible, the presence of Monitic alone does not inherently imply malicious use, as it can be utilized for legitimate administrative tasks.

  ### Blind Spots and Assumptions

  This detection may miss instances where the tool is used but not in the monitored directory paths or files, indicating a possible evasion technique. Reliable detection requires the assurance that appropriate file event logging is enabled on Windows systems. Additionally, legitimate IT management or audit processes may trigger this alert, such as routine updates or configuration changes. Companion detections related to remote access tools, such as monitoring unusual usage of RDP or PowerShell invocation (T1086), can help strengthen this coverage.

