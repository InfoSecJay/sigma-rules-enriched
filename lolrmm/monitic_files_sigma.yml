note: |
  ### Technical Context

  This rule detects file activities related to the Monitic RMM tool, specifically focusing on processes and configuration files that indicate potential usage of remote monitoring and management functionalities. The likely attacker objective could be to maintain unauthorized access to systems, facilitate data exfiltration, or manipulate operations. Relevant MITRE ATT&CK tactics and techniques include: Command and Control (T1102) and Remote Services (T1219).

  Primary telemetry sources include Windows File Event logs that capture activities on specific executable files and configuration files associated with Monitic. If malicious, the security impact is significant, as the use of RMM tools by unauthorized entities can lead to full system compromise or network infiltration. However, it is essential to note that this detection does NOT confirm unauthorized access or nefarious activity on its own, as legitimate use cases exist for Monitic.

  ### Investigation Steps

  - **Identify Executable Activity:**
    Check for Security Event ID 4663 (File Access) specifically related to `'C:\Program Files\Monitic\agent.exe'` or `'amon.exe'`. Confirm if these events correspond to legitimate user accounts or unexpected service accounts.

  - **Review Configuration Changes:**
    Examine for modifications in the configuration file located at `'C:\Program Files\Monitic\conf.json'`. Validate expected changes that align with administrative activities versus sudden, unexplained alterations.

  - **Assess Event Correlation:**
    Look for correlated events, such as Process Creation (Event ID 4688) indicating that `agent.exe` or `amon.exe` was executed by suspicious user accounts, especially if accompanied by anomalous network connections.

  - **Determine Legitimate Use:**
    Assess whether the detected files have legitimate usage patterns. Document known use cases or authorized access patterns for Monitic within the organization to differentiate benign activities from potential threats.

  - **Monitor for Data Exfiltration:**
    Validate if there are subsequent outbound connections related to Monitic processes, utilizing Network logs or Firewall logs for unusual data transfers, particularly to external IP addresses not previously associated with Monitic operations.

  ### Prioritization

  This alert is of medium severity due to its potential to indicate a compromised system utilizing an RMM tool for command and control. The affected systems’ importance and the possibility of abuse by adversaries increase the urgency of a thorough investigation. The behavior detected is notably weaponized in environments where remote access tools are prohibited or monitored.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate Monitic usage to trigger false positives. Reliable detection requires accurate logging configurations, particularly within Windows File Event logs. False positives may stem from authorized IT administrative activities leveraging Monitic. A related detection that enhances coverage is monitoring for non-standard outbound connections tied to processes associated with RMM tools.

