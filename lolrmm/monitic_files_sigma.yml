note: |
  ### Technical Context

  This rule detects file activity related to the Monitic Remote Monitoring and Management (RMM) tool, specifically focusing on executable files and configuration files commonly associated with its deployment. The likely attacker objective could include remote access and control over compromised systems, exfiltration of data, or lateral movement within the network. This detection aligns with the MITRE ATT&CK technique for Command and Control (T1219).

  The primary telemetry sources are Windows file event logs, particularly focusing on changes or access to specific file paths where Monitic components reside or may be executed. Should these files be maliciously exploited, the security impact could involve unauthorized system control, data theft, or ransomware deployment. Notably, this detection does NOT confirm malicious intent on its own, as legitimate use of Monitic can trigger the same file activity.

  ### Investigation Steps

  - **Check file paths and processes**: Investigate Windows Event ID 4663 for successful file access or modification of key Monitic files located in `C:\Program Files\Monitic\`, `%USERPROFILE%\Desktop\MoniticInstaller.exe`, and `%TEMP%\*\agent_installer.bat`. Look for unusual process creation stemming from these modifications.

  - **Review process creation details**: Assess Security Event ID 4688 or Sysmon Event ID 1 for process creation events where the parent process is `explorer.exe` or a script engine (e.g., PowerShell) executing scripts related to Monitic installation files. Analyze parent-child relationships for signs of process injection or execution impersonating legitimate systems.

  - **Confirm expected legitimate behavior**: Scenarios where Monitic is legitimately used should show controlled installation activity, with direct user interaction and success messages from installation logs. Verify installation sources or known good images to correlate with detected files.

  - **Identify known malicious indicators**: Look for file hashes of `amon.exe` or `agent.exe` that match known malware signatures in Threat Intelligence databases. Validate their origins and file metadata for discrepancies in digital signatures.

  - **Assess system context and asset criticality**: Identify the role of affected systems to understand the potential impact. For example, if Monitic files are found on a critical server (e.g., a database server), it raises the severity and urgency of the alert.

  - **Examine network activity for C2 communications**: If possible, leverage endpoint detection and response (EDR) tools or network logs (e.g., firewall logs) to check for outbound connections that might indicate command and control communication initiated from Monitic-related processes.

  ### Prioritization

  The alert's severity is medium due to the potential for an attacker to exploit Monitic for unauthorized control, especially on critical assets. However, this behavior is less common in initial attack vectors, as attackers may prioritize stealthier remote access tools.

  ### Blind Spots and Assumptions

  Detection may be limited if basic logging features are not enabled on Windows, particularly for file auditing. Adversaries may employ file renaming or obfuscation techniques to bypass detection. Authorized administrative user activities, such as updates or maintenance using Monitic, can trigger alerts. Companion detection involving unusual outbound network traffic from established Monitic processes can strengthen coverage against potential malicious exploitation.

