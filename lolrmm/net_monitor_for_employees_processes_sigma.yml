note: |
  ### Technical Context

  This rule detects processes associated with the Net Monitor for Employees (RMM) tool, a remote monitor software typically used for observing user activity on managed devices. Attackers may use such software for reconnaissance, preparing for lateral movement, or exfiltrating sensitive information without detection. The relevant MITRE ATT&CK technique is **T1219 - Remote Access Software**, which represents the use of tools like RMM for unauthorized access or monitoring.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688. If exploited maliciously, it could lead to unauthorized monitoring or control of user activities, compromising sensitive data. However, this detection does NOT confirm malicious intent or activity on its own, as the tool can also be used legitimately by administrators.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for any instances where the images `nmep_agtconfig.exe`, `nmep_ctrlagent.exe`, `nmep_ctrlagentsvc.exe`, `winpty-agent.exe`, or `winpty-agent64.exe` appear. Determine if the processes were run by a known administrative account or a user account with elevated privileges.

  - **Investigate parent processes:** Analyze parent processes in associated events. Legitimate use may involve parent processes such as a known administrative console or scheduled task. Any unexpected or unauthorized parent process could indicate malicious activity.

  - **Collect additional telemetry:** Gather Sysmon Event ID 1 logs to capture command-line parameters and network connection details that may accompany the RMM tool execution. Look for unusual command lines which may indicate misuse.

  - **Establish context for alerts:** Document the asset role and whether the device is intended to run monitoring software. A desktop in a user environment may not typically have RMM software executing, while a server designated for remote management might.

  - **Check network traffic:** Review firewall logs for outgoing or incoming connections from the detected processes, specifically looking for unexpected external IP addresses or high-frequency connections that deviate from known baselines.

  - **Flag high-confidence indicators:** Look for multiple instances of these processes executing in rapid succession, especially if they are launching under user accounts not typically associated with system administration tasks.

  ### Prioritization

  This alert holds medium severity due to its potential impact on sensitive employee activity monitoring. The likelihood of malicious usage is moderate, as RMM tools are often weaponized for unauthorized surveillance or data exfiltration by threat actors. While legitimate usage exists, the detection warrants further investigation, especially in atypical environments.

  ### Blind Spots and Assumptions

  Detection may be circumvented by stopping the RMM service or renaming executable files, limiting visibility into malicious actions. Ensure that logging for process creation is enabled across all endpoints for reliable detection. Legitimate uses include IT administrators conducting routine checks, which can result in false positives. A companion detection to consider is monitoring for unusual user account behavior that correlates with the execution of these processes, enhancing the context around potentially malicious activity.

