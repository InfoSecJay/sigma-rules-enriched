note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Parallels Access remote management tool. The behavior suggests that an adversary may be leveraging this tool to maintain persistent access or execute commands on a compromised system. This detection aligns with the MITRE ATT&CK technique for Remote Services (T1219), which includes the use of remote access tools to facilitate control over victim machines.

  Primary telemetry source includes Windows process creation events, specifically focusing on Event ID 4688 and Sysmon Event ID 1. If malicious, the use of Parallels Access could allow the attacker to gain unauthorized control, exfiltrate data, or deploy further malicious payloads. It is important to note that this detection does NOT confirm malicious intent on its own, as Parallels Access may also be used legitimately for remote desktop support.

  ### Investigation Steps

  - **Review Process Creation Logs**: Analyze Windows Security Event ID 4688 and Sysmon Event ID 1 for the execution of processes such as `parallelsaccess-*.exe`, `TSClient.exe`, or `prl_deskctl_agent.exe`. Compare timestamps with user activity and legitimate access requests.

  - **Validate Parent Process Context**: Check the parent process of detected executables. If the parent process is unexpected or identified as malicious (e.g., if initiated from a non-administrative user context or atypical application), it may indicate compromise.

  - **Conduct a User Activity Audit**: Review relevant user logs to confirm legitimate user actions during the time of detection. A high-frequency usage pattern of Parallels Access by the same user could indicate benign usage.

  - **Analyze Network Connections**: Investigate outbound network connections associated with detected processes. Check for unusual connections to external IPs through tools like PowerShell’s Get-NetTCPConnection, focusing on potential data exfiltration attempts.

  - **Correlate with System Changes**: Look for any changes in system configurations or file modifications during the time of process activity. Corresponding Event ID 4616 (system time change) or Event ID 5145 (file share access and modifications) could reveal further anomalies.

  - **Assess Asset Criticality**: Understand the role of the affected asset within the network. Higher criticality systems (e.g., domain controllers, critical database servers) should be prioritized for deeper investigation and possible isolation.

  ### Prioritization

  This alert has medium severity. The use of Parallels Access on critical systems increases the risk of unauthorized access, especially if such activity is unapproved. Given that remote access tools are frequently weaponized, timely investigation is crucial.

  ### Blind Spots and Assumptions

  Detection may be limited if the execution of Parallels Access is interspersed with legitimate activity by authorized users. Ensure logs from all relevant endpoints are configured to capture process creation events comprehensively. Legitimate remote support activities triggering this alert should be properly documented within your organization. A related detection rule for unauthorized remote desktop protocol (RDP) usage could help strengthen monitoring and coverage.

