note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Splashtop Remote Management (RMM) tool on Windows systems. The likely attacker objective involves utilizing Splashtop to maintain remote access, permitting unauthorized control and data exfiltration from the targeted system. This behavior aligns with the MITRE ATT&CK technique T1219 (Remote Access Software), which facilitates adversaries in gaining persistent remote access discreetly.

  The primary telemetry sources for detection include Windows file event logs, specifically focusing on files created or modified in designated directories related to Splashtop. If malicious, the security impact can be significant as an adversary can leverage the RMM capabilities for remote operations. This detection does NOT confirm malicious intent by itself, since legitimate administrative activities could also trigger these alerts.

  ### Investigation Steps

  - **Check file modification times:** Review the creation or modified timestamps of the following files: `C:\windows\System32\winevt\Logs\Splashtop-Splashtop Streamer-Status%4Operational.evtx` and `C:\Program Files (x86)\Splashtop\Splashtop Remote\Server\log\agent_log.txt`. Compare these timestamps with known legitimate access times based on recent user activity or scheduled maintenance windows.

  - **Identify related processes:** Investigate the execution of processes linked to Splashtop such as `SRService.exe`, `SRAgent.exe`, and `SRUtility.exe` via Security Event ID 4688. Check for unusual parent processes or command-line arguments that could indicate misuse.

  - **Correlate with user actions:** Use User Account Logon events (Security Event IDs 4624 and 4634) to determine if user activity corresponds with Splashtop activity. Legitimate sessions will often coincide with standard user logs, whereas anomalous patterns may suggest abuse.

  - **Review remote connection logs:** If applicable, check for logs indicating remote sessions initiated via Splashtop. Look for indications of unfamiliar accounts or unusual connection times that deviate from expected operational usage.

  - **Analyze log file contents:** For captured logs in `C:\Program Files (x86)\Splashtop\Splashtop Remote\Server\log\*`, extract entries for remote session activities or errors. Malicious usage might exhibit patterns of login attempts outside of normal hours.

  - **Validate file consistency:** Ensure that files such as `SRAgent.sqlite3` have not been modified unexpectedly or contain anomalous entries suggesting unauthorized changes or data exfiltration.

  ### Prioritization

  This alert is of medium severity due to the potential for significant security risks posed by remote access tools like Splashtop. The likelihood of malicious abuse is high, especially in environments where RMM tools may be leveraged by adversaries for nefarious purposes. Such behavior is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  There are limitations in detecting cases where legitimate users employ Splashtop for administrative purposes, which may lead to false positives. Reliable detection requires that file event logging is properly configured on endpoints monitoring Splashtop file locations. Additionally, legitimate IT support activities might trigger this alert during routine maintenance. A related detection rule focused on unusual authentication events in tandem with this one could enhance the overall visibility of potential compromises.

