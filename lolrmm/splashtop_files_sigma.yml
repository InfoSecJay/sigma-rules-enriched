note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Splashtop Remote Management (RMM) tool, which is often used for remote desktop access and management. Attackers may leverage this tool to gain unauthorized access to systems, allowing them to manipulate files or exfiltrate sensitive data. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) with the technique being **Remote Services** (T1219).

  The primary telemetry sources are Windows event logs focused on file events, particularly those related to specific operational logs and executable files of the Splashtop application. If the alert is genuine, the security impact could include unauthorized access or control over compromised systems, leading to data breaches or system manipulation. However, this alert does not confirm that malicious activity occurred without further context; legitimate use of Splashtop by authorized users may trigger the same events.

  ### Investigation Steps

  - **Review impacted file paths:** Check the files created or modified within `C:\Program Files (x86)\Splashtop\` and logs in `C:\windows\System32\winevt\Logs\`. Legitimate operations should occur at regular intervals and be associated with authorized user accounts.

  - **Check event logs for abnormal behavior:** Investigate Security Event ID 4624 (Logon events) around the time of file activity. Unauthorized logons may indicate malicious use of Splashtop, especially if accessed by accounts that shouldn't have remote access.

  - **Identify unauthorized user accounts:** Validate that the account executing Splashtop files belongs to a known, authorized user or service. Any unfamiliar accounts or service accounts accessing these logs could suggest a compromise.

  - **Analyze log contents for indicators of compromise:** Examine the `FTCLog.txt` and `SPLog.txt` for unusual or unauthorized commands, error messages, or IP addresses indicative of unwanted remote access attempts.

  - **Validate process behavior and parent-child relationships:** Use Sysmon Event ID 1 to track the creation of processes such as `SRService.exe` and `SRAgent.exe`. Legitimate behavior includes normal service restarts, while unexpected child processes may hint at exploitation.

  - **Monitor for file modification timestamps:** Assess the timestamps of logs in `%PROGRAMDATA%\Splashtop\Temp\log\` to identify any unusual activity patterns that deviate from expected usage during business hours.

  ### Prioritization

  This alert should be treated as medium severity in an enterprise context due to the potential impact of unauthorized remote access. The likelihood of malicious usage is significant, given the tool's functionality commonly exploited by attackers. While Splashtop has legitimate applications, its usage patterns must be closely monitored to prevent abuse.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for benign activity triggering the alert, particularly within organizations utilizing Splashtop for legitimate purposes. Reliable detection necessitates proper log configurations and access controls to differentiate between authorized use and malicious activity. Additionally, legitimate remote desktop software activity may inadvertently trigger the same alert. To enhance coverage, companion detections could include monitoring for abnormal network traffic patterns associated with Splashtop connection attempts, reducing the risk of false positives.

