note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Splashtop Remote Management Tool, which may indicate potential misuse or abuse of remote desktop capabilities. The likely attacker objective is to gain unauthorized access to systems for reconnaissance or exploitation through established remote management protocols. Relevant MITRE ATT&CK tactics and techniques include *Execution* (TA0002) and *Remote Services* (T1219).

  Primary telemetry sources for this detection are Windows Event Logs, specifically file event logs indicating access to critical files associated with the Splashtop application and its operational logs. If malicious, this behavior can lead to unauthorized control over endpoints, compromising sensitive data. It should be noted that this detection does NOT confirm malicious activity on its own; legitimate use of Splashtop within an organization could trigger these alerts.

  ### Investigation Steps

  - **Review file access logs for Splashtop components**: Check for specific file access events related to Splashtop, such as Event ID 4663, for files like `C:\Program Files (x86)\Splashtop\Splashtop Remote\Server\SRService.exe`. Compare timestamps against known schedules for permitted activities.

  - **Identify unauthorized process executions**: Monitor for unusual execution patterns of Splashtop services, focusing on Event ID 4688 (Process Creation) for `SRAgent.exe` or `SRUtility.exe`. Malicious activity may show suspicious command-line arguments or unusual execution context.

  - **Analyze log files for suspicious entries**: Examine contents of log files such as `FTCLog.txt` or `agent_log.txt`. Look for anomalous entries that deviate from standard operational messages, which could indicate unauthorized remote sessions.

  - **Correlate alerts with user roles**: Verify whether the user associated with the Splashtop access is an administrator or has legitimate remote support roles. Administrative misuse may indicate a higher risk of malicious intent.

  - **Check endpoints for known vulnerabilities**: Ensure the systems where Splashtop is installed are patched and compliant. Malicious actors often exploit vulnerabilities related to outdated remote access tools.

  - **Evaluate legitimate use reports**: Gather context from the helpdesk or IT teams regarding the expected use of Splashtop. Ensure that known legitimate activities align with the timelines of the detected alerts to differentiate between benign and malicious indicators.

  ### Prioritization

  The severity of this alert is medium due to the elevated risk associated with remote management tools if exploited. The impact can be significant if critical systems are accessed without authorization, and tools like Splashtop are commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for authorized users to trigger alerts while performing legitimate remote management tasks. Ensure comprehensive logging is enabled for all Splashtop operational files and associated processes. Legitimate remote support activities could trigger these alerts, emphasizing the need for context. A related detection to consider is monitoring for unusual login patterns associated with remote sessions, further strengthening coverage.

