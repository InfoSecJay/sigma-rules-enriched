note: |
  ### Technical Context
  This rule detects file activity associated with the Splashtop Remote Management (RMM) tool, which is often employed for remote desktop and management tasks. The likely threat scenario involves unauthorized access to systems via remote management solutions, allowing attackers to execute malicious activities, exfiltrate data, or manipulate system settings without detection. Attackers may aim to maintain persistence or control over compromised machines by leveraging such tools, which can be particularly concerning in environments where sensitive data is handled.

  In terms of MITRE ATT&CK, this detection primarily relates to the **Execution** tactic, specifically the technique **T1219 - Remote Access Software**. The ability to utilize remote access tools for intrusions is a well-known attack vector that can facilitate lateral movement within networks, data exfiltration, or other malicious objectives.

  The primary data sources relevant for detecting this behavior include Windows file event logs, which can provide insights into file access patterns related to the Splashtop installation directory, log files, and components associated with the application.

  ### Investigation Steps
  - **Review File Events:** Examine Windows file event logs for accesses to files associated with Splashtop, specifically targeting the directories and log files mentioned in the detection rule.
  - **Monitor Parent Process:** Investigate the parent process of any detected Splashtop file activity to determine if it was spawned by a legitimate application or a potentially malicious entity.
  - **Analyze Network Activity:** Check for any outgoing network connections from the Splashtop executable files to identify any unauthorized remote connections, which may indicate misuse of the tool.
  - **Verify User Accounts:** Assess user accounts that initiated the file activity to validate whether they should have access to Splashtop tools or if their presence indicates potential credential compromise.

  ### Prioritization
  The alert's medium severity reflects the potential for significant impact if unauthorized remote access is indeed occurring. Although Splashtop is a legitimate tool, its presence and use in unexpected contexts can indicate compromise, warranting prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the Splashtop service paths or logging settings have been altered or if file path monitoring is not uniformly enabled across all endpoints. The detection logic assumes that the presence of Splashtop-related file activity, particularly outside normal operational patterns, indicates potential misuse. Proper configuration of Windows file event logging is required for the alert to function effectively.

