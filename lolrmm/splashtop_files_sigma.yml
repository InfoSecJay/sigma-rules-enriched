note: |
  ### Technical Context

  This rule detects file access and modifications associated with the Splashtop Remote Management (RMM) tool, which may indicate unauthorized remote access or command-and-control activity. The likely attacker objective is to maintain persistence or establish unauthorized control over a victim's system, potentially enabling further exploitation or data exfiltration. The related MITRE ATT&CK tactics include **Command and Control** (TA0011) and **Exploitation for Client Execution** (T1219).

  Primary telemetry sources include Windows file event logs targeting both executable files and logs within the Splashtop installation directories. If malicious, this activity could lead to unauthorized access to sensitive systems or data. Importantly, this detection does NOT confirm that Splashtop usage is inherently malicious, as it may be legitimately used within the organization.

  ### Investigation Steps

  - **Review file event logs**: Investigate Windows Event Logs (Event ID 4663) for access to the specified Splashtop files (e.g., `SRAgent.exe`, `SPLog.txt`). Identify unauthorized access patterns or unknown user accounts accessing these files.

  - **Check process execution events**: Analyze Security Event ID 4688 for the execution of `SRAgent.exe` or `SRService.exe`. Look for command-line parameters that appear unusual or correlating with known malicious behavior.

  - **Compare against baseline activity**: Verify expected Splashtop file access patterns from known users or roles. Legitimate access should not occur during unusual hours or from atypical devices.

  - **Correlate with network activity**: Review firewall or network logs for outbound connections on ports typically used by Splashtop (e.g., TCP 6783). Identify connections from untrusted or unexpected IP addresses.

  - **Identify known malicious indicators**: Look for any instances of the file `FTCLog.txt` being accessed by atypical processes or accounts not authorized to use Splashtop. Such access should raise red flags for further scrutiny.

  ### Prioritization

  This alert should be treated with medium severity due to the potential security impact of unauthorized remote access via Splashtop, a tool often used by administrators. The risk of malicious actors abusing this tool for lateral movement or data exfiltration is plausible and has been noted in past intrusions involving remote access tools.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate use of Splashtop for administrative purposes, leading to alerts that may be benign. Reliable detection requires complete logging of file events and process creations, ensuring that all appropriate telemetry sources are monitored. Additionally, legitimate IT management activities, such as routine maintenance or remote assistance requests, may trigger this alert. A related detection could involve monitoring for unusual network communication patterns associated with remote access tools to further assess risk.

