note: |
  ### Technical Context

  This rule detects registry activity associated with the Teleport Connect Remote Monitoring Management (RMM) tool, specifically monitoring changes to keys under `HKLM\SOFTWARE\Policies\Teleport\TeleportConnect` and `HKCU\SOFTWARE\Policies\Teleport\TeleportConnect`. This behavior may indicate an attacker setting up command and control (C2) infrastructure to manipulate or monitor a victim's systems. The relevant MITRE ATT&CK technique is T1219 (Remote Access Software), which encompasses the use of RMM solutions to facilitate remote administration or exploitation.

  The primary telemetry sources include Windows Registry event logs that capture registry modifications. If the activity is malicious, it poses a significant risk to system integrity and confidentiality, as it can allow unauthorized access to systems and data exfiltration. However, this detection alone does not confirm malicious intent, as legitimate uses of the Teleport Connect tool may trigger the same registry modifications.

  ### Investigation Steps

  - **Review Registry Changes:** Check Windows Event ID 4657 for changes to registry keys `HKLM\SOFTWARE\Policies\Teleport\TeleportConnect` and `HKCU\SOFTWARE\Policies\Teleport\TeleportConnect`. Look for unexpected values, especially those initiated by non-administrative user accounts.

  - **Correlate Processes:** Investigate if any suspicious processes are spawned following registry changes by reviewing Sysmon Event ID 1 (Process Creation) within the time frame of the detected registry activity. Indicators such as unexpected scripts or executables running soon after the registry changes should raise suspicion.

  - **Validate Legitimate Teleport Use:** Search for authorized installations of Teleport Connect within the asset inventory and confirm via internal documentation. Expected behavior includes registry modifications only by systems designated as management or monitoring devices.

  - **Identify Anomalous User Accounts:** Use Security Event ID 4624 to check logon events following the registry activity. Focus on user accounts that typically do not have access to Teleport management functions, especially if they exhibit administrative privileges.

  - **Check for Network Connections:** Review network activity logs for outbound connections to known C2 IP addresses or domains following the registry modifications, using firewall or proxy logs. Look for endpoints that initiate unexpected connections to unusual external servers.

  - **Examine Event SIDs:** In Security Event ID 4663 (Access Attempt), verify the SIDs associated with the changes to determine if the actions were taken by compromised accounts or those lacking authorization to execute such changes, focusing on high-risk targets.

  ### Prioritization

  This alert should be treated as medium severity, considering the potential impact of the affected systems, which may house sensitive information or critical applications. The likelihood of malicious abuse is moderate, particularly in environments where RMM tools are misused for nefarious purposes. Such behaviors are increasingly weaponized by threat actors leveraging legitimate software for infiltration and persistence.

  ### Blind Spots and Assumptions

  There are limitations in detecting modified registry values used for benign purposes, as legitimate Teleport Connect activity can also trigger this alert. Effective detection requires continuous monitoring of Windows Registry events and configuration of telemetry sources like Sysmon and Windows Event Logs. Additionally, legitimate administrative actions performed by authorized personnel may inadvertently trigger the alert, emphasizing the need for context during investigations. Complementing this detection with alerts for unusual outbound network connections (e.g., using tools like Zeek or Suricata) enhances overall monitoring capabilities for potential exploitation scenarios.

