note: |
  ### Technical Context

  This Sigma rule detects registry modifications by the Teleport Connect Remote Monitoring and Management (RMM) tool, potentially indicating malicious activity or unauthorized remote access. Attackers leveraging this tool may aim to establish persistent access to the environment, gather sensitive information, or manipulate system functionality. The relevant MITRE ATT&CK tactic is **Execution** (ID: T1219).

  The primary telemetry sources include Windows Registry events, specifically looking at entries within the `HKLM\SOFTWARE\Policies\Teleport\TeleportConnect` and `HKCU\SOFTWARE\Policies\Teleport\TeleportConnect` paths. If malicious, such activity may lead to system compromise, data exfiltration, or further lateral movement within the environment. However, this detection does NOT independently confirm that malicious activity has occurred; legitimate use of Teleport Connect can also trigger the alert.

  ### Investigation Steps

  - **Review registry modifications:** Examine Windows Event logs for Registry Event ID 2000 (or higher) to identify changes at the specified paths. Look for the most recent activity to determine the context of the modification.

  - **Validate context of the tool's usage:** Check for application logs or specific user training documentation where legitimate usage has been authorized, matching the affected user account with expected behavior patterns.

  - **Investigate user account activity:** Cross-reference user account activity in the Security Event log (Event ID 4624) to assess if the account triggering registry changes has a legitimate history of using Teleport Connect.

  - **Identify abnormal command execution:** Look for Event ID 4688 (Process Creation) that follows any registry changes made to Teleport settings. Focus on suspicious command line arguments or unusual parent processes that may indicate malicious intent.

  - **Assess endpoint role:** Confirm if the affected system plays an administrator or high-privilege role within the network. Malicious changes in these contexts have a higher risk of impact.

  - **Correlate with network traffic:** Analyze network logs (e.g., firewalls, proxies) for outgoing connections or communications associated with Teleport, looking for indicators of remote connections that don't align with expected business functions.

  ### Prioritization

  This alert is categorized as medium severity due to the potential impact on systems where Teleport Connect is authorized for use. The likelihood of abuse is moderate, as this tool can be weaponized for unauthorized access, but detection may also result from legitimate administrative activities.

  ### Blind Spots and Assumptions

  Detection limitations exist due to possible misuse of legitimate tooling, which may reduce false positives. Additionally, if logging for registry modifications is not enabled on all endpoints, detection might be incomplete. Legitimate system maintenance tasks or software updates could unintentionally trigger this alert. A related detection could be monitoring for unauthorized software installations or changes in scheduled tasks that may complement the monitoring of Teleport Connect usage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
