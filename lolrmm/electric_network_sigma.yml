  ### Technical Context

  This rule detects outbound network connections to hosts associated with Electric RMM (Remote Monitoring and Management) tool, specifically targeting domains ending with "electric.ai." Attackers may use RMM tools to maintain unauthorized access, deploy malware, or exfiltrate data from within a compromised network. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique is **Remote Services** (T1219).

  Primary telemetry sources include network connection logs that capture outbound traffic details, specifically the destination hostnames. The security impact of such activity is significant, as malicious use of RMM tools can facilitate extensive exploitation of organizational assets and data. Alone, this detection does NOT verify malicious intent, as legitimate organizational use of RMM tools may trigger the alert.

  ---

  ### Investigation Steps

  - **Verify the source of the connection attempt**: Review Windows event logs (Security Event ID 5156) for network connections originating from known administrative or management machines, which may indicate legitimate use of Electric RMM.

  - **Identify the user account associated with the connection**: Check Security Event ID 4624 to determine the user account initiating the connection. Compare against documented administrator accounts; suspicious accounts may indicate potential misuse.

  - **Examine the connection details for anomalies**: Inspect the destination addresses and ports in network logs (Firewall logs or NetFlow data) for unusual traffic patterns or connections found outside expected business hours, suggesting possible malicious activity.

  - **Check for other indicators of compromise**: Look for additional suspicious behaviors on the same host, such as unusual process creation (Sysmon Event ID 1), especially if linked to a low-privilege user executing administrative tasks that are abnormal.

  - **Document expected legitimate usage patterns**: Collect data on typical outbound connections to "electric.ai" during work hours and by authorized personnel, creating a baseline against which to assess the current alert.

  - **Review recent changes in access control settings**: Analyze changes to group policies or firewall configurations (Event ID 4663) that may indicate unauthorized modifications allowing RMM tool usage.

  ---

  ### Prioritization

  This alert is categorized as medium severity due to the potential for significant impact on enterprise security if malicious activity is confirmed. Given the high probability of RMM tools being weaponized by adversaries, timely investigation is crucial to prevent exploitation of sensitive systems.

  ---

  ### Blind Spots and Assumptions

  This detection may miss malicious RMM usage if the adversary employs obfuscation techniques to disguise their connections or uses legitimate credentials. It is essential to ensure that logging for both network connections and user access is correctly configured for reliable detection. Legitimate IT management activities may trigger this alert, particularly in organizations utilizing RMM solutions for support. A related detection to consider is unauthorized process executions flagged by Sysmon, which could complement this network detection by indicating potential misuse of management tools.

