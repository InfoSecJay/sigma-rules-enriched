  ---

  ### Technical Context

  This Sigma rule detects network connections to hosts within the domain "electric.ai," which is associated with the Electric Remote Monitoring and Management (RMM) tool. The likely objective of an adversary using this tool would be to establish remote access for monitoring, maintenance, or potentially malicious activities on compromised systems. This behavior fits within the MITRE ATT&CK framework under the Tactic: Execution and the Technique: Remote Services (T1219).

  Primary telemetry sources for this detection include Windows network connection logs, specifically capturing events indicating outbound network traffic. The security impact could range from benign remote management activity to malicious exploitation of system access. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use of the Electric RMM tool may trigger this alert.

  ---

  ### Investigation Steps

  - **Review outbound connections:** Examine Windows Security Event ID 5156 (Windows Filtering Platform) to identify outbound connections to "electric.ai". Check if the connections are initiated by known or expected processes.

  - **Validate session details:** Cross-reference the connection timestamp with Windows Event ID 4624 (Logon) to confirm if the connection corresponds to a logged user session, indicating possible legitimate use.

  - **Inspect process activity:** Investigate related process creations through Sysmon Event ID 1 (Process Creation) around the time of the alert to determine if a known RMM client is initiating the connection.

  - **Check for account anomalies:** Look for unusual account behavior such as unauthorized user accounts initiating connections to "electric.ai" by checking Event ID 4672 (Special Logon) logs.

  - **Assess asset criticality:** Determine the role of the affected systems (e.g., domain controllers, workstations, critical servers). High-criticality systems initiating such connections may warrant a higher priority investigation.

  - **Identify known malicious indicators:** Check for previously identified IP addresses involved with malicious RMM activity or flagged domains that could be associated with Electric AI, enriching threat context.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for both benign and malicious use of Electric RMM. While RMM tools are commonly employed for legitimate remote system management, their usage can be weaponized by adversaries to maintain persistence on compromised assets. The criticality of the affected system will significantly influence the urgency of the response.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs for legitimate RMM tool usage or due to improper configurations of network monitoring settings. Legitimate internal support teams may trigger the alert during authorized remote management sessions. Companion detections to consider include monitoring for unusual access patterns to other RMM endpoints or integrations, which may help provide context to the Electric RMM network activity.

