note: |
  ### Technical Context
  This rule detects potential network activity related to the Electric RMM tool by identifying connections to destinations associated with Electric AI. The presence of network connection requests to `electric.ai` could indicate the use of this remote monitoring and management tool, which attackers may utilize for accessing and managing compromised systems under the guise of legitimate administrative tasks. Attackers often seek to maintain persistence and control over their targets, using tools such as Electric RMM to facilitate remote access and execution of potentially malicious actions.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Execution (TA0002)**, particularly the technique **Remote Services (T1219)**. This technique encompasses the use of remote management tools for executing commands and actions on target systems. Understanding this context helps responders comprehend the possible implications of detected activity involving Electric RMM in their environment.

  The primary data sources that will provide evidence for this detection are **Windows network connection logs** that capture outbound connections, including timestamps, processes initiating the requests, and destination details. These logs will be crucial for determining whether the activity is legitimate or indicative of potentially malicious behavior.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine Windows network connection logs for any anomalous or unexpected connections to `electric.ai`, focusing on the source IP addresses and processes involved in these connections.
  - **Analyze Process Creation Events**: Identify any unusual or unauthorized processes that initiated connections to Electric RMM endpoints. This can help correlate activity with known legitimate administrative tasks.
  - **Check for User Account Activity**: Investigate the user accounts associated with the detected network connections to determine if they align with legitimate administrative access patterns or if there are any indications of credential misuse.
  - **Audit Installed Software**: Verify if the Electric RMM tool is installed within the enterprise environment and check if the version is legitimate and authorized. Cross-reference installed software with any detected network activity.

  ### Prioritization
  The severity of this alert is medium due to the potential for significant impact if an attacker gains unauthorized remote access through legitimate tools like Electric RMM. While the likelihood of such activity occurring may vary based on organizational use of RMM tools, it remains crucial to respond promptly to investigate any anomalies.

  ### Blind Spots and Assumptions
  This detection logic may have gaps in coverage for environments where the Electric RMM tool is used legitimately, leading to potential false positives in alerts. Additionally, the detection assumes that network traffic will reach known Electric RMM destinations and that all relevant network connection logs are being properly recorded. Organizations must ensure that their logging configuration captures all necessary data to support this alert effectively.

