note: |
  ### Technical Context
  This detection rule identifies the potential use of Microsoft Remote Desktop Protocol (RDP) tools, specifically the Remote Management (RMM) processes, commonly associated with malicious activities. Attackers may leverage these tools to gain unauthorized access to systems within the organization, often in efforts to perform remote reconnaissance, exfiltrate data, or install additional malware. The presence of processes associated with RDP such as `mstsc.exe` (Microsoft Terminal Services Client) and `termsrv.exe` (Terminal Services) can indicate either legitimate administrative activity or potential misuse by threat actors.

  The relevant MITRE ATT&CK techniques that apply to this rule include **Execution** tactics, with a particular focus on **T1219: Remote Access Software**. This technique encompasses the use of RDP tools to connect to other systems remotely, which may facilitate lateral movement and other exploitative behaviors. The primary data source for correlating this activity includes process creation logs on Windows systems that can capture the launching of these processes, providing visibility into potentially unauthorized or anomalous usage.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze recent process creation logs for instances where `mstsc.exe` or `termsrv.exe` have been launched. Pay special attention to the parent processes to identify any suspicious origins.
  - **Analyze User Access Patterns:** Check the accounts that initiated the RDP connections. Look for any anomalies such as unusual user accounts accessing sensitive systems or times that do not align with typical user behavior.
  - **Correlate with Network Traffic:** Investigate associated network logs to see if there are any unusual or unauthorized external IP addresses attempting RDP connections. Patterns of traffic to known malicious IPs can indicate a potential compromise.
  - **Cross-reference with Existing Logs:** Examine additional logs, such as authentication logs or VPN logs, to identify any unusual authentication attempts or failed logins that coincide with the detected RDP process activities.

  ### Prioritization
  This alert is categorized as medium severity due to the potential for risk posed by unauthorized RDP access. While legitimate administrative tasks may trigger the alert, the use of RDP tools by unauthorized users is a common method for lateral movement and could indicate a significant breach or exploitation attempt.

  ### Blind Spots and Assumptions
  One assumption made by the detection logic is that all use of Microsoft RDP tools can be correlated to malicious activities; however, legitimate administrative tasks can generate similar alerts. Additionally, without proper logging configurations or endpoint monitoring, instances of RDP usage may go undetected. There may also be gaps in visibility if the environment does not log process creation events properly, thereby leading to exposure during a genuine attack. Implementing thorough monitoring of process creation, as well as contextual logging for user sessions, is crucial for enhancing detection capabilities.

