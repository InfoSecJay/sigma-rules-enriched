note: |
  ### Technical Context

  This Sigma rule detects processes that are spawned from Microsoft Remote Desktop Protocol (RDP) client applications (`mstsc.exe` or `termsrv.exe`), which are often utilized in remote management and administration scenarios. The likely attacker objective would be to access a system remotely, potentially for unauthorized control or exfiltration of data. This behavior fits into the MITRE ATT&CK framework under the tactic "Execution" with the technique "Remote Services" (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and System Monitor (Sysmon) Event ID 1. If these processes are initiated without proper authorization, it can indicate a security risk, suggesting that an adversary is attempting to use legitimate remote management tools for nefarious purposes. This detection does NOT confirm malicious intent on its own, as similar behavior can also originate from legitimate administrative activities.

  ### Investigation Steps

  - **Review Process Creation Events**: Check for Security Event ID 4688 or Sysmon Event ID 1 for any new processes indicating RDP activity from `mstsc.exe` or `termsrv.exe`. Compare the user and source IP against records of known administrative access to validate legitimacy.

  - **Verify Parent-Child Process Relationships**: Analyze the parent process for any suspicious spawning of `termsrv.exe` or `mstsc.exe`. Focus on processes that originate from unexpected sources or accounts not typically used for remote administration.

  - **Check User Context**: Investigate the user accounts executing these processes. Ensure they are valid administrative accounts. Legitimate activity usually comes from predefined administrative users. Unauthorized users executing RDP tools should raise immediate suspicion.

  - **Cross-reference User Activity**: Look for other concurrent events from the same user (e.g., logins, network connections). High-volume activity from the same account can indicate potential abusive use of RDP access, raising alert priorities.

  - **Analyze Networking Logs**: Validate any initiated remote sessions against the firewall logs (Event ID 5156 or equivalent) to determine if connections are made to unauthorized internal systems or external IPs, indicating possible data exfiltration.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on critical systems that may utilize RDP for management. The likelihood of malicious use is moderate; while RDP is often necessary for administrative tasks, attackers commonly exploit these tools for unauthorized access. Given that RDP tools are frequently weaponized in attack scenarios, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  This detection may have limitations in environments with extensive use of RDP for legitimate administrative purposes, leading to false positives. Accurate log collection and configurations for Windows process tracking are essential for effective detection. Legitimate remote support or management activities may trigger this alert. A related detection for monitoring unusual logon events or lateral movement attempts could bolster overall coverage and effectiveness.

