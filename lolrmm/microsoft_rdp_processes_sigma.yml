  ---

  ### Technical Context

  This Sigma rule detects potential unauthorized usage of Microsoft Remote Desktop Protocol (RDP) tools, particularly the process activities associated with termsrv.exe and mstsc.exe, which are used to establish remote desktop sessions. The likely adversary objective is to gain unauthorized access to systems through RDP, facilitating lateral movement or execution of malicious payloads. This activity aligns with the MITRE ATT&CK framework under the tactic of "Execution" and technique T1219 for remote services.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture detailed information about process actions across the operating system. If malicious, the impact could be severe, as it may indicate a breach of system integrity and loss of sensitive data. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate RDP sessions may trigger similar logs.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Validate Security Event ID 4688 or Sysmon Event ID 1 for processes tied to termsrv.exe or mstsc.exe. Look for ParentImage indicating remote session initiation. Legitimate instances typically show user accounts associated with authorized users or administrative roles.

  - **Review remote connection timestamps:** Examine the timestamps of the process creation events to determine if they align with known remote support schedules or unusual timeframes. Legitimate activity usually occurs during business hours, while suspicious connections may appear late at night or during weekends.

  - **Identify user accounts involved:** Cross-reference the user account associated with the spawned processes. Alarmingly, processes executed by accounts that normally do not initiate RDP sessions may indicate malicious intent.

  - **Monitor network activity:** Analyze network logs for unusual outbound connections made after RDP sessions are initiated, particularly if logs show attempts to connect to unrecognized external IPs. Unexpected connections post-RDP activity could suggest data exfiltration attempts.

  - **Correlate with other detection tools:** Check for alerts from endpoint detection solutions or SIEM tools that highlight behaviors consistent with unauthorized access or lateral movement, like suspicious file transfers or service creation.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential risk associated with unauthorized remote access to critical infrastructure. The likelihood of malicious abuse is moderate, given that RDP is a commonly exploited vector during attacks. Although the behavior itself is often weaponized, it may also represent benign remote administration activities.

  ---

  ### Blind Spots and Assumptions

  Detection can be limited by legitimate use of RDP in the organization, which may result in false positives. Reliable detection requires comprehensive logging configurations for process creation and user authentication events. Furthermore, legitimate support staff using RDP tools might inadvertently trigger this alert. A related detection to consider is alerting on unusual outbound connections after an RDP session initiation, as this could provide additional context to potential exfiltration attempts.

