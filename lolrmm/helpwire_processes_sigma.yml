note: |
  ### Technical Context

  This rule detects the execution of processes associated with the HelpWire Remote Management and Monitoring (RMM) tool, specifically `helpwire.exe` and `HelpWire Quick.exe`. Attackers may use this tool for remote access to compromised systems, often aiming to maintain persistence, exfiltrate data, or deploy additional payloads within a network. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), utilizing technique T1219 (Remote Access Software).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which captures the details regarding new process initiation. If used maliciously, the presence of these processes may indicate unauthorized remote access facilitating a variety of adversarial activities. However, the detection of these processes does NOT confirm malicious use, as HelpWire may also be employed for legitimate administrative tasks.

  ### Investigation Steps

  - **Review process creation events:** Analyze Security Event ID 4688 or Sysmon Event ID 1 logs. Look for process creation events where the `Image` field contains `helpwire.exe` or `HelpWire Quick.exe`. Legitimate instances may originate from known administrative accounts, particularly on management or support servers.

  - **Verify parent-child relationship:** Check for parent processes that precede the execution of HelpWire processes. Events with `ParentImage` field indicating legitimate administrative tools can suggest benign usage, while unexpected parent processes may highlight malicious behavior.

  - **Identify user context:** Correlate the detected HelpWire activity with user IDs and account types. Be alert for indications of anomalous usage on user accounts not typically associated with remote management activities. Unauthorized use by standard users is a high-confidence malicious indicator.

  - **Investigate network connections:** Cross-reference detected events with network logs (e.g., firewall, IDS/IPS) to identify if the HelpWire processes are initiating network connections to suspicious external IP addresses. This indicates potential data exfiltration or command and control communication.

  - **Examine file creation and modification:** Look for any file or registry modifications that may have occurred during the HelpWire process's operation. Focus on creation of temporary files or logs that have suspicious or unauthorized content.

  ### Prioritization

  This alert has medium severity since the presence of HelpWire processes on critical systems may indicate potential unauthorized remote access. While HelpWire is legitimately used for remote management, the risk of abuse exists, especially in environments lacking proper monitoring or constraints on remote admin tools.

  ### Blind Spots and Assumptions

  The main limitations of this detection include potential evasion techniques where attackers use renamed or modified instances of the RMM tool to avoid detection. Reliable detection requires complete logging configurations for process creation and potentially network activities. Legitimate IT support or remote management activities can also trigger this alert, indicating the need for contextual analysis. A companion detection could involve monitoring for unusual outbound network traffic patterns linked to these processes, enhancing visibility.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
