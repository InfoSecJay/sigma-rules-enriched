  ### Technical Context

  This Sigma rule detects process activities associated with the ServerEye Remote Monitoring and Management (RMM) tool, specifically looking for instances where the processes originate from known ServerEye executables. Attackers may use RMM tools for legitimate remote access but can also exploit them for malicious purposes, such as maintaining persistence or conducting reconnaissance. This behavior fits within the MITRE ATT&CK framework under the Remote Access Tactic (TA0011) and the technique for using the RMM tool as a Command and Control (C2) mechanism (T1219).

  The primary telemetry source is the Windows process creation logs, specifically Security Event ID 4688, which captures process creation details. If used maliciously, this tool could allow unauthorized access to sensitive systems, indicating a higher risk of data exfiltration or further compromise. Importantly, this detection alone does not confirm malicious intent; legitimate use of the ServerEye tool is common in many organizations.

  ### Investigation Steps

  - **Check process details: **Review Security Event ID 4688 for processes related to ServerEye or ServiceProxyLocalSys, focusing on fields like `NewProcessName` to verify the executable's path. Malicious indicators include unexpected paths or timestamps suggesting non-business hours operation.

  - **Correlate with user activity: **Cross-reference logins (Event ID 4624) around the time of the process creation to determine the user account. Legitimate usage should align with known administrative activities from validated user accounts.

  - **Examine network connections: **Analyze any network activity originating from the host (such as Log Management for Firewall or Intrusion Detection), particularly looking for outbound connections to uncommon IP addresses or domains suggesting C2 activity.

  - **Identify Asset Role: **Determine whether the system running ServerEye has critical functions (e.g. a server hosting sensitive data). Heightened scrutiny is required if any critical assets show suspicious RMM tool activity.

  - **Review scheduled tasks: **Look for any scheduled tasks created by the ServerEye tool (using Task Scheduler logs) that could indicate persistence mechanisms being set up for access or control.

  ### Prioritization

  This alert should be taken seriously, especially in environments where ServerEye is not typically used. The likelihood of malicious abuse is moderate to high, given the nature of RMM tools being conducive to both administrative and unauthorized access. As this behavior can be weaponized effectively by adversaries, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be bypassed by threat actors using renamed or custom versions of the software, or by legitimate users performing benign tasks that trigger the alert. Relies on accurate logging configurations for Event ID 4688, as improper settings may fail to capture necessary details. Common legitimate activities include IT support or administration remotely using ServerEye, necessitating context before assumption of malice. A related detection to enhance coverage would be monitoring for unusually high process execution frequency by the identified executables.

