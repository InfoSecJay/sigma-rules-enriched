note: |
  ### Technical Context

  This rule detects the execution of processes related to the ServerEye remote monitoring and management (RMM) tool, as indicated by parent and child process names. Attackers may use RMM tools like ServerEye to maintain control over compromised systems, exfiltrate data, or perform other illicit activities. This behavior is relevant to the MITRE ATT&CK tactic of Execution (T1203) as it directly relates to executing unauthorized commands or actions on a system.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details about process creation events. If malicious, this detections indicates potential unauthorized access or continuous monitoring of a compromised machine. Importantly, this detection does NOT confirm malicious intent on its own; benign instances may occur if the ServerEye software is legitimately in use.

  ### Investigation Steps

  - **Correlate process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 logs for events where the Image contains *servereye*.exe or *ServiceProxyLocalSys.exe*. Investigate the context of these executions to determine if they are from expected sources or users.

  - **Analyze parent-child process relationships:** Identify the parent processes for any instances of ServerEye-related executables. Benign activity typically originates from trusted applications or services; malicious command chains may exhibit unexpected parent processes.

  - **Examine system activity timelines:** Use event logs to understand the sequence of events surrounding the alert. Look for concurrent logins, privilege escalations, or unusual service starting that could indicate misuse of the RMM tool.

  - **Check for known indicators of compromise (IoCs):** Look for additional suspicious indicators in the same time frame, such as traffic anomalies via proxy logs or network logs indicating data exfiltration, which would be high-confidence indicators of malicious activity.

  - **Validate installation of RMM tools:** Cross-reference installation logs or system configuration to confirm whether ServerEye was legitimately installed on the affected host. Consider the asset's role and criticality in the enterprise environment.

  - **Review user behavior:** Check user activity logs to see if the user associated with the RMM tool usage role has a history of legitimate administrative tasks or if their account shows signs of compromise (e.g., unexplained login from unusual locations).

  ### Prioritization

  This alert should be treated with medium severity. While the presence of RMM tools can indicate legitimate administrative actions, their misuse can facilitate significant compromises. Given the potential for command execution and remote access, attackers often weaponize these tools to maintain persistence in environments.

  ### Blind Spots and Assumptions

  This detection may have limitations against skilled adversaries who can rename or obfuscate their tools. It relies on complete and correct deployments of Windows auditing to capture process creation events effectively. Legitimate administrative activities, including authorized IT management operations, may trigger this alert. A companion detection could involve monitoring outbound network traffic for unusual connections initiated by the same processes, enhancing the context for any alerts noted.

