note: |
  ### Technical Context

  This rule detects network activity associated with TurboMeeting, a remote management tool used for remote access and support. The likely attacker objective here is to establish unauthorized remote access or control over a target system, potentially for the purpose of data theft or further exploitation. This aligns with the MITRE ATT&CK technique for remote management tools (T1219).

  The primary telemetry sources are Windows network connection logs, focusing on specific destination hostnames related to TurboMeeting. If detected maliciously, this activity poses a significant risk, as it may allow an adversary to execute commands or manipulate files on the compromised system. It is important to note that the presence of this detection alone does not confirm malicious intent; legitimate use of TurboMeeting can result in similar network activities.

  ### Investigation Steps

  - **Review network connection logs:** Check for connections to destination hostnames ending with "user_managed" or "acceo.com/turbomeeting/" in Windows Firewall logs (Event ID 5156). Compare timestamps with user activity to identify potential unauthorized access.

  - **Validate active sessions:** Investigate the system to see if TurboMeeting services are running (see services.msc) and check the process list for `TurboMeeting.exe`. Benign usage should correspond with known user activities.

  - **Examine related processes:** Look for any unusual process creation linked to TurboMeeting, specifically Sysmon Event ID 1 (Process Creation) that references "TurboMeeting.exe". Anomalies here may suggest misuse.

  - **Collect user activity logs:** Identify legitimate user access patterns within your organization for TurboMeeting by reviewing Office 365 or SSO logs that confirm expected meeting schedules and active users. If the network activity does not align with known users, it raises suspicion.

  - **Assess endpoint for indicators of compromise:** Check for file artifacts created by TurboMeeting, such as remote session records or transferred files (often in temporary directories). Any unexpected file creation could indicate malicious usage.

  ### Prioritization

  This alert is of medium severity due to the risk of unauthorized remote access on potentially sensitive systems. Given that remote management tools are commonly abused in attacks, the likelihood of malicious exploitation is moderate. However, it is essential to differentiate between malicious and benign usage, as legitimate connections can frequently mimic this behavior.

  ### Blind Spots and Assumptions

  Detection limitations may include environments where TurboMeeting is used legitimately, leading to false positives. Ensure logging for outbound network connections is appropriately configured for reliable visibility. Additionally, similar remote control tools may trigger this alert but go undetected without corresponding detections, such as those for VNC or TeamViewer usage. Monitoring related telemetry can enhance overall detection effectiveness.

