note: |
  ### Technical Context

  This Sigma rule detects the execution of the PChelpware Remote Management Tool (RMM), specifically processes initiated by or related to "PcHelpWare_viewer.exe". The behavior observed often indicates an attacker’s intent to remotely control or manage a compromised system. This activity is aligned with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry source for this detection is Windows process creation events. Specifically, Security Event ID 4688 and/or Sysmon Event ID 1 are necessary to capture the creation of this process. If malicious, this behavior can facilitate unauthorized access and control over the infected machine. Importantly, this detection does NOT confirm a system compromise on its own, as legitimate uses of PChelpware may exist in the environment.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 to confirm the creation of "PcHelpWare_viewer.exe". Note the user account initiating this process and the parent process—legitimate activity typically shows administrative or remote support accounts as creators.

  - **Identify unusual parent processes**: Investigate the parent process of "PcHelpWare_viewer.exe". Malicious instances may originate from unexpected sources like command line interfaces or other RMM tools, which deviate from normal operational protocols.

  - **Assess network connections**: Analyze network logs associated with the timestamp of the event. Focus on outbound connections originating from the system running the PChelpware tool. Malicious usage may show connections to atypical external IP addresses or domain names indicative of remote access attempts.

  - **Check for known C2 patterns**: Use threat intelligence to correlate the observed external connections with known command and control (C2) infrastructures. Look for matching signatures in DNS queries or firewall logs that could indicate malicious activity.

  - **Correlate with endpoint policies**: Validate whether the use of PChelpware is permitted in the environment. Review asset criticality—systems labeled as high criticality should not execute this tool unless explicitly authorized for legitimate purposes.

  - **Monitor for file creation or modification**: Specifically look for new file artifacts created or modified by the process, such as configuration files typically associated with remote management. Unusual writes may indicate malicious intent or malicious payload delivery.

  ### Prioritization

  Alerts generated by this detection are of medium severity due to the potential for unauthorized remote access. While PChelpware can be used for legitimate support functions, its misuse by an adversary poses a serious risk to sensitive data and system integrity, especially in high-value assets.

  ### Blind Spots and Assumptions

  This detection may yield false positives if legitimate IT support utilizes PChelpware. Organizations must ensure proper logging of Windows process creation (Event ID 4688 and Sysmon configurations) to provide reliable detection. Additionally, user behavior reinforcing network patterns from known support personnel could trigger this alert without malicious intent. A related detection includes monitoring for anomalous user activity associated with known remote administration tools to enhance coverage.

