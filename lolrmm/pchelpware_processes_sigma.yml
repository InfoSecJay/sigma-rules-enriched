  ### Technical Context

  This rule detects the process creation activity related to the PChelpware remote management tool, specifically indicating the launch of `PcHelpWare_viewer.exe`. The primary attacker objective is often to establish a command-and-control (C2) channel for remote access to victim machines, typically associated with unauthorized control of systems. In the context of MITRE ATT&CK, this relates to the tactic of Command and Control (TA0011) and the technique Remote Access Tools (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If this activity is confirmed to be malicious, it can lead to unauthorized access, data exfiltration, or other harmful actions against the organization. It is important to note that this detection does not confirm malicious intent on its own, as legitimate remote management may also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for entries with `Image` or `ParentImage` containing `PcHelpWare_viewer.exe`. This indicates the initiation of the tool.

  - **Identify user account activity:** Cross-reference the process creation event with user authentication logs (e.g., Event ID 4624) to understand which user initiated the remote management tool and correlate it with legitimate user roles.

  - **Assess network connections:** Analyze the outbound connections from the affected machine, using Windows Firewall logs (Event ID 5156) to review the destination IP addresses and ports being accessed at the time of the process creation. Look for unusual external IPs that may indicate a C2 infrastructure.

  - **Determine expected behavior:** Confirm if `PcHelpWare_viewer.exe` appears in the context of known IT support activities or legitimate remote access use cases. Compare timestamps of authorized remote support sessions with the detected activity.

  - **Investigate parent processes:** Examine the command line arguments of the parent process (`ParentImage`) to identify any unusual parameters or scripts that indicate potential exploitation or misuse of the tool.

  - **Check for persistence mechanisms:** Review startup entries in registry keys (e.g., `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`) for `PcHelpWare_viewer.exe` to determine if there are indications of persistence that suggest malicious intent.

  ### Prioritization

  This alert has medium severity because it indicates potential unauthorized remote access, which can lead to significant security impacts, especially on critical systems. The likelihood of malicious use is moderate, as various adversaries exploit legitimate remote management tools for compromised access, making them a common target.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate remote management sessions; therefore, careful contextual analysis is needed to differentiate between malicious and benign use. Reliable detection requires proper Sysmon and Windows event logging configurations, particularly for process creation and network activities. Legitimate IT support activities can trigger this alert, so it is crucial to verify user context. Companion detections such as monitoring for known C2 traffic can strengthen coverage and context around such remote access tools.

