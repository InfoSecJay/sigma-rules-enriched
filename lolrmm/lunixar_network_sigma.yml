note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the Lunixar Remote Monitoring and Management (RMM) tool, indicating potential unauthorized access to endpoint systems. An attacker might utilize Lunixar as part of their operations to gain control of compromised systems or to exfiltrate sensitive data. The rule corresponds to the MITRE ATT&CK technique "Remote System Discovery" (T1219).

  Primary telemetry sources include Windows Network Connection logs, specifically those capturing DNS requests and outbound connection attempts to the specified Lunixar domains. If malicious, this activity can lead to unauthorized system access and data leakage. However, the detection does NOT definitively prove that a system has been compromised or that malicious activity is occurring, as legitimate use of the Lunixar tool may also trigger this alert.

  ### Investigation Steps

  - **Check outbound connections to Lunixar domains**: Review Windows Security Event ID 5156 (Windows Filtering Platform) and confirm any connections to *.lunixar.com domains. Verify the user and process initiating the connections for potential malicious intent.

  - **Identify running processes**: Inspect running processes using Sysmon Event ID 1. Look for unusual processes initiating network connections to Lunixar domains. Legitimate instances may include administrative tools, while unauthorized ones may show unknown or suspicious executable names.

  - **Examine DNS resolver logs**: Query DNS logs for recent queries made to Lunixar domains, focusing on resolution times that suggest automated calls. Legitimate usage will typically have records aligned with known operational hours.

  - **Cross-reference with known endpoints**: For systems identified as contacting Lunixar, verify if these are among authorized user devices, such as those managed by IT for remote support. Any deviation should be flagged for further scrutiny.

  - **Investigate user activity**: Look at the user's recent logon events (Security Event ID 4624) focusing on non-standard login times or login failures preceding connections, which might indicate unauthorized access attempts or account compromise.

  ### Prioritization

  This alert is of medium severity. While the potential for malicious activity exists, the likelihood hinges on the context of the organization’s accepted use of Lunixar. In environments where unauthorized RMM tools are strictly regulated, this behavior could indicate an elevated risk. The Lunixar tool's known associations with attack vectors means its network activity is particularly concerning if observed unexpectedly.

  ### Blind Spots and Assumptions

  The detection relies heavily on correct logging configurations for Windows firewalls and DNS servers; without these, detection may be incomplete. Adversaries might use VPNs or obfuscation techniques to hide their network activity, potentially bypassing this detection. Legitimate RMM application use cases might also trigger this alert, complicating incident analysis. Companion detections, such as monitoring for unusual process creation (Sysmon Event ID 1) associated with these network requests, could enhance overall coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
