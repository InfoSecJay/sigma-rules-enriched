note: |
  ### Technical Context

  This Sigma rule detects potential process activity related to the Rodex RMM (Remote Monitoring and Management) tool, specifically identifying instances where processes initiated by or directly associated with `RodexAgent.exe` are created. Attackers may leverage this tool to remotely manage and conduct unauthorized operations on compromised systems, aligning with the MITRE ATT&CK technique "Remote Management" (T1219). The primary telemetry sources are Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1.

  If malicious, the security impact could include unauthorized access, data exfiltration, or further compromise of the environment. However, this detection alone does not confirm malicious activity, as legitimate use of Rodex RMM by IT teams may also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for instances of `RodexAgent.exe`. Look for abnormal parent processes indicating potentially malicious behavior, such as a command shell or unusual scripts.

  - **Analyze parent-child relationships:** Investigate the parent process of `RodexAgent.exe`. Legitimate activity should display a known IT management tool or benign applications. Flag any occurrences where this is initiated by an unexpected user or process.

  - **Verify asset legitimacy:** Confirm whether `Rodex RMM` is approved and used within the environment on affected systems. Review asset documentation for expected RMM usage and authorized personnel responsible.

  - **Identify command line arguments:** Examine the process command line for unusual flags or scripts associated with `RodexAgent.exe`. Malicious commands may indicate exploitation or malicious persistence.

  - **Monitor unusual network connections:** Use network monitoring tools to check if the host communicates with unrecognized external IP addresses or domains during the time of `RodexAgent.exe` execution, which may signify data exfiltration or C2 callbacks.

  ### Prioritization

  This alert has medium severity due to its potential for significant impact on system integrity and data confidentiality, especially if Rodex RMM is being abused for unauthorized access. The likelihood of malicious activity is non-negligible, given that RMM tools are often targeted by adversaries for exploitation.

  ### Blind Spots and Assumptions

  Detection could be limited by the absence of necessary logs if the Sysmon service is not deployed correctly or logging levels are insufficient. Legitimate use cases, such as regular IT maintenance activities, may trigger this alert, potentially leading to false positives. Companion detections for unusual process chains or lateral movement techniques could enhance coverage and provide additional context for investigation.

