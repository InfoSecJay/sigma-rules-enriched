note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ScreenConnect remote management and support tool. This behavior may indicate the installation or use of unauthorized remote access software which attackers can exploit to gain persistence and control over compromised systems. The relevant MITRE ATT&CK tactic is “Command and Control” (TA0011), specifically the technique “Remote Access Tools” (T1219).

  The primary telemetry sources are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1, which provide details on process execution. If malicious, this could severely impact an organization by allowing an adversary to remotely access sensitive systems, exfiltrate data, or establish further footholds within the network. However, this detection alone does not confirm malicious activity without additional context, as ScreenConnect can also be used legitimately for support purposes.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for processes initiated from `\\ScreenConnect.ClientService.exe`, `\\Remote Workforce Client.exe`, and similar paths. Legitimate use usually follows IT support requests.

  - **Correlate with user activity:** Identify the user associated with the process creation from the logs. Legitimate users typically run ScreenConnect during scheduled support sessions, while anomalous users or times may indicate unauthorized use.

  - **Examine network connections:** Review NetStat or equivalent logs for outgoing connections to known ScreenConnect servers or unusual IP addresses when the process is active. Look for connections on ports commonly associated with ScreenConnect (e.g., TCP 8040).

  - **Identify persistence mechanisms:** Check for scheduled tasks or startup entries that reference ScreenConnect executables. This could indicate attempts to establish persistence beyond legitimate activity.

  - **Search for additional indicators of compromise (IoCs):** Assess file creation or modification dates in the ScreenConnect installation directories for unusual timestamps that may correlate with suspected compromises.

  ### Prioritization

  This alert is moderately severe due to the potential for significant impact if remote access tools are being used maliciously. The likelihood of adversaries leveraging remote access tools for exploitation is high, as these methods are commonly used in modern cyberattacks, making prompt investigation imperative.

  ### Blind Spots and Assumptions

  Detection may be limited by adversaries using obfuscation techniques to hide their use of remote access tools. It is essential to have comprehensive logging enabled for accurate detection, including the necessary Sysmon configuration to catch detailed process creation events. Legitimate IT support activities may trigger this alert, particularly in organizations that use ScreenConnect for remote assistance. A companion detection to strengthen coverage could involve monitoring for unusual network traffic patterns to known command and control IPs typical of remote access tools.

