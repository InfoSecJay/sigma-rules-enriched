note: |
  ### Technical Context

  This rule detects process activity related to the ScreenConnect remote monitoring and management (RMM) tool, which is often used for remote access and support. An attacker could leverage ScreenConnect to gain unauthorized remote access to a system, allowing them to execute commands, steal data, or manipulate services from afar. This behavior aligns with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  The primary sources of telemetry include Windows process creation logs (Event ID 4688 or Sysmon Event ID 1), which capture the launching of any executable processes on the system. If malicious, the use of ScreenConnect could enable adversaries to conduct lateral movement or further compromise the network. Importantly, while this detection highlights the presence of ScreenConnect processes, it does NOT confirm the intention behind the usage; legitimate remote support sessions may also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs for ScreenConnect executables:** Review Security Event ID 4688 logs or Sysmon Event ID 1 for any processes ending with `ScreenConnect*.exe`, `Remote Workforce Client.exe`, or `ConnectWiseControl*.exe`. Analyze timestamps and correlate with user activity.

  - **Identify parent-child relationships:** Review the parent process associated with the detected ScreenConnect activities. If the parent process is a known legitimate executable (e.g., `explorer.exe`), this may indicate benign usage, while suspicious parent processes should raise concerns.

  - **Correlate with network connections:** Use network analysis tools to check for outbound connections made by the ScreenConnect processes. Look for unusual IP addresses or high-risk ports (e.g., 8042) that could indicate malicious intent.

  - **Identify high-confidence malicious indicators:** Search for abnormal command line parameters associated with the detected ScreenConnect processes in the logs. Parameters indicating unauthorized remote access, such as those attempting to connect to external servers, are strong indicators of malicious use.

  - **Review user account activity:** Evaluate the user accounts that initiated the ScreenConnect sessions. Legitimate use of ScreenConnect typically involves known support staff or authorized users; unknown accounts or unexpected logins may indicate unauthorized access.

  - **Assess host criticality:** Determine the business function of the affected host system. If it hosts sensitive data or critical infrastructure, prioritize this investigation to mitigate potential impacts swiftly.

  ### Prioritization

  This alert is considered medium severity because it involves a remote access tool that can potentially expose sensitive systems if misused. However, given that ScreenConnect is also used for legitimate remote support, further analysis is crucial to distinguish between valid and malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited if the ScreenConnect application is not logged correctly or if logs are poorly configured. Additionally, legitimate IT support activities could trigger this alert, particularly in environments where ScreenConnect is standard. For enhanced monitoring, consider adding detections for other remote access tools and creating companion rules that catch other known RMM utilities to strengthen coverage against potential misuse.

