note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the VIZOR Remote Monitoring and Management (RMM) tool, such as execution of various executable files commonly used by VIZOR. The likely attacker objective could involve unauthorized remote access or management of systems using compromised RMM tools, potentially leading to data exfiltration or further infiltration. The relevant MITRE ATT&CK tactic is Execution (TA0002) and technique is Remote Services (T1219). Primary telemetry sources include Windows file event logs capturing execution of specific executables from defined VIZOR installation paths. A security impact could involve disruption of services or data theft if the tool is abused maliciously. This detection does NOT confirm whether the detected activity is malicious; legitimate usage of VIZOR can trigger the alert.

  ### Investigation Steps

  - **Check process execution details**: Review Windows Security Event ID 4688 to validate the process creation timestamps, parent process, and user context related to VIZOR executables. Look for unusual parent processes like PowerShell or CMD that may suggest suspicious behavior.

  - **Validate file integrity**: Access file system logs to check the Event ID 4663 for events indicating modifications or access to paths specified in the rule. Ensure that these files haven't been recently modified or moved, which could signal parsing for malicious use.

  - **Identify system roles**: Determine the role of the impacted hosts. Legitimate usage may be expected on IT management systems or endpoints designated by organizational policy. Systems outside of this context may warrant deeper investigation.

  - **Monitor network traffic for anomalies**: Inspect network logs, specifically focusing on outbound connections and API calls related to VIZOR activity. Look for connections on uncommon ports or to unknown IPs, indicating potential C2 communication.

  - **Review user account activity**: Analyze logins and actions taken by the user account executing the VIZOR processes (Event ID 4624). Patterns of behavior that are abnormal or show privileges beyond expected usage can indicate compromise.

  ### Prioritization

  The alert has medium severity because it involves potentially sensitive systems being accessed or managed inappropriately. The likelihood of malicious abuse is moderate, as RMM tools are often targets for attackers to gain persistent access. This behavior is not commonly weaponized but can enable further attack vectors if misused.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate VIZOR activity that could generate false positives. Correct logging configurations for file events and security event logs are required for effective detection. Legitimate scheduled tasks or updates initiated by system administrators may trigger this alert. Additional coverage could include detections for abnormal network activity related to RMM tools or monitoring other execution patterns consistent with remote management activities.

