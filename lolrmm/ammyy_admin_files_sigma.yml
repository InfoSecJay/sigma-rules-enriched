  ### Technical Context

  This Sigma rule detects the presence of Ammyy Admin Remote Management Tool (RMM) log files, such as `access.log` and `AA_v3.log`, indicating possible unauthorized remote access or remote management activities on a Windows system. The likely attacker objective is to maintain persistent remote control over a compromised system, potentially for data exfiltration or lateral movement. Relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and another potential execution technique related to remote access tools.

  Primary telemetry sources for this detection are Windows file event logs, specifically focusing on file activities that involve paths ending in the specified log filenames. The security impact of detecting these log files can be significant, as they suggest potential use of remote access tools by an attacker. However, this detection does NOT confirm malicious intent on its own, as there are legitimate use cases for Ammyy Admin in both support and administration.

  ---

  ### Investigation Steps

  - **Check for legitimate usage: Compare file timestamps:** Review the process creation logs (Event ID 4688 or Sysmon Event ID 1) for the creation of Ammyy Admin files around the same timeframe. If typical support activities are recorded during these times, they may be benign.

  - **Identify malicious indicators: Search for tool persistence:** Look for scheduled tasks or startup entries related to Ammyy Admin by checking Task Scheduler (Event ID 106) and Registry keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. The creation of persistent entries may indicate malicious intent.

  - **Analyze related network activity:** Review network logs for unusual outbound connections associated with Ammyy Admin, particularly those to known C2 IP addresses or domains. Look at the port usage as the tool often uses non-standard ports which can be indicative of malicious activity.

  - **Assess file integrity monitoring logs:** If applicable, check file integrity monitoring solutions for changes to the monitored paths that may indicate modification of the log files. Pay attention to unusual file sizes or modification times which could show tampering by an attacker.

  - **Evaluate the impact of the affected asset:** If the logs are found on a critical server or system, prioritize the investigation, as the compromise could have significant repercussions such as data breaches or disruption of services.

  ---

  ### Prioritization

  This alert has medium severity in an enterprise context, as the presence of Ammyy Admin log files could indicate an intermediate level of intrusion. The risk is higher if the affected system is critical to operations, and the likelihood of abuse is moderate, given that remote access tools are often weaponized for unauthorized access.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate Admin usage to trigger the alert, which may lead to false positives. Ensuring logging for file events is properly configured is critical for reliable detection. Activities such as remote IT support or legitimate administrative functions might also trigger this alert, complicating triage efforts. A companion detection to consider is monitoring for unauthorized remote desktop connections (RDP) or other remote access logs to provide a more comprehensive view of potential malicious access.

