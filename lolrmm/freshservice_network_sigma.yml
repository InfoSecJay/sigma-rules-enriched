note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to specific Freshservice-related domains, which can indicate potential use of the Freshservice Remote Monitoring and Management (RMM) tool. Attackers may exploit this tool for command and control (C2) purposes, aiming to remotely monitor, control, or compromise exploited systems. The relevant MITRE ATT&CK techniques include Command and Control (T1071), specifically Application Layer Protocols (T1071.001) or Remote Service (T1219). The primary telemetry sources include network connection logs from Windows systems.

  If malicious, the use of Freshservice RMM could facilitate unauthorized access and persistent control over compromised hosts, undermining the integrity of the environment. However, this detection alone does NOT confirm malicious activity, as legitimate use of Freshservice by IT support personnel may also generate similar network traffic.

  ### Investigation Steps

  - **Check network connection details:** Review Windows Security Event ID 5156 (Windows Filtering Platform) logs for outbound connections. Look for events where `DestinationHostname` matches any of the specified Freshservice domains. Compare connection times with incident reports or known user activities to identify potential misuse.

  - **Review user activity context:** Examine the user’s recent activities around the time of the alert to determine if there is a legitimate business reason for the connection. Expected behavior could include authorized IT support actions, ticket updates, or maintenance activities linked to Freshservice.

  - **Validate asset criticality:** Identify the role of the affected host. If it is a critical server, the potential risk is higher. Correspond this assessment with logs of routine RMM tool usage from known service accounts or IT personnel.

  - **Identify malicious indicators:** Look for connections initiated using uncommon or unexpected user accounts that have not been documented to use Freshservice. Investigate for non-standard user-agent strings that may indicate scripted or automated malicious behavior.

  - **Correlate with internal documentation:** Check any policies or internal documentation regarding the approved use of Freshservice. Ensure that the use case aligns with organizational guidelines to filter out false positives.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems if the Freshservice RMM tool is misused. The likelihood of malicious abuse is moderate, contingent upon the specific user behavior and asset type involved. Given that tools like Freshservice can be weaponized for nefarious command and control purposes, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited if there are gaps in logging configurations or if network traffic is not thoroughly monitored across all segments. Legitimate use of the Freshservice RMM tool for IT operations may frequently trigger this alert, necessitating careful contextual analysis. A companion detection to enhance coverage could involve monitoring for unusual internal DNS queries or direct API requests to known Freshservice endpoints, which could indicate reconnaissance or unauthorized access attempts.

