note: |
  ### Technical Context

  This Sigma rule detects network connections to various Freshservice-related domains, which may indicate the use of the Freshservice Remote Monitoring and Management (RMM) tool. Attackers may exploit legitimate services for command-and-control (C2) communication or data exfiltration while masquerading as legitimate operational traffic. The relevant MITRE ATT&CK tactic is Command and Control (TA0011) and the technique is Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs, with a focus on fields that reveal destination hostnames and connection attempts. If a malicious use of these applications is confirmed, it could lead to unauthorized access to endpoints or sensitive data. However, the detection does **NOT** confirm malicious intent on its own, as legitimate usage of the Freshservice tool can trigger alerts.

  ### Investigation Steps

  - **Verify the source of the alert**: Check the originating hostname and process for network connections by examining Event ID 5156 (Windows Firewall) or Sysmon Event ID 3 (Network Connection). Confirm whether a legitimate Freshservice process is driving the connection.

  - **Identify recent network activity**: Look at network logs (e.g., Windows Event ID 5156, 5145) to analyze connection patterns to the Freshservice domains. Establish whether multiple connections are occurring in a short time frame, indicative of possible automated behavior.

  - **Determine asset context**: Assess whether the host making the connection is expected to utilize Freshservice. Review asset classifications and role assignments to identify any anomalies in the system function or expected user behavior.

  - **Review process invocation history**: Check Sysmon Event ID 1 (Process Creation) for the process responsible for the network connection. Look for unusual arguments or parent-child relationships that signal potential misuse compared to known good examples of Freshservice usage.

  - **Assess for high-confidence malicious indicators**: Look for connections to less commonly used Freshservice domains, or unusual traffic patterns suggesting data exfiltration. If there are associated file creations or uploads (Event ID 4663, File Access), this may indicate compromised hosts.

  - **Document legitimate usage patterns**: Compare the alerting connection activity with legitimate Freshservice usage. Approved scheduled tasks or regular update connections to known domains can help delineate normal operations from potential threats.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized access to the organization's systems via a legitimate tool. The likelihood of malicious abuse exists if attackers leverage trusted services for C2 operations, a tactic that is recognized and frequently weaponized across various threat vectors.

  ### Blind Spots and Assumptions

  Detection may have limitations if legitimate Freshservice activity is extensive or not properly logged. Overly permissive firewall rules can obscure malicious connections. Furthermore, non-human actors, such as automated scripts or compromised services, could easily replicate legitimate patterns, triggering alerts. A companion detection for user account anomalies (e.g., multiple failed authentication attempts) could provide complementary insights to strengthen coverage.

