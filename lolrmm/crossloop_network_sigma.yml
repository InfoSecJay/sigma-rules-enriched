note: |
  ### Technical Context

  This detection identifies network activity associated with the CrossLoop Remote Management and Monitoring (RMM) tool. The likely adversary objective could involve unauthorized remote access or control over a victim's system, effectively allowing them to manipulate data or execute malicious operations. This behavior fits into the MITRE ATT&CK framework under the tactics of Command and Control (T1071) and Remote Services (T1219).

  The primary telemetry source is Windows network connection logs, specifically looking for connections to hostnames associated with CrossLoop domains. If malicious, the impact could be significant as it may give an attacker persistent access to sensitive assets. However, this detection does NOT inherently confirm malicious activity, as CrossLoop may be used legitimately by certain users for remote assistance.

  ### Investigation Steps

  - **Check Destination Hostnames:** Review network connection logs for entries with `DestinationHostname` ending in `.crossloop.com` or `crossloop.en.softonic.com` (Event ID 5156). Document the specific hosts accessed.

  - **Identify User Behavior:** Investigate the user account associated with the network connection to determine if this behavior aligns with expected activity. Legitimate usage of CrossLoop would typically involve known technician accounts accessing the service for IT support.

  - **Analyze Source IPs:** Trace the source IP addresses making connections to CrossLoop hosts using firewall logs (Firewall Event ID 20002). Look for patterns or known bad actors in outgoing connection attempts.

  - **Review Session Details:** Check for any established sessions or remote desktop events (Event ID 4624) that followed the CrossLoop network connection. High-confidence malicious indicators include rapid succession of logon events from unusual user accounts.

  - **Assess Asset Criticality:** Evaluate the role of the host making the CrossLoop connections (e.g., is it a critical server or endpoint?). Remote access from such systems will need closer scrutiny for potential compromise.

  - **Document Legitimate Use Cases:** Compile information on any known organizational use of CrossLoop, including approved software inventory and asset tags, to help discern benign from malicious actions.

  ### Prioritization

  This alert should be treated with medium severity. The impact can be significant if sensitive systems are involved, and the likelihood of malicious exploitation is real due to the tool’s capabilities in remote access. While CrossLoop may be used legitimately, its presence warrants further investigation.

  ### Blind Spots and Assumptions

  Evasion techniques might include using alternative remote management tools or masking traffic through different protocols. The detection relies on consistent logging of outbound connection attempts, which must be enabled on firewalls for reliable tracking. Legitimate use cases could arise if personnel within the organization are using CrossLoop for remote support. A related detection that strengthens coverage could be alerts for unusual outbound connections to non-whitelisted domains.

