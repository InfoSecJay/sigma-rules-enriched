  ---

  ### Technical Context

  This Sigma rule detects process creation by the TeraCLOUD Remote Monitoring and Management (RMM) tool, specifically triggered by a parent process named `Livedrive-Setup.exe`. The typical attacker objective would involve using TeraCLOUD for unauthorized remote access, system management, or data manipulation, aligning with the MITRE ATT&CK technique "Remote Access Software" (T1219). The primary telemetry source is Windows process creation events, particularly Security Event ID 4688 and Sysmon Event ID 1, which reveal details about spawned processes and their parent-child relationships.

  If confirmed malicious, this behavior could indicate a breach leading to significant security impacts, such as unauthorized access to sensitive systems or data exfiltration. However, merely detecting this process does NOT confirm malicious intent, as TeraCLOUD may be legitimately employed by IT or support teams for maintenance.

  ---

  ### Investigation Steps

  - **Check process creation details:** Review Security Event ID 4688 and Sysmon Event ID 1. Look for `Livedrive-Setup.exe` spawning TeraCLOUD processes. Malicious processes may have unusual command-line arguments or environment variables.

  - **Identify parent process context:** Evaluate the full command line of `Livedrive-Setup.exe`. Legitimate instances often appear in corporate environments for software deployment. Note any deviations such as unexpected execution paths or arguments.

  - **Correlate user activity:** Examine the user account associated with the process creation. Malicious activity often involves non-admin accounts or unusual logins. Compare against normal operational logs to identify discrepancies.

  - **Inspect network connections:** Analyze outbound connections tied to the TeraCLOUD process using firewall or network logs. Look for connections to unfamiliar IP addresses or domains, indicative of potential data exfiltration.

  - **Review system roles and asset criticality:** Confirm if the host is designated as a high-value asset or part of IT infrastructure. The compromise of such systems would significantly escalate risk.

  - **Identify high-confidence malicious indicators:** Investigate if there are known IOCs related to TeraCLOUD associated with prior incidents. Presence of these indicators should raise immediate concerns regarding the legitimacy of the activity.

  ---

  ### Prioritization

  This alert's severity is medium due to the potential for significant impact if TeraCLOUD is misused to access sensitive systems. The likelihood of malicious abuse is moderate, as threat actors may weaponize RMM tools for lateral movement or reconnaissance. However, it is vital to recognize that this application is also used legitimately within enterprises, necessitating careful investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by lack of complete logging, as certain system configurations might not capture all instances of process creation or user activity. Legitimate use of RMM tools may trigger the alert, making contextual information essential for accurate triage. A companion detection to consider is monitoring for network traffic to or from known malicious IPs associated with RMM tools, enhancing contextual awareness and coverage.

