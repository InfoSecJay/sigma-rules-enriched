  ### Technical Context
  This detection rule aims to identify potential execution of the TeraCLOUD Remote Monitoring and Management (RMM) tool through process creation events where the parent image ends with `Livedrive-Setup.exe`. The TeraCLOUD RMM tool can be utilized by administrators for legitimate system management purposes; however, it can also be exploited by malicious actors for unauthorized access and control over target environments. Therefore, this rule provides visibility into an activity that could indicate misuse or malicious intent.

  The likely threat scenario involves attackers attempting to gain unauthorized access, maintain persistence, or exploit RMM capabilities to manipulate systems within the network. Such activities align with the MITRE ATT&CK tactics of Execution (ID: TA0002) and Initial Access (ID: TA0001), specifically under the technique of User Execution (ID: T1219), where a user inadvertently executes malicious code.

  Primary data sources for this detection include Windows process creation logs, which provide insights into executed processes and their parent-child relationships, as well as application installation logs, where such RMM tools may be recorded.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the process creation logs for any instances where `Livedrive-Setup.exe` appears as the parent process to identify related child processes.
  - **Analyze Process Behavior:** Examine the behavior of any detected child processes for unusual activities, such as network connections made to unfamiliar IP addresses or processes attempting to access sensitive files.
  - **Check for User Activity:** Correlate the detected activity with user accounts that initiated the RMM tool to assess whether the execution was consistent with legitimate administrative tasks or indicative of credential compromise.
  - **Evaluate Network Traffic:** Look at network logs to track any outgoing connections established by the RMM tool to identify if data exfiltration or communication with known malicious IPs is occurring.

  ### Prioritization
  This alert is tagged as medium severity due to the potential for misuse of RMM tools, particularly in environments where operations can be significantly compromised by unauthorized access or manipulation. The likelihood of risk varies based on the organization's exposure to threat actors and the sensitivity of the environment.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may include other legitimate applications that mimic the behavior of the TeraCLOUD tool or cases where malicious actors utilize different methods to obscure their activities. The detection logic assumes that the presence of `Livedrive-Setup.exe` as a parent process is inherently suspicious. For this alert to function effectively, sufficient logging must be enabled for process creation events on Windows systems, and any protective measures that prevent such execution must be appropriately configured.

