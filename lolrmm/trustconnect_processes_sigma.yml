note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the TrustConnect Remote Monitoring and Management (RMM) tool, specifically `TrustConnectAgent.exe` and `DocConnect.Agent.exe`. The likely attacker objective is to establish remote control or management of compromised systems, often to exfiltrate data or deploy additional malicious payloads. This behavior aligns with the MITRE ATT&CK tactics of Command and Control (TA0011) and the technique of Application Layer Protocol (T1219).

  The primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If the detected activity is not legitimate, it can lead to significant security impacts such as unauthorized access and data breaches. Importantly, this detection does NOT prove that malicious activity is occurring; it merely flags the presence of these specific processes.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Security Event ID 4688 and Sysmon Event ID 1 for `TrustConnectAgent.exe` or `DocConnect.Agent.exe`. Check for timestamps and associated user accounts. Benign behavior typically includes these processes running under known system accounts with a recognizable authorized usage context.

  - **Correlate with parent process:** Identify the ParentImage of the detected processes. Look for `ParentImage` values that indicate legitimate administrative tools or user-initiated actions. Malicious indicators may show unusual parent processes or execution context.

  - **Examine network connections:** Review outbound network connections and logs (e.g., from Windows Firewall or IDS/IPS logs) for traffic associated with the TrustConnect processes. Look for unusual external IPs or domains, which can be a sign of potential data exfiltration or C2 communication.

  - **Check for unusual command-line arguments:** Extract command-line arguments associated with the executed processes from Event ID 4688 or Sysmon logs. Malicious usage may include flags or parameters that are not part of typical administrative tasks.

  - **Validate installation paths:** Verify the file paths of the detected executables. Legitimate installations are typically found in `C:\Program Files\` or similar directories. Malicious installations may stray outside of standard directories or alter their filenames.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of remote access tools on sensitive systems. The likelihood of malicious abuse is notable, given that such tools are frequently weaponized in real-world attacks. An investigation is warranted especially if there are no known legitimate users for the applications detected.

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that legitimate uses of TrustConnect can trigger these alerts, creating false positives. Ensure logging configurations for process creation are enabled and comprehensive. Additionally, legitimate remote administration practices may trigger similar alerts; therefore, correlating with user activity logs is crucial. A companion detection to consider is monitoring for suspicious parent processes that could indicate exploitation of the RMM tools.

