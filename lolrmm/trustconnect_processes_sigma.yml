note: |
  ### Technical Context

  This Sigma rule detects the execution of processes commonly associated with the TrustConnect Remote Monitoring and Management (RMM) tool. The likely attacker objective is to gain unauthorized access or control over an endpoint, potentially leading to further malicious activities, such as data exfiltration or lateral movement. The relevant MITRE ATT&CK tactic is **Execution**, and the technique is **Remote Services: RMM** (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this could enable an adversary to manage and control an endpoint remotely, posing significant security risks. Importantly, this detection alone does NOT confirm malicious intent, as the TrustConnect tool may be used legitimately in managed environments.

  ### Investigation Steps

  - **Review process creation events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for instances where the Image field ends with 'TrustConnectAgent.exe' or 'DocConnect.Agent.exe'. Compare timestamps with your understanding of legitimate tool usage in your organization.

  - **Identify legitimate usage patterns:** Look for established schedules or documented processes that clarify when TrustConnect should be utilized. Note whether the processes align with typical maintenance windows or specific administrative activities.

  - **Correlate with user accounts:** Cross-reference the process initiation event with user accounts found in the SubjectUserName field to determine if the executing user has appropriate privileges for accessing TrustConnect.

  - **Check for abnormal command-line arguments:** Analyze the CommandLine field of the process creation logs to identify any unusual or suspicious arguments that may suggest malicious intent alongside the execution of TrustConnect processes.

  - **Look for associated side effects:** Inspect for related activities such as file creation/exfiltration events, especially in critical directories, or connections to external IPs that may flag suspicious behavior, indicating potential remote access or data theft.

  - **Assess the endpoint role and criticality:** Determine if the affected system is critical or highly sensitive and if it has corresponded with any recent security incidents that could suggest exploitation of TrustConnect.

  ### Prioritization

  This alert carries medium severity due to the potential risk of exposing sensitive systems to unauthorized remote management. The likelihood of abusive use of RMM tools is significant, especially for targeted attacks, though legitimate uses do exist. Detecting this behavior is relevant as it can act as an entry point for more complex threats.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate TrustConnect usage and could result in false positives if the tool is widely utilized in the environment. This rule relies on appropriate logging configurations for process creation and may miss covert executions or misconfigurations of legitimate tools. A related detection to bolster coverage could involve monitoring outbound network connections for unusual external communications initiated by RMM tools.

