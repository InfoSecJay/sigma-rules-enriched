note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Lavawall RMM (Remote Monitoring and Management) tool on Windows systems. The observed behavior primarily indicates attempts to manage or interact with systems remotely, potentially by unauthorized users or adversaries. The likely attacker objective is to establish a backdoor for persistent access or to perform reconnaissance and actions on a compromised network segment. This detection aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and specifically targets the technique “Application Layer Protocol” (T1219).

  The primary telemetry sources are Windows file event logs, particularly monitoring for specific executables and scripts associated with Lavawall. If found on an unauthorized system, this behavior poses a security risk, as adversaries may exploit RMM tools for lateral movement, data exfiltration, or system manipulation. It is critical to note that this detection does NOT confirm malicious intent on its own, as legitimate instances of Lavawall might exist within the environment.

  ### Investigation Steps

  - **Review file event logs for suspicious executions:** Check Windows Security Event ID 4663 for file access logs and filter for `TargetFilename` entries ending with `\Lavawall\*.exe` or `\Lavawall\*.ps1`. Compare timestamps to assess if the usage aligns with known legitimate business hours.

  - **Verify the system context of the detected activity:** Confirm whether the detections are occurring on high-value assets, such as servers or critical infrastructure. Use asset management tools to determine the expected baseline for applications installed on those systems.

  - **Analyze the execution path and file origin:** Check the file paths and creation times for `LavawallWin.exe` and `remote-agent.exe`, corroborating with Sysmon Event ID 10 to investigate process creation and parent-child relationships. Look for unexpected origins or execution by non-administrative accounts.

  - **Identify legitimate use cases for Lavawall on file event logs:** Gather intelligence on approved usage scenarios for RMM tools within the organization. Document specific asset roles where such tools are expected and assess if the alert aligns with organizational policies.

  - **Search for indicators of compromise (IOCs):** Look for unusual outbound network connections in firewall logs associated with the identified Lavawall files, focusing on Event ID 5156 from the Windows Filtering Platform and resolving any associated IP addresses against threat intelligence databases.

  - **Check for modifications to file attributes:** Use Event ID 4656 to identify attempts to modify critical file attributes of the mentioned Lavawall files, which often indicates an attempt to hide malicious behavior or persistence mechanisms.

  ### Prioritization

  This alert is medium severity due to the potential exploitation of RMM tools by adversaries to gain unauthorized access to systems. Given that RMM tools are often weaponized for lateral movement, the alert necessitates review. Affected systems, particularly those in sensitive roles, heighten the risk of impactful breaches.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion tactics such as renaming executables or modifying file timestamps, which can mask malicious intent. Reliable detection requires comprehensive visibility into file access and network activity surrounding RMM tools. Legitimate administrative use of Lavawall can trigger alerts, necessitating context from IT operations to discern between benign and malicious activity. Companion detection via signs of unauthorized remote access (e.g., unexpected RDP sessions) can enhance threat detection capabilities.

