note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with Faronics Deploy, a remote monitoring and management (RMM) tool. Adversaries may exploit RMM tools like Faronics to establish persistent access, gather intelligence, or execute commands on compromised systems. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1102) and technique of Application Layer Protocol (T1071).

  The primary telemetry source is Windows network connection logs that capture DNS queries or direct outbound connections. If malicious, this activity could enable remote control over the environment, potentially leading to further exploitation. This detection does NOT confirm that an intruder is present or successfully exfiltrating data; legitimate Faronics Deploy activity could trigger similar alerts.

  ### Investigation Steps

  - **Verify network connections:** Review Windows Event ID 5156 (Windows Filtering Platform) and look for outbound connections to domains such as `deploy.faronics.com` or `faronicscloud.com`. Check timestamps and user accounts initiating these connections.

  - **Assess legitimate use:** Determine if the Faronics Deploy tool is approved and expected within the environment by checking installation records and operational schedules. Confirm if legitimate accesses match documented procedures.

  - **Identify high-confidence malicious indicators:** Search for patterns in the network connection logs indicating unusual access times or connections made by non-admin users to Faronics-related domains. Look for repeated connection attempts within a short time frame.

  - **Correlate with other telemetry:** Cross-reference findings with endpoint logs (Sysmon Event ID 3 - Network Connection) to detect any processes connecting to these domains. Review the parent process details for any potentially suspicious activities.

  - **Evaluate system impact:** Focus on the criticality of the affected system. Systems hosting sensitive data or key operational roles should be prioritized for immediate investigation.

  - **Collect additional evidence:** If suspicious connections are confirmed, check for evidence of file creations or modifications that may align with remote access tools, such as new executables downloaded from the Faronics domains.

  ### Prioritization

  This alert has medium severity due to the potential for unauthorized remote access to enterprise systems. The likelihood of malicious abuse is moderate, as RMM tools can be weaponized for lateral movement and data exfiltration. However, frequent legitimate use within an organization may dilute overall impact.

  ### Blind Spots and Assumptions

  The detection may be bypassed through DNS tunneling or by using encrypted communication channels without domain resolution. It requires comprehensive logging settings within the SIEM, including proper capture of outbound connections. Legitimate activities such as system maintenance or updates using Faronics Deploy may trigger the alert without malicious intent. A companion detection could include monitoring for unexpected administrative tasks that correlate with these network sessions, enhancing oversight into potentially compromised segments.

