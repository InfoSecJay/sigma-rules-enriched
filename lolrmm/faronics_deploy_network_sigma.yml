note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the Faronics Deploy remote management tool. These connections may indicate unauthorized use of this tool, which can include activities like remote monitoring, software deployment, and system configuration changes. The attacker objective with this behavior could be to exploit the Faronics tool for unauthorized access or control over endpoints within the environment. Relevant MITRE ATT&CK techniques include Command and Control (T1071) and Remote Services (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically tracking DNS lookups and outbound connections. If malicious, the impact could involve unauthorized access to systems, potential data exfiltration, or manipulation of those systems. It’s important to note that this detection does NOT confirm malicious intent on its own, as the Faronics Deploy tool is also used legitimately within enterprises.

  ### Investigation Steps

  - **Review network connection logs:** Check for Windows Event ID 5156 (Windows Filtering Platform) logs for outbound connections to the detected Faronics domains. Pay attention to the source IP and the applications initiating the connections.

  - **Verify DNS lookups:** Look for DNS query logs (such as from internal DNS servers) for queries matching the Faronics domains. Confirm whether the querying machine falls within expected asset roles (e.g., managed endpoints).

  - **Assess the application behavior:** Identify if the connections are initiated by known legitimate instances of Faronics Deploy by reviewing the process details in associated logs (Event ID 4688 for process creation). Confirm application version and authorized use cases.

  - **Check for unusual activity:** Look for suspicious patterns like multiple connections from a non-administrative endpoint or connections during odd hours that may indicate abuse. Validate against baseline activity within the network.

  - **Identify direct indicators of compromise:** Investigate if any associated executable files or scripts were launched prior to the connection attempts, indicating unauthorized use of Faronics Deploy to manipulate or control systems.

  - **Document legitimate activities:** Note any legitimate usage of Faronics Deploy in the environment, such as scheduled maintenance or deployment tasks that occurred around the same time frame as the alert to differentiate between malicious and benign instances.

  ### Prioritization

  This alert is of medium severity as it pertains to network activity from a potentially powerful management tool. Its misuse can lead to significant system manipulation or access, increasing the likelihood of malicious abuse in cases where it is misconfigured or exploited. While the behavior itself is not uncommon, it is crucial to assess the context of the connection.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of network logs or if legitimate traffic to the Faronics domains is not adequately monitored. Certain legitimate administrative actions may trigger this alert, necessitating an understanding of baseline operations within the environment. Companion detections that could strengthen coverage include monitoring for unauthorized installation of management tools via application install logs or endpoint detection solutions, ensuring no other suspicious activities occur in parallel.

