note: |
  ### Technical Context

  This rule detects network activity associated with the Auvik Remote Monitoring and Management (RMM) tool, which may indicate the use of this software for unauthorized system monitoring or control. The likely attacker objective is to leverage the RMM tool’s capabilities for reconnaissance or remote access in an unauthorized manner. The event maps to the MITRE ATT&CK tactics "Execution" (TA0002) and the technique "Remote Access Tools" (T1219). The primary telemetry sources include Windows network connection logs, particularly DestinationHostnames associated with known Auvik domains. The security impact of malicious use can range from system compromise to data exfiltration. Importantly, this detection alone does not confirm malicious activity, as legitimate use of Auvik could also trigger this alert.

  ### Investigation Steps

  - **Check network logs for Auvik activity:** Review Windows Event ID 5156 (Windows Filtering Platform) to identify outbound connections to `*.my.auvik.com` and `*.auvik.com`. Look for unusual timings or systems that shouldn't be connecting to these domains.

  - **Identify source processes:** Collect Sysmon Event ID 3 (Network Connection) to find out which processes are initiating connections to Auvik's domains. Legitimate processes will often include known RMM management executables.

  - **Determine asset role:** Validate the role of affected hosts. If they are not designated to use Auvik (e.g., non-IT systems), this may indicate potentially malicious usage.

  - **Correlate with other signals:** Check for any recent logins from unusual user accounts or failed authentication attempts correlated with the network activity. Use Security Event ID 4624 (Logon) and 4625 (Failed Logon).

  - **Review for unauthorized software:** Examine installed applications and departures from the authorized software baseline on relevant endpoints. Cross-reference with typical RMM tools for legitimacy.

  - **Document evidence of exfiltration risk:** Check for file activity on the affected hosts that may indicate exfiltration (Sysmon Event ID 11 for file creation) after the detected network connections, ensuring to validate the context of file types and sizes.

  ### Prioritization

  This alert is of medium severity due to the potential for Auvik to be leveraged for malicious purposes, particularly if detected on sensitive or critical systems. The likelihood of abuse is significant since remote access tools are commonly weaponized for attacker persistence and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the possibility of network filtering or DNS resolution policies obscuring legitimate Auvik traffic from analysis. Reliable detection requires comprehensive logging of outbound connections and installed software verification. Legitimate system administrators may regularly use Auvik, which could cause false positives. A companion detection to consider includes identifying unauthorized software installations (e.g., via software inventory logs) to reinforce understanding of installed tool usage on the network.

