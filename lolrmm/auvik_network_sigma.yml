note: |
  ### Technical Context

  This Sigma rule detects network connections to Auvik, a remote monitoring and management (RMM) tool commonly used for IT infrastructure management. Attackers may leverage RMM tools to gain unauthorized access to organizational networks, perform lateral movement, or manage devices remotely without consent. The relevant MITRE ATT&CK tactics and techniques for this detection are "Execution" (TA0002) and "System Information Discovery" (T1219).

  Primary telemetry sources include Windows event logs, specifically network connection logs that show outbound connections to domains associated with Auvik (e.g., `*.my.auvik.com`, `*.auvik.com`). If the logged activity is malicious, it could allow an adversary to control systems or exfiltrate data. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate tool usage may trigger this alert.

  ### Investigation Steps

  - **Review network connection logs**: Look for Security Event ID 5156 (Windows Filtering Platform) to identify outbound connections to Auvik domains. Compare the timestamps and source IPs against known legitimate management activity to establish context.

  - **Check for authorized Auvik installations**: Investigate if Auvik is installed on the affected host(s) by examining installed applications (Control Panel -> Programs and Features). Legitimate installations should correlate with regular operations and known authorized personnel.

  - **Analyze user account activity**: Monitor Event ID 4624 (Logon) for user accounts accessing systems that initiated connections to Auvik. Check if these users have been granted permissions to perform remote monitoring or management activities.

  - **Identify high-confidence malicious indicators**: Look for unusual behavior, such as multiple rapid connections to Auvik domains from atypical user accounts or devices. This pattern may denote credential compromise and unauthorized access attempts.

  - **Verify potential exfiltration attempts**: Inspect outbound traffic to confirm if there were large data transfers to Auvik domains that deviate from established data protocols or volumes associated with legitimate activities.

  ### Prioritization

  This alert warrants medium priority as it may indicate unauthorized remote access to network assets. The affected systems’ criticality impacts the urgency of the investigation. Although Auvik is a legitimate tool, adversaries can exploit it for malicious activities, making this a vital threat to monitor.

  ### Blind Spots and Assumptions

  Detection limitations may include the possibility of legitimate Auvik usage which could lead to false positives if not correlated with context. Reliable detection requires proper endpoint logging configurations and regular reviews of legitimate use cases. Additionally, legitimate IT operations or external partners authorized to use RMM tools may trigger this alert. A companion detection might involve monitoring for unusual process creations related to Auvik installations to strengthen coverage.

