  ---

  ### Technical Context

  This rule detects network connections initiated by the Auvik Remote Monitoring and Management (RMM) tool, which may indicate unauthorized use or compromise. Attackers may use Auvik for reconnaissance, lateral movement, or to deploy payloads within a network. The relevant MITRE ATT&CK tactic is **Execution** (T1203) as it signifies an execution of network actions potentially leading to further exploitation. Primary telemetry sources include network connection logs specifically monitoring outbound traffic to Auvik domains (*.my.auvik.com, *.auvik.com, auvik.com). If malicious, this could allow an attacker to maintain persistence and control over compromised systems. Importantly, this detection does NOT confirm malicious activity on its own without further corroborative evidence.

  ---

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) to analyze outbound connections to Auvik-related domains. Look for connections outside of established usage patterns within the environment.

  - **Investigate registered applications:** Validate whether the Auvik tool is legitimately listed in installed applications (e.g., via PowerShell **Get-InstalledProgram**). Understand expected operational behavior and authorized use cases to distinguish between benign and malicious alerts.

  - **Assess host activity:** Review Sysmon Event ID 3 to correlate the source process making connections to Auvik domains. Check for unusual process names or those not aligned with authorized administrative tools.

  - **Examine source IP behavior:** Cross-reference the outbound connection source IP with logs from a firewall (e.g., Fortinet, Palo Alto) using specific fields such as `src_ip` and `dst_fqdn`. Flag multiple repeated connections within a short timeframe as suspicious.

  - **Monitor for additional behavior:** Investigate other potential network activities or processes that may be anomalous following the detection. Check for sequential connections to new IP addresses or domains indicating reconnaissance or lateral movement.

  ---

  ### Prioritization

  Given that Auvik is a legitimate RMM tool, alerts will have medium severity unless strong indicators of compromise exist. The impacted systems may possess critical administrative capabilities, increasing the risk of abuse if compromised. Such network behaviors are commonly weaponized, especially in targeted attacks against managed services.

  ---

  ### Blind Spots and Assumptions

  This detection may miss deliberately modified connections from attackers using similar domains or disguising malicious traffic with legitimate Auvik processes. Required log sources include properly configured network connection monitoring and Sysmon logs for comprehensive visibility. Legitimate admin activities during maintenance windows could trigger this alert. Another useful detection to reinforce coverage is monitoring internal traffic patterns for unexpected communication to known RMM tools, which may highlight compromised environments or misuse.

