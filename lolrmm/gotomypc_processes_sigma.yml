note: |
  ### Technical Context

  This Sigma rule detects processes spawned by the GoToMyPC remote management tool, specifically tracing parent-child relationships indicative of its execution. The likely attacker objective involves unauthorized remote access to the victim's system, enabling the adversary to control or exfiltrate sensitive data, which aligns with the MITRE ATT&CK technique for Remote Services (T1219). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, tracking process initiation and parent processes. If malicious, this could result in loss of confidentiality and integrity of organizational data. This detection does NOT confirm malicious intent solely based on the presence of GoToMyPC, as the tool may be used legitimately within the enterprise.

  ### Investigation Steps

  - **Check process creation details**: Review Windows Security Event ID 4688 logs for the creation of 'G2M.exe'. Focus on the CommandLine field for suspicious arguments that may indicate an unauthorized access attempt.

  - **Correlate parent-child process relationships**: Analyze Sysmon Event ID 1 to determine if 'G2M.exe' was spawned as a child process from a known legitimate application. Look for unusual parent processes that may signify malicious activity.

  - **Evaluate user context**: Identify the user account associated with the process creation by examining Event ID 4688. Determine whether it corresponds to privileged accounts or unexpected users operating from unusual geographic locations.

  - **Investigate additional telemetry**: Review network logs for connections initiated by 'G2M.exe'. Pay attention to unusual IP addresses or endpoints contacted by the remote management tool which could indicate unauthorized access.

  - **Establish baseline for legitimate activity**: Confirm known legitimate uses of GoToMyPC by checking organizational usage policies, identifying authorized users, device roles, and endpoint locations to discern expected behavior against flagged activities.

  ### Prioritization

  This alert warrants medium priority due to the potential impact on sensitive systems and likelihood of misuse for unauthorized access. While GoToMyPC may be used legitimately, its capabilities are commonly weaponized by adversaries for remote exploitation, necessitating timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of GoToMyPC, leading to false positives when used within authorized scopes. Required log sources must be configured correctly, ensuring Windows process and Sysmon logging is enabled for effective detection. Also, benign activities such as software updates or authorized user support sessions may trigger this alert. Companion detections may include monitoring for further suspicious network activity related to remote access tools, enhancing overall coverage.

