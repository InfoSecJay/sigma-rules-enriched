note: |
  ### Technical Context

  This rule detects the execution of the GoToMyPC remote monitoring and management (RMM) tool, specifically identifying processes that have `G2M.exe` as the parent or the image itself. The likely attacker objective is to establish remote access to a target system, facilitating control and data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of **Command and Control** (T1071) and the technique of **Application Layer Protocol** (T1219).

  The primary telemetry sources for this detection include Windows Process Creation logs (Security Event ID 4688) and potentially Sysmon Event ID 1. If malicious, this activity poses a significant risk as it may allow unauthorized access and manipulation of system resources. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use of GoToMyPC by authorized personnel can trigger this alert.

  ### Investigation Steps

  - **Validate process origin:** Check the `Image` field of the event for `\G2M.exe`. If found, this could indicate legitimate usage or potential misuse depending on context.

  - **Assess parent process chain:** Review the `ParentImage` field in the process creation event to confirm it also points to `\G2M.exe`. Legitimate activity often originates from known administrative tools, whereas unexpected parent processes could indicate malicious intent.

  - **Identify user context:** Investigate the account that initiated the `G2M.exe`. If it’s a non-admin user or a service account with no legitimate need for RMM tools, flag as suspicious.

  - **Examine concurrent network activity:** Analyze Windows Firewall logs (Event ID 5156) for outbound connections from the system utilizing `G2M.exe`. Connections to unusual or untrusted IP addresses may indicate malicious command and control communications.

  - **Review execution context:** Examine the time of execution in relation to user activity logs. Usage during off-hours or during periods of known organizational downtime is a red flag.

  - **Identify high-confidence indicators:** Any creation or modification of files related to remote access within known directories (e.g., C:\Program Files\GoToMyPC) during this process's execution could indicate malicious activity, especially if occurring unexpectedly.

  ### Prioritization

  This alert should be considered medium priority due to the potential for unauthorized remote access on an impacted system. The system's role (e.g., sensitive data handling or critical infrastructure) may elevate alert priority. While GoToMyPC has legitimate purposes, its frequent abuse in attacks necessitates careful scrutiny of detected events.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by renaming the executable or using similar processes, which may not be captured by this rule. The successful detection relies on proper logging configurations; ensure Windows Process Creation logs are fully enabled. Legitimate administrative activities can trigger this alert, particularly in remote support scenarios. Companion detections, such as monitoring for unusual API calls or PowerShell scripts that invoke remote access tools, would enhance coverage and provide context during investigations.

