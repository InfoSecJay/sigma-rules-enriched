note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the SkyFex Remote Management Tool (RMM), particularly focusing on `Deskroll.exe` and `DeskRollUA.exe`. These tools are often leveraged by attackers for remote access and management, potentially aiming to establish persistence on a compromised system or to exfiltrate data. The relevant MITRE ATT&CK techniques are Command and Control (T1071) and Remote Services (T1219).

  The primary telemetry sources are Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 (Process Creation). If these processes are maliciously employed, the security impact includes unauthorized access to sensitive information and system control. This detection does NOT confirm that the activity is unequivocally malicious, as legitimate use of SkyFex RMM may trigger the alert.

  ### Investigation Steps

  - **Examine Process Creation Events**: Review Security Event ID 4688 or Sysmon Event ID 1. Check for `Image` paths containing `\\Deskroll.exe` or `\\DeskRollUA.exe`. Look for parent processes associated with the activation of these executables, such as legitimate IT support tools.

  - **Identify Anomalous Parent Processes**: Look for unusual parent processes in conjunction with `Deskroll.exe` or `DeskRollUA.exe`. Legitimate instances will commonly have known system or IT support tool parents; any unexpected parent should raise suspicion.

  - **Validate Execution Context**: Check the time and user associated with the alert. If the process is spawned by a local or service account during odd hours, it may indicate atypical behavior, warranting further scrutiny.

  - **Cross-reference Installed Applications**: Review installed software on the affected system to confirm whether SkyFex RMM is officially deployed (via software inventory tools). Unauthorized installations can indicate an attacker's foothold.

  - **Check Network Connections**: Investigate any outbound connections initiated by the detected processes. Use Windows Event ID 5156 (Windows Filtering Platform) to identify remote servers contacted. Malicious indicators include connections to known C2 infrastructure.

  - **Assess for Exfiltration Artifacts**: If the context suggests malicious remote access, check for file creation, modification, or transfers associated with the user under suspicious conditions. Investigate any unusual file activity related to sensitive data during the active period of the processes.

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems if remote access is maliciously exploited. Given that tools like SkyFex RMM can be weaponized for legitimate and illegitimate tasks, the likelihood of malicious use warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of SkyFex RMM, which could generate false positives in environments where it's sanctioned. Additionally, for reliable detection, logging configurations for both process creation and network connection events must be enabled. Legitimate remote support activities might trigger the alert, particularly during maintenance windows. A related detection for remote access tools would strengthen coverage, such as monitoring for other known RMM applications based on similar indicators.

