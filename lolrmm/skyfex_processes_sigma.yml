note: |
  ### Technical Context

  This rule detects potential process activity related to the SkyFex Remote Management Tool (RMM) by monitoring for creation of processes with specific parent and child images, namely `Deskroll.exe` and `DeskRollUA.exe`. The primary attacker objective may involve remote access to a compromised system, facilitating lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide insights into process execution details. If malicious, this behavior could result in unauthorized remote access and control over systems. However, this detection alone does not confirm malicious intent, as legitimate use of the SkyFex tool may also trigger this alert.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Event ID 4688 for instances where the `Image` field is `Deskroll.exe` or `DeskRollUA.exe`. Cross-reference the `ParentImage` to identify legitimate vs. suspicious parent processes.

  - **Analyze user and system context:** Investigate the user initiating the process. Confirm whether the user has legitimate business use for the SkyFex tool or if the host system is a critical asset requiring closer scrutiny.

  - **Check for unusual process arguments:** Look for unusual command-line arguments in the process creation event log. Use Event ID 4688's `NewProcessName` and `CommandLine` fields to identify non-standard usage patterns.

  - **Correlate with network activity:** Validate outbound connections associated with these processes. Examine firewall or proxy logs for traffic patterns to known SkyFex servers or uncommon external IP addresses.

  - **Identify service accounts or scheduled tasks:** Investigate if the processes are being invoked by service accounts or via Task Scheduler. Review Task Scheduler logs (Event IDs 106, 200) for any suspicious activity linked to the SkyFex process.

  ### Prioritization

  The severity of this alert is medium due to the potential for unauthorized remote access to sensitive systems. The impact is significant if critical systems are involved, and there is a realistic risk of malicious abuse, as remote access software can be weaponized in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate usage of SkyFex, which can lead to false positives. Reliable detection requires proper logging configurations for process creation and potentially, network traffic. Legitimate use cases such as system administration or support activities may trigger alerts. Additional detections, such as monitoring for abnormal outbound connections during alerts, can enhance overall visibility against potential misuse.

