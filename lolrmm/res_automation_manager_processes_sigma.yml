  ### Technical Context

  This Sigma rule detects the execution of processes related to the RES Automation Manager Remote Monitoring and Management (RMM) tool, specifically identifying instances where these processes are spawned by known parent processes such as `wisshell*.exe` and `wmc.exe`. The likely attacker objective may include using the RMM tool for unauthorized remote access and systems manipulation.

  Relevant MITRE ATT&CK tactics and techniques include Execution (TA0002) and Application Layer Protocol (T1219). The primary telemetry source is Windows process creation logs, specifically Event ID 4688 or Sysmon Event ID 1, which record detailed information about the creation of new processes. If malicious, this behavior could indicate a compromise, as unauthorized use of remote management tools can facilitate lateral movement and data exfiltration. However, this detection alone does not confirm malicious activity; legitimate administrative use of RES Automation Manager is also common.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 and Sysmon Event ID 1 to find the process details including `New Process Name`, `Parent Process ID`, and `Command Line` arguments associated with the detected activity.

  - **Correlate parent processes:** Look at the parent processes listed such as `wisshell*.exe` or `wmc.exe`. If these processes have recently been executed, gather their specific telemetry to understand the context of the alert.

  - **Evaluate user context:** Validate the user account associated with the process execution. If the user is a system administrator or a service account that routinely uses RES Automation Manager, this may indicate benign behavior.

  - **Analyze command line arguments:** Inspect the command line arguments in the telemetry for unusual flags or options that are not typically used in legitimate RMM tool operations. Malicious use may include extra commands directing improper actions.

  - **Identify high-confidence indicators:** Look for any indicators that suggest exploitation, such as unusual time of day for execution, execution from non-standard paths, or lack of expected logging or configurations in the RES environment.

  - **Verify legitimate use samples:** Cross-reference the logs against typical usage patterns of the RES Automation Manager to establish a baseline of normal activity. This may include confirmed job deployments or routine maintenance tasks.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on the organization's security posture if malicious. Although the RES Automation Manager is a legitimate tool, it can be weaponized by attackers to gain unauthorized access, making such alerts significant, especially if occurring outside of normal operational hours or unusual accounts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that could trigger the rule, highlighting a potential for false positives among typical management tasks. Consistent log capture from process creation is crucial, and organizations should ensure that appropriate monitoring configurations are in place to prevent gaps. A related detection to enhance coverage could include monitoring for command and control activity (T1071) related to RMM tool use.

