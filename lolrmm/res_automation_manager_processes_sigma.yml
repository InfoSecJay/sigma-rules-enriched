note: |
  ### Technical Context

  This detection identifies the process creation activity associated with the RES Automation Manager (RMM) tool, specifically tracking instances of processes such as "wisshell*.exe," "wmc.exe," "wmc_deployer.exe," and "wmcsvc.exe." The likely attacker objective is to leverage this legitimate automation tool for unauthorized tasks or to maintain persistence on compromised systems. This behavior falls under the MITRE ATT&CK tactic of Execution (TA0002) and the technique of System Utilities (T1219).

  The primary telemetry sources include Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If malicious, the use of RES Automation Manager could indicate a compromised environment where attackers automate harmful actions or deploy payloads. Importantly, this detection does not automatically confirm malicious intent, as the RES Automation Manager can also be used legitimately by IT departments.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 and/or Sysmon Event ID 1 for the detected processes. Look for instances where "ParentImage" corresponds to known legitimate automation tools (e.g., "C:\Path\To\wisshell.exe") versus these flagged processes directly.

  - **Analyze parent process:** Confirm the legitimacy of the parent process leading to the creation of the detected RMM processes. If the parent process is a known system administrator tool or application, it may indicate benign activity.

  - **Check execution context:** Determine whether the processes are invoked by user accounts tied to administrative actions or service accounts. Benign activity would commonly involve administrator accounts; suspicious activity may arise from standard user accounts.

  - **Investigate task scheduler activity:** Identify related scheduled tasks by reviewing Task Scheduler logs (Event IDs 106, 201, 203). Legitimate automations would generally have well-documented scheduling compared to potentially malicious, ad-hoc task scheduling.

  - **Correlate network activity:** Utilize network logs (e.g., firewall, proxy) to assess outbound connections initiated by these processes. Malicious indicators include attempts to connect to known C2 servers or unusual external destinations.

  - **Review recent changes in automation configuration:** Check configuration management systems or version control repositories for any recent commit history related to automation scripts. Unexpected changes or deployments may hint at unwanted RMM usages.

  ### Prioritization

  The severity of this alert is medium, as the RES Automation Manager can be used for both legitimate IT operations and malicious intent. Its potential for abuse is moderately high due to the capability of executing automated tasks, which may obscure malicious activity. This behavior is not widely weaponized, but its misuse should be closely monitored.

  ### Blind Spots and Assumptions

  There are limitations to detecting malicious use of automation tools if log retention is inadequate or if the automation processes are obfuscated or renamed. Detection relies on proper configuration and monitoring of process creation logs and Sysmon events. Legitimate use cases may trigger alerts, such as legitimate IT automation tasks, especially in organizations using the RES Automation Manager extensively. A related detection to consider is the monitoring of Windows scheduled tasks (T1053) to bolster visibility into automated actions that supplement process activity alerts.

