note: |
  ### Technical Context

  This Sigma rule detects the creation of processes associated with the RES Automation Manager (RMM) tool, specifically those that might be used for remote monitoring or management of systems. The likely attacker objective is to utilize this tool for unauthorized control or data exfiltration by masquerading as legitimate activity. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), and the technique is **Application Layer Protocol** (T1219).

  Primary telemetry sources include Windows process creation logs, specifically focusing on Security Event ID 4688, which provide insight into newly created processes. If malicious, the impact could include unauthorized access to systems, data exfiltration, or persistence mechanisms established by the adversary. It's important to note that this detection does NOT confirm malicious activity on its own, as the RES Automation Manager may be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Check process creation events:** Review **Security Event ID 4688** for new process creation events. Look for entries where the **New Process Name** matches any of the following: `\wisshell*.exe`, `\wmc.exe`, `\wmc_deployer.exe`, or `\wmcsvc.exe`. Benign indicators include timestamps aligning with expected administrative tasks.

  - **Verify parent process:** Investigate **Parent Process Name** within Event ID 4688. Matches to `\wisshell*.exe`, `\wmc.exe`, `\wmc_deployer.exe`, or `\wmcsvc.exe` as parent processes may indicate automation activities. Contrast with the legitimate process hierarchy known to the environment.

  - **Identify unusual execution patterns:** Cross-reference the execution time of the detected processes against user activity logs. Look for processes being executed during non-business hours or on unusual hosts. Malicious indicators might include execution outside of scheduled user roles.

  - **Inspect remote connections:** Review **Windows Firewall logs** for any outbound connections initiated by the flagged processes. High-confidence malicious indicators may include connections to known bad IP addresses or unusual port usage not typically seen in legitimate operation.

  - **Correlate with asset inventory:** Ensure the alerting IP or host correlates with an asset deemed critical for management. Info about legitimate use cases of RES Automation Manager on specific systems should be validated against asset inventory lists.

  ### Prioritization

  This alert has medium severity due to potential impacts on sensitive systems that the RES Automation Manager can access. While the legitimate tool is often used in controlled environments, its functionality is attractive to adversaries for lateral movement and establishing command and control. Thus, malicious usage does occur.

  ### Blind Spots and Assumptions

  Evasion techniques may include altering process names or using alternate tools that replicate RES Automation Manager functionality. Reliable detection requires that monitoring is enabled for Security Event ID 4688, and that logs for process creation are retained and analyzed. Legitimate activities that may trigger this alert include scheduled maintenance tasks or automated deployments using RES Automation Manager. Companion detections that may strengthen coverage include monitoring for unexpected network connections from these processes via **Firewall Event ID 5156**, indicating allowed connections based on newly created processes.

