note: |
  ### Technical Context
  This detection rule identifies the potential execution of the RES Automation Manager Remote Monitoring and Management (RMM) tool on Windows systems. Specifically, it monitors for process activity associated with specific executable files commonly linked to the RES Automation Manager, which can be leveraged by attackers to maintain persistence, remote access, or facilitate lateral movement within a network. Attackers may utilize such tools to automate various tasks, gather sensitive information, or execute commands without raising immediate suspicion among users.

  The primary suspected threat family here is the use of legitimate tools for malicious purposes (often referred to as "living off the land"). The relevant MITRE ATT&CK tactics include **Execution** (TA0002), where an attacker employs a legitimate software application to execute malicious activities, and **T1219: Remote Access Tools**, which includes monitoring and utilizing tools like RES Automation Manager for unauthorized RMM operations.

  The best data sources to substantiate this rule are Windows process creation logs, which provide insights regarding executed processes and their parent-child relationships, helping to track the execution chain initiated by the RES Automation Manager.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine process creation logs for entries related to the target executables (wisshell*.exe, wmc.exe, wmc_deployer.exe, wmcsvc.exe) to confirm the unusual activity and identify the parent processes involved.
  - **Correlate with User Activity:** Check user activity during the time of process execution to determine if a legitimate user initiated the RES Automation Manager processes or if there are discrepancies suggesting unauthorized access.
  - **Analyze Network Connections:** Investigate network activity associated with the identified processes, focusing on any unexpected outbound connections that may indicate malicious use of the RMM tool.
  - **Assess Privilege Escalation Paths:** Evaluate the permissions and roles of users executing the suspected processes to identify whether they possess the necessary rights for RMM tool usage or if this indicates a potential misuse by an attacker.

  ### Prioritization
  This alert is considered medium severity due to the potential impact associated with unauthorized use of RMM tools, which can lead to significant data breaches or system compromise, particularly in environments where such tools are inherently trusted.

  ### Blind Spots and Assumptions
  Detection may be limited if process creation logs are not adequately monitored or if the related executables are part of legitimate operational procedures. The assumption behind this detection logic is that the processes in question do not typically run without user interaction; however, malicious executable files might replicate similar naming conventions, leading to false positives. It is essential to ensure that proper logging configurations for process creation are enabled to achieve coverage for this detection rule.

