note: |
  ### Technical Context

  This rule detects outbound network connections to NoMachine-related domains, which are associated with remote management tools. The likely objective of an attacker using NoMachine is to establish remote access for command and control (C2) purposes, enabling them to control compromised systems. The relevant MITRE ATT&CK tactic is **Command and Control** (T1071.001) with the technique being **Application Layer Protocol** (T1219). Primary telemetry sources include network connection logs capturing domain resolutions and IP addresses accessed from endpoints. If malicious, this behavior indicates unauthorized remote access, posing significant risks to system integrity and data confidentiality. This detection does NOT confirm the intent behind the connection nor does it provide context about whether the remote access was authorized.

  ### Investigation Steps

  - **Assess outbound connections:** Check network logs for Event ID 5156 (Windows Firewall) capturing outbound connections to `*.nomachine.com` domains to verify if this behavior exists.

  - **Investigate remote session logs:** Look for evidence of legitimate NoMachine usage in Remote Desktop logs (Event ID 4624) to differentiate between authorized and unauthorized activity.

  - **Identify process details:** Review Sysmon logs for Event ID 10 detailing process creation; look for unusual parent-child relationships where legitimate processes spawn connections to NoMachine domains.

  - **Monitor DNS resolutions:** Examine DNS logs or network logs for recent queries to NoMachine hostname, noting timestamps and involved user accounts to ascertain if usage is aligned with known administrative activities.

  - **Check Firewall rules:** Validate that Windows Firewall (or alternative) logs show settings allowing expected traffic to NoMachine during typical business hours, ensuring that such usage aligns with approved remote access policies.

  ### Prioritization

  Alerts from this Sigma rule are medium severity due to the potential risk of unauthorized remote access from NoMachine, which, if abused, could lead to data breaches or system compromise. The likelihood of malicious abuse is moderate, as attackers frequently utilize legitimate tools for nefarious purposes.

  ### Blind Spots and Assumptions

  This detection may miss configurations where NoMachine traffic is masked or routed through VPNs or proxies. Reliable detection requires comprehensive logging of outbound connections, including DNS queries and firewall logs. Legitimate IT support or administrative activities may trigger these alerts when using NoMachine as part of their operational procedures. Complementary detections might include monitoring for unusual user account activity or lateral movement patterns aligned with tool usage.

