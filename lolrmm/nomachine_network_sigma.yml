note: |
  ### Technical Context

  This Sigma rule detects network connections to hostnames associated with NoMachine, a remote access and management tool often utilized for unauthorized access by attack actors. The likely attacker objective includes establishing command-and-control (C2) communications or remote management capabilities to control compromised systems. This behavior aligns with the MITRE ATT&CK tactic for Command and Control (T1071) and the technique for Application Layer Protocol (T1219).

  The primary telemetry sources are Windows network connection logs that capture outbound communication attempts, particularly noting Event ID 5156 (Windows Filtering Platform connections allowed). If malicious, this activity could facilitate unauthorized access to sensitive systems, exfiltration of data, or lateral movement. Note that this detection does NOT confirm that a malicious activity is taking place; legitimate use of NoMachine exists in many organizational environments.

  ### Investigation Steps

  - **Check for outbound connections:** Examine Windows Event ID 5156 logs for entries with `DestinationHostname` fields ending in `user_managed` or `nomachine.com` to identify potentially malicious connections.

  - **Review process associations:** Cross-reference detected connections with process creation logs (Event ID 4688) to determine if a known malicious process initiated the NoMachine connections. Look for unexpected parent-child relationships in the process tree.

  - **Identify legitimate use cases:** Determine if the organization uses NoMachine for remote management. Validate authorized users and assets that may legitimately access NoMachine services to differentiate benign connections from potential threats.

  - **Validate last known good configurations:** Check DNS resolution logs to see if the destination resolves correctly for legitimate users (commonly used IPs for NoMachine) or if there’s inconsistency indicating potential DNS spoofing.

  - **Correlate with user behavioral analysis:** Investigate the user accounts initiating the connections. Account behavior analytics tools can help establish norms, revealing potentially anomalous activities warranting further scrutiny.

  ### Prioritization

  The severity of this alert is medium, as it targets network activity that could indicate an active persistence or C2 channel. The risk remains notable due to NoMachine’s potential for abuse in remote exploitation scenarios. Such behavior, while potentially legitimate, is frequently weaponized in post-exploitation phases.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of NoMachine that could generate similar traffic, leading to false positives. The effectiveness of this detection relies on accurate filtering configurations in Windows and appropriate log levels. Additionally, other remote access tools may exhibit similar network activity, necessitating companion detections for tools such as TeamViewer or AnyDesk. Organizations should augment this detection with alerts related to unusual outbound traffic patterns or known indicators of compromise (IOCs) associated with remote access exploitation.

