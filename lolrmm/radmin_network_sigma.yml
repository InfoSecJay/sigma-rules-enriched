note: |
  ### Technical Context

  This rule detects potential network activity related to the RAdmin Remote Management Tool, specifically monitoring outbound connections to hostnames that end with "radmin.com." The likely objective of an adversary utilizing RAdmin is to establish remote control over systems in a compromised network, facilitating further exploitation or data exfiltration. This detection corresponds with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  Primary telemetry sources include Windows network connection logs, particularly monitoring for the process or attempts to connect to the specified destination hostnames. If the activity is malicious, it can compromise system integrity and provide the attacker with persistent access. Crucially, this detection does NOT confirm malicious intent by itself, as legitimate administrative use of RAdmin may trigger the same alert.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to "radmin.com." Assess the connection context (e.g., source process, user) to determine if the activity aligns with known administrative tasks.

  - **Identify the initiating application:** Examine the process generating the outbound connection via Sysmon Event ID 3 (Network Connection) to identify if it's a legitimate administrative tool or potentially a malicious use case.

  - **Review user account activity:** Inspect user accounts that initiated connections using logs from Event ID 4624 (Logon) and determine if the user context matches expected administrator behavior within the network.

  - **Evaluate asset criticality:** Focus on sensitive assets or servers where RAdmin is typically not required. If these systems initiate connections to "radmin.com," prioritize for further investigation.

  - **Correlate with known indicators of compromise (IOCs):** Cross-reference the observed IP addresses or hostnames with threat intelligence feeds to identify if reported malicious RAdmin activity was associated.

  ### Prioritization

  This alert holds medium severity as it may indicate an active attacker's attempt to establish persistence through RAdmin, a known remote access tool. The potential impact can be significant if it compromises critical systems, and this behavior is often leveraged in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of RAdmin, which can result in false positives. Reliable detection requires proper logging configurations for Windows Firewall and adequate scrutiny of network connection attempts. Legitimate activities that may trigger the alert include authorized remote management operations. Companion detections, such as monitoring for unusual logon patterns (Event ID 4624 and Event ID 4625) or suspicious process executions (Sysmon Event ID 1), can further enhance coverage against potential misuse.

