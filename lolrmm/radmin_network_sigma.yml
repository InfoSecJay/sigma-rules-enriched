note: |
  ### Technical Context
  This detection rule is designed to identify potential network activity associated with the RAdmin remote management tool. RAdmin is a legitimate tool often used by IT administrators for remote desktop access and system management. However, its functionality can also be exploited by malicious actors to maintain persistence, conduct unauthorized remote access, and manage compromised hosts without detection. The behavior the rule captures is specifically network connections made to hostnames ending in "radmin.com", which suggests that an entity is utilizing this tool for its functionality.

  Attackers could leverage RAdmin to gain remote access to systems, manipulate data, install additional malware, or exfiltrate sensitive information. The potential misuse of RAdmin as a command-and-control tool or for unauthorized remote access poses a significant risk to the organization's cybersecurity posture. Relevant MITRE ATT&CK tactics that apply to this detection include **Execution** (TA0002) through the technique **Remote Services: Remote Access Tools** (T1219), indicating that the detected behavior could exemplify malicious remote system access.

  The primary data sources for detecting such activity are network connection logs from Windows systems that capture outbound connections to external domains associated with RAdmin. These logs can provide insight into communication patterns that deviate from normal operational behavior.

  ### Investigation Steps
  - **Review Network Connection Logs**: Analyze network connection logs to identify connections made to any endpoint with hostnames ending in "radmin.com". Look for patterns of unusual frequency or the initiation of connections from unexpected hosts.

  - **Cross-reference Active Directory Policies**: Check user accounts involved in the connections against organizational policies to verify if they possess legitimate reasons to use RAdmin. Identify any anomalies in user behaviors or privileges.

  - **Monitor for Related Execution Events**: Investigate if any executables related to RAdmin were triggered on the endpoints. This may include examination of process creation logs during the timeframe of the network activity to identify any unauthorized execution of remote tools.

  - **Assess for Indicators of Compromise**: Search for known IOCs related to malicious use of RAdmin, including specific sign-in patterns or file modifications. This review should also encompass simultaneous suspicious activities on the same network segment.

  ### Prioritization
  The severity of this alert is classified as medium due to the balance between the benign use of RAdmin for legitimate administrative purposes and its potential misuse for unauthorized access and control over network assets, which could lead to significant breaches.

  ### Blind Spots and Assumptions
  This detection logic has potential gaps regarding false positives from legitimate administrative activities, as RAdmin is a recognized tool within many organizations. The detection relies on the assumption that any detected connections to radmin.com are suspicious without context. Coverage might be limited if outbound connection logs are not thoroughly collected or if the organization employs dynamic DNS or IP addresses that aren't captured in standard logging configurations. Proper logging of network connections is essential for the alert to function effectively.

