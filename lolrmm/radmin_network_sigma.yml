note: |
  ### Technical Context

  This Sigma rule detects potential network connections to RAdmin RMM tool's associated domains, specifically those ending with 'radmin.com.' The likely objective of the attacker is to establish remote management or command-and-control (C2) communication, which can facilitate unauthorized actions within the network. The relevant MITRE ATT&CK tactic is Command and Control (T1071), specifically the technique for Application Layer Protocol (T1219).

  The primary telemetry sources include network connection logs from Windows systems, specifically focusing on destination hostnames and associated protocols. If the detected activity is malicious, it could allow an attacker to control victim machines or exfiltrate sensitive data. It's important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of RAdmin for remote management is common in enterprise environments.

  ### Investigation Steps

  - **Review network connection logs:** Check for Windows Event ID 5156 (Windows Filtering Platform) to assess outbound connections to radmin.com. Look for unusual connections that deviate from normal operational hours.

  - **Identify known good usage:** Validate if any legitimate business processes rely on RAdmin. Review established documentation or user requests corroborating scheduled sessions to radmin.com.

  - **Correlate with endpoint activity:** Investigate Sysmon Event ID 3 (Network Connection) on endpoints that make connections to radmin.com. Confirm if these connections coincide with any unusual process execution or unexpected user activity.

  - **Extract proxy or firewall logs:** Look at firewall logs for associated traffic patterns. Relevant logs should include fields indicating source/destination IPs, ports, and timestamps. Legitimate connections will likely show consistent timing and protocols.

  - **Identify high-confidence malicious indicators:** Look for hashes or file paths related to known malicious RAdmin installations indicative of persistence methods or exploitation frameworks. Consider using threat intelligence sources to contextualize these indicators.

  ### Prioritization

  This alert should be considered medium severity as it indicates potential use of a remote management tool that can be weaponized by adversaries. The impact may be significant, especially if it involves critical systems. The likelihood of malicious abuse is moderate, given RAdmin's legitimate uses, making context important for prioritization.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate organizational use of RAdmin, potentially leading to false positives if not contextualized. Ensure logs from both endpoints and firewalls are optimally configured to capture this activity for reliable detection. Keep in mind that legitimate network administrators may trigger this alert when performing regular maintenance. A companion detection to consider is monitoring for unusual process executions (Sysmon Event ID 1) to strengthen assessment of the associated endpoint behaviors.

