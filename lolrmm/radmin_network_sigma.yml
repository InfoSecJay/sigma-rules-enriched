note: |
  ### Technical Context

  This rule detects outbound network connections to the RAdmin remote management tool, often associated with remote administration of machines. Attackers may use this tool to maintain persistence, exfiltrate data, or conduct reconnaissance on compromised systems. The relevant MITRE ATT&CK tactics are Command and Control (T1071.001) and Remote Services (T1219). The primary telemetry source is network connection logs indicating the destination hostnames that match patterns linked to the RAdmin service.

  If malicious, successful use of RAdmin may provide an attacker with unauthorized remote access to systems, potentially leading to data leakage or lateral movement. However, this detection does NOT confirm malicious intent by itself, as legitimate uses of RAdmin exist in various organizational environments.

  ### Investigation Steps

  - **Identify outbound connections:** Review network connection logs (Event ID 5156) for connections to RAdmin hostnames (e.g., "*.radmin.com"). Document the source IP and process involved. Check if the source is a known administrative machine or user context.

  - **Confirm legitimacy of usage:** Investigate if the detected connections align with documented remote administration practices within the organization. Compare accounts used for RAdmin connections against known administrative accounts.

  - **Analyze process spawning:** Cross-reference any associated process creation logs (Event ID 4688) to identify which application initiated the connection to RAdmin. Verify if the process is a legitimate RAdmin executable or potentially a malicious impersonator.

  - **Examine traffic characteristics:** Capture and analyze network traffic (using tools like Wireshark) related to the RAdmin connection. Legitimate traffic may include specific ports (TCP 4899) and offer clues such as authentication patterns indicative of known user behavior.

  - **Monitor for exfiltration artifacts:** Look for any file transfers or unusual data exfiltration patterns during the time of the alert, specifically checking for file creation logs or API calls indicating data movement (e.g., Event ID 4663).

  - **Compile contextual evidence:** Gather historical network behavior for the asset generating the alert. Compare against baseline behavior to discern unusual patterns or external communication attempts that deviate from normal operational use.

  ### Prioritization

  This alert should be treated with medium severity, as it indicates potentially risky outbound behavior from systems that may contain sensitive information. The likelihood of malicious abuse exists, especially if the destination is unrecognized or if there are no documented legitimate uses of RAdmin within your environment. The tool is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may have limitations if firewall logging is incomplete or if RAdmin usage is misconfigured or poorly documented. Ensure logging for all outbound network connections is accurately configured for reliable detection. Legitimate work-from-home scenarios may trigger this alert if employees use RAdmin for remote support. Related detections include monitoring user activity for suspicious login patterns or abnormal service execution from hosts that are not part of routine IT operations.

