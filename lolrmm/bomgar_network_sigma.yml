  ---

  ### Technical Context

  This rule detects outbound network connections to domains associated with the Bomgar Remote Management Tool (RMM), such as "beyondtrust.com/brand/bomgar." Attackers may use RMM tools for remote access and control, enabling them to execute commands or exfiltrate data once they gain entry to a system. The relevant MITRE ATT&CK techniques are Remote Desktop Protocol (Tactic: Remote Access; Technique ID: T1219).

  Primary telemetry sources include Windows Event logs related to network connections, specifically focusing on events that capture DNS resolutions and outbound connection attempts. If malicious, this activity could allow unauthorized access to sensitive resources, potentially leading to data breaches or lateral movement within the network. This detection does NOT confirm intent; legitimate use of Bomgar is common in enterprise environments.

  ---

  ### Investigation Steps

  - **Check network connections: ** Review recent network connection events in Windows logs (Event ID 5156) for outbound connections to "beyondtrust.com" or similar domains. Evaluate the source IP and hostname for legitimacy against expected domains.

  - **Analyze user access: ** Investigate the user accounts initiating these connections. Cross-reference against typical Bomgar usage patterns within your organization. Authorized users should have documented reasons for connecting to Bomgar.

  - **Review Security Event Logs: ** Look at Windows Security Event ID 4624 for logon events close in time to the detected network connection. Check for any anomalous authentication types or accounts not known to use Bomgar.

  - **Locate process origins: ** Examine System Process Creation logs (Sysmon Event ID 1) to confirm if the Bomgar client is running on the host, including the process path and parameters. Legitimate instances will typically have signed binaries located in program files.

  - **Monitor data transfer logs: ** If file transfer activity is detected following the network connection (Sysmon Event ID 11 for file creation), validate that it aligns with operational justifications for Bomgar use.

  - **Identify any concurrent alerts: ** Correlate with other alerts that indicate unauthorized access or unusual behavior around the same time frame. For example, failed login attempts (Event ID 4625) can signify attempted exploitation prior to the Bomgar RMM connection.

  ---

  ### Prioritization

  This alert carries medium severity in an enterprise context due to the potential impact on sensitive systems managed remotely. The likelihood of malicious abuse is moderate, as RMM tools are commonly weaponized in targeted attacks. Therefore, timely investigation is critical.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations if legit uses of Bomgar are prevalent in the environment, leading to false positives. It requires proper logging configurations to capture detailed outbound connections for reliable detection. Legitimate remote support activities may trigger this alert, complicating triage. Consider companion detections like anomalous RDP logins (Tactic: Initial Access; Technique: T1021.001) for a comprehensive approach to monitoring remote access efforts.

