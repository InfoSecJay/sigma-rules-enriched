note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the Bomgar Remote Management and Monitoring (RMM) tool. Bomgar is often utilized for remote support and system administration tasks, but it can also be exploited by threat actors for unauthorized access to systems. This detection is aimed at uncovering instances where Bomgar connections are initiated to peculiar or unexpected domains, likely indicating misuse or compromise of the legitimate tool for malicious purposes.

  The typical threat scenario involves attackers leveraging Bomgar to gain remote control over systems within the enterprise. By exploiting vulnerabilities or misconfigurations, they may aim to exfiltrate sensitive data, deploy malware, or establish a foothold in the organization's environment. Related MITRE ATT&CK tactics include *Execution* (T1203), which encompasses the execution of malicious code, as well as techniques specific to remote services or management tools that facilitate unauthorized access.

  Primary data sources relevant to this detection include network connection logs that capture the destination hostname and any associated metadata, providing essential insight into potential malicious connectivity patterns.

  ### Investigation Steps
  - **Review Connection Logs**: Analyze network connection logs to identify outgoing connections to `beyondtrust.com/brand/bomgar`. Pay attention to the frequency, timing, and source IP addresses of these connections to spot abnormalities.
  - **Examine User Activity**: Investigate user activity logs for unusual patterns leading up to the detected Bomgar connections, such as failed login attempts or lateral movement within the environment that may indicate a compromise.
  - **Check Asset Inventory**: Verify if the systems making the Bomgar connections are authorized to use this tool. Look for unrecognized devices or accounts that may suggest unauthorized access.
  - **Monitor for Privilege Escalation**: Inspect logs for any privilege escalation events that coincide with the detected network activity to determine whether elevated permissions are being misused alongside Bomgar.

  ### Prioritization
  The severity of this alert is considered medium in an enterprise environment due to the potential impact of unauthorized remote management capabilities. The likelihood of legitimate use complicates detection, but any connections initiated without proper authorization warrant a thorough investigation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise from legitimate use cases of Bomgar that do not align with typical network connections, resulting in potential false positives. The detection logic assumes that all connections to the identified hostname are suspicious, which may not always hold true. Required logs include complete network connection records with destination hostnames, and proper configuration of logging settings is necessary for this alert to function efficiently.

