  ---

  ### Technical Context

  This rule detects outbound network connections to specific domains associated with Bomgar RMM (Remote Monitoring and Management) tool activity, indicating potential unauthorized remote access attempts. The likely objective of an attacker using this tool is to gain control over enterprise endpoints, facilitating reconnaissance, lateral movement, or exfiltration of sensitive data. This behavior aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, specifically focusing on the `DestinationHostname` field. If the activity is malicious, it poses a significant risk, as unauthorized use of a remote access tool can lead to data breaches or system compromise. Importantly, this detection does NOT confirm that the activity is malicious; legitimate use of Bomgar is common in many organizations.

  ---

  ### Investigation Steps

  - **Review network connection events:** Examine Security Event ID 5156 (Windows Filtering Platform), focusing on the `DestinationHostname` field for connections to domains including `beyondtrust.com/brand/bomgar`. Note the frequency of such connections.

  - **Correlate with user activity:** Identify the user associated with the potential Bomgar access (use Event ID 4624). Validate the user’s roles and responsibilities to determine if remote support was authorized.

  - **Assess for legitimate use:** Determine if any authorized remote support tiers (Tier 1-3) have logged sessions within the same time frame as the alert. Check for logs indicating session initiation from internal support tools.

  - **Identify high-confidence malicious indicators:** Look for abnormal account behavior, such as multiple logins from various locations in a short time span (Event ID 4624), which might suggest credential compromise before Bomgar use.

  - **Check for additional malicious artifacts:** Validate if there are logs indicating file downloads or uploads during suspected Bomgar connections (Event IDs 4663 or specific file creation events), indicating potential data exfiltration.

  - **Monitor for command execution:** Review for any suspicious processes launched during the same time frame (Sysmon Event ID 1) that could link unauthorized commands to Bomgar sessions, indicating malicious intent.

  ---

  ### Prioritization

  This alert is of medium severity, as unauthorized Bomgar tool access can lead to serious security incidents if a critical asset is compromised. The likelihood of exploitation is considerable, especially if remote access is not tightly controlled. The use of RMM tools is weaponized in various attacks, making quick assessment crucial.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Bomgar RMM within the environment, possibly leading to false positives. Ensure that logging configurations capture all relevant outbound connection events consistently. Additionally, authorized IT support activities or maintenance tasks might trigger this alert. Related detections to reinforce coverage include monitoring for suspicious user behavior (e.g., unusual logon patterns) or identification of known malicious IP addresses linked to Bomgar associations.

