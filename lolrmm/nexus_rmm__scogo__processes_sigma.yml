note: |
  ### Technical Context

  This Sigma rule detects potential process activity initiated by the Nexus RMM (Remote Monitoring and Management) tool, specifically the executable `nexusrmm.exe`. This behavior may indicate unauthorized remote access, system surveillance, or a command-and-control (C2) channel being established by an adversary. The intent behind utilizing such a tool could be to maintain persistence, conduct system monitoring, or exfiltrate data without detection.

  The detection aligns with the MITRE ATT&CK tactic for Command and Control (T1071.001) as it may facilitate remote administration of compromised systems. The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide insights into process invocations and their parent-child relationships. If malicious, this behavior could lead to unauthorized access to sensitive information and control over affected systems. It is important to note that this detection does NOT confirm that a system is compromised, as Nexus RMM may be used legitimately in managed environments.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 or Sysmon Event ID 1 for process details. Validate that `nexusrmm.exe` is not preceded by any legitimate parent processes known to be authorized in your environment.

  - **Analyze command line arguments and parent processes:** Look for unusual command line arguments associated with `nexusrmm.exe`. Typically, expected behavior would not show suspicious parameters. Log fields to check: `CommandLine`, `ParentImage`.

  - **Correlate with asset inventory:** Determine if the system running `nexusrmm.exe` is an approved device for using Nexus RMM. Review asset roles in your CMDB for any discrepancies that would indicate illicit use.

  - **Investigate network connections:** Review network logs to identify outbound connections initiated by `nexusrmm.exe`. Look for unusual external IP addresses or domains in logs (e.g., Windows Firewall logs or other network appliances) that indicate potential C2 activity.

  - **Check for scheduled tasks or persistence mechanisms:** Inspect for any scheduled tasks or new services created after the execution of `nexusrmm.exe`. Use PowerShell commands like `Get-ScheduledTask` or `Get-Service` as needed.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for impacting sensitive systems, especially if the affected host has critical data or services. The likelihood of malicious use is notable, as RMM tools can be weaponized by adversaries to control endpoints clandestinely. While not inherently malicious, their presence must be classified based on context and usage.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by cases where the RMM tool is legitimately used within the enterprise; thus, context is crucial. Organizations should ensure that logging configuration captures all relevant process creation events and network traffic for comprehensive visibility. The alert could also be triggered by legitimate IT administrative activities, thereby prompting thorough validation. Related detection rules for monitoring unauthorized network traffic or unusual process execution patterns should be implemented to bolster overall alerting coverage.

