note: |
  ### Technical Context

  This Sigma rule detects process activity related to LocalXpose, a Remote Management and Monitoring (RMM) tool that can be used for potentially malicious purposes. Attackers may leverage LocalXpose to establish reverse shell connections or to control compromised systems remotely, often aiming to exfiltrate data or orchestrate further attacks within a target network. The relevant MITRE ATT&CK tactics include Command and Control (Tactic ID: TA0011) and Remote Services (Technique ID: T1219).

  The primary telemetry source is Windows process creation logs, specifically looking for instances of processes that have the parent or image name ending with `\\loclx.exe`. If malicious, the presence of this tool indicates a potential compromise of the system where it is installed, allowing external access to internal resources. This detection does NOT confirm that malicious activity is occurring, only that the LocalXpose RMM tool is in use.

  ### Investigation Steps

  - **Verify process origin:** Review the process creation logs to identify the source of the `loclx.exe` process. Check Event ID 4688 for the creation details, including the user who initiated it. Corporate environments may have authorized use cases, particularly for IT support.

  - **Analyze parent process:** Check the parent process details in Event ID 4688. Confirm if it was initiated by a legitimate system tool or a potentially malicious application. A legitimate parent process would typically be a well-known application or system service.

  - **Cross-reference user behavior:** Investigate the user account associated with the `loclx.exe` process. Look into login events (Event ID 4624) within the past few hours to assess if the account has a history of normal usage patterns or if it shows unusual activity such as off-hours access.

  - **Review outbound connections:** Inspect network logs for unusual outbound connections from the system running LocalXpose. Look for established TCP connections that may suggest data exfiltration or command and control communications, scrutinizing DNS queries and session logs.

  - **Validate legitimate use cases:** Document and confirm acceptable use of LocalXpose within the network. Any discovered instances should be cross-checked against IT policies and documented exceptions; legitimate tools often have designated user roles and purposes outlined.

  ### Prioritization

  This alert carries a medium severity due to the potential impact on sensitive systems and data, particularly if LocalXpose is being misused to facilitate unauthorized access. The likelihood of malicious abuse is moderate given that RMM tools are commonly weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of LocalXpose, which could lead to false positives. Comprehensive logging for process creation and outbound network activity is essential for accurate detection. Legitimate remote support or monitoring connections may trigger the alert. It is recommended to pair this detection with logs from a Network Intrusion Detection System (NIDS) to identify legitimate versus suspicious traffic patterns associated with RMM tools.

