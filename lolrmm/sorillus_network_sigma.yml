note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Sorillus RMM tool, indicating potential malicious Remote Monitoring and Management (RMM) activity. Attackers may employ Sorillus to maintain control over compromised systems, steal data, or deploy additional payloads. This behavior aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219).

  Primary telemetry sources include Windows network connection logs which capture outbound traffic details. If this activity is confirmed to be malicious, it poses a significant security risk as it could allow an adversary persistent access and control over enterprise assets. It’s important to note that the detection of a connection to the specified domains does NOT confirm an active compromise without further contextual evidence.

  ### Investigation Steps

  - **Review active connections**: Check the Windows firewall or network connection logs (Event ID 5156) for active connections to `*.sorillus.com` or `sorillus.com`. Look for unusual outbound traffic patterns that deviate from typical usage.

  - **Identify the process making the connection**: Inspect Sysmon Event ID 3 for process creation events corresponding to network connections identified in the previous step. Legitimate usage might involve known admin tools or expected application behavior.

  - **Correlate with user activities**: Analyze user account logs (Event ID 4624) to verify if the process making the connections was executed by an authorized user. Malicious indicators may include execution by an unrecognized account or during unusual hours.

  - **Analyze related network activity**: Examine DNS query logs for any recent resolutions to the detected domains, focusing on unusual spikes or queries from internal systems that typically do not access external RMM tools.

  - **Confirm file drops or persistence mechanisms**: Investigate for any indications of file creation linked to Sorillus (e.g., via Windows Event ID 4663 or Sysmon Event ID 11). Since RMM tools often maintain a foothold, check for suspicious startup entries or service installations.

  ### Prioritization

  This alert carries medium severity due to the potential exposure of critical assets through unauthorized remote access. The likelihood of malicious misuse is elevated given the weaponization of RMM tools for exploitation. The significance of systems communicating with the identified domains heightens the urgency for further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by network logging configurations; if outbound network activity is not sufficiently logged, alerts may be missed. Legitimate administrative actions may trigger this alert if authorized personnel utilize the Sorillus tool for maintenance tasks. Including companion detections for other known RMM-related domains helps to strengthen coverage against similar threats.

