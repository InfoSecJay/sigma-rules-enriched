note: |
  ### Technical Context

  This rule detects network activity associated with connections to domains linked to the Sorillus Remote Monitoring and Management (RMM) tool. Such behavior may suggest an attacker is using the tool for remote access, system control, or data exfiltration. The likely objective of an attacker leveraging Sorillus RMM would be to manage systems remotely with potential visibility into sensitive data or execute malicious commands.

  This detection falls under the MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Remote Access Tools" (T1219). The primary telemetry sources include Windows network connection logs, specifically tracking connections to hostnames that end with '.sorillus.com' or directly to 'sorillus.com'. If malicious, it could indicate unauthorized access or management of enterprise assets. Importantly, this detection does NOT confirm that malicious activity has taken place without corroborating evidence of exploitation or unauthorized control.

  ### Investigation Steps

  - **Check network logs for connections:** Review Windows Network Connection logs (Event ID 5156) for outbound connections to '*.sorillus.com' or 'sorillus.com'. Look for unusual outbound traffic from critical systems not known to use Sorillus RMM.

  - **Verify application presence:** On machines reporting alerts, perform a search for the Sorillus RMM application or any associated executables. Legitimate installations should be documented and justified within asset inventories.

  - **Analyze process activity:** Use Sysmon Event ID 1 to examine process creation logs for any new or suspicious processes spawned around the same time as the reported network connection. Cross-reference processes with known legitimate Sorillus executables.

  - **Assess user behavior:** Review user logon events (Security Event ID 4624) on affected systems for unexpected logins or account activity. Document if there are known administrative users connecting during atypical hours.

  - **Identify indicators of compromise:** Look for patterns of frequent connections to Sorillus domains which could indicate persistent foothold activity rather than isolated reconnaissance efforts. High-confidence malicious indicators include repetitive failed or successful connection attempts to these domains that don’t correlate with legitimate usage patterns.

  ### Prioritization

  This alert is moderate in severity due to the potential impact of unauthorized remote access via Sorillus RMM on critical systems. Given the tool’s legitimate use in remote management, the likelihood of malicious abuse is significant, especially if no authorized use patterns have been established. Historical data indicates that similar tools are commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection might miss connections if the attacker uses IP whitelisting or toggles between domains. Continued reliance on accurate logging from Windows network connection sources is critical for detection reliability. Additionally, legitimate administrative activities may trigger this alert if Sorillus RMM is part of authorized remote management practices. A related detection to strengthen alerting could include monitoring for activity associated with other known Remote Access Tools or their characteristic packet signatures.

