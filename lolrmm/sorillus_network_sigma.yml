note: |
  ### Technical Context

  This Sigma rule detects outbound network connections aimed at specific domains associated with the Sorillus Remote Management and Monitoring (RMM) tool. Typical attacker objectives involve establishing command-and-control (C2) sessions or exploiting Sorillus for unauthorized access to resources. This detection aligns with the MITRE ATT&CK tactic: Command and Control (TA0011) via the technique: Application Layer Protocol (T1219). The primary telemetry source is Windows Network Connection logs, specifically monitoring for outbound connections to hosts resolving to `sorillus.com`. If malicious, such activity could indicate that an adversary is using Sorillus as a platform for unauthorized remote access or lateral movement. However, it's important to note that this detection alone does not confirm malicious intent, as legitimate use of Sorillus by internal personnel could trigger the same alert.

  ### Investigation Steps

  - **Check hostname resolution:**
    Query DNS records for the destination hostname to validate whether it resolves to known Sorillus IP addresses. Legitimate behavior should show internal assets communicating with these domains under authorized use cases.

  - **Review network connection logs:**
    Analyze Windows Event ID 5156 (Windows Filtering Platform) or firewall logs for outbound connections to `*.sorillus.com`. Look for connections initiated at unusual hours or from unexpected internal hosts, which could indicate potential misuse.

  - **Identify the processes initiating connections:**
    Investigate the parent process ID linked to the network connection by checking Windows Event ID 4688 for process creation events. Determine if the initiating process is known and legitimate (e.g., specific system administration tools) or suspicious.

  - **Analyze traffic patterns:**
    Use network packet captures to assess the nature of traffic to `sorillus.com`. Malicious indicators to note include excessive data transfers or unusual protocols outside normal operational parameters.

  - **Evaluate system role and criticality:**
    Identify if the system generating the alert is part of a critical infrastructure or sensitive environment. High-value assets communicating with Sorillus may warrant immediate investigation due to potential implications.

  ### Prioritization

  The severity of this alert is medium, as the potential impact on critical systems could be significant if exploited for unauthorized access. The likelihood of malicious use is heightened by the context of the alert, given that RMM tools are often weaponized for remote administration in compromise scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where Sorillus is legitimately used, leading to false positives. Reliable detections require DNS logging and firewall rules configured to capture traffic to and from these endpoints. Legitimate system administrators may trigger these alerts during routine maintenance, reinforcing the need for contextual awareness. A related detection that could enhance coverage is monitoring for unusual user activity or process execution coinciding with these network connection alerts.

