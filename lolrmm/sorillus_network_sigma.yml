  ### Technical Context

  This rule detects outbound network connections to domains associated with the Sorillus Remote Monitoring and Management (RMM) tool, indicating potential unauthorized use of administrative tools. The likely attacker objective is to leverage Sorillus for remote access or system manipulation, often used in post-exploitation activities. This detection aligns with the MITRE ATT&CK technique T1219 (Remote Access Software).

  Primary telemetry sources include Windows network connection logs, specifically capturing the hostname and connection details. If this behavior is confirmed as malicious, it may allow an adversary to maintain persistent access to compromised systems, conduct lateral movement, or execute additional payloads. However, this detection does NOT confirm that an active compromise has occurred, as legitimate administrative tasks might also trigger these alerts.

  ---

  ### Investigation Steps

  - **Check outbound connections: **Review Windows network logs for connections to `*.sorillus.com` or `sorillus.com`. Use Event ID 5156 (Windows Filtering Platform) to identify such connections and check fields like `DestinationAddress` and `DestinationPort`.

  - **Validate against known benign use: **Determine if any users or systems are authorized to use Sorillus RMM for legitimate purposes. Review application access logs or inventory systems and identify if documented administrative tasks were scheduled around the detected time.

  - **Investigate for other indicators of compromise: **Cross-reference timestamps of the network activity with other logs, such as Security Event ID 4624 (Logon) to identify if there were multiple logons from unusual accounts or at odd hours, indicating potential misuse.

  - **Identify repetitive or unusual connections: **Monitor for recurrent connections to Sorillus domains showing a high frequency or patterns that deviate from established norms. Patterns in log activity may indicate automated tools being used maliciously.

  - **Analyze process activity: **Look for related process creation events around the connection times, specifically Windows Event ID 4688 or Sysmon Event ID 1, checking for processes launching connections to Sorillus domains. Focus on unexpected commands run from administrative tools or scripts.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to its potential implications on system integrity. Systems impacted by unauthorized RMM tools could lead to severe data breaches or system compromise. The likelihood of malicious abuse is moderate, as adversaries often employ RMM tools for easy access and management in compromised environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of domain connectivity logs from certain devices or if the outbound connections are proxied, making them untraceable. It’s essential to ensure that network logging is correctly configured across all endpoints to capture relevant data. Legitimate administrative activities or trusted third-party software could trigger this alert. A companion detection, monitoring for command line activity that invokes the RMM tool or unusual script execution, may enhance threat visibility and context.

