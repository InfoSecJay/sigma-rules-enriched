note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Sorillus Remote Monitoring and Management (RMM) tool, specifically those resolving to `*.sorillus.com`. These connections may indicate an adversary using this tool for remote access, potentially for purposes such as system compromise or data exfiltration. This behavior fits into the MITRE ATT&CK framework under the tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219).

  The primary telemetry sources include Windows network connection logs that capture event data related to outbound connections. If malicious, this activity could facilitate unauthorized remote management, potentially compromising sensitive data or systems. However, this detection alone does not confirm malicious intent, as legitimate use of Sorillus by authorized personnel may also generate similar network activity.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5140) for outgoing connections to `sorillus.com` or any subdomains of it. Look for unusual timeframes or connections from non-standard user accounts.

  - **Verify Sorillus usage:** Determine if Sorillus is an authorized tool within the organization by checking with IT teams. Legitimate connections may correspond to known operational tasks by IT personnel.

  - **Analyze process activity:** Use Sysmon Event ID 3 to investigate process creations associated with any connections to `sorillus.com`. Look for processes that unexpectedly appear around the times of the network connections as potential indicators of malicious activity.

  - **Inspect DNS query logs:** Check DNS query logs for any recent requests to `*.sorillus.com`. Look for an increase in queries from a single host or queries at odd hours, which could indicate automated communications.

  - **Identify high-confidence malicious indicators:** Cross-reference the IP addresses associated with `sorillus.com` against threat intelligence feeds. Any matches indicating known malicious infrastructure should raise the alert's priority.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on systems using remote management tools. While the likelihood of malicious abuse exists, especially in environments where Sorillus is not approved for use, legitimate activity can occasionally trigger this alert-further investigation is warranted.

  ### Blind Spots and Assumptions

  This detection may miss legitimate activity from authorized users employing Sorillus for remote management, and adversaries could utilize obfuscation techniques to disguise network traffic. Reliable detection requires proper configuration of firewall and proxy logs to ensure visibility over all outbound connections. A related detection rule for lateral movement (e.g., RDP connections or other RMM tools) could strengthen overall coverage against potential malicious use of remote management tools.

