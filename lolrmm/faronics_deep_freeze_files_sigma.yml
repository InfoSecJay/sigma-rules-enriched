note: |
  ### Technical Context

  This rule detects potential unauthorized file activity associated with the Faronics Deep Freeze Remote Monitoring and Management (RMM) tool, specifically targeting processes and logs related to its execution. Attackers may leverage Deep Freeze to maintain persistence or manage systems under their control, essentially manipulating the tool for malicious objectives such as system lockdown or data exfiltration. Relevant MITRE ATT&CK tactics include *Command and Control* (TA0011) and the technique *Application Layer Protocol* (T1219).

  The primary telemetry sources involve file event logs generated by Windows, specifically targeting file creation and access events tied to specific Deep Freeze executable files and logs located in `C:\Program Files (x86)\Faronics\Deep Freeze` and `C:\Windows\Temp`. If malicious, the impact could range from system manipulation to full control over system functionalities. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of Faronics Deep Freeze is common in enterprise environments.

  ### Investigation Steps

  - **Check event logs for targeted filenames**: Review Windows file event logs (Event ID 4663) for any activity related to `DFServ.exe`, `DFServEx.exe`, or `DFWks.exe`. Validate if these events match authorized operational patterns.

  - **Analyze process execution context**: Inspect the process creation events (Sysmon Event ID 1) for the respective Deep Freeze executables. Confirm the parent process ID and command-line arguments used, identifying any anomalous behavior.

  - **Correlate with user action logs**: Review user activity logs (Security Event ID 4624) on the system to determine whether a user authorized the execution of these files. Legitimate activity should correlate with user logins or administrative tasks.

  - **Investigate log file creation**: Validate the log file `DFServiceInit.log` in `C:\Windows\Temp` for content and time stamps. Look for unusual entries or file creation times aligned with unexpected administrative actions.

  - **Identify environments where Deep Freeze is deployed**: Confirm whether the system belongs to a known environment where Faronics Deep Freeze is actively used, and verify compliance with internal operational procedures.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact on system integrity if the Faronics Deep Freeze tool is exploited. The likelihood of malicious abuse is moderate, considering its usage in legitimate environments, although the specific behavior detected may indicate non-standard operations commonly weaponized by adversaries for persistence.

  ### Blind Spots and Assumptions

  The detection may be limited by misuse of legitimate tools or improperly configured logs that fail to note authorized uses of Deep Freeze. Required log sources include both file event logs and process creation tracking for comprehensive coverage. Common legitimate activities may trigger the alert during routine updates or administrative pestering. A companion detection could include monitoring network traffic for abnormal connections initiated by Deep Freeze-associated processes, enhancing coverage against potential command and control activities.

