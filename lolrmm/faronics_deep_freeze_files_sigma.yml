note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Faronics Deep Freeze RMM tool. The likely objective of an attacker using this software is to gain persistent control over a compromised endpoint by freezing the state of the system, enabling future attacks without detection. The relevant MITRE ATT&CK tactic is Execution, with the technique identified as Remote Service Execution (T1219). Primary telemetry sources include Windows file events specifically targeting certain executables and log files associated with Deep Freeze, such as `DFServ.exe`, `DFWks.exe`, and specific temporary log files. Malicious activity could result in unauthorized system changes or evasion of security monitoring. This detection does NOT confirm malicious intent on its own, as Faronics Deep Freeze may be legitimately deployed in many environments.

  ### Investigation Steps

  - **Verify the process location and integrity**: Check for the execution of `DFServ.exe`, `DFServEx.exe`, or `DFWks.exe` located in `C:\Program Files (x86)\Faronics\Deep Freeze\` (Event ID 4663 or Sysmon Event ID 10). Legitimate installations should match the expected MD5 hash for these files.

  - **Analyze log file activity**: Review `C:\Windows\Temp\DFServiceInit.log` and `C:\Users\<USER>\AppData\Local\Temp\_$Df\DFStdInstall.sib` for unusual entries or timestamps indicative of recent unauthorized access (Windows Event ID 4663).

  - **Assess user behavior**: Check the user account associated with the detected processes. If execution is linked to a non-admin user performing atypical actions or at odd hours, this could indicate malicious intent.

  - **Cross-reference established baselines**: Identify normal business operations using Faronics Deep Freeze. Validate if there have been recent changes in the environment that necessitated this tool's activity by checking deployment records or service management logs.

  - **Identify network communication**: Inspect for outbound connections or encapsulated actions from Deep Freeze process IDs that may indicate external command and control (C2) communication (Windows Firewall logs or network monitoring tools may reveal these details).

  ### Prioritization

  The alert severity is medium due to the potential operational disruption created by unauthorized file activity of Faronics Deep Freeze on critical systems. The likelihood of malicious abuse is moderate, as such tools can mask unauthorized changes. However, this behavior is sometimes weaponized in targeted attacks to persistently control systems.

  ### Blind Spots and Assumptions

  Detection may miss stealthy incidents where the tool is used by an insider for maintenance rather than malicious intent. Required log sources include comprehensive file auditing settings, as configurations can vary. Legitimate use may trigger this alert during normal system updates or maintenance activities. A companion detection to consider is monitoring for unusual file changes or executables initializing without user consent to strengthen detection coverage.

