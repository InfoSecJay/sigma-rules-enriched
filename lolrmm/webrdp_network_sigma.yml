note: |
  ### Technical Context

  This Sigma rule detects network activity related to the WebRDP remote management tool, specifically when connections to a destination hostname that ends with "user_managed" occur. The likely attacker objective is to establish remote control over a compromised system, facilitating further actions like data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Execution and the technique T1219 (Remote Access Tools). The primary telemetry sources include Windows network connection logs (Event IDs 5156 and 5158), which capture outbound connection attempts.

  If this behavior is confirmed as malicious, it could indicate unauthorized access to systems, potentially leading to data breaches or system compromise. However, this detection alone does NOT confirm that malicious activity is occurring; legitimate use of WebRDP by administrators may trigger the same alert.

  ### Investigation Steps

  - **Check outbound network connections:** Review Windows Event ID 5156 and 5158 logs looking specifically for the destination hostname pattern ending in “user_managed.” If the source IP belongs to a known administrative system, it may indicate benign activity.

  - **Review user activity:** Cross-reference logged user accounts with the connections made to assess legitimacy. Administrative accounts using WebRDP may be normal; unexpected accounts could indicate potential compromise.

  - **Analyze connection patterns:** Investigate the frequency and timing of the connections. Continuous or unusual access patterns outside business hours could suggest malicious intent.

  - **Correlate with other alerts:** Look for associated alerts, such as unusual internal lateral movement or additional remote desktop tool connections, indicating potential multi-vector attacks (e.g., RMM tool use alongside other techniques).

  - **Inspect for additional artifacts:** Validate system logs for file creation or modification linked to remote sessions (Sysmon Event ID 11 for file creation, Security Event ID 4688 for process creation). Presence of unauthorized executables or scripts could enhance the likelihood of malicious use.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on enterprise assets if unauthorized access is confirmed. The likelihood of abuse is moderate, particularly in environments where remote access tools are more frequently targeted. While WebRDP can be weaponized by attackers, legitimate administrative uses are common, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs for legitimate administrative actions or configurations that could circumvent monitoring. Legitimate WebRDP usage by IT personnel could trigger the alert, requiring awareness of common administrative activities. This rule should be paired with detections for other remote access activity (e.g., Microsoft Remote Desktop Protocol usage) to strengthen overall coverage and context in threat investigations.

