  ### Technical Context
  This rule detects potential network activity associated with the WebRDP Remote Management Tool (RMM), which is often used for remote access to systems, potentially indicating unauthorized or suspicious access attempts. It helps identify instances where an attacker may be utilizing common administrative remote management tools for malicious purposes, such as gaining access to sensitive systems or performing lateral movement within the network.

  The threat scenario revolves around an attacker utilizing WebRDP to connect to managed services or devices, which may lead to unauthorized control and exploitation of those systems. The attacker’s objectives often include stealthy execution of commands, data exfiltration, or spreading to more critical components within the target environment. Key MITRE ATT&CK tactics relevant to this detection include **Execution (T1203)**, which covers the exploitation of user execution vulnerabilities, and **Command and Control (T1219)**, indicating a potential command and control channel established by web-based remote management tools.

  The primary data sources for this detection include network connection logs, which can reveal connections to the known WebRDP hostnames associated with the tool, as well as possibly related session logs from endpoint detection and response (EDR) solutions that might capture process execution events and command execution.

  ### Investigation Steps
  - **Review Network Logs:** Analyze the network connection logs for any traffic directed towards identified WebRDP hostnames, particularly `user_managed` and `github.com/Mikej81/WebRDP`, noting unusual connection patterns or timings.

  - **Correlate EDR Data:** Check the endpoint detection logs for any processes initiated or commands executed that coincide with the times of detected WebRDP activity, focusing on subprocesses that may indicate exploitation or privilege escalation.

  - **Examine User Behavior:** Evaluate user account activity during the detected session to determine if the connections were initiated by legitimate users or if there are abnormal patterns, such as logins from unknown or infrequently used accounts.

  - **Inspect Firewall Logs:** Investigate firewall or intrusion detection/prevention system (IDS/IPS) alerts for any anomalous connections that may correlate with the WebRDP tool activity, including unapproved ports or unusual data transfer volumes.

  ### Prioritization
  The alert's medium severity is due to the dual nature of WebRDP as a legitimate tool used for remote management, combined with its potential for malicious exploitation, making it crucial to investigate any detected activity promptly.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of unauthorized usage, particularly if attackers obfuscate their connections or use non-standard host names. The rule assumes that the relevant network traffic to WebRDP will be monitored and captured accurately. Additionally, successful detection requires comprehensive logging of network connection events and proper configuration of logging mechanisms to ensure visibility into remote access activities.

