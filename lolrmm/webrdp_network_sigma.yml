note: |
  ### Technical Context

  This Sigma rule detects potential network connections initiated by the WebRDP remote management tool, particularly when targeting hosts with a destination hostname ending in "user_managed." Such behavior may indicate that an attacker is utilizing WebRDP for command-and-control actions or lateral movement within the network. The likely attacker objective is to remotely access and control systems without detection, which aligns with the MITRE ATT&CK tactic for Command and Control (T1071) and the technique for Application Layer Protocol (T1219).

  The primary telemetry sources are Windows network connection logs, specifically those that capture detailed outbound connection events. If malicious, this activity can lead to unauthorized access, data exfiltration, or establishing persistence on targeted systems. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate usage of WebRDP may occur within corporate environments.

  ### Investigation Steps

  - **Review network connection logs**: Check Windows Event ID 5156 (Windows Filtering Platform) for connections that correspond with the detection criteria, focusing on the destination hostname ending in "user_managed."

  - **Identify legitimate WebRDP usage**: Cross-reference timestamps of the alert with known scheduled maintenance activities to differentiate between authorized administrator usage and potential malicious connections.

  - **Examine process creation events**: Look for related Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 logs on affected hosts to identify if a WebRDP process initiated the network connection.

  - **Analyze user accounts associated with connections**: Check for unusual or unauthorized user accounts initiating the connection, examining Security Event ID 4624 (Successful Logon) for account legitimacy.

  - **Investigate file changes or creation**: Use File Audit logs to validate whether any unauthorized files or executables related to WebRDP were created or modified during the connection timeframe.

  - **Correlate with other detections**: Review alerts for related indicators of compromise, such as unauthorized file access or lateral movement within the environment to establish a broader picture of potential compromise.

  ### Prioritization

  The severity of this alert is medium, as it targets systems potentially exposing them to remote access tools commonly used in post-exploitation scenarios. The likelihood of malicious intent is moderate, given the specific targeting of user-managed hosts, but this behavior may also stem from legitimate administrative actions.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of WebRDP within the organization, potentially leading to false positives. Ensure comprehensive logging is enabled for network connections and process creation events to accurately capture related activity. Note that similar remote management tools may trigger alerts, making it important to correlate detection with broader context indicators to ascertain true intent.

