  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the WebRDP remote management tool, typically used for administrative access to Windows systems. The likely attacker objective is to establish remote control over compromised systems, facilitating further malicious actions such as lateral movement or data exfiltration. This behavior maps to the MITRE ATT&CK framework under the tactic of "Execution" and the technique of "Command and Control" (T1219). The primary telemetry source includes Windows network connection logs that capture outbound connections made by processes.

  If malicious, this behavior could lead to unauthorized access, control over enterprise systems, and sensitive data exposure. However, this detection does NOT confirm malicious activity on its own, as WebRDP can also be used legitimately for remote desktop management.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Network Connection logs (Event ID 5156) for outbound connections to `user_managed` or `github.com/Mikej81/WebRDP`. Look for connections initiated from non-administrative user accounts as a sign of potential compromise.

  - **Identify associated processes:** Correlate the network connection logs with process creation events (Event ID 4688) around the same timestamp to identify any unusual processes, especially those initiated by standard users rather than administrative accounts.

  - **Examine historical usage:** Investigate documented legitimate use of WebRDP within your organization. Conduct team outreach to verify if any admins recently utilized WebRDP tools, ensuring this is not expected behavior based on scheduled maintenance.

  - **Look for anomalies:** Check for unusual patterns such as multiple connections from the same host to the detected domains within a short timeframe, which can indicate automated exploitation attempts or recon activities.

  - **Analyze data transfer:** Assess for any large data transfers or unusual file access patterns during the same timeframe, which could indicate data exfiltration activities leveraging the WebRDP tool.

  ### Prioritization

  The severity of this alert is medium, as it indicates potential use of a remote management tool that, while legitimate, is also frequently abused by attackers for unauthorized system control. Systems showing unusual connections or activity with proposed domains warrant immediate investigation, especially if they are considered critical assets.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of WebRDP for support or administration, which can trigger false positives. Reliable detection relies on appropriately configured network monitoring and logging settings. Routine administrative tasks involving legitimate WebRDP usage could also activate this alert. To enhance detection coverage, consider companion rules for unusual user account logins or abnormal authentication patterns to help differentiate between legitimate and malicious activity.

