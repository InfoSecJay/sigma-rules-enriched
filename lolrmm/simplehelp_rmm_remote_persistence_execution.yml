logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|contains:
    - '\ProgramData\JWrapper-Remote Access\JWAppsSharedConfig\restricted\'
    - '\ProgramData\JWrapper-Remote Access\JWAppsSharedConfig\'
    Image|endswith:
    - '\SimpleService.exe'
    - '\serviceconfig.xml'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the execution of the Simple Help Remote Monitoring and Management (RMM) software, which adversaries may use to establish unauthorized remote access to compromised systems. Attackers might deploy such tools after initial access to maintain persistence within a target environment. The presence of this remote access software, especially when masquerading as legitimate applications, can indicate a significant security risk and may facilitate data exfiltration or further infiltration into the network.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence** (TA0003), as indicated by the technique **Install Additional Tools** (T1543.003). In scenarios where Simple Help is deployed, attackers typically aim to map the environment, gather intelligence, and create a foothold for continued access. The primary data sources for this detection rule include process creation events from Windows systems, which can provide evidence of unauthorized software execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation logs for instances of `SimpleService.exe` or any file paths associated with the Simple Help installation. Focus on timestamps that correlate with the alert to assess the context of the activity.
  - **Analyze Configuration Files**: Check for the presence of the `serviceconfig.xml` file in the identified directories, as it may contain sensitive configuration information or details on the remote access setup.
  - **Inspect Network Traffic**: Monitor network traffic for connections originating from the compromised systems to external IP addresses. Look for unusual patterns or communication behavior indicative of remote access tool usage.
  - **Correlate with User Activity**: Investigate user accounts and machine activity around the time of execution to identify any anomalies or unauthorized access attempts linked to the detected process.

  ### Prioritization
  The alert is marked as high severity due to the potential impact of unauthorized remote access tools on an organization’s security posture. Persistent access through such software allows attackers to maintain control over compromised systems, increasing the likelihood of data breaches or further network exploitation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited where logging for process creation events or related configurations is not properly enabled. The rule assumes that the Simple Help software is installed in the specified paths without variations. Organizations should ensure that all relevant logging mechanisms are activated and configured to capture comprehensive details about process executions to avoid gaps in detection. Additionally, effective monitoring of the threat landscape is needed to identify other remote access tools that could be used in similar scenarios.

