title: Malicious Remote Access Execution Via Simple Help RMM Software
id: bfc9f08f-59c2-4346-807e-a67b6d7621fd
status: stable
description: This rule can detects additional remote access tools, often masquerading
  as legitimate software, to maintain persistence and access to compromised systems.
  In one observed incident, adversaries installed the Simple Help Remote Monitoring
  and Management (RMM) tool after gaining initial access through ScreenConnect.
references:
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
author: Phyo Paing Htun
date: 2024/10/16
tags:
- attack.persistence
