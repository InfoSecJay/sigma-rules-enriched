note: |
  ### Technical Context
  This rule detects potential network activity related to the ShowMyPC Remote Management Tool (RMT), which enables remote control over computers for support and administration purposes. While ShowMyPC can be used for legitimate reasons, attackers sometimes exploit remote management tools to gain unauthorized access to systems, control compromised devices, or exfiltrate sensitive data. The detection focuses on identifying outbound connections to ShowMyPC domains, signifying potential misuse in the form of unauthorized remote access attempts.

  The suspected threat family encompasses unauthorized remote access through tools intended for legitimate use, often associated with the execution tactic which includes techniques for establishing remote connections (MITRE ATT&CK Tactic: Execution). In this context, technique T1219 (Remote Access Tools) specifically applies, as it indicates the use of remote administration utilities to facilitate attacker actions. The primary data sources, in this case, will be network connection logs, which capture the destination hostnames and ports being accessed.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine the logs for outbound connections to any `showmypc.com` domains and look for patterns of unusual frequency or timing that could indicate malicious intent.
  - **Correlate with User Activity:** Check user activity logs to identify whether legitimate users within the environment were engaged in activities that typically correlate with ShowMyPC use, such as remote support sessions or IT administration tasks.
  - **Assess Endpoint Security Alerts:** Analyze alerts from endpoint detection tools for any processes or applications associated with ShowMyPC that may have been executed around the same time as the detected network activity.
  - **Investigate Related Communication:** Check for any other network traffic that might suggest lateral movement or post-exploitation behavior, especially if the ShowMyPC connections coincide with suspicious log-ins or credential use.

  ### Prioritization
  The alert has a medium severity due to the potential for significant impacts on network security and data integrity. While the legitimate use of ShowMyPC exists, unauthorized use by an attacker to maintain persistence could lead to serious breaches, data loss, or other detrimental outcomes.

  ### Blind Spots and Assumptions
  The detection logic primarily relies on the observation of outbound network connections to the specified domains associated with ShowMyPC, which may not capture all instances of remote access tool usage if they are being directed to other domains or if they utilize alternative methods such as direct IP addresses. An assumption is that traffic to these domains is an indicator of misuse; however, this may lead to false positives from legitimate business usage. Required log sources include comprehensive network connection logs that track all outbound traffic from endpoints, and configurations should be in place to ensure complete visibility of such outbound connections.

