note: |
  ### Technical Context

  This rule detects network connections to the ShowMyPC Remote Management Tool (RMM), typically employed by attackers for unauthorized access and control of compromised systems. The likely attacker objective is to establish a remote session to facilitate data exfiltration or further exploitation. The relevant MITRE ATT&CK tactic and technique is Remote Access (T1219). Primary telemetry sources are Windows network connection logs, specifically focusing on DNS queries resolving to `*.showmypc.com` or `showmypc.com`. If malicious, this activity can indicate significant security risks including unauthorized system access and data breaches. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate administrative activity may also trigger the rule.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Security Event ID 5156 (Windows Filtering Platform) for detailed logging of connection attempts to `*.showmypc.com` or `showmypc.com`. Assess timestamp and source IP addresses to correlate with user activity.

  - **Validate process execution:** Identify any active ShowMyPC processes through Sysmon Event ID 1, looking for `showmypc.exe` or related child processes on the affected host. Compare running processes against baseline for expected applications.

  - **Examine user activity:** Investigate user logins prior to the alert using Windows Security Event ID 4624 (Logon). Determine if the login activity aligns with legitimate administrative operations or access to remote tools.

  - **Identify DNS queries:** Check DNS logs to identify queries resolving to `*.showmypc.com`. Correlate these queries with active sessions on endpoint devices to establish a timeline of potential unauthorized access.

  - **Review legitimate use cases:** Confirm if there is any documented usage of the ShowMyPC tool by IT or support teams within the last 30 days. Validate through internal documentation, support tickets, or scheduled maintenance records.

  ### Prioritization

  This alert warrants medium severity due to the potential impact of remote access on critical systems. While RMM tools like ShowMyPC can be misused, their legitimate administrative use cases exist, raising the likelihood of false positives. However, the behavior observed in this alert is commonly weaponized in attack scenarios, particularly for post-exploitation stages.

  ### Blind Spots and Assumptions

  Detection may be limited by organizational policies that allow legitimate use of RMM tools, creating a risk of not capturing all malicious instances. Log configurations must include detailed DNS and network connection logs to ensure comprehensive coverage. Legitimate activities, such as authorized system maintenance or support sessions, could trigger this alert. Companion detections for process creation or user logon activities provide better context and help confirm whether remote access was purposeful or unauthorized.

