note: |
  ### Technical Context

  This rule detects outbound network connections to the ShowMyPC Remote Management and Monitoring (RMM) tool. The likely attacker objective is to remotely access and control compromised systems, facilitating further malicious activities like data exfiltration or lateral movement. This behavior is associated with the MITRE ATT&CK tactic Command and Control (T1071) and technique Application Layer Protocol (T1219). Primary telemetry sources include network connection logs with relevant details such as destination hostnames and connection timestamps. If malicious, this behavior could indicate unauthorized access to sensitive systems. However, this detection does NOT confirm that the activity is malicious on its own since legitimate users may use ShowMyPC for remote support.

  ### Investigation Steps

  - **Verify destination connection:** Check for outbound connections to `*.showmypc.com` or `showmypc.com` in Windows Firewall logs (Event ID 5156). If the connection aligns with known benign usage, document the case.

  - **Inspect process lineage:** Analyze active processes on the host using Sysmon Event ID 1 for process creation related to ShowMyPC. Verify the parent process and command line arguments to determine if the connection is associated with legitimate remote access.

  - **Review recent login events:** Look at Security Event ID 4624 to examine logins preceding the connection time. Unusual login times or accounts not typically used for remote access could indicate malicious activity.

  - **Analyze other network traffic:** Utilize NetFlow data or packet captures to examine surrounding traffic patterns. Look for unusual data exfiltration indicators, such as large outbound data volumes during the ShowMyPC session that exceed baseline metrics.

  - **Identify known signatures:** Compare the destination IPs against threat intelligence sources to determine if any have been reported for malicious activity. A known malicious IP may indicate a high-confidence malicious indicator.

  - **Document legitimate usage examples:** Gather evidence of known organizational usage of ShowMyPC, including any approved policies regarding its use. This documentation helps establish a baseline for acceptable behavior.

  ### Prioritization

  This alert has medium severity from an enterprise perspective. The affected system's impact could vary based on its role within the organization, though the likelihood of malicious abuse via RMM tools is notable due to their potential for unauthorized access. Furthermore, RMM tools like ShowMyPC are common entry points for adversaries.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative remote access tools that do not resolve to `showmypc.com`. It requires properly configured network visibility logs to ensure reliable detection. Legitimate instances of ShowMyPC may trigger the alert, necessitating context around user roles and established network policies. Monitoring for process execution of commonly abused remote access tools would support this detection and enhance coverage.

