note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the ShowMyPC remote management tool. The likely objective of an attacker using ShowMyPC is to establish unauthorized remote access to a compromised system, facilitating data exfiltration or lateral movement within the network. This activity relates to the MITRE ATT&CK tactics and techniques of Command and Control (T1071) and Remote Access Tools (T1219). The primary telemetry sources include network connection logs that record outbound traffic, specifically focusing on DNS requests or established connections to the ShowMyPC domain. If this activity is malicious, it poses significant risks such as unauthorized access to sensitive data, system manipulation, or further network compromise. This detection does not independently confirm malicious activity as legitimate uses of ShowMyPC by authorized personnel may trigger the alert.

  ### Investigation Steps

  - **Identify outbound connections:**
    Review network connection logs for connections to ShowMyPC domains (e.g., `showmypc.com`, `*.showmypc.com`) using Security Event ID 5156 or Windows Firewall logs. Validate if the source IP is a known or unusual asset for accessing remote tools.

  - **Analyze endpoint activities:**
    Use Sysmon Event ID 3 (Network connection) to trace the processes initiating these connections. Look for unexpected or suspicious parent processes (e.g., powershell.exe, cmd.exe) that might indicate malicious activity versus normal usage.

  - **Verify legitimate usage:**
    Check if the affected host has documented use cases for ShowMyPC by referencing internal IT support tickets or documentation. Confirm if the user associated with the activity is authorized to use remote desktop tools.

  - **Inspect user account activity:**
    Review authentication logs (Windows Security Event ID 4624) to determine which accounts initiated outbound connections to the domains. Investigate if the user account's behavior aligns with typical activity patterns.

  - **Investigate network telemetry:**
    Examine DNS logs for queries to `showmypc.com` or its subdomains, assessing patterns such as frequency and timing. Frequent requests may indicate non-standard use of the tool or automated attempts to connect.

  ### Prioritization

  This alert has medium severity based on the potential impact of affected systems, especially if they involve critical assets. The likelihood of malicious abuse is moderate, as ShowMyPC is a legitimate tool, but it may be weaponized for remote access if misused. Given its nature, seeing this network activity in critical infrastructure warrants prompt investigation.

  ### Blind Spots and Assumptions

  The detection may miss cases where ShowMyPC is obfuscated via alternate domains or encrypted traffic, limiting visibility into its use. Reliable detection necessitates proper logging configurations for network connections and DNS resolutions across the enterprise. Legitimate business processes, such as remote support sessions from IT staff, might generate this alert. A companion detection to increase coverage would be monitoring for unusual account logins from geographic locations or IPs that do not match the user's typical behavior pattern.

