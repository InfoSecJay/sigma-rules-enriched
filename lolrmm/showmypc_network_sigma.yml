note: |
  ### Technical Context

  This Sigma rule detects network connections to ShowMyPC's Remote Management Tool (RMM), primarily characterized by DNS queries and outbound connections to domains ending with '*.showmypc.com'. The likely objective is unauthenticated remote access or management of systems in a manner that exceeds typical user permissions. This activity fits into the MITRE ATT&CK framework under the tactic of Execution and specifically targets technique T1219 (Remote Access Software).

  The primary telemetry sources include Windows network connection logs, specifically looking for Event ID 5156 (Windows Filtering Platform) or network monitoring data capable of capturing DNS requests. If malicious, this behavior could lead to unauthorized remote access, data exfiltration, or lateral movement. However, this detection does NOT confirm that malicious activity is occurring; it requires further investigation to establish intent and context.

  ### Investigation Steps

  - **Review outbound connections to ShowMyPC domains:** Check for Event ID 5156 in Windows Security logs for any connections made to '*.showmypc.com'. Document timestamps and source IP addresses. Finding high volumes of connections from internal hosts may indicate potential abuse.

  - **Analyze DNS resolution logs:** Look for DNS queries to showmypc.com in your DNS logs (e.g., Microsoft DNS Server logs). Verify if the queries correlate with known legitimate users of ShowMyPC, thereby confirming benign activity.

  - **Validate process creation events:** Check Sysmon Event ID 1 for any process creation attributed to ShowMyPC executable files. Compare file paths and parent processes to identify unusual execution context, such as being launched from non-standard directories.

  - **Identify associated user accounts:** Determine which user accounts initiated connections to ShowMyPC and cross-reference roles and responsibilities. Legitimate connections should reflect typical use by authorized IT support personnel.

  - **Examine sibling process activity:** Analyze if there are other suspicious outbound connections (e.g., to known malicious domains or non-standard ports) executed by the same process or user account, indicating potential compromised systems.

  ### Prioritization

  This alert carries medium severity due to its potential impact on sensitive systems that may be accessed remotely. The abuse of remote access tools like ShowMyPC is often weaponized in social engineering attacks, increasing the likelihood of malicious intent. Therefore, rapid investigation is warranted to ensure unauthorized access does not occur.

  ### Blind Spots and Assumptions

  Detection may be limited if ShowMyPC is obscured by obfuscation techniques or used over non-HTTP/HTTPS protocols. Reliable detection requires comprehensive log collection from both endpoint systems and DNS servers. Legitimate IT support activity or authorized remote sessions may unintentionally trigger this alert. A companion detection targeting other remote access tools like TeamViewer or AnyDesk can help strengthen coverage against unauthorized remote support activities.

