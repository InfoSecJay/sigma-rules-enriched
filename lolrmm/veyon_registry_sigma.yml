note: |
  ### Technical Context

  This Sigma rule detects potential registry modifications associated with the Veyon Remote Management and Monitoring (RMM) tool. The behavior being monitored includes changes specifically to registry keys that configure the software’s installation and service settings. The likely attacker objective may involve establishing persistent access or control of targeted systems, indicative of lateral movement or reconnaissance phases during an attack.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002), and the technique is **User Execution: Lure** (T1219). Primary telemetry comes from Windows registry event logs, specifically monitoring access or changes to the `HKLM\SOFTWARE\Veyon Solutions` and `HKLM\SYSTEM\CurrentControlSet\Services\VeyonService` registry keys. If malicious, this activity could lead to unauthorized remote access and control over the affected systems. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate use of Veyon may trigger similar alerts.

  ### Investigation Steps

  - **Identify the source of the event:** Review Windows Event Logs related to registry changes using Event ID 4657 and cross-reference with timestamps of the alert to determine if the changes correspond to unexpected times or users.

  - **Correlate user activity:** Check the security logs for user login records (Event ID 4624) within the same timeframe. Confirm if the user accessing the registry has legitimate administrative privileges, ensuring they typically interact with Veyon.

  - **Examine detailed registry access:** Use the Registry Viewer to verify the specific changes made - ideally, sign-off on keys under `HKLM\SOFTWARE\Veyon Solutions` and `HKLM\SYSTEM\CurrentControlSet\Services\VeyonService`. Document any modifications to service settings that deviate from standard configurations.

  - **Review process creation logs:** Look for related process creation events (Event ID 4688 or Sysmon Event ID 1) that indicate execution of the Veyon service or management actions to authenticate the legitimacy or potential malicious use of Veyon.

  - **Check for other unusual activity:** Monitor for additional indicators of compromise (IoCs) such as unusual outbound network connections (using firewall logs) that may correlate with a Veyon RMM deployment, indicating potential exploitation.

  ### Prioritization

  The severity of this alert is moderate due to the potential impact of unauthorized remote access facilitated by Veyon, particularly on critical servers. While Veyon can be used legitimately, its functionality is often weaponized by adversaries for remote control, making it a notable risk. Analysts should prioritize alerts involving sensitive or critical systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Veyon, potentially leading to false positives. Ensure that registry event logging is enabled at an appropriate level in order to capture all relevant changes. Legitimate administrative modifications could trigger similar alerts, necessitating careful correlation of context. Related detection would be monitoring for unusual service creations or modifications under the **Service Registry** technique (T1569.002), which could enhance visibility into potentially malicious configurations.

