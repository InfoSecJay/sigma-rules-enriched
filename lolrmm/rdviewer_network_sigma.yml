note: |
  ### Technical Context

  This rule detects outbound network connections to the RdViewer Remote Monitoring and Management (RMM) tool infrastructure. Attackers may leverage RMM tools like RdViewer to establish persistent access, facilitate remote control of compromised systems, and exfiltrate data. The relevant MITRE ATT&CK tactic is Command and Control (T1071 - Application Layer Protocol). Primary telemetry sources include Windows network connection logs and associated DNS queries for the specified hostnames. If the activity is malicious, it could indicate an unauthorized remote administration or data theft scenario. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate users may utilize RdViewer in their roles.

  ### Investigation Steps

  - **Identify network connections to RdViewer hosts:** Review network connection logs, focusing on Event ID 5156 (Windows Filtering Platform), specifically for any connections to `*.rdviewer.oss-cn-hangzhou.aliyuncs.com`. Assess the purpose and context of the traffic.

  - **Examine associated DNS queries:** Check DNS logs (Windows Event ID dns queries logging) for resolution requests to `rdviewer.oss-cn-hangzhou.aliyuncs.com` within the same time frame as the detected connection. Legitimate queries might originate from known administrative hosts.

  - **Monitor for unexpected software installation:** Look for installation events (Event ID 11707) relative to the RdViewer application on endpoints. The presence of RdViewer on an endpoint without prior knowledge could indicate potential compromise.

  - **Review user activity patterns:** Analyze user activity logs to identify users frequently connecting to RdViewer endpoints. Cross-check against legitimate business needs or roles and look for unusual access patterns that may suggest unauthorized use.

  - **Check for lateral movement indications:** Search for indications of lateral movement, such as Event ID 4624 (Logon) showing a user logging in remotely to multiple systems in quick succession. Confirm if this correlates with RdViewer connections.

  - **Document file transfers or remote sessions:** Validate any file transfer logs associated with RdViewer sessions using Event ID 5140 (Network Share Access). Look for unusually large or sensitive data being transferred that may indicate exfiltration attempts.

  ### Prioritization

  This alert is of medium severity as it could indicate potential misuse of remote administration tools, which are commonly abused by adversaries for malicious purposes. The affected systems' criticality and potential impact on sensitive environments heighten the urgency to investigate.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations, especially around legitimate tool usage. Evasion techniques could include changing the destination hostname or using encrypted traffic to obfuscate connections. Legitimate administrative functions using RdViewer can trigger the alert, necessitating additional context. An associated detection for anomalous user behavior (anomalous logon events) would complement this alert and enhance overall detection capabilities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
