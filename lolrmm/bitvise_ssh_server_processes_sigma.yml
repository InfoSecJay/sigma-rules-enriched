note: |
  ### Technical Context

  This detection rule identifies the execution of processes associated with the Bitvise SSH Server Remote Management (RMM) tool, specifically targeting instances where the executable `BvSshServer-Inst.exe` is launched either directly or as a child process. An attacker may leverage this tool for unauthorized remote access or management of systems, potentially allowing them to maintain persistence or control over compromised environments. This activity directly relates to the MITRE ATT&CK technique for Remote System Control (T1219).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688, which records details about process launches on the system. If malicious, the impact could be significant, as attackers can use this tool to gain control over the system and conduct further actions within the network. Importantly, this detection alone does not confirm malicious intent; it may also indicate legitimate administrative activities depending on the context and environment.

  ### Investigation Steps

  - **Examine event logs for process creation:** Review Security Event ID 4688 for logs associated with `BvSshServer-Inst.exe`. Confirm the process was not initiated by known system administrators or valid scheduled tasks. Look for elevation of privileges or unexpected users associated with this action.

  - **Identify the parent process:** Investigate the parent process that spawned `BvSshServer-Inst.exe`. If the parent is also `BvSshServer-Inst.exe`, note the recursion, which may indicate malicious usage. Cross-reference parent process details from Windows Event ID 4688.

  - **Review user account activity:** Check for any associated user accounts with the process execution. Review the user's login history (Security Event ID 4624) to verify if the account has been actively used for legitimate administrative tasks or if it's a potentially compromised account.

  - **Determine asset criticality:** Assess the system on which the process was executed. Identifying whether it hosts sensitive data or critical applications will help gauge the potential impact, particularly if malicious use is suspected.

  - **Document legitimate usage patterns:** Confirm acceptable use patterns of `BvSshServer-Inst.exe` within your organization. If legitimate usage is known, ensure ongoing monitoring to differentiate between normal operational activities and potential threats.

  - **Check for unusual network connections:** Investigate network logs (Firewall or Proxy logs) for any outgoing connections initiated by hosts running `BvSshServer-Inst.exe`, particularly to suspicious IP addresses. This can indicate exfiltration or command-and-control communication.

  ### Prioritization

  The medium severity of this alert arises from its capacity to indicate malicious activity on systems, particularly if the executed process is on critical assets. The use of the Bitvise SSH Server for unauthorized remote access is a common tactic among adversaries, thus making it an alert that warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded by legitimate administrative activities that utilize Bitvise, which could mask malicious attempts if proper logging practices are not enforced. Required log sources include comprehensive process creation logs and thorough user account activity tracking. Furthermore, benign administrative scripts or automated tasks could inadvertently trigger this detection, so context should always be taken into account. A companion detection to consider is monitoring for anomalous user behavior or privilege escalation events in conjunction with this alert for heightened accuracy.

