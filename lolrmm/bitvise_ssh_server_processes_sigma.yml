note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Bitvise SSH Server RMM tool. Attackers may use this tool to establish remote access to compromised systems, facilitating further malicious activities such as data exfiltration or lateral movement. This behavior correlates with the MITRE ATT&CK Tactic: Command and Control (TA0011) and Technique: Application Layer Protocol (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 for process creation, detailing the parent-child relationship of the executed processes. If malicious, such usage can allow an adversary to maintain persistence and control over the target system. However, the detection does NOT confirm malicious activity solely on its own, as it may also indicate legitimate use in authorized network environments.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for instances where the Image field contains `BvSshServer-Inst.exe`. Validate if the process was spawned as a child of a legitimate parent process or any suspicious parent.

  - **Identify network activity:** Examine network traffic logs (e.g., firewall or proxy logs) for outbound connections to unusual IPs or domains associated with the Bitvise tool, including the protocol and port used (commonly TCP/22).

  - **Review user activity:** Analyze the user accounts associated with the process creation (found in the Event ID 4688 logs). Check if the account executing the process is a known system administrator or a non-privileged user with no historical authorization for using remote management tools.

  - **Correlate with legitimate usage scenarios:** Confirm if Bitvise SSH Server has been authorized and configured for use within your environment, including expected usage patterns like scheduled management or monitoring tasks performed during specific hours.

  - **Investigate for high-confidence indicators:** Look for additional artifacts such as files created or modified during the execution of `BvSshServer-Inst.exe`, particularly in the installation directory or any related temporary directories. Specifically, check the presence of logs or output files that can indicate an internal or client-based attack.

  ### Prioritization

  This alert has medium severity due to the specific nature of the process involved, which could indicate legitimate administrative activity or potential adversarial access. The likelihood of malicious abuse is moderate to high, given the tool's capabilities to enable remote control, which is often weaponized in real-world attacks against vulnerable systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of systems using Bitvise SSH Server for legitimate purposes, potentially leading to false positives in environments where this tool is authorized. It's essential to ensure that logs for process creation (Event ID 4688) are collected consistently across critical systems for reliable detection. Legitimate server maintenance or updates may also trigger this alert. Companion detections include monitoring for anomalous user behavior or unusual access patterns consistent with privilege escalation attempts.

