note: |
  ### Technical Context

  This detection rule identifies network connections to specific hostnames associated with the Level RMM tool, particularly for remote monitoring and management tasks. The likely attacker objective is to utilize this tool for unauthorized access or manipulation of target systems, potentially leading to data exfiltration or additional exploitation of vulnerabilities within the environment. The relevant MITRE ATT&CK technique is Remote Management Software (T1219). Primary telemetry sources include Windows event logs related to network connections, specifically focusing on destination hostnames that match the defined criteria.

  The security impact of this detection is significant. If malicious, it indicates potential threat actor use of remote management tools to execute further attacks or maintain persistence on compromised systems. However, this detection does NOT confirm malicious activity on its own; legitimate network activity by authorized administrators using Level RMM may also trigger this alert.

  ### Investigation Steps

  - **Review network connection logs**: Examine Windows Security Event ID 5156 (Windows Filtering Platform) for associated connection attempts to the specified hostnames (level.io, builds.level.io, agents.level.io, online.level.io, downloads.io).

  - **Validate hostname connections**: Verify if the connection attempts originated from known administrative or support hosts. Legitimate activity typically involves connections initiated from designated IT support machines rather than user workstations.

  - **Check for anomalous user activity**: Analyze User Account Activity logs (Event ID 4624 and 4625) to identify any anomalous accounts making connections to the Level RMM service. High confidence malicious indicators may include connections from unfamiliar administrative accounts.

  - **Assess DNS query logs**: Investigate DNS logs to confirm resolution of suspicious hostnames and correlate with connection times. Log fields may include the queried hostname and the source IP to determine if unexpected systems are contacting the RMM servers.

  - **Investigate scheduled tasks or startup items**: Check for newly created tasks or startup programs that relate to the Level RMM tool, focusing on Event IDs 4697 and 7035. These can indicate attempts to establish persistence on the host.

  ### Prioritization

  This alert carries medium severity, as it indicates potential misuse of a remote management tool, which could lead to widespread compromise if exploited. The likelihood of adversaries using such tools is moderate, particularly in environments where remote administration is commonplace. This behavior is not rare and may represent a common method for attackers to maintain access.

  ### Blind Spots and Assumptions

  Detection limitations exist due to potential evasion techniques such as traffic encryption or tunneling, which could obscure legitimate management usage from detection. Reliable detection requires consistent logging from Windows event sources, particularly for network activities. Legitimate activities such as scheduled updates or IT maintenance may trigger this alert, complicating response efforts. Companion detections such as monitoring for unusual administrative access patterns or other remote access tools will strengthen overall security posture against unauthorized use of remote management software.

