note: |
  ### Technical Context
  This detection rule identifies potential network activity related to the Level Remote Monitoring and Management (RMM) tool, which is commonly utilized by IT service providers for managing client environments. Attackers may exploit RMM tools like Level to perform unauthorized actions, such as remote access to systems, data exfiltration, or lateral movement within the network. The rule focuses on network connections to specific hostnames associated with Level, suggesting monitoring for potential misuse of the tool by threat actors.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), which involves the execution of malicious code, and the technique **Remote Services** (T1219), which describes methods for remote system access. These tactics and techniques highlight the risk involved in unauthorized RMM tool usage, particularly when leveraged by adversaries seeking to compromise and control victims' machines.

  Primary data sources for detection include network connection logs from firewalls or endpoint devices, which can provide insight into outbound traffic patterns and help identify anomalous communications to the specified hostnames associated with Level.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine the network connection logs for any HTTP/HTTPS requests directed at the identified Level hostname patterns to establish whether legitimate or suspicious activity is occurring.

  - **Correlate with EDR Data:** Investigate endpoint telemetry available from EDR solutions to identify any processes that executed around the same time as the observed network activity, focusing on unusual or unauthorized applications.

  - **Check for Privileged Access:** Verify if accounts showing anomalous network behavior possess elevated privileges within the environment, which may indicate a compromise of administrative accounts.

  - **Validate Legitimate Use Cases:** Identify any authorized use of the Level RMM tool within the organization to differentiate between legitimate and potentially malicious activity, particularly from users with known roles in IT management.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential impact of unauthorized remote access facilitated by RMM tools, which can lead to significant data breaches or system compromises if exploited by threat actors. The likelihood of such an incident is moderate, considering the popularization of RMM solutions in enterprise environments.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if network traffic is encrypted or if outbound connection logs are not adequately captured, potentially obscuring malicious communications. The detection relies on the assumption that all legitimate instances of Level's use are properly documented and that users accessing the tool have been adequately vetted. Effective monitoring of network logs must be configured to ensure the rule operates as intended, including proper logging of outbound connection attempts and associated metadata for sophisticated analysis.

