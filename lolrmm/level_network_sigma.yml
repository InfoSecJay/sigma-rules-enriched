note: |
  ### Technical Context

  This detection rule identifies potential network activity associated with the Level Remote Monitoring and Management (RMM) tool. Specifically, it looks for outbound connections to predefined domains that may be leveraged by adversaries for persistence and command-and-control purposes. The likely attacker objective is to exploit legitimate remote management software for maintaining access to compromised systems while obscuring their actions. This behavior correlates with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219).

  Primary telemetry sources for this detection include Windows network connection logs, particularly focusing on DNS queries and outbound traffic logs. If malicious, this could signify an adversary attempting to control or exploit a compromised system. However, this detection alone does NOT confirm malicious intent or activity; legitimate use of the Level tool can trigger the same alerts.

  ### Investigation Steps

  - **Review related network connections:**
    Analyze Windows network connection logs (Event ID 5156) to find other connections from the same IP or user context, focusing on connections that resolve to suspicious IPs associated with the detected domains.

  - **Identify legitimate use cases:**
    Verify if any authorized personnel within the organization utilize the Level RMM tool for remote maintenance. Check organizational policies and confirm user roles to validate expected behaviors.

  - **Check for additional indicators of compromise (IOCs):**
    Look for unusual process creation linked to the detected domains by analyzing Security Event ID 4688 (Process Creation) and correlating with known malicious processes or signs of exploitation.

  - **Examine DNS query logs:**
    Investigate recent DNS queries to the flagged domains in Windows DNS logs to determine frequency and legitimacy of requests. Look for high volumes that may indicate automated malicious activity.

  - **Validate process integrity:**
     Assess the integrity and source of processes connecting to the flagged domains by checking Sysmon Event ID 1 (Process Creation) for command-line arguments that may indicate malicious intentions or tools.

  ### Prioritization

  This alert has medium severity as it indicates potentially unauthorized usage of RMM tools, which can be significant depending on the system's role in the environment. The likelihood of malicious use exists as such tools can be weaponized for lateral movement or persistent access. Instances of this behavior are rising in various attack scenarios, necessitating prompt review and validation.

  ### Blind Spots and Assumptions

  This detection may miss legitimate uses of the Level RMM tool, leading to false positives. The detection relies on accurate outbound network logging and DNS resolution from adequate logging sources, which must be properly configured for reliable monitoring. There is a potential for misattributing benign activity, especially if several systems employ the tool within the organization. A related detection could involve monitoring for abnormal user activity patterns or unusual process behaviors that corroborate the potential malicious use of RMM tools.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
