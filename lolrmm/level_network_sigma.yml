note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with Level RMM (Remote Monitoring and Management) tools. The typical behavior involves endpoints attempting to communicate with Level's infrastructure for management or support purposes, which may indicate malicious use if an adversary is leveraging these tools for remote control or persistence within a victim's network. Relevant MITRE ATT&CK techniques include **Command and Control** (T1071) and **Application Layer Protocol** (T1219). Primary telemetry sources include network connection logs from Windows, specifically monitoring for outbound connections to the specified Level domains. If these connections are initiated without authorization, it could facilitate attacker control over systems, posing significant security risks. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative use of these tools can trigger the alert.

  ### Investigation Steps

  - **Verify the connection destination:** Check outbound network connections via Windows Security Event ID 5156 (Windows Filtering Platform) or an equivalent network log to confirm if there were any connections made to the domains listed (e.g., `level.io`, `agents.level.io`).
  - **Identify user context:** Review the user account making the connection. Look for potentially compromised credentials by checking Security Event ID 4624 (Successful Login) for accounts not known to be part of legitimate IT functions or unexpected login times.
  - **Examine process details:** Investigate the associated process using Sysmon Event ID 1 (Process Creation). Identify if the process making the connection is a known legitimate service or application (e.g., RMM tools) and confirm that it runs from expected directories.
  - **Observe for patterns:** Analyze whether the communication occurs consistently or in a pattern typical of RMM operations (e.g., repeated connections at regular intervals). Legitimate Level RMM usage would typically show predictable operational behavior.
  - **Review for known bad indicators:** Check for previously documented malicious activity involving Level domains within threat intelligence feeds. Compare the connection details against such indicators to identify high-confidence malicious interactions.
  - **Document and escalate if necessary:** If indicators of compromise (IOCs) are found, such as a known malicious process or unauthorized connections, escalate the incident for further investigation.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized access to critical systems if Level RMM tools are misappropriated. Depending on the asset criticality and the nature of connected endpoints, there is a moderate likelihood of malicious exploitation, particularly since these tools are often weaponized in targeted environments.

  ### Blind Spots and Assumptions

  Detection may be limited as adversaries might use techniques to obfuscate true traffic patterns or mask connections with similar named services. Reliable logging configurations for full visibility into network connections must be maintained. Legitimate use cases, such as system administrators managing devices via Level RMM, could inadvertently trigger the alert. Companion detections using anomaly detection for unusual outbound traffic patterns could further enhance the robustness of the detection strategy.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
