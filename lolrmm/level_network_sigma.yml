  ### Technical Context

  This Sigma rule detects network connections made to specific domain names associated with the Level RMM (Remote Monitoring and Management) tool. Such toolsets are primarily utilized by administrators for IT management, but they can also serve an adversary's objective of gaining persistent access or executing unauthorized system commands. This behavior fits into the MITRE ATT&CK framework under the "Execution" tactic (TA0002), specifically using the "Remote Services" technique (T1219). The primary telemetry source for this detection is Windows event logs related to network connections.

  If these connections are indeed malicious, they could facilitate unauthorized access to systems, leading to data breaches or deployment of further payloads. However, this detection does NOT confirm malicious intent on its own; legitimate administrative activities may also generate similar connections.

  ---

  ### Investigation Steps

  - **Review network connections**: Analyze Windows Security Event ID 5156 (Windows Filtering Platform Network Connection) for allowed connection attempts to the specified Level domain names. Look for connections made from unexpected hosts or with unusual port usage.

  - **Cross-reference user accounts**: Identify the user account making the connection. Analyze Account Logon Event ID 4624 to determine if the account is administrative or unauthorized. Benign connections typically originate from authorized personnel.

  - **Inspect process creation**: Check Security Event ID 4688 and Sysmon Event ID 1 for processes that initiated these network connections. Legitimate processes from known IT management software will appear frequently but verified inconsistently.

  - **Analyze DNS resolution logs**: Review DNS query logs to confirm whether the host engaged in connecting to the Level domains experienced prior lookups to known malicious IP addresses. This is a high-confidence indicator of potential compromise.

  - **Evaluate response actions**: Examine firewall logs for any blocks or alerts related to outbound connections to the detected domains, noting the timestamps and source IP addresses to trace the activity to specific users or machines.

  - **Asses asset criticality**: Determine if the affected assets are critical infrastructure components. Unauthorized access on high-impact assets warrants immediate escalated response and remediation efforts.

  ---

  ### Prioritization

  This alert should be treated with medium severity, given that connections to Level RMM domains can indicate unauthorized remote access attempts. While not all instances are malicious, the potential for exploitation is high, especially if those systems are critical to business operations.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if network traffic monitoring is inadequate or if outbound rules bypass such connections. Additionally, legitimate IT processes may trigger the alert, exemplified by authorized use of Level RMM by system administrators. Complementary detections, such as monitoring for lateral movement with tools like PsExec or WinRM usage, can strengthen overall security posture.

