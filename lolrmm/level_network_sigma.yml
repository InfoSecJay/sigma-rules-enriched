note: |
  ### Technical Context

  This Sigma rule detects network activity targeting Level RMM (Remote Monitoring and Management) tool domains, which could indicate unauthorized use of remote access tools by an adversary. The likely attacker objective is to utilize RMM capabilities for system management or to facilitate remote access to compromised targets. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1202) and Command and Control (T1219), indicating attempts to establish connections with external malicious infrastructure.

  The primary telemetry sources for this detection include Windows network connection logs, specifically focusing on connections to domains associated with Level RMM (e.g., `agents.level.io`, `builds.level.io`). If malicious actors exploit this tool, they could gain significant access, control, and monitoring capabilities over targeted systems. It’s crucial to note that this detection does NOT on its own confirm malicious activity; legitimate use of the Level RMM tool can trigger these alerts.

  ### Investigation Steps

  - **Review network connections:** Check for network connection logs (Windows Event ID 5156, Windows Filtering Platform) for traffic to Level RMM domains. Look for connections to domains listed in the detection section as a primary indicator of potential abuse.

  - **Correlate with process creation logs:** Investigate process creation events (Windows Event ID 4688, Sysmon Event ID 1) for any processes initiating such network connections. Look for unusual executables or scripts invoking connections, particularly if they are executed by non-administrative users.

  - **Establish legitimate baseline behavior:** Identify expected legitimate connections to these domains by reviewing prior confirmed activity from approved devices or users. Comparison should focus on frequency, timing, and originating device.

  - **Check for unusual user behavior:** Analyze user account activities (Windows Event ID 4624 for logon events) to determine if the traffic originates from atypical accounts or times, especially during off-hours or from unexpected locations.

  - **Identify high-confidence malicious indicators:** Look for associated traffic patterns or unusual command-line arguments in logs that suggest exploitation, such as commands related to remote access, system alteration, or script executions tied to the domain.

  - **Document affected host roles:** If the detected network activity originates from critical assets or servers (e.g., domain controllers or administrative workstations), prioritize further investigation due to the potential security implications.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems if exploited by an adversary using Level RMM. The likelihood of malicious abuse is notable, especially as RMM tools are often targeted by attackers for exploitation. This behavior can be commonly weaponized in targeted environments where remote management tools are employed.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of the Level RMM tool, which could generate false positives. Required log sources for reliable detection include Windows Filtering Platform logs, and appropriate filters must be configured to ensure accurate monitoring. Legitimate activities, such as routine updates or maintenance by IT staff, may trigger this alert without malicious intent. Related detections, such as those monitoring for unusual login attempts (T1078), can enhance coverage and context during investigations of suspicious RMM traffic.

