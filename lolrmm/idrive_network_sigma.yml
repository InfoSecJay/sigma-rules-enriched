note: |
  ### Technical Context

  This rule detects network activity associated with the iDrive remote management tool, specifically connections to its API endpoints. Attackers may utilize the iDrive RMM tool to achieve unauthorized remote access, potentially exfiltrating data or manipulating systems without consent. This behavior is relevant to the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source for this detection is Windows network connection logs, particularly focusing on DestinationHostnames corresponding to iDrive API addresses. If malicious, the security impact could include unauthorized system access and potential data breach. However, this detection does NOT confirm malicious intent on its own, as legitimate use of iDrive for IT management or support purposes can also generate similar network activity.

  ### Investigation Steps

  - **Review network connections:** Check for recent connections captured in Windows Event ID 5156 (Windows Filtering Platform) logs where DestinationHostname matches the iDrive APIs. Confirm network traffic patterns align with typical organizational usage.

  - **Validate context of use:** Inspect endpoint role to ensure that iDrive is a recognized and approved tool within the environment. Cross-reference the user and their permissions through logs (e.g., Security Event ID 4624) to establish if they had legitimate reasons for usage.

  - **Identify potential indicators of compromise:** Look for high-confidence malicious indicators by examining process creation logs (Sysmon Event ID 1 and Security Event ID 4688) on endpoints initiating connections to the iDrive API. Identify unusual command-line arguments that deviate from standard usage patterns.

  - **Document legitimate activity:** Note typical benign behaviors, such as network connections to iDrive being initiated by established administrative user accounts during designated maintenance windows, contrasted against anomalous non-typical timing or user activity.

  - **Correlate with other alerts:** Search for related security event alerts (e.g., unauthorized system access attempts) that may indicate additional malicious behaviors occurring concurrently with the detected network activity to strengthen your investigation.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of unauthorized access to sensitive systems or data through iDrive, especially if observed on critical assets. The likelihood of abuse is realistic as remote management tools are frequently weaponized by adversaries to facilitate their actions. The context of use within the organization will heavily influence prioritization for investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations due to the potential for legitimate iDrive use, which can trigger false positives. Reliable detection requires complete and properly configured Windows network logging to capture all relevant events. The alert may also trigger due to authorized activities from IT support teams managing user devices. A companion detection worth monitoring includes alerts for unusual Remote Desktop Protocol (RDP) activity, which may indicate coordinated attack vectors alongside iDrive usage.

