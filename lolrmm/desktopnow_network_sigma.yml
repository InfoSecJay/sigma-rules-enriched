  ### Technical Context

  This rule detects outbound network connections made by the DesktopNow remote management tool, specifically targeting hostnames that end with ".nchuser.com". The primary purpose of monitoring such connections is to identify potential shadow IT use or the unauthorized access and control of endpoints by attackers leveraging Remote Monitoring and Management (RMM) tools. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1219 - Remote Access Software.

  The primary telemetry source for this detection includes Windows network connection events, particularly DNS query logs or firewall logs revealing connection attempts. If malicious, such behavior could indicate unauthorized access to an organization's systems, potentially leading to data exfiltration or further compromise of the network. It's essential to note that this detection does NOT confirm an ongoing compromise without further context, as legitimate use of DesktopNow could trigger this alert.

  ---

  ### Investigation Steps

  - **Verify the event log details:** Look for Firewall Event ID 5156 or Network Connection logs where the destination hostname ends in ".nchuser.com". Pay attention to the associated user account and process initiating the connection.

  - **Check for patterns in usage:** Review connection timestamps to identify any unusual activity like multiple connections in a short period or connections during off-hours, which may indicate potential abuse rather than legitimate business operations.

  - **Identify legitimate DesktopNow usage:** Cross-reference the identified connections with a whitelist of known assets or users utilizing DesktopNow for remote support. Validate whether the users listed typically engage in this activity.

  - **Gather endpoint context:** Utilize Windows Event ID 4688 (Process Creation) to review the parent process associated with the network connection. Look for any anomalous processes that could indicate malicious use, such as malware triggering RMM tool connections.

  - **Correlate with user behavior analytics:** Analyze user behavior analytics logs for anomalies related to the connecting user accounts, such as unusual login locations or unexpected privilege escalations.

  - **Investigate potential exfiltration artifacts:** If malicious connections are confirmed, review for file creation or modification within sensitive directories such as Downloads or Documents. Look for File Access Event IDs 4663 and correlating with user credentials to identify unauthorized access.

  ---

  ### Prioritization

  This alert is prioritized as medium due to the potential severity of unauthorized remote access to sensitive systems. While DesktopNow has legitimate uses, its common exploitation in attacks increases the likelihood of malicious intent behind detected activity.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of misconfigured or absent network logging, which may prevent visibility into all outbound connection attempts. Legitimate activities, such as authorized remote support tasks, could falsely trigger this alert. To strengthen coverage, consider companion detections that analyze internal traffic patterns or correlate with known vulnerabilities of RMM tools.

