note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Acronis Cyber Protect (Remotix) RMM tool, specifically targeting the "AcronisCyberProtectConnectQuickAssist" and "AcronisCyberProtectConnectAgent" executables. The likely objective of an attacker using this tool would be to gain remote access to an environment or manipulate systems without the knowledge of victims or security personnel. The relevant MITRE ATT&CK tactics include "Execution" and the technique is categorized as "Remote Access Tools" (T1219).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1). If malicious, this behavior can lead to unauthorized access, data exfiltration, or manipulation of system settings. It's crucial to note that the detection of these processes alone does not confirm malicious intent; legitimate administrative use of this tool for remote management may trigger this alert.

  ### Investigation Steps

  - **Identify the Process Details:** Check for Security Event ID 4688 or Sysmon Event ID 1 logs related to "AcronisCyberProtectConnectQuickAssist*.exe" or "AcronisCyberProtectConnectAgent.exe". Look for timestamps and user accounts associated with the execution for abnormal activity.

  - **Review Parent Process Relationships:** Examine the parent process of identified Acronis processes to see if they were spawned by unusual or malicious parent processes. Malicious indicators could include execution from unknown scripts or processes with common exploit patterns.

  - **Determine the Asset Role:** Validate the role of the host system where the processes were executed. Acronis tools might be legitimate on workstations used for IT tasks but may be suspicious on non-IT system types.

  - **Analyze User Behavior:** Investigate the user accounts initiating these processes. Legitimate usage should involve administrative accounts or service accounts explicitly tasked with remote management. Accounts with anomalous behavior warrant further scrutiny.

  - **Monitor for Exfiltration Indicators:** Look for file creation events (Sysmon Event ID 11) associated with Acronis tools. Check for network connections established during process activity (Event ID 5156) leading to unusual external IP addresses to assess potential data exfiltration.

  ### Prioritization

  This alert is medium severity due to the potential for unauthorized system access via a legitimate tool. While the likelihood of malicious abuse exists, especially in environments where remote monitoring tools may be misused, much depends on the context of the asset where this behavior is observed.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive process monitoring or if log configurations are not tuned for alerting on process creation across all endpoints. The presence of nonexistent legitimate activity may trigger this alert, such as regular use by IT admins. Related detections to enhance coverage could include monitoring for unusual file access or network connections typically associated with remote access tools.

