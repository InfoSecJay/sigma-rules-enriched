note: |
  ### Technical Context

  This rule detects the execution of processes associated with the RdClient remote management tool, including "rdclient.exe," "RdClientInstaller.exe," and "SupportTool.exe." The likely objective of an attacker leveraging this tool would be unauthorized remote access or control over systems, potentially to exfiltrate data, manipulate configurations, or deploy additional malicious payloads. The relevant MITRE ATT&CK tactics here include "Execution" (TA0002) and "Remote Services" (T1219).

  The primary telemetry sources are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details including image names and parent-child relationships. If identified as malicious, this behavior can lead to serious security breaches, including unauthorized system access and potential data loss. However, this detection does NOT confirm malicious intent by itself; legitimate usage of the RdClient tool could be a benign reason for the alert.

  ### Investigation Steps

  - **Check parent-child process relationships:** Investigate Security Event ID 4688 for the detected processes where the parent process is "rdclient.exe," "RdClientInstaller.exe," or "SupportTool.exe." Focus on unusual parent processes that could indicate misuse.

  - **Identify execution context:** Review the command line arguments in Sysmon Event ID 1 to determine how the processes were initiated. Commands with unexpected flags or configurations may hint at malicious activity.

  - **Look for installation artifacts:** Check for the presence of installation artifacts such as "C:\Program Files\RdClient\" or similar directories. If found, verify the timestamp and file checksums against known good configurations.

  - **Review recent user logins:** Analyze the Windows Security logs (Event ID 4624) surrounding the time of the process execution. Benign usage will typically align with authorized user logins; anomalous user accounts or logins from atypical locations warrant further investigation.

  - **Assess impact on critical assets:** If detected on critical infrastructure or sensitive systems, prioritize response as attackers may leverage RdClient for deeper network access compared to non-critical systems.

  - **Monitor for follow-on activity:** After identifying process execution, ensure there are no additional related events, such as new user accounts (Event ID 4720) or unexpected outbound connections, that might indicate an ongoing breach.

  ### Prioritization

  The alert is of medium severity due to the potential impact on sensitive systems if the RdClient tool is misused. The likelihood of malicious abuse is significant, as remote management tools are common vectors for unauthorized access. While not commonly weaponized on their own, their presence may indicate preparatory steps for subsequent attacks.

  ### Blind Spots and Assumptions

  This detection could miss scenarios where attackers modify the executable name to avoid detection. Reliable detection requires appropriate logging configurations for Sysmon and Security events; without these, visibility into process creation may be limited. Additionally, legitimate use of RdClient could trigger this alert, notably in IT support scenarios. A related detection to strengthen coverage could include monitoring for unauthorized remote access attempts (e.g., RDP or VPN connections).

