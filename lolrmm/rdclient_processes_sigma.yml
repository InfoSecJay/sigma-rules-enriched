note: |
  ### Technical Context

  This Sigma rule detects the execution of Remote Desktop Client (RdClient) related processes, specifically identifying instances where malicious actors could manipulate Remote Management Tools (RMM) for unauthorized access to systems. The likely attacker objective is to establish a remote connection for exploitation, reconnaissance, or lateral movement within the network. This behavior corresponds to the MITRE ATT&CK technique: "Remote Desktop Protocol" (T1219), which is categorized under the "Command and Control" tactic. The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing details about process execution. If malicious, this activity could facilitate unauthorized access to sensitive data and system control. On its own, this detection does not confirm that an attacker is present; it merely indicates that RMM tools that could be misused were executed.

  ### Investigation Steps

  - **Verify process creation logs: **Review Security Event ID 4688 for the execution of processes that match the following: `rdclient.exe`, `RdClientInstaller.exe`, or `SupportTool.exe`. Look for CLI arguments that suggest atypical usage patterns, such as connection strings or unusual ports.

  - **Evaluate parent-child relationships: **Examine Sysmon Event ID 1 for the parent process of detected RMM tool executions. Legitimate instances usually have processes initiated by known system tools, while suspicious instances may have an unexpected parent process, indicating potential abuse.

  - **Correlate network activity: **Review firewall logs for unusual outbound connections from the system hosting the RMM tool. Look for connections to command-and-control IPs or suspicious external domains, which may suggest malicious intent.

  - **Identify asset criticality: **Confirm the role of the affected asset. If it is a critical server or contains sensitive information, escalate the investigation to identify potential data exfiltration or further compromise.

  - **Differentiate benign usage: **Assess if the detected RMM processes align with known operational activities, such as scheduled maintenance by IT personnel. Document user accounts and time stamps to establish normal operational behavior.

  - **Monitor for follow-up actions: **Look for additional process creation events or any file changes (specifically regarding configuration files) related to the RMM tool. These could indicate attempts to establish persistence or control beyond the initial access point.

  ### Prioritization

  This alert is of medium severity, as the execution of RMM tools can indicate potential compromise. The likelihood of malicious abuse is increased, especially in environments where such tools are commonly employed. This behavior is known to be weaponized by threat actors seeking unauthorized access to systems.

  ### Blind Spots and Assumptions

  Detection is limited since legitimate use of RMM tools can generate similar alerts. Variability in logging configuration (e.g., Sysmon installation) is also a risk for reliable detection. Legitimate IT administrator activities may also trigger this alert when deploying RMM tools for support. A related detection is monitoring for unusual successful logins following RMM tool execution which can strengthen threat detection capabilities.

