note: |
  ### Technical Context

  This rule detects network connections initiated by the AnyDesk Remote Management Tool (RMT), specifically targeting AnyDesk's service endpoints. The likely attacker objective is to gain remote access to a system without the user’s knowledge, facilitating unauthorized administrative actions, data exfiltration, or lateral movement within the environment. The relevant MITRE ATT&CK tactics include Credential Access (TA-0006) and Execution (TA-0002), with the specific technique being Remote Services (T1219). Primary telemetry sources needed for this detection include Windows network connection logs, specifically examining connections with destination hostnames related to AnyDesk. The security impact of malicious use can range from data theft to full system compromise. Importantly, this detection alone does not confirm malicious intent, as AnyDesk may be used for legitimate remote support.

  ### Investigation Steps

  - **Check network connection logs**: Review Windows network connection logs (Event ID 5156) for any outgoing connections to destination hostnames such as `boot.net.anydesk.com` or patterns matching `relay-[a-f0-9]{8}.net.anydesk.com:443`. Match against known user roles to identify potential misuse.

  - **Identify process ownership**: Investigate the process associated with the network connection using Sysmon Event ID 3. Determine if the initiating process is a known application or a suspicious executable; unexpected processes should be flagged for further investigation.

  - **Review user activity**: Examine user account activity (Event ID 4624) around the time of the AnyDesk connection. Look for any recent logins or elevated privileges granted that could suggest unauthorized access attempts.

  - **Check for legitimate AnyDesk usage**: Validate if users or IT support staff have documented business use for AnyDesk. Review existing tickets or communication records that confirm legitimate use cases.

  - **Correlate with file transfers**: Investigate for potential file exfiltration related events, such as unusual outbound connections (Event ID 5156) combined with file creation events that might indicate data transfer via AnyDesk sessions.

  ### Prioritization

  This alert has a medium severity because while AnyDesk is commonly used for legitimate support purposes, unauthorized usage poses a potential risk to sensitive data and system integrity. The likelihood of malicious abuse is moderate, particularly if the organization's policy restricts or prohibits the use of remote management tools.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if AnyDesk is misconfigured, or if other legitimate remote access tools are used, which may not trigger the alert. Reliable detection requires accurate configuration of Windows firewall logs and monitoring of outbound traffic. Legitimate employee remote work activities could erroneously trigger this alert. Companion detection rules, such as monitoring for suspicious process creations (Sysmon Event ID 1), can strengthen the coverage and context for this alert.

