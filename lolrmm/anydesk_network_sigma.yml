note: |
  ### Technical Context

  This rule detects network activity associated with the AnyDesk remote management tool, specifically connections to AnyDesk-related domains such as `boot.net.anydesk.com` and `*.anydesk.com`. An attacker may use AnyDesk to establish remote access and control over compromised systems, often to exfiltrate data, deploy malware, or conduct further attacks. The related MITRE ATT&CK technique is Remote Access Tools (T1219).

  The primary telemetry sources include Windows network connection logs, particularly looking for Event ID 5156 from the Windows Security log, which indicates an allowed connection and can confirm outbound access to specific AnyDesk domains. If detected, the security impact could be significant, as unauthorized use may allow adversaries to interact with the affected system undetected. Importantly, this detection does NOT confirm malicious intent by itself, as AnyDesk is also used legitimately for remote support and access.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 for outbound connections to AnyDesk domains. Look for any unexpected patterns, such as high frequency or unusual timeframes that do not align with typical business operations.

  - **Evaluate user context:** Identify the user account associated with the AnyDesk connection. Verify if the user has a legitimate reason to use AnyDesk and if this aligns with their job role, focusing on asset criticality (e.g., sensitive systems).

  - **Review system processes:** Use Sysmon Event ID 3 to check for process creation events linked to AnyDesk executables (e.g., `AnyDesk.exe`). Investigate the parent process to understand how AnyDesk was initiated, particularly looking for execution from non-standard locations.

  - **Identify legitimate use cases:** Determine if AnyDesk is registered in the enterprise software inventory. If legitimate remote support is documented, note the context of the activity to differentiate between benign and suspicious behavior.

  - **Analyze traffic patterns:** Inspect firewall logs for session duration and data volume related to AnyDesk connections. High data transfer rates or extended connection durations during odd hours may indicate unauthorized use.

  ### Prioritization

  The alert is classified as medium severity due to its potential to impact sensitive systems and the likelihood of adversaries leveraging AnyDesk for unauthorized access. While some legitimate use exists, its common usage by threat actors, especially in post-exploitation scenarios, raises the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection can be bypassed if adversaries use techniques to obfuscate traffic or connect from atypical domains. Reliable detection necessitates complete logging of outbound connections at the firewall level, ensuring comprehensive coverage. Legitimate activities such as scheduled remote support sessions may trigger this alert. Companion detections focusing on unusual login patterns or suspicious software installations can strengthen overall threat intelligence.

