note: |
  ### Technical Context

  This Sigma rule detects potential network activities originating from the AnyDesk Remote Management and Monitoring (RMM) tool by looking for connections to specific AnyDesk-related hostnames. Attackers may utilize AnyDesk to establish remote access to compromised systems, facilitating data exfiltration, lateral movement, or deployment of additional payloads. This behavior fits within the MITRE ATT&CK framework under the tactic of Command and Control (T1071.001) and the technique of Application Layer Protocol (T1219). The primary telemetry sources for detection are Windows network connection logs, focusing on the 'DestinationHostname' field. A malicious impact could include unauthorized access to sensitive data and control over system functions. Notably, this detection does NOT confirm malicious activity on its own, as AnyDesk may be used for legitimate access.

  ### Investigation Steps

  - **Examine Network Connection Logs:** Review Windows event logs for network connection events (Event ID 5156) involving 'boot.net.anydesk.com', 'relay-*.net.anydesk.com', or '*.net.anydesk.com'. Cross-check with known legitimate AnyDesk usage in your environment.

  - **Analyze Process Creation Events:** Check for related process creation events (Security Event ID 4688) around the same timestamp. Look for AnyDesk executable paths (e.g., AnyDesk.exe) to confirm the tool's execution. Legitimate usage might show authorized user processes starting AnyDesk.

  - **Validate Authorized Users:** Lookup the involved user accounts in Active Directory. Assess if the users have a history of legitimate AnyDesk use in their access patterns, especially on critical systems.

  - **Identify Uncommon Port Usage:** Investigate the ports used for connections to AnyDesk, as unusual port activity (other than standard RDP ports) may indicate unauthorized access attempts. Focus on destinations that deviate from normal network behavior.

  - **Correlate with Previous Incidents:** Review existing incident history for any prior alerts related to AnyDesk usage. Document any prior investigations that may indicate legitimate business needs for the application in your environment.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on sensitive systems if exploited for unauthorized access. The risk factor is significant, as AnyDesk is commonly weaponized for remote access in compromises. Its usage may indicate a range of adversary intentions from casual curiosity to targeted attacks.

  ### Blind Spots and Assumptions

  The detection has limitations, as legitimate AnyDesk usage can trigger alerts and may be misclassified as malicious. Ensure that logs for outbound network connections from all endpoints are enabled for reliable detection. Be aware that employees may legitimately use AnyDesk for remote support tasks. A companion detection to consider is monitoring for changes in remote access permissions or installation of remote management software (e.g., TeamViewer, LogMeIn) to strengthen coverage.

