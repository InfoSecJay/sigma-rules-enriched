note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the Supremo Remote Management Tool, specifically those ending in `*.supremocontrol.com`. The likely attacker objective is to establish remote command and control (C2) over compromised systems, enabling them to execute arbitrary commands or orchestrate malicious activities from afar. Relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Application Layer Protocol (T1219). The primary telemetry source for this detection is network connection logs, specifically looking at DNS queries or proxy logs indicating successful connections to suspicious domains. If malicious, this activity could facilitate unauthorized access and lateral movement within the network. However, this rule does NOT confirm that a compromise has occurred; legitimate use of Supremo for remote support or administration may also trigger it.

  ### Investigation Steps

  - **Check connection logs for Supremo traffic:** Review Windows Event logs for Network Connection events (Event ID 5156) indicating outbound connections to domains ending in `*.supremocontrol.com`. Note the time, source IP, and user account initiating the connection.

  - **Investigate user behavior:** Assess the user account involved in the connection. Look for prior legitimate activities from that user, such as remote support sessions or known maintenance tasks documented in ticketing systems.

  - **Correlate with threat intelligence:** Utilize threat intelligence platforms to verify if the domain is flagged as malicious. Look for analysis on `supremocontrol.com` and its subdomains from sources such as VirusTotal or commercial threat intelligence feeds.

  - **Examine endpoint logs for legitimate use:** Review recent administrative actions that justify the use of Supremo. Identify if any known administrative personnel accessed Supremo in accordance with company policy through system access logs.

  - **Identify high-confidence malicious indicators:** Analyze endpoint logs for any suspicious processes using Sysmon Event ID 1 (Process Creation). Look for unusual command line parameters or unusual parent processes associated with the Supremo client.

  - **Check for process signatures:** Validate if any processes matching the naming conventions of unofficial Supremo installations (e.g., processes not from official repositories) are actively running on the system using Security Event ID 4688.

  ### Prioritization

  This alert has a medium severity level due to its indication of potential command and control activities. The nature of the affected systems and their risk levels can elevate concerns, especially if they contain sensitive data. While the use of remote access tools is common in administrative work, mass deployment or abnormal patterns of this traffic could signify malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited if firewalls block certain outbound connections, masking C2 traffic. Additionally, legitimate remote support activities could trigger this alert, leading to potential false positives. The rule's efficacy relies on comprehensive logging of outbound connections, which must be configured properly across the network. A related detection to consider is the identification of unauthorized software installation (e.g., using MSI logs) that could reveal the presence of Supremo installations outside business justification.

