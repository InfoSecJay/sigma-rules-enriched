note: |
  ### Technical Context

  This rule detects network activity associated with the Supremo Remote Management Tool (RMM) by monitoring connections to domains associated with Supremo's infrastructure. The likely attacker objective is to establish a command and control (C2) channel, enabling remote access to compromised systems. This behavior falls under the MITRE ATT&CK tactic of Command and Control (T1071.001) as it uses standard application Layer protocols for communication. Primary telemetry sources include Windows network connection logs, specifically capturing DNS and outbound traffic information. If malicious, this activity could indicate unauthorized access to sensitive data and system manipulation. However, this detection alone does NOT confirm malicious intent, as legitimate use of the Supremo tool is also possible.

  ### Investigation Steps

  - **Check recent network connections:** Review Windows Event ID 5156 (Windows Filtering Platform - Allowed Connection) logs for any connections to `*.supremocontrol.com`. Validate the source IP and port; connections initiated by unexpected users or systems may indicate malicious intent.

  - **Review DNS query logs:** Examine forwarding or internal DNS logs for queries to `*.supremocontrol.com`. Identify if users with administrative roles are querying these domains without justification, which could be suspicious.

  - **Identify legitimate Supremo activity:** Confirm if the organization has sanctioned use of the Supremo tool. Validate against asset inventory; if used, review the context and activities associated with these systems.

  - **Investigate process execution:** When identifying connections to Supremo domains, correlate with Windows Event ID 4688 (Process Creation) logs. Check for unusual parent processes, which could indicate a malware infection that is using the tool.

  - **Confirm absence of known benign usage:** Verify known application whitelists and system roles to understand if the tool is present on the system. If it is not on approved inventory, escalate for further analysis.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive data and systems if malicious. The likelihood of abusive use is significant, as remote management tools are frequently exploited by threat actors. The behavior is commonly weaponized in targeted attacks, making it essential for prompt review.

  ### Blind Spots and Assumptions

  Detection may be limited if outbound traffic is encrypted or if DNS logs are unavailable, leading to missed connections. Legitimate system administration activity using Supremo may also trigger this alert, so context is crucial for analysis. A related detection that could enhance coverage is monitoring for known C2 domain connections across different protocols, strengthening the identification of remote access threats.

