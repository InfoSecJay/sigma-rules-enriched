note: |
  ### Technical Context

  This Sigma rule detects network connections to known domains associated with the Supremo Remote Management Tool (RMM). The primary behavior being identified involves the establishment of outbound network connections to `supremocontrol.com` and its subdomains, indicating possible unauthorized remote access. The likely attacker objective is to gain and maintain command and control over compromised hosts, facilitating further exploitation or data exfiltration.

  This detection fits under the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Remote Services (T1219). The primary telemetry source is Windows network connection logs, specifically examining connection attempts to the aforementioned domains. If malicious, this activity indicates an adversary is using remote access tools to potentially compromise system integrity or exfiltrate sensitive data. However, this detection does NOT confirm malicious activity on its own, as legitimate use of Supremo for remote support may occur.

  ### Investigation Steps

  - **Verify network connections:** Check Windows Security Event ID 5156 to confirm if the outbound connection was logged, noting the destination IP and hostname. Look for unusual connections during off-hours that deviate from typical traffic patterns.

  - **Identify legitimate Supremo use:** Analyze past connections specifically associated with verified remote support scenarios. Review user accounts tied to support roles and note whether they frequently connect to `supremocontrol.com`.

  - **Examine process execution history:** Cross-reference with Sysmon Event ID 1 to determine if there was a recent process creation (like Supremo) that initiated the connection. Look for instances of `supremo.exe` or similar executable names running on the host.

  - **Assess host criticality:** Identify the role of the affected system (e.g., domain controller, endpoint) and prioritize investigation based on enterprise asset criticality. High-value targets should receive immediate attention, especially if remote access tools typically are not sanctioned within the environment.

  - **Monitor for anomalous behavior:** Investigate any subsequent activity following the connections, such as abnormal file creation or modification events (Sysmon Event ID 11). Look for suspicious file downloads or executions occurring shortly thereafter.

  ### Prioritization

  This alert should be regarded as medium severity in an enterprise context. The impact of a remote access tool on critical systems can be significant, especially if abused for lateral movement. While the use of RMM tools can be legitimate, the frequency of their weaponization by adversaries necessitates careful attention to this alert.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations, such as disabled connection log monitoring on endpoints. Legitimate support activities may also trigger the alert, particularly during known maintenance windows. Additional coverage can be provided by correlating this alert with detection of unusual administrative PowerShell commands (e.g., technique T1086) or abnormal authenticated sessions to help validate context around reported activities.

