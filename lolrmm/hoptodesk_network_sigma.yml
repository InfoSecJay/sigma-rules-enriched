note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the HopToDesk remote management and monitoring (RMM) tool. The likely attacker objective is to establish a command and control (C2) channel or utilize remote desktop capabilities for malicious actions, such as exfiltrating data or further compromising a system. This behavior maps to the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources include Windows network connection logs, specifically monitoring DNS queries and associated connection attempts. If malicious, the use of HopToDesk can lead to unauthorized access and control of systems, potentially allowing adversaries to execute further attacks. This detection does NOT confirm that an attack is occurring, as legitimate use of HopToDesk may trigger this rule.

  ### Investigation Steps

  - **Verify the connection details: **Review Windows Event ID 5156 (Windows Filtering Platform Network Connection) or Sysmon Event ID 3 (Network Connection) for connections to `*.hoptodesk.com` domains. Ensure that the process initiating the connection is not a known legitimate application.

  - **Identify processes connecting to HopToDesk: **Check for any unusual parent processes or users associated with the connection attempts. Anomalous processes with elevated privileges initiating connections to these domains could indicate malicious activity.

  - **Determine legitimate usage: **Cross-reference any detected activity with your organizational software inventory. If systems with legitimate HopToDesk installations exist, make note of asset criticality and expected usage patterns.

  - **Monitor for additional indicators: **Examine for any remote desktop or RMM-related activity in conjunction with the network connections, including Windows Event ID 4648 (Logon attempt using explicit credentials) which might indicate further malicious activity following the initial connection.

  - **Check for file transfer activities: **Look for file creation or modification events in conjunction with network connections to HopToDesk. Use Sysmon Event ID 11 to identify potential executables being transferred that may indicate a secondary stage of compromise.

  ### Prioritization

  The alert has medium severity due to the potential impact on systems utilizing remote management tools. While the likelihood of malicious abuse exists, legitimate use of HopToDesk may generate similar alerts. This behavior, given its association with remote access tools, is commonly weaponized by adversaries for unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited if outbound connections to HopToDesk are allowed in configured firewall rules. Evasion techniques may include using encrypted traffic or proxy services to conceal the activity. Legitimate business activities—such as IT support using HopToDesk for remote assistance—could trigger this alert. A companion detection worth monitoring is remote connections to known C2 infrastructure, enhancing detection and response efforts.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
