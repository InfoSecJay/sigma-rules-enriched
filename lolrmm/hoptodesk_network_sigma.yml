note: |
  ### Technical Context

  This rule detects network connections to HopToDesk domains, indicating potential use of the HopToDesk Remote Management Tool. Attackers may resort to this tool to establish remote access for various objectives, including data exfiltration, lateral movement, or system compromise. This detection aligns with the MITRE ATT&CK technique "Remote Desktop Protocol" (T1219).

  Primary telemetry sources include Windows network connection logs capturing outbound connections to specified domains. If malicious, the security impact includes unauthorized system access and potential compromise of sensitive data. However, this detection alone does not confirm malicious activity, as legitimate use of HopToDesk exists within certain organizational contexts.

  ### Investigation Steps

  - **Validate outbound connections:** Review Windows Security Event ID 5156 (Windows Filtering Platform) for logs of outbound connections to HopToDesk domains, ensuring only expected IP address ranges are used for legitimate business operations.

  - **Correlate with user activity:** Examine related Windows Security Event ID 4624 logs to associate the connection with legitimate user accounts. Confirm users who initiated HopToDesk connections have a valid business need for remote management tools.

  - **Review application and service status:** Check installed applications for HopToDesk using Sysinternals’ Process Explorer. Confirm legitimate usage patterns; for example, admin users accessing the tool during business hours.

  - **Identify unique indicators:** Look for unusual patterns in access times or user behaviors that deviate from normal operational hours. Suspicious activity may manifest as multiple connection attempts from unusual locations.

  - **Capture additional context:** Utilize network monitoring tools to assess the volume and type of data transiting to/from the HopToDesk domains. Significant data exfiltration signs or anomalous traffic patterns could indicate malicious use.

  ### Prioritization

  This alert carries medium severity due to the potential impact on critical systems by allowing unauthorized remote access. While legitimate operations may use HopToDesk, the likelihood of adversarial abuse is notable, as remote access tools have a history of weaponization in cyber-attacks.

  ### Blind Spots and Assumptions

  This detection may be bypassed by adversaries using tunneling techniques or custom domains to mask remote access activity. Complete visibility requires proper logging configurations around Windows Filtering Platform and network connections. Legitimate use cases, such as IT support or remote administrative access, may trigger this alert. A companion detection focusing on user account anomalies (e.g., unusual logins or account misuse) can enhance coverage and context for investigations.

