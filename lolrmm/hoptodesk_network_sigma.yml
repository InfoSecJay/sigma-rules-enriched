note: |
  ### Technical Context
  This detection rule identifies potential network activity related to the HopToDesk Remote Monitoring and Management (RMM) tool. The HopToDesk application is designed for remote access, support, and troubleshooting, but its legitimate functionalities make it a target for misuse by malicious actors seeking to gain unauthorized access to systems. Attackers may leverage HopToDesk to maintain persistence, execute commands, or exfiltrate sensitive data by masking their activities as legitimate remote support sessions.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) since the tool enables remote code execution on devices, and it maps to the technique **Remote Service Session Hijacking** (T1219), where attackers exploit legitimate platforms to access systems remotely. The best sources of telemetry for detecting this activity are network connection logs, which can reveal unusual outbound connections to the specified HopToDesk domains.

  ### Investigation Steps
  - **Review Network Connection Logs**: Investigate any network connection logs for outbound connections to the hostname patterns associated with HopToDesk: `signal.hoptodesk.com`, `api.hoptodesk.com`, or `turn.hoptodesk.com`.
  - **Analyze Process Creation Events**: Check for any unusual process executions that coincide with connections to the identified HopToDesk domains, which may indicate exploitation of the tool for unauthorized actions.
  - **Correlate User Activity Logs**: Look into authentication logs and user activity to identify any uncharacteristic behavior associated with the timestamps of detected network activity, possibly indicating compromised accounts.
  - **Assess Installed Applications**: Verify the presence of the HopToDesk application on endpoints and correlate it with user roles. Legitimate administrative use should be expected, but any unauthorized installations should be flagged.

  ### Prioritization
  This alert is given a medium severity due to the potential of HopToDesk being utilized for remote unauthorized access, which poses a significant risk to sensitive data and system integrity. The likelihood of encountering this tool in an enterprise environment, particularly in support scenarios, makes timely investigation essential.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of HopToDesk usage, especially if the domains are modified or if the tool is run in a non-standard manner. It assumes that the application will attempt to connect to known HopToDesk domains and relies on comprehensive logging for outbound network connections. For effective detection, ensure that your network devices and firewalls are configured to capture full connection logs and that any domain isolation measures are in place to monitor for unauthorized access attempts.

