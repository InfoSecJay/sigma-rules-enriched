  ### Technical Context

  This Sigma rule detects network connections to the HopToDesk Remote Monitoring and Management (RMM) tool, indicated by specific destination hostnames associated with the service. Attackers may use such tools for remote control, gaining access to and managing compromised systems without physical presence, typically to exfiltrate data or deploy further payloads. The relevant MITRE ATT&CK tactic is **Execution**, with the technique being **Remote Access Tools (T1219)**.

  The primary telemetry source is Windows network connection logs, which capture outbound communications. If malicious, successful connections to HopToDesk could enable unauthorized access and control over endpoints. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as the tool may also be used legitimately within an organization's authorized operations.

  ---

  ### Investigation Steps

  - **Identify outbound connections:** Review Windows Security Event ID 5156 (Windows Filtering Platform) for connections to `signal.hoptodesk.com`, `api.hoptodesk.com`, or `turn.hoptodesk.com` to confirm alert validity.

  - **Validate legitimate usage:** Check organizational policies or software inventories to see if HopToDesk is a sanctioned tool. Confirm with asset owners if recent usage aligns with scheduled remote support sessions.

  - **Correlate user context:** Determine the user associated with the alerting network connection. Event ID 4624 can provide the logon type and source, helping distinguish between potentially compromised accounts and legitimate administrative activities.

  - **Examine connection patterns:** Review connection frequency and duration. Malicious use may show repeated or anomalous connections encompassing unusual hours or patterns inconsistent with expected usage.

  - **Check for additional artifacts:** Look for process activity associated with the tool using Sysmon Event ID 1 (process creation) to identify if the HopToDesk executable was spawned, indicating further intrusion attempts.

  - **Assess system criticality:** Prioritize review based on the system’s role; connections to servers or sensitive assets warrant immediate attention, whereas connections from less critical endpoints may be lower priority unless linked to suspicious behavior.

  ---

  ### Prioritization

  This alert has a medium severity level. The impact can be significant if critical systems are compromised using HopToDesk, as it is commonly weaponized by adversaries for gaining persistent access. The likelihood of malicious abuse is moderate, given the dual-use nature of such tools, necessitating close scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if HopToDesk is obscured through tunneling or encrypted connections, which could evade standard monitoring. Ensure logging is enabled for Windows Filtering Platform to capture relevant network activity consistently. Legitimate internal support activities can trigger this alert, adding complexity to investigations. A companion detection could involve monitoring for known malicious IPs or domains related to remote access tools, enhancing coverage and context in identifying suspicious activity.

