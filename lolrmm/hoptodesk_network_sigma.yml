note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the HopToDesk remote management tool, which could indicate unauthorized access attempts or malicious usage in a corporate environment. Attackers may utilize HopToDesk to maintain control over compromised systems, facilitating activities such as data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique T1219 (Remote Access Software), which highlights the potential exploitation of remote access tools for nefarious objectives.

  The primary telemetry sources include Windows network connection logs, focusing on DNS queries or outbound connection attempts to domains associated with HopToDesk (e.g., hoptodesk.com). If this behavior is malicious, it may lead to unauthorized system access, data breaches, or further network compromise. However, detection of this network activity alone does NOT confirm that a system has been fully compromised or that malicious actions are currently occurring.

  ### Investigation Steps

  - **Review network connections**: Check Windows Firewall logs (Event ID 5156) for any permitted outbound connections made to HopToDesk domains (e.g., 'hoptodesk.com'). Connections to these domains may indicate potential misuse or authorized usage depending on context.
  - **Examine process execution**: Verify if there are any unexpected processes on affected hosts that correspond with HopToDesk activities. Use Sysmon logs (Event ID 1) to identify executable files running that interact with the domain. Legitimate usage typically involves known software or administrative tools.
  - **Query DNS logs for suspicious name resolution**: Inspect DNS logs (such as Windows event ID  DNS Client Events, Event ID 500 and 510) for domain resolution requests to HopToDesk-related domains. A high volume of requests may indicate reconnaissance or misuse patterns.
  - **Check for user account activity**: Review user access and authentication logs (Event ID 4624) for any unusual logins or use of accounts tied to administrative activities around the time of the detection. Legitimate remote access should correlate with scheduled maintenance or administrative duties.
  - **Identify related network traffic**: Utilize network traffic logs (e.g., NetFlow data or packet captures) to trace any unusual outbound or lateral movement to and from the affected host. Exceptional behavior could be characterized by multiple and repetitive calls to HopToDesk domains.
  - **Investigate asset roles and response actions**: Note if the impacted system is critical (e.g., domain controllers, HR databases). If it is, escalate the finding to Tier 3 for immediate containment and further forensic analysis.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on sensitive systems if an adversary successfully establishes a foothold through unauthorized use of a remote access tool. The likelihood of abuse is moderate as legitimate usage exists, but the tool is commonly weaponized by attackers to gain remote control over systems.

  ### Blind Spots and Assumptions

  Detection may be limited if outbound traffic is encrypted or if network perimeter defenses are not logging adequately. Evasion techniques may include the use of VPN services or legitimate infrastructure bypassing typical detection methods. Legitimate activities may occur if IT administrators use HopToDesk for remote support tasks. A related detection to enhance monitoring could involve identifying anomalous remote connection patterns from unusual geographic locations or unexplained spikes in connection attempts to other RMM tools.

