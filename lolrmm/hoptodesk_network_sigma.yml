note: |
  ### Technical Context

  This rule detects network connections to HopToDesk Remote Management and Monitoring (RMM) tool servers, specifically targeting domains associated with its operation. The likely objective of an attacker using HopToDesk is to establish remote access to compromised systems, enabling them to control endpoints, exfiltrate data, or deploy additional malware. This behavior is relevant to the MITRE ATT&CK technique `T1219: Remote Access Software` under the tactic of `Execution`.

  The primary telemetry sources include Windows Network Connection logs, where the destination hostname is queried. If this detection proves malicious, it indicates potential unauthorized remote access. However, this rule does NOT confirm that the activity is malicious by itself, as legitimate users may use HopToDesk for remote support.

  ### Investigation Steps

  - **Check destination hostnames:** Review network logs for connections to `signal.hoptodesk.com`, `api.hoptodesk.com`, or `turn.hoptodesk.com` (Event ID 5156 for Windows filtering platform) to confirm the activity aligns with the alert.

  - **Identify user context:** Examine the user account associated with the network connection. Legitimate activity should show familiar user accounts engaged in authorized remote IT support activities.

  - **Analyze process creation logs:** Investigate Event ID 4688 logs to determine which process initiated the connection. Look for unusual process names or instances where remote management tools are launched outside of expected contexts.

  - **Correlate with active sessions:** Check if the potentially malicious connection correlates with any active remote desktop sessions (Event ID 4624 for logon events) or administrative tool usage indicative of authorized support.

  - **Look for lateral movement indicators:** Review for any unusual outbound connections from systems that are not typically used for remote management, which may indicate an attacker using HopToDesk for lateral movement in the network.

  - **Review related activity:** Check for other remote-access tools or anomalous applications running in conjunction with HopToDesk. Use Sysmon Event ID 1 to analyze their behavior and lineage for any suspicious parent-child process relationships.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems, particularly if an adversary is utilizing RMM tools to gain unauthorized access. The likelihood of malicious abuse is moderate, as RMM tools are commonly weaponized for post-exploitation activities.

  ### Blind Spots and Assumptions

  Potential evasion includes attackers using legitimate credentials or obfuscating their activity to bypass detection. The effectiveness of this alert relies on accurate logging of outbound connections, and missing logs could result in a failure to detect active exploitation. Legitimate use of HopToDesk for IT support can trigger this alert. A related detection that strengthens coverage would focus on identifying other remote access tools leveraged in conjunction with suspicious remote connections.

