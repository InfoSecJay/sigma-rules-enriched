note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Guacamole Remote Monitoring and Management (RMM) tool, specifically those spawned under the parental process `guacd.exe`. An attacker may leverage Guacamole for remote access, potentially aiming to maintain persistence or facilitate lateral movement within the network.

  The relevant MITRE ATT&CK tactic is Command and Control (TA0011) and the technique is Remote Access Tools (T1219). Primary telemetry sources include Windows process creation logs, specifically Windows Security Event ID 4688 or Sysmon Event ID 1, capturing process creation events. If malicious, this activity could indicate unauthorized remote access to manage compromised systems.

  Importantly, this detection does not conclusively prove malicious intent, as legitimate use of the Guacamole tool can occur within an organization.

  ### Investigation Steps

  - **Check process execution history**: Review Windows Security Event ID 4688 or Sysmon Event ID 1 for the command line used in the creation of `guacd.exe` processes. Look for parameters and any associated scripts or unexpected commands indicative of unauthorized access.

  - **Identify parent process**: Investigate the parent process of the detected `guacd.exe` instance using Event ID 4688. This may indicate whether the process was launched from a legitimate application or as part of a suspicious chain of events.

  - **Review network connections**: Correlate with network logs to identify connections initiated by the `guacd.exe` process. Look for unusual outbound connections to external IP addresses that are not part of known management or audit processes, which may indicate malicious command and control activity.

  - **Assess user context**: Validate the user account context under which the `guacd.exe` processes are executed. Legitimate users accessing RMM tools typically have associated roles; anomalous user behavior may signify compromise.

  - **Evaluate asset role**: Determine the criticality of the host system running `guacd.exe`. If the process is running on a sensitive or critical asset (e.g., domain controller, financial systems), escalate the investigation due to higher risk potential.

  - **Document legitimate instances**: Ensure the existence of legitimate Guacamole usage within the environment. Gather documentation for known use cases and the individuals involved to differentiate benign actions from potential malicious activity.

  ### Prioritization

  This alert is of medium severity due to the potential for unauthorized remote access. Such behavior is commonly weaponized by adversaries to facilitate lateral movement and persistence post-exploitation. The risk escalates if the detected activity occurs on high-value targets within the organization.

  ### Blind Spots and Assumptions

  Detection is limited by the presence of legitimate use cases for Guacamole, which may result in false positives. Additionally, if process creation logging is not properly configured on endpoints, legitimate activity may go undetected. An associated detection could include monitoring for network connections from remote access tools (e.g., RPC or RDP) to enhance visibility into command-and-control activities.

