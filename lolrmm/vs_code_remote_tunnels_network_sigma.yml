note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to `global.rel.tunnels.api.visualstudio.com`, which is associated with the VS Code Remote Tunnels tool. Attackers may use this tool to establish remote access to a compromised environment, allowing them to manage and control systems covertly. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011) and the technique is **Remote Access Software** (T1219).

  The primary telemetry sources for this detection are Windows-based network connection logs. Specifically, the detection looks for event data related to remote connections, indicating potential threat actor use of VS Code Remote Tunnels for maintaining persistence or data exfiltration. This detection does NOT confirm malicious activity on its own, as legitimate users may also utilize this tool for development purposes.

  ### Investigation Steps

  - **Check network connection logs:** Review network connection events related to outbound traffic to `global.rel.tunnels.api.visualstudio.com` using Windows Security Event ID 5156 (Windows Filtering Platform) where `DestinationPort` matches 443.

  - **Identify legitimate usage:** Validate recent projects or development activities within your organization that utilize VS Code and Remote Tunnels. Confirm if any user accounts regularly connect to the detected endpoint.

  - **Inspect process activity:** Examine process creation logs (Windows Event ID 4688) for entries involving `code.exe` or other related executables that may indicate usage of the VS Code Remote Tunnels functionality.

  - **Review user account activity:** Look for anomalous login events (Windows Event ID 4624) tied to the same accounts making network connections to the VS Code endpoint, particularly focusing on login times outside of normal business hours.

  - **Establish context for detected connections:** Cross-reference the identified network log entries with endpoint security alerts or threat intelligence feeds to ascertain if the behavior aligns with known malicious activity patterns or IP reputation.

  ### Prioritization

  This alert warrants medium severity due to the potential high impact of unauthorized remote access on sensitive systems. Additionally, while the likelihood of exploitation through VS Code Remote Tunnels exists, it is less commonly weaponized than other more traditional remote access tools.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in network logging, which could result in missed connections. Legitimate development activities and standard-use scenarios with VS Code Remote Tunnels could generate false positives. Additionally, monitor for other command and control indicators such as unusual DNS requests or outbound connections to known bad IPs to enhance detection coverage and context.

