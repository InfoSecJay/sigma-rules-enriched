note: |
  ### Technical Context

  This Sigma rule detects outbound network connections towards the Visual Studio Code Remote Tunnels API, which is often associated with Remote Management and Monitoring (RMM) activities. An attacker may leverage this behavior to establish persistent access to compromised systems through VS Code, enabling remote command execution and possible lateral movements within the network. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically utilizing the technique T1219 (Remote Access Software).

  The primary telemetry sources include network connection logs from Windows, which should capture events specific to the destination hostnames related to the Visual Studio Code Remote Tunnels. If this activity is malicious, it could allow threat actors to exfiltrate sensitive information or control systems remotely. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate use cases for VS Code Remote Tunnels exist.

  ### Investigation Steps

  - **Identify active outbound connections:** Verify network connection logs for Event ID 5156 (Windows Filtering Platform) showing connections to the specified VS Code tunnel hostnames (`*.global.rel.tunnels.api.visualstudio.com`). Confirm the process owner to establish legitimacy.

  - **Review user activity:** Investigate user logon events (Security Event ID 4624) and previous activity related to VS Code to establish expected behavior. Legitimate usage patterns will show routine interactions with VS Code corresponding to the logon times.

  - **Correlate with known RMM usage:** Check for the presence of other known RMM tools on the host or within the network. Search for installed applications (via logs from Event ID 4688) that indicate the installation of RMM software. Recognized RMM tools include tools that actively utilize strong remote connectivity.

  - **Analyze network egress patterns:** Use network flow data and firewall logs to identify any unusual data exfiltration associated with outbound traffic to the specified API host. Look for abnormal volumes of data being sent (specifically large or atypical file sizes) which could indicate malicious activity.

  - **Cross-reference against threat intelligence:** Reference external threat intelligence feeds for any reporting on malicious usage of VS Code Remote Tunnels, specifically focusing on recent incidents that may relate to this hostname.

  ### Prioritization

  This alert has medium severity due to the potential exploitation of an enterprise system's remote management capabilities. While the impact of a compromised remote connection could be significant, the likelihood of such abuse might be lower if the environment has established usage policies or network controls. Nonetheless, as RMM techniques are commonly weaponized, proper triage is essential.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques where attackers may use encryption or hand-crafted packets to obfuscate their actions. Reliable detection requires validating that network traffic is being logged accurately, specifically for outbound connections. Legitimate activities such as developers using VS Code for remote access can trigger this alert, necessitating thorough review processes. A companion detection might include monitoring for unauthorized installations or executions of VS Code extensions related to remote access functionalities, bolstering overall detection capabilities.

