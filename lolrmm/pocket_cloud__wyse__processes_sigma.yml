note: |
  ### Technical Context

  This rule detects the execution of the Pocket Cloud (Wyse) Remote Management Tool, commonly used for remote administration and support. The primary attacker objective may include unauthorized access, remote administration of compromised systems, or evasion of security controls using legitimate remote management tools. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219).

  Primary telemetry sources include Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. If malicious, the security impact could involve unauthorized access to sensitive data or systems through the remote management capabilities of Pocket Cloud. Importantly, this detection alone does NOT confirm malicious activity without additional context since legitimate users may also utilize this software for valid purposes.

  ### Investigation Steps

  - **Review recent process creation events:** Check Security Event ID 4688 and Sysmon Event ID 1 for any instances where 'pocketcloud*.exe' or 'pocketcloudservice.exe' appear in the "New Process Name" field. Look for unusual command-line parameters indicating likely abuse.

  - **Analyze parent process relationships:** Identify the parent process for 'pocketcloud*.exe' executions. Legitimate processes typically are system services or known admin tasks, while suspicious parent processes may indicate misuse.

  - **Correlate with user activity:** Examine the user associated with the detected processes. If the user typically does not perform remote management tasks or lacks sufficient privileges, this may indicate malicious behavior.

  - **Investigate the system’s asset criticality:** Ensure that affected systems are not critical infrastructure or sensitive data stores, which would heighten the risk of malicious activity. Check for deviations from baseline usage of remote tools.

  - **Confirm legitimate usage patterns:** Document known instances of Pocket Cloud deployment within your environment. Compare the timeframes and users executing these processes with historical baselines of legitimate usage.

  - **Monitor for indicators of exfiltration:** Check for additional artifacts such as unusual network outbound connections or file transfers associated with the detected processes. Focus on network telemetry for any signs of data exfiltration during these sessions.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized access during remote management operations. The likelihood of malicious abuse is moderate, as many attackers exploit legitimate tools to obfuscate their activities. This behavior is recognized as a common tactic for maintaining persistence and accessing sensitive operational data.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the need for complete visibility into process execution logs. Evasion techniques may include renaming executable files or using alternate remote tools with similar functionalities. Legitimate users starting Pocket Cloud on their systems could also trigger false positives. A complementary detection would include monitoring for unusual network traffic patterns indicative of data exfiltration or command and control communications.

