  ### Technical Context

  This Sigma rule detects the execution of processes related to the Pocket Cloud (Wyse) Remote Management Tool, specifically the files `pocketcloud*.exe` and `pocketcloudservice.exe`. The likely attacker objective may involve using this legitimate remote management tool for unauthorized access or administration of environment endpoints. This behavior fits into the MITRE ATT&CK framework under the tactic “Execution” (TA0002), specifically technique “Remote Management Software” (T1219). The primary telemetry source for this detection comes from Windows process creation events, specifically via Event ID 4688 in the Security log or Sysmon Event ID 1.

  If malicious, the security impact includes unauthorized remote access to systems, potential data exfiltration, or manipulation of system configurations. However, it is important to note that this detection alone does NOT confirm malicious intent, as the processes could also be part of legitimate administrative activities.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 or Sysmon Event ID 1 for entries related to `pocketcloud*.exe` or `pocketcloudservice.exe`. Identify the user context, command line arguments, and parent process information to determine if the execution is unauthorized.

  - **Analyze parent process history**: Assess the parent process to determine legitimacy. If `pocketcloud*.exe` was launched by a non-admin user or through an unusual chain of command, it may indicate suspicious behavior.

  - **Confirm installation of Pocket Cloud**: Validate that Pocket Cloud is officially installed on the system. Refer to application installation logs in Event ID  install (Event Log) to rule out potential unauthorized installation attempts.

  - **Identify anomalous network activity**: Look for unusual outbound connections initiated by `pocketcloud*.exe`. Monitor Windows Firewall logs for unexpected IP addresses or high data transfer volumes to ascertain if exfiltration is occurring.

  - **Examine user behavior**: Analyze the user’s historical activity in user logs. Frequent legitimate access to administrative tools by non-admin accounts or during unusual hours might indicate misuse.

  - **Document legitimate activity**: Note that normal use of Pocket Cloud will typically involve legitimate administrative users accessing remote locations for scheduled maintenance and system updates, generally seen during business hours.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of the affected system, especially if the Pocket Cloud tool is deployed on critical infrastructure. The likelihood of abuse is moderate since attackers may weaponize legitimate remote management tools for malicious purposes, particularly where remote access is necessary.

  ### Blind Spots and Assumptions

  Detection may be limited if the adversary is using legitimate credentials or employing evasion techniques, such as modifying process names or using alternative remote access tools. This requires ensuring logging is enabled for process creations and validating that endpoint protection tools are properly configured to detect unauthorized use of legitimate software. Legitimate activities such as system administrative tasks may trigger this alert, so careful evaluation of the user context is essential. A related detection for improved coverage could involve monitoring for unusual registry changes associated with Pocket Cloud installations or configurations.

