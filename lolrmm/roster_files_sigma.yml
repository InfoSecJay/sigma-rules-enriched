note: |
  ### Technical Context

  This rule detects the file activity associated with the Roster RMM (Remote Monitoring and Management) tool, specifically modifications or accesses to key files such as `agent.exe`, `agent.yaml`, and `agent-state.json`. The likely attacker objective includes establishing persistence or enabling remote control over compromised systems. This behavior aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Data from Information Repositories" (T1219). The primary telemetry sources are Windows file event logs where modifications to specific files are logged.

  If this activity is malicious, it could indicate unauthorized control over endpoints, leading to potential data breaches or system integrity issues. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions or configurations could lead to similar file activity.

  ### Investigation Steps

  - **Identify targeted files: ** Review events with `TargetFilename` matching `C:\Program Files\Roster\agent.exe`, `C:\ProgramData\Roster\agent.yaml`, or `C:\ProgramData\Roster\agent-state.json` in Windows File System logs. Focus on any timestamps that coincide with the alert.

  - **Examine process creation: ** Analyze Security Event ID 4688 or Sysmon Event ID 1 associated with the `agent.exe` process being launched. Verify if it was executed by a known admin user or a suspicious account.

  - **Check file modification times: ** Investigate changes to the `agent.yaml` and `agent-state.json` files in the Windows File System logs. Compare modification times with normal operational patterns to differentiate between benign updates and potentially malicious alterations.

  - **Review user activities: ** Look into user activities in conjunction with the file access logs. Legitimate operations typically involve consistent administrator uses of Roster for maintenance tasks, as noted in historical logs.

  - **Look for lateral movement signs: ** Verify if any unusual accesses or file modifications coincide with alerts for lateral movement, such as SMB connections from unusual sources to the affected host.

  - **Cross-reference with threat intelligence: ** Correlate the alert with threat intelligence sources to confirm known indicators of compromise (IoCs) related to Roster RMM's usage by malicious actors or confirmation of its abuse in prior incidents.

  ### Prioritization

  This alert carries medium severity due to the impact on critical systems managed by Roster and the potential likelihood of adversaries using RMM tools for post-exploitation activities. While not every file access indicates exploitation, the behavior is commonly weaponized by threat actors for persistence and control.

  ### Blind Spots and Assumptions

  Detection may not capture all malicious uses of Roster RMM if the tool is whitelist-approved, potentially leading to false negatives. Required log configurations include detailed file auditing to reliably detect changes. Legitimate IT administrative actions may also trigger the alert if they coincide with RMM tool operations. A related detection would be monitoring for anomalous Network Traffic patterns to known Roster RMM endpoints, enhancing the coverage for potential command and control communications.

