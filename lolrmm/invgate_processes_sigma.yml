  ### Technical Context

  This rule detects the execution of processes associated with the InvGate Remote Monitoring and Management (RMM) tool, specifically targeting legitimate executables like InvGate-ED.exe, DepHlp.exe, InvGateAssetsRD.exe, and InvGateRD.exe. An attacker may use InvGate to control remote systems, potentially leveraging its administrative capabilities for lateral movement or data exfiltration. The relevant MITRE ATT&CK tactic is Execution (TA0002), particularly technique T1219 (Remote Access Software).

  The primary telemetry source is Windows process creation logs, notably Security Event ID 4688, which records process creations. If malicious, this could indicate unauthorized access to systems, granting the attacker the ability to manipulate or extract sensitive data. Importantly, this detection does not confirm malicious intent on its own; legitimate InvGate use within the organization may trigger this alert.

  ### Investigation Steps

  - **Verify process origin:** Check for the presence of the parent process (Event ID 4688) – legitimate InvGate processes should originate from authorized installations, typically by users with administrative privileges.

  - **Review user context:** Analyze the account that initiated the process (Event ID 4688, User field). Legitimate activity usually involves service accounts or authorized personnel, while anomalous accounts may indicate malicious use.

  - **Check process execution history:** Investigate the process execution timeline (Sysmon Event ID 1) for any unusual execution patterns or potential chain of command that precedes InvGate execution, such as suspicious parent processes.

  - **Validate machine environment:** Identify the host roles and criticality of affected endpoints through asset inventory. InvGate tools should only run on predefined management systems; detection of these processes on employee workstations may indicate a security concern.

  - **Inspect network activity:** Monitor for associated outbound network connections made by these processes (e.g., connection logs from the firewall or proxy logs). Malicious usage could generate unusual patterns or connectivity to unknown IP addresses.

  - **Capture file interactions:** Review Windows Event Log for file creation or modifications in expected directories (e.g., C:\Program Files\InvGate\) during the alert timeframe. High-confidence indicators are unexpected file artifacts suggesting abnormal RMM usage.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems where InvGate can facilitate unauthorized access. While the likelihood of abuse exists, organizations commonly use InvGate for support and maintenance, necessitating contextual analysis for each alert instance.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate InvGate use within the enterprise, leading to false positives. The alert requires monitoring of process creation logs and Sysmon configurations for reliability. Normal administrative activity may trigger this alert, particularly during software updates or system maintenance. Companion detections, like unusual outbound network traffic or abnormal parent process executions, can enhance detection effectiveness across environments using RMM tools.

