note: |
  ### Technical Context

  This Sigma rule detects the execution of the ShowMyPC Remote Management and Monitoring (RMM) tool by monitoring process creation events where the parent or the command line contains ShowMyPC executable names. The primary attacker objective may include remote access and control of systems for data exfiltration, lateral movement, or compromise. The relevant MITRE ATT&CK tactic is **Execution** and technique **T1219: Remote Access Tools**. The primary telemetry sources are Windows Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. If this activity is malicious, it could lead to significant security risks such as unauthorized access to sensitive information and potential system manipulation. This detection does NOT confirm malicious intent by itself, as ShowMyPC may be legitimately used for remote support.

  ### Investigation Steps

  - **Review process creation logs for ShowMyPC execution:** Check Windows Security Event ID 4688 for process creation from `SMPCSetup.exe`, `showmypc*.exe`, or `smpcsetup.exe` in the command line, timestamped during the alert period.
  - **Analyze parent process relationships:** Examine the parent process for detected ShowMyPC executables. Legitimate executions might originate from known administrative tools or user interactions without unusual parent processes.
  - **Correlate with user context:** Determine the user account associated with the process. If executed by a high-privilege account during non-business hours, this raises suspicion.
  - **Identify uncommon command-line arguments:** Investigate Sysmon Event ID 1 for unusual arguments passed during the execution of ShowMyPC. Malicious usage may include flags aimed at evasion or further exploitation.
  - **Monitor connected sessions:** If possible, validate network connections initiated by the application (via logs from firewalls or network monitoring tools) to identify connections made to unfamiliar external IP addresses.
  - **Check for artifact creation:** Look for files or scripts created during the execution of ShowMyPC in common temporary or installation directories that may indicate unauthorized configuration changes or persistence mechanisms.

  ### Prioritization

  This alert has medium severity. While the affected system could be critical in an enterprise, the likelihood of a legitimate ShowMyPC use can lead to frequent benign alerts. However, the potential for misuse makes it a noteworthy detection, as remote access tools like ShowMyPC are often weaponized in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection limitations may arise from environments where ShowMyPC is accepted as a legitimate tool, as these instances can trigger alerts without malicious intent. Required log sources include the correct configuration of Windows Event logs, particularly for process creation. Legitimate remote support sessions may trigger this alert if ShowMyPC is in regular use. A related detection that strengthens coverage would be monitoring for unusual outbound network traffic from systems running ShowMyPC, which may indicate potential data exfiltration attempts.

