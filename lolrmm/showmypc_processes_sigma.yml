note: |
  ### Technical Context

  This rule detects the execution of the ShowMyPC remote management tool, which is commonly used for remote access and support tasks. The likely attacker objective behind using this tool would be to establish a command-and-control (C2) session, allowing for unauthorized access to a victim system. This corresponds to the MITRE ATT&CK technique T1219 (Remote Access Tools).

  The primary telemetry sources for this detection encompass Windows process creation logs, specifically leveraging Security Event ID 4688 and Sysmon Event ID 1 to monitor process activities. If malicious, the use of this tool could result in data exfiltration or manipulation. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as the tool may also be deployed for legitimate remote support activities.

  ### Investigation Steps

  - **Review recent process creations:** Check for Security Event ID 4688 or Sysmon Event ID 1 for processes with names ending in `SMPCSetup.exe`, `showmypc*.exe`, or `showmypc.exe` on the affected host. Look for unusual timing or system context.

  - **Analyze parent process relationships:** Investigate the parent process field in event logs to identify if the parent process is `SMPCSetup.exe` or any ShowMyPC executable. If these were initiated by a legitimate IT support process, that may indicate benign activity.

  - **Check network connections:** Review firewall or endpoint security logs for outbound connections made by the ShowMyPC process. Utilize network telemetry to inspect connection attempts for unusual external IPs or ports.

  - **Verify authorized usage:** Confirm whether the ShowMyPC tool is expected in your environment by checking if the host has a justified business need for remote support tools. Cross-reference installation records with IT asset management.

  - **Examine task scheduling and services:** Check for any scheduled tasks or services associated with ShowMyPC using Task Scheduler logs (Event IDs 106 and 101) to identify any persistent remote access configurations.

  - **Identify anomalous user behavior:** Track the users that executed the ShowMyPC process. If the process is executed by accounts lacking remote support responsibilities, this could indicate malicious use.

  ### Prioritization

  This alert has a medium severity due to the potential for unauthorized remote access which could compromise sensitive data. The likelihood of malicious abuse increases if the affected system possesses critical data or operational capabilities. ShowMyPC is not overly common in enterprise environments, making any detection warrant immediate investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the use of ShowMyPC for legitimate purposes, which may trigger false positives in environments where it is authorized. Effective monitoring requires correct configuration and logging of process creation events. Additionally, legitimate RMM usage may obscure actual malicious use, resulting in potential blind spots. An associated detection could include monitoring for other popular RMM tools as part of a broader assessment of remote access technologies used in the environment.

