note: |
  ### Technical Context
  This detection rule identifies potential misuse of the ShowMyPC Remote Management Tool (RMM) by monitoring process activities that are indicative of its execution on Windows systems within an enterprise environment. ShowMyPC is commonly used for remote access and support, making it a potential vector for unauthorized access by threat actors aiming to exploit system vulnerabilities or gain illegitimate control over systems. The presence of this tool initiated by unexpected users or processes may signal an adversary attempting to conduct reconnaissance, deploy malware, or facilitate lateral movement within a network.

  Relevant MITRE ATT&CK tactics and techniques associated with this rule include "Execution" (TA0002) and "Remote Services" (T1219). By leveraging ShowMyPC, an attacker may facilitate remote interaction with compromised devices, thereby heightening the risks associated with data exfiltration or system manipulation. The primary data sources for this detection rule consist of process creation events captured from Windows systems, which provide insights into newly spawned processes and their parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for any entries where the image path ends with "SMPCSetup.exe" or "showmypc*.exe," especially focusing on unusual parent processes that may indicate malicious activity.
  - **Audit User Activity:** Investigate the user accounts associated with the suspected process executions to determine if there are any unauthorized or unusually high-privilege users executing ShowMyPC.
  - **Assess Network Connections:** Analyze network traffic logs for any suspicious outbound or inbound connections associated with ShowMyPC's executed processes, which may indicate an active remote session being used for unauthorized activities.
  - **Conduct Threat Hunting:** Use threat hunting techniques to identify lateral movement or other suspicious behavior patterns linked to ShowMyPC usage within your environment.

  ### Prioritization
  The severity of this alert is considered medium due to the legitimate use cases for ShowMyPC within organizations, yet it signals potentially serious intentions if detected unexpectedly. Unauthorized access through remote management tools can lead to significant data breaches or system compromise, making prompt investigation critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for modified or renamed ShowMyPC executables, which could evade straightforward detection. The rule assumes that all Process Creation logs are enabled and accessible, allowing for timely identification of suspicious activities. If the logging level for process creation events is not adequately configured, the alert may not function as intended, leading to missed detections of potentially harmful incidents.

