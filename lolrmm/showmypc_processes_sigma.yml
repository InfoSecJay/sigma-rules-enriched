  ---

  ### Technical Context

  This rule detects the execution of the ShowMyPC remote management tool, which may be used by attackers for unauthorized access to systems. The likely attacker objective is to establish remote control over a victim's machine, facilitating data exfiltration, system manipulation, or further exploitation. This activity aligns with the MITRE ATT&CK technique **Remote Access Software (T1219)**.

  Primary telemetry sources include Windows process creation logs, particularly Security Event ID **4688** and Sysmon Event ID **1**. If used maliciously, this tool can lead to significant security impacts, including unauthorized system access and data breaches. However, this detection does NOT confirm malicious intent on its own, as the tool can also be employed for legitimate remote support activities.

  ---

  ### Investigation Steps

  - **Check recent process execution logs:** Query Security Event ID **4688** and Sysmon Event ID **1** to identify recent instances of processes related to ShowMyPC (e.g., *SMPCSetup.exe*, *showmypc.exe*). Look for unusual execution times or on systems that should not be running remote access tools.

  - **Inspect parent process relationships:** Determine the parent process of the detected ShowMyPC entries by analyzing the ParentImage field. Legitimate usage typically stems from known IT support personnel or scheduled maintenance processes.

  - **Review user accounts associated with activity:** Identify user accounts that executed the ShowMyPC processes; validate their legitimacy. Look for accounts exhibiting unusual privileges or lack of historical use of remote access tools.

  - **Evaluate network connections for anomalies:** Cross-reference process logs with network logs to identify outbound connections established by ShowMyPC. Focus on unusual external IP addresses or high-risk geolocations to detect potential malicious usage.

  - **Conduct artifact validation:** Review any related data artifacts including remote access logs or session initiation events to confirm the usage context. Validate that the tool's expected legitimate configuration demonstrates compliance with company policies.

  - **Identify patterns of misuse:** Compare the identified ShowMyPC instances against historical baseline data for remote access tool usage within your environment, highlighting any deviations that might indicate malicious activity.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact on critical systems if the ShowMyPC tool is misused. While legitimate remote access tools are frequently weaponized for unauthorized system control, the context of this specific detection requires further investigation to rule out benign use cases.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of ShowMyPC in the environment, which can lead to false positives. Reliable detection requires meticulous logging configuration to capture all relevant process execution events. Other remote access tools may also trigger similar alerts, underscoring the need for companion detections focused on alternative software (e.g., TeamViewer, AnyDesk) that could indicate a broader risk profile.

