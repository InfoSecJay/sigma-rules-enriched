note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the SetMe PRO remote monitoring and management (RMM) tool. The behavior observed suggests the potential use of this software either for legitimate IT management or malicious purposes, such as unauthorized access or control over compromised systems. The likely attacker objective is to establish command-and-control (C2) communication or maintain persistence within the target environment. Relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Application Layer Protocol (T1203). The primary telemetry source is Windows network connection logs, specifically monitoring for DNS queries or outbound connections to defined SetMe PRO domains. If this behavior is malicious, it could represent unauthorized access, data exfiltration, or lateral movement within a network. Importantly, this detection does NOT confirm that all connections to SetMe PRO domains are malicious; legitimate use cases exist.

  ### Investigation Steps

  - **Review outbound connections:** Check for Windows network connection logs (Event ID 5156) for connections made to *.set.me domains. Note whether these connections are made from systems that do not typically use RMM tools.

  - **Identify legitimate usage:** Validate if the system making the connection has a documented use case for SetMe PRO (e.g., an IT support workstation). Cross-check asset inventories for software installations tied to this domain.

  - **Assess connection timing:** Look at the timestamps of the connections to see if they coincide with anomalous user activities or unusual business hours, which might indicate malicious usage.

  - **Analyze process execution:** Investigate the parent process ID of the network connections using Sysmon Event ID 3. Look for known Windows management tools or any unknown processes that could indicate compromise.

  - **Check for multiple connections:** Identify if there are multiple network connections to SetMe PRO domains from various endpoints. A significant number of different endpoints pointing to the same domains can suggest widespread exploitation.

  - **Review DNS queries:** Examine DNS query logs for the SetMe PRO domains (Log type: DNS logs). Look out for high-resolution queries, which might denote active exploitation attempts by adversaries.

  ### Prioritization

  The alert is of medium severity because it indicates potential use of a tool commonly leveraged for both legitimate IT management and malicious activities. The presence of SetMe PRO communications on key assets increases the likelihood of threat exploitation, as it is often weaponized in targeted attacks against organizations with insufficient monitoring.

  ### Blind Spots and Assumptions

  Detection may miss communications disguised as legitimate traffic if attackers use legitimate SetMe PRO for nefarious purposes. This rule assumes adequate logging of network connections to properly capture relevant communication. Legitimate enterprise use of RMM tools may trigger false positives. A companion detection to consider includes monitoring for anomalous internal server connections to ensure that internal threats are also evaluated.

