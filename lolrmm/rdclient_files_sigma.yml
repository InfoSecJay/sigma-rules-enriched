note: |
  ### Technical Context

  This rule detects potential file activity associated with the RdClient Remote Monitoring and Management (RMM) tool. The likely attacker objective could involve unauthorized access, data exfiltration, or manipulation of system files to assist in lateral movement within the network. This behavior relates to the MITRE ATT&CK technique T1219 (Remote Access Software). The primary telemetry sources are Windows file event logs, specifically looking for changes or access patterns in directories ending with `%APPDATA%\RdClient\*`. If this activity is confirmed as malicious, it could facilitate unauthorized control over a target system or lead to data breaches. Importantly, this detection does NOT confirm malicious intent without further context or corroborating evidence.

  ### Investigation Steps

  - **Check file access logs:** Review Windows Security Event ID 4663 for file access attempts targeting `%APPDATA%\RdClient\*`. Typical benign activities may include frequent file modifications or access by legitimate user accounts during designated maintenance windows.

  - **Identify unusual file creation or modification:** Examine Windows Security Event ID 4660 or Sysmon Event ID 11 for file creation data within `%APPDATA%\RdClient\`. Malicious indicators include unexpected timestamps or file types that deviate from standard usage.

  - **Analyze process creation linked to file access:** Review Sysmon Event ID 1 and correlating Event ID 4688 for processes that interact with `%APPDATA%\RdClient\*`. Look for processes initiated by unexpected users or accounts, especially those not typically associated with administrative tasks.

  - **Investigate user and group account behavior:** Confirm the legitimacy of the user account accessing or modifying files in the RdClient directory. Normal behavior usually involves known administrative accounts under specific operational conditions.

  - **Correlate with network activity:** If available, analyze network logs for outgoing connections that correlate with access to `%APPDATA%\RdClient\*`. Look for connections to external IPs or unusual destinations that are not related to standard operational procedures.

  ### Prioritization

  The alert has medium severity due to the potential impact on affected workstations, which may serve critical roles in administration or sensitive data processing. Malicious use of RMM tools is a common tactic for attackers, increasing the likelihood of abuse in enterprise environments. Escalation is essential if corroborative malicious indicators are present.

  ### Blind Spots and Assumptions

  This detection could be evaded through legitimate use of RMM tools, making it crucial to consider context and account histories. Required log sources include complete Windows file event logging and Sysmon configuration tailored for in-depth tracking. Legitimate activities, such as scheduled maintenance by IT teams, may trigger the alert. Companion detections, such as monitoring for remote login events (T1071), can help strengthen overall coverage and provide broader visibility into potential lateral movement activities.

