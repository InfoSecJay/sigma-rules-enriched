note: |
  ### Technical Context

  This Sigma rule detects potential file activity associated with the RdClient Remote Monitoring and Management (RMM) tool. The likely objective of an attacker using this tool would be to establish persistent access, facilitate unauthorized remote control, or exfiltrate sensitive data. This behavior is aligned with the MITRE ATT&CK tactic *Command and Control* (TA0011) and specifically the technique *Standard Application Layer Protocol* (T1219).

  The primary telemetry source for this detection is Windows file system events, specifically monitoring for file activity in the `%APPDATA%\RdClient\` directory. If malicious, this activity could enable significant security risks, including unauthorized access to user systems and potential lateral movement within the network. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of the RdClient tool for remote administration can trigger the same alerts.

  ### Investigation Steps

  - **Check file creation timestamps:** Review any file creation events in Event ID 4663 associated with the `%APPDATA%\RdClient\` directory for timestamps that align with user activity or account logins. Legitimate activity may show regular usage patterns corresponding to user access.

  - **Identify process execution:** Monitor for Windows Security Event ID 4688 that logs process creation. Specifically, look for processes associated with the RdClient application executing in conjunction with the file activity. Malicious indicators include unusual execution at odd hours or from non-administrative accounts.

  - **Examine user account activity:** Use Security Event IDs 4624 and 4647 to review logins and logoffs of the user accounts that accessed the RdClient directory. Repeated or unexpected logins may suggest unauthorized access.

  - **Validate file integrity:** Investigate whether files in `%APPDATA%\RdClient\` are modified, created, or deleted in Event ID 4663. Malicious activity may include unexpected changes or the dropping of unauthorized executables.

  - **Correlate with network activity:** Analyze network logs from a firewall or proxy for connections made to known bad IPs or domains following file activity. Specific focus should be on whether remote connections correlate with timestamps of filesystem changes.

  ### Prioritization

  The severity of this alert is medium, primarily due to the risk posed to affected systems, particularly if the RdClient tool is being misused for unauthorized access. The likelihood of abuse is moderate given that the RMM tools can be weaponized for remote access by threat actors. However, this behavior may also be seen in legitimate administrative tasks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may rename or obscure the RdClient files. The alert solely relies on file events and could miss other indicators of compromise. Additionally, normal administrative activity using remote tools could trigger this detection. A companion detection is monitoring outbound connections for anomalies, which can provide further context around the use of RMM tools within the environment.

